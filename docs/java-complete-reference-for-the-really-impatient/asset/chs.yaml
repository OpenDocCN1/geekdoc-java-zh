  test.dat\");\n        PrintStream ps = new PrintStream(fout, true);\n        ps.println(\"\
  This is a string\");\n        int i = -7;\n        ps.println(i);\n        double\
  \ d = 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n\n### PrintWriter\n\n虽然在 Java\
  \ 中仍然允许使用 `System.out` 写入控制台，但其使用主要推荐用于调试或示例程序。\n\n对于真实世界的程序，使用 Java 向控制台输出的推荐方法是通过\
  \ `PrintWriter` 流。`PrintWriter` 是基于字符的类之一。使用基于字符的类进行控制台输出可以让程序的国际化变得更容易。\n\n###\
  \ 构造函数：\n\n- `PrintWriter(File file)`：创建一个新的用于指定文件的 `PrintWriter`，不进行自动行刷新。\n- `PrintWriter(String\
  \ fileName)`：创建一个新的用于指定文件名的 `PrintWriter`，不进行自动行刷新。\n- `PrintWriter(OutputStream\
  \ out)`：创建一个新的用于指定 `OutputStream` 的 `PrintWriter`，不进行自动行刷新。\n- `PrintWriter(OutputStream\
  \ out, boolean autoFlush)`：创建一个用于写入指定 `OutputStream` 的 `PrintWriter`。\n- `PrintWriter(Writer\
  \ out)`：创建一个新的写入指定 `Writer` 的 `PrintWriter`，不进行自动行刷新。\n- `PrintWriter(Writer out,\
  \ Boolean autoFlush)`：创建一个用于写入指定 `Writer` 的 `PrintWriter`。\n\n最常用的构造函数是：\n`PrintWriter(OutputStream\
  \ os, boolean flushOnNewLine)`\n\n在这里，`os` 是 `OutputStream` 类型的对象，`flushOnNewLine`\
  \ 控制 Java 在每次调用 `println()` 方法时是否刷新输出流。如果 `flushOnNewLine` 为 `true`，则会自动进行刷新。如果为\
  \ `false`，则不自动刷新。\n\n`PrintWriter` 支持针对所有类型（包括对象）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter`\
  \ 方法将调用对象的 `toString()` 方法并打印结果。\n\n要使用 `PrintWriter` 写入控制台，请指定 `System.out` 为输出流，并在每新行后刷新流。例如，这行代码创建一个连接到控制台的\
  \ `PrintWriter`：\n`pw = new PrintWriter(System.out, true)`\n\n### 示例 15.16\n\n```java\n\
