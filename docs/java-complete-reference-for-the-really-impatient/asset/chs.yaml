  \      f.add(b1);f.add(b2);\n      f.setVisible(true);\n    }\n  public void actionPerformed(ActionEvent\
  \ ae)\n    {\n      int a,b,c;\n      float av;\n      a=Integer.parseInt(tf1.getText());\n\
