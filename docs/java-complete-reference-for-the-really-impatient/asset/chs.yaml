  \n**注意：** 如果尝试在文件末尾之后读取，则会发生 `EOFException`。\n\n### ByteArrayInputStream\n`ByteArrayInputStream`\
  \ 包含一个内部缓冲区，可以从该流进行读取。`ByteArrayInputStream` 是一个使用字节数组作为数据源的输入流实现。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据源。`ByteArrayInputStream`\
  \ 实现了 `mark()` 和 `reset()` 方法。但是，如果没有调用过 `mark()`，`reset()` 将流指针重置为流起点。\n\n```java\n\
  public ByteArrayInputStream(byte[]);\npublic ByteArrayInputStream(byte[], int);\n\
  public synchronized int read();\npublic synchronized int read(byte[], int);\npublic\
  \ synchronized long skip(long);\npublic synchronized int available();\npublic boolean\
  \ markSupported();\npublic void mark(int);\npublic synchronized void reset();\n\
  public void close() throws IOException;\n```\n\n### Example 15.7\n\n```java\nimport\
  \ java.io.*;\nclass ByteArrayInputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        String s1 = \"abcdefghijk\";\n        byte\
  \ b[] = s1.getBytes();\n        ByteArrayInputStream b1 = new ByteArrayInputStream(b);\n\
  \        int a;\n        while((a=b1.read()) != -1) {\n            System.out.print((char)Character.toUpperCase(a));\n\
  \        }\n        b1.close();\n    }\n}\n```\n**输出：**\n```text\nABCDEFGHIJK\n\
  ```\n\n### ByteArrayOutputStream\n`ByteArrayOutputStream` 实现了一个输出流，数据被写入字节数组中。`ByteArrayOutputStream`\
  \ 是一个使用字节数组作为目的地的输出流实现。缓冲区存储在 `ByteArrayOutputStream` 的 `buf` 字段中。如果需要，缓冲区的大小将增大。缓冲区持有的字节数包含在\
  \ `ByteArrayOutputStream` 的 `count` 字段中。\n\n```java\npublic java.io.ByteArrayOutputStream();\
  \ // 创建一个新的字节数组输出流。初始容量为 32 字节，但在必要时会增大。\npublic java.io.ByteArrayOutputStream(int);\
