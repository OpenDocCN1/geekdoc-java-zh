  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 19 ∞\n\n## (在 AWT 中绘图)\n\n###\
  \ 简介\n\n许多类型的 AWT 组件（例如按钮和滚动条）其外观由底层的窗口系统决定。其他组件类型，特别是 applet（小程序）、frame（窗口）、panel（面板）和\
  \ canvas（画布），没有内在的外观。如果我们将这些类仅仅用作容器，并希望我们的组件看起来尽可能有用，那么我们必须提供实现组件外观的代码。\n\n每个组件都关联着一个图形上下文（graphics\
  \ context）。图形上下文对应于组件相关的帧缓冲区。\n\n我们可以使用图形上下文支持的方法在组件上进行绘图。在图形上下文上绘制的任何内容都会显示在组件上。\n\
  \n在任何组件上绘图的正确方法是重写它的 `paint()` 方法并提供相应的代码。\n\n`paint()` 方法有一个类型为 `Graphics` 的参数，代表组件的图形上下文。也可以在不使用\
  \ `paint()` 方法的情况下在组件上进行绘图，尽管这种方法并不推荐。\n\n### `paint()` 方法与图形上下文\n\n在以下示例中，关于窗口的一个有趣点是，没有显式地调用\
  \ `paint()` 方法；该方法只是被提供了。环境似乎在正确的时刻调用 `paint()` 方面做得很好。\n\n在组件上绘图是通过调用图形上下文来实现的，图形上下文是\
  \ `Graphics` 类的一个实例。图形上下文知道如何渲染到单个目标上。图形上下文可以渲染到的三种媒介是：\n\n1. 组件。\n2. 图像。\n3. 打印机。\n\
  \n任何种类的组件都可以与图形上下文相关联。这种关联是永久的；上下文无法重新分配给新的组件。虽然我们可以使用图形上下文在任何类型的组件上进行绘图，但对于已经具有外观的组件这样做是不寻常的。\n\
  \n按钮、选择框、复选框、标签、滚动条、文本字段和文本区域通常不需要程序员层面的渲染。大多数情况下，这些组件仅使用从组件父类中继承的 `paint()` 版本。\n\
  \n此版本什么都不做；组件由底层的窗口系统进行渲染。然而，有四类“空白”组件，它们没有默认外观，除非它们被子类化并赋予 `paint()` 方法，否则它们将显示为空矩形。\n\
  \n这四个组件类是：\n\n* Applet.\n* Canvas.\n* Frame.\n* Panel.\n\n示例 19.1 扩展了 `Frame` 类并重写\
  \ `paint()` 方法以改变窗口的外观。\n\n```java\nimport java.awt.*;\npublic class SimplePaint\
  \ extends Frame\n{\n    public static void main (String args[])\n    {\n      Frame\
  \ f=new SimplePaint();\n      f.setSize(200,200);\n      f.setVisible(true);\n \
  \   }\n    public void paint (Graphics g)\n    {\n      g.setColor(Color.white);\n\
  \      g.fillRect(0,0,300,300);\n      g.setColor(Color.grey);\n      g.fillOval(30,30,50,50);\n\
  \    }\n}\n```\n\n输出：\n![image](img/image051.png)\n\n当我们子类化组件类并赋予子类它自己的 `paint()`\
  \ 方法时，环境会在适当的时间调用该方法，并传入一个适当的 `Graphics` 实例。\n\n### graphics 类的操作\n\n`graphics`\
  \ 类（图形上下文）提供的四类主要操作是：\n\n* 选择颜色。\n* 选择字体。\n* 绘制和填充。\n* 裁剪（Clipping）。\n\n### 选择颜色\n\
  \n通过调用 `setColor()` 方法来选择颜色。`setColor()` 参数是 `Color` 类的一个实例。有 13 种预定义的颜色可用：\n\n\
  1. black（黑色）\n2. blue（蓝色）\n3. cyan（青色）\n4. darkGray（深灰色）\n5. gray（灰色）\n6. green（绿色）\n\
  7. lightGray（浅灰色）\n8. magenta（洋红色）\n9. orange（橙色）\n10. red（红色）\n11. white（白色）\n\
  12. yellow（黄色）\n13. yellow（黄色）\n\n如果我们需要列表之外的颜色，可以使用 `Color(int red, int green,\
  \ int blue)` 构造自己的颜色。参数范围从 0 到 255。\n\n```java\npublic void paint(Graphics g)\n\
  {\n  Color c = new Color(170,255,170);\n  g.setColor(c);\n}\n```\n\n### 选择字体\n\n\
  设置图形上下文的字体就像设置颜色；后续操作将使用该字体。在设置字体之前，我们必须先创建一个。`Font` 的构造函数如下：\n\n`Font(String fontName,\
  \ int style, int size)`\n\n第一个参数是字体名称；可用性取决于平台。我们可以通过对 toolkit 调用 `getFontList()`\
  \ 获取可用字体名称列表：\n\n```java\nString fontNames[] = Toolkit.getDefaultToolkit().getFontList();\n\
  ```\n\n有三个平台无关的字体，建议使用：\n\n* Serif（衬线字体）\n* Sansserif（无衬线字体）\n* Monospaced（等宽字体）\n\
  \n在 JDK 的 1.0.X 版本中，这些被称为“TimesRoman”、“Helvetica”和“Courier”。样式参数可以是以下任何常量：\n\n*\
  \ Font.PLAIN（标准）\n* Font.BOLD（粗体）\n* Font.ITALIC（斜体）\n\n我们可以通过传递样式的和来指定样式组合，例如粗体斜体字体：\n\
  \n```java\nFont f = new Font(\"SansSerif\", Font.BOLD + Font.ITALIC, 24);\ngc.setFont(f);\n\
  ```\n\n### 绘制和填充\n\n`graphics` 类所有的渲染方法都为它们渲染的形状指定了像素坐标位置。每个组件都有自己的坐标空间，原点位于组件的左上角，x\
  \ 向右增加，y 向下增加。\n\n我们需要了解的 `graphics` 类中的方法有：\n\n* `void drawLine(int x1,int y1,\
  \ int x2, int y2)`：使用当前颜色，在图形上下文坐标系中的点 `(x1,y1)` 和 `(x2, y2)` 之间绘制一条线。\n* `void\
  \ drawRect(int x, int y, int width, int height)`：绘制指定矩形的轮廓。\n* `void fillRect(int\
  \ x, int y, int width, int height)`：填充指定的矩形。\n\n\n\n\n\n| `void drawOval(int x,\
  \ int y, int width, int height)` | 绘制由指定矩形边界的椭圆轮廓。 |\n| `void fillOval(int x, int\
  \ y, int width, int height)` | 用当前颜色填充指定矩形边界的椭圆。椭圆由一个矩形边界框指定。椭圆位于边界框内，并与框的每个侧边的中点相切，如下所示：若要绘制圆形，请使用正方形边界框。请注意，绘画只绘制前景像素，不绘制背景，因此边界框内但椭圆以外的空间将保持不变。这里，`x`\
  \ 和 `y` 是边界框左上角的坐标，`width` 和 `height` 是框的宽度和高度。 |\n| `void drawArc(int x, int y,\
  \ int width, int height, int startAngle, int arcAngle)` | 绘制覆盖指定矩形的圆形或椭圆弧的轮廓。 |\n\
  | `void fillArc(int x, int y, int width, int height, int startangle, int arcangle)`\
  \ | 填充覆盖指定矩形的圆形或椭圆弧。弧是椭圆的一个片段。要指定一个弧，我们首先指定椭圆的边界框，就像使用 `drawOval()` 和 `fillOval()`\
  \ 一样。我们还需要指定弧的起点和终点，通过指定起始角度和弧扫过的角度来实现。填充的弧是由弧本身以及从椭圆中心到弧端点的两个半径所包围的区域。 |\n| `void\
  \ drawPolygon(int[] xPoints, int[] yPoints, int nPoints)` | 绘制由 x 和 y 坐标数组定义的闭合多边形。\
  \ |\n| `void fillPolygon (int[] xPoints, int[] yPoints, int nPoints)` | 填充由 x 和\
  \ y 坐标数组定义的闭合多边形。多边形具有任意数量顶点的封闭图形。顶点以两个 int 数组的形式传递 `drawPolygon()` 和 `fillPolygon()`\
  \ 方法。第一个数组包含顶点的 x 坐标，第二个数组包含 y 坐标。第三个参数指定顶点数量。注意：终点与第一个点连接。 |\n| `void drawPolyLine(int[]\
  \ xPoints, int[] yPoints, int nPoints)` | 绘制由 x 和 y 坐标数组定义的一系列连接线。折线类似于多边形，但它是开放的而非闭合的。没有线段连接最后一个顶点和第一个顶点。\
  \ |\n| `void drawString(String str, int x, int y)` | 使用此图形上下文的当前字体和颜色绘制指定字符串给出的文本。`x`、`y`\
  \ 参数指定字符串基线的左边缘。带有下降部（descenders）的字符（大多数字体中为 g, j, p, q 和 y）延伸到基线以下。文本坐标相对于基线这一事实非常重要。例如，在简单文本中，我们可能会尝试在\
  \ (0,0) 处绘制字符串，并期望它出现在空间的左上角。然而，由于基线的存在，我们只能看到字符串的下降部，这可能意味着我们什么也看不见。默认情况下，图形上下文使用与关联组件的字体，但我们可以通过调用图形上下文的\
  \ `setFont()` 方法设置不同的字体。 |\n| `boolean drawImage (Image img, int x, int y, ImageObserver\
  \ observer)` | 绘制尽可能可用的指定图像。这里，`im` 是要渲染的图像，`x` 和 `y` 是目标组件内图像左上角的坐标。图像观察者必须是一个实现\
  \ `imageobserver` 接口的对象。图像是矩形像素值集合的离屏表示。Java 的图像支持非常复杂。目前，假设我们通过某种方式获得了一个图像（即 `java.awt.image`\
  \ 类的实例），我们想要使用特定的图形上下文将其渲染到屏幕上。这样做的方法是调用图形上下文的 `drawImage()` 方法。 |\n\n### 示例 19.2\n\
  \n此示例说明了如何创建一个图像，然后使用其图形上下文在其上绘制。然后可以使用 `drawImage()` 方法在 applet 窗口中显示该图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*<applet code=\"\
  PaintImage\" width=200 height=100></applet>*/\npublic class PaintImage extends Applet\
  \ {\n    private Image im;\n    public void init() {\n      im = createImage(100,50);\n\
  \      Graphics imgc=im.getGraphics();\n      imgc.setColor(Color.gray);\n     \
  \ imgc.fillRect(0,0,100,50);\n      imgc.setColor(Color.black);\n      imgc.fillOval(0,0,50,40);\n\
  \    }\n    public void paint(Graphics g) {\n      g.drawImage(im,10,10,this);\n\
  \    }\n}\n```\n\n输出：\n![image](img/image13.png)\n\n### 示例 19.3\n\n此示例说明了如何从现有图像创建一个图像对象。然后可以使用\
  \ `drawImage()` 方法在 applet 窗口中显示该图像。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.net.*;\n/*\n<applet code=\"PaintImage\" width=50 height=500>\n</applet>\n\
  */\npublic class Paint1 extends Applet {\n    private Image im;\n    public void\
  \ init() {\n      try {\n        im=getImage(new URL(\"file:logo.gif\"));\n    \
  \  } catch (URLException e) {\n        System.out.println(e);\n      }\n    }\n\
  \    public void paint(Graphics g) {\n      g.drawImage(im,10,10,this);\n    }\n\
  }\n```\n\n### 裁剪\n\n大多数程序员对图形上下文的调用都涉及颜色选择、绘制和填充。一种不常用的操作是裁剪。裁剪简单地限制了图形上下文可以修改的区域。图形上下文的默认裁剪区域是关联组件的可见区域。当我们需要修改部分区域时，可以使用裁剪。考虑以下\
  \ paint 方法。\n\n### 示例 19.4\n\n```java\nimport java.awt.*;\nclass Clip extends Frame\
  \ {\n    public static void main(String args[]) {\n      Frame f=new Clip();\n \
  \     f.setSize(300,330);\n      f.setVisible(true);\n    }\n    public void paint(Graphics\
  \ g) {\n      for(int i=0; i<300; i+=100) {\n        for(int j=30; j<330; j+=100)\
  \ {\n          g.fillOval(i,j,100,100);\n        }\n      }\n    }\n}\n```\n\n输出：\n\
  ![image](img/image47.png)\n\n上述程序的 `paint()` 方法绘制了一个点状图案。考虑当这个 `paint()` 方法位于一个\
  \ 200 * 200 像素的 applet/frame 时会发生什么。由于循环计数器达到 500，方法尝试在 applet/frame 的边界之外绘制。这不是问题，因为图形上下文的默认裁剪区域与\
  \ applet/frame 本体一致。要为图形上下文设置矩形裁剪区域，我们可以调用 `setClip(x,y, width, height)` 方法，传入描述所需裁剪矩形位置和大小的四个整数。例如，上面的代码可以修改为：\n\
  \n### 示例 19.5\n\n```java\nimport java.awt.*;\nclass Clip2 extends Frame {\n    public\
  \ static void main(String args[]) {\n      Frame f=new Clip2();\n      f.setSize(300,330);\n\
  \      f.setVisible(true);\n    }\n    public void paint(Graphics g) {\n      g.setClip(50,80,200,200);\n\
  \      for(int i=0; i<300; i+=100) {\n        for(int j=30; j<330; j+=100) {\n \
  \         g.fillOval(i,j,100,100);\n        }\n      }\n      g.drawString (\"Hello!\
  \ Kamal\", 50,50);\n    }\n}\n```\n\n\n\n\n\n```java\n21. g.drawString (\"Bye! Kamal\"\
  , 120,150);\n22. } }\n```\n\n输出：\n![image](img/image040.png)\n\n如上所示，现在的绘制被限制在 300\
  \ * 300 applet 框架中心的一个 200 * 200 矩形内。\n\n裁剪（Clipping）本身是一项值得了解的知识。当环境需要修复组件的暴露部分时，裁剪也会派上用场。\n\
  \n### 关于 `paint()` 方法和图形上下文的总结\n\n`Graphics` 上下文专门用于单个组件。为了在组件上进行绘制，我们调用图形上下文的 `drawXXXX()`\
  \ 和 `fillXXXX()` 方法。要更改图形操作的颜色或字体，我们分别调用图形上下文的 `setColor()` 或 `setFont()` 方法。\n\n\
  ### GUI 线程与绘制\n\nJava 运行时环境会创建并控制其在后台运行的线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接受用户输入事件以及调用需要绘制的组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并非都由环境生成。Java 程序当然可以自己调用，直接调用或通过 `repaint()`\
  \ 方法间接调用。\n\n可以使用组件的图形上下文在组件上进行绘制。在这种方法中，不需要调用 `paint()` 或 `repaint()` 方法。\n\n在组件上进行绘制的不同方法如下：\n\
  \n(i) 获取组件的 `Graphics` 上下文后直接绘制。\n(ii) 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）。\n(iii)\
  \ 显式调用 `paint()` 方法。\n(iv) 显式调用 `repaint()` 方法，然后由其间接调用 `paint()` 方法。\n\n### 在获取组件的图形上下文后直接绘制\n\
  \n由于可以使用 `getGraphics()` 方法获取组件 `Graphics` 上下文的引用，因此人们很容易认为自己可以从任何方便的方法直接在组件上绘制。通常情况下，这种方法存在严重缺陷。\n\
  \n假设我们有一个 applet，想要在最近一次鼠标点击的位置画一个红点。applet 的其余部分应该是黄色。假设该 applet 正在处理它自己的鼠标事件。我们可能会创建一个如下的事件处理器：\n\
  \n示例 19.6：\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass PaintApproach\
  \ extends Frame implements MouseListener\n{\n    public static void main (String\
  \ args[]) {\n        PaintApproach f = new PaintApproach ();\n        f.setSize\
  \ (300,300);\n        f.addMouseListener(f);\n        f.setVisible(true);\n    }\n\
  \    public void mouseEntered (MouseEvent e) { }\n    public void mouseExited (MouseEvent\
  \ e) { }\n    public void mousePressed (MouseEvent e) { }\n    public void mouseReleased\
  \ (MouseEvent e) { }\n    public void mouseClicked (MouseEvent e) {\n        System.out.println\
  \ (\"Mouse Clicked...\");\n        Graphics g = getGraphics();\n        g.setColor(Color.yellow);\n\
  \        g.fillRect(0,0, getSize().width, getSize().height);\n        g.setColor(Color.Red);\n\
  \        g.fillOval(e.getX()-10, e.getY()-10,20,20);\n    }\n}\n```\n\n如果这个 applet\
  \ 被覆盖并重新暴露，GUI 线程将隐式地调用 `paint()`；遗憾的是，`paint()` 并不知道在 `mouseClicked()` 方法中绘制的红圆，因此红圆不会被修复。\n\
  \n所有绘制操作的正确位置是在 `paint()` 中，或者在从 `paint()`set 的方法中；这种技术确保了 GUI 线程能够修复暴露带来的损坏。GUI\
  \ 线程期望 `paint()` 能够在任何任意时刻正确地重建屏幕。\n\n实现这一点的一种可能方法是从事件处理器和其他其他任意方法中移除所有绘制代码，并将这些代码放入\
  \ `paint()` 方法中。接下来，当某个方法需要绘制时，安排它写入描述所需绘制内容的变量，以便这些变量可以被 `paint()` 方法访问并被 `paint()`\
  \ 方法用于执行绘制。\n\n现在，当 `paint()` 方法被调用时（无论是通过我们的通用方法还是通过 GUI 线程），它都可以绘制原始意图任何内容。\n\n\
  ### 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）\n\n“自发绘制”并不是一个正式术语，但当 GUI 线程调用 `paint()`\
  \ 时就会发生。例如，当组件暴露、applet 启动或窗口恢复时会发生。GUI 线程确保设置为暴露区域的裁剪区域可以确保不会浪费时间去绘制已经是正确颜色的像素。\n\
  \n### 显式调用 `paint()` 方法\n\n如果在 `paint()` 方法以外的方法进行绘制，组件可能不会刷新。如果我们在 GUI 线程调用 `paint()`\
  \ 方法的同时也显式地调用 `paint()` 方法，那么上一节中的示例将经过修改，使得组件在上述情况下得到刷新。这种发生是因为红点是在 `paint()` 方法中绘制的。\n\
  \n示例 19.7：\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass PaintApproach1\
  \ extends Frame implements MouseListener\n{\n    int mouseX, mouseY;\n    public\
  \ static void main (String arg[]) {\n        PaintApproach1 f = new PaintApproach\
  \ ();\n        f.setSize (300,300);\n        f.addMouseListener(f);\n        f.setVisible(true);\n\
  \    }\n    public void mouseEntered (MouseEvent e) { }\n    public void mouseExited\
  \ (MouseEvent e) { }\n    public void mousePressed (MouseEvent e) { }\n    public\
  \ void mouseReleased (MouseEvent e) { }\n    public void mouseClicked (MouseEvent\
  \ e) {\n        System.out.println (\"Mouse Clicked...\");\n        mouseX = e.getX();\n\
  \        mouseY = e.getY();\n        Graphics g = getGraphics();\n        paint(g);\n\
  \    }\n    public void paint(Graphics g) {\n        g.setColor(Color.yellow);\n\
  \        g.fillRect(0,0, getSize().width, getSize().height);\n        g.setColor(Color.Red);\n\
  \        g.fillOval(mouseX-10, mouseY-10,20,20);\n    }\n}\n```\n\n\n\n\n\n```java\n\
  public void paint (Graphics g)\n{ \n  g.setColor (Color.yellow);\n  g.fillRect(0,0,\
  \ getSize( ).width, getSize( ).height);\n  g.setColor(Color.red);\n  g.fillOval(mouseX–10,mouseY–10,20,20);\n\
  }\n```\n\n显式调用 `repaint()` 方法，该方法随后会间接调用 `paint()` 方法：\n\n显式调用 `paint()` 方法可能会导致两个严重问题。\n\
  \n第一个问题是 GUI 线程会在需要的时候随时调用 `paint()` 方法。这发生在需要处理暴露（exposure）时。这可能会导致线程交互问题。\n\n\
  公平地说，我们会发现即使在使用首选的方法，我们可能需要处理这些中的某些问题，因为 `paint()` 方法将使用我们在其他线程中正在修改的数据。然而，如果我们允许\
  \ `paint()` 只在 GUI 线程中被调用，就能将问题降到最低。\n\n第二个问题是 CPU 使用率问题。考虑以下场景：我们的程序定期收到通知，要求它用动画的下一帧或类似的连续移动图形更新显示器。\n\
  \n假设绘图是复杂且耗时的。如果我们简单地调用整个 `paint()` 方法，那么当帧触发发生时，我们可能只完成了绘图的一部分。\n\n这将导致我们的程序花费（或尝试花费）其所有时间在绘图上。此外，绘图将进一步落后于它应该的位置。\n\
  \n这些问题可以通过使用首选的处理程序启动绘图的方法简单地解决。该思想是主程序维护一个描述应呈现给用户的绘图的数据集，但不直接调用绘图程序。\n\n相反，程序请求\
  \ GUI 线程运行绘图程序，其方式与该线程在处理暴露时的方式大致相同。\n\nGUI 线程使用主程序提供的数据集来决定绘制什么以及如何绘制。\n\n为了支持这种方法，GUI\
  \ 系统提供了一个名为 `repaint()` 的方法。该方法定义在 `Component` 类中，因此 GUI 中的任何可见对象都可以使用该方法。当我们调用此方法时，我们是在向\
  \ GUI 线程发出一个请求，让它执行绘图系统程序。\n\nGUI 线程会在合理的时间范围内执行操作，尽管这可能会受到其他高优先级线程活动的限制。这种方法确保了\
  \ GUI 线程与用户线程之间的线程交互降至最低。\n\n自然，我们必须确保在数据处于不一致状态时，GUI 线程永远不会使用我们的数据集。然而，可以使用同步或双缓冲技术很容易地实现这一点。\n\
  \n这种行为的另一个结果是，无论程序尝试进行多少绘图，系统通常保持与当前帧的同步。\n\n这是因为例如，如果我们在 GUI 线程能够处理第一次调用之前，我们调用了十次\
  \ `repaint()` 方法，那么结果将是只执行一次绘图系统程序。\n\n因此，在过载的情况下，绘图系统会自动跳过主机 CPU 根本无法处理的帧。这意味着程序员可以编写代码，在给定平台上可靠地获得最佳视频性能，同时在任何其他平台上都能良好地运行。下面的代码实现了这种方案。\n\
  \n### 示例 19.8:\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\npublic\
  \ class PaintApproach2 extends Frame implements MouseListener\n{ \n  int mouseX,\
  \ MouseY;\n  public static void main (String args [])\n  { \n    PaintApproach2\
  \ f = new PaintApproach2();\n    f.setSize (300,300);\n    f.addMouseListener (f);\n\
  \    f.setVisible(true);\n  }\n  public void mouseEntered (MouseEvent e) { }\n \
  \ public void mouseExited (MouseEvent e) { }\n  public void mousePressed (MouseEvent\
  \ e) { }\n  public void mouseReleased (MouseEvent e) { }\n  public void mouseClicked(MouseEvent\
  \ e) \n  { \n    System.out.println (\"Mouse Clicked ... \");\n    mouseX = e.getX\
  \ ();\n    mouseY = e.getY ();\n    repaint ();\n  }\n  public void paint (Graphics\
  \ g)\n  {\n    g.setColor (Color.white);\n    g.fillRect (0,0,getSize ( ).width,\
  \ getSize ( ).height);\n    g.setColor (Color.yellow);\n    g.fillRect(0,0, getSize(\
  \ ).width, getSize( ).height);\n    g.setColor (Color.red);\n    g.fillOval(mouseX–10,mouseY–10,20,20);\n\
  \  }\n}\n```\n\n\n\n\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n# ∞ 20 ∞\n\n## (Java.Lang.Object\
  \ 类)\n\n## 引言\n\n`java.lang` 包中的 `Object` 类是 Java 所有层次结构的根。所有的类都直接或间接地继承 `Object`\
  \ 类。\n\n即使你写了一个简单的类（即它没有继承任何基类），它也会隐式地继承内置的 `Object` 类。因此，该类的特征适用于所有类。\n\n## Object\
  \ 类中的方法\n\n`Object` 类定义了以下方法，所有的类都继承了它们：\n\n1. `public int hashCode()`\n2. `public\
  \ boolean equals(Object obj)`\n3. `public final Class getClass()`\n4. `public String\
  \ toString()`\n5. `protected void finalize() throws Throwable`\n6. `protected Object\
  \ clone() throws CloneNotSupportedException`\n7. `public final void wait(long timeout)\
  \ throws InterrputedException`\n8. `public final void wait(long timeout, int nanos)\
  \ throws InterrputedException`\n9. `public final void wait() throws InterrputedException`\n\
  10. `public final void notify()`\n11. `public final void notifyAll()`\n\n### 1.\
  \ `public int hashCode()`\n\n在哈希表中存储对象时，可以使用此方法获取对象的哈希值。该值在程序执行期间被保证是一致的。\n\n###\
  \ 2. `boolean equals(Object obj)`\n\n如果每个对象都被认为是唯一的，那么没有必要重写 `Object` 类的 `equals()`\
  \ 方法。该方法比较对象的引用是否相等。\n\n### 3. `final Class getClass()`\n\n返回对象的运行时类，该类在运行时由 `java.lang.Class`\
  \ 类的对象表示。\n\n示例 20.1：以下示例说明了此方法可以用于获取与任何 `java` 对象对应的 `Class` 对象。然后我们可以使用反射/内省使用\
  \ `Class` 类的方法来获取有关对象类的信息。`getMethods()` 和 `getFields()` 将仅显示所有公共成员，而 `getDeclaredMethods()`\
  \ 和 `getDeclaredFields()` 将显示所有成员。\n\n```java\nimport java.lang.reflect.Method;\n\
  import java.lang.reflect.Field;\nclass DispClassMembers1\n{\n    public static void\
  \ main(String args[])\n    {\n      String s = new String(\"Hello\");\n      Class\
  \ c = s.getClass();\n      Method m[] = c.getMethods();\n      System.out.println(\"\
  ......Public Methods (\" + m.length + \")......\");\n      for(int i=0; i < m.length;\
  \ i++)\n        System.out.println(m[i]);\n      Field f[] = c.getFields();\n  \
  \    System.out.println(\"......Public Fields (\" + f.length + \")......\");\n \
  \     for(int i=0; i< f.length; i++)\n        System.out.println(f[i]);\n      m\
  \ = c.getDeclaredMethods();\n      System.out.println(\"......Declared Methods (\"\
  \ + m.length + \")......\");\n      for(int i=0; i< m.length; i++)\n        System.out.println(m[i]);\n\
  \      f = c.getDeclaredFields();\n      System.out.println(\"......Declared Fields\
  \ (\" + f.length + \")......\");\n      for(int i=0; i< f.length; i++)\n       \
  \ System.out.println(f[i]);\n    }\n}\n```\n\n输出：\n```\n......Public Methods (72)......\n\
  public int java.lang.String.hashCode()\npublic int java.lang.String.compareTo(java.lang.String)\n\
  public int java.lang.String.compareTo(java.lang.Object)\npublic int java.lang.String.indexOf(int,int)\n\
  public int java.lang.String.indexOf(int)\npublic int java.lang.String.indexOf(java.lang.String)\n\
  public int java.lang.String.indexOf(java.lang.String,int)\npublic boolean java.lang.String.equals(java.lang.Object)\n\
  public String java.lang.String java.lang.String.toString()\npublic char java.lang.String.charAt(int)\n\
  public int java.lang.String.codePointAt(int)\n...\n```\n\n\n\n\n# 已声明的方法 (70)\n\n\
