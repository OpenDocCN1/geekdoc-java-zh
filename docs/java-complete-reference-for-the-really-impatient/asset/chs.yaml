  \ `resume()` 方法重新启动。\n\n### 使用 Java 2 挂起、恢复和停止线程\n\n#### 示例 12.17:\n\n```java\n\
  class A implements Runnable {\n    String name;\n    Thread t;\n    boolean suspendFlag;\n\
