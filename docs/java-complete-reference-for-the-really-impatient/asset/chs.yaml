  \ |\n\n## 字符串数组\n\n我们也可以创建并使用包含字符串的数组。\n\n### 示例 10.1\n\n```java\nimport java.util.Scanner;\n\
  class StringArrSort {\n    public static void main(String args[]) {\n        Scanner\
  \ sc=new Scanner(System.in);\n        System.out.print(\"Enter how many names \"\
  );\n        int n=sc.nextInt();\n        String s[]=new String[n];\n        //input\n\
  \        for(int i=0;i<n;i++) {\n            System.out.println(\"Enter name \"\
  \ + (i+1));\n            s[i]=sc.next();\n        }\n        //sorting\n       \
  \ for(int i=0;i<n-1;i++)\n            for(int j=i+1;j<n;j++)\n                if(s[i].compareTo(s[j])\
  \ > 0) {\n                    String t=s[i];\n                    s[i]=s[j];\n \
  \                   s[j]=t;\n                } \n        //output\n        for(int\
  \ i=0;i<n;i++)\n            System.out.println(s[i]);\n    }\n}\n```\n\n## 字符串转换与\
  \ `toString()`\n\n当 Java 在拼接过程中将数据转换为其 `String` 表示形式时，是通过调用 `String` 类定义的重载字符串转换方法\
  \ `valueOf()` 实现的。`valueOf()` 是一个静态方法，针对所有简单类型和 `Object` 类型进行了重载。\n\n对于简单类型，`valueOf()`\
  \ 返回一个包含其调用时值的类可读等价值的字符串。对于对象，`valueOf()` 调用对象上的 `toString()` 方法。\n\n每个类都继承了 `toString()`，因为它是由\
  \ `Object` 类定义的。然而，`toString()` 的默认实现很少是够用的。它显示类名，后跟符号“@”，然后是对象 ID（例如 `Box@ab1342`），这通常没有用处。对于我们创建的大多数重要类，我们希望重写\
  \ `toString()` 并提供自己的字符串表示。\n\n### 示例 10.2\n\n```java\nclass A {\n    private int\
  \ x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1) {\n        x\
  \ = x1;\n        y = y1;\n    }\n    public String toString() {\n        return\
  \ (x + \",\" + y);\n    }\n}\nclass ToStringTest {\n    public static void main(String\
  \ args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1); // 调用了类的\
  \ toString()\n        String s1=\"Object a1 is \" + a1; // 对象与字符串拼接\n        //\
  \ 再次调用了 Object 的 toString()\n        System.out.println(s1);\n    }\n}\n```\n**输出：**\n\
  ```\nA@3e255\nObject a1 is A@3e255\n```\n\n### 示例 10.3\n\n```java\nclass A {\n \
  \   private int x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1)\
  \ {\n        x = x1;\n        y = y1;\n    }\n    public String toString() {\n \
  \       return (x + \",\" + y);\n    }\n}\nclass ToStringTest2 {\n    public static\
  \ void main(String args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1);\
  \ // \n        String s1=\"Object a1 is \" + a1; // \n        System.out.println(s1);\n\
  \    }\n}\n```\n**输出：**\n```\n5,6\nObject a1 is 5,6\n```\n\n### 示例 10.4\n\n```java\n\
  import java.util.*;\nclass FindTest {\n    public static void main(String args[])\
  \ {\n        Scanner sc=new Scanner(System.in);\n        String s1,s2;\n       \
  \ System.out.print(\"Enter a string\");\n        s1=sc.next();\n        System.out.print(\"\
  Enter string to search\");\n        s2=sc.next();\n        int ans = s1.indexOf(s2);\n\
  \        if(ans == -1)\n            System.out.println(\"Not Found\");\n       \
  \ else\n            System.out.println(\"found at pos \" + ans);\n    }\n}\n```\n\
  \n## StringBuffer\n\n`StringBuffer` 是 `String` 的类类，提供了许多 `String` 的功能。正如我们知道的，`String`\
  \ 表示固定长度。与之相反，`StringBuffer` 表示可增长且可写的字符序列。`StringBuffer` 可以在中间插入或在末尾追加。`StringBuffer`\
  \ 会自动扩展空间以容纳此类添加。Java 内部会大量使用该类，但许多程序员只处理 `String`，Java 在后台通过重载的 `+` 运算符操作 `StringBuffer`。\n\
  \n### 关于 `StringBuffer` 类的一些重要点\n\n- `StringBuffer` 像 `String` 一样是一个 `Object`\n\
  - `StringBuffer` 类像 `String` 类一样同样是 `final` 的\n- `StringBuffer` 对象是可变的（可以修改），不同于\
  \ `String` 对象\n\n### `StringBuffer` 类的构造函数和方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n\
  | `public StringBuffer()` | 默认构造函数预留 16 个字符的空间 |\n| `public StringBuffer(int)` |\
  \ 该构造函数接受整数参数设置缓冲区的大小 |\n| `public StringBuffer(String)` | 该构造函数接受 String 参数，设置\
  \ `StringBuffer` 对象的初始内容并预留额外的 16 个字符空间 |\n| `public synchronized int length()`\
  \ | 返回 `StringBuffer` 的当前长度 |\n| `public synchronized int capacity()` | 返回当前容量。容量是新插入字符的可用存储空间，超过此空间将发生分配\
  \ |\n| `public synchronized void ensureCapacity(int)` | 确保容量至少等于指定的最小值。如果我们想在构造\
  \ `StringBuffer` 之后预留特定数量字符的空间，可以使用 `ensureCapacity()` 方法设置缓冲区的大小。这在我们预先知道将追加大量小字符串到\
  \ `StringBuffer` 时非常有用 |\n| `public synchronized void trimToSize()` | 将移除多余的空闲空间。现在容量将等于长度\
  \ |\n| `public synchronized void setLength(int newLength)` | 设置字符序列的长度。`newLength`\
  \ 必须是非负的。当我们增大缓冲区时，会在现有缓冲区末尾添加空字符。如果调用 `setLength()` 时的值小于 `length()` 返回的值，则存储在该长度之外的字符将丢失。\
  \ |\n\n\n\n\n\n# 异常处理\n\n| `public synchronized char charAt(int index)` | 返回此序列中指定索引处的\
  \ `char` 值。 |\n| `public synchronized void getChars(int srcBegin, int srcEnd, char[]\
  \ dst, int dstBegin)` | 将字符从此序列复制到目标字符数组 `dst`。第一个复制的字符位于索引 `srcBegin`；最后一个复制的字符位于索引\
  \ `srcEnd-1`。要复制的字符总数为 `srcEnd-srcBegin`。字符被复制到 `dst` 中从索引 `dstBegin` 开始的子数组中。注意：确保目标或目标数组足够大以容纳指定子字符串中的字符数量。\
  \ |\n| `public synchronized void setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果\
  \ `index` 为负数或大于等于 `length()`，则抛出 `IndexOutOfBoundsException`。 |\n| `public synchronized\
  \ StringBuffer append(Object)` | `append` 方法将任何其他类型数据的字符串表示连接到调用者的 `StringBuffer`\
  \ 对象的末尾。 |\n| `public synchronized StringBuffer delete(int start, int end)` | 从索引\
  \ `start` 到索引 `end-1` 删除字符 |\n| `public synchronized StringBuffer deleteCharAt(int\
  \ index)` | 删除指定位置的 `char` |\n| `public synchronized StringBuffer replace(int start,\
  \ int end, String str)` | 将索引 `start` 到 `end-1` 的字符替换为指定 `String` 中的字符。 |\n| `public\
  \ synchronized String substring(int)` | 返回一个新的 `String`，其中包含当前包含在此字符序列中的字符子序列。该子字符串从指定的索引开始，延伸到此序列的结束。\
  \ |\n| `public synchronized String substring(int start, int end)` | 返回一个新的 `String`，其中包含当前包含在此字符序列中的字符子序列。该子字符串从指定的\
  \ `start` 索引开始，延伸到索引 `end-1` 处的字符。 |\n| `public synchronized StringBuffer insert(int,\
  \ Object)` | 将一个 `String` 插入另一个 `String`。它重载以接受所有简单类型的值以及 `Strings` 和 `Objects`。\
  \ |\n| `public int indexOf(String)` | |\n| `public synchronized int indexOf(String,\
  \ int)` | |\n| `public int lastIndexOf(String)` | |\n| `public synchronized int\
  \ lastIndexOf(String, int)` | |\n| `public synchronized StringBuffer reverse()`\
  \ | 反转 `StringBuffer` 的内容。 |\n\n## 示例 10.5\n\n```java\nimport java.util.Scanner;\n\
  class SortStr\n{\n    public static void main(String args[])\n    {\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.print(\"Enter a string\");\n\
  \        StringBuffer sb1 = new StringBuffer(sc.next());\n        //Sorting\n  \
  \      for(int i=0;i<sb1.length()-1;i++)\n            for(int j=i+1;j<sb1.length();j++)\n\
  \                if(sb1.charAt(i) > sb1.charAt(j))\n                {\n        \
  \            char t=sb1.charAt(i);\n                    sb1.setCharAt(i,sb1.charAt(j));\n\
  \                    sb1.setCharAt(j,t);\n                }\n            System.out.println(sb1);\n\
  \    }\n}\n```\n**输出:** Enter a string SHIVAM\nAHIMSV\n\n## 示例 10.6: 计算给定句子中单词数的程序。\n\
  \n```java\nclass WordCnt\n{\n    public static void main(String args[])\n    {\n\
  \        String s1 = \"Mohan Das Karam Chand Gandhi\";\n        boolean flag=false;\n\
  \        int cnt=0;\n        for(int i=0;i<s1.length();i++)\n        {\n       \
  \     if(s1.charAt(i) == ' ')\n                flag = false;\n            else\n\
  \            {\n                if(flag == false)\n                {\n         \
  \           flag = true;\n                    cnt++;\n                }\n      \
  \      }\n        }\n        System.out.print(\"No. of Words=\" + cnt);\n    }\n\
  }\n```\n**输出:** No. of Words=5\n\n## 引言\n\n异常是在运行时发生的条件，会中断指令的正常流。当解释器遇到错误时，它创建一个异常对象并将其抛出。\n\
  \n在较旧的语言中，异常处理是通过 `goto` 和返回值完成的。这种方法非常繁琐。Java 的异常处理通过使用面向对象的方法避免了这些问题。\n\n## 异常基础\n\
  \n异常是一个对象，描述了代码中出现的异常情况。当出现异常情况时，会创建一个代表该异常的并并抛出。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。手动生成的异常通常用于向方法的调用者报告特定的错误状态。\n\
  \nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws` 和 `finally`。简而言之，你想要监控异常的程序语句包含在\
  \ `try` 块中。如果 `try` 块内部发生异常，异常就会被抛出。你的代码可以使用 `catch` 捕获此异常并处理它。要手动抛出异常，请使用 `throw`。任何抛出方法的异常都必须通过\
  \ `throws` 子句进行说明。任何在 `try` 块完成后必须执行的代码都放在 `finally` 块中。\n\n这是异常处理块的通用形式：\n\n```java\n\
  try {\n    // 监控错误的代码块\n}\ncatch (ExceptionType1 exOb) {\n    // ExceptionType1\
  \ 的异常处理程序\n}\n//.........\nfinally {\n    // 在 try 结束后执行的代码块\n}\n```\n\n## 异常类型\n\
  \n所有异常类型都是内置类 `Throwable` 的子类。因此，`Throwable` 异常类层次结构的顶端。在 `Throwable` 之下紧有两个子类，它们将异常分为两个不同的分支。其中一个分支由\
  \ `Exception` 引。该类用于用户程序应该捕获的异常情况。这也是你将在创建自定义异常类型时将要派生出的类。\n\n`Exception` 有一个重要的子类，称为\
  \ `RuntimeException`。这种类型的异常是为你编写的程序自动定义的，包括如除以零和无效数组索引等情况。\n\n\n\n\n另一个分支由 `Error`\
  \ 顶层，它定义了程序在正常情况下无法预期被捕获的异常。`Error` 类型的异常由 Java 运行时系统使用，表示与运行时环境本身相关的错误。栈溢出（Stack\
  \ overflow）就是此类错误的一个示例。本章将不会处理 `Error` 类型的异常，因为这些异常通常是由于程序无法处理的灾难性故障而创建的。\n\n顶层异常层次结构所示：\n\
  \n![image](img/image074.png)\n\n### 示例 11.1\n\n```java\nclass ErrorTest1\n{\n  \
  \  public static void main(String args[])\n    {\n      int a=5,b=2,c=2,d;\n   \
  \   d=a/(b-c); // 发生了 ArithmeticException(Divide by zero)\n      System.out.println(d);\n\
  \      System.out.println(\"This will not be printed\");\n    }\n}\n```\n程序将在除法操作期间终止，不会执行剩余的语句。\n\
  \n### 示例 11.2\n\n```java\nclass A\n{\n    void display()\n    {\n      -----\n \
  \   }\n}\nclass ErrorTest2\n{\n    public static void main(String args[])\n    {\n\
  \      A a1=null;\n      a1.display(); // 发生了 NullPointerException\n    }\n}\n```\n\
  在上面的程序中会发生 `NullPointerException`。引用变量没有用 `new` 初始化。在这种情况下程序也会终止。\n\n### 示例 11.3\n\
  \n```java\nclass ErrorTest3\n{\n    public static void main(String args[])\n   \
  \ {\n      int a[ ] = {10,20,30};\n      System.out.println(a[3]);  // 发生了 ArrayIndexOutOfBoundsException\n\
  \    }\n}\n```\n在上面的案例中，数组的长度为 3，索引从 0 到 2，因此如果我们打印 `a[3]`，那么它是第 4 个元素，这不是一个有效的索引。这将产生一个异常错误。在\
  \ C/C++ 中这是允许的，但在 Java 中是不允许。\n\n**注意**\n\nJDK 7 增加了一种新的 `try` 语句形式，支持自动资源管理。这种新的\
  \ `try` 形式被称为 `try-with-resources`，在 `Chapter` 文件中结合文件管理的上下文中进行了描述，因为文件是最常用的资源之一。\n\
  \n### 异常的其他情况\n\n1. 我们正尝试打开的文件可能不存在。\n2. 我们想要创建一个新对象，但没有可用内存。\n3. 我们想要加载的类文件可能丢失或格式错误。\n\
  4. 我们想要转换为数字的 `String` 包含无效字符，导致无法转换为数字。\n\n如果异常对象没有被正确捕获和处理，解释器将显示错误消息并终止程序。如果我们想继续执行剩余代码，那么我们应该尝试捕获由错误条件抛出的异常对象。\n\
  \n这项任务被称为异常处理。异常处理机制的目的是提供一种检测和报告“异常情况”的方法，以便采取适当的行动。该机制建议引入一套独立的错误处理代码，用于执行以下任务：\n\
  \n1. 发现问题。（发生异常）\n2. 通知错误已发生。（抛出异常）\n3. 接收错误信息。（捕获异常）\n4. 纠正措施。（处理异常）\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。\n\n我们想要监控异常的程序语句包含在 `try` 块中，每当发生错误时，它会被抛给 `catch` 块。我们的代码可以捕获此异常（使用\
  \ `catch`）并以合理的方式进行处理。系统生成的异常由 Java 运行时系统自动抛出。\n\n要手动抛出异常，请使用关键字 `throw`。任何从方法抛出的异常都必须通过\
  \ `throws` 子句指定。在方法返回之前必须执行的代码都放在 `finally` 块中。\n\n`try` 块必须括在大括号之间。可以有一个或多个 `catch`\
  \ 语句。`catch` 和 `finally` 都是可选的，但即使 `try` 块失败，`finally` 块也会执行。如果 `try` 块失败，执行将继续紧随\
  \ `finally` 块之后的语句。\n\n如果在执行 `try` 块时发生某些错误，JVM 会抛出一个 `Exception` 类型的对象或其子类之一。然后按顺序与\
  \ `catch` 块进行比较。如果找到了匹配的 `catch` 块，则处理该错误，然后继续执行 `catch` 块之后的语句。如果错误不匹配任何 `catch`\
  \ 块，它将向上层次结构移动，直到被处理或在未处理的情况下被传递给 JVM。随后，JVM 将直接终止程序并显示错误详情。\n\n### 使用 try 和 catch\n\
  \n虽然 Java 运行时系统提供的默认异常处理程序对于调试很有用，但你通常可能自己自己处理异常。这样做有两个好处：第一，它允许你处理错误；第二，它防止程序自动终止。如果你的程序每当发生错误就停止运行并打印堆栈跟踪，大多数用户（至少是这样）会感到困惑！幸运的是，防止这一点非常容易。\n\
  \n为了防止并处理运行时错误，只需将你想要监控的代码包含在 `try` 块中。紧随 `try` 块 之后，包含一个 `catch` 子句，指定你想要捕获的异常类型。\n\
  \n为了说明如何轻松地完成这一点，下面的程序包含一个 `try` 块和一个处理由除以零错误产生的 `ArithmeticException` 的 `catch`\
  \ 子句：\n\n```java\nclass Exc2 {\n  public static void main(String args[])\n  {\n\
  \    int d, a;\n\n    try {  // 监控一段代码。\n      d = 0;\n      a = 42 / d;\n     \
  \ System.out.println(\"This will not be printed.\");\n    }\n\n    catch (ArithmeticException\
  \ e)\n    {\n    // 捕获除以零错误\n      System.out.println(\"Division by zero.\");\n\
  \    }\n\n    System.out.println(\"After catch statement.\");\n  }\n}\n```\n\n该程序产生以下输出：\n\
  \nDivision by zero.\n\nAfter catch statement.\n\n注意 `try` 块内部的 `println()` 调用从未执行。一旦抛出异常，程序控制将从\
  \ `try` 块转移到 `catch` 块。\n\n\n\n\n换句话说，`catch` 并不是被“调用”，因此执行流永远不会从 `catch` “返回”到\
  \ `try` 块。\n\n因此，“This will not be printed.”这一行不会显示。一旦 `catch` 语句执行，程序控制将继续执行整个\
  \ `try/catch` 机制之后的下一行。\n\n`try` 和其 `catch` 语句形成一个单元。`catch` 子句的作用范围仅限于紧接其其前的 `try`\
  \ 语句所指定的语句。\n\n`catch` 语句无法捕获由另一个 `try` 语句抛出的异常（稍后描述的嵌套 `try` 语句除外）。受 `try`保护的语句必须用大括号括起来（也就是说它们必须在一个块内）。你不能对单个语句使用\
  \ `try`。\n\n大多数结构良好的 `catch` 子句的目标应该是解决异常情况，然后像错误从未发生过一样继续后续操作。例如，在下一个程序中，`for`\
  \ 循环的每次迭代都会获取两个随机整数。\n\n这两个整数相互相除，结果用于除以值 `12345`。最终结果被放入 `a` 中。如果任何一次除法操作导致 `divide-by-zero`\
  \ 错误，将被捕获，`a` 的值被设置为零，程序继续。\n\n```java\n// Handle an exception and move on.\n\n\
  import java.util.Random;\n\nclass HandleError {\n    public static void main(String\
  \ args[]) {\n        int a=0, b=0, c=0;\n        Random r = new Random();\n    \
  \    for(int i=0; i<32000; i++) {\n            try {\n                b = r.nextInt();\n\
  \                c = r.nextInt();\n                a = 12345 / (b/c);\n        \
  \    } catch (ArithmeticException e) {\n                System.out.println(\"Division\
  \ by zero.\");\n                a = 0; // set a to zero and continue\n         \
  \   }\n            System.out.println(\"a: \" + a);\n        }\n    }\n}\n```\n\n\
  ## 显示异常的描述\n\n`Throwable` 重写了 `toString()` 方法（由 `Object` 定义），使其返回一个包含异常描述的字符串。你只需将异常作为参数传递给\
  \ `println()` 语句，即可显示此描述。例如，上述程序中的 `catch` 块可以重写如下：\n\n```java\ncatch (ArithmeticException\
  \ e)\n{\n    System.out.println(\"Exception: \" + e);\n    a = 0; // set a to zero\
  \ and continue\n}\n```\n\n当该版本替换到程序中并运行时，每个 `divide-by-zero` 错误都会显示以下消息：\n`Exception:\
  \ java.lang.ArithmeticException: / by zero`\n\n虽然这在这种语文中没有特殊价值，但显示异常描述的能力在其他情况下非常有价值——特别是当你正在测试异常或在进行调试时。\n\
  \n| 异常类型 | 异常原因 |\n| :--- | :--- |\n| ArithmeticException | 算术错误，例如除以 0 |\n| ArrayIndexOutOfBoundsException\
  \ | 数组索引越界 |\n| ArrayStoreException | 在数组中存储错误类型的数据 |\n| FileNotFoundException |\
  \ 访问不存在的文件 |\n| IOException | 无法从文件中读取 |\n| NullPointerException | 由引用空对象引起 |\n\
  | NumberFormatException | 字符串与数字之间的转换失败 |\n| OutOfMemoryException | 内存不足，无法分配新对象\
  \ |\n| SecurityException | Applet 尝试执行浏览器安全设置不允许允许的操作 |\n| StackOverflowException\
  \ | 系统栈空间耗尽 |\n| StringIndexOutOfBoundsException | 程序尝试访问字符串中不存在的字符位置 |\n\n## Java\
  \ 内置异常\n\n在标准包 `java.lang` 内部，Java 定义了几个异常类。前面的示例已经使用了其中几个。这些异常中最通用的是是标准类型 `RuntimeException`\
  \ 的子类。\n\n正如之前所解释的，这些异常不需要包含在任何方法的 `throws` 列表中。在语言中，这些被称为“未检查异常”（unchecked exceptions），因为编译器不会检查方法是否处理或抛出了这些异常。在\
  \ `java.lang` 中定义且必须包含在方法 `throws` 列表中的异常被称为“检查异常”（checked exceptions）。Java 还定义了与之相关的类型。\n\
  \n## 多个 catch 子句\n\n在某些情况下，一段代码可能会抛出多个异常。为了处理此类异常，你可以指定多个 `catch` 子句，每个子句捕获不同的类型。当抛出异常时，会按顺序检查每个\
  \ `catch` 语句，并执行第一个与异常类型匹配的语句。在一个 `catch` 语句执行后，其他语句将被跳过，执行将在 `try` 块之后继续。\n\n```java\n\
  // Demonstrate multiple statements statements\nclass MultipleCatches {\n    public\
  \ static void main(String args[]) {\n        try {\n            int a = args.length;\n\
  \            System.out.println(\"a = \" + a);\n            int b = 42 / a;\n  \
  \          int c[] = { 1 };\n            c[42] = 99;\n        } catch(ArithmeticException\
  \ e) {\n            System.out.println(\"Divide by 0: \" + e);\n        } catch(ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Array index oob: \" + e);\n        }\n\
  \        System.out.println(\"After try/catch blocks.\");\n    }\n}\n```\n\n如果程序在没有命令行参数的情况下启动，它将导致除以零异常，因为\
  \ `a` 等于零。如果你提供了命令行参数，`a` 将大于零，此时它将能够跳过除法错误。但它会导致 `ArrayIndexOutOfBoundsException`，因为数组\
  \ `c` 的长度为 1，而程序尝试为 `c[42]` 赋值。\n\n以下是两种方式生成的输出：\n`C:\\java MultipleCatches`\na\
  \ = 0\nDivide by 0: java.lang.ArithmeticException: / zero\nAfter try/catch blocks.\n\
  \n`C:\\java MultipleCatches TestArg`\na = 1\nArray index oob: java.lang.ArrayIndexOutOfBoundsException:42\n\
  After try/catch blocks.\n\n在使用多个 `catch` 语句时，记住异常子类必须在在其父类之前。这是因为使用父类的 `catch` 语句会捕获该类型及其任何子类的异常。因此，如果子类出现在父类之后，它将永远无法被访问。此外，在\
  \ Java 中，不可达代码是一个错误。例如，考虑以下程序：\n\n```java\n/* 此程序包含一个错误。\n在系列 catch 语句中，子类必须在在其父类之前。\n\
  否则，将产生不可达代码并导致编译时错误。\n*/\nclass SuperSubCatch {\n    public static void main(String\
  \ args[]) {\n        try {\n            int a = 0;\n            int b = 42 / a;\n\
  \        } catch(Exception e) {\n            System.out.println(\"Generic Exception\
  \ catch.\");\n        }\n        /* 此 catch 块永远无法被访问，因为\nArithmeticException 是 Exception\
  \ 的子类。 */\n        catch(ArithmeticException e) { // 错误 – 不可\n            System.out.println(\"\
  This is never reached.\");\n        }\n    }\n}\n```\n\n\n\n\n\n如果你尝试编译此程序，你将收到一条错误消息，指出第二个\
  \ `catch` 语句是不可达的，因为异常已经被捕获。由于 `ArithmeticException` 是 `Exception` 的子类，第一个 `catch`\
  \ 语句将处理所有基于 `Exception` 的错误，包括 `ArithmeticException`。\n\n这意味着第二个 `catch` 语句将永远不会执行。要解决此问题，请反转\
  \ `catch` 语句的顺序。\n\n### 嵌套 try 语句\n\n`try` 语句是可以嵌套的。也就是说，一个 `try` 语句可以放在另一个 `try`\
  \ 块内部。每当进入一个 `try` 语句时，该异常的上下文就会被推到栈上。\n\n如果内部的 `try` 语句对特定异常没有 `catch` 处理器，则栈会进行回溯，并检查下一个\
  \ `try` 语句的 `catch` 处理器是否有匹配项。\n\n这种过程会一直持续，直到其中一个 `catch` 语句执行成功，或者所有嵌套的 `try`\
  \ 语句都已耗尽。如果没有匹配 `catch` 语句，则 Java 运行时系统将处理该异常。\n\n这里是一个使用嵌套 `try` 语句的示例：\n\n###\
  \ 多 catch 语句\n\n当存在多个一个 `catch` 语句时，它被称为多 catch 语句。\n\n#### 多 catch 语句示例\n\n```java\n\
  try\n{\n    statement; //产生异常\n}\ncatch(Exception-type-1 e)\n{\n    statement 1;\
  \ //处理异常类型 1\n}\ncatch(Exception-type-2 e)\n{\n    statement 2; //处理异常类型 2\n}\n\
  catch(Exception-type-n e)\n{\n    statement n; //处理异常类型 n\n}\n```\n\n#### 示例 11.4\n\
  \n```java\nclass ErrorTest4\n{\n    public static void main(String args[])\n   \
  \ {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"Before Exception\
  \ \");\n        d=a/(b-c);\n        System.out.println(\"After Exception \");\n\
  \    }\n}\n```\n输出:\n![image](img/image043.png)\n\n在这里我们没有捕获异常，因此程序将在显示消息“Before\
  \ Exception”后终止。现在我们使用异常处理已经解决了这个问题。\n\n#### 示例 11.5\n\n```java\nclass ErrorTest5\n\
  {\n    public static void main(String[] args)\n    {\n      int a=10,b=2,c=2,d;\n\
  \      try\n      {\n        System.out.println(\"Before Exception\");\n       \
  \ d=a/(b-c);\n        System.out.println(\"This Will Not Print\");\n      }\n  \
  \    catch(ArithmeticException e)\n      {\n        System.out.println(\"After Exception\"\
  );\n        System.out.println(\"error : Division by zero\");\n      }\n    }\n\
  }\n```\n输出:\n![image](img/image049.png)\n\n### 异常处理的优势\n\n- 我们可以很容易地指定异常/错误将在哪里被处理。异常/错误在运行时沿调用栈向上传播——首先到达外层的\
  \ `try` 块，然后返回到调用方法——直到异常处理器捕获它们为止。\n- 异常/错误的位置是确切的，因为整个堆栈轨迹对用户可见。这对于调试非常有帮助。\n\
  - 程序员有机会从错误/异常状态中恢复。\n- 错误处理代码与正常程序流分离，以增加可读性和维护性。\n- 在 Java 中，无需测试是否发生了异常/错误情况。添加更多的错误/异常处理器仅需添加更多的\
  \ `catch` 子句，但不需要触动原始程序流。\n\n### 异常类的层次结构\n\n所有 `Exception` / `Error` 类的根类是 `throwable`\
  \ 类，它是 `object` 类的直接子类。异常/错误在 Java 中也是对象。`Exception` 的子类带有 `Exception` 后缀。\n\n`throwable`\
  \ 类有两个直接直接子类：\n\n- `Error`：`Error` 类的子类基本上用于信号非正常状态，例如：\n    1. `OutOfMemoryError`\
  \ 信号 Java 虚拟机内存已耗尽，且垃圾回收器无法回收任何内存。\n    2. `StackOverflowError` 信号解释器中发生栈溢出。\n \
  \ 这些错误通常是不可恢复的，且不应该被处理。\n- `Exception`：`Exception` 类的子类通常是可恢复的。例如，`EOFException`\
  \ 信号我们打开的文件没有更多可读数据。`FileNotFoundException` 信号我们想要打开的文件在系统中不存在。\n\n层次结构示例：\n![image](img/image01.png)\n\
  \n#### 异常分为两类\n\n##### 检查异常 (Checked Exception)\n如果必须捕获异常，则它被称为检查异常。如果 `try` 块中可能发生检查异常且未被处理，程序将无法编译。编译器确保如果一个方法直接或间接地抛出检查异常，则该方法必须显式处理它。该方法要么捕获异常并采取适当行动，要么将异常传递给其调用者。\n\
  注意：`Exception` 及其所有子类（运行时异常及其子类除外）都是检查异常，必须被捕获。\n\n##### 未检查异常 (Unchecked Exception)\n\
  如果不必须捕获异常，则称为未检查异常。即使未处理未检查异常，程序也可以编译。如果程序中发生了未处理的未检查异常，则程序执行将在该处终止。但如果异常被处理，则程序就不会因为异常而终止。\n\
  注意：`Error` 及其所有子类都是未检查异常，且不需要捕获。运行时异常及其所有子类是未检查异常，且不需要捕获。用户定义的 `Exception` 是检查异常。\n\
  \nException 类中的方法\n\n| 方法 |  |\n| :--- | :--- |\n| `getMessage()` | 获取与异常或错误相关的消息。\
  \ |\n| `printStackTrace()` | 打印显示异常位置的堆栈轨迹。 |\n| `toString()` | 显示异常/错误名称以及 `getMessage()`\
  \ 返回的消息。 |\n\n#### 示例 11.6\n\n```java\nclass ErrorTest6\n{\n    public static void\
  \ main(String[] arr)\n    {\n      try\n      {\n        int a=10,b=2,c=2,d;\n \
  \       System.out.println(\"Before Exception\");\n        d=a/(b-c);\n        System.out.println(\"\
  This Will Not Print\");\n      }\n      catch(ArithmeticException e)\n      {\n\
  \        System.out.println(\"After Exception\");\n        System.out.println(\"\
  error : Division by zero\");\n        System.out.println(e.getMessage());\n    \
  \    System.out.println(e); // 调用了 toString()。\n        e.printStackTrace();\n \
  \     }\n    }\n}\n```\n输出:\nBefore Exception\nAfter Exception\nerror : Division\
  \ by zero\nby Zero\njava.lang.ArithmeticException: / by zero\njava.lang.ArithmeticException:\
  \ / by zero\nat ErrorTest6.main(ErrorTest6.java:10)\n\n#### 示例 11.7 多 catches\n\n\
  ```java\nclass ErrorTest7\n{\n    public static void main(String args[])\n    {\n\
  \      try\n      {\n        int a=args.length;\n        System.out.println(\"Before\
  \ Exception\");\n        int b=58/a;\n        int c[] = {1};\n        c[47]=100;\n\
  \        System.out.println(\"After Exception\");\n      }\n      catch(ArithmeticException\
  \ e)\n      {\n        System.out.println(\"Divide by zero :\"+e);\n      }\n  \
  \    catch(ArrayIndexOutOfBoundsException e)\n      {\n        System.out.println(\"\
  Array Index oob :\"+e);\n      }\n      System.out.println(\"After try/catch block\"\
  );\n    }\n}\n```\n输出 1：当我们以 “java ErrorTest7” 运行此程序时：\nBefore Exception\nDivide\
  \ by zero :java.lang.ArithmeticException: / by zero\nAfter try/catch block\n\n输出\
  \ 2：当我们以 “java ErrorTest7 45” 运行此程序时：\nBefore Exception\nArray Index oob:java.lang.ArrayIndexOutOfBoundsException:\
  \ 47\nAfter try/catch block\n\n\n\n\n\n如果在另一个 `try` 块中使用 `try` 和 `catch` 语句，则被称为嵌套的\
  \ try catch。\n\n### 语法\n\n```java\ntry      //外部 try\n{\n    try      //内部 try\n\
  \    {\n        statement ;\n    }\n    catch1() //内部 catch\n    {\n        statement\
  \ ;\n    }\n    catch2() //内部 catch\n    {\n        statement ;\n    }\n}\ncatch()\
  \ //外部 catch\n{\n    statement ;\n}\n```\n\n### 示例 11.8 嵌套的 try 和 catch\n\n```java\n\
  class Nested\n{\n    public static void main(String args[])\n    {\n        try\n\
  \        {\n            int a=args.length;\n            int b=58/a;\n          \
  \  System.out.println(\"a= \"+a);\n            try\n            {\n            \
  \    if(a==1)\n                    a=a/(a-a);\n                if(a==2)\n      \
  \          {\n                    int c[]={1};\n                    c[42]=100;\n\
  \                }\n            }\n            catch(ArrayIndexOutOfBoundsException\
  \ e)\n            {\n                System.out.println(\"ArrayIndex oob \"+e);\n\
  \            }\n        }\n        catch(ArithmeticException e)\n        {\n   \
  \         System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n**输出\
  \ I:**\n当我们以 `java ErrorTest8` 运行上述程序时（除以零）\n\n**输出 II:**\n当我们以 `java ErrorTest8\
  \ 10` 运行上述程序时\na=1 / by zero\n\n**输出 III:**\n当我们以 `java ErrorTest8 10 20` 运行上述程序时\n\
  a=2\nArrayIndex oob java.lang.ArrayIndexOutOfBoundsException: 42\n\n### finally\
  \ 语句\n\nJava 支持另一种名为 `finally` 的语句，它可以用于处理未被之前的任何一个 `catch` 语句捕获的异常。`finally` 块可以用于处理\
  \ `try` 块中生成的任何异常。无论是否发生错误，它都会被执行。它可以紧跟在 `try` 块之后，也可以在最后一个 `catch` 块之后，如下所示：\n\n\
  **语法：**\n\n```java\ntry\n{\n}\ncatch(...)\n{\n}\ncatch(...)\n{\n}\nfinally\n{\n\
  }\n```\n\n### 示例 11.9 finally 语句\n\n```java\nclass ErrorTest9\n{\n    public static\
  \ void main(String args[])\n    {\n        int a[ ] = {5,10};\n        int b=5;\n\
  \        try\n        {\n            int x=a[2]/b-a[1];\n        }\n        catch(ArithmeticException\
  \ e)\n        {\n            System.out.println(\"Division By Zero\");\n       \
  \ }\n        catch(ArrayIndexOutOfBoundsException e)\n        {\n            System.out.println(\"\
  Array Index error\");\n        }\n        catch(ArrayStoreException e)\n       \
  \ {\n            System.out.println(\"Wrong Data Type\");\n        }\n        finally\
  \ //始终执行\n        {\n            System.out.println(\"Always Execute\");\n     \
  \   }\n        int y=a[1]/a[0];\n        System.out.println(\"y = \"+y);\n    }\n\
  }\n```\n**输出：**\nArray Index error\nAlways Execute\ny = 2\n\n### throw\n\n到目前，我们只捕获由\
  \ Java 运行时系统抛出的异常。然而，我们的程序完全可以使用 `throw` 语句显式地抛出异常；其通用形式所示：\n\n`throw instance;`\n\
  \n这里，`instance` 必须是 `Throwable` 类型的对象或 `Throwable` 的子类。简单类型如 `int` 或 `char`，以及非\
  \ `Throwable` 类（如 `String` 和 `Object`）不能作为异常。我们有两种方法获取 `Throwable` 对象：使用 `catch`\
  \ 子句中的参数，或者使用 `new` 操作符创建一个。执行流在 `throw` 语句后立即停止；任何随后的语句都不会执行。系统将检查最近的内层 `try` 块，查看它是否有匹配异常类型的\
  \ `catch` 语句。如果有，控制权将转移到该语句。如果没有，将检查下一个外层的 `try` 语句，依此类推。如果没有找到匹配的 `catch`，则默认处理程序将停止程序并打印堆栈跟踪。在这里我们取了一个创建并抛出异常的程序。捕获异常的处理器将其重新抛出给外部处理器。\n\
  \n### 示例 11.10\n\n```java\nclass ErrorTest10\n{\n    int age;\n    void setAge(int\
  \ a)\n    {\n        if(a>0)\n            age = a;\n        else\n        {\n  \
  \          NullPointerException e = new NullPointerException(\"Invalid Age\");\n\
  \            throw e;\n            //throw new NullPointerException(\"Invalid Age\"\
  );\n        }\n    }\n    public static void main(String args[])\n    {\n      \
  \  ErrorTest10 a1 = new ErrorTest10();\n        try\n        {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        }\n        catch(NullPointerException e)\n\
  \        {\n            System.out.println(e.getMessage());\n        }\n    }\n\
  }\n```\n**输出：**\nInvalid Age\n\n### throws\n\n如果一个方法可能会导致它无法处理的异常，那么它必须指定这种行为，以便方法的调用者能够防范该异常。我们通过在方法声明中包含\
  \ `throws` 子句来实现。`throws` 子句列出了方法可能抛出的异常类型。这对于所有检选异常（checked exceptions）都是必要的。方法可能抛出的所有异常都必须在\
  \ `throws` 子句中声明。如果没有，将导致编译错误。这是一个包含 `throws` 子句的方法声明通用形式：\n\n**语法：**\n\n```java\n\
  type method-name(parameter list) throws exception-list\n{\n    //方法体\n}\n```\n\n\
  在这里，`exception-list` 是方法可以抛出的异常的逗号分隔列表。\n\n### 示例 11.11\n\n```java\nimport java.io.*;\n\
  class ErrorTest11\n{\n    int age;\n    void setAge(int a) throws IOException\n\
  \    {\n        if(a>0)\n            age = a;\n        else\n        {\n       \
  \     IOException e = new IOException(\"Invalid Age\");\n            throw e;\n\
  \        }\n    }\n    public static void main(String args[])\n    {\n        ErrorTest11\
  \ a1 = new ErrorTest11();\n        try\n        {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        }\n        catch(IOException e)\n        {\n\
  \            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n**输出：**\n\
  Invalid Age\n\n### 创建自定义的异常子类\n\n这非常简单：只需定义 `Exception` 的子类即可。我们的子类不需要实现任何内容。`Exception`\
  \ 类本身没有定义任何方法。当然，它从 `Throwable` 继承了这些方法。\n\n### 示例 11.12\n\n```java\nclass AgeException\
  \ extends Exception\n{\n```\n\n\n\n\n\n```java\nclass AgeException(String msg) {\n\
  \    super(msg);\n}\n\nclass ErrorTest12 {\n    int age;\n    void setAge(int a)\
  \ throws InvalidAgeException {\n        if(a > 0)\n            age = a;\n      \
  \  else {\n            AgeException e = new AgeException(\"Invalid Age\");\n   \
  \         throw e;\n        }\n    }\n    public static void main(String args[])\
  \ {\n        ErrorTest12 a1 = new ErrorTest12();\n        try {\n            a1.setAge(20);\n\
  \            a1.setAge(-10);\n        } catch(AgeException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n输出:\n```\nInvalid Age\n```\n\n以下示例声明了 `Exception` 的新子类，并使用该子类在方法中指示错误条件。它重写了\
  \ `toString()` 方法，允许显示定制的异常描述。\n\n![sss](img/image090.jpg)\n\n此示例定义了一个名为 `MyException`\
  \ 的 `Exception` 子类。该子类非常简单：它只包含一个构造函数和一个重写的 `toString()` 方法，用于显示异常的值。\n\n`ExceptionDemo`\
  \ 类定义了一个名为 `compute()` 的方法，该方法抛出一个 `MyException` 对象。当 `compute()` 的整数参数大于 10 时，会抛出该异常。`main()`\
  \ 方法为 `MyException` 设置了异常处理器，然后用合法值（小于 10）和非法值调用 `compute()`，以展示代码的两种执行路径。\n\n以下是结果：\n\
  ```\nCalled compute(1)\nNormal exit\nCalled compute(20)\nCaught MyException[20]\n\
  ```\n\n### 链式异常\n\n链式异常允许我们将一个异常与另一个异常关联。第二个异常描述了第一个异常产生。例如，想象一种情况：方法由于尝试除以零而抛出\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，导致除数被设置不当。\n\n尽管该方法必须抛出 `ArithmeticException`（因为这是确实发生的错误），我们可能也想让调用代码知道底层原因是\
  \ I/O 错误。\n\n为了支持链式异常，Java 2 的 1.4 版本为 `Throwable` 类增加了两个构造函数和两个方法。构造函数所示：\n\n```java\n\
  Throwable(Throwable causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n\
  在第一种形式中，`causeExc` 是发生的异常。第二种形式允许我们在指定原因异常的同时指定描述。这两个构造函数也被添加到了 `Error`、`Exception`\
  \ 和 `RuntimeException` 类中。\n\n添加到 `Throwable` 类的链式异常方法是 `getCause()` 和 `initCause()`：\n\
  \n```java\nThrowable getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n\
  `getCause()` 方法返回当前异常的底层异常。如果没有底层异常，则返回 `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联并返回该异常的引用。因此，我们可以在异常创建后为其关联一个原因。然而，原因异常只能设置一次。\n\
  \n因此，每个异常对象只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，则我们不能再次使用 `initCause()` 方法进行设置。通常情况下，`initCause()`\
  \ 用于为不支持上述两个额外构造函数的旧版异常类设置原因。大多数 Java 内置异常都没有定义这些额外的构造函数。因此，如果我们需要向这些异常添加另一个异常，将使用\
  \ `initCause()`。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n### 示例 1\n\n```java\n\
  class ErrorTest {\n    int age;\n    void setAge(int a) {\n        if(a > 0)\n \
  \           age = a;\n        else {\n            NullPointerException e = new NullPointerException(\"\
  Admission Failed\");\n            e.initCause(new ArithmeticException(\"Age is invalid\"\
  ));\n            throw e;\n        }\n    }\n    public static void main(String\
  \ args[]) {\n        ErrorTest a1 = new ErrorTest();\n        try {\n          \
  \  a1.setAge(20);\n            a1.setAge(-10);\n        } catch(NullPointerException\
  \ e) {\n            System.out.println(e.getMessage());\n            System.out.println(e.getCause());\n\
  \        }\n    }\n}\n```\n\n输出:\n```\nAdmission Failed\nAge is Invalid\n```\n![sss](img/image34.jpg)\n\
  \n在这个示例中，顶层异常是 `NullPointerException`。它添加了一个原因异常 `ArithmeticException`。当异常从 `setAge()`\
  \ 抛出时，它被 `main()` 捕获。在那里，显示顶层异常，随后是通过调用 `getCause()` 获取的底层异常。链式异常可以延伸到任何所需的深度。因此，原因异常本身也可以有原因。请注意，过长的异常链可能意味着设计不当。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n### 三个新的 7 异常特性（更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个是自动化释放资源（如文件）在不再需要时的过程。它是基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在后续介绍文件的章节中进行描述。\n\n第二个新特性称为 `multi-catch`（多异常捕获），第三个有时被称为\
  \ `final rethrow`（最终重抛）或更准确的说是重新抛出。这里描述了后两个特性。\n\n`multi-catch` 特性允许用同一个 `catch`\
  \ 语句捕获两个或多个异常。多个异常处理器即使响应不同的异常，使用相同的代码序列也并不常见。现在不需要逐个捕获每种异常类型，而是可以使用单个 `catch` 语句处理所有异常，而避免代码重复。\n\
  \n要使用 `multi-catch`，在 `catch` 语句用逻辑或运算符 `|` 分隔每个异常类型。每个 `multi-catch` 参数隐式地为 `final`（如果需要，你可以显式指定\
  \ `final`，但没有必要）。因为每个 `multi-catch` 参数隐式为 `final`，所以它们不能被赋予新值。\n\n以下是一个使用 `multi-catch`\
  \ 特性捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException` 的 `catch` 语句：\n\n\
  ```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException e)\n```\n\n\
  以下程序展示了 `multi-catch` 特性的用法：\n\n```java\n// 展示 JDK 7 的 multi-catch 特性\nclass MultiCatch\
  \ {\n    public static void main(String args[]) {\n        int a=10, b=0;\n    \
  \    int vals[] = { 1, 2, 3 };\n        try {\n            int result = a / b; //\
  \ 产生 ArithmeticException\n            // vals[10] = 19; // 产生 ArrayIndexOutOfBoundsException\n\
  \            // 此 catch 语句捕获这两种异常\n        } catch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception caught: \" + e);\n        }\n\
  \        System.out.println(\"After multi-catch.\");\n    }\n}\n```\n\n当尝试除以零时，程序将产生\
  \ `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，就会产生 `ArrayIndexOutOfBoundsException`。这两个异常都被单个\
  \ catch 语句捕获。\n\n\n\n\n\n更精确的重抛（precise rethrow）功能限制了可以重新抛出的异常类型，仅限于关联的 `try` 块抛出的检查异常（checked\
  \ exceptions），这些异常未被之前的 `catch` 句处理，并且是参数的子类型或超类型。\n\n虽然这种可能并不经常需要，但现在已经可以使用。为了使更精确的重抛功能生效，`catch`\
  \ 参数必须是有效最终的（effectively final），这意味着它不能在 `catch` 块内部被赋予新值，或者必须显式声明为 `final`。\n\n\
  # 使用异常\n\n异常处理为具有许多动态运行时特性的复杂程序提供了一种强大的控制机制。将 `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的整洁方式。与其他某些使用错误返回代码来指示失败的语言不同，Java\
  \ 使用异常。因此，当一个方法可能会失败时，让它抛出一个异常。\n\n这是一种处理失败模式更干净的方法。最后一点：Java 的异常处理语句不应被视为非局部分支的通用机制。如果你这样做，只会混淆你的代码并使其难以维护。\n\
  \n# 理论题\n\n1. 什么是异常？\n2. 我们如何定义一个 `try` 块？\n3. 我们如何定义一个 `catch` 块？\n4. 列出 Java 中可能发生的一些常见异常类型。给出示例。\n\
  5. 捕获所有类型的异常是必要的吗？\n6. 一个 `try` 块可以使用多少个 `catch` 块？\n7. 创建一个可能产生三种异常的 `try` 块，然后结合必要的\
  \ `catch` 块来恰当地捕获并处理它们。\n8. 什么是 `finally` 块？什么时候以及如何使用？给出一个合适的示例。\n9. 解释异常处理机制如何用于调试程序。\n\
  \n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章：∞ 12 ∞ (多线程编程)\n\n## 引言\n\n线程是程序内部的单一控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\
  \n## 线程对比 进程\n\n通常，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间没有进行任何有用工作。状态切换时间应该尽可能短，以最大化\
  \ CPU 的利用率。\n\n线程也像独立的进程，但它们共享相同的内存和状态。单独的线程也有独立的状态，但与进程状态相比，该状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。与进程相比，线程的上下文切换时间非常小。因此，多线程的情况下，CPU\
  \ 的利用率比多进程的情况下要高。\n\n## 多线程程序\n\n多线程程序包含两个或多个可以并发运行的部分。这种程序的每个部分被称为线程，每个线程定义了一条独立的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\
  \n例如，一个程序可以有三个线程：\n* 一个处理打印。\n* 一个处理编辑。\n* 一个从互联网下载文件。\n\n所有这些线程可能都在并发运行，从而最大化了\
  \ CPU 的利用率。\n\n## 基于进程的多任务处理\n\n大多数操作系统允许我们同时运行两个或多个程序。这被称为基于进程的多任务处理。例如，我们可以运行一个\
  \ Java 程序，同时可能正在编辑 Word 文档。基于进程的多任务处理确保了大多数时候会有程序要执行，因此它增加了 CPU 的利用率。\n\n在基于进程的多任务处理中，程序是调度程序可以分发的最小代码单元。\n\
  \n## 基于线程的多任务处理\n\n在基于线程的任务处理环境中，线程是执行的最小单元。一个进程可以分为若干个并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以编辑一个 Word 文档。\n\n基于线程的任务处理允许我们在单个程序中并发处理多个任务。\n\n## Java 线程模型\n\nJava 运行时系统在许多方面依赖线程，并且所有的类库都是为多线程设计的。这有助于防止周期的浪费。\n\
  \n## 线程生命周期（线程状态）\n\n线程存在于几种状态。线程可以处于运行状态。当它获得 CPU 时间时，它可以处于就绪状态。运行中的线程可以被挂起，这会暂时停止它的活动。挂起的线程随后可以恢复，让它从离开的地方继续执行。线程在等待资源时会处于阻塞状态。在任何时候，线程都可以被终止，从而停止其执行。\n\
  \n#### 1. 新生态 (Newborn State)\n当我们创建一个线程对象时，线程就出生了，并处于新生态。该线程尚未被调度运行。在此状态下，我们只能对它执行以下任一操作：\n\
  * 使用 `start()` 方法调度它运行。\n* 使用 `stop()` 方法杀死它。\n\n如果被调度，它将移动到可运行状态。如果我们在这个状态下尝试使用任何其他方法，将抛出异常。\n\
  \n### 2. 可运行态 (Runnable State)\n可运行状态意味着线程已准备好执行并正在等待处理器的可用。也就是说，线程已经加入了等待执行的线程队列。如果所有线程的优先级相同，则它们以轮询的方式获得执行时间片。\n\
  \n放弃控制权的线程会加入队列末尾并再次等待运行。然而，如果我们想让一个线程在轮到它之前将控制权让给另一个优先级相同的线程，可以通过调用 `yield()` 方法来实现。\n\
  \n### 3. 运行态 (Running State)\n运行意味着处理器已经将时间分配给该线程进行执行。运行中的线程在以下情况之一可能会放弃其控制权：\n\
  * 时间片结束。\n* 它被高优先级线程抢占。\n* 它让出了控制权，即自愿放弃控制权。\n* 它完成了执行。\n* 它被另一个线程停止。\n\n\n\n\n\n\
  *   它已使用 `suspend()` 方法挂起。被挂起的线程可以通过使用 `resume()` 方法恢复。当我们由于某些原因想要挂起线程一段时间，但不想杀死它时，这种方法非常有用。\n\
  *   它被告知等待直到某个事件发生。这是通过使用 `wait()` 方法实现的。可以通过 `notify()` 方法调度线程再次运行。\n*   它正在执行某些\
  \ I/O 操作。\n\n### 4. 阻塞状态 (Blocked State)\n\n当一个线程被阻止进入可运行（runnable）状态并进入运行（running）状态时，该线程被称为阻塞的。这发生在线程为了满足某些要求而挂起、睡眠或等待时。阻塞线程被认为是“不可运行的”，但尚未死亡，因此完全有资格再次运行。\n\
  \n### 5. 死亡状态 (Dead State)\n\n每个线程都有生命周期。运行中的线程在完成其 `run()` 方法的执行后结束生命，这是一种自然死亡。然而，我们可以在任何状态向它发送停止消息来杀死它，从而导致过早死亡。线程可以在出生时就被杀死，或在运行时被杀死，甚至在处于“不可运行”（阻塞状态）时被杀死。\n\
  \n### 线程优先级 (Thread Priorities)\n\nJava 为每个线程分配了一个优先级，该优先级决定了与其他线程相比如何处理该线程。线程优先级是整数，指定一个线程相对于另一个线程的优先级。\n\
  \n作为一个绝对值，优先级是没有意义的；如果只有一个线程在运行，那么高优先线程的运行速度不会比低优先线程更快。相反，线程的优先级用于决定何时从一个运行线程切换到下一个线程。这被称为上下文切换（context\
  \ switch）。决定上下文切换发生的规则非常简单：\n\n*   线程可以自愿（通过自己）放弃控制。这是通过显式地让（yielding）、睡眠、阻塞或等待\
  \ I/O 实现的。在这种情况下，将检查所有其他线程，通常会将 CPU 分给准备就绪的最高优先级线程。\n*   线程可以被高优先级线程抢占。在这种情况下，一个不让出处理器的低优先级线程无论正在做什么，都会被高优先级线程直接抢占。基本上，只要高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理（preemptive\
  \ multitasking）。\n*   某些操作系统支持非抢占式优先级调度。在这种情况下，高优先级线程只有在低优先级线程完成时才有机会运行。\n*   在两个相同优先级的线程竞争\
  \ CPU 周期的情况下，情况会有点复杂。对于像 windows98 操作系统，等优先级的线程必须自愿（通过自己）让出（放弃）控制权给同级线程。如果它们这样做，其他线程将不会运行。\n\
  \n**注意：** 操作系统切换等优先级线程上下文的方式差异可能会产生问题。\n\n## 同步 (Synchronization)\n\n由于多线程为我们的程序引入了异步行为，因此我们在需要时必须有一种方法来强制同步。例如，如果我们希望两个线程通信并共享一个复杂的数据结构（如链表），我们需要某种方法来确保它们不会互相冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时写入数据。Java 使用监视器（monitor）进行线程间同步。我们可以将监视器想象成非常小的盒子，只能容纳一个线程。一旦线程进入监视器，它就可以被用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统以对象的形式暴露，我们的程序必须显式地获取并锁定。Java 提供了一个更整洁的解决方案。\n\n没有 `monitor` 类，相反，每个对象都有自己的隐式监视器，当调用对象的某个\
  \ `synchronized` 方法时，会自动进入。一旦线程进入 `synchronized` 方法，其他任何线程就不能调用同一对象上的任何其他 `synchronized`\
  \ 方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持内置在语言中。\n\n### 消息传递 (Messaging)\n\n使用大多数其他语言编程时，我们必须依赖操作系统在线程之间建立通信。\n\
  \n这无疑增加了开销。相比之下，Java 提供了一种整洁、低成本的方法让两个或多个线程相互通信，通过调用所有对象都拥有的定义方法。Java 的消息系统允许线程进入对象的\
  \ `synchronized` 方法，然后在那里等待直到其他其他线程显式通知它离开。\n\n### Thread 类和 Runnable 接口 (The Thread\
  \ class and the Runnable interface)\n\nJava 的多线程系统基于 `Thread` 类、其方法及其伴侣接口 `Runnable`。该类属于\
  \ `java.lang` 包，因此不需要显式导入。\n\n`Thread` 封装了一个执行线程，由于我们无法直接引用运行中线程的内部状态，我们将通过它的代理——即产生它的\
  \ `Thread` 实例来处理它。要创建一个新线程，我们的程序将扩展 `Thread` 类或实现 `Runnable` 接口。`Thread` 类定义了几个帮助管理线程的方法：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `String getName()` | 返回此线程的名字 |\n| `int getPriority()`\
  \ | 返回此线程的优先级 |\n| `boolean isAlive()` | 测试此线程是否仍在运行 |\n| `void join()` | 等待此线程死亡（终止）\
  \ |\n| `void run()` | 如果此线程是用单独的 `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则此方法什么都不做并返回；如果扩展了线程类并在子类中重写了\
  \ `run()` 方法，则调用被重写的 `run()` 方法。 |\n| `void setName(String name)` |此线程的名字更改为参数 |\n\
  | `static void sleep(long millis)` | 让执行线程睡眠指定的毫秒 |\n| `static void sleep(long millis,\
  \ int nanos)` | 让执行线程睡眠指定的毫秒加上指定的纳秒 |\n| `void start()` | 使此线程开始执行，虚拟机调用 `run` 方法\
  \ |\n| `static void yield()` | 让执行线程对象临时暂停并允许其他线程执行 |\n| `static Thread currentThread()`\
  \ | 返回执行线程对象的引用 |\n\n### 主线程 (The main thread)\n\n当 Java 程序启动时，一个线程立即开始。这通常被称为我们程序的主线程，因为它是程序开始时执行的线程。主线程是创建“子”线程的线程。\n\
  \n尽管主线程是在程序启动时自动创建的，但可以通过 `Thread` 对象对其进行控制。为此，我们通过调用 `currentThread()` 方法获取引用，它是\
  \ `Thread` 的公共静态成员。\n\n该方法返回调用它的线程的引用。一旦有了主方法的引用，我们就可以像控制其他线程一样控制它。\n\n### 示例 12.1\n\
  \n下面的示例演示了如何获取主线程的引用，然后使用 `Thread` 类的方法访问其属性。\n\n```java\nclass CurrentThreadTest\
  \ {\n    public static void main (String args[]) {\n        Thread t = Thread.currentThread();\n\
  \        System.out.println(\"Current thread:\" + t);\n        System.out.println(\"\
  Name:\"+ t.getName());\n        System.out.println(\"Priority:\"+ t.getPriority());\n\
  \        t.setName(\"MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n\
  \        System.out.println(\"After name and priority change :\" + t);\n       \
  \ System.out.println(\"Name:\" + t.getName());\n    }\n}\n```\n\n\n\n\n\n```java\n\
  System.out.println(\"Priority:\" + t.getPriority());\n\nfor (int n=1; n<=5; n++)\
  \ {\n    System.out.println(n);\n    try {\n        Thread.sleep(1000);\n    } catch\
  \ (InterruptedException e) {\n        System.out.println(\"Main thread interrupted\"\
  );\n    }\n}\n```\n\n**输出：**\n```\nCurrent thread:Thread[main,5,main]\nName:main\n\
  Priority:5\nAfter name and priority change :Thread[MyThread,10,main]\nName:MyThread\n\
  Priority:10\n1\n2\n3\n4\n5\n```\n\n**注意 1：** `Thread` 类中的 `sleep()` 方法可能会抛出 `InterruptedException`，这是一个受检异常。如果其他线程想要中断正在睡眠的这个线程，就会发生这种情况。\n\
  \n**注意 2：** 注意当将 `t`（线程引用）作为 `println()` 的参数时产生的输出。它将按顺序显示：线程名称、其优先级以及它的线程组名称。它的优先级是\
  \ 5，这是默认值，而 `main` 也是该线程所属线程组的名称。线程组是一个控制线程集合整体状态的数据结构。\n\n## 创建线程\n\n从最通俗意义来说，我们通过实例化\
  \ `Thread` 类型的对象来创建一个线程。Java 识别了两种实现此目标的方法：\n\n1. 我们可以实现 `Runnable` 接口。\n2. 我们可以扩展\
  \ `Thread` 类本身。\n\n## 实现 Runnable\n\n创建线程最简单的方法是创建一个实现了 `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为\
  \ `run()` 的方法。\n\n```java\npublic void run( )\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()`\
  \ 可以调用其他方法、使用其他类并声明变量，就像 `main` 线程一样。\n\n唯一的区别是，`run()` 为我们程序中另一个并发执行的线程建立了入口点。该线程将在\
  \ `run()` 返回时结束。\n\n在我们创建了一个实现 `Runnable` 的类后，我们将从该类内部使用以下构造函数之一实例化 `Thread` 类型的对象：\n\
  \n- `Thread(Runnable threadObj)`\n- `Thread(Runnable threadObj, String threadName)`\n\
  \n这里 `threadObj` 是调用其 `run` 方法的对象，而 `threadName` 是新线程的名称。在新线程创建后，在我们调用 `start()`\
  \ 方法之前，它将不会开始运行。\n\n`start()` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从 `run()` 方法开始。\n\
  \n### 示例 12.2\n\n```java\nclass A implements Runnable {\n    public void run() {\n\
  \        for(int i=1;i<=5;i++) {\n            System.out.println(\"Child Thread:\"\
  \ + i);\n        }\n        System.out.println(\"Exiting child thread\");\n    }\n\
  }\nclass RunnableTest {\n    public static void main(String args[]) {\n        A\
  \ a1=new A();\n        Thread t1 = new Thread(a1,”Demo Thread”);\n        t1.start();\n\
  \        System.out.println(\"Main thread exiting\");\n    }\n}\n```\n\n**输出：**\n\
  ```\nMain thread exiting\nChild Thread:1\nChild Thread:2\nChild Thread:3\nChild\
  \ Thread:4\nChild Thread:5\nExiting child thread\n```\n\n### 示例 12.3\n\n```java\n\
  class A implements Runnable {\n    Thread t;\n    A() {\n        t= new Thread(this,\
  \ “Demo Thread”);\n        System.out.println(\"Child thread: “+ t);\n        t.start();\n\
  \    }\n    public void run() {\n        for (int i=1; i<=5; i++) {\n          \
  \  System.out.println(\"Child Thread: ”+ i );\n            try {\n             \
  \   Thread.sleep(500);\n            } catch (InterruptedException e) {\n       \
  \         System.out.println(e);\n            }\n        }\n        System.out.println\
  \ (“Exiting thread”);\n    }\n}\nclass RunnableTest {\n    public static void main\
  \ (String args ) {\n        A a1=new A();\n        for (int i=1; i<=5; i++) {\n\
  \            System.out.println(\"Main Thread:\"+ i);\n            try {\n     \
  \           Thread.sleep(1000);\n            } catch(InterruptedException e) {\n\
  \                System.out.println(\"main interrupted”);\n            }\n     \
  \   }\n        System.out.println(“End of thread”);\n    }\n}\n```\n\n**输出：**\n\
  ```\nChild thread: Thread[Demo Thread,5,main]\nMain Thread:1\nChild Thread: 1\n\
  Child Thread: 2\nMain Thread:2\nChild Thread: 3\nChild Thread: 4\nMain Thread:3\n\
  Child Thread: 5\nExiting thread\nMain Thread:4\nMain Thread:5\nEnd of thread\n```\n\
  \n### 扩展 Thread 类\n\n创建线程的第二种方法是创建一个扩展 `Thread` 的类，然后创建该类的实例。扩展类必须重写 `run()` 方法，这是新线程的入口点。它必须调用\
  \ `start()` 来执行新线程。\n\n### 示例 12.4\n\n```java\nclass A extends Thread {\n    A(\
  \ ) {\n        super (“Test Thread”);\n        System.out.println(\"Child thread:”\
  \ + this);\n        start();\n    }\n    public void run () {\n        for (int\
  \ i=1; i<=5; i++) {\n            System.out.println(\"Child Thread:”+i);\n     \
  \       try {\n                sleep(500);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(“thread interrupted”);\n            }\n\
  \        }\n        System.out.println (“Exiting Child thread”);\n    }\n}\nclass\
  \ ThreadTest {\n    public static void main(String args[]) {\n        new A();\n\
  \        for (int i=1; i<=5; i++) {\n            System.out.println(“Main Thread:\
  \ “+i);\n            try {\n                Thread.sleep(1000);\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(“main interrupted”);\n            }\n\
  \        }\n        System.out.println (“Main thread exiting”);\n    }\n}\n```\n\
  \n**输出：**\n```\nChild thread:Testing Thread,5,main]\nMain Thread: 1\nChild Thread:1\n\
  Child Thread:2\nMain Thread: 2\nChild Thread:3\nChild Thread:4\nMain Thread: 3\n\
  Child Thread:5\nExiting Child thread\nMain Thread: 4\nMain Thread: 5\n```\n\n##\
  \ 选择方法\n\n许多程序员认为，只有当类被以某种方式增强或修改时才应该扩展。因此，如果我们不需要重写 `Thread` 的方法，可能只需实现 `Runnable`。\n\
  \n## 创建线程\n\n### 示例 12.5\n\n```java\nclass A implements Runnable {\n    String name;\n\
  \    Thread t;\n    A(String threadName) {\n        name=threadName;\n        t=new\
  \ Thread(this, name);\n        System.out.println(“Child thread:”+t);\n    }\n \
  \   public void run() {\n        for(int i=1;i<=5;i++) {\n            System.out.println(t.getName())+\"\
  :\" + i);\n            try {\n                Thread.sleep(1000);\n            }\
  \ catch (InterruptedException e) {\n                System.out.println(e);\n   \
  \         }\n        }\n        System.out.println(name+ “Exiting”);\n    }\n}\n\
  class MultiThreadTest {\n    public static void main(String args[]) {\n        A\
  \ a1=new A(“One”);\n        A a2=new A (“Two”);\n        A a3=new A (“Three”);\n\
  \        try {\n            Thread.sleep(10000);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(“main thread interrupted”);\n        }\n\
  \        System.out.println (“Main thread exiting”);\n    }\n}\n```\n\n\n\n\n\n\
  ```\n}\n}\n```\n输出:\n```\nChild thread:Thread[One,5,main]\nChild thread:Thread[Two,5,main]\n\
  Child thread:Thread[Three,5,main]\nOne:1\nTwo:1\nThree:1\nOne:2\nTwo:2\nThree:2\n\
  One:3\nTwo:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\nTwo:5\nThree:5\nOneExiting\n\
  TwoExiting\nThreeExiting\nMain thread exiting\n``` 使用 `isAlive()` 和 `join()` 方法进行某种线程排序\n\
  \n我们通常希望主线程最后结束。实现这一目标的方法之一是在 `main` 中调用 `sleep()`。这是一种相当粗糙（简略）的方法。有两种方法可以判断一个线程是否已完成。首先，我们可以对线程调用\
  \ `isAlive()`。该方法由 `Thread` 类定义，其通用形式如下：\n\n```java\nfinal boolean isAlive()\n```\n\
  \n如果调用方法的线程仍在运行，则 `isAlive()` 方法返回 `true`。否则返回 `false`。虽然 `isAlive()` 有时很有用，但我们更常用的一个等待线程完成的方法是\
  \ `join()`，所示所示：\n\n```java\nfinal void join() throws InterruptedException\n```\n\
  \n该方法会一直等待调用它的线程终止为止。`join()` 的其他形式允许我们指定等待指定线程终止的最长时间。\n\n接下来的示例使用了 `join()` 来确保主线程是最后一个停止的。它还演示了\
  \ `isAlive()` 方法。\n\n### 示例 12.6\n\n```java\nclass A implements Runnable\n{\n  String\
  \ name;\n  Thread t;\n  A(String threadName)\n  {\n    name=threadName;\n    t=new\
  \ Thread(this,name);\n    System.out.println(\"Child thread:\"+t);\n    t.start();\n\
  \  }\n  public void run()\n  {\n    for(int i=1;i<=5;i++)\n    {\n      System.out.println(name\
  \ + \":\"+ i );\n      try\n      {\n        Thread.sleep(1000);\n      }\n    \
  \  catch(InterruptedException e)\n      {\n        System.out.println(e);\n    \
  \  }\n    }\n    System.out.println(name + \"Exiting\");\n  }\n}\nclass DemoJoin\n\
  {\n  public static void main(String args[])\n  {\n    A ob1=new A(\"One\");\n  \
  \  A ob2=new A(\"Two\");\n    A ob3=new A(\"Three\");\n    System.out.println(\"\
  Thread One is alive?:\"+ob1.t.isAlive());\n    System.out.println(\"Thread Two is\
  \ alive?:\"+ob2.t.isAlive());\n    System.out.println(\"Thread Three is alive?:\"\
  +ob3.t.isAlive());\n    try\n    {\n      ob3.t.join();\n      ob2.t.join();\n \
  \     ob1.t.join();\n    }\n    catch(InterruptedException e)\n    {\n      System.out.println(\"\
  main thread interrupted\");\n    }\n    System.out.println(\"Thread One is alive?:\"\
  + ob1.t.isAlive());\n    System.out.println(\"Thread Two is alive?:\"+ ob2.t.isAlive());\n\
  \    System.out.println(\"Thread Three is alive?:\"+ ob3.t.isAlive());\n    System.out.println(\"\
  Main thread exiting\");\n  }\n}\n```\n输出:\n```\nChild thread:Thread[One,5,main]\n\
  Child thread:Thread[Two,5,main]\nChild thread:Thread[Three,5,main]\nThread One is\
  \ alive?:true\nThread Two is alive?:true\nThread Three is alive?:true\nOne:1\nTwo:1\n\
  Three:1\nOne:2\nTwo:2\nThree:2\nOne:3\nTwo:3\nThree:3\nOne:4\nTwo:4\nThree:4\nOne:5\n\
  Two:5\nThree:5\nOneExiting\nTwoExiting\nThreeExiting\nThread One is alive?:false\n\
  Thread Two is alive?:false\nThread Three is alive?:false\nMain thread exiting\n\
  ```\n\n### 优先级\n\n优先级被线程调度器用于决定何时允许每个线程运行。与低优先级线程相比，高优先级的线程会被优先调度。高优先级线程也可以抢占低优先级线程。例如，当一个低优先级线程正在运行，而一个高优先级线程从睡眠或等待\
  \ I/O 中恢复时，它将抢占该低优先级线程。理论上，等优先级的线程应该获得相同的 CPU 访问权限。但 Java 设计用于各种环境。某些环境实现多任务的方式与其他不同。为了安全，具有相同优先级的线程应该偶尔让出控制权。这确保了所有线程在非抢占式操作系统都有运行的机会。在实践中，即使在非抢占环境中，大多数线程也不可避免地遇到等待\
  \ I/O 等情况。当这种情况发生时，阻塞线程被挂起，其他线程可以运行。对于 CPU 密集型线程，我们应该使其偶尔让，以便其他线程运行。\n\n要设置线程的优先级，使用\
  \ `setPriority()` 方法，它是 `Thread` 的成员方法。其通用形式如下：\n\n```java\nfinal void setPriority(int\
  \ level)\n```\n\n`level` 的值必须在 `Thread.MIN_PRIORITY` 到 `Thread.MAX_PRIORITY` 范围内。这些值值是\
  \ 1 和 10。要将线程返回默认优先级，可以指定 `Thread.NORM_PRIORITY`，它目前是 5。可以通过调用 `Thread` 类的 `getPriority()`\
  \ 方法获取当前的优先级设置，所示：\n\n```java\nfinal void getPriority()\n```\n\nJava 版本在调度方面存在巨大差异。不一致性产生于我们线程于抢占行为。获得可预测跨平台行为的最安全方法是使用主动放弃\
  \ CPU 的线程。下面的示例演示了两个不同优先级的线程，它们在抢占式平台上的运行方式与非抢占式平台不同。\n\n### 示例 12.7\n\n```java\n\
  class Clicker implements Runnable\n{\n  long click = 0;\n  Thread t;\n  volatile\
  \ boolean running=true;\n  Clicker (int p)\n  {\n    t=new Thread (this);\n    t.setPriority\
  \ (p);\n  }\n  public void run()\n  {\n    while (running)\n    {\n      click++;\n\
  \    }\n  }\n  void stop()\n  {\n    running = false;\n  }\n  void start()\n  {\n\
  \    t.start();\n  }\n}\nclass HiLoPri\n{\n  public static void main (String args[])\n\
  \  {\n    Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n    Clicker\
  \ hi = new Clicker(Thread.NORM_PRIORITY+1);\n    Clicker lo = new Clicker(Thread.NORM_PRIORITY-1);\n\
  \    lo.start(); hi.start();\n    try\n    {\n      Thread.sleep (10000);\n    }\n\
  \    catch (InterruptedException e)\n    {\n      System.out.println(e);\n    }\n\
  \    lo.stop(); hi.stop();\n    try\n    {\n      hi.t.join();\n      lo.t.join();\n\
  \    }\n    catch (InterruptedException e)\n    {\n      System.out.println(e);\n\
  \    }\n    System.out.println(\"Low : \" + lo.click);\n    System.out.println(\"\
  High : \" + hi.click);\n  }\n}\n```\n输出:\n```\nLow  : 63660819\nHigh : 2086505403\n\
  ```\n\n\n\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源在一次只有一个线程使用。实现这一目标的过程被称为同步。\n\n同步的关键概念是监视器（monitor，也称为信号量\
  \ semaphone）。监视器是一个用作互斥锁的对象。在给定时间内，只有一个线程可以拥有监视器。\n\n当一个线程获取锁时，被认为进入了监视器。所有其他尝试进入被锁监视器的线程将被挂起，直到第一个线程退出监视器。这些其他线程被称为正在等待监视器。拥有监视器的线程如果需要，可以重新进入同一个监视器。我们可以通过两种方式之一同步我们的代码：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用 synchronized 方法\n\
  \n在 Java 中，同步是简单的，因为所有对象都有一个与其关联的隐式监视器。要进入对象的监视器，只需调用用 `synchronized` 关键字修改的方法。当一个线程在\
  \ `synchronized` 方法内部时，所有尝试调用该方法（或调用同一实例上的任何其他 `synchronized` 方法）的线程都必须 `wait()`。要退出监视器并将对象的控制权交给下一个等待的线程，监视器的所有者只需从\
  \ `synchronized` 方法返回即可。\n\n### 示例 12.8\n\n下面的程序说明由于三个线程并发运行，它们生成的输出会发生混合。\n\n```java\n\
  class A\n{\n  void display(String msg)\n  {\n    System.out.print(\"[\" + msg);\n\
  \    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    obj.display(msg);\n  }\n}\n\
  class Synch1\n{\n  public static void main(String args[])\n  {\n    A a1 = new A();\n\
  \    B b1 = new B(a1,\"Hello\");\n    B b2 = new B(a1,\"World\");\n    B b3 = new\
  \ B(a1,\"Matrix\");\n  }\n} \n```\n\n输出:\n```\n[Hello[World[Matrix]\n]\n]\n```\n\
  \n正如我们看到的，通过调用 `sleep()`，`call()` 方法允许执行切换到另一个线程。这导致了三个消息字符串的混合输出。在这个程序中，没有任何东西阻止这三个线程同时在同一个对象上调用同一个方法。\n\
  \n这被称为竞态条件（race condition），因为这三个线程正在竞争以完成该方法。这个示例使用 `sleep()` 使效果变得可重复且明显。在大多数情况下，竞态条件更加微妙且难以预测，因为我们无法确定上下文切换何时何时发生。这可能导致程序在这一次运行时正确，而在下次运行时错误。\n\
  \n要做到这一点，我们只需要在方法 `display()` 的定义之前加上 `synchronized` 关键字。这防止了任何线程在另一个线程使用 `display()`\
  \ 时进入该方法。\n\n### 示例 12.9\n\n混合问题通过简单地将 `call()` 方法声明为 `synchronized` 方法来解决。\n\n\
  ```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print(\"\
  [\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    obj.display(msg);\n  }\n}\n\
  class Synch2\n{\n  public static void main(String args[])\n  {\n    A a1 = new A();\n\
  \    B b1 = new B(a1,\"Hello\");\n    B b2 = new B(a1,\"World\");\n    B b3 = new\
  \ B(a1,\"Matrix\");\n  }\n}\n```\n\n输出:\n```\n[Hello]\n[World]\n[Matrix]\n```\n\
  注意：一旦线程进入了实例上的任何同步方法，其他线程就无法进入同一实例上的任何同步方法。然而，该实例上的非同步方法将继续可以调用。\n\n## 使用 synchronized\
  \ 语句\n\n虽然在我们创建的类中创建同步方法是实现同步的一种简单且有效的方法，但它在所有情况下都不适用。为了理解为什么，请考虑以下情况。假设我们想要同步访问并非设计用于多线程访问的类的对象。也就是说，该类没有使用同步方法。此外，该类不是由我们创建的，而是由第三方创建；我们无法访问源代码。因此，我们无法在类内部适当的方法上添加\
  \ `synchronized` 修饰符。如何通过同步访问该类的对象呢？\n\n解决方案是将对方法的调用放在 `synchronized` 块中。同步语句通的形式如下：\n\
  \n```java\nsynchronized(object)\n{\n```\n这里，`object` 是指向同步对象的引用。`synchronized` 块确保只有当前线程拥有该监视器。\n\
  \n### 示例 12.10\n\n使用 `synchronized` 块的另一种版本是：\n\n```java\nclass A\n{\n  void display(String\
  \ msg)\n  {\n    System.out.print(\"[\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n\
  \      }\n      catch(InterruptedException e)\n      {\n        System.out.println(e);\n\
  \      }\n      System.out.println(\"]\");\n  }\n}\nclass B implements Runnable\n\
  {\n  A obj;\n  String msg;\n  Thread t;\n  B(A obj1, String m)\n  {\n    msg = m;\n\
  \    obj = obj1;\n    t = new Thread(this);\n    t.start();\n  }\n  public void\
  \ run()\n  {\n    synchronized(obj)\n      {\n        obj.display(msg);\n      }\n\
  \  }\n}\nclass Synch3\n{\n  public static void main(String args[])\n  {\n    A a1\
  \ = new A();\n    B b1 = new B(a1,\"Hello\");\n    B b2 = new B(a1,\"World\");\n\
  \    B b3 = new B(a1,\"Matrix\");\n  }\n}\n```\n输出:\n```\n[Hello]\n[World]\n[Matrix]\n\
  ```\n\n## 在不同对象上多次调用同一方法\n\n### 示例 12.11\n\n线程可以在不同对象上调用同步方法，因为每个对象都有不同的锁。这再次导致了混合输出。\n\
  \n```java\nclass A\n{\n  synchronized void display(String msg)\n  {\n    System.out.print\
  \ \"[\" + msg);\n    try\n      {\n        Thread.sleep(1000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      System.out.println(\"\
  ]\");\n  }\n}\nclass B implements Runnable\n{\n  A obj;\n  String msg;\n  Thread\
  \ t;\n  B(A obj1, String m)\n  {\n    msg = m;\n    obj = obj1;\n    t = new Thread(this);\n\
  \    t.start();\n  }\n  public void run()\n  {\n    obj.display(msg);\n  }\n}\n\
  class Synch4\n{\n  public static void main(String args[])\n  {\n    A a1 = new A();\n\
  \    A a2 = new A();\n    A a3 = new A();\n    B b1 = new B(a1,\"Hello\");\n   \
  \ B b2 = new B(a2,\"World\");\n    B b3 = new B(a3,\"Matrix\");\n  }\n}\n```\n\n\
  输出:\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n\n\n\n# 使用静态同步方法\n\n### 示例 12.12\n\n\
  在下面的示例中，尽管对不同的对象调用了 `display()` 方法，但输出并没有混杂。这是因为 `display()` 方法是 `static`（静态的），因此获取的锁针对整个类\
  \ `A`，而不是针对单个对象。\n\n```java\nclass A\n{\n    static synchronized void display(String\
  \ msg)\n    {\n      System.out.print(\"[\" + msg);\n      try\n      {\n      \
  \  Thread.sleep(1000);\n      }\n      catch(InterruptedException e)\n      {\n\
  \        System.out.println(e);\n      }\n      System.out.println(\"]\");\n   \
  \ }\n}\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n    Thread\
  \ t;\n    B(A obj1, String m)\n    {\n      msg = m;\n      obj = obj1;\n      t\
  \ = new Thread(this);\n      t.start();\n    }\n    public void run()\n    {\n \
  \     obj.display(msg);\n    }\n}\nclass Synch5\n{\n    public static void main(String\
  \ args[])\n    {\n      A a1 = new A();\n      A a2 = new A();\n      A a3 = new\
  \ A();\n      B b1 = new B(a1,\"Hello\");\n      B b2 = new B(a2,\"World\");\n \
  \     B b3 = new B(a3,\"Matrix\");\n    }\n}\n```\n\n输出:-\n```\n[Hello]\n[World]\n\
  [Matrix]\n```\n\n# 线程间通信\n\n前面提到，多线程通过将任务划分为离散的逻辑单元来取代事件循环编程。线程还证明了次要优点：它们消除了轮询（polling）。轮询通常通过一个循环实现，用于反复检查某些条件。一旦条件为真，就会采取相应的行动。\n\
  \n这浪费了 CPU 周期。例如，考虑经典的队列问题，一个线程在生产数据，另一个线程在消费数据。为了让问题更具交互性，假设生产者必须等待消费者完成任务后才能生成更多数据。在轮询系统中，消费者在等待生产者生产时会浪费许多\
  \ CPU 周期。一旦生产者完成，它就会开始轮询，浪费更多的 CPU 周期等待消费者完成，以此此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法在 `Object` 类中实现为 `final` 方法，因此所有类都拥有它们。这三个方法只能在\
  \ `synchronized` 上下文中调用。使用这些方法有某些规则。\n\n- `wait()` 告诉调用线程放弃监视器并睡眠，直到另一个线程进入同一个监视器并调用\
  \ `notify()`。\n- `notify()` 唤醒在同一对象上调用过 `wait` 的线程（通常是第一个）。\n- `notifyAll()` 唤醒在同一对象上调用过\
  \ `wait()` 的所有线程。通常优先级最高的线程会首先运行。这些这些方法在 `Object` 类中声明，如下所示：\n\n```java\nfinal void\
  \ wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n### 示例 12.13\n\n下面的示例程序错误地实现了一个简单的生产者/消费者问题形式。它包含四个类：`Q`，我们试图同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消费队列条目的线程对象；以及\
  \ `PC`，创建单个 `Q`、`Producer` 和 `Consumer` 的微型类。\n\n```java\nclass Q\n{ \n    int n;\n\
  \    synchronized int get()\n    { \n      System.out.println(\"Got:\"+n);\n   \
  \   return n;\n    }\n    synchronized void put(int n)\n    {\n      this.n=n;\n\
  \      System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\n\
  {\n    Q q1;\n    Producer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Producer\"\
  ).start();\n    }\n    public void run()\n    { \n      int i=0;\n      while(true)\n\
  \      { \n        q1.put(++i);\n      }\n    }\n}\nclass Consumer implements Runnable\n\
  {\n    Q q1;\n    Consumer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\"\
  ).start();\n    }\n    public void run()\n    { \n      while (true)\n      { \n\
  \        q1.get();\n      }\n    }\n}\nclass PC\n{\n    public static void main(String\
  \ args[])\n    {\n      Q q1=new Q();\n      Producer(q1);\n      Consumer(q1);\n\
  \      System.out.println(\"Press Control-C to stop\");\n    }\n}\n``` 尽管 `Q` 上的\
  \ `put()` 和 `get()` 方法是同步的，但没有什么能阻止生产者超过消费者，也没有什么阻止消费者两次消费同一个值。因此，我们可能会得到如下的错误输出：\n\
  \n输出：\n```\nPress Control-C to stop\nPut:1\nPut:2\nPut:3\nPut:4\nPut:5\nPut:6\n\
  Put:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nPut:8\nPut:9\nPut:10\nPut:11\n\
  Put:12\nPut:13\nPut:14\nPut:15\nGot:15\nGot:15\nGot:15\nGot:15\nGot:15\n```\n\n\
  ## 12.14\n\n在 Java 中编写此程序的正确方法是在两个方向上使用 `wait()` 和 `notify()`，如下所示：\n\n```java\n\
  class Q\n{ \n    int n;\n    boolean valueSet=false;\n    synchronized int get ()\n\
  \    { \n      if(!valueSet)\n      { \n        try\n        { \n          wait();\n\
  \        }\n        catch (InterruptedException e)\n        { \n          System.out.println(e);\n\
  \        }\n      }\n      System.out.println(\"Got :\" + n);\n      valueSet =\
  \ false;\n      notify();\n      return n;\n    }\n    synchronized void put (int\
  \ n)\n    { \n      if(valueSet)\n      { \n        try\n        { \n          wait();\n\
  \        }\n        catch(InterruptedException e)\n        { \n          System.out.println(e);\n\
  \        }\n      }\n      this.n=n;\n      valueSet =true;\n      System.out.println(\"\
  Put :\" + n);\n      notify();\n    }\n}\nclass Producer implements Runnable\n{\
  \ \n    Q q1;\n    Producer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Producer\"\
  ).start();\n    }\n    public void run()\n    { \n      int i=0;\n      while(true)\n\
  \      { \n        q1.put(++i);\n      }\n    }\n}\nclass Consumer implements Runnable\n\
  { \n    Q q1;\n    Consumer(Q q2)\n    {\n      q1=q2;\n      new Thread(\"Consumer\"\
  ).start();\n    }\n    public void run()\n    { \n      while (true)\n      { \n\
  \        q1.get();\n      }\n    }\n}\nclass PC2\n{\n    public static void main(String\
  \ args[])\n    {\n      System.out.println(\"Press Control-C to stop\");\n     \
  \ Q q1=new Q();\n      Producer(q1);\n      Consumer(q1);\n    }\n}\n```\n\n## 死锁\n\
  \n我们需要避免的与多任务处理特别的一种特殊错误是死锁，它发生在两个线程对一对同步对象存在循环依赖时。例如，假设一个线程进入了对象 X 的监视器，另一个线程进入了对象\
  \ Y 的监视器。如果 X 中的线程尝试调用 Y 的任何同步方法，它将如预期地阻塞。然而，如果 Y 中的线程反过来尝试调用 X 的任何同步方法，该线程将永远等待，因为为了访问\
  \ X，它必须释放对 Y 的锁，以便第一个线程完成。死锁是一个很难调试的错误，原因有两个：\n\n(i) 在通常情况下，它只在两个线程的时间片恰恰合适时才会偶尔发生。\n\
  (ii) 它可能涉及两个以上的线程和两个同步对象。\n\n### 示例 12.15\n\n```java\nclass A\n{\n    synchronized\
  \ void foo(B b1)\n    {\n```\n\n\n\n\n\n```java\nSystem.out.println(\"Method foo\
  \ called and then blocked\");\ntry {\n    Thread.sleep(1000);\n} catch(InterruptedException\
  \ e) {\n    System.out.println(e.getMessage());\n}\nSystem.out.println(\"Trying\
  \ to call b1.last()\");\nb1.last();\n\nsynchronized void last() {\n    System.out.println(\"\
  This will not be printed\");\n}\n\nclass B {\n    synchronized void bar(A a1) {\n\
  \        System.out.println(\"Method bar called and then blocked\");\n        try\
  \ {\n            Thread.sleep(1000);\n        } catch(InterruptedException e) {\n\
  \            System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call a1.last()\");\n        a1.last();\n    }\n    synchronized void last()\
  \ {\n        System.out.println(\"This will not be printed\");\n    }\n}\n\nclass\
  \ DeadLock implements Runnable {\n    A a1 = new A();\n    B b1 = new B();\n   \
  \ DeadLock() {\n        Thread t = new Thread(this);\n        t.start();\n     \
  \   a1.foo(b1);\n    }\n    public void run() {\n        b1.bar(a1);\n    }\n  \
  \  public static void main(String args[]) {\n        new DeadLock();\n    }\n}\n\
  ```\n\nOutput:\n```\nMethod foo called and then blocked\nMethod bar called and then\
  \ blocked\nTrying to call b1.last()\nTrying to call a1.last()\n```\n\n### 在 Java\
  \ 1.1 及之前的版本中挂起、恢复和停止线程：\n\n在 Java 2 之前，`suspend()` 和 `resume()` 被 `Thread` 类定义，用于暂停和重启线程的执行。它们的形式如下所示。\n\
  \n```java\nfinal void suspend()\nfinal void resume()\n```\n\n#### 示例 12.16:\n\n\
  ```java\nclass A implements Runnable {\n    String name;\n    Thread t;\n    A(String\
