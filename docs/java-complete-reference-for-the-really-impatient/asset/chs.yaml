  \n## Double 方法\n\n- `compareTo(Double other)`: 比较两个 `Double` 对象。\n- `compare(double\
  \ d)`: 比较指定的 `double` 值。\n- `equals(Object obj)`: 将此对象与指定的对象比较。\n- `hashCode()`:\
  \ 返回此 `Double` 的哈希值。\n\n## Float 方法\n\n- `static compare(float f1, float f2)`: 比较指定的\
  \ `float` 值。\n- `compareTo(Float anotherFloat)`: 比较两个 `Float` 对象。\n- `equals(Object\
  \ obj)`: 将此对象与指定的对象比较。\n- `hashCode()`: 返回此 `Float` 的哈希值。\n- `isInfinite()`: 如果此\
  \ `Float` 值为无穷大。\n- `static boolean isInfinite(float v)`: 如果指定的数字为无穷大。\n- `isNaN()`:\
  \ 如果此 `Float` 值为非数字（NaN）。\n- `static boolean isNaN(float v)`: 如果指定的数字为非数字（NaN）。\n\
  \n## Double 方法\n\n`Double` 类的方法与 `Float` 类几乎相同，只是用 `double` 替换了 `float`。\n\n## Byte\
  \ 方法\n\n- `compareTo(Byte anotherByte)`: 比较两个 `Byte` 对象。\n- `static decode(String\
  \ nm)`: 返回由字符串 `nm` 指定的 `Byte` 对象。接受十进制、十六进制和八进制数字。\n- `equals(Object obj)`: 将此对象与指定的对象比较。\n\
  - `hashCode()`: 返回此 `Byte` 的哈希值。\n\n## Short 方法\n\n`Short` 类的方法与 `Byte` 类相同，但在 `short`\
  \ 和 `Short` 单词上进行了替换。\n\n## Integer 方法\n\n某些方法与 `Byte` 或 `Short` 类相同。其他方法描述如下：\n\
  \n- `static String toBinaryString(int i)`: 返回整数参数的二进制字符串表示。\n- `static String toHexString(int\
  \ i)`: 返回整数参数的十六进制字符串表示。\n- `static String toOctalString(int i)`: 返回整数参数的八进制字符串表示。\n\
  \n## Long 方法\n\n`Long` 类的方法与 `Integer` 类几乎相同。\n\n## Character 类\n\n`Character` 类将原始类型\
  \ `char` 包装在对象中。\n\n### 构造函数\n\n`Character(char value)`: 创建一个新的分配的 `Character` 对象，表示指定的\
  \ `char` 值。\n示例：`Character chObj = new Character('A');`\n\n### 方法\n\n- `char charValue()`:\
  \ 返回此 `Character` 对象的值。\n- `static boolean isDefined(char ch)`: 判断指定的字符是否在 Unicode\
  \ 中。\n- `static boolean isDigit(char ch)`: 判断指定的字符是否为数字。\n- `static boolean isJavaIdentifierPart(char\
  \ ch)`: 判断指定的字符除第一个字符外是否可以作为 Java 标识符的一部分。\n\n\n\n\n\n### Character 类方法\n\n| `static\
  \ boolean isJavaIdentifierStart(char ch)` 确定指定的字符是否可以作为 Java 标识符的起始字符。 |\n| `static\
  \ boolean isLetter(char ch)` 确定指定的字符是否为字母。 |\n| `static boolean isLetterorDigit(char\
  \ ch)` 确定指定的字符是否为字母或数字。 |\n| `static boolean isLowerCase(char ch)` 确定指定的字符是否为小写字母。\
  \ |\n| `static boolean isSpaceChar(char ch)` 确定指定的字符是否为 Unicode 空格字符。 |\n| `static\
  \ boolean isTitleCase(char ch)` 确定指定的字符是否为标题大小写字符。 |\n| `static boolean isUpperCase(char\
  \ ch)` 确定指定的字符是否为大写字母。 |\n| `static boolean isWhitespace(char ch)` 根据 Java 确定指定的字符是否为空白字符。\
  \ |\n| `static char toLowerCase(char ch)` 将字符参数转换为小写。 |\n| `static char toUpperCase(char\
  \ ch)` 将字符参数转换为大写。 |\n| `static char toTitleCase(char ch)` 将字符参数转换为标题大小。 |\n| `int\
  \ compareTo(Character anotherCharacter)` 以数值比较两个 Character 对象。 |\n| `int hashcode()`\
  \ 返回此 Character 的哈希码。 |\n| `boolean equals(Object obj)` 将此对象与指定的对象进行比较。 |\n\n###\
  \ Boolean 类\n\n`Boolean` 类将原始类型 `Boolean` 的值封装在对象中。\n\n### 构造函数\n\n| `Boolean(Boolean\
  \ value)` 分配一个表示值参数的 `Boolean` 对象。 |\n| `Boolean(String s)` 如果字符串参数不为空且在不区分大小写的情况下等于字符串“true”，则分配一个表示真值\
  \ true 的 `Boolean` 对象。 |\n\n#### Boolean 类的方法\n\n| `boolean booleanValue()` 将此 `Boolean`\
  \ 对象的值作为 `Boolean` 原始类型返回。 |\n| `int compareTo(Boolean b)` 将此 `Boolean` 实例与另一个进行比较。\
  \ |\n| `boolean equals(Object obj)` 当且仅当参数不为空且是一个表示与此对象相同布尔值的 `Boolean` 对象时，返回 true。\
  \ |\n| `static Boolean getBoolean(String name)` 仅且仅当由参数命名的系统属性存在且等于字符串“true”时，返回\
  \ true。 |\n| `int hashCode()` 返回此 `Boolean` 对象的哈希码。 |\n| `static boolean parseBoolean(String\
  \ s)` 将字符串参数解析为布尔值。 |\n| `String toString()` 返回表示此 `Boolean` 值的 `String` 对象。 |\n\
  | `static String toString(boolean b)` 返回表示指定布尔值的 `String` 对象。 |\n| `static Boolean\
  \ valueOf(boolean b)` 返回一个表示指定布尔值的 `Boolean` 实例。 |\n| `static Boolean valueOf(String\
  \ s)` 返回一个由指定字符串表示的 `Boolean`。 |\n\n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\
  \ ∞ 15 ∞\n## (Java 中的输入/输出)\n\n## 引言\n\nJava 程序通过流（streams）执行 I/O 操作。流是一个产生或消耗信息的抽象。流通过\
  \ Java I/O 系统与物理设备相连。\n\n所有流的行为方式都是相同的，即使它们连接的实际物理设备有所不同。因此，相同的 I/O 类和方法可以应用于任何类型的设备。\n\
  \n这意味着输入流可以抽象许多不同类型的输入：从磁盘文件、键盘或网络套字。同样，输出流可以指向控制台、磁盘文件或网络连接。\n\n流是处理输入/输出的一种整洁方式，而无需让我们代码中的每个部分都理解键盘和网络之间的区别（例如）。Java\
  \ 在 `java.io` 包中定义的类层次结构中实现了流。\n\n![PhotoFunia-5b0b11f_o](img/image083.jpg)\n\n\
  **(Java 程序与 I/O 设备的关系)**\n\n将数据从一个流发送到另一个流（类似于一个管道馈入另一个管道）的概念使得 Java 流成为文件处理的强大工具。我们可以使用一系列简单的流操作构建一个复杂的文件处理序列。\n\
  \n此功能可用于在流的流水线中过滤数据，以便获得所需格式的数据。例如，我们可以使用一个流获取二进制格式的原始数据，然后使用另一个串联的流将其转换为整数。\n\n\
  ## 输入流和输出流\n\nJava 流分为两种基本类型：通常的输入流和输出流。输入流从源提取（即读取）数据并将其发送到程序。\n\n![image](img/image017.png)\n\
  \n程序在数据源上连接并打开一个输入流，然后顺序读取数据。类似地，程序在数据终点连接并打开一个输出流，并按顺序写入数据。在这两种情况下，程序都不知道端点的细节（即源和目的地）。\n\
  \n## 字节流和字符流\n\nJava2 定义了两种流：字节流（Byte Streams）和字符流（Character Streams）。字节流为处理字节的输入输出提供了方便的方法。例如，在读取或写入二进制数据时使用字节流。字符流为处理字符的输入输出提供了方便的方法。它们使用\
  \ Unicode，因此可以国际化。此外，在某些情况下，字符流比字节流更高效。Java 的原始版本（Java 1.0）不包含字符流，此时所有的 I/O 都是面向字节的。\n\
  \n字符流是在 Java 1.1 中引入的，某些面向字节的类和方法已被废弃。\n\n**注意：** 在底层，所有 I/O 仍然是面向字节的。字符流仅提供了处理字符的方便且高效的方法。\n\
  \n这两类可以根据其目的进一步分类。字节流和字符流类包含了独立处理各种类型输入输出的特殊类。\n\n我们还可以根据读取或写入的源或目的地对流进行交叉分组。源（或目的地）可以是内存、文件或管道。\n\
  \n––––––\n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_logo.jpg](img/image053.jpg)\n\
  \n![sss](img/image67.jpg)\n\n## 字节流概述\n\n字节流类通过两个层次结构定义。顶部有两个抽象类：\n\n1. `InputStream`\n\
  2. `OutputStream`\n\n这些抽象类都有多个具体的子类，用于处理设备之间的差异，例如磁盘文件、网络连接和内存缓冲区。\n\n### InputStream\
  \ 类\n\n读取 8 位字节的 InputStream 类包括一个名为 `InputStream` 的超类以及若干支持各种输入功能的子类。\n\n––––––\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_logo.jpg](img/image000.jpg)\n\
  \n![abc](img/image035.png)\n\n输入流类的层次结构。\n\n![ab](img/image081.png)\n\n输入流类的层次结构。\n\
  \n### InputStream 类\n\n超类 `InputStream` 是一个抽象类，定义了执行输入功能的方法，例如：\n\n*   读取字节。\n*\
  \   关闭流。\n*   标记流中的位置。\n*   跳过流内容。\n*   查找流中的字节数。\n\n**InputStream 类的方法：**\n\n```\n\
  int available()给出输入中可用的字节数（必须由子类重写）。InputStream 类的 available 方法始终返回 0。\n\nvoid close()关闭此输入流并释放与流相关的系统资源。InputStream\
  \ 的 close 方法无操作。\n\nvoid mark(int readlimit)标记此输入流中的当前位置。InputStream 的 mark 方法无操作。\n\
  \nboolean markSupported()测试此输入流是否支持 mark 和 reset 方法。InputStream 的 markSupported\
  \ 方法返回 false。\n```\n\n\n\n\n### InputStream 方法\n\n| `abstract int read()` | 从输入流中读取下一个字节数据。子类必须提供此方法的实现。\
  \ |\n| `int read(byte[] b)` | 从输入流中读取若干字节并将它们存储到缓冲区数组 `b` 中。返回实际读取的字节数的整数值。 |\n\
  | `int read(byte[] b, int offset, int len)` | 从输入流中读取若干字节并从参数 `offset` 指定的位置开始将它们存储到缓冲区数组\
  \ `b` 中。返回实际读取的字节数的整数值。 |\n| `void reset()` | 将此流重新定位到上一次对此输入流调用 `mark` 方法时的位置。`InputStream`\
  \ 的 `reset` 方法不做任何操作，并始终抛出 `IOException`。 |\n| `long skip(long n)` | 跳过并丢弃从此输入流中的多达\
  \ `n` 个字节的数据，并返回实际跳过的字节数。 |\n\n## DataInput 接口\n\n`DataInput` 是一个接口，定义了从 `InputStream`\
  \ 读取原始数据类型的方法。\n\n### DataInput 接口的方法：\n\n| `boolean readBoolean()` | 读取一个输入字节，如果该字节非零则返回\
  \ true，如果该字节为零则返回 false。 |\n| `byte readByte()` | 读取并返回一个字节。 |\n| `char readChar()`\
  \ | 读取一个输入字符并返回其值。 |\n| `double readDouble()` | 读取八个输入字节并返回一个 double 值。 |\n| `float\
  \ readfloat()` | 读取四个输入字节并返回一个 float 值。 |\n| `void readFully(byte[] b)` | 从输入流中读取若干字节并将它们存储在缓冲区数组\
  \ `b` 中。如果此流在读取所有字节之前到达末尾，此方法将抛出 `EOFException`。 |\n| `void readFully(byte[] b,\
  \ int off, int len)` | 从输入流中读取 `len` 个字节并从 `off` 指定的位置开始将它们存储在缓冲区数组 `b` 中。如果此流在读取所有字节之前到达末尾，此方法将抛出\
  \ `EOFException`。 |\n| `int readInt()` | 读取四个输入字节并返回一个 `int` 值。 |\n| `String readLine()`\
  \ | 从输入流中读取下一行。 |\n| `long readLong()` | 读取八个输入字节并返回一个 `long` 值。 |\n| `short readShort()`\
  \ | 读取两个输入字节并返回一个 `short` 值 |\n| `Strig readUTF()` | 读取使用修改 UTF-8 格式编码的字符串。 |\n\
  | `int skipBytes(int n)` | 尝试从输入流中跳过 `n` 个字节的数据，并丢弃跳过的字节。返回实际跳过的字节数。 |\n\n## InputStream\
  \ 类总结：\n\n`FilterInputStream` 包含另一个输入流，它将其作为基本数据源，并可能在此过程中转换数据以提供额外功能。\n\n`FilterInputStream`\
  \ 类本身简单地重写了 `InputStream` 的所有方法，这些版本会将所有请求传递给包含的输入流。`FilterInputStream` 的子类可以进一步重写其中一些方法，并可能提供额外的方法和字段。\n\
  \n请注意，`DataInputStream` 类继承自 `FilterInputStream` 并实现了 `DataInput` 接口。因此，`DataInputStream`\
  \ 在使用 `InputStream` 类方法外，还实现了 `DataInput` 中描述的方法。\n\n## InputStream 类总结：\n\n| `InputStream`\
  \ | 此抽象类是所有表示字节输入流的类的父类。 |\n| `BufferedInputStream` | `BufferedInputStream` 为另一个输入流增加了功能——即缓冲输入的能力并支持\
  \ `mark` 和 `reset` 方法。 |\n| `ByteArrayInputStream` | `ByteArrayInputStream` 包含一个内部缓冲区，其中包含从流中读取的字节。\
  \ |\n| `DataInputStream` | `DataInputStream` 让应用程序以机器无关的方式从底层输入流读取 Java 原始数据类型。\
  \ |\n| `FileInputStream` | `FileInputStream` 包含来自文件系统的输入字节。 |\n| `FilterInputStream`\
  \ | `FilterInputStream` 包含另一个输入流，它将其作为基本数据源，可能在此过程中传输数据或提供额外功能。 |\n| `PipedInputStream`\
  \ | `PipedInputStream` 应该连接到管道输出流，随后管道输入流将提供写入管道输出流的任何数据字节。 |\n| `PushbackInputStream`\
  \ | `PushbackInputStream` 为另一个输入流增加了功能，即“推回”或“重读”一个字节的能力。 |\n| `SequenceInputStream`\
  \ | `SequenceInputStream` 代表另一个流的逻辑连接。 |\n| `ObjectInputStream` | `ObjectInputStream`\
  \ 反序列化之前使用 `ObjectOutputStream` 写入的原始数据和对象。 |\n\n## OutputStream 类\n\n输出流类派自基类 `OutputStream`，该基类是一个抽象类，并有许多子类支持各种输出相关功能。\n\
  \n### OutputStream 类：\n\n父类 `OutputStream` 是一个抽象类，定义了执行输出功能的方法，例如：\n\n* 写入字节\n*\
  \ 关闭流\n* 刷新流\n\n![z](img/image057.png)\n\n(输出流类的层级结构)\n\n哎呀！！让我们看看下面的高质量图片-\n\n\
  ![IO_InputOutputStreams](img/image019.png)\n\n### OutputStream 类的方法：\n\n| `void\
  \ close()` | 关闭此输出流并释放与此流相关的任何流资源。 |\n| `void flush()` | 刷新此输出流并强制将任何缓冲的输出字节写入。\
  \ |\n| `void write(byte[] b)` | 从指定的字节数组向其输出流写入 `b.length` 个字节。 |\n| `void write(byte[]\
  \ b, int off, int len)` | 从指定的字节数组从偏移量 `off` 开始向其输出流写入 `len` 个字节。 |\n| `abstract\
  \ void write(int b)` | 向其输出流写入指定的字节。 |\n\n## DataOutput 接口\n\n`DataOutput` 是一个接口，定义了向\
  \ `OutputStream` 写入原始数据类型的方法。\n\n![IO_LayeredInput](img/image89.png)\n\n![C:\\Users\\\
  Made Man\\Desktop\\Stars\\black_logo.jpg](img/image93.jpg)\n\n### DataOutput 接口的方法：\n\
  \n| `void writeBoolean(boolean v)` | 向其输出流写入布尔值。 |\n| `void writeByte(int v)` |\
  \ 向输出流写入参数 `v` 的低 8 位位。 |\n| `void writeBytes(string s)` | 将字符串写入输出流。对于字符串 `s` 中的每个字符，按顺序向输出流写入一个字节。\
  \ |\n| `void writeChar(int v)` | 向输出流写入一个字符值，其由两个字节组成。 |\n| `void writeChars(string\
  \ s)` | 将字符串 `s` 中的每个字符按八字节的顺序写入输出流。 |\n| `void writeDouble(double v)` | 向输出流写入一个\
  \ double 值，其由八字节组成。 |\n| `void writeFloat(float v)` | 向输出流写入一个 float 值，其由四个字节组成。\
  \ |\n| `void writeInt(int v)` | 向输出流写入一个 int 值，其由四个字节组成。 |\n| `void writeLong(long\
  \ v)` | 向输出流写入一个 long 值，其由八字节组成。 |\n| `void writeShort(int v)` | 向输出流写入一个 short\
  \ 值，其由两个字节组成。 |\n| `void writeUTF(String str)` | 向输出流写入两个字节的长度信息，随后是字符串 `str` 中每个字符的修改\
  \ UTF-8 表示。 |\n\n––––––––\n\nOutputStream 类总结：\n\n`DataOutputStream` 是 `DataInputStream`\
  \ 的对应部分。`DataOutputStream` 类在使用 `OutputStream` 类方法外，还实现了 `DataOutput` 接口描述的方法。\n\
  \nOutputStream 类总结：\n\n| `OutputStream` | 此抽象类是所有表示字节输出流的类的父类。 |\n| `BufferedOutputStream`\
  \ | 该类实现了一个缓冲输出流。 |\n\n\n\n\n\n| `ByteArrayOutputStream` | 该类实现了一种输出流，其中数据被写入字节数组中。\
  \ |\n| `DataOutputStream` | 数据输出流允许应用程序以可移植的方式将 Java 原始数据类型写入输出流中。 |\n| `FileOutputStream`\
  \ | 文件输出流是用于向 `File` 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以连接到管道输入流上，以创建一个通信管道。\
  \ |\n| `FilterOutputStream` | `FilterOutputStream` 包含其他输出流，它将这些流作为自己的目标，并可能在此对数据进行转换或提供额外功能。\
  \ |\n| `PrintStream` | `PrintStream` 为另一个输出流添加功能，即能够方便地打印各种数据值的表示形式。 |\n\n# 字符流类概览\n\
  \n字符流通过使用两个类层次结构定义。顶端是两个抽象类：`Reader` 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 为这些中的每一个类都提供了几个具体的子类。抽象的\
  \ `Reader` 和 `Writer` 类定义了其他流类实现的若干个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入数据字符。这些方法被派生的流类所重写。\n\
  \n## Reader 流类\n\nReader 流类设计用于从文件中读取字符。`Reader` 类是此组中所有其他类的基类。这些类在功能上与输入流类非常相似，区别在于输入流使用字节作为基本信息单元，而\
  \ reader 流使用字符。\n\n`Reader` 类包含了与 `InputStream` 类中提供的相同的方法。因此，`Reader` 类可以执行输入流类所实现的几乎所有功能。\n\
  \n![image](img/image059.png)\n\n(Reader 类的层次结构)\n\n### Reader 类\n\n`Reader` 是一个抽象类，定义了\
  \ Java 的字符输入流模型。该类中的所有方法都会抛出 `IOException`。\n\n### Reader 类的方法：\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `abstract void close()` | 关闭流。一旦流被关闭，后续进一步的 `read()`、`ready()`、`mark()`\
  \ 或 `reset()` 调用将抛出 `IOException`。然而，关闭一个之前已经关闭的流没有影响。 |\n| `void mark()` | 标记流中的当前位置。随后，调用\
  \ `reset()` 将尝试将流重置到此点。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()`\
  \ | 告知此流是否支持 `mark()` 操作。 |\n| `int read()` | 读取单个字符并返回来自调用输入流的下一个可用字符的整数表示。当遇到文件末尾时返回\
  \ -1。 |\n| `int read(char[] buffer)` | 尝试将多达 buffer 长度的字符读取到 buffer 中，并返回成功读取的字符数。当遇到文件末尾时返回\
  \ -1。reader 子类必须实现此方法。 |\n| `abstract int read(char[] buffer, int offset, int numChar)`\
  \ | 尝试从 `buffer[offset]` 开始读取多达 `numChar` 个字符到 buffer 中，返回成功读取的字符数。当遇到文件末尾时返回 -1。reader\
  \ 子类必须实现此方法。 |\n| `boolean ready()` | 告知此流是否准备好被读取。如果下一次输入请求不会等待，则返回 true，否则返回 false。\
  \ |\n| `void reset()` | 重置流。并不是所有的字符输入流都支持此方法。 |\n| `long skip(long n)` | 跳过多达 `n`\
  \ 个字符并返回跳过的字符数。如果 `n` 为负数，则抛出 `IllegalArgumentException`。 |\n\n### Reader 类总结：\n\
  \n| 类 | 描述 |\n| :--- | :--- |\n| `Reader` | 用于读取字符流的抽象类。 |\n| `BufferedReader` |\
  \ 从字符输入流中读取文本，对字符进行缓冲，以便高效地读取字符、数组和行。 |\n| `CharArrayReader` | 该类实现了一个可以作为字符输入流使用的字符缓冲区。\
  \ |\n| `FileReader` | 用于读取字符文件的便利类。 |\n| `FilterReader` | 用于读取过滤字符流的抽象类。 |\n| `InputStreamReader`\
  \ | `InputStreamReader` 是从字节流到字符流的桥梁：它读取字节并使用指定的字符集将其解码为字符。 |\n| `PipedReader` |\
  \ 管道字符输入流。 |\n| `PushbackReader` | 字符流读取器，允许将字符推回流中。 |\n| `StringReader` | 源为字符串的字符流。\
  \ |\n\n## Writer 流类\n\nWriter 流类设计用于将字符写入文件/输出设备。writer 类是一个抽象类，作为所有其他 writer 流类的基类。\n\
  \n该基类通过定义与 `OutputStream` 类中相同的方法为所有输出操作提供支持。\n\n`Writer` 类包含了与 `OutputStream` 类中提供的相同的方法。因此，`Writer`\
  \ 类可以执行输出流类所实现的几乎所有功能。\n\n![image](img/image068.png)\n\n(Writer 类的层次结构)\n\n![C:\\\
  Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image054.jpg)\n\n\
  ### Writer 类\n\n`Writer` 是一个抽象类，定义了流式字符输出。该类中的所有方法都返回一个 `void` 值，并在发生错误时抛出 `IOException`。\n\
  \n### Writer 类的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `abstract void close()` |\
  \ 关闭流并先进行刷新。 |\n| `abstract void flush()` | 刷新流。 |\n| `void write(char[] cbuf)`\
  \ | 写入字符数组。 |\n| `abstract void write(char[] cbuf, int off, int len)` | 写入从指定偏移量开始的字符数组部分。子类必须实现此方法。\
  \ |\n| `void write(int c)` | 向调用的输出流写入单个字符。注意参数是 `int`，这允许你直接对表达式调用 `write`，而不需要将其强制转换回\
  \ `char`。 |\n| `void write(String str)` | 写入字符串。 |\n| `void write(String str, int\
  \ off, int len)` | 写入从指定偏移量开始的字符串部分。 |\n\n![C:\\Users\\Made Man Harry\\Desktop\\\
  Stars\\Star_logo_yellow.jpg](img/image016.jpg)\n\n### Writer 类总结\n\n| 类 | 描述 |\n\
  | :--- | :--- |\n| `Writer` | 用于写入字符流的抽象类。 |\n| `BufferedWriter` | 向字符输出流写入文本，对字符进行缓冲以便高效地写入单个字符、数组和字符串。\
  \ |\n| `CharArrayWriter` | 该类实现了一个可以作为 Writer 的字符缓冲区。 |\n| `FileWriter` | 用于写入字符文件的便利类。\
  \ |\n| `FilterWriter` | 用于写入过滤字符流的抽象类。 |\n| `OutputStreamWriter` | `OutputStreamWriter`\
  \ 是从字符流到字节流的桥梁：写入它的字符使用指定的字符集编码为字节。 |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter`\
  \ | 向文本输出流打印对象的格式化表示。 |\n| `StringWriter` | 在字符串缓冲区中收集输出的字符流，随后可以使用它来构建字符串。 |\n\n\
  ## File 类\n\n尽管 `java.io` 中定义的多数类基于流操作，但 `File` 类不是。它直接处理文件和文件系统。也就是说，`File` 类没有指定如何从文件中检索信息或将其存储。它描述的是文件本身的属性。\n\
  \n文件对象用于获取或操纵磁盘文件的信息，例如权限、时间、日期和目录路径，以及遍历子目录层次结构。\n\n\n\n\n\n尽管出于安全考虑，文件在 applet\
  \ 中的用法受到严格限制，但文件仍然是存储持久化和共享信息的核心资源。\n\n## 概述\n\n`Java` 中的目录被简单地视为一个文件，只是多了一个属性——一个可以通过\
  \ `list()` 方法检查的文件名列表。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `public File(String);`\
  \ | |\n| `public File(String, String);` | |\n| `public File(File, String);` | |\n\
  | `public File(URI);` | 此构造函数由 Java2（版本 1.4）添加 |\n| `public String getName();` |\
  \ 返回文件或目录的名字 |\n| `public String getParent();` | 返回对象创建时指定的路径中文件的父目录；如果此路径名不是父目录，则返回\
  \ `null`。 |\n| `public String getPath();` | 返回相对路径。 |\n| `public boolean isAbsolute();`\
  \ | 测试此抽象路径是否为绝对路径。 |\n| `public String getAbsolutePath( );` | 返回从根目录开始的绝对（完整）路径。\
  \ |\n| `public boolean canRead( );` | 测试应用程序是否可以读取此抽象路径所指示的文件。 |\n| `public boolean\
  \ canWrite( );` | 测试应用程序是否可以修改此抽象路径所指示的文件。 |\n| `public boolean exists( );` | 测试此抽象路径所指示的文件或目录是否存在。\
  \ |\n| `public boolean isDirectory( );` | 测试此抽象路径所指示的文件是否为目录。 |\n| `public boolean\
  \ isFile( );` | 测试此抽象路径所指示的文件是否为普通文件。 |\n| `public boolean isHidden( );` | 测试此抽象路径命名的文件是否为隐藏文件。\
  \ |\n| `public long lastModified( );` | 返回此抽象路径所指示的文件最后修改的时间。 |\n| `public long\
  \ length( );` | 返回此抽象路径所指示的文件长度。 |\n| `public boolean createNewFile( ) throws java.io.IOException;`\
  \ | 当且仅当不存在以此抽象路径命的文件时，自动创建一个由此抽象路径命名的空文件。 |\n| `public boolean delete( );` | 删除此抽象路径所指示的文件或目录。\
  \ |\n| `public String[ ] list( );` | 返回一个字符串数组，包含此抽象路径所指示目录中的文件和目录名称。如果 `File` 对象对应文件，则返回\
  \ `null`。 |\n| `public boolean mkdir( );` | 创建此抽象路径命名的目录。 |\n| `public boolean mkdirs(\
  \ );` | 创建此抽象路径命名的目录，包括任何必要的不存在的父目录。 |\n| `public boolean setLastModified(long);`\
  \ | 设置此抽象路径命名的文件或目录的最后修改时间。 |\n| `public boolean setReadOnly( );` | 标记此抽象路径命名的文件或目录，使其只允许读操作。\
  \ |\n| `public boolean setWritable(boolean);` | |\n| `public boolean setReadable(boolean);`\
  \ | |\n| `public boolean canExecute( );` | |\n| `public long getTotalSpace( );`\
  \ | |\n| `public long getFreeSpace( );` | |\n| `public long getUsableSpace( );`\
  \ | |\n| `boolean renameTo(File);` | 重命名此抽象路径所指示的文件。 |\n\n### 示例\n\n```java\nFile\
  \ f1 = new File(/”);\nFile f2 = new File(/”,”autoexec.bat”);\nFile f3 = new File(f1，“autoexec.bat”);\n\
  ```\n\n### 注意\n\nJava 在处理 UNIX 和 Windows 约定之间的路径分隔符时表现良好。如果你在 Windows 版本的 Java 上使用正斜杠（`/`），路径仍然可以正确解析。\n\
  \n请记住，如果你在字符串中使用 Windows 约定（`\\\\`）。Java 的惯例是使用 UNIX 和 URL 风格的正斜杠作为路径分隔符。\n\n`File`\
  \ 定义了许多获取 `File` 对象标准属性的方法。然而，`File` 类并不是对称的。这意味着，虽然有可以允许你检查简单文件对象属性的主要方法，但没有对应的函数来更改这些属性。\n\
  \n### 示例 15.1\n\n接下来的示例展示了 `File` 类的几个方法\n\n```java\nimport java.io.*;\nclass FileTest\n\
  {\n    public static void main(String args[]) throws IOException\n    { \n     \
