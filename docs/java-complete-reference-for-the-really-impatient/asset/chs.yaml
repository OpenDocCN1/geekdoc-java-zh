  \ private int i=100;\n    public static int x = 10;\n    double d;\n    MyClass(String\
  \ s, int i, double d) {\n        this.s = s;\n        this.i = i;\n        this.d\
  \ = d;\n        x = 100;\n    }\n    public String toString() {\n        return\
  \ \"s = \" + s + \"; i = \"+ i + \" ;d = \" + d +\"; x = \"+ x;\n    }\n}\nclass\
  \ A implements Serializable {\n    public String toString() {\n        return \"\
  Class A\";\n    }\n}\n```\n\n**输出：**\n```\ns = Hello; i = 99 ;d = 123.45; x = 100\n\
  写入对象 1\n写入对象 3\n写入对象 5\n反序列化后\ns = Hello; i = 100 ;d = 123.45; x = 100\ns = Hello;\
  \ i = 100 ;d = 123.45; x = 400\nClass A\n```\n\n---\n\n# 第 16 章\n\n## Applet（小程序）\n\
  \n## 引言\nApplet 是一种设计用于在互联网上传并在客户端运行的程序，它通过 Internet Explorer 或 Netscape 等浏览器运行。Applet\
  \ 也是 Java 程序，但它们存储在服务器上。\n\nApplet 不能像独立应用程序一样运行，它必须通过嵌入 HTML 页面来运行。为了运行 Applet，我们需要将其嵌入\
  \ HTML 页面中。当浏览器下载了这样的 HTML 页面时，它会加载包含 applet 代码的文件并在本地机器上执行。当 Applet 到达后，它对资源的访问是有限的。\n\
  \n## Applet 体系\nApplet 与普通程序不同：\n\n*   Applet 是基于 GUI 的（基于窗口）\n*   Applet 是事件驱动的\n\
  \n当普通 Java 程序（非 GUI 的）需要输入时，它会提示用户并调用某些方法，例如 `readLine()`；这并不是程序的行为方式。Applet 是用户发起交互。例如，在文字处理软件中，用户通过点击不同的按钮发起动作，从而产生事件并执行相应的代码。Applet\
  \ 使用 `awt` 包（抽象窗口工具包）来提供 GUI 并处理事件。之所以被称为 awt，是因为它完全依赖于底层操作系统的功能。\n\nApplet 类似于一组中断服务程序。Applet\
  \ 等待事件发生。awt 通过调用 applet 提供的事件处理器来通知 applet。一旦发生这种情况，applet 必须采取相应行动，并迅速将控制权还给 AWT。\n\
  \n这是一个关键点。在大多数情况下，applet 不应该进入一种长时间保持控制的模式。相反，它应该对事件执行特定的操作，并将控制权还给 AWT 运行时。\n\n\
  在 applet 需要自行执行重复性任务的情况下（例如在窗口中显示滚动消息），我们必须启动另一个执行线程。\n\n## 编写 Applet\n所有的 applet\
  \ 都是 `Applet` 类的子类。`Applet` 类包含在 `java.applet` 包中。Applet 类的层次结构如下：\n\n`java.lang.Object`\n\
  |\n`java.awt.Component`\n|\n`java.awt.Container`\n|\n`java.awt.Panel`\n|\n`java.applet.Applet`\n\
  \n`Applet` 类为 applet 的执行提供了所有支持，例如启动和停止。它还提供了加载和显示图像的方法。它还为所有窗口化活动提供了必要的支持。扩展 applet\
  \ 类的子类必须始终声明为 `public`，因为它是由 浏览器实例化并执行的。\n\n浏览器在实例化 applet 时使用无参构造函数，因此必须提供一个具有公共可见性的无参构造函数。\n\
  \n\n\n\n建议我们不在 `Applet` 类中提供构造函数，因为在这种情况下编译器将提供默认的无参数构造函数。\n\n我们可以利用 `init()` 方法进行初始化。在编写\
  \ applet 代码时，我们通常会重写 `Applet` 类的某些方法，这些方法会在 applet 执行期间自动调用。\n\n重写 `paint()` 方法是非常常见的。`paint()`\
  \ 方法中的代码主要在 `Applet` 窗口中显示输出。\n\n### 示例 16.1 (App1.java)\n以下程序演示了一个简单的 applet，它在窗口内显示“Hello\
  \ World”。无论我们在 applet 的 `paint` 方法中绘制/显示什么内容，它都会出现在 applet 的窗口中。\n\n在接下来的示例中，applet\
  \ 窗口的背景颜色设置为红色，前景色颜色设置为绿色，因此背景将显示为红色，文本“Hello Word”将以绿色显示。\n\n```java\n1. import\
  \ java.awt.*;\n2. import java.applet.Applet;\n3. /*<applet code= \"App1\" width\
  \ =500 height=100></applet>*/\n4. public class App1 extends Applet\n5. { \n6.  \
  \ public void init()\n7.   {\n8.       setBackground(Color.red);\n9.       setForeground(Color.green);\n\
  10.    }\n11.    public void paint(Graphics g)\n12.    { \n13.      g.drawString(\"\
  Hello World\",20,20);\n14.    }\n15. }\n```\n\n输出：\n![image](img/image094.png)\n\
  \n## 执行 Applet\nApplet 不由基于控制台的 Java 运行时解释器执行。我们有两种方法可以运行 applet：\n\n1. 在兼容 Java\
  \ 的网页浏览器中执行 applet。\n2. 使用 `appletviewer`，例如标准的 SDK 工具 `appletviewer`。`appletviewer`\
  \ 在窗口中执行我们的 applet。这是测试我们 applet 最快、最简单的方法。\n\n### 在网页浏览器中执行 Applet\n我们需要编写一个短的\
  \ HTML 文本文件，其中包含适当的 `APPLET` 标签。applet 标签必须至少包含以下三个属性：\n- `Code`\n- `Width` \n-\
  \ `Height`\n\n属性 `code` 的值指定包含 applet 代码的类名。属性 `width` 和 `height` 分别指定 applet 窗口的宽度和高度。\n\
  \n这里是嵌入了 applet \"App1\" 的 HTML 文件 `RunApp.Html`。\n\n```html\n<html>\n<head>\n<title>Simple\
  \ Applet</title>\n</head>\n<body>\n<h1>Simple “Hello World” Application </h1>\n\
  <applet code= “App1” width =500 height=100>\n</applet>\n</body>\n</html>\n```\n\n\
  你可以通过在网页浏览器中打开文件 `RunApp.html` 来执行该 applet。该文件可以存在于本地文件系统中，也可以从 Web 服务器加载。\n\n####\
  \ 使用 appletviewer 执行 Applet\n然而，存在一种更方便的方法可以让我们加速测试。只需在你的 Java 源代码文件中简单包含一个包含该 `APPLET`\
  \ 标签的注释即可。通过这样做，我们的代码就带有了必要 HTML 语句的原型文档说明，我们只需要通过启动 `appletviewer` 并传入我们的 Java\
  \ 源代码文件即可测试编译后的输出。如果我们使用这种方法，那么在编译后我们可以按照如下方式执行 applet：\n\n```bash\nappletviewer\
  \ SimpleApplet.Java\n```\n\n## Applet 生命周期方法\n`Applet` 重写了一组方法，这些方法提供了浏览器或 `appletviewer`\
  \ 与 applet 交互并控制其执行的基本机制。\n\n这些方法也被称为生命周期方法，因为浏览器或 applet 查看器会在 applet 生命周期的不同阶段自动调用它们。总共有五种生命周期方法：\n\
  - `public void init ()`\n- `public void start ()`\n- `public void stop ()`\n- `public\
  \ void destroy ()`\n- `public void paint (Graphics g)`\n\n这些中的四个方法：`init()`、`start()`、`stop()`\
  \ 和 `destroy()` 定义在 `applet` 类中。\n\n`paint()` 是由 `awt Component` 类定义的，并为所有这些方法提供了默认实现。Applet\
  \ 不需要重写它们未使用的方法。然而，非常简单的 applet 不需要定义它们。\n\n### Applet 的初始化与终止\n当 applet 开始时，以下方法将按顺序被调用：\n\
  1. `init()`\n2. `start()`\n3. `paint()`\n\n当 applet 终止时，会发生以下方法调用序列：\n1. `stop()`\n\
  2. `destroy()`\n\n### init() 方法\n这是第一个被调用的方法。在这里我们应该初始化变量并为其他初始化活动编写代码。该方法在 applet\
  \ 的生命周期内仅在实例化后立即被调用一次。\n\n### start() 方法\n`start()` 方法在 `init()` 之后被调用。它还用于在 applet\
  \ 停止后重启它。`init()` 在 applet 第一次加载时调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时被调用。因此，如果用户离开网页并返回，applet\
  \ 将从 `start()` 处恢复执行。\n\n### paint() 方法\n`paint()` 在 `init()` 和 `start()` 之后调用。每当\
  \ applet 的输出需要重绘时，就会被调用。这种情况可能由于多种原因：例如，运行 applet 的窗口被最小化。\n\n### Stop 方法\n`stop()`\
  \ 方法在浏览器离开包含 applet 的 HTML 文档时调用。我们应该使用 `stop()` 挂不需要运行的线程。\n\n### destroy 方法\n\
  `destroy()` 方法在环境确定需要从内存中移除 applet 时被调用。在此处，我们应该释放 applet 可能正在使用的资源。\n\n### 示例 16.2\n\
  这是一个简单的 applet，将背景颜色设置为青色，前景色设置为红色，并显示了 `init()`、`start()` 和 `paint()` 方法的调用顺序。\n\
  \n```java\n1. import java.awt.*;\n2. import java.applet.*;\n3. /*<applet code= \"\
  App2\" width =500 height=100></applet>*/\n4. public class App2 extends Applet\n\
  5. { \n6.   String msg=\"\";\n7.   public void init()\n8.   {\n9.       System.out.println(\"\
  Inside init\");\n10.      setBackground(Color.cyan);\n11.      setForeground(Color.red);\n\
  12.      msg = \"Inside init—\";\n13.  }\n14.  public void start()\n15.  {\n16.\
  \      System.out.println(\"Inside start\");\n17.      msg += \"Inside start—\"\
  ;\n18.  }\n19.  public void stop()\n20.  {\n21.      System.out.println(\"Inside\
  \ stop\");\n22.      msg += \"Inside stop—\";\n23.  }\n24.  public void paint (Graphics\
  \ g)\n25.  { \n26.      System.out.println(\"Inside paint\");\n27.      msg += \"\
  Inside paint—\";\n28.      g.drawString(msg,10,30);\n29.  }\n30.  public void destroy()\n\
  31.  {\n32.      System.out.println(\"Inside destroy\");\n33.  }\n34. }\n```\n\n\
  输出：\n![image](img/image77.png)\n\n## 动态 Applet\nApplet 窗口中显示的输出可以是动态的。例如，我们可以显示一个移动横幅。applet\
  \ 还可以用于应用程序，例如通过从服务器获取与比赛相关的得分和其他统计数据；显示股票价格等。\n\n示例 16.3\n以下示例显示了一个移动横幅。它演示了使用\
  \ `repaint()` 方法刷新显示。该 applet 在 applet 窗口中从右向左滚动消息。\n\n由于消息滚动是一项重复性任务，它是由 applet\
  \ 在启动时创建的独立线程执行的。该程序还演示了资源可以在 `stop()` 方法中释放，并在 `start()` 方法中重新获取。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\n```\n\n\n\n\n\n```java\n/*<applet code=\"\
  App3\" width=500 height=100></applet>*/\npublic class App3 extends Applet implements\
  \ Runnable {\n    String msg=\"A Simple Moving Banner.\";\n    Thread t = null;\n\
  \    boolean stopFlag;\n\n    public void init() {\n        setBackground(Color.cyan);\n\
  \        setForeground(Color.red);\n    }\n\n    public void start() {\n       \
  \ t=new Thread(this);\n        stopFlag = false;\n        t.start();\n    }\n\n\
  \    public void stop() {\n        stopFlag=true;\n        t=null;\n    }\n\n  \
  \  public void paint(Graphics g) {\n        g.drawString(msg,50,30);\n    }\n\n\
  \    public void run() {\n        for (;;) {\n            repaint();\n         \
  \   try {\n                Thread.sleep(250);\n            }\n            catch(InterruptedException\
  \ e) {\n                System.out.println(e);\n            }\n            msg =\
  \ msg.substring(1) + msg.charAt(0);\n            if (stopFlag)\n               \
  \ break;\n        }\n    }\n}\n```\n\n输出:\n\n![image](img/image037.png)\n\n### 使用状态窗口\n\
  \n除了在窗口中显示信息外，applet 还可以向运行它的浏览器或 `appletviewer` 的状态窗口输出消息。\n\n要做到这一点，请调用 `showStatus()`\
  \ 并传入我们想要显示的字符串。状态窗口是向用户提供 applet 中正在发生情况的反馈、建议选项或可能报告某些类型的错误的良好位置。\n\n状态窗口也是一个极佳的调试辅助（帮助），因为它为我们提供了一种输出关于\
  \ applet 信息的简单方式。\n\n#### 示例 16.4：下面的示例演示了如何使用状态窗口。\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App4\" width=500 height=100></applet>*/\n\
  public class App4 extends Applet {\n    public void init() {\n        setBackground(Color.cyan);\n\
  \    }\n    public void paint(Graphics g) {\n        g.drawString(\"This is in the\
  \ applet window\",10,20);\n        showStatus(\"This is shown in the status window\"\
  );\n    }\n}\n```\n\n输出:\n\n![image](img/image055.png)\n\n### HTML 的 APPLET 标签\n\
  \n`APPLET` 标签用于从 HTML 文档和 appletviewer 启动 applet。\n\n`appletviewer` 会在单独窗口中执行找到的每个\
  \ `APPLET` 标签；而像 Netscape Navigator 和 Internet Explorer 等浏览器允许在单个页面上运行许多 applet。\n\
  \n标准 `APPLET` 标签的语法为：\n\n```html\n< APPLET\nCODE=applet class name\nCODEBASE=codebase\
  \ URL\nALT=alternate Text,\nNAME=appletInstancename\nWIDTH=pixels\nHEIGHT=pixels\n\
  ALIGN=alignment\nVSPACE=vertical space in pixels\nHSPACE=horizontal space in pixels\n\
  >\n<PARAM NAME=attributeName-1 VALUE=Attribute Value-1>\n<PARAM NAME=attributeName-2\
  \ VALUE=Attribute Value-2>\n<PARAM NAME=attributeName-N VALUE=Attribute Value-N>\n\
  </APPLET>\n```\n\n- **CODE**: 必选属性，提供包含我们 applet 编译文件的文件名。该文件相对于 applet 的 `CODEBASE`\
  \ URL，或者如果设置了 `CODEBASE`，则相对于其指定的目录。\n- **CODEBASE**: 可选属性，指定 applet 的基础 URL，即将搜索\
  \ applet 可执行文件（由 `CODE` 标签指定）的目录。如果未指定此属性，则使用 HTML 文档的 URL 作为 `CODEBASE`。\n- **ALT**:\
  \ 可用文本，提供备用文本。\n- **NAME**: applet 实例名称。\n- **WIDTH**: 像素值。\n- **HEIGHT**: 像素值。\n\
  - **ALIGN**: 对齐方式。\n- **VSPACE**: 像素单位的垂直间距。\n- **HSPACE**: 像素单位的水平间距。\n\n\n\n\n\
  \n在 applet 中，一旦获取了 applet 的上下文（context），我们就可以调用 `showDocument()` 方法将另一个文档引入视图。该方法没有返回值，如果执行失败也不会抛出异常，因此请谨慎使用。有两个\
  \ `showDocument()` 方法。\n\n```java\nvoid ShowDocument(URL url)\n```\n用给定的 `URL` 替换当前查看的网页\n\
  \n```java\nvoid ShowDocument (URL url, String where)\n```\n在浏览器窗口内的指定位置显示指定的文档。“where”的有效参数有：\n\
  \n* `\"_self\"`（在当前帧中显示）\n* `\"_parent\"`（在父帧中显示）\n* `\"_top\"`（在最顶层帧中显示），以及\n*\
  \ `\"_blank\"`（在新浏览器窗口中显示）\n\n### 示例 16.7\n以下 applet 演示了 `Applet Context` 和 `showDocument()`\
  \ 的用法。执行时，它获取当前的 applet 上下文并使用该上下文将控制转移到名为 `A.html` 的文件。该文件必须位于 applet 相同的目录下。`Test.html`\
  \ 可以包含任何你喜欢的有效超文本。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport\
  \ java.net.*;\npublic class App7 extends Applet\n{ \n    AppletContext ac;\n   \
  \ URL u1;\n    public void init()\n    {\n      setBackground(Color.cyan);\n   \
  \ }\n    public void start( )\n    {\n      ac = getAppletContext();\n      u1 =\
  \ getCodeBase();\n      try\n      {\n        Thread.sleep(3000);\n        ac.showDocument(new\
  \ URL(u1 + \"A.html\"),\"_blank\");\n      }\n      catch(MalformedURLException\
  \ e)\n      { \n        showStatus(\"Invalid URL\");\n        e.printStackTrace()\
  \ ;\n      }\n      catch(InterruptedException e)\n      { \n        showStatus(\"\
  Invalid URL\");\n        e.printStackTrace () ;\n      }\n    }\n    public void\
  \ paint (Graphics g)\n    {\n      g.drawString(u1+\"A.html\",20,20);\n      try\n\
  \      {\n        Thread.sleep(3000);\n      }\n      catch(InterruptedException\
  \ e)\n      {\n        System.out.println(e);\n      }\n    }\n}\n```\n\n**App7.html**\n\
  ```html\n<html>\n  <head>\n    <Title>Applet Context Demo</Title>\n  </head>\n \
  \ <body>\n    <applet code=\"App7\" width=200 height=200></applet>\n  </body>\n\
  </html>\n```\n\n**A.html**\n```html\n<html>\n  <head>\n    <title>New Page</title>\n\
  \  </head>\n  <body bgcolor=blue text=red>\n    <h1>matrix</h1>\n  </body>\n</html>\n\
  ```\n\n### 示例 16.8\n```java\nimport java.applet.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\
