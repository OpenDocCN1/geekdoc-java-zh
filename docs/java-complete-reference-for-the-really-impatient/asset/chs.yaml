  \    }\n    public void actionPerformed(ActionEvent ae)\n    {\n      Button b=(Button)ae.getSource();\n\
  \      if(b==b1)\n      {\n          String s[]=l1.getSelectedItems();\n       \
  \   for(int i=0;i<s.length;i++)\n        {\n          l2.add(s[i]);\n          l1.remove(s[i]);\n\
  \        }\n      }\n      else if(b==b2)\n      {\n          String s[]=l1.getItems();\n\
  \          for(int i=0;i<s.length;i++) {\n          l2.add(s[i]);\n          l1.remove(s[i]);\n\
  \        }\n      }\n      else if(b==b3)\n      {\n          String s[]=l2.getSelectedItems();\n\
  \        for(int i=0;i<s.length;i++)\n        {\n          l1.add(s[i]);\n     \
  \     l2.remove(s[i]);\n        }\n      }\n      else if(b==b4)\n      {   \n \
