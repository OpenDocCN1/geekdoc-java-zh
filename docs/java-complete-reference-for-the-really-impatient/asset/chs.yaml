  \n处理窗口事件\n\n### 示例 18.5\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  class A5\n{\n  public static void main(String args[])\n    {\n      Frame f= new\
  \ Frame();\n      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n  \
  \    f.addWindowListener(new B( ));\n      f.setVisible(true);\n    }\n}\nclass\
  \ B implements WindowListener\n{\n  public void windowOpened(WindowEvent ae)\n \
  \   {\n      System.out.println(\"Window Opened\");\n    }\n  public void windowActivated(WindowEvent\
  \ ae)\n    {\n      System.out.println(\"Window Activated\");\n    }\n  public void\
  \ windowDeactivated(WindowEvent we)\n    {\n      System.out.println(\"Window Deactivated\"\
  );\n    }\n  public void windowClosing(WindowEvent we)\n    {\n      System.out.println(\"\
  Window Closing\");\n      Frame f = (Frame) we.getWindow( );\n      f.dispose();\n\
  \    }\n  public void windowClosed(WindowEvent we)\n    {\n      System.out.println(\"\
  Window Closed\");\n    }\n  // 注意：windowIconified 和 windowDeiconified 需要空实现\n}\n\
  ```\n\n### Adapters\n有些事件监听接口具有多个方法。最大的接口 `WindowListener` 有七个方法。假设我们想捕获 `windowClosing()`\
  \ 事件以便执行关闭窗口的代码。虽然我们在实现 `WindowListener` 的类中只需要 `windowClosing()` 方法，但我们必须为所有方法提供空实现。\n\
  \n`java.awt.event` 包提供了多个适配器类，每个定义了多个方法的监听接口对应一个。\n\n适配器仅仅是一个实现接口并提供空方法的类。例如，`WindowAdapter`\
  \ 类实现了 `WindowListener` 接口并包含了七个空方法。\n\n### 适配器类及其接口\n| 适配器类 | 监听器接口 |\n| :--- |\
  \ :--- |\n| `ContainerAdapter` | `ContainerListener` |\n| `FocusAdapter` | `FocusListener`\
  \ |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter` | `MouseListener` |\n| `MouseMotionAdapter`\
  \ | `MouseMotionListener` |\n| `WindowAdapter` | `WindowListener` |\n\n### 示例 18.6\
  \ WindowAdapter 类的使用\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass\
  \ A6\n{\n  public static void main (String args[])\n    {\n      Frame f= new Frame();\n\
  \      f.setLayout(new FlowLayout());\n      f.setSize(300,300);\n      f.addWindowListener(new\
  \ B( ));\n      f.setVisible(true);\n    }\n}\nclass B extends WindowAdapter\n{\n\
  \  public void windowClosing(WindowEvent we)\n    {\n      System.out.println(\"\
  Window Closing\");\n      Frame f = (Frame) we.getWindow( );\n      f.dispose();\n\
  \    }\n}\n```\n\n\n\n\n\n这是所有组件级输入事件的根事件类。输入事件在产生它的源对其进行正常处理之前，会先传递给监听器。这允许监听器和组件子类“消费”事件，从而使源不会以其默认方式处理它们。例如，在\
  \ `Button` 组件上消费鼠标按下事件将防止 `Button` 被激活。\n\n### 方法\n\n- `void consume()`: 消费此事件，使其不会由产生它的源以默认方式进行处理。\n\
  - `int getModifiers()`: 返回对应此事件的修饰符掩码（Modifier mask）。\n- `int getModifiersEx()`:\
  \ 返回此事件的扩展修饰符掩码。\n- `static String getModifiersExText(int modifiers)`: 返回描述扩展修饰键的字符串，例如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件中 Alt\
  \ 修饰符是否被按下。\n- `boolean isConsumed()`: 返回此事件是否已被消费。\n- `boolean isControlDown()`:\
  \ 返回此事件中 Control 修饰符是否被按下。\n- `boolean isShiftDown()`: 返回此事件中 shift 修饰符是否被按下。\n\n\
  ### 鼠标事件类\n\n这是 `Input Event` 类的子类。该事件表示组件中发生了鼠标动作。当且仅当鼠标光标位于组件子类的未被遮挡部分、或通过菜单、或通过顶层窗口时，则认为鼠标动作发生在特定的组件中。\n\
  \n此事件既用于鼠标事件（点击、进入、按下、移出、释放），也用于鼠标移动事件（移动和拖拽）。\n\n### 方法\n\n- `int getButton()`:\
  \ 返回哪个鼠标按键发生了状态变化（如果有）。\n- `int getClickCount()`: 返回与此事件相关的鼠标点击次数。\n- `static String\
  \ getMouseModifiersText(int modifiers)`: 返回描述事件期间被按下的修饰键的字符串，例如“Shift”或“Ctrl + shift”。\n\
  - `point getPoint()`: 返回事件相对于源组件的 x, y 位置。\n- `int getX()`: 返回事件相对于源组件的水平 x 位置。\n\
  - `int getY()`: 返回事件相对于源组件的垂直 y 位置。\n- `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n**注意：** 弹出菜单在不同系统上的触发方式不同。因此，为了实现正确的跨平台功能，应该在鼠标按下和鼠标释放时都检查 `isPopupTrigger()`。\n\
  \n#### 处理鼠标事件\n\n### 示例 18.7\n\n```java\n1. import java.awt.*;\n2. import java.awt.event.*;\n\
  3. class A7\n4. { \n5.   public static void main(String args[])\n6.   { \n7.   \
  \    Frame f= new Frame();\n8.       f.setLayout(new FlowLayout());\n9.       f.setSize(300,300);\n\
  10.      Button b1 = new Button(\"Push Me\");\n11.      b1.addMouseListener(new\
  \ B());\n12.      b1.addMouseMotionListener(new C());\n13.      b1.addActionListener(new\
  \ D());\n14.      f.add(b1);\n15.      f.setVisible(true);\n16.   }\n17. }\n18.\
  \ class B implements MouseListener\n19. { \n20.   public void mouseEntered(MouseEvent\
  \ me)\n21.   { \n22.      System.out.println(\"Mouse Entered...\");\n23.      System.out.println(me.getX());\n\
  24.      System.out.println(me.getY());\n25.   }\n26.   public void mouseExited(MouseEvent\
  \ me)\n27.   { \n28.      System.out.println(\"Mouse Exited...\");\n29.      Point\
  \ p1=me.getPoint();\n30.      System.out.println(p1.x);\n31.      System.out.println(p1.y);\n\
  32.   }\n33.   public void mousePressed(MouseEvent me)\n34.   { \n35.      System.out.println(\"\
  Mouse pressed...\");\n36.      int ms = me.getModifiers();\n37.      String s =\
  \ me.getModifiersEx();\n38.      System.out.println(s);\n39.   }\n40.   public void\
  \ mouseReleased(MouseEvent me)\n41.   { \n42.      System.out.println(\"Mouse Released...\"\
  );\n43.      System.out.println(\"ClickCount->\" + me.getClickCount());\n44.   }\n\
  45.   public void mouseClicked(MouseEvent me)\n46.   { \n47.      System.out.println(\"\
  Mouse Clicked...\");\n48.      System.out.println(\"Button->\"+me.getButton());\n\
  49.   }\n50. }\n51. class C implements MouseMotionListener\n52. {\n53.   public\
  \ void mouseMoved(MouseEvent me)\n54.   { \n55.      System.out.println(\"Mouse\
  \ Moved...\");\n56.   }\n57.   public void mouseDragged(MouseEvent me)\n58.   {\
  \ \n59.      System.out.println(\"Mouse Dragged...\");\n60.   }\n61. }\n62. class\
  \ D implements ActionListener\n63. {\n64.   public void actionPerformed(ActionEvent\
  \ me)\n65.   { \n66.      System.out.println(\"Button Clicked...\");\n67.      System.out.println(\"\
  Action->\"+me.getAction());\n68.   }\n69. }\n```\n\n### ActionEvent 类\n\n它是 `Input\
  \ Event` 类的子类。该事件表示组件中发生了鼠标动作。当且仅当鼠标光标位于组件子类的未被遮挡部分、或通过菜单、或通过顶层窗口时，则认为鼠标动作发生在特定的组件中。\n\
  \n此事件是一个语义事件，表示组件发生了动作（如被按下）。该事件避免了具体的鼠标移动和点击，而是处理像“按钮按下”这样的事件。\n\n**注意：** 在 `Button`\
  \ 上触发 `ActionEvent`。\n\n### 方法\n\n- `String getAction()`: 返回与动作相关的命令字符串。\n- `int\
  \ getModifiers()`: 返回事件期间按下的修饰键。\n- `long getWhen()`: 返回事件发生的时间。\n\n### 示例 18.8\n\
  \n此示例说明了我们在 `ActionEvent` 发生时识别修饰键。\n\n```java\n1. import java.awt.*;\n2. import\
  \ java.awt.event.*;\n3. class KeyModifierDemo extends Frame implements ActionListener\n\
  4. { \n5.   Button b;\n6.   KeyModifierDemo ()\n7.   { \n8.     b = new Button (\"\
  Button\");\n9.     b.addActionListener(this);\n10.    setLayout(new FlowLayout());\n\
  11.    add(b);\n12.    setBounds(100,100,200,200);\n13.    setVisible(true);\n14.\
  \   }\n15.   public static void main (String args[])\n16.   { \n17.     new KeyModifierDemo\
  \ ();\n18.   }\n19.   public void actionPerformed (ActionEvent ae )\n20.   { \n\
  21.     System.out.println (\"Button Pressed\");\n22.     int ms = ae.getModifiers\
  \ ();\n23.     if ((ms & InputEvent.CTRL_DOWN_MASK) != 0)\n24.     {   \n25.   \
  \    System.out.println (\"CTRL key was pressed\");\n26.     }\n27.     if ((ms\
  \ & InputEvent.SHIFT_DOWN_MASK) != 0)\n28.     { \n29.       System.out.println\
  \ (\"Shift Key was pressed\");\n30.     }\n31.     if ((ms & InputEvent.ALT_DOWN_MASK)\
  \ != 0)\n32.     { \n33.       System.out.println (\"ALT key was pressed\");\n34.\
  \     }\n35.   }\n36. }\n```\n\n### 处理多个动作命令\n\nAction 事件是最简单的。当我们发现滚动条发送了一个调整事件时，明显的问题是“现在滚动条的值是多少？”。当我们发现鼠标被点击时，自然会想知道“鼠标的\
  \ x 和 y 坐标是多少？”但当我们发现按钮发送了 `ActionEvent` 时，似乎没有其他额外信息需要寻求了；按钮被点击了，这似乎就是全部了。\n\n\n\
  \n\n然而，Action 事件关联着一个额外信息。该信息是一个字符串，被称为 Action 命令（Action command）。我们可以通过 `getActionCommand()`\
  \ 方法提取 Action 事件的 Action 命令。如果 Action 事件是由文本字段发送的，`getActionCommand()` 将返回文本字段的当前内容。（当用户按下回车键时，文本字段会发送\
  \ Action 事件）。如果 Action 事件是由按钮发送的，默认行为是 `getActionCommand()` 返回按钮标签的字符串。然而，我们可以通过调用\
  \ `setActionCommand(String)` 方法显式地设置按钮的 ActionCommand。\n\n```java\nButton btn =\
  \ new Button (“Hello”);\nbtn.setActionCommand (“Hello”);\n```\n\n当按钮的 Action 监听器（Action\
  \ listener）需要决定如何响应 Action 事件时，按钮命令的优势就显而易见了。单个监听器作为多个组件的监听器是很常见的；在我们的上下文中，单个对象可以是几个或多个按钮的\
  \ Action 监听器。在这种情况下，对象的 `actionPerformed()` 方法必须判断是哪个按钮被点击了。下面的示例演示了这一点：\n\n###\
  \ 示例 18.9\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonRefTest\n\
