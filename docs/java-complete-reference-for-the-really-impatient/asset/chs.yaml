  \      b2=new Button(\">>\");\n      b3=new Button(\"<\");\n      b4=new Button(\"\
  <<\");\n      b5=new Button(\"Add\");\n      b6=new Button(\"Add\");\n      b1.addActionListener(this);\n\
  \      b2.addActionListener(this);\n      b3.addActionListener(this);\n      b4.addActionListener(this);\n\
  \      b5.addActionListener(this);\n      b6.addActionListener(this);\n      tf1=new\
