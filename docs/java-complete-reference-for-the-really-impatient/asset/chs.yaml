  \n### SequenceInputStream\n\n`SequenceInputStream` 类是一个允许你连接多个 `InputStream` 的字节流。序列流的构造与其他任何\
  \ `InputStream` 都不同。`SequenceInputStream` 构造函数使用一对 `InputStream` 类或 `InputStream`\
  \ 类的 `Enumeration` 作为其参数：\n\n- `SequenceInputStream(InputStream is1, InputStream\
  \ is2)`：初始化新新 `SequenceInputStream` 并记住这两个参数，它们将按顺序先读取 `is1` 然后读取 `is2`，以从此 `SequenceInputStream`\
  \ 读取所需的字节。 |\n- `SequenceInputStream(Enumeration e)`：初始化新新 `SequenceInputStream`\
  \ 并记住参数，该参数必须是一个产生运行时类型为 `InputStream` 的对象的 `Enumeration`。 |\n\n操作上，该类从第一个 `InputStream`\
  \ 满足读取请求直到它耗尽，然后切换到第二个。在 `Enumeration` 的情况下，它将继续通过所有的 `InputStream` 直到达到最后一个的结束。\n\
  \n### 示例 15.13\n```java\n1. import java.io.*;\n2. class SequenceInputStreamTest\n\
  3. { \n4. public static void main(String args[]) throws IOException\n5. { \n6. FileInputStream\
  \ f1 = new FileInputStream(args[0]);\n7. FileInputStream f2 = new FileInputStream(args[1]);\n\
  8. FileOutputStream f3 = new FileOutputStream(args[2]);\n9. SequenceInputStream\
  \ sis = new SequenceInputStream(f1,f2);\n10.     int c;\n```\n\n\n\n\n```java\n\
  while((c = sis.read()) != -1)\n{\n    f3.write(c);\n}\nf3.close();f1.close();f2.close();\n\
  }\n}\n```\n\nOutput:\n```\nSequenceInputStreamTest A.txt B.txt C.txt\n```\n\n###\
  \ PrintStream\n\n它是一个字节流类，继承自 `FilterOutputStream`。`PrintStream` 为另一个输出流增加了功能，即能够方便地打印各种数据值的表示形式。\n\
  \n可选地，可以创建一个 `PrintStream` 以便自动刷新（flush）；这意味着在写入字节数组、调用其中一个 `println` 方法，或者写入换行符或换行字节（`\\\
  n`）之后，会自动调用 `flush` 方法。\n\n由 `PrintStream` 打印的所有字符都将使用平台的默认字符编码转换为字节，然后写入构造函数中指定的\
  \ `OutputStream` 或 `File`。\n\n`PrintStream` 支持针对所有类型（包括 `object`）的 `print()` 和 `println()`\
  \ 方法。如果参数不是简单类型，`PrintStream` 方法将调用对象的 `toString()` 方法并打印结果。\n\n### 构造函数：\n\n- `PrintStream(File\
  \ file)`：创建一个新的文件打印流，不进行自动行刷新。\n- `PrintStream(String fileName)`：创建一个新的指定文件名的新打印流，不进行自动行刷新。\n\
  - `PrintStream(OutputStream out)`：创建一个连接到指定 `OutputStream` 的新打印流。\n- `PrintStream(OutputStream\
  \ out, boolean autoFlush)`：创建一个连接到指定 `OutputStream` 的新打印流。\n\n![C:\\Users\\Made\
  \ Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image032.jpg)\n\n### 示例 15.14\n\
  \n```java\nimport java.io.*;\nclass PrintStreamTest\n{\n    public static void main\
  \ (String args[]) throws IOException\n    {\n        PrintStream ps = new PrintStream(System.out,\
  \ true);\n        ps.println(\"This is a string\");\n        int i = -7;\n     \
  \   ps.println(i);\n        double d = 4.5e-7;\n        ps.println(d);\n    }\n\
  }\n```\n\nOutput:\n```\nThis is a string\n-7\n4.5E-7\n```\n\n### 示例 15.15\n\n```java\n\
  import java.io.*;\nclass PrintStreamTest2\n{\n    public static void main (String\
