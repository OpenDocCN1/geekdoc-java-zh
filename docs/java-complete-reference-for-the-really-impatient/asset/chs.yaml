  \            }\n        }\n        System.out.println(name + \" exiting\");\n  \
  \  }\n}\n\nclass SuspendResume {\n    public static void main(String args[]) {\n\
  \        A ob1 = new A(\"One\");\n        A ob2 = new A(\"Two\");\n        try {\n\
  \            Thread.sleep(1000);\n            ob1.suspend();\n            System.out.println(\"\
  Suspending one\");\n            Thread.sleep(1000);\n            ob1.resume();\n\
