  \ `toArray()` 方法来实现。我们可能想要将集合转换为数组的原因有几个，例如：- 为某些操作操作获得更快的处理速度。- 将数组传递给没有重载以接受集合的方法。-\
  \ 将我们较新的基于集合的代码与不理解集合的遗留代码集成。 |\n| `public Object[] toArray(Object[] a)` | |\n|\
