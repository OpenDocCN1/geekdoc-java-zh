  \       pw.println(i);\n        double d = 4.5e-7;\n        pw.println(d);\n   \
  \     pw.close();\n    }\n}\n```\n\n### PipedInputStream 和 PipedOutputStream\n\n\
  管道输出流可以连接到管道输入流以创建一个通信管道。管道输出流是管道的发送端。管道输入流应该连接到管道输出流；随后管道输入流将提供写入管道输出流的任何字节。\n\n\
  通常，数据由一个线程从 `PipedInputStream` 对象中读取，并由另一个线程写入相应的 `PipedOutputStream` 中。不建议在单个线程中使用尝试这两个对象，因为可能会导致线程死锁。管道输入流包含一个缓冲区，在限制范围内将读操作与写操作分离。\n\
  \n### 构造函数：\n\n- `PipedInputStream()`：创建一个 `PipedInputStream`，使其尚未连接。\n- `PipedInputStream(PipedInputStream\
  \ src)`：创建一个 `PipedInputStream`，使其连接到输出流 `src`。\n- `PipedOutputStream()`：创建一个尚未连接到管道输入流的管道输出流。\n\
  - `PipedOutputStream(PipedInputStream snc)`：创建一个连接到管道输入流的管道输出流。\n\n### 示例 15.19\n\
  \n```java\nimport java.io.*;\nclass TextGenerator extends Thread\n{\n    OutputStream\
  \ out;\n    TextGenerator(OutputStream out)\n    {\n        this.out = out;\n  \
  \  }\n    public void run()\n    {\n        try\n        {\n            try\n  \
  \          {\n                for(byte b = 65; b<=90; b++)\n                   \
  \ out.write(b);\n            }\n            finally\n            {\n           \
  \     out.close();\n            }\n        }\n        catch(IOException e)\n   \
  \     {\n            System.out.println(e);\n        }\n    }\n}\nclass Pipe\n{\n\
  \    public static void main(String args[]) throws IOException\n    {\n        PipedOutputStream\
  \ out = new PipedOutputStream();\n        PipedInputStream in = new PipedInputStream(out);\n\
  \        TextGenerator data = new TextGenerator(out);\n        data.start();\n \
  \       int ch;\n        while((ch = in.read()) != -1)\n            System.out.print((char)\
  \ ch);\n    }\n}\n```\nOutput:\n```\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n```\n\nPipedReader\
  \ 和 PipedWriter:-\n\n\n\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream` 相同，唯一的区别在于它们是字符流。\n\
  \n### 构造函数\n\n- `PipedReader()`\n创建一个 `PipedReader`，但它尚未连接。\n\n- `PipedReader(PipedWriter\
  \ src)`\n创建一个 `PipedReader`，使其连接到管道写入器 `src`。\n\n- `PipedWriter()`\n创建一个尚未连接到管道读取器的\
  \ `Piped writer`（管道写入器）。\n\n- `PipedWriter(PipedReader snk)`\n创建一个连接到指定 `PipedReader`\
  \ 的管道写入器。\n\n### 示例 15.20\n\n```java\nimport java.io.*;\nclass TextGenerator extends\
  \ Thread\n{ \n  Writer out;\n  TextGenerator(Writer out)\n  { \n    this.out = out;\n\
  \  }\n  public void run()\n  { \n    try\n    { \n      try\n      { \n        for(char\
  \ c = 'a'; c<='z'; c++)\n            out.write(c);\n      }\n      finally\n   \
  \   { \n        try\n        {  \n          Thread.sleep(2000);  \n        } \n\
  \        catch(Exception e) {}\n      System.out.println(\"aaaaaaaaaaaaa\");\n \
  \     if(true)\n      return;  // IOException: pipe Broken\n      out.close(); \
  \ //IOException: Write end dead\n    }  //OK if thread finishes after closing the\
  \ pipe\n    }\n    catch(IOException e)   { System.out.println(e);}\n  }\n}\nclass\
  \ Pipe2\n{ \n  public static void main (String argv[]) throws IOException\n  { \n\
  \    PrintStream ps = new PrintStream(System.out);\n    PipedWriter out = new PipedWriter();\n\
  \    PipedReader in = new PipedReader(out);\n    TextGenerator data = new TextGenerator(out);\n\
  \    data.start(); int ch;\n    while((ch = in.read()) != -1)\n      System.out.print((char)\
  \ ch);\n  }\n}\n```\n\n**输出：**\n```\nabcdefghijklmnopqrstuvwxyzaaaaaaaaaaaaa\nException\
  \ in thread \"main\" java.io.IOException: Pipe broken\nat java.io.PipedReader.read(Unknown\
  \ Source)\nat Pipe2.main(Pipe2.java:43)\n```\n\n### 过滤字节流\n\n过滤流仅仅是底层输入流或输出流的包装器，透明地提供某些扩展功能。典型的扩展包括缓冲、zip\
  \ 压缩/解压等。过滤字节流是 `FilterInputStream` 和 `FilterOutputStream`。它们的构造函数为：\n\n- `FilterInputStream(InputStream\
  \ in)`\n通过将参数 `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后使用它。\n\n- `FilterOutputStream(OutputStream\
  \ out)`\n创建一个构建在指定的底层输出流之上的输出流过滤器。\n\n在这些类中提供的方法与 `InputStream` 和 `OutputStream`\
  \ 中的方法相同。\n\n### 缓冲字节流\n\n对于面向字节的流，缓冲流通过在 I/O 流上附加内存缓冲区来扩展过滤流类。该缓冲区允许 Java 每次处理多于一个字节的\
  \ I/O 操作，从而提高性能。\n\n由于缓冲区的可用，流的跳过（skip）、标记（mark）和重置（reset）变得可能。缓冲字节流类是 `BufferedInputStream`\
  \ 和 `BufferedOutputStream`。`PushbackInputStream` 也实现了缓冲流。\n\n### BufferedInputStream\n\
  \n缓冲 I/O 是一种非常常见的性能优化。Java 的 `BufferedInputStream` 类允许你将任何 `InputStream` “包装”成缓冲流，并实现这种性能提升。\n\
  \n`BufferedInputStream` 有两个构造函数：\n\n- `BufferedInputStream(InputStream in)`\n创建一个\
  \ `BufferedInputStream` 并保存其参数输入流 `in` 以供稍后使用。创建一个内部数组并存储在 `buf` 中。\n\n- `BufferedInputStream(InputStream\
  \ in, int size)`\n创建一个具有指定缓冲区大小的 `BufferedInputStream`，并保存其参数输入流 `in` 以供稍后使用。缓冲输入流还为支持向后移动提供了基础。除了任何流中实现的\
  \ `read()` 和 `skip()` 方法外，`BufferedInputStream` 还支持 `mark()` 和 `reset()` 方法。这种支持体现在\
  \ `markSupported()` 返回 `true` 上。\n\n### 示例 15.21\n\n```java\nimport java.io.*;\n\
  class BufferedInputStreamTest\n{\n  public static void main(String args[]) throws\
  \ IOException\n  {\n    FileInputStream fin=new FileInputStream(\"A.txt\");\n  \
  \  BufferedInputStream b1 = new BufferedInputStream(fin);\n    for(int i=1;i<=10;i++)\n\
  \    {\n      System.out.print((char)b1.read());\n    }\n    System.out.println();\n\
  \    if(b1.markSupported())\n    {\n      b1.mark(500);\n      for(int i=1;i<=10;i++)\n\
  \      {\n        System.out.print((char)b1.read());\n      }\n      System.out.println();\n\
  \      b1.reset();\n      for(int i=1;i<=10;i++)\n      {\n        System.out.print((char)b1.read());\n\
  \      }\n    }\n    else\n      System.out.println(\"Marking option is not availabel\"\
  );\n    b1.close();\n    fin.close();\n  }\n}\n```\n\n**输出：**\n```\nmatrix Research\
  \ And\nearch And\n```\n\n**注意：** `mark(32)` 保留了后续 32 字节（这足够所有内容）。`mark` 的限制是缓冲区大小。这意味着你可以指定的\
  \ `mark()` 参数小于缓冲区大小。\n\n### BufferedOutputStream\n\n与缓冲输入不同，缓冲输出不提供额外功能。它仅用于提高性能。这里有两个构造函数：\n\
  \n- `BufferedOutputStream(OutputStream out)`\n创建一个写入到指定底层输出流的缓冲输出流。它使用 512 字节的缓冲区。\n\
  \n- `BufferedOutputStream(OutputStream out, int size)`\n创建一个具有指定缓冲区大小的写入到指定底层输出流的缓冲输出流。\n\
  \n### 示例 15.22\n\n```java\nimport java.io.*;\nclass BufferedOutputStreamTest\n{\
  \ \n  public static void main(String args[ ]) throws IOException\n  { \n    BufferedOutputStream\
  \ f = new BufferedOutputStream (System.out,100);\n    byte buf[ ] = \"This will\
  \ be displayed without flush()\\n\".getBytes();\n    f.write(buf);\n    f.write(buf);\n\
  \    System.out.println(\"testing...\");\n    //f.flush();\n    //f.close();\n \
  \ }\n}\n```\n\n**输出：**\n```\ntesting...\n```\n\n\n\n\n使用 `BufferedWriter` 可以减少数据实际物理写入输出流的次数，从而提高性能。\n\
  \n### 构造函数\n\n- `BufferedWriter(Writer out)`：创建一个使用默认大小输出缓冲区的缓冲字符输出流。\n- `BufferedWriter(Writer\
  \ out, int sz)`：创建一个使用指定大小输出缓冲区缓冲字符输出流。\n\n### 示例 15.24\n```java\nimport java.io.*;\n\
  \nclass BufferedWriterTest\n{ \n  public static void main(String args[]) throws\
  \ IOException\n    {\n      BufferedWriter f = new BufferedWriter(new PrintWriter(System.out));\n\
  \      String s  = \"This will not be displayed without flush()\\n\";\n      char\
  \ buf[ ] = new char[s.length()];\n      s.getChars(0,s.length(),buf,0);\n      f.write(buf);\n\
  \      f.write(buf);\n      System.out.println(\"testing...\");\n      f.write(buf);\n\
  \      //f.flush();\n      //f.close();\n    }\n}\n```\n输出：\n```\ntesting...\n```\n\
  \n### 使用字节流处理原始数据类型\n\n基础输入和输出流提供的读/写方法只能用于读/写字节或字符。\n\n如果我们想读/写整数和双精度浮等原始数据类型，可以使用过滤器类作为现有输入输出流的包装器，以对原始流中的数据进行过滤。\n\
  \n用于创建处理原始类型的“数据流”的两个过滤器类是 `DataInputStream` 和 `DataOutputStream`。这些类使用了如下所示的多重继承概念，并实现了父类和接口中包含的所有方法。\n\
  \n![image](img/image011.png)\n\n从文件读取输入的输入数据流可以按如下方式创建：\n```java\nFileInputStream\
  \ fis = new FileInputStream(infile);\nDataInputStream dis = new DataInputStream(fis);\n\
  ```\n这些语句基本上将 `dis` 封装在 `fis` 之上并将其用作“过滤器”。同样，以下语句创建了输出数据流 `dos` 并将其封装在输出文件流 `fos`\
  \ 上。\n```java\nFileOutputStream fos = new FileOutputStream(outfile);\nDataOutputStream\
  \ dos = new DataOutputStream(fos);\n```\n\n### 示例 15.25\n以下程序演示了原始数据的读取和写入。\n```java\n\
  import java.io.*;\n\nclass ReadWritePrimitive\n{ \n  public static void main (String\
  \ args[]) throws IOException\n    { \n      File primitive = new File(\"prim.dat\"\
  );\n      FileOutputStream fos = new FileOutputStream(primitive);\n      DataOutputStream\
  \ dos = new DataOutputStream(fos);\n      dos.writeInt(1999);\n      dos.writeDouble(222.44);\n\
  \      dos.writeBoolean(false);\n      dos.writeChar('X');\n      dos.close();\n\
  \      fos.close();\n      FileInputStream fis = new FileInputStream(primitive);\n\
  \      DataInputStream dis = new DataInputStream(fis);\n      System.out.println(dis.readInt());\n\
  \      System.out.println(dis.readDouble());\n      System.out.println(dis.readBoolean());\n\
  \      System.out.println(dis.readChar());\n      dis.close();\n      fis.close();\n\
  \    }\n}\n```\n输出：\n```\n1999\n222.44\nfalse\nX\n```\n\n## 定义流\n\n`System` 类包含了三个预定义的流变量——`in`、`out`\
  \ 和 `err`。这些字段在 `System` 类中声明为 `public` 和 `static`。这意味着它们可以被程序的任何部分使用，而无需引用特定对象。\n\
  \n- `System.out` 指标准输出流。默认情况下，这是控制台。`System.out` 是 `PrintStream` 类型的对象。\n- `System.in`\
  \ 指标准输入，默认是键盘。`System.in` 是 `InputStream` 类型的对象。\n- `System.err` 指标准错误流，默认情况下也是控制台。`System.err`\
  \ 是 `PrintStream` 类型的对象。\n\n这些都是字节流，尽管它们通常用于从控制台向或读写字符。如果需要，你可以将它们封装在基于字符的流中。\n\n\
  ### InputStreamReader\n\n`InputStreamReader` 是从字节流到字符流的桥梁；它读取字节并使用指定的字符集将其解码为字符。它使用的字符集可以明确指定，也可以接受平台的默认字符集。\n\
  \n### 构造函数：\n- `InputStreamReader(InputStream in)`：创建一个使用默认字符集的 `InputStreamReader`。\n\
  - `InputStreamReader(InputStream in, String charsetName)`：创建一个使用指定字符集的 `InputStreamReader`。\n\
  \n### 示例 15.26\n```java\nimport java.io.*;\n\nclass InputStreamReaderTest\n{ \n\
  \  public static void main (String argv[]) throws IOException\n    { \n      char\
  \ c;\n      InputStreamReader is = new InputStreamReader(System.in);\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char)is.read();\n      while(c!='q')\n\
  \        { \n          System.out.print(c);\n          c = (char)is.read();\n  \
  \      }\n    }\n}\n```\n输出：\n```\nEnter characters, 'q' to quit\nabcd\nq\n```\n\
  \n### 示例 15.27\n对上一个示例进行了修改，使用了缓冲区来提高性能。\n```java\nimport java.io.*;\n\nclass BufferedReaderTest\n\
  { \n  public static void main (String args[]) throws IOException\n    { \n     \
  \ char c;\n      BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \      System.out.println(\"Enter characters, 'q' to quit\");\n      c = (char)br.read();\n\
  \      while(c!='q')\n        { \n          System.out.print(c);\n          c =\
  \ (char)br.read();\n        }\n    }\n}\n```\n输出：\n```\nEnter characters, 'q' to\
  \ quit\nabcd\nq\n```\n\n### 示例 15.28\n`InputStreamReader` 不提供 `readLine()` 方法，因此\
  \ `InputStreamReader` 连接到提供 `readLine()` 方法的 `BufferedReader`。\n```java\nimport\
  \ java.io.*;\n\nclass BufferedReaderTest\n{ \n  public static void main (String\
  \ argv[]) throws IOException\n    { \n      BufferedReader br = new BufferedReader(new\
  \ InputStreamReader(System.in));\n      System.out.println(\"Enter 'stop' to quit\"\
  );\n      String str = br.readLine();\n      while(!str.equals(\"stop\"))\n    \
  \    { \n          System.out.println(\"Your Name:\"+str);\n          str = br.readLine();\n\
  \        }\n    }\n}\n```\n输出：\n```\nEnter 'stop' to quit\nHarry Feat\nYour Name:Harry\
  \ Feat\nstop\n```\n\n## OutputStreamWriter\n\n`OutputStreamWriter` 是从字符流到字节流的桥梁：写入它的字符将使用指定的字符集编码为字节。它使用的字符集可以明确指定，也可以接受平台的默认字符集。\n\
  \n### 构造函数：\n- `OutputStreamWriter(OutputStream out)`：创建一个使用默认字符编码的 `OutputStream`。\n\
  - `OutputStreamWriter(OutputStream out, String charsetName)`：创建一个使用指定字符集的 `OutputStream`。\n\
  \n### 读取控制输入\n\n在 Java 1.0 中，执行控制输入的唯一方法是使用字节流，使用这种方法的旧代码仍然存在。今天，使用字节流读取控制输入在技术上仍然可行，但这样做可能需要使用已弃的方法，且这种方法不被推荐。\n\
  \n在 Java 中，控制输入通过读取 `System.in` 实现。为了获取连接控制台的字符流，你需要将 `System.in` 封装在 `InputStreamReader`\
  \ 对象中，可以进一步封装在 `BufferedReader` 对象中以提高性能。\n\n### 示例 15.29\n此示例演示了我们可以直接从 `System.in`\
  \ 读取。\n```java\nimport java.io.*;\n\nclass ReadFromConsole\n{ \n  public static\
  \ void main (String arg[]) throws IOException\n    { \n      char c;\n      System.out.println(\"\
  Enter characters, 'q' to quit\");\n      c = (char) System.in.read();\n      while(c!='q')\n\
  \        { \n          System.out.print(c);\n          c = (char) System.in.read();\n\
  \        }\n    }\n}\n```\n\n\n\n从控制台读取正确方法是将 `System.in` 封装在 `InputStreamReader`\
  \ 中，并进一步封装在 `BufferedReader` 中以提高性能并一次读取一行。相关的示例已经在之前与 `InputStreamReader` 类相关的章节中介绍过。\n\
  \n## 写入控制台输出\n\n控制台输出通过 `print()` 和 `println()` 最容易实现。这些方法由 `PrintStream` 类定义（该类是\
  \ `System.out` 所引用对象的类型）。尽管 `System.out` 是一个字节流，但将它用于简单的程序输出是可以接受的。\n\n然而，基于字符的替代方案是正确的选择。因为\
  \ `PrintStream` 是派生自 `OutputStream` 的输出流，它也实现了低级方法 `write()`。因此，可以使用 `write()` 向控制台写入内容。`PrintStream`\
  \ 定义的 `write()` 最简单的形式是：\n\n```java\nvoid write(int byteval)\n```\n\n该方法向流中写入由 `byteval`\
  \ 指定的字节。尽管 `byteval` 被声明为整数，但只有低 8 位会被写入。\n\n### 示例 15.30\n\n```java\nimport java.io.*;\n\
  \nclass WriteTest\n{\n    public static void main (String argv[ ]) throws IOException\n\
  \    {\n      int b;\n      b = 'A';\n      System.out.write(b);\n      // System.out.flush();to\
  \ flush\n      System.out.write('\\n');//to flush\n    }\n}\n```\n\n**输出:**\n```\n\
  A\n```\n\n**注意：**\n你不会经常使用 `write()` 来执行控制台输出，因为 `print()` 和 `println()` 使用起来简单得多。\n\
  \n## 序列化\n\n序列化是将对象的状态写入字节流的过程。当你想要将状态存储到字节流时，这种方法非常有用。当你想要将程序状态保存到持久存储区域（如文件）时，这同样有用。在稍后的时候，你可以使用反序列化过程来恢复这些对象。\n\
  \n实现 RMI 也需要序列化。RMI 允许一台机器上的 Java 对象调用另一台机器上 Java 对象的方法。对象可以作为参数传递给远程方法。发送端对对象进行序列化并翻译。接收端对其反序列化。\n\
  \n如果你尝试序列化对象图顶部的对象，所有其他引用的对象都会递归地被定位并序列化。\n\n同样，在反序列化过程中，所有这些对象及其引用都被正确地存储。声明为 `transient`\
  \ 或 `static` 的变量不会被序列化机制保存。\n\n## Externalizable 接口\n\nJava 序列化和反序列化机制的设计使得保存和恢复对象状态的大部分工作可以自动完成。\n\
  \n然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密技术可能是必要的。`Externalizable` 接口正是为了这些情况设计的。实现\
  \ `Externalizable` 接口的对象也可以被序列化和反序列化。\n\n但控制权在用户手中，即用户可以决定序列化和反序列化部分。序列化代码写在 `readExternal()`\
  \ 方法中，反序列化代码写在 `writeExternal()` 方法中。\n\n### Externalizable 接口中的方法\n\n```java\n\
  void readExternal(ObjectInput in)\n```\n\n对象实现 `readExternal` 方法，通过调用针对原始数据类型的 `DataInput`\
  \ 方法以及针对对象、字符串和数组的 `readObject` 方法来恢复其内容。\n\n```java\nvoid writeExternal(ObjectOutput\
  \ out)\n```\n\n对象实现 `writeExternal` 方法，通过调用针对其原始值的 `DataOutput` 方法或针对对象、字符串和数组的\
  \ `ObjectOutput` 方法来保存其内容。\n\n## ObjectOutput 接口\n\n`ObjectOutput` 接口扩展 `DataOutput`\
  \ 接口并支持对象序列化。除了 `DataOutput` 接口定义的方法外，`ObjectOutput` 接口只定义了一个方法。\n\n```java\nVoid\
  \ writeObject(Object object)\n```\n\n调用此方法来序列化对象。`ObjectOutput` 接口的所有方法在错误条件下都会抛出\
  \ `IOException`。\n\n## ObjectOutputStream\n\n`ObjectOutputStream` 类扩展 `OutputStream`\
  \ 类并实现了 `ObjectOutput` 接口。它负责将对象写入流中。\n\n### 构造函数\n\n```java\nObjectOutputStream(OutputStream\
  \ out)\n```\n\n创建一个写入指定 `OutputStream` 的 `ObjectOutputStream`。参数 `out` 是序列化对象将写入的输出流。\n\
  \n### 写入对象的方法\n\n```java\nvoid writeObject(Object obj)\n```\n\n将对象写入底层存储或流中。\n\n\
  ---\n\n## ObjectInput 接口\n\n`ObjectInput` 接口扩展 `DataInput` 接口。它支持对象序列化。除了 `DataInput`\
  \ 接口定义的方法外，`ObjectInput` 接口仅定义了一个方法：\n\n```java\nObject readObject()\n```\n\n调用此方法反序列化对象。\n\
  \n## ObjectInputStream\n\n`ObjectInputStream` 类扩展 `InputStream` 类并实现 `ObjectInput`\
  \ 接口。`ObjectInputStream` 负责从流中读取对象。\n\n### 构造函数\n\n```java\nObjectInputStream(InputStream\
  \ in)\n```\n\n创建一个从指定 `InputStream` 读取的 `ObjectInputStream`。参数 `in` 是应该读取序列化对象的输入流。\n\
  \n反序列化方法为：\n\n```java\nObject readObject()\n```\n\n从 `ObjectInputStream` 读取对象。\n\
  \n### 示例 15.31\n\n```java\nimport java.io.*;\n\nclass SerializationTest\n{\n   \
  \ public static void main (String args[])\n    {\n      try\n      {\n        MyClass\
  \ object1 = new MyClass(\"Hello\", 123, 1.3e3);\n        MyClass object2 = new MyClass(\"\
  Hello1\", 1, 2);\n        System.out.println(object1);\n        System.out.println(object2);\n\
  \        FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n        ObjectOutputStream\
  \ oos = new ObjectOutputStream(fos);\n        oos.writeObject(object1);\n      \
  \  oos.writeObject(object2);\n        oos.flush();\n        oos.close();\n     \
  \ }\n      catch(Exception e)\n      {\n        System.out.println(e);\n      }\n\
  \      try\n      {\n        MyClass object3, object4;\n        FileInputStream\
  \ fis = new FileInputStream(\"serial.dat\");\n        ObjectInputStream ois = new\
  \ ObjectInputStream(fis);\n        object3 = (MyClass) ois.readObject();\n     \
  \   object4 = (MyClass) ois.readObject();\n        ois.close();\n        System.out.println(\"\
  After deserialization\");\n        System.out.println(object3);\n        System.out.println(object4);\n\
  \      }\n      catch(Exception e)\n      {\n        System.out.println(e);\n  \
  \    }\n    }\n}\n\nclass MyClass implements Serializable\n{\n    String s;\n  \
  \  int i=100;\n    double d;\n    MyClass(String s, int i, double d)\n    {\n  \
  \    this.s = s;\n      this.i = i;\n      this.d = d;\n    }\n    public String\
  \ toString()\n    {\n      return \"s = \"+ s +\"; i = \"+ i + \" ; d = \" +d;\n\
  \    }\n}\n```\n\n**输出:**\n```\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1; i =\
  \ 1 ; d = 2.0\nAfter deserialization\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1;\
  \ i = 1 ; d = 2.0\n```\n\n**注意：** 我们可以在一个文件中保存多个同类型的对象，也可以在同一个文件中保存不同类型的对象。\n\n\
  ### 示例 15.32\n\n此示例演示了 `transient` 和 `static` 变量在序列化过程中不会被持久化。\n\n```java\nimport\
  \ java.io.*;\n\nclass SerializationTest2\n{\n    public static void main (String\
  \ args[]) throws IOException\n    {\n      try\n      {\n        MyClass object1\
  \ = new MyClass(\"Hello\", 123, 1.3e3);\n        MyClass object3 = new MyClass(\"\
  Hello1\", 1, 2);\n        object3.x = 200;\n        A object5 = new A();\n     \
  \   System.out.println(object1);\n        System.out.println(object3);\n       \
  \ System.out.println(object5);\n      }\n    }\n}\n```\n（注：此处代码块基于原文逻辑，由于原文未提供完整的\
  \ MyClass 和 A 类的定义，已按要求保留格式）\n\n\n\n\n```java\nFileOutputStream fos = new FileOutputStream(\"\
  serial.dat\");\nObjectOutputStream oos = new ObjectOutputStream(fos);\noos.writeObject(object1);\n\
  oos.writeObject(object3);\noos.writeObject(object5);\nobject3.x = 400;\noos.flush();\n\
  oos.close();\n} catch(Exception e) {\n    System.out.println(e);\n}\ntry {\n   \
  \ MyClass object2, object4;\n    A object6;\n    FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n    ObjectInputStream ois = new ObjectInputStream(fis);\n    object2\
  \ = (MyClass) ois.readObject();\n    object4 = (MyClass) ois.readObject();\n   \
  \ object6 = (A) ois.readObject();\n    ois.close();\n    fis.close();\n    System.out.println(\"\
  After deserialization\");\n    System.out.println(object2);\n    System.out.println(object4);\n\
  \    System.out.println(object6);\n} catch(Exception e) {\n    System.out.println(e);\n\
  }\n}\n}\nclass MyClass implements Serializable {\n    String s;\n    transient private\
  \ int i=100;\n    public static int x = 10;\n    double d;\n    MyClass(String s,\
  \ int i, double d) {\n        this.s = s;\n        this.i = i;\n        this.d =\
  \ d;\n        x = 100;\n    }\n    public String toString() {\n        return \"\
  s = \" + s + \"; i = \"+ i + \" ;d = \" + d +\"; x = \"+ x;\n    }\n}\nclass A implements\
  \ Serializable {\n    public String toString() {\n        return \"Class A\";\n\
  \    }\n}\n```\n\n### 示例 15.33\n\n#### 使用 Externalizable\n\n```java\nimport java.io.*;\n\
  class SerializationTest1 {\n    public static void main (String args[]) throws IOException\
  \ {\n        try {\n            MyClass object1 = new MyClass(\"Hello\", 99, 123.45);\n\
  \            System.out.println(object1);\n            FileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  \            System.out.println(\"写入对象 1\");\n            oos.writeObject(object1);\n\
  \            System.out.println(\"写入对象 3\");\n            oos.writeObject(object3);\n\
  \            System.out.println(\"写入对象 5\");\n            oos.writeObject(object5);\n\
  \            object3.x = 400;\n            oos.flush();\n            oos.close();\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \        try {\n            MyClass object2, object4;\n            A object6;\n\
  \            FileInputStream fis = new FileInputStream(\"serial.dat\");\n      \
  \      ObjectInputStream ois = new ObjectInputStream(fis);\n            object2\
  \ = (MyClass) ois.readObject();\n            object4 = (MyClass) ois.readObject();\n\
  \            object6 = (A) ois.readObject();\n            ois.close();\n       \
  \     fis.close();\n            System.out.println(\"反序列化后\");\n            System.out.println(object2);\n\
  \            System.out.println(object4);\n            System.out.println(object6);\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
