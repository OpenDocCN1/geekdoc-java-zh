  \n注意：选择列表中的项目会引起列表发送项事件；双击项目会发送动作事件。\n\n`void add(String item)`\n\n向滚动列表的末尾添加指定的项目。\n\
  \n\n\n\n### List 类方法\n\n`void add(String item, int index)`\n将指定的项目添加到由 `index` 指明位置的滚动列表中。\n\
  \n`void addActionListener(ActionListener i)`\n添加指定的动作监听器，以接收来自此列表的动作事件。\n\n`void\
  \ addItemListener(ItemListener i)`\n添加指定的项目监听器，以接收来自此列表的项目事件。\n\n`String getItem(int\
  \ index)`\n获取与指定的 `index` 关联的项目。\n\n`int getItemCount()`\n获取列表中的项目数量。\n\n`String[]\
  \ getItems()`\n获取列表中的所有项目。\n\n`int getRows()`\n获取此列表中可见的行数。\n\n`int getSelectedIndex()`\n\
  获取列表中被选中项目的索引。\n\n`int[] getSelectedIndexes()`\n获取列表中被选中的索引数组。\n\n`String getSelectedItem()`\n\
  获取此滚动列表中的被选中项目。\n\n`String[] getSelectedItems()`\n获取此滚动列表中的所有选中项目。\n\n`void remove(int\
  \ position)`\n从此滚动列表中删除指定位置的项目。\n\n`void remove(String item)`\n从列表中删除第一个出现的项目。\n\
  \n`void removeAll()`\n删除此列表中的所有项目。\n\n`void replaceItem(String newValue, int index)`\n\
  将滚动列表中指定索引的项目替换为新字符串。\n\n`void select(int index)`\n选取滚动列表中指定 `index` 处的项目。\n\n`void\
  \ setMultipleMode(boolean b)`\n设置标志，决定此列表是否允许多项选择。\n\n### 示例代码\n\n```java\nimport\
  \ java.awt.*;\nimport java.awt.event.*;\nclass ListTest extends Frame implements\
