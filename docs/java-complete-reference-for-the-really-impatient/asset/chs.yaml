  \n# ∞ 核心 Java 技能——轻松学会！ ∞\n\n跟随畅销书《Java 编程》作者 Harry. H. Chaudhary（销量超过 16.7 万册！），在短时间内学习\
  \ Java 编程的所有基础和高级特性。本 Java 指南从基础开始，通过数千行 Java 代码详细地引导你进入 Java 的高级特性，我承诺这本书将使你成为\
  \ Java 专家级冠军。任何人都可以通过这本书以专家水平学习 Java。\n\n工程类专业的学生和新手开发者也可以使用这本书。这本书涵盖了所有计算机科学专业专业的通用核心大纲。如果你是认真的，请拿起这本终极\
  \ Java 书开启你的一天。\n\n本 Java 书的主要目标不仅仅是为你提供 Java 编程知识，我遵循了一种模式，通过对每个 Java 主题问题的不同 Java\
  \ 复杂度进行清晰的理论解释，改进数千个代码的解决方案，你将发现复杂的 Java 问题有多种解决方案。\n\n### 特别之处——\n\n在书中，我为开发者和新手详细地涵盖并解释了最新的\
  \ Java 8 特性的几个主题，如– Lambdas。|| Java 8 功能式接口，|| `Stream` 以及 Java 8 中的时间 API。\n\n\
  如果你读过这本书，你就知道可以期待什么：一种根据你大脑工作方式设计的视觉丰富的格式。如果你没读过，那你将大开眼了。你会发现为什么人们说它与你读过的任何其他 Java\
  \ 书不同。\n\n学习一种新语言并非易事，特别是当它是像 Java 这样一种面向对象的编程语言时。你可能认为问题出在大脑上。它似乎有自己的主见，并不总是想要吸收你被迫学习的枯燥技术内容。事实是，你的大脑渴望新奇感。它不断地寻找、扫描，等待着异常事的发生。毕竟，它是为了帮助你生存而这样构建的。它将所有常规、平凡、无聊的内容过滤到背景中，以防干扰你大脑的真实工作——记录重要的事情。你的大脑是如何知道什么是重要的呢？\n\
  \n本 Java 书不需要以前的编程经验。然而，如果你有 `C` 或 `C++` 编程背景，你将能够学得更快。\n\n正因如此，本 Java 书对 Java 的几个关键特性进行了快速详细的概述。这里介绍的材料将在后续章节中通过大量的\
  \ Java 代码进行深入探讨。\n\n这些\n\n——\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
  \n![STAR-LOGO-2013](img/image024.png)\n\n# 章节\n\n# ∞ 1 ∞\n\n## (Java 概述)\n\n###\
  \ 简介\n\nJava 是一种由 Sun Microsystems 在 1991 年开发的强大面向对象编程语言。Java 最初是为消费电子设备开发的，后来转向了互联网。现在，Java\
  \ 已成为互联网上广泛使用的编程语言。Java 是一种平台无关语言（机器无关）。用 Java 开发的程序可以在世界上任何硬件或任何操作系统上运行。\n\n###\
  \ 对 Java 的需求\n\nJava 的开发是因为需要一种平台无关语言，用于创建嵌入各种消费电子设备（如微波炉和遥控器）的软件。用 `C` 和 `C++`\
  \ 编写的程序针对特定的硬件和软件编译，该程序无法在任何其他硬件或软件上运行。因此，我们需要为每种类型的类型的 `C/C++` 编译器来编译同一个程序。但编译器的创建既昂贵又耗时。因此，需要一种平台无关语言。这样从该编译器编译的程序可以在任何硬件上运行。这种需求导致了\
  \ Java 的诞生。\n\n### Java 类库\n\nJava 程序由称为类的部分组成。类由称为方法的部分组成，方法执行任务并在完成任务时返回信息。你可以编写所需的每个部分以形成一个\
  \ Java 程序。然而，大多数 Java 程序员都会利用 Java 类库中丰富的现有类集合。类库也被称为 Java `API`（应用程序接口）。\n\n\n\n\
  \n在全书中，我们讨论了许多类库。类库主要由编译器厂商提供，但许多类库由独立软件供应商（ISV）提供。此外，许多类库可以通过互联网和万维网以免费软件或共享软件的形式获取。你可以下载免费软件并供免费使用，但须遵守版权所有者指定的任何限制。\n\
  \n## 典型 Java 环境的基础\n\nJava 系统通常由几个部分组成：环境、语言、`Java 应用程序接口`（`API`）以及各种类库。接下来的讨论解释了一个典型的\
  \ Java 程序开发环境，Java 程序通常经过五个阶段执行。这些阶段是：编辑、编译、加载、验证和执行。随后的描述使用了标准的 `Java SE 7 开发包`（`JDK\
  \ 7`），它由 Oracle 提供。\n\n如果你使用的是不同的 Java 开发环境，那么你可能需要遵循不同的程序来编译和执行 Java 程序。在这种情况下，请查阅编译器的文档获取详情。\n\
  \n注意：如果你没有使用 `UNIX/Linux`、`Windows 95/98/ME` 或 `Windows NT/2000`，请参考你系统 Java 环境的手册，或询问导师如何在你的环境中完成这些任务（你的环境可能与上述相似）。\n\
  \n### 阶段 1：编辑文件\n\n这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入 Java 程序，并在必要时进行修正。当程序员指定保存编辑器中的文件时，该程序被存储在磁盘等次级存储设备上。Java\
  \ 程序文件名以 `.java` 扩展名结尾。\n\n`UNIX/Linux` 系统广泛使用的两种编辑器是 `vi` 和 `emacs`。在 `Windows\
  \ 95/98/ME` 和 `Windows NT/2000` 上，简单的编辑程序如 `DOS Edit` 命令和 `Windows Notepad`（记事本）就足够了。\n\
  \nJava 集成开发环境（IDE），如 `Forte for Java Community Edition`、`NetBeans`、`Borland’s JBuilder`、`Symantec’s\
  \ Visual Cafe` 和 `IBM’s Visual Age` 都内置了集成到编程环境中的编辑器。\n\n我们假设读者知道编辑文件。`Java` 这样的语言是面向对象的——在这样的语言中编程被称为面向对象编程（`OOP`），它允许设计人员将面向对象的设计实现为运行的系统。相比之下，`C`\
  \ 等语言是过程化编程语言，因此编程倾向于以动为导向。\n\n## Java 与 C\n\n在 `C` 中，编程单元是 `function`。在 `Java`\
  \ 中，编程单元是 `class`，对象最终从类中实例化（这是“创建”的华丽说法）。`Java` 类包含方法（实现类行为）和属性（实现类数据）。\n\n`C`\
  \ 程序员专注于编写函数。执行某些共同任务的动作组被组成函数，而函数组合成程序。数据在 `C` 中固然是重要的，但其观点是，数据的存在主要是为了支持函数所执行的动作。系统规范中的动词帮助\
  \ `C` 程序员确定实现该系统所需的函数集。\n\n`Java` 程序员专注于创建他们自定义的、称为 `classes` 的类型和组件。每个 `class`\
  \ 包含数据以及操作这些数据的函数集。`Java` 类的数据组件被称为 `attributes`。\n\n`Java` 类的函数组件被称为 `methods`。正就像内置类型（如\
  \ `int`）的实例被称为变量，用户定义类型（即 `class`）的实例被称为对象（`object）。程序员使用内置类型作为构建用户定义类型的“构建块”。\n\
  \n`Java` 的重点是 `classes`（我们从中创建对象）而不是函数。系统规范中的名词帮助 `Java` 程序员确定用于创建对象的 `classes`\
  \ 集合，这些对象将协作实现系统。\n\n`Classes` 之于对象好比蓝图之于房屋。我们可以从一张蓝图建造许多房屋，也可以从一个 `class` 实例化许多对象。`Classes`\
  \ 还可以与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行柜员” `class` 需要与“客户” `class` 关联。这些关系被称为关联。我们将看到，当软件被封装为\
  \ `classes` 时，这些类可以在未来的软件系统中重用。相关的类组通常被封装为可重用的组件。\n\n你创建的每个新 `class` 都有成为价值软件资产的潜力，你和其他程序员可以使用它来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\
  \n## Java 与 C、C++ 及 C# 的关系\n\n`Java` 从 `C` 继承了语法，从 `C++` 继承了面向对象的特性。它不是 `C++` 的增强版。`Java`\
  \ 既不向上也不向下兼容 `C++`。我想告诉你们的一个重要点是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。微软开发的另一种支持 `.NET\
  \ Framework` 的语言 `C#` 与 `Java` 密切相关，因为它们都共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n## Java 的主要目标是\n\n### 1. 安全性\n在使用兼容 Java 的网络浏览器时没有病毒感染的威胁。此外，没有恶意程序可以从本地机器收集隐私信息（如信用卡号、银行账户余额和密码）。`Java`\
  \ 在网络应用程序和我们的计算机之间提供了一个防火墙。\n\n### 2. 可移植性\n`Java` 程序可以在运行不同操作系统和不同硬件的计算机之间迁移。\n\
  \n## Java 字节码\n\nJava 编译器的输出是字节码而不是机器码（`.class` 文件）。字节码是一种高度优化的指令集，旨在由 Java 运行时系统（称为\
  \ `JVM` `Java Virtual Machine`）执行。\n\n`JVM` 是解释字节码的解释器。编译后的程序运行更快，但 Java 仍然使用解释器来实现可移植性，因此\
  \ Java 程序运行速度稍慢。现在，通过 Java 编译器编译的程序可以在任何环境中运行，但每个平台都需要实现 `JVM`。Java 程序是被解释的。这有助于提高安全性，因为每个\
  \ Java 程序的执行都在 `JVM` 的控制之下。\n\n## JIT（即时编译）\n\n`JIT` 是 `JVM` 用于将字节码翻译成实际机器码的翻译器。它不翻译整个字节码，而是按需逐步翻译。\n\
  \n## Java 的各个版本\n\n- Java 1: `JDK 1.0`、`JDK 1.1`\n- Java 2: `JDK 1.2`、`JDK 1.3`、`JDK\
  \ 1.4`、`JDK 1.5` 或 `JDK 5`、`JDK 1.6` 或 `JDK 6`\n- Java 1.7: `SE 7` Java SE 8 `Java\
  \ 8` (2014 年 4 月)\n\n注 1：JDK (`Java Development Kit`)\n注 2：旧 Java 版本的许多功能被新 Java\
  \ 版本弃用，但我们仍然可以使用它们。\n\n## Java 可以开发的应用程序类型\n\n1. **独立应用程序**：独立应用程序是运行在我们本地计算机的操作系统上的程序，类似于\
  \ `C` 或 `C++` 程序。\n2. **Applet（小程序）**：`applet` 是一种可以在互联网上传输并在客户端机器上由兼容 Java 的浏览器（如\
  \ `Internet Explorer` 或 `Netscape Navigator`）执行的小程序。\n\n`applet` 不能像独立应用程序那样执行。`applet`\
  \ 只能通过嵌入 HTML 页面（如声音文件、图像文件或视频剪辑）来执行。\n\n\n\n\n现在这个嵌入了 applet（小程序）的 HTML 页面可以在本地机器通过网络浏览器下载此类\
  \ HTML 页面后运行。applet 是一种对用户输入做出响应并动态变化的程序。它不会重复播放相同的动画或声音。\n\n### 1. Web 应用程序\n这些是运行在\
  \ Web 服务器上的程序。当我们在网络浏览器中指定 URL（通用资源定位符）访问网站时，网络浏览器会向 Web 服务器发送针对特定网站的请求。在接收到请求后，服务器会运行一个程序，该程序被称为\
  \ Web Application（Web ）。我们使用 `Java Servlets` 和 `JSP (Java Server Pages)` 来编写此类程序。\n\
  \n这些程序运行在服务器上，然后将结果/响应发送给客户端`JSP` 页面可以被看作 HTML 和 Java 代码的结合。Web 服务器在执行之前会将 `JSP`\
  \ 页面转换为 `Java Servlets`。\n\n当客户端请求特定的 URL 且该 URL 对应 HTML 页面时，Web 服务器直接将 HTML 页面返回给客户端，由客户端显示。如果\
  \ URL 对应 servlet 或 `JSP`，则它将在服务器上执行并将结果/响应返回给客户端，最后由客户端显示。\n\n### 2. 分布式应用程序\nJava\
  \ 应用被分成许多小的程序，可以运行在不同的机器上。这些程序中使用的对象可以相互通信。这些应用程序被称为分布式应用程序（Distributed Applications）。这允许两台不同计算机上的对象远程执行过程。为此，使用了\
  \ `RMI (Remote Method Invocation)`。\n\n––––––––\n\n## Java 的特性:-\n\n### 1. 简单\n\
  Java 的语法几乎与 `C` 和 `C++` 相似，因此熟悉 `C/C++` 的程序员不需要从头开始学习语法。但 `C/C++` 中许多复杂或导致歧义的特性在\
  \ Java 中已被删除了。\n\n1. `Java` 不支持多继承，因为这个概念有点复杂并可能导致歧义。\n2. `Java` 不支持全局变量，这也导致了 `C/C++`\
  \ 程序中出现许多 bug。\n3. `Java` 不使用指针，也不允许指针运算，由于固有的复杂性，这是 `C/C++` 程序中大多数 bug 的产生。\n4.\
  \ `Java` 不支持运算符重载，因为它可能导致混淆。\n5. `Java` 中没有垃圾值的概念。我们必须在使用之前初始化变量。\n\n### 2. 安全\n\
  `Java` 程序运行在 `JVM (Java Virtual Machine)` 内部，其他部分无法访问它们。这极大地提高了安全性。由于这一特性，`Java`\
  \ 程序很少挂起。这与频繁挂起的 `C/C++` 程序完全不同。`Java` 的安全模型包含三个主要组成部分：\n\n1. 类加载器 (Class loader)。\n\
  2. 字节码验证器 (Bytecode Verifier)。\n3. 安全管理器 (Security Manager)。\n\n`Java` 使用不同的类加载器从本地和远程机器加载类文件（可执行文件）。从远程机器加载的类（如\
  \ `Applet` 类）不允许读写本地机器上的文件。这防止了恶意程序损坏本地文件系统`Bytecode verifier` 在类加载器完成工作后立即验证字节码。它确保字节码是有效的\
  \ Java 代码。它几乎消除了 Java 程序执行某些恶意活动（如访问 `JVM` 外部内存）的可能性。`Security Manager` 控制文件删除、线程创建等关键操作。只有当\
  \ Java 程序具有足够的权限时，才允许这些操作，否则 `Security Manager` 不允许这些操作并生成 `Security Exception`。\n\
  \n### 3. 可移植\n`Java` 程序是平台无关的。它们遵循“一次编写，随运行”的策略。为 Windows 平台编写的 `Java` 程序只需通过复制字节码（`.class`\
  \ 文件）即可运行在任何其他平台（Unix、Linux、Sun Solaris 等）。不需要像 `C/C++` 程序那样需要复制源代码并重新编译。这一特性使 Java\
  \ 成为了一门强大的语言。只要机器具有 `JVM`，我们就可以在任何机器上运行字节码。`JVM` 本身是依赖平台的，但它使 Java 代码变得与平台无关。实际上是\
  \ `JVM` 将字节码转换为机器码并执行它们。\n\n所以我们可以说 `Java` 是一种可移植的语言。另一个让 Java 高度可移植的特性是无论平台如何，原始数据类型的长度都是固定的。例如，在\
  \ `Java` 中 `int` 始终是 4 字节。这与 `C/C++` 不同，`int` 的大小在某些机器上可能是 2 字节，在另一些机器上可能是 4 字节。\n\
  \n### 4. 面向对象\n`Java` 几乎是纯面向对象的语言，但出于性能考虑，它支持原始数据类型如 `byte`、`short`、`int`、`long`、`float`、`double`、`char`、`boolean`。\n\
  \n### 5. 健壮\n大多数程序失败是因为两个原因之一：\n1. 内存管理。\n2. 运行时异常情况。\n\n在设计语言时，目标之一是确保 Java 程序尽可能健壮，即它们很少失败。因此，Java\
  \ 非常上述两个因素。\n\n在 `Java` 中，内存分配和释放由语言本身处理，消除了由于 `C/C++` 中动态内存管理功能引起的许多问题。`Java` 还支持面向对象的异常处理功能来处理运行时发生的异常情况。这允许\
  \ Java 程序在发生异常情况后恢复并继续执行。\n\n### 6. 多线程\n`Java` 的设计是为了满足现实世界创建交互式网络程序的需求。`Java`\
  \ 提供编写多线程程序的支持。这允许程序员编写可以同时执行许多任务的程序。\n\n例如，一个 `GUI (Graphical Interface)` 应用程序可能正在监听事件并采取行动，另一个线程可能正在打印，另一个线程可能正在从网络上的某机器下载文件，所有这些并发进行。这带来了更好的性能和更好的\
  \ CPU 利用率。\n\n在其他语言中也可以编写多线程程序，但只能通过使用系统调用来实现，而在 Java 中，可以通过语言本身的特性来实现。\n\n### 7.\
  \ 架构中立\n程序员面临的主要问题之一是，无法保证我们今天编写的程序明天还能在同一台机器上运行。操作系统升级、处理器升级以及核心系统资源的变化可能共同导致程序出现故障。但\
  \ Java 程序的目标是“一次编写，随处运行”。\n\n### 8. 解释执行与高性能\n`Java` 程序是解释执行的，但与其他解释器相比，它们运行很快。\n\
  \n 9. 分布式\n`Java` 是为互联网的分布式环境设计的。`Java` 内置为此支持各种基于 TCP/IP 的协议。事实上，使用 `URL` 访问资源类似于访问本地机器上的文件。`Java`\
  \ 还具有远程方法调用的功能，这与远程过程调用 (RPC) 。这允许不同计算机上的对象远程执行过程。`Java` 为此提供了内置 API，称为 `RMI`。\n\
  \n### 10. 动态\n每个 Java 类都是一个独立的执行单元。类仅在需要时才在运行时加载。Java 中方法绑定的默认机制也是动态的（运行时绑定）。\n\n\
  ## 运行独立的 Java 应用程序:-\n\n当 `C` 或 `C++` 程序被编译时，它被直接转换为特定处理器或特定平台的机器码。但运行 Java 程序是一个两步骤的过程。在\
  \ Java 中，从源代码到可执行代码的转换是通过使用两个翻译器来实现的：\n\n\n\n\n# Java 编程概述\n\n1. **Java 编译器** -\
  \ 首次，Java 程序被编译成字节码。字节码类似于机器码，但并非针对特定的处理器或平台。字节码不能直接执行。\n\n2. **Java 解释器 (JVM)**\
  \ - Java 解释器通过 `JIT` 将字节码翻译成特定平台的实际机器码。\n\n**注意 1** - `C` 或 `C++` 程序仅编译一次，但 Java\
  \ 字节码在我们每次执行 Java 程序时都会被翻译。因此，与 `C/ C++` 程序相比，Java 程序的运行速度稍慢。\n\n**注意 2** - 运行 Java\
  \ 程序我们需要一个文本编辑器（记事本或 Edit）、`JDK`（Java 开发工具包）以及 `JVM`（已安装在许多操作系统中）。我们也可以使用 `Eclipse`\
  \ 或 `JCreator` 代替记事本。\n\n## 在 win xp 上安装 Java 1.7 -\n\n双击 `我的电脑` $\\rightarrow$\
  \ 双击 `光驱器` $\\rightarrow$ 双击 `JDK1.7 Java 安装文件` $\\rightarrow$ 点击 `Next`、`Next`、.....\n\
  \n## 设置 Path -\n\n如果我们设置了 Java 文件夹的路径，就可以从任何地方运行 Java 程序，否则我们必须从 Java 的 `bin` 文件夹运行\
  \ Java 程序。\n\n右键点击 `我的电脑` $\\rightarrow$ `属性` $\\rightarrow$ `高级` $\\rightarrow$\
  \ `环境变量` $\\rightarrow$ 点击 `Path` 然后点击 `编辑` $\\rightarrow$ 点击变量值 $\\rightarrow$\
  \ 按 `END` 将光标移动到行尾 $\\rightarrow$ 现在输入 `c:\\program files\\Java\\jdk1.7.0_01\\bin;`\
  \ 然后点击 `OK`、`OK`、`OK`。\n\n## 为 Java 程序创建文件夹:-\n\n双击 `我的电脑` $\\rightarrow$ 双击 `C\
  \ 盘` $\\rightarrow$ 右键 $\\rightarrow$ `新建` $\\rightarrow$ `文件夹` $\\rightarrow$ 输入\
  \ `JAVAPRG` $\\rightarrow$ 按 `Enter` 并关闭“我的电脑”。\n\n## 在命令提示符上运行 Java 程序的步骤:-\n\n\
  **步骤 1**: 进入命令提示符\n`开始` $\\rightarrow$ `运行` $\\rightarrow$ 输入 `cmd` 并点击 `确定`。\n\n\
  **步骤 2**: 输入 `CD \\ JAVAPRG` 并按 `Enter`。\n\n**步骤 3**: 输入 `Edit Sum.Java` 并按 `Enter`。\n\
  \n**步骤 4**: 输入 Java 程序并点击 `文件` $\\rightarrow$ `保存`，然后点击 `文件` $\\rightarrow$ `退出`。\n\
  \n**步骤 5**: 输入 `javac Sum.Java` 并按回车编译。这将创建一个 `Sum.class` 文件。该文件被称为字节码。\n\n**步骤\
  \ 6**: 输入 `java Sum` 并按回车运行。这会调用 `JVM`。\n\n**步骤 7**: 输入 `Exit` 然后按回车退出命令提示符。\n\n\
  **注意** - 我们也可以通过上述步骤使用 `记事本` 运行 Java 程序，但不是使用 `Edit` 命令，而是使用 `记事本`。在输入 Java 程序后，在另存为对话框中选择“所有文件”，将其保存到文件夹\
  \ `C:\\JAVAPRG`。要编译和运行，我们需要遵循上述步骤。\n\n## Java 程序语法:-\n\n```java\nclass <class name>\n\
  {\n    public static void main(String args[]) or (String [] args)\n    {\n     \
  \   // ---\n    }\n}\n```\n\n## 第一个 Java 程序 - 两个数字相加 (Sum.Java)\n\n```java\nclass\
  \ Sum\n{\n    public static void main(String args[])\n    {\n        int a,b,sum;\n\
  \        a = 5;\n        b = 6;\n        sum = a + b;\n        System.out.print(\"\
  Sum is \" + sum); //输出\n    }\n}\n```\n**输出:** `Sum is 11.`\n\n## 示例 1.2 交换两个数字程序\
  \ (Swap.Java)\n\n```java\nclass Swap\n{\n    public static void main(String args[])\n\
  \    {\n        int a=5,b=7;\n        t = a;\n        a = b;\n        b = t;\n \
  \       System.out.print(\"After Swap Values are \" + a + \",\" + b);\n    }\n}\n\
  ```\n**输出:** `After Swap Values are 7,5`\n\n## 注释-\n\n有 3 类型的注释：\n- 单行注释：`//`\n\
  - 多行注释：`/* */`\n- 文档注释：`/** */`\n\n- 每个 Java 程序必须包含一个类。在 Java 中，`main()` 方法只能定义在类内部。\n\
  - 一个源文件可以有任意数量的类和/接口定义，但最多可以有一个公共类或接口。\n- 源文件可能包含也不包含带有 `main()` 方法的类，但一个独立的 Java\
  \ 程序始终从 `main()` 方法开始执行。因此，我们想要开始执行的类必须在其中定义了 `main()` 方法。\n- `main()` 方法必须始终具有以下签名：`public\
  \ static void main(String args[])`\n\n**注意** - 在 Java 中，方法原型被称为签名（signature）。\n\n\
  - `public` 关键字表示该方法可以从任何地方访问。\n- `static` 关键字表示可以在不创建对象的情况下调用 `main()`。\n- `void`\
  \ 关键字表示 `main()` 不返回任何值。\n- `main()` 方法接收一个参数，即 `String` 类型的数组。\n- `System` 是一个预定义的类，提供了对系统的访问，`out`\
  \ 是连接到控制台的输出流。\n\n## Java 程序的结构\n\n- **文档部分**：文档部分包含一组注释行，给出程序名称、作者以及程序员在以后阶段参考的其他信息。注释解释了类的为什么、是什么以及算法如何。\n\
  - **包语句**：一个源文件最多有一个包语句。如果存在包语句，它必须是 Java 程序的第一个语句。只有注释可以包语句之前。\n- **导入语句**：源文件可以有零或多个导入语句。导入语句类似于\
  \ C/C++ 中的 `#include` 语句。如果存在，所有的导入语句必须位于包语句之后、类接口定义之前。\n- **接口语句**：接口类似于类，但包含一组方法声明。这也是一个可选部分，仅在我们希望程序中实现多重继承功能时使用。\n\
  - **不包含 main 方法的类定义**：Java 程序可以包含多个类定义。类是 Java 程序的首要元素。这些类用于映射现实世界问题的对象。\n- **包含\
  \ main 方法的类定义**：由于每个独立的 Java 程序都需要 main 方法作为其起始点，因此该类是 Java 程序的关键部分。main 方法创建各种类的对象并建立它们之间的通信。当\
  \ main 方法结束时，程序终止并将控制权交回操作系统。\n\n## 垃圾回收 -\n\nJava 对象的内存分配完全是动态，但 Java 不像 C/C++\
  \ 那样支持指针算术。每当我们运行 Java 程序时，JVM 也会后台运行另一个名为垃圾回收器（Garbage Collector）的程序（线程）。垃圾回收器会检查\
  \ Java 对象。\n\n\n\n\n\n当一个 Java 对象不再被使用时，它会被垃圾回收器（Garbage Collector）收集，即为对象分配的内存被添加到空闲内存池\
  \ `pool/heap` 中可以重复使用。这在很大程度上简化了程序员的任务。它还消除了许多由于不当使用指针算术和显式释放内存等内存管理功能导致的错误。\n\n\
  # 单选题\n\n1. 下列哪些应用程序 `main()` 方法的有效定义？\n\n(a) `public static void main();`\n\n(b)\
  \ `public static void main( String args );`\n\n(c) `public static void main( String\
  \ args[] );`\n\n(d) `public static void main( Graphics g );`\n\n(e) `public static\
  \ boolean main( String args[] );`\n\n2. 哪个组织开发了 Java 语言？\n\n(a) `Microsoft` (b)\
  \ `IBM`\n(c) `Sun Microsytems Inc.` (d) `AT&T`\n\n3. Java 属于以下哪种语言分类？\n\n(a) `Object-Oriented`（面向对象）\
  \ (b) `Procedural`（过程化）\n(c) `Both (a) & (b)`（两者都是） (d) `None of the above`（以上都不是）\n\
  \n4. 下列哪项不是正确的描述？\n\n(a) `Garbage collection in Java is automatic.`（Java 的垃圾回收是自动的。）\n\
  (b) `Java provides support for distribution applications.`（Java 支持分布式应用。）\n(c) `Java\
  \ is more efficient as compared to C/C++.`（与 C/C++ 相比，Java 更高效。）\n(d) `Java is more\
  \ secure as compared to C/C++.`（与 C/C++ 相比，Java 更安全。）\n\n5. 下列哪项是正确的描述？\n\n(a) `Java\
  \ is a platform independent language?`（Java 是平台无关语言吗？）\n(b) `Java is an Object-Oriented\
  \ language?`（Java 是面向对象的语言吗？）\n(c) `Java supports 多线程.`（Java 支持多线程。）\n(d) `All of\
  \ the above.`（以上都是。）\n\n答案：1. (c) 2. (c) 3. (a) 4. (c) 5. (d)\n\n# 理论题\n\n1. 解释\
