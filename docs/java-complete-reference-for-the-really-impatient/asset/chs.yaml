  \ java.lang.String.replace(char,char)`\n\n# Java 反射 (Reflection)\n\n- Java 反射允许程序在运行时检查或操作其自身的结构。\n\
  - 你可以使用反射获取类、构造器、字段和方法，并可以使用反射调用它们。\n\n```java\nimport java.lang.reflect.Field;\n\
  import java.lang.reflect.Method;\nimport java.lang.reflect.Constructor;\n\npublic\
  \ class ReflectionExample {\n    public static void main(String[] args) throws Exception\
  \ {\n        Class<?> clazz = String.class;\n        System.out.println(\"Class\
  \ Name: \" + clazz.getName());\n\n        // 获取字段\n        Field field = clazz.getDeclaredField(\"\
  value\");\n        field.setAccessible(true);\n        System.out.println(\"Field\
  \ value: \" + field.get(\"hello\"));\n\n        // 获取并调用方法\n        Method method\
  \ = clazz.getMethod(\"toUpperCase\");\n        Object result = method.invoke(\"\
  hello world\");\n        System.out.println(\"Result of toUpperCaseCase: \" + result);\n\
  \    }\n}\n```\n\n# 注解 (Annotations)\n\n- 注解是关于数据的数据，它们提供了关于程序中的元数据。\n- 注解可以标记在类、方法、字段、参数或类型上。\n\
  \n```java\nimport java.lang.annotation.*;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
  @Target(ElementType.METHOD)\n@interface MyAnnotation {\n    String value() default\
  \ \"default\";\n    int count() default 1;\n}\n\nclass AnnotationExample {\n   \
  \ @MyAnnotation(value = \"Hello\", count = 5)\n    public void sayHello() {\n  \
  \      System.out.println(\"Hello World\");\n    }\n\n    public static void main(String[]\
  \ args) throws Exception {\n        for (Method method : AnnotationExample.class.getDeclaredMethods())\
  \ {\n            if (method.isAnnotationPresent(MyAnnotation.class)) {\n       \
  \         MyAnnotation annotation = method.getAnnotation(MyAnnotation.class);\n\
  \                System.out.println(\"Annotation value: \" + annotation.value());\n\
  \                System.out.println(\"Count: \" + annotation.count());\n       \
  \     }\n        }\n    }\n}\n```\n\n# 泛型 (Generics)\n\n- 泛型允许在定义类、接口和方法时使用类型参数。\n\
  - 它们提供了编译时的类型安全并减少了显式的类型转换。\n\n```java\nimport java.util.ArrayList;\n\nclass Box<T>\
  \ {\n    private T content;\n\n    public void set(T content) {\n        this.content\
  \ = content;\n    }\n\n    public T get() {\n        return content; // 无需强制类型转换\n\
  \    }\n}\n\npublic class GenericsExample {\n    public static void main(String[]\
  \ args) {\n        Box<Integer> intBox = new Box<>();\n        intBox.set(10);\n\
  \        System.out.println(\"Integer Value: \" + intBox.get());\n\n        Box<String>\
  \ stringBox = new Box<>();\n        boundingBox.set(\"Java\");\n        System.out.println(\"\
  String Value: \" + stringBox.get());\n    }\n}\n```\n\n\n\n\n```java\n18. String\
  \ s=\"Box b:\" + b; // 拼接箱对象并调用 toString() 方法\n19.System.out.println(b); // 调用 toString()\
  \ 方法\n20.System.out.println(s);\n21. }\n22. }\n```\n**Output:**\n```\nDimension\
  \ are 8.0 by 11.0 by 13.0\nBox b: Dimension are 8.0 by 11.0 by 13.0\n```\n\n###\
  \ 5. `protected void finalize() throws Throwable`\n\n该方法在对象被垃圾回收之前被调用，以便完成任何清理工作。然而，`Object`\
  \ 类中的默认 `finalize()` 方法没有做任何有用的操作。这对于释放非 Java 资源可能有用，但不推荐这样做。如果内存充足，`finalize()`\
  \ 方法可能永远不会被调用，在这种情况下资源可能永远不会被释放。\n\n### 6. `protected Object clone() throws CloneNotSupportedException`\n\
  \n通过 `clone()` 方法可以创建与当前对象完全相同（即具有相同状态）的新对象，即复制原始类型值和引用值，这被称为**浅克隆**（shallow cloning）。\n\
  \n类可以重写 `clone()` 方法以提供其自己的克隆逻辑。例如，通过递归地克隆组成对象来克隆复合对象，被称为**深克隆**（deep cloning）。在重写时，子类中的方法通常声明为\
  \ `public`，以允许任何客户端克隆该类的对象。\n\n如果重写 `clone()` 方法依赖于 `Object` 类的 `clone()` 方法，则子类必须实现\
  \ `Cloneable` 标记接口，以指示其对象可以安全地克隆。否则，`Object` 类的 `clone()` 方法将抛出异常 `CloneNotSupportedException`。\n\
  \n### 使用 `clone()` 和 `Cloneable` 接口\n\n`clone()` 方法会为被调用的对象生成一个副本。以下是关于 `clone()`\
  \ 方法的一些重要事实：\n\n- 只有实现了 `Cloneable` 接口的类才能被克隆。`Cloneable` 接口没有定义任何成员。它用于指示一个类允许对对象进行位拷贝（即克隆）。\n\
  - 如果尝试对未实现 `Cloneable` 接口的对象调用 `clone()`，将抛出 `CloneNotSupportedException`。\n- `Cloneable`\
  \ 接口是一个空接口。这种接口被称为标记接口（marker/tag interface）。在创建克隆时，不会调用被克隆对象的构造函数。\n- 克隆仅仅是原始对象的完全复制。克隆是一个潜在的危险操作，因为它可能导致意外之外的副作用。\n\
  \n例如，如果被克隆的对象包含一个名为 `objRef` 的引用变量，那么在创建克隆时，克隆中的 `objRef` 将指向与原始对象 `objRef` 相同的对象。如果克隆修改了\
  \ `objRef` 所指向对象的内容，原始对象的内容也会随之改变。\n\n### 示例 20.5\n\n以下示例演示了 `clone()` 方法的使用。`CloneDemo1`\
  \ 类通过 `clone2()` 方法间接调用 `clone()` 方法，为 `TestClone1` 类的对象创建克隆。\n\n```java\nclass\
  \ TestClone1 implements Cloneable\n{\n    int a;\n    float b;\n    public TestClone1\
  \ clone2() throws CloneNotSupportedException\n    {\n        return (TestClone1)\
  \ clone();\n    }\n}\nclass CloneDemo1\n{\n    public static void main(String a[])\
  \ throws CloneNotSupportedException\n    {\n        TestClone1 tc1 = new TestClone1();\n\
  \        TestClone1 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n        tc2 = tc1.clone2();\n\
  \        System.out.println(tc2.a);\n        System.out.println(tc2.b);\n    }\n\
  }\n```\n**Output:**\n```\n8\n4.5\n```\n在这里，`clone2()` 方法调用 `Object` 类的 `clone()`\
  \ 方法并返回结果。注意，`clone()` 返回的对象必须强制转换为相应的类型，即 `TestClone1`。\n\n### 示例 20.6\n\n在以下示例中，重写了\
  \ `clone()` 方法以便从类外部代码调用。为了实现这一点，其访问修饰符必须是 `public`。\n\n```java\nclass TestClone2\
  \ implements Cloneable\n{\n    int a;\n    float b;\n    public Object clone() throws\
  \ CloneNotSupportedException\n    {\n        return super.clone();\n    }\n}\nclass\
  \ CloneDemo2\n{\n    public static void main(String args[]) throws CloneNotSupportedException\n\
  \    {\n        TestClone2 tc1 = new TestClone2();\n        TestClone2 tc2;\n  \
  \      tc1.a = 8; tc1.b = 4.5f;\n        tc2 = (TestClone2) tc1.clone();\n     \
  \   System.out.println(tc2.a + \" \" + tc2.b);\n    }\n}\n```\n**Output:**\n```\n\
  8 , 4.5\n```\n\n### 示例 20.7\n\n在以下示例中，重写了 `clone()` 方法，使其不使用 `Object` 类的 `clone()`\
  \ 方法。我们正在编写自己的 `clone()` 方法。\n\n```java\nclass TestClone3\n{\n    int a;\n    float\
  \ b;\n    public Object clone()\n    {\n        TestClone3 tc = new TestClone3();\n\
  \        tc.a = this.a;\n        tc.b = this.b;\n        return tc;\n    }\n}\n\
  class CloneDemo3\n{\n    public static void main(String args[])\n    {\n       \
  \ TestClone3 tc1 = new TestClone3();\n        tc1.a = 8;\n        tc1.b = 4.5f;\n\
  \        TestClone3 tc2 = (TestClone3) tc1.clone();\n        System.out.println(tc2.a\
  \ + \" \" + tc2.b);\n    }\n}\n```\n**Output:**\n```\n8 , 4.5\n```\n\n### 示例 20.9\n\
  \n以下代码通过实现深克隆消除了上一个示例中的问题。\n\n```java\nclass TestDeepClone implements Cloneable\n\
  {\n    int a;\n    float b;\n    int c[];\n    public Object clone() throws CloneNotSupportedException\n\
  \    {\n        TestDeepClone tc = (TestDeepClone)super.clone();\n        int d[]\
  \ = new int[4];\n        for(int i=0; i<4; i++)\n            d[i] = c[i];\n    \
  \    tc.c = d; \n        return (tc);\n    }\n}\nclass DeepCloneDemo\n{\n    public\
  \ static void main(String arg[]) throws CloneNotSupportedException\n    {\n    \
  \    TestDeepClone tc1 = new TestDeepClone();\n        TestDeepClone tc2;\n    \
  \    tc1.a = 8;\n        tc1.b = 4.5;\n        int c[] = new int[4];\n        for(int\
  \ i=0; i<4; i++)\n            c[i] = i;\n        tc1.c = c;\n        tc2 = (TestDeepClone)\
  \ tc1.clone();\n        tc2.c[0] = 99; // 修改克隆对象不影响原始对象\n        System.out.println(tc1.c[0]);\
  \ // 输出应为 0\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.println(“tc1.c[”+ i +”]=”\
  \ + tc1.c[i]);\ntc2 = (TestDeepClone) tc1.clone();\nSystem.out.println(“tc2.a”+tc2.a);\n\
  System.out.println(“tc2.b”+tc2.b);\nfor(int i=0; i<4; i++)\n    System.out.println(“tc2.c[”\
  \ + i + “]=” + tc2.c[i]);\nfor(int i=0; i<4; i++)\n    tc2.c[i] = i+4;\nfor(int\
  \ i=0; i<4; i++)\n    System.out.println(“tc2.c[” + i + “]=” + tc2.c[i]);\nfor(int\
  \ i=0; i<4; i++)\n    System.out.println(“tc1.c[” + i + “]=” + tc1.c[i]);\n```\n\
  \n**输出:**\n```\ntc1.c[0]=0\ntc1.c[1]=1\ntc1.c[2]=2\ntc1.c[3]=3\ntc2.a=8\ntc2.b=4.5\n\
  tc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\ntc2.c[3]=3\ntc2.c[0]=4\ntc2.c[1]=5\ntc2.c[2]=6\n\
  tc2.c[3]=7\ntc1.c[0]=0\ntc1.c[1]=1 own\n```\n\n### 多线程环境中的有用方法\n\n除了上述讨论的方法外，`Object`\
  \ 类通过以下方法为同步代码中的线程通信提供了支持：导致当前线程等待，直到另一个线程对该对象调用 `notify()` 方法或 `notifyAll()` 方法。\n\
  \n*   `final void wait(long timeout) throws InterruptedException`\n*   `final void\
  \ wait(long timeout, long nanos) throws InterruptedException`\n    导致当前线程等待，直到另一个线程调用了该对象的\
  \ `notify()` 方法或 `notifyAll()` 方法，或者其他线程中断了当前线程，或者指定的时间已过。\n*   `final void notify()`\n\
  \    唤醒等待在该对象监视器上的单个线程。\n*   `final void notifyAll()`\n    唤醒所有等待在该对象监视器上的线程。线程通过调用其中一个\
  \ `wait` 方法在对象的监视器上等待。\n\n线程在它持有的锁对象上调用这些方法。线程等待另一个线程的通知。\n\n![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)![11](img/image015.jpg)\n\
