  \ 测试两个字符串区域是否相等。 | |\n| 20 | `public boolean regionMatches(Boolean ignoreCase, int\
  \ startIndex, String str2, int str2StartIndex, int len)` 测试两个字符串区域是否相等。如果 `ignoreCase`\
  \ 标志为 true，则忽略大小写差异 | |\n| 21 | `public boolean startsWith(String prefix, int startIndex)`\
  \ 测试字符串是否从指定索引开始以指定的前缀开头。该方法不返回任何异常，但如果 `startIndex` 越界则返回 false。 | |\n| 22 | `public\
  \ boolean startsWith(String)` 测试字符串是否以指定的前缀开头。 | |\n| 23 | `public boolean endsWith(String\
  \ suffix)` 测试字符串是否以指定的后缀结尾。 | |\n| 24 | `public int indexOf(char ch)` 返回指定字符在字符串中首次出现的索引。\
  \ | |\n| 25 | `public int indexOf(char ch, int fromIndex)` 返回指定字符在字符串中首次出现的索引，从指定的索引开始搜索。\
