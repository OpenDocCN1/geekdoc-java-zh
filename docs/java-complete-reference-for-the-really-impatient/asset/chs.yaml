  \        String[] nm = f.list();\n        for(int i=0; i<nm.length; i++) {\n   \
  \         File f4 = new File(nm[i]);\n            if(f4.isFile()) {\n          \
  \      System.out.println(\"is file\");\n            } else {\n                System.out.println(\"\
  is a directory\");\n            }\n        }\n        File f5 = new File(\"zzz\"\
  );\n        f5.mkdir();\n        File f6 = new File(\"yyy\");\n        f6.mkdirs();\n\
  \    }\n}\n```\n\n**输出:**\n```\nLength=1782 bytes\nName=FileTest.java\nParent=\\\
  javaprog/ch15/15.1\nPath=\\javaprog/ch15/15.1\\FileTest.java\nAbsolute Path=C:\\\
  javaprog\\ch15\\15.1\\FileTest.java\nExists\nis file\nis readable\nis writable\n\
  is directory\nnot hidden\nlast modified:1236241680000\nis file\nis directory\n```\n\
  \n\n\n\n\n## FileOutputStream 方法\n\n| 签名 | 描述 |\n| :--- | :--- |\n| `public FileOutputStream(File)\
  \ throws FileNotFoundException;` | 创建一个文件输出流，用于写入指定的 `File` 对象所表示的文件。 |\n| `public\
  \ FileOutputStream(File, boolean) throws FileNotFoundException;` | 创建一个文件输出流，用于写入指定的\
  \ `File` 对象所表示的文件。 |\n| `public native void write(int) throws java.io.IOException;`\
  \ | |\n| `public void write(byte[ ]) throws java.io.IOException;` | |\n| `public\
  \ void write(byte[ ], int, int) throws java.io.IOException;` | |\n| `public void\
  \ close( ) throws java.io.IOException;` | |\n\n### 示例 15.2\n\n```java\nimport java.io.*;\n\
  class FileRead\n{\n  public static void main(String args[])\n  {\n    FileInputStream\
  \ fin=null;\n    int a;\n      try\n      {\n        fin=new FileInputStream(args[0]);\n\
  \        System.out.println(\"No. of characters to read=\"+fin.available());\n \
  \       fin.skip(3);\n        a = fin.read();\n        while(a != -1)\n        {\n\
  \          System.out.print((char)a);\n          a = fin.read();\n        }\n  \
  \      System.out.println(\"No. of characters to read=\"+fin.available());\n   \
  \     fin.close(); \n      }\n      catch(ArrayIndexOutOfBoundsException e)\n  \
  \    {\n        System.out.println(e);\n      }\n      catch(FileNotFoundException\
  \ e)\n      {\n        System.out.println(e);\n      }\n      catch(IOException\
  \ e)\n      {\n        System.out.println(e);\n      }\n  }\n}\n```\n\n**输出：**\n\
  ```text\njava FileRead A.txt\nNo. of characters to read=20\nMatrix Computers\nNo.\
  \ of characters to read=0\n```\n\n### 示例 15.3\n\n```java\nimport java.io.*;\nclass\
  \ FileCopy\n{\n  public static void main(String args[]) throws IOException\n  {\n\
  \    FileInputStream fin=null;\n    FileOutputStream fout=null;\n    fin=new FileInputStream(args[0]);\n\
  \    fout=new FileOutputStream(args[1]);\n    int a;\n    a = fin.read();\n    while(a\
  \ != -1)\n    {\n      fout.write(a);\n      a = fin.read();\n    }\n    fin.close();fout.close();\n\
  \  }\n}\n```\n\n### 示例 15.4\n\n```java\nimport java.io.*;\nclass CopyFile\n{\n \
  \ public static void main(String args[]) throws IOException\n  { \n    int n;\n\
  \    FileInputStream fin = new FileInputStream(\"A.txt\");\n    FileOutputStream\
  \ fout = new FileOutputStream(\"B.txt\");\n    byte b[ ]= new byte[10];\n    n =\
  \ fin.read(b);\n    while(n != -1)\n    { \n      fout.write(b,0,n);\n      n =\
  \ fin.read(b);\n    }\n    fin.close();\n    fout.close();\n  }\n}\n```\n\n---\n\
  \n## FileReader\n\n`FileReader` 类创建一个 `Reader`，你可以用它来读取文件内容。它最常用的两个构造函数是：\n\n- `FileReader(File\
  \ file)`：创建一个 `FileReader` 流，用于从指定文件中读取。\n- `FileReader(String fileName)`：创建一个 `FileReader`\
  \ 流，用于从指定文件中读取。\n\n**注意：** 如果文件不存在、是一个目录而不是普通文件，或者由于某些原因无法打开读取，这两个构造函数中的任何一个都可能抛出\
  \ `FileNotFoundException`。\n\n## FileWriter\n\n`FileWriter` 类创建一个 `writer`，你可以用它向文件写入内容。它最常用的构造函数有：\n\
  \n- `FileWriter(File file)`：一个用于写入指定文件的 `FileWriter` 对象。\n- `FileWriter(String fileName)`：一个用于写入指定文件的\
  \ `FileWriter` 对象。\n- `FileWriter(File file, boolean append)`：一个以 `append` 模式写入指定文件的\
  \ `FileWriter` 对象。\n- `FileWriter(String filename, boolean append)`：一个以 `append`\
  \ 模式写入指定文件的 `FileWriter` 对象。\n\n如果始终使用前两个构造函数，则会创建一个新文件。如果存在同名文件，它会被销毁。如果使用后两个构造函数且\
  \ `append` 标志为 `false`，则它们的行为与前两个构造函数一致。如果 `append` 标志为 `true`，则文件以 `append` 模式打开，即如果文件已存在，则文件指针置于文件末尾；如果文件不存在，则创建新文件。\n\
  \n**注意：** 如果文件存在但是目录而不是普通文件、不存在但无法创建，或由于其他原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n### 示例 15.5\n\n```java\nimport java.io.*;\nclass FileCopy\n\
  {\n  public static void main(String args[]) throws IOException\n  {\n    FileReader\
  \ fin=null;\n    FileWriter fout=null;\n    fin=new FileReader(args[0]);\n    fout=new\
  \ FileWriter(args[1]);\n    int a;\n    a = fin.read();\n    while(a != -1)\n  \
  \  {\n      fout.write(a);\n      a = fin.read();\n    }\n    fin.close();\n   \
  \ fout.close();\n  }\n}\n```\n\n---\n\n## RandomAccessFile\n\n`RandomAccessFile`\
  \ 封装了一个随机访问文件。它允许我们在文件中的任何位置读取和写入字节、文本和原始数据类型（通过 `InputStream` 和 `DataOutput` 接口，它可以定位文件指针）。`mode`\
  \ 参数指定打开文件的模式，允许的值及其含义如下：\n\n| 值 | 含义 |\n| :--- | :--- |\n| `\"r\"` | 仅读取。调用对象的任何\
  \ `write` 方法都将抛出 `IOException`。 |\n| `\"rw\"` | 可读写。如果文件不存在，将尝试创建它。 |\n| `\"rws\"\
  ` | 可读写，同 `\"rw\"`，但要求文件的元数据同步写入存储设备。 |\n| `\"rwd\"` | 可读写，同 `\"rw\"`，但要求文件的内容（数据）同步写入存储设备。\
  \ |\n\n### RandomAccessFile 方法\n\n除了 `DataInput` 和 `DataOutput` 接口的方法外，该类的一些常用方法如下：\n\
  \n| 签名 | 描述 |\n| :--- | :--- |\n| `public RandomAccessFile(String, String) throws\
  \ FileNotFoundException;` | 创建一个随机访问文件流，用于从指定的文件读取，并可选写入。 |\n| `public RandomAccessFile(File,\
  \ String) throws FileNotFoundException;` | 创建一个随机访问文件流，用于从由 `File` 对象表示的文件读取，并可选写入。\
  \ |\n| `public native int read() throws java.io.IOException;` | |\n| `public int\
  \ read(byte[], int, int) throws java.io.IOException;` | |\n| `public int read(byte[])\
  \ throws java.io.IOException;` | |\n| `public int skipBytes(int) throws java.io.IOException;`\
  \ | |\n| `public native void write(int) throws java.io.IOException;` | |\n| `public\
  \ void write(byte[]) throws java.io.IOException;` | |\n| `public void write(byte[],\
  \ int, int) throws java.io.IOException;` | |\n| `public native long getFilePointer()\
  \ throws java.io.IOException;` | 返回下一次读取或写入相对于文件开始的偏移字节。 |\n| `public native void\
  \ seek(long) throws java.io.IOException;` | 在此处，`newPos` 指定文件指针相对于文件开始的新位置。调用 `seek()`\
  \ 之后，下一次读取或写入将在新的文件位置发生。 |\n| `public native long length() throws java.io.IOException;`\
  \ | |\n| `public native void setLength(long) throws java.io.IOException;` | 设置此文件的长度。此方法可以用于延长或缩小文件。如果文件被延长，增加的部分是未定义的。\
  \ |\n| `public void close() throws java.io.IOException;` | |\n| `public final boolean\
  \ readBoolean() throws java.io.IOException;` | |\n\n\n\n\n\n```java\npublic final\
  \ byte readByte() throws java.io.IOException;\npublic final int readUnsignedByte()\
  \ throws java.io.IOException;\npublic final short readShort() throws java.io.IOException;\n\
  public final int readUnsignedShort() throws java.io.IOException;\npublic final char\
  \ readChar() throws java.io.IOException;\npublic final int readInt() throws java.io.IOException;\n\
  public final long readLong() throws java.io.IOException;\npublic final float readFloat()\
  \ throws java.io.IOException;\npublic final double readDouble() throws java.io.IOException;\n\
  public final java.lang.String readLine() throws java.io.IOException;\npublic final\
  \ java.lang.String readUTF() throws java.io.IOException;\npublic final void writeBoolean(boolean)\
  \ throws java.io.IOException;\npublic final void writeByte(int) throws java.io.IOException;\n\
  public final void writeShort(int) throws java.io.IOException;\npublic final void\
  \ writeChar(int) throws java.io.IOException;\npublic final void writeInt(int) throws\
  \ java.io.IOException;\npublic final void writeLong(long) throws java.io.IOException;\n\
  public final void writeFloat(float) throws java.io.IOException;\npublic final void\
  \ writeDouble(double) throws java.io.IOException;\npublic final void writeBytes(java.lang.String)\
  \ throws java.io.IOException;\npublic final void writeChars(java.lang.String) throws\
