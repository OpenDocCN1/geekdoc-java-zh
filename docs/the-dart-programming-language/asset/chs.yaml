- "# Dart 语言入门指南\n\n\n\n![](img/00312.jpeg)\n\n## 关于本电子书\n\nEPUB 是一种开放的行业标准电子书格式。然而，不同阅读设备和应用程序对\
  \ EPUB 及其许多功能的支持程度不同。请使用您的设备或应用设置来根据您的喜好自定义显示效果。您可以自定义的设置通常包括字体、字号、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的图片。有关您的阅读设备或应用程序的设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书目包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小设置。除了以重流文本格式呈现代码和配置外，我们还包含了代码图像，以模仿质书中的呈现方式；因此，当重流格式可能会影响代码列表的显示时，您将看到“点击此处查看代码图像”的链接。点击该链接查看高保真代码图像。要返回上一页，请点击设备或应用上的“返回”按钮。\n\
  \n\n\n![Image](img/00001.jpeg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给我的母亲 Shoshana，\n\
  \n她教我要学会挑剔。\n\n\n- 前言\n- 前序\n- 致谢\n- 关于作者\n\n\n\n\n\n\n\n\n\n# 前言\n\n在 2006 年初春，我写了一篇名为《Gilad\
  \ 是对的》的短博文。在文中，作为一个类型成瘾症的康复者，我承认 Gilad 关于可选和分层类型系统的想法——即静态类型不会改变程序的运行时行为，也不会阻止原本合法的程序通过编译或执行——对于面向数百万开发者的编程语言来说是一种必要的设计权衡。当时我正在开发\
  \ Visual Basic，它已经通过 `Option Strict Off` 语句支持某种形式的可选类型，但该功能遭到了静态类型支持者的强烈抨击。类型系统通常是非线性的，在达到某个程度后，其复杂性会爆炸，但给开发者带来的价值却很小，且让实现者非常痛苦。可选和分层类型系统通过允许强静态类型与动态类型和平共存，实现了一种更加渐进的方法。近年后，Gilad\
  \ 开创的愿景已以“渐进式类型”的名字成为主流。过去几年中创建的许多语言，如 Hack、TypeScript、Flow、Racket，当然还有 Dart，都是渐进类型的。学者们也接受了这一观点，并撰写了关于它的论文，标题十分随意，包含了“三人行”和“责备”等词汇。\n\
  \nDart 的另一个务实方面（但语言纯洁主义者尚未接受）是 Dart 的类型系统故意是不健全的（unsound）的。在普通英语中，这意味着 Dart 类型检查器不会在编译时标记某些类型错误，而是依靠运行时检查来确保类型安全。Dart\
  \ 不健全的主要来源是协变泛型（covariant generics）。为了解释什么是变性（variance），让我们先看一台只能取出饮料的自动售卖机。如果食堂需要一台汽水自动售卖机，我们可以合法地安装一台供应根水的自动售卖机，因为根根水是汽水的一种（但在需要根水自动售卖机的地方安装汽水自动售卖机是非法的）。在编程语言术语中，我们说自动售卖机是协变的。接下来让我们看一个只能丢垃圾的垃圾桶。如果食堂需要一个可回收垃圾桶，我们可以合法地安装一个普通垃圾桶，因为可回收垃圾是垃圾的一种（但在需要普通垃圾桶的地方安装可回收垃圾桶是非法的）。在编程语言术语中，我们说垃圾桶是逆变的（contravari）。如果你对逆变感到有些困惑，你不是唯一的一个，并且你会欣赏\
  \ Dart 让所有泛型类型均为协变的决定。这种选择在理论上是不健全的，但不安全的变性对大多数开发者来说实际上相当自然，我赞赏 Dart 设计者所做的这一选择。正如任何与\
  \ `? super` 和 `? extends` 挣扎过的人所证实的那样，那些选择泛型静态类型安全的语言，是以牺牲用户为代价的。\n\n\n\n\n\nDart\
  \ 语言的设计者做出额外的务实选择，使得在 Dart 中编写代码成为一种流畅的体验。例如， Dart 没有接口、抽象基类或“普通”类。相反， Dart 只有类，可以通过实现它们来当作接口，通过扩展它们来当作基类，或者通过混入（mixing）来复用它们的实现。Dart\
  \ 中的每个类型都是对象，因此原始类型（例如数值类型）和普通对象类型之间没有区别。尽管 Dart 中的所有内容都是对象，但仍然可以定义顶层函数和变量，因此人们不再需要在顶层类内部写下那段令人生畏的\
  \ `public static void main` 咒语来启动程序。Dart 允许用户自定义算术操作符，但不支持基于类型的方法重载。这极地简化了该语言。在其他支持基于类型方法重载的编程语言中，该特性的精确语义往往占据语言规范中不合理的大比例。空感知操作符（即使\
  \ `null` 也是一个普通对象）和级联操作（cascades）赋予了点符号 `.` 更多功能，让 API 编写者只需付出少量精力，就能让每个 API 对用户来说变得流畅。\n\
  \n虽然 Dart 本质上是一种动态语言，因为所有类型都是可选的，但你遇到的比大多数其他动态语言的“什么鬼 (wat)”时刻要少得多。它有 `null` 但没有\
  \ `undefined`，因此只有 `==` 而没有 `===`。只有 `true` 才是真，所以不再需要通过 `(foo && foo.bar())` 来检查\
  \ `null`。Dart 拥有标准的整数和浮点数数值类型，没有了在 `+` 和 `==` 周围那些令人大惊其舌的运行时类型转换——那些转换虽然是极佳的考题和有趣的会议演示，但也是令人沮丧的\
  \ Bug。\n\n在我看来（尽管我显然带有偏见），Dart 之所以位居我最喜欢的编程语言之首的原因是，它是我知道唯一支持编程四种基本效应的语言：\n\n![Image](img/00002.jpeg)\n\
  \n也就是说，Dart 深度支持使用生成器和 `sync` 块内的循环来产生和消费同步数据流（`Iterable<T>`），使用 `async` 块内的 `await`\
  \ 表达式产生和消费未来（`Future<T>`），最后但同样重要的是，支持使用 `async` 块内的异步生成器和循环产生和消费异步数据流（`Stream<T>`）。内置对异步编程的支持对于任何现代编程语言都是至关重要的，因为在这些语言中，即使是内存中的数据，更不用跨网络的数据也是“遥远的”，高延迟使得同步访问极其昂贵。与\
  \ JavaScript 但与其他支持生成器的语言不同，Dart 拥有所谓的委托生成器（delegating generators），避免了嵌套和递归生成流的平方级爆炸。\n\
  \n尽管有这些精彩的设计，Dart 在设计上本质上是一种相当无味的语言。得益于对 getter、setter、lambda、枚举、具化泛型（reified generics）、模块、广泛且制作良好的标准库以及快速的包管理器的支持，如果你是一个来自\
  \ Java 或 C# 的开发者，Dart 会让你感到很舒服，像合脚的旧鞋；如果你来自 JavaScript，它会让你感到一阵清风。本书将帮助你以 Gilad\
  \ 标志性的细致入微和无与伦比的风格，理解 Dart 所有特性的为什么、如何以及是什么，并让你迅速在 Dart 中投入生产。\n\nErik Meijer\n\n\
  *加利福尼亚州，帕洛奥图*\n\n*2015 年 10 月*\n\n# 前言\n\n这本书与其他关于 Dart 的书籍何何？其他关于 Dart 的书籍充满了实操性；而本书侧重于原理和思想。\n\
  \nDart 的实操性非常重要，但它们今年与去年不同，明年可能还会再次不同。相比之下，Dart 背后的原理随着时间的推移应该更具适用性。如果你对驱动语言设计的理念，以及这些理念如何在\
  \ Dart 这种务实且严苛的现实环境中体现感兴趣，那么你应该读这本书。\n\nDart 的核心思想之一是可选类型（optional typing）。我几十年前就开始研究可选类型了；今天我们看到了可选类型系统的泛滥，我认为这令人非常满意。虽然\
  \ Dart 或它的任何竞争对手都没有完全按照我设想的方式来实现可选类型，但由于这一想法已进入主流，事实才是重要的。\n\n更重要的理念是，Dart 是一门面向对象的语言，但不是指类、继承以及大多数程序员所知的其他标准配置的传统意义，而是从深层意义上说，只有对象的观测行为才是重要的。同样，这一理念的实现并不完美，但比大多数主流语言都要好。\n\
  \n本书涵盖的另一个关键理念是反射（reflection）。关于反射的主题在编程书中并没有得到很好的解决。正因如此，我非常渴望在书中讨论反射。然而，Dart 反射的历史出乎意料地坎折。\n\
  \n一方面，许多 Dart 用户急切希望使用反射，有时甚至将其用于它并不理想的用途。另一方面，某些当前的平台作为 Dart 的编译目标受到严的限制，这使得反射的支持变得相对昂贵，特别是在程序大小方面。这种紧张关系让\
  \ Dart 反射陷入了尴尬的境地。\n\n从一开始开始，人们就对代码大小的敏感性以及反射对其的影响有了充分的认识。关于问题及其解决方案，在 2011 年 11\
  \ 月关于 Dart 反射的第一份设计文档中就讨论过了。尽管如此，过了大约四，，解决方案才以程序员可以轻松应用的形式得以实现。\n\n我希望本书能有效地传达这些及其他思想，但那由你，即读者来判断。也许使用更纯粹的语言可以做得更好，但另一方面也不清楚是否能触及更广泛的读者。也许某天我会尝试一下那个实验并看看。\n\
  \n这本书准备了很长时间。我推迟了完成这本书，直到我能就反射讲述一个逻辑连贯的故事。推迟的另一个原因是，书的主题演变太快，以至于一直面临过时的风险。这种风险并没有消失，但在某些时刻人们需要说“够了”。\n\
  \nDart 是驱动其设计的理念的不完美实现。没有人比它的设计者更清楚这一点。尽管如此，它是一门真正的语言，其中编写了数百万行任务关键代码。它在某些方面推动了编程文化，特别是在可选类型领域。正如丹麦人所说：本可以更糟的。\n\
  \n# 致谢\n\nDart 编程语言是大型团队努力的结果。我在 Dart 上的工作因为涉及许多许多共事的同事而变得愉快，其中许多人不仅是同事，更是朋友。我有荣幸在本书以及《Dart\
  \ 语言规范》中记录了这部分工作。\n\nDart 语言由 Lars Bak 和 Kasper Lund 构思并设计，因此这本书从字面上来说不存在。Lars 是我的老朋友兼同事，他从起初一直领导\
  \ Dart 项目。除此之外，Lars 让我接触了 Dart，对此我深表感谢。\n\n特别感谢 Erik Meijer；与他讨论 Dart 的异步功能是一种享受。Erik\
  \ 是一个真正的编程语言专业人士，这种人才凤毛难求。\n\n\n\n如果说第 8 章 很大程度上归功于 Erik，那么第七章 则归功于 Ryan Macnak，他在\
  \ Dart VM 中实现了镜像（mirrors）；归功于 Peter Ahé，他在 dart2js 中开创了镜像的先河；以及归功于致力于 `reflectable`\
  \ 库的 Erik Ernst。\n\n我手手中这本书的工作不仅得到了 Lars 的支持，还得到了经理 Ivan Posva 的支持。在过去的四年里，我与 Ivan\
  \ 以及位于 Mountain View 的 VM 团队的其他成员共享办公室：Zachary Anderson, Daniel Andersson, Siva\
  \ Annamalai, Régis Crelier, Matthias Hausner, Ryan Macnak, John McCutchan, Srdjan\
  \ Mitrovic 和 Todd Turnidge。我感谢他们愉快的陪伴。\n\n我经常访问位于丹麦奥尔赫斯的 Dart 总部，这总是很有趣的（尽管旅途本身可能并不愉快）。Linda\
  \ Lykke Rasmussen 提供的行政支持是无价的。\n\n我对 Dart 规范的工作是本书的直接基础。这项工作受益于许多人的仔细评审，但没有人比 Lasse\
  \ Nielsen 多，他对细节惊人的关注捕捉到了许多微妙的问题。\n\n我还深度参与了 Dart 的标准化过程。Anders Sand-holm 保护我免受其中许多负担；我对此感激不尽。我也感谢\
  \ Dart 标准委员会 ECMA TC52 的其他参与者。\n\n如果没有许多过去和现在的 Dart 团队成员的努力，Dart 将是不可能实现的。他们多到无法列举，但他们都为\
  \ Dart 成为今天的样子做出了贡献。\n\n我的长期编辑 Greg Doench 一直极具耐心，与他一起工作非常愉快。\n\n一如既往，我的妻子 Weihong\
  \ 和儿子 Teva 让这一切变得非常有意义。\n\nGilad Bracha\n\n*加利福尼亚州，洛斯阿尔斯*\n\n*2015 年 11 月*\n\n##\
  \ 关于作者\n\n![Image](img/00003.jpeg)\n\n`Gilad Bracha` 是 Google 的一名软件工程师，负责 Dart 工作。在之前的职业中，他曾担任\
  \ SAP Labs 的副总裁、Cadence 的卓越工程师，以及 Sun 公司的计算神学家和卓越工程师。他是 Newspeak 编程语言的创建者，《Java\
  \ 语言和虚拟机规范》的共同作者，也是面向对象编程语言领域的研究人员。在加入 Sun 之前，他曾致力于 Animorphic Smalltalk 系统的工作。他在以色列的本·盖里恩大学获得数学和计算机科学学士学位，并在犹他大学获得计算机科学博士学位。\n\
  \n# 第 1 章 引言\n\nDart 是一种通用编程语言。它是 C 语言传统的一种新语言，旨在让大多数程序员感到熟悉。那个必不可少的“Hello World”示例说明了\
  \ Dart 语法是多么熟悉：\n\n```dart\nmain(){\n  print('Hello World');\n}\n```\n\n除非你的编程和计算机科学背景非常不寻常或者完全缺失，否则这段代码几乎是自言易懂的。我们当然会在接下来的章节中详细介绍这个程序以及更多有趣的程序。\n\
  \nDart 是纯面向对象的、基于类的、可选类型类型，并支持基于混入（mixin）的继承和 actor 风格的并发。如果你对这些术语不熟悉，不要担心，我们将在过程中逐步解释它们。\n\
  \n尽管如此，本书并非为初学者编写的教程。预计读者在计算机编程方面具备基本能力。\n\n虽然本书的大部分内容将描述并说明 Dart 的语义，但它还讨论了某些特性的原理。之所以包含这些讨论，是因为根据我的经验，优秀的程序员不仅对编程语言做什么感兴趣，而且对为什么这样做感兴趣。因此，接下来的几节将对\
  \ Dart 背后的哲学进行非常高层次的概述。后续还将包含对设计决策、替代方案以及关键思想历史的讨论。然而，如果你急于直接开始，第 1.4 节 提供了一个快速教程。\n\
  \n现在，让我们开始吧！\n\n### 1.1 动机\n\n万维网的兴起了软件开发的格局。网页浏览器越来越多地被视为各种软件应用的平台。近年来，智能手机和平电脑等移动设备也变得无处不在。这两个趋势对软件的编写方式产生了巨大影响。\n\
  \n网页浏览器最初是显示静态文本文档的工具。随着时间的推移，它们演变为支持动态内容。动态内容随时间进行计算和重新计算，从简单的动画到基于服务器的应用程序（如数据库前端和电子商务商店），一直到可以离线运行的全功能应用程序。\n\
  \n这种演变是有机的；一系列意外（有些幸运，有些则不然）使得此类应用程序能够在一个并非真正为此目的设计的设施之上运行。\n\n移动应用带来了它们自己的挑战。这些应用程序必须节省电量，这为提高性能提供了新动力。网络访问可能是缓慢、昂贵甚至不存在的。移动平台倾向于施加特定的生命周期，并对大小有特定的限制。\n\
  \nDart 旨在提供一个专门设计的平台，以支持人们今天想要编写的应用程序。因此，它努力保护程序员免受底层平台不良的特性和低级细节的影响，同时让他们轻松访问新平台提供的强大功能。\n\
  \n### 1.2 设计原则\n\n#### 1.2.1 万物皆对象\n\nDart 是一门纯面向对象的语言。这意味着 Dart 程序在运行时处理的所有值都是对象——即使是数字和布尔值等基础数据也是。没有例外。\n\
  \n坚持对所有数据进行统一处理简化了所有相关人员的工作，包括语言设计者、实现者以及最重要的用户。\n\n例如，集合类可以用于各种数据，人们不需要担心自动装箱（autoboxing）和拆箱（unboxing）的问题。这些低级细节与程序员试图在应用程序中解决的问题无关；语言的一个关键作用是减轻开发者的这种负担。可能惊讶的是，采用统一的对象模型也减轻了系统实现者的任务。\n\
  \n#### 1.2.2 面向接口编程，而不是面向实现\n\n对象重要的是其行为而非其实现，这一思想是面向对象编程的核心准则。不幸的是，这一原则经常被忽视或误解。\n\
  \nDart 努力在几个方面维护这一原则，尽管做得并不完美。\n\n- Dart 类型基于接口而不是基于类。根据规定，任何类都可以作为供其他类实现的接口，无论它们是否共享实现（数字、布尔值和字符串等核心类型有少数例外）。\n\
  - Dart 中没有最终（final）方法。Dart 允许覆盖几乎所有方法（再次，极少数内置运算符除外）。\n- Dart 通过确保对状态的所有访问都通过访问器方法进行，从而抽象了对象的表示。\n\
  - Dart 的构造函数允许缓存或产生子类的实例，因此使用构造函数不会将其绑定到特定的实现上。\n\n当我们讨论这些构造结构时，我们将扩展它们的影响。\n\n\
  #### 1.2.3 类型为程序员服务\n\n在编程语言领域，可能没有哪个话题比静态类型检查引发更激烈的辩论和更多无意义的争议了。在编程语言中使用类型是一项重要的设计决策，像大多数设计决策一样，涉及到权衡。\n\
  \n\n\n\n从积极的一方面来看，静态类型信息为人类和计算机提供了价值文档。这些信息如果使用得当，可以提高代码的可读性（特别是在库的边界处），并让自动化工具更容易支持开发者。\n\
  \n类型简化了各种分析任务，特别可以帮助编译器提高程序性能。\n\n静态类型的支持者还认为，它有助于检测编程错误。\n\n天下没有免费午餐，在编程语言中添加强制性的静态类型检查也不例外。总会有某些被特定类型规范所禁止的有趣程序。此外，程序员的工作流往往会因为所有中间开发状态必须符合严格的类型系统而受到严重限制。讽刺的是，类型规范越有表现力，使用和理解就越困难。通常情况下，满足类型检查器对程序员来说是一种负担。高级类型系统通常难以学习和使用。\n\
  \nDart 在类型的优缺点之间提供了一个高效的平衡。Dart 是一种可选类型语言，其定义为：\n\n• 类型在语法上是可选的。\n• 类型对运行时语义没有影响。\n\
  \n将类型设为可选，迎合了那些不想处理类型系统的程序员。选择这样的程序员可以将 Dart 视作一种普通的动态类型语言。然而，所有程序员都能从代码中任何类型注解提供的额外文档中获益。这些注解也允许工具能够更好地支持程序员。\n\
  \nDart 对可能的类型不一致和疏忽给出警告而非错误。这些警告的程度和性质经过校准，既有用又不会让程序员感到无所适从。\n\n同时，Dart 编译器永远不会因为缺失或不一致的类型信息而拒绝程序。因此，使用类型永远不会限制开发者的工作流。引用不存在或不完整的声明的代码仍然为了测试和实验目的高效运行。\n\
  \n静态正确性与灵活性之间的平衡使得类型能够为程序员服务而不会产生阻碍。\n\nDart 中类型的细节将推迟到第 5 章，在该章中我们将解释语言的类型规则，并详细探讨上述提到的权衡。\n\
  \n### 1.3 约束\n\nDart 是针对具体问题的实用解决方案。因此，Dart 的设计包含了折中。Dart 必须在现有的网络浏览器上高效运行。\n\n\
  Dart 必须让正在在职的程序员能够立即识别。这决定了它采用了类 C 语言家族风格的语法。它还决定了与主流程序员预期没有太大偏差的语义选择。目标不是激进创新，而是渐进的、保守的进步。\n\
  \n当我们讨论语义受上述约束影响的特征时，我们将关注所做的设计权衡。示例包括对字符串、数字、返回语句等许多内容的处理。\n\n### 1.4 概述\n\n本节将介绍\
  \ Dart 的快速之旅。目标是让你熟悉 Dart 的所有核心元素，而不会陷入细节中。\n\n编程语言的结构通常以互递归的方式定义。要对它们提供有序的、顺序的解释是困难的，因为读者需要一次性知道所有部分！为了避免这个陷阱，必须先对语言结构有一个大致的了解，然后深入重新回顾。本节提供了这种粗略的了解。\n\
  \n在读完本节后，你应该能够掌握书中后续章节中出现的许多示例的精髓，而无需事先读完整本书。\n\n这里是 Dart 中的一个简单表达式：\n\n```\n3\n\
  ```\n\n它意所料地求值为为整数 `3`。这里是一些稍微复杂的表达式：\n\n点击此处查看代码图像\n\n```\n3 + 4\n(3+4)*6\n1 +\
  \ 2 * 2\n1234567890987654321 * 1234567890987654321\n```\n\n它们分别求值为 7、42、5 和 1524157877457704723228166437789971041。你从一年级级学到的普通优先级规则适用于这里。最后一个示例可能具有某些意义。Dart\
  \ 中的整数行为类似于数学整数。它们不限于某些 32 位或 64 位能表示的最大值（例如）。它们大小的唯一限制是可用内存。^(1)\n\n**1。** 某些 Dart\
  \ 实现可能并不总是符合这一要求。当 Dart 转换为 JavaScript 时，有时会使用 JavaScript 数字来表示整数，因为 JavaScript\
  \ 本身不支持整数数据类型。因此，大于 `2⁵³` 的整数可能无法直接获取。\n\nDart 不仅支持整数，还支持浮点数、字符串、布尔值等。这些内置类型许多具有方便的语法：\n\
  \n点击此处查看代码图像\n\n```\n3.14159 //  一个浮点数\n'a string'\n\"another string - 支持双引号和单引号形式\"\
  \n'Hello World' // 你已经见过这个了\ntrue\nfalse // 你可能需要的所有布尔值\n[] // 一个空列表\n[0, 1.0, false,\
  \ 'a', [2, 2.0, true, \\b]]\n```\n\n如上述示例所示，Dart 支持单行注释；`//` 之后的所有内容都会被忽略，直到行尾。上面的示例显示了字面量列表。第一个列表是空的；第二个列表长度为\
  \ 5。可以使用运算符 `[]` 对列表进行索引：\n\n```\n[1, 2, 3].length // 3\n[].length // 0\n[].isEmpty\
  \ // true\n['a'].isEmpty // false\n```\n\n列表具有属性 `length` 和 `isEmpty`（以及许多我们现在不讨论的属性）。人们当然可以在\
  \ Dart 中定义函数。我们之前看到了看到了第一个 Dart 函数，即“Hello World”中的 `main()` 函数。它在这里：\n\n```\nmain(){\n\
  \  print('Hello World');\n}\n```\n\nDart 程序的执行始终从调用名为 `main()` 的函数开始。一个函数由一个给出名称和任何参数（我们的示例中没有）的头部和一个体组成。`main()`\
  \ 的体由单个语句组成，即对另一个函数 `print()` 的调用，该函数接受一个参数。在这种情况下参数是字符串字面量 `'Hello World'`。效果是打印“Hello\
  \ World”。\n\n这是另一个函数：\n\n```\ntwice(x) => x * 2;\n```\n\n在这里我们定义了带有参数 `x` 的 `twice`。该函数返回\
  \ `x` 乘以 2。我们可以通过以下方式调用 `twice`：\n\n```\ntwice(2)\n```\n\n预期求值为 4。函数 `twice` 由一个给出其名称和形式参数\
  \ `x` 的签名组成，后面跟着 `=>`，然后是函数体，这是一个单一表达式。另一种更传统的编写 `twice` 的方式是：\n\n```\ntwice(x)\
  \ {\n  return x * 2;\n}\n```\n\n这两个示例完全等价，但在第二个示例中，体可以由零或多个语句组成——在本例中，单个 `return`\
  \ 语句导致函数计算 `x*2` 的值并将其返回给调用者。\n\n作为另一个示例，考虑\n\n点击此处查看代码图像\n\n```\nmax(x, y){\n \
  \ if (x > y) return x;\n  else return y;\n}\n```\n\n它返回两个参数中较大的。我们可以更简洁地写它：\n\n\
  ```\nmax(x, y) = (x > y) ? x : y;\n```\n\n\n\n第一种形式使用了 `if` 语句，这在几乎所有编程语言中都有类似的形式的形式。第二种形式使用了条件表达式，在\
  \ C 家族语言中非常常见。使用表达式允许我们使用函数声明的短形式。\n\n一个更具挑战性的函数是：\n\n点击此处查看代码图像\n\n```dart\nmaxElement(a)\
  \ {\n  var currentMax = a.isEmpty ?\n    throw 'Maximal element undefined for empty\
  \ array' : a[0];\n  for (var i = 0; i < a.length; i++) {\n    currentMax = max(a[i],\
  \ currentMax);\n  }\n  return currentMax;\n}\n```\n\n`maxElement` 函数接收一个列表 `a` 并返回它的最大元素。在这里确实我们需要长形式函数声明，因为计算将涉及多个步骤，这些步骤必须作为一系列语句按顺序执行。这个短函数将展示\
  \ Dart 的许多特性。\n\n函数体的第一行声明了一个名为 `currentMax` 的变量并对其进行初始化。Dart 程序中的每个变量都必须显式声明。变量\
  \ `currentMax` 代表我们对数组最大元素的当前估计值。\n\n在许多语言中，人们可能会选择将 `currentMax` 初始化为代表最小可能整数的已知值，通常用\
  \ `MIN INT` 等名称命名。从数学上讲，“最小可能整数”的概念是荒谬的。然而，在整数受限于语言定义的固定大小表示的语言中，这是有意义的。如上述，Dart\
  \ 整数的大小是不限的，因此我们实际上 `currentMax` 初始化为列表的第一个元素。如果列表为空，我们就无法这样做，但此时参数 `a` 是无效的；空列表的最大元素是未定义的。因此，我们测试\
  \ `a` 是否为空。如果为空，我们抛出一个异常；否则，我们选择列表的第一个元素作为初始候选值。\n\n异常是通过使用 `throw` 表达式抛出的。`throw`\
  \ 关键字后面跟着另一个定义要抛出值的另一个表达式。在 Dart 中，任何类型的值都可以被抛出——它不需要是特殊 `Exception` 类型的成员。在这种情况下，我们抛出一个描述该问题的字符串。\n\
  \n下一行开始了一个 `for` 语句，用于遍历列表。每个元素都会通过调用之前定义的 `max` 函数轮流与 `currentMax` 进行比较。如果当前元素大于\
  \ `currentMax`，我们将 `currentMax` 设置为新发现的最大值。\n\n**2.** 我们从索引 0 开始，但在这种情况下，我们可以稍微提高一点效率，从\
  \ 1 开始。\n\n循环完成后，我们确信 `currentMax` 是列表中的最大元素，并返回它。\n\n直到现在，本教程仔细地避免了提到任何对象、类或方法等术语。Dart\
  \ 允许你在任何类之外定义函数（如 `twice`、`max` 和 `maxElement`）和变量。然而， Dart 是一门完全的面向对象的语言。我们看过的所有值——数字、字符串、布尔值、列表甚至函数本身——在\
  \ Dart 中都是对象。每个此类对象都是某些类的实例。像 `length`、`isEmpty` 甚至索引运算符 `[]` 等操作都是对象上的方法。\n\n是时候我们自己学习如何写一个类了。请看\
  \ `Point` 类，它代表笛卡尔平面上的点：\n\n```dart\nclass Point {\n  var x, y;\n  Point(a, b){x\
  \ = a; y = b;}\n}\n```\n\n上述是 `Point` 的一个极简版本，我们很快就会对其进行丰富。`Point` 有两个实例变量（或字段）`x`\
  \ 和 `y`。我们可以通过 `new` 表达式调用其构造函数来创建 `Point` 的实例：\n\n点击此处查看代码图像\n\n```dart\nvar origin\
  \ = new Point(0, 0);\nvar aPoint = new Point(3, 4);\nvar anotherPoint = new Point(3,\
  \ 4);\n```\n\n上述三行中的每一行都分配了一个新的 `Point` 实例，与其他任何实例都不同。特别是，`aPoint` 和 `anotherPoint`\
  \ 是不同的对象。对象具有标识性，这就是区分它与任何其他对象的特征。\n\n每个 `Point` 实例都有其变量 `x` 和 `y` 的拷贝，可以使用点表示法进行访问：\n\
  \n```dart\norigin.x // 0\norigin.y // 0\naPoint.x // 3\naPoint.y // 4\n```\n\n变量\
  \ `x` 和 `y` 是由构造函数根据 `new` 提供的实际参数设置的。定义一个具有与对象字段完全对应的形式参数的构造函数，然后在构造函数中设置这些字段的模式非常常见，因此\
  \ Dart 为这种情况提供了一个特殊的语法糖：\n\n```dart\nclass Point {\n  var x, y;\n  Point(this.x,\
  \ this.y);\n}\n```\n\n新版本的 `Point` 与原始版本完全等价，但更简洁。让我们为 `Point` 添加一些行为：\n\n点击此处查看代码代码图像\n\
  \n```dart\nclass Point {\n  var x, y;\n  Point(this.x, this.y);\n}\n```\n\n新版本的\
  \ `Point` 与原始版本完全等价，但更简洁。让我们为 `Point` 添加一些行为：\n\n（注：输入文本末尾存在重复的段落，已根据提供的逻辑流进行了处理。）\n\
  \n\n\n需要注意的一个关键细节是 `import` 子句引用了字符串 `'dart:math'`。通常情况下，导入是指通过字符串提供的统一资源标识符（URIs）。这些\
  \ URI 指向编译器可以找到所需库的位置。Dart 的内置库始终可以通过 `'dart:˙'` 形式的 URI 访问，其中 `˙` 表示特定的库。\n\nDart\
  \ 的内容比我们目前展示的要多得多，但你应该对 Dart 代码的样貌及其大致含义有一个通用的了解。当我们进入本书后面的详细章节时，这些背景知识将大有裨益。\n\n\
  ### 1.5 书的结构\n\n本书的其余部分围绕 Dart 编程语言的构造结构构建。下一章将讨论对象、类和接口。这些是 Dart 的核心概念，也是后续所有内容的基础。\n\
  \n接下来，我们将详细检查库，然后深入探讨函数。在第 5 章中，我们最后将查看类型以及它们在 Dart 中扮演的角色。我们在第 6 章中回顾了 Dart 的表达式和语句。最后的章节将研究反射和并发。\n\
  \n### 1.6 相关工作与影响\n\nDart 的设计受到了早期语言的影响，特别是 Smalltalk[1]、Java 和 Javascript。Dart\
  \ 的语法通过 Java 和 Javascript 遵循 C 语言传统。Dart 的语义在某些方面更接近 Smalltalk 特 特别是对纯对象模型的坚持。\n\
  \n然而，它们之间存在至关重要的区别。Dart 引入了自己基于库的封装模型。这与上述三种语言都不同。Smalltalk 支持基于对象的字段封装，且方法和类是通用的。Java\
  \ 结合了基于类的封装和包私有性，而 Javascript 则完全依赖闭包来实现封装。\n\n与 Smalltalk 和 Java 一样，Dart 是基于类的并支持单继承，但它通过基于混入（mixin）的继承增强了这一点，这与最初在\
  \ Smalltalk 的方言 Strongtalk 中首次实现的模型[2] 非常相似。由于 Dart 中的类方法不是 Smalltalk 那种真正的实例方法，而是\
  \ Java 风格的静态方法，因此模型并不完全相同。\n\nDart 的构造函数在语法上与 Java 有相似之处，但实际上在关键方面有所不同。上述所有主题都将在下一章中讨论。\n\
  \nDart 的类型检查方法也与 Strongtalk 开发的方法非常接近。类型在第 5 章中得到了详尽的。\n\nDart 对并发的观点接近原始的 actor\
  \ 模型（尽管是命令式的），再次与上述任何语言不同。Erlang 的成功采用 actor 模型的一个因素，但与 Erlang 不同，Dart 具有非阻塞并发模型。Dart\
  \ 还具有受 C# 深度影响的内置异步支持。详情请见第 8 章。\n\n# 第 2 章 对象、接口、类和混入\n\n值得重复的是：Dart 中的一切皆为对象。这甚至包括最简单的数据，如数字或布尔值\
  \ `true` 和 `false`。\n\n一个对象由一组（可能是空的）字段（提供状态）和一组方法（提供行为）组成。对象的状态可以是可变的或不可变的。对象的方法集永远为空，因为所有\
  \ Dart 对象都有某些行为。对象从其类中获取行为。每个对象都有一个类；我们说该对象是该类的*实例*。因为每个对象都有一个决定其行为的类，所以 Dart 是一种*基于类的语言*。\n\
  \n考虑上一章中遇到的 `Point` 类。\n\n```dart\nclass Point {\n  var x, y;\n  Point(this.x, this.y);\n\
  \  scale(factor) => new Point(x * factor, y * factor);\n  operator +(p) => new Point(x\
  \ + p.x, y + p.y);\n  static distance(p1, p2) {\n    var dx = p1.x - p2.x;\n   \
  \ var dy = p1.y - p2.y;\n    return sqrt(dx * dx + dy * dy);\n  }\n}\n```\n\n`Point`\
  \ 的实例每个有两个字段 `x` 和 `y`，它们构成了它们的状态。点 还有几个提供有用行为的方法。这些方法包括 `scale` 和 `+`，但实际上还有其他的。这些额外方法并不是由\
  \ `Point` 类本身定义的，而是从其父类*继承*来的。每个类都有一个父类，但内置到每个 Dart 实现中的 `Object` 类除外。类可以显式列出它们的父类，但不是必须。如果类没有列出父类，则父类是\
  \ `Object`。`Point` 就是这种情况。我们可以如下显式地指定 `Object` 为 `Point` 的父类；这两个定义是完全等价的。\n\n```dart\n\
  class Point extends Object { ... 其余定义不变 }\n```\n\n定义对象行为的方法被称为其*实例方法*。\n\n### 2.1\
  \ 访问器\n\n访问器是提供值的特殊方法。为了理解访问器，让我们再次回到 `Point`。如果我们把字段 `x` 和 `y` 替换为方法，我们所有的客户端将修改对\
  \ `x` 和 `y` 的引用，使其成为方法调用。例如，如果客户端有一个这样的片段：\n\n`print(myPoint.x);`\n\n它需要更改为\n\n\
  `print(myPoint.x());`\n\n唯一的区别是 `x` 后面的空参数列表；这是一个很小的变化，但确实是一个变化。Dart 以*访问器方法*（getter\
  \ methods）的形式提供了更好的解决方案，通常称为*访问器*（getters）。访问器是一种不接受参数的特殊方法，可以在没有显式参数列表的情况下调用。访问器方法通过在方法名前前加上\
  \ `get` 单词来引入。不能给出参数列表——即使是空的也不行。\n\n\n\n\n```\n  return sqrt(dx * dx + dy * dy);\n\
  \n}\n\n}\n```\n\n现在，我们的假设客户端不需要任何更改。getter 调用的语法与变量访问无二致。\n\n敏锐的读者现在会问，`Dart` 编译器是如何区分这两者的？答案是，它并不区分。在\
  \ `Dart` 中，所有的实例变量访问实际上都是 getter 调用。得益于 `Dart` 编译器，每个实例变量都关联着一个 getter。\n\n到目前为止，我们只解决了一部分问题。那些给字段赋值的客户端怎么办呢？例如\
  \ `myPoint.y = myPoint.y * 2.`\n\n新版本没有可以被赋值的字段。目前还不清楚客户端可以进行什么更改来保持其代码的运行。为了解决这个问题，我们使用了\
  \ `setter 方法`（简称为 `setters`）。setter 以 `set` 单词为缀，并接收一个参数。setter 的调用语法与传统的变量赋值相同。如果一个实例变量是可变的，则会自动为它定义一个\
  \ setter，并且所有的实例变量赋值实际上都是 setter 调用。\n\n点击此处查看代码图片\n\n```dart\nclass Point {\n\n\
  \  var rho, theta;\n\n  Point(this.rho, this.theta);\n\n  get x => rho * cos(theta);\n\
  \n  set x(newX) {\n    rho = sqrt(newX * newX + y * y);\n    theta = acos(newX/rho);\n\
  \  }\n\n  set y(newY) {\n    rho = sqrt(x * x + newY * newY);\n    theta = asin(newY/rho);\n\
  \  }\n\n  get y => rho * sin(theta);\n\n  scale(factor) => new Point(rho * factor,\
  \ theta);\n\n  operator +(p) => new Point(x + p.x, y + p.y);\n\n  static distance(p1,\
  \ p2) {\n    var dx = p1.x() - p2.x();\n    var dy = p1.y() - p2.y();\n    return\
  \ sqrt(dx * dx + dy * dy);\n  }\n}\n```\n\n此时，我们已经解决了问题的两个部分，但还剩下第三部分。我们的客户端通过调用\
  \ `Point` 类的构造函数来创建点，例如 `new Point(3,4);`\n\n我们的新类期望构造函数的参数代表向量的长度和方向角，而不是它的笛卡尔坐标。正如我们之前提到的，我们在类内部也依赖于这个\
  \ API，因此它将无法正常工作。按照惯例，解决方案是在保留现有 API 的同时，按需更改表示法。因此，我们选择使用极坐标表示法，但为了保持接口，我们保留了现有的接收笛卡尔参数的构造函数。\n\
  \n点击此处查看代码图片\n\n```dart\nclass Point {\n\n  var rho, theta;\n\n  Point(a, b){\n\
  \    rho = sqrt(a * a + b * b);\n    theta = atan(a/b);\n  }\n\n  ... 其部分保持不变 ...\n\
  \n}\n```\n\n我们现在已经实现了改变点的表示法而不对其客户端产生任何影响的目标。我们是在没有任何预计划的情况下做到这一点。我们不需要预先决定通过访问器方法或特殊的属性声明来暴露点的坐标；`Dart`\
  \ 为我们完成了这一切，且没有任何任何语法上的不便。我们可以在任何主流语言中修复构造函数。然而，如果没有访问器，完全平滑的过渡是不可能的。\n\n### 2.2\
  \ 实例变量\n\n当类声明一个实例变量时，它确保其每个实例都将拥有该变量的唯一副本。对象的实例变量占用内存。这些内是在对象创建时分配的。在程序访问这些内存之前，将这些内存设置为某个合理的值是关重要的（注：原文此处为逻辑错误，语境应为初始化，译文译为：在程序访问这些内存之前，将这些内存设置为某个合理的值是关重要的）。在\
  \ `C` 等低级语言中，情况并非如此，新分配的存储空间的内容可能是未定义的——通常是它们之前存储的任何值。这会导致可靠性和安全性方面的问题。\n\n`Dart`\
  \ 将每个新分配的变量（不仅是实例变量，还有局部变量、类变量和顶层变量）初始化为 `null`。在 `Dart` 中，`null` 是一个对象，就像其他对象一样。不能将\
  \ `null` 与其他对象（如 `0` 或 `false`）混淆。`null` 对象仅仅是 `Dart` 核心库中定义的 `Null` 类的唯一实例。这与 `C`、`C++`、`C#`、`Java`\
  \ 或 `Javascript` 等语言的情况不同，但它是“万物皆对象”这一公理不可避免的结果。\n\n声明实例或静态变量会自动引入一个 getter。如果变量是可变的，还会自动定义一个\
  \ setter。事实上，在 `Dart` 中，从不直接访问字段。对字段的所有引用都是访问器方法的调用。只有对象的访问器可以直接访问其状态。所有访问对象状态的代码必须通过这些访问器方法。这意味着类的表示法可以随时更改，而无需对客户端源代码进行任何更改。甚至不需要重新编译——永远不需要！这种属性被称为\
  \ `表示独立性`（representation independence）。\n\n我们在上一节中看到了表示独立性的优势，在上一节中我们展示了如何更改点的表示法。\n\
  \n### 2.3 类变量\n\n除了实例变量外，类还可以定义 `类变量`。无论类有多少个实例，类都只有一个变量副本。类变量声明以 `static` 单词开头。\n\
  \n与实例变量一样，类变量从不被直接引用。对它们的所有访问都是通过访问器介的。类变量可以在声明它的类的任何地方被引用。在类外部，只能通过类名来访问它：\n\n\
  点击此处查看代码图片\n\n```dart\nclass Box {\n  static var numberOfInstances = 0;\n}\n```\n\
  \n类变量通常被称为 `static` 变量，但 `static variable` 也也涵盖了类变量和顶层变量。为了避免混淆，我们将坚持使用类变量。当我们统称为实例和类变量时，经常使用字段一词。\n\
  \n类变量是延迟初始化的；类变量初始化在第一次调用 getter 时执行——即第一次尝试读取该变量时。如果类变量没有初始化器，它被初始化为 `null`，就像其他变量一样。\n\
  \n类变量的延迟初始化有助于避免一个经典问题：由于过度的初始化导致应用程序启动缓慢。然而，懒加载会导致意料之外的行为。假设类变量在被读取之前就被赋值了，如下例所示。\n\
  \n点击此处查看代码图片\n\n```dart\nclass Cat {}\n\nclass DeadCat extends Cat {}\n\nclass LiveCat\
  \ extends Cat {\n  LiveCat() {print(\"I'm alive!\");}\n}\n\nvar schrodingers = new\
  \ LiveCat();\n\nmain() {\n  schrodingers = new DeadCat();\n}\n```\n\n在这里，`schrodingers`\
  \ 的初始化器永远不会执行，`print()` 调用也永远不会执行。虽然在上面看起来显而易见，但在更复杂的情况下可能并非如此。例如，在调试期间，可能会检查变量的值，这将引发初始化。程序员应该密切关注延迟初始化的影响。\n\
  \n### 2.4 finals\n\n\n\n\nDart 中的变量可以以 `final` 单词开头，表示它们在初始化后不能被更改。`final` 字段有一个\
  \ getter（访问器）但没有 setter（赋值器）。final 类变量必须在声明处初始化。\n\nfinal 实例变量必须在任何实例方法运行之前初始化。有几种方法可以实现这一点。第一种是在声明处初始化变量，例如：\n\
  \n```dart\nfinal origin = new Point(0,0);\n```\n\n这并不总是方便的。变量在不同的构造函数可能会被赋予不同的值。例如，它可能取决于构造函数的参数。如果想将一个\
  \ final 实例变量的值设置为构造函数参数的值，可以使用常用的构造函数简写。例如，考虑这个 `Point` 的变体，其中点是不可变的：\n\n```dart\n\
  class Point {\n  final x, y;\n  Point(this.x, this.y);\n  // Point 的其余部分 ...\n}\n\
  ```\n\n然而，有时这并不够。值可能取决于构造函数参数，但又不同——即它可能涉及基于构造函数参数的某些计算。我们将在稍后的 第 2.9 节 中探讨如何实现。\n\
  \n尝试给 final 实例变量赋值通常会导致 `NoSuchMethodError`，因为赋值只是调用 setter 的语法糖，而 setter 并不会被定义。不过，可能单独声明一个\
  \ setter，在这种情况下，它会被调用。但这对实例变量的值不会产生任何影响——在初始化之后，根本没有办法更改 final 变量。\n\n大多数实例变量在实例分配时设置，并且之后再也不改变。你可能发现这很惊讶，但这已经通过系统研究得到了验证[3]。因此，将大多数实例变量声明为\
  \ `final` 是最好的做法。\n\n有一个强有力的理由认为 `final` 应该是默认值，但那违背了既有习惯，因此 Dart 在这里选择了传统的方案。\n\
  \n### 2.5 标识与等价性\n\n所有对象都支持相等性运算符 `==`。该运算符定义在 `Object` 类中，因此所有类都继承了它，它因此包含在所有实例的行为中。考虑\n\
  \n点击此处查看图像\n\n```dart\nvar aPoint = new Point(3, 4);\nvar anotherPoint = new Point(3,4);\n\
  aPoint == anotherPoint; // 结果为 false\n```\n\n最后一行的结果有些令人困惑。毕竟，`aPoint` 和 `anotherPoint`\
  \ 具有相同的 `x` 和 `y` 值，为什么它们不相等呢？\n\n`Object` 中的 `==` 方法测试参数是否与接收者是完全相同的（identical）。正如前面提到的，每个对象都有唯一的标识符。一个对象与自身是完全相同的，且仅与自身相同。两个对象可以是同一类的实例并具有完全相同的状态，但如上面的示例所示，它们仍然可能并不相同。\n\
  \n上面的解释是相当机械的。我们说这两个对象不相等，是因为等价性被定义为标识性，但这引发了一个问题：为什么等价性要这样定义？\n\n遗憾的是，没有一种明显正确的方法来判断两个任意对象是否相等。可以比较对象的所有字段来判断等价性，但这仍然太保守了。对象可能拥有用于存储辅助数据的字段，而这些数据对于等价性的语义并不是必需的。例如，假设我们有一个时间戳，告诉我们某个缓存值最后一次计算是什么时候。缓存在一段时间后就会被认为是过时的。两个对象在时间戳（或缓存值）上不同，但仍然可能是相等的。\n\
  \n因此，定义类的程序员有责任确定对于该类的实例，什么等价性概念是合理的。这样做的方法是重写 `==`。^(2) 在 `Point` 的情况下，我们可以将等价性定义为\n\
  \n2。如果能用 `=` 表示相等就很好了，但 C 传统和数学之间是矛盾的。\n\n点击此处查看图像\n\n```dart\noperator == (p) =>\
  \ x == p.x && y == p.y;\n```\n\n注意，即使我们切换到极坐标（不考虑数值精度问题），这段代码仍然有效（尽管它可能没有那么高效）。事实上，即使\
  \ `p` 是笛卡尔点而接收者是极坐标，或者任何其他组合，它依然成立。\n\n在某些情况下，人们可能想要检查两个表达式是否表示相同的对象，但这种情况相对罕见。通常，人们是对对象进行等价性测试。\n\
  \n可以使用定义在 `dart:core` 中的内置函数 `identical()` 来比较两个对象的标识性。\n\n我们发现 `identical(origin,\
  \ origin)` 的结果为 `true`，`identical(aPoint, aPoint)` 和 `identical(anotherPoint, anotherPoint)`\
  \ 也是如此。另一方面，`identical(aPoint, another-Point)` 的结果为 `false`。\n\n我们现在有足够的信息来自己定义\
  \ `Object` 类的相等方法：\n\n点击此处查看图像\n\n```dart\nbool operator ==(other) => identical(this,\
  \ other);\n```\n\n所有的 Dart 对象还支持 getter 方法 `hashCode`。等价性和 `hashCode` 是关联的。如果两个对象相等，它们的哈希值也相等。在实践中，这意味着如果你选择重写其中一个方法，也应该重写另一个。实现用户定义的等价性需要一些技巧。我们期望等价谓词满足自反性（`a\
  \ == a`）、传递性（`(a == b) && (b == c)` 意味着 `a == c`）和交换性（`a == b` 意味着 `b == a`）。自反性是你可以在自己的\
  \ `==` 实现中确保的。其他属性在扩展系统中很难维护。人们总是引入\n\n```dart\nclass BadApple {\n```\n\n并破坏整个系统的相等。\n\
  \n### 2.6 类与父类\n\n每个类声明了一组实例成员，包括实例变量和几种实例方法。此外，每个类（`Object` 除外）都从其父类继承实例成员。由于除\
  \ `Object` 的每个类只有一个父类，而 `Object` 没有父类，Dart 的类层次形成了一个以 `Object` 为根的树。这种结构被称为单继承，如下所示。\n\
  \n![图像](img/00004.jpeg)\n\n在图中，我们看到了数字、布尔和 Null 的类层次。当然，这只是整个类层次的一个片段。\n\n如果子类声明了一个与其父类方法同名的实例方法，则子类方法被认为覆盖了父类方法。\n\
  \n重写并不总是合。例如，你不能用普通方法重写 getter，反之亦然。这些情况会导致编译错误。\n\n点击此处查看图像\n\n```dart\nclass S\
  \ {\n  var v;\n  final f = 0;\n  get g => 42;\n  set s(x) => v = 2;\n  m(a, b) =>\
  \ 91;\n}\n\nclass C extends S {\n  v() => 1; // 非法：方法 v() 覆盖了隐式 getter v\n  f()\
  \ => 2; // 非法：方法 f() 覆盖了隐式 getter f\n  g() => 100; // 非法：方法 g() 覆盖了 getter g\n}\n\
  ```\n\n尝试用方法或 getter 覆盖 setter，或者用 setter 覆盖方法或 getter 技术上是不可能的，因为 setter 的名称与方法和\
  \ getter 不重叠。然而，如果你尝试，Dart 会警告你：\n\n点击此处查看图像\n\n```dart\nclass D extends S {\n \
  \ s(y) => 200; // 警告：D 有方法 s 和 setter s=\n}\n```\n\n\n\n在某些情况下，无意义的重写（override）会导致警告而不是编译错误。当重写的方法所需的参数比其所覆盖的方法更多时，会发出警告，但程序仍然可以编译。\n\
  \n点击此处查看代码图片\n\n```dart\nclass E extends S {\n  m(x, y, z) => 101; // WARNING: overriding\
  \ method has incompatible arity\n}\n```\n\n为什么 Dart 只对这种情况发出警告，而不是直接拒绝代码呢？因为 Dart\
  \ 试图尽可能避免为程序员规定工作流。在开发过程中可能会出现各种类型的不一致性，这些问题最终应该被纠正。然而，强制程序员在取得任何其他进展之前立即处理这些情况往往是适得其反的。因此，\
  \ Dart 确保开发者通过警告获知此类问题，但除非绝对必要，否则不会中止编译。\n\n### 2.7 抽象方法和类\n\n通常情况下，仅仅声明一个方法而不提供其实现是很有用的。这种方法被称为\
  \ `abstract method`（抽象方法）。任何类型的方法都可以是抽象的，无论它是 getter、setter 还是普通方法。\n\n声明抽象方法告诉阅读代码的人（无论是人还是计算机），当代码执行时可以使用该方法。这不仅有助于程序员理解，也有助于错误处理和工具支持。包含抽象方法的类本身是\
  \ `abstract class`（抽象类）。抽象类通过在声明前加上 `abstract` 关键字来声明。下面我们看到一个完全没有任何实现信息的抽象类 `Pair`，它纯粹作为接口。\n\
  \n```dart\nabstract class Pair {\n  get first;\n  get second;\n}\n```\n\n`Pair`\
  \ 有两个抽象 getter 方法：`first` 和 `second`。`Pair` 被显式声明为抽象类。如果我们省略 `abstract` 修饰符，Dart\
  \ 分析器会警告该类具有抽象方法。在抽象类中拥有抽象方法完全正确，但在具体类中保留此类方法显然是一个问题。`abstract` 修饰符允许我们声明意图，分析器发出的警告也会随之变化。\n\
  \n抽象类不是为了实例化的；毕竟它缺少实现。实例化它会导致运行时错误；具体会抛出 `AbstractClassError`。Dart 分析器也会发出警告。\n\n\
  点击此处查看代码图片\n\n```dart\nnew Pair();\n// 静态警告：尝试实例化抽象类\n// 抛出 AbstractClassInstantiationError\n\
  ```\n\n从运行角度来说，抽象方法根本不存在。毕竟没有可运行的实现。调用此类方法与没有该方法的情况完全相同。只包含抽象方法的类在定义接口时是有用的，见下节。\n\
  \n### 2.8 接口\n\n每个类都隐式地定义了一个 `interface`（接口），描述了实例上哪些方法。Dart 没有像许多其他语言那样的正式接口声明。这些声明是不必要的，因为始终可以通过定义抽象类来描述所需的接口。\n\
  \n点击此处查看代码图片\n\n```dart\nabstract class CartesianPoint {\n  get x;\n  get y;\n}\n\
  \nabstract class PolarPoint {\n  get rho;\n  get theta;\n}\n```\n\n尽管缺少接口声明，类也可以断言其实例实现了特定的接口。\n\
  \n点击此处查看代码图片\n\n```dart\nclass Point implements CartesianPoint, PolarPoint {\n \
  \ // 常用的 Point 实现\n}\n```\n\n`Point` 不是 `CartesianPoint` 的子类；它没有继承 `CartesianPoint`\
  \ 的任何成员（`PolarPoint` 也是如此）。`implements` 子句的目的是建立接口之间的意图关系，而不是共享实现。\n\n可以在运行时测试对象是否符合某个接口：\n\
  \n点击此处查看代码图片\n\n```dart\n5 is int; // true\n'x' is String; // true\n[] is Point;\
  \ // false\naPoint.toString() is String; // true\nnew Point(0,0) is String; // false\n\
  aPoint is CartesianPoint; // true\n```\n\n注意，`is` 测试并不检查对象是否为给定类或其子类的实例。相反，`is`\
  \ 测试检查对象的类是否显式地（直接或间接地）实现了接口。换句话说，我们不关心对象的实现是什么，只关心它旨在支持的接口。这与支持此类结构的许多其他语言相比是一个关键区别。如果一个类想要模拟另一个类的接口，它并不受限于共享实现。这种模拟对客户端来说应该是不可区分的（不考虑反射）。当我们在第\
  \ 5 章](#part0013.html_ch05）中详细检查类型时，对 `is` 有更多说明。\n\n接口之间的继承非常像类。类的隐式接口继承自其父类的隐式接口，以及从该类实现的任何接口。与类一样，接口的实例方法覆盖父类的方法。再次，某些重写可能是非法，因为重写方法与被重写方法之间的参数数量应该是兼容的，或者是因为试图用普通方法覆盖\
  \ getter 或 setter。\n\n此外，由于接口有多个父接口，不同的父接口之间可能会冲突。假设一个方法出现在多个父接口中，并且不同的父接口对同一个方法的参数（arity）意见不一致。在这种情况下，冲突方法的任何版本都不会被继承——如果一个父接口定义了\
  \ getter 而另一个是普通方法也是如此。正如我们在第 5 章](#part0013.html_ch05）所示，这些情况也会产生各种警告。\n\n### 2.9\
  \ 对象的生命\n\nDart 中的计算围绕对象展开。因为 Dart 是一门纯面向对象的语言，即使是最微不足道的 Dart 程序也涉及对象的创建。例如，书的第一段所示的“Hello\
  \ World”程序涉及一个字符串对象的创建。\n\n某些对象，如字符串‘Hello World’、布尔值 `true` 或数字 `91` 是 `literals`（字面量）。它们仅仅因为在运行程序中被提到而存在。然而，大多数对象是使用实例化表达式显式创建的，例如\
  \ `new Point(0,1)`。这样的表达式调用了一个 `constructor`（构造函数）——在这里是 `Point()`。每个类至少有一个构造函数。构造函数的名称始终以我们要构造的类名开头。构造函数可以由程序员显式声明，也可以被隐式生成。在没有声明显式构造函数时会生成隐式构造函数；它们不接受参数也没有正体。例如\n\
  \n```dart\nclass Box {\n  var contents;\n}\n```\n\n等同于\n\n```dart\nclass Box {\n\
  \  var contents;\n  Box();\n}\n```\n\n其本身又等同于\n\n```dart\nclass Box {\n  var contents;\n\
  \  Box(){}\n}\n```\n\n我们在使用 `Point` 的示例中已经见过了一些构造函数的变体。我们假设最简单的那个：\n\n```dart\n\
  Point(a, b){x = a; y = b;};\n```\n\n\n\n评估实例创建表达式的第一步是评估构造函数的参数。在 `new Point(0,1)`\
  \ 中，参数是字面量整数 `0` 和 `1`。与任何函数调用一样，这些参数被设置为相应的参数。因此，我们将 `a` 设置为 `0`，将 `b` 设置为 `1`。现在，我们可以为\
  \ `Point` 类分配一个新实例，该实例将包含两个字段 `x` 和 `y` 的存储空间。最初，这些字段将由系统设置为 `null`。这确保了用户代码永远遇到未初始化的内存。\n\
  \n现在我们可以执行构造函数的体，这涉及分别对 `x` 和 `y` 的两次赋值。如你现在所知，这些赋值实际上是调用了 setter 方法。正是这些隐式定义的 setter\
  \ 方法按照预期将字段 `x` 和 `y` 的值设置为 `0` 和 `1`。在此时点，构造函数返回一个指向新分配实例的引用，这就是 `new` 表达式的最终结果。\n\
  \n现在，让我们考虑一个表示三维点的类。该类拥有坐标 `x`、`y` 和 `z`，并且可以自然地声明为 `Point` 的子类。\n\n点击此处查看代码图像\n\
  \n```dart\nclass Point3D extends Point {\n  var z;\n  Point3D(a, b, c): super(a,b)\
  \ {z = c;}\n}\n```\n\n人们可以通过编写 `new Point3D(1,2,3)` 来创建一个 `Point3D` 实例。评估过程类似，但稍微复杂一些。我们仍然从评估参数和分配对象开始——这次有三个字段——从\
  \ `Point` 继承的两个字段 `x`、y` 以及在 `Point3D` 中声明的字段 `z`。这三个字段将再次被设置为 `null`。然而，在执行 `Point3D`\
  \ 构造函数的体之前，我们必须执行 `Point` 构造函数的体，否则字段 `x` 和 `y` 将无法被正确初始化。\n\n通常情况下，Dart 编译器无法确定向父类构造函数传递哪些参数。在这种情况下这似乎显而易见，但并非总是如此简单。除最简单的情况（即没有参数）外，我们都需要显式的\
  \ `super-constructor call`（父构造函数调用）来引导我们。在我们的示例中，那就是 `super(a,b)`。在父构造函数调用中，`super`\
  \ 是父类名称的占位符，因此 `Point3D(x1, y1, z1)` 在执行自身的体之前会先调用 `Point(x1, y1)`。\n\n上面的描述有些简单，正如我们很快将看到的。对象创建是面向对象编程语言中复杂的方面之一，特别是在涉及继承时。为了进一步深化我们的理解，我们将再次查看更改点表示的问题。这一次，假设点是不可变的，但使用极坐标来表示。\n\
  \n由于点是不可变的，`rho` 和 `theta` 是 `final` 的。我们不能在声明处初始化实例变量，因为我们需要访问构造函数参数。我们不能使用像 `.rho`\
  \ 这样的初始化形式（initializing formals），因为 `rho` 和 `theta` 的值都是 `x` 和 `y` 的函数。我们不能在构造函数体内部赋值字段，因为没有为它们定义\
  \ setter。Dart 通过 `initializer lists`（初始化列表）解决了这个问题，初始化列表旨在用于普通代码运行之前初始化实例变量。\n\n\
  点击此处查看代码图像\n\n```dart\nclass Point {\n  final rho, theta;\n  Point(a, b) : rho =\
  \ sqrt(a * a + b * b), theta = atan(a/b);\n  get x => rho * cos(theta);\n  get y\
  \ => rho * sin(theta);\n  scale(factor) => new Point(rho * factor, theta);\n  operator\
  \ +(p) => new Point(x + p.x, y + p.y);\n  static distance(p1, p2) {\n    var dx\
  \ = p1.x - p2.x;\n    var dy = p1.y - p2.y;\n    return sqrt(dx * dx + dy * dy);\n\
  \  }\n}\n```\n\n此处的初始化列表从 `Point(a, b)` 之后的冒号开始，一直到行末的分号结束：`: rho = sqrt(a * a +\
  \ b * b), theta = atan(a/b)`。它包含两个初始化器，一个用于 `rho`，一个用于 `theta`。初始化器用逗号分隔，并从左到右执行。除了实例变量的初始化器外，初始化列表还可以包含一个父构造函数调用。我们在\
  \ `Point3D()` 中看到了这一点，那里我们有初始化列表 `: super(a,b)`。注意，如果初始化列表中没有显式出现父构造函数调用，则会附加形式为\
  \ `super()` 的隐式父构造函数调用到列表中。\n\n我们已经看到了几种初始化实例变量的方法。让我们再次复习。人们可以在声明处初始化实例变量：\n\n\
  ```dart\nclass Point {\n  var x = 0, y = 0;\n}\n```\n\n或者通过构造函数中的初始化形式（initializing\
  \ formals）：\n\n```dart\nclass Point {\n  var x, y;\n  Point(this.x, this.y);\n}\n\
  ```\n\n或者在初始化列表中：\n\n```dart\nclass Point {\n  var x, y;\n  Point(a, b) : x = a,\
  \ y = b;\n}\n```\n\n或者在构造函数体中：\n\n```dart\nclass Point {\n  var x, y;\n  Point(a,\
  \ b) {x = a; y = b;}\n}\n```\n\n对于普通的实例变量，人们可以选择这些选项中的任何一个、多个，或者任一个都不选。最后一种选项对于\
  \ `final` 实例变量无效，因为 `final` 不。`final` 实例变量必须初始化一次，因此人们必须在前三个选项中选择一个。\n\n现在我们可以完整地描述实例创建的卓越过程了。假设\
  \ `Point3D` 如上所示被定义，并且 `Point` 具有以下构造函数：\n\nPoint(a, b) : x = a, y = b;\n\n实例创建过程如图所示，执行遵循箭头方向：\n\
  \n![Image](img/00005.jpeg)\n\n通过 `new Point3D(7,8,9)` 创建 `Point3D` 的新实例从计算实际参数开始，在这种情况下，参数是\
  \ 7、8 和 9。然后调用构造函数 `Point3D()`。下一步是分配一个 `Point3D` 的新实例。所有实例变量都将设置为 `null`。然后我们继续执行\
  \ `Point3D` 的初始化列表。这导致了父初始化器的执行，从而导致了 `Point` 的初始化列表的执行。这将设置实例变量 `x` 和 `y`，然后执行添加到\
  \ `Point` 初始化列表末尾的隐式父初始化器。这将调用 `Object` 的初始化列表，它什么都不做（它末尾甚至没有父初始化器）。所有这些步骤显示在上方图左侧。\n\
  \n在遍历超类链中所有的初始化列表后，下一步是执行构造函数的体。在图中，这对应于箭头的返回。\n\n构造函数体总是隐式地运行父构造函数体。传递给父构造函数的参数与初始化列表中给出的父构造函数调用使用的参数相同。它们不会被重新计算。因此在我们的案例中，我们将开始运行\
  \ `Point3D()` 的体，它开始运行 `Point()` 的体，后者开始运行 `Object()` 的体，后者什么都不做。由于 `Point()` 没有指定体，我们返回\
  \ `Point3D()` 的体，在其中初始化 `z`，之后返回新分配的对象。该过程对应于我们图图的右侧。\n\n#### 2.9.1 重定向构造函数\n\n\n\
  \n\n有时，通过一个构造函数来定义另一个构造函数是有用的。再次考虑从笛卡尔坐标转换为极坐标的情况。我们之前的尝试只允许从笛卡尔坐标创建点。考虑到我们的实际表示法是极坐标，这显得有点奇怪。当然，我们可以直接修改构造函数以接受极坐标，但我们知道这样做是有问题的，因为我们有现有依赖于笛卡尔接口的用户。我们确实应该保留旧的构造函数，但也要添加一个接受极坐标的新构造函数。为此，我们将定义一个新的具名的构造函数\
  \ `Point.polar()`，并修改现有的构造函数，使其将传入的笛卡尔坐标转换为极坐标，并将调用转发给 `Point.polar()`。\n\n点击此处查看代码图像\n\
  \n```dart\nclass Point {\n  var rho, theta;\n\n  Point.polar(this.rho, this.theta);\n\
  \n  Point(a, b) : this.polar( sqrt(a * a + b * b), atan(a/b));\n\n  get x => rho\
  \ * cos(theta);\n\n  set x(newX) {\n    rho = sqrt(newX * newX + y * y);\n    theta\
  \ = acos(newX/rho);\n  }\n\n  set y(newY) {\n    rho = sqrt(x * x + newY * newY);\n\
  \    theta = asin(newY/rho);\n  }\n\n  get y => rho * sin(theta);\n\n  scale(factor)\
  \ => new Point.polar(rho * factor, theta);\n\n  operator +(p) => new Point(x + p.x,\
  \ y + p.y);\n\n  static distance(p1, p2) {\n    var dx = p1.x - p2.x;\n    var dy\
  \ = p1.y - p2.y;\n    return sqrt(dx * dx + dy * dy);\n  }\n}\n```\n\n`Point()`\
  \ 现在是一个定向构造函数（redirecting constructor）。定向构造函数的目的正如你可能猜测的，是将执行重定向到另一个构造函数，在本例中是 `Point.polar()`。在定向构造函数中，参数列表后面跟着一个冒号和一个形式如\
  \ `this.id(..)` 的调用，它指定了重定向到哪个构造函数。\n\n此时，我们成功在保留类原始 API 的情况下转换了点的表示法。我们使用具名构造函数\
  \ `Point.polar()` 使用新的表示法制造点，从而允许我们保留旧的构造函数。我们将旧构造函数转换为定向构造函数，使其生成我们修改后的点。我们还使用了\
  \ getter 和 setter 来保留点实例的原始 API。\n\n#### 2.9.2 工厂函数 (Factories)\n\n现在假设我们想避免过度的点分配。与其在每次请求时都生成一个新点，我们希望维护一个点的缓存。每当有人尝试分配点时，我们都想检查缓存，查看是否已经等价的点，并返回它。\n\
  \n传统上，构造函数使得这变得困难。在大多数语言中，构造函数总是像我们描述的那样分配一个新实例。如果你想使用缓存，你需要提前考虑这一点，并确保你的点是通过方法调用分配的，这种方法通常被称为工厂方法（factory\
  \ method）。\n\n遗憾的是，程序员被剥夺了完美预见的天赋，偶尔可能无法提前预见到对缓存的需求。但在 Dart 中，任何构造函数都可以替换为工厂方法，且这种替换对客户端来说是完全透明的。我们通过工厂构造函数来实现这一点。\n\
  \n工厂构造函数以单词 `factory` 为缀。它们看起来像普通的构造函数，除了它们可能有初始化列表或初始化的形式参数之外。相反，它们必须有一个返回对象的函数体。工厂方法可以返回缓存中的对象，也可以根据其选择分配一个新实例。它甚至可以分配不同类的实例（或在缓存或任何其他数据结构中查找它们）。只要生成的对象符合类的接口，一切就都是顺利的。\n\
  \n通过这种方式， Dart 解决了传统构造函数的一些经典弱点。\n\n### 2.10 noSuchMethod()\n\nDart 中的计算围绕着调用对象上的方法展开。如果调用了一个不存在的方法，默认行为是抛出\
  \ `NoSuchMethodError`。然而，情况并非总是如此。\n\n当调用一个在实例上不存在的方法时，Dart 运行时会调用该对象上的 `noSuchMethod()`\
  \ 方法。由于 `Object` 中 `noSuchMethod()` 的实现抛出 `NoSuchMethodError`，我们通常会看到熟悉的行为。\n\n\
  这种方案的优妙之处在于 `noSuchMethod()` 可以被重写。例如，如果你正在为另一个对象实现代理（proxy），你可以定义代理的 `noSuchMethod()`，将所有调用转发到代理的目标。\n\
  \n点击此处查看代码图像\n\n```dart\nclass Proxy {\n  final forwardee;\n\n  Proxy(this.forwardee);\n\
  \n  noSuchMethod(inv) { return runMethod(forwardee, inv);}\n}\n```\n\n`noSuchMethod()`\
  \ 的参数是 `Invocation` 的实例，它是核心库（core library）中定义的特殊类型，用于描述方法调用。`Invocation` 反映了原始调用，描述了我们尝试调用的方法名称、参数是什么，以及其他一些细节。\n\
  \n为了实际上将每次调用转发给 `forwardee`，我们对 `noSuchMethod()` 的实现使用了一个辅助函数 `runMethod()`，该函数接收接收者对象和一个调用，并使用提供的参数在接收者上调用具名方法。我们将在以后讨论第\
  \ 7 章 中的反射时展示如何实现 `runMethod()`。\n\n一个健壮的代理实现比上面的代码稍微复杂一点。一个微妙之处在于，`Proxy` 不会转发在\
  \ `Object` 中定义的方法，因为这些是继承的，不会导致 `noSuchMethod()` 被调用。`Object` 的接口设计得很小，可以进行手动拦截。\n\
  \n即使有这些复杂性，`Proxy` 的完整实现也是直观的。在书的后半部分，一旦我们学习了更多技巧，我们将展示 `Proxy` 的完整版本。编写一个独立于目标类型的通用代理的能力，是可选类型语言可以提供的灵活性的绝佳范例。\n\
  \n我们将在整本书中看到 `noSuchMethod()` 的几种有趣用法。\n\n### 2.11 常量对象和字段 (Constant Objects and\
  \ Fields)\n\n有些对象是在编译时计算的常量。其中许多是显而易见的：如 `3.14159` 这样的数字字面量，如‘Hello World’ 这样的字符串字面量。我们将在\
  \ 6.1.4 节（part0014.html_ch06lev4）详细说明常量表达式。\n\nDart 也支持用户定义的常量对象，这些是我们现在的重点。让我们看看是否可以制作常量点\n\
  \n点击此处查看代码图像\n\n```dart\nclass Point {\n  final x, y;\n\n  const Point(this.x, this.y);\n\
  \n  ... the usual\n}\n\nconst origin = const Point(0,0);\n```\n\n在适当条件下，我们可以产生一个表示点的常量\
  \ `Point` 对象。`origin` 变量被声明为常量。我们只能为其赋值常量对象。常量对象使用 `const` 而不是 `new` 创建。就像 `new`\
  \ 表达式一样，`const` 表达式调用构造函数，但该构造函数必须是常量构造函数，且构造函数的参数本身必须是常量。事实上，Dart 要求参数也限制为数字、布尔或字符串。幸运的是，数字字面量\
  \ `0` 总是常量。\n\n我们将 `Point` 的构造函数声明为常量。这对类以及构造函数本身施加了相当严格的限制。我们需要一个不可变的类。幸运的是，不可变点是非常自然的。\n\
  \n此外，常量构造函数不能有函数体。它可以有初始化列表，只要它只计算常量（假设参数是已知常量）。在我们的情况下，不需要计算。\n\n\n\n\n遗憾的是，我们无法像\
  \ `Point.polar()` 那样定义一个常量构造函数，因为它使用了像 `sqrt()` 这样的函数，这些函数的结果不被视为常量。`Point` 拥有这样的构造函数是可以的——我们只是不能使用\
  \ `const` 来调用它。因此，我们使用此构造函数创建的任何点都不会是常量。\n\n我们并不总是需要创建常量点。事实上，我们仍然可以使用 `new` 调用常量构造函数。如果这样做，对我们传递的参数将没有任何限制，但结果将不是常量。\n\
  \n常量可以预先计算一次，而不需要重新计算。常量是经过规范化（canonicalized）的——在 Dart 程序中，一个给定的值只会创建一个常量。\n\n###\
  \ 2.12 类方法 (Class Methods)\n\n类方法是不绑定到特定实例的方法。在讨论类变量时，我们已经遇到过一些这类方法了。类变量引发的访问器（accessors）就是类方法。我们可以称之为类\
  \ get（class getters）或类设置器（class setters）。除了自动生成的类访问器外，程序员也可以显式地定义这些访问器。事实上，人们也可以以类为基础定义普通方法。\n\
  \n我们在第 1 章中见过这样的示例。在 `Point` 类中，我们有：\n\n点击此处查看代码图像\n\n```\nstatic distance(p1, p2)\
  \ {\n  var dx = p1.x() - p2.x();\n  var dy = p1.y() - p2.y();\n  return sqrt(dx\
  \ * dx + dy * dy);\n}\n```\n\n就像类变量访问器，用户定义的类方法名称在声明它们的类内部是可用的。在类外部，只有当方法以其所属类的类名前缀时才能被访问，例如，`Point.distance(aPoint,\
  \ anotherPoint)`。\n\n在类方法中使用 `this` 会导致编译错误。由于类方法不特定于任何实例，因此在类方法内部没有定义 `this`。\n\
  \n如果你尝试调用一个不存在的类方法，将得到一个运行时错误：\n\n点击此处查看代码图像\n\n```\nPoint.distant(aPoint, anotherPoint);\
  \ // NoSuchMethodError!\n```\n\n这种行为突出了一个有趣的设计问题。由于这是一个静态调用，Dart 编译器可以在编译时检测到 `Point`\
  \ 中没有 `distant()` 类方法。为什么不在现场抛出编译错误呢？毕竟，我们确切地知道这段代码在运行时会失败。\n\n然而，Dart 的设计目标是尽可能不阻碍程序员的思路。在开发过程中，可能会以实验精神编写并测试不完整的代码片段。程序员可能更倾向于测试代码中的某一条路径，而完全知晓另一条路径尚未实现功能。\n\
  \n在那些坚持要求完整定义的系统中，开发者通过定义存根（stubs）来规避此类需求。这些存根将在运行时导致不正确的结果或失败，它们的唯一目的是通过让过度热忱的编译器沉默来允许开发继续进行。\n\
  \n当然，编译器的热忱并非完全无理由。未定义的方法可能仅仅是一个拼写错误：\n\n点击此处查看代码图像\n\n```\nPont.distance(aPoint,\
  \ anotherPoint); // NoSuchMethodError!\n```\n\n未定义的类 `Pont` 与预期的类 `Point` 之间的差异对人类来说可能很难检测，程序员可能会花费漫长且令人沮丧的时间来理解失败的原因。更糟糕的是，失败可能发生在未测试过的代码路径上，导致生产环境中的崩溃。\n\
  \n幸运的是，Dart 在这些情况下会给出静态警告，但仍会编译并运行代码。这既提供了动态系统的灵活性，又提供了传统类型系统提供的大部分保障。\n\n重要的是记住，**类成员永远不会被继承**：\n\
  \n点击此处查看代码图像\n\n```\nclass ExtendedPoint extends Point {\n  var origin = new Point(0,0);\n\
  \  get distanceFromOrigin => distance(origin, this);\n  // sorry, NoSuchMethodError!\n\
  }\n```\n\nget 方法 `distanceFromOrigin` 无法使用 `distance` 名字。我们可以在 `Point` 本身中定义 `distanceFromOrigin`（假设我们也定义了\
  \ `origin`），但 `distance` 在 `Point` 的任何子类中都不在作用范围内。为了使之工作，我们必须写：\n\n点击此处查看代码图像\n\n\
  ```\nget distanceFromOrigin => Point.distance(origin, this); // ok\n```\n\n由于类方法永远不会被继承，因此声明抽象类方法没有意义。如果你尝试这样做，进展会进展缓慢，因为这在语法上是无效的。\n\
  \n### 2.13 实例、它们的类与元类 (Instances, Their Classes and Metaclasses)\n\n每个对象都是类的实例。由于万物皆对象，类也是对象，而既然类也是对象，它们本身也是某个类的实例。类的类通常被称为*元类*（metaclass）。Dart\
  \ 语言规定类的类型为 `Type`，但没有指定它们具体属于哪个类。\n\n在典型的实现中，类可能是 `Type` 的实例。`Type` 的类会是什么呢？通常是\
  \ `Type`——即，它自身的实例。下图展示了这种情况：一个对象 `aC` 是类 `C` 的实例，类 `C` 是 `Type` 的实例，而 `Type` 是它自身的实例。\n\
  \n![Image](img/00006.jpeg)\n\n可靠地发现对象类的唯一方法是通过反射，我们将在第 7 章中详细讨论。对象确实支持 `runtimeType`\
  \ getter，它默认返回对象的类。然而，子类可以自由重写 `runtimeType`。回想上面的 `Proxy` 示例。代理对象必须与真实对象不可区分。更广义地说，关于对象只有行为是重要的原则很容易被违反。需要非常小心以确保语言不会导致此类实现细节的泄露。\n\
  \n另一方面，某些代码可能需要发现对象的实际类。IDE、调试器或性能分析器预期显示真实准确的信息。实现这一点的机制是反射。\n\n最后是一个令人不安的异常。人们很容易混淆调用类方法与在字面量上调用实例方法：\n\
  \n点击此处查看代码图像\n\n```\nType.runtimeType; // Ouch! NoSuchMethodError\n(Type).runtimeType;\
  \ // works\n```\n\n第一行是对一个不存在的类方法的调用；`Type` 类没有类方法 `runtimeType`。第二行调用了定义对象类型字面量\
  \ `Type` 的方法 `runtimeType`。我们可以通过将类方法视为相应 `Type` 对象的实例方法来解决这个问题，但目前并非如此。\n\n###\
  \ 2.14 Object 及其方法 (Object and Its Methods)\n\n`Object` 类接口非常小。事实上，我们已经遇到了它的所有方法。我们在第\
  \ 2.5 节](#part0010.html_ch02lev1sec5) 中遇到了运算符方法 `==` 以及访问器 `hashCode`。第 2.10 节 围绕\
  \ `noSuchMethod()` 展开。我们在上一节中看到了 `runtimeType`。可能最常用的方法是 `toString()`。该方法返回一个表示对象的字符串。默认版本通常会打印类似‘An\
  \ Instance of C’ 的内容，其中 C 是对象的类名。通常非常有必要重写它以得到更有意义的内容。\n\n\n\n总而言之，只有五个方法构成了所有对象共享的接口。`Object`\
  \ 类的概要如下\n\n点击此处查看代码图像\n\n```\nclass Object {\n  bool operator == (another) { ...\
  \ }\n  int get hashCode { ... }\n  String toString(){ ... }\n  noSuchMethod(Invocation\
  \ im) { ... }\n  Type get runtimeType{ ... }\n}\n```\n\n你会注意到，类型首次出现在我们的代码中。Dart\
  \ 代码可以带有类型注解的装饰，而 Dart 核心库几乎总是这样的。正如你所预期的，等性比较返回一个布尔结果，哈希码（hash code）是一个整数，`toString()`\
  \ 返回一个字符串，而运行时类型（runtime type）确实是一个 `Type`。如上文所述，`noSuchMethod()` 接收一个 `Invocation`。这种语法对大多数程序员来说都是熟悉的。\n\
  \n我们省略了方法的体体。事实上，如果你查看源代码，你会发现一些与其相似但又不同的内容：\n\n点击此处查看代码图像\n\n```\nclass Object\
  \ {\n  bool operator == (other)=> identical(this, other);\n  external int get hashCode;\n\
  \  external String toString();\n  external noSuchMethod(Invocation im);\n  external\
  \ Type get runtimeType;\n}\n```\n\n除了我们之前推导出实现的 `==` 之外，所有其他方法都是由 Dart 实现提供的，而不是直接在\
  \ Dart 代码中实现的。它们被标记为 `external`，表示它们的实是在其他地方提供的。`external` 机制对于声明实现来自外部的代码非常有用。有多种方式提供此类代码——通过外部函数接口、作为底层实现的原型（如此处所示），甚至可能是动态生成的实现。在这些场景中，对于大多数程序员来说，第一是最可能的。\n\
  \n### 2.15 Mixins（混入）\n\n有时，单继承继承可能会具有很大的限制性。一个经典的现实例子出现在实现 GUI 框架时。你发现你需要一个复合组件，将多个较小的组件组合在一起。将这个复合组件视为一个集合（Collection）是非常自然且方便的。集合具有一些实用的共享功能，因此你想定义\
  \ `CompoundWidget` 继承自 `Collection`。只有一个陷阱：你还想 `CompoundWidget` 继承自 `Widget`，因为它是一个组件，而且那里也有许多实用的功能可以使用。\n\
  \n一种方法是允许类拥有多个父类。经验表明，这样做带来的麻烦远大于其带来的收益。相反，Dart 使用了*基于混入的继承（mixin-based inheritance）*。\n\
  \n为了理解基于混入的继承，我们将检查一个简化的集合类\n\n点击此处查看代码图像\n\n```\nabstract class Collection {\n\
  \  forEach(f); // 对集合中的每个元素执行函数 f\n  where(f) ...\n  map(f) ...\n}\n```\n\n我们真正想要从\
  \ `Collection` 中得到的是它的体——大括号之间的内容。类体包含了类声明本身贡献的功能。它是 `Collection` 与其父类之间的区别。我们将这种区别称为\
  \ *mixin（混入）*。\n\n![Image](img/00007.jpeg)\n\n我们希望将这项功能“混合”到 `CompoundWidget` 中，如下所示。\n\
  \n![Image](img/00008.jpeg)\n\n我们可以通过将 `Collection` 的内容拷贝到新类 `WidgetCollection` 中来实现目标：\n\
  \n点击此处查看代码图像\n\n```\nabstract class WidgetCollection extends Widget {\n  forEach(f);\
  \ // 对集合中的每个元素执行函数 f\n  where(f) ...\n  map(f) ....\n}\n```\n\n但每当 `Collection`\
  \ 发生变化时，我们需要更新 `WidgetCollection`。通常情况下，这种复制/粘贴式的编码可能会导致各种问题——维护、类型检查、法律问题等。幸幸的是，我们可以使用混入来解决这个问题。\n\
  \n每个 Dart 类都有一个混入。如所述，混入是在类体中定义的特定于类的功能。因此，我们可以图形化地将每个具有父类 `S` 的类 `C` 描述为：\n\n![Image](img/00009.jpeg)\n\
  \n看待混入的一种方法是将其看作一个函数，该函数接收一个父类 `S` 并创建一个具有特定体的 `S` 新子类：\n\n点击此处查看代码图像\n\n```\nmixinCollection(S)\
  \ { // 非法：仅为图示说明\n  return class Collection extends S {\n    forEach(f); // 对集合中的每个元素执行函数\
  \ f\n    where(f) ...\n    map(f) ....\n  }\n}\n```\n\n此类函数对给定的类的每次应用都会产生一个新的子类。因此，我们把*混入应用（mixin\
  \ application）* 称为使用混入和父类派生类的操作。我们用 `S` 连上 `M` 来表示将混入 `M` 应用于父类 `S`。显然，`S` 必须是一个类名，但我们如何为混入命名呢？通过命名一个类；该类通过其体隐式地定义了混入，而这就是我们要应用到\
  \ `S` 的混入。我们现在知道如何在不复制代码的情况下定义 `CompoundWidget` 了。\n\n点击此处查看代码图像\n\n```\nclass CompoundWidget\
  \ extends Widget with Collection {\n  ... 组件组件内容\n}\n```\n\n`CompoundWidget` 的父类是\
  \ `Widget` 带有 `Collection`，这是 `Collection` 应用于 `Widget` 的混入，产生了一个匿名类。现在的层次结构如下：\n\
  \n![Image](img/00010.jpeg)\n\n在写作期间，作为混入使用的类不能显式声明构造函数。违反这一限制会导致编译错误。这种限制未来可能会放宽。\n\
  \n#### 2.15.1 示例：表达式问题\n\n在本节中，我们将考虑一个被称为*表达式问题（the expression problem）*的经典设计挑战，并看看混入如何提供优雅的解决方案。之所以这样命名，是因为使用的具体示例是语言的实现。然而，表达式问题引起的问题更广泛的编程示例具有特征。\n\
  \n考虑以下表达式语言：\n\n*Expression* → *Expression* + *Expression*|*Expression* − *Expression*|*Number*\
  \ 此语言的 AST（抽象语法树）可能的形式如下\n\n点击此处查看代码图像\n\n```\nclass Expression {}\nclass Addition\
  \ extends Expression {\n  var operand1, operand2;\n}\nclass Subtraction extends\
  \ Expression {\n  var operand1, operand2;\n}\nclass Number extends Expression {\
  \ int val;}\n```\n\n现在假设你想为这种语言定义一个评估器。你可以通过在上面的每个叶子类中添加 `eval` 方法来以经典的面向对象风格定义它：\n\
  \n点击此处查看代码图像\n\n```\nget eval => operand1.eval + operand2.eval; // Addition 中\n\
  get eval => operand1.eval - operand2.eval; // Subtraction 中\nget eval => val; //\
  \ Number 中\n```\n\n然而，这是有问题的。当你想要将此类表达式转换为字符串时，需要在原始层次结构中添加另一个方法。存在无数种类似的函数，你的类会迅速变得臃肿。此外，并不是想要定义新功能的人都有权访问原始源代码。\n\
  \n另一种方法是在 AST 类之外定义评估器函数。你必须对输入的表达式进行测试以确定它是什么类型，然后采取相应的行动。这样做是无聊且低效的，因此人们通常使用访问者模式。无论如何，这种组织都存在双重问题：虽然添加函数很容易，但添加新类型却很难。\n\
  \n这种困境如下表所示：\n\n![Image](img/00011.jpeg)\n\n\n\n\n类型对应于表格中的行，函数对应于列。面向对象的使得添加行变得容易，但添加列却具有侵入性。函数式风格则相反——添加列很容易，但添加行具有侵入性。\n\
  \n我们真正需要的是一种能够独立向表中添加单个条目的方法。这个问题可以通过混入（mixins）很好地解决。下面的 Dart 代码展示了如何实现。我们从三个初始数据类型开始，但将它们定义为抽象类，因为这些并不是我们实际实例化的数据类型。它们的作用是定义类型的结构及其构造函数。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary abstract expressions;\n\nabstract class AbstractExpression{};\n\
  \nabstract class AbstractAddition {\n varvar operand1, operand2;\n  AbstractAddition(this.operand1,\
  \ this.operand2);\n}\n\nabstract class AbstractSubtraction {\n varvar operand1,\
  \ operand2;\n  AbstractSubtraction(this.operand1, this.operand2);\n}\n\nabstract\
  \ class AbstractNumber {\n varvar val;\n  AbstractNumber(this.val);\n}\n```\n\n\
  现在，让我们定义第一个函数：求值器（evaluator）。我们将通过一组混入类来实现。\n\n点击此处查看代码图像\n\n```dart\nlibrary evaluator;\n\
  \nabstract class ExpressionWithEval {\n  get eval;\n}\n\nabstract class AdditionWithEval\
  \ {\n  get operand1;\n  get operand2;\n  get eval => operand1.eval + operand2.eval;\n\
  }\n\nabstract class SubtractionWithEval {\n  get operand1;\n  get operand2;\n  get\
  \ eval => operand1.eval - operand2.eval;\n}\n\nabstract class NumberWithEval {\n\
  \  get val;\n  get eval => val;\n}\n```\n\n上面的求值器完全独立于类型层次结构；注意，我们没有导入任何一个依赖项。客户端应该使用的实际类型是单独定义的。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary expressions;\n\nimport 'abstractExpressions.dart';\n\
  import 'evaluator.dart';\n\nabstract class Expression = AbstractExpression with\
  \ ExpressionWithEval;\n\nclass Addition = AbstractAddition with AdditionWithEval\
  \ implements Expression;\n\nclass Subtraction = AbstractSubtraction with SubtractionWithEval\n\
  \                                                   implements Expression;\n\nclass\
  \ Number = AbstractNumber with NumberWithEval implements Expression;\n```\n\n每个具体的\
  \ AST 类型都被定义为混入的应用，通过通过相应的求值器混入来扩展相应的抽象数据类型。我们可以在 `expressions` 中添加一个 `main()` 函数来构建一个简单的表达式树。这是可能的，因为各种\
  \ AST 节点类已经根据其父类的构造函数隐式地为它们定义了合成构造函数。\n\n点击此处查看代码图像\n\n```dart\nmain(){\n  var e\
  \ = new Addition(new Addition(new Number(4), new Number(2)),\n                 \
  \      new Subtraction(new Number(10), new Number(7))\n                );\n}\n```\n\
  \n抽象类型和具体类型分离的意义何？`expressions` 的作用是通过混入应用连接其各种组件来定义我们的整个系统。`abstractExpressions`\
  \ 的作用是定义我们 AST 节点的形状。将它们分离将允许我们通过修改 `expressions` 来扩展系统，而不触碰我们的数据类型表示。\n\n通用模式是每个具体类都基于扩展一个定义其数据表示的抽象类，并配有一系列代表该数据类型所有函数的混入。这种方法之所以有效是因为我们为每种函数和类型的组合都定义了一个独立的混入。例如，在上面，每个\
  \ `eval` 方法都定义在它自己的混入类中。\n\n如果我们想添加一个类型，可以独立地完成。我们将添加一个乘法的 AST 节点：\n\n点击此处查看代码图像\n\
  \n```dart\nlibrary multiplication;\n\nabstract class AbstractMultiplication {\n\
  \  var operand1, operand2;\n  AbstractMultiplication(this.operand1, this.operand2);\n\
  }\n```\n\n再次，这种添加完全独立于原始类层次结构和任何函数。在这个阶段，我们还必须定义如何求值乘法。我们可以将其定义为一个独立的库。\n\n点击此处查看代码图像\n\
  \n```dart\nlibrary multiplication evaluator;\n\nabstract class MultiplicationWithEval\
  \ {\n  get operand1;\n  get operand2;\n  get eval => operand1.eval * operand2.eval;\n\
  }\n```\n\n这再次证明了完全独立的。我们确实需要在 `expressions` 中创建对应的类。\n\n点击此处查看代码图像\n\n```dart\n\
  class Multiplication = AbstractMultiplication with MultiplicationWithEval\n```\n\
  \n等待，原文在此处有一些碎片化的结构：\n`class Multiplication = AbstractMultiplication with MultiplicationWithEval`\n\
  \n我们需要向 `expressions` 中添加以下内容：\n\n点击此处查看代码图像\n\n```dart\nimport 'multiplication.dart';\n\
  ```\n\n`expressions` 的其余部分保持不变。如果能打印我们在 `main()` 中构建的树就好了。我们可以修改 `main()` 来来实现。\n\
  \n点击此处查看代码图像\n\n```dart\nmain(){\n  var e = new Addition(new Addition(new Number(4),\
  \ new Number(2)),\n                       new Subtraction(new Number(10), new Number(7))\n\
  \                );\n  print('$e = ${e.eval}');\n}\n```\n\n打印输出没有我们预期的信息量，因为 `e`\
  \ 使用 `Object` 的默认 `toString()` 进行打印。为了解决这个问题，我们可以为我们的层次结构添加一个特殊的 `toString()`。\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary string;\n\nabstract class ExpressionWithStringConversion\
  \ {\n  toString();\n}\n\nabstract class AdditionWithStringConversion {\n  get operand1;\n\
  \  get operand2;\n  toString() => '($operand1 + $operand2)';\n}\n\nabstract class\
  \ SubtractionWithStringConversion {\n  get operand1;\n  get operand2;\n  toString()\
  \ => '($operand1 - $operand2)';\n}\n\nabstract class NumberWithStringConversion\
  \ {\n  get val;\n  toString() => '$val';\n}\n\nabstract class MultiplicationWithStringConversion\
  \ {\n  get operand1;\n  get operand2;\n  toString() => '($operand1 * $operand2)';\n\
  }\n```\n\n再次，我们遵循为每个方法/类型组合定义一个混入的公式。这次，我们知道层次结构涉及乘法，并在同一个库中定义了相应的情况。同样，我们将希望精炼\
  \ `expressions` 以集成新功能。\n\n点击此处查看代码图像\n\n```dart\nlibrary expressions;\n\nimport\
  \ 'abstractExpressions.dart';\nimport 'evaluator.dart';\nimport 'multiplication.dart';\n\
  import 'multiplicationEvaluator.dart';\nimport 'stringConverter.dart';\n\nabstract\
  \ class Expression = AbstractExpression with\n  ExpressionWithEval, ExpressionWithStringConversion;\n\
  \nclass Addition = AbstractAddition with\n  AdditionWithEval, AdditionWithStringConversion\
  \ implements Expression;\n\nclass Subtraction = AbstractSubtraction with\n  SubtractionWithEval,\
  \ SubtractionWithStringConversion implements Expression;\n\nclass Number = AbstractNumber\
  \ with\n  NumberWithEval, NumberWithStringConversion implements Expression;\n\n\
  class Multiplication = AbstractMultiplication with\n  MultiplicationWithEval, MultiplicationWithStringConversion\
  \ implements Expression;\n```\n\n\n\n\n可以根据需要继续这一扩展过程。你可以添加任意数量的类型和函数。你只需要像上面那样，定义好你将要用作\
  \ mixin 应用（mixin applications）的类型的最终形式即可。对于每个类型，每个函数的对应情况都由一个独立的 mixin 类定义。添加新函数确实需要修改这些\
  \ mixin 应用，但这实际上更像是调整你的 make 文件以包含额外的函数和/或类型。如果新类型和新函数是独立定义的，我们总是可以单独定义一个 mixin，它负责添加将新函数应用到新类型的逻辑，并将其混合进来。\n\
  \n在表格方面，每个 mixin 代表一个单独的条目，而每个 mixin 应用构成了表格的一行。\n\n当我们在之后讨论第 5 章中的类型时，会再次回到这种设计。\n\
  \n### 2.16 相关工作\n\n如引言中所，Dart 的对象模型深受 Smalltalk [1] 的影响。Smalltalk 是第一种纯面向对象的语言，这里的许多思想都与其直接相关。这种循环引用自身的元类层级（metaclass\
  \ hierarchy）概念源于那里，尽管 Dart 的元类层级与 Smalltalk 相比要简单得多。与 Smalltalk 不同，实例实例化是通过构造函数而不是方法处理的，这遵循了\
  \ C++ 建立的传统。然而，我们解决了经典构造函数的主要缺陷：它们无法产生并非由其类新分配的对象。\n\n`noSuchMethod()` 的使用紧密模仿了\
  \ Smalltalk 的 `doesNotUnderstand:`。\n\n表示独立性（representation independence）的概念可以追溯到\
  \ `Self` 语言。然而，由于 Javascript 和 C 语言风格语法的影响，Dart 并没有遵循统一引用（uniform reference）的原则。\n\
  \nMixins 起源于某些 Lisp 方言中的一种惯用法（idiom）。这里使用的 mixins 语言模型由 William Cook 和作者在 1990 年引入\
  \ [4]，并首次在 Strongtalk [5],[6] 中实现，这是一种创新的 Smalltalk 系统，对 Dart 具有特别远的影响。在 Newspeak、Scala（其中它们称为\
  \ traits）和 Ruby 等语言中也存在密切相关的结构。\n\n“表达式问题”（expression problem）这一名称源于 Philip Wadler。表达式问题在文献中被广泛讨论\
  \ ([7], [8], [9]）。提出的解决方案取决于所涉及的语言和需求。\n\n### 2.17 总结\n\nDart 是一种纯面向对象的、基于类的语言，这意味着所有运行时值都是对象，且每个对象都是某个类的实例。\n\
  \n对象具有状态和行为。状态仅可以通过特殊的访问方法——getters 和 setters 使用。这确保了在 Dart 对象上进行的所有计算都是通过过程化接口完成的。\n\
  \n类在运行时是具象化的（reified），因此它们本身必须是对象。因此，每个类都是类型为 `Type` 的元类的实例。每个类至少有一个构造函数；构造函数用于创建对象。某些对象是常量，意味着它们可以在编译时进行预计算。\n\
  \n每个 Dart 类都有一个唯一的父类，类层级结构的根节点 `Object` 除外。所有的 Dart 对象都从 `Object` 继承共同的行为。\n\nDart\
  \ 支持基于 mixin 的继承：每个类都会引入一个 mixin，捕获其对类层级结构的独特贡献。Mixins 允许类代码以模块化的方式重用，而独立于其在类层级结构中的位置。\n\
  \n# 第 3 章 Libraries\n\nDart 程序被组织成称为库（libraries）的模块单元。我们在第 1 章 中看到了第一个库。你可能认为那是该章节末尾显示的\
  \ `points` 库，但实际上它是我们的“Hello World”程序。这可能是一个微不足道的库，但它终是一个库。这里再次展示它：\n\n```\nmain(){\n\
  \  print('Hello World');\n}\n```\n\n如你所见，并没有像我们在 `points` 中看到的那种显式库声明。大多数库都有这样的声明，这对于我们将在下文中说明的各种原因非常有用。然而，对于快速、简单的任务，能够直接写一个函数并运行它是很方便的。在\
  \ Dart 中，我们总是寻求以最小的麻烦实现语言的实验，同时为良好的软件工程实践提供支持。\n\n### 3.1 顶层（Top Level）\n\n在我们的示例中，库由单一顶层函数\
  \ `main()` 组成。通常，一个库由多个顶层声明组成。这些声明可以定义函数、变量和类型。\n\n这是一个稍微大一点但仍然微不足道的示例——一个实现栈（stack）的库。这是你可能在入门编程课程中看到的种枯燥练习，这很好的，因为我们可以关注语言结构，而不是复杂的程序逻辑。\n\
  \n点击此处查看代码图像\n\n```\nlibrary stack1;\n\nfinal _contents = [];\n\nget isEmpty =>\
  \ contents.isEmpty;\n\nget top => isEmpty ? throw 'Cannot get top of empty stack'\
  \ : contents.last;\n\nget pop => isEmpty? throw 'Cannot pop empty stack' : _contents.removeLast();\n\
  \npush(e) {\n  _contents.add(e);\n  return e;\n}\n```\n\n我们有一个顶层变量 `contents`，它初始化为空列表。通过隐式访问器（getters）访问，就像实例字段一样。再次，用户代码并不直接访问这些变量。顶层变量是懒加载的，在第一次调用其\
  \ getter 时初始化，就像类变量一样。在 `stack1` 中，在调用访问它的方法之前，`contents` 不会被设置为 `[]`。\n\n顶层变量和类变量共同构成静态变量。它们的区别在于作用域——可以通过名称引用。类变量的名称限制在定义它的类内部（甚至子类也看不到），而顶层变量（也称为库变量）的名称在整个库范围内都是有效的。库范围通常包含多个类和函数。\n\
  \n与类变量一样，顶层变量可以是 `final` 的，在这种情况下它们没有 setter，并且必须在声明处初始化。也可以将静态变量（无论是类变量还是库变量）声明为常量，在这种情况下它可以仅被赋值为编译时常量并被视为常量（见\
  \ 2.11,6.1.4）。\n\n顶层函数（通常称为库方法）的作用域规则与顶层变量相同；顶层函数在整个库范围内都是有效的。可以定义普通函数、getters 和\
  \ setters。在每种情况下，函数体都可以使用 `=>` 后跟单个表达式的短形式（如 `isEmpty`、`top`、`pop`），或者大括号之间的一系列语句（如\
  \ `push()`）。\n\n除了顶层函数和变量外，我们还有顶层类声明。Dart 中的所有类声明都是顶层的，因为 Dart 不支持嵌套类。\n\n###3.2\
  \ 脚本（Scripts）\n\n“Hello World”程序是脚本的示例，脚本是一种可以直接执行的 Dart 库。脚本从它的 `main()` 函数开始执行。如果一个库没有\
  \ `main()` 函数，根据定义它就不是脚本且无法独立运行。\n\n\n\n\n脚本还有另一个特殊之处。脚本的第一行可以以字符 `#` 开头，其后可以跟任意任意文本，直到行结束。这在许多环境中非常有用，这些环境能够根据文件头部以\
  \ `#` 为前缀的指令，对文件运行不同的解释器。\n\n### 3.3 私有性\n\n库（Libraries）是 Dart 的封装单元。以下划线（`_`）开头的名称对于库是私有的。我们在上面看到过一个例子，库变量\
  \ `_contents`。将 `_contents` 设为私有有助于维护 `stack1` 引入的栈抽象的完整性。因为只有 `stack1` 内部的代码可以访问\
  \ `_contents`，我们可以确保没有其他代码会篡改栈的底层表示。\n\n另一个例子，考虑\n\n点击此处查看代码图像\n\n```dart\nclass\
  \ CachingClass {\n   var _cache;\n\n   operator [](i) {\n     if ( _cache[i] ==\
  \ null) { _cache[i]= complicatedFunction(i);}\n     return _cache[i];\n   }\n}\n\
  ```\n\n在定义 `CachingClass` 的库之外，没有人可以获取 `_cache` 字段。\n\n这种方案允许你（以及编译器或任何其他工具）识别某个内容是否是私有的，而无需查找其声明。\n\
  \n私有性不应与安全性混淆。Dart 中私有性的目的是支持软件工程需求，而不是安全需求。唯一的安全边界是各个隔离器（isolates）之间的边界，我们将在第 8\
  \ 章中详细检查它们。在一个隔离器内部，没有安全保证。\n\n### 3.4 导入\n\n读者无疑熟悉编程中的导入（imports）概念。例如，如果我们想在应用程序中使用\
  \ `stack1`，我们可能会这样写：\n\n```dart\nimport 'stack1.dart';\n\nmain() {\n  push('gently');\n\
  \  push('harder');\n  print(pop);\n  print(top);\n}\n```\n\n这为我们的 `main()` 函数提供了访问\
  \ `stack1` 的 `push()` 和 `pop` 方法的权限。脚本将打印 `harder` 然后打印 `gently`。只要库 `stack1` 存储在与主脚本相同目录下的名为\
  \ `stack1.dart` 的文件中，这段代码就可以工作。然而，如果 `stack1` 存储在其他地方，例如网络上的某个处 [`http://staxRUs/stack1.dart`](http://staxRUs/stack1.dart)\
  \ 呢？\n\n我们可以将其替换为：\n\n点击此处查看代码图像\n\n```dart\nimport 'http://staxRUs/stack1.dart';\n\
  ```\n\nDart 导入支持任意的 URI（通用资源标识符）。然而，上述两个 URI 都不被特别建议，因为这会让你的代码对导入库位置的任何变化变得敏感。使用此类\
  \ URI 对于快速且粗略的实验很有用，但严肃的代码需要更多的纪律。通常，人们会写：\n\n```dart\nimport 'package:stack1.dart';\n\
  ```\n\n`package:` 方案用于调用一个驻的包管理器，该管理器封装了关于代码所在位置知识。Dart 环境通常带有一个包管理器，但细节超出了本书的范围。\n\
  \n对于属于 Dart 平台部分的库，不需要使用 `package:` 方案。它们通过 `dart:` 方案访问，例如：\n\n```dart\nimport\
  \ 'dart:io';\n```\n\n其他示例包括 `dart:html`、`dart:json` 以及许多其他。\n\n无论你使用何种方案，URI 最好引用一个实际库，否则会发生编译错误。URI\
  \ 还需要是一个常量字符串字面量（6.1.1.4），并且可能不涉及插值。\n\n库内部可用的名称是它声明的名称，以及通过导入其他库引入库作用域的名称。`dart:core`\
  \ 定义的名称是隐式导入的。\n\n库向客户端提供的名称集合与内部可用的名称有所不同。首先，库导入的名称不会传递地提供给导入该库的客户端。此外，库的私有成员对导入它们的其他库是不可见的。我们很快就会看到其他的差异。因此，谈论库的*导出命名空间*（exported\
  \ namespace）是有帮助的。\n\n假设我们在库 `stack2` 中有一个备选的栈实现。我们可能会编写一些旨在测试这两种实现的代码。我们可能先这样草拟我们的脚本：\n\
  \n```dart\nimport 'package:stack1.dart';\nimport 'package:stack2.dart';\n\nmain()\
  \ {}\n```\n\n到目前为止，一切良好。你可以毫无问题地编译这段代码。然而，一旦我们尝试用使用导入内容的代码填充 `main()` 的主体，我们就会遇到一个障碍。\n\
  \n点击此处查看代码图像\n\n```dart\nimport 'package:stack1.dart';\nimport 'package:stack2.dart';\n\
  \nmain() {\n  // testing stack1\n  push('gently'); // 静态警告\n  push('harder'); //\
  \ 静态警告\n  print(pop); // 静态警告\n  print(top); // 静态警告\n\n  // testing stack2\n  push('gently');\
  \ // 静态警告\n  push('harder'); // 静态警告\n  print(pop); // 静态警告\n  print(top); // 静态警告\n\
  }\n```\n\n你能分辨出使用 `stack1` 的代码和使用 `stack2` 的代码之间的区别吗？当然不能，编译器也不能。`stack2` 的方法与 `stack1`\
  \ 的方法名称相同，将它们都导入到同一个作用域会产生无法解决的歧义。\n\nDart 编译器将对每次使用歧义名称发出警告。注意，导入冲突的名称本身不会引起任何警告——只有当你尝试使用歧义名称时才会发出警告。这符合\
  \ Dart 的“不阻碍他人”哲学。它还有一个很好的特性，即当有人在你之前导入的库中添加一个顶层名称时，你的代码不太可能崩溃。\n\n如果我们忽略警告并尝试运行代码，第一次调用\
  \ `push()` 将导致运行时错误。具体来说，将抛出一个 `NoSuchMethodError`，因为 `push()` 没有被正确定义。读者可能会问，为什么代码甚至被允许运行呢？我们确定它会失败，为什么不将这些情况标记为错误并拒绝编译呢？请记住，歧义名称的使用可能在一个并不总是执行的分支中。我们认为并非如此；我们不想对程序员施加特定的工作流。相反，我们乐于告知程序员问题，并由他们决定何时解决。解决上述歧义的良好方法是为每组导入的名称提供不同的前缀。点击此处查看代码图像\n\
  \n```dart\nimport 'package:stack1.dart' as stack1;\nimport 'package:stack2.dart'\
  \ as stack2;\n\nmain() {\n  // testing stack1\n  stack1.push('gently');\n  stack1.push('harder');\n\
  \  print(stack1.pop);\n  print(stack1.top);\n\n  // testing stack2\n  stack2.push('gently');\n\
  \  stack2.push('harder');\n  print(stack2.pop);\n  print(stack2.top);\n}\n```\n\n\
  Dart 库内部声明的优先级高于任何导入，因此向导入的库中添加顶层名称并没有想象中那么糟糕。然而，问题仍然可能发生。如果你从一个导入访问一个名称，而另一个导入库后来添加了相同的名称，就会产生问题。此外，新导入的名称可能会遮蔽继承的名称。\n\
  \n为所有导入添加前缀可以确保当导入库添加顶层成员时，未来永远不会导致导入者崩溃。\n\n\n\n前缀可能与闭包库中的任何其他顶层声明冲突。编译器会将此类冲突标记为错误。由于本地名称的优先级高于任何导入，因此前缀将遮蔽（shadow）任何未带前缀导入的同名声明。\n\
  \n在多个导入中使用相同的前缀是允许的。如果这些导入引入的带缀名称发生冲突，则适用上述规则：除非使用了冲突的名称，否则没有问题；一旦使用，则会在编译时发出警告，并在运行时因\
  \ `NoSuchMethod` 导致执行失败。\n\n重要的一点是理解：只有当名称指向不同的声明时，Dart 才会认为它们存在冲突。如果我们从同一个库导入了两次\
  \ `push()`，那么在编译时或运行时都不会出现问题。\n\nDart 提供了额外的机制来控制哪些名称被导入到库中：命名空间组合器 `show` 和 `hide`。`namespace`（命名空间）是从名称到声明的映射。例如，由\
  \ `stack1` 定义的命名空间。它包含了 `contents`、`isEmpty`、`top`、`pop` 和 `push`。当我们导入 `stack1`\
  \ 时，看不到 `contents`，因为它是私有的；它不属于 `stack1` 导出的命名空间。通常，导入允许导入者访问被导入库的导出命名空间。前缀化和命名空间组合器都允许我们操作被导入的命名空间。\n\
  \n`hide` 组合器接收一个命名空间和一个标识符列表，产生一个新的命名空间，其中列出的标识符已被丢弃。如果我们在库中包含以下导入：\n\n点击此处查看代码图像\n\
  \n```dart\nlibrary lib1;\n\nimport 'stack1.dart' hide isEmpty, top;\n```\n\n在 `lib1`\
  \ 中只有 `pop` 和 `push` 可用，因为被导入的命名空间不再是 `stack1` 的完整导出命名空间。`hide` 操作符作用于导出命名空间，消除了\
  \ `isEmpty` 和 `top`。实际上提供在导入者作用域中的是 `hide` 作用的结果。\n\n`show` 组合器与之类似，区别在于结果命名空间中仅保留列出的标识符。我们可以使用\
  \ `show` 来达到与上示例相同的效果：\n\n点击此处查看代码图像\n\n```dart\nlibrary lib1;\n\nimport 'stack1.dart'\
  \ show pop, push;\n```\n\n相比之下，让我们来看\n\n点击此处查看代码图像\n\n```dart\nlibrary lib1;\n\n\
  import 'stack1.dart' show isEmpty, top;\n```\n\n在这里，`lib1` 中仅提供了 `isEmpty` 和 `top`，而没有提供\
  \ `pop` 和 `push`。这个示例也可以同样表达为：\n\n点击此处查看代码图像\n\n```dart\nlibrary lib1;\n\nimport\
  \ 'stack1.dart' hide pop, push;\n```\n\n什么时候应该使用 `show`，什么时候使用 `hide`？如果你正在导入一个大型库，而你只想使用其中的少数成员，可能会发现\
  \ `show` 更方便。相反，如果你正在尝试解决库之间的一或两个冲突，可能会选择使用 `hide`，但可能使用带前缀的 `as` 更好，以确保永远不会发生冲突。然而，正如我们在下面讨论导出时看到的，`hide`\
  \ 还有额外的用途。\n\n如果你真的想让你的库更加健壮，你应该将前缀与 `show` 结合，只导入你真正使用的元素\n\n点击此处查看代码图像\n\n```dart\n\
  library lib1;\n\nimport 'stack1.dart' as stack1 show pop, push;\n```\n\n这样，你只需要扫一眼库的顶部就能确切知道你依赖于哪些成员。大多数程序员可能觉得这种纪律性有点无味，但良好的开发工具应该能够自动为你维护此类导入。\n\
  \n人们可能会觉得通过前缀访问导入内容过于冗长。另一种风格坚持始终使用 `show`，但不使用前缀。使用 `show` 将防止导入的任何新成员引起意外的冲突。然而，人们可能仍然需要解决来自不同导入的成员之间的冲突，并注意导入成员与继承成员之间的冲突。\n\
  \n### 3.5 将库拆分为部分\n\n有时，一个库太大了，不方便保留在单个文件中。Dart 允许将库拆分为称为 *parts*（部分）的小型组件。假设我们有一个实现\
  \ Dart 交互式开发环境（IDE）的 Dart 库。该 IDE 包括类浏览器、对象检查器、调试器，以及对单元测试、包管理和版本控制的集成支持。这是一个大型程序，我们绝对不希望用一个巨大的文件来包含所有内容。同时，由于紧密集成，我们可能希望\
  \ IDE 是一个单一的库，其私有状态可以在子系统间共享。我们可以如下对其进行结构：\n\n点击此处查看代码图像\n\n```dart\nlibrary ide;\n\
  \nimport 'dart:io' as io;\n\nimport 'dart:mirrors' as mirrors;\n\nimport 'dart:async'\
  \ as async;\n\n// 更多：UI 等。\n\npart 'browsing.dart';\n\npart 'inspecting.dart';\n\
  \npart 'debugging.dart';\n\npart 'unitTest.dart';\n\npart 'packages.dart';\n\npart\
  \ 'vcs.dart';\n```\n\n每个子系统位于自己的文件中，库通过 `part` 指令引用它们。`part` 指令给出了可以找到该部分的 URI。`part`\
  \ 遵循与导入相同的规则。部分共享相同的作用域——引用它们的库的内部命名空间，包括任何导入。\n\n`part` 似乎类似于 C 语言的 `#include`\
  \ 指令。但并非如此。部分是结构化的。每个部分必须以 *part header*（部分头部）开头，指定它所属的库。例如，“browsing.dart”可能开头为\n\
  \n```dart\npart of ide;\n\n // 顶层声明\n\n class ClassBrowser ...\n```\n\n头部头部引用库的名称。并不是所有库都有名称，但如果想要一个由部分构建的库，就必须给它一个名称。部分应该是良好的逻辑分组，而不是任意的代码块。\n\
  \n如果部分从不同的库引用怎么办？例如，假设 `packages.dart` 读取：\n\n```dart\n// file packages.dart\n\n\
  part of packageManager;\n\n // 顶层声明\n\n class Package ...\n```\n\n 这种错误确实会发生，并引起\
  \ Dart 编译器的警告。一如既往，Dart 试图避免阻止执行的完全编译错误。你可能发现像 `packages.dart` 这样的部分在原始库之外的上下文中很有用。从长期来看，这可能是一个坏主意，因为\
  \ `packages.dart` 的更新可能会与你对 `ide` 库的计划冲突。然而，作为一种临时措施，它可能非常方便。它可以被编译和运行，Dart 不会阻碍你。\n\
  \n另一个可能的问题是 `packages.dart` 实际上不是一个部分：\n\n```dart\n// file packages.dart\n\nlibrary\
  \ packages;\n\n // 顶层声明\n\n class Package ...\n\n...\n```\n\n这段代码会导致编译时错误，因为在这种情况下编译器无法进行任何合理的操作。通用规则是：如果库引用某个\
  \ URI 的部分，而该 URI 的内容不是部分，则为编译错误；如果部分没有引用回同一个库，则为警告。与导入（以及接下来我们将看到的导出）一样，如果 URI 不是常量字符串或涉及字符串插值，它也是编译时错误。\n\
  \n### 3.6 导出\n\n\n\n让我们再次考虑我们的 IDE 示例。IDE 不一定是数百万行代码的巨型建筑，但它们也可以是。我们的项目增长可能会超出我们最疯狂的预期，此时我们确实需要将其拆分成多个库。此外，我们也可能想为第三方提供一个\
  \ IDE 的 API。\n\n当然，人们可以根据需要导入 IDE 的各种组件库。然而，这些 API 可能会非常大且复杂，我们可能希望提供一个更易于管理的子集。当我们不想让用户因导入大量子库而增加负担时，这非常有用。此外，我们可能不想暴露项目的内部库结构。\n\
  \n我们该如何从一系列库中组合出一个易于管理的 API 呢？\n\n点击此处查看代码图像\n\n```dart\nlibrary ideAPI;\n\nexport\
  \ 'browsing.dart' \n  show AbstractBrowser, LibraryBrowser, ClassBrowser;\n\nexport\
  \ 'inspecting.dart' show ObjectInspector;\n\nexport 'debugging.dart' show ThreadBrowser,\
  \ ActivationBrowser;\n\nexport 'unitTestIntegration.dart' show TestBrowser, TestSuite;\n\
  \nexport 'packages.dart' show PackageBrowser;\n\nexport 'vcs.dart' show RepositoryBrowser;\n\
  ```\n\n`export` 指令允许库通过其他命名空间中的额外名称来增强其导出命名空间。在像 `ideAPI` 这样的情况下，库的整个目的是将其他库的功能聚合并封装成一种易于消费的形式。它通过从几个库的导出命名空间构建一个\
  \ API，并使用 `show` 和 `hide` 进行适当的过滤来实现这一目标。虽然我们的示例只使用了 `show`，但在我们需要导出大型 API 但又想避免与另一个导出库发生冲突的情况下，`hide`\
  \ 将非常有用。\n\n然而，使用 `hide` 有一个缺点：如果导出的库中添加了新成员，可能会引发冲突。另一方面，`hide` 的优势是，我们不需要显式地更新导出子句即可让导出库中的新增内容对客户端可用。\n\
  \n注意，`ideAPI` 并没有导入任何内容。导出（Exports）与导入（Imports）是完全独立的。即使你没有在库中使用某个库，也可以导出它。这正是让像\
  \ `ideAPI` 这样的库能够聚合（部分）多个 API 的原因。导出的规则与导入和部分（parts）的规则一致：导出中使用的 URI 必须引用一个库，并且必须是不包含插值的常量字符串字面量。如果违反了任何这些要求，编译器将报告错误。如果一个库通过多个导出子句导出同一个名称，也是编译错误。这种情况在本质上是模糊的——我们实际上在导出哪个实体？\n\
  \n### 3.7 菱形导入 (Diamond Imports)\n\n在导入多个此类聚合 API 时，最终可能会通过多种路径导入同一个实体。这种情况被称为*菱形导入*（diamond\
  \ import），如下所示。\n\n![图像](img/00012.jpeg)\n\n点击此处查看代码图像\n\n```dart\nlibrary food;\n\
  \nclass Escargot {...}\nclass Caviar {...}\nclass Pasta {...}\nclass IceCream {...}\n\
  \nclass IceCreamCone {\n  fill(contents){ ...}\n}\n\nlibrary cooking;\n\nimport\
  \ 'package:food.dart' as food\n  show Escargot, Caviar, Pasta, IceCream, IceCreamCone;\n\
  \nexport 'package:food.dart'\n  show Escargot, Caviar, Pasta, IceCream, IceCreamCone;\n\
  \nclass CoqAuVin {...}\nclass SeaBassInBaroloSauce {...}\nclass PeaSoup {...}\n\
  class RabbitBrainsWithAnemone {...}\nclass SpaghettiBolognese {...}\n\nlibrary containers;\n\
  \nexport 'package:food.dart' show IceCreamCone;\n\nclass Plate {...}\nclass Cup\
  \ {...}\nclass Bowl {...}\n\nlibrary kitchen;\n\nimport 'package:containers.dart';\n\
  import 'package:food.dart';\n\nmakeIceCream() {\n  new IceCreamCone().fill(new IceCream());\n\
  }\n```\n\n`kitchen` 库同时导入了 `cooking` 和 `containers`。它们在导出命名空间中都包含了 `IceCreamCone`\
  \ 名称。Dart 会对这种情况发出警告；但并不被视为错误，因为两者都是从 `food` 获取 `IceCreamCone` 并简单地重新导出它。\n\n考虑如果\
  \ `containers` 决定替换来自 `food` 的 `IceCreamCone` 版本（例如通过声明自己的版本，或从另一个提供者获取 `IceCreamCone`）会发生什么。`containers`\
  \ 库保持了其公共 API 不变，因此客户端不应遇到任何困难。然而，这种变化会突然使上面的代码变得非法。\n\n这是不希望的，因此我们发出了警告。然而，在典型的\
  \ Dart 风格中，我们并不阻止编译，因为并不存在真正的歧义。这种警告是有用的，可以确保程序员忽略潜在的冲突。它鼓励了最佳实践，即始终避免模糊性。\n\n###\
  \ 3.8 延迟加载 (Deferred Loading)\n\n有时，推迟库的加载是必要的。原因各不相同。通常，我们只是为了让应用程序启动更快，尽可能保持初始下载尽可能小。另一种情况可能出现在功能很多的大型应用程序中；可能某些功能并非所有用户都会使用，因此实现该功能的库并不总是必需的。不加载未使用的库有助于减少内存占用。\n\
  \nDart 使用*延迟导入*（deferred imports）来支持这些场景。\n\n点击此处查看代码图像\n\n```dart\nimport 'rarelyUsed.dart'\
  \ deferred as rarelyUsed;\n```\n\n编译器在开发期间仍会使用该导入，以将所需的名称引入作用域，但在运行时尝试访问它们将导致动态错误，除非它们被显式加载。延迟导入必须提供一个前缀。提供的前缀可能不会被任何导入使用。违反这些规则会导致编译错误。\n\
  \n当需要实际使用延迟加载的库时（例如，当用户选择需要它的菜单项时），我们可以调用 `rarelyUsed` 上的 `loadLibrary()` 方法。\n\n\
  点击此处查看代码图像\n\n```dart\nrarelyUsed.loadLibrary().then(onLoad);\n```\n\n其中 `onLoad`\
  \ 定义为：\n\n点击此处查看代码图像\n\n```dart\nonLoad(loadSucceeded) => loadSucceeded ? doStuff()\
  \ : makeExcuses();\n```\n\n对 `loadLibrary()` 的调用是异步的。它启动了库的加载，但立即返回，而不是等待加载完成。`loadLibrary()`\
  \ 的结果是一个*future*（未来）——一个代表稍后可用值的占位符对象。Futures 将将在第 8 章](#part0016.html_08) 中详细描述。现在，我们需要知道的是\
  \ futures 支持一个 `then()` 方法，该方法接受一个函数值的参数。当 future 代表的值最终可用时，该函数将带有实际值被调用。\n\n在我们的案例中，`loadLibrary()`\
  \ 返回的 future 是布尔值的占位符，指示加载是否成功。在加载过程完成后（无论成功或失败），将调用函数 `onLoad()`。它的参数 `loadSucceeded`\
  \ 将被绑定到上述布尔值，告诉我们库是否已加载。然后我们恰当选择选择行动方案。例如，`doStuff()` 可以写为：\n\n点击此处查看代码图像\n\n```dart\n\
  doStuff(){ rarelyUsed.respondToMenuRequest();}\n```\n\n在知道它已加载之前，避免访问 `rarelyUsed`\
  \ 是关重要的。如果在加载完成之前尝试访问，将得到运行时错误。我们可能会选择只在 `doStuff()` 内部引用 `rarelyUsed`，从而减少过早访问的风险。我们仍然面临\
  \ `doStuff()` 可能在 `rarelyUsed` 加载之前在其他地方被调用的风险。\n\n### 3.9 相关工作 (Related Work)\n\
  \n\n\n\nDart 的导入（imports）是常规的，不同之处在于它们依赖于 URI 而不是像大多数旧语言那样的内置标识符。导入的传统优缺点也适用于 Dart。例如，在同一个地址空间内，无法将同一个库绑定到不同依赖项的多个拷贝。Dart\
  \ 对隔离（isolates）的支持可能在某种程度上缓解这个问题。另一方面，导入是具体的，并且被大多数程序员所理解。\n\n钻石导入（Diamond import）与钻石继承问题有关，但又与之不同（[10],\
  \ [11]）。\n\nDart 处理隐私性的方法是原创的。它偏离了在 C++、Java 和 C# 中常见的基于类的私有传统。它也与 Smalltalk 的基于对象的私有模型，以及基于抽象数据类型（ADTs）的私有模型（如用于\
  \ CLU、Ada、Modula 和 Oberon 等语言）不同。\n\n这种方法是务实的。它能很好地处理多个类之间的交互，而不需要类型系统。在缺乏强制性静态类型系统的情况下，基于类的封装需要昂贵的动态检查，因此动态类型对象语言倾向于基于对象的封装，或将所有内容设为公共。前者被认为过于过于严苛，而后者不适用于一种为严肃的软件工程设计的语言。\n\
  \n命名空间组合符 `show` 和 `hide` 遵循了长期传统。示例包括 [12] 中的模块组合符、对特征（traits）的操作（[13]）、Racket\
  \ 中对单元（units）的操作（[14]），以及无疑还有其他示例。\n\n### 3.10 总结\n\nDart 程序由库（libraries）组成。库聚合了类/类型、函数和变量。Dart\
  \ 库是隐私单元而非安全单元。\n\nDart 程序的执行始终从其脚本的 `main()` 函数开始。库可以拆分为多个部分。Dart 库通过导入连接到它们的依赖项，并通过调用命名空间组合符和使用前缀区分不同的导入，从而选择地从其他库导入名称。库还可以重新导出其他库或其子集，再次利用了命名空间组合符。库的加载可以在运行时推迟，以提高启动时间和/或减少内存占用。\n\
  \n# 第 4 章 函数\n\n函数是 Dart 的工作主体。实际进行计算的是函数。我们松散地使用 `functions` 一术语来涵盖所有语法形式的函数和方法，无论它们的行为是否像数学函数。\n\
  \nDart 中的函数是一等类值，可以存储在变量中、作为参数传递并作为结果返回。像 Dart 中所有的运行时值一样，函数也是对象。\n\n我们已经遇到过各种函数：顶层函数、实例方法和类方法（无论它们是\
  \ getter、setter、运算符还是普通方法）以及构造函数。正如我们将看到的，还有局部函数和函数字面量（function literals）。它们都共享一个共同结构，我们在此进行说明。\n\
  \n### 4.1 参数\n\n函数始终有一个`形式参数`（`formal parameters`）列表，尽管参数列表可能是空的，且对于 getter 方法它会被省略。参数要么是位置的（`positional`），要么是名的（`named`）。\n\
  \n#### 4.1.1 位置参数\n\n参数可以是必需的（`required`）或可选的（`optional`）。以下是带有必需参数的函数：\n\n点击此处查看代码图像\n\
  \n```dart\nzero() => 0; // 一个没有参数的函数；技术上，它有 0 个参数\n\nget zero => 0; // 同一内容的另一个版本\n\
  \nid(x) => x; // 恒等函数\n\nidentity(x) { return x;} // 一个更详细的恒等函数\n\nadd(a, b) =>\
  \ a + b; // 一个带有两个必需参数的函数\n```\n\n可选参数必须一起列在参数列表末尾方括号内。任何必需参数必须在可选参数之前。可选参数可以赋予默认值，这些值必须是编译时常量。\n\
  \n点击此处查看代码图像\n\n```dart\nincrement(x, [step = 1]) => x + step; // step 是可选的，默认值为\
  \ 1\n```\n\n我们可以用一个或两个参数调用 `increment()`。\n\n点击此处查看代码图像\n\n```dart\nincrement(1);\
  \ // 结果为 2\n\nincrement(2, 4); // 结果为 6\n\nincrement(); // 运行时错误\n\nincrement(2,\
  \ 3, 4); // 运行时错误\n```\n\n第一次调用将 `x` 绑定到 `1`；由于没有提供第二个参数，`step` 被绑定到默认值 1，产生 `1\
  \ + 1 = 2`。第二次调用显然产生 `2 + 4 = 6`。第三次调用在执行时抛出 `NoSuchMethodError`。尽管我们在作用域内有一个名为\
  \ `increment` 的函数，但我们并没有一个接受零参数的函数，因此抛出了异常。最后一次调用的情况类似；没有接受三个参数的 `increment()` 版本。\n\
  \n#### 4.1.2 命名参数\n\n参数可以是位置的，也可以是名的。我们已经看到了许多位置参数的示例。命名参数在编程语言中并不常见，这就是为什么我们一直推迟直到现在引入它们。命名参数声明在任何位置参数之后，位于大括号之间。\n\
  \n这里有一个完全依赖命名参数的示例：\n\n点击此处查看代码图像\n\n```dart\naddressLetter({name: '', street: '',\
  \ number, city, zip, country}) {\n  var addr = Address();\n  addr.street = street;\n\
  \  addr.number = number;\n  addr.city = city;\n  addr.zip = zip;\n  addr.country\
  \ = country;\n  return addr;\n}\n\naddressLetter(street: \"Downing\", number: 10);\n\
  \naddressLetter(street: \"Wall\", city: \"New York\", country: \"USA\");\n\naddressLetter(city:\
  \ \"Paris\", country: \"France\");\n\naddressLetter(name: \"Alice\", country: \"\
  Wonderland\");\n\naddressLetter();\n\naddressLetter(name: \"room\", number: 101,\
  \ country: \"Oceania\");\n```\n\n代码所示，可以使用命名参数的组合调用 `addressLetter()`——包括全部或都不。\n\
  \n以下示例展示了必需参数和命名参数混合的情况。\n\n点击此处查看代码图像\n\n```dart\nvar map = Map();\n\nfail() =>\
  \ throw('Key not found');\n\nlookup(key, {ifMissing: fail}) {\n  var result = map[key];\n\
  \  if (result == null) {return ifMissing();}\n  return result;\n}\n```\n\n通常，回调函数（例如错误处理器）通过命名参数指定，而其他形式参数通过位置形式给出。\n\
  \n点击此处查看代码图像\n\n```dart\nvar map = Map();\n\nlookup(\"anything\"); // 抛出\n\nlookup(\"\
  anything\", ifMissing: () => map[\"anything\"] = 42); // 42\n```\n\n如果我们想提供更好的错误信息，我们可能会这样写：\n\
  \n点击此处查看代码图像\n\n```dart\nvar map = Map();\n\nlookup(key, {ifMissing}) {\n  var result\
  \ = map[key];\n  if (result != null) {return result;}\n  return ifMissing == null?\
  \ throw '$key not found' : ifMissing();\n}\n```\n\n在这种变体中，我们利用了事实：如果为可选参数指定默认值，它将默认为\
  \ `null`。\n\n命名参数总是可选的。换句话说，参数作为必需/可选的分类与它们作为位置/命名的分类不是正交的。你不能将可选位置参数与命名参数混合——你要么使用其中一种。\n\
  \n形式参数不是 `final`。它们可以像任何其他变量一样被修改；但从良好的风格角度来看应该避免这样做。应该尽量减少可变变量的使用；修改会让代码更难以理解和推理。\n\
  \n\n\n\n函数有一个体，其中包含在执行执行时要评估的代码。体紧跟在签名之后，可以是我们见过的两种形式之一：\n\n1. 用大括号括起来的语句列表（可能为空）。\n\
  2. 紧跟令牌 `=>` 后的单个表达式。\n\n在第一种形式中，执行从体中的第一条语句开始，直到发生以下情况之一为止：函数的最后一条语句已成功执行、执行了 `return`\
  \ 语句，或者抛出了在函数内部未被捕获的异常。\n\nDart 中的每个函数要么返回一个值，要么抛出一个异常。\n\n如果我们完成了最后一条语句且它不是 `return`，则我们从函数返回\
  \ `null`。例如\n\n点击此处查看代码图片\n\n```dart\nsideEffect(){\n  print(\"I don't have a return\
  \ and I don't throw an exception\");\n  print(\"What is my value?\");\n}\n\nsideEffect();\
  \ // 打印然后求值为 null\n```\n\n构造函数是用于创建类实例的特殊函数。构造函数包括工厂函数（factories，被赋予特殊角色的普通函数）和生成构造函数（generative\
  \ constructors）。生成构造函数的不同之处在于它们总是返回一个新实例或抛出一个异常。因此，生成构造函数在没有显式 `return` 语句的情况下不会返回\
  \ `null`。事实上，生成构造函数不能返回任意表达式。只有当该语句没有关联表达式时，它才可以包含 `return` 语句。\n\n### 4.3 函数声明\n\
  \n我们目前为止看到的大函数都是通过函数声明引入的。例外是构造函数、getter（访问器）和 setter（赋值）。函数声明有一个名称，后面跟着参数列表和体。\n\
  \n抽象方法包含函数签名，但不提供体。从技术上讲，抽象方法不是函数声明。它们仅作为声明，帮助引导静态分析器。\n\n函数声明可以出现在顶层（例如 `main()`）或作为方法，我们已经遇到过许多示例。然而，函数也可以是*本地函数*。本地函数是嵌套在其他函数内部的定义。\n\
  \n简单的示例——在计算斐波那契序列时定义一个嵌套的辅助函数：\n\n点击此处查看代码图片\n\n```dart\nfib(n) {\n  lastTwo(n)\
  \ {\n    if (n < 1) { return [0, 1]; }\n    else {\n      var p = lastTwo(n-1);\n\
  \      return [p[1], p[0]+p[1]];\n    }\n  }\n  return lastTwo(n)[1];\n}\n```\n\n\
  这不是计算 *n* 个斐波那契数的最佳方法，但它避免了朴素递归版本的浪费。由于 `lastTwo()` 只是 `fib()` 的实现细节，最好将 `lastTwo()`\
  \ 嵌套在 `fib()` 内部，避免用额外的函数名污染周围的命名空间。\n\n### 4.4 闭包\n\n函数可以内联定义表达式的一部分。这些被称为*函数字面量*（function\
  \ literals），或者更泛称为*闭包*（closures）。与函数声明不同，闭包是没有命名的。然而，它们和任何其他函数一样，拥有参数列表和体。\n\n点击此处查看代码图片\n\
  \n```dart\n(x) => x; // 又一个恒等函数\n\n(x) {return x;} // 另一个\n\n(x, [step = 1]) =>\
  \ x + step; // 一个带有可选参数的闭包\n\n(a, b) => a + b; // 一个带有两个必需参数的闭包\n```\n\n孤看这些示例，可能无法立即看出闭包有多用。它们看起来完全就是没有命名的函数声明。真正的好处在于将它们作为更大表达式的一部分使用。\n\
  \n考虑对列表元素求和的问题。人们确实写一个 `for` 循环来完成，但这是一种相当原始的方法。精通 Dart 的程序员会写成：\n\n点击此处查看代码图片\n\
  \n```dart\nsum(nums) => nums.reduce( (a, b) => a + b);\n```\n\n`reduce()` 方法为 Dart\
  \ 中的列表以及许多其他类型进行了定义。任何实现 `Iterable` 的类型都应该有一个可用的 `reduce()` 方法。该方法接受一个二元函数作为参数，我们称之为\
  \ `combiner`（合并器）。调用时，`reduce` 遍历其接收者。处理从取前两个元素并将它们传递给 `combiner` 开始。在后续每次迭代中，上一次调用\
  \ `combiner` 的结果将作为第一个参数传递给新的 `combiner` 调用，同时传入接收者的下一个元素。如果 `combiner()` 相加它的参数，效果就是加上接收者的前两个元素，然后将结果加到第三个元素，依此类推，产生和。\n\
  \n我们当然可以在不使用闭包的情况下写 sum：\n\n```dart\nsum(nums) { // 坏风格\n  plus(a,b) => a + b;\n\
  \  nums.reduce(plus);\n}\n```\n\n这稍微冗长，并且要求我们为加法函数命名。在加法的情况下，名称是显而易见的，但在如下示例中，声明并命名一个函数变得越来越繁琐：\n\
  \n点击此处查看代码图片\n\n```dart\ncountry.cities.where((city) => city.population > 10000);\n\
  ```\n\n这显然找到了 `country` 中所有人口超过百万的城市。此片段使用了 `where()` 方法，这是 `Iterable` 的另一个接受函数参数的方法。在这种情况下，参数必须是一个一元谓词，`where()`\
  \ 将返回符合条件的元素。\n\n### 4.5 调用方法和函数\n\n函数可以通过标准方式调用，即在函数后带有括号参数列表，例如 `print('Hello\
  \ new world')`。\n\n某些函数被称为 getter，不需要参数列表即可调用：\n\n```dart\ntrue.runtimeType\n```\n\
  \n正如我们讨论过的，getter 和 setter 的统一使用我们提供了表示无关性。然而应该注意，与许多支持表示无关性的语言不同，Dart 并没有完全遵循*统一引用*。在\
  \ Dart 中，人们并不通过统一语法引用方法和字段。虽然 getter 和字段被视为相同以确保了表示无关性，但 getter 和方法的访问方式不同。因此，Dart\
  \ 程序员需要注意函数是声明为 getter 还是无参方法。setter 也是如此。\n\n#### 4.5.1 级联\n\n除了使用点运算符选择成员外，Dart\
  \ 还支持双点运算符*方法级联*（method cascades）。当我们对给定的对象执行一系列操作时，级联是非常有用的。\n\n级联的评估方式与普通方法调用相似，不同之处在于它求值不是方法的返回值，而是返回方法的接收者。\n\
  \n点击此处查看代码图片\n\n```dart\n\"Hello\".length.toString(); // 求值为 '5'\n\"Hello\"..length.toString();\
  \ // 求值为 \"Hello\"\n```\n\n因此，而不是：\n\n点击此处查看代码图片\n\n```dart\nvar address = new Address.of(\"\
  Freddy Krueger\");\naddress.setStreet(\"Elm\", \"13a\");\naddress.city = \"Carthage\"\
  ;\naddress.state = \"Eurasia\";\naddress.zipCode(66666, extend: 66666);\naddress;\n\
  ```\n\n我们可以写一个单一表达式：\n\n点击此处查看代码图片\n\n```dart\nnew Address.of(\"Freddy Krueger\"\
  )\n  ..setStreet(\"Elm\", \"13a\")\n  ..city = \"Carthage\"\n  ..state = \"Eurasia\"\
  \n  ..zipCode(66666, extend: 66666);\n```\n\n\n\n\n级联（Cascades）的作用不仅仅是节省几次击键。它们允许在无需预规划的情况下创建流畅的\
  \ API。在没有级联的情况下，方法必须设计为始终返回接收者（receiver），以便进行链式调用。通过级联，我们可以在不依赖 API 中单个方法返回值的情况下，实现与链式调用相同的效果。\n\
  \n仔细格式化级联，以确保代码具有可读性。不应滥用级联语法，例如在单行内放置系列级联或进行过度嵌套。\n\n在处理所谓的构建器 API（builder APIs）时，级联非常有用。在这种\
  \ API 中，描述符是分步创建的，但被描述的对象在构建过程结束时一次性创建。\n\n级联的另一个用途是：当我们想要调用对象上的某个方法并获取原始目标，但该方法返回了其他结果。如果我们写\n\
  \n点击此处查看代码图像\n\n```\nvar sortedColors = ['red', 'green', 'blue', 'orange', 'pink'].sublist(1,\
  \ 3).sort();\n```\n\n我们会发现 `sortedColors` 是 `null`，因为 `sort()` 是 `void` 类型。我们可以重新排列代码\n\
  \n点击此处查看代码图像\n\n```\nvar colors = ['red', 'green', 'blue', 'orange', 'pink'].sublist(1,\
  \ 3);\n\ncolors.sort();\n```\n\n但直接使用级联要优雅得多\n\n点击此处查看代码图像\n\n```\nvar sortedColors\
  \ = ['red', 'green', 'blue', 'orange', 'pink'].sublist(1, 3)..sort();\n```\n\n####\
  \ 4.5.2 赋值\n\n这可能并不明显，但 Dart 中的赋值通常是函数调用，因为对字段的赋值是调用 setter 方法的语法糖。\n\n像 `v = e`\
  \ 这样的赋值的精确含义取决于 `v` 的声明。如果 `v` 是局部变量或参数，它只是一个旧式的赋值。否则，该赋值是调用名为 `v=` 的 setter 方法的语法糖。\n\
  \n赋值是否有效取决于 setter `v` 是否定义，或者变量 `v` 是否为 `final`。`final` 变量不能重新赋值，且不会产生 setter。\n\
  \n复合赋值（如 `i += 2`）根据普通赋值定义。更多信息请参见第 6.1.6 节。\n\n#### 4.5.3 使用运算符\n\nDart 支持自定义运算符，例如我们为\
  \ `Point` 定义的 `+` 运算符。Dart 中用户定义的运算符实际上是实例方法，在被用时使用特殊的名称并具有特殊的语法。此类方法的声明必须带有内置标识符\
  \ `operator` 前缀。\n\n除了语法之外，所有适用于实例方法的规则也都适用于运算符。允许的运算符集合是：`<`, `>`, `<=`, `>=`,\
  \ `==`, `-`, `+`, `/`, `~/`, `*`, `%`, `|`, `^`, `&`, `<<`, `>>`, `[]=`, `[]`, `~`。\n\
  \n此外，还有许多固定运算符是程序员无法定义的。这些是 `&&`、`||` 以及增/减运算符 `++` 和 `--`（包括前置和后置）。\n\n赋值在这些目的并不被视为运算符，尽管复合赋值在语义上依赖于运算符。\n\
  \n恒等性（Identity）在 Dart 中也不是运算符。相反，Dart 提供了预定义的函数 `identical()`。\n\n运算符的优先级规则是固定的，并遵循既定约定。它们的元数（arity）也是如此。大多数运算符是二元的。显著的异常是一元负和\
  \ `[]=`。后者用于类似于向数组或映射（或任何索引集合）赋值的情况，需要两个参数：索引和一个新值。`-` 的情况比较特殊，因为我们同时支持二元减和一元减操作。\n\
  \n### 4.6 函数类\n\n`Function` 是一个抽象类，作为所有函数的通用超接口。`Function` 没有声明任何实例方法。但它声明了类方法 `apply()`，该方法接收一个函数和一个参数列表，并使用提供的参数调用该命名函数。\n\
  \n`apply()` 的签名如下：\n\n点击此处查看代码图像\n\n```\nstatic apply(Function function,\n  List\
  \ positionalArguments,\n  [Map<Symbol, dynamic> namedArguments]\n);\n```\n\n你会注意到\
  \ `apply()` 的形式参数带有类型注解。它要求一个要调用的函数和一个位置参数列表（可以是空的）。命名参数可以通过一个从名称到实际参数的映射（map）提供，这些参数可以是任何类型的对象。最后一个参数是可选的。大多数函数不接受任何命名参数，因此如果它们不需要提供这些参数，会很方便。\n\
  \n`apply()` 方法提供了一种使用动态确定参数列表调用函数的机制。通过这种方式，我们可以处理在编译时未知其元数的参数列表。\n\n#### 4.6.1\
  \ 模拟函数\n\n如前所述，面向对象编程的一个核心原则是：重要的是对象的行为 own 它的来源。理想情况下，任何对象都应该模拟任何其他对象。例如，`Proxy`\
  \ 实例设计用于模拟任意对象的行为。由于函数也是对象，我们也应该能够模拟它们的行为。如何通过 `Proxy` 模拟函数？函数最常见且重要的行为是被调用时的行为，但调用是一个内置操作。我们想要写\n\
  \n点击此处查看代码图像\n\n```\nvar p = new Proxy((x) => x*2);\np(1); // 我们想要 2\n```\n\n幸运的是，上面的代码按预期工作，尽管我们为止讨论的内容无法解释这一点。结果函数应用转换为名为\
  \ `call()` 的特殊方法的调用。在示例中，`p(1)` 实际上是 `p.call(1)`。当然，我们不能将 `p.call(1)` 视为 `p.call.call(1)`，否则会无限递归。\n\
  \n由于 `Proxy` 没有 `call` 方法，将调用 `noSuchMethod()`转发给代理的目标，目标是一个函数，拥有自己的 `call()` 方法。\n\
  \n任何声明 `call()` 方法的类都被认为隐含实现了 `Function`。\n\n注意，`Function` 没有声明 `call()` 方法。原因是没有特定的签名可以被声明：`call()`\
  \ 可以有不同的元数，并且可能具有或没有可选参数（无论是位置还是命名的）以及不同的默认值。因此，`Function` 中确实没有可以列出的通用 `call()`\
  \ 声明。相反，语言对 `call()` 方法进行了特殊。\n\n### 4.7 作为对象的函数\n\nDart 是一门纯面向对象的语言，因此 Dart 中的所有运行时值都是对象，包括函数。除了上一节描述的\
  \ `call()` 方法外，函数支持 `Object` 中声明的方法。\n\n在大多数情况下，函数原封地继承 `Object` 的方法。在实现 `toString()`\
  \ 方法方面，函数具有一定的自由度。它们通常会产生函数的合理描述，其中可能包含其签名。\n\n由于 `==` 和 `hashCode` 的实现通常是继承的，两个函数只有在它们完全相同时才被认为是相等的。这样做非常困难，因为函数之间通用的语义相等概念是不可判定的。\n\
  \n我们如何知道两个函数是相同的？让我们来看一些例子。\n\n```\ncomputeIdentityFunction() {\n  return (x) =>\
  \ x;\n}\n```\n\n\n\n\n我们是否可以假设两次调用 `computeIdentityFunction()` 会产生相同的结果？答案是否定的。虽然这种情况看起来“显而易见”该函数是同一个，但实际上，每次求值函数表达式时都可能分配一个不同的函数对象。同样，局部函数声明会在包含它的每个动态作用域中引入一个新的对象。例如，考虑下面代码中的局部函数\
  \ `increment`。\n\n```dart\nmakeCounter() {\n  var counter = 0;\n  increment() =>\
  \ ++counter;\n  return increment;\n}\n```\n\n每次调用 `makeCounter()` 都会返回不同的 `increment`\
  \ 函数。在这种情况下，很显然我们不想要同一个函数对象，因为每个对象都绑定到不同的计数器变量上。\n\n顶层或静态函数声明可以命名，且该名称始终表示同一个对象。\n\
  \n然而，在某些情况下我们可以做得更好。Dart 特殊处理通过属性提取派生的闭包。如果（并且仅当！）两个表达式 `o[1]` 和 `o[2]` 求值结果为同一个对象（即\
  \ `o[1]` 和 `o[2]` 是恒等的的），那么 Dart 将确保对于给定的标识符 `m`，如果 `o[1].m` 是法的，那么 `o[1].m == o[2].m`。\n\
  \n作为一个示例，考虑向 DOM 注册监听器函数的典型 UI 代码。我们希望在注册一个函数后能够取消注册该函数。如果我们注册一个普通闭包作为监听器：\n\n点击此处查看代码图像\n\
  \n```dart\nmyElement.onClick.listen((event) => listener(event));\n```\n\n我们稍后无法通过如下调用来取消注册它：\n\
  \n点击此处查看代码图像\n\n```dart\nmyElement.removeEventListener('onClick', (event) => listener(event));\n\
  ```\n\n因为我们传递给 `removeEventListener()` 的闭包与我们注册的不是同一个。尽管它们看起来一样，但每个都是一个不同的对象，而且没有通用的方法可以判断两个不同的函数对象是否相等。我们必须存储监听器，以便稍后使用它来取消注册。然而，使用属性提取\n\
  \n点击此处查看代码图像\n\n```dart\nmyElement.onClick.listen(myObject.listener);\n```\n\n取消注册就能按预期工作\n\
  \n点击此处查看代码图像\n\n```dart\nmyElement.removeEventListener('onClick', myObject.listener);\n\
  ```\n\n`noSuchMethod()` 的实现继承自 `Object`，`runtimeType` 也是如此。Dart 运行时可以使用各种类来表示函数。所有这些类都会实现\
  \ `Function`，但人们无法可靠地期望不同函数的运行时类型之间保持相等性或标识性。\n\n点击此处查看代码图像\n\n```dart\nf(x) { return\
  \ (x) => x;}\n\ng() {\n  h() => 42;\n  h.runtimeType is Function; // true\n  h.runtimeType\
  \ == (() => 42).runtimeType; // 不要指望这个为真\n  g.runtimeType == h.runtimeType; // 或者这个\n\
  \  (() => 42).runtimeType == (() => 42).runtimeType; // 甚至是这个！\n}\n\nmain(){\n \
  \ f.runtimeType is Function; // true\n  f(3).runtimeType is Function; // true\n\
  \  g.runtimeType is Function; // true\n  f(2).runtimeType == f.runtimeType; // 可能为，也可能不是\n\
  \  f.runtimeType == g.runtimeType; // 不可能，因为参数个数不同，但不做保证\n}\n```\n\n如上面的代码所示，无法确定任何两个函数的运行时类型是否相同。我们可以依赖的是它们都实现了\
  \ `Function`。当然，相等的函数具有相等的运行时类型。\n\n点击此处查看代码图像\n\n```dart\nf(x) { return (x) =>\
  \ x;}\n\ng() {\n  h() => 42;\n  h.runtimeType == h.runtimeType; // true\n  var x\
  \ = (() => 42);\n  x.runtimeType == x.runtimeType; // true\n}\n\nmain(){\n  f.runtimeType\
  \ == f.runtimeType; // true\n  g.runtimeType == g.runtimeType; // true\n}\n```\n\
  \n### 4.8 生成器函数\n\nDart 支持生成器，生成器是用于在集合中值的函数。生成器可以是同步的也可以是异步的。同步生成器为产生迭代器提供了语法糖\
  \ (4.8.1)，而异步生成器对流执行相同的操作 (8.3)。\n\n在这里我们将重点关注同步生成器。我们将对异步生成器的讨论 (8.6.2) 推迟到 第 8\
  \ 章。\n\n#### 4.8.1 迭代器与可迭代对象\n\n迭代器是允许遍历集合的对象。迭代器和可迭代对象的接口分别由 `Iterator` 和 `Iterable`\
  \ 类进行规范。为了产生一个迭代器，必须定义一个带有 `moveNext()` 方法的迭代器类。作为一个示例，这里是打印到 20 的自然数的方法：\n\n点击此处查看代码图像\n\
  \n```dart\nclass NaturalsIterable {\n  var n;\n  NaturalsIterable.to(this.n);\n\
  \  get iterator => new NaturalIterator(n);\n}\n\nclass NaturalIterator {\n  var\
  \ n;\n  var current = -1;\n  NaturalIterator(this.n);\n  moveNext() {\n    if (current\
  \ < n) {\n      current++;\n      return true;\n    }\n    return false;\n  }\n\
  }\n\nnaturalsTo(n) => new NaturalsIterable()(n);\n\nmain() {\n  for (var i in naturalsTo(20))\
  \ {print(i);}\n```\n\n实际上，一个良好的示例会实现完整的 `Iterable` 接口。\n\n#### 4.8.2 同步生成器\n\n为了减少迭代器产生的样板代码，Dart\
  \ 支持同步生成器函数。我们可以通过在函数体上标记 `sync*` 修饰符来定义同步生成器函数：\n\n```dart\nnaturTo(n) sync* {\n\
  \  var k = 0;\n  while (k < n) yield k++;\n}\n```\n\n当调用时，该函数立即返回一个 `Iterable` `i`，可以通过它可以一个迭代器\
  \ `j`。当有人第一次调用 `j` 的 `moveNext()` 时，函数体开始执行。进入循环后，`yield` 语句执行，导致 *k* 增加，并将 *k*\
  \ 的先前值添加到 *i* 并挂起 `naturTo()` 的执行。下次调用 `moveNext()` 时，`naturTo()` 的执行从 `yield` 之后恢复并重复循环。\n\
  \n实现这个特定示例有更好的方法；当序列的元素基于自然数计算时，有一个方便的构造函数 `Iterable.generate()`，它接收一个整数 *n* 和一个函数\
  \ *f*，并产生表示序列 *f*(0) . . . *f*(*n* – 1) 的可迭代对象：\n\n点击此处查看代码图像\n\n```dart\nnaturalsTo(n)\
  \ => new Iterable.generate(n, (x) => x);\n```\n\n然而，我们示例的目的是展示在泛用情况下定义迭代器时所需的所有机械结构，以及\
  \ `sync*` 方法如何简化这些机械结构。\n\n\n\n\n\n## 2\n\n在某些情况下， `return` 可能不会导致终止，因为 `finally`\
  \ 子句 (6.2.4) 改变了控制流。\n\n对于任何正在返回值的处理没有任何疑问。在生成器（generator）中不能让 `return` 语句返回值；这样的语句会被编译器标记为错误。允许这样的语句是没有意义的，因为值已经返回给了调用者，而调用者已经完成了处理并从调用栈中消失了。\n\
  \n尽管函数在向调用者返回结果后仍在运行，但函数体与结果相关并与之交互。在同步生成器中，结果始终是一个可迭代对象。生成器始终与该可迭代对象以及派自它的迭代器关联。\n\
  \n同步生成器内部的 `yield` 语句向其关联的可迭代对象添加对象，然后如上所示挂起执行体。调用 `moveNext()` 执行体。当 `yield` 挂起执行体时，\
  \ `moveNext()` 向调用者返回 `true`。当生成器终止时，`moveNext()` 返回 `false`。\n\n### 4.9 相关工作\n\n\
  函数作为一等值在编程语言中有着悠久而辉煌的历史。探索函数式语言的世界（它们使用此类函数值作为基础构建模块）远超本书的范畴。\n\n将函数视为对象的概念可以追溯到\
  \ Smalltalk[1]，它的块（blocks）是 Dart 闭包的前身。Smalltalk 块最初受到各种限制，这些限制在现代方言中已被移除。\n\nDart\
  \ 函数与其 Smalltalk 语言族祖先之间的关键区别在于闭包内部 `return` 的行为。Smalltalk 支持*非局部返回*（non-local returns），这意味着在闭包内执行的\
  \ `return` 会退出周围的方法，返回到该方法的调用者。因此，可以将控制结构定义为接受函数参数的库函数。这在 Dart 中是不可能的。由于底层 Web 平台的实现局限性，Dart\
  \ 决定避免非局部返回，这是一个遗憾的决定。更多细节请参见 6.2.8。\n\n值得注意的是，Scala[15] 也支持非局部返回。\n\n### 4.10 总结\n\
  \nDart 函数像 Dart 中其他运行时值一样都是对象。Dart 函数可以声明为接受位置参数或命名参数。位置参数可以是必需的或可选的。命名参数始终是可选的。\n\
  \n函数始终是词法作用域的，并捕获其环境。然而，由于 `return` 的语义，Dart 函数不适合实现用户定义的控制结构。\n\nDart 函数既可以作为类的方法支持，也可以作为独立结构支持。方法可以与实例关联（实例方法），或与类关联（类方法）。独立函数可以在库级别声明（顶层函数）、在其他函数内部作为局部函数，或通过字面量表达式进行声明。\n\
  \n所有内置运算符也是函数，其中大多数被定义为实例方法，并可以由程序员对其进行重写。用户定义的类可以通过实现特殊方法 `call` 来定义为表现得像内置函数类型。所有的\
  \ Dart 函数都被视为 `Function` 类型的成员。\n\n## 第 5 章。类型\n\n到目前，我们还没有对类型进行任何详细讨论。我们之所以能够将讨论推迟到现在，是因为\
  \ Dart 是可选类型的。在本章中，我们将描述 Dart 的类型，填补我们目前所述故事中的许多空白。我们首先开始解释可选类型（optional typing），这可能是\
  \ Dart 最不寻常的特征。\n\n### 5.1 可选类型\n\n如引所述，一种语言是可选类型的，当且仅当：\n\n- 类型在语法上是可选的。\n- 类型对运行时语义没有影响。\n\
  \n后一点比前一点重要得多。习惯了传统静态类型语言的人起初可能会对此感到困惑。这一点微妙但至关重要。它是 Dart 设计的基石。\n\n首先，Dart 可以用作动态类型语言是至关重要的；任何可以在此类语言中编写的程序都应该能够在\
  \ Dart 中表达。我们期望代码随着时间的推移而演进，获得类型注解。如果类型注解改变了 Dart 程序的行为，那么当向程序中添加类型注解时，运行良好的程序很可能会停止按预期运行。这会降低人们使用类型注解的意愿，因为程序员会担心运行良好的代码会发生故障。\n\
  \n此外，Dart 程序通常会包含带类型的部分和不带类型的部分。这意味着人们不能假设类型安全，也不能假设类型注解实际上是正确的。在这种情况下，允许类型注解具有语义意义可能会导致混乱和不稳定。\n\
  \n作为运行时行为取决于类型的语言特征示例，考虑基于类型的方法重载（type-based method overloading）。重载是静态类型面向对象语言的常见特性。在这样的语言中，人们可能会写出\n\
  \n点击此处查看代码图像\n\n```dart\nclass NotLegalDart {\n  overloaded(List l)=> l.length;\n\
  \  overloaded(num n) => n*2;\n}\n```\n\n并期望调用根据参数的类型进行解析\n\n点击此处查看代码图像\n\n```dart\n\
  int x = 3;\n\nnew NotLegalDart().overloaded(x); // 假设为 6\n\nList l = [];\n\nnew\
  \ NotLegalDart().overloaded(l); // 假设为 0\n```\n\n现在，我们该如何处理\n\n点击此处查看代码图像\n\n```dart\n\
  var x = 3;\n\nnew NotLegalDart().overloaded(x); // 假设为 ?\n\nvar l = [];\n\nnew NotLegalDart().overloaded(l);\
  \ // 假设为 ??\n\n```\n\n我们根据什么基础来实现 `overloaded`？可能的，这将是一个错误，迫使用户指定类型。(1)。有些人可能会认为，在选择方法时应该考虑参数的动态类型。这种被称为*多方法*（multi-methods）的机制有其自身超出本讨论范围的问题。\n\
  \n进一步想象，假设我们为 `overloaded` 添加了一个“通捕型”变体\n\n```dart\nclass NotLegalDart {\n  ...\
  \ 如前所示\n  overloaded(x) => x;\n}\n```\n\n在这种情况下，我们的第二组调用将解析到通捕版本，但如果我们决定为变量标注类型，行为就会因为我们在调用处对代码进行了记录而发生改变。\n\
  \n基于类型的重载即使在完全静态类型的情况下也是一个问题特征。由于类型不影响 Dart 的语义，该语言不支持基于类型的重载。因此，我们展示的所有示例即使给它们装饰了类型注解，在生产环境中行为也始终保持相同。\n\
  \n作为另一个示例，考虑\n\n点击此处查看代码图像\n\n```dart\nclass LazyFields{\n  var _x;\n  get x =>\
  \ _x == null? _x = complicatedFunction() : _x;\n}\n```\n\n在这里我们有一个常见的实例变量延迟初始化场景。现在假设我们指定了\
  \ `_x` 的类型：\n\n点击此处查看代码图像\n\n```dart\nclass LazyFields {\n  int _x;\n  get x =>\
  \ _x == null? _x = complicatedFunction() : _x;\n}\n```\n\n在许多语言中，类型会影响其默认值。通常会将整数变量初始化为\
  \ 0。不幸的是，在这种情况下代码将停止工作。由于这些问题，Dart 遵循类型注解没有语义影响的原则。\n\n\n\n\n\n### 5.2 类型概览\n\n\
  Dart 变量可能关联有类型。类型也可以用于指示方法的返回类型。例如：\n\n点击此处查看代码图片\n\n```dart\nint sum(int a, int\
  \ b) => a + b;\n\nvoid main(){ print(sum(3,4));} // 输出 7\n```\n\n当然，我们可以编写不带类型的代码，正如我们在前面的章节中反复看到的那样。这里是与上面非常相似的代码，区别在于缺少了类型注解：\n\
  \n点击此处查看代码图片\n\n```dart\nsum(a, b) => a + b;\n\nmain(){ print(sum(3,4));} // 输出\
  \ 7\n```\n\n这两种变体的行为完全相同。人类读者可以受益于类型注解提供的文档说明，但运行时并不关心这些。\n\n开发工具（如交互式开发环境 IDE）可以以多种方式利用类型注解：它们可以对可能的不一致发出警告，可以通过显示对表达式潜在适的方法菜单（名称补全），或通过支持基于类型信息的自动化代码重构等来帮助程序员。\n\
  \n上面的简单示例没有包含错误，因此很容易看出两种变体的行为是相同的。假设我们稍微修改一下：\n\n点击此处查看代码图片\n\n```dart\nvar i;\n\
  \nvar j = 0;\n\nsum(a, b) => a + b;\n\nmain(){ print(sum(i, j));} // NoSuchMethodError\n\
  ```\n\n由于 `i` 没有初始化，它的值为 `null`。当我们执行 `sum` 时，我们最终在 `null` 上调用了 `+` 方法。由于 `+` 并没有由\
  \ `Null` 类（`null` 的类类型）定义，我们得到了一个 `NoSuchMethodError`。在某些语言中，你可能会得到空指针错误，但我们知道在\
  \ Dart 中，`null` 与所有值一样都是对象，因此它对诸如 `==` 等方法有响应。\n\n下面的类型化版本在运行时的行为完全相同。正如上面提到的，`i`\
  \ 被标记为 `int` 这一事实并没有改变它的初始化方式。\n\n点击此处查看代码图片\n\n```dart\nint i;\n\nint j = 0;\n\n\
  int sum(int a, int b) => a + b;\n\nmain(){ print(sum(i, j));} // NoSuchMethodError\n\
  ```\n\n代码失败了，尽管它在类型上是正确的。这在现实中非常常见。如果仅通过类型检查就能可靠地确保现实程序的正确性，那么真正的静态类型编程语言将具有巨大的经济优势，并且实际上将解决所有软件\
  \ Bug 的“银弹子弹”。\n\n我们最新的变体确实包含错误，但它是类型安全的。让我们来看一个不是类型安全的版本：\n\n点击此处查看代码图片\n\n```dart\n\
  int i;\n\nint j = 0;\n\nObject sum(Object a, Object b) => a + b; // 类型警告：a 没有方法\
  \ '+'\n\nmain(){ print(sum(3, 4));} // 输出 7\n```\n\n这个版本运行良好良好，就像我们的前两个变体一样。然而，类型警告是完全合理的。根据类型注解，像下面这样的调用\n\
  \n点击此处查看代码图片\n\n```dart\nsum(new Object(), []); // NoSuchMethodError\n```\n\n本应该是有意义的，但显然没有意义。`sum`\
  \ 的类型注解是错误的，但实际程序中的逻辑是正确的。由于类型注解无法影响语义，因此推导出你可以拥有错误的注解但仍然拥有一个有效的程序。\n\n`sum()` 上的类型注解并没有看起来那么荒谬。\n\
  \n点击此处查看代码图片\n\n```dart\nsum('ab', 'surd'); // 结果为 'absurd'\n```\n\n事实证明，`sum()`\
  \ 是适用于任意数量类型的很有用的函数。任何定义了 `+` 方法的东西都有意义。将参数标记为类型 `Object` 似乎是合适的，因为 `Object` 是所有这些不同类型的共同父类型。正如我们所看到的，事实并非如此。\n\
  \n在这种情况下，最佳做法是完全避免对 `sum()` 使用类型注解。这避免了极端的类型警告。如果程序中的变量没有显式给出类型，则变量的类型为 `dynamic`。`dynamic`\
  \ 类型是一种特殊类型，表示类型检查器不应该对变量上的操作或对变量的读写报错。\n\n相比之下，显式使用类型 `Object` 意味着我们确实期望任何对象都是变量的有效值。这两种情况看起来相似，但当我们对\
  \ `Object` 类型的表达式进行操作时，如果我们尝试使用并非所有对象都支持的方法，将会得到警告。相反，使用 `dynamic` 类型实际上完全静止了静态类型检查。它告诉类型检查器，我们相信自己知道自己在做什么。在许多不需要精确类型的情况下非常有用。\n\
  \n在 `sum()` 上显式使用 `dynamic` 往往是多余的。我们可以写：\n\n```dart\ndynamic sum(a, b) => a + b;\
  \ // 永远不要这样做\n```\ndynamic; // 永远这样做\n```\n\n然而，这种写法是多余且风格糟糕的。它没有向类型检查器传递任何信息。\n\
  \n```dart\nsum(a, b) => a + b; // 这样做得多\n```\n\n为了更好地理解类型及其用法，让我们回到老朋友 `Point`：\n\
  \n点击此处查看代码图片\n\n```dart\nclass Point {\n  num x, y;\n  Point(this.x, this.y);\n\
  \  Point scale(num factor) => new Point(x*factor, y*factor);\n  operator +(Point\
  \ p) => new Point(x + p.x, y + p.y);\n  static num distance(Point p1, Point p2)\
  \ {\n    num dx = p1.x - p2.x;\n    num dy = p1.y - p2.y;\n    return sqrt(dx*dx\
  \ + dy*dy);\n  }\n}\n```\n\n这个版本完全类型注解。注意我们将实例变量标记为 `num` 而不是 `int` 或 `double`。我们选择\
  \ `num` 是它是整数和浮点数的共同父类型，坐标适用于任意类型（甚至是混合类型）。\n\n你也可以看到初始化简写构造没有包含类型注解。参数的类型是从实例变量推导出的，因此没有需要重复。\n\
  \n### 5.3 接口类型\n\nDart 类型是接口类型。它们定义了对象上可用的方法。作为一般规则，它们没有告诉我们关于对象的任何信息。再次，这符合基本原则：重要的是对象的行为，而不是血缘。\n\
  \n令人惊讶的是，Dart 没有接口声明的语法。接口是通过类引入的。每个类都根据其成员引入一个隐式接口。需要传统接口声明的情况可以通过定义纯抽象类轻松处理。\n\
  \n任何类都可以实现接口，即使它与定义接口的类没有关系。这就是 Dart 不需要接口声明的原因。我们在第 2.7 节见过这样一个类，`Pair`。\n\n```dart\n\
  abstract class Pair {\n  get first;\n  get second;\n}\n```\n\n我们可以对 `Pair` 定义的接口声明实现\n\
  \n点击此处查看代码图片\n\n```dart\nclass ArrayPair implements Pair {\n  var _rep;\n  ArrayPair(a,\
  \ b) {\n    _rep = [a, b];\n  }\n  get first => _rep[0];\n  get second => _rep[1];\n\
  }\n```\n\n`ArrayPair` 类实现了 `Pair` 而不是其子类。`implements` 子句后面跟着类旨在实现的一个或多个接口名称。\n\n\
  类不会从 `implements` 子句中的接口中继承任何实现。在这个特定的示例中，没有可以继承的实现，但在许多情况下这种区别至关重要。\n\n\n\n\n\n\
  `implements` 子句的作用是在类与该子句列出的接口之间引发一种显式的子类型关系。这种子类型关系会影响 Dart 类型检查器的行为，也会影响运行时。\n\
  \n为了观察 `implements` 子句诱导的子类型关系的影响，让我们写一个处理对（pairs）的函数：\n\n点击此处查看代码图像\n\n```\nPair\
  \ reversePair(Pair p) => new ArrayPair(p.second, p.first);\n```\n\n我们可以如下所示使用 `reversePair()`：\n\
  \n点击此处查看代码图像\n\n```\nreversePair(new ArrayPair(3, 4)); // 一个新的 Pair，其中 first = 4，second\
  \ = 3\n```\n\nDart 类型检查器对这段代码完全满意。然而，如果我们省略了 `implements` 子句，类型检查器将不知道 `ArrayPair`\
  \ 是 `Pair` 的子类型。在这种情况下，它将对 `reversePair()` 的定义及其使用都报错。在 `reversePair()` 的定义处，它会警告我们返回的对象（类型为\
  \ `ArrayPair`）不是声明的返回类型 `Pair` 的子类型。调用处也会发出类似的通知，因为实际参数的类型是 `ArrayPair`，而形式参数的类型是\
  \ `Pair`。\n\n类型检查器会在对象从一个变量转移另一个变量的每个点执行此类检查。这些值的传递发生在：\n\n• 执行赋值操作。\n• 将实际参数传递给函数。\n\
  • 从函数返回结果。\n\n`implements` 子句中给出的每个接口都被视为该类的*直接超接口*（direct super-interface）。在我们的示例中，`Pair`\
  \ 是 `ArrayPair` 的直接超接口。此外，类的直接父类也被认为是该类的直接超接口之一。\n\n一个类型的完整*超接口*（superinterfaces）集合可以通过获取直接超接口集，并递归地计算和添加每个接口的超接口来计算。当集合中无法再添加新元素时，计算完成。\n\
  \n严格来说，类型检查器在检查值传递时并不强制执行超接口关系。它检查的是*可赋值性*（assignability）。可赋值性比子类型更宽松。如果两个类型在*任一方向*上是子类型，Dart\
  \ 就认为它们是可赋值的。也就是说，不仅 `ArrayPair` 可以赋值给 `Pair`（因为 `ArrayPair` 是 `Pair` 的子类型），`Pair`\
  \ 也可以赋值给 `ArrayPair`。后者可能会让你感到困惑。毕竟，`Pair` 可能有许多实现，而且它们通常不具备 `ArrayPair` 的所有成员。为了理解为什么\
  \ Dart 这样做，让我们来看另一个例子。\n\n点击此处查看代码图像\n\n```\nclass Monster {\n  // 许多怪异特征\n}\n\n\
  class Vampire extends Monster {\n  get bloodType => 'O';\n}\n\nMap<String, Monster>\
  \ monsters = {\n  'Frankenstein' : new Monster(),\n  'Godzilla' : new Monster(),\n\
  \  'Dracula' : new Vampire()\n}\n...\n\nVampire vamp = monsters['Dracula'];\n```\n\
  \n怪物映射 `monsters` 只保证包含 `Monster` 的实例。典型的类型检查器会抱怨上面最后行的查找结果是一个 `Monster`，它不是 `Vampire`\
  \ 的子类型。\n\n在实践中，当我们在怪物映射 `monsters` 中查找键 `'Dracula'` 时，我们知道将得到一个 `Vampire`。这种情况经常发生。使用传统的类型检查规则，将被迫使用强制类型转换（casts）。给程序员施加这样的负担与\
  \ Dart 使用类型作为工具来提高开发者体验的哲学背道而驰。相反，Dart 的可赋值规则支持隐式向下转型。\n\n当然，这意味着 Dart 的类型系统是不完备的（unsound）。我们无法保证一个通过类型检查的\
  \ Dart 程序实际上完全没有运行时错误。然而，正如我们在上面的导游中提到的，实际上没有任何静态类型系统可以做到这一点。通常，类型系统可以强制的属性被定义为其范畴的一部分，而它无法强制的属性则被归到其他地方。一个经典的例子是函数式语言中的模式匹配，它将某些属性的强制定义在静态类型系统之外。\n\
  \n正如我们将在第 5.5 节](#part0013.html_ch05lev1sec5) 中看到的，Dart 类型检查不完备还有其他原因。\n\n### 5.4\
  \ 运行中的类型：表达式问题，类型化\n\n为了更好地理解 Dart 中的类型，让我们重新回顾表达式问题（expression problem），我们最初在第\
  \ 2.15.1 节](#part0010.html_ch02lev2sec3) 中遇到的问题。我们想对原始解决方案进行类型检查。\n\n我们首先为评估器添加类型信息。在类型检查评估器时，我们需要知道加法和减法的\
  \ mixin 具有支持 `int` 值的 `eval()` 方法的字段，因此我们用类型 `ExpressionWithEval` 标记字段。我们仍然没有依赖其他库（当然除了\
  \ dart:core）。例如，我们不需要知道 `ExpressionWithEval` 是否实际上是 `Expression` 的子类型。\n\n我们还想保证数字\
  \ mixin 具有 `int` 字段 `val`，并且所有的 `eval` 方法都返回整数。\n\n点击此处查看代码图像\n\n```\nlibrary evaluator;\n\
  \nabstract class ExpressionWithEval {\n  int get eval;\n}\n\nabstract class AdditionWithEval\
  \ {\n  ExpressionWithEval get operand1;\n  ExpressionWithEval get operand2;\n  int\
  \ get eval => operand1.eval + operand2.eval;\n}\n\nabstract class SubtractionWithEval\
  \ {\n  ExpressionWithEval get operand1;\n  ExpressionWithEval get operand2;\n  int\
  \ get eval => operand1.eval - operand2.eval;\n}\n\nabstract class NumberWithEval\
  \ {\n  int get val;\n  int get eval => val;\n}\n```\n\n然而，在为 `multiplication evaluator`\
  \ 添加类型时，我们发现需要添加一个导入，因为我们必须访问 `ExpressionWithEval` 类型。所有类型的评估代码可能依赖于原始评估器，这并不意外，但遗憾的是我们现在无法独立编译它们了。\n\
  \n点击此处查看代码图像\n\n```\nlibrary multiplication evaluator;\n\nimport 'evaluator.dart'\
  \ show ExpressionWithEval;\n\nabstract class MultiplicationWithEval {\n  ExpressionWithEval\
  \ get operand1;\n  ExpressionWithEval get operand2;\n  int get eval => operand1.eval\
  \ * operand2.eval;\n}\n```\n\n`string converter` 库的代码注释方式与 `evaluator` 类似：\n\n点击此处查看代码图像\n\
  \n```\nlibrary string converter;\n\nabstract class ExpressionWithStringConversion\
  \ {\n  String toString();\n}\n\nabstract class AdditionWithStringConversion {\n\
  \  ExpressionWithStringConversion get operand1;\n  ExpressionWithStringConversion\
  \ get operand2;\n  String toString() => '$operand1 + $operand2';\n}\n\nabstract\
  \ class SubtractionWithStringConversion {\n  ExpressionWithStringConversion get\
  \ operand1;\n  ExpressionWithStringConversion get operand2;\n  String toString()\
  \ => '$operand1 - $operand2';\n}\n\nabstract class NumberWithStringConversion {\n\
  \  int get val;\n  String toString() => '$val';\n}\n\nabstract class MultiplicationWithStringConversion\
  \ {\n  ExpressionWithStringConversion get operand1;\n  ExpressionWithStringConversion\
  \ get operand2;\n  String toString() => '$operand1 * $operand2';\n}\n```\n\n严格来说，由于所有对象都支持\
  \ `toString()`，我们不需要将操作数标记为类型 `ExpressionWithStringConversion`，甚至不需要定义 `ExpressionWithStringConversion`。真正需要的是注意到我们的\
  \ `toString()` 方法返回 `String`，这样我们就可以检查这些方法返回的值确实是字符串。然而，Dart 类型的一个一个核心目标是清晰性，我们想强调在这里我们也使用了与评估器相同的模式。\n\
  \n\n\n\n向表达式层次结构中引入新函数的库并不依赖于核心类层次结构，这意味着无论我们是否选择为核心类层次结构添加类型注解，我们都可以为这些库添加类型注解。因此，喜爱类型检查的程序员即使在原始层次结构的设计者选择不使用类型的情况下，也可以向系统添加新函数并对它们进行类型检查。\n\
  \n现在，让我们为类层次结构中的字段标注类型。这要求我们导入类型 `Expression`。\n\n点击此处查看代码图片\n\n```dart\nlibrary\
  \ abstract expressions;\n\nimport 'expressions.dart' show Expression;\n\nabstract\
  \ class AbstractExpression{}\n\nabstract class AbstractAddition {\n\n Expression\
  \ operand1, operand2;\n\n AbstractAddition(this.operand1, this.operand2);\n}\n\n\
  abstract class AbstractSubtraction {\n\n Expression operand1, operand2;\n\n AbstractSubtraction(this.operand1,\
  \ this.operand2);\n}\n\nabstract class AbstractNumber {\n\n int val;\n\n AbstractNumber(this.val);\n\
  }\n\nlibrary multiplication;\n\nimport 'expressions.dart' show Expression;\n\nabstract\
  \ class AbstractMultiplication {\n\n Expression operand1, operand2;\n\n AbstractMultiplication(this.operand1,\
  \ this.operand2);\n}\n```\n\n对 `expressions` 库的依赖比 `multiplication evaluator` 对\
  \ `evaluator` 的依赖更令人不快。我们最初完全独立于最终的应用库定义了核心层次结构。看来添加类型正在降低我们代码的模块化程度。我们将在下一节讨论泛型时，看看如何在保留类型的同时获得所需的解耦。\n\
  \n最后，让我们为主库添加类型。我们需要做的唯一更改是为局部变量 `e` 标注类型 `Expression`。库的其余部分保持不变。\n\n点击此处查看代码图片\n\
  \n```dart\nmain(){\n\n Expression e = new Multiplication(\n\n                  \
  \            new Addition(new Number(4), new Number(2)),\n\n                   \
  \           new Subtraction(new Number(10), new Number(7))\n         );\n print('$e\
  \ = ${e.eval}');\n\n}\n```\n\n总的来说，为我们的表达式代码添加类型是非常直接的。唯一的问题是，所有对 `Expression` 及其子类的使用都必须根据\
  \ mixin 应用定义的类型进行类型检查。为了解决这个问题，我们需要更复杂的类型：泛型。\n\n### 5.5 泛型\n\nDart 类可以是 `generic`（泛型的）——也就是说，它们可以由类型参数化。\n\
  \n泛型类可以赋予实际类型参数：\n\n```dart\nList<String> l;\n\nMap<String, int> m;\n```\n\n这类类型被称为\
  \ `parameterized types`（参数化类型）。\n\n然而，并不要求为泛型类提供类型参数。如果选择使用泛型类的名称而不带类型参数，将隐式使用 `dynamic`\
  \ 类型代替所有缺失的类型参数。因此，你可以写成：\n\n```dart\nList l;\nMap m;\n```\n\n这完全等同于\n\n```dart\n\
  List<dynamic> l;\nMap<dynamic, dynamic> m;\n```\n\n显然，前者更简洁的形式更受青睐。在代码中填充没有传递新信息的类型是一种坏风格。然而，在某些情况下，显式编写类型\
  \ `dynamic` 是理想的，例如：\n\n```dart\nMap<String, dynamic> m;\n```\n\n如果提供的类型参数数量错误，所有的类型参数都将被忽略。\n\
  \n```dart\nMap<String> m; // Map\nList<String, num> // List\nObject<int> // Object\n\
  ```\n\n上述三个示例将分别导致静态警告。除了警告之外，上述内容分别被视为 `Map`、`List` 和 `Object`，如上所述，它们等同于 `Map<dynamic,\
