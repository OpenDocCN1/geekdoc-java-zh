  \n AbstractSubtraction(this.operand1, this.operand2);\n}\n\nabstract class AbstractNumber\
  \ {\n\n int val;\n\n AbstractNumber(this.val);\n}\n\nlibrary multiplication;\n\n\
  abstract class AbstractMultiplication<E> {\n\n Expression operand1, operand2;\n\n\
  \ AbstractMultiplication(this.operand1, this.operand2);\n}\n```\n\n我们还会对表示函数的 mixin\
  \ 类进行参数化。在评估器 mixin 中，我们需要一个已知是 `ExpressionWithEval` 子类的类型参数，以便我们可以在调用 `eval` 方法而不产生警告。\n\
  \n点击此处查看代码图片\n\n```dart\nlibrary evaluator;\n\nabstract class ExpressionWithEval\
  \ {\n\n  int get eval;\n\n  }\n\nabstract class AdditionWithEval<E extends ExpressionWithEval>\
  \ {\n\n  E get operand1;\n\n  E get operand2;\n\n  int get eval => operand1.eval\
  \ + operand2.eval;\n}\n\nabstract class SubtractionWithEval<E extends ExpressionWithEval>\
  \ {\n\n  E get operand1;\n\n  E get operand2;\n\n  int get eval => operand1.eval\
  \ - operand2.eval;\n}\n\nabstract class NumberWithEval {\n\n  int get val;\n\n \
  \ int get eval => val;\n}\n```\n\nlibrary multiplication evaluator;\n\nimport 'evaluator.dart'\
  \ show ExpressionWithEval;\n\n```\n\n\n\n\n```dart\nabstract class MultiplicationWithEval<E\
  \ extends ExpressionWithEval> {\n  E get operand1;\n  E get operand2;\n  int get\
  \ eval => operand1.eval * operand2.eval;\n}\n```\n\n同样，字符串转换的混入（mixins）应该让 `E` 边界限于\
  \ `Expression-WithStringConversion`：\n\n点击此处查看代码图片\n\n```dart\nlibrary string converter;\n\
  \nabstract class ExpressionWithStringConversion {\n  String toString();\n}\n\nabstract\
  \ class AdditionWithStringConversion<E extends ExpressionWithStringConversion> {\n\
  \  E get operand1;\n  E get operand2;\n  String toString() => '$operand1 + $operand2';\n\
  }\n\nabstract class SubtractionWithStringConversion<E extends ExpressionWithStringConversion>\
  \ {\n  E get operand1;\n  E get operand2;\n  String toString() => '$operand1 - $operand2';\n\
  }\n\nabstract class NumberWithStringConversion {\n  int get val;\n  String toString()\
  \ => '$val';\n}\n\nabstract class MultiplicationWithStringConversion<E extends ExpressionWithStringConversion>\
  \ {\n  E get operand1;\n  E get operand2;\n  String toString() => '$operand1 * $operand2';\n\
  }\n```\n\n最后，我们必须修改 `expressions` 来实例化所有泛泛类型。\n\n点击此处查看代码图片\n\n```dart\nlibrary\
  \ expressions;\n\nimport 'abstractExpressions.dart' show\n      AbstractAddition,\n\
  \      AbstractExpression,\n      AbstractNumber,\n      AbstractMultiplication,\n\
  \      AbstractSubtraction;\nimport 'evaluator.dart' show\n      AdditionWithEval,\n\
  \      ExpressionWithEval,\n      MultiplicationWithEval,\n      NumberWithEval,\n\
  \      SubtractionWithEval;\nimport 'multiplication.dart';\nimport 'multiplicationEvaluator.dart';\n\
  import 'stringConverter.dart' show\n      AdditionWithStringConversion,\n      ExpressionWithStringConversion,\n\
  \      MultiplicationWithStringConversion,\n      NumberWithStringConversion,\n\
  \      SubtractionWithStringConversion;\n\nabstract class Expression = AbstractExpression\
  \ with\n      ExpressionWithEval, ExpressionWithStringConversion;\n\nclass Addition\
  \ = AbstractAddition<Expression> with\n      AdditionWithEval<Expression>,\n   \
  \   AdditionWithStringConversion<Expression>\n      implements Expression;\n\nclass\
  \ Subtraction = AbstractSubtraction<Expression> with\n      SubtractionWithEval<Expression>,\n\
  \      SubtractionWithStringConversion<Expression>\n      implements Expression;\n\
  \nclass Number = AbstractNumber with\n      NumberWithEval, NumberWithStringConversion\n\
  \      implements Expression;\n\nclass Multiplication =\n  AbstractMultiplication<Expression>\
  \ with\n      MultiplicationWithEval<Expression>,\n      MultiplicationWithStringConversion<Expression>\n\
  \      implements Expression;\n```\n\n到此结束对表达式问题（expression problem）的讨论。请记住，扩展一组类型变体并在上面扩展函数的问题是通用的，这里显示的模式对许多与表达式无关的应用都有帮助。对于那些深入研究的人，强烈推荐\
  \ Torgersen [8] 以及 Zenger 和 Odersky [9] 的相关论文。\n\n### 5.6 函数类型\n\n函数类型在 Dart 中被特殊对待。所有函数都实现了\
  \ `Function`，但函数类型是根据其结构进行比较的。\n\n函数的类型基于其返回值和形式参数的类型。该类型反映了参数是命名的还是位置的、位置参数是否必选，以及命名参数的名称。\n\
  \n在编写本文时，Dart 还没有表示函数类型的语法，因此我们在这里引入特殊的表示法。在最简单的情况下，函数接受 `n` 个位置参数，所有参数都是必选的。作为一个特殊情况，`n`\
  \ 可以为 0。假设形式参数的类型为 `T[1]`、. . , `T[n]` 且返回为 `T`，我们可以将函数类型写为 `F[t]` = (`T[1]`、. .\
  \ , `T[n]`) → `T`。例如，我们将\n\n```dart\nnum twice(num x) => x * 2;\n```\n\n的类型写为 `(`num`)\
  \ → `num`，而\n\n点击此处查看代码图片\n\n```dart\nnum product(List<num> nums) => nums.reduce(\
  \ (a, b) => a * b);\n```\n\n的类型是 `(`List < num >`) → `num`。`reduce()` 本身的类型很有趣，因为\
  \ `reduce()` 是一个接受函数作为参数的函数。`reduce()` 的类型是 `((E, E) → E) ! E`，其中 `E` 是 `List` 的类型参数。在我们的示例中，`nums`\
  \ 是一个 `List<num>`，所以 `num` 就是 `E`。（此处注：原文此处存在大量关于 `reduce()` 类型的重复描述，译文已去重。）\n\n\
  \n\n\n\n回想一下函数类型子类型规则背后的直觉是基于：对于高阶函数 `h` 的函数值参数 `g`，什么构成了一个有效的调用。对于普通的（非函数）对象，参数传递受赋值规则（assignability\
  \ rule）支配，该规则允许双向子类型化。因此，当用实际参数调用 `g` 时，它们的类型只需要能够赋值给 `g` 的形式参数。任何参数的类型都必须能够赋值给相应的\
  \ `S[i]`，因此它必须能够赋值给 `T[i]`。换句话说，该参数既可以是 `T[i]` 的子类型，也可以是 `T[i]` 的超类型。因此，如果 `T[i]`\
  \ 是 `S[i]` 的子类型或 `S[i]` 的超类型，都是可以的。我们因此假设，如果 `T` 可赋值给 `S` 且 `T[i]` 可赋值给 `S[i]`，则\
  \ `F[t]` 是 `F[s]` 的子类型。\n\n到目前为止一切正常。上述规则虽然是不安全的（unsound），但非常宽松。违反这一规则的程序员确实可能传递了一个其参数类型与形式参数完全无关的函数。\n\
  \n我们仍然需要考虑可选参数和命名参数。\n\n#### 5.6.1 可选位置参数\n\n作为第一步，让我们扩展函数类型的符号表示以容纳可选位置参数。一个函数可能有\
  \ `k` 个可选位置参数。我们将它们写在必选参数之后，放在方括号内，反映了函数签名中使用的语法：`(*T[1], . . . , T[n], [*T[n][+1],\
  \ . . . , T[n][+][+k]]) → T`。\n\n我们可以安全地将一个接受可选参数的函数传递到需要这些参数的上下文中。该函数可以接受它们。相反则是不可接受的。需要某些参数的函数不能用在这些参数被视为可选的上下文中，因为实际上这些参数可能不会被提供。子类型必须能够接受至少与超类型相同的参数。然而，子类型的所有参数并不都是必选参数；事实上，即使它们中没有一个是必选的也可以的。\n\
  \n这引导我们得到了实际的规则：\n\n函数类型 `F[t] = (*T[1], . . . , T[n], [*T[n][+1], . . . , T[n][+][+k]])\
  \ → T` 是函数类型 `F[s] = (*S[1], . . . , S[j], [*S[j][+1], . . . , S[m]]) → S` 的子类型，当且仅当：\n\
  \n**1.** `j ≤ n` 且 `m ≤ n + k`。\n\n**2.** `∀i` ![Image](img/00013.jpeg) 1..m, `T[i]`\
  \ 可赋值给 `S[i]`。\n\n**3.** `S` 为 `void` 或 `T` 可赋值给 `S`。\n\n子类型需要 `n` 个参数，而超类型有 `j`\
  \ 个必需参数。当类型为 `F[t]` 的函数 `f[t]` 用于需要类型 `F[s]` 的地方时，它将至少传递 `j` 个参数。由于 `F[t]` 需要 `n`\
  \ 个参数，第一项要求 `j ≤ n`，因此保证 `f[t]` 能获得足够数量的参数。可能传递的最大参数数量是 `m`，即 `F[s]` 的参数总数。函数 `f[t]`\
  \ 最多接受 `n + k` 个参数——`n` 个必选和 `k` 个可选。只要 `m` 不大于 `n + k`，传递的参数数量对于 `f[t]` 都是可以的。实际参数的类型必须赋值给\
  \ `f[t]` 的形式参数。由于实际上最多发送 `m` 个实际参数，我们只需要要求前 `m` 个参数类型的赋值性。\n\n最后一项是我们在此之前忽略的一个转折。Dart\
  \ 允许你识别不打算返回结果的函数可以使用特殊的返回类型 `void` 进行标记。如果 `F[s]` 返回 `void`，类型检查器假设结果未被使用，因此它没有意义。\n\
  \n#### 5.6.2 命名参数\n\n命名参数呢？再次，让我们为带有命名参数的函数类型引入一些符号。我们将在括号之间描述命名参数，类似于 Dart 的 map\
  \ 字面量，再次反映了函数签名中使用的具体语法。命名参数出现在位置参数之后。每个命名参数将由一个类型后跟其名称表示。\n\n为了作为一个具体的例子，我们将查看\
  \ `Iterable` 的方法 `firstWhere()`。\n\n点击此处查看代码图片\n\n```\nE firstWhere(bool test(E\
  \ value), {E orElse()});\n```\n\n其类型为 `((*E) → bool, {() → E orElse}) → E`。\n\n\
  `firstWhere()` 方法接受一个谓词作为参数，就像 `where()` 一样。`firstWhere()` 并不返回满足谓词的结果集合，而是简单地返回第一个这样的元素。\n\
  \n`firstWhere()` 的一个近亲是 `lastWhere()`，它返回满足谓词的最后一个元素。\n\n点击此处查看代码图片\n\n```\nE lastWhere(bool\
  \ test(E value), {E orElse()});\n```\n\n因此，带有命名参数的函数的通用形式是 `(*S[1], . . . , S[n],\
  \ {T[1], . . . , T[k]}) → T` —— 让我们考虑带有命名参数的函数的子类型规则。命名参数总是可选的。在 Dart 中，一个函数不能同时具有可选位置参数和命名参数。\n\
  \n我们可以正式地阐述这些规则：函数类型 `F[t] = (*T[1], . . . , T[n], {T[1], . . . , T[k]}) → T` 是函数类型\
  \ `F[s] = (*S[1], . . . , S[j], {S[1], . . . , S[m]}) → S` 的子类型，当且仅当：\n\n**1.**\
  \ `S` 为 `void` 或 `T` 可赋值给 `S`。\n\n**2.** `∀i` ![Image](img/00013.jpeg) 1..j, `T[i]`\
  \ 可赋值给 `S[i]`。\n\n**3.** `k ≥ m` 且 `∀i` ![Image](img/00013.jpeg) 1..m, `T[i]` 可赋值给\
  \ `S[i]`。\n\n#### 5.6.3 回顾 call()\n\n在 4.6.1 中，我们提到任何声明特殊方法 `call` 的类都实现了 `Function`。现在我们可以完善对\
  \ `call` 的理解。\n\n假设我们想要定义一个像函数的 map 类。我们将其限制为字符串到数字的映射。\n\n点击此处查看代码图片\n\n```\nclass\
  \ MapFunction implements Map<String, num> {\n  MapFunction(this._map);\n  Map<String,\
  \ num> _map;\n\n  num operator [](String k) => _map[k];\n\n  void operator []= (String\
  \ k, num v) { _map[k] = v;}\n\n  // more wrapping functions\n  num call(String key)\
  \ => _map[key];\n}\n```\n\n`MapFunction` 实例是通过将 map 对象传递给类的构造函数创建的。该类将 `Map` 接口中的所有调用转发给它封装的\
  \ map。此外，`call` 方法接受一个对象，作为底层 map 的键并返回查找结果。\n\nDart 确保不仅 `MapFunction` 被认为实现了 `Function`，而且它被认为是\
  \ `String` → `num` 的子类型。\n\n\n\n\n虽然类型注解在运行时并不存在，但类型的其他方面是存在的。正如我们已经看到的，每个对象都携带着其*运行时类型*（runtime\
  \ type），这可以通过从 `Object` 继承的 `runtimeType` 方法进行动态访问。用户可以自由重写 `runtimeType`，这意味着通常情况下，对象的实现类型无法通过调用\
  \ `runtimeType` 来观察。\n\n每个类型声明都会引入一个 `Type` 类的编译时常量对象，用于表示该类型。这些对象在运行时也是可用的。此外，人们可以通过动态类型测试和类型转换来测试一个对象是否是某个类型的成员，如下所示。\n\
  \n### 5.7.1 类型测试 (Type Tests)\n\n类型测试是测试对象是否属于某个类型的表达式。\n\n点击此处查看代码图片\n\n```\nvar\
  \ v = [1, 2, 3];\n\nv is List; // true\n\nv is Map; // false\n\nv is Object; //\
  \ 无意义的：始终为 true\n```\n\n类型测试的一般形式是 `e` is `T`，其中 `e` 是一个表达式，`T` 是一个类型。类型测试评估 `e`\
  \ 并测试结果的动态类型是否与类型 `T` 。上述代码段的最后一行不应该出现在正常的 Dart 程序中。它将始终求值为 true，因为所有 Dart 值都是对象。\n\
  \n由于 Dart 类可以实现一个不相关的类型，因此即使对象的类不是 `T` 的子类，对象也可能模拟另一个类型 `T`。然而，对象无法完全隐藏其实现类型，因为人们可以使用类型测试来检测它。这在某种程度上违背了“只有对象的行为才是重要的”这一原则。同样的论点适用于下文描述的类型转换。\n\
  \n### 5.7.2 类型转换 (Type Casts)\n\n类型转换也会评估一个表达式并测试结果对象是否属于某个类型，但它们不是谓词（predicate）。相反，如果测试失败，类型转换将抛出\
  \ `CastError`；否则，它将原封不动地返回对象。\n\n点击此处查看代码图片\n\n```\nObject o = [3, 4, 5];\n\no as\
  \ List; // 一个相当开销的无操作\n\no as Map; // 抛出异常\n```\n\n类型转换几乎是以下内容的简写形式：\n\n点击此处查看代码图片\n\
  \n```\nvar t = e;\n\nt is T ? t : throw new CastError();\n```\n\n类型转换的一个典型用途可能是验证数据\n\
  \n点击此处查看代码图片\n\n```\nList l = readNextVal() as List;\n\n  // 我很确定会从 readNextVal()\
  \ 返回一个列表\n  // 如果不是，情况就真的糟糕了，我应该失败\n  // 接下来，对列表进行操作\n```\n\n人们应该小心不要滥用类型转换。考虑\n\
  \n点击此处查看代码图片\n\n```\nObject o = [5, 6, 7];\n\n... // 大量的中间逻辑\n\no.length; // 可以运行；类型警告：对象并不总是有\
  \ length\n```\n\n许多程序员可能会忍不住将代码重写为：\n\n点击此处查看代码图片\n\n```\nObject o = [5, 6, 7];\n\
  \n... // 相同的中间逻辑\n\n(o as List).length; // 糟糕！避免警告的错误方法\n```\n\n类型转换是在运行时执行的，因此带有运行时开销。如果你的目标仅仅是让类型检查器闭嘴，只需使用赋值即可：\n\
  \n```\nObject o = [5, 6, 7];\n\n... // 相同的中间逻辑\n\nList l = o;\n\nl.length;\n```\n\
  \n上述代码之所以有效，是因为可赋值规则（5.3）。某些程序员可能对这种用法有异议，因为他们发现很难为变量不断命名。一个简单的解决方案是在变量名后附加转换语的变体：\n\
  \n```\nObject o = [5, 6, 7];\n\n... // 相同的中间逻辑\n\nList o_as_List = o;\n\nl.length;\n\
  ```\n\n### 5.7.3 检查模式 (Checked Mode)\n\n在开发过程中，验证变量的类型通常非常有用。例如，我们希望确保传入的参数或调用返回的对象符合预期。Dart\
  \ 提供了*检查模式*（checked mode）来实现此目的。在检查模式下，每次值传递都会经过动态检查。这意味着每当传递参数、从方法或函数返回结果以及执行每次赋值时，系统都会自动为你执行动态类型测试。检查模式确保了赋值给变量的动态值是该变量静态类型的成员。同样，实际参数的动态类型会与形式参数的静态类型进行测试，函数的结果动态类型会与函数的声明返回类型进行测试。\n\
  \n点击此处查看代码图片\n\n```\nnum n = 3.0;\n\nint i = n; // 检查模式下的动态错误\n\nnum x = i; // 始终允许\n\
  \nint j = null; // 始终允许\n```\n\n在检查模式下，我们有更多的信心。在没有检查模式的情况下，向列表中插入不适当对象的尝试会被拦截。类型转换\
  \ 只有在真正需要时才使用。正如你所看到的，在检查模式下，类型注解会影响行为；然而，这是一种显式的开发者控制工具。事实上，在检查模式下，类型注解就像断言（6.2.7）。\n\
  \n### 5 具体化泛型 (Reified Generics)\n\n类型参数在运行时是具体化的。当泛型类实例化时，提供的实际类型参数会被传递并存储。因此，使用\
  \ `List<String>` 创建的类与通过 `List<Object>` 创建的类不同。\n\n我们可以写：\n\n```\nvar l = new List<String>();\n\
  \nl is List<String>; // true\n\nl is List<int>; // false\n```\n\n然而，必须理解此类测试的局限性。由于类型系统是不安全的，无法硬性一个声称是\
  \ `List<int>` 的对象只包含整数。我们可以确定该对象是一个列表，并且它是作为整数列表被创建的。然而，任何类型的对象都可能被插入其中。\n\n在检查模式下，我们有更多的信心。向列表中插入不适当对象的尝试会被拦截。检查模式会确保泛型类实例的使用不会被破坏。检查模式会对变量声明类型和函数结果实际类型进行测试；但在泛型类型中，实际类型参数会替换声明类型中的任何类型变量。因此，给定\
  \ `List` 定义了：\n\n```\noperator [int index]= (E e)\n```\n\n当我们写：\n\n```\nvar l =\
  \ new List<String>();\n\nl[0] = 'abc'; // 始终允许\n\nl[1] = 42; // 在检查模式下失败 - 42 是\
  \ int，不是 String 的子类型\n\n### 5.7.5 具体化与可选类型 (Reification and Optional Typing)\n\n\
  可选类型是如何与类型具体化相结合的？特别是，可选类型不应该影响运行时语义，但具体化显然会。然而，具体化只有在程序显式尝试观察或确定运行时类型结构时才会产生影响。这些情况包括：\n\
  \n\n\n\n\n- 请求对象返回其类型，使用类型测试、类型转换或调用 `runtimeType`。\n- 通过向泛型类型的构造函数传递实际的类型参数，设置对象的运行时类型。\n\
  - 使用反射来检查或设置变量或函数的类型。\n- 使用检查模式（checked mode）。\n- 通过其函数签名上的注解来确定函数对象的具象化类型（reified\
  \ type）。\n\n最后三点都极可能受到类型注解的影响，而类型注解通常没有语义影响。在这些点中，最后一点可能是最微妙的。如果逻辑依赖于涉及函数的类型测试，那么它可能会受到类型注解的影响。该函数可以是显式定义的闭包，也可以作为属性提取出来。以下代码演示了该问题：\n\
  \n点击此处查看代码图片\n\n```\ntypedef int IntFunction(int);\n\nobserveAnnotations(f) {\n\
  \   return f is IntFunction;\n}\n\nString id1(String x) => x;\n\nid2(x) => x;\n\n\
  int id3(int x) => x;\n\nobserveAnnotations(id1); // false\n\nobserveAnnotations(id2);\
  \ // true\n\nobserveAnnotations(id3); // true\n```\n\n三个函数 `id1`、`id2`、`id3` 除了类型注解外都是完全相同的，但由于使用的类型注解不同，它们在类型测试方面的行为也不同。当然，我们已经在显式地执行类型测试，因此在这种情况下类型对行为产生影响并不令人意外。\n\
  \n### 5.7.6 类型与代理（Proxies）\n\n能够为任何对象定义透明代理是一个重要的属性。代理与类型之间存在着内在的张力。考虑我们在第 2.10\
  \ 节引入引入通用代理类 `Proxy`。\n\n假设代理正在模拟类型 `Point`。我们遇到的第一个困难是我们将 `Proxy` 的实例作为类型变量或参数的值时。\n\
  \n点击此处查看代码图片\n\n```\nPoint pointProxy = new Proxy(new Point(0,0)); // warning\n\
  ```\n\n由于 `Proxy` 既不是 `Point` 的子类型也不是超类型，该代码会导致警告。最佳解决方案是将 `proxyPoint` 声明为动态类型变量。\n\
  \n点击此处查看代码图片\n\n```\nvar pointProxy = new Proxy(new Point(0,0));\n```\n\n当然，到这一步，我们失去了类型检查的某些用处。如果我们想对\
  \ `pointProxy` 的使用进行类型检查，我们需要另一种方法。看起来我们只需要添加：\n\n```\nPoint pointImposter = pointProxy;\n\
  ```\n\n但事实证明这样做是不够的。虽然这消除了静态警告，但我们会在动态类型检查中遇到麻烦。如果我们编写以下任何代码：\n\n点击此处查看代码图片\n\n\
  ```\npointImposter is Point; // false!\n\npointImposter as Point; // exception!\n\
  ```\n\n我们伪装代理对象为点的做法将被暴露。虽然我们可能选择放弃类型检查并避免这些情况，但在现实中，我们可能不得不将 `pointProxy` 或 `pointImposter`\
  \ 传递给其他编写的代码，而这些代码假设它处理的是点。在这种情况下，上述的动态测试很可能会发生。此外，在检查模式下运行时，一旦有人尝试将 `pointProxy`\
  \ 赋值、传递或返回到标记为类型 `Point` 的上下文中，就会立即发生错误。\n\n点击此处查看代码图片\n\n```\nPoint pointProxy\
  \ = new Proxy(new Point(0,0)); // dies in checked mode\n```\n\n如果我们要进行任何类型的类型检查，我们需要定义一个*特定类型的代理*（type-specific\
  \ proxy）：\n\n点击此处查看代码图片\n\n```\nclass PointProxy extends Proxy implements Point\
  \ {\n   PointProxy(forwardee): super(forwardee);\n}\n```\n\n现在我们可以可靠地使用我们的代理了：\n\
  \n点击此处查看代码图片\n\n```\nPoint pointProxy = new PointProxy(new Point(0,0));\n\npointProxy\
  \ is Point; // true!\n\npointProxy as Point; // identical to pointProxy\n```\n\n\
  等一下！`PointProxy` 中没有 `x, y, rho, theta, +` 等方法。我们难道不会收到 `PointProxy` 没有正确实现 `Point`\
  \ 接口的警告吗？恰恰相反，Dart 有一条特殊规则允许我们抑制此类警告。如果一个类声明了 `noSuchMethod()`，就不会有关于支持接口缺失成员的投诉，也不会有关于此类成员签名不错误的警告。\n\
  \n对特定类型代理的需求是令人失望的。在这里，绝大部分工作由 `Proxy` 完成，但我们仍然必须定义每个接口的子类。这种解决方案比定义一套详尽的转发方法要容易且易于维护（在传统的类型环境中，你必须这样做），但又比只定义一个\
  \ `Proxy` 类要困难。在完全动态的环境中，`Proxy` 的共享定义就足够了。\n\n...\n\n另一个相关问题是模拟函数，这最早在第 4.6 节中引入。该问题在\
  \ Dart 的单元测试框架中实际出现。该定义了一个方法 `expectAsync()`，它接收一个异步函数并将其封装在代理中，使其看起来是同步的。该框架需要处理不同的元数（arities）。\n\
  \n一个务实的解决方案基于这样一个事实：我们可以现实地将函数的元数限制在某个固定值。假设我们的示例 `n` = 5，但如果这不够，可以选择 `n` = 10 或\
  \ `n` = 255 或任何适合的值——原理是相同的。我们还将忽略使用命名参数的可能性。在这种情况下，我们可以定义 `call` 接收五个可选参数。这使得我们的代理成为类型（[**dynamic**,\
  \ **dynamic**, **dynamic**, **dynamic**, **dynamic**])! **dynamic** 的成员，而它是任何没有多于五个必选参数且没有命名参数的函数的子类型。结果，代理对象不仅支持与其目标相同的合法调用，而且在类型测试、类型转换和检查模式下运行也是安全的。\n\
  \n我们仍然需要在 `call` 方法中定义代码，以将调用转发给目标。我们的实现需要确定传递的正确参数数量。假设对代理函数的调用具有正确的元数，我们需要确定实际上向我们传递了多少参数。为了实现这一点，我们为每个参数设置一个特殊标记对象的默认值。由于\
  \ Dart 中的默认参数值必须是常量的，因此该标记对象是一个编译时常量对象。然后我们可以方便地将参数列表定义为所有形式参数的列表字面量，并使用列表的 `removeWhere()`\
  \ 方法过滤掉所有出现的标记值。然后我们可以使用 `Function.apply()`（这是我们在第 4.6 节中首次看到的）来转发调用。以下是必要的代码\n\n\
  ```\nclass UnsentArgumentMarker{\n   const UnsentArgumentMarker();\n}\n\nconst NO\
  \ ARG = const UnsentArgumentMarker();\n```\n\n\n\n\n```dart\nclass ProxyForFunctionOfArity5\
  \ implements Function {\n\n  Function target;\n\n  ProxyForFunctionOfArity5(this.target);\n\
  \n  call([a0 = NO ARG, a1 = NO ARG, a2 = NO ARG, a3 = NO ARG, a4 = NO ARG]){\n \
  \   List args = [a0, a1, a2, a3, a4]..removeWhere((arg) => arg == NO ARG);\n   \
  \ return Function.apply(target, args);\n  }\n}\n```\n\n单元测试框架中的真实代码包含一些处理异步的额外逻辑，但这并不是我们关注的。我们可以通过其他方式过滤掉未发送的参数，但这段代码在效率略有牺牲的情况下是既优雅又简洁的。这里需要注意的是我们如何模拟广泛的函数类型，以及确定哪些参数实际上被传递的技巧。\n\
  \nDart 的类型系统为代理提供了更特殊的优待。注解 (7.3) `@proxy` 对类型系统具有特殊意义。如果一个类被标记为 `@proxy`，那么当在类的实例上访问方法时，Dart\
  \ 分析器将不再发出警告，即使该类在静态上并不认为支持该方法。\n\n### 5.8 畸形类型\n\n如果我们对一个变量标记一个不存在的类型会发生什么？根据我们上面阐述的原则，除了检查模式（checked\
  \ mode）之外，代码应该保持不变。\n\n`UndefinedType v = 91;`\n\n假设 `UndefinedType` 实际上未定义，Dart\
  \ 将发出警告。在检查模式下，当系统尝试检查 `int` 是否为 `UndefinedType` 的子类型时，对 `v` 的赋值将导致运行时错误。然而\n\n\
  `UndefinedType v = null;`\n\n在运行时不会引起任何错误，因为当给变量赋值为 `null` 时，不会执行子类型测试。\n\n未定义类型可能由于多种原因产生：拼写错误、忘记导入，或者在实际定义该类型之前提到了它。在某些情况下，类型注解中使用的名称可能表示函数或变量。在任何名称未表示实际类型声明的情况下，我们得到了一个*畸形类型*(malformed\
  \ type).*\n\n未定义类型是畸形类型的一种特殊形式。歧义类型——由于在同一作用域内导入了同名的不同声明，导致其含义不明确的类型——也是畸形的。\n\n\
  泛型也可能导致畸形类型。如果泛型本身是畸形的，那么对该泛型的任何调用也是畸形的：\n\n点击此处查看代码图像\n\n`UndefinedGeneric<int>\
  \ ugi; // 畸形`\n\n`UndefinedGeneric ug; // 畸形`\n\n最后，当类型变量在静态成员的中被引用时，它们被认为是畸形的：\n\
  \n点击此处查看代码图像\n\n```dart\nclass C<T, S> {\n  static T cantReferToTypeVars; // 警告\n\
  \  static S alsoCantReferToTypeVars(T t) { // 这里有两个警告\n    S local; // 这里还有一个\n\
  \    return new Map[T, S](); // 这里有两个\n  }\n}\n```\n\n类型变量对于泛型类的每个实例具有潜在的不同的值。在不涉及实例时，它们没有意义。虽然可以简单地认为静态成员声明中的类型变量超出作用域，但通过将它们视为在作用域内但畸形，Dart\
  \ 可以提供更好的错误信息。\n\n`cantReferToTypeVars` 的声明给出了警告，是因为 `T` 是畸形的；它只在 `C` 的实例语文中有意义。方法\
  \ `alsoCantReferToTypeVars` 将产生多个警告：它的返回类型 `S` 是畸形的，其形式参数的类型也是如此。局部变量 `local` 也引起了警告，而方法最后语句中\
  \ `Map` 的实例化则为 `S` 和 `T` 产生了单独的警告。\n\n一旦对畸形类型的出现发出了警告，静态类型检查器会将该出现处替换为 `dynamic`，以防止无意义的次级警告级联出现。例如，如果我们调用\
  \ `alsoCantReferToTypeVars`，我们不会得到任何警告：\n\n点击此处查看代码图像\n\n`int i = C.alsoCantReferToTypeVars('abc');`\n\
  \n向程序员投射无法操作的警告是没有意义的。人们无法通过变量 `i` 的类型或参数的类型来使调用正确。问题出在 `C.alsoCantReferToTypeVars`\
  \ 的声明处，而不是任何调用处。\n\n同样，上述 `Map<T, S>` 的实例化产生了 `T` 和 `S` 是畸形的警告，但并没有抱怨它们是 `Map` 的不当类型参数。我们将畸形类型参数替换为\
  \ `dynamic`，并因此产生一个 `Map<dynamic, dynamic>`。我们看到，在参数化类型中使用畸形类型作为类型参数并不会导致参数化类型畸形。畸形类型参数被替换为\
  \ `dynamic`，这才是运行时使用的类型参数。\n\n点击此处查看代码图像\n\n`List<UndefinedType> l = [3]; // 警告`\n\
  \n`List<int> list = [3]; // 警告`\n\n### 5.9 不安全性\n\n我们现在可以回顾类型系统中各种不安全性的来源。这些是：\n\
  \n- 泛型的协变。\n- 赋值规则中的向下转型 (5.3)。\n- 函数类型的赋值性。\n- 私有性与接口类型的交互。\n\n我们分别在第 5.3 和 5.5\
  \ 节讨论了前两点。第三点实际上是前两点的产物。函数类型在其返回上是协变的，但在参数上是反变的。导致泛型协变的原理适用于函数类型。这本身就会使函数子类型成为额外的不安全性来源。\n\
  \n此外，赋值规则适用于所有的值传递，包括传递参数和返回结果，这决定了参数和返回类型的赋值性，正如第 5.6 节所述。\n\nDart 的最后一个不安全性来源是我们尚未讨论过的——库级别的\
  \ ADT 风格有性与基于接口的交互。为了理解这种交互，让我们看看上一章栈示例的变体。在这个版本中，我们将实现一个 `Stack` 类，以便能够实例化多个栈：\n\
  \n点击此处查看代码图像\n\n```dart\nlibrary stack3;\n\nclass Stack {\n  List _contents = [];\n\
  \  get isEmpty => _contents.isEmpty;\n  get top => isEmpty ? throw 'Cannot get top\
  \ of empty stack' : _contents.last;\n  get pop => isEmpty? throw 'Cannot pop empty\
  \ stack' : _contents.removeLast();\n\n  push(e) {\n    _contents.add(e);\n    return\
  \ e;\n  }\n}\n\nclone(Stack s) {\n  Stack ns = new Stack();\n  ns.contents = new\
  \ List.from(s. contents);\n  return ns;\n}\n```\n\n\n\n\n我们添加了一个 `clone` 函数，它接收一个栈并产生另一个内容相同的栈。这实际上并不是一个好主意，但它符合我们此处的目的。一个引起警觉的问题是，`clone`\
  \ 访问了其形式参数 `s` 的私有变量 `contents`。在一种围绕抽象数据类型（ADTs）概念设计的语言中，这是非常自然的。在这样的语言中，类型系统向我们保证任何传入的参数都将是我们定义的\
  \ `Stack` 类的实例，因此也一定会有一个名为 `_contents` 的字段。\n\n但问题正出于此：Dart 并不是围绕抽象数据类型概念设计的。Dart\
  \ 是围绕接口（interfaces）概念设计的。Dart 中的类型从不表示特定的实现类型。相反，它表示的是该类型的接口。任何人都可以实现 `Stack` 类型，而且该实现可以与\
  \ `Stack` 类中定义的实现完全不同。特别是，该实现可能没有 `_contents` 字段。\n\n事实上，假设我们决定在另一个库中产生 `Stack`\
  \ 的另一种替代实现。\n\n点击此处查看代码图像\n\n```dart\nlibrary stack4;\n\nimport 'stack3.dart' as\
  \ stack show clone, Stack;\n\nclass Stack4 implements stack.Stack {\n  final List\
  \ _array = [];\n\n  get isEmpty => _array.isEmpty;\n\n  get top => isEmpty ? throw\
  \ 'Cannot get top of empty stack' : _array.last;\n\n  get pop => isEmpty? throw\
  \ 'Cannot pop empty stack' : _array.removeLast();\n\n  push(e) {\n    _array.add(e);\n\
  \    return e;\n  }\n}\n\nmain() {\n  stack.clone(new Stack4());\n}\n```\n\n显然，当我们尝试访问传入参数中不存在的\
  \ `_contents` getter 时，对 `stack.clone()` 的调用会导致 `NoSuchMethodError` 失败，因为该参数是 `Stack4`\
  \ 的实例，且确实没有这样的 getter。问题是类型系统是否应该对这段代码报错。\n\n在一个基于 ADT 的系统中，我们可能会抱怨说 `Stack4` 没有实现\
  \ `stack.Stack`，因为它缺少 `_contents` 访问器。这引发了几个困难：\n\n-   由于 `_contents` 对 `stack`\
  \ 是私有的，它的存在绝不能让其他库感知。特别是，在接口的实现者中生成警告是不可接受的。添加私有成员应该是类的纯内部决定。如果向类中添加私有成员会导致该类的实现者中产生警告，那么这种做法是不可能的。\n\
  \n-   抛开上述反对不谈，假设我们确实发出了警告？那么开发 `Stack4` 的开发者该做什么呢？在 `Stack4` 中定义 `_contents` 访问器并不能满足需求，因为它对\
  \ `stack4` 是私有的，无法在外部访问。`clone` 内部的调用将以相同的方式失败。`stack3` 和 `stack4` 中的 `_contents`\
  \ 成员是不同的。简而言之，`stack3.Stack` 之外的任何人无法实现一个能够实现 `stack3` 内部定义的访问器的 `_contents` getter。\n\
  \n另一种方法是在 `clone()` 内部报错。类型 `Stack` 变量不能可靠地被假设具有如 `_contents` 的私有访问器。遗憾的是，这意味着除了\
  \ `this` 之外，任何对象都永远无法使用私有实例成员。基于对象的封装强制了这种替代方案。正如我们在上一章中讨论过的，Dart 显式地拒绝了基于对象的封装。\n\
  \n实际上，任何地方都没有发出警告，因此系统再次是不健全的（unsound）。这种不健全性是由于隐私规范基于 ADT 而类型系统纯粹基于接口的直接结果。\n\n\
  Dart 为程序员提供了定义抽象数据类型的选项，在这种情况下，他们必须明确记录他们定义的抽象类型不应被他人实现（尽管它们可以被子类扩展）。人们可以用这种风格定义单个抽象数据类型或若干种协作的类型。\n\
  \n或者，程序员也可以选择在倾向的基于接口的风格工作，在这种情况下，私有成员应仅通过 `this` 访问，实际上遵循了基于对象的封装。\n\n### 5.10\
  \ 相关工作\n\n类型系统的僵化性引发了许多放松它的尝试。在 Scheme 中，人们对软类型（soft-typing）进行了大量研究，这与类型推断密切相关。Racket\
  \ 最近的尝试混合了有类型和无类型代码，但粒度相对较粗。每个模块要么是有类型的，要么是无类型的。跨越有类型和无类型单元边界的数据会被动态检查。这些检查在某种程度上类似于检查模式（checked\
  \ mode）。\n\nDart 的可选类型方案与 Strongtalk 开发的方案[16]最为相关。然而，在 Dart 中，可选类型更紧密地集成到了语言中。Strongtalk\
  \ 没有泛型化（reify generics），也没有检查模式。此外，警告是 IDE 的专有的；编译完全独立于类型检查。最后，Strongtalk 拥有一个具有泛型声明变体（side\
  \ variance）的健全类型系统。\n\n*可选类型*（optional typing）一词曾用于 Common Lisp 的背景下，但表示的是某种不同的思想。类型被编译器视为有效的断言，编译器利用它们进行优化。然而，这些类型注释没有经过验证，导致系统从本质上是不安全的。Dart\
  \ 要求指针安全，且不允许实现信任类型注释。\n\n\n\n在 Dart 中，整数可以是任意大小的。然而，使用非常大的整数可能会相对昂贵。在超过某个特定边界后（该边界随实现方式而异），整数将无法再直接利用底层的硬件表示。因此，对此类大整数的操作将变得昂贵得多。\n\
  \n实现层可以自由使用各种类的实例来实现整数。唯一的要求是任何此类类都必须实现内置类 `int`。在实践中，可能会根据所表示的整数的大小使用不同的类。\n\n\
  当查询一个整数的 `runtimeType` 时，答案总是 `int`，这也就是静态检查器分配给整数字面量的类型。因此，发现整数底层实现类的唯一方法是通过反射，正如在下一章中讨论的那样。\n\
  \n如果两个整数对象表示相同的数学值，则它们被认为是恒等的。\n\n在编译为 Javascript 的 Dart 实现中，会出现进一步的复杂性。在 Javascript\
  \ 中，所有数字都表示为 IEEE 双精度浮数；没有整数。因此，在 Javascript 之上实现整数语义是非常昂贵的。在这样的实现上，当整数超出给定范围（绝对值约为\
  \ 2⁵³）时，整数将被近似。\n\n**[1].** 人们只能希望 Javascript 在随着时间的推移能够发现整数。\n\n你不能定义 `int` 的子类，也不能让另一个类实现\
  \ `int`。这些限制是一种折中，允许 Dart 实现提供高性能，代价是牺牲了人们应该能够子类或实现任何类的原则。\n\n### 6.1.1.2 Double\n\
  \nDouble 是根据 IEEE 754 标准实现 64 位浮点数的对象。Double 是 `dart:core` 中 `double` 类的实例。\n\n\
  Double 的恒等性规则与相等性规则细有不同。简单来说，如果表示浮点值的底层位模式相同，则两个 double 是恒等的。在大多数情况下，这意味着两个 double\
  \ 恒等的当且仅当它们是相等的，但有两个例外：\n\n1. 浮点数 `-0.0` 和 `0.0` 是相等的但不恒等的。\n2. NaN（非数字）与自身是恒等的，但不相等的。\n\
  \n你不能定义 `double` 的子类，也不能让另一个类实现 `double`。同样的规则也适用于 `double` 和 `int` 的共同父类型 `num`。\n\
  \n### 6.1.1.3 布尔值\n\n只有两个布尔对象：`true` 和 `false`。它们是 `bool` 类的成员。\n\n与某些语言不同，不能将任意表达式强制转换为布尔值。如果你尝试写：\n\
  \n```\nvar x = someComputation();\n\n...\n\nif (x) print(x.foo()); // 不要这样做！\n```\n\
  \n期望语言会将一个非空值转换为 `true`，你将会非常失望。记住，Dart 反感内置的强制转换。如果 `x` 是 `true`，则打印将如预期执行。然而，如果\
  \ `x` 是任何其他对象，在生产模式下它将被视为 `false` 且什么都不会被打印。在检查模式下，它会失败。因此，最好的做法是在测试时编写正确的谓词表达式：\n\
  \n```\nif (x != null) print(x.foo());\n```\n\n这让读者很清楚你实际上在测试什么，并且不依赖于可能产生很多问题的强制转换。当然，如果\
  \ `x` 确实是一个布尔值，那么这样写是完全没问题的：\n\n```\nif (x) print(x.foo());\n```\n\n简而言之，`true`\
  \ 是 Dart 中唯一的真理。\n\n你可能会问，鉴于我们对强制转换的公开反感，为什么还允许其他非布尔对象被视为 `false`？如果我们能确保 Dart 始终运行在\
  \ Dart VM 上，我们可以在所有测试中强制统一使用布尔值。然而，考虑到编译到 Javascript 的限制，坚持始终使用真实的布尔值成本太高了。这是 Dart\
  \ 进行务实折中的的案例之一。\n\n你不能定义 `bool` 的子类，也不能让另一个类实现 `bool`。\n\n### 6.1.1.4 字符串\n\n字符串字面量在\
  \ Dart 中有多种形式。它们可以用单引号或双引号定界：\n\n```\n'我引用: \"用单引号分隔的字符串可以包含双引号\"'\n\n\"我引用: '用双引号分隔的字符串可以包含单引号'\"\
  \n```\n\n通常，用户不需要记住使用哪种引号来分隔字符串。两种方法都可行，这让语言变得更容易学习。此外，当引号出现在字符串中时，处理起来也更简单，正如上面的示例所示。当然，界符必须匹配——例如，你不能用单引号开始字符串并用双引号结束。\n\
  \n```\n'一个无效的字符串\" // 非法！无法解析\n\n\"另一个无效的字符串' // 同样非法\n```\n\n普通字符串局限于单行。如果你需要一个跨越多行的字符串，可以使用*多行字符串*（multiline\
  \ string）。多行字符串用三引号定界；同样，这些可以是三个连续的单引号也可以是三个连续的双引号。\n\n```\n'''我引用:\n\n\"用单引号分隔的字符串\n\
  \n可以包含双引号\"\n\n\"\"\"我引用:\n\n'用双引号分隔的字符串\n\n可以包含单引号'''\n```\n\n还有另一种选择，将你的字符串拆分成几部分并将每个部分写在一起：\n\
  \n```\n' \"我引用: '用单引号分隔的字符串可以包含双引号\"'\n```\n\nDart 会隐式地连接相邻的字符串。然而，生成的字符串不会跨越多行。Dart\
  \ 在字符串中支持多种转义序列。这些包括：\n\n- `\\n` 换行\n- `\\r` 回车\n- `\\f` 换页符\n- `\\b` 退格\n- `\\\
  t` 制表符\n- `\\v` 垂直制表符\n- `\\u{*h*}`，其中 `h` 是十六进制数字序列，用于由 `h` 表示的 Unicode 标量\n- `\\\
  u*x[1]*x[2]*x[3]*x[4]}`，其中 `x[1]---x[4]` 是十六进制数字，是 `\\u{*x[1]*x[2]*x[3]*x[4]}` 的简写\n\
  - `\\x*x[1]*x[2]}`，是 `\\u{*x[1]*x[2]}` 的简写\n\n否则 `\\*k*` 与 `*k*` 相同。\n\nDart 字符串还支持字符串插值。字符串插值允许在字符串字面量嵌入\
  \ Dart 表达式，例如：\n\n```\nprint('2*的值是 ${twice(2)}');\n```\n\n假设范围内有一个合理的 `twice()`\
  \ 实现，这将打印 `2*2 的值是 4`。你可以看到，$` 符号表示嵌入表达式的出现，然后由大括号分隔。嵌入表达式会被求值并调用其 `toString()`\
  \ 方法，结果插入到字符串表达式所在的位置。如果表达式由单个标识符组成，可以省略大括号：\n\n```\nvar roomNumber = 101;\n\nprint('欢迎来到房间\
  \ $roomNumber');\n```\n\n这将打印 `欢迎来到房间 101`。\n\n此外，Dart 还支持原始字符串（raw strings）。原始字符串不支持转义序列；它们包含引号之间的原始内容。原始字符串有单行和多行变体。原始字符串以\
  \ `r` 字符为缀。\n\n```\nprint(r'一个原始字符串 \\n'); // 打印: 一个原始字符串 \\n，没有换行\n```\n\n\n\n\
  与整数类似，字符串字面量可以通过各种类来实现，但除非通过反射，否则是无法发现的。对字符串字面量请求其运行时类型始终得到 `String`，这与静态检查器赋予字符串字面量的类型相同。`String`\
  \ 类不能被用户代码子类或实现，就像 `int`、`double`, `num` 和 `bool` 一样。\n\nDart 将字符串表示为 UTF-16 编码单元的序列。Dart\
  \ 核心库包含了 `Runes` 类，它可以将字符串转换为 Unicode 表示形式。\n\n### 6.1.1.5 符号 (Symbols)\n\n符号用于表示程序中声明的名称。符号以井号\
  \ `#` 开头，后面紧跟一个或多个用点分隔的标识符，或者一个运算符。以下是一些示例：\n\n点击此处查看代码图像\n\n`#MyClass #i` `#[]`\
  \ `#com.evil empire.forTheWin`\n\n以下是一些非法的符号：\n\n点击此处查看代码图像\n\n`#. ` `#..` `#++`\
  \ `#=` `#&=` `#||` `#&&#!=` `#!`\n\n上述都是用户不可定义的运算符。非用户定义的运算符集包括：`^(2)`\n\n**6.1.1.5\
  \ [2].** 要创建不具有字面形式的符号，需要显式地调用 `Symbol` 类的构造函数。这些情况通常出现在反射代码中。除了列出的运算符外，还有一个著名的案例是一元减号，出于反射目的，它的名称为“unary-”。\n\
  \n- 赋值，包括基础赋值运算符和所有复合运算符\n- 点，用于成员选择，以及用于级联操作（cascades）的双点 `..`\n- 不等号，它总是根据相等运算符定义的\n\
  - 通过 `!` 进行取反\n- 后置运算符：自增和自减\n- 逻辑布尔运算符\n\n自然地，符号字面量的静态类型是 `Symbol`。\n\n### 6.1.1.6\
  \ 列表 (Lists)\n\n列表字面量通常写为由方括号分隔的一系列逗号分隔的表达式。\n\n所有列表字面量都实现了 `List` 类的接口。方便地可以将字面量\
  \ `[]` 视为 `new List()` 的简写，将 `[‘a’, 2, true]` 视为以下内容的简写：\n\n```dart\nnew List()\
  \ ..\n      add('a')..\n      add(2)..\n      add(true);\n```\n\n严格来说，上面的解释并不准确，因为\
  \ Dart 实现并不要求使用 `List` 类的工厂构造函数。然而，作为初步近似，我们离事实并不远。\n\n`List` 是一个泛型类，因此人们可能会合理地问\
  \ `[1, 2, 3]` 是否创建了一个 `List<int>`？它对应于：\n\n```dart\nnew List() ..\n      add(1)..\n\
  \      add(2)..\n      add(3);\n```\n\n还是对应于：\n\n```dart\nnew List<int>() ..\n \
  \     add(1)..\n      add(2)..\n      add(3);\n```\n\n答案（再次只是出于教学目的的近似）是前者。Dart\
  \ 不会尝试从列表字面量的元素中推导出更精确的类型。原因之一是在运行时执行此类类型推断是非常昂贵的。另一个原因是可选类型。\n\n为了获得后版本，我们可以选择通过编写\
  \ `<int>[1,2,3]` 来显式地提供类型参数。事实上，语法 `[e[1], . . , e[n]]` 确实是 `<dynamic>[e[1], . .\
  \ , e[n]]` 的简写。我们也可以将语法 `< T>[e[1], . . , e[n]]` 视为以下近似：\n\n```dart\nnew List<T>()\
  \ ..\n      add(e[1])..\n      ...\n      add(e[n]);\n```\n\n如第 6.1.4 节 所示，通过保留字\
  \ `const` 前缀，列表字面量可以变成编译时常量。`const` 的使用与类型参数的使用是正交的。因此 `const[e[1], . . , e[n]]`\
  \ 确实是 `const<dynamic>[e[1], . . , e[n]]` 的简写，而 `const< T>[e[1], . . , e[n]]` 则是以下内容的近似：\n\
  \n```dart\nconst List<T>() ..\n      add(e[1])..\n      ...\n      add(e[n]);\n\
  ```\n\n### 6.1.1.7 映射 (Maps)\n\n映射字面量写为由大括号分隔的一系列逗号分隔的键值对。在每对中，键写在前面，并用冒号与值分隔。映射字面量实现了\
  \ `Map` 类的接口。方便地可以将字面量 `{}` 视为 `new Map()` 的简写，将 `{'a’: 2, ‘c’}` 视为以下内容的简写：\n\n\
  ```dart\nnew Map() ..\n      add('a')..\n      add(2)..\n      add('c');\n```\n\n\
  严格来说，上面的解释并不准确，因为 Dart 实现并不要求使用 `Map` 类的工厂构造函数。然而，作为初步近似，我们离事实并不远。\n\n`Map` 是一个泛型类，因此人们可能会合理地问\
  \ `{'a': 1, 'b': 2}` 是否创建了一个 `Map<String, int>`？它对应于：\n\n```dart\nnew Map() ..\n\
  \      add('a')..\n      add(2);\n```\n\n还是对应于：\n\n```dart\nnew Map<String, int>()\
  \ ..\n      add(1)..\n      add(2);\n```\n\n答案（再次只是出于教学目的的近似）是前者。Dart 不会尝试从映射字面量的元素中推导出更精确的类型。原因之一是在运行时执行此类类型推断是非常昂贵的。另一个原因是可选类型。\n\
  \n为了获得后版本，我们可以选择通过编写 `<String, int>{'a': 1}` 来显式地提供类型参数。事实上，语法 `{e[1]: . . , e[n]}`\
  \ 确实是 `<dynamic>{e[1]: . . , e[n]}` 的简写。我们也可以将语法 `< T>{e[1]: . . , e[n]}` 视为以下近似：\n\
  \n```dart\nnew Map<T>() ..\n      add(e[1])..\n      ...\n      add(e[n]);\n```\n\
  \n（注：此处原文“如第 6.1.4 节所示”在 Maps 部分似乎误用了 Lists 的章节引用，此处已按原文保留翻译。）\n\n### 6.1.1.8 函数\
  \ (Functions)\n\n函数字面量已经在 4.4 节中讨论过。函数类型的规则在 5.6 节中给出。现在我们可以给出函数字面量的规则。函数字面量没有声明返回类型的语法，因此函数字面量始终具有\
  \ `dynamic` 返回类型。函数字面量的参数类型与其他任何函数相同。如果声明了类型，则使用类型，否则参数类型被视为 `dynamic`。根据参数类型以及它们是强制还是可选、位置的还是命名的，可以确定显而易见的函数签名。示例：\n\
  \n点击此处查看代码图像\n\n```dart\n(x) => 2*x; // (dynamic) -> dynamic\n\n(num a, num b){\
  \ return a*b;} // (num, num) -> dynamic\n\n(String k, [Function f]) => m.putIfAbsent(k,\
  \ f); // (String, [Function]) -> dynamic\n```\n\n### 6.1.2 标识符 (Identifiers)\n\n\
  Dart 中的标识符与大多数其他语言非常相似。标识符可以以 A-Z、a-z 或 $ 中的任意字符开头。后续字符可以是上述字符或任何数字 0-9。\n\nDart\
  \ 不允许在标识符中使用非 ASCII 字母。这一选择是在经过大量讨论后做出的。我们选择确保 Dart 程序对世界上任何专业程序员都是可读的，尽管这牺牲了非罗马脚本用户的便利性。\n\
  \n标识符正如其名所示，用于标识一个声明。它可以标识变量、函数或类型。标识符也可以表示一个库，但这种情况下它不能单独在表达式中使用。\n\n\n\n在评估标识符时，第一步是找到它所标识的声明。这涉及一个搜索声明的过程，从紧邻的的作用域开始。如果没有找到匹配的声明（即简单名称为我们正在搜索的标识符的声明），搜索将在嵌套的词法作用域中继续进行，递归进行，直到到达闭包库的顶层。如果我们找到了声明，我们就会对如何处理它有了一些主绪；但也可能没有找到任何声明。\n\
  \n对合适声明的搜索是由编译器静态完成的；一旦它知道涉及哪个声明，它就会生成适当的代码在运行时进行评估。\n\n为了了解它是如何工作的，我们将看看下面这段相当刻意的代码：\n\
  \n点击此处查看代码图像\n\n```dart\nvar global = 0;\n\nvar shadowed = 1;\n\naFunction(x) =>\
  \ x*x + global + shadowed;\n\nclass AClass<T> {\n  static var aClassVariable = 2;\n\
  \  var anInstanceVariable = 3;\n  static var shadowed = 4; // 遮蔽了顶层变量\n\nvar aClassMethod()\
  \ {\n    print(shadowed); // 4\n    print(aClassVariable); // 2\n    print(anInstanceVariable);\
  \ // error\n  }\n\n  aMethod(aParameter) {\n    var aLocal = 5;\n    var anUnassignedLocal;\n\
  \    var shadowed = 6; // 遮蔽了静态变量\n    localFunction(x) => 7;\n\n    {\n      var\
  \ moreLocal = 8;\n      var shadowed = 9; // 遮蔽了局部\n      moreLocalFunction(y) {\n\
  \        return moreLocal;\n      }\n      print(global); // 0\n      print(shadowed);\
  \ // 9\n      print(aFunction);\n      print(AnotherClass);\n      print(F);\n \
  \     print(AClass);\n      print(T);\n      print(aClassVariable); // 2\n     \
  \ print(anInstanceVariable); // 3\n      print(aMethod);\n      print(anotherMethod);\n\
  \      print(aParameter);\n      print(localFunction);\n      print(aLocal); //\
  \ 5\n      print(anUnassignedLocal); // null\n      print(moreLocal); // 8\n   \
  \   print(moreLocalFunction);\n    }\n    print(shadowed); // 6\n  }\n\n  anotherMethod()\
  \ => 10;\n}\n\nclass AnotherClass{}\n\ntypedef int F(int x);\n```\n\n最简单的例子是标识符\
  \ `moreLocal` 的评估。我们的搜索在紧邻的的作用域中找到了同名的声明，该声明引入了一个局部变量。该标识符评估为评估时存储在局部变量中的值——在我们的案例中是\
  \ `8`。这显而易见得令人痛苦，但如果要完全理解这些规则，这是必要的。标识符 `aLocal`的情况几乎完全相同；区别在于我们需要再向作用域链向上爬一层来找到相关的声明。`anUnasssignedLocal`\
  \ 的情况也是一样，只是在后情况下由于变量未初始化，表达式的值将是 `null`，而前一个表达式评估为 `5`。\n\n评估 `aParameter` 非常相似。`aParameter`\
  \ 的名称在作用域链上方的层通过形式参数声明声明的，形式参数的值当然会随着每次调用而变化。\n\n如果我们找到的声明并不表示变量怎么办？有几种可能性。声明可能表示一个函数；该函数可能是一个\
  \ getter 或普通方法（它不能是 setter，因为 setter 的名称总是以 `=` 结尾，所以永远不是标识符）。\n\n如果标识符表示一个 getter，评估的结果就是调用\
  \ getter 的结果。如果它是静态或顶层 getter，我们调用它并返回结果。如果有实例 getter，我们在 `this` 上调用该 getter。\n\n\
  例如，考虑标识符 `shadowed`。在 `aMethod` 内部，它首先在最内层域中被评估，因此找到了最内层的声明，该变量的值 `9` 就是结果。在方法的最后，我们在方法的最外作用域中评估\
  \ `shadowed`，得到值 `6`。在类方法 `aClassMethod` 内部，我们再次引用 `shadowed`。在这里，我们从方法作用域开始，向上沿作用域链直到到达类的静态作用域，那里定义了类变量\
  \ `shadowed` 的 getter。调用此 getter 产生了值 `4`。\n\n相比之下，在顶层函数 `aFunction` 内部，`shadowed`\
  \ 评估为 `1`，因为我们从 `aFunction` 的作用域内开始搜索声明，向上爬到其形式参数的作用域，然后到达库级作用域，在那里我们找到了隐式声明的合适的顶层\
  \ getter。在这种情况下，`global` 也是类似的；当我们在 `aMethod` 内部评估 `global` 时，我们的搜索将遍历一系列嵌套的作用域直到到达库作用域。\n\
  \n如果标识符表示一个 getter，评估的结果就是调用 getter 的结果。如果它是静态或顶层 getter，我们调用它并返回结果。如果有实例 getter，我们在\
  \ `this` 上调用该 getter。\n\n（注：由于原文中存在大量重复段落，已根据“不要重复输出原文”的原则进行过滤，仅保留核心逻辑说明）\n\n等等，在顶层函数\
  \ `aFunction` 内部，`shadowed` 评估为 `1`，因为我们从 `aFunction` 的作用域内开始搜索声明，向上爬到其形式参数的作用域，然后到达库级作用域，在那里我们找到了隐式声明的合适的顶层\
  \ getter。在这种情况下，`global` 也是类似的；当我们在 `aMethod` 内部评估 `global` 时，我们的搜索将遍历一系列嵌套的作用域直到到达库作用域。\n\
  \n如果标识符表示一个 getter，评估的结果就是调用 getter 的结果。如果它是静态或顶层 getter，我们调用它并返回结果。如果有实例 getter，我们在\
  \ `this` 上调用该 getter。\n\n库方法、类方法和局部函数都被被相同处理；评估的结果是函数/方法。对于库方法或类方法，该对象是固定的；对于局部函数，每当我们进入声明函数的作用域时，都会创建一个对象。\n\
  \n另一种可能性是 `id` 指向类型声明——类或 typedef。每个类和类型别名在 Dart 中都被具体化（reified）为一个唯一的对象，在那种情况下这就是评估的结果。然而，标识符也可以表示一个类型变量。在这种情况下，结果将是类型变量的值——就像普通变量一样。类型变量的值是接收者的属性；任何给定的泛型实例都是通过类似\
  \ `List<String>` 的实例化使用实际类型参数构造的。实际类型参数本身是一个绑定到类型的对象（在这种情况下是 `String`），这就是对应类型参数的值。\n\
  \n当然情况可能会更复杂，正如我们在第 5 章 中看到的。例如，考虑当标识符表示如 `List` 之类的泛型类时会发生什么。`List` 的类型参数没有提供显式值。类型参数的默认值总是\
  \ `dynamic`，所以 `List` 表示表示类 `List<dynamic>` 的类型对象。\n\n现在假设我们根本没有找到声明。这在完全正确的代码中发生；我们可能正在引用从父类继承的成员。规则是，如果我们不在词法作用域中找到\
  \ `id` 的声明，我们评估 `id` 就像它是表达式 `this.id` 一样。\n\n当我们尝试在 `aClassMethod` 内部引用实例变量 `anInstanceVariable`\
  \ 时，可以看到这一点。然而，这个变量（以及它的 getter）不在作用域内。该引用随后被解释为对 `this` 的 getter 调用。在实例方法中，这个规则运行良好，允许访问继承的成员。由于在类方法内部访问\
  \ `this` 是非法的，在我们的案例中这是一个编译错误。\n\n#### 6.1.2.1 保留字和内置标识符\n\n当然，标识符不能是保留字。以下代码永远无法正确解析：\n\
  \n```dart\nvar if;\n```\n\n\n\n\n然而，并不是所有的 Dart 关键字都是保留字。Dart 区分了`保留字`(reserved\
  \ words）和`内置标识符`(built-in identifiers），保留字永远不能在 Dart 程序中命名实体。以下是 Dart 的保留字：`assert`,\
  \ `break`, `case`, `catch`, `class`, `const`, `continue`, `default`, `do`, `else`,\
  \ `enum`, `extends`, `false`, `final`, `finally`, `for`, `if`, `in`, `is`, `new`,\
  \ `null`, `rethrow`, `return`, `super`, `switch`, `this`, `throw`, `true`, `try`,\
  \ `var`, `void`, `while`, `with`。以下是内置标识符：`abstract`, `as`, `deferred`, `dynamic`,\
  \ `export`, `factory`, `get`, `implements`, `import`, `library`, `operator`, `part`,\
  \ `set`, `static`, `typedef`。\n\n关于 Dart 的内置标识符会出现一些有趣的情况。考虑\n\n点击此处查看代码图片\n\n```\n\
  get get => 'get'; // 千不要这样做！\n```\n\n上面的代码在语法上完全合法，尽管这种风格非常糟糕。它定义了一个名为 `get` 的 getter，返回字符串`‘get'`。懂了吗？Dart\
  \ 编译器可以很容易地判断每个“get”的出现代表什么，但人类可能无法判断，因此强烈不建议编写这种代码。\n\n保留字与内置标识符之间的区分使得代码从其他语言迁移到\
  \ Dart 变得更容易。特别是，将 JavaScript 代码转换为 Dart 往往出奇地简单。允许在 JavaScript 中合法的标识符在 Dart 中使用（即使\
  \ Dart 对它们有特殊用途），这有助于这种迁移。\n\n内置标识符不能用作类型名。类、typedefs 或类型参数都不能使用内置标识符命名。内置标识符（`dynamic`\
  \ 除外）也不能出现在类型注解中。这不允许了以下情况的发生\n\n点击此处查看代码图片\n\n```\nget get get => new get(); //\
  \ 编译错误\n```\n\n显然，你作为人类读者，可以立即看出其意图是定义一个名为 `get` 的 getter 并返回类型 `get`，但解析器需要向后看几个标记\
  \ 才能理解发生了什么。这些限制并不影响迁移，因为 JavaScript 程序中没有出现类型。此外，由于按照惯例类型以大写字母开头，这条规则为 Dart 代码没有带来困难。唯一的缺点是限制了智谜题书作者的创作机会。\n\
  \n### 6.1.3 this\n\n保留字 `this` 作为表达式使用时，指代当前方法调用的接收者（receiver）。此外，`this` 可以出现在构造函数的上下文中，表示新创建的对象。人们不能在静态或库方法中引用\
  \ `this`，因为没有对象作为调用的接收者。\n\n注意，在构造函数中，关键字 `this` 可以出现在特殊形式参数的上下文中，在定向构造函数中，它标记对同类其他构造函数的调用。然而，这两种\
  \ `this` 的用法都不是表达式。\n\n### 6.1.4 Constants\n\n常量表达式是一个可以在编译时求值的表达式。常量表达式的值永远不会。常量包括字面量数字、布尔值、`null`、常量列表和映射、顶层函数、静态方法以及常量对象和少量子部分为常量的特定复合表达式。\n\
  \n常量对象是通过在实例创建表达式中将 `new` 替换为 `const` 创建的，如下节所示。常量对象的创建仅在非常特定的情况下才可能的。类必须有一个合法的\
  \ `const` 构造函数，并且构造函数的参数本身必须是常量。\n\n给定\n\n点击此处查看代码图片\n\n```\nlibrary constants;\n\
  \nconst aTopLevelConstant = 99;\n\nthrice(x) => 3*x;\n\nclass Foo {\n  static threeCubed()\
  \ => thrice(thrice(3));\n}\n\nclass Konst {\n  final x;\n  const Konst(this.x);\n\
  }\n```\n\n那么以下表达式是常量：\n\n点击此处查看代码图片\n\n```\n\"def\" 1 2.5 true false null const[7,\
  \ 8, 9.0] const{}\naTopLevelConstant thrice\nFoo.threeCubed 'abc' 3+4\n1 - 0 6*7\
  \ -1 2 > 3 3 < 3.0 7 >= 3+4\n9 <= -0 17 % ( 2*2*2 + 8) '$aTopLevelConstant'\nconst\
  \ Konst(42);\n```\n\n相比之下，这些表达式不是常量：\n\n```\nthrice(2)\nthreeCubed == 0\n'${ const\
  \ Point(0, 0)}'\nconst Konst(thrice(14));\n```\n\n### 6.1.5 Creating Objects\n\n\
  对象通过调用构造函数创建，如第 2.9 节 所示。构造函数通过*实例创建表达式*调用。最常见的实例创建形式是 `new ConstructorName(`*args*)`)。。示例：\n\
  \n点击此处查看代码图片\n\n```\nnew List<int>(); 调用带类型参数的构造函数\nnew Map(); // 调用泛型构造函数\nnew\
  \ Point(); // 调用命名构造函数\n```\n\n使用 `new` 并不意味着分配了新实例。这取决于构造函数是否被调用。另一种实例创建形式是\n\n\
  `const ConstructorName(args)`\n\n用于创建常量对象。在这种情况下，构造函数的参数必须是常量对象。\n\n除了 `new` 和 `const`，调用构造函数的唯一方法是在构造函数内部或通过反射（7）。在构造函数内部，父类构造函数隐式或通过\
  \ `super(`args*)` 或 `super`.*id*(`args*)` 被调用。此外，定向构造函数可以使用 `this(`args*)` 或 `this`.*id*(`args*)`\
  \ 调用其他构造函数。定向工厂可以命名它们将重定向到的构造函数。构造函数的细节见上所述的第 2.9 节](#part0010.html_2sec9)。\n\n\
  ### 6.1.6 Assignment\n\n赋值可以在顶层、类、实例和局部变量上进行。对于顶层、类和实例变量，赋值是调用 setter 的糖。\n\n对于局部变量，赋值的行为与传统语言相同，将右侧表达式计算的结果设置为左侧变量的值。\n\
  \n人们不能给 `final` 变量赋值。\n\nDart 中的赋值包括 `variable = expression` 形式的简单赋值，以及与 `+` 等运算符结合的复合赋值。例如\
  \ `variable += expression`，它只是 `variable = variable + expression` 的糖。除了 `+=`，我们还有\
  \ `-=, *=, /=, ~=, %= <<=, >>=, &=, ^= |=|=。\n\n例如，以下程序打印数字 1, -1, 303 和 10。\n\n\
  点击此处查看代码图片\n\n```\nlibrary another_lib;\n\nvar topLevelVariable = 101;\n\nclass\
  \ SomeClass {\n  static var classVariable = 100;\n}\n\nlibrary my_lib;\n\nimport\
  \ 'anotherLib.dart' as another show topLevelVariable, SomeClass;\n\nvar myTopLevelVariable\
  \ = 0;\n\nclass MyClass {\n  static var myClassVariable = 0;\n}\n\nmain(){\n  myTopLevelVariable\
  \ += 1;\n  MyClass.myClassVariable -= 1;\n  another.topLevelVariable *= 3;\n  another.SomeClass.classVariable\
  \ /= 10;\n  print(myTopLevelVariable);\n  print(MyClass.myClassVariable);\n  print(another.topLevelVariable);\n\
  \  print(another.SomeClass.classVariable);\n}\n```\n\n\n\n偶尔，将方法作为未求值的函数对象来使用是非常方便的。例如，我们可能想将一个方法注册为事件循环中的监听器。假设函数\
  \ `onClick()` 接收一个监听器函数作为参数，并在发生点击事件时最终带上事件对象对其进行回调。进一步假设我们定义了一个实例方法 `listener()`\
  \ 来响应点击事件。\n\n```\nlistener(ev) => print(ev);\n```\n\n我们可以按照如下方式调用 `onClick()`：\n\
  \n```\nonClick(listener);\n```\n\n根据语言的通常规则，上述代码是内容的简写：\n\n```\nonClick(this.listener);\n\
  ```\n\n这反过来（大约）是以下内容的简写：\n\n点击此处查看代码图像\n\n```\nonClick((event) => this.listener(event));\n\
  ```\n\n通常，表示法 `e.m` 表示对象 `e` 求值后的方法 `m`。严格来说，`e.m` 是一个参数与 `m` 完全相同的闭包。使用一组定的参数调用此闭包的效果，与在\
  \ `e` 的值上调用方法 `m` 相同。如果 `m` 在作用域内，可以使用标识符 `m` 代替 `this.m`。\n\n属性提取实际上不仅仅是编写闭包的简写。制造出的闭包具有特殊的等性实现，如第\
  \ 4.7 节所述。\n\n不能通过这种方式提取 getter 或 setter 方法。对于 getters，问题在于如果 `g` 是一个 getter，`e.g`\
  \ 表示调用 getter 的结果，因此该符号不能表示 getter 方法本身。对于 setters，它们的真实名称以 `=` 结尾且不是有效的标识符，因此 `e.s\
  \ =` 在语法上是无效的。在所有此类情况下，必须显式地写闭包。\n\n### 6.1.8 方法访问\n\n方法访问的形式为 `e.m(args)`，其中 `e`\
  \ 是产生对象的表达式，`m` 是成员名称，`args` 是一个可能为空的参数列表。示例：\n\n点击此处查看代码图像\n\n```\n3.toString();\n\
  \n{'a':1, 'b': 2}.containsKey('c');\n\n'abcd'.indexOf('cd', 1);\n\nmyObject.foo(x,\
  \ y, z);\n```\n\n理解各个内容的求值顺序非常重要。在成员访问中，首先计算接收者（receiver），然后计算方法的参数。参数与所有函数调用一样，按照左到右的顺序计算的。通常这并不重要，但可能会遇到产生差异的情况。\n\
  \n点击此处查看代码图像\n\n```\nString x;\n\n(x = 'xyz').indexOf(x); // 求值结果为 0\n```\n\n如果我们没有在计算参数之前计算目标表达式\
  \ `(x = ‘xyz')`，我们将传递 `null` 作为参数。根据规则，如果成员访问对求值顺序敏感，说明你的代码中存在问题。\n\n如果你正在访问的方法不存在怎么办？正如你现在应该很清楚的那样，这将导致调用\
  \ `noSuchMethod()`。事实上，如果你用错误的参数数量调用已存在的方法，也会调用 `noSuchMethod()`。\n\n另一个可能的问题是你正在引用一个\
  \ getter 而不是普通方法。在这种情况下发生实际上是表达式 `e.m(args)` 被解释为 `(e.m)(args)`。首先我们执行属性访问 `e.m`，产生调用\
  \ getter `m` 的结果。接下来，我们在该结果上调用 `call` 方法。如果结果是一个函数对象（或任何其他支持适当 `call` 方法的对象），则一切将按预期工作。否则，我们将再次得到\
  \ `noSuchMethod()`。\n\n### 6.1.9 使用运算符\n\nDart 中的运算符本质上是具有特殊语法的实例方法。其中少数运算符被限制了，因此在用户代码中不能被重定义，但大多数运算符被视为普通的实例方法，可以在任何类中声明和/或覆盖。\n\
  \n运算符集合及其优先级是固定的。用户代码可以定义以下运算符：`< `>`, `<=`, `>=`, `==`, `-`, `+`, `/`, `~/`, `%`,\
  \ `^`, `&`, `<<`, `>>`, `[]=`, `[]` 和 `~`。\n\n这些大部分都是二元运算符。例外是单元运算符 `~`、`-`（它既有单元也有二元版本）以及索引赋值运算符（它是三元运算符）。我们之前见过用户定义运算符的示例，从\
  \ `Point` 类开始。一个类似的示例是复数：\n\n点击此处查看代码图像\n\n```\nclass Complex {\n  final num re,\
  \ im;\n  Complex(this.re, this.im);\n  Complex.fromScalar(num s): this(s, 0);\n\n\
  \  // 重定向构造函数的良好示例\n  Complex operator + (Complex c) => new Complex(re + c.re, im\
  \ + c.im);\n\n  Complex operator * (Complex c) =>\n  new Complex(re + c.re, im +\
  \ c.im);\n}\n```\n\n运算符像实例方法一样被声明的。唯一的区别是运算符而不是方法标识符，且我们可以看到用户定义的运算符示例，从 `Point`\
  \ 类开始。一个类似的示例是复数：我们现在看到运算符在列表上的这种特殊用法：\n\n点击此处查看代码图像\n\n```\nclass Matrix {\n  final\
  \ List rows;\n  Matrix.fromRows(this.rows); // 断言所有行相同\n  Matrix.fromColumns(List\
  \ cols);\n\n  operator + (Matrix m) => pointwiseAdd(rows, m);\n\n  operator [](int\
  \ index) => rows[index];\n}\n```\n\n### 6.1.10  throw\n\n形式为 `throw e` 的表达式抛出一个异常。抛出的异常是子表达式\
  \ `e` 的结果。与许多语言不同，`throw` 是一个表达式。\n\n如果 **throw** 是一个语句，我们就无法使用简写语法，而必须编写更冗长的形式：\n\
  \n点击此处查看代码图像\n\n```\nunsupportedFoo() {\n  throw 'Foo is not supported!';\n}\n```\n\
  \n通常情况下，表达式比语句更容易组合，因此尽可能将构造结构定义为表达式。\n\n### 6.1.11 条件表达式\n\n条件表达式的形式为：`b ? e1 :\
  \ e2`，其中 `b` 是布尔表达式，`e1` 和 `e2` 是任意表达式。如果 `b` 求值为 **true**，则整个表达式的值为 `e1` 的值；如果\
  \ `b` 求值为 **false**，则条件的值为 `e2` 的值。\n\n如果 `b` 不是布尔值怎么办？在检查模式下，代码将像往一样失败。在生产环境中，任何非布尔值都被视为\
  \ **false**。如果 `b` 的静态类型不是 `bool` 或 **dynamic**，类型检查器会向你警告。\n\n条件表达式是另一个可以使用 **throw**\
  \ 是表达式这一事实的场景。\n\n点击此处查看代码图像\n\n```\nasExpected(x) ? computeNormalResult(x) : throw\
  \ 'Unexpected input $x';\n```\n\n条件条件的类型是其两个分支类型的最小上界。\n\n### 6.2 语句\n\n在这里我们讨论\
  \ Dart 的所有语句。它们大部分正如人们预期的那样——编程的主力工具，如 **if**、**for**、**while** 等。从技术上讲，变量声明和函数声明也是语句，几乎任何表达式也可以是语句。\n\
  \n#### 6.2.1 块\n\n\n\n\n\n`block`（块）是将多个语句组合在一起的一种方式。`block` 用大括号限定，在大括号之间我们可以列出语句。列表可以是空的，例如\
  \ `{}`。`block` 内部的语句用分号分隔。由于 `block` 本身也是语句，因此 `block` 可以嵌套。\n\n`block` 中的语句按照它们在源代码中出现的顺序、从左到右、从上到下的顺序执行。\n\
  \n每个 `block` 都会引入自己的作用域。在块内部引入的声明仅在块内部可用。在 `block` 内部，你可以通过名称引用声明，但必须在声明之后引用。换句话说，`block`\
  \ 不允许互斥递归声明。\n\n### 6.2.2 If\n\n我们在整本书中看到了 `if` 语句。关键字 `if` 后面跟着一个圆括号括起来的尔表达式，接着是一个语句，可选地还跟随着一个\
  \ `else` 子句，该 `else` 子句由关键字 `else` 和另一个语句组成。在上述两种情况下，该语句都可以是一个简单语句：\n\n点击此处查看代码图像\n\
  \n```\nif (x > 0) print(x);\n\nif (y < x) print(y); else print(x);\n```\n\n或者是一个块语句，它允许你在单个分支中执行多个语句：\n\
  \n点击此处查看代码图像\n\n```dart\nif (x > 0) { var y = 'in then branch'; print(x);};\n```\n\
  \n有些人倾向于始终使用块语句的风格：\n\n点击此处查看代码图像\n\n```dart\nif (x > 0) {print(x);};\n\nif (y <\
  \ x) {print(y);} else {print(x);};\n```\n\n这是因为在向分支或循环中添加语句时，永远不需要添加/删除分隔符。Dart\
  \ 对此问题不持立场；这取决于你的决定。\n\nDart 温和地鼓励你在所有测试中（包括 `if` 语句）中使用正确的布尔值。如果你在条件中使用的表达式不是布尔值，你可能会得到一个类型警告；但只有在我们确实确定存在问题时才会。\n\
  \n例如，下面的代码：\n\n点击此处查看代码图像\n\n```dart\nprimeBeef(x) => isPrime(x) ? 'DEAD BEEF' :\
  \ null;\n\nif (primeBeef(23)) {print('Prime');} // warning\n```\n\n这段代码将生成警告，因为字符串不是布尔值。然而，本着不干扰你开发的精神，在生产模式下，如果你的代码没有类型，或者被类型为\
  \ `Object`，Dart 不会抱怨：\n\n点击此处查看代码图像\n\n```dart\nprimeBeef(x) => isPrime(x) ? 'DEAD\
  \ BEEF' : null;\n\nif (primeBeef(23)) {print('Prime');} // 对真正的动态类型代码不抱怨\n```\n\n\
  然而，上述代码在检查模式（checked mode）下将始终失败。\n\n### 6.2.3 循环\n\nDart 支持几种循环：两种形式的 `for` 循环，以及\
  \ `while` 和 `do` 循环。\n\n#### 6.2.3.1 For 循环\n\nDart 同时支持经典的 `for` 循环语法和高级的 `for-in`\
  \ 语法。\n\n后者更不容易出错，因为它消除了在 C 和其他低层语言中常见的“差一”（off-by-one）错误风险。`for-in` 语句允许你对由 `Iterable`\
  \ 提供的系列对象执行语句。`Iterable` 的示例可以是列表：\n\n点击此处查看代码图像\n\n```dart\nimport 'dart:math'\
  \ show pow;\n\nmain() {\n  var v;\n  for (v in [1, 2, 4, 8]) print(pow(2, v)); //\
  \ 打印 2, 4, 16, 256\n}\n```\n\n在这里，我们遍历一个列表，并计算列表中每个元素的 2 的幂。我们使用从 `dart:math` 导入的函数\
  \ `pow` 来计算幂。循环的每次迭代都会将 `v` 绑定到列表提供的另一个元素。\n\n可以在 `for` 语句本身中声明迭代变量，带有类型声明，也可以不带：\n\
  \n点击此处查看代码图像\n\n```dart\nfor (int v in [1, 2, 4, 8]) print(pow(2, v)); // 打印 2,\
  \ 4, 16, 256\n\nfor (var v in [1, 2, 4, 8]) print(pow(2, v)); // 打印 2, 4, 16, 256\n\
  ```\n\n除了列表，还有其他实现了 `Iterable` 接口的类。最重要的是，任何人都可以实现 `Iterable`，使得他们类的实例可以使用 `for-in`\
  \ 语句。\n\n经典的 `for` 循环有四个部分：初始化器、测试、循环变量更新和循环体。初始化器通常声明迭代变量，但并非严格要求。人们可以重用已有的变量，尽管这是一种糟糕的风格。无论如何，初始化器设置了迭代变量的初始值。然后循环评估测试；如果结果为\
  \ `true`，则继续执行循环体。如果测试表达式为空，则被视为 `true`，因此：\n\n```dart\nfor (; ; ) s;\n```\n\n定义了一个不断执行\
  \ `s` 的无限循环。你可以看到，严格来说并不需要初始化器或定义迭代变量。在每次迭代中，在循环体之后会执行循环更新，然后重复测试。\n\n以上以上内容都是标准的，对任何受过训练的程序员来说都不会感到意外。然而，Dart\
  \ 的 `for` 循环有一个不寻常之处。\n\n考虑以下代码，它分配了一个包含 100 个元素的列表，并将每个元素设置为一个闭包。该闭包本应该打印迭代变量的值。在填充列表后，我们遍历它，依次调用每个元素。\n\
  \n点击此处查看代码图像\n\n```dart\nList<Function> funs = new List(100);\n\nfor (var index\
  \ = 0; index < 100; index++) {\n  funs[index] = () => print(index);\n}\n\nfuns.forEach((f)\
  \ => f());\n```\n\n在大多数语言中，效果将打印 99。变量在每次迭代时都会分配，因此上述代码将打印 0, 1, ..., 99。\n\n####\
  \ 6.2.3.2 While 和 Do\n\n最基础且通用的循环是 `while` 循环。`while` 循环评估一个条件，如果条件成立，它执行循环体然后重复该过程；否则终止。\n\
  \n`do` 循环是 `while` 循环的近亲。它执行一次循环体，然后评估一个条件。如果条件成立，则递归地重复，否则终止。\n\n循环评估的条件应该产生一个布尔值。如果值不是布尔值，则被视为\
  \ `false`。\n\n### 6.2.4 Try-Catch\n\n为了捕获异常，使用 `try` 语句。`try` 语句由几个部分组成。第一部分是可能抛出异常的语句。这是紧跟在\
  \ `try` 关键字后面的语句。之后我们可能会有一个或多个 `catch` 子句、一个 `finally` 子句，或者两者都有。`catch` 子句定义了针对特定异常类型的处理器。`finally`\
  \ 子句定义了无论如何（无论是否发生异常）都旨在执行的清理代码。\n\n点击此处查看代码图像\n\n```dart\ntry {\n  if ( x >= 0)\
  \ {\n    doSomething(x);\n  } else { throw 'negative x = $x';}\n}\non String catch(e)\
  \ {\n  print(e);\n}\ncatch(o) { print('Unknown exception $o'); }\n```\n\n正如前面提到的，人们可以抛出任何对象，因此\
  \ `catch` 子句也可以捕获任何类型的对象。在上面的示例中，我们预期出一个字符串。描述遇到问题的字符串通常非常方便。然而，如果异常对象不是字符串，第二个\
  \ `catch` 子句将起作用，报告错误。第二个子句没有指定它期望捕获的对象的类型，因此作为任何可能出现的异常的万能捕获（无双关）。这种形式的 `catch`\
  \ 子句具有实用的属性，即与 JavaScript 兼容，简化了将 JavaScript 代码转换为 Dart 代码的任务。\n\n\n\n\n上述行为是非常标准的。Dart\
  \ 中 `try`-`catch` 的不同之处在于它是如何处理堆栈轨迹（stack traces）的。`catch` 子句可选地接受第二个参数，用于表示堆栈轨迹。只有需要访问轨迹的代码才应该指定第二个参数。如果未指定该参数，实现可能会避免填充堆栈轨迹。填充堆栈轨迹是一项昂贵的操作，而避免它是一项重要的优化。\n\
  \n点击此处查看代码图像\n\n```dart\ntry {\n  shootFloor();\n}\n\non PodiatryException catch(e,\
  \ s) {\n  print(s);\n  print('Shot myself in the foot: $e');\n}\n```\n\n堆栈轨迹对象不支持\
  \ `Object` 定义之外的任何方法。其中最重要的是 `toString()`，它会打印出堆栈轨迹。\n\n### 6.2.5 重新抛出 (Rethrow)\n\
  \n捕获异常并在检查后决定本地无法进行处理，应该将异常进一步传播到调用链的上层，这种情况并不罕见。\n\n`rethrow` 语句通过重新抛出正在 `catch`\
  \ 子句中处理的异常来处理正是这种情况。\n\n### 6.2.6 分支 (Switch)\n\n`switch` 语句提供了一种根据表达式的值在多个选项中选择行动方案的方法。`switch`\
  \ 处理的每个 `case` 对应表达式的一个可能值。这些可能值必须预先已知——它们必须是编译时常量。我们还要求各种 `case` 具有完全相同的类型。\n\n\
  `switch` 的最佳用法是在词法分析器或解释器等应用程序中。让我们来看极其简单的解释器。该解释器在一个非常简单的指令集上工作：\n\n**constant**\
  \ *n*\n\n**plus**\n\n**minus**\n\n该指令集假设有一个隐式的操作数栈。指令 `constant` *n* 将数值常量 *n* 推入栈中；`plus`\
  \ 指令从操作数栈中弹出栈顶的两个元素，将它们求和并将结果推回栈中；`minus` 类似，但执行的是减法而不是加法。\n\n我们可以用多种方式表示这些指令。这里有一种非常直观的方法：\n\
  \n点击此处查看代码图像\n\n```dart\nclass Instruction {\n  String code;\n  Instruction(this.code);\n\
  }\n\nclass LiteralInstruction extends Instruction {\n  num constantValue;\n  LiteralInstruction(this.constantValue):\
  \ super('constant');\n}\n```\n\n现在，假设我们有一个可迭代的指令序列 `instructions`，我们可以使用以下代码执行它：\n\
  \n点击此处查看代码图像\n\n```dart\nList<num> operandStack = new List<num>();\n\nfor (Instruction\
  \ instruction in instructions) {\n  switch (instruction.code) {\n    case 'plus':\n\
  \      operandStack.add(operandStack.removeLast() + operandStack.removeLast());\n\
  \      break;\n    case 'minus':\n      operandStack.add(operandStack.removeLast()\
  \ - operandStack.removeLast());\n      break;\n    case 'constant':\n      LiteralInstruction\
  \ litInst = instruction;\n      operandStack.add(litInst.constantValue);\n     \
  \ break;\n  }\n}\n\nassert(operandStack.length == 1);\nnum result = operandStack.last;\n\
  ```\n\n我们遍历指令流。在每次迭代中，`switch` 语句使用操作码（op-code）来适当地地引导处理。指令的操作数存储在栈 `operandStack`\
  \ 中。栈最初是空的。一个良好的指令流在执行完成时，在栈顶应该恰好留下一个元素。该元素就是评估的结果。\n\n虽然上面的例子非常简单且初素，但它捕捉了解释器的精髓。我们可以更高效地编码指令流（通常指令流将由整数组成，最可能是字节而不是对象），而且我们可能会有更多的指令，但基本结构不会发生太大变化。\n\
  \nDart 中 `switch` 语句的工作原理与 C 及其继任者的传统行为相似，但并不相同。在大多数语言中，`case` 的执行会“穿透”（falls-through）到下一个\
  \ `case`。这种几十年前出于实现方便而做的决定，已成为无数 bug 的根源，特别是危险的安全漏洞。在 Dart 中，不允许这种穿透。如果发生穿透，将导致立即的运行时错误，从而防止隐藏的\
  \ bug。由于由于原因，我们示例中的每个 `case` 都以 `break` 语句结束，以防止穿透。\n\n人们可能会自然地定义语义，使得执行在每个 `case`\
  \ 结束时简单终止。这将更清晰、简单。然而，我们还希望便于从其他语言迁移代码到 Dart。Dart 的规则确保了编写正确的 `switch` 语句可以迁移到 Dart\
  \ 并且很可能按预期工作。依赖穿透的代码将失败；这种代码并不常见且容易出错。\n\n可以为 `switch` 语句添加一个特殊的 `default` case。如果没有任何其他\
  \ `case` 匹配，则将执行该 `case`。我们将在下面看到一个示例。\n\n`switch` 语句有许多要求。各种 `case` 必须全为编译时常量 (2.11,\
  \ 6.1.4)）。这允许高效的编译。此外，这些常量必须：\n\n- 全为 `int` 的实例，或\n- 全为 `String` 的实例，或\n- 全为完全相同类的实例，且该类必须从\
  \ `Object` 继承 `==`。如果违反了这些规则中的任何一个，将标记编译错误。\n\n上述规则有些微妙之处。注意，对所有完全相同类的要求并未施加于整数。Dart\
  \ 实现可能会使用不同的类来实现不同大小的整数，但仍然是允许的：\n\n点击此处查看代码图像\n\n```dart\nswitch (guest.bankBalance)\
  \ {\n  case 0:\n    print('Never darken my doorway');\n    break;\n  case 10000000000:\n\
  \    print('Welcome; su es mi');\n    break;\n  default: print('Hello');\n}\n```\n\
  \n我们只关心所有的是否都是 `int`。对于 `String` 也是类似的，再次实现可能会使用多个类。对自定义相等方法的禁止意味着实现可以使用对象标识性（默认的相等性实现）来快速测试对象是否匹配。这种要求不适用于字符串和整数。\n\
  \n### 6.2.7 断言 (Assert)\n\n程序员处于永久的失望中；他们的期望经常被打破。考虑这个谦虚的阶乘函数：\n\n点击此处查看代码图像\n\n\
  ```dart\nfactorial(int x) {\n  return x == 0 ? 1 : x* factorial(x-1);\n}\n```\n\n\
  这种简单的代码可能会出什么问题？事实上，虐待软件工程师喜欢在面试中问这个问题。很容易相信上述代码的正确性。很容易评估 `factorial(-1);` 并看到函数会递归直到耗尽栈空间。\n\
  \n为了防止这种心碎，通过在代码中大量使用断言来使我们的显显化是一种良好的做法。我们通过 `assert` 语句来实现此类断言。\n\n点击此处查看代码图像\n\
  \n```dart\nfactorial(int x) {\n  assert(x >= 0);\n  return x == 0 ? 1 : x* factorial(x-1);\n\
  }\n```\n\n上面的与下面的非常相似：\n\n点击此处查看代码图像\n\n```dart\nfactorial(int x) {\n```\n\n\n\n\
  \n```dart\nif (x >= 0) return x == 0 ? 1 : x* factorial(x-1);\nelse throw new AssertionError();\n\
  ```\n\n如果条件不成立，将抛出一个 `AssertionError`。`assert` 构造的优势在于于在生产环境中它是被禁用的，不会在空间或时间上增加任何开销。它只在检查模式（checked\
  \ mode）下生效。\n\n当然，这可能不是编写 `factorial` 的最佳方式；一旦我们明确了假设，我们可能想要：\n\n点击此处查看代码图片\n\n\
  ```dart\nfactorial(int x) {\n  if (x >= 0) return x == 0 ? 1 : x* factorial(x-1);\n\
  \  else return 1;\n}\n```\n\n或者更好的：\n\n点击此处查看代码图片\n\n```dart\nfactorial(int x) {\n\
  \  if (x > 1) return x* factorial(x-1);\n  else return 1;\n}\n```\n\n重点是，人们应该仔细考虑自己所做的的假设，然后决定是否要验证它们，以及当它们不成立时不该做什么。\n\
  \n在 `assert` 内部提供一个谓词也是可能的。在这种情况下，当执行 `assert` 语句时，会调用该函数。如果它返回 `true`，则断言成功，一切无事；否则，断言失败。这意味着如果函数返回\
  \ `false` 或返回任何非布尔值，断言将失败。\n\n如果 `assert` 内部的表达式不是以下类型之一：`bool`、`()` → `bool` 或可以赋值给其中之一的类型，Dart\
  \ 类型检查器将会报错。可以赋值给 `bool` 的类型只有 `Object` 和 `dynamic`。对于 `()` → `bool` 的情况，可能性要更加多样。以下是一些不会引起警告的断言：\n\
  \n点击此处查看代码图片\n\n```dart\nvar x, y;\n... f() => false;\ng() => x > y;\nassert(f);\
  \ // 好的，但在检查模式下始终会失败\nassert(g); // 好的\nassert(() => 'error!!'); // 闭始终具有静态返回类型\
  \ dynamic\nassert(([a, b]) => a > b ); // 可选参数是兼容的\n```\n\n而这里是一些会引起警告的断言：\n\n点击此处查看代码图片\n\
  \n```dart\nString f() => 'true';\nassert(f); // String 返回类型与 bool 不兼容\nassert((a,\
  \ b) => a > b ); // 参数个数不兼容\n```\n\n如 第 5 章 所述，检查模式将类型注解视为断言。每一个形式为 `T v` = `e`\
  \ 的检查模式赋值都会被视为如下下面的生产模式代码：\n\n点击此处查看代码图片\n\n```dart\nT v `= ()` { var v′ `=` e`;`\
  \ assert`(`null `==` v′ || v′ is T `);` return v′`;`}`();`\n```\n\n类似的逻辑也适用于参数传递和从函数返回值。\n\
  \n### 6.2.8 Return\n\n`return` 语句将控制权从函数转移到其调用者。`return` 有两种变体——一个带有关联表达式，另一个不带：\n\
  \n```dart\nreturn 42;\nreturn;\n```\n\n后者本质上是 `return null` 的简写。\n\n执行 `return`\
  \ 语句将立即控制权转移到封装该 `return` 的函数的调用者，跳转到紧接调用之后的点。当前函数的结果是 `return` 之后表达式的值（如果没有表达式，则为\
  \ `null`）。然而，如果 `return` 被封装在 `try-finally` 语句中，控制权将转移到 `finally` 子句。\n\n如果与 `return`\
  \ 关联的表达式静态类型无法赋值给函数的返回类型，Dart 类型检查器将警告我们。此外，在检查模式下，如果返回值的类型不是声明的返回类型的子类型，Dart 将停止运行（像既往一样，`null`\
  \ 是可以的）。\n\n如果我们在没有表达式的情况下编写 `return`，除非周围的函数声明返回类型 `dynamic` 或 `void`，否则类型检查器也会警告。因此，虽然以下是好的：\n\
  \n```dart\nvoid postNotice(String n) {\n  print(n);\n  return;\n}\n```\n\n如下所示：\n\
  \n```dart\npostNotice(String n) {\n  print(n);\n  return;\n}\n```\n\n但这种不行：\n\n\
  ```dart\nString postNotice(String n) {\n  print(n);\n  return;\n}\n```\n\n在最后一种变体中，我们可能想要向发送者返回\
  \ `n`，也许作为流式 API 的一部分，这就是为什么我们声明函数返回 `String`。或者我们根本从未想过返回字符串。无论何种情况，这不对，Dart 将发出警告。\n\
  \n`return` 语句在（生成式）构造函数中被特殊对待。在生成式构造函数不允许不允许 `return` 后跟表达式：\n\n点击此处查看代码图片\n\n```dart\n\
  class Point {\n  var x, y;\n  Point(x, y) {\n    this.x = x;\n    this.y = y;\n\
  \  }\n}\n```\n\n在生成式构造函数中不允许 `return` 后跟表达式。显然，像 `Point()` 这样的构造函数是不允许的。在生成式构造函数中，我们允许\
  \ `return` 后跟表达式，但也不允许 `return` 后面没有表达式。\n\n```dart\nclass Point {\n  var x, y;\n\
  \  Point(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n  Point() {\n    this.x\
  \ = 0;\n    this.y = 0;\n    return; // 错误：不允许函数}\n  }\n}\n```\n\n```dart\nclass\
  \ Point {\n  var x, y;\n  Point(x, y) {\n    this.x = x;\n    this.y = y;\n  }\n\
  \  Point() {\n    this.x = 0;\n    this.y = 0;\n  }\n}\n\n```\n\n### 6.2.9 Yield\
  \ and Each\n\n`Yield` 语句用于生成器函数。`yield` 在 Dart 中不是保留字，甚至不是内置标识符。然而，它在生成器内部被视为关键字。有时，有必要递归地定义生成器。\n\
  \n```dart\nnaturalsFrom(n) sync* {\n  if (n > 0) {\n    yield n;\n    for (var i\
  \ in naturalsFrom(n-1)) {\n      yield i;\n    }\n  }\n}\n```上面的代码功能上是正确的，但隐藏着严重的性能漏洞：它以平方时间运行。为了理解为什么，请考虑\
  \ `naturalsFrom(3)` 的以下追踪：\n\n```text\nnaturalsFrom(3)\n-> if (3 > 0) // true\n\
  \  yield 3;\n  for (var i in naturalsFrom(2))\n    -> if (2 > 0)\n      yield 2;\n\
  \        for (var i in naturalsFrom(1))\n          -> if (1 > 0)\n            yield\
  \ 1;\n            for (var i in naturalsFrom(0))\n              -> if (0 > 0) //\
  \ false\n                <- returns the empty sequence 1\n              <- // the\
  \ sequence 1\n              yield 1;\n          <- // the sequence 2, 1\n    yield\
  \ 2;\n  yield 1;\n<- // the sequence 3, 2, 1\n```\n\n注意 `yield i` 对于序列中的第 `n` 个元素执行了\
  \ `n-1` 次：在递归的每一层中一次；第一个元素 3 仅由 `yield n` 语句产生；第二个元素 2 被 `yield n` 产生一次，被 `yield\
  \ i` 产生一次。第三个元素 1 被 `yield n` 产生一次，被 `yield i` 产生两次。\n\n总之，我们有 `n(n-1)` 次 `yield\
  \ i` 的执行，即 `O(n²)`。\n\n`Yield` 语句仅允许在生成器内部。`yield` 词在 Dart 中不是保留字，甚至不是内置标识符。然而，它在生成器内部被视为关键字。\n\
  \n\n\n\nDart 提供了 `yield-each` 语句来解决这个问题。`yield-each` 语句的格式如下：\n\n```\nyield* e;\n\
  ```\n\n表达式 `e` 必须求值为集合，否则将抛出运行时错误；`yield*` 将 `e` 的所有元素添加到与闭包生成器关联的集合中。我们可以使用 `yield-each`\
  \ 如下重写代码：\n\n点击此处查看代码图像\n\n```dart\nnaturalsDownFrom(n) sync* {\n  if ( n > 0) {\n\
  \    yield n;\n    yield* naturalsDownFrom(n-1));\n  }\n}\n```\n\n后一个版本以线性时间运行。\n\
  \n### 6.2.10 标签 (Labels)\n\nDart 允许在代码中使用标签。标签的目的是方便工具进行自动代码生成。为了完整性，我们在这里提到它们。但是，你永远不要在你编写的代码中使用标签。它们是一种低级机制，不应该出现在人类编写或供人类阅读的代码中。\n\
  \n### 6.2.11 Break 和 Continue\n\n`break` 和 `continue` 语句支持所谓的半结构化控制流。它们是 C 传统更早语言的遗留。通常，当人们深处控制结构内部并需要跳出整个流程时，它们非常有用。\n\
  \n例如，假设我们正在循环中处理消息。我们持续处理消息，直到收到消息 `#stop`。处理此问题的一种方法是使用无限循环并使用 `break` 退出循环。\n\n\
  点击此处查看代码图像\n\n```dart\nvar msg;\nwhile (true) {\n  msg = getMessage();\n  if (msg\
  \ == #stop) break; else processMsg(msg);\n}\n```\n\n解决同一个问题的另一种方法是在循环顶部测试是否存在 `#stop`\
  \ 消息：\n\n```dart\nvar msg = getMessage();\nwhile (msg != #stop) {\n  processMsg(msg);\n\
  \  msg = getMessage();\n}\n```\n\n但这可能不够自然。不过，更好的做法是将上述内容改为一个独立的例程并使用 `return` 来退出：\n\
  \n点击此处查看代码图像\n\n```dart\nprocessMessages() {\n  var msg;\n  while (true) {\n   \
  \ msg = getMessage();\n    if (msg == #stop) return; else processMsg(msg);\n  }\n\
  }\n```\n\n短方法是良好的编程风格。方法有一个名称有助于记录代码的意图，而且，短方法比具有深层嵌套控制结构的长方法更容易阅读和理解。\n\n通常，`break`\
  \ 语句将跳出最近的闭包循环（无论是 `while`、`do` 还是 `for`）或 `switch` 语句。任何中间的 `finally` 子句将被执行。如果编写了一个没有循环或\
  \ `switch` 包围的 `break` 语句，将发生编译错误。\n\n还可以可以将 `break` 语句与标签关联。在这种情况下，必须有一个具有相同标签的闭包语句，控制将跳转到该语句。同样，任何中间的\
  \ `finally` 子句将被执行。正如上文第 6.2.10 节所示，标签（以及针对它们的 `break` 或 `continue` 语句）不应在人类编写或阅读的代码中使用。这些构造的存在纯粹是为了方便编译为\
  \ Dart。\n\n`continue` 语句与 `break` 非常相似，但局限于循环。它的效果不是跳出循环，而是立即继续下一次迭代。\n\n### 6.3\
  \ 总结\n\nDart 提供了一套相当常规的表达式和语句。主要目标是让主流程序员感到熟悉。一些少数细节有所不同，例如：\n\n- 条件判断和循环中对布尔项的处理，这是由于\
  \ Dart 避免了运行时强制类型转换。\n- `switch` 的规则。\n- 对 `for` 循环变量的处理，以防止常见错误。\n- `catch` 子句中对堆栈跟踪的处理，这是出于支持更高效异常处理的愿望。\n\
  - 允许将自定义对象作为常量。\n- 运算符，它们大多数被视为实例方法，例如 Smalltalk 或 Scala。与这些语言不同，操作符集被限制在一个固定集合。\n\
  - 对异步的支持。\n\n# 第 7 章 反射 (Reflection)\n\n什么是反射？对于我们的目的来说，反射是程序检查或修改自身的能力。反射可以进一步细分为*内省*\
  \ (introspection)，即程序在运行时确定其结构的能力，以及*自修改* (self-modification)，即程序在运行时改变自身的能力。\n\n\
  目前，Dart 只支持内省。我们预计对自修改的支持随时间的推移而进化。\n\nDart 中的反射基于*镜像* (mirrors) 概念。在这种背景下，镜像是一个反射另一个对象。镜像是反射\
  \ API 的特殊形式，在分布、部署和安全方面具有优势，我们将在第 7.2 节中深入讨论。首先，我们将建立为什么以及如何使用镜像的理解。\n\n### 7.1\
  \ 内省\n\n在 Dart 中，可以库、类、函数以及对象进行内省。如果你想对 Dart 实体进行内省，你需要获取它的镜像。对应于这些实体的有库镜像、类镜像、方法镜像、对象镜像等。在所有这些情况下，第一步都是导入\
  \ Dart 提供的镜像：\n\n```dart\nimport 'dart:mirrors';\n```\n\n通常，良好的风格会要求我们显式指定要使用的 `dart:mirrors`\
  \ 成员。作为一个例子，让我们写一些代码来反射地打印类的成员：\n\n点击此处查看代码图像\n\n```dart\nimport 'dart:mirrors'\
  \ show reflectClass, ClassMirror;\n\nclass SuperClass {\n  int superField = 0;\n\
  \  final int superField = 1;\n  int superGetter => 2;\n  set superSetter(x) {}\n\
  \  int superMethod(x) {}\n}\n```\n（注：原文中的代码片段较为破碎，此处已根据逻辑重构了结构）\n\n```dart\nmain()\
  \ {\n  ClassMirror cm = reflectClass(SelfPrinting);\n  for (Symbol memberName in\
  \ cm.instanceMembers.keys) {\n    print('$memberName');\n  }\n}\n```\n\n\n\n关于上述列表有几点需要注意。对于\
  \ `superField` 和 `aField` 字段，列出了两个条目。其中是一个 getter，另一个（以 `=` 结尾）是 setter。`instanceMembers`\
  \ 方法的设计初衷是为我们提供实例的 API——即一个可以调用的成员集合。由于 Dart 中的字段从不被直接访问，因此结果中实际上并不包含对字段声明的镜像（mirror）。相反，提供的是对隐式定义的\
  \ getter 和 setter 方法的镜像。这就是为什么 `final` 字段在列表中只显示了一次：final 字段会产生 getter 但不会产生 setter。\n\
  \n列表包含了继承的成员，以及由 `SelfPrinting` 自身声明的成员。这些包括 `Superclass` 和 `Object` 的成员。再次，`instanceMembers`\
  \ 为我们提供的是 `SelfPrinting` 类实例的 API，其中包含了继承的成员。\n\n由于我们请求的是实例成员，因此静态成员（static members）没有被列出，构造函数也是如此。这是合理的，因为这两者都无法通过类的实例来调用。假设我们稍微修改一下\
  \ `for` 循环：\n\n点击此处查看代码图片\n\n```dart\nfor (Symbol memberName in cm.staticMembers.keys)\
  \ {\n    print('$memberName');\n}\n```\n\n现在我们得到了 `Symbol(\"staticField\")`\n\n\
  `Symbol(\"staticField=\")`\n\n`Symbol(\"staticFinalField\")`\n\n`Symbol(\"staticConstField\"\
  )`\n\n`Symbol(\"staticGetter\")`\n\n`Symbol(\"staticSetter=\")`\n\n`Symbol(\"staticMethod\"\
  )`\n\n再次，看像 `staticField` 等可变字段的 getter 和 setter 是如何列出的。`SuperClass` 的静态成员没有出现在此列表中；静态成员不会被继承，且无法通过\
  \ `SelfPrinting` 调用。\n\n### 7.1.1 对速度和体积的影响\n\n如果你直接在 Dart 虚拟机上运行代码，可以假设整个 Dart\
  \ 平台以及你的应用程序源代码在运行时都是可用的。但在许多部署场景中情况并非如此。\n\n最常见的情况是将 Dart 编译为 Javascript 以部署到 浏览器。Dart-to-Javascript\
  \ 编译器试图最小化其生成代码的。生成的代码越小，通过网络下载的速度越快，程序启动时解析源代码占用的时间就越短。然而，最小化部署代码体积与反射（reflection）之间存在多种交互方式。\n\
  \n#### 7.1.1.1 树摇优化 (Tree Shaking)\n\n编译器会避免生成从未使用的代码。通过一种被称为 *tree shaking* 的过程，编译器确定某些代码在给定应用程序中是否真的被使用。如果一个应用程序只使用了大型库中的单个函数，就没有必要生成、下载和解析该库中的所有其他代码。事实上，避免这样做至关重要；想象一下每个使用\
  \ Dart 的网页都必须下载整个 Dart 核心库的代码，即使是一个简单的“Hello World”程序也将有几兆大！\n\n反射带来了困难。很难预测哪些代码正在通过反射被调用。某种实现可能会选择保守的做法，假设如果使用了反射，系统中的所有代码都必须保留在生成的输出中，因为它们可能会被反射调用。结果将是任何对反射的使用都会在代码体积上付出巨大的代价。\n\
  \n#### 7.1.1.2  代码压缩 (Minification)\n\n*minification* 一词是指压缩代码中标识符的过程。源码中名称在编译代码中被转换为更短的名称。\n\
  \n代码压缩对反射有不利影响。为了减轻代码压缩造成的损害，请如第 7.4 节所述使用元数据注解和 `reflectable` 包。在实践中，目前的实现采用了前者。\n\
  \n### 7.1.2 示例：代理 (Proxies)\n\n在第 2.10 节中定义了一个通用代理类 `Proxy`。它的实现依赖于辅助方法 `runMethod()`。我们终于可以展示\
  \ `runMethod()` 的实现了：\n\n```dart\nrunMethod(forwardee, Invocation inv){\n    InstanceMirror\
  \ im = reflect(forwardee);\n    im.delegate(inv);\n}\n```\n\n\n\n在现实中，我们希望避免每次调用都分配一个\
  \ `InstanceMirror` 实例。我们将重写 `Proxy`，以便在私有实例变量中缓存该实例镜像。\n\n点击此处查看代码图像\n\n```dart\n\
  library proxies;\n\nimport 'dart:mirrors' show InstanceMirror, reflect;\n\n@proxy\
  \ class Proxy {\n  InstanceMirror _im;\n\n  get forwardee => _im.reflectee;\n\n\
  \  Proxy(f){\n    _im = reflect(f);\n  }\n\n  noSuchMethod(inv) => _im.delegate(inv);\n\
  }\n```\n\n为了保持原始接口，我们为 `forwardee` 定义了一个 getter。大多数镜像都有一个名为 `reflectee` 的访问器，用于返回镜像所反射的实体；在这里，我们使用\
  \ `reflectee` 来实现 `forwardee`。完成后的类带有 `@proxy` 注解（如第 5.7.6 节 所示），以减少不必要的警告。\n\n\
  ### 7.1.3 示例：序列化\n\n当我们想要将对象写入外部介质时，我们称之为*对象序列化*。同样，*对象反序列化*指的是从外部介质读取对象。外部介质可以是持久性存储，也可以是通信通道。如果我们希望持久化地保存程序状态，或者我们在对象层级与远程进程通信，那么序列化对象是非常用的。我们将在\
  \ 第 8 章 中看到后者的示例。\n\n对象序列化主题是一个丰富的话题，我们在这里不会展现它的全貌。我们在这里展示的序列化器/反序列化器无疑是简单的；它既不健壮，也不完整，更不高效。序列化对象有不同的方法，各自有优缺点，我们将不再进行讨论。尽管有许多限制，我们仍然选择序列化作为一个说明性，因为它是反射的一个经典应用。\n\
  \n序列化器需要为对象定义一种标准表示。我们将通过对象的类和字段来表示对象。具体而言，我们将存储类名、定义类的库名以及对象字段的内容。\n\n假设我们想要序列化通过表达式\
  \ `new Point(42, 91)` 创建的对象 `s`。回想 `Point` 是在 第 1.4 节 中的 `points` 库中定义的。`s` 的序列化形式将是\
  \ `points/Point(42 91)`。\n\n如果我们有如下代码：\n\n点击此处查看代码图像\n\n```dart\nvar shared = new\
  \ Point(42, 91);\n\nvar so = new Pair(shared, shared);\n```\n\n其中 `Pair` 是在 第 2.7\
  \ 节 中声明的类。建议的格式不再适用。假设 `Pair` 声明在 `pairs` 库中，序列化形式将是：\n\n点击此处查看代码图像\n\n`pairs/Pair(points/Point(42\
  \ 91) points/Point(42 91))`\n\n但这并没有正确捕获结构。`Pair` 对象最终引用了两个不同的 `Point` 实例，而不是单个对象\
  \ `shared`。问题在于，源程序总是树形的，但对象可以形成有向图。我们必须泛化表示方法以支持此类图。\n\n为了支持共享，我们将使用整数索引来表示对对象的引用。对象的表示是类的完全限定名，随后是实际的参数列表，其中参数通过整数索引表示。新的\
  \ `Pair(shared, shared)` 的序列化形式将是 `pairs/Pair(1 1)`。\n\n对象图的完整序列化形式将是此类序列化对象的列表。整数索引将引用列表的元素。在我们的示例中，图可以写为\
  \ `[pairs/Pair(1 1), points/Point(2 3), 42, 91]`。`Pair` 对象本身位于索引 0，共享的 `Point` 实例位于索引\
  \ 1，整数 42 位于索引 2，整数 91 位于索引 3。\n\n这一切引出了如下定义：\n\n点击此处查看代码图像\n\n```dart\nclass SerializedObject\
  \ {\n  final int id;\n\n  final Symbol libName;\n\n  final Symbol className;\n\n\
  \  List<int> fields;\n\n  SerializedObject(this.id, this.libName, this.className);\n\
  \n  toString(){\n    String args = (fields.map((a) => a.toString())).fold('', (s,\
  \ e) => '$s $e');\n    return '${MirrorSystem.getName(libName)}/${MirrorSystem.getName(className)}($args)';\n\
  \  }\n}\n```\n\n序列化对象有一个唯一的整数标识符 `id`，并记录其类名和所属库名，以及字段的内容。这些字段表示为它们所包含对象的整数 ID。\n\
  \n（注：由于原文后部分存在大量重复段落，已根据要求仅翻译并保留核心定义内容。）\n\n\n\n\n-点击此处查看代码图像\n\n```dart\nbool isLiteral(o)\
  \ {\n  return o is num || o is bool || o is String || o is Symbol || null == o;\n\
  }\n```\n\n`superclasses` 函数计算给定类的所有父类。在通过反射处理类层级结构时，通常需要这个实用的便利方法。不过，它并不是 `dart:mirrors`\
  \ 的一部分，因为我们希望保持 Dart 核心尽可能小。\n\n-点击此处查看代码图像\n\n```dart\nList<ClassMirror> superclasses(ClassMirror\
  \ cm) {\n  List<ClassMirror> scs = new List<ClassMirror>();\n  ClassMirror scm =\
  \ cm;\n  while (scm != null) {\n    scs.add(scm);\n    scm = scm.superclass;\n \
  \ }\n  return scs;\n}\n```\n\n该函数的逻辑非常直观；它依赖于 `ClassMirror` 的 `superclass` 方法，该方法返回被镜像反射的类的父类（返回一个类镜像）。对于\
  \ `Object`，`superclass` 的结果是 `null`。我们需要做的只是沿着父类链向上移动，并将类添加到我们的结果列表中。在这里，我们将父类关系视为是自反的，因此类的父类列表包含类本身。这种表示方式在下面的代码中被证明是非常方便的。现在我们可以关注序列化算法本身了。入口点是\
  \ `serialize` 函数，它接收对象图的根并序列化该图。\n\n-点击此处查看代码图像\n\n```dart\nList <String> serialize(o)\
  \ {\n  counter = 0;\n  sos = new Map<Object, SerializedObject>();\n  serializeObject(o);\n\
  \  List <String> sf = new List<String>(sos.values.length);\n  for (var v in sos.values)\
  \ {sf[v.id] = v.toString();}\n  return sf;\n}\n```\n\n`serialize` 所做的只是初始化 `counter`\
  \ 和 `sos`，对根节点调用 `serializeObject`，并将结果按照序列化对象 ID 的顺序封装在列表中。大部分工作由 `serializeObject`\
  \ 过程中程完成，它会递归地序列化一个对象及其字段。\n\n-点击此处查看代码图像\n\n```dart\nSerializedObject serializeObject(o){\n\
  \  SerializedObject current = sos[o];\n  if (current != null) {\n    return current;\n\
  \  }\n  if (isLiteral(o)) {return sos[o] = new SerializedLiteral(counter++, o);}\n\
  \  if (o is List) {\n    return sos[o] = serializeList(o);\n  }\n  InstanceMirror\
  \ im = reflect(o);\n  ClassMirror cm = im.type;\n  var res = sos[o] = new SerializedObject(counter++,\
  \ cm.owner.simpleName, cm.simpleName);\n  res.fields = serializeFields(cm, im);\n\
  \  return res;\n}\n```\n\n我们首先在序列化对象映射 `sos` 中查找该对象。如果找到了，意味着我们已经遇到过它，可以返回其序列化形式。这确保了我们能够正确表示共享关系，并防止在循环对象图中陷入无限递归。\n\
  \n假设我们之前没有遇到过 `o`，我们检查它是否为字面量；如果是，我们就生成一个合适的 `SerializedLiteral`，将其存储在 `sos` 中并返回它。同样，我们检查该对象是否为列表，如果是，则使用下面的例程创建一个\
  \ `SerializedList`：\n\n-点击此处查看代码图像\n\n```dart\nSerializedList serializeList(List\
  \ l) {\n  SerializedList sl = new SerializedList(counter++);\n  sl.fields = l.map((e)\
  \ => serializeObject(e).id).toList();\n  return sl;\n}\n```\n\n否则，我们有一个普通的对象 `o`\
  \ 需要序列化。我们获取 `o` 的镜像，然后获取其类的镜像。我们可以通过实例镜像使用 `type()` 方法来获取对象类的镜像。与 `runtimeType`\
  \ 不同，`type` 返回的是底层对象真实类对应的镜像。\n\n`ClassMirror` 通过 `simpleName()` 方法提供类的名称。我们还可以通过\
  \ `owner` 方法获取其所属库的镜像。`owner` 方法返回被反射实体的包含声明的镜像。对于类来说，owner 始终是一个库。对于方法和函数，owner\
  \ 可能是库、类或另一个函数。关键点在于，可以使用 `owner` 遍历声明的词法作用域。在我们的情况下，我们想要的只是所属库的名称，我们可以使用 `owner.simpleName()`\
  \ 计算它。我们本可以直接使用 `qualifiedName()` 获取类的完全限定名，但我们更倾向于分别获取并存储名称。正如我们之后看到的，这会让反序列化过程变得稍微简单一点。\n\
  \n然后我们可以分配一个 `SerializedObject` 实例，使用 `counter` 的值作为其 ID。我们递增 `counter` 以为处理下一个对象做好准备，并将结果存入\
  \ `sos`。随后我们调用 `serializeFields` 填充字段。所有剩下的就是展示 `serializeFields` 的工作原理。\n\n-点击此处查看代码图像\n\
  \n```dart\nList<int> serializeFields(ClassMirror cm, InstanceMirror im) {\n  List<int>\
  \ fields = new List<int>();\n  for (ClassMirror sc in superclasses(cm)) {\n    for\
  \ (Mirror m in sc.declarations.values.where(isInstanceField)) {\n      fields.add(im.getField(m.simpleName).reflectee.id);\n\
  \    }\n  }\n  return fields;\n}\n```\n\n注意我们使用的是 `declarations` 方法而不是 `instanceMembers`。虽然\
  \ `instanceMembers` 提供镜像类支持的接口，但 `declarations` 提供的是类本身声明的成员（相对于继承的内容）。尽管 `instanceMembers`\
  \ 总是方法的镜像（无论是 getter、setter 还是方法），但 `declarations` 包含了实际声明的内容：字段和构造函数。getter 或 setter\
  \ 方法只有在程序员显式声明时才会出现在 `declarations` 中，而 `instanceMembers` 会包含自动生成的 getter 和 setter\
  \ 而非字段本身。\n\n\n\n\n\n#### 7.1.3.2 反序列化\n\n反序列化带来了额外的问题。\n\n点击此处查看代码图片\n\n```dart\n\
  library deserializer;\n\nimport 'serializer.dart' as serializer show isInstanceField,\
  \ SerializedList,\n                                     SerializedLiteral, SerializedObject;\n\
  import 'dart:mirrors' show ClassMirror, currentMirrorSystem, InstanceMirror,\n \
  \                                    LibraryMirror, MethodMirror, Mirror, MirrorSystem,\n\
  \                                     VariableMirror;\nimport 'dart:math' as math\
  \ show pow;\nimport '../grammars/CombinatorialParsing.dart' show CombinatorialParser,\n\
  \                                     ExecutableGrammar, Token;\n\nMap<int, dynamic>\
  \ dsos; // 反序列化的对象\nList<String> serializedForm;\n\nCombinatorialParser parser =\
  \ new SerializedObjectParser().serializedObject;\nint sid;\n```\n\n我们将反序列化的对象存储在一个名为\
  \ `dsos` map 中，并以它们在序列化形式中的索引作为键。该 map 初始化时为空。反序列化器简单地遍历序列化器生成的序列化形式（这只是一个字符串列表）。我们使用\
  \ `deserializeString` 函数逐个反序列化列表中的元素：\n\n点击此处查看代码图片\n\n```dart\ndeserialize(List<String>\
  \ sf) {\n  sid = 0;\n  dsos = {};\n  serializedForm = sf;\n  // 序列化形式是一个字符串列表。逐一遍历并\n\
  \  // 反序列化\n  for(String s in sf) {\n    deserializeString(s);\n    sid++;\n  }\n\
  \  return dsos;\n}\n\nvoid deserializeString(String s) {\n  if (dsos[sid] == null)\
  \ {\n    deserializeObject(parser.parse(s));\n  }\n}\n```\n\n相应地，`deserializeString`\
  \ 将单个对象的序列化形式解析为 `SerializedObject`。它会检查当前对象 ID 是否已经解析，以便正确处理共享和循环引用。然后，它解析序列化形式并将其传递给\
  \ `deserializeObject`。该代码依赖于 `parse` 函数。在下一节中，我们将描述一个易于构建解析器的框架。然后我们将使用该框架定义 `parse`。在此期间，你只需相信\
  \ `parse` 完成了它的工作。\n\n理想情况下，我们希望在反序列化期间避免任何用户代码（例如构造函数）。然而，我们需要某种方法来创建正在序列化的对象。在某些系统中，有一种机制可以在不执行构造函数的情况下分配类的原始实例。例如，在\
  \ Smalltalk 家族的语言中，类支持 `basicNew` 方法；在 JVM 上，`new` 字节码的作用也类似。在本文写作时， Dart 尚未暴露此类功能。\n\
  \n使用 `basicNew` 或其等效方法可以产生一个处于未正确初始化状态的实例。这是有问题的，因为它可能导致安全问题。因此，真的必须非常小心如何暴露此类功能。尽管如此，我们认为这可以通过适当结构的镜像（mirrors）来暴露，特别是考虑到\
  \ Dart 镜像并不承担任何安全角色。\n\n在获得原始实例后，可以使用反射机制根据序列化对象的描述来设置其所有字段，从而产生原始对象的精确反序列化结果。\n\
  \n在没有 `basicNew` 的情况下，我们如何创建原始实例呢？我们打算玩一个相当“脏”的招数。我们将调用构造函数，但向其传递特殊的代理对象作为参数。这些对象通过返回自身来响应对所有方法调用的响应。\n\
  \n点击此处查看代码图片\n\n```dart\n@proxy class OmniProxy {\n  noSuchMethod(Invocation) =>\
  \ this;\n}\n```\n\n`OmniProxy` 的实例将处理构造函数直接或间接对它们发起的所有方法调用。当然，生成的对象处于完全不一致的状态，但我们从\
  \ `basicNew` 获得的原始对象也是如此。一旦我们拿到了原始对象，将使用反射来正确设置其状态。\n\n现在我们可以检查如何反序列化单个 `SerializedObject`。我们查找序列化对象所在的类所属的库，然后在该库中查找该类。然后我们为该类选择一个构造函数。我们并不真正意乎是哪一个，所以选择找到的第一个。我们使用该构造函数创建类的实例，并将\
  \ `OmniProxy` 实例作为参数传递。\n\n所有这些都通过下面的代码实现：\n\n点击此处查看代码图片\n\n```dart\nOmniProxy filler\
  \ = new OmniProxy();\n\ndeserializeObject(serializer.SerializedObject so) {\n  if\
  \ (so is serializer.SerializedLiteral) {\n    return dsos[so.id] = so.literal;\n\
  \  }\n  if (so is serializer.SerializedList) {\n    return deserializeList(so);\n\
  \  }\n  // 查找对象类所在的库；假设库存在于当前 isolate 中\n  LibraryMirror lib = currentMirrorSystem().findLibrary(so.className);\n\
  \  // 获取类\n  ClassMirror cm = lib.declarations[so.type]; // 过滤掉所有不是 MethodMirror\
  \ 的\n  MethodMirror constructor = cm.declarations.firstWhere(\n    (d) => (d is\
  \ MethodMirror) && (d.isConstructor)\n  );\n  List cargs = [];\n  for (int i = 0;\
  \ i < constructor.parameters.length; i++) {\n    cargs.add(filler);\n  }\n  InstanceMirror\
  \ im = cm.newInstance(constructor, cargs); // 调用构造函数\n  dsos[so.id] = im.reflectee;\n\
  \  return im.reflectee;\n}\n```\n\n\n\n\n点击此处查看代码图像\n\n```\nint setFields(InstanceMirror\
  \ im, ClassMirror cm, Iterable fields) {\n  int fieldIndex = 0;\n  // iterate over\
  \ all fields, including superclasses\n  if (cm.superclass.reflectedType != Object)\
  \ {\n    fieldIndex = setFields(im, cm.superclass, fields);\n  }\n  for (VariableMirror\
  \ vm in cm.declarations.values.where(serializer.isInstanceField)) {\n    im.setField(vm.simpleName,\
  \ fields.elementAt(fieldIndex++));\n  }\n  return fieldIndex;\n}\n```\n\n`setFields()`\
  \ 方法填充了通过实例镜像 `im` 指定的对象的字段。类镜像 `cm` 指明了应该填充哪些字段；只有通过 `cm` 所表示的类及其超类中声明的字段会被填充。字段本身通过一个可迭代的\
  \ `fields` 指定。代码会沿着类链向上递归，直到到达 `Object` 的直接子类。已知 `Object` 不包含任何字段，因此没有必要访问它。对于每个访问的类，我们通过反射循环遍历实例变量，并使用\
  \ `setField` 方法逐个设置每个字段。我们使用 `fieldIndex` 来跟踪已处理的字段。\n\n我们概述的这种方法具有固有的局限性。与 Dart\
  \ 中所有通用代理方案一样，在存在类型测试和强制转换或检查模式（checked mode）时，它无法正常工作。如果构造函数依赖于副作用（它们不应该这样做），它也将无法良好工作。在某些特殊情况下，依赖参数间标识性（或缺乏标识性）的构造函数也可能遇到困难。如果构造函数依赖于任何无法重定义的运算符，也是如此。\n\
  \n无论是否使用代理，通过反射设置字段都是有问题的，因为 `setField` 实际上调用了 setter 方法，而该方法可能会被重写或隐藏。这与之前讨论的 `getField`\
  \ 问题类似。最终，Dart 应该支持一种能够实际修改特定实例变量的反射操作。再次，我们这里的目的是教学，因此我们把这些顾虑都放在了一边。\n\n### 7.1.4\
  \ 示例：解析器组合器\n\n作为使用反射以及整体 Dart 编程的另一个示例，我们将查看解析器组合器（parser combinators）。解析器组合器是由其他解析器组合成新解析器的操作。例如，考虑一个关于标识符的简单\
  \ EBNF 产生式：\n\n`identifier` → `letter`(`letter`|`digit`)*\n\n我们将借助解析器组合器库 `combinatorialParsing.dart`\
  \ 的帮助，在 Dart 中表示这一产生式。使用 `combinatorialParsing`，此类标识符的解析器可以通过解析字母的解析器和解析数字的解析器构建：\n\
  \n点击此处查看代码图像\n\n```\nvar identifier = letter & (letter | digit).star;\n```\n\nDart\
  \ 代码非常接近 EBNF 规范。假设 `letter` 是解析单个字母的解析器，而 `digit` 是解析单个数字的解析器。\n\n解析器在其身上定义了几个运算符。其中是\
  \ `|`，它定义了“交替组合器”（alternating combinator）。它接受一个解析器作为输入参数，并返回一个接受接收者或参数接受的任何内容的新解析器。因此，`letter`\
  \ | `digit` 将解析单个字母或单个数字。\n\n这里呈现的交替解析器对应于 PEG 中的交替运算符[18]。它与 BNF 中的交替区别在于，它总是赋予其左侧操作数优先级。(3)\n\
  \n**3。** 其影响超出了本书的范畴。\n\n解析器还支持 `star` 访问 方法。在解析器 `p` 上调用 `star` 的结果是一个新解析器，该解析器将接受空字符串或\
  \ `p` 接受的任何次数重复。由此，`(letter` | `digit).star` 解析一个零或多个字母或数字的字符序列。\n\n最后，运算符 `&` 被定义为返回一个新的解析器，该解析器先解析接收者解析的内容，然后解析其参数解析的内容。`letter\
  \ & (letter` | `digit).star` 的最终效果产生一个解析器对象，它先解析一个字母，然后接受一个（可能是空的）字母或数字序列。\n\n这种方案的优之处在于它像\
  \ EBNF 记法一样具有组合性。实际上，我们现在有了一个用于定义解析器的领域特定语言，它与通常用于语法的层次表示法非常接近。\n\n#### 7.1.4.1\
  \ 完整的语法\n\n我们可以将整个语法定义为一个类，其中语法的每个产生式都是该类的一个成员。语法被定义为 `ExecutableGrammar` 的子类，该类是由\
  \ `combinatorialParsing` 提供的。单个解析器的类型均为 `CombinatorialParser`：\n\n点击此处查看代码图像\n\n\
  ```\nclass ExampleGrammar1 extends ExecutableGrammar {\n  CombinatorialParser digit,\
  \ letter, id, identifier, expression;\n\n  ExampleGrammar1() {\n    digit = charBetween('0',\
  \ '9');\n    letter = charBetween('a', 'z') | charBetween('A', 'Z');\n    id = letter\
  \ & (letter | digit).star;\n    identifier = tokenFor(id);\n    expression = identifier;\n\
  \  }\n}\n```\n\n`charBetween()` 方法继承自 `ExecutableGrammar`；它接收两个字符串表示一个范围，并产生一个接受该范围内字符的解析器。因此\
  \ `digit` 被赋值为解析“0”到“9”，而 `letter` 解析“a”到“z”或“A”到“Z”，正如我们预期的那样。\n\n`tokenFor()`\
  \ 方法也是继承的。它基于输入解析器产生一个令牌解析器。令牌解析器会忽略空格。框架因此允许我们处理词法和语法产生式，这被称为无扫描器解析（scannerless\
  \ parsing）。\n\n#### 7.1.4.2 语法子类化与相互递归\n\n让我们扩展语法。好的一点是由于语法是类，我们可以像扩展类一样扩展它们——通过继承：\n\
  \n点击此处查看代码图像\n\n```\nclass ExampleGrammar2 extends ExampleGrammar1 {\n  CombinatorialParser\
  \ keywordIf, keywordThen, keywordElse, keywordReturn, ifStatement, returnStatement,\
  \ statement;\n\n  ExampleGrammar2() {\n    keywordIf = tokenFromSymbol('if');\n\
  \    keywordThen = tokenFromSymbol('then');\n    keywordElse = tokenFromSymbol('else');\n\
  \    keywordReturn = tokenFromSymbol('return');\n    returnStatement = keywordReturn\
  \ & expression;\n    ifStatement = keywordIf & expression & keywordThen & statement\
  \ & keywordElse & statement;\n    statement = ifStatement | returnStatement;\n \
  \ }\n}\n```\n\n上述语法的一个有趣特性是它具有相互递归产生式。这在语法中很常见，但它产生了一个问题。当初始化 `ifStatement` 字段时，将调用\
  \ `statement` 的 getter，但它尚未初始化，其值将为 null。更改字段声明顺序没有帮助，因为那时 `statement` 的初始化将尝试调用为\
  \ null 的 `ifStatement`。那么，上述代码应该如何工作呢？\n\n一种方法是不允许向前引用，但这是不可接受的。另一种方法是通过闭包来指定产生式。在我们的情况下，将\
  \ `ifStatement` 定义为闭包就足够了。\n\n点击此处查看代码图像\n\n```\nifStatement = () => keywordIf &\
  \ expression & keywordThen & statement & keywordElse & statement;\n```\n\n当然，现在标识符\
  \ `ifStatement` 返回的是闭包而不是解析器，必须调用该函数来提取所需的解析器。我们必须更改引用 `ifStatement` 的方式：\n\n\n\n\
  \n\n点击此处查看代码图像\n\n```\nstatement = ifStatement() | returnStatement;\n```\n\n这些更改是有问题的。并不是所有的产生式（productions）都以相同的方式表示，这导致在引用产生式时会引起困惑。我们可以决定始终对产生式使用闭包（closures），但使用闭包会在产生式的定义和使用处都增加样板代码，使得我们的内部\
  \ DSL 不再那么吸引人。\n\n### 7.1.4.3 使用反射的前向引用解析器\n\n我们可以使用反射来解决这个问题。我们将文法对象的所有字段初始化为特殊的`前向引用解析器`（forward\
  \ reference parsers）。这些解析器将支持普通解析器所支持的所有组合器（combinators），因此初始化代码可以无异常运行。当实际解析开始时，前向引用解析器会查找其所引用解析器的最新值并据此进行解析。\n\
  \n将字段初始化为前向引用解析器的代码是解析器组合器库的一部分。具体来说，`ExecutableGrammar` 的构造函数将语法对象的所有字段设置为合适的前向引用解析器。由于库不知道实际的文法，我们需要通过反射来发现这些字段并设置它们。\n\
  \n点击此处查看代码图像\n\n```\nabstract class ExecutableGrammar extends CombinatorialParser\
  \ {\n\n  Map forwardReferenceTable = new Map();\n\n  InstanceMirror selfMirror;\n\
  \n  ExecutableGrammar() {\n      selfMirror = reflect(this);\n      setupForwardReferences;\n\
  \      bindForwardReferences;\n  }\n}\n```\n\n构造函数首先获取它正在创建的实例的镜像（mirror）。镜像存储在\
  \ `selfMirror` 中，供 `setUpForwardReferences` 使用，该例程会将前向解析器分配给 `this` 的所有实例变量。起初，前向解析器并不知道它们将转发到哪个解析器；如果我们在创建前向解析器时就知道这一点，根本就不需要前向解析器了。只有在用户定义的文法的构造函数设置了所有实例变量后，我们才能真正地将每个前向解析器绑定到它应该转发的解析器。\n\
  \n显然，我们需要能够枚举文法的所有产生式，以便将前向解析器分配给相应的实例变量。我们使用一个私有实用方法 `allProductions` 来获取这些产生式。它依赖反射来遍历所有实例变量。\n\
  \n点击此处查看代码图像\n\n```\nList<VariableMirror> get allProductions {\n\n  List<VariableMirror>\
  \ allProductions = new List();\n\n  ClassMirror gc = selfMirror.type;\n\n  while\
  \ (gc.simpleName != #ExecutableGrammar) {\n    allProductions.addAll(gc.declarations.values.where(isInstanceField));\n\
  \    gc = gc.superclass;\n  }\n\n  return allProductions;\n}\n```\n\n镜像库允许我们枚举单个类的声明。我们需要向上遍历类型层级以收集所有声明。我们沿着类型层级向上到\
  \ `ExecutableGrammar`。这允许我们收集框架用户定义的所有字段，并忽略框架自身的、不存储解析器的字段。\n\n使用 `_allProductions`，`setupForwardReferences`\
  \ 会遍历所有的文法产生式，为每个产生式分配一个新的 `ForwardReferenceParser` 实例。\n\n实际使用的解析器将在子类构造函数的体中定义，这将在稍后运行。显然，正如刚刚指出的，在这一阶段我们并不知道每个\
  \ `ForwardReferenceParser` 将转发到哪个解析器。\n\n当子类构造函数运行时，它会将实际的解析器分配给各种实例变量。在此过程中，它将覆盖每个字段中存储的前向解析器。然而，我们稍后需要找到前向解析器，以便将它们绑定到真实的解析器。因此，当每个\
  \ `ForwardReferenceParser` 被创建时，我们将其存储在映射 `forwardReferenceTable` 中，并以字段名为键。\n\n\
  点击此处查看代码图像\n\n```\nget setupForwardReferences {\n\n  /* 遍历所有实例变量并将它们设置为一个新的前向引用\
  \ */\n  /* 如果这些不对应于产生式，它们将由子类覆盖 */\n  for (VariableMirror slot in _allProductions){\n\
  \      Symbol iv = slot.simpleName;\n      var fref = new ForwardReferenceParser();\n\
  \      /* 假设 ExecutableGrammar 子类中定义的所有槽\n       * 都是产生式。如果它们有其他用途，它们会被覆盖。\n   \
  \    * 只有当子类定义了同名的字段时，这里才会失败。\n       */\n      forwardReferenceTable[iv] = fref;\n\
  \      /* 将 iv 设置为 fref */\n      selfMirror.setField(iv, fref);\n  }\n}\n```\n\n\
  在子类构造函数运行之后，我们希望将解析器绑定到目标。问题是，此时 `ExecutableGrammar` 的构造函数已经执行完毕，我们没有机会遍历所有的前向解析器。为了克服这个困难，每个前向解析器都有一个字段\
  \ `bindingRoutine`，它持有一个将延迟绑定它的闭包。当 `ForwardReferenceParser` 第一次被要求某些内容时，它会检查是否已绑定到目标；如果没有，则调用\
  \ `bindingRoutine`。\n\n在 `setupForwardReferences` 中，我们将所有解析器的 `bindingRoutine` 设置为\
  \ `finalBindReferences`：\n\n点击此处查看代码图像\n\n```\n// 前向引用\nget setupForwardReferences\
  \ {\n  for (var v in forwardReferenceTable.values) {\n    v.bindingRoutine = ()\
  \ => finalBindReferences;\n  }\n}\n\nget finalBindReferences {\n  forwardReferenceTable.forEach((k,\
  \ v){\n    var p = getRealField(k);\n    if (p is CombinatorialParser) {\n     \
  \ v.bind(p);\n      p.name = MirrorSystem.getName(k); // 为产生式命名的好地方\n    }\n  });\n\
  }\n```\n\n`finalBindReferences` 方法实际上绑定所有的解析器，因此实际上只会被第一个需要解析的前向解析器调用。该方法遍历 `forwardReferenceTable`，并将每个前向解析器设置为字段的值。当然，这是因为\
  \ `finalBindReferences`是在文法完全完成后才调用的。\n\n我们再次使用反射来获取想要绑定的目标解析器。该解析器存储在字段中，其名称是我们正在绑定的前向解析器映射项的键。\n\
  \n点击此处查看代码图像\n\n```\nCombinatorialParser getRealField(Symbol k){\n  /*\n   * 如果当前类有\
  \ getter k 但没有字段 k\n   * 则假设其 getter k 覆盖了存储在父类字段中的产生式 k\n   * 并带有包装解析器。\n   */\n\
  \  var p = selfMirror.getField(k).reflectee;\n  if (selfMirror.type.getters.containsKey(k)\
  \ &&\n      selfMirror.type.declarations.values.where(isInstanceField).isEmpty())\n\
  \    return p.parser;\n  else return p;\n}\n```\n\n### 7.1.4.4 语义动作、AST 与反序列化\n\n\
  我们之前的两个示例 `ExampleGrammar1` 和 `ExampleGrammar2` 都产生解析树。解析器组合器隐式地执行这一点。树的形式是解析器返回的列表。在大多数情况下，我们希望解析器产生更高层次的内容，例如抽象语法树（AST）。\n\
  \n我们可以通过定义两个类来实现：一个定义我们语言的文法，另一个子类覆盖部分产生式以产生 AST。我们的下一个示例将说明这一点。我们将定义上一节反序列化器所需的解析器。首先是文法：\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```class\nclass SerializedObjectGrammar extends ExecutableGrammar\
  \ {\n  CombinatorialParser comma, decimal, digit, dot, doublequote, id, identifier,\n\
  \                      integer, lbracket, letter, libName, list, literal, lparen,\n\
  \                      nonliteral, number, rbracket, rparen, serializedObject, slash,\n\
  \                      space, string, stringContent, sym, truth, untruth;\n  SerializedObjectGrammar(){\n\
  \    comma = token(',');\n    dot = token('.');\n    doublequote = token('\"');\n\
  \    lbracket = token('[');\n    rbracket = token(']');\n    lparen = token('(');\n\
  \    rparen = token(')');\n    slash = token('/');\n    space = char(' ');\n   \
  \ underscore = char('_');\n    digit = charBetween('0', '9');\n    letter = charBetween('a',\
  \ 'z') | charBetween('A', 'Z');\n    integer = tokenFor(digit.plus);\n    decimal\
  \ = tokenFor(digit.plus & char('.') & digit.plus);\n    number = decimal | integer;\n\
  \    id = ((letter | underscore) & (letter | digit | underscore).star).wrapper(\n\
  \          (fst, snd) => '$fst${ new StringBuffer()..writeAll(snd)}'\n    );\n \
  \   identifier = tokenFor(id);\n    truth = token('true');\n    untruth = token('false');\n\
  \    stringContent = (letter | digit | underscore | space).star;\n    string = doublequote\
  \ & stringContent & doublequote;\n    sym = token('Symbol') & lparen & doublequote\
  \ & identifier\n          & doublequote & rparen;\n    literal = truth | untruth\
  \ | number | sym | string;\n    list = lbracket & integer.star & rbracket;\n   \
  \ libName = identifier & (dot & identifier).star;\n    nonliteral = libName & slash\
  \ & identifier & lparen & integer.star & rparen;\n    serializedObject = literal\
  \ | list | nonliteral;\n  }\n}\n```\n\n接下来，我们定义 `SerializedObjectGrammar` 的子类来生成\
  \ AST。在我们的案例中，AST 非常简单。它由 `SerializedObject` 的实例和字面量组成：\n\n点击此处查看代码图片\n\n```class\n\
  class SerializedObjectParser extends SerializedObjectGrammar {\n  _computeIntFrom(List\
  \ ints) {\n    int val = 0;\n    int j = 0;\n    for (int i = ints.length-1; i >=\
  \ 0; i–) {\n      val += int.parse(ints[j++]) * math.pow(10, i);\n    }\n    return\
  \ val;\n  }\n  _computeFractionFrom(List ints) {\n    num val = 0;\n    for (int\
  \ i = 0; i < ints.length; i++) {\n      val += int.parse(ints[i]) / math.pow(10,\
  \ i+1);\n    }\n    return val;\n  }\n  CombinatorialParser get integer {\n    return\
  \ super.integer.wrapper((Token ints) {return computeIntFrom(ints.token);});\n  }\n\
  \  CombinatorialParser get truth => super.truth.wrapper((t) => true);\n  CombinatorialParser\
  \ get untruth => super.untruth.wrapper((f) => false);\n  CombinatorialParser get\
  \ decimal {\n    return super.decimal.wrapper((d){\n              return computeIntFrom(d.token[0])\
  \ + computeFractionFrom(d.token[2]);\n            });\n  }\n  CombinatorialParser\
  \ get string {\n    return super.string.wrapper((lq, s, rq){\n              return\
  \ s.fold('', (String s1, String s2) => s1 + s2);\n            });\n  }\n  CombinatorialParser\
  \ get sym {\n    return super.sym.wrapper((f, lp, ldq, s, rdq, rp){\n          return\
  \ MirrorSystem.getSymbol(s.token);\n        });\n  }\n  CombinatorialParser get\
  \ libName {\n    return super.libName.wrapper((Token hd, List tail) {\n      List\
  \ l = [hd.token];\n      l.addAll(tail.map((List pair) => pair[0].token + pair[1].token));\n\
  \      String ln = l.reduce((String s1, String s2) => s1 + s2);\n      Symbol h\
  \ = MirrorSystem.getSymbol(ln);\n      return h;\n    });\n  }\n  CombinatorialParser\
  \ get nonliteral {\n    return super.nonliteral.wrapper(\n      (Symbol libId, sl,\
  \ Token classId, lp, List ints, rp) {\n        Symbol c = MirrorSystem.getSymbol(classId.token);\n\
  \        var dso = new serializer.SerializedObject(sid, libId, c);\n        dso.fields\
  \ = ints;\n        return dso;\n      });\n  }\n  CombinatorialParser get literal\
  \ {\n    return super.literal.wrapper((l) {\n      return new serializer.SerializedLiteral(sid,\
  \ l);\n    });\n  }\n  CombinatorialParser get list {\n    return super.list.wrapper((lb,\
  \ elems) {\n      serializer.SerializedList res = new serializer.SerializedList(sid);\n\
  \      res.fields = elems;\n      return res;\n    });\n  }\n}\n```\n\n### 7.1.4.5\
  \ 使用 `noSuchMethod` 代替反射\n\n如 7.1.1 节所述，使用反射会带来巨大的开销。我们是否有其他方法在不诉诸反射的情况下保留库的功能？是的，有的。我们可以利用\
  \ `noSuchMethod`。这种方法通过 `RunnableGrammar` 类进行了说明：\n\n点击此处查看代码图片\n\n```class\nabstract\
  \ class RunnableGrammar extends CombinatorialParser {\n  Map<Symbol, ForwardReferenceParser>\
  \ forwardReferenceTable =\n    new Map<Symbol, ForwardReferenceParser>();\n  Map<Symbol,\
  \ dynamic> productions = new Map<Symbol, dynamic>();\n  // 非解析器可能会被 noSuchMethod\
  \ 插入，\n  // 因此值的类型为 dynamic\n  RunnableGrammar();\n  noSuchMethod(Invocation im){\n\
  \    // 如果是 get 操作，则在 productions 映射中查找；\n    // 如果缺失，则安装一个转发器并返回它\n    if (im.isGetter)\
  \ {\n      var result;\n      return (result = productions[im.memberName]) == null\
  \ ?\n        setupForwardReference(im.memberName) : result;\n    };\n    // 如果是\
  \ set 操作，将其到 productions 映射\n    if (im.isSetter){\n      return productions[im.memberName]\
  \ = im.positionalArguments[0];\n    };\n    // 否则转发给 super\n    return super.noSuchMethod(im);\n\
  \  }\n  ForwardReferenceParser setupForwardReference(Symbol productionName){\n \
  \   ForwardReferenceParser fref = new ForwardReferenceParser();\n    fref.bindingRoutine\
  \ = () => finalForwardReferences;\n    /* 绑定到 finalForwardReferences */\n    return\
  \ forwardReferenceTable[productionName] = fref;\n  }\n  // 前向引用\n  get finalForwardReferences\
  \ {\n    forwardReferenceTable.forEach((k, v){\n      var p = productions[k];\n\
  \      if (p is CombinatorialParser) {\n        v.bind(p);\n        p.name = MirrorSystem.getName(k);\n\
  \        /* 命名产生式的好地方 */\n      }\n    });\n  }\n}\n```\n\n这里过程的核心是 `noSuchMethod`。产生式存储在\
  \ `productions` 映射中（从产生式名称到解析器）。对产生式的任何尝试都会导致其值的插入。\n\n这种方案的一个优点是，我们不需要像以前那样为每个产生式声明一个字段。我们只需要在构造函数中引用产生式的\
  \ setter 和 getter 即可：\n\n点击此处查看代码图片\n\n```class\nclass ExampleGrammar3 extends RunnableGrammar\
  \ {\n  ExampleGrammar3() {\n    digit = charBetween('0', '9');\n    letter = charBetween('a',\
  \ 'z') | charBetween('A', 'Z');\n    id = letter & (letter | digit).star;\n    identifier\
  \ = tokenFor(id);\n    expression = identifier;\n  }\n}\n```\n\n我们不再需要依赖反射，这意味着如果我们部署到\
  \ JavaScript，我们的下载包将会更小。\n\n然而，我们失去了类型检查的优势。此外，由于所有对产生式的访问都通过 `noSuchMethod`，实际解析速度会比普通的\
  \ getter 调用慢得多。\n\n\n\n\n\n总的来说，在 Dart VM 上使用反射可能是更好的选择，但在通过 Javascript 部署时，使用 `noSuchMethod`\
  \ 可能更合适。当然，人们也可能选择完全不同的方法，例如外部 DSL。一个很有前景的替代方案是使用支持代码生成的反射库；我们将在第 7.4 节中探讨该选项。\n\
  \n### 7.2 为什么使用镜像 (Mirrors)\n\nDart 使用基于镜像的反射。在语言中处理反射有其他方法。为什么 Dart 选择使用镜像呢？\n\n\
  人们常说，计算中的每个问题都可以通过增加一层间接来解决。镜像就是一个例子。\n\n镜像有助于反射代码和库的部署；通过将反射功能移动到单独组件中，可以更容易识别是否使用了反射，从而判断是否需要在部署的代码中保留这些反射代码。\n\
  \n在分布式系统中进行反射时，镜像非常有用。与通过直接处理类等实际实现产物来 get 反射的方法相比，镜像允许同时支持不同的实现。特别是，它可以支持作为位于独立地址空间（无论是另一个\
  \ actor、进程还是远程机器）中的代码和对象代理的镜像实现。\n\n作为独立对象，镜像充当反射的权限（capabilities），因此自然适用于对象-能力安全模型（object-capability\
  \ security model）。\n\n前两个考虑与 Dart 有关；最后一个则不是，因为 Dart 的安全性是基于隔离区（isolates）。关于镜像的更详细讨论，请参见本章末尾的相关工作部分（7.6）。\n\
  \n### 7.3 元数据 (Metadata)\n\nDart 中的声明可以使用元数据注解进行装饰。元数据在声明之前给出。元数据注解以 @ 符号（@）开头，后跟常量变量的引用或对常量构造函数的调用。可以给出多个注解：\n\
  \n点击查看代码图像\n\n```\n@deprecated prematureOptimization(x) { ... }\n\n@specialToLib1\
  \ @ImportantToLib2(4) class MyClass {\n  @override toString() => 'I am in a class\
  \ of my own';\n}\n```\n\n可以通过反射在运行时访问元数据。`dart:mirrors` 中的 `DeclarationMirror` 类有一个\
  \ get 方法 `metadata`，它返回一个包含与声明相关的各种注解值的镜像列表。\n\n如果不对动态访问元数据，它不应该产生任何开销；一个良好的实现会在请求元数据之前忽略掉它。由于元数据完全由常量组成，其值独立于程序状态，因此它可以在任何时间进行计算并得到相同的结果。特别是，元数据可以根据需要进行评估，从而避免对未使用的注解产生任何开销。\n\
  \n在许多情况下，元数据根本不需要动态访问。工具可以根据需要静态地、离线地解析代码，并根据需要利用元数据注解。\n\n我们现在来看一个通过反射访问元数据并从中获得某些优势的示例。\n\
  \n### 7.4 通过代码生成的反射 (Reflection via Code Generation)\n\n如上所述，当部署到不支持良好的 Dart 虚拟机（例如\
  \ Web 或 iOS）的平台时，使用反射在空间上可能是代价昂贵的。在许多情况下，我们可以调整代码来解决这个问题。\n\n为了防止部署的应用程序体积爆炸，实现需要知道哪些代码正在被反射地访问，以及如何访问。为此，Dart\
  \ 支持另一个替代镜像库 `reflectable`。`reflectable` 要求对被反射的代码使用特定的元数据进行注解。元数据描述了在反射已注解代码时必须支持哪些能力。例如，是否应该能够反射地调用类的成员，或者分析它们的结构，或者遍历类的超类型链等。\n\
  \n我们将使用上面所示的解析器组合器库来说明 `reflectable` 的用法。\n\n理想情况下，一旦所需的注解就绪，部署的代码应该能够正常工作且体积小得多。在实践中，`reflectable`\
  \ 与 `dart:mirrors` 之间存在不兼容之处。因此，我们需要导入 `reflectable` 而不是标准库。\n\n点击查看代码图像\n\n```\n\
  import 'package:reflectable/reflectable.dart' show\n    declarationsCapability,\
  \ instanceInvokeCapability, Reflectable,\n    TypeCapability;\nimport 'package:reflectable/mirrors.dart'\
  \ show ClassMirror, InstanceMirror,\n    VariableMirror;\n```\n\n下一步是定义我们需要的反射能力集。例如，反射获取实例](#part0027_split_042.html_p166pro02a)\
  \ 的类型。`reflectable` 专门为此目的定义了 `TypeCapability` 类。\n\n点击查看代码图像\n\n```\nconst grammarTypeCapability\
  \ = const TypeCapability(ExecutableGrammar);\n```\n\n`reflectable` 还提供了某些预定义的能力常量。在这里使用\
  \ `declarationsCapability`、`typeRelationsCapability` 和 `instanceInvokeCapability`。第一个允许我们访问类的结构，第二个允许我们遍历类型层次，最后一个允许调用成员。为了利用能力，我们需要创建一个拥有这些镜像系统。`reflectable`\
  \ 的镜像系统是 `Reflectable` 的子类实例。我们将定义 `Grammar` 来描述镜像系统：点击查看代码图像\n\n```\nconst grammar\
  \ = const Grammar();\nclass Grammar extends Reflectable {\n  const Grammar() : super(declarationsCapability,\n\
  \    instanceInvokeCapability,\n    typeRelationsCapability,\n    grammarTypeCapability);\n\
  }\n```\n\n我们需要为类注解 `@grammar`，从而让 `reflectable` 知道这些类必须可以通过反射访问，正如为 `grammar` 指定能力的那样。点击查看代码图像\n\
  \n```\n@grammar abstract class ExecutableGrammar extends CombinatorialParser {...}\n\
  ```\n\n`dart:mirrors` 与 `reflectable/mirrors` 之间还存在一些 API 不兼容之处。`dart:mirrors` 中的\
  \ `getField` 和 `setField` 方法命名错误。在 `reflectable` 中，这些分别被重命名为 `invokeGetter` 和 `invokeSetter`。我们需要在几处修改代码：4。未来版本的\
  \ `dart:mirrors` 将修复这个问题。\n\n点击查看代码图像\n\n```\nCombinatorialParser getRealField(String\
  \ k){\n  /* 一个粗糙的 hack，用于绕过 Dart 镜像库的缺陷。\n  * 如果当前类有 getter k 但没有字段 k\n  * 则假设其\
  \ getter k 覆盖了存储在父类字段中的生产 k\n  * 并对字段内容加了包装解析器。\n  * */\n  var p = selfMirror.invokeGetter(k);\n\
  \  if (selfMirror.type.instanceMembers.containsKey(k) &&\n      selfMirror.type.declarations.values.where(isInstanceField).isEmpty)\n\
  \    return p.parser;\n  else return p;\n}\n\nget setupForwardReferences {\n  /*\
  \ 遍历所有非空实例变量并将它们设置为新的向前引用 */\n}\n```\n\n\n\n\n```javascript\n /* 如果这些没有与产生式对应，它们将被子类覆盖\
  \ */\n\n_allProductions.forEach((VariableMirror slot){\n\n   String iv = slot.simpleName;\n\
  \n   var fref = new ForwardReferenceParser();\n\n   forwardReferenceTable[iv] =\
  \ fref;\n\n   /* 将 iv 设置为 fref */\n\n   selfMirror.invokeSetter(iv, fref);\n\n });\n\
  \n}\n```\n\n此外，`reflectable` 使用字符串而非符号来命名声明。鉴于 `reflectable` 已经处理了部署问题，它并不关注针对代码压缩的优化。这使得使用变得更加容易。\n\
  \n点击此处查看代码图片\n\n```dart\nList<VariableMirror> get allProductions {\n\n   List<VariableMirror>\
  \ allProductions = new List();\n   ClassMirror gc = selfMirror.type;\n   while (gc.simpleName\
  \ != 'ExecutableGrammar') {\n     allProductions.addAll(gc.declarations.values.where(isInstanceField));\n\
  \     gc = gc.superclass;\n   }\n   return allProductions;\n}\n```\n\n最后，我们还需要在客户端代码上加上\
  \ `grammar` 注解：^(5)\n\n5.** 事实上，`reflectable` 有一种避免此操作的方法，但目前尚未实现。\n\n点击此处查看代码图片\n\
  \n```dart\nimport 'parsing.dart' show CombinatorialParser, ExecutableGrammar, grammar;\n\
  \n@grammar class ExampleGrammar1 extends ExecutableGrammar {..}\n```\n\n我们可以像以前一样运行示例。默认情况下，`reflectable`\
  \ 在后台使用 `dart:mirrors`。然而，我们可以根据我们提供的反射能力注解，构建一个针对部署进行了优化的应用程序版本。结果是体积大幅缩小（对于我们的示例来说，缩小了一个数量级）。压缩又带来了近乎另一个数量级的缩小。^(6)\n\
  \n6.** 在写作此时，对于我们的解析示例，我们看到翻译后的 JavaScript 代码大小从 2Mb 以上减小到 174Kb，然后进一步压缩到 30Kb。\n\
  \n一个合理的策略是使用 `dart:mirrors` 开发应用程序，并使用 `reflectable` 部署它。事实上，`reflectable` 可以直接在\
  \ Dart 运行时使用，在这种情况下，它会将工作工作转发给 `dart:mirrors`。因此，我们可以从一开始就使用 `reflectable` 编写应用程序。缺点是，我们需要在过程早期指定反射能力。然而，我们可以随着应用程序的构建，逐渐指定所需的。。优点是我们不需要转换应用程序。我们预计，随着\
  \ `Reflectable` 包的趋于成熟和完善，使用该包将成为一个日益受欢迎的选项。\n\n### 7.5 超越自省\n\n反射最令人兴奋的应用之一是涉及反射式变化的应用——即动态修改或添加代码。反射式变化的主要用例是在开发期间。支持反射式变化的系统使得实现一个实时\
  \ IDE（live IDE）变得容易得多。\n\nDart 支持反射式变化一直是其意图。在写作此时，只有一个实验性的 Dart 实现（代号为 Fletch）支持这一功能。然而，我们预计这将随着时间的推移而改变。\n\
  \n开发期间反射式变化最明显的应用是它实现了实时评估器。这些评估器可以像简单的经典的读取-评估-打印循环（REPL），也可以更丰富，例如允许在特定实例作用域内进行评估的对象检查器。反射式变化的另一个标准用法是“修复并继续”（fix-and-continue）调试。值得注意的是，真正的实时环境允许对各种声明进行修改，而不仅仅是方法和函数。例如，应该能够添加、删除或重命名字段，并使更改在所有现有实例上立即生效。\n\
  \n在添加或重命名字段时，必须考虑它可能如何被初始化。反射式变化设施应该提供更新现有实例的方法，以便它们不仅具有声明的槽位，而且这些槽位具有适当的值。\n\n\
  在生产环境中使用反射式变化要有争议得多。这种用法的一个例子是程序员定义的动态加载版本。另一个是基于 `noSuchMethod` 的设计优化，例如代理。可以在第一次调用方法时添加自定义版本的方法，从而避免在后续调用中\
  \ `noSuchMethod` 调用的开销（代价是第一次调用的巨大开销）。也许最引人的是，人们可能会在运行时更新已部署的应用程序，而无需重启它们。\n\n然而，在生产环境中支持反射式变化确实引发了。人们不再能确定应用程序的代码是什么，并且可能存在安全疑虑。反射式变化机制对性能的需求也更高。\n\
  \n### 7.6 相关工作\n\n面向对象编程中反射的历史根于 Smalltalk。Smalltalk 模型的变体被其他语言所采用。CLOS 通过元对象协议丰富了它，而\
  \ Java 限制了它，C# 也随之其后。\n\n后来的脚本语言通过刻意向程序员暴露实现结构，以以非结构化的方式支持反射。在这一方面，它们遵循了早于 Smalltalk\
  \ 的元循环 Lisp 系统的传统。\n\n镜像（mirrors）的概念是在 Self [19] 中被引入的。Self 模型被应用于类系统，首先在 Smalltalk\
  \ 中，后来在 Java 的部分内容中。有关详细讨论，请参见 [20]。最近，Newspook 引入了镜像系统，旨在实现 [20] 中概述的所有 set。Dart\
  \ 镜像系统是 Newspeak 的后代，但在许多方面有所不同。Dart 的隔离间通信不同于 Newspeak，导致了 API 分为本地和隔离间版本。\n\n\
  这里显示的解析器组合器基于 [21] 中描述的版本。元数据在 .Net 中流行，随后被引入 Java。Dart 元数据的独特之处在于它利用了常量。\n\n###\
  \ 7.7 总结\n\n镜像将反射功能位于被反射对象之外，为更好的部署、分发和安全性提供了可能。Dart 镜像目前支持自省和执行代码；未来，我们希望提供修改实时程序的能力。\n\
  \n\n\n\n\n当在 Dart 中调用方法或执行函数时，调用者会等待直到被调用者计算完毕并返回结果。在被调用者执行期间，调用者处于`blocked`阻塞状态。函数调用非常就像电话通话，调用者等待对方接听。调用是一种`synchronous`同步通信的形式——调用者和被调用者在时间上同步它们的活动。\n\
  \n相比之下，在`asynchronous`异步通信中，调用者启动一个操作但并不等待其完成，而是立即继续执行。异步通信适用的场景示例包括输入或输出任务，在这些任务中，请求的操作可能很慢，等待操作完成是不理想的。\n\
  \n异步是 Dart 并发机制的核心。Dart 不仅在单个隔离器（isolate）内部支持异步，也支持跨多个隔离器进行异步操作。\n\n跨隔离器通信基于异步消息传递。在它的基本形式中，消息传递是一种“触发后遗忘”的活动。发送者无法确定消息是否被接收，或者是否会给出响应。这好比通过旧式邮政寄信。人们可以通过发送消息启动某些操作，但不知道该操作是否已执行，如果执行了，是否成功。你显然无法得知成功时的结果值，也无法失败时抛出了什么错误。这是不令人意的。应用程序需要能够监控并响应它们启动的异步活动。为了满足这一需求，我们使用了\
  \ futures（未来）。\n\n### 8.2 Futures\n\n`future` 是一个对象，代表一个可能尚未发生的计算结果。该结果可能在未来的某个时间已知，因此得名为“future”。Futures\
  \ 在异步计算中非常有用。一旦发出了执行异步计算的请求，就可以立即以同步方式返回一个 future，而实际计算被调度在稍后的时间执行。future 为请求异步操作的代码提供了一个句柄，即对所请求计算的引用。在请求的计算完成后，可以使用该\
  \ future 来访问结果。我们说该 future `has been completed`（已完成），或者说 `has been resolved`（已解析）。\n\
  \n在 Dart 中，futures 是通过 `dart:async` 库中的 `Future` 类实现的。`Future` 是泛型类，其类型参数 `T` 代表\
  \ future 完成时的值的类型。\n\n### 8.2.1 消费 Futures\n\nFutures 有一个实例方法 `then()`，它接受一个闭包 `onValue`\
  \ 作为参数。当 future 成功完成时，将调用该闭包。闭包本身接受一个类型为 `T` 的参数，即 future 所代表的计算的类型。因此，当 future\
  \ 完成时，它代表的值将传递给 `onValue`。\n\n例如，假设我们有一个想要复制的文件。`File` 对象支持复制文件的异步 API：\n\n**[1].**\
  \ 这里我们指的是在 `dart:io` 中定义的 `File` 类，而不是在 `dart:html` 中定义的类，后者的 API 完全不同。\n\n```\n\
  Future<File> copy(String newPath)\n```\n\n如果我们在 `File` 上调用 `copy()`，我们会得到一个 future。异步\
  \ API 的优势是，可以启动一个大文件的复制而无需等待复制完成。缺点是，如果我们实际上想对复制的文件做些什么，事情就会变得复杂一些，因为我们必须与 futures\
  \ 交互。\n\n一个简单的测试可以断言：如果我们有一个文件并在 `myPath` 路径创建一个副本，那么生成的文件路径确实是 `myPath`。由于 `copy()`\
  \ 的结果是一个关于文件的 future 而文件本身，我们不能直接写：\n\n```\nassert(myFile.copy(myPath).path == myPath);\n\
  ```\n\n正确的代码是：\n\n```\nmyFile.copy(myPath).then((f){ assert(f.path == myPath);});\n\
  ```\n\n文件系统完成复制后，`copy()` 返回的 future 将携带一个实际的 `File` 对象完成，传入 `then()` 的闭包将带有该 `File`\
  \ 实例被调用，触发断言。那时，Dart 的执行早已离开了那里。\n\n如果一个 future `f1` 代表一个产生另一个 future `f2` 的计算呢？如果结果本身也是一个\
  \ future，那么仅仅让 `f1` 完成是不够的。我们会调用 `onValue`，但被迫测试传入的参数是否为 future，并通过另一个 `then()`\
  \ 来处理它，以此类推。相反，在这种情况下，`f1` 的完成依赖于 `f2` 的完成。当 `f2` 用一个非 future 值完成时，`f1` 将以相同的值完成。我们说这些\
  \ futures 是`chained`链式的，因为它们形成了一个依赖链。\n\nFutures 也可以代表失败的计算。`catchError()` 方法也定义在\
  \ futures 上，它同样接受一个闭包作为输入。如果 future 代表的计算抛出异常，则调用该闭包 `onError`。\n\n### 8.2.2 产生\
  \ Futures\n\n原则上，需要向调用者返回 future 的代码必须做几件事。它必须调度一个计算在稍后的时间执行，它必须实例化 `Future` 实例，并且将该实例与调度的计算相关联，这样当调度的计算完成后，future\
  \ 将带有结果完成。必须小心捕获调度计算抛出的任何异常，并用相应的错误完成 future。\n\n`Future` 的构造函数为我们管理了所有这些记录工作。代码大致如下：\n\
  \n```dart\nFuture(Function computation){\n  Timer.run(() =>\n    try {\n      _completeWithValue(computation());\n\
  \    }\n    catch (e){\n      _completeWithError(e);\n    }\n  );\n}\n```\n\n定义在\
  \ `dart:async` 中的 `Timer` 类有一个静态方法 `run()`，用于调度代码执行。`Future` 构造函数接受一个闭包 `computation`，体现了用户想要调度的计算。然而，实际调度的任务是一个闭包，旨在捕获\
  \ `computation` 的结果（无论成功失败），并相应地完成正在构建的 `Future` 实例。完成是通过私有方法（如 `completeWithValue()`）完成的。我们不希望将这些暴露给\
  \ futures 的消费者；此类消费者不需要、也不应该能够影响返回给他们的 future 的结果。\n\n最终的效果是，Dart 程序员只需要编写类似这样的代码：\n\
  \n```\nnew Future(myComputation);\n```\n\n#### 8.2.3 调度\n\n当我们说代码被调度到未来执行时，我们指的是什么？Dart\
  \ 应用程序有一个事件循环，只要有可用的 `event handlers` 事件处理器来处理正在发生的事件，它就会一直运行。事件处理器针对各种事件——鼠标点击、键盘输入等。我们特别感兴趣的是定时器事件——标记时间流逝的事件。\n\
  \n上一节提到的 `Timer` 类用于定义定时器事件的处理器。可以定义一个设计在给定时间间隔通过后触发的处理器。一个重要的特例是当该时间间隔为零时。在零时间流逝时触发的处理器只是我们希望尽早无条件运行的任务。人们可以使用\
  \ `Timer.run()` 定义这样的处理器。设置这样的处理器等同于调度一个任务在未来执行，在事件循环的下一次迭代中运行。\n\n\n\n\n\n通过构造函数\
  \ `Future.delayed()`，可以调度一个在非零延迟后执行的未来任务。详情请参阅 Dart API 文档中关于该函数以及其他 future 构造函数的说明。\n\
  \n一旦任务开始，它就会运行到完成；任务永远不会被抢占。任务运行期间被称为一个 `turn`（轮次）。在一个 `turn` 内调度的所有 futures 都保证只在当前\
  \ `turn` 结束后运行——但下文描述的微任务（microtasks）除外。\n\n#### 8.2.3.1 微任务 (Microtasks)\n\n根据原则，我们还必须假设在通过\
  \ future 调度的任务执行之前，可能还会执行其他代码。这些代码可能是：\n\n• 来自另一个 isolate（隔离器）的代码\n• 与鼠标点击等事件关联的事件处理器\n\
  • 与之前调度的 futures 相关的计算任务\n\n一旦当前 `turn` 结束，事件循环可能会运行上述任何一种类型的任务，且在当前 `turn` 调度的任何\
  \ future 运行之前执行。有时，我们确实需要在事件循环恢复之前运行某些异步操作。\n\n存在一种机制可以确保某个 future 在我们 `turn` 之外调度的任何代码之前运行。每个\
  \ `turn` 都有自己的 `microtask queue`（微任务队列）。微任务队列上的任务会在 `turn` 结束、将控制权交回主事件循环之前执行。\n\
  \n我们可以使用构造函数 `Future.microtask()` 调度在微任务队列上运行的 futures。保持微任务数量少且执行短是非常重要的。\n\n###\
  \ 8.3 Streams (流)\n\n`stream` 是一个长度不定的值列表。它可以是无限的，持续下去。它也可能最终结束，但关键在于我们不知道流何时结束或是否会结束。\n\
  \n流的示例可能是随时间变化的鼠标位置、所有质数的列表，或者通过网络发送给我们的实时视频。\n\n人们可以对 stream `subscribe`（订阅）或 `listen`（监听），这意味着向\
  \ stream 注册一个或多个回调函数。当新数据被追加到 stream 时，这些函数会被调用。\n\n将 stream 视为一个集合是很自然的。对集合的许多操作也适用于\
  \ stream。人们可以在 stream 上调用 `map()`，从而派生出一个包含计算结果的转换流。例如，我们可以将一对坐标映射到由这些坐标平移的图像，从而构建一个响应鼠标移动并在场景中移动图像的应用程序。\n\
  \n使用 `map()` 派生的 stream 与其派生的原始流 是 1:1 的关系。有时，能够用多个元素替换 stream 中的一个元素是有用的。作为一种特殊情况，如果该数量为\
  \ 0，我们可以过滤掉元素。`expand()` 操作（在许多其他语言中被称为 `flatMap()`）允许我们这样做。\n\n可以使用 `expand()`\
  \ 过滤元素，但使用 `where()` 更简单。\n\n对集合的某些操作需要遍历整个集合。在 stream 的情况下，我们无法立即这样做，因此这些操作返回 futures。例如，假设我们有一个包含所有质数的流\
  \ `primes`，并且我们想对它们求和：\n\n点击此处查看代码图片\n\n```\nFuture<int> sisypheanSum = sum(primes);\n\
  \nsisypheanSum.then((s) => print(s));\n```\n\n当然，如果我们的质数流真的一直运行下去，这将是一项西西弗斯式的（徒劳）的任务。如果我们的流在某处应该关闭，我们就能得到结果。很棒的是，我们在\
  \ Section 4.4 中使用的同一个 `sum()` 函数可以直接作用于流，而无需任何修改。\n\n### 8.4 Isolates (隔离器)\n\n\
  Dart 支持 `actor-style concurrency`（actor 模型风格并发）。一个正在运行的 Dart 程序由一个或多个 actor 组成，称为\
  \ `isolates`。一个 isolate 是一个拥有独立内存和独立单线程控制的计算单元。`isolate` 一词源于 isolates 之间存在的隔离性（isolation），因为一个\
  \ isolate 的内存从逻辑上与任何其他 isolate 的内存是分离的。isolate 内部的代码按顺序执行；任何并发都是运行多个 isolates 的结果。因此，Dart\
  \ 中没有共享内存并发，因此就不需要锁（locks），也不可能发生竞态条件。\n\n由于 isolates 没有共享内存，isolates 之间通信的唯一方式是通过消息传递（message\
  \ passing）。Dart 中的消息传递始终是异步的。\n\n与某些语言不同，isolates 没有阻塞式的接收结构。因此，不会发生死锁。\n\n####\
  \ 8.4.1 Ports (端口)\n\n一个 isolate 拥有几个 `ports`。端口是构建 Dart 隔离间通信的低层基础。端口分为两种：`send\
  \ port`（发送端口）和 `receive ports`（接收端口）。\n\n接收端口是传入消息的流 (8.3)）。发送端口允许将消息发送到 isolate；具体地说，它允许将消息发布到接收端口。接收端口可以创建发送端口，并将发送在其上的任何消息发布回其源接收端口。我们将在下一节中查看它是如何工作的。\n\
  \n#### 8.4.2 Spawning (创建)\n\n从一个 isolate 启动另一个 isolate 称为 `spawning`。isolate 在\
  \ isolate 启动时指定的库的 `main()` 方法开始执行。该库被称为该 isolate 的 `root library`（根库）。\n\n`Isolate`\
  \ 类提供了两个类方法用于创建。第一个是 `spawnUri()`，它根据通过 URI 提供的库创建 isolate。第二个是 `spawn()`，它根据当前\
  \ isolate 的根库产生 isolate。\n\nDart 程序在由 Dart 运行时启动的 `main isolate` 中开始执行。为了创建新的 isolates，需要使用上述方法。\n\
  \n\n\n\n\n在本节中，我们将展示如何构建一个应用程序，使其独立于 Web 浏览器的具体机制。我们将应用程序视为一对相互通信的隔离器（isolates），一个代表服务器，另一个代表客户端。\n\
  \n我们认为服务器本身就是一个对象，它拥有一组向客户端提供的操作接口。这些操作将是异步的，并返回 `future`。然而，返回的 `future` 将是我们现在要定义的特殊类型，我们称之为\
  \ `promises`（承诺）。\n\n### 8.5.1 Promise：更美好的未来\n\nPromise 的设计是为了减轻与异步代码交互的痛苦。Promise\
  \ 会自动处理 `future` 回调的模板代码。通过使用 `noSuchMethod()`，promise 将在其上进行的方法调用转换为使用 `then()`\
  \ 的回调。\n\n当一个方法调用返回一个 promise 时，人们可以立即在该 promise 上继续调用其他方法，几乎就像它就是实际结果一样。这缓解了使用\
  \ `future` 的许多单调感，因为代码不再充满深度嵌套的回调声明。\n\n点击此处查看代码图像\n\n```\nlibrary promise;\n\n\
  import 'dart:async' show Completer, Future;\n\nimport 'dart:mirrors' show InstanceMirror,\
  \ reflect;\n\n@proxy class Promise {\n  Future future;\n  Promise(this. future);\n\
  \  noSuchMethod(Invocation inv) {\n    onValue(v) {\n      InstanceMirror m = reflect(v);\n\
  \      var result = m.delegate(inv);\n      return result;\n    }\n    return new\
  \ Promise( future.then(onValue));\n  }\n}\n\nclass Resolver {\n  Completer completer\
  \ = new Completer();\n  Promise _promise;\n  get promise {\n    return promise ==\
  \ null ? _promise = new Promise(_completer.future): _promise;\n  }\n  resolve(v)\
  \ {\n    _completer.complete(v);\n  }\n}\n```\n\n#### 8.5.1.1 局限性：无法保留的 Promise\n\
  \n上述代码存在我们之前在通用代理中看到问题 (5.7.6)。promise 与实际值之间的差异将通过动态类型检查检测——包括显式检查和强制转换（通过 `is`\
  \ 和 `as`）以及检查模式下的隐式检查。\n\n当结果用于控制结构（如条件语句和循环）或输出时，该过程也会崩溃。比较打印已知值 `v` 与打印用于 `v`\
  \ 的 promise `p`：\n\n点击此处查看代码图像\n\n```\nprint(v); // 打印值 v\nprint(p); // 打印类似 'An\
  \ instance of Promise' 的内容\n```\n\n这里的直接问题是 `print()` 依赖于 `toString()`，而它是继承自 `Object`\
  \ 的。更彻底的转发机制将覆盖 `Object` 的所有方法并通过 `then()` 将它们转发给 `future`。然而，这并没有真正解决此类问题；反而加剧了它。如果\
  \ `print()` 从 `toString()` 得到一个 `Promise` 而不是预期的字符串，它将抛出异常。\n\n更严重的是控制流问题。如果我们有一个异步谓词，我们无法使用其结果在条件语句中做出控制流决策。(2)\n\
  \n**2。** 输出和控制流的问题在根本上是相同的。这些本质上是不会接受延迟输入的严谨函数。\n\n我们可以尝试添加模拟条件判断的方法，本质上是将控制流的决策推迟到\
  \ promise 被解析（resolve）。然而，这些方法无法妥善处理 `break`、`continue` 和 `return` 等结构。\n\n最后，对性能存在一些担忧。使用\
  \ `noSuchMethod()` 的调用可能比普通调用慢得多，因此需要注意不要在性能关键型代码中使用它们。对于我们设想的远程隔离器通信场景，这不应该是一个问题。一个潜在更严重的担忧是，使用\
  \ `noSuchMethod()` 使代码更难进行静态分析，这在编译为 JavaScript 时往往会增加体积。\n\n尽管存在所有这些问题，promise\
  \ 在某些情况下仍然有用。在接下来的章节中，我们将看到客户端-服务器通信的上下文中使用 promise。\n\n### 8.5.2 作为分布式对象的隔离器\n\n\
  我们的下一步是提供隔离器对象的视图。我们需要将服务 API 定义为 Dart 类，编写从客户端运行服务的代码，当然还要实现该服务。最后，我们还需要构建服务及其客户端使用的基础设施。\n\
  \n#### 8.5.2.1 服务 API\n\n假设我们有一个服务，允许人们向给定地址发送 cookie。该服务的 API 非常简单，由以下抽象类给出：\n\n\
  点击此处查看代码图像\n\n```\nabstract class CookieService {\n  Receipt sendCookiesTo(recipientAddress,\
  \ customer);\n}\n```\n\n你告诉服务向哪里发送 cookie，并提供你的详细信息以便他们收费。服务在处理请求后会返回收据。\n\n######\
  \ 序列化\n\n我们的模型依赖于在客户端和服务器之间发送对象，这涉及到对象序列化。我们假设所有被序列化的对象都是两端已知类型的实例。\n\n##### 8.5.2.2\
  \ 运行服务\n\n为了运行服务，我们通过库定义我们的主隔离器：\n\n点击此处查看代码图像\n\n```\nlibrary drive;\n\nimport\
  \ 'civilisolates.dart' as civilisolates show startService;\n```\n\n我们依靠 `civilisolates`\
  \ 库提供必要的基础设施，特别是下面使用的 `startService` 方法：\n\n点击此处查看代码图像\n\n```\nmain() {\n  var cookieService\
  \ = civilisolates.startServiceObject(new Uri(path: 'cookie service.dart'));\n  cookieService.sendCookies(getAddress(),\
  \ getCustomerDetails());\n}\n```\n\n上述代码使用 `startServiceObject` 基于 `cookie service.dart`\
  \ 启动服务。`startServiceObject` 的作用是根据它的启动一个隔离器，并返回一个允许与新隔离器通信的 promise。\n\n接下来，我们在存储在本地变量\
  \ `cookieService` 中的 promise 上调用 `sendCookies()`。服务隔离器可能还没有启动，但没关系；因为 `startServiceObject`\
  \ 返回的是 promise 而非普通的 future，我们可以立即对其调用方法。\n\n客户端只需要通过 URI 引用服务。之后，它像普通对象一样与服务通信。正如我们将看到的，服务器端的情况也很简单。#####\
  \ 8.5.2.3 服务实现\n\n为了实现服务，我们如下定义 `cookie service.dart`：\n\n点击此处查看代码图像\n\n```\nlibrary\
  \ cookie service;\n\nimport 'civilisolates.dart' as civilisolates show serve;\n\n\
  class MyCookieService implements CookieService {\n  Receipt sendCookiesTo(recipientAddress,\
  \ customer){\n    charge(customer); // 首先要做的\n    initiatePhysicalShipment(recipientAddress);\n\
  \    return new Receipt(customer);\n  }\n}\n\nmain(args, client) {\n  CookieService\
  \ obj = new MyCookieService();\n  civilisolates.serve(obj, client);\n}\n```\n\n\n\
  \n\n再次，我们导入 `civilisolates` 来提供必要的基础设施。`cookie service` 库定义了一个类 `MyCookieService`，它包含一组定义了该库提供的服务\
  \ API 操作。为了让该库作为一个服务运行，我们实例化 `MyCookieService` 并将其传递给 `civilisolates.serve()`。对\
  \ `serve()` 的调用会让当前运行的 isolate 监听来自 `client` 的消息，将其转换为对 `service` 的方法调用，并将序列化结果传回；简而言之，`serve`\
  \ 让当前 isolate 充当由 `obj` 实现的服务。\n\n我们几乎所有的代码都独立于异步操作。我们在普通类中定义了所需的功能。在服务器端，只有 `main()`\
  \ 稍显特殊——但幸运的是它非常短且公式化。\n\n当然，这幅图有点过于简化了。如果我们有依赖于异步调用结果的复杂控制流，我们的承诺（promises）运行起来就不会那么顺畅。我们确实必须在合适的粒度上设计\
  \ isolate 的 API，以避免这些问题并减少往返次数。但我们已经避免了大量的模板代码。\n\n#### 8.5.2.4 基础设施\n\n现在让我们来看一直用于定义和启动我们服务的基础设施。这包括\
  \ `startService` 和 `serve` 的定义。它们都定义在 `civilisolates` 库中。\n\n点击此处查看代码\n\n```\nlibrary\
  \ civilisolates;\n\nimport 'dart:isolate' show Isolate, ReceivePort, SendPort;\n\
  \nimport 'dart:async' show Completer, Future;\n\nimport 'dart:mirrors' show InstanceMirror,\
  \ reflect;\n\nimport 'promise.dart' show Promise, Resolver;\n\nimport 'serializer.dart'\
  \ as serializer show serialize;\n\nimport 'deserializer.dart' as deserializer show\
  \ deserialize;\n\nmsg2Obj(List<String> msg) => deserializer.deserialize(msg);\n\n\
  List<String> obj2Msg(obj) => serializer.serialize(obj);\n```\n\n我们将利用在第 7.1.3 节\
  \ 中引入的序列化。当然，这些想法更健壮的实现需要更好的序列化支持，但我们目前的已足够说明主要思想。\n\n下面，你可以看到 `serve` 如何帮助一个 isolate\
  \ 将对象（`obj`）作为服务提供给指定的客户端（通过发送端口 `client` 表示）。它设置了与客户端通信所需的必要端口。然后它监听任何传入的消息，并使用反射将其转发给\
  \ `obj`，最后将结果传回客户端：\n\n点击此处查看代码\n\n```\nvoid serve(obj, SendPort client) {\n\n \
  \ // send client our address\n  ReceivePort rport = new ReceivePort();\n  SendPort\
  \ selfPort = rport.sendPort;\n  client.send(selfPort);\n\n  // set up listener to\
  \ respond to sends from client\n  InstanceMirror target = reflect(obj);\n  rport.listen\
  \ (\n    (msg){\n      var invArgs = msg[0];\n      SendPort returnAddress = msg[1];\n\
  \      // forward invocation to obj\n      var result = target.invoke(invArgs[0],\
  \ msg2Obj(invArgs[1]), msg2Obj(invArgs[2]));\n      // extract and serialize result\
  \ and send back to client\n      returnAddress.send(obj2Msg(result.reflectee));\n\
  \    }\n  );\n}\n```\n\n接下来，`startServiceObject` 被客户端用于设置一个表示服务的对象。该服务将由位于 `uri`\
  \ 的库实现。我们将使用一个运行我们服务的 isolate。我们从连接端口和产生服务 isolate 的机制开始。我们想为该 isolate 创建一个代理对象，但\
  \ isolate 是异步创建的。我们拥有的只是一个用于 isolate 端口的 future。因此，我们返回一个代理的 promise。当端口的 future\
  \ 完成时，它将触发代理的创建：\n\n点击此处查看代码\n\n```\nPromise startServiceObject(uri) {\n  ReceivePort\
  \ rport = new ReceivePort();\n  SendPort selfPort = rport.sendPort;\n  // start\
  \ up the service isolate\n  Isolate.spawnUri(uri, [], selfPort);\n  // When we get\
  \ the isolates address back\n  // we can set up a proxy object for it. In the meantime,\n\
  \  // return a promise for the proxy\n  Future<SendPort> target = rport.elementAt(0);\n\
  \  return new Promise(target.then((s) => new IsolateProxy(s)));\n}\n```\n\n最后一块拼图是\
  \ isolate 的代理。它的工作原理与我们之前看到的代理类似。不同在于 `noSuchMethod` 例程方法的功能。它必须专门创建一个端口来监听答案。为了简化起，我们没有处理命名参数。\n\
  \n点击此处查看代码\n\n```\nclass IsolateProxy {\n  final SendPort _sendPort;\n\n  IsolateProxy(this._sendPort);\n\
  \n  noSuchMethod(inv) {\n    ReceivePort rport = new ReceivePort();\n    SendPort\
  \ selfPort = rport.sendPort;\n    Resolver resolver = new Resolver();\n    rport.listen((answer){\n\
  \      var a = msg2Obj(answer)[0];\n      resolver.resolve(a);\n      rport.close();\n\
  \    });\n    _sendPort.send([obj2Msg([inv.memberName, inv.positionalArguments]),\
  \ selfPort]);\n    return resolver.promise;\n  }\n}\n```\n\n当然，在给定 isolate 的发送端口的情况下，可以直接创建代理；不必非使用\
  \ `startServiceObject`。它仅仅是在我们首次启动服务时的一种便利方法。\n\n遗憾的是，由于上述第 8.5.1.1 节中提到的所有原因，如图所示的链式承诺在\
  \ Dart 中的用途有限。为了解决这些局限性，Dart 在语言层面提供了对异步的专门支持，我们接下来将展示。\n\n### 8.6 异步函数\n\n正如我们所见，直接处理\
  \ futures 可能会很别扭。问题之一是，我们熟悉的经典控制结构在设计时并没有考虑异步操作。一旦进行了异步调用，跟踪调用是否已执行、执行是否成功以及结果是什么的所有必要簿记工作都变成了程序员的责任。调度\
  \ futures 以及在工作完成后（无论成功失败）调度待要执行的工作是非常繁琐的。\n\n为了减轻处理异步操作的痛苦，Dart 为异步函数提供了语言级支持。函数体可以被标记为\
  \ **async** 修饰符；此时该函数就变成了一个 ***async*** *函数*：\n\n点击此处查看代码\n\n```\nFuture<int> foo()\
  \ async => 42;\n```\n\n使用 **async** 函数可以从多个方面简化处理 futures 和异步操作的任务。\n\n当调用一个 **async**\
  \ 函数时，函数代码不会立即执行。相反，函数中的代码会被调度在未来的某个时间执行。那么，返回给调用者的是什么？一个在函数体完成时（无论成功失败）将变为完成的 future。函数会自动创建该\
  \ future 并立即将之返回给调用者。\n\n\n\n\n显然，这让程序员避免了编写相当数量的样板代码，但 `async` 函数的真正价值在于它们可以包含\
  \ `await` 表达式。\n\n### 8.6.1 Await\n\n`await` 表达式允许人们几乎像编写同步代码一样编写异步代码。执行 `await`\
  \ 表达式允许我们在等待异步计算完成时，挂起周围的函数。\n\n回想一下我们在 第 8.2.1 节 中的示例，当时我们想要测试 `File` 的 `copy()`\
  \ 方法是否如其描述的那样工作。使用 `await`，我们可以这样写断言：\n\n点击此处查看代码图片\n\n```\nassert((await myFile.copy(myPath)).path\
  \ == myPath);\n```\n\n这与我们在 `copy` 是同步的情况下会编写的代码非常相似：\n\n点击此处查看代码图片\n\n```\nassert(myFile.copy(myPath).path\
  \ == myPath);\n```\n\n并且比显式使用 future（未来器）的版本更直接：\n\n点击此处查看代码图片\n\n```\nmyFile.copy(myPath).then((f){\
  \ assert(f.path == myPath);});\n```\n\n`await` 只能在 `async` 函数内部使用。Dart 编译器不会在其他地方接受\
  \ `await`。\n\n在思考 `async` 函数的执行时，需要记住它的体已经被调度为独立于其调用者的执行，即在稍后的一个轮次中执行。因此，当 `async`\
  \ 函数运行时，它的调用者早已离开了。特别是在调试时，没有有意义的调用堆栈可以引用——也没有可以返回的调用者。那么，`async` 函数内部的 `return`\
  \ 语句意味着什么呢？`return` 能做的只是用一个值完成与 `async` 函数关联的 future。像往常一样，不带嵌套表达式的 `return` 被视为\
  \ `return null` 的简写；同样，如果一个 `async` 函数抛出了它没有捕获的异常，那么该函数的 future 将用抛出的对象完成完成。\n\n\
  ### 8.6.2 异步生成器 (Asynchronous Generators)\n\n异步生成器是 Dart 支持的另一种异步函数形式。用 `async`\
  \ 修饰符标记的函数体作为流（stream）的生成器函数 (4.8)。这个思想通过一个示例说明最好。以下函数产生一个包含顺序自然数的流：\n\n```\nget\
  \ naturals async* {\n  int k = 0;\n  while (true) {\n    yield await k++;\n  }\n\
  }\n```\n\n当调用 `naturals` 时，它会立即返回一个新的流。一旦该流被监听，函数体就会按顺序运行，生成值以填充流。该函数在无限循环中运行。每次迭代执行一个\
  \ `yield` 语句，该语句内部包含一个 `await`。`await` 增加 `k` 并挂起函数。\n\n稍后，函数带有新的 `k` 值恢复，`yield`\
  \ 将其附加到流中。这个过程在每次迭代中重复，将下一个自然数添加到流中。当然，这并不是产生该序列的一种好方法；该函数在每次事件循环循环中最多运行一次。\n\n\
  这里有一个更真实的示例，它通过 HTTP 分块获取数据并将其放入流中。调用函数 `getRepeatedly` 时传入了一个 URI `uri` 和一个数字 `n`，表示该\
  \ URI 应该被访问的次数：\n\n点击此处查看代码图片\n\n```\nStream getRepeatedly(uri, n) async* {\n  for\
  \ (var i = 0; i < n; i++) {\n    var response = await http.get(uri);\n    var nextJson\
  \ = json.convert(response.body);\n    yield nextJson;\n    await new Future.delayed(new\
  \ Duration(seconds: 2));\n  }\n}\n```\n\n流会立即返回给调用者。一旦流被监听，`getRepeatedly` 的体将开始运行。它将循环\
  \ `n` 次；每次迭代将使用 `await` 异步访问提供的 URI 以获取响应并挂起。响应准备好后，函数将恢复。响应被转换为 JSON 并发布到返回给调用者的流中。然后函数等待两秒并开始下一次迭代。\n\
  \n### 8.6.3 Await-For 循环\n\n给定一个流，可以对其它的值进行循环：\n\n点击此处查看代码图片\n\n```\nawait for (var\
  \ i in naturals) { print('event loop $i'); }\n```\n\n每当有一个元素被添加到流中，循环体就会运行一次。在每次迭代之后，封装循环的函数会挂起，直到下一个元素可用或流结束。\n\
  \n就像 `await` 表达式一样，`await-for` 循环只能出现在异步函数内部。这两种情况的原理相同：这两种结构都会导致周围的函数挂起，而挂起的函数就不再是同步的。\n\
  \n### 8.7 相关工作\n\nDart 的隔离器（isolates）模型是 40 年前提出的 actor 模型[22] 的变体，它们拥有自己的内存。自那时以后，许多语言引入了\
  \ actor 模型的变体，特别是 Erlang[23]、E[24]、Newspeak[25] 和 Scala[26]。正如 E、Newspeak 和原始 actor\
  \ 模型一样，Dart 的消息传递是非阻塞的。编程中的未来概念有许多变体，包括 E 的 promises 和 Scala 的 futures。Dart 的流深受\
  \ Meijer 关于 Rx[28] 研究的影响。\n\n### 8.8 总结\n\nDart 程序由多个隔离器组成，每个隔离器拥有自己的内存和单线程。隔离器是\
  \ Dart 的并发和安全单元，通过异步消息传递进行通信。消息发送返回表示预期结果的 future。future 支持在完成（无论成功还是失败）时指定要执行的回调。流提供了构建\
  \ Dart 应用的高级抽象。最后，`async` 方法使得以与同步相似的方式编写异步程序成为可能。\n\n## 9. 结论\n\n通过对 Dart 的全面之旅，我们可以得出什么结论？在处理\
  \ Dart 的过程中我学到了哪些传达给你的知识？哪些地方可以做得更好？在这个简短的章节中，我们将回顾现状的 Dart 以及未来可能的 Dart。\n\n###\
  \ 9.1 可选类型\n\n可选类型以各种形式已被提出了几十年。Dart 是第一种从诞生起就支持可选类型的主流编程语言。在 Dart 出现后，其他语言也出现了类似的功能。这些语言并不一定是受\
  \ Dart 直接启发的。然而，非强制类型系统确实是一个时代性的想法。\n\n不那么明确的是 Dart 是否代表了该领域的最佳方法。Dart 作为语言规范的一部分强制了一种特定的可选类型系统。但优势是，可选类型（特别是可插式类型[29]）的灵活性如果成为语言工具的一部分而非语言本身，将得到最大化。语言工具的演进速度可以比语言本身更快。\n\
  \n\n\n\n检查模式（Checked mode）已被证明是一把双刃剑。它的用处显而易见，但也是有代价的。尽管有人认为检查模式仅仅是一个开发阶段的工具，但它往往被视为一种事实上的运行时类型系统，这违背了类型系统不应影响运行时语义的原则。在本书中，我们在讨论代理（proxies）时，已经看到了检查模式这种不受理想的影响。\n\
  \n检查模式的另一个弱点是它是“全或全无”的。人们可能希望能够以细粒度地激活检查模式，也许是按模块甚至按函数来进行。\n\n一个健壮的（但可选的）静态类型判别可以减少对检查模式的需求。一个具有健壮规则但没有检查模式的设计更接近\
  \ `Strongtalk` 原始的可选类型系统，并且可能是一个很有吸引力的替代方案。可选类型确实可以是健壮的。像往常一样，这涉及到权衡。`Dart` 选择了放弃健壮性，以更好地符合程序员的直觉。然而，健壮分析具有重要的益处。我们越贴近真正可选（因此是可插的）类型的理念，在根据需要选择健壮或非健壮方法时就越有灵活性。\n\
  \n可选类型产生的一个有趣且意料之外的影响是用户预期的提高。一旦人们意识到程序尽管有类型警告也能正确运行，他们就会要求类型系统具有更高的智能性。示例包括流感知类型规则和更好的推断。\n\
  \n总的来说，将类型移出语言领域并进入工具领域，可能会更好地服务用户，允许一个快速演进的健壮与非健壮类型系统的混合体，并辅以不同的推断方法。\n\n### 9.2\
  \ 面向对象\n\n`Dart` 是一门纯的面向对象的语言。所有的运行时值都是对象，在大多数情况下这种做法运行得非常好。\n\n然而，在 `Dart` 中某些东西并不是运行时值，因此它们不是对象。库（Libraries）和前缀（prefixes）是这里明显的罪祸首。奇怪的是，库和前缀在底层通常被实现为对象，而是语言本身破坏了这种一致性。\n\
  \n将库视为完全功能对象的后果是深远的。正因为其影响如此深远，这一想法在 `Dart` 中并没有被追求。它挑战了关于模块系统的传统观念，因此违背了熟悉性的目标。\n\
  \n使用传统的模块化构建的代价是高的，因为传统的模块化构建是极其不的。我们遇到了一系列涉及依赖注入、灵活的库配置和动态加载的问题。所有这些问题都可以通过更激进的设计来，如\
  \ `Newspeak` [30] 所示。\n\n类在 `Dart` 中是对象，但它们的功能是有限的。将类方法和构造函数视为静态特征的决定是一个失去了利用纯对象模型统一性的机会。在一个库和类都是对象的世界上，只需要一种方法访问方式（实例访问），而不是三种（顶层、类和实例）。这种简化会贯穿整个系统，从规范到实现再到工具。\n\
  \n最后，有一种观点认为，纯面向对象要求运行的程序/系统本身也必须是一个对象。这种观点意味着反射（reflection）是面向对象的不可或缺的一部分。`Dart`\
  \ 支持反射，但没有它可以做得那么好或彻底。下一节将探讨这个主题。\n\n### 9.3 反射\n\n`Dart` 对反射的支持仍在进化中。在目前，它还没有达到理想状态。程序员通常被建议避免使用，主要由于与部署代码大小相关的务实问题。这些问题在第\
  \ 7 章 中讨论过。\n\n确实，在某些情况下反射被过度使用了。反射在支持依赖注入和用户界面框架的绑定方面特别被过度利用。遗憾的是，`Dart` 中甚至需要依赖注入。前一节提到的基于第一类库的强大模块化技术将使依赖注入框架变得没有必要。\n\
  \n另一方面，追求反射的倾向说明了它在力量和便利方面的价值。以有效的方式支持反射是完全可能的，正如第 7.4 节 所。\n\n超越自省动态演变程序 (7.5)\
  \ 是另一个 `Dart` 缺乏反射支持的领域。这对整个 `Dart` 编程体验产生了巨大影响，正如接下来的节所述。\n\n### 9.4 工具\n\n编程涉及的不仅仅是编程语言的抽象概念。编程的现实涉及语言、实现、库、工具、文化和社区。\n\
  \n`Dart` 曾雄心将 `Smalltalk` 的许多优势带给更广泛的受众。正如本书大部分提到的，它受到了 `Smalltalk` 的深度影响。然而，`Dart`\
  \ 在熟悉性和目标实现平台方面的限制往往缩小了这种雄心。\n\n这些局限性在工具领域最为显著。有许多支持 `Dart` 的 IDE。为了保持 `Dart` 熟悉的感受，这些\
  \ IDE 在设计上都非常传统。它们中没有一个能提供与 `Smalltalk` IDE 相似的体验。`Smalltalk` 实时编程（live programming）的理想在近年来享了复兴，未来的\
  \ `Dart` 开发环境应该纠正这一缺陷。\n\n`Smalltalk` 的实时感源于元循环工具设计与程序在执行时修改自身的能力的结合。是程序随时间改变自身的能力，而不是动态类型，真正让一门编程语言变得动态。这种动态性可以通过镜像构建器（mirror\
  \ builders） (7.5) 以结构化的方式实现。\n\n大多数 `Dart` IDE 并不是用 `Dart` 编写的，也不具备实时性。任何主题、插件和选项都无法替代程序员根据需求塑造工具并在过程中获得即时反馈的能力。\n\
  \n### 9.5 总结\n\n`Dart` 是一门旨在为主流读者提供熟悉且实用的编程语言，同时尝试遵循面向对象的核心原则：对象的唯一重要的是它的行为，每个运行时值都是对象，而程序的代码本身可以被视为一个对象并进行反射。\n\
  \n在本书期间，Google 内部有数百万行 `Dart` 代码在使用，外部也有数百万行。这种语言对许多程序员来说显然是有用的；而且显然是熟悉的。\n\n为了保持熟悉，`Dart`\
  \ 并不总是像本书作者希望的那样遵循面向对象的原则。为了保持实用，它主要关注 Web 编程，这也导致了妥协。\n\n然而，`Dart` 对编程世界产生了重要影响。世界已经习惯了可选类型的理念。人们对动态类型纯面向对象语言所预期的性能被提高了。\n\
