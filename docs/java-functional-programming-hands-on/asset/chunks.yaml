    ### 去重 (Distinct)


    有多种方法可以获取唯一数据的结果，但在这里我们使用 `distinct()` 方法。


    正如我们所看到的，上面的示例中只需调用 `distinct()` 方法即可，但如果你想对任何自定义类执行相同的操作，你必须重写 `hashcode()` 和
