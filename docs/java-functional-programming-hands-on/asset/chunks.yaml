    ## How to create a Stream ?


    ### `Stream` is a sequence of elements that can be pipelined.


    - It supports sequential as well as parallel operation.

    - It was introduced in Java 8 as part of the Java Streams API under `java.util.stream`
    package.

    - `Streams` are used for processing sequences of data, such as collections (e.g.,
    lists, sets, maps) or other data sources, in a functional and declarative manner.

    - Creating a parallel `Stream` will create the same number of parallel `Streams`
    as no of processors available. It''s a default behavior BUT you can change it
    as required.


    The most common use case to create `Stream` is to create `Stream` from a Collection
    Object. Assume you have an `Employee List` of 10K records where we have to do
    some operations like Sorting, Filtering, Data Transformation logic, Grouping data,
    Partitioning data or other operations we wanted to perform on bulk data.


    ![](image_rsrc11P.jpg)


