    ### Notes

    - NOTE- you can use `Employee Record` instead of `Employee` class THEN you no
    need to provide the implementation for `hashcode()` and `equals(Object o)` method
    since JAVA does it by default.

    ![](image_rsrc12K.jpg)

    - OR you can even use the Lobok library also to handle getter/setter ,hashcode
    and equals methods using annotations. https://projectlombok.org/#


    ### Getting Unique Results

