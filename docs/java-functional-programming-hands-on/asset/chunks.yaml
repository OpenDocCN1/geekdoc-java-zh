    ### 在 Stream 上使用 `map(f)` 进行数据转换


    注意，简单来说 `map(f)` 用于将数据从类型 X 映射到任何结果 Y。


    根据上面的示例，你将 `Employee Object` 映射到了 `NAME`。它接受一个执行转换逻辑的函数。


