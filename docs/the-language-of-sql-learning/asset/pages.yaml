- pgno: 112
  md: '# Chapter 9 Summarizing Data


    Moving on to the NTILE function, we''ll offer examples of NTILE(4) and NTILE(10).
    As mentioned, the NTILE ranks the rows in a specified sequence, and then assigns
    them to a group. In the case of NTILE(4), the data is divided into four groups.
    This is commonly referred to as quartiles. NTILE(10) divides the data into ten
    groups, others. To illustrate, the following statement ranks stocks by PE ratio
    and displays NTILE(4) and NTILE(10):


    ```

    SELECT

    NTILE(4) OVER (ORDER BY PriceEarningsRatio) AS ''Quartile'',

    NTILE(10) OVER (ORDER BY PriceEarningsRatio) AS ''Decile'',

    StockSymbol AS ''Symbol'',

    PriceEarningsRatio AS ''PE Ratio''

    FROM Stocks

    ORDER BY PriceEarningsRatio

    ```


    The resulting output is:


    | Quartile | Decile | Symbol | PE Ratio |

    |---|---|---||

    | 1 | 1 | KRFT | 12 |

    | 1 | 1 | AAPL | 14 |

    | 1 | 2 | MSFT | 15 |

    | 2 | 2 | WMT | 15 |

    | 2 | 3 | ORCL | 17 |

    | 2 | 4 | MCD | 18 |

    | 2 | 4 | MMM | 20 |

    | 3 | 5 | DIS | 21 |

    | 3 | 6 | KO | 21 |

    | 3 | 7 | HSY | 24 |

    | 3 | 8 | GOOG | 30 |

    | 4 | 9 | SBUX | 357 |

    | 4 | 10 | AMZN | 489 |


    The Quartile column divides the data into four groups, based on a ranking of the
    PE ratio. As seen, rows 1 to 4 fall in the top quartile, rows 5 to 8 in the second
    quartile, and so on. The Decile column divides the data into ten groups in a similar
    manner. With larger sets, it would be common to include an NTILE(100) function
    to divide the data into 100 groups. Each of these 100 groups is commonly referred
    to as a percentile.*


    # Database Differences: MySQL


    Unlike Microsoft SQL Server and Oracle, MySQL doesn''t provide the OVER keyword
    or the ranking functions discussed in this section. Likewise, it doesn''t provide
    the PARTITION BY keyword discussed in the following section.'
