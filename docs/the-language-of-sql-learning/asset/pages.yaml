- pgno: 120
  md: '# Chapter 10 Subtotals and Crostabs


    As you can see, the ORDER BY clause changes the location of the subtotal and total
    rows. They now appear before after each category. This is because NULL values
    are the lowest possible value, so they appear first in the sorted sequence.


    It''s to say that the use of the NULL values in the examples is somewhat obtuse
    and difficult to interpret. We will now show how to convert NULL values to something
    more meaningful. This is accomplished via a function called GROUPING. This is
    a special aggregate function that works in conjunction with the ROLLUP operation.
    As will be seen in the next section, GROUPING also works with the CUBE function.
    The following example adds two columns that make use of the GROUPING function.
    To make things simpler, we''ll remove the ORDER BY clause.


    ```

    SELECT

    Category,

    Subcategory,

    SUM(Quantity) AS ''Quantity'',

    GROUPING(Category) AS ''Category Grouping'',

    GROUPING(Subcategory) AS ''Subcategory Grouping''

    FROM Inventory

    GROUP BY ROLLUP (Category, Subcategory)

    ```


    The output is:


    | Category | Subcategory | Quantity | Category Grouping | Subcategory Grouping
    |

    |---|---|---|---|--|

    | Furniture | | 5 | 0 | 0 |

    | Furniture | Desk | 4 | 0 | 1 |

    | NULL | | 9 | 0 | 0 |

    | Paper | Copy | 7 | 0 | 0 |

    | Paper | Notebook | 4 | 0 | 1 |

    | NULL | | 11 | 0 | 1 |

    | NULL | NULL | 20 | 1 | 1 |


    Let''s outline what the GROUPING function accomplishes. This function has a single
    argument, which is the name of the column to be examined, and it returns either
    a 0 or 1. A 1 means that this row contains a subtotal or total, as the ROLLUP
    in the GROUP BY clause. In this example, the ROLLUP is on Category and Subcategory.
    So the Grouping on Subcategory returns a 1 if this row provides a subtotal for
    Subcategory. The function returns 0 if it is not a subtotal for the provided column.
    As you can see, the third row in the preceding output has NULL in the Subcategory
    column, and a corresponding value of 1 in the Grouping column.


    Now we''ve see what the GROUPING function does, let''s put it to good use. In
    the next example, we''ll introduce a CASE statement to translate the result of
    the GROUPING function to a more meaningful label.'
