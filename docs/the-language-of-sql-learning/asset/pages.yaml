- pgno: 187
  md: '# Modifying Data


    Keywords Introduced

    INSERT INTO • VALUES • DELETE • TRUNCATE TABLE • UPDATE • SET


    Exhausted our discussion of retrieving data from databases, we now move on to
    the question of how to modify data in a database. There are three basic scenarios
    to how data can be modified:


    +   - Inserting new rows into a table

    - Deleting rows from a table

    - Updating existing data in specific rows and columns in a table


    As may be surmised, inserting and deleting rows is relatively straightforward.
    Updating existing data, however, is a more complex endeavor, as it involves identifying
    the rows to be updated and also the specific columns in rows the inserts and deletes
    and then move on to updates.


    # Modification Strategies


    The mechanics of modifying data are fairly straightforward. However, the nature
    of the process means that this is an area fraught with peril. Being human, mistakes
    can be made. With a single command, you can easily delete thousands of rows in
    error or apply incorrect updates that may be difficult to retract.


    As a practical matter, various strategies can be employed to help prevent catastrophic
    blunders. For example, when deleting rows from a table, you can employ a soft
    delete technique. This means that instead of actually deleting rows, you denote
    a special column in a table that marks each row as active or inactive. Rather
    than deleting a row, you merely mark it as inactive. That way, if a deletion is
    done in error, you can easily reverse it by changing the value of the active/inactive
    status column.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'A similar technique can be used when doing inserts. When adding a row, you
    can mark the exact date and time of the insert in a special column. If it is later
    determined that the row was added in error, you can find all rows that were added
    within a specified time range and have deleted.


    The problem is more complex when updating data. Generally, it is advisable to
    maintain a separate table that holds data on intended update transactions. If
    any kind of error is made, you can go back to the transaction table to find the
    before and after values for data that was modified and use that to reverse any
    earlier mistakes.


    The aforementioned strategies are just a few of the many approaches you can take.
    This topic is well beyond the scope of this book. The bottom line is to exercise
    caution when updating data. Unlike many user-friendly desktop applications, SQL
    has no undo command.


    # Inserting Data


    SQL provides an INSERT keyword for adding data into a table. There are two basic
    ways INSERT can be:


    +   - Insert specific data listed in an INSERT statement

    - Insert data obtained from a SELECT statement


    Let''s start with an example that shows how to insert Data, where the values are
    specified in the INSERT statement. We assume that we have a Clients table with
    data already in:


    | ClientID | FirstName | LastName | State |

    |---|---|---||

    | 1 | Joyce | Bentley | TN |

    | 2 | Miguel | Ramirez | PA |

    | 3 | Ellen | Baker | OR |


    Let''s also assume that the first column, ClientID, is the primary key for the
    table. Back in Chapters 1 and 2, we talked about the fact that primary keys enforce
    the requirement that each row in a table be uniquely identifiable. We also mentioned
    that primary keys are often specified as auto-increment columns. This means that
    they are automatically assigned a number as rows are added to the table.


    Assuming that the ClientID is defined as an auto-increment column, this means
    that when we add a row to the Clients table, we don''t need to specify a value
    for the ClientID column. It will be automatically determined as each row is added
    to the table. We need only to specify values for the other three columns.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Inserting Data 173


    Let''s proceed with a procedure that adds two new customers to the table: Claudia
    Davis from\Ohio and Ingrid Krause from California. This statement performs the
    insert:


    ```

    INSERT INTO Clients

    (FirstName, LastName, State)

    VALUES

    (''Claudia'', ''Davis'', ''OH''),

    (''Ingrid'', ''Krause'', ''CA'');

    ```


    After the insert, the table contains:


    | ClientID | FirstName | LastName | State |

    |---|---|---|--|

    | 1 | Joyce | Bentley | TN |

    | 2 | Miguel | Ramirez | PA |

    | 3 | Ellen | Baker | OR |

    | 4 | Claudia | Davis | OH |

    | 5 | Ingrid | Krause | CA |


    # Database Differences: Oracle


    Oracle doesn''t support auto-increment columns.


    Also, Oracle doesn''t permit multiple rows to be specified by the VALUES keyword.
    The

    previous example would need to be broken down into two statements, as follows:


    ```

    INSERT INTO Clients

    (FirstName, LastName, State)

    VALUES

    (''Claudia'', ''Davis'', ''OH'');

    INSERT INTO Clients

    (FirstName, LastName, State)

    VALUES

    (''Ingrid'', ''Krause'', ''CA'');

    ```


    Also note that the order of the data elements after the VALUES keyword corresponds
    to the

    order of columns listed in the columnlist listed not have to be the same as in
    the database. In other words,

    the columns themselves the above insert could have been accomplished just as easily
    with this statement:


    ```

    INSERT INTO Clients

    (State, LastName, FirstName)

    VALUES

    (''OH'', ''Davis'', ''Claudia''),

    (''CA'', ''Krause'', ''Ingrid'');

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'In this INSERT, we listed the State column first instead of last. Again, the
    order in which columns are listed doesn''t matter.


    To sum up, the general format for the INSERT INTO statement is:


    ```

    INSERT INTO table

    (columnlist)

    VALUES

    (RowValues1),

    (RowValues2)

    [repeat any number of times]

    ```


    The columns in the columnlist must correspond to the columns in RowValues.


    Also, if all the columns in the columnlist are listed in the same order as they
    physically exist in the database, and there are no auto-increment columns in the
    table, the INSERT INTO statement can be executed without specifying the columnlist.
    However, this practice is strongly discouraged because it is prone to error.


    It''s also possible to use an INSERT statement without specifying all the columns.
    When that occurs, columns not specified are given NULL values. For example, let''s
    say we want to insert one additional row into the Clients table for a customer
    named Deepak Gupta. However, we don''t know Deepak''s state. Here''s the INSERT:


    ```

    INSERT INTO Clients

    (FirstName, LastName)

    VALUES

    (''Deepak'', ''Gupta'')

    ```


    Afterward, his row in the table will appear as:


    | ClientID | FirstName | LastName | State |

    | 6 | Deepak | Gupta | NULL |


    Because we didn''t specify a value for the State column for this new row, it is
    given a NULL value.


    There are two variations of the INSERT INTO statement. The second format applies
    where you insert data obtained from a SELECT statement. That instead of listing
    data elements after a VALUES keyword, you substitute a SELECT statement that obtains
    the necessary values.


    To illustrate, let''s say we have another table NewClients, which holds data that
    we would like to insert into the Clients table. The NewClients table might look
    like this:


    | State | Name1 | Name2 |

    | RI | Roberto | Harris |

    | PA | Beata | Kowalski |

    | RI | Galina | Melnyk |'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'We would like to add all customers from the state of Rhode Island (RI) from
    the NewClients table to the Clients table, the following would accomplish that
    objective:


    ```

    INSERT INTO Clients

    (FirstName, LastName, State)

    SELECT

    Name,

    Name,

    State

    FROM NewClients

    WHERE State = ''RI''

    ```


    After this INSERT, the Clients table contains:


    | ClientID | FirstName | LastName | State |

    |---|---|---|-|

    | 1 | Joyce | Bentley | TN |

    | 2 | Miguel | Ramirez | PA |

    | 3 | Ellen | Baker | OR |

    | 4 | Claudia | Davis | OH |

    | 5 | Ingrid | Krause | CA |

    | 6 | Deepak | Gupta | NULL |

    | 7 | Roberto | Harris | RI |

    | 8 | Galina | Melynk | RI |


    The above INSERT simply substitutes a SELECT statement for the VALUES clause.
    As would be expected, Beata Kowalski didn''t get added to the table because she
    is not in Rhode Island. Also notice that the column names in the Clients and NewClients
    tables are not identical. The column names don''t matter as long as the columns
    are listed in the correct corresponding order.


    # Deleting Data


    Deleting data is quite a bit simpler than adding it. The DELETE statement is used
    to handle deletions. When a DELETE is executed, it removes entire rows, not individual
    columns in a row. The general format is:


    ```

    DELETE

    FROM table

    WHERE condition

    ```


    Here''s a simple example. Let''s say we want to delete rows from the previously
    mentioned Clients table if the customer is in Rhode Island. The statement to accomplish
    this is:


    ```

    DELETE

    FROM Clients

    WHERE State = ''RI''

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'That''s all there is to it. If you wanted to test the results of the previous
    DELETE before executing it, you could simply substitute SELECT for the DELETE,
    as follows:


    ```

    SELECT

    COUNT(*)

    FROM Clients

    WHERE State = ''RI''

    ```


    This would provide a count of the rows about to be deleted, which supplies some
    level of validation for the delete.


    There is one other option for deleting data that is worth mentioning. If you want
    to delete all the data in a single column, you can employ a TRUNCATE TABLE statement
    to delete everything. The advantage of the TRUNCATE TABLE over the DELETE statement
    is that it is much faster. Unlike DELETE, the TRUNCATE TABLE doesn''t log the
    results of the transaction. We haven''t talked about log processes, but this is
    a function that most databases provide to recover databases in the event of system
    crashes and other similar problems.


    If you want to delete all rows in the Clients table, you can use this statement:


    ```

    TRUNCATE TABLE Clients

    ```


    This has the same result as this statement:


    ```

    DELETE

    FROM Clients

    ```


    One slight difference between the DELETE and the TRUNCATE TABLE is that the TRUNCATE
    TABLE resets the values used for auto-increment columns. The DELETE doesn''t affect
    those values.


    # Updating Data


    The procedure for updating data involves specifying which columns are to be updated,
    and as logic for selecting rows. The general format for an UPDATE statement is:


    ```

    UPDATE table

    SET Column1 = Expression1,

    Column2 = Expression2

    [repeat any number of times]

    WHERE condition

    ```


    This statement is similar to the basic SELECT, except the SET keyword is used
    to assign new values for specified columns. The WHERE condition specifies which
    rows are to be updated, but the UPDATE statement can update multiple columns at
    the same time. If more than one column is being updated, the SET keyword is listed
    only once, but a comma must separate all expressions.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Starting with a simple example, let''s say we want to change Joyce Bentley''s
    last name to Barrow, and also change her state from Tennessee (TN) to Wisconsin
    (WI). Her row in the Clients table currently looks like this:


    | ClientID | FirstName | LastName | State |

    | 1 | Joyce | Bentley | TN |


    The UPDATE statement to accomplish the modification is:


    ```

    UPDATE Clients

    SET LastName = ''Barrow'',

    State = ''WI''

    WHERE ClientID = 1

    ```


    After executing this statement, this row in the Clients table has been changed
    to:


    | ClientID | FirstName | LastName | State |

    | 1 | Joyce | Barrow | WI |


    Note that the value of the FirstName column is unchanged because that column wasn''t
    included in the UPDATE statement. Also note that the WHERE clause is essential.
    Without the WHERE, this changed would have applied to every row in the table.


    # Correlated Subquery Updates


    The previous UPDATE example is easy enough but not entirely realistic. A more
