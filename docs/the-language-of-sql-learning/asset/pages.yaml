  md: '# 14


    # Subqueries


    Keywords Introduced

    EXISTS · WITH


    In Chapter 4, we talked about composite functions: functions that contained other
    functions. Similarly, SQL queries can contain other queries. Queries contained
    within other queries are called subqueries.


    The topic of subqueries is somewhat complex, primarily because there are many
    different ways in which they can be used. Subqueries can be found in many parts
    of the SELECT statement, with different nuances and requirements. As a query contained
    within another query, a subquery can be related to and dependent on the main query,
    or it can be completely independent of the main query. Again, this distinction
    results in different requirements for their usage.


    No matter how subqueries are used, they add a great deal of flexibility to the
    ways in which you write SQL queries. Often, subqueries provide functionality that
    could be accomplished by other methods. In instances, personal preference will
    come into play as you decide whether or not to utilize the subquery solution.
    However, as you''ll see, in certain situations subqueries are absolutely essential
    for the task at hand.


    With that, let''s begin our discussion with an outline of the basic types of subqueries.


    # Types of Subqueries


    Subqueries can be used not only with SELECT statements but also with the INSERT,
    UPDATE, and DELETE statements that will be covered in Chapter 17, “Modifying Data.”
    In this chapter, however, we''ll restrict our discussion of subqueries to the
    SELECT statement.'
