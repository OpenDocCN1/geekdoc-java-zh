- pgno: 17
  md: '# # Relational Databases and SQL


    As mentioned in the Introduction, SQL is the most widely used software tool for
    communicating with data residing in relational databases. In this endeavor, SQL
    utilizes elements of both language and logic. As a language, SQL employs a unique
    syntax with many English words, such as WHERE, FROM, HAVING. As an expression
    of logic, it specifies the details of how data in a relational database is to
    be retrieved or updated.


    With this duality in mind, we attempt in this book to emphasize both language
    and logic components as we present the techniques that make up SQL. In all languages,
    whether they be computer or spoken, there are actual words to be learned and remembered.
    As such, we will present the various keywords present in SQL one at a time in
    a logical sequence. As we progress through each chapter, you''ll build on your
    prior vocabulary to learn new keywords and exciting possibilities for interactions
    with a database.


    In addition to the words themselves, there is also logic to be considered. The
    words employed by SQL have a distinct logical meaning and intent. The logic of
    SQL is just as important as the language. In all computer languages, there is
    frequently more than one way to specify any desired objective. The nuances of
    what is possible encompass both the language and logic involved.


    Let''s start with the language. Once you become familiar with the syntax of SQL,
    you might find yourself thinking that SQL commands as analogous to English sentences
    and having a certain expressive meaning.


    For example, compare this sentence:


    > I would like a hamburger and fries

    from your value menu,

    and make it to go.


    with this SQL statement:


    ```

    Select city, state

    from Customers

    order by state

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 1 Relational Databases and SQL


    We''ll get into the details later, but this SQL statement means that we want the
    city and state fields from a named table Customers in a database, and we want
    the results sorted by state.


    In cases, we''re specifying items we want (hamburger/fries or city/state), where
    we want it from (value menu or Customers table), and some extra instructions (it
    to make it go, or sort the results by).


    But before we get started, address one minor point: how to pronounce the word
    SQL. It turns out that there are two choices. One option is to say it as individual
    letters, like "S-Q-L." Another possibility, preferred by the author, is to pronounce
    it as the word "sequel." This is one less liable, and easier to say. However,
    there''s no real agreement on the question. It''s basically a matter of personal
    preference.


    As for the letters S-Q-L, mean that they stand for "Structured Query Language."
    However even here, there is not total agreement. Some would argue that SQL stands
    for nothing has a long history of all, since the language is derived from an language
    from IBM called sequel, which did not, in fact, stand for structured query language.


    # What Is SQL?


    So what is SQL? In a nutshell, SQL is a standard computer language for maintaining
    and utilizing data in relational databases. Put simply, SQL is a language that
    lets users interact with relational databases. It has a long history of development
    by various organizations going back to the 1970s. In 1986, the American National
    Standards Institute (ANSI) published its first set of standards regulating the
    language, and it has gone through several revisions since that time.


    Generally speaking, there are three major components of the SQL language. The
    first is called DML, or Data Manipulation Language. This module allows you to
    retrieve, update, add, or delete data in a database. The second component is called
    DDL, or Data Definition Language. DDL enables you to create and modify the database
    itself. For example, DDL provides ALTER statements to let you modify the design
    of tables in a database. Finally, the third, DCL, or Data Control Language, maintains
    proper security for the database.


    Major vendors, such as Microsoft and Oracle, have adapted the standard for their
    purposes and have added numerous extensions and modifications to the language.
    But each vendor has its own interpretation of SQL, there is still under lying
    base language, which is much the same for all vendors. That base language is what
    we''ll cover in this book.


    As a computer language, SQL is different from other languages you may be familiar
    with, such as Visual Basic or C++. These languages tend to be procedural in nature,
    meaning that they allow you to specify specific procedures to accomplish a desired
    task. SQL is more of a declarative language. In SQL, the desired objective is
    often declared with a single statement. The simpler structure of SQL is possible
    because it is concerned with relational databases rather than the entirety of
    computer systems.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Microsoft SQL Server, MySQL, and Oracle


    One additional point of clarification about the SQL language is that it is sometimes
    confused with specific SQL databases. Many software companies sell database management
    systems (DBMS) software. In common usage, the databases in these types of software
    packages are often referred to as SQL databases, because the SQL language is the
    primary means of managing and accessing data in these databases. Some vendors
    use the word SQL as part of the database name. For example, Microsoft calls its
    latest database SQL Server 2016. But in fact, SQL is more properly a language
    than a database. Our focus in this book is on the language of SQL rather than
    on any particular database.


    # Microsoft SQL Server, MySQL, and Oracle


    Our aim is to cover the core language of SQL as it applies to all implementations,
    we must ultimately provide specific examples of SQL syntax. And because syntax
    does vary somewhat among vendors, we''ve decided to focus on the SQL syntax utilized
    by these three databases:


    +   * Microsoft SQL Server

    * MySQL

    * Oracle


    In most cases, these databases have the same syntax. However, there are occasional
    differences. If there is any variance between these databases, the syntax for
    MySQL SQL Server will be presented in the main text of this book. Any for MySQL
    or Oracle will be indicated in a sidebar titled “Database Differences,” as shown
    here:


    # Database Differences


    A sidebar as this will appear whenever there are syntax differences for MySQL
    or Oracle. The syntax for Microsoft SQL Server will appear in the main text.


    Microsoft SQL Server is available in several versions and editions. The most recent
    version is called SQL Server 2016. Available editions run from a basic Express
    edition to a fully featured Enterprise. The Edition is free but still has an abundance
    of features that allows users to get started with full-fledged database development.
    The Enterprise edition includes many sophisticated database management features,
    powerful business intelligence components.


    Although owned by Oracle, MySQL is an open-source database, which means that no
    single organization controls its development. MySQL is available on numerous platforms
    other than Windows, such as Mac OS X and Linux. MySQL offers its Community Edition
    as a free download. The most recent version is MySQL 5.7.


    The Oracle database is available in several editions. The most recent version
    is called Oracle Database 12c. The free version of the database is called the
    Express edition.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'When starting out, it is sometimes useful to download the database of your
    choice, so you have something to experiment with it. However, this book does not
    require you to do that. The material in this book has been written in such a way
    as allow you to learn SQL simply by reading through the text. We''ll provide enough
    data in the text so that you can understand the results of various SQL statements
    without having to download software and type in statements.


    Nevertheless, if you would like to download the free versions of any of these
    databases, we include three appendices with useful instructions and tips on how
    to do that. Appendix A has complete information on how to get started with Microsoft
    Server. The instructions include details on how to install the software and execute
    SQL commands. Similarly, Appendix B and C cover MySQL and Oracle.


    As mentioned in our Introduction, our companion website provides supplemental
    material that lists all the SQL statements shown in this book in all databases.
    However, it''s likely that you''ll find it unnecessary to download or view the
    additional material on the companion website. The examples shown throughout this
    book are self-explanatory and don''t require you to do anything else in order
    to understand the material. However, if you are inclined, feel free to take advantage
    of these features.


    It should also be mentioned that, in addition to SQL Server, MySQL, and Oracle,
    popular relational databases are worthy of consideration. For example:


    +   - DB2, from IBM

    - Informix, from IBM

    - SQL Anywhere, from Sybase

    - PostgreSQL, an open-source database

    - Microsoft Access, from Microsoft


    Of these databases, Microsoft Access is somewhat unique in that it has a graphical
    element. In essence, Access is a graphical interface for relational databases.
    In other words, Access allows you to create a query against a relational database
    through graphical methods. A useful aspect of Access is for beginners that you
    can easily create a query in a visual way and then switch to a SQL view to see
    the statement you just created. Another distinction of Access is that it is primarily
    a desktop database. As such, you can use it to create a database that resides
    entirely in a single file on your PC, but it also allows you to connect to databases
    created with other tools, such as Microsoft SQL Server.


    # Relational Databases


    With these preliminaries out of the way, let''s look at the basics of relational
    databases to see how they work. A relational database is a collection of data,
    stored in any number of tables. In common usage, the term relational can be taken
    to indicate that the tables are usually related to each other in some other manner.
    However, in more precise terms, relational refers to'
