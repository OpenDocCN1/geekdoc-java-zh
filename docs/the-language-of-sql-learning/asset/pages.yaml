    # Looking Ahead


    This chapter covered the important topic of how to create complex expressions
    of selection logic. The basic Boolean operators used in this endeavor are AND,
    OR, and NOT. We discussed the BETWEEN and IN operators, which allow for a more
    concise statement of the AND and OR operators in certain situations. Parentheses
    are another essential tool in the formulation of complex expressions. By using
    parentheses, you can create almost every imaginable logical condition. Finally,
