  md: '# 16

    Stored Procedures

    and Parameters


    Keywords Introduced

    CREATE PROCEDURE · BEGIN · EXEC/CALL · ALTER PROCEDURE · DROP PROCEDURE


    Up until this point, all of our data retrieval has been accomplished with a single
    SQL statement.

    Even the logic seen in the previous chapter involved combining SELECTs into a
    single statement. Now we''ll discuss a new scenario, in which multiple statements
    can be saved into a single object known as a *stored procedure*.


    In broad terms, there are two general reasons for using stored procedures:


    +   * To save multiple SQL statements in a single procedure

    * To use parameters in conjunction with SQL statements


    Stored procedures can, in fact, consist of a single SQL statement and contain
    no parameters.

    But the real value of stored procedures becomes evident when they contain multiple
    statements or parameters.


    The subject of stored procedures is complex. In this brief review of the topic,
    we will focus on an overview of the second reason, that of using parameters. This
    relates directly to the issue of how to retrieve data from a database. We''ll
    see, the ability to add parameters to a SELECT statement turns out to be a very
    useful feature in everyday usage.


    The use of stored procedures to contain multiple statements is beyond the scope
    of this book. Basically, the ability to store multiple statements in a procedure
    means that you can create complex logic and execute it at once in a single transaction.
    For example, you might have a business requirement to take an incoming order from
    a customer and quickly evaluate it before allowing it to enter the system. This
    procedure might involve checking to make sure that the items are in stock, verifying
    that the customer has a good credit rating, and getting an initial estimate as
    to when the items can be shipped. This situation would require multiple SQL statements
    with some added logic to determine what kind of message to return if all is not
    well'
  merge: -1
  img_proc: true
