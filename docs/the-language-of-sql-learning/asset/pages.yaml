- pgno: 155
  md: '# Referencing Views


    To set up this SELECT statement as a view, we simply place the entire SELECT in
    a CREATE VIEW statement, as follows:

    CREATE VIEW CustomersOrdersRefunds AS Customers.FirstName AS ''First Name'', Customers.LastName
    AS ''Last Name'', Orders.Date AS ''Order Date'', Orders.Amount AS ''Order Amt'',
    Refunds.RefundDate AS ''Refund Date'', Refunds.Amount AS ''Refund Amt''

    The only item missing in the above CREATE VIEW is the ORDER BY clause of the original
    SELECT statement. Because views aren''t stored as physical data, there is never
    a reason to include an ORDER BY clause for a view.


    # Referencing Views


    When we execute the CREATE VIEW statement, it creates a view called CustomersOrdersRefunds.
    Creating the view does not return any data. It merely defines the view for later
    use. To use the view to bring back data as before, before you execute this SELECT
    statement:


    ```

    SELECT *

    FROM CustomersOrdersRefunds

    ```


    This retrieves:


    | First Name | Last Name | Order Date | Order Amt | Refund Date | Refund Amt |

    |---|---|---|---|---|-|

    | Sara | Davis | 2016-09-01 | 10.00 | 2016-09-02 | 5.00 |

    | Rumi | Shah | 2016-09-02 | 12.50 | NULL | NULL |

    | Rumi | Shah | 2016-09-03 | 18.00 | 2015-09-18 | 18.00 |

    | Paul | Johnson | 2016-09-15 | 20.00 | NULL | NULL |

    | Samuel | Martinez | NULL | NULL | NULL | NULL |


    Notice that this data is displayed in a different row order than what was originally
    retrieved. This is because the view does not contain an ORDER BY clause. As a
    result, the data is returned in the order in which it is physically stored in
    the database. This is easily corrected by adding an ORDER BY clause to the SELECT,
    as follows:


    ```

    SELECT *

    FROM CustomersOrdersRefunds

    ORDER BY [Last Name], [First Name], [Order Date]

    ```'
