- pgno: 181
  md: '# Parameters in Stored Procedures


    Here''s an example of how to create a stored procedure that can be used to execute
    this single

    SELECT statement:


    ```

    SELECT *

    FROM Customers

    ```


    The procedure will be named ProcedureOne. In Microsoft SQL Server, the statement
    to create

    the procedure is:


    ```

    CREATE PROCEDURE ProcedureOne

    AS

    BEGIN

    SELECT *

    FROM Customers

    END

    ```


    # Database Differences: MySQL


    In MySQL, the previous example would look like:


    ```

    DELIMITER $$\nCREATE PROCEDURE ProcedureName ()

    BEGIN

    SELECT *

    FROM Customers

    END$$\$

    DELIMITER ;

    ```


    Remember that creating a stored procedure does not execute anything. It simply
    creates the

    procedure so it can be executed later. Along with tables and views, the procedure
    will be

    in your database management tool, allowing you to view its contents.


    # Parameters in Stored Procedures


    All of the SELECT statements we have seen up until now have had a certain static
    quality

    due to the fact that they were written to retrieve data in one specific way. The
    ability to add

    parameters to SELECT statements provides the possibility of much greater flexibility.


    The term parameter in SQL statements is similar to the term variable as it is
    used in other

    computer languages. A parameter is basically a value passed to a SQL statement
    by calling the

    program. It can have whatever value the user specifies at the time it is called.


    Starting with a simple example, let''s say we have a SELECT statement that retrieves
    data from

    a Customers table. Rather than selecting all customers, we would like the SELECT
    to retrieve

    data for only specific CustomerID. However, we don''t want to code the number

    directly in the SELECT statement. We want the SELECT to be general enough that
    it can accept

    without any parameters and then execute with that value. The SELECT statement

    isimply:


    ```

    SELECT *

    FROM Customers

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Our goal is to add a WHERE clause that allows us to select data for a particular
    customer. In a general form, we''d like the SELECT statement to:


    ```

    SELECT *

    FROM Customers

    WHERE CustomerID = ParameterValue

    ```


    In Microsoft SQL Server, the creation of such a stored procedure can be accomplished
    with this:


    ```

    CREATE PROCEDURE CustomerProcedure

    (@CustID INT)

    AS

    BEGIN

    SELECT *

    FROM Customers

    WHERE CustomerID = @CustID

    END

    ```


    Notice the addition of the second line, which specifies the CustID parameter in
    the procedure. In Microsoft SQL Server, the @ is used to denote a parameter. The
    INT keyword is placed after the parameter to indicate that this parameter will
    have an integer value. The same parameter name is used in the WHERE clause.


    # Database Differences: MySQL


    In MySQL, the command to create an equivalent stored procedure is:


    ```

    DELIMITER $$

    CREATE PROCEDURE CustomerProcedure

    (CustID INT)

    BEGIN

    SELECT *

    FROM Customers

    WHERE CustomerID = CustID;

    END$$

    DELIMITER;

    ```


    Notice that MySQL doesn''t require the @ to denote a parameter.


    When a stored procedure is executed, the calling program passes a value for the
    parameter, and the SQL statement is executed as if that value were part of the
    statement.


    Also note that the parameters discussed are input parameters. As such, they contain
    values that are passed into the stored procedure. Stored procedures can also include
    output parameters, which can contain values passed back to the calling program.
    It''s beyond the scope of this book to discuss the various nuances of how to specify
    both input and output parameters in stored procedures.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'Modifying and Deleting Stored Procedures 167


    # Executing Stored Procedures


    After stored procedures are created, how are they executed? The syntax varies
    between databases. Microsoft SQL Server provides the EXEC keyword to run stored
    procedures.


    In Microsoft SQL Server, the following statement will execute the ProcedureOne:


    ```

    EXEC ProcedureOne

    ```


    When this statement is executed, it returns the results of the SELECT statement
    contained in the stored procedure.


    The ProcedureOne parameter doesn''t have any parameters, the syntax is simple.
    To illustrate running procedures with input parameters, the following executes
    the CustomerProcedure for a CustID value of 2:


    ```

    EXEC CustomerProcedure

    @CustID = 2

    ```


    +   Database Differences: MySQL


    Rather using EXEC, MySQL uses a CALL keyword to execute stored procedures, and
    the syntax for stored procedures is slightly different. The equivalent of the
    previous two EXEC statements in MySQL is:


    ```

    CALL ProcedureOne:

    CALL CustomerProcedure (2);

    ```


    # Modifying and Deleting Stored Procedures


    Once a stored procedure has been created, it can be modified. Just as the ALTER
    PROCEDURE keyword was used to modify stored procedures. The syntax is identical
    to the CREATE PROCEDURE command, except that ALTER is used in place of CREATE.
    Just as the CREATE PROCEDURE has a slightly different syntax for each database,
    so does the ALTER PROCEDURE.


    We''ve already seen this example of creating a stored procedure with Microsoft
    SQL Server:


    ```

    CREATE PROCEDURE CustomerProcedure

    @CustID INT

    AS

    BEGIN

    SELECT *

    FROM Customers

    WHERE CustomerID = @CustID

    END

    ```'
