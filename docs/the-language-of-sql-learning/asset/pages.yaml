- pgno: 153
  md: '# Creating Views


    The trickiest part of SELECT is the ON clause in the join. To get the self join
    to work correctly, we must use the ON to establish a relationship between the
    ManagerID column of the Employees view of the Personnel table, and the EmployeeID
    column of the Managers view of the table. In other words, the indicated manager
    is also an employee.


    Notice that Susan Carter isn''t in the previous data as an employee. This is because
    we used an inner join in the statement. Because Susan Carter has no manager, there
    is no match to the Managers view of the table. If we want Susan Carter to be included,
    we merely need to change the inner join to an outer join. The new statement is:


    ```

    SELECT

    Employees.EmployeeName AS ''Employee Name'',

    Managers.EmployeeName AS ''Manager Name''

    FROM Personnel AS Employees

    LEFT JOIN Personnel AS Managers

    ON Employees.ManagerID = Managers.EmployeeID

    ORDER BY Employees.EmployeeName

    ```


    The data retrieved is:


    | Employee Name | Manager Name |

    | --- | --- |

    | Amelia Williams | Carter Bender |

    | Amy Adams | Scott Fielding |

    | Carla Bender | Li Wang |

    | Jaideep Singh | Scott Fielding |

    | Janet Brown | Li Wang |

    | Jules Moreau | Robert Baker |

    | Li Wang | Susan Carter |

    | Robert Baker | Susan Carter |

    | Scott Fielding | Susan Carter |

    | Susan Carter | NULL |


    # Creating Views


    The self join allows you to create multiple views of the same table. We''ll now
    extend this concept, allowing us to create new views of any type or combination.


    Views are merely SELECT statements that have been saved in a database. Once saved,
    the view can be referred to as if it were a table in the database. Database tables
    contain physical data; views do not contain data but allow you to proceed as if
    it were a real table with data. Views can therefore be thought of as virtual tables.
    Additionally, views are permanent, not temporary. Once created, a view continues
    to be refreshed until it is deleted.


    You might ask why views are necessary. We''ll get into the benefits of views later
    in the chapter, but in short, views provide flexibility as how data can be accessed.
    Whether a database has been for a few days or years, the data in that database
    is stored in tables in a very specific manner. As time progresses, requirements
    for accessing that data change, but it'
