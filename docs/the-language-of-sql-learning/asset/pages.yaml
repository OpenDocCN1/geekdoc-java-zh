    | 4/2/2017 | 145 | VT | Retail | 90 |

    | 4/2/2017 | 180 | NY | Retail | 300 |

    | 4/2/2017 | 181 | VT | Internet | 130 |

    | 4/2/2017 | 182 | NY | Internet | 520 |

    | 4/2/2017 | 184 | NY | Retail | 80 |


    Back in Chapter 10, we used the PIVOT operator to create output in a crosstab
    format. In that chapter, we began with the data in this SalesSummary table:'
