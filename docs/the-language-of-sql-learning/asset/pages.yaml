    The FULL JOIN is seldom used in practice for the simple reason that this type
    of relationship between tables is relatively uncommon. In essence, the full join
    shows data where there are nonmatches in both directions between two tables. We
    are normally interested in data where there is a complete match between two tables
    (the inner join) or perhaps a one-sided match (the left or right join).


    # Cross Joins


    The final type to be discussed in this chapter, the cross join, is neither an
    inner join nor an outer join. In essence, the cross join is a joining of two tables
    without indicating any relationship between the tables. Because no relationship
    is stated, the join produces every combination of rows between the tables. *Cartesian
    product*. If one table has three rows and a second table has four rows, and those
    tables are cross joined, the result will have 12 rows. Because of the esoteric
    nature of this join, it is seldom used in practice.'
