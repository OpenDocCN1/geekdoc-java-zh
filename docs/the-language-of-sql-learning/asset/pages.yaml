- pgno: 40
  md: '# Chapter 3 Calculated Fields and Aliases


    The fourth column now has a header. In this example, we placed the column alias
    within single quotes. These quotes are not strictly necessary, unless the column
    aliases contain embedded spaces. Additionally, the keyword AS is not necessary.
    However, we will persist using the AS keyword in this book to make clear that
    this is a column alias. Without the single quotes or AS keyword, the previous
    SELECT statement would be written as follows:


    ```

    SELECT

    SalesID,

    FirstName,

    LastName,

    FirstName + '' '' + LastName Name

    FROM Sales

    ```


    In addition to provide a header for a calculated field, column aliases are often
    useful when a column in a table has a cryptic name that you''d like to change.
    For example, if a table has a column with the name "Qty", you could issue this
    statement to display the column as "Quantity Purchased":


    ```

    SELECT

    Qty AS ''Quantity Purchased''

    FROM table

    ```


    # Database Differences: Oracle


    Oracle uses double quotes to delineate column aliases. The previous statement
    would be written as follows in Oracle:


    ```

    SELECT

    SalesID,

    FirstName,

    LastName,

    FirstName || '' '' || LastName AS "Name"

    FROM Sales;

    ```


    # Table Aliases


    In addition to providing alternate names for columns, aliases can also be specified
    for tables, using the same AS keyword. There are three general reasons for using
    table aliases. The first reason relates to tables with obscure or complex names.
    For example, if a table is named Sales123, you can use the following SELECT to
    give the table an alias of Sales.


    ```

    SELECT,

    LastName

    FROM Sales123 AS Sales

    ```'
