- pgno: 35
  md: '# 3 Calculated Fields and Aliases


    Keywords Introduced


    AS


    In the previous chapter, we talked about how to choose individual columns for
    inclusion in a SELECT statement. We now want to introduce a way to perform calculations
    on the individual data items retrieved from a database. This technique is referred
    to as calculated fields. Using this approach, customer names can be formatted
    exactly as desired. Numeric specific to a business or organization can be formulated
    and presented. In SQL, developers are often required to customize the content
    of individual columns in order to successfully turn data into more intelligent
    information. The inclusion of calculated fields is a useful device that helps
    to accomplish that goal.


    When selecting data from a table, you are not restricted to the columns that happen
    to be in the table. The concept of calculated fields allows for a number of other
    possibilities. With calculated fields, you can do the following:


    +   * Display specific words or values

    * Perform calculations on single or multiple columns

    * Combine columns and specific words or values together


    Let''s look at a few examples, all coming from this Sales table:


    | SalesID | FirstName | LastName | QuantityPurchased | PricePerItem |

    |---|---|---|---|--|

    | 1 | Andrew | Li | 4 | 2.50 |

    | 2 | Carol | White | 10 | 1.25 |

    | 3 | James | Carpenter | 5 | 4.00 |'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Literal Values


    Our first example of a calculated field isn''t a calculation at all. We''re going
    to select a specific value, even though the value has nothing to do with the data
    in the table. This type of expression is called a literal value. Here''s an example:


    ```

    SELECT

    ''First Name'':

    FirstName

    FROM Sales

    ```


    This statement will return this data:


    | (no column name) | FirstName |

    | First Name: | Andrew |

    | First Name: | Carol |

    | First Name: | James |


    In this statement, we are selecting two data items. The first is the literal value
    ''First Name:''. Note that single quote marks are used to indicate that this is
    a literal with character data. The second data item is the FirstName column.


    Notice, first that the literal value ''First Name:'' is repeated over every row.
    Second, there is no header information for the first column. When run in SQL Server,
    the column header displays "no column name". The reason why there is no header
    is simply because this is a calculated field. There is no column name that can
    be associated with this information.


    # Database Differences: MySQL and Oracle


    Both MySQL and Oracle return a value in the header for literal values. In MySQL,
    the header for the first column in the previous example will appear as:


    ```

    First Name:

    FIRSTNAME: ''

    ```


    In Oracle, the header for the first column will appear as:


    One question might well be asked is why the header is important at all. If we''re
    using the SELECT statement only to retrieve data, the header wouldn''t seem to
    be significant. If the data itself matters. However, if we''re using the SELECT
    statement to obtain data for a report displayed to a user, either on paper or
    on a computer screen, the header might be relevant. Column headers are normally
    displayed in a reporting environment. When users look at data in a report, they
    generally want to know the meaning of the column, and look to the column header
    for information. In the case of a literal value, there is really no meaning to
    the column, so a header isn''t truly necessary. But in other types of calculated
    fields, there might be a meaningful label that could be applied to the column.
    In this chapter, we''ll discuss the concept of column aliases, which represent
    a way of providing a header in this type of situation.'
