  md: '+   Views can increase reusability. In a situation where three tables are always
    joined together, you can create a view with those three tables. Instead, of always
    having to join three tables every time you query data, you can simply reference
    a predefined view.


    +   Views can properly format data. If columns are incorrectly formatted in the
    database, you can use the CAST or other functions to format that column as desired.
    For example, you may have a date column as an integer datatype in the database,
    with a YYYYMMDD format. It is advantageous to view this data as a date/time column
    so it can be presented and manipulated as a true date. To accomplish this, you
    can create a view on the table that transforms the column to the proper format.
    All subsequent references to that table can then reference the new view rather
    than the table.


    +   Views can create calculated columns. Suppose two columns in a table include
    Quantity and PriceItem. End users are usually interested in the total price, which
    is calculated by multiplying the two columns together. You can create a view of
    the original table with a new calculated column by this calculation. Users can
    then reference the view and always have the calculation available.


    +   Views can be used to rename columns. If a database contains cryptic column
    names, you can create views with aliases to translate those names into something
    meaningful.


    +   Views can create a subset of data. Let''s say a database contains a table
    with all of your customers. Most of your users need to see customers who have
    placed an order during the prior year. You can easily create a view of this table
    that includes this useful subset of data.


    +   Views can be used to enforce security restrictions. If you want certain users
    to be able to access only columns in a table. To accomplish this, you can create
    a view of the table for those users. The security features of the database can
    be used to grant access to the new view for those users, restricting them from
    accessing the underlying table.


    # Modifying and Deleting Views


