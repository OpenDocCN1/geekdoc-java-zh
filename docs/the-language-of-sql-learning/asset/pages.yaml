- pgno: 52
  md: 'Let’s start with an example that illustrates how to display the number 5 raised
    to the second power. This is commonly referred to as “5 squared”. The SELECT statement:


    ```

    SELECT POWER(5,2) AS ''5 Squared''

    ```


    returns this data:


    5 Squared

    25


    In this example, 5 is the numeric value to be evaluated, and 2 is the value of
    the exponent. Remembering that the square root of a number can be expressed as
    an exponent with a decimal value less than 1, we can calculate the square root
    of 25 as follows. The statement:


    ```

    SELECT POWER(25,.5) AS ''Square Root of 25''

    ```


    returns this data:


    Square Root of 25

    5


    In algebraic terms, the calculation takes 25 to the 1/2 (or .5) power. This is
    the same as taking the square root of 25.


    # Conversion Functions


    All of the aforementioned functions pertain to specific ways to manipulate character,
    date/time, or numeric datatypes. We now want to address the need to convert data
    from one datatype to another, or to convert NULL values to something meaningful.
    The remainder of this chapter will cover two special functions that can be used
    in these situations.


    The CAST function converts data from one datatype to another. The general format
    of the function is:


    ```

    CAST(Expression AS DataType)

    ```


    The format of this function is slightly different from other functions previously
    seen, as it uses the word AS to separate the two arguments, rather than a comma.
    Looking at the usage of the function, it turns out that the CAST function is unnecessary
    in most situations. Let''s take the situation where we want to execute this statement,
    where the Quantity column is defined as a character datatype:


    ```

    SELECT

    2 * Quantity

    FROM table

    ```'
