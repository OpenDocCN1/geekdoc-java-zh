- pgno: 116
  md: '# Looking Ahead


    In this chapter, we covered several forms of aggregation, beginning with the simplest—that
    of eliminating duplicates. We then introduced a number of aggregate functions,
    which are a different class of the scalar functions seen in Chapter 4. The real
    power of aggregate functions become apparent when they are used in conjunction
    with the GROUP BY keyword, which allows for the separation of data into groups.
    We also looked at the use of the HAVING clause, which allows you to apply group-level
    selection criteria to values in aggregate functions.


    We closed this chapter with two additional topics related to summation. The use
    of CASE expressions in the GROUP BY and HAVING clauses allows you to apply conditional
    logic grouping and group selection criteria. Finally, we covered ranking functions
    and partitioning, which are useful ways of organizing detailed data. Through the
    use of the PARTITION BY keyword, data can be separated into groups in conjunction
    with the ranking functions.


    Our next chapter, on subtotals and crosstabs, offers additional formatting options
    for aggregated values. Subtotals allow you to add summarized information to a
    presentation of detailed data. Crosstabs offer a new method of laying out data
    in a format that is more conducive to a clear display of aggregated data.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 10


    # # Subtotals and Crosstabs


    **Keywords Introduced**

    ROLLUP · GROUPING · CUBE · PIVOT · FOR


    The previous chapter provided numerous ways to add aggregation to a query. We
    now want to extend that discussion to cover the additional option of providing
    subtotals. When we aggregate data, we''re also removing the detailed data that
    lies below the summarized totals. The whole point of aggregation is to replace
    detailed data with a summarization. However, users sometimes want to see the detailed
    data, along with an occasional summary. This is where subtotals come in. Subtotals
    are typically provided via extra rows added in the detailed data that summarize
    key columns.


    A second topic we''ll cover in this chapter is how to do with summarized data
    is displayed to the user. In the previous chapter, data was grouped together and
    then displayed to the user. Each row of data indicates the values being grouped,
    along with the summarized values. This is usually an adequate way of displaying
    data. But sometimes users prefer data in a crosstab format. The crosstab format
    is one in which groups are broken out into multiple columns. This has the effect
    of reducing the number of rows a user needs to look through. Crosstab layouts
    are typically employed by many reporting tools. A prime example of a crosstab
    layout is the Excel pivot table, which allows you to lay out data in both rows
    and columns. In this chapter, we''ll show how to create this effect with a SQL
    command.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Adding Subtotals with ROLLUP


    In the previous chapter, we showed how to use the GROUP BY clause to group data
    together. When data is grouped together, some columns might be aggregated to provide
    a sum of values in that column. To revisit this scenario, let''s begin with the
    following data that shows the current inventory of a few products.


    | InventoryID | Category | Subcategory | Product | Quantity |

    |---|---|---|---|-|

    | 1 | Furniture | Chair | Red Armchair | 3 |

    | 2 | Furniture | Chair | Green Armchair | 2 |

    | 3 | Furniture | Desk | Blue Computer Desk | 4 |

    | 4 | Paper | Copy | White Copy Paper | 5 |

    | 5 | Paper | Copy | Pink Copy Paper | 2 |

    | 6 | Paper | Notebook | White Notebook Paper | 4 |


    In this example, each product is broken down by category and subcategory. For
    example, the Furniture category includes Chair and Desk subcategories. The following
    SELECT statement groups this data by Category and Subcategory, and sums the quantity
    for each group.


    ```

    SELECT

    Category,

    Subcategory,

    SUM(Quantity) AS ''Quantity''

    FROM Inventory

    GROUP BY Category, Subcategory

    ```


