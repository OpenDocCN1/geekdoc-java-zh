  img_proc: true
- pgno: 184
  md: 'After this procedure is created, if you wanted to alter the procedure to select
    only the CustomerID and LastName columns from the Customers table, the command
    to accomplish that would be:


    ```

    ALTER PROCEDURE CustomerProcedure

    (@CustomerID INT)

    AS

    BEGIN

    SELECT

    CustomerID,

    LastName

    FROM Customers

    WHERE CustomerID = @CustomerID

    END

    ```


    # Database Differences: MySQL


    MySQL provides an ALTER PROCEDURE command, but it has limited functionality. To
    alter the content of a stored procedure in MySQL, you need to issue a DROP PROCEDURE
    and then a CREATE PROCEDURE with the new content.


    Deleting a stored procedure is even simpler. Just as DROP VIEW deletes a view,
    the DROP PROCEDURE statement deletes a procedure.


    Here''s how the stored procedure named CustomerProcedure can be deleted:


    ```

    DROP PROCEDURE CustomerProcedure

    ```


    # Functions Revisited


    In Chapter 4, we talked about the built-in scalar functions available in SQL.
    For example, we used character functions as LEFT and mathematical functions like
    ROUND. In Chapter 9, we discussed aggregate functions such as MAX.


    In addition to the built-in functions in SQL, developers can create their own
    functions and save them in a database. The procedure for creating functions is
    very similar to the procedure for creating stored procedures. SQL provides the
    keywords CREATE FUNCTION, ALTER FUNCTION, and DROP FUNCTION, which work much like
    CREATE PROCEDURE, ALTER PROCEDURE, and DROP PROCEDURE.


    Due to the advanced nature of this topic, we won''t provide specific examples
    of this functionality. However, we will spend a few moments explaining the differences
    between using stored procedures and functions.


    Both stored procedures and functions can be saved in a database. These entities
    are separate objects in a database, like tables or views. The procedures for saving
    and modifying stored procedures and functions are very similar. The same CREATE,
    ALTER, and DROP commands for stored procedures can be used for functions.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Looking Ahead 169


    The difference between the two lies in how they are used and in their capabilities.
    There are two main distinctions between stored procedures and functions:


    +   - **Stored procedures can have any number of output parameters.** They can
    even have zero output parameters. In contrast, a function must always contain
    exactly one parameter. In other words, when you call a function, you always get
    back a single value.

    - **Stored procedures are executed by a calling program.** The stored procedure
    cannot be directly referenced in a SELECT statement. In contrast, functions can
    be referenced within statements, as seen in Chapters 4 and 9. After a function
    is defined, that function is referenced by the name specified when it was created.


    # Looking Ahead


    In this chapter, we''ve seen that the use of parameters can add a great deal of
    flexibility to the process of retrieving data. For example, parameters allow us
    to generalize SQL statements so that values for selection criteria can be specified
    at the time the statement is executed. We also learned the basics of how to create
    and modify stored procedures. Finally, we explained some of the differences between
    stored procedures and user-defined functions.


    Although the examples in this chapter focused on data retrieval, stored procedures
    and functions are also quite useful for updating data. Our next chapter, “Modifying
    Data,” will take us completely out of the realm of data retrieval and move squarely
    into issues surrounding the need to update data. The business of maintaining data
    does not present the same analytic possibilities as data retrieval, but it is
    a necessary task for any enterprise. Fortunately, most of the techniques we''ve
    learned with the SELECT statement apply equally to the modification process discussed
    in the next chapter.'
