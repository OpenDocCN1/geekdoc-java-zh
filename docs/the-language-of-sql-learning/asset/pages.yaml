- pgno: 25
  md: '# Looking Ahead


    The main problem with data storage prior to relational databases was not how the
    data was stored, but how it was accessed. The real breakthrough with relational
    databases came when the language of SQL was developed, because it allowed for
    an entirely new method of accessing data.


    Unlike earlier data methods, SQL permitted the user to access a large set of data
    at once. With a single statement, a SQL command could retrieve or update thousands
    of records from multiple tables. This eliminated a great deal of complexity. Computer
    programs no longer needed to read one record at a time in a special sequence,
    while deciding what to do with each record. What used to require hundreds of lines
    of programming code could now be accomplished with just a few lines of logic.


    # Looking Ahead


    This first chapter provided some background information about relational databases,
    allowing us to move on to the main topic of retrieving data from databases. We
    discussed a number of important characteristics of relational databases, such
    as primary keys, foreign keys, and datatypes. We also talked about the possible
    existence of NULL values in data. We''ll add to our discussion of NULL values
    in Chapter 7,"Boolean Logic," and return to the general topics of database maintenance
    in Chapter 18, "Maintaining Tables," and database design in Chapter 19, "Principles
    of Database Design."


    Why is the important topic of database design postponed until much later in this
    book? In short, this approach is taken so you can plug into using SQL without
    having to worry about the details of design at the beginning. In truth, database
    design is as much an art as it is a science. The principles of database design
    will hopefully be more meaningful after you become more aware of the details and
    nuances of retrieving some data via SQL. Therefore, we''ll temporarily ignore
    the question of how to design a database and commence with data retrieval in our
    next chapter.'
  merge: -1
  img_proc: true
