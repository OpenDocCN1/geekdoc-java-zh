- pgno: 149
  md: '# Cross Joins 133


    As you can see, the cross join produces every combination of rows from both tables.
    Notice that there is no ON keyword in a cross join. This is because no relationship
    between the tables is specified. The tables don''t have a column in common. The
    data in both tables is independent of each other.


    Interestingly, the cross join can also be specified in the "alternate" format
    discussed in the previous chapter. That is, the join can be indicated by merely
    listing both tables in the FROM clause, without the use of the CROSS JOIN keyword.
    The following SELECT statement is the equivalent of the previous CROSS JOIN statement
    and produces the output:


    ```

    SELECT

    Size,

    Color

    FROM SpecialInventory, ColorInventory

    ```


    The preceding cross join example represents a situation that''s not very realistic.
    However, this second example indicates a somewhat common use of the cross join.
    For this example, we''ll imagine we have a special table with only one row of
    data that contains key pieces of information. Because that table has only one
    row of data, we can do a cross join to it without increasing the number of rows
    in the final result. To illustrate, we will use this SpecialDates table that contains
    a number of dates relevant to the organization:


    | LastProcessDate | CurrentFiscalYear | CurrentFiscalQuarter |

    | 2016-09-15 | 2016 | Q3 |


    In this scenario, we want to select data from our tables. However, we only want
    to see data for the LastProcessDate in the SpecialDates table. The LastProcessDate
    is a frequently changing date that gives the date of the last group of data processed
    in the system. The assumption is that there may be some sort of lag, so this might
    not be the current date. Our statement, utilizing a cross join, accomplishes that
    objective.


    ```

    SELECT

    OrderID AS ''Order ID'',

    OrderDate AS ''Date'',

    OrderAmount AS ''Amount''

    FROM Orders

    CROSS JOIN SpecialDates

    WHERE OrderDate = LastProcessDate

    ```


    The resulting output is:


    | Order ID | Date | Amount |

    | 4 | 2016-09-15 | 20.00 |


    Only one row of data from the Orders table is shown. This is because we''ve used
    the LastProcessDate of the SpecialDates table as the part of the selection logic.
    Note that the SpecialDates table has only one row, there is no harm in doing a
    cross join to it. It doesn''t affect the number of rows displayed.'
