    ```


    Additionally, unlike Microsoft SQL Server and MySQL, column names in Oracle surrounded
    by double quotes are case sensitive. This means that the previous statement is
    not equivalent to:


    ```

    SELECT

    "LAST NAME"

    FROM Customers;

    ```


    # Preview of the Full SELECT


    The bulk of this book is to have the SELECT statement introduced in this chapter.
    Chapters 3 through 15, we will expand on this statement, introducing new features
    until the full potential and capabilities of the SELECT are realized and understood.
    At this point, we have only introduced this portion of the SELECT statement:


    ```

    SELECT columnlist

    FROM table

    ```


    In interest of removing any remaining suspense, let''s look at a preview of the
    full SELECT statement and briefly comment on its components. The full SELECT statement,
    with all its clauses is:


    ```

    SELECT columnlist

    FROM tablelist

    WHERE condition

    GROUP BY columnlist

    HAVING condition

    ORDER BY columnlist

    ```


    We''ve been introduced to the SELECT and FROM clauses. Let''s expand a bit on
    those clauses and talk about the others. The SELECT clause introduces the list
    and lists columns that will be displayed. As we will see in later chapters, the
    columnlist can include not actual columns from the specified tables, but also
    calculated columns, usually derived from one or more columns in the tables. The
    columns in the columnlist can also include functions, which represent a special
    way of adding commonly used methods for transforming data.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'The FROM clause specifies the data sources from which data will be drawn. In
    most cases, data sources will be tables. In later chapters, we''ll learn that
    these data sources can also be SELECT statements, which represent a type of virtual
    view of data. In this chapter, the table list is a single table. One of the key
    features of SQL to be discussed in later chapters is the ability to combine multiple
    tables in a single SELECT statement from something called the JOIN. Thus, we''ll
    see many examples where the table in the FROM clause is composed of multiple lines,
    indicating tables joined together.


    The WHERE clause is used to indicate selection logic. This is where you can specify
    exactly which rows of data are to be retrieved. The WHERE clause can utilize arithmetic
    operators such as equals (=) and greater than (>), with Boolean operators such
    as OR and AND.


    The GROUP BY clause plays a key role in summarizing data. By organizing data into
    groups, the analyst has the ability to not only group data, but to summarize the
    data in each group through various statistics, such as a count or sum of data.


    When data has been grouped, selection criteria become somewhat complex. One has
    to ask whether the selection criteria apply to individual rows or to the entire
    group. For example, when grouping customers by state, one may want to see rows
    of individual customers whose aggregate purchases of all customers in the state
    exceed a certain amount. This is where the HAVING clause comes in. The HAVING
    clause is used to specify selection logic for an entire group of data.


    Finally, the ORDER clause is used to sort the data in an ascending or descending
    sequence.


    As will be made in later chapters, the various clauses in a SELECT statement,
    if they exist, must be specified in the same order shown in the previous general
    statement. For example, if there is a GROUP BY clause in a SELECT statement, it
    must appear after a WHERE clause and before a HAVING clause.


    In addition to all of the aforementioned clauses, we will also talk about a number
    of ways to organize the SELECT statement, including subqueries and set logic.
    Subqueries are a way to insert a SELECT statement within another SELECT statement,
    and are often useful for certain types of selection logic. Set logic is a way
    to combine multiple queries by side as a single query.


    # Looking Ahead


    In this chapter, we begin our exploration of how to use the SELECT statement to
    retrieve data. We learned about basic syntax and have seen how to select specific
    columns. In reality, this allows us to accomplish very little of a practical nature.
    Most significantly, we have not yet learned how to apply any type of selection
    criteria to our data retrieval efforts. For example, while we know how to select
    all customers, we don''t yet know how to select only customers from the state
    of New York.'
  merge: -1
  img_proc: true
