- pgno: 221
  md: '# Excel Pivot Tables 205


    At this point, we see an empty pivot table and a PivotTable listing the available
    fields that can be moved into the pivot table. The easiest way to move data to
    the pivot table is to drag fields from the list to one of the four areas of the
    pivot table on the Fields list: Filters, Rows, Columns, or Values. Let''s begin
    by moving Customer to the Filters area, Sales Month to the Rows area, Product
    Category to the Columns area, and Total Sales to the Values area. The results
    are shown in 20.7.


    ![](img/5ca87304bc9123a04f1955d920524713_221_0.png)


    20.7 A pivot table with fields in all areas


    Let''s examine what has happened to our data. Pivot tables show all the data to
    which the pivot table is connected. The pivot table displays as many rows and
    columns as are necessary to display that data. The data is displayed in a crosstab
    format, with fields in the Rows or Columns, and quantitative values in the Values
    area. The Filter area can be used to apply a filter to everything in the pivot
    table. In this example, we''ve placed Customer in the Filters area but haven''t
    yet applied any filters on the state.


    When fields are moved to any of the four areas, the pivot table is instantly updated
    with appropriate values corresponding to the new layout. This is a highly interactive
    device that lets you manipulate data at will.


    Unlike SQL, you never need to specify a grouping in any pivot tables. Excel assumes
    that you want grouping of any fields in the Rows or Columns area. In this example,
    the pivot table has grouped all data by Sales Month and Product Category. We see,
    therefore, that there was a total of 86 dollars of tea sales in the month of February
    2017. Grand Total rows and columns have been added automatically, although those
    Grand Totals can just easily be turned off.'
