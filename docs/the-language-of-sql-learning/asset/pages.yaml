- pgno: 231
  md: '# # Getting Started with Oracle


    The following describes the procedure for installing the free version of Oracle
    on a computer running Windows. In addition to Windows, this database is also available
    for Linux but not for the Mac. Note that the procedure may vary, depending on
    what is already installed on your computer. There is just one step for the install:


    +   - Install Oracle Database Express Edition.


    This installation will create a single database and provide a web-based graphical
    interface that will allow you to execute SQL commands against the database.


    # ## Installing Oracle Database Express Edition


    This procedure will install the Oracle Database Express Edition. The steps for
    installing are as follows:


    +   - Go to oracle.com/database.

    - Under the DOWNLOADS tab, select Oracle Database 11g Express Edition.

    - Accept the license agreement, and then select the appropriate download for your
    computer (e.g., Windows x64, Windows x32, or Linux x64).

    - Create an Oracle account or sign in with an existing account.

    - When the download completes, click OPEN to view the files.

    - Double-click the SETUP application to start the installation.

    - On the Welcome pane of the install wizard, click NEXT.

    - On the License Agreement pane, accept the terms, and then click NEXT.

    - On the Choose Destination location pane, accept the default location and click
    NEXT.

    - On the Specify Database Passwords pane, enter a password, and then click NEXT.

    - On the Summary pane, click INSTALL.

    - When the install completes, click FINISH.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'After these steps have been completed, you will have software installed under
    the Oracle Database 11g Express directory in the Start menu for Windows, where
    the various features are accessible via the Web-based interface. The primary application
    you''ll use in this directory is Get Started.


    # Using Oracle Database Express Edition


    To gain access to the Oracle database, run the GET STARTED program under the Database
    11g Express directory in the Start menu. This will open a Web-based application
    that will allow you to interface with the database. If you get an error message
    saying the URL is not found, check the URL properties in the Get_Started file
    in the directory where you installed Oracle, and go to that URL.


    Click the APPLICATION EXPRESS button.


    To sign on, enter a username of SYSTEM, enter the password you specified during
    the install, and then click the LOGIN button.


    On the CREATE APPLICATION EXPRESS WORKSPACE page, enter a database username and
    password. The Application Express Username should be SYSTEM.


    Then log in to the new workspace you created.


    You will see four icons representing different functionalities: Application Builder,
    SQL Workshop, Team Development, and Administration. To execute SQL, click the
    SQL Workshop icon.


    You will then see five icons: Object Browser, SQL Commands, SQL Scripts, Query
    Builder, and Utilities.


    To execute a single SQL statement, you can use the SQL Commands icon. This will
    allow you to execute a single command and see results. If you execute multiple
    SQL statements, you can highlight one individual statement and execute only the
    highlighted portion. To execute a SQL statement in the SQL Commands window, click
    the RUN button.


    If you want to execute multiple SQL statements but do not need to see the output,
    you can use the SQL Scripts icon. After selecting this, you can create a new script
    or edit an existing script. To create a new script, click the CREATE button, and
    then name the script and execute the statements you want in it. To execute, click
    the RUN button. After you enter the request, it will ask for a confirmation to
    run. Click the RUN button again. You can then see a summary of your script execution
    by clicking the icon under the VIEW RESULTS column.'
  merge: -1
  img_proc: true
