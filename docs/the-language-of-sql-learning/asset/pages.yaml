    # Looking Ahead


    This chapter illustrated a variety of ways to use set logic to combine multiple
    sets of SELECT statements into a single statement. The most commonly used operator
    is the UNION, which allows you to combine data that is either of different sets.
    As such, the UNION is analogous to the OR operator. The UNION ALL is a variant
    of the UNION that allows duplicate rows to be shown. Similarly, the INTERCEPT
    operator allows data to be presented if it is in both of the sets of data being
    combined. The INTERCEPT is analogous to the AND operator. Finally, the EXCEPT
    operator allows selection of data that is in one set but not in another.


    Our next, "Stored Procedures and Parameters," will show how you can save simple
    SQL statements in a procedure and make use of parameters within those procedures
    to add a degree of generality to SQL commands. We''ll also talk about the possibility
    of creating your custom functions, and explain how functions differ from stored
    procedures. Much like the views discussed in Chapter 13,"Self Joins and Views,"
    stored procedures and custom functions are useful objects that you can create
    and store in your database to provide some extra polish and functionality.'
