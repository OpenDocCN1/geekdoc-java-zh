- pgno: 59
  md: '# Sorting by Multiple Columns


    The order is now completely different, because the sort is by first name rather
    than last name.


    SQL provides a special keyword named ASC, which stands for *ascending*. This keyword
    is completely optional and largely unnecessary, because all sorts are assumed
    to be in ascending order by default. The following SELECT, which uses the ASC
    keyword, returns the same data previously.


    ```

    SELECT

    FirstName

    LastName

    FROM Salespeople

    ORDER BY FirstName ASC

    ```


    In essence, the keyword ASC can be used to emphasize the fact that the sort is
    in ascending, rather than descending, order.


    # Sorting in Descending Order


    The DESC keyword sorts in an order opposite to ASC. Instead of ascending, the
    order in a sort is descending. For example:


    ```

    SELECT

    FirstName

    LastName

    FROM Salespeople

    ORDER BY FirstName DESC

    ```


    retrieves:


    | FirstName | LastName |

    | Natalie | Lopez |

    | Gregory | Brown |

    | Connie | King |

    | Carla | Brown |


    The first names are now in a Z-to-A order.


    # Sorting by Multiple Columns


    We return to the problem of what to do with the Browns. To sort by last name when
    there is more than one person with the same last name, we must add a secondary
    sort by first name, as follows:


    ```

    SELECT

    FirstName

    LastName

    FROM Salespeople

    ORDER BY LastName, FirstName

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Chapter 5 Sorting Data


    This brings back:


    | FirstName | LastName |

    |---|---|

    | Carla | Brown |

    | Gregory | Brown |

    | Connie | King |

    | Natalie | Lopez |


    Because a second sort column is now specified, we can now be certain that Carla
    Brown will appear before Gregory Brown. Note that LastName must be listed before
    FirstName in the ORDER BY clause. The order of the columns is significant. The
    first column always has the primary sort value. Any additional columns become
    second, tertiary, and so on.


    # Sorting by a Calculated Field


    We''ll now apply our knowledge of calculated fields and aliases from Chapter 3
    to illustrate some possibilities for sorts. This statement:


    ```

    SELECT

    LastName + '', '' + FirstName AS ''Name''

    FROM Salespeople

    ORDER BY Name

    ```


    returns this data:


    | Name |

    |---||

    | Brown, Carla |

    | Brown, Gregory |

    | King, Connie |

    | Lopez, Natalie |


    As seen, we utilized concatenation to create a calculated field with an alias
    of Name. We are able to refer to that same alias in the ORDER BY clause. This
    nicely illustrates another benefit of using column aliases. Also, the design of
    the calculated field itself inserts a space between the last and first name columns
    to separate them, and to show the name in a commonly used format. Conveniently,
    this format also works well for sorting. The ability to display names in this
    format, with a comma separating the last and first name, is a handy trick to keep
    in mind. Users often want to see names arranged in this manner.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Sort Sequences 45


    It''s also possible to put a calculated field in the ORDER BY clause without using
    it as a column alias. Similar to the above, we could also specify:


    ```

    SELECT

    FirstName,

    LastName

    FROM Salespeople

    ORDER By LastName + FirstName

    ```


    This would display:


    | FirstName | LastName |

    | Carla | Brown |

    | Gregory | Brown |

    | Connie | King |

    | Natalie | Lopez |


    The data is sorted the same as in the prior example. The only difference is that
    we''re now specifying a calculated field in the ORDER BY clause without making
    use of column aliases. This gives the same result as if LastName and FirstName
    were specified as the primary and secondary sort columns.


    # Sort Sequences


    In the previous examples, all of the data is character data, consisting of letters
    from A to Z. There are no numbers or special characters. Additionally, there has
    been no consideration of upper- and lowercase letters.


    Every database lets users specify or customize collation settings that provide
    details on how data is sorted. The settings vary among databases, but three facts
    are generally true. First, when data is sorted in an ascending order, any data
    with values appear first. As previously discussed, NULLs are values where there
    is an absence of data. After any NULLs, numbers will appear before characters.
    For data sorted in descending order, character data will display first, then numbers,
    and NULLs.


    Second, for character data, there is usually no difference between upper- and
    lowercase. An is treated the same as an E. Third, for character data, the individual
    characters that make the value are evaluated from left to right. If we''re talking
    about letters, then AB will come before AC. Let''s look at an example, taken from
    this table, which we''ll refer to TableForSort:


    | TableID | CharacterData | NumericData |

    | 1 | 23 | 23 |

    | 2 | 5 | 5 |

    | 3 | Dog | NULL |

    | 4 | NULL | -6 |'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Chapter 5 Sorting Data


    In this table, the CharacterData column is defined as a character column, for
    example as VARCHAR (a variable length datatype). Similarly, the NumericData column
    is defined as a numeric column, such as INT (an integer datatype). Values with
    no data are displayed as NULL. When this SELECT is issued against the TableForSort
    table:


    ```

    SELECT

    NumericData

    FROM TableForSort

    ORDER BY NumericData

    ```


    it will display:


    | NumericData |

    |NULL|

    |-6|

    |5|

    |23|


    Notice that NULLs come first, then the numbers in numeric sequence. If we want
    the NULL values to assign a default value of 0, we can use the ISNULL function
    discussed in the previous chapter and issue this SELECT statement:


    ```

    SELECT

    ISNULL(NumericData,0) AS ''NumericData''

    FROM TableForSort

    ORDER BY ISNULL(NumericData,0)

    ```


    The result is now:


    | NumericData |

    |-6|

    |0|

    |5|

    |23|


    The ISNULL function converted the NULL value to a 0, which results in a different
    sort order.


    The decision as to whether to display NULL values as NULL or as 0 depends on the
    specific circumstance. If the user thinks of NULL values as meaning 0, then they
    should be displayed as 0. However, if the user sees NULL values as an absence
    of data, then displaying the word NULL is appropriate.'
