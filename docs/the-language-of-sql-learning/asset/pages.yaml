- pgno: 160
  md: '# Chapter 14 Subqueries


    Here''s the general SELECT statement we''ve seen previously:


    ```

    SELECT columnlist

    FROM tablelist

    WHERE condition

    GROUP BY columnlist

    HAVING condition

    ORDER BY columnlist

    ```


    Subqueries can be inserted into virtually any of the clauses in the SELECT statement.
    However, the way in which the subquery is stated and varies slightly, depending
    on whether it is in a columnlist, tablelist, or condition.


    But what exactly is a subquery? A subquery is merely a SELECT statement that has
    been inserted inside another statement. The results from the subquery are used
    within the context of the overall SQL query. Additionally, there can be more than
    one subquery in a SQL query. To summarize, subqueries can be specified in three
    main ways:


    +   * When a subquery is part of a tablelist, it specifies a data source. This
    applies to situations where the subquery is part of a FROM clause.

    * When a subquery is part of a condition, it becomes part of the selection criteria.
    This applies to situations where the subquery is part of a WHERE or HAVING clause.

    * When a subquery is part of a columnlist, it creates a single calculated column.
    This applies to situations where the subquery is part of a SELECT, GROUP BY, or
    ORDER BY clause.


    The remainder of this chapter explains each of these three scenarios in detail.


    # Using a Subquery as a Data Source


    When a subquery is part of the FROM clause, it instantly creates a new data source.
    This is similar to the concept of creating a view and referencing it in a SELECT.
    The only difference is that a view is permanently saved in a database. A subquery
