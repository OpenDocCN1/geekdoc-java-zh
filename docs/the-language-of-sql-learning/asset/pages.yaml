- pgno: 30
  md: '# Database Differences: MySQL


    MySQL supports comments in both the double dash and the C programming format (/*
    and */), with one difference. When using the double dash format, MySQL requires
    a space or special character such as a tab immediately after the second dash.


    In addition, MySQL allows for a method of inserting comments, similar to the double
    dash. In MySQL, you can place a number sign (#) anywhere on a line to indicate
    comments. All text after the # symbol on that line is taken as a comment. Here''s
    an example of this format:


    ```

    SELECT FirstName

    # this is a comment

    FROM Customers;

    ```


    # Specifying Columns


    So far, we''ve done nothing more than simply display all the data in a table.
    But if we wanted to select only columns? Working from the same table, we might
    want to display only the customer''s last name, for example. The SELECT statement
    would then look like:


    ```

    SELECT LastName

    FROM Customers

    ```


    and the resulting data would be:


    | LastName |

    | Davis |

    | Shah |

    | Johnson |

    | Martinez |


    If we wanted to select more than one, but not all, columns, the SELECT might look
    like this:


    ```

    SELECT

    FirstName,

    LastName

    FROM Customers

    ```


    and the output would appear as:


    | FirstName | LastName |

    | Sara | Davis |

    | Rumi | Shah |

    | Paul | Johnson |

    | Samuel | Martinez |'
