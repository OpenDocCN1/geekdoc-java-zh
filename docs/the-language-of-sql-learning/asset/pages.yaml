  md: '# 11


    # Inner Joins


    **Keywords Introduced**

    INNER JOIN · ON


    Back in Chapter 1, we talked about the huge advent of relational databases over
    their predecessors. The significant achievement of relational databases was in
    their ability to allow data to be organized in any number of tables that are related
    but at the same time independent of each other. Prior to the advent of relational
    databases, traditional databases utilized a chain of internal pointers to explicitly
    define the relationships between tables. For example, you might start with a Customers
    table and then follow pointers to find the first order for a particular customer,
    the next order, and so on until all orders for the customer have been retrieved.
    In contrast, relational databases allows relationships to be inferred by columns
    that have in common. These relationships are sometimes formalized by the definition
    of primary and foreign keys, but that isn''t always necessary.


    With relational databases, it is the responsibility of the SQL developer to determine
    and define the relationships between tables. This allows for great flexibility
    in how different data elements can be combined. The great virtue of relational
    databases lies in the fact that one can grab data from a variety of tables that
    serve the immediate business requirement.


    Let''s start with a common example. Most organizations have a business entity
    known as a Customer. As a database typically contains a Customers table that defines
    each customer. Such a table would include a primary key to uniquely identify each
    customer, and any number of columns with attributes that further define the customer.
    Common attributes include phone number, address, city, state, and so on.


    The main idea is that all information about the customer is stored in a single
    table and only in that table. This simplifies the task of data updates. When a
    customer changes his phone number, only one table needs to be updated. However,
    the downside to this setup is whenever someone needs any information about a customer,
    they must access the Customers table to retrieve the data.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'This brings us to the concept of a join. Let''s say that someone is analyzing
    products that have been purchased. With information about the products, it might
    be necessary to provide information about the customers who purchased each product.
    For example, an analyst may wish to obtain customer ZIP codes for a geographic
    analysis. Whereas product information may be found in a Products table, the ZIP
    code is stored only in the Customers table. To get information on both customers
    and products, the analyst must join both tables in such a way that the data matches
    correctly.


    In essence, the process of relational databases is fulfilled by the ability to
    join tables together in any desired manner. This is the normal situation. With
    this chapter, we will leave behind the somewhat artificial examples for which
    data is retrieved only from a single table and encounter more realistic scenarios
    involving multiple tables.


    # Joining Two Tables


    To begin our exploration of the join process, let''s revisit the Sales table that
    we encountered previously in Chapters 3 and 6:


    | SalesID | FirstName | LastName | QuantitySold | PricePerItem |

    |---|---|---|---|--|

    | 1 | Andrew | Li | 4 | 2.50 |

    | 2 | Carol | White | 10 | 1.25 |

    | 3 | James | Carpenter | 5 | 4.00 |


    To some extent, the use of this table in earlier chapters was somewhat misleading.
    In reality, a competent database designer would create a table such as this. The
    problem is that it contains information about two entities, customers and orders.
    In the real world, information would be split into at least two tables. A Customers
    table might look like the following table, seen previously in Chapter 2, "Basic
    Data Retrieval":


    | CustomerID | FirstName | LastName |

    |---|---|--|

    | 1 | Sara | Davis |

    | 2 | Rumi | Shah |

    | 3 | Paul | Johnson |

    | 4 | Samuel | Martinez |


    An Orders table might look like this:


    | OrderID | CustomerID | OrderDate | OrderAmount |

    |---|---|---|--|

    | 1 | 2 | 2016-09-01 | 10.00 |

    | 2 | 2 | 2016-09-02 | 12.50 |

    | 3 | 2 | 2016-09-03 | 18.00 |

    | 4 | 3 | 2016-09-15 | 20.00 |'
