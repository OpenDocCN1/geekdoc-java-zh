- pgno: 41
  md: '# Looking Ahead


    In this chapter, as discussed with column aliases, the AS keyword is optional,
    unlike column aliases, table aliases are not enclosed within quotes. A second
    reason for using table aliases is to allow you to use that alias name as a prefix
    for any selected column. For example, the above could also be written as:


    ```

    SELECT

    Sales.LastName

    FROM Sales123 AS Sales

    ```


    The word Sales has now been added as a prefix to the LastName column, with a period
    to separate the prefix from the column name. In this situation, the use of the
    prefix was strictly optional and somewhat redundant. Because there was only one
    table in this query, it wasn''t necessary to include the table name as a prefix
    for the column. However, when data is selected from multiple tables, the use of
    a prefix is often helpful and sometimes be required. When multiple tables are
    involved, adding the table name as a prefix helps anyone viewing the query quickly
    grasp each column. Furthermore, when a column is named the same in multiple tables,
    the use of a table alias is actually required. This usage of column aliases will
    be illustrated in Chapter 11, "Inner Joins."


    A third reason for using table aliases has to do with the use of tables in subqueries.
    This will be discussed in Chapter 14, "Subqueries."


    # Database Differences: Oracle


    Although the AS keyword can be used for column aliases, Oracle does not permit
    the AS keyword to denote table aliases. The SELECT must be written in Oracle as:


    ```

    SELECT

    Sales.LastName

    FROM Sales123 Sales;

    ```


    # Looking Ahead


    In this chapter, we discussed three ways to create calculated fields in a SELECT
    statement. First, literal values can be used to select specific words or values.
    Second arithmetic calculations can be applied to one columns in a single expression.
    Third, concatenation can be used to combine columns and literal values. We also
    discussed the related topic of column aliases, which are often employed when using
    calculated fields. Finally, we offered a preview of table aliases, a topic that
    will be covered in greater detail in later chapters.


    In the next chapter, we''ll move on to the subject of functions, which provide
    more complex and interesting ways to perform calculations. As mentioned before,
    we''re not quite at the point where we can apply selection criteria to SQL statements.
    We''re still building on the basics of what can be done with the columnlist in
    a SELECT. Your patience with this methodical approach will reap rewards in Chapter
    6, when we get to the topic of selection logic.'
