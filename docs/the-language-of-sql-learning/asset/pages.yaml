- pgno: 99
  md: '# Aggregate Functions


    The functions discussed in Chapter 4, "Using Functions," were all scalar functions.
    These functions were all performed on a single number or value. In contrast, aggregate
    functions are meant to be used with groups of data. The most widely used aggregate
    functions are COUNT, SUM, AVG, MIN, and MAX. These functions provide counts, sums,
    averages, and minimum values for groups of data.


    All of our aggregate function examples will be taken from the following two tables
    with student fees and grades. The Fees table contains:


    | FeeID | Student | FeeType | Fee |

    |---|---|---||}{

    | 1 | Jose | Gym | 30 |

    | 2 | Jose | Lunch | 10 |

    | 3 | Jose | Trip | 8 |

    | 4 | Rama | Gym | 30 |

    | 5 | Julie | Lunch | 10 |


    This is the Grades table:


    | GradeID | Student | GradeType | Grade | YearInSchool |

    |---|---|---|---|---||

    | 1 | Isabella | Quiz | 92 | 7 |

    | 2 | Isabella | Quiz | 95 | 7 |

    | 3 | Isabella | Homework | 84 | 7 |

    | 4 | Hailey | Quiz | 62 | 8 |

    | 5 | Hailey | Quiz | 81 | 8 |

    | 6 | Hailey | Homework | NULL | | |

    | 7 | Peter | Quiz | 58 | 7 |

    | 8 | Peter | Quiz | 74 | 7 |

    | 9 | Peter | Homework | 88 | |


    With the SUM function, let''s say we want to see the total amount of gym paid
    by all students. This can be accomplished with this statement:


    ```

    SELECT

    SUM(Fee) AS ''Total Gym Fees''

    FROM Fees

    WHERE FeeType = ''Gym''

    ```


    The resulting data is:


    | Total Gym Fees |

    |---||

    | 60 |'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'As you can see, the SUM function sums up the total values for the Fee column,
    subject to the selection logic specified in the WHERE clause. Because the only
    expression in the columnlist is an aggregate function, the query returns only
    one column and one row of data with the aggregate amount.


    The AVG, MIN, and MAX functions are quite similar to the SUM function. Here''s
    an example of the AVG function. In this case, we''re seeking to obtain the average
    grade of all quizzes in the Grades table:


    ```

    SELECT

    AVG(Grade) AS ''Average Quiz Score''

    FROM Grades

    WHERE GradeType = ''Quiz''

    ```


    The result is:


    Average Quiz Score

    77


    More than one aggregate function can be used in a single statement. Here''s a
    SELECT shows how to utilize AVG, MIN, and MAX in the same statement:


    ```

    SELECT

    AVG(Grade) AS ''Average Quiz Score'',

    MIN(Grade) AS ''Minimum Quiz Score'',

    MAX(Grade) AS ''Maximum Quiz Score''

    FROM Grades

    WHERE GradeType = ''Quiz''

    ```


    The result is:


    Average Quiz Score | Minimum Quiz Score | Maximum Quiz Score

    77 | 58 | 95


    # The COUNT Function


    The COUNT function is slightly more complex than the aggregate functions discussed
    previously, in that it can be employed in three different ways. First, the COUNT
    function can be used to return a count of all selected rows, regardless of the
    values in any particular column. As an example, the following statement returns
    a count of all rows that have homework grades:


    ```

    SELECT

    COUNT(*) AS ''Count of Homework Rows''

    FROM Grades

    WHERE GradeType = ''Homework''

    ```'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'The result is:


    # Count of Homework Rows


    3


    The asterisk in parentheses means “all columns.” Behind the scenes, SQL actually
    retrieves the data in all columns for the selected rows, and then returns a count
    of the number of rows.


    In the second format of the COUNT function, a specific column is specified within
    the parentheses. Here’s an example:


    ```

    SELECT

    COUNT(Grade) AS ''Count of Homework Scores''

    FROM Grades

    WHERE GradeType = ''Homework''

    ```


    The result is:


    # Count of Homework Rows


    3


    The subtle difference between the preceding two SELECT statements. In the first,
    we’re merely counting rows where the GradeType equals Homework. There are three
    of those rows. In the second statement, we’re counting occurrences of the Grade
    column where the GradeType column has a value of Homework. In this case, one of
    the three rows has a value of NULL in the Grade column, and SQL is smart enough
    not to count such a row. As mentioned previously, NULL means that the data does
    not exist.


    The third variant of COUNT function allows us to use the DISTINCT keyword in addition
    to a column name. Here’s an example:


    ```

    SELECT

    COUNT(DISTINCT FeeType) AS ''Number of Fee Types''

    FROM Fees

    ```


    Note that the DISTINCT keyword is placed inside the parentheses. The DISTINCT
    keyword says that we want to include only distinct values of FeeType. The outer
    COUNT function counts those values. The result of this statement is:


    # Number of Fee Types


    3


    This means that there are three different values found in the FeeType column.'
