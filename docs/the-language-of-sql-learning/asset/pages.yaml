    | integer | int | int | number | 43 |

    | decimal | decimal | decimal | number | 58.63 |

    | real | float | float | number | 80,62345 |


    Character datatypes are sometimes referred to as string or character datatypes.
    Unlike numeric datatypes, character datatypes are not restricted to numbers. They
