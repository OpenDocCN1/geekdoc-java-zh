    # Database Differences: Oracle


    Unlike SQL Server and MySQL, Oracle typically displays dates in a DD-MMM-YY format.
    For example, the date 2016-09-02 in the previous table will display as 02-SEP-16
    in Oracle. However, no matter which database you''re using, the exact format in
    which dates are displayed will vary, depending on how your database was set up.


    Before analyzing the previous SELECT statement, notice two interesting aspects
    of the data. First, Samuel Martinez has no data other than his name. The reason
    for the lack of data is that there are no rows in the Orders table associated
    with that customer. The power of the outer join becomes evident from the fact
    that we can see some data for Samuel Martinez, even if he has no orders. If we
    had specified an INNER JOIN rather than a LEFT JOIN, we would see no rows at all
    for Samuel.


    Similarly, there is no refund data for either the 9/2/2016 order from Rumi Shi
    or the order from Paul Johnson. We see this because there are no rows in the Refunds
    table associated with these orders. If we had specified an INNER JOIN rather than
    a LEFT JOIN, we would have seen no rows at all for these two orders.


    Let''s examine the SELECT statement rather. The first few lines show that the
    columns are nothing we''ve seen before. Notice rather than using table aliases,
    we''ve chosen to list all the columns with their fully qualified names, using
    the table name as prefix.


    The first table listed is the Customers table. This table is shown after the FROM
    keyword. The second table is the Orders table, which appears after the first JOIN
    keyword. The subsequent ON clause specifies how the Orders table is linked to
    Customers table. The third table is shown the Refunds table, which appears after
    the second LEFT JOIN keyword. The subsequent ON clause states how the Refunds
    table is joined to the Orders table.


    It is critical to realize the order in which tables are listed in reference to
    the LEFT JOIN keyword. When specifying a LEFT JOIN, the table to the left of LEFT
    JOIN is the primary table. The table to the right of LEFT JOIN is the secondary
    table. When joining the secondary table to the primary table, we want all rows
    in the primary table, even if there are no matches with any in the secondary table.


    In the first specified LEFT JOIN, the Customers table is on the left and the Orders
    table is on the right of the LEFT JOIN. This signifies that Customers is primary
    and Orders is secondary. In other words, we want to see all selected data from
    the Customers table, even if there isn''t a corresponding match in the secondary
    table for that row.


    Similarly, in the second LEFT JOIN, the Orders table is to the left and the Refunds
    table is to the right of the LEFT JOIN keyword. That means that we are specifying
    Orders as primary and Refunds as secondary in this join. We want all orders, even
    if there are matching refunds for some orders.'
