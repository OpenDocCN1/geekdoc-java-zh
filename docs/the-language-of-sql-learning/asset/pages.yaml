    # Wildcards


    The percent (%) is the most common wildcard used with the LIKE operator, but there
    are a few other possibilities. These include the underscore (_), a characterlist
    enclosed in square brackets, and a caret symbol (^) plus a characterlist enclosed
    in square brackets. The following table lists these wildcards and their meanings:


    | Wildcard | Meaning |

    | --- | --- |

    | % | any characters (can be zero characters) exactly one character (can be any
    character) exactly one character in the characterlist |

    | [characterlist] | exactly one character not in the characterlist |'
