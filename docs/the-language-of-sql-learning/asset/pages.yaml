- pgno: 77
  md: '# # Boolean Logic


    **Keywords Introduced**

    AND · OR · NOT · BETWEEN · IN · NULL


    We introduced the concept of selection criteria in the previous chapter, but only
    in its simplest form. We''ll now expand on that concept to greatly enhance our
    ability to specify the rows returned from a SELECT. This is where the pure logic
    of SQL comes into play. In this chapter, we''ll introduce a number of operators
    that will allow you to create complex logical expressions.


    Given these new capabilities, if a user comes to you and requests a list of all
    female customers who live in zip codes 60601 through 62999 but excluding anyone
    under the age of 30 or who doesn''t have an email address, that will be something
    you can provide.


    # # Complex Logical Conditions


    The WHERE clause introduced in the previous chapter used only simple selection
    criteria. We saw clauses as:


    ```

    WHERE QuantityPurchased = 5

    ```


    The condition expressed in this WHERE clause is quite basic. It specifies merely
    to return all rows where the QuantityPurchased column has a value of 5. In the
    real world, the selection of data is often far from straightforward. Accordingly,
    let''s now turn our attention to methods of specifying some complex logical conditions
    in selection criteria.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The principle keywords used to create complex Boolean logic are AND, OR, and
    NOT. These three operators are used to provide additional functionality to the
    WHERE clause. In proper combination, the AND, OR, and NOT operators, along with
    parentheses, can specify just about any logical expression that can be imagined.


    # The AND Operator


    The following examples will all be taken from this Purchases table:


    | CustomerID | CustomerName | State | QuantityPurchased | PriceItem |

    |---|---|---|---|--|

    | 1 | Andrew Li | IL | 4 | 2.50 |

    | 2 | Carol White | CA | 10 | 1.25 |

    | 3 | James Carpenter | NY | 5 | 4.00 |


    Here''s an example of a WHERE clause that uses the AND operator:


    ```

    SELECT

    CustomerName,

    QuantityPurchased

    FROM Purchases

    WHERE QuantityPurchased > 3

    AND QuantityPurchased < 7

    ```


    The AND clause means that all conditions must evaluate to true for the row to
    be selected. SELECT specifies that only the rows to be retrieved are for which
    the QuantityPurchased is both greater than 3 and less than 7. Therefore, only
    these two rows are returned:


    | CustomerName | QuantityPurchased |

    |---|--|

    | Andrew Li | 4 |

    | James Carpenter | 5 |


    Notice that the row for Carol White is not returned. Why? Carol purchased a quantity
    of 10, which, in fact, satisfies the condition (QuantityPurchased > 3). However,
    the second condition (QuantityPurchased < 7) is not satisfied and therefore is
    not true. When using the AND operator, all conditions must be true for the row
    to be selected.


    # The OR Operator


    Now let''s look at the OR operator. The AND operator meant that all conditions
    must evaluate to true for the row to be selected. The OR operator means that the
    row will be selected if any of the conditions are determined to be true.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Using Parentheses 63


    Here''s an example, taken from the same table:


    ```

    SELECT

    CustomerName,

    QuantityPurchased,

    PricePerItem

    FROM Purchases

    WHERE QuantityPurchased > 8

    OR PricePerItem > 3

    ```


    This SELECT returns this data:


    | CustomerName | QuantityPurchased | PricePerItem |

    |---|---|--|

    | Carol White | 10 | 1.25 |

    | James Carpenter | 5 | 4.00 |


    Why are the rows for Carol White and James Carpenter displayed, and not the row
    for Andrew Li? The row for Carol White is selected because it meets the requirements
    of the first condition (QuantityPurchased > 8). It doesn''t matter that the second
    condition (PricePerItem > 3) isn''t true, because only one condition needs to
    be true for an OR condition.


    Likewise, the row for James Carpenter is selected because the second condition
    (PricePerItem > 3) is true for that row. The row for Andrew Li isn''t selected
    because it doesn''t satisfy either of the two conditions.


    # Using Parentheses


    Let''s say that we are interested only in orders from customers from either the
    state of Illinois or the state of California. Additionally, we want to see orders
    where the quantity purchased is greater than 8. To attempt to satisfy this request,
    we might put together this SELECT


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE State = ''IL''

    OR State = ''CA''

    AND QuantityPurchased > 8

    ```


    We expect this statement to return only one row of data, for Carol White. Although
    we have two rows for customers in Illinois or California (Li and White), only
    one of them has a quantity purchased greater than 8. However, when this statement
    is executed, we get:


    | CustomerName | State | QuantityPurchased |

    |---|---|--|

    | Andrew Li | IL | 4 |

    | Carol White | CA | 10 |'
