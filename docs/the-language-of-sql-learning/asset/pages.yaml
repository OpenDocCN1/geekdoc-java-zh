- pgno: 71
  md: 'In this example, the percent (%) sign is used as a wildcard. The percent (%)
    wildcard means any characters. Any characters includes the possibility of being
    no characters. The percent (%) before LOVE means that we will accept a phrase
    with any (or no) characters before LOVE. Similarly, the percent (%) after LOVE
    means we''ll accept a phrase with any (or no) characters after LOVE. In other
    words, we''re looking for any movie title that contains the word LOVE. Here is
    the data returned from the:


    | Movie |

    | Love Actually |

    | Love and Death |

    | Everyone Says I Love You |

    | Down with Love |


    Notice that LOVE appears as the first word, the last word, and sometimes in the
    middle of the movie title.


    # Database Differences: Oracle


    Unlike Microsoft SQL Server and MySQL, Oracle is case sensitive when determining
    matches for literal values. In Oracle, LOVE is not the same as Love. An equivalent
    statement in Oracle is:


    ```

    SELECT

    MovieTitle AS Movie

    FROM Movies

    WHERE MovieTitle LIKE ''%LOVE%'';

    ```


    This would return no data, because no movie title contains the word LOVE in all
    uppercase. solution in Oracle is to use the UPPER function to convert your data
    to uppercase, as follows:


    ```

    SELECT

    MovieTitle AS Movie

    FROM Movies

    WHERE UPPER(MovieTitle) LIKE ''%LOVE%''

    ```


    Let''s now attempt to find movies that begin with LOVE. If we issue:


    ```

    SELECT

    MovieTitle AS ''Movie''

    FROM Movies

    WHERE MovieTitle LIKE ''LOVE%''

    ```


    we will retrieve only data:


    | Movie |

    | Love Actually |

    | Love and Death |'
