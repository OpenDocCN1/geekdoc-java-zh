    datatypes are often used to define an attribute as having a simple true or false
    type of value. Integers are numbers without decimal places. Decimal datatypes
    can contain decimal places. Unlike bits, integers, and decimals, real numbers
    are numbers whose exact value is approximately defined internally. The distinguishing
    characteristic of all numeric datatypes is that they can be used in arithmetic
    calculations. Here are a few representative examples of numeric datatypes from
    Microsoft SQL, MySQL, and Oracle.


