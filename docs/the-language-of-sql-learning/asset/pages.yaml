    seventh rows, with NULL in the Channel column, show subtot for the State. As seen,
    NY had a total of 980 in sales, and VT had 340 in sales.


    The use of the CUBE keyword is to express a multidimensional way of looking at
    the data. Whereas the ROLLUP keyword lets you drill down through data in a hierarchical
    fashion, the CUBE keyword allows for multiple dimensions. In this example, we
    can view subtotals by State or by Column.


    As before, identifying the subtotals and grand totals is tricky. Ideally, you
    want to eliminate all of the NULL values and indicate more precisely which are
    subtotals and grand totals. As with rollups, we can use the GROUPING function
    to determine which rows are subtotals. The following query adds two columns with
    the GROUPING information.


    ```

    SELECT

    State,

    Channel,

    SUM(SalesAmount) AS ''Sales Amount'',

    GROUPING(State) AS ''State Group'',

    GROUPING(Channel) AS ''Channel Group''

    FROM SalesSummary

