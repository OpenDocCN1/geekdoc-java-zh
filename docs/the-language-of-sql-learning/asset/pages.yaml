  md: '# Chapter 10 Subtotals Crostabs


    Remember that one of the main difficulties with using the PIVOT command is that
    all column values must be explicitly listed. If you are querying data, you must
    know what these values are in advance of writing the query. For small categorical
    data items, this may not be a problem. But where there are many possible values
    that change over time, this can be problematic. In Chapter 20, "Strategies for
    Displaying Data," we will discuss an alternative to PIVOT queries—namely, Excel
    pivot tables. Unlike crosstab queries, pivot tables do not require the user to
    know what values apply. Pivot tables display rows and columns dynamically, as
    needed, based on the values that are present. Hence, it is often more expedient
    to use the raw data and let them create a crosstab layout via Excel pivot tables.


    # Database Differences: MySQL and Oracle


    MySQL doesn''t support the PIVOT keyword.


    Oracle uses different syntax for the PIVOT keyword. The equivalent of the SQL
    Server statement:


    ```

    SELECT * FROM

    (SELECT Channel, State, SalesAmount FROM SalesSummary) AS mainquery

    PIVOT (SalesAmount) FOR State IN ([NY], [VT]) AS pivotquery

    ```


    in Oracle:


    ```

    SELECT * FROM

    (SELECT Channel, State, SalesAmount FROM SalesSummary)

    PIVOT (SalesAmount) FOR State IN (''NY'', ''VT''));

    ```


    Unlike SQL Server, Oracle uses quotes rather than brackets for the enumerated
    values and does not use aliases (mainquery and pivotquery in this example).


    # Looking Ahead


    This chapter took a slight detour into matters concerning layout. The ROLLUP and
    CUBE keywords allow the GROUPING clause to generate additional subtotal rows on
    any number of columns. The ROLLUP query works best with data for there was a hierarchical
    relationship between the Category and Subcategory columns of the Inventory table.
    In contrast, the CUBE query generates all combinations of subtotals for the specified
    columns. As with a cube structure, subtotals can be viewed from any perspective.
    We also discussed the GROUPING function, which provides a way to add clarity to
    subttotal displays.


    Our second topic in this chapter, crosstabs, uses the PIVOT operator to produce
    data in a useful crosstab layout. Although PIVOT queries are somewhat cumbersome
    to create, they sometimes serve a purpose in generating data in a comprehensible
    format for the end user. In Chapter 20, we will discuss pivot tables, which are
    usually an easier way to display data in a crosstab fashion.


    In the next chapter, "Inner Joins," we will return to this detour to rejoin the
    main focus of this book. Up until now, all of our queries have involved retrieving
    data from one table at a time. The few chapters will explore methods of combining
    data from multiple tables once. In the real world of computing, required data
    seldom comes from a single table. Thus, it is essential to learn how to relate
    and combine data from more than one table in a single query.'
  merge: -1
