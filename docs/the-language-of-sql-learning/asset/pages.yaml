- pgno: 164
  md: '# Chapter 14 Subqueries


    Rakesh Gupta is not included in the list, although he has transactions, none of
    them were in cash. Notice that the subquery SELECT is placed entirely within the
    parentheses for the IN keyword. There is only one column, UserID, in the columnist
    of the subquery. This is a requirement, because we want the subquery to produce
    the equivalent of a list of values for only one column. Also note that the UserID
    column is used to connect the two queries. Although we''re using UserName, we
    use UserID to define the relationship between the Users and Transactions tables.


    Once again, we can ask whether it''s necessary to use a subquery, and this the
    answer is no. Here is an equivalent query that returns the same data.


    ```

    SELECT UserName AS ''User Name''

    FROM Users

    INNER JOIN Transactions

    ON Users.UserID = Transactions.UserID

    WHERE TransactionType = ''Cash''

    GROUP BY Users.UserName

    ```


    Without using a subquery, we can directly join the Users and Transactions tables.
    However, a GROUP BY clause now needed to ensure that we bring back one row per
    user.


    # Correlated Subqueries


    The subqueries we''ve seen so far have been uncorrelated subqueries. Generally
    speaking, all subqueries can be classified as either uncorrelated or correlated.
    These terms describe whether the subquery is related to the query to which it
    is contained. Uncorrelated subqueries are unrelated. When a subquery is unrelated,
    it is completely independent of the outer query. Uncorrelated subqueries are evaluated
    and executed only once as part of the entire SELECT statement. Furthermore, uncorrelated
    subqueries can stand on their own. If you wanted to, you could execute an uncorrelated
    subquery as a separate query.


    In contrast, correlated subqueries are specifically related to the outer query.
    Because of this explicit relationship, correlated subqueries must be evaluated
    for every returned row and produce different results each time the subquery is
    executed. Correlated subqueries can''t be executed on their own, because some
    element in the query makes it dependent on the outer query.


    The best way to explain this is with an example. Returning to the Users and Transactions
    tables, let''s say we want to produce a list of users who have a total transaction
    amount less than 20 dollars. Here''s a statement that accomplishes this request:


    ```

    SELECT

    UserName AS ''User Name''

    FROM Users

    WHERE

    (SELECT

    SUM(TransactionAmount)

    FROM Transactions

    WHERE Users.UserID = Transactions.UserID)

    < 20

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'The result is:


    | User Name |

    Rakesh Gupta |


    What makes this subquery correlated, as opposed to uncorrelated? The answer can
    be seen by looking at the subquery itself:


    ```

    SELECT

    SUM(TransactionAmount)

    FROM Transactions

    WHERE Users.UserID = Transactions.UserID

    ```


    This subquery is correlated because it cannot be executed on its own. If run by
    itself, this subquery would produce an error because the Users.UserID column in
    the WHERE clause doesn''t exist within the context of the subquery. To understand
    what''s going on, it''s helpful to look at the entire SELECT statement in a more
    general way:


    ```

    SELECT

    Username AS ''User Name''

    FROM Users

    WHERE

    SubqueryResult < 20

    ```


    The subquery returns a columnlist with a single value, which we''re calling SubqueryResult.
    As a correlated subquery, the subquery must be evaluated for each user. Also,
    note that this type of subquery demands that it returns a single row and a single
    value. The SubqueryResult couldn''t be evaluated if there were more than one row
    or value involved.


    As before, you might ask whether a subquery is necessary, and once the answer
    is no. Here''s an equivalent statement that produces the same result:


    ```

    SELECT

    Username AS ''User Name''

    FROM Users

    LEFT JOIN Transactions

    ON Users.UserID = Transactions.UserID

    GROUP BY Users.UserID, Users.Username

    HAVING SUM(TransactionAmount) < 20

    ```


    Notice, however, without a subquery, the equivalent statement now requires GROUP
    and HAVING clauses. The GROUP BY clause creates groups of users, and the HAVING
    clause enforces the requirement that each group must have transacted less than
    20 dollars.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# The EXISTS Operator


    An additional technique associated with correlated subqueries uses a special operator
    called EXISTS. This operator allows you to determine whether data in a correlated
    subquery exists. Let''s say we want to discover which users have made any transactions.
    This can be accomplished with the use of the EXISTS operator in this statement:


    ```

    SELECT

    UserName AS ''User Name''

    FROM Users

    WHERE EXISTS

    (SELECT *

    FROM Transactions

    Where Users.UserId = Transactions.UserId)

    ```


    This statement returns:


    ![](img/5ca87304bc9123a04f1955d920524713_166_0.png)


    This is a correlated subquery because it cannot be executed on its own without
    reference to the main query. The EXISTS keyword in the statement is evaluated
    as true if the SELECT in the correlated subquery returns any data. Note that the
    subquery selects all columns (SELECT *). Because it doesn''t matter which columns
    are selected in the subquery, we use the asterisk to return all columns. We''re
    interested only in determining whether any data exists in the subquery. The result
    is that the query returns all users except April Waters. She doesn''t appear because
    she has made no transactions.


    As before, the logic in this statement can be expressed in other ways. Here''s
    a statement that obtains the same result by using a subquery with the IN operator:


    ```

    SELECT

    UserName AS ''User Name''

    FROM Users

    WHERE UserId IN

    (SELECT UserId)

    FROM Transactions

    ```


    This statement is probably easier to comprehend.


    Here''s another statement that retrieves the same data without the use of a subquery:


    ```

    SELECT

    UserName AS ''User Name''

    FROM Users

    INNER JOIN Transactions

    ON Users.UserId = Transactions.UserId

    GROUP BY UserName

    ```'
  merge: -1
  img_proc: true
