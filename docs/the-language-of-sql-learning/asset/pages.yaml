    Remember that partitions are not the same as the GROUP BY seen earlier in this
    chapter. The usual purpose of a GROUP BY is to group data and then apply aggregation
    functions to each of the groups. For example, one might want to group by the Exchange
    column and obtain the average for for. This would provide the average PE for both
    NASDAQ and NYSE exchanges. In contrast, theパーティing keeps the detailed data intact.
    Partitions are merely for ranking individual rows within each partition. Although
    data is divided into groups for purposes of ranking, the details are maintained,
    and there is no aggregation involved.


    The preceding example illustrated the use of partitions with the ROW_NUMBER ranking
    function. The application of partitions to the other three ranking functions works
    in an identical manner. For example, if we wanted to partition the data based
    on the Exchange, and show the quarter for each partition, the statement would
    be:


    ```

    SELECT

    Exchange AS ''Exchange'',

    WILE(4) OVER (PARTITION BY Exchange ORDER BY PriceEarningsRatio)

    AS ''Quartile'',

    StockSymbol AS ''Symbol'',

    PriceEarningsRatio AS ''PE Ratio''

    FROM Stocks

    ORDER BY Exchange, PriceEarningsRatio

    ```'
