    WHEN GROUPING (Subcategory) = 1 THEN ''SUBTOTAL''

    ELSE ISNULL(Category,'''') AS ''Category'',

    ISNULL(Subcategory,'' '''') AS ''Subcategory'',

    SUM(Quantity) AS ''Quantity''

    FROM Inventory

    GROUP BY ROLLUP(Category, Subcategory)

    ```


    Now is the output:


    | Category | Subcategory | Quantity |

    | --- | --- | --- |

    | Furniture | | 5 |

    | Furniture | Desk | 4 |

    | SUBTOTAL | | 9 |

    | Paper | Copy | 7 |

    | Paper | Notebook | 4 |

    | SUBTOTAL | | 11 |

