- pgno: 113
  md: '# Partitions


    A variation on how the ranking functions discussed in the previous section can
    be used the ability to divide data into partitions prior to the application of
    the ranking function. We indicated previously that the general format for a columnlist
    element that includes a ranking function is:


    ```

    Rank_Function() OVER (ORDER BY expression [[ASC|DESC])

    ```


    The partitioning of data allows the PARTITION BY keyword. With partitioning, the
    general format for a columnlist element that includes a ranking function is:


    ```

    Rank_Function() OVER (PARTITION BY expression_1 ORDER BY expression_2 [[ASC|DESC])

    ```


    In the previous examples, we had ignored the value of the Exchange column. With
    partitioning, we have the ability to separate, or partition, our data into two
    separate groups, based on the value of Exchange column, which is either NYSE or
    NASDAQ. After the data is separated, the ranking functions are applied as previously
    seen.


    To illustrate, let''s revise the first query of the previous section that used
    the ROW_NUMBER function to rank the data, assigning a row number to each row based
    on the PE ratio. The original SQL statement was:


    ```

    SELECT

    ROW_NUMBER() OVER (ORDER BY PriceEarningsRatio) AS ''Row'',

    StockSymbol AS ''Symbol'',

    Stock AS ''Name'',

    Exchange AS ''Exchange'',

    PriceEarningsRatio AS ''PE Ratio''

    FROM Stocks

    ORDER BY PriceEarningsRatio

    ```


    In our revision, we''ll add the PARTITION BY keyword to the columnlist element
    with the ROW_NUMBER function. We''ll also rearrange the layout of the columns
    and the ORDER BY clause so that the data appears in a morehensible layout. The
    new statement is:


    ```

    SELECT

    Exchange AS ''Exchange'',

    ROW_NUMBER() OVER (PARTITION BY Exchange ORDER BY PriceEarningsRatio) AS ''Exchange
    Rank'',

    StockSymbol AS ''Symbol'',

    PriceEarningsRatio AS ''PE Ratio''

    FROM Stocks

    ORDER BY Exchange, PriceEarningsRatio

    ```'
  merge: -1
  img_proc: true
