    | General Description | Microsoft SQL Server Datatype | MySQL Datatype | Oracle
    Datatype | Example |

    | --- | --- | --- | --- | --- |

    | variable length | varchar | varchar | varchar2 | ''Walt Disney'' |

    | fixed length | char | char | char | ''60601'' |


