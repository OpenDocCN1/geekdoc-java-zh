- pgno: 205
  md: '# 19

    Principles of Database Design


    In our first chapter, we introduced the notion that relational databases are a
    collection of data, stored in any number of tables. The tables are assumed to
    be related to each other in some fashion. In the previous chapter, on maintaining
    tables, we made clear that database designers can, if they choose, assign foreign
    keys to ensure that certain relationships between tables are maintained properly.


    However, even with our knowledge of primary and foreign keys, we have not yet
    addressed the basic issue of how to design a database in the first place. The
    main questions to address are the following:


    +   - How should data be organized into a set of related tables?

    - What data elements should be placed in each table?


    Once tables and their data elements are defined, then database administrator can
    go about the business of creating foreign keys, indexes, appropriate datatypes,
    and so on.


    There will be no single correct answer to the two questions. Besides the fact
    that every organization or business is unique, there is seldom a definitive solution
    for any given situation. Much depends on how flexible a business wants its data
    to be. Another factor is the existence of current data and the need to maintain
    continuity with that data. Very few organizations have the luxury of designing
    their databases in a vacuum, apart from what already exist.


    Despite these principles, certain database design principles have evolved over
    time to guide us in our quest for an optimal design structure. Many of these design
    principles stem from the most influential architect of relational database design,
    E.F. Codd, who published his groundbreaking article “A Relational Model of Data
    for Large Shared Data Banks” in 1979. This article laid the foundation for what
    we now call the relational model and the concept of normalization.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Goals of Normalization


    The term **normalization** refers to a specific process that allows database architects
    to turn unstructured data into a properly designed set of tables and data elements.


    The best way to understand normalization is to illustrate what it isn''t. To do
    this, we''ll start with the presentation of a poorly designed table with a number
    of obvious problems. The following is a named Grades, which attempts to present
    information about all the grades that students have received for the grades they''ve
    taken. Each row represents a grade for a particular student.


    | Test | Student | Date | TotalPoints | Grade | TestFormat | Teacher | Assistant
    |

    |---|---|---|---|---|---|---|-|

    | Pronoun Quiz | Amy | 2017-03-02 | 10 | 8 | Multiple Choice | Smith | Collins
    |

    | Pronoun Quiz | Jon | 2017-03-02 | 10 | 6 | Multiple Choice | Jones | Brown |

    | Solids Quiz | Beth | 2023-03-03 | 20 | 17 | Multiple Choice | Kaplan | NULL
    |

    | China Test | Karen | 2017-02-04 | 50 | 45 | Essay | Harris | Taylor |

    | China Test | Alex | 2017-03-04 | 50 | 38 | Essay | Harris | Taylor |

    | Grammar Test | Karen | 2017-03-05 | 100 | 88 | Multiple Choice, Smith | Collins
    |


    Let''s briefly describe the information that each table is meant to provide. The
    columns are:


    +   * **Description**: A description of the test or quiz given

    * **Student**: The student who took the test

    * **Date**: The date on which the test was taken

    * **TotalPoints**: The total number of possible points for the test

    * **Grade**: The number of points that the student received

    * **TestFormat**: The format of the test: essay, multiple choice, or choice

    * **Teacher**: The teacher who gave the test

    * **Assistant**: The person who is assigned to assist the teacher


    We''ll assume the primary key for this table is a composite primary key consisting
    of the Test and Student columns. Each row in the table is meant to express a grade
    for a specific test and student.


    There are two obvious problems with this table. First, data is unnecessarily duplicated.
    For example, we can see the Pronoun Quiz, given on 2017-03-02, has a total of
    10 points. The problem is that this information must be repeated in every row
    for that quiz. It would be better if we simply view the total points for that
    particular quiz just once.


    A second problem is that data is repeated within certain single cells. In the
    sixth row, the TestFormat is both Multiple Choice and Essay. This scenario exists
    because this test had types of questions to use. If we wanted to retrieve all
    tests with essay questions, how could we do that?'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'More generally, the main problem with this table is that it attempts to put
    all known information into a single table. It would be much better to break down
    the information in this table into separate entities, such as students, grades,
    and teachers, and represent each entity as a separate table. The power of SQL
    can then be used to join tables together as needed to retrieve any desired information.


    With this discussion in mind, let'' normalize what the process of normalization
    hopes to accomplish. There are two main goals:


    +   **Eliminate redundant data.** The previous example clearly illustrates the
    issue of redundant data. Why is this important? What exactly is the process with
    listing the same data on multiple rows? Well, the unnecessary duplication of effort,
    redundancy reduces flexibility. When data is repeated, changes to particular values
    affect multiple rows rather than just one.


    +   **Eliminate insert, delete, and update anomalies.** The problem of redundant
    data also relates to this second goal, which is to eliminate insert, delete, and
    update anomalies. For example, suppose that a teacher marries and changes her
    name. We would like the data to reflect the new name, we must update all rows
    that contain her name. However, because the data is stored redundantly, we must
    update a large amount of data, rather than just one row.


    There are also insert and delete anomalies. For example, let''s say we just hired
    a teacher to teach music. We would like to record this information somewhere in
    the database. Because the teacher hasn''t given any tests, there is no where to
    put this information, because we don''t have a table specific to the entity of
    teachers. Similarly, a delete anomaly would occur if we wanted to delete a row,
    but by doing so would eliminate some related piece of information. To use another
    example, if we had a database of books and wanted to delete a row for a book by
    George Orwell, and if there were the only book for Mr. Orwell in the database,
    then that row deletion eliminate not only the book, but also the fact that George
    Orwell is an author of other books that might be acquired in the future.


    # How to Normalize Data


    What, specifically, does normalization mean?


    The term itself originates with E.F. Codd and refers to a series of recommended
    steps for removing redundancy and updating anomalies from a database design. The
    steps involved in the normalization process are commonly referred to as *first
    normal form, second normal form, third normal form*, and so on. Although some
    individuals have stepped up to a sixth normal form, the usual practice is to go
    through the first, second, and third normal form. When data is in third normal
    form, it is generally understood to be sufficiently normalized.


    We won''t describe the entire set of rules and procedures for converting data
    into first, second, and third normal form. Other texts elaborate on the process
    in great detail, showing how to transform data into first normal form, then into
    second normal form, and finally into third norm.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Chapter 19 Principles of Database Design


    Instead, we''ll summarize the rules for getting data into normal form. In practice,
    an experienced database administrator can jump from unstructured data to third
    normal form without having to follow every intermediate procedure. We''ll do the
    same here.


    The three main rules for normalizing data are as follows:


    +   * **Eliminating repeating data.** This means that no multivalued attributes
    are allowed. In the previous example, we cannot allow a value such as "Multiple
    Choice, Essay" to exist in a single data cell. The existence of multiple values
    in a single cell creates obvious difficulties in retrieving data by any given
    value.

    * A corollary to this rule is that repeated columns are not allowed. In our example,
    the database might have been designed so, that rather than a single column named
    Test, we have two separate columns named Format1 and Format2. With this alternative
    approach, we have placed the value "Multiple Choice" in the Format1 column and
    "Essay" in the Format2 column. This would not be permitted. We don''t want repeated
    data or columns.

    * **Eliminate transitive dependencies.** This rule refers primarily to situations
    in which the primary key for a table is a composite key, meaning a key composed
    of multiple columns. The rule states that no column in a table can be referred
    to only part of the primary key.

    Let''s illustrate this with an example. As mentioned, the primary key in the Grades
    table is a composite key consisting of the Student and Test columns. The problem
    occurs with columns such as TotalPoints. The TotalPoints column is really an attribute
    of the test and has nothing to do with students. This rule mandates that all non-columns
    in a table refer to the entire key and not just a part of the key. Essentially,
    partial dependencies indicate that the data in the table relates to more than
    one entity.

    * **Eliminate transitive dependencies.** This rule refers to situations in which
    a column in the table refers not to the primary key, but to another non-key in
    the same table. In our example, the Assistant column is really an attribute of
    the Teacher column. The fact that the assistant relates to the teacher and not
    to anything in the primary key (the test or the student) indicates that the information
    does not belong in the table.


    We''ve seen the problems and discussed rules for fixing the data, but how proper
    database design changes actually determined? This is in experience we know. And
    there is generally not a single solution to any given problem.


    That said, the following is one solution to this design problem. In this new design,
    several tables have been created from the one original table, and all data is
    in normalized form. Figure 19.1 uses an entity-relationship diagram to show the
    tables in the new design.'
  merge: -1
  img_proc: true
