    | --- | --- |

    | Gary | Cooper |


    # Looking Ahead


    This chapter introduced the topic of how to apply selection criteria to queries.
    A number of basic operators, such as equals and greater than, were introduced.
    The ability to specify these types of basic selection criteria goes a long way
    toward making the SELECT statement truly useful. We also covered the related topic
    of limiting the number of rows returned in a query. The ability to limit rows
    in combination with an ORDER BY clause allows for a useful Top N type of data
    selection.'
