  md: '# Chapter 12 Outer Joins


    With that in mind, let''s look at two examples of the cross join. In this first
    example, we''ll imagine we''re a shirt maker, and we produce shirts in three sizes
    and in four colors. A Size table holds the available sizes and looks like this:


    | SizeID | Size |

    | --- | --- |

    | 1 | Small |

    | 2 | Medium |

    | 3 | Large |


    A ColorInventory table lists the available colors, and includes this data:


    | ColorID | Color |

    | --- | --- |

    | 1 | Red |

    | 2 | Blue |

    | 3 | Green |

    | 4 | Yellow |


    We want to determine all of the possible combinations of shirt sizes and colors
    that can be produced. This can be accomplished by the following SELECT statement,
    using a cross join:


    ```

    SELECT

    Size,

    Color

    FROM SizeInventory

    CROSS JOIN ColorInventory

    ```


    The resulting output is:


    | Size | Color |

    | --- | --- |

    | Small | Red |

    | Small | Blue |

    | Small | Green |

    | Small | Yellow |

    | Medium | Red |

    | Medium | Blue |

    | Medium | Green |

    | Medium | Yellow |

    | Large | Red |

    | Large | Blue |

    | Large | Green |

    | Large | Yellow |'
