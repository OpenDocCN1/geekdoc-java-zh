- pgno: 134
  md: '# The Inner Join


    We are now ready to present a SELECT statement with what is called an inner join:


    ```

    SELECT *

    FROM Customers

    INNER JOIN Orders

    ON Customers.CustomerID = Orders.CustomerID

    ```


    Let''s examine this line by line. The SELECT keyword on the first line merely
    states that we want all (*) columns from both tables. The second line, with the
    FROM clause, indicates that the first table we want to specify is the Customers.
    The third line introduces the new INNER JOIN keyword. This keyword is used to
    specify an additional table that we want to include in our query. In this case,
    we want to add the Orders table.


    Finally, the fourth line introduces the ON keyword. This works in conjunction
    with the INNER JOIN and specifies exactly how the two tables are to be joined.
    In this case, we are connecting the Customers table (Customers.CustomerID) to
    the Orders table (Orders.CustomerID). Because the CustomerID column has the same
    name in both the Customers and Orders table, we need to specify the table name
    as a prefix to the CustomerID column. The prefix allows us to distinguish between
    these columns in two separate tables.


    The preceding SELECT statement produces this data:


    | CustomerID | FirstName | LastName | CustomerID | OrderDate | OrderAmount |

    |---|---|---|---|---|--|

    | 1 | Sara | Davis | 1 | 2016-09-01 | 10.00 |

    | 2 | Rumi | Shah | 2 | 2016-09-02 | 12.50 |

    | 2 | Rumi | Shah | 3 | 2016-09-03 | 18.00 |

    | 3 | Paul | Johnson | 4 | 2016-09-15 | 20.00 |


    Let''s analyze the results. Both the Customers table and the Orders table have
    four rows. Looking at the OrderID column, we can tell that we have data from all
    rows from the Orders table. However, we notice that only three customers are shown.
    Why is that? The answer is that the customer with a CustomerID of 4 doesn''t exist
    in the Orders table. Because we''re joining the two tables together the CustomerID
    field of 4 in the Customers table is not shown.


    This brings us to an important observation: An inner join only returns data for
    where there is a match between tables being joined. In the next chapter, we''ll
    talk about an alternative method of joining tables that will allow the customer
    information for the Customers of 4 to be shown, even if there are no orders for
    customer.


    Here''s a second important observation: Notice that the data for Rumi Shah is
    repeated twice. She existed only in the Customers table, so one might wonder why
    she appears on two rows. The answer is that the INNER JOIN allows all matches
    to be shown. Because Rumi has two rows in the Orders table, both of these rows
    match her row in the Customers table, resulting in her customer information being
    displayed twice.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Finally, you may be wondering why this join is referred to an inner join. There
    are, in fact, two main variations of the join: the inner join and the outer join.
    Outer joins will be covered in the next chapter.


    # # Table Order in Inner Joins


    An join brings back data where there is a match between the two specified tables.
    In the previous SELECT, we specified the Customers table in the FROM clause and
    the Orders table in the INNER JOIN clause. We may ask whether it matters which
    table is specified first. As it turns out, for inner joins, the order in which
    the tables are listed can be reversed with no difference in the results. The following
    two SELECT statements are logically identical and the same data:


    ```

    SELECT *

    FROM Customers

    INNER JOIN Orders

    ON Customers.CustomerID = Orders.CustomerID


    SELECT *

    FROM Orders

    INNER JOIN Customers

    ON Orders.CustomerID = Customers.CustomerID

    ```


    The only difference is that the first statement would display columns from the
    Customers table first and the Orders table second. The second statement would
    display columns from the Orders table first and the Customers table second. Despite
    the order of the columns, both results remained identical.


    Remember that SQL is not a procedural language. It doesn''t specify how a task
    is to be completed. SQL only specifies the desired logic, and leaves it to the
    internals of the database to decide exactly how to perform the required task.
    As such, SQL doesn''t determine how the database physically retrieves data. It
    doesn''t define which table to physically look at. Instead, the database software
    determines the optimal method of obtaining the data.


    # # An Alternate Specification of Inner Joins


    In the previous examples, we used the INNER JOIN and ON keys to specify inner
    joins. It is also possible to specify inner joins with just the FROM and WHERE
    clauses. We have already seen this statement that joins the Customers and Orders
    tables:


    ```

    SELECT *

    FROM Customers

    INNER JOIN Orders

    ON Customers.CustomerID = Orders.CustomerID

    ```


    An alternate way of specifying the same inner join without the INNER JOIN and
    ON keywords is:


    ```

    SELECT *

    FROM Customers, Orders

    WHERE Customers.CustomerID = Orders.CustomerID

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'In this alternate specification, rather than using the INNER JOIN keyword to
    define the new table to join to, we list all tables joined to the FROM clause.
    Instead of the ON clause to say how the tables are related, we use the WHERE clause
    to specify the relationship between the tables.


    Even though this alternate format works perfectly and produces the same results,
    we don''t recommend using it. The advantage of the INNER JOIN and ON keywords
    is that they explicitly present the logic of join. That is their only purpose.
    Although it is possible to specify the relationship in a WHERE clause, the meaning
    of the SQL statement is less obvious when the WHERE clause is used for selection
    criteria and also to indicate relationships between multiple tables.


    # Table Aliases Revisited


    Let''s now look at the columns that were returned from the previous SELECT statement.
    Because we specified all (*) columns, we see all columns from both tables. The
    CustomerID column appears twice because column exists in both tables. In practice,
    we would not want this data. Here''s an alternate version of the SELECT, which
    now specifies the columns we want to see. In this variant, we employ aliases,
    C for Customers and O for Orders, which placed immediately after the FROM and
    INNER JOIN keywords by inserting the AS keyword.


    ```

    SELECT

    C.CustomerID AS ''Cust ID'',

    C.FirstName AS ''First Name'',

    C.LastName AS ''Last Name'',

    O.OrderID AS ''Order ID'',

    O.OrderDate AS ''date'',

    O.Amount AS ''Account''

    FROM Customers AS C

    INNER JOIN Orders AS O

    ON C.CustomerID = O.CustomerID

    ```


    The results are:


    | Cust ID | First Name | Last Name | Order ID | Date | Amount |

    |---|---|---|---|---|---||

    | 1 | Sara | Davis | 1 | 2016-09-01 | 10.00 |

    | 2 | Rumi | Shah | 2 | 2016-09-02 | 12.50 |

    | 3 | Rumi | Shah | 3 | 2016-09-03 | 18.00 |

    | 4 | Paul | Johnson | 4 | 2016-09-15 | 20.00 |


    In this statement, we are displaying the CustomerID from the Customers table,
    and not from the Orders table. Also notice we are using the AS keyword to specify
    both column and table aliases. Note that the AS keyword is completely optional.
    All of the AS keywords can be removed from this SELECT, and the statement would
    still be valid and return the same results. However, we recommend using the AS
    keywords for the sake of clarity.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Database Differences: Oracle


    As mentioned in Chapter 3, "Calculated Fields and Alias," table aliases are specified
    in Oracle without the AS keyword. The syntax for the equivalent statement in Oracle
    is:


    ```

    SELECT

    C.CustomerID AS "Cust ID",

    .FirstName AS "First Name",

    .LastName AS "Last Name",

    .OrderID AS "Order ID",

    .OrderDate AS "Date",

    .OrderAmount AS "Amount"

    FROM Customers C

    INNER JOIN Orders O

    ON C.CustomerID = O.CustomerID;

    ```


    Although we see the AS keyword used for column aliases, the AS keyword is not
    used for table aliases in Oracle.


    # Looking Ahead


    The ability to join tables in a query is an essential feature of SQL. Relational
    databases would be of little use without joins. This chapter focused on the formulation
    of the inner join. The inner join brings back data for which there is a match
    between both tables being joined. We also talked about an alternate way of specifying
    the inner join, and the usefulness of using table aliases.


    In our next chapter, we will turn to another important type of join: the outer
    join. As mentioned, inner joins only allow us to view data where there is a match
    between the tables being joined. So, if you have a customer with no orders, you
    won''t see any customer information when doing an inner join between a Customers
    table and an Orders table. The outer join will allow you to view customer information,
    even if there are no orders for the customer. In other words, the outer join lets
    see data that we would not otherwise be able to obtain with an inner join. Additionally,
    the next chapter will begin introducing scenarios in which more than two tables
    are joined.'
  merge: -1
