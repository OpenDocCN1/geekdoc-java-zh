  md: '# Testing for NULL Values


    Just as inner joins, data from one table can be repeated if there is more than
    one

    matching row between that table and the table to which it is joined. In this example,
    we have

    more than one order for Rumi Shah, so the customer information for Rumi Shah is
    repeated on

    two separate lines.


    Finally, we included an ORDER BY clause. This was done merely to present the data
    in an\understandable order.


    In the previous SELECT, we had one customer with no orders and two orders with
    no

    associated refunds. Unlike the INNER JOIN, the LEFT JOIN allows these rows with
    missing

    values to appear.


    To test our understanding of the LEFT JOIN, let''s now look at how we would list
    only those

    orders for no refund was issued. The solution involves adding a WHERE clause that
    tests\for NULL values, as follows:


    ```

    SELECT

    Customers.FirstName AS ''First Name''

    Customers.LastName AS ''Last Name''

    Orders.OrderDate AS ''Order Date''

    Orders.OrderAmount AS ''Order Amt''

    FROM Customers

    LEFT JOIN Orders

    ON Customers.CustomerID = Orders.CustomerID

    LEFT JOIN Refunds

    ON Orders.OrderID = Refunds.OrderID

    WHERE Orders.OrderID IS NOT NULL

    AND Refunds.RefundID IS NOT NULL

    ORDER BY Customers.LastName, Customers.FirstName, Orders.OrderDate

    ```


    The resulting data is:


    | First Name | Last Name | Order Date | Order Amt |

    |---|---|---|---||

    | Paul | Johnson | 2016-09-15 | 20.00 |

    | Rumi | Shah | 2016-09-02 | 12.50 |


    The WHERE clause first tests Orders.OrderID to make sure that it isn''t NULL.
    Doing so ensures

    t don''t see customers who never placed an order. The second line of the WHERE
    clause

    tests Refunds.RefundID to make sure that it is NULL. This guarantees that we only
    see orders

    that don''t have a matching refund.


    Notice that we didn''t bother to display the Refund Date or Refund Amount columns
    in the

    SELECT. This is because we know those columns would always have NULL values, based
    on our

    selection criteria.'
