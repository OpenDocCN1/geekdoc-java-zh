- pgno: 89
  md: '# 8


    # # Conditional Logic


    Keywords Introduced


    +   - CASE WHEN THEN ELSE ELSE END


    The main topic of this chapter is conditional logic. This term refers to an ability
    to infuse logic into the values that appear in specific columns in a columnlist
    or other expressions in a SQL statement. Based on how the logic is evaluated when
    the SQL statement is executed, various values can appear for a column. Thus, values
    that appear are conditional on the specified logic. Specifically, conditional
    logic is indicated by an expression that begins with the CASE keyword. This is
    often referred to as a CASE expression. In essence, CASE expressions allow you
    to alter the output presented to a user, based on logical conditions, as applied
    to an evaluation of specific columns or data elements. The use of the word CASE
    has nothing to do with uppercase or lowercase. It''s used in the sense of specifying
    a particular case, or a set of logic, in a conditional way.


    As beginning SQL developer, you should be aware that the CASE expression is a
    relatively advanced concept. You can get by without ever using CASE expressions
    and write some very useful queries. Nevertheless, the ability to understand and
    use conditional logic can transform rudimentary queries into a bit more sublime.
    As, this is one of those topics that might merit an analytical review if you''ve
    gone through the entire book, as a reminder of the interesting things can be accomplished
    with this technique.


    # # The CASE Expression


    The CASE expression in SQL allows to be applied to a single element in a columnlist
    or expression. As indicated in Chapter 2, the full format of the SELECT statement
    is:


    ```

    SELECT columnlist

    FROM tablelist

    WHERE condition

    GROUP BY columnlist

    HAVING condition

    ORDER BY columnlist

    ```'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Chapter 8 Conditional Logic


    The CASE expression can appear in several areas of the SELECT statement. It can
    appear in the columnist immediately after the SELECT keyword or in the GROUP BY
    or ORDER BY clauses. It can also appear as an element in a condition of the WHERE
    or HAVING clauses. In this chapter, we''ll begin illustrating the use of the CASE
    expression in a SELECT columnist. This is its most typical use. We''ll follow
    up by showing how it can be used in the WHERE and ORDER BY clauses.


    The CASE expression replaces any individual column in a columnist or an expression
    referenced in a condition in the WHERE or HAVING clauses. Focusing on its use
    in a columnist, a statement that includes both columns and a CASE expression might
    look like this:


    ```

    SELECT

    column1,

    column2,

    CaseExpression

    FROM table

    ```


    The CASE expression itself contains logic embedded in a traditional IF-THEN-ELSE
    structure. The term IF-THEN-ELSE refers to a commonly used logical construct employed
    by procedural languages. In general terms, this type of logic looks like:


    ```

    IF some condition

    THEN we do

    ELSE do

    ```


    The condition expressed in the IF-THEN-ELSE can contain the full range of Boolean
    logic discussed in the previous chapter. Thus, the expression can include the
    AND, OR, NOT, BETWEEN, and IN operators, as well as parentheses.


    # The Simple CASE Format


    There are two basic formats for the CASE expression, generally referred to as
    the simple and the searched. The simple format is:


    ```

    CASE ColumnExpression

    WHEN value1 THEN result1

    WHEN value2 THEN result2

    (repeat WHEN-THEN any number of times)

    ELSE DefaultResult

    END

    ```


    As you can see, this CASE expression uses a number of keywords besides CASE; it
    also includes WHEN, THEN, ELSE, and END. These additional keywords are needed
    to fully define the logic of the CASE expression. The WHEN and THEN keywords define
    a condition that is evaluated. If the value after WHEN is true, then the result
    after THEN is used. The WHEN and THEN can be repeated any number of times. Where
    there is a WHEN, there must be a corresponding THEN. The ELSE keyword is used
    to define a default value to be used if none of the WHEN-THEN conditions are true.
    As indicated by the brackets, the ELSE keyword is not required. However, it is
    usually a good idea to include the ELSE keyword in every CASE expression to explicitly
    state a default value. The END keyword terminates the CASE expression.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Let''s look at a specific example, using this Groceries table:


    | GroceryID | CategoryCode | Description |

    |---|---|--|

    | 1 | F | Apple |

    | 2 | F | Orange |

    | 3 | S | Mustard |

    | 4 | V | Carrot |

    | 5 | B | Water |


    In this data, the CategoryCode column is meant to have these meanings: F is fruit,
    S is spice, V is vegetable, and B is beverage. A SELECT with a CASE expression
    for data in this table might look like this:


    ```

    SELECT

    CASE CategoryCode

    WHEN ''F'' THEN ''Fruit''

    WHEN ''V'' THEN ''Vegetable''

    ELSE As ''Category'',

    Description

    FROM Groceries

    ```


    and produces this output:


    | Category | Description |

    |---|--|

    | Fruit | Apple |

    | Fruit | Orange |

    | Other | Mustard |

    | Vegetable | Carrot |

    |Other | Water |


    Let''s explain the SELECT statement in detail. The first line contains the SELECT
    keyword. The second line, with the CASE keyword, specifies that the CategoryCode
    column is to be analyzed. The third line introduces the WHEN-THEN condition. This
    line says that if the CategoryCode equals F, then "Fruit" will be displayed. The
    next line says that if the CategoryCode is V, then "Vegetable" will be displayed.
    The ELSE line provides a default value of "Other" to use if the Category is not
    F or V. In other words, if the category is not Fruit or Vegetable, it can be classified
    as "Other". The END line terminates the CASE expression and also includes an AS
    keyword to assign a column alias. The next line, Description, is another column
    and has nothing to do with the CASE expression.


    As seen, the CASE expression is very useful for translating values into meaningful
    descriptions. In this example, the CategoryCode column in the Groceries table
    contains only a single character code to indicate the type of product. The CASE
    expression allows us to specify the translation.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# The Searched CASE Format


    The general format for the searched CASE expression is:


    ```

    CASE

    WHEN condition1 THEN result1

    WHEN condition2 THEN result2

    (repeat WHEN-THEN any number of times)

    [ELSE DefaultResult]

    END

    ```


    The equivalent of the preceding SELECT statement using this format is:


    ```

    SELECT

    CASE

    WHEN CategoryCode = ''F'' THEN ''Fruit''

    WHEN CategoryCode = ''V'' THEN ''Vegetable''

    ELSE Other

    END AS ''Category'',

    Description

    FROM Groceries

    ```


    The data retrieved from this statement is identical to the first simple CASE notice.
    Note the subtle differences, however, the column name is placed after the CASE
    keyword, and the expression following the WHEN is a simple literal value. In the
    searched format, a column name is not placed next to the CASE keyword. Instead,
    this format allows for a more complex conditional expression to be specified following
    the WHEN keyword.


    In the previous example, either format of the CASE can be used and will produce
    the same result. Let''s now at another example for which only the searched CASE
    format yields the desired result. Let''s look at another example from this data:


    | GroceryID | Fruit | Vegetable | Spice | Beverage | Description |

    | 1 | X | | | | Apple |

    | 2 | X | | | | Orange |

    | 3 | | | X | | Mustard |

    | 4 | | X | | | Carrot |

    | 5 | | | | X | Water |


    In this situation, rather than containing a single CategoryCode column, the table
    has multiple columns to indicate the type of product. For example, a value of
    X in the Fruit column is used to indicate that the product is a fruit. As such,
    it would be impossible to use the simple format of the CASE expression to evaluate
    this data. The simple format works only with an analysis of a single column. Using
    the searched format, a CASE expression that handles this type of data is:'
  merge: -1
  img_proc: true
- pgno: 93
  md: '```

    SELECT

    CASE

    WHEN Fruit = ''X'' THEN ''Fruit''

    WHEN Vegetable = ''X'' THEN ''Vegetable''

    ELSE ''Other''

    END AS ''Category'',

    Description

    FROM GroceryCategories

    ```


    Once again, the result is:


    | Category | Description |

    | --- | --- |

    | Fruit | Apple |

    | Fruit | Orange |

    | Other | Mustard |

    | Vegetable | Carrot |

    | Other | Water |


    We have been able to use the searched format of the CASE expression to evaluate
    data in multiple columns to produce a single result.


    The CASE expression can be employed in many situations in the columnlist of a
    SELECT statement. Another common example of the usefulness of the CASE expression
    is in situations involving division by zero. When formulating a calculation that
    has the possibility of division by zero, you must be careful to provide some alternative
    when the denominator equals zero. Like all other computer languages, SQL produces
    an error when division by zero is attempted. To resolve this issue, a CASE expression
    can be used, as in this general example:


    ```

    SELECT

    CASE

    WHEN Denominator = 0 THEN 0

    ELSE Numerator / Denominator

    END

    FROM table

    ```


    In this example, we''re testing the denominator value to see if it equals zero.
    If it does, the result of the calculation is set to zero. If not, the normal calculation
    is allowed to proceed. Thus, if the denominator in the calculation happens to
    have a value of zero, we''ll bypass the “divide by zero” error that would otherwise
    ensue.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '78 Chapter 8 Conditional Logic


    # Conditional Logic in ORDER BY Clauses


    As mentioned at the beginning of this chapter, the CASE expression can be used
    in numerous places in the SELECT statement. To illustrate its use in the ORDER
    BY clause, let''s imagine that we have a table with cities from the US and Canada.
    In this scenario, we have separate columns for US States and Canadian Provinces.
    This data might appear as the following:


    | CityID | Country | State | Province | City |

    | --- | --- | --- | --- | --- |

    | 1 | US | VT | | Burlington |

    | 2 | CA | | QU | Montreal |

    | 3 | US | | CO | Denver |

    | 4 | US | | CO | Boulder |

    | 5 | CA | | AB | Edmonton |


    The goal of this example is to sort data by country, and then by either state
    or province. A statement that accomplishes this is:


    ```

    SELECT *

    FROM NorthAmerica

    ORDER BY

    Country,

    WHEN ''US'' THEN State

    WHEN ''CA'' THEN Province

    ELSE State


    City

    ```


    The output from this statement is:


    | CityID | Country | State | Province | City |

    | --- | --- | --- | --- | --- |

    | 5 | CA | | AB | Edmonton |

    | 2 | CA | | QU | Montreal |

    | 4 | US | | CO | Boulder |

    | 3 | US | | CO | Denver |

    | 1 | US | | VT | Burlington |


    The CASE expression evaluates the Country column to determine whether it''s US
    or CA. If it''s US data, then it uses the State column for the sort. If Canada,
    it uses Province. The result is that this statement sorts by country, then by
    state or province, and finally by city.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Conditional Logic in WHERE Clauses


    Just as the CASE expression can be placed within a columnlist, it can also be
    placed within an expression. In this example, we''ll assume that we have customer
    data such as the following:


    | CustomerID | Sex | Age | Income |

    |---|---|---|--|

    | 1 | M | 55 | 80000 |

    | 2 | F | 25 | 65000 |

    | 3 | M | 35 | 40000 |

    | 4 | F | 42 | 90000 |

    | 5 | F | 27 | 25000 |


    The goal is to select customers who meet a complex set of demographic and income
    requirements. If they are male and at least 50 years old, they must have an income
    of 75000 to qualify. If they are female and at least 35, they must have an income
    of 60000 to qualify. All other people must have income of at least 50000 to qualify.
    The following is a statement that specifies these criteria by using a CASE statement:


    ```

    SELECT *

    FROM CustomerList

    WHERE Income >

    CASE

    WHEN Sex = ''M'' AND Age >= 50 THEN 75000

    WHEN Sex = ''F'' AND Age >= 35 THEN 60000

    ELSE 50000

    END

    ```


    Note that the CASE expression replaced just one part of the condition expressed
    in the WHERE clause. In general form, the WHERE clause is:


    ```

    WHERE Income > CASE_Expression

    ```


    The CASE expression provides the value that is compared to Income in the selection
    logic. When this statement is executed, the data retrieved is:


    | CustomerID | Sex | Age | Income |

    |---|---|---|--|

    | 1 | M | 55 | 80000 |

    | 2 | F | 25 | 65000 |

    | 4 | F | 42 | 90000 |'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Looking Ahead


    The CASE expression is a powerful tool that allows you to infuse logic into various
    elements in a SQL statement. In this chapter, we saw the CASE expression used
    in the SELECT column, and also in the ORDER BY and WHERE clauses. In future chapters,
    we''ll illustrate the use of the CASE expression in other areas, such as the GROUP
    BY and HAVING clauses.


    There are two basic variations of the CASE expression: the simple and the searched.
    A typical use of the simple variation is to provide translations for data items
    with cryptic values. The searched format allows for more complex statements of
    logic.


    In our next chapter, "Summarizing Data," we''ll turn our attention to methods
    of separating data into groups and summarizing the values in those groups with
    various statistics. Back in Chapter 4, "Using Functions," we talked about scalar
    functions. The next chapter will introduce another type of function in many useful
    ways, called aggregate functions. For example, we''ll be able to look at any group
    of orders and determine the number of orders, the total dollar amount of the orders,
    and the average order size. These techniques will allow you to move beyond the
    presentation of detailed data and begin to truly add value for your users as you
    deliver summarized information.'
