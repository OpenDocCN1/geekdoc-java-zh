- pgno: 111
  md: '# Ranking Functions


    The Rank_Function can be any of the functions mentioned previously. The keyword
    OVER is required. Its purpose is to designate how the rank function is to be expressed.
    expression in the parentheses indicates the column or expression on which the
    ranking is to be applied. The ORDER BY keyword indicates that this expression
    is evaluated, in an ascending or descending order. If the order is to be ascending,
    the ASC keyword is not necessary.


    In our example, we are assigning a row number to an evaluation of the PriceEarningsRatio
    count. The values PriceEarningsRatio are evaluated in an ascending order. The
    first row, for Craft Goods, is given a row number of 1 because it is first in
    the sequence. Note that the ROW_NUMBER function only assigns the row number ORDER
    BY clause in the SELECT statement to actually display the output in the desired
    sequence.


    To illustrate the use of RANK and DENSE_RANK functions, we''ll add columns to
    the previous statement. We won''t bother to display the stock name or exchange.
    The new statement is:


    ```

    SELECT

    ROW_NUMBER() OVER (ORDER BY PriceEarningsRatio) AS ''Row'',

    RANK() OVER (ORDER BY PriceEarningsRatio) AS ''Rank'',

    DENSE_RANK() OVER (ORDER BY PriceEarningsRatio) AS ''Dense Rank'',

    StockSymbol AS ''Symbol'',

    PriceEarningsRatio AS ''PE Ratio''

    FROM Stock

    ORDER BY PriceEarningsRatio

    ```


    The output is:


    | Row | Rank | Symbol | PE Ratio |

    | 1 | 1 | KRFT | 12 |

    | 2 | 2 | AAPL | 14 |

    | 3 | 3 | MSFT | 15 |

    | 4 | 3 | WMT | 15 |

    | 5 | 4 | ORCL | 17 |

    | 6 | 5 | GE | 18 |

    | 7 | 6 | MCD | 18 |

    | 8 | 6 | MMM | 20 |

    | 9 | 7 | DIS | 21 |

    | 10 | 7 | KO | 21 |

    | 11 | 8 | WBA | 24 |

    | 12 | 9 | HSY | 26 |

    | 13 | 10 | GOOG | 30 |

    | 14 | 11 | SBUX | 357 |

    | 15 | 12 | AMZN | 489 |


    In this example, MSFT and WMT have the same PE. As a result, the difference is
    in the values assigned to subsequent rows. For RANK, the next row after MSFT and
    WMT, ORCL, skips a number and is given a value of 5. For DENSE_RANK, no numbers
    are skipped, and ORCL is given a value of 4.'
