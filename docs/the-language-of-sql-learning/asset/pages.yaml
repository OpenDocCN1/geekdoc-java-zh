  md: '# Chapter 13 Self Joins and Views


    isn''t a trivial matter to reorganize the tables to meet new requirements. The
    great advantage of views is that they allow the analyst to create new virtual
    views of the data already in a database. Views allow you to create the equivalent
    of new tables without having to physically rearrange data. As such, views add
    a dynamic element to a database by keeping it fresh up to date.


    SQL provides the CREATE VIEW keyword to enable users to create new views. The
    general syntax is as follows:


    ```

    CREATE VIEW ViewName AS

    SelectStatement

    ```


    After the view is created, the ViewName is used to reference the data that would
    be returned from the SelectStatement in the view. Here''s an example. In the previous
    chapter, we looked at this SELECT statement:


    ```

    SELECT

    Customers.FirstName AS ''First Name''

    Customers.LastName AS ''Last Name''

    Orders.OrderDetail AS ''Order Date''

    Orders.OrderAmount AS ''Order Amt''

    Refunds.RefundDate AS ''Refund Date''

    Refunds.RefundAmount AS ''Refund Amt''

    FROM Customers

    LEFT JOIN Orders

    ON Customers.CustomerID = Orders.CustomerID

    LEFT JOIN Refunds

    ON Orders.OrderID = Refunds.OrderID

    ORDER BY Customers.LastName, Customers.FirstName, Orders.OrderDate

    ```


