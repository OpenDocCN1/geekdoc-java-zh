- pgno: 80
  md: '# Chapter 7 Boolean Logic


    We see two rows instead of the expected one. What went wrong? The answer lies
    in how SQL interprets the WHERE clause, which happens to contain both AND and
    OR operators. Like other computer languages, SQL has a predetermined order of
    evaluation that specifies the order in which various operators are evaluated.
    Unless told otherwise, SQL always processes the AND operator before the OR operator.
    So, in the previous statement, it first looks at the AND and evaluates the conditions:


    ```

    State = ''CA''

    AND QuantityPurchased > 8

    ```


    The row that satisfies condition is for Carol White. SQL then evaluates the OR
    operator, which allows for rows where the State equals IL. That adds the row for
    Andrew IL. The result is that SQL determines both the Andrew IL and the Carol
    White meets the condition.


    Obviously, this isn''t what was intended. This type of problem often comes up
    when AND and OR operators are combined in a single WHERE clause. To resolve the
    ambiguity is to use parentheses to specify the desired order of evaluation. Anything
    in parentheses is always evaluated.


    Here''s how parentheses can be added to the previous SELECT to correct the situation:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE (State = ''IL''

    OR State = ''CA'')

    AND QuantityPurchased > 8

    ```


    When this is executed, we see this data:


    | CustomerName | State | QuantityPurchased |

    | Carol White | CA | 10 |


    The parentheses in the SELECT statement force the OR expression (State = ''IL''
    OR State = ''CA'') to be evaluated first. This produces the intended result.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Multiple Sets of Parentheses


    Let''s say we want select two different sets of rows from the Purchases table:
    first, rows for customers in New York, and second, rows for customers in Illinois
    who have made a purchase with a quantity between 3 and 10. The following SELECT
    accomplishes this requirement:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE State = ''NY''

    OR (State = ''IL'')

    AND (QuantityPurchased >= 3)

    AND QuantityPurchased <= 10))

    ```


    The result is:


    | CustomerName | State | QuantityPurchased |

    |---|---|---|

    | Andrew Li | IL | 4 |

    | James Carpenter | NY | 5 |


    Note that there are two sets of parentheses in this statement, with one inside
    the other. This use of parentheses is analogous to the parentheses used in the
    composite functions seen in Chapter 4. When there is more than one set of parentheses,
    the innermost set of functions is always evaluated first. The same is true of
    used in Boolean expressions. In this example, the innermost set of parentheses
    contains:


    ```

    (QuantityPurchased >= 3

    AND QuantityPurchased <= 10)

    ```


    After this condition is evaluated for each row, the logic proceeds outward to
    the second set of parentheses:


    ```

    (State = ''IL''

    AND (QuantityPurchased >= 3)

    AND QuantityPurchased <= 10))

    ```


    Finally, the logic in the final line of the WHERE clause (not enclosed in any
    parentheses) regarding the state of New York:


    ```

    WHERE State = ''NY''

    OR (State = ''IL''

    AND (QuantityPurchased >= 3)

    AND QuantityPurchased <= 10)

    ```


    In essence, SQL''s first evaluated expressions in the innermost set of parentheses,
    then the outer set of parentheses, and then all remaining expressions.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '66 Chapter 7 Boolean Logic


    # # The NOT Operator


    In addition to the AND and OR operators, the NOT operator is often useful for
    expressing a complex logical condition. The NOT expresses a negation, or opposite,
    of whatever follows the NOT. Here''s a simple example:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE State = ''NY''

    ```


    The result is:


    | CustomerName | State | QuantityPurchased |

    | Andrew Li | IL | 4 |

    | Carol White | CA | 10 |


    This specifies a selection of rows for which the state is not equal to NY. In
    this simple case, the NOT operator is not necessary. The logic of the previous
    statement can also be accomplished via the following equivalent statement:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE State <> ''NY''

    ```


    Here, the not equals operator (<>) accomplishes the same thing as the NOT operator.
    Here''s a more complex example with the NOT operator:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE NOT (State = ''IL''

    OR State = ''NY'')

    ```


    The result is:


    | CustomerName | State | QuantityPurchased |

    | Carol White | CA | 10 |


    The NOT operator is used before a set of parentheses, it negates everything in
    the parentheses. In this example, we''re looking for all rows for which the state
    is not Illinois or New York.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# The NOT Operator 67


    Again, note that the NOT operator is not strictly necessary in this example. The
    logic of the previous query can also be accomplished with the following equivalent
    statement:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE State <> ''IL''

    AND State <> ''NY''

    ```


    It might take a bit of reflection to understand why the preceding statements are
    equivalent. The first statement uses the NOT operator and a logical expression
    with an OR operator. The second statement converts the logic into an expression
    with an AND operator.


    Here’s a final example of how the NOT operator can be used in a complex statement:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE NOT (State = ''IL''

    AND QuantityPurchased > 3)

    ```


    This query is saying to select customers where it’s not true that the state equals
    Illinois and has a QuantityPurchased greater than 3. The NOT operator applies
    to the entire logical expression that state equals Illinois and has a QuantityPurchased
    greater than 3. The result is:


    | CustomerName | State | QuantityPurchased |

    |---|---|---|n| Carol White | CA | 10 |

    | James Carpenter | NY | 5 |


    These rows were selected because the only customer in Illinois who also has a
    QuantityPurchased greater than 3 is Andrew Li. We’re applying a NOT to this entire
    logic, the result is the display of the other two customers.


    Once again, this query can be expressed in an alternate way without using the
    NOT:


    ```

    SELECT

    CustomerName,

    State,

    QuantityPurchased

    FROM Purchases

    WHERE State <> ''IL''

    OR QuantityPurchased <= 3

    ```


    As seen in these examples, it may be logically necessary to use the NOT operator
    in complex expressions with arithmetic operators such as equals (=) or less than
    (<). However, it’s often more straightforward to proceed with a NOT in front of
    a logical expression than attempting to convert that expression into one that
    doesn’t use the NOT. In other words, the NOT operator can provide a convenient
    and useful way of expressing one’s logical thoughts.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# The BETWEEN Operator


    Let''s now turn to two special operators, BETWEEN and IN, that can simplify expressions
    that would ordinarily require the OR or AND operators. The BETWEEN operator allows
    us to abbreviate an AND expression with greater than or equal to (>=) and less
    than or equal to (<=) operators in an expression with a single operator.


    Here''s an example. Let we want to select all rows with a quantity purchased from
    5 to 20. One way of accomplishing this is with the following SELECT statement:


    ```

    SELECT

    CustomerName,

    QuantityPurchased

    FROM Purchases

    WHERE QuantityPurchased >= 5

    AND QuantityPurchased <= 20

    ```


    Using the BETWEEN operator, the equivalent statement is:


    ```

    SELECT

    CustomerName,

    QuantityPurchased

    FROM Purchases

    WHERE QuantityPurchased BETWEEN 5 AND 20

    ```


    In both cases, the SELECT returns this data:


    | CustomerName | QuantityPurchased |

    | Carol White | 10 |

    | James Carpenter | 5 |


    The BETWEEN operator always requires an AND placed between the two numbers. Note
    that the BETWEEN is inclusive of the numbers specified. In this example, BETWEEN
    5 AND 20 includes the numbers 5 and 20. Thus, the BETWEEN is equivalent to the
    greater than or equal to (>=) and less than or equal to (<=) operators. It can''t
    be used to express something greater than (>) or less than) a range of numbers.
    The row for James Carpenter is selected because the quantity purchased is equal
    to 5, and therefore is between 5 and 20.


    The NOT operator can be used in conjunction with BETWEEN. For example, this SELECT:


    ```

    SELECT

    CustomerName,

    QuantityPurchased

    FROM Purchases

    WHERE QuantityPurchased NOT BETWEEN 5 AND 20

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# The IN Operator


    retrieves this data:


    | CustomerName | QuantityPurchased |

    | Andrew Li | 4 |


    # The IN Operator


    Just as BETWEEN represents a special case of the AND operator, the IN operator
    allows for a special case of the OR operator. Let''s say we see rows where the
    state is Illinois or New York. Without the IN operator, this can be accomplished
    with this statement:


    ```

    SELECT

    CustomerName,

    State

    FROM Purchases

    WHERE State = ''IL''

    OR State = ''NY''

    ```


    Here is an equivalent statement using the IN operator:


    ```

    SELECT

    CustomerName,

    State

    FROM Purchases

    WHERE State IN (''IL'', ''NY'')

    ```


    In either case, the data retrieved is:


    | CustomerName | State |

    | Andrew Li | IL |

    | James Carpenter | NY |


    The IN operator requires a subsequent listing of values enclosed within parentheses.
    Commas must be used to separate all values.


    The usefulness of the IN operator may not be obvious in this example, where only
    two states are listed. However, the IN can just easily be used in situations involving
    dozens of specific values. This greatly reduces the amount of typing required
    for such a statement. Another handy use for the IN operator comes in situations
    where values are obtained from an Excel spreadsheet. To obtain multiple values
    from adjacent cells in a spreadsheet for a SQL statement, you merely need to copy
    those values with a comma delimiter. The values can then be pasted inside parentheses
    following the IN operator.'
