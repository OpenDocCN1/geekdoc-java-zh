- pgno: 13
  md: '# Introduction


    SQL, or Structured Query Language, is the primary language used to communicate
    with relational databases. The goal of this book is to serve as a useful introductory
    guide to this essential language.


    In an alternate universe, the title of this book might have been The Logic of
    SQL. This is because, like all computer languages, the language of SQL has much
    more to do with cold logic than with English vocabulary. Nevertheless, the word
    language has been retained in the title for a number of reasons. First, a certain
    language-based syntax in SQL distinguishes it from other languages. Unlike other
    languages, SQL employs many ordinary words, such as WHERE and FROM, as keywords
    in its syntax.


    In the spirit of the language embedded in SQL, we''ve adopted an emphasis on language
    in our sequence of topics. With this book, you''ll learn SQL as you learn English.
    SQL keywords are presented in a logical progression, from simple to more complex.
    In essence, this is an attempt to deal with language and logic simultaneously.


    To learn any language, one must begin by hearing and remembering the actual words
    that form the basis of its utterance. At the same time, those words have a certain
    meaning that must be understood. In the case of SQL, the meaning has a great deal
    to do with logic.


    One final reason for persisting with the title The Language of SQL rather than
    The Logic of SQL is that it simply sounds better. While there can be few literary
    pretentions in a computer-language book, the hope is that the presence of the
    word language will generate some additional enthusiasm for a subject that is,
    after all, quite interesting.


    # Topics and Features


    Even if you''re not familiar with SQL, suffice to say that it is a complex language
    with many components and features. In this book, we''ll focus on one main topic:


    +   - How to use SQL to retrieve data from a database'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Introduction


    To a lesser extent, we will also cover:


    +   * How to update data in a database

    * How to build and maintain databases

    * How to design relational databases

    * Strategies for displaying data after it has been retrieved


    A number of features makes this book unique among introductory SQL books:


    +   * You will not be required to download software or sit with a computer as
    you will read the text.

    * Our intent is to provide examples of SQL usage that can be understood simply
    by reading the book. The text includes small data samples that allow you to clearly
    see how SQL statements work.

    * A language-based approach is employed to enable you to learn SQL as you learn
    English.


    Topics are organized in an intuitive and logical sequence. SQL keywords are introduced
    one at a time, allowing you to build on your prior understanding as you encounter
    new words and concepts.


    +   * This book covers the syntax of three widely used databases: Microsoft SQL
    Server, MySQL, and Oracle.


    If there are any differences between these databases, the Microsoft SQL "Database
    Differences" syntax is shown in the main text. Special "Database Differences"
    show and explain any variations in the syntax for MySQL or Oracle.


    +   * An emphasis is given to relevant aspects of SQL for retrieving data.


    This approach is useful for those who need to use SQL in conjunction with a reporting
    tool. In our final chapter, we will move beyond pure SQL to cover strategies for
    displaying data after it has been retrieved, including how to use crosstab reports
    and pivot tables. In the real world, these types of tools can substantially lessen
    the burden on the SQL server and provide greater flexibility for the end user.


    Note


    Visit our website and register this book at informit.com/register for convenient
    access to downloads, updates, or errata that may be available for this book.


    # What''s New in the Second Edition


    Here are some of the new features of this second edition:


    +   * Coverage of the latest database versions

    All syntax and examples have been taken from the latest versions of the three
    databases covered in this book: Microsoft SQL Server 2016, MySQL 5.7, and Oracle
    12c.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction


    +   - Coverage of subtotals and crostabs

    We added a new chapter on subtotals and crostabs to provide additional possibilities
    for summarizing data. This material allows users to add subtotals and running
    totals to their queries. Additionally, to SQL crosstab queries allows for a greater
    appreciation of the value of pivot tables, which are covered toward towards the
    end of the book.


    +   - Coverage of running functions

    We added new material on running functions. This important class of functions
    permits users to produce row numbers and calculate percentages. A related capability
    is the ability to divide data into partitions prior to the application of running
    functions.


    +   - Expanded coverage of conditional logic

    Our first edition included some basic material on the CASE books and conditional
    logic. This topic is excluded from introductory SQL but nevertheless has tremendous
    practical value for any SQL developer. This second edition adds a number of new
    examples in Chapters 8 and 9 of how the CASE expression can be employed.


    +   - New and more consistent datasets

    As the first edition, each chapter has its own small set of data for examples.
    However, unlike before, this second edition uses a consistent set of datasets
    for all chapters. Customers table referenced in one chapter will be the same as
    a Customers in any other chapter. If you want to load data for testing, you can
    now run a single script to load all data at once. The previous edition required
    separate scripts for each chapter.


    +   - Other improvements

    A few noteworthy topics have been added, including common table expressions and
    comments. Terminology usage has been modified for greater consistency and conformity
    with standard usage. Finally, an overview of the SELECT statement has been added
    early in Chapter 2, to give you a better idea of the topics to come.


    # Plan of the Book


    This book presents its topics in a unique sequence. The majority of SQL books
    run through their topics if you are a database administrator who needs to create
    and design a database from scratch, then learn the database with, and then start
    to retrieve that data. In this book, we start off with data retrieval, and then
    come around database design in the final chapters. This is done as a motivating
    tactic, allowing you to quickly get into interesting topics related to data retrieval
    before dealing with the more arcane subjects of indexes and foreign keys.


    The 20 chapters in the book can be broken down into a number of broad sections:


    +   - Chapter 1 presents introductory material about relational databases that
    is necessary to understand before encountering the SELECT statement.


    +   - Chapters 2 through 5 begin an exploration of the SELECT statement, covering
    the basics of calculations, functions, and sorting.'
  merge: -1
  img_proc: true
