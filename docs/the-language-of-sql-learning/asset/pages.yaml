- pgno: 144
  md: '# Right Joins


    The previous SELECT statements utilized the LEFT JOIN keyword. The good news about
    right joins is that they are identical in concept to the left join. The only difference
    between left and right joins is the order in which the two tables are joined.


    In joins, the primary table is listed to the left of the LEFT JOIN keyword. The
    secondary table, which may or may not contain matching rows, is listed to the
    right of the LEFT JOIN keyword.


    In joins, the primary table is listed to the right of the RIGHT JOIN keyword.
    The secondary table is listed to the left of the RIGHT JOIN keyword. That''s the
    only difference.


    The FROM clause and joins in the previous SELECT statement:


    ```

    FROM Customers

    LEFT Join Orders

    ON Customers.CustomerID = Orders.CustomerID

    LEFT Join Refunds

    ON Orders.OrderID = Refunds.OrderID

    ```


    The equivalent logic, using RIGHT JOIN keywords is:


    ```

    FROM Refunds

    RIGHT Join Orders

    ON Orders.OrderID = Refunds.OrderID

    RIGHT Join Customers

    ON Customers.CustomerID = Orders.CustomerID

    ```


    Note that only the order in which tables are listed before and after the RIGHT
    JOIN matters. The order in columns are listed after the ON keyword has no significance.
    Thus, the above is also equivalent to:


    ```

    FROM Refunds

    RIGHT Join Orders

    ON Orders.OrderID = Refunds.OrderID

    RIGHT Join Customers

    ON Customers.CustomerID = Orders.CustomerID

    ```


    In essence, if you''re comfortable with the LEFT JOIN, it''s completely unnecessary
    to use the RIGHT JOIN keyword. Anything that can be specified with a RIGHT JOIN
    can be stated as a LEFT JOIN. Our suggestion is therefore to stick with the LEFT
    JOIN, because it is usually more intuitive. Because we read from left to right,
    it''s natural to think in terms of listing the more important, or primary, tables
    first.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Table Order in Outer Joins


    We noted previously that the order in which tables are specified in an inner join
    is significant. The same is **not true** of outer joins, because the order in
    which tables are listed in a left or right join is significant. At the same time,
    there is some flexibility in listing the tables in situations where there are
    three or more tables. The order of the LEFT (or RIGHT) JOIN keywords can be swapped
    if desired.


    Let''s look again at the original FROM clause and joins from the previous select:


    ```

    FROM Customers

    LEFT JOIN Orders

    ON Customers.CustomerID = Orders.CustomerID

    LEFT JOIN Refunds

    ON Orders.OrderID = Refunds.OrderID

    ```


    We''ve already seen that the Refunds table can be listed first and the Customers
    table last, as long as everything is converted to right joins, as in:


    ```

    FROM Refunds

    RIGHT JOIN Orders

    ON Orders.OrderID = Refunds.OrderID

    RIGHT JOIN Customers

    ON Customers.CustomerID = Orders.CustomerID

    ```


    Is it possible to list the Customers table first, and then the Refunds table,
    followed by the Orders table? Yes, as long as you''re willing to mix left and
    right joins together and also throw in parentheses. The following is equivalent
    to the above:


    ```

    FROM Customers

    LEFT JOIN (Refunds)

    RIGHT JOIN Orders

    ON Orders.OrderID = Refunds.OrderID

    ON Customers.CustomerID = Orders.CustomerID

    ```


    What was a fairly simple statement has now turned into unnecessarily complex.
    We only show this logic to indicate what **not** to do, and also it''s something
    that you may encounter when writing code. Our advice is to use the LEFT JOIN keyword
    and avoid parentheses when devising FROM clauses with multiple tables.


    # Full Joins


    In addition to left joins and right joins, there is one additional outer join
    type, referred to as the full join. We''ve seen that in left and right joins,
    one table is primary and the other is secondary. Alternatively, you can say that
    one table is required and one is optional, which means that when matching two
    tables, rows in the secondary (or optional) table don''t necessarily to exist.


    In the inner join, both tables are primary (or required). When matching two tables,
    there must be a match between both tables for a row of data to be selected.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Chapter 12 Outer Joins


    In the full join, both tables are secondary (or optional). In this situation,
    if we''re matching rows in Table A and Table B, we then display 1) all rows from
    Table A, even if there is no matching row in Table B, and also 2) all rows from
    Table B, even if there is no matching row in Table A.


    +   Database Differences: MySQL


    Unlike SQL Server and Oracle, MySQL doesn''t allow for a full join.


    Let''s look at an example in which we are matching rows from these two tables.
    First, we have this table:


    | MovieID | MovieTitle | Rating |

    |---|---||

    | 1 | Love Actually | R |

    | 2 | North by Northwest | Not Rated |

    | 3 | Love and Death | PG |

    | 4 | The Truman Show | PG |

    | 5 | Everyone Says I Love | R |

    | 6 | Down with Love | PG-13 |

    | 7 | Finding Nemo | G |


    Second, here''s a Ratings table, with rating descriptions from the Motion Picture
    Association of America MPAA:


    | RatingID | Rating | RatingDescription |

    |---|---||

    | 1 | G | General Audiences |

    | 2 | PG | Parental Guidance Suggested |

    | 3 | PG-13 | Parents Strongly Cautioned |

    | 4 | R | Restricted |

    | 5 | NC-17 | Under 17 Not Admitted |


    The movies table has a list of movies in the database and includes the MPAA rating
    for each movie. The Ratings table has a list of ratings and their descriptions.
    Let''s say we want to find matches between these two tables. We''ll use FULL JOIN
    to show all rows from the Movies table as well as all rows from Ratings. The full
    join will display all rows, even if a match from the other isn''t found. The SELECT
    looks like this:


    ```

    SELECT

    RatingDescription AS ''Rating Description'',

    MovieTitle AS ''Movie''

    FROM Movies

    FULL JOIN Ratings

    ON Movies.Rating = Ratings.Rating

    ORDER BY RatingDescription, MovieTitle

    ```'
