    to import the data into an Excel Table. This will import the data into Tables
    on multiple worksheets. If only one table was selected, the Pivot Table or Pivot
    Chart is often a better choice. Of course, you can always import data into a Table
    and create a Pivot Table or Chart from that Table.


    The problem with this method of importing data is that it doesn''t allow us to
    join data from multiple tables. The ability to combine data from multiple tables
    is easily handled in SQL, but it is not so readily accomplished in Excel. This
    leads to a second possibility, which is to Microsoft Query. When Selecting the
    Microsoft Query option under the Data tab of the Ribbon, we are presented with
