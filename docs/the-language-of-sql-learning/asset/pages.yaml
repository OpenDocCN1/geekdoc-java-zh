- pgno: 216
  md: '# 200 Chapter 20 Strategies for Displaying Data


    Using the PIVOT operator, we created output in this crosstab format:


    | SalesDate | State | Internet | Retail |

    |---|---|---|--|

    | 2017-04-01 | NY | 50 | 30 |

    | 2017-04-01 | VT | 120 | NULL |

    | 2017-04-02 | NY | 520 | 380 |

    | 2017-04-02 | VT | 130 | 90 |


    The key feature of this crosstab layout is the appearance of channel values in
    individual columns. Although data is grouped by SalesDate, State, and Channel,
    we see only combinations of SalesDate and State in the individual. We moved the
    two channel values to their own columns, Internet and Retail.


    This is all fine and good, except that there was an inherent inefficiency in producing
    output in this crosstab format. See in Chapter 10, the SQL statement that produced
    the output was:


    ```

    SELECT * FROM

    (SELECT SalesDate, State, Channel, SalesAmount FROM SalesSummary) AS mainquery

    PIVOT (SUM(SalesAmount) FOR Channel IN ([Internet], [Retail])) AS pivotquery

    ORDER BY SalesDate

    ```


    Notice that in this SQL statement we needed to specify the Channel values, Internet
    and Retail, In other words we were required to know in advance all the possible
    values for the channels and put them in our statement that columns could be created.
    For a practical matter, this is a cumbersome solution. In this simple example,
    with only two channel values, it doesn''t seem so difficult. But in the real world,
    we might easily run into situations where we might have potential values for columns,
    and we wouldn''t know in advance what those values.


    For this reason, the PIVOT keyword is seldom in practice. A much simpler and more
    powerful solution is to use reporting software to automatically generate reports
    in a crosstab format. The majority of reporting tools provide some sort of crosstab
    functionality. In Microsoft Excel, this is accomplished with pivot tables. Other
    tools offer similar capabilities but different names. For example, Microsoft Services
    provides a Matrix Report that allows you to lay out data in a crosstab format.
    In SAP Reports, the crosstab report type is called a Cross-Tab.


    Interestingly, the report layout in reporting tools as Reporting Services is independent
    of the underlying query used to retrieve data. For example, in Reporting Services,
    you can start with a simple query without a GROUP clause and parse that query
    in a Table Report or a Matrix Report. If placed in a Table Report, the output
    will be a list of data. If placed in a Matrix Report, the data can be organized
    into rows and columns, and then the report will automatically perform all grouping
    and generate any needed columns.


    # Excel and External Data


    In this chapter, we''ll focus on Excel pivot tables, as this software is widely
    available and produces results similar to Reporting Services and other specialized
    tools.'
