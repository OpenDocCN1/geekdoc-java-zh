- pgno: 102
  md: '# Grouping Data


    The previous examples of aggregation functions are interesting but of somewhat
    limited value. The real power of aggregation functions will become evident after
    we introduce the concept of grouping data.


    The GROUP BY keyword is used to separate the data returned from a SELECT statement
    into any number of groups. For example, when looking at the Grades table, we may
    be interested in analyzing test scores on the grade type. In other words, we want
    to separate the data into two groups: quizzes and homework. The value of the GradeType
    column can be used to determine the group to which each row belongs. Once this
    data has been separated into groups, aggregation functions can be used so that
    summary statistics for each of the groups can be calculated and computed.


    Let''s proceed with an example that introduces the GROUP BY keyword:


    ```

    SELECT

    GradeType AS ''Grade Type''

    AVG (Grade) AS ''Average Grade''

    FROM Grades

    GROUP BY GradeType

    ORDER BY GradeType

    ```


    The result of this statement is:


    | Grade Type | Average Grade |

    | --- | --- |

    | Homework | 86 |

    | Quiz | 77 |


    In this example, the GROUP BY keyword specifies that groups are to be created
    based on the value of the GradeType column. The two columns in the SELECT list
    are GradeType and a calculated field that uses the AVG function. The GradeType
    column was included in the columnist when creating a group, it''s usually a good
    idea to include the column on which the groups are based. The “Average Grade”
    field aggregates values based on the rows in each group.


    Notice that the average homework grade has been computed as 86. As before, even
    though there is one row with a NULL value for the Homework GradeType, SQL is smart
    enough to ignore rows with NULL values when computing an average. If we wanted
    it to be counted as 0, then the ISNULL function could be used to convert the NULL
    to a 0, as follows:


    ```

    AVG(ISNULL(Grade, 0)) AS ''Average Grade''

    ```


    It''s important to note that when using a GROUP BY keyword, all columns in the
    columnist must either be listed as columns in the GROUP BY clause, else be used
    in an aggregation'
  merge: -1
  img_proc: true
