  md: '# 18


    # Maintaining Tables


    Keywords Introduced


    CREATE TABLE · DROP TABLE · CREATE INDEX · DROP INDEX


    With this chapter, we change our focus from data retrieval and modification to
    design. Up until now, we''ve assumed that tables simply exist and are available
    to any interested user. However, in the normal course of events, someone must
    create tables before the data in them can be accessed. We now turn to the question
    of how to create and maintain tables.


    We previously touched on a few of the topics we''ll be addressing, such as primary
    and foreign keys, but we now want to delve into these areas in greater detail,
    and also bring in the related topic of table indexes.


    # Data Definition Language


    Way back in Chapter 1, we mentioned the three main components of the SQL language:
    DML (Data Manipulation Language), DDL (Data Definition Language), and DCL (Data
    Control Language). Up until now, most of what we''ve talked about has been DML.
    DML statements allow you to manipulate data in relational databases by retrieval,
    insertion, deletion, or updating. This is handled by the SELECT, INSERT, DELETE,
    and UPDATE statements.


    Although we have focused on DML, we have already seen a few instances of DDL (Data
    Definition Language). The CREATE VIEW and CREATE PROCEDURE statements encountered
    in Chapters 13 and 16 are related to DDL ALTER and DROP versions of those statements.


    CREATE VIEW and CREATE PROCEDURE statements are DDL because they only allow you
    to manipulate the structure of the database. They have nothing to do with the
    data in databases.


    In this chapter, we''ll provide a brief overview of a few additional DDL statements
    that can be used to create and modify tables and indexes.'
