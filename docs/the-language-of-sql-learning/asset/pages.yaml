- pgno: 39
  md: '# Column Aliases 23


    # Database Differences: MySQL and Oracle


    MySQL doesn''t use a symbol, such as the plus (+) sign, to denote concatenation.
    Instead, it requires you to use a function CONCAT. We''ll cover functions in the
    next chapter, but for now, here is a look at what the same statement looks like
    in MySQL:


    ```

    SELECT

    SalesID,

    FirstName,

    LastName,

    CONCAT(FirstName, '' '', LastName)

    FROM Sales;

    ```


    In essence, the CONCAT function to combine the three mentioned terms within the
    parentheses as rather than a plus sign (+).


    Oracle uses vertical bars (||) to denote concatenation. The equivalent statement
    in Oracle is:


    ```

    SELECT

    SalesID,

    FirstName,

    LastName,

    FirstName || '' '' || LastName

    FROM Sales;

    ```


    # Column Aliases


    In all the preceding examples in this chapter, calculated fields were displayed
    with a nondescriptive (unlabeled) header. Microsoft Server displays “(no column
    name)” when it encounters a calculated field. We now want to address how a descriptive
    header can be specified for these types of columns. In brief, the solution is
    to utilize a column alias. The term alias means an alternate name. Here''s an
    example of how to specify a column alias for the previous SELECT statement:


    ```

    SELECT

    SalesID,

    FirstName,

    LastName,

    FirstName + '' '' + LastName AS ''Name''

    FROM Sales;

    ```


    The keyword AS is used to indicate a column alias, which immediately follows the
    keyword. Notice that the column alias is surrounded by single quotes. The output
    is:


    | SalesID | FirstName | LastName | Name |

    | --- | --- | --- | --- |

    | 1 | Andrew | Li | Andrew Li |

    | 2 | Carol | White | Carol White |

    | 3 | James | Carpenter | James Carpenter |'
