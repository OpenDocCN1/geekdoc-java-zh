    | NYSE | 4 | HSY | 26 |


    As expected, the data shows a ranking of rows by quartile, for both NASDAQ and
    NYSE stocks.


    The examples of ranking functions and partitions given far are interesting, but
    a more useful application of these techniques will be seen in Chapter 14, "Subqueries."
    The ability to divide data into partitions and then apply a ranking to each partition
    means that we can specify a *top n* type of selection for each partition in a
    data set. For example, say that we want to select the largest order for each customer.
    We partition the data by customer number, and then rank each by the order amount.
    Ultimately, we want to select only one order per customer. This can be done by
    including a line like the following in the query:


    ```

    ROW_NUMBER() OVER

    (PARTITION BY CustomerNumber ORDER BY OrderAmount) AS TheRow

    ```


    This would have the effect of creating a field named TheRow that ranks the orders
    for each customer by OrderAmount. The order with the highest value would be assigned
    to the initial value of 1. As you''ll see in Chapter 14, it is then possible to
    select from the results of the initial query, selecting only rows where TheRow
    equals 1. This would give you the largest order for each customer. This technique
    can be applied in many similar situations. For example, we might want to see the
    most recent order for each customer or perhaps the most profitable customer in
    each city.'
