- pgno: 57
  md: '# Sorting Data


    Keywords Introduced


    ORDER BY · ASC · DESC


    The ability to present data in a sorted order is essential to the task at hand.
    For example, if an analyst is shown a large list of customers in a random order,
    they''d find it difficult to locate one particular customer. However, if the same
    list is sorted alphabetically, the desired customer can be quickly located.


    The idea of sorting data applies to many situations, even when the data isn''t
    alphabetical in nature. For example, orders can be sorted by order date, allowing
    one to rapidly find an order at a particular date and time. Alternatively, orders
    can be sorted by the order amount, allowing orders to be viewed from the smallest
    to largest. No matter what particular form a sort takes, it can add a useful way
    of organizing the data to be presented to an user.


    # Sorting in Ascending Order


    Up until now, data has not been returned in any particular order. When a SELECT
    is issued, you never know which row will come. If the query is executed within
    a software program, and no one ever sees the data at that point in time, then
    it doesn''t matter. But if the data is to be immediately displayed to a user,
    then the order of rows is often significant. A sort can be easily added to a SELECT
    statement using an ORDER BY.


    Here''s the general format for a SELECT statement with an ORDER clause:


    ```

    SELECT columnlist

    FROM tablelist

    ORDER BY columnlist

    ```


    The ORDER BY clause is always placed after the FROM clause, which in turn comes
    after the SELECT keyword. The italicized columnlist for the SELECT and ORDER BY
    keywords indicates that any number of columns can be listed. The columns in columnlist
    can be individual or more complex expressions. Also, the columns specified by
    the SELECT and ORDER BY keywords can be entirely different columns. The italicized
    tablelist indicates that'
  merge: -1
  img_proc: true
- pgno: 58
  md: '42 Chapter 5 Sorting Data


    any number of tables can be listed in the FROM clause. The syntax for listing
    multiple tables will be introduced in Chapter 11, “Inner Joins,” and Chapter 12,
    “Outer Joins.”


    For the following few examples on sorting, we''ll work with data in this Salespeople
    table:


    | SalespersonID | FirstName | LastName |

    |---|---|--|

    | 1 | Gregory | Brown |

    | 2 | Carla | Brown |

    | 3 | Natalie | Lopez |

    | 4 | Connie | King |


    To sort data in an alphabetic order, with A coming before Z, we simply need to
    add an ORDER BY clause to the SELECT statement. For example:


    ```

    SELECT

    FirstName,

    LastName,

    FROM Salespeople

    ORDER BY LastName

    ```


    brings back this data:


    | FirstName | LastName |

    |---|--|

    | Gregory | Brown |

    | Carla | Brown |

    | Natalie | Lopez |

    | Connie | King |


    Because there are two Browns, Carla and Gregory, there''s no way to predict which
    one will be listed first. This is because we are sorting on LastName, and there
    are multiple rows with that same last name.


    Similarly, if we issue this SELECT:


    ```

    SELECT

    FirstName,

    LastName,

    FROM Salespeople

    ORDER BY FirstName

    ```


    this data is retrieved:


    | FirstName | LastName |

    |---|--|

    | Carla | Brown |

    | Connie | King |

    | Gregory | Brown |

    | Natalie | Lopez |'
