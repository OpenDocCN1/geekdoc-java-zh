    # Database Differences: MySQL and Oracle


    MySQL and Oracle use different characters around columns containing spaces. MySQL
    uses the accent grave (`` ).


    Once a view is created, it can be referenced and utilized like any other table.
    For example, we might want to see only a few selected columns from the view and
    select only specific customer. To do that, we can issue a SELECT statement as:


    ```

