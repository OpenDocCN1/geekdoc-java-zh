- pgno: 97
  md: '# Summarizing Data


    Keywords Introduced

    DISTINCT • SUM • AVG • MIN • MAX • COUNT • GROUP BY • HAVING • ROW_NUMBER • RANK
    • DENSE RANK • NTILE • OVER • PARTITION BY


    Up until now, all of the calculations, functions, and CASE expressions we''ve
    used only altered the values of individual columns. The rows we''ve retrieved
    have corresponded to rows tables in the underlying database. We now want to turn
    to various methods of summarizing data, by combining values in multiple rows.


    The term usually associated with this type of endeavor is aggregation, which means
    ability to aggregate and summarize data is key to being able to move beyond a
    mere display of data to something approaching real information. There''s a bit
    of magic involved when users view summarized data in a report. The ability to
    summarize offers the opportunity of extracting some real meaning from the mass
    of data in a database to obtain a clearer picture of what it all means.


    # Eliminating Duplicates


    Although it doesn''t provide true aggregation, the most elementary way to summarize
    data is to eliminate duplicates. SQL''s DISTINCT keyword provides an easy method
    for removing duplicate values from output. Here''s an example of the DISTINCT
    keyword, used with the following SongTitles:


    | SongID | Artist | Album | Title |

    |---|---|---||

    | 1 | The Beatles | Revolver | Yellow Submarine |

    | 2 | The Beatles | Revolver | Eleanor Rigby |

    | 3 | The Beatles | Abbey Road | Here Comes the Sun |

    | 4 | The Rolling Stones | Beggars Banquet | Sympathy for the Devil |

    | 5 | The Rolling Stones | Let It Bleed | Gimme Shelter |

    | 6 | Paul McCartney | Ram | Too Many People |'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Let''s say we want to see a list of artists in the table. This can be accomplished
    with:


    ```

    SELECT

    DISTINCT

    Artist

    FROM SongTitles

    ORDER BY Artist

    ```


    The result is:


    | Artist |

    | --- |

    | Paul McCartney |

    | The Beatles |

    | The Rolling Stones |


    The DISTINCT keyword is always placed immediately after the SELECT keyword. The
    DISTINCT keyword specifies that unique values of the columnist that follow to
    be returned. In this case, there are only three artists, so only three rows are
    returned. If we want to see unique combinations of both artists and albums, we
    can use


    ```

    SELECT

    DISTINCT

    Artist,

    Album

    FROM SongTitles

    ORDER BY Artist, Album

    ```


    and the result would be:


    | Artist | Album |

    | --- | --- |

    | Paul McCartney | Abbey Road |

    | The Beatles | Revolver |

    | The Beatles | Beggars Banquet |

    | The Rolling Stones | Let It Bleed |


    Note that Revolver is listed only once, even though there are two songs from that
    album in the table. This is because the DISTINCT keyword only considers values
    from the listed columns.'
