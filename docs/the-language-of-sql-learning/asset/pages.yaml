- pgno: 224
  md: '# Chapter 20 Strategies for Displaying Data


    flexibility and functionality. By being aware of reporting and analytical tools
    available to reformat data, SQL developers can focus their talents on retrieving
    data and let the reporting tool or end handle more complex displays.


    If you''ve already done so, you may want to take a look at Appendices A, B, and
    C for some tips on how to get started with Microsoft SQL Server, MySQL, or Oracle.
    These appendices provide instructions on how to install the free versions of these
    databases and also provide basic information on how to use the software to execute
    SQL commands.


    At the beginning of this book, we mentioned that SQL involves both logic and language.
    The language component is fairly obvious. In each chapter, the keywords introduced
    and the meaning behind those words. But now that you''ve completed the book, you
    will hopefully better appreciate the true power of SQL lies in the logic that
    it encompasses.


    It is pure logic that allows you to take a bunch of values arranged in columns
    and rows and transform them into something approaching meaningful information.
    The challenge in using SQL is in determining how to apply logic to real-world
    data. This is where the theoretical and practical meet. By using functions, aggregation,
    joins, subqueries, views, and the like, the practitioner must grapple with the
    reality of raw data and learn how to manipulate it with a few twists of logic.


    But logic isn''t the end of the matter. The language of SQL plays an equally important
    role. In a sense, the beauty of SQL lies in the fact that its language is quite
    sparse. It''s neither verbose nor overly cryptic. Each keyword has a distinct
    purpose and specifies a particular bit of logic and nothing more. We wouldn''t
    go as far as to say that SQL has poetic qualities, but within the realm of computer
    languages, the language carries a certain aesthetic appeal.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Getting Started with Microsoft SQL Server


    The following describes the procedure for installing the free version of Microsoft
    SQL Server on a computer running Windows. Note that the procedure may vary, depending
    on what is already installed on your computer. There are two main steps:


    +   1. Install SQL Server 2016 Express.

    2. Install SQL Server 2016 Management Studio Express.


    Microsoft SQL Server 2016 Express allows you to create databases. SQL Server 2016
    Management Studio Express is a graphical interface that allows you to issue SQL
    commands to interact with the server and any databases you create.


    # Installing SQL Server 2016 Express


    The steps for installing SQL Server 2016 Express are as follows.


    +   1. Go to microsoft.com/en-us/server-cloud/products/sql-server-editions.

    2. Under EXPRESS, select DOWNLOAD.

    3. Sign in to your Microsoft account. Create an account if you don''t have one.

    4. Select your language, and then DOWNLOAD.

    5. After the download completes, run the downloaded file. Accept the suggested
    download location, and then click OK.

    6. Select installation type BASIC.

    7. Select ACCEPT to accept the license terms.

    8. Accept the install location, and click NEXT.

    9. When the download completes, installation will automatically begin.

    10. After installation completes, select CLOSE.


    After this has completed, you will have SQL Server 2016 Installation Center installed.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Installing SQL Server 2016 Management Studio Express


    The steps for installing SQL Server 2016 Management Studio Express are as follows:


    +   - Open the SQL SERVER 2016 INSTALLATION CENTER application that was installed
    with SQL Server 2016 Expression.

    - Select INSTALLATION on the left pane, then INSTALL SQL SERVER MANAGEMENT TOOLS.

    - Select DOWNLOAD SQL SERVER MANAGEMENT STUDIO (SSMS).

    - After the download completes, click RUN, then INSTALL.

    - When installation completes, click CLOSE.


    After this has completed, you will have several new software apps installed, including
    SQL Server 2016 Management Studio.


    # Using SQL Server 2016 Management Studio Express


    When you open the SQL Server 2016 Management Studio application, you''ll first
    see a Connect to Server window. This window allows you to establish a connection
    with the SQL Server 2016 Express instance that you already installed.


    The Server Name will show the SQLEX instance you installed, and the Authentication
    will show Windows Authentication. The Server Type is Database Engine.


    Click the CONNECT button.


    After connecting, you''ll need to create a database to work with. To do this,
    the Object Explorer on the left side of the window, right-click the DATABASES
    line, and then select NEW DATABASE. In the New database, enter a name in the Database
    Name box (for example, FirstDatabase). Click the OK. You will now see your new
    database under Databases.


    To execute your SQL code, highlight your database and then click the NEW QUERY
    button. A new query window opens. You can enter any SQL code and click the EXECUTE
    button. If you enter multiple SQL statements in the query window, you can highlight
    any number of individual statements and execute only the highlighted portion.
    The results of your query will be shown in either a Results pane or a Message
    pane after the query is executed. If there is data to be displayed, it will appear
    in a Results pane; otherwise, a status message will appear in a Message pane.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Getting Started with MySQL


    The following describes the procedure for installing the free version of MySQL
    on a Windows or Mac computer. Note that the procedure may vary, depending on what
    is already installed on your computer. There are two main pieces of software to
    install:


    +   1. Install MySQL Community Server.

    2. Install MySQL Workbench, version 5.2 or higher.


    MySQL Community Server allows you to create databases. The MySQL Workbench is
    a graphical interface that allows you to issue SQL commands to interact with the
    server and any databases you create. At the time of this writing, MySQL Community
    Server is at version 5.7. MySQL Workbench is at version 6.3.


    # Installing MySQL on Windows


    This procedure will install MySQL Community Server and MySQL Workbench on a Windows
    computer.


    The steps for installing are as follows:


    +   1. Go to dev.mysql.com/ click DOWNLOAD.

    2. Under the MySQL Community Server heading, click the DOWNLOAD button next to
    WINDOWS MYSQL INSTALLER MSI, and then click DOWNLOAD again.

    3. Select the MICROSOFT WINDOWS platform...

    4. If desired, log in to an Oracle account, or create a new account. Otherwise,
    click JUST START DOWNLOAD. After the download completes, select the RUN button.

    5. On the License Agreement page, accept the terms

    6. On the Choosing a Setup type page, select the DEVELOPER DEFAULT option, and
    then click NEXT. This will install both MySQL Server and MySQL Workbench. Click
    NEXT.'
  merge: -1
  img_proc: true
