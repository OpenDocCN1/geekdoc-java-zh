- pgno: 139
  md: '# 12


    # Outer Joins


    Keywords Introduced LEFT JOIN · RIGHT JOIN · FULL JOIN · CROSS JOIN


    We now advance from inner joins to outer joins. The main restriction of inner
    joins is that they require a match in all tables being joined to show any results.
    If you''re joining a Customers table to an Orders table, no data is shown for
    the customer if customer hasn''t yet placed an order. This may seem like a relatively
    unimportant problem, but it often becomes significant with different types of
    data.


    To use a different example, let''s say we have an Orders table and a Refunds table.
    The refund table is related to the Orders table by OrderID. In other words, all
    refunds are tied to a specific order. The refund can''t exist unless the order
    exists. The problem arises when we want to see both orders and refunds in a single
    query. If we join these two tables with an inner join, we won''t see any orders
    if no refunds were issued against that order. Presumably, this would be the majority
    of the orders. The outer join allows us to view orders even if they don''t have
    a matching refund, and is therefore an essential technique to understand and use.


    # The Outer Join


    All the joins in the previous chapter were inner joins. Because inner joins are
    the most common type, SQL considers them the default. You can specify an inner
    join using only the KEY JOIN; it''s not necessary to state INNER JOIN.


    In contrast to inner joins, there are three types of outer joins: LEFT OUTER JOIN,
    RIGHT OUTER JOIN, and FULL OUTER JOIN. These can be referred to as simply LEFT
    JOIN, RIGHT JOIN, and FULL JOIN. In this case, the word OUTER isn''t necessary.
    To summarize, our recommendation is to refer to the four join types as:


    +   * INNER JOIN

    * LEFT JOIN

    * RIGHT JOIN

    * FULL JOIN'
  merge: -1
