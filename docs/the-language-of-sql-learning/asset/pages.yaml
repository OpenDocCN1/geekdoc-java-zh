    to create a Pivot Table from the Table. This leads us to our next topic.


    # Excel Pivot Tables


    Excel includes many features that overlap what can be done with SQL. For example,
    within Excel you can sort and filter data, and a myriad of transformations with
    numerous functions. Data can also be grouped and subtotaled. One feature of Excel
    that is difficult to replicate with SQL is the pivot table. Excel provides the
    ability to select any range of data on a worksheet and convert that data into
    a pivot table. Or, as discussed above, data can be imported from an external database
    into a pivot table.


    At a basic level, a pivot table is the equivalent of the crosstab format that
    we''ve seen. However, a key benefit of the pivot table is that it''s completely
    interactive and dynamic. Rather than viewing a static crosstab report, you can
    easily modify the pivot table by rearranging data elements into four areas: rows,
    columns, values, and filters.


    To better understand the tremendous capabilities of pivot tables, let''s illustrate
    with an example. We''ll start with a set of data residing in an Excel worksheet.
    We will assume that the data was moved to the worksheet by utilizing a SQL statement
    that joined data in tables describing customers, products, and sales. The data
    appears in Excel as in Figure 20.5.'
