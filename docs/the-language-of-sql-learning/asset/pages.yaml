- pgno: 202
  md: '# Chapter 18 Maintaining Tables


    +   - The second column in the table is ColumnTwo and is defined as an INT datatype.
    This column will not allow NULL values. This column will also be defined as a
    foreign key, with Set Null specified for deletes, related to a column named FirstColumn
    in another table RelatedTable.


    +   - The third column is ColumnThree and is defined a VARCHAR datatype with a
    length of 25 characters. This column will allow NULL values.


    +   - The fourth column is ColumnFour, is defined as a FLOAT datatype, and will
    allow NULL values. It will be given a default value of 10.


    Here is the CREATE TABLE statement that will create a table in Microsoft SQL Server:


    ```

    CREATE TABLE MyTable

    (ColumnOne INT IDENTITY(1,1) PRIMARY KEY NOT NULL,

    ColumnTwo INT NULL,

    REFERENCES RelatedTable(FirstColumn)

    ON DELETE NULL,

    ColumnThree VARCHAR(25) NULL,

    ColumnFour FLOAT NULL DEFAULT 10,

    CONSTRAINT FOREIGN KEY (ColumnTwo)

    REFERENCES RelatedTable (FirstColumn)

    ON DELETE NULL);

    ```


    # Database Differences: MySQL and Oracle


    The same CREATE TABLE statement in MySQL looks like this:


    ```

    CREATE TABLE MyTable

    (ColumnOne INT AUTO_INCREMENT PRIMARY KEY NOT NULL,

    ColumnTwo INT NULL,

    ColumnThree VARCHAR(25) NULL,

    ColumnFour FLOAT DEFAULT 10,

    CONSTRAINT "ForeignKey" (ColumnTwo)

    REFERENCES RelatedTable(FirstColumn)

    ON DELETE NULL);

    ```


    The same statement in Oracle is:


    ```

    CREATE TABLE MyTable

    (ColumnOne INT PRIMARY KEY NOT NULL,

    ColumnTwo INT NULL,

    ColumnThree VARCHAR(25) NULL,

    ColumnFour FLOAT DEFAULT 10,

    CONSTRAINT "ForeignKey" FOREIGN KEY (ColumnTwo)

    REFERENCES RelatedTable(FirstColumn)

    ON DELETE NULL);

    ```


    As previously mentioned, Oracle doesn''t allow for auto-increment columns.


    After a table is created, an ALTER TABLE statement can be used to modify specific
    attributes of the table. Due to its complexity and the vast differences between
    databases for this command, the syntax for the ALTER TABLE is not covered in this
    book.


    As one example, the following statement could be used to modify MyTable to eliminate
    the ColumnThree column from the table:


    ```

    ALTER TABLE MyTable

    DROP COLUMN ColumnThree

    ```'
