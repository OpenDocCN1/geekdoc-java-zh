    So far, we''ve applied only a simple GROUP BY to obtain the aggregated sales amounts
    for each combination of state and channel. Now, let''s say we want to see subtotals
    for both channel and total rows, similar to what we did previously with the furniture
    inventory data. The problem we face is that there''s no hierarchy between state
    and channel and subcategory. If we''re using subtotals, there''s no obvious way
    to indicate how the subtotals are calculated. In effect, we want to see subtotals
    for both state and channel, independent of each other.


    To accomplish this, we''ll use a new keyword, CUBE, similar to how we previously
    used ROLLUP. The following statement produces the desired result:


    ```

    SELECT

    State,

    Channel,

    SUM(SalesAmount) AS ''Sales Amount''

    FROM SalesSummary

    GROUP BY CUBE(State, Channel)

    ORDER BY State, Channel

    ```


    The output is:


