- pgno: 65
  md: '# 6 Selection Criteria


    Keywords Introduced

    WHERE · TOP · LIKE


    Up until this point, the SELECT begins with the WHERE clause statements we''ve
    seen always brought back every row in the table. This would rarely be the case
    in real-world situations. One is normally interested only in retrieving data that
    meets certain criteria. For example, if you''re selecting orders, you probably
    only want to see orders that meet certain conditions. When looking at products,
    ordinarily only want to see certain types of products. Rarely does someone want
    to simply see everything. Your interest in data is typically directed toward a
    small subset of that in order to analyze or view one particular aspect.


    # Applying Selection Criteria


    Selection criteria in SQL begins the WHERE clause. The WHERE keyword accomplishes
    the task of selecting a subset of rows. This is the general format of the SELECT
    statement, including the WHERE clause and other clauses discussed:


    ```

    SELECT columnlist

    FROM tablelist

    WHERE condition

    ORDER BY columnlist

    ```


    As can be seen, the WHERE clause must always come after the FROM and ORDER BY
    clauses. In fact, if any clause is used, it must appear in the order shown above.


    Let''s look at an example, from data in this Sales:


    | SalesID | FirstName | LastName | QuantityPurchased | PricePerItem |

    |---|---|---|---|--|

    | 1 | Andrew | LI | 4 | 2.50 |

    | 2 | Carol | White | 10 | 1.25 |

    | 3 | James | Carpenter | 5 | 4.00 |'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'We''ll start with a statement with a simple WHERE clause:


    ```

    SELECT

    FirstName,

    LastName,

    QuantityPurchased

    FROM Sales

    WHERE LastName = ''Carpenter''

    ```


    The output is:


    | FirstName | LastName | QuantityPurchased |

    | James | Carpenter | 5 |


    The WHERE clause stipulates to select only rows with a LastName equal to ''Carpenter'',
    only one of the three rows in the table is returned. Notice that the desired value
    of the LastName column was enclosed in quotes, due to the fact that LastName is
    a character column. For numeric fields, no quotes are necessary. For example,
    the following SELECT is equally valid and returns the same data:


    ```

    SELECT

    FirstName,

    LastName,

    QuantityPurchased

    FROM Sales

    WHERE QuantityPurchased = 5

    ```


    # WHERE Clause Operators


    In the previous statements, an equals (=) is used as the operator in the WHERE
    clause. The equals sign indicates a test for equality. The general format shown
    above requires that a condition follows the WHERE clause. This condition consists
    of an operator with expressions on either side.


    The following is a list of the basic operators that can be used in the WHERE clause:


    | WHERE Operator | Meaning |

    | = | equals |

    | <> | does not equal |

    | > | is greater than |

    | < | less than |

    | >= | greater than or equal to |

    | <= | less than or equal to |


    More advanced operators will be covered in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'The meaning of the equals (=) and does not equal (<>) operators should be obvious.
    Here''s an example of a WHERE clause with an “is greater than” operator, taken
    from the same Sales table:


    ```

    SELECT

    FirstName,

    LastName,

    QuantityPurchased

    FROM Sales

    WHERE QuantityPurchased > 6

    ```


    The result is:


    | FirstName | LastName | QuantityPurchased |

    |---|---|---|

    | Carol | White | 10 |


    In this example, only one row meets the condition that the QuantityPurchased column
    be greater than 6. Although not as commonly used, it is also possible to use the
    “is greater than” operator with a text column. This example:


    ```

    SELECT

    FirstName,

    LastName

    FROM Sales

    WHERE LastName > ''K''

    ```


    returns:


    | FirstName | LastName |

    |---|---|

    | Andrew | Li |

    | Carol | White |


    Because the test is for names greater than K, it brings back only Li and White,
    but not Carpenter. When applied to text fields, the greater and less than operators
    indicate selection by the alphabetical order of the values. In this case, Li and
    White are returned, since L and W come after K in the alphabet.


    # Limiting Rows


    We sometimes want to select a small subset of the rows in a table, but don''t
    care which rows are returned. Let''s say we have a table with 50,000 rows and
    want to see just a few rows of data to see what it looks like. It wouldn''t make
    sense to use the WHERE clause for this purpose, since we don''t care which particular
    rows are returned.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 6 Selection Criteria


    For this situation, the solution is to use a special keyword to specify a limit
    as to how many rows are returned. This is another instance where syntax differs
    among databases. In Microsoft SQL-Server, the keyword that accomplishes this limit
    is TOP. The general format is:


    ```

    SELECT

    TOP number columnlist

    FROM tablelist

    ```


    # Database Differences: MySQL and Oracle


    MySQL uses the keyword LIMIT rather than TOP. The general format is:


    ```

    SELECT columnlist

    FROM tablelist

    LIMIT number

    ```


    Oracle uses the keyword ROWOWNUM rather than TOP. The ROWOWNUM keyword must be
    in a WHERE clause, as follows:


    ```

    SELECT columnlist

    FROM tablelist

    WHERE ROWOWNUM <= number

    ```


    Let''s say that we want to see the first 10 rows from a table. The SELECT to accomplish
    this looks like:


    ```

    SELECT

    TOP 10 *

    FROM table

    ```


    This statement returns all columns in the first 10 rows from the table. Like any
    SELECT statement without an ORDER BY clause, there''s no way to predict which
    10 rows will be returned. It depends on how the data is physically stored in the
    table.


    Similarly, we can list specific columns to return:


    ```

    SELECT

    TOP 10

    column1,

    column2

    FROM table

    ```


    In essence, the TOP keyword accomplishes something similar to the WHERE clause,
    as it returns a small subset of rows in the specified table. However, keep in
    mind that rows returned using the TOP keyword are not a true random sample, in
    a statistical sense. They''re only the first rows that qualify, based on how the
    data is physically stored in the database.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Limiting Rows with a Sort


    Another use of the TOP keyword is to use it in combination with the ORDER BY clause
    to obtain a designated number of rows with the highest values, based on specified
    criteria. This type of data selection is commonly referred to as a Top selection.
    Here''s an example, taken from this Books table:


    | BookID | Title | Author | CurrentMonthSales |

    |---|---|---|---|n| 1 | Pride and Prejudice | Austen | 15 |

    | 2 | Animal Farm | Orwell | 7 |

    | 3 | Merchant of Venice | Shakespeare | 5 |

    | 4 | Romeo and Juliet | Shakespeare | 8 |

    | 5 | Oliver Twist | Dickens | 3 |

    | 6 | Candide | Voltaire | 9 |

    | 7 | The Scarlet Letter | Hawthorne | 12 |

    | 8 | Hamlet | Shakespeare | 2 |


    Let''s say we want to see the three books that sold the most in the current month.
    The SELECT accomplishes this:


    ```

    SELECT

    TOP 3

    Title AS ''Book Title'',

    CurrentMonthSales AS ''Quantity Sold''

    FROM Books

    ORDER BY CurrentMonthSales DESC

    ```


    The output is:


    | Book Title | Quantity Sold |

    |---|---|n| Pride and Prejudice | 15 |

    | The Scarlet Letter | 12 |

    | Candide | 9 |


    Let''s examine this statement in some detail. The TOP 3 in the second line indicates
    that only three rows of data are to be returned. The main question to ask is how
    it determines which three rows to display. The answer is found in the ORDER BY
    clause. If there was no ORDER BY clause, then the SELECT would simply bring back
    any three rows of data. However, this is not what we want. We''re looking for
    the three rows with the highest sales. To accomplish this, we need to sort the
    rows by the CurrentMonthSales column in descending order. Why descending? When
    data is sorted in descending order, the highest numbers appear first. If we had
    sorted in an ascending order, we would get the books with the least number of
    sales, not the most.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Chapter 6 Selection Criteria


    Let''s now add one twist to this scenario. Let''s say we only want to see which
    book by Shakespeare has sold the most. In order to accomplish this, we need to
    add a WHERE clause, as follows:


    ```

    SELECT

    TOP 1

    Title AS ''Book Title'',

    CurrentMonthSales AS ''Quantity Sold''

    FROM Books

    WHERE Author = ''Shakespeare''

    ORDER BY CurrentMonthSales DESC

    ```


    This brings back that data:


    | Book Title | Quantity Sold |

    | Romeo and Juliet | 8 |


    The WHERE clause adds the criteria to look only at books by Shakespeare. We also
    revised the TOP keyword to specify TOP 1, indicating that we want to see only
    one row of data.


    # Pattern Matching


    We now turn to a situation in which the data to be retrieved is not precisely
    defined. We often want to view data based on inexact matches with words or phrases.
    For example, you might be interested in finding companies whose name contains
    the word “bank.” The selection via inexact matches within phrases is often referred
    to as pattern matching. In SQL, the LIKE operator is used in the WHERE clause
    to enable us to find matches against part of a column value. The LIKE operator
    requires the use of wildcard characters to specify exactly how the match should
    work. Let''s start with an example from the following Movies table.


    | MovieID | MovieTitle | Rating |

    | 1 | Love Actually | R |

    | 2 | North by Northwest | Not Rated |

    | 3 | Love and Death | PG |

    | 4 | The Truman Show | PG |

    | 5 | Everyone Says I Love You | R |

    | 6 | Down with Love | PG-13 |

    | 7 | Finding Nemo | G |


    Our first example with a LIKE operator is:


    ```

    SELECT

    MovieTitle AS ''Movie''

    FROM Movies

    WHERE MovieTitle LIKE ''%LOVE%%''

    ```'
