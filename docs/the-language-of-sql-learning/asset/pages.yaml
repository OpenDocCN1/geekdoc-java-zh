  img_proc: true
- pgno: 217
  md: '# Excel and External Data 201


    However, before examining the capabilities of Excel pivot tables, we need to digress
    for a moment some into the possibilities of connecting data in Excel. With its
    ubiquitous presence in the business world, most query and reporting tools provide
    a mechanism for exporting their data directly into Excel. When using SQL query
    tools, you generally only need to use an Export to Excel option to move data into
    Excel.


    There are also a variety of options when working within Excel to import data from
    external sources. We focus on obtaining data from relational databases, but we
    will also mention in passing that Excel can also import data from text files and
    connect directly to OLAP databases. Text files are generally imported directly
    into Excel workbook via a wizard that lets the user specify the layout of the
    file, what type of delimiters is used, the properties of each column, and so on.
    Also, sometimes referred to as cubes. When connecting to an OLAP cube, Excel uses
    its pivot table interface to view data in the cube.


    To obtain data from relational databases, one possibility is to connect to the
    database server and then import data into Excel. This is generally initiated via
    a command under the Data tab of the Ribbon coming From Other Sources. Under this
    command options are such:


    +   * From SQL Server

    * From Data Connection Wizard

    * From Microsoft Query


    The Data Connection Wizard allows the user to connect to databases other than
    SQL Server. However, we''ll begin by selecting the From SQL Server option. A connection
    wizard appears that first asks for the database server name and login credentials.
    After providing that information, we''re asked to select the specific tables on
    that server that we would like to import. The next pane of the wizard creates
    an Office Data Connection (ODC) file that stores the information we specified,
    so that the data source can be connected to again in the future. The final step
    in the wizard, shown in Figure 20.1, allows us to import the data into an Excel
    Table, Pivot Table, or Pivot Chart.


    ![](img/5ca87304bc9123a04f1955d920524713_217_0.png)


    Figure 20.1 Import Data options'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Chapter 20 Strategies for Displaying Data


