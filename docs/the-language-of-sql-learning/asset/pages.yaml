    The output is:


    | First Name | Last Name | Order Date |

    | Rumi | Shahj | 2016-09-02 |

    | Rumi | Shah | 2016-09-03 |


    As before, we need to place square brackets around each of the column names because
    they contain embedded spaces.


    # Benefits of Views


    The previous example illustrates one of the important benefits of using views.
    Once a view is created, that view can be referenced as if it were a table. For
    example, if you reference multiple views joined together, it now appears, to be
    just one table.


    Let’s summarize the benefits of views:


    +   * Views reduce complexity. First, views can simplify SELECT statements that
    are particularly complex. For example, if you have a SELECT statement that joins
    six tables together, it might be useful to create views with two or three tables.
    You can then reference those views in a SELECT statement that is less complex
    than the original.'
