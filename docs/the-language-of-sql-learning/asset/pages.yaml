  md: '# 13


    # # Self Joins and Views


    Keywords Introduced


    CREATE VIEW · ALTER VIEW · DROP VIEW


    The inner and outer joints of the previous two chapters dealt with various ways
    of combining data from multiple tables. The assumption has always been that the
    data exists in physical tables in a database. We''ll now turn to two techniques
    that will let us data in a more virtual world. The first technique, the self join,
    allows the analyst to join a table to itself, referring to the same table twice,
    as if it were two separate tables. As such, the self join creates a virtual view
    of a table, allowing it to be used more than once. Second, we''ll learn about
    database views, which is a useful concept that enables us to create new virtual
    tables at.


    # ## Self Joins


    The self join lets you join a table to itself. The most common use of the self
    join is in dealing with self-referencing tables. These are tables that include
    a column that refers to another column in the same table. A common example of
    this type of relationship is a table that contains information about employees.


    In this next example, each row in a Personnel table has a column that points to
    another row in the same table, representing the employee''s manager. In a way,
    this is similar to the concept of foreign keys. The main difference is that, whereas
    foreign keys point to a column in another table, we now have a situation where
    a column points to another column within the same table.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Chapter 13 Self Joins and Views


    Let’s look at the data in the Personnel table:


    | EmployeeID | EmployeeName | ManagerID |

    | 1 | Susan Carter | NULL |

    | 2 | Li Wang | 1 |

    | 3 | Robert Baker | 1 |

    | 4 | Scott Fielding | 1 |

    | 5 | Carla Bender | 2 |

    | 6 | Janet Brown | 2 |

    | 7 | Jules Moreau | 3 |

    | 8 | Adam Adamson | 4 |

    | 9 | Jaideep Singh | 4 |

    | 10 | Amelia Williams | 5 |


    This table has row per employee. The ManagerID column states which manager the
    employee reports to. The ID in that column corresponds to the EmployeeID column.
    For example, Li Wang has a ManagerID of 1. This indicates that Li’s manager is
    Susan Carter, who has an EmployeeID of 1.


    We can see that the three people who report to Susan Carter are Li Wang, Robert
    Baker, and Scott Fielding. Notice that Susan Carter has no value in the ManagerID
    column. This indicates that she is the head of the company and has no manager.


    Now, let’s say that we want to list all employees and show the name of the manager
    to whom each employee reports. To accomplish this, we’ll create a self-join of
    the Personnel table to itself. A table alias must be used with self joins so that
    we have a way of distinguishing each instance of the table. We’ll give the first
    instance of the Personnel table table of Employees, and we’ll give the second
    instance a table of Managers. Here’s the statement:


    ```

    SELECT

    Employees.EmployeeName AS ''Employee Name'',

    Managers.EmployeeName AS ''Manager Name''

    FROM Personnel AS Employees

    INNER JOIN Personnel AS Managers

    ON Employees.ManagerID = Managers.EmployeeID

    ORDER BY Employees.EmployeeName

    ```


    The resulting data is:


    | Employee Name | Manager Name |

    | Amelia Williams | Carol Baker |

    | Adam Adamson | Scott Fielding |

    | Carla Bender | Li Wang |

    | Jaideep Singh | Scott Fielding |

    | Janet Brown | Li Wang |

    | Jules Moreau | Robert Baker |

    | Li Wang | Susan Carter |

    | Robert Baker | Susan Carter |

    | Scott Fielding | Susan Carter |'
