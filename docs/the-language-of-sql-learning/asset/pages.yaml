- pgno: 21
  md: '# Relational Databases


    mathematical relation theory, and has to do with logical properties that govern
    the manner in which tables are related.


    As an example, let''s take the simple case of a database consisting of only two
    tables: Customers and Orders. The Customers table contains one record for each
    customer who ever placed an order. Orders table has one record for each order.
    Each table can contain any number of fields, which are used to store the various
    attributes associated with each record. For example, a Customers table might contain
    fields such as FirstName and LastName.


    At this point, it''s useful to visualize some tables and the data they contain.
    The common custom is to display a table as a grid of rows and columns. Each row
    represents a record in the table. Each column represents a field in the table.
    The top header row normally contains the field names. The remaining rows show
    the actual data.


    In SQL terminology, records and fields are referred to as rows and columns, corresponding
    to the visual representation. So henceforth, we will use the rows and columns
    rather than records and fields to describe the design of tables in relational
    databases.


    Let''s look at an example of the simplest relational database. This database includes
    only two tables: Customers and Orders. This is what the Customers table might
    look like:


    | CustomerID | FirstName | LastName |

    | 1 | Bob | Davis |

    | 2 | Natalie | Lopez |

    | 3 | Connie | King |


    The Orders table may appear as:


    | OrderID | CustomerID | OrderAmount |

    | 1 | 1 | 50.00 |

    | 2 | 1 | 60.00 |

    | 3 | 2 | 33.50 |

    | 4 | 3 | 20.00 |


    In this example, the Customers table contains three columns: CustomerID, FirstName,
    and LastName. There are currently three rows in the table, representing Bob Davis,
    Natalie Lopez, and Connie King. Each row represents a different customer, and
    each column represents a piece of information about the customer. Similarly, the
    Orders table has three columns and four rows. This indicates that there are four
    orders in the database and three attributes for those orders.


    Of course, this example is highly simplistic and only hints at the type of data
    that could be stored in a real database. For example, a Customers table would
    normally contain many additional columns describing other attributes of a customer,
    such as city, state, zip, and phone number. Similarly, an Orders table would ordinarily
    have columns describing additional attributes of the order, such as order date,
    sales tax, and the salesperson who took the order.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Primary and Foreign Keys


    The first column in each table: CustomerID in the Customers table, and OrderID
    in the Orders table. These columns are commonly referred to as primary keys. Primary
    keys are useful and necessary for two reasons. they enable us to uniquely identify
    a single row in a table. For example, if we wanted to retrieve the row for Bob
    Davis, we could simply use the CustomerID to obtain the data. Primary keys also
    ensure uniqueness. Designating the CustomerID as a primary key guarantees that
    this column will have a unique value for every row in the table. Even if we happen
    to have two different men named Bob Davis in our database, those rows would have
    different values in the CustomerID column.


    In this example, the primary key columns don''t have any particular meaning. In
    the Customers table, the CustomerID contains the values 1, 2, and 3 for the three
    rows in the table. Database tables are often designed in such a way to generate
    sequential numbers automatically for the primary key as new rows are added to
    the table. This design feature is referred to as auto-increment.


    A second reason for primary keys is that they allow us to easily relate one table
    to another. In this example, CustomerID in the Orders table points to a corresponding
    row in the Customers table. Looking at the fourth row of the Orders table, notice
    that the CustomerID has a value of 3. This means that this is for the customer
    with CustomerID of 3, who happens to be Connie King. The use of common keys among
    tables is an essential element in relational databases.


    In addition to merely pointing to the Customers table, the CustomerID in the Orders
    table can be designated as something called a foreign key. We''ll cover foreign
    keys in detail in Chapter 18, "Maintaining Tables," but for now, just be aware
    that foreign keys can be defined in order to ensure that the column has a valid
    value. As an example, you would not want the CustomerID in the Orders table to
    have a particular value unless CustomerID actually exists in the Customer table.
    The designation of a column as a foreign key can accomplish that restriction.


    # Datatypes


    Primary and foreign keys add structure to a database table. They ensure that all
    tables in a database are accessible and properly related to each other. Another
    important attribute of every column in a table is its datatype.


    Datatypes are a simple way of defining the type of data that the column can contain.
    A datatype must be specified for each column in every table. Unfortunately, there
    is a great deal of variation between relational databases as to what datatypes
    are allowed and what they mean. For example, Microsoft SQL Server, MySQL, and
    Oracle each have over 30 different datatypes.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'It would be impossible to cover the details and nuances of every available
