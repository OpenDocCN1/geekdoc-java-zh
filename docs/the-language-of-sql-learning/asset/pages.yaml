- pgno: 43
  md: '# 4 Using Functions


    Keywords Introduced LEFT • RIGHT • SUBSTRING • LTRIM • RTRIM • UPPER • LOWER •
    GETDATE • DATEPART • DATEDIF • ROUND • PI • POWER


    Anyone familiar with Microsoft Excel is probably aware that functions provide
    a huge amount of functionality for the typical spreadsheet user. Without the ability
    to use functions, most of the data available in spreadsheets would be of limited
    value. The same is true in the world of SQL. Familiarity with SQL functions will
    greatly enhance your ability to generate dynamic results for viewing data or reports
    generated from SQL.


    This chapter covers a wide variety of the most commonly used functions in different
    categories: character functions, date/time functions, numeric functions, and conversion
    functions. Additionally, we''ll talk about composite functions—a way of combining
    multiple functions into a single expression.


    # What Is a Function?


    Similar to the calculations covered in the previous chapter, functions provide
    another way to manipulate data. As seen, calculations can involve multiple fields,
    with arithmetic operators such as multiplication, or by concatenation. Similarly,
    functions can involve data from multiple values, but the result of a function
    is always a single value.


    What is a function? A function is merely a rule for transforming any number of
    input values into one output value. The result is defined within the function
    and can''t be altered. However, the user of a function is allowed to specify any
    desired value for the inputs to the function. Some functions may allow some of
    the inputs to be optional. That means the specification of that particular input
    isn''t required. Functions can also be designed to have no inputs. However, regardless
    of the type or number of input values, functions always return precisely one output
    value when the function is invoked.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Chapter 4 Using Functions


    There are two types of functions: scalar and aggregate. The term scalar comes
    from mathematics and refers to an operation that is done on a single number. In
    computer usage, it means that the function is performed on data in a single row.
    For example, the LTRIM function removes spaces from one specified value in one
    row of data.


    In contrast, aggregate functions must be performed on a larger set of data. For
    example, the SUM function can be used to calculate the sum of all the values of
    a specified column. Because aggregate functions apply to larger groups or data,
    we will leave discussion of this type of function to Chapter 9, "Summarizing Data."


    Every SQL database offers dozens of scalar functions. The actual functions vary
    widely between databases, in terms of their name and how they work. As a result,
    we will cover only a few representative examples of the more useful functions.


    The common types of scalar functions can be classified under three categories:
    character, date/time, and numeric. These are functions that allow you to manipulate
    character, date/time, or numeric datatypes. In addition, we will tell you about
    some conversion functions that can be used to convert data from one datatype to
    another.


    # Character Functions


    Character functions that enable you to manipulate character data. Just as character
    datatypes are sometimes called string types, character functions are sometimes
    string functions. We''ll cover these seven examples of character functions: LEFT,
    RIGHT, SUBSTRING, LTRIM, RTRIM, UPPER, and LOWER.


    In this chapter, after retrieving data from specific tables, we''ll simply use
    SELECT statements with literals in the columnalias. There will be no FROM clause
    to indicate a table. Let''s start with an example for the LEFT function. When
    this SQL command is issued:


    ```

    SELECT

    LEFT(''sunlight'',3) AS ''The Answer

    ```


    this is returned:


    The inclusion of a column alias in this SQL statement allows the output to display
    "The Answer" as a column header. There is no FROM clause in the SELECT statement.
    Instead of retrieving data from a table, we''re selecting data from a single literal
    value, namely ''sunlight''. In many SQL implementations, including SQL Server
    and MySQL, a FROM clause isn''t strictly necessary in a SELECT statement, although
    in practice one would seldom write a SELECT statement like this. Without a FROM
    clause, more easily illustrate how functions work.'
