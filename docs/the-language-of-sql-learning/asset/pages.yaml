- pgno: 29
  md: 'Finally, as we present different SQL statements in this book, we''ll often
    show both a specific example and a more general format. For instance, the general
    format of the previous statement would be shown as:


    ```

    SELECT *

    FROM table

    ```


    Italics are used to indicate a general expression. The italicized word *table*
    means that you can substitute any name in that spot. When you see italicized words
    in any SQL statement in this book, this is simply a way of indicating that any
    word or phrase can be substituted in that location.


    +   - Database Differences: MySQL and Oracle


    Many SQL implementations require a semicolon at the end of every statement. This
    is true of MySQL and Oracle, but not of Microsoft Server. However, semicolons
    can be specified in SQL Server if desired. For simplicity, we will show SQL statements
    without semicolons in this book. If you''re using MySQL or Oracle, you''ll need
    to add a semicolon at the end of each statement. The previous statement would
    appear as:


    ```

    SELECT *

    FROM Customers;

    ```


    # Comments


    When writing SQL statements, it''s often desirable to insert comments within or
    around those statements. There are two standard methods of writing comments in
    SQL. The first method, referred to as the double dash, consists of two dashes
    placed anywhere on a line. All text that follows two dashes on a line is ignored
    and interpreted as comments. Here''s an example of this format:


    ```

    SELECT

    -- this is the first comment

    FirstName,

    LastName -- this is a second comment

    FROM Customers

    ```


    The second format, borrowed from the C programming language, consists of text
    placed between /* and */. Comments between the /* and */ can be written on multiple
    lines. Here''s an example:


    ```

    SELECT

    /* this is the first comment */

    FirstName,

    LastName /* this is a second comment

    this is still part of the second comment

    this is the end of the second comment */

    FROM Customers

    ```'
