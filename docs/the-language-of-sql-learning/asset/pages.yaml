    | NULL | NULL | 1320 |

    | NULL | Internet | 820 |

    | NULL | Retail | 500 |

    | NY | NULL | 980 |

    | NY | Internet | 570 |

    | NY | Retail | 410 |

    | VT | NULL | 340 |

    | VT | Internet | 250 |

    | VT | Retail | 90 |'
