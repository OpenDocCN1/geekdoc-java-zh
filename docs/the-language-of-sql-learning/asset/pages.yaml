    # # Table Attributes


    In the first two chapters, we briefly discussed a few attributes of database tables,
    such as primary keys, foreign keys, datatypes, and auto-increment columns. As
    mentioned, SQL DDL provides CREATE statements for many types of database objects.
    In Chapters 13 and 16, we talked about the CREATE PROCEDURE and CREATE VIEW statements
    that handle stored procedures and views.


    We’ll now bring our attention back to tables. Tables are perhaps the primary and
    most essential object type in a database. Without tables, nothing else really
    matters. The data in a database is physically stored in tables. Most other object
    type relate to tables in one way or another. Views provide a visual view of tables.
    Stored procedures generally act upon data in tables. Functions allow for special
    rules for the manipulation of data in tables.


    We’ll focus here on how tables can be created initially. A large number of attributes
    can be associated with table definitions. We’ll give an overview of some the most
    important attributes and discuss what they mean.


    The subject of table attributes is also related to the larger topic of database
    design, which will be addressed in the next chapter. For now, we will focus on
    the mechanics of what can be done with the tables themselves.


    The specifics of how tables can be designed and altered varies widely among Microsoft
    SQL Server, MySQL, and Oracle. We’ll talk primarily about those attributes common
    to tables in all three databases.'
