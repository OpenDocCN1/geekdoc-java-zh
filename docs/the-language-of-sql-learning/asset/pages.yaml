- pgno: 54
  md: 'It will show:


    | Description | Weight |

    |---|--|

    | Printer A | NULL |

    | Printer B | 0 |

    | Monitor C | 2 |

    | Laptop D | 4 |


    There’s nothing inaccurate about this display. However, users may prefer to see
    something such as “Unknown” rather than NULL for missing values. Here’s the solution:


    ```

    SELECT

    Description,

    ISNULL(CAST(Weight AS VARCHAR, ''Unknown'') AS Weight

    FROM Products

    ```


    The following data is displayed:


    | Description | Weight |

    |---|--|

    | Printer A | Unknown |

    | Printer B | 0 |

    | Monitor C | 2 |

    | Laptop D | 4 |


    Notice that the solution requires the use of both the ISNULL and CAST functions.
    The ISNULL function handles the display of the weight as “Unknown” when NULL values
    are encountered. Assuming the Weight column is defined as an integer, the CAST
    function is needed to convert the weight to a VARCHAR datatype, so both integer
    and character values can be displayed in a single column.


    # Database Differences: MySQL and Oracle


    The ISNULL function is called IFNULL in MySQL. Furthermore, MySQL doesn’t require
    the use of CAST function in this case. The equivalent of the above statement in
    MySQL is:


    ```

    SELECT

    Description,

    IFNULL(Weight, ''Unknown'') AS Weight

    FROM Products;

    ```


    The ISNULL function is called NVL (Null Value) in Oracle. The equivalent Oracle
    statement is:


    ```

    SELECT

    Description,

    NVL(CAST(Weight AS CHAR), ''Unknown'') AS Weight

    FROM Products;

    ```


    Additionally, unlike Microsoft SQL Server and MySQL, Oracle displays a dash rather
    than the word NULL when it encounters NULL values.'
