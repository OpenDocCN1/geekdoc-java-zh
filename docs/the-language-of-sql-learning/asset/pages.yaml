    # Adding Subtotals to CUBE


    Rollups work well in situations where the data has a hierarchical structure. In
    the previous example, there was a natural hierarchy from category to subcategory.
    The ROLLUP keyword provides subtotal on each category and a total at the end.


    However, there are other situations where the data is not hierarchical, but where
    we still want to add subtotal rows. To illustrate scenario, let’s look at the
    following data.


    | SalesDate | CustomerID | State | Channel | SalesAmount |

    | 4/1/2017 | 101 | NY | Internet | 50 |

    | 4/1/2017 | 102 | NY | Retail | 30 |

    | 4/1/2017 | 103 | VT | Internet | 120 |

    | 4/2/2017 | 145 | VT | Retail | 90 |

    | 4/2/2017 | 180 | NY | Retail | 300 |

    | 4/2/2017 | 181 | VT | Internet | 130 |

    | 4/2/2017 | 182 | NY | Internet | 520 |

    | 4/2/2017 | 184 | NY | Retail | 80 |


    This data shows sales by customer and date, indicating the state and channel of
    the sale. In this example, there are only two states, NY and VT, and two channels,
    Internet and Retail. Let’s say that we are interested in learning total sales
    by state and channel. Even though we have sales from multiple customers on multiple
    dates, we don’t have need to aggregate by customer or date at this moment. We
    can view total sales by state and channel with this statement:'
