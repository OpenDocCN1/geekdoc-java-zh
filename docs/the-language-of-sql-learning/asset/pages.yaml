    # Common Table Expressions


    An alternate subquery syntax allows it to be defined explicitly prior to the execution
    of the main query. This is known as a common table expression. In this syntax,
    the entire subquery is removed from its location and placed at the top of the
    query. The WITH keyword is used to indicate the presence of a common table expression.
    Although they may be used with correlated subqueries, a common table expression
    is far more useful for uncorrelated subqueries. To illustrate, let''s return to
    the first subquery presented in this chapter:


    ```

    SELECT

    UserName AS ''User Name'',

    ISNULL(CashTransactions.TotalCash, 0) AS ''Total Cash''

    FROM Users

    LEFT JOIN

    (SELECT

    UserID,

    SUM(TransactionAmount) AS ''TotalCash''

    FROM Transactions

    WHERE TransactionType = ''Cash''

    GROUP BY UserID) AS CashTransactions

    ON Users.UserID = CashTransactions.UserID

    ORDER BY Users.UserID

    ```


    As seen, the subquery in the above statement is given an alias of CashTransactions,
    and is joined to the Users on the UserID column. The purpose of the subquery is
    to provide a total of the cash transactions for each user. The output of this
    query:


    | User Name | Total Cash |

    |---|--|\| Cecilia Rodriguez | 22.25 |

    | Elaine Bundy | 8.00 |

    | Rakesh Gupta | 0 |

    | April Waters | 0 |'
