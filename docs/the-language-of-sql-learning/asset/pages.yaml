- pgno: 215
  md: '# 20

    Strategies for Displaying Data


    In this final chapter, we''ll return to the main theme of this book—namely, methods
    of retrieving data from relational databases. In the previous few chapters, we
    took a detour from data retrieval to the related topics of updating data, maintaining
    tables, and designing databases. More specifically, we''ll compare the capabilities
    of SQL to other reporting tools available to the end user and discuss strategies
    for employing the most appropriate tool for the job at hand.


    In the broad business and corporate world, Microsoft Excel is the most widely
    available and pervasive reporting tool for the end user. One would be hard-pressed
    to find a business analyst who doesn''t use or interact with Excel in some manner.
    In this chapter, we''ll examine how Excel can be used to extend the data retrieval
    capabilities of SQL to further manipulate data and present it in formats that
    aren''t easily accomplished in SQL.


    # Crosstab Layouts Revisited


