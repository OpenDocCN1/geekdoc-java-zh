- pgno: 27
  md: '# Basic Data Retrieval


    Keywords Introduced

    SELECT · FROM


    In this chapter, we will begin our exploration of the most important topic in
    SQL—namely, how to retrieve data from a database. Regardless of the size of your
    organization, the most common request made of SQL is the request for a report.
    Of course, it''s a nontrivial exercise to get data into a database, but once the
    data is there, the energies of business analysts turn to the wealth of data at
    their disposal and the desire to extract useful information from all that data.


    The emphasis in this book on data retrieval corresponds to these real-world demands.
    Your knowledge of SQL will go a long way toward helping your organization unlock
    the secrets hidden in the data stored in your databases.


    # A Simple SELECT


    The ability to retrieve data in SQL is accomplished through something called the
    SELECT statement. Without any preliminary explanation, here is an example of the
    simplest possible statement:


    SELECT * FROM Customers


    In the SQL language, as all computer languages, certain words are keywords. These
    words have special meanings and must be used in a particular way. In this statement,
    the words SELECT and FROM are keywords. The SELECT keyword indicates the start
    of a SELECT statement. The FROM keyword is used to designate the table from which
    data to be retrieved. The name of the table follows the FROM. In this case, the
    table name is Customers. The asterisk (*) in this example is a special symbol
    that means "all columns."


    As is custom, we''ll print keywords in all capital letters. This is done to ensure
    that they are noticeable. To sum up, this statement means: Select all columns
    from the Customers table.'
  merge: -1
  img_proc: true
