- pgno: 45
  md: '# Character Functions 29


    Let''s look at the format of this function in greater detail. The general format
    of the LEFT function is:


    ```

    LEFT(CharacterValue, NumberOfCharacters)

    ```


    All functions have any number of arguments within the parentheses. For example,
    the LEFT function has two arguments: CharacterValue and NumberOfCharacters. The
    term argument is a commonly used mathematical term that describes a component
    of functions, and has nothing to do with anything disagreeable or unpleasant.
    The various arguments that are defined for each function are what truly define
    the meaning of the function. In the case of the LEFT function, CharacterValue
    and NumberOfCharacters arguments are both needed to define what will happen when
    the LEFT is invoked.


    The LEFT function has two arguments, and both are required. As mentioned, other
    functions may have more or fewer arguments. Functions are even permitted to have
    no arguments. But regardless of the number of arguments, if zero, all functions
    have a set of parentheses following the function name. The presence of the parentheses
    tells that the expression is a function and not something else.


    The formula for the LEFT function says: Take the specified CharacterValue, look
    at the specified NumberOfCharacters on the left, and bring back the result. It
    looks at the CharacterValue ''sunlight'' and brings back the left three characters.
    The result is ''sun''


    The main point to remember is that for any function you want to use, you''ll need
    to look up the function in the database''s reference guide and determine how many
    arguments are required and what they mean.


    The second character function we''ll cover is the RIGHT function. This is the
    same as the LEFT function, except that characters are now specified for the right
    side of the input value. The general format of the RIGHT function is:


    ```

    RIGHT(CharacterValue, NumberOfCharacters)

    ```


    As an example:


    ```

    SELECT

    RIGHT(''sunlight'',5) AS ''The Answer''

    ```


    returns:


    | The Answer |

    | light |


    In this case, the NumberOfCharacters argument needed to have a value of 5 in order
    to return the value ''light''. A value of 3 would have only returned ''ght''.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Chapter 4 Using Functions


    One problem that often arises with the use of the RIGHT function is that character
    data often contains spaces on the right-hand side. Let''s look at an example in
    which a table with only one row of data contains a column named President, where
    the column is defined as being 20 characters long. The table looks like:


    | President |

    | George Washington |


    If we use this SELECT statement against the table:


    ```

    SELECT

    RIGHT(President,10) AS ''Last Name''

    ```


    we get back this data:


    | Last Name |

    | hington |


    We expected to get back "Washington" but only got "hington." The problem is that
    the entire column is 20 characters long. In this example, there are three spaces
    to the right of the value "George Washington". Therefore, when we ask for the
    rightmost 10 characters, SQL will take the three spaces, plus another seven characters
    from the original expression. As will soon be seen, the function RTRIM must be
    used to remove the ending spaces before using the RIGHT function.


    You might be wondering how to select data from the middle of an expression. This
    is accomplished by using the SUBSTRING function. The general format of that function
    is:


    ```

    SUBSTRING(CharacterValue, StartingPosition, NumberOfCharacters)

    ```


    For example:


    ```

    SELECT

    SUBSTRING(''thewhitegoat'',4,5) AS ''The Answer''

    ```


    returns this data:


    | The Answer |

    | white |


    This function is saying to take five characters, starting with position 4. This
    results in the display of the word "white".'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Database Differences: MySQL and Oracle


    MySQL sometimes requires there be no space between the function name and the left
    parenthesis. It depends on the specific function used. For example, the previous
    statement in MySQL must be written exactly as shown. Unlike Microsoft SQL Server,
    you can''t type in an extra space after SUBSTRING.


    In Oracle, the equivalent of the SUBSTRING function is SUBSTR. One difference
    in the Oracle version of SUBSTR is that the second argument (StartingPosition)
    can have a negative value. A negative value for this argument means that you need
    to count that number of positions backward from the right side of the column.


    As mentioned, Oracle doesn''t permit you to write a SELECT statement without a
    FROM clause. However, Oracle does permit a dummy table DUAL for this type of situation.
    The Oracle equivalent of the SELECT with a SUBSTRING function is:


    ```

    SELECT

    SUBSTR(''thewhitegoat'',4,5) AS ''The Answer''

    FROM DUAL;

    ```


    Our next character functions enable us to remove all spaces, either on the left
    or the right side of an expression. The LTRIM function trims characters from the
    left side of a character expression. For example:


    ```

    SELECT

    LTRIM('' the apple'') AS ''The Answer''

    ```


    returns this data:


    | The Answer |

    |-------------|

    | apple       |


    Note that LTRIM is smart enough not to eliminate spaces in the middle of a phrase.
    It only removes the spaces to the very left of a character value.


    Similar to LTRIM, the RTRIM function removes any spaces to the right of a character
    value. An example of RTRIM will be given in the next section, on composite functions.


    The final two functions to be covered are UPPER and LOWER. These functions convert
    any word or phrase to upper- or lowercase. The syntax is simple and straightforward.
    Here''s an example that covers both:


    ```

    SELECT

    UPPER(''Abraham Lincoln'') AS ''Convert to Uppercase''

    LOWER(''ABRAHAM LINCOLN'') AS ''Convert to Lowercase''

    ```


    The output is:


    | Convert to Uppercase | Convert to Lowercase |

    |---------------------|----------------------|

    | ABRAHAM LINCOLN | abraham lin |'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Composite Functions


    An important characteristic of functions, whether they are character, mathematical,
    or date/time, is that two or more functions can be combined to create composite
    functions. A composite function with two functions can be said to be a function
    of a function. Let''s go back to the George Washington query to illustrate. Again,
    we''re working from this data:


    President

    George Washington


    Remember that the President column is 20 characters. In other words, there are
    three spaces to the right of the value "George Washington". In addition to illustrating
    composite functions, this next example will also cover the RTRIM function mentioned
    in the previous section. The statement:


    ```

    SELECT

    RIGHT(RTRIM(President),10) AS ''Last Name''

    FROM table

    ```


    returns this data:


    Last Name

    Washington


    Why does this now produce the correct value? Let''s examine how this composite
    function works. There are two functions involved: RIGHT and RTRIM. When evaluating
    composite functions, you always start from the inside and work your way out. In
    this example, the innermost function is:


    ```

    RTRIM(President)

    ```


    This function takes the value in the President column and eliminates all spaces
    on the right. After this is done, the RIGHT function is applied to the result
    to bring back the desired value. Because


    ```

    RTRIM(President)

    ```


    equals "George Washington", we can say that:


    ```

    SELECT

    RIGHT(RTRIM(''George Washington'', 10)

    ```


    is the same as saying:


    In other words, we can obtain the desired result by first applying the RTRIM function
    to the input data and then adding the RIGHT function to the expression to produce
    the final results.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Date/Time Functions


    # Date/Time Functions


    Date/Time allow for the manipulation of date and time values. The names of these
    functions differ, depending on the database used. In Microsoft SQL Server, the
    functions we''ll are called GETDATE, DATEPART, and DATEDIFF.


    The simplest of the date/time functions is one that returns the current date and
    time. In Microsoft SQL Server, the function is named GETDATE. This function has
    no arguments. It merely returns the current date and time. For example:


    ```

    SELECT GETDATE ()

    ```


    rings back an expression with the current date and time. Since the GETDATE function
    has no arguments, there is nothing between the parentheses. Remember that a date/time
    field is a special datatype that contains both a date and a time in a single field.
    Example of such a value is:


    ```

    2017-05-15 08:48:30

    ```


    This value refers to the 15th of May 2017, at 48 minutes and 30 seconds past 8
    AM.


    +   Database Differences: MySQL and Oracle

    In MySQL, the equivalent of GETDATE is NOW. The above statement would be written
    as:

    SELECT NOW (nThe equivalent of GETDATE in Oracle is CURRENT_DATE. The statement
    is written as:

    SELECT CURRENT_DATE


    The next date/time function enables us to analyze any specified date and return
    a value to represent elements such as the day or week of the date. Again, the
    name of this function differs, on the database. In Microsoft SQL Server, this
    function is called DATEPART. The general format is:


    ```

    DATEPART(DatePart, DateValue)

    ```


    The DateValue argument is any date. The DatePart argument can have many different
    values, including year, quarter, month, dayyear, day, week, weekday, hour, and
    second.


    The following chart shows how the DATEPART function evaluates the date ''5/6/2017'',
    with different values for the DatePart argument:


    | Function Expression | Resulting Value |

    | DATEPART(month, ''5/6/2017'') | 5 |

    | DATEPART(day, ''5/6/2017'') | 6 |

    | DATEPART(week, ''5/6/2017'') | 18 |

    | DATEPART(weekday, ''5/6/2017'') | 7 |'
