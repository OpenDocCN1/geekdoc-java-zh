- pgno: 53
  md: '# Conversion Functions 37


    Your first impression might be that the statement would fail, due to the fact
    that Quantity is not defined as a numeric column. However, most SQL databases
    are smart enough to automatically convert the Quantity column to a numeric value
    so that it can be multiplied by 2.


    Here''s an example where the CAST function becomes necessary. Let''s say we have
    dates stored in a column with a character datatype. We''d like to convert dates
    to a date/time column. This statement illustrates how the CAST function can handle
    that conversion:


    ```

    SELECT

    ''2017-04-11'' AS ''Original Date'',

    CAST(''2017-04-11'' AS DATETIME) AS ''Converted Date''

    ```


    The output is:


    | Original Date | Converted Date |

    | --- | --- |

    | 2017-04-11 | 2017-04-11 00:00:00 |


    The Original Date column looks like a date, but it is really just character data.
    In contrast, the Converted Date column is a date/time column, as evidenced by
    the time value now shown.


    A second useful conversion function is one that converts NULL values to a meaningful
    value. In Microsoft SQL Server, the function is called NULLIF. As mentioned in
    Chapter 1,"Relational Databases and SQL," NULL values are for which there is an
    absence of data. A NULL value is not the same as a space or zero. Let''s say we
    have this table of products:


    | ProductID | Description | Weight |

    | --- | --- | --- |

    | 1 | Printer A | NULL |

    | 2 | Printer B | 0 |

    | 3 | Monitor C | 2 |

    | 4 | Laptop D | 4 |


    Notice that Printer A has a value of NULL in the Weight column. This indicates
    that a weight for this printer has not yet been provided. Let''s say we want to
    produce a list of all products. When the SELECT is issued:


    ```

    SELECT

    Description,

    Weight

    FROM Products

    ```'
