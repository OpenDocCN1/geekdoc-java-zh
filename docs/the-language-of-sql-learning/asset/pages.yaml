    In truth, most modifications to database objects, such as views and tables, can
    be accomplished through the visual GUI (graphical interface) that each software
    vendor provides to administer their software. It is often not necessary to learn
    any DDL at all, because it can often be handled with the software GUI.


    However, it’s useful to be aware of at least the existence of a few keys for manipulating
    data objects. We’ve already seen some statements that allow us to modify views
