    # Using a Subquery in Selection Criteria


    In Chapter 7, we introduced the first format of the IN operator. The example we
    used was:


    ```

    WHERE State IN (''IL'',''NY'')

    ```


    In this format, the IN operator merely lists a number of values in parentheses.
    There is also a second format for the IN, in which an entire SELECT statement
    is inserted inside the parentheses. For example, a list of states might be specified
    as:


    ```

    WHERE State IN

    (SELECT

    States

    FROM StateTable

    WHERE Region = ''Midwest'')

    ```


    Rather than list individual states, this second format allows us to generate a
    dynamic list of states through more complex logic.


    Let''s illustrate with an example that uses the Users and Transactions tables.
    In this scenario, we want to retrieve a list of users who have ever paid for any
    transaction. A SELECT that accomplishes this is:


    ```

    SELECT UserName AS ''User Name''

    FROM Users

    WHERE UserID IN

    (SELECT UserID

    FROM Transactions

    WHERE TransactionType = ''Cash'')

    ```


    The resulting data is:


    | User Name |

    | Cecilia Rodriguez |

    | Elaine Bundy |'
