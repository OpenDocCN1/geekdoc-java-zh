  md: '# Chapter 17 Modifying Data


    The Vendors table is the main source of data for vendors. To accomplish an update
    of the Vendors table from the VendorTransactions table, we will need to use the
    subquery technique discussed in Chapter 14. The correlated subquery is needed
    because the UPDATE statement can only specify a single table to update. We can''t
    merely join multiple tables together and have it work. We''ll need to use a correlated
    subquery after the SET keyword to indicate where the data comes.


    The following statement can be used to update the State and Zip columns in the
    Vendors table from the transactions in the VendorTransactions table. Because this
    statement is fairly complex, we inserted a few blank lines so we can subsequently
    discuss the four sections of the statement.


    ```

    SET Vendors.State =

    (SELECT VendorTransactions.State

    FROM VendorTransactions

    WHERE Vendors.VendorID = VendorTransactions.VendorID),


    Vendors.Zip =

    (SELECT VendorTransactions.Zip

    FROM VendorTransactions

    WHERE Vendors.VendorID = VendorTransactions.VendorID)


    WHERE EXISTS

    (*)

    FROM VendorTransactions

    WHERE Vendors.VendorID = VendorTransactions.VendorID)

    ```


    Let''s analyze this UPDATE statement in detail. The first section of the statement,
    consisting of the first line, indicates that the update is to be done on the Vendors
    table.


    The second section of the statement specifies how the State column is to be updated.
    The update is based on this correlated subquery:


    ```

    SELECT VendorTransactions.State

    FROM VendorTransactions

    WHERE Vendors.VendorID = VendorTransactions.VendorID

    ```


    We can tell that this a correlated subquery would produce an error if we attempted
    to execute this SELECT on ones. The subquery is taking data from the VendorTransactions
    table and matching between the two tables by Vendors.


    The third section of the statement is identical to the second section, except
    that these lines are concerned with the Zip column. Also notice that the SET keyword
    only needed to be specified once, in the second section. It isn''t needed in the
    third section.


    The final section includes logic in a WHERE clause associated with the selection
    logic for the entire UPDATE statement. The EXISTS operator is used along with
    another correlated subquery to determine whether row exists in the VendorTransactions
    table for each VendorID in the Vendors table. Without WHERE clause, the update
    would incorrectly change the State and Zip columns for vendors 3 and 4 to NULL
    values, because those vendors do not have rows in'
