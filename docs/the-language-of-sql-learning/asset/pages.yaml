- pgno: 211
  md: '# The Art of Database Design


    However, remembering SQL’s ability to easily join tables together, you can also
    see that there is much greater flexibility in this new design. Not only are we
    free to join only those tables needed for any particular analysis, but we can
    now also add columns to these tables more readily without affecting anything else.


    Our information has become more modularized. Now if we decide that we want to
    capture additional information about each student, such as address and phone number,
    we can simply add new columns to the Students table. And, when we want to modify
    a student’s address or phone number later, that change will affect only one row
    in the table.


    # The Art of Database Design


    Ultimately, designing a database is much more than simply going through normalization
    procedures. Database design is really more of an art than a science, and it requires
    asking and thinking about relevant business issues.


    In our examples, we presented one possible database design as an illustration
    of how to normalize data. In truth, many possibilities exist for designing this
    database. Much depends on the realities of how the data will be accessed and modified.
    Numerous questions can be asked to ascertain whether a design is flexible and
    meaningful as it needs to be. For example:


    +   - Are other tables that need to be added to the database? One obvious would
    be a Subjects table, which would allow for the selection of tests by subject,
    such as English or Math. If a Subjects table were added, it could then be asked
    whether we want to relate the student to the test or to the teacher who administered
    the test.


    +   - Is it possible for a grade to count in more than one subject? It might be
    that the English and Social Studies teachers are designing a combined lesson and
    certain tests to count for both subjects. How would we account for that?


    +   - What do we do if a child flunks a grade and is now taking the tests second
    time? We would need to determine how we would differentiate the student’s grade
    for each time the test took.


    +   - Does the data have special analysis requirements? Teachers might implement?
    For example, a teacher might want to drop the lowest quiz score in a particular
    period. If there is more than one teacher for the same student, do we want to
    compare the average grades for the students of each teacher, to ensure that one
    is inflating grades?


    The list of possible questions is endless. The point is that data doesn’t exist
    in a vacuum. There is a necessary interaction between data design and real-world
    requirements. Databases must be designed to allow for flexibility and ease of
    use. However, there is also a danger that databases can be over-designed to a
    point where the data becomes unintelligible. An zealous data administrator might
    decide to create 20 tables for every possible situation. That, too, is inadvisable.
    Database design is something of balancing act in the search for a design that
    is sufficiently flexible but also intuitive and understandable by users of the
    system.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Alternatives to Normalization


    We have emphasized that normalization is the overriding principle that should
    be followed in designing a database. In certain situations, however, viable alternatives
    might make more sense.


    For example, in the realm of warehouse systems and software, many practitioners
    advocate using a star schema for databases rather than normalization. In a star
    schema, a certain amount of redundancy is allowed and encouraged. The emphasis
    is on creating a data structure that more intuitively reflects business realities,
    and one also allows for quick processing of data by special analytical software.


    To give a brief overview of star schema design, the main idea is to create a central
    fact table. The fact table contains all the quantitative numbers that are additive
    in nature. In our previous example, the Grade column is such a number, because
    we can add grades to obtain a meaningful total grade. The dimension tables contain
    information on all the entities related to the central facts, such as subject,
    time, teacher, and so on.


    As an additional possibility, special analytical software can be employed to create
    cubes from their star schema databases. These cubes extend analysis capabilities,
    allowing users to drill down through predefined hierarchies in the various dimensions.
    For example, such a system would be able to drill down from viewing a student''s
    entire semester to seeing grades in an individual week.


    Figure 19.2 what a database with a star schema design might look like for our
    grades example.


    | Students | Grades | Time |

    |---|---||

    | Student ID | Date | Date |

    | Student | TestID | |

    | Teachers | | Tests |

    | TeacherID | TeacherID | TestID |

    | Teacher | Grade | Test |

    | Assistant | TotalPoints | Formats |

    | | TestID |

    | | TestFormat


    Figure 19.2 Star schema design


    In this design, the Grade table is the central fact table. All other tables are
    dimension tables.


    The first four columns in the Grades table (Date, TestID, StudentID, and TeacherID)
    allow each row in the fact table to be related to the corresponding row in a dimension
    table. For example, the StudentID column in the Grades table can be joined to
    a StudentID value in the Students table. The other two columns in the Grades table
    have additive numeric quantities. Notice that TotalPoints is now in the Grades
    table. In our normalized design, TotalPoints was'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Looking Ahead


    an attribute of the Tests table and the grade was in the Grades table. By putting
    both the Grade and TotalPoints in a single table in this star schema design, we
    can more easily sum grades and compute averages (Grade divided by the TotalPoints)
    for any set of data.


    Certainly, this is only a brief introduction to the subject of designing databases
    for data warehouse applications. However, it illustrates the point that there
    are many ways to design a database, and the best way often relates to the type
    of software that will be used with the data.


    # Looking Ahead


    This chapter covered the principles of database design. We discussed the basics
    of the normalization process, showing how a database with a single table can be
    converted into a more flexible structure with multiple tables, related by additional
    key columns. We also emphasized that database design is not merely a technical
    exercise. Attention must be paid to the organizational realities and considerations
    as to how the data will be accessed and utilized. Finally, we described the star
    schema as an alternative to conventional normalized design, in an effort to emphasize
    that there is often more than one feasible approach.


    In our final chapter, “Strategies for Displaying Data,” we''ll discuss some interesting
    possibilities for using spreadsheets to complement our knowledge of SQL. In our
    quest to sharpen our SQL skills, we must not forget that there is a world out
    beyond SQL. We should not expend efforts on SQL when the underlying objective
    can be accomplished more effectively through other means.'
  merge: -1
  img_proc: true
