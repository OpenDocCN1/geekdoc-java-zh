  md: '# Creating Crosstab Layouts


    The subtotal rows added with the ROLLUP and CUBE keywords provide additional aggregation
    possibilities for your queries. By displaying additional subtotal rows, we can
    view summary information along with the details. We now want to turn our attention
    to the way that summarized data is typically presented. We already encountered
    this statement that groups by state and channel to provide an aggregated summary:


    ```

    SELECT

    State,

    Channel,

    SUM(SalesAmount) AS ''Sales Amount''

    FROM SalesSummary

    GROUP BY State, Channel

    ORDER BY State, Channel

    ```


    The output is:


    | State | Channel | Sales Amount |

    | NY | Internet | 570 |

    | NY | Retail | 410 |

    | VT | Internet | 250 |

    | VT | Retail | 90 |


    This is perfectly understandable. We have four rows of data, in which each row
    gives an aggregated summary of a specific state and channel combination. For example,
    the first row provides the sum of sales over the Internet in NY. This is all well
    and good, but we now want to introduce an alternate way of displaying this same
    information. Using a new keyword PIVOT, it''s possible to display this data as
    it would appear in an Excel pivot table, in which is commonly called a *crosstab
    query*. Using the PIVOT query, we can produce this output in the following layout:


    | Channel | NY | VT |

    | Internet | 570 | 250 |

    | Retail | 410 | 90 |


    Instead of four rows of data, we now have two. This was accomplished by breaking
    down the state values into separate columns. This compact way of displaying data
    is referred to as a *crosstab*. If you''re familiar with Microsoft Excel, this
    is similar to what is seen in Excel pivot tables. We''ll discuss pivot tables
    in Chapter 20, but for the main idea to remember is that pivot tables divide columns
    into four distinct areas: rows, columns, filters, and values. If this were a pivot
    table, we would have placed Channel in the rows area, State in the columns area,
    and Sales Amount in the values area.


    The virtue of the crosstab is that it is more compact and makes it easier to navigate
    through the data. For example, if we''re interested in finding retail sales in
    VT, we simply locate the Retail'
  merge: -1
