    In our next chapter, we''ll revisit the columnlist and explore an important construct
    that will us to inject logic into the individual columns in the columnlist. This
    is referred to as conditional logic. By using the same Boolean logic operators
    discussed in this chapter, along with a few additional keywords, we''ll be able
    to specify logic that determines how individual columns in the columnlist are
