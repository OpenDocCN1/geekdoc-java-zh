  md: '# Using a Subquery as a Calculated Column


    In this statement, the INNER JOIN enforces the requirement that the user must
    also exist in the Transactions table. Note that this query requires the use of
    a GROUP BY clause to avoid returning more than one row per user.


    # Using a Subquery as a Calculated Column


    The final use of subqueries is as a calculated column. Suppose we would like to
    see a list of users, along with a count of the number of transactions they have
    placed. This can be accomplished without subqueries using this statement:


    ```

    SELECT

    Username AS ''User Name'',

    COUNT(TransactionID) AS ''Number of Transactions''

    FROM Users

    LEFT JOIN Transactions

    ON Users.UserID = Transactions.UserID

    GROUP BY Users.UserID, Users.UserName

    ORDER BY Users.UserID

    ```


    The output is:


    | User Name | Number of Transactions |

    |---|---|

    | Cecilia Rodriguez | 1 |

    | Elaine Bundy | 3 |

    | Rakesh Gupta | 2 |

    | April Waters | 0 |


    Notice that we used a LEFT JOIN to accommodate users who may not have made any
    transactions. The GROUP BY enforces the requirement that we end up with one row
    per user. The COUNT function produces a count of the number of rows in the Transactions
    table.


    Another way of obtaining the same result is to use a subquery as a calculated
    column. This looks like the following:


    ```

    SELECT

    Username AS ''User Name'',

    (SELECT

    COUNT(TransactionID)

    FROM Transactions

    WHERE Users.UserID = Transactions.UserID)

    AS ''Number of Transactions''

    FROM Users

    ORDER BY Users.UserID

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'In this example, the subquery is a correlated subquery. The subquery cannot
    be executed on its own, because it returns a column from the Users table in the
    WHERE clause. This subquery returns a calculated column for the SELECT columnlist.
    In other words, after the subquery is evaluated, it returns a single value, which
    is included in the columnlist. Here''s the general format of the statement:


    ```

    SELECT

    UserName AS ''User Name'',

