    Oracle doesn''t have a function comparable to DATEPART.


    The date/time difference we''ll cover, enables you to determine quantities such
    the number of days between any two dates. The general format is:

    DATEDIFF(Date, StartDate, EndDate)


    Valid values for the DatePart argument in this function include year, quarter,
    month, dayofyear, day, month, hour, and second. Here''s a chart that shows how
    the DATEDIFF function evaluates the difference between the dates 7/8/2017 and
    8/14/2017, with different values for the DatePart argument:


    | DATEPART | Resulting Value |

    |---|---|n| DATEDIFF(day, ''7/8/2017'', ''8/14/2017'') | 37 |

    | DATEDIFF(week, ''7/8/2017'', ''8/14/2017'') | 6 |

