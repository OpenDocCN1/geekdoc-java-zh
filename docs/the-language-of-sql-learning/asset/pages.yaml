  md: '# Chapter 9 Summarizing Data


    The order in which the columns are listed in the GROUP BY clause has no significance.

    The results would be the same if the clause were:


    ```

    GROUP BY Student, GradeType

    ```


    However, as the order in which columns are listed in the ORDER BY clause is meaningful.

    If you switch the ORDER BY clause to:


    ```

    ORDER BY Student, GradeType

    ```


    The resulting data is:


    | GradeType | Student | AverageGrade |

    | Homework | Hailey | NULL |

    | Quiz | Hailey | 71.5 |

    | Homework | Isabella | 84 |

    | Quiz | Isabella | 93.5 |

    | Homework | Peter | 88 |

    | Quiz | Peter | 66 |


    This looks a bit strange, because it''s difficult to determine at a glance that
    the data is really sorted by Student and by GradeType. As a rule of thumb, it
    usually helps if columns are listed from left to right in the order in which columns
    are sorted. A understandable SELECT statement would be:


    ```

    SELECT

    Student AS ''Student'',

    GradeType AS ''GradeType'',

    AVG (Grade) AS ''Average Grade''

    FROM Grades

    GROUP BY GradeType, Student

    ORDER BY Student, GradeType

    ```


    The data now looks like this:


    | Student | Grade Type | Average Grade |

    | Hailey | Homework | 71.5 |

    | Hailey | Quiz | 84 |

    | Isabella | Quiz | 93.5 |

    | Peter | Homework | 88 |

    | Peter | Quiz | 66 |


    This is more comprehensible, because the order corresponds to the sort order.

    There''s sometimes confusion as to the difference between the GROUP BY and ORDER
    BY clauses. The main point to remember is that GROUP BY merely creates the groups.
    The ORDER BY still must be used to list the rows in a meaningful sequence.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Selection Criteria on Aggregates


    After data has been separated into groups via the GROUP BY clause, selection criteria
    become a bit more complex. When applying any kind of selection criteria to a SELECT
    with a GROUP BY, you must ask whether the criteria applies to individual rows
    or the entire group. Whereas the WHERE clause handles selection criteria for individual
    rows, SQL provides a keyword HAVING that allows selection to be applied at the
    group level.


    Returning to the Grades table, let''s say we want to look only at grades that
    are 70 or higher. We''d like to look at individual grades, so as the WHERE clause
    can be used, as normal. A SELECT might look like this:


    The resulting data is:


    | Student | Grade Type | Grade |

    | --- | --- | --- |

    | Hailey | Quiz | 81 |

    | Isabella | Quiz | 92 |

    | Isabella | Quiz | 95 |

    | Peter | Quiz | 74 |


    Notice that quizzes with a score less than 70 aren''t shown. For example, we can
    see Peter''s grade of 74, but not his score of 58.


    To introduce the use of the HAVING clause, let''s say we want to display data
    for students who have an average grade of 70 or more. In this situation, we want
    to select on an average, not on individual rows. This is where the HAVING clause
    comes in. We need to first group grades by student, and then apply selection criteria
    to an aggregate statistic based on the entire group. The following statement produces
    the desired result:


    ```

    SELECT

    Student AS ''Student'',

    AVG(Grade) AS ''Average Quiz Grade''

    FROM Grades

    WHERE GradeType = ''Quiz''

    GROUP BY Student

    HAVING AVG(Grade) >= 70

    ORDER BY Student

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Chapter 9 Summarizing Data


    The output is:


    | Student | Average Quiz Grade |

    |---|---|

    | Hailey | 71.5 |

    | Isabella | 93.5 |


    This SELECT has both a WHERE and a HAVING clause. The WHERE ensures that we only
    select rows with a GradeType of "Quiz". The HAVING guarantees that we only select
    students with an average score of at least 70.


    To take this example step further, what if we wanted to add a column with the
    GradeType value? If we attempt to add GradeType to the SELECT columnlist, the
    statement will error. This is because all columns must be either listed in the
    GROUP BY or in an aggregation. Hence, if we wanted to show the GradeType column,
    it must be added to the GROUP BY clause, as follows:


    ```

    SELECT

    Student AS ''Student'',

    GradeType AS ''Grade Type'',

    AVG(Grade) AS ''Average Grade''

    FROM Grades

    WHERE GradeType = ''Quiz''

    GROUP BY Student, GradeType

    HAVING AVG(Grade) >= 70

    ORDER BY Student

    ```


    The resulting data is:


    | Student | Grade Type | Average Grade |

    |---|---|---|

    | Hailey | Quiz | 71.5 |

    | Isabella | Quiz | 93.5 |


    Now we''ve added the HAVING clause to the mix, let''s recap the general format
    of the SELECT statement with all the clauses used this far:


    ```

    SELECT columnlist

    FROM tablelist

    WHERE condition

    GROUP BY columnlist

    HAVING condition

    ORDER BY columnlist

    ```


    Remember that when employing any of the above keywords in a SELECT, they must
    be listed in the order shown. For example, the HAVING keyword must always come
    after a GROUP BY but before an ORDER BY.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Conditional Logic in GROUP BY Clauses


    In Chapter 8, "Conditional Logic," we saw examples of the CASE expression in the
    columnist of a SELECT statement as well as in the ORDER BY and WHERE clauses.
    When a GROUP BY clause is used in a statement, all expressions in the columnist
    must either be present in the GROUP BY involve an aggregate function. This means
    that when a CASE expression is used in a GROUP BY, the same expression must be
    used in the SELECT columnist. To illustrate, let''s return to the Groceries data
    seen in the previous chapter:


    | GroceryID | CategoryCode | Description |

    | 1 | F | Apple |

    | 2 | F | Orange |

    | 3 | S | Mustard |

    | 4 | V | Carrot |

    | 5 | B | Water |


    In this example, we want to group by the category computed by the CASE expression—namely,
    Fruit, Vegetable, or Other. The objective is to produce a count of how many products
    are in each category. Here''s the statement:


    ```

    SELECT

    CASE CategoryCode

    WHEN ''F'' THEN ''Fruit''

    WHEN ''V'' THEN ''Vegetable''

    ELSE ''Other''

    END AS ''Category'',

    COUNT(*) AS ''Count''

    FROM Groceries

    GROUP BY

    CASE CategoryCode

    WHEN ''F'' THEN ''Fruit''

    WHEN ''V'' THEN ''Vegetable''

    ELSE ''Other''

    END

    ```


    The output appears as:


    | Category | Count |

    | Fruit | 2 |

    | Other | 2 |

    | Vegetable | 1 |


    Notice that the same CASE statement is used in the SELECT columnist and in the
    GROUP BY clause.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Conditional Logic in HAVING Clauses


    To illustrate the use of conditional logic in HAVING clauses, let''s return to
    the HAVING clause example from earlier in this chapter. In that situation, we
    displayed data for students who had an average grade of 70 or higher. The statement
    was:


    ```

    SELECT

    Student AS ''Student'',

    GradeType AS ''Grade Type'',

    AVG(Grade) AS ''Average Grade''

    FROM Grades

    WHERE GradeType = ''Quiz''

    GROUP BY Student, GradeType

    HAVING AVG(Grade) >= 70

    ORDER BY Student

    ```


    In this scenario, the WHERE clause selected quizzes. We declared a GROUP BY student
    and grade type and then applied the aggregate selection in the HAVING clause to
    enforce the restriction that we only students with an average quiz of at least
    70.


    In this new example, we use a column in the data that was previously ignored—namely,
    the YearInSchool column. With this additional information, we''ll alter the previous
    statement to list students with an average grade of at least 70 if they''re a
    Year 7, or an average grade of 75 if they''re a Year 8. If they''re not Year 7
    or Year 8, we''ll alter the students with an average grade of 80. To accomplish
    this goal, we''ll need to place a CASE expression in the HAVING clause. We''ll
    also display the YearInSchool column, as follows:


    ```

    SELECT

    Student AS ''Student'',

    YearInSchool AS ''Year in School'',

    GradeType AS ''Grade Type'',

    AVG(Grade) AS ''Average Grade''

    FROM Grades

    WHERE GradeType = ''Quiz''

    GROUP BY Student, YearInSchool

    HAVING AVG(Grade) >=

    CASE

    WHEN YearInSchool = 7 THEN 70

    WHEN YearInSchool = 8 THEN 75

    ELSE 80

    END

    ORDER BY Student

    ```


    The HAVING clause states that the average grade must be greater than the number
    returned by the CASE expression. The CASE expression will provide a value of either
    70, 75, or 80, depending on the value of the YearInSchool column. The result is:


    | Student | Year in School | Grade Type | Average Grade |

    | Isabella | 7 | Quiz | 93.5 |


    Isabella is now the only student listed, because she is only person who satisfies
    the new criteria.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Ranking Functions


    In addition to the grouping techniques discussed previously in this chapter, SQL
    provides a number of special ranking functions that allow for the classification
    of rows by a method of sequential classification. There are four basic ranking
    functions:


    +   Row_Number

    Rank

    Dense_Rank

    NTILE


    The ROW_NUMBER function creates rows based on a specified order of another column
    or expression associated with the function. After the rows have been placed in
    the specified order, the generated rows will start with 1 and increase to 2, 3,
    4, and so on. The ROW_NUMBER function requires no parameters.


    The RANK function is the same as ROW_NUMBER except if two or more rows have the
    same value for the specified column or expression, they both give the same number.
    For example, if the second and third rows have the same value, the generated ranks
    will be 1, 2, 2, 4, and so on. Because the two rows with a value 2 have the same
    value, SQL skips the number.


    The DENSE_RANK function is the same as the RANK function that it does not skip
    any numbers, even when there are duplicate values. In the preceding example, the
    dense rank will be 1, 2, 3, and so on. The number 3 is not skipped.


    Finally, the NTILE function allows for the generation of a percentile or any other
    n based on the specified order of another column or expression. Unlike RANK, ROW_NUMBER,
    and DENSE_RANK, NTILE requires a parameter. For example, the function NTILE(100)
    will assign percentiles. Percentiles are a number from 1 to 100 that represents
    the relative rank of the value. However, any other number can be used as the argument
    for the function. Thus, the function NTILE(10) will decile, and produce four quartiles.


    Let''s illustrate ranking with a few examples, on the following table:


    | StockSymbol | StockName | Exchange | PriceEarningsRatio |

    |---|---|---|--|

    | AAPL | Apple Inc | NASDAQ | 14 |

    | AMZN | Amazon.com Inc | NASDAQ | 489 |

    | DIS | The Walt Disney Company | NYSE | 21 |

    | GE | General Electric Company | NYSE | 18 |

    | GOOG | Alphabet Inc | NASDAQ | 30 |

    | HSY | The Hershey Company | NYSE | 26 |

    | KRFT | Kraft Foods Inc | NYSE | 12 |

    | KO | The Coca-Cola Company | NYSE | 21 |

    | MCD | McDonalds Corporation | NYSE | 18 |

    | MMM | 3M Company | NYSE | 20 |

    | MSFT | Microsoft Corporation | NASDAQ | 15 |

    | ORCL | Oracle Corporation | NASDAQ | 17 |

    | SBUX | Starbucks Corporation | NASDAQ | 357 |

    | WBA | Walgreens Boots Alliance Inc | NYSE | 24 |

    | WMT | Wal-Mart Stores Inc | NYSE | 15 |'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Chapter 9 Summarizing Data


    This table lists stocks, showing their symbol, their name, the exchange they trade
    on, and their price-earning (PE) ratio. For example, Apple (AAPL) is traded on
    the NASDAQ and has a PE ratio of 14.


    In this example, we''ll sort all the rows by PE ratio and use the ROW_NUMBER function
    to generate a number for each row. We will sort the rows by PE from lowest to
    highest. We''re displaying low PE''s, since a low PE is generally better than
    a high PE. A statement that accomplishes this is:


    ```

    SELECT

    ROW_NUMBER() OVER (ORDER BY PriceEarningsRatio) AS ''Row'',

    StockSymbol AS ''Symbol'',

    StockName AS ''Name'',

    Exchange AS ''Exchange'',

    PriceEarningsRatio AS ''PE Ratio''

    FROM Stocks

    ORDER BY PriceEarningsRatio

    ```


    The output of this statement is:


    | Row | Symbol | Name | Exchange | PE Ratio |

    |---|---|---|---|---|n| 1 | KRFT | Kraft Foods Inc | NYSE | 12 |

    | 2 | AAPL | Apple Inc | NASDAQ | 14 |

    | 3 | MSFT | Microsoft Corporation | NASDAQ | 15 |

    | 4 | WMT | Wal-Mart Stores Inc | NYSE | 15 |

    | 5 | ORCL | Oracle Corporation | NASDAQ | 17 |

    | 6 | GE | General Electric Company | NYSE | 18 |

    | 7 | MCD | McDonald''s Corporation | NYSE | 18 |

    | 8 | MMM | 3M Company | NYSE | 20 |

    | 9 | DIS | The Walt Disney Company | NYSE | 21 |

    | 10 | KO | The Coca-Cola Company | NASDAQ | 21 |

    | 11 | WBA | Walgreens Boots Alliance Inc | NYSE | 24 |

    | 12 | HSY | The Hershey Company | NYSE | 26 |

    | 13 | GOOG | Alphabet Inc | NASDAQ | 30 |

    | 14 | SBUX | Starbucks Corporation | NASDAQ | 357 |

    | 15 | AMZN | Amazon.com Inc | NASDAQ | 489 |


    Let''s explain how this works. First, note that there are no selection criteria
    or grouping in this statement. The ORDER BY clause (the last line of the statement)
    is necessary to list the rows in the desired order, by PE ratio. The main bit
    of complexity in this statement is the first item in the columnlist, which uses
    the ROW_NUMBER ranking function. Note that this value includes an OVER keyword
    as well as another ORDER BY in parentheses. The general format for a columnlist
    element that includes a ranking function is:


    ```

    Rank_Function() OVER (ORDER BY expression [[ASC] | [DESC]])

    ```'
