- pgno: 171
  md: '# 15


    # Set Logic


    Keywords Introduced

    UNION · UNION ALL · INTERSECT · EXCEPT


    The various joins and subqueries of the previous few chapters have dealt with
    different ways of combining data from multiple tables. The result, however, has
    always been a single SELECT statement. Now we''ll extend the concept of combining
    data in multiple tables to the possibility of combining data from multiple queries.
    In other words, we''ll look at a way to write a single SQL statement that contains
    more than one SELECT to retrieve data.


    The concept of combining queries is often referred to as set logic, a term taken
    from mathematics. Each SELECT query can be referred to as a set of data. The set
    logic we''ll employ and examine in this chapter will address four basic scenarios.
    Assuming that we have data in SET A and in SET B, here are the possibilities for
    retrieving data from the two sets:


    +   - Data that is in SET A or in SET B

    - Data that is in both SET A and SET B

    - Data that is in SET A but not in SET B

    - Data that is in SET B but not in SET A


    We''ll start by looking at the first scenario, for which we want data included
    in SET A or in SET B. As we''ll see, this is the most prevalent and important
    of the set logic possibilities.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Using the UNION Operator


    The UNION operator in SQL is used to handle logic select data in either SET A
    or SET B. This is by far the most common situation. We''ll start with an example.
    Let''s say we have two tables in our database. The first is Orders table containing
    data on orders placed by customers. We''ll use the same Orders table seen in the
    few chapters:


    | OrderID | CustomerID | OrderDate | OrderAmount |

    |---|---|---|--|

    | 1 | 1 | 2016-09-01 | 10.00 |

    | 2 | 2 | 2016-09-02 | 12.50 |

    | 3 | 2 | 2016-09-03 | 18.00 |

    | 4 | 3 | 2016-09-15 | 20.00 |


    The second table, Returns, contains data on merchandise returned by customers.
    It might look like this:


    | ReturnID | CustomerID | ReturnDate | ReturnAmount |

    |---|---|---|--|

    | 1 | 1 | 2016-09-10 | 2.00 |

    | 2 | 2 | 2016-09-15 | 15.00 |

    | 3 | 3 | 2016-09-28 | 3.00 |


    Note, unlike the Refunds table in Chapters 12 and 13, this Returns table is not
    directly related to the Orders table. In other words, returns are not tied to
    a specific order. In this scenario, a customer might return merchandise from multiple
    orders in a single refund transaction.


    We want to create a report of all orders and returns from one particular customer.
    We would like the results sorted either by the order date if it''s an order, or
    the return date if it''s a return. Following is a statement that can accomplish
    this. We''ve inserted a few extra blank lines in this statement to emphasize the
    fact it contains two completely separate SELECTs, combined by the UNION operator:


    ```

    SELECT

    OrderDate as ''Date'',

    ''Order'' AS ''Type'',

    OrderAmount AS ''Amount''

    FROM Orders

    WHERE CustomerID = 2


    UNION


    SELECT

    ReturnDate as ''Date'',

    ''Return'' AS ''Type'',

    ReturnAmount AS ''Amount''

    FROM Returns

    WHERE CustomerID = 2


    ORDER BY Date

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Using the UNION Operator 157


    The resulting data is:


    | Date | Type | Amount |

    |---|---|---|

    | 2016-09-02 | Order | 12.50 |

    | 2016-09-03 | Order | 18.00 |

    | 2016-09-15 | Return | 15.00 |


    As you can see, the UNION operator separates two SELECT statements. Each of these
    SELECT statements are capable of being run on its own. There is also an ORDER
    BY clause at the very end, which applies to the results of both SELECT statements.
    The general format for the previous statement is:


    ```

    SelectStatementOne

    UNION

    SelectStatementTwo

    ORDER BY columnlist

    ```


    In order for the UNION to work, three rules must be followed:


    +   * ALL SELECT statements combined with a UNION must have the same number of
    columns in the SELECT columnlist.

    * All columns in each SELECT columnlist must be in the same order.

    * All corresponding columns in each SELECT columnlist must have the same, or compatible,
    datatypes.


    With reference to these rules, notice that both SELECT statements in the query
    have three columns. Each of the three columns has the same order and with the
    same datatype.


    When using the UNION, you use column aliases to give the same column name to all
    corresponding columns. In our example, the first column of the FIRST SELECT has
    an original name of OrderDate. The first column of the SECOND SELECT has an original
    name of ReturnDate. To ensure that the column in the final result has the desired
    name, both OrderDate and ReturnDate are given a column alias. This also allows
    the column to be referenced in an ORDER BY columnlist.


    Also notice that the code of each SELECT uses literal values. We created a calculated
    column name, which has a value of either Order or Return. This allows us to determine
    which table comes from rows.


    Finally, notice that the ORDER BY clause applies to the results of both queries
    combined. If it was not how, there would be no point in applying a sort to the
    individual queries.


    At this point, it''s useful to step back and talk why it was necessary to employ
    the UNION operator rather than simply joining the Orders and Returns together
    in a single SELECT statement. Because both tables have a CustomerID, why didn''t
    we join the two tables together on this column? The problem with that approach
    is that the tables are only indirectly related to each other. Customers can place
    orders and customers can initiate returns, but there is no direct connection between
    orders and returns.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Additionally, even if there were a direct connection between the two tables,
    a join would not accomplish what is desired. With a proper join, related information
    can be placed together on the same row. In this case, however, we are interested
    in showing orders and returns on separate rows. The UNION operator must be used
    to display data in this manner.

    In essence, the UNION allows to retrieve unrelated or partially related data in
    a single statement.


    # Distinct and Non-Distinct Unions


    There are actually two variations of the UNION operator: UNION and UNION ALL.
    There is only a slight difference between the two. The UNION operator eliminates
    duplicate rows. The UNION ALL specifies that all rows will be included, even if
    they are duplicates.


    The UNION operator eliminates duplicates in a manner similar to the DISTINCT keyword
    previously. Whereas DISTINCT applies to a single SELECT, the UNION eliminates
    duplicates in all SELECT statements combined via the UNION.


    In the next example with the Orders and Returns tables, there was no possibility
    of duplication, so didn''t matter which variation of the UNION was used. Here
    is an example that illustrates the difference. Let''s say we were only interested
    in the dates on which any order or return was issued. We don''t want to see multiple
    rows for the same date. The following statement accomplishes this.


    ```

    SELECT

    OrderDate As ''Date''

    FROM Orders

    UNION

    SELECT

    ReturnDate as ''Date''

    FROM Returns

    ORDER BY Date

    ```


    The resulting data is:


    | Date |

    | 2016-09-01 |

    | 2016-09-02 |

    | 2016-09-03 |

    | 2016-09-10 |

    | 2016-09-15 |

    | 2016-09-28 |


    Notice that there is one row with the date 2016-09-15. Even though there is one
    row with 2016-09-15 in the Orders table and one row with 2016-09-15 in the Returns
    table, the UNION operator ensures that the 2016-09-15 date is listed only once.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'If for some reason we wanted to see the date 2016-09-15 listed twice, we could
    employ the UNION ALL operator to accomplish this:


    ```

    SELECT

    OrderDate AS ''Date''

    FROM Orders

    UNION ALL

    SELECT

    ReturnDate as ''Date''

    FROM Returns

    ORDER BY Date

    ```


    The output is now:


    | Date |

    | 2016-09-01 |

    | 2016-09-02 |

    | 2016-09-03 |

    | 2016-09-10 |

    | 2016-09-15 |

    | 2016-09-24 |


    As you can see, the UNION ALL operator allows duplicate rows to be displayed.


    # # Intersecting Queries


    The UNION and UNION ALL operators return data in either of the sets specified
    in the two SELECT statements being combined. This is like using an OR operator
    to combine data from logical sets.


    SQL provides an operator called INTERSECT that only pulls data that is in both
    of the two sets being looked at. The INTERSECT is analogous to the AND operator
    and handles the second scenario stated at the beginning of this chapter:


    +   - Data is in both SET A and SET B


    > Database Differences: MySQL

    MySQL doesn''t support the INTERSECT operator.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Using the same Orders and Returns tables, suppose we want to see dates on which
    there are both orders and returns. A statement that accomplishes this is:


    ```

    SELECT

    OrderDate AS ''Date''

    FROM Orders

    INTERSECT

    SELECT

    ReturnDate as ''Date''

    FROM Returns

    ORDER BY Date

    ```


    The result is:


    | Date |

    | 2016-09-15 |


    Only one row is shown because this is the only date that appears in both the Orders
    and Returns tables.


    There is one additional variation on the INTERSECT operator, which is provided
    by the EXCEPT operator. Whereas the INTERSECT returns data that is in both sets,
    the EXCEPT returns data that is in one set not the other. Accordingly, this handles
    the third and scenarios stated at the beginning of this chapter:


    +   - Data that is in SET A but not in SET B

    - Data that is in SET B but not in SET A


    The general format of the EXCEPT is:


    ```

    SelectStatementOne

    EXCEPT

    SelectStatementTwo

    ORDER BY column

    ```


    This statement will show data that is in SelectStatementOne but not in SelectStatementTwo.

    Here''s an example:


    ```

    SELECT

    OrderDate AS ''Date''

    FROM Orders

    EXCEPT

    SELECT

    ReturnDate as ''Date''

    FROM Returns

    ORDER BY Date

    ```'
