    of combining entire queries into a single SQL statement. This is a special type
    of logic that allows us to merge multiple data sets into a single result. As you''ll
    see, set logic procedures are sometimes necessary in order to display sets of
    data that are only partially related to each other. As with subqueries, the techniques
    of set logic provide additional flexibility and logical possibilities for your
