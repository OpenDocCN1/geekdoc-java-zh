- pgno: 127
  md: '# Creating Crosstab Layouts


    row and VT column and then find the intersection. with the traditional aggregated
    summary, we would need to scan the rows until until we locate the row with the
    desired Channel and State values.


    Let''s now see how the crosstab output was accomplished. A query that creates
    this output is:


    ```

    SELECT *

    FROM

    (Channel, State, SalesAmount FROM SalesSummary) AS mainquery

    PIVOT (SUM(SalesAmount) FOR State IN ([NY], [VT])) AS pivotquery

    ```


    This is a bit more complex than anything we''ve seen previously. In a way, this
    is like combining two queries together—a topic that will be discussed in Chapters
    13 and 14. In order to decipher this, we''ll need to break down the statement
    into its components. The portion of the second line of the query''s within parentheses
    is:


    ```

    SELECT

    Channel,

    State,

    SalesAmount

    FROM SalesSummary

    ```


    This query selects all data for the three columns of interest in the SalesSummary
    table. The AS keyword that follows is used to provide an alias for the entire
    query. In this case, we''re calling it maine, which is an arbitrary name; we could
    have called it


    The third line introduces the PIVOT operator. This keyword indicates that we will
    pivot the data items by. This means that we want to data in a crosstab format.
    The first item is always an aggregation function. In this example, it is:


    ```

    SUM(SalesAmount)

    ```


    This indicates that we sum values in the SalesAmount column. The FOR keyword that
    follows the aggregation function from the field that we want to appear as separate
    columns in the pivot table. In this example, we want values for State to appear
    as separate columns. The IN separates the column name from the values that we
    want to appear as column headers. The PIVOT operator requires us to explicitly
    state the values we want as column headers. In this example, those values are
    NY and VT. Note that SQL Server requires that these enumerated values be enclosed
    in brackets rather than the single quotes. Finally, we assign an alias to the
    entire PIVOT expression, which in this example is pivotquery. Like the maine alias,
    this is an entirely arbitrary name.


    To recap, we''ve seen that this statement has this general structure:


    ```

    SELECT *

    FROM

    (SELECT query that produces the data) AS alias_for_source_query

    PIVOT (aggregation_function(column))

    FOR column for_column_headers

    IN pivot_column_values

    AS alias_for_pivot_table

    ```


    It might first appear that this was a lot of unnecessary extra to produce a result
    that''s not significantly more useful than the original output. To better illustrate
    the value of the PIVOT'
