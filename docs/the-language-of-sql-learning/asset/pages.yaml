  img_proc: true
- pgno: 31
  md: 'The general format of this statement is:


    ```

    SELECT columnlist

    FROM table

    ```


    The important thing to remember is that if you need to specify more than one column
    in the columnlist, those columns must be separated by a comma. Also notice that
    we placed each column (FirstName, LastName) in the columnlist on separate lines.
    This was done to improve readability.


    # Column Names with Embedded Spaces


    If a column contains a space in its name? Say, for example, that the LastName
    column was specified as Last Name (with a space between the two words). Clearly,
    the following would not work:


    ```

    SELECT

    Last Name

    FROM Customers

    ```


    This statement would be considered invalid because Last and Name are not column
    names, and even if they were proper column names, they would need to be separated
    by a comma. The character to use differs, depending on which database you''re
    using. For Microsoft SQL Server, the required characters are square brackets.
    The syntax is:


    ```

    SELECT

    [Last Name]

    FROM Customers

    ```


    One additional note: Just as keywords are not case sensitive, it''s also true
    that table and column names are not case sensitive. As such, the previous example
    is identical to:


    ```

    select

    [last name]

    from customers

    ```


    For clarity''s sake, we''ll print all keywords in caps, and we''ll also capitalize
    table and column names in this book, but that is not truly necessary.'
