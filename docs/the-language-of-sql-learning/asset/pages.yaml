    As expected, NULLs come first, values with numeric digits, and then values with
    alphabetic characters. Note that 23 comes before 5. This is because the 23 and
    5 values are being evaluated as characters, not as numbers. Because character
    data is evaluated from left to right and 2 is lower than 5, 23 is displayed first.


    # Looking Ahead


    In this chapter, we talked about the basic possibilities for sorting data in a
    specific order. We illustrated how to sort by more than one column. We also discussed
    the use of calculated fields in sorts. Finally, we covered some of the quirks
    of sorting, particularly when it comes to data with NULL values and numbers in
    character columns.


    At the beginning of the chapter, we mentioned some of the general uses for sorts.
    Primary among these is the ability to simply place data in an easily understood
    order, People generally like to see data in kind of order, and sorts accomplish
    that goal. Another interesting use of sorts will be covered in Chapter 6, "Selection
    Criteria." In that chapter, we''ll introduce the keyword TOP and another way to
    use sorts in conjunction with that. This technique, commonly known as a Top N
    sort, allows us to do such things as display columns with the highest orders for
    a given time period.


    In our next chapter, we''ll move beyond our analysis of what can be done with
    columnlists and discuss data selection. The ability to specify selection criteria
    in SELECT statements is critical to most normal queries. In the real world, it
    would be unusual to issue a SELECT statement without some sort of selection criteria.
    The topics discussed in the next chapter address this important topic.'
