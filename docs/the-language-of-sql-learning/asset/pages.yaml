    this example. In fact, most of the sample data we''ll show throughout the book
    will include a similar column that is both a primary key and defined as auto-increment.
    By convention, this is generally the first column in a table.


    # Syntax Notes


    Two points must be remembered when writing SQL statement. First, the keywords
    in SQL are not case sensitive. The SELECT is treated identically to "select" or
    "Select."


    Second, a SQL statement can be written on any number of lines and with any number
    of spaces between words. For example, the SQL statement:


    ```

    SELECT * FROM Customers

    ```


    is identical to:


    ```

    SELECT *

    FROM Customers

    ```


    It''s a good idea to begin each important keyword on a separate line. When we
    get to more complex SQL statements, this will make it easier to quickly grasp
    the meaning of the statement.'
  merge: -1
