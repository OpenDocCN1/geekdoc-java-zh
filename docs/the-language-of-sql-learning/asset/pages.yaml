  md: '# Chapter 12 Outer Joins


    This keeps the syntax simple and consistent. At the end of this chapter, we''ll
    also illustrate something called the CROSS JOIN, but join is neither an inner
    nor an outer join and is seldom used.


    We''ll use three tables in our examples of outer joins. The first will be a Customers
    table with information about each customer. The second will be an Orders table
    with data on each order placed. We''ll reference Customers and Orders tables with
    the same data seen in the previous chapter. Finally, we''ll add a Refunds table
    with information about any refunds that have been issued to customers.


    12.1 shows how these three tables are related.


    | Customers | Orders | Refunds |

    | --- | --- | --- |

    | CustomerID | OrderID | RefundID |

    | FirstName | CustomerID | RefundDate |

    | LastName | OrderDate | RefundAmount |


    Figure 12.1 Entity-relationship diagram for three tables


    In contrast to the figure seen in the previous chapter, the lines connecting the
    tables are now shown as arrows. For example, the arrow drawn from the CustomerID
    field of the Customers table to the Orders table indicates that the link between
    the Customers and Orders table is possibly one-sided, in the sense that there
    may not be orders for a given customer. Additionally, there may be multiple references
    for a single customer. the arrow drawn between the Orders and Refunds tables indicates
    that there may not be any refunds for a given order, and that there may be multiple
    refunds for an order.


    The line between the Customers and Orders table connects the CustomerID columns
    because that is the common link between the two tables. Similarly, the line between
    the Orders and Refunds tables is on the OrderID column because the OrderID is
    the common link between those two tables.


    In other words, the Orders table is related to the Customers table by customer.
    There must be a customer for an order to exist. The Refunds table is related to
    the Orders table by order. There must be an order before a refund exists. Note
    that the Refunds table is not directly related to the Customers table; those two
    tables don''t share a common field. However, by joining all three tables, we will
    be able to determine which customer a refund is for.


    Let''s examine the contents of each table. The Customers table has these values:


    | CustomerID | FirstName | LastName |

    | --- | --- | --- |

    | 1 | Sara | Davis |

    | 2 | Rumi | Shah |

    | 3 | Paul | Johnson |

    | 4 | Samuel | Martinez |'
