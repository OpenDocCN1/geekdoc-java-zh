- pgno: 199
  md: '# # Table Columns


    Tables are defined as containing any number of columns. Each column has a variety
    of attributes specific to that column. The first and most obvious attribute is
    the column name. Each column must be given a unique name to that table.


    A second attribute of columns is the datatype, a subject that was addressed in
    Chapter 1. We''ve already described some notable datatypes in three main categories:
    numeric, character, and date/time. The datatype is a key determinant of the type
    of data each column can contain.


    A third attribute of columns is whether or not it can be an auto-increment column.
    We briefly introduced this attribute type in Chapters 1 and 2 and discussed it
    in the preceding chapter after modifying data. Basically, an auto-increment column
    means that the column is automatically assigned a numeric value, in ascending
    sequence, as each row is added to the table. Auto-increment columns are often
    used with primary keys but can also be assigned to an ordinary column.


    Note that the term auto-increment is specific to MySQL. Microsoft uses the term
    identity to refer to the same type of attribute.


    # Database Differences: Oracle


    Oracle doesn''t have an auto-increment type of attribute. Instead, Oracle requires
    you to define a column as a sequence and then create a trigger to populate that
    column with sequential values. This procedure is beyond the scope of this book.


    A fourth column attribute is whether or the column is allowed to contain NULL
    values. The default is to allow NULL values. If you don''t want to allow a column
    to contain NULLs, it is normally specified by a NOT NULL keyword applied to the
    column description.


    The final column attribute we''ll mention is whether the column is assigned a
    default value. A default value is automatically assigned to the column if no value
    is provided when a row is added. For example, if most of your customers are in
    the US, you may want to specify that a column containing a country code be given
    a default value of US.


    # # Primary Keys and Indexes


    Let''s turn to the topic of primary keys and explain how that attribute relates
    to table indexes.


    Indexes are a physical structure that can be added to any column in a database
    table. Indexes serve the purpose of speeding up data retrieval when that column
    is involved in a SQL statement. The actual data in the index is hidden, but basically
    the index involves a structure that maintains information on the sort order of
    the column, allowing for quicker retrieval when specific values are requested.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'A downside to indexing a column is that it requires more disk storage in the
    database. A second negative is that indexes generally slow down data updates involving
    column. This happens because any time a row is inserted or modified, the index
    must recalculate the proper sorted order for values in that column.


    Any column can be indexed, but only one column can be designated as a primary
    key. Specifying a column as a primary key means two things: the column will be
    indexed, and the column will be guaranteed to contain unique values.


    As discussed in Chapter 1, primary keys accomplish two main benefits for the database
    user. They enable you to uniquely identify a single row in a table, and they allow
    you to easily relate tables to one another. And now, a third benefit can be-named,
    that by being indexed, the primary key enables faster retrieval of rows involving
    column.


    The main reason for having primary keys is to guarantee unique values for all
    rows in a table. There must always be a way of identifying single rows for updates
    or deletes, and the primary key ensures that this be done.


    Moreover, a primary key can span more than one column and consist of two columns.
    If the primary contains more than one column, it simply means that all columns
    together will contain a unique value. This type of primary key is referred to
    as a *composite key*. As an example of when a composite primary key might identify
    each movie in the table. Rather using a MovieID integer value as the key, you
    would like to use the movie title as the key. The problem, however, is that there
    exist more than one movie with the same title. To solve this, you might want to
    use two columns—the movie title and the release date—to form a composite primary
    to uniquely define each movie.


    Because primary keys must contain unique values, they are never allowed to contain
    NULL values. Some value for the column must be specified.


    Finally, primary keys are often specified as auto-increment columns. By making
    a primary key auto-increment, developers don''t need to worry about assigning
    a unique value for the column. auto-increment feature takes care of that.


    # Foreign Keys


    SQL databases can also designate specific columns as a foreign key. A foreign
    key is simply a reference from a column in one table to a column in a different
    table. When setting up a foreign key, you will be asked to specify both columns.
    The foreign key in the table being configured often referred to as being in the
    *child table*. The referenced column in the other table is referred to as being
    in the *parent table*.


    For example, let''s say you have a Customers table with a CustomerID column set
    up as a primary key. You also have an Orders table with an OrderID column set
    up as a primary key, as well as a CustomerID column. In this scenario, you can
    set up the CustomerID column in the'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Creating Tables


    Orders table as a foreign key that references the CustomerID column in the Customers
    table.

    in this situation, the Orders table is the child table and the Customers table
    is the parent table.

    The idea of the foreign key is to ensure that the CustomerID in the Orders table
    points to an existing customer in the Customers table, using the CustomerID column
    in both tables as the common element.


    When a foreign key is set up, some specific actions can be set pertaining to updates
    and deletes for rows in the parent table. The three most common actions are:


    +   - No Action

    - Cascade

    - Set Null


    These three actions can be specified for either updates or deletes. Continuing
    with the example of Customers and Orders tables, the most common action that might
    be specified is No Action. This is normally the default action if none is specified.
    If the CustomerID column in the Orders table is set to No Action for updates,
    means that a check is made whenever an update is performed in the parent table
    on the CustomerID column. If SQL tries to perform an update on the column that
    would result in any row in the child table pointing to a value that no longer
    exists, it will prevent that action from occurring. The same would be true if
    No Action is specified for deletes. This ensures that, when the CustomerID column
    in either table, all rows in the Orders table properly point to an existing row
    in the Customers table.


    The second alternative for a specified action for foreign keys is Cascade. This
    means that when a value in a parent table is updated, and that value affects rows
    in the child table to reflect the new value in the parent table. Similarly, if
    a row in the parent table is deleted, and if that affects rows in the child table,
    SQL will automatically delete affected rows in the child table.


    The third alternative for a specified action for foreign keys is Set Null, which
    is sometimes used for deletes. This means that when a value in a parent table
    is deleted, and if that value affects rows in the child table, SQL will automatically
    update all affected rows in the child table to contain a NULL value in the foreign
    key, indicating that a corresponding row doesn''t exist.


    # Creating Tables


    The CREATE TABLE statement can be used to create new tables in a database. The
    syntax and available features vary among databases. We''ll illustrate this with
    a simple example that create table with these:


    +   - The table name is MyTable.

    - The first column in the table is named ColumnOne and is defined as a primary
    key. This column will be defined as an INT (integer) datatype and also as an auto-increment
    column.'
