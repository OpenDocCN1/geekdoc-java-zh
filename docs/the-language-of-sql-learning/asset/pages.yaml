    In addition to allowing summation of values, the pivot table allows other options,
    such as count, average, and so on. However, understand that only summable values
    can be placed in the Rows of the pivot table. In this sense, pivot tables are
    a close cousin of the star dimensional design discussed in Chapter 19. Whereas
    dimensional data can be placed in the Rows, Columns, or Filters area, summable
    quantities belong to the Values area. The Values area of the pivot table is analogous
    to data in a Fact table of a star schema design.


    In addition to allowing you to move fields between the areas of the pivot table,
    Excel also provides a few interesting Report Layout options. There are three basic
    layout options for pivot tables:


    +   - Compact Form

    - Outline Form

    - Tabular Form


    When a pivot table is selected, these options appear under the Design tab of the
    Ribbon. The layout in Figures 20.7 and 20.8 is Compact Form. After switching the
    layout of Figure 20.8 to Outline Form, the pivot table appears as in Figure20.9.'
