- pgno: 150
  md: '# Looking Ahead


    This chapter extended our discussion of joins to outer joins. The left join enables
    the analyst to join a primary and secondary table together, showing all rows in
    the primary table even if there is no match in the secondary table. The right
    join is simply the reverse of the left join, switching the order of the primary
    and secondary tables. Finally, the full join displays all rows in each table,
    even if there is no match in the other table. We also talked about the cross join,
    a seldom used join type that shows all combinations of rows from both tables being
    joined. In a cross join, the relationship between the tables, if one exists, is
    not stated.


    In our next chapter, “Self Joins and Views,” we''ll take another slight detour
    to two related topics. First, we''ll discuss self joins, which is a special technique
    that allows us to join a table to itself. This creates a virtual view of the table,
    in the sense that we can now view this table from two different perspectives.
    The second main topic of the following chapter will extend the concept of self
    joins to a more general way of creating virtual views of multiple tables.'
