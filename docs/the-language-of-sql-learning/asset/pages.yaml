    | Exchange | Quartile | Symbol | PE Ratio |

    |---|---|---|--|

    | NASDAQ | 1 | AAPL | 14 |

    | NASDAQ | 1 | MSFT | 15 |

    | NASDAQ | 2 | ORCL | 17 |

    | NASDAQ | 2 | GOOG | 30 |

