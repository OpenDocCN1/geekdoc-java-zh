    # Chapter 9: Tuples, Lists and Dictionaries


    We have seen earlier that variables are used to store little information, but
    what if one needs to store a list of data that doesn’t change with time.


    For example consider a phone book. You have a lot of contact names and their numbers
    saved in it which do not change with time. So, it is highly difficult to create
    such thing with the help of variables. So, the problem can be solved using lists,
    tuples and dictionaries.  Lists can be defined as a set of values. Numbering of
    each list is done starting from zero.  Values can be added at the end of lists
    and if we want we can remove a few as well. Example: A friend list.


