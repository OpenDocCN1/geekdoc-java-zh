    3\. Assignment operators:


    The assignment operators are used for storing the value of an operand in another
    operand. Also, they can be used to assign the result of a calculation as the value
    of an operand.


    Assignment operators used in Python are listed in the following table:


    | Operator | What it is and what it does | Example expressions |


    | = | Assignment operator used between two operands. When used, it assigns the
    value of the right operand to the left operand. | a=6 (Assigns the value 6 to
    a)b=a (Assigns the value of a to b)p= q+r (Assigns the sum value of q+r to p)
    |


    | += | It is the add AND assignment operator and  does both addition and assignment.
    Adds right and left operands and stores the sum in the left operand | p+=q (Adds
    p and q and then stores the sum in p)The above expression is equivalent to the
    expression: p=p+q |


    | -= | It is the subtract AND assignment operator and does both subtraction and
    assignment. It works by subtracting right operand from the left operand and then
    storing the difference in the left operand. | p-=q (Subtracts q from p and then
    stores the difference in p)The above expression is equivalent to the expression:
    p=p-q |


    | *= | It is the multiply AND assignment operator and does both multiplication
    and assignment. It works by multiplying right operand with the left operand and
    then storing the product in the left operand. | p*=q (Multiplies q with p and
    then stores the product in p)The above expression is equivalent to the expression:
    p=p*q |


    | /= | It is the divide AND assignment operator which performs both division and
    assignment. It works by dividing left operand with the right operand and then
    storing the quotient in the left operand. | p/=q (Divides p with q and then stores
    the quotient in p)The above expression is equivalent to the expression: p=p/q
    |


    | %= | It is the modulus AND assignment operator and performs both modulus(remainder)
    and assignment. It works by dividing left operand with the right operand and then
    storing the remainder in the left operand. | p%=q (Divides p with q and then stores
    the remainder in p)The above expression is equivalent to the expression: p=p%q
    |


    | **= | It is the exponent AND assignment operator and performs both exponentiation
    and assignment. It raises the left operand to the power of the right operand and
    then stores the result in the left operand. | p**=q (Raises p to the power of
    q and then stores the result in p)The above expression is equivalent to the expression:
    p=p**q |


    | //= | Performs floor division and assignment operations between the operands
    and stores the result in the left operand.Floor division is equivalent to the
    general division except that the quotient is rounded down in floor division. |
    p//=q (Divides p with q and then stores the rounded quotient in p)The above expression
    is equivalent to the expression: p=p//q |


