- fmt: "\nThe variable type in `Python` can be quickly changed without any fuss or\
    \ errors. It is not possible to do the same in case of static programming languages\
    \ as the variable type cannot be changed during the progression of the program.\
    \ It can be easily integrated with other technologies. `Python` has been designed\
    \ such that it can be easily embedded into other technologies. The productivity\
    \ of the programmers greatly increases while working with `Python`, because of\
    \ its simplicity, readability and support libraries which are easy to use.\n\n\
    Web services can be easily developed using `Python`. `Python` is an ideal programming\
    \ language to work with, if the projects undertaken are big or complex, whose\
    \ requirements change often. Scientific applications make use of tools like `numeric\
    \ Python` and `Scientific Python`. \n\nIn general, an ideal programming language\
    \ for scientific research is the one that allows notepad or paper scribbling to\
    \ be directly translated into a piece of code. `Python` does the job with much\
    \ élan as it looks more like an easy to read pseudo code. `Python` is free software\
    \ and can be freely used for commercial purposes too.\n\n# Chapter 2: Python Installation\n\
    \nThe up-to-date edition with the binaries, current source codes, documentations,\
    \ latest news, etc. can be accessed at the official Python website.\n\nPython\
    \ Official Website: http://www.python.org/\n\nHere, you can download the documentation\
    \ for `Python` from the site. It is accessible in various formats like PDF, HTML,\
    \ and PostScript.\n\nPython Documentation Website: [www.python.org/doc/](http://www.python.org/doc/)\n\
    \n## How to Install Python\n\n`Python` is accessible for various platforms. You\
    \ need to download only the binary code that works fine with the platform and\
    \ you can install `Python` after that. If it is unavailable, then use a C compiler\
    \ that can do manual compilation of the source code. Source code compilation gives\
    \ you suppleness in terms of features required.\n\n### Python Environment Variables\n\
    \n| Variable | Description |\n| :--- | :--- |\n| `PYTHONPATH` | It is similar\
    \ to `PATH`. This variable foretells the `Python` interpreter as to where it can\
    \ locate the module files that you can import in a program. `PYTHONPATH` must\
    \ have a `Python` source library directory and the directories in which your `Python`\
    \ code is present. `PYTHONPATH` is sometimes set by the `Python` installer automatically.\
    \ |\n| `PYTHONSTARTUP` | It has the path for the initialization file which contains\
    \ `Python` source codes that are executed each and every time you work on the\
    \ interpreter. This file is often named `.pythonrc.py` in Unix, which usually\
    \ has commands that can load the utilities or can modify the `PYTHONPATH`. |\n\
    | `PYTHONCASEOK` | This is used in Windows OS for instructing `Python` to find\
    \ case-insensitive matches in an import statement. You can set this to any random\
    \ value for activating it. |\n| `PYTHONHOME` | It is an alternative search path\
    \ that is embedded in `PYTHONSTARTUP` or `PYTHONPATH` directories for switching\
    \ the module libraries very easy. |\n\n## Running Python\n\n`Python` can be run\
    \ on a system in three ways:\n\n### Interactive Interpreter\n\nYou can start by\
    \ entering `python` and then begin programming in its interpreter by beginning\
    \ from the command line on any platform that provides a command line interpreter\
    \ or a shell window.\n\nList of command line options is given in the table below:\n\
    \n| Option | Description |\n| :--- | :--- |\n| `-d` | Provide the output after\
    \ debugging |\n| `-O` | Optimized byte code generation i.e. the `.pyo` file is\
    \ generated |\n| `-S` | Don’t run the import site for searching Python paths in\
    \ a startup. |\n| `-v` | Details of import statement |\n| `-X` | Disable the class\
    \ based built-in exceptions |\n| `-c cmd` | It runs `python` script sent in `cmd`\
    \ String |\n| `File` | `Python` script is run from the given file. |\n\n### Script\
    \ from Command-line\n\nCalling an interpreter on your application can help you\
    \ run and execute your `python` script in command line.\n\n### Integrated Development\
