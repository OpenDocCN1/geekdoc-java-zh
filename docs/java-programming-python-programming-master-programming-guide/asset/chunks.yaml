    # 第 2 章：Python 安装


    可以在 Python 官方网站访问带有二进制文件、当前源代码、文档、最新新闻等的最新版本。


    Python 官方网站：http://www.python.org/


    在这里，你可以从该网站下载 `Python` 的文档。它支持 PDF、HTML 和 PostScript 等多种格式。


    Python 文档网站：[www.python.org/doc/](http://www.python.org/doc/)


    ## 如何安装 Python


    `Python` 适用于多种平台。你只需要下载与该平台良好运行的二进制代码，之后即可安装 `Python`。如果没有二进制文件，可以使用可以对源代码进行手动编译的
    C 编译器。源代码编译让你在所需功能方面更具灵活性。


    ### Python 环境变量


    | 变量 | 说明 |

    | :--- | :--- |

    | `PYTHONPATH` | 它类似于 `PATH`。此变量告诉 `Python` 解释器在何处定位你可以在程序中导入的模块文件。`PYTHONPATH`
    必须包含 `Python` 的源库目录以及存放你的 `Python` 代码的目录。`PYTHONPATH` 有时由 `Python` 安装程序自动设置。 |

    | `PYTHONSTARTUP` | 它包含一个初始化文件的路径，该文件包含 `Python` 源代码，每当你操作解释器时都会执行一次。该文件在 Unix
    中通常命名为 `.pythonrc.py`，通常包含可以加载工具或修改 `PYTHONPATH` 的命令。 |

    | `PYTHONCASEOK` | 这用于 Windows 操作系统，用于指示 `Python` 在导入语句中查找不区分大小写的匹配。你可以将其设置为任何随机值以激活它。
    |

    | `PYTHONHOME` | 这是一个替代搜索路径，嵌入在 `PYTHONSTARTUP` 或 `PYTHONPATH` 目录中，用于轻松切换模块库。
    |


    ## 运行 Python


    `Python` 可以在系统上通过三种方式运行：


    ### 交互式解释器


    你可以通过输入 `python` 开始，然后在任何提供命令行解释器或 shell 窗口的平台上，从命令行开始在它的解释器中进行编程。


    命令行选项列表下表所示：


    | 选项 | 说明 |

    | :--- | :--- |

    | `-d` | 调试后提供输出 |

    | `-O` | 优化的字节码生成，即生成 `.pyo` 文件 |

    | `-S` | 启动时不运行用于搜索 Python 路径的导入钩子模块（import site）。 |

    | `-v` | 导入语句的详情 |

    | `-X` | 禁用基于类的内置异常 |

    | `-c cmd` | 运行在 `cmd` 字符串中发送的 `python` 脚本 |

    | `File` | 从指定文件运行 `Python` 脚本 |


    ### 命令行脚本


    在你的应用程序上调用解释器可以帮助你在命令行运行并执行你的 `python` 脚本。


    ### 集成开发环境


    也可以从 GUI 运行 `Python`。你只需要一个支持 `Python` 的系统。


    # 第 3 章：Python 简单编程规则


    现在，让我们详细学习 `Python` 的一些简单但重要的编程规则。


    进入开始菜单->Python-> ''IDLE''（或集成开发环境）。


    在 `python` 提示符中输入以下内容并按回车：（不要输入 `>>>`，因为它已经在命令行中存在了）


    ### 代码示例 1 - Hello, World!


    ```

    >>> print "Hello, World!"

    ```

    输出：- Hello, World!


    这里是另一个示例，显示了如何在屏幕上打印字符串：


    ```python

    print (''hi, Michael'')

    ```


    关键字 `print` 用于在屏幕上打印字符串。上述示例程序的输出为：


    OUTPUT: hi, Michael


    上面的程序也可以写如下所示


    ```python

    print ''hi, Michael''

    ```


    上面的程序也给出输出：hi, Michael


    1. 在 `print` 语句中使用括号是可选的。是否使用括号没有区别。两种情况下获得相同的输出。但是，从 Python 3.x 版本开始，在 `print`
    语句中使用括号是强制的。

    2. 在每个语句的末尾使用分号也不是强制的。使用分号是可选的。


    示例：`print ''hi, Michael'';`


    我们可以使用分号（`;`）在单行上指定多个语句。


    示例：`print ''hi''; print ''Michael''; print ''how are you?'';`


    输出：

    ```

    hi

    Michael

    how are you?

    ```


    ## Python 中的注释


    程序中的注释有助于更好地理解代码。


    ### 单行注释


    在 `Python` 中，注释以井号（`#`）开始。`#` 符号后的字符被视为注释，并被 `Python` 解释器忽略。从 `#` 符号到行尾的字符构成单行注释。


    示例：


    ```python

    # 这里是你应该写注释的地方

    print ''hi, Michael''

    ```


    考虑其他几个例子：


    ```python

    # print "food is very bad"

    ```

    （没有输出，因为 print 语句在注释之后输入）


    ```python

    print "food is tasty" eat it

    ```

    （显示了错误，因为我们没有在井号后面放置注释）


    ### 多行注释


    在 `Python` 中，井号（`#`）符号仅用于编写单行注释。不能使用井号编写多行注释。例如，考虑以下脚本：


    ```python

    # 这是

    a Python Script

    print ''hi, Michael''

    ```

    上面的脚本会报错，因为注释 `This is a Python Script` 写了两行，但 `#` 符号只允许单行注释。因此，在 `Python` 中编写多行注释，我们可以使用三引号
    `''''''` 或 `"""`。


    示例 1：


    ```python

    ''''''

    这是一个 Python 脚本

    ''''''

    print ''hi, Michael''

    ```


    示例 2：


    ```python

    """

    这是一个 Python 脚本

    """

    print ''hi, Michael''

    ```


    ## Python 中的引号


    为了打印字符串，`Python` 允许使用单引号（`''`）、双引号（`"`）或三引号（`''''''` 或 `"""`）。应确保字符串的开头和结尾使用相同类型的引号。例如，字符串
    `''I like Python''` 可以通过以下方式使用 `print` 语句打印：


    ```python

    print ''I like Python''

    print "I like Python"

    print ''''''I like Python''''''

    print"""I like Python"""

    ```


    上述四个语句给出相同的输出。但是，多行只能使用三引号打印。尝试使用单引号或双引号打印多行字符串会导致错误。


    示例：


    ```python

    print ''I like Python. It is very simple and easy to learn''

    ```

    上面的语句是合法的，因为使用了三引号来打印多行字符串。


    让我们看看当上面的脚本更改如下时会发生什么：


    ```python

    print ''Python is object oriented''''''

    ```


