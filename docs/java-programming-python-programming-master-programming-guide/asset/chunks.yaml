  trans: "\n\n使用循环的主要目的是为了避免重复工作，节省大量的时间和精力。想象一下，如果一个计算需要执行 100 次，手动输入 100 次将非常困难，因此在这样的情况下循环是有益的。\n\
    \n### While 循环\n\n示例：\n\n```python\na = 0\nwhile a < 10:\n    a = a + 1\n    print\
    \ a\n```\nO/p: `1 2 3 4 5 6 7 8 9`\n\n使用缩进的 While 循环语法：\n\n```python\nwhile {循环继续的条件}:\n\
    \    {在循环中执行的操作}\n    {是否缩进，通常为四个空格}\n```\n`{这里的代码不会循环}` \n`{因为它们没有缩进}`\n\n---\n\
    \n### 条件语句\n\n这些语句用于检查给定的条件是否被满足。\n\n#### 示例 1：\n\n```python\na = 1\nif a > 5:\n\
    \    print \"This shouldn't happen.\"\nelse:\n    print \"This should happen.\"\
    \n```\nO/p: `This should happen.`\n\n#### 示例 2：\n\n```python\nz = 4\nif z > 7:\n\
    \    print \"Very Wrong\"\nelif z < 7:\n    print \"This is normal\"\n```\nO/p:\
    \ `This is normal`\n\n注意，在 Python 中 `else if` 被缩写为 `elif`。我们可以使用多个 `elif`，但只能有一个\
    \ `else` 语句。每个语句的末尾应该有一个冒号。缩进有助于区分条件语句内部的内容。\n\n#### 示例：\n\n```python\na = 10\n\
    while a > 0:\n    print a\n    if a > 5:\n        print \"Big number!\"\n    elif\
    \ a % 2 != 0:\n        print \"The number is odd\"\n        print \"Not greater\
    \ than 5\"\n    else:\n        print \"Smaller than 5\"\n        print \"nor is\
    \ it odd\"\n        print \"feeling special?\"\n    a = a - 1\n    print \"we\
    \ just made 'a' value lesser\"\n    print \"and unless a>0 loop again\"\n    print\
    \ \"well, it seems as if 'a'>0\"\n    print \"loop is now over\"\n```\n\n---\n\
    \n### For 循环\n\n用于访问列表中的项。\n\n**语法**：`for 迭代变量 in 序列:`\n    `语句 s`\n\n示例：\n\n\
    ```python\n#!/usr/bin/python\nfor letter in 'Acting':           # 第一示例\n    print\
    \ 'Current Letter :', letter\n\nfruits = ['grape', 'pineapple', 'orange']\nfor\
    \ fruit in fruits:             # 第二示例\n    print 'Current fruit :', fruit\n```\n\
    \n**输出**：\n```\nCurrent Letter: A\nCurrent Letter: c\nCurrent Letter: t\nCurrent\
    \ Letter: i\nCurrent Letter: n\nCurrent Letter: g\n```\n\n---\n\n### 第 8 章：函数\n\
    \n#### 定义\n函数是执行特定任务的小程序，可以整合到我们的代码中。你可以随时随地创建函数。它节省了在迭代过程中重复系统操作的时间和精力。\n\n####\
    \ 函数\nPython 有许多内置函数可以通过简单的`调用`它们来使用。`调用`函数意味着向该函数提供贡献并获取输出。\n\n#### 如何调用函数\n\
    `函数名(参数)`\n`函数名` 决定了你应该使用哪个函数。例如，`raw_input` 是第一个使用的函数。\n\n参数是传递给函数的值。例如，如果是整数，参数将告诉函数要乘以五。在括号内插入数字，函数将返回一个字符串。\n\
    \n#### 使用 raw_input\n```python\na = raw_input (\"Type something:\")\nprint a\n\
    ```\n\n#### 以你的方式定义\n目前一直在使用内置函数，但我们可以创建自己的函数并在任何地方使用它。`def` 运算符在这里创建一个（告诉 Python\
    \ 要做什么，例如 `+` 指令 Python 执行加法）。\n\n#### def 运算符\n```python\ndef function_name(parameter_1,\
    \ parameter_2):\n    {这是函数中的代码}\n    {更多代码}\n    {更多代码}\n    return {返回给主程序的值}\n\
    ```\n`{代码不在函数中}`\n`{因为没有缩进}`\n记得在以 `def` 开头的行尾加上冒号 `:`。函数不需要依赖主程序。\n\n#### 传递参数\n\
    使用参数定义函数\n```python\ndef function_name(parameter_1, parameter_2):\n    {这是函数中的代码}\n\
    \    {更多代码}\n    {更多代码}\n    return {返回给主程序的值（例如文本或数字）}\n```\n\n#### 传递参数的方法\n\
    `add(5,40)`\n当 `add` 程序运行时，会加上两个数字 5 和 40，然后打印结果。`add` 程序没有 `return` 运算符，因此它不会向主程序返回任何内容。它只是相加了作为参数传递的数字，然后将它们打印在屏幕上，主程序无所不知。\n\
    \n除了 `input(\"Add this: \"),input(\"to this: \")`，你也可以使用变量作为参数。\n\n#### 变量参数\n\
