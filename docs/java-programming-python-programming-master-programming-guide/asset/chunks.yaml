    \ 的数字）\n\nif else if: 这就像是给 if else 语句又添加了一个步骤。这被用于使用一系列条件的情况。\n\n语法：`if(condition){statements};`\n\
    \nelse if(condition){statements}\n\nelse if(condition){statements}\n\nelse{statements}\n\
    \n示例：\n\n```html\n<script type=\"text/javascript\">\n<!--\nvar book = \"JAVASCRIPT\"\
