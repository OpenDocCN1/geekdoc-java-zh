    \ Example: Passing keyword arguments using the `apply` function.\nFile: `builtin-apply-example-2.py`\n\
    ```python\ndef function(a, b):\n    print a, b\n\napply(function, (\"crunchy\"\
    , \"frog\"), {\"b\": \"frog\"})\napply(function, (), {\"a\": \"crunchy\", \"b\"\
    : \"frog\"})\n```\n\nThe `apply` function is also widely used for passing constructor\
