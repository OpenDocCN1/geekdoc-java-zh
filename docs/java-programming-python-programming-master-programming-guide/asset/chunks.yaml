    given they are to be used without changing them. Numbering starts from zero.  Example:
    Names of the months.


    Dictionaries, the meaning is depicted in the name itself - a dictionary. In dictionaries,
    we have a ‘directory’ of words, and each has a definition. In python, this word
    is termed as ''key'', whereas the definition as ''value''. It is possible to remove,
    add, or modify values in dictionaries. Example: Telephone diary.


    ## Tuples


    Tuples can be created easily by just giving the tuple a name, after which it carries
    a list of values. For example months in the year:


