    \ dictionary[\"long rectangle\"].area()\n```\n\n# Chapter 11: Modules\n\n## Overview\n\
    \nThere is a wide collection or rather a wide range of modules in the standard\
    \ library of Python. There are all kinds of modules present in the Python library.\
    \ Each of them is designed for performing a specific task. Almost all the functions\
