  trans: "\n上面的脚本生成了一个“缩进错误” (Indentation Error)；这意味着所有三个语句本应该形成一个块，因此它们应该具有相同的缩进。\n\
    \n用户可以使用任意数量的空格作为缩进。但必须注意，同一个块内的语句的缩进空格数必须相同。\n\n如果你熟悉 C 语言，可以看一眼用 C 语言编写的 `if-else`\
    \ 语句：\n\n```c\nif(5<7)\n{\n    printf (\"The given condition is true\");\n   \
    \ printf (\"abc\");\n}\nelse\n{\n    printf (\"This given condition is false\"\
    );\n    printf (\"xyz\");\n}\n```\n\n上面的 C 代码可以用如下方式写成 Python 代码：\n\n```python\n\
    if 5<10:\n    print 'The given condition is true'\n    print 'abc'\nelse:\n  \
    \  print 'The given condition is false'\n    print 'xyz'\n```\n\n注意这两种语言语法之间的区别。此外，请注意\
    \ Python 中使用缩进而不是大括号 `{}` 来指定块。\n\n考虑将上述代码中其中一个 `print` 语句的缩进更改如下：\n\n```python\n\
    if 5<10:\n    print 'The given condition is true'\nprint 'abc'\nelse:\n    print\
    \ 'The given condition is false'\n    print 'xyz'\n```\n\nOUTPUT：\n```\n[Line\
    \ 3](http://codepad.org/gpkkOzLB#line-3)\n  print \"abc\"\n       ^\nIndentation\
    \ Error: unindent does not match any outer indentation level\n```\n\n在上面的代码中，第\
    \ 3 行的 `print` 语句其缩进与其他所有 `print` 语句的缩进不一致，因此产生了错误。\n\n来看 Python 的另一个示例：\n\n###\
    \ 块 1\n```python\nif 5<10:\nprint \"abc\"\nelse:\nprint \"xyz\"\n```\nOUTPUT:\
    \ abc\n\n在上面的块中，`if` 和 `else` 具有相同的缩进，因为它们共同组成了一个控制语句块。同样，`print` 语句应该具有相同的缩进，因为每个\
    \ `print` 语句都被视为一个代码块。\n\n然而，下面的块将会报错：\n\n### 块 2\n```python\nif 5<10:\nprint\
    \ \"abc\"\nelse:\nprint \"xyz\"\n```\nOUTPUT:\n```\n[Line 2](http://codepad.org/rnoeN4o0#line-2)\n\
    \  print \"abc\"\nIndentationError: expected an indented block\n```\n\n由于 `if\
    \ else` 语句和 `print` 语句都被赋予了相同的缩进，因此生成了错误。\n\n考虑另一个语句块：\n\n### 块 3\n```python\n\
    if 5<10:\nprint \"abc\"\nelse:\nprint \"xyz\"\n```\n上面的代码输出如下所示：\n\nOUTPUT:\n\
    ```\n[Line 1](http://codepad.org/81avkQsU#line-1)\n  if 5<10:\n  ^\nIndentationError:\
    \ unexpected indent\n```\n\n因此，在对 Python 代码行进行缩进时应该小心。至于行之间的空格，可以在任何两行代码之间留下任意数量的空行。\n\
    \n示例：\n```python\nif 5<10:\n    print '5 is less than 10'\n    print \"abc\"\n\
    else:\n    print \"xyz\"\n```\n在上面的代码块中，`if` 语句和 `else` 语句之间留下了 5 个空行。尽管如此，这对输出没有影响，也没有产生错误。程序员只需要注意行的缩进。\n\
    \n**注意：**尽管可以使用任意数量的空格作为缩进，但使用 4 个空格作为缩进是一个良好的习惯。\n\n## 多行语句\n\n在 Python 中，语句以单行结束。新的一行表示前一行的语句已经结束。换句话说，Python\
    \ 不允许将单个语句写在多行中。\n\n示例：考虑一个用于计算三个数字之数的程序\n```python\na=10\nb=5\nc=5\nsum= a+b+c\n\
    print sum\n```\nOUTPUT: 20\n\n现在，尝试通过将第 4 行的表达式分成两行来重写代码：\n```python\na=10\nb=5\n\
    c=5\nsum= a+\n    b+c\nprint sum\n```\nOUTPUT:\n```\n[Line 3](http://codepad.org/I13POw#line-3)\n\
    \  sum= a+\n    ^\nSyntax Error: invalid syntax\n```\n在上面的程序中，第 4 行只包含语句的一部分，其延续在后续行中。然而，解释器认为语句在单行处已结束。因此，由于表达式\
    \ `sum = a+` 没有关联，生成了错误。\n\n考虑按如下方式编写相同的程序：\n```python\na=10\nb=5\nc=5\nsum= a\n\
    +b+c\nprint sum\n```\n上面的代码没有生成错误，但没有给出预期的输出。这是因为第 4 行的语句以 `a` 结束，解释器认为这就是语句的结束。由于使用了赋值运算符\
    \ `=`（你将在下一章中学习），解释器将 `a` 的值赋给 `sum`，使其变为 10。\n\n然而，我们可以使用续行字符 `\\` 在多行中编写单个语句。例如：\n\
    ```python\na=10\nb=5\nc=5\nsum= a+\\\n    b+c\nprint sum\n```\nOUTPUT: 20 尽管可以使用任意数量的空格作为缩进，但使用\
    \ 4 个空格作为缩进是一个良好的习惯。\n\n## 多行语句\n\n在 Python 中，语句以单行结束。新的一行表示前一行的语句已结束。换句话说，Python\
    \ 不允许将单个语句写在多行中。\n\n示例：考虑一个用于计算三个数字之数的程序\n```python\na=10\nb=5\nc=5\nsum= a+b+c\n\
    print sum\n```\nOUTPUT: 20\n\n现在，尝试通过将第 4 行的表达式分成两行来重写代码：\n```python\na=10\nb=5\n\
    c=5\nsum= a+\n    b+c\nprint sum\n```\nOUTPUT:\n```\n[Line 3](http://codepad.org/I13POw#line-3)\n\
    \  sum= a+\n    ^\nSyntax Error: invalid syntax\n```\n在上面的程序中，第 4 行只包含语句的一部分，其延续在后续行中。然而，解释器认为语句在单行处已结束。因此，由于表达式\
    \ `sum = a+` 没有关联，生成了错误。\n\n考虑按如下方式编写相同的程序：\n```python\na=10\nb=5\nc=5\nsum= a\n\
    +b+c\nprint sum\n```\n上面的代码没有生成错误，但没有给出预期的输出。这是因为第 4 行的语句以 `a` 结束，解释器认为这就是语句的结束。由于使用了赋值运算符\
    \ `=`（你将在下一章中学习），解释器将 `a` 的值赋给 `sum`，使其变为 10。\n\n然而，我们可以使用续行字符 `\\` 在多行中编写单个语句。例如：\n\
    ```python\na=10\nb=5\nc=5\nsum= a+\\\n    b+c\nprint sum\n```\nOUTPUT: 20\n"
- fmt: "\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `==` | It\
    \ is the ‘equal to’ operator which is used for checking if two operands have equal\
    \ values or not. If they have equal values, the Boolean value ‘True’ is returned,\
    \ else ‘False’ is returned. | `(p == q)` returns false(Since p=10 and q=5). |\n\
    | `!=` | It is the ‘not equal to’ operator which is used for checking if two operands\
    \ have different values or not. If they have different values, the Boolean value\
    \ ‘True’ is returned, else ‘False’ is returned. | `(p != q)` returns false |\n\
    | `<>` | It is similar to the ‘not equal to’ operator which is used for checking\
    \ if two operands have different values or not. If they have different values,\
    \ the Boolean value ‘True’ is returned, else ‘False’ is returned | `(p <> q)`\
    \ returns false |\n| `>` | It is the ‘greater than’ operator which is used for\
    \ checking if the first operand is greater than the second operand or not. If\
    \ the first operand is greater than the second operand the Boolean value ‘True’\
    \ is returned, else ‘False’ is returned. | `(p >q)` returns true. |\n| `<` | It\
    \ is the ‘less than’ operator which is used for checking if the first operand\
    \ is lesser than the second operand or not. If the first operand is lesser than\
    \ the second operand, the Boolean value ‘True’ is returned, else ‘False’ is returned\
    \ | `(p < q)` returns false. |\n| `>=` | It is the ‘greater than or equal to ’\
    \ operator which is used for checking if the first operand is greater than or\
    \ equal to the second operand. If the first operand is greater than or equal to\
    \ the second operand, the Boolean value ‘True’ is returned, else ‘False’ is returned.\
    \ | `(p >= q)` returns true. |\n| `<=` | It is the ‘less than or equal to’ operator\
    \ which is used for checking if the first operand is greater than or equal to\
    \ the second operand. If the first operand is less than or equal to the second\
    \ operand, the Boolean value ‘True’ is returned, else ‘False’ is returned. | `(p\
    \ <= q)` returns False. |\n\nYou will understand the relational operators better,\
    \ if you take a look at the following example program:\n\n### Example:\n\n```python\n\
    #!/usr/bin/python\n\np = 10\nq = 5\n\nif ( p == q ):\n  print \" p is equal to\
    \ q\"\nelse:\n  print \"p is not equal to q\"\n\nif ( p != q ):\n  print \"p is\
    \ not equal to q\"\nelse:\n  if ( p <> q ):\n    print \"p is not equal to q\"\
    \n  else:\n    print \"p is equal to q\"\n\nif ( p < q ):\n  print \" p is less\
    \ than q\"\nelse:\n  print \" p is not less than q\"\n\nif ( p > q ):\n  print\
    \ \"p is greater than q\"\nelse:\n  print \"p is not greater than q\"\n\nif (\
    \ p <= q ):\n  print \"p is either less than or equal to q\"\nelse:\n  print \"\
    p is neither less than nor equal to q\"\n\nif ( p >= q ):\n  print \"p is either\
    \ greater than or equal to q\"\nelse:\n  print \"p is neither greater than nor\
    \ equal to q\"\n```\n\n**OUTPUT:**\n```\np is not equal to q\np is not equal to\
    \ q\np is equal to q\np is less than q\np is not less than q\np is greater than\
    \ q\np is not greater than q\np is either less than or equal to q\np is neither\
    \ less than nor equal to q\np is either greater than or equal to q\np is neither\
    \ greater than nor equal to q\n```\n\n### 3. Assignment operators\n\nThe assignment\
    \ operators are used for storing the value of an operand in another operand. Also,\
    \ they can be used to assign the result of a calculation as the operand. Assignment\
    \ operators used in Python are listed in the following table:\n\n| Operator |\
    \ What it is and what it does | Example |\n| :--- | :--- | :--- |\n| `=` | Assignment\
    \ operator used between two operands. When used, assigns the value of the right\
    \ operand to the left operand. | `a=6` (Assigns the value 6 to `a`), `b=a` (Assigns\
    \ the value of `a` to `b`), `p=q+r` (Assigns sum of `q+r` to `p`) |\n| `+=` |\
    \ Add AND assignment operator and does both addition and assignment. Adds right\
    \ and left operands and stores the sum in the left operand. | `p+=q` (Adds `p`\
    \ and `q` then stores the sum in `p`), equivalent to `p=p+q` |\n| `-=` | Subtract\
    \ AND assignment operator and does both subtraction and assignment. It works by\
    \ subtracting right operand from the left operand then storing the difference\
    \ in the left operand. | `p-=q` (Subtracts `q` from `p` then stores the difference\
    \ in `p`), equivalent to `p=p-q` |\n| `*=` | Multiply AND assignment operator\
    \ and does both multiplication and assignment. It works by multiplying right operand\
    \ with the left operand then storing the product in the left operand. | `p*=q`\
