    We can use the semicolon ( ; ) to specify multiple statements on a single line.


    Example: print ''hi''; print ''Michael''; print ''how are you?'';


    OUTPUT:


    hi


    Michael


    how are you?   


    ## Commenting in Python


    The comments in a program help in better understanding of the code.


    ### Single line comment:


    In Python, a comment begins with a hash sign (#). The characters following the
    # sign are considered a comment and are ignored by the Python interpreter. The
    characters following the # sign until the end of the line make a single line of
    comment.


    Example:


    # This is where you should comment


    print ''hi, Michael''   


    #This line is considered a comment and is ignored by the interpreter


    Consider few other examples:


    # print "food is very bad"


    (No output because the print statement was entered after a comment)


    print "food is tasty" eat it


    (An error message is displayed because we haven’t put the comment after the hash)


    ### Multi line comments:


    In Python, the hash (#) sign is used to write only single line comments. Multi
    line comments cannot be written using the hash sign. For example, consider the
    following script:


    # This is


    a Python Script


    print ''hi, Michael''   


    The above script gives an error as the comment ‘This is a Python Script’ is written
    in two lines, but # sign can only allow a single line comment .So, for writing
    multi line comments in Python, we can use triple quotations- ''''”” or””".


    Example 1:


    “This is a Python Script ''''


    print ''hi, Michael''


    Example 2:


    “This is a Python Script”


    print ''hi, Michael''


    ## Quotations in Python


    For printing strings, Python allows using single quotes (''), double quotes(")
    or triple quotes ('''''' or"""). Care should be taken that the same type of quotes
    are used at the beginning and end of the string. For example, the string ''I like
    Python'' can be printed using the print statement in the following ways:


    print ''I like Python''


    print "I like Python"


    print ''''''I like Python''''''


    print"""I like Python"""


    All of the four statements above give the same output. But, multiple lines can
    only be printed only using triple quotes. Attempting to print strings in multiple
    lines using single or double quotes gives errors.


    Example:


    print '''''' I like Python. It is very simple and easy to learn''''''


    The above statement is legal as triple quotes have been used for printing multiple
    lines of string.


    Let’s see what happens when the above script is changed as follows:


    print ''I like Python. It is very simple and easy to learn''


    The above statement gives an error as single quotes(or double quotes) cannot accommodate
    multiple lines of strings.


    Now let’s take a look at another script:


    print ''Python is object oriented'''''''
