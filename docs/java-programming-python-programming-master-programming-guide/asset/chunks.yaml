    \ print input * 4\n\n# define a class\nclass Piano:\n    def __init__(self):\n\
    \        self.type = raw_input(\"What type of sky\")\n    def printdetails(self):\n\
    \        print \"The sky is \" + self.type + \" foot\"\n```\n\nA module looks\
    \ similar to a normal program. The purpose of a module is to import its parts\
    \ from other programs that you are writing, you can use the `import` operator.\
    \ Like, for importing `moduletest.py` into the main program, we can do something\
    \ like:\n\n### Example - `mainprogram.py`\n\n```python\nimport moduletest\ncfcpiano\
    \ = moduletest.Piano()\ncfcpiano.printdetails()\n```\n\n## Built-in Functions\
    \ and Exceptions\n\nThere are two basic modules in Python: 1. Built-in functions\
    \ and 2. Exceptions. When Python is initiated, it will import both modules, making\
    \ the content in these modules available to all programs.\n\n### Built-in Functions\n\
    \nIn this module, `python` has all built-in functions. These built-in functions\
