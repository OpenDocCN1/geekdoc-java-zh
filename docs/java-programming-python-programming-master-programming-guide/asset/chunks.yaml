    \ | `(p == q)` 返回 false（因为 p=10 且 q=5）。 |\n| `!=` | 它是“不等于”运算符，用于检查两个操作数的值是否不同。如果它们的值不同，返回布尔值‘True’，否则返回‘False’。\
    \ | `(p != q)` 返回 false |\n| `<>` | 它类似于“不等于”运算符，用于检查两个操作数的值是否不同。如果它们的值不同，返回布尔值‘True’，否则返回‘False’\
    \ | `(p <> q)` 返回 false |\n| `>` | 它是“大于”运算符，用于检查第一个操作数是否大于第二个操作数。如果第一个操作数大于第二个操作数，返回布尔值‘True’，否则返回‘False’。\
    \ | `(p >q)` 返回 true。 |\n| `<` | 它是“小于”运算符，用于检查第一个操作数是否小于第二个操作数。如果第一个操作数小于第二个操作数，返回布尔值‘True’，否则返回‘False’\
    \ | `(p < q)` 返回 false。 |\n| `>=` | 它是“大于等于”运算符，用于检查第一个操作数是否大于或等于第二个操作数。如果第一个操作数大于或等于第二个操作数，返回布尔值‘True’，否则返回‘False’。\
    \ | `(p >= q)` 返回 true。 |\n| `<=` | 它是“小于等于”运算符，用于检查第一个操作数是否小于或等于第二个操作数。如果第一个操作数小于或等于第二个操作数，返回布尔值‘True’，否则返回‘False’。\
    \ | `(p <= q)` 返回 False。 |\n\n如果你查看下面的示例程序，将更好地理解关系运算符：\n\n### 示例：\n\n```python\n\
    #!/usr/bin/python\n\np = 10\nq = 5\n\nif ( p == q ):\n  print \" p is equal to\
    \ q\"\nelse:\n  print \"p is not equal to q\"\n\nif ( p != q ):\n  print \"p is\
    \ not equal to q\"\nelse:\n  if ( p <> q ):\n    print \"p is not equal to q\"\
    \n  else:\n    print \"p is equal to q\"\n\nif ( p < q ):\n  print \" p is less\
    \ than q\"\nelse:\n  print \" p is not less than q\"\n\nif ( p > q ):\n  print\
    \ \"p is greater than q\"\nelse:\n  print \"p is not greater than q\"\n\nif (\
    \ p <= q ):\n  print \"p is either less than or equal to q\"\nelse:\n  print \"\
    p is neither less than nor equal to q\"\n\nif ( p >= q ):\n  print \"p is either\
    \ greater than or equal to q\"\nelse:\n  print \"p is neither greater than nor\
    \ equal to q\"\n```\n\n**输出：**\n```\np is not equal to q\np is not equal to q\n\
    p is equal to q\np is less than q\np is not less than q\np is greater than q\n\
    p is not greater than q\np is either less than or equal to q\np is neither less\
    \ than nor equal to q\np is either greater than or equal to q\np is neither greater\
    \ than nor equal to q\n```\n\n### 3. 赋值运算符\n\n赋值运算符用于将操作数的值存储另一个操作数中。此外，它们也可以用于将计算结果赋值给操作数。Python\
    \ 中使用的赋值运算符列于下表：\n\n| 运算符 | 含义及作用 | 示例 |\n| :--- | :--- | :--- |\n| `=` | 用于两个操作数之间的赋值运算符。使用时，将右操作数的值赋值给左操作数。\
    \ | `a=6`（将值 6 赋值给 `a`），`b=a`（将 `a` 的值赋值给 `b`），`p=q+r`（将 `q+r` 的和赋值给 `p`） |\n\
    | `+=` | 加赋值运算符，同时执行加法和赋值。将右、左操作数相加，并将和存储在左操作数中。 | `p+=q`（将 `p` 和 `q` 相加并将和存储在\
    \ `p` 中），等同于 `p=p+q` |\n| `-=` | 减赋值运算符，同时执行减法和赋值。它通过从左操作数减去右操作数并将差存储在左操作数中来实现。\
    \ | `p-=q`（从 `p` 中减去 `q`并将差存储在 `p` 中），等同于 `p=p-q` |\n| `*=` | 乘赋值运算符，同时执行乘法和赋值。它通过将右操作数乘以左操作数并将积存储在左操作数中来实现。\
    \ | `p*=q`（将 `q` 乘以 `p`并将积存储在 `p` 中），等同于 `p=p*q` |\n| `/=` | 除法赋值运算符，执行除法和赋值。它通过将左操作数除以右操作数并将商存储在左操作数中来实现。\
    \ | `p/=q`（将 `p` 除以 `q`并将商存储在 `p` 中），等同于 `p=p/q` |\n| `%=` | 取模赋值运算符，同时执行取模（余数）和赋值。它通过将左操作数除以右操作数并将余数存储在左操作数中来实现。\
    \ | `p%=q`（将 `p` 除以 `q`并将余数存储在 `p` 中），等同于 `p=p%q` |\n| `**=` | 幂赋值运算符，同时执行幂和赋值。它将左操作数升为右操作数的幂并将结果存储在左操作数中。\
    \ | `p**=q`（将 `p` 升为 `q` 的幂并将结果存储在 `p` 中），等同于 `p=p**q` |\n| `//=` | 在操作数之间执行地板除法和赋值并将结果存储在左操作数中。地板除法等同于普通除法，不同在于商是向下取整的。\
    \ | `p//=q`（将 `p` 除以 `q`并将取整后的商存储在 `p` 中），等同于 `p=p//q` |\n\n如果你查看下面的示例程序，将更好地理解关系运算符：\n\
    \n### 示例：\n\n```python\n#!/usr/bin/python\n\np = 10\nq = 5\n\nif ( p == q ):\n\
    \  print \" p is equal to q\"\nelse:\n  print \"p is not equal to q\"\n\nif (\
    \ p != q ):\n  print \"p is not equal to q\"\nelse:\n  if ( p <> q ):\n    print\
    \ \"p is not equal to q\"\n  else:\n    print \"p is equal to q\"\n\nif ( p <\
    \ q ):\n  print \" p is less than q\"\nelse:\n  print \" p is not less than q\"\
    \n\nif ( p > q ):\n  print \"p is greater than q\"\nelse:\n  print \"p is not\
    \ greater than q\"\n\nif ( p <= q ):\n  print \"p is either less than or equal\
    \ to q\"\nelse:\n  print \"p is neither less than nor equal to q\"\n\nif ( p >=\
    \ q ):\n  print \"p is either greater than or equal to q\"\nelse:\n  print \"\
    p is neither greater than nor equal to q\"\n```\n\n**输出：**\n```\np is not equal\
    \ to q\np is not equal to q\np is equal to q\np is less than q\np is not less\
    \ than q\np is greater than q\np is not greater than q\np is either less than\
    \ or equal to q\np is neither less than nor equal to q\np is either greater than\
    \ or equal to q\np is neither greater than nor equal to q\n```\n\n### 4. 位运算符\n\
    \n对位（二进制 0 和 1）操作的运算符称为位运算符。Python 中使用的位运算符列于下表：\n\n| 运算符 | 含义及作用 | 示例 |\n| :---\
    \ | :--- | :--- |\n| `&` | 位与运算符。它检查两个操作数的每一个位，如果两个操作数中至少有一个为‘0’，则结果为‘0’。示例：br>p:\
    \ 0010<br>q: 0101<br>----------<br>p&q: 0000 | `p=2, q=5`<br>二进制形式：p=0010, q=0101<br>-----------------<br>`p&q=0000`\
    \ |\n| `|` | 位或运算符。它检查两个操作数的每一个位，如果两个操作数中至少有一个为‘1’，则结果为‘1’。示例：br>p: 0010<br>q:\
    \ 0101<br>----------<br>p\\|q: 0111 | `p=0010, q=0101`<br>-----------------<br>`p\\\
    |q=0111` |\n| `^` | 位异或运算符（互斥或）。它类似于位或运算符，区别在于，如果只在一个操作数中存在‘1’而不在两者中都存在，则结果为‘1’。示例：br>p:\
    \ 0010<br>q: 0011<br>----------<br>p^q: 0001 | `p=2 and q=3`<br>二进制形式：p=0010,\
    \ q=0011<br>-----------------<br>`p^q=0001` |\n\n"
- fmt: "\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n| `~` | Binary\
    \ Ones Complement operator. It is a unary operator which means it operates upon\
    \ only a single bit. It flips the bit to its complementary bit. It means 0’s are\
    \ replaced by 1’s and 1’s are replaced by 0’s. | `p=2` In binary form `p= 0010`,\
    \ `~p=1101` |\n| `<<` | Binary Left Shift operator. This operator moves the bits\
    \ of the left operand to the left. The number of bits that are to be moved and\
    \ lost to the left is stated by the right operand. After the bits are lost from\
    \ the left, same number of 0’s get filled in the right. | `p=0010`, `p << 2 =\
    \ 1000` |\n| `>>` | Binary Right Shift operator. This operator moves the bits\
    \ of the left operand to the right. The number of bits that are to be moved and\
    \ lost to the right is stated by the right operand. After the bits are lost from\
    \ the right, same number of 0’s get filled in the left. | `p=0010`, `p >> 2 =\
    \ 0000` |\n\nThe Binary left and right shift operators can be easily understood\
    \ through the following illustration:\n\nYou will understand the Bitwise operators\
    \ better, if you take a look at the following example program:\n\n### Example\n\
    ```python\n#!/usr/bin/python\n\np = 60                             # 60 = 0011\
    \ 1100\nq = 13                             # 13 = 0000 1101\nr = 0\n\nr = p &\
    \ q                          # 12 = 0000 1100\nprint \" Binary AND of p and q\
    \ gives: \", r\n\nr = p | q                          # 61 = 0011 1101\nprint \"\
    Binary OR of p and q gives: \", r\n\nr = p ^ q                          # 49 =\
    \ 0011 0001\nprint \"Binary XOR of p and q gives: \", r\n\nr = ~p;           \
    \                 # -61 = 1100 0011\nprint \"The value of p after one's complement\
    \ is \", r\n\nr = p << 2;                       # 240 = 1111 0000\nprint \"The\
    \ value of p after binary left shift is \", r\n\nr = p >> 2;                 \
    \      # 15 = 0000 1111\nprint \"The value of p after binary right shift of is\
    \ \", r\n```\n\n**OUTPUT:**\n```\nBinary AND of p and q gives:12\nBinary OR of\
    \ p and q gives: 61\nBinary XOR of p and q gives:49\nThe value of p after one's\
    \ complement is -61\nThe value of p after binary left shift is 240\nThe value\
    \ of p after binary right shift of is 15\n```\n\n## 5. Logical operators\n\nPython\
    \ supports the following logical operators:\n\n| Operator | What it does | Example\
    \ |\n| :--- | :--- | :--- |\n| `and` | The logical AND operator between two or\
    \ more expressions returns false, even if at least one of the given expressions\
    \ is false. | `a=10, b=20, c=0`. The expression `a>b` returns false. The expression\
    \ `b>c` returns true. Thus, the expression `(a>b and b>c)` returns false |\n|\
