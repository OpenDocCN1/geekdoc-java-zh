    \ import the Built-in module for you, leaving you the worry of importing it every\
    \ time.\n\n### Calling a function with arguments from a tuple or dictionary\n\n\
    In Python, you can build your own argument list. You can do this by putting all\
    \ the arguments in a tuple and calling the `apply` function. This `apply` function\
    \ is also a built in function. Here is an example which will give you a better\
    \ understanding of the `apply` function.\n\n#### Example: Utilizing the `apply`\
    \ function\nFile: `builtin-apply-example-1.py`\n```python\ndef function(a, b):\n\
    \    print a, b\n\napply(function, (\"whither\", \"canada?\"))\napply(function,\
    \ (1, 2 + 3))\n```\n\nYou can use the dictionary as the 3rd argument to `apply`\
    \ for passing keyword arguments to a given function. The below example will show\
