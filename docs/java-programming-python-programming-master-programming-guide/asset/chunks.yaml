  trans: "\n\n我们编写的代码可能存在逻辑错误或语法错误，这些错误很难识别。很多时候，当 JavaScript 代码包含错误时，什么都不会发生。没有任何消息指示程序中存在错误。\n\
    \n## 使用验证器 (Validator)\n\n如果想要检查代码中的 bug，就必须确保它是有效代码，并通过运行一个名为 `Validators`（简称为验证器）的程序来检查它是否遵循语言的官方规则。这些验证器通常随\
    \ JavaScript 编辑器一起。访问网页后，将代码粘贴到文本区域，然后点击按钮。该程序将解析我们的代码，确保所有变量和函数定义都符合正确的语法。\n\n\
    ## 在程序中添加调试代码\n\n`alert()` 或 `document.write()` 方法有助于调试你的代码。例如：\n\n```var debugging\
    \ = true;\nvar whichImage = \"widget\";\n\nif( debugging )\nalert( \"swapImage()\
    \ with argument: \" + whichImage );\nvar swapStatus = swapImage( whichImage );\n\
    \nif( debugging )\nalert( \"swapImage() with swapStatus=\" + swapStatus );\n```\n\
    \n## 使用 JavaScript 调试器 (Debugger)\n\n调试器是一种允许程序员控制脚本执行的应用程序。调试器方便用户检查执行流程。脚本按行运行，并可以指示其在断点停止。程序员可以在执行完成后检查脚本的状态和变量。\n\
    \n## 表单验证 (Form Validation)\n\n在客户端输入所需信息并点击提交按钮后，会发生表单验证。服务器必须将所有数据再次发送给用户，并要求用户使用正确或有效的信息重新提交表单。如果用户未能输入所有必需信息或输入了无效数据，就会发生这种情况。在将表单发送到网页浏览器之前，JavaScript\
    \ 可以在客户端计算机本身完成表单数据的验证。\n\n表单通常会执行两个功能：\n\n- 基础验证：为了确保每个必填字段都提供了数据，首先需要检查表单。数据需要遍历每个字段。\n\
    - 数据验证：这是为了检查表单中输入的是否正确或有效。\n\n## 基础表单验证\n\n让我们看看如何执行基础表单验证。当发生提交事件时，我们调用 `validate()`\
    \ 函数来验证数据。`validate()` 函数的实现如下：\n\n```html\n<script type=\"text/javascript\">\n\
    <!--\n// 表单验证代码将放在这里。\nfunction validate()\n{\n  if( document.myForm.Name.value\
    \ == \"\" )\n  {\n    alert( \"Please enter your name!\" );\n    document.myForm.Name.focus()\
    \ ;\n    return false;\n  }\n  if( document.myForm.EMail.value == \"\" )\n  {\n\
    \    alert( \"Please enter your id!\" );\n    document.myForm.EMail.focus() ;\n\
    \    return false;\n  }\n  if( document.myForm.Zip.value == \"\" ||\n      isNaN(\
    \ document.myForm.Zip.value ) ||\n      document.myForm.Zip.value.length != 5\
    \ )\n  {\n    alert( \"Please enter the zip in the format #####.\" );\n    document.myForm.Zip.focus()\
    \ ;\n    return false;\n  }\n  if( document.myForm.Country.value == \"-1\" )\n\
    \  {\n    alert( \"Please enter your country name!\" );\n    return false;\n \
    \ }\n  return( true );\n}\n//-->\n</script>\n```\n\n## 数据格式验证\n\n可以在将数据提交到 Web\
    \ 服务器之前完成数据验证。验证邮箱 ID 意味着 ID 应该包含 `@` 符号和点 (`.`)，下文给出的示例中所示。此外，最后一个点在 `@` 符号之后至少应有一个字符，且邮箱地址不能以\
    \ `@` 符号开头。\n\n```html\n<script type=\"text/javascript\">\n<!--\nfunction validateEmail()\n\
    {\n  var emailID = document.myForm.EMail.value;\n  atpos = emailID.indexOf(\"\
    @\");\n  dotpos = emailID.lastIndexOf(\".\");\n  if (atpos < 1 || ( dotpos - atpos\
    \ < 2 ))\n  {\n    alert(\"Please enter a valid email ID\")\n    document.myForm.EMail.focus()\
    \ ;\n    return false;\n  }\n  return( true );\n}\n//-->\n</script>\n```\n\n#\
    \ 第 4 章：JavaScript 中的对象\n\n## JavaScript 对象\n\nJavaScript 中的对象由属性组成。如果一个属性包含函数，则它被认为是一个方法。\n\
    \n## 对象属性 (Object Properties)\n\n对象的属性可以是任何数据类型。使用以下语法向对象添加属性：\n\n```javascript\n\
    objectName = propertyValue;\n```\n\n## 示例\n\n下一个示例展示了如何使用 \"title\" 属性：\n\n```javascript\n\
    strg = document.title;\n```\n\n## 对象方法 (Object Methods)\n\n允许对象执行特定任务的函数。\n\n\
    ## 示例\n\n以下示例展示了如何使用 `write()`：\n\n```javascript\ndocument.write(\"This is\");\n\
    ```\n\n## 自定义对象 (User-Defined Objects)\n\n`new` 运算符有助于创建对象的实例。以下示例中的 `Object()`、`Array()`\
    \ 和 `Date()` 是内置函数。\n\n## `Object()` 构造函数\n\n对象可以通过构造函数进行创建和初始化。接下来的示例展示了对象：\n\
    \n```html\n<html>\n<head>\n<title>objects defined by the user</title>\n<script\
    \ type=\"text/javascript\">\nvar book = new Object();\nbook.subject = \"Perl\"\
    ;\nbook.author = \"Yashwanth\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Book name is : + book.subject + \"<br>\");\ndocument.write(\"\
    Book author is : + book.author + \"<br>\");\n</script>\n</body>\n</html>\n```\n\
    \n## JavaScript 原生对象 (JavaScript Native Objects)\n\nJavaScript 包含许多内置对象。它们的行为不受浏览器或运行平台的影响。以下是常用对象列表：\n\
    \n1. Number 对象\n2. Boolean 对象\n3. [String](https://www.tutorialspoint.com/javascript/strings_object.htm)\
    \ 对象\n4. JavaScript Math 对象\n\n## Number 对象\n\nJavaScript 中的数字对象用于表示数值。它可以包含整数和浮点数。每当遇到数值时，网络浏览器会自动将这些值转换为数字类实例。\n\
    \n### 语法\n\n创建数字对象的语法如下：\n\n```javascript\nvalue = new Number(number);\n```\n\n\
    ### Number 方法\n\n以下是数字对象包含的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `constructor()`\
    \ | 该方法用于返回创建实例的函数。 |\n| `toExponential()` | 该方法以标准指数形式显示标准范围数字。 |\n| `toLocaleString()`\
    \ | 该方法接收一个数字并返回它的字符串版本。其格式随网络浏览器的本地化设置而变化。 |\n| `toPrecision()` | 该方法定义了给定数字显示的位数。这包括了小数点两侧的数字。\
    \ |\n| `toString()` | 该方法有助于将数字转换为字符串值。 |\n\n"
