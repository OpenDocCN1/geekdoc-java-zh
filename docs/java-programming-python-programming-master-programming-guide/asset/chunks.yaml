  trans: "\n\n# 控制语句\n\n程序中的控制语句顾如名所示，控制着每个程序的通用流程。它包括诸如 `if else` 的条件语句，或如 `while\
    \ ()`、`do while()` 等迭代语句。\n\n![](img/00003.jpeg)\n\n## If else\n\n语法：\n\n```javascript\n\
    if(condition)\n    do action1;\nelse\n    do action2;\n```\n\n当 `condition` 为真时，执行\
    \ `action1`，否则执行 `else` 部分的操作。\n\n### Switch case\n\n当你需要检查多个条件时，这种操作会非常有用。`Switch\
    \ case` 根据给定的值执行操作。\n\n语法：\n\n```javascript\nSwitch(id)\n{\nCase id1:\n    Action;\n\
    \    Break;\nCase id2:\n    Action;\n    Break;\n….\nDefault:\n….\n}\n```\n\n\
    ### While ()\n\n这是一个迭代语句，只要条件为真，它就会执行操作。\n\n语法：\n\n```javascript\nwhile(condition)\n\
    {\n    当 condition 为真时执行某些操作;\n}\n```\n\n### Do - while ()\n\n这同样是一个迭代操作，与 `while()`\
    \ 循环非常相似，区别在于无论条件是否有效，循环至少会执行一次，因为条件是在 `do` 语句之后才评估的。\n\n语法\n\n```javascript\n\
    do{\n    执行某些操作\n}while(condition);\n```\n\n### For 循环\n\n语法：`for ( 初始化;条件; 更新)`\n\
    \n示例：`for (int i=0; i<5; i++)` 现在将执行该语句 5 次。第一部分声明并为 `counter` 变量初始化一个值，第二部分检查条件，如果条件为真，则进入循环。循环完成后，它执行递增。然后它再次检查条件并继续执行相同操作，直到条件变为假。一旦条件为假，它就会退出循环。\n\
    \n示例：\n\n```java\nClass MyProgram{\npublic static void main(Strings[] args){\n\
    \    //声明并赋值变量\n    int num = 5, i;\n    while( num > 0){\n        System.out.println(\"\
    整数型 Num 的值为：\"+num);\n        num--;\n    }\n    for(i = 0;i<5; i++)\n       \
    \ System.out.println(\"整数型 Num 的值为：\"+num);\n    }\n}\n```\n\n输出：\n整数型 Num 的值为：5\n\
    整数型 Num 的值为：4\n整数型 Num 的值为：3\n整数型 Num 的值为：2\n整数型 Num 的值为：1\n\n上述程序使用了两个循环语句来执行操作。\n\
    \n# 封装\n\n封装，顾如名所示，将数据胶胶起来。简单来说，它隐藏了数据，从而提供了安全性。传递的参数可以是值传递，也可以是引用传递。在确定使用哪种类型后声明数据类型。类的方法通过对象使用点运算符来访问。\n\
    \n`Movie m1 = new Movie()`\n`M1.printName()` //打印名称\n或 `M1.play(count)` //播放 n\
    \ 次电影\n\n在接下来的示例中，使用 getter 来读取类变量的值，然后为变量设置一个值。\n\n```java\npublic class GetterSetter{\n\
    \    //声明实例变量\n    private String name;\n    private int age;\n\n    // getters\n\
    \    public int getAge(){\n        return age;\n    }\n    public String getName(){\n\
    \        return name;\n    }\n    // setters\n    public void setAge( int newAge){\n\
    \        age = newAge;\n    }\n    public void setName(String newName){\n    \
    \    name = newName;\n    }\n}\n\n//测试 getter 和 setter 方法的类\npublic class TestGetterSetter{\n\
    \    public static void main(String args[]){\n        TestGetterSetter gs = new\
    \ GetterSetter();\n        gs.setName(\"John\");\n        gs.setAge(30);\n   \
    \     System.out.println(\"你的名字是：\"+gs.getName());\n        System.out.println(\"\
    你的年龄是：\"+gs.getAge());\n    }\n}\n```\n\n输出：\n你的名字是：John\n你的年龄是：3\n\n# JavaScript\
    \ 简介\n\nJavaScript 是一种基于对象的动态脚本语言。Netscape 是这种语言的开发者。这种语言用于服务器应用程序和网页开发。它是世界上最广泛使用的脚本语言。\n\
    \nJava 和 JavaScript 唯一相似之处是它们的名称相似。在功能和概念方面，这些语言是完全不同的。让 JavaScript 脱颖于 Java 和\
    \ C++ 等面向对象语言的特点是，它的对象可以在运行时创建或修改。为了实现这一点，向空对象添加了方法和属性。一旦创建了对象，就可以创建其他类似对象的过程中像原型一样使用。\n\
    \n变量参数列表、源码恢复、动态脚本创建、动态对象创建函数变量等都是 JavaScript 拥有的动态能力。\n\n# 第一章：JavaScript 基础\n\
    \n## 在 JavaScript 中存储数据\n\n- 本地存储 (Local Storage)：本地存储用于永久存储数据。通过它，可以随时访问该页面的数据。本地存储没有过期日期。如果人们希望数据在一段时间内被反复使用，可以使用本地存储。\n\
    - 会话存储 (Session Storage)：会话存储与本地存储不同，因为它只保留单个会话的数据，并在用户关闭页面后丢弃数据。这种存储用于用于预订的网页。\n\
    \n## 使用变量和常量存储数据\n\n变量和常量存储数据。变量和常量在 JavaScript 中都有它们自己的重要性。`if` 语句使用这些数据。\n\n\
    变量数据：顾如名所示，这种随时间变化的类型在 JavaScript 中被广泛。变量是动态的。\n\n常量数据：常量数据是不改变值的。这种类型的数据是静态的。我们使用这种类型用于不可修改的数据。\n\
    \n### 创建变量和常量\n\n声明变量\n通过在名称前添加 `var` 关键字来声明变量。例如，如果你想声明 `group` 为变量，只需添加 `var`\
    \ 关键字。每个变量都应该以 `;`（分号）结束。这使得语句自包含。在使用单词时应小心，因为 JavaScript 是大小敏感的。对于这一点，字母必须与原始一致。\n\
    \n```javascript\nvar Dell;\n```\n上面的对象 `Dell` 是一个变量。\n\n声明常量\n在名称前使用 `const` 关键字使其成为常量。这种声明就像声明常量一样。\n\
    \n```javascript\nconst Book;\n```\n上面的示例中 `Book` 是常量。\n\n### JavaScript 中的决策\n\
    \n总是会出现我们需要在两个路径中选择一个的情况。这时我们能够实现 `if` 和 `else` 等条件语句。\n\n`if` 和 `else` 语句可以用于决策。这将允许程序选择正确的路径。\n\
    \nJavaScript 支持以下条件语句：\n1. `if` 语句\n2. `if...else` 语句\n3. `if...else if` 语句\n\n\
    if 语句：`if` 是用于决策的基本语句。在 `if` 语句中添加一个条件，如果给定的条件为真，就可以给出一组语句。\n\n```javascript\n\
    var age = 20;\nif( age > 18 ){\n    document.write(\"<b>允许进入酒吧。</b>\");\n}\n```\n\
    输出：允许进入酒吧的（如果给出了 18 以上的数字）\n\nif else 语句：这是 `if` 语句的扩展。如果 `if` 语句为假，系统运行并执行 `else`\
    \ 块中的语句。\n\n语法：\n\n```javascript\nif(condition)\n```\n\n"
