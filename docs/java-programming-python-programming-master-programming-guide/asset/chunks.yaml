    # Chapter 11: Modules


    ## Overview


    There is a wide collection or rather a wide range of modules in the standard library
    of Python. There are all kinds of modules present in the Python library. Each
    of them is designed for performing a specific task. Almost all the functions are
    covered in these modules. Directly or indirectly, all large programs in python
    use these modules. In simple words, to get the classes into various programs,
    we store them in modules and import them into other programs. We will learn about
    these modules in this chapter.


    ## Definition of a Module


    A python file which contains only definitions of variables, functions, and classes
    is a module. Consider an example.


    Example - moduletest.py


    ### EXAMPLE PYTHON MODULE


    numberone = 1


    ageofqueen = 78


    # define some functions


    def printhello():


                         print "hello everyone"


    def timesfour(input):


                         print input * 4


    # define a class


    class Piano:


                         def __init__(self):


                         self.type = raw_input("What type of sky")


                         self.height = raw_input("What height (in kms) ")


                         self.price = raw_input("How much did you pay ")


                         self.age = raw_input("How far it is? ")


                         def printdetails(self):


                         print "The sky is” + self.height + " foot",


                         print self.type, "piano, " + self.age, "years old and costs\


    " + self.price + " dollars."


    A module looks similar to a normal python program. The purpose of a module is
    to import its parts from other programs to import functions, variables and classes
    from moduletest.py (above written code) in another program that you are writing,
    you can use the import operator. Like, for importing moduletest.py into the main
    program, we can do something like this:


    Example - mainprogram.py


    ### mainprogam.py


    ### IMPORTS ANOTHER MODULE


    import moduletest


    This predicts that the module is in the same directory as mainprogram.py. We can
    have import statement anywhere inside the program. To use all the properties in
    the module in your main program, try this:


    Example - mainprogram.py continued


    ### USING AN IMPORTED MODULE


    print moduletest.ageofqueen


    cfcpiano = moduletest.Piano()


    cfcpiano.printdetails()


    ## Built-in Functions and Exceptions


    There are two basic modules in Python. They are 1\. Built-in functions and 2\.
    Exceptions. When Python is initiated, it will import both these modules, making
    the content in these modules available to all programs. They are explained below.


    Built-in Functions:


    In this module, python has all the built-in functions. These built-in functions
    are available in all of the modules that are there in python. Python will automatically
    import the Built-in module for you, leaving you the worry of importing it every
    time.


    Calling a function with arguments from a tuple or dictionary


    In Python, you can build your own function argument list. You can do this by putting
    all the arguments in a tuple and calling the ‘apply’ function. This ‘apply’ function
    is also a built in function. Here is an example which will give you a better understanding
    of the ‘apply’ function.


    Example: Utilizing the apply function


    # File:builtin-apply-example-1.py


    def function(a, b):


    print a, b


    apply(function, ("whither", "canada?"))


    apply(function, (1, 2 + 3))


    whither canada?


    1 5


    You can use the dictionary as the 3rd argument to ‘apply’ for passing keyword
    arguments to a given function. The below example will show you how to use the
    ‘apply’ function for passing the keyword arguments.


    Example: Passing keyword arguments using the ‘apply’ function.


    # File:builtin-apply-example-2.py


    def function(a, b):


    print a, b


    apply(function, ("crunchy", "frog"))


    apply(function, ("crunchy",), {"b": "frog"})


    apply(function, (), {"a": "crunchy", "b": "frog"})


    crunchy frog


    crunchy frog


    crunchy frog


    The ‘apply’ function is also widely used for passing constructor arguments that
    are in the subclass to the base class or the parent class. This is usually done
    when there are a lot of arguments present in the constructor.


    Here is an example showing the use of the apply function for calling the functions
    from the base class.


    Example: Calling the base class functions using the apply function.


    # File:builtin-apply-example-3.py


    class Rectangle:


    def __init__(self, color="white", width=10, height=10):


    print "create a", color, self, "sized", width, "x", height


    class RoundedRectangle(Rectangle):


    def __init__(self, **kw):


    apply(Rectangle.__init__, (self,), kw)


    rect = Rectangle(color="green", height=100, width=100)


    rect = RoundedRectangle(color="blue", height=20)


    create a green <Rectangle instance at 8c8260> sized 100 x 100


    create a blue <RoundedRectangle instance at 8c84c0> sized 10 x 20


    Python 2.0 provides an alternate syntax. Instead of apply, you can use an ordinary
    function call, and


    use * to mark the tuple, and ** to mark the dictionary.


    The following two statements are equivalent:


    result = function(*args, **kwargs)


    result = apply(function, args, kwargs)


    Loading and reloading modules


    Any professional Python programmer will know that with the import statement, he
    can call external modules. But you should also know that the import is used to
    delegate the work to a built-in function called ‘import’.


    Here is an example program using the import function.


    Example: Using the __import__ function to load named modules


    # File:builtin-import-example-1.py


    import glob, os


    modules = []


    for module_file in glob.glob("*-plugin.py"):


    try:


    module_name, ext = os.path.splitext(os.path.basename(module_file))


    module = __import__(module_name)


    modules.append(module)


    except ImportError:


    pass # ignore broken modules'
