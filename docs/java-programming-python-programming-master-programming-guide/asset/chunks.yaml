    \ python use these modules. In simple words, to get the classes into various programs,\
    \ we store them in modules and import them into other programs. We will learn\
    \ about these modules in this chapter.\n\n## Definition of a Module\n\nA python\
    \ file which contains only definitions of variables, functions, and classes is\
