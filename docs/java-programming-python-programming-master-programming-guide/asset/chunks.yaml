    ''July'',''August'',''September'',''October'',''November'',''  December'')


    Note, the''\'' thing at the end of the first line helps carrying the code into
    the next line. It makes longer lines more readable. Spaces after the comma are
    optional.


    Python organizes these values in numbered indexes that start from 0, in the order
    which you entered.


