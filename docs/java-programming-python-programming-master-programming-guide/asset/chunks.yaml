    \ prone part in the `try` block and check what happens. The menu is:\n\n### Example\
    \ - testing our fix\n\n```python\ndef menu(list, question):\n    for entry in\
    \ list:\n        print 1 + list.index(entry),\n        print \") \" + entry\n\
    \        try:\n            return input(question) - 1\n        except NameError:\n\
    \            print \"Enter a valid number”\n```\n\nLet’s have a look at another\
    \ error.\n\n### Example - Yet another error message\n\n```\nTraceback (most recent\
    \ call last):\nFile \"/home/steven/errortest.py\", line 12, in -toplevel-\n  \
    \  print 'You picked answer', (answer + 1)\nTypeError:unsupported operand type(s)\
    \ for+: 'NoneType' and 'int'\n```\n\nThe solution to the above error.\n\n### Example\
    \ - yet another solution\n\n```python\nanswer = menu(['A','B','C','D','E','F','H','I'],\n\
    'Which letter is your favourite? ')\ntry:\n    print 'You picked answer', (answer\
    \ + 1)\nexcept:\n    print '\\nincorrect answer.'\n```\n\n### Endless Errors\n\
    \nProblems we face by using many `except` statement is that no error will be detected.\n\
    \n### Example - The Problem We Face\n\n```python\nprint 'Subtraction program,\
    \ v0.0.1 (beta)'\na = input('Enter a number to subtract from> ')\nb = input('Enter\
    \ the number to subtract> ')\nprint a – b\n```\n\nIt works only if you give two\
    \ numbers. If you give an alphabet, it will show `NameError`:\n\n### Example -\
    \ Dealing With NameError\n\n```python\nprint 'Subtraction program, v0.0.2 (beta)'\n\
    loop = 1\nwhile loop == 1:\n    try:\n        a = input('Enter a number to subtract\
    \ from > ')\n        b = input('Enter the number to subtract > ')\n    except\
    \ NameError:\n        print \"\\n Subtraction of a letter isn’t possible”\n  \
