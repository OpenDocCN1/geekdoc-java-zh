  trans: "\n如所示，`self` 在类内部被使用。它给定的名称在类外部时会被应用。我们可以这样做来访问外部的函数。我们并不限制于使用单个实例，还可以为同一个类创建多个实例。\n\
    \n## 术语\n\n面向对象编程有一套与之相关的术语。\n\n当我们描述 `class` 时，我们将其定义为：\n\n- `Encapsulation`（封装）：将相似的函数和变量组合在一起的能力\n\
    - `class` 中的变量被称为 `Attribute`（属性）\n- `class` 中的函数被称为 `method`（方法）\n- 如果一个 `class`\
    \ 存储数据以及处理数据的技巧，则它被称为“数据结构”。\n\n## 继承\n\n继承是获取父类属性的现象。如果需要，我们还可以添加额外的功能。\n\n###\
    \ 示例 - `Shape` 类\n\n```python\nclass Shape:\n    def __init__(self,x,y):\n   \
    \     self.x = x\n        self.y = y\n    description = \"This shape has not been\
    \ described yet\"\n    author = \"Nobody has claimed to make this shape yet\"\n\
    \    def area(self):\n        return self.x * self.y\n    def perimeter(self):\n\
    \        return 2 * self.x + 2 * self.y\n    def describe(self,text):\n      \
    \  self.description = text\n    def authorName(self,text):\n        self.author\
    \ = text\n    def scaleSize(self,scale):\n        self.x = self.x * scale\n  \
    \      self.y = self.y * scale\n```\n\n现在，如果我们想基于之前的类 `Shape` 定义另一个类，比如 `square`，我们可以这样做：\n\
    \n### 示例 - 使用继承\n\n```python\nclass Square(Shape):\n    def __init__(self,x):\n\
    \        self.x = x\n        self.y = x\n```\n\n我们继承属性的父类名称写在括号中。\n\n## 类中使用的指针与字典\n\
    \n在类实例的情况下，左侧的名称成为右侧的类实例。因此，在 `instance2 = instance1` 中，我们说 `instance2` 正在“指向”\
    \ `instance1`。\n\n在 Python 中，这样做不需要指针。\n\n### 示例 - 类的字典\n\n```python\ndictionary\
    \ = {}\ndictionary[\"DoubleSquare 1\"] = DoubleSquare(5)\ndictionary[\"long rectangle\"\
    ] = Shape(600,40)\nprint dictionary[\"long rectangle\"].area()\n```\n\n# 第 11\
    \ 章：模块\n\n## 概述\n\nPython 标准库中有一个大量的集合，或者说范围广泛的模块。Python 库中存在各种模块。每个模块的设计都是为了执行特定的任务。几乎所有的函数都被这些模块覆盖。所有的大型\
    \ Python 程序都直接或间接地使用这些模块。简单来说，为了将类引入各种程序，我们将它们存储在模块中并导入到其他程序。我们将在本章学习这些模块。\n\n\
    ## 模块的定义\n\n只包含变量、函数和类定义的 Python 文件是一个模块。考虑一个例子。\n\n### 示例 - `moduletest.py`\n\
    \n```python\n# EXAMPLE PYTHON MODULE\nnumberone = 1\nageofqueen = 78\n\n# 定义一些函数\n\
    def printhello():\n    print \"hello everyone\"\n\ndef timesfour(input):\n   \
    \ print input * 4\n\n# 定义一个类\nclass Piano:\n    def __init__(self):\n        self.type\
    \ = raw_input(\"What type of sky\")\n    def printdetails(self):\n        print\
    \ \"The sky is \" + self.type + \" foot\"\n```\n\n模块看起来与普通程序相似。模块的目的是从你编写的其他程序中导入它的部分，你可以使用\
    \ `import` 运算符。例如，为了将 `moduletest.py` 导入主程序，我们可以这样操作：\n\n### 示例 - `mainprogram.py`\n\
    \n```python\nimport moduletest\ncfcpiano = moduletest.Piano()\ncfcpiano.printdetails()\n\
    ```\n\n## 内置函数与异常\n\nPython 中有两个基础模块：1. 内置函数和 2. 异常。当 Python 启动时，它会导入这两个模块，使得这些模块中的内容对所有程序可用。\n\
    \n### 内置函数\n\n在这个模块中，`python` 拥有所有的内置函数。这些内置函数在所有存在的模块中都是可用的。`Python` 会自动为你导入内置模块，让你无需担心每次都导入它。\n\
    \n### 使用元组或字典调用带参数的函数\n\n在 Python 中，你可以构建构建自己的参数列表。你可以通过将所有参数放在一个元组中并调用 `apply`\
    \ 函数来实现。这个 `apply` 函数也是一个内置函数。这里有一个示例将让你更好地理解 `apply` 函数。\n\n#### 示例：利用 `apply`\
    \ 函数\n文件：`builtin-apply-example-1.py`\n```python\ndef function(a, b):\n    print\
    \ a, b\n\napply(function, (\"whither\", \"canada?\"))\napply(function, (1, 2 +\
    \ 3))\n```\n\n你可以使用字典作为 `apply` 的第三个参数，向给定的函数传递关键字参数。下面的示例将向你展示如何使用 `apply` 函数传递关键字参数。\n\
    \n#### 示例：使用 `apply` 函数传递关键字参数。\n文件：`builtin-apply-example-2.py`\n```python\n\
    def function(a, b):\n    print a, b\n\napply(function, (\"crunchy\", \"frog\"\
    ), {\"b\": \"frog\"})\napply(function, (), {\"b\": \"frog\"})\n```\n\n`apply`\
    \ 函数广泛用于将子类中的构造函数参数传递给基类或父类。这通常在构造函数中存在大量参数时完成。这里有一个使用 `apply` 函数调用基类函数的示例。\n\n\
    #### 示例：使用 `apply` 函数调用基类函数。\n文件：`builtin-apply-example-3.py`\n```python\nclass\
    \ Rectangle:\n    def __init__(self, color=\"white\", width=10, height=10):\n\
    \        print \"create a\", color, self, \"sized\", width, \"x\", height\n\n\
    class RoundedRectangle(Rectangle):\n    def __init__(self, **kw):\n        apply(Rectangle.__init__,\
    \ (self,), kw)\n\nrect = Rectangle(color=\"green\", height=100, width=100)\nrect\
    \ = RoundedRectangle(color=\"blue\", height=20)\n```\n\nPython 2.0 提供了另一种语法。与其使用\
    \ `apply`，你可以使用普通的函数调用，并使用 `*` 标记元组，使用 `**` 标记字典。以下两个语句是等等的：\n\n```python\nresult\
    \ = function(*args, **kwargs)\nresult = apply(function, args, kwargs)\n```\n\n\
    ## 加载与重载模块\n\n任何专业的 Python 程序员都知道通过 `import` 语句调用外部模块。但你应该知道 `import` 用于将工作委托给一个名为\
    \ `__import__` 的内置函数。这里有一个使用 `import` 函数的示例程序。\n\n### 示例：使用 `__import__` 函数加载命名模块\n\
