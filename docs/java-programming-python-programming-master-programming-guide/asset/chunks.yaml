    \ document.write(\"<b>UNKNOWN Book</b>\");\n}\n//-->\n</script>\n```\n\n输出：JAVASCRIPT\
    \ book\n\n## 嵌套 if\n\n“嵌套 if”是指在另一个“if”语句内部的另一个“if”语句。\n\n语法：`if(condition) {if(condition){statement}\
    \ }`\n\n## switch 和 break 语句\n\n在 switch 语句中将有一个表达式，后面跟着几个不同的语句。这些语句将根据所选表达式的值执行。\n\
    \n语法：\n```javascript\nswitch (expression)\n{\n  case condition 1\n: statement(s)\n\
    \      break;\n  case condition 2: statement(s)\n                      break;\n\
    .\n.\n,\n  case condition n: statement(s)\n      break;\n  default:\nstatement(s)\n\
    }\n```\n\n`break` 语句用于表示前面的 switch case 的结束。\n\n## JavaScript 中的循环\n\n### for\
    \ 循环\n\n如果人们希望重复执行相同的代码，就会使用循环。“forfor 循环是可以使用的三种循环之一。“for 循环”简单且紧凑。\n\n它包含以下三点：\n\
    \n1. 启动语句在循环开始之前执行。\n2. 只有当给定的条件为真时才会执行循环。但会执行一次测试代码来运行该代码。\n3. 迭代的计数器可以增加也可以减少。\n\
    \n语法：\n```javascript\nfor (initialization; test condition; iteration statement){\n\
    \  如果测试条件为真，则执行的语句(s)\n}\n```\n\n示例：\n\n```html\n<script type=\"text/javascript\"\
    >\n<!--\nvar count;\ndocument.write(\"This will repeat for 10 times\" + \"<br\
    \ />\");\nfor(count = 0; count < 10; count++){\n  document.write(\"Currently repeated\
    \ : \" + count );\n  document.write(\"<br />\");\n}\ndocument.write(\"Done!!\"\
    );\n//-->\n</script>\n```\n\n输出：\n这将重复 10 次\n当前重复： 1\n当前重复： 2\n当前重复： 3\n当前重复：\
    \ 4\n当前重复： 5\n当前重复： 6\n当前重复： 7\n当前重复： 8\n当前重复： 9\n当前重复： 10\n\n# 第 2 章：JavaScript\
    \ 中的函数和事件\n\n## 什么是函数？\n\n一组在需要时可以在程序中任何地方被重用的代码被称为函数。它减少了人们反复编写相同代码的时间和精力。这减少了代码冗余。使用函数可以编写模块化代码。使用函数可以将一个大程序分成许多或所需的部分。JavaScript\
    \ 与任何其他编程语言一样，都支持编写模块化代码所需的特征。这是通过使用“函数”来实现的。\n\n`write()` 和 `alert()` 等函数是默认函数。JavaScript\
    \ 为用户提供了许多可以直接使用的函数。\n\nJavaScript 还允许人们创建自己的自定义函数。\n\n### 函数定义\n\n在使用函数之前，应该先定义它。`function`\
    \ 关键字是 JavaScript 中定义函数的常用方法。后面应该紧跟一个唯一的函数名和参数列表。它还应该包含一个带有大括号的语句块。\n\n语法：\n```html\n\
    <script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list)\n\
    {\n  statements\n}\n//-->\n</script>\n```\n\n示例：在下面的示例中，有一个简单的函数程序。\n\n```html\n\
    <script type=\"text/javascript\">\n<!--\nfunction simplefunction()\n{\n  alert(\"\
    This is a simple function\");\n}\n//-->\n</script>\n```\n\n### 调用函数\n\n要在 JavaScript\
    \ 中调用函数，应该如下所示编写该函数的名称。\n\n```html\n<script type=\"text/javascript\">\n<!--\n\
    simplefunction();\n//-->\n</script>\n```\n\n### 函数的参数\n\n在 JavaScript 中，函数也可以带有参数传递。在调用函数时，JavaScript\
    \ 可以传递不同的参数。可以通过传递的函数中的参数进行操作。逗号用于分隔函数中的多个参数。\n\n示例：\n\n在接下来的示例中，我们将修改我们的 `simplefunction`\
    \ 函数。\n\n```html\n<script type=\"text/javascript\">\n<!--\nfunction simplefunction(name,\
    \ age)\n{\n  alert(name + \" is \" + age + \" years old.\");\n}\n//-->\n</script>\n\
    ```\n\n现在函数可以这样调用：\n\n```html\n<script type=\"text/javascript\">\n<!--\nsimplefunction('Zara',\
    \ 7);\n//-->\n</script>\n```\n\n### return 语句\n\n如果用户期望函数的返回值，则可以在函数中添加可选的 `return`\
    \ 语句。`return` 语句总是函数的最后一个语句。\n\n例如：\n\n```html\n<script type=\"text/javascript\"\
    >\n<!--\nfunction concatenate(first, last)\n{\n  var full;\n  full = first + last;\n\
    \  return full;\n}\n//-->\n</script>\n```\n\n现在函数可以这样调用：\n\n```html\n<script type=\"\
    text/javascript\">\n<!--\nvar result;\nresult = concatenate('Zara', 'Ali');\n\
    alert(result);\n//-->\n</script>\n```\n\nJavaScript 中的事件\n\n### 事件\n\n事件处理 JavaScript\
    \ 和 HTML 之间的交互。当页面被用户或浏览器操作时就会发生这种情况。\n\n一切都是事件。页面加载是一个事件。当用户通过点击选择内容时，点击也被视为事件。事实上，用户执行的任何操作如关闭窗口、选择链接、按键、关闭标签、调整窗口大小等都是事件的示例。\n\
    \n在 JavaScript 中编写的响应是通过这些事件执行的。事件是文档对象模型 (DOM) Level3 的。每个 HTML 元素都提供一组事件。这些事件触发\
    \ JavaScript 代码。\n\n### onclick 事件类型\n\n这是一种事件，点击时会显示所需的验证或警告等。这被广泛使用。\n\n示例：下面的代码，当点击\
    \ onclick hello 按钮时，它会触发 `events` 函数。\n\n```html\n<html>\n<head>\n<script type=\"\
    text/javascript\">\n<!--\nfunction events() {\n  alert(\"Hello World\")\n}\n//-->\n\
    </script>\n</head>\n<body>\n<input type=\"button\" onclick=\"events()\" value=\"\
    Say Hello\" />\n</body>\n</html>\n```\n\n### onsubmit 事件类型\n\n`onsubmit` 事件是另一个重要的事件类型。在这里提交表单时会进行验证。如果函数返回\
    \ true，则文本将被发送。\n\n示例：\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\n<!--\nfunction validation() {\n  // 所有验证都在这里\n  .........\n  return true 或\
    \ false\n}\n//-->\n</script>\n</head>\n<body>\n<form method=\"POST\" action=\"\
    t.cgi\" onsubmit=\"return validation()\">\n.......\n<input type=\"submit\" value=\"\
    Submit\" />\n</form>\n</body>\n</html>\n```\n\n# 第 3 章：JavaScript 中的调试\n\n在编写程序时，有很多机会出现错误。\n\
    \n脚本中的此类错误被称为 bug（漏洞）。\n\n调试是修复 bug 的过程。在开发过程中，调试是正常的一部分。\n\n"
- fmt: "\nThe code we write might have logical errors or syntax errors, which are\
    \ difficult to identify. Many times, nothing will happen when JavaScript code\
    \ contains errors. No messages will indicate that’s an error in the program.\n\
    \n## Using a Validator\n\nIf one wants to check code for bugs, then one must make\
    \ sure it is valid code and check it if it follows the official rules of the language\
    \ by running it using a program called Validators, or in short, just Validators.\
    \ They often come with JavaScript editors. After visiting the web page, click\
    \ the button once you paste the code in the text area. This program will parse\
    \ through our code to ensure that all variables and function definitions are in\
    \ correct syntax.\n\n## Adding Debugging Code to Programs\n\nThe `alert()` or\
    \ `document.write()` methods help in debugging your code. For example:\n\n```var\
    \ debugging = true;\nvar whichImage = \"widget\";\n\nif( debugging )\nalert( \"\
    swapImage() with argument: \" + whichImage );\nvar swapStatus = swapImage( whichImage\
    \ );\n\nif( debugging )\nalert( \"swapImage() with swapStatus=\" + swapStatus\
    \ );\n```\n\n## Using a JavaScript Debugger\n\nA debugger is an application which\
    \ gives the programmer control over the execution of the script. Debugger facilitates\
    \ the user to examine the flow. The script is run by line and can be instructed\
    \ to stop at breakpoints. The programmer can check the script’s state and variables\
    \ after the execution completes.\n\n## Form Validation\n\nAfter the client enters\
    \ the required information and clicks the submit button, form validation occurs.\
    \ The server must send all the data again to the user and request the user to\
    \ resubmit the form with correct or valid information. This occurs if the user\
    \ fails to enter all of the required information or enters invalid data. Before\
    \ sending the form to the web browser, JavaScript facilitates the validation of\
    \ the form’s data on the client’s computer itself.\n\nTwo functions are generally\
    \ performed by the form:\n\n- Basic Validation: To ensure that the data has been\
    \ provided into every mandatory field, first the form needs to be checked. The\
    \ data needs to loop through each field.\n- Validation of the Data: This is to\
    \ check if correct or valid data has been entered in the form.\n\n## Basic Form\
    \ Validation\n\nLet us see how basic form validation is performed. We call the\
    \ `validate()` function to validate data when submit event occurs. `validate()`\
    \ function is implemented as follows:\n\n```html\n<script type=\"text/javascript\"\
    >\n<!--\n// Form validation code will come here.\nfunction validate()\n{\n  if(\
    \ document.myForm.Name.value == \"\" )\n  {\n    alert( \"Please enter your name!\"\
    \ );\n    document.myForm.Name.focus() ;\n    return false;\n  }\n  if( document.myForm.EMail.value\
    \ == \"\" )\n  {\n    alert( \"Please enter your id!\" );\n    document.myForm.EMail.focus()\
    \ ;\n    return false;\n  }\n  if( document.myForm.Zip.value == \"\" ||\n    \
    \  isNaN( document.myForm.Zip.value ) ||\n      document.myForm.Zip.value.length\
    \ != 5 )\n  {\n    alert( \"Please enter the zip in the format #####.\" );\n \
    \   document.myForm.Zip.focus() ;\n    return false;\n  }\n  if( document.myForm.Country.value\
    \ == \"-1\" )\n  {\n    alert( \"Please enter your country name!\" );\n    return\
    \ false;\n  }\n  return( true );\n}\n//-->\n</script>\n```\n\n## Data Format Validation\n\
    \nValidation of the data can be done before submission of the data to the web\
    \ server. Validating an email id means the email id should contain an `@` sign\
    \ and a dot (`.`), can be seen in the below given example. Also, the last dot\
    \ should be minimum one character after the `@` sign, and the email address shouldn’t\
    \ begin with an `@` symbol.\n\n```html\n<script type=\"text/javascript\">\n<!--\n\
    function validateEmail()\n{\n  var emailID = document.myForm.EMail.value;\n  atpos\
    \ = emailID.indexOf(\"@\");\n  dotpos = emailID.lastIndexOf(\".\");\n  if (atpos\
    \ < 1 || ( dotpos - atpos < 2 ))\n  {\n    alert(\"Please enter a valid email\
    \ ID\")\n    document.myForm.EMail.focus() ;\n    return false;\n  }\n  return(\
    \ true );\n}\n//-->\n</script>\n```\n\n# Chapter 4: Objects in JavaScript\n\n\
    ## JavaScript-objects\n\nObjects in JavaScript consist of attributes. An attribute\
    \ is considered a method, if it has a function.\n\n## Object Properties\n\nThe\
    \ properties of the object can be in any data types. The following syntax is used\
    \ to add property to the object:\n\n```javascript\nobjectName = propertyValue;\n\
    ```\n\n## Example\n\nThe next example shows how to use the \"title\" property:\n\
    \n```javascript\nstrg = document.title;\n```\n\n## Object Methods\n\nThe functions\
    \ allowing the object to do a particular task.\n\n## Example\n\nThe following\
    \ example shows how to use `write()`:\n\n```javascript\ndocument.write(\"This\
    \ is\");\n```\n\n## User-Defined Objects\n\nThe `new` operator helps in creating\
    \ instances of objects. The following example, `Object()`, `Array()`, and `Date()`\
    \ are in-built functions.\n\n## The `Object()` Constructor\n\nAn object can be\
    \ created and initialized by the constructor. The following example shows to object:\n\
    \n```html\n<html>\n<head>\n<title>objects defined by the user</title>\n<script\
    \ type=\"text/javascript\">\nvar book = new Object();\nbook.subject = \"Perl\"\
    ;\nbook.author = \"Yashwanth\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Book name is : + book.subject + \"<br>\");\ndocument.write(\"\
    Book author is : + book.author + \"<br>\");\n</script>\n</body>\n</html>\n```\n\
    \n## JavaScript Native Objects\n\nJavaScript consists of many in-built objects.\
    \ Their behavior is not affected by the browser or the platform on which they\
    \ run. The following is a list of most widely used objects:\n\n1. Number Object\n\
    2. Boolean Object\n3. [String](https://www.tutorialspoint.com/javascript/strings_object.htm)\
    \ Object\n4. JavaScript Math Object\n\n## The Number Object\n\nThe number objects\
    \ in JavaScript are used to represent numerical values. It can hold both integers\
    \ and floating point values. Whenever encountered with numerical values, the web\
    \ browser converts those values into number class instances automatically.\n\n\
    ### Syntax\n\nThe syntax for creating a number object is as follows:\n\n```javascript\n\
    value = new Number(number);\n```\n\n### Number Methods\n\nThe following are the\
    \ methods that are consisted in the number object:\n\n| Method | Description |\n\
    | :--- | :--- |\n| `constructor()` | This method is used to return the function\
    \ that created the instance of the object. |\n| `toExponential()` | This methods\
    \ results in the display of a standard range number in the exponential form. |\n\
    | `toLocaleString()` | This method takes a number and returns a string version\
    \ for the number. It is done in a format that varies with the locale settings\
    \ of the web browser. |\n| `toPrecision()` | This method defines the number of\
    \ digits to be displayed in a given number. This includes the digits that are\
    \ present on either side of the decimal. |\n| `toString()` | This method helps\
    \ to convert a number into a string value. |\n"
