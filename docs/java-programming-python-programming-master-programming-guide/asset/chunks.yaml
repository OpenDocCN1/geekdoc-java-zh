    \nIn case of class instances the name that is at the left becomes the class instance\
    \ for the right. So in `instance2 = instance1`, `instance2` is said 'pointing'\
    \ to `instance1`.\n\nIn python doing this doesn’t require pointers.\n\n### Example\
