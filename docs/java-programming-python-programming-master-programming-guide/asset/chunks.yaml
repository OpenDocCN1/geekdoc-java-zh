- fmt: "\n# Syntax and meanings of keywords\n\n```java\nimport java.io.*;\n\npublic\
    \ class MyFirstProgram {\n    public static void main(String[] args) {\n     \
    \   //This is my first java program\n        System.out.println(“ Hello World\
    \ !”);\n    }\n}\n```\n\n- `import` keyword `import` is used for including java\
    \ libraries called `packages` which contain pre-defined functions that can be\
    \ used in the program.\n- `public class MyFirstProgram` - this is the class definition,\
    \ the key word `public` indicates that this class is available to all and `class`\
    \ denotes to be a class definition.\n- `MyFirstProgram` – This is the name of\
    \ a class. Name of the class having the `main()` function should be the same as\
    \ the source file name.\nThe class definition is enclosed within the parenthesis\
    \ `{}`.\n- `public static void main (String args[])`: This is the main part of\
    \ the program. Since `main()` is the driver function, it should always be `public`.\n\
    - `static`: You need to keep in mind that `main()` method should always be `static`\
    \ because it makes the program memory efficient.\n- `void`: This is the return\
    \ type of the method. This means that the `main()` method will not return anything.\n\
    - `main`: name of the method. The interpreter starts execution from the `main()`\
    \ method only. Running a program means instructing the JVM to `load` the `.class`\
    \ file which was compiled from the source code and start executing from the `main()`\
    \ method.\n\nThe two uses of the `main` method can be summarized as:\n1. To Test\
    \ all the other methods of the program\n2. To Start execution of the program.\n\
    - `String[] args`: is the argument that is passed to the `main` method. This method\
    \ always takes an array of strings as its input parameter, and the array name\
    \ should always be `args`.\nNote that the data type starts with a upper case `S`,\
    \ this is because `Strings` is a class in Java and all class names start with\
    \ upper case.\n\nThe definition of the method is enclosed within flower braces\
    \ `{}`, in this case, the only thing that we want our program to do is print “Hello\
    \ World!”\nTo print a statement to standard output console, `System.out.println(\"\
    \");` is used. Note that all statements must end with a semi-colon (`;`).\nYou\
    \ can also use `System.out.print()` to display output, the difference is that\
    \ print `ln` introduces a new line at the end of each statement it prints.\nThe\
    \ other statement within the `main()` method in our program is called a “comment”\
    \ statement. These are not compiled, the purpose of these statements which are\
    \ preceded by `//` are only to give the programmer more information about code.\n\
    Java doesn’t have the concept of global variables at all, the same is achieved\
    \ using keywords such as `final`, `static`, `public`.\n\n# Object Oriented Programming\n\
    \nJava, has its syntaxes similar to C while programming philosophy from C++ -\
    \ that is, java is an object oriented language.\nIn the first example that we\
    \ saw, we had a class declaration and said that the `main()` function takes care\
    \ what gets done in our program, well, that doesn’t make java a OOP language,\
    \ let’s see an example of to understand OOP - objects and classes better.\n\n\
    ## Procedural Approach\n\nIt is not that simple, because the previous shapes were\
    \ definite and animation code could have assumed a centre point and rotated the\
    \ shape, while in case of an indefinite shape like amoeba, it’ll not rotate using\
    \ the code for other shapes, instead the API needs to take couple of more arguments\
    \ o define the co-ordinates on which the shape should rotate.\n\n## Object Oriented\
    \ Approach\n\nSo you can write one class file each for the shapes, so adding amoeba\
    \ or modifying to rotate method is done without disturbing existing code, by simple\
    \ adding a new class. You need to test only the new class, any new issue introduced\
    \ can be easily tracked to the new changes made.\n\n### Example 1\n```java\nclass\
    \ Movie{\n    //variable Declaration\n    //methods\n} m1; //m1 isan object of\
    \ classstype “Movie”\n```\n\n### Example 2\n```java\nclass Movie{\n    //variable\
    \ Declaration\n    //methods\n}\n\nclass TestMovie{\n    public static void main(String[]\
    \ args){\n        Movie m1 = new Movie(); // m1 is an object of type “Movie”\n\
    \        m1.variable = value;\n        m1.method();\n    }\n}\n```\n\n# Variable\
    \ Declaration & Data Types\n\nThe next most important and fundamental concept\
    \ to learn is about “variables” and “data types” to create useful programs. Variables\
    \ are basically named memory location, which are used to hold values. Java is\
    \ a strongly typed language, so the variable of type `x` can hold a value of type\
    \ `x` only.\nFor example:\n```java\nint n;\n```\nHere a variable `n` is declared\
    \ to hold value of type `int`. Declaring variable type ensure “type-safety” feature\
    \ of java which in turn contributes to “security”.\nVariables in java can be either:\n\
    - Local Variables (primitive data types like `int`, `float`, `double`, `Boolean`\
    \ etc)\n- Reference Variables (objects – user defined instances of class)\n\n\
    Note that the data type starts with a upper case `S`, this is because `Strings`\
    \ is a class in Java and all class names start with upper case.\n\n## Strings\n\
    \nString is a class. Some popular operations on string:\n```java\nString str =\
    \ “Hello”;\nint len = str.length();\nString concatStr = “hello”+”world”;\nif (str1\
    \ == str2) {\n    System.out.println(“strings are equal”);\n}\n\n\n## Reference\
    \ Variable\n\n`Movie m1 = new Movie()`\nTo the left is the declaration which holds\
    \ the actual object.\n```java\nint[] n;\nn = new int[5];\n```\nNote that even\
    \ its an array of primitive type values, an array becomes an object.\n\n## Equals\
    \ Operation\n\nWe know that comparison operators like `==` and `!=` can be used\
    \ on primitive types, but in order to perform comparison on objects, one cannot\
    \ use the default operators, instead java provides keywords `equals`.\n\n## Array\
    \ List\n\n```java\nimport java.util.ArrayList;\nArrayList myList = new ArrayList<>();\n\
    ```\nIt allows the declaration of an array with different data types. It offers\
    \ multiple methods to perform common array operations like `add(elem)`, `remove(index)`\
    \ to add/remove elements from the arrayList. Also API’s like `size()` to find\
    \ the length of array, to find `isEmpty()` or if the arrayList `contains()` a\
    \ given element.\n\nLet’s see an example using the concepts learnt so far:\n\n\
    ```java\nClass MyProgram{\n    public static void main(Strings[] args){\n    \
    \    //declare and assign variables\n        int num = 10;  \n        float fNum\
    \ = 10.5;\n        //print statements to output consoles\n        System.out.println(“The\
    \ value of integer num is : ”+num);\n        System.out.println(“The Value of\
    \ integer fNum is : ”+fNum);\n        num = num/2;\n        fNum = fNum+num;\n\
    \        System.out.println(“The value of integer num after operation is : ”+num);\n\
    \        System.out.println(“The Value of integer fNum after operation is : ”+fNum);\n\
    \    }\n}\n```\n\nOutput:\nThe value of integer num is : 10\nThe value of integer\
    \ fNum is : 10.5\nThe value of integer num after operation is : 5\nThe value of\
    \ integer fNum after operation is  : 20.5\n"
