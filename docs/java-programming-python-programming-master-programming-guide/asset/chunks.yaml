    | Index |                   Value |


    | 0 |                  January |


    | 1 |                  Feb |


    | 2 |                  Mar |


    | 3 |                  Apr |


    | 4 |                  May |


    | 5 |                  Jun |


    | 6 |                  Jul |


    | 7 |                  Aug |


    | 8 |                 Sep |


    | 9 |                 Oct |


    | 10 |                 Nov |


    | 11 |                 Dec |


    ## Lists


    Lists are very much same as tuples. Lists are ''mutable'', so their values are
    changeable. Generally we use lists and not tuples since we are able to make any
    changes easily. For example there are four cats called Snappy, Kitty, Jessie and
    Chester.


    Example -Creating a List


    cats = [''Snappy'', ''Kitty'', ''Jessie'', ''Chester'']


    The only difference you find is the use of square brackets and not parenthesis.


    Adding a value to the list can be done using the ‘append()’ function.


    Example-Adding items to the list


