- fmt: "\nThe above script generates an ‘Indentation Error’; it means all the three\
    \ statements are supposed to form a single block and hence should have the same\
    \ amount of indentation.\n\nThe user can use variable number of spaces as the\
    \ indentation. But, care must be taken that the statements within a single block\
    \ should have the same number of spaces as indentation.\n\nIf you are familiar\
    \ with C language, take a look at the if-else statement written in C:\n\n```c\n\
    if(5<7)\n{\n    printf (\"The given condition is true\");\n    printf (\"abc\"\
    );\n}\nelse\n{\n    printf (\"This given condition is false\");\n    printf (\"\
    xyz\");\n}\n```\n\nThe above C code can be written in Python as follows:\n\n```python\n\
    if 5<10:\n    print 'The given condition is true'\n    print 'abc'\nelse:\n  \
    \  print 'The given condition is false'\n    print 'xyz'\n```\n\nNotice the differences\
    \ between the syntax of the two languages. And also, notice that indentation has\
    \ been used in Python instead of braces `{}` to specify a block.\n\nConsider changing\
    \ the indentation of one of the print statements from the above code as follows:\n\
    \n```python\nif 5<10:\n    print 'The given condition is true'\nprint 'abc'\n\
    else:\n    print 'The given condition is false'\n    print 'xyz'\n```\n\nOUTPUT:\n\
    ```\n[Line 3](http://codepad.org/gpkkOzLB#line-3)\n  print \"abc\"\n       ^\n\
    Indentation Error: unindent does not match any outer indentation level\n```\n\n\
    In the above code, in line 3, the `print` statement deviates from the indentation\
    \ of all the print statements, and hence an error is generated.\n\nTake a look\
    \ at another example in Python:\n\n### Block 1\n```python\nif 5<10:\nprint \"\
    abc\"\nelse:\nprint \"xyz\"\n```\nOUTPUT: abc\n\nIn the above block, `if` and\
    \ `else` should have the same indentation, as they together form a control statement\
    \ block. Similarly, the `print` statements should have the same indentation, as\
    \ each `print` statement is considered a block of code.\n\nHowever, the following\
    \ block will give an error:\n\n### Block 2\n```python\nif 5<10:\nprint \"abc\"\
    \nelse:\nprint \"xyz\"\n```\nOUTPUT:\n```\n[Line 2](http://codepad.org/rnoeN4o0#line-2)\n\
    \  print \"abc\"\nIndentationError: expected an indented block\n```\n\nAn error\
    \ is generated as the `if else` statement and `print` statements are all given\
    \ the same indentation.\n\nConsider another block of statements:\n\n### Block\
    \ 3\n```python\nif 5<10:\nprint \"abc\"\nelse:\nprint \"xyz\"\n```\nThe above\
    \ code gives the output as follows:\n\nOUTPUT:\n```\n[Line 1](http://codepad.org/81avkQsU#line-1)\n\
    \  if 5<10:\n  ^\nIndentationError: unexpected indent\n```\n\nHence, care should\
    \ be taken while indenting the lines of Python code. As for spaces between the\
    \ lines, any number of blank lines can be left between any two lines of codes.\n\
    \nExample:\n```python\nif 5<10:\n    print '5 is less than 10'\n    print \"abc\"\
    \nelse:\n    print \"xyz\"\n```\nIn the above block of code, 5 lines have been\
    \ left blank between the `if` statement and the `else` statement. Still, it does\
    \ not have any effect on the output and no error is generated. The programmers\
    \ need to be cautious only about the line indentation.\n\n**Note:** Even though\
    \ any number of spaces can be given as indentation, it is a good practice to use\
    \ 4 spaces as indentation.\n\n## Multi-Line Statements\n\nIn Python, a statement\
    \ ends with a single line. A new line indicates that the statement in the previous\
    \ line has ended. In other words, Python does not allow a single statement to\
    \ be written in multiple lines.\n\nExample: Consider a program which is used to\
    \ find sum of three numbers\n```python\na=10\nb=5\nc=5\nsum= a+b+c\nprint sum\n\
    ```\nOUTPUT: 20\n\nNow, try rewriting the code by splitting up the expression\
    \ in line 4 into two lines:\n```python\na=10\nb=5\nc=5\nsum= a+\n    b+c\nprint\
    \ sum\n```\nOUTPUT:\n```\n[Line 3](http://codepad.org/I13POw#line-3)\n  sum= a+\n\
    \    ^\nSyntax Error: invalid syntax\n```\nIn the above program, line 4 has only\
    \ part of a statement, with its continuation in following lines. Yet, the interpreter\
    \ assumes that the statement has ended in the single line. Hence, an error is\
    \ generated as the expression `sum = a+` has no relevance.\n\nConsider writing\
    \ the same program as follows:\n```python\na=10\nb=5\nc=5\nsum= a\n+b+c\nprint\
