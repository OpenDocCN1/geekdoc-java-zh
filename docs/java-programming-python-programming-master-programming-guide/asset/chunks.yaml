    \ self.description = \"这个形状尚未被描述”\n        self.author = \"没有人作者”\n    def area(self):\n\
    \        return self.x * self.y\n    def perimeter(self):\n        return 2 *\
    \ self.x + 2 * self.y\n    def describe(self,text):\n        self.description\
    \ = text\n    def authorName(self,text):\n        self.author = text\n    def\
    \ scaleSize(self,scale):\n        self.x = self.x * scale\n        self.y = self.y\
    \ * scale\n```\n\n在这里创建了描述，并且可以对形状进行操作。形状具有宽度（x）、高度（y）、面积和周长（分别为 `area(self)`\
    \ 和 `perimeter(self)`）。定义类并不意味着运行代码。\n\n`__init__` 函数在我们创建 Shape 的实例时执行。\n\n`self`\
    \ 用于引用类中属于它自己的事物。`self` 是类中函数的第一个因子。（要在类或其他地方访问变量和函数，其名称应置于 `self` 和 `.` 之后 `self.variable_name`）。\n\
    \n使用类：\n\n示例 - 创建类\n\n```python\nrectangle = Shape(100,45)\n```\n\n当我们通过类的实例时，提供名称（在本例中为\
    \ Shape）并在括号中传递给 `__init__` 函数的值，它运行并给出一个类的实例，赋值给名称 `rectangle`，即类名。\n\n示例 - 从实例外部访问属性\n\
    \n# 获取矩形的面积：\n\n`print rectangle.area()`\n\n# 获取矩形的周长：\n\n`print rectangle.perimeter()`\n\
    \n# 描述矩形\n\n`rectangle.describe(\"一个宽矩形”)`\n\n# 将矩形缩小 50%\n\n`rectangle.scaleSize(0.5)`\n\
    \n"
