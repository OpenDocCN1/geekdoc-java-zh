  trans: "\n\n# 关键字的语法与含义\n\n```java\nimport java.io.*;\n\npublic class MyFirstProgram\
    \ {\n    public static void main(String[] args) {\n        //This is my first\
    \ java program\n        System.out.println“ Hello World !”);\n    }\n}\n```\n\n\
    - `import` 关键字 `import` 用于引入名为 `packages`（包）的 Java 库，包包含了可以在程序使用的预定义函数。\n- `public\
    \ class MyFirstProgram` - 这是类的定义，关键字 `public` 表示该类对所有人可见，`class` 表示定义为一个类定义。\n\
    - `MyFirstProgram` – 这是类的类名。带有 `main()` 函数的类名必须与源文件名相同。\n类的定义被包含在大括号 `{}` 之中。\n\
    - `public static void main (String args[])`: 这是程序的主体。由于 `main()` 是驱动函数，它应该始终 `public`（公共的）。\n\
    - `static`: 你需要记住 `main()` 方法应该是 `static`（静态的），因为这使得程序在内存利用上更高效。\n- `void`: 这是方法的返回类型。这意味着\
    \ `main()` 方法将不会返回任何内容。\n- `main`: 方法名。解释器仅从 `main()` 方法开始执行。运行程序意味着指示 JVM `load`（加载）从源码编译的\
    \ `.class` 文件并从 `main()` 方法开始执行。\n\n`main` 方法的两个用途可以总结为：\n1. 测试程序中的所有其他方法\n2.\
    \ 启动程序的执行\n- `String[] args`: 是传递给 `main` 方法的参数。该方法始终接收字符串数组作为输入参数，且数组名称应始终为 `args`。\n\
    注意数据类型大大写字母 `S`，这是因为 `Strings` 是 Java 中的一个类，且所有类名都以大写字母开头。\n\n方法的定义包含在花括号 `{}`\
    \ 中，在这种情况下，我们希望程序执行的唯一目的是打印“Hello World!”。\n要向标准输出控制台打印语句，使用 `System.out.println(\"\
    \");`。注意所有语句必须以分号（`;`）结尾。\n你也可以使用 `System.out.print()` 来显示输出，区别在于 `print ln` 在其打印的每个语句末尾引入一个新行。\n\
    我们程序中 `main()` 方法中的另一个语句被称为“注释”语句。这些语句不会被编译，以 `//` 开头的这些语句的作用仅向程序员提供更多关于代码的信息。\n\
    Java 完全没有全局变量的概念，但使用 `final`、`static`、`public` 等关键字可以实现同样。\n\n# 面向对象编程\n\nJava\
    \ 的语法与 C 相似，但编程哲学源自 C++ —— 即 Java 是一种面向对象的语言。\n在我们 ways 看到的第一个示例中，我们有一个类声明，并说明\
    \ `main()` 函数负责程序中执行的内容，不过，这并没有让 Java 成为一种 OOP（面向对象）语言，让我们通过示例来更好地理解 OOP —— 对象和类。\n\
    \n## 过程化方法\n\n这并不那么简单，因为之前的形状是确定的，动画代码可以假设一个中心点并旋转形状，而对于变形虫这样不确定的形状，它无法使用其他形状的代码进行旋转，相反，API\
    \ 需要更多的参数来定义形状应该旋转的坐标。\n\n## 面向对象方法\n\n因此，你可以为每个形状编写一个类文件，这样通过简单的添加新类就可以添加变形虫或修改旋转方法，而不会扰动现有代码。你只需要测试新类，引入的任何新问题都可以轻松追踪到所做的新更改。\n\
    \n### 示例 1\n```java\nclass Movie{\n    //变量声明\n    //方法\n} m1; //m1 是类型为“Movie”的类的对象\n\
    ```\n\n### 示例 2\n```java\nclass Movie{\n    //变量声明\n    //方法\n}\n\nclass TestMovie{\n\
    \    public static void main(String[] args){\n        Movie m1 = new Movie();\
    \ // m1 是类型为“Movie”的对象\n        m1.variable = value;\n        m1.method();\n \
    \   }\n}\n```\n\n# 变量声明与数据类型\n\n要学习的下一个重要且基础的概念是关于创建有用程序的“变量”和“数据类型”。变量本质上是命名的内存位置，用于存储值。Java\
    \ 是一种强类型语言，因此类型为 `x` 的变量只能持有类型为 `x` 的值。\n例如：\n```java\nint n;\n```\n这里声明变量 `n`\
    \ 用于存储 `int` 类型的值。声明变量类型确保了 Java 的“类型安全”特性，这反过来有助于“安全性”。\nJava 中的变量可以是：\n- 局部变量（原始数据类型如\
    \ `int`、`float`、`double`、`Boolean` 等）\n- 引用变量（对象 – 用户定义的类实例）\n\n注意数据类型大写字母 `S`，这是因为\
    \ `Strings` 是 Java 中的一个类，且所有类名都以大写字母开头。\n\n## 字符串\n\nString 是一个类。字符串的一些常用操作：\n\
    ```java\nString str = “Hello”;\nint len = str.length();\nString concatStr = “hello”+”world”;\n\
    if (str1 == str2) {\n    System.out.println“strings are equal”);\n}\n```\n\n##\
    \ 引用变量\n\n`Movie m1 = new Movie()`\n左侧是持有对象的声明。\n```java\nint[] n;\nn = new int[5];\n\
    ```\n注意即使是原始类型的数组，数组也是对象。\n\n## Equals 操作\n\n我们知道 `==` 和 `!=` 等比较运算符可以用于原始类型，但为了对对象进行比较，不能使用默认运算符，相反\
    \ Java 提供了 `equals` 关键字。\n\n## 列表\n\n```java\nimport java.util.ArrayList;\nArrayList\
    \ myList = new ArrayList<>();\n```\n它允许声明不同数据类型的数组。它提供了多个方法来执行常见的数组操作，如 `add(elem)`、`remove(index)`\
    \ 用于从列表中添加/删除元素。还有 API 如 `size()` 用于查找长度、`isEmpty()` 或列表是否 `contains()` 给定元素。\n\
    \n让我们来看一个使用目前所学概念的示例：\n\n```java\nClass MyProgram{\n    public static void main(Strings[]\
    \ args){\n        //声明并赋值变量\n        int num = 10;  \n        float fNum = 10.5;\n\
    \        //打印语句到控制台\n        System.out.println“The value of integer num is :\
    \ ”+num);\n        System.out.println“The Value of integer fNum is : ”+fNum);\n\
    \        num = num/2;\n        fNum = fNum+num;\n        System.out.println“The\
    \ value of integer num after operation is : ”+num);\n        System.out.println“The\
    \ Value of integer fNum after operation is : ”+fNum);\n    }\n}\n```\n\n输出：\n\
    The value of integer num is : 10\nThe value of integer fNum is : 10.5\nThe value\
    \ of integer num after operation is : 5\nThe value of integer fNum after operation\
    \ is : 20.5\n\n"
- fmt: "\n# Control Statements\n\nThe control statements in a program, as the name\
    \ itself suggests, control the general flow of every program. It includes conditional\
    \ statements like `if else`, or iteration statements like `while ()`, `do while()`\
    \ etc.\n\n![](images/00003.jpeg)\n\n## If else\n\nSyntax :\n\n```javascript\n\
    if(condition)\n    do action1;\nelse\n    do action2;\n```\n\nAn action is taken\
    \ when the `condition` is true, or else the action in the `else` part is taken.\n\
    \n### Switch case\n\nThis operation comes in handy if you had to check for multiple\
    \ conditions. `Switch case` takes action based on a given value.\n\nSyntax :\n\
    \n```javascript\nSwitch(id)\n{\nCase id1:\n    Action;\n    Break;\nCase id2:\n\
    \    Action;\n    Break;\n….\nDefault:\n….\n}\n```\n\n### While ()\n\nThis is\
    \ an iteration statement, which performs action as long as the condition is true.\n\
    \nSyntax:\n\n```javascript\nwhile(condition)\n{\n    Do something while condition\
    \ is true;\n}\n```\n\n### Do - while ()\n\nThis too is an iteration operation,\
    \ quite similar to the `while()` loop, the difference being that the loop will\
    \ execute at least once irrespective of the validity of the condition, because\
    \ the condition is evaluated only after the `do` statement.\n\nSyntax\n\n```javascript\n\
    do{\n    do Something\n}while(condition);\n```\n\n### For loop\n\nSyntax: `for\
    \ ( initialization ;condition; updation)`\n\nExample : `for (int i=0; i<5; i++)`\
    \ will now execute the statement for 5 times. The first part declares and initializes\
    \ a value to the `counter` variable, the second part checks the condition, if\
    \ true, it enters loop. On completion of loop, it performs the increment. Then\
    \ it again checks the condition and continues the same till the condition turns\
    \ false. Once the condition is false, it exits of the loop.\n\nExample:\n\n```java\n\
    Class MyProgram{\npublic static void main(Strings[] args){\n    //declare and\
    \ assign variables\n    int num = 5, i;\n    while( num > 0){\n        System.out.println(\"\
    The Value of integer Num is :\"+num);\n        num--;\n    }\n    for(i = 0;i<5;\
    \ i++)\n        System.out.println(\"The Value of integer Num is :\"+num);\n \
    \   }\n}\n```\n\nOutput:\nThe Value of integer Num is : 5\nThe Value of integer\
    \ Num is : 4\nThe Value of integer Num is : 3\nThe Value of integer Num is : 2\n\
    The Value of integer Num is : 1\n\nThe above stated program used two looping statements\
    \ to perform the operations.\n\n# Encapsulation\n\nEncapsulation, as the name\
    \ suggests, capsules the data. In simpler words, it hides the data, thereby providing\
    \ security. Arguments passed can be either by value or reference. The data type\
    \ is declared after determining one to use. A method of the class is accessed\
    \ by the object using the dot operator.\n\n`Movie m1 = new Movie()`\n`M1.printName()`\
    \ //print the name\nOr `M1.play(count)` //play the movie n times\n\nIn the following\
    \ example, a getter is used to read the value of a class variable and then set\
    \ a value to the variable.\n\n```java\npublic class GetterSetter{\n    //Declaring\
    \ instance variables\n    private String name;\n    private int age;\n\n    //getters\n\
    \    public int getAge(){\n        return age;\n    }\n    public String getName(){\n\
    \        return name;\n    }\n    //setters\n    public void setAge( int newAge){\n\
    \        age = newAge;\n    }\n    public void setName(String newName){\n    \
    \    name = newName;\n    }\n}\n\n//class to test the getter and setter methods\n\
    public class TestGetterSetter{\n    public static void main(String args[]){\n\
    \        TestGetterSetter gs = new GetterSetter();\n        gs.setName(\"John\"\
    );\n        gs.setAge(30);\n        System.out.println(\"Your name is: \"+gs.getName());\n\
    \        System.out.println(\"Your age is: \"+gs.getAge());\n    }\n}\n```\n\n\
    Output :\nYour name is: John\nYour age is: 3\n\n# Introduction to JavaScript\n\
    \nJavaScript is an object based dynamic scripting language. Netscape is the developer\
    \ of this language. This language is used for the development of server applications\
    \ and web pages. It is the most widely used scripting language in the world.\n\
    \nThe only thing similar in Java and JavaScript is their similar sounding names.\
    \ Rest, the languages are completely different with regard to their functions\
    \ and concepts. What makes JavaScript stand out from the oriented programming\
    \ languages like Java and C++ is that its objects can be created or modified during\
    \ the run time. For doing this, Methods and properties are added to the empty\
    \ objects. An object once created can be used like a prototype in the process\
    \ of creating other similar objects.\n\nVariable parameter lists, source-code\
    \ recovery, dynamic script creation, dynamic object creation function variables\
    \ etc are the dynamic capabilities that JavaScript has.\n\n# Chapter 1: Basics\
    \ of JavaScript\n\n## Storing data in JavaScript\n\n- Local Storage: The local\
    \ storage is used to permanently store the data. With this, the data on that page\
    \ can be accessed anytime. The local storage doesn’t have an expiration date.\
    \ One can use local storage if they want their data to be reused again and again\
    \ over the period of time.\n- Session Storage: The session storage is not like\
    \ local storage as it only holds the data for a single session and disposes off\
    \ the data once the user closes the page. This kind of storage is used on web\
    \ pages used for booking tickets etc.\n\n## Storing Data using Variable Data and\
    \ Constant Data\n\nThe Variables and Constants store the data and values used\
    \ in JavaScript. They both have their own importance in JavaScript. All the data\
    \ stored cannot be made constant. Processes like time countdown use the variables\
    \ and the Constants are used for non changing data.\n\nVariable Data: As the name\
    \ suggests, this type of data that changes its value over time is called the Variable\
    \ Data. This type of data is widely used in JavaScript. Variables are dynamic\
    \ in nature.\n\nConstant Data: The Constant data is something which never changes\
    \ its value. This data will be constant through time. This type of data is static.\
    \ We use this type of data for data which cannot be modified.\n\n### Creating\
    \ Variables and Constants\n\nDeclaring a Variable\nA variable is declared by preceding\
    \ the name by the `var` keyword. For example if you want to declare `group` a\
    \ variable, just add the `var` keyword before `group`. Every variable should end\
    \ with a `;` (semicolon). This makes the statement self containing. Care should\
    \ be taken while using the words because JavaScript is case sensitive. For this\
    \ the letters are to be used in the exact as in the original.\n\n```javascript\n\
    var Dell;\n```\nThe object `Dell` above is declared as a variable.\n\nDeclaring\
    \ a Constant\nThe `const` keyword is used before the name is to make it a constant.\
    \ This declaration is just like declaring a constant.\n\n```javascript\nconst\
    \ Book;\n```\n`Book` is made a constant in the above example.\n\n### Decision\
    \ making in JavaScript\n\nThere always rises a situation where we have to select\
    \ one of the two paths which are before him. Then we are able to implement the\
    \ conditional statements like `if` and `else`.\n\nThe `if` and `else` statements\
    \ can be used for decision making. This will allow the program to choose the correct\
    \ path.\n\nThe following conditional statements are supported by JavaScript:\n\
    1. `if` statement\n2. `if...else` statement\n3. `if...else if` statement\n\nif\
    \ statement: The `if` is the fundamental statement used to make decisions. There\
    \ a condition is added to the `if` statement and a set of statements can be given\
    \ if the given condition holds true.\n\n```javascript\nvar age = 20;\nif( age\
    \ > 18 ){\n    document.write(\"<b>Allowed inside the pub.</b>\");\n}\n```\nOUTPUT:\
    \ Allowed inside the pub. (if a no. above 18 is given)\n\nif else statement: This\
    \ is like an extension of the `if` statement. The system runs the code and executes\
    \ the statements in the `else` block if the `if` statement holds false.\n\nSyntax:\n\
    \n```javascript\nif(condition)\n```\n"
