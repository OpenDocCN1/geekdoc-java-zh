    \n#### 示例 - 调用 menu 函数\n\n```python\nanswer = menu(['A','B','C','D','E','F','H','I'],\\\
    \n'你最喜欢哪个字母？ ')\n```\n\n#### 示例 - 错误在哪里\n\n```python\nreturn raw_input(question)\
    \ - 1\n```\n\n`raw_input` 总是返回字符串，所以这是一个挫折。让我们把它改为 `input()`，当你输入数字时它会返回数字：\n\n\
    #### 示例 - 修复它\n\n```python\nreturn input(question) - 1\n```\n\n"
