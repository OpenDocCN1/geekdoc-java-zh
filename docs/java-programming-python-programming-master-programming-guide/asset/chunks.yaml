  trans: "\n\n在代码中，如果我们输入一些随机文本而不是给定的 `std` 数据类型会发生什么？这就是异常出现用场的时候。我们可以使用 `try.` 来克服这些异常。\n\
    \n### 示例 - try 运算符\n\n```python\ntry:\n    function(world, parameters)\nexcept:\n\
    \    print world.errormsg\n```\n\n现在让我们把容易出错的部分放入 `try` 块中并看看会发生什么。菜单如下：\n\n###\
    \ 示例 - 测试我们的修复\n\n```python\ndef menu(list, question):\n    for entry in list:\n\
    \        print 1 + list.index(entry),\n        print \") \" + entry\n        try:\n\
    \            return input(question) - 1\n        except NameError:\n         \
    \   print \"Enter a valid number”\n```\n\n让我们来看另一个错误。\n\n### 示例 - 另一个错误信息\n\n\
    ```\nTraceback (most recent call last):\nFile \"/home/steven/errortest.py\", line\
    \ 12, in -toplevel-\n    print 'You picked answer', (answer + 1)\nTypeError:unsupported\
    \ operand type(s) for+: 'NoneType' and 'int'\n```\n\n上述错误的解决方案是。\n\n### 示例 - 另一个解决方案\n\
    \n```python\nanswer = menu(['A','B','C','D','E','F','H','I'],\n'Which letter is\
    \ your favourite? ')\ntry:\n    print 'You picked answer', (answer + 1)\nexcept:\n\
    \    print '\\nincorrect answer.'\n```\n\n### 无尽的错误\n\n使用许多 `except` 语句面临的问题是没有任何错误都不会被检测到。\n\
    \n### 示例 - 我们面临的问题\n\n```python\nprint 'Subtraction program, v0.0.1 (beta)'\n\
    a = input('Enter a number to subtract from> ')\nb = input('Enter the number to\
    \ subtract> ')\nprint a – b\n```\n\n只有提供两个数字时它才有效。如果你提供一个字母，它将显示 `NameError`：\n\
    \n### 示例 - 处理 NameError\n\n```python\nprint 'Subtraction program, v0.0.2 (beta)'\n\
    loop = 1\nwhile loop == 1:\n    try:\n        a = input('Enter a number to subtract\
    \ from > ')\n        b = input('Enter the number to subtract > ')\n    except\
    \ NameError:\n        print \"\\n Subtraction of a letter isn’t possible”\n  \
    \      continue\n    print a - b\n    try:\n        loop = input('1 to try again')\n\
    \    except NameError:\n        loop = 0\n```\n\n如果有任何语法错误，应按照如下方式处理：\n\n### 示例\
    \ – 需要处理的 SyntaxErrors\n\n```python\nprint 'Subtraction prog, v0.3 (alpha)'\n\
    loop = 1\nwhile loop == 1:\n    try:\n        a = input('Enter a number to subtract\
    \ from > ')\n        b = input('Enter the number to subtract > ')\n    except\
    \ NameError:\n        print \"\\nYou cannot subtract a letter\"\n        continue\n\
    \    except SyntaxError:\n        print \"\\nDo not enter anything than number”\n\
    \        continue\n    print a - b\n    try:\n        loop = input('Press 1 to\
    \ try again > ')\n    except (NameError,SyntaxError):\n        loop = 0\n```\n\
    \n在这里，多个 `except` 处理不同的问题。相反，我们可以使用括号在单个 `except` 语句中写所有异常。\n\n# 结论\n\n所以，我们已经完成了\
