- "# Java 编程：Python 编程：编程高级指南：一天学会系列（Python, Java, SQL, PHP, HTML, Ruby）\n\n\n\n![](img/00004.jpeg)\n\
  \n\n\n\n## 目录\n\n- Java 简介](#\n- 控制语句 或 document.write() 方法有助于调试你的代码。例如：](#\n- 使用\
  \ JavaScript 调试器： 构造函数：](#\n- JavaScript 原生对象\n- 标准版 (`J2SE`)\n- 企业版 (`J2EE`)\n\n\
  对于个人使用，可以从[下载页面](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ 下载与其操作系统对应的最新 SE 版本 `.exe` 文件。安装后，检查 `PATH` 变量是否指向 Java 的安装路径。在终端窗口执行 `javac`\
  \ 将在屏幕上显示安装的 Java 版本。\n\n## 代码结构\n\n![](img/00001.jpeg)\n\n每个 Java 代码都以 `.java`\
  \ 扩展名保存。每个 Java 程序包含一个或多个类。每个类都包含一个或多个方法定义，每个方法内部包含几条语句。\n\n\n\n\n\n# 关键字的语法与含义\n\
  \n```java\nimport java.io.*;\n\npublic class MyFirstProgram {\n    public static\
  \ void main(String[] args) {\n        //This is my first java program\n        System.out.println“\
  \ Hello World !”);\n    }\n}\n```\n\n- `import` 关键字 `import` 用于引入名为 `packages`（包）的\
  \ Java 库，包包含了可以在程序使用的预定义函数。\n- `public class MyFirstProgram` - 这是类的定义，关键字 `public`\
  \ 表示该类对所有人可见，`class` 表示定义为一个类定义。\n- `MyFirstProgram` – 这是类的类名。带有 `main()` 函数的类名必须与源文件名相同。\n\
  类的定义被包含在大括号 `{}` 之中。\n- `public static void main (String args[])`: 这是程序的主体。由于 `main()`\
  \ 是驱动函数，它应该始终 `public`（公共的）。\n- `static`: 你需要记住 `main()` 方法应该是 `static`（静态的），因为这使得程序在内存利用上更高效。\n\
  - `void`: 这是方法的返回类型。这意味着 `main()` 方法将不会返回任何内容。\n- `main`: 方法名。解释器仅从 `main()` 方法开始执行。运行程序意味着指示\
  \ JVM `load`（加载）从源码编译的 `.class` 文件并从 `main()` 方法开始执行。\n\n`main` 方法的两个用途可以总结为：\n\
  1. 测试程序中的所有其他方法\n2. 启动程序的执行\n- `String[] args`: 是传递给 `main` 方法的参数。该方法始终接收字符串数组作为输入参数，且数组名称应始终为\
  \ `args`。\n注意数据类型大大写字母 `S`，这是因为 `Strings` 是 Java 中的一个类，且所有类名都以大写字母开头。\n\n方法的定义包含在花括号\
  \ `{}` 中，在这种情况下，我们希望程序执行的唯一目的是打印“Hello World!”。\n要向标准输出控制台打印语句，使用 `System.out.println(\"\
  \");`。注意所有语句必须以分号（`;`）结尾。\n你也可以使用 `System.out.print()` 来显示输出，区别在于 `print ln` 在其打印的每个语句末尾引入一个新行。\n\
  我们程序中 `main()` 方法中的另一个语句被称为“注释”语句。这些语句不会被编译，以 `//` 开头的这些语句的作用仅向程序员提供更多关于代码的信息。\n\
  Java 完全没有全局变量的概念，但使用 `final`、`static`、`public` 等关键字可以实现同样。\n\n# 面向对象编程\n\nJava 的语法与\
  \ C 相似，但编程哲学源自 C++ —— 即 Java 是一种面向对象的语言。\n在我们 ways 看到的第一个示例中，我们有一个类声明，并说明 `main()`\
  \ 函数负责程序中执行的内容，不过，这并没有让 Java 成为一种 OOP（面向对象）语言，让我们通过示例来更好地理解 OOP —— 对象和类。\n\n## 过程化方法\n\
  \n这并不那么简单，因为之前的形状是确定的，动画代码可以假设一个中心点并旋转形状，而对于变形虫这样不确定的形状，它无法使用其他形状的代码进行旋转，相反，API\
  \ 需要更多的参数来定义形状应该旋转的坐标。\n\n## 面向对象方法\n\n因此，你可以为每个形状编写一个类文件，这样通过简单的添加新类就可以添加变形虫或修改旋转方法，而不会扰动现有代码。你只需要测试新类，引入的任何新问题都可以轻松追踪到所做的新更改。\n\
  \n### 示例 1\n```java\nclass Movie{\n    //变量声明\n    //方法\n} m1; //m1 是类型为“Movie”的类的对象\n\
  ```\n\n### 示例 2\n```java\nclass Movie{\n    //变量声明\n    //方法\n}\n\nclass TestMovie{\n\
  \    public static void main(String[] args){\n        Movie m1 = new Movie(); //\
  \ m1 是类型为“Movie”的对象\n        m1.variable = value;\n        m1.method();\n    }\n\
  }\n```\n\n# 变量声明与数据类型\n\n要学习的下一个重要且基础的概念是关于创建有用程序的“变量”和“数据类型”。变量本质上是命名的内存位置，用于存储值。Java\
  \ 是一种强类型语言，因此类型为 `x` 的变量只能持有类型为 `x` 的值。\n例如：\n```java\nint n;\n```\n这里声明变量 `n` 用于存储\
  \ `int` 类型的值。声明变量类型确保了 Java 的“类型安全”特性，这反过来有助于“安全性”。\nJava 中的变量可以是：\n- 局部变量（原始数据类型如\
  \ `int`、`float`、`double`、`Boolean` 等）\n- 引用变量（对象 – 用户定义的类实例）\n\n注意数据类型大写字母 `S`，这是因为\
  \ `Strings` 是 Java 中的一个类，且所有类名都以大写字母开头。\n\n## 字符串\n\nString 是一个类。字符串的一些常用操作：\n```java\n\
  String str = “Hello”;\nint len = str.length();\nString concatStr = “hello”+”world”;\n\
  if (str1 == str2) {\n    System.out.println“strings are equal”);\n}\n```\n\n## 引用变量\n\
  \n`Movie m1 = new Movie()`\n左侧是持有对象的声明。\n```java\nint[] n;\nn = new int[5];\n```\n\
  注意即使是原始类型的数组，数组也是对象。\n\n## Equals 操作\n\n我们知道 `==` 和 `!=` 等比较运算符可以用于原始类型，但为了对对象进行比较，不能使用默认运算符，相反\
  \ Java 提供了 `equals` 关键字。\n\n## 列表\n\n```java\nimport java.util.ArrayList;\nArrayList\
  \ myList = new ArrayList<>();\n```\n它允许声明不同数据类型的数组。它提供了多个方法来执行常见的数组操作，如 `add(elem)`、`remove(index)`\
  \ 用于从列表中添加/删除元素。还有 API 如 `size()` 用于查找长度、`isEmpty()` 或列表是否 `contains()` 给定元素。\n\n\
  让我们来看一个使用目前所学概念的示例：\n\n```java\nClass MyProgram{\n    public static void main(Strings[]\
  \ args){\n        //声明并赋值变量\n        int num = 10;  \n        float fNum = 10.5;\n\
  \        //打印语句到控制台\n        System.out.println“The value of integer num is : ”+num);\n\
  \        System.out.println“The Value of integer fNum is : ”+fNum);\n        num\
  \ = num/2;\n        fNum = fNum+num;\n        System.out.println“The value of integer\
  \ num after operation is : ”+num);\n        System.out.println“The Value of integer\
  \ fNum after operation is : ”+fNum);\n    }\n}\n```\n\n输出：\nThe value of integer\
  \ num is : 10\nThe value of integer fNum is : 10.5\nThe value of integer num after\
  \ operation is : 5\nThe value of integer fNum after operation is : 20.5\n\n\n\n\n\
  \n# 控制语句\n\n程序中的控制语句顾如名所示，控制着每个程序的通用流程。它包括诸如 `if else` 的条件语句，或如 `while ()`、`do while()`\
  \ 等迭代语句。\n\n![](img/00003.jpeg)\n\n## If else\n\n语法：\n\n```javascript\nif(condition)\n\
  \    do action1;\nelse\n    do action2;\n```\n\n当 `condition` 为真时，执行 `action1`，否则执行\
  \ `else` 部分的操作。\n\n### Switch case\n\n当你需要检查多个条件时，这种操作会非常有用。`Switch case` 根据给定的值执行操作。\n\
  \n语法：\n\n```javascript\nSwitch(id)\n{\nCase id1:\n    Action;\n    Break;\nCase\
  \ id2:\n    Action;\n    Break;\n….\nDefault:\n….\n}\n```\n\n### While ()\n\n这是一个迭代语句，只要条件为真，它就会执行操作。\n\
  \n语法：\n\n```javascript\nwhile(condition)\n{\n    当 condition 为真时执行某些操作;\n}\n```\n\
  \n### Do - while ()\n\n这同样是一个迭代操作，与 `while()` 循环非常相似，区别在于无论条件是否有效，循环至少会执行一次，因为条件是在\
  \ `do` 语句之后才评估的。\n\n语法\n\n```javascript\ndo{\n    执行某些操作\n}while(condition);\n```\n\
  \n### For 循环\n\n语法：`for ( 初始化;条件; 更新)`\n\n示例：`for (int i=0; i<5; i++)` 现在将执行该语句\
  \ 5 次。第一部分声明并为 `counter` 变量初始化一个值，第二部分检查条件，如果条件为真，则进入循环。循环完成后，它执行递增。然后它再次检查条件并继续执行相同操作，直到条件变为假。一旦条件为假，它就会退出循环。\n\
  \n示例：\n\n```java\nClass MyProgram{\npublic static void main(Strings[] args){\n \
  \   //声明并赋值变量\n    int num = 5, i;\n    while( num > 0){\n        System.out.println(\"\
  整数型 Num 的值为：\"+num);\n        num--;\n    }\n    for(i = 0;i<5; i++)\n        System.out.println(\"\
  整数型 Num 的值为：\"+num);\n    }\n}\n```\n\n输出：\n整数型 Num 的值为：5\n整数型 Num 的值为：4\n整数型 Num\
  \ 的值为：3\n整数型 Num 的值为：2\n整数型 Num 的值为：1\n\n上述程序使用了两个循环语句来执行操作。\n\n# 封装\n\n封装，顾如名所示，将数据胶胶起来。简单来说，它隐藏了数据，从而提供了安全性。传递的参数可以是值传递，也可以是引用传递。在确定使用哪种类型后声明数据类型。类的方法通过对象使用点运算符来访问。\n\
  \n`Movie m1 = new Movie()`\n`M1.printName()` //打印名称\n或 `M1.play(count)` //播放 n 次电影\n\
  \n在接下来的示例中，使用 getter 来读取类变量的值，然后为变量设置一个值。\n\n```java\npublic class GetterSetter{\n\
  \    //声明实例变量\n    private String name;\n    private int age;\n\n    // getters\n\
  \    public int getAge(){\n        return age;\n    }\n    public String getName(){\n\
  \        return name;\n    }\n    // setters\n    public void setAge( int newAge){\n\
  \        age = newAge;\n    }\n    public void setName(String newName){\n      \
  \  name = newName;\n    }\n}\n\n//测试 getter 和 setter 方法的类\npublic class TestGetterSetter{\n\
  \    public static void main(String args[]){\n        TestGetterSetter gs = new\
  \ GetterSetter();\n        gs.setName(\"John\");\n        gs.setAge(30);\n     \
  \   System.out.println(\"你的名字是：\"+gs.getName());\n        System.out.println(\"\
  你的年龄是：\"+gs.getAge());\n    }\n}\n```\n\n输出：\n你的名字是：John\n你的年龄是：3\n\n## JavaScript\
  \ 简介\n\nJavaScript 是一种基于对象的动态脚本语言。Netscape 是这种语言的开发者。这种语言用于服务器应用程序和网页开发。它是世界上最广泛使用的脚本语言。\n\
  \nJava 和 JavaScript 唯一相似之处是它们的名称相似。在功能和概念方面，这些语言是完全不同的。让 JavaScript 脱颖于 Java 和 C++\
  \ 等面向对象语言的特点是，它的对象可以在运行时创建或修改。为了实现这一点，向空对象添加了方法和属性。一旦创建了对象，就可以创建其他类似对象的过程中像原型一样使用。\n\
  \n变量参数列表、源码恢复、动态脚本创建、动态对象创建函数变量等都是 JavaScript 拥有的动态能力。\n\n# 第一章：JavaScript 基础\n\n\
  ## 在 JavaScript 中存储数据\n\n- 本地存储 (Local Storage)：本地存储用于永久存储数据。通过它，可以随时访问该页面的数据。本地存储没有过期日期。如果人们希望数据在一段时间内被反复使用，可以使用本地存储。\n\
  - 会话存储 (Session Storage)：会话存储与本地存储不同，因为它只保留单个会话的数据，并在用户关闭页面后丢弃数据。这种存储用于用于预订的网页。\n\
  \n## 使用变量和常量存储数据\n\n变量和常量存储数据。变量和常量在 JavaScript 中都有它们自己的重要性。`if` 语句使用这些数据。\n\n变量数据：顾如名所示，这种随时间变化的类型在\
  \ JavaScript 中被广泛。变量是动态的。\n\n常量数据：常量数据是不改变值的。这种类型的数据是静态的。我们使用这种类型用于不可修改的数据。\n\n\
  ### 创建变量和常量\n\n声明变量\n通过在名称前添加 `var` 关键字来声明变量。例如，如果你想声明 `group` 为变量，只需添加 `var` 关键字。每个变量都应该以\
  \ `;`（分号）结束。这使得语句自包含。在使用单词时应小心，因为 JavaScript 是大小敏感的。对于这一点，字母必须与原始一致。\n\n```javascript\n\
  var Dell;\n```\n上面的对象 `Dell` 是一个变量。\n\n声明常量\n在名称前使用 `const` 关键字使其成为常量。这种声明就像声明常量一样。\n\
  \n```javascript\nconst Book;\n```\n上面的示例中 `Book` 是常量。\n\n### JavaScript 中的决策\n\n\
  总是会出现我们需要在两个路径中选择一个的情况。这时我们能够实现 `if` 和 `else` 等条件语句。\n\n`if` 和 `else` 语句可以用于决策。这将允许程序选择正确的路径。\n\
  \nJavaScript 支持以下条件语句：\n1. `if` 语句\n2. `if...else` 语句\n3. `if...else if` 语句\n\n\
  if 语句：`if` 是用于决策的基本语句。在 `if` 语句中添加一个条件，如果给定的条件为真，就可以给出一组语句。\n\n```javascript\nvar\
  \ age = 20;\nif( age > 18 ){\n    document.write(\"<b>允许进入酒吧。</b>\");\n}\n```\n\
  输出：允许进入酒吧的（如果给出了 18 以上的数字）\n\nif else 语句：这是 `if` 语句的扩展。如果 `if` 语句为假，系统运行并执行 `else`\
  \ 块中的语句。\n\n语法：\n\n```javascript\nif(condition)\n```\n\n\n\n\n\n{statements}\n\n\
  else{statements}\n\n示例：\n\n```html\n<script type=\"text/javascript\">\n<!--\nvar\
  \ age = 15;\nif( age > 18 ){\n  document.write(\"<b>Allowed inside the pub</b>\"\
  );\n}else{\n  document.write(\"<b>Is not allowed.</b>\");\n}\n//-->\n</script>\n\
  ```\n\n输出：\n允许进入酒吧（如果给出一个大于 18 的数字）\n不允许（如果给出一个小于 18 的数字）\n\nif else if: 这就像是给 if\
  \ else 语句又添加了一个步骤。这被用于使用一系列条件的情况。\n\n语法：`if(condition){statements};`\n\nelse if(condition){statements}\n\
  \nelse if(condition){statements}\n\nelse{statements}\n\n示例：\n\n```html\n<script\
  \ type=\"text/javascript\">\n<!--\nvar book = \"JAVASCRIPT\";\nif( book == \"JAVA\"\
  \ ){\n  document.write(\"<b>JAVA Book</b>\");\n}else if( book == \"JAVASCRIPT\"\
  \ ){\n  document.write(\"<b>JAVASCRIPT Book</b>\");\n}else if( book == \"DBMS\"\
  \ ){\n  document.write(\"<b>DBMS Book</b>\");\n}else{\n  document.write(\"<b>UNKNOWN\
  \ Book</b>\");\n}\n//-->\n</script>\n```\n\n输出：JAVASCRIPT book\n\n## 嵌套 if\n\n“嵌套\
  \ if”是指在另一个“if”语句内部的另一个“if”语句。\n\n语法：`if(condition) {if(condition){statement} }`\n\
  \n## switch 和 break 语句\n\n在 switch 语句中将有一个表达式，后面跟着几个不同的语句。这些语句将根据所选表达式的值执行。\n\n\
  语法：\n```javascript\nswitch (expression)\n{\n  case condition 1\n: statement(s)\n\
  \      break;\n  case condition 2: statement(s)\n                      break;\n\
  .\n.\n,\n  case condition n: statement(s)\n      break;\n  default:\nstatement(s)\n\
  }\n```\n\n`break` 语句用于表示前面的 switch case 的结束。\n\n## JavaScript 中的循环\n\n### for 循环\n\
  \n如果人们希望重复执行相同的代码，就会使用循环。“forfor 循环是可以使用的三种循环之一。“for 循环”简单且紧凑。\n\n它包含以下三点：\n\n1.\
  \ 启动语句在循环开始之前执行。\n2. 只有当给定的条件为真时才会执行循环。但会执行一次测试代码来运行该代码。\n3. 迭代的计数器可以增加也可以减少。\n\n\
  语法：\n```javascript\nfor (initialization; test condition; iteration statement){\n\
  \  如果测试条件为真，则执行的语句(s)\n}\n```\n\n示例：\n\n```html\n<script type=\"text/javascript\"\
  >\n<!--\nvar count;\ndocument.write(\"This will repeat for 10 times\" + \"<br />\"\
  );\nfor(count = 0; count < 10; count++){\n  document.write(\"Currently repeated\
  \ : \" + count );\n  document.write(\"<br />\");\n}\ndocument.write(\"Done!!\");\n\
  //-->\n</script>\n```\n\n输出：\n这将重复 10 次\n当前重复： 1\n当前重复： 2\n当前重复： 3\n当前重复： 4\n当前重复：\
  \ 5\n当前重复： 6\n当前重复： 7\n当前重复： 8\n当前重复： 9\n当前重复： 10\n\n# 第 2 章：JavaScript 中的函数和事件\n\
  \n## 什么是函数？\n\n一组在需要时可以在程序中任何地方被重用的代码被称为函数。它减少了人们反复编写相同代码的时间和精力。这减少了代码冗余。使用函数可以编写模块化代码。使用函数可以将一个大程序分成许多或所需的部分。JavaScript\
  \ 与任何其他编程语言一样，都支持编写模块化代码所需的特征。这是通过使用“函数”来实现的。\n\n`write()` 和 `alert()` 等函数是默认函数。JavaScript\
  \ 为用户提供了许多可以直接使用的函数。\n\nJavaScript 还允许人们创建自己的自定义函数。\n\n### 函数定义\n\n在使用函数之前，应该先定义它。`function`\
  \ 关键字是 JavaScript 中定义函数的常用方法。后面应该紧跟一个唯一的函数名和参数列表。它还应该包含一个带有大括号的语句块。\n\n语法：\n```html\n\
  <script type=\"text/javascript\">\n<!--\nfunction functionname(parameter-list)\n\
  {\n  statements\n}\n//-->\n</script>\n```\n\n示例：在下面的示例中，有一个简单的函数程序。\n\n```html\n\
  <script type=\"text/javascript\">\n<!--\nfunction simplefunction()\n{\n  alert(\"\
  This is a simple function\");\n}\n//-->\n</script>\n```\n\n### 调用函数\n\n要在 JavaScript\
  \ 中调用函数，应该如下所示编写该函数的名称。\n\n```html\n<script type=\"text/javascript\">\n<!--\nsimplefunction();\n\
  //-->\n</script>\n```\n\n### 函数的参数\n\n在 JavaScript 中，函数也可以带有参数传递。在调用函数时，JavaScript\
  \ 可以传递不同的参数。可以通过传递的函数中的参数进行操作。逗号用于分隔函数中的多个参数。\n\n示例：\n\n在接下来的示例中，我们将修改我们的 `simplefunction`\
  \ 函数。\n\n```html\n<script type=\"text/javascript\">\n<!--\nfunction simplefunction(name,\
  \ age)\n{\n  alert(name + \" is \" + age + \" years old.\");\n}\n//-->\n</script>\n\
  ```\n\n现在函数可以这样调用：\n\n```html\n<script type=\"text/javascript\">\n<!--\nsimplefunction('Zara',\
  \ 7);\n//-->\n</script>\n```\n\n### return 语句\n\n如果用户期望函数的返回值，则可以在函数中添加可选的 `return`\
  \ 语句。`return` 语句总是函数的最后一个语句。\n\n例如：\n\n```html\n<script type=\"text/javascript\"\
  >\n<!--\nfunction concatenate(first, last)\n{\n  var full;\n  full = first + last;\n\
  \  return full;\n}\n//-->\n</script>\n```\n\n现在函数可以这样调用：\n\n```html\n<script type=\"\
  text/javascript\">\n<!--\nvar result;\nresult = concatenate('Zara', 'Ali');\nalert(result);\n\
  //-->\n</script>\n```\n\nJavaScript 中的事件\n\n### 事件\n\n事件处理 JavaScript 和 HTML 之间的交互。当页面被用户或浏览器操作时就会发生这种情况。\n\
  \n一切都是事件。页面加载是一个事件。当用户通过点击选择内容时，点击也被视为事件。事实上，用户执行的任何操作如关闭窗口、选择链接、按键、关闭标签、调整窗口大小等都是事件的示例。\n\
  \n在 JavaScript 中编写的响应是通过这些事件执行的。事件是文档对象模型 (DOM) Level3 的。每个 HTML 元素都提供一组事件。这些事件触发\
  \ JavaScript 代码。\n\n### onclick 事件类型\n\n这是一种事件，点击时会显示所需的验证或警告等。这被广泛使用。\n\n示例：下面的代码，当点击\
  \ onclick hello 按钮时，它会触发 `events` 函数。\n\n```html\n<html>\n<head>\n<script type=\"\
  text/javascript\">\n<!--\nfunction events() {\n  alert(\"Hello World\")\n}\n//-->\n\
  </script>\n</head>\n<body>\n<input type=\"button\" onclick=\"events()\" value=\"\
  Say Hello\" />\n</body>\n</html>\n```\n\n### onsubmit 事件类型\n\n`onsubmit` 事件是另一个重要的事件类型。在这里提交表单时会进行验证。如果函数返回\
  \ true，则文本将被发送。\n\n示例：\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\n<!--\nfunction validation() {\n  // 所有验证都在这里\n  .........\n  return true 或 false\n\
  }\n//-->\n</script>\n</head>\n<body>\n<form method=\"POST\" action=\"t.cgi\" onsubmit=\"\
  return validation()\">\n.......\n<input type=\"submit\" value=\"Submit\" />\n</form>\n\
  </body>\n</html>\n```\n\n# 第 3 章：JavaScript 中的调试\n\n在编写程序时，有很多机会出现错误。\n\n脚本中的此类错误被称为\
  \ bug（漏洞）。\n\n调试是修复 bug 的过程。在开发过程中，调试是正常的一部分。\n\n\n\n\n\n我们编写的代码可能存在逻辑错误或语法错误，这些错误很难识别。很多时候，当\
  \ JavaScript 代码包含错误时，什么都不会发生。没有任何消息指示程序中存在错误。\n\n## 使用验证器 (Validator)\n\n如果想要检查代码中的\
  \ bug，就必须确保它是有效代码，并通过运行一个名为 `Validators`（简称为验证器）的程序来检查它是否遵循语言的官方规则。这些验证器通常随 JavaScript\
  \ 编辑器一起。访问网页后，将代码粘贴到文本区域，然后点击按钮。该程序将解析我们的代码，确保所有变量和函数定义都符合正确的语法。\n\n## 在程序中添加调试代码\n\
  \n`alert()` 或 `document.write()` 方法有助于调试你的代码。例如：\n\n```var debugging = true;\nvar\
  \ whichImage = \"widget\";\n\nif( debugging )\nalert( \"swapImage() with argument:\
  \ \" + whichImage );\nvar swapStatus = swapImage( whichImage );\n\nif( debugging\
  \ )\nalert( \"swapImage() with swapStatus=\" + swapStatus );\n```\n\n## 使用 JavaScript\
  \ 调试器 (Debugger)\n\n调试器是一种允许程序员控制脚本执行的应用程序。调试器方便用户检查执行流程。脚本按行运行，并可以指示其在断点停止。程序员可以在执行完成后检查脚本的状态和变量。\n\
  \n## 表单验证 (Form Validation)\n\n在客户端输入所需信息并点击提交按钮后，会发生表单验证。服务器必须将所有数据再次发送给用户，并要求用户使用正确或有效的信息重新提交表单。如果用户未能输入所有必需信息或输入了无效数据，就会发生这种情况。在将表单发送到网页浏览器之前，JavaScript\
  \ 可以在客户端计算机本身完成表单数据的验证。\n\n表单通常会执行两个功能：\n\n- 基础验证：为了确保每个必填字段都提供了数据，首先需要检查表单。数据需要遍历每个字段。\n\
  - 数据验证：这是为了检查表单中输入的是否正确或有效。\n\n## 基础表单验证\n\n让我们看看如何执行基础表单验证。当发生提交事件时，我们调用 `validate()`\
  \ 函数来验证数据。`validate()` 函数的实现如下：\n\n```html\n<script type=\"text/javascript\">\n\
  <!--\n// 表单验证代码将放在这里。\nfunction validate()\n{\n  if( document.myForm.Name.value\
  \ == \"\" )\n  {\n    alert( \"Please enter your name!\" );\n    document.myForm.Name.focus()\
  \ ;\n    return false;\n  }\n  if( document.myForm.EMail.value == \"\" )\n  {\n\
  \    alert( \"Please enter your id!\" );\n    document.myForm.EMail.focus() ;\n\
  \    return false;\n  }\n  if( document.myForm.Zip.value == \"\" ||\n      isNaN(\
  \ document.myForm.Zip.value ) ||\n      document.myForm.Zip.value.length != 5 )\n\
  \  {\n    alert( \"Please enter the zip in the format #####.\" );\n    document.myForm.Zip.focus()\
  \ ;\n    return false;\n  }\n  if( document.myForm.Country.value == \"-1\" )\n \
  \ {\n    alert( \"Please enter your country name!\" );\n    return false;\n  }\n\
  \  return( true );\n}\n//-->\n</script>\n```\n\n## 数据格式验证\n\n可以在将数据提交到 Web 服务器之前完成数据验证。验证邮箱\
  \ ID 意味着 ID 应该包含 `@` 符号和点 (`.`)，下文给出的示例中所示。此外，最后一个点在 `@` 符号之后至少应有一个字符，且邮箱地址不能以 `@`\
  \ 符号开头。\n\n```html\n<script type=\"text/javascript\">\n<!--\nfunction validateEmail()\n\
  {\n  var emailID = document.myForm.EMail.value;\n  atpos = emailID.indexOf(\"@\"\
  );\n  dotpos = emailID.lastIndexOf(\".\");\n  if (atpos < 1 || ( dotpos - atpos\
  \ < 2 ))\n  {\n    alert(\"Please enter a valid email ID\")\n    document.myForm.EMail.focus()\
  \ ;\n    return false;\n  }\n  return( true );\n}\n//-->\n</script>\n```\n\n# 第\
  \ 4 章：JavaScript 中的对象\n\n## JavaScript 对象\n\nJavaScript 中的对象由属性组成。如果一个属性包含函数，则它被认为是一个方法。\n\
  \n## 对象属性 (Object Properties)\n\n对象的属性可以是任何数据类型。使用以下语法向对象添加属性：\n\n```javascript\n\
  objectName = propertyValue;\n```\n\n## 示例\n\n下一个示例展示了如何使用 \"title\" 属性：\n\n```javascript\n\
  strg = document.title;\n```\n\n## 对象方法 (Object Methods)\n\n允许对象执行特定任务的函数。\n\n##\
  \ 示例\n\n以下示例展示了如何使用 `write()`：\n\n```javascript\ndocument.write(\"This is\");\n\
  ```\n\n## 自定义对象 (User-Defined Objects)\n\n`new` 运算符有助于创建对象的实例。以下示例中的 `Object()`、`Array()`\
  \ 和 `Date()` 是内置函数。\n\n## `Object()` 构造函数\n\n对象可以通过构造函数进行创建和初始化。接下来的示例展示了对象：\n\n\
  ```html\n<html>\n<head>\n<title>objects defined by the user</title>\n<script type=\"\
  text/javascript\">\nvar book = new Object();\nbook.subject = \"Perl\";\nbook.author\
  \ = \"Yashwanth\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
  >\ndocument.write(\"Book name is : + book.subject + \"<br>\");\ndocument.write(\"\
  Book author is : + book.author + \"<br>\");\n</script>\n</body>\n</html>\n```\n\n\
  ## JavaScript 原生对象 (JavaScript Native Objects)\n\nJavaScript 包含许多内置对象。它们的行为不受浏览器或运行平台的影响。以下是常用对象列表：\n\
  \n1. Number 对象\n2. Boolean 对象\n3. [String](https://www.tutorialspoint.com/javascript/strings_object.htm)\
  \ 对象\n4. JavaScript Math 对象\n\n## Number 对象\n\nJavaScript 中的数字对象用于表示数值。它可以包含整数和浮点数。每当遇到数值时，网络浏览器会自动将这些值转换为数字类实例。\n\
  \n### 语法\n\n创建数字对象的语法如下：\n\n```javascript\nvalue = new Number(number);\n```\n\n\
  ### Number 方法\n\n以下是数字对象包含的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `constructor()`\
  \ | 该方法用于返回创建实例的函数。 |\n| `toExponential()` | 该方法以标准指数形式显示标准范围数字。 |\n| `toLocaleString()`\
  \ | 该方法接收一个数字并返回它的字符串版本。其格式随网络浏览器的本地化设置而变化。 |\n| `toPrecision()` | 该方法定义了给定数字显示的位数。这包括了小数点两侧的数字。\
  \ |\n| `toString()` | 该方法有助于将数字转换为字符串值。 |\n\n\n\n\n\n| `valueOf()` | 此方法表示数字的值。\
  \ |\n\n| `valueOfOf()` | 此方法表示数字的值。 |\n\n## 布尔对象 (Boolean Object)\n`Boolean` 对象用于表示可以是“真”（True）或“假”（False）值的值。\n\
  \n### 语法\n可以使用以下语法创建布尔对象：\n`var bval = new Boolean(value);`\n\n如果参数 `value` 为以下任何值：空字符串、`null`、`0`、`Nan`、`-0`、`null`\
  \ 或 `undefined`，则 `Boolean` 对象的初始值为 false。\n\n### Boolean 方法\n以下是 `Boolean` 对象包含的方法。\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `toSource()` | 此方法用于返回由 `Boolean` 对象源代码组成的字符串。可以使用该字符串创建一个等的对象。\
  \ |\n| `toString()` | 此方法用于根据对象的值返回“true”字符串或“false”字符串。 |\n| `valueOf()` | 此方法用于返回\
  \ `Boolean` 对象的原始值。 |\n\n## 字符串对象 (String Object)\n`string` 对象允许用户处理一组字符，并用辅助方法封装\
  \ JavaScript 的字符串原始。\n\n### 语法\n可以使用以下语法创建 `String` 对象：\n`var value = new String(string);`\n\
  \n`string` 参数表示一组正确编码的字符。\n\n### String 方法\n以下是 `String` 对象包含的方法。\n\n| 方法 | 说明 |\n\
  | :--- | :--- |\n| `charCodeAt()` | 此方法用于返回一个数字，表示给定索引处字符的 Unicode 值。 |\n| `concat()`\
  \ | 此方法用于合并两个字符串的字符并返回新创建的字符串。 |\n| `match()` | 此方法用于用正则表达式匹配字符串。 |\n| `toLocaleLowerCase()`\
  \ | 用于在保持当前区域设置的同时将字符串转换为小写。 |\n| `toLocaleUpperCase()` | 用于在保持当前区域设置的同时将字符串转换为大写。\
  \ |\n| `tolowerCase()` | 返回一个其中所有大写字母都转换为小写的字符串。 |\n| `toupperCase()` | 返回一个其中所有小写字母都转换为大写的字符串。\
  \ |\n\n## Math 对象 (Math Object)\n它允许用户执行许多常见的数学计算。通过编写对象的名称、点、以及随后的方法名称来调用对象方法。参数写在方法的括号中。\n\
  \n```javascript\ndocument.writeln(Math.sqrt(81));\n```\n\n以下是 `Math` 对象的一些广泛使用的函数：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `abs(x)` | `x` 的绝对值 |\n| `ceil(x)` | 将 `x` 舍入为不小于\
  \ `x` 的最小整数。 |\n| `round(x)` | 将 `x` 舍入到最近的整数。 |\n| `pow(x , y)` | `X` 的 `y` 次方\
  \ |\n| `floor(x)` | 将 `x` 舍入为不大于 `x` 的最大整数。 |\n\n# 结论\n我们已经完成了学习 Java 和 JavaScript\
