    | Primitive variable type | Wrapper class |

    | char | Character |

    | byte | Byte |

    | short | Short |

    | long | Integer |

    | float | Float |

    | double | Double |

    | boolean | Boolean |


    The wrapper classes can be used with the standard constructor, or with the autoboxing
    feature, which simplifies the conversion of the primitive variable into an object.
    The unboxing simplifies the conversion of the object into a primitive variable.


    | Standard constructor | With autoboxing | With unboxing |

    | Character ch = new Character(''a''); | Character ch = ''a''; | char c = ch;
    |

    | Byte bt = new Byte((byte)100); | Byte bt = 100; | byte b = bt; |

    | Short st = new Short(short 30000); | Short st = 30000; | short s = st; |

    | Integer it = new Integer(1000000); | Integer it = 1000000; | long i = it; |

    | Float ft = new Float(3.1416); | Float ft = 3.1416F; | float f = ft; |

    | Double db = new Double(5.640); | Double db = 5.640; | double d = db; |

    | Boolean bn = new Boolean(true); | Boolean bn = true; | boolean b = bn; |


