- md: "\n# Câlin Gălișteu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\n## 1. Three options for running the HelloWorld Java program\n\n\
    There are three possible ways to type, compile, and execute a Java program.\n\n\
    You may use an online Java compiler. This is the best option for short programs.\
    \ Be aware that, because of security concerns, Java programs executed by an online\
    \ compiler will not be able to read from and write into text files on your computer's\
    \ hard drive.\n\nYou may use an Integrated Development Environment (IDE). Two\
    \ very popular options are the NetBeans IDE and the Eclipse IDE. Your programming\
    \ will not come to halt unless the Internet connection is. The IDE is preferred\
    \ for larger Java programs, which are written as stand-alone applications. Remember\
    \ that you will have to write such a large and complex Java program for your IB\
    \ Internal Assessment component.\n\nYou may also use a Command Line Interface\
    \ (CLI) programming environment. This avoids the Graphical User Interface (GUI)\
    \ of the friendlier IDE, and very seldom used. The javac.exe compiler and the\
    \ java.exe interpreter are needed for Java programs that use command line parameters.\n\
    \n### 1.1. The Java compiler option\n\nStep 1. Launch your trusted Internet browser\
    \ and go to:\n**https://www.onlinegdb.com/**\n\nBack-up plan: If the above site\
    \ is not working then to go to:\n**https://www.jdoodle.com/online-java-compiler/**\n\
    \nStep 2. From the drop-down Language menu, in the upper right corner of the web\
    \ page, select **Java**. The **HelloWorld** Java program will automatically shows\
    \ up.\n\n> The online compiler at **www.onlinegdb.com** does not use a package\
    \ name, all the Java source files are automatically made part of the same package.\
    \ The name of first Java source file is **Main.java**, and the name of the public\
    \ class in this file is **Main**. These two names cannot be changed to something\
    \ else.\n\nStep 3. Delete all the comments that were automatically included in\
    \ the Java program, and align the curly braces on the left side. The **HelloWorld**\
    \ Java program should look like this:\n\n```\n1 public class Main\n2 {\n3 \n4\
    \ \n5     public static void main(String[] args)\n6     {\n7         System.out.println(\"\
    Hello World\");\n8     }\n9 }\n```\n\nStep 4. Click on the green **Run** button.\n\
    \n### 1.2. Installing the NetBeans Java Integrated Development Environment\n\n\
    When you are downloading and installing the NetBeans Integrated Development Environment\
    \ (IDE) you are also downloading and installing the Java Development Kit (JDK)\
    \ with Java 8.\n\n- Step 1. Go to:\nhttps://www.oracle.com/technetwork/java/javase/downloads/jdk-netbeans-jsp-3413139-esa.html\n\
    - Step 2. Check the License Agreement option.\n- Step 3. Click on the appropriate\
    \ download link. For a not too old PC running the Windows operating system, the\
    \ file to download is jdk-u8111-nb-8_2-windows-x64.exe\n\n> Warning! You need\
    \ to have PC administrator rights in order to move forward with the installation\
    \ process.\n\n- Step 4. Click on the downloaded.\n- Step 5. Click on the Next\
    \ button three times, then click the Install button.\n- Step 6. Uncheck the box\
    \ that says \"Contribute to the NetBeans project by providing anonymous usage\
    \ data\" and then click the Finish button.\n- Step 7. Double click on the NetBeans\
    \ shortcut link on the desktop whenever you want to launch the NetBeans Integrated\
    \ Development Environment (IDE).\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_6_0.png)\n\
    \n### 1.3. The NetBeans Java Integrated Development Environment option\n\nAfter\
    \ downloading and installing the NetBeans IDE, you are ready to type, compile,\
    \ and execute the HelloWorld Java program in this programming environment.\n\n\
    - Step 1. Double click on the NetBeans shortcut link on the desktop.\n- Step 2.\
    \ From the menu File New Project... or click on the New Project button.\n- Step\
    \ 3. In the New Project the Java Application option should already be selected.\
    \ Click on the Next button.\n- Step 4. In the New Java Application window type\
    \ the HelloWorld project name. The Create Main Class checkbox should be checked.\
    \ Click on the Finish button.\n\nThe HelloWorld project name was used by NetBeans\
    \ in three different places. The name of the newly created Java source file is\
    \ HelloWorld.java, the name of the related Java package is helloworld, and the\
    \ name of the related Java class is HelloWorld.\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_6_1.png)\n\
    \nStep 5. Delete all the comments that were automatically included in the Java\
    \ program, and align the curly braces on the left side.\n\nIn Java, anything that\
    \ follows the forward slash // to the end of the line, is a comment. Multi-line\
    \ comments can be added between the /* and */ marks. Special /** marks are used\
    \ for Javadoc comments. Javadocs are not needed for the IB CS exam.\n\nStep 6.\
    \ Type the line: System.out.println(\"Hello World!\");\n\nThe program should look\
    \ like this:\n\n```\npackage helloworld\npublic class HelloWorld\n{\n    public\
    \ static void main(String[] args) {\n        System.out.println(\"Hello World!\"\
    );\n    }\n}\n```\n\nStep 7. Click on the Save All button.\n\nStep 8. Click on\
    \ the Run Project button.\n\n### 1.4. The Command Line option (javac.exe and java.exe)\n\
    \nStep 1. Go to the root of your hard drive (C:) and create a new folder.\n\n\
    Step 2. Inside the folder Right-click with the mouse, then select Text Document.\n\
    \n> Warning! Sometimes you cannot see the file extension, you should search for\
    \ Folder Options (Windows 8) or Explorer (Windows 10), and uncheck Hide extensions\
    \ of known file types\n\nStep 3. Using Notepad, open the HelloWorld.java source\
    \ file, type the Java program as shown below, and save the text file The HelloWorld.java\
    \ source file should look like this:\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_7_0.png)\n\
    \nStep 4. Open a Command Prompt window. Search for Command Prompt if you need\
    \ to find it.\n\nStep 5a. Type cd C:\\JavaPrograms<ENTER>. This will move the\
    \ command prompt to the JavaPrograms directory (default), which becomes the current\
    \ directory.\n\nStep 5b. Type dir<ENTER>. This will show all the files and folders\
    \ in the current directory. You should have the HelloWorld.java source file.\n\
    \nStep 5c. Type set path=C:\\Program Files\\jdk8.0_151\\bin<ENTER> with no extra\
    \ spaces. This will tell the compiler where to find the java.exe and the java.exe\
    \ executable files.\n\n> Warning! If you have a different version of the Java\
    \ Development Kit (JDK), then you will need to modify the numbers in the above\
    \ path accordingly.\n\nStep 5d. Type javac HelloWorld.java<ENTER>. The java.exe\
    \ compiler will compile the source file into Bytecode language and then it will\
    \ be compiled into HelloWorld.class, a .class file. At this step some students\
    \ get confused because \"nothing happens\". Be happy if your computer doesn't\
    \ print anything now, because this means there is no error message!\n\nStep 5e.\
    \ Type dir<ENTER>. Verify that the HelloWorld.class file is indeed there.\n\n\
    Step 5f. Type java HelloWorld<ENTER>. The java.exe interpreter (the Java Virtual\
    \ Machine) will turn the Bytecode into machine code, and then the machine code\
    \ will get executed, one instruction at a time. The machine code is specific to\
    \ the computer that runs the program, but since the Bytecode language is very\
    \ close to the actual machine code language, the java.exe interpreter is super-fast.\n\
    \nA successful compilation and execution of the Java program looks like this:\n\
    \n```\nCommand Prompt\n<c> 2013 Microsoft Corporation. All rights reserved.\n\
    C:\\Users\\Galin> C:\\JavaPrograms\nC:\\JavaPrograms>set path=C:\\Program Files\\\
    jdk8.0_151\\bin\nC:\\JavaPrograms>javac HelloWorld.java\nC:\\JavaPrograms>java\
    \ HelloWorld\nHello World!\nC:\\JavaPrograms>_\n```\n"
  mdcn: "\n\n# Câlin Gălișteu IB CS 考试 OOP 方向的 Java 编程基础\n\n## 1. 运行 HelloWorld Java\
    \ 程序的三种选项\n\n编写、编译和执行 Java 程序有三种可能的方法。\n\n你可以使用在线 Java 编译器。这是短短程序的最佳选择。请注意，由于安全考虑，由在线编译器执行的\
    \ Java 程序将无法读取或写入你计算机硬盘硬盘上的文本文件。\n\n你可以使用集成开发环境 (IDE)。两个非常流行的选项是 NetBeans IDE\
    \ 和 Eclipse IDE。只要互联网连接不断开，你的编程工作就不会停止。对于作为独立应用程序编写较大的 Java 程序，首选使用 IDE。请记住，你将为\
    \ IB 内部评估（Internal Assessment）部分编写此类大型且复杂的 Java 程序。\n\n你还可以使用命令行界面 (CLI) 环境。这避免了更友好的\
    \ IDE 的图形用户界面 (GUI)，很少使用。使用命令行参数的 Java 程序需要 `javac.exe` 编译器和 `java.exe` 解释器。\n\
    \n### 1.1. Java 编译器选项\n\n第 1 步。启动你信任的浏览器并访问：\n**https://www.onlinegdb.com/**\n\
    \n备用方案：如果上述网站无法运行，请访问：\n**https://www.jdoodle.com/online-java-compiler/**\n\n\
    第 2 步。从网页右上角的语言下拉菜单中选择 **Java**。**HelloWorld** Java 程序将自动出现。\n\n> 在 **www.onlinegdb.com**\
    \ 上的在线编译器不使用包名，所有 Java 源代码文件都会自动成为同一个包的一部分。第一个 Java 源代码文件名为 **Main.java**，该文件中公有类名为\
    \ **Main**。这两个名称不能更改为其他内容。\n\n第 3 步。删除 Java 程序中自动包含的所有注释，并将大括号左对齐。**HelloWorld**\
    \ Java 程序看起来应该像这样：\n\n```\n1 public class Main\n2 {\n3 \n4 \n5     public static\
    \ void main(String[] args)\n6     {\n7         System.out.println(\"Hello World\"\
    );\n8     }\n9 }\n```\n\n第 4 步。点击绿色的 **Run**（运行）按钮。\n\n### 1.2. 安装 NetBeans Java\
    \ 集成开发环境\n\n当你下载并安装 NetBeans 集成开发环境 (IDE) 时，你也在下载并安装带有 Java 8 的 Java 开发包 (JDK)。\n\
    \n- 第 1 步。访问：\nhttps://www.oracle.com/technetwork/java/javase/downloads/jdk-netbeans-jsp-3413139-esa.html\n\
    - 第 2 步。勾选许可协议选项。\n- 第 3 步。点击相应的下载链接。对于运行 Windows 操作系统的不是太旧的 PC，下载的文件为 `jdk-u8111-nb-8_2-windows-x64.exe`\n\
    \n> 警告！你需要 PC 管理员权限才能继续安装过程。\n\n- 第 4 步。点击已下载的文件。\n- 第 5 步。点击三次 Next（下一步）按钮，然后点击\
    \ Install（安装）按钮。\n- 第 6 步。取消勾选“通过提供匿名使用数据为 NetBeans 项目做出贡献”框，然后点击 Finish（完成）按钮。\n\
    - 第 7 步。每你想启动 NetBeans 集成开发环境 (IDE) 时，双击桌面上的 NetBeans 快捷方式链接。\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_6_0.png)\n\
    \n### 1.3. NetBeans Java 集成开发环境选项\n\n下载并安装 NetBeans IDE 后，你已准备好在该编程环境中编写、编译和执行\
    \ HelloWorld Java 程序。\n\n- 第 1 步。双击桌面上的 NetBeans 快捷方式链接。\n- 第 2 步。从 File New Project...（文件\
    \ 新建项目）菜单或点击 New Project（新建项目）按钮。\n- 第 3 步。在 New Project 中，Java Application 选项应该已经被选中。点击\
    \ Next（下一步）按钮。\n- 第 4 步。在 New Java Application 窗口中输入 HelloWorld 项目名。勾选 Create\
    \ Main Class 复选框。点击 Finish（完成）按钮。\n\nNetBeans 在三个不同的地方使用了 HelloWorld 项目名。新创建的\
    \ Java 源代码文件名为 HelloWorld.java，相关的 Java 包名为 helloworld，相关的 Java 类名为 HelloWorld。\n\
    \n![](img/f2c7aa28c73a4748dac938a1e583595e_6_1.png)\n\n第 5 步。删除 Java 程序中自动包含的所有注释，并将大括号左对齐。\n\
    \n在 Java 中，任何紧随斜杠 `//` 直到行尾的内容都是注释。多行注释可以添加到 `/*` 和 `*/` 标记之间。特殊的 `/**` 标记用于 Javadoc\
    \ 注释。IB CS 考试不需要 Javadoc。\n\n第 6 步。输入行代码：`System.out.println(\"Hello World!\"\
    );`\n\n程序看起来应该是这样：\n\n```\npackage helloworld\npublic class HelloWorld\n{\n  \
    \  public static void main(String[] args) {\n        System.out.println(\"Hello\
    \ World!\");\n    }\n}\n```\n\n第 7 步。点击 Save All（全部保存）按钮。\n\n第 8 步。点击 Run Project（运行项目）按钮。\n\
    \n### 1.4. 命令行选项 (javac.exe 和 java.exe)\n\n第 1 步。进入你的硬盘根目录 (C:) 并创建一个文件夹。\n\n\
    第 2 步。右键点击文件夹，选择 Text Document（文本文）。\n\n> 警告！你看不到文件扩展名，你应该搜索文件夹 选项（Windows 8）或\
    \ Explorer（Windows 10），并取消勾选隐藏已知文件类型\n\n第 3 步。使用记事本打开 HelloWorld.java 源代码文件，输入如下所示的\
    \ Java 程序，源代码文件应该如下：\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_7_0.png)\n\n\
    第 4 步。打开命令提示符窗口。如果需要，请搜索 Command Prompt。\n\n第 5a 步。输入 `cd C:\\JavaPrograms`。这将命令行提示符移动到\
    \ JavaPrograms 目录（默认）。\n\n第 5b 步。输入 `dir`。这将显示当前目录下的所有文件和文件夹。你应该 HelloWorld.java\
    \ 源代码文件。\n\n第 5c 步。输入 `set path=C:\\Program Files\\jdk8.0_151\\bin`（没有空格）。这将告诉编译器去哪里寻找\
    \ javac.exe 和 java.exe 可执行文件。\n\n> 警告！如果你有不同版本的 Java 开发包 (JDK)，则需要相应修改路径中的数字。\n\
    \n第 5d 步。输入 `javac HelloWorld.java`。java.exe 编译器将源代码编译为字节码语言，然后编译成 HelloWorld.class，一个\
    \ .class 文件。在这一步有些学生会困惑，因为“什么都没有发生”。如果你的电脑没有打印任何内容，请感到高兴，这意味着没有错误信息！\n\n第 5e 步。输入\
    \ `dir`。验证 HelloWorld.class 文件确实在那里。\n\n第 5f 步。输入 `java HelloWorld`。java.exe 解释器（Java虚拟机）将字节码转换为机器码，然后逐条执行机器码。机器码特定于运行程序的计算机，但由于字节码语言非常接近机器码语言，因此\
    \ java.exe 解释器非常快。\n\n成功编译并运行 Java 程序所示：\n\n```\nCommand Prompt\n<c> 2013 Microsoft\
    \ Corporation. All rights reserved.\nC:\\Users\\Galin> C:\\JavaPrograms\nC:\\\
    JavaPrograms>set path=C:\\Program Files\\jdk8.0_151\\bin\nC:\\JavaPrograms>javac\
    \ HelloWorld.java\nC:\\JavaPrograms>java HelloWorld\nHello World!\nC:\\JavaPrograms>_\n\
    ```\n\n"
