    }\n\nclass MyHello {\n    private String myText; // the field variable myText\
    \ is defined\n    public MyHello(String myText) // the formal parameter myText\
    \ is defined {\n        this.myText = myText;\n    }\n    public void printGreeting()\
    \ {\n        System.out.println(this.myText);\n    }\n}\n```\n\nThe program would\
    \ not work as intended, instead of writing this.myText = myText; we wrote myText\
    \ = myText; . This seems obvious, but on logic. Just think about it. How the Java\
    \ compiler finds out the first myText stands for the private field variable, while\
    \ the second myText stands for the formal parameter? No!\n\nSince a formal parameter\
    \ exists only inside the body of the function where it is defined, we do not have\
    \ the same situation inside the printGreeting() function, where myText unambiguously\
