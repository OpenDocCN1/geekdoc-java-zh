    {\n    public static void main(String[] args)\n    {\n        String[] week =\
    \ { \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"\
    , \"Sunday\" };\n        System.out.println(\"The week has \" + week.length +\
    \ \" days.\");\n        for (String day : week) System.out.println(day);\n   \
