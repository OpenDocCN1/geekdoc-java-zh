    \ // output : 9\n        System.out.println(digits[13]); // error when the size\
    \ is 10\n    }\n}\n```\n\n# Călin Galeriu CS 考试 OOP 选项 Java 编程基础\n\n并不是所有的编程语言都会检查数组索引越界。例如，C\
    \ 和 C++ 程序不会报告错误，而是会从错误的内存位置读取或写入。从这一点点起，Java 提供了一个更安全的选项。\n\n我们还可以拥有二维（2D）数组，也称为矩阵。矩阵中的元素按行和列排序。二维数组中的元素通过两个索引来标识，这两个索引是从零开始的整数计数器。我们通常将第一个索引视为行，第二个索引视为列。我们还可以拥有三维（3D）数组，或更多维度的数组。数组的维度由方括号\
    \ `[]` 给出。\n\n二维数组有三种等声明方式：\n\n```java\ndata_type[][] array_name;\n```\n```java\n\
    data_type array_name[][];\n```\n```java\ndata_type[] array_name[];\n```\n\n最后一种声明数组的方法揭示了在\
    \ Java 中，二维数组是一维数组的数组。对于二维数组 `array_name[row][column]`，`array_name.length`给出行数，`array_name[row].length`给出列数。**警告！**\
    \ 在 Java 中，不同的长度容易混淆。`array_name.length`给出行数。\n\n下一个程序（Java Example 48）演示了整数二维数组的使用。程序显示了当创建一个整数一维数组时，所有元素的初始值都是零。二维数组的行数和列数可以通过\
    \ `length` 属性获得。\n\n```java\n// Java Example 48\npublic class Main\n{\n    public\
    \ static void main(String[] args)\n    {\n        int[][] board = new int[10][20];\n\
    \        board[5][15] = 505;\n        System.out.println(board[5][15]); // output\
    \ : 505\n        System.out.println(board[6][16]); // output : 0\n        System.out.println(board.length);\
    \ // output : 10\n        System.out.println(board[0].length); // output : 20\n\
    \    }\n}\n```\n\nJava 的一个令人惊讶的特性是我们可以具有不同长度的二维数组。虽然二维数组有一个定义的行数，但有时它没有相同的列数。在这种情况下，我们只能讨论每一行的元素数量。\n\
    \n# IB 考试 OOP 选项 Java 编程基础\n\n下一个程序（Java Example 49）演示了位于不同长度行中的整数二维数组的使用。数组有五行，但没有定义的列数。Java\
    \ Example 49 程序还演示了当所有元素值已知时如何创建这样一个数组。\n\n```java\n// Java Example 49\npublic\
    \ class Main\n{\npublic static void main(String[] args) {\n    int[][] fif = {{1},\
    \ {2}, {3}, {4, 5, 6}, {7, 8}, {9}};\n    System.out.println(\"The number of rows\
    \ : \" + fif.length);\n    for(int i=0; i<fif.length; i++) {\n        System.out.println(\"\
    : number of elements in row \" + i + \" \" + fif[i].length);\n        System.out.println(\"\
    The element(s) in row \" + i + \" \");\n        for(int j=0; j<fif[i].length;\
    \ j=j+1) System.out.print(fif[i][j] + \" \");\n        System.out.println(\"\"\
    );\n    }\n}\n```\n\n# Călin Galeriu IB 考试 OOP 选项 Java 编程基础\n13. 函数：值传递和引用传递\n\
    \n调用函数时，有两种提供输入参数的方法。第一种方法是提供输入参数的拷贝，这是值传递。第二种方法是提供参数存储在 RAM 中的地址（引用）。这是引用传递。\n\
    \n在 Java 中，基本类型变量和 `String` 类对象总是通过值传递给函数的。\n\n下一个程序（Java Example 50）演示了值传递的工作原理。`main()`\
    \ 函数内部的整数变量 `x` 不会被 `addObjectHundred()` 函数内部的 `x = x + 100;` 行所改变。事实上，我们处理的是两个独立的变量，它们都名为\
    \ `x`，但存在不同的函数体内。`main()` 函数内部的 `x` 变量是运行所说的实参（actual parameter），而 `addObjectHundred()`\
    \ 函数内部的 `x` 变量是运行所说的形参（formal parameter）。计算机程序中变量生存的地方（变量存在且可以被访问的地方）被称为变量作用域（variable\
    \ scope）。\n\n```java\n// Java Example 50\npublic class Main\n{\n    public static\
    \ void main(String[] args)\n    {\n        int x = 505;\n        System.out.println(\"\
    before the function call : x = \" + x); // output : 505\n        int y = addObjectHundred(x);\n\
    \        System.out.println(\"after the function call : x = \" + x); // output\
    \ : 505\n    }\n\n    static int addObjectHundred(int x)\n    {\n        x = x\
    \ + 100;\n        return x;\n    }\n}\n```\n\n可以重命名形参，从而非常清楚地表明程序处理的是不同的变量。例如，可以将\
    \ `addObjectHundred()` 函数更改为：\n\n```java\nstatic int addObjectHundred(int z)\n\
    {\n    z = z + 100;\n    return z;\n}\n```\n\n当通过值传递调用这个 `addObjectHundred()`\
    \ 函数时，实参 `x` 的值被复制到形参 `z` 中。这样，`x` 的值就不会被改变。\n\n"
