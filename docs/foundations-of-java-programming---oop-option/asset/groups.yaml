    \n# Câlin Galeriu IB CS 考试 OOP 选项 Java 编程基础\n\n我们之前在 Java Example 35 中使用过静态 `String`。静态字段只存在一个副本。现在，为了更好地理解静态变量在对象内部的行为，我们展示了一个程序\
    \ Java Example 40，其中实例化了三个对象。这些对象（`obj1`、`obj2` 和 `obj3`）共享名为 `myStaticVar` 的同一个静态变量。在任何一个对象中更改此变量都会改变所有对象中的变量。如果不需要某个实例化的对象，我们可以使用类名来访问静态变量，在此例中为\
    \ `StaticVarExample`。访问一个变量意味着查找（读）并修改（写）它的值。\n\n```java\n// Java Example 40\n\
    public class Main {\n    public static void main(String[] args) {\n        StaticVarExample\
