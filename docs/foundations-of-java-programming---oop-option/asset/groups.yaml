  - '[PAGE 11]


    # Călin Galieru Foundations of Java Programming for the OOP Option of the IB Exam

    3. Variables: primitive variable types, text strings, and constants


    Remember that in mathematics a variable x is a placeholder for a number. The number
    may be an unknown, like for example in the equation 2x + 3 = 5, or the number
    may take different values, like for example in the slope-intercept equation of
    a line y = 2x + 3.


    In computer programming variables work in the same way. Inside a computer the
    content (the value) of a variable is stored in Random Access Memory (RAM), occupying
    a given amount of space at a given memory address. In a general variable have:


    +   * A name (the name of a storage location), for example x.

    * A type, for example int is a signed integer number.

    * A value (the content of the storage location), or 505.

    * An address in RAM. We have no direct access to this information.

    * A size in RAM. Java a variable of type is stored in RAM using 32 bits.

    * A scope. The variable varies, while the program is running, only in a part of
    the code.


    **Warning!** In Java a variable exists only within the nearest set of closed curly
    braces } that contain the declaration of that variable.


    A declaration statement gives the type of a variable. Example: int x;

    an assignment statement gives the value of a variable. Example: x = 505;

    In general the declaration of the type of a variable must be done before the assignment
    of a value to that variable.


    ![](img/f2c7aa28c73a4748dac938a1e583595e_11_0.png)


    An initialization statement brings the declaration of a variable and the initial
    assignment of a value. Example: int x = 505;

    Java has 8 primitive variable types. We call them primitive because they come
    as a standard feature of the Java language, to distinguish them from user defined
    variable types. The name, size and range of each these 8 primitive variable types
    are listed below.


    ```

    byte = 8-bit signed integer, -128 ... 127

    short = 16-bit signed integer, -32,768 ... 32,767

    int = 32-bit signed integer, -2,147,483,648 ... 2,147,483,647

    long = 64-bit signed integer, -9,223,372,036,854,775,808 ... 9,223,372,036,854,775,807

    float = 32-bit single precision floating number,

    ±3.4028237 × 10^-38 ... ±1.40239846 × 10^45

    double = 64-bit double precision floating number,

    ±1.7976931348623157 × 10^-308 ... ±4.94065658412654 × 10^-324

    char = 16-bit Unicode character, 0 ... 65,535

    boolean = true or false

    ```


    Variables of type short and float are not required for the IB Computer science.

    Numerical values of type long have to end in L or l , and numerical values of
    float have to end in F or f . Numerical values of type double may end in D or
    d , this rule is optional. In scientific notation are written using E or e , which
    stands for a power of 10. For example 3.4E5 stands for 3.4×10⁵.'
