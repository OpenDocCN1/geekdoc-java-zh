- md: "\n## Foundations of Java Programming for the OOP Option of the IB CS Exam\n\
    \nif (conditionA) { instructionA1; instructionA2; instructionA3; }\nelse instructionB;\n\
    \nThe flowchart of the if-else structure is:\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_22_0.png)\n\
    \nThe next program, Java Example 13, finds if the integer number i is odd or even,\
    \ and then prints this information. When is a number even? When the remainder\
    \ of an integer division by 2 is 0.\n\n```java\n// Java Example 13\npublic class\
    \ Main\n{\n    public static void main(String[] args)\n    {\n        int i =\
    \ (int)(6*Math.random() + 1); // roll of the die\n        System.out.println(\"\
    i = \" + i); // the statement before IF-ELSE\n        if (i % 2 == 0)\n      \
    \  {\n            System.out.println(\"even number\");\n        }\n        else\n\
    \        {\n            System.out.println(\"odd number\");\n        }\n     \
    \   System.out.println(\"i = \" + i); // the statement after IF-ELSE\n    }\n\
    }\n```\n\n## Foundations of Java Programming for the OOP Option of the IB CS Exam\n\
    \nMore complex situations, when there are more than 2 possible outcomes, require\
    \ more complex if structures. Note that in the flowcharts the two blocks instructionA\
    \ and instructionB can themselves be made from other or if-else structures.\n\n\
    The next program, Java Example 14, finds the integer number i is in the first\
    \ third (1 or 2), in the middle third (3 or 4), or in the upper third (5 and 6),\
    \ and then prints this information.\n\n```java\n// Java Example 14\npublic class\
    \ Main\n{\n    public static void main(String[] args) {\n        int i = (int)(Math.random()\
    \ * 6) + 1); // roll of the die\n        System.out.println(\"i = \" + i); //\
    \ the statement before IF-ELSE-IF-ELSE\n        if (i <= 2) {\n            System.out.println(\"\
    lower third\");\n        }\n        else if (i <= 4) {\n            System.out.println(\"\
    middle third\");\n        }\n        else {\n            System.out.println(\"\
    upper third\");\n        }\n        System.out.println(\"i = \" + i); // the statement\
    \ after IF-ELSE-IF-ELSE\n    }\n}\n```\n\nNotice that the if-else-if structure\
    \ used above is efficient. Only two inequalities are tested by the program. A\
    \ simpler alternative is to use three simple structures, but then four inequalities\
    \ are tested, as shown below.\n\n```java\nif (i <= 2) System.out.println(\"lower\
    \ third\");\nif (i > 2 && i < 5) System.out.println(\"middle-third\");\nif (i\
    \ >= 5) System.out.println(\"upper third\");\n```\n\nAs expected, two of these\
    \ four inequalities are not independent, since !(i <= 2) is the same as i > 2\
    \ , and !(i >= 5) is the same as i < 5.\n\nWhat do we do if we want the program\
    \ to print the value of the random number? We could use six simple if statements,\
    \ as shown below:\n\n```java\nif (i == 1) System.out.println(\"one\");\nif (i\
    \ == 2) System.out.println(\"two\");\nif (i == 3) System.out.println(\"three\"\
    );\nif (i == 4) System.out.println(\"four\");\n```\n\n## Foundations of Java Programming\
    \ for the OOP Option of the IB CS Exam\n\n```java\nif (i == 5) System.out.println(\"\
    five\");\nif (i == 6) System.out.println(\"six\");\n```\n\nThis program is very\
    \ inefficient because it will test all equalities every time, for any integer\
    \ random i. Often the testing will continue even after the correct message has\
    \ been printed. This is wasteful, because another true will never be found again.\
    \ A better option is to use a very long if-else-if-else-if-else-if-else-if-else\
    \ structure, as shown below:\n\n```java\nif (i == 1) System.out.println(\"one\"\
    );\nelse if (i == 2) System.out.println(\"two\");\nelse if (i == 3) System.out.println(\"\
    three\");\nelse if (i == 4) System.out.println(\"four\");\nelse if (i == 5) System.out.println(\"\
    five\");\nelse System.out.println(\"six\");\n```\n\nThe above program is more\
    \ efficient. Once a match is found, the message is printed and the remaining equalities\
    \ are no longer checked. Also, there is no need to check for i == 6 , because\
    \ at this point in the program there is no other available option for the value\
    \ of the integer random number i.\n\n## 6.3. The SWITCH structure\n\nAnother option\
    \ is to use a switch(i) statement, as shown in Java Example 15.\n\n```java\n//\
    \ Java Example 15\npublic class Main\n{\n    public static void main(String[]\
    \ args) {\n        int i = (int)(6*Math.random() + 1); // roll of the die\n  \
    \      System.out.println(\"i = \" + i); // the statement before SWITCH\n    \
    \    switch(i) {\n            case 1 : System.out.println(\"one\");\n        \
    \        break;\n            case 2 : System.out.println(\"two\");\n         \
    \       break;\n            case 3 : System.out.println(\"three\");\n        \
    \        break;\n            case 4 : System.out.println(\"four\");\n        \
    \        break;\n            case 5 : System.out.println(\"five\");\n        \
    \        break;\n            default: System.out.println(\"six\");\n        }\n\
    \    }\n}\n```\n\n## Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n7. Control flow: loops\n\nThe flow of control (the control flow)\
    \ in a program can be sequential (the computer executes one line of code after\
    \ another, in a sequence) or based on selection (the computer chooses a path or\
    \ another, depending on some condition if-else, or switch statements) or based\
    \ on repetition (the computer repeats a loop of code). The loops of code can be\
    \ controlled by counters (in the case of for loops) or by events (in the case\
    \ of while and do ... loops). To implement repetitive structures the Java language\
    \ has for , while , do, continue , break keywords.\n\n### 7.1. The FOR loop\n\n\
    The structure of a for loop is this:\n\n```java\nfor(initialize_the_counter ;\
    \ loop_condition ; change_the_counter) { instructions; }\n```\n\nThe counter is\
    \ an integer variable that exists only for the duration of the loop. The initialize_the_counter\
    \ instruction sets the initial value of the counter. The loop_condition becomes\
    \ false the repetition ends, the computer exits the loop, and the next instruction\
    \ after the for loop structure is executed. The change_the_counter instruction\
    \ is usually an increment (addition of 1) or decrement (subtraction of 1) operation.\
    \ The loop_condition must be related to the value of the counter.\n\nFor one instance\
    \ the curly braces are optional, but still recommended as good programming practice.\
    \ Two or more instructions have be written inside curly braces. We can also have\
    \ nested for loops, when one of the instructions is itself a for loop.\n\nThe\
    \ next program, Java Example 17, finds the sum of the integer numbers from 1 to\
    \ 10. Please notice how the sum is declared and initialized outside of the for\
    \ loop structure.\n\n```java\n// Java Example 17\npublic class Main\n{\n    public\
    \ static void main(String[] args)\n    {\n        int sum = 0;\n        for(int\
    \ i=1; i <= 10; i=i + 1)\n        {\n            System.out.println(\"i = \" +\
    \ i);\n            sum = sum + i;\n        }\n        System.out.println(\"1 +\
    \ 2 + ... = \" + sum);\n    }\n}\n```\n\nSometimes the program needs to get out\
    \ of a loop before the loop becomes false. Java does not have a go to instruction,\
    \ like the C programming language, but we can use a break statement in order to\
    \ exit the for loop and go to the next instruction in the program, the first instruction\
    \ after the for loop structure.\n"
