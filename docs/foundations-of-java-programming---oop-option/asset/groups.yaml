    # Câlin Galeriu Foundations of Java Programming for the OOP Option of the IB CS
    Exam


    How does the Quizmaker program work? The Quizmaker program is modular, it has
    four main parts. These four parts, in the program list, start with comments in
    upper case letters.


    In the first part, the program will read the questions and the answers from the
    input text file. The user has to give the name (directory and file name) of the
    input text file. The text lines from this file are first read and then converted
    into String arrays, questions1 for the questions and answers1 for the answers.
    The program uses a boolean variable Q in order to decide whether the most recent
    read line is a question or an answer. While reading the questions and answers,
    the program is also incrementing a counter, an int variable nTotal, that starts
    at 0 and ends up to the total number of questions in the input text file. The
    program will also give some information to the user, printing the total number
    of questions, as well as all the answers. After this the user will give the number
    of questions, info stored in an int variable nQuiz.


    In the second part, the program will randomly select nQuiz questions from the
    total of nTotal questions. This is done with the help of myList, an ArrayList
    of Integer objects. nTotal integers 0, 1, 2, ..., nTotal-1, corresponding to the
    different questions in the input file. They are scrambled by the shuffle(1) method.
    The scrambled answers are saved into the questions2 String array, and their answers
    are saved in the same order. In other words, questions2[i] = questions[j]; and
    answers2[i] = answers1[j]; where j = myList.get(i).


    The only first Quiz makes the selection of the nQuiz questions and answers2 String
    are used to generate the quiz. After the random selection of the nQuiz questions,
    the program will scramble their answers. This is done with the help of a second
    ArrayList of Integer objects named myList2. The nQuiz integers 0, 1, 2, ..., nQuiz-1,
    corresponding to the different questions in the output text file, are scrambled
    by the shuffle() method once. The unscrambled questions are saved into the questions3
    String array, and their scrambled answers are saved into the answers3 String array.
    In other words, questions3[i] = questions2[j]; and answers3[i] = answers2[j];
    where j = myList.get(i).


    To help you understand the process described above, we explicitly display the
    content of all String arrays and ArrayList lists, as it happened during the trial
    run on the previous pages.


    | | questions[i] | answers1[i] | j = myList.get(i) |

    |---|---|---||

    | 0 | First month? | January | 4 |

    | 1 | Second month? | February | 2 |

    | 2 | Third month? | March | 1 |

    | 3 | Fourth month? | April | 10 |

    | 4 | Fifth month? | May | 3 |

    | 5 | Sixth month? | June | 8 |

    | 6 | Seventh month? | July | 11 |

    | 7 | Eighth month? | August | 9 |

    | 8 | Ninth month? | September | 0 |

    | 9 | Tenth month? | October | 7 |

    | 10 | Eleventh month? | November | 6 |

    | 11 | Twelfth month? | December | 5 |'
