    \n# IB CS 考试 OOP 选项的 Java 编程基础\n\n## 21. 文本文件的读取与写入\n\n在文本文件中，每行都以一个特殊的换行符（EOL）字符（或字符序列）结束，文本本身以一个特殊的结束符（EOF）字符结束。这些特殊字符取决于运行计算机的操作系统。\n\
    \n### 21.1. 按顺序从文本文件中读取\n\n从文本文件中读取是通过借助 `File`、`FileReader` 和 `BufferedReader`\
    \ 类型（类）的对象完成的。\n\n`File(String pathname)` 构造函数根据路径名创建一个 `File` 对象。路径名指定了目录和名称。路径名的示例是\
    \ \"C:\\Files\\abc.txt\"。`File` 类具有基本方法，用于创建新文件和目录、搜索文件和目录、查找某些属性（可读、可写、长度等）以及删除文件。布尔值\
    \ `exists()` 方法在文件或目录已存在时返回 `true`。布尔值 `createFile()` 方法在新目录创建成功时返回 `true`。布尔值\
    \ `delete()` 方法在文件或目录被成功删除时返回 `true`。当操作系统报告错误时，这些方法将抛出 `IOException`。\n\n`FileReader(File\
    \ file)` 构造函数根据 `File` 对象创建一个 `FileReader`。`FileReader` 类具有从文本文件中读取字母和数字字符的方法。`int\
    \ read()` 方法将读取一个字符，该函数的值就是该字符。`int read(char c, int offset, int len)` 方法将读取一个字符序列并将其放入数组中。当发生错误时，这些方法将抛出\
    \ `IOException`。\n\n`BufferedReader(FileReader myReader)` 构造函数根据 `FileReader`\
    \ 对象创建一个 `BufferedReader` 对象。在没有缓冲区的情况下从文本文件中读取字母数字字符是不高效的，因为每次读取操作都要访问硬盘上的文件，而这是一个相对缓慢的过程。为了提高性能，`BufferedReader`\
    \ 对象使用输入缓冲区（位于 RAM 空间中）。除了 `int read()` 方法外，`BufferedReader` 类还有一个 `String readLine()`\
    \ 方法，用于返回文本行。该函数将从字符流中读取一行文本。当文本文件中没有更多行可读时，返回值为 `null`。`void close()` 将关闭字母数字信息的源（流）并释放与其相关的任何资源。`BufferedReader`\
    \ 还有一个 `ready()` 方法，用于防止在调用 `read()` 时发生错误，这种错误发生在字母数字流未准备就绪时（例如，在在线通信期间）。\n\n\
    > 警告！当字符流不以 EOL 或 EOF 结尾，且 `ready()` 的返回值为 `true` 时，`readLine()` 将崩溃。\n\n由于读取文本文件过程中所有可能抛出\
    \ `IOException` 的方法，Java 代码应该写在 `try-catch` 块中。它看起来如下：\n\n```java\ntry {\n   \
    \ instructions;\n} catch (IOException e) {\n    System.out.println(e);\n}\n```\n\
