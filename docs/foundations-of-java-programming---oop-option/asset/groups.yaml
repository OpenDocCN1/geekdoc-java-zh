    \    }\n}\n```\n\n如果在创建数组时，所有数组都赋予了某些初始值，那么就有另一种更短的方法来定义、实例化并初始化数组：\n`data_type[]\
    \ array_name = {element0, element1, element2, ... };` 在这种情况下不需要使用 `new` 关键字，也不需要指定元素的数量。\n\
    \n下一个程序 Java Example 43 演示了当所有数组元素都有已知初始值时创建整数数组的简短方法。\n\n```java\n// Java Example\
