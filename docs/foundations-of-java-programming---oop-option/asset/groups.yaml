    \ function, we could write System.out.println(this.myText); instead of System.out.println(myText);\
    \ and it would make no difference.\n\n# 10.4 Method overloading\n\nMethod overloading\
    \ is an Object-Oriented Programming (OOP) feature that allows a class to have\
    \ two or more methods with the same name, as the methods have different input\
    \ parameters. The methods can be distinguished when they have a different number\
    \ of input parameters, or when they have input parameters of different types.\
    \ It is not allowed to have two methods with the same input parameters, but with\
    \ different output value types (return types). Method overloading is an example\
    \ of compile time polymorphism, because Java decides which one of the methods\
    \ to use at compile time,"
