    \ is successfully deleted. These methods will throw an IOException when the operating\
    \ system reports an error.\n\nThe FileReader(File file) constructor creates a\
    \ FileReader from a File object. The FileReader class has methods that read alphanumeric\
    \ characters from a text file. The int read() method will read one character,\
    \ which is the value of this function. The int read(char c, int offset, int len)\
    \ method will read a sequence of characters, placing them into an array. These\
    \ methods will throw an IOException when there is an error.\n\nThe BufferedReader(FileReader\
    \ myReader) constructor creates a BufferedReader object from a FileReader object.\
