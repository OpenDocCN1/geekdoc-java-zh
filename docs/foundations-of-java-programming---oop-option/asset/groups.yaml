    测试卷的答案密钥由来自 questions2 的所有问题（与 questions3 中的问题相同且顺序相同）组成，随后是位于 answers2 中顺序索引
    i 处找到的正确答案。然而，正确答案必须在 answers3 中索引为 j 的位置找到。换句话说，对于每个 i，questions[i] = questions[j]，且正确答案是
    answers2[i]，它必须等于答案密钥中列出的 answers3[j]（即答案密钥中列出的正确答案）。因此，我们正在寻找满足方程 answers2[i]
    = answers3[j] 的 j 值。


    当我们打乱答案顺序时，我们从 answers2 中索引为 j = myList.get(i) 的位置获取答案，并将其写入索引 i 的位置，换句话说，即 answers[i]
    = answers2[j]。


    让我们重新为索引变量命名。我们将用 j 代替 i，用 i 代替 j。我们可以这样做，i 和 j 是虚拟变量，取自从 0 到 nQuiz-1 的所有值，并且该集合中的每个
    i 都与同一集合中的一个 j 相关。上述段落中的关系变为 i = myList.get(j) 和 answers[j] = answers2[i]。但最后这个方程正是我们所寻找的关系！它发生在
    i = myList.get(j) 的时候。


    总结一下，对于测试卷中索引为 i 编号为 i + 1 的问题，答案是字母 (char) (65 + j)，其中 j 的值满足方程 i = myList.get(j)。程序通过尝试法来求解该方程，测试所有可能的
    j 值直到找到匹配项。


