    # Câlin Galeriu

    # Foundations of Java Programming for the OOP Option of the IB CS Exam


    ## Introduction


    During the 2017-2018 school year I taught Computer Science (CS) at the Mark Twain
    International School in Romania. It was a small class of high school students
    preparing to take the International Baccalaureate (IB) exams in May 2019. The
    Computer Science Option selected by these students was Object-Oriented Programming,
    which is usually taught based on computer programming in Java. On this occasion
    I discovered that there were no good teaching resources specifically tailored
    for this task. The Java textbooks on the market were huge with hundreds of pages
    covering a material that was not needed for the IB CS exam. Students preparing
    for the IB exams may not have the extra time to study advanced programming topics
    like Java generics, or anything not included in the IB CS curriculum. What was
    even worse, I found that many Java programs presented in these books were very
    long, often going on for over several pages. Whereas many high school students
    would find trouble speaking on a very steep learning curve, with negative effects
    on their self-confidence and motivation. I personally believe that an introduction
    to any programming language with their own lines, will make them type all of these
    programs with their hands, before compiling and executing them. This educational
    philosophy, this teaching strategy, closely mirrors the best practice of requiring
    the students to copy all the information from the whiteboard to the notebook,
    going through the students'' brains, arms, and hands, this path is when the information
    is being processed, is when active learning takes place. I therefore decided to
    write my own class notes, an introduction to the Java programming based on short
    Java programs, each of no longer than a single page (with the exception of just
    one longer program at the end of this book). Of course, once the Java programming
    concepts are fully mastered by the students they are encouraged to continue to
    improve their computer science and Java programming skills with other textbooks
    of longer and more complex Java programs. To facilitate future growth, I also
    included in this textbook a few Java topics are not (yet) needed for the IB CS
    exam, the switch structure and the use of command line parameters. I hope that
    in this I have reinforced the material presented in my Foundations of Java Programming.
    Another thing that makes this textbook different is that you will not notice repetition.
    Some important keywords and computer science concepts are presented several times,
    because the final goal is not just to learn program in Java, but also getting
    good marks on the IB CS exam. The students need to remember the important material.
    Only through repeating the computer science topics will be retained, and the technical
    vocabulary and the algorithms will stick into their long term memory.


    Last but not least, I would like to express my gratitude to the people who have
    filled the Internet with very useful information about computer science and the
    Java programming language, including the comics. Many thanks to the websites with
    free Java compilers, to Oracle and NetBeans.


    Even though through several revisions of this material, I am sure that these class
    notes can still be improved. If you find any typos, errors, bugs, or if you have
    any useful suggestions, please email me at cgaleriu@yahoo.com.


    Thank you,


    Câlin Galeriu

