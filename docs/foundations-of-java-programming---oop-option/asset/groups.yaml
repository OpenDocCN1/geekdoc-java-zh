    \ 对象。\n\n```java\n// Java Example 72\n\npublic class Main\n{\n    public static\
    \ void main(String[] args) {\n        Child myChild = new Child();\n        myChild.firstName\
    \ = \"Peter\";\n        myChild.lastName = \"Thompson\";\n        myChild.dog.name\
    \ = \"Lassie\";\n        Vet.vaccinate(myChild.myDog);\n    }\n}\nclass Parent\
    \ {\n    String firstName;\n    String lastName;\n}\nclass Child extends Parent\
    \ {\n    Dog myDog = new Dog();\n}\nclass Dog {\n    String name;\n    boolean\
    \ vaccinated;\n}\nclass Vet {\n    static void vaccinate(Dog aDog) {\n       \
    \ aDog.vaccinated = true;\n    }\n}\n```\n\n每个 Java 类都可以借助统一建模语言（UML）图来表示，Java\
    \ 类之间的关系也可以用这些 UML 图来表示。\n\n一个 UML 类图有三层。顶部是类名。中间是类的字段变量（原始类型变量或对象），底部是类的方法。当字段变量或方法是私有的（private）时，我们在前面加一个减号（-）。当字段变量或方法是公有的（public）时，我们在前面加一个加号（+）。字段变量的类型（变量类型或类）必须跟在名称后面。方法的返回值必须跟在名称后面。\n\
