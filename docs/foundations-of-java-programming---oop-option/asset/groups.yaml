    \ there.\"\n\n```java\n// Java Example 73\npackage textcreate;\nimport java.io.File;\n\
    import java.io.IOException;\n\npublic class TextFileCreate {\n    public static\
    \ void main(String[] args) {\n        try {\n            File myFile = new File(\"\
    C:/JavaTextFiles/text_file_2.txt\");\n            if(myFile.exists()) {\n    \
    \            System.out.println(\"The file is already present there.\");\n   \
    \         } else {\n                boolean fvar = myFile.createNewFile();\n \
    \               if (fvar) {\n                    System.out.println(\"The file\
    \ has been successfully created.\");\n                } else {\n             \
    \       System.out.println(\"ERROR: The file has not been created.\");\n     \
    \           }\n            }\n        } catch (IOException e) {\n            System.out.println(e.getMessage());\n\
    \        }\n    }\n}\n```\n\nThe File class has other important methods, for example:\
    \ isDirectory(), isFile(), delete(), mkdir(), renameTo(), setReadOnly(). For a\
    \ list of all the methods of the File class, please go to: https://www.tutorialspoint.com/java/java_file_class.htm\n\
    \n# Călin Galeriu Foundations of Java Programming the OOP Option of the IB CS\
    \ Exam\n## 21.2. Writing into a text file in sequential order\n\nWriting into\
    \ text files is done with the help of objects of type (class) File, FileWriter,\
    \ BufferedWriter, and PrintWriter.\n\nThe File(String pathname) constructor creates\
    \ a File from a path name. The path name specifies the directory and the file\
    \ name. An example of a path name is \"C:\\TestFiles\\abc.txt\".\n\n> **Warning!**\
    \ If the file with given path name exists, this constructor will erase all the\
    \ previous information stored in the text file. In order to save the old information\
    \ and append the new information (add the new information at the end of the text\
    \ file), we have to use the BufferedWriter(File file) constructor.\n\nThe BufferedWriter\
    \ class has methods that write alphanumeric characters to the text file. The public\
    \ void write(char c) method will write only one alphanumeric character, as given\
    \ in an array. The public void write(String string) method will write a sequence\
    \ of strings. These methods will throw an IOException whenever there is an error.\n\
    \nThe PrintWriter(BufferedWriter bw) constructor creates a BufferedWriter object\
    \ from a FileWriter object. Writing alphanumeric characters into a text file,\
    \ but without a buffer, is not very efficient, because the text file on the hard\
    \ disk is costly for each operation, and this is a relatively slow process. To\
    \ improve performance, the BufferedWriter uses an output buffer (a space in RAM)\
    \ of default size; it holds information that is waiting to be written into the\
    \ text file. In addition to the write() methods, the BufferedWriter class has\
    \ a void newLine() method that will write a line separator (an EOL). The close()\
    \ method will flush the buffer (that it will write all the information into the\
    \ text file), close the text file, and release any resources associated with it.\n\
    \nThe PrintWriter(BufferedWriter bw) constructor creates a PrintWriter from a\
    \ BufferedWriter object. In addition to the well-known print() and println() methods,\
    \ the PrintWriter class has a very useful printf() method. We also get formatted\
    \ output with System.out.printf() and String.format() methods. The meaning of\
    \ \"formatted output\" is that special symbols are used inside the text string.\
    \ These symbols act as placeholders for various types, describing the type of\
    \ variable, the total number of decimal places, and other formatting details.\
    \ The general syntax of format:\n\n* `%d`: decimal integer (Example: %5d for a\
    \ number written with 5 characters)\n* `%f`: floating point number (Example: %6.2f\
    \ for a number written with 6 characters, including the decimal point and 2 decimal\
    \ places)\n* `%c`: alphanumeric character\n* `%s`: text string\n* `%h`: hashcode\n\
    * `%n`: new line\n\nBecause all the methods may throw an IOException during the\
    \ process of writing into a text file, the Java code has to be inside a try-catch\
    \ block.\n\n# Călin Galeriu Foundations of Java Programming for the OOP Option\
    \ in the IB Exam\n\nThe next program, Java Example 74, creates a new text file\
    \ called \"text_file_3.txt\" and writes a few lines to it using the write(), newLine(),\
    \ and println() methods.\n\nStart NetBeans, as the previous program, and in the\
    \ New Application window create the project name. Type the source file, and run\
    \ the project. Verify that a file named text_file_3.txt has been created in the\
    \ C:/JavaTextFiles directory. Open the text_file_3.txt file and verify that it\
    \ has lines of text. Close the text file. Run the program again. Open the text_file_3.txt\
    \ file again and verify that more lines of text are added to the old content.\n\
    \n```java\n// Java Example 74\npackage textfile;\nimport java.io.File;\nimport\
    \ java.io.IOException;\nimport java.io.FileWriter;\nimport java.io.BufferedWriter;\n\
    import java.io.PrintWriter;\n\npublic class TextFileWrite {\n    public static\
    \ void main(String[] args) {\n        try { // write inside an existing file\n\
    \            File myfile = new File(\"C:/JavaTextFiles/text_file_3.txt\");\n \
    \           FileWriter fw = new FileWriter(myFile, true); // append\n        \
    \    BufferedWriter bw = new BufferedWriter(fw);\n            bw.write(\"first\
    \ line of text\");\n            bw.newLine();\n            PrintWriter pw = new\
    \ PrintWriter(bw);\n            pw.print(\"second line of text\");\n         \
    \   pw.println();\n            pw.println(\"third line of text\");\n         \
    \   pw.printf(\"%d + %d = %d\\n\", 2, 3, 5);\n            pw.close();\n      \
    \      System.out.println(\"Text lines written successfully.\");\n        } catch\
    \ (IOException e) {\n            System.out.println(e.getMessage());\n       \
    \ }\n    }\n}\n```\n\nA shorter version of this program does not use the File\
    \ object of class File, but instead uses the one-line expression `FileWriter fw\
    \ = new FileWriter(\"C:/JavaTextFiles/text_file_3.txt\", true);`.\n\n## 21.3.\
    \ Reading and writing to a text file in random order\n\nWe have seen how to read\
    \ the content of a text file, from the beginning of the file all the way to the\
    \ end in a sequence. We have seen how to write into a text file by appending information\
    \ at the end of the file.\n\n# Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\nCan we read the text file from any random position in the\
    \ file? Can we write into the text file at any random position in the file? The\
    \ answer is yes with the RandomAccessFile.\n\nThe RandomAccessFile(File, String\
    \ mode) constructor takes a File object, like before, with a second parameter\
    \ (\"r\" for a read-only text file, or \"rw\" when writing into the text file\
    \ is allowed) and instantiates a RandomAccessFile object. The methods of the RandomAccessFile\
    \ class can read from or write to the random access file at any time.\n\nA random\
    \ file looks like a large 1D array of bytes. The same way we can access any byte\
    \ using an index, we can access any byte in the text file using a file pointer.\
    \ We can find the value of the file pointer using the getFilePointer() method,\
    \ and we can change the value of the file pointer using the seek(long) method.\
    \ The length() method returns the length of the file, which is the number of bytes\
    \ stored in the text file.\n\nReading and writing into the random access file\
    \ is done with a series of read() and write() method calls. After each read()\
    \ or write() operation the file pointer is incremented, so we don't have to change\
    \ the file pointer when we read or write in sequence order. When numbers that\
    \ take two or more bytes are read or written, the high byte goes first.\n\nThe\
    \ int read() method reads from the text file and returns an unsigned byte (a number\
    \ in the 0-255 range), which is handled internally by Java as Java does not have\
    \ the unsigned byte primitive types. The methods return -1 when the end of the\
    \ file is reached.\n\nThe boolean readBoolean() reads one byte from the text file,\
    \ then returns a boolean value. This return value is false when the byte is 0,\
    \ and true otherwise.\n\nThe byte readChar() method reads and returns a char value.\n\
    \nThe double readDouble() method reads a long value from the text file, converts\
    \ it to double, and then returns that double value.\n\nThe float readFloat() method\
    \ reads an int value from the text file, converts it to float, and then returns\
    \ that float value.\n\nThe int readInt() method reads and returns an int value.\n\
    \nThe long readLong() method reads and returns a long value.\n\nThe short readShort()\
    \ method reads and returns a short value.\n\nThe String readLine() method reads\
    \ and returns a line of text (in ASCII format).\n\nThe String readUTF() method\
    \ reads and returns a Unicode string (in modified UTF-8 format).\n\nThe write(int\
    \ b) method writes into the text file an unsigned byte (a number in the 0-255\
    \ range), which is handled internally by Java as an int value.\n\nThe writeBoolean(boolean\
    \ a) method writes a byte (1 for true, 0 for false).\n\nThe writeByte(int b) method\
    \ writes a byte value.\n\nThe writeChar(int c) method writes a char value.\n\n\
    The writeDouble(double d) method converts the double input variable to long, and\
    \ then writes into the text file that long value.\n"
