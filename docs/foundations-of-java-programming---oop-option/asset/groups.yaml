- md: "\n# Câlin Galeriu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\nThe next program, Java Example 39, also demonstrates a Java class\
    \ with two constructors. In this example, ConstructorExample class has two field\
    \ variables, String name and one int variable age, that are not private. As a\
    \ consequence, these two field variables can be accessed directly from the main()\
    \ of the Main class.\n\n```java\n// Java Example 39\npublic class Main {\n   \
    \ public static void main(String[] args) {\n        ConstructorExample o1 = new\
    \ ConstructorExample();\n        ConstructorExample o2 = new ConstructorExample(\"\
    Ken\", 21);\n        System.out.println(\"My name is \" + o1.name + \" and my\
    \ age is \" + o1.age + \",\");\n        System.out.println(\"My name is \" + o2.name\
    \ + \" and my age is \" + o2.age + \",\");\n    }\n}\n\nclass ConstructorExample\
    \ {\n    String name;\n    int age;\n\n    ConstructorExample() {\n        name\
    \ = \"Barbie\";\n        age = 18;\n    }\n\n    ConstructorExample(String n,\
    \ int a) {\n        name = n;\n        age = a;\n    }\n}\n```\n\nThe Java program\
    \ will print \"My name is Barbie and my age is 18.\" first, because the first\
    \ object o1 is created (instantiated) using the first (no-argument) constructor,\
    \ and then will print \"My name is Ken and my age is 21.\", because the second\
    \ object o2 is created (instantiated) using the second (parameterized) constructor.\n\
    \n> Never take for granted the age that is self-reported by a Ken or a Barbie!\
    \ Especially if this information comes from a computer (or cellphone) screen,\
    \ without previous direct visual contact between the involved parties. Never take\
    \ for granted even the name that is self-reported by a person that you have never\
    \ met face-to-face before.\n\n# Câlin Galeriu Foundations of Java Programming\
    \ for the OOP Option of the IB CS Exam\n\nWe have used a static String earlier,\
    \ in Java Example 35. Static fields exist only in one copy. Now, to better understand\
    \ the behavior of static variables inside their objects, we show a program, Java\
    \ Example 40, where three objects are instantiated. These objects (obj1, obj2,\
    \ and obj3) share the same static variable named myStaticVar. Changing this variable\
    \ in any one of the objects will change it in all. If an instantiated object is\
    \ not even needed, we can access the static variable using the name of the class\
    \ instead, which in this case is StaticVarExample. To access a variable means\
    \ to be find (read) and change (write) its value.\n\n```java\n// Java Example\
    \ 40\npublic class Main {\n    public static void main(String[] args) {\n    \
    \    StaticVarExample obj1 = new StaticVarExample();\n        StaticVarExample\
    \ obj2 = new StaticVarExample();\n        StaticVarExample obj3 = new StaticVarExample();\n\
    \n        System.out.println(obj1.myStaticVar); // output : 123\n        System.out.println(obj2.myStaticVar);\
    \ // output : 123\n        System.out.println(obj3.myStaticVar); // output : 123\n\
    \        System.out.println(\"\"); // new line\n\n        // change the value\
    \ of the static variable in object obj2\n        obj2.myStaticVar = 505;\n\n \
    \       System.out.println(obj1.myStaticVar); // output : 505\n        System.out.println(obj2.myStaticVar);\
    \ // output : 505\n        System.out.println(obj3.myStaticVar); // output : 505\n\
    \        System.out.println(\"\"); // new line\n\n        // the name of an instantiated\
    \ object is not even needed\n        StaticVarExample.myStaticVar = 456;\n   \
    \     System.out.println(StaticVarExample.myStaticVar); // output : 456\n    }\n\
    }\n\nclass StaticVarExample {\n    public static int myStaticVar = 123;\n}\n```\n\
    \n# Foundations of Java Programming for the OOP Option of the IB Exam\n\nField\
    \ variables that are not static called instance variables. When a field variable\
    \ is not static, each (instantiated) object will have its own copy of that instance.\
    \ The instance variables are independent of each other, which can be accessed\
    \ only by the name of the instance followed by a dot. Trying to access an instance\
    \ variable by the name of the class will produce a compiler error.\n\nThe next\
    \ program, Java Example 41, is similar to Java Example 40, with one important\
    \ difference: the int variable myInstanceVar of the InstanceVar class is not static.\
    \ As a result, the value of this integer in obj2 will not modify its value in\
    \ obj1 and obj3.\n\n```java\n// Java Example 41\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        InstanceVar obj1 = new InstanceVar();\n\
    \        InstanceVar obj2 = new InstanceVar();\n        InstanceVar obj3 = new\
    \ InstanceVar();\n\n        System.out.println(obj1.myInstanceVar); // output\
    \ : 123\n        System.out.println(obj2.myInstanceVar); // output : 123\n   \
    \     System.out.println(obj3.myInstanceVar); // output : 123\n        System.out.println(\"\
    \"); // new line\n\n        // change the value of the static variable in obj2\n\
    \        obj2.myInstanceVar = 505;\n\n        System.out.println(obj1.myInstanceVar);\
    \ // output : 123\n        System.out.println(obj2.myInstanceVar); // output :\
    \ 505\n        System.out.println(obj3.myInstanceVar); // output : 123\n    }\n\
    }\n\nclass InstanceVar {\n    public int myInstanceVar = 123;\n}\n```\n\n# Câlin\
    \ Galeriu Foundations of Java Programming for the OOP Option of the IB CS Exam\n\
    \n## 12. Java objects: 1D and 2D arrays\n\nIn one dimensional (1D) arrays are\
    \ objects that hold a given number of elements of the same type, stored in memory\
    \ in sequential order. These elements can be variables of a primitive type, or\
    \ objects of a given class. First an array has to be declared to tell the Java\
    \ compiler the name of the array and the data type of the elements. The array\
    \ has to be instantiated. At this step the Java compiler reserves space for the\
    \ array, and gives the array elements their default values (zero, null, etc.).\
    \ After these two steps the array elements can be reassigned new values. The elements\
    \ of the array are identified with the help of an index, an integer counter starts\
    \ from zero, like this: `array_name[index]`.\n\n**Warning!** The fact that Java\
    \ array index starts at zero can be a bit confusing, especially since in mathematics\
    \ and in other languages (for example Pascal) the array index starts at one. For\
    \ the same reason the index of the last element in a Java array with n elements\
    \ is not n, but n-1.\n\nThe declaration of an array can be done in two equivalent\
    \ ways:\n`data_type[] array_name;`\n`data_type array_name[];` the first method\
    \ being the preferred one.\n\nThe instantiation of an array is done in this way:\n\
    `array_name = new data_type[size];` where the size of the array is the number\
    \ of elements stored in the array.\n\n# Câlin Galeriu Foundations of Java Programming\
    \ for the OOP Option of the IB CS Exam\n\nThe declaration and instantiation statements\
    \ can be combined into just one:\n`data_type[] array_name = new data_type[size];`\n\
    \nJava arrays have one very important field (property) called `length`. This is\
    \ an integer variable that holds the size of the array, which is the number of\
    \ elements stored in the array.\n\nThe next program, Java Example 42, demonstrates\
    \ the use of an array of integer elements.\n\n```java\n// Java Example 42\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int[] pi_digits;\
    \ // declaration\n        pi_digits = new int[5]; // instantiation\n        pi_digits[0]\
    \ = 3; // initialization\n        pi_digits[1] = 1;\n        pi_digits[2] = 4;\n\
    \        pi_digits[3] = 1;\n        pi_digits[4] = 6;\n        System.out.println(\"\
    The array has \" + pi_digits.length + \" elements.\");\n        System.out.print(\"\
    pi = \" + pi_digits[0] + \", \");\n        for(int i=1; i<=4; i++) System.out.print(pi_digits[i]);\n\
    \    }\n}\n```\n\nIf, at the moment an array is created, all the arrays are given\
    \ some known initial values, then there is an alternative shorter way to define,\
    \ instantiate, and initialize the array:\n`data_type[] array_name = {element0,\
    \ element1, element2, ... };` in this situation there is no need to use the new\
    \ keyword, or to specify the number of elements.\n\nThe next program, Java Example\
    \ 43, demonstrates the shorter way of creating an array of integer numbers, when\
    \ all the array elements have known initial values.\n\n```java\n// Java Example\
    \ 43\npublic class Main {\n    public static void main(String[] args) {\n    \
    \    int[] pi_digits = { 3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5 };\n        System.out.println(\"\
    The array has \" + pi_digits.length + \" elements.\");\n        System.out.print(\"\
    pi = \" + pi_digits[0] + \", \");\n        for(int i=1; i<=10; i=i+1) System.out.print(pi_digits[i]);\n\
    \    }\n}\n```\n"
