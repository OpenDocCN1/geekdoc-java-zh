- md: "\n# Călin Galeriu Foundations of Java Programming for the OOP Option of the\
    \ IB CS\n\n## 2. Why does the simplest Java program look so complicated?\n\nThe\
    \ HelloWorld program is, traditionally, the first program that someone new to\
    \ computer programming language learns. This is the simplest program in any programming\
    \ language. This short computer program is meant to decrease anxiety, build self-confidence,\
    \ and give the students a good start on a smooth learning path. But why does the\
    \ HelloWorld, the simplest Java program, look so complicated?\nThe answer to this\
    \ question is related to the historical evolution of computer programming languages.\n\
    \n## 2.1. The BASIC version of the HelloWorld program\n\nThe BASIC version of\
    \ the HelloWorld program looks like this:\n\n10 PRINT \"Hello World!\"\n\nA BASIC\
    \ program consists of a sequence of numbered instruction lines. The entry point\
    \ of a computer program is the first instruction that gets executed. The entry\
    \ point of a BASIC program is either the first line of-the program, or the line\
    \ number specified after the RUN command (when it is given).\n\n## 2.2. The C\
    \ version of the HelloWorld program\n\nThe C version of the HelloWorld program\
    \ looks like this:\n\n```c\n#include <stdio.h>\nvoid main() {\n    printf(\"Hello\
    \ World!\");\n}\n```\n\nInstead of PRINT, a simple BASIC command, we now have\
    \ printf(), a C function. The first line tells the C compiler will find the printf()\
    \ function in the stdio library. Presumably we could find a different printf()\
    \ function in a different library. This was not an option in BASIC, where PRINT\
    \ is a keyword, and where semicolon ; character is used at the end of the printf()\
    \ function.\n\nA C program consists of a series of declarations and definitions\
    \ of variables and functions, and also the instructions that use these variables\
    \ and functions. C programs do not have line numbers, that was a good idea only\
    \ when computer programs were very long. The entry point of a C program is the\
    \ main() function.\n\nIn our simple C program the main() function does not return\
    \ any value, therefore its output is of type void. This is not always the case,\
    \ in general the main() function can return an integer number of type int, which\
    \ then can be used by the operating system as an error code.\n\n# Călin Galeriu\
    \ Foundations of Java Programming for the OOP Option of the IB CS Exam\n\n## 2.3.\
    \ The Java version of the HelloWorld program\n\nThe Java version of the HelloWorld\
    \ program looks like this:\n\n```java\n// Java Example 1\npublic class Main\n\
    {\n    public static void main(String[] args)\n    {\n        System.out.println(\"\
    Hello World!\");\n    }\n}\n```\n\nThe first line, which starts with a double\
    \ slash, is just a comment line. In Java anything from a double slash until the\
    \ end on the line is a comment.\n\nIn contrast to the C program above, the main()\
    \ function has input argument String[] args function of the Java program is now\
    \ nested inside another structure, the definition of the public class Main. This\
    \ is because in Java everything is part of a class. A Java class is a template\
    \ for objects, the way cookie cutter is a template for cookies. A Java object\
    \ is a data structure that may contain variables, functions, other objects. The\
    \ class of an object is of the like type of variable. The class description defines\
    \ what variables (also called methods, attributes, or properties), functions (also\
    \ called methods), or other object of that class may have. In our example Main\
    \ class has only one function, the function named main(). The entry point of a\
    \ Java program is the main().\n\nWe notice that the main() function has input\
    \ String[] args which stands for an array of String objects. String objects are\
    \ used by Java programs to handle text strings. The HelloWorld program could also\
    \ be written with input arguments, like the Java program, but since the arguments\
    \ (command line parameters) are never used by our HelloWorld program, which would\
    \ be an unnecessary complication. In Java we have to include the input arguments,\
    \ regardless of whether we use them or not. Java program with command line parameters\
    \ are discussed in Chapter 14.\n\nThe keyword public means the Main class and\
    \ the main() function can exist from anywhere in the program. The keyword static\
    \ means that there is only one copy of the main() function, existing in Random\
    \ Access Memory (RAM) without the only need to create an object of class Main.\n\
    \nA semicolon character is needed at the end of the System.out.println(). A semicolon\
    \ is needed after every Java program.\n\nSystem.out is an object that manages\
    \ the output of alphanumeric characters on the PC monitor, and println() is a\
    \ function (a method) of the System.out object, used for printing alphanumeric\
    \ text one line at a time.\n\nIn summary, the Java program needs a main() function\
    \ because this is the entry point of the program. In Java the main() function\
    \ can exist only as a static method of a public class. The Java main() function\
    \ has to declare the input arguments (the command line parameters) String[] args\
    \ regardless of whether these input arguments are used by the Java program or\
    \ not.\n\n# Călin Galieru Foundations of Java Programming for the OOP Option of\
    \ the IB Exam\n\n## 3. Variables: primitive variable types, text strings, and\
    \ constants\n\nRemember that in mathematics a variable x is a placeholder for\
    \ a number. The number may be an unknown, like for example in the equation 2x\
    \ + 3 = 5, or the number may take different values, like for example in the slope-intercept\
    \ equation of a line y = 2x + 3.\n\nIn computer programming variables work in\
    \ the same way. Inside a computer the content (the value) of a variable is stored\
    \ in Random Access Memory (RAM), occupying a given amount of space at a given\
    \ memory address. In a general variable have:\n\n*   A name (the name of a storage\
    \ location), for example x.\n*   A type, for example int is a signed integer.\n\
    *   A value (the content of the storage location), or 505.\n*   An address in\
    \ RAM. We have no direct access to this information.\n*   A size in RAM. Java\
    \ variable of type is stored in RAM using 32 bits.\n*   A scope. The variable\
    \ varies, while the program is running, only in part of the code within the nearest\
    \ set of closed braces { }.\n\n**Warning!** A declaration statement gives the\
    \ type of a variable. Example: int x; an assignment statement gives the value\
    \ of a variable. Example: x = 505; in general the declaration of the type of a\
    \ variable must be done before the assignment of a value to that variable. An\
    \ initialization statement brings the declaration of a variable and the initial\
    \ assignment. Java has 8 primitive types. We call them primitive because they\
    \ come as a standard feature of the Java language, to distinguish them from user\
    \ defined types. The name, size and range of these 8 primitive types are listed\
    \ below:\n\n| Type | Size | Range |\n| :--- | :--- | :--- |\n| byte | 8-bit signed\
    \ integer | -128 ... 127 |\n| short | 16-bit signed integer | -32,768 ... 32,767\
    \ |\n| int | 32-bit signed integer | -2,147,483,648 ... 2,147,483,647 |\n| long\
    \ | 64-bit signed integer | -9,223,372,036,854,775,808 ... 9,223,372,036,854,775,807\
    \ |\n| float | 32-bit single precision floating number | ±3.402823 × 10⁻³⁸ ...\
    \ ±1.4023946 × 10⁴⁵ |\n| double | 64-bit double precision floating number | ±1.7976931348623157\
    \ × 10⁻³⁰⁸ ... ±4.940655842654 × 10³²⁴ |\n| char | 16-bit Unicode character |\
    \ 0 ... 65,535 |\n| boolean | - | true or false |\n\nVariables of type short and\
    \ float are not required for IB Computer science. Numerical values of type long\
    \ have to end in L, and numerical values of float have to end in F. Numerical\
    \ values of type double may end in D, this rule is optional. In scientific notation\
    \ are written using E, which stands for a power of 10. For example 3.4E5 stands\
    \ for 3.4×10⁵.\n\n# Călin Galerie Foundations of Java Programming for the OOP\
    \ Option of the IB CS\n\nCharacters can be entered between single quotes ('a'),\
    \ using the Unicode value in hexadecimal form ('f'), or as a special escape sequence\
    \ ('b' = backspace, '\\n' = newline, '\\t' = tab, '\\r' = carriage return, '\\\
    \\' = backslash, '\\'' = single quote, '\\\"' = double quote).\n\nThe next program,\
    \ Java Example 2, demonstrates the use of all Java primitive variable types.\n\
    \n```java\n// Java Example 2\npublic class Main\n    public static void main(String[]\
    \ args)\n    {\n        byte b = 100;\n        System.out.println(\"b = \" + b);\n\
    \        short i = 3000;\n        System.out.println(\"i = \" + i);\n        int\
    \ j = 40000;\n        System.out.println(\"j = \" + j);\n        long k = 5000000000L;\n\
    \        System.out.println(\"k = \" + k);\n        float x = 3.1416F;\n     \
    \   System.out.println(\"x = \" + x);\n        double y = 7.8E200;\n        System.out.println(\"\
    y = \" + y);\n        char c = 'a';\n        System.out.println(\"c = \" + c);\n\
    \        boolean a = true;\n        System.out.println(\"a = \" + a);\n    }\n\
    ```\n\nThe Java programming language, unlike more powerful languages like C and\
    \ C++, for this reason, Java is not a good choice when we need to perform intensive\
    \ computations using complex (imaginary) numbers.\n\nIn Java text strings are\
    \ not variables, but objects of type String. An object of type String is like\
    \ a primitive variable string packaged together with functions that act on text\
    \ strings.\n\n> A historical note: Objects have become an important part of the\
    \ C++ programming language when the Windows operating system has replaced MS DOS.\
    \ All of the applications running under Windows are objects. These objects share\
    \ the same kind of primitive variables (for example, the x and y pixel coordinates\
    \ of the corners of the rectangular shape) and the same kind of functions (for\
    \ example, what to do when use the clicks with the Minimize, Restore, and Close\
    \ buttons).\n\nHowever, because text strings are used often, in Java the declaration,\
    \ assignment, and initialization of String objects is simplified, and it looks\
    \ just like the declaration, assignment, and initialization of primitive variables.\
    \ In a text string the information is entered between double quotation marks.\n\
    \nPlease also note that in Java the plus symbol can be used as a concatenation\
    \ operator for String objects, merging (combining, adding) two or more text strings\
    \ together into just one text string. Example: \"abc\" + \"def\" = \"abcdef\"\n"
  mdcn: "\n\n# Călin Galeriu：IB 计算机科学 OOP 选项方向的 Java 编程基础\n\n## 2. 为什么最简单的 Java 程序看起来如此复杂？\n\
    \n按照传统，HelloWorld（你好世界）程序是计算机编程语言初学者学习的第一个程序。这是任何编程语言中是最简单的程序。这个简短的计算机程序旨在减轻焦虑、建立自信心，并让学生在平滑的学习路径上有一个良好的开始。但是，为什么\
    \ HelloWorld 这种最简单的 Java 程序看起来却如此复杂呢？\n这个问题的答案与计算机编程语言的历史演变有关。\n\n## 2.1. HelloWorld\
    \ 程序的 BASIC 版本\n\nHelloWorld 程序的 BASIC 版本看起来所示：\n\n10 PRINT \"Hello World!\"\n\
    \n一个 BASIC 程序由一系列带有行号的指令行组成。计算机程序的入口是第一个被执行的指令。BASIC 程序的入口可以是程序的第一行，也可以是 `RUN`\
    \ 命令后指定的行号（如果提供了行号的话）。\n\n## 2.2. HelloWorld 程序的 C 版本\n\nHelloWorld 程序的 C 版本看起来所示：\n\
    \n```c\n#include <stdio.h>\nvoid main() {\n    printf(\"Hello World!\");\n}\n\
    ```\n\n我们现在使用的不是简单的 BASIC 命令 `PRINT`，而是 `printf()`，这是一个 C 函数。第一行告诉 C 编译器将在 `stdio`\
    \ 库中寻找 `printf()` 函数。推测我们可能可以在不同的库中找到不同的 `printf()` 函数。这在 BASIC 中是不可能的，因为在 BASIC\
    \ 中 `PRINT` 是关键字，并且在 `printf()` 函数的末尾使用分号 `;`。\n\n一个 C 程序由一系列变量和函数的声明与定义，以及使用这些变量和函数的指令组成。C\
    \ 程序没有行号，行号只有在计算机程序非常长的时候才算是一个好主意。C 程序的入口是 `main()` 函数。\n\n在我们简单的 C 程序中，`main()`\
    \ 函数不返回任何值，因此它的输出类型是 `void`。情况并非总是如此，通常情况下，`main()` 函数可以返回一个 `int` 类型的整数，该整数可以被操作系统作为错误代码使用。\n\
    \n# Călin Galeriu：IB 计算机考试 OOP 选项方向的 Java 编程基础\n\n## 2.3. HelloWorld 程序的 Java\
    \ 版本\n\nHelloWorld 程序的 Java 版本看起来所示：\n\n```java\n// Java 示例 1\npublic class Main\n\
    {\n    public static void main(String[] args)\n    {\n        System.out.println(\"\
    Hello World!\");\n    }\n}\n```\n\n以双斜杠开头的第一行仅仅是一个注释行。在 Java 中，从双斜杠到行尾的所有内容都是注释。\n\
    \n与上面的 C 程序相比，Java 程序的 `main()` 函数具有输入参数 `String[] args` 函数，且它现在被嵌套在另一个结构内部，即\
    \ `public class Main` 的定义。这是因为在 Java 中，一切万物都是类的一部分。Java 类是对象的模板，正就像饼干模具是饼干的模板一样。Java\
    \ 对象是一个数据结构，它可能包含变量、函数和其他对象。对象的类类似于变量的类型。类描述定义了该类可能拥有的变量（也称为方法、属性或属性）、函数（也称为方法）或其他对象。在我们的示例中，`Main`\
    \ 类只有一个函数，即名为 `main()` 的函数。Java 程序的入口是 `main()`。\n\n我们注意到 `main()` 函数有输入 `String[]\
    \ args`，它代表 `String` 对象的数组。Java 程序使用 `String` 对象来处理文本字符串。HelloWorld 程序也可以像 Java\
    \ 程序一样带有输入参数来编写，但由于我们的 HelloWorld 程序从未使用这些参数（命令行参数），因此这会增加不必要的复杂性。在 Java 中，无论我们是否使用它们，必须包含输入参数。带有命令行参数的\
    \ Java 程序将在第 14 章中讨论。\n\n关键字 `public` 意味着 `Main` 类和 `main()` 函数可以从程序的任何地方存在。关键字\
    \ `static` 意味着 `main()` 函数只有一个副本，存在于随机存储器（RAM）中，而无需创建 `Main` 类的对象。\n\n`System.out.println()`\
    \ 的末尾需要一个分号。每个 Java 程序的末尾都需要分号。\n\n`System.out` 是一个管理 PC 监器上字母数字字符输出的对象，而 `println()`\
    \ 是 `System.out` 对象的一个函数（方法），用于逐行打印字母数字文本。\n\n总而言来说，Java 程序需要一个 `main()` 函数，因为这是程序的入口。在\
    \ Java 中，`main()` 函数只能作为公共类的静态（static）方法存在。Java `main()` 函数必须声明输入参数（命令行参数）`String[]\
    \ args`，无论 Java 程序是否使用这些输入参数。\n\n# Călin Galieru：IB 考试 OOP 选项方向的 Java 编程基础\n\n\
    ## 3. 变量：基本类型变量类型、文本字符串和常量\n\n记住在数学中，变量 $x$ 是数字的占位符。这个数字可能是一个未知，例如在方程 $2x + 3\
    \ = 5$ 中，或者数字可以取不同的值，例如在直线斜截方程 $y = 2x + 3$ 中。\n\n在计算机编程中，变量的工作原理相同。在计算机内部，变量的内容（值）存储在随机存储器（RAM）中，在指定的内存地址占用特定的空间。一个普通变量具有：\n\
    \n*   一个名称（存储位置的名称），例如 $x$。\n*   一个类型，例如 `int` 是一个有符号整数。\n*   一个值（存储位置的内容），例如\
    \ $505$。\n*   RAM 中的一个地址。我们无法直接访问此信息。\n*   RAM 中的大小。类型为 `int` 的 Java 变量使用 32 位存储在\
    \ RAM 中。\n*   一个作用域。变量在程序运行时，仅在最近的一组闭合括号 `{ }` 内部的代码部分发生变化。\n\n**警告！** 声明语句给出变量的类型。例如：`int\
    \ x;`。赋值语句给出变量的值。例如：`x = 505;`。通常情况下，变量类型的声明必须在给该变量赋值之前完成。初始化语句将变量声明和初始赋值结合。Java\
    \ 有 8 种基本类型。我们称它们为基本类型是因为它们作为 Java 语言的标准功能出现，以区别于用户定义的类型。这 8 种基本类型的名称、大小和范围列如下：\n\
    \n| 类型 | 大小 | 范围 |\n| :--- | :--- | :--- |\n| byte | 8 位有符号整数 | -128 ... 127 |\n\
    | short | 16 位有符号整数 | -32,768 ... 32,767 |\n| int | 32 位有符号整数 | -2,147,483,648\
    \ ... 2,147,483,647 |\n| long | 64 位有符号整数 | -9,223,372,036,854,775,808 ... 9,223,372,036,854,775,807\
    \ |\n| float | 32 位单精度浮点数 | ±1.401298E-45 ... ±3.4028235E38 |\n| double | 64 位双精度浮点数\
    \ | ±1.7976931348623157E-308 ... 1.7976931348623157E308 |\n| char | 16 位 Unicode\
    \ 字符 | 0 ... 65,535 |\n| boolean | | true 或 false |\n\n`long` 类型的数值必须以 `L` 结尾。`float`\
    \ 类型的数值以 `F` 结尾。`double` 类型的数值是可选的。科学计数法使用 `E` 表示 10 的幂，例如 $3.4 \\times 10^5$。\n\
    \n# Călin Galieru：IB 计算机科学 OOP 选项方向的 Java 编程基础\n\n字符可以使用单引号（`'a'`）、使用十六进制值（`0xf`）或作为特殊转义序列（例如：`\\\
    n` =换行、`\\t` = 制表符、`\\r` = 回车、`\\\\` =反斜杠、`\\'` =单引号、`\\\"` =双引号）。\n\n下一个程序 Java\
    \ 示例 2 展示了所有 Java 基本类型的使用。\n\n```java\n// Java 示例 2\npublic class Main\n    public\
    \ static void main(String[] args)\n    {\n        byte b = 100;\n        System.out.println(\"\
    b = \" + b);\n        short i = 3000;\n        System.out.println(\"i = \" + i);\n\
    \        int j = 40000;\n        System.out.println(\"j = \" + j);\n        long\
    \ k = 5000000000L;\n        System.out.println(\"k = \" + k);\n        float x\
    \ = 3.1416F;\n        System.out.println(\"x = \" + x);\n        double y = 7.8E200;\n\
    \        System.out.println(\"y = \" + y);\n        char c = 'a';\n        System.out.println(\"\
    c = \" + c);\n        boolean a = true;\n        System.out.println(\"a = \" +\
    \ a);\n    }\n```\n\n由于上述原因，与 C 和 C++ 等更强大的编程语言相比，当我们需要使用复数（复数/虚数）进行密集型计算时，Java\
    \ 并不是一个好的选择。\n\n在 Java 中，文本字符串不是变量，而是 `String` 类型的对象。`String` 类型的对象就像是包装了可以处理文本字符串的函数的原始变量。\n\
    \n> 历史说明：当 Windows 操作系统取代 MS DOS 时，对象成为 C++ 编程语言的重要部分。运行在 Windows 下的所有应用程序都是对象。这些对象共享相同的原始变量（例如，矩形状角落的\
    \ x 和 y 像素坐标）和相同的函数（例如，点击最小化、还原和关闭按钮时的操作）。\n\n然而，由于文本字符串被频繁使用，Java 将 `String`\
    \ 对象的声明、赋值和初始化简化了，使其看起来就像基本变量的声明、赋值和初始化一样。在文本字符串中，信息输入在双引号之间。\n\n请注意，在 Java 中，加号\
    \ `+` 可以作为 `String` 对象的连接运算符，将两个或多个文本字符串合并（组合、添加）成单个文本字符串。例如，“abc\" + \"def\"\
    \ = \"abcdef\"。\n\n]"
