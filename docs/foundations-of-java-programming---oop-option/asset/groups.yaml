    \ Java 编程基础：面向 IB CS\n\n### 19. 面向对象编程：多态性\n\n多态是面向对象编程的一项基本特性。在希腊语中，“polys” 意思是“多”或“许多”，而“orphe”\
    \ 意思是“形式”或“形状”。通常来说，多态指的是某个事物具有不同的形状、形式、行为等的情况。\n\n在 Java 中，多态描述了一个唯一的方法名与多个不同行为相关的情况。如果我们不是通过名称而是通过其方法体（代码）来识别方法，那么多态意味着我们可以拥有相同名称的不同方法。\n\
    \n多态有两种类型：编译时多态（由于方法重载引起）和运行时多态（由于方法重写引起）。\n\n### 19.1. 方法重载（编译时多态）\n\n同一个类中可以有两个或多个名称相同的方法，但输入参数类型或类型不同。每个方法都可以使用方法重载。Java\
    \ 在程序编译时会决定调用（使用）哪个方法，这取决于输入变量的数量或类型。函数的参数个数加上每个输入参数的类型（基本类型或类类型），被称为该函数的签名。\n\
    \n> **警告！** 应该记住，返回值类型不是函数签名的一部分。\n\n不仅方法可以表现出多态，算术运算符也可以。下一个程序 Java 示例 65 显示了方法重载的使用。\n\
    \n```java\n// Java 示例 65\npublic class Main {\n    public static void main(String[]\
