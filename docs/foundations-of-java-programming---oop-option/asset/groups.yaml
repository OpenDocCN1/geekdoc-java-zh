    \ compile time polymorphism (due to method overloading) and run time polymorphism\
    \ (due to method overriding).\n\n### 19.1. Method overloading (compile time polymorphism)\n\
    \nIn the same class can have two or more different methods with the same name,\
    \ but with different types or types of input parameters. Each can use method overloading.\
    \ Java decides which method to call (use) when the program is compiled, together\
