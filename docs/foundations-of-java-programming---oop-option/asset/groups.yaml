  - '[PAGE 20]


    # Călin Galileu Foundations of Java Programming for the OOP Option of the IB CS
    Exam 6. Control flow: conditional statements


    All the Java programs given as examples until now (Java examples from 1 to 11)
    have a very simple structure. During execution the program starts at the first
    instruction line of the main() function, and then executes in a sequence all the
    instruction lines of the main() function. After executing the last instruction
    line of the main() function, the program stops. Most computer programs need flexibility,
    they need execute or skip different segments of code depending on various conditions.
    To implement a behavior the Java language has the if, else, switch, and break
    keywords.


    For simplicity, the conditions tested in the next Java examples will be based
    on random numbers. int i = (int)(6*Math.random() + 1); to simulate the roll of
    a die. This is an integer expression that returns 1, 2, 3, 4, 5, or 6. There is
    more information about random numbers in Chapter 16.


    # 6.1. The IF structure


    The simplest if structure is:


    ```

    if (conditionA) instructionA;

    ```


    The instructionA will be executed only when the conditionA condition is true .
    Otherwise the program simply goes to the next instruction after the if structure.
    Although not mandatory, the instructionA could be placed inside curly braces.
    This is good programming practice, helping the readability and the future maintenance
    of your code.


    ```

    if (conditionA) { instructionA; }

    ```


    The curly braces become mandatory when more than one instruction have to be executed,
    as a block of instructions, when the conditionA condition is true.


    ```

    if (conditionA) { instructionA1; instructionA2; instructionA3; }

    ```


    The flowchart of if structure is:


    ![](img/f2c7aa28c73a4748dac938a1e583595e_20_0.png)


