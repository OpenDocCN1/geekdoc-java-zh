  - "[PAGE 75]\n\n# Călin Galieru Foundations of Java Programming for the OOP Option\
    \ of the IB CS\n19. Object-Oriented Programming: Polymorphism\n\nPolymorphism\
    \ is a fundamental feature of Object-Oriented Programming. In Greek \"polys\"\
    \ means\n\"many\" or \"much\" or \"orphe\" means \"form\" or \"shape\". In general\
    \ polymorphism refers to a\nsituation in which something has different shapes,\
    \ forms, behaviors, etc.\n\nIn Java polymorphism describes a situation where a\
    \ unique method name is associated with several\ndifferent behaviors. If we identify\
    \ a method not by name, but by its body (the code), then\npolymorphism means we\
    \ can have different methods with the same name.\n\nIn there are two types of\
    \ polymorphism: compile time polymorphism (due to method\noverloading) and run\
    \ time polymorphism (due to method overriding).\n\n# 19.1. Method overloading\
    \ (compile time polymorphism)\n\nIn the same class can have two or more different\
    \ methods with the same name, but with different\ntypes or types of input parameters.\
    \ Each can use method overloading. Java decides which method\nto call (use) when\
    \ the program is compiled, together with the number or the types of the input\
    \ variables.\nThe number of parameters of a function, together with the type (primitive\
    \ type or class\ntype) of each input parameters, is called the signature of the\
    \ function.\n\n> **Warning!** One should also remember that the type of the output\
    \ variable (return type of a function)\ncannot be used in Java to distinguish\
    \ between two functions (methods) with the same name and\nwith the same signature\
    \ (the number and the type of input parameters).\n\nNot only methods can show\
    \ polymorphism, arithmetic operators can also have polymorphic\nbehavior. The\
    \ \"+\" addition operator can add two numbers, or concatenate two text strings.\
    \ The \"/\ndivision operator can divide two real numbers (with no rounding of\
    \ the answer), or divide two integer\nnumbers (with the rounding down of the answer\
    \ to integer value).\n\nThe next program, Java Example 65, demonstrates the polymorphic\
    \ behavior of the division operator.\n\n```\n// Java Example 65\npublic class\
    \ Main\n{\n    public static void main(String[] args)\n    {\n        System.out.println(\"\
    12 / 5 = \" + 12/5); // output : 2\n        System.out.println(\"12.0 / 5.0 =\
    \ \" + 12.0/5.0); // output : 2.4\n    }\n}\n```\n\nThe next program, Java Example\
    \ 66, uses the vectorLength() method to calculate the length (the\nmitude) of\
    \ a vector. There are four different implementations of the method, all with the\
    \ same name,\nbut each with different numbers of input parameters. This is a case\
    \ of method overloading. We have a\nvectorLength() implementation for one dimensional\
    \ vectors, another one for two dimensional vectors,\nanother for three dimensional\
    \ vectors, and another for four dimensional vectors. The length of"
  - "[PAGE 76]\n\n# Foundations of Java Programming for the OOP Option of the IB CS\
    \ Exam\n\nCâlin Galeriu the vector is calculated using the Math.sqrt square root\
    \ function, available in Java as a static method of the Class. To optimize the\
    \ program, just for the one dimensional case, one could also use the Math.abs(x)\
    \ absolute value function instead of the Math.sqrt(x*x) square root function.\n\
    \n// Java Example 66\n\npublic class Main\n\n```\n{\n    public static void main(String[]\
    \ args) {\n        System.out.println(\" length of (-7) = \" + vectorLength(-7));\n\
    \        System.out.println(\" length of (3, 4) = \" + vectorLength(3, 4));\n\
    \        System.out.println(\" length of (3, 4, 12) = \" + vectorLength(3, 4,\
    \ 12));\n        System.out.println(\" length of (3, 4, 12, -17) = \" + vectorLength(3,\
    \ 4, 12, -17));\n    }\n\n    static double vectorLength(double x) {\n       \
    \ return Math.sqrt(x*x);\n    }\n\n    static double vectorLength(double x, double\
    \ y) {\n        return Math.sqrt(x*x + y*y);\n    }\n\n    static double vectorLength(double\
    \ x, double y, double z) {\n        return Math.sqrt(x*x + y*y + z*z);\n    }\n\
    \n    static double vectorLength(double x, double y, double z, double u) {\n \
    \       return Math.sqrt(x*x + y*y + z*z + u*u);\n    }\n}\n```\n\nThe next program,\
    \ Java Example 67, gives another example of method overloading. Here the sum function\
    \ can add 2 integers (of type int), 3 integers, or 2 real numbers (of type double).\
    \ The different implementations of the method have different number of input parameters\
    \ (2 or 3) or different types of input parameters (int or double).\n\nWhat happens\
    \ if we call the sum() with two non-matching input arguments, one integer and\
    \ one real number? Will the first or the third implementation be used, or will\
    \ we get an error message? Run the program and discover that in this case the\
    \ third implementation of the sum() is used. It turns a number of type int into\
    \ a number of double . This happens because there is no loss of precision when\
    \ an integer number is converted into a real number. The opposite is not true,\
    \ usually there is some rounding up or rounding down when a real number is converted\
    \ into an integer number."
