    \ removes the last object in the list.\n\nThe push(object) method pushes an object\
    \ onto a stack, that means it adds an object at the top of the list (the top of\
    \ the stack). A stack is a Last, First, Out LIFO list.\n\nThe pop() method pops\
    \ an object from the stack, that means it gets, and then it removes, the object\
    \ from the top of the list (the top of the stack). A stack is a Last, First, Out\
    \ list.\n\nThe peek() method peeks at the object onto the stack, that means it\
    \ gets, but it does not remove, the object from the top of the list (the top of\
    \ the stack). A stack is a FIFO list.\n\nFor all methods of the LinkedList class,\
