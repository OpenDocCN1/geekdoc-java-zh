  - "[PAGE 31]\n\n# Câlin Galeriu Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\n# 8. Functions: input and output values, formal and actual\
    \ parameters\n\nRemember that in mathematics a function f has a set of input values\
    \ (domain of the function, the set of all possible x values), a set of output\
    \ values (the range of the function, the set of all possible y), and a relationship\
    \ y = f(x) that provides a unique output y for every input x. In computer programming\
    \ functions work in the same way, with the mention that a function may not have\
    \ an input value, an output value, or both. In Java functions are called methods.\
    \ The main method used so for has an array of strings (String args) as the input\
    \ value, and nothing (void) as the output value. Notice how, in the declaration\
    \ of a function, the return type (the variable type of the output value) is written\
    \ in front of the name of function, while the names and types of input parameters\
    \ are written in round brackets after the name of that function.\n\nThe next program,\
    \ Java Example 25, demonstrates how to print \"Hello World!\" using a function\
    \ printGreeting() that has no input parameters (empty brackets ()) and no output\
    \ value (void).\n\n```\n// Java Example 25\npublic class Main\n{\n    public static\
    \ void main(String[] args)\n    {\n        printGreeting();\n    }\n\n    static\
    \ void printGreeting()\n    {\n        System.out.println(\"Hello World!\");\n\
    \    }\n}\n```\n\nThe next program, Java Example 26, demonstrates how to print\
    \ \"Hello World!\" using a function named printGreeting() that has one input parameter\
    \ ( an object of type String ) and no output value ( void ).\n\n```\n// Java Example\
    \ 26\npublic class Main\n{\n    public static void main(String[] args)\n    {\n\
    \        String greeting = \"Hello World!\";\n        printGreeting(greeting);\n\
    \    }\n\n    static void printGreeting(String text)\n    {\n        System.out.println(text);\n\
    \    }\n}\n```"
- md: "\n## Foundations of Java Programming for the OOP Option of the IB CS Exam\n\
    \nThe object named text shows up in the definition of the printGreeting() function\
    \ is called a formal parameter (a formal greeting). The object named greeting\
    \ shows up in the function call of printGreeting() function is called an actual\
    \ parameter (an actual argument). During execution of the printGreeting() function,\
    \ the value of greeting (the actual parameter) is assigned to text (the formal\
    \ parameter) inside the body of the printGreeting() function. It is possible to\
    \ give both the formal parameter and the actual parameter name, since these two\
    \ \"variables\" (text objects of class String) exist in different places (inside\
    \ the body of different functions). The greeting object (the actual parameter)\
    \ exists only inside the body of the main() function, while the text object (the\
    \ formal parameter) exists only inside the body of the printGreeting() function.\n\
    \nThe next program, Java Example 27, demonstrates how to print \"Hello World!\"\
    \ using a function greeting() with no parameters and an output value of String.\
    \ The output value of the function is given using the return. When the program\
    \ reaches a return it returns the text of the body of the function, and returns\
    \ the function's output value to the instruction that has called the function.\
    \ At that, inside the text = greeting();\n\n```java\n// Java Example 27\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        String text;\n\
    \        System.out.println(text);\n    }\n\n    static String greeting() {\n\
    \        return \"Hello World\";\n    }\n}\n```\n\nThe next program, Java Example\
    \ 28, demonstrates the use of a function named lazyStudent() (that does nothing)\
    \ with an input parameter of type String and an output value of type String.\n\
    \n```java\n// Java Example 28\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String x = \"Hello World\";\n        String y = lazyStudent(x);\n\
    \        System.out.println(y);\n    }\n\n    static String lazyStudent(String\
    \ z) {\n        return z;\n    }\n}\n```\n\nThe next program, Java Example 29,\
    \ demonstrates how to print \"Hello World!\" using a function named printGreeting()\
    \ that has two input parameters of type String and no output value. A shorter\
    \ version of the program could use the System.out.println(text1 + \" \" + text2);\n\
    \n```java\n// Java Example 29\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String word1 = \"Hello\";\n        String word2 = \"World\"\
    ;\n        printGreeting(word1, word2);\n    }\n\n    static void printGreeting(String\
    \ text1, String text2) {\n        String text = text1 + \" \" + text2;\n     \
    \   System.out.println(text);\n    }\n}\n```\n\nThe next program, Java Example\
    \ 30, demonstrates how to print \"Hello World!\" using a function named greeting()\
    \ that has two input parameters of type String and an output value of type String.\
    \ A shorter version of the program could use the System.out.println(greeting(word1,\
    \ word2)) and return text(text1 + \" \" + text2); An even shorter version of the\
    \ program could use the System.out.println(greeting(\"Hello\", \"World\"));\n\n\
    ```java\n// Java Example 30\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String word1 = \"Hello\";\n        String word2 = \"World\"\
    ;\n        String sentence = greeting(word1, word2);\n        System.out.println(sentence);\n\
    \    }\n\n    static String greeting(String text1, String text2) {\n        String\
    \ text = text1 + \" \" + text2;\n        return text;\n    }\n}\n```\n\n## 9.\
    \ Java objects: methods of the Math, String, and StringBuffer classes\n\nYou have\
    \ already used a method (function) of the Math class, the random() method that\
    \ returns a random number. This is a static method, does not require the creation\
    \ of an object. The name of the Math class is listed in front of the name of the\
    \ (random) static method, the two being connected by a dot. To call this we write\
    \ Math.random().\n\nYou have also used a method of the String class, the charAt()\
    \ method that returns the character found at a given location in a text string.\
    \ This method can be called only after a String object has been created (instantiated).\
    \ The name of the String object (for example, text) is listed in front of the\
    \ name of the charAt() method, the two being connected by a dot. To call this\
    \ method, we find the first character in the text string we write text.charAt().\n\
    \n### 9.1. Important methods and constants of the Math class: abs(), pow(), sin(),\
    \ cos(), round(), floor(), random(), PI, E\n\n- The abs() function returns the\
    \ absolute value of a number, |x|. The input value can be of type byte, short,\
    \ int, long, float, or double. The output value can be of same type as the input.\n\
    - The pow(x, y) function returns a power, x^y. The first input parameter x is\
    \ the base, and the second input parameter y is the exponent. The base and the\
    \ exponent can be of type byte, short, int, long, or double. The output value\
    \ is a floating point number of double.\n- The sin() function returns the sine\
    \ of angle x, which is in radians. The input value x is of type double, and the\
    \ output value is also of type double.\n- The cos(x) function returns the cosine\
    \ of angle x, which is given in radians. The input value x is of type double,\
    \ and the output value is also of type double.\n- The round() function returns\
    \ up or down a number x to its nearest integer value. When the input value x is\
    \ of type float, the output value is of type int. When the input value x is of\
    \ type double, the output value is of type long.\n- The floor()x function returns\
    \ the largest integer that is less than or equal to the input parameter x. The\
    \ input value x is of type float or double, and the output value is of type double.\n\
    - The random() function returns a random number between 0 and 1.\n- PI is a constant\
    \ representing the ratio of a circle's circumference to its diameter.\n- E is\
    \ a constant representing the base of natural logarithms.\n\n```java\n// Java\
    \ Example 31\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        double a = Math.PI;\n        double e = Math.E;\n        System.out.println(\"\
    pi = \" + a);\n        System.out.println(\"e = \" + e);\n        double abs =\
    \ Math.abs(-5);\n        System.out.println(\"absolute value of -5 = \" + abs);\n\
    \        double pow = Math.pow(5, 3);\n        System.out.println(\"5 to the power\
    \ of 3 = \" + pow);\n        double sin = Math.sin(a);\n        System.out.println(\"\
    sin of PI = \" + sin);\n        double cos = Math.cos(a);\n        System.out.println(\"\
    cos of PI = \" + cos);\n        double round = Math.round(7.2);\n        System.out.println(\"\
    round of 7.2 = \" + round);\n        double floor1 = Math.floor(7.7);\n      \
    \  System.out.println(\"floor of 7.7 = \" + floor1);\n        double floor2 =\
    \ Math.floor(-8.8);\n        System.out.println(\"floor of -8.8 = \" + floor2);\n\
    \        double random = Math.random();\n        System.out.println(\"random number\
    \ = \" + random);\n    }\n}\n```\n\n### 9.2. Important methods of the String class:\
    \ equals(), substring(), length(), charAt(), indexOf(), compareTo(), toLowerCase(),\
    \ toUpperCase(), format()\n\n- The equals(String text) method compares the text\
    \ of the instantiated String object, and returns true when the two strings are\
    \ identical, or false otherwise.\n> Warning! When two String objects are compared\
    \ using the == symbol, it is not the strings that are compared, but the addresses\
    \ in RAM (the references, pointers) of the two objects. This is also true for\
    \ other Java objects, not just objects of the String class.\n\n- The substring(int\
    \ startPos, int endPos) and substring(int startPos) methods return a part of the\
    \ original text (of the instantiated String object). The startPos gives the position\
    \ of the first alphanumeric character of the selected substring, and the endPos\
    \ gives the position of the first character after the selected substring. The\
    \ index of the first character is 0. The output value is of type String. When\
    \ the second argument is missing, the selected substring goes all the way to the\
    \ end of the original text.\n\n- The length() method returns the number of alphanumeric\
    \ characters in the text string (of the instantiated String object). The output\
    \ value is of type int.\n- The charAt(int index) method returns the character\
    \ at a given index in the text string.\n- The indexOf(String str) method returns\
    \ the index of the first occurrence of the specified substring, or -1 if it is\
    \ not found.\n- The compareTo(String str) method compares this String with another\
    \ String lexicographically and returns an integer.\n- The toLowerCase() and toUpperCase()\
    \ methods return a new String with all characters converted to lowercase or uppercase,\
    \ respectively.\n- The format(String format, Object... args) method returns a\
    \ formatted string using the specified format and arguments.\n"
  mdcn: "\n\n## IB CS 考试 OOP 选项 Java 编程基础\n\n在 `printGreeting()` 函数的定义中出现的名为 `text`\
    \ 的对象被称为形式参数（正式问候语）。在 `printGreeting()` 函数的调用中出现的名为 `greeting` 的对象被称为实际参数（实际参数）。在\
    \ `printGreeting()` 函数的执行期间，`greeting`（实际参数）的值被赋值给 `printGreeting()` 函数体内的 `text`（形式参数）。可以为形式参数和实际参数分别命名，因为这两个“变量”（`String`\
    \ 类的 `text` 对象）存在于不同的位置（不同函数的体内部）。`greeting` 对象（实际参数）只存在于 `main()` 函数的体内部，而 `text`\
    \ 对象（形式参数）只存在于 `printGreeting()` 函数的体内部。\n\n接下来的程序 Java 示例 27 演示了如何使用一个没有参数且输出值为\
    \ `String` 的函数 `greeting()` 来打印“Hello World!”。函数的输出值通过 `return` 给。当程序运行到 `return`\
    \ 时，它会返回函数体的文本，并将函数的输出值返回给调用该函数的指令。此时，在 `text = greeting();` 内部：\n\n```java\n\
    // Java Example 27\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String text;\n        System.out.println(text);\n    }\n\n\
    \    static String greeting() {\n        return \"Hello World\";\n    }\n}\n```\n\
    \n接下来的程序 Java 示例 28 演示了使用一个名为 `lazyStudent()` 的函数（不执行任何操作），该函数有一个类型为 `String`\
    \ 的输入参数和一个输出值为 `String`。\n\n```java\n// Java Example 28\npublic class Main {\n\
    \    public static void main(String[] args) {\n        String x = \"Hello World\"\
    ;\n        String y = lazyStudent(x);\n        System.out.println(y);\n    }\n\
    \n    static String lazyStudent(String z) {\n        return z;\n    }\n}\n```\n\
    \n接下来的程序 Java 示例 29 演示了如何使用一个名为 `printGreeting()` 的函数（该函数有两个 `String` 类型输入参数且没有输出值）来打印“Hello\
    \ World!”。较短版本的程序可以使用 `System.out.println(text1 + \" \" + text2);`。\n\n```java\n\
    // Java Example 29\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String word1 = \"Hello\";\n        String word2 = \"World\"\
    ;\n        printGreeting(word1, word2);\n    }\n\n    static void printGreeting(String\
    \ text1, String text2) {\n        String text = text1 + \" \" + text2;\n     \
    \   System.out.println(text);\n    }\n}\n```\n\n接下来的程序 Java 示例 30 演示了如何使用一个名为\
    \ `greeting()` 的函数（该函数有两个 `String` 类型输入参数且输出值为 `String`）来打印“Hello World!”。较短版本的程序可以使用\
    \ `System.out.println(greeting(word1, word2))` 并返回 `text(text1 + \" \" + text2)`。更短版本的程序可以使用\
    \ `System.out.println(greeting(\"Hello\", \"World\"))`。\n\n```java\n// Java Example\
    \ 30\npublic class Main {\n    public static void main(String[] args) {\n    \
    \    String word1 = \"Hello\";\n        String word2 = \"World\";\n        String\
    \ sentence = greeting(word1, word2);\n        System.out.println(sentence);\n\
    \    }\n\n    static String greeting(String text1, String text2) {\n        String\
    \ text = text1 + \" \" + text2;\n        return text;\n    }\n}\n```\n\n## 9.\
    \ Java 对象：Math、String 和 StringBuffer 类的方法\n\n你之前已经使用过 `Math` 类的一个方法（函数），即返回随机数的\
    \ `random()` 方法。这是一个静态方法，不需要创建对象。`Math` 类的名称列在 `(random)` 静态方法名称之前，两者通过一个点 `.`\
    \ 连接。要调用它，我们编写 `Math.random()`。\n\n你还使用过 `String` 类的一个方法，即 `charAt()` 方法，它返回文本字符串中指定位置的字符。该方法只有在\
    \ `String` 对象被创建（实例化）后才能被调用。`String` 对象名称（例如 `text`）列在 `charAt()` 方法名称之前，两者通过一个点\
    \ `.` 连接。要调用此方法，当我们在文本字符串中找到第一个字符，我们编写 `text.charAt()`。\n\n### 9.1. Math 类的重要方法和常量：abs(),\
    \ pow(), sin(), cos(), round(), floor(), random(), PI, E\n\n- `abs()` 函数返回数字的绝对值\
    \ $|x|$。输入值可以是 `byte`、`short`、`int`、`long`、`float` 或 `double` 类型。输出值可以与输入值的类型相同。\n\
    - `pow(x, y)` 函数返回幂 $x^y$。第一个输入参数 $x$ 是底，第二个输入参数 $y$ 是指数。底和指数可以是 `byte`、`short`、`int`、`long`\
    \ 或 `double` 类型。输出值为 `double` 类型浮点数。\n- `sin()` 函数返回角度 $x$ 的正弦（以弧度为单位）。输入值 $x$\
    \ 是 `double` 类型，输出值也是 `double` 类型。\n- `cos(x)` 函数返回角度 $x$ 的余弦（以弧度给出）。输入值 $x$ 是\
    \ `double` 类型，输出值也是 `double` 类型。\n- `round()` 函数返回最近 $x$ 的整数。\n- `floor()` 函数返回小于等于\
    \ $x$ 的最大整数。\n- `random()` 函数返回 0 到 1 之间的随机数。\n- `PI` 是圆周长与直径比的常量。\n- `E` 是自然对数的底常量。\n\
    \n```java\n// Java Example 31\npublic class Main {\n    public static void main(String[]\
