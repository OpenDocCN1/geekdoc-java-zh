  mdcn: "\n\n## IB 考试 OOP 选项 Java 编程基础\n\n下一个程序 Java Example 51 演示了按值传递（call by value）的工作原理。`main()`\
    \ 函数内部名为 `greeting` 的 String 对象不会被 `printGreeting()` 函数中的 `greeting = \"Hello\
    \ Universe!\";` 这一行改变。\n\n```java\n// Java Example 51\npublic class Main {\n \
    \   public static void main(String[] args) {\n        String greeting = \"Hello\
    \ World!\";\n        printGreeting(greeting); // output : Hello World!\n     \
    \   printGreeting(greeting); // output : Hello World!\n    }\n\n    static void\
    \ printGreeting(String greeting) {\n        System.out.println(greeting);\n  \
    \      greeting = \"Hello Universe!\";\n    }\n}\n```\n\n> 在 Java 中，对象（非 String\
    \ 类对象）和数组总是通过引用传递（call by reference）传递给函数。\n\n下一个程序 Java Example 52 演示了引用传递（call\
    \ by reference）的工作原理。名为 `myArray` 的整数数组通过引用传递传递给 `addOneHundred()` 函数。结果是存储在 `myArray[2]`\
    \ 中的整数变量发生了变化。事实上，`myArray` 中所有元素的值都增加了一百。\n\n```java\n// Java Example 52\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int[] myArray\
    \ = { 10, 20, 30, 40, 50 };\n        System.out.println(\"before the function\
    \ call: \" + myArray[2]); // output : 30\n        addOneHundred(myArray);\n  \
    \      System.out.println(\"after the function call: \" + myArray[2]); // output\
    \ : 130\n    }\n\n    public static void addOneHundred(int[] z) {\n        int\
    \ n = z.length;\n        for(int i = 0; i < n; i = i + 1) z[i] = z[i] + 100;\n\
    \    }\n}\n```\n\n## IB CS 考试 OOP 选项 Java 编程基础\n\n下一个程序 Java Example 53 演示了引用传递（call\
    \ by reference）的工作原理。类型为（类）MyNumber 的对象 `x` 通过引用传递传递给 `addOneHundred()` 函数。结果是存储在\
    \ `x.number` 中的整数变量的值发生了变化。\n\n```java\n// Java Example 53\npublic class Main\
    \ {\n    public static void main(String[] args) {\n        MyNumber x = new MyNumber(300);\n\
    \        System.out.println(\"before the call : \" + x.number); // output : 300\n\
    \        addOneHundred(x);\n        System.out.println(\"after the call : \" +\
    \ x.number); // output : 400\n    }\n\n    public static void addOneHundred(MyNumber\
    \ z) {\n        z.number = z.number + 100;\n    }\n}\n\nclass MyNumber {\n   \
    \ int number;\n    public MyNumber(int y) // the constructor {\n        number\
    \ = y;\n    }\n}\n```\n\n引用传递调用函数是一种强大的编程技术。它允许我们对这类问题给出肯回答：“输入变量也可以作为输出变量使用吗？”“函数可以返回多个输出参数吗？”能力越大，责任越大。这种方法很容易出错，结果导致本应保持不变的输入变量值发生了变化。出于这个原因，Java\
    \ 程序员无法直接访问对象或数组的实际内存。相反，对象或数组名称代替了 RAM 中对象或数组的名称（指针）。虽然在 C 和 C++ 中，程序员可以使用 `&`\
    \ 运算符找到变量在内存中的地址，但在 Java 中是不行的。虽然在 C 和 C++ 中，可以使用 `*` 运算符修改内存位置的内容，但在 Java 中也是不行的。Java\
    \ 中没有指针。从这个角度来看，Java 是一种更安全的语言，但没有其他可以无限制访问 RAM 中任何内容的编程语言强大。\n\n## IB 考试 OOP\
    \ 选项 Java 编程基础\n\n### 14. 带命令行参数的 Java 程序\n\n带有命令行参数的程序在命令提示符窗口中执行。请复第一章运行 HelloWorld\
    \ 程序的三个选项第 1.4 节，命令行界面选项（jav.exe 和 java.exe）。那个程序 `HelloWorld.java` 没有使用任何命令行参数。现在你将输入、编译并运行一个名为\
    \ `MyNames.java` 的新程序，它将人的名字（一个、两个或多个）作为命令行输入。\n\n- 步骤 1。进入你在第 1 章中创建的 `C:\\JavaPrograms`\
    \ 文件夹。\n- 步骤 2。在 `JavaPrograms` 文件夹内部创建一个新文件。鼠标右键点击，选择“新建文本文档”。将文件名从 `New TextDocument`\
    \ 改为 `MyNames.java`。计算机会给出一个你应该忽略的消息。\n\n> **警告！** 有时你看不到文件扩展名，导致无法将其从 `.txt`\
    \ 改为 `.java`。要使扩展名可见，你应该查找文件夹选项”（Windows 8）或“查看选项”（Windows 10），然后取消勾选“隐藏已知类型的扩展名”。\n\
    \n- 步骤 3。使用记事本输入 `MyNames.java` 源文件（下一页列出的 Java Example 54 程序），然后保存文件并关闭记事本。\n\
    \n此时你将把 `main()` 方法的输入参数 `String[]` 识别为 String 对象数组。这个字符串数组包含了所有的参数。我们可以通过检查该数组的\
    \ `args.length` 属性找到命令行参数的数量。命令行参数如果存在，则通过 `args[0]`、`args[1]` 等进行访问。\n\n- 步骤\
    \ 4。打开命令提示符窗口。如果需要查找，请搜索“命令提示符”。\n- 步骤 5a。输入 `cd C:\\JavaPrograms`<回>`。这将命令提示符移动到\
    \ `JavaPrograms` 目录，使其成为当前目录。\n- 步骤 5b。输入 `dir`<回>`。这将显示当前目录下的所有文件和文件夹。你应该看到 `MyNames.java`\
    \ 源文件。\n- 步骤 5c。输入 `set path=C:\\Program Files\\java\\jdk1.8.0_111\\bin`<回>`（无空格）。这将告诉编译器寻找\
    \ `javac` 和 `java` 可执行文件。\n\n- 步骤 5d。输入 `javac MyNames.java`<回>`。这将源文件编译为字节码。\n\
    - 步骤 5e。输入 `java MyNames`<回>`。这将运行程序。\n- 步骤 5f。输入 `java MyNames`<回>`。这将显示输出。\n\
    - 步骤 5g。输入 `java MyNames`<回>`。这将再次运行程序。\n\n"
