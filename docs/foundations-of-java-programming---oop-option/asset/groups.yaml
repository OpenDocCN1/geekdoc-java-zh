    \ 20));\n        System.out.println(vectorLength(10, 20, 30));\n    }\n\n    static\
    \ double vectorLength(int x) {\n        return Math.sqrt(x*x);\n    }\n\n    static\
    \ double vectorLength(int x, int y) {\n        return Math.sqrt(x*x + y*y);\n\
    \    }\n\n    static double vectorLength(int x, int y, int z) {\n        return\
