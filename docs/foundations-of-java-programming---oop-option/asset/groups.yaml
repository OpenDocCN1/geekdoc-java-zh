    \ Java 执行垃圾回收时，该对象将很快从内存内存中消失。\n\n## 10.2 从不同的类或对象访问类或对象的成员\n\n接下来的程序（Java Example\
    \ 34）使用 Java 对象的定义方法打印“Hello World!”消息。`MyHello` 类的 Java  greeting 对象有一个默认构造函数、另一个名为\
    \ `printGreeting()` 的函数，以及一个名为 `myText` 的文本字符串（字段变量）。该 Java 程序演示了如何从另一个实例化对象或静态方法访问给定实例化对象的变量、函数和对象。我们通过在所需的变量、函数或对象前面写上实例化对象的名称和一个点（`.`）来实现。例如，在\
    \ `main()` 方法体内部，我们使用了 `greeting.myText` 和 `greeting.printGreeting()` 表达式。\n\n\
    ```java\n// Java Example 34\npublic class Main\n{\n    public static void main(String[]\
    \ args)\n    {\n        MyHello greeting;\n        greeting = new MyHello();\n\
    \        greeting.myText = \"Hello World!\";\n        greeting.printGreeting();\n\
    \    }\n}\nclass MyHello\n{\n    String myText;\n    public void printGreeting()\n\
    \    {\n        System.out.println(myText);\n    }\n}\n```\n\n我们可以在从不实例化 `MyHello`\
    \ 类型对象的情况下打印“Hello World!”消息吗？可以，但在这种情况下，`MyHello` 类的 `myText` 对象和 `printGreeting()`\
    \ 函数需要声明为 `static`。类的静态成员只存在一个副本，即使没有实例化该类的对象。\n\nCălin Galeriu IB 计算机考试 OOP 选项\
    \ Java 编程基础\n\n接下来的程序（Java Example 35）演示了如何从另一个实例化对象或静态方法访问给定类的静态变量、函数和对象。我们通过在所需的静态变量、函数或对象前面写上类的名称和一个点来实现。例如，在\
    \ `main()` 方法体内部，我们使用了 `MyHello.myText` 和 `MyHello.printGreeting()` 表达式。\n\n```java\n\
    // Java Example 35\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        MyHello.myText = \"Hello World!\";\n        MyHello.printGreeting();\n\
    \    }\n}\n\nclass MyHello {\n    static String myText;\n    public static void\
    \ printGreeting() {\n        System.out.println(myText);\n    }\n}\n```\n\n##\
    \ 10.3. 封装\n\n在许多情况下，我们不希望其他类的静态方法或其他其它实例化对象的方法直接访问给定实例化对象的变量、方法或对象。在这样的情况下，我们在这些受保护的变量、方法或对象前面使用\
    \ `private` 关键字。这是一个重要的面向对象编程（OOP）特性，称为封装。\n\nCălin Galeriu IB 计算机考试 OOP 选项 Java\
    \ 编程基础\n\n接下来的程序（Java Example 36）演示了如何使用构造函数的输入参数来初始化新创建对象的私有（`private`）字段变量。在这个例子中，只有一个这样的私有字段变量，即名为\
