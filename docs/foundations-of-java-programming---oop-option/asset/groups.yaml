  - "[PAGE 62]\n\n# Câlin Galerieu Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\nThe isEmpty() method returns true when the list is empty,\
    \ otherwise it returns false.\n\nThe addFirst(object) method adds an object at\
