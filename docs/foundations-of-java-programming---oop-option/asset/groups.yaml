    The text file is read byte at a time, revealing the fact that the text was encoded
    using ASCII (American Standard Code for Information Interchange). text_file_1.txt
    was saved this way in Notepad. For each byte in the file, the program will print
    the file pointer (index) of that byte, the numerical value of that byte (ASCII
    code), and the ASCII alphanumeric character corresponding to that. The output
    from the program should look like this:


    ```

    run:

    The file length is : 99

    0 102 f

    1 105 i

    2 114 r


    97 120 x

    98 116 t

    99 -1 D

    Text file read successfully.

    BUILD SUCCESSFUL (total time: 0 seconds)

    ```


    For a computer running the Windows operating system, the End Of Line (EOL) consists
    of a pair of characters: Carriage Return (CR, \r, ASCII 13) and Line Feed (LF,
    \n, ASCII 10). For a computer running UNIX the EOL code is just LF, for a Macintosh
    the E code is just CR. The End Of file (EOF, is no ASCII code for it) is a negative
    number. The read() method returns -1 when it reads the EOL code, and this is printed
    out by the program. The length of the file, as reported by the length() method,
    excludes the byte by the EOL code.


    Open the text_file_1.txt file in Notepad, and save it (File | Save As...) using
    other encodings : Unicode , Unicode big endian , UTF-8. Run the Java Example 75
    program again, to see the differences between the different encodings. A Unicode
    character takes two bytes. For the English alphabet one byte is the ASCII code
    and the other is 0. For Unicode encoding the second byte is 0, but for Unicode
    big endian the first byte is 0 . For the English alphabet the UTF-8 byte is 0
    like ASCII, it was designed like this in order to save space on the hard disk.


