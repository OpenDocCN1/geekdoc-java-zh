  - "[PAGE 66]\n\n# Câlin Galeriu Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\nHow do random number generators work? The computer cannot\
    \ roll a die in order to get a truly random number. The truth is that the \"random\"\
    \ numbers produced by the computer are not truly random, they only look like random\
    \ numbers to an unsuspecting eye. We call them pseudorandom numbers. To generate\
    \ these pseudonymous numbers the computer starts with a given number, called the\
    \ seed, and then it applies an algorithm to get the next number in the series.\
    \ Often the first seed is just the system time in milliseconds or a part of it.\n\
    \nIn Java system the time in milliseconds is returned by the System.currentTimeMillis()\
    \ method.\n\n# 16.3. The shuffle() method of the Java Collections class\n\nAnother\
    \ way of introducing randomness into a Java program is to shuffle a collection\
    \ of objects. This operation is similar to the shuffling of a deck of playing\
    \ cards. The shuffle() method belongs to the Collections class, which has a static\
    \ methods for storing and manipulating groups of objects. The objects in the collection,\
    \ like the playing cards in the deck, end up in random positions. The methods\
    \ of the Collections can be called on ArrayList or LinkedList lists.\n\nThe next\
    \ program, Java Example 60, shuffles a set of 10 integer numbers.\n\n```\n// Java\
    \ Example 60\nimport java.util.ArrayList;\nimport java.util.Collections;\n\npublic\
    \ class Main\n{\n    public static void main(String[] args)\n    {\n        int\
    \ N = 10; // the number of elements in the list\n        ArrayList<Integer> myList\
    \ = new ArrayList<Integer>();\n        for(int i=0; i<N; i+1) myList.add(i);\n\
    \        System.out.println(\"myList before shuffle:\");\n        for(int i=0;\
    \ i<N; i+1) System.out.println(myList.get(i));\n        Collections.shuffle(myList);\n\
    \        System.out.println(\"myList after shuffle:\");\n        for(int i=0;\
    \ i<N; i+1) System.out.println(myList.get(i));\n    }\n}\n```\n\nIt is important\
    \ to note that the myList.add() instruction does not add to the collection primitive\
    \ variable of type int, but instead adds to an object of type Integer. The Integer\
    \ class is one of the so wrapper classes. The Java wrapper classes transform primitives\
    \ into objects. These objects have just one field variable, the primitive variable\
    \ we start with, together with some related methods. For example, an object of\
    \ Integer has just one field variable, a primitive variable of type long , packaged\
    \ with some helpful methods."
