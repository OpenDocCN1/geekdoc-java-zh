    \ Java Example 20\npublic class Main\n{\n    public static void main(String[]\
    \ args)\n    {\n        for(int i = 0; i <= 9; i = i + 1) {\n            for(int\
    \ j = 0; j <= 9; j = j + 1) {\n                System.out.print(i + \" \" + j\
    \ + \" \");\n            }\n            System.out.println(\"\"); // new line\n\
    \        }\n    }\n}\n```\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_28_0.png)\n\
    \n# 7.2. The WHILE and the DO...WHILE loops\n\nIn some situations we don't know\
    \ how many times the loop of code has to be repeated. For example, a program reads\
    \ text from a text file, without knowing how many lines of text the actual file\
    \ has. For such situations we can use while or do ... while loops. The loop condition,\
    \ for these loops, may or not be related to a counter.\n\nThe structure of a while\
    \ loop is:\n\n```\nwhile(loop_condition) { instructions };\n```\n\nThe structure\
    \ of a do ... while loop is:\n\n```\ndo { instructions }; while(loop_condition);\n\
    ```\n\nThe while loop checks the loop condition before the execution of the code.\
    \ In some situations the code inside the while loop is never executed. The do\
    \ .. while loop checks the loop condition after the execution of the code. The\
    \ code inside the .. while loop is always executed at least once."
