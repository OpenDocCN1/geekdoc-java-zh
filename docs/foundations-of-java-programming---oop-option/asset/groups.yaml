    \ the elements in myArray go up by hundred.\n\n```java\n// Java Example 52\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int[] myArray\
    \ = { 10, 20, 30, 40, 50 };\n        System.out.println(\"before the function\
    \ call: \" + myArray[2]); // output : 30\n        addOneHundred(myArray);\n  \
    \      System.out.println(\"after the function call: \" + myArray[2]); // output\
    \ : 130\n    }\n\n    public static void addOneHundred(int[] z) {\n        int\
    \ n = z.length;\n        for(int i = 0; i < n; i = i + 1) z[i] = z[i] + 100;\n\
    \    }\n}\n```\n\n## Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\nThe next program, Java Example 53, demonstrates how a call by\
    \ reference works. The object named x of type (class) MyNumber is given to the\
    \ addOneHundred() function using a call by reference. As a result value of the\
    \ integer variable stored in x.number changes.\n\n```java\n// Java Example 53\n\
    public class Main {\n    public static void main(String[] args) {\n        MyNumber\
    \ x = new MyNumber(300);\n        System.out.println(\"before the call : \" +\
    \ x.number); // output : 300\n        addOneHundred(x);\n        System.out.println(\"\
    after the call : \" + x.number); // output : 400\n    }\n\n    public static void\
    \ addOneHundred(MyNumber z) {\n        z.number = z.number + 100;\n    }\n}\n\n\
    class MyNumber {\n    int number;\n    public MyNumber(int y) // the constructor\
    \ {\n        number = y;\n    }\n}\n```\n\nCalling a function using a call by\
    \ reference is a powerful programming technique. It allows us to give a positive\
    \ answer to questions like: \"Can an input variable also be used as an output\
    \ variable?\" \"Can a function return more than one output parameter?\" With this\
    \ great power, comes great responsibility. It is very easy to make a mistake,\
    \ and as a result, the value of an input variable that was meant to stay the same.\
    \ For this reason the Java programmer does not have direct access to the actual\
    \ memory of an object or array. Instead, the name of the object or array substitutes\
    \ for the name in RAM (the pointer) of object or array. While, in C and C++ the\
    \ programmer can find the address in memory of a variable, using the & operator,\
    \ this is not possible in Java. While, in C and C++ the content of a location\
    \ in memory can be modified using the * operator, this is not possible in Java.\
    \ In Java there are no pointers. From this point of view Java is a safer language,\
    \ but not as powerful as other programming languages that provide unrestricted\
    \ access to anything in RAM.\n\n## Foundations of Java Programming for the OOP\
