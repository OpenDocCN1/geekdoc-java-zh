    \        double random = Math.random();\n        System.out.println(\"random number\
    \ = \" + random);\n    }\n}\n```\n\n### 9.2. String 类的重要方法：equals(), substring(),\
    \ length(), charAt(), indexOf(), compareTo(), toLowerCase(), toUpperCase(), format()\n\
    \n- `equals(String text)` 方法比较实例化 String 对象的文本，当两个字符串相同时返回 `true`，否则返回 `false`。\n\
    > 警告！使用 `==` 符号比较两个 String 对象时，比较的不是字符串，而是对象在内存中的地址（引用、指针）。这适用于所有 Java 对象，不仅仅是\
    \ `String` 类。\n\n- `substring(int startPos, int endPos)` 和 `substring(int startPos)`\
