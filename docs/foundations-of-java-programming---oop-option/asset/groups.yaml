    \ 对象之间可以使用减法运算符\"-\"\"-\" 吗？\n\n## IB 计算机考试 OOP 选项 Java 编程基础\n\n## 9.3. String\
    \ 类的重要方法：`equals()`、`substring()`、`length()`、`charAt()`、`indexOf()`、`compareTo()`\n\
    \n`StringBuffer` 类比 String 类更强大。它是为了经常变化的文本字符串而设计的。String 类对象是不可变的，这意味着当修改旧 String\
    \ 对象时，程序必须将新 String 放置在 RAM 中的新位置，而未修改的旧 String 对象保留在 RAM 中的原有位置。当 StringBuffer\
    \ 对象被修改时，它们保留在 RAM 中的相同位置。这提高了程序的运行速度，并减少了计算机内存的占用。\n\n> 警告！与有快捷方式的 String 对象不同，StringBuffer\
    \ 对象必须使用 `new` 关键字和 `StringBuffer()` 构造函数创建。\n\n注意实例化 String 和 StringBuffer 对象时的区别：\n\
    `String fruit = \"banana\";` 使用快捷方式，而 `StringBuffer fruit = new StringBuffer(\"\
    banana\");` 则没有。\n\n非常重要的是，尽管与给定 StringBuffer 类对象关联的 String 没有被列为输入参数，但它被传递给每个\
    \ StringBuffer 类方法。这些方法需要一个实例化的 StringBuffer 对象。实例化 StringBuffer 对象的名称放在 String\
    \ 类名称之前，两者用点 `.` 分隔。\n\n`equals(StringBuffer text)` 方法将实例化 StringBuffer 对象的字符串与文本对象的文本进行比较，当两个字符串相同时返回\
    \ `true`，否则返回 `false`。输出值类型为 `boolean`。\n\n> 警告！不要使用 `==` 符号来比较存储在 StringBuffer\
    \ 对象中的字符串！\n\n`substring(startPos, endPos)` 方法返回原始字符串（实例化的 StringBuffer 对象）的一部分。`startPos`\
    \ 索引给出所选子字符串第一个字母数字字符的位置，`endPos` 索引给出所选子字符串之后第一个字符的位置。输出值类型为 `String`。\n\n`length()`\
    \ 方法返回文本（实例化的 StringBuffer 对象）中字母数字字符的数量。输出值类型为 `int`。\n\n`charAt(i)` 方法返回文本字符串（实例化的\
    \ String 对象）中索引为 `i` 的位置的字符。第一个字符的索引为 0。输出值类型为 `char`。\n\n`indexOf(String text)`\
    \ 方法返回在实例化 String 对象的文本中找到字符或文本子字符串的第一个位置。如果没有找到匹配项，该方法返回 -1。输出值类型为 `int`。\n\n\
    `compareTo(String text)` 方法逐个字母比较两个文本字母，如果两个字符串相同，则从第一个字母开始比较，方法返回 0。否则，当第一次比较的字母数字字符不相同时返回它们的\
    \ Unicode 值的差值。`text` 的值是从实例化 String 对象的 Unicode 值中提取的。输出值类型为 `int`。\n\n还有其他有用的\
    \ StringBuffer 方法，IB 计算机科学考试不需要：`append()`、`delete()`、`insert()`、`replace()`。有关\
    \ StringBuffer 类所有方法的列表，请访问：\n\nwww.tutorialspoint.com/java/java_buffer.htm\n\n\
    ## IB 计算机 Java 编程基础\n\n## 10. Java 对象：面向对象编程简介\n\n### 10.1. 构造函数\n\n类中一个非常重要的方法（函数）是构造函数。每当创建类的对象时，构造函数就会被调用，并使用\
