  - "[PAGE 30]\n\n# Călin Galileiu Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\nBut beware of the infinite loop! For example, in Java Examples\
    \ 21 and 22, if the programmer writes to have the i = i++; line that changes the\
    \ counter, the loop condition will always be true; the code inside the loop will\
    \ be repeated forever, and the program will get stuck in place. As a general rule,\
    \ while and do while loops must always have a line of code that, eventually, change\
    \ the boolean value of the loop condition to false.\n\n> The programmer got stuck\
    \ in the shower because the instructions on the shampoo bottle said: Lather, Rinse,\
    \ Repeat.\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_30_0.png)\n\nThe next program,\
    \ Java Example 23, demonstrates a while loop without a counter. The program prints\
    \ integer random numbers, until we get a 6. The last number, the 6 is not printed.\
    \ Please notice that we have to roll the die inside the while loop, but also before\
    \ it, once.\n\n```\n// Java Example 23\npublic class Main\n{\n    public static\
    \ void main(String[] args)\n    {\n        int i = (int)(6*Math.random() + 1);\
    \ // roll of the die\n        while(i != 6) // check the loop condition\n    \
    \    {\n            System.out.println(\"i = \" + i);\n            i = (int)(6*Math.random()\
    \ + 1); // change the value of the loop condition\n        }\n    }\n}\n```\n\n\
    The next program, Java Example 24, demonstrates a do while loop without a counter.\
