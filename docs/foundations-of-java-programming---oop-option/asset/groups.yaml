    \ because the file on the hard disk is accessed for each reading operation, and\
    \ this is a relatively slow process. To improve performance the BufferedReader\
    \ object uses an input buffer (in space of RAM). In addition to the int read()\
    \ methods, the BufferedReader class has a String readLine() method which returns\
    \ the line of text. This function will read a line of text from a stream of characters.\
    \ When there are no more lines to read from a text file, the return value is null.\
    \ The void close() will close the source (the stream) of alphanumeric information\
