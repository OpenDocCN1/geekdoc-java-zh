  - "[PAGE 63]\n\n# Foundations of Java Programming for the OOP Option of the IB Exam\n\
    15.5. Pseudocode methods for collections\n\nThe IB booklet \"Pseudocode in Examinations\"\
    \ mentions the names of some pseudocode methods used with collections of elements\
    \ :\n\nThe addItem() method adds an item (variable, text string, or object) to\
    \ the collection. Presumably the item is added at the end of the list.\n\nThe\
    \ getNext() method gets the next item without removing it from the collection.\
    \ This method, the first time it is called, will return the first item in the\
    \ collection. Presumably this method uses an index (integer number) to keep track\
    \ of the item in focus, same as a cursor under a letter that lets in focus. After\
    \ each call, the getNext() method increments the index.\n\nThe resetNext() method\
    \ resets the index to its smallest value, bringing the first item in the collection\
    \ in focus.\n\nThe hasNext() method returns true if the index is in the allowed\
    \ range, which means the getNext() method would read a valid element when called.\
    \ Otherwise, if all the elements of the collection have been read, and the index\
    \ is its last valid value, the hasNext() method returns false.\n\nThe isEmpty()\
    \ method returns true if the collection has no elements, else it returns false.\n\
    \nThe IB booklet \"Pseudocode in Examinations\" mentions the names of some methods\
    \ used with stacks :\n A stack is a Last In, First Out (FIFO) list .\n\nThe push(item)\
    \ method pushes an item (variable, text string, or object) on the stack, it adds\
    \ an item at the top of the stack. It is similar to the addLast(object) method.\n\
    \nThe pop() method pops an object from the stack, that means it gets, and then\
    \ removes, the object from the top of the stack. It is similar to the getLast()\
    \ method followed by the removeLast() method.\n\nThe isEmpty() method returns\
    \ true when the stack is empty, otherwise it returns false.\n\nThe IB booklet\
    \ \"Pseudocode in Examinations\" mentions the names of some methods used with\
    \ queues :\n A queue is a First In, First Out (FIFO) list .\n\nThe enqueue(item)\
    \ method adds an item (variable, text string, or object) at the end of the queue.\
    \ It is similar to the addLast(object) method.\n\nThe dequeue() method gets and\
    \ removes the item from the front of the queue. It is similar to the getFirst()\
    \ method followed by the removeFirst() method.\n\nThe isEmpty() method returns\
    \ true when the queue is empty, otherwise it returns false.\n\nWhile most pseudocode\
    \ methods are not real Java methods (the exceptions being push(), pop(), and isEmpty()),\
    \ one still needs to know about some questions on the IB Computer Science exam.\
    \ The students have to be able to read and understand programs written in pseudocode.\n\
    \nShould students also spend time learning how to write programs in pseudocode?\
    \ The IB booklet \"Pseudocode in Examinations\" mentions that it is accepted under\
    \ exam conditions candidates may, in their solutions, use pseudocode similar to\
    \ a programming language with which they are familiar. This is acceptable. The\
    \ remarque will be written using the approved notation. Provided the examiners\
    \ can see the logic in the candidate's response, regardless of language, it will\
    \ be credited."
- md: "\n# Călin Galeriu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\n## 16. Random Numbers\n\nRandom numbers are very important in\
    \ computer programming because many video games need them. Many computer simulations\
    \ of real life also need Java. Java has options for generating random numbers:\
    \ the Math.random() method, the Random class, and the shuffle method of the Collections\
    \ class.\n\n## 16.1. Generating random numbers using the Math.random() method\n\
    \nThe simplest way to generate a random number in Java is to call the static random()\
    \ method of the Math class. Math.random() returns a real number (of type double)\
    \ in the [0, 1) interval.\n\n- Math.random() -> real random number in the [0,\
    \ 1) interval\n- MAX*Math.random() -> real random number in the [0, MAX) interval\n\
    - MIN + (MAX - MIN)*Math.random() -> real random number in the [MIN, MAX) interval\n\
    \nTo change a number of double into an int we use the typecasting operator (int)\
    \ in the front of the numerical expression of double. The real number will be\
    \ truncated (rounded down) to an integer, and the fractional part of the real\
    \ number will be ignored. If N and M are two integers, with N < M -> real random\
    \ number in the [0, N) interval.\n\n- N*Math.random() -> integer random number\
    \ in the {M, M+1, ..., N-1} set\n- (int)(N*Math.random()) -> integer random number\
    \ in the {0, 1, ..., N-1} set\n- (int)(N*Math.random() + M) -> integer random\
    \ number in the {M, M+1, ..., M+N-1} set\n\n| In particular, to generate an integer\
    \ random number in the | {1, 2, 3, 4, 5, 6} set, we use the line: |\n| int i =\
    \ (int)(6*Math.random() + 1); // roll of the die |\n\nSometimes it is helpful\
    \ to define a function that generates an integer random number from MIN to MAX.\
    \ According to the above discussion, MIN = M and MAX = M+N-1. These two equations\
    \ are equivalent to M = MIN and N = MAX-MIN-1.\n\n(int) ((MAX - MIN+1)*Math.random()\
    \ + MIN) -> integer random number in {MIN, MIN+1, ..., MAX} set\n\n```java\n//\
    \ JAVA Example 58\npublic class Main\n{\n    public static void main(String[]\
    \ args) {\n        int i = (int)(6*Math.random() + 1); // roll of the die\n  \
    \      System.out.println(\"roll of the die : \" + i);\n    }\n}\n```\n\n## 16.2.\
    \ Generating random numbers using the Random class\n\nAn alternative way to generate\
    \ a random number is to instantiate an object of the Random class, and use one\
    \ of the nextInt(), nextLong(), nextDouble(), or nextBoolean() methods. These\
    \ methods return random numbers in different intervals.\n\n- nextInt() -> integer\
    \ random number in {0, 1, ..., N-1} set\n- nextLong() -> long random number in\
    \ {-2^63, ..., 2^63-1} set\n- nextFloat() -> real random number (of type float)\
    \ in {0, 1) interval\n- nextDouble() -> real random number (of type double) in\
    \ {0, 1) interval\n- nextBoolean() -> random boolean value, true or false\n\n\
    There are two ways to use the nextInt() method, one with input argument, and one\
    \ without. This is an example of method overloading. The next program, Java Example\
    \ 59, produces random numbers using all these methods of the Random class. Objects\
    \ of the Random class must be instantiated before these functions are called.\n\
    \n```java\n// JAVA Example 59\nimport java.util.Random;\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        Random myRandom = new Random();\n\
    \        int i = myRandom.nextInt(6) + 1; // roll of the die\n        int j =\
    \ myRandom.nextInt();\n        long k = myRandom.nextLong();\n        float f\
    \ = myRandom.nextFloat();\n        double g = myRandom.nextDouble();\n       \
    \ boolean b = myRandom.nextBoolean();\n        System.out.println(\"roll of the\
    \ die is \" + i);\n        System.out.println(\"random integer number (int) =\
    \ \" + j);\n        System.out.println(\"random integer number (long) = \" + k);\n\
    \        System.out.println(\"random real number (float) = \" + f);\n        System.out.println(\"\
    random real number (double) = \" + g);\n        System.out.println(\"random boolean\
    \ value = \" + b);\n    }\n}\n```\n\nHow do random number generators work? The\
    \ computer cannot roll a die in order to get a truly random number. The truth\
    \ is that the \"random\" numbers produced by the computer are not truly random,\
    \ they only look like random numbers to an unsuspecting eye. We call them pseudorandom\
    \ numbers. To generate theseonymous numbers the computer starts with a given number,\
    \ called the seed, and then it applies an algorithm to get the next number in\
    \ the series. Often the first seed is just the system time in milliseconds or\
    \ a part of it. In Java the time in milliseconds is returned by the System.currentTimeMillis()\
    \ method.\n\n## 16.3. The shuffle() method of the Collections class\n\nAnother\
    \ way of introducing randomness into a Java program is to shuffle a collection\
    \ of objects. This operation is similar to the shuffling of a deck of playing\
    \ cards. The shuffle() method belongs to the Collections class, which has static\
    \ methods for storing and manipulating groups of objects. The objects in the collection,\
    \ like the playing cards in the deck, end up in random positions. The methods\
    \ of the Collections can be called on ArrayList or LinkedList lists. The next\
    \ program, Java Example 60, shuffles a set of 10 integer numbers.\n\n```java\n\
    // Java Example 60\nimport java.util.ArrayList;\nimport java.util.Collections;\n\
    \npublic class Main\n{\n    public static void main(String[] args)\n    {\n  \
    \      int N = 10; // the number of elements in the list\n        ArrayList<Integer>\
    \ myList = new ArrayList<Integer>();\n        for(int i=0; i<N; i++) myList.add(i);\n\
    \        System.out.println(\"myList before shuffle:\");\n        for(int i=0;\
    \ i<N; i++) System.out.println(myList.get(i));\n        Collections.shuffle(myList);\n\
    \        System.out.println(\"myList after shuffle:\");\n        for(int i=0;\
    \ i<N; i++) System.out.println(myList.get(i));\n    }\n}\n```\n\nIt is important\
    \ to note that the myList.add() instruction does not add to the collection primitive\
    \ variable of type int, but instead adds to an object of type Integer. The Integer\
    \ class is one of the wrapper classes. The Java wrapper classes transform primitives\
    \ into objects. These objects have just one field variable, the primitive variable\
    \ we start with, together with some related methods. For example, an object of\
    \ Integer has just one field variable, a primitive variable of type int, packaged\
    \ with some helpful methods.\n\n| Primitive variable type | Wrapper class |\n\
    |---|---|\n| char | Character |\n| byte | Byte |\n| short | Short |\n| long |\
    \ Integer |\n| float | Float |\n| double | Double |\n| boolean | Boolean |\n\n\
    The wrapper classes can be used with the standard constructor, or with the autoboxing\
    \ feature, which simplifies the conversion of the primitive variable into an object.\
    \ The unboxing simplifies the conversion of the object into a primitive variable.\n\
    \n| Standard constructor | With autoboxing | With unboxing |\n|---|---|---|\n\
    | Character ch = new Character('a'); | Character ch = 'a'; | char c = ch; |\n\
    | Byte bt = new Byte(100); | Byte bt = 100; | byte b = bt; |\n| Short st = new\
    \ Short(30000); | Short st = 30000; | short s = st; |\n| Integer it = new Integer(1000000);\
    \ | Integer it = 1000000; | long i = it; |\n| Float ft = new Float(3.1416); |\
    \ Float ft = 3.1416F; | float f = ft; |\n| Double db = new Double(5.640); | Double\
    \ db = 5.640; | double d = db; |\n| Boolean bn = new Boolean(true); | Boolean\
    \ bn = true; | boolean b = bn; |\n\n## 16.4. Important static methods of the Java\
    \ wrapper classes\n\nEach wrapper class has some static methods. The two most\
    \ commonly used methods are String Integer.parseInt(String s) method returns an\
    \ integer (int). The String s is converted into the int equivalent. For example\
    \ Integer.parseInt(\"-505\") returns -505. The Integer.toString(int i) method\
    \ returns a String object, the equivalent of the integer number. Integer.toString(505)\
    \ returns \"505\". There is also a toString method that does not have an int parameter,\
    \ used with objects that have been initialized.\n\n| Conversion from String |\
    \ Conversion to String |\n|---|---|\n| Warning! Character.parseChar() does not\
    \ exist. | String s = Character.toString('a'); |\n| byte b = Byte.parseByte(\"\
    100\"); | String s = Byte.toString(byte 100); |\n| short s = Short.parseShort(\"\
    30000\"); | String s = Short.toString(short 30000); |\n| int i = Integer.parseInt(\"\
    1000000\"); | String s = Integer.toString(1000000); |\n| float f = Float.parseFloat(\"\
    3.1416\"); | String s = Float.toString(3.1416F); |\n| double d = Double.parseDouble(\"\
    5.640\"); | String s = Double.toString(5.640); |\n| boolean b = Boolean.parseBoolean(\"\
    true\"); | String s = Boolean.toString(true); |\n"
  mdcn: "\n\n# Călin Galeriu IB CS 考试 OOP 选项 Java 编程基础\n\n## 16. 随机数\n\n随机数在计算机编程中非常重要，因为许多视频游戏都需要它们。许多对现实生活的计算机模拟也需要\
    \ Java。Java 有生成随机数的选项：`Math.random()` 方法、`Random` 类以及 `Collections` 类的 `shuffle`\
    \ 方法。\n\n## 16.1. 使用 Math.random() 方法生成随机数\n\n在 Java 中生成随机数简单的方法是调用 `Math` 类的静态方法\
    \ `random()`。`Math.random()` 返回 [0, 1) 区间内的实数（`double` 类型）。\n\n- Math.random()\
    \ -> [0, 1) 区间的随机实数\n- MAX*Math.random() -> [0, MAX) 区间的随机实数\n- MIN + (MAX - MIN)*Math.random()\
    \ -> [MIN, MAX) 区间的随机实数\n\n要将一个 `double` 数字转换为 `int`，我们在 `double` 数值表达式前面使用类型转换运算符\
    \ `(int)`。实数将被截断（向下取整）为整数，实数的小数部分将被忽略。如果 N 和 M 是两个整数，且 N < M -> [0, N) 区间的随机实数。\n\
    \n- N*Math.random() -> {M, M+1, ..., N-1} 集合中的随机整数\n- (int)(N*Math.random()) ->\
    \ {0, 1, ..., N-1} 集合中的随机整数\n- (int)(N*Math.random() + M) -> {M, M+1, ..., M+N-1}\
    \ 集合中的随机整数\n\n| 特别地，要在 {1, 2, 3, 4, 5, 6} 集合中生成一个随机整数，我们使用以下行： |\n| int i = (int)(6*Math.random()\
    \ + 1); // 掷骰子 |\n\n有时定义一个从 MIN 到 MAX 生成随机整数的函数是有帮助的。根据上面的讨论，MIN = M 和 MAX = M+N-1。这两个方程等同于\
    \ M = MIN 和 N = MAX-MIN-1。\n\n(int) ((MAX - MIN+1)*Math.random() + MIN) -> {MIN,\
    \ MIN+1, ..., MAX} 集合中的随机整数\n\n```java\n// JAVA Example 58\npublic class Main\n\
    {\n    public static void main(String[] args) {\n        int i = (int)(6*Math.random()\
    \ + 1); // 掷骰子\n        System.out.println(\"roll of the die : \" + i);\n    }\n\
    }\n```\n\n## 16.2. 使用 Random 类生成随机数\n\n生成随机数的另一种方法是实例化 `Random` 类对象，并使用 `nextInt()`、`nextLong()`、`nextDouble()`\
    \ 或 `nextBoolean()` 方法之一。这些方法返回不同区间内的随机数。\n\n- nextInt() -> {0, 1, ..., N-1} 集合中的随机整数\n\
    - nextLong() -> {-2^63, ..., 2^63-1} 集合中的随机 long 数\n- nextFloat() -> [0, 1) 区间的随机实数（`float`\
    \ 类型）\n- nextDouble() -> [0, 1) 区间的随机实数（`double` 类型）\n- nextBoolean() -> 随机布尔值，true\
    \ 或 false\n\n使用 `nextInt()` 方法有两种方式，一种带输入参数，另一种不带参数。这是方法重载的一个示例。下一个程序 Java Example\
    \ 59 使用了 `Random` 类的所有这些方法生成随机数。在调用这些函数之前，必须实例化 `Random` 类对象。\n\n```java\n// JAVA\
    \ Example 59\nimport java.util.Random;\n\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        Random myRandom = new Random();\n      \
    \  int i = myRandom.nextInt(6) + 1; // 掷骰子\n        int j = myRandom.nextInt();\n\
    \        long k = myRandom.nextLong();\n        float f = myRandom.nextFloat();\n\
    \        double g = myRandom.nextDouble();\n        boolean b = myRandom.nextBoolean();\n\
    \        System.out.println(\"roll of the die is \" + i);\n        System.out.println(\"\
    random integer number (int) = \" + j);\n        System.out.println(\"random integer\
    \ number (long) = \" + k);\n        System.out.println(\"random real number (float)\
    \ = \" + f);\n        System.out.println(\"random real number (double) = \" +\
    \ g);\n        System.out.println(\"random boolean value = \" + b);\n    }\n}\n\
    ```\n\n随机数生成器是如何工作的？计算机无法通过掷骰子来获得真正的随机数。事实是，计算机产生的“随机”数并不是真正随机的，它们对毫无防备的人来说看起来像随机数。我们称它们为伪随机数。为了生成这些随机数，计算机从一个给定的种子开始，然后应用一个算法生成随机数。`Math.random()`\
    \ 返回一个 `double` 类型的随机实数。\n\n## 16.3. Collections 类的 shuffle 方法\n\n引入随机数的另一种方法是使用\
    \ `Collections` 类的 `shuffle()` 方法。这种方法可以将列表中的元素打乱。例如，如果你有一个包含 {1, 2, 3, 4, 5,\
    \ 6} 的列表，可以使用 `shuffle()` 方法来随机排列顺序。\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.Collections;\nimport java.util.List;\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        List<Integer> list = new\
    \ ArrayList<>();\n        for (int i = 1; i <= 6; i++) {\n            list.add(i);\n\
    \        }\n        System.out.println(\"排序前: \" + list);\n        Collections.shuffle(list);\n\
    \        System.out.println(\"排序后: \" + list);\n    }\n}\n```\n\n(注：由于原文文本在此处出现了格式错乱，上述翻译已根据逻辑进行了合理重组)\n\
    \n(int) ((MAX - MIN+1)*Math.random() + MIN) -> {MIN, MIN+1, ..., MAX} 集合中的随机整数\n\
    \n"
