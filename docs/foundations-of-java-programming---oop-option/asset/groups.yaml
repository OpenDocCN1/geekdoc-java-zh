- md: "\n# Călin Galeriu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\n## 5. Operators: arithmetic, relational, and logical\n\n### 5.1.\
    \ The Java arithmetic operators\n\nThe Java arithmetic operators have numbers\
    \ as input and numbers as output.\n\n| The Java arithmetic operators | Example\
    \ |\n| :--- | :--- |\n| + (addition) | Example: 13 + 5 = 18 |\n| - (subtraction)\
    \ | Example: 13 - 5 = 8 |\n| * (multiplication) | Example: 13 * 5 = 65 |\n| /\
    \ (division) | Example: 13.0 / 5.0 = 2.6 |\n| / (integer division) | Example:\
    \ 13 / 5 = 2 This is the quotient of an integer division. |\n| % (modulus) | Example:\
    \ 13 % 5 = 3 This is the remainder of an integer division. |\n| ++ (increment)\
    \ | Example: 13++ = 14 |\n| -- (decrement) | Example: 5-- = 4 |\n\n> Warning!\
    \ It is very easy to make mistakes because x++ (post-increment) is not the same\
    \ as ++x (pre-increment), and x-- is not the same as --x (pre-decrement).\n> y=x++;\
    \ means {y = x; x = x + 1; }; while y++x means {x = x + 1; y = x; }\n> y=x--;\
    \ means {y = x; x = x - 1; }; while y--x means {x = x - 1; y = x; };\n\nIB Course:\
    \ Use x = x + 1 instead of x++ or ++x, and x = x - 1 instead of x-- or --x.\n\n\
    The next program, Java Example 9, demonstrates how to do simple arithmetic calculations.\n\
    \n```java\n// Java Example 9\npublic class Main\n{\n    public static void main(String[]\
    \ args)\n    {\n        int i = 13;\n        int j = 5;\n        double x = 13.0;\n\
    \        double y = 5.0;\n        System.out.println(i + j); // output: 18\n \
    \       System.out.println(i - j); // output: 8\n        System.out.println(i\
    \ * j); // output: 65\n        System.out.println(x / y); // output: 2.6\n   \
    \     System.out.println(i / j); // output: 2\n        System.out.println(i %\
    \ j); // output: 3\n        System.out.println(i / y); // output: 2.6\n    }\n\
    }\n```\n\n### 5.2. The Java relational operators\n\nThe Java relational operators\
    \ have numbers as input and boolean values as output.\n\nThe Java relational operators\
    \ are: ==, !=, <, >, <=, >=\n\n- == (is equal to) Example: 13 == 5 **false**\n\
    - != (is not equal) Example: 13 != 5 **true**\n- < (is less than) Example: 13\
    \ < 5 **false**\n- > (is greater than) Example: 13 > 5 **true**\n- <= (is less\
    \ than or equal to) Example: 13 <= 5 **false**\n- >= (is greater than or equal\
    \ to) Example: 13 >= 5 **true**\n\nThe Java relational operators return a result\
    \ (of type boolean) that can be **true** or **false**.\n\n> **Warning!** Be careful\
    \ when you read out expressions with relational operators. \"Five is less than\
    \ thirteen\" 5 < 13, but \"five less than thirteen\" means 13 – 5.\n\nThe next\
    \ program, Java Example 10, evaluates boolean expressions (logical statements\
    \ that can only be **true** or **false**) that use relational operators.\n\n```java\n\
    // Java Example 10\npublic class Main\n{\n    public static void main(String[]\
    \ args)\n    {\n        int i = 13;\n        int j = 5;\n        System.out.println(i\
    \ == j); // output: false\n        System.out.println(i != j); // output: true\n\
    \        System.out.println(i < j); // output: false\n        System.out.println(i\
    \ > j); // output: true\n        System.out.println(i <= j); // output: false\n\
    \        System.out.println(i >= j); // output: true\n    }\n}\n```\n\n### 5.3.\
    \ The Java logical operators\n\nThe Java logical operators have boolean values\
    \ as input and boolean values as output.\n\nThe logical operators are: &&, ||,\
    \ !\n\n- && (AND) Example: (13 < 5) && (13 > 5) is **false** because **false AND**\
    \ is **false**.\n- || (OR) Example: (13 < 5) || (13 > 5) is **true** because **false\
    \ OR** is **true**.\n- ! (NOT) Example: !(13 < 5) is **true** because **NOT false**\
    \ is **true**.\n\nThe Java logical operators return a value (of type boolean)\
    \ that can only be true or false.\n\n> **Warning!** It is important to realize\
    \ that the logical operators, just like the arithmetic operators, are evaluated\
    \ according to a predetermined order of operations: NOT is evaluated first, AND\
    \ is evaluated next, and OR is evaluated last.\n\nSince using the order of operations\
    \ for logical operators is not something intuitive to humans, it is good practice\
    \ to use parentheses to clarify the meaning of complex expressions.\n\nThe next\
    \ program, Java Example 11, evaluates some boolean expressions (logical statements\
    \ that can only be true or false) that use logical operators.\n\n```java\n// Java\
    \ Example 11\npublic class Main\n{\n    public static void main(String[] args)\
    \ {\n        boolean a = false;\n        boolean b = true;\n        System.out.println(a\
    \ && b); // output: false\n        System.out.println(a || b); // output: true\n\
    \        System.out.println(!a); // output: true\n    }\n}\n```\n\nThe input-output\
    \ tables below give the boolean values of all simple boolean expressions with\
    \ logical operators. These tables have to be memorized. One way to memorize these\
    \ is to think of false as 0, to think of true as 1, to think of AND as multiplication,\
    \ and to think of OR as addition.\n\n| X | Y | X AND Y |\n| :--- | :--- | :---\
    \ |\n| false | false | false |\n| false | true | true |\n| true | false | false\
    \ |\n| true | true | true |\n\n| X | Y | X OR Y |\n| :--- | :--- | :--- |\n| false\
    \ | false | false |\n| false | true | true |\n| true | false | true |\n| true\
    \ | true | true |\n\n| X | NOT X |\n| :--- | :--- |\n| false | true |\n| true\
    \ | false |\n\nJava has many operators (bitwise operators, assignment operators,\
    \ etc.) but they are not required for the Computer Science exam. For a list of\
    \ all the Java operators and their order of operations, please go to https://introcs.princeton.edu/java/precedence/\n\
    \n## 6. Control flow: conditional statements\n\nAll the Java programs given as\
    \ examples until now (Java examples from 1 to 11) have a very simple structure.\
    \ During execution the program starts at the first instruction line of the main()\
    \ function and then executes all the instruction lines in sequence. After executing\
    \ the last instruction line of the main() function, the program stops. Most programs\
    \ need flexibility; they need to execute or skip different segments of code depending\
    \ on various conditions. To implement this the Java language has `if`, `else`,\
    \ and `switch` keywords.\n\nFor simplicity, the conditions tested in the next\
    \ Java examples will be based on random numbers: `int i = (int)(6*Math.random()\
    \ + 1);` to simulate the roll of a die. This is an integer expression that returns\
    \ 1, 2, 3, 4, 5, or 6. There is more information about random numbers in Chapter\
    \ 16.\n\n### 6.1. The IF structure\n\nThe simplest if structure is:\n\n```java\n\
    if (conditionA) instructionA;\n```\n\nThe `instructionA` will be executed only\
    \ when the `conditionA` is true. Otherwise the program simply goes to the next\
    \ instruction after the if structure. Although not mandatory, the `instructionA`\
    \ could be placed inside curly braces. This is good programming practice, helping\
    \ the readability and future maintenance of your code.\n\n```java\nif (conditionA)\
    \ { instructionA; }\n```\n\nThe curly braces become mandatory when more than one\
    \ instruction has to be executed as a block of instructions when the `conditionA`\
    \ is true.\n\n```java\nif (conditionA) { instructionA1; instructionA2; instructionA3;\
    \ }\n```\n\nThe flowchart of if structure is:\n\n(img/f2c7aa28c734748dac938a1e583595e_20_0.png)\n\
    \n(img/f2c7aa28c734748dac938a1e583595e_20_1.png)\n\nThe next program, Java Example\
    \ 12, prints \"WINNER!\" whenever the integer number i happens to be 6. The program\
    \ doesn't print \"WINNER!\" otherwise. Please notice that the round brackets around\
    \ the `i == 6` condition are mandatory.\n\n```java\n// Java Example 12\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int i =\
    \ (int)(6*Math.random() + 1); // roll of the die\n        System.out.println(\"\
    i = \" + i); // the statement IF\n        if (i == 6) {\n            System.out.println(\"\
    WINNER!\");\n        }\n        System.out.println(\"i = \" + i); // the statement\
    \ after IF\n    }\n}\n```\n\n### 6.2. The IF-ELSE structure\n\nWhat do we do when\
    \ the program is supposed to do something when the tested condition is true, and\
    \ something else when the tested condition is false? We could write something\
    \ like this:\n\n```java\nif (conditionA) instructionA;\nif (!conditionA) instructionB;\n\
    ```\n\nbut that would be wasteful, since the same condition is tested twice. We\
    \ know that `!conditionA` is false when `conditionA` is true, and we know that\
    \ `!conditionA` is true when `conditionA` is false.\n\nTo avoid this wasting of\
    \ computing resources and to test the boolean condition only once, we implement\
    \ the if-else structure, which looks like this:\n\n```java\nif (conditionA) instructionA;\n\
    else instructionB;\n```\n\nor like this (with optional braces for single instructions):\n\
    \n```java\nif (conditionA) { instructionA; }\nelse { instructionB; }\n```\n\n\
    or like this (with mandatory braces for blocks of instructions):\n\n```java\n\
    if (conditionA) { instructionA1; instructionA2; instructionA3; }\nelse { instructionB1;\
    \ instructionB2; instructionB3; }\n```\n\nWe could also have a mix, with a single\
    \ instruction paired with a block of instructions:\n\n```java\nif (conditionA)\
    \ instructionA;\nelse { instructionB1; instructionB2; instructionB3; }\n```\n\n\
    or with a block of instructions paired up with a single instruction:\n\n```java\n\
    if (conditionA) { instructionA1; instructionA2; instructionA3; }\nelse instructionB;\n\
    ```\n"
  mdcn: "\n\n# Călin Galeriu IB CS 考试 OOP 选项的 Java 编程基础\n\n## 5. 运算符：算术、关系和逻辑运算符\n\
    \n### 5.1. Java 算术运算符\n\nJava 算术运算符以数字为输入，数字为输出。\n\n| Java 算术运算符 | 示例 |\n| :---\
    \ | :--- |\n| + (加法) | 示例: 13 + 5 = 18 |\n| - (减法) | 示例: 13 - 5 = 8 |\n| * (乘法)\
    \ | 示例: 13 * 5 = 65 |\n| / (除法) | 示例: 13.0 / 5.0 = 2.6 |\n| / (整数除法) | 示例: 13\
    \ / 5 = 2 这是整数除法的商。 |\n| % (取模) | 示例: 13 % 5 = 3 这是整数除法的余数。 |\n| ++ (自增) | 示例:\
    \ 13++ = 14 |\n| -- (递减) | 示例: 5-- = 4 |\n\n> 警告！这很容易出错，因为 x++（后自增）不等于 ++x（前自增），且\
    \ x-- 不等于 --x（前递减）。\n> y=x++; means {y = x; x = x + 1; }; while y++x means {x\
    \ = x + 1; y = x; }\n> y=x--; means {y = x; x = x - 1; }; while y--x means {x\
    \ = x - 1; y = x; };\n\nIB 课程建议：使用 x = x + 1 代替 x++ 或 ++x，使用 x = x - 1 代替 x--\
    \ 或 --x。\n\n接下来的程序（Java Example 9）演示了如何进行简单的算术计算。\n\n```java\n// Java Example\
    \ 9\npublic class Main\n{\n    public static void main(String[] args)\n    {\n\
    \        int i = 13;\n        int j = 5;\n        double x = 13.0;\n        double\
    \ y = 5.0;\n        System.out.println(i + j); // output: 18\n        System.out.println(i\
    \ - j); // output: 8\n        System.out.println(i * j); // output: 65\n     \
    \   System.out.println(x / y); // output: 2.6\n        System.out.println(i /\
    \ j); // output: 2\n        System.out.println(i % j); // output: 3\n        System.out.println(i\
    \ / y); // output: 2.6\n    }\n}\n```\n\n### 5.2. Java 关系运算符\n\nJava 关系运算符以数字为输入，布尔值为输出。\n\
    \nJava 关系运算符有：==, !=, <, >, <=, >=\n\n- == (等于) 示例: 13 == 5 **false**\n- != (不等于)\
    \ 示例: 13 != 5 **true**\n- < (小于) 示例: 13 < 5 **false**\n- > (大于) 示例: 13 > 5 **true**\n\
    - <= (小于或等于) 示例: 13 <= 5 **false**\n- >= (大于或等于) 示例: 13 >= 5 **true**\n\nJava\
    \ 关系运算符返回一个类型为 boolean 的结果，其值可以是 **true** 或 **false**。\n\n> **警告！** 在读取带有关系运算符的表达式时要小心。“五小于十三”对应\
    \ 5 < 13，但“五少于十三”的含义是 13 – 5。\n\n接下来的程序（Java Example 10）评估了使用关系运算符的布尔表达式（只能为 **true**\
    \ 或 **false** 的逻辑语句）。\n\n```java\n// Java Example 10\npublic class Main\n{\n \
    \   public static void main(String[] args)\n    {\n        int i = 13;\n     \
    \   int j = 5;\n        System.out.println(i == j); // output: false\n       \
    \ System.out.println(i != j); // output: true\n        System.out.println(i <\
    \ j); // output: false\n        System.out.println(i > j); // output: true\n \
    \       System.out.println(i <= j); // output: false\n        System.out.println(i\
    \ >= j); // output: true\n    }\n}\n```\n\n### 5.3. Java 逻辑运算符\n\nJava 逻辑运算符以布尔值为输入，布尔值为输出。\n\
    \n逻辑运算符有：&&, ||, !\n\n- && (逻辑与) 示例: (13 < 5) && (13 > 5) 是 **false**，因为 **false\
    \ AND** 是 **false**。\n- || (逻辑或) 示例: (13 < 5) || (13 > 5) 是 **true**，因为 **false\
    \ OR** 是 **true**。\n- ! (非) 示例: !(13 < 5) 是 **true**，因为 **NOT false** 是 **true**。\n\
    \nJava 逻辑运算符返回一个类型为 boolean 的值，只能是 true 或 false。\n\n> **警告！** 重要的是，逻辑运算符和算术运算符一样，是按照预定的运算顺序进行求值的：先计算\
    \ NOT，接着是 AND，最后是 OR。\n\n由于对于人类来说，逻辑运算符的运算顺序并不直观，因此使用括号来明确复杂表达式的含义是一个良好的习惯。\n\n\
    接下来的程序（Java Example 11）评估了使用逻辑运算符的布尔表达式（只能为 true 或 false 的逻辑语句）。\n\n```java\n\
    // Java Example 11\npublic class Main\n{\n    public static void main(String[]\
    \ args) {\n        boolean a = false;\n        boolean b = true;\n        System.out.println(a\
    \ && b); // output: false\n        System.out.println(a || b); // output: true\n\
    \        System.out.println(!a); // output: true\n    }\n}\n```\n\n下面的输入输出表提供了所有简单布尔表达式的布尔值。记忆这些表格的一种方法是将\
    \ false 视为 0，将 true 视为 1，将 AND 视为乘法，将 OR 视为加法。\n\n| X | Y | X AND Y |\n| :---\
    \ | :--- | :--- |\n| false | false | false |\n| false | true | false |\n| true\
    \ | false | false |\n| true | true | true |\n\n| X | Y | X OR Y |\n| :--- | :---\
    \ | :--- |\n| false | false | false |\n| false | true | true |\n| true | false\
    \ | true |\n| true | true | true |\n\n| X | NOT X |\n| :--- | :--- |\n| false\
    \ | true |\n| true | false |\n\nJava 拥有许多运算符（位运算符、赋值运算符等），但在计算机科学考试中并不要求掌握。关于所有\
    \ Java 运算符及其运算顺序，请参阅：https://introcs.princeton.edu/java/precedence\n\n## 6. 控制流：条件语句\n\
    \n到目前为止给出的 Java 程序（Java  1 到 11）结构非常简单。在执行期间，程序从 main() 函数的第一条指令开始，然后顺序执行所有指令。执行\
    \ main() 函数的最后一条指令后，程序停止。大多数程序都需要灵活性；需要根据各种条件执行或跳过代码段。为了实现这一点，Java 语言拥有 `if`、`else`\
    \ 和 `switch` 关键字。\n\n为了简单起见，接下来的 Java 示例条件将基于随机数：`int i = (int)(6*Math.random()\
    \ + 1);` 来模拟掷骰子。这是一个返回 1, 2, 3, 4, 5 或 6 的整数表达式。关于随机数的更多信息见第 16 章。\n\n### 6.1.\
    \ IF 结构\n\n简单的 if 结构是：\n\n```java\nif (conditionA) instructionA;\n```\n\n只有当 `conditionA`\
    \ 为真时才会执行 `instructionA`。否则程序直接跳到 if 结构之后的指令。虽然不是强制的，但可以将 `instructionA` 放在大括号内。良好的编程习惯，有助于代码的可读性和未来的维护。\n\
    \n```java\nif (conditionA) { instructionA; }\n```\n\n当 `conditionA` 为真且需要执行多条指令时，大括号是强制的。\n\
    \n```java\nif (conditionA) { instructionA1; instructionA2; instructionA3; }\n\
    ```\n\nif 结构的流程图是：\n\n(img/f2c7aa28c73748dac938a1e583595e_20_0.png)\n\n(img/f2c7aa28c73748dac938a1e583595e_20_1.png)\n\
    \n接下来的程序（Java Example 12）当整数 `i` 恰好为 6 时打印 \"WINNER!\"。否则不打印 \"WINNER!\"。请注意 `i\
    \ == 6` 条件周围的括号是强制的。\n\n```java\n// Java Example 12\npublic class Main {\n   \
    \ public static void main(String[] args) {\n        int i = (int)(6*Math.random()\
    \ + 1); // 掷骰子\n        System.out.println(\"i = \" + i); // 语句\n        if (i\
    \ == 6) {\n            System.out.println(\"WINNER!\");\n        }\n        System.out.println(\"\
    i = \" + i); // IF 之后的语句\n    }\n}\n```\n\n### 6.2. IF-ELSE 结构\n\n当程序应该在条件为真时做某些事，在条件为假时做其他事情，我们该怎么办？我们可以写类似这样的代码：\n\
    \n```java\nif (conditionA) instructionA;\nif (!conditionA) instructionB;\n```\n\
    \n那是浪费的，因为同一个条件被测试了两次。我们知道当 `conditionA` 为真时 `!conditionA` 为假，当 `conditionA` 为假时\
    \ `!conditionA` 为真。\n\n为了避免这种计算资源的浪费并只测试一次布尔条件，我们实现了 if-else 结构，它看起来如下：\n\n```java\n\
    if (conditionA) instructionA;\nelse instructionB;\n```\n\n或者如下所示（单条指令可选大括号）：\n\
    \n```java\nif (conditionA) { instructionA; }\nelse { instructionB; }\n```\n\n\
    或者如下所示（指令块强制性大括号）：\n\n```java\nif (conditionA) { instructionA1; instructionA2;\
    \ instructionA3; }\nelse { instructionB1; instructionB2; instructionB3; }\n```\n\
    \n我们也可以混合使用，即单条指令配上指令块：\n\n```java\nif (conditionA) instructionA;\nelse { instructionB1;\
    \ instructionB2; instructionB3; }\n```\n\n或者一个指令块配上单条指令：\n\n```java\nif (conditionA)\
    \ { instructionA1; instructionA2; instructionA3; }\nelse instructionB;\n```\n\n"
