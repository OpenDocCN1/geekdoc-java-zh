    \ // output : 456\n    }\n}\n\nclass StaticVarExample {\n    public static int\
    \ myStaticVar = 123;\n}\n```\n\n# IB 考试 OOP 选项 Java 编程基础\n\n非静态的字段变量称为实例变量。当字段变量不是静态的时，每个（实例化的）对象都拥有该实例的自己的副本。实例变量之间是相互独立的，只能通过实例名后跟点符号来访问。尝试通过类名访问实例变量将产生编译错误。\n\
    \n下一个程序 Java Example 41 与 Java Example 40 类似，但有一个重要的区别：`InstanceVar` 类中的 `int`\
    \ 变量 `myInstanceVar` 不是静态的。因此，`obj2` 中该整数的值不会修改 `obj1` 和 `obj3` 中的值。\n\n```java\n\
    // Java Example 41\npublic class Main {\n    public static void main(String[]\
