  - "[PAGE 28]\n\n# Călin Galileu Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\nouter for loop the program executes the instructions for\
    \ all of the j values (in the inner for loop). A nested for loop structure like\
