- md: "\n# Calin Galileiu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\n## 17. Object-Oriented Programming: Encapsulation\n\n### 17.1.\
    \ Accessor (getter) and mutator (setter) methods\n\nEncapsulation is a fundamental\
    \ feature of Object-Oriented Programming. A capsule, in general, is a small container\
    \ with some protected content inside. Think about a pharmaceutical capsule (a\
    \ gelatinous case holding the medication), a space capsule (a small spacecraft\
    \ protecting the astronauts during landing), or a time capsule (a small box with\
    \ objects saved for future times).\n\nIn encapsulation describes the protection\
    \ of some instance variables inside.\n\nIn Java encapsulation is implemented using\
    \ the private keyword in front of the protected instance variables (field variables).\
    \ As a consequence these protected protected field variables can be accessed (read\
    \ or written) by the same method. Usually the objects have dedicated public methods\
    \ that read from RAM the value of the private instance variables, called accessor\
    \ methods (also called getter methods), and dedicated methods that write into\
    \ RAM the value of the private instance variables, called mutator methods (also\
    \ called setter methods). How to remember the \"mutator\" name? Think that in\
    \ biology mutation is a change in the data. A mutator method brings a change of\
    \ value.\n\nThe biggest advantage of encapsulation is that the protected variables\
    \ are safe from unauthorized access. Direct access is still granted through the\
    \ public accessor (getter) and mutator (setter) methods, or through other public\
    \ methods of that class. Encapsulation minimizes the chance of an accidental corruption\
    \ of the data, since in the chance of a programming error with that effect. Encapsulation\
    \ is a form of abstraction, it hides from the implementation details of accessor\
    \ and mutator methods. As a result the maintenance and/or the modification of\
    \ accessor and mutator methods is done easier, without making any changes in the\
    \ classes that are accessing (reading or writing) the protected instance variables.\n\
    \nYou have already seen an example of encapsulation in Java Example 36. In that\
    \ program the private myText string is set by the MyHello() constructor and then\
    \ is printed out by the printGreeting() function. We expand the Java Example 36\
    \ by adding accessor (getter) and mutator (setter) methods.\n\nThe program in\
    \ Java Example 61 has two classes. The public Main class has the static main()\
    \ method, which is the entry point into the program. The MyHello class has one\
    \ instance variable, the private myText object. This private instance variable\
    \ can be read or written only by the public methods of the MyHello class: MyHello(),\
    \ printGreeting(), setText(), and getText().\n\nThe greeting object is declared\
    \ and instantiated (in the first line of the main method). The greeting.myText\
    \ instance variable is given the initial value of \"Hello World!\" by the MyHello\
    \ constructor. Next, the initial value of greeting.myText is changed into \"I\
    \ Love Computer!\" by the setText() mutator method. This new value of greeting.myText\
    \ is read by the getText() accessor method, which returns the value of this private\
    \ text string. The new message is printed on the screen by the System.out.println()\
    \ method.\n\n```java\n// Java Example 61\npublic class Main\n{\n    public static\
    \ void main(String[] args) {\n        MyHello greeting = new MyHello(\"Hello World!\"\
    );\n        greeting.printGreeting();\n        greeting.setText(\"I love Computer\
    \ Science!\");\n        String newText = greeting.getText();\n        System.out.println(newText);\n\
    \    }\n}\n\nclass MyHello\n{\n    private String myText; // the protected instance\
    \ variable\n\n    public MyHello(String text) // the constructor\n    {\n    \
    \    myText = text;\n    }\n\n    public void printGreeting()\n    {\n       \
    \ System.out.println(myText);\n    }\n\n    public void setText(String text) //\
    \ the mutator (setter) method\n    {\n        myText = text;\n    }\n\n    public\
    \ String getText() // the accessor (getter) method\n    {\n        return myText;\n\
    \    }\n}\n```\n\n### 17.2. The JAVA access modifiers: public, private, protected\n\
    \nTo access a variable means that you can find (read, get) or change (write, set)\
    \ its value.\n\nTo access a function means that you can use (call, execute, invoke)\
    \ that function.\n\nTo access an object means that you can access the variables,\
    \ functions, and objects that belong to that given object.\n\nA JAVA access modifier\
    \ is a JAVA keyword that determines what functions have or do not have access\
    \ to the variables, functions, or objects to whom JAVA access modifier applies.\n\
    \nThe summary of the consequences of the access modifiers is given in the table:\n\
    \n| Access modifier | Access by same class | Access by same package | Access by\
    \ subclasses |\n| :--- | :--- | :--- | :--- |\n| public | Yes | Yes | Yes |\n\
    | protected | Yes | Yes | No |\n| none (default) | Yes | Yes | No |\n| private\
    \ | Yes | No | No |\n\nOne question remains. What is a subclass? Read the next\
    \ chapter to find.\n\n## 18. Object-Oriented Programming: Inheritance\n\nInheritance\
    \ is a fundamental feature of Object-Oriented Programming. Inheritance, refers\
    \ to the transfer of some property (money, houses) from one person to her children,\
    \ other family members. In inheritance describes the transfer, from one class\
    \ (the parent class) to another class (the child class), of all the non-private\
    \ field variables, methods, and classes.\n\nThe parent class is also the superclass,\
    \ or the base class. The child class is also called the subclass, or the derived\
    \ class. The child class does not inherit the constructor(s) of the parent class,\
    \ the default constructor of the child class always starts by calling the constructor\
    \ of the parent class using super().\n\nIn Java inheritance is implemented using\
    \ the extends keyword in the declaration of the child class. The parent class\
    \ must be declared in the Java program before the child class is.\n\n```java\n\
    class ParentClass { ... }\n```\n\n```java\nclass ChildClass extends ParentClass\
    \ { ... }\n```\n\nIn this way of type ChildClass will have all the non-private\
    \ field variables, methods, and objects of an ParentClass. The ChildClass class\
    \ can also have additional field variables, methods, and objects, which the Parentclass\
    \ does not have.\n\nThe biggest advantage of inheritance is the ability of the\
    \ child class to reuse code written for the parent class. Inheritance also shortens\
    \ the development time of a new program, but also results in better structured\
    \ and more robust programs, since usually the code of the parent class has been\
    \ optimized and is well tested against all kinds of errors.\n\nThe program shown\
    \ in Java Example 62 has three classes. The public Main class has the static main()\
    \ method, which is the entry point into the program. The Book parent class (superclass)\
    \ has two field variables, title and author, and one method, printInfo(). The\
    \ Textbook class (subclass) has an additional field variable, subject, and another\
    \ method, printInfo(). The MyText object, which is an instance of the Textbook\
    \ class, has the three field variables and the two methods listed above. By the\
    \ myText object created (instantiated), all its field variables are given values,\
    \ and all its methods are called from the main() method. There is no distinction\
    \ between field variables and methods that are inherited, and field variables\
    \ and methods that are not inherited. They work in the same way, as if the Java\
    \ lines of code from the body of the Book parent class were copied and pasted\
    \ inside the body of the Textbook child class.\n"
  mdcn: "\n\n# Calin Galileiu：IB CS 考试 OOP 选项 Java 编程基础\n\n## 17. 面向对象编程：封装\n\n###\
    \ 17.1. 访问器 (getter) 和修改器 (setter) 方法\n\n封装是面向对象编程的一个基本特性。通常，胶囊是一个内部包含某些保护内容的小型容器。想象一下药品胶囊（装有药物的胶质外壳）、太空舱（在着陆期间保护宇航员的小型航天器）或时间胶囊（保存用于未来的物品的小盒子）。\n\
    \n封装描述了对内部某些实例变量的保护。\n\n在 Java 中，封装通过在受保护的实例变量（字段变量）前面使用 `private` 关键字来实现。因此，这些受保护的字段变量可以通过同一个方法访问（读取或写入）。通常，对象具有专门的公共方法从内存中读取私有实例变量的值，称为访问器方法（也称为\
    \ getter 方法），以及专门将私有实例变量的值写入内存的方法，称为修改器方法（也称为 setter 方法）。如何记住“mutator（修改器）”这个名字？认为在生物学中，变异（mutation）是数据的变化。修改器方法带来了值的改变。\n\
    \n封装最大的优势是受保护的变量免受未经授权的访问。仍然允许通过公共访问器（getter）和修改器（setter）方法，或通过该类的其他公共方法进行直接访问。封装减少了数据意外损坏的概率，因为减少了产生此类影响的编程错误。封装是抽象的形式，它隐藏了访问器和修改器方法的实现细节。结果是，访问器和修改器方法的维护和修改变得更容易，而无需对访问（读取或写入）受保护实例变量的类进行任何更改。\n\
    \n你已经在 Java 示例 36 中看到过封装的示例。在那个程序中，私有字符串 `myText` 经由 `MyHello()` 构造函数设置，然后由 `printGreeting()`\
    \ 函数打印出来。我们通过添加访问器（getter）和修改器（setter）方法来扩展了 Java 示例 36。\n\nJava 示例 61 中的程序包含两个类。公共类\
    \ `Main` 具有静态 `main()` 方法，它是程序的入口点。`MyHello` 类有一个实例变量，即私有 `myText` 对象。这个私有实例变量只能通过\
    \ `MyHello` 类的公共方法读取或写入：`MyHello()`、`printGreeting()`、`setText()` 和 `getText()`。\n\
    \n对象 `greeting` 被声明并实例化（在 `main` 方法的第一行）。`MyHello` 构造函数为 `greeting.myText` 实例变量赋予初始值\
    \ \"Hello World!\"。接下来，通过 `setText()` 修改器方法将 `greeting.myText` 的初始值改为 \"I Love\
    \ Computer!\"。这个 `greeting.myText` 的新值由 `getText()` 访问器方法读取，该方法返回此私有字符串的值。新消息通过\
    \ `System.out.println()` 方法打印在屏幕上。\n\n```java\n// Java Example 61\npublic class\
    \ Main\n{\n    public static void main(String[] args) {\n        MyHello greeting\
    \ = new MyHello(\"Hello World!\");\n        greeting.printGreeting();\n      \
    \  greeting.setText(\"I love Computer Science!\");\n        String newText = greeting.getText();\n\
    \        System.out.println(newText);\n    }\n}\n\nclass MyHello\n{\n    private\
    \ String myText; // 受保护的实例变量\n\n    public MyHello(String text) // 构造函数\n    {\n\
    \        myText = text;\n    }\n\n    public void printGreeting()\n    {\n   \
    \     System.out.println(myText);\n    }\n\n    public void setText(String text)\
    \ // 修改器 (setter) 方法\n    {\n        myText = text;\n    }\n\n    public String\
    \ getText() // 访问器 (getter) 方法\n    {\n        return myText;\n    }\n}\n```\n\
    \n### 17.2. JAVA 访问修饰符：public, private, protected\n\n访问变量意味着你可以通过公共访问器（getter）和修改器（setter）方法，或通过该类的其他公共方法进行直接访问。\n\
    \n访问函数意味着你可以调用该函数。\n\n访问对象意味着你可以使用（调用、执行）该所属的函数。\n\nJava 访问修饰符决定了哪些函数可以访问哪些变量、函数和对象。\n\
    \n访问修饰符的后果如下表所示：\n\n| 访问修饰符 | 同类访问 | 同包访问 | 子类访问 |\n| :--- | :--- | :--- | :---\
    \ |\n| public | 是 | 是 | 是 |\n| protected | 是 | 是 | 否 |\n| 无 (默认) | 是 | 是 | 否 |\n\
    | private | 是 | 否 | 否 |\n\n还有一个问题。什么是子类？请阅读下一章。\n\n## 18. 面向对象编程：继承\n\n继承是面向对象编程的一个基本特性。继承指的是从一个人向其孩子（其他成员）传递某些财产（钱、房子）。继承描述从一个类（父类）到另一个类（子类）传递的所有非有字段变量、方法和类。\n\
    \n父类也称为超类或基类。子类也称为子类或派生类。子类不继承父类的构造函数，子类的默认构造函数总是通过 `super()` 调用父类的构造函数。\n\n在\
    \ Java 中，继承通过在类声明中使用 `extends` 关键字来实现。父类必须在子类之前声明。\n\n```java\nclass ParentClass\
    \ { ... }\n```\n\n```java\nclass ChildClass extends ParentClass { ... }\n```\n\
    \n通过这种方式，类型为 `ChildClass` 的类将拥有 `ParentClass` 的所有非有字段变量、方法和对象。`ChildClass` 类还可以拥有\
    \ `ParentClass` 没有的额外字段变量、方法和对象。\n\n继承最大的优势是子类可以重用为父类编写的代码。继承还缩短了新程序的开发时间，而且产生了结构更好、更健壮的程序，因为通常父类的代码已经过优化并经过了各种错误的测试。\n\
    \nJava 示例 62 所示程序包含三个类。公共类 `Main` 具有静态 `main()` 方法，它是程序的入口点。`Book` 父类（超类）有两个字段变量\
    \ `title` 和 `author` 以及一个方法 `printInfo()`。`Textbook` 类（子类）有一个额外的字段变量 `subject`\
    \ 以及另一个方法 `printInfo()`。`MyText` 对象是 `Textbook` 类的实例，拥有上述三个字段变量和两个方法。通过创建（实例化）的\
    \ `myText` 对象，其所有的字段变量都被赋予了值，并且所有的方法都从 `main()` 方法中被调用。继承的字段变量和方法与未继承的字段变量和方法之间没有区别。它们的工作方式相同，就好像将\
    \ `Book` 父类体内的 Java 代码行复制并粘贴到 `Textbook` 子类的体内部一样。\n\n"
