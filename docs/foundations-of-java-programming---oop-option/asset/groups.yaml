    ```\n\n# 19. Method overriding (run time polymorphism)\n\nIn Java, a parent class\
    \ (superclass) and a child class (subclass) can have different methods with the\
    \ same name and with the signature (the same number and type of input parameters).\
    \ This is called method overriding.\n\nIn Java, according to inheritance rules,\
    \ an object of child class is also an object of the parent class (this is the\
    \ IS-Relation). As a result, one can instantiate (create) an object of a child\
    \ class that has an object reference (pointer) of the parent class. In other words,\
    \ a constructor of a child class can be called to instantiate an object of the\
    \ parent class. The object is of parent class type because it was declared in\
    \ this way, and the constructor of a child class cannot change this declaration\
    \ statement.\n\nAn object of the parent class can be instantiated (created) using\
    \ a constructor of a child class.\n\n> Warning! When an object of the parent class\
    \ (an object that has an object reference of parent class type) is instantiated\
    \ using a constructor of a child class, the object can access only the field variables\
    \ and the methods of the parent class.\n\n> Warning! Please also notice that,\
    \ because an object of the parent class is not an object of a child class, one\
    \ cannot call the constructor of the parent class in order to instantiate an object\
    \ of a child class.\n\n# Foundations of Java Programming for the OOP Option of\
    \ the IB CS Exam\n\nThe next program, Java Example 68, shows how a constructor\
    \ of the child class can be used to instantiate an object of the parent class.\
    \ For comparison, the other two more common options (when the constructor matches\
    \ the declared object) are also shown.\n\n```java\n// Java Example 68\npublic\
    \ class Main\n{\n    public static void main(String[] args)\n    {\n        Book\
    \ myBook = new Book();\n        Textbook myTextbook = new Textbook();\n      \
    \  Book true = new Textbook(); // a Textbook object IS-A Book\n        // Textbook\
    \ impossible = new Book(); // error message\n    }\n}\n\nclass Book // the parent\
    \ class\n{\n    String title = \"How to win at poker\";\n}\n\nclass Textbook extends\
    \ Book // the child class\n{\n    String title = \"Applied statistics\";\n}\n\
    ```\n\nSuppose that we have a reference parent class, a child class, and method\
    \ overriding. During compile time, based only on the object reference (known to\
    \ be of parent class type), Java cannot decide which method to use, based on just\
    \ the object reference of parent class type, whether the parent class constructor\
    \ was used, is because the Java compiler cannot tell, based on just the object\
    \ reference of parent class type, whether a child class constructor was used when\
    \ the object was instantiated (created). Java will decide which method to call\
    \ only when the program is running, based on the class type of the actual object\
    \ associated with the method call, at that specific time and place in the program.\n\
    \n# Callin Galeriu Foundations of Java Programming for the OOP Option of the IB\
