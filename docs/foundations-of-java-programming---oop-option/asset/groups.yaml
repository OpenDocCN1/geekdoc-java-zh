    \ 505\n        System.out.println(obj3.myInstanceVar); // output : 123\n    }\n\
    }\n\nclass InstanceVar {\n    public int myInstanceVar = 123;\n}\n```\n\n# Câlin\
    \ Galeriu IB CS 考试 OOP 选项 Java 编程基础\n\n## 12. Java 对象：一维和二维数组\n\n在一维（1D）数组中，数组是持有给定数量相同类型元素的对象，这些元素在内存中按顺序存储。这些元素可以是基本类型的变量，也可以是给定类的对象。首先必须声明数组，以告诉\
    \ Java 编译器数组的名称和元素的数据类型。然后必须实例化数组。在这一步中，Java 编译器会为数组留出空间，并赋予数组元素默认值（零、null 等）。在这两个步骤之后，可以为数组元素重新分配新值。数组元素通过索引（index）来标识，整数计数器从零开始，如下：`array_name[index]`。\n\
    \n**警告！** Java 索引从零开始这可能会让人感到困惑，因为在数学和其他语言（如 Pascal）中，索引是从一开始的。对于具有 n 个元素的 Java\
    \ 数组，最后一个索引不是 n，而是 n-1。\n\n数组的声明有两种等效方式：\n`data_type[] array_name;`\n`data_type\
    \ array_name[];` 后者是首选方法。\n\n数组的实例化方式如下：\n`array_name = new data_type[size];`\
    \ 其中 size 是数组的大小。\n\n# Câlin Galeriu IB CS 考试 OOP 选项 Java 编程基础\n\n声明和实例化语句可以合并为一条：\n\
    `data_type[] array_name = new data_type[size];`\n\nJava 数组有一个非常重要的字段（属性）称为 `length`。这是一个存储数组大小整数变量。\n\
    \n下一个程序 Java Example 42 演示了整数元素数组的使用。\n\n```java\n// Java Example 42\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        int[] pi_digits;\
    \ // 声明\n        pi_digits = new int[5]; // 实例化\n        pi_digits[0] = 3; //\
