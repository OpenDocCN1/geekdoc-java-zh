    The format (...) is a static String class that returns a formatted text String.
    Because it is static , it does not require an instantiated String object, like
    the other String methods presented here. The output value is of type String. This
    method is not required for the IB CS exam.


    The general pattern of a format specifier is %[flags][width].[precision]conversion_character
    , where the parameters in brackets are optional.


    The flags used by format() are:


    +   - = left-justify ( default is to right-justify )

    + = write a "*" sign in front of positive numerical values

    0 = write "0" characters in front of numerical values, for padding

    , = use comma as a grouping separator for numerical values greater than one thousand

    = write a " " in front of positive numerical values


    The width is the minimum number of alphanumeric characters to be written.


    The precision is the number of decimal places in a floating number.


    The conversion characters used by format() are:


    +   %d = decimal number

    %f = floating number

    %c = character (% C for upper case )

    %s = text string (% S for upper case letters everywhere in the text string )

    %h = hashcode ( A hashcode substitute for the hidden RAM address. )

    %n = newline ('' n can be used as well, with less compatibility )


