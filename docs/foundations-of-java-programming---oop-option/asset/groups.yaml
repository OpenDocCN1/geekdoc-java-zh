    \ }\n        System.out.println(\"i = \" + i); // the statement after IF\n   \
    \ }\n}\n```\n\n# 6.2. The IF-ELSE structure\n\nWhat do we do when the program\
    \ is supposed to do something when the tested condition is true , and something\
    \ else when the tested condition is false ? We could write something like this:\n\
    \nif (conditionA) instructionA;\nif (NOT conditionA) instructionB;\n\nbut that\
    \ would be wasteful, since the same condition is tested twice. We know that NOT\
    \ conditionA is false when conditionA is true, and we know that NOT conditionA\
    \ is true when conditionA is false .\n\nTo avoid this wasting of computing resources,\
    \ and to test the boolean condition only once, we implement the if-else structure,\
    \ which looks like this:\n\nif (conditionA) instructionA;\nelelse instructionB;\n\
