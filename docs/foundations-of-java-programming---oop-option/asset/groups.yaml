    Each wrapper class has some static methods. The two of most commonly used methods
    are String Integer.parseInt(String s) method returns an integer ( int ). The String
    s is converted into the int equivalent. For example Integer.parseInt("-505") returns
    -505. The Integer.toString(int i) method returns a String object, the equivalent
    of the integer number. Integer.toString(505) returns "505". There is also a toString
    method that does not have an int parameter, used with objects that have been initialized.


