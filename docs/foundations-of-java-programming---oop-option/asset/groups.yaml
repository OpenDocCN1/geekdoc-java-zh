    \ name of a Java object and at the time it is the name of a variable that holds\
    \ the memory address of that object. The greeting object is initialized with the\n"
  mdcn: "\n\n## Călin Galerieu IB 计算机考试 OOP 选项 Java 编程基础\n\n`charAt(i)` 方法返回文本字符串（实例化的\
    \ String 对象）中索引为 `i` 的位置的字符。第一个字符的索引为 0。输出值类型为 `char`。\n\n`indexOf(String text)`\
    \ 方法返回在实例化 String 对象的文本中找到字符或文本子字符串的第一个位置。如果没有找到匹配项，该方法返回 -1。输出值类型为 `int`。\n\n\
    `compareTo(String text)` 方法逐个字母比较两个文本字母，如果两个字符串相同，则从第一个字母开始比较，方法返回 0。否则，当第一次比较的字母数字字符不相同时返回它们的\
    \ Unicode 值的差值。`text` 的值是从实例化 String 对象的 Unicode 值中提取的。输出值类型为 `int`。\n\n`toUpperCase()`\
    \ 方法将实例化 String 对象中的所有字母更改为大写。输出值类型为 `String`。\n\n`toLowerCase()` 方法将实例化 String\
    \ 对象中的所有字母更改为小写。输出值类型为 `String`。\n\n`format (...)` 是一个静态 String 类，返回一个格式化后的文本字符串。因为它是静态的，所以它不需要这里介绍的其他\
    \ String 方法那样实例化 String 对象。输出值类型为 `String`。IB 计算机科学考试不需要此方法。\n\n格式说明符的通用模式为 `%[flags][width].[precision]conversion_character`，其中括号中的参数是可选的。\n\
    \n`format()` 使用的标志（flags）包括：\n\n- `-` = 左对齐（默认是右对齐）\n- `+` = 在正数值前写入 `*` 号\n-\
    \ `0` = 在数值前写入 \"0\" 字符进行填充\n- `,` = 对于大于千的数值使用逗号作为分组分隔符\n- ` ` = 在正数值前写入一个空格\n\
    \n`width` 是要写入的字母数字字符的最小数量。\n\n`precision` 是浮点数的小数位数。\n\n`format()` 使用的转换字符包括：\n\
    \n- `%d` = 十进制数\n- `%f` = 浮点数\n- `%c` = 字符（大写用 `%C`）\n- `%s` = 文本字符串（字符串中所有字母大写用\
    \ `%S`）\n- `%h` = 哈希码（hashcode，用于隐藏 RAM 地址的替代品）\n- `%n` = 换行（也可以使用 `\\n`，但兼容性较差）\n\
    \n还有其他有用的 String 方法，IB 计算机科学考试不需要：`concat()`、`equalsIgnoreCase()`、`isEmpty()`、`lastIndexOf()`、`replace()`、`replaceAll()`、`toCharArray()`、`value()`。有关\
