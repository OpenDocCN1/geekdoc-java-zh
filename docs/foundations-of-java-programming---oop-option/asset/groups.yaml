    \    }\n}\n```\n\n注意上面使用的 if-else-if 结构是高效的。程序只测试了两个不等式。一个更简单的替代方案是使用三个简单的结构，但这样会测试四个不等式，如下所示。\n\
    \n```java\nif (i <= 2) System.out.println(\"lower third\");\nif (i > 2 && i <\
    \ 5) System.out.println(\"middle-third\");\nif (i >= 5) System.out.println(\"\
    upper third\");\n```\n\n正如预期的，这四个不等式中的两个并不是相互独立的，因为 !(i <= 2) 等同于 i > 2，而 !(i\
    \ >= 5) 等同于 i < 5。\n\n如果我们想要程序打印随机数的值，该怎么办？我们可以使用六个简单的 if 语句，如下所示：\n\n```java\n\
    if (i == 1) System.out.println(\"one\");\nif (i == 2) System.out.println(\"two\"\
    );\nif (i == 3) System.out.println(\"three\");\nif (i == 4) System.out.println(\"\
    four\");\n```\n\n## IB 计算机考试 OOP 选项 Java 编程基础\n\n```java\nif (i == 5) System.out.println(\"\
    five\");\nif (i == 6) System.out.println(\"six\");\n```\n\n这个程序是非常低效的，因为它对任何随机整数\
    \ i 都会测试所有的等式。通常在打印出正确消息后，测试仍会继续。这是浪费的，因为永远不会再找到另一个真值了。更好的选项是使用一个很长的 if-else-if-else-if-else-if-else-if-else\
    \ 结构，如下所示：\n\n```java\nif (i == 1) System.out.println(\"one\");\nelse if (i ==\
    \ 2) System.out.println(\"two\");\nelse if (i == 3) System.out.println(\"three\"\
    );\nelse if (i == 4) System.out.println(\"four\");\nelse if (i == 5) System.out.println(\"\
    five\");\nelse System.out.println(\"six\");\n```\n\n上面的程序更高效。一旦找到匹配项，就会打印消息并且不再检查剩余的等式。此外，不需要检查\
    \ i == 6，因为在程序的这一点上，随机整数 i 的值没有其他可用选项了。\n\n## 6.3. SWITCH 结构\n\n另一种选项是使用 switch(i)\
    \ 语句，如 Java 示例 15 所示。\n\n```java\n// Java Example 15\npublic class Main\n{\n \
    \   public static void main(String[] args) {\n        int i = (int)(6*Math.random()\
    \ + 1); // 掷骰子\n        System.out.println(\"i = \" + i); // SWITCH 之前的语句\n  \
    \      switch(i) {\n            case 1 : System.out.println(\"one\");\n      \
    \          break;\n            case 2 : System.out.println(\"two\");\n       \
    \         break;\n            case 3 : System.out.println(\"three\");\n      \
    \          break;\n            case 4 : System.out.println(\"four\");\n      \
    \          break;\n            case 5 : System.out.println(\"five\");\n      \
    \          break;\n            default: System.out.println(\"six\");\n       \
    \ }\n    }\n}\n```\n\n## IB 计算机考试 OOP 选项 Java 编程基础\n7. 控制流：循环\n\n程序的控制流（control\
    \ flow）可以是顺序的（程序按顺序执行代码行）、基于选择的（根据某些条件选择路径，如 if-else 或 switch 语句）或基于重复的（计算机循环执行代码）。循环可以通过计数器（对于\
    \ for 循环）或事件（对于 while 和 do 循环）来控制。为了实现重复结构，Java 语言有 for、while、do、continue、break\
    \ 关键字。\n\n### 7.1. FOR 循环\n\nfor 循环的结构如下：\n\n```java\nfor(initialize_the_counter\
    \ ; loop_condition ; change_the_counter) { instructions; }\n```\n\n计数是一个整数。initialize_the_counter\
    \ 语句设置计数器的初始值。loop_condition 变为 false 时循环结束，计算机退出循环，并执行 for 循环之后的后续指令。change_the_counter\
    \ 语句通常是递增（加 1）或递减（减 1）操作。loop_condition 必须与计数器的值相关。\n\n对于单个实例，大括号是可选的，但仍是良好的编程习惯。两个或多个指令可以写在大括号内部。我们还可以嵌套\
    \ for 循环，即其中一个指令本身是另一个 for 循环。\n\n下一个程序 Java 示例 17 计算 1 到 10 的整数之和。请注意 sum 是在\
    \ for 循环结构之外声明并初始化的。\n\n```java\n// Java Example 17\npublic class Main\n{\n  \
    \  public static void main(String[] args)\n    {\n        int sum = 0;\n     \
    \   for(int i=1; i <= 10; i=i + 1)\n        {\n            System.out.println(\"\
    i = \" + i);\n            sum = sum + i;\n        }\n        System.out.println(\"\
    1 + 2 + ... = \" + sum);\n    }\n}\n```\n\n有时需要在循环变为 false 之前跳出循环。Java 没有像 C 语言那样的\
    \ go 指令，但我们可以使用 break 语句退出 for 循环并跳转到程序的下一条指令，即 for 循环结构之后的第一条指令。\n\n"
