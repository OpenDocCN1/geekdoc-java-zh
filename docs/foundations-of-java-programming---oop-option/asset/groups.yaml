  - "[PAGE 84]\n\n# Câlin Galerieu Foundations of Java Programming for the OOP Option\
    \ of the IB CS Exam\n\n# 21. Reading from and writing to text files\n\nIn a text\
    \ file every line ends with a special End Of Line (EOL) character (or sequence\
    \ of characters), and the text itself ends with a special End Of File (EOF) character.\
    \ These special characters depend on the operating system running on the computer.\n\
    \n# 21.1. Reading from a text file in sequential order\n\nReading from text files\
    \ is done with the help of objects of type (class) File, FileReader, and BufferedReader.\n\
    \nThe File(String pathname) constructor creates a File object from a path name.\
    \ The path name specifies the directory and the name. An example of a path name\
    \ is \"C:\\Files\\abc.txt\". The File class has basic methods for creating new\
    \ files and directories, searching for files and directories, finding some properties\
    \ (readable, writable, length, etc.), and deleting files. The boolean exists()\
    \ method will return true when the file or directory already exists. The boolean\
    \ createFile() method will return true when the new directory is successfully\
    \ created. The boolean delete() method will return true when the file or directory\
    \ is successfully deleted. These methods will throw an IOException when the operating\
    \ system reports an error.\n\nThe FileReader(File file) constructor creates a\
    \ FileReader from a File object. The FileReader class has methods that read alphanumeric\
    \ characters from a text file. The int read() method will read one character,\
    \ which is the value of this function. The int read(char c, int offset, int len)\
    \ method will read a sequence of characters, placing them into an array. These\
    \ methods will throw an IOException when there is an error.\n\nThe BufferedReader(FileReader\
    \ myReader) constructor creates a BufferedReader object from a FileReader object.\
    \ Reading alphanumeric characters from a text file, without a buffer, is not efficient,\
    \ because the file on the hard disk is accessed for each reading operation, and\
    \ this is a relatively slow process. To improve performance the BufferedReader\
    \ object uses an input buffer (in space of RAM). In addition to the int read()\
    \ methods, the BufferedReader class has a String readLine() method which returns\
    \ the line of text. This function will read a line of text from a stream of characters.\
    \ When there are no more lines to read from a text file, the return value is null.\
    \ The void close() will close the source (the stream) of alphanumeric information\
    \ and release any resources associated with it. The BufferedReader also has a\
    \ ready() method, used to prevent errors during a call to read(), that could happen\
    \ when the stream of alphanumeric characters is not ready (for example, during\
    \ online communication).\n\n> Warning! The readLine() will crash when the stream\
    \ of characters does not end with EOL or EOF, when the return value from ready()\
    \ is true.\n\nBecause of all the methods that may throw an IOException during\
    \ the process of reading from a text file, the Java code should be written in\
    \ a try - catch block. It looks like this:\n\n```\ntry {\n    instructions;\n\
    } catch (IOException e) {\n    System.out.println(e.getMessage());\n}\n```\n\n\
    The getMessage() method of the IOException class will print the appropriate error\
    \ message."
