  - "[PAGE 26]\n\n# Foundations of Java Programming for the OOP Option of the IB CS\
    \ Exam\n7. Control flow: loops\n\nThe flow of control (the control flow) in a\
    \ program can be sequential (the computer executes one line of code after another,\
    \ in a sequence) or based on selection (the computer chooses a path or another,\
    \ depending on some condition if , if-else , or switch statements) or based on\
    \ repetition (the computer repeats a loop of code). The loops of code can be controlled\
    \ by counters (in the case of for loops) or by events (in the case of while and\
    \ do ... while loops). To implement repetitive structures the Java language has\
    \ for , while , do, continue , and break keywords.\n\n# 7.1. The FOR loop\n\n\
    The structure of a for loop is this:\n\n```\nfor(initialize_the_counter ; loop_condition\
    \ ; change_the_counter) { instructions;\n```\n\nThe counter is an integer variable\
    \ that exists only for the duration of the loop. The initialize_the_counter instruction\
    \ sets the initial value of the counter. The loop_condition becomes false the\
    \ repetition ends, the computer exits the loop, and the next instruction after\
    \ the for loop structure is executed. The change_the_counter instruction is usually\
    \ an increment (addition of 1) or decrement (subtraction of 1) operation. The\
    \ loop_condition must be related to the value of the counter.\n\nFor one instance\
    \ the curly braces are optional, but still recommended as good programming practice.\
    \ Two or more instructions have be written inside curly braces. We can also have\
    \ nested for loops, when one of the instructions is itself a for loop structure.\n\
    \nThe next program, Java Example 17, finds the sum of the integer numbers from\
    \ 1 to 10. Please notice how the sum is declared and initialized outside of the\
    \ for loop structure.\n\n```\n// Java Example 17\npublic class Main\n{\n    public\
    \ static void main(String[] args)\n    {\n        int sum = 0;\n        for(int\
    \ i=1; i <= 10; i=i + 1)\n        {\n            System.out.println(\"i = \" +\
    \ i);\n            sum = sum + i;\n        }\n        System.out.println(\"1 +\
    \ 2 + ... = \" + sum);\n    }\n}\n```\n\nSometimes the program needs to get out\
    \ of a loop before the loop becomes false. Java does not have a go to instruction,\
    \ like the C programming language, but we can use a break statement in order to\
    \ exit the for loop and go to the next instruction in the program, the first instruction\
    \ after the for loop structure."
- md: "\n# Foundations of Java Programming for the OOP Option of the IB CS Exam\n\n\
    The next program, Java Example 18, finds the sum of the integer numbers from 1\
    \ to 6. This program looks exactly like Java Example 17, with one exception: the\
    \ if(i == 7) break; statement forces the program to stop the addition after the\
    \ first 6 numbers, when the i == 7 condition becomes true.\n\n// Java Example\
    \ 18\n\npublic class Main\n{\n    public static void main(String[] args){\n  \
    \      int sum = 0;\n        for(int i = 1; i <= 10; i = i + 1) {\n          \
    \  if(i == 7) break;\n            System.out.println(\"i = \" + i);\n        \
    \    sum = sum + i;\n        }\n        System.out.println(\"1 + 2 + ... + 6 =\
    \ \" + sum);\n    }\n}\n```\n\nAnother useful instruction is the continue statement.\
    \ This tells the computer to go to immediately the beginning of the loop structure,\
    \ change the counter, and in case of a true loop condition, proceed with the first\
    \ instruction in the loop of code.\n\nThe next program, Java Example 19, finds\
    \ the sum of the integer numbers from 1 to 10, skipping 7. This program looks\
    \ exactly like Java Example 17, with one exception: the if(i == 7) continue statement\
    \ forces the program to skip the addition of number 7.\n\n// Java Example 19\n\
    \npublic class Main\n{\n    public static void main(String[] args){\n        int\
    \ sum = 0;\n        for(int i = 1; i <= 10; i = i + 1) {\n            if(i ==\
    \ 7) continue;\n            System.out.println(\"i = \" + i);\n            sum\
    \ = sum + i;\n        }\n        System.out.println(\"1 + 2 + ... + 10 - 7 = \"\
    \ + sum);\n    }\n}\n```\n\nThe next program, Java Example 20, uses nested loops\
    \ in order to print all the numbers from 0 to 99. The hundred numbers are printed\
    \ on ten rows of ten numbers each. For each of the i values (in the outer for\
    \ loop the program executes the instructions for all of the j values (in the inner\
    \ for loop). A nested for loop structure like this one is often used when working\
    \ with two-dimensional arrays.\n\n```java\n// Java Example 20\npublic class Main\n\
    {\n    public static void main(String[] args)\n    {\n        for(int i = 0; i\
    \ <= 9; i = i + 1) {\n            for(int j = 0; j <= 9; j = j + 1) {\n      \
    \          System.out.print(i + \" \" + j + \" \");\n            }\n         \
    \   System.out.println(\"\"); // new line\n        }\n    }\n}\n```\n\n# 7.2.\
    \ The WHILE and the DO...WHILE loops\n\nIn some situations we don't know how many\
    \ times the loop of code has to be repeated. For example, a program reads text\
    \ from a text file, without knowing how many lines of text the actual file has.\
    \ For such situations we can use while or do ... while loops. The loop condition,\
    \ for these loops, may or not be related to a counter.\n\nThe structure of a while\
    \ loop is:\n\n```java\nwhile(loop_condition) { instructions };\n```\n\nThe structure\
    \ of a do ... while loop is:\n\n```java\ndo { instructions }; while(loop_condition);\n\
    ```\n\nThe while loop checks the loop condition before the execution of the code.\
    \ In some situations the code inside the while loop is never executed. The do\
    \ .. while loop checks the loop condition after the execution of the code. The\
    \ code inside the .. while loop is always executed at least once.\n\nWhen there\
    \ is only one instruction inside the loop, the curly braces are optional. Otherwise\
    \ the curly braces are mandatory. Please notice the semicolon ; at the end of\
    \ the do ... while structure.\n\nThe next program, Java Example 21, finds the\
    \ sum of the integer numbers from 1 to 10 with the help of a while loop.\n\n```java\n\
    // Java Example 21\npublic class Main\n{\n    public static void main(String[]\
    \ args)\n    {\n        int sum = 0;\n        int i = 1; // initialize the counter\n\
    \        while(i <= 10) // check the loop condition\n        {\n            System.out.println(\"\
    i = \" + i);\n            sum = sum + i;\n            i = i + 1; // change the\
    \ counter\n        }\n        System.out.println(\"1 + 2 + ... + 10 = \" + sum);\n\
    \    }\n}\n```\n\nThe next program, Java Example 22, finds the sum of the integer\
    \ numbers from 1 to 10 with the help of a do ... while loop.\n\n```java\n// Java\
    \ Example 22\npublic class Main\n{\n    public static void main(String[] args)\n\
    \    {\n        int sum = 0;\n        int i = 1; // initialize the counter\n \
    \       do\n        {\n            System.out.println(\"i = \" + i);\n       \
    \     sum = sum + i;\n            i = i + 1; // change the counter\n        }\
    \ while(i <= 10); // check the loop condition\n        System.out.println(\"1\
    \ + 2 + ... + 10 = \" + sum);\n    }\n}\n```\n"
  mdcn: "\n\n# IB CS 考试 OOP 选项 Java 编程基础\n\n接下来的程序 Java Example 18 计算从 1 到 6 的整数之和。该程序看起来和\
    \ Java Example 17 完全相同，唯一的区别是：`if(i == 7) break;` 语句强制程序在 `i == 7` 条件为真时，在前 6\
    \ 个数字之后停止加法。\n\n```\n// Java Example 18\n\npublic class Main\n{\n    public static\
    \ void main(String[] args){\n        int sum = 0;\n        for(int i = 1; i <=\
    \ 10; i = i + 1) {\n            if(i == 7) break;\n            System.out.println(\"\
    i = \" + i);\n            sum = sum + i;\n        }\n        System.out.println(\"\
    1 + 2 + ... + 6 = \" + sum);\n    }\n}\n```\n\n另一个有用的语句是 `continue`。它告诉计算机立即回到循环结构的开头，改变计数器，并在循环条件为真的情况下继续执行循环代码中的第一条指令。\n\
    \n接下来的程序 Java Example 19 计算从 1 到 10 的整数之和，跳过 7。该程序看起来和 Java Example 17 完全相同，唯一的区别是：`if(i\
    \ == 7) continue;` 语句强制程序跳过数字 7 的加法。\n\n```\n// Java Example 19\n\npublic class\
    \ Main\n{\n    public static void main(String[] args){\n        int sum = 0;\n\
    \        for(int i = 1; i <= 10; i = i + 1) {\n            if(i == 7) continue;\n\
    \            System.out.println(\"i = \" + i);\n            sum = sum + i;\n \
    \       }\n        System.out.println(\"1 + 2 + ... + 10 - 7 = \" + sum);\n  \
    \  }\n}\n```\n\n接下来的程序 Java Example 20 使用嵌套循环来打印从 0 到 99 的所有数字。一百个数字分十行打印，每行十个。对于每一个\
    \ `i` 值（在外层 `for` 循环中），程序都会执行所有 `j` 值对应的指令（在内层 `for` 循环中）。在处理二维数组时，经常使用这种嵌套的 `for`\
    \ 循环结构。\n\n```java\n// Java Example 20\npublic class Main\n{\n    public static\
    \ void main(String[] args)\n    {\n        for(int i = 0; i <= 9; i = i + 1) {\n\
    \            for(int j = 0; j <= 9; j = j + 1) {\n                System.out.print(i\
    \ + \" \" + j + \" \");\n            }\n            System.out.println(\"\");\
    \ // new line\n        }\n    }\n}\n```\n\n# 7.2. WHILE 和 DO...WHILE 循环\n\n在某些情况下，我们不知道代码循环需要重复多少。例如，程序从文件中读取文本，不知道实际文件有多少行文本。对于这类情况，我们可以使用\
    \ `while` 或 `do ... while` 循环。这些循环的条件可能与计数器相关或无关。\n\n`while` 循环的结构如下：\n\n```java\n\
    while(loop_condition) { instructions };\n```\n\n`do ... while` 循环的结构如下：\n\n```java\n\
    do { instructions }; while(loop_condition);\n```\n\n`while` 循环在执行代码之前检查循环条件。在某些情况下，`while`\
    \ 循环内部的代码可能不会执行。`do .. while` 循环在执行代码后检查循环条件。`do .. while` 循环内部的代码至少会执行一次。\n\n\
    当循环内部只有一条指令时，大括号是可选的。否则，大括号是强制的。请注意 `do ... while` 结构结尾的分号 `;`。\n\n接下来的程序 Java\
    \ Example 21 借助 `while` 循环计算从 1 到 10 的整数之和。\n\n```java\n// Java Example 21\npublic\
    \ class Main\n{\n    public static void main(String[] args)\n    {\n        int\
