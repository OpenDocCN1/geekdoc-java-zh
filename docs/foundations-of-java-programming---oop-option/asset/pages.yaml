  md: '# Foundations of Java Programming for the OOP Option of the IB Exam

    14. Java programs with command line parameters


    A program with command line parameters is executed in a Command Prompt window.
    Please review Chapter 1, Three options for running the HelloWorld program, Section
    1.4, The Command Line interface option ( jav.exe and java.exe ). That program,
    HelloWorld.java , did not use any command line parameters. Now you will type,
    compile, and run a new program, called MyNames.java , that takes the name of a
    person (made of one; two, or more) as the command line input.


    Step 1. Go to the C:\JavaPrograms folder that you created in Chapter 1.


    Step 2. Inside the JavaPrograms folder create a new file. Right-click with the
    mouse, select NewText Document. Change the name of the file from New TextDocument
    to MyNames.java The computer will give you a message that you should ignore.


    > **Warning!** Sometimes you cannot see the file extension, and as a result you
    cannot change it from .txt to java. To make the file extension visible you should
    look for Folder Options (in Windows 8) or Explorer Options (in Windows 10), and
    then unchecked the Hide extensions for files of known type check.


    Step 3. Using Notepad, type the MyNames.java source file, the type of the Java
    Example 54 program, listed on the next page, and then save the file and close
    Notepad.


    At this time you will recognize String[], the input parameter of the main() method,
    as an array of String objects. This array of strings holds all the command parameters.
    We can find the number of command line parameters in args by checking the args,length
    property of this array. The command line parameters, if they exist, are accessed
    using args[0], args[1], ... etc.


    Step 4. Open a Command Prompt window. Search for Command Prompt if you need to
    find.


    Step 5a. Type cd C:\JavaPrograms<ENTER>. This will move the command prompt to
    the JavaPrograms directory (folder), which becomes the current directory.


    Step 5b. Type dir<ENTER>. This will show all the files and folders in the current
    directory (folder). You should see the MyNames.java source file.


    Step 5c. Type set path=C:\Program Files\java\jdk1.8.0_111\bin<ENTER> with no spaces.
    This will tell the compiler to find the javache and the java executable files.


    > **Warning!** If you have a different version of the Java Development Kit (JDK)
    installed, you will have to modify the names in the above path accordingly.


    Step 5d. Type MyNames.java<ENTER>. The java.exe compiler will compile your source
    file into bytecode language, and then it will save the output into a .class file.


    Step 5f. Type java MyNames<ENTER>. Verify that the MyNames.class file is indeed.
    The java.exe interpreter (the Java Virtual Machine) will turn the Bytecode into
    machine code, and then the machine code will get executed, one instruction at
    a time. The machine code is specific to the computer that runs, but since the
    Bytecode language is very close to the actual machine code language, the java.exe
    interpreter is super-fast.


    Step 5g. Type java MyNames again, but this time followed by one, two, or more
    names (words) before you <ENTER>.'
