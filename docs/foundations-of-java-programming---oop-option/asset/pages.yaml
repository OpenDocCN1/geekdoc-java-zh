    22. Quizmaker - an example of a useful Java application


    We now look at a longer Java program, Quizmaker, an example of a Java program
    that has a useful purpose. Many of the Java programming concepts developed so
    far (with help of short, simple Java Examples) are now brought together, to make
    this useful Java application. This is how complexity increases in a system. In
    a similar way, with the help of many simple Lego bricks, you can build very complex
    structures. You may think of all the Java primitive variable types, classes, methods,
    and programming structures (that you have now mastered) as your Lego bricks. Build
    away - have fun programming!


    ![](img/f2c7aa28c73a4748dac938a1e583595e_94_0.png)


    The Java Quizmaker program will make a quiz with multiple choice (matching) questions.
    The program will also make the related answer key. The program starts by reading,
    from a text file, a list of questions and their answers. You can also have a list
    of keywords and their definitions, a vocabulary set in a foreign language, or
    any other kind of matching items.


