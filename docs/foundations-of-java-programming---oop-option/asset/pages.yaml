  md: "# Câlin Galerieu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n\n```\nif (i == 5) System.out.println(\"five\");\nif (i == 6) System.out.println(\"\
    six\");\n```\n\nThis program is very inefficient because it will test all equalities\
    \ every time, for any integer random i. Often the testing will continue even after\
    \ the correct message has been printed. This is wasteful, because another true\
    \ will never be found again. A better option is to use a very long if-else-if-else-if-else-if-else-if-else\
    \ structure, as shown below:\n\n```\nif (i == 1) System.out.println(\"one\");\n\
    else if (i == 2) System.out.println(\"two\");\nelse if (i == 3) System.out.println(\"\
    three\");\nelse if (i == 4) System.out.println(\"four\");\nelse if (i == 5) System.out.println(\"\
    five\");\nelse System.out.println(\"six\");\n```\n\nThe above program is more\
    \ efficient. Once a match is found, the message is printed and the remaining equalities\
    \ are no longer checked. Also, there is no need to check for i == 6 , because\
    \ at this point in the program there is no other available option for the value\
    \ of the integer random number i .\n\n# 6.3. The SWITCH structure\n\nAnother option\
