  md: "# Câlin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ CS Exam\n\nThe answer key to the quiz consists of all the questions from questions2\
    \ (same ones and in the same order as in questions3 ), followed by the correct\
    \ answer found in answers2 at the position with order index i . However, the correct\
    \ answer must be found in answers3 at the position with index j . In other words,\
    \ for each i, questions[i] = questions[j], and the correct answer is answers2[i]\
    \ , which must be equal to answers3[j], the correct answer listed in the answer\
    \ key. We are therefore looking for the j value which solves the equation answers2[i]\
    \ = answers3[j] \n\nWhen we scrambled the answers, we have taken the answer from\
    \ the position with index j = myList.get(i) in answers2 and have written it at\
    \ the position with i in other words, answers[i] = answers2[j] .\n\nLet us relabel\
    \ the index variables. Instead of i we will write j , and instead of j we will\
    \ write i . We can do that, i and j are dummy variables that take all the values\
    \ from 0 to nQuiz-1, and each i in this set is related to a j in the same set.\
    \ The relations from the above paragraph become i = myList.get(j) and answers[j]\
    \ = answers2[i] .But this last equation is exactly the relation we were looking\
    \ for! It happens when i = myList.get(j) .\n\nTo summarize, for a question with\
    \ position index i and number i + 1 in the quiz, the answer is the letter (char)\
    \ (65 + j ), where the value of j is the equation i = myList.get(j) . The program\
    \ solves this equation by guess and check, testing all possible values of j until\
    \ a match is found.\n\n![](img/f2c7aa28c73a4748dac938a1e583595e_102_0.png)"
