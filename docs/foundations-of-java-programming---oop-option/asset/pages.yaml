  md: "# Călin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ CS Exam\n\nThe next program, Java Example 3, shows how to print \"Hello World!\"\
    \ using text strings.\n\n```\n// Java Example 3\npublic class Main\n{\n    public\
    \ static void main(String[] args) {\n        String word1; // a declaration statement\n\
    \        word1 = \"Hello\"; // an assignment statement\n        String word2 =\
    \ \"World\"; // an initialization statement\n        System.out.println(word1\
    \ + \" \" + word2 + \"!\");\n    }\n}\n```\n\nA variable in a program that is\
    \ assigned a value once, being initialized at compile time, is called a constant.\
    \ In Java constants are declared using the final keyword. This will prevent an\
    \ accidental change of the value of the constant. Most often the static keyword\
    \ is also used, to make the constant available inside the program without an instantiated\
    \ (created) object.\n\n> **Warning!** Please note that in Java static function,\
    \ the static void main() function, can only access static methods, variables,\
    \ or constants from the outside of the respective function.\n\nThe next program,\
    \ Java Example 4, uses an int constant named SOS that has a value of 505.\n\n\
    ```\n// Java Example 4\npublic class Main\n{\n    static final int SOS = 505;\n\
    \n    public static void main(String[] args) {\n        System.out.println(\"\
    SOS = \" + SOS);\n    }\n}\n```\n\nJava has some [naming conventions]() that you\
    \ should follow.\nThe names of variables, methods, and objects are written without\
    \ underscores, starting with a lower case. Separation between more words is done\
    \ with upper letters.\nExamples: **i , age , maxSpeed , numberOfPeople , main(),\
    \ myBook , getName()**\nThe names of classes are written without underscores,\
    \ starting with an upper case letter. Separation between more words is done with\
    \ upper case letters.\nExamples: **String , Random , Book , Sprite ,Board**\n\
    The names of constants are written with underscores, using only upper case letters.\n\
    Examples: **X , LENGTH , MAX_HEIGHT , NUMBER_OF_PIXELS**"
