  md: "# Câlin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ CS Exam\n\n# 8. Functions: input and output values, formal and actual parameters\n\
    \nRemember that in mathematics a function f has a set of input values (domain\
    \ of the function, the set of all possible x values), a set of output values (the\
    \ range of the function, the set of all possible y), and a relationship y = f(x)\
    \ that provides a unique output y for every input x. In computer programming functions\
    \ work in the same way, with the mention that a function may not have an input\
    \ value, an output value, or both. In Java functions are called methods. The main\
    \ method used so for has an array of strings (String args) as the input value,\
    \ and nothing (void) as the output value. Notice how, in the declaration of a\
    \ function, the return type (the variable type of the output value) is written\
    \ in front of the name of function, while the names and types of input parameters\
    \ are written in round brackets after the name of that function.\n\nThe next program,\
    \ Java Example 25, demonstrates how to print \"Hello World!\" using a function\
    \ printGreeting() that has no input parameters (empty brackets ()) and no output\
    \ value (void).\n\n```\n// Java Example 25\npublic class Main\n{\n    public static\
    \ void main(String[] args)\n    {\n        printGreeting();\n    }\n\n    static\
    \ void printGreeting()\n    {\n        System.out.println(\"Hello World!\");\n\
    \    }\n}\n```\n\nThe next program, Java Example 26, demonstrates how to print\
    \ \"Hello World!\" using a function named printGreeting() that has one input parameter\
    \ ( an object of type String ) and no output value ( void ).\n\n```\n// Java Example\
    \ 26\npublic class Main\n{\n    public static void main(String[] args)\n    {\n\
    \        String greeting = \"Hello World!\";\n        printGreeting(greeting);\n\
    \    }\n\n    static void printGreeting(String text)\n    {\n        System.out.println(text);\n\
    \    }\n}\n```"
