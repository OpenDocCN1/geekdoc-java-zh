  md: "# Foundations of Java Programming for the OOP Option of the IB CS Exam\n\n\
    The object named text shows up in the definition of the printGreeting() function\
    \ is called a formal parameter (a formal greeting). The object named greeting\
    \ shows up in the function call of printGreeting() function is called an actual\
    \ parameter (an actual argument). During execution of the printGreeting() function,\
    \ the value of greeting (the actual parameter) is assigned to text (the formal\
    \ parameter) inside the body of the printGreeting() function. It is possible to\
    \ give both the formal parameter and the actual parameter name, since these two\
    \ \"variables\" (text objects of class String ) exists in different places (inside\
    \ the body of different functions). The greeting object (the actual parameter)\
    \ exists only inside the body of the main() function, while the text object (the\
    \ parameter) exists only inside the body of the printGreeting() function.\n\n\
    The next program, Java Example 27, demonstrates how to print \"Hello World!\"\
    \ using a function greeting() with no parameters and an output value of type String\
    \ . The output value of the function is given using the return key. When the program\
    \ reaches a return it returns the text of the body of the function, and returns\
    \ the function's output value to the instruction that has called the function.\
    \ At that, inside the text = greeting(); line, the greeting() function to the\
    \ right of the equal sign is in replaced by \"Hello World!\", the returned output\
    \ value.\n\n```\n// Java Example 27\npublic class Main\n{\n    public static void\
    \ main(String[] args)\n    {\n        String text;\n        text = greeting();\n\
    \        System.out.println(text);\n    }\n\n    static String greeting()\n  \
    \  {\n        return \"Hello World\";\n    }\n}\n```\n\nThe next program, Java\
    \ Example 28, demonstrates the use of a function named lazyStudent() (that does\
    \ nothing) with an input parameter of type String and an output value of type\
    \ String .\n\n```\n// Java Example 28\npublic class Main\n{\n    public static\
    \ void main(String[] args) {\n        String x = \"Hello World\";\n        String\
    \ y = lazyStudent(x);\n        System.out.println(y);\n    }\n\n    static String\
