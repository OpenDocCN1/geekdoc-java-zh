  md: "# Câlin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ CS Exam\n\n# 16. Random Numbers\n\nRandom numbers are very important in computer\
    \ programming because many video games ♥♥ need them. Many computer simulations\
    \ of real life also need Java. Java has options for generating random numbers:\
    \ the Math.random() method, the Random class, and the shuffle method of the Collections\
    \ class.\n\n# 16.1. Generating random numbers using the Math.random() method\n\
    \nThe simplest way to generate a random number in Java is to call the static random()\
    \ method of the Math class. Math.random() returns a real number (of type double)\
    \ in the [0, 1) interval.\n\n+   * Math.random() -> real random number in the\
    \ [0, 1) interval\n* MAX*Math.random() -> real random number in the [0, MAX) interval\n\
    * MIN + (MAX - MIN)*Math.random() -> real random number in the [MIN, MAX) interval\n\
    \nTo change a number of double into an int we use the typecasting operator (int)\
    \ in the front of the numerical expression of double. The real number will be\
    \ truncated (rounded down) to an integer, and the fractional part of the real\
    \ number will be ignored. If N and M are two integers, with N < M -> real random\
    \ number in the [0, N) interval\n\n+   * N*Math.random() -> integer random number\
    \ in the {M, M+1, ..., N-1} set\n* (int)(N*Math.random()) -> integer random number\
    \ in the {0, 1, ..., N-1} set\n* (int)(N*Math.random() + M) -> integer random\
    \ number in the {M, M+1, ..., M+N-1} set\n\n| In particular, to generate an integer\
    \ random number in the | {1, 2, 3, 4, 5, 6} set, we use the line: |\n| int = (int)(6*Math.random()\
    \ + 1); // roll of the die |\n\nSometimes it is helpful to define a function that\
    \ generates an integer random number from MIN to MAX. According to the above discussion,\
    \ MIN = M and MAX = M+N-1. These two equations are equivalent to M = MIN and N\
    \ = MAX-MIN-1.\n\n(int) ((MAX - MIN+1)*Math.random() + MIN) -> integer random\
    \ number in {MIN, MIN+1, ..., MAX} set\n\n```\n// JAVA Example 58\npublic class\
    \ Main\n{\n    public static void main(String[] args) {\n        int i = (int)(6*Math.random()\
    \ + 1); // roll of the die\n        System.out.println(\"roll of the die : \"\
    \ + i);\n    }\n}\n```"
