  md: '# Câlin Galeriu Foundations of Java Programming for the OOP Option of the IB
    CS Exam


    > **Warning!** Objects of type Float or Integer are not the same thing primitive
    variables of type float or int. An Integer object contains a long variable and
    some auxiliary methods. We say that the Integer class is a wrapper class. You
    will find more information about the Java wrapper classes in Chapter 16.


    Please notice that the myList.remove(4); line does not remove the Integer 4, but
    instead removes the String object "coconut", whose index is equal to 4.


    If all the objects in a list are of the same class


    # 15.2. Important methods of the ArrayList class : add(), get(), remove(), indexOf(),
    clear(), size(), isEmpty()


    The add(object) method adds an object at the end of the list.


    The add(index,object) method adds an object in the list, at the position given
    by the index.


    The get(index) method returns the object found in the list at the position given
    by the index.


    The remove(object) method removes the object found in the list at the position
    given by the index.


    The remove(object) method removes the object from the list, the first time it
    is found.


    The indexOf(object) method returns the index of the object, the first time it
    is found, or -1 if the object is not found in the list.


    The clear() method removes all the elements from the list.


    The size() method returns the number of objects in the list.


    The isEmpty() method returns true when the list is empty, otherwise it returns
    false.


    For a list of all methods of the ArrayList class, please go to:

    https://www.javatpoint.com/java-arraylist


    # 15.3. The LinkedList class


    The objects in a LinkedList are connected like links in a chain. In technical
    terms we say that LinkedList is a doubly linked list, which means that each element
    of the list knows the locations in RAM (the addresses) of its previous element
    and its next element. If there is no previous element (it happens for the first
    element of the list) then the recorded address is NULL. If there is no next element
    (it happens for the last element of the list) then the advantage of this implementation
    is that when an old object is deleted from the list, or when a new object is inserted
    into the list, all the other objects keep their locations in RAM, and the deletion
    and insertion operations are very fast. The disadvantage of this implementation
    is that the objects are less quickly accessed, the Java program has to travel
    down the list, using the RAM addresses provided by the list, until it finds the
    object it is looking.


    The next program, Java Example 56 , demonstrates how a LinkedList is created,
    populated with objects of type String, and how these objects are listed in order.'
