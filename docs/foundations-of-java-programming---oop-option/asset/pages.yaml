    \ the function). The new keyword reserves memory in RAM for the newly created\
    \ object. The address where this object is located in RAM is held in greeting\
    \ , which now serves as an object reference (memory address, pointer). In other\
    \ words, greeting is the name of a Java object and at the time it is the name\
    \ of a variable that holds the memory address of that object. The greeting object\
    \ is initialized with the"
