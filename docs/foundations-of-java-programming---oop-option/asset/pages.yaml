  md: '# Câlin Galieru Foundations of Java Programming for the OOP Option of the IB
    Exam 18. Object-Oriented Programming: Inheritance


    Inheritance is a fundamental feature of Object-Oriented Programming. Inheritance,
    refers to the transfer of some property (money, houses, valuable objects) from
    a dead person to his or her children, other family members, or friends.


    In inheritance describes the transfer, from one class (the parent class) to another
    class (the child class), of all the non-private field variables, methods, and
    classes of the parent class.


    The parent class is also thesuperclass, or the base class. The child class is
    also called the subclass, or the derived class. The child class does not inherit
    the constructor(s) of the parent class, the default constructor of the child class
    always starts by calling the default constructor of the parent class. (Not needed
    for the IB exam: a constructor of the child class can call a constructor of the
    parent class using the super()).


    In Java inheritance is implemented using the extends keyword in the declaration
    of the child class. The parent class must be declared in the Java program before
    the child class is declared.


    ```

    class ParentClass { ... }

    ```


    ```

    class ChildClass extends ParentClass { ... }

    ```


    In this way of type ChildClass will have all the non-private field variables,
    methods, and objects of an type ParentClass. The ChildClass class can also have
    additional field variables, methods, and objects, which the ParentClass class
    does not have.


    The biggest advantage of inheritance is the ability of the child class to reuse
    code written for the parent class. Inheritance also not shortens the development
    time of a new program, but also results in better structured and more robust programs,
    since usually the code of the parent class has been optimized and is well tested
    against all kinds of errors.


    The program shown in Java Example 62 has three classes. The public Main class
    has the static main() method, which is the entry point into the program. The Book
    parent class (superclass) has two field variables, title and author , and one
    method, printInfo(). The Textbook class (subclass) has an additional field variable,
    subject , and another method, printInfo(). The MyText object, which is an instance
    of the Textbook class class, has the three field variables and the two methods
    listed above. By the myText object created (instantiated), all its field variables
    are given values, and all its methods are called from the main() method. There
    is no distinction between field variables and methods that are inherited, and
    field variables and methods that are not inherited. They work in the same way,
    as if the Java lines of code from the body of the Book parent class were copied
    and pasted inside the body of the Textbook child class.'
