    # 17. Object-Oriented Programming: Encapsulation


    # 17.1. Accessor (getter) and mutator (setter) methods


    Encapsulation is a fundamental feature of Object-Oriented Programming. A capsule,
    in general, is a small container with some protected content inside. Think about
    a pharmaceutical capsule (a gelatinous case holding the medication), a space capsule
    (a small spacecraft protecting the astronauts during landing), or a time capsule
    (a small box with objects saved for future times).


    In encapsulation describes the protection of some instance variables inside.


    In Java encapsulation is implemented using the private keyword in front of the
    protected instance variables (field variables). As a consequence these protected
    field variables can be accessed (read or written) by the same method. Usually
    the objects have dedicated public methods that read from RAM the value of the
    private instance variables, called accessor methods (also called getter methods),
    and dedicated methods that write into RAM the value of the private instance variables,
    called mutator methods (also called setter methods). How to remember the "mutator"
    name? Think that in biology mutation is a change in the data. A mutator method
    brings a change of value.


    The biggest advantage of encapsulation is that the protected variables are safe
    from unauthorized access. Direct access is still granted through the public accessor
    (getter) and mutator (setter) methods, or through other public methods of that
    class. Encapsulation minimizes the chance of an accidental corruption of the data,
    since in the chance of a programming error with that effect. Encapsulation is
    a form of abstraction, it hides from the implementation details of accessor and
    mutator methods. As a result the maintenance and/or the modification of accessor
    and mutator methods is done easier, without making any changes in the classes
    that are accessing (reading or writing) the protected instance variables.


    You have already seen an example of encapsulation in Java Example 36. In that
    program the private my text string is set by the MyHello() constructor and then
    is printed out by the printGreeting() function. We expand the Java Example 36
    by adding accessor (getter) and mutator (setter) methods.


    The program in Java Example 61 has two classes. The public Main class has the
    static main() method, which is the entry point into the program. The MyHello class
    has one instance variable, the private my text object. This private instance variable
    can be read or written only by the public methods of the MyHello class: MyHello(),
    printGreeting(), setText(), and getText().


    The greeting object is declared and instantiated (in the first line of the main
    method). The greeting.myText instance variable is given the initial value of "Hello
    World!" by the MyHello constructor. Next, the initial value of greeting.myText
    is changed into "I Love Computer!" by the setText() mutator method. This new value
    of greeting.myText is read by the getText() accessor method, which returns the
    value of this private text string. The new message is printed on the screen by
    the System.out.println() method.'
