  md: "# Călin Galerieu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n5. Operators: arithmetic, relational, and logical\n\n# 5.1. The\
    \ Java arithmetic operators\n\nThe Java arithmetic operators have numbers as input\
    \ and numbers as output.\n\n| The Java arithmetic operators are +, -, *, /, %,\
    \ ++ | |\n| + (addition) Example: 13 + 5 = 18 |\n| (subtraction) Example: 13 -\
    \ 5 = 8 |\n| * (multiplication) Example: 13 * 5 = 65 |\n| / (division) Example:\
    \ 13.0 / 5.0 = 2.6 |\n| / (integer division) Example: 13 / 5 = 2 This is the quotient\
    \ of an integer division. |\n| % (modulus) Example: 13 % 5 = 3 This is the remainder\
    \ of an integer division. |\n| ++ (increment) Example: 13++ = 14 |\n| -- (decrement)\
    \ Example: 5-- = 4 |\n\n> Warning! It is very easy to make mistakes because x++\
    \ (post-increment) is not the same as ++x (pre-increment), and x-- is not the\
    \ same as --x (pre-decrement).\ny=x++; means {y = x; x = x + 1; }; while y++x\
    \ means {x = x + 1; y = x; }\ny=x--; means {y = x; x = x - 1; }; while y--x means\
    \ {x = x - 1; y = x; };\n\nIB Course: Use x = x + 1 instead of x++ or ++x, and\
    \ x = x - 1 instead of x-- or --x .\n\nThe next program, Java Example 9, demonstrates\
    \ how to do simple arithmetic calculations.\n\n```\n// Java Example 9\npublic\
    \ class Main\n{\n    public static void main(String[] args)\n{\n        int i\
    \ = 13;\n        int j = 5;\n        double x = 13.0;\n        double y = 5.0;\n\
    \        System.out.println(i + j); // output: 18\n        System.out.println(i\
    \ - j); // output: 8\n        System.out.println(i * j); // output: 65\n     \
    \   System.out.println(x / y); // output: 2.6\n        System.out.println(i /\
    \ j); // output: 2\n        System.out.println(i % j); // output: 3\n        System.out.println(i\
    \ / y); // output: 2.6\n    }\n}\n```"
