    The charAt(i) method returns the character at the position by index i in the text
    string (of the instantiated String object). The index of the first character is
    0. The output value is of char.


    The indexOf(String text) method returns the first position where a character or
    the text subst is found inside the text of the instantiated String object. If
    no match is found, the method returns -1. The output value is of type int.


    The compareTo(String text) method compares two text letters by letter, starting
    with the first if the two strings are identical, the method returns 0. Otherwise,
    the method returns the difference of the Unicode values for the first time when
    compared alphanumeric characters do not. The value of text is extracted from the
    Unicode value from the instantiated String object. The output value is of type
    int.


    The toUpperCase() method changes all the letters in the instantiated String object
    to upper case. The output value is of type String.


    The toLowerCase() method changes all the letters in the instantiated String object
    to lower case. The output value is of type String.


    The format (...) is a static String class that returns a formatted text String.
    Because it is static , it does not require an instantiated String object, like
    the other String methods presented here. The output value is of type String. This
    method is not required for the IB CS exam.


    The general pattern of a format specifier is %[flags][width].[precision]conversion_character
    , where the parameters in brackets are optional.


    The flags used by format() are:


    +   - = left-justify ( default is to right-justify )

    + = write a "*" sign in front of positive numerical values

    0 = write "0" characters in front of numerical values, for padding

    , = use comma as a grouping separator for numerical values greater than one thousand

    = write a " " in front of positive numerical values


    The width is the minimum number of alphanumeric characters to be written.


    The precision is the number of decimal places in a floating number.


    The conversion characters used by format() are:


    +   %d = decimal number

    %f = floating number

    %c = character (% C for upper case )

    %s = text string (% S for upper case letters everywhere in the text string )

    %h = hashcode ( A hashcode substitute for the hidden RAM address. )

    %n = newline ('' n can be used as well, with less compatibility )


    There are other useful String methods, not required for the IB Computer Science
    exam: concat(), equalsIgnoreCaseCase(), isEmpty(), lastIndexOf(), replace(), replaceAll(),
    toCharArray(), value() . For a list of all the methods of the String class, please
    go to:


    www.tutorialspoint.com/java/java_strings.htm'
