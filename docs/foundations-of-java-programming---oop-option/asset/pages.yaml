  md: '# Câlin Galerieu Foundations of Java Programming the OOP Option of the IB CS
    Exam

    21.2. Writing into a text file in sequential order


    Writing into text files is done with the help of objects of type (class) File,
    FileWriter, BufferedWriter, and PrintWriter.


    The File(String pathname) constructor creates a File from a path name. The path
    name specifies the directory and the file name. An example of a path name is "C:\TestFiles\abc.txt".


    The FileWriter(File file) constructor creates a FileWriter from a File object.
    If the file with the given path name does not exist, this constructor will create
    it.


    > Warning! If the file with given path name exists, this constructor will erase
    all the previous information stored in the text file. In order to save the old
    information, and append the new information (add the new information at the end
    of the text file), we have to use the BufferedWriter(File file, constructor).


    The BufferedWriter class has methods that write alphanumeric characters to the
    text file. The public void write(char c) method will write only one alphanumeric
    character, as given in an array. The public void write(String string) method will
    write a sequence of strings. These methods will throw an IOException whenever
    there is an error.


    The PrintWriter(BufferedWriter bw) constructor creates a BufferedWriter object
    from a FileWriter object. Writing alphanumeric characters into a text file, but
    without a buffer, is not very efficient, because the text file on the hard disk
    is costly for each operation, and this is a relatively slow process. To improve
    performance the BufferedWriter uses an output buffer (a space in RAM) or of default
    size, it holds information that is waiting to be written into the text file. In
    addition to the write() methods, the BufferedWriter class has a void newLine()
    method that will write a line separator (an EOL). The close() method will flush
    the buffer (that it will write all of the information into the text file), close
    the text file, and release any system resources associated with it.


    The PrintWriter(BufferedWriter bw) constructor creates a PrintWriter from a BufferedWriter
    object. In addition to the well-known print() and println() methods, the PrintWriter
    class has a very useful printf() method. We also get formatted output with the
    System.out.printf() and the String.format() methods . The meaning of "formatted
    output" Special symbols are used inside a text string. These symbols act as placeholders
    for various types, describing the type of variable, the total number of number
    of decimal places, and other formatting details. The general syntax of the format
    is %[flag][width].precisionconversion_character symbols (conversion characters)
    for formatted output.


    ```

    %d = decimal integer number (Example: %5d for a number written with 5 characters
    )

    %f = floating point number (Example: %6.2f for a number written with 6 characters,
    including the decimal point, and 2 decimal places )

    %c = alphanumeric character ( %C = alphanumeric character with uppercase letter
    )

    %s = text string ( %S = text with uppercase letter )

    %h = hashcode ( A hashcode is a Java identifier derived from a RAM address. )

    %n = new line

    ```


    Because all the methods that may throw an IOException during the process of writing
    into a text file, the Java code has to be inside a try - catch block.'
