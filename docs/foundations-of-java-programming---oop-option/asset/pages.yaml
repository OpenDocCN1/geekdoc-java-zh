  md: '# Câlin Galileiu Foundations of Java Programming for the OOP Option of the
    IB CS Exam

    12. Java objects: 1D and 2D arrays


    In one dimensional (1D) arrays are objects that hold a given number of elements
    of the same type, stored in memory in a sequential order. These elements can be
    variables of a primitive type, or objects of a given class. First an array has
    to be declared. This will the Java compiler to know the name of the array and
    the data type of the array elements. The array has to be instantiated. At this
    step the Java compiler reserves space in RAM for the array, and gives the array
    elements their default values (zero, null, etc.). After these two steps the array
    elements can be reassigned new values. The elements of the array are identified
    with the help of an index, an integer counter starts from zero, like this: array_name[index]


    Warning! The fact that in Java array index starts at zero can be a bit confusing,
    especially since in mathematics and in other programming languages (for example
    in Pascal) the array index starts at one. For the same reason the index of the
    last element in a Java array with n elements is not n, but n-1.


    ![](img/f2c7aa28c73a4748dac938a1e583595e_48_0.png)


    The declaration of an array can be done in two equivalent ways:


    data_type[] array_name;


    data_type array_name[];


    the first method being the preferred one.


    The instantiation of an array is done in this way:


    array_name = new data_type[size];


    where the size of the array is the number of elements stored in the array.'
