  md: '# Călin Galeriu Foundations of Java Programming for the OOP Option of the IB
    CS Exam


    Step 4. Open a Command Prompt window. Search for Command Prompt if you need to
    find it.


    Step 5a. Type cd C:\JavaPrograms<ENTER>. This will move the command prompt to
    the JavaPrograms directory (default), which becomes the current directory.


    Step 5b. Type dir<ENTER>. This will show all the files and folders in the current
    directory. You should have the HelloWorld.java source file.


    Step 5c. Type set path=C:\Program Files\jdk8.0_151\bin<ENTER> with no extra spaces.
    This will tell the compiler where to find the java.exe and the java.exe executable
    files.


    > Warning! If you have a different version of the Java Development Kit (JDK) installed,
    then you will need to modify the numbers in the above path accordingly.


    Step 5d. Type javac HelloWorld.java<ENTER>. The java.exe compiler will compile
    the source file into Bytecode language and then it will be compiled into HelloWorld.class,
    a .class file. At this step some students get confused because "nothing happens".
    Be happy if your computer doesn''t print anything now, because this means there
    is no error message!


    Step 5e. Type dir<ENTER>. Verify that the HelloWorld.class file is indeed there.


    Step 5f. Type java HelloWorld<ENTER>. The java.exe interpreter (the Java Virtual
    Machine) will turn the Bytecode into machine code, and then the machine code will
    get executed, one instruction at a time. The machine code is specific to the computer
    that runs the program, but since the Bytecode language is very close to the actual
    machine code language, the java.exe interpreter is super-fast.


    A successful compilation and execution of the Java program looks like this:


    ```

    Command Prompt

    <c> 2013 Microsoft Corporation. All rights reserved.

    C:\Users\Galin> C:\JavaPrograms

    C:\JavaPrograms>set path=C:\Program Files\jdk8.0_151\bin

    C:\JavaPrograms>javac HelloWorld.java

    C:\JavaPrograms>java HelloWorld

    Hello World!

    C:\JavaPrograms>_

    ```'
