    1.2. Installing the NetBeans Java Integrated Development Environment


    When you are downloading and installing the NetBeans Integrated Development Environment
    (IDE) you are also downloading and installing the Java Development Kit (JDK) with
    Java 8.


    +   Step 1. Go to:

    https://www.oracle.com/technetwork/java/javase/downloads/jdk-netbeans-jsp-3413139-esa.html

    Step 2. Check the License Agreement option.

    Step 3. Click on the appropriate download link. For a not too old PC running the
    Windows operating system, the file to download is jdk-u8111-nb-8_2-windows-x64.exe


    > Warning! You need to have PC administrator rights in order to move forward with
    the installation process.


    Step 4. Click on the downloaded.

    Step 5. Click on the Next button three times, then click the Install button.

    Step 6. Uncheck the box that says "Contribute to the NetBeans project by providing
    anonymous usage data" and then click the Finish button.

    Step 7. Double click on the NetBeans shortcut link on the desktop whenever you
    want to launch the NetBeans Integrated Development Environment (IDE).


    ![](img/f2c7aa28c73a4748dac938a1e583595e_6_0.png)


    # 1.3. The NetBeans Java Integrated Development Environment option


    After downloading and installing the NetBeans IDE, you are ready to type, compile,
    and execute the HelloWorld Java program in this programming environment.


    +   Step 1. Double click on the NetBeans shortcut link on the desktop.

    Step 2. From the menu FileNew Project... or click on the New Project button.

    Step 3. In the New Project the Java Application option should already be selected.
    Click on the Next button.

    Step 4. In the New Java Application window type the HelloWorld project name. The
    Create Main Class checkbox should be checked. Click on the Finish button.


    The HelloWorld project name was used by NetBeans in three different places. The
    name of the newly created Java source file is HelloWorld.java , the name of the
    related Java package is helloworld , and the name of the related Java class is
    HelloWorld.


    ![](img/f2c7aa28c73a4748dac938a1e583595e_6_1.png)'
