  md: '# Foundations of Java Programming for the OOP Option of the IB CS Exam


    # 9.3. Important methods of the String class : equals(), substring(), length(),
    charAt() , indexOf(), compareTo()


    The StringBuffer class is more powerful than the String class. It is designed
    for text strings that change often. Objects of the String class are immutable,
    this means that when an old String object is modified the program has to place
    the new String into a new location in RAM, the old String object, unmodified,
    keeps its place in RAM. When StringBuffer objects are modified they stay in the
    same place in RAM. This increases the speed of the program, and also reduces the
    amount of computer memory that is used.


    > Warning! Unlike an object of the String class, for which there is a shortcut,
    an object of the StringBuffer class has to be created using the new keyword and
    the StringBuffer constructor().


    Notice the difference in which a String and StringBuffer object are instantiated:

    String fruit = "banana"; with shortcut and StringBuffer fruit = new StringBuffer("banana");
    without.


    It is very important to realize that, even though the String associated with a
    given StringBuffer class object is not listed as an input parameter, it is provided
    to each of the StringBuffer class methods. These methods require an instantiated
    StringBuffer object. The name of the instantiated StringBuffer object goes in
    front of the name of the String class, the two being separated by a dot.


    The equals(StringBuffer text) method compares the string of the instantiated StringBuffer
    object with the text of the text object, and returns true when the two strings
    are identical, or false otherwise. The output value is of type boolean.


    > Warning! Do not use the == symbol to compare the strings stored in StringBuffer
    objects!


    The substring(startPos, endPos) method returns a part of the original string (of
    the instantiated StringBuffer object). The startPos index gives the position of
    the first alphanumeric character of the selected substring, and the endPos index
    gives the position of the first character after the selected substring. The output
    value is of type String. When the second argument endPos is missing, the substring
    goes all the way to the end of the original string.


    The length() method returns the number of alphanumeric characters in the text
    string (of the instantiated StringBuffer object). The output value is of type
    int.


    The charAt(int i) method returns the character at the position given index i in
    the string (of the instantiated StringBuffer object). The index of the first character
    is 0. The output value is of type char.


    The indexOf(String text) method returns the first position where a character or
    the text substring is found inside the text of the instantiated StringBuffer.
    If no match is found, the method returns -1. The output value is of type int.


    The compareTo(StringBuffer text) method compares two strings by letter, starting
    with the first. If the two strings are identical, the method returns 0. Otherwise,
    it returns the difference of the Unicode values for the first time when the alphanumeric
    characters don''t match. The Unicode value from text is subtracted from the Unicode
    value from the instantiated StringBuffer object. The output value is of type int.


    There are other StringBuffer methods, not listed for the IB Computer Science exam:
    append(), reverse(), delete(), insert(), replace(). For a list of the methods
    of the StringBuffer class, please go to: www.tutorialspoint.com/java/java_string_buffer.htm'
