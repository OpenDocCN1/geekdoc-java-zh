  md: "# Foundations of Java Programming for the OOP Option of the IB CS Exam 15.\
    \ Java objects: the ArrayList and the LinkedList classes\n\nJava has two important\
    \ classes that can be used to handle a list of objects. These are the ArrayList\
    \ and the LinkedList classes, both implemented in the java.util package. Instantiated\
    \ objects of the ArrayList and LinkedList classes can be used to implement a general\
    \ type of list, stack, or a queue.\n\n# 15.1. The ArrayList class\n\nThe objects\
    \ in an ArrayList are ordered by index, just like the elements of an array. The\
    \ advantage of this implementation is that the objects are very quickly accessed,\
    \ the Java program knows where the objects are in RAM. The disadvantage of this\
    \ implementation is that when an object is deleted from the list, or when a new\
    \ object is inserted into the list, all the subsequent objects have to change\
    \ their locations in RAM, because their index changes. Unlike an array of objects,\
    \ the size of an ArrayList can increase to accommodate more objects added to the\
    \ list.\n\nThe next program, Java Example 55, demonstrates how an ArrayList is\
    \ created, populated with objects of type String, Float, or Integer, and how these\
    \ objects are then listed in order. Notice the different ways in which the list\
    \ elements can be printed, by using the for loop or by using the list name.\n\n\
    ```\n// Java Example 55\nimport java.util.ArrayList;\npublic class Main {\n  \
    \  public static void main(String[] args) {\n        ArrayList myList = new ArrayList();\n\
    \        myList.add(\"apple\"); // the object with index 0\n        myList.add(\"\
    banana\"); // the object with index 1\n        myList.add(3.1416); // the object\
    \ with index 2\n        myList.add(4); // the object with index 3\n        myList.add(\"\
    coconut\"); // the object with index 4\n        myList.add(\"pumpkin\"); // the\
    \ object with index 5\n        for(int i=0; i<myList.size(); i++) {\n        \
    \    System.out.println(myList.get(i));\n        }\n        myList.remove(4);\
    \ // remove the object with index 4, \"coconut\"\n        myList.remove(\"banana\"\
    ); // remove the object \"banana\"\n        myList.remove(3.1416); // remove the\
    \ object 3.1416\n        System.out.println(myList);\n        myList.add(1, \"\
    cheese\"); // add the object \"cheese\" in the second place\n        myList.add(0,\
    \ \"steak\"); // add the object \"steak\" in the first place\n        myList.add(5,\
    \ 505); // add the object 505 in the last place\n        System.out.println(myList);\n\
    \    }\n}\n```"
