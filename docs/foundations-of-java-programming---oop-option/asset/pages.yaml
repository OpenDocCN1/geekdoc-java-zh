  md: "# Călin Galieru Foundations of Java Programming for the OOP Option of the IB\
    \ CS\n19. Object-Oriented Programming: Polymorphism\n\nPolymorphism is a fundamental\
    \ feature of Object-Oriented Programming. In Greek \"polys\" means\n\"many\" or\
    \ \"much\" or \"orphe\" means \"form\" or \"shape\". In general polymorphism refers\
    \ to a\nsituation in which something has different shapes, forms, behaviors, etc.\n\
    \nIn Java polymorphism describes a situation where a unique method name is associated\
    \ with several\ndifferent behaviors. If we identify a method not by name, but\
    \ by its body (the code), then\npolymorphism means we can have different methods\
    \ with the same name.\n\nIn there are two types of polymorphism: compile time\
    \ polymorphism (due to method\noverloading) and run time polymorphism (due to\
    \ method overriding).\n\n# 19.1. Method overloading (compile time polymorphism)\n\
    \nIn the same class can have two or more different methods with the same name,\
    \ but with different\ntypes or types of input parameters. Each can use method\
    \ overloading. Java decides which method\nto call (use) when the program is compiled,\
    \ together with the number or the types of the input variables.\nThe number of\
    \ parameters of a function, together with the type (primitive type or class\n\
    type) of each input parameters, is called the signature of the function.\n\n>\
    \ **Warning!** One should also remember that the type of the output variable (return\
    \ type of a function)\ncannot be used in Java to distinguish between two functions\
    \ (methods) with the same name and\nwith the same signature (the number and the\
    \ type of input parameters).\n\nNot only methods can show polymorphism, arithmetic\
    \ operators can also have polymorphic\nbehavior. The \"+\" addition operator can\
    \ add two numbers, or concatenate two text strings. The \"/\ndivision operator\
    \ can divide two real numbers (with no rounding of the answer), or divide two\
    \ integer\nnumbers (with the rounding down of the answer to integer value).\n\n\
    The next program, Java Example 65, demonstrates the polymorphic behavior of the\
    \ division operator.\n\n```\n// Java Example 65\npublic class Main\n{\n    public\
    \ static void main(String[] args)\n    {\n        System.out.println(\"12 / 5\
    \ = \" + 12/5); // output : 2\n        System.out.println(\"12.0 / 5.0 = \" +\
    \ 12.0/5.0); // output : 2.4\n    }\n}\n```\n\nThe next program, Java Example\
    \ 66, uses the vectorLength() method to calculate the length (the\nmitude) of\
    \ a vector. There are four different implementations of the method, all with the\
    \ same name,\nbut each with different numbers of input parameters. This is a case\
    \ of method overloading. We have a\nvectorLength() implementation for one dimensional\
    \ vectors, another one for two dimensional vectors,\nanother for three dimensional\
    \ vectors, and another for four dimensional vectors. The length of"
