  md: "# Călin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ CS Exam\n\nThe next program, Java Example 12, prints \"WINNER!\" whenever the\
    \ integer number i happens to be 6. The program doesn't print \"WINNER!\" otherwise.\
    \ Please notice that the round brackets around i ==6 tested condition are mandatory.\n\
    \n```\n// Java Example 12\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        int i = (int)6*Math.random() + 1); // roll of the die\n   \
    \     System.out.println(\"i = \" + i); // the statement IF\n        if (i ==\
    \ 6) {\n            System.out.println(\"WINNER!\");\n        }\n        System.out.println(\"\
    i = \" + i); // the statement after IF\n    }\n}\n```\n\n# 6.2. The IF-ELSE structure\n\
    \nWhat do we do when the program is supposed to do something when the tested condition\
    \ is true , and something else when the tested condition is false ? We could write\
    \ something like this:\n\nif (conditionA) instructionA;\nif (NOT conditionA) instructionB;\n\
    \nbut that would be wasteful, since the same condition is tested twice. We know\
    \ that NOT conditionA is false when conditionA is true, and we know that NOT conditionA\
    \ is true when conditionA is false .\n\nTo avoid this wasting of computing resources,\
    \ and to test the boolean condition only once, we implement the if-else structure,\
    \ which looks like this:\n\nif (conditionA) instructionA;\nelelse instructionB;\n\
    or like this (with optional braces for single instructions):\n\nif (conditionA)\
    \ { instructionA; }\nelelse { instructionB; }\nor like this (with mandatory braces\
    \ for blocks of instructions):\n\nif (conditionA) { instructionA1; instructionA2;\
    \ instructionA3; };\nelelse { instructionB1; instructionB2; instructionB3; }\n\
    We could also have a mix, with a single instruction paired with a block of instructions,\
    \ like this:\n\nif (conditionA) instructionA;\nelelse { instructionB1; instructionB2;\
    \ instructionB3; }\nor with a block of instructions paired up with a single instruction,\
    \ like this:"
