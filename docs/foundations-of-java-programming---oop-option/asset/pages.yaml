  md: "# Foundations of Java Programming for the OOP Option of the IB Exam\n\nThe\
    \ next program, Java Example 51 , demonstrates how a call by value works. The\
    \ String object named greeting inside the main() function is not changed by the\
    \ greeting = \"Hello Universe!\"; line in the printGreeting() function.\n\n```\n\
    // Java Example 51\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        String greeting = \"Hello World!\";\n        printGreeting(greeting);\
    \ // output : Hello World!\n        printGreeting(greeting); // output : Hello\
    \ World!\n    }\n\n    static void printGreeting(String greeting) {\n        System.out.println(greeting);\n\
    \        greeting = \"Hello Universe!\";\n    }\n}\n```\n\n> In Java, objects\
    \ (that are not of class String) and arrays are always given to a function using\
    \ a call by reference.\n\nThe next program, Java Example 52 , demonstrates how\
    \ a call by reference works. The array of integer named myArray is given to the\
    \ addOneHundred() function using a call by reference. As a result of the integer\
    \ variable stored in myArray[2] changes. As a matter of fact, the values of all\
    \ the elements in myArray go up by hundred.\n\n```\n// Java Example 52\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        int[] myArray\
    \ = { 10, 20, 30, 40, 50 };\n        System.out.println(\"before the function\
    \ call: \" + myArray[2]); // output : 30\n        addOneHundred(myArray);\n  \
    \      System.out.println(\"after the function call: \" + myArray[2]); // output\
    \ : 130\n    }\n\n    public static void addOneHundred(int[] z) {\n        int\
    \ n = z.length;\n        for(int i = 0; i < n; i = i + 1) z[i] = z[i] + 100;\n\
    \    }\n}\n```"
