    Câlin Galeriu We can read the text file, from any random position in the file?
    Can we write into the text file, at any random position in the file? The answer
    is yes, with the RandomAccess class.


    The RandomAccessFile(File, String mode) constructor takes a File object, like
    before, with a second parameter ("r" for a read only text file, or "rw" when writing
    into the text file is allowed ) and instantiates a RandomAccessFile object. The
    methods of the RandomAccessFile class can read from or write to the random access
    file at any time.


    A random file looks like a large 1D array of bytes. The same way we can access
    any byte using an index, we can access any byte in the text file using a file
    pointer. We can find the value of the file pointer using the getFilePointer()
    method, and we can change the value of the file pointer using the seek(long) method.
    The length() method returns the length of the file, which is the number of bytes
    stored in the text file.


    Reading and writing into the random access file is done with a series of read()
    and write() method calls. After each read() or write() operation the file pointer
    is incremented, so we don''t have to change the file pointer when we read or write
    in sequence order. When numbers that take two or more bytes are read or written,
    the high byte goes first.


    The int read() method reads from the text file and returns an unsigned byte (a
    number in the 0 - 255 range), which is handled internally by Java as Java does
    not have the unsigned primitive variable types. The methods return -1 when the
    end of the file is reached.


    The boolean readBoolean() reads one byte from the text file , then returns a boolean
    value. This return value is false when the byte is 0, and true otherwise.


    The byte readChar() method reads and returns a char value.


    The double readDouble() method reads a long value from the text file, converts
    it to double , and then returns that double value.


    The float readFloat() method reads an int value from the text file , converts
    it to float , and then returns that float value.


    The int readInt() method reads and returns an int value.


    The long readLong() method reads and returns a long value.


    The short readShort() method reads and returns a short value.


    The StringreadLine() method reads and returns a line of text (in ASCII format).


    The StringUTF() method reads and returns a Unicode string (in modified UTF-8 format).


    The write(int b) method writes into the text file an unsigned byte (a number in
    the 0 - 255 range), which is handled internally by Java as an int value, because
    Java does not have the unsigned byte among primitive types.


    The writeBoolean(boolean a) method writes a byte (1 for true , 0 for false).


    The writeByte(int b) method writes a byte value.


    The writeChar(int c) method writes a char value.


    The writeDouble(double d) method converts the double input variable to long ,
    and then writes into the text file that long value.'
