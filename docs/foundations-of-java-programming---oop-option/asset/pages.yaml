  md: "# Călin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ Exam\n\nThe Java logical operators return a (of type boolean) that can only\
    \ be true or false.\n\n> **Warning!** It is important to realize that the logical\
    \ operators, just like the arithmetic operators, are evaluated according a predetermined\
    \ order of operations: NOT is evaluated first, AND is evaluated next, and OR is\
    \ evaluated last.\n\nSince using the order of operations for logical operators\
    \ is not something very intuitive to humans, it is good practice to use parentheses\
    \ in order to clarify the meaning of complex boolean expressions.\n\nWrite X =\
    \ ((NOT AND) B) OR (A AND NOT B) (in Java: x = ((!A && B) || (A && (!B))); ) instead\
    \ of X = NOT AND B OR A AND NOT B (in Java: x = !A && B || !B; ) even though,\
    \ from the computer's perspective, it is the same thing.\n\nThe next program,\
    \ Java Example 11, evaluates some simple boolean expressions (logical statements\
    \ that can only be true or false) that use logical operators.\n\n```\n// Java\
    \ Example 11\npublic class Main\n{\n    public static void main(String[]) args\
    \ {\n        boolean a = false;\n        boolean b = true;\n        System.out.println(a&\
    \ b); // output: false\n        System.out.println(a || b); // output: true\n\
    \        System.out.println(!a); // output: true\n    }\n}\n```\n\nThe input-output\
    \ tables below give the boolean values of all the simple boolean expressions with\
    \ logical operators. These tables have to be memorized. One way to memorize these\
    \ tables is to think of false as 0, to think of true as 1 (or 2), to think of\
    \ AND as multiplication, and to think of OR as addition.\n\n| X | Y | X AND Y\
    \ |\n|---|---|-|\n| false | false | false |\n| false | true | false |\n| true\
    \ | false | false |\n| true | true | true |\n\n| X | Y | X OR Y |\n|---|---|-|\\\
    | false | false | false |\n| false | true | true |\n| true | false | true |\n\
    | true | true | true |\n\n| X | NOT X |\n|---|-|\n| false | true |\n| true | false\
    \ |\n\nJava has many operators (bitwise operators, assignment operators, etc.)\
    \ but they are not required for the Computer Science exam. For a list of all the\
    \ Java operators and their order of operations, please go to: https://introcs.cs.princeton.edu/java/11precedence/"
