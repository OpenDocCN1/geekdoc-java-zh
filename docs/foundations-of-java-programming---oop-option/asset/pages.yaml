    The operational definitions of the Java access modifiers are given in the table
    below:


    | none (default) | The variables, functions, and objects from that given class
    can be accessed by functions from classes in the same package |

    | public | The variables, functions, and objects from that given class can be
    accessed by functions from any class (from any package) |

    | private | The variables, functions, and objects from that given class can be
    accessed by functions from the same class . Functions from other classes in the
    same package do not have access |

    | protected | The variables, functions, and objects from that given class can
    be accessed by functions from the same class or from any of its subclasses . Functions
    from other classes in the same package also have access. |


    A summary of the consequences of the Java access modifiers is given in the table
    below:


    | Access modifier | Access by functions from the same class | Access by functions
    from the same package | Access by functions from subclasses of other packages
    | Access by functions from any class (from any package) |

    | public | Yes | Yes | Yes | Yes |

    | protected | Yes | Yes | Yes | No |

    | none (default) | Yes | Yes | No | No |

    | private | Yes | No | No | No |


    One question still remains. What is a subclass? Read the next chapter to find
    the answer.'
