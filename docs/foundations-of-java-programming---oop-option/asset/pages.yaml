  md: "# Câlin Galileriu Foundations of Java Programming for the OOP Option of the\
    \ IB CS Exam\n13. Functions: call by value and call by reference\n\nWhen a function\
    \ is called, there are two ways in which the input parameters can be provided.\
    \ The first option is to give a copy of the input parameters is a call by value.\
    \ The second option is to give the addresses (references) where the input parameters\
    \ are stored in RAM. It is a call by reference.\n\nIn Java, primitive variables\
    \ and objects of class String are always given to a function using a call by value.\n\
    \nThe next program, Java Example 50 , demonstrates how a call by value works.\
    \ The integer variable x inside the main() function is not changed by the x =\
    \ x + 100; line inside the addObjectHundred() function. In truth, we deal with\
    \ two independent variables, both named x, but existing inside the bodies of different\
    \ functions. The x variable inside the main() function is what we call the actual\
    \ parameter, and the x variable inside the addObjectHundred() function is what\
    \ we call the formal parameter. The place in a computer program where a variable\
    \ lives (where the variable exists, where it can be accessed) is called the variable\
    \ scope.\n\n```\n// Java Example 50\npublic class Main\n{\n    public static void\
    \ main(String[] args)\n    {\n        int x = 505;\n        System.out.println(\"\
    before the function call : x = \" + x); // output : 505\n        int y = addObjectHundred(x);\n\
    \        System.out.println(\"after the function call : x = \" + x); // output\
    \ : 505\n    }\n\n    static int addObjectHundred(int x)\n    {\n        x = x\
    \ + 100;\n        return x;\n    }\n}\n```\n\nOne could rename the formal parameter,\
    \ making it very clear that the program works with two different variables. For\
    \ example, the addObjectHundred() function could be changed into:\n\n```\nstatic\
    \ int addObjectHundred(int z)\n{\n    z = z + 100;\n    return z;\n}\n```\n\n\
    When this addObjectHundred() function is called by value, the value of the actual\
    \ parameter x is copied into the formal parameter z. In this way the value of\
    \ x is not changed."
