  md: "# Câlin Galerie | Foundations of Java Programming for the OOP Option of the\
    \ CS Exam\n\nNot all programming languages check for array elements with an index\
    \ out of bounds. For example, C and C++ programs will not report an error, but\
    \ instead will read from or write into the wrong memory location. From this point\
    \ Java provides a safer option.\n\nWe can also have two dimensional (2D) arrays,\
    \ also known as matrices. Elements in matrices are ordered in rows and columns.\
    \ Elements in 2D arrays are identified with the first index of two indices, integer\
    \ counters that start from zero. We usually think of the first index as the row,\
    \ and the second index as the column index. We can also have three dimensional\
    \ (3D) arrays, or with more dimensions. The number of dimensions in an array is\
    \ given by the number of square brackets [].\n\nThe declaration of a 2D array\
    \ can be done in three equivalent ways:\n\n```\ndata_type[][] array_name;\n```\n\
    \n```\ndata_type array_name[][];\n```\n\n```\ndata_type[] array_name[];\n```\n\
    \nThe last method of declaring an array is in fact revealing that in Java a 2D\
    \ array is an 1D array of 1D arrays. For a 2D array with elements array_name[row][column],\
    \ array_name.length gives the number of rows, and array_name[row].length gives\
    \ the number of elements (columns) in the named row.\n\n> **Warning!** In Java\
    \ there are different measurements of length that could easily get mixed up. The\
    \ variable array_name.length gives the length (the number of elements) of an array.\
    \ The string_name.length() gives the length (the number of alphanumeric characters)\
    \ of a text string (an object of type).\n\nThe next program, Java Example 48,\
    \ demonstrates the use of a 2D array of integer numbers. The program shows that,\
    \ when an array of integers is created, all elements have the initial value of\
    \ zero. The program also shows how the number of rows and the number of columns\
    \ of a 2D array can be obtained with the help of the length property.\n\n```\n\
    // Java Example 48\npublic class Main\n{\n    public static void main(String[]\
    \ args)\n    {\n        int[][] board = new int[10][20];\n        board[5][15]\
    \ = 505;\n        System.out.println(board[5][15]); // output : 505\n        System.out.println(board[6][16]);\
    \ // output : 0, the initial value\n        System.out.println(board.length);\
    \ // output : 10, the number of rows\n        System.out.println(board[0].length);\
    \ // output : 20, the number of columns\n    }\n}\n```\n\nA surprising feature\
    \ of Java is that we can have a 2D array with rows of different length. While\
    \ a 2D array has a well-defined number of rows, sometimes it does not have an\
    \ equally well number of columns. In that case we can only talk about the number\
    \ of elements in each individual row."
