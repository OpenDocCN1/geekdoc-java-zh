  md: "# Foundations of Java Programming for the OOP Option of the IB CS Exam\n\n\
    switch(i) instruction works like a go to case i instruction, available in other\
    \ programming languages. The default case is no go to instruction in Java.\n\n\
    The default case is executed when no match is found. The default case is optional.\
    \ In our Java program we could replace the default case with case 6 : System.out.println(\"\
    six\"); and the program would perform exactly in the same way.\n\nThe break statements\
    \ perform to exit the switch structure, and in Java the computer will continue\
    \ with the next instruction after the switch structure. The break statements are\
    \ optional, but if they are not included (if present) then the program will not\
    \ exit the switch structure until the last (or the default case) is executed.\n\
    \nThe next program, Java Example 16, shows what happens when there are no break\
    \ statements inside switch structure.\n\n```\n// Java Example 16\npublic class\
    \ Main\n{\n    public static void main(String[] args) \n    {\n        int i =\
    \ (int)(6*Math.random() + 1); // roll of the die\n        System.out.println(\"\
    i = \" + i); // the statement before SWITCH\n        switch(i)\n        {\n  \
    \          case 1 : System.out.println(\"one\");\n            case 2 : System.out.println(\"\
    two\");\n            case 3 : System.out.println(\"three\");\n            case\
    \ 4 : System.out.println(\"four\");\n            case 5 : System.out.println(\"\
    five\");\n            case 6 : System.out.println(\"six\");\n        }\n     \
    \   System.out.println(\"i = \" + i); // the statement after SWITCH\n    }\n}\n\
    ```\n\nThe program runs a few times. This is the desired behavior, or a programming\
    \ mistake? Can you draw the correct conclusion if you run the program only once,\
    \ and the integer random number i happens to be 6 ?"
