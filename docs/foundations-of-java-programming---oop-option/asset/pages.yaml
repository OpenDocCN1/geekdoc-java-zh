  md: "# Câlin Galeriu Foundations of Java Programming for the OOP Option of the IB\
    \ CS Exam\n\n# 5.2. The Java relational operators\n\nThe Java relational operators\
    \ have numbers as input and boolean values as output.\n\n| The Java relational\
    \ operators are ==, !=, <, >, <=, >= |\n\n+   == (is equal to) Example: 13 ==\
    \ 5 **false**\n!= (is not equal) Example: 13 != 5 **true**\n< (is less than) Example:\
    \ 13 < 5 **false**\n> (is greater than) Example: 13 > 5 **true**\n<= (is less\
    \ than or to) Example: 13 <= 5 **false**\n>= (is greater than or to) Example:\
    \ 13 >= 5 **true**\n\nThe Java relational operators return a result (of type boolean)\
    \ that can be **true** or **false**.\n\n> **Warning!** Be careful when you read\
    \ out expressions with relational operators. \"Five is less than thirteen\" 5\
    \ < 13, but \"five less than thirteen\" means 13 – 5.\n\nThe next program, Java\
    \ Example 10, evaluates boolean expressions (logical statements that can only\
    \ be **true** or **false**) that use relational operators.\n\n```\n// Java Example\
    \ 10\npublic class Main\n{\n    public static void main(String[] args)\n    {\n\
    \        int i = 13;\n        int j = 5;\n        System.out.println(i == j);\
    \ // output: false\n        System.out.println(i != j); // output: true\n    \
    \    System.out.println(i < j); // output: false\n        System.out.println(i\
    \ > j); // output: true\n        System.out.println(i <= j); // output: false\n\
    \        System.out.println(i >= j); // output: true\n    }\n}\n```\n\n# 5.3.\
    \ The Java logical operators\n\nThe Java logical operators have boolean values\
    \ as input and boolean values as output.\n\n| The logical operators are &&, ||,\
    \ ! |\n\n+   && (AND) Example: (13 < 5) && (13 > 5) is **false** because **false\
    \ AND** is **false** .\n|| (OR) Example: (13 < 5) || (13 > 5) is **true** because\
    \ **false OR** is **true** .\n! (NOT) Example: !(13 < 5) is **true** because **NOT\
    \ false** is **true**."
