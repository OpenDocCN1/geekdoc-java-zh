  md: '# Călin Galeriu Foundations of Java Programming for the OOP Option of the IB
    CS Exam

    20. The relationships between Java classes, and their UML diagrams


    There are three possible ways in which two classes can be related to each other.
    These connections between classes are described as inheritance, aggregation, and
    dependency.


    # 20.1. The "IS A" relationship (inheritance)


    The inheritance relationship describes two classes related by inheritance, for
    example:

    class ParentClass { ... }


    ```

    class ChildClass extends ParentClass { ... }

    ```


    The child inherits all the non-instance variables, methods, and objects of the
    parent class. Looking at just its properties, there is no difference between the
    two classes. We say that an object of type ChildClass is also an object of type
    ParentClass . From a practical point of view, the programmer needs to be aware
    of the fact that any changes in the declarations and definitions of the parent
    class will also be inherited by the child.


    # 20.2. The "HAS A" relationship (aggregation)


    The aggregation relationship describes two classes, when an object of one type
    owns an object (or an array of objects) of the other type. For example:

    class Book { ... }


    ```

    class BookShelf { Book bookBook; Book[] myBooks; ... }

    ```


    We say that an object of type BookShelf has objects of type Book . From a practical
    point of view, the programmer needs to be aware of the fact that changes in the
    declarations and definitions of the Book probably require changes in the code
    of the BookShelf class.


    # 20.3. The "USES A" relationship (dependency)


    The dependency relationship describes two connected classes, when an object of
    one class uses a variable or method of another. For example, we could have an
    object of a given class (or a method of a static class) that gets a random number
    using the Math class, with the help of the Math.random() method. In that given
    class (or perhaps the static Main()) class that does not need an instantiated
    object) uses the Math class.


    It is good practice to reduce the number of relationships between classes, whenever
    this is possible. The more connections between classes and their instantiated
    objects we have, the harder it is to make changes to the Java program, because
    the changes have to be implemented simultaneously in several different places.
    More connections between classes also make a Java program harder to read and understand.
    This extra effort to readat, understand, use, and/or modify a program is described
    as increased maintenance overhead.'
