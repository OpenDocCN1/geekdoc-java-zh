    \ unlike more powerful programming languages like C and C++, for this reason,\
    \ Java is not a good choice when we need to perform intensive computations using\
    \ complex (imaginary) numbers.\n\nIn text strings are not variables, but objects\
    \ of type String. This of an object of type String as a primitive variable type\
    \ string packaged together with functions that act on text strings.\n\n> A historical\
    \ note: Objects have become an important part of the C++ programming language\
    \ when the Windows operating system has replaced MS DOS. All of the applications\
