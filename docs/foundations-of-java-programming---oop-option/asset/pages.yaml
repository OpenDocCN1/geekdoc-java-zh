    9. Java objects: methods of the Math, String, and StringBuffer classes


    You have already used a method (function) of the Math class, the random() method
    that returns a random number. This is a static method, does not require the creation
    of an object. The name of the Math class is listed in front of the name of the
    (random) static method, the two being connected by a dot. To call this we write
    Math.random().


    You have also used a method of the String class, the charAt() method that returns
    the character found at a given location in a text string. This method can be called
    only after a String object has been created (instantiated). The name of the String
    object (for example, text) is listed in front of the name of the charAt() method,
    the two being connected by a dot. To call this method, we find the first character
    in the text string we write text.charAt().


    # 9.1. Important methods and constants of the Math class : abs(), pow(), sin(),
    cos(), round(), floor(), random(), PI, E


    The abs() function returns the absolute value of a number, |x|. The input value
    can be of type byte, short, int, long, float, or double. The output value can
    be of same type as the input.


    The pow(x, y) function returns a power, xʸ The first input parameter x is the
    base, and the second input parameter y is the exponent. The base and the exponent
    can be of type byte, short, int, long, or double. The output value is a floating
    point number of double.


    The sin() function returns the sine of angle x, which is in radians. The input
    value x is of type double, and the output value is also of type double.


    The cos(x) function returns the cosine of angle x, which is given in radians.
    The input value x is of type double, and the output value is also of type double.


    The round() function returns up or down a number x to its nearest integer value.
    When the input value x is of type float, the output value is of type int. When
    the input value x is of type double, the output value is of type long.


    The floor()x function returns the largest integer that is less than or equal to
    the input parameter x . The input value x is of type float or double, and the
    output value is of type double.


    Remember, when plotted on a number line, a smaller number is on the left side
    of a larger number.

    The random() function, with no input parameter, returns a pseudorandom number
    in the (0, 1] range. The output value is of type double.


    Math.PI is π, a constant of type double.


    Math.E is Euler''s number, the base of the natural logarithm, a constant of type
    double.


    There are other useful Math methods, not required for the IB Computer Science
    exam: acos(), asin(), atan(), cbrt(), ceil(), cos(), exp(), log(), max(), min(),
    signum(), sinh(), sqrt(), tan(), tanh(), toDegrees(), toRadians(). For a list
    of all methods of the Math class, please go to:

    www.tutorialspoint.com/java/lang/java_lang_math.html'
