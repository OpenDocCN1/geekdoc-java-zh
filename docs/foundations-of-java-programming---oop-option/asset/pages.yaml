  md: "# Foundations of Java Programming for the OOP Option of the IB CS Exam\n\n\
    More complex situations, when there are more than 2 possible outcomes, require\
    \ more complex if structures. Note that in the flowcharts the two blocks instructionA\
    \ and instructionB can themselves be made from other or if-else structures.\n\n\
    The next program, Java Example 14, finds the integer number i is in the first\
    \ third (1 or 2), in the middle third (3 or 4), or in the upper third (5 and 6),\
    \ and then prints this information.\n\n```\n// Java Example 14\npublic class Main\n\
    {\n    public static void main(String[] args) {\n        int i = (int)(Math.random()\
    \ + 1); // roll of the die\n        System.out.println(\"i = \" + i); // the statement\
    \ before IF-ELSE-IF-ELSE\n        if (i <= 2) {\n            System.out.println(\"\
    lower third\");\n        }\n        else if (i <= 4) {\n            System.out.println(\"\
    middle third\");\n        }\n        else {\n            System.out.println(\"\
    upper third\");\n        }\n        System.out.println(\"i = \" + i); // the statement\
    \ after IF-ELSE-IF-ELSE\n    }\n}\n```\n\nNotice that the if-else-if structureelse\
    \ used used is above efficient. Only. inequalities two tested by the program.\
    \ A simpler alternative is to use three simple structures, but then four inequalities\
    \ are tested, as shown below.\n\n```\nif (i <= 2) System.out.println(\"lower third\"\
    );\nif (i > 2 && i < 5) System.out.println(\"middle third\");\nif (i >= 5) System.out.println(\"\
    upper third\");\n```\n\nAs expected, two of these four inequalities are not independent,\
    \ since !(i <= 2) is the same as i > 2 , and !(i >= 5) is the same as i < 5.\n\
    \nWhat do we do if we want the program to spell in the value of the random number?\
    \ We could use six simple if statements, as shown below:\n\n```\nif (i == 1) System.out.println(\"\
    one\");\nif (i == 2) System.out.println(\"two\");\nif (i == 3) System.out.println(\"\
    three\");\nif (i == 4) System.out.println(\"four\");\n```"
