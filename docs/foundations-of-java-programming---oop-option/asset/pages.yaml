    \ the Java source file. We could make the MyHello class public by writing its\
    \ class in a separate Java source file, if we wanted. Then the two Java source\
    \ files would be part of the same package.\n\nThe MyHello class has only one function\
    \ (method), like the Main class, but there is one big difference: the MyHello()\
