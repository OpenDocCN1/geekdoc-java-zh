  md: "# Călin Galerieu Foundations of Java Programming for the OOP Option of the\
    \ IB CS\n2. Why does the simplest Java program look so complicated?\n\nThe HelloWorld\
    \ program is, traditionally, the first program that someone new to computer\n\
    programming language learns. This is the simplest program in any programming language.\
    \ This short computer\nprogram is meant to decrease anxiety, build self-confidence,\
    \ and give the students a good start on a\nsmooth learning path. But why does\
    \ the HelloWorld, the simplest Java program, look so complicated?\nThe answer\
    \ to this question is related to the historical evolution of computer programming\
    \ languages.\n\n# 2.1. The BASIC version of the HelloWorld program\n\nThe BASIC\
    \ version of the HelloWorld program looks like this:\n\n10 PRINT \"Hello World!\"\
    \n\nA BASIC program consists of a sequence of numbered instruction lines. The\
    \ entry point of a computer\nprogram is the first instruction that gets executed.\
    \ The entry point of a BASIC program is either the\nfirst line of program, or\
    \ the line number specified after the RUN command (when it is given).\n\n# 2.2.\
    \ The C version of the HelloWorld program\n\nThe C version of the HelloWorld program\
    \ looks like this:\n\n```\n#include <stdio.h>\nvoid main() {\n    printf(\"Hello\
    \ World!\");\n}\n```\n\nInstead of PRINT , a simple BASIC command, we now have\
    \ printf() , a C function. The first line tells\nt C compiler will find the printf()\
    \ function in the stdio library. Presumably we could find a\ndifferent printf()\
    \ function in a different library. This was not an option in BASIC, where PRINT\
    \ is a\nkeyword, and where semicolon ; character is used at the end of the printf()\
    \ function.\n\nA C program consists of a series of declarations and definitions\
    \ of variables and functions, and also the\ninstructions that use these variables\
    \ and functions. C programs do not have line numbers, that was a good\nidea only\
    \ when computer programs were very long. The entry point of a C program is the\
    \ main()\nfunction.\n\nIn our simple C program the main() function does not return\
    \ any value, therefore its output is of type\nvoid . This is not always the case,\
    \ in general the main() function can return an integer number of type\nint , which\
    \ then can be used by the operating system as an error code."
  merge: -1
