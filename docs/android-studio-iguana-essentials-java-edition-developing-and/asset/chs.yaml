  \                  .setAction(\"My Action\", actionOnClickListener).show();\n  \
  \  }\n});\n```\n\n在 `MainActivity.java` 文件中，添加监听器处理器：\n\n```java\nView.OnClickListener\
  \ actionOnClickListener = new View.OnClickListener() {\n    @Override\n    public\
  \ void onClick(View view) {\n        displayMessage(\"Action clicked\");\n     \
  \   Snackbar.make(view, \"Action Complete\", Snackbar.LENGTH_LONG)\n           \
  \       .setAction(\"Action\", null).show();\n    }\n};\n```\n\n运行应用并点击悬浮按钮，此时 toast\
  \ 消息和 Snackbar 应该都会出现。当 Snackbar 可见时，点击 Snackbar 中的“My Action”按钮，并验证 Snackbar 上的文本是否更改变为“Action\
  \ Complete”：\n\n![](img/fab_action_clicked.jpg)\n\n图 46-6\n\n### 46.10 总结\n\n在通过使用这些功能的示例项目之前，本章提供了对设计（Material\
  \ Design）、悬浮按钮和 Snackbar 的概括。\n\n悬浮按钮和 Snackbar 是 Android 实现用户界面材质设计方法的一部分。悬浮按钮提供了一种在\
  \ Android 应用特定屏幕内推广最常用操作的方式。Snackbar 则提供了一种应用程序向用户展示信息并允许用户对其进行操作的方法。\n\n### 47.\
  \ 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android 中材质设计的概念。它引入了由设计支持库提供的两个组件，形式为悬浮按钮和 Snackbar。本章将演示如何使用设计库的另一个另一个组件——`TabLayout`，它可以与\
  \ `ViewPager` 类结合使用，在 Android Activity 中创建一个基于标签页的界面。\n\n#### 47.1 ViewPager2 简介\n\
  \n虽然 `ViewPager2` 不属于设计支持库的一部分，但在与 `TabLayout` 组件配合使用来实现标签页用户界面时，它是一个非常有用的伴侣类。`ViewPager2`\
  \ 的主要作用是允许用户翻页。与 `ViewPager2` 关联的碎片（Fragments）由适配器实例管理。适配器至少必须实现两个方法。第一个 `getItemCount()`\
  \ 必须返回总页数。第二个 `createFragment()` 接收一个页码并必须返回对应的碎片。\n\n#### 47.2 TabLayout 组件概述\n\
  \n正如之前讨论的，`TabLayout` 是材质设计引入的组件之一。`TabLayout` 的目的是向用户展示一行可以选择的标签。标签可以是固定的也可以是可滚动的，用户可以向左或右滑动以查看显示器无法显示的更多标签。本章的剩余部分将通过创建一个示例项目来演示\
  \ `TabLayout` 与 `ViewPager2` 的使用。\n\n#### 47.3 创建 TabLayout 项目\n\n从欢迎界面选择“新建项目（New\
  \ Project）”选项，在新项目对话框中选择“基础视图 Activity（Basic Views Activity）”模板。在 Name 字段输入 `TabLayout`\
  \ 并指定 `com.ebookrenzy.tablayout` 为包名。在点击完成（Finish）”按钮之前，将最小 API 设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将语言设置为 Java。\n\n项目创建后，在布局编辑器中加载 `content_main.xml` 文件，选择 `NavHostFragment`\
  \ 对象并将其删除。由于我们不会使用 Basic Views Activity 模板的导航功能，请编辑 `MainActivity.java` 文件并修改 `onCreate()`\
  \ 方法以移除导航代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                      .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n最后，删除 `onSupportNavigateUp()`\
  \ 方法：\n\n```java\n@Override\npublic boolean onSupportNavigateUp() {\n    NavController\
  \ navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    return NavigationUI.navigateUp(navController, appBarConfiguration) || super.onSupportNavigateUp();\n\
  }\n```\n\n#### 47.4 创建第一个碎片\n\n\n\n\n`TabLayout` 上的每个标签页在选中时将显示不同的 fragment。在项目（Project）工具窗口中，右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo` 条目，选择 `New` -> `Fragment` ->\
  \ `Fragment (Blank)` 选项来创建第一个 fragment。在弹出的对话中，在 `Fragment Name:` 字段中输入 `Tab1Fragment`，在\
  \ `Fragment Layout Name:` 字段中输入 `fragment_tab1`。点击 `Finish` 按钮创建新 fragment：\n\n\
  ![](img/as_tab_layout_fragment_java.jpg)\n图 47-3\n\n编辑 `Tab1Fragment.java` 文件，如果\
  \ Android Studio 没有自动添加，请按照如下方式添加 `OnFragmentInteractionListener` 接口：\n\n```java\n\
  .\n.\nimport android.net.Uri;\n.\n.\n    public interface OnFragmentInteractionListener\
  \ {\n        // TODO: Update argument type and name\n        void onFragment(Uri\
  \ uri);\n    }\n.\n.\n```\n\n将新创建的 `fragment_tab1.xml` 文件（位于 `app` -> `res` -> `layout`\
  \ 下）加载到布局编辑器（Layout Editor）工具中，在组件树（Component Tree）面板中右键点击 `FrameLayout` 条目，选择 `Convert\
  \ FrameLayout to ConstraintLayout` 选项。在弹出的对话框中，点击 `OK` 之前确认已所有所有选项。将布局的 ID 更改为 `constraintLayout`。\n\
  \n一旦布局转换为 `ConstraintLayout`，从布局中删除 `TextView`。从调色板（Palette）中找到 `TextView` 组件并将其拖到布局的中心位置。编辑对象的文本属性使其显示为“Tab\
  \ 1 Fragment”，将字符串提取为名为 `tab_1_fragment` 的资源，并点击工具栏上的 `Infer Constraints`（推断约束）按钮。此时，布局应与图\
  \ 47-4 一致：\n\n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n图 47-4\n\n## 47.5 复制 Fragments\n\
  \n到目前为止，项目包含了四个所需的 fragment 中的一个。与其使用前面的步骤创建剩余的三个 fragment，不如复制第一个 fragment 更快。每个\
  \ fragment 包含一个布局 XML 文件和一个 Java 类文件，每个文件都需要复制。\n\n在项目工具窗口中右键点击 `fragment_tab1.xml`\
  \ 文件，从弹出的菜单中选择 `Copy`（复制）选项。右键点击布局条目，这次选择 `Paste`（粘贴）选项。在弹出的对话中点击 `OK` 按钮之前，将新布局文件命名为\
  \ `fragment_tab2.xml`。编辑新的 `fragment_tab2.xml` 文件，并将 `Text View` 上的文本改为“Tab 2 Fragment”，按照通常步骤将字符串提取为名为\
  \ `tab_2_fragment` 的资源。\n\n要复制 `Tab1Fragment` 类文件，右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo`\
  \ 下列出的类并选择 `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 条目并选择 `Paste`。在 `Copy Class`\
  \ 对话中，在 `New name:` 字段中输入 `Tab2Fragment` 并点击 `OK`。\n\n编辑新的 `Tab2Fragment.java` 文件并修改\
  \ `onCreateView()` 方法以膨胀 `fragment_tab2` 布局文件：\n\n```java\n@Override\npublic View\
  \ onCreateView(LayoutInflater inflater, ViewGroup container,\n                 \
  \        Bundle savedInstanceState) {\n    // Inflate the layout for this fragment\n\
  \    return inflater.inflate(R.layout.fragment_tab2, container, false);\n}\n```\n\
  \n执行上述复制步骤两次，为剩余的两个 fragment 创建布局和类文件。完成这些步骤后，项目结构应与图 47-5 一致：\n\n![](img/as_tab_layout_project_files_java.jpg)\n\
  图 47-5\n\n## 47.6 添加 TabLayout 和 ViewPager2\n\n现在 fragment 创建过程已完成，下一步是向主活动布局文件添加\
  \ `TabLayout` 和 `ViewPager2`。编辑 `activity_main.xml` 文件并按照下面的 XML 列表所示添加这些元素。注意 `TabLayout`\
  \ 组件嵌入在 `AppBarLayout` 元素中，而 `ViewPager2` 放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/TabLayout.AppBarOverlay\">\n    \
  \    <androidx.appcompat.widget.Toolbar\n            android:id=\"@+id/toolbar\"\
  \n            android:layout_width=\"match_parent\"\n            android:layout_height=\"\
  ?attr/actionBarSize\"\n            android:background=\"?attr/colorPrimary\"\n \
  \           app:popupTheme=\"@style/TabLayout.PopupOverlay />\n        <com.google.android.material.tabs.TabLayout\n\
  \            android:id=\"@+id/tabLayout\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"wrap_content\"\n           \
  \ app:tabMode=\"fixed\"\n            app:tabGravity=\"fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n\
  \    <androidx.viewpager2.widget.ViewPager2\n        android:id=\"@+id/view_pager\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:layout_behavior=\"@string/appbar_scrolling_behavior\"\
  \ />\n    <include layout=\"@layout/content_main\" />\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_marginEnd=\"@dimen/fab_margin\"\n        android:layout_marginBottom=\"\
  16dp\"\n        app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n### 创建 Pager Adapter\n\n本示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 标签的 fragment。在布局资源文件中添加\
  \ `ViewPager2` 后，需要向项目添加一个类的 `FragmentStateAdapter` 来管理用户选择标签项时显示的 fragment。\n\n\
  在项目工具窗口中右键点击 `com.ebookfrenzy.tablayoutdemo` 条目，选择 `New` -> `Java Class` 选项。在新类对话框中，在\
  \ `Name:` 字段输入 `TabPagerAdapter`，选择列表中的 `Class` 项，并按回车键。\n\n编辑 `TabPagerAdapter.java`\
  \ 文件如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n\n\n\n该类声明为继承自 `FragmentStateAdapter`\
  \ 类，并实现了一个构造函数，允许在创建实例时将所需的页面数量传递给该类。当需要特定页面时，会调用 `createFragment()` 方法。使用 `switch`\
  \ 语句来识别请求的页码并返回相应的碎片实例。最后，`getItemCount()` 方法返回创建实例时传递的计数值。\n\n## 47.7 执行初始化任务\n\
  \n剩余的任务涉及初始化 `TabLayout`、`ViewPager2` 和 `TabPagerAdapter` 实例，并将主 Activity 类声明为实现四个\
  \ tab 碎片（fragment）的片段交互监听器。编辑 `MainActivity.java` 文件，使其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.tablayoutdemo;\n\n.\n.\n\nimport android.net.Uri;\n\nimport com.google.android.material.tabs.TabLayoutMediator;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity implements\n\n   \
  \ Tab1Fragment.OnFragmentInteractionListener,\n    Tab2Fragment.OnFragmentInteractionListener,\n\
  \    Tab3Fragment.OnFragmentInteractionListener,\n    Tab4Fragment.OnFragmentInteractionListener\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  .\n.\n        configureTabLayout();\n    }\n\n    protected void configureTabLayout()\
  \ {\n        for (int i = 0; i < 4; i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  \        }\n        final TabPagerAdapter adapter = new TabPagerAdapter\n      \
  \              (this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \        new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n         \
  \           (tab, position) -> tab.setText(\"Tab \" + (position + 1) +\n       \
  \                                     \" Item\")).attach();\n    }\n\n    @Override\n\
  \    public void onFragmentInteraction(Uri uri) {\n    }\n\n.\n.\n}\n```\n\n代码首先创建了四个标签并将它们如下添加到\
  \ `TabLayout` 实例中：\n\n```java\nfor (int i = 0; i < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  }\n```\n\n接下来，创建一个 `TabPagerAdapter` 类的实例。注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n        (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类实例来连接\
  \ `TabLayout` 和 `ViewPager2` 对象：\n\n```java\nnew TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n    (tab, position) -> tab.setText(\"Tab \" + (position +\
  \ 1) + \" Item\")).attach();\n```\n\n该类确保 `TabLayout` 标签与当前中的碎片保持同步。此过程涉及确保每个标签上显示正确的文本。在这种情况下，文本被配置为“Tab\
  \ `<n> Item”，其中 `<n>` 被替换为当前所选标签的编号。\n\n## 47.8 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择一个标签会导致相应的碎片出现在屏幕的内容区域：\n\
  \n![](img/as_tab_layout_running.jpg)\n\n图 47-6\n\n## 47.9 自定义 TabLayout\n\n此示例项目中的\
  \ `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于数量有限且标题短的标签。在使用固定模式时，较多的标签或较长的标题可能会迅速变成问题，如图\
  \ 47-7 所示：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n\n图 47-7\n\n为了使标签适应可用显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行仍被截断，导致无法看到完整标题。解决此问题的方案是将 `TabLayout` 切换到滚动模式（scrollable mode）。在这种模式下，标题将完整显示，如图\
  \ 47-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)\n\n图 47-8\n\n如需将 `TabLayout`\
  \ 切换为滚动模式，请将 `activity_main.xml` 文件中的 `app:tabMode` 属性从 `fixed` 改为 `scrollable`：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.TabLayout>\n\
  ```\n\n例如，设置为 `fill` 时，项目将均匀分布在整个宽度上，如图 47-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n\
  \n图 47-9\n\n将属性值更改为 `center` 将项目相对于标签栏的中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\
  \n图 47-10\n\n## 47.10 总结\n\n`TabLayout` 是 Material 设计引入的组件之一。`TabLayout` 组件的目的是展示一组标签，选中时显示不同的内容。标签项可以显示文本、图像或组合。与\
  \ `ViewPager2` 和碎片结合时，可以很容易地创建标签布局。\n\n## 48 使用 RecyclerView 和 CardView\n\n`RecyclerView`\
  \ 和 `CardView` 共同工作，提供以卡片形式呈现的可滚动列表。本章将介绍这两个类的细节，然后通过示例的设计和实现。\n\n### 48.1 RecyclerView\
  \ 概览\n\n与使用悬浮按钮和 Snackbar 章节概述的 `ListView` 类类似，`RecyclerView` 的目的是允许以滚动列表的形式向用户呈现信息。然而，`RecyclerView`\
  \ 比 `ListView` 具有许多优势。特别是 `RecyclerView` 在管理组成列表的视图方面高效得多，它会重用滚动屏幕的现有视图而不是创建新视图（因此名为“复用器”）。这提高了性能并减少了列表使用的资源。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器的选择，以控制向用户呈现列表的方式：\n\n- `LinearLayoutManager`\
  \ —— 列表以水平或垂直滚动列表的形式呈现\n  ![](img/Image2427.jpg)\n  图 48-1\n- `GridLayoutManager`\
  \ —— 列表以网格形式呈现。这种管理器适用于列表项大小均匀的情况。\n  ![](img/Image2436.jpg)\n  图 48-2\n- `StaggeredGridLayoutManager`\
  \ —— 列表以交错网格形式呈现。这种管理器适用于列表项大小不一的情况。\n  ![](img/Image2443.jpg)\n  图 48-3\n\n当三种内置管理器都无法提供所需布局时，可以通过子类\
  \ `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n\n\n\n在 `RecyclerView` 中显示的每个列表项都是作为\
  \ `ViewHolder` 类的实例被创建的。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示该项的视图布局。\n\
  \n与 `ListView` 一样，`RecyclerView` 依赖于一个适配器（adapter）作为 `RecyclerView` 实例与要显示给用户的数据之间中介。适配器被创建为\
  \ `RecyclerView.Adapter` 类的子类，并且至少必须实现以下方法，这些方法将被分配给该适配器的 `RecyclerView` 对象在不同时间点进行调用：\n\
  \n*   `getItemCount()` – 此方法必须返回列表中要显示的项目数量计数。\n*   `onCreateViewHolder()` – 此方法创建并返回一个\
  \ `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常通过加载（inflate）XML 布局文件来创建。\n*   `onBindViewHolder()`\
  \ – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder`\
  \ 对象中包含了 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法负责用与指定项目对应的文本和图形填充布局中的视图，并将该对象返回给\
  \ `RecyclerView`，由它将其呈现给用户。\n\n在布局中添加 `RecyclerView` 只需要在其要出现的 Activity 的 XML 内容布局文件中添加相应的元素即可。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入主 Activity 布局文件的 `CoordinatorLayout` 中，与 `AppBar`\
  \ 和 `Toolbar` 在一起。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时使其滚出屏幕（该主题在标题为\
  \ \"使用 AppBar 和折叠 Toolbar 布局\" 的章节中有更详细的介绍）。\n\n## 48.2 CardView 概述\n\n`CardView`\
  \ 类是一种界面视图，允许使用卡片比喻来分组呈现信息。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角出现。例如，图\
  \ 48-4 显示了三个 `CardView` 实例，它们配置为显示一个由 `ImageView` 和两个 `TextView` 组成的布局：\n\n![](img/Image24511.jpg)\n\
  \n图 48-4\n\n使用 `CardView` 实例呈现的界面布局定义在 XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以包含任何复杂性的布局，使用标准的布局管理器如 `RelativeLayout` 和 `LinearLayout`。下面的 XML 布局文件表示了一个由\
  \ `RelativeLayout` 和单个 `ImageView` 组成的卡片视图布局。该卡片配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    card_view:cardRadius=\"12dp\"\n    card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"\
  4dp\">\n    <RelativeLayout\n        android:layout_width=\"match_parent\"\n   \
  \     android:layout_height=\"wrap_content\"\n        android:padding=\"16dp\">\n\
  \        <ImageView\n            android:id=\"@+id/image\"\n            android:layout_width=\"\
  100dp\"\n            android:layout_height=\"100dp\" />\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView` 结合创建可滚动卡片列表时，适配 view\
  \ 的 `onCreateViewHolder()` 方法会加载卡片的布局文件，将其分配给 `ViewHolder` 实例并返回给 `RecyclerView`\
  \ 实例。\n\n## 48.3 总结\n\n本章引入了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 提供了一种资源高效的方式用于在 Android 应用中显示可滚动列表。`CardView` 适用于以卡片形式呈现分组数据（例如姓名和地址列表）。正如下一章教程中所概述和演示的那样，当两者结合使用时特别有用。\n\
  \n## 49. RecyclerView 和 CardView 教程\n\n本章将创建一个同时使用 `CardView` 和 `RecyclerView` 组件创建可滚动卡片列表的示例项目。完成的应用将显示包含图像和文本的卡片列表。除了显示卡片列表外，还将实现选择卡片时向用户显示消息。\n\
  \n### 49.1 创建 CardDemo 项目\n\n从欢迎屏幕选择 New Project ，在弹出的新项目对话框中，点击 Next 按钮之前选择 Basic\
  \ Views Activity 。在 Name 字段中输入 `CardDemo` 并指定 `com.ebookrenzy.carddemo` 为包名。在点击\
  \ Finish 按钮之前，将 Minimum API 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 菜单更改为 `Java`。\n\
  \n### 49.2 修改 Basic Views Activity 项目\n\n由于选择了 Basic Views Activity，布局中包含一个项目所需的悬浮按钮。加载\
  \ activity_main.xml 布局文件到布局编辑器中，选择悬浮按钮，并按键盘删除键将其从布局中移除。编辑 MainActivity.java 文件，从\
  \ onCreate 方法中删除悬浮按钮和导航控制器代码如下：\n\n\n\n\n\n```java\npublic void onClick(View view)\
  \ {\n    Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \            .setAction(\"Action\", null).show();\n}\n});\n}\n```\n\n此外，移除 `onSupportNavigateUp()`\
  \ 方法，然后打开 `content_main.xml` 文件并删除布局中的 `nav_host_fragment_content_main` 对象，只保留 `ConstraintLayout`\
  \ 父布局。\n\n## 49.3 设计 CardView 布局\n\n卡片中包含的视图将在单独的 XML 布局文件中定义。在 Project 工具窗口中，右键点击\
  \ `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout Resource File` 选项。在 New Resource\
  \ 框中，在 `File name:` 字段中输入 `card_layout`，并在点击 `OK` 按钮之前，在根元素字段中输入 `androidx.cardview.widget.CardView`。\n\
  \n将 `card_layout.xml` 文件加载到 Layout Editor 工具中，切换到 `Code` 模式并修改布局使其内容如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#80B3EF\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 49.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 文件，从 `Containers` 部分拖入一个 `RecyclerView` 对象到布局中，使其位于屏幕中心，它应该自动调整大小以填充整个屏幕。使用 `Infer\
  \ constraints` 按钮添加任何缺失的布局约束。使用 `Attributes` 窗口，将 `RecyclerView` 实例 `ID` 更改为 `recyclerView`，并将\
  \ `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\n## 49.5 添加图像文件\n\
  \n除了两个 `TextViews`，卡片布局还包含一个 `ImageView`，`Recycler` 适配器已配置显示图像。在项目测试之前，必须添加这些图像。项目将使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 提供的示例代码 `icons` 文件夹中找到：`https://www.payloadbooks.com/product/igajava`。\n\
  \n在操作系统的文件导航器中找到这些图像，选择并复制这八张图像。在 Project 窗口中右键点击 `app` -> `res` -> `drawable` 项并选择\
  \ `Paste` 将文件添加到文件夹中。\n\n## 49.6 创建 RecyclerView 适配器\n\n如上一节所述，`RecyclerView` 需要一个适配器来处理列表项的创建。在\
  \ Project 窗口中右键点击 `app` -> `java` -> `com.ebookrenzy.carddemo` 项并选择 `New` -> `Java\
  \ Class`，向项目中添加此新类。在新类框中，在 `Name` 字段中输入 `RecyclerAdapter` 并在列表中选择 `Class`，然后按回车键创建新的\
  \ Java 文件。\n\n编辑 `RecyclerAdapter.java` 文件以添加一些导入指令并声明该类继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，不如在适配器中添加一些基础数组来充当数据：\n\
  \n```java\npackage com.ebookrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    final private String[] titles = {\"Chapter One\", \"Chapter Two\", \"Chapter\
  \ Three\", \"Chapter Four\", \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\"\
  , \"Chapter Eight\"};\n    final private String[] details = {\"Item one details\"\
  , \"Item two details\", \"Item three details\", \"Item four details\", \"Item five\
  \ details\", \"Item six details\", \"Item seven details\", \"Item eight details\"\
  };\n    final private int[] images = { R.drawable.android_image_1, R.drawable.android_image_2,\
  \ R.drawable.android_image_3, R.drawable.android_image_4, R.drawable.android_image_5,\
  \ R.drawable.android_image_6, R.drawable.android_image_7, R.drawable.android_image_8\
  \ };\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要自己的 `ViewHolder` 类实现，以引用 `card_layout.xml`\
  \ 中的视图元素。在 `RecyclerAdapter.java` 文件中，按如下实现该类：\n\n```java\npublic class RecyclerAdapter\
  \ extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n\n    static class\
  \ ViewHolder extends RecyclerView.ViewHolder {\n        ImageView itemImage;\n \
  \       TextView itemTitle;\n        TextView itemDetail;\n\n        ViewHolder(View\
  \ itemView) {\n            super(itemView);\n            itemImage = itemView.findViewById(R.id.itemImage);\n\
  \            itemTitle = itemView.findViewById(R.id.itemTitle);\n            itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n        }\n    }\n}\n```\n\n`ViewHolder`\
  \ 类包含一个 `ImageView` 和两个 `TextView` 变量，并有一个初始化这些变量以引用 `card_layout.xml` 文件中三个视图的构造方法。要添加到\
  \ `RecyclerAdapter.java` 中的下一个项是 `onCreateViewHolder()` 方法的实现：\n\n```java\n@NonNull\n\
  @Override\npublic ViewHolder onCreateViewHolder(ViewGroup viewGroup, int i) {\n\
  \    View v = LayoutInflater.from(viewGroup.getContext())\n            .inflate(R.layout.card_layout,\
  \ viewGroup, false);\n    return new ViewHolder(v);\n}\n```\n\n\n\n\n此方法将由 `RecyclerView`\
  \ 调用以获取 `ViewHolder` 对象。它会展开 `card_layout.xml` 视图层次结构文件，并创建一个 `ViewHolder` 类的实例，该实例使用视图层次结构进行初始化，然后将其返回给\
  \ `RecyclerView`。\n\n`onBindViewHolder()` 方法的目的是将显示的数据填充到 `ViewHolder` 对象中的视图层次结构中。它接收一个\
  \ `ViewHolder` 对象和一个表示要显示的列表项的整数值。现在应该添加此方法，并使用项目编号作为数据数组的索引。这些数据将使用 `ViewHolder`\
  \ 类构造方法中创建的引用显示在布局视图上：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一个要求是实现\
  \ `getItemCount()` 方法，在例中，该方法返回 `titles` 数组中的项目数量：\n\n```java\n@Override\npublic\
  \ int getItemCount() {\n    return titles.length;\n}\n```\n\n## 49.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目包含一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView`\
  \ 适配器。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView` 对象。在在本例中，`RecyclerView`\
  \ 将配置为使用 `LinearLayoutManager` 布局选项。\n\n这里有一点复杂之处，因为我们需要能够从 `MainActivity` 类内部使用视图绑定（view\
  \ binding）访问 `recyclerView` 组件。问题在于 `recyclerView` 包含在 `content_main.xml` 布局文件中，而它又包含在\
  \ `activity_main.xml` 文件中。为了访问 `content_main.xml` 文件，我们需要在包含它时为其分配一个 `id`。为此为此，请编辑\
  \ `activity_main.xml` 文件并修改 `include` 元素，如下所示：\n\n```xml\n<include\n    android:id=\"\
  @+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\n为被包含的文件分配了 `id`\
  \ 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n`binding.contentMain.recyclerView`\n\n现在编辑\
  \ `MainActivity.java` 文件并修改 `onCreate()` 方法来实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n## 49.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同的卡片项：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 49-2\n\n## 49.9 响应卡片选择\n\n该项目的最后阶段是使列表中的卡片可选择，这样点击卡片就会触发应用内部的事件。在本例中，卡片将被配置为在用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，在每个项视图上分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明，如下所示：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\n\
  class ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n \
  \   TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ v) {\n                // 待添加实现\n            }\n        });\n    }\n}\n```\n\n\
  在 `onClick` 处理程序的体内部，现在可以添加代码来显示消息。由于点击后执行的操作取决于点击了哪张卡片，识别所选的卡片也很重要。此信息可以通过调用 `RecyclerView`\
  \ 的 `getPosition()` 方法获取。留在 `RecyclerAdapter.java` 中，为 `onClick` 处理程序添加代码，如下所示：\n\
  \n```java\n@override\npublic void onClick(View v) {\n    int position = getPosition();\n\
  \    Snackbar.make(v, \"Click detected on item \" + (position + 1), Snackbar.LENGTH_LONG).show();\n\
  }\n```\n\n最后一个任务是启用项被点击时出现的 Material Design 波纹效果（ripple effect）。这涉及在 `card_layout.xml`\
  \ 文件的 `CardView` 声明中添加一些属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:layout_margin=\"5dp\"\n    android:clickable=\"true\"\n    android:foreground=\"\
  ?selectableItemBackground\"\n    app:cardBackgroundColor=\"#80B3EF\"\n    app:cardCornerRadius=\"\
  12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"4dp\">\n```\n\n\
  再次运行应用，验证点击列表中的卡片是否会同时触发接触点的标准波纹效果以及报告项目编号的 Snackbar 出现。\n\n## 49.10 总结\n\n本章详细介绍了了结合\
  \ `CardView` 和 `RecyclerView` 组件以显示可滚动的基于卡片的项列表的各个步骤。该示例还涵盖了对列表项的点击检测，包括识别所选项目，以及在被点击的\
  \ `CardView` 上启用波纹效果视觉反馈。\n\n## 50. 布局编辑器示例数据教程\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图\
  \ 50-1）与上一章节末尾测试的应用程序几乎没有相似之处：\n\n\n\n\n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\
  \n图 50-1\n\n在书中前面的“使用 Jetpack 构建现代 Android 应用架构”章节中，我们介绍了样本数据的概念。为了演示样本数据的用法，现在将对项目进行修改，以便从布局编辑器中在\
  \ `RecyclerView` 中显示完全填充的卡片。然而，在此之前，值得注意的是，布局编辑器有一系列预配置的样本数据模板，可以在设计用户界面时使用。要查看这些模板的运行效果，将\
  \ `content_main.xml` 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set\
  \ Sample Data`（设置样本数据）菜单选项以显示设计视图属性面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\
  \n图 50-2\n\n将模板更改为 `Email Client` 并将项目计数更改为 `12`，注意 `RecyclerView` 变为显示来自模板的数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\n图 50-3\n\n这些模板可以在无需任何额外工作的情况下显示样本数据，并且通常提供完成布局设计所需。但是对于此示例，样本数据将用于显示\
  \ `RecyclerView` 中的卡片，就像它们在运行的应用中预期显示一样。在 `content_main.xml` 文件仍加载在布局编辑器中，切换到 Code\
  \ 模式并找到 `RecyclerView` 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，它们用于在列表中显示 `12` 个项目，每个项目使用包含在 `recycler_view_item.xml`\
  \ 文件中的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools` 选项。虽然对所有这些设置的涵盖出了本书的范围，但在以下 URL 可以找到每个设置的完整描述：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述引用的 `recycler_view_item.xml` 文件是在选择样本数据模板时由布局编辑器自动生成的，可以在项目工具窗口中找到。\n\n切换回 Design\
  \ 模式，并在选中 `RecyclerView` 的情况下，使用 Design-time View Attributes 面板将模板切回默认设置。`recycler_view_item.xml`\
  \ 文件将从项目被移除，同时 `content_main.xml` XML 文件中的两个 `tools` 属性行也律被删除（如果 Android Studio\
  \ 未能删除这些行，可以从 Code 视图中手动删除）。\n\n要切换到使用卡片布局进行样本数据显示，添加一个 `listitem` 属性以引用 `card_layout.xml`\
  \ 文件。在布局中选中 `RecyclerView`，在 Attributes 工具窗口中搜索 `listitem` 属性，并在属性字段中输入 `@layout/card_layout`，如图\
  \ 50-4 所示：\n\n![](img/as_sample_data_list_item.jpg)\n\n图 50-4\n\n注意每个列表项现在都显示了卡片布局，尽管没有任何图像且使用的是样本文本数据：\n\
  \n![](img/as_sample_list_items.jpg)\n\n图 50-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板样本数据形式，也可以专门为此项目添加的自定义样本数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器，选择 `ImageView` 并如本章早期概述所示显示 Design-time View Attributes\
  \ 面板。从 `srcCompat` 菜单中选择内置的背景/风景图像集，如下方的图 50-6 所示：\n\n![](img/as_sample_data_images.jpg)\n\
  \n图 50-6\n\n接下来，右键点击 `itemTitle` TextView 对象，选择 `Set Sample Data` 菜单选项，并在 Design-time\
  \ attributes 面板中选择 `cities` 文本选项。对 `itemDetail` 重复此步骤，这次选择 `full_names` 选项，如图 50-7\
  \ 所示：\n\n![](img/as_sample_data_names.jpg)\n\n图 50-7\n\n在 Design 模式下打开 `content_main.xml`\
  \ 文件，注意 `RecyclerView` 现在使用内置图像和样本文本数据：\n\n![](img/as_sample_data_stage1.jpg)\n\n\
  图 50-8\n\n## 50.2 使用自定义样本数据\n\n本章的最后一步是在布局中显示自定义样本数据和图像。这需要创建样本数据目录并添加文本。在项目窗口中，右键点击\
  \ app 并选择 `New -> Sample Data` 选项，此时项目窗口中将一个名为 `sampledata` 的新目录，如图 50-9 所示：\n\n\
  ![](img/as_sample_data_folder.jpg)\n\n图 50-9\n\n为 `sampledata` 目录创建一个名为 `images`\
  \ 的目录。在 `card_layout.xml` 文件中再次选中 `ImageView`，按照本章之前的步骤显示 Design-time View Attributes\
  \ 面板，这次点击 `Browse` 链接并选择新添加的图像（如果 `images` 文件夹未出现，请重新构建项目）：\n\n![](img/as_sample_manager.jpg)\n\
  \n图 50-10\n\n再次右键点击 `sampledata` 目录，选择 `New -> File` 选项，将文件命名为 `chapters` 并输入以下内容：\n\
  \nChapter One\n\nChapter Two\n\nChapter Three\n\nChapter Four\n\nChapter Five\n\n\
  Chapter Six\n\nChapter Seven\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\nItem one details\n\
  \nItem two details\n\nItem three details\n\nItem four details\n\nItem five details\n\
  \nItem six details\n\n创建数据文本文件后，只需在 `card_layout.xml` 的视图元素中如下引用它们：\n\n```xml\n\
  <TextView\n    android:id=\"@+id/itemTitle\"\n    android:layout_width=\"236dp\"\
  \n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"16dp\"\n\
  \    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRight=\"@+id/itemImage\"\
  \n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:text=\"@sample/chapters\" />\n\n<TextView\n    android:id=\"\
  @+id/itemDetail\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  16dp\"\n    android:layout_marginStart=\"16dp\"\n    android:layout_marginTop=\"\
  8dp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n \
  \   tools:text=\"@sample/items\" />\n```\n\n重新构建应用并返回 `content_main.xml` 文件中的布局设计，自定义样本数据和图像现在应该显示在\
  \ `RecyclerView` 列表中：\n\n![](img/as_sample_data_completed.jpg)\n\n图 50-11\n\n与其使用两个独立的文本文件和图像集的引用，另一种选项是在\
  \ JSON 文件中声明样本数据。例如：\n\n```json\n{\n  \"mydata\": [\n    {\n      \"chapter\": \"\
  Chapter One\",\n      \"details\": \"Item one details\"\n    }\n  ]\n}\n```\n\n\n\
  \n\n```json\n{\n    \"image\": \"@sample/images\"\n  },\n  {\n    \"chapter\" :\
  \ \"Chapter Two\",\n    \"details\": \"Item two details\",\n    \"image\": \"@sample/images\"\
  \n}\n}\n```\n\n假设上述内容包含在一个名为 `chapterdata.json` 的文件中，则示例数据将在视图 XML 元素中引用如下：\n\n\
  ```xml\n<ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\" />\n\
  <TextView\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/mydata/details\" />\n```\n\n# 50.3 总结\n\
  \n本章演示了如何在布局编辑器中使用示例数据，以提供用户界面在运行时外观的更真实表示。本教程涵盖的步骤包括使用现有的示例数据模板以及集成自定义示例数据。\n\n\
  # 51 使用 AppBar 和折叠工具栏栏布局\n\n在本章中，我们将探索如何对 Activity 布局中的应用栏（app bar）进行自定义，并使其对其他屏幕视图中发生的滚动事件做出响应。通过结合\
  \ `CoordinatorLayout` 与 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置应用栏以显示图像并在视图中淡入淡出动画。例如，可以配置列表的向上滚动动作，使应用栏从视图中退回，并在执行向下滚动动作时重新出现。\n\
  \n本章将从组成应用栏的元素概述开始，并介绍各种应用栏配置的示例。\n\n## 51.1 AppBar 的结构\n\n应用栏是应用程序运行时位于屏幕顶部的区域，它可以配置为包含各种项目，包括状态栏、工具栏（toolbar）、标签栏（tab\
  \ bar）和弹性空间区域（flexible space area）。例如，图 51-1 显示了一个包含状态栏、工具栏和标签栏的应用栏：\n\n![](img/Image24271.jpg)\n\
  \n图 51-1\n\n空白背景色可以填充弹性空间区域，或者如图 51-2 所示，在 `ImageView` 对象上显示图像：\n\n![](img/Image24361.jpg)\n\
  \n图 51-2\n\n正如本章其余部分将演示，如果 Activity 用户界面布局的主内容区域包含滚动内容，则应用栏的元素可以根据屏幕内容的滚动进行展开和收缩。\n\
  \n## 51.2 示例项目\n\n对于此示例，将对前面的章节中创建的 `CardDemo` 项目进行修改，该项目标题为 Android RecyclerView\
  \ 和 CardView 教程。首先启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用并注意当向上滚动列表时，工具栏仍然可见，如图\
  \ 51-3 所示：\n\n![](img/as_app_bar_1.jpg)\n\n图 51-3\n\n第一步是更改配置，使工具栏在向上滚动动作期间收缩，并在向下滚动时展开。\n\
  \n## 51.3 协调 RecyclerView 和工具栏\n\n将 `activity_main.xml` 文件加载到布局编辑器工具中，切换到代码（Code）模式并查看\
  \ XML 布局设计，其层级结构由图 51-4 中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 51-4\n\n层级结构的顶层是 `CoordinatorLayout`，正如其名，它负责协调其包含的各种子视图元素之间的交互。例如在使用悬浮操作按钮和\
  \ Snackbar 中所示，`CoordinatorLayout` 会自动将悬浮操作按钮向上滑动，以适应 `Snackbar` 出现，然后在条形消失后将按钮移回。\n\
  \n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作，使应用栏的元素滑入或滑出视图。图 51-4 所示的布局层级结构中的一个元素是\
  \ `ConstraintLayout`。为了实现这种协调行为，有必要在发生滚动的元素以及与滚动进行协调的元素上设置属性。\n\n在滚动元素上（在本例中为 `RecyclerView`），必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层的 `ConstraintLayout` 元素并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\">\n```\n\n接下来，在布局编辑器中打开\
  \ `activity_main.xml` 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意 `AppBarLayout` 的唯一子是 `Toolbar`。为了让工具栏响应发生在\
  \ `RecyclerView` 中的滚动事件，必须在该元素上设置 `app:layout_scrollFlags` 属性。分配给属性的值取决于交互性质，必须由以下一个或多个选项组成：\n\
  \n- `scroll`：指示视图要滚动出屏幕。如果不设置此项，视图在滚动期间将固定在屏幕顶部。\n- `enterAlways`：与 `scroll` 选项配合使用时，向上滚动动作会导致视图退回。在此模式下，任何向下滚动动作会导致视图重新出现。\n\
  - `enterAlwaysCollapsed`：设置在视图上的视图在滚动达到限制之前不会从折叠状态展开。如果设置了 `minHeight` 属性，视图在初始滚动期间会出现，但直到达到最小高度。之后它将保持该高度，直到到达列表顶端。请注意此选项仅在同时使用\
  \ `enterAlways` 和 `scroll` 选项时才有效。例如：`app:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  ` `android:minHeight=\"20dp\"`\n- `exitUntilCollapsed`：设置后，视图在向上滚动期间将折叠，直到满足 `minHeight`\
  \ 阈值。此时它将保持该高度，直到滚动方向改变。\n\n对于此示例，将在 `Toolbar` 上按如下设置 `scroll` 和 `enterAlways` 选项：\n\
  \n```xml\n<com.google.android.material.appbar.MaterialToolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    app:layout_scrollFlags=\"scroll|enterAlways\" />\n```\n\
  \n设置适当的属性后，重新运行应用并在 `RecyclerView` 中进行向上滚动。这应该导致工具栏折叠出视图。向下滚动动作应导致工具栏重新出现。\n\n##\
  \ 51.4 介绍折叠工具栏布局\n\n\n\n\n\n`CollapsingToolbarLayout` 容器通过为标准工具栏提供更多的选项和控制范围，增强了应用栏（app\
  \ bar）及其元素在响应协调滚动操作时的折叠行为。`CollapsingToolbarLayout` 类旨在作为 `AppBarLayout` 的子元素添加。它提供了许多功能，例如随着工具栏的折叠和展开自动调整工具栏标题的字体大小。视差模式（parallax\
  \ mode）允许应用栏中的指定内容在折叠时淡出消失，而 `pin`（固定）模式则允许应用栏的元素在收缩期间保持固定位置。\n\n还提供了 `scrim`（遮罩）选项，用于指定工具栏在折叠序列期间过渡的颜色。\n\
  \n为了直观展示这些功能的效果，将修改 `activity_main.xml` 文件中包含的应用栏，使其使用 `CollapsingToolbarLayout`\
  \ 类，并添加一个 `ImageView` 以更好地演示视差模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级由图 51-6 所示：\n\
  \n![](img/as3.0_appbar_collapsing_tree.jpg)\n\n图 51-6\n\n将 `activity_main.xml` 文件加载到\
  \ Layout Editor 工具的 Code 模式，并修改布局如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:fitsSystemWindows=\"\
  true\"\n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:fitsSystemWindows=\"true\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <com.google.android.material.appbar.MaterialToolbar\n\
  \                android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                app:layout_scrollFlags=\"scroll|enterAlways\"\n               \
  \ app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n使用操作系统的文件系统，在书籍代码示例的 project_icons 文件夹中找到 `appbar_image.jpg` 文件并将其复制。在 Project\
  \ 窗口中，右键点击 `res` -> `drawable` 条目并选择粘贴。运行时，应用栏应如如图 51-7 所示：\n\n![](img/as_appbar_2.jpg)\n\
  \n图 51-7\n\n 向上滚动列表会导致应用栏逐渐折叠。在收缩过程中，图像将淡出到 `scrim` 属性定义的颜色，同时标题文本的字体大小将按相应的比例缩小，直到只看到工具栏：\n\
