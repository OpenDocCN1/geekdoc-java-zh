  channel.setDescription(description);\nchannel.enableLights(true);\nchannel.setLightColor(Color.RED);\n\
  channel.enableVibration(true);\nchannel.setVibrationPattern(new long[]{100, 200,\
  \ 300, 400, 500, 400, 300, 200, 400});\nnotificationManager.createNotificationChannel(channel);\n\
  ```\n\n## 63.5 构建 RemoteInput 对象\n\n在通知中实现内联直接回复的关键元素是 `RemoteInput` 类。之前的章节已经介绍了\
  \ `PendingIntent` 类，并解释了它如何允许一个应用程序创建一个意图（intent），然后授予其他应用程序或服务从原始应用外部启动该意图的能力。在那个名为“Android\
  \ 通知教程”的章节中，创建了一个待处理意图（pending intent），允许从通知内部启动原始应用中的活动（activity）。`RemoteInput`\
  \ 类允许将用户输入请求与意图一起包含在 `PendingIntent` 对象中。当 `PendingIntent` 对象中的意图被触发时（例如启动一个活动），该活动也会接收到由用户提供的任何输入。\n\
  \n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这通过使用 `RemoteInput.Builder()` 方法实现。要构建 `RemoteInput`\
  \ 对象，需要一个键字符串，用于从生成的意图中提取输入内容。该对象还需要一个标签字符串，该字符串将显示在通知的文本输入字段中。编辑 `MainActivity.java`\
  \ 文件并添加 `sendNotification()` 方法。注意还添加了一些导入指令和变量，它们将在章节的后续内容中用到：\n\n```java\npackage\
  \ com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\nimport android.app.RemoteInput;\n\
  import android.content.Intent;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int notificationId = 101;\n    private static final\
  \ String KEY_TEXT_REPLY = \"key_text_reply\";\n    private NotificationManager notificationManager;\n\
  \    private static final String channelID = \"com.ebookfrenzy.directreply.news\"\
  ;\n\n    public void sendNotification(View view) {\n        String replyLabel =\
  \ \"Enter your reply here\";\n        RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    }\n}\n```\n\n现在 `RemoteInput`\
  \ 对象已经创建并用键和标签字符串进行了初始化，它需要被放置在通知操作对象中。在执行该步骤之前，需要创建 `PendingIntent` 实例。\n\n## 63.6\
  \ 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android 通知教程”章节中概述的相同，但意图将配置为启动 `MainActivity`。在\
  \ `MainActivity.java` 文件中，添加以下代码来创建 `PendingIntent`：\n\n```java\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ = new RemoteInput.Builder(KEY_TEXT_REPLY)\n        .setLabel(replyLabel)\n   \
  \     .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent = PendingIntent.getActivity(this, 0, resultIntent,\
  \ PendingIntent.FLAG_MUTABLE);\n}\n```\n\n## 63.7 创建 Action\n\n内联回复将可以通过通知中的操作按钮进行访问。该操作需要被创建，并配置图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\n\npublic void\
  \ sendNotification(View view) {\n    String replyLabel = \"Enter your reply\";\n\
  \    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n       \
