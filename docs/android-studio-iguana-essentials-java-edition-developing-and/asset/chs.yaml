  \ `activity_main.xml` 文件中的工具栏元素配置为使用 `pin` 模式：`app:layout_collapseMode=\"pin\"`。如果折叠模式设置为\
  \ parallax，则工具栏将随图像视图一起退回。继续向上滚动动作会导致工具栏也折叠，只留下状态栏可见：\n\n![](img/as_appbar_4.jpg)\n\
  \n图 51-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scroll_flags` 属性包含了 `enterAlways`\
