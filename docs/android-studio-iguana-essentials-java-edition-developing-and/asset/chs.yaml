  \ = Navigation.findNavController(this, R.id.nav_host_fragment_main);\n    return\
  \ NavigationUI.navigateUp(navController, appBarConfiguration) || super.onSupportNavigateUp();\n\
  }\n```\n\n## 81.6 设计用户界面布局\n\n如果尚未加载 `content_main.xml` 布局资源文件，请将其加载到布局编辑器中，并在设计模式下选择并删除\
  \ `nav_host_fragment_content_main` 对象。从调色板的 Widgets 部分将 `WebView` 对象拖放到设备屏幕布局的中心位置。点击\
  \ Infer constraints（推断约束）工具栏按钮，并使用 Attributes 工具窗口将 `WebView` 的 `layout_width` 和\
  \ `layout_height` 属性更改为匹配约束，使其填充整个画布，如下方的图 81-2 所示。\n\n\n\n\n选择新添加的 `WebView` 实例并将视图的\
  \ ID 更改为 `myWebView`。\n\n在继续本教程的下一步之前，必须向项目添加额外的权限，以便 `WebView` 对象能够访问互联网并下载用于打印的网页。通过在\
  \ `Project` 工具窗口中找到 `AndroidManifest.xml` 文件并双击它将其加载到编辑面板，可以添加此权限。加载后，编辑 XML 内容以添加适当的权限行，如下列表所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.webprint\"\
  \ >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\"\n...\n</manifest>\n```\n\n![](img/as_3.6_webprint_ui.jpg)\n\
  图 81-2\n\n## 81.7 从主活动（Main Activity）访问 WebView\n\n与标题为 Android RecyclerView 和 CardView\
  \ 教程中的项目一样，我们需要能够使用视图绑定（view binding）从 `MainActivity` 类内部访问 `content_main.xml` 文件中的组件（在此例中为\
  \ `myWebView`）。为了访问 `content_main.xml` 文件中的视图，我们需要包含它时分配一个 ID。编辑 `activity_main.xml`\
  \ 文件并修改 `include` 元素如下所示：\n\n```xml\n...\n<include\n    android:id=\"@+id/contentMain\"\
  \n    layout=\"@layout/content_main\" />\n...\n```\n\n## 81.8 将网页加载到 WebView 中\n\
  \n在打印网页之前，必须将其加载到 `WebView` 实例中。在本教程中，这将通过调用 `WebView` 实例的 `loadUrl()` 方法来实现，该方法将放在名为\
  \ `configureWebView()` 的方法中并在 `MainActivity` 类的 `onStart()` 方法中调用。因此，编辑 `MainActivity.java`\
  \ 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.webprint;\n...\nimport android.view.Menu;\n\
  import android.view.MenuItem;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n...\n    @Override\n    protected void onStart()\
  \ {\n        super.onStart();\n        configureWebView();\n    }\n    private void\
  \ configureWebView() {\n        myWebView = findViewById(R.id.myWebView);\n    \
  \    myWebView.setWebViewClient(new WebViewClient(){\n            @Override\n  \
  \          public boolean shouldOverrideUrlLoading(\n                    WebView\
  \ view, WebResourceRequest request) {\n                return super.shouldOverrideUrlLoading(\n\
  \                    view, request);\n            }\n        });\n        myWebView.loadUrl(\n\
  \                    \"https://www.payloadbooks.com\");\n    }\n...\n}\n```\n\n\
  ## 81.9 添加打印菜单选项\n\n现在将使用“在 Android 上创建和管理溢出菜单”章节中概述的技术将打印网页的选项添加到溢出菜单中。第一个要求是用于标记菜单选项的字符串资源。在\
  \ `Project` 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击它将其加载到编辑器中，并修改它以添加新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n    <string\
  \ name=\"action_settings\">Settings</string>\n    <string name=\"print_string\"\
  >Print</string>\n...\n```\n\n接下来，将 `app -> res -> menu -> menu_main.xml` 文件加载到菜单编辑器中，切换到代码模式并将\
  \ `Settings` 菜单替换为 `print` 选项：\n\n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookrenzy.webprint.MainActivity\"\
  \ >\n    <item\n        android:id=\"@+id/action_settings\"\n        android:title=\"\
  @string/action_settings\"\n        android:orderInCategory=\"100\"\n        app:showAsAction=\"\
  never\" />\n    <item\n        android:id=\"@+id/action_print\"\n        android:orderInCategory=\"\
  100\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n配置菜单唯一剩下的工作就是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理器：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrint(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，活动将调用名为 `createWebPrint()`\
  \ 的方法。该方法的实现与之前的 `HTMLPrint` 项目使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，其内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.webprint;\n...\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n...\n    private void createWebPrint(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \    .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter printAdapter\
  \ = webView.createPrintAdapter(\"MyDocument\");\n        String jobName = getString(R.string.app_name)\
  \ +\n            \" Print Test\";\n        printManager.print(jobName, printAdapter,\n\
  \            new PrintAttributes.Builder().build());\n    }\n}\n```\n\n代码修改完成后，在物理\
  \ Android 设备或模拟器上运行应用程序。成功启动后，`WebView` 应该显示已加载的网页。网页加载后，从溢出菜单中选择打印选项并使用打印面板打印网页。\n\
  \n![](img/as_web_print_preview.jpg)\n图 81-3\n\n## 81.10 总结\n\n打印框架包含了 `WebView`\
  \ 的扩展，允许在应用程序内部打印内容。这些内容可以是动态创建的 HTML，也可以是加载到 `WebView` 实例中的预定义网页。对于动态创建的 HTML，使用\
  \ `WebViewClient` 实例来确保在 HTML 完全加载之前不开始打印。\n\n## 82. Android 自定义打印指南\n\n正如我们在前面的章节中所看到的，如果内容是图像或\
  \ HTML 标记形式，Android 打印框架为应用程序构建打印支持相对容易。更高级的打印需求可以通过打印框架的自定义打印功能来实现。\n\n### 82.1\
  \ Android 自定义打印概述\n\n简单来说，自定义打印使用画布（canvas）来代表要打印的文档页面。应用程序将要打印的内容作为形状、颜色、文本和图像绘制在画布上。画布由\
  \ `Canvas` 类的实例表示，提供了丰富的绘制选项。所有页面绘制完成后，即可进行打印。\n\n虽然听起来很简单，但需要执行某些步骤来实现，总结如下：\n\n\
  • 实现一个继承自 `PrintDocumentAdapter` 类的自定义适配器。\n• 获取打印服务的引用。\n• 创建 `PdfDocument` 实例以存储文档页面。\n\
  • 以 `PdfDocument.Page` 实例将将添加到 `PdfDocument` 中。\n• 获取与文档页面相关的 `Canvas` 对象引用。\n\n\
  \n\n\n-   将内容绘制到画布上。\n-   将 PDF 文档写入 `Printing` 框架提供的目标输出流中。\n-   通知 `Printing`\
  \ 框架文档已准备好打印。\n\n本章将提供这些步骤的概述，随后是一个详细的教程，旨在演示如何在 Android 应用中实现自定义文档打印。\n\n### 82.1.1\
  \ 自定义打印适配器\n\n打印适配器（print adapter）的作用是为 `Printing` 框架提供要打印的内容，并确保其根据用户选择的偏好进行正确的格式化（考虑了纸张大小和页面方向等因素）。\n\
  \n这部分工作很大程度上由 Android 打印框架提供的打印适配器完成，这些适配器是专为打印 HTML 和图像等这些特定打印任务而设计的。例如，在打印网页时，当调用\
  \ `WebView` 类实例的 `createPrintDocumentAdapter()` 方法时，系统会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，需要由应用程序开发者负责设计打印适配器并实现绘制和格式化内容的代码，以打印做准备。\n\
  \n自定义打印适配器是通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法创建的，这些方法会在 `Printing` 框架的打印过程的不同阶段被调用。这些回调方法可以总结如下：\n\
  \n-   `onStart()` – 该方法在打印过程开始时调用，目的是让应用程序代码执行创建打印作业所需的任何必要任务。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n-   `onLayout()` – 该回调方法在调用 `onStart()` 方法之后调用，并在每次用户更改打印设置（如更改方向、纸张大小或颜色设置）时再次调用。此方法应调整内容和布局以适应这些更改。更改完成后，该方法必须返回要打印的页数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n-   `onWrite()` – 该方法在每次调用\
  \ `onLayout()` 之后调用，负责在要打印的页面画布上渲染内容。除了其他参数外，此方法还会接收一个文件描述符，渲染完成后将生成的 PDF 文档写入其中。随后调用\
  \ `onWriteFinished()` 回调方法并传递一个包含要打印页范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()`\
  \ 方法是强制的。\n-   `onFinish()` – 一个可选方法，如果实现，它将在打印过程完成后由 `Printing` 框架调用一次，从而为应用程序提供执行任何必要的清理操作的机会。\n\
  \n### 82.2 准备自定义文档打印项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `CustomPrint`，并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将\
  \ `Language` 菜单设置为 `Java`。\n\n将 `activity_main.xml` 布局文件加载到 `Layout Editor` 工具中，并在\
  \ Design 模式下，选择并删除“Hello World!” `TextView` 对象。从调色板的 `Common` 部分拖入 `Button` 视图并将其放置在布局视图的中心。选中\
  \ `Button` 视图后，将 `text` 属性更改为“Print Document”，并将字符串提取到新的资源中。完成后，用户界面布局应与 图 82-1\
  \ 所示。\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。保持在 `Attributes` 工具窗口中，将 `onClick` 属性设置为调用名为\
  \ `printDocument` 的方法。\n\n![](img/as_custom_print_ui.jpg)\n\n图 82-1\n\n### 82.3\
  \ 创建自定义打印适配器\n\n在 Android 应用内部打印自定义文档涉及的大部分工作是实现自定义打印适配器。此示例将需要一个实现了 `onLayout()`\
  \ 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其读取如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\nimport android.os.CancellationSignal;\n\
  import android.os.FileDescriptor;\nimport android.print.PageRange;\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.content.Context;\n\n\
  public class MainActivity extends AppCompatActivity {\n    public static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n        Context context;\n\n        MyPrintDocumentAdapter(Context\
  \ context) {\n            this.context = context;\n        }\n\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \            PrintAttributes newAttributes,\n                             CancellationSignal\
  \ cancellationSignal,\n                             LayoutResultCallback callback,\n\
  \                             Bundle metadata) {\n        }\n\n        @Override\n\
  \        public void onWrite(PageRange[] pageRanges,\n                         \
  \   FileDescriptor destination,\n                            CancellationSignal\
  \ cancellationSignal,\n                            WriteResultCallback callback)\
  \ {\n        }\n    }\n}\n```\n\n新类包含一个在创建实例时调用的构造方法。构造方法接收调用者的 context 作为参数，然后将其存储以便在两个回调方法中引用。有了类框架，下一步是实现这两个回调方法，从\
  \ `onLayout()` 开始。\n\n### 82.4 实现 onLayout() 方法\n\n继续留在 `MainActivity.java` 文件中，首先添加\
  \ `onLayout()` 方法代码需要的一些导入指令：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport android.print.PrintDocumentInfo;\nimport android.print.pdf.PrintedPdfDocument;\n\
  import android.graphics.pdf.PdfDocument;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter` 类，以声明在 `onLayout()` 方法中使用的变量：\n\n\
  ```java\npublic static class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n    Context context;\n    int pageHeight;\n    int pageWidth;\n    PdfDocument\
  \ myPdfDocument;\n    int totalpages = 4;\n\n}\n```\n\n注意，对于此示例，将打印一个四页文档。在更复杂的情况下，应用程序可能需要根据内容相对于用户纸张大小和页面方向的选择，动态计算要打印的页数。\n\
  \n声明变量后，按照以下代码实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n                     PrintAttributes newAttributes,\n        \
  \             CancellationSignal cancellationSignal,\n                     LayoutResultCallback\
  \ callback,\n                     Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = Objects.requireNonNull(\n                newAttributes.getMediaSize()).getHeightMils()/1000\
  \ * 72;\n    pageWidth =\n```\n\n\n\n\n\n```java\nnewAttributes.getMediaSize().getWidthMils()/1000\
  \ * 72;\n\nif (cancellationSignal.isCanceled() ) {\n    callback.onLayoutCancelled();\n\
  \    return;\n}\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder builder =\
  \ new PrintDocumentInfo\n        .Builder(\"print_output.pdf\")\n        .setContentType(\n\
  \            PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n        .setPageCount(totalpages);\n\
  \    PrintDocumentInfo info = builder.build();\n    callback.onLayoutFinished(info,\
  \ true);\n} else {\n    callback.onLayoutFailed(\"Page count is zero.\");\n}\n```\n\
  \n该方法执行了许多任务，每项任务都需要详细的解释。\n\n首先，会创建一个新的 `PdfDocument` 类实例，作为新的 PDF 文档。当打印框架调用 `onLayout()`\
  \ 方法时，传入的参数之一是 `PrintAttributes` 类型的对象，它包含了用户为打印输出选择的纸张大小、分辨率和颜色设置详情。在创建 PDF 文档时，会使用这些设置，以及之前由构造方法为我们存储的\
  \ activity 上文：\n\n`myPdfDocument = new PrintedPdfDocument(context, newAttributes);`\n\
  \n该方法随后使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度以英寸的千分之一为单位存储在对象中。由于本示例中稍后使用这些值的方法是以\
  \ 1/72 英寸为单位的，因此在存储之前会对这些数字进行转换：\n\n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;`\n\n`pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`\n\
  \n尽管此示例未使用用户的颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回\
  \ `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME` 之一的值。\n\n当调用 `onLayout()` 方法时，会传入一个\
  \ `LayoutResultCallback` 的对象。该对象允许方法通过一组方法向打印框架回传状态信息。例如，如果用户取消了打印过程，就会调用 `onLayout()`\
  \ 方法。进程已取消的事实通过 `CancellationSignal` 参数中的设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled()\
  \ ) {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n当布局工作完成后，方法需要调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传入两个参数。第一个参数是 `PrintDocumentInfo`\
  \ 对象，包含有关要打印文档的信息。这些信息包括 PDF 文档的名称、内容类型（在本例中是文档而非图像）以及页数。第二个参数是一个 `Boolean` 值，表示自上一次调用\
  \ `onLayout()` 方法以来，布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n        .Builder(\"print_output.pdf\")\n    \
  \    .setContentType(\n            PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n  \
  \      .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码将通过调用 `LayoutCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。调用 `onLayoutFinished()` 方法通知打印框架布局工作已完成，触发对 `onWrite()` 方法的调用。\n\n\
  ### 实现 `onWrite()` 回调\n\n`onWrite()` 回调负责渲染文档页面，并通知打印框架文档已准备好打印。完成后，`onWrite()`\
  \ 方法的实现如下：\n\n```java\npackage com.efrenzy.print;\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  \n@Override\npublic void onWrite(final PageRange[] pageRanges,\n    final FileDescriptor\
  \ destination,\n    final CancellationSignal cancellationSignal,\n    final WriteResultCallback\
  \ callback) {\n    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(\n                pageWidth,\n\
  \                pageHeight, i).create();\n            PdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  \            if (cancellationSignal.isCanceled()) {\n                callback.onWriteCancelled();\n\
  \                myPdfDocument.close();\n                myPdfDocument = null;\n\
  \                return;\n            }\n            drawPage(page, i);\n      \
  \      myPdfDocument.finishPage(page);\n        }\n    }\n    try {\n        myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n    } catch\
  \ (IOException e) {\n        callback.onWriteFailed(e.toString());\n        return;\n\
  \    } finally {\n        myPdfDocument.close();\n        myPdfDocument = null;\n\
  \    }\n    callback.onWriteFinished(pageRanges);\n}\n```\n\n`onWrite()` 方法首先遍历文档中的每一页。然而，需要考虑到，用户可能只请求打印某些页面。打印框架的用户界面提供了指定特定页面或页码范围的选项。为了实现这一点，打印框架通过参数传递一个\
  \ `PageRange` 对象数组，指示要打印的页码范围。在上面的 `onWrite()` 实现中，对每页都调用 `pageInRange()` 方法，以验证该页是否在指定的范围内。`pageInRange()`\
  \ 方法的代码将在本章稍后部分实现。\n\n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施确保打印了用户指定的页面。例如，图 82-2\
  \ 显示了打印面板配置为打印第 1-4 页、第 9 页以及第 11-13 页。\n\n![](img/Image2436.jpg)\n\n图 82-2\n\n\n\
  \n\n[content]\n只要打印过程没有取消，该方法就会调用一个方法在当前页面上绘制内容，然后调用 `myPdfDocument` 对象上的 `finishedPage()`\
  \ 方法。\n\n```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n```\n\n`drawPage()`\
  \ 方法负责将内容绘制到页面上，并在 `onWrite()` 方法完成后完成实现。\n\n当 PDF 文档中添加了所需的页数后，文档将使用文件描述符写入目标流，该文件描述符是作为参数传递给\
  \ `onWrite()` 方法的。如果由于任何原因写入操作失败，该方法将通过调用 `WriteResultCallback` 对象的 `onWriteFailed()`\
  \ 方法通知框架（该对象也作为参数传递给 `onWrite()` 方法）。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，将调用 `WriteResultsCallback`\
  \ 对象的 `onWriteFinish()` 方法，以通知打印框架文档已准备好打印。\n\n## 82.6 检查页面是否在范围内\n\n如前所述，当调用 `onWrite()`\
  \ 方法时，它会接收一个 `PageRange` 对象数组，该数组指示文档中要打印的页面范围。`PageRange` 类用于存储页范围的起始页和结束页，而这些页码可以通过该类的\
  \ `getStart()` 和 `getEnd()` 方法进行访问。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接收一个 `PageRange` 对象数组和页页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，该方法可以按照如下所示的方式实现在\
  \ `MainActivity.java` 类的 `MyPrintDocumentAdapter` 类中：\n\n```java\npublic class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n// ...\n    private boolean pageInRange(PageRange[]\
  \ pageRanges, int page) {\n        for (PageRange pageRange : pageRanges) {\n  \
  \          if ((page >= pageRange.getStart()) &&\n                (page <= pageRange.getEnd()))\n\
  \                return true;\n        }\n        return false;\n    }\n// ...\n\
  }\n```\n\n## 82.7 在页面画布上绘制内容\n\n我们现在已经到了需要编写某些代码在页面上绘制内容，以便它们准备好打印的阶段。所绘制的内容完全取决于应用程序，并且仅限于使用\
  \ `Canvas` 类可以实现的内容。然而在本示例中，将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用名为 `drawPage()`\
  \ 的方法，该方法接收代表当前页面的 `PdfDocument.Page` 对象和一个代表页码的整数。在 `MainActivity.java` 文件中，该方法现在应该按照如下方式实现：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n// ...\nimport android.graphics.Canvas;\n\
  import android.graphics.Color;\nimport android.graphics.Paint;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n// ...\n    public static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n// ...\n        private void drawPage(PdfDocument.Page\
  \ page, int pagenumber) {\n            Canvas canvas = page.getCanvas();\n     \
  \       pagenumber++; // 使页码从 1 开始\n            int titleBaseLine = 7;\n       \
  \     int leftMargin = 5;\n            Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n\
  \            paint.setTextSize(0);\n            canvas.drawText(\"Test Document\
  \ Page \" + pagenumber, leftMargin, titleBaseLine, paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some test content to verify that custom printing\
  \ works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber %\
  \ 2 == 0)\n                paint.setColor(Color.RED);\n            else\n      \
  \          paint.setColor(Color.GREEN);\n            PageInfo pageInfo = page.getInfo();\n\
  \            canvas.drawCircle(pageInfo.getPageWidth()/2f, pageInfo.getPageHeight()/2f,\
  \ 150, paint);\n        }\n// ...\n    }\n```\n\n代码中的页码从 0 开始。由于文档从第 1 页开始，该方法首先增加页码。然后获取与页面关联的\
  \ `Canvas` 对象的引用，并声明了一些边距和基线值：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 7;\nint leftMargin = 5;\n```\n\n接下来，代码创建了用于绘制的 `Paint` 和 `Color`\
  \ 对象，设置文本大小并绘制页面标题：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Document Page \" + pagenumber, leftMargin,\
  \ titleBaseLine, paint);\n```\n\n然后减小文本大小，并在标题下方绘制一些正文内容：\n\n```java\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some test content to verify that custom printing works\"\
  , leftMargin, titleBaseLine + 35, paint);\n```\n\n该方法的最后一项任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇偶数后，该方法获取页的高度和宽度，然后使用这些信息将圆放置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2f,\
  \ pageInfo.getPageHeight()/2f, 150, paint);\n```\n\n在画布上绘制完成后，方法将控制权返回给 `onWrite()`\
  \ 方法。随着 `drawPage()` 方法的完成，`MyPrintDocumentAdapter` 类现在完成了。\n\n## 82.8 启动打印任务\n\n\
  用户点击“打印文档”按钮时，将调用 `printDocument()` onClick 处理方法。因此，在开始测试之前剩下的工作是将此方法添加到 `MainActivity.java`\
  \ 文件中，特别注意要将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  // ...\nimport android.print.PrintManager;\nimport android.view.View;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    public void printDocument(View\
  \ view) {\n        PrintManager printManager = (PrintManager) this\n           \
  \     .getSystemService(Context.PRINT_SERVICE);\n        String jobName = this.getString(R.string.app_name)\
  \ + \" Document\";\n        printManager.print(jobName, new MyPrintDocumentAdapter(this),\
  \ null);\n    }\n}\n```\n\n该方法获取设备上运行的 Print Manager 服务的引用，然后创建一个新的字符串对象作为打印任务的名称。最后，调用\
  \ Print Manager 的 `print()` 方法来启动打印任务，传入任务名称和我们自定义打印文档适配器类的实例。\n\n\n\n\n\n# 82.9\
  \ 测试应用程序\n\n在 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“Print Document”（打印文档）按钮启动打印任务，并为输出选择合适的目标（`Save\
  \ to PDF` 选项有助于避免浪费纸张和打印机墨水）。\n\n检查打印输出，输出应包含 4 个页面，包括文本和图形。例如图 82-3 显示了以 PDF 文件形式查看并准备保存到设备上的四页文档。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。打印输出应反映每项设置的变化，这表明自定义打印文档适配器功能正常。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 82-3\n\n## 82.10 总结\n\n虽然自定义文档打印的实现比 Android 打印框架的 HTML 和图像打印选项复杂，但自定义文档打印在\
  \ Android 应用程序中打印复杂内容方面提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义的 `Print Adapter` 类，该类不仅在文档页面上绘制内容，还能在用户更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\
  \n## 83. Android App Links 简介\n\n随着技术的演进，Web 内容与移动内容之间的传统区别开始模糊。这一点特别 true 一个领域是渐进式\
  \ Web 应用（PWA）的日益流行，这些 Web 应用的外观和行为类似于传统的移动应用。\n\n另一个趋势是让移动应用中的内容可以通过 Web 搜索和 URL\
  \ 链接变得可发现。在 Android 应用开发的背景下，`App Links`应用链接）功能旨在让用户更容易地发现和访问存储在 Android 应用程序中的内容，即使用户没有安装该应用。\n\
  \n## 83.1 Android App Links 概述\n\nApp link（应用链接）是一个标准的 HTTP URL，它是从网站或应用等外部源直接链接到你应用程序中特定位置的简便方法。App\
  \ links（也称为深度链接 deep links）主要用于鼓励用户参与应用，并允许用户分享应用内容。\n\nApp link 的实现是一个多步骤过程，涉及向项目清单文件中添加\
  \ `intent filters`（意图过滤器）、在相关的应用 Activity 中实现链接处理代码，以及使用数字资产链接文件（digital asset links\
  \ files）来关联应用和基于 Web 的内容。\n\n这些步骤可以通过手动更改项目或自动使用 Android Studio 的 `App Links Assistant`（应用助手）来完成。\n\
  \n本章的剩余部分将根据对项目进行的更改来概述 app links 的实现。下一章（“Android Studio App Links 教程`）将演示如何使用\
  \ App Links Assistant 实现相同的结果。\n\n## 83.2 App Link Intent Filters\n\nApp link URL\
  \ 需要映射到应用项目中的特定 Activity。这是通过向项目的 `AndroidManifest.xml` 文件添加 `intent filters` 实现的，这些过滤器设计用于响应\
  \ `android.intent.action.VIEW` 动作以启动 Activity。意图过滤器声明在要启动的 Activity 元素内部，并且包含概述\
  \ app link URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了一个意图过滤器，当检测到匹配 `http://www.example.com/welcome`\
  \ 的 app link 时启动名为 `MyActivity` 的 Activity：\n\n```xml\n<activity android:name=\"\
  com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter android:autoVerify=\"true\"\
  >\n        <action android:name=\"android.intent.action.VIEW\" />\n        <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n        <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n        <data\n            android:scheme=\"\
  http\"\n            android:host=\"www.example.com\"\n            android:pathPrefix=\"\
  /welcome\" />\n    </intent-filter>\n</activity>\n```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器标签的\
  \ `order` 属性进行指定，如下所示：\n\n```xml\n<application>\n    <activity android:name=\" com.ebookfrenzy.myapp.MyActivity\"\
  >\n        <intent-filter android:autoVerify=\"true\" android:order=\"1\">\n.\n\
  .\n```\n\n意图过滤器将导致 app link 正确的 Activity，但必须在目标 Activity 中添加代码以妥善处理该意图。\n\n## 83.3\
  \ 处理 App Link Intents\n\n在大多数情况下，启动的 Activity 需要获取 app link URL 的访问权限，并根据 URL 的结构采取特定操作。接上上例，当通过包含\
  \ `/welcome/newuser` 路径的 URL 启动时，Activity 显示的内容与路径设置为 `/welcome/existinguser` 的\
  \ URL 可能会不同。\n\n当链接启动 Activity 时，会传递一个 `intent` 对象，其中包含启动 Activity 的动作数据。在 Activity\
  \ 的初始化阶段，可以添加代码提取这些信息：\n\n```java\nIntent appLinkIntent = getIntent();\nString appLinkAction\
  \ = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n```\n\
  \n获取 app link 的 `Uri` 后，可以使用组成 URL 的各种组件决定要执行的操作。在下面的示例中，最后一个组件用于识别新用户或现有用户：\n\n\
  ```java\nString userType = appLinkData.getLastSegment();\nif (userType.equals(\"\
  newuser\")) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n## 83.4 将应用与网站关联\n\
  \n在 app link 工作之前，必须将 app link URL 与网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的\
  \ `.well-known` 文件夹中实现的。注意，数字资产链接适用于基于 HTTPS 的网站。\n\n数字资产链接文件包含一个允许使用链接启动目标应用的关系语句，以及一个声明伙伴应用包名和项目\
  \ SHA256 证书指纹的目标语句。例如，典型的资产链接文件可能如下：\n\n```json\n[{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n  \"target\" : {\n    \"namespace\": \"android_app\",\n    \"package_name\"\
  : \"<应用包名>\",\n    \"sha256_cert_fingerprints\": [\"<证书指纹>\"]\n  }}]\n```\n\n`assetlinks.json`\
  \ 文件可以包含多个数字资产链接，允许单个网站关联多个伙伴应用。\n\n## 83.5 总结\n\nAndroid App Links 允许通过外部网站和其他应用的链接\
  \ 启动应用 Activity。App links 通过项目清单文件中的意图过滤器和启动 Activity 中的意图处理代码来实现。通过数字资产链接文件，还可以将\
  \ app link 中使用的域名与相应的网站关联。一旦建立关联，当使用 app link 时，Android 不再需要让用户选择目标应用。\n\n## 84.\
  \ Android Studio App Links 教程\n\n本章将提供 Android app links 和 Android Studio App Link\
  \ Assistant 的实际演示。\n\n本章将为现有的 Android 应用添加链接支持，允许通过 app link URL 启动 Activity。除了启动\
  \ Activity 之外，显示的内容由 URL 路径指定。\n\n## 84.1 关于示例应用\n\n\n\n\n本章使用的项目名为 `AppLinking`，是一个基础应用程序，旨在允许用户查找伦敦地标的信息。该应用使用\
  \ `SQLite` 数据库，并通过标准的 Android 内容提供者（content provider）类进行访问。应用包含一个现有数据库，其中包含了伦敦热门景点的记录。除了现有的数据库条目外，应用允许用户添加和删除地标描述。\n\
  \n目前，该应用允许对现有记录进行搜索，并添加和删除新记录。\n\n项目由两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的 Activity 组成。`AppLinkingActivity` 是应用启动的主 Activity。该 Activity 允许用户输入搜索标准并向数据库添加记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 将启动并显示相关地标的信息。\n\n本章将增强该应用以支持应用链接（app linking），以便可以使用 URL 在应用内显示特定的地标记录。\n\n##\
  \ 84.2 数据库架构\n\n示例应用的数据包含在名为 `landmarks.db` 的文件中，位于项目层次结构的 `app -> assets -> databases`\
  \ 文件夹中。数据库包含一个名为 `locations` 的表，其结构如表 84-1 所示：\n\n| 列名 | 类型 | 描述 |\n| :--- | :---\
  \ | :--- |\n| _id* | `String` | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| title | `String` |\
  \ 地标的名称（例如，伦敦桥）。 |\n| description | `String` | 地标的描述。 |\n| personal | `Boolean`\
  \ | 表示记录是私人的还是公有的。用户添加的所有记录此值均设为 true。数据库提供的现有记录设置为 false。 |\n\n表 84-1\n\n## 84.3\
  \ 加载并运行项目\n\n该项目包含在位于以下 URL 的示例源码下载包的 `AppLinking` 文件夹中：\n\n[`www.payloadbooks.com/product/iguanajava`](https://www.payloadbooks.com/product/iguanajava)\n\
  \n找到文件夹后，在 `Android Studio` 中打开它，并在设备或模拟器上运行该应用。一旦应用启动，将出现下方图 84-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 84-1\n\n按照目前的实现，使用位置的 `ID` 来定位地标。默认数据库配置目前包含由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的两个记录。在 `ID` 字段中输入 `londonbridge` 并点击 `Find` 按钮来测试搜索功能。找到匹配的记录时，将启动第二个 Activity（`LandmarkActivity`）并传递有关要显示的记录信息。这些信息以添加到\
  \ `Intent` 对象的额外数据形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 84-2 所示的屏幕显示给用户：\n\
  \n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 84-2\n\n## 84.4 添加 URL 映射\n\n\
  现在应用已经加载到 `Android Studio` 并通过了测试，我们可以添加应用链接支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击而启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。对于此示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n当完成所有步骤后，例如，以下 URL 将导致应用显示有关伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links Assistant` 菜单选项打开 `App Links Assistant`。打开后，助手程序将如图\
  \ 84-3 所示：\n\n![](img/as_app_links_assistant_main.jpg)\n\n图 84-3\n\n接下来，点击 `Create\
  \ Applink` 按钮显示下方的面板：\n\n![](img/as_app_links_assistant.jpg)\n\n图 84-4\n\n点击 `Open\
  \ URL Mapping Editor` 按钮将 URL 映射到 Activity。在映射屏幕中，点击 `+` 按钮（如图 84-5 中高亮所示）来添加新的\
  \ URL：\n\n![](img/as_app_links_assistant_mappings.jpg)\n\n图 84-5\n\n在 `Add URL Mapping`\
  \ 对话框的 `Host` 字段中，输入你自己的网站的 URL。如果你没有可用于本教程的网站，仍然可以使用 `http://www.example.com` 本章大部分内容，但无法测试需要存在\
  \ Digital Asset Links 文件的功能。\n\n`Path` 字段（在图 84-6 中标记为 B）是声明 URL 路径组件的地方。路径必须以 `/`\
  \ 开头，因此在此字段中输入 `/landmarks`。\n\n`Path` 菜单（B）提供了以下三个路径匹配选项：\n\n- `path` – URL 必须与\
  \ URL 的路径组件完全匹配才能启动 Activity。例如，如果路径设置为 `/landmarks`，则 `http://www.example.com/landmarks`\
  \ 将被视为匹配。然而，URL `http://www.example.com/landmarks/londonbridge` 将不被视为匹配。\n- `pathPrefix`\
  \ – 指定路径仅被视为前缀。在 `/landmarks` 之后可以包含额外的路径组件（例如，`example.com/landmarks/londonbridge`\
  \ 将视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符的形式指定路径，例如 `/landmarks/*`。\n\n由于此示例中的路径是前缀，请选择\
  \ `pathPrefix` 选项。\n\n最后，使用 `Activity` 菜单（C）选择 `LandmarkActivity` 作为响应应用链接而启动的 Activity：\n\
  \n![](img/as_app_links_mapping.jpg)\n\n图 84-6\n\n在完成对话框中的设置后，点击 `OK` 按钮提交更改。通过在映射屏幕的\
  \ `Check URL Mapping` 字段中输入以下 URL 来检查格式是否正确（`<your domain>` 为上方字段中指定的域名）：\n\n`http://<your\
  \ domain>/landmarks/toweroflondon`\n\n如果映射配置正确，`LandmarkActivity` 将列为映射的 Activity：\n\
  \n![](img/as_app_links_check_url.jpg)\n\n图 84-7\n\n最新版本的 Android 要求对 HTTP 和 HTTPS\
  \ 协议声明应用链接，即使只使用一种。因此，在下一步之前，重复上述步骤将 HTTPS 版本的 URL 添加到列表中。下一步将在 `App Links Assistant`\
  \ 的 URL 映射屏幕中执行，因此保持屏幕选中状态。\n\n## 84.5 添加 Intent Filter\n\n如上一章所述，需要 intent filter\
  \ 来响应应用链接点击启动目标 Activity。事实上，当添加 URL 映射时，intent filter 已自动添加到项目清单文件中。在 `App Links\
  \ Assistant` 的 URL 映射列表中选中 URL 映射，向下滚动屏幕直到 intent filter 部分进入视野。预览应包含修改后的 `AndroidManifest.xml`\
  \ 文件，其中包含了新添加的 intent filter：\n\n![](img/as_app_links_intent_filter.jpg)\n\n图 84-8\n\
  \n尽管 `App Links Assistant` 为我们添加了 intent filter，但它可能没有包含应用链接所需的 `autoVerify` 设置。打开\
  \ `manifests -> AndroidManifest.xml` 文件，并如下所示向两个 intent filter 添加此设置：\n\n```xml\n\
  <intent-filter android:autoVerify=\"true\">\n    <data android:scheme=\"http\" />\n\
  ```\n\n\n\n\n```xml\n<data android:host=\"www.example.com\" />\n<data android:pathPrefix=\"\
  /landmarks\" />\n</intent-filter>\n\n<intent-filter android:autoVerify=\"true\"\
  >\n    <data android:scheme=\"https\" />\n    <data android:host=\"www.example.com\"\
  \ />\n    <data android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n```\n\n\
  # 84.6 添加 Intent 处理代码\n\n到目前为止的步骤确保了能够根据格式正确的应用链接（app link）URL 启动相应的 activity。下一步是在\
  \ `LandmarkActivity` 类中处理 intent，以便从数据库中提取正确的记录并将其显示给用户。在修改 `LandmarkActivity.java`\
  \ 文件中的任何代码之前，回顾一下现有代码的某些区域是值得的。在代码编辑器中打开 `LandmarkActivity.java` 文件，找到 `onCreate()`\
  \ 和 `handleIntent()` 方法，它们目前的内容应该如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId =\n        intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前的形态下，代码期望在 `Intent` bundle 的额外数据（extra\
  \ data）中找到景点 ID。由于 activity 现在可以通过应用链接启动，必须更改代码以处理这两种情况。首先删除 `onCreate()` 方法中的 `handleIntent()`\
  \ 的调用：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n```\n\n要添加初始的应用链接 intent 处理代码，返回 App Links Assistant 面板，并点击步骤 2 下列出的 `Select\
  \ Activity` 按钮。在活动选择对话框中，选择 `LandmarkActivity` 条，然后点击 `Insert Code` 按钮：\n\n![](img/as_app_links_select_activity.jpg)\n\
  图 84-9\n\n返回 `LandmarkActivity.java` 文件，注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android\
  \ Studio 无法完成请求，你可以手动添加此代码）：\n\n```java\n// ATTENTION：这是为了处理应用链接自动生成的。\nIntent appLinkIntent\
  \ = getIntent();\nString appLinkAction = appLinkIntent.getAction();\nUri appLinkData\
  \ = appLinkIntent.getData();\n```\n\n这段代码访问 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果\
  \ activity 的启动由于应用链接，则 action 字符串将设置为 `android.intent.action.VIEW`，这与清单文件中添加到 intent\
  \ filter 中声明的 action 相匹配。相反，如果 activity 是通过主 activity 中 `findLandmark()` 方法的标准 intent\
  \ 代码启动的，则 action 字符串将为 `null`。通过检查赋值给 action 字符串的值，可以编写代码来识别 activity 是如何启动的并采取适当的操作：\n\
  \n```java\nimport android.net.Uri;\n\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\n    // ATTENTION：这是为了处理应用链接自动生成的。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的工作是在方法中添加一些额外的代码，以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为景点 ID：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    // ATTENTION：这是为了处理应用链接自动生成的。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    if (appLinkAction != null)\
  \ {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\")) {\n     \
  \       String landmarkId = appLinkData.getLastPathSegment();\n            if (landmarkId\
  \ != null) {\n                displayLandmark(landmarkId);\n            }\n    \
  \    }\n    }\n}\n```\n\n\n\n\n\n尽管目前市面上只有少数 Android 设备提供面脸识别功能，但这在未来可能会变得更加普遍。for\
  \ 此，Google 已开始从以指纹为核心的应用程序身份验证方式，转变为一种更具通用性的方法，称为“生物识别认证”。\n\n本章将概述生物识别认证，并提供一个详细的、分步骤的教程，演示如何在\
  \ Android 应用项目内实现生物识别认证的实用方法。\n\n## 85.1 生物识别认证概述\n\n关键生物识别认证组件是 `BiometricPrompt`\
  \ 类。该类执行了许多在早期的 Android 版本中必须通过编写代码完成的工作，包括显示标准对话框以引导用户完成身份验证、执行身份验证并将结果报告给应用。该类还处理了过度失败的身份验证尝试，并在用户重试之前强制超时。\n\
  \n`BiometricPrompt` 类包含一个伴生类 `Builder`，可以使用它来配置和创建 `BiometricPrompt` 实例，包括定义要在生物识别认证框中显示的文本，以及对出现在对话框中的取消按钮（也称为否定按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组身份验证回调，这些回调将被调用以向应用提供身份验证操作的结果。还使用 `CancellationSignal`\
  \ 实例允许应用在身份验证进行过程中取消操作。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n## 85.2 创建生物识别认证项目\n\
  \n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `BiometricDemo` 并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 29: Android (Q)`，并将 `Language` 菜单改为 `Java`。\n\
  \n## 85.3 配置设备指纹身份认证\n\n指纹认证仅适用于包含触摸传感器的设备，并且这些设备已采取适当的配置步骤保护设备并录入至少一个指纹。关于使用和配置\
  \ Android Studio AVD 模拟器配置模拟器话以测试指纹认证的步骤，请参考该章节。\n\n通过打开 `Settings` 应用并选择 `Security`\
  \ 选项来配置物理设备上的指纹身份认证。在 `Security` 设置屏幕内，选择 `Fingerprint` 选项。点击结果信息屏幕上的 `Next` 按钮进入\
  \ `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置备份锁屏解锁方法（如 `PIN`）。如果锁屏未受保护，请按照步骤配置 `PIN`、`pattern`\
  \ 或 `password` 安全。\n\n锁定屏安全后，继续进入指纹检测屏幕，并在提示时触摸传感器(图 85-1)，如果需要，重复此过程添加额外的指纹。\n\n\
  ![](img/Image24253.jpg)\n\n图 85-1\n\n## 85.4 在清单文件中添加生物识别权限\n\n生物识别认证要求应用在项目清单文件中请求\
  \ `USE_BIOMETRIC` 权限。在 Android Studio Project 工具窗口中，找到并编辑 `app -> manifests -> AndroidManifest.xml`\
  \ 文件，按如下方式添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n```\n\n## 85.5 设计用户界面\n\n为了使示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 视图。找到并选择 `activity_main.xml`\
  \ 布局资源文件，将其加载到 `Layout Editor` 工具中。\n\n删除示例 `TextView` 对象，从调色板的 `Common` 类别中拖放一个\
  \ `Button` 对象，并将其放置在布局画布的中心。使用 `Attributes` 工具窗口将按钮上的 `text` 属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 85-2 所示所示：\n\n![](img/as_biometric_demo_ui.jpg)\n\
  \n图 85-2\n\n## 85.6 添加 Toast 便利方法\n\n在示例代码的各个位点，应用将被设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ Toast 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并将其作为 `Toast` 消息显示给用户。现在编辑\
  \ `MainActivity.java` 文件并如下所示添加此方法：\n\n```java\nimport android.widget.Toast;\n\n\
  private void notifyUser(String message) {\n    Toast.makeText(this,\n        message,\n\
  \        Toast.LENGTH_LONG).show();\n}\n```\n\n## 85.7 检查安全性\n\n在本章早些时候，已经采取了在设备或模拟器上配置锁屏和注册指纹的步骤。然而，在尝试寻求指纹认证之前，在应用中包含防御性代码以确保满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件的 `onCreate` 方法中执行，使用 `Keyguard` 和 `PackageManager` 服务。注意还添加了代码来验证是否为应用配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.PackageManager;\n\
  import android.app.Keyguard;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n            (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        if (!keyguardManager.isKeyguardSecure()) {\n            notifyUser(\"Lock\
  \ screen security not enabled in Settings\");\n        }\n        if (ActivityCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.USE_BIOMETRIC) !=\n            PackageManager.PERMISSION_GRANTED)\
  \ {\n            notifyUser(\"Fingerprint authentication permission not enabled\"\
  );\n        }\n    }\n}\n```\n\n上述代码更改首先使用 `Keyguard` 管理器验证是否配置了备份锁屏解锁方法（也就是说，可以使用\
  \ `PIN` 或其他身份验证方法作为指纹认证的替代方案）。如果锁屏未受保护，代码将向用户报告问题并返回方法。\n\n然后，在使用包管理器验证设备上的指纹认证之前，检查用户是否为应用启用了生物识别权限。\n\
  \n\n\n\n\n当配置了生物识别提示对话框时，需要分配一组身份验证回调方法，这些方法可以用于通知应用身份验证过程的成功或失败。这些方法需要被封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 类的实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例，并实现相应的方法：\n\n```java\nimport\
  \ android.hardware.biometrics.BiometricPrompt;\n\n    private BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n        return new BiometricPrompt.AuthenticationCallback()\
  \ {\n            @Override\n            public void onAuthenticationError(int errorCode,\
  \ CharSequence errString) {\n                notifyUser(\"Authentication error:\
  \ \" + errString);\n                super.onAuthenticationError(errorCode, errString);\n\
  \            }\n            @Override\n            public void onAuthenticationHelp(int\
  \ helpCode, CharSequence helpString) {\n                super.onAuthenticationHelp(helpCode,\
  \ helpString);\n            }\n            @Override\n            public void onAuthenticationFailed()\
  \ {\n                super.onAuthenticationFailed();\n            }\n          \
  \  @Override\n            public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult\
  \ result) {\n                notifyUser(\"Authentication Succeeded\");\n       \
  \         super.onAuthenticationSucceeded(result);\n            }\n        };\n\
  \    }\n```\n\n### 85.9 添加取消信号 (CancellationSignal)\n\n一旦启动，生物识别验证过程将独立于应用运行。为了给应用提供取消操作的方法，会创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别验证过程。随后可以使用该 `CancellationSignal` 实例在需要时取消过程。取消信号实例可以配置一个监听器，该监听将在取消完成后被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \n    private CancellationSignal cancellationSignal;\n\n    private CancellationSignal\
  \ getCancellationSignal() {\n        cancellationSignal = new CancellationSignal();\n\
  \        cancellationSignal.setOnCancelListener(() ->\n            notifyUser(\"\
  Cancelled via signal\"));\n        return cancellationSignal;\n    }\n```\n\n###\
  \ 85.10 启动生物识别提示\n剩下的只需在 `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt` 实例并启动身份验证。按照如下方式添加\
  \ `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\npublic void\
  \ authenticateUser(View view) {\n    BiometricPrompt biometricPrompt = new BiometricPrompt.Builder(this)\n\
  \        .setTitle(\"Biometric Demo\")\n        .setSubtitle(\"Authentication is\
  \ required to continue\")\n        .setDescription(\"This app uses biometric authentication\
  \ to protect your data.\")\n        .setNegativeButton(\"Cancel\", this.getMainExecutor(),\n\
  \            (dialogInterface, i) ->\n            notifyUser(\"Authentication cancelled\"\
  ))\n        .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(), getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类创建一个新的 `BiometricPrompt` 实例，并配置标题、副标题和描述文本，这些文本将显示在提示对话框中。负按钮被配置为显示“Cancel”的文本，并配置了一个监听器在点击此按钮时显示消息。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传入 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这通过传递一个 `Executor` 对象来定义。在本例中，使用 `getMainExecutor()`\
  \ 方法将一个主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用的主线程上进行。\n\n### 85.11\
  \ 测试项目\n现在项目已完成，在物理 Android 设备或模拟器上运行应用，并点击 Authenticate（验证）按钮以显示如图 85-3 所示的生物识别提示对话框：\n\
  \n![](img/as_3.2_biometric_prompt.jpg)\n图 85-3\n\n运行后，触碰指纹传感器或使用模拟器内的扩展控制面板按如“使用和配置\
  \ Android Studio AVD 模拟器”章节所述的方法来模拟指纹触摸。假设检测到已注册的指纹，提示对话框将返回主活动，此时将显示来自成功身份验证回调方法的\
  \ toast 消息。\n\n再次点击 Authenticate 按钮，使用未注册的指纹尝试身份验证。此时，生物识别提示对话框将指示指纹未识别：\n\n![](img/as_3.2_biometric_prompt_failed.jpg)\n\
  图 85-4\n\n通过点击生物识别提示对话框之外的区域来验证错误处理回调是否有效。提示对话框将消失，并弹出带有以下消息的 toast：\n\nAuthentication\
  \ error: Fingerprint operation canceled by user.\n\n检查使用 Cancel 按钮取消提示对话框是否会触发“Authentication\
  \ C” toast 消息。最后，使用未注册的指纹尝试多次身份验证，并注意在尝试几次后，提示对话框会指示发生了过多错误，在稍后之前无法再次尝试。\n\n###\
  \ 85.12 总结\n本章概述了如何将生物识别验证集成到 Android 应用项目中。这涉及使用 `BiometricPrompt` 类，一旦配置了适当的消息文本和回调，该类会自动处理大部分身份验证过程。\n\
  \n# 86 创建、测试和上传 Android App Bundle\n一旦完成 Android 应用开发工作并在广泛的 Android 设备上通过测试，下一步是为提交到\
  \ Google Play 准备应用。然而，在提交之前，必须对应用进行打包并使用私钥进行签名。本章将介绍获取私钥、准备 Android App Bundle 以及将其上传到\
  \ Google Play。\n\n### 86.1 发布准备流程\n到本书为止，我们一直以适用于测试和调试的模式构建应用项目。另一方面，为向客户发布到 Google\
  \ Play 构建应用包需要额外的步骤。第一个要求是以发布模式而非调试模式编译应用程序。其次，应用程序必须使用私钥进行签名，该私钥将唯一标识你为应用程序开发者。最后，必须应用程序打包成\
  \ Android App Bundle。\n\n虽然这些任务可以在 Android Studio 环境之外完成，但使用 Android Studio 构建机制执行这些操作更加简单，正如本章其余部分所述。不过，首先重要的是进一步了解\
  \ Android App Bundles。\n\n### 86.2 Android App Bundles\n\n\n\n\n\n当用户从 Google Play\
  \ 安装应用时，应用将以 `APK` 文件的形式下载。该文件包含了在用户设备上安装和运行该应用所需的所有内容。在 `Android Studio 3.2` 引入之前，开发者会使用\
  \ `Android Studio` 生成一个或多个 `APK` 文件并将其上传到 Google Play。支持多种设备类型、屏幕尺寸和本地语言需要为每个目标设备和本地语言创建并上传多个自定义的\
  \ `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制文件的单一通用 `APK`（universal APK）。\n\n创建多个 `APK` 文件涉及大量工作，且在每次更新应用时都必须重复这些工作，这为应用发布过程带来了巨大的时间开销。\n\
  \n通用 `APK` 选项虽然减轻了开发者的负担，但导致了一个完全出意之外的问题。通过分析应用安装指标，Google 发现安装包 `APK` 文件越大（导致下载时间变长和存储占用增加），应用获得的转化率就越低。转化率的计算方式是在\
  \ Google Play 上查看应用后完成安装的用户所占的百分比。Google 估计，`APK` 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\n\
  Android App Bundles 解决了这些问题，它允许开发者在 `Android Studio` 内部创建一个单一包，并让 Google Play 为每个支持的独立配置自动生成自定义\
  \ `APK` 文件（这一概念称为`动态交付`，Dynamic Delivery）。\n\nAndroid App Bundle 是一个 `ZIP` 文件，包含了为应用项目中支持的设备和本地语言构建\
  \ `APK` 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google Play 会接收有关设备的信息，包括显示器、处理器架构和本地语言。利用这些信息，相应的预生成\
  \ `APK` 文件将被传输到用户的设备。\n\n`动态交付` 的另一个优点是可以将应用拆分为多个模块（称为动态功能模块），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的独立\
  \ `APK` 文件中，并且在用户需要该功能时才下载到设备上。`动态交付`和应用包还允许创建快速动态功能模块，这些模块可以在设备上立即运行，而无需安装整个应用。\n\
  \n尽管仍然可以通过 `Android Studio` 生成 `APK` 文件，但现在应用包已成为向 Google Play 上传应用的推荐方式。\n\n##\
  \ 86.3 注册 Google Play 开发者控制台账号\n\n提交应用的第一步是创建一个 `Google Play 开发者控制台`账号。要为此操作，请导航到\
  \ `https://play.google.com/apps/publish/signup/` 并按照说明完成注册过程。请注意，注册需要一次性 25 美元的费用。一旦应用开始销售，Google\
  \ 将保留与应用相关的所有收入的 30%。创建帐户后，可以通过 `https://play.google.com/console` 访问开发者控制台。\n\n\
  下一步是收集有关应用的信息。为了将您的应用推向市场，需要以下信息：\n\n*   **标题 (Title)** – 应用标题。\n*   **短描述 (Short\
  \ Description)** – 最多 80 字的应用描述。\n*   **完整描述 (Full Description)** – 最多 4000 字的应用描述。\n\
  *   **截图 (Screenshots)** – 最多 8 张应用运行截图（至少两张）。Google 建议提交在 7 英寸或 10 英寸平板电脑上运行的应用截图。\n\
  *   **语言 (Language)** – 应用语言（默认为美式英语）。\n*   **宣传文本 (Promotional Text)** – 当您的应用出现在\
  \ Google Play 环境中的特殊促销活动中时使用的文本。\n*   **应用类型 (Application Type)** – 您的应用被视为游戏还是应用程序。\n\
  *   **类别 (Category)** – 最能最好描述您应用的类别（例如：金融、健康与健身、教育、体育等）。\n*   **地区 (Locations)**\
  \ – 您希望您的应用可供购买的地理位置。\n*   **联系详情 (Contact Details)** – 用户可以通过哪些方式联系您以获得应用相关的支持。选项包括网页、电子邮件和电话。\n\
  *   **定价与分发 (Pricing & Distribution)** 关于应用价格以及市场营销和销售地理位置的信息。\n\n收集上述信息后，点击 `Google\
  \ Play Console` 内的`创建应用 (Create app)` 按钮开始创建过程。\n\n## 86.4 在控制台中配置应用\n\n当首次点击`创建应用`按钮时，将显示应用详情和声明屏幕，如下方的图\
  \ 86-1 所示：\n\n```\nOEBPS/image/as_4.1_play_create_app.jpg\n```\n图 86-1\n\n一旦应用条目完全完成，点击`创建应用`按钮（在上方图中高亮）以添加应用并显示仪表板屏幕。在仪表板中，找到`设置您的应用\
  \ (Set up your app)`部分并展开任务列表以配置应用商店列表目：\n\n```\nOEBPS/image/google_play_setup_app.jpg\n\
  ```\n图 86-2\n\n按照链接列表进行操作，并为您的应用提供所需信息，确保在每一步都保存更改。\n\n## 86.5 启用 Google Play 应用签名\n\
  \n直到最近，Google Play 的上传文件都是使用 `Android Studio` 内部的发布应用签名密钥进行签名，然后上传到 Google Play。虽然该选项仍然可用，但推荐的上传方式是使用`Google\
  \ Play 应用签名`。对于新创建的应用，这涉及启用`Google Play 应用签名`并在 `Android Studio` 内部生成上传密钥。当上传 `Android\
  \ Studio` 生成的应用包时，`Google Play console` 将移除上传密钥并使用存储在 Google Play 服务器中的应用签名密钥进行签名。对于现有应用，需要一些额外的步骤来启用\
  \ Google Play 应用签名，将在本文末尾介绍。\n\n在`Google Play console` 中，从左侧导航面板顶部的`所有应用 (All Apps)`屏幕选择新添加的应用条目，展开`设置\
  \ (Setup)`部分（见图 86-3 中的 A），并选择`应用签名 (App Signing)`选项（B）。\n\n```\nOEBPS/image/as_4.1_play_enable_app_signing.jpg\n\
  ```\n图 86-3\n\n点击`创建发布 (Create release)`按钮（C）启用 Google Play 应用签名。现在控制台已准备好创建应用的测试版本。在此之前，下一步是在\
  \ `Android Studio` 内部生成密钥。这是生成签名应用包过程的一部分。保持当前 `Google Play Console` 屏幕加载，我们将在本章之后返回。\n\
  \n## 86.6 创建密钥库文件\n\n要创建密钥库文件，选择`Android Studio Build -> 生成签名包/APK (Generate Signed\
  \ Bundle / APK…)` 菜单选项，显示`生成签名包或 APK 向导`对话框，如下图 86-4 所示：\n\n```\nOEBPS/image/as_generate_app_bundle.jpg\n\
  ```\n图 86-4\n\n在点击`下一步 (Next)` 之前，请确认已选择`Android App Bundle`选项。\n\n\n\n\n\n如果你有一个现有的发布密钥库文件（keystore），点击下一个屏幕上的`Choose\
  \ existing…`（选择现有…）按钮，并选择该文件。如果你尚未创建密钥库文件，点击`Create new…`（新建…）按钮显示新建密钥库对话框（图 86-5）。点击密钥库路径字段右侧的按钮，导航到文件系统上的合适位置，为密钥库文件输入名称（例如，`release.keystore.jks`），然后点击`OK`按钮。\n\
  \n`New Key Store`对话框分为两个部分。上半部分与密钥库文件有关。在此部分，在`Password`（密码）和`Confirm`（确认）字段中输入强密码以保护密钥库文件。对话框的下半部分与存储在密钥库文件中的上传密钥有关。\n\
  \n![](img/as_generate_new_key_store.jpg)\n图 86-5\n\n在`New Key Store`对话框的`Key`部分，输入以下详细信息：\n\
  \n* 密钥的别名（alias）。可以是任何字符序列，但系统仅使用前八位。\n* 用于保护密钥的足够强度的密码。\n* 密钥有效的年数（Google 建议超过\
  \ 25 年）。\n\n此外，必须为剩余字段中的至少一个字段提供信息（例如，你的姓、名或组织名称）。\n\n输入信息后，点击`OK`按钮创建程序包（bundle）。\n\
  \n## 86.7 创建 Android 应用包 (Android App Bundle)\n\n下一步是指示 Android Studio 以发布模式构建应用程序应用包文件，并使用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK`（生成签名的包或 APK）对话框应仍显示，且密钥库路径、密码和密钥别名字段已填充信息：\n\n![](img/as_generate_app_bundle_keystore_ready.jpg)\n\
  图 86-6\n\n确保启用`Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击`Next`（下一步）按钮继续进入应用包生成屏幕（图\
  \ 86-7）。在此屏幕中，检查`Destination Folder:`（目标文件夹）设置，以验证生成应用包文件的位置是否是可以接受的。如果偏好其他位置，点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/as_generate_app_bundle_generate.jpg)\n图 86-7\n\n点击`Create`（创建）按钮并等待`Gradle`系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹选项，或将文件加载到`APK\
  \ Analyzer`中：\n\n![](img/as_generate_app_bundle_ready.jpg)\n图 86-8\n\n此时，应用程序已准备好提交到\
  \ Google Play。点击`locate`（定位）链接打开文件浏览器窗口。文件应命名为 `bundle.aab`，并位于项目文件夹的`app/release`子目录下，除非另有指定位置。\n\
  \n在此过程中生成的私钥应在签名和发布未来的应用程序时使用，因此应将其保放在安全的地方并进行安全备份。\n\n## 86.8 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包生成\
  \ APK 文件，并在设备或模拟器会话上安装运行它们。Google 提供了一个名为`bundletool`的命令行工具，专门为此目的设计，可以从以下 URL 下载：\n\
  \n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool`以`.jar` 文件的形式提供，可以如下所示从命令行执行（注意版本号自本书出版以来可能已经更改）：\n\n```\njava\
  \ -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中可用的所有选项。要从应用包生成 APK 文件，使用`build-apks`选项。这些文件还需要签名，以生成可以安装到设备或模拟器上的\
  \ APK 文件。为了实现这一点，请包含--ks`选项以指定在本章之前创建的密钥库文件路径，并包含--ks-key-alias`选项以指定生成密钥时提供的别名。\n\
  \n最后，必须使用--output`标志来指定生成 APK 文件的文件路径（称为 APK Set/集合）。该文件不能已经存在，并且要求具有`.apks`文件扩展名。将这些要求结合起来，得到以下命令行（允许你的操作系统的路径结构存在差异）：\n\
  \n```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，在将 APK 文件生成到指定的 APK Set 文件之前，将出现一个提示请求密钥库密码。APK Set 文件是一个 ZIP 文件，包含了从应用包生成的所有\
  \ APK 文件。\n\n要将适当的 APK 文件安装到连接的设备或模拟器上，使用以下命令：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=/tmp/MyApks\n```\n\n此命令将指示工具识别连接设备的适当 APK 文件并安装它们，以便启动应用程序。\n\
  \n也可以从 APK Set 中提取 APK 文件而不安装。此过程的第一步是获取连接设备的规范：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似的 JSON 文件：\n\n```json\n\
  {\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\": [\"en-US\"],\n  \"screenDensity\"\
  : 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规范文件从 APK Set 中提取 APK 文件：\n\n```\n\
  java -jar bundletool-all-0.9.0.jar extract-apks --apks=/tmp/MyApks --output-dir=/tmp/nexus5\
  \ --device-spec=/tmp/device.json\n```\n\n执行后，通过--output-dir 指定的目录将包含正确的 APK 文件。\n\
  \n## 86.9 将应用包上传到 Google Play Console\n\n将 Android 推向市场的下一步是将其提交到 Google Play Console\
  \ 进行测试。\n\n返回 Google Play Console，并在导航面板的测试部分中选择`Internal testing`选项（如图 86-9 中的\
  \ A 所示），然后点击`Create release`（创建新版本）按钮（B）：\n\n![](img/as_4_1_play_create_new_release.jpg)\n\
  图 86-9\n\n在生成的屏幕上，点击下方的`Continue`（继续）按钮以确认使用 Google Play 应用签名，然后将 Android Studio\
  \ 生成的包文件拖放到上传投放点（B）：\n\n![](img/as_4_1_play_upload_bundle.jpg)\n图 86-10\n\n上传完成后，滚动屏幕并输入版本名称和可选的发行说明。版本名称可以是任何帮助你识别版本的信息，它对用户不可见。\n\
  \n在应用包文件上传后，Google Play 将生成所有测试所需的 APK 文件。APK 文件生成后，滚动到屏幕底部点击`Save`（保存）按钮。保存保存后，点击`Review\
  \ release`（审核版本）按钮。\n\n## 86.10 探索应用包\n\n在审核屏幕上，点击已上传包右侧的箭头，如图 86-11 所示：\n\n![](img/as_4_1_play_app_bundle_review.jpg)\n\
  图 86-11\n\n\n\n\n\n在生成的面板中，点击 `Explore` 束链接以加载应用包探险器。这提供了与应用包的 API 级别、屏幕布局以及支持的平台相关的摘要信息：\n\
  \n![](img/as_4.1_play_app_bundle_explorer.jpg)\n图 86-12\n\n点击 `Go to device catalog`\
  \ 链接将显示 APK 文件支持的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n图 86-13\n\n目前，应用已准备好进行测试，但只有在控制台中设置了某些测试人员后才能进行发布。\n\
  \n### 86.11 管理测试人员\n\n如果应用仍处于内部（Internal）、Alpha 或 Beta 测试阶段，可以通过在 Google Play 控制台中选择该应用、点击导航面板中的\
  \ `Internal testing`，并选择 `Testers` 选项卡来指定一组授权的测试人员列表，如 图 86-14 所示：\n\n![](img/as_4.1_play_testers.jpg)\n\
  图 86-14\n\n要添加测试人员，点击 `Create email list` 按钮，为列表命名，并手动或通过上传 CSV 文件指定测试用户的电子邮件地址。\n\
  \n现在可以从屏幕复制“Join on the web” URL 并提供给测试人员，以便他们接受测试邀请并下载应用。\n\n### 86.12 发布应用进行测试\n\
  \n既然已经创建了内部发布并添加了测试人员列表，应用已准备好发布进行测试。留在 `Internal testing` 屏幕，在点击最近创建的发布的 `Edit`\
  \ 按钮之前，选择 `Releases` 选项卡：\n\n![](img/as_4.1_play_ready_for_rollout.jpg)\n图 86-15\n\
  \n在审核屏幕上，滚动到最后并点击 `Start rollout to Internal testing` 按钮。在发布处理稍作延迟后，应用将供指定用户下载和测试。\n\
  \n### 86.13 上传新的应用包版本\n\n为您的应用程序上传的第一个应用包文件版本号始终为 1。如果尝试上传具有相同版本号的另一个包文件，控制台将通过以下错误拒绝该文件：\n\
  \n```\nYou need to use a different version code for your APK because you already\
  \ have one with version code 1.\n```\n\n要解决此问题，需要增加嵌入包文件中的版本号。这在项目模块级的 `build.gradle.kts`\
  \ 文件中完成，如 图 86-16 中高亮所示：\n\n![](img/as_generate_module_gradle_file.jpg)\n图 86-16\n\
  \n该文件的内容通常如下：\n\n```kotlin\nplugins {\n    id(\"com.android.application\")\n}\n\n\
  android {\n    namespace = \"com.ebookfrenzy.biometricdemo\"\n    compileSdk = 34\n\
  \    defaultConfig {\n        applicationId = \"com.ebookfrenzy.biometricdemo\"\n\
  \        minSdk = 33\n        targetSdk = 34\n        versionCode = 1\n        versionName\
  \ = \"1.0\"\n    }\n}\n```\n\n要更改版本号，请更改 `versionCode` 旁边的数字。要同时更改向应用程序用户显示的版本号，请更改\
  \ `versionName` 字符串。例如：\n\n```\nversionCode 2\nversionName \"2.0\"\n```\n\n做出这些更改后，重新构建\
  \ APK 文件并再次上传。\n\n### 86.14 分析应用包文件\n\nAndroid Studio 提供了分析应用包文件内容的能力。要分析包文件，选择\
  \ `Android Studio Build -> Analyze APK…` 菜单选项，导航并选择要审查的包文件。一旦加载到工具中，将显示有关包的原始大小和下载大小，以及包的文件结构列表，如\
  \ 图 86-17 所示：\n\n![](img/as_analyze_apk.jpg)\n图 86-17\n\n选择 `classes.dex` 文件将在下面板中显示该文件的类结构。在此面板中，可以探索单个类的详细信息，甚至深入到类中的方法级别：\n\
  \n![](img/as_analyze_apk_dex.jpg)\n图 86-18\n\n同样，在文件列表中选择资源或图像文件将在下面板中显示文件内容。可以通过点击\
  \ `Compare with previous APK…` 按钮并选择第二个包文件来查看两个包文件之间的大小差异。\n\n### 86.15 总结\n\n一旦应用项目完成或准备好用户测试，就可以将其上传到\
  \ Google Play 控制台并发布到生产、内部、Alpha 或 Beta 测试。在应用应用之前，必须在控制台中创建一个应用条目，包括应用信息和用于控制台的截图。应用包被生成并使用上传密钥签名，Google\
  \ Play 移除上传密钥并将其替换为安全的应用签名密钥，应用即可准备发布。可以随时通过将其加载到 Android Studio APK Analyzer 中来审查包文件的内容。\n\
  \n## 87. Android 内购概览\n\n在 Android 和 iOS 等移动操作系统的早期，获取收入的最常见方法是收取下载和安装的预付费。另一种收入机会很快通过在应用内嵌入广告引入。最有利的选择是让用户在安装后在应用内购买物品。这通常采取访问游戏道具、购买虚拟商品或货币，或订阅数字杂志或报纸的形式。\n\
  \nGoogle Play 内购 API 和控制台支持内购。本章将提供内购的概述，并概述如何在项目中集成内购。\n\n### 87.1 为项目准备内购\n\n\
  在应用中构建内购需要 Google Play 开发者控制帐户，详情已在创建、测试和上传 Android 应用包章节中介绍。您还必须注册 Google 商家账户。这些设置可以通过导航控制台中的\
  \ `Setup -> Payments profile` 找到。请注意商家注册并非所有国家都可用。详情请参考以下页面：\n\n[`support.google.com/googleplay/android-developer/answer/9306917`](https://support.google.com/googleplay/android-developer/answer/9306917)\n\
  \n应用必须上传到控制台并启用内购。但除非模块级 `build.gradle.kts` 文件中添加了 Google Play Billing Library，否则控制台不会激活应用内购支持：\n\
  \n```kotlin\ndependencies {\n    implementation(libs.billingclient)\n}\n```\n\n\
  修改构建文件并将应用包上传到控制台后，下一步是添加用户购买的应用内产品或订阅。\n\n### 87.2 创建应用内产品和订阅\n\n产品和订阅是使用 Play\
  \ 控制台导航面板中 `Monetize` 部分下方列出的选项创建和管理的，如下方的图 87-1 所示：\n\n![](img/play_console_monetization.jpg)\n\
  图 87-1\n\n\n\n\n\n每个产品或订阅都需要一个 ID、标题、描述和价格信息。购买分为以下几类：消耗性（用户每次需要时都必须购买，例如游戏中的虚拟货币）、非消耗性（用户仅需购买一次，例如内容访问权限）以及订阅制。消耗性和非消耗性产品统称为受管理产品。\n\
  \n订阅适用于销售需要定期续订的商品，例如新闻内容的访问权限或 App 的高级功能。在创建订阅时，基础方案（base plan）会指定价格、续订周期（按月、按年等）以及订阅是否自动续订。还可以为用户提供优惠优惠以及预购订阅的选项。\n\
  \n## 87.3 计费客户端初始化\n\n您的应用与 Google Play Billing 库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组可以调用的方法，用于执行同步和异步计费相关活动。在初始化计费客户端时，需要为它提供一个 `PurchasesUpdatedListener` 回调处理程序的引用。客户端将调用此处理程序来通知您的应用任何购买活动的结果。为了避免重复通知，建议每个应用只保留一个\
  \ `BillingClient` 实例。\n\n可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，并传入当前的 activity\
  \ 或 fragment 上文。然后通过 `setListener()` 方法将购买更新处理程序分配给客户端：\n\n```java\nprivate final\
  \ PurchasesUpdatedListener purchasesUpdatedListener =\n    new PurchasesUpdatedListener()\
  \ {\n        @Override\n        public void onPurchasesUpdated(BillingResult billingResult,\n\
  \                List<Purchase> purchases) {\n            if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK\n               \
  \     && purchases != null) {\n                // 购买成功\n                for (Purchase\
  \ purchase : purchases) {\n                    // 处理购买\n                }\n    \
  \        } else if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                // 在此处处理错误\n\
  \            }\n        }\n    };\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n## 87.4 连接到 Google Play Billing 库\n\n在成功创建计费客户端后，下一步是初始化与 Google\
  \ Play Billing 库的连接。必须调用计费客户端实例的 `startConnection()` 方法来建立此连接。由于连接是异步执行的，必须实现 `BillingClientStateListener`\
  \ 以接收指示连接是否成功的回调。还应该添加代码来重写 `onBillingServiceDisconnected()` 方法。当与 Billing 库的连接丢失时，会调用此方法，并用于向用户报告问题以及重试连接。\n\
  \n一旦完成设置和连接任务，`BillingClient`实例将调用 `onBillingSetupFinished()` 方法，该方法用于检查客户端是否已就绪：\n\
  \n```java\nbillingClient.startConnection(new BillingClientStateListener() {\n  \
  \  @Override\n    public void onBillingSetupFinished(\n            @NonNull BillingResult\
  \ billingResult) {\n        if (billingResult.getResponseCode() ==\n           \
  \     BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n        } else\
  \ {\n            // 连接失败\n        }\n    }\n    @Override\n    public void onBillingServiceDisconnected()\
  \ {\n        // 连接丢失\n    }\n});\n```\n\n## 87.5 查询可用产品\n\n一旦计费环境初始化并准备就绪，下一步就是请求可购买的产品或订阅的详情。这通过调用\
  \ `BillingClient` 的 `queryProductDetails()` 方法并传入一个配置适当的 `QueryDetailsParams` 实例来实现，该实例包含产品\
  \ ID 和类型（订阅使用 `ProductType.SUBS`，受管理产品使用 `ProductType.INAPP`）：\n\n```java\nQueryDetailsParams\
  \ queryProductDetailsParams =\n    QueryDetailsParams.newBuilder()\n        .setProductList(\n\
  \            ImmutableList.of(\n                QueryDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsListener() {\n        public void onProductDetailsResponse(\n\
  \                @NonNull BillingResult billingResult,\n                @NonNull\
  \ List<ProductDetails> productDetailsList) {\n            if (!productDetailsList.isEmpty())\
  \ {\n                // 处理匹配的产品列表\n            } else {\n                // 未找到匹配的产品\n\
  \            }\n        }\n    });\n```\n\n`queryProductDetailsAsync()` 方法被传递了一个\
  \ `ProductDetailsListener` 处理程序，该处理程序会被调用并传入一个包含匹配产品信息的 `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法来获取产品名称、描述、价格和优惠信息。\n\
  \n## 87.6 启动购买流程\n\n一旦产品或订阅被查询并由用户选择，购买流程就可以启动了。我们通过调用 `BillingClient` 的 `launchBillingFlow()`\
  \ 方法来实现，传入当前 activity 以及一个配置了已购商品 `ProductDetail` 对象的 `BillingFlowParams` 实例。\n\n\
  ```java\nBillingFlowParams billingFlowParams =\n    BillingFlowParams.newBuilder()\n\
  \        .setProductDetailsParams(\n            ImmutableList.of(\n            \
  \    BillingFlowParams.ProductDetailsParams.newBuilder()\n                    .setProductDetails(productDetails)\n\
  \                    .build()))\n        )\n        .build();\n\nbillingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n```\n\n购买操作的成功或失败将通过前面所述的处理程序报告。\n\n## 87.7 完成购买\n\n当购买成功时，`PurchasesUpdatedListener`\
  \ 处理程序将获得一个包含每个商品 `Purchase` 对象的列表。可以通过调用 `Purchase` 实例的 `getPurchaseState()` 方法来验证商品是否已购买：\n\
  \n```java\nif (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\
  \ {\n    // 购买完成\n} else if (purchase.getPurchaseState() == Purchase.PurchaseState.PENDING)\
  \ {\n    // 支付待处理中\n}\n```\n\n注意，只有在初始化期间调用了 `enablePendingPurchases()` 方法，您的应用才会支持待付款。待付款购买将一直处于该状态，直到用户完成支付流程。\n\
  \n非消耗性商品的购买完成后，必须对其进行确认以防止向用户退款。这需要购买令牌，令牌通过调用 `Purchase` 对象的 `getPurchaseToken()`\
  \ 方法获取。该令牌用于创建 `AcknowledgePurchaseParams` 实例和 `AcknowledgePurchaseResponseListener`\
  \ 处理程序。受管理产品的购买和订阅通过调用 `BillingClient` 的 `acknowledgePurchase()` 方法进行确认：\n\n```java\n\
  AcknowledgePurchaseParams acknowledgePurchaseParams =\n```\n\n\n\n\n\n```java\n\
  AcknowledgePurchaseParams.newBuilder()\n    .setPurchaseToken(purchase.getPurchaseToken())\n\
  \    .build();\n```\n\n`AcknowledgePurchaseResponseListener acknowledgePurchaseResponseListener\
  \ =\n    new AcknowledgePurchaseResponseListener() {\n        @Override\n      \
  \  public void onAcknowledgePurchaseResponse(\n                @NonNull BillingResult\
  \ billingResult) {\n            billingClient.acknowledgePurchase(\n           \
  \         acknowledgePurchaseParams,\n                acknowledgePurchaseResponseListener);\n\
  \        }\n    };\n\n对于消耗性商品，你需要在项目被消耗后通知 Google Play，以便用户可以再次购买。这需要一个包含购买令牌的已配置\
  \ `ConsumeParams` 实例、一个 `ConsumeResponseListener`，以及调用计费客户端的 `consumeAsync()` 方法：\n\
  \n```java\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n     \
  \   .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\n\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult,\n                                    @NonNull String purchaseToken)\
  \ {\n        if (billingResult.getResponseCode() ==\n                BillingClient.BillingResponseCode.OK)\
  \ {\n            // 消耗成功\n        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams,\
  \ listener);\n```\n\n# 87.8 查询之前的购买记录\n\n在处理应用内购买时，检查用户是否已经购买了商品或订阅是一项常见需求。可以通过调用\
  \ `BillingClient` 实例的 `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener` 来生成用户之前购买的所有特定类型项目列表。例如，以下代码获取了所有尚未消耗的之前的购买项目列表：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n\n\
  billingClient.queryPurchasesAsync(queryPurchasesParams,\n    new PurchasesResponseListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult,\n                                            @NonNull List<Purchase>\
  \ list) {\n            // 处理购买列表\n        }\n    });\n```\n\n要获取活跃订阅列表，请将 `ProductType`\
  \ 值从 `INAPP` 更改为 `SUBS`。\n\n或者，要获取每个产品的最近购买记录列表，请调用 `BillingClient` 的 `queryPurchaseHistoryAsync()`\
  \ 方法：\n\n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    QueryPurchaseHistoryParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n\n\
  billingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n    new PurchasesResponseListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult,\n                                            @NonNull List<Purchase>\
  \ list) {\n        } });\n```\n\n# 87.9 总结\n\n应用内购买通过销售订阅提供了在应用产生收入的方式。在本章中，我们探索了应用内购买并解释了消耗性与非消耗性商品之间的区别。下一章将把理论付诸实践。\n\
  \n## 88. 应用购买教程\n\n在上章中，我们探索了如何将应用内购买集成到 Android 项目中。本教程将展示如何添加计费客户端并启用测试购买。\n\n\
  ## 88.1 关于应用内购买示例\n\n该项目的简单概念是一个必须购买商品的应用。本章将连接到应用商店并显示商品详情。\n\n## 88.2 创建 InAppPurchase\
  \ 项目\n\n此练习的第一步是创建一个新项目。启动 Android Studio 并在欢迎界面选择 New Project 选项。在新项目对话框中选择 Empty\
  \ Views Activity 模板。在 Name 字段中输入 `InAppPurchase`，并指定一个唯一标识你应用的包名（例如 `com.example.inapppurchase`）。在点击\
  \ Finish 按钮之前，将 Minimum API 设置为 API 26：Android 8.0 (Oreo)，并将 Language 菜单更改为 Java。\n\
  \n## 88.3 向项目添加库\n\n在编写代码之前，必须向项目配置中添加一些库，包括标准的 Android 计费库。在项目的后期，我们还需要使用 Google\
  \ Core Java 库一部分的 `ImmutableList` 类。编辑版本目录（Gradle Scripts -> `libs.versions.toml`）并添加以下内容：\n\
  \n```toml\n[versions]\nbilling = \"6.2.0\"\ngauvaJre = \"24.1-jre\"\ngauvaAndroid\
  \ = \"27.0.1-android\"\n\n[libraries]\nbillingclient = { group = \"com.android.billingclient\"\
  , name = \"billing\", version.ref = \"billing\" }\nguava-jre = { group = \"com.google.guava\"\
  , name=\"guava\", version.ref = \"gauvaJre\" }\nguava-android = { group = \"com.google.guava\"\
  , name=\"guava\", version.ref = \"gauvaAndroid\" }\n```\n\n进行更改后，点击编辑器面板顶部的 Sync\
  \ Now 链接，然后如下修改 Gradle Scripts -> `build.gradle.kts` (Module: app) 文件：\n\n```kotlin\n\
  dependencies {\n    implementation(libs.billingclient)\n    implementation(libs.guava.jre)\n\
  \    implementation(libs.guava.android)\n}\n```\n\n## 88.4 设计用户界面\n\n用户界面将由现有的 `TextView`\
  \ 和两个 Button 组成。在编辑器加载 `activity_main.xml` 文件时，拖放两个 Button 视图到布局中，使其一个位于 `TextView`\
  \ 上方，另一个位于下方。选择 `TextView` 并将 id 属性更改为 `statusText`。\n\n\n\n\n\n点击工具栏中的 `Clear all\
  \ Constraints`（清除所有约束）按钮，并按住 Shift 键选择三个视图。右键点击最顶部的 Button 视图，选择 `Center -> Horizontally\
  \ in Parent`（水平水平居中）菜单选项。再次重复此步骤，选择 `Chains -> Create Vertical Chain`（链创建垂直链）。更改顶部按钮的文本属性使其显示为“Consume\
  \ Purchase”，并将 `id` 设置为 `consumeButton`。同时，配置 `onClick` 属性调用名为 `consumePurchase`\
  \ 的方法。\n\n选择底部的按钮并重复上述步骤，将文本设置为“Buy Product”，`id` 设置为 `buyButton`，并将 `onClick` 回调设置为\
  \ `makePurchase`。完成后，其布局应与图 88-1 所示所示：\n\n![](img/as_inapppurchase_ui.jpg)\n\n图\
  \ 88-1\n\n## 88.5 将应用添加到 Google Play 商店\n\n按照标题为创建、测试和上传 Android App Bundle 的章节列出的步骤，登录\
  \ Play Console，创建一个新应用并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回 Android Studio 并为项目生成已签名的发布版\
  \ bundle。一旦生成了包文件，将其上传到内部测试轨道并发布进行测试。\n\n现在应用已进入 Google Play 商店，我们准备好为该项目创建一个内购商品了。\n\
  \n## 88.6 创建内购商品\n\n在 Play Console 中选中应用，向下滚动左侧面板中的选项列表，直到出现 `Monetize`（变现）部分。在该部分，选择\
  \ `Products`（商品）下的 `In-app products`（内购商品）选项，如图 88-2 所示：\n\n![](img/play_console_monetization1.jpg)\n\
  \n图 88-2\n\n在 `In-app products` 上，点击 `Create product`（创建产品）按钮：\n\n![](img/play_console_create_product.jpg)\n\
  \n图 88-3\n\n在新产品屏幕上，保存新产品之前输入以下信息：\n\n*   Product ID: `one_button_click`\n*   Name:\
  \ `A Button Click`\n*   Description: `This is a test in-app product that allows\
  \ a button to be clicked once.`\n*   Default price: 设置为你偏好货币的最低可用价格。\n\n## 88.7\
  \ 启用许可测试人员\n\n在测试内购计费时，在不花费任何资金的情况下进行测试购买是有用的。这可以通过为内部轨道测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被收费。\n\
  \n在 Play Console 中，返回主屏幕并选择 `Setup -> License testing`（设置 -> 许可测试）选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 88-4\n\n在许可测试屏幕内，添加为内部轨道添加的测试人员，将 `License response`（许可响应）设置更改为 `RESPOND_NORMALLY`（正常响应），并保存更改：\n\
  \n![](img/play_console_license_testing_screen.jpg)\n\n图 88-5\n\n现在应用和内购商品已在 Play\
  \ Console 中设置好，我们可以向项目中添加代码了。\n\n## 88.8 初始化计费客户端\n\n编辑 `MainActivity.java` 文件并进行以下更改开始实现内购功能：\n\
  \n```java\nimport androidx.annotation.NonNull;\nimport android.util.Log;\nimport\
  \ com.android.billingclient.api.*;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private BillingClient billingClient;\n\
  \    private ProductDetails productDetails;\n    private Purchase purchase;\n  \
  \  static final String TAG = \"InAppPurchaseTag\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        billingSetup();\n\
  \    }\n\n    private void billingSetup() {\n        billingClient = BillingClient.newBuilder(this)\n\
  \                    .setListener(purchasesUpdatedListener)\n                  \
  \  .enablePendingPurchases()\n                    .build();\n        billingClient.startConnection(new\
  \ BillingClientStateListener() {\n            @Override\n            public void\
  \ onBillingSetup(@NonNull BillingResult billingResult) {\n                if (billingResult.getResponseCode()\
  \ == BillingClient.ResponseCode.OK) {\n                    Log.i(TAG, \"OnBillingSetup\
  \ connected\");\n                    queryProduct();\n                } else {\n\
  \                    Log.i(TAG, \"OnBillingSetup failed\");\n                }\n\
  \            }\n            @Override\n            public void onBillingDisconnected()\
  \ {\n                Log.i(TAG, \"OnBillingSetup connection lost\");\n         \
  \   }\n        });\n    }\n```\n\n当应用启动时，`onCreate()` 方法现在将调用 `billingSetup()`，反过来这将创建一个新的\
  \ `billing client` 实例并尝试连接到 Google Play 计费库。连接完成后将调用 `onBillingSetup()` 监听器，并输出指示连接尝试成功或失败的\
  \ Logcat 。最后，我们还实现了 `onBillingDisconnected()` 回调，如果 Google Play 计费库连接丢失，该回调将被调用。如果连接成功，则调用\
  \ `queryProduct()`。此方法以及分配给 `billing client` 的 `purchasesUpdatedListener` 必须添加。\n\
  \n## 88.9 查询商品\n\n为了确保商品可以购买，我们需要使用在 Play Console 中指定的商品 ID 创建 `QueryProductDetailsParams`\
  \ 实例，并将其传递给 billing client 的 `queryProductDetailsAsync()` 方法。这将要求我们添加 `onProductDetails()`\
  \ 回调方法，其中我们将检查商品是否存在、提取商品名称并显示在状态 `TextView` 上。现在我们已经获取了商品详情，还可以安全地启用购买按钮。在 `MainActivity`\
  \ 文件中，添加 `queryProduct()` 方法，内容如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryProductDetailsParams =\n        QueryProductDetailsParams.newBuilder()\n\
  \            .setProductList(\n                ImmutableList.of(\n             \
  \       QueryProductDetailsParams.Product.newBuilder()\n                       \
  \     .setProductId(\"one_button_click\")\n                            .setTypes(BillingClient.ProductType.IN)\n\
  \                            .build()\n                ))\n            .build();\n\
  \    billingClient.queryProductDetailsAsync(queryProductDetailsParams, new ProductDetailsResponseListener()\
  \ {\n        @Override\n        public void onProductDetailsResponse(@NonNull BillingResult\
  \ billingResult, @NonNull List<ProductDetails> productDetailsList) {\n         \
  \   if (!productDetailsList.isEmpty()) {\n                productDetails = productDetailsList.get(0);\n\
  \                runOnUiThread(() -> {\n                    binding.buyButton.setEnabled(true);\n\
  \                    binding.statusText.setText(productDetails.getName());\n   \
  \             });\n            } else {\n                Log.i(TAG, \"onProductDetailsResponse:\
  \ No products\");\n            }\n        }\n    });\n}\n```\n\n\n\n\n这里使用的许多代码在上一章节中应该已经熟悉了。监听器代码检查至少有一个产品符合查询标准。然后，从第一个匹配的产品中提取\
  \ `ProductDetails` 对象，将其存储在 `productDetails` 变量中，并在 `TextView` 上显示产品名称属性。\n\n需要注意的一点是，当我们在状态\
  \ `TextView` 上显示产品名称时，是通过调用 `runOnUiThread()` 实现的。这是必要的，因为监听器没有运行在主线程，所以它无法安全地直接更改用户界面。`runOnUiThread()`\
  \ 方法提供了一种在不使用协程的情况下在主线程执行代码的快速方便的方法。\n\n## 88.10 启动购买流程\n\n当用户点击购买按钮时，将调用 `makePurchase()`\
  \ 来启动购买过程。我们现在可以添加该方法：\n\n```java\npublic void makePurchase(View view) {\n    BillingFlowParams\
  \ billingFlowParams =\n        BillingFlowParams.newBuilder()\n            .setProductDetailsParamsList(\n\
  \                ImmutableList.of(\n                    BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                        .setProductDetails(productDetails)\n                  \
  \      .build()\n                )\n            )\n            .build();\n    billingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n}\n```\n\n## 88.11 处理购买更新\n\n购买过程的结果将通过初始化阶段分配给 `billing\
  \ client` 的 `PurchaseUpdatedListener` 报告应用报告。现在按照如下方式添加此处理器：\n\n```java\nprivate\
  \ final PurchasesUpdatedListener purchasesUpdatedListener = new PurchasesUpdatedListener()\
  \ {\n    @Override\n    public void onPurchasesUpdated(BillingResult billingResult,\n\
  \                                  List<Purchase> purchases) {\n        if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK\n       \
  \         && purchases != null) {\n            for (Purchase purchase : purchases)\
  \ {\n                completePurchase(purchase);\n            }\n        } else\
  \ if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n            Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n\
  \    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买将导致调用 `completePurchase()`\
  \ 方法，并向其传递当前的 `Purchase` 对象。按照下面添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\n\
  \        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        })\n}\n\
  ```\n\n此方法在验证产品已购买且付款仍处于待处理状态之前存储购买信息。启用了“消耗”按钮，并通知用户购买成功。同时也禁购买按钮，以防止用户在消耗购买之前重复购买。\n\
  \n## 88.12 消耗产品\n\n现在用户可以点击“消耗”按钮了，下一步是确保产品已通过消耗，这样在购买另一个按钮之前只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  \    ConsumeParams consumeParams =\n        ConsumeParams.newBuilder()\n       \
  \     .setPurchaseToken(purchase.getPurchaseToken())\n            .build();\n  \
  \  ConsumeResponseListener listener = new ConsumeResponseListener() {\n        @Override\n\
  \        public void onConsumeResponse(BillingResult billingResult,\n          \
  \                           @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK) {\n    \
  \            runOnUiThread(() -> {\n                    binding.consumeButton.setEnabled(false);\n\
  \                    binding.statusText.setText(\"Purchase consumed\");\n      \
  \          });\n            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建了一个 `ConsumeParams` 实例，并使用当前购买的购买令牌（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）对其进行配置。它被传递给在 `IO` 调度器中启动的 `consumePurchase()` 方法。如果产品成功消耗，将在主线程中执行代码以禁用消耗按钮、启用购买按钮并更新状态文本。\n\
  \n## 88.13 恢复之前的购买\n\n到目前为止的代码，我们可以在单个会话中购买并消耗产品。如果我们在购买并在消耗它之前退出应用，那么当应用重启时购买将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的内购产品，并连同指向监听器的引用传递给结算客户端的 `queryPurchasesAsync()`\
  \ 方法，该监听器将在结果返回时调用。在 `MainActivity.java` 文件中添加新函数和监听器：\n\n```java\nprivate void\
  \ reloadPurchase() {\n    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \    billingClient.queryPurchasesAsync(\n        queryPurchasesParams,\n       \
  \ purchasesListener\n    );\n}\n\nprivate final PurchasesResponseListener purchasesListener\
  \ = new PurchasesResponseListener() {\n    @Override\n    public void onPurchasesResponse(@NonNull\
  \ BillingResult billingResult,\n                                   @NonNull List<Purchase>\
  \ list) {\n        if (!list.isEmpty()) {\n            purchase = list.get(0);\n\
  \            binding.consumeButton.setEnabled(true);\n        } else {\n       \
  \     binding.consumeButton.setEnabled(false);\n        }\n    }\n};\n```\n\n如果传递给监听器的购买列表不空，将列表中的第一个购买赋值给\
  \ `purchase` 变量，并启用消耗按钮（在更完整的实现中，应该添加代码通过比较产品 ID 来检查这是一个正确的产品并处理多个购买返回）。如果没有找到购买，则在再次购买之前禁用消耗按钮。剩下的工作是在结算过程中如下如下调用我们的新的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n    if (billingResult.getResponseCode()\
  \ ==\n                    BillingClient.BillingResponseCode.OK) {\n        Log.i(TAG,\
  \ \"OnBillingSetup connected\");\n        queryProduct();\n        reloadPurchase();\n\
  \    } else {\n        Log.i(TAG, \"OnBillingSetup failed\");\n    }\n}\n```\n\n\
  ## 88.14 测试应用\n\n在测试应用之前，我们需要将最新版本上传到 Play Console。由于我们已经上传了版本 1，我们需要在 `build.gradle.kts`\
  \ (Module: app) 文件中增加版本号：\n\n```kotlin\ndefaultConfig {\n    applicationId = \"\
  com.ebookfrenzy.inapppurchase\"\n    minSdk = 26\n    targetSdk = 32\n}\nversionCode\
  \ = 2\nversionName = \"2.0\"\n```\n\n\n\n同步构建配置，然后按照“创建、测试和上传 Android App Bundle”章节中的步骤生成新的应用\
  \ bundle，将其上传到内部测试轨道，并将其发布给测试人员。接下来，使用内部测试链接在登录了其中一个测试账户的设备或模拟器上安装该应用。要找到测试链接，请在\
  \ Google Play Console 中选择该应用，并在导航面板中选择 `Internal testing`（内部测试）选项，然后选择 `Testers`（测试人员）选项卡，如图图\
  \ 88-6 所示：\n\n![](img/in-app-purchase-testers.jpg)\n\n图 88-6\n\n滚动屏幕到“测试人员如何加入你的测试”（How\
  \ testers join your test）部分并点击 `Copy link:`：\n\n![](img/in-app-purchase-copy_link.jpg)\n\
  \n图 88-7\n\n在测试设备或模拟器上打开 `Chrome` 浏览器，输入测试链接，并按照指示从 Play Store 安装应用。应用启动后，经过短暂延迟，它应该会在\
  \ `TextView` 上显示产品名称。点击购买按钮将开始购买流程，如图图 88-8 所示：\n\n![](img/in_app_billing_test_purchase.jpg)\n\
  \n图 88-8\n\n点击购买按钮使用测试卡片完成购买，并等待 `Consume Purchase`（消耗购买）按钮启用。在点击此按钮之前，尝试再次购买产品，并验证无法再次购买，因为你已经拥有该产品。\n\
  \n点击 `Consume Purchase` 按钮，等待 `TextView` 上出现“Purchase consumed”（购买已消耗）消息。产品被消耗后，现在应该可以再次购买它。再次进行购买，然后终止并重启应用。应用应该能定位到之前的未消耗购买项目，并启用消耗按钮。\n\
  \n### 88.15 故障排除\n\n如果你在购买时遇到问题，请确保设备已通过 USB 线缆或 WiFi 连接到 `Android Studio`，并在 `Logcat`\
  \ 面板中选择它。在 `Logcat` 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的更多详细信息，一个实用的技巧是从\
  \ `BillingResult` 实例访问调试消息，例如：\n\n```java\n} else if (billingResult.getResponseCode()\n\
  \            == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n请注意，只要你不更改模块 级 `build.gradle.kts` 文件中的应用版本号，你现在应该能够直接在设备或模拟器上运行修改后的应用版本，无需重新打包并上传到控制台。\n\
  \n如果未列出测试支付卡，请确保设备用户账户已添加到许可测试人员列表（license testers list）中。如果应用运行在实体设备上，请尝试在模拟器上运行。如果所有方法都失败，你可以输入有效的支付方式进行测试购买，然后通过从\
  \ Play Console 首页访问的 `Order Management`（订单管理）界面退款。\n\n### 88.16 总结\n\n在本章中，我们创建了一个演示如何在\
  \ Android 应用中添加应用内产品的项目。这包括在 Google Play Console 中创建产品，以及编写代码来初始化并连接到计费客户端、查询可用产品、以及购买和消耗产品。我们还解释了如何使用\
  \ Play Console 添加许可测试人员，以便在测试期间进行购买而无需付费。\n\n## 89. 在 Android 上创建和管理溢出菜单（Overflow\
  \ Menus）\n\n用户界面设计中书中尚未涵盖的一个领域与 Android 应用内部菜单的概念有关。菜单提供了一种机制，可以在界面布局的视图组件之外，为用户提供更多选择。虽然\
  \ Android 应用开发者可以使用几种不同的菜单系统，但本章将重点关注更常用的溢出菜单（Overflow menu）。本章将涵盖如何通过 XML 手动创建菜单以及使用\
  \ `Android Studio Layout Editor` 工具进行视觉化创建菜单的方法。\n\n### 89.1 溢出菜单\n\n溢出菜单（也称为选项菜单）是用户可以从设备屏幕访问的菜单，它允许开发者包含应用界面中已有选项之外的其他应用选项。溢出菜单的位置取决于设备上运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于操作工具栏的右上角（图 89-1），由三个正方形堆叠图标表示：\n\n![](img/as_menu_button.jpg)\n\
  \n图 89-1\n\n### 89.2 创建溢出菜单\n\n菜单中的项可以在 XML 文件中声明，然后根据需要进行加载并显示给用户。这涉及使用 `<menu>`\
  \ 元素，其中每个菜单项包含一个 `<item>` 子元素。例如，以下 XML 定义了一个包含两个与颜色选择相关的菜单项的菜单：\n\n```xml\n<menu\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\" >\n    <item\n        android:id=\"@+id/menu_red\"\
  \n        android:priority=\"1\"\n        app:showAsAction=\"never\"\n        title=\"\
  @string/red\"/>\n    <item\n        android:id=\"@+id/menu_green\"\n        android:priority=\"\
  2\"\n        app:showAsAction=\"never\"\n        title=\"@string/green\"/>\n</menu>\n\
  ```\n\n在上述 XML 中，`android:priority` 属性决定了菜单显示时菜单项的顺序。相反，`app:showAsAction` 属性控制该项作为操作栏项显示的条件。例如，如果设置为\
  \ `ifRoom`，则在有空间时在操作栏中显示。图 89-2 显示了设置此属性的效果：\n\n![](img/as_menu_ifroom.jpg)\n\n\
  图 89-2\n\n应谨慎使用此属性，以免操作栏过于拥挤。\n\n默认情况下，Android Studio 在创建 Android 应用项目时创建一个菜单 XML\
  \ 文件。该文件位于 `app -> res -> menu` 文件夹，并包含一个名为“Settings”（设置）的单菜单项：\n\n```xml\n<menu\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\">\n    <item\n        android:id=\"@+id/action_settings\"\
  \n        android:priority=\"100\"\n        app:showAsAction=\"never\"\n       \
  \ title=\"@string/action_settings\" />\n</menu>\n```\n\n此菜单已配置为在用户在应用界面上选择溢出菜单时显示，因此只需根据需要进行修改即可。\n\
  \n### 89.3 显示溢出菜单\n\n溢出菜单通过重写对应 Activity 的 `onCreateOptionsMenu()` 方法并加载菜单 XML 文件来创建。例如，以下代码创建名为\
  \ `menu_main` 的菜单 XML 文件中的菜单：\n\n```java\n@Override\npublic boolean onCreateOptionsMenu(Menu\
  \ menu) {\n    getMenuInflater().inflate(R.menu.menu_main, menu);\n    return true;\n\
  }\n```\n\n与菜单 XML 文件一样，Android Studio 在新创建的 Android 应用的主 Activity 中已经重写了此方法。如果 Activity\
  \ 不需要溢出菜单，可以删除或注释掉该方法。\n\n### 89.4 响应菜单项选择\n\n\n\n\n\n一旦实现了菜单，问题随之产生：应用程序如何在用户选择菜单项时接收通知？Activity\
  \ 想要接收菜单选择通知，需要做的就是重写 `onOptionsItemSelected()` 方法。传递给该方法的参数是所选菜单项的引用。随后可以在该项上调用\
  \ `getItemId()` 方法来获取 ID，该 ID 接着可以用于识别选中了哪一个项。例如：\n\n```java\n@Override\npublic\
  \ boolean onOptionsItemSelected(MenuItem item) {\n    if (id == R.id.menu_red) {\n\
  \        // Red item was selected\n    } else if (id == R.id.menu_green) {\n   \
  \     // Green item was selected\n    } else {\n        return super.onOptionsItemSelected(item);\n\
  \    }\n    return(true);\n}\n```\n\n## 89.5 创建可检查项组\n\n除了配置独立的菜单项外，还可以创建菜单项组。这在创建可检查菜单项时特别有用，因为在多个选项中，在任何时候只能选择一个。可以通过将菜单项包裹在\
  \ `<group>` 标签中来将它们分配到一个组。使用 `android:checkableBehavior` 属性将该组声明为可检查，将其值设置为 `single`、`all`\
  \ 或 `none`。以下 XML 声明两个菜单项组成一个组，在该组中，任何时候只能选择其中一项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item\n           \
  \ android:id=\"@+id/menu_red\"\n            android:title=\"@string/red_string\"\
  />\n        <item\n            android:id=\"@+id/menu_green\"\n            android:title=\"\
  @string/green_string\"/>\n    </group>\n</menu>\n```\n\n当菜单组被配置为可检查时，菜单中的项旁边会出现一个小圆圈，如图图\
  \ 89-3 所示。需要注意的是，此指示器的设置和取消设置不会自动发生。因此，检查和取消勾选菜单项是应用程序的责任。\n\n![](img/as_menu_checkable.jpg)\n\
  图 89-3\n\n继续本章之前使用的颜色示例，实现方式如下：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem\
  \ item) {\n    if (id == R.id.menu_red) {\n        item.setChecked(!item.isChecked())\n\
  \        mainLayout.setBackgroundColor(android.graphics.Color.RED);\n    } else\
  \ if (id == R.id.menu_green) {\n        item.setChecked(!item.isChecked());\n  \
  \      mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    } else\
  \ {\n        return super.onOptionsItemSelected(item);\n    }\n    return(true);\n\
  }\n```\n\n## 89.6 菜单与 Android Studio 菜单编辑器\n\nAndroid Studio 允许通过只需将菜单资源文件加载到菜单编辑器工具中、从调色板拖放菜单元素并设置属性来视觉化地设计菜单。这极地简化了菜单设计过程，但重要的是，仍然需要在\
  \ `onOptionsItemSelected()` 方法中编写代码来实现菜单行为。\n\n要视觉化化设计菜单，请找到菜单资源文件并双击它将其加载到菜单编辑器工具中。例如，图\
  \ 89-4 显示了以设计模式加载到菜单编辑器的基础 Activity 默认菜单资源文件：\n\n![](img/as_menu_editor.jpg)\n图\
  \ 89-4\n\n色板 (A) 包含可以添加到设计区域 (C) 菜单中的项。组件树 (B) 是识别菜单层级结构的很有用工具。属性面板 (D) 包含当前选中项的常用属性子集。\n\
  \n可以通过将对象拖放到布局或组件树上来向菜单中添加新元素。在布局编辑器中操作菜单时，有时将项拖落到 `Component Tree`（组件树）上会更简单，因为这对项的放置位置提供了更大的控制。。尽管菜单编辑器提供了一种视觉化方法，但底层的菜单仍然以\
  \ XML 格式存储，可以通过切换到标记为 `F` 的标签页来查看和编辑。\n\n## 89.7 创建项目\n\n要查看菜单运行效果，点击 `New Project`\
  \ 按钮并在对话框中选择 `Basic Views Activity` 模板。在 Name 中输入 `Example`，在 Package 中输入 `com.ebookfrenzy.menuexample`。在点击\
  \ `Finish` 之前，将 Minimum API level 改为 `26` (Oreo)并将 Language 改为 `Java`。\n\n## 89.8\
  \ 设计菜单\n\n项目创建后，导航到 `app` -> `res` -> `layout` 并双击文件将其加载到菜单编辑器。切换到 `Design` 模式并删除\
  \ Android Studio 添加的默认项。\n\n在 Project 窗口中，找到 `app` -> `res` -> `menu` 并双击 `main.xml`\
  \ 将其加载到菜单编辑器。如有必要，切换到 `Design` 模式。\n\n从调色板中将菜单对象点击到布局上。虽然组已经添加，但请参考 `Component Tree`，该组将列在其中：\n\
  \n![](img/as_group.jpg)\n图 89-5\n\n选择 `Component Tree` 中的项，并参考属性面板将 `checkableBehavior`\
  \ 属性设置为 `single`，以便任何时候都可以选择菜单项：\n\n![](img/as_single.jpg)\n图 89-6\n\n接下来，从调色板将\
  \ `Menu Item` 元素拖到 `Component Tree` 中的组元素上。选择第一个项并使用属性面板将标题更改为 \"Red\"并将 ID 更改为\
  \ `menu_red`：\n\n![](img/item.jpg)\n图 89-7\n\n对剩余菜单项重复这些步骤，将标题设置为 \"Green\" 和 \"\
  Blue\"，对应的 ID 为 `menu_green`、`menu_yellow` 和 `menu_blue`。使用 `Component Tree` 中菜单项右侧的按钮将字符串提取到资源：\n\
  \n![](img/tree.jpg)\n图 89-9\n\n完成这些步骤后，菜单布局应与图 89-10 所示所示：\n\n![](img/layout.jpg)\n\
  图 89-10\n\n将布局编辑器工具切换到 `Code` 模式并检查菜单的 XML 表示，它应与以下匹配：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.menuexample.MainActivity\"\
  >\n    <group android:checkableBehavior=\"single\">\n        <item android:title=\"\
  @string/red_string\"\n            android:id=\"@+id/menu_red\"/>\n        <item\
  \ android:title=\"@string/green_string\"\n            android:id=\"@+id/menu_green\"\
  />\n        <item android:title=\"@string/yellow_string\"\n            android:id=\"\
  @+id/menu_yellow\"/>\n        <item android:title=\"@string/blue_string\"/>\n  \
  \  </group>\n</menu>\n```\n\n\n\n\n\n```xml\nandroid:id=\"@+id/menu_blue\" />\n\
  </group>\n</menu>\n```\n\n## 89. 修改 `onOptionsItemSelected()` 方法\n\n当从菜单中选择项目时，应用程序活动中被重写的\
  \ `onOptionsItemSelected()` 方法将被调用。该方法的作用是识别选择了哪一个项目，并将布局视图的背景颜色更改为相应的颜色。找到并双击 `app`\
  \ -> `java` -> `com.ebookfrenzy.menuexample` -> `MainActivity` 文件，并按如下修改方法：\n\n\
  ```java\npackage com.ebookfrenzy.menuexample;\n\n.\n.\n\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n.\n    public boolean\
  \ onOptionsItemSelected(MenuItem item) {\n        int id = item.getItemId();\n \
  \       ConstraintLayout mainLayout =\n            findViewById(R.id.layoutView);\n\
  \n        if (id == R.id.menu_red) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.RED);\n      \
  \  } else if (id == R.id.menu_green) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    \
  \    } else if (id == R.id.menu_yellow) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.YELLOW);\n   \
  \     } else if (id == R.id.menu_blue) {\n            item.setChecked(!item.isChecked());\n\
  \            mainLayout.setBackgroundColor(android.graphics.Color.BLUE);\n     \
  \   } else {\n            return super.onOptionsItemSelected(item);\n        }\n\
  \        return(true);\n    }\n}\n.\n```\n\n## 89.10 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序。使用溢出菜单选择菜单项目，并验证布局背景颜色是否发生了相应的变化。请注意，当前选中的颜色将显示为菜单中的选中项目：\n\
  \n![](img/as_menu_running.jpg)\n\n图 89-11\n\n## 89.11 总结\n\nAndroid 溢出菜单位于运行应用显示顶部操作工具栏的最右侧。此菜单为应用程序为用户提供额外选项的位置。\n\
  \n菜单的结构最易在 XML 文件中定义，应用程序活动通过重写和实现 `onOptionsItemSelected()` 方法来接收菜单项目选择的通知。\n\n\
  ## 90. 使用 Material Design 3 主题\n\nAndroid 应用程序的外旨在符合 Material Design 定义的一系列指南。Google\
  \ 开发 Material Design 是为了在不同的应用程序之间提供层面的设计一致性，同时允许应用程序开发者在颜色、排版和形状选择方面包含自己的品牌标识（这一概念被称为\
  \ Material 主题）。除了设计指南外，Material Design 还包含了一套用于设计用户界面布局的 UI 组件，我们在本书中已经使用了其中许多组件。\n\
  \n本章将概述主题在 Android Studio 项目中如何工作，并探索如何修改为新创建的项目提供的默认设计配置以满足您的品牌需求。\n\n### 90.1\
  \ Material Design 2 与 Material Design 3\n\n在开始之前，重要的是 Google 正在从 Material Design\
  \ 2 过渡到 Material Design 3，并且 Android Studio Iguana 项目默认使用 Material Design 3。Material\
  \ Design 3 是 Material You 的基础，这是 Android 12 中引入的一项功能，允许应用程序自动调整主题元素，以补充用户在设备上配置的偏好。例如，Material\
  \ Design 3 提供的动态颜色允许应用中使用的颜色自动适应以匹配用户的壁纸选择。\n\n### 90.2 理解 Material Design 主题\n\n\
  我们知道 Android 应用程序界面是通过组合布局、文本字段和按钮等组件创建的。这些组件出现在菜单中。菜单的结构最易在 XML 文件中定义，应用程序活动通过重写和实现\
  \ `onOptionsItemSelected()` 方法来接收菜单项目选择的通知。\n\n### 90.3 Material Design 3 主题\n\n\
  在探索 Material Design 3 之前，我们必须考虑如何在 Android 项目中使用它。主题在 `AndroidManifest.xml` 文件中声明，例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    targetApi=\"31\">\n    <application\n\
  \        android:theme=\"@style/Theme.Material3.DayNight\">\n        ...\n    </application>\n\
  </manifest>\n```\n\n这些颜色槽（也称为颜色属性）被 Material 组件用于在它们于屏幕上渲染时设置颜色。例如，`colorPrimary`\
  \ 颜色槽被用 Material Button 组件的背景颜色。\n\n\n\n\n\n```xml\n<style name=\"Base.Theme.MyDemoApp\"\
  \ parent=\"Theme.Material3.DayNight.NoActionBar\">\n    <item name=\"colorPrimary\"\
  >@color/my_bright_primary</item>\n</style>\n<style name=\"Theme.MyDemoApp\" parent=\"\
  Base.Theme.MyDemoApp\" />\n</resources>\n```\n\n随后，在 `colors.xml` 文件中声明此颜色：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n.\n.\n<color name=\"\
  my_bright_primary\">#FC0505</color>\n</resources>\n```\n\n\n## 90.4 构建自定义主题\n\n\
  如我们所见，实现主题的代码工作相对简单。然而，困难之处通常在于选择互补色来构成主题。幸运的是，Google 开发了一个工具，可以让你轻而易举地为应用程序设计自定义颜色主题。该工具被称为\
  \ `Material Theme Builder`，可以通过以下地址访问：\n\n[`m3.material.io/theme-builder#/dynamiccustom`](https://m3.material.io/theme-builder#/dynamiccustom)\n\
  \n在自定义界面（图 90-2）上，点击颜色圆显示颜色选择对话框，为主主颜色键 (A) 进行颜色选择。一旦选择了颜色，预览 (B) 将更改，以反映所有 MD3\
  \ 颜色槽的推荐颜色，以及示例应用程序界面和小部件。此外，你可以通过点击相应的颜色圆显示颜色选择对话框，覆盖生成的 `Secondary`（次要）、`Tertiary`（三）和\
  \ `Neutral`（中性）槽的颜色。\n\n标记为 B 的区域显示了示例应用程序界面、亮色和配色方案表以及更新以预览你的颜色选择的小部件。由于面板比典型的浏览器窗口长，你必须向下滚动查看所有信息。\n\
  \n要将主题整合到你的设计中，点击 `Export` 按钮 (C) 并选择 `Android View (XML)` 。下载后，可以使用 `colors.xml`\
  \ 和 `themes.xml` 文件替换项目中的现有文件。请注意，导出的两个 `themes.xml` 文件中的主题名称必须更改以匹配你的项目。\n\n![](img/theme_builder_custom.jpg)\n\
  \n图 90-2\n\n## 90.5 总结\n\nMaterial Design 提供了定义 Android 应用程序外观的指南和组件。可以通过设计主题来应用个人品牌，主题指定了显示应用程序时使用的颜色、字体和形状。Google\
  \ 最近引入了 `Material Design 3`，它取代了 `Material Design 2` 并支持包括动态颜色在内的 `Material You`\
  \ 新功能。Google 还提供了 `Material Theme Builder` 来设计你自己的主题，减轻了选择互补主题颜色的任务。一旦使用此工具设计主题，就可以导出相应的文件并在\
  \ Android Studio 项目中使用。\n\n## 91. Material Design 3 主题与动态颜色教程\n\n本章将向你展示如何使用 `Material\
  \ Theme Builder` 工具创建一个新的 Material Design 3 主题并将其集成到 Android Studio 项目中。教程还将演示如何为应用程序添加支持并测试动态主题颜色。\n\
  \n### 91.1 创建 ThemeDemo 项目\n\n从欢迎界面上选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `ThemeDemo`，并指定 `com.ebookfrenzy.themedemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为\
  \ `Java`。\n\n### 91.2 设计用户界面\n\n主活动将包含一个简单的布局，其中包含一些用户界面组件，这些组件使我们能够看到在本之后执行的主题工作的效果。有关\
  \ MD3 组件的信息，请参阅以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含单个 `Text` 视图。在布局编辑器中打开此文件，删除 `Text view`，关闭\
  \ `Autoconnect` 模式（在 图 91-1 中标记为 A），并点击按钮清除布局中的所有约束 (B)。\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\
  \n图 91-1\n\n从 `Palette` 的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将\
  \ `FloatingActionButton` 拖到布局画布上，将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如 图 91-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\
  \n图 91-2\n\n将 `Chip` 小部件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像\
  \ 图 91-3 左侧所示：\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\n图 91-3\n\n在 `values`\
  \ 中，从 `Palette` 的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将一个\
  \ `FloatingActionButton` 拖到布局画布上，将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如 图 91-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\
  \n图 91-2\n\n将 `Chip` 小部件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像\
  \ 图 91-3 左侧所示：\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\n图 91-3\n\n在 `values`\
  \ 中，从 `Palette` 的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将一个\
  \ `FloatingActionButton` 拖到布局画布上，将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如 图 91-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\
  \n图 91-2\n\n将 `Chip` 小部件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像\
  \ 图 91-3 左侧所示：\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\n图 91-3\n\n在 `values`\
  \ 中，从 `Palette` 的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将一个\
  \ `FloatingActionButton` 拖到布局画布上，将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口选择 `ic_lock_power_off` 图标，如 图 91-2 所示：\n\n![](img/as_theme_demo_layout_pick_icon.jpg)\n\
  \n图 91-2\n\n将 `Chip` 小部件的 `text` 属性更改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像\
  \ 图 91-3 左侧所示：\n\n![](img/as_theme_demo_layout_buttons.jpg)\n\n图 91-3\n\n### 91.3\
  \ 构建新主题\n\n首先通过打开浏览器窗口并导航到以下 URL 来访问构建工具：\n\n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n一旦加载了构建器，选择壁纸并点击屏幕顶部的 `Custom` 按钮，然后点击 `Core` 部分的 `Primary` 颜色圆显示颜色选择器。从颜色选择器中选择任何颜色作为你主题的基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 91-4\n\n在 `Your Theme` 面板中查看配色，并使用\
  \ `Core` 设置进行任何必要的调整，直到对槽满意。一旦主题准备好，点击右上角的 `Export` 按钮并选择 `Android View (XML)`。提示时将文件保存到计算机合适的位置。主题将保存为名为\
  \ `material-theme.zip` 的压缩文件。\n\n使用适用于操作系统的工具解压主题文件，它应包含以下名为 `material-theme` 的文件夹和文件：\n\
  \n- `values/colors.xml`: 颜色定义。\n- `values/themes.xml`: 亮模式主题。\n- `values-night/themes.xml`:\
  \ 暗色模式主题。\n\n### 91.4 将主题添加到项目\n\n在将新主题添加到项目之前，我们首先需要移除旧的主题文件。如果 Project 工具窗口处于\
  \ `Project Files` 模式，这将更简单。要切换模式，使用下方所示 Project 工具窗口顶部的菜单并选择 `Project Files` ：\n\
  \n![](img/as_project_files.jpg)\n\n图 91-5\n\n在选择 `Project Files` 模式的情况下，导航到 `app\
  \ -> src -> main -> res -> values` 文件夹，选择并删除 `colors.xml` 和 `themes.xml` 文件。同时删除\
  \ `values-night` 文件夹中的 `themes.xml` 文件。\n\n打开操作系统的文件导航工具，找到新主题 `material-theme`\
  \ 文件夹中 `values` 下的 `colors.xml` 和 `themes.xml` 文件，将其复制并粘贴到 Project 项目中的 `values`\
  \ 文件夹。重复此步骤复制 `values-night` 文件夹中的 `themes.xml` 文件，这次将其粘贴到 `values-night` 文件夹中。\n\
  \n\n\n\n将项目窗口切换回 Android 模式，此时，值资源文件部分应与图 91-6 所示：\n\n![](img/as_theme_new_theme_files.jpg)\n\
  图 91-6\n\n接下来，修改 `themes.xml` 文件以匹配当前项目，如下：\n\n```xml\n<resources>\n    <style name=\"\
  Base.Theme.ThemeDemo\" parent=\"Theme.Material3.Light.NoActionBar\">\n        <item\
  \ name=\"colorPrimary\">@color/md_theme_light_primary</item>\n        <item name=\"\
  colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n    </style>\n    <style\
  \ name=\"Theme.ThemeDemo\" parent=\"Base.Theme.ThemeDemo\" />\n</resources>\n```\n\
  \n重复这些步骤，对 `themes.xml (night)` 文件进行相同的修改。\n\n返回 `activity_main.xml` 文件或重新运行应用，以确认用户界面是否使用自定义主题颜色进行渲染。\n\
  \n### 91.5 启用动态色彩支持\n\n应用需要在运行 Android 12 或更高版本的设备或模拟器上运行，并设置正确的壁纸，以测试动态色彩。在设备或模拟器上，启动`Settings`\
  \ 应用并从选项列表中选择`Wallpaper & style`（壁纸与样式）。在壁纸设置屏幕上，点击更改壁纸选项（在图 91-7 中标记为 A），并选择一张与你的主题颜色有显著不同的壁纸图像。选择后，将壁纸分配到`Home`屏幕。\n\
  \n返回`Wallpaper & styles`屏幕，在从颜色方案按钮（C）中选择选项之前，确保已选择`Wallpaper colors`（壁纸颜色）选项（B）。每点击一次选项，壁纸示例都会随选择变化：\n\
  \n![](img/compose_theme_wallpaper_and_styles.jpg)\n图 91-7\n\n要启用动态色彩，我们需要调用`DynamicColors`类的类的`applyToActivitiesIfAvailable()`方法。为了为整个应用启用动态色彩支持，需要在自定义`Application`实例的`onCreate()`方法内部调用它。首先，在项目的`app\
  \ -> java -> com.ebookfrenzy.themedemo`下创建一个名为`ThemeDemoApplication.java`的新 Java\
  \ 类文件，并对其进行修改如下如下：\n\n```java\npackage com.ebookfrenzy.themedemo;\n\nimport android.app.Application;\n\
  import com.google.android.material.color.DynamicColors;\n\npublic class ThemeDemoApplication\
  \ extends Application {\n    @Override\n    public void onCreate() {\n        super.onCreate();\n\
  \        DynamicColors.applyToActivitiesIfAvailable(this);\n    }\n}\n```\n\n创建自定义的`Application`类后，我们必须配置项目使用该类而不是默认的`Application`实例。要此操作，编辑`AndroidManifest.xml`文件并添加引用新类的`android:name`元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.themedemo\"\
  >\n    <application\n        android:name=\".ThemeDemoApplication\"\n        android:allowBackup=\"\
  true\">\n```\n\n构建并运行应用，注意布局使用了与壁纸颜色匹配的主题。将`ThemeDemo`应用置于后台，返回`Wallpaper & styles`设置屏幕并选择不同的壁纸。再次将`ThemeDemo`应用调前台。此时，它将动态调整以匹配新的壁纸。\n\
  \n### 91.6 预览动态色彩\n\n动态色彩行为也可以在 Android Studio 布局编辑器中预览。要尝试这样做，打开`activity_main.xml`文件，点击主题菜单并选择`More\
  \ Themes`选项，如图 91-8 所示：\n\n![](img/as_layout_editor_themes_menu.jpg)\n图 91-8\n\n\
  接下来，使用主题选择对话框中的搜索字段列出动态主题：\n\n![](img/as_layout_editor_select_theme.jpg)\n图 91-9\n\
  \n在点击`OK`按钮之前，选择`Material3.DynamicColors.DayNight`主题。返回布局编辑器后，选择`System UI Mode`菜单并选择如图\
  \ 91-10 中高亮的壁纸选项之一：\n\n![](img/as_layout_editor_dynamic_themes.jpg)\n图 91-10\n\n\
  一旦选择了壁纸，布局中组件的颜色将随之变化。\n\n### 91.7 总结\n\n在本章中，我们使用 Material Theme Builder 设计了一个新主题，并解释了将生成的主题文件集成到\
  \ Android Studio 项目中的步骤。\n\n# 92. Android Studio Gradle 概述\n\n在版本目录指南章节中，我们引入了版本目录（Version\
  \ Catalog）并解释了 Gradle 构建如何依赖于它。除了中间章节对版本目录和依赖进行了一些修改外，人们已经认为 Android Studio 将使用一个名为\
  \ Gradle 的系统来处理这些。现在是查看如何使用 Gradle 来配置项目了。\n\n## 92.1 Gradle 概述\n\nGradle 是一个自动化构建工具包，通过一组构建文件来配置如何构建项目。这包括定义如何构建项目、需要哪些依赖项以及构建过程的结果应该是。\n\
  \nGradle 的强大之处在于它为开发者提供的灵活性。Gradle 系统是一个自包含的、基于命令行的环境，可以通过插件集成到其他环境中。在 Android Studio\
  \ 的情况下，Gradle 集成通过适当的 Android Studio 插件提供。\n\n## 92.2 Gradle 与 Android Studio\n\n\
  Gradle 为 Android 应用构建带来了许多强大功能。一些关键功能如下：\n\n### 92.2.1 默认值\n\nGradle 实现了一种被称为“约定优于配置”的概念。这意味着\
  \ Gradle 拥有一预定义的合理默认配置设置，除非构建文件中的设置覆盖了它们，否则将使用它们。这意味着可以使用最少的配置完成构建。\n\n### 92.2.2\
  \ 依赖\n\nGradle 的另一个关键领域是依赖项。例如，考虑 Android Studio 项目中的一个模块触发了加载项目中另一个模块的意图。第一个模块实际上对第二个模块有依赖，因为如果在运行时无法找到并启动第二个模块，应用程序将无法构建。可以在第一个模块的\
  \ Gradle 构建文件中声明此依赖，以便将第二个模块包含在应用构建中，或者如果无法找到或构建第二个模块，则标记错误。其他依赖项示例包括项目编译和运行所依赖的库和\
  \ JAR 文件。\n\n\n\nGradle 依赖可以分为本地或远程。本地依赖引用存在执行构建的计算机系统本地文件系统上的项。远程依赖指的是存在于远程服务器（通常称为仓库）上的项。\n\
  \nAndroid Studio 项目中的远程依赖使用一个名为 `Maven` 的其他项目管理工具进行处理。如果在 Gradle 构建文件中使用 Maven 语法声明了远程依赖，则该依赖将自动从指定的仓库下载并包含在构建过程中。例如，下面的依赖声明会导致\
  \ `AppCompat` 库从 Google 仓库被添加到到项目中：\n\n```gradle\nimplementation(libs.androidx.appcompat)\n\
  ```\n\n## 92.2.3 构建变体 (Build Variants)\n\n除了依赖项，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个版本。Android\
  \ 运行在许多不同的设备上，涵盖各种处理器类型和屏幕尺寸。为了尽可能覆盖广泛的设备类型和尺寸，通常需要构建应用程序的多个变体（例如，一个带有手机用户界面，另一个适用于平板电脑大小的屏幕）。通过使用\
  \ `Gradle`，现在可以在 Android Studio 中实现。\n\n## 92.2.4 Manifest 条目 (Manifest Entries)\n\
  \n每个 Android Studio 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含应用程序的配置详情。在 Gradle 构建文件中可以指定多个\
  \ manifest 条目，这些条目在项目构建时会自动生成到 manifest 文件中。这一功能补充了构建变体功能，允许为每个构建变体对应用程序版本、应用 ID\
  \ 和 SDK 版本信息等元素进行不同的配置。\n\n## 92.2.5 APK 签名 (APK Signing)\n\n“创建、测试和上传 Android App\
  \ Bundle” 章节涵盖了使用 Android Studio 环境创建签名的发布版 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ Gradle 构建文件中，以便从命令行生成带签名的 APK 文件。\n\n## 92.2.6 ProGuard 支持\n\nProGuard 是 Android\
  \ Studio 附带的一个工具，它可以优化、收缩和混淆 Java 字节码，使其更高效且更难被反向工程（他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。Gradle\
  \ 构建文件允许你控制在构建应用程序时是否对你的程序运行 ProGuard。\n\n## 92.3 属性与设置 Gradle 构建文件\n\ngradle 构建配置由配置、属性和设置文件组成。例如，`gradle.properties`\
  \ 文件主要包含与 Java 虚拟机 (`JVM`) 使用的命令行标志相关的晦涩设置，以及项目是否使用 `AndroidX` 库和 Kotlin 编码风格支持。作为典型用户，你可能不需要更改此文件中的任何设置。\n\
  \n相反，`settings.gradle.kts` 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时应搜索哪些在线仓库，以及项目名称。典型的\
  \ `settings.gradle.kts` 文件内容如下：\n\n```kotlin\npluginManagement {\n    repositories\
  \ {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n  \
  \  }\n}\n\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n\
  \    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name\
  \ = \"ThemeDemo\"\n\ninclude(\":app\")\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n## 92.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的所有内容，由模块、库、manifest\
  \ 文件和 Gradle 构建文件组成。\n\n每个项目包含一个顶层 Gradle 构建文件。该文件列为 `build.gradle.kts` (Project:\
  \ `<project name>`)，可以在项目工具窗口中找到，如图 92-1 所示：\n\n![](img/as_app_gradle_file.jpg)\n\
  \n图 92-1\n\n默认情况下，顶层 Gradle 构建文件的内容如下：\n\n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\
  \ apply false\n}\n```\n\n在大多数情况下，没有必要对此构建文件进行任何更改。\n\n## 92.5 模块级 Gradle 构建文件\n\n\
  Android Studio 应用程序项目由一个或多个模块组成。例如，假设名为 `GradleDemo` 的应用程序项目，它分别包含名为 `Module1` 和\
  \ `Module2` 的模块。在这种情况下，每个模块都需要它自己的 Gradle 构建文件。从项目结构来看，这些文件的位置如下：\n\n- `Module1/build.gradle.kts`\n\
  - `Module2/build.gradle.kts`\n\n默认情况下，`Module1` `build.gradle.kts` 文件将类似于下面的列出的：\n\
  \n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n}\n\nandroid\
  \ {\n    namespace = \"com.example.gradlesample\"\n    compileSdk = 34\n    defaultConfig\
  \ {\n        applicationId = \"com.example.gradlesample\"\n        minSdk = 26\n\
  \        targetSdk = 34\n        versionCode = 1\n        versionName = \"1.0\"\n\
  \        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n\
  \            proguardFiles(\n                getDefaultProguardFile(\"proguard-android-optimize.txt\"\
  ),\n                \"proguard-rules.pro\"\n            )\n        }\n    }\n  \
  \  compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_8\n     \
  \   targetCompatibility = JavaVersion.VERSION_8\n    }\n}\n\ndependencies {\n  \
  \  implementation(libs.androidx.appcompat)\n    implementation(libs.material)\n\
  \    implementation(libs.androidx.activity)\n    implementation(libs.constraintlayout)\n\
  \    testImplementation(libs.junit)\n    androidTestImplementation(libs.junit)\n\
  \    androidTestImplementation(libs.androidx.core)\n}\n```\n\n从文件内容可见，构建文件首先声明使用\
  \ Gradle 插件：\n\n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n\
  }\n```\n\n`android` 部分声明了项目命名空间，然后说明了构建 `Module1` 时使用的 SDK 版本：\n\n```kotlin\nandroid\
  \ {\n    namespace = \"com.example.gradlesample\"\n    compileSdk = 34\n}\n```\n\
  \n`defaultConfig` 部分定义的项定义了在构建期间生成模块 `AndroidManifest.xml` 文件的元素。这些设置可以在构建文件中修改，它们取自创建模块时在\
  \ Android Studio 中输入的设置：\n\n```kotlin\ndefaultConfig {\n    applicationId = \"com.example.gradlesample\"\
  \n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = \"\
  1.0\"\n    testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\
  \n}\n```\n\n`buildTypes` 部分包含了在构建发布版应用程序时是否以及如何对 APK 文件运行 ProGuard 的指令：\n\n```kotlin\n\
  buildTypes {\n    release {\n        isMinifyEnabled = false\n        proguardFiles(\n\
  \            getDefaultProguardFile(\"proguard-android-optimize.txt\"),\n      \
  \      \"proguard-rules.pro\"\n        )\n    }\n}\n```\n\n\n\n\n按照目前的配置，在构建 `Module1`\
  \ 时不会运行 ProGuard。要启用 ProGuard，必须将 `minify` 项从 `false` 改为 `true`。可以在项目的模块目录中找到 `proguard-rules.pro`\
  \ 文件。对该文件进行的更改将覆盖 `proguard-android.txt` 文件中的默认设置，该文件位于 Android SDK 安装目录的 `sdk/tools/proguard`\
  \ 之下。\n\n由于此文件中没有声明调试 `buildType`，将使用默认设置（不带 ProGuard 进行构建，使用调试密钥签名，并启用调试符号）。\n\n\
  在模块构建文件中，还可能包含一个标题为 `productFlavors` 的额外部分，以便创建多个构建变体。\n\n接下来，包含了一些指令，用于指定构建项目时所使用的\
  \ Java 编译器版本：\n\n```\ncompileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\n\
  \    targetCompatibility JavaVersion.VERSION_1_8\n}\n```\n\n最后，`dependencies` 部分列出了该模块依赖的任何本地和远程依赖。上述示例文件中的依赖行指定了需要从\
  \ Android 仓库中包含的 Android 库：\n\n```\ndependencies {\n    implementation(libs.androidx.appcompat)\n\
  \    implementation(libs.material)\n}\n```\n\n注意，依赖声明包含了版本号，以指示应该包含哪个库版本。\n\n##\
  \ 92. 在构建文件中配置签名设置\n\n本书的 “创建、测试和上传 Android App Bundle 章节涵盖了使用 Android Studio 用户界面设置密钥和生成签名发布\
  \ APK 文件的相关步骤。这些设置也可以在 `build.gradle.kts` 文件的 `signingConfigs` 部分中声明。例如：\n\n```\n\
  defaultConfig {\n}\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword \"your keystore password here\"\n        keyAlias \"your\
  \ key alias here\"\n        keyPassword \"your key password here\"\n    }\n}\nbuildTypes\
  \ {\n}\n```\n\n上述示例直接将密钥密码信息嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\n```\nsigningConfigs\
  \ {\n    release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"your key alias here\"\n\
  \        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n}\n```\n\n另一种方法是配置构建文件，让\
  \ Gradle 在构建过程中提示输入密码：\n\n```\nsigningConfigs {\n    release {\n        storeFile\
  \ file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLIne(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 92.7 从命令行运行 Gradle 任务\n\n每个 Android Studio 项目都包含一个 Gradle 封装 工具，用于从命令行调用\
  \ Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该 wrapper 在 Windows 系统上可以执行，但在 Linux 和 macOS 上使用之前，可能需要启用执行权限。要启用执行权限，请打开终端窗口，切换到需要该\
  \ wrapper 的项目文件夹，并执行以下命令：\n\n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将文件位置添加到您的\
  \ `$PATH` 环境变量中，或者在名称前加上 `./` 即可运行。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle\
  \ 将项目构建视为若干个不同的任务。通过在项目目录内运行以下命令可以获取当前项目可用任务的完整列表（在 macOS 或 Linux 上运行时，请在命令前加上 `./`）：\n\
  \n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版本，请使用 `assembleDebug` 选项：\n\
  \n```bash\ngradlew assembleDebug\n```\n\n或者，要构建项目的发布版本：\n\n```bash\ngradlew assembleRelease\n\
  ```\n\n## 92.8 总结\n\n在大多数情况下，Android Studio 在后台执行构建，无需开发人员干预。这个 Gradle 系统设计用于处理现代\
