  \n![]OEBPS/image/google_cloud_credentials.jpg)\n\n点击 B，在凭据创建后，将出现显示 API 密钥的对话框：\n\
  \n![]OEBPS/image/google_cloud_api_key_created.jpg)\n\n图 79-9\n\n## 79.7 将 API 密钥添加到\
  \ Android 项目\n\n在应用程序可以使用 Google Maps Android SDK 之前，必须配置 API 密钥将其与启用了 Maps 的 Google\
  \ Cloud 项目关联。由于已经生成了 API 密钥，返回 Android Studio，编辑 `manifests -> AndroidManifest.xml`\
  \ 文件并找到如下条目：\n\n```xml\n<meta-data\n    android:name=\"com.google.android.geo.API_KEY\"\
  \n    android:value=\"YOUR_KEY\" />\n```\n\n将 `YOUR_KEY` 替换为创建的密钥。接下来，编辑 `Gradle\
  \ Scripts -> local.properties` 文件并添加如下行（用 API 密钥替换 `YOUR_KEY`）：\n\n```properties\n\
  MAPS_API_KEY=YOUR_KEY\n```\n\n## 79.8 测试应用程序\n\n运行应用程序以验证 API 密钥配置正确。如果配置正确，应用程序将运行并在屏幕上显示地图。\n\
  \n如果没有显示地图，请检查以下区域：\n\n- 如果运行在模拟器上，请确保模拟器运行包含 Google APIs 的 Android 版本。可以通过选择 `Tools\
  \ -> Android -> AVD Manager` 菜单选项更改 AVD 配置，点击 Android 版本旁 `Change…` 按钮。在系统镜像对话框中选择包含\
  \ Google APIs 的目标。\n- 检查 `Logcat` 输出与 Google Maps 认证相关的区域。这通常意味着 API 密钥输入错误。确保 `AndroidManifest.xml`\
  \ 和 `local.properties` 文件中的 API 密钥与生成的密钥一致。\n\n## 79.9 理解地理编码和反向地理编码\n\n在讨论地图和地理位置之前，必须先涵盖地理编码（Geocoding）。地理编码将文本地理位置（如街道地址）转换为以经纬度表示的地理坐标。\n\
  \n可以使用 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 类传递表示位置的字符串（如城市名称、街道地址或机场代码）。`Geocoder`\
  \ 将尝试查找该位置并返回可能匹配位置字符串的 `Address` 对象列表，按顺序排序，最匹配的项位于列表的 0 位置。然后可以从 `Address` 对象中提取各种信息，包括潜在匹配项的经纬度。\n\
  \n以下代码示例请求华盛顿特区国家航天博物馆的位置：\n\n```java\nimport java.io.IOException;\n\nimport java.util.List;\n\
  ```\n\n\n\n\n\n```java\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\n\n\
  try {\n    geocodeMatches =\n        new Geocoder(this).getFromLocationName(\n \
  \           \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\nif\
  \ (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，`1` 的值作为第二个参数传递给\
  \ `getFromLocationName()` 方法。这告诉 `Geocoder` 仅在数组中返回一个结果。鉴于所提供的地址具有特定性，应该只有一个潜在的匹配项。然而，对于更模糊的地点名称，请求更多的潜在匹配项并允许用户选择正确的项可能是必要的。\n\
  \n上面的代码是正向地理编码（forward-geocoding）的示例，其坐标是基于文本位置描述计算的。反向地理编码（Reverse-geocoding）顾其实名，涉及将地理坐标翻译为人类可读的地址字符串。请考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  \ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch\
  \ block\n    e.printStackTrace();\n}\nif (!geocodeMatches.isEmpty()) {\n    Address1\
  \ = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n`Geocoder` 对象通过\
  \ `getFromLocation()` 方法使用 `latitude` 和 `longitude` 值进行初始化。再次，仅请求了单个匹配结果。然后从生成的\
  \ `Address` 对象中提取基于文本的地址信息。\n\n地理编码并不是在 Android 设备上执行的，而是在设备需要翻译时连接的服务器上执行的，并在翻译完成后返回结果。只有当设备具有活跃的互联网连接时，才能进行地理编码。\n\
  \n## 79.10 为应用程序添加地图\n\n向应用程序添加地图最简单的方法是在 activity 的用户界面布局 XML 文件中指定它。下面的示例布局文件显示了由\
  \ Android Studio 创建的 `activity_maps.xml` 文件添加的 `SupportMapFragment` 实例：\n\n```xml\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 79.11 请求当前位置权限\n\n正如名为\"在 Android 中进行运行时权限请求”的章节概述所示，某些权限被认为是危险的，并且对于\
  \ Android 6.0 或更高版本需要进行特殊处理。一组权限允许应用程序识别用户的当前位置。编辑项目工具窗口中 `app -> manifests` 下的\
  \ `AndroidManifest.xml` 文件，并添加以下权限行：\n\n```xml\n<uses-permission\n    android:name=\"\
  android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission\n    android:name=\"\
  android.permission.ACCESS_COARSE_LOCATION\" />\n```\n\n这些设置将确保应用在安装在旧版本的 Android\
  \ 上时，可以提供获取位置信息的权限。然而，为了支持 Android 6.0 或更高版本，我们需要在 `MapsActivity.java` 文件中添加一些代码，以便在运行时请求此权限。\n\
  \n首先添加一些导入指令和一个作为权限请求代码的常量：\n\n```java\npackage com.ebookfrenzy.mapdemo;\n\nimport\
  \ androidx.annotation.NonNull;\nimport androidx.core.content.ContextCompat;\nimport\
  \ androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\npublic class MapsActivity extends FragmentActivity\
  \ implements OnMapReadyCallback {\n    private static final int LOCATION_REQUEST_CODE\
  \ = 101;\n    private GoogleMap mMap;\n}\n```\n\n接下来，必须向类中添加一个方法向用户请求指定的权限。留在 `MapsActivity.java`\
  \ 类文件中，按如下所示实现此方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    ActivityCompat.requestPermissions(this, new String[]{permissionType},\
  \ requestCode);\n}\n```\n\n当用户对请求做出响应时，将在活动调用 `onRequestPermissionsResult()` 方法。留在\
  \ `MapsActivity.java` 文件中，实现此方法以使其读取如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == LOCATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Unable to show location - permission required\", Toast.LENGTH_LONG).show();\n\
  \        } else {\n            SupportMapFragment mapFragment = (SupportMapFragment)\
  \ getSupportFragmentManager().findById(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n    }\n}\n```\n\n如果用户未授予权限，应用程序将显示无法显示位置的消息。另一方面，如果授予了权限，地图将刷新以提供显示位置的机会。\n\
  \n## 79.12 显示用户的当前位置\n\n一旦授予了适当权限，可以通过获取与显示地图关联的 `GoogleMap` 对象并调用该实例的 `setMyLocationEnabled(true)`\
  \ 方法来在地图上显示用户的当前位置。\n\n当地图准备就同时，将调用活动的 `onMapReady()` 方法。此方法将在上述 `onRequestPermissionsResult()`\
  \ 方法刷新地图时调用。默认情况下，Android Studio 实现了此方法并添加了一些代码，将地图面向澳大利亚并在悉尼放置一个标记。找到并编辑 `MapsActivity.java`\
  \ 文件中的 `onMapReady()` 方法，删除这些模板代码并添加代码在启用显示用户位置之前检查已授予权限。如果权限尚未授予，将通过调用之前添加的 `requestPermission()`\
  \ 方法向用户发出请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap googleMap)\
  \ {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney = new LatLng(-34,\
  \ 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"Marker\
  \ in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        }\n    }\n}\n```\n\n\n\n```java\n} else {\n    requestPermission(\n   \
  \     Manifest.permission.ACCESS_FINE_LOCATION,\n        LOCATION_REQUEST_CODE);\n\
  }\n}\n```\n\n当现在运行应用时，将会显示图 79-10 所示的对话框，请求位置权限。如果授予了权限，地图上会出现一个蓝点，表示设备的位置。\n\n\
  ![](img/as_map_permission.jpg)  \n*图 79-10*\n\n## 79.13 更改地图类型\n\n可以通过调用相应 `GoogleMap`\
  \ 对象的 `setMapType()` 方法并传递以下值之一，来动态修改显示的的地图类型：\n\n- `GoogleMap.MAP_TYPE_NONE` –\
  \ 空白网格，不显示任何地图瓦片。\n- `GoogleMap.MAP_TYPE_NORMAL` – 由经典道路地图组成的标准视图。\n- `GoogleMap.MAP_TYPE_SATELLITE`\
  \ – 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID` – 显示叠加了道路地图的卫星图像。\n- `GoogleMap.MAP_TYPE_TERRAIN`\
  \ – 显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式：\n\n```java\nif\
  \ (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(\n  \
  \          this, Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \            LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，可以在嵌入地图的 XML 布局文件中，使用 `map:mapType` 属性结合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值来指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n       \
  \   xmlns:map=\"http://schemas.android.com/apk/res-auto\"\n          android:id=\"\
  @+id/map\"\n          android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          map:mapType=\"hybrid\"\n          android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 79.14 向用户显示地图控件\n\nGoogle Maps Android API 提供了若干可以可选显示给用户的控件，包括缩放放大/缩小按钮、“我的位置”按钮和指南针。\n\
  \n缩放和指南针控件的显示可以通过编程控制，也可以在 XML 布局资源的文件的地图元素中进行控制。要通过编程配置控件，必须获取与 `GoogleMap` 对象关联的\
  \ `UiSettings` 引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\n\
  UiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n缩放控制通过调用 `UiSettings`\
  \ 对象的 `setZoomControlsEnabled()` 方法来开启或关闭。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件的地图元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法或通过 XML 资源使用\
  \ `map:uiCompass` 属性来显示。注意，指南针图标只有在地图相机倾斜或旋转偏默认方向时才会出现。\n\n正如本章前面提到的，“我的位置”按钮只有在启用了“我的位置”模式时才会出现。即使在这种模式下，也可以通过调用\
  \ `UiSettings` 的 `setMyLocationButtonEnabled()` 方法来防止按钮出现。\n\n### 79.15 处理地图交互\n\
  \nGoogle Maps Android API 可以响应各种交互。这些交互可以用于更改地图区域、缩放级别甚至 3D 效果。\n\n#### 79.15.1\
  \ 缩放手势\n\n可以使用 `UiSettings` 对象的 `setZoomGestures()` 方法开启或关闭与缩放相关的手势。例如：\n\n```java\n\
  UiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setZoomGestures(false);\n\
  ```\n\n通过在 XML 中设置 `map:uiZoomures` 属性也可以相同的效果。\n\n#### 79.15.2 滚动/平移手势\n\n滚动手势允许用户通过单指运动移动地图。滚动手势可以通过\
  \ `UiSettings` 实例的 `setScrollGestures()` 方法开启：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGestures(true);\n```\n\
  \n或者，可以使用 `map:scrollGestures` 属性开启滚动功能。\n\n#### 79.15.3 倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指来倾斜地图投影。倾斜手势可以通过\
  \ `UiSettings` 实例的 `setTiltGestures()` 方法开启或关闭：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setTiltGestures(true);\n```\n\n\
  倾斜手势也可以使用 `map:tiltGestures` 属性开启。\n\n#### 79.15.4 旋转手势\n\n通过在屏幕上放置两个手指并旋转它们，用户可以旋转地图的朝向。这种支持通过调用\
  \ `UiSettings` 实例的 `setRotationGestures()` 方法开启或关闭：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setRotationGestures(true);\n```\n\
  \n旋转手势也可以使用 `map:rotationGestures` 属性开启。\n\n## 79.16 创建地图标记\n\n标记通知用户地图上的位置，形式可以是标准图标或自定义图标。标记还可以包含标题和可选的文本（称为摘要），并可以配置为允许用户拖动到不同位置。当用户点击标记时，将出现信息窗口，显示有关标记位置的其他信息。\n\
  \n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图中。将包含标记所需的各种选项的\
  \ `MarkerOptions` 实例作为参数传递给该方法。标记的位置通过指定纬度和经度来定义，也包含在 `MarkerOptions` 实例中。例如，以下代码在地图特定位置添加了一个包含标题、摘要和位置的标记：\n\
  \n```java\nimport com.google.android.gms.maps.model.Marker;\nimport com.google.android.gms.maps.model.LatLng;\n\
  import com.google.android.gms.maps.model.MarkerOptions;\n\nLatLng position = new\
  \ LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new MarkerOptions()\n\
  \        .position(position)\n        .title(\"Museum\")\n        .snippet(\"National\
  \ Air and Space Museum\"));\n```\n\n\n\n\n\n执行上述代码后，将标记指定的位置，点击该位置时将显示一个包含标题和片段的\
  \ info 窗口，如图图 79-11 所示：\n\n![](img/Image24512.jpg)\n\n图 79-11\n\n## 79.17 控制地图相机\n\
  \n由于 Android 设备的屏幕是平面的，而地球是球体，Google Maps Android API 使用墨卡托投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一台悬挂在地图上方并直接向下看的相机一样。Google\
  \ Maps Android API 允许在应用程序实时更改摄像机的目标（target）、缩放（zoom）、方位（bearing）和倾斜（tilt）：\n\n\
  * **Target** – 设备显示器内地图中心的位置，通过经纬度指定。\n* **Zoom** – 以级别指定的相机缩放级别。将缩放级别增加 `1.0` 会使显示的地图区域宽度增加一倍。\n\
  * **Tilt** – 相机的视角角度，指定为跨越可视地图区域正上方圆弧上的位置，以度从圆弧顶端测量（圆弧的底部，即相机直接指向地图的地方）。\n* **Bearing**\
  \ – 地图的方向，以北为基准顺时针方向测量的角度。\n\n相机更改通过创建一个具有适当设置的 `CameraUpdate` 类实例来实现。`CameraUpdate`\
  \ 实例是通过对 `CameraUpdateFactory` 类的方法调用来创建的。一旦创建了 `CameraUpdate` 实例，就可以通过调用 `GoogleMap`\
  \ 实例的 `moveCamera()` 方法将其应用到地图。为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()` 而不是 `moveCamera()`。\n\
  \n`CameraUpdateFactory` 方法摘要如下：\n\n* `CameraUpdateFactory.zoomIn()` – 提供一个放大一个层级的\
  \ `CameraUpdate` 实例。\n* `CameraUpdateFactory.zoomOut()` - 提供一个缩小一个层级的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate` 实例。\n\
  * `CameraUpdateFactory.zoomBy(float)` – 提供一个缩放级别按指定量增加或减少的 `CameraUpdate` 实例。\n\
  * `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个缩放级别按指定值增加或减少的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标纬度和经度的 `CameraUpdate`\
  \ 实例。\n* `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机纬度、经度和缩放的\
  \ `CameraUpdate` 实例。\n* `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个将相机移动到指定位置的 `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n例如，以下代码使用动画将相机放大一个层级：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n另一方面，以下代码在没有动画的情况下将相机移动到新位置并将缩放级别调整为 `10`：\n\n```java\nprivate static final\
  \ LatLng position =\n        new LatLng(38.8874245, -77.0200729);\n\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建一个具有目标、缩放、方位和倾斜更改的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用到相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\n.\n.\n\nCameraPosition\
  \ cameraPosition = new CameraPosition.Builder()\n    .target(position)\n    .zoom(50)\n\
  \    .bearing(70)\n    .tilt(25)\n    .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(\n\
  \                                    cameraPosition));\n```\n\n## 79.18 总结\n\n本章概述构成\
  \ Google Maps Android API 的关键类和方法，并概述了如何准备开发环境和应用程序项目以使用该 API。\n\n## 80 使用 Android\
  \ 打印框架打印\n\nAndroid Printing Framework 用于从 Android 应用程序打印内容。虽然后续章节将更详细地探讨为应用程序添加打印支持的选项，但本章将重点关注\
  \ Android 目前提供的各种打印选项以及启用这些选项的步骤。\n\n本章还将提供 Android 开发者可用的各种打印功能概述，以便在应用程序中构建打印支持。\n\
  \n### 80.1 Android 打印架构\n\nPrinting framework 为 Android 提供了打印功能。简单来说，该框架由一个 `Print\
  \ Manager`（打印管理器）和若干打印服务插件组成。\n\n`Print Manager` 负责处理设备上应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求完成。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 Google Cloud Print 和 Google Drive 服务进行打印。其他类型打印机的打印服务插件如果尚未安装，可以从\
  \ Google Play 商店获取。\n\n### 80.2 打印服务插件\n\n打印服务插件的目的是允许应用程序打印到通过局域网或蓝牙对 Android 设备可见的兼容打印机。\n\
  \n可以通过加载 Google Play 应用程序并执行搜索 `Print Service Plugin` 来验证 Android 设备上是否存在打印服务插件。\n\
  \n一旦插件在 Play Store 中列，如果尚未安装，可以通过点击安装按钮进行安装。图 80-1 例如显示了 Google Play 中的 HP 打印服务。\n\
  \n打印服务插件将自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时列出这些选项。\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  \n图 80-1\n\n### 80.3 Google Cloud Print\n\nGoogle Cloud Print 是 Google 提供的一种服务，允许你在任何连接互联网的地方通过网络将内容打印到打印机上。Google\
  \ Cloud Print 支持多种设备和打印机型号，包括云端（Cloud Ready）和经典（Classic）打印机。云端打印机内置了通过网络打印的技术。制造商包括\
  \ Brother、Canon、Dell、Epson、HP、Kodak 和 Samsung。要识别打印机是否支持云端并受 Google Cloud Print\
  \ 支持，请查看以下 URL 中的打印机列表：\n\n`https://www.google.com/cloudprint/learn/printers.html`\n\
  \n对于经典的非云端打印机，Google Cloud Print 通过连接经典打印机的计算机系统（无论是直接连接还是通过家庭或办公室网络）上安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，访问以下网页并使用登录 Android 设备时相同的 Google 账户 ID 登录：\n\n`https://www.google.com/cloudprint/learn/index.html`\n\
  \n\n\n\n\n一旦打印机被添加到 Google Cloud Print 账户，当您从 Android 应用程序内部打印时，它们将作为打印目标选项列出。\n\
  \n## 80.4 打印到 Google Drive\n\n除了支持物理打印机，还可以将打印输出保存到您的 Google Drive 账户。从设备打印时，请在打印面板中选择“保存到\
  \ Google Drive”选项。打印内容将被转换为 PDF 文件，并保存到与设备上当前活跃 Google 账户 ID 关联的 Google Drive 云存储中。\n\
  \n## 80.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容以 PDF 文件的格式本地保存到 Android 设备。一旦选择此选项，系统将要求指定\
  \ PDF 文件名以及设备上保存文档的位置。\n\n在测试自己的 Android 程序的打印功能时，“保存为 PDF”和“Google Drive”选项在节省纸张方面具有极高的价值。\n\
  \n## 80.6 从 Android 设备打印\n\nGoogle 建议能够打印内容的应用程序将打印选项放置在溢出菜单（Overflow menu）中。许多与\
  \ Android 捆绑的应用程序现在都包含了“打印...”菜单选项。例如图 80-2 显示了通过选择 Chrome 浏览器溢出菜单中的“共享...”选项来访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n\n图 80-2\n\n一旦在应用程序内选择了打印选项，将出现标准的 Android\
  \ 打印屏幕，显示打印内容的预览，如图 80-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\n图 80-3\n\
  \n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 80-4\n\nAndroid 打印面板提供了标准的打印选项，如纸张大小、颜色、方向和副本数。可以通过点击当前打印机或\
  \ PDF 输出选择来访问其他打印目标选项。\n\n## 80.7 在 Android 应用中构建打印支持的选项\n\n打印框架（Printing framework）为在\
  \ Android 中集成打印支持提供了多种选项。这些选项可以分类如下：\n\n### 80.7.1 图像打印\n\n顾如名，此选项允许将图像打印集成到 Android\
  \ 应用程序中。在应用程序添加此功能时，第一步是创建 `PrintHelper` 类的一个新实例：\n\n```\nPrintHelper imagePrinter\
  \ = new PrintHelper(context);\n```\n\n接下来，可以通过调用 `PrintHelper` 实例的 `setScaleMode()`\
  \ 方法指定打印图像的缩放模式。选项如下：\n\n• `SCALE_MODE_FIT` – 图像将缩放以适应纸张大小，而不进行裁剪或更改纵横比。这通常会导致在一个维度上出现空白区域。\n\
  • `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现空白区域。\n\n如果不设置缩放模式，系统将默认使用\
  \ `SCALE_MODE_FILL`。例如，以下代码在之前声明的 `PrintHelper` 实例上将缩放模式设置为适应模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式来指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一实现的：\n\
  \n• `COLOR_MODE_COLOR` – 指示图像将以彩色打印。\n• `COLOR_MODE_MONOCHROME` – 指示图像将以黑白打印。\n\n\
  打印框架默认为彩色打印，除非按如下指定单色选项：\n\n```\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作只需要一个待打印的图像并调用 `PrintHelper` 实例的 `printBitmap()` 方法，该方法传递一个代表分配给打印任务名称的字符串以及图像的引用（以\
  \ `Bitmap` 对象或 `Uri` 引用的形式存在）：\n\n```\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
  \               R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print\
  \ Job\", bitmap);\n```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续的用户交互以及在用户选择的打印目标上打印图像。\n\n\
  ### 80.7.2 创建并打印 HTML 内容\n\nAndroid 打印框架还为在应用程序内打印基于 HTML 的内容提供了一种简单方法。这些内容可以是托管在网站上的页面\
  \ URL 引用的 HTML 内容，也可以是在应用程序内动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，以最少的代码要求支持打印。\n\
  \n在动态创建 HTML 内容（而不是加载和打印现有网页）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web 客户端以便在 HTML 加载到 `WebView` 完成后启动打印任务。配置好 web 客户端后，HTML 被加载到 `WebView` 中，并触发打印过程。\n\
  \n例如，考虑以下代码：\n\n```\npublic void printContent()\n{\n    WebView webView = new WebView(this);\n\
  \    webView.setWebViewClient(new WebViewClient() {\n        @Override\n       \
  \ public boolean shouldOverrideLoading(WebView view, String url) {\n           \
  \ return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument = \"<html><body><h1>Android\
  \ Test</h1><p>\" + \"This is sample content.</p></body></html>\";\n    webView.loadDataWithBase(null,\
  \ htmlDocument, \"text/HTML\", \"UTF-8\", null);\n    myWebView = webView;\n}\n\
  ```\n\n此方法的代码开始声明一个变量 `myWebView`，其中将存储方法创建的 `WebView` 实例的引用。在 `printContent()`\
  \ 方法中，创建一个 `WebView` 类的实例并为其分配一个 `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient`\
  \ 配置为指示 HTML 内容的加载由 `WebView` 实例处理（通过从 `shouldOverrideLoading()` 方法返回 `false`）。更重要的是，声明并实现\
  \ `onPageFinished()` 处理方法以调用 `createPrintJob()` 方法。`onPageFinished()` 回调方法将在所有 HTML\
  \ 内容加载到 web view 后自动调用。这确保了在内容准备就绪之前不会启动打印任务，确保所有内容都被打印。\n\n接下来，创建一个包含某些 HTML 的字符串作为内容。然后将其加载到\
  \ web view 中。一旦 HTML 加载完成，`onPageFinished()` 方法将触发。最后，该方法存储 web view 对象的引用。没有这个关键的一步，Java\
  \ 运行时系统可能会认为应用程序不再需要该 web view 对象并丢弃它以释放内存（在 Java 术语中称为垃圾回收），导致打印任务在完成前终止。\n\n此示例中剩下的只是按如下所示实现\
  \ `createPrintJob()` 方法：\n\n\n\n\n\n```java\nprivate void createWebPrintJob(WebView\
  \ webView) {\n    PrintManager printManager = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n            webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Document\"\
  ;\n    PrintJob printJob = printManager.print(jobName, printAdapter,\n         \
  \   new PrintAttributes.Builder().build());\n}\n```\n\n此方法获取 `PrintManager` 服务的引用，并指令\
  \ web view 实例创建一个打印适配器。系统会创建一个新字符串来存储打印任务的名称（在此情况下，该名称基于应用程序名称和“Document”一词组合而成）。\n\
  \n最后，通过调用打印管理器的 `print()` 方法启动打印任务，并传递了任务名称、打印适配器以及一组默认打印属性。如果需要，可以自定义打印属性以指定分辨率（每英寸点数）、页边距和颜色选项。\n\
  \n## 80.7.3 打印网页\n\n打印网页涉及的步骤与上述概述的步骤相似，区别在于向 web view 传递要打印网页的 URL，而不是动态创建 HTML，例如：\n\
  \n```\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\");\n\
  ```\n\n同样重要的是，只有当网页加载后需要立即自动打印时，才需要配置 `WebViewClient`。如果打印是由用户在页面加载后选择菜单选项来启动的，则只需要在应用程序代码中包含上述的\
  \ `createWebPrintJob()` 方法中的代码。下一章“Android HTML 和 Web 内容打印示例”将演示此类场景。\n\n## 80.7.4\
  \ 打印自定义文档\n\n虽然打印框架（Printing framework）引入的 HTML 和网页打印功能为从 Android 应用内部打印内容提供了方便路径，但显而易见，对于更高级的打印需求，这些选项过于简单。打印框架还为更复杂的打印任务提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布（canvas）上然后进行打印。\n\
  \n与可以轻松实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂的多阶段过程，它将在本书的“Android 自定义文档打印指南”章节中进行概述。这些步骤可以总结如下：\n\
  \n* 连接到 Android 打印管理器\n* 创建一个自自 `PrintDocumentAdapter` 类的自定义打印适配器\n* 创建一个 `PdfDocument`\
  \ 实例来表示文档页面\n* 获取 `PdfDocument` 实例中页面的引用，每个页面都关联着一个 `Canvas` 实例\n* 在页面画布上绘制内容\n\
  * 通知打印框架文档已准备好打印\n\n上述步骤概述的自定义打印适配器必须实现几个方法，Android 系统将在打印期间调用这些方法来执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责根据用户更改纸张大小或页面方向等设置来重新排列文档布局；以及 `onWrite()` 方法，它负责渲染要打印的页面。名为“Android\
  \ 自定义文档打印指南”的章节将详细介绍这一主题。\n\n## 80.8 总结\n\nAndroid SDK 可以从运行中的应用内部打印内容。打印输出可以定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 传输到云端。从 Android 应用开发者的角度来看，通过使用打印框架可以在应用程序中使用这些功能。到目前，最容易实现的打印选项是涉及图像和\
  \ HTML 格式的内容。然而，更高级的打印可以使用框架的自定义文档打印功能来实现。\n\n## 81. 一个 Android HTML 和 Web 内容打印示例\n\
  \n正如上一章（“使用 Android 打印框架进行打印”）所述，Android 打印框架可以同时打印网页和动态创建的 HTML 内容。虽然这两种打印方法之间有很多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序来使这两种打印选项更加清晰。\n\
  \n### 81.1 创建 HTML 打印示例应用程序\n\n从欢迎界面上选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前，选择\
  \ Empty Views Activity 模板。\n\n在 Name 字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置更改为 API 26：Android 8.0 (Oreo)，并将\
  \ Language 菜单设置为 Java。\n\n### 81.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码，以创建一些 HTML 并将其发送到打印框架。首先找到\
  \ `MainActivity.java` 文件（位于 `app` -> `com.ebookfrenzy.htmlprint`）并将其加载到编辑面板中。加载后，修改代码使其读取如下：\n\
  \n```java\npackage com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            @Override\n            public boolean shouldOverrideLoading(WebView\
  \ view, WebResourceRequest request) {\n                return false;\n         \
  \   }\n\n            @Override\n            public void onPageFinished(WebView view,\
  \ String url) {\n                createWebPrintJob(view);\n                myWebView\
  \ = null;\n            }\n        });\n        String htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\"\n                + \"This is some sample content.</p></body></html>\"\
  ;\n        webView.loadDataWithBaseURL(null, htmlDocument, \"text/HTML\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n}\n```\n\n代码更改从声明变量 `myWebView` 开始，该变量将存储用于打印操作的\
  \ `WebView` 实例引用。\n\n\n\n\n分配给 web 对象的 `WebViewClient` 被配置为指示 HTML 内容的加载将由 `WebView`\
  \ 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()`\
  \ 处理器方法，用于调用 `createWebPrintJob()` 方法。当所有 HTML 内容都加载到 web view 中时，`onPageFinished()`\
  \ 方法将被自动调用。正如上一节所述，在打印动态创建的 HTML 内容时，此步骤是必要的，以确保在内容完全加载到 `WebView` 之后才启动打印任务。\n\n\
  接下来，创建一个包含某些 HTML 的 `String` 对象作为内容，并随后加载到 web view 中。一旦 HTML 加载完成，`onPageFinished()`\
  \ 回调方法将触发。最后，该方法在之前声明的 `myWebView` 变量中存储了 web view 对象的引用。如果没有这一至关重要的一步，存在很大风险，Java\
  \ 运行时系统可能会认为应用程序不再需要该 web view 对象并将其丢弃以释放内存，导致打印任务在完成之前就终止。\n\n本示例中剩下的工作是实现 `createWebPrintJob()`\
  \ 方法，该方法目前配置为由 `onPageFinished()` 回调方法调用。因此，在 `MainActivity.java` 文件中实现此方法，使其内容如下：\n\
  \n```java\nprivate void createWebPrintJob(WebView webView) {\n    PrintManager printManager\
  \ = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n            webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter,\n            new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取 `PrintManager` 服务的引用，并指示 web view 实例创建一个打印适配器。创建一个新字符串来存储打印任务的名称（在本情况下，基于应用程序名称和“Print\
  \ Test”字样）。\n\n最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、打印适配器和一组默认打印属性。\n\n在运行 Android\
  \ 5.0 或更高版本的设备或模拟器上编译并运行应用程序。一旦启动，将出现标准的 Android 打印页面，如图 81-1 所示。\n\n![](img/as_html_print_running.jpg)\n\
  \n图 81-1\n\n如果你配置了物理打印机，请打印到那里；保存到 Google Drive，或选择保存为 PDF 文件。一旦启动打印任务，请在选定的目标上检查生成的输出。请注意，使用“保存为\
  \ PDF”选项时，系统会请求 PDF 文件的文件和位置。Downloads 文件夹是一个很好的选择，可以通过选择设备上其他应用图标之间的 Downloads\
  \ 图标（在 Android 8 中重命名为 Files）来查看其内容。\n\n## 81.3 创建网页打印示例\n\n本章创建的第二个示例应用程序将为用户提供一个溢出菜单（Overflow\
  \ menu）选项，用于打印当前在 `WebView` 实例中显示的网页。\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击\
  \ Next（下一步）按钮之前，选择 Basic Views Activity 模板。\n\n在 Name 字段中输入 `WebPrint` 并指定 `com.ebookfrenzy.webprint`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单改为 Java。\n\n## 81.4 移除悬浮操作按钮\n\n选择 Basic Views Activity 模板提供了一个菜单和一个悬浮操作按钮（floating\
  \ action button）。由于应用程序不需要悬浮操作按钮，可以在继续之前将其移除。将 `activity_main.xml` 布局文件加载到布局编辑器中，选择悬浮操作按钮，按下键盘上的\
  \ Delete 键将对象从布局中删除。编辑 `MainActivity.java` 文件，从 `onCreate` 方法中删除悬浮操作按钮的代码，如下：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\",\n \
  \               Snackbar.LENGTH_LONG).show();\n        }\n    });\n}\n```\n\n##\
  \ 81.5 移除导航\n\n正如《Android Studio 布局编辑器指南》概述的那样，Basic Views Activity 模板包含多个 fragment\
  \ 和按钮，用于在 fragment 之间进行导航。这些功能对于本教程是不必要的，并且会在以后引起问题。在继续教程之前，请修改项目：\n\n1. 在 Project\
  \ 窗口中，导航并双击 `app` -> `res` -> `nav_graph.xml` 文件将其加载到编辑器中。\n2. 在编辑器中，选择图面板中的 `SecondFragment`\
  \ 条目并删除它。\n3. 找到并删除 `SecondFragment.java`（`app` -> `java`）和 `fragment_second.xml`（`app`\
  \ -> `layout`）文件。\n4. 找到 `FirstFragment.java` 文件，双击将其加载到编辑器，并移除 `onViewCreated()`\
  \ 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull View view, Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n       \
  \ @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
