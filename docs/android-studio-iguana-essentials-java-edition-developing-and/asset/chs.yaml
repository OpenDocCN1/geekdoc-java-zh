  \ 应用顶部的应用栏可以由多个元素组成，包括工具栏、标签布局和图像视图。当嵌入在 `CoordinatorLayout` 父容器时，有多种选项可以控制应用栏响应滚动事件的行为。为了对这种行为进行更大的控制，`CollapsingToolbarLayout`\
  \ 提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动的展开和收缩。\n\n# 52. Android Studio 主/详情流（Primary/Detail\
  \ Flow）教程\n\n本章将解释主/详情用户界面设计的概念，然后详细探讨 Android Studio 自带的主/详情流模板所包含的元素。随后，我们将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的步骤。\n\
  \n\n\n\n主列表/详情流（Primary/detail flow）是一种界面设计概念，其中向用户显示一组项目列表（称为主列表）。当从列表中选择一个项目时，与该项目相关的额外信息将在详情面板（detail\
  \ pane）中呈现给用户。例如，一个电子邮件应用程序可能包含一个收到的邮件主列表，其中包含发件人地址和邮件主题。当从主列表中选择某条消息后，邮件正文将出现在详情面板中。\n\
  \n在横屏模式的平板尺寸 Android 设备屏幕上，主列表显示在屏幕左侧的狭窄垂直面板中。屏幕的其余部分则用于详情面板，这种布局被称为双窗格模式（two-pane\
  \ mode）。例如，图 52-1 展示了主列表/详情的双窗格布局，其中列出了主项目，并在详情面板中显示了项目一的内容：\n\n![](img/as_detail_flow_tablet.jpg)\n\
  \n图 52-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，详情面板则显示在独立的屏幕上，当从主列表中进行选择时，该屏幕就会出现。在这种模式下，详情屏幕包含一个返回主列表的操作条（action\
  \ bar entry）。例如，图 52-2 说明了 4 英寸手机屏幕上同一项目列表的主屏幕和详情屏幕：\n\n![](img/as_detail_flow_phone.jpg)\n\
  \n图 52-2\n\n## 52.2 创建主列表/详情流 Activity\n\n在本章的下一节中，将详细介绍组成主列表/详情流模板的不同元素。实现此点的最佳方法是使用\
  \ `Primary/Detail Views Flow` 模板创建一个项目，并在处理信息时使用它。该项目随后将作为本章末教程的基础。\n\n从欢迎界面选择 `New\
