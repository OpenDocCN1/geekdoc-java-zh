- "# Android Studio Iguana 核心：Java 版——使用 Android Studio 2023.2.1 和 Java 开发 Android\
  \ 应用\n\n\n\n![](img/java_iguana_front_cover_large.jpg)\n\n![java_iguana_front_cover_large.jpg](img/java_iguana_front_cover_large.jpg)\n\
  \n\n\nISBN: 978-1-951442-89-7\n\n\n![](img/payload-publishing.jpg)\n\n访问 [`www.payloadbooks.com`](https://www.payloadbooks.com)\
  \ 获取更多书籍。\n\n## 2. 设置 Android Studio 开发环境\n\n在开始开发 Android 应用之前，第一步是配置计算机系统作为开发平台。这涉及多个步骤，包括安装\
  \ Android Studio 集成开发环境（IDE），包括 Android 软件开发包（SDK）和 OpenJDK Java 开发环境。\n\n本章将涵盖在\
  \ Windows、macOS 和基于 Linux 的系统上安装 Android 应用开发所需组件的步骤。\n\n#### 2.1 系统要求\n\nAndroid\
  \ 应用开发可以在任何系统类型上进行：\n\n- Windows 8/10/11 64 位\n- 运行 Intel 或 Apple 芯片的 macOS 10.14\
  \ 或更高版本\n- 配置 Intel i5 或更高处理器的 Chrome OS 设备\n- 带有 2.31 或更高版本 GNU C Library (`glibc`)\
  \ 的 Linux 系统\n- 至少 8GB 内存\n- 约 8GB 可用磁盘空间\n- 最小屏幕分辨率 1280 x 800\n\n#### 2.2 下载 Android\
  \ Studio 软件包\n\n开发 Android 应用的大部分工作将在 Android Studio 环境中完成。本书的内容和示例是基于 Android Studio\
  \ Iguana 2023.2.1 并使用 Android API 34 SDK (UpsideDownCake) 创建的，在编写时，这些是最新的稳定发布版本。\n\
  \n然而，Android Studio 频繁更新，因此自本书出版以来可能已经发布了新版本。\n\n可以从主页面下载最新版本的 Android Studio，该页面位于以下\
  \ URL：\n\n[`developer.android.com/studio/index.html`](https://developer.android.com/studio/index.html)\n\
  \n如果该页面提供了下载新版本 Android Studio 的说明，那么本书与软件之间可能存在差异。如果这些差异成为问题，搜索“Android Studio\
  \ Iguana”应该提供下载旧版本的选项。或者，访问以下网页在存档中找到 Android Studio Iguana 2023.2.1：\n\n[`developer.android.com/studio/archive`](https://developer.android.com/studio/archive)\n\
  \n#### 2.3 安装 Android Studio\n\n下载完成后，安装 Android Studio 的具体步骤取决于执行安装的操作系统。\n\n#####\
  \ 2.3.1 在 Windows 上安装\n\n在 Windows 资源管理器中找到下载的 Android Studio 安装可执行文件（命名为 `android-studio-<version>-windows.exe`），并双击它开始安装过程，如果弹出用户账户控制对话框，请点击\
  \ `Yes` 按钮。\n\n\n\n\n\n一旦 Android Studio 安装向导出现，请按照各个屏幕进行操作，以根据您的需求配置安装，包括 Android\
  \ Studio 的文件系统位置，以及它是否应对其他系统用户可用。在提示选择要安装的组件时，请确保选中 Android Studio 和 Android Virtual\
  \ Device（Android 虚拟设备）所有选项。\n\n虽然对于 Android Studio 安装在系统中的位置没有严格规定，但本书的其余部分将假设安装路径为\
  \ `C:\\Program Files\\Android\\Android Studio`，并且 Android SDK 程序包已安装在用户的 `AppData\\\
  Local\\Android\\sdk` 子文件夹中。配置好选项后，点击 `Install` 按钮开始安装过程。\n\n在带有开始菜单的 Windows 版本上，可以从安装期间添加到该菜单的项目中启动新安装的\
  \ Android Studio。可以通过导航到 `Android Studio\\bin` 目录，右键点击 `studio64` 可执行文件，并选择 `Pin\
  \ to Taskbar` 选项将其固定到任务栏以便快速访问（在 Windows 11 上，可以通过选择菜单中的 `Show more options` 找到此选项）。\n\
  \n### 2.3.2 在 macOS 上安装\n\nmacOS 版的 Android Studio 以磁盘镜像 (.dmg) 文件格式下载。下载 `android-studio-<version>-mac.dmg`\
  \ 文件后，在 Finder 窗口中找到它并双击打开，如图 2-1 所示：\n\n![](img/as_dmg_drag_to_applications.jpg)\n\
  \n图 2-1\n\n要安装此包，将 Android Studio 图标拖动到 `Applications` 文件夹。Android Studio 包将安装到系统的\
  \ `Applications` 文件夹中，此过程通常需要几秒钟完成。\n\n要启动 Android Studio，在 Finder 窗口中找到 `Applications`\
  \ 文件夹中的可执行文件并双击它。\n\n为了以后方便访问该工具，可以将 Android Studio 图标从 Finder 窗口拖动到 dock 中。\n\n\
  ### 2.3.3 在 Linux 上安装\n\n下载好 Linux 版 Android Studio 包后，打开终端窗口，进入要安装 Android Studio\
  \ 的目录，并执行以下命令：\n\n```\ntar xvfz /<path to package>/android-studio-<version>-linux.tar.gz\n\
  ```\n\n请注意，Android Studio 压缩将安装到名为 `android-studio` 的子目录中。因此，假设上述命令是在 `/home/demo`\
  \ 中执行的，软件包将解压到 `/home/demo/android-studio`。\n\n要启动 Android Studio，打开终端窗口，进入 `android-studio/bin`\
  \ 子目录，并执行以下命令：\n\n```\n./studio.sh\n```\n\n### 2.4 Android Studio 安装向导\n\n如果您之前安装过较早版本的\
  \ Android Studio，在首次启动此新版本时，可能会弹出一个对话框，提供从之前的 Android Studio 版本导入设置的选项。如果您有以前版本的设置并希望将其导入到最新安装中，请选择相应的选项和位置。或者，也可以指明您不需要导入任何之前的设置并点击\
  \ `OK` 按钮继续。\n\n如果您是首次安装 Android Studio，在安装过程开始后出现的初始对话框可能类似于下方的图 2-2 所示：\n\n![](img/as_setup_wizard.jpg)\n\
  \n图 2-2\n\n如果出现此对话框，点击 `Next` 按钮显示 `Install Type`（安装类型）屏幕（图 2-3）。在此屏幕上，点击 `Next`\
  \ 之前选择 `Standard（标准）安装选项。\n\n![](img/as_setup_install_type.jpg)\n\n图 2-3\n\n在 `Select\
  \ UI Theme（选择 UI 主题）屏幕上，根据您的喜好选择 `Darcula` 或 `Light` 主题。选择后，点击 `Next`，并在 `Verify\
  \ Settings（验证设置）屏幕上检查选项，然后进入 `License Agreement（许可协议）屏幕。选择每个许可类别并启用 `Accept` 复选框。最后，点击\
  \ `Finish` 按钮启动安装。\n\n完成这些初始设置步骤后，点击 `Finish` 按钮显示使用您所选 UI 主题的 Android Studio 欢迎界面：\n\
  \n![](img/as_iguana_welcome.jpg)\n\n图 2-4\n\n### 2.5 安装额外的 Android SDK 程序包\n\n到为止执行的步骤安装了\
  \ Android Studio IDE 和当前的默认 Android SDK 程序包。在继续之前，值得花些时间验证安装了哪些程序包，并安装任何缺失或更新的程序包。\n\
  \n可以通过点击欢迎对话框中的 `More Actions` 链接并从下拉菜单中选择 `SDK Manager` 来执行此任务。一旦调用，将显示 `Settings`\
  \ 对话框中的 `Android SDK` 屏幕，如图 2-5 所示：\n\n![](img/as_sdk_manager.jpg)\n\n图 2-5\n\n\
  Google 每个 Android Studio 版本都与 Android SDK 的最高支持应用程序接口（API）级别配对。对于 Android Studio\
  \ Iguana，该级别是 Android UpsideDownCake（API Level 34）。可以通过以下链接确认此信息：\n\n[`developer.android.com/studio/releases#api-level-support`](https://developer.android.com/studio/releases#api-level-support)\n\
  \n首次安装 Android Studio 之后，可能只安装了最新版本的 Android SDK 版本。要安装旧版本的 Android SDK，请选择相应的复选框并点击\
  \ `Apply` 按钮。本书的其余部分假设已安装 Android UpsideDownCake（API Level 34）SDK。\n\n本书大部分示例将支持直到\
  \ Android 8.0 (Oreo) 的旧版本 Android。这确保了程序可以在广泛的 Android 设备上运行。在 SDK 版本列表中，启用 Android\
  \ 8.0 (Oreo) 旁的复选框并点击 `Apply` 按钮。在生成的确认对话框中点击 `OK` 安装 SDK。随后的对话框将在执行安装前寻求接受许可和条款。安装完成后，点击\
  \ `Finish`。\n\n最新 SDK 也可能列出可用更新。要访问有关更新包的详细信息，请启用屏幕右下角的 `Show Package Details（显示包详情）`\
  \ 选项。这将显示图 2-6 所示的信息：\n\n![](img/as_sdk_manager_update_available.jpg)\n\n图 2-6\n\
  \n上图了可用更新。要安装更新，启用项目名称左侧的复选框并点击 `Apply` 按钮。\n\n除了 Android SDK 程序包，还安装了多个用于构建 Android\
  \ 程序的工具。要查看已安装的包并检查更新，请留在 SDK 设置屏幕并选择 `SDK Tools` 卡，如图 2-7 所示：\n\n![](img/as_sdk_manager_tools.jpg)\n\
  \n图 2-7\n\n在 Android SDK Tools 屏幕中，请确保以下包在“Status”列中显示为“Installed”：\n\n• Android\
  \ SDK Build-tools\n• Android Emulator\n• Android SDK Platform-tools\n• Google Play\
  \ Services\n• Intel x86 Emulator Accelerator (HAXM installer)*\n• Google USB Driver（仅限\
  \ Windows）\n• Layout Inspector image server for API 31-34\n\n*注意：Intel x86 Emulator\
  \ Accelerator (HAXM installer) 无法基于 Apple 芯片的 Mac 上安装。\n\n\n\n\n\n如果上述任何软件包被列为“未安装”（Not\
  \ Installed）或需要更新，请勾选这些包旁边的复选框并点击 `Apply` 按钮启动安装过程。如果出现 `HAXM` 模拟器设置对话框，请选择推荐的内存分配：\n\
  \n![](img/as_haxm_memory.jpg)\n图 2-8\n\n安装完成后，检查软件包列表并确保选中的包在 `Status`（状态）列中显示为`Installed`已安装）。如果任何包被列为“未安装”（Not\
  \ installed），请确保它们已勾选并再次点击 `Apply` 按钮。\n\n## 2.6 安装 Android SDK 命令行工具\n\nAndroid\
  \ Studio 包含了一些允许从操作系统命令行执行某些任务的工具。要在你的系统中安装这些工具，请打开 `SDK Manager`，选择 `SDK Tools`\
  \ 选项卡，并找到图 2-9 所示的 `Android SDK Command-line Tools (latest)` 软件包：\n\n![](img/as_sdk_manager_command_line_tools.jpg)\n\
  图 2-9\n\n如果 `command-line tools` 软件包尚未安装，请启用它并点击 `Apply`，然后点击 `OK` 完成安装。安装完成后，点击\
  \ `Finish` 并关闭 `SDK Manager` 对话框。\n\n为了使你正在开发的操作系统能够找到这些工具，有必要将它们添加到系统的 `PATH` 环境变量中。\n\
  \n无论你使用哪种操作系统，你都需要配置 `PATH` 环境变量以包含以下路径（其中 `<path_to_android_sdk_installation>`\
  \ 代表你安装 Android SDK 的文件系统位置）：\n\n`<path_to_android_sdk_installation>/sdk/cmdline-tools/latest/bin`\n\
  \n`<path_to_android_sdk_installation>/sdk/platform-tools`\n\n你可以通过启动 `SDK Manager`\
  \ 并参考设置面板顶部的 `Android SDK Location:` 字段来识别 SDK 在你系统上的位置，如图 2-10 高亮所示：\n\n![](img/as_sdk_location.jpg)\n\
  图 2-10\n\n一旦确定了 SDK 的位置，将其添加到 `PATH` 变量的步骤取决于操作系统：\n\n### 2.6.1 Windows 8.1\n\n\
  1. 在启动屏幕上，将鼠标移动到屏幕右下角并从生成的菜单中选择 `Search`（搜索）。在搜索框中输入 `Control Panel`（控制面板）。当 `Control\
  \ Panel` 图标出现在结果区域时，点击它在桌面上启动该工具。\n2. 在 `Control Panel` 中，使用 `Category` 菜单将显示改为\
  \ `Large Icons`（大图标）。从图标列表中选择标记为 `System`（系统）的项目。\n3. 在 `Environment Variables`（环境变量）对话框中，在\
  \ `System variables`（系统变量）列表中找到 `Path` 变量，选中它并点击 `Edit…` 按钮。在编辑对话框中使用 `New` 按钮向路径中添加两个新条目。例如，假设\
  \ Android SDK 安装在 `C:\\Users\\demo\\AppData\\Local\\Android\\Sdk`，需要添加以下项：\n\n`C:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk\\cmdline-tools\\latest\\bin`\n\n`C:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk\\platform-tools`\n\n4. 在每个对话框中点击 `OK`\
  \ 并关闭系统属性控制面板。\n\n通过按下键盘上的 `Windows + R` 并在 `Run` 对话框中输入 `cmd` 打开命令提示符窗口。在 `Command\
  \ Prompt` 窗口输入：\n\n```\necho %Path%\n```\n\n返回的路径变量值应包含 Android SDK platform tools\
  \ 文件夹的路径。通过尝试如下所示运行 `adb` 工具来验证 `platform-tools` 值是否正确：\n\n```\nadb\n```\n\n执行该工具时，应输出命令行选项列表。\n\
  \n同样，通过尝试运行 `AVD Manager` 命令行工具来检查工具路径设置（不要担心 `avdmanager` 工具报告 Java 问题——这稍后会处理）：\n\
  \n```\navdmanager\n```\n\n如果其中一个或两个命令出现类似下面的消息，那么很可能是向 `Path` 环境变量中添加了错误的路径：\n\n\
  `'adb' is not recognized as an internal or external command, operable program or\
  \ batch file.`\n\n### 2.6.2 Windows 10\n\n右键点击 `Start` 菜单，从生成的菜单中选择 `Settings`（设置），并在\
  \ `Find a setting`（查找设置）文本框中输入“Edit the system environment variables”。在 `System\
  \ Properties` 对话框中，点击 `Environment Variables...` 按钮。按照 Windows 8.1 列出的步骤从第 3 步开始。\n\
  \n### 2.6.3 Windows 11\n\n右键点击任务栏上的 `Start` 图标，从生成的菜单中选择 `Settings`。当 `Settings`\
  \ 对话框出现时，向下滚动类别列表并选择“About”（关于）选项。在 `About` 界面，从 `Related links`（相关链接）部分选择 `Advanced\
  \ system settings`（高级系统设置）。当 `System Properties` 窗口出现，点击 `Environment Variables...`\
  \ 按钮。按照 Windows 8.1 列出的步骤从第 3 步开始。\n\n### 2.6.4 Linux\n\n此配置可以通过向主目录下的 `.bashrc`\
  \ 文件中添加命令来实现（具体细节可能取决于特定的 Linux 发行版）。假设 Android SDK 软件包安装在 `/home/demo/Android/sdk`，`.bashrc`\
  \ 中的内容如下：\n\n```\nexport PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/cmdline-tools/latest/bin:/home/demo/Android/sdk/android-studio/bin:$PATH\n\
  ```\n\n注意，上述命令将 `android-studio/bin` 目录添加到 `PATH`。\n\n### 2.6.5 macOS\n\n在 macOS\
  \ 上可以使用多种技术修改 `PATH` 环境变量。最干净的方法是在 `/etc/paths.d` 中创建一个新文件，包含要添加到 `$PATH` 的路径。假设\
  \ Android SDK 位于 `/Users/demo/Library/Android/sdk`，可以通过包含以下内容配置：\n\n`/Users/demo/Library/Android/sdk/cmdline-tools/latest/bin`\n\
  \n`/Users/demo/Library/Android/sdk/platform-tools`\n\n注意，由于这是系统目录，需要使用 `sudo` 命令。例如：\n\
  \n```\nsudo vi /etc/paths.d/android-sdk\n```\n\n内存管理\n\nAndroid Studio 是一个大型且复杂的应用程序，具有许多后台进程。尽管\
  \ Android Studio 过去被批评性能不利，但 Google 在最近的版本中进行了重大改进，并在每个新版本中持续改进。这些改进包括允许用户配置 Android\
  \ Studio IDE 以及用于构建和运行应用的后台进程所使用的内存。这使得软件能够利用更大内存的系统。\n\n如果你在具有足够空闲内存的系统上运行 Android\
  \ Studio（此功能适用于具有 5GB 或更多内存的 64 位系统）并发现 Android Studio 性能下降，那么值得尝试这些内存设置。Android\
  \ Studio 还可能通过类似所示的对话框提示你可以提高性能：\n\n![](img/as_3.5_increase_memory_notification.jpg)\n\
  图 2-11\n\n要查看并修改内存配置，选择主菜单选项 `File -> Settings...`（macOS 上为 `Android Studio -> Settings...`），并在生成的对话框中，选择\
  \ `Appearance & Behavior`，然后选择左侧导航面板中 `System Settings` 下的 `Memory Settings` 选项，如下图\
  \ 2-12 所示：\n\n![](img/as_memory_settings.jpg)\n图 2-12\n\n更改内存分配时，请不要分配超过必要的内存或超过在不影响其他进程的情况下系统能提供的内存。\n\
  \n\n\n\n\nIDE 堆内存（heap size）设置会调整分配给 Android Studio 的内存，无论当前加载的项目均有效。另一方面，当在 Android\
  \ Studio 内部构建并运行项目时，几个后台进程（称为守护进程 daemon）会执行编译和运行应用的任务。在编译和运行大型复杂项目时，可以通过调整守护进程的堆设置来改进构建时间。与\
  \ IDE 堆内存设置不同，这些守护进程设置仅适用于当前项目，并且只有在 Android Studio 中打开项目时才能访问。若要在打开的项目中显示 SDK Manager，请从主菜单中选择\
  \ `Tools -> SDK Manager...` 菜单选项。\n\n## 2.8 更新 Android Studio 和 SDK\n\nAndroid Studio\
  \ 和 Android SDK 会不定期发布新版本。新版本的 SDK 通过 Android SDK Manager 进行安装。当有更新版本准备好进行安装时，Android\
  \ Studio 通常会通知你。\n\n要手动检查 Android Studio 的更新，请使用 Android Studio 主窗口的 `Help -> Check\
  \ for Updates...` 菜单选项（macOS 上为 `Android Studio -> Check for Updates...`）。\n\n##\
  \ 2.9 总结\n\n在开始开发 Android 应用程序之前，第一步是搭建合适的开发环境。这包括 Android SDK 和 Android Studio\
  \ IDE（其中包含 OpenJDK 开发环境）。本章涵盖了在 Windows、macOS 和 Linux 上安装这些包的必要步骤。\n\n## 3. 在 Android\
  \ Studio 中创建一个示例 Android 应用\n\n本书的前几个章节已经解释了如何使用 Android Studio IDE 配置适用于开发 Android\
  \ 应用程序的环境。在进入稍为高级的话题之前，现在是验证所有所需的开发包已安装并运行良好的良好时机。实现这一目标的最好方法是创建一个 Android 应用程序并编译运行它。本章将涵盖如何使用\
  \ Android Studio 创建 Android 应用程序项目。项目创建完成后，稍后的章节将探索如何使用 Android 模拟器环境对应用程序进行测试运行。\n\
  \n### 3.1 关于项目\n\n在本章创建的项目是一个基础的货币转换计算器（事实上它非常简单，只支持从美元到欧元的转换，并使用估算汇率进行）。该项目还将使用\
  \ Android Studio 最基础的项目模板之一。这种简单性允许我们介绍 Android 应用开发的一些关键方面，而不会因为一次性引入过多的概念（例如推荐的应用程序架构和\
  \ Android 架构组件）让初学者无从适从。在遵循本章的教程时，请放心，初始示例项目中所使用的技术和代码将在稍后进行更详细的介绍。\n\n### 3.2 创建新的\
  \ Android 项目\n\n应用程序开发过程的第一步是在 Android Studio 环境中创建一个新项目。因此，首先启动 Android Studio，直到出现“Welcome\
  \ to Android Studio”屏幕，如图 3-1\n\n图 3-1\n\n一旦此窗口出现，Android Studio 就已准备好创建一个新项目。要创建新项目，点击\
  \ `New Project` 选项显示新项目向导的第一个屏幕。\n\n### 3.3 创建 Activity\n\n下一步是为应用程序定义要创建的初始 Activity\
  \ 类型。提供了为手机和平板电脑、Wear OS、电视或汽车创建项目的选项。在开发 Android 应用程序时，有多种 Activity 类型可供选择，许多将在后续章节中进行详细介绍。然而，对于本示例，请从从版（Templates）面板中选择\
  \ `Phone and Tablet` 选项，然后选择创建 `Empty Views Activity` 选项。Empty Views Activity 选项会创建一个由单个\
  \ `TextView` 对象组成的模板用户界面。\n\n![](img/as_new_project_template.jpg)\n\n图 3-2\n\n选中\
  \ Empty Views Activity 选项后，点击 `Next` 继续项目配置。\n\n### 3.4 定义项目和 SDK 设置\n\n在项目配置窗口（图\
  \ 3-3 中的 `Help me choose` 按钮，以查看 Android 版本的详细说明：\n\n![](img/as_java_project_settings.jpg)\n\
  \n图 3-3\n\n最后，将 `Language`（语言）菜单更改为 `Java` 并选择 `Kotlin DSL (build.gradle.kts)` 作为构建配置语言，然后点击\
  \ `Finish` 创建项目。\n\n### 3.5 使用新的 Android Studio UI\n\nAndroid Studio 正在转向新的现代用户界面，该界面在\
  \ Iguana 版本中默认未启用。如果你的 Android Studio 安装如图 3-4 所示，则你需要在继续之前启用新 UI：\n\n![](img/as_old_ui.jpg)\n\
  \n图 3-4\n\n通过选择 `File -> Settings...` 菜单选项（macOS 上为 `Android Studio -> Settings...`）并选择左面板中\
  \ `Appearance and Behavior` 下的 `New UI` 选项来启用新 UI。在主面板中勾选 `Enable new UI` 复选框，然后点击\
  \ `Apply`，最后点击 `OK` 提交更改：\n\n![](img/as_new_ui.jpg)\n\n图 3-5\n\n根据提示，重启 Android\
  \ Studio 以激活新用户界面。\n\n### 3.6 修改示例应用程序\n\n当 Android Studio 重启后，主窗口将使用新 UI 再次出现，并包含我们的\
  \ `AndroidSample` 项目，如图 3-6 所示：\n\n![](img/as_main_window.jpg)\n\n图 3-6\n\n\n\n\n\
  \n新创建的项目以及相关文件的引用列在主项目窗口左侧的 `Project` 工具窗口中。`Project` 工具窗口有多种可以显示信息的模式。默认情况下，此面板应处于\
  \ Android 模式。此设置由面板顶部的菜单控制，如图 3-7 所示。如果该面板当前未处于 Android 模式，请使用菜单切换模式：\n\n![](img/as_project_menu.jpg)\n\
  \n图 3-7\n\n## 3.7 修改用户界面\n\n我们此活动的用户界面设计存储在一个名为 `activity_main.xml` 的文件中，该文件位于 `Project`\
  \ 工具窗口文件层级结构中的 `app -> res -> layout` 下。在 `Project` 工具窗口中找到该文件后，双击文件即可将其加载到用户界面布局编辑器（Layout\
  \ Editor）工具中，该工具将显示在 Android Studio 主窗口的中间面板中：\n\n![](img/as_layout_editor.jpg)\n\
  \n图 3-8\n\n布局编辑器窗口顶部工具栏上有一个菜单（在上方图中设置为 `Pixel`），该设置反映在布局编辑器面板内设备的视觉表示上。点击此菜单可以使用一系列其他设备选项。\n\
  \n使用 `System UI Mode` 按钮 `![](img/as_night_mode_button.jpg)` 为设备屏幕布局开启或关闭夜间模式（Night\
  \ mode）。要在设备表示的横屏和竖屏之间切换方向，请使用显示 `![](img/as_rotate_button.jpg)` 图标的下拉菜单。\n\n从设备屏幕中看到，内容布局已经包含了一个显示“Hello\
  \ World!”消息的标签。面板左侧是一个调色板，包含不同类别的用户界面组件，这些组件可用于构建用户界面，例如按钮、标签和文本字段。然而，需要注意的是并非所有的用户界面组件对用户都是可见的。其中一类就是布局。Android\
  \ 支持多种布局，它们对视觉用户界面组件在屏幕上的定位和管理提供了不同程度的控制。虽然从用户界面的视觉表示上很难看出，但当前设计是使用 `ConstraintLayout`\
  \ 创建的。这可以通过查看 `Component Tree` 面板信息来确认，该面板默认位于布局编辑器面板的左下角，如图 3-9 所示：\n\n![](img/as_component_tree.jpg)\n\
  \n图 3-9\n\n从组件树层级结构可以看出，用户界面布局由一个名为 `main` 的 `ConstraintLayout` 父布局和一个 `TextView`\
  \ 子对象组成。\n\n在继续之前，检查布局编辑器的 `Autoconnect`（自动连接）模式是否启用。这意味着当组件添加到布局中时，布局编辑器会自动添加约束，以确保组件在不同的屏幕尺寸和设备方向上正确定位（该主题将在后续章节中进行更详细的介绍）。`Autoconnect`\
  \ 按钮位于布局编辑器工具栏中，用 U 形图标表示。当禁用时，图标上会显示一条对斜线（图 3-10）。如有必要，请通过点击此按钮重新启用 `Autoconnect`\
  \ 模式。\n\n![](img/as_autoconnect_disabled.jpg)\n\n图 3-10\n\n修改应用的下一步是向布局中添加一些额外的组件，其中第一个是一个\
  \ `Button`，供用户点击以启动货币转换。\n\n`Palette` 面板由两列组成，左列包含视图组件类别的列表。右列列出当前选择类别包含的组件。例如，在图\
  \ 3-11 中，在 `Buttons` 类别中当前选择了 `Button` 视图：\n\n![](img/as_palette_button_selected.jpg)\n\
  \n图 3-11\n\n从 `Buttons` 列表中点击并拖拽 `Button` 对象，将其到用户界面设计的水平中心，使其位于现有 `TextView` 小部件下方：\n\
  \n![](img/as_android_sample_button.jpg)\n\n图 3-12\n\n下一步是更改 `Button` 组件当前显示的文本。位于设计区域右侧的面板是\
  \ `Attributes`（属性）面板。该面板显示分配给布局中当前选择组件的属性。在该面板内，在 `Common Attributes`（常用属性）部分找到\
  \ `text` 属性并将当前值从“Button”更改为“Convert”，如图 3-13 所示：\n\n![](img/as_android_sample_button_text.jpg)\n\
  \n图 3-13\n\n第二个带有扳手图标的文本属性允许设置一个文本属性，该属性仅在布局编辑器工具中显示，但在运行时不显示。这对于测试视觉组件和布局在不同设置下的表现如何非常用，而无需反复运行应用程序。\n\
  \n以万一 `Autoconnect` 系统未能设置所有布局连接，请点击 `Infer Constraints`（推断约束）按钮（图 3-14）来添加任何缺失的约束：\n\
  \n![](img/as_editor_autoconnect.jpg)\n\n图 3-14\n\n重要的是解释布局编辑器右上角的警告按钮，如图 3-15 所示。此警告表示布局可能存在问题。点击该按钮查看问题的详情：\n\
  \n![](img/as_warnings.jpg)\n\n图 3-15\n\n点击后，将弹出 `Problems`（问题）工具窗口（图 3-16），描述问题的性质：\n\
  \n![](img/as_tool_window.jpg)\n\n图 3-16\n\n此工具窗口分为两个面板。左面板（在图中标记为 A）列出了布局文件中检测到的问题。在我们的示例中，列出了以下问题：\n\
  \nbutton <Button>: Hardcoded text\n\n当从列表中选择一个项目（B）时，右面板将更新以提供有关问题的详细信息（C）。在这种情况下，解释如下：\n\
  \n硬编码字符串 \"Convert\"，应使用 @string 资源\n\n工具窗口还包含一个预览编辑器（D），允许对布局文件进行手动修正。\n\n此 I18N\
  \ 消息告我们项目未来的国际化存在潜在问题（“I18N”源于“internationalization”一词以 I 开头，以 N 结尾，中间有 18 个字母）。该警告提醒我们，在开发\
  \ Android 应用程序时，尽可能将属性和文本字符串值存储为资源。这样做可以通过修改资源文件来更改应用程序的外观，而无需更改源代码。这在将用户界面翻译成不同的语言时可能特别有价值。如果用户界面中的所有文本都包含在一个资源文件中（例如），可以将该文件交给翻译人员，他们将执行翻译工作并返回翻译文件包含在应用程序。这使得能够针对多种语言，而无需进行任何源代码更改。在此实例，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n首先点击 `Show Quick Fixes`（显示快速修复）按钮（E），从菜单中选择\
  \ `Extract string resource`（提取字符串资源）选项，如图 3-17 所示：\n\n![](img/as_extract_button.jpg)\n\
  \n图 3-17\n\n\n\n\n\n选择此选项后，将出现提取资源（Extract Resource）面板（图 3-18）。在此面板中，将资源名称字段更改为\
  \ `convert_string`，并将资源值保留为 `Convert`，然后点击 OK 按钮：\n\n![](img/as_extract_resource.jpg)\n\
  \n图 3-18\n\n下一个要添加的组件是 `EditText` 组件，用户将在其中输入要转换的美元金额。从 `Palette`（调色板）面板选择 `Text`\
  \ 类别，点击并拖动一个 `Number (Decimal)` 组件到布局中，使其水平居中，并放置在现有的 `TextView` 组件上方。选中该组件后，使用\
  \ `Attributes`（属性）工具窗口将 `hint` 属性设置为“dollars”。点击警告图标并将字符串提取为命名为 `dollars_hint` 的资源。\n\
  \n本章稍后编写的代码需要访问用户在 `EditText` 字段中输入的美元值。它将通过引用分配给用户界面布局中组件的 `id` 来实现这一点。Android\
  \ Studio 为组件分配的默认 `id` 可以在布局中选中组件时从 `Attributes` 工具窗口进行查看和更改，如图 3-19 所示：\n\n![](img/as_widget_id.jpg)\n\
  \n图 3-19\n\n将 `id` 改为 `dollarText`，并在 `Rename`（重命名）对话框中点击 `Refactor`（重构）按钮。这将确保项目其他地方对旧\
  \ `id` 的任何引用都会自动更新为新的 `id`：\n\n![](img/as_rename_id_dialog.jpg)\n\n图 3-20\n\n如有必要，重复步骤将\
  \ `TextView` 组件的 `id` 设置为 `textView`。\n\n点击 `Infer Constraints`（推断约束）按钮添加任何缺失的布局约束。此时，布局应该类似于图\
  \ 3-21 所示所示：\n\n![](img/as_android_sample_ui.jpg)\n\n图 3-21\n\n### 3.8 审查布局和资源文件\n\
  \n在继续下一步之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过使用 `Layout Editor`（布局编辑器）工具修改 `activity_main.xml`\
  \ 文件来更改用户界面。事实上，`Layout Editor` 提供了一种编辑文件底层 XML 内容的用户友好方法。在实践中，没有理由不直接修改 XML 来更改用户界面，在某些情况下，这实际上比使用\
  \ `Layout Editor` 工具更快。在 `Layout Editor` 面板的右上角是 `View Modes`（视图模式）按钮，在下方图 3-22\
  \ 中标记为 A 到 C：\n\n![](img/as_layout_editor_view_mode_buttons.jpg)\n\n图 3-22\n\n默认情况下，编辑器将处于\
  \ `Design`（设计）模式（C 按钮），此时只显示布局的视觉表示。在 `Code`（代码）模式（A）下，编辑器将显示布局的 XML，而在 `Split`（分屏）模式（B）下，布局和\
  \ XML 都会显示，如图 3-23 所示：\n\n![](img/as_layout_editor_split_mode.jpg)\n\n图 3-23\n\n\
  `View Modes` 按钮左侧的按钮（在上方图 3-22 中标记为 B）用于快速在 `Code` 和 `Split` 模式之间切换。\n\n从 XML 文件的结构可以看出，用户界面由\
  \ `ConstraintLayout` 组件组成，该组件又是 `TextView`、`Button` 和 `EditText` 对象的父。我们还可以看到，例如，`Button`\
  \ 的 `text` 属性设置为我们的 `convert_string` 资源。尽管复杂性和内容各异，但所有用户界面布局都是这种分层的、基于 XML 的结构。\n\
  \n随着 XML 布局的更改，这些更改将反映在布局画布上。也可以在布局画布面板内从视觉上修改布局，更改将显示在 XML 列表中。要查看此效果，切换到 `Split`\
  \ 模式并修改 XML 布局，将 `ConstraintLayout` 的背景颜色更改为红色调如下：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/main\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\"\n    android:background=\"#ff2438\" >\n\n\
  .\n\n.\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n注意布局颜色实时更改以匹配\
  \ XML 文件中的新设置。同样注意，XML 编辑器左侧边距（也称为行槽）中包含颜色设置的行会出现一个小红色正方形。点击红色正方形将提示设置了颜色，这将显示颜色选择器以便选择颜色：\n\
  \n![](img/as_layout_editor_color_selector.jpg)\n\n图 24\n\n在继续之前，删除布局中的 `background`\
  \ 属性使背景恢复默认。最后，使用 `Project` 面板找到 `app` -> `values` -> `strings.xml` 文件并双击它将其加载到编辑器。目前\
  \ XML 显示为：\n\n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n\
  \    <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n</resources>\n```\n\n为了演示资源的使用，将分配给 `convert_string` 的字符串更改为“Convert\
  \ to Euros”，然后通过选择布局返回布局编辑器。注意布局已获取字符串的新资源。\n\n还有一种快速方法可以访问 XML 文件引用的资源值。在 `Split`\
  \ 或 `Code` 模式下，点击 `@string/convert_string` 属性使其高亮，然后按下键盘上的 `Ctrl-B`（macOS 上为 `Cmd-B`）。Android\
  \ Studio 随后将打开 `strings.xml` 文件并带您进入该资源定义的行。利用此机会将字符串恢复为原始文本“Convert”，并添加后续应用程序代码中引用的附加条目：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n  \
  \  <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n    <string name=\"no_value_string\">No Value</string>\n</resources>\n\
  ```\n\n资源字符串也可以通过点击编辑器右上角的 `Open editor` 链接使用 Android Studio 翻译编辑器进行编辑。这将显示 Studio\
  \ 窗口主面板中的翻译编辑器：\n\n![](img/as_translations_editor.jpg)\n\n图 25 允许编辑分配给资源键的字符串并管理多种语言的翻译。\n\
  \n### 3.9 添加交互\n\n此示例项目的最后一步是使应用程序具有交互性，当用户在 `EditText` 字段中输入美元并点击转换按钮时，转换后的欧元金额显示在\
  \ `TextView` 上。这涉及对 `Button` 组件实现某些事件处理。具体来说，需要配置 `Button` 以在触发 `onClick` 事件时调用应用程序代码中的方法。事件处理可以通过多种方式实现，并在后续标题为\
  \ Android 事件处理概述与示例的章节中介绍。返回布局编辑器的 `Design` 模式，在布局编辑器中选择 `Button` 组件，参考 `Attributes`\
  \ 工具窗口，并指定名为 `convertCurrency` 的方法如下所示：\n\n\n\n\n\n![](img/as_onclick_attribute.jpg)\n\
  \n图 3-26\n\n接下来，在 Project 工具窗口中，双击 `MainActivity.java` 文件（`app` -> `java` -> `<package\
  \ name>` -> `MainActivity`）将其加载到代码编辑器中，并在类文件中添加 `convertCurrency` 方法的代码，使其读取如下。请注意，还需要导入一些额外的\
  \ Android 程序包：\n\n```java\npackage com.ebookfrenzy.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.EditText;\n\
  \nimport android.widget.TextView;\n\n.\n.\n\nimport java.util.Locale;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    public void convertCurrency(View\
  \ view) {\n        EditText dollarText = findViewById(R.id.dollarText);\n      \
  \  TextView textView = findViewById(R.id.textView);\n        if (!dollarText.getText().toString().isEmpty())\
  \ {\n            float dollarValue = Float.parseFloat(dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n该方法首先通过调用名为 `findViewById` 的方法并传递布局文件中分配的 `id` 来获取\
  \ `EditText` 和 `TextView` 对象的引用。随后会进行检查以确保用户已输入了美元金额，如果是，则提取该值，将其从 `String` 转换为浮点值，并转换为欧元。最后，结果将显示在\
  \ `TextView` 组件上。\n\n如果对这些内容有任何不清楚的地方，请放心，这些概念将在后面的章节中进行更详细介绍。特别是关于在代码内部使用 `findByViewId`\
  \ 访问控件的主题，以及对称为“视图绑定”（view binding）的替代技术的介绍，将在标题为“Android View Binding 概述”的章节中讲解。\n\
  \n## 3.10 总结\n\n虽然并不极端复杂，但设置 Android 开发环境涉及多个步骤。在完成这些步骤后，值得运行一个示例以确保环境已正确安装和配置。在本章中，我们创建了一个示例应用程序，并使用\
  \ Android Studio 布局编辑器工具修改了用户界面布局。在此过程中，我们探索了尽可能使用资源（特别是字符串值）的重要性，并简要提到了布局。接下来，我们查看了用于存储\
  \ Android 应用程序界面设计的底层 XML。\n\n最后，在连接到 `Button` 上添加了 `onClick` 事件，该事件连接到一个实现的方法，用于从\
  \ `EditText` 组件中提取用户输入，将其从美元转换为欧元，并将结果显示在 `TextView` 上。\n\n由于应用程序已准备好测试，用于测试所需的模拟器设置将在下一章中详细介绍。\n\
  \n## 4. 在 Android Studio 中创建 Android 虚拟设备 (AVD)\n\n尽管 Android Studio 的预览面板允许我们看到正在设计的布局，但仍需通过编译和运行整个应用程序来彻底测试其运行情况。可以通过在物理设备上安装并运行\
  \ Android 应用程序，或者在 Android 虚拟设备 (AVD) 模拟器环境中运行来测试 Android 应用程序。在使用 AVD 之前，必须先创建并配置以匹配特定设备模型的规格。在本章中，我们将以\
  \ Pixel 4 手机作为参考示例，创建一个这样一个虚拟设备。\n\n### 4.1 关于 Android 虚拟设备\n\nAVD 是模拟器，允许在无需将应用程序安装到物理\
  \ Android 设备的情况下测试 Android 应用程序。AVD 可以配置为模拟各种硬件功能，包括屏幕尺寸、内存容量以及是否存在摄像头、GPS 导航支持或加速度计等功能。标准\
  \ Android Studio 安装的一部分包含几个模拟器模板，允许为各种设备配置 AVD。可以通过指定处理器类型、内存容量以及屏幕的尺寸和像素密度等属性，创建自定义配置以匹配任何物理\
  \ Android 设备。\n\nAVD 会话可以作为独立窗口出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 AVD 使用 Android\
  \ 虚拟设备管理器（Android Virtual Device Manager）创建和管理，可以使用命令行模式或更具用户友好图形用户界面。创建新 AVD 的第一步是启动\
  \ AVD Manager。这可以通过 Android Studio 环境中点击“设备管理器”（Device Manager）来实现，如图 4-1 所示：\n\n\
  ![](img/as_device_manager_button.jpg)\n\n图 4-1\n\n打开后，管理器将作为工具窗口出现，如图 4-2 所示：\n\n\
  ![](img/as_device_manager_empty.jpg)\n\n图 4-2\n\n如果你是首次安装 Android Studio（而不是升级现有安装），安装程序可能已经创建了一个可用的初始\
  \ AVD，如图 4-3 所示：\n\n![](img/as_device_manager.jpg)\n\n图 4-3\n\n如果系统中存在此 AVD，你可以可以使用它。如果没有\
  \ AVD，或者你想为不同的设备类型创建 AVD，请按照本章步骤操作。要添加新 AVD，点击设备管理器工具栏上的“创建设备...”链接或 `+` 按钮打开虚拟设备配置框，如图\
  \ 4-4 所示：\n\n![](img/as_deviced_select_hardware.jpg)\n\n图 4-4\n\n在对话框中，执行以下步骤创建\
  \ Pixel 4 兼容模拟器：\n\n1. 从类别面板选择“手机”选项以显示可用 AVD 模板。\n2. 选择 `Pixel 4` 设备选项并点击“下一步”。\n\
  3. 在系统镜像屏幕上，选择最新版本的 Android。如果尚未安装镜像，“发布名称”旁边将提供“下载”链接。点击此链接下载并安装系统镜像。如果没有所需的镜像，点击“x86\
  \ 镜像”（如果是运行 Apple 芯片的 Mac 则点击“ARM 镜像”）和“其他镜像”选项卡查看替代列表。\n4. 点击“下一步”继续，并在名称字段中输入描述性名称（例如\
  \ `Pixel 4 API 34`）或接受默认名称。\n5. 点击“完成”创建 AVD。\n6. 如果以后需要对 AVD 进行修改，重新打开设备管理器，从列表中选择\
  \ AVD，并点击操作列中的笔图标编辑设置。\n\n### 4.2 启动模拟器\n\n要测试新创建的 AVD 模拟器，从设备管理器中选择模拟器并点击操作列中的启动按钮（三角形）。模拟器将嵌入到\
  \ Android Studio 主窗口中并开始启动过程。模拟器启动所需的时间取决于 AVD 及其运行系统的配置：\n\n![](img/as_avd_running.jpg)\n\
  \n图 4-5\n\n要隐藏和显示模拟器工具窗口，点击“运行设备”工具窗口按钮（如上方 A 所示）。点击标签旁边的“x”关闭按钮（B）退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签表示。例如，图\
  \ 4-6 显示了一个具有两个模拟器会话的工具窗口。\n\n\n\n\n\n![](img/as_two_avds_running.jpg)\n\n\n\n**图\
  \ 4-6**\n\n点击相应的标签页可以在会话之间切换。\n\n虽然模拟器可能默认以竖屏方向显示，但可以更改此选项和其他默认选项。在 `Device Manager`（设备管理器）中，选择新的\
  \ `Pixel 4` 条目，并点击设备行 `Actions`（操作）列中的铅笔图标。在配置屏幕中，找到 `Startup orientation`（启动方向）部分并更改方向设置。退出并重启模拟器会话以使此更改生效。关于模拟器的更多详细信息，请参阅下一章节：“使用和配置\
  \ Android Studio AVD 模拟器”。\n\n为了在本节章的后续部分节省时间，请在继续之前保持模拟器运行。\n\n## 4.3 在 AVD 中运行应用程序\n\
  \n配置好 AVD 模拟器后，之前章节中创建的示例应用程序 `AndroidSample` 现在可以编译并运行了。将 `AndroidSample` 项目加载到\
  \ `Android Studio` 后，确保新创建的 `Pixel 4` AVD 显示在设备菜单中（如下方 图 4-7 标记 A 所示），然后点击由三角形表示的运行按钮\
  \ (B)、选择 `Run -> Run ‘app’` 菜单选项，或使用键盘快捷键 `Ctrl-R`：\n\n![](img/as_device_and_run_toolbar.jpg)\n\
  \n**图 4-7**\n\n设备菜单 (A) 可用于选择不同的 AVD 实例或物理设备作为运行目标，并并在多个设备上运行应用。该菜单还提供了访问 `Device\
  \ Manager` 以及设备连接配置和故障排除选项 get：\n\n![](img/as_select_run_device.jpg)\n\n**图 4-8**\n\
  \n一旦应用程序安装并运行，第一个 fragment（片段）的用户界面将出现在模拟器中（fragment 是 Android 项目中一个可重用的部分，通常由用户界面布局和一些代码组成，该主题将在后文名为“Android\
  \ Fragment 简介”](#Fragments.xhtml__idTextAnchor712) 的章节中介绍）：\n\n![](img/as_androidsample_running.jpg)\n\
  \n**图 4-9**\n\n一旦运行过程开始，`Run` 工具窗口将会出现。`Run` 工具窗口将在应用程序包安装和启动时显示诊断信息。图 4-10 显示了典型成功启动应用程序时\
  \ `Run` 工具窗口的输出：\n\n![](img/as_logcat.jpg)\n\n**图 4-10**\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供信息以帮助隔离问题原因。\n\
  \n假设应用程序加载到模拟器并按预期运行，我们已经安全地验证了 Android 开发环境已正确安装和配置。在应用运行时，尝试进行货币兑换以验证应用是否按预期工作。\n\
  \n## 4.4 在多个设备上运行\n\n上文的 图 4-8 所示的运行目标菜单包含一个并行在多个模拟器和设备上运行应用程序的选项。选择该选项后，将显示 图 4-11\
  \ 中的对话框，列出系统上配置的 AVD 以及任何连接的物理设备。在点击 `Run` 按钮之前，勾选目标模拟器或设备旁的复选框：\n\n![](img/as_avd_multiple_devices.jpg)\n\
  \n**图 4-11**\n\n点击 `Run` 按钮后，`Android Studio` 将所选模拟器和设备上启动应用。\n\n## 4.5 停止运行的应用程序\n\
  \n要停止运行的应用程序，点击位于主工具栏上的停止按钮，如 图 4-12 所示：\n\n![](img/as_stop_button.jpg)\n\n**图 4-12**\n\
  \n也可以 `Run` 工具窗口终止应用。首先，通过应用运行时变为可窗栏按钮显示 `Run` 工具窗口。一旦 `Run` 工具窗口出现，点击下方 图 4-13\
  \ 中高亮显示的停止按钮：\n\n![](img/as_logcat_stop.jpg)\n\n**图 4-13**\n\n## 4.6 支持深色主题\n\n\
  要测试应用启用深色主题时的行为，请在模拟器运行的 Android 实例中打开 `Settings` 应用，选择 `Display` 类别，并启用 `Dark theme`\
  \ 选项，如 图 4-14 所示：\n\n![](img/as_avd_dark_theme_setting.jpg)\n\n**图 4-14**\n\n启用深色主题后，运行\
  \ `AndroidSample` 应用，注意它显示深色主题，包括黑色背景和按钮上的紫色背景色，如 图 4-15 所示：\n\n![](img/as_androidsample_running_dark.jpg)\n\
  \n**图 4-15**\n\n在继续之前，返回 `Settings` 应用并关闭深色主题。\n\n## 4.7 在单独窗口中运行模拟器\n\n到本章为止，我们仅将模拟器用作嵌入在主\
  \ `Android Studio` 窗口内的工具窗口。模拟器可以配置为在 `Settings` 对话框中的单独窗口中出现，可以通过点击 `IDE` 和 `Project`\
  \ 设置来显示，如 图 4-16 所示：\n\n（注：根据文本上下文隐含了图像 16 的引用）\n\n在 `Settings` 对话框中，在侧边栏中导航到 `Tools\
  \ -> Emulator`，并禁用 `Launch in the Running Devices` 选项：\n\n![](img/as_tool_window.jpg)\n\
  \n**图 4-17**\n\n禁用该选项后，点击 `Apply` 按钮随后点击 `OK` 以提交更改，然后点击 图 4-5 中标记为 B 的按钮退出模拟器会话。\n\
  \n![](img/as_avd_separate_window.jpg)\n\n**图 4-18**\n\n选择独立窗口还是工具窗口取决于个人喜好。如果你希望模拟器在工具窗口中运行，返回设置屏幕并重新启用\
  \ `Launch in the Running Devices` 选项。然而，在提交独立模式之前，请记住 `Running Devices` 工具窗口也可以从主\
  \ `Android Studio` 窗口中分离，这可以通过在工具窗口内点击 图 4-19 所示的按钮来实现：\n\n![](img/as_running_devices_menu.jpg)\n\
  \n**图 4-19**\n\n在选项菜单中，选择 `View Mode -> Float` 将工具窗口从 `Android Studio` 窗口分离：\n\n\
  ![](img/as_tool_window_float.jpg)\n\n**图 4-20**\n\n要重新停靠 `Running Devices` 工具窗口，点击\
  \ 图 4-21 所示的 `Dock` 按钮：\n\n![](img/as_tool_window_dock_button.jpg)\n\n**图 4-21**\n\
  \n## 4.8 移除设备框\n\n模拟器可以配置为显示或不显示设备框。要更改设置，退出模拟器，打开 `Device Manager`，选择列表中的 AVD，并点击\
  \ 图 4-22 中箭头所示的菜单按钮：\n\n![](img/as_device_manager_avd_menu.jpg)\n\n**图 4-22**\n\n\
  选择 `Edit` 选项，并在设置屏幕定位并关闭 `Enable device frame` 选项，然后点击 `Finish` 按钮：\n\n![](img/as_avd_device_frame_option.jpg)\n\
  \n**图 4-23**\n\n一旦禁用了设备框，模拟器下次启动时将如 图 4-24 所示：\n\n![](img/as_avd_no_device_frame.jpg)\n\
  \n**图 4-24**\n\n## 4.9 总结\n\n\n\n\n\n典型的应用开发流程遵循测试环境中的“编码、编译和运行”循环。Android 应用程序可以在物理\
  \ Android 设备或 Android 虚拟设备（`AVD`）模拟器上进行测试。`AVD` 使用 `Android Studio Device Manager`\
  \ 工具创建和管理，该工具可以作为命令行工具使用，也可以通过图形用户界面使用。在创建 `AVD` 以模拟特定的 Android 设备模型时，虚拟设备的配置应具有与物理设备匹配的硬件规格。\n\
  \n`AVD` 模拟器会话可以独立窗口的形式显示，也可以嵌入到 Android Studio 主用户界面中。\n\n## 5 使用和配置 Android Studio\
  \ AVD 模拟器\n\n在下一章探索在物理 Android 设备上进行测试之前，本章将花费一些时间概述 Android Studio AVD 模拟器，并突出许多可用的配置功能，这些功能可以在独立模式和工具窗口模式下自定义环境。\n\
  \n## 5.1 模拟器环境\n\n当以独立模式启动时，模拟器在加载过程中会显示一个初始启动屏幕。加载完成后，会出现主模拟器窗口，其中包含所选设备类型的表示（在图\
  \ 5-1 中，这是一个 Pixel 4 设备）：\n\n![](img/avd_running_standalone.jpg)\n\n图 5-1\n\n位于窗口右边缘的工具栏提供了快速访问模拟器控制和配置选项的通道。\n\
  \n## 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为相关的系列选项。\n\n![](img/as_3.5_avd_toolbar.jpg)\n\
  \n图 5-2\n\n工具栏中的每个按钮都关联有一个键盘快捷键，可以通过将鼠标指针悬停在按钮上并等待工具提示出现，或者通过扩展控制面板的帮助选项来识别。\n\n\
  尽管工具栏中包含许多选项是自言易懂的，但为了完整起见，将对每个选项进行介绍：\n\n*   **退出 / 最小化 (Exit / Minimize)** – 工具栏最顶部的“x”按钮选中后会退出模拟器会话，而“-””选项则会将整个窗口最小化。\n\
  *   **电源 (Power)** – 电源按钮模拟物理 Android 设备上的硬件电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。按住此按钮将启动设备的“关机”请求序列。\n\
  *   **音量增大 / 减小 (Volume Up / Down)** – 用于控制模拟器环境内播放音量的两个按钮。\n*   **左转/右转 (Rotate\
  \ Left/Right)** – 模拟的设备在竖屏和横屏方向之间旋转。\n*   **截图 (Take Screenshot)** – 对设备屏幕上显示的内容截图。捕获的图像存储在扩展控制面板设置屏幕中指定的位置，本章稍后会对此进行概述。\n\
  *   **缩放模式 (Zoom Mode)** – 此按钮切换进入和退出缩放模式，细节将在本章稍后部分介绍。\n*   **返回 (Back)** – 执行标准的\
  \ Android“返回”导航回到上一个屏幕。\n*   **主页 (Home)** – 显示设备的主屏幕。\n*   **概览 (Overview)** –\
  \ 模拟标准的 Android“概览”导航，显示设备上正在运行的应用程序。\n*   **折叠设备 (Fold Device)** – 模拟折叠设备的折叠和展开。此选项仅在模拟器运行折叠设备系统镜像时才可用。\n\
  *   **扩展控制 (Extended Controls)** – 显示扩展控制面板，允许配置如模拟位置和电话活动、电池强度、蜂窝网络类型和指纹识别等选项。\n\
  \n## 5.3 在缩放模式下工作\n\n位于模拟器工具栏的缩放按钮切换进入和退出缩放模式。当缩放模式激活时，工具栏按钮处于按下状态，鼠标指针悬停在设备屏幕上将显示为放大镜。点击左键将导致显示相对于屏幕上的选定点放大，重复点击将增加缩放级别。相反，点击右键将降低缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮时视图将缩放到该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条来移动屏幕可视区域。\n\
  \n## 5.4 调整模拟器窗口大小\n\n模拟器窗口的大小（以及设备相应的表示）可以通过启用缩放模式，并在窗口的任何角或边上点击和拖动来随时更改。\n\n##\
  \ 5.5 扩展控制选项\n\n扩展控制工具栏按钮显示如图 5-3 所示的面板。默认情况下将显示位置设置。从左侧面板选择不同的类别将显示相应的控制组：\n\n\
  ![](img/as_avd_extended_controls.jpg)\n\n图 5-3\n\n### 5.5.1 位置 (Location)\n\n位置控制允许以十进制或六进制坐标将模拟位置信息发送到模拟器。位置信息可以是单个位置的形式，也可以代表设备移动的点序列，后者通过\
  \ GPS 交换 (`GPX`) 或 Keyhole 标记语言 (`KML`) 格式的文件提供。或者，也可以使用集成的 Google Maps 面板视觉化地选择单点或旅行路线。\n\
  \n### 5.5.2 显示 (Displays)\n\n除了模拟器屏幕内显示的主显示外，`Displays` 选项允许在同一实例中运行额外的显示器。这对于测试双屏设备（如\
  \ Microsoft Surface Duo）非常有用。这些额外的屏幕可以配置为任何大小，并出现在与主屏幕相同的模拟器窗口中。\n\n### 5.5.3 蜂窝\
  \ (Cellular)\n\n可以在蜂窝设置内更改模拟的蜂窝连接类型。除了各种语音和数据场景（如漫游和拒绝访问）外，还有选项可以模拟不同的网络类型（CSM、EDGE、HSDPA\
  \ 等）。\n\n### 5.5.4 电池 (Battery)\n\n可以在扩展控制屏幕上模拟各种电池状态和充电条件，包括电池电量、电池健康以及是否连接了交流\
  \ 充电器。\n\n### 5.5.5 摄像头 (Camera)\n\n当摄像头激活时，模拟器会模拟一个 3D 场景。它表现为虚拟建筑内部，您可以在录视频或拍照之前按住\
  \ `Option` 键（Windows 上为 `Alt`）并使用鼠标指针和键盘进行导航。此扩展选项允许上传不同的图像并在虚拟环境中显示。\n\n### 5.5.6\
  \ 电话 (Phone)\n\n电话扩展为模拟器提供了两个简单实用的模拟。第一个选项模拟来自指定电话的入电。这在测试应用程序如何处理高级中断时特别有用。\n\n\
  第二个选项允许在模拟器会话中模拟接收短信。与现实世界一样，这些消息将出现在消息应用中，并在模拟器内触发标准通知。\n\n### 5.5.7 方向键 (Directional\
  \ Pad)\n\n方向键 (`D-Pad`) 是内置在 Android 设备中或外部连接（如游戏控制器）的另一组额外控件，提供方向控制（左、右、上、下）。方向键设置允许在模拟器中模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦风 (Microphone)\n\n\n\n\n\n麦克风设置允许启用麦克风，并模拟虚拟耳机和麦克风连接。此外还提供了一个按钮，用于在模拟器上启动语音助手。\n\
  \n### 5.5.9 指纹\n\n许多 Android 设备现在都配备了内置指纹检测硬件。`AVD` 模拟器使得无需在包含指纹传感器的物理设备上测试应用即可进行指纹身份验证测试。有关在模拟器中配置指纹测试的细节将在本章后续部分介绍。\n\
  \n### 5.5.10 虚拟传感器\n\n虚拟传感器选项允许模拟加速度计和磁力计以模拟设备的物理运动效果，例如通过 `yaw`（偏航）、`pitch`（俯仰）和\
  \ `roll`（滚滚）设置模拟旋转、移动和倾斜。\n\n### 5.5.11 快照\n\n快照包含当前运行的 `AVD` 会话的状态，可以保存并快速恢复，从而使模拟器轻松返回精确状态。快照将在本章稍后部分介绍。\n\
  \n### 5.5.12 录制与回放\n\n允许对模拟器屏幕和音频进行录制并保存为 `WebM` 或 `animated GIF` 格式。\n\n### 5.5.13\
  \ Google Play\n\n如果模拟器运行的是安装了 `Google Play Services` 的 Android 版本，此选项将显示当前的 `Google\
  \ Play` 版本。它还提供了将模拟器更新到最新版本的选项。\n\n### 5.5.14 设置\n\n设置面板提供了一组配置选项。使用此面板为工具栏和扩展控制面板选择较深颜色的主题，指定保存截图的文件系统位置，配置\
  \ `OpenGL` 支持级别，并配置模拟器窗口显示在桌面上其他窗口之上。\n\n### 5.5.15 帮助\n\n帮助屏幕包含三个子面板，其中列出了键盘快捷键列表、访问模拟器在线文档的链接、报告文件错误并发送反馈的链接，以及模拟器版本信息。\n\
  \n### 5.6 使用快照\n\n当模拟器首次启动时，它会执行冷启动，就像物理 Android 设备开机一样。由于需要加载操作系统并启动所有后台进程，此冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器时都要经过这一过程，系统被配置为每次退出时自动保存模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将加载到内存中，并从上次离开的地方继续执行，允许模拟器在冷启动完成所需的一部分时间内重启。\n\
  \n扩展控制面板的 `Snapshots` 屏幕可以在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。在屏幕中，可以使用\
  \ `Take Snapshot` 按钮（在图 5-4 中标记为 `A`）拍摄快照。要恢复现有快照，从列表 (`B`) 中选择它并点击屏幕底部的运行按钮 (`C`)。还提供了编辑\
  \ (`D`) 快照名称和描述以及删除 (`E`) 当前选中快照的选项：\n\n![](img/as_avd_snapshots.jpg)\n\n图 5-4\n\
  \n你还可以通过从主工具栏的运行目标菜单中选择，决定使用冷启动、最近的快速启动快照或之前的快照来启动模拟器，如图图 5-5 所示：\n\n![](img/as_avd_run_snapshot.jpg)\n\
  \n图 5-5\n\n### 5.7 配置指纹模拟\n\n模拟器允许配置多达 10 个模拟指纹，并用于测试 Android 应用中的指纹身份验证。配置模拟指纹始于启动模拟器、打开\
  \ `Settings` 应用并选择 `Security` 选项。\n\n在 `Security` 设置屏幕中，选择 `fingerprint` 选项。在弹出的信息屏幕上，点击\
  \ `Next` 按钮进入 `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置备份屏幕解锁方法（如 `PIN`）。输入并确认合适的 `PIN`，并通过接受默认通知选项完成\
  \ `PIN` 输入过程。\n\n继续通过剩余屏幕，直到 `Settings` 应用请求在传感器上指纹。此时，显示扩展控制对话框，在左侧面板中选择 `Fingerprint`\
  \ 类别，并确保主设置面板中选中了 `Finger 1`：\n\n![](img/as_avd_touch_sensor.jpg)\n\n图 5-6\n\n点击\
  \ `Touch Sensor` 按钮以模拟 `Finger 1` 触摸指纹传感器。模拟器将报告成功添加指纹：\n\n![](img/as_avd_fingerprint_added.jpg)\n\
  \n图 5-7\n\n要添加更多指纹，在再次点击 `Touch Sensor` 按钮之前，点击 `Add Another` 按钮并在扩展控制面板菜单中选择另一个手指。\n\
  \n### 5.8 工具窗口模式下的模拟器\n\n如上一章所述（“在 Android Studio 中创建 Android 虚拟设备 (AVD)”），Android\
  \ Studio 可以配置为在嵌入式工具窗口中启动模拟器，使其不会显示在独立窗口中。在在此模式下运行时，工具栏中提供了与独立模式下相同的控件，如图图 5-8 所示：\n\
  \n![](img/avd_devices_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行的操作如下（详情与独立模式相同）：\n\n\
  - 电源\n- 音量增大\n- 音量减小\n- 向左旋转\n- 向右旋转\n- 返回\n- 桌面\n- 概述\n- 截图\n- 快照\n- 扩展控制\n\n###\
  \ 5.9 创建可缩放模拟器\n\n除了匹配特定设备模型的模拟器外，Android Studio 还提供了一个可缩放的 `AVD`，允许你在手机、平板电脑和折叠屏尺寸之间切换。要创建可缩放模拟器，打开\
  \ `Device Manager` 并点击 `+` 按钮。接下来，选择如图图 5-9 所示的 `Resizable` 设备定义，并按照通常步骤创建新的 `AVD`：\n\
  \n![](img/create_resizable.jpg)\n\n图 5-9\n\n当你在工具窗口在新模拟器上运行应用时，工具栏中会出现 `Display`\
  \ 模式，允许你切换模拟器配置，如图图 5-10 所示：\n\n![](img/as_avd_fold_button.jpg)\n\n图 5-10\n\n如果模拟器在独立模式下运行，可以在侧工具栏中找到\
  \ `Display` 模式选项，如下：\n\n![](img/avd_resizable_menu.jpg)\n\n图 5-11\n\n一旦选择了折叠屏显示模式，可以使用\
  \ `Change posture` 菜单在打开、关闭和半折叠状态下测试应用：\n\n![](img/as_avd_posture.jpg)\n\n图 5-12\n\
  \n### 5.10 总结\n\nAndroid Studio 包含一个 Android 虚拟设备模拟器环境，旨在使无需在物理 Android 设备上运行即可测试测试应用程序。本章对模拟器进行了简要介绍，并强调了用于配置和自定义环境以模拟不同测试条件的关键功能。\n\
  \n## 6 Android Studio 用户界面导览\n\n虽然急切想运行上一章中创建的示例应用，但它涉及 Android Studio 用户界面的某些方面，最好在此之前对其进行描述。\n\
  \n\n\n\nAndroid Studio 是一个强大且功能丰富的开发环境，在很大程度上，它的使用是非常直观的。尽管如此，现在花时间熟悉 Android Studio\
  \ 用户界面的布局和结构，将缩短书中书中后续章节的学习曲线。基于此考虑，本章将提供 Android Studio 环境中各种区域和组件的概览。\n\n# 6.1\
  \ 欢迎界面\n\n欢迎界面（图 6-1）会在 Android Studio 运行但当前没有打开任何项目时显示（可以通过选择 `File` -> `Close\
  \ Project` 菜单选项随时关闭已打开的项目）。如果 Android Studio 在项目仍打开的状态下退出，该工具在下次启动时将跳过欢迎界面，自动打开之前活动的项目。\n\
  \n![](img/as_iguana_welcome2.jpg)\n\n图 6-1\n\n除了最近项目列表外，欢迎界面还提供了执行各项任务的选项，例如打开和创建项目，并可以访问当前受版本控制的项目。此外，`Customize`（自定义）屏幕提供了更改\
  \ IDE 和编辑器使用的主题和字体设置的选项。可以使用 `Plugins`（插件）选项查看、安装和管理 Android Studio 插件。\n\n当最近项目列表替换\
  \ `More Actions`（更多操作）链接时，可以通过选择 `More Actions` 链接或使用图 6-2 中显示的菜单可用其他选项：\n\n![](img/as_welcome_menu.jpg)\n\
  \n图 6-2\n\n# 6.2 菜单栏\n\n当创建新项目或打开现有项目时，将显示 Android Studio 主窗口。当同时打开多个项目时，每个项目都将分配自己的主窗口。窗口的精确配置取决于\
  \ Android Studio 运行的操作系统，以及项目上次打开时显示的工具和面板。例如，主菜单栏的外观将根据宿主操作系统而有所不同。在 macOS 上，Android\
  \ Studio 遵循将菜单栏放置在桌面顶部边缘的标准惯例，如图 6-3 所示：\n\n![](img/as_menu_bar.jpg)\n\n图 6-3\n\n\
  然而，当 Android Studio 在 Windows 或 Linux 上运行时，可以通过图 6-4 中高亮的按钮访问主菜单：\n\n![](img/as_windows_main_menu.jpg)\n\
  \n图 6-4\n\n# 6.3 主窗口\n\n一旦打开项目，Android Studio 主窗口通常类似于图 6-5 所示：\n\n![](img/as_main_window1.jpg)\n\
  \n图 6-5\n\n主窗口的各种元素可以总结如下：\n\n**A – 工具栏（Toolbar）** – 一组用于频繁执行操作的快捷键。工具栏按钮提供了快速访问特定某组菜单栏操作的通道。可以通过右键点击工具栏并选择\
  \ `Customize Toolbar…`（自定义工具栏…）菜单选项来自定义工具栏。图 6-6 所示的工具栏菜单提供了一种方便执行任务的方法，例如创建和打开项目以及在多个项目打开时在窗口之间切换：\n\
  \n![](img/as_project_switch_menu.jpg)\n\n图 6-6\n\n**B – 导航栏（Navigation Bar）** –\
  \ 导航栏提供了在组成项目的文件和文件夹之间移动的方便方法。点击导航栏中的元素将弹出一个菜单，列出该位置的子文件夹和文件以供选择。同样，点击类名将显示列出该类包含方法的菜单：\n\
  \n![](img/as_navigation_menu.jpg)\n\n图 6-7\n\n从列表中选择一个方法将跳转到代码编辑器中的对应位置。你可以使用 `View`\
  \ -> `Appearance` -> `Navigation Bar` 菜单选项来隐藏、显示和更改此栏的位置。\n\n**C – 编辑器窗口（Editor\
  \ Window）** – 编辑器窗口显示开发者当前正在工作的文件。当打开了多个文件时，每个文件由位于编辑器顶部边缘的标签表示，如图 6-8 所示：\n\n![](img/as_menu_bar_java.jpg)\n\
  \n图 6-8\n\n**D – 状态栏（Status Bar）** – 状态栏显示有关项目和 Android Studio 活动的信息性消息。悬停在状态栏项目上将显示该字段的描述。许多字段是交互式的，允许用户点击以执行任务或获取更详细的状态信息。\n\
  \n![](img/as_status_bar.jpg)\n\n图 6-9\n\n状态栏中显示的小部件可以使用 `View` -> `Appearance` ->\
  \ `Status Bar Widgets`（状态栏组件）菜单进行更改。\n\n**E – 项目工具窗口（Project Tool Window）** – 项目工具窗口提供了项目文件结构的分级概述，允许对特定文件和文件夹进行导航。可以使用工具栏以几种不同的方式显示项目。默认设置是\
  \ `Android` 视图，这是本书其余部分主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中许多可用工具之一。\n\n# 6.4\
  \ 工具窗口（Tool Windows）\n\n除了项目视图工具窗口外，Android Studio 还包含许多其他窗口，这些窗口在启用后显示为位于主窗口左右边缘的工具窗口栏，并包含显示和隐藏每个窗口的按钮。图\
  \ 6-10 显示了典型的工具窗口配置，但按钮及其布局可能会根据你的 Android Studio 安装情况有所不同。\n\n![](img/as_tool_window_bars.jpg)\n\
  \n图 6-10\n\n点击按钮将显示相应的工具窗口，再次点击则将隐藏窗口。按钮在工具窗口栏中的位置指示了窗口将出现在哪侧。这些位置可以通过点击并拖拽按钮到不同位置来更改。\n\
  \nAndroid Studio 提供了大量的工具窗口，最常用的如下：\n\n**项目（A）** – 项目视图提供了项目结构的概述，允许在文件之间进行快速导航。通常，双击项目视图中的文件将导致该文件加载到相应的编辑工具中。\n\
  \n**资源管理器（B）** – 用于添加和管理项目中的资源和资产的工具，例如图像、颜色和布局文件。\n\n**更多工具窗口（C）** – 显示包含当前未在工具窗口栏中显示的额外工具窗口的菜单。从此菜单选择工具窗口后，它将作为工具窗口栏中的按钮出现。\n\
  \n**运行（D）** – 运行窗口在应用程序当前运行时可用，并提供运行结果的视图以及停止或重启运行进程的选项。如果应用程序无法在设备或模拟器上安装和运行，此窗口通常会提供有关问题的诊断信息。\n\
  \n**Logcat（E）** – Logcat 工具窗口提供了访问运行应用程序的监控日志输出的权限，并提供了对应用程序截图、视频以及停止和重启进程的选项。\n\
  \n**问题（F）** – 查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带你跳转到问题所在的文件和位置。\n\n**App Quality Insights（G）**\
  \ – 提供访问云端 Firebase 质量和崩溃分析平台的权限。\n\n\n\n\n- **终端 (H)** – 提供对运行 Android Studio 的系统上的终端窗口的访问。在\
  \ Windows 系统上，这是命令提示符（Command Prompt）界面，而在 Linux 和 macOS 系统上，它表现为终端（Terminal）提示符。\n\
  - **版本控制 (I)** - 当项目文件受源代码版本控制管理时，使用此工具窗口访问 Git 仓库和代码更改历史。\n- **通知 (J)** - 当项目文件受源代码版本控制管理时，使用此工具窗口访问\
  \ Git 仓库和代码更改历史。 \n- **Gradle (K)** – Gradle 工具窗口提供了构成项目构建配置的 Gradle 任务视图。该窗口列出了将项目各种元素编译为可执行应用程序的任务。右键点击顶层\
  \ Gradle 任务并选择 `Open Gradle Config`（打开 Gradle 配置）菜单选项，可以将当前项目的 Gradle 构建文件加载到编辑器中。本书的后部分部分将详细介绍\
  \ Gradle。\n- **设备管理器 (L)** - 提供对设备管理器（Device Manager）工具窗口的访问，可以在其中添加、删除和管理物理 Android\
  \ 设备连接以及模拟器。\n- **运行中的设备 (M)** - 如果已启用了在工具窗口中运行模拟器的选项（如“在 Android Studio 中创建 Android\
  \ 虚拟设备 (AVD)” 章节所述），则该处包含 AVD 模拟器。\n- **应用检查 (App Inspection)** - 提供对数据库和后台任务检查器的访问。数据库检查器允许你在应用运行时检查、查询和修改应用数据库。后台任务检查器允许对使用\
  \ `WorkManager` 创建的后台工作任务进行监控和管理。\n- **书签 (Bookmarks)** – 书签工具窗口快速访问已标记的文件和代码行。例如，在项目视图中右键点击文件可以访问\
  \ `Add to Bookmarks`（添加书签）菜单选项。同样，您可以通过将光标移动到源文件的某行并按 `F11` 键（macOS 上为 `F3`）为该行书签。所有书签项都可以通过工具窗口访问。\n\
  - **构建 (Build)** - 构建工具窗口显示项目编译和打包过程中构建过程的信息，以及遇到的任何错误详细信息。\n- **构建变体 (Build Variants)**\
  \ – 构建变体工具窗口提供了一种为当前应用程序项目配置不同构建目标快速方法（例如，为应用程序的调试和发布版本构建不同的构建，或针对不同设备类别构建多个构建）。\n\
  - **设备文件管理器 (Device File Explorer)** – 通过 `View -> Tool Windows -> Device File Explorer`（视图\
  \ -> 工具窗口 -> 设备文件管理器）菜单可用，此工具窗口直接访问当前连接的 Android 设备或模拟器的文件系统，允许浏览系统并将文件复制到本地文件系统。\n\
  - **布局检查器 (Layout Inspector)** - 提供构成用户界面布局的组件层次的可视化 3D 渲染。\n- **结构 (Structure)**\
  \ – 结构工具提供当前编辑器源文件结构的高级视图。此信息包含了文件中的类、方法和变量等项列表。从结构列表中选择一个项将带您进入编辑器窗口中源文件中的对应位置。\n\
  - **TODO** – 如名所示，此工具提供了一个查看项目中尚未完成的项的地方。Android Studio 通过扫描构成项目的源文件并查找匹配指定 `TODO`\
  \ 模式的注释来编译此列表。可以通过打开 `Settings`（设置）对话框并导航到 `Editor`（编辑器）下的 `TODO` 条目来查看和更改这些模式。\n\
  \n## 6.5 工具窗口菜单\n\n每个工具窗口在顶部边缘都有自己的工具栏。这些工具栏中的菜单按钮随工具而异，但所有工具窗口都包含一个 `Options`（选项）菜单（在图\
  \ 6-11 中标记为 A）：\n\n![](img/as_tool_window_buttons.jpg)\n\n图 6-11\n\n`Options` 菜单允许更改窗口的各个方面。例如图\
  \ 6-12 显示了 `Project`（项目）工具窗口的 `Options` 菜单。可以使用 `Settings`（设置）取消窗口锁定并允许其浮动在 Android\
  \ Studio 主窗口边界之外，以及移动和调整工具面板的大小：\n\n![](img/as_tool_window_menu.jpg)\n\n图 6-12\n\
  \n所有工具窗口在工具栏上还包含一个位于右远的按钮（在上方图 6-11 中标记为 B），提供了隐藏工具窗口的额外方法。可以通过点击该窗口使其获得焦点然后输入搜索词来对工具窗口内的项进行搜索（例如\
  \ `Project` 工具窗口中的文件名）。窗口的工具栏中会出现一个搜索框，并高亮显示匹配的项。\n\n## 6.6 Android Studio 键盘快捷键\n\
  \nAndroid Studio 包含了许多键盘快捷键，以便在执行常用任务时节省时间。可以在 Android Studio 项目窗口内选择 `Help -> Keyboard\
  \ Shortcuts PDF`（帮助 -> 键盘快捷键 PDF）菜单选项查看并打印完整的键盘快捷键映射列表。您还可以通过打开 `Settings`（设置）对话框并点击\
  \ `Keymap`（键映射）条目来列出和修改键盘快捷键，如下图 6-13 所示：\n\n![](img/as_keymap.jpg)\n\n图 6-13\n\n\
  ## 6.7 切换器和最近文件导航\n\n在 Android Studio 主窗口内导航的另一种实用机制是使用 `Switcher`（切换器）。通过 `Ctrl-Tab`\
  \ 快捷键访问的切换器是一个列出工具窗口和已打开文件的面板（图 6-14）。\n\n![](img/as_switcher.jpg)\n\n图 6-14\n\n\
  一旦显示，只要按住 `Ctrl` 键，切换器就会可见。在按住 `Ctrl` 键的同时反复点击 `Tab` 键可以在各个选项之间循环，释放 `Ctrl` 键将选中高亮项。\n\
  \n除了 `Switcher`，`Recent Files`（最近文件）面板提供了最近打开文件的导航（图 6-15）。可以使用 `Ctrl-E` 快捷键（macOS\
  \ 上为 `Cmd-E`）访问。一旦显示，可以使用鼠标指针选择选项，或使用键盘箭头键滚动。按下 `Enter` 键将选中高亮项：\n\n![](img/as_recent_files.jpg)\n\
  \n图 6-15\n\n## 6.8 更改 Android Studio 主题\n\n可以使用 `Settings` 对话框更改 Android Studio\
  \ 环境的主题。一旦显示设置对话框，在左侧面板中选择 `Appearance & Behavior`（外观与行为）选项，然后选择 `Appearance`（外观）。然后，更改\
  \ `Theme`（主题）菜单的设置，最后点击 `OK` 按钮。可用主题取决于平台，但通常包括 `Light`、`IntelliJ`、`Windows`、`High\
  \ Contrast` 和 `Darcula` 等选项。图 6-16 显示了选择 `Dark` 主题的主窗口示例：\n\n![](img/as_dark_theme.jpg)\n\
  \n图 6-16\n\n要将 Android Studio 主题与操作系统同步，请启用 `Sync with OS`（与操作系统同步）选项并使用下拉菜单控制每种模式使用的主题：\n\
  \n![](img/as_theme_sync.jpg)\n\n图 6-17\n\n## 6.9 总结\n\nAndroid Studio 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配了自己的主窗口，主窗口反过来包含菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口。工具窗口出现在主窗口侧面。\n\
  \n\n\n\n\n在 Android Studio 中，极少数的操作是无法通过快捷键触发的。你可以随时从 Android Studio 主窗口访问默认快捷键的键位映射。\n\
  \n## 7. 在实体 Android 设备上测试 Android Studio 应用\n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现许多功能，但在实体\
  \ Android 设备上进行真实世界中的应用测试是不可替代的，而且某些 Android 特性仅在实体 Android 设备上可用。\n\n与 AVD 实例和已连接的\
  \ Android 设备之间的通信均由 Android 调试桥 (ADB) 处理。本章将解释如何配置 `adb` 环境，以便在基于 macOS、Windows\
  \ 和 Linux 的系统上对 Android 设备进行应用测试。\n\n## 7.1 Android 调试桥 (ADB) 概述\n\n`ADB` 的主要目的是促进开发系统（在此例中为\
  \ Android Studio）与 AVD 模拟器以及 Android 设备之间的交互，以运行和调试应用程序。`ADB` 允许你通过 WiFi 或 USB 数据线连接到设备。\n\
  \n`ADB` 由一个客户端、一个运行在开发系统后台的服务器进程，以及一个运行在 AVD 或实体 Android 设备（如手机和平板）上的守护进程（daemon）组成。\n\
  \n`ADB` 客户端可以有多种形式。例如，Android SDK 的 `platform-tools` 子目录下提供了一个名为 `adb` 的命令行工具作为客户端。同样，Android\
  \ Studio 也拥有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用 `devices` 命令行参数列出活跃的虚拟或实体设备。以下命令输出表示系统中存在一个\
  \ AVD，但没有实体设备：\n\n```\n$ adb devices\nList of devices attached\nemulator-5554 device\n\
  ```\n\n## 7.2 在 Android 设备上启用 USB 调试 ADB\n\n在 `ADB` 连接到 Android 设备之前，必须配置该设备以允许连接。在运行\
  \ Android 6.0 或更高版本的手机和平板电脑设备上，实现此目的的步骤如下：\n\n1. 打开设备上的 `Settings`（设置）应用并选择 `About\
  \ tablet`（关于平板）或 `About phone`（关于手机）选项（在某些 Android 版本中，可以在 `Settings` 应用的 `System`\
  \ 页面找到它）。\n2. 在 `About`（关于）屏幕上，向下滚动到 `Build number`（编译号）字段并连续点击七次，直到消息显示开发者模式已启用。如果\
  \ `About` 屏幕上没有列出 `Build number`，可以通过 `Software information`（软件信息）选项找到。或者，如果可以展开列表中的\
  \ `Advanced`（高级）部分。\n\n![](img/as_3.2_build_number.jpg)\n图 7-1\n3. 返回主 `Settings`\
  \ 屏幕，注意出现名为 `Developer options`（开发者选项）的新选项（在较新版本的 Android 中，此选项被列在 `System` 设置屏幕上）。选择此选项，并在生成的屏幕上找到如图\
  \ 7-2 所示的 `USB debugging`（USB 调试）选项：\n\n![](img/android_12_enable_debugging.jpg)\n\
  图 7-2\n4. 启用 `USB debugging` 选项并在请求确认时点击 `Allow`（允许）按钮。\n\n如果你使用的是三星 Galaxy 设备，可能需要在启用调试选项之前在\
  \ `Settings` 应用中关闭 `Auto Blocker`（自动锁定）功能。\n\n现在设备已配置为接受通过 USB 连接来自开发系统上 `adb` 的调试连接。剩下的工作是配置开发系统以便在设备连接时检测到它。虽然这是一个简单的过程，但步骤取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。注意，以下步骤假设 Android SDK `platform-tools` 目录已包含在系统的 `PATH`\
  \ 环境变量，这在“设置 Android Studio 开发环境”章节中有描述。\n\n### 7.2.1 macOS ADB 配置\n\n要在 macOS 系统上配置\
  \ `ADB` 环境，请使用 USB 线将设备连接到计算机系统，打开终端窗口并执行以下命令以重启 `adb` 服务器：\n\n```\n$ adb kill-server\n\
  $ adb start-server\n* daemon not running. starting it now on port 5037 *\n* daemon\
  \ started successfully *\n```\n\n一旦服务器成功运行，执行以下命令验证设备是否已检测到：\n\n```\n$ adb devices\n\
  List of devices attached\n74CE000600000001 offline\n```\n\n如果设备被列为 `offline`（离线），请查看\
  \ Android 设备并检查图 7-3 所示的请求 `Allow USB debugging` 权限的对话框。在点击 OK 之前，勾选 `Always allow\
  \ from this computer`（始终允许来自此计算机）旁边的选项。\n\n![](img/Image2856.jpg)\n图 7-3\n\n现在重复\
  \ `adb devices` 命令应该会将设备列为可用：\n\n```\nList of devices attached\n015d41d4454bf80c\
  \ device\n```\n\n如果设备未列出，请尝试注销并重新登录 macOS 桌面，或者重启系统。\n\n### 7.2.2 Windows ADB 配置\n\
  \n配置基于 Windows 的开发系统使用 `ADB` 连接到 Android 设备的第一步是在系统上安装相应的 USB 驱动程序。要安装的 USB 驱动取决于\
  \ Android 设备的型号。如果你有 Pixel 手机等 Google 设备，则需要在 Windows 系统上安装并配置 `Google USB Driver`\
  \ 包。实现此目的的详细步骤列在以下网页上：\n\n[`developer.android.com/sdk/win-usb.html`](https://developer.android.com/sdk/win-usb.html)\n\
  \n对于不支持 Google USB 驱动的 Android 设备，需要下载设备制造商提供的驱动程序。可以在此处获取驱动列表及安装信息：\n\n[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n驱动程序安装且设备现在识别为正确类型后，打开命令提示符窗口并执行以下命令：\n\n```\nadb devices\n```\n\n该命令应输出有关连接设备的信息，如下：\n\
  \n```\nList of devices attached\n01906 offline\n```\n\n如果设备被列为 `offline` 或 `unauthorized`（未授权），请查看设备屏幕并检查图\
  \ 7-3 所示的请求 `Allow USB debugging` 权限的对话框。在点击 OK 之前，勾选 `Always allow from this computer`（始终允许来自此计算机）旁边的选项。重复\
  \ `adb devices` 命令现在会将设备列为就绪：\n\n```\nList of devices attached\n01906 device\n```\n\
  \n如果设备未列出，请执行以下命令重启 ADB 服务器：\n\n```\nadb kill-server\nadb start-server\n```\n\n\
  如果设备仍然未列出，尝试执行以下命令：\n\n```\nandroid update adb\n```\n\n注意，可能还需要重启系统。\n\n### 7.2.3\
  \ Linux ADB 配置\n\n在本章中，我们再次以 Ubuntu Linux 为例，在 Linux 上配置 `adb` 连接到实体设备。\n\n在 Ubuntu\
  \ Linux 上进行实体设备测试需要安装名为 `android-tools-adb` 的软件包，这要求 Android Studio 用户是 `plugdev`\
  \ 组的成员。这是大多数 Ubuntu 版本中用户账户的默认设置，可以通过运行 `id` 命令进行验证。如果没有列出 `plugdev` 组，运行以下命令将您的账户添加到组组：\n\
  \n```\nsudo usermod -aG plugdev $LOGNAME\n```\n\n满足组成员要求后，可以通过执行以下命令安装 `android-tools-adb`\
  \ 软件包：\n\n```\nsudo apt-get install android-tools-adb\n```\n\n\n\n\n完成上述更改后，重启 Ubuntu\
  \ 系统。系统重启后，打开终端窗口，启动 `adb` 服务器，并检查已连接设备列表：\n\n```\n$ adb start-server\n* daemon\
  \ not running. starting it now on port 5037 *\n* daemon started successfully *\n\
  $ adb devices\n```\n已连接设备列表\n`015d41d4454bf80c offline`\n\n如果设备显示为 `offline`（离线）或\
  \ `unauthorized`（未授权），请前往 Android 设备并检查是否有图 7-3 所示的对话框，请求允许 USB 调试权限。\n\n## 7.3\
  \ 解决 USB 连接问题\n\n如果你无法通过上述步骤成功连接到设备，请显示运行目标菜单（图 7-4）并选择`Troubleshoot Device Connections`排除设备连接）选项：\n\
  \n![](img/as_troubleshoot_device_connections.jpg)\n图 7-4\n\n连接助手将扫描设备并报告问题及可能的解决方案。\n\
  \n## 7.4 在 Android 设备上启用无线调试\n\n按照上述章节 7.2 中的步骤 1 到 3 进行操作，这次要启用图 7-5 所示的`Wireless\
  \ Debugging`（无线调试）选项：\n\n![](img/android_12_enable_wifi_debugging.jpg)\n图 7-5\n\n\
  接下来，点击上述`Wireless debugging`条目，以显示图 7-6 所示的屏幕：\n\n![](img/android_12_enable_wifi_debugging_settings.jpg)\n\
  图 7-6\n\n如果你的设备带有摄像头，选择`Pair device with QR code`（通过二维码配对设备），否则选择`Pair device with\
  \ pairing code`（通过配对码配对设备）选项。根据你的选择，`Settings`应用将启动摄像头会或显示配对码，如图 7-7 所示：\n\n![](img/as_pair_devices_code.jpg)\n\
  图 7-7\n\n选择选项后，返回 Android Studio 并在运行目标菜单中选择图 7-8 所示的`Pair Devices Using WiFi`（通过\
  \ WiFi 配对设备）选项：\n\n![](img/as_pair_using_wifi.jpg)\n图 7-8\n\n在配对对话框中，根据你之前在设备`Settings`应用中的选择，选择`Pair\
  \ using QR code`（使用二维码配对）或`Pair using pairing code`（使用配对码配对）：\n\n![](img/as_pair_using_wifi_qr_code.jpg)\n\
  图 7-9\n\n使用 Android 设备扫描二维码，或者将设备屏幕上显示的配对码输入 Android Studio 对话框（图 7-10）中以完成配对过程：\n\
  \n![](img/as_pair_devices_wifi_enter_code.jpg)\n图 7-10\n\n如果配对过程失败，请尝试重启开发系统和 Android\
  \ 设备并重试。\n\n## 7.5 测试 adb 连接\n\n假设在所选的开发平台上已成功配置了`adb`，下一步是尝试在设备上运行“在 Android Studio\
  \ 中创建示例 Android 应用”章节中创建的测试应用程序。启动 Android Studio，打开`AndroidSample`项目，并验证设备是否出现在设备选择菜单中，如图\
  \ 7-11 所示：\n\n![](img/as_run_on_device.jpg)\n图 7-11\n\n从列表中选择设备并点击运行按钮安装并运行应用。\n\
  \n## 7.6 设备镜像\n\n设备镜像（Device mirroring）允许你在物理设备上运行应用，同时在 Android Studio 的`Running\
  \ Devices`工具窗口中查看显示内容。也就是说，尽管你的应用运行在物理设备上，但它在 Android Studio 中的显示方式与 `AVD` 实例相同。\n\
  \n当设备连接到 Android Studio 时，显示`Running Devices`工具窗口并点击`Device Mirror`设置链接以显示`Settings`对话框。在`Settings`对话框中，启用物理\
  \ Android 设备的镜像并点击`OK`。下次运行应用时，Android Studio 将`Running Devices`工具窗口中镜像物理设备的显示。\n\
  \n## 7.7 总结\n\n虽然 Android 虚拟设备模拟器提供了一个极的测试环境，但必须记住，确保应用程序在物理 Android 设备上正常运行的方法没有真正的替代品。\n\
  \n但是，默认情况下，Android Studio 环境并未配置为将 Android 设备识别为目标测试设备。因此，需要执行一些步骤，通过 USB 线缆或 WiFi\
  \ 网络从 Android Studio 开发环境直接将应用程序加载到 Android 设备上。实现这一目标的确切步骤取决于开发平台。在本章中，我们涵盖了适用于\
  \ Linux、macOS 和 Windows 平台的这些步骤。\n\n## 8. Android Studio 代码编辑器基础\n\n为 Android 开发应用程序涉及大量的编程工作，根据定义，这涉及输入、审查和修改代码行。意不意外的是，开发者在使用\
  \ Android Studio 的大部分时间通常都在编辑器窗口内编写代码。\n\n现代代码编辑器的功能远超输入、删除、复制和粘贴的基础。今天，代码编辑器的实用性通常通过以下因素衡量：减少程序员所需的输入量、大文件的导航易用性，以及编辑器在编写代码时实时检测并突出显示错误的能力。正如本章将所示，这些只是编辑器擅长的少数领域之一。\n\
  \n### 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件时，Android Studio 编辑器出现在主窗口中央。例如，图\
  \ 8-1 显示了一个典型的 Java 源文件会话：\n\n![](img/as_code_editor_java.jpg)\n图 8-1\n\n编辑器窗口的元素总结如下：\n\
  \nA – 文档标签（Document Tabs）——Android Studio 可以同时打开多个文件。每打开一个文件，都会在编辑器顶部的标签栏分配一个显示文件名的标签。当空间不足显示所有标签时，远右角会出现一个小下拉菜单。点击此菜单将列出其他打开的文件列表。标签中文件名下方的红色波浪线表示文件代码包含错误，在编译和运行项目之前需要解决。\n\
  \n在文件之间切换只需点击相应的标签或使用`Alt-Left` 和 `Alt-Right` 快捷键。也可以通过切换器机制（通过`Ctrl-Tab` 快捷键访问）进行文件间的导航。\n\
  \n要将编辑器面板从 Android Studio 主窗口分离并使其在独立窗口中显示，请点击标签将其拖到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离编辑器窗口中的文件标签，并将其拖放到主窗口原始的编辑器标签栏中。\n\
  \n\n\n\n### B – 编辑器行距区域（Gutter Area）\n行距区域用于编辑器显示信息图标和控件。该区域的一些典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过在行距处点击右键并选择\
  \ `Appearance -> Show Line Numbers`（外观 -> 显示行号）菜单选项来禁用。\n\n### C – 代码结构位置（Code Structure）\n\
  编辑器底部的此栏显示光标当前位置与代码整体结构的关系。例如在在图中，该栏表示当前正在编辑 `convertCurrency` 方法，且该方法位于 `MainActivity`\
  \ 类中：\n\n![](img/as_code_structure.jpg)\n图 8-2\n\n双击该栏内的任意元素会将光标移动到代码文件中的相应位置。例如，双击\
  \ `convertCurrency` 条目会将光标移动到源代码中 `convertCurrency` 方法的顶部。同样，点击 `MainActivity` 条目将显示一个可用的代码导航点列表以供选择：\n\
  \n![](img/as_code_structure_menu.jpg)\n图 8-3\n\n### D – 编辑器区域（Editor Area）\n用户查看、输入和编辑代码的主要区域。本章的后续章节将详细介绍编辑区域的各项功能。\n\
  \n### E – 验证与标记侧边栏（Validation and Marker Sidebar）\nAndroid Studio 集成了一项名为“即时代码分析”（on-the-fly\
  \ code analysis）的功能。这意味着当您输入代码时，编辑器会分析代码以检查警告和语法错误。验证侧边栏顶部的指示器会随着代码的添加实时更新，显示发现的错误和警告数量。点击此指示器将弹出一个窗口，包含编辑器代码问题的总结，如图\
  \ 8-4 所示：\n\n![](img/as_editor_validation_summary.jpg)\n图 8-4\n\n向上和向下箭头可以在代码中的错误位置之间移动。绿色勾钩表示未检测到任何警告或错误。\n\
  \n侧边栏还会使用相同的颜色编码在检测到问题的位置显示标记。当编辑器区域显示代码行时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n![](img/as_code_editor_problem_popup.jpg)\n\
  图 8-5\n\n将鼠标指针悬停在当前滚动出编辑器视图区域的代码行标记上时，将显示一个“透镜”（lens）覆盖层，包含问题所在的代码块（图 8-6），从而无需滚动到编辑器的相应位置即可查看代码：\n\
  \n![](img/as_code_editor_lens.jpg)\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分上，都会出现一个透镜，其中包含源文件中对应位置的代码。\n\
  \n### F – 状态栏（Status Bar）\n虽然状态栏是主窗口的一部分而非编辑器，但它确实包含有关当前活动编辑会话的信息。这些信息包括光标在行和字符维度上的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号会显示 `Go to Line:Column`（转到行:列）对话框。使用 `View -> Appearance\
  \ -> Status Bar Widgets` 菜单选项添加或删除小部件。例如，如果您遇到 Android Studio 的性能问题，`Memory Indicator`（内存指示）是一个非常有用的小部件。\n\
  \n在概述组成 Android Studio 编辑器的元素后，本章的剩余部分将更详细探讨编辑环境的关键功能。\n\n## 8.2 分割编辑器窗口\n默认情况下，编辑器将显示一个显示当前选中文件内容的面板。在同时处理多个源文件时，一个实用的功能是将编辑器拆分为多个窗格。要拆分编辑器，可以在编辑器窗口内的文件标签页上点击右键，选择\
  \ `Split Right`（向右拆分）或 `Split Down`（向下拆分）菜单选项。例如图 8-7 显示了拆分器的工作，编辑器被拆分为三个面板：\n\n\
  ![](img/as_code_editor_split.jpg)\n图 8-7\n\n可以通过右键点击相应的标签页并选择 `Change Splitter Orientation`（更改拆分器方向）菜单选项随时更改拆分面板的方向。重复这些步骤可以取消单个面板的拆分，此时从菜单中选择\
  \ `Unsplit`（取消拆分）选项。可以通过右键点击任何标签页并选择 `Unsplit All`（取消所有拆分）菜单选项移除所有拆分面板。\n\n窗口分割可显示不同的文件，或为同一个文件提供多个窗口，允许同时查看和编辑同一文件的不同区域。\n\
  \n## 8.3 代码补全\nAndroid Studio 编辑器拥有 Java 编程语法、构成 Android SDK 的类和方法，以及您自己的代码库的大量知识。随着代码的输入，编辑器会扫描输入内容，并在适当的情况下就完成语句或引用可能的内容提供建议。当编辑器检测到补全建议时，将出现一个包含建议列表的面板。在图\
  \ 8-8 中，例如，编辑器正在为 `String` 声明提供建议：\n\n![](img/as_code_editor_completion.jpg)\n图\
  \ 8-8\n\n\n\n\n\n`myMethod()`\n\n在编辑器中输入此代码后，触发语句补全将导致编辑器自动为方法添加大括号：\n\n```java\n\
  myMethod() {\n\n}\n```\n\n### 8.5 参数信息\n\n你也可以要求编辑器提供方法所接受的参数参数的信息。当光标置于方法调用的大括号之间时，按下\
  \ `Ctrl-P`（macOS 上为 `Cmd-P`）组合键将显示该方法已知的接受的参数，并对最可能的建议以**粗体**形式高亮显示：\n\n![](img/as_code_editor_parametre_info_java.jpg)\n\
  \n图 8-10\n\n### 8.6 参数名称提示\n\n代码编辑器可以配置为在方法调用内部显示参数名称提示。例如，图 8-11 显示了 `Snackbar`\
  \ 类调用 `make()` 和 `setAction()` 方法时的参数名称提示：\n\n![](img/as_code_editor_hints.jpg)\n\
  \n图 8-11\n\n此模式的设置可以通过打开设置（Settings）对话框，并在侧边栏导航到 `Editor` -> `Inlay Hints` -> `Java`\
  \ 来配置。在生成的屏幕上，为你选择的编程语言开启或关闭 `Parameter names` 。要调整提示设置，点击 `Exclude list...` 链接并进行任何必要的调整。\n\
  \n### 8.7 代码生成\n\n除了在输入时补全代码外，编辑器在某些条件下还可以为你生成代码。图 8-12 所示的可用代码生成选项列表可以通过 `Alt-Insert`（macOS\
  \ 上为 `Cmd-N`）快捷键访问，前提是光标位于文件文件中需要生成代码的位置。\n\n![](img/as_code_generate_menu.jpg)\n\
  \n图 8-12\n\n例如，考虑这样一种情况：我们希望在项目中的 `Activity` 即将被操作系统销毁时收到通知。正如本书后续章节概述的那样，这可以通过重写\
  \ `Activity` 超类的 `onStop()` 声明周期方法来实现。要让 Android Studio 为此生成一个存根方法，请从代码生成列表中选择 `Override\
  \ Methods…` 选项，并从生成的可用方法列表中选择 `onStop()` 方法：\n\n![](img/as_code_editor_override_dialog.jpg)\n\
  \n图 8-13\n\n选择好要重写的方法后，点击 `OK` 将在 Java 源文件的当前光标位置生成如下存根方法：\n\n```java\n@Override\n\
  protected void onStop() {\n    super.onStop();\n}\n```\n\n### 8.8 代码折叠\n\n一旦源代码文件达到了一定的尺寸，即使是格式化最整齐、组织最好的代码也可能变得难以处理和导航。Android\
  \ Studio 认为，并不总是需要让每个代码块的内容始终可见。通过使用 Android Studio 编辑器的代码折叠功能，可以让代码导航变得更加简单。代码折叠使用折叠箭头控制，当鼠标指针悬停在源文件行间距（gutter）区域时，这些箭头会出现在每个代码块的开头。例如，图\
  \ 8-14 高亮了当前未折叠的方法声明的折叠箭头：\n\n![](img/as_code_editor_folding.jpg)\n\n图 8-14\n\n\
  点击此标记将折叠语句，使只可见签名行，如图 8-15 所示：\n\n![](img/as_code_editor_folded.jpg)\n\n图 8-15\n\
  \n要展开已折叠的代码段，请点击编辑器行间距（gutter）中的折叠箭头。要在不展开的情况下查看隐藏代码，请将鼠标指针悬停在 `“{…}”` 指示上，如图 8-16\
  \ 所示。编辑器随后将显示包含折叠代码块的透镜覆盖层：\n\n![](img/as_code_editor_folded_lens_java.jpg)\n\n\
  图 8-16\n\n文件中的所有代码块可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus` 组合键（macOS 上为 `Cmd-Shift-Plus`\
  \ 和 `Cmd-Shift-Minus`）进行折叠或展开。\n\n默认情况下，Android Studio 编辑器在打开源文件时会自动折叠某些代码。要配置发生这种情况的情况，请在设置对话框中导航到\
  \ `Editor` -> `General` -> `Code Folding` 项（图 8-17）：\n\n![](img/as_code_editor_folding_settings.jpg)\n\
  \n图 8-17\n\n### 8.9 快速文档查询\n\n通过将光标置于需要文档的声明上并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`），可以访问与上下文相关的\
  \ Java 和 Android 文档。这将显示一个包含该项目相关参考文档的弹出窗口。例如，图 8-18 显示了 `Android FloatingActionButton`\
  \ 类文档。\n\n![](img/as_code_editor_documentation_lookup_java.jpg)\n\n图 8-18\n\n###\
  \ 8.10 代码格式化\n\n通常情况下，Android Studio 编辑器会自动根据缩进、空格和嵌套来格式化代码。在需要格式化代码的情况下（例如从网站剪切代码时），可以使用\
  \ `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）触发代码格式化功能。要显示格式化代码对话框（图 8-19），使用 `Ctrl-Shift-L`（macOS\
  \ 上为 `Cmd-Shift-L`）。此对话框提供了仅格式化选定代码、整个文件或仅更改代码的选项：\n\n![](img/reformat_code.jpg)\n\
  \n图 8-19\n\n代码样式偏好可以通过打开设置对话框并在侧边面板选择 `Code Style` 来访问支持的语言。选择一种语言将提供大量的格式样式选项，所有选项都可以从\
  \ Android Studio 默认值进行修改以匹配你的代码样式。例如，要配置 `Rearrange code` 选项的设置，展开 `Code Style`\
  \ 部分，选择 `Java`，然后从 Java 设置中选择 `Arrangement` 选项卡。\n\n\n\n\n\n![](img/as_code_live_templates.jpg)\n\
  \n图 8-20\n\n使用上方图 8-20 中标记为 A 的按钮添加、删除、复制或重置模板。要修改模板，请从列表 (B) 中选择它并在标记为 C 的面板中更改设置。\n\
  \n## 8.13 总结\n\nAndroid Studio 编辑器尽力减少编写代码所需的输入，并使代码更易阅读和导航。本章涵盖了关键编辑器功能，包括代码补全、代码生成、编辑器分分、代码折叠、格式化、文档查询和实时模板（live\
  \ templates）。\n\n## 9. Android 架构概览\n\n到目前为止，本书已经采取了步骤，建立了适用于使用 Android Studio 开发\
  \ Android 应用程序的环境。通过创建一个 Android Studio 应用项目，也已经在应用开发过程中迈出了第一步。\n\n然而，在深入研究 Android\
  \ 应用开发的实际问题之前，理解 Android SDK 以及通用的 Android 开发的一些较为抽象的概念是非常关重要的。现在清晰地理解这些概念将为进一步构建知识打下坚实的基础。\n\
  \n本章将从 Android 架构的概述开始，并在接下来的几章中继续，目标是提供 Android 开发基础的详细概述。\n\n### 9.1 Android 软件栈\n\
  \nAndroid 结构为一个软件栈，由应用程序、操作系统、运行时环境、中间件、服务库组成。这种架构可以通过视觉方式完美表示，如图 9-1 所示。软件栈的每一层以及每层中相应的元素都紧密集成并经过仔细调整，为移动设备提供最佳的应用开发和执行环境。本章的剩余部分将逐层介绍\
  \ Android 栈，从底部的 `Linux Kernel` 开始。\n\n![](img/architecture_stack_small.jpg)\n\n\
  图 9-1\n\n### 9.2 Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈的底部，在设备硬件和 Android 软件栈上层之间提供了抽象。内核提供了抢占式多任务处理、低级核心系统服务（如内存、进程和电源管理），以及用于显示器、WiFi\
  \ 和音频等硬件的网络栈和设备驱动程序。\n\n原始的 `Linux kernel` 由 Linus Torvalds 于 1991 年开发。它与 Richard\
  \ Stallman 在自由软件基金开发的一系列工具、实用程序和编译器相结合，创建了一个名为 `GNU/Linux` 的完整操作系统。各种 `Linux` 发行版都是从这些基础衍生出来的，例如\
  \ `Ubuntu` 和 `Red Hat Enterprise Linux`。\n\n然而，需要注意的是，Android 只使用了 `Linux kernel`。尽管如此，值得注意的是，`Linux\
  \ kernel` 最初是为传统的桌面和服务器计算机系统设计的。事实上，`Linux` 现在最广泛地部署在关键型企业服务器环境中。我们发现这种软件位于 Android\
  \ 软件栈的核心，这既证明了今天移动设备的强大，也证明了 `Linux kernel` 的效率和性能。\n\n### 9.3 硬件抽象层\n\n`Hardware\
  \ Ab Layer` (`HAL`) 由一组库模块组成，与摄像头、麦克风和加速度计等设备组件接口。当 Android 栈需要访问硬件组件时，它使用 `HAL`\
  \ 库模块。每个 Android 设备制造商都针对其特定的硬件配置有一个抽象层，允许标准的 Android 库和框架在任何设备上运行，而无需针对特定硬件进行修改。\n\
  \n### 9.4 Android 运行时 – ART\n\n当 Android 应用在 Android Studio 中构建时，它会被编译为一种中间字节码格式（`DEX\
  \ format`）。当随后将应用程序加载到设备时，`Android Runtime` (`ART`) 使用称为 `Ahead-of-Time` (`AOT`)\
  \ 编译的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为 `Executable and Linkable Format` (`ELF`)。\n\n\
  每当随后启动应用程序时都会运行 `ELF` 可执行版本，从而获得更的应用性能并延长电池寿命。\n\n这与旧版 Android 实现中使用的 `Just-in-Time`\
  \ (`JIT`) 编译方法形成对比，在那种方法中，字节码每次启动应用程序时都在虚拟机 (`VM`) 中进行翻译。\n\n### 9.5 Android 库\n\
  \n除了一组标准的 Java 开发库（提供对字符串处理、网络和文件操作等通用任务的支持）外，Android 开发环境还包含 `Android Libraries`。这些是专门用于\
  \ Android 开发的 Java 库。该类库的示例包括应用框架库，以及促进用户界面构建、图形绘制和数据库访问的库。\n\nAndroid 开发者可用的某些核心\
  \ Android 库摘要如下：\n\n- `android.app` – 提供对应用模型的访问，是所有 Android 应用的基石。\n- `android.content`\
  \ – 促进应用程序与应用组件之间的内容访问、发布和消息传递。\n- `android.database` – 用于访问内容提供者发布的数据，并在 `SQLite`\
  \ 数据库管理类。\n- `android.graphics` – 一个低级 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n- `android.hardware`\
  \ – 提供一个访问加速度计和光传感器等硬件的 API。\n- `android.opengl` – 用于 `OpenGL ES` 3D 图形渲染 API 的\
  \ Java 接口。\n- `android.os` – 为应用程序提供标准操作系统的访问，包括消息、系统服务和进程间通信。\n- `android.media`\
  \ – 提供用于音频视频播放的类。\n- `android.net` – 提供一组访问网络栈的 API。包括 `android.net.wifi`，它提供对设备无线栈的访问。\n\
  - `android.print` – 包括一组从 Android 应用程序将内容发送到配置打印机的类。\n- `android.provider` – 一组便利类，提供对标准\
  \ Android 内容提供者数据库的访问，例如日历和联系人应用维护的。\n- `android.text` – 用于在设备显示上渲染和处理文本。\n- `android.util`\
  \ – 用于执行任务的工具类，如字符串和数字转换、XML 处理以及日期和时间操作。\n- `android.view` – 用户界面的基础构建块。\n- `android.widget`\
  \ 丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit` – 一组旨在在应用程序中构建浏览器功能的类。\n\
  \n在涵盖了 Android 运行时的 Java 库之后，现在是我们将注意力转向 Android 软件栈这一层中的 C/C++ 库了。\n\n#### 9.5.1\
  \ C/C++ 库\n\n\n\n\n上一节概述的 Android 运行时核心库是基于 Java 的，为 Android 开发者提供了主要的 API。然而，需要注意的是，核心库并没有执行许多实际工作，事实上，它们本质上是一组基于\
  \ C/C++ 库的 Java“封装器”。例如，在调用 `android.opengl` 库在设备显示器上绘制 3D 图形时，该库最终会调用 `OpenGL ES`\
  \ C++ 库，而该库又与底层 Linux 内核协作执行绘图任务。\n\n包含 C/C++ 库是为了实现广泛且多样的功能，包括 2D 和 3D 图形绘制、安全套接层\
  \ (SSL) 通、SQLite 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理，以及标准 C 系统库 (`libc`) 的实现。\n\n\
  在实践中，典型的 Android 开发者将仅通过基于 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库可以使用 Android\
  \ 原生开发工具包 (`NDK`) 实现，其目的是通过 Java 原生接口 (`JNI`) 在 Java 代码中调用非 Java 或 Kotlin 编程语言（如\
  \ `C` 和 `C++`）的原生方法。\n\n## 9.6 应用框架\n\n应用框架是一组服务，共同组 Android 应用程序运行和管理的环境。该框架实现了\
  \ Android 应用程序是由可重用、可交换和可替换组件构建的概念。这一概念更进一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序可以找到并重用它们。\n\
  \nAndroid 框架包含以下关键服务：\n\n- Activity 管理器 (Activity Manager) – 控制应用程序生命周期和活动栈的所有方面。\n\
  - `Content Providers` – 允许应用程序与其他应用程序之间发布并共享数据。\n- 资源管理器 (Resource Manager) – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - 通知管理器 (Notifications Manager) – 允许应用程序向用户显示警告和通知。\n- 视图系统 (View System) – 用于创建应用程序界面的扩展视图集。\n\
  - 包管理器 (Package Manager) – 查找设备上已安装的其他应用程序信息的系统。\n- 电话管理器 (Telephony Manager) –\
  \ 向应用程序提供设备上可用电话服务的信息，例如状态和订阅者信息。\n- 位置管理器 (Location Manager) – 提供对位置服务的访问，允许应用程序接收位置更改的更新。\n\
  \n## 9.7 应用程序\n\n位于 Android 软件栈顶端的是应用程序。它们由特定的 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户购买设备后安装的第三方应用程序组成。\n\
  \n## 9.8 总结\n\n良好的 Android 开发知识基础需要理解 Android 的整体架构。Android 实现为一种软件栈架构，由 Linux 内核、运行时环境、相应的库、应用框架和一组应用程序组成。应用程序主要用\
  \ `Java` 或 `Kotlin` 编写，并在 Android Studio 构建环境中编译为字节码格式。当应用程序随后安装到设备上时，这些字节码将由 Android\
  \ 运行时 (`ART`) 编译为 CPU 使用的原生格式。Android 架构的关键目标是性能和效率，既体现在应用程序执行中，也体现在应用程序设计的重用中。\n\
  \n## 10. Android 剖析\n\n无论你之前的编程经验是基于 Windows、macOS、Linux 甚至 iOS 的，Android 开发可能与你以前遇到过的任何事物都不同。\n\
  \n因此，本章的目标是让你理解 Android 应用程序架构背后的高层概念。在此，我们将详细探讨可用于构建应用程序的各种组件，以及允许这些组件协同工作以创建一个凝聚应用程序的机制。\n\
  \n### 10.1 Android Activity\n\n熟悉 `Java`、`Kotlin`、`C++` 或 `C#` 等面向对象编程语言的人熟悉将应用程序功能元素封装在类中的概念，然后将其实例化为对象并进行操作以创建应用程序。这仍然适用，因为\
  \ Android 应用程序是用 `Java` 和 `Kotlin` 编写的。然而，Android 将重用组件的概念推向了更高。\n\nAndroid 应用程序是通过组合一个或多个称为\
  \ `Activities` 的组件创建的。Activity 是应用程序功能的单个独立模块，通常直接对应单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个显示当天预约的\
  \ Activity 屏幕。应用程序可能还会使用第二个 Activity，由一个用户可以在其中输入新预约的屏幕组成。\n\nActivity 设计为完全可重用和可交换的构建块，可以在不同应用程序之间共享。一个现有的电子邮件应用程序可能包含一个编写和发送电子邮件消息的\
  \ Activity。开发者可能正在编写一个也需要发送电子邮件消息的应用程序。开发者无需为新应用程序专门开发一个邮件编写 Activity，而是可以使用现有电子邮件应用程序中的\
  \ Activity。\n\nActivity 是作为 `Android Activity` 类的子类创建的，并且必须实现为完全独立于应用程序中的其他 Activity。换句话说，共享的\
  \ Activity 不能依赖在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该 Activity），而且一个 Activity 不能直接调用另一个\
  \ Activity 的方法或访问其实例数据。相反，这是通过 `Intents` 和 `Content Providers` 实现的。\n\n默认情况下，Activity\
  \ 无法向调用它的 Activity 返回结果。如果需要此功能，则必须显式地启动为源 Activity 的子 Activity。\n\n### 10.2 Android\
  \ Fragment\n\n如上所述，一个 Activity 通常代表应用内部的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个相应的 Activity\
  \ 类文件来构建 Activity。然而，更好的替代方案是将 Activity 分为不同的部分。每个部分都是一个 Fragment，由用户界面布局的一部分和匹配的类文件（声明为\
  \ `Android Fragment` 类的子类）组成。在这种情况下，Activity 变成一个容器，其中嵌入一个或多个 Fragment。\n\nFragment\
  \ 为每个用户界面屏幕由单独 Activity 表示 提供了一种高效的替代方案。相反，应用可以有一个在 Fragment 之间切换的 Activity，每个 Fragment\
  \ 代表不同的应用屏幕。\n\n### 10.3 Android Intent\n\nIntent 是一个 Activity 启动另一个 Activity 并实现构成应用程序的\
  \ Activity 流的机制。Intent 由对要执行的操作描述以及可选的要执行操作的数据组成。\n\n\n\n\n`Intents` 可以是显式的（explicit），即通过通过类名引用\
  \ activity 来请求启动特定的 activity；也可以是隐式的（implicit），通过说明要执行的操作类型或提供要对执行操作的特定类型数据来实现。在隐式意图的情况下，Android\
  \ 运行时将使用一种被称为 `Intent Resolution`（意图解析）的过程，选择与 `Intent` 指定标准最匹配的 activity 进行启动。\n\
  \n### 10.4 广播意图 (Broadcast Intents)\n\n另一种 `Intent` 类型是 `Broadcast Intent`，它是一种发送给所有注册了“感兴趣”的\
  \ `Broadcast Receiver` 的系统级意图。例如，Android 系统通常发送 `Broadcast Intents` 来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启或关闭。\n\
  \n`Broadcast Intent` 可以是普通的（异步的），即它在几乎相同的时间内发送给所有感兴趣的 `Broadcast Receivers`；也可以是有序的，即它一次发送给一个接收器，由其进行处理，然后可以被中止或允许传递给下一个\
  \ `Broadcast Receiver`。\n\n### 10.5 广播接收器 (Broadcast Receivers)\n\n`Broadcast Receivers`\
  \ 是应用程序响应 `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指示它感兴趣的广播类型。当广播匹配的意图时，无论注册该接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器有 5 秒钟来完成所需任务（如启动 `Service`、更新数据或向用户发出通知），然后返回。`Broadcast Receivers`\
  \ 在后台运行，并且没有用户界面。\n\n### 10.6 Android 服务 (Android Services)\n\n`Android Services`\
  \ 是在后台运行且没有用户界面的进程。它们可以从 activities、`Broadcast Receivers` 或其他 `Services` 启动并管理。`Android\
  \ Services` 非常适用于应用程序需要继续执行任务但不一定需要向用户可见用户界面的情况。虽然 `Services` 缺乏用户界面，但它们仍然可以使用通知（notifications）和吐司（toasts，出现在屏幕上且不中断当前可见活动的小型通知消息）来通知用户事件，并且能够发布\
  \ `Intents`。\n\nAndroid 运行时赋予了 `Services` 比许多其他进程更高的优先级，系统只有在释放资源的最后手段下才会将其终止。然而，如果运行时需要杀死一个\
  \ `Service`，一旦有了足够的资源，它将自动重启。`Service` 可以通过声明自己需要在以前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于终止会对用户体验产生影响的情况（例如，如果用户正在收听由 `Service` 传输的音频）。\n\n`Service` 作为实际解决方案的示例情况包括（如之前提到的）：当应用程序不再活动时仍应继续的音频流，或者在股票达到指定价格时需要通知用户的股票市场跟踪应用程序。\n\
  \n### 10.7 内容提供者 (Content Providers)\n\n`Content Providers` 实现了一种在应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ `Content Provider` 为其他应用程序提供对其底层数据的访问权限，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过 `Content\
  \ Provider` 定义的通用资源标识符（Universal Resource Identifier `URI`）提供。数据可以以文件或整个 `SQLite`\
  \ 数据库的形式进行共享。\n\n### 10.8 应用清单 (The Application Manifest)\n\n`Application Manifest`\
  \ 文件是组成应用程序的各种元素的胶合剂。在这个基于 XML 的文件中，应用程序概述了组成完整应用程序的活动、服务、广播接收器、数据提供者和权限。\n\n###\
  \ 10.9 资源 (Application Resources)\n\n除了清单文件和包含字节码的 `Dex` 文件外，Android 包通常包含一组资源文件。这些文件包含了出现在用户界面中的字符串、图像、字体和颜色等资源，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层次结构的 `/res` 子目录中。\n\n### 10.10 应用程序上下文 (Application\
  \ Context)\n\n当应用程序被编译时，会创建一个名为 `R` 的类，其中包含对应用程序资源的引用。应用程序清单文件和这些资源结合在一起，创建了所谓的\
  \ `Application Context`（应用程序上下文）。该上下文由 `Android Context` 类表示，可以在应用程序代码中使用以在运行时访问应用程序资源。此外，可以在应用程序的上下文中调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n### 10.11 总结\n\n许多不同的元素可以组合在一起创建一个 Android 应用程序。在本章中，我们提供了 `Activities`、`Fragments`、`Services`、`Intents`\
  \ 和 `Broadcast Receivers` 的高级概述，以及对清单文件和应用程序资源的概述。\n\n通过以活动和意图的形式创建单个、独立的功能模块，并实现\
  \ `content providers` 以实现应用程序之间的数据共享，可以促进最大的重用和互操作性。\n\n虽然活动专注于用户与应用程序交互的区域（一个活动本质上等同于单个用户界面屏幕，通常由一个或多个\
  \ `fragments` 组成），但后台处理通常由 `Services` 和 `Broadcast Receivers` 处理。\n\n构成应用程序的组件在清单文件中为\
  \ Android 运行时概述，该文件与应用程序资源结合代表了应用程序的上下文。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。但请放心，在后续章节中将对这些概念进行深入的探索和实际应用，以确保构建自己的应用程序奠定坚实的知识基础。\n\
  \n# 11. Android 视图绑定概述 (Android View Binding)\n\n开发 Android 应用的一个基本部分是代码与组成用户界面布局的视图之间的交互。本章将查看访问布局视图的选项，重点介绍一种名为视图绑定（view\
  \ binding）的方法。在涵盖视图绑定的基础后，本章将概述如何将 `AndroidSample` 项目转换为使用这种方法。\n\n### 11.1 通过 ID\
  \ 查找视图 (Find View by Id)\n\n正如在“Android 应用的结构”章节中所述的，组成应用程序的所有资源都被编译到名为 `R` 的类中。在这些资源中包含了布局资源。在\
  \ `R` 类内部有一个名为 `layout` 的子类，它包含了布局资源，包括视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如，当读取输入 `EditText`\
  \ 视图的值或更改 `TextView` 显示的内容时。\n\n\n\n\n\n在引入 Android Studio 3.6 之前，在 App 代码中获取视图的最常用方法是编写代码，通过\
  \ `findViewById()` 方法根据 ID 手动查找视图。例如：\n\n```java\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性了。例如：\n\n```java\nexampleView.setText(\"Hello\");\n```\n\n\
  虽然通过 ID 查找视图仍然是一个可行的方案，但它存在一些局限性，`findViewById()` 最显著的缺点是，可能会获取到一个尚未在布局中创建的视图引用，从而导致在尝试访问视图属性时抛出空指针异常。\n\
  \n从 Android Studio 3.6 开始，已经提供了一种以视图绑定（view binding）形式从 App 代码中访问视图的替代方法。\n\n##\
  \ 11.2 视图绑定 (View Binding)\n\n当 App 模块中启用视图绑定时，Android Studio 会为每个布局文件自动生成一个绑定类。代码可以使用此绑定类访问布局视图，而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名，将其转换为所谓的“驼峰命名法”，并在末尾添加“Binding”单词。例如，对于\
  \ `activity_main.xml` 文件，绑定类将名为 `ActivityMainBinding`。\n\nAndroid Studio Iguana\
  \ 在项目模板中使用视图绑定的情况是不一致的。例如，我们在创建 `AndroidSample` 项目时使用的 Empty Views Activity 模板没有使用视图绑定。另一方面，Basic\
  \ Views Activity 模板是使用视图绑定实现的。如果你使用的模板没有使用视图绑定，那么了解如何将其将其添加到你的项目中是至关重要的。\n\n## 11.3\
  \ 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 `AndroidSample` 项目转换为使用视图绑定代替 `findViewById()`，来练习迁移到视图绑定。\n\
  \n首先，启动 Android Studio 并打开在在 Android Studio 中创建示例 Android App 章节中创建的 `AndroidSample`\
  \ 项目。\n\n## 11.4 启用视图绑定\n\n要使用视图绑定，必须先对需要视图绑定的模块的 `build.gradle.kts` 文件进行一些更改。对于\
  \ `AndroidSample` 项目，这需要对 `Gradle Scripts -> build.gradle.kts (Module: app)` 文件进行细微更改。将此文件加载到编辑器中，找到\
  \ `android` 部分，并添加如下项以启用 `viewBinding` 属性：\n\n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n\
  }\n\nandroid {\n    buildFeatures {\n        viewBinding = true\n    }\n}\n```\n\
  \n完成此更改后，点击编辑器面板顶部的 `Sync Now` 链接，然后使用 `Build` 菜单清理并重建项目，以确保绑定类已生成。下一步是在代码中使用绑定类。\n\
  \n## 11.5 使用视图绑定\n\n此过程的第一步是“膨胀”（inflate）视图绑定类以访问布局内的根视图。该根视图将用作布局的内容视图。\n\n执行这些任务的逻辑位置位于与布局关联的\
  \ `onCreate()` 方法中。一个典型的 `onCreate()` 方法如下：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    EdgeToEdge.enable(this);\n    setContentView(R.layout.activity_main);\n   \
  \ ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main),\n         \
  \     (v, insets) -> {\n        Insets systemBars =\n                    insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \        v.setPadding(systemBars.left, systemBars.top,\n                     systemBars.right,\
  \ systemBars.bottom);\n        return insets;\n    });\n}\n```\n\n要切换到使用视图绑定，需要导入绑定类并按如下方式修改类。注意，由于布局文件名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类名为 `ActivityMainBinding`。注意，如果你在创建项目时使用了\
  \ `com.example` 以外的域名，则下方的导入语句需要更改以反映这一点：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        EdgeToEdge.enable(this);\n\
  \        setContentView(R.layout.activity_main);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ ViewCompat.setOnApplyWindowInsetsListener(binding.main, (v, insets) -> {\n   \
  \         Insets systemBars =\n                    insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right,\n \
  \                        systemBars.bottom);\n            return insets;\n     \
  \   });\n    }\n```\n\n现在我们已经有了 `binding` 的引用，就可以通过名称访问视图了：\n\n```java\npublic void\
  \ convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().isEmpty())\
  \ {\n        Float dollarValue = Float.valueOf(binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n    } else {\n        textView.setText(R.string.no_value);\n\
  \    }\n}\n```\n\n编译并运行应用，验证货币转换是否正常工作。\n\n## 11.6 选择方案\n\n尽管项目模板中没有采用视图绑定，但 Google\
  \ 强烈建议尽可能使用视图绑定。因此，在开发自己的项目时应使用视图绑定。\n\n## 11.7 本书示例中的视图绑定\n\n书中任何依赖未实现视图绑定的章节将首先进行迁移。然而，不需要每次需要迁移时都重复这些步骤，这些章节将引导你回到此处刷新记忆（担心，几个章节之后，这些操作将变得自然）。为了方便操作，下文简要地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到视图绑定\n\n将项目模块转换为视图绑定涉及以下步骤：\n\n1. 编辑项目窗口中的 `Gradle Scripts -> build.gradle.kts\
  \ (Module :app)` 模块级 Gradle 构建脚本。\n2. 找到文件的 `android` 部分，并添加如下项以启用 `viewBinding`\
  \ 属性：\n\n```kotlin\nandroid {\n    buildFeatures {\n        viewBinding = true\n\
  \    }\n}\n```\n\n3. 点击顶部的 `Sync Now` 链接以这些新的构建设置重新同步项目。\n4. 按如下方式修改 `MainActivity.java`\
  \ 文件（其中 `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如 `androidsample`）且\
  \ `<binding name>` 是对应布局资源文件的绑定名称（例如，`activity_main.xml` 的绑定为 `ActivityMainBinding`）：\n\
  \n```java\nimport android.view.View;\nimport com.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n```\n\n\n\n\n\n```java\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    EdgeToEdge.enable(this);\n\
  \    setContentView(R.layout.activity_main);\n    binding = <binding name>.inflate(getLayoutInflater());\n\
  \    View view = <binding name>.getRoot();\n    setContentView(view);\n    ViewCompat.setOnApplyWindowInsetsListener(binding.main,\n\
  \        (v, insets) -> {\n            Insets systemBars =\n                insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right, systemBars.bottom);\n\
  \            return insets;\n        });\n}\n```\n\n5. 通过绑定对象的属性按名称访问视图。\n\n## 11.9\
  \ 总结\n\n在 Android Studio 3.6 引入之前，在应用 的代码中访问布局视图需要使用 `findViewById()` 方法。现在提供了一种视图绑定（view\
  \ bindings）的替代方案。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含了对应布局中每个视图的绑定，比\
  \ `findViewById()` 方法提供了更安全的选项。然而，从 Android Studio Iguana 开始，某些项目模板默认未启用视图绑定。需要手动在每个项目模块中执行额外步骤来启用并配置支持。\n\
  \n## 12 理解 Android 应用和 Activity 生命周期\n\n在早期的章节中，我们学习了 Android 应用运行在进程中，并以活动（activities）、服务（services）和广播接收器（broadcast\
  \ receivers）的形式组成多个组件。本章旨在通过查看 Android 运行时应用程序和 Activity 的生命周期来扩展这些知识。\n\n无论如今移动设备与过去的桌面系统相比拥有多少内存和计算能力，重要的一点是请记住，根据现代桌面和笔记本电脑系统的标准，这些设备仍然被认为是“资源受限”的，特别是在内存方面。因此，Android\
  \ 系统的一项核心职责是确保这些有限资源得到有效管理，并确保运行其上的操作系统和应用程序始终对用户保持响应。为了实现这一点，Android 对运行应用程序的进程以及构成这些应用程序的单个组件的生命周期和状态拥有完全控制权。\n\
  \n因此，开发 Android 应用的一个重要因素是理解 Android 的应用和 Activity 生命周期周期管理模型，以及应用如何响应在其执行生命周期内可能强加的状态变化。\n\
  \n### 12.1 Android 应用与资源管理\n\n操作系统将每个运行中的 Android 应用视为一个独立的进程。如果系统识别到设备资源正在达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有正在运行进程的优先级和状态，结合这些因素创建 Google 所说的“重要性层次结构”（importance\
  \ hierarchy）。然后进程会被终止，从最低优先级开始按层次结构向上移动，直到系统释放了足够的资源供其运行。\n\n### 12.2 Android 进程状态\n\
  \n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其所托管的应用中排名最高的活动组件定义。正如 图 12-1 所示，一个进程在任何时刻都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image2438.jpg)\n\n图 12-1\n\n#### 12.2.1\
  \ 前台进程 (Foreground Process)\n\n这些进程被分配了最高级别的优先级。在任何时候，活跃的前台进程不太可能超过一个或两个，它们通常是系统最后被终止的进程。一个进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n- 托管一个用户正在与之交互的 Activity。\n- 托管一个与用户正在交互的 Activity 关联的 `Service`。\n- 托管一个通过调用\
  \ `startForeground()` 表明终止将破坏用户体验的 `Service`。\n- 托管一个执行其 `onCreate()`、`onResume()`\
  \ 或 `onStart()` 回调的 `Service`。\n- 托管一个正在执行其 `onReceive()` 方法的 `Broadcast Receiver`（广播接收器）。\n\
  \n#### 12.2.2 可见进程 (Visible Process)\n\n包含对用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的某个\
  \ Activity 对用户可见，但另一个 Activity（例如部分屏幕或对话框）处于前台时。如果一个进程托管的是一个本身绑定到可见或前台 Activity\
  \ 的 `Service`，该进程也具备获得可见状态的资格。\n\n#### 12.2.3 服务进程 (Service Process)\n\n包含已启动并正在执行的\
  \ `Service` 的进程。\n\n#### 12.2.4 后台进程 (Background Process)\n\n包含一个或多个当前对用户不可见的 Activity，且未托管符合服务进程状态的\
  \ `Service` 的进程。属于此类别的进程如果需要为高优先级进程释放额外内存，则面临被终止的高风险。Android 维护着后台进程的动态列表，按时间顺序终止进程，使得最近未处于前台的进程首先被杀死。\n\
  \n#### 12.2.5 空进程 (Empty Process)\n\n空进程不再包含活动应用程序，但被保留在内存中，准备好作为新启动应用程序的托管者。这比比预计乘客到达时保持公交车门开启并引擎运行。此类进程被认为优先级最低，是第一个被杀死以释放资源的。\n\
  \n### 12.3 进程间依赖 (Inter-Process Dependencies)\n\n确定最高优先级进程比上一节描述要复杂，因为进程之间通常是相互依赖的。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个高优先进程提供服务（例如作为前台的内容提供的服务进程）。作为一个基本规则，Android 文档规定，进程的排名永远不会低于它当前正在服务的进程。\n\
  \n### 12.4 Activity 生命周期 (The Activity Lifecycle)\n\n正如我们之前确定的，Android 进程的状态主要由构成其托管应用的\
  \ Activity 和组件的状态决定的。因此，重要的是这些 Activity 在应用程序的执行生命周期内也会切换不同的状态。Activity 的当前状态在部分取决于它在“Activity\
  \ 栈”（Activity Stack）中的位置。\n\n### 12.5 Activity 栈 (The Activity Stack)\n\n\n\n\n\
  运行时系统为运行在 Android 设备上的每个应用程序都维护一个 `Activity Stack`（活动栈）。当应用程序启动时，第一个要启动的应用程序活动被放置在栈中。当启动第二个活动时，它会被放置在栈的顶部，而之前的活动会被向下推。栈顶部的活动被称为活跃活动（或正在运行的活动）。当活跃活动退出时，运行时系统会将其从栈中弹出，而位于栈中紧邻其下方的活动将成为当前的活跃活动。例如，栈顶部的活动可能会因为其所负责的任务已完成而退出。或者，用户可能选择了屏幕上的“返回”按钮以返回到上一个活动，这会导致当前活动被运行时系统从栈中弹出并销毁。Android\
  \ `Activity Stack` 的视觉化表示如图图 12-2 所示。\n\n如图所示，新活动在启动时会被推入栈的顶部。当前活跃活动一直位于栈顶部，直到它被新活动推入栈下方，或者在退出或用户导航到上一个活动时从栈中弹出。如果资源变得受限，运行时将杀死活动，从栈底部的活动开始。\n\
  \n`Activity Stack` 就是编程术语中所说的“后进先出”（LIFO）栈，因为最后一个被推入栈的项是第一个被弹出的项。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  \n图 12-2\n\n### 12.6 活动状态\n\n在应用程序内部的执行过程中，活动可以处于以下几种状态之一：\n\n*   **活跃 / 运行中（Active\
  \ / Running）** – 该活动位于 `Activity Stack` 的顶部，是设备屏幕上可见的前台任务，拥有焦点，并且当前与用户进行交互。在资源短缺的情况下，这种活动最可能被终止。\n\
  *   **已暂停（Paused）** – 该活动对用户可见，但目前没有焦点（通常是因为当前活跃活动部分遮挡了此活动）。暂停的活动保留在内存中，保持与窗口管理器的连接，保留所有状态信息，并在移动到\
  \ `Activity Stack` 顶部时可以快速恢复到活跃状态。\n*   **已停止（Stopped）** – 该活动目前对用户不可见（换句话说，它被设备显示上的其他活动遮挡了）。与暂停的活动一样，它保留所有状态和成员信息，但在低内存情况下有更高的终止风险。\n\
  *   **已杀死（Killed）** – 运行时系统已终止该活动以释放内存，该活动不再存在于 `Activity Stack` 上。如果应用程序需要，必须重新启动此类活动。\n\
  \n### 12.7 配置更改\n\n到本章为止，我们已经查看了 Android 活动状态变化的两个原因，即活动在前台和后台之间的移动移动，以及运行时系统终止活动以释放内存。事实上，还有第三种活动状态可能发生剧烈变化的情景，即涉及对设备配置的更改。\n\
  \n默认情况下，任何影响活动外观的配置更改（例如在竖屏和横屏之间旋转设备方向或更改系统字体设置）都会导致活动被销毁并重建。这背后的逻辑是，此类更改会影响用户界面布局等资源，而销毁并重建受影响的活动是活动响应配置更改的最快方法。然而也可以对活动进行配置，使用户不会响应特定的配置更改重启它。\n\
  \n### 12.8 处理状态变化\n\n从本章中应该清楚地看出，一个应用程序以及根据定义包含在其中的组件在其生命周期内将经历过许多状态。特别重要的一点是，这些状态变化（包括完全终止）是\
  \ Android 运行时根据用户操作和设备上资源的可用性施加给应用程序的。\n\n但在实践中，这些状态变化并非完全在无人通知的情况下强制发生，在大多数情况下，应用程序将收到运行时系统的更改通知，并获得做出相应反应的机会。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的现象。\n\
  \nAndroid 提供了两种处理应用内对象生命周期状态变化的方法。一种方法涉及响应操作系统的状态更改方法调用，并在下一章“处理 Android 活动状态更改”中进行详细介绍。\n\
  \nGoogle 推荐的新方法涉及包含在 Jetpack Android 体系组件中的生命周期类，这些类在“使用 Jetpack 构建现代 Android 架构”中引入，并在名为与\
  \ Android 生命周期感知组件一起工作”的章节中进行了更详细的解释。\n\n### 12.9 总结\n\n移动设备通常被认为是资源受限的，特别是在内存容量方面。因此，Android\
  \ 操作系统的一个主要职责是确保应用程序以及整个操作系统对用户保持响应能力。\n\n应用程序托管在 Android 的进程中。每个应用程序反过来由活动和 `Services`\
  \ 形式的组件组成。\n\nAndroid 运行时系统有权终止进程和单个活动以释放内存。运行时系统在决定一个进程是否为终止的合适候选者时，会考虑进程状态。\n\n\
  \n\n直到最近，在应用中构建生命周期感知一直有一种标准方法。这种方法在本章中介绍，涉及在 activity 或 fragment 实例中实现一组方法（每个生命周期状态对应一个方法），操作系统会在该对象的生命周期状态发生时调用这些方法。这种方法自\
  \ Android 操作系统早期以来一直没有改变，虽然在今天仍然是一个可行选项，但它确实存在一些局限性，将在本章稍后部分进行解释。\n\n随着 Jetpack\
  \ 架构组件引入了生命周期类，现在有了更好的生命周期处理方法。这种现代生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中进行详细介绍。然而，出于以下原因，理解传统的生命周期方法仍然至关重要。首先，作为\
  \ Android 开发者，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中一些。更重要的是，理解处理生命周期的旧方法将为书中后续学习新方法提供坚实的基础。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n在极少数情况下，应用程序的 activity 和 fragment 分别作为 Android\
  \ `AppCompatActivity` 类和 `Fragment` 类的子类创建。\n\n例如，考虑在在 Android Studio 中创建示例 Android\
  \ 应用中创建并随后转换为 view binding（视图绑定）的 `AndroidSample` 项目。将此项目加载到 Android Studio 环境并找到\
  \ `MainActivity.java` 文件（位于 `app` -> `java` -> `<your domain>` -> `androidsample`）。找到文件后，双击它将其加载到编辑器中，内容如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport androidx.core.view.ViewCompat;\n\nimport androidx.core.view.WindowInsetsCompat;\n\
  \nimport androidx.activity.EdgeToEdge;\n\nimport androidx.core.graphics.Insets;\n\
  \nimport android.view.View;\n\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \nimport java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        EdgeToEdge.enable(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ ViewCompat.setOnApplyWindowInsetsListener(binding.main, (v, insets) -> {\n   \
  \         Insets systemBars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right, systemBars.bottom);\n\
  \            return insets;\n        });\n    }\n\n    public void convertCurrency(View\
  \ view) {\n        if (!binding.dollarText.getText().toString().isEmpty()) {\n \
  \           float dollarValue = Float.parseFloat(binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            binding.textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n在创建项目时，我们指示 Android Studio 同时创建了一个名为 `MainActivity.java`\
  \ 的初始 activity。如上述代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查阅 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身也是 `Activity` 类的子类。可以在 Android Studio 编辑器中使用层次结构（Hierarchy）工具窗口验证这一点。在编辑器中加载\
  \ `MainActivity.java` 文件后，点击类声明行中的 `AppCompatActivity` 并按下快捷键 `Ctrl-H`。层次结构工具窗口随后出现，显示所选类的类层次结构。如图\
  \ 13-1 所示，`AppCompatActivity` 继承自 `Fragment` 类，而 `Fragment` 最终是 `Activity` 类的子类：\n\
  \n![](img/as_hierarchy.jpg) 图 13-1 Activity 和 Fragment 类包含一系列方法，供运行时在状态发生变化时调用。在本章中，我们将这些方法称为生命周期方法。其中一个方法命名为\
  \ `onCreate()`，再次回到上述代码，我们可以看到该方法已经为我们重写并实现了。在稍后的章节中，我们将探索 `onCreate()` 以及其他生命周期方法。\n\
  \n## 13.3 动态状态 vs. 持久状态\n\n生命周期管理的核心目标是确保在适当的时间保存并恢复 activity 的状态。在此语境下，我们所说的状态指的是当前\
  \ activity 持有的数据。例如，activity 可能会维护一个需要保存到数据库、内容提供程序或文件的数据模型。由于它跨越应用程序的多次调用而存在，这种状态信息被称为持久状态（persistent\
  \ state）。\n\n用户界面的显示（例如输入到字段但未提交到数据模型的文本）被称为动态状态（dynamic state），因为它们通常只在应用程序的单次调用期间保留（也称为实例状态）。理解这两种状态之间的差异很重要，因为它们的保存方式以及保存的原因各不同。\n\
  \n保存持久状态的目的是避免 activity 在后台被杀死时可能导致的数据丢失。另一方面，动态状态的保存和恢复有着稍微复杂的原因。\n\n例如，假设一个应用程序包含一个\
  \ activity（我们将其称为 Activity A），该应用包含一个文本框和一些单选按钮。在使用程序的过程中，用户在文本框中输入了一些文本，并在单选按钮中进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个\
  \ activity，导致 Activity A 被推入 Activity 栈并置于后台。一段时间后，运行时系统确定内存不足并杀掉了 Activity A 以释放资源。然而，对于用户而言，Activity\
  \ A 被放在了后台，并准备好随时移动到前台。当返回 Activity A 到前台时，用户理所预期输入的文本和单选按钮的选择已被保留。但在这种情况下，将创建一个\
  \ Activity A 的新实例，如果没有保存和恢复状态，之前的用户输入就会丢失。\n\n因此，保存动态状态的主要目的是提供一种在前台和后台 activity\
  \ 之间无缝切换的感知，无论 activity 是否在用户不知情的情况下被杀死并重启。\n\n保存持久状态和动态状态的机制在本章后续章节中将变得明显。\n\n\
  ## 13.4 Android 生命周期周期方法\n\n\n\n\n\n如前所述，`Activity` 和 `Fragment` 类包含几个生命周期方法，这些方法在实例状态发生时充当事件处理程序。Android\
  \ `Activity` 和 `Fragment` 类支持的主要方法如下：\n\n* `onCreate(Bundle savedInstanceState)`\
  \ – activity 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个 `Bundle` 对象形式的参数，该对象可能包含来自 activity\
  \ 上次被调用的动态状态信息（通常与用户界面状态有关）。\n* `onRestart()` – 当 activity 在之前被运行时系统停止后、准备重新启动时调用。\n\
  * `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用。此方法通知 activity 它即将变得对用户可见。此调用之后，如果\
  \ activity 移动到 activity 栈的顶部，则将调用 `onResume()`；如果它被另一个 activity 推入栈中下方，则将调用 `onStop()`。\n\
  * `onResume()` – 表示 activity 现在处于 activity 栈的顶端，并且是用户正在交互的 activity。\n* `onPause()`\
  \ – 表示之前的 activity 即将成为前台 activity。此调用之后将调用 `onResume()` 或 `onStop()` 方法，取决于 activity\
  \ 是移回前台还是对用户不可见。在此方法中可以采取措施存储尚未应用保存的持久化状态信息。为了避免切换 activity 延迟，应避免在此方法中执行将数据存储到数据库或执行网络操作等耗时操作。此方法还应该停止任何\
  \ CPU 密集型任务（如动画）。\n* `onStop()` – activity 不再对用户可见。此调用后的两种可能场景是：如果 activity 再次回到前台，则调用\
  \ `onRestart()`；如果 activity 被终止，则调用 `onDestroy()`。\n* `onDestroy()` – activity 即将被销毁，可能是因为\
  \ activity 已完成任务并调用了 `finish()` 方法，也可能是运行时为了释放内存或由于配置更改（如设备方向改变）而终止它。需要注意的是，activity\
  \ 终止时并不总是会调用 `onDestroy()`。\n* `onConfigurationChanged()` – 当发生配置更改且该 activity 已指示不需要重启时调用。该方法接收一个\
  \ `Configuration` 对象，该对象概述了新的设备配置，然后由 activity 负责对更改做出响应。\n\n以下生命周期方法仅适用于 `Fragment`\
  \ 类：\n\n* `onAttach()` - 当 fragment 分配给 activity 时调用。\n* `onCreateView()` - 用于创建并返回\
  \ fragment 的用户界面布局视图层次结构。\n* `onViewCreated()` - 在 `onCreateView()` 返回后调用。\n* `onViewStatusRestored()`\
  \ - fragment 保存的视图层次结构已恢复。\n\n除了上述的生命周期方法外，还有两个方法专门用于保存和恢复 activity 的动态状态：\n\n*\
  \ `onRestoreInstanceState(Bundle savedInstanceState)` – 如果 activity 从之前保存了状态的调用重新启动，则该方法会在调用\
  \ `onStart()` 方法后立即调用。与 `onCreate()` 类似，此方法传递一个包含之前的状态数据的 `Bundle` 对象。当在在 `onCreate()`\
  \ 和 `onStart()` 中完成 activity 初始化后，恢复之前的状态更有意义时，通常会使用此方法。\n* `onSaveInstanceState(Bundle\
  \ outState)` – 在 activity 销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法接收一个 `Bundle` 对象，状态应保存到其中，并在\
  \ activity 重启时，该对象会被随后传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，只有当运行时确定需要保存动态状态时，才会调用此方法。\n\
  \n在重写上述方法时，重要的是，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类中对应方法的调用。例如，以下方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例该方法的调用：\n\n```java\nprotected void onRestart() {\n\
  \    super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n```\n\n在方法重写中未调用此父类方法将导致运行时在执行期间抛出异常。虽然在\
  \ `onRestoreInstanceState()` 和 `onSaveInstanceState()` 方法中对父类的调用是可选的（例如，在实现自定义的保存和恢复行为时可以省略），但使用它们有许多益处，主题将在名为\
  \ \"保存和恢复 Android Activity 状态”(#Activity_Restore_State.xhtml__idTextAnchor350) 的章节中讨论。\n\
  \n## 13.5 生命周期\n\n最后一个要涵盖的主题是关于 activity 或 fragment 在执行期间将经历的整个、可见和前台生命周期的概述：\n\n\
  * **整个生命周期 (Entire Lifetime)** – “整个生命周期”一词用于描述从首次调用 `onCreate()` 方法到对象终止前调用 `onDestroy()`\
  \ 之间发生的一切。\n* **可见生命周期 (Visible Lifetime)** – 涵盖了调用 `onStart()` 和 `onStop()` 之间的执行期间。在此期间，activity\
  \ 或 fragment 对用户可见的，尽管它可能不是用户正在交互的对象。\n* **前台生命周期 (Foreground Lifetime)** – 指调用\
  \ `onResume()` 和 `onPause()` 方法之间的执行期间。\n\n需要注意的是，activity 或 fragment 在整个生命周期内可能会多次通过前台和可见生命周期。\n\
  \n生命周期和方法的概念在[图 13-2 中所示：\n\n![activity_lifecycle_methods.png](img/Image2446.jpg)\n\
  \n图 13-2\n\n## 13.6 折叠屏设备与多恢复\n\n\n\n\n\n如前所述，当发生某些配置更改时，可以指示一个活动在这些情况下不应重启。这通过在项目清单文件中的\
  \ `activity` 元素中添加 `android:configChanges` 指令来实现。例如，下面的清单文件片段表明，当发生与方向或设备字体大小相关的配置更改时，该活动不应重启：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n          android:configChanges=\"\
  orientation|fontScale\"\n          android:label=\"@string/app_name\">\n```\n\n\
  ## 13.8 生命周期方法的局限性\n\n正如本章开头所讨论的，生命方法已经使用了多年，直到最近，它们一直是处理活动和 fragment 生命周期周期状态变化的唯一机制。然而，这种方法仍然有改进空间。\n\
  \n生命方法的一个问题是，它们没有为活动或 fragment 提供一种简单的方法，使其能够在程序执行的任何时刻发现其当前的生命周期状态。相反，对象必须在内部跟踪状态，或者等待下一次生命方法的调用。\n\
  \n此外，这些方法没有提供一种让一个对象观察应用内其他对象生命周期状态的方法。这是一个严肃的问题，因为给定活动或 fragment 的生命周期状态变化可能会影响应用中的许多其他对象。\n\
  \n生命方法也仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期的自定义类。\n\n最后，生命方法导致大多数生命周期处理代码被写在活动或\
  \ fragment 中，这可能导致复杂且易出错的代码。理想情况下，这些代码大部分应该位于状态变化影响的其他类中。例如，一个流媒体视频的应用可能会包含一个专门用于管理输入流的类。如果应用需要在主活动停止时暂停流，那么执行此操作的代码应该位于流管理类中，而不是主活动。\n\
  \n所有这些以及更多问题都可以使用生命感知组件来解决，该主题将从标题为使用 Jetpack 构建现代 Android 应用架构的章节开始介绍。\n\n## 13.9\
  \ 总结\n\n所有活动都派自 `Android Activity` 类，该类反过来包含了若干生命方法，这些方法旨在在活动状态发生变化时由运行时系统调用。同样，`Fragment`\
  \ 类也包含几个类似的方法。通过重写这些方法，活动和 fragment 可以对状态变化做出，并在必要时采取步骤保存并恢复活动以及应用程序的当前状态。生命周期状态可以被认为有两种形式。持久状态是指在应用调用之间需要存储的数据（例如存储到文件或数据库）。动态状态则与用户界面的当前显示有关。\n\
  \n尽管生命方法具有可以使用生命感知组件避免的某些局限性，但理解这些方法对于充分理解书中后面介绍的生命周期管理新方法至关重要。\n\n在本章中，我们强调了活动可用的生命方法，并涵盖了活动生命周期的概念。在下一章标题为示例说明\
  \ Android 活动状态变化的章节中，我们将实现一个示例应用，将许多这些理论付诸实践。\n\n## 14. 示例说明 Android 活动状态变化\n\n\
  之前的章节详细讨论了组成 Android 应用的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用，将处理活动状态变化的理论付诸实践。该示例应用的目的是提供活动在\
  \ Android 运行时通过各种状态的真实世界演示。在下一章标题为保存和恢复 Android 活动的状态的章节中，本章构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态变化示例项目\n\n此练习的第一步是创建一个新项目。启动 `Android Studio`，如有必要，使用 `File -> Close\
  \ Project` 菜单选项关闭当前打开的项目，以便显示欢迎界面。\n\n从欢迎界面选择 `New Project` ，并在生成的新项目对话框中点击 `Next`\
  \ 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `StateChange` 并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。完成项目创建过程后，`StateChange` 项目应列位于 `Android Studio` 主窗口左侧的\
  \ `Project` 工具窗口中。使用节 11.8 将项目迁移到 View Binding 中概述的步骤将项目转换为使用 view binding。\n\n\
  下一步操作涉及活动用户界面的设计。它存储在名为 `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有，在\
  \ `Project` 工具窗口中导航到它，可以在 `app -> res -> layout` 文件夹找到它。一旦找到，双击文件将将其加载到 `Android\
  \ Studio Layout Editor` 工具中。\n\n![](img/as_state_change_main_window.jpg)\n\n图 14-1\n\
  \n### 14.2 设计用户界面\n\n当用户界面布局加载到 `Layout Editor` 工具后，是时候为示例应用设计用户界面了。与其当前用户界面中的“Hello\
  \ World!” `TextView`，活动需要一个 `EditText` 。在 `Component Tree` 面板中选择 `TextView` 对象并按下键盘上的\
  \ `Delete` 键将其删除。\n\n从 `Layout Editor` 左侧的 `Palette` 中，选择 `Text` 类别，然后从文本列表中点击并拖动\
  \ `Plain Text` 组件到画布上。将组件移动到显示中心，使居中线出现，然后将其放置到位，使布局类似于图 14-2。\n\n![](img/as_statechange_ui.jpg)\n\
  \n图 14-2\n\n在使用 `EditText` 小部件时，需要为视图指定输入类型。这定义了用户将输入的文本或数据类型。例如，如果输入类型设置为 `Phone`，用户将仅限制在视图中输入数字。或者，如果输入类型设置为\
  \ `TextCapCharacters`，输入将默认为大写字母。输入类型设置也可以组合。\n\n对于本示例，我们将使用默认输入类型以支持通用文本输入。如果以后需要选择不同的设置，选择布局中的\
  \ `EditText` 小部件，并在 `Attributes` 工具窗口中找到 `inputType` 条目。接下来，点击当前设置左侧的标志图标以打开选项列表，如下方的图\
  \ 14-3 所示。`Type` 菜单提供了将输入限制为文本、数字、日期时间和电话号码的选项。`Variations` 菜单为当前选择的输入类型提供额外的选项。例如，文本输入类型有一个用于电子邮件地址输入的变体。\n\
  \n\n\n\n\n一旦选择了类型和变体，可以使用复选框标志列表进一步自定义输入类型：\n\n![](img/as_text_input_type_menu.jpg)\n\
  \n图 14-3\n\n在 `Attributes`（属性）工具窗口中，将视图的 `id` 更改为 `editText`，然后点击弹出对话框中的 `Refactor`（重构）按钮。\n\
  \n默认情况下，`EditText` 显示的内容为“&ldquo;Name&rdquo;&rdquo;”（注：**此处原文意为显示为“Name”**）。继续留在\
  \ `Attributes` 面板中，删除 `text` 属性字段中的此内容，使视图在布局中保持空白。\n\n继续之前，点击布局编辑器工具栏上的 `Infer\
  \ Constraints`（推断约束）按钮以添加任何缺失的约束。\n\n### 14.3 重写 Activity 生命周期方法\n\n此时，项目已包含一个名为\
  \ `MainActivity` 的单个 activity，它派自 `AppCompatActivity` 类。该 activity 的源代码包含在 `MainActivity.java`文件中，该文件应该已经在编辑器会话中打开，并在编辑器标签栏中以标签页的形式显示。如果文件未打开，请在\
  \ `Project` 工具窗口面板中导航到它（`app -> java -> com.ebookfrenzy.statechange -> MainActivity`）并双击将其加载到编辑器。\n\
  \n到为止，activity 重写的唯一生命方法是 `onCreate()` 方法，它已被实现为在为 activity 设置用户界面之前调用父类的实例方法。我们现在将修改此方法，以便在每次执行时都在\
  \ Android Studio 的 `Logcat` 面板中输出一条诊断消息。为了实现这一点，我们将使用 `Log` 类，这要求导入 `android.util.Log`\
  \ 并声明一个标签（tag），以便我们在日志输出中过滤这些消息：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \n.\n\n.\n\nimport android.util.Log;\n\nimport androidx.annotation.NonNull;\nimport\
  \ android.view.View;\n\npublic class MainActivity extends AppCompatActivity {\n\
  \    private ActivityMainBinding binding;\n\n    private static final String TAG\
  \ = \"StateChange\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n\n.\n.\n        Log.i(TAG, \"onCreate\");\n\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ `Alt-Insert` 键盘快捷键生成，正如标题为“Android Studio 代码编辑器基础”的章节概述的。注意，如果方法是自动生成的，仍需要手动添加\
  \ `Log` 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    Log.i(TAG, \"onStart\");\n}\n\n@Override\nprotected void onResume() {\n   \
  \ super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n@Override\nprotected void\
  \ onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\");\n}\n\n@Override\n\
  protected void onStop() {\n    super.onStop();\n    Log.i(TAG, \"onStop\");\n}\n\
  \n@Override\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
  \    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"\
  onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n### 14.4 过滤 Logcat 面板\n\n\
  在 `MainActivity.java` 的重写方法中添加代码的目的是将日志信息输出到 `Logcat` 工具窗口，该窗口通过图 14-4 所示的按钮显示：\n\
  \n![](img/as_logcat_button.jpg)\n\n图 14-4\n\n`Logcat` 工具窗口可以配置为显示与设备或模拟器会话的所有事件，或者限制为与当前所选应用相关的事件。输出也可以被限制为仅匹配特定过滤器的日志事件。\n\
  \n当在当前应用运行时显示时，`Logcat` 工具窗口将如下方的图 14-5 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\
  \n图 14-5\n\n上图中标记为 A 的菜单允许您选择显示日志输出的设备或模拟器。此输出出现在标记为 C 的输出面板中。可以通过在标记为 B 的字段中输入选项来过滤日志输出。默认键设置\
  \ `package:mine` 将输出限制为当前应用包生成的日志消息（在本例中为 `com.ebookfrenzy.statechange`）。留空此字段将允许显示所选设备或模拟器的日志输出，包括操作系统生成的诊断消息。也可以组合键来进一步过滤输出。例如，我们可以如下配置\
  \ `Logcat` 面板，仅显示与我们的 `StateChange` 标签相关的消息：\n\n```\npackage:mine tag:StateChange\n\
  ```\n\n我们可以通过在键前加上减号（`-`）来排除输出。除了此外...\n\n\n\n很显然，初始状态的变化完全与“理解 Android 应用和 Activity\
  \ 生命周期”中概述的一样。然而，请注意，并没有调用 `onRestoreInstanceState()`，因为 Android 运行时检测到在这种情况下没有需要恢复的状态。\n\
  \n点击设备显示屏底部状态栏上的 `Home` 图标，并在日志中报告的方法调用序列如下所示：\n\n```\nonPause\nonStop\nonSaveInstanceState\n\
  ```\n\n在这种情况下，运行时注意到 activity 已不再处于前台，对用户不可见，并停止了该 activity，但它并没有给 activity 提供保存动态状态的机会。取决于运行时最终是销毁了\
  \ activity 还是重新启动了它，该 activity 将通过调用 `onRestart()` 方法被通知其已重启，或者在用户返回 activity 时再次经历创建序列。\n\
  \n正如“理解 Android 应用和 Activity 生命周期”中概述的那样，activity 的销毁和重建可以通过对设备进行配置更改（例如从竖屏旋转到横屏）来触发。要查看这一过程，请在\
  \ `StateChange` 应用程序处于前台时旋转设备。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。这显示在设备或模拟器屏幕的底部，如图\
  \ 14-9 所示：\n\n![](img/android_rotate_button.jpg)\n\n图 14-9\n\n日志中生成的方法调用序列如下：\n\n\
  ```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n很显然，运行时系统在 activity 被销毁和重启之前允许其保存了状态。\n\n## 14.7 总结\n\n“画胜千言”的谚语在学习新编程范式的示例中同样适用。在本章中，我们创建了一个\
  \ Android 应用程序示例，演示 activity 可能会经过的不同生命周期状态。在开发本章的项目期间，我们还查看了从 activity 内部生成诊断日志信息的机制。\n\
  \n在下一章中，我们将扩展 `StateChange` 示例项目，以演示如何保存和恢复 activity 的动态状态。\n\n## 15. 保存和恢复 Android\
  \ Activity 状态\n\n如果前面的几章已经实现了目标，那么现在应该更清楚在 activity 生命周期内的特定时间点保存和恢复用户界面状态的重要性。\n\
  \n在本章中，我们将扩展在“示例示例 Android Activity 状态更改”中创建的示例应用程序，演示当运行时系统销毁和重建 activity 时保存和恢复状态的步骤。\n\
  \n保存和恢复动态状态的关键组件涉及使用 Android SDK 中的 `Bundle` 类，该主题将在本章中涵盖。\n\n### 15.1 保存动态状态\n\n\
  正如我们所学的，activity 可以通过运行时调用 activity 的 `onSaveInstanceState()` 方法实现来保存动态状态信息。作为方法的参数传递的是一个\
  \ `Bundle` 对象的引用，该方法必须将任何需要保存的动态数据存储在该其中。随后，运行时系统代表 activity 存储该 `Bundle` 对象，并在这些方法调用时将其作为参数传递给\
  \ activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法。然后，可以在这些方法中从 `Bundle`\
  \ 对象中检索数据，并用于恢复 activity 的状态。\n\n### 15.2 用户界面状态的默认保存\n\n在上一章中，`StateChange` 示例应用程序的诊断输出显示，当运行它的设备旋转得足够大以触发方向变化时，activity\
  \ 会经历几次状态变化。\n\n再次启动 `StateChange` 应用程序，并在执行设备旋转之前在 `EditText` 字段中输入一些文本（在运行 Android\
  \ 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat 窗口中应该会出现以下状态变化序列：\n\n```\n\
  onPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n很显然，这导致了 activity 的销毁和重建。然而，检查正在运行的应用程序的用户界面应该显示输入到 `EditText`\
  \ 字段中的文本已被保留。鉴于 activity 被销毁并重建了，且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\n事实上，Android\
  \ SDK 包含的大多数视图小部件已经实现了 activity 自动重启时保存和恢复状态所需的行为。启用此行为的唯一要求是 activity 中的 `onSaveInstanceState()`\
  \ 和 `onRestoreInstanceState()` 重写方法必须包含对父类等效方法的调用：\n\n```java\n@Override\nprotected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  }\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n可以在 XML 布局文件中通过将\
  \ `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的自动状态保存。对于此示例，我们将禁用用户界面布局中 `EditText`\
  \ 视图的自动状态保存机制，然后在应用程序中添加代码手动保存和恢复视图的状态。\n\n为了配置 `EditText` 视图以便在 activity 重启时不保存和恢复状态，请编辑\
  \ `activity_main.xml` 文件，使视图条目如下（注意可以通过在 Android Studio 中创建示例 Android 应用中概述的方法，将布局编辑器切换到代码模式来编辑\
  \ XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"text\"\n    android:saveEnabled=\"false\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\
  \n### 15.3 Bundle 类\n\n对于用户界面视图组件提供的默认功能之外需要保存状态的情况，`Bundle` 类提供了一个使用键值对机制存储数据的容器。键的形式为字符串值，而与键关联的值可以是原始值，也可以是任何实现了\
  \ Android `Parcelable` 接口的对象。许多类已经实现了 `Parcelable` 接口。自定义类可以通过实现 `Parcelable` 接口定义的方法集来使其变为“可序列化的”，详细信息可以在\
  \ Android 文档中找到：\n\n\n\n\n\n[`developer.android.com/reference/android/os/Parcelable.html`](http://developer.android.com/reference/android/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组方法，可用于获取和设置各种数据类型的键值对，包括原始数据类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（如 `String` 和 `CharSequence`）。\n\n在本示例中，由于已经禁用了 `EditText` 视图的文本自动保存，我们需要确保用户输入到\
  \ `EditText` 字段中的文本被保存到 `Bundle` 对象并在随后恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态，并将分别通过\
  \ `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n## 15.4 保存状态\n\
  \n扩展 `StateChange` 应用程序的第一步是确保在 `MainActivity` 实例的 `onSaveInstanceState()` 方法中从\
  \ `EditText` 组件中提取用户输入的文本，然后将其作为键值对保存到 `Bundle` 对象中。\n\n若要从 `EditText` 对象中提取文本，我们必须首先在用户界面中识别出该对象。显然，这涉及到在\
  \ Activity 的 Java 代码（包含在 `MainActivity.java` 源代码文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间建立桥梁。为了提取输入到 `EditText` 组件的文本，我们需要获得该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联着一个唯一标识符。默认情况下，布局编辑器（Layout\
  \ Editor）工具根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则类型名后面会跟一个顺序数字（尽管开发者可以并且应该将其更改为更有意义的内容）。通过在选中\
  \ `activity_main.xml` 文件并显示布局编辑器工具时，检查 Android Studio 主窗口中的组件树（Component Tree）面板可以看到，`EditText`\
  \ 组件被分配了 `id` `editText`：\n\n![](img/as_component_tree1.jpg)\n\n图 15-1\n\n我们现在可以通过对象的\
  \ `getText()` 方法获取 `editText` 视图包含的文本，该方法会返回当前文本：\n\n```\nCharSequence userText\
  \ = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()`\
  \ 方法保存文本，传递键（可以是任何字符串值，但在本例中，我们将声明为“savedText”）和 `userText` 对象作为参数：\n\n```\noutState.putCharSequence(\"\
  savedText\", userText);\n```\n\n将所有内容整合在一起，我们在 `MainActivity.java` 文件中得到了修改后的 `onSaveInstanceState()`\
  \ 方法，内容如下：\n\n```java\npackage com.ebookfrenzy.statechange;\n\n.\n\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n\n...\n.\n    protected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG,\
  \ \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n.\n.\n```\n\n\
  现在已经了保存状态的步骤，下一阶段是在需要时恢复它。\n\n## 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择使用\
  \ `onCreate()` 或 `onRestoreInstanceState()`。使用哪个方法取决于 Activity 的性质。在状态在 Activity\
  \ 初始化任务完成后最适合恢复的情况下，通常 `onRestoreInstanceState()` 方法更合适。在本示例中，我们将向 `onRestoreInstanceState()`\
  \ 方法中添加代码，使用“savedText”键从 `Bundle` 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法将文本显示在 `editText`\
  \ 组件上：\n\n```java\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle\
  \ savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n    CharSequence userText =\n    \
  \        savedInstanceState.getCharSequence(\"savedText\");\n    binding.editText.setText(userText);\n\
  }\n```\n\n## 15.6 测试应用程序\n\n剩下的工作只是再次构建并运行 `StateChange` 应用程序。运行并处于前台时，触摸 `EditText`\
  \ 组件并在旋转设备到另一种方向之前输入一些文本。以前文本更改会丢失，但得益于我们在本章向 Activity 中添加的代码，新文本将保留在 `editText`\
  \ 组件中。\n\n验证代码运行符合预期后，注释掉两个方法中的 `super.onSaveInstanceState()` 和 `super.onRestoreInstanceState()`\
  \ 调用，重新启动应用并注意在设备旋转后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现取代，从而提供了一种在 Activity 中动态且选择性保存和恢复状态的方法。\n\
  \n## 15.7 总结\n\n在 Android 应用程序中保存和恢复动态状态是在适当的生命周期方法实现适当的代码。对于大多数用户界面视图，这由 `Activity`\
  \ 超类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值，并将数据作为键值对保存到运行时传递给 Activity\
  \ 的 `Bundle` 对象中。\n\n状态可以在 Activity 的 `onCreate()` 或 `onRestoreInstanceState()`\
  \ 方法中通过从 `Bundle` 提取值并更新 Activity 来恢复。\n\n## 16. 理解 Android 、组 和布局\n\n除了听流音频外，用户与\
  \ Android 设备的交互主要是视觉和触觉的。所有这些交互都发生在设备上安装的应用界面中，包括内置应用程序和用户安装的任何第三方应用程序。因此，开发 Android\
  \ 应用程序的一个关键要素涉及设计和创建用户界面并不意外。\n\n本章涵盖了 Android 用户界面结构，包括组成用户界面的元素概述：`Views`、`View\
  \ Groups` 和 `Layouts`。\n\n## 16.1 为不同的 Android 设备设计\n\n“Android 设备”一词涵盖了许多具有不同屏幕尺寸和分辨率的平板和平手机。因此，现在的应用程序用户界面必须经过仔细设计，以确保在尽可能广泛的显示范围内正确呈现。其中的关键部分是确保用户界面布局在不同设备上运行时正确调整大小。这很大程度上可以通过仔细规划和使用本章概述的布局管理器来实现。\n\
  \n还需要重要的是，大多数基于 Android 的智能手机和平电脑都可以用户竖持或横持。良好的用户界面应该能够适应这种变化并进行合理的布局调整，以利用每个方向的可用屏幕空间。\n\
  \n## 16.2 Views 和 View Groups\n\n\n\n\n\n用户界面中的每个项目都是 `Android View` 类的子类（准确地说是\
  \ `android.view.View`）。Android SDK 提供了一系列预构建的视图，用于构建用户界面。典型示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar`\
  \ 和 `TextView` 类。这些视图也被称为小部件（widgets）或组件（components）。对于 SDK 提供的部件无法满足的需求，可以通过子类和扩展现有类来创建新视图，或者通过直接在\
  \ `View` 类之上构建一个全新的组件。\n\n视图还可以包含多个其他视图（也称为复合视图，composite view）。此类视图派生自 `Android\
  \ ViewGroup` 类（`android.view.ViewGroup`），而 `ViewGroup` 本身是 `View` 的子类。这种视图的一个示例是\
  \ `RadioGroup`，它旨在包含多个 `RadioButton` 对象，使得在任何时刻只有一个对象可以处于“开启”状态。在结构上，复合视图由单个父视图（派生自\
  \ `ViewGroup` 类，也称为容器视图或根元素）组成，它可以包含其他视图（称为子视图）。\n\n### 另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\
  \n### 16.3 Android 布局管理器\n\n除了上一节讨论的小部件风格视图外，SDK 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派生自\
  \ `ViewGroup`），用于控制子视图在屏幕上的定位方式。\n\nAndroid SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\
  \n*   `ConstraintLayout`：在 Android 7 中引入，该布局管理器被推荐用于大多数布局需求。`ConstraintLayout` 允许通过为每个子视图分配简单的约束设置，定义布局中视图的位置和行为。这种布局的灵活性允许快速、方便地创建复杂布局，而无需在内部嵌套其他布局类型，从而提高了布局性能。`ConstraintLayout`\
  \ 同样紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，它是书中大多数示例的优选布局。\n*   `LinearLayout`：根据所选的方向将子视图置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图占据多少布局空间。\n\
  *   `TableLayout`：将子视图按行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子表示，而该对象又包含每个单元格的视图对象。\n\
  *   `FrameLayout`：`FrameLayout` 的目的是分配屏幕的一个区域，通常用于显示单个视图。如果添加了多个子视图，它们默认将堆叠在一起，并位于布局区域的左上角。通过在每个子视图上设置重力（gravity）值可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将使其位于包含包含的 `FrameLayout` 视图的垂直中心。\n*   `RelativeLayout`：`RelativeLayout`\
  \ 允许通过在子视图上指定对齐方式和边距，使子视图相对于彼此以及包含的布局视图进行定位。例如，可以将子 `View A` 配置为位于包含的 `RelativeLayout`\
  \ 视图的垂直和水平中心。另一方面，`View B` 也可以配置为在布局视图中水平居中，但位于 `View A` 顶部上方 30 像素处，从而使其垂直位置相对于\
  \ `View A` 相关。在设计必须适应各种屏幕尺寸和方向的用户界面时，`RelativeLayout` 管理器非常有帮助。\n*   `AbsoluteLayout`：允许子视图定位在包含布局视图内特定的\
  \ `X` 和 `Y` 坐标上。不建议使用此布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n*   `GridLayout`：`GridLayout` 实例由不可见的实线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直方向覆盖多个单元格，从而能够快速方便地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放置一种名为 `Space` 的特殊类型视图或设置边距参数来实现。\n*   `CoordinatorLayout`：作为\
  \ Android Design Support Library 的一部分随 Android 5.0 引入，`CoordinatorLayout` 专门用于协调应用程序屏幕顶部的应用栏与其他视图元素的外观和行为。当使用\
  \ `Basic Views Activity` 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout` 实例实现。该布局管理器将从与浮动操作按钮和\
  \ Snackbar 进行工作章节开始进行详细介绍。\n\n在考虑 Android 应用程序的用户界面布局时，值得记住，正如下一节所述，这些布局可以相互嵌套，以创建几乎任何所需复杂程度的用户界面设计。\n\
  \n### 16.4 视图层次结构\n\n用户界面中的每个视图都代表显示器的一个矩形区域。视图负责在该矩形内绘制内容，并响应屏幕该部分内的事件（例如触摸事件）。\n\
  \n用户用户界面屏幕由视图层次结构组成，其中根视图位于树的顶部，子视图位于下方的分支上。容器视图的子视图显示在其父视图之上，并被限制在父视图显示区域的边界内。例如，考虑图\
  \ 16-1 所示的用户界面：\n\n\n\n\n\nAndroid 应用用户界面屏幕中的每个元素都是视图（view），它们最终都继承自 `android.view.View`\
  \ 类。每个视图代表设备显示器上的矩形区域，负责显示该矩形区域内的内容，并处理在该边界内发生的事件。可以将多个视图组合创建一个单一复合视图。复合视图中的视图是容器视图（container\
  \ view）的子，容器视图通常是 `android.view.ViewGroup` 的子类（它本身又是 `android.view.View` 的子类）。用户界面是由以视图层次结构构建的视图组成的。\n\
  \nAndroid SDK 包含系列预构建的视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，以及一系列可用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图，或者通过子类\
  \ `android.view.View` 并创建一个全新的视图类来创建自定义视图。\n\n可以使用 Android Studio 布局编辑器（Layout Editor）工具、手写\
  \ XML 布局资源文件或编写 Java 代码来创建用户界面。这些每方法都将在接下来的章节中进行介绍。\n\n# 17. Android Studio 布局编辑器工具指南\n\
  \n很难想象一个不需要某种形式用户界面的 Android 应用概念。大多数 Android 设备都配有触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间的主要交互方式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n设计良好且实现的用户界面是创建成功且流行的 Android 应用的关键因素，它可以根据单个应用程序的设计需求从简单到极其复杂。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 基础视图活动与 空视图活动模板\n\n正如“Android\
  \ 应用剖析”章节所概述的那样，Android 应用包含一个或多个活动（activity）。活动是应用程序功能的独立模块，通常直接对应于单个用户界面屏幕。因此，当使用\
  \ Android Studio 布局编辑器工作时，我们始终在为活动编写布局。\n\n在创建新的 Android Studio 项目时，有多个模板可以作为主活动用户界面的起点。最基础的模板是基础视图活动（Basic\
  \ Views Activity）和空视图活动（Empty Views Activity）模板。尽管它们初看起来相似，但这两个选项之间存在显著差异。要在布局编辑器中查看这些差异，请使用视图选项（View\
  \ Options）菜单启用显示系统 UI（Show System UI），如下图 17-1 所示：\n\n![](img/as_layout_editor_view_options.jpg)\n\
  图 17-1*\n\n空视图活动模板创建一个单一布局文件，由一个 `ConstraintLayout` 管理器实例组成，其中包含一个 `TextView` 对象，如图\
  \ 17-2 所示：\n\n![](img/as_layout_with_system_ui.jpg)\n图 17-2*\n\n另一方面，基础视图活动包含多个布局文件。顶层布局文件具有\
  \ `CoordinatorLayout` 作为根视图，一个可配置的应用程序栏（包含 `toolbar`）显示在设备屏幕顶部（图 17-3 中的标记 A），以及一个浮动操作按钮（标记为\
  \ B 的电子邮件按钮）。这些项目之外，`activity_main.xml` 布局文件包含指向名为 `content_main.xml` 的第二个文件的引用，该文件包含内容布局（标记为\
  \ C）：\n\n![](img/as_basic_activity_layout.jpg)\n图 17-3*\n\n基础视图活动包含两个屏幕的布局，包含一个按钮和一个文本视图。此模板旨在演示如何在应用内的多个屏幕之间实现导航。如果运行使用基础视图活动模板的未修改应用，将出现这两个屏幕中的第一个屏幕（图\
  \ 17-4 中的标记 A）。点击“Next”（下一步）按钮将导航到第二个屏幕（B），该屏幕反过来包含一个返回第一个屏幕的按钮：\n\n![](img/as_basic_activity_layout_1.jpg)\n\
  图 17-4*\n\n此应用行为使用了两个名为片段（fragments）和导航（navigation）的 Android 功能，它们将分别从“Android 片段简介”和“导航架构组件概览”章节开始介绍。\n\
  \n`content_main.xml` 文件包含一个特殊的片段，称为导航宿主片段（Navigation Host Fragment），它允许根据 `res ->\
  \ layout -> nav_graph.xml` 文件中配置的设置，在视图中切换不同的内容。在基础视图活动模板案例中，`nav_graph.xml` 文件被配置为根据用户对“Next”和“Previous”按钮的选择，在\
  \ `fragment_first.xml` 和 `fragment_second.xml` 文件中定义的用户界面布局之间切换。\n\n如果你在活动中既不需要浮动操作按钮也不需要菜单，并且不需要\
  \ `CoordinatorLayout`提供的特殊应用栏行为（例如在某些滚动操作期间使应用栏和工具栏从视图中折叠的功能，该主题在“使用 AppBar 和折叠工具栏布局”章节中介绍），那么空视图活动模板将很有帮助。然而，基础视图活动非常有帮助，因为它默认提供了这些元素。事实上，使用基础视图活动模板创建一个新活动并删除不需要的元素，通常比使用空视图活动模板并手动实现折叠工具栏、菜单或浮动操作按钮等行为要快得多。\n\
  \n由于本书中的并非所有示例都需要基础视图活动模板的功能，因此除非示例需要基础视图活动模板提供的一个或其他功能，否则本章的大多数示例将使用空视图活动模板。\n\n\
  为了以后参考，如果你需要菜单但不需要浮动操作按钮，请使用基础视图活动并按照以下步骤删除浮动操作按钮：\n\n1. 在项目窗口的 `app -> res -> layout`\
  \ 下双击主 `activity_main.xml` 布局文件，将其加载到布局编辑器中。在布局加载到布局编辑器后，选择浮动操作按钮并按下键盘 Delete 键从布局中删除该对象。\n\
  \n2. 找到并编辑活动的 Java 代码（位于 `app -> java -> <package name> -> <activity class name>`），并如下从\
  \ `onCreate` 方法中删除浮动操作按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n```\n\n\n\n\n\n```java\nSnackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n    .setAction(\"Action\"\
  , null).show();\n}\n});\n}\n```\n\n如果你需要悬浮操作按钮但不需要菜单，请使用 `Basic Views Activity`\
  \ 模板并遵循以下步骤：\n\n1. 编辑主 Activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 在 Project 工具窗口中选择 `res -> menu` 选项，并按下键盘上的 `Delete` 键从项目中删除该文件夹和相应的菜单资源文件。\n\
  \n如果你需要使用 `Basic Views Activity` 模板，但既不需要导航功能也不需要第二个内容片段，请遵循以下步骤：\n\n1. 在 Project\
  \ 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n2. 在编辑器中，选择图面板中的\
  \ `SecondFragment` 条目，并按下键盘删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app -> java\
  \ -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res -> layout\
  \ -> fragment_second.xml`）文件。\n4. 最后的任务是从 `FirstFragment` 类中删除某些代码，以便 `Button` 视图在被点击时不再导航到已不存在的第二个片段。找到\
  \ `FirstFragment.java` 文件，双击将其加载到编辑器中，并移除 `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\n\
  public void onViewCreated(@NonNull View view, Bundle savedInstanceState) {\n   \
  \ super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \               .navigate(R.id.action_FirstFragment_to_SecondFragment);\n      \
  \  }\n    });\n}\n```\n\n# 17.2 Android Studio 布局编辑器\n\n如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）环境，在该环境中，可以从调色板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。一旦视图被放置在画布上，就可以进行移动、删除和调整大小（受父视图约束限制）。此外，可以使用属性（Attributes）工具窗口修改与所选视图相关的各种属性。\n\
  \n在底层，布局编辑器工具构建了一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以三种不同的模式运行：设计（Design）、代码（Code）和拆（Split）。\n\
  \n## 17.3 设计模式\n\n在设计模式下，可以直接通过视图调色板和布局的图形表示来可视化地操作用户界面。图 17-5 展示了 Android Studio\
  \ 布局编辑器在设计模式下的关键区域：\n\n![](img/as_layout_editor1.jpg)\n\n图 17-5\n\n*   **A – 调色板\
  \ (Palette)** – 调色板提供了 Android SDK 提供的系列视图组件范围。这些组件被分类以便导航。可以通过从调色板中拖动视图组件并将其掉到布局所需位置来向布局中添加项。\n\
  *   **B – 设备屏幕 (Device Screen)** – 设备屏幕提供了设计过程中用户界面布局的视觉化“所见即所得”表示。该布局允许通过选择、删除、移动和调整视图的大小来允许直接的设计操作。可以使用工具栏中的菜单随时更改布局所代表的设备模型。\n\
  *   **C – 组件树 (Component Tree)** – 如上一章所述（“理解 Android 视图、视图组和布局”](#Views_and_Layouts.xhtml__idTextAnchor359)），用户界面是使用分级结构构建的。组件树提供了用户界面设计层次结构的视觉概览。从组件树中选择元素将导致布局中相应的视图选中。同样，从设备屏幕布局中选择视图将选中组件树层次结构中的该视图。\n\
  *   **D – 属性 (Attributes)** – 调色板中列出的所有组件视图都有一组关联属性，用于调整该视图的行为和外观。布局编辑器的属性面板提供了对布局中当前选中视图属性的访问，允许进行更改。\n\
  *   **E – 工具栏 (Toolbar)** – 布局编辑器工具栏提供了各种选项的快速访问，包括但不限于缩放设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏模式之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，这些按钮会在选择相关视图类型时出现。\n*   **F – 模式切换控制 (Mode Switching\
  \ Controls)** – 这三个按钮提供了用于设计、代码和拆模式之间来回的方法。\n*   **G – 缩放和平移动控制 (Zoom and Pan Controls)**\
  \ – 此控制面板允许你对设计画布进行缩放和平和平移动。\n\n## 17.4 调色板\n\n布局编辑器调色板组织为两个面板，旨在方便查找和预览要添加到布局中的组件。类别面板（在图\
  \ 17-6 中标记为 A）列出了 Android SDK 支持的不同视图类别。当从列表中选择一个类别时，第二个面板 (B) 会更新以显示该类别的组件列表：\n\
  \n![](img/as_layout_editor_palette.jpg)\n\n图 17-6\n\n要从调色板将组件添加到画布，从组件列表或预览面板中选择该项，将其拖到画布所需的位置并释放。\n\
  \n在所选类别内搜索特定组件的方法是点击调色板工具栏上的搜索按钮（在图 17-6 中标记为 C）并输入名称。随着字符的输入，列表中将匹配的结果。如果不确定组件的类别，可以在搜索前或期间选择所有结果类别。\n\
  \n## 17.5 设计模式与视图\n\n布局编辑器默认以设计模式出现，如图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击图 17-7 中标记为\
  \ C 的按钮选择设计模式：\n\n![](img/as_layout_editor_view_mode1.jpg)\n\n图 17-7\n\n当布局编辑器工具处于设计模式时，可以通过两种方式查看布局。图\
  \ 17-5 所示的视图是设计视图，显示了在运行应用程序中的布局和控件。第二种模式是蓝图视图（Blueprint view），可以替代或与设计视图同时显示。图\
  \ 17-8 中的工具栏菜单提供了显示设计视图、蓝图视图或者的选项。还有针对色盲的设置。第五种选项强制刷新布局（Force Refresh Layout）会导致布局重新构建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，这非常有用：\n\
  \n![](img/as_layout_editor_design_surface.jpg)\n\n图 17-8\n\n显示布局视图、设计视图还是两者取决于个人喜好。一种方法是从同时显示两者开始，如图\
  \ 17-9 所示。\n\n\n\n\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n图 17-9\n\
  \n## 17.6 夜间模式\n\n在设计工作期间以夜间模式查看布局，请选择下方图 17-10 所示的菜单，并将设置更改为 Night（夜间）：\n\n![](img/as_layout_editor_night.jpg)\n\
  图 17-10\n\n模式菜单还包括测试动态颜色的选项，该主题在“Material Design 3 主题与动态颜色教程”章节中有所介绍。\n\n## 17.7\
  \ 代码模式\n\n在使用 Android Studio 布局编辑器（Layout Editor）工具时，务必记住它所做的只是提供了一种易于用户的方法来创建 XML\
  \ 布局资源文件。在设计过程中，可以通过选择上方的图 17-7 中标记为 A 的按钮，查看并直接编辑底层的 XML。\n\n图 17-11 显示了代码模式下的\
  \ Android Studio 布局编辑器，允许通过修改 XML 修改用户界面声明：\n\n![](img/as_layout_editor_code.jpg)\n\
  图 17-11\n\n## 17.8 分屏模式\n\n在分屏模式（Split mode）下，编辑器并排显示设计（Design）和代码（Code）视图，允许使用设计画布可视化地修改用户界面，并直接对\
  \ XML 声明进行更改。使用上方标记为 B 的按钮图 17-7 来选择分屏模式。\n\n对 XML 的任何更改都会反映在设计画布上，反之亦然。图 17-12\
  \ 显示了分屏模式下的编辑器：\n\n![](img/as_layout_editor_split.jpg)\n图 17-12\n\n## 17.9 设置属性\n\
  \n属性（Attributes）面板提供了对当前选中组件的所有可用设置的访问。例如，图 17-13 显示了 `TextView` 小部件的一些属性：\n\n![](img/as_layout_editor_atrributes.jpg)\n\
  图 17-13\n\n属性工具窗口分为以下不同部分：\n\n- `id` - 包含 `id` 属性，定义了当前选中对象在应用源码中引用的名称。\n- `Declared\
  \ Attributes`（已声明属性） - 包含所有已赋值的属性。\n- `Layout`（布局） - 定义当前视图对象相对于屏幕和其他布局中对象的定位和大小的设置。\n\
  - `Transforms`（变换） - 包含允许当前选中对象旋转、缩放和偏移的控件。\n- `Common Attributes`（常用属性） - 当前选中视图对象类通常需要更改的属性列表。\n\
  - `All Attributes`（所有属性） - 当前选中对象所有可用属性的完整列表。\n\n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。\n\
  \n某些属性在值字段右侧有一个窄按钮。这表示可以使用资源（Resources）对话框来帮助选择合适的属性值。要显示对话框，请点击该按钮。此按钮的外观会根据相应的属性值是存储在资源文件中还是硬编码而变化。如果值存储在资源文件中，文本属性字段右侧的按钮将填充，以指示该值不是硬编码的，如下方的图\
  \ 17-14 所示：\n\n![](img/as_layout_editor_not_hardcoded.jpg)\n图 17-14\n\n对于具有有限有效选项的属性，将显示下拉菜单（图\
  \ 17-15），可以从中进行选择。\n\n![](img/as_layout_editor_attr_options.jpg)\n图 17-15\n\n可以点击吸管图标显示颜色调色板。同样，当出现旗帜图标时，可以点击它显示该属性的选项列表，而图像图标会打开资源管理器面板，允许为该属性选择图像和其他资源类型。\n\
  \n## 17.10 变换\n\n属性工具窗口中的变换面板（图 17-16）提供了一组控件和属性，控制当前选中对象在旋转、透明度（alpha，用于视图的淡入淡出）、缩放（尺寸）和平移（相对于当前位置的偏移）视觉方面：\n\
  \n![](img/as_layout_editor_transforms.jpg)\n图 17-16\n\n面板包含视图的视觉表示，随着属性的更改而更新。这些更改也会反映在布局画布中的视图中。\n\
  \n## 17.11 工具可见性切换\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现许多定义视图外观和行为的属性以 `android:`\
  \ 前缀开头。这表示属性是在 `android` 命名空间内设置的，并在运行时生效。以下是布局文件的片段，显示了在 Button 视图上设置的属性：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"/>\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了 `tools` 命名空间。当属性设置在此命名空间内时，它们仅在布局编辑器中生效。在设计布局时，你可能会发现对于\
  \ EditText 显示某些文本很有帮助，但在运行时需要视图为空。为了实现这一点，你会使用 `tools` 命名空间设置 EditText 的文本：\n\n\
  ```xml\n<EditText\n    android:id=\"@+id/editTextPersonName\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"textPersonName\"\n    tools:text=\"Sample Text\"/>\n```\n\
  \n这种类型的工具属性是在属性窗口中通过输入值字段设置的，如图 17-17 所示：\n\n![](img/as_layout_editor_tools_attribute.jpg)\n\
  图 17-17\n\n工具属性在设计过程中更改视图的可见性非常有用。布局可能包含一个在运行时根据用户操作显示或隐藏的视图。为了模拟隐藏视图，可以在视图 XML\
  \ 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n尽管使用 `invisible`\
  \ 设置时视图不再可见，但它仍然存在于布局中并占据它可见时的相同空间。要让布局表现就像该视图不存在，应将可见性属性设置为 `gone`：\n\n```xml\n\
  tools:visibility=\"gone\"\n```\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，对应用程序运行没有影响。为了在布局编辑器和运行时都控制可见性，将使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑\
  \ XML 布局文件是一个麻烦的过程。为了方便更改这些设置，Android Studio 在布局器的组件树（Component Tree）面板中提供了一组切换按钮。要访问这些控件，请点击面板中对应视图右侧边缘。例如，图\
  \ 17-18 显示了名为 `myButton` 的 Button 视图的工具可见性切换控件：\n\n![](img/as_layout_editor_tools_attr_visibility.jpg)\n\
  图 17-18\n\n\n\n\n\n这些切换开关控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `not set`（未设置）、`visible`（可见）、`invisible`（隐藏）和\
  \ `gone`（移除）选项。当设置了冲突属性时（例如，将 `android` 命名空间开关设置为 `visible`，而 `tools` 值设置为 `invisible`），在布局预览中\
  \ `tools` 命名空间具有优先级。当选择切换选项时，Android Studio 会自动将相应的属性添加到布局文件的 XML 视图元素中。\n\n除了 `Component\
  \ Tree`（组件树）面板中的可见性切换开关外，布局编辑器还包含 `tools` 可见性和位置切换按钮，如下文 图 17-19 所示的高亮显示状态：\n\n\
  ![](img/as_layout_editor_show_tools.jpg)\n\n图 17-19\n\n此按钮用于切换当前的 `tools` 可见性设置。例如，如果上方显示的\
  \ `Button` 视图当前 `tools` 可见性属性设置为 `gone`，切换此按钮将使其变为可见。这使得在视图添加到布局或从布局中移除时，能够快速检查布局行为。此切换开关也用于检查布局中的视图是否正确约束，该主题在“在\
  \ Android Studio 中使用 ConstraintLayout 的指南”#Constraint_ Layout_in_Studio.xhtml__idTextAnchor469)章节中有所介绍。\n\
  \n### 17.12 转换视图\n\n在布局中将视图从一种类型转换为另一种类型（例如将 `TextView` 转换为 `EditText`），可以在 Android\
  \ Studio 布局编辑器中轻松实现。只需在屏幕布局或 `Component tree` 窗口中右键点击视图，并选择 `Convert view...`（转换视图...）菜单选项（[图\
  \ 17-20）：\n\n![](img/as_layout_editor_convert_view.jpg)\n\n图 17-20\n\n选中后，将弹出一个对话框，其中包含所选对象可以转换的兼容视图类型列表。例如，图\
  \ 17-21 显示了现有 `TextView` 视图可以转换的类型：\n\n![](img/as_layout_editor_convert_view_dialog.jpg)\n\
  \n图 17-21\n\n这种技术也有助于于将布局从一种类型转换为另一种类型（例如，将 `ConstraintLayout` 转换为 `LinearLayout`）。\n\
  \n### 17.13 显示示例数据\n\n在 Android Studio 中设计布局时，会出现这样一种情况：用户界面内要显示的内容在应用完成并运行之前无法可用。这有时会使得很难从布局编辑器内部评估布局在应用运行时的外观。为了解决这个问题，布局编辑器允许指定示例数据，这将用示例图像和数据填充布局编辑器中的视图。这些示例数据仅在布局编辑器中显示，在应用运行时不会显示。可以通过直接编辑布局的\
  \ XML，也可以通过视觉化使用设计时助手——即在设计区域右键点击小部件并选择 `Set Sample Data`（设置示例数据）菜单选项来配置示例数据。设计时助手面板将为所选的视图项显示一系列预配置的示例数据选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-22 显示了选择让示例数据出现在 `RecyclerView` 列表中时显示的示例数据选项：\n\n![](img/as_layout_editor_design_time_attrs.jpg)\n\
  \n图 17-22\n\n或者，可以在布局设计过程中提供用于显示的自定义文本和图像。在布局编辑器中使用示例数据的示例包含在随后的章节，标题为[“布局编辑器示例数据教程”#Sample_Data.xhtml__idTextAnchor1027]的章节。由于示例数据是通过\
  \ `tools` 属性实现的，预览中数据的可见性可以使用上方图 17-19 中高亮显示的切换按钮进行控制。\n\n### 17.14 创建自定义设备定义\n\n\
  布局编辑器工具栏中的 `device`（设备）菜单（图 17-23）提供了设备类型列表。除了预配置的设备类型外，之前在 Android Studio 中配置的任何\
  \ `AVD` 实例也会列在这里。要添加设备定义，请参考[“在 Android Studio 中创建安卓虚拟设备 (AVD)”#AVD_Creation.xhtml__idTextAnchor84]章节。\n\
  \n![](img/as_layout_editor_device.jpg)\n\n图 17-23\n\n### 17.15 更改设备\n\n作为设备选择的替代方案，可以通过从\
  \ `device` 菜单中选择 `Custom`（自定义），并拖动位于屏幕右下角的缩放柄来更改当前设备格式（图 17-24），标记将显示可用选项：\n\n![](img/as_3.5_show_layout_resize.jpg)\n\
  \n图 17-24\n\n### 17.16 布局验证\n\n布局验证允许在多个屏幕上同时预览用户界面布局。要访问布局验证窗口，点击右侧边缘或使用左下角的 `Tool\
  \ Window`（工具窗口）菜单。一旦加载，面板将如图 17-25 所示显示在多个设备配置上：\n\n![](img/as_layout_editor_device_validation.jpg)\n\
  \n图 17-25\n\n### 17.17 总结\n\n开发 Android 应用的关键部分是创建用户界面。这在 Android Studio 环境中通过布局编辑器完成，该编辑器有三种模式。在设计模式下，从调板中选择组件并放置在代表安卓设备的布局上，并使用属性列表进行配置。底层\
  \ XML 可以在代码模式下直接编辑。分割模式则允许通过视觉方式创建布局。这些模式结合提供了一个丰富且直观的用户界面设计环境。\n\n布局验证允许在各种尺寸上预览用户界面布局。\n\
  \n# 18 ConstraintLayout 指南\n\n正如理解 Android 视图、视图组和布局章节中所讨论的，Android 提供了布局管理器来设计用户界面。从\
  \ Android 7 开始，Google 引入了一种解决了许多旧布局管理器缺陷的布局。这种布局被称为 `ConstraintLayout`，它将简单、灵活且灵活的布局系统与内置的强大功能相结合，以便创建能够适应不同屏幕尺寸和设备方向变化的响应式用户界面布局。\n\
  \n本章将概述 `ConstraintLayout` 的基本概念，下一章将详细概述如何在 Android Studio 布局编辑器工具中使用 `ConstraintLayout`\
  \ 创建约束布局。\n\n### 18.1 ConstraintLayout 如何工作\n\n与所有其他布局一样，`ConstraintLayout` 管理其包含的视觉组件（也称为小部件）的位置和大小行为。它是通过在每个小部件上设置的约束连接来实现的。\n\
  \n\n\n\n\n为了充分理解并使用 `ConstraintLayout`，掌握以下核心概念至关重要：\n\n- 约束 (Constraints)\n- 边距\
  \ (Margins)\n- 相对的约束 (Opposing Constraints)\n- 约束偏置 (Constraint Bias)\n- 链 (Chains)\n\
  - 链样式 (Chain Styles)\n- 辅助 (Guidelines)\n- 组 (Groups)\n- 屏障 (Barriers)\n- 流 (Flow)\n\
  \n### 18.1.1 约束\n\n约束是决定组件相对于其他组件、`ConstraintLayout`边缘以及名为 `guidelines` 的特殊元素的对齐和距离的规则。约束还决定了\
  \ Activity 的界面布局如何响应设备方向的变化或在不同屏幕尺寸的设备上的显示。为了进行充分的配置，组件必须具有足够的约束连接，以便 `ConstraintLayout`\
  \ 布局引擎能够在水平和垂直平面上都解析其位置。\n\n### 18.1.2 边距\n\n边距是一种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 顶部和右边缘的边距约束来实现，并将它们连接到父级 `ConstraintLayout` 的相应侧，如图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，这些约束连接中的每一个都关联有一个边距值，规定了组件距离父布局两侧的固定距离。在这种配置下，无论屏幕大小或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接指定的，距离父级 `ConstraintLayout` 的顶部和右边缘分别为 20 和 15 个设备独立像素（`dp`）。\n\n\
  [content]\n\n虽然上述配置在某些情况下是可以接受的，但它在允许 `ConstraintLayout` 布局引擎通过调整组件位置来响应设备旋转以及支持不同尺寸屏幕方面没有提供任何灵活性。要向布局中添加这种响应性，则需要实现相对的约束。\n\
  \n### 18.1.3 相对的约束\n\n在单个组件上沿同一轴运行的两个约束被认为是相对约束。换句话说，在左侧和右侧都有约束的组件被认为具有水平相对约束。图\
  \ 18-2 为例，展示了在之前的布局中同时了水平和垂直相对约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了相对约束，组件的定位将基于百分比而非基于坐标。例如，组件不再被固定在距离布局顶部的\
  \ 20dp 处，而是位于距离顶部 30% 的位置。在不同的方向上以及在更大或更小的屏幕上运行时，`Button` 将始终位于相对于父布局尺寸的相同位置。\n\n\
  现在重要的是要理解到，图 18-2 中概述的布局不仅使用了相对约束，还通过应用约束偏置实现的。\n\n### 18.1.4 约束偏置\n\n现在已经确定，`ConstraintLayout`\
  \ 中的组件可能会受到相对约束连接的影响。默认情况下，相对约束是相等的，导致相应的组件在相对轴上居中。图 18-3 为例，展示了一个使用相对水平和垂直约束在包含的\
  \ `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\n图 18-3\n\n为了在存在相对约束的情况下调整组件位置，`ConstraintLayout`\
  \ 实现了一种名为“约束偏置”的功能。约束偏置允许组件沿相对轴的定位根据指定的百分比向某一个约束倾斜。图 18-4 为例，展示了先前的的约束布局，其具有 75%\
  \ 的水平偏置和 10% 的垂直偏置：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\n下一章题为“在 Android Studio\
  \ 中使用 ConstraintLayout 指南`，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android Studio 布局编辑器工具中的。然而，在此还需要涵盖\
  \ `ConstraintLayout` 类的几个领域。\n\n### 18.1.5 链\n\n`ConstraintLayout` 链提供了一种将两个或多个组件的布局行为定义为一组的方法。链可以在垂直或水平轴上声明，并配置为定义链中组件的间距和大小。\n\
  \n当组件通过双向约束连接时，它们就构成了链。图 18-5 为例，展示了三个以这种方式链链的组件：\n\n![](img/Image2468.jpg)\n\n\
  图 18-5\n\n链中的第一个元素是链头（chain head），它在垂直链中翻译为顶部组件，在水平链中则对应最左侧的组件。整个链的布局行为主要通过设置链头组件上的属性来配置。\n\
  \n### 18.1.6 链样式\n\n`ConstraintLayout` 链的布局行为由应用到链头组件上的链样式决定。`ConstraintLayout`\
  \ 类目前支持以下链样式：\n\n- 散布链 (Spread Chain) —— 链中的组件在可用空间内均匀分布。这是链的默认行为。\n![](img/Image2478.jpg)\n\
  \n图 18-6\n- 内部散布链 (Spread Inside Chain) —— 链中的组件在链头和最后一个组件之间均匀分布。头部和最后一个组件不包含在间距。\n\
  ![](img/Image2485.jpg)\n\n图 18-7\n- 权重链 (Weighted Chain) —— 允许通过权重属性定义链中每个组件占据。\n\
  ![](img/Image2492.jpg)\n\n图 18-8\n- 聚集链 (Packed Chain) —— 构成链的组件无间距聚集。可以应用偏置来控制链相对于容器的水平或垂直位置。\n\
  ![](img/Image2500.jpg)\n\n图 18-9\n\n### 18.2 基线对齐\n\n到为止，本章仅提到了相对于组件侧边的约束（通常称为侧约束）。然而，一种常见的需求是让组件相对于其显示的内容进行对齐，而不是组件本身的边界。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐支持。\n\n例如，假设之前的图 18-1 中的理论布局需要一个 `TextView` 组件放置在 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 视图基线对齐。这意味着 `Button` 内的文本需要在垂直上与 `TextView` 内的文本对齐。该布局的额外约束需要如图 18-10\
  \ 所示连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n`TextView` 现在沿 `Button` 的基线垂直对齐，并在水平上距离\
  \ `Button` 对象左边缘 40dp。\n\n### 18.3 配置组件尺寸\n\n\n\n\n\n控制控件的尺寸是用户界面设计过程中的关键元素。`ConstraintLayout`\
  \ 提供了三个可以设置在单个控件上的选项，用于管理尺寸行为。这些设置针对高度和宽度维度进行单独配置：\n\n- `Fixed`（固定）——控件固定为指定的尺寸。\n\
  - `Match Constraint`（匹配约束）——允许布局引擎调整控件的大小，以满足主导约束条件。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n- `Wrap Content`（包裹内容）——控件的大小由其内容（即文本或图形）决定。\n\n## 18.4 辅助线 (Guideline)\n\
  \n辅助线（Guidelines）是 `ConstraintLayout` 中可用的特殊元素，为约束提供了可以连接的额外目标。一个 `ConstraintLayout`\
  \ 实例中可以添加多个辅助线，这些辅助线可以被配置为水平或垂直方向。一旦添加，就可以从布局中的控件到辅助线建立约束连接。当多个控件必须沿某个轴对齐时，这特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿着一条垂直辅助线进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n## 18.5 组 (Group) Helper\n\n`ConstraintLayout` 的此功能允许将控件放置在逻辑组中，并作为一个单一实体控制这些控件的可见性。`Group`\
  \ 是布局中其他控件的引用列表。一旦定义，更改组实例的可见性属性（`visible`、`invisible` 或 `gone`）会将此更改应用到所有组成员。这使得通过更改单个属性来隐藏和显示多个控件变得非常简单。单个布局可以包含多个组，一个控件也可以属于多个组。如果组之间发生冲突，则在\
  \ XML 文件中最后声明的组具有优先级。\n\n## 18.6 屏障 (Barrier) Helper\n\n与辅助线类似，屏障（Barriers）是虚拟视图，可用于约束布局内的视图。与辅助线一样，屏障可以是垂直的或水平的，并且一个或多个视图可以被约束在它（为了避免混淆，这些被称为“受约束视图”）。与辅助线不同，辅助线在布局中保持固定位置，而屏障的位置是由一组所谓的“参考视图”定义的。屏障的引入是为了解决某些频繁发生的视图重叠问题。例如，考虑下面的图\
  \ 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\n图 18-12\n\n上述布局需要注意的关键点是：`View 3` 的宽度设置为匹配约束模式，且该视图的左边缘连接到\
  \ `View 1` 的右边缘。按照目前的实现方式，增加 `View 1` 的宽度将产生缩小 `View 3`宽宽预期效果：\n\n![](img/Image2533.jpg)\n\
  \n图 18-13\n\n然而，如果增加 `View 2` 的宽度而不是 `View 1`，就会出现问题：\n\n![](img/Image2540.jpg)\n\
  \n图 18-14\n\n由于 `View 3` 仅受到 `View 1` 的约束，它不会为了适应 `View 2` 宽度的增加而调整大小，导致视图重叠。\n\n\
  解决此问题的方案是添加一个垂直屏障并将 `View 1` 和 `View 2` 分为屏障的参考视图，以便它们控制屏障的位置。这样 `View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，屏障将移动以适应两个视图中较宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和约束视图的数量没有限制。\n\n## 18.7\
  \ 流 (Flow) Helper\n\n`ConstraintLayout` Flow 允许以流式网格样式布局显示视图组。与 `Group` Helper 类似，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了各种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大控件数量）、间距和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括扩散（spread）、内部扩散（spread inside）和打包（packed）选项。\n\n图 18-16 表示了使用 `Flow`\
  \ Helper 实例在水平模式下定位的五个大小相同的按钮的布局，且没有换行设置：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n\
  图 18-16\n\n图 18-17 显示了相同的按钮在水平流配置中的情况，并设置为每第三个控件后进行换行：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了换行设置为使用内部扩散的链模式的按钮（其效果仅在第二行可见，因为第一行已满）。该配置还设置了 `gap`\
  \ 属性以添加按钮之间的间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\n作为\
  \ Flow Helper 灵活性的最后一个演示，图 18-19 显示了在水平模式下每三个换行的五个大小不同的按钮。此外，通过将 `horizontal-bias`\
  \ 值设置为 `1.0`，网格内容实现了右对齐（设置为 `0.5` 则将网格内容居中）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  \n图 18-19\n\n## 18.8 比例\n\n控件的尺寸可以使用比例设置定义。例如，一个控件可以使用比例设置进行约束，使得无论如何调整大小，宽度始终是高度的两倍。\n\
  \n## 18.9 ConstraintLayout 的优势\n\n`ConstraintLayout` 提供的灵活性允许通过单个布局实现许多旧布局的功能，而以前这需要嵌套多个布局。通过允许设计所谓的“扁平”或“浅层”布局层级，避免了布局嵌套带来的固有问题，既减少了布局的复杂性，又提高了运行时用户界面的性能。\n\
  \n`ConstraintLayout` 的实现也是为了解决当今各种 Android 设备屏幕尺寸的问题。`ConstraintLayout` 的灵活性使得设计能够响应并适应运行应用程序设备的用户界面变得更加容易。\n\
  \n最后，正如“如何在 Android Studio 中使用 ConstraintLayout”章节将演示的，Android Studio 布局编辑器工具已专门针对\
  \ ConstraintLayout 的用户界面设计进行了增强。\n\n## 18.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout`\
  \ 是随着 Android 7 引入的，但它是作为主 Android SDK 的独立支持库提供的，兼容直到 API  9（Gingerbread）的旧 Android\
  \ 版本。这使得使用此布局的应用程序可以在运行较旧版本 Android 的设备上运行。\n\n## 18.11 总结\n\n\n\n\n\n`ConstraintLayout`\
  \ 是随 Android 7 引入的一种布局管理器。它的设计旨在简化创建灵活的布局，以适应市场上多种 Android 设备的尺寸和方向。`ConstraintLayout`\
  \ 使用约束来控制控件相对于父 `ConstraintLayout` 实例、辅助线（guidelines）、屏障（barriers）以及布局与其他控件的对齐和定位。`ConstraintLayout`\
  \ 是新创建的 Android Studio 项目的默认布局，并在设计用户界面布局时推荐使用。这种简单而灵活的布局管理方法可以轻松实现复杂的响应式用户界面。\n\
  \n## 19. 在 Android Studio 中使用 ConstraintLayout 指南\n\n正如在前面的章节中多次提到的，Google 对 `Android\
  \ Studio-Layout Editor` 工具进行了重大更改，其中许多更改仅是为了支持使用 `ConstraintLayout` 进行用户界面布局设计。既然上一章已经概述了\
  \ `ConstraintLayout` 的基本概念，本章将详细探讨这些概念，同时概述 `Layout Editor` 工具如何允许设计和实现基于 `ConstraintLayout`\
  \ 的用户界面。\n\n## 19.1 设计与布局视图\n\n名为《Android Studio 布局编辑器指南》 的章节解释了 `Android Studio\
  \ Layout Editor` 工具提供了两种方式来查看 Activity 的用户界面布局，即 `Design`（设计）和 `Layout`（布局，也称为蓝图）视图。这些视图可以单独显示，也可以像图\
  \ 19-1 所示并排显示：\n\n![](img/as_design_and_blueprint.jpg)\n\n图 19-1\n\n`Design` 视图（位于上图左侧）呈现布局的“所见即所得”表示，其中布局以其在运行应用程序中的形式显示。另一方面，`Layout`\
  \ 视图显示蓝图风格的视图，其中阴影轮廓表示控件。如上面的图 19-1 所示，`Layout` 视图还显示约束连接（在本例中，用于将按钮居中于布局的对立约束）。当选择布局中的特定控件或鼠标指针悬停在设计区域上时，这些约束也会叠加到\
  \ `Design` 视图上，如图 19-2](#Constraint_Layout_in_Studio.xhtml__idTextAnchor474)所示：\n\
  \n![](img/as_design_canvas_with_constraints.jpg)\n\n图 19-2\n\n两种视图中约束连接的外观可以使用如图\
  \ 19-3 所示的 `View Options` 菜单进行更改：\n\n![](img/as_layout_view_options.jpg)\n\n图 19-3\n\
  \n除了显示用户界面布局的两种模式外，`Layout Editor` 工具提供了三种方式来建立特定布局设计所需的约束。\n\n## 19.2 自动连接模式 (Autoconnect)\n\
  \n`Autoconnect` 正如其名，会在项目添加到布局中时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮开启或关闭 `Autoconnect`\
  \ 模式：\n\n![](img/as_layout_autoconnect.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法来确定最佳约束。如果任何自动连接未能提供预期的行为，可以对其进行更改。\n\
  \n## 19.3 推断模式 (Inference)\n\n`Inference` 模式在关闭 `Autoconnect` 功能时，使用启发式方法来填充缺失的约束。这种模式通常用于“绘制”布局。当点击\
  \ `Infer` 按钮时，约束会自动添加到布局中，如图 19-5 所示：\n\n![](img/as_layout_infer.jpg)\n\n图 19-5\n\
  \n## 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解控件周围出现的各种句柄将很有帮助。例如，考虑图 19-6 所示的控件：\n\
  \n![](img/as_constraint_markers.jpg)\n\n图 19-6\n\n弹簧状线条 (`A`) 代表从控件侧边引出的已建立的约束连接。对象每个角的小正方形标记\
  \ (`B`) 是缩放句柄，点击并拖动它们可以缩放控件。位于每侧的小圆圈句柄 (`C`) 是侧边锚点。要创建约束连接，点击句柄并将生成的连线拖到另一个控件的目标侧边，如图\
  \ 19-7 所示。当控件和句柄被高亮时：\n\n![](img/as_layout_drag_constraint.jpg)\n\n图 19-7\n\n如果将约束线拖动到控件并释放但未附加到句柄，布局编辑器将显示一个菜单，包含约束可以附加的边列表。例如，在图\
  \ 19-8 中，约束可以附加到目标按钮的顶部或底部边缘：\n\n![](img/as_constraint_drag_between_edges.jpg)\n\
  \n图 19-8\n\n额外的标记指示基线约束的锚点，其中控件内部的内容（而非边缘）被用作对齐点。要显示此标记，右键点击控件并选择 `Show Baseline`\
  \ 选项。要从基线约束句柄建立连接，将鼠标指针悬停在句柄上直到其高亮，然后拖动到目标（例如另一个控件的基线锚点，如图 19-9 所示）：\n\n![](img/as_constraint_baselines.jpg)\n\
  \n图 19-9\n\n要隐藏基线锚点，再次右键点击控件并选择 `Hide Baseline` 选项。\n\n## 19.5 在检查器中添加约束\n\n也可以使用\
  \ `Android Studio Layout Editor` 工具中 `Attributes` 窗口的 `Inspector` 面板为视图添加约束，如图 19-10\
  \ 所示。中间的正方形表示当前选中的视图，正方形周围的区域表示应用于视图对应侧的约束（如果有的话）：\n\n![](img/as_constraint_attributes.jpg)\n\
  \n图 19-10\n\n\n\n\n\n视图一侧缺少约束由一条指向包含加号的蓝色圆圈的虚线表示（如上图中的视图底部所示）。要添加约束，请点击此蓝色圆圈，布局编辑器将添加一个连接到它认为的布局内最合适目标的约束。\n\
  \n### 19.6 在属性窗口中查看约束\n\n通过显示 `Attributes` 工具窗口中的 `Constraints` 部分，可以查看在当前选中的小部件上配置的约束列表，下方的图\
  \ 19-11 所示：\n\n![](img/as_attributes_constraints_section.jpg)\n\n图 19-11\n\n点击列表中的约束将在设计布局中选中该约束。\n\
  \n### 19.7 删除约束\n\n要删除单个约束，请在设计布局内或 `Attributes` 工具窗口中选择该约束使其高亮（例如，在图 19-12 中，最右侧的约束已被选中），然后按下键盘上的\
  \ delete 键。该约束将从布局中移除。\n\n![](img/as_constraint_selected.jpg)\n\n图 19-12\n\n另一种选项是在按住\
  \ `Ctrl`（macOS 上为 `Cmd`）键的同时将鼠标指针悬停在约束锚点上，并在变红后点击锚点：\n\n![](img/as_constraint_anchor_delete.jpg)\n\
  \n图 19-13\n\n或者，通过右键点击小部件并选择 `Clear Constraints of Selection` 菜单选项来移除小部件上的所有约束。\n\
  \n要移除布局中每个小部件的所有约束，请使用图 19-14 中高显示的工具栏按钮：\n\n![](img/as_layout_delete_constraint.jpg)\n\
  \n图 19-14\n\n### 19.8 调整约束偏置\n\n上一节概述了使用偏置（bias）设置来偏向一个对立约束而非另一个约束的概念。Android Studio\
  \ 布局编辑器工具中的偏置通过 `Attributes` 工具窗口中的 `Inspector` 进行调整，如图 19-15 所示。图中箭头指示的两个滑块用于控制当前选中小部件的垂直和水平对立约束的偏置。\n\
  \n![](img/as_constraint_bias_sliders.jpg)\n\n图 19-15\n\n### 19.9 理解 ConstraintLayout\
  \ 边距\n\n约束可以配合边距（margins）来实现小部件与另一个元素（如另一个小部件、辅助线或父布局侧边）之间的固定间隙。例如，考虑应用于图 19-16\
  \ 中 `Button` 对象上的水平约束：\n\n![](img/as_constraint_no_margins.jpg)\n\n图 19-16\n\n按照目前的配置，水平约束运行到父级\
  \ `ConstraintLayout` 的左右边缘。因此，该小部件具有对立的水平约束，表明 `ConstraintLayout` 布局引擎在运行时对小部件的实际位置具有裁量权。这使得布局具有一定的灵活性以适应不同的屏幕尺寸和设备方向。水平偏置设置也可以控制小部件的位置一直到布局的右侧。图\
  \ 19-17 例如显示了同一个按钮应用了 100% 的水平偏置：\n\n![](img/as_constraint_100_bias.jpg)\n\n图 19-17\n\
  \n`ConstraintLayout` 边距可能会出现在约束连接的末端，代表一个固定间隙，在该间隙内即使调整偏置或响应活动中其他地方的布局变化，小部件也无法移动。在图\
  \ 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使偏置仍设置为 100%，小部件也无法移动此处。\n\n![](img/as_constraint_bias_with_margin.jpg)\n\
  \n图 19-18\n\n小部件上现有的边距值可以在 `Inspector` 中进行修改。如图 19-19 所示，正在使用下拉菜单将当前选中小部件的右边距更改为\
  \ `16dp`。或者，点击当前值也允许在字段中输入数字。\n\n![](img/as_constraint_set_margin.jpg)\n\n图 19-19\n\
  \n新约束的默认边距可以随时使用图 19-20 中高显示的工具栏选项进行更改：\n\n![](img/as_constraints_default_margin.jpg)\n\
  \n图 19-20\n\n### 19.10 对立约束和偏置的重要性\n\n如上一节所述，在在使用 `ConstraintLayout` 时，对立约束、边距和偏置构成了\
  \ Android 响应式布局设计的核心基石。当小部件在没有对立约束连接的情况下被约束时，这些约束本质上是边距约束。在布局编辑器中通过带有测量值的实线表示，如图\
  \ 19-21 所示：\n\n![](img/as_constraint_no_opposing.jpg)\n\n图 19-21\n\n上述约束固定了位置。结果是，当设备旋转到横屏模式时，由于垂直约束将其推出了设备边缘（如图\
  \ 19-22 所示）。如果要在比设计时更小的屏幕上运行，会出现类似的问题。\n\n![](img/as_constraint_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现对立约束时，约束连接由弹簧状线表示（弹簧比喻旨在指示小部件的位置没有固定在绝对的 `X` 和 `Y` 坐标上）：\n\n![](img/as_constraints_opposing.jpg)\n\
  \n图 19-23\n\n在上述布局中，偏置设置使得小部件始终位于距离底部 90% 处，距离左边缘 35% 处。因此，当旋转时，小部件相对于屏幕尺寸仍然可见并处于相同位置：\n\
  \n![](img/as_constraint_opposing_landscape.jpg)\n\n图 19-24\n\n在设计响应式且自适应的用户布局时，手动设计布局和修正自动创建的约束时，考虑偏置和对立约束是非常重要的。\n\
  \n### 19.11 配置小部件尺寸\n\n`ConstraintLayout` 中小部件的内部维度也可以 `Inspector` 进行配置。如上一节概述，小部件维度可以设置为包裹内容、固定或匹配约束。当前选中小部件每个维度的设置显示在\
  \ `Inspector` 中代表小部件的正方形内，如图 19-25 所示：\n\n![](img/as_constraint_dimensions.jpg)\n\
  \n图 19-25\n\n上述图形将水平和垂直维度设置为包裹内容模式（由向内的箭头指示）。 检查器使用以下视觉指示来表示三种维度模式：\n\n| 固定尺寸 |\
  \ ![](img/Image2826.jpg) |\n| :--- | :--- |\n| 匹配约束 | ![](img/Image2834.jpg) |\n\
  | 包裹内容 | ![](img/Image2844.jpg) |\n\n表 19-1\n\n要更改当前设置，点击指示器以循环切换三种设置。\n\n\n\n\n\
  \n此外，可以使用`Expand Horizontally`（水平扩展）和`Expand Vertically`（垂直扩展）选项将组件的大小按水平或垂直方向扩展到约束以及布局中其他组件允许的最大范围。可以通过右键点击布局中的组件，并在弹出的菜单中选择`Organize`（组织）选项来访问这些功能（图\
  \ 19-26）。使用时，当前选中的组件将水平或垂直增大以填充其周围的可用空间。\n\n![](img/as_constraint_expand_menu.jpg)\n\
  \n图 19-26\n\n## 19.12 设计时工具定位\n\n名为“Android Studio 布局编辑器工具指南”的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它来设置仅在布局编辑器中生效可见性属性。在后台，Android\
  \ Studio 还会使用 `tools` 属性在组件放置于没有约束的布局中时保持其位置。例如，想象在禁用自动连接模式时将一个 `Button` 放置在布局上。虽然组件在预览画布中看起来处于正确位置，但运行应用时，它将出现在屏幕左上角。这是因为组件没有约束来告诉\
  \ `ConstraintLayout` 父布局应该将其放置在哪里。\n\n组件在布局编辑器中看起来位于正确位置，是因为 Android Studio 设置了绝对\
  \ `X` 和 `Y` 定位工具属性，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，其内容可能如下：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了足够的约束，布局编辑器将移除这些\
  \ `tools` 属性。一种快速识别哪些组件缺少约束而无需等待应用运行的实用技巧是：点击图 19-27 中被高亮的按钮来切换工具位置的可见性。任何跳转到左上角的组件都未被完全约束，它们正由临时的工具绝对\
  \ `X` 和 `Y` 定位属性固定位置。\n\n![](img/as_constraint_tool_button.jpg)\n\n图 19-27\n\n##\
  \ 19.13 添加辅助线\n\n辅助线（Guidelines）提供了可以作为约束锚点的额外元素。可以通过右键点击布局，并选择`Vertical Guideline`（垂直辅助线）或`Horizontal\
  \ Guideline`（水平辅助线）菜单选项，或使用工具栏菜单选项添加辅助线，如图 19-28 所示：\n\n![](img/as_layout_guideline_menu.jpg)\n\
  \n图 19-28\n\n或者，也可以从`Palette`（调色板）的`Helpers`（助手）部分拖动水平和垂直的 `Guidelines` 到布局画布或`Component\
  \ Tree`（组件树）面板上，如图 19-29 中的箭头所示：\n\n![](img/as_adding_guidelines.jpg)\n\n图 19-29\n\
  \n添加后，辅助线将以虚线的形式显示在布局中，可以通过点击并拖动该线来移动。要建立到辅助线的约束连接，点击组件的约束句柄并在释放前将其拖动到辅助线上。在图 19-30\
  \ 中，两个`Buttons`的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离（水平辅助线则为距离顶部或底部）。例如，下图中的垂直辅助线位于父布局左边缘\
  \ `97dp` 处：\n\n![](img/as_constrain_guideline.jpg)\n\n图 19-30\n\n或者，辅助线可以定位为父布局总宽度或高度的百分比。要在这三种模式之间切换，请选择辅助线并点击辅助线底部或末端的圆（取决于辅助线是垂直还是水平的）。例如，图\
  \ 19-31 显示了一个基于百分比定位的辅助线：\n\n![](img/as_adding_guideline_percent.jpg)\n\n图 19-31\n\
  \n## 19.14 添加屏障\n\n屏障（Barriers）可以通过右键点击布局，并在`Add helpers`（添加助手）菜单中选择`Vertical`（垂直）或`Horizontal\
  \ Barrier`（水平屏障）选项，或使用工具栏菜单选项添加，如图 19-28 所示。或者，在`Palette`的`Helpers`部分找到`Barrier`类型并将其拖放到布局画布或`Component\
  \ Tree`面板上。\n\n一旦在布局中添加了屏障，它将作为`Component Tree`面板中的一项显示：\n\n![](img/as_component_tree_barrier.jpg)\n\
  \n图 19-32\n\n要将视图作为参考视图（即控制屏障位置的视图），从`Component Tree`中将组件拖到屏障上。在图 19-33 中，例如，`textView2`和`textView3`已被分配为屏障的参考视图：\n\
  \n![](img/as_reference_views.jpg)\n\n图 19-33\n\n添加参考视图后，需要配置屏障以指定相对于这些视图的方向。当`Component\
  \ Tree`中选中屏障时，这是`Attributes`窗口定义的屏障方向设置：\n\n![](img/as_barrier_direction.jpg)\n\n\
  图 19-34\n\n下图显示了一个包含屏障的布局，`textView1`和`textView2`作为参考视图，`textview3`作为约束视图。由于屏障从参考视图的`end`推向约束视图，屏障方向设置为`end`：\n\
  \n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-35\n\n## 19.15 添加分组\n\n要在布局中添加`Group`，右键点击布局，并在`Add\
  \ helpers`菜单中选择`Group`选项，或使用图 19-28 所示的工具栏选项。\n\n要将组件添加到分组，在`Component Tree`中选中它们并拖到`Group`条目上。图\
  \ 19-36 中显示了三个选中的组件被添加到组中：\n\n![](img/as_constrain_group.jpg)\n\n图 19-36\n\n分组引用的任何组件将以斜体显示在`Component\
  \ Tree`中分组条目的下方，如图 19-37 所示。要从分组中移除组件，选择它并按下键盘删除键：\n\n![](img/as_constrain_group_added.jpg)\n\
  \n图 19-37\n\n一旦组件分配给分组，使用`Attributes`工具窗口的`Constraints`部分来修改可见性设置：\n\n![](img/as_group_invisible.jpg)\n\
  \n图 19-38\n\n## 19.16 使用 Flow 助手\n\n\n\n\n\n可以通过菜单或 `Palette`（调面板）添加 Flow 助手，正如前文对其他助手概述的那样。与\
  \ `Group` 助手（图 19-36）一样，通过将组件从 `Component Tree`（组件树）拖动到 `Flow` 条目即可添加到 `Flow` 实例。添加\
  \ Flow 助手并为其分配组件后，在 `Component Tree` 中选中它，并使用 `Attribute` 工具窗口的 `Common Attributes`（常用属性）部分配置流布局行为：\n\
  \n![](img/as_flow_attributes.jpg)\n\n图 19-39\n\n### 19.17 组件组对齐与分布\n\nAndroid Studio\
  \ 布局编辑器工具提供了一系列对齐和分布操作，当在布局中选择两个或多个组件时可以执行这些操作。按 Shift 点击要参与操作的每个组件，在布局上点击右键，从 `Align`（对齐）菜单中显示的许多选项中进行选择：\n\
  \n![](img/as_layout_align_menu.jpg)\n\n图 19-40\n\n如下方的 图 19-41 所示，这些选项也可以通过 `Layout\
  \ Editor` 工具栏上的 `Align` 按钮访问：\n\n![](img/as_layout_align_menu_2.jpg)\n\n图 19-41\n\
  \n同样，`Pack`（打包）菜单（图 19-42）可以用于共同重新定位所选组件，使它们在垂直或水平方向上紧密排列在一起。它通过更改组件的绝对 `x` 和 `y`\
  \ 坐标来实现，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选组件，使其在垂直或水平轴上均匀间距分布，并在视图之间应用约束以保持这种间距：\n\
  \n![](img/as_layout_pack_menu.jpg)\n\n图 19-42\n\n### 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一个或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，布局编辑器工具提供了将用户界面转换为使用\
  \ `ConstraintLayout` 的选项。\n\n当 `Layout Editor` 工具打开并处于设计模式时，`Component Tree` 面板显示在\
  \ `Palette` 下。要将布局转换为 `ConstraintLayout`，在 `Component Tree` 中找到它，右键点击它，并选择 `Convert\
  \ <current layout> to Constraint Layout` 菜单选项：\n\n![](img/as_layout_convert_view_menu.jpg)\n\
  \n图 19-43\n\n选择此菜单选项时，Android Studio 将将所选布局转换为 `ConstraintLayout`，并使用推理建立设计以匹配原始布局类型行为的约束。\n\
  \n### 19.19 总结\n\n重新设计的 `Layout Editor` 工具结合 `ConstraintLayout`，使用 Android Studio\
  \ 设计复杂的用户界面布局变成了一个相对快速且直观的过程。本章详细介绍了约束（constraints）、外边距（margins）和偏移（bias）的概念，同时探索了基于\
  \ `ConstraintLayout` 的设计如何集成到 `Layout Editor` 工具中。\n\n## 20. 在 Android Studio 中使用\
  \ ConstraintLayout 链和比例\n\n之前的章节已经介绍了 `ConstraintLayout` 类的关键功能，并概述了在 Android Studio\
  \ `Layout Editor` 中基于 `ConstraintLayout` 的用户界面设计的最佳实践。尽管 `ConstraintLayout` 链（chains）和比例（ratios）的概念在标题为\
  \ “Android ConstraintLayout 指南”(Guide to the Android ConstraintLayout) 的章节中概述过，但我们尚未讨论如何在\
  \ `Layout Editor` 中使用这些功能。因此，本章的重点是提供在使用 `ConstraintLayout` 类时创建和管理链和比例的实用步骤。\n\n\
  ## 20.1 创建链\n\n链可以通过在 Activity 的 XML 布局资源文件中添加几行代码，或通过使用 `Layout Editor` 的某些链特定功能来实现。\n\
  \n考虑一个由三个 `Button` 组件组成的布局，它们被约束定位在 `ConstraintLayout` 父布局的左上角、顶部中央和右上角，如图 20-1](#Chains_and_Ratios.xhtml__idTextAnchor532)\
  \ 所示：\n\n![](img/as_three_button_row.jpg)\n\n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮组件的条目：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:text=\"Button\"\n   \
  \ app:layout_constraintHorizontal_bias=\"0.5\"\n    app:layout_constraintEnd_toStartOf=\"\
  button3\"\n    app:layout_constraintStart_toEndOf=\"button1\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n<Button\n    android:id=\"@+id/button3\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toEndOf=\"\
  button2\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n按照目前的配置，没有双向约束将这些组件分组成链。为了解决这个问题，需要添加从\
  \ `button1` 右侧到 `button2` 左侧，以及从 `button3` 左侧到 `button2` 右侧的额外约束，如下所示：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintEnd_toStartOf=\"button2\" />\n<Button\n    android:id=\"\
  @+id/button2\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toStartOf=\"button3\"\n    app:layout_constraintStart_toEndOf=\"\
  button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n<Button\n    android:id=\"\
  @+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toEndOf=\"\
  button2\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n通过这些更改，组件现在配置了双向水平约束。这构成了\
  \ ConstraintLayout 链，通过链连接在 `Layout Editor` 中视觉化表示，如下方的 图 20-2 所示。注意，在此配置下，链默认使用了扩散链（spread\
  \ chain）样式。\n\n![](img/as_layout_chain.jpg)\n\n图 20-2\n\n### 20.2 更改链样式\n\n也可以通过右键点击一个视图并选择\
  \ `Chains -> Create Horizontal Chain`创建水平链）或 `Chains -> Create Vertical Chain`创建垂直链）菜单选项来创建链。\n\
  \n\n\n\n\n如果没有配置链的样式，`ConstraintLayout` 将默认使用散开链（spread chain）样式。可以通过右键点击链中的任何组件并选择\
  \ `Cycle Chain Mode`（循环链模式）菜单选项来更改链样式。每点击一次菜单选项，样式就会按照散开（spread）、链内散开（spread inside）和聚集（packed）的顺序切换到另一种设置。\n\
  \n或者，也可以在属性（Attributes）工具窗口中指定样式，展开 `layout_constraints` 属性，并根据链的方向更改 `horizontal_chainStyle`\
  \ 或 `vertical_chainStyle` 属性：\n\n![](img/as_layout_chain_style.jpg)\n图 20-3\n\n\
  ### 20.3 链内散开链样式\n\n图 20-4 阐述了使用上述技术将链样式更改为链内散开链样式的效果：\n\n![](img/as_layout_chain_spread_inside.jpg)\n\
  图 20-4\n\n### 20.4 聚集链样式\n\n使用相同的技术，将链样式属性更改为聚集（packed）会导致布局发生变化，如图 20-5 所示：\n\n\
  ![](img/as_layout_chain_packed.jpg)\n图 20-5\n\n### 20.5 带有偏移的聚集链\n\n聚集链的位置可能会受到应用偏移值（bias\
  \ value）的影响。偏移值可以在 0.0 到 1.0 之间，其中 0.5 代表父容器的中心。偏移通过选择链的头部组件并在属性面板中为 `layout_constraintHorizontal_bias`\
  \ 或 `layout_constraintVertical_bias` 属性分配一个值来控制。图 20-6 显示了一个水平偏移量 设置为 0.2 的聚集链：\n\
  \n![](img/as_layout_chain_packed_bias.jpg)\n图 20-6\n\n### 20.6 加权重链\n\n最后一个需要探索的链区域涉及对单个组件进行加权，以控制链中每个组件在可用空间中所占的比例。加权重链只能使用散开链样式实现，并且链中任何响应权重属性的组件必须将其相应的尺寸属性（垂直链为高度，水平链为宽度）配置为“匹配约束”（match\
  \ constraint）模式。组件尺寸的匹配约束模式可以通过选择该组件、显示属性面板并将尺寸更改为 `match_constraint`（等同于 0dp）来配置。例如，在图\
  \ 20-7 中，一个按钮的 `layout_width` 约束已设置为 `match_constraint` (0dp)，表示该组件的宽度将根据现有的约束设置来确定：\n\
  \n![](img/as_match_constraints.jpg)\n图 20-7\n\n假设已选择散开链样式且所有三个按钮都已配置为宽度维度设置为匹配约束，则链中的组件将等比例扩展以填充可用空间：\n\
  \n![](img/as_layout_unweighted_chain.jpg)\n图 20-8\n\n每个组件相对于链中其他组件所占的空间量可以通过向组件添加权重属性来控制。图\
  \ 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight` 属性设置为 4，将 `button2`\
  \ 和 `button3` 的属性均设置为 2 的效果：\n\n![](img/as_layout_weighted_chain.jpg)\n图 20-9\n\n\
  由于这些权重值，`button1` 占据了空间的一半 (4/8)，而 `button2` 和 `button3` 各占据了空间的四分之一 (2/8)。\n\n\
  ### 20.7 使用比例\n\n`ConstraintLayout` 比例（ratios）允许一个组件的尺寸相对于该组件的另一个维度进行调整（也称为宽高比）。例如，可以对\
  \ `ImageView` 应用宽高比设置，以确保其宽度始终是高度的两倍。\n\n尺寸比例约束通过将受约束的维度设置为匹配约束模式，并将该组件上的 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来完成。该比例值可以以浮点值或宽:高比例设置的形式指定。例如，下面的 XML 代码段为 `ImageView` 组件配置了 2:1 的比例：\n\
  \n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_constraintDimensionRatio=\"\
  2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这涉及到在比例前加上\
  \ `H` 或 `W`，以指示哪一个维度是相对于另一个维度受约束的。\n\n例如，考虑以下 `ImageView` 对象的 XML 代码段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraint_toBottomOf=\"parent\"\
  \n    app:layout_constraintRight_toOf=\"parent\"\n    app:layout_constraintLeft_toOf=\"\
  parent\"\n    app:layout_constraintTop=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W:3\" />\n```\n\n在上面的示例中，高度将根据其所应用的约束来定义。在这种情况下，约束已配置为相对于父容器，使其延伸到整个父容器的高度。另一方面，宽度维度被约束为高度的三分之一。因此，无论布局在什么尺寸或方向上显示，ImageView\
  \ 的高度始终与父容器相同，宽度为高度的三分之一。\n\n### 20.8 总结\n\n链和比例都是 `ConstraintLayout` 的强大功能，旨在为\
  \ Android 应用程序中设计灵活且响应式的用户界面布局提供额外的选项。如本文所述，Android Studio 编辑器已经过增强，以便在用户界面设计过程中使用这些功能。\n\
  \n## 21. Android Studio 编辑器教程\n\n设计 Android 应用程序的用户界面最简单且有效的方法是使用 Android Studio\
  \ 编辑器工具。本章将概述如何使用这种方法创建基于 `ConstraintLayout` 的用户界面。本章包含的练习也将作为一个机会，引导从一个“空白”的 Android\
  \ Studio 项目开始创建一个 Activity。\n\n在介绍了 Android Studio 编辑器的用法后，本章还将介绍布局检查器（Layout Inspector）工具。\n\
  \n#### 21.1 Android Studio 编辑器示例\n\n此示例阶段的第一步是创建一个新的 Android Studio 项目。启动 Android\
  \ Studio 并通过选择 File -> Close Project 菜单选项关闭任何之前打开的项目。\n\n\n\n\n\n从欢迎屏幕选择 New Project（新建项目）选项，选择\
  \ Empty Views Activity（空视图活动）模板，并点击 Next（下一步）。在 Name（名称）字段中输入 `LayoutSample` 并指定\
  \ `com.ebookfrenzy.layoutsample` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API\
  \ 级别）设置改为 `API 26`：`Android 8.0 (Oreo)`，并将 Language（语言）菜单设置为 `Java`。\n\n## 21.2\
  \ 准备布局编辑器环境\n\n在 `app -> res -> layout` 文件夹中找到并双击 `activity_main.xml` 布局文件，将其加载到\
  \ Layout Editor（布局编辑器）工具中。由于本教程旨在积累约束的使用经验，请使用工具栏上的按钮关闭 Autoconnect（自动连接）功能。禁用后，按钮将出现一条删除线，如图\
  \ 21-1 所示：\n\n![](img/as_layout_sample_autoconnect_off.jpg)\n\n图 21-1\n\n如果 Autoconnect\
  \ 按钮右侧的默认边距值未设置为 `8dp`，请点击并在生成的面板中选择 `8dp`。\n\n用户界面设计还将使用 `ImageView` 对象来显示图像。在继续之前，应将此图像添加到项目中，以便稍后在章节中使用。该文件名为\
  \ `GalaxyS23.webp`，可以在以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.payloadbooks.com/product/iguanajava`](https://www.payloadbooks.com/product/iguanajava)\n\
  \n在 Android Studio 中，显示 Resource Manager（资源管理器）工具窗口（`View -> Tool Windows -> Resource\
  \ Manager`）。在操作系统的文件导航器中找到 `GalaxyS23.webp` 图像，并将其拖放到 Resource Manager 工具窗口中。在弹出的对话框中，点击\
  \ `Next`，然后点击 `Import`（导入）按钮将图像添加到项目中。图像现在应出现在 Resource Manager 中，如下方的图 21-2 所示：\n\
  \n![](img/as_resource_manager.jpg)\n\n图 21-2\n\n图像还将出现在 Project 工具窗口的 `res -> drawables`\
  \ 部分：\n\n![](img/as_layout_sample_image_added.jpg)\n\n图 21-3\n\n## 21.3 向用户界面添加小部件\n\
  \n从 `Common`（常用）调色板类别中，将 `ImageView` 对象拖入显示视图的中心。注意，此时会出现水平和垂直虚线，这表示显示的中心轴。居中后，释放鼠标按钮将视图放置在目标位置。一旦放置在布局中，将出现\
  \ Resources（资源）对话框，请求选择要在在视图中显示的图像。在对话框顶部的搜索栏中，输入“galaxy”以定位 `galaxys6.png` 资源，如图\
  \ 21-4 所示：\n\n![](img/as_pick_a_resource.jpg)\n\n图 21-4\n\n选择该图像并点击 `OK`（确定）将其分配给\
  \ `ImageView` 对象。如有必要，使用调整手柄调整 `ImageView` 的大小并将其重新定位到布局的中心。此时，布局应与图 21-5 保持一致：\n\
  \n![](img/as_layout_sample_image_layout.jpg)\n\n图 21-5\n\n从调色板的 `Common` 部分点击并拖动\
  \ `TextView` 对象，将其放置在 `ImageView` 之上，如图 21-6 所示。\n\n使用 Attributes（属性）面板，展开 Common\
  \ Attributes（常用属性）部分中的 `textAppearance` 属性项，将 `textSize` 属性改为 `24sp`，`textAlignment`（文本对齐）设置改为\
  \ `center`（居中），并将文本改为“Samsung Galaxy S23”。\n\n![](img/as_layout_sample_textview.jpg)\n\
  \n图 21-6\n\n接下来，在布局底部添加三个 `Button` 小部件，并将这些视图的 `text` 属性设置为“Buy Now”（立即购买）、“Pricing”（定价）和“Details”（详情）。完成后的布局现在应与图\
  \ 21-7 一致：\n\n![](img/as_layout_sample_full_ui.jpg)\n\n图 21-7\n\n此时，小部件的约束尚不足，以至于布局引擎能够在运行时对小部件进行定位和调整大小。如果现在运行应用，所有小部件都将位于在显示器的左上角。\n\
  \n在布局中添加小部件后，使用 Layout Editor 工具栏上的设备旋转菜单（如图 21-8 中的箭头所示）以横屏模式查看用户界面：\n\n![](img/as_layout_rotate.jpg)\n\
  \n图 21-8\n\n由于缺少约束，布局无法适应设备方向的变化，导致内容偏离中心，并且图像的一部分以及三个按钮都位于屏幕的可视区域之外。为了使此界面正常工作，还需要进行一些工作。\n\
  \n## 21.4 添加约束\n\n约束是创建能够适应设备方向变化的布局的关键。首先将布局旋转回竖屏模式，并选择 `ImageView` 之上的 `TextView`\
  \ 小部件。在选中 `TextView` 的情况下，在其左侧、右侧和顶部建立相对于父布局的约束，如图 21-9 所示。将顶部间距设置为 `16`：\n\n![](img/as_layout_sample_textview_constraints.jpg)\n\
  \n图 21-9\n\n约束 `TextView` 后，选择 `ImageView` 实例，在其左右两侧建立到父布局相应边的约束。接下来，建立从 `ImageView`\
  \ 顶部到 `TextView` 底部的约束，以及从 `ImageView` 底部到中心 `Button` 小部件顶部的约束。如有必要，点击并拖动 `ImageView`\
  \ 以保持在布局的垂直中心。\n\n在选中 `ImageView` 时，使用属性面板中的 Inspector（检查器）将 `ImageView` 的顶部和底部边缘分别改为\
  \ `24` 和 `8`，并将组件的高度和宽度属性改为 `match_constraint`（匹配约束），以便组件能够匹配约束。这些设置将允许布局引擎在需要时或缩小\
  \ `ImageView` 的尺寸：\n\n![](img/as_layout_sample_constraints.jpg)\n\n图 21-10\n\n图\
  \ 21-11 显示了 `ImageView` 相对于布局中其他元素的现有约束：\n\n![](img/as_layout_sample_ui_constraints.jpg)\n\
  \n图 21-11\n\n最后一个任务是对三个 `Button` 小部件添加约束。在本例中，按钮将放置在链中。首先，通过点击图 21-1 所示的工具栏在 Layout\
  \ Editor 中开启 Autoconnect。\n\n接下来，点击 `Buy Now` 按钮，然后 Shift 点击另外两个按钮以选择所有按钮。右键点击 `Buy\
  \ Now` 按钮并在生成的菜单中选择 `Chains -> Create Horizontal Chain`链 -> 创建水平链）。默认情况下，链将使用 `spread`\
  \ 样式显示，这是本例的正确行为。\n\n最后，在 `Buy Now` 按钮与布局底部之间建立约束，边缘设置为 `8`。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应按照图\
  \ 21-12 所示进行约束：\n\n![](img/as_layout_sample_button_chain.jpg)\n\n图 21-12\n\n## 21.5\
  \ 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏模式并验证布局是否适应新的屏幕尺寸。\n\n\n\n\n\n虽然 `Layout Editor` 工具为设计用户界面布局提供了一个良好的可视化环境，但在涉及测试时，没有什么可以替代对运行中的应用程序进行测试。请在物理\
  \ Android 设备或模拟器会话上启动应用，并验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如 图 21-13 显示了在横屏模式下运行的应用：\n\
  \n![](img/as_layout_sample_landscape.jpg)\n\n图 21-13\n[/content]\n\n等一下，让我继续下去：\n\
  \n用户界面设计现在已经完成。设计更复杂的用户界面布局是上述步骤的延续。将视图（views）拖放到显示器上，根据需要进行定位、约束，并设置属性。\n\n## 21.6\
  \ 使用 Layout Inspector\n\n构成用户界面布局的组件层级结构可以使用 `Layout Inspector` 工具进行查看。应用必须在运行 `Android\
  \ API 29` 或更高版本的设备或模拟器上运行，才能访问此类信息。应用运行后，选择 `Tools -> Layout Inspector` 菜单选项，然后使用下方\
  \ 图 21-14 中标记为 `A` 的菜单选择要检查的进程。\n\n检查器加载后，左侧的面板（`A`）显示组成用户界面布局的组件层级结构。中间面板（`B`）视觉化地表示布局设计。点击视觉布局中的控件会导致该项在层级列表中突出显示，从而轻松找到视觉组件相对于整体布局层级的位置。\n\
  \n最右侧的面板（图 21-14 中标记为 `C`）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含指向项目源码中属性设置位置的链接。\n\
  \n![](img/as_layout_sample_layout_inspector.jpg)\n\n图 21-14\n\n要查看 3D 布局，点击标记为 `D`\
  \ 的按钮。这将显示层级的“爆炸式”表示，以便对其进行旋转和检查。这对于识别遮挡的视图等任务非常有用：\n\n![](img/as_layout_sample_layout_inspector_3d.jpg)\n\
  \n图 21-15\n\n点击并拖动渲染内容以进行三维旋转，使用上方箭头指示的滑块增加层之间的间距。再次点击标记为 `D` 的按钮返回 2D 视图。\n\n##\
  \ 21.7 总结\n\n`Android Studio` 中的 `Layout Editor` 工具与 `ConstraintLayout` 类已紧密集成。本章通过创建一个示例用户界面，概述了如何使用\
  \ `Layout Editor` 工具添加控件和设置约束，来实现基于 `ConstraintLayout` 的用户界面。本章还介绍了 `Live Layout\
  \ Inspector` 工具，它对于分析用户界面布局的结构组成非常有用。\n\n## 22 在 Android Studio 中手动设计 XML 布局\n\n\
  虽然使用 `Android Studio Layout Editor` 工具设计布局极大提高了效率，但仍然可以通过手动编辑底层 `XML` 来创建 `XML`\
  \ 布局。本章将介绍 Android `XML` 布局文件的基础。\n\n### 22.1 手动创建 XML 布局\n\n`XML` 布局文件的结构非常简单，遵循视图树的层级方法。`XML`\
  \ 资源文件的第一行理想情况下应包含以下标准声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  ```\n\n声明之后应紧跟布局的根元素，通常是一个容器视图（例如布局管理器）。这由起始标签和结束标签以及任何需要在视图上设置的属性来表示。例如，接下来的 `XML`\
  \ 将 `ConstraintLayout` 视图声明为根元素，并设置 `match_parent` 属性，使其填充设备显示的所有可用空间：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n在上面的示例中，布局元素还配置了每侧\
  \ `16dp`（密度无关像素）的内边距。Android 布局中的任何间距规范都必须使用以下测量单位之一：\n\n- `in` – 英寸。\n- `mm` –\
  \ 毫米。\n- `pt` – 磅（1/72 英寸）。\n- `dp` – 密度无关像素。一种基于设备显示物理密度相对于 `160dpi` 基准的抽象测量单位。\n\
  - `sp` – 缩放无关像素。与 `dp` 类似，但根据用户的字体偏好进行缩放。\n- `px` – 实际像素。不建议使用，因为不同的显示器的像素不同。\n\n\
  需要添加到 `ConstraintLayout` 的子元素必须嵌套在起始和结束标签之间。在以下示例中，`Button` 作为 `ConstraintLayout`\
  \ 的子元素添加：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <Button\n        text=\"My Button\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n实现后，按钮没有连接。在运行时，按钮将出现在左上角（根据父元素的内边距缩进了\
  \ `16dp`）。如果为按钮添加了两侧的约束，它将位于布局居中：\n\n```xml\n<Button\n    text=\"My Button\"\n \
  \   android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+button\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\
  \n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n要向布局添加第二个控件，请将其嵌入\
  \ `ConstraintLayout` 元素的正文中。例如，下面的修改向布局中添加了 `TextView`：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        text=\"@string/button_string\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+button\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        text=\"My Text\" />\n```\n\n\n\n\n\n```xml\n\
  \        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:id=\"@+id/textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n再次强调，新添加的 `TextView` 缺少约束会导致它在运行时出现在布局的左上角。以下修改添加了连接到父布局的对立约束，以使组件水平居中，同时包含了一个将\
  \ `TextView` 连接到按钮顶部的约束：\n\n```xml\n<TextView\n    android:text=\"My Text\"\n  \
  \  android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:id=\"@+id/textView\"\n    android:layout_marginTop=\"8dp\"\n    android:layout_marginBottom=\"\
  8dp\"\n    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n此外，请注意 `Button` 和 `TextView` 视图声明了多个属性。这两个视图都被分配了 ID，并配置为显示由名为\
  \ `button_string` 和 `text_string` 的字符串资源表示的文本字符串。此外，两个对象都声明了 `wrap_content` 高和宽属性，以便它们的大小能够适应内容（在本例中，为字符串资源值引用的文本）。\n\
  \n在设计模式下的布局编辑器预览面板中查看，上述布局将渲染为如图 22-1 所示：\n\n![](img/as_manual_xml_ui.jpg)\n\n图\
  \ 22-1\n\n## 22.2 手动 XML 与 可视觉布局设计\n\n手动编写 XML 还是使用设计模式下的布局编辑器取决于个人喜好。然而，使用设计模式具有其优势。\n\
  \n首先，设计模式通常会更快，因为它避免了输入 XML 行的需要。此外，设计模式避免了学习 Android SDK 视图类各种属性值的复杂细节。不需要不断参考\
  \ Android 文档来查找正确的关键字和值，大多数属性可以通过参考属性（Attributes）面板来找到。\n\n抛开设计模式的所有优势不谈，重要的是记住，这两种用户界面设计方法完全不是互斥的。作为应用程序开发者，你可能会在设计模式下创建用户界面，同时通过直接编辑生成的\
  \ XML 资源对设计进行精调和布局调整。界面设计的两种视图在 Android Studio 环境中并排显示，使得在 XML 和视觉布局之间进行无缝工作变得简单。\n\
  \n## 22.3 总结\n\nAndroid Studio 布局编辑器工具为设计用户界面提供了一种视觉上直观的方法。通过使用拖放范式结合一组属性编辑器，该工具为应用程序开发者带来了显著的生产力优势。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，其结构良好且易于理解。\n\n布局编辑器工具生成 XML 资源文件的这一事实意味着，这两种界面设计方法可以结合起来，为用户界面开发提供一种“兼者之长”的方法。\n\
  \n## 23. 使用约束集管理约束\n\n到本书为止，所有的用户界面设计任务都是使用 Android Studio 布局编辑器工具完成的，无论是使用文本模式还是设计模式。编写\
  \ XML 资源文件或使用 Android Studio 布局编辑器的替代方案是编写 Java 代码来直接创建、配置和操作组成 Android Activity\
  \ 用户界面的视图对象。本章将在描述视图属性以及布局约束的创建和管理等关键概念之前，探索编写 Java 代码创建用户界面的优缺点。\n\n在下一章中，将创建并使用一个示例项目，以演示这种创建\
  \ Android 用户界面的方法中涉及的一些典型步骤。\n\n### 23.1 Java 代码与 XML 布局文件\n\n使用 XML 资源文件设计用户界面比编写\
  \ Java 代码有许多优势。事实上，Google 在 Android 文档中尽花费了大量精力来赞扬 XML 资源优于 Java 代码的优点。正如前一节所讨论的，XML\
  \ 方法的一个关键优势是使用 Android Studio 布局编辑器工具，它可以生成 XML 资源。另一个优势是，一旦创建了应用程序，就可以通过修改 XML\
  \ 文件对用户界面屏幕进行更改，从而避免重新编译应用程序。此外，即使是手动编写 XML 布局，也可以使用 Android Studio 布局编辑器的预览功能对用户界面的外观获得即时反馈。要测试\
  \ Java 创建的用户界面的外观，开发者不可避免地将循环编写代码、编译和测试，以完成设计工作。\n\n关于使用 Java 代码创建布局的优势，Java 相比\
  \ XML 资源文件最显著的优势在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质上最有用，静态布局在 Activity 的每次调用之间不太可能发生显著变化。而\
  \ Java 代码非常适合在运行时动态创建用户界面。当用户界面可能受外部因素影响每次 Activity 执行时显示不同时，这一点尤为有用。\n\n当在 Activity\
  \ 运行时必须实时对基于 XML 的静态布局进行动态更改时，在 Java 代码中处理用户界面组件的知识也会有用。\n\n最后，无论后者提供哪些优势，某些开发者仍然倾向于编写\
  \ Java 代码而不是使用布局工具和 XML。\n\n### 23.2 创建视图\n\n如前所述，Android SDK 包含一个视图工具箱来满足大多数基本用户界面设计需求。在\
  \ Java 中创建视图就是实例化这些类，并作为参数传递与该视图关联的 Activity 引用。\n\n第一个视图（通常是一个可以添加其他视图的容器视图）通过调用\
  \ Activity 的 `setContentView()` 方法显示给用户。额外的视图可以通过对象的 `addView()` 方法添加到根视图中。\n\n\
  当使用 Java 代码操作位于 XML 布局资源文件视图时，需要获取视图的 ID。对于 Java 创建的视图，规则相同。因此，对于后续 Java 代码可能需要某些访问类型的视图，都必须分配一个\
  \ ID。这是通过调用该视图对象的 `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n### 23.3\
  \ 视图属性\n\n\n\n\n\n每个视图类都关联有一系列属性。这些属性设置直接作用在视图实例上，通常定义了视图对象的显示方式或行为。属性的示例包括在 `Button`\
  \ 对象上显示的文本，或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码中调用该方法，将按钮上显示的文本设置为特定的字符串值值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用该对象的 `setBackground()` 方法来设置。\n\n## 23.4 约束集 (Constraint Sets)\n\n\
  属性设置是视图对象内部的，并决定了视图的显示和行为，而约束集则控制视图相对于其父视图和其他兄弟视图的显示方式。每个 `ConstraintLayout` 实例都关联有一组约束条件，定义了其子视图的定位和受约束方式。\n\
  \n在 Java 代码中处理约束集的关键是 `ConstraintSet` 类。该类包含一系列方法，允许执行创建、配置以及将约束应用到 `ConstraintLayout`\
  \ 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到 `ConstraintSet` 对象中，并应用到其他布局（可以经过修改）。\n\
  \n`ConstraintSet` 实例的创建就像创建任何其他 Java 对象一样：\n\n```java\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在该实例上调用方法来执行广泛的任务。\n\n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于在视图之间建立约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\
  \n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n           editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n### 23.4.2 将约束应用到布局\n\n一旦配置了约束集，必须将其应用到 `ConstraintLayout`\
  \ 实例才能生效。约束集通过调用 `applyTo()` 方法应用，并传递要应用设置的布局对象的引用：\n\n```java\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父布局约束连接\n\n子视图与其父 `ConstraintLayout` 之间的连接也可以通过引用 `ConstraintSet.PARENT_ID`\
  \ 常量建立。在以下示例中，约束集配置为将 `Button` 视图的顶边缘连接到父布局的顶部，间距为 100dp：\n\n```java\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n           ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n\
  ```\n\n### 23.4.4 尺寸约束\n\n有多种方法可以控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将\
  \ `ImageView` 实例的垂直尺寸设置为最大 250dp：\n\n```java\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(), 250);\n\
  ```\n\n### 23.4.5 约束偏移 (Constraint Bias)\n\n正如名为“Android Studio 中使用 ConstraintLayout\
  \ 指南”的章节所述，当视图具有相反的约束时，它将沿着约束轴（即水平或垂直方向）居中。这种居中可以通过在特定的约束轴上应用偏移（bias）来调整。当使用 Android\
  \ Studio 布局编辑器时，这是通过属性（Attributes）工具窗口中的控件实现的。然而，在处理约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，引用视图 ID 和 0 到 1 之间的浮点值作为偏移值。\n\n例如，以下代码在应用 25% 的水平偏移之前，先将\
  \ `Button` 的左侧和右侧约束到父布局的相应侧：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \           ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n           ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n### 23.4.6 对齐约束\n\n\
  也可以使用约束集应用对齐设置。Android Studio 布局编辑器提供的全套对齐选项也可以通过约束集使用 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法进行配置，这两个方法都会根据配置的对齐方式接收不同的参数。此外，可以使用 `center()` 方法将视图在两个其他视图之间居中。\n\n在下面的代码中，`button2`\
  \ 的位置设置使得它与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout`\
  \ 实例的当前约束集复制到 `ConstraintSet` 对象中。例如，以下行代码将名为 `myLayout` 的 `ConstraintLayout` 的设置复制到约束集中：\n\
  \n```java\nset.clone(myLayout);\n```\n\n一旦复制，约束集就可以可以直接应用到另一个布局，或者在如下示例中应用之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(myLayout);\n```\n\n### 23.4.8 约束链 (Constraint\
  \ Chains)\n\n可以使用 `createHorizontalChain()` 和 `createVerticalChain()` 方法在约束集中创建垂直和水平约束链。这些方法的语法为：\n\
  \n`createHorizontalChain(int leftId, int leftSide, int rightId, int rightSide, int[]\
  \ chainIds, float[] weights, int style)`\n\n根据上述语法，以下示例创建一个从 `button1` 开始并以 `button4`\
  \ 结束的水平链。这些视图之间的 `button2` 和 `button3` 权重设置为零：\n\n```java\nint[] chainViews = {button2.getId(),\
  \ button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT,\n                         button4.getId(), ConstraintSet.RIGHT,\n\
  \                         chainViews, chainWeights, ConstraintSet.SPREAD);\n```\n\
  \n可以通过 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()` 从链中移除视图。可以使用\
  \ `addToHorizontalChain()` 或 `addToVerticalChain()` 将视图添加到现有链中。在这两种情况下，方法都接收要插入新视图的视图\
  \ ID 作为参数：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n### 23.4.9 辅助线 (Guidelines)\n\n使用 `create()` 方法将辅助线添加到约束集中，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在以下代码中，创建一个垂直辅助线并将其放置在父布局宽度的 50% 处。然后将 `button`\
  \ 视图的左侧连接到该辅助线，间距为 0：\n\n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\n\
  set.setGuidelinePercent(R.id.myGuideline, 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT,\n\
  \           R.id.myGuideline, ConstraintSet.RIGHT, 0);\nset.applyTo(layout);\n```\n\
  \n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从约束集的视图移除约束，并将移除移除的视图 ID 和锚点作为参数传入：\n\n```java\n\
  set.clear(button.getId(), ConstraintSet.LEFT);\n```\n\n\n\n\n同样地，通过在 `clear()` 方法调用中仅引用该视图，就可以在一步中移除该视图的所有约束条件：\n\
  \n```java\nset.clear(button.getId());\n```\n\n### 23.4.11 缩放\n\n布局内视图的大小可以使用 `ConstraintSet`\
  \ 的 `setScaleX()` 和 `setScaleY()` 方法进行调整，这些方法的参数是要执行操作的视图以及一个表示缩放比例的 `float` 值。在下面的代码中，一个按钮对象被缩放为原始宽度的倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别在\
  \ X 轴或 Y 轴上旋转视图，这两个方法都必须传递要旋转视图的 ID 以及表示要旋转角度的 `float` 值。旋转发生的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。以下代码使用位于点 500, 500 的中心点将按钮视图在 Y 轴上旋转 30 度：\n\n\
  ```java\nset.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n在介绍了约束集的理论和从 Java 代码内部创建用户界面之后，下一章将通过创建一个示例应用程序将这些理论付诸实践。有关\
  \ `ConstraintSet` 类的更多细节，请参阅以下 URL 中的参考指南：\n\n[`developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet`](https://developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet)\n\
  \n### 23.5 总结\n\n除了编写 XML 布局资源文件或使用 Android Studio Layout 编辑工具外，Android 用户界面也可以在\
  \ Java 代码中动态创建。\n\n在 Java 代码中创建布局包括创建视图类的实例，并在这些对象上设置属性以定义所需的外和行为。\n\n视图相对于其 `ConstraintLayout`\
  \ 父视图以及任何兄弟视图的定位和大小是通过约束集定义的。约束集由 `ConstraintSet` 类的实例表示，一旦创建，就可以使用广泛的方法调用进行配置，以执行诸如建立约束连接、控制视图尺寸行为和创建链等任务。\n\
  \n在本介绍了 `ConstraintSet` 类的基础知识后，下一章将通过一个教程将这些功能应用于实际中。\n\n## 24. Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 `ConstraintLayout` 和 `ConstraintSet` 类在 Java 代码中创建和修改用户界面布局的基本概念。本章将通过创建一个完全使用\
  \ Java 代码创建且不使用 Android Studio Layout 编辑工具的示例布局，将这些概念付诸实践。\n\n### 24.1 在 Android\
  \ Studio 中创建示例项目\n\n启动 Android Studio，并在欢迎界面上选择 `New Project` 选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n一旦项目创建，`MainActivity.java` 文件应自动加载到编辑面板中。正如我们所预期的，Android\
  \ Studio 已创建了一个模板活动并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了理想的位置。\n\n### 24.2\
  \ 向 Activity 添加视图\n\n`onCreate()` 方法目前被设计为使用资源布局文件作为用户界面。因此，首先从该方法中删除以下行：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    EdgeToEdge.enable(this);\n    setContentView(R.layout.activity_main);\n   \
  \ ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main),\n         \
  \     (v, insets) -> {\n            Insets systemBars =\n                insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top,\n                   \
  \      systemBars.right, systemBars.bottom);\n            return insets;\n     \
  \   });\n}\n```\n\n下一次修改是向活动中添加一个带有单个 `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建\
  \ `ConstraintLayout` 和 `Button` 类的新实例。然后需要将 `Button` 视图作为子元素添加到 `ConstraintLayout`\
  \ 视图中，而通过调用活动实例的 `setContentView()` 方法显示它：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        configureLayout();\n    }\n\n    private void configureLayout() {\n   \
  \     Button myButton = new Button(this);\n        ConstraintLayout myLayout = new\
  \ ConstraintLayout(this);\n        myLayout.addView(myButton);\n        setContentView(myLayout);\n\
  \    }\n}\n```\n\n当以这种方式创建用户界面实例时，构造方法方法必须传递创建对象的上下文，在本例中是当前活动：\n\n```java\nButton\
  \ myButton = new Button(this);\n```\n\n一旦完成了上述添加，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见结果是在\
  \ `ConstraintLayout` 视图的左上角有一个没有文本的按钮，如图 24-1 所示。\n\n### 24.3 设置视图属性\n\n对于此练习，我们需要\
  \ `ConstraintLayout` 视图的背景为蓝色，并且 `Button` 视图显示“Press Me”文本且背景为黄色。这些任务可以通过在 Java\
  \ 代码中对视图设置属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，将其作为 `String` 资源添加。在 `Project` 窗口中，找到 `app`\
  \ -> `res` -> `values` -> `strings.xml` 文件并对其修改为“Press Me”字符串添加资源值：\n\n```xml\n\
  <resources>\n    <string name=\"app_name\">JavaLayout</string>\n    <string name=\"\
  press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理直接引用的字符串的方法，但后续许多代码示例将直接在代码中输入字符串，以避免在书剩余部分重复此步骤。\n\
  \n一旦字符串存储为资源，就可以如下从代码内部访问它：\n\n`getString(R.string.press_me)`\n\n创建字符串资源后，向 `configureLayout()`\
  \ 方法添加代码以设置文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private void configureLayout() {\n        Button\
  \ myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n\n\n\n当应用编译并运行时，布局将反映属性设置的结果，即布局将以蓝色背景显示，按钮将在黄色背景上显示分配的文本。\n\n## 24.4\
  \ 创建视图 ID\n\n当布局完成后，它将包含一个 `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一的视图\
  \ ID。此此过程的第一步是创建一个包含这些 ID 值的新资源文件。\n\n右键点击 `app` -> `res` -> `values` 文件夹，选择 `New`（新建）->\
  \ `Values Resource File`（值资源文件）菜单选项，并将新资源文件命名为 `id.xml`。创建资源文件后，对其编辑使其如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <item name=\"myButton\"\
  \ type=\"id\" />\n    <item name=\"myEditText\" type=\"id\" />\n</resources>\n```\n\
  \n在教程的这一阶段，仅创建了 `Button`，因此编辑 `configureLayout()` 方法为对象分配相应的 ID：\n\n```java\nprivate\
  \ void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 24.5 配置约束集\n\n如果没有约束，`ConstraintLayout` 视图会将 `Button` 视图放置在显示器的左上角。为了指示布局视图将按钮放在不同的位置（在本例中为水平和垂直方向居中），有必要创建一个\
  \ `ConstraintSet` 实例，用适当设置对其进行初始化并将其应用于父布局。\n\n对于此示例，需要配置按钮，使其宽度和高度限制为其所的文本的大小，并将视图在父布局中居中。再次编辑\
  \ `configureLayout()` 方法进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n    ConstraintSet set = new ConstraintSet();\n \
  \   set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.constrainWidth(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置好初始约束后，编译并运行应用，验证 `Button` 视图现在是否出现在布局的中心：\n\
  \n![](img/Image2444.jpg)\n\n图 24-2\n\n## 24.6 添加 EditText 视图\n\n要添加到布局的下一个项是 `EditText`\
  \ 视图。第一步是创建 `EditText` 对象，分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。实现这些步骤的代码更改现在需要对 `configureLayout()`\
  \ 方法进行如下修改：\n\n```java\nprivate void configureLayout() {\n    Button myButton =\
  \ new Button(this);\n    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 组件的设计的大小取决于其显示的内容，在布局中水平居中，并位于现有 `Button` 上方 70dp 处。在 `configureLayout()` 方法中添加代码使其如下：\n\
  \n```\nset.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\nset.connect(myButton.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myButton.getId(), ConstraintSet.TOP, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 0);\nset.connect(myButton.getId(), ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.BOTTOM, myButton.getId(), ConstraintSet.BOTTOM, 70);\nset.applyTo(myLayout);\n\
  ```\n\n`EditText` 组件旨在根据其显示的内容调整大小，在布局中水平居中，并定位在现有 `Button` 之上 70dp 处。\n\n## 24.7\
  \ 将像素 (dp) 转换为像素 (px)\n\n练习的下一个项目是设置 `EditText` 视图的宽度为 200dp。正如约束布局教程中所述，在设置用户界面布局时，最好使用密度像素\
  \ (`dp`) 而不是像素 (`px`)。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要在运行时根据显示密度将 `dp` 值转换为 `px`。\n\
  \n\n\n\n\n既然已经涵盖了使用 Android Studio 进行 Android 开发的一些基础概念，现在是介绍 Android Studio “应用更改”（Apply\
  \ Changes）功能的好时机。正如所有经验丰富的开发者所知，等待应用编译和运行的每一秒钟都应该用于编写和完善代码。\n\n## 25.1 引入应用更改\n\n\
  在 Android Studio 的早期版本中，每次需要测试项目的更改时，Android Studio 都会重新编译代码、将其转换为 Dex 格式、生成 APK\
  \ 包文件，并安装到设备或模拟器上。完成这些步骤后，应用才会启动并准备好测试。即使在快速开发系统上，这个过程也需要相当的时间。对于大型应用程序，此过程花费一分钟或更多并不罕见。\n\
  \n相比之下，“应用更改”允许在已经在设备或模拟器会话运行时，将项目中的许多代码和资源更改几乎立即反映在应用中\n\n例如，考虑一个在 Android Studio\
  \ 中开发并在设备或模拟器上启动的应用。如果对资源设置或方法内的代码进行了更改，“应用更改”将更新的代码和资源推送到正在运行的应用，并动态地“交换”更改。随后，更改将反映在运行的应用中，而无需构建、部署和重新启动整个应用。这通常允许在没有“应用更改”的情况下短时间内测试更改。\n\
  \n## 25.2 理解应用更改选项\n\nAndroid Studio 提供了三种对运行应用应用更改的选项，形式为运行应用（Run App）、应用更改（Apply\
  \ Changes）以及重启活动并应用代码更改（Restart Activity and Apply Code Changes，*）。这些选项可以总结如下：\n\
  \n- **运行应用**：停止当前运行的应用并重启它。如果自上次启动以来项目未发生更改，此选项将重启应用。相反，如果项目发生了更改，Android Studio\
  \ 将在启动之前重新构建并将应用安装到设备或模拟器上。\n- **应用代码更改**：当对项目的更改仅涉及修改现有方法的体，或者添加了新类或方法时，可以使用此选项。选中后，更改将应用于运行的应用，而无需重启应用或当前运行的活动。但是，如果对任何项目资源（如布局文件）进行了更改，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构代码更改。如果对项目清单（Manifest）进行了更改，也无法使用此选项。\n\
  - **应用更改并重启活动**：选中后，此模式将动态应用项目内的任何代码或资源更改，并在不重新安装或重启应用的情况下重启活动。与“应用代码更改”选项不同，当项目代码和资源发生更改时可以使用此选项。然而，涉及某些结构代码更改和清单修改的限制仍然适用。\n\
  \n## 25.3 使用应用更改\n\n当项目加载到 Android Studio 但尚未在设备或模拟器上运行时，可以像使用工具栏上的运行（在图 25-1 中标记为\
  \ A）或调试（B）按钮一样正常启动：\n\n![](img/as_run_debug_buttons.jpg)\n\n图 25-1\n\n应用启动并运行后，将出现一个停止按钮（在图\
  \ 25-2 中标记为 A），并且“应用更改并重启活动”（B）和“应用代码更改”（C）按钮将可用：\n\n![](img/as_run_apply_changes.jpg)\n\
  \n图 25-2\n\n如果在选择其中一个“应用更改”按钮时无法应用更改，Android Studio 将显示一条指示失败及其解释的消息。例如，图 25-3 显示了在对资源文件进行更改后选择“应用代码更改”选项时\
  \ Android Studio 显示的消息：\n\n![](img/as_instant_run_restart_resources.jpg)\n\n图 25-3\n\
  \n在这种情况下，解决方案是使用“应用更改并重启活动”选项（已提供链接）。同样，当尝试应用涉及删除方法的更改时，将出现以下消息：\n\n![](img/as_instant_run_restart_method_removed.jpg)\n\
  \n图 25-4\n\n在这种情况下，唯一的选择是是点击“运行应用”按钮以重新安装并重启应用。作为手动选择正确选项的替代方案，可以配置 Android Studio\
  \ 自动回退到执行“运行应用”操作。\n\n## 25.4 配置应用更改回退设置\n\n“应用更改”回退设置位于 Android Studio 的设置（Settings）对话框中。在设置对话框中，在左侧面板中选择\
  \ `Build, Execution, Deployment`（构建、执行、部署）项，然后选择 `Deployment`（部署），如图 25-5 所示：\n\n\
  ![](img/as_instant_run_settings.jpg)\n\n图 25-5\n\n一旦启所需的选项，点击 `Apply`，然后点击 `OK`\
  \ 按钮提交更改并关闭对话框。启用这些默认设置后，Android Studio 将根据需要重新安装并重启应用。\n\n## 25.5 应用更改教程\n\n启动\
  \ Android Studio，从欢迎界面选择新建项目（New Project）选项，并在生成的新项目对话框中点击下一步（Next）按钮之前选择 Basic\
  \ Views Activity 模板。\n\n在 `Name` 字段中输入 `ApplyChanges` 并指定 `com.ebookfrenzy.applychanges`\
  \ 为包名。在点击完成（Finish）按钮之前，将最小 API 级别设置改为 `26: Android 8.0 (Oreo)`，并将语言菜单改为 `Java`。\n\
  \n## 25.6 使用应用代码更改\n\n开始点击运行按钮并选择模拟器或物理设备作为运行目标。点击运行按钮后，跟踪示例应用在设备上出现之前的时间。\n\n运行后，点击操作按钮（屏幕左下角显示信封图标的按钮）。注意会出现一个\
  \ `Snackbar` 实例，显示为“Replace with your own action”的文本，如图 25-6 所示：\n\n![](img/as_apply_changes_snackbar.jpg)\n\
  \n图 25-6\n\n一旦应用运行，“应用更改”按钮应该已经启用，表明某些项目更改可以在不重新安装和重启应用的情况下应用。要查看此效果，编辑 `MainActivity.java`\
  \ 文件，找到 `onCreate` 方法并修改操作代码，以便在选择操作时显示不同的消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \            .setAnchorView(R.id.fab)\n            .setAction(\"Action\", null).show();\n\
  \    }\n});\n```\n\n实现代码更改后，点击“应用代码更改”按钮，注意在几秒钟会出现一条指示应用已更新的消息。点击操作按钮，注意新消息现在显示在\
  \ Snackbar 中。\n\n## 25.7 使用应用更改并重启活动\n\n任何资源更改都需要使用“应用更改并重启活动”。在 Android Studio\
  \ 中，选择 `app -> res -> layout -> fragment_first.xml` 布局文件。在布局编辑器工具的 Design 模式下，选择默认的\
  \ `TextView` 组件并在属性工具窗口中将 `text` 属性更改“Hello Android”。\n\n\n\n\n\n在点击 `Apply Code\
  \ Changes` 按钮之前，请确保上述配置应用更改回退设置中列出的回退选项已关闭。请注意，请求失败是因为此更改涉及了项目资源。点击 `Apply Changes\
  \ and Restart Activity` 按钮，并验证活动已重启并在 `TextView` 小部件上显示新文本。\n\n## 25.8 使用 Run App\n\
  \n如前所述，删除方法需要完全重新安装并重启正在运行的应用程序。要体验这一过程，请编辑 `MainActivity.java` 文件，并在 `onCreate`\
  \ 方法之后添加一个新方法，如下：\n\n```java\npublic void demoMethod() {\n\n}\n```\n\n使用 `Apply\
  \ Code Changes` 按钮并确认更改在未重新安装应用的情况下已应用。\n\n接下来，删除该新方法并验证点击两个 `Apply Changes` 按钮中的任意一个都会导致请求失败。在此类更改后运行应用的唯一方法是点击\
  \ `Run App` 按钮。\n\n## 25.9 总结\n\n`Apply Changes` 是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。`Apply\
  \ Changes` 功能可以将更新推送到运行的应用程序中，在许多情况下无需重新安装或重启应用。`Apply Changes` 根据应用到项目的修改性质提供了几种不同层次的支持。\n\
  \n## 26. Gradle 版本目录（Version Catalogs）指南\n\n一个新创建的 Android Studio 项目将由 Android Studio\
  \ 自动生成的约 80 个文件组成。当你点击 `Run` 按钮时，Android Studio 使用一个名为 `Gradle` 的构建系统来生成额外文件、编译源代码、解析库依赖并创建可安装的应用程序包。构建完成后，项目文件夹将包含约\
  \ 700 个文件。\n\n本章将解释 `Gradle` 构建系统如何确定在构建过程中包含哪些库，以及你如何使用该系统为你的项目添加库依赖。\n\n### 26.1\
  \ 库和插件依赖\n\n在较早的标题为“Android 架构概览”的章节中，我们简要讨论了 Java API 框架及其包含的库。当 `Gradle` 构建项目时，它需要知道完成构建需要哪些库及其相应的版本号。例如，一个项目可能依赖于版本为\
  \ 2.6.0 的 `Room Database` 运行时库 (`androidx.room:room-runtime`)）。遗憾的是，当我们在项目中编写 `Room\
  \ Database` 代码时，`Gradle` 不会自动将相应的库依赖项添加到构建配置中。相反，我们必须通过 `Gradle` 构建文件和版本目录手动添加它们。\n\
  \n### 26.2 项目 Gradle 构建文件\n\n每个 Android Studio 项目都有一个项目级的 `Gradle` 文件，你可以通过在 Project\
  \ 工具窗口中导航到 `Gradle Scripts -> build.gradle.kts (<Project name>)` 来找到它。该文件的主要目的是定义负责构建整个项目工作的插件，其内容通常如下：\n\
  \n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication) apply false\n\
  }\n```\n\n在实践中，只有在极少数情况下需要修改此文件。\n\n### 26.3 模块 Gradle 构建文件\n\n一个 Android Studio\
  \ 项目由一个或多个模块组成，每个模块都有自己的构建配置和库依赖。新项目将包含单个模块，其 `gradle` 构建文件将列在 `Gradle Scripts`\
  \ 文件夹中显示为 `build.gradle.kts (Module: app)`，其部分内容如下：\n\n```kotlin\nplugins {\n  \
  \  alias(libs.plugins.androidApplication)\n}\n\nandroid {\n.\n.\n}\n\ndependencies\
  \ {\n    implementation(libs.androidx.appcompat)\n    implementation(libs.material)\n\
  \    implementation(libs.androidx.activity)\n    implementation(libs.androidx.constraintlayout)\n\
  \    testImplementation(libs.junit)\n    androidTestImplementation(libs.androidx.junit)\n\
  \    androidTestImplementation(libs.androidx.espresso.core)\n}\n```\n\n`plugins`\
  \ 再次包含了构建项目所需的插件，在大多数情况下，它们将与项目级构建文件中声明的内容保持镜像关系。当某个模块需要其他模块不需要的插件时，会在在这里进行声明。\n\
  \n`dependencies` 包含了该模块所依赖的库列表，这些库必须在成功构建时被解析。\n\n### 26.4 版本目录文件（Version Catalog\
  \ File）\n\n之前我们提到，除了库名，依赖项还必须包含库的版本号。然而，你可能已经注意到，到为止审查的所有配置文件中都没有包含版本信息。这就是版本目录文件的用用场。版本目录可以在\
  \ Project 工具窗口的 `Gradle Scripts` 文件夹中名为 `libs.versions.toml` 的文件中找到。下面列出了一个版本目录文件的示例：\n\
  \n```toml\n[versions]\nagp = \"8.3.0\"\njunit = \"4.13.2\"\njunitVersion = \"1.1.5\"\
  \nespressoCore = \"3.5.1\"\nappcompat = \"1.6.1\"\nmaterial = \"1.11.0\"\nactivity\
  \ = \"1.8.0\"\nconstraintlayout = \"2.1.4\"\n\n[libraries]\nmaterial = { group =\
  \ \"com.google.android.material\", name = \"material\", version.ref = \"material\"\
  \ }\nactivity = { group = \"androidx.activity\", name = \"activity\", version.ref\
  \ = \"activity\" }\n\n[plugins]\nandroidApplication = { id = \"com.android.application\"\
  , version.ref = \"agp\"}\n```\n\n版本目录分为 `[versions]`、`[libraries]` 和 `[plugins]`\
  \ 部分。为了帮助理解版本目录的工作原理，我们将使用 `material` 库作为示例。在 `[libraries]` 部分中，`material` 库声明如下：\n\
  \n```toml\nmaterial = { group = \"com.google.android.material\", name = \"material\"\
  , version.ref = \"material\" }\n```\n\n上面的 `group` 条目告诉我们 Material 库的实际组是 `com.google.android.material`，而\
  \ `versions.ref` 赋值声明了如何在 `[versions]` 部分引用它。回到 `[versions]` 部分，我们发现该库被分配了版本 1.11.0：\n\
  \n```toml\nmaterial = \"1.11.0\"\n```\n\n最后，该库在模块级构建文件的 `dependencies` 部分中声明如下：\n\
  \n```kotlin\ndependencies {\n.\n.\n    implementation(libs.material)\n}\n```\n\n\
  注意，在构建文件中引用库的语法是在 `[libraries]` 目录条目的名称前加上 `libs.`。虽然我们在示例中关注的是库，但插件的语法是相同的。\n\n\
  ### 26.5 添加依赖项\n\n你需要在书中多个项目中添加依赖项，在每种情况下我们都会引导你完成这一过程。作为本章的最后一个示例，我们将演示如何为之前的假设项目添加\
  \ `Room Database` 运行时库依赖。首先，我们必须在 `libs.versions.toml` 版本目录文件的 `[libraries]` 部分中添加以下条目：\n\
  \n```toml\n[libraries]\n.\n.\nandroidx-roomruntime = { group = \"androidx.room\"\
  , name = \"room-runtime\", version.ref = \"roomRuntime\" }\n```\n\n接下来，将版本号添加到 `[versions]`\
  \ 目录部分：\n\n```toml\n[versions]\n.\n.\nroomRuntime = \"2.6.1\"\n```\n\n最后，将该库添加到模块级\
  \ `gradle` 构建文件的 `dependencies` 部分中：\n\n```kotlin\ndependencies {\n.\n.\n    implementation(libs.androidx.room.runtime)\n\
  }\n```\n\n另一个示例是 `androidx.navigation:navigation-fragment` 库。在这种情况下，库的组是 `androidx.navigation`，名称是\
  \ `navigation-fragment`。该库在版本目录中的声明如下：\n\n```toml\n[versions]\n.\n.\nnavigationFragment\
  \ = \"2.7.7\"\n\n[libraries]\n.\n.\nnavigation-fragment = { group = \"androidx.navigation\"\
  , name = \"navigation-fragment\", version.ref = \"navigationFragment\" }\n```\n\n\
  \n\n\n一旦库已添加到目录中，`gradle`构建文件的依赖项将如下：\n\n```gradle\ndependencies {\n    ...\n  \
  \  implementation(libs.navigation.fragment)\n}\n```\n\n## 26.6 库更新\n\n虽然声明库和插件依赖主要是一项手动任务，但\
  \ Android Studio 能为你做的一件事是：当有更高版本的库可用时通知你。它通过在你编辑目录文件时高亮显示版本号来实现这一点。将鼠标指针悬停在高亮的数字上，将显示如图\
  \ 26-1 所示的面板，并提供切换到最新版本的选项：\n\n![](img/as_new_version_popup.jpg)\n\n图 26-1\n\n##\
  \ 26.7 总结\n\nAndroid Studio 项目使用 `Gradle` 构建系统进行构建，过程涉及多个步骤。其中一个步骤是解析并包含项目成功编译所需的任何库。虽然新创建的项目将包含简单应用程序所需的的基础库和插件，但更复杂的项目将会有额外的依赖项。这些依赖项在模块级\
  \ Gradle 构建文件中声明。为了在项目模块之间提供版本一致性，并为添加新库或更新版本号提供单一位置，`Gradle` 使用版本目录文件。随着你的代码使用更多库和插件，你必须编辑构建和目录文件以添加这些依赖项。\n\
  \n## 27. Android 事件处理概述与示例\n\n之前的章节已经涵盖了许多关于 Android 应用程序用户界面设计的内容。然而，一个尚未涵盖的领域是用户与用户界面的交互是如何触发底层活动执行任务的。换句话说，从之前的章节中，我们知道如何创建一个包含按钮视图的用户界面，但不知道当用户触碰它时如何让应用程序内发生某些事情。\n\
  \n因此，本章的主要目标是提供 Android 应用程序事件处理的概述，并带有一个基于 Android Studio 的示例项目。\n\n### 27.1 理解\
  \ Android 事件\n\nAndroid 事件可以采取多种形式，但通常是响应外部操作而生成的。常见的事件形式（特别是对于平板电脑和智能手机等设备）涉及与触摸屏某种形式的交互。此类事件属于输入事件。\n\
  \nAndroid 框架维护了一个事件队列，事件在发生时会被放入队列中。然后，事件按照先进先出（FIFO）的从队列中移除。对于输入事件（例如对屏幕的触摸），事件将传递给位于屏幕触摸发生位置的视图。除了事件通知外，视图还会接收到一系列关于事件的信息（取决于事件类型），关于事件性质的描述，例如用户手指与屏幕之间接触点的坐标。\n\
  \n为了处理已传递的事件，视图必须备有一个事件监听器。所有用户界面组件均派自 `View` 类，该类包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的调。例如，如果按钮要响应点击事件（等同于用户触碰并释放按钮视图，就像点击物理按钮一样），它必须注册\
  \ `View.OnClickListenerClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法），并实现相应的\
  \ `onClick()` 回调方法。如果在按钮视图的位置检测到屏幕上的“点击”事件，当该事件从事件队列中移除时，Android 框架将调用该视图的 `onClick()`\
  \ 方法。当然，在 `onClick()` 回调方法的实现中，应该执行任何响应按钮点击而引起的任务或其他方法。\n\n### 27.2 使用 android:onClick\
  \ 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户在界面上“点击”按钮视图时调用回调方法时，提供了一种快捷方法。考虑一个包含名为 `button1`\
  \ 的按钮视图的用户界面布局，要求是当用户触碰按钮时，调用活动类中声明的名为 `buttonClick()` 方法。实现此行为只需编写 `buttonClick()`\
  \ 方法（该方法以触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加单行代码。例如：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:onClick=\"buttonClick\"\n    android:text=\"Click me\"\
  \ />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供事件处理程序提供的范围选项，而这是本章其余部分的主题。正如后续章节概述，`onClick`\
  \ 属性在涉及 fragment 的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n### 27.3 事件监听器与回调方法\n\n在本章后面概述的示例活动中，将详细介绍注册事件监听器和实现回调方法的步骤。在在此之前，值得花时间概述\
  \ Android 框架中可用的事件监听器以及与每个监听器相关的回调方法。\n\n- `OnClickListener`: 用于检测点击式事件，即用户触摸并释放设备显示器上视图的区域。对应\
  \ `onClick()` 回调方法，该方法将接收事件的视图作为参数。\n- `OnLongClickListener`: 用于检测用户在视图上长时间保持触摸。对应\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数。\n- `OnTouchListener`: 用于检测与触摸屏的任何接触，包括单个或多次触摸以及手势动作。对应\
  \ `onTouch()` 回调的主题将在“Android 触摸和多点事件处理”#Multitouch_Events.xhtml__idTextAnchor658）章节中详细介绍。回调方法将接收事件的视图和\
  \ `MotionEvent` 对象作为参数。\n- `OnContextMenuListener`: 监听由长按产生的上下文菜单。对应 `onCreateContextMenu()`\
  \ 回调方法。回调方法传递菜单、接收事件的视图和菜单上下文对象。\n- `OnFocusChangeListener`: 检测由于与轨迹球或导航键交互导致焦点离开当前视图。对应\
  \ `onFocusChange()` 回调方法，该方法传递接收事件的视图和一个布尔值，指示是获得还是丢失焦点。\n- `OnKeyListener`: 用于检测当视图拥有焦点时按下设备上的按键。对应\
  \ `onKey()` 回调方法。它将接收事件的视图、被按物理键的 `KeyCode` 以及一个 `KeyEvent` 对象作为参数。\n\n## 27.4 事件处理示例\n\
  \n\n\n\n\n在本章的剩余部分中，我们将创建一个 Android Studio 项目，用于演示事件监听器和相应回调方法的实现，以检测用户何时点击了按钮。回调方法中的代码将更新一个文本视图（text\
  \ view），以指示事件已处理。\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty\
  \ Views Activity` 模板。\n\n在 `Name` 字段中输入 `EventExample`，并指定 `com.ebookfrenzy.eventexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。按照第 11.8 Migrating a Project to View Binding 节列出的步骤，将项目转换为使用\
  \ view binding。\n\n## 27.5 设计用户界面\n\n本示例中 `MainActivity` 类的用户界面布局将由一个 `ConstraintLayout`、一个\
  \ `Button` 和一个 `TextView` 组成，如图 27-1 所示。\n\n![](img/as_event_example_ui.jpg)\n\n\
  图 27-1\n\n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口下的 `app\
  \ -> res -> layouts`），并双击它将其加载到 `Layout Editor` 工具中。\n\n确保已启用 `Autoconnect`，然后从调色板拖入一个\
  \ `Button` 组件并移动它，使其位于布局的水平中心位置并在现有 `TextView` 组件的下方。当位置正确时，将组件释放到到位，以便 `autoconnect`\
  \ 系统添加相应的约束条件。\n\n选择“Hello World!” `TextView` 组件，并使用 `Attributes` 面板将 `ID` 设置为 `statusText`。重复此步骤将\
  \ `Button` 组件的 `ID` 更改为 `myButton`。\n\n点击布局编辑器工具栏上的 `Infer Constraints` 按钮添加任何缺失的约束条件。\n\
  \n在选中 `Button` 组件的情况下，使用 `Attributes` 面板将 `text` 属性设置为 `Press Me`。将按钮上的文本字符串提取到名为\
  \ `press_me` 的资源中。\n\n用户界面布局后，下一步是注册事件监听器和回调方法。\n\n## 27.6 事件监听器和回调方法\n\n对于此示例，需要为\
  \ `myButton` 视图注册一个 `onClickListener`。这通过调用按钮视图的 `setOnClickListener()` 方法、并将一个新的\
  \ `onClickListener` 对象作为参数传递，同时实现 `onClick()` 回调方法来实现。由于此任务只需要在活动创建时执行，良好的位置是 `MainActivity`\
  \ 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已经在编辑器会话中打开，请通过点击编辑器面板中的标签页来选择它。或者，在\
  \ Project 工具窗口中导航到 `(app -> kotlin+java -> com.ebookfrenzy.eventexample -> MainActivity)`\
  \ 找到它，并双击它将其加载到代码编辑器中。加载后，找到模板 `onCreate()` 方法并对其修改，以获取按钮视图的引用、注册事件监听器并实现 `onClick()`\
  \ 回调方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \n.\n.\n\n        setContentView(view);\n\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n\n                }\n            }\n        );\n    }\n.\n.\n}\n```\n\n\
  上述代码已经在按钮上注册了事件监听器并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹象表明安装在按钮上的事件监听器正在工作，因为目前在\
  \ `onClick()` 回调方法的体内部尚未实现任何代码。该示例的目标是在点击按钮时在 `TextView` 上显示此，，因此需要进行一些进一步的代码更改：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n.\n\
  .\n    binding.myButton.setOnClickListener(\n        new Button.OnClickListener()\
  \ {\n            public void onClick(View v) {\n                binding.statusText.setText(\"\
  Button clicked\");\n            }\n        }\n    );\n}\n```\n\n## 27.7 消费事件\n\n\
  视图上标准点击（相对于长按）的检测是一个简单的情况。现在将扩展该示例以包含长按，长按是在用户点击并按住视图时发生的。\n\n考虑上一节中的 `onClick()`\
  \ 方法。它被声明为 `void`，因此不向框架返回值。另一方面，`onClickListener` 要求向 Android 框架返回一个 `Boolean`\
  \ 值。如果回调返回 `true`，框架将消费该事件。反之，如果回调返回 `false`，框架认为该事件仍然有效。\n\n与许多编程概念一样，这最好通过示例来演示。第一步是为活动添加长按的事件监听器和回调方法：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n.\n\
  .\n    binding.myButton.setOnLongClickListener(\n        new Button.OnLongClickListener()\
  \ {\n            public boolean onLongClick(View v) {\n                binding.statusText.setText(\"\
  Button click\");\n                return true;\n            }\n        }\n    );\n\
  }\n```\n\n当检测到长按时，`onLongClick()` 回调方法将在文本视图上显示“Long click”。然而，注意回调方法返回了 `true`\
  \ 值，表示它已消费该事件。运行应用程序并按住 `Button` 视图，直到“Long click”文本出现在文本视图中。当释放按钮时，文本视图显示“Long\
  \ click”文本，表明 `onClick` 监听器代码未被调用。\n\n接下来，修改代码使 `onClickListener` 监听器现在返回 `false`\
  \ 值：\n\n```java\nbutton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView myTextView\
  \ = findViewById(R.id.myTextView);\n            myTextView.setText(\"Long click\"\
  );\n            return false;\n        }\n    }\n);\n```\n\n\n\n\n再次编译并运行应用程序，对按钮进行长按，直到出现长按消息。然而，在这次释放按钮时，请注意到\
  \ `onClick` 监听器也被触发了，且文本变为“Button clicked”（按钮已点击）。这是因为 `onLongClick` 监听器代码返回的 `false`\
  \ 值指示 Android 框架该事件未被该方法消费，并有权传递给该视图上后续注册的下一个监听器。在这种情况下，运行时确定按钮上的 `onClickListener`\
  \ 也对该类型的事件感兴趣，并随后调用了 `onClick` 监听器代码。\n\n## 27.8 总结\n\n如果用户界面中包含的视图在响应用户交互时不做出任何反应，那么该用户界面的实用价值就很小。Android\
  \ 通过事件监听器和回调方法的概念，弥合了用户界面与应用程序后端代码之间的差距。`View` 类定义了一组事件监听器，这些监听器可以注册在视图对象上。每个事件监听器都与其关联有一个回调方法。\n\
  \n当用户界面中的视图上发生事件时，该事件会被放入事件队列中，并由 Android 运行时按照先进先出的原则进行处理。如果发生事件的视图注册了与事件类型匹配的监听器，则会调用相应的回调方法。该代码随后会在返回之前执行\
  \ activity 所需要的任何任务。某些回调方法要求返回一个 `Boolean` 值，以指示该事件是传递给注册在视图上的其他事件监听器，还是由系统丢弃。\n\
  \n既然已经涵盖了事件处理的基础知识，下一章将探索触摸事件，特别强调多点触摸的处理。\n\n## 28 Android 触摸与多点触摸事件处理\n\n大多数基于\
  \ Android 的设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕上的触摸如何转换为运行中的 Android 应用程序中的操作。然而，触摸事件的处理要远比响应视图对象上的单指点击复杂得多。例如，大多数\
  \ Android 设备可以同时检测到多个触摸。触摸也不局限于设备显示器上的单点。当用户在屏幕表面滑动一个或多个接触点时，触摸可以是动态的。\n\n应用程序还可以将触摸解释为手势。考虑例如，水平滑动通常用于翻页电子书的页码，或者捏合动作如何对屏幕上显示的图像进行放大或缩小。\n\
  \n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别不同手势的主题将在下一章介绍。\n\n### 28.1 拦截触摸事件\n\n视图对象可以通过注册\
  \ `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保了名为 `myLayout`\
  \ 的 `ConstraintLayout` 视图实例上的任何触摸都会导致 `onTouch()` 方法被调用：\n\n```java\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在此处执行任务\n            return true;\n      \
  \  }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调要求返回一个 `Boolean` 值，向 Android 运行时系统指示事件是否应该传递给注册在同一视图上的其他事件监听器，或被丢弃。该方法传递了触发事件的视图的引用和一个\
  \ `MotionEvent` 类型的对象。\n\n### 28.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中的信息包括触摸在视图中的位置以及所执行的操作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n### 28.3\
  \ 理解触摸动作\n\n触摸事件处理的一个重要方面是识别用户执行的操作类型。可以通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法获取与事件关联的操作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含操作类型为 `ACTION_DOWN`\
  \ 以及触摸的坐标。当该触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何触摸运动都将由\
  \ `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸操作时，这些触摸被称为指针（pointers）。在多点触摸场景下，指针分别以类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作开始和结束。要识别触发事件的指针的索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n### 28.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节开始在单点触摸事件的狭窄背景下探索事件处理。在实践中，大多数\
  \ Android 设备都可以响应多点触摸（尽管可以检测到的同时触摸数量随设备而异）。\n\n如之前讨论的，多点触摸情况下的每次触摸被 Android 框架认为是一个指针。每个指针反过来通过一个索引值被引用并分配一个\
  \ ID。可以通过调用 `getPointerCount()` 方法获取当前指针的数量。特定索引处的指针 ID 可以通过调用 `getPointerId()`\
  \ 获取。例如，以下代码获取指针计数以及索引为 0 处指针的 ID：\n\n```java\npublic boolean onTouch(View v, MotionEvent\
  \ m) {\n    int pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数始终大于或等于 1（因为至少发生过一次触摸才会触发回调）。\n\
  \n视图上的触摸，特别是涉及跨屏幕运动的触摸，会在接触点从屏幕抬起之前产生一系列事件流。应用程序可能需要在多个事件期间跟踪单个触摸。虽然特定触摸手势的 ID 在事件之间不会改变，但重要的是记住索引值会随着其他触摸事件的出现和消失而变化。在多个事件上处理触摸手势时，必须使用\
  \ ID 值作为触摸引用，以确保跟踪的是同一个触摸。在调用需要索引值的方法时，应通过调用 `MotionEvent` 对象的 `findPointerIndex()`\
  \ 方法将触摸 ID 转换为相应的索引值。\n\n### 28.5 多点触摸示例应用程序\n\n在本章剩余部分创建的示例应用程序将跟踪在布局视图上移动的多两个触摸手势。当每个触摸的事件触发时，每个触摸的坐标、索引和\
  \ ID 将显示在屏幕上。\n\n\n\n\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty\
  \ Views Activity` 模板。\n\n在 `Name` 字段中输入 `MotionEvent` 并指定 `com.ebookfrenzy.motionevent`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n按照 11.8 将项目迁移到 View Binding 节所述，调整项目以使用 view binding。\n\
  \n## 28.6 设计 Activity 用户界面\n\n该应用程序的唯一 Activity 的用户界面将由一个包含两个 `TextView` 对象的 `ConstraintLayout`\
  \ 视图组成。在 `Project` 工具窗口中，导航到 `app` -> `res` -> `layout` 并双击 `activity_main.xml`\
  \ 布局资源文件，将其加载到 Android Studio 布局编辑器工具中。\n\n选择并删除默认的“Hello World!” `TextView` 小部件，然后在启用自动连接（autoconnect）的情况下，拖放一个新的\
  \ `TextView` 小部件，使其水平居中，并位于布局顶部边缘的 `16dp` 边距线上：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\
  \n图 28-1\n\n拖入第二个 `TextView` 小部件，并对其进行定位和约束，使其与第一个小部件保持 `32dp` 的边距距离：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  \n图 28-2\n\n使用 `Attributes` 工具窗口将 `TextView` 小部件的 ID 分别改为 `textView1` 和 `textView2`。将小部件上显示的文本更改为“Touch\
  \ One Status”和“Touch Two Status”，并使用布局编辑器右上角的警告按钮将字符串提取到资源。\n\n## 28.7 实现触摸事件监听器\n\
  \n为了接收触摸事件通知，需要在 `MainActivity` Activity 类的 `onCreate()` 方法中为布局视图注册一个触摸监听器。从 Android\
  \ Studio 编辑器面板选择 `MainActivity.java` 标签页以显示源代码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现代码，在此情况下，代码将调用一个名为\
  \ `handleTouch()` 的第二个方法，并传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n.\n.\n\
  \        setContentView(view);\n        binding.main.setOnTouchListener(\n     \
  \       new ConstraintLayout.OnTouchListener() {\n                public boolean\
  \ onTouch(View v, MotionEvent m) {\n                    handleTouch(m);\n      \
  \              return true;\n                }\n            }\n        );\n    }\n\
  ```\n\n当我们设计用户界面时，父级 `ConstraintLayout` 未被分配允许我们通过 view binding 机制访问它的 ID。由于该布局组件是\
  \ UI 布局层次结构中的顶层组件，我们能够使用上述代码中的 `root` 绑定属性来引用它。\n\n在测试应用程序之前，最后一个任务是实现监听器调用的 `handleTouch()`\
  \ 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    for (int i = 0; i < pointerCount; i++) {\n       \
  \ int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n        int id = m.getPointerId(i);\n\
  \        int action = m.getActionMasked();\n        int actionIndex = m.getActionIndex();\n\
  \        String actionString;\n        switch (action) {\n            case MotionEvent.ACTION_DOWN:\n\
  \                actionString = \"DOWN\";\n                break;\n            case\
  \ MotionEvent.ACTION_UP:\n                actionString = \"UP\";\n             \
  \   break;\n            case MotionEvent.ACTION_POINTER_DOWN:\n                actionString\
  \ = \"PNTR DOWN\";\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n\
  \                actionString = \"PNTR UP\";\n                break;\n         \
  \   case MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n  \
  \              break;\n            default:\n                actionString = \"\"\
  ;\n        }\n        String touchStatus = \"Action: \" + actionString + \" Index:\
  \ \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，花时间系统地梳理这段代码以突出显示所执行的任务。\n\
  \n代码首先获取用户界面中两个 `TextView` 对象的引用，并识别当前视图上有多少指针处于活跃状态：\n\n```java\nTextView textView1\
  \ = findViewById(R.id.textView1);\nTextView textView2 = findViewById(R.id.textView2);\n\
  int pointerCount = m.getPointerCount();\n```\n\n接下来，`pointerCount` 启动一个 `for` 循环，对每个活跃指针执行操作。循环的前几行获取指针的\
  \ `X` 和 `Y` 坐标，以及相应的事件 `ID`、动作类型和索引。最后声明了一个字符串变量：\n\n```java\nfor (int i = 0; i\
  \ < pointerCount; i++) {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n\
  \    int id = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int\
  \ actionIndex = m.getActionIndex();\n    String actionString;\n}\n```\n\n由于动作类型等于整数值，使用\
  \ `switch` 语句将动作类型转换为更有意义的字符串值，并存储在之前定义的 `actionString` 变量中：\n\n```java\nswitch\
  \ (action) {\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\"\
  ;\n        break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\"\
  ;\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString\
  \ = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n  \
  \      actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 `ID` 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `ID` 值来决定该字符串应该显示在第一个还是第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\n\
  else\n    binding.textView2.setText(touchStatus);\n```\n\n## 28.8 运行示例应用程序\n\n编译并运行应用程序，启动后，在屏幕上进行单次和多触摸实验，并注意文本视图更新以反映事件，如图\
  \ 28-3 所示。在模拟器上运行时，可以通过按住 `Ctrl` 键（macOS 上为 `Cmd`）同时点击鼠标来模拟多触摸（注意，如果模拟器在工具窗口中运行，模拟多触摸可能无效）：\n\
  \n![](img/as_motion_event_running.jpg)\n\n图 28-3\n\n## 28.9 总结\n\n\n\n\nActivity\
  \ 通过注册 `onTouchListener` 事件监听器并实现 `onTouch()` 回调方法来接收触摸事件通知。当 Android 运行时调用该方法时，它会传入一个\
  \ `MotionEvent` 对象。该对象包含了有关触摸的信息，例如触摸事件的类型、触摸坐标以及当前与视图接触的触摸次数。\n\n当涉及多个触摸时，每个接触点被称为一个\
  \ `pointer`（指针），每个指针被分配了一个索引（index）和一个 `ID`。虽然触摸的索引可能会在不同事件之间发生，但在触摸结束之前，`ID` 将保持不变。\n\
  \n在本章中，我们通过创建一个 Android 应用程序示例来完成相关工作，该程序旨在显示设备屏幕上同时多达两个触摸操作的坐标和动作类型。\n\n在概述了通用触摸操作后，下一章（标题为[使用\
  \ Android GestureDetector 类检测常见手势”]）将通过手势识别进一步探讨触摸屏事件处理。\n\n# 29. 使用 Android GestureDetector\
  \ 类检测常见手势\n\n“手势”一词定义了触摸屏与用户之间连续的交互序列。一个典型的手势开始于屏幕首次被触摸的点，结束于最后一个手指或指针设备离开显示表面。如果利用得当，手势可以实现用户与应用程序之间的通信。用于翻电子电子书页的滑动动作，或涉及两个触摸以放大或缩小图像的捏合动作，都是手势如何与应用程序交互的绝佳示例。\n\
  \nAndroid SDK 提供了在应用程序中检测常见和自定义手势的机制。常见手势包括交互，如点击（tap）、双击（double tap）、长按（long press）或水平或垂直方向的滑动动作（在\
  \ Android 术语中称为 fling，快速滑动）。\n\n本章将探索使用 `GestureDetector` 类来检测在 Android 设备屏幕上执行的常见手势。下一章[在\
  \ Android 上实现自定义手势和双指缩放识别]将涵盖更复杂的自定义手势，例如圆形运动和捏合手势。\n\n## 29.1 实现常见手势检测\n\n当用户与\
  \ Android 设备的屏幕进行交互时，系统会调用当前活动应用程序的 `onTouchEvent()` 方法，并传入包含用户接触屏幕数据的 `MotionEvent`\
  \ 对象。可以对这些数据进行解释，以识别屏幕上的动作是否匹配点击或滑动等常见手势。通过使用 `GestureDetectorCompat` 类，只需极少的编程工作即可实现此目标。该类设计用于接收应用程序的运动事件信息，并根据检测到的常见手势类型（如果有）触发方法调用。\n\
  \n检测常见手势的基本步骤如下：\n\n1. 声明实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，它可以是一个全新的类，也可以是嵌套的 Activity 类。如果需要双击手势检测，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n2. 创建 `GestureDetectorCompat` 类的实例，并将步骤 1 创建的类实例作为参数传递。\n\
  3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，根据需要启用双击检测。\n\
  4. 在所属 Activity 中实现 `onTouchEvent()` 回调方法，该方法必须调用 `GestureDetectorCompat` 实例的 `onTouchEvent()`\
  \ 方法，并将当前运动事件对象作为参数传递给该方法。\n\n一旦实现，结果就是在应用程序代码中 set 了一组方法，当检测到特定类型的手势时将调用这些方法。可以实现这些方法内部的代码来执行任何响应相应手势需要执行的任务。\n\
  \n在本章的剩余部分中，我们将创建一个示例项目，旨在将上述步骤付诸实践。\n\n## 29.2 创建示例手势检测项目\n\n该项目旨在检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常见手势，并向用户显示状态信息，以指示检测到的手势类型。\n\n从欢迎屏幕选择 New Project（新建项目）选项，在生成的新项目对话框中，点击\
  \ Next 按钮之前选择 Empty Views Activity 模板。\n\n在 Name 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n按照章节[11.8 将项目迁移到 View Binding]所述，调整项目以使用 view binding。\n\n一旦创建了新项目，在\
  \ Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml` 文件，并双击它将其加载到 Layout\
  \ Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!”TextView 组件，并在 Attributes\
  \ 工具窗口中输入 `gestureStatusText` 作为 ID。最后，将 `textSize` 设置为 20sp 并启用粗体样式 `textStyle`：\n\
  \n![](img/as_common_gestures_text_style.jpg)\n图 29-1\n\n## 29.3 实现监听器类\n\n如前所述，有必要创建一个实现\
  \ `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口。虽然可以是一个全新的类，但在当前 Activity 类中实现它也是完全有效的。因此，我们将修改 `MainActivity` 类来实现这些监听器接口。编辑\
  \ `MainActivity.java` 如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\n\
  import android.view.GestureDetector;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n}\n```\n\n声明该类实现了监听器意味着必须实现相应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \nimport android.view.MotionEvent;\n\npublic class MainActivity extends AppCompatActivity\
  \ implements GestureDetector.OnGestureListener, GestureDetector.OnDoubleTapListener\
  \ {\n\n    @Override\n    public boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean onFling(MotionEvent\
  \ event1, MotionEvent event2, float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2, float\
  \ distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"onScroll\"\
  );\n        return true;\n    }\n\n    @Override\n    public void onShowPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onShowPress\");\n    }\n\
  \n    @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n```\n\n\n\
  \n\n```java\nbinding.gestureStatusText.setText(\"onSingleTapUp\");\n\nreturn true;\n\
  \n}\n\n@Override\npublic boolean onDoubleTap(MotionEvent event) {\n    binding.gestureStatusText.setText(\"\
  onDoubleTap\");\n    return true;\n}\n\n@Override\npublic boolean onDoubleTapEvent(MotionEvent\
  \ event) {\n    binding.gestureStatusText.setText(\"onDoubleTapEvent\");\n    return\
  \ true;\n}\n\n@Override\npublic boolean onSingleTapConfirmed(MotionEvent event)\
  \ {\n    binding.gestureStatusText.setText(\"onSingleTapConfirmed\");\n    return\
  \ true;\n}\n\n.\n.\n}\n```\n\n请注意，这些方法中的许多都返回 `true`。这告诉 Android 框架该方法已经消耗了事件，不需要将其传递给栈中的下一个事件处理器。\n\
  \n## 29.4 创建 GestureDetectorCompat 实例\n\n现在 activity 类已更新以实现这些监听器接口，下一步是创建 `GestureDetectorCompat`\
  \ 类的实例。由于这只需要在 activity 创建时执行一次，因此此代码的最佳位置是在 `onCreate()` 方法中。由于我们还想检测双击，代码还需要调用\
  \ `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport androidx.core.view.GestureDetectorCompat;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \n.\n.\n\n        this.gDetector = new GestureDetectorCompat(this,this);\n     \
  \   gDetector.setOnDoubleTapListener(this);\n    }\n\n.\n.\n}\n```\n\n## 29.5 实现\
  \ onTouchEvent() 方法\n\n如果此时编译并运行应用程序，即使在设备屏幕上执行手势，什么都不会发生。这是因为还没有添加代码来拦截触摸事件并将其传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一点，必须在 activity 类中重写 `onTouchEvent()` 方法并实现它，使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，在 `MainActivity.java` 文件中实现该方法，其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类的方法的实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 29.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意，文本视图会更新以反映这些事件，如图图\
  \ 29-2 所示：\n\n![](img/as_common_gestures_running.jpg)\n\n图 29-2\n\n## 29.7 总结\n\n\
  用户与设备触摸屏之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间的交互方法。虽然一个手势可以包含几乎任何序列的动作，但有一套广泛使用的手势，触摸设备的用户已经对其非常熟悉。这些所谓的“常用手势”中的某些可以使用\
  \ Android Gesture Detector 类在应用程序中轻松检测。在本章中，我们从理论上和通过示例项目的实现概述了这种技术的使用。\n\n在本章涵盖了常用手势之后，下一章将介绍检测更广泛的手势类型，包括设计和检测您自定义手势的能力。\n\
  \n# 30. 在 Android 上实现自定义手势和缩放识别\n\n上一章涵盖了在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势理论上可以涉及几乎任何序列的触摸动作。由于此，Android\
  \ SDK 允许应用程序定义任何性质的自定义手势。这是一个多阶段的过程，其细节是本章的主题。\n\n## 30.1 Android Gesture Builder\
  \ \n\nAndroid SDK 允许开发者设计存储在文件中自定义手势。这些手势文件最容易使用 Gesture Builder 应用程序创建。一旦设计出手势，就可以包含手势数据的文件添加到应用程序中。在应用程序代码中，文件被加载到\
  \ `GestureLibrary` 类的实例中，该实例可以用于搜索与用户执行的手势匹配。\n\n## 30.2 GestureOverlayView 类\n\n\
  为了方便在应用程序中检测手势，Android SDK 提供了 `GestureOverlayView` 类。这个透明视图可以放在用户界面的其他视图之上，以检测手势。\n\
  \n## 30.3 检测手势\n\n手势的是通过加载使用 Gesture Builder 应用创建的手势文件，然后在 `GestureOverlayView`\
  \ 实例上注册 `GestureListener` 事件监听器来实现的。然后声明封装类实现 `OnGestureListener` 接口以及该接口所需的相应 `onGesturePerformed`\
  \ 回调方法。如果监听器检测到手势，Android 运行时系统将触发对 `onGesturePerformed` 方法的调用。\n\n## 30.4 识别特定手势\n\
  \n当检测到手势时，会调用 `onGesturePerformed` 方法并作为参数传递检测手势的 `GestureOverlayView` 对象的引用，以及一个包含手势信息的\
  \ `Gesture` 对象。\n\n通过访问 `Gesture` 对象，`GestureLibrary` 可以将检测到的手势与之前加载到应用程序的手势文件进行比较。`GestureLibrary`\
  \ 通过计算预测得分来报告用户执行的手势与手势文件项匹配的概率。预测得分 1.0 或更高通常被认为是文件中存储的手势与用户在设备屏幕上执行的手势良好匹配。\n\n\
  ## 30.5 安装和运行 Gesture Builder 应用程序\n\n创建手势文件最简单的方法是使用允许捕获和保存手势动作的应用程序。虽然 Google\
  \ 最初提供过此类用途的应用程序，但它对较新版本的 Android 维护不足。幸运的是，可以通过 Gesture Builder Tool 应用程序作为替代方案，它可以在\
  \ Google Play 商店通过以下 URL 获取：[`play.google.com/store/apps/details?id=migueldp.runeforge`](https://play.google.com/store/apps/details?id=migueldp.runeforge)\n\
  \n## 30.6 创建手势文件\n\n\n\n\n\n当手势构建工具（Gesture Builder Tool）加载完成后，点击设备屏幕底部的 `Create\
  \ New Gesture` 按钮，并在灰色画布上使用圆形运动“画出”手势，如图 30-1 所示。假设手势显示符合预期（用设备屏幕上的黄色线条表示），点击 `save`\
  \ 按钮将手势添加到手势文件中，在提示输入名称时输入“Circle Gesture”：\n\n![](img/as_gesture_builder_app.jpg)\n\
  \n图 30-1\n\n手势保存保存后，手势构建工具将显示当前定义的手势列表，该列表将仅包含新定义的 `Circle Gesture`。\n\n## 30.7\
  \ 创建示例项目\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `CustomGestures`，并指定 `com.ebookfrenzy.customgestures` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改 `Java`。按照第 11.8 节将项目迁移到 View Binding 节所述，调整项目以使用 view binding。\n\n## 30.8\
  \ 从 SD 卡中提取手势文件\n\n由于每个手势都是在手势构建应用程序中创建的，它们被添加到名为 `gesture.txt` 的文件中，该文件位于运行应用程序的模拟器或设备的存储中。然而，在将此文件添加到\
  \ Android Studio 项目之前，必须将其从设备存储复制并保存到本地文件系统中。使用 Android Studio 的 `Device File Explorer`\
  \ 工具窗口最容易实现。使用 `View -> Tool Windows -> Device File Explorer` 菜单选项显示此工具。显示后，从下拉菜单选择创建手势文件的设备或模拟器，然后导航文件系统到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在此文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 `Save As…` 菜单选项，并将文件保存到临时位置并命名为 `gestures`。\n\n![](img/as_device_explorer.jpg)\n\
  \n图 30-2\n\n一旦创建并从设备存储中拉取手势文件，就可以将其作为资源文件添加到 Android Studio 项目。\n\n## 30.9 将手势文件添加到项目\n\
  \n在 Android Studio Project 工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），并从出现的菜单中选择 `New ->\
  \ Directory`。在 `New Directory` 对话框中，输入 `raw` 作为文件夹名并按键盘回车键。使用适用于你操作系统类型的适当文件资源管理器，找到之前从设备存储中拉取的手势文件，并将其复制并粘贴到\
  \ Project 工具窗口中新的 `raw` 文件夹中。\n\n## 30.10 设计用户界面\n\n此示例应用需要一个用户界面，由一个 `ConstraintLayout`\
  \ 视图组成，其上方叠加了一个 `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击它将其加载到 Layout Editor 工具中，并选择删除默认的 `TextView` 小部件。\n\n切换布局编辑器的 Code 模式并修改\
  \ XML，使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 30.11 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码在 activity 启动时加载文件。对于此项目，实现此目的的代码将如下添加到\
  \ `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\n.\n\
  .\n\nimport android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\n\
  import android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformed;\n\
  \npublic class MainActivity extends AppCompatActivity implements OnGesturePerformed\
  \ {\n    privateMainBinding binding;\n    private GestureLibrary gLibrary;\n\n \
  \   @Override\n    protected void onCreate(Bundle savedInstanceState) {\n      \
  \  super.onCreate(savedInstanceState);\n.\n.\n        gestureSetup();\n    }\n\n\
  \    private void gestureSetup() {\n        gLibrary = GestureLibraries.fromResource(this,\
  \ R.raw.gestures);\n\n        if (!gLibrary.load()) {\n            finish();\n \
  \       }\n    }\n}\n```\n\n除了一些导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，然后将其加载手势文件。activity 类也已修改实现 `OnGesturePerformed`，这需要添加 `onGesturePerformed`\
  \ 方法（稍后创建）。\n\n## 30.12 注册事件监听器\n\n为了让 activity 接收在屏幕上执行手势的通知，需要按照下面的代码在 `gLayout`\
  \ 视图上注册 `OnGesturePerformed` 监听器：\n\n```java\nprivate void gestureSetup() {\n  \
  \  gLibrary = GestureLibraries.fromResource(this, R.raw.gestures);\n\n    if (!gLibrary.load())\
  \ {\n        finish();\n    }\n    binding.gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n## 30.13 实现 onGesturePerformed 方法\n\n测试应用程序之前只需实现 `onGesturePerformed`\
  \ 回调。当 `GestureOverlayView` 实例上执行手势时，将调用此方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n.\n\nimport android.gesture.Prediction;\nimport android.widget.Toast;\nimport\
  \ android.gesture.Gesture;\nimport java.util.ArrayList;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements OnGesturePerformed {\n    \n    public void\
  \ onGesturePerformed(GestureOverlayView overlay, Gesture gesture) {\n        ArrayList<Prediction>\
  \ predictions = gLibrary.recognize(gesture);\n\n        if (!predictions.isEmpty()\
  \ && predictions.get(0).score > 1.0) {\n            String action = predictions.get(0).name;\n\
  \            Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n        }\n\
  \    }\n}\n```\n\n当 Android 运行时在手势视图对象上检测到手势时，会调用 `onGesturePerformed` 方法。作为参数传递的是检测手势的\
  \ `GestureOverlayView` 对象的引用以及 `Gesture` 类型的对象。`Gesture` 类设计用于持有定义手势的信息（本质上是一系列带有时间戳的点，描绘了构成手势的笔画路径）。\n\
  \n\n\n\n`Gesture` 对象被传递给 `gLibrary` 实例的 `recognize()` 方法，用于将当前手势与从手势文件中加载的每个势进行比较。一旦完成此任务，`recognize()`\
  \ 方法将返回一个 `ArrayList` 对象，其中包含每次比较结果对应的 `Prediction` 对象。该列表按照最佳匹配（位于数组位置 0 处）到最差匹配的顺序排序。每个\
  \ `prediction` 对象中包含了手势文件中对应手势的名称，以及一个指示其与当前手势匹配程度的预测评分。\n\n因此，上述方法中的代码会获取位置 0 处的预测（最匹配的项），确保其评分大于\
  \ 1.0，然后显示一个 `Toast` 消息（一种用于向用户显示通知弹窗的 Android 类），显示出匹配手势的名称。\n\n## 30.14 测试应用程序\n\
  \n在模拟器或物理 Android 设备上构建并运行应用程序，并在屏幕上执行圆圈手势。执行后，应该出现一个 toast 通知，其中包含检测到的手势名称。请注意，当手势被识别时，屏幕上会用亮黄色线条将其勾勒出来，而覆盖层不确定的手势则显示为淡黄色线条。虽然这在开发过程中很有用，但对于实际应用程序可能并不理想。因此，还有一些配置工作需要完成。\n\
  \n## 30.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请如下所示修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们在 `ConstraintLayout` 视图的白色背景上以白色绘制）。\n\
  \n## 30.16 截获手势\n\n如前所述，`GestureOverlayView` 是一个透明覆盖层，可以放置在其他视图之上。这引出了问题：当手势被识别时，由手势覆盖层拦截的事件是否应该传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性控制。当设置为 `true`\
  \ 时，当识别到手势时，手势事件不会传递给底层视图。当在可能配置为响应某些手势而滚动的视图上执行操作时，此设置特别有用。将此属性设置为 `true` 将避免手势同时被解释为底层视图向特定方向滚动的指令。\n\
  \n## 30.17 检测缩放手势\n\n在讨论通触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势（pinch gestures）。虽然可以使用本章之前章节概述的步骤创建并检测各种手势，但实际上，使用目前讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和捏合动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势的最简单方法是使用 Android 的 `ScaleGestureDetector` 类。简单来说，检测缩放手势涉及以下三个步骤：\n\n1.\
  \ 声明实现 `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和\
  \ `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  3. 在所属 activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。在本章的剩余部分，我们将创建一个示例来演示缩放手势识别的实现。\n\n## 30.18 缩放手势示例项目\n\n从欢迎屏幕选择 New Project\
  \ 选项，在出现的新项目对话框中，在点击 Next 按钮之前选择 Empty Views Activity 模板。\n\n在 Name 字段中输入 `PinchExample`\
  \ 并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 Java。按照 11.8 Migrating a Project to View\
  \ Binding 中的步骤将项目转换为使用 view binding。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView`\
  \ 对象并使用 Attributes 工具窗口将 ID 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java` 文件到 Android\
  \ Studio 编辑器中，并如下修改文件：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\nimport\
  \ android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private ScaleGestureDetector gestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        gestureDetector\
  \ = new ScaleGestureDetector(this, new MyOnScaleGestureListener());\n    }\n\n \
  \   @Override\n    public boolean onTouchEvent(MotionEvent event) {\n        gestureDetector.onTouchEvent(event);\n\
  \        return true;\n    }\n\n    public class MyOnScaleGestureListener extends\
  \ SimpleOnScaleGestureListener {\n        @Override\n        public boolean onScale(ScaleGestureDetector\
  \ detector) {\n            float scaleFactor = detector.getScaleFactor();\n    \
  \        if (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming\
  \ In\");\n            } else {\n                binding.myTextView.setText(\"Zooming\
  \ Out\");\n            }\n            return true;\n        }\n\n        @Override\n\
  \        public boolean onScaleBegin(ScaleGestureDetector detector) {\n        \
  \    return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n\n\n在模拟器或物理 Android 设备上编译并运行应用程序，并在屏幕上执行缩合手势，请注意文本视图将根据缩合动作显示放大或缩出的消息。在模拟器的独立模式下，可以通过按住\
  \ `Ctrl`（或 macOS 上的 `Cmd`）键并点击拖动鼠标指针来模拟缩合手势，如图图 30-3 所示：\n\n![](img/Image2449.jpg)\n\
  \n图 30-3\n\n# 30.19 总结\n\n手势是触摸屏幕上接触点的运动，涉及一个或多个笔画，可以作为用户与应用程序之间的通信方法。Android 允许使用\
  \ Gesture Builder 来设计手势。一旦创建，手势就可以保存到手势文件中，并在应用程序运行时使用 `GestureLibrary` 加载到 `activity`\
  \ 中。\n\n通过在现有视图上覆盖透明的 `GestureOverlayView` 类的实例并实现 `OnGesturePerformedListener`\
  \ 事件监听器，可以在显示器区域上检测手势。使用 `GestureLibrary`，可以生成用户执行的手势与存储在手势文件中的势之间的匹配排序列表，并使用预测分数来决定手势是否足够匹配。\n\
  \n可以通过实现 `ScaleGestureDetector` 类来检测缩放手势，本章也提供了该类的示例。\n\n## 31. Android Fragments\
  \ 简介\n\n随着你对本书章节的深入学习，你会越来越地发现，Android 系统背后的许多设计理念的构想是为了促进组成应用程序的不同元素之间的复用和交互。本章将探索的这样一个领域涉及使用\
  \ `Fragments`。\n\n本章将概述 fragment 的基础知识，包括它们是什么以及如何在应用程序中创建和使用它们。下一章将通过教程展示如何在 Android\
  \ Studio 中开发应用程序时让 fragment ，包括 fragment 之间通信的实现。\n\n## 31.1 什么是 Fragment？\n\nFragment\
  \ 是应用程序用户界面及其相应行为的自包含的、模块化的部分，可以嵌入到 `activity` 中。在应用程序设计阶段，可以组合 fragment 来创建一个 `activity`，并在应用程序运行时将其添加到\
  \ `activity` 或从 `activity` 中移除，以创建动态变化的用户界面。\n\nFragment 只能作为 `activity` 的部分使用，不能作为独立的应用程序元素进行实例化。然而，fragment\
  \ 可以被视为一个功能性的“子活动”，其生命周期与完整 activity 的生命周期相似。\n\nFragment 以 XML 布局文件的形式存储。可以通过在\
  \ activity 的布局文件中放置适当的 `<fragment>` 元素，或者通过 activity 类实现中的代码将其添加到 `activity` 中。\n\
  \n## 31.2 创建 Fragment\n\n构成 fragment 的两个组件是 XML 布局文件和对应的 `Java` 类。fragment 的 XML\
  \ 布局文件格式与任何其他 activity 布局的格式相同，可以包含布局管理器和视图的任何组合和复杂度。例如，下面的 XML 布局用于一个由具有红色背景的 `ConstraintLayout`\
  \ 组成的 fragment，其中包含一个白色前景的单个 `TextView`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/constraintLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:background=\"@android:color/holo_red_dark\"\n    tools:context=\"\
  .FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  My First Fragment\"\n        android:textAppearance=\"@style/TextAppearance.AppCompat.Large\"\
  \n        android:textColor=\"@color/white\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n与布局对应的类必须是 Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment\
  \ 布局。例如：\n\n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\n\
  import android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n    @Override\n    public View onCreateView(LayoutInflater inflater, ViewGroup\
  \ container, Bundle savedInstanceState) {\n        // 加载此 fragment 的布局\n       \
  \ binding = FragmentBinding.inflate(inflater, container, false);\n        return\
  \ binding.getRoot();\n    }\n```\n\n除了 `onCreateView()` 方法外，该类还可能重写标准方法。一旦创建了 fragment\
  \ 布局和类，fragment 就可以在 activity 中使用了。\n\n## 31.3 将 Fragment 添加到 Activity\n\n可以通过编写\
  \ Java 代码或将 fragment 嵌入布局文件将其整合到 activity 中。无论使用哪种方法，需要注意的关键点是，当使用支持库时，任何使用 fragment\
  \ 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity`：\n\n```java\n\
  package com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\
  \npublic class MainActivity extends FragmentActivity {\n```\n\nFragment 使用 `FragmentContainerView`\
  \ 类。以下示例将上一节创建的 fragment 嵌入到 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/fragment2\"\n        android:name=\"com.ebookrenzy.myfragmentdemo.FragmentOne\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"wrap_content\"\
  \n        android:layout_marginStart=\"32dp\"\n        android:layout_marginEnd=\"\
  32dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\"\n        tools:layout=\"@layout/fragment_one\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n`<fragment>` 元素中的关键属性是 `android:name`，它必须引用与 fragment 关联的类，以及 `tools:layout`，引用包含\
  \ fragment 布局的 XML 资源文件。\n\n一旦添加到 activity 的布局中，就可以 Android Studio 布局编辑器工具中查看并操作\
  \ fragment。例如图 31-1 显示了在 Android Studio 布局编辑器中带有嵌入 fragment 的上述布局：\n\n\n\n\n\n![](img/as_4.1_my_first_fragment.jpg)\n\
  \n图 31-1\n\n### 31.4 在代码中添加和管理 Fragment\n\n通过 activity 的 XML 布局文件添加 fragment 虽然方便，但代价是\
  \ activity 无法在运行时移除该 fragment。为了实现在运行时对 fragment 进行完全的动态控制，必须通过代码添加这些 activity。这样做的处是可以在应用程序运行时动态地添加、删除\
  \ fragment，甚至让它们动态相互替换。\n\n当使用代码管理 fragment 时，fragment 仍然包含一个 XML 布局文件和一个对应的类。区别在于在宿主\
  \ activity 中操作 fragment。使用代码向 activity 添加 fragment 时，有一套标准的步骤序列：\n\n1. 创建 fragment\
  \ 类的实例。\n2. 将任何额外的 intent 参数传递给类实例。\n3. 获取 fragment manager 实例的引用。\n4. 在 fragment\
  \ manager 实例上调用 `beginTransaction()` 方法。这返回一个 fragment 事务实例。\n5. 调用 fragment 事务实例的\
  \ `add()` 方法，将要包含 fragment 的视图资源 ID 和 fragment 类实例作为参数传递。\n6. 调用 fragment 事务的 `commit()`\
  \ 方法。\n\n例如，下面的代码添加了由 `FragmentOne` 类定义的 fragment，使其出现在 ID 为 `LinearLayout1` 的容器视图中：\n\
  \n```java\nFragmentOne firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n上面的代码将每一步都拆分为独立的语句以保持清晰。然而，最后四行可以缩写为一行代码，如下：\n\
  \n```java\ngetSupportFragmentManager().beginTransaction()\n        .add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦添加到容器中，可以通过调用 fragment 事务实例的 `remove()` 方法来移除\
  \ fragment，传递要移除的 fragment 实例引用：\n\n```java\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 fragment 事务实例的 `replace()` 方法将一个 fragment 替换另一个。该方法的参数是包含 fragment\
  \ 的视图 ID 和新 fragment 的实例。被替换的 fragment 也可以放置在所谓的返回栈（back stack）中，这样当用户导航回它时可以快速恢复。这是通过在调用\
  \ `commit()` 方法之前调用 fragment 事务对象的 `addToBackStack()` 方法实现的：\n\n```java\nFragmentTwo\
  \ secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n### 31.5 处理 Fragment\
  \ 事件\n\n如之前讨论的，fragment 类似于一个子 activity，拥有自己的布局、类和生命周期。fragment 内部的视图组件（如按钮和文本视图）可以像普通\
  \ activity 一样产生事件。这引发了一个问题：哪个类接收来自 fragment 中视图的事件，是 fragment 本身，还是嵌入 fragment 的\
  \ activity？这个问题的答案取决于如何声明事件处理程序。\n\n在标题为 Android 事件处理概览与示例 的章节中，讨论了两种处理事件的方法。第一种涉及在\
  \ activity 代码中配置事件监听器和回调方法。例如：\n\n```java\nbinding.button.setOnClickListener(\n\
  \    new Button.OnClickListener() {\n        public void onClick(View v) {\n   \
  \         // 当按钮被点击时\n            // 执行的代码\n        }\n    }\n);\n```\n\n在拦截点击事件的情况下，第二种方法涉及在\
  \ XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\n fragment\
  \ 中视图生成的事件通用规则是：如果在 fragment 类中使用事件监听器和回调方法声明了事件监听器，事件将首先由 fragment 处理。但如果使用了 `android:onClick`\
  \ 资源，事件将直接传递给包含 fragment 的 activity。\n\n### 31.6 实现 Fragment 通信\n\n一旦一个或多个 fragment\
  \ 被嵌入 activity 中，fragment 与 activity 之间很可能需要某种形式的通信。要与 fragment 通信，activity 必须通过\
  \ ID 识别 fragment 对象。一旦获取该引用，activity 就可以调用 fragment 的公共方法。\n\n反向通信（从 fragment 到\
  \ activity）稍微复杂一点。首先，fragment 必须定义一个监听器接口，然后在 activity 中实现该接口。例如，下面的代码声明了一个名为 `ToolbarFragment`\
  \ 的 fragment。代码还声明了一个变量用于存储 activity 的引用：\n\n```java\npublic class ToolbarFragment\
  \ extends Fragment {\n    ToolbarListener activityCallback;\n\n    public interface\
  \ ToolbarListener {\n        void onButtonClick(int position, String text);\n  \
  \  }\n}\n```\n\n上面的代码规定，任何实现接口的类都必须实现一个回调方法，该方法转接受一个整数和一个字符串。接下来，需要重写并实现 fragment\
  \ 类的 `Attach()` 方法。该方法在 fragment 初始化并关联 activity 之后由 Android 系统自动调用。该方法传递包含 fragment\
  \ 的 activity 引用。该方法必须存储该 activity 的本地引用并验证它是否实现了 `ToolbarListener` 接口：\n\n```java\n\
  @Override\npublic void onAttach(Context context) {\n    super.onAttach(context);\n\
  \    try {\n        activityCallback = (ToolbarListener) activity;\n    } catch\
  \ (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，activity 的引用将存储在本地\
  \ `activityCallback` 变量中，如果该 activity 没有实现 `ToolbarListener` 接口，则会抛出异常。下一步是在 fragment\
  \ 内部调用 activity 的回调方法。何时以及如何发生这种情况，完全取决于 fragment 需要联系 activity 的情况。例如，下面的代码在按钮被点击时调用\
  \ activity 的回调方法：\n\n```java\npublic void buttonClicked(View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作是修改 activity 类以实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n    implements ToolbarFragment.ToolbarListener\
  \ {\n\n    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n}\n```\n\n\n\n\n\n正如我们从上方代码所示，该活动（activity）声明它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，并按照接口要求实现了 `onButtonClick()` 方法。\n\n# 31.7 总结\n\n片段（Fragments）为创建可重用的用户界面布局和应用程序行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入到活动中。一个片段由一个用户界面布局文件和一个类组成。可以通过将片段添加到活动的布局文件中，或者通过编写代码在运行时管理片段，从而在活动中使用片段。在代码中添加到活动中的片段可以在运行时动态地删除和替换。片段之间的所有通信都应该通过嵌入这些片段的活动来进行。\n\
  \n在本章涵盖了片段的基础知识后，下一章将通过一个教程来强化本文章中概述的技术。\n\n# 32. 在 Android Studio 中使用片段 - 示例\n\n\
  正如上一章概述的，片段为创建可重用的应用程序功能模块提供了一种方便的机制，这些模块包含用户界面的部分以及相应的行为。一旦创建，片段就可以嵌入到活动中。\n\n\
  在上一章探索了片段的通用理论后，本章旨在使用 Android Studio 创建一个 Android 应用程序示例，用于演示创建和使用片段、以及在活动内实现片段片段之间通信的实际步骤。\n\
  \n## 32.1 关于示例片段应用程序\n\n在本章创建的应用程序将由单个活动和两个片段组成。第一个片段的用户界面将包含一个工具栏，由一个 `EditText`\
  \ 视图、一个 `SeekBar` 和一个 `Button` 组成，全部包含在一个 `ConstraintLayout` 视图中。第二个片段将仅由 `ConstraintLayout`\
  \ 视图中的 `TextView` 对象组成。\n\n这两个片段将嵌入应用程序的主活动中，并实现如下通信：当第一个片段中的按钮被按下时，输入到 `EditText`\
  \ 视图中的文本将显示在第二个片段的 `TextView` 上，其字体大小由第一个片段中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在运行在较期的\
  \ Android 版本上，我们需要使用适当的 Android 支持库。\n\n## 32.2 创建示例项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `FragmentExample`，并指定\
  \ `com.ebookfrenzy.fragmentexample` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单改为 `Java`。按照 11.8 将项目迁移到 View Binding\
  \ 中概述步骤修改项目以使用视图绑定。\n\n## 32.3 创建第一个片段布局\n\n下一步是为活动内部使用的第一个片段创建用户界面。\n\n此用户界面将由一个\
  \ XML 布局文件和一个片段类组成。虽然可以手动添加，但让 Android Studio 为我们创建它们会更快。在项目工具窗口中，找到 `app -> java\
  \ -> com.ebookfrenzy.fragmentexample` 条目并对其点击右键。从出现的菜单中，选择 `New -> Fragment -> Gallery...`\
  \ 选项以显示下方图 32-1 所示的对话框：\n\n![](img/as_fragment_gallery.jpg)\n\n图 32-1\n\n在点击 `Next`（下一步）按钮之前选择\
  \ `Fragment (Blank)` 模板。在后续屏幕上，将片段命名为 `ToolbarFragment`，布局文件名为 `fragment_toolbar`：\n\
  \n![](img/as_new_fragment_java.jpg)\n\n图 32-2\n\n使用 `Design`（设计）模式将 `fragment_toolbar.xml`\
  \ 文件加载到布局编辑器中。接下来，在组件树（Component Tree）面板中右键点击 `FrameLayout` 条目，选择 `Convert FrameLayout\
  \ to ConstraintLayout`（将 FrameLayout 转换为 ConstraintLayout）菜单选项，并在确认对话框中接受默认设置。将\
  \ `id` 更改为 `constraintLayout`。确保启用了 `Autoconnect` 模式，然后选择并删除默认的 `TextView`，并添加 `Plain\
  \ Text`（纯文本）、`Seekbar` 和 `Button` 控件，以便它们的位置匹配图 32-3 所示。最后，将视图 ID 分别更改为 `editText1`、`seekBar1`\
  \ 和 `button1`。\n\n将按钮上的文本改为“Change Text”，将文本提取到名为 `change_text` 的字符串资源中，并移除 `EditText`\
  \ 视图中的 `Name` 文本。最后，将 `Seekbar` 的 `layout_width` 属性设置为 `match_constraint`，左右边缘设置边距为\
  \ `16dp`。\n\n使用 `Infer constraints`（推断约束）按钮添加任何缺失的约束，此时布局应匹配下方图 32-3 所示：\n\n![](img/as_fragment_example_frag_one_ui.jpg)\n\
  \n图 32-3\n\n## 32.4 将片段迁移到 View Binding\n\n与 `Empty Views Activity` 模板一样，当向项目中添加新片段时，Android\
  \ Studio 不会启用视图绑定支持。因此，我们需要在移动到此教程的下一步之前执行此迁移。从编辑 `ToolbarFragment.java` 文件开始，并如下如下导入片段的绑定类（binding）：\n\
  \n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（还包括在片段销毁时添加 `onDestroyView()` 方法）：\n\
  \n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    // 填充此片段的布局\n\
  \    binding = FragmentToolbarBinding.inflate(inflater, container, false);\n   \
  \ return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView() {\n   \
  \ super.onDestroyView();\n    binding = null;\n}\n```\n\n完成这些更改后，该片段可以使用视图绑定。\n\n\
  ## 32.5 添加第二个片段\n\n重复创建工具片段的步骤，添加另一个空白片段 `TextFragment`，布局名为 `fragment_text`。再次将\
