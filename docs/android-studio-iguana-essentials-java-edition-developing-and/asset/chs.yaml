  \           android.R.drawable.ic_dialog_info)\n                        .setContentText(\"\
  Reply received\")\n                        .build();\n        notificationManager.notify(notificationId,\n\
  \                repliedNotification);\n    }\n}\n```\n\n最后测试一次应用，验证在发送内联回复文本后进度指示器是否消失。\n\
  \n## 63.10 总结\n\n直接回复功能允许在通知内输入文本并通过 `RemoteInput` 类进行处理。在处理直接回复时，使用 `NotificationManager`\
  \ 服务通过 `ID` 更新通知是非常重要的。\n\n## 64.1 折叠屏设备与多窗口\n\n折叠屏设备即将到来，为了做好准备，即使对于折叠屏设备，意识到用户在折叠或展开显示器时发生的一些配置变化也是关重要的。多窗口支持最初在\
  \ Android 7 中引入，允许同时显示多个活动。\n\n画中画（Picture-in-picture）支持顾如其义，允许视频用户在用户用户其他任务时时较继续继续，该主题将在\
  \ `Android Picture-in-Picture` 所示的 Foldable 选项：\n\n![](img/as_foldable_avd.jpg)\n\
  \n图 64-3\n\n选择折叠屏选项后，继续创建过程，选择 Android 10 API 29 或更高版本作为系统镜像。一旦模拟器运行，工具栏中将出现一个额外的按钮，允许模拟器在折叠和展开配置之间切换。\n\
  \n## 64.3 进入多窗口模式\n\n可以通过显示概览（Overview）屏幕，在列出的应用工具栏中长按应用图标，并选择分屏（Split screen）菜单选项来进入，如\
  \ 图 64-5 所示：\n\n![](img/as_3.5_split_screen_button.jpg)\n\n图 64-5\n\n\n\n\n\n一旦进入分屏模式，`Overview`\
  \ 按钮将更改为显示两个矩形（在图 64-6 中标记为 A），当前活动将占据屏幕的一部分 (B)，而 `Overview` 屏幕将出现在屏幕的相邻部分，允许选择第二个活动进行显示\
  \ (C)：\n\n![](img/as_3.5_split_screen_select_second_app.jpg)\n\n图 64-6\n\n一旦选择了第二个应用，屏幕将如上文图\
  \ 64-1 所示被平分为两份。\n\n要退出分屏模式，只需将分离两个活动的拆分线拖动到远端边缘，使只有一个活动占据整个屏幕，或者长按 `Overview` 按钮直到它恢复为单个正方形。\n\
  \n## 64.4 启用和使用自由窗口支持\n\n虽然在所有设备上都受到官方支持，但在大屏设备和模拟器上可以启用自由窗口多窗口模式。要启用此模式，请在模拟器运行或设备连接时运行以下\
  \ `adb` 命令：\n\n```bash\nadb shell settings put global enable_freeform_support 1\n\
  ```\n\n在进行此更改后，可能需要重启设备设置才会生效。\n\n一旦启用，在 `Overview` 屏幕上长按应用图标时，将出现一个额外的选项，如图 64-7\
  \ 所示：\n\n![](img/as_3.5_freeform_button.jpg)\n\n图 64-7\n\n## 64.5 检查自由窗口支持\n\n如本章前面的概述，Google\
  \ 将是否启用自由窗口多窗口模式的选择权交给了各个 Android 设备制造商。由于只有在较大的设备上使用自由窗口才有意义，因此无法保证在每个可能运行该应用程序的设备上都提供自由窗口功能。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有特定的自由窗口的方法和属性，因此使用这些功能不会导致应用在非自由窗口设备上崩溃。然而，可能会出现某些情况，检测设备是否支持自由窗口多窗口模式是很有用的。幸运的是，可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查了自由窗口多窗口支持，并根据测试结果返回\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 64.6\
  \ 在应用中启用多窗口支持\n\n`android:resizableActivity` 清清单文件设置控制应用是否支持多窗口行为。此设置可以在应用程序级或单个活动级进行。例如，以下代码片段配置了名为\
  \ `MainActivity` 的活动，以同时支持分屏模式和自由窗口多窗口模式：\n\n```xml\n<activity\n    android:name=\"\
  .MainActivity\"\n    android:resizeableActivity=\"true\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme.NoActionBar\">\n    <intent-filter>\n    \
  \    <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n```\n\n\
  将该属性设置为 `false` 将防止活动出现在分屏或自由窗口模式下，并且相应的按钮将出现在应用的 `Overview` 菜单中。在分屏配置中选择一个禁用了多窗口支持的活动作为第二个活动，将显示一条消息，指示该应用可能不支持多窗口模式。\n\
  \n## 64.7 指定多窗口属性\n\n`<layout>` 元素提供了许多属性，用于指定活动在多窗口模式下启动时的尺寸和位置。当活动在自由窗口模式下启动时，可以使用以下属性指定其初始高度、宽度和位置：*\n\
  \n* `android:defaultWidth` – 指定活动的默认宽度。\n* `android:defaultHeight` – 指定活动的默认高度。\n\
  * `android:gravity` – 指定活动的初始位置（起始 start、结束 end、左 left、右 right、顶 top 等）。\n\n注意上述属性仅当活动在自由窗口模式下显示时才生效。以下示例配置了活动在屏幕起始边缘的顶部以特定的高度和宽度出现：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定活动在分屏视图或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n* `android:minimalHeight` – 指定活动在自由窗口模式下可以缩减到的最小高度。\n* `android:minimalWidth`\
  \ - 指定活动在自由窗口模式下可以缩减到的最小宽度。\n\n当用户将分屏滑动超过最小高度时，系统将停止调整活动的大小并仅对用户界面进行裁剪。以下清单片段实现了最小宽度和高度：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\" android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n## 64.8 在活动中检测多窗口模式\n\
  \n可能会某些情况，活动需要检测其是否正以多窗口模式显示给用户。可以通过调用 `Activity` 类的 `isInWindowMode()` 方法获取状态。该方法根据是否为全屏返回\
  \ `true` 或 `false` 值：\n\n```java\nif (isInWindowMode()) {\n    // 处于多窗口模式\n} else\
  \ {\n    // 不处于多窗口模式\n}\n```\n\n## 64.9 接收多窗口通知\n\n如果应用重写了 `onMultiWindowChanged()`\
  \ 回调方法，将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，在退出模式时为 `false`。新的配置包含在第二个参数\
  \ `Configuration` 对象中：\n\n```java\n@Override\npublic void onMultiWindowChanged(boolean\
  \ isInWindowMode, Configuration newConfig) {\n    super.onMultiWindowChanged(isInWindowMode,\
  \ newConfig);\n    if (isInWindowMode) {\n        // 进入了多窗口模式\n    } else {\n  \
  \      // 离开了多窗口模式\n    }\n}\n```\n\nAndroid 10 及更高版本的 Android 允许多个活动同时处于恢复状态（否则被称为多恢复）。与用户最近交互的活动被称为顶部恢复活动。为了跟踪活动获得和失去顶部恢复状态的过程，可以在活动中实现\
  \ `onTopResumedActivityChanged()` 回调方法，例如：\n\n```java\n@Override\npublic void onTopResumedActivityChanged(boolean\
  \ isTopResumedActivity) {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n\
  \    if (isTopResumedActivity) {\n        // 活动现在是顶部恢复活动\n    } else {\n       \
  \ // 活动不再是顶部恢复活动\n    }\n}\n```\n\n正如处理 Android 活动状态变化 章节中所述，在某些运行 Android 9 的设备上，通过在应用清单文件中启用以下属性，也可以在应用中利用多恢复功能。\n\
  \n\n\n\n\n# 64.10 在多窗口模式下启动 Activity\n\n在本书的“Android 显式意——实例演示”章节中，创建了一个示例应用，该应用使用\
  \ intent 启动第二个 Activity。默认情况下，通过 intent 启动的 Activity 被认为与源 Activity 位于同一个任务栈（task\
  \ stack）中。然而，通过向 intent 传递适当标志（flags），可以将 Activity 启动到新的任务栈中。\n\n当多窗口模式下的 Activity\
  \ 在同一任务栈内启动另一个 Activity 时，新 Activity 将替换分屏或自由窗口窗口中的源 Activity（用户可以通过返回键返回到原始 Activity）。\n\
  \n然而，当在分屏模式下启动到新的任务栈中时，第二个 Activity 将出现在原始 Activity 相邻的窗口中，从而允许两个 Activity 同时显示。在自由窗口模式下，启动的\
  \ Activity 将出现在与原始 Activity 独立的窗口中。\n\n若要将 Activity 启动到新的任务栈中，在启动 intent 之前必须对其设置以下标志：\n\
  \n• `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n• `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n\
  • `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n例如，以下代码配置并启动了一个设计在独立窗口中显示的第二个 Activity：\n\n\
  ```java\nIntent i = new Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nstartActivity(i);\n```\n\n# 64.11 配置自由窗口 Activity 大和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ Activity 将位于屏幕中心，其大小由系统决定。通过 `ActivityOptions` 类向 intent 传递启动边界（launch bounds）设置，可以控制此窗口的位置和尺寸。该过程的第一步是创建一个\
  \ `Rect` 对象，并配置代表 Activity 窗口的矩形的左（X）、顶（Y）、右（X）和底（Y）的坐标。例如，以下代码创建了一个 `Rect` 对象，其左上角位于坐标\
  \ (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(100, 800, 900, 700);\n\
  ```\n\n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法通过 `Rect` 设置初始化它：\n\
  \n```java\nActivityOptions options = ActivityOptions.makeBasic();\n\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle`\
  \ 对象，并与 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n结合这些步骤得到代码序列如下：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\n\
  \ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n\
  \           Intent.FLAG_ACTIVITY_NEW_TASK);\n\nRect rect = new Rect(100, 800, 900,\
  \ 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\n\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 Activity 处于自由窗口模式时，通过 intent 启动第二个 Activity，新 Activity 窗口将按照在 `Rect` 对象中定义的位置和尺寸出现。\n\
  \n# 64.12 总结\n\nAndroid 7 引入了多窗口支持，这是一个允许屏幕上任意同时显示多个 Activity 的系统。此功能现在构成了提供折叠设备支持的基础。多窗口支持提供的三种模式是分屏、自由窗口和画中画。在分屏模式下，屏幕被水平或垂直划分为两个窗格，每个窗格显示一个\
  \ Activity。自由窗口模式仅在某些 Android 设备上支持，它允许每个 Activity 出现在独立的、可移动且可调整大小的窗口中。正如本章概述，Android\
  \ SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n# 65. Android SQLite 数据库概述\n\n不需要存储至少一些持久化数据的移动应用寥寥无几。使用数据库是大多数应用程序不可或缺的，范围从几乎完全数据驱动的应用到需要存储少量数据（例如当前的游戏得分）的应用。\n\
  \n在考虑到典型 Android 应用的瞬态生命周期时，持久化数据存储的重要性变得更加明显。由于 Android 运行时系统始终存在终止应用组件以释放资源的风险，因此制定一个全面的数据存储策略以避免数据丢失，是设计和实现任何应用开发策略的关键因素。\n\
  \n本章将涵盖与 Android 操作系统绑定的 SQLite 数据库管理系统，并概述在 Android 应用中辅助持久化 SQLite 数据库存储的 Android\
  \ SDK 类。在深入探讨 Android 环境下 SQLite 的细节之前，将对数据库和 SQL 进行简要概述。\n\n## 65.1 理解数据库表\n\n\
  数据库表（Database Tables）提供了数据库中最基础层的数据结构。每个数据库可以包含多个表，每个表设计用于持有特定类型的信息。例如，一个数据库可以包含多个客户表，每个表用于存储客户的特定信息。同一个数据库可能还包含一个产品表，用于存储销售商品的代码。\n\
  \n数据库中的每个表都将被分配一个名称，该名称在数据库中必须是唯一的。\n\n## 65.2 引入数据库模式\n\n数据库模式（Database Schema）定义了存储在数据库表中数据的特征。例如，客户数据库表的模式可能定义客户名称为不超过\
  \ 20 个字符的字符串，客户电话号码为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及数据库中各个表之间的关系。\n\n## 65.3 列和数据类型\n\
  \n在此阶段，将数据库表视为类似于电子表格是有帮助的。\n\n每一列代表表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\n每一列反过来被定义为包含特定类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\
  \n## 65.4 数据库行\n\n保存到表的每个新记录都存储在行中。每一行反过来由与所保存记录相关的列组成。\n\n再次考虑本章早期描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每一列包含每个客户的数据。行有时称为记录（records）或条目（entries），这些术语通常互换。\n\
  \n## 65.5 引入主键\n\n\n\n\n每个数据库表都应该包含一或多个列，这些列可用于唯一标识表中的每一行。在数据库术语中，这被称为 `Primary\
  \ Key`（主键）。例如，一个表可以使用银行账户号作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地标识表中的特定行。如果没有主键，将无法检索或删除表中的特定行，因为无法确定选中的是否是正确的行。例如，假设有一个表将客户的姓氏定义为主键。想象一下，如果数据库中记录了多个姓“Smith”的客户，会产生什么问题。如果没有某种能够保证百分之无一的方法来唯一标识某一个特定行，就无法确保在任何时候访问的正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的条件，任何两行都不能包含匹配的主键值。当使用多个列构建主键时，单个列的值不需要是唯一的，但所有列的值组合在一起必须是唯一的。\n\
  \n## 65.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是主要示例）都是独立的服务器进程，它们独立运行并与需要数据库访问的应用程序协作。SQLite 被称为嵌入式，是因为它是以库的形式提供的，并链接到应用程序中。因此，没有独立的数据库服务器在后台运行。所有的数据库操作都是通过调用\
  \ SQLite 库中的函数在应用程序内部进行处理的。\n\nSQLite 的开发者已将该技术投入公共领域，结果是它现在已成为广泛部署的数据库解决方案。\n\n\
  SQLite 使用 C 语言编写，因此 Android SDK 在底层数据库接口之上提供了一个基于 Java 的“包装器”（wrapper）。它由许多类组成，可以在应用程序的\
  \ Java 或 Kotlin 代码中使用这些类来创建和管理基于 SQLite 的数据库。\n\n关于 SQLite 的更多信息，请参阅 [`www.sqlite.org`](http://www.sqlite.org)。\n\
  \n## 65.7 结构化查询语言 (SQL)\n\nSQLite 数据库使用一种名为结构化查询语言的高级语言来访问数据。这通常缩写为 `SQL`，读音为 sequel。`SQL`\
  \ 是大多数关系型数据库管理系统使用的标准语言。SQLite 基本上符合 `SQL-92` 标准。\n\n`SQL` 是一种简单且易用的语言，专门设计用于实现数据库数据的读写。由于\
  \ `SQL` 包含一小组关键字，因此可以快速学习。此外，大多数 DBMS 实现之间的 `SQL` 语法大同小异，因此在学习了一个系统的 `SQL` 之后，你的技能可能会迁移到其他数据库管理系统。\n\
  \n虽然本章将使用一些基础的 `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范围。然而，许多其他资源提供了比我们在这里单章中能提供的详尽得多的 `SQL`\
  \ 概述。\n\n## 65.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于不熟悉数据库和 SQLite 的读者来说，直接上手创建一个使用\
  \ SQLite 的 Android 应用程序可能看起来令而而畏。幸运的是，Android 在出厂时预装了 SQLite，其中包含一个交互式环境，允许在连接到运行中的\
  \ Android AVD 模拟器实例的 `adb shell` 会话中发布 SQL 命令。这是学习 SQLite 和 SQL 的实用方法，也是对于识别运行在模拟器中的应用程序所创建的数据库问题的宝贵工具。\n\
  \n要启动交互式 SQLite 会话，首先要运行 AVD 会话。这可以在 Android Studio 中通过启动 Android 虚拟设备管理器（Tools\
  \ -> Device Manager）、选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 启动并运行，打开终端或命令提示符窗口，并使用\
  \ `adb` 命令行工具如下所示连接到模拟器：\n\n```bash\nadb shell\n```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用\
  \ `su` 命令获取超级用户权限：\n\n```\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果消息显示不允许超级用户权限，则该\
  \ AVD 实例可能包含了 Google Play 支持。要解决这个问题，请创建一个新的 AVD，并在“选择设备定义”屏幕上，选择一个在“Play Store”列中没有标记的设备。\n\
  \nSQLite 数据库中的数据存储在运行应用程序的 Android 设备文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n`/data/data/<package\
  \ name>/databases/<database filename>.db`\n\n例如，如果一个包名为 `com.example.MyDBApp` 的应用程序创建了一个名为\
  \ `mydatabase.db` 的数据库，则设备上的文件路径如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了进行练习，请在 `adb shell` 中切换目录到 `/data/data` 并创建一个适合某些 SQLite 实验的子目录结构：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建合适的位置后，如下所示启动交互式 SQLite 工具：\n\n```\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\nSQLite version 3.8.10.2 2015-05-20\
  \ 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n\n\n\n在模拟器环境中运行 Android\
  \ 应用时，任何数据库文件都将根据之前讨论过的路径约定在模拟器的文件系统中创建。这样做的好处是，你可以通过 `adb` 连接，导航到数据库文件所在，将其加载到\
  \ `sqlite3` 交互工具中，并对数据进行操作，以识别应用程序代码中可能出现的问题。\n\n同样重要的是，虽然可以通过 `adb shell` 连接到物理\
  \ Android 设备，但默认情况下，壳（shell）并没有获得足够的权限来创建和管理 SQLite 数据库。因此，数据库问题的调试最好使用 AVD（安卓虚拟设备）会话进行。\n\
  \n# 65.9 Android SQLite 类\n\n如前所述，SQLite 是用 C 语言语言编写的，而 Android 应用主要使用 Java 或 Kotlin\
  \ 开发。为了弥补这种“语言差异”，Android SDK 包含了一组类，它们在 SQLite 数据库管理系统之上提供了一个编程层。本章的剩余部分将提供该类别中每个主要类的概述。\n\
  \n## 65.9.1 Cursor\n\n这是一个专门提供用于访问数据库查询结果的类。例如，在数据库上执行的 SQL `SELECT` 操作可能会从数据库返回多行匹配结果。可以使用\
  \ `Cursor` 实例来遍历这些结果，然后可以在应用程序代码内部通过多种方法访问它们。该类的一些关键方法如下：\n\n- `close()` – 释放游标使用的所有资源并关闭它。\n\
  - `getCount()` – 返回结果集中包含行数。\n- `moveToFirst()` – 移动到结果集中的第一行。\n- `moveToLast()`\
  \ – 移动到结果集中的最后一行。\n- `moveToNext()` – 移动到结果集中的下一行。\n- `move()` – 从结果集的当前位置按指定的偏移量移动。\n\
  - `get<type>()` – 返回当前游标位置行中指定列索引处包含的指定 `<type>` 值（变体包括 `getString()`、`getInt()`、`getShort()`、`getFloat()`\
  \ 和 `getDouble()`）。\n\n## 65.9.2 SQLiteDatabase\n\n该类提供了应用程序代码与底层 SQLite 数据库之间的主要接口，包括创建、删除以及对数据库执行基于\
  \ SQL 的操作的能力。该类的一些关键方法如下：\n\n- `insert()` – 向数据库表中插入新的一行。\n- `delete()` – 从数据库表中删除行。\n\
  - `query()` – 执行指定的数据库查询，并通过 `Cursor` 对象返回匹配结果。\n- `execSQL()` – 执行不返回结果数据的单个 SQL\
  \ 语句。\n- `rawQuery()` – 执行 SQL 查询语句并以 `Cursor` 对象的形式返回匹配结果。\n\n## 65.9.3 SQLiteOpenHelper\n\
  \n这是一个旨在更容易创建和更新数据库的辅助类。在寻求数据库访问的应用程序代码中必须对该类进行子类，并在该子类中实现以下回调方法：\n\n- `onCreate()`\
  \ – 在首次创建数据库时调用。此方法将 `SQLiteDatabase` 对象作为参数传递给新创建的数据库。这是在数据库方面初始化数据库（创建表和插入任何初始数据行）的理想位置。\n\
  - `onUpgrade()` – 在应用程序代码包含更新的数据库版本号引用时调用。这通常用于应用程序在设备上更新，且需要同时更新数据库架构以处理额外数据的存储的情况。\n\
  \n除了上述强制性回调方法外，`onOpen()` 方法（在数据库打开时调用）也可以在子类中实现。\n\n子类的构造函数也必须实现以调用父类，并传递应用程序上下文、数据库名称和数据库版本。\n\
  \n`SQLiteOpenHelper` 类的显著方法包括：\n\n- `getWritableDatabase()` – 打开或创建一个可读可写的数据库。以\
  \ `SQLiteDatabase` 对象的形式返回数据库的引用。\n- `getReadableDatabase()` – 创建或打开一个只读数据库。以 `SQLiteDatabase`\
  \ 对象的形式返回数据库的引用。\n- `close()` – 关闭数据库。\n\n## 65.9.4 ContentValues\n\n`ContentValues`\
  \ 是一个便利类，允许声明键/值对，由表列标识符和要存储在每列中的值组成。该类在数据库表中插入或更新条目时特别有用。\n\n# 65.10 Android Room\
  \ 持久化库\n\nAndroid SDK SQLite 类的局限性在于它们需要中等的代码工作，并且没有利用新的架构指南和功能（如 `LiveData` 和生命周期管理）。Android\
  \ Jetpack 架构组件包含了 Room 持久化库来解决这些缺点。该库在 SQLite 数据库系统之上提供了一个高级接口，使得可以使用最少的代码在 Android\
  \ 设备上本地存储数据，同时又符合现代应用程序架构的建议。\n\n接下来的章节将提供使用 SQLite 和 Room 持久化库进行 SQLite 数据库管理的概述和教程。\n\
  \n# 65.11 总结\n\nSQLite 是一个轻量级的嵌入式关系型数据库管理系统，包含在 Android 框架中，为 Android 应用实现组织的持久数据存储提供了机制。与\
  \ Room 持久化库结合时，Android 提供了一种从 Android 应用内部实现数据存储的现代方法。\n\n本章提供了 Android 应用开发背景下的通用数据库以及特别是\
  \ SQLite 的概述。\n\n# 66. Android SQLite 数据库教程\n\n标题为 “Android SQLite 数据库概述` 的章节涵盖了使用\
  \ SQLite 数据库管理系统将关系数据库存储集成到 Android 应用中的基本原理。在本章中，我们将使用 SQLite 数据库创建一个项目处理数据。\n\n\
  ## 66.1 关于数据库示例\n\n示例项目是一个简单的数据输入和检索应用程序，允许用户添加、查询和删除数据库条目。该应用程序的想法是一个包含姓名和电话的简单联系人数据库。\n\
  \n数据库文件名将为 `customerDB.db`，它包含一个名为 `customers` 的表。数据库中的每条记录将包含一个唯一的客户 ID、姓名和客户电话，分别对应列名\
  \ `customername` 和 `customerphone`。客户 ID 列将作为主键，并由数据库管理系统自动分配和递增。\n\n## 66.2 创建\
  \ SQLDemo 项目\n\n启动 Android Studio，从欢迎屏幕上选择 New Project，并在生成的新项目对话框中选择 Empty Views\
  \ Activity 模板。在 Name 字段中输入 `SQLDemo` 并指定 `com.ebookfrenzy.sqldemo` 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 菜单设置为 Java。使用节\
  \ 11.8 将项目迁移到 View Binding 中的步骤，为项目启用视图绑定。\n\n## 66.3 设计用户界面\n\n打开 `activity_main.xml`\
  \ 文件并删除默认的 TextView 组件。向布局中添加两个 Plain Text 字段、三个 Button 和 TextView，并按照图 66-1 所示进行布局：\n\
  \n![](img/sql_demo_layout.jpg)\n\n图 66-1\n\n\n\n\n\n将 `Plain Text` 视图的 `hint` 属性分别改为\
  \ `name` 和 `phone`，并移除默认的 `Name` 文本属性。修改按钮使其显示为 `Add`、`Find` 和 `Delete`，并将 `TextView`\
  \ 文本更改为 `Database Ready`。将所有字符串值提取到资源文件中，并手动或使用 `Infer` 按钮应用布局。\n\n将 `Plain Text`\
  \ 视图和 `TextView` 的 ID 分别更改为 `customerName`、`customerPhone` 和 `statusText`。最后，配置按钮以调用名为\
  \ `addCustomer`、`findCustomer` 和 `deleteCustomer` 的方法。\n\n## 66.4 创建数据模型\n\n完成后，应用程序将包含一个活动（activity）和一个数据库处理器类（class）。数据库处理器将是\
  \ `SQLiteOpenHelper` 的子类，并在底层 SQLite 数据库和活动类之间提供一个抽象层，由活动调用数据库处理器与数据库进行交互（添加、删除和查询数据库条目）。为了以结构化的方式实现这种交互，需要实现第三个类，用于在活动和处理器之间传递时持有数据库条目数据。这实际上非常简单的类，能够持有客户\
  \ ID、名称和电话值，以及用于访问这些值的 getter 和 setter 方法。该类的实例可以在活动和数据库处理器中创建，并根据需要来回。基本上，这个类代表了数据库模型。\n\
  \n在 Project 工具窗口中导航到 `app -> java` 并右键点击包名。从弹出菜单中选择 `New -> Java Class` 选项，并在 `Create\
  \ New Class` 对话框中将类命名为 `Customer`，在按下键盘上的 Enter 键之前将 `Kind` 菜单改为 `Class`。\n\n创建后，`Customer.java`\
  \ 源文件会自动加载到 Android Studio 编辑器。加载后，修改代码以添加相应的构造函数：\n\n```java\npackage com.ebookfrenzy.sqldemo;\n\
  \npublic class Customer {\n\n    private int id;\n    private String customerName;\n\
  \    private String customerPhone;\n\n    public Customer() {\n    }\n\n    public\
  \ Customer(int id, String customerName, String customerPhone) {\n        this.id\
  \ = id;\n        this.customerName = customerName;\n        this.customerPhone =\
  \ customerPhone;\n    }\n\n    public Customer(String customerName, String customerPhone)\
  \ {\n        this.customerName = customerName;\n        this.customerPhone = customerPhone;\n\
  \    }\n\n    public void setID(int id) {\n        this.id = id;\n    }\n\n    public\
  \ int getID() {\n        return this.id;\n    }\n\n    public void setCustomerName(String\
  \ customerName) {\n        this.customerName = customerName;\n    }\n\n    public\
  \ String getCustomerName() {\n        return this.customerName;\n    }\n\n    public\
  \ void setCustomerPhone(String customerPhone) {\n        this.customerPhone = customerPhone;\n\
  \    }\n\n    public String getCustomerPhone() {\n        return this.customerPhone;\n\
  \    }\n}\n```\n\n完成的类包含用于内部存储来自数据库条目的数据列的成员变量。\n\n## 66.5 实现数据处理器\n\n数据处理器将通过子类\
  \ `Android SQLiteOpenHelper` 类来实现，并如“Android SQLite 数据库概述”中所述，添加构造函数、`onCreate()`\
  \ 和 `onUpgrade()` 方法。由于处理器需要代表活动组件执行添加、查询和删除操作，因此也需要类中添加相应的方法。\n\n向项目中添加第二个新类作为处理器，命名为\
  \ `MyDBHandler`。一旦创建了新类，对其进行修改使其如下：\n\n```java\npackage com.ebookfrenzy.sqldemo;\n\
  \nimport android.database.sqlite.SQLiteDatabase;\nimport android.database.sqlite.SQLiteOpenHelper;\n\
  import android.content.Context;\nimport android.content.ContentValues;\nimport android.database.Cursor;\n\
  \npublic class MyDBHandler extends SQLiteOpenHelper {\n\n    public MyDBHandler(Context\
  \ context, String name, CursorFactory factory, int version) {\n        super(context,\
  \ name, version);\n    }\n\n    @Override\n    public void onCreate(SQLiteDatabase\
  \ db) {\n    }\n\n    @Override\n    public void onUpgrade(SQLiteDatabase db, int\
  \ oldVersion, int newVersion) {\n    }\n}\n```\n\n现在源文件已填充了 `onCreate()` 和 `onUpgrade()`\
  \ 方法，下一个任务是按照如下所示声明数据库名称、表名和版本的常量：\n\n```java\nclass MyDBHandler extends SQLiteOpenHelper\
  \ {\n    static final int DATABASE_VERSION = 1;\n    static final String DATABASE_NAME\
  \ = \"customer.db\";\n    static final String TABLE_CUSTOMERS = \"customers\";\n\
  \    static final String COLUMN_ID = \"id\";\n    static final String COLUMN_CUSTOMERNAME\
  \ = \"name\";\n    static final String COLUMN_PHONE = \"phone\";\n}\n```\n\n接下来，需要实现\
  \ `onCreate()` 方法，以便在数据库初始化时创建客户表。这涉及构建一个包含相应列的 SQL 语句并将其传递给 `SQLiteDatabase` 对象的\
  \ `execSQL()` 方法：\n\n```java\n@Override\npublic void onCreate(SQLiteDatabase db)\
  \ {\n    String CREATE_CUSTOMERS = \"CREATE TABLE \" + TABLE_CUSTOMERS + \"(\" +\
  \ COLUMN_ID + \" INTEGER PRIMARY KEY,\" + COLUMN_CUSTOMERNAME + \" TEXT,\" + COLUMN_PHONE\
  \ + \" TEXT)\";\n    db.execSQL(CREATE_CUSTOMERS);\n}\n```\n\n当调用处理器时版本号大于使用的版本号时，会调用\
  \ `onUpgrade()`。在本示例中，我们将删除旧数据库并创建一个新的：\n\n```java\n@Override\npublic void onUpgrade(SQLiteDatabase\
  \ db, int oldVersion, int newVersion) {\n    db.execSQL(\"DROP TABLE IF EXISTS \"\
  \ + TABLE_CUSTOMERS);\n    onCreate(db);\n}\n```\n\n在 `MyDBHandler.java` 处理器类中，剩下的只需实现添加、查询和删除数据库条目的方法。\n\
  \n### 66.6 添加处理器方法\n\n插入数据库记录的方法将命名为 `addCustomer()`，并将接收我们的 `Customer` 数据模型类的实例作为参数。在方法体内部创建一个\
  \ `ContentValues` 对象，并用从 `Customer` 对象中提取出的数据列的键值对进行填充。接下来，通过调用 `getWritableDatabase()`\
  \ 获取数据库引用，然后调用返回的数据库对象的 `insert()` 方法。最后，在执行插入后，需要关闭数据库：\n\n```java\npublic void\
  \ addCustomer(Customer customer) {\n    ContentValues values = new ContentValues();\n\
  \    values.put(COLUMN_CUSTOMERNAME, customer.getCustomerName());\n    values.put(COLUMN_PHONE,\
  \ customer.getCustomerPhone());\n    SQLiteDatabase db = this.getWritableDatabase();\n\
  \    db.insert(TABLE_CUSTOMERS, null, values);\n    db.close();\n}\n```\n\n### 66.7\
  \ 查询处理器方法\n\n查询数据库的方法将命名为 `findCustomer()`，并将接收一个包含要查找客户名称的 `String` 对象作为参数。使用该字符串，将构建一个\
  \ SQL `SELECT` 语句来查找表中所有匹配记录。在本示例中，随后仅返回第一个匹配项，并包含在我们新的 `Customer` 数据模型类实例中：\n\n\
  ```java\npublic Customer findCustomer(String customername) {\n    String query =\
  \ \"SELECT * FROM \" + TABLE_CUSTOMERS + \" WHERE \" + COLUMN_CUSTOMERNAME + = \\\
  \"\" + customername + \"\\\"\";\n    SQLiteDatabase db = this.getWritableDatabase();\n\
  \    // 查询逻辑实现\n}\n```\n\n\n\n\n\n```java\nCursor cursor = db.rawQuery(query, null);\n\
  \nCustomer customer = new Customer();\nif (cursor.moveToFirst()) {\n    cursor.moveToFirst();\n\
  \    customer.setID(Integer.parseInt(cursor.getString(0)));\n    customer.setCustomerName(cursor.getString(1));\n\
  \    customer.setCustomerPhone(cursor.getString(2));\n    cursor.close();\n} else\
  \ {\n    customer = null;\n}\ndb.close();\nreturn customer;\n```\n\n## 66.8 删除处理方法\n\
  \n删除方法将命名为 `deleteCustomer()`，并接受一个 `Customer` 对象作为要删除条目的参数。该方法将使用 SQL `SELECT`\
  \ 语句根据客户名称搜索条目，如果找到，则从表中删除它。删除是否成功将通过一个 `Boolean` 返回值反映：\n\n```java\npublic boolean\
  \ deleteCustomer(String customername) {\n    boolean result = false;\n    String\
  \ query = \"SELECT * FROM \" + TABLE_CUSTOMERS + \" WHERE \" + COLUMN_CUSTOMERNAME\
  \ + \" = \\\"\" + customername + \"\\\"\";\n    SQLiteDatabase db = this.getWritableDatabase();\n\
  \    Cursor cursor = db.rawQuery(query, null);\n    Customer customer = new Customer();\n\
  \    if (cursor.moveToFirst()) {\n        customer.setID(Integer.parseInt(cursor.getString(0)));\n\
  \        db.delete(TABLE_CUSTOMERS, COLUMN_ID + \" = ?\",\n                  new\
  \ String[] { String.valueOf(customer.getID()) });\n        cursor.close();\n   \
  \     result = true;\n    }\n    db.close();\n    return result;\n}\n```\n\n## 66.9\
  \ 实现 Activity 事件方法\n\n在测试应用程序之前的最后一个任务是为界面上的三个按钮编写 `onClick` 事件处理程序。将 java 源文件加载到编辑器并按照如下方式添加\
  \ `onClick` 目标方法：\n\n```java\npackage com.ebookfrenzy.sqldemo;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ MyDBHandler dbHandler;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        EdgeToEdge.enable(this);\n\
