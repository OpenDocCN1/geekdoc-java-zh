  \ `TextView` 底部下方。将文本属性更改为“发送文本”（Send Text），并配置 `onClick` 属性调用名为 `sendText` 的方法。\n\
  \n接下来，添加一个 `Plain Text`（纯文本）对象，使其水平居中并位于 `TextView` 的上方。使用属性窗口移除分配给文本的“Name”字符串，并将\
  \ ID 设置为 `editText1`。布局完成后，点击工具栏上的“推断约束”（Infer constraints）按钮以添加相应的约束：\n\n![](img/as_infer_constraints.jpg)\n\
  \n图 55-1\n\n最后，点击布局编辑器右上角的红色警告按钮，并生成的面板将“发送文本”字符串提取为名为 `send_text` 的资源。布局完成后，用户界面应类似于图\
  \ 55-2 所示：\n\n![](img/as_explicit_intent_send_ui.jpg)\n\n图 55-2\n\n## 55.3 创建第二个活动类\n\
  \n当用户触摸“发送文本”按钮时，将发出一个意图请求启动一个用户可以在其中输入响应的第二个活动。因此，下一步是创建第二个活动。在 Project 工具窗口中，右键点击\
