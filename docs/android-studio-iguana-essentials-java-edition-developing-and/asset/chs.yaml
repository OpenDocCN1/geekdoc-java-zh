  \        WindowInsetsCompat.Type.systemBars());\n            v.setPadding(systemBars.left,\
  \ systemBars.top,\n                         systemBars.right, systemBars.bottom);\n\
  \            return insets;\n        });\n        dbHandler = new MyDBHandler(this,\
  \ null, null, 1);\n    }\n\n    public void addCustomer (View view) {\n        Customer\
  \ customer = new Customer(\n            binding.customerName.getText().toString(),\n\
  \            binding.customerPhone.getText().toString());\n        dbHandler.addCustomer(customer);\n\
  \        binding.customerName.setText(\"\");\n        binding.customerPhone.setText(\"\
  \");\n    }\n\n    public void findCustomer (View view) {\n        Customer customer\
  \ = dbHandler.findCustomer(\n            binding.customerName.getText().toString());\n\
  \        if (customer != null) {\n            binding.customerPhone.setText(String.valueOf(customer.getCustomerPhone()));\n\
  \            binding.statusText.setText(\"Match Found\");\n        } else {\n  \
  \          binding.statusText.setText(\"No Match Found\");\n        }\n    }\n\n\
  \    public void deleteCustomer (View view) {\n        boolean result = dbHandler.deleteCustomer(\n\
  \            binding.customerName.getText().toString());\n        if (result) {\n\
  \            binding.statusText.setText(\"Record Deleted\");\n            binding.customerName.setText(\"\
  \");\n            binding.customerPhone.setText(\"\");\n        } else {\n     \
  \       binding.statusText.setText(\"No Match Found\");\n        }\n    }\n}\n```\n\
  \n## 66.10 测试应用程序\n\n完成代码更改后，在 AVD 会话或物理 Android 设备上编译并运行应用程序。一旦应用程序运行，在用户界面表单中输入客户名称和电话号码，然后点击\
  \ `Add` 按钮。一旦条目被添加，文本框将清空。重复这些步骤向数据库添加第二个客户。接下来，将新添加的客户之一的名称输入客户名称字段，并点击 `Find`\
  \ 按钮。表单应更新所选客户的 ID 和电话号码。点击 `Delete` 按钮删除所选条目。随后通过客户名称进行搜索应指示该条目已不存在。\n\n## 66.11\
  \ 总结\n\n本章逐步讲解了在 Android 应用程序中基于 SQLite 的数据库存储的实际应用。为了进一步开发你的新数据库技能，请考虑扩展示例以包含更新数据库表中现有条目的的能力。\n\
  \n## 67 理解 Android Content Providers\n\n上一章专注于创建一个旨在使用 SQLite 数据库存储数据的示例应用程序。通过这种方式实现时，数据对于应用程序是私有的，因此无法由运行同一设备上的其他应用程序访问。虽然这可能是许多应用程序类型的预期行为，但不可避免地会出现某些情况，即代表应用程序存储的数据可以使其他应用程序受益。一个典型的例子是\
  \ Android 设备上内置 `Contacts` 应用存储的数据。虽然 `Contacts` 应用主要负责管理用户的通讯录详情，但这些数据也提供给任何需要访问的其它应用程序。Android\
  \ 之间的这种数据共享是通过内容 provider 实现。\n\n### 67.1 什么是 Content Provider？\n\nContent provider\
  \ 在不同的 Android 应用程序之间提供结构化数据访问。数据以表的形式（类似于数据库）或文件句柄暴露给应用程序。这本质上涉及实现一种客户端/服务器架构，访问数据的应用程序是客户端，而\
  \ content provider 是服务器，代表客户端执行操作。\n\n成功的 content provider 实现涉及多个元素，每个元素将在本章范围内详细介绍。\n\
  \n### 67.2 Content Provider\n\nContent provider 是通过继承 `android.content.ContentProvider`\
  \ 类创建的。通常，负责管理数据的应用程序将实现 content provider 以与其他应用程序共享该数据。\n\n创建 content provider\
  \ 需要实现方法来代表客户端管理数据。这些方法如下：\n\n#### 67.2.1 `onCreate()`\n\n该方法在 content provider\
  \ 首次创建时调用，用于执行 content provider 需要的任何初始化任务。\n\n#### 67.2.2 `query()`\n\n当客户端请求从\
  \ content provider 获取数据时调用。该方法识别要检索的数据（单行或多行），执行数据提取，并将结果封装在 `Cursor` 对象中返回。\n\n\
  #### 67.2.3 `insert()`\n\n当需要向 provider 数据库插入新行时调用。该方法必须识别数据的存储地，执行插入操作并返回新添加行的完整\
  \ URI。\n\n#### 67.2.4 `update()`\n\n当需要代表客户端更新现有行时调用的方法。该方法使用传递的参数来更新相应的表行，并返回操作结果中更新的行数。\n\
  \n#### 67.2.5 `delete()`\n\n当从表中删除行时调用。该方法删除指定的行并返回被删除的行数计数。\n\n#### 67.2.6 `getType()`\n\
  \n\n\n\n返回内容提供者存储的数据的 MIME 类型。\n\n在内容提供者中实现这些方法时，必须记住，除 `onCreate()` 方法外，这些方法可以从多个进程同时调用，因此必须是线程安全的。\n\
  \n一旦实现了内容提供者，随之产生的问题如何在 Android 系统中标识该提供者。这就是内容 URI（Content URI）发挥作用的地方。\n\n## 67.3\
  \ 内容 URI\n\n一个 Android 设备可能包含多个内容提供者。因此，系统必须提供某种方法来区分不同的提供者。同样，单个内容提供者可能提供对多种形式内容的访问（通常以数据库表的形式存在）。因此，客户端应用程序需要一种方法来指定访问所需的底层数据。这通过使用内容\
  \ URI 实现。\n\n内容 URI 用于标识特定内容提供者中的特定数据。URI 的 Authority（权限）部分用于标识内容提供者，通常采用内容提供者的包名形式存在。例如：\n\
  \n`com.example.mydbapp.myprovider`\n\n通过在 authority 后面附加表名，可以引用提供者数据结构中的特定数据库表。例如，下述\
  \ URI 引用了内容提供者中名为 `products` 的表：\n\n`com.example.mydbapp.myprovider/products`\n\n\
  同样，通过在 URI 后面附加行 ID，可以引用指定表中的特定行。例如，下述 URI 引用 `products` 表中 `ID` 列存储值等于 3 的行：\n\n\
  `com.example.mydbapp.myprovider/products/3`\n\n在内容提供者中实现 `insert`、`query`、`update`\
  \ 和 `delete` 方法时，由这些方法负责识别传入的 URI 是指向表中的特定行，还是引用了多行，并采取相应的行动。由于 URI 可以扩展到多个层级，这可能是一项复杂的任务。然而，使用\
  \ `UriMatcher` 类可以显著简化这一过程，将在下一节中进行概述。\n\n## 67.4 内容解析器 (Content Resolver)\n\n对内容提供者的访问通过\
  \ `ContentResolver` 对象实现。应用程序可以通过应用上下文的 `getContentResolver()` 方法来获取其内容解析器的引用。\n\
  \n内容解析器对象包含一组与内容提供者相对应的方法（`insert`、`query`、`delete` 等）。应用程序只需调用这些方法，并指定要在执行操作的内容内容的\
  \ URI。然后，内容解析器和内容提供者对象将进行通信，代表应用程序执行请求的任务。\n\n## 67.5 <provider> Manifest 元素\n\n\
  为了让内容提供者在 Android 系统中可见，必须在其所属的应用程序的 Android manifest 文件中进行声明。这是通过使用 `<provider>`\
  \ 元素实现的，该元素必须包含以下项：\n\n*   `android:authority` – 内容提供者的完整权限 URI。例如 `com.example.mydbapp.mydbapp.myprovider`。\n\
  *   `android:name` – 实现内容提供者的类名。在大多数情况下，该值将与 authority 相同。\n\n同样，`<provider>` 元素也可以用于定义客户端应用程序必须持有的权限，以获得访问底层数据的资格。如果没有声明任何权限，默认行为是允许所有应用程序访问。\n\
  \n权限可以设置为覆盖整个内容提供者，也可以限制于特定的表和记录。\n\n## 67.6 总结\n\n属于应用程序的数据通常对该应用程序是私有的，其他应用程序无法访问。当数据需要共享时，设置内容提供者是必要的。本章涵盖了组合实现应用程序间数据共享的基本元素，并概述了内容提供者、内容\
  \ URI 和内容解析器的概念。\n\n在下一节中，将扩展之前创建的 `SQLdemo` 项目，以便通过内容提供者提供底层客户数据。\n\n## 68. Android\
  \ 内容提供者教程\n\n如上一节所述，内容提供者提供了一种机制，通过该机制一个 Android 应用程序存储的数据可以被其他应用程序访问。在对内容提供者进行理论概述后，本章将通过扩展“Android\
  \ SQLite 数据库教程”章节中创建的 `SQLDemo` 项目继续介绍内容提供者，以实现基于内容提供者的数据库访问。\n\n## 68.1 复制 SQLDemo\
