  \ Activity 选项。\n\n\n\n\n\n# 55.4 为 SecondActivity 设计用户界面布局\n\n第二个 Activity 用户界面所需的元素包括一个纯文本\
  \ `EditText`、`TextView` 和 `Button` 视图。根据这些要求，将 `activity_second.xml` 布局加载到布局编辑器（Layout\
  \ Editor）工具中并添加这些视图。\n\n在设计过程中，请注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，且\
