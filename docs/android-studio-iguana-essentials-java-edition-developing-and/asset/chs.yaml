  ## 71.9 总结\n\n\n\n\n\nAndroid `TableLayout` 容器视图提供了一种以行和列的配置排列视图组件的方法。虽然 `TableLayout`\
  \ 视图提供了整体容器，但每一行及其包含的单元格都是通过 `TableRow` 视图的实例实现的。在本章中，将在 Android Studio 中使用 `TableLayout`\
  \ 和 `TableRow` 容器设计了一个用户界面。下一章将为该用户界面添加后台功能，以便使用仓库和 `Room` 持久化库实现 SQLite 数据库功能。\n\
  \n# 72. Android Room 数据库和仓库教程\n\n本章将结合“Android Room 持久化库”中获得的知识与上一章中创建的初始项目，以提供一个详细的教程，演示如何使用\
  \ `Room` 持久化库实现基于 SQLite 的数据库存储。遵循 Android 架构指南，该项目将使用视图模型（ViewModel）和仓库（Repository）。本教程将使用“Android\
  \ Room 持久化库”中涵盖的所有元素，包括实体（Entity）、数据访问对象（DAO）、`Room` 数据库以及异步数据库查询。\n\n## 72.1 关于\
  \ RoomDemo 项目\n\n上一章中创建的用户界面布局是创建一个简单的库存应用的第一步，该应用用于存储产品名称和数量。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示当前数据库中存储的所有产品的可滚动列表。当数据库条目被添加或删除时，此产品列表会自动更新。\n\
  \n## 72.2 修改构建配置\n\n启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是在构建配置中添加一些额外的库和插件，包括\
  \ `Room` 持久化库。第一步是在 Gradle 构建配置中添加 `ksp` 插件和额外的库。使用 Project（项目）工具窗口，找到并编辑 `Gradle\
  \ Scripts` -> `libs.versions.toml` 文件，如下所示（请注意现在可能可以使用更新版本的库）：\n\n```toml\n[versions]\n\
  roomRuntime = \"2.6.1\"\nfragment = \"1.6.2\"\n\n[libraries]\nandroidx-room-compiler\
  \ = { module = \"androidx.room:room-compiler\", version.ref = \"roomRuntime\" }\n\
  androidx-room-runtime = { group = \"androidx.room\", name = \"room-runtime\", version.ref\
  \ = \"roomRuntime\" }\nandroidx-fragment = { group = \"androidx.fragment\", name\
  \ = \"fragment\", version.ref = \"fragment\" }\n```\n\n点击 `Sync Now` 链接提交更改。接下来，对模块级\
  \ `build.gradle.kts` 文件进行以下更改（`app` -> `Gradle Scripts` -> `build.gradle.kts` (Module\
  \ `:app`)):\n\n```kotlin\ndependencies {\n    implementation(libs.androidx.room.runtime)\n\
  \    implementation(libs.androidx.fragment)\n    annotationProcessor(libs.androidx.room.compiler)\n\
  }\n```\n\n## 72.3 构建实体\n\n该项目将从创建数据库表模式的实体开始。该实体将包含一个用于产品 ID 的整数、一个存储产品名称的字符串列，以及另一个存储数量的整数值。\n\
  \n`product id` 列将作为主键并自动生成。表 72-1 总结了实体的结构：\n\n| 列 | 数据类型 |\n| :--- | :--- |\n|\
  \ productid | Integer / Primary Key / 自动增长 |\n| productname | String |\n| productquantity\
  \ | Integer |\n\n表 72-1\n\n在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ 项，并选择 `New` -> `Java Class` 菜单选项添加实体类文件。在新对话框中，将类命名为 `Product`，选择列表中的 `Class`\
  \ 项，并按回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改使其如下：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \npublic class Product {\n    private int id;\n    private String name;\n    private\
  \ int quantity;\n\n    public Product(String name, int quantity) {\n        this.name\
  \ = name;\n        this.quantity = quantity;\n    }\n\n    public int getId() {\n\
  \        return this.id;\n    }\n\n    public String getName() {\n        return\
  \ this.name;\n    }\n\n    public int getQuantity() {\n        return this.quantity;\n\
  \    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public void\
  \ setQuantity(int quantity) {\n        this.quantity = quantity;\n    }\n}\n```\n\
  \n现在类中有了数据库的变量以及对应的 getter 和 setter 方法。当然，在该类被注解之前，它不会成为实体。在编辑器中打开类文件时，添加以下内容：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.room.ColumnInfo;\n\
  import androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\n@Entity(tableName\
  \ = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    @ColumnInfo(name = \"productQuantity\"\
  )\n    private int quantity;\n}\n```\n\n## 72.4 创建数据访问对象\n\n定义实体后，下一步是创建 DAO 接口。再次引用\
  \ Project 工具窗口，右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo` 项并选择 `New` ->\
  \ `Java Class`。在新对话框中，在 Name 字段输入 `ProductDao` 并从列表中选择 `Interface`，如图 72-1 所示：\n\
  \n![](img/as_room_demo_java_interface.jpg)\n\n图 72-1\n\n按回键生成新接口，并在 `ProductDao.java`\
  \ 文件加载到编辑器后进行以下更改：\n\n```java\npackage com.frenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\n\
  import androidx.room.Dao;\nimport androidx.room.Insert;\nimport androidx.room.Query;\n\
  import java.util.List;\n\n@Dao\npublic interface ProductDao {\n    @Insert\n   \
  \ void insertProduct(Product product);\n\n    @Query(\"SELECT * FROM products WHERE\
  \ productName = :name\")\n    List<Product> findProduct(String name);\n\n    @Query(\"\
  DELETE FROM products WHERE productName = :name\")\n    void deleteProduct(String\
  \ name);\n\n    @Query(\"SELECT * FROM products\")\n    LiveData<List<Product>>\
  \ getAllProducts();\n}\n```\n\nDAO 实现了从数据库中插入、查找和删除记录的方法。插入方法接收包含要存储数据的 `Product`\
  \ 实体对象，而查找和删除记录的方法接收包含操作产品名称的字符串。`getAllProducts()` 方法返回包含数据库中所有记录的 `LiveData` 对象。此方法将用于保持用户界面布局中的\
  \ `RecyclerView` 产品列表与数据库同步。\n\n## 72.5 添加 Room 数据库\n\n在向项目添加仓库之前的最后一个任务是实现 `Room`\
  \ 数据库实例。向项目添加名为 `ProductRoomDatabase` 的新类，这次选择 `Class` 选项。\n\n文件生成后，按照“Android Room\
  \ 持久化库”章节中概述的步骤对其进行修改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.content.Context;\n\
  \nimport androidx.room.Database;\n```\n\n\n\n\n\n```java\nimport androidx.room.Room;\n\
  import androidx.room.RoomDatabase;\n\n@Database(entities = {Product.class}, version\
  \ = 1)\npublic abstract class ProductRoomDatabase extends RoomDatabase {\n    public\
  \ abstract ProductDao productDao();\n\n    private static ProductRoomDatabase INSTANCE;\n\
  \n    static ProductRoomDatabase getDatabase(final Context context) {\n        if\
  \ (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class) {\n\
  \                INSTANCE =\n                        Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                            ProductRoomDatabase.class,\n      \
  \                                      \"product_database\").build();\n        \
  \    }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n## 72.6 添加 Repository（仓库）\n\
  \n在项目中添加一个名为 `ProductRepository` 的新类，并选择 `Class` 选项。\n\n该仓库类负责代表 `ViewModel` 与 Room\
  \ 数据库进行交互。它必须提供使用 `DAO` 来插入、删除和查询产品记录的方法。除了 `getAllProducts()` DAO 方法（它返回一个 `LiveData`\
  \ 对象）外，这些数据库操作必须在离开主线程的单独线程中执行。\n\n在 `ProductRepository.java` 文件中，添加一个处理程序的代码，将搜索结果返回给仓库线程：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.os.Handler;\nimport\
  \ android.os.Looper;\nimport android.os.Message;\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\nimport androidx.lifecycle.MutableLiveData;\n\
  import java.util.List;\n\npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \n    Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\
  \ public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，每当异步搜索任务完成时，结果就会存储其中（在随后的教程中，`ViewModel`\
  \ 内部观察者将监控此实时数据对象）。\n\n仓库类现在必须提供一些 `ViewModel` 可以调用的方法来启动这些操作。然而，仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 `DAO` 引用。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n```java\nimport android.app.Application;\n\
  \npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，可以按照以下方式将方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.deleteProduct(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendMessage(0);\n    });\n    executor.shutdown();\n}\n```\n\n\
  在插入和删除的情况下，会创建并使用适当的新线程来执行相应的数据库操作。在 `findProduct()` 方法中，会向 `handler` 发送消息，表示有新结果可用。\n\
  \n完成仓库还剩最后一个任务。用户界面中的 `RecyclerView` 必须与数据库中存储的当前产品列表保持同步。`ProductDao` 类包含一个名为 `getAllProducts()`\
  \ 的方法，它使用 SQL 查询选择所有数据库记录，并将它们封装在 `LiveData` 对象中返回。仓库需要在初始化时调用一次此方法，并将结果存储在 `LiveData`\
  \ 对象中，该对象可以被 `ViewModel` 观察，进而被 UI 控制器观察。一旦设置完成，每当数据库发生变化时，UI 控制器都会收到通知，`RecyclerView`\
  \ 就可以更新最新的产品列表。在 `ProductRepository.java` 文件中，添加 `LiveData` 变量并在构造函数调用 `getAllProducts()`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用的方法以获取 `allProducts` 和 `searchResults`\
  \ 实时数据对象的引用：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n   \
  \ return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n## 72.7 添加 ViewModel\n\n`ViewModel` 负责创建仓库实例，并提供\
  \ UI 控制器可以使用的 `LiveData` 对象，以保持用户界面与底层数据库同步。如 `ProductRepository.java` 实现所示，仓库构造需要访问上下文以获取\
  \ `Room Database` 实例。为了在 `ViewModel` 中访问上下文以便传递给仓库，`ViewModel` 需要继承 `AndroidViewModel`\
  \ 而不是 `ViewModel`。\n\n首先在项目窗口中找到 `com.ebookfrenzy.roomdemo` 项，右键点击并选择 `New -> Java\
  \ Class`get。接下来，将新类命名为 `MainViewModel` 并按 `Enter` 键。最后编辑新类文件，将类改为 `AndroidViewModel`\
  \ 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    private final ProductRepository\
  \ repository;\n    private final LiveData<List<Product>> allProducts;\n    private\
  \ final MutableLiveData<List<Product>> searchResults;\n\n    public MainViewModel\
  \ (Application application) {\n        super(application);\n        repository =\
  \ new ProductRepository(application);\n        allProducts = repository.getAllProducts();\n\
  \        searchResults = repository.getSearchResults();\n    }\n}\n```\n\n构造函数创建了仓库实例，然后使用它获取结果和实时数据对象的引用，以便\
  \ UI 控制器观察它们。现在 `ViewModel` 中剩余的任务是实现 UI 控制器响应按钮点击以及设置 `LiveData` 对象观察者时调用的方法：\n\
  \n```java\nMutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n```\n\n\n\n\n\n```java\nLiveData<List<Product>> getAllProducts() {\n    return\
  \ allProducts;\n}\n\npublic void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n## 72.8 创建产品项布局\n\n数据库中的每个产品名称将显示在主用户界面的 `RecyclerView` 列表中这需要一个布局资源文件，其中列表中的每一行都包含一个\
  \ `TextView`。现在可以通过 Project 工具窗口中右键点击 `app` -> `res` -> `layout`，并选择 `New` -> `Layout\
  \ Resource File` 菜单添加此文件。将文件命名为 `product_list_item`，并在点击 `OK` 创建文件并加载到布局编辑器之前，将根元素更改为垂直的\
  \ `LinearLayout`。在布局编辑器处于设计（Design）模式下，从调色板将一个 `TextView` 对象拖到布局中，它将默认出现在布局的顶部：\n\
  \n![](img/as_3.5_roomdemo_item_layout.jpg)\n\n图 72-2\n\n在布局中选中 `TextView` 后，使用 `Attributes`\
  \ 工具窗口将视图的 `ID` 设置为 `product_row`并将 `layout_height` 设置为 `30dp`。在 Component Tree\
  \ 窗口中选择 `LinearLayout` 项，并将 `layout_height` 属性设置为 `wrap_content`。\n\n## 72.9 添加\
  \ RecyclerView 适配器\n\n正如使用 RecyclerView 和 CardView 组件章节详细概述的那样，`RecyclerView` 实例需要一个适配器类来提供要显示的数据。在\
  \ Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo` 并选择 `New` -> `Java\
  \ Class` 菜单添加此类类。在对话框中，将类命名为 `ProductListAdapter` 并在列表中选择 `Class`，然后按下键盘上的 `Return`\
  \ 键。生成的 `ProductListAdapter.java` 类加载到编辑器中，按如下方式实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter\n    extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n    private final int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n \
  \       ViewHolder(View iteview) {\n            super(iteview);\n            item\
  \ = iteview.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n## 72.10\
  \ 准备主 Activity\n\n最后一个修改的组件是 `MainActivity` 类，它需要为 `Button` 视图配置监听器并在 `ViewModel`\
  \ 类中的 live data 对象配置观察者。在添加这些代码之前，必须进行一些准备工作以添加导入和变量。编辑 `MainActivity.java` 文件并修改如下：\n\
  \n```java\nimport androidx.lifecycle.ViewModelProvider;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ MainViewModel viewModel;\n    private ProductListAdapter adapter;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n   \
  \     listenerSetup();\n        observerSetup();\n        recyclerViewSetup();\n\
  \    }\n```\n\n在代码的各个阶段，应用需要清除用户界面中显示的产品信息。为了避免代码重复，添加以下 `clearFields()` 函数：\n\n\
  ```java\nprivate void clearFields() {\n    binding.productID.setText(\"\");\n  \
  \  binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\"\
  );\n}\n```\n\n在应用可以构建和测试之前，需要将上述 `onCreate()` 方法中调用的三个设置方法添加到类中。\n\n### 72.1 添加监听器\n\
  \n主 fragment 的用户界面布局包含三个按钮，每个按钮在用户点击时都需要执行特定的特定任务。编辑 `MainActivity.java` 文件并添加 `listenerSetup()`\
  \ 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\nprivate void listenerSetup()\
  \ {\n    binding.addButton.setOnClickListener(view -> {\n        String name = binding.productName.getText().toString();\n\
  \        String quantity = binding.productQuantity.getText().toString();\n     \
  \   if (!name.isEmpty() && !quantity.isEmpty()) {\n            Product product =\
  \ new Product(name, Integer.parseInt(quantity));\n            viewModel.insertProduct(product);\n\
  \            clearFields();\n        } else {\n            binding.productID.setText(\"\
  Incomplete information\");\n        }\n    });\n\n    binding.findButton.setOnClickListener(view\
  \ ->\n        viewModel.findProduct(binding.productName.getText().toString())\n\
  \    );\n\n    binding.deleteButton.setOnClickListener(view -> {\n        viewModel.deleteProduct(binding.productName.getText().toString());\n\
  \        clearFields();\n    });\n}\n```\n\n`addButton` 监听器执行了一些基础验证，确保用户输入了产品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体对象（注意将字符串转换为整数以匹配实体的数据类型）。在清除字段之前，调用了。\n\n`findButton` 和 `deleteButton`\
  \ 监听器将产品名称传递给 `ViewModel.findProduct()` 或 `deleteProduct()` 方法。\n\n## 72.12 添加 LiveData\
  \ 观察者\n\n用户界面现在需要添加观察者与 `searchResults` 和 `allProducts` live data 保持同步。在 `MainActivity.java`\
  \ 文件中实现 `observerSetup()` 方法：\n\n```java\nimport java.util.Locale;\n\nprivate void\
  \ observerSetup() {\n    viewModel.getAllProducts().observe(this, products ->\n\
  \        adapter.setList(products)\n    );\n    viewModel.searchResults().observe(this,\
  \ products -> {\n        if (!products.isEmpty()) {\n            binding.productID.setText(String.format(Locale.US,\
  \ \"%d\", products.get(0).getId()));\n            binding.productName.setText(products.get(0).getName());\n\
  \            binding.productQuantity.setText(String.format(Locale.US, \"%d\", products.get(0).getQuantity()));\n\
  \        } else {\n            binding.productID.setText(\"No Match\");\n      \
  \  }\n    });\n}\n```\n\n\n\n\n\n“所有产品”观察者会将当前产品列表传递给 `RecyclerAdapter` 的 `setProductList()`\
  \ 方法，该方法将更新显示的的列表。\n\n“搜索结果”观察者会检查数据库是否至少找到了一个匹配的结果，从列表中提取第一个匹配的 `Product` 实体对象，从对象中获取数据，在需要时进行转换，并将其分配给布局中的\
  \ `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品 ID `TextView` 上的消息通知用户。\n\n## 72.13\
  \ 初始化 RecyclerView\n\n添加以下设置方法来初始化和配置 `RecyclerView` 适配器：\n\n```java\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  \nprivate void recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(\n                new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n```\n\n## 72.14 测试 RoomDemo\
  \ 应用\n\n在设备或模拟器上编译并运行该应用，添加一些产品，并确保它们自动出现在 `RecyclerView` 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否相应更新。最后，输入一个现有产品的名称，从数据库中删除它，并确认它已从\
  \ `RecyclerView` 产品列表中移除。\n\n## 72.15 使用数据库检查器\n\n如之前在“Android Room 持久库”中所概述，可以使用\
  \ Database Inspector 工具来检查与运行的应用程序相关的 Room 数据库的内容，并进行细微的数据更改。在用 RoomDemo 应用添加一些数据库记录后，使用\
  \ `View -> Tool Windows -> App Inspection` 菜单选项显示 Database Inspector 工具：\n\n在检查器窗口内部，从下方图\
  \ 72-3 中标记为 A 的菜单中选择运行的应用：\n\n![](img/as_database_inspector.jpg)\n\n图 72-3\n\n在\
  \ `Databases` 面板 (B) 中，双击 `products` 表格以查看当前存储在数据库中的表行。启用 `Live updates`（实时更新）选项\
  \ (C)，然后使用运行的应用向数据库添加更多记录。注意，Database Inspector 会实时更新表数据 (D) 以反映更改。\n\n关闭 `Live\
  \ updates` 使表格不再是只读的，双击表行的 `quantity` 单元格，并在按下键盘 `Enter` 键之前更改值。返回运行的应用并搜索产品，以确认在检查器中对数量所做的更改已保存到数据库表中。\n\
  \n最后，点击表格查询按钮（如下方图 72-4 中的箭头所示）显示新的查询标签页 (A)，确保已选择 `product_database` (B)，并在查询文本字段\
  \ (C) 中输入 SQL 语句并点击 `Run` 按钮 (D)：\n\n![](img/as_database_query.jpg)\n\n图 72-4\n\n\
  列表应更新以反映 SQL 查询 (E) 的结果。\n\n## 72.16 总结\n\n本章演示了如何使用 Room 持久库在 SQLite 数据库中存储数据。完成的项目使用了仓库（repository）将\
  \ `ViewModel` 与所有数据库操作分离。。它演示了实体、`DAO` 和 Room 数据库实例的创建，包括在执行某些数据库操作时对异步任务的使用。\n\n\
  ## 73. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（又称为“云存储”）被广泛用于存储用户文件和数据。驱动这一增长有两个关键因素。因素是，大多数移动设备现在提供了持续的、高速的互联网连接，使得数据传输变得快速且廉价。第二个因素是，相对于传统的计算机系统（如台式机和笔记本电脑），这些移动设备在内部存储资源方面受到限制。例如，今天高规格的\
  \ Android 平板通常带有 256 GB 的存储容量。与具有 1 TB 硬盘的中端笔记本电脑系统相比，对文件进行无缝远程存储是今天许多移动应用程序的关键需求。\n\
  \n为了承认这一事实，Google 在 Android 4.4 SDK 部分中引入了存储访问框架（Storage Access Framework）。本章将提供存储访问框架的高级概述，为下一章中更注重细节的教程做准备，该章节标题为“Android\
  \ 存储访问框架示例。\n\n### 73.1 存储访问框架\n\n从用户的角度来看，存储访问框架提供了一个直观的用户界面，允许用户在 Android 应用内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过使用此浏览界面（也称为选择器，picker），用户可以浏览他们所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 73-1 显示了选择器界面，显示了由文档提供者托管的文件集：\n\n![](img/as3.0_storage_demo_picker.jpg)\n\n图\
  \ 73-1\n\n文档提供者可以从云端服务到与客户端运行在同一台设备上的本地文档提供者不等。编写此时，兼容存储访问框架的著名文档提供者有 Box 和意出意料的\
  \ Google Drive。其他云存储提供者和应用程序开发者很快就会提供符合存储访问框架的服务。\n\n除了云端文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序提供了文件存储选项。\n\
  \n通过一组 Intent，Android 应用程序开发者只需几行代码即可将这些存储功能集成到应用程序中。对于开发者来说，存储访问框架的一个特别吸引人的方面是，用户选择的底层文档提供者对应用程序是透明的。一旦在应用程序中使用框架实现了存储功能，它将可以在不修改代码的情况下与所有文档提供者工作。\n\
  \n### 73.2 使用存储访问框架\n\nAndroid 包含一组旨在将存储访问框架的功能集成到 Android 应用程序中的 Intent。这些 Intent\
  \ 向用户显示存储访问框架选择器界面，并通过调用启动 Intent 的 Activity 的 `onActivityResult()` 方法将交互结果返回给应用程序。\n\
  \n存储访问框架 Intent 可总结如下：\n\n- `ACTION_OPEN_DOCUMENT` – 为用户提供选择器界面，以便从设备上配置的文档提供者中选择文件。选的文件以\
  \ `Uri` 对象的格式返回给应用程序。\n- `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、该提供器的存储位置以及新文件的文件名。一旦选择，文件将由存储访问框架创建，并将文件的\
  \ `Uri` 返回给应用程序进行进一步处理。\n\n### 73.3 过滤选择器文件列表\n\n\n\n\n当启动意图（intent）时，选择器界面中列出的文件可以使用多种选项进行过滤。例如，考虑以下用于配置\
  \ `ACTION_OPEN_DOCUMENT` 意图的代码：\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动上述意图后，将显示选择器界面，允许用户浏览并选择由可用的文档提供者托管的任何文件。一旦用户选择了某个文件，该文件将以 `Uri` 对象的形式提供给应用程序作为引用。随后，应用程序可以使用\
  \ `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某种风险，即并非文档提供者列出的所有文件都能通过这种方式打开。通过使用\
  \ `CATEGORY_OPENABLE` 选项修改意图，可以在选择器中排除此类文件。例如：\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\n```\n\n现在显示意图时，无法使用 `openFileDescriptor()`\
  \ 方法打开的文件将列出，但用户无法选择。\n\n另一种实用的过滤方法允许根据文件类型限制可选择的文件。这涉及到指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供者中选择图像文件的选项。这是通过配置意图对象并指定用户可以选择的文件\
  \ MIME 类型来实现的。例如，以下代码指定了只有图像文件适用于选择器中的选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");        \n```\n\n这可以进一步精化以将选择限制为 JPEG 图像：\n\n```java\n\
  intent.setType(\"image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"\
  audio/*\");\n```\n\n音频应用可能会被进一步限制为仅支持播放基于 MP4 的音频文件：\n\n```java\nintent.setType(\"\
  audio/mp4\");\n```\n\n在工作于存储访问框架（Storage Access Framework）时，可以使用广泛 MIME 类型设置，其中更常见的可以在网上找到列表：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n### 73.4 处理意图结果\n\n由于我们启动的是将返回结果的意图，因此需要使用 `registerForActivityResult()` 方法（在标题为\
  \ Android Explicit Intents – A Worked Example 的章节中介绍）来创建一个启动器并声明一个 lambda 处理返回的数据，例如：\n\
  \n```java\nActivityResultLauncher<Intent> startOpenForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    });\n```\n\n声明后，可以如下配置并启动意图：\n\n```java\nIntent intent\
  \ = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n###\
  \ 73.5 读取文件内容\n\n读取文档提供者托管的文件内容的具体步骤很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与图像或音频文件的步骤不同。\n\
  \n可以通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，将文件分配给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以 `\"r\"` 模式打开的。这表示文件将用于读取。其他选项是\
  \ `\"w\"`（写访问）和 `\"rwt\"`（读写访问）。\n\n读取文本文件的内容需要稍多工作，并使用 `InputStream`。例如，以下代码从文本文件中读取行：\n\
  \n```java\nInputStream inputStream = getContentResolver().openInputStream(uri);\n\
  BufferedReader reader = new BufferedReader(new InputStreamReader(inputStream));\n\
  String readline;\nwhile ((readline = reader.readLine()) != null) {\n    // 对行进行某些操作\n\
  }\ninputStream.close();\n```\n\n### 73.6 写入文件\n\n写入由文档提供者托管的打开文件与读取类似，不同之处在于使用了输出流而不是输入流。例如，以下代码向文件写入文本：\n\
  \n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n    FileOutputStream fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 提取文件描述符，这次请求写入权限。随后使用该文件描述符获取输出流的引用。在关闭文件描述符和输出流之前，将内容（例如某些文本）写入输出流。\n\
  \n### 73.7 删除文件\n\n能否从存储中删除文件取决于文件提供者是否支持删除。假设允许删除，可以在指定的 `Uri` 上执行操作：\n\n```java\n\
  if (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n    // 删除成功\n\
  } else {\n    // 删除失败\n}\n```\n\n### 73.8 获取文件的持久访问权限\n\n当应用程序通过存储访问框架获取文件访问时，该访问将一直直到运行应用程序的\
  \ Android 设备重启。通过“获取” `Uri` 的必要权限可以获得特定文件的持久访问权限。例如，以下代码为 `fileUri` 实例引的文件持久读写权限：\n\
  \n```java\nfinal int takeFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且应用程序保存了 `Uri`，用户在设备重启后应能够继续访问文件，而无需再次从选择器界面选择文件。\n\
  \n如果不再需要持久权限，可以通过内容解析器的 `releasePersistableUriPermission()` 方法来释放它们：\n\n```java\n\
  final int releaseFlags = intent.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n### 73.9 总结\n\n\n\n\n\n思考近年来人们对存储的认知发生了怎样的变化是非常有趣的。“存储”一词曾是大容量内置硬盘的同义词，但现在它同样可能指的是托管在云端并通过互联网连接访问的存储空间。随着资源受限的、内部存储容量极小的“始终在线”移动设备被广泛采纳，这种情况正变得日益普遍。\n\
  \nAndroid 存储访问框架（Storage Access Framework）为用户和应用程序开发者提供了一种简单的机制，可以无缝访问存储在云端的文件。通过一组意图（intent）和一个用于选择文档提供程序和文件的内置用户界面，现在可以以极少的代码将全面的云存储集成到\
  \ Android 应用程序中。\n\n# 74. Android 存储访问框架示例\n\n如前所述，存储访问框架极大地简化了将云存储访问集成到 Android\
  \ 应用程序的过程。该框架由选择器用户界面和一组新意图组成，现在可以轻松地构建对 Google Drive 和 Box 等文档提供程序上存储文件的访问功能。\n\
  \n在上一章介绍了 Android 存储访问框架的基础知识后，本章将通过创建一个示例应用程序，该程序使用存储访问框架来存储和管理文件。\n\n## 74.1 关于存储访问框架示例\n\
  \n在本章创建的 Android 应用程序将采用原始文本编辑器的形式，旨在将文本文件远程创建并存储到云存储服务中。在实践中，该示例可以与任何兼容存储访问框架的云文档存储提供程序配合，但为了本示例的目的，假设使用的是\
  \ Google Drive。\n\n在功能方面，该应用程序将向用户展示一个多行文本视图，可以在其中输入和编辑文本，并有一组按钮允许创建、打开和保存基于存储的文本文件。\n\
  \n## 74.2 创建存储访问框架示例\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Views Activity”空视图活动模板。\n\n在 `Name` 字段中输入 `StorageDemo` 并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将最低 API 级别设置设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为\
  \ `Java`。\n\n按照节 11.8 迁移项目到 View Binding 中的常规步骤为项目添加视图绑定支持。\n\n## 74.3 设计用户界面\n\n\
  用户界面将需要由三个 `Button` 视图和一个 `EditText` 视图组成。在 Project 工具窗口中，导航到位于 `app -> res -> layout`\
  \ 的 `activity_main.xml` 布局文件并双击将其加载到 Layout Editor 工具中。在 Design Design（设计）模式下，选择并删除\
  \ Hello World! `TextView` 对象。\n\n在布局的左上角拖动并放置一个 `Button` 控件，在释放组件到位之前，让左侧和顶部的虚线边距指南出现。放置第二个\
  \ `Button`，使中心和顶部边距指南出现。然后放置第三个 `Button` 控件，使顶部和右侧边距指南出现。\n\n将三个按钮的文本属性分别更改为“New”（新建）、“Open”（打开）和“Save”（保存）。接下来，放置一个文本控件，使其水平居中并位于中心\
  \ `Button` 之下，以便用户界面布局与 图 74-1 所示一致。使用 Layout Editor 工具栏中的“Infer Constraints”（推断约束）按钮添加任何缺失的约束。\n\
  \n选择布局中的文本控件，删除当前的文本属性设置，使字段最初为空白，并将 ID 设置为 `fileText`。接下来，将字符串属性提取为命名为 `string`、`open_string`\
  \ 和 `save_string` 的资源值。\n\n![](img/as_storagedemo_ui.jpg)\n\n图 74-1\n\n使用 Attributes\
  \ 工具窗口，配置 `Button` 控件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile` 和 `saveFile` 的方法。\n\
  \n## 74.4 添加活动启动器\n\n按照名为“Android 显式意图——实例示例”章节概述的步骤，我们需要开始注册活动启动器以处理文件内容的创建、打开和保存。\n\
  \n在 `MainActivity.java` 文件中，如下所示为三个操作中的每一个添加一个启动器：\n\n```\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\nimport android.app.Activity;\n\
  import android.content.Intent;\nimport android.net.Uri;\nimport java.io.IOException;\n\
  \nActivityResultLauncher<Intent> startOpenForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        new ActivityResultCallback<ActivityResult>()\
  \ {\n            @Override\n            public void onActivityResult(ActivityResult\
  \ result) {\n                if (result.getResultCode() == Activity.RESULT_OK) {\n\
  \                    Intent data = result.getData();\n                    if (data\
  \ != null) {\n                        Uri currentUri = data.getData();\n       \
  \                 try {\n                            String content =\n        \
  \                    readFileContent(currentUri);\n                            binding.fileText.setText(content);\n\
  \                        } catch (IOException e) {\n                           \
  \ // Handle error\n                        }\n                    }\n          \
  \      }\n            }\n        });\n\nActivityResultLauncher<Intent> startSaveForResult\
  \ =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        result -> {\n            if (result.getResultCode() == Activity.RESULT_OK)\
  \ {\n                Intent data = result.getData();\n                if (data !=\
  \ null) {\n                    Uri currentUri = data.getData();\n              \
  \      try {\n                        writeFile(currentUri);\n                 \
  \   } catch (IOException e) {\n                        // Handle error\n       \
  \             }\n                }\n            }\n        });\n\nActivityResultLauncher<Intent>\
  \ startCreateForResult =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        });\n```\n\n## 74.5 创建新的存储文件\n\n当选择 New 按钮时，应用程序需要触发一个\
  \ `ACTION_CREATE_DOCUMENT` 意图，并配置为创建一个具有纯文本 MIME 类型的文件。在设计用户界面时，New 按钮被配置为调用名为 `newFile()`\
  \ 的方法。在这个方法内部需要启动适当的意图。\n\n留在 `MainActivity.java` 文件中，如下所示实现此方法：\n\n\n\n\n\n```java\n\
  package com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    \n    public void newFile(View view)\n    {\n        Intent intent = new\
  \ Intent(Intent.ACTION_CREATE_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \        intent.setType(\"text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE,\
  \ \"newfile.txt\");\n        startCreateForResult.launch(intent);\n    }\n}\n```\n\
  \n这段代码创建了一个新的 `ACTION_CREATE_INTENT` `Intent` 对象。随后对该 intent 了配置，使其仅返回可以使用文件描述符打开的文件（通过\
  \ `Intent.CATEGORY_OPENABLE` 类别设置）。\n\n接下来，代码指定了要打开的文件将具有纯文本的 MIME 类型，并提供了一个占位符文件名（用户可以在选择器界面中更改该文件名）。\n\
  \n当执行此方法且 intent 完成了分配的任务时，将调用 `startCreateForResult()` 的 lambda 表达式，并传递新创建文档的 `Uri`。\n\
  \n## 74.6 保存到存储文件\n\n现在应用程序能够创建新的基于存储的文件了，下一步是添加能够将用户输入的任何文本保存到文件的功能。用户界面配置为在用户选择“保存”（Save）按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新 intent，这将导致选择器用户界面出现，用户可以选择可以选择存储文本的文件。\n\
  \n由于我们只处理纯文本文件，因此需要配置 intent，以将用户的选择选项限制为与 `text/plain` MIME 类型匹配的现有文件。在确定了 `saveFile()`\
  \ 方法要执行的操作后，现在可以将其添加到 `MainActivity.java` 类文件中，如下所示：\n\n```java\npublic void saveFile(View\
  \ view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 表达式调用了一个名为 `writeFileContent()` 的方法，传递了要写入文本的文件\
  \ `Uri`。\n\n继续留在 `MainActivity.java` 文件中，现在实现该方法，使其读取如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n\n    private void writeFileContent(Uri\
  \ uri) throws IOException\n    {\n        try{\n            ParcelFileDescriptor\
  \ pfd =\n                this.getContentResolver().\n                    openFileDescriptor(uri,\
  \ \"w\");\n            FileOutputStream fileOutputStream =\n                new\
  \ FileOutputStream(\n                    pfd.getFileDescriptor());\n           \
  \ String textContent =\n                binding.fileText.getText().toString();\n\
  \            fileOutputStream.write(textContent.getBytes());\n            fileOutputStream.close();\n\
  \            pfd.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n该方法首先从用户选择文件的 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此描述符以写模式\
  \ (`ww`) 打开。随后，使用该文件描述符作为创建输出流的依据，以便应用程序能够写入文件。用户输入的文本从编辑对象中提取，并在文件描述符和流关闭之前写入输出流。代码中还添加了处理在文件写入过程中遇到的任何\
  \ `IO` 异常的。\n\n## 74.7 打开并读取存储文件\n\n在编写了创建和保存文本文件的代码后，最后的任务是添加从存储器打开并读取文件的功能。这将涉及编写\
  \ `openFile()` onClick 处理方法并对其进行实现，使其启动 `ACTION_OPEN_DOCUMENT` intent：\n\n```java\n\
  public void openFile(View view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startOpenForResult.launch(intent);\n}\n```\n\n下一个任务是实现由 `startOpenForResult()`\
  \ lambda 表达式调用的 `readFileContent()` 方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private String readFileContent(Uri\
  \ uri) throws IOException {\n        InputStream inputStream =\n            getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n            new BufferedReader(new InputStreamReader(inputStream));\n\
  \        StringBuilder stringBuilder = new StringBuilder();\n        String currentline;\n\
  \        while ((currentline = reader.readLine()) != null) {\n            stringBuilder.append(currentline).append(\"\
  \\n\");\n        }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并将其打开读取。随后打开与 `Uri` 关联的输入流，并将其 `BufferedReader`\
  \ 实例的输入源。文件中的每一行随后被读取并存储在 `StringBuilder` 对象中。一旦读取了所有行，输入流和文件描述符都将被关闭，文件内容作为 `String`\
  \ 对象返回。\n\n## 74.8 测试存储访问应用程序\n\n编码阶段完成后，应用程序已准备好进行测试。编译并运行应用程序，选择“新建”（New）按钮。存储访问框架随后应显示图\
  \ 74-2 所示的下载界面：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n\n图 74-2\n\n点击上方显示的菜单按钮并选择“Drive”选项，然后选择“我的云端硬盘”（My\
  \ Drive），并导航到 Google 云端硬盘存储中用于保存文件的合适位置。在选择器界面底部的文本字段中，在选择“保存”（Save）选项之前，将文件名从“newfile.txt”更改为合适的名称（保留\
  \ .txt 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\n图 74-3\n\n创建新文件后，应用程序应返回主活动，通知面板中可能会出现显示“1\
  \ 个文件已上传”（1 file uploaded）的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  \n图 74-4\n\n\n\n\n\n需要注意的是，如果 Android 设备缺乏活跃的互联网连接，存储访问框架（Storage Access Framework）将在本地缓存存储文件。然而，一旦恢复连接，任何缓存数据将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口登录您的\
  \ Google Drive 账号，导航到保存的文件并点击它查看内容，如果一切正常，该内容应包含应用程序保存的文本。\n\n# 74.9 总结\n\n本章介绍了如何创建一个\
  \ Android Studio 应用程序示例，该程序是一个非常基础的文本编辑器，旨在使用云存储通过 Android 存储访问框架来创建、保存和打开文件。\n\n\
  ## 75. 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\n智能手机和平板的主要用途之一是提供在线内容。视频是一种广泛使用的关键内容形式，尤其是在平板设备上。\n\
  \nAndroid SDK 包含了两个类，它们在开发应用程序时让 Android 设备上的实现视频播放变得极其简单。本章将提供这两个类 `VideoView`\
  \ 和 `MediaController` 的概述，并创建一个视频播放应用程序。\n\n### 75.1 介绍 Android VideoView 类\n\n\
  在 Android 应用程序中显示视频最简单的方法是使用 `VideoView` 类。当此视觉组件被添加到 activity 的布局时，它提供了一个可以播放视频的表面。Android\
  \ 目前支持以下视频格式：\n\n* H.263\n* H.264 AVC\n* H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\
  \n`VideoView` 类有一系列方法可以调用以管理视频播放。一些较常用的方法如下：\n\n* `setVideoPath(String path)` –\
  \ 指定要播放的视频媒体路径（字符串形式）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n* `setVideoUri(Uri uri)` –\
  \ 执行与 `setVideoPath()` 方法相同的任务，但它接受 `Uri` 对象作为参数而不是字符串。\n* `start()` – 启动视频播放。\n\
  * `stopPlayback()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()` – 返回一个布尔值，指示视频是否正在播放。\n\
  * `setOnPreparedListener(MediaPlayer.OnPreparedListener)` – 允许在视频准备好播放时调用回调方法。\n\
  * `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生错误时调用回调方法。\n* `setOnCompletionListener(MediaPlayer.OnCompletionListener)`\
  \ - 允许在视频结束时调用回调方法。\n* `getDuration()` – 返回视频时长。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回\
  \ -1。\n* `getCurrentPosition()` – 返回一个指示当前播放位置的整数值。\n* `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控件。\n\n### 75.2 介绍 Android MediaController\
  \ 类\n\n如果使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过将 `MediaController`\
  \ 类的实例挂载到 `VideoView` 实例来解决。`MediaController` 将会提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后/向前拖动进度）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦挂载并锚定，控件在开始播放时会短暂出现，随后用户可以通过点击实例锚定的视图在任何时间点恢复控件。\n\
  \n该类的一些关键方法如下：\n\n* `setAnchorView(View view)` – 指定控制器将锚定的视图。这指定了控件在屏幕上的位置。\n* `show()`\
  \ – 显示控件。\n* `show(int timeout)` – 控件显示指定的持续时间（毫秒）内。\n* `hide()` – 向用户隐藏控制器。\n*\
  \ `isShowing()` – 返回一个布尔值，指示控件当前对用户是否可见。\n\n### 75.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，该程序使用\
  \ `VideoView` 和 `MediaController` 类来播放 MPEG-4 视频文件。\n\n从欢迎界面选择 New Project（新建项目）选项，在生成的新项目对话框中，在点击\
  \ Next（下一步）按钮之前选择 Empty Views Activity（空视图活动）模板。\n\n在 `Name` 字段中输入 `VideoPlayer`，并指定\
  \ `com.ebookfrenzy.videoplayer` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API\
  \ 级别）设置更改为 `API 33`：Android 13 (Tiramisu)，并将 Language（语言）菜单设置为 Java。使用节 11.8 Migrating\
  \ a Project to View Binding 中的步骤为项目启用视图绑定。\n\n### 75.4 设计 VideoPlayer 布局\n\n主 activity\
  \ 的用户界面将仅由一个 `VideoView` 类的实例组成。使用 Project 工具窗口找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击它，将 Layout Editor（布局编辑器）工具切换到 Design（设计）模式，并删除默认的 `TextView` 组件。\n\n从 Palette\
  \ 面板的 Widgets 类别中，将 `VideoView` 实例拖放到布局中以填充可用画布区域，如图 75-1 所示。在 Attributes 面板中，将\
  \ `layout_width` 和 `layout_height` 属性分别更改为 `match_constraint` 和 `wrap_content`。此外，移除\
  \ `VideoView` 连接到 `ConstraintLayout` 底部的约束。最后，将组件的 ID 改为 `videoView`。\n\n![](img/as_3.5_videoplayer.jpg)\n\
  图 75-1\n\n### 75.5 下载视频文件\n\n`VideoPlayer` 应用程序播放的视频是一个 MPEG-4 格式编码的短动画片段。使用浏览器导航到以下\
  \ URL 以播放视频：\n\n`https://www.ebookfrenzy.com/demo.mp4`\n\n留在浏览器窗口中，右键点击视频，选择保存视频到本地文件，并选择合适的临时位置，文件名为\
  \ `demo.mp4`。\n\n在 Android Studio 中，在 Project 工具窗口找到 `res` 文件夹，右键点击它，选择 `New` ->\
  \ `Directory` 选项，并在名称字段中输入 `raw` 然后按回车键。使用操作系统的文件导航找到上述下载的 `demo.mp4` 文件并复制。返回 Android\
  \ Studio，右键点击新创建的 `raw` 目录并选择粘贴选项将视频复制到项目中。添加后，`raw` 文件夹应如图 75-2 所示出现在 Project 工具窗口中：\n\
  \n![](img/as_video_player_movie_added.jpg)\n图 75-2\n\n### 75.6 配置 VideoView\n\n\
  下一步是为 `VideoView` 配置视频路径并启动播放。这将在主 activity 初始化时执行，因此加载 `MainActivity.java` 文件到编辑器并按照以下列表进行修改：\n\
  \n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.net.Uri;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        configureVideoView();\n    }\n\n    private void configureVideoView() {\n\
  ```\n\n\n\n\n\n```java\nbinding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\
  \n        + getPackageName() + \"/\" + R.raw.demo));\n\nbinding.videoView1.start();\n\
  \n}\n```\n\n这段代码获取布局中 `VideoView` 实例的引用，为其分配一个指向位于 raw 资源目录的电影文件的 `URI` 对象，然后然后开始播放视频。\n\
  \n通过在模拟器或物理 Android 设备上运行该应用程序来测试它。应用程序启动后，在视频播放开始之前，视频内容缓冲可能会有短暂的延迟（参见图 75-3）。\n\
  \n![](img/as_video_player_running.jpg)\n\n图 75-3\n\n这展示了将视频播放集成到 Android 应用程序是多么简单。示例中的所有内容都是通过一个\
  \ `VideoView` 实例和三行代码实现的。\n\n### ## 75.7 为 Video View 添加 MediaController\n\n按照 `VideoPlayer`\
  \ 目前的状况，用户无法控制播放。如之前概述，这可以使用 `MediaController` 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()`\
  \ 方法：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\n.\n.\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private MediaController mediaController;\n.\n.\n    private void\
  \ configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\
  \n                + getPackageName() + \"/\" + R.raw.demo));\n        mediaController\
  \ = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用这些更改启动应用程序时，点击 `VideoView` 画布将导致媒体控件出现在视频播放上层。这些控件应包含一个 `Seekbar`\
  \ 以及快进、倒退和播放/暂停按钮。在控件移出视野后，可以通过再次点击 `VideoView` 画布随时恢复它们。只需额外三行代码，我们的视频播放器应用程序现在就有了媒体控件，如图\
  \ 75-4 所示：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\n图 75-4\n\n### ##\
  \ 75.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，该 activity 将被进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，用于将视频时长作为消息输出到\
  \ Android Studio Logcat 面板中。该监听器还将配置视频播放为持续循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n.\n.\n\nimport android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.demo));\n        MediaController\
  \ mediaController = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(mp\
  \ -> {\n            mp.setLooping(true);\n            Log.i(TAG, \"Duration = \"\
  \ + mp.getDuration());\n        });\n        binding.videoView1.start();\n    }\n\
  }\n```\n\n### ## 75.9 总结\n\nAndroid 为内容交付提供了优秀的平台，特别是视频。如本章概述，Android 提供了两个类，即 `VideoView`\
  \ 和 `MediaController`，它们使得集成变得快速。\n\n### ## 76 画中画\n\n虽然 Android 中的多任务处理——画中画 (`PiP`)\
  \ 在之前的章节中简要提及但未介绍，但 `PiP` 模式允许用户在执行检查电子邮件或处理电子表格等任务时继续观看视频。本章将概述画中画模式。\n\n### ###\
  \ 76.1 特性\n\n正如本章后文解释，`PiP` 行为是通过使用 `PictureInPictureParams` 类定义的，其实例可以使用 `Builder`\
  \ 类创建。例如，图 76-1 显示了视频播放：\n\n![](img/Image2427.jpg)\n\n图 76-1\n\n图 76-2 显示了用户点击后的\
  \ activity 窗口。在这种模式下，窗口包含了自定义操作：\n\n![](img/Image2436.jpg)\n\n图 76-2\n\n### ###\
  \ 76.2 启用画中画\n\n`PiP` 模式目前仅支持运行 API 26：Android 8.0 (Oreo) 或更高版本的设备。实现 `PiP` 模式的第一步是在项目的\
  \ manifest 文件启用它。`PiP` 模式是按 activity 配置的，通过为每个需要 `PiP` 支持的 activity 添加以下行来实现：\n\n\
  ```xml\n<activity android:name=\".MyActivity\"\n    android:supportsPictureInPicture=\"\
  true\"\n    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n`android:supportsPictureInPicture` 条目启用了\
  \ activity 的 `PiP` 功能，而 `android:configChanges` 属性通知 Android activity 可以处理布局配置更改。如果没有此设置，每当\
  \ activity 进入和退出 `PiP` 模式时，activity 都将重新启动，导致视频在切换期间从头重新播放。\n\n### ### 76.3 配置画中画参数\n\
  \n`PiP` 行为是通过使用 `PictureInPictureParams` 类定义的，其实例可以使用 `Builder` 类如下创建：\n\n```java\n\
  PictureInPictureParams params = new PictureInPictureParams.Builder().build();\n\
  ```\n\n\n\n\n上述代码创建了一个具有定义特殊参数的默认 `PictureInPictureParams` 实例。也可以使用以下可选方法调用来定制这些参数：\n\
  \n• `setActions()` – 用于定义当活动项处于 PiP 模式时，在 PiP 窗口内可以执行的操作。操作将在本章稍后的部分详细介绍。\n\n• `setAspectRatio()`\
  \ – 声明 PiP 窗口显示的首选宽高比。此方法接收一个 `Rational` 对象作为参数，该对象包含高度与宽度的比例。\n\n• `setSourceRectHint()`\
  \ – 接收一个 `Rect` 对象作为参数，定义要在 PiP 窗口中显示的活动屏幕区域。\n\n例如，下面的代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。在宽高比的情况下，它是通过使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```\nRational rational\
  \ = new Rational(videoView.getWidth(),\n                               videoView.getHeight());\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder() own  \
  \            .setAspectRatio(rational)\n              .setActions(actions)\n   \
  \           .build();\n```\n\n一旦定义，可以随时使用如下 `setPictureInPictureParams()` 方法设置 PiP\
  \ 参数：\n\n```\nsetPictureInPictureParams(params);\n```\n\n### 76.4 进入画中画模式\n\n通过调用\
  \ `enterPictureInPictureMode()` 方法并传递 `PictureInPictureParams` 对象，可以将活动置于画中画模式：\n\
  \n```\nenterPictureInPictureMode(params);\n```\n\n如果不需要参数，请按照上一节的概述创建一个默认的 `PictureInPictureParams`\
  \ 对象。如果之前已使用 `setPictureInPictureParams()` 方法设置了参数，则这些参数将与在调用 `enterPictureInPictureMode()`\
  \ 方法时指定的参数合并使用。\n\n### 76.5 检测画中画模式的更改\n\n当活动进入 PiP 模式时，隐藏不必要的视图是非常重要的，这样在 PiP 窗口内就只能看到视频播放。当活动重新进入全屏模式时，必须恢复已隐藏的用户界面组件。这些以及其他应用程序特定的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来完成。当该方法添加到活动中时，每次活动在 PiP 和全屏模式之间切换，它都会被调用，并传递一个\
  \ `Boolean` 值，指示活动当前是否处于 PiP 模式：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(\n\
  \             boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // Activity 进入画中画模式\n    } else {\n\
  \        // Activity 进入全屏模式\n    }\n}\n```\n\n### 76.6 添加画中画操作\n\n当用户点击 PiP 窗口时，画中画操作将以图标的形式显示出来。实现\
  \ PiP 操作是一个多步骤的过程，从实现一种让 PiP 窗口通知活动已选择操作的方法开始。通过在活动中设置广播接收器（broadcast receiver），然后在\
  \ PiP 操作中创建一个等待意图（pending intent）来实现，该意图随后配置为广播广播接收器正在监听的意图。当意图触发广播接收器时，意图中存储的数据可以用于识别所执行的操作，并在活动中采取必要的行动。\n\
  \nPiP 操作使用 `RemoteAction` 实例声明，并用图标、标题、描述和 `PendingIntent` 对象进行初始化。一旦创建了一个或多个操作，它们就会添加到\
  \ `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时通过 `setActions()` 方法传递。\n\n下面的代码段演示了\
  \ `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及一个 `PictureInPictureParams`\
  \ 实例，然后该实例被应用于动态的 PiP 设置：\n\n```\nfinal ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  Intent actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal PendingIntent pendingIntent\
  \ =\n    PendingIntent.getBroadcast(MyActivity.this,\n                         \
  \     0, actionIntent,\n                              PendingIntent.FLAG_IMMUTABLE);\n\
  final Icon icon = Icon.createResource(MyActivity.this,\n            R.drawable.action_icon);\n\
  RemoteAction remoteAction = new RemoteAction(icon,\n                           \
  \                 \"My Title\",\n                                            \"\
  My Description\",\n                                            pendingIntent);\n\
  \nactions.add(remoteAction);\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n\
  \              .setAspectRatio(rational)\n              .setActions(actions)\n \
  \             .build();\n\nsetPictureInPictureParams(params);\n```\n\n### 76.7 总结\n\
  \n画中画模式是 Android 8.0 引入的一种多任务功能，旨在允许用户在执行其他应用任务的同时在小窗口中继续播放视频。在使用 PiP 模式之前，必须先在清单文件中为支持\
  \ PiP 的活动启用它。PiP 模式的行为通过 `PictureInPictureParams` 实例进行配置，并通过调用 `enterPictureInPictureMode()`\
  \ 启动。在 PiP 模式下，应只能看到视频播放，需要隐藏任何其他用户界面元素直到选择全屏模式。这些与其他模式相关的任务可以通过重写 `onPictureInPictureModeChanged()`\
  \ 完成。PiP 操作在用户点击 PiP 窗口时以图标的形式叠加在 PiP 窗口上。PiP 窗口使用广播接收器和等待意图来通知活动操作。\n\n# 77 画中画教程\n\
  \n延续前面的章节，本章将对现有的 VideoPlayer 项目进行增强，添加画中画支持，包括检测 PiP 模式更改以及添加关于正在运行视频的操作。\n\n##\
  \ 77.1 在 Manifest 中添加画中画支持\n\n为 Android 应用添加 PiP 支持的第一步是在项目清单文件中启用它。打开 manifests\
  \ -> `AndroidManifest.xml` 文件并修改 activity 元素以启用 PiP：\n\n```xml\n<activity android:name=\"\
  .MainActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\"\
  screenSize|smallestScreenSize|screenLayout|orientation\"\n    android:exported=\"\
  true\">\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n## 77.2 添加画中画按钮\n\n目前的 VideoPlayer 活动布局只包含一个\
  \ `VideoView` 实例。目前的 VideoPlayer 活动布局只包含一个 `VideoView` 实例。现在将向布局中添加一个按钮以切换到 PiP\
  \ 模式。加载 `activity_main.xml` 文件并从调色板拖出一个 `Button` 对象到布局中，位置如图图 77-1](#Picture_in_Picture_Tutorial.xhtml__idTextAnchor1471)\
  \ 所示：\n\n![](img/as_video_pip_ui.jpg)\n\n图 77-1\n\n将按钮上的文字改为“Enter PiP Mode”，并将字符串提取到名为\
  \ `enter_pip_mode` 的资源。在进入下一步之前，将按钮的 ID 更改为 `pipButton` 并配置 `onClick` 属性以调用名为 `enterPipMode`\
  \ 的方法。\n\n## 77.3 进入画中画模式\n\n\n\n\n\n现在必须将 `enterPipMode` onClick 回调方法添加到 `MainActivity.java`\
  \ 类文件中。找到该文件，在代码编辑器中打开它，并如下添加此方法：\n\n```java\nimport android.app.PictureInPictureParams;\n\
  import android.util.Rational;\n\npublic void enterPipMode(View view) {\n    Rational\
  \ rational = new Rational(binding.videoView1.getWidth(),\n            binding.videoView1.getHeight());\n\
  \    PictureInPictureParams params =\n            new PictureInPictureParams.Builder()\n\
  \                    .setAspectRatio(rational)\n                    .build();\n\
  \    binding.pipButton.setVisibility(View.INVISIBLE);\n    binding.videoView1.setMediaController(null);\n\
  \    enterPictureInPictureMode(params);\n}\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含\
  \ `VideoView` 宽度和高度的 `Rational` 对象。接着使用 `PictureInPictureParams` Builder 创建一组画中画参数，并将\
  \ `Rational` 对象作为视频播放的宽高比例传递。。由于按钮在视频处于 PiP 模式时不需要显示，因此将其设置为不可见。视频播放控件也会被隐藏，这样视频视图在\
  \ PiP 模式下将不会被遮挡。\n\n在运行 Android 8 或更高版本的设备或模拟器上编译并运行应用，在点击 PiP 模式按钮之前等待视频开始播放。视频将最小化并出现在\
  \ PiP 窗口中，如图 77-2 所示：\n\n![](img/as_video_pip_window.jpg)\n\n图 77-2\n\n点击 PiP 窗口，然后点击窗口中心出现的全屏模式标记。虽然\
  \ activity 回到了全屏模式，但按钮和媒体播放控件仍保持隐藏状态。\n\n显然，必须向项目中添加一些代码来检测 activity 内部 PiP 模式的变化。\n\
  \n## 77.4 检测画中画模式变化\n\n如上一章所述，PiP 模式的变化是通过重写受影响的 activity 内部的 `onPictureInPictureModeChanged()`\
  \ 方法来检测的。在这种情况下，必须编写该方法来检测 activity 是正在进入还是退出 PiP 模式，并采取适当的操作重新激活 PiP 按钮和播放控件。继续留在\
  \ `MainActivity.java` 文件中，现在添加此方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当调用该方法时，会传入一个 `Boolean` 值，表示 activity 现在是否处于 PiP 模式。上述方法中的代码会检查此值以决定是否显示 PiP 按钮以及重新激活播放控件。\n\
  \n## 77.5 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加操作。该操作的目的是显示一个包含当前播放视频名称的 `Toast` 消息。这需要在\
  \ PiP 窗口和 activity 之间进行一些通信。实现此点的简单方法之一是在 activity 内部实现一个 `broadcast receiver`（广播接收器），并使用\
  \ `pending intent`（挂起意图）从 PiP 窗口向 activity 广播消息。每次 activity 进入 PiP 模式时，必须执行这些步骤，因此必须在\
  \ `onPictureInPictureModeChanged()` 方法中添加代码。现在找到该方法，并开始添加一些代码创建一个 `intent filter`（意图过滤器）并初始化广播接收器：\n\
  \n```java\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter,\
  \ Context.RECEIVER_EXPORTED);\n        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 77.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个\
  \ `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的操作。在本例中，将使用一个名为 `ic_info_24dp.xml` 的图像文件。该文件可以在以下\
  \ URL 提供的源码下载包的 `project_icons` 文件夹中找到：[`www.payloadbooks.com/product/iguanava`](https://www.payloadbooks.com/product/igavaava)\n\
  \n找到此图标文件，将其复制并粘贴到项目窗口中的 `app -> res -> drawables` 文件夹下：\n\n![](img/as_video_pip_icon_added.jpg)\n\
  \n图 77-3\n\n下一步创建一个发送给广播接收器的 `Intent`。然后，需要将此意图封装在 `PendingIntent` 对象中，以便在用户点击 PiP\
  \ 窗口中的操作按钮时触发该意图。\n\n编辑 `MainActivity.java` 文件，如下添加创建 `Intent` 和 `PendingIntent`\
  \ 对象的方法：\n\n```java\nimport android.app.PendingIntent;\nimport static android.app.PendingIntent.FLAG_IMMUTABLE;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ int REQUEST_CODE = 101;\n\n    private void createPipAction() {\n        Intent\
  \ actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n     \
  \   final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n一旦创建了包含其`对象的 `PendingIntent`\
  \ 实例，就需要创建一个包含图标和 `PendingIntent` 对象的 `RemoteAction` 对象。继续留在 `createPipAction()`\
  \ 方法中，添加以下代码：\n\n```java\nimport android.app.RemoteAction;\nimport android.graphics.drawable.Icon;\n\
  import java.util.ArrayList;\n\nprivate void createPipAction() {\n    ArrayList<RemoteAction>\
  \ actions = new ArrayList<>();\n    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\", \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n}\n\
  ```\n\n现在需要创建一个包含该操作的 `PictureInPictureParams` 对象并应用这些参数，以便该操作出现在 PiP 窗口中：\n\n```java\n\
  private void createPipAction() {\n    ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent =\n```\n\n\n\n\n\n```java\nnew Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n\nfinal PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MainActivity.this,\n\
  \        REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon =\n    Icon.createWithResource(MainActivity.this,\n\
  \        R.drawable.ic_info_24dp);\nRemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n    \"Video Info\", pendingIntent);\nactions.add(remoteAction);\nPictureInPictureParams\
  \ params =\n    new PictureInPictureParams.Builder()\n        .setActions(actions)\n\
  \        .build();\nsetPictureInPictureParams(params);\n}\n```\n\n在测试操作前的最后一个任务是在\
  \ activity 进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n@Override\npublic void\
  \ onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \n.\n\n    registerReceiver(receiver, filter);\n    createPipAction();\n} else {\n\
  \    binding.pipButton.setVisibility(View.VISIBLE);\n    binding.videoView1.setMediaController(mediaController);\n\
  \n.\n\n}\n```\n\n## 77.7 测试画中画操作\n\n重新运行应用并将 activity 置于 PiP 模式。点击 PiP 窗口，此时新的操作按钮将会出现，如\
  \ 图 77-4 所示：\n\n![](img/as_video_pip_with_actions.jpg)\n\n图 77-4\n\n点击操作按钮并等待 Toast\
  \ 消息出现，显示视频名称：\n\n![](img/as_video_pip_toast.jpg)\n\n图 77-5\n\n## 77.8 总结\n\n本章演示了如何向\
  \ Android Studio 应用项目添加画中画支持，包括启用和进入 PiP 模式，以及实现 PiP 操作。这包含了使用广播接收器（broadcast receiver）和等待意图（pending\
  \ intents）来实现 PiP 窗口与 activity 之间的通信。\n\n## 78. 使用 MediaPlayer 和 MediaRecorder 进行\
  \ Android 音频录制和播放\n\n本章将概述 `MediaRecorder` 类，并解释如何使用该类来录制音频或视频。还将涵盖使用 `MediaPlayer`\
  \ 类播放音频的内容。在介绍基础知识后，将创建一个示例应用程序来演示这些技术。除了处理音频和视频外，本章还将涉及将文件保存到 SD 卡中。\n\n### 78.1\
  \ 播放音频\n\n在音频播放方面，Android 的大多数实现支持 AAC LC/LTP、HE-AACv1 (AAC+))、HE-AACv2 (enhanced\
  \ AAC+)、AMR-NB、AMR-WB、MP3、MIDI、Ogg Vorbis 和 PCM/WAVE 格式。\n\n可以使用 `MediaPlayer` 或\
  \ `AudioTrack` 类执行音频播放。`AudioTrack` 是更高级的选项，它使用流式音频缓冲区并对音频提供更大的控制。相比之下，`MediaPlayer`\
  \ 类提供了更简单的编程接口来实现音频播放，能够满足大多数音频需求。\n\n`MediaPlayer` 类关联了一系列方法，应用程序可以通过调用这些方法来执行特定任务。该类一些关键方法的子集如下：\n\
  \n- `create()` – 用于创建该类的新实例，并传递要播放音频的 `Uri`。\n- `setDataSource()` – 设置播放音频的源。\n\
  - `prepare()` – 指令播放器准备开始播放。\n- `start()` – 开始播放。\n- `pause()` – 暂停播放。可以通过调用 `resume()`\
  \ 方法恢复播放。\n- `stop()` – 停止播放。\n- `setVolume()` – 接收两个浮点数参数，指定左右通道的播放量。\n- `resume()`\
  \ – 恢复播放。\n- `reset()` – 重置播放器。\n- `release()` – 释放播放器使用的资源。\n\n```java\nMediaPlayer\
  \ mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"your.com/yaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n### 78.2 使用 MediaRecorder\
  \ 录制音频和视频\n\n与音频播放一样，录制可以使用不同的技术完成。其中一种方案是使用 `MediaRecorder` 类，与 `MediaPlayer` 一样，它提供了几个用于录制的方法：\n\
  \n- `setAudioSource()` – 指定要录制的音频源（通常，这将是 `MediaRecorder.AudioSource.MIC`）。\n- `setVideoSource()`\
  \ – 指定要录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()` – 指定录制的音频或视频所存储的格式（例如\
  \ `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()` – 指定录制音频的音频编码器（例如\
  \ `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` – 配置录制的音频或视频存储的文件路径。\n\
  - `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()` – 开始录制过程。\n- `stop()` –\
  \ 停止录制过程。一旦录制器停止，必须完全重新配置并准备后重新启动。\n- `reset()` – 重置录制器。\n- `release()` – 当录制器实例不再需要时调用。\n\
  \n使用该类的典型实现将设置源、输出、编码和输出文件。然后将调用 `prepare()` 和 `start()` 方法。\n\n```java\nMediaRecorder\
  \ mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  ```\n\n要录制音频，应用程序清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n正如“在 Android 中请求权限”(#Permission_Requests.xhtml__idTextAnchor196）章节所示，访问麦克风属于危险权限。因此，为了支持\
  \ Android 6，在应用程序启动时必须专门请求麦克风访问，步骤将在本章后续介绍。\n\n### 78.3 关于示例项目\n\n本章剩余部分将创建一个示例应用程序，演示如何使用\
  \ `MediaPlayer` 和 `MediaRecorder` 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用（以麦克风为例）时，在尝试代码访问之前检查该功能的可用性是重要的。因此，本章创建的应用程序将包含检测设备是否存在麦克风的代码。\n\
  \n\n\n\n完成后，此应用程序将提供一个直观的界面，允许用户录制和播放音频。录制的音频将存储在设备上的音频文件中。尽管如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 78.4 创建 AudioApp 项目\n\n从欢迎屏幕选择“New Project”选项，在弹出的新项目对话框中，在点击“Next”按钮之前，选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击“Finish”按钮之前，将 `Minimum API level` 设置更改为 `API 31`（Android 12.0），并将 `Language`\
  \ 菜单更改为 `Java`。按照节 11.8 将项目迁移到 View Binding 中列出的步骤为项目添加 view binding 支持。\n\n## 78.5\
  \ 设计用户界面\n\n创建新项目后，从 Project 工具窗口选择 `activity_main.xml` 文件，并在 Design 模式下的 Layout\
  \ Editor 工具中，选择“Hello World!”TextView 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的布局对于本示例来说并不从重要，但\
  \ 图 78-1 显示了使用垂直链的建议布局。\n\n配置按钮以显示读取 Play（播放）、Record（录制）和 Stop（停止）的字符串资源，并分别为它们分配视图\
  \ ID `playButton`、`recordButton` 和 `stopButton`。\n\n选择 Play 按钮，并在 Attributes 面中配置\
  \ `onClick` 属性，以便在用户选择时调用名为 `playAudio` 的方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio`\
  \ 的方法。\n\n![](img/as_audio_app_ui.jpg)\n\n图 78-1\n\n## 78.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录制音频会导致\
  \ Android 系统抛出异常。因此，在进行此类尝试之前检查麦克风的存在至关重要。实现此点有多种方法，包括检查设备的物理是否存在。一种更简单且可能在不同的 Android\
  \ 设备上运行的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `PackageManager` 类的实例，然后调用对象的 `hasSystemFeature()`\
  \ 方法。`PackageManager.FEATURE_MICROPHONE` 是此例中关注的功能。\n\n对于此示例，我们将创建一个名为 `hasMicrophone()`\
  \ 的方法，可以调用该方法来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java` 文件并进行修改以添加此方法：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport android.content.pm.PackageManager;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    protected boolean hasMicrophone()\
  \ {\n        PackageManager pmanager = this.getPackageManager();\n        return\
  \ pmanager.hasSystemFeature(\n                PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n## 78.7 初始化 Activity\n\n下一步是修改 activity 以执行几项初始化任务。在 `MainActivity.java`\
  \ 文件中，按如下所示修改代码：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\n\
  import java.io.IOException;\nimport androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\n\
  import android.os.Environment;\nimport android.media.MediaPlayer; \n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private static MediaRecorder mediaRecorder;\n    private static MediaPlayer\
  \ mediaPlayer;\n    private static String audioFilePath;\n    private boolean isRecording\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        audioSetup();\n    }\n\
  \n    private void audioSetup() {\n        if (!hasMicrophone()) {\n           \
  \ binding.stopButton.setEnabled(false);\n            binding.playButton.setEnabled(false);\n\
  \            binding.recordButton.setEnabled(false);\n        } else {\n       \
  \     binding.playButton.setEnabled(false);\n            binding.stopButton.setEnabled(false);\n\
  \        }\n        File audioFile = new File(this.getFilesDir(), \"myapp.33\");\n\
  \        audioFilePath = audioFile.getAbsolutePath();\n    }\n}\n```\n\n添加的代码调用\
  \ `hasMicrophone()` 方法来确定设备是否包含麦克风。如果不包含，则禁用所有按钮；否则，仅禁用 Stop 和 Play 按钮。下一行代码需要一点解释：`File\
  \ audioFile = new File(this.getFilesDir(), \"myapp.33\"); audioFilePath = audioFile.getAbsolutePath();`\
  \ 这段代码在应用的内部存储中创建一个名为 `myapp.33` 的新文件以存储音频。\n\n## 78.8 实现 recordAudio() 方法\n\n当用户触摸\
  \ Record 按钮时将调用 `recordAudio()` 方法。此方法需要开启和关闭相应的按钮，并配置 `MediaRecorder` 实例，包含音频源、输出格式以及要存储音频的文件位置的信息。最后，需要调用\
  \ `MediaRecorder` 对象的 `prepare()` 和 `start()` 方法。这些要求共同导致了 `MainActivity.java` 文件中的以下方法：\n\
  \n```java\npublic void recordAudio (View view) {\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.THREE_GPP);\n        mediaRecorder.setOutputFile(audioFilePath);\n\
  \        mediaRecorder.setAudioEncoder(MediaRecorder.AMR_NB);\n        mediaRecorder.prepare();\n\
  \    } catch (Exception e) {\n        e.printStackTrace();\n    }\n    mediaRecorder.start();\n\
  }\n```\n\n## 78.9 实现 stopAudio() 方法\n\n`stopAudio()` 方法启用 Play 按钮，关闭 Stop 按钮，然后停止并重置\
  \ `MediaRecorder` 实例。实现此点的代码如列表所示，并应添加到 `MainActivity.java` 文件中：\n\n```java\npublic\
  \ void stopAudio (View view) {\n    binding.stopButton.setEnabled(false);\n    binding.playButton.setEnabled(true);\n\
  \    if (isRecording) {\n        binding.recordButton.setEnabled(false);\n     \
  \   mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        binding.recordButton.setEnabled(true);\n \
  \   }\n}\n```\n\n## 78.10 实现 playAudio() 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer`\
  \ 实例，将 SD 卡上的音频文件作为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException {\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 78.11 配置并请求权限\n\n在测试应用程序之前，必须文件中请求适当的权限。具体而言，应用程序需要访问麦克风的权限。在\
  \ Project 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 添加权限标签：\n\n\n\n\n\
  \n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n```xml\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n  \
  \  <application\n...\n</manifest>\n```\n\n上述步骤将足以确保当应用程序安装在运行 Android 6.0 之前的版本的设备上时，用户会启用了麦克风访问权限。在\
  \ Android 中，麦克风访问被归类为“危险权限”，因为它允许应用程序损害用户的隐私。为了让示例应用程序在 Android 6 或更高版本的设备上运行，需要在代码中添加代码以在应用运行时请求权限。\n\
  \n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，作为所请求权限的请求标识码：\n\n```java\nimport\
  \ androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和对应的请求标识码作为参数。在 `MainActivity.java`\
  \ 类文件中，按照如下方式实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n使用本书中[在 Android 中进行运行时权限请求]章节概述的步骤，上述方法在发出请求之前验证指定的权限是否尚未授予，并将标识码作为参数传递。\n\
  \n当请求处理完毕后，将调用活动上的 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中如下实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            binding.recordButton.setEnabled(false);\n            Toast.makeText(this,\n\
  \                    \"Record permission required\",\n                    Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码通过检查请求标识码来识别哪个权限请求已返回，然后再检查相应的权限是否被授予。如果权限被拒绝，将向用户显示消息，指示应用程序将无法运行并禁用录音按钮。\n\
  \n在测试应用程序之前，剩下的工作是在应用程序启动时调用新添加的麦克风访问 `requestPermission()` 方法。在 `MainActivity.java`\
  \ 文件中，将 `audioSetup()` 方法修改如下：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n\
  \    {\n        stopButton.setEnabled(false);\n    }\n}\n```\n\n\n\n\n\n- `UiSettings`\
  \ – `UiSettings` 类用于自定义在地图上显示的控件。例如，使用 `UiSettings`，应用程序可以控制地图上是否显示缩放、当前位置和罗盘控件。该类还可配置地图可以识别哪些触摸屏手势。\n\
  - `My Location Layer` – 启用后，`My Location Layer` 会在地图上显示一个按钮，当用户选择该按钮时，地图将中心位于用户当前的地理位置。如果用户处于静止状态，地图上将用一个蓝色标记代表该位置。如果用户正在移动，则该位置将由一个指示用户行驶方向的箭头（chevron）表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时重点介绍\
  \ API 的关键领域。\n\n## 79.2 创建 Google Maps 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，并在点击\
