  }\n\n@Override\npublic Cursor query(Uri uri, String[] projection, String selection,\n\
  \                    String[] selectionArgs, String sortOrder) {\n    // TODO: Implement\
  \ this to handle query requests from clients.\n    throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n}\n\n@Override\npublic int update(Uri uri, ContentValues\
  \ values, String selection,\n                  String[] selectionArgs) {\n    //\
  \ TODO: Implement this to handle requests to update one or more rows.\n    throw\
  \ new UnsupportedOperationException(\"Not yet implemented\");\n}\n```\n\n通过快速查看文件中的代码可以发现，Android\
  \ Studio 已经为 `ContentProvider` 子类要求实现性的每个方法填充了存根（stubs）。很快就需要开始实现这些方法，但首先需要声明一些与提供者的内容权限（authority）和\
  \ URI 相关的常量。\n\n## 68.4 构建 Authority 和内容 URI\n\n正如上一章所述，所有内容提供者都必须有一个关联的 authority\
  \ 和内容 uri。在实践中，authority 通常是内容提供者类本身的完整包名，在本例中，即它是在上一节创建新的 Content Provider 类时声明的\
  \ `com.ebookfrenzy.sqldemo.provider.MyContentProvider`。\n\n内容 URI 将根据应用需求而异，但对于本示例，它将包含\
  \ authority 并在末尾附加数据库表的名称。在 `MyContentProvider.java` 文件中，进行以下修改：\n\n```java\npackage\
  \ com.ebookfrenzy.sqldemo.provider;\n\n.\n.\n\npublic class MyContentProvider extends\
  \ ContentProvider {\n    private static final String AUTHORITY =\n            \"\
  com.ebookfrenzy.sqldemo.provider.MyContentProvider\";\n    private static final\
  \ String CUSTOMERS_TABLE = \"customers\";\n    public static final Uri CONTENT_URI\
  \ =\n            Uri.parse(\"content://\" + AUTHORITY + \"/\" +\n            CUSTOMERS_TABLE);\n\
  .\n.\n```\n\n上述语句首先创建一个名为 `AUTHORITY` 的新 `String` 对象并将 authority 字符串赋值给它。同样，创建了第二个名为\
  \ `CUSTOMERS_TABLE` 的 `String` 对象并用我们的数据库表名（`customers`）进行初始化。\n\n最后，这两个字符串元素组合，以\
  \ `content://` 为前缀并使用 `Uri` 类的 `parse()` 方法转换为 `Uri` 对象。结果被赋值给名为 `CONTENT_URI` 的变量。\n\
  \n## 68.5 在内容提供者中实现 URI 匹配\n\n当调用内容提供者的方法时，它们将作为参数传递一个 `URI`，表示要对该数据执行操作。此 `URI`\
  \ 的形式可以是对特定表中特定行的引用。此 `URI` 也可能更具通用性，例如仅指定数据库表。每个方法的职责是识别 `Uri` 类型并采取相应的行动。通过使用\
  \ `UriMatcher` 实例可以显著减轻这一任务。一旦创建了 `UriMatcher` 实例，就可以对其进行配置，以便在被要求时，返回一个与其检测到的 `URI`\
  \ 类型相对应的特定整数值。在本教程中，我们将配置 `UriMatcher` 实例，当 `URI` 引用整个 `customers` 表时返回值 `1`，当 `URI`\
  \ 引用 `customers` 表中特定行的 ID 时返回值 `2`。在开始创建 `URIMatcher` 实例之前，我们首先创建两个变量来表示 URI 类型：\n\
  \n```java\npackage com.ebookfrenzy.sqldemo.provider;\n\n.\n.\n\nimport android.database.sqlite.SQLiteDatabase;\n\
  import android.database.sqlite.SQLiteQueryBuilder;\nimport android.content.UriMatcher;\n\
  import android.text.TextUtils;\nimport com.ebookfrenzy.sqldemo.MyDBHandler;\n\n\
  public class MyContentProvider extends ContentProvider {\n    private MyDBHandler\
  \ myDB;\n    private static final String AUTHORITY =\n            \"com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\
  ;\n    private static final String CUSTOMERS_TABLE = \"customers\";\n    public\
  \ static final Uri CONTENT_URI =\n            Uri.parse(\"content://\" + AUTHORITY\
  \ + \"/\" +\n            CUSTOMERS_TABLE);\n\n    private static final int CUSTOMERS\
  \ = 1;\n    private static final int CUSTOMER_ID = 2;\n    private static final\
  \ UriMatcher sURIMatcher = new UriMatcher(UriMatcher.NO_MATCH);\n\n    static {\n\
  \        sURIMatcher.addURI(AUTHORITY, CUSTOMERS_TABLE, CUSTOMERS);\n        sURIMatcher.addURI(AUTHORITY,\
  \ CUSTOMERS_TABLE + \"/{}\", CUSTOMER_ID);\n    }\n```\n\n`UriMatcher` 实例（命名为 `sURIMatcher`）现在准备就绪，在仅引用客户表时返回\
  \ `CUSTOMER` 的值，在 URI 包含特定行的 ID 时返回 `CUSTOMER_ID`。\n\n## 68.6 实现内容提供者的 `onCreate()`\
  \ 方法\n\n当内容提供者类被创建并初始化时，将调用该类的 `onCreate()` 方法。在该方法内部，必须执行该类的任何初始化任务。对于本示例，需要执行的是创建一个\
  \ `MyDBHandler` 类的实例。一旦创建了该实例，它将需要被类的其他方法访问，因此还需要对数据库处理程序进行声明，从而在 `MyContentProvider.java`\
  \ 中产生以下代码：\n\n```java\n@Override\npublic boolean onCreate() {\n    myDB = new MyDBHandler(getContext(),\
  \ null, null);\n    return false;\n}\n```\n\n## 68.7 实现内容提供者的 `insert()` 方法\n\n\
  当客户端应用程序或活动请求将数据插入底层数据库时，内容提供者类的 `insert()` 方法将被调用。然而，此时项目中的 `MyContentProvider.kt`\
  \ 文件中只有一个存根方法，其内容如下：\n\n```kotlin\npublic Uri insert(Uri uri, ContentValues values)\
  \ {\n    TODO(\"Implement this to handle requests to insert a new row.\")\n}\n```\n\
  \n作为方法的参数的是指定插入位置 `URI` 和包含要插入数据的 `ContentValues` 对象。\n\n此方法现在需要修改以执行以下任务：\n\n-\
  \ 使用 `sUriMatcher` 对象识别 URI 类型。\n- 如果 URI 无效则抛出异常。\n- 获取底层 SQLite 数据库的可写实例引用。\n\
  - 执行 SQL 插入操作将数据插入数据库表。\n- 通知相应的内容解析器数据库已更改。\n- 返回新添加表行的 `URI`。\n\n将这些需求整合在一起，得到了修改后的\
  \ `insert()` 方法，如下：\n\n```java\n@Override\npublic Uri insert(Uri uri, ContentValues\
  \ values) {\n    int uriType = sURIMatcher.match(uri);\n    SQLiteDatabase sqlDB\
  \ = myDB.getWritableDatabase();\n    long id = 0;\n    switch (uriType) {\n    \
  \    case CUSTOMERS:\n            id = sqlDB.insert(MyDBHandler.TABLE_CUSTOMERS,\n\
  ```\n\n\n\n\n\n```java\nnull, values);\n\n        break;\n\n    default:\n     \
  \   throw new IllegalArgumentException(\"Unknown URI: \"\n                + uri);\n\
  \    }\n    getContext().getContentResolver().notifyChange(uri, null);\n    return\
  \ Uri.parse(CUSTOMERS_TABLE + \"/\" + id);\n}\n```\n\n## 68.8 实现 Content Provider\
  \ 的 query() 方法\n\n当调用内容提供者以返回数据时，提供者类中的 `query()` 方法会被调用。在调用时，该方法会接收以下部分或全部参数：\n\
  \n- `URI` – 指定执行查询的数据源的 `URI`。它可以是一个包含多个结果的通用查询，也可以是针对单个表行 ID 的特定查询。\n- `Projection`（投影）——数据库表中的行可以包含多列数据。在本应用程序中，例如，这些对应于\
  \ ID、客户名称和电话号码。`projection` 参数只是一个 `String` 数组，包含结果数据集中要返回的每列的名称。\n- `Selection`（选择）——作为查询一部分要执行的选择中的“where”元素。此参数控制从指定的数据库中选择哪些行。例如，如果查询要求选择名为“John\
  \ Andrews”的客户，那么传递给 `query()` 方法的选择字符串将是 `customername = “John Andrews”`。\n- `Selection\
  \ Args`（选择参数）——需要传递给 SQL 查询操作以执行选择的额外参数。\n- `Sort Order`（排序顺序）——所选行的排序顺序。\n\n在调用时，`query()`\
  \ 方法需要执行以下操作：\n\n- 使用 `sUriMatcher` 识别 `Uri` 类型。\n- 如果 `URI` 无效，则抛出异常。\n- 根据传递方法的标准构建\
  \ SQL 查询。为了方便，可以使用 `SQLiteQueryBuilder` 类构建查询。\n- 在数据库上执行查询操作。\n- 通知内容解析器（content\
  \ resolver）该操作。\n- 返回一个包含查询结果的 `Cursor` 对象。\n\n考虑到这些要求，`MyContentProvider.kt` 文件中\
  \ `query()` 方法的代码现在应该如如下列表所示：\n\n```java\n@Override\npublic Cursor query(Uri uri,\
  \ String[] projection, String selection,\n                    String[] selectionArgs,\
  \ String sortOrder) {\n    SQLiteQueryBuilder queryBuilder = new SQLiteQueryBuilder();\n\
  \    queryBuilder.setTables(MyDBHandler.TABLE_CUSTOMERS);\n    int uriType = sURIMatcher.match(uri);\n\
  \    switch (uriType) {\n        case CUSTOMER_ID:\n            queryBuilder.appendWhere(MyDBHandler.COLUMN_ID\
  \ + \"=\"\n                    + uri.getLastPathSegment());\n            break;\n\
  \        case CUSTOMERS:\n            break;\n        default:\n            throw\
  \ new IllegalArgumentException(\"Unknown URI\");\n    }\n    Cursor cursor = queryBuilder.query(myDB.getReadableDatabase(),\n\
  \            projection, selection, selectionArgs, null, null,\n            sortOrder);\n\
  \    cursor.setNotificationUri(getContext().getContentResolver(),\n            uri);\n\
  \    return cursor;\n}\n```\n\n## 68.9 实现 Content Provider 的 update() 方法\n\n当请求对现有数据库表行进行更改时，内容提供者的\
  \ `update()` 方法会被调用。该方法接收一个带有 `ContentValues` 对象形式的新值的 `URI`，以及常用的选择参数字符串。\n\n在调用时，`update()`\
  \ 方法通常会执行以下步骤：\n\n- 使用 `sUriMatcher` 识别 `URI` 类型。\n- 如果 `URI` 无效，则抛出异常。\n- 获取底层\
  \ `SQLite` 数据库的可写实例的引用。\n- 根据选择标准和 `URI` 类型在数据库上执行适当的更新操作。\n- 通知内容解析器数据库发生了更改。\n\
  - 返回由于更新操作而更改的行数。\n\n通用的 `update()` 方法（以及我们将在项目中使用的方法）内容如下：\n\n```java\n@Override\n\
  public int update(Uri uri, ContentValues values, String selection, String[] selectionArgs)\
  \ {\n    int uriType = sURIMatcher.match(uri);\n    SQLiteDatabase sqlDB = myDB.getWritableDatabase();\n\
  \    int rowsUpdated = 0;\n    switch (uriType) {\n        case CUSTOMERS:\n   \
  \         rowsUpdated = sqlDB.update(MyDBHandler.TABLE_CUSTOMERS, values, selection,\
  \ selectionArgs);\n            break;\n        case CUSTOMER_ID:\n            String\
  \ id = uri.getLastPathSegment();\n            if (TextUtils.isEmpty(selection))\
  \ {\n                rowsUpdated = sqlDB.update(MyDBHandler.TABLE_CUSTOMERS, values,\
  \ MyDBHandler.COLUMN_ID + \"=\" + id, null);\n            } else {\n           \
  \     rowsUpdated = sqlDB.update(MyDBHandler.TABLE_CUSTOMERS, values, MyDBHandler.COLUMN_ID\
  \ + \"=\" + id + \" and \" + selection, selectionArgs);\n            }\n       \
  \     break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return rowsUpdated;\n}\n```\n\n## 68.10 实现 Content Provider 的 delete()\
  \ 方法\n\n与其他许多提供者方法一样，`delete()` 方法接收一个 `URI`、一个选择字符串和一组可选的选择参数。典型的 `delete()` 方法在调用时还会执行以下（现在已非常熟悉的）任务：\n\
  \n- 使用 `sUriMatcher` 识别 `URI` 类型。\n- 如果 `URI` 无效，则抛出异常。\n- 获取底层 `SQLite` 数据库的可写实例的引用。\n\
  - 根据选择标准和 `Uri` 类型在数据库上执行适当的删除操作。\n- 通知内容解析器数据库发生了更改。\n- 返回由于删除操作而更改的行数。\n\n典型的\
  \ `delete()` 方法在许多方面与 `update()` 方法相似，可以实现如下：\n\n```java\n@Override\npublic int\
  \ delete(Uri uri, String selection, String[] selectionArgs) {\n    int uriType =\
  \ sURIMatcher.match(uri);\n    SQLiteDatabase sqlDB = myDB.getWritableDatabase();\n\
  \    int rowsDeleted = 0;\n    switch (uriType) {\n        case CUSTOMERS:\n   \
  \         rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS, selection, selectionArgs);\n\
  \            break;\n        case CUSTOMER_ID:\n            String id = uri.getLastPathSegment();\n\
  \            if (TextUtils.isEmpty(selection)) {\n                rowsDeleted =\
  \ sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS, MyDBHandler.COLUMN_ID + \"=\" + id,\
  \ null);\n            } else {\n                rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS,\
  \ MyDBHandler.COLUMN_ID + \"=\" + id + \" and \" + selection, selectionArgs);\n\
  \            }\n            break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return rowsDeleted;\n}\n```\n\n\n\n\n除非在所属应用的清单文件中声明了内容提供者（content\
  \ provider），否则内容解析器（content resolver）无法定位并访问它。如所述，内容提供者使用 `<provider>` 标签声明，清单条目必须正确引用内容提供者的权限（authority）和内容\
  \ URI。\n\n因此，在 Project 工具窗口中找到 `manifests` -> `AndroidManifest.xml` 文件，并双击将其加载到编辑面板中。在编辑面板中，确保在向项目添加\
  \ `MyContentProvider` 类时，Android Studio 已经添加了内容提供者的声明：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <application\n    \
  \    android:allowBackup=\"true\"\n        android:dataExtractionRules=\"@xml/data_extraction_rules\"\
  \n        android:fullBackupContent=\"@xml/backup_rules\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"\
  @mipmap/ic_launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"\
  @style/Theme.SQLDemo\"\n        tools:targetApi=\"31\">\n        <provider\n   \
  \         android:name=\".provider.MyContentProvider\"\n            android:authorities=\"\
  com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\"></provider>\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n在测试应用程序之前，剩下的工作就是修改数据库处理器类，以使用内容提供者而不是直接访问数据库。\n\n## 68.12 修改数据库处理器\n\n当最初创建此用程序时，它的设计目标是使用数据库处理器直接访问底层数据库。现在已经实现了内容提供者，因此需要修改数据库处理器，通过内容解析器使用内容提供者执行所有数据库操作。\n\
  \n第一步是修改 `MyDBHandler.kt` 类，使其获取 `ContentResolver` 实例的引用。这可以在类的构造方法中实现：\n\n```java\n\
  package com.ebookfrenzy.sqldemo;\n\nimport android.content.ContentResolver;\nimport\
  \ com.ebookfrenzy.sqldemo.provider.MyContentProvider;\n\npublic class MyDBHandler\
  \ extends SQLiteOpenHelper {\n    private ContentResolver myCR;\n    public MyDBHandler(Context\
  \ context, String name,\n                      SQLiteDatabase.CursorFactory factory,\
  \ int version) {\n        super(context, DATABASE_NAME, factory, DATABASE_VERSION);\n\
  \        myCR = context.getContentResolver();\n    }\n}\n```\n\n接下来，需要重写 `addCustomer()`、`findCustomer()`\
  \ 和 `removeCustomer()` 方法，以使用内容解析器和内容提供者进行数据管理：\n\n```java\npublic void addCustomer(Customer\
  \ customer) {\n    ContentValues values = new ContentValues();\n    values.put(COLUMN_CUSTOMERNAME,\
  \ customer.getCustomerName());\n    values.put(COLUMN_CUSTOMERPHONE, customer.getCustomerPhone());\n\
  \    myCR.insert(MyContentProvider.CONTENT_URI, values);\n}\n\npublic Customer findCustomer(String\
  \ customername) {\n    String[] projection = {COLUMN_ID, COLUMN_CUSTOMERNAME, COLUMN_CUSTOMERPHONE\
  \ };\n    String selection = \"customername = \\\"\" + customername + \"\\\"\";\n\
  \    Cursor cursor = myCR.query(MyContentProvider.CONTENT_URI,\n        projection,\
  \ selection, null, null);\n    Customer customer = new Customer();\n    if (cursor.moveToFirst())\
  \ {\n        customer.ID(Integer.parseInt(cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_ID)))));\n\
  \        customer.setName(cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_CUSTOMERNAME))));\n\
  \        customer.setPhone(cursor.getString(cursor.getColumnIndexOrThrow(COLUMN_CUSTOMERPHONE))));\n\
  \    }\n    cursor.close();\n    return customer;\n}\n\npublic boolean deleteCustomer(String\
  \ customername) {\n    boolean result = false;\n    String selection = \"customername\
  \ = \\\"\" + customername + \"\\\"\";\n    int rowsDeleted = myCR.delete(MyContentProvider.CONTENT_URI,\
  \ selection, null);\n    if (rowsDeleted > 0) {\n        result = true;\n    }\n\
  \    return result;\n}\n```\n\n当数据库处理器更新为使用内容提供者后，应用程序现在就可以进行测试了。编译并运行应用程序，并执行添加、查找和删除操作。在操作和功能方面，应用程序的行为应该与直接访问数据库时完全一致，不同的是它现在使用了内容提供者。正如我们将在下一章中看到的，由于现在已经实现了内容提供者并在清单文件中进行了声明，任何其他应用程序都可能访问它。\n\
  \n## 68.13 总结\n\n本章的目标是提供实现内容提供者所需步骤的更详细概述，重点关注查询、插入和删除方法的结构和实现。本文还涵盖了使用内容解析器访问数据的实际用法，并修改了数据库项目以同时使用这两者。\n\
  \n## 69. 内容提供者客户端教程\n\n在专门介绍内容提供者（Content Providers）的最后一个章节中，我们将构建一个访问我们内容提供者数据的应用程序。\n\
  \n### 69.1 创建 SQLDemoClient\n\n启动 Android Studio，从欢迎屏幕选择 New Project（新建项目），并在弹出的新项目对话框中选择\
  \ Empty Activity 模板。在 Name（名称）字段中输入 SQLDemoClient，并在 package name（包名）中指定 `com.ebookfrenzy.sqldemoclient`。在点击\
  \ Finish 按钮之前，将 Minimum API 设置为 API 26: Android 8.0 (Oreo)，并将语言设置为 Java。参考第 11.8\
  \ 节迁移项目到 View Binding 的步骤为项目启用 View Binding。\n\n### 69.2 设计界面\n\n打开 `activity_main.xml`\
  \ 文件并删除默认的 TextView。在布局中添加按钮和一个 TextView，将按钮文本更改为“Reload”，并调整视图位置如图 69-1 所示：\n\n\
  OEBPS/image/as_sql_demo_client_ui.jpg\n\n图 69-1\n\n使用 Infer constraints（推断约束）按钮配置布局，将\
  \ TextView 的 textAppearance 属性设置为 Display1，并将按钮的 onClick 属性设置为名为 `reload()` 方法。\n\
  \n### 69.3 访问内容提供者\n\n访问内容提供者的代码将包含在 `reload()` 方法中。第一步是通过调用 `ContentResolver` 实例的\
  \ `query()` 方法获取 `Cursor` 对象。调用 `query()` 时，我们需要提供由 SQLDemo 内容提供者管理的 customers 表的内容\
  \ URI，其格式如下：\n\n`content://com.ebookfrenzy.sqldemo.provider.MyContentProvider/customers`\n\
  \n一旦获取了 Cursor 对象的引用，我们就可以遍历数据库记录并使用我们的 TextView 组件显示数据。编辑 `MainActivity.java` 文件并添加\
  \ `reload()` 方法如下：\n\n\n\n\n\n```java\nimport android.database.Cursor;\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    public void reload(View\
  \ view) {\n        Cursor cursor = getContentResolver().query(\n               \
  \ Uri.parse(\"content://com.ebookfrenzy.sqldemo.provider.MyContentProvider/customers\"\
  ),\n                null, null, null, null);\n        if (cursor != null) {\n  \
  \          if (cursor.moveToFirst()) {\n                StringBuilder stringBldr\
  \ = new StringBuilder();\n                while (!cursor.isAfterLast()) {\n    \
  \                int nameindex = cursor.getColumnIndex(\"customername\");\n    \
  \                int phoneindex = cursor.getColumnIndex(\"customerphone\");\n  \
  \                  if ((nameindex != -1) && (phoneindex != -1)) {\n            \
  \            String string = cursor.getString(nameindex) + \"\\n\" +\n         \
  \                       cursor.getString(phoneindex);\n                        stringBldr.append(string).append(\"\
  \\n\\n\");\n                        binding.textView.setText(stringBldr);\n    \
  \                }\n                    cursor.moveToNext();\n                }\n\
  \            }\n            cursor.close();\n        }\n    }\n}\n```\n\n## 69.4\
  \ 添加查询权限\n\n在我们测试应用之前，最后一个任务是请求查询内容提供者（content provider）的权限。要请求权限，请编辑 `manifest`\
  \ -> `AndroidManifest.xml` 文件并进行如下修改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\">\n    <queries>\n       \
  \ <provider android:authorities=\"com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\
  \ />\n    </queries>\n```\n\n## 69.5 测试项目\n\n在测试 SQLDemo 应用的设备或模拟器上构建并运行该应用，然后点击刷新（Reload）按钮。应用应该查询\
  \ `customers` 数据库中的记录并显示在 `TextView` 上：\n\n![](img/as_sql_demo_client_running.jpg)\n\
  \n图 69-2\n\n## 69.6 总结\n\n在本章中，我们创建了一个简单的应用，用于演示如何从客户端应用访问存储在内容提供者中的数据。这涉及到将提供者的内容\
  \ URI 传递给内容解析实例的 `query()` 方法。\n\n## 70. Android 持久化库\n\n配合 Android 组件，Room 持久化库旨在使数据库存储变得更加简单。在之前的章节中介绍了基础知识后，现在是时候探索基于\
  \ Room 的架构了。\n\n### 70.1 重新审现代应用\n\n名为“现代应用架构”的章节引入了架构的概念。图 70-1 阐了这些元素如何交互以提供存储：\n\
  \n![](img/architecture.jpg)\n\n图 70-1\n\n### 70.2 Room 的关键元素\n\n在稍后详细介绍之前，值得总结一下其中涉及的关键元素：\n\
  \n#### 70.2.1 仓库 (Repository)\n如之前所述，仓库模块处理数据源。\n\n#### 70.2.2 数据库 (Database)\n\n\
  `room database` 提供指向 SQLite 数据库的接口。\n\n#### 70.2.3 数据对象 (DAO)\n\n`DAO` 包含了仓库所需的\
  \ SQL 语句。\n\n#### 70.2.4 实体 (Entities)\n\n`entity` 是一个定义表模式的类，包括表名、列和主键。\n\n####\
  \ 70.2.5 SQLite 数据库\n\n`SQLite database` 负责存储数据。图 70-2 中的架构展示了交互过程：\n\n![](img/room_diagram.jpg)\n\
  \n图 70-2\n\n### 70.3 理解实体\n\n每个数据库表都将关联一个 `entity class`。该类定义了表的模式，并以标准 Java 类的形式呈现，中间穿了一些\
  \ Room 注解。\n\n```java\npublic class Customer {\n    private int id;\n    private\
  \ String name;\n    private string address;\n\n    public Customer(String name,\
  \ String address) {\n        this.id = id;\n        this.name = name;\n        this.address\
  \ = address;\n    }\n\n    public int getId() {\n        return this.id;\n    }\n\
  }\n```\n\n\n\n\n```java\npublic String getName() {\n    return this.name;\n}\n\n\
  public int getAddress() {\n    return this.address;\n}\n\npublic void setId(int\
  \ id) {\n    this.id = id;\n}\n\npublic void setName(String name) {\n    this.name\
  \ = name;\n}\n\npublic void setAddress(int quantity) {\n    this.address = address;\n\
  }\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干表示数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚未成为实体（entity）。要将该类变为实体并使其可以在\
  \ SQL 语句中使用，需要按照所示添加一些 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\
  public class Customer {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n  \
  \  @ColumnInfo(name = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    private String name;\n\n    private String address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public String getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(@NonNull int id) {\n        this.id\
  \ = id;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了名为“customers”的表名。该名称是在 DAO SQL 语句中引用该表时使用的：\n\
  \n`@Entity(tableName = \"customers\")`\n\n每个数据库表都需要一列作为主键。在这种情况下，customer id 被声明为主键。此外，还添加了注解来分配一个在\
  \ SQL 查询中引用的列名，并指示该字段不能用于存储空值。最后，`id` 值被配置为自动生成。这意味着系统会自动为新记录分配 `id`，以避免键冲突：\n\n\
  ```java\n@PrimaryKey(autoGenerate = true)\n@NonNull\n@ColumnInfo(name = \"customerId\"\
  )\nprivate int id;\n```\n\ncustomer name 字段也分配了一个列名。但注意，`address` 字段没有分配列名。这意味着\
  \ `address` 数据仍存储在数据库中，但不需要在 SQL 语句中引用。如果实体中的字段不需要存储在数据库中，请使用 `@Ignore` 注解：\n\n\
  ```java\n@Ignore\nprivate String myString;\n```\n\n最后，对 `id` 变量的 setter 方法进行了修改，以防止分配空值：\n\
  \n```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n实体类中也可以包含注解，以使用称为外键（foreign\
  \ keys）的关系型数据库概念与其他实体建立关系。外键允许一个表引用另一个表的主键。例如，可以在名为 `Purchase` 的实体与我们现有的 `Customer`\
  \ 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys = {@ForeignKey(entity = Customer.class,\n\
  \        parentColumns = \"customerId\",\n        childColumns = \"buyerId\",\n\
  \        onDelete = ForeignKey.CASCADE,\n        onUpdate = ForeignKey.CASCADE)})\n\
  public class Purchase {\n    @PrimaryKey(autoGenerate = true)\n    private int id;\n\
  \n    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n### 70.4\
  \ 数据访问对象 (DAO)\n\n数据访问对象（DAO）允许访问存储在 SQLite 中的数据。第一步是创建一个接口并使用 `@Dao` 注解声明它：\n\n\
  ```java\n@Dao\npublic interface CustomerDao {\n}\n```\n\n接下来，向 `CustomerDao` 中添加由\
  \ SQL 语句组成。以下示例允许通过 `getAllCustomers()` 获取表中的所有行：\n\n```java\n@Query(\"SELECT *\
  \ FROM customers\")\nLiveData<List<Customer>> getAllCustomers();\n```\n\n`getAllCustomers()`\
  \ 方法返回一个包含每个记录对应的 `Customer` 实体的 `List`。DAO 还使用了 `LiveData`，以便仓库可以观察数据库的变化。也可以向方法传递参数，通过在变量名前面加冒号（`:`）在\
  \ `WHERE` 条件中引用这些参数：\n\n```java\n@Query(\"SELECT * FROM customers WHERE name = :customerName\"\
  )\nList<Customer> findCustomer(String customerName);\n```\n\n在此示例中，可以使用 `@Insert`\
  \ 注解声明一个基础的插入操作。这被称为便利注解（convenience annotation），因为 Room 持久化库可以推导出传递给 `addCustomer()`\
  \ 的 `Customer` 实体是要插入数据库，无需 SQL 语句：\n\n```java\n@Insert\nvoid addCustomer(Customer\
  \ customer);\n```\n\n可以在单个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\nvoid insertCustomers(Customer...\
  \ customers);\n```\n\n下面的 DAO 声明删除了所有匹配提供名称的记录。除了使用 `@Query` 注解来执行删除外，还可以使用 `@Delete`\
  \ 便利注解。在以下示例中，所有与传递给 `deleteCustomers()` 方法的实体集匹配的 `Customer` 记录将从数据库删除：\n\n```java\n\
  @Delete\nvoid deleteCustomers(Customer... customers);\n```\n\n`@Update` 便利注解在更新记录时提供类似的行为：\n\
  \n```java\n@Update\nvoid updateCustomers(Customer... customers);\n```\n\n这些类型数据库操作的\
  \ DAO 方法也可以声明为返回一个 `int` 值，表示受事务影响的行数，例如：\n\n```java\n@Delete\nint deleteCustomers(Customer...\
  \ customers);\n```\n\n### 70.5 Room 数据库\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，并作为嵌入\
  \ Android 操作系统的实际 SQLite 数据库之上的层。该类负责创建并返回新的 Room 数据库实例，并提供对数据库关联 DAO 实例的访问。\n\n\
  Room 持久化库提供了创建数据库实例的构建器。每个 Android 应用应只有一个 Room 数据库实例，因此最好在类内部实现防御代码以防止创建多个实例。\n\
  \n以下代码列表列出了与示例客户表配合 Room 数据库实现：\n\n```java\nimport android.content.Context;\nimport\
  \ android.arch.persistence.room.Database;\nimport android.arch.persistence.room.Room;\n\
  import android.arch.persistence.room.RoomDatabase;\n\n@Database(entities = {Customer.class},\
  \ version = 1)\npublic class CustomerRoomDatabase extends RoomDatabase {\n    public\
  \ abstract CustomerDao customerDao();\n}\n```\n\n\n\n\n\n```java\nprivate static\
  \ CustomerRoomDatabase INSTANCE;\n\nstatic CustomerRoomDatabase getDatabase(final\
  \ Context context) {\n    if (INSTANCE == null) {\n        synchronized (CustomerRoomDatabase.class)\
  \ {\n            if (INSTANCE == null) {\n                INSTANCE = Room.databaseBuilder(\n\
  \                        context.getApplicationContext(),\n                    \
  \    CustomerRoomDatabase.class, \"customer_database\")\n                      \
  \  .build();\n            }\n        }\n    }\n    return INSTANCE;\n}\n```\n\n\
  上述示例中需要注意的重要区域是类声明上方的注解，它声明了数据库将要操作的实体；检查是否已经创建了类实例的代码，以及为实例分配的名称`“customer_database\"\
  `。\n\n# 70.6 仓库 (Repository)\n\n仓库负责获取 `Room Database` 实例，使用该实例访问关联的 `DAOs`，然后调用\
  \ `DAO` 方法来执行数据库操作。一个为仓库设计的典型构造函数如下：\n\n```java\npublic class CustomerRepository\
  \ {\n\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase db;\n\
  \n    public CustomerRepository(Application application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n}\n```\n\n一旦仓库创建完成，它就可以调用 `DAO`\
  \ 方法，例如：\n\n```java\nLiveData<List<Customer>> allCustomers = customerDao.getAllCustomers();\n\
  ```\n\n在调用 `DAO` 方法时，需要注意的是，除非返回的是 `LiveData`（它是异步执行的），否则在主线程执行操作可能会导致 UI 卡死。有关更多信息，请参阅\
  \ Android 数据库与教程 以及 Java 线程与执行器。\n\n\n\n\n\n在欢迎屏幕上选择 New Project（新建项目）菜单选项，在弹出的新项目对话框中，点击\
  \ Next（下一步）按钮之前，选择 `Empty Views Activity` 模板。\n\n在 Name（名称）字段中输入 `RoomDemo`，并指定\
  \ `com.ebookfrenzy.roomdemo` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置更改为\
  \ `API 26: Android 8.0 (Oreo)`，并将 Language（语言）菜单设置为 `Java`。\n\n按照第 11.8 将项目迁移到视图绑定节概述的步骤将项目迁移到视图绑定。\n\
