  \        .build();\n}\n```\n\n在教程的这个阶段，我们已经构建了可以就绪使用的 `RemoteInput`、`PendingIntent`\
  \ 和 `Notification Action`（通知操作）对象。下一个阶段是构建并发布通知：\n\n```java\npublic void sendNotification(View\
