  Action\", null)\n            .show();\n    }\n});\n```\n\n该代码通过 `binding` 访问悬浮按钮，并在被点击时添加一个\
  \ `OnClickListener` 处理程序。当项目编译并运行时，悬浮按钮将出现在屏幕底部，如图 46-3 所示：\n\n![](img/as_default_fab.jpg)\n\
  \n图 46-3\n\n点击悬浮按钮将触发 `OnClickListener` 方法，导致 `Snackbar` 在屏幕底部显示：\n\n![](img/as_default_snackbar.jpg)\n\
  \n图 46-4\n\n# 46.7 移除导航功能\n\n正如“Android Studio 编辑器指南”所示，Basic Activity 模板包含多个 Fragment\
