  \ = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n    notificationManager.notify(notificationId,\
  \ newMessageNotification);\n}\n```\n\n## 63.8 接收直接回复输入\n\n\n\n\n\n现在通知已成功向用户请求输入，应用程序需要对该输入进行处理。本教程的目标是让用户在通知中输入的文本显示在\
  \ activity 用户界面界面的 `TextView` 小部件上。\n\n当用户输入文本并点击发送按钮时，将通过 `PendingIntent` 对象中的\
  \ `intent` 启动 `MainActivity`。此 `intent` 中包含了用户通过通知输入的文本。在 activity 的 `onCreate()`\
  \ 方法中，调用 `getIntent()` 方法将返回启动该 activity 的 `intent` 副本。将其传递给 `RemoteInput.getResultsFromIntent()`\
  \ 方法，反过来将返回一个包含回复文本的 `Bundle` 对象，该文本可以被提取并赋值给 `TextView` 小部件。这导致了 `MainActivity.java`\
  \ 文件中的 `onCreate()` 方法被修改，其修改后的代码读取如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n...\n    createNotificationChannel(channelID, \"DirectReply\
  \ News\",\n                               Example News Channel\");\n    handleIntent();\n\
  }\n\nprivate void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle\
  \ remoteInput = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput !=\
  \ null) {\n        String inputString = remoteInput.getCharSequence(\n         \
  \       KEY_TEXT_REPLY).toString();\n        binding.textView.setText(inputString);\n\
  \    }\n}\n...\n```\n\n完成这些代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板内输入并发送一些文本。注意，`MainActivity`\
  \ 中的 `TextView` 小部件已更新，以显示所输入的内联文本。\n\n## 63.9 更新通知\n\n在通知中发送回复后，你可能已经注意到进度指示器在通知面板内继续持续旋转，如\
  \ 图 63-4 所示：\n\n![](img/as_direct_reply_progress.jpg)\n\n图 63-4\n\n通知显示此指示器是因为它正在等待\
