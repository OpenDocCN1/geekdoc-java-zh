  ### 32.8 让 Activity 与文本片段通信\n\n正如《Android Fragments 简介》(#Fragments.xhtml__idTextAnchor712)所概述，activity\
  \ 可以通过获取片段类实例的引用，然后在该对象上调用公共方法来与片段进行通信。因此，在 `TextFragment` 类中，我们现在将实现一个名为 `changeTextProperties()`\
  \ 的公共方法，该方法接受一个整数作为字体大小，一个字符串作为要显示的新文本作为参数。然后，该方法将使用这些值来修改 `TextView` 对象。在 Android\
  \ Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n\npublic class TextFragment extends Fragment {\n\n.\n\n.\n\n    public\
  \ void changeTextProperties(int fontsize, String text)\n\n    {\n\n        binding.textView2.setTextSize(fontsize);\n\
  \        binding.textView2.setText(text);\n\n    }\n}\n```\n\n当 `TextFragment` 片段放置在\
  \ activity 布局中，它被赋予了 ID `text_fragment`。使用此 ID，activity 现在可以获取片段实例的引用，并调用该对象上的 `changeTextProperties()`\
  \ 方法。编辑 `MainActivity.java` 文件并如下修改 `onButtonClick()` 方法：\n\n```java\npublic void\
  \ onButtonClick(int fontsize, String text) {\n\n   TextFragment textFragment =\n\
  \    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \n    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 32.9 测试应用程序\n\
  \n该项目的编码工作现在已完成，最后一个剩余的任务是运行应用程序。当应用程序启动时，主 activity 将启动，并创建创建显示两个片段。当用户触摸工具栏片段中的按钮时，activity\
  \ 的 `onButtonClick()` 方法将由工具栏片段调用，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。然后 activity\
  \ 将调用第二个片段的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 32-10\n\n### 32.10 总结\n\n本章的目标是通过创建一个示例项目，演示在 Android 应用程序中使用片段的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容在引入片段之前的 Android 版本，包括在 activity 布局中的片段，以及实现片段间的通信。\n\
  \n## 33. 使用 Jetpack 的现代 Android 应用架构\n\n多年来，Google 并不推荐构建 Android 应用程序的特定方法，而是提供工具和开发工具包，让开发者决定哪种方法对特定项目或个人编程风格最有效。这种情况在\
  \ 2017 年随着 Android 架构组件（Android Architecture Components）的引入而发生了改变，这些组件在 2018 年发布时成为了\
  \ Android Jetpack 的一部分。\n\n本章提供了 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。一旦涵盖了基础知识，这些主题将在后续章节中进行更详细的介绍并通过实际示例进行演示。\n\
  \n### 33.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android 架构组件、Android\
  \ Support Library 以及一组关于如何构建 Android 应用的建议指南组成。Android 架构组件的设计旨在让开发 Android 应用时能够更快、更容易地执行常见任务，同时符合架构指南的核心原则。\n\
  \n虽然本书将涵盖所有的 Android 架构组件，但本章将重点关注关键架构指南以及 `ViewModel`、`LiveData` 和 `Lifecycle`\
  \ 组件，同时介绍数据绑定（Data Binding）和存储库（Repositories）。\n\n在继续之前，重要的是理解 Jetpack 应用开发方法是可选的。虽然\
  \ Jetpack 强调了多年年来流行的其他技巧的某些缺点，但 Google 并没有完全谴责那些应用开发方法。Google 的立场是，虽然开发应用没有绝对对错之分，但有一种推荐的方法。\n\
  \n### 33.2 “旧”架构\n\n在名为《在 Android Studio 中创建示例 Android 应用程序》(#Sample_App.xhtml__idTextAnchor043)的章节中，创建了一个\
  \ Android 项目，该项目包含一个单一 activity，其中包含了用于显示和管理用户界面的所有代码，以及应用程序的后端逻辑。在 Jetpack 引入之前，最常见的架构遵循这种范式，即应用由多个\
  \ activity 组成（每个屏幕一个），每个 activity 类在某种程度上混合了用户界面和后端逻辑。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，用户每次旋转设备时\
  \ activity 都会被销毁并重建，导致任何未保存到持久化存储形式的数据丢失），以及诸如为每个应用屏幕启动新 activity 导致导航效率低下等问题。\n\
  \n### 33.3 现代 Android 架构\n\n在最基本的层面，Google 现在提倡单 activity 应用（single-activity apps），不同的屏幕作为内容加载到同一个\
  \ activity 中。\n\n现代架构指南还建议将应用程序内部不同的职责分离到完全独立的模块中（这被称为“关注点分离”的概念）。这种方法的关键之一是 `ViewModel`\
  \ 组件。\n\n### 33.4 ViewModel 组件\n\nViewModel 的目的是将与用户界面相关的数据模型和逻辑与负责显示用户界面以及与操作系统交互的代码分离。通过这种方式设计，应用程序将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n`ViewModel` 只知道数据模型和相应的逻辑。它完全不知道用户界面，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要显示的数据时，它请求 `ViewModel` 提供。同样，当用户在用户界面视图中输入数据时，UI 控制器将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用程序生命内重建多少次，`ViewModel` 实例都会留在内存中，从而保持数据的一致性。例如，activity\
  \ 使用的 `ViewModel` 将一直留在内存中直到 activity 结束，在单 activity 应用中，这意味着直到应用程序退出。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 33-1\n\n### 33.5 LiveData 组件\n\n\n\n\n\n考虑一个显示实时数据的应用，例如金融股票的当前价格。该应用可以使用股票价格\
  \ Web 服务来持续更新 `ViewModel` 中的数据模型以获取最新信息。这些实时数据只有在及时显示给用户时才有用。UI 控制器只有两种方式可以确保在用户界面中显示最新数据。其中一种方案是控制器持续检查\
  \ `ViewModel`，以确定数据自上次显示以来是否发生了变化。然而，这种方法的问题在于，它的效率可能较低。为了保持数据馈的实时性，UI 控制器必须在循环中运行，不断检查数据是否发生变化。\n\
  \n更好的解决方案是让 UI 控制器在 `ViewModel` 内部特定数据项发生变化时接收通知。这通过使用 `LiveData` 组件来实现。`LiveData`\
  \ 是一个数据持有者（data holder），它允许一个值变得是可观测的（observable）。简单来说，一个可观察对象可以在数据发生变化时通知其他对象，从而解决确保用户界面始终与\
  \ `ViewModel` 中的数据保持一致的问题。\n\n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者（observer），该观察者反会在值发生变化时收到通知。在我们的假设应用中，例如，股票价格将被封装在\
  \ `ViewModel` 内部的 `LiveData` 对象中，UI 控制器将该值分配一个观察者，声明一个在值变化时调用的方法。当数据变化触发时，该方法将从\
  \ `ViewModel` 读取更新的值并使用它来更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 33-2\n\n\
  `LiveData` 实例也可以声明为可变的（mutable），允许观察实体更新 `LiveData` 对象持有的底层值。例如，用户可能会在用户界面中输入一个需要覆盖存储在\
  \ `ViewModel` 中的值的值。\n\n使用 `LiveData` 的另一个关键优势是它可以感知其观察者的生命周期状态（lifecycle state）。例如，如果一个\
  \ activity 包含 `LiveData` 观察者，相应的 `LiveData` 对象将知道 activity 生命周期周期状态的变化并做出相应响应。如果\
  \ activity 处于暂停（可能是应用被放入后台），`LiveData` 对象将停止向观察者发送事件。假设 activity 刚刚启动或在暂停后恢复。在这种情况下，`LiveData`\
  \ 对象将向观察者发送一个 `LiveData` 事件，以便 activity 拥有最新的值。同样，`LiveData` 实例将知道 activity 被销毁并移除观察者以释放资源。\n\
  \n到此为止，我们只讨论了 UI 控制器使用观察者。但在实践中，观察者可以在任何符合 Jetpack 生命周期管理方法的对象内部使用。\n\n## 33.6 ViewModel\
  \ Saved State\n\nAndroid 允许用户将活跃的应用放入后台，并在在设备上执行其他任务后返回它（包括运行其他应用）。当设备资源不足时，操作系统将通过终止后台应用进程来纠正这个问题，从最久使用的应用开始。然而，当用户返回被终止的后台应用时，它应该显示为与被放入后台时相同的状态，无论它是否被终止。在与\
  \ `ViewModel` 关联的数据方面，可以使用 `ViewModel Saved State` 模块来实现。该模块允许值存储在应用的保存状态中，并在系统发起的进程终止时恢复它们。此主题将在后的\
  \ \"An Android ViewModel Saved State Tutorial” 章节中介绍。\n\n## 33.7 LiveData 和 Data\
  \ Binding\n\nAndroid Jetpack 包含了`Data Binding Library`数据绑定库，它允许 `ViewModel` 中的数据直接映射到\
  \ XML 用户界面布局文件中的特定视图。在之前创建的 `AndroidSample` 项目中，必须编写代码来获取 `EditText` 和 `TextView`\
  \ 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许存储在 `ViewModel` 中的 `LiveData` 值直接在 XML 布局文件中被引用，避免了编写代码来保持布局视图更新。\n\
  \n![](img/Jetpack_diagram_3.jpg)\n\n图 33-3\n\n数据绑定将更详细地介绍，从“An Overview of Android\
  \ Jetpack Data Binding” 章节开始。\n\n## 33.8 Android 生命周期\n\n从一个 Android 组件创建到其被销毁的时间被称为生命周期（lifecycle）。在生命周期期间，组件将在不同的生命周期状态之间切换，通常在操作系统的控制下并响应用户操作。例如，一个\
  \ activity 将初始化状态开始，然后过渡到创建状态。一旦 activity 运行，它将切换到启动状态，从那里它将循环经过各种状态，包括创建、启动、恢复和销毁。\n\
  \n许多 Android Framework 类和组件允许其他对象访问其当前状态。`Lifecycle observers`（生命周期观察者）也可以使用，以便在另一个对象的生命周期状态变化时接收通知。`ViewModel`\
  \ 组件在后台使用这种技术来识别观察者何时重启或被销毁。此功能不仅限于 Android 框架和架构组件。它也可以构建在任何使用架构组件包含的生命周期组件类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为 `lifecycle-aware`（生命周期感知）。相比之下，提供其生命周期状态访问的对象被称为 `lifecycle\
  \ owners`（生命周期所有者）。标题为 Working with Android Lifecycle-Aware Components”\n\n图 33-4\n\
  \n## 33.10 总结\n\n到目前，Google 倾向于不推荐构建 Android 应用的特定方法。现在，随着 Android Jetpack 的推出（包含了工具、组件、库和架构指南），情况发生了变化。Google\
  \ 现在建议将应用项目分为不同的模块，每个模块负责特定的功能区域，即所谓的“关注点分离”。\n\n\n\n\n\nAndroid Jetpack 包含了 Android\
  \ 架构组件（Android Architecture Components），旨在使开发符合推荐指南的应用程序变得更容易。本章介绍了 `ViewModel`、`LiveData`\
  \ 和 `Lifecycle` 组件。从下一章开始，我们将详细介绍这些组件。本章未提到的其他架构组件将在书的后续部分介绍。\n\n# 34 一个 Android\
  \ ViewModel 教程\n\n上一章介绍了了 Android Jetpack 的基本概念，并概述了现代 Android 应用架构的基础。Jetpack 定义了一系列建议，描述了\
  \ Android 应用项目应该如何构建，同时提供了一系列库和组件，这些组件能够更容易遵循这些指南，从而用更少的代码和更少的错误开发出可靠的应用程序。\n\n\
  为了帮助强化和澄清上一章提供的信息，本章将逐步创建一个使用 `ViewModel` 组件的示例应用项目。下一章将通过包含 `LiveData` 和数据绑定（data\
  \ binding）支持进一步增强该示例。\n\n## 34.1 关于项目\n\n在名为在 Android Studio 中创建示例 Android 应用的章节中，创建了一个名为\
  \ `AndroidSample` 的项目，该应用的所有代码都封装在主 `Activity` 类文件中。在下一章中，创建了一个 `AVD` 模拟器并用它运行该应用。在应用运行时，我们亲身经历了了以这种方式开发应用时出现的问题：当\
  \ `TextView` 组件上显示的数据在设备旋转期间会丢失。\n\n本章将使用 `ViewModel` 组件实现相同的货币转换器应用，并遵循 Google\
  \ 应用架构指南以避免 Activity 生命周期周期管理的复杂性。\n\n## 34.2 创建 ViewModel 示例项目\n\n在创建 `AndroidSample`\
  \ 项目时，选择了 `Empty Views Activity` 模板作为项目的依据。然而，此项目将使用 `Basic Views Template` 模板。\n\
  \n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Basic Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `ViewModelDemo`，并指定 `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language` 菜单改为\
  \ `Java`。\n\n## 34.3 移除不需要的项目元素\n\n正如 Android Studio 布局编辑器工具指南所示，`Basic Views Activity`\
  \ 模板包含了并非所有项目都需要的特性。在向项目添加 `ViewModel` 之前，我们首先需要按照所示移除导航功能、第二个内容片段（fragment）和浮动操作按钮：\n\
  \n1. 在 Project 工具窗口中双击 `activity_main.xml` 布局文件，选择浮动按钮，并按下键盘上的删除键从布局中移除该对象。\n\n\
  2. 编辑 `MainActivity.java` 文件并从 `onCreate` 方法中移除浮动按钮代码，如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n\n.\n.\n\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                .setAnchorView(R.id.fab)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n3. 在 Project 工具窗口中，导航并双击 `app ->\
  \ res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\n4. 在编辑器中，选择图面板中的 `SecondFragment`\
  \ 项，并按下键盘删除键从图中移除它。\n\n5. 找到并删除 `SecondFragment.java` 和 `fragment_second.xml` 文件。\n\
  \n6. 最后一项任务是从 `FirstFragment` 类中移除一些代码，使得 `Button` 视图在点击时不再导航到已不存在的第二个片段。编辑 `FirstFragment.java`\
  \ 文件并移除 `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n## 34.4 设计 Fragment 布局\n\n下一步是设计片段的布局。首先，在 Project 工具窗口中找到\
  \ `fragment_first.xml` 文件并双击它加载到布局编辑器中。布局加载后，选择并删除现有的 `Button`、`TextView` 和 `ConstraintLayout`\
  \ 组件。接下来，在 Component Tree 面板中右键点击 `NestedScrollView` 实例，选择 `Convert NestedScrollView\
  \ to ConstraintLayout` 菜单选项（如图 34-1\n\n图 34-1\n\n选择转换后的 `ConstraintLayout` 组件并使用\
  \ Attributes 工具窗口将 `id` 更改为 `constraintLayout`。\n\n添加一个新的 `TextView`，将其放置在布局中心，并将\
  \ `id` 更改为 `resultText`。接下来，从调板中拖入一个 `Number (Decimal)` 视图并将其放置在现有 `TextView` 之上。选中布局中的该视图，参考属性窗口并将\
  \ `id` 更改为 `dollarText`。\n\n将一个 `Button` 拖到布局中，放置在 `TextView` 下方，并将文本改为“Convert”。选中按钮，将\
  \ `id` 更改为 `convertButton`。此时，布局应类似于图 34-2 所示（注意三个视图已通过垂直方式进行约束）：\n\n![](img/as_view_model_ui.jpg)\n\
  \n图 34-2\n\n最后，点击布局右上角的警告图标并将硬编码字符串转换为资源。\n\n## 34.5 实现 ViewModel\n\n用户界面完成后，需要在\
  \ ViewModel 中创建应用的数据模型。首先在 Project 工具窗口中找到 `com.ebookfrenzy.viewmodeldemo` 项，右键点击并选择\
  \ `New -> Java Class` 选项。将新类命名为 `MainViewModel` 并按回车键。编辑新类文件使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public\
  \ Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n该类声明了变量来存储当前的美元字符串值和转换后的金额，并带有用于访问这些数据的\
  \ getter 和 setter 方法。调用时，`setAmount()` 方法接收美元金额作为参数并存储在局部 `dollarText` 变量中。美元字符串值转换为浮点数，乘以虚拟汇率，并将得到的欧元值存储在\
  \ `result` 变量中。相反，`getResult()` 方法返回分配给 `result` 变量的当前值。\n\n 34.6 将 Fragment 与 ViewModel\
  \ 关联\n\n\n\n\nFragment 需要某种方式来获取 `ViewModel` 的引用，以便访问模型并观察数据变化。`Fragment` 或 `Activity`\
  \ 通过使用 `ViewModelProvider` 类的实例来维护其对数据所赖的 `ViewModels` 的引用。\n\n在 `Fragment` 内部，使用\
  \ `ViewModelProvider` 类创建 `ViewModelProvider` 实例。当调用该类时，类初始化器会传入当前 `Fragment` 或\
  \ `Activity` 的引用，并返回如下的 `ViewModelProvider` 实例：\n\n`ViewModelProvider viewModelProvider\
  \ = new ViewModelProvider(this);`\n\n一旦创建了 `ViewModelProvider` 实例，就可以使用索引值来请求特定的\
  \ `ViewModel` 类。随后，提供程序将创建该 `ViewModel` 类的新实例，或者返回一个已有的实例，例如：\n\n`ViewModel viewModel\
  \ = viewModelProvider.get(MainViewModel.class);`\n\n编辑 `FirstFragment.java` 文件并重写\
  \ `onCreate()` 方法以设置 `ViewModelProvider`：\n\n```java\nimport androidx.lifecycle.ViewModelProvider;\n\
  import androidx.annotation.Nullable;\n\npublic class FirstFragment extends Fragment\
  \ {\n    private MainViewModel viewModel;\n\n    @Override\n    public void onCreate(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n  \
  \      viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    }\n\
  }\n```\n\n由于有了对模型视图的访问权限，现在可以在 `Fragment` 中添加代码以开始处理数据模型。\n\n## 34.7 修改 Fragment\n\
  \n需要更新 `fragment` 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的货币金额。\n\
  \n在标题为在 Android Studio 中创建一个 Android 示例应用的章节中，使用了 `Button` 控件的 `onClick` 属性来指定用户点击按钮时要调用的方法。遗憾的是，该属性只能调用\
  \ `Activity` 上的方法，而不能用于调用 `Fragment` 中的方法。为了克服这一局限性，我们必须在 `Fragment` 类中添加一些代码，为按钮设置\
  \ `onClick` 监听器。这可以在 `FirstFragment.java` 文件的 `onViewCreated()` 生命周期方法中实现，如下所示：\n\
  \n```java\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n\n    @Override\n    public void onViewCreated(@NonNull View view,\
  \ @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n        });\n    }\n}\n\
  ```\n\n添加监听器后，每当用户点击按钮时，`onClick()` 方法中的任何代码都会被调用。\n\n## 34.8 访问 ViewModel 数据\n\n\
  点击按钮时，`onClick()` 方法需要从 `EditText` 视图读取当前值，确认该字段为空，然后调用 `ViewModel` 实例的 `setAmount()`\
  \ 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法并将转换后的值显示在 `TextView` 控件上。\n\n由于项目尚未未使用\
  \ `LiveData`，因此在每次创建 `Fragment` 时，也有必要从 `ViewModel` 获取最新的结果值。\n\n继续留在 `FirstFragment.java`\
  \ 文件中，在 `onViewCreated()` 方法中按如下方式实现这些需求：\n\n```java\nimport java.util.Locale;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            viewModel.getResult()));\n    binding.convertButton.setOnClickListener(v\
  \ -> {\n        if (!binding.dollarText.getText().toString().equals(\"\")) {\n \
  \           viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n         \
  \           binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                    viewModel.getResult()));\n        } else {\n      \
  \      binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n\
  ## 34.9 测试项目\n\n完成此阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击按钮。转换后的金额应该出现在 `TextView` 上，表明过程正在运行。\n\
  \n当运行原始的 `AndroidSample` 应用时，旋转设备会导致 `TextView` 上显示的值丢失。现在在 `ViewModelDemo` 应用上重复此操作，并注意当前值被保留了。这是因为当\
  \ `Fragment` 被销毁时，`ViewModel` 仍然留在内存中。\n\n## 34.10 总结\n\n在本章中，我们重新回顾了书中之前创建的 `AndroidSample`\
  \ 项目，并创建了一个符合 Android 架构指南的新版本项目。示例项目还演示了使用 `ViewModels` 将数据处理与用户界面分离。最后，本章展示了 `ViewModel`\
  \ 方案如何处理 `Fragment` 和 `Activity` 的生命周期。\n\n## 35 一个 Android Jetpack LiveData 教程\n\
  \n上一章开始构建一个符合推荐的 Jetpack 架构指南的应用。这些初始步骤涉及在 `ViewModel` 实例中为应用用户界面实现数据模型。\n\n本章将使用\
  \ `LiveData` 架构组件进一步增强应用设计。一旦在本章中为项目添加 `LiveData` 支持，接下来的章节（从 Android Jetpack Data\
  \ Binding 概述开始）将使用 Jetpack Data Binding 库消除更多的代码。\n\n### 35.1 LiveData 回顾\n\n`LiveData`\
  \ 在此前的使用 Jetpack 构建现代应用架构章节中介绍过。正如之前描述，`LiveData` 组件可以用作 viewModel 中数据值的封装。一旦包含在\
  \ `LiveData` 实例中，这些变量对应用内的其他对象可见（通常是 `Activities` 和 `Fragments`）。这允许 UI 控制器在底层 `LiveData`\
  \ 值变化时都接收通知。通过创建 `Observer` 类的实例并定义在 `LiveData` 值变化时调用的 `onChange()` 方法来设置观察者。一旦创建了\
  \ `Observer` 实例，通过调用 `LiveData` 对象的 `observe()` 方法将其附加到 `LiveData` 对象。\n\n`LiveData`\
  \ 实例可以使用 `MutableLiveData` 类声明为可变，允许 `ViewModel` 和 UI 控制器更改底层数据值。\n\n### 35.2 在\
  \ ViewModel 中添加 LiveData\n\n启动 Android Studio，打开上一章创建的 `ViewModelDemo` 项目，并打开 `MainViewModel.java`\
  \ 文件，其目前的内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n    }\n}\n```\n\n\n\n\n```java\nresult = Float.parseFloat(dollarText)*rate;\n\
  \n}\n\npublic Float getResult()\n{\n    return result;\n}\n\n```\n\n本章的这一阶段是将 `result`\
  \ 变量封装在一个 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改其值）。首先修改类，使其读取内容如下，请注意在使用\
  \ `LiveData` 时需要额外导入一个包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n\
  import androidx.lifecycle.MutableLiveData;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float\
  \ getResult()\n    {\n        return result;\n    }\n}\n```\n\n现在 `result` 变量已包含在可变的\
  \ `LiveData` 实例中，必须对 `setAmount()` 和 `getResult()` 方法进行修改。对于 `setAmount()` 方法，已不能再使用赋值运算符\
  \ `=` 为 `result` 变量赋值。相反，必须调用 `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法声明为返回 `Float` 值，必须更改为返回 `MutableLiveData` 对象。完成这些剩余更改后，将得到以下类文件：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n## 35.3 实现观察者\n\n现在转换结果已包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置观察者，在本例中，它器\
  \ `FirstFragment` 类。找到 `FirstFragment.java` 类（app -> java -> <package name> -> `FirstFragment`），双击将其加载到编辑器中，并修改\
  \ `onViewCreated()` 方法以创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.Observer;\n\n@Override\n\
  public void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            viewModel.getResult()));\n    final Observer<Float> resultObserver\
  \ = new Observer<Float>() {\n        @Override\n        public void onChanged(@Nullable\
  \ final Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                    \"%.2f\", result));\n        }\n    };\n}\n```\n\n`resultObserver`\
  \ 实例声明了 `onChanged()` 方法，当该方法被调用时，会传入当前的 `result` 值，然后将其转换为字符串并显示在 `resultText`\
  \ 上。下一步是将观察者添加到 `LiveData` 对象中。由于更新 `resultText` 现在是 `onChanged()` 回调的职责，执行此项任务的现有代码行可以删除：\n\
  \n```java\n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\",\n         \
  \   viewModel.getResult()));\n    final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n        @Override\n        public void onChanged(@Nullable final Float result)\
  \ {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\n    \
  \                \"%.2f\", result));\n        }\n    };\n}\n```\n\n\n\n\nAndroid\
  \ Jetpack Data Binding 库提供了数据绑定支持，主要提供了一种简单的方法，将用户界面布局中的视图与应用代码中存储的数据（通常位于 `ViewModel`\
  \ 实例中）连接起来。数据绑定提供了一种方便的方法，将用户界面控件（如 `Button` 控件）映射到其他对象（如 UI 控制器和 `ViewModel` 实例）中的事件和监听器方法。\n\
  \n当与 `LiveData` 组件配合使用时，数据绑定变得特别强大。例如，考虑一个通过数据绑定到 `ViewModel` 内部 `LiveData` 变量的\
  \ `EditText` 视图。通过这种方式连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText` 视图中；当使用双向绑定时，输入到\
  \ `EditText` 中的任何数据都将自动用于更新 `LiveData` 值。最令人印象深刻的是，这可以在初始设置绑定所需的代码之外无需编写额外代码即可。\n\
  \n传统上，将交互式视图（如 `Button` 控件）连接到 UI 控制器中的方法，需要开发者编写代码来实现一个监听器方法，以便在点击按钮时调用。数据绑定使得这变得非常简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要调用的方法即可。\n\n## 36.2 数据绑定的关键组件\n\nAndroid Studio 项目默认没有配置数据绑定支持。在应用开始使用数据绑定之前，必须组合几个元素。这些涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然这初看起来看起来可能很复杂，但分离开来看，这些都是非常简单的步骤，一旦完成，在节省代码工作量方面是物超所值的。本章的剩余部分将详细介绍每个元素。在涵盖了这些基础知识后，下一章将通过一个详细的教程来演示这些步骤。\n\
  \n### 36.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须配置为使用 Android Data Binding 库，并启用对数据绑定类和绑定语法的支持。幸运的是，这只需在模块级\
  \ `build.gradle.kts` 文件中添加几行代码即可实现（即项目工具窗口 Gradle Scripts 下列出的 `build.gradle.kts\
  \ (Module: app)`）。以下列出了启用了数据绑定的部分构建文件：\n\n```\nandroid {\n    buildFeatures {\n\
  \        dataBinding = true\n    }\n}\n```\n\n### 36.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在\
  \ XML 布局文件中。在这些布局文件中的视图能够利用数据绑定之前，必须将布局文件转换为数据绑定布局文件。\n\n正如书中前面概述的，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。根视图始终采用布局容器的形式，例如\
  \ `ConstraintLayout`、`FrameLayout` 或 `LinearLayout` 实例，正如 `ViewModelDemo` 项目中 `fragment_main.xml`\
  \ 文件中的所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n要使用数据绑定，布局层次结构必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父级。\n\n在上述示例的情况下，这需要对现有的布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 36.2.3 布局文件数据元素\n\n数据布局文件需要某种方式来声明布局绑绑定类（例如 ViewModel 或 UI\
  \ 控制器）。在声明这些类后，布局文件需要一个变量来引用它们。这是通过使用 `data` 元素实现的，示例所示：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"ViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  上面的 `data` 元素声明了一个类型为 `ViewModel` 的变量 `myViewModel`（注意在声明变量时需要指定类的完整包名）。\n\n`data`\
  \ 元素可以导入其他类，这些类可以在布局的其他地方被引用。例如，如果你有一个在显示给用户之前需要调用的方法，可以如下导入该类：\n\n```xml\n<data>\n\
  \    <import type=\"com.example.FormattingTools\" />\n    <variable\n        name=\"\
  viewModel\"\n        type=\"com.example.myapp.ui.main.MainViewModel\" />\n</data>\n\
  ```\n\n### 36.2.4 绑定类\n\n对于绑定布局文件 `data` 元素中引每个类，Android Studio 都会自动生成相应的绑定类。该 `ViewDataBinding`\
  \ 子类将根据文件名使用单词大小写和 `Binding` 后缀进行命名。因此，名为 `fragment_main.xml` 的布局文件的绑定类将是 `FragmentMainBinding`。绑定类包含布局文件中指定的绑定，并将它们映射到绑定对象中的变量和方法。\n\
  \n虽然绑定类是自动生成的，但必须编写代码根据相应的数据绑定布局文件创建该类的实例。幸运的是，这可以通过 `DataBindingUtil` 类来实现。\n\n\
  Activity 或 Fragment 的初始化代码通常会设置内容或“填充”用户界面布局文件。这意味着代码打开布局文件，解析 XML 并在内存中创建并配置所有的视图对象。在现有\
  \ Activity 类中，实现此目的的代码可以在 `onCreate()` 方法中找到并如下所示：\n\n```\nsetContentView(R.layout.activity_main);\n\
  ```\n\n对于 Fragment，这发生在 `onCreateView()` 方法中：\n\n```\nreturn inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n```\n\n\n\n在 `Activity` 类中创建绑定类实例，只需要将初始化代码修改如下：\n\n```java\n\
  ActivityMainBinding binding;\n\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n对于 `Fragment`，代码将将如下所示：\n\n```java\nFragmentMainBinding binding;\n\
  \nbinding = DataBindingUtil.inflate(\n        inflater, R.layout.fragment_main,\
  \ container, false);\n\nbinding.setLifecycleOwner(this);\n\nView view = binding.getRoot();\n\
  \nreturn view;\n```\n\n### 36.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含 `data` 元素，其中包含 `variable`\
  \ 元素，这些元素由变量名以及要建立绑定的类型组成。例如：\n\n```xml\n<data>\n    <variable\n        name=\"\
  viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n             name=\"uiController\"\n             type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到具体的\
  \ `MainViewModel` 对象实例。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法来实现的，该实例的引用在上一节已获取：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\n\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述 `data` 元素中的第二个变量引用了名为 `MainFragment` 的 `Fragment` 形式 UI\
  \ 控制器类。在这种情况下，UI 控制器（无论是 `Activity` 还是 `Fragment`）中的代码需要如下将自己赋值给变量：\n\n```java\n\
  binding.setVariable(uiController, this);\n```\n\n### 36.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图与绑定对象之间的交互方式。例如，`Button`\
  \ 上的绑定表达式可以声明在响应点击时调用对象上的哪个方法。或者，绑定表达式可以定义存储在 `ViewModel` 中的哪个数据值显示在 `TextView`\
  \ 中，以及如何进行展示和格式化。\n\n绑定表达式使用声明式语言，允许通过逻辑以及对其他类和方法的访问来决定如何使用绑定数据。例如，表达式可以包含数学表达式、方法调用、字符串拼接、数组元素访问和比较操作。此外，所有标准\
  \ Java 语言库都会默认导入，因此在 Java 中可以实现的许多功能也可以在绑定表达式中完成。如前所述，`data` 元素也可以用于导入自定义类，以为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，后跟包含在大括号 (`{}`) 内部的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel`\
  \ 实例。假设该类已分配给数据绑定布局文件中名为 `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便视图始终显示最新的结果值。如果此值以\
  \ `String` 对象的形式存储，则在布局文件中的声明如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为 `viewModel` 对象中 `result` `LiveData` 属性所存储的值。\n\n然而，考虑结果在模型中存储为 `Float`\
  \ 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。显然，在 `TextView` 显示它之前，必须将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准\
  \ Java 类类完成转换所需的步骤：\n\n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\
  \n```\n\n在进行此更改后运行应用时，需要注意 Android Studio 控制台中可能会出现警告：\n\n`warning: myViewModel.result.getValue()\
  \ is a boxed field but needs to be un-boxed to execute String.valueOf(viewModel.result.getValue()).`\n\
  \nJava 中的值可以以原始值形式（如 `boolean` 类型，称为未拆箱/unboxed）存在，也可以封装在 Java 对象中（如 `Boolean` 类型）并通过对该对象的引用进行访问（即装箱/boxed）。拆箱过程涉及从对象中拆出原始值。\n\
  \n为了避免此消息，如下如下将错误的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(viewModel.result))}\"\
  \n```\n\n\n\n\n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result,\
  \ 10, \"A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，将用户界面视图绑定到其他对象中的数据和方法。本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的信息，请查看\
  \ Android 上的在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n## 36.3 总结\n\nAndroid 数据绑定提供了一种系统，可以在无需编写代码的情况下，在用户界面布局中的视图与应用架构中其他对象的数据和方法之间建立连接。在完成一些初始配置步骤后，数据绑定涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定方法，以便在响应用户界面中的按钮点击等事件时调用它们。\n\
  \n## 37. Android Jetpack 数据绑定教程\n\n到本书为止，我们已经涵盖了现代 Android 应用架构的基本概念，并更详细地查看了 `ViewModel`\
  \ 和 `LiveData` 组件。数据绑定的概念在上一章中也提到过，现在将在本章中用于进一步修改 `ViewModelDemo` 应用。\n\n### 37.1\
  \ 冗余代码\n\n如果仍需要，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData` 以供下一章使用。完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中所有在本章结束时不再需要的代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `FirstFragment.java` 文件，并按照如下所示修改代码：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n.\n.\n\nimport android.arch.lifecycle.Observer;\n\
  \n.\n.\n\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n.\n.\n\n    @Override\n    public void onViewCreated(@NonNull View\
  \ view,\n                              @Nullable Bundle savedInstanceState) {\n\
  \        super.onViewCreated(view, savedInstanceState);\n        final Observer<Float>\
  \ resultObserver = new Observer<Float>() {\n            @Override\n            public\
  \ void onChanged(@Nullable final Float result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                        \"%.2f\", result));\n            }\n        };\n      \
  \  viewModel.getResult().observe(getViewLifecycleOwner(), resultObserver);\n   \
  \     binding.convertButton.setOnClickListener(v -> {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  ,\n                        binding.dollarText.getText()));\n            } else {\n\
  \                binding.resultText.setText(\"No Value\");\n            }\n    \
  \    });\n    }\n.\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按照如下所示删除代码（同样注意 `dollarText`\
  \ 变量转换为 `LiveData`）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\nimport\
  \ android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    final public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\nfinal private public MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText));\n\
  \    }\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n尽管我们在实现数据绑定时会增加几代码，但数据绑定显著减少了需要编写的代码。\n\n### 37.2 启用数据绑定\n\n使用数据绑定的第一是在\
  \ Android 项目中启用它。这涉及在 Gradle Scripts -> `build.gradle.kts (:app)` 文件中添加新属性。\n\n\
  在 `build.gradle.kts` 文件中添加以下元素以启用项目中的数据绑定：\n\n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n\
  }\nandroid {\n.\n.\n    buildFeatures {\n        viewBinding = true\n        dataBinding\
  \ = true\n    }\n.\n}\n```\n\n一旦添加了条目，编辑器顶部会出现一个包含“Sync Now”（立即同步）链接的栏。点击此链接用新的构建配置重新同步项目。\n\
  \n### 37.3 添加布局元素\n\n正如“Android Jetpack 绑定概述”中所述，布局层级必须有一个 `layout` 组件作为根节点才能使用数据绑定。这要求对\
  \ `fragment_first.xml` 布局（app -> layout -> `fragment_first.xml`）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ Code 模式，并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".FirstFragment\"\
  >\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\
  \n完成这些更改后，切换回 Design 模式，注意新的根视图虽然在画布上不可见，但现在列在组件树中。\n\n![](img/as_data_component_tree.jpg)\n\
  图 37-1\n\n构建并运行应用，以验证添加布局元素没有更改用户界面。\n\n### 37.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加\
  \ `data` 元素。对于此示例，布局将绑定到 `ViewModel`，因此编辑 `fragment_first.xml` 文件以添加如下的 `data` 元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.viewmodeldemo.MainViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".FirstFragment\"\
  >\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\
  \n构建并重新运行应用以确保这些更改生效。\n\n### 37.5 使用绑定类\n\n下一步是修改 `FirstFragment.java` 文件代码以实例化数据绑定。通过重写\
  \ `onCreateView()` 方法实现效果最佳：\n\n```java\n.\n.\n\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.R;\n\n.\n.\n\npublic class MainFragment extends\
  \ Fragment {\n.\n.\n    public View onCreateView(@NonNull LayoutInflater inflater,\
  \ @Nullable ViewGroup container,\n                              @Nullable Bundle\
  \ savedInstanceState) {\n        binding = FragmentMainBinding.inflate(inflater,\
  \ container, false);\n        binding = DataBindingUtil.inflate(\n            inflater,\
  \ R.layout.fragment_first, container, false);\n        binding.setLifecycleOwner(this);\n\
  \        return binding.getRoot();\n    }\n}\n```\n\n\n\n\n旧代码膨胀了 `fragment_first.xml`\
  \ 布局文件（换句话说，创建包含所有视图对象的布局），并返回了根视图（顶层布局容器）的引用。Data Binding Library 包含一个工具类，提供了一个特殊的膨胀方法，该方法在构建\
  \ UI 的同时，还会初始化并返回布局数据绑定类的实例。新代码调用了此方法并将绑定类实例的引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(\n\
  \              inflater, R.layout.fragment_first, container, false);\n```\n\n`binding`\
  \ 对象必须在片段（fragment）存在期间保留在内存中。为了确保该实例在片段消失时被销毁，将当前片段声明为绑定对象的生命周期所有者。\n\n```java\n\
  binding.lifecycleOwner = this;\n\nreturn binding.getRoot;\n```\n\n### 37.6 将 ViewModel\
  \ 实例赋值给数据绑定变量\n\n此时，数据绑定已经知道它将绑定到类型为 `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel`\
  \ 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给布局文件中声明的 `viewModel` 变量。将以下代码添加到 `FirstFragment.java`\
  \ 文件的 `onViewCreated()` 方法中：\n\n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.setVariable(myViewModel,\
  \ viewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 菜单选项重新构建项目以强制生成该类。完成这些更改后，下一步是在数据绑定布局文件的视图元素中插入一些绑定表达式。\n\n### 37.7 添加绑定表达式\n\
  \n第一个绑定表达式将 `resultText` `TextView` 绑定到模型视图中的结果值。编辑 `fragment_first.xml` 文件，找到 `resultText`\
  \ 元素，并修改 text 属性，使元素显示如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"TextView\"\n    android:text='@{safeUnbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \"\
  \ euros\"}'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值当前是否为零，如果是，则显示指示用户输入值的消息。然而，如果结果不为零，则将该值转换为字符串并与单词“euros”拼接，然后显示给用户。\n\
  \n结果值只需要单向绑定，因为布局永远不需要更新存储在 `ViewModel` 中的值。相比之下，`dollarValue` `EditText` 视图需要使用双向绑定，以便根据用户输入的最新值来更新数据模型，并允许在触发设备旋转等生命周期事件时，将当前值重新显示在视图中。`dollarText`\
  \ 元素现在应该声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在已经添加了初始绑定表达式，必须编写一个方法在用户点击\
  \ `Button` 小部件时执行转换。\n\n### 37.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法执行转换计算，并将欧元值放入\
  \ `result` `LiveData` 变量中。现在在 `MainViewModel.java` 文件添加此方法：\n\n```java\npublic class\
  \ MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    final public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    final public MutableLiveData<Float> result = new MutableLiveData<>();\n\n \
  \   public void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n\
  \            (!dollarValue.getValue().isEmpty())) {\n            result.setValue(Float.parseFloat(dollarValue.getValue())\
  \ * usd_to_eu_rate);\n        } else {\n            result.setValue(0F);\n     \
  \   }\n    }\n}\n```\n\n注意，在缺少美元值的情况下，为 `result` `LiveData` 变量分配零值。这确保了分配给 `resultText`\
  \ 的绑定表达式显示“Enter value”消息。\n\n### 37.9 添加监听器绑定\n\n在测试项目的最后一步是在 `Button` 元素上添加监听器表达式，以便在点击按钮时调用\
  \ `convertValue()`。再次以代码模式编辑 `fragment_first.xml` 文件，找到 `convertButton` 元素并添加如下的\
  \ `onClick` 条目：\n\n```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  @() -> myViewModel.convertValue()}\"\n    android:text=\"@string/convert_text\"\n\
  \    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  ### 37.10 测试应用\n\n编译并运行应用，测试在美元字段中输入值并点击 `Convert` 按钮是否会在 `TextView` 中显示正确的结果（带有“euros”后缀），以及在美元字段为空时尝试转换是否会出现“Enter\
  \ value”提示。此外，验证在设备旋转时用户界面显示的信息是否保留。\n\n### 37.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定的步骤，并演示单向、双向和监听器绑定表达式的使用。本章还提供了一个实用示例，展示了通过结合\
  \ `LiveData` 使用数据绑定连接用户界面视图与应用的后端数据和逻辑时，可以节省多少代码编写。\n\n### 38. Android ViewModel\
  \ 状态状态保存教程\n\n应用状态的保护和恢复是指在应用置于后台后，为用户提供外观和行为的连续性。用户期望从一个应用切换到另一个应用，并在返回原始应用时，发现它仍处于切换之前的完全状态。\n\
  \n\n\n\n\n正如“理解 Android 应用和 Activity 生命周期”章节概述的，当用户将应用置于后台时，如果资源受限，该应用将获得被操作系统终止的资格。当用户尝试将已终止的应用带回前台时，Android\
  \ 会在一个新进程中重新启动该应用。由于这一过程对用户是完全不可见的，因此应用有责任将自己恢复到最初置于后台时所的状态，而不是以其“初始启动”状态呈现。对于基于\
  \ ViewModel 的应用，这种行为的很大一部分可以通过 ViewModel Saved State 模块来实现。\n\n### 38.1 理解 ViewModel\
  \ 状态保存\n\n如前面的章节所述，ViewModel 为应用开发带来了许多益处，包括在设备旋转等配置更改发生时恢复 UI 状态。要查看其实效果，请运行 `ViewModelDemo`\
  \ 应用（或者如果你还需要创建项目，请从书籍随附的示例代码下载并加载 `ViewModelDemo_LiveData` 项目到 Android Studio）。\n\
  \n运行后，输入一个美元金额并将其转换为欧元。在同时显示美元和欧元数值的情况下，旋转设备或模拟器，并注意在应用响应方向变化后，这两个值仍然可见。\n\n遗憾的是，这种行为并不延伸到后台应用进程的终止。在应用仍在运行的情况下，点击设备主页键将\
  \ `ViewModelDemo` 应用放入后台，然后打开 Terminal 工具窗口并运行以下命令将其终止（其中 `<package name>` 是你在创建项目时使用的名称，例如\
  \ `com.ebookfrenzy.viewmodeldemo`）：\n\n```\nadb shell am kill <package name>\n```\n\
  \n如果未找到 `adb` 命令，请参考章节“设置 Android Studio 开发环境”中的设置你的 Android Studio 环境的步骤。\n\n一旦应用被终止，返回设备或模拟器，并从启动器中选择该应用（不要在\
  \ Android Studio 内部重新运行应用）。一旦应用出现，它的表现就像刚刚启动一样，最后一次的美元和欧元值都丢失了。然而，从用户的角度来看，该应用是从后台恢复的，本应该仍然包含原始数据。在这种情况下，该应用未能提供用户对\
  \ Android 应用所期望的连续性。\n\n### 38.2 实现 ViewModel 状态保存\n\n基本的 ViewModel 状态保存通过引入 ViewModel\
  \ Saved State 库成为可能。该库扩展了 `ViewModel` 类，以支持在后台进程终止及随后的重新启动期间维护状态。\n\n保存状态的关键是 `SavedStateHandle`\
  \ 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射（key-value map），允许通过引用相应的键来保存和恢复数据值。\n\
  \n为了支持状态保存，需要声明不同类型的 ViewModel 子类，情况下包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，可以通过在创建时包含\
  \ `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑以下来自标准 ViewModel 声明的代码片段：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \nimport androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n.\n\n.\n\n}\n```\n\n创建此类类实例的代码可能如下：\n\n```java\nprivate MainViewModel\
  \ mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，设计用于支持保存状态的 ViewModel 子类需要按如下方式声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\n\nimport androidx.lifecycle.ViewModel;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \nimport androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  \n.\n\n.\n}\n```\n\n当创建上述 ViewModel 的实例时，必须如下所示向 `ViewModelProvider` 类初始化器传递 `SavedStateViewModelFactory`\
  \ 实例：\n\n```java\nSavedStateViewModelFactory factory =\n    new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n###\
  \ 38.3 保存和恢复状态\n\n可以从 ViewModel 内部保存对象或值，只需将其传递给 `SavedStateHandle` 实例的 `set()`\
  \ 方法，并提供在执行检索时要引用的键字符串：\n\n```java\nprivate static final String NAME_KEY = \"Customer\
  \ Name\";\n\nsavedStateHandle.set(NAME_KEY, customerName);\n```\n\n当与 `LiveData`\
  \ 对象配合使用时，可以使用 `SavedStateHandle` 实例的 `getLiveData()` 方法恢复之前保存的值，再次按所示引用相应的键：\n\n\
  ```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通（非 LiveData）对象，请使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n- `contains(String key)` - 返回一个布尔值，表示保存的状态是否包含指定键的值。\n- `remove(String\
  \ key)` - 从保存状态中移除该值和键。返回被移除的值。\n- `keys()` - 返回保存状态中所有键的集合。\n\n### 38.4 为 ViewModelDemo\
  \ 项目添加状态支持\n\n在涵盖了 ViewModel 状态保存的基础后，可以扩展 `ViewModelDemo` 应用以包含这种支持。首先在 Android\
  \ Studio 中加载在 Jetpack LiveData 教程](#LiveData_Tutorial.xhtml__idTextAnchor781)中创建的\
  \ `ViewModelDemo_LiveData` 项目（示例代码也有该项目）。\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接收并存储\
  \ `SavedStateHandle` 实例。同时，导入 `androidx.lifecycle.SavedStateHandle`，声明一个键常量，并修改结果\
  \ LiveData 变量，使其现在从构造函数中的保存状态获取：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \nimport androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n    private static final String RESULT_KEY = \"Euro Value\";\n\n\
  \    private static final Float rate = 0.74F;\n\n    private String dollarText =\
  \ \"\";\n\n    final private SavedStateHandle savedStateHandle;\n\n    final private\
  \ MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n     \
  \   result = savedStateHandle.getLiveData(RESULT_KEY);\n    }\n\n.\n\n.\n}\n```\n\
  \n留在 `MainViewModel.java` 文件中，修改 `setAmount()` 方法，以便在每次计算新的欧元金额时包含保存结果值的代码：\n\n\
  ```java\npublic void setAmount(String value) {\n    this.dollarText = value;\n \
  \   result.setValue(Float.valueOf(dollarText)* rate);\n    Float convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成对 ViewModel\
  \ 的更改后，打开 `FirstFragment.java` 文件进行以下更改，以便在创建 ViewModel 时包含 Saved State 工厂实例：\n\n\
  .\n\n.\n\n\n\n\n\n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\
  \n@Override\npublic void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n            new SavedStateViewModelFactory(\n\
  \                    getActivity().getApplication(),this);\n    mViewModel = new\
  \ ViewModelProvider(this, factory).get(MainViewModel.class);\n    // TODO: Use the\
  \ ViewModel\n}\n```\n\n当屏幕 UI 填充了美元和欧元数值后，将应用置于后台，使用 `adb` 工具将其终止，然后从设备或模拟器屏幕上重新启动它。重启后，之前的货币金额仍然显示在\
  \ `TextView` 和 `EditText` 组件中，这证明了状态已成功保存并恢复。\n\n## 38.5 总结 (Summary)\n\n一个设计良好的应用程序在从后台回到前台时，应该始终向用户呈现相同的状态，无论操作系统在此期间是否终止了包含应用程序的进程。在处理\
  \ `ViewModels` 时，可以通过利用 `ViewModel` Saved State 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受一个\
  \ `SavedStateHandle` 实例，该实例反过来可以通过一系列方法调用来保存和恢复数据值。当创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用程序将在后台终止期间自动保存并恢复状态。\n\n## 39. 与 Android 生命周期感知组件一起 (Working with\
  \ Android Lifecycle-Aware Components)\n\n前面的章节 “理解 Android 应用程序和 Activity 生命周期周期”\
  \ 描述了如何使用生命周期方法来跟踪活动 或 fragment 等 UI 控制器内部生命周期状态的变化。这些方法的主要问题之一是它们将处理生命周期变化的负担交给了\
  \ UI 控制器。从表面上看，这似乎是符合逻辑的方法，因为 UI 控制器毕竟是经历状态变化的对象。但事实是，受状态变化影响的代码通常位于应用中的其他类。这导致\
  \ UI 控制器中出现了复杂的代码，需要响应生命周期状态的变化来管理和操作其他对象。遵循 Android 架构指南时，最好避免这种情况。\n\n更清晰、更有逻辑的方法是让应用对象能够观察其他对象的生命周期状态，并负责根据变化采取任何必要的行动。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命周期状态，并在控制器进入暂停状态时挂起位置更新。当控制器进入恢复状态时，重新开始跟踪。这是通过 Android 架构组件包含的 `Lifecycle`\
  \ 包所提供的类和接口实现的。\n\n本章将引入使生命周期感知构建到 Android 应用中的术语和关键组件。\n\n### 39.1 生命周期感知 (Lifecycle\
  \ Awareness)\n\n如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则认为它是生命周期感知的。某些 Android 组件（以 `LiveData`\
  \ 为例）已经是生命周期感知。\n\n### 39.2 生命周期所有者 (Lifecycle Owners)\n\n生命周期所有者是拥有 `Lifecycle`\
  \ 对象的组件。大多数 Android 组件（如 `activity` 和 `fragment`）都实现了 `LifecycleOwner` 接口。\n\n```java\n\
  public class SampleOwner implements LifecycleOwner {\n    private LifecycleRegistry\
  \ lifecycleRegistry;\n\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n\n    @NonNull\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n\n    public void resuming() {\n        lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  \    }\n\n    public void handleEvent(Event event) {\n        lifecycleRegistry.handleEvent(event);\n\
  \    }\n}\n```\n\n### 39.3 生命周期观察者 (Lifecycle Observers)\n\n为了观察生命周期所有者的状态，生命周期感知组件必须实现\
  \ `DefaultObserver` 接口，并覆盖它需要观察的任何生命周期事件方法。\n\n```java\npublic class SampleObserver\
  \ implements DefaultObserver {\n    // 生命周期事件方法\n}\n```\n\n然后创建此观察者类的实例并将其添加到 `Lifecycle`\
  \ 对象的列表中：\n\n```java\ngetLifecycle().addObserver(new SampleObserver());\n```\n\n\
  ### 39.4 生命周期状态和事件 (Lifecycle States and Events)\n\n当生命周期所有者的状态变化时，分配的 `Lifecycle`\
  \ 对象将用新状态进行更新。在任何时刻，生命周期所有者都处于以下状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n- `Lifecycle.State.CREATED`\n\
  - `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n- `Lifecycle.State.DESTROYED`\n\
  \n当组件在不同状态之间转换时，`Lifecycle` 对象将对列表中添加的任何观察者触发事件。在生命周期观察者内部可以覆盖以下事件方法：\n\n- `onCreate()`\n\
  - `onResume()`\n- `onPause()`\n- `onStop()`\n- `onStart()`\n- `onDestroy()`\n\n\
  ## 39.5 总结 (Summary)\n\n本章介绍了生命周期感知的基础知识，以及 Android Jetpack 包含的 Android `Lifecycle`\
  \ 包中的类和接口。\n\n\n\n\n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括生命周期观察者（observers）和所有者（owners）的创建，以及生命周期状态变化和事件的处理。\n\
  \n# 40. Android Jetpack 生命周期感知教程\n\n上一章概述了生命周期感知，并列了在 Android 应用项目中实现此点的关键类和接口。本章将在此知识基础的基础上，通过构建一个\
  \ Android Studio 项目来突出生命周期感知的实际应用。\n\n## 40.1 创建示例生命周期项目\n\n从欢迎界面选择 `New Project`\
  \ 快速启动选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `LifecycleDemo`，并指定 `com.ebookfrenzy.lifecycledemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum\
  \ API level` 设置为 `API 26: Android 8.0 (Oreo)`并将 `Language` 菜单设置为 `Java`。\n\n## 40.2\
  \ 创建生命周期观察者\n\n正如之前讨论的，Activity 和 Fragment 实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中这一点，本教程的下一步是向项目添加新类，该类能够观察\
  \ `MainActivity` 实例。\n\n要添加新类，在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，从结果列表中选择\
  \ `New` -> `Java Class...`。在 `New Class` 对话框中，将类命名为 `DemoObserver` 并按键盘 `Return`\
  \ 创建 `DemoObserver.java` 文件。新文件应会自动在编辑器中打开，其内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \npublic class DemoObserver {\n\n}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `DefaultLifecycleObserver`\
  \ 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n\n}\n```\n\n\
  下一步是重写 `DefaultLifecycleObserver` 类的生命周期方法。对于此示例，所有事件都将被处理，每个事件都会向 Logcat 面板输出显示事件类型的消息。按照以下列表更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  \n.\n.\n\npublic class DemoObserver implements DefaultLifecycleObserver {\n\n  \
  \  private String LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void\
  \ onCreate(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\"\
  );\n    }\n\n    @Override\n    public void onResume(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onResume\");\n    }\n\n    @Override\n    public void\
  \ onPause(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onPause\");\n\
  \    }\n\n    @Override\n    public void onStart(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStart\");\n    }\n\n    @Override\n    public void\
  \ onStop(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStop\");\n\
  \    }\n\n    @Override\n    public void onDestroy(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onDestroy\");\n    }\n}\n```\n\n完成 `DemoObserver`\
  \ 类后，下一步是将其作为观察者添加到 `MainActivity` 类中。\n\n## 40.3 添加观察者\n\n观察者通过调用所有者的 `Lifecycle`\
  \ 对象的 `addObserver()` 方法添加到生命周期所有者中，该对象的引用通过调用 `getLifecycle()` 方法获取。编辑 `MainActivity.java`\
  \ 类文件并编辑 `onCreate()` 方法以添加观察者：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n.\n.\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n观察者类被创建并添加到生命周期所有者的 `Lifecycle` 对象后，应用已准备好进行测试。\n\n\
  ## 40.4 测试观察者\n\n由于 `DemoObserver` 类向 Logcat 控制台输出诊断信息，因此如果配置了过滤器仅显示 `DemoObserver`\
  \ 消息，将更容易看到输出。使用之前在“通过示例 Android Activity 状态变化”中概述的步骤，显示 Logcat 面板并在过滤器字段中输入以下键：\n\
  \n`package:mine tag:DemoObserver`\n\n应用成功启动后，Logcat 输出应指示：\n`onCreate`\n`onResume`\n\
  \n在应用运行时，执行设备旋转以触发 Activity 的销毁和重建，生成以下内容：\n`onPause`\n`onDestroy`\n`onCreate`\n\
  `onResume`\n\n## 40.5 创建生命周期所有者\n\n本章的最后一个任务是创建一个自定义生命周期所有者并演示如何触发事件。在 Project 窗口中点击\
  \ `app` -> `java` -> `com.ebookfrenzy.lifecycledemo` 并选择 `New` -> `Java Class...`\
  \ 选项。在 `Class` 对话框中将类命名为 `DemoOwner`。将 `DemoOwner.java` 文件加载到编辑器后，对其进行如下修改：\n\n\
  ```java\npackage ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.Lifecycle;\n\
  import androidx.lifecycle.LifecycleOwner;\nimport androidx.lifecycle.LifecycleRegistry;\n\
  import androidx.annotation.NonNull;\n\npublic class DemoOwner implements LifecycleOwner\
  \ {\n\n}\n```\n\n该类需要一个使用自身初始化的 `LifecycleRegistry` 实例，以及一个返回 `LifecycleRegistry`\
  \ 实例的 `getLifecycle()` 方法。声明一个存储 `LifecycleRegistry` 的变量以及初始化它的构造函数：\n\n```java\n\
  public class DemoOwner implements LifecycleOwner {\n    private final LifecycleRegistry\
  \ lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry = new\
  \ LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public Lifecycle\
  \ getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\n接下来，类必须通知注册表生命周期状态的变化。可以使用\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，或使用 `handleLifecycleEvent()` 方法触发生命周期事件。自定义类中什么构成状态变化取决于类的用途。对于此示例，我们将添加一些在调用时触发生命周期事件的方法：\n\
  \n```java\n.\n.\nprivate final LifecycleRegistry lifecycleRegistry;\n\n.\n.\n  \
  \  public void startOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  \    }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n}\n```\n\n`DemoOwner` 类中的最后一个更改是将 `DemoObserver`\
  \ 类作为观察者添加。该调用将通过向类构造函数添加以下内容来实现：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n\n\n\n将 `MainActivity.java` 文件加载到代码编辑器中，找到 `onCreate()` 方法，并添加代码创建 `DemoOwner`\
  \ 类的实例并调用 `startOwner()` 和 `stopOwner()` 方法。请注意，已删除了添加 `DemoObserver` 作为观察者的调用。虽然一个观察者可以用于多个所有者，但在例中将其删除是为了避免在\
  \ `Logcat` 工具窗口中出现重复且混乱的输出：\n\n```java\nprivate DemoOwner demoOwner;\n\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n    demoOwner = new DemoOwner();\n\
  \    demoOwner.startOwner();\n    demoOwner.stopOwner();\n}\n```\n\n### 40.6 测试自定义生命周期所有\n\
  \n最后一次构建并运行应用，参考 `Logcat` 工具窗口，并确认观察者按照以下顺序检测到创建、启动和停止生命周期事件：\n\n- `onCreate`\n\
  - `onStart`\n- `onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，但“已创建”状态的变化仍被触发了。这些是在所有者实例首次创建以及处理\
  \ `ON_STOP` 事件时自动触发的。\n\n### 40.7 总结\n\n本章提供了在 Android 应用中实现生命周期感知的实际演示，包括创建生命周期观察者以及设计和实现一个基础生命周期所有者类。\n\
  \n### 41. 导航架构组件概览\n\n如今，很少有 Android 应用仅由单个屏幕组成。事实上，大多数应用包含多个屏幕，用户通过屏幕手势、按钮点击和菜单选择在这些屏幕之间导航。在\
  \ Android Jetpack 引入之前，在应用内实现导航主要是一个手动编码过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着 Android\
  \ 导航架构组件的引入以及 Android Studio 对导航图的支持，这种情况得到了显著改善。\n\n### 41.1 理解导航\n\n每个应用都有一个在应用启动并在任何启动页出现后显示的首页（启动页是应用加载时临时显示的应用品牌界面）。用户通常从这个主屏幕执行任务，导致其他屏幕出现。这些屏幕通常以应用内其他\
  \ activity 和 fragment 的形式存在。例如，一个消息应用可能有一个列出当前消息的首页，用户可以从那里导航到另一个屏幕以访问联系人列表或设置屏幕。联系人列表屏幕可能会允许用户导航到其他屏幕，在其中可以添加新用户或更新现有联系人。从图上来说，应用的导航图可以像图\
  \ 41-1 所示所示：\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 41-1\n\n构成应用的每个屏幕（包括首页）统称为目的地（destination），通常是一个\
  \ fragment 或 activity。Android 导航架构使用导航栈（navigation stack）来跟踪用户在应用内目的地之间的路径。当应用首次启动时，首页是第一个被放入栈中的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地并推入栈中首页之上。当用户导航到其他屏幕时，它们也会被推入栈。例如，图\
  \ 41-2 显示了假设的消息应用在用户启动应用并导航到“添加联系人”屏幕后的导航栈当前状态：\n\n![](img/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 41-2\n\n当用户使用系统返回键通过屏幕返回导航时，每个目的地都会从栈中弹出，直到首页再次成为栈上的唯一目的地。在图 41-3 中，用户已从“添加联系人”屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 41-3\n\n在目的地之间导航和管理导航栈涉及的所有工作都由导航控制器处理，由\
  \ `NavController` 类表示。\n\n使用导航架构组件为 Android 项目添加导航是一个简单直接的过程，涉及导航宿主（navigation host）、导航图（navigation\
  \ graph）、导航动作（navigation actions）以及极少的代码编写，以获取并与导航控制器实例交互。\n\n### 41.2 声明导航宿主\n\n\
  导航宿主是一个嵌入到 activity 用户界面布局中的特殊 fragment（`NavHostFragment`），作为用户将导航的目的地的占位符。例如，图\
  \ 41-4 显示了一个典型的 activity 屏幕并突出显示了由导航宿主 fragment 代表的区域：\n\n![](img/jetpack_navigation_navhost.jpg)\n\
  \n图 41-4\n\n`NavHostFragment` 可以通过 Android Studio 布局编辑器中从调色板的容器部分拖放实例，或者通过以下方式手动编辑\
  \ XML 放入 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/container\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"@+id/demo_host_fragment\"\
  \n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\n      \
  \  android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\
  \n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿主 fragment 元素中的注意点是 `name` 属性对 `NavHostFragment`\
  \ 的引用、将 `defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity\
  \ 启动时，此导航宿主 fragment 被导航图中指定的首页替换。当用户在应用屏幕间导航时，宿主 fragment 将被目的地的相应 fragment 替换。\n\
  \n### 41.3 导航图\n\n导航图是一个包含应用导航中目的地的 XML 文件。除了这些目的地外，文件还包含定义目的地之间导航的导航动作，以及从一个目的地传递到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以通过可视化方式或手动编辑 XML 来设计图并实现动作。\n\n图 41-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 41-5\n\n\n\n\n\n目的地列表\
  \ (A) 列出了图中的所有目的地。从列表中选择一个目的地将定位并选中图中的相应目的地（这对于在大图中的定位特定目的地特别有用）。导航图面板 (B) 包含每个每个目的地的对话框，每个对话框代表用户界面的布局。在示例中，此图包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作连接。通过将鼠标指针悬停在起点边缘直到出现一个圆圈，然后从圆圈点击并拖动到目的地可以添加动作。属性面板\
  \ (D) 允许查看和修改当前所选目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。可以选择将现有片段（fragment）或活动（activity）作为目的地，也可以创建新的空白片段目的地。组件树面板\
  \ (F) 提供了导航图的层级概述。\n\n通过将编辑器切换到代码模式，可以查看和修改导航图的底层 XML。以下 XML 列表表示上述图 41-5 中所示目的地和动作连接的导航图：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/mainFragment\">\n    <fragment\n      android:id=\"\
  @+id/mainFragment\"\n      android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n      android:label=\"fragment_main\"\n      tools:layout=\"@layout/fragment_main\"\
  \ >\n      <action\n          android:id=\"@+id/mainToSecond\"\n          app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n    <fragment\n      android:id=\"@+id/secondFragment\"\
  \n      android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n      android:label=\"\
  fragment_second\"\n      tools:layout=\"@layout/fragment_second\" >\n    </fragment>\n\
  </navigation>\n```\n\n导航图也可以拆分到多个文件中，以改进组织结构并促进重用。当这样结构化时，嵌套图会被嵌入到根图中。要创建嵌套图，按住\
  \ Shift 键点击要嵌套的目的地，在第一个目的地上右键点击并选择 `Move to Nested Graph -> New Graph`（移动到嵌套图 ->\
  \ 新图）菜单选项。嵌套图将作为图中的新节点出现。双击嵌套图节点可将图文件加载到编辑器中以访问该嵌套图。\n\n### 41.4 访问导航控制器 (Navigation\
  \ Controller)\n\n从一个目的地导航到另一个目的地通常是响应应用内的某个事件，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，以下代码可以访问传入的导航控制器。注意，为了使代码生效，活动必须包含一个导航宿片段（navigation\
  \ host fragment）：\n\n```\nNavController controller = Navigation.findNavController(activity,\
  \ R.id.demo_nav_host_fragment);\n```\n\n在这种情况下，方法调用传递了该的引用以及嵌入活动布局中的 `NavHostFragment`\
  \ 的 ID。\n\n另一种，可以通过将该视图传递给方法来标识与任何视图关联的导航控制器：\n\n```\nNavController controller =\
  \ Navigation.findNavController(binding.button);\n```\n\n最后一种选项通过调用 `NavHostFragment`\
  \ 类的 `findNavController()` 方法查找片段的导航控制器，并传递片段的引用：\n\n```\nNavController controller\
  \ = NavHostFragment.findNavController(fragment);\n```\n\n### 41.5 触发导航动作\n\n一旦找到导航控制器，可以通过调用控制器的\
  \ `navigate()` 方法并传递要执行的动作的资源 ID 来触发导航动作。例如：\n\n```\ncontroller.navigate(R.id.goToContactsList);\n\
  ```\n\n当选定动作连接时，动作的 ID 在导航图编辑器的属性面板中定义。\n\n### 41.6 传递参数\n\n在导航动作期间，可以使用导航图文件中声明的参数将数据从一个目的地传递到另一个目的地。一个参数由名称、类型和可选的默认值组成。例如，在图\
  \ 41-6 中，声明了一个名为 `contactsCount` 的整数参数，默认值为 0：一旦添加，参数将放置在接收目的地的 XML 元素中：\n\n```xml\n\
  <fragment\n  android:id=\"@+id/secondFragment\"\n  android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n  android:label=\"fragment_second\"\n  tools:layout=\"@layout/fragment_second\"\
  \ >\n  <argument\n      android:name=\"contactsCount\"\n      android:defaultValue=\"\
  0\"\n      app:type=\"integer\" />\n</fragment>\n```\n\n导航组件提供了两种在目的地之间传递数据的技术。一种方法是将数据放入一个\
  \ `Bundle` 对象中，该对象在动作期间传递给目的地，然后在那里进行解包（unbundled）并提取参数。\n\n这种方法的主要缺点是它不是“类型安全的（type\
  \ safe）”。换句话说，如果接收目的地处理参数的类型与其声明的类型不同（例如，将字符串视为整数），这种错误不会被编译器捕获，并可能会运行时引发问题。\n\n\
  更好的选项（也是本书使用的方案）是 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它可以自动生成特殊类以便以类型安全的方式传递参数。\n\
  \n### 41.7 总结\n\n在 Android 应用用户界面上下文中，导航是指用户在不同屏幕之间来回的能力。曾经实现导航非常耗时且难以组织，现在 Android\
  \ Studio 和导航架构组件使得在 Android 应用项目中实现和管理导航变得更加容易。\n\n应用中的不同屏幕被称为目的地，通常由片段（fragment）或活动（activity）表示。所有应用都有主目的地，包括应用首次加载时显示的屏幕。此布局的内容区域会被一个导航宿片段取代，当用户导航应用时，它会被其他片段片段。导航路径由导航图文件定义，图中包含目的地以及连接它们的动作，以及目的地之间传递的任何参数。导航由导航控制器处理，控制器除了管理导航栈外，还提供了从应用代码内部启动导航动作的方法。\n\
  \n\n\n\n上一章描述了 Android Jetpack Navigation 组件以及它如何与 Android Studio 的导航图表功能集成，从而为在\
  \ Android 应用屏幕之间实现导航提供方便的方法。在本章中，将创建一个新的 Android Studio 项目，该项目将使用这些导航功能来实现包含多个屏幕的示例应用。除了演示\
  \ Android Studio 导航图编辑器的用法外，示例项目还将实现使用类型安全的参数在源屏幕和目标屏幕之间传递数据。\n\n## 42.1 创建 NavigationDemo\
  \ 项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单改为 `Java`。\n\n## 42.2 向构建配置中添加导航\n\n新的 `Empty Views Activity` 项目默认不在构建配置文件中包含\
  \ Navigation 组件库。下一步是向构建配置中添加导航库。首先编辑 `Gradle Scripts -> libs.version.toml` 文件并对其进行如下修改（请注意现在可能有该库的更新版本）：\n\
  \n```toml\n[versions]\n...\nnavigationFragment = \"2.7.7\"\n\n[libraries]\n...\n\
  androidx-navigation-fragment = { group = \"androidx.navigation\", name = \"navigation-fragment\"\
  , version.ref = \"navigationFragment\" }\n```\n\n接下来，打开 `Gradle Scripts -> build.gradle.kts\
  \ (Module :app)` 文件，并在 `dependencies` 部分添加以下指令。同时，借此机会为该模块启用 view binding（视图绑定）：\n\
  \n```kotlin\nandroid {\n    buildFeatures {\n        viewBinding = true\n    }\n\
  }\n\ndependencies {\n    implementation(libs.androidx.navigation.fragment)\n}\n\
  ```\n\n在文件中添加导航依赖后，点击 `Sync Now` 链接以重新同步项目的构建配置。\n\n## 42.3 创建导航图资源文件\n\n在构建配置中添加了导航库后，现在可以将导航图资源文件添加到项目中了。正如\
  \ “导航架构组件概述” 所述，这是一个 XML 文件，包含用户可以导航的片段（fragments）和活动（activities），以及执行转换的动作和在目标地之间传递的任何数据。\n\
  \n在 `Project` 工具窗口中，找到 `res` 文件夹（`app -> res`），右键点击它并选择 `New -> Android Resource\
  \ File` 菜单选项：\n\n![](img/as_new_resource_file_menu.jpg)\n图 42-1\n\n选择菜单项后，将出现 `New\
  \ Resource File` 对话框。在此对话框中，将文件命名为 `navigation_graph`，并将 `Resource type` 菜单更改为 `Navigation`（如图\
  \ 42-2](#Navigation_Tutorial.xhtml__idTextAnchor861 所示），然后点击 `OK` 按钮创建文件。\n\n![](img/as_new_resource_file.jpg)\n\
  图 42-2\n\n将导航图资源文件添加到项目后，它将出现在主面板中，准备好添加新目标。将编辑器切换到 `Code` 模式，并在添加任何目标之前检查图表的 XML：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n</navigation>\n```\n\n在编辑器内切换回 `Design`\
  \ 模式，注意 `Destinations` 面板的 `Host` 部分显示项目内未检测到任何导航主机片段（navigation host fragments）：\n\
  \n![](img/as_navigation_hosts_no_fragments.jpg)\n图 42-3\n\n在向导航图添加任何目标之前，下一步是向项目添加一个导航主机片段。\n\
  \n## 42.4 声明导航主机\n\n对于此项目，导航主机片段将包含在主活动的用户界面布局中。首先，在 `Project` 工具窗口中找到主活动布局文件（`app\
  \ -> res -> layout -> activity_main.xml`），将其加载到布局编辑器工具中，并删除默认的 `TextView` 组件。\n\n\
  在布局编辑器处于 `Design` 模式时，从 `Palette` 面板的 `Containers` 部分拖动 `NavHostFragment` 元素并将其释放到活动布局的容器区域，如图\
  \ 42-4](#Navigation_Tutorial.xhtml__idTextAnchor863) 中的箭头所示：\n\n![](img/as_navigation_add_navhostfragment.jpg)\n\
  图 42-4\n\n从弹出的 `Navigation Graphs` 对话框中选择上一节创建的 `navigation_graph.xml` 文件，并点击 `OK`\
  \ 按钮。\n\n在布局中选中新添加的 `NavHostFragment` 实例，使用 `Attributes` 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`，然后点击\
  \ `Infer constraints`（推断约束）按钮。\n\n将布局编辑器切换到 `Code` 模式并检查 XML 文件。注意编辑器正确配置了 `navigation\
  \ graph` 属性以引用 `navigation_graph`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"@+id/demo_nav_host_fragment\"\
  \n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\n      \
  \  android:layout_width=\"409dp\"\n        android:layout_height=\"729dp\"\n   \
  \     app:defaultNavHost=\"true\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        app:navGraph=\"\
  @navigation/graph\" />\n\n</androidx.constraintlayout.ConstraintLayout>\n```\n\n\
  返回 `navigation_graph.xml` 文件，确认已检测到 `Host` 实例（可能需要关闭并重新打开文件）：\n\n![](img/as_navigation_hosts_added.jpg)\n\
  图 42-5\n\n## 42.5 添加导航目标\n\n在导航图中，现在是时候添加第一个目标了。点击图 42-6](#Navigation_Tutorial.xhtml__idTextAnchor865）所示的\
  \ `new destination` 按钮来选择或创建目标：\n\n![](img/as_navigation_add_navhostfragment_menu.jpg)\n\
  图 42-6\n\n接下来，从菜单中选择 `Create new destination` 选项。在对话框中选择 `Fragment (Blank)` 模板，将新片段命名为\
  \ `FirstFragment`，布局命名为 `fragment_first`，然后点击 `Finish` 按钮。等待项目重新构建后，新片段将作为目标出现在图中，如图\
  \ 42-7](#Navigation_Tutorial.xhtml__idTextAnchor866）所示：\n\n![](img/as_navigation_fragment_added.jpg)\n\
  图 42-7\n\n目标节点上方的小图标表示它是起始目标。这意味着当 `NavHostFragment` 活动创建时，该目标将是第一个显示的。要将起始目标更改为另一个，可以在图中选中该节点并点击工具栏上的主页按钮。\n\
  \n通过将编辑器切换到 `Code` 模式检查导航图的 XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\">\n</navigation>\n```\n\
  \n\n\n\n\n```xml\n<xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"\
  @+id/navigation_graph\"\n    app:startDestination=\"@id/firstFragment\">\n\n   \
  \ <fragment\n        android:id=\"@+id/firstFragment\"\n        android:name=\"\
  com.ebookfrenzy.navigationdemo.FirstFragment\"\n        android:label=\"fragment_first\"\
  \n        tools:layout=\"@layout/fragment_first\" />\n</navigation>\n```\n\n在执行任何导航之前，导航图至少还需要另一个目标地。重复上述步骤，添加一个名为\
  \ `SecondFragment` 的片段，其布局文件命名为 `fragment_second`。新片段将作为图中的另一个目标地显示，如图 42-8 所示：\n\
  \n![](img/as_navigation_two_fragments.jpg)\n\n图 42-8\n\n## 42.6 设计目标片段布局\n\n在添加用于在目的地之间跳转的动作（actions）之前，现在是为图中的两个目标片段添加一些用户界面组件的好时机。首先，双击\
  \ `firstFragment` 目标，使 `fragment_first.xml` 文件加载到布局编辑器中，然后选择并删除默认的 `TextView` 实例。在组件树（Component\
  \ Tree）面板中，右键点击 `FrameLayout` 项并选择 `Convert from FrameLayout to ConstraintLayout`\
  \ 菜单选项，在生成的转换对话框中接受默认设置：\n\n![](img/as_navigation_convert_to_constraint_layout.jpg)\n\
  \n图 42-9\n\n使用属性（Attributes）工具窗口，将 `ConstraintLayout` 的 ID 更改为 `constraintLayout`，然后将\
  \ `Button` 和 `Plain Text EditText` 控件拖到布局中，使其看起来像下方图 42-10 所示：\n\n![](img/as_navigation_first_fragment_ui.jpg)\n\
  \n图 42-10\n\n一旦视图位置正确正确，点击工具栏上的 `Infer constraints`（推断约束）按钮为布局添加任何缺失的约束。选择 `EditText`\
  \ 视图，并使用属性工具窗口删除默认的“Name”文本，并将控件的 ID 更改为 `userText`。接下来，将按钮文本属性更改为“Navigate”，并将其提取为字符串资源。\n\
  \n返回 `navigation_graph.xml` 文件并双击 `secondFragment` 目标，将 `fragment_second.xml` 文件加载到布局编辑器中。选择并删除默认的\
  \ `TextView` 实例，并重复上述步骤将 `FrameLayout` 转换为 `ConstraintLayout`，将 id 更改为 `constraintLayout2`。接下来，拖入一个新的\
  \ `TextView` 控件将其放置在布局中心，并点击 `Infer constraints` 按钮添加任何缺失的约束。选中新的 `TextView` 后，使用属性面板将\
  \ ID 更改为 `argText`。\n\n## 42.7 为导航图添加动作\n\n现在两个目标已已到图中，并且相应的用户界面布局也已设计完成，项目需要一种方法让用户能够从第一个片段导航到第二个片段。这通过向图添加一个动作来实现，之后可以在应用代码中引用它。\n\
  \n要建立一个以第一个片段为起点、第二个片段为目的地的动作连接，打开导航图，并将鼠标指针悬停在 `firstFragment` 目标右边缘的垂直中心位置，此时会出现一个高亮的圆，如图\
  \ 42-11 所示：\n\n![](img/as_navigation_first_fragment_selected.jpg)\n\n图 42-11\n\n\
  在圆内点击并将生成的连线拖动到 `secondFragment` 目标：\n\n![](img/as_navigation_add_connection.jpg)\n\
  \n图 42-12\n\n释放连线以建立起点和目的地之间的动作连接，此时连线将变为箭头，如图 42-13 所示：\n\n![](img/as_navigation_connected.jpg)\n\
  \n图 42-13\n\n可以随时通过选择动作连接并按下键盘上的 Delete 键来删除它。选中箭头后，检查属性工具窗口中的可用属性，并将 ID 更改为 `mainToSecond`。这是代码中引用该动作的\
  \ ID。将编辑器切换到代码（Code）模式，注意动作现在已包含在 XML 中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/firstFragment\">\n    <fragment\n        android:id=\"\
  @+id/firstFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\
  \n        android:label=\"fragment_first\"\n        tools:layout=\"@layout/fragment_first\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n## 42.8 实现 OnFragmentListener\n\n在添加触发动作的代码之前，`MainActivity`\
  \ 类必须实现 `OnFragmentListener`。该接口是在在导航图中创建空白片段时生成的。为了实现片段与活动之间的通信，活动需要一个 `onFragmentInteraction()`\
  \ 方法。\n\n编辑 `MainActivity.java` 文件，使其内容如下：\n\n```java\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentListener\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @ void\n    public void onInteraction(( uri))\n    }\n}\n``` 如果 `OnFragmentListener`\
  \ 未定义（某些版本会自动添加，其他则不会），请编辑 `SecondFragment.java` 文件并添加以下内容：\n\n```java\nimport android.net.Uri;\n\
  \npublic interface OnFragmentListener {\n    // TODO: Update argument type and name\n\
  \    void onFragmentInteraction(Uri uri);\n}\n```\n\n  42.9 为目标片段添加 Binding\n\n\
  由于我们需要访问片段中的某些视图，必须修改当前代码以启用视图绑定。首先通过编辑 `FirstFragment.java` 文件进行以下更改：\n\n```java\n\
  import com.ebookfrenzy.navigationdemo.databinding.FragmentFirstBinding;\n\npublic\
  \ class FirstFragment extends Fragment {\n    private FragmentFirstBinding binding;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container,\n            @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.fragment_first, container, false);\n\
  \        binding = FragmentFirstBinding.inflate(inflater, container, false);\n \
  \       return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，引用 `FragmentSecondBinding`。\n\n## 42.10 触发动作\n\n\
  \n\n\n既然动作（action）已添加到导航图中，下一步是在第一个片段（fragment）中添加一些代码，以便在 `Button` 小部件被点击时触发该动作。找到\
  \ `FirstFragment.java` 文件，将其加载到代码编辑器，并重写 `onViewCreated()` 方法以获取按钮实例的引用，并配置一个 `OnClickListener`\
  \ 实例以便在用户点击按钮时进行调用：\n\n```java\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\n\
  import android.widget.Button;\nimport androidx.navigation.Navigation;\n\npublic\
  \ class FirstFragment extends Fragment {\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        binding.button.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ view) {\n                Navigation.findNavController(view).navigate(\n      \
  \                  R.id.mainToSecond);\n            }\n        });\n    }\n}\n```\n\
  \n上述代码获取了导航控制器的引用并在该实例上调用了 `navigate()` 方法，将导航动作的资源 ID 作为参数传递通过。\n\n编译并运行应用，验证点击第一个片段中的按钮是否会跳转到第二个片段。\n\
  \n作为这种设置监听器方法的替代方案，`Navigation` 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目的地。因此，可以使用以下单行代码实现相同：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  \                R.id.mainToSecond, null));\n```\n\n## 42.11 使用 Safeargs 传递数据\n\n\
  下一个目标是将第一个片段中 `EditText` 视图中输入的文本传递到第二个片段，并在那里将其显示在 `TextView` 小部件上。正如前一节所述，Android\
  \ 导航组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\n使用 `safeargs` 的第一步是向 Gradle 构建配置中添加 `safeargs`\
  \ 插件。使用 Project 工具窗口，找到并编辑 `Gradle Scripts -> libs.versions.toml` 文件，如下所示：\n\n```toml\n\
  [libraries]\nandroidx-navigation-safe-args-gradle-plugin = { module = \"androidx.navigation:navigation-safe-args-gradle-plugin\"\
  , version.ref = \"navigationFragment\" }\n```\n\n接下来，编辑项目级 `build.gradle.kts` 文件（`Gradle\
  \ Scripts -> build.gradle.kts (Project: NavigationDemo)`），按所示添加插件依赖：\n\n```kotlin\n\
  // 顶层构建文件，可以在其中添加适用于所有子项目/模块的通用配置选项。\nbuildscript {\n    dependencies {\n      \
  \  classpath(libs.androidx.navigation.safe.args.gradle.plugin)\n    }\n}\n```\n\n\
  接着，编辑模块级 `build.gradle.kts` 文件（`Gradle Scripts -> build.gradle.kts (Module :app)`），按所示应用该插件并重新同步项目：\n\
  \n```kotlin\nplugins {\n    alias(libs.plugins.androidApplication)\n    id (\"androidx.navigation.safeargs\"\
  )\n}\n```\n\n下一步是定义目的地将接收的任何参数，在本例中，目的地是第二个片段。编辑导航图，选择 `secondFragment` 目的地，并在 Attributes\
  \ 工具窗口中找到 `Arguments` 部分。点击 `+` 按钮（如[图 42-14]所示）向目的地添加一个新参数：\n\n![](img/as_navigation_add_arguments.jpg)\n\
  图 42-14\n\n点击 `+` 按钮后，会出现对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，在默认值字段中输入\
  \ `No Message`，并点击 `Add`。\n\n![](img/as_navigation_dialog.jpg)\n图 42-15\n\n新配置的参数将如下出现在\
  \ `navigation_graph.xml` 中：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\
  \n    android:name=\"com.example.navigationdemo.SecondFragment\"\n    android:label=\"\
  Second Fragment\"\n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n\
  \        android:name=\"message\"\n        app:argType=\"string\"\n        android.defaultValue=\"\
  No Message\" />\n</fragment>\n```\n\n下一步是向 `FirstFragment.java` 添加代码从 `EditText`\
  \ 中提取文本并将其传递给第二个片段。当项目构建时，`safeargs` 插件将生成：\n\n- `FirstFragmentDirections`: 此类表示导航动作的起点（使用起点的类名并在末尾附加\
  \ `Directions` 来命名），并提供对动作的访问。\n- `ActionToSecond`: 代表执行跳转时用动作的类（根据导航图中分配给动作的 ID\
  \ 命名，并带有 `Action` 前缀）。该类为目的地上配置的每个参数都包含一个 setter 方法。例如，由于第二个片段包含一个名为 `message` 的参数，该类包含一个名为\
  \ `setMessage()` 的方法。一旦配置完成，将该类的实例传递给导航控制器的 `navigate()` 方法以导航到目的地。\n- `SecondFragmentArgs`:\
  \ 在目的地中用于访问从起点传递的参数的类（使用目的地的类名并在末尾附加 `Args` 来命名）。该类为传递到目的地的每个参数包含一个 getter 方法（即\
  \ `getMessage()`）。\n\n使用这些类，可以修改 `FirstFragment.java` 中 `onViewCreated()` 方法的 `OnClickListener`\
  \ 代码，以提取 `EditText` 中的当前文本，将其应用动作并启动到第二个片段的跳转：\n\n```java\nbinding.button.setOnClickListener(view1\
  \ -> {\n    FirstFragmentDirections.MainToSecond action =\n            FirstFragmentDirections.mainToSecond();\n\
  \    action.setMessage(binding.userText.getText().toString());\n    Navigation.findNavController(view1).navigate(action);\n\
  });\n```\n\n上述代码获取了动作对象的引用，使用 `setMessage()` 方法设置消息字符串，然后调用导航控制器的 `navigate()` 方法并传递动作对象。如果\
  \ Android Studio 报告 `FirstFragmentDirections` 未定义，请使用 `Build -> Make Project` 菜单重新构建项目。\n\
  \n剩下的工作是修改 `SecondFragment.java` 类文件，在执行跳转后接收参数并将其显示在 `TextView` 小部件上。对于本示例，实现这些任务的代码将使用\
  \ `onStart()` 生命周期方法添加。编辑 `SecondFragment.java` 文件并添加该方法，如下所示：\n\n```java\n@Override\n\
  public void onStart() {\n    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.argText.setText(message);\n\
  }\n```\n\n\n\n上述方法中的代码首先获取 `TextView` 部件的引用。接着，调用 `SecondFragmentArgs` 类的 `fromBundle()`\
  \ 方法来提取从源位置接收到的 `SecondFragmentArgs` 对象。由于此示例中的参数在 `navigation_graph.xml` 文件中命名为\
  \ `message`，因此在 `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。然后，将该字符串显示在 `TextView`\
  \ 部件上。\n\n编译并运行应用，在点击 `Button` 部件之前输入一些文本。当第二个片段目的地出现时，`TextView` 应该显示在第一个片段中输入的文本，这表明数据已在导航目的地之间成功传递。\n\
  \n# 42.12 总结\n\n本章提供了一个使用导航架构组件（Navigation Architecture Component）和 Android Studio\
  \ 导航图编辑器实现 Android 应用导航的实用示例。涵盖的主题包括：创建包含现有和新目的地片段的导航图、在 Activity 布局中嵌入导航主机片段（navigation\
  \ host fragment）、编写触发导航事件的代码，以及使用 `safeargs` 插件在目的地之间传递参数。\n\n## 43. MotionLayout\
  \ 简介\n\n`MotionLayout` 类为用户界面布局的视图添加动画效果提供了一种简单的方法。本章将首先提供 `MotionLayout` 的概述，并介绍\
  \ `MotionScenes`（运动场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在涵盖这些基础之后，接下来的章（标题为\
  \ Android MotionLayout 编辑教程 和 MotionLayout 关键循环教程）将通过创建示例项目，提供 `MotionLayout` 动画的更多细节和示例。\n\
  \n## 43.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是使布局内视图从一个状态到另一个状态的过渡动画。例如，`MotionLayout`\
  \ 可以控制 `ImageView` 实例在指定时间内从屏幕的左上角移动到右下角。除了视图的位置，其他属性的变化也可以制作动画，例如颜色、大小或旋转角度。这些状态变化也可以进行插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间直线执行，也可以实现为遵循由起点和终点之间不同位置中间点的路径。`MotionLayout` 还支持使用触摸和滑动来启动和控制动画。\n\
  \n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写代码。这些 XML 声明可以在 Android Studio 代码编辑器中手动实现、使用\
  \ `MotionLayout` 编辑器进行视觉化实现，或者结合这两种方法实现。\n\n## 43.2 MotionLayout\n\n在实现动画时，用户界面中通常使用的\
  \ `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（此任务可以通过在布局编辑器中右键点击 `ConstraintLayout`\
  \ 并选择 `Convert to MotionLayout` 选项来实现）。`MotionLayout` 还需要版本 2.0.0 版本的 `ConstraintLayout`\
  \ 库。\n\n意外的是，由于它是 `ConstraintLayout` 的子类，`MotionLayout` 支持 `ConstraintLayout` 的所有布局功能。因此，当使用\
  \ `MotionLayout` 处理不需要动画的视图时，可以类似地设计用户界面布局。\n\n对于需要制作动画的视图，声明了两个 `ConstraintSets`，定义视图在动画开始和结束时的外观和位置。`transition`\
  \ 声明定义了关键帧，用于在这些开始和结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理程序。\n\n开始和结束的 `ConstraintSets`\
  \ 以及 `transitions` 声明在 `MotionScene` XML 文件中。\n\n## 43.3 MotionScene\n\n正如我们在前面的章节中看到的，XML\
  \ 布局文件包含配置呈现给用户的静态视图的外观和布局行为所需的必要信息，在使用 `MotionLayout` 时也是如此。对于非静态视图（换句话说，即要制作动画的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在一个单独的\
  \ XML 文件，称为 `MotionScene` 文件（之所以这样命名，是因为所有声明都定义在一个 `MotionScene` 元素内）。该文件被导入到布局\
  \ XML 文件中，包含开始和结束的 `ConstraintSets` 以及 `Transition` 声明（单个文件可以包含多个 `ConstraintSet`\
  \ 对和 `Transition` 声明，允许将不同的动画针对用户界面布局中的特定视图）。\n\n以下列表显示了 `MotionScene` 文件的模板：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上面的 XML 中，声明了命名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），此时，它们尚未包含任何元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画的起点和终点，并包含一个准备填充动画关键帧的 `KeyFrameSet` 元素。`Transition`\
  \ 元素还包含一个毫秒 `duration` 属性来控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的运动。可以让开始和结束集合在屏幕上处于相同位置，然后使用过渡对其他属性变化（如缩放和旋转）制作动画。\n\
  \n`ConstraintSets` 并不意味着视图的运动。例如，可以让开始和结束集合在屏幕上处于相同位置，然后使用过渡对其他属性变化（如缩放和旋转）制作动画。\n\
  \n## 43.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将全套 `ConstraintLayout`\
  \ 设置应用于定位、尺寸以及与父布局和其他视图的关系。此外，以下属性也可以包含 `ConstraintSet` 声明中：\n\n- `alpha`\n- `visibility`\n\
  - `elevation`\n- `rotation`\n- `rotationX`\n- `rotationY`\n- `translationX`\n- `translationY`\n\
  - `translationZ`\n- `scaleX`\n- `scaleY`\n\n例如，为了在动画期间旋转视图 180 度，可以在开始和结束约束中声明以下内容：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        ...\n\
  \        motion:layout_constraintStart_toStartOf=\"parent\"\n        android:rotation=\"\
  0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet android:id=\"@+id/end\"\
  >\n    <Constraint\n        ...\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout`，视图将从 0 度开始，然后在动画期间旋转完整的 180 度，最后以倒置状态停止。\n\n# 43.5\
  \ 自定义属性\n\n\n\n\n\n除了上述列出的标准属性外，还可以指定一系列自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上提供的几乎任何属性都可以指定为自定义属性以包含在动画中。要识别属性的名称，请从目标视图类的文档中找到\
  \ getter/setter 名称，移除 `get`/`set` 前缀，并将剩余字符的第一个字母转为小写。例如，为了在代码中更改 `Button` 视图的背景颜色，我们可能如下所示调用\
  \ `setBackgroundColor()` setter 方法：\n\n```java\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n当在约束集（constraint set）或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，值还必须使用以下选项列表中的类型类型声明：\n\
  \n- `motion:customBoolean` - 布尔属性值。\n- `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension`\
  \ - 维度属性值。\n- `motion:customFloatValue` - 浮点属性值。\n- `motion:customIntegerValue`\
  \ - 整数属性值。\n- `motion:customStringValue` - 字符串属性值\n\n例如，颜色设置需要使用 `customColorValue`\
  \ 类型进行赋值：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\
  \n    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，以下摘自 `MotionScene` 文件的片段除了将背景颜色从绿色更改为红色外，还为视图声明了起始和结束约束：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\" >\n       \
  \ <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n     \
  \       motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n### 43.6 触发动画\n\n如果没有某些事件告诉 `MotionLayout` 开始动画，`MotionScene` 文件中的任何设置都将影响布局（视图将根据起始\
  \ `ConstraintSet` 中的设置进行定位外）。\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动（`OnSwipe`）手势来启动。`OnClick`\
  \ 处理器会导致动画启动并运行到完成，而 `OnSwipe` 则将同步动画，使其沿时间轴往复移动以匹配触摸动作。`OnSwipe` 处理器还会响应“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理器还提供了选项，用于配置动画如何响应不同方向的拖拽，以及滑动锚定在目标视图的哪一边。这允许例如，向左的动作使视图向相应方向移动，同时防止向上动作导致视图向侧移动（除非这确实是需要的）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在这两种情况下，必须指定视图的\
  \ `id`。例如，为了实现一个响应锚定在名为 `button` 的视图底部的向下拖拽的 `OnSwipe` 处理器会将以下 XML 放在 `Transition`\
  \ 元素中：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n\
  或者，为同一个按钮添加一个 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\
  \ motion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，操作已设置为 `toggle` 模式。该模式和其他可用选项可以总结如下：\n\
  \n- `toggle`: 动画化到相反状态。例如，如果视图当前处于过渡起始点，它将过渡到结束点，反之亦然。\n- `jumpToStart`: 立即更改到起始状态，没有动画。\n\
  - `jumpToEnd`: 立即更改到结束状态，没有动画。\n- `transitionToStart`: 带动画地过渡到起始状态。\n- `transitionToEnd`:\
  \ 带动画地过渡到结束状态。\n\n### 43.7 弧线运动\n\n默认情况下，视图位置的移动将在起点和终点之间沿直线通过。要将运动更改为弧形路径，在起始约束内如下所示使用\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧形是向内还是向外：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n</ConstraintSet>\n```\n\n图 43-1 展示了 `startVertical` 和 `startHorizontal`\
  \ 弧线与直线运动的对比。\n\n### 43.8 关键帧\n\n目前所有的 `ConstraintSet` 属性都适用于动画的起始和结束点。换句话说，如果旋转属性在结束点设置为\
  \ 180°，那么旋转将在动画开始时并在到达终点时完成。因此，无法配置旋转在动画进行到 50% 处达到完全 180°，然后在结束时回到原始方向。幸运的是，这种效果可以使用关键帧实现。\n\
  \n关键帧用于定义动画过程中发生状态更改的中间点。例如，可以声明关键帧，使视图的背景颜色在动画进行 50% 处过渡到蓝色，在 75% 处变为绿色，然后在动画结束时回到原始颜色。关键帧实现在\
  \ `MotionScene` 文件的 `Transition` 元素中，并嵌入到 `KeyFrameSet` 元素中。\n\n`MotionLayout` 支持几种类型的\
  \ `Key`，可以总结如下：\n\n#### 43.8.1 属性关键帧\n\n属性关键帧（使用 `KeyAttribute` 声明）允许在动画时间轴的中间点更改视图属性。`KeyAttribute`\
  \ 支持上述 `ConstraintSets` 中列出的属性，并结合指定更改在动画时间轴何时生效的能力。例如，以下关键帧声明将逐渐使 `button` 视图在水平（`scaleX`）和垂直（`scaleY`）方向上翻倍，在时间轴的\
  \ 50% 处达到最大尺寸。在时间轴剩余时间内，视图将缩小到原始尺寸：\n\n\n\n\n\n## 43.8.2 位置关键帧\n\n位置关键帧（`KeyPosition`）修改视图在起始位置和结束位置之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用任何复杂程度的路径。使用\
  \ `x` 和 `y` 坐标结合过渡时间轴中的对应点来声明位置。坐标必须相对于以下坐标系之一进行声明：\n\n- `parentRelative` - `x`\
  \ 和 `y` 坐标相对于指定坐标的父容器，并以百分比表示（表现为 0.0 到 1.0 之间的值）：\n\n  ![](img/motionlayout_parentRelative.jpg)\n\
  \  图 43-2\n\n- `deltaRelative` - `x` 和 `y` 坐标相对于起始位置和结束位置，而不是相对于父容器。例如，起始点为 (0,\
  \ 0)，结束点为 (1, 1)。请记住，`x` 和 `y` 坐标可以为负值：\n\n  ![](img/motionlayout_deltaRelative.jpg)\n\
  \  图 43-3\n\n- `pathRelative` - `x` 和 `y` 坐标相对于路径，其中起始点和结束点之间的直线用作图表的 X 轴。同样，坐标以百分比（0.0\
  \ 到 1.0）表示。这与 `deltaRelative` 坐标空间相似，但考虑了路径的角度。同样，坐标可能可能是负的：\n\n  ![](img/motionlayout_pathRelative.jpg)\n\
  \  图 43-4\n\n例如，下面的 `ConstraintSets` 声明了设备屏幕两侧的起始点和结束点。默认情况下，使用这些点的视图过渡将跨越屏幕沿直线移动，如图\
  \ 43-5 所示：\n\n  ![](img/motionlayout_straight_path.jpg)\n  图 43-5\n\n但是，假设视图需要遵循下方图\
  \ 43-6 所示的路径：\n\n  ![](img/motionlayout_wave_path.jpg)\n  图 43-6\n\n为了实现这一点，可以在过渡中如下声明关键帧帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n上述元素使用 `pathRelative`\
  \ 坐标系在路径的 25% 和 75% 处创建了关键帧位置点。第一个位置位于坐标 (0.25, 0.3)，第二个位置位于 (0.75, -0.3)。这些位置关键帧可以可视化为如下方图\
  \ 43-7 所示：\n\n  ![](img/motionlayout_curve_path.jpg)\n  图 43-7\n\n## 43.9 时间线性\n\
  \n在没有额外设置的情况下，上述概述动画将以恒定速度执行。要改变动画速度（例如，使其先加速后减速），可以在 `ConstraintSet` 或 `Keyframe`\
  \ 中使用过渡缓动属性（`transitionEasing`）。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔曲线上绘制点来定义线性度，例如：\n\n```xml\n\
  motion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"360\"\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下\
  \ URL 中的在线曲线生成器：[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\n然而，对于大多数需求，可以使用内置的\
  \ `accelerate` 和 `decelerate` 值来指定缓动：\n\n```xml\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nmotion:transitionEasing=\"decelerate\"\nandroid:rotation=\"360\"\n```\n\
  \n## 43.10 关键触发器 (KeyTrigger)\n\n触发器关键帧（`KeyTrigger`）允许在动画到达动画内的指定帧位置时调用视图上的方法。这还考虑了动画的方向。例如，可以根据动画是正向运行还是反向运行来调用不同的方法。考虑一个按钮在动画移动超过时间轴的\
  \ 20% 时变为可见。`KeyTrigger` 将通过 `onCross` 属性在 `Transition` 元素的 `KeyFrame` 中如下实现：\n\n\
  ```xml\n<KeyFrame>\n    <KeyTrigger\n        motion:framePosition=\"20\"\n     \
  \   onCross=\"show\"/>\n</KeyFrame>\n```\n\n同样，如果当动画反向并低于 10% 时隐藏同一个按钮，可以使用 `onCross`\
  \ 属性添加第二个关键触发器：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n    onCross=\"\
  hide\"/>\n```\n\n如果动画使用切换操作，使用 `onCross` 属性：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"\
  10\"\n    onCross=\"show\"/>\n```\n\n## 43.11 循环与时间循环关键帧\n\n虽然位置关键帧可以用于向动画中添加中间状态变化，但如果需要实现大量的重复位置变化，这将变得非常麻烦。对于需要以预测的变化执行状态变化的情况，`MotionLayout`\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧。MotionLayout 循环章节将详细介绍此主题。\n\n## 43.12 从代码启动动画\n\
  \n到目前为止，我们只查看了使用 `OnSwipe` 和 `OnClick` 处理器控制动画。也可以通过调用 `MotionLayout` 实例的方法从代码启动动画。例如，下面的代码为名为\
  \ `motionLayout` 的布局以 2000ms 的持续运行从到结束的过渡：\n\n```java\nmotionLayout.setTransitionDuration(2000);\n\
  motionLayout.transitionToEnd();\n```\n\n在没有额外设置的情况下，动画使用的起始和结束状态是在 `MotionScene`\
  \ 文件中定义的。要使用特定的起始和结束约束集，在调用 `MotionLayout` 实例的 `setTransition()` 方法时通过 `id` 引用它们：\n\
  \n```java\nmotionLayout.setTransition(R.id.myStart, R.id.myEnd);\nmotionLayout.transitionToEnd();\n\
  ```\n\n要在动画运行时监控其状态，如下为 `MotionLayout` 实例添加过渡监听器：\n\n```java\nmotionLayout.setTransitionListener(transitionListener);\n\
  MotionLayout.TransitionListener transitionListener =\n    new MotionLayout.TransitionListener()\
  \ {\n        @Override\n        public void onTransitionStarted(MotionLayout motionLayout,\
  \ int startId, int endId) {\n            // 过渡开始时调用\n        }\n        @Override\n\
  \        public void onTransitionChange(MotionLayout motionLayout, int startId,\
  \ int endId, float progress) {\n            // 每次属性更改时调用\n            // 跟踪进度值以找到当前位置\n\
  \        }\n        @Override\n        public void onTransitionCompleted(MotionLayout\
  \ motionLayout, int currentId) {\n            // 过渡完成时调用\n        }\n        @Override\n\
  \        public void onTransitionTrigger(MotionLayout motionLayout, int triggerId,\
  \ boolean positive, float progress) {\n        }\n    };\n```\n\n\n\n\n```java\n\
  // 当跨越触发关键帧阈值时调用\n\n}\n};\n```\n\n# 43.13 总结\n\n`MotionLayout` 是 `ConstraintLayout`\
  \ 的子类，专门用于为用户界面布局中的视图添加动画效果。`MotionLayout` 的工作原理是通过对视图在由 `start` 和 `end` 约束集定义的两个状态之间的转换进行动画。可以使用关键帧（keyframes）在这些起始和结束点之间添加额外的动画效果。\n\
  \n动画可以通过 `OnClick` 或 `OnSwipe` 处理器触发，也可以通过对 `MotionLayout` 实例的方法调用进行程序化触发。\n\n#\
  \ 44. Android MotionLayout 编辑器教程\n\n现在已经涵盖了 `MotionLayout` 的基础知识，本章将提供一个在示例项目中尝试\
  \ `MotionLayout` 的机会。除了继续探索 `MotionLayout` 的主要功能外，本章还将介绍 `MotionLayout` 编辑器，并探索如何使用视觉化方式构建和修改\
  \ `MotionLayout` 动画。\n\n本章创建的项目将使用 `start` 和 `end` `ConstraintSets`、手势处理器，以及 `Attribute`（属性）和\
  \ `Position`（位置）关键帧。\n\n## 44.1 创建 MotionLayoutDemo 项目\n\n点击欢迎界面上的 `New Project`\
  \ 按钮，在弹出的新项目对话框中选择 `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `MotionLayoutDemo`\
  \ 并指定 `com.ebookfrenzy.motionlayoutdemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置为 `API 26`: Android 8.0 (Oreo)，并将 `Language` 菜单设置为 `Java`。\n\n## 44.2 ConstraintLayout\
  \ 转换为 MotionLayout\n\nAndroid Studio 已经在 `activity_main.xml` 布局文件中放置了一个 `ConstraintLayout`\
  \ 容器作为父视图。下一步一步是将该容器转换为 `MotionLayout` 实例。在 `Component Tree`（组件树）中，右键点击 `ConstraintLayout`\
  \ 条目，并选择 `Convert to MotionLayout` 菜单选项：\n\n![](img/as_convert_to_motionlayout.jpg)\n\
  \n图 44-1\n\n选择后，点击确认对话框中的 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android Studio\
  \ 的主窗口中，如图图 44-2 所示：\n\n![](img/as_motionlayout_editor.jpg)\n\n图 44-2\n\n作为转换过程的一部分，Android\
  \ Studio 将创建一个名为 `res -> xml` 的新文件夹并在其中放置一个名为 `activity_main_scene.xml` 的 `MotionLayout`\
  \ 场景文件：\n\n![](img/as_motionlayout_scene_file.jpg)\n\n图 44-3\n\n该文件包含一个顶层 `MotionScene`\
  \ 元素，其中包含定义主布局内动画的 `ConstraintSet` 和 `Transition` 条目。默认情况下，该文件将包含起始和结束约束集的空元素以及一个初始转换：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在 `MotionLayout` 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件以便在 `MotionLayout` 编辑器之外实现和修改动画设置。\n\
  \n在本教程中，动画将主要使用 `MotionLayout` 编辑器界面实现。然而，我们将在每个阶段回顾这些更改是如何反映在底层的 `MotionScene`\
  \ 文件中的。随着本章的进行，你会发现 `MotionScene` 的 XML 语法简单且易于学习。\n\n本教程的第一阶段将演示如何使用 `MotionLayout`\
  \ 为 `Button` 对象制作动画，包括运动（包括遵循路径）、旋转和尺寸缩放。\n\n## 44.3 配置起始和结束约束\n\n当 `activity_main.xml`\
  \ 文件加载到 `MotionLayout` 编辑器中时，确保选中了 `Motion Layout` 框（在下方图 44-5 中标记为 `E`），然后在删除默认的\
  \ `TextView` 之前，从调色板将 `Button` 视图拖动到布局画布的左上角，如图图 44-4 所示：\n\n![](img/as_motionlayout_button.jpg)\n\
  \n图 44-4\n\n选中按钮后，使用 `Attributes` 工具窗口将 `id` 更改为 `myButton`。\n\n如上一章所述，`MotionLayout`\
  \ 动画主要是指定视图如何在两个状态之间转换的用例。因此，实现动画的第一步是指定定义这些状态的约束。\n\n对于此示例，起始点将是布局视图的顶部中央。要配置这些约束，请在编辑器中选择\
  \ `start` 集条目（在图 44-5 中标记为 `A`）：\n\n![](img/as_motionlayout_editor.jpg)\n\n图 44-5\n\
  \n当选中 `start` 框时，所有的布局更改都将应用于 `start` 集。要返回布局的标准约束，点击 `Motion Layout` 框（`E`）。接下来，选择\
  \ `ConstraintSet` 中的 `myButton` 条目（`B`）。注意文件显示按钮基于布局定位的。相反，我们希望在 `start` 集上定位。选中\
  \ `myButton` 后，点击 `Edit`（`C`）并选择 `Constraint`。\n\n`start` 集必须将按钮位于布局顶部，偏移 `8dp`。选中\
  \ `myButton` 后，使用 `Attributes` 窗口设置视图的 `top` 和 `right` 端：\n\n![](img/as_layout_editor.jpg)\n\
  \n图 44-6\n\n选择 `end` 集条目（在图 44-5 中标记为 `D`），重复步骤创建一个新的约束，这次将按钮放在布局的水平中央，距离底部边缘 `8dp`：\n\
  \n![](img/as_layout_constraint.jpg)\n\n图 44-7\n\n配置好 `start` 和 `end` 约束后，打开 `activity_main_scene.xml`\
  \ 文件并注意约束已添加到文件中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"\
  http://schemas.android.com/apk/res-auto\">\n    <ConstraintSet android:id=\"@+id/start\"\
  >\n        <Constraint\n            android:id=\"@+id/myButton\"\n            android:layout_width=\"\
  wrap_content\"\n            android:layout_height=\"wrap_content\"\n           \
  \ motion:layout_constraintTop_toTopOf=\"parent\"\n            android:layout_marginTop=\"\
  8dp\"\n            motion:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n \
  \   <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\"\n         \
  \   motion:layout_constraintBottom_toBottomOf=\"parent\"\n            android:layout_marginBottom=\"\
  8dp\" />\n    </ConstraintSet>\n</MotionScene>\n```\n\n\n\n\n\n请注意，`Transition`\
  \ 元素已经预配置为为在 1000 毫秒内执行起点和终点之间的过渡动画。虽然我们尚未添加用于触发过渡的动作，但在 `MotionLayout` 编辑器内部预览动画仍然是可能的。\n\
  \n## 44.4 预览 MotionLayout 动画\n\n要在不构建和运行应用的情况下预览动画，请选择 `MotionLayout` 编辑器中下方 图 44-9\
  \ 标记为 A 的过渡箭头。这将显示动画时间轴面板（标记为 B）：\n\n![](img/as_motionlayout_test_animation.jpg)\n\
  \n图 44-9\n\n要测试动画，请点击滑块 (C) 并沿着时间轴拖动。随着滑块移动，布局画布上的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮 (E) 执行完整动画，以便以不同的速度连续重复动画（向前、向后或来回切换）。\n\
  \n## 44.5 添加 OnClick 点击手势\n\n虽然已经创建了简单的 `MotionLayout` 动画过渡，但我们仍然需要一种方法从运行的应用内部启动动画。这可以通过分配点击或滑动处理程序来实现。在本示例中，我们将配置动画在用户点击按钮时启动。在\
  \ `MotionLayout` 编辑器中，如果时间轴动画在循环设置下运行，请先暂停它。接下来，选择过渡箭头（如上方 图 44-9 中标记的 A），在属性（Attributes）工具窗口找到\
  \ `OnClick` 属性部分，并点击下方 图 44-10 中箭头所示的 `+` 按钮：\n\n![](img/as_motionlayout_add_onclick.jpg)\n\
  \n图 44-10\n\n`OnClick` 面板将为第一个属性出现一个空行。对于属性名，输入 `targetId`；对于值字段，输入按钮的 id (`@id/myButton`）。在下一个空行中，在属性名字段中输入\
  \ `app:clickAction`。在值字段中，点击向下箭头显示有效选项的菜单：\n\n![](img/as_motionlayout_onclick_toggle.jpg)\n\
  \n图 44-11\n\n在本示例中，选择切换动作（toggle action）。这将导致视图在点击时动画到相反的位置。一旦输入了这些设置，它们应该与 图 44-12\
  \ 所示的内容匹配：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\n图 44-12\n\n再次打开\
  \ `activity_main_scene.xml` 文件并检查 `Transition` 条目中定义的 `OnClick` 属性：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/myButton\"\n          motion:clickAction=\"\
  toggle\" />\n</Transition>\n```\n\n在设备或模拟器上编译并运行应用，确认点击按钮会导致它在 `MotionScene` 文件定义的起点和终点之间来回过渡。\n\
  \n## 44.6 为过渡添加属性关键帧\n\n到目前为止，示例项目仅在动画按钮视图从屏幕上一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，用于指定过渡时间轴内其他属性发生变化的点。例如，可以定义\
  \ `KeyAttribute`，使得视图在移动通过时间轴的 30% 时，其尺寸必须增加了 50%。在本示例中，我们将在动画的中点处添加旋转效果。\n\n首先，在\
  \ `MotionLayout` 编辑器中打开 `activity_main.xml` 文件，选择过渡连接箭头以显示时间轴，然后点击 图 44-13 中高亮显示的按钮：\n\
  \n![](img/as_motionlayout_add_keyframe.jpg)\n\n图 44-13\n\n从菜单中，选择 `KeyAttribute`\
  \ 选项：\n\n![](img/as_motionlayout_add_key_attribute.jpg)\n\n图 44-14\n\n一旦选择，将出现 图\
  \ 44-15 所示的对话框。在对话框中，确保选择了 ID 选项并引用了 `myButton`。在位置字段中，输入 50（这是一个百分比值，0 是起点，100\
  \ 是终点）。最后，在属性下拉菜单中选择旋转（rotation）项，然后点击 `Add` 按钮：\n\n![](img/as_motionlayout_create_attribute.jpg)\n\
  \n图 44-15\n\n一旦添加了 `KeyAttribute`，时间轴上会出现一行。点击该行将其高亮显示，然后点击远边缘的折叠箭头以展开属性。注意时间轴上出现了一个小的菱形标记，指示了关键帧的位置。在这种情况下，按钮将稳定旋转到指定的数字，并在关键帧处达到最大旋转。图表显示了效果的线性。\n\
  \n![](img/as_motionlayout_timeline.jpg)\n\n图 44-16\n\n要更改 `KeyAttribute` 的属性，在时间轴上选择它并参考属性窗口。在\
  \ `KeyAttribute` 面板中，将旋转属性更改为 360：\n\n![](img/as_motionlayout_change_attribute.jpg)\n\
  \n图 44-17\n\n通过来回移动滑块检查属性是否生效。参考 `activity_main_scene.xml`，它显示如下：\n\n```xml\n<Transition\n\
  \    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@id/start\"\
  \n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n    \
  \        motion:motionTarget=\"@+id/myButton\"\n            motion:framePosition=\"\
  50\"\n            android:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick\
  \ motion:targetId=\"@id/myButton\"\n          motion:clickAction=\"toggle\" />\n\
  </Transition>\n```\n\n使用过渡滑块或通过编译运行应用测试动画，验证现在现在旋转。\n\n## 44.7 为过渡添加 CustomAttribute\n\
  \n`KeyAttribute` 属性限于调整大小和旋转等内置效果。声明 `CustomAttributes` 也可以实现更改。与存储在 `Transition`\
  \ 元素中的 `KeyAttributes` 不同，`CustomAttributes` 位于起点和终点约束集中。因此，这些属性只能被声明在起点和终点处生效（也就是说，你无法在时间轴的中间位置指定属性关键帧）。\n\
  \n在本示例中，我们将配置按钮颜色从红色逐渐变为绿色。首先，选择 图 44-18 中标记为 A 的起始框，然后选择 `myButton` 视图约束集 (B)：\n\
  \n![](img/as_motionlayout_custom_attr.jpg)\n\n图 44-18\n\n参考属性工具窗口，点击下方所示 `CustomAttributes`\
  \ 部分的 `+` 按钮：\n\n![](img/as_motionlayout_add_custom_attribute.jpg)\n\n图 44-19\n\n\
  在生成的对话框（图 44-20）中，将属性类型更改为 `Color` 并在属性名称字段中输入 `backgroundColor`。最后，将值设置为 `#F80A1F`：\n\
  \n![](img/as_motionlayout_custom_attribute_dialog.jpg)\n\n图 44-20\n\n\n\n\n点击 OK\
  \ 提交更改，然后选择结束约束集（如上方图 44-18 中标记为 C 的部分），并重复步骤以添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB 值。\n\
  \n使用时间轴滑块或运行应用程序，确保按钮在动画过程中颜色发生了变化。\n\n这些 `CustomAttributes` 的添加将反映在 `activity_main_scene.xml`\
  \ 文件中，如下：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint>\n\
  \        <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n\
  \            motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint>\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n```\n\n## 44.8 添加位置关键帧\n\n本教程的最后一个任务是在动画路径上添加两个位置关键帧（`KeyPosition`），以为动画引入一些横向移动。在\
  \ `MotionLayout` 编辑器中显示过渡时间轴的情况下，点击按钮如上方图 44-13 所示的高亮创建一个关键帧，并从菜单中选择 `KeyPosition`\
  \ 选项，如下方的图 44-21 所示：\n\n![](img/as_motionlayout_keyposition_menu.jpg)\n图 44-21\n\
  \n在弹出的对话框中，按照图 44-22 所示设置属性：\n\n![](img/as_motionlayout_create_keyposition.jpg)\n\
  图 44-22\n\n点击 `Add` 按钮提交更改，然后重复上述步骤添加配置如下的第二个位置关键帧：\n\n* Position (位置): 75\n* Type\
  \ (类型): `parentRelative`\n* PercentX: 0.85\n* PercentY: 0.75\n\n完成这些更改后，`activity_main_scene.xml`\
  \ 文件中的 `transition` 元素将添加了以下关键帧项：\n\n```xml\n<KeyFrameSet>\n    <KeyPosition\n \
  \       motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"25\"\
  \n        motion:keyPositionType=\"parentRelative\"\n        motion:percentX=\"\
  0.15\"\n        motion:percentY=\"0.25\" />\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"75\"\n        motion:keyPositionType=\"\
  parentRelative\"\n        motion:percentX=\"0.85\"\n        motion:percentY=\"0.75\"\
  \ />\n</KeyFrameSet>\n```\n\n最后一次测试应用程序，验证按钮现在遵循下方所示路径，同时仍在旋转并改变颜色：\n\n![](img/as_motionlayout_path_1.jpg)\n\
  图 44-23\n\n位置关键帧由预览画布中代表运动路径的虚线上的菱形标记表示，如图 44-24 所示（如果标记不可见，请确保在预览中选中了 `Button`\
  \ ）：\n\n![](img/as_motionlayout_path_2.jpg)\n图 44-24\n\n要从视觉上调整关键帧的位置，点击标记并将其拖到新位置。随着标记移动，`Motion\
  \ Layout` 编辑器将显示网格以及当前的 x 和 y 坐标：\n\n![](img/as_motionlayout_path_3.jpg)\n图 44-25\n\
  \n## 44.9 总结\n\n本章介绍了 Android Studio 内置的 `MotionLayout` 编辑器，并探索了如何使用它在无需手动编写 XML\
  \ 的情况下为 Android 应用程序的用户界面添加动画。本章涵盖的示例包括 `ConstraintLayout` 转换为 `MotionLayout`、在\
  \ `MotionScene` 文件中创建开始和结束约束集，以及添加 `OnClick` Handler。还涵盖了动画预览、自定义属性和位置关键帧。\n\n##\
  \ 45. MotionLayout 关键循环 (KeyCycle)\n\n之前的章节介绍并演示了如何使用 `MotionLayout` 容器结合 Android\
  \ Studio `MotionLayout` 编辑器的功能，将动画集成到 Android 用户界面中的概念。名为 MotionLayout 简介的章节简要提到了循环（`KeyCycle`）和时间循环（`KeyTimeCycle`）关键帧，并解释了如何使用它们来实现大量状态变化的动画。本章将更详细地介绍关键帧，然后在使用\
  \ Android Studio 和编辑器示例中演示如何创建它们。\n\n### 45.1 循环关键帧概述\n\n位置关键帧可以为动画时间轴添加中间状态变化。虽然这对于少数量的状态变化效果良好，但要实现大量变化则会非常繁琐。例如，为了让按钮在被点击时抖动\
  \ 50 次以指示错误，将涉及手动创建 100 个位置关键帧来执行顺时针和反时针旋转。同样，在视图跨越屏幕时实现弹跳效果也同样耗时。\n\n对于需要重复执行状态变化的情况，`MotionLayout`\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧。两者执行相同的任务，只是 `KeyCycle` 帧是基于动画路径内的帧位置，而 `KeyCycles`\
  \ 是基于时间的（每秒）。\n\n使用这些 `KeyCycle` 帧，动画时间轴实际上被分为若干部分（称为循环），每个循环包含一个或多个定义如何修改视图属性的波。创建\
  \ `KeyCycle` 时需要以下信息：\n\n* target: 将进行更改的视图 ID。\n* frame position: 循环开始的时间轴位置。\n\
  * wave period: 循环中包含的波数量。\n* attribute: 波修改的视图属性。\n* wave offset: 循环相对于关键帧基准的指定偏移。\n\
  * wave shape: 波的形状（`sin`、`cos`、`sawtooth`、`triangle`、`bounce`）。\n\n考虑以下关键帧集：\n\n\
  ```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"0\"\n     \
  \   motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n     \
  \   motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"25\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"50\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"100\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"50dp\"/>\n</KeyFrameSet>\n\
  ```\n\n上述关键帧集将时间轴分为四个等等的循环。每个循环都配置为包含一个 `sin` 波形，调整按钮的 `translationY` 属性。执行时，此动画将使按钮在指定的范围内多次垂直振荡。此关键帧集可以如图\
  \ 45-1 所示可视化，其中五个点代表关键帧位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n图 45-1\n\n\
  \n\n按照目前的实现，每个周期包含单个波形。假设我们需要在最后一个周期内包含四个波，而不是这些均匀分布的波。这可以通过增加最后一个 `KeyCycle` 元素的\
  \ `wavePeriod` 属性轻松实现，如下：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"75\"\n\
  \    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"4\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\n\
  进行此更改后，帧集可以以波形形式渲染如下：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n图 45-2\n\n\
  到为止，本章中的示例一直使用正波。在 `MotionLayout` 中处理周期关键帧时，还有其他几种波形可用。例如，图 45-3 展示了将所有周期关键帧的 `waveShape`\
  \ 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n图 45-3\n\n除了正波和锯齿波，`MotionLayout`\
  \ 还支持三角波、方形波、弹性波和 `reverseSawtooth` 波形。\n\n在上面的示例中，每个周期都沿 Y 轴在相同范围内移动按钮。但是，假设我们需要第二个周期沿沿正\
  \ Y 轴移动更远的距离。这涉及按如下调整第二个周期的 `waveOffset` 属性：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"\
  25\"\n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\
  \n通过此更改，我们得到了一个类似于 图 45-4 的时间线：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n\
  图 45-4\n\n现在，按钮在第二个周期期间在 Y 轴上的运动范围将在大约 0 到 150dp 之间。如果仍然需要范围的下端与其他波形相匹配，我们当然可以为\
  \ `translationY` 值增加 100dp：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\
  \n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"/>\n```\n\
  \n此更改现在为我们提供了以下波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n图 45-5\n\
  \n## 45.2 使用周期编辑器 (Cycle Editor)\n\n虽然并不复杂，但通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle`\
  \ 条目来获取所需的精确周期配置可能需要一些时间。为了方便，Google 的 Android 工程师开发了 `Cycle Editor`。这个独立的基于 Java\
  \ 的工具尚未成为 Android Studio 的。`Cycle Editor` 允许你视觉化地设计和测试周期关键帧集。\n\n`Cycle Editor`\
  \ 工具是一个 Java 归档文件 (`jar`)，需要在开发系统上安装 Java 运行时。\n\n一旦安装了 Java，可以从以下 URL 下载 `CycleEditor.jar`\
  \ 文件：\n\n[`github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar`](https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar)\n\
  \n下载后，打开命令提示符或终端窗口，切换到 `jar` 文件所在的目录，并运行以下命令：\n\n```\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将显示 图 45-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n图 45-6\n\
  \n上图中标记为 A 的面板显示关键帧集的 XML，可以直接编辑，也可以使用 B 面板中的控制控件进行编辑。\n\n## 45.3 创建 CycleDemo\n\
  \n从欢迎界面选择 `New Project` 选项，并在项目对话框中选择 `Empty Views Activity` 模板。在 `Name` 字段输入 `CycleDemo`\
  \ 并指定 `com.ebook.cycledemo` 为包名。在点击 `Finish` 按钮之前，将 API 级别更改为 API 26 (Oreo) 语言更改为\
  \ Java。\n\n打开布局编辑器和 `activity_main.xml`，右键点击 `ConstraintLayout` 条目并选择 `Convert to\
  \ MotionLayout`：\n\n![](img/as_convert_motionlayout.jpg)\n图 45-7\n\n## 45.4 配置起始和结束约束\n\
  \n本教程旨在实现按钮从屏幕一侧移动到另一侧的动画，包括导致视图沿 Y 轴移动的 `KeyCycle` 效果。第一步是配置起始和结束约束。\n\n使用 `activity_main.xml`\
  \ 文件，选择并删除默认的 `TextView`。在拖放 `Button` 视图之前，确保已选择 图 45-8) 中标记为 E 的 Motion Layout\
  \ 框：\n\n![](img/as_cycle_ui.jpg)\n图 45-8\n\n要配置起始点，选择编辑器中的 `ConstraintSet` 条目（如\
  \ 图 45-9)）：\n\n![](img/as_motionlayout_editor.jpg)\n图 45-9\n\n接下来，选择 `ConstraintSet`\
  \ 列表中的按钮条目 (B)。选中按钮条目后，点击编辑按钮 (C) 并从菜单中选择 `Create Constraint`。在选中按钮的情况下，使用属性窗口为视图的顶部、左侧和底部设置约束：\n\
  \n![](img/as_cycledemo_start_constraints.jpg)\n图 45-10\n\n选择结束约束集条目（如 图 45-9)），并重复步骤创建一个新约束，这次是对按钮的顶部、底部和右边缘：\n\
  \n![](img/as_cycledemo_end_constraints.jpg)\n图 45-11\n\n## 45.5 创建周期 (Cycles)\n\n\
  下一步是使用 `Cycle Editor` 为动画生成周期关键帧。运行 `Cycle Editor` 时，请参考下方 图 45-12 所示的控制面板：\n\n\
  ![](img/as_4.0_keycycle_control_panel_labelled.jpg)\n图 45-12\n\n使用标记为 A 的菜单，将要修改的属性从\
  \ `rotation` 更改为 `translationY`。\n\n接下来，使用 `KeyCycle` 控制 (B) 选择周期 0，这样对面板其他部分的更改将应用于第一个周期。将\
  \ `Period` 滑块移动到 1 并将 `translationY` 滑块移动到 60，如 图 45-13 所示（在移动滑块时参考 XML 面板查看 `translationY`\
  \ 值的精确设置）：\n\n![](img/as_4.0_keycycle_editor_cyclekey_0.jpg)\n图 45-13\n\n\n\n选择\
  \ `File -> Parse XML` 菜单选项查看图表中的更改。参考表 45-1 中列出的值，配置 `KeyFrames` 1 到 4 的设置（注意，你已经配置了\
  \ `KeyCycle 0` 列中的设置）：\n\n|  | KeyCycle 0 | KeyCycle 1 | KeyCycle 2 | KeyCycle 3\
  \ | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position | 0 | 25 | 50\
  \ | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60 | 60 | 150 |\
  \ 60 | 60 |\n\n表 45-1\n\n完成这些更改后，关键帧集 XML 的内容如下：\n\n```xml\n<KeyFrameSet>\n   <KeyCycle\n\
  \      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\n \
  \     motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n   <KeyCycle\n      motion:framePosition=\"\
  25\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"2\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n   <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"150dp\"/>\n   <KeyCycle\n\
  \      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n   <KeyCycle\n      motion:framePosition=\"\
  100\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n</KeyFrameSet>\n```\n\n要查看带有新周期的图表，选择 `File -> Parse XML` 菜单选项以刷新波形模式，它现在应该像图\
  \ 45-14 所示：\n\n![](img/as_4.0_keycycle_editor_keys.jpg)\n图 45-14\n\n### 45.6 预览动画\n\
  \n现在可以从 Cycle Editor 工具内部预览基于循环的动画。点击播放按钮（图 45-15 中标记为 A）启动动画。要将循环与水平移动结合，将第二个菜单\
  \ (B) 从 `Stationary` 改为 `East`。此外，花些时间实验时间和线性度设置（C 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\
  图 45-15\n\n### 45.7 将 KeyFrameSet 添加到 MotionScene\n\n在 Cycle Editor 中，从 XML 面板突出显示并复制\
  \ `KeyCycle` 元素，并将它们粘贴到 Android Studio 中 `res -> xml -> activity_main_scene.xml`\
  \ 文件的 Transition 部分，以便它们置于现有的 `KeyFrameSet` 标记之间。同时注意增加的持续时间以及为了启动动画添加的 `OnClick`\
  \ 处理器：\n\n```xml\n<Transition\n   motion:constraintEnd=\"@+id/end\"\n   motion:constraintStart=\"\
  @id/start\"\n   motion:duration=\"7000\">\n   <KeyFrameSet>\n      <KeyCycle\n \
  \        motion:framePosition=\"0\"\n         motion:motionTarget=\"@+id/button\"\
  \n         motion:wavePeriod=\"1\"\n         motion:waveOffset=\"0dp\"\n       \
  \  motion:waveShape=\"sin\"\n         android:translationY=\"60dp\"/>\n      <KeyCycle\n\
  \         motion:framePosition=\"25\"/>\n   </KeyFrameSet>\n   <OnClick motion:targetId=\"\
  @id/button\"\n      motion:clickAction=\"toggle\" />\n</Transition>\n```\n\n在继续之前，检查每个目标是否已正确声明。在编写时，Cycle\
  \ Editor 仍使用过时的 `motion:target` 标签。例如：`motion:target=\"@+id/button\"`。这需要对五个 `KeyCycle`\
  \ 条目中的每一个更改为：`motion:motionTarget=\"@+id/button\"`\n\n完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮启动并查看动画。注意，可以在\
  \ Android Studio MotionLayout 编辑器中查看 `KeyCycle` 波形形成，如下方的图 45-16 所示：\n\n![](img/as_keycycle_demo_transition.jpg)\n\
  图 45-16\n\n`KeyCycle` 帧集不仅限于每个动画一个。例如，将以下 `KeyFrameSet` 添加到 `activity_main_scene.xml`\
  \ 文件的 Transition 部分，为按钮在移动时添加一些旋转效果：\n\n```xml\n<KeyFrameSet>\n   <KeyCycle\n  \
  \    motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\n   \
  \   motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"45\"/>\n  \
  \ <KeyCycle\n      motion:framePosition=\"25\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"80\"/>\n  \
  \ <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"150dp\"\n      android:rotation=\"45\"/>\n \
  \  <KeyCycle\n      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"80\"/>\n  \
  \ <KeyCycle\n      motion:framePosition=\"100\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n</KeyFrameSet>\n```\n\n\n\n\nMaterial\
  \ 设计（Material design）涵盖了广泛的领域，从推荐的颜色样式到对象的动画方式。可以通过以下链接在网上找到 Material 设计概念和指南的完整描述，它是所有\
  \ Android 开发者的推荐阅读材料：\n\n[`material.io/design/introduction`](https://material.io/design/introduction)\n\
  \n# 46.2 设计库\n\n实现采用 Material 设计原则的 Android 应用所需的许多构建模块都包含 Android 设计支持库（Android\
  \ Design Support Library）中。该库包含一组用户界面组件，这些组件可以包含在 Android 应用中，以实现 Material 设计的大观、感觉和行为。该库中的两个组件——悬浮按钮（floating\
  \ action button）和 `Snackbar` 将在本章介绍，其他组件将在后续章节介绍。\n\n# 46.3 悬浮按钮 (FAB)\n\n悬浮按钮看起来悬浮在应用用户界面的上方。它通常用于促进用户界面中最常见的操作。悬浮按钮可以放置在屏幕上，允许用户向联系人列表添加条目或从应用内发送电子邮件。图\
  \ 46-1 展示了允许用户在标准 Android 联系人应用中添加联系人的悬浮按钮：\n\n![](img/as_contacts_app.jpg)\n\n\
  图 46-1\n\n使用悬浮按钮时应遵循若干 Material 设计指南。悬浮按钮必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40 x 40dp（微型）。按钮在手机上距离屏幕边缘至少\
  \ 16dp，在桌面级设备和平板设备上至少 24dp。无论尺寸如何，按钮必须包含一个大小为 24x24dp 的内部图标，并且建议每个用户界面屏幕只有一个悬浮按钮。\n\
  \n悬浮按钮可以进行动画处理，或者设计为触摸时变形为其他项目。例如，悬浮按钮在被点击时可以旋转，或者变形为另一个元素，例如工具栏或列出相关操作的面板。\n\n\
  # 46.4 Snackbar\n\n`Snackbar` 组件提供了一种以屏幕底部面板的形式向用户展示信息的方式，如图 46-2 所示。`Snackbar`\
  \ 实例包含一条短文本消息和一个可选的操作按钮，该按钮在用户点击时将执行任务。一旦显示，`Snackbar` 将会自动超时消失，也可以可以由用户通过滑动操作手动移除。在\
  \ `Snackbar` 显示期间，应用将继续运行并正常响应用户交互。\n\n![](img/as_snackbar_example.jpg)\n\n图 46-2\n\
  \n在本章的剩余部分，将创建一个示例应用程序，该程序使用悬浮按钮和 `Snackbar` 的基本功能向项目列表添加条目。\n\n# 46.5 创建示例项目\n\n\
  从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择 Basic Views Activity\
  \ 模板。\n\n在“Name”（名称）字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ `API level` 设置更改为 `API 26`：Android 8.0 (Oreo)，并将“Language”（语言）菜单设置为 `Java`。\n\n\
  # 46.6 检查项目\n\n由于选择了 Basic Views Activity 模板，该 Activity 包含四个布局文件。`activity_main.xml`\
