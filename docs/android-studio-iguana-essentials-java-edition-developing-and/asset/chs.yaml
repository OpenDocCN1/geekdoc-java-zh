  \ constraints）工具栏按钮，为布局添加必要的约束：\n\n![](img/as_explicit_intent_return_ui.jpg)\n\n\
  图 55-4\n\n# 55.5 检查应用程序清单文件\n\n为了让 `MainActivity` 能够使用意图（intent）启动 `SecondActivity`，`AndroidManifest.xml`\
  \ 文件中必须存在 `SecondActivity` 的条目。在项目工具窗口（app -> manifests）中找到该文件，双击将其加载到编辑器，并验证 Android\
  \ Studio 是否已自动添加了该应用的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:dataExtractionRules=\"@xml/data_extraction_rules\"\n   \
  \     android:fullBackupContent=\"@xml/backup_rules\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.ExplicitIntent\"\
  \n        tools:targetApi=\"31\">\n        <activity\n            android:name=\"\
  .SecondActivity\"\n            android:exported=\"false\" />\n        <activity\n\
  \            android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n第二个 Activity 已创建并列在清单文件中，现在是时候在 `MainActivity` 类中编写一些代码来发出意图了。\n\n# 55.6\
  \ 创建意图\n\n`MainActivity` 的目标是在用户点击“Send Text”按钮时创建并启动意图。作为意图创建过程的一部分，用户在 `EditText`\
  \ 视图中输入的查询字符串将以键值对的形式添加到意图对象中。当为 `MainActivity` 创建用户界面布局时，按钮对象已配置为在被用户“点击”时调用名为\
  \ `sendText()` 的方法。现在需要将该方法添加到 `MainActivity` 类源文件 `MainActivity.java` 中，如下：\n\n\
  ```java\npackage com.ebookfrenzy.explicitintent;\n\n.\n.\nimport android.content.Intent;\n\
  \n.\n.\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    public\
  \ void sendText(View view) {\n        Intent i = new Intent(this, SecondActivity.class);\n\
  \        String myString = binding.editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n        startActivity(i);\n    }\n}\n```\n\n`sendText()`\
  \ 方法的代码遵循了“Android 意图概述”中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前活动和 `SecondActivity` 的类名作为参数传递。接下来，将输入\
  \ `EditText` 对象的文本以键值对的形式添加到意图对象，并通过调用 `startActivity()` 传递意图对象启动意图。\n\n编译并运行应用程序，点击“Send\
  \ Text”按钮启动 `SecondActivity`。使用返回按钮（位于屏幕底部工具栏中）或在较新的 Android 版本上从屏幕边缘向右滑动返回 `MainActivity`\
  \ 屏幕。\n\n# 55.7 提取意图数据\n\n现在 `SecondActivity` 正在从 `MainActivity` 启动，下一步是从意图中提取包含的\
  \ `String` 数据值，并将其分配给 `SecondActivity` 用户界面中的 `TextView` 对象。除了适配活动以使用视图绑定（view binding）之外，还需要在\
  \ `SecondActivity.java` 源文件的 `onCreate()` 方法中添加一些代码：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  .\n.\nimport android.content.Intent;\nimport android.view.View;\nimport com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\
  public class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        EdgeToEdge.enable(this);\n        setContentView(R.layout.SecondActivity);\n\
  \        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n       \
  \ View view = binding.getRoot();\n        setContentView(view);\n        ViewCompat.setOnApplyWindowInsetsListener(binding.main,\
  \ (v, insets) -> {\n            Insets systemBars = insets.getInsets(WindowInsets.Type.systemBars());\n\
  \            v.setPadding(systemBars.left, systemBars.top, systemBars.right, systemBars.bottom);\n\
  \            return insets;\n        });\n        Bundle extras = getIntent().getExtras();\n\
  \        if (extras == null) {\n            return;\n        }\n        String qString\
  \ = extras.getString(\"qString\");\n        binding.textView2.setText(qString);\n\
  \    }\n}\n```\n\n在模拟器或物理设备上编译并运行应用程序，在点击“Send Text”按钮之前输入文本。消息现在应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n# 5.8 作为子活动启动 SecondActivity\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，必须将其作为 `MainActivity` 的子活动启动。这意味着我们需要调用 `registerActivityResult()`\
  \ 并声明一个在 `SecondActivity` 返回时调用的回调处理器。该回调将提取 `SecondActivity` 返回的数据并显示在 `textView1`\
  \ 上。\n\n`registerActivityResult()` 返回一个 `ActivityResultLauncher` 实例，可以在 `sendText()`\
  \ 中调用它来启动意图。编辑 `MainActivity.java` 文件使其如下：\n\n```java\n.\n.\nimport android.app.Activity;\n\
  import androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  .\n.\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    String returnString = data.getExtras().getString(\"\
  returnData\");\n                    binding.textView1.setText(returnString);\n \
  \               }\n            }\n        });\n\n    public void sendText(View view)\
  \ {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText1.getText().toString();\n        i.putExtra(\"qString\"\
  , myString);\n        startActivity(i);\n        startForResult.launch(i);\n   \
  \ }\n}\n```\n\n\n\n\n\n# 55.9 从子活动返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而\
  \ `MainActivity` 反过来也经过了修改以处理来自 `SecondActivity` 返回的数据。现在剩下的工作是修改 `SecondActivity.java`\
  \ 以实现 `finish()` 方法并添加一个名为 `returnText()` 的方法。`finish()` 方法在活动退出时触发（例如当用户选择设备上的返回按钮时）：\n\
  \n```java\npublic void returnText(View view) {\n    finish();\n}\n\n@Override\n\
  public void finish() {\n    Intent data = new Intent();\n    String returnString\
  \ = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\", returnString);\n\
  \    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\n`finish()` 方法创建一个新的\
  \ intent，将返回数据作为键值对添加，然后调用 `setResult()` 方法，传递结果代码和 intent 对象。`returnText()` 方法则调用了\
  \ `finish()` 方法。\n\n打开 `activity_second.xml` 文件，选择按钮组件，并配置 `onClick` 属性以调用 `returnText()`\
  \ 方法。\n\n# 55.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 的文本字段中输入问题，并点击“Send Text”按钮。当\
  \ `SecondActivity` 出现时，在 `EditText` 视图输入文本，并使用返回按钮或“Return Text”按钮返回 `MainActivity`，响应应该出现在文本视图对象中。\n\
  \n# 55.11 总结\n\n在上一章涵盖了 intent 的基础知识后，本章的目标是完成在 Android Studio 中创建一个应用程序项目，用于演示显式\
  \ intent 的使用，以及父活动与子活动之间数据传输的概念。\n\n下一章将使用一个示例来演示隐式 intent 的作用。\n\n# 56. Android\
  \ 隐式 intent – 实例示例\n\n本章将在 Android Studio 中创建一个示例应用程序，用于演示隐式 intent 的实际实现。目标将是创建并发送一个\
  \ intent，请求加载并向用户显示特定网页的内。由于示例应用程序本身不包含能够执行此任务的活动，因此将发布一个隐式 intent，以便触发 Android\
  \ intent 解析算法，从而识别并从另一个应用程序中启动合适的活动。这很可能是 Android 操作系统内置的 Chrome 浏览器的某个活动。\n\n成功启动内置浏览器后，将创建一个具有显示网页能力的活动项目。该项目将被安装到设备或模拟器上，以演示隐式\
  \ intent 和链接验证。\n\n## 56.1 创建 Android Studio 隐式 intent 示例项目\n\n从欢迎界面选择“New Project”选项，在弹出的新项目对话框中，在点击“Next”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 Name 字段中输入 `ImplicitIntent`，并指定 `com.ebookfrenzy.implicitintent`\
  \ 为包名。由于此示例将使用最近 Android 版本中才有的功能，在点击“Finish”按钮之前，将 Minimum API level 设置更改为 `API\
  \ 31: Android 12.0 (S)`，并将语言菜单改为 `Java`。\n\n## 56.2 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由一个\
  \ `ConstraintLayout` 和两个 `Button` 对象组成。在 Project 工具窗口中，找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件并双击将其加载到 Layout Editor 工具中。\n\n删除默认的 `TextView`，并在启用 Autoconnect（自动连接）模式的情况下，将\
  \ `Button` 组件置于布局中，使其如下所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\n图 56-1\n\n将按钮上的文本设置为\
  \ Show Web Page 和 Enable Links，并将文本提取为字符串资源。\n\n选择每个 `Button` 并使用 Attributes（属性）工具窗口配置\
  \ `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink` 的方法。\n\n## 56.3 创建隐式 intent\n\
  \n如上所述，隐式 intent 将名为 `showWebPage()` 的方法内部被创建并发布，该方法反过来需要在 `MainActivity` 类中实现，其代码位于\
  \ `MainActivity.java` 源文件中。在 Project 工具窗口中找到该文件并双击将其加载到编辑面板中。加载后，修改代码添加 `showWebPage()`\
  \ 和 `enableLink()` 方法以及一些必要的导入语句：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.net.Uri;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n.\n\n    public void\
  \ showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                    Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n\n    public void enableLink(View view) {\n    }\n}\n```\n\n`showWebPage()`\
  \ 方法执行的任务非常简单。首先，创建一个新的 intent 对象。然而，代码并没有指定 intent 的类名，而是使用 `ACTION_VIEW` 选项指示了\
  \ intent 的性质（向用户显示某些内容）。intent 对象还包含一个包含要显示的 URL 的 `URI`。然后通过调用 `startActivity()`\
  \ 发布 intent。\n\n在模拟器或物理设备上编译并运行应用程序，运行后点击 Show Page 按钮。点击后，应该出现浏览器视图并加载指定的网页。隐式\
  \ intent 现在已成功执行。\n\n## 56.4 添加第二个匹配活动\n\n本章的剩余部分将演示设备上安装了多个符合隐式 intent 要求的的效果。为了实现这一点，将创建并安装第二个应用程序。从在\
  \ Android Studio 中创建一个新项目开始，应用程序名称设置为 WebView，使用与创建 ImplicitIntent 项目相同的 SDK 配置，并再次选择\
  \ Empty Views Activity。\n\n有一个托管 Digital Asset Links 文件的网站并想尝试自动验证，在指定包名时使用你的网站\
  \ URL。例如，如果你的网站托管在 `www.mycompany.com`，包名需要设置为：\n\n`com.mycompany.mywebview`\n\n\
  如果你没有网站或计划使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\n点击 Finish 创建项目，按照第 11.8\
  \ 节所述将项目转换为视图绑定。\n\n## 56.5 在 UI 中添加 Web View\n\n新 MyWebView 项目包含的唯一活动的用户界面将由 Android\
  \ `WebView` 组件的实例组成。在 Project 工具窗口中，找到 `activity_main.xml` 文件（该文件包含活动的用户界面描述），双击将其加载到\
  \ Layout Editor 工具中。\n\n在 Layout Editor 工具的 Design 模式下，选择默认的 `TextView` 组件并使用键盘删除键从布局中移除。\n\
  \n从色板的 Widgets 部分拖入一个 `WebView` 对象到现有的 `ConstraintLayout` 视图中，如图 56-2 所示：\n\n![](img/as_3.5_implicit_intent_webview_ui.jpg)\n\
  \n图 56-2\n\n\n\n\n\n在继续之前，将 `WebView` 实例的 ID 改为 `webView1`，并使用“推断约束”（Infer constraints）按钮添加任何缺失的约束。\n\
  \n## 56.6 获取 Intent URL\n\n当创建隐式意图（implicit intent）对象以显示 浏览器窗口时，网页 URL 将封装在意图对象中的\
  \ `Uri` 对象中。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为 URL 字符串并赋值给\
  \ `WebView` 对象。要实现此功能，请修改 `MainActivity.java` 文件，使其读取内容如下：\n\n```java\npackage com.ebookfrenzy.mywebview;\n\
  \n.\n\n.\n\nimport java.net.URL;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n.\n.\n        handleIntent();\n    }\n\n\
  \    private void handleIntent() {\n        Intent intent = getIntent();\n     \
  \   Uri data = intent.getData();\n        URL url = null;\n        try {\n     \
  \       url = new URL(data.getScheme(),\n                          data.getHost(),\n\
  \                          data.getPath());\n        } catch (Exception e) {\n \
  \           e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 方法中的新代码执行了以下任务：\n* 获取导致此活动启动的 intent 引用\n* 从意图对象中提取\
  \ `Uri` 数据\n* 将 `Uri` 数据转换为 `URL` 对象\n* 将 `URL` 加载到视图中，在此过程中将 `URL` 转换为 `String`\n\
  \nMyWebView 项目的代码部分现在已完成。剩下的工作是修改 manifest 文件。\n\n## 56.7 修改 MyWebView 项目的 Manifest\
  \ 文件\n\n在测试之前，必须对 `MyWebView` 的 manifest 文件进行一些更改。首先，该活动需要请求访问互联网的权限（因为需要加载网页）。这通过向\
  \ manifest 文件添加适当的权限行来实现：\n\n```xml\n<uses-permission android:name=\"android.permission.INTERNET\"\
  \ />\n```\n\n此外，查看 MyWebView 项目的 `AndroidManifest.xml` 文件中 intent-filter 部分的内容，将发现以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n在上面的 XML 中，`android.intent.action.MAIN` 条目表示该活动在无数据输入的情况下启动时是应用程序的入口点——另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该活动应该列在设备的应用程序启动器屏幕中。\n\n由于该活动不需要作为程序的入口点启动，无法在没有数据输入（在此情况下为 `URL`）的情况下运行，且不需要在启动器中出现，因此该活动的\
  \ manifest 文件中不需要 `MAIN` 或 `LAUNCHER` 指令。\n\n然而，需要修改 `MainActivity` 活动的 intent 过滤器，以指示它能够处理针对\
  \ HTTP 数据方案的 `ACTION_VIEW` 意图动作。\n\nAndroid 还要求处理不包含 `MAIN` 和 `LAUNCHER` 条目的隐式意图的活动必须在意图过滤器中包含所谓的“可浏览的”（browsable）和“默认的”（default）类别。因此，修改后的\
  \ intent 过滤器部分应该如下所示，其中 `<website url>` 被替换为你的网站地址或 `www.ebookfrenzy.com`，这取决于你在创建\
  \ MyWebView 项目时使用的包名：\n\n```xml\n<intent-filter android:autoVerify=\"true\">\n \
  \   <action android:name=\"android.intent.action.VIEW\" />\n    <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n    <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n    <data android:scheme=\"https\" />\n    <data android:host=\"<website url>\"\
  />\n</intent-filter>\n```\n\n将这些要求整合在以下完整的 `AndroidManifest.xml` 文件中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n通过双击项目窗口中的文件名将 `AndroidManifest.xml`\
  \ 文件加载到 manifest 编辑器。加载后，按照上述内容修改 XML，记得输入正确的网站 URL。完成 manifest 修改后，该活动已准备好安装到设备。\n\
  \n## 56.8 在设备上安装 MyWebView 包\n\n在 MyWebView 主活动作为隐式意图的接收者之前，必须先将其安装到设备。这通过正常方式运行应用程序来实现。由于\
  \ manifest 文件既不包含 `android.intent.action.MAIN` 包含 `android.intent.category.LAUNCHER`\
  \ 设置，必须指示 Android Studio 安装但不启动应用。要配置此行为，从工具栏选择 app -> Edit configurations… 菜单，如图：\n\
  \n![](img/as_edit_configurations.jpg)\n图 56-3\n\n在 Run/Debug Configurations 对话中，将位于面板中的\
  \ Launch 选项改为 `Nothing`，然后点击 `Apply` 后点击 `OK`：\n\n![](img/as_launch_options.jpg)\n\
  图 56-4\n\n配置好设置后，正常运行应用。注意应用已安装但尚未启动。\n\n## 56.9 测试应用程序\n\n安装 MyWebView 应用后，重新运行\
  \ Implicit 并点击 Show Page 按钮。注意网页仍然加载到了 Chrome 浏览器，而不是 MyWebView 应用的主活动。这是因为 MyWebView\
  \ 活动尚未验证或启用打开启动意图中的链接。必须在 `enableLink()` 方法中添加代码来手动启用链接。\n\n## 56.10 手动启用链接\n\n\
  在 `enableLink()` 方法中，我们需要创建并启动一个意图以显示 MyWebView 应用的默认设置屏幕。将 `MainActivity.java`\
  \ 文件加载到代码编辑器并修改 `enableLink()` 方法，使其读取如下，确保将 `<reverse domain>` 替换为 `com.ebookrenzy`\
  \ 或你自己的反向域名，取决于你在创建 MyWebView 项目时选择的包名：\n\n```java\n.\n.\nimport android.provider.Settings;\n\
  ...\n\npublic void enableLink(View view) {\n    Intent intent = new Intent(\n  \
  \          Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n            Uri.parse(\"\
  package:<reverse domain>.mywebview\"));\n    startActivity(intent);\n}\n```\n\n\
  .\n.\n\n重新运行 ImpicitIntent 应用并点击 Enable Link 按钮以显示 MyWebView 应用的默认设置屏幕：\n\n\n\n\n\
  \n![](img/as_implicit_intent_open_by_default.jpg)\n\n图 56-5\n\n点击 `Add Link` 按钮（如上方标记为\
  \ A），启用 URL 旁边的复选框，并点击 `Add` 按钮：\n\n![](img/as_implicit_intent_add_link.jpg)\n\n\
  图 56-6\n\n在点击返回箭头（如上方 图 56-5 中的标记 B）返回 ImplicitIntent 应用程序之前，确认该链接现在已列为支持状态。点击 `Open\
  \ Web Page` 现在应该将页面加载到 `MyWebView` 应用中，而不是 Chrome 浏览器：\n\n![](img/as_mywebview_running.jpg)\n\
  \n图 56-7\n\n### 56.11 自动链接验证\n\n如果你选择使用自己的网站 URL 作为 `MyWebView` 的包名，现在可以执行使用自动链接验证的额外步骤。首先，从你测试的设备或模拟器上卸载\
  \ `MyWebView` 应用。在网站上放置数字资产链接（Digital Asset Links）文件后，我们将重新安装应用以触发验证过程。\n\n按照标题为\
  \ “Android Intents 概述` 的章节列出的步骤，找到你的 `debug.keystore` 文件，并使用 `keytool` 工具如下获取你的\
  \ SHA-256 证书指纹：\n\n```\nkeytool -list -v -keystore <path to debug.keystore file\
  \ here>\n```\n\n接下来，在浏览器中打开以下页面：\n\nhttps://developers.google.com/digital-asset-links/tools/generator\n\
  \n一旦页面加载，在 `Hosting site domain` 字段输入你的网站 URL，使用 `com.<domain here>.mywebview` 作为\
  \ App 包名，并将你的 SHA-256 指纹输入到 `App package fingerprint (SHA256)` 字段中：\n\n![](img/as_implicit_intent_link_generator.jpg)\n\
  \n图 56-8\n\n点击 `Generate` 语句按钮显示生成的语句，并将其放在名为 `assetlinks.json` 的文件中，位于 Web 服务器上名为\
  \ `.well-known` 的文件夹中。返回生成器页面并点击 `Test` 语句按钮以验证文件是否有效且位置正确。\n\n假设测试成功，我们已准备好尝试应用链接，在你的设备或模拟器上重新安装\
  \ `MyWebView` 应用，并使用 `Settings` 应用导航到 `MyWebView` 的“由默认打开”页面。该页面应显示链接已验证：\n\n![](img/as_implicit_intent_verified.jpg)\n\
  \n图 56-9\n\n再次运行 ImplicitIntent 应用程序，点击 `Open Web Page` 按钮，并验证页面内容出现在 `MyWebView`\
  \ 应用中而不是 Chrome 浏览器。\n\n### 56.12 总结\n\n隐式意图（Implicit intents）提供了一种机制，一个活动可以通过指定操作类型以及可选的、执行该操作的数据，来请求另一个活动的服务。然而，要成为隐式意图的目标候选者，活动必须配置为从传入的意图对象中提取适当的数据，并包含在正确配置的清单（manifest）文件中，包括适当的权限和意图过滤器（intent\
  \ filters）。包含目标活动的应用还必须使用数字资产链接文件进行验证，或由用户手动启用。\n\n在本章中，创建了一个示例来演示隐式意图的发布、能够处理此类意图的示例活动的创建以及链接验证过程。\n\
  \n### 57. Android 广播意图和广播接收器\n\n除了提供启动应用活动的机制外，意图还用于向系统中的其他组件广播系统级消息。这涉及广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n#### 57.1 广播意图概述\n\n广播意图是\
  \ `Intent` 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者用于需要从广播获取结果的情况）。除了在应用组件之间提供消息和事件系统外，广播意图还被 Android 系统用于通知感兴趣的应用程序关键系统事件（例如外部电源或耳机的连接或断开）。\n\
  \n当创建广播意图时，它必须包含一个操作字符串（action string）、可选数据分类字符串（category string）。与标准意图一样，数据使用意图对象的\
  \ `putExtra()` 方法结合键值对添加到广播意图中。可选的类别字符串可以通过调用 `addCategory()` 方法分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个广播意图，包含唯一的操作字符串和数据：\n\
  \n```\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在 3.0\
  \ 之前的 Android 设备上成功启动相应的广播接收器。然而，在较新版本的 Android 中，广播接收器将无法接收到该意图。这是因为 Android 3.0\
  \ 引入了一种启动控制安全措施，防止停止状态的应用组件通过意图启动。如果一个应用刚刚安装且尚未启动过，或者被用户使用设备上的应用程序管理器手动停止了，则该应用被认为处于停止状态。然而，为了解决这个问题，可以在发送意图之前添加一个标记，以指示该意图允许启动停止的应用组件。该标记是\
  \ `FLAG_STOPPED_PACKAGES`，并在如下述代码适配中使用：\n\n```\nIntent intent = new Intent();\n\
  intent.addFlags(Intent.FLAG_STOPPED_PACKAGES);\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n#### 57.2\
  \ 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 `BroadcastReceiver` 类并重写 `onReceive()`\
  \ 方法来实现。广播接收器可以在代码中（例如在活动内部）或清单文件中注册。注册实现的一部分涉及创建意图过滤器（intent filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串实现的。当检测到匹配的广播时，广播接收器的\
  \ `onReceive()` 方法会被调用，此时方法有 5 秒时间执行任何任务。需要注意的是，广播接收器不需要持续运行。当检测到匹配的意图时，Android\
  \ 运行时系统会自动启动广播接收器并调用 `onReceive()` 方法。\n\n以下代码概述了一个广播接收器子类的模板：\n\n```\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    public MyReceiver() {\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // 在检测到广播时在此处实现要执行的代码\n    }\n}\n```\n\n当在清单文件中注册广播接收器时，必须为接收器添加\
  \ `<receiver>` 条目。\n\n以下清单文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\">\n```\n\n\n\n\n\n```xml\n<manifest android:versionName=\"1.0\">\n    <uses-sdk\
  \ android:minSdkVersion=\"33\" />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\">\n        <receiver android:name=\"\
  MyReceiver\">\n        </receiver>\n    </application>\n</manifest>\n```\n\n在 Android\
  \ 8.0 之前的版本上运行时，与接收器相关的意图过滤器可以放在 manifest 文件的接收器元素中，如下：\n\n```xml\n<receiver android:name=\"\
  MyReceiver\">\n    <intent-filter>\n        <action android:name=\"com.example.Broadcast\"\
  >\n    </action>\n    </intent-filter>\n</receiver>\n```\n\n在 Android 8.0 或更高版本上，必须在代码中使用\
  \ `Activity` 类的 `registerReceiver()` 方法，结合适当配置的 `IntentFilter` 对象来注册接收器：\n\n```java\n\
  IntentFilter filter = new IntentFilter(\"com.example.Broadcast\");\nMyReceiver receiver\
  \ = new MyReceiver();\nregisterReceiver(receiver, filter, RECEIVER_EXPORTED);\n\
  ```\n\n当代码中注册的广播接收器不再需要时，可以通过调用 `activity` 类的 `unregisterReceiver()` 方法来取消注销，并传递接收器对象的引用作为参数。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n请记住，某些系统广播意图只有在广播接收器在代码中注册而非在 manifest\
  \ 文件中才能被检测到。可以查看 Android `Intent` 类的文档以获取系统广播意图及相应要求的详细概述，在线地址为：[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 57.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，启动 Activity 无法从接收该广播的任何广播接收器获取结果。如果需要返回结果，则有必要使用\
  \ `sendOrderedBroadcast()` 方法。使用此方法发送广播意图时，它将按顺序传递给每个注册了感兴趣内容的广播接收器。\n\n调用 `sendOrderedBroadcast()`\
  \ 方法时会传入多个参数，包括另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器处理完意图后将通知该接收器，以及一组供这些接收器在其中放置结果数据的引用。当所有广播接收器都获得了处理广播的机会后，结果接收器的\
  \ `onReceive()` 方法将被调用并传递结果数据。\n\n## 57.4 粘性广播意图\n\n默认情况下，广播意图一旦被发送并被感兴趣的广播接收器处理，就会消失。然而，可以将广播意图定义为“粘性”。粘性意图及其包含的数据在执行完成后仍保留在系统中。可以使用通常的参数（广播接收器引用和意图过滤器对象的引用）通过调用\
  \ `registerReceiver()` 方法的返回值来获取粘性广播意图中存储的数据。许多 Android 系统广播都是粘性的，一个典型的例子是与电池电量状态相关的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，并将其要移除的广播意图的引用作为参数传递。\n\n## 57.5 广播意图示例\n\
  \n本章的剩余部分将通过实现一个基于 Android Studio 的广播意图运行示例。首先，将创建一个简单的应用程序来发布自定义广播意图。然后将创建一个相应的广播接收器，在检测到广播时在\
  \ Android 设备屏幕上显示消息。最后，将修改广播接收器以检测系统关于外部电源已从设备断开通知。\n\n## 57.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在\
  \ `Name` 字段中输入 `SendBroadcast` 并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击 `Finish`\
  \ 按钮之前，将最低 API 级别设置更改为 `API 33: Android 13.0 (Tiramisu)`，并将语言菜单设置为 `Java`。\n\n创建新项目后，在\
  \ Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml` 布局文件，并在 Design\
  \ 模式下使用 `Layout Editor` 工具，将 `TextView` 对象替换为 `Button` 视图，并设置文本属性使其显示为“Send Broadcast”。设置好文本值后，按照通常步骤将该字符串提取为命名为\
  \ `send_broadcast` 的资源。\n\n在布局中仍选中按钮的情况下，在 Attributes 面板中找到 `onClick` 属性并配置为调用名为\
  \ `broadcastIntent` 的方法。\n\n## 57.7 创建并发送广播意图\n\n在创建了 `SendBroadcast` 应用程序的框架后，现在是实现发送广播意图代码了。这涉及实现之前指定的作为用户界面\
  \ `Button` 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    public void broadcastIntent(View\
  \ view) {\n        Intent intent = new Intent();\n        intent.setAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n        sendBroadcast(intent);\n\
  \    }\n}\n```\n\n注意，在此例中，意图的动作字符串为 `com.ebookfrenzy.sendbroadcast`。当在本章后续章节创建广播接收器类时，意图过滤器声明必须匹配此动作字符串。\n\
  \n到此，发送广播意图的应用程序创建完成。剩下的就是构建一个匹配的广播接收器。\n\n## 57.8 创建广播接收器\n\n要创建广播接收器，需要创建一个子自\
  \ `BroadcastReceiver` 父类的新类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从弹出的菜单中选择\
  \ `New -> Other -> Broadcast Receiver` 选项，将类命名为 `MyReceiver`，并确保选中 `Exported` 和\
  \ `Enabled` 。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收来自其他应用程序的消息。配置好类后，点击 `Finish`。\n\
  \n创建后，Android Studio 将将新的 `MyReceiver.java` 类文件加载到编辑器中，内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: 此方法在广播接收器接收\n        // 意图广播时被调用。\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \ }\n}\n```\n\n\n\n\n如代码所示，`Android Studio` 为新类生成了模板并为 `onReceive()` 方法生成了存根（stub）。现在需要对类进行一些更改以实现所需的行为。因此，继续留在\
  \ `MyReceiver.java` 文件中，修改代码如下如下：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\nimport android.widget.Toast;\n\npublic class MyReceiver\
  \ extends BroadcastReceiver {\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: This method is called when the BroadcastReceiver\
  \ is receiving\n        // an Intent broadcast.\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n        Toast.makeText(context, \"Broadcast Intent Detected.\"\
  ,\n                     Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n广播接收器的代码现在已经完成。\n\
  \n### 57.9 注册广播接收器\n\n项目需要公开广播接收器的存在，并且必须包含一个意图过滤器（intent filter），以指定接收器感兴趣的广播意图。在上一节创建\
  \ `BroadcastReceiver` 类时，`Android Studio` 自动在清单文件中添加了一个 `<receiver>` 元素。因此，剩下的只需在\
  \ `MainActivity.java` 文件中添加代码以创建一个意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.IntentFilter;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BroadcastReceiver receiver;\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        configureReceiver();\n    }\n\n\
  \    private void configureReceiver() {\n        IntentFilter filter = new IntentFilter();\n\
  \        filter.addAction(\"com.ebookfrenzy.sendbroadcast\");\n        receiver\
  \ = new MyReceiver();\n        registerReceiver(receiver, filter);\n    }\n}\n```\n\
  \n在不再需要广播接收器时，注销它也是同样重要的：\n\n```java\n@Override\nprotected void onDestroy() {\n\
  \    super.onDestroy();\n    unregisterReceiver(receiver);\n}\n```\n\n### 57.10\
  \ 测试广播示例\n\n要测试广播发送器和接收器，请在设备或 AVD 上运行 `SendBroadcast` 应用并等待它显示在屏幕上。一旦运行，点击按钮，此时显示为“Broadcast\
  \ Intent Detected.”的 toast 消息将弹出几秒钟然后消失。\n\n### 57.11 监听系统广播\n\n此示例的最后一个阶段是修改广播接收器的意图过滤器，以监听当外部电源从设备断时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n            \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种广播意图，因此有必要修改代码，将当前意图的动作字符串也显示在\
  \ toast 消息中。此字符串可以通过调用作为 `onReceive()` 方法参数传递的 `intent` 对象的 `getAction()` 方法获取：\n\
  \n```java\npublic void onReceive(Context context, Intent intent) {\n    String message\
  \ = \"Broadcast intent detected \"\n                     + intent.getAction();\n\
  \    Toast.makeText(context, message,\n                 Toast.LENGTH_LONG).show();\n\
  }\n```\n\n测试广播发送器和接收器。你应该看到以下消息：\n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\
  或\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n### 57.12 总结\n\n广播意图（Broadcast intents）是一种发布意图供多个组件使用的机制。广播通过注册一个 `Receiver` 来检测，而接收器又被配置为监听特定的动作字符串。通常，Android\
  \ 系统也使用广播意图来发布事件，例如低电量警告或电源的连接和断开。\n\n除了提供广播意图和接收器的概述外，本章还通过了一个发送广播意图并实现监听自定义和系统意图的接收器的示例。\n\
  \n### 58. Android 本地绑定服务 – 实例详解\n\n如上一节所述，绑定服务（bound services）为服务和客户端组件之间提供了一种通信机制。本章在对绑定服务概述的基础上，开始一个本地绑定服务的示例。\n\
  \n### 58.1 理解绑定服务\n\n提供绑定服务是为了允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务上，并在绑定后与该服务进行交互。\n\
  \n绑定服务是作为 `Service` 类的子类创建的，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()` 方法绑定到服务。对绑定服务的第一次绑定请求将导致调用该服务的\
  \ `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个 `ServiceConnection`\
  \ 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这些方法分别在客户端-服务器连接建立或断开后被调用。在\
  \ `onServiceConnected()` 方法的情况下，它将传递一个 `IBinder` 对象，其中包含了客户端与服务交互所需的信息。\n\n### 58.2\
  \ 绑定服务的交互选项\n\n实现客户端组件与绑定服务之间交互有两种推荐的机制。假设绑定服务是本地的，且与客户端组件相同的应用程序私有（也就是说，它在同一个进程中运行，并且对其他应用程序中的组件不可）。在这种情况下，推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。该 `Binder` 对象的实例将由 `onBind()` 方法返回，并随后被客户端组件用于直接访问服务中持有的方法和数据。\n\
  \n\n\n\n当绑定服务不是应用程序本地的（换句话说，它与客户端组件运行在不同的进程中）时，最佳交互方式是使用 Messenger/Handler 实现。\n\
  \n在本章的剩余部分，将创建一个示例，以演示创建、启动以及与本地私有绑定服务交互涉及的步骤。\n\n## 58.3 本地绑定服务示例\n\n在本章的剩余部分创建的示例应用程序将包含一个\
  \ activity 和一个绑定服务。该绑定服务的目的是从系统获取当前时间，并将该信息返回给 activity，由其显示给用户。该绑定服务将是本地的且与 activity\
  \ 属于同一个私有应用程序。\n\n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `LocalBound`，并指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。使用节 11.8 Migrating a Project to View Binding 中的步骤将项目迁移到\
  \ view binding。\n\n项目创建完成后，下一步是添加一个新类来作为绑定服务。\n\n## 58.4 向项目添加绑定服务\n\n要向项目添加新类，在\
  \ Project 工具窗口中右键点击包名（位于 `app -> java -> com.ebookfrenzy.localbound` 下），并选择 `New\
  \ -> Service -> Service` 菜单选项。指定 `BoundService` 为类名，并在点击 `Finish` 创建该类之前，确保 `Exported`\
  \ 和 `Enabled` 选项都已选中。Android Studio 将将 `BoundService.java` 文件加载到编辑器中，其内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n\n    public BoundService() {\n\n    }\n\n    @Override\n \
  \   public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n}\n```\n\n## 58.5 实现 Binder\n\n如前所述，本地绑定服务可以通过向客户端传递适当配置的\
  \ `Binder` 对象来与客户端通信。这是通过在绑定服务类内部创建一个 `Binder` 子类，并通过添加一个或多个客户端可以调用的新方法来扩展它的。这通常涉及实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端可以直接访问数据并调用绑定服务中的方法。\n\
  \n对于此示例，需要对上一节创建的模板类 `BoundService` 一些一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将返回当前服务对象的实例引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java` 文件并进行如下修改：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder {\n\
  \        BoundService getService() {\n            return BoundService.this;\n  \
  \      }\n    }\n}\n```\n\n完成对类的修改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个 `Binder` 的新子类（命名为\
  \ `MyLocalBinder`）。该类包含一个返回 `BoundService` 类当前实例引用的方法。创建了 `MyLocalBinder` 类的新实例并赋值给\
  \ `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此这种赋值不存在类型不匹配）。\n\n接下来，需要修改\
  \ `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在被任何绑定到服务的客户端调用时时返回当前时间：\n\n```java\n\
  package com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\nimport\
  \ java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\n\nimport\
  \ android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat = new\
  \ SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US);\n        return (dateformat.format(new\
  \ Date()));\n    }\n\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n```\n\
  \n此时，绑定服务已完成，准备好添加到项目清单。在 Project 工具窗口中找到并双击 `LocalBound` 项目的 `AndroidManifest.xml`\
  \ 文件，一旦加载到清单编辑器，请验证 Android Studio 是否已添加如下的 `<service>` 条目：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <service\n            android:name=\"\
  .BoundService\"\n            android:enabled=\"true\"\n            android:exported=\"\
  true\" >\n        </service>\n        <activity\n            android:name=\".MainActivity\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n下一阶段是在 activity 中编写代码以绑定服务并调用 `getCurrentTime()` 方法。\n\n## 58.6 将客户端绑定到服务\n\
  \n在本教程中，客户端是运行应用程序的 `MainActivity` 实例。如前所述，要成功绑定到服务并接收由 `onBind()` 方法返回的 `IBinder`\
  \ 对象，需要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    final private ServiceConnection myConnection = new ServiceConnection()\n\
  \    {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n```\n\n\n\n\n\n```java\nMyLocalBinder binder =\
  \ (MyLocalBinder) service;\n\nmyService = binder.getService();\n\nisBound = true;\n\
  \n}\n\n@Override\npublic void onServiceDisconnected(ComponentName name) {\n    isBound\
  \ = false;\n}\n\n};\n}\n```\n\n当客户端成功绑定到服务时，将调用 `onServiceConnected()` 方法。该方法将由服务的\
  \ `onBind()` 方法返回的 `IBinder` 对象作为参数传递。此参数被强制转换为 `MyLocalBinder` 类型的对象。然后，调用 binder\
  \ 对象的 `getService()` 方法以获取服务实例的引用，该引用随后赋值给 `myService`。一个布尔（Boolean）标志位表示连接已成功建立。\n\
  \n当连接结束时，会调用 `onServiceDisconnected()` 方法，并将布尔标志位设置为 `false`。\n\n在建立连接后，下一步是修改活动（activity）以绑定到该服务。这涉及创建一个\
  \ `intent`（意图）并调用 `bindService()` 方法，操作可以在可以在的 `onCreate()` 方法中执行：\n\n```java\n\
  @Override\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  .\n.\n    Intent intent = new Intent(this, BoundService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n## 58.7 完成示例\n\n剩下的工作是添加一种机制，用于调用\
  \ `getCurrentTime()` 方法并将结果显示给用户。按照现在的惯例，Android Studio 已经为该活动创建了一个 `activity_main.xml`\
  \ 模板文件，其中仅包含一个 `TextView`。将此文件加载到布局编辑器（Layout Editor）工具中，并在设计（Design）模式下选择 `TextView`\
  \ 组件并将 ID 更改为 `myTextView`。在 `TextView` 之下添加一个 `Button`（按钮）视图，并将按钮上的文本更改为“Show Time”（显示时间），将文本提取到名为\
  \ `show_time` 的字符串资源中。完成这些更改后，布局应当类似于图 58-1 所示。如果缺少任何约束（constraints），请点击布局编辑器工具栏中的推断约束（Infer\
  \ Constraints）按钮。\n\n![](img/as_local_bound_ui.jpg)\n\n图 58-1\n\n通过选择 `Button` 并配置\
  \ `onClick` 属性以调用名为 `showTime` 的方法，完成用户界面设计。\n\n最后，编辑 `MainActivity.java` 文件代码以实现\
  \ `showTime()` 方法。该方法调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过\
  \ `myService` 引用从活动内部调用），并将生成的字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \n.\n.\nimport android.widget.TextView;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n    public void showTime(View view)\n    {\n    \
  \    String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n.\n.\n}\n```\n\n## 58.8 测试应用程序\n\n代码更改完成后，对应用程序进行测试运行。一旦可见，触摸按钮并注意文本视图更改为显示当前日期和时间。示例已成功启动并绑定到服务，然后调用了该服务的方法来执行任务，并将结果返回给活动。\n\
  \n## 58.9 总结\n\n当绑定服务是本地的且对应用程序私有时，该应用程序内的组件可以与服务进行交互，而无需诉助于进程间通信（IPC）。简单来说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含对正在运行的服务实例的引用。客户端组件实现一个 `ServiceConnection`\
  \ 子类，其中包含回调方法，这些方法在服务连接和断开时会被调用。前一个方法接收由 `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务内的公共方法。\n\
  \n在介绍了本地绑定服务的实现后，下一章将重点介绍使用 IPC 与远程绑定服务进行交互。\n\n## 59. Android 远程绑定服务 – 实例示例\n\n\
  在专门用于 Android 服务的最后一个章节中，将开发一个示例应用程序，演示如何使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n### 59.1 客户端到远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务引用的 `IBinder` 对象来实现。然而，在远程服务的情况下，这种方法并不行，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n在远程服务的情况下，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息在客户端和服务的进程边界之间传递。具体而言，服务会创建一个\
  \ `Handler` 实例，当从客户端接收消息时会调用它。在初始化方面，`Handler` 的职责是创建一个 `Messenger` 对象，该对象反过来创建一个\
  \ `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 实例，并随后向\
  \ handler 发送消息。客户端每次发送消息时，handler 的 `handleMessage()` 方法就会被调用并传递消息对象。\n\n本章的示例将由活动和一个运行在独立进程的服务组成。`Messenger/Handler`\
  \ 机制将字符串发送到服务，并显示在 Logcat 输出中。\n\n### 59.2 创建示例应用程序\n\n在欢迎界面选择 New Project ，并在出现的新项目对话框中选择\
  \ Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 `RemoteBound`，并在 package name\
  \ 中指定 `com.ebookfrenzy.remotebound`。在点击 Finish 按钮之前，将 Minimum API level 设置为 `26:\
  \ Android 8.0 (Oreo)`并将 Language 菜单设置为 Java。\n\n### 59.3 设计用户界面\n\n在 Project 工具窗口中找到\
  \ `activity_main.xml` 文件并双击将其加载到布局编辑器工具中。在布局编辑器的 Design 模式下，右键点击默认的 `TextView` 实例，选择\
  \ Convert view... 选项，从生成的对话框中选择 `Button` 视图并点击 Apply。更改按钮的文本属性为“Send Message”，并将字符串提取到名为\
  \ `send_message` 的新资源。\n\n最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n### 59.4\
  \ 实现远程绑定服务\n\n为了实现示例，通过右键点击 Project 工具窗口中的包名（位于 app -> java 下）向项目添加新类，选择 New ->\
  \ Service -> Service 选项。指定 `RemoteService` 为类名，并确保 Exported 和 Enabled 选项均已选中，然后点击\
  \ Finish 创建该类。\n\n\n\n\n下一步是为新服务实现处理器类（handler class）。这通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。当从客户端接收到消息时将调用此方法。它将接收一个 `Message` 对象作为参数，该对象包含了客户端需要传递给服务的任何数据。在本例中，这将是一个\
  \ `Bundle` 对象，其中包含一个要显示给用户的字符串。一旦完成实现，`RemoteService.java` 文件中修改后的类内容如下所示：\n\n```java\n\
  package com.ebookfrenzy.remotebound;\n\nimport android.app.Service;\nimport android.content.Intent;\n\
  import android.os.IBinder;\nimport android.os.Bundle;\nimport android.os.Handler;\n\
  import android.os.Looper;\nimport android.os.Message;\nimport android.os.Messenger;\n\
  import android.util.Log;\n\npublic class RemoteService extends Service {\n    public\
  \ RemoteService() {\n    }\n\n    static class IncomingHandler extends Handler {\n\
  \        String TAG = \"RemoteService\";\n        public IncomingHandler() {\n \
  \           super(Looper.getMainLooper());\n        }\n        @Override\n     \
  \   public void handleMessage(Message msg) {\n            Bundle data = msg.getData();\n\
  \            String dataString = data.getString(\"MyString\");\n            Log.i(TAG,\
  \ \"Message = \" + dataString);\n        }\n    }\n\n    @Override\n    public IBinder\
  \ onBind(Intent intent) {\n        // TODO: 返回通往服务的通信通道。\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n处理器实现后，服务代码方面唯一剩余的任务是修改 `onBind()` 方法，使其返回一个包含\
  \ `Messenger` 对象的 `IBinder` 对象，而该 `Messenger` 对象又包含对处理器的引用：\n\n```java\nfinal Messenger\
  \ myMessenger = new Messenger(new IncomingHandler());\n\n@Override\npublic IBinder\
  \ onBind(Intent intent) {\n    return myMessenger.getBinder();\n}\n```\n\n上述代码段的第一行创建了我们处理器类的新实例，并将其传递给新\
  \ `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用了 `messenger` 对象的 `getBinder()` 方法来返回该\
  \ messenger 的 `IBinder` 对象。\n\n## 59.5 在 Manifest 文件中配置远程服务\n\n为了准确地描述客户端与远程服务之间的通信，有必要配置服务与应用程序的其他部分分离运行。这通过在清单文件中服务的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。要启动远程服务，还需要为服务提供意图过滤器（intent filter）。要实现此更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 59.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。与本地服务相同，`onServiceConnected()` 方法将接收远程服务 `onBind()`\
  \ 方法返回的 `IBinder` 对象，并将将被用于向处理器发送消息。在本例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`\
  \ 中。加载此文件并修改它，以添加 `ServiceConnection` 类以及用于存储 `Messenger` 对象引用的变量，以及一个指示连接是否建立的布尔标志位：\n\
  \n```java\npackage com.ebookfrenzy.remotebound;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    final ServiceConnection\
  \ myConnection = new ServiceConnection() {\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            myService = new Messenger(service);\n\
  \            isBound = true;\n        }\n        public void onServiceDisconnected(ComponentName\
  \ className) {\n            myService = null;\n            isBound = false;\n  \
  \      }\n    };\n}\n```\n\n接下来，必须添加一些代码来绑定到远程服务。这涉及创建一个与清单文件中声明的服务意图过滤器匹配的 `intent`，然后调用\
  \ `bindService()` 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数提供。对于此示例，这些代码将在活动的\
  \ `onCreate()` 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(), RemoteService.class);\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n##\
  \ 59.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的唯一工作是在 `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置为用户触摸按钮时调用。此方法需要检查服务是否已连接，创建一个包含要由服务器显示的字符串的\
  \ `bundle`，将其添加到 `Message` 对象中，并发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view)\n{\n    if (!isBound) return;\n    Message msg = Message.obtain();\n   \
  \ Bundle bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n代码更改完成后，编译并运行应用程序。加载后，打开\
  \ Logcat 工具窗口，并在过滤字段中输入内容：\n\n`package:mine tag:RemoteServer`\n\n在 Logcat 工具窗口可见的情况下，点击用户界面上的按钮，此时日志消息应所示：\n\
  \nMessage = Message Received\n\n## 59.8 总结\n\n为了实现客户端与远程绑定服务的交互，应用程序必须实现处理器/消息通信框架。本章涵盖了该技术的基本概念，并实现了一个演示在独立进程中运行的客户端与绑定服务之间通信的示例应用程序。\n\
  \n## 60. Java 线程、处理器和执行器概述\n\n\n\n\n线程（Threads）是任何多任务操作系统的基石，它们可以被看作是在主进程中运行的微进程，其目的是在应用程序内部至少实现并行执行路径的象。在本章中，我们将探索\
  \ Android 应用开发中使用线程的重要性，并演示如何创建和管理它们。\n\n### 60.1 主线程\n\n当 Android 应用程序首次启动时，运行时系统会创建一个线程，所有的应用程序组件默认将在该线程中运行。这个线程通常被称为主线程。主线程的主要是处理用户界面，包括事件处理以及与界面中视图的交互。在应用程序中启动的任何额外组件默认也会运行在主线程上。\n\
  \n如果应用程序中的任何组件在主线程上执行耗时任务，将导致整个应用程序看起来像卡死，直到任务完成。这通常会导致操作系统向用户显示“应用程序未响应”的警告。显然，这远不是任何应用程序的预期行为。这可以通过简单地将要执行的任务发布在单独线程中来避免，从而让主线程能够不受阻地继续处理其他任务。\n\
  \n### 60.2 线程处理器（Handlers）\n\n显然，Android 开发的关键规则之一是永远不要在主线程上执行耗时操作。第二个同样重要的规则是，在独立线程中的代码在任何情况下都不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终在主线程内部进行。之所以，是因为 Android UI 工具包不是线程安全的。尝试从多个线程内部处理非线程安全的代码，通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程同步来实现。这通过在主线程中创建一个 `handler` 实现，由该 `handler`\
  \ 接收来自另一个线程的消息并相应地更新用户界面。\n\n### 60.3 线程示例\n\n本章的剩余部分将通过一些简单的示例来对线程提供基础介绍。第一步将是强调在主线程之外的独立线程中执行耗时任务的重要性。\n\
  \n启动 Android Studio，从欢迎界面选择“New Project”（新建项目）选项，在结果的新项目对话框中，选择“Empty Activity”模板，然后点击“Next”（下一步）按钮。\n\
  \n在 `Name` 字段中输入 `ThreadExample`，并指定 `com.ebookfrenzy.threadexample` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。按照 [11.8 Migrating\
  \ a Project to View Binding] 节中的步骤将项目转换为使用 view binding。\n\n### 60.4 构建应用\n\n将项目的\
  \ `activity_main.xml` 文件加载到 Layout Editor（布局编辑器）工具中。选择默认的 `TextView` 组件，并在 Properties（属性）工具窗口中将视图的\
  \ ID 更改为 `myTextView`。\n\n在用户界面上添加一个 `Button` 视图，位置直接位于现有 `TextView` 对象下方，如图 [Figure\
  \ 60-1] 所示。一旦添加了按钮，点击工具栏上的“Infer Constraints”（推断约束）按钮来添加缺失的约束。\n\n将文本更改为“Press Me”，并将字符串提取为名为\
  \ `press_me` 的资源。在布局中仍选中按钮视图的情况下，找到 `onClick` 属性并输入 `buttonClick` 作为方法名。\n\n![](img/as_thread_example_ui_one_button.jpg)\n\
  \n图 60-1\n\n接下来，将 `MainActivity.java` 文件加载到编辑面板，并为 `buttonClick()` 方法添加代码，该方法将在用户点击\
  \ `Button` 视图时被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将简单暂停 20 秒，然后在 `TextView` 对象上显示不同的文本：\n\
  \n```java\npublic void buttonClick(View view) {\n    long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    while (System.currentTimeMillis() < endTime) {\n        synchronized\
  \ (this) {\n            try {\n                wait(endTime - System.currentTimeMillis());\n\
  \            } catch (Exception e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"\
  Button Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将看起来冻结。例如，将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序未响应，如图\
  \ [Figure 60-2] 所示。\n\n![](img/as_4.jpg)\n\n图 60-2\n\n显然，Android 开发的关键规则之一是永远不要在主线程上执行耗时操作。第二个同样重要的规则是，在独立线程中的代码在任何情况下都不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终在主线程内部进行。之所以，是因为 Android UI 工具包不是线程安全的。尝试从多个线程内部处理非线程安全的代码，通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程同步来实现。这通过在主线程中创建一个 `handler` 实现，由该 `handler`\
  \ 接收来自另一个线程的消息并相应地更新用户界面。\n\n### 60.5 实现线程处理器\n\n因此，为了更新用户界面，有必要为线程实现一个 `handler`。\n\
  \n\n\n\n线程处理器（Thread handlers）实现在应用程序的主线程中，主要用于响应来自进程内运行的其他线程发送的消息并更新用户界面。\n\n处理器是继承自\
  \ `Handler` 类的子类，可以通过两种方式使用：指定一个在线程需要时执行的 `Runnable`，或者通过在 `Handler` 子类中重写 `handleMessage()`\
  \ 回调方法（当线程向处理器发送消息时，该方法会被调用）。\n\n为了本示例的目的，我们将实现一个处理器，以便从之前创建的线程内部更新用户界面。将 `MainActivity.java`\
  \ 文件加载到 Android Studio 编辑器中，并修改代码为活动中添加一个 `Handler` 实例：\n\n```java\nimport android.os.Handler;\n\
  import android.os.Message;\nimport android.os.Looper;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    Handler handler = new Handler(Looper.getMainLooper())\
  \ {\n        @Override public void handleMessage(Message msg) {\n            binding.myTextView.setText(\"\
  Message Received\");\n        }\n    };\n}\n```\n\n上述代码更改声明了一个处理器，并在该处理器中实现了 `handleMessage()`\
  \ 回调方法，当线程向处理器发送消息时，该方法会被调用。在此实例中，代码仅在用户界面的 `TextView` 对象上显示一个字符串。\n\n现在剩下的就是修改\
  \ `buttonClick()` 方法中创建的线程，在延迟完成后向处理器发送一条消息：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n请注意，唯一的更改是调用了处理器的 `sendEmptyMessage()` 方法。由于处理器目前没有对接收到的任何消息内容进行任何操作，因此它发送了一个空消息对象。\n\
  \n编译并运行应用程序，执行后，点击按钮。20 秒后，新文本将出现在用户界面的 `TextView` 对象中。\n\n## 60.7 向处理器传递消息\n\n\
  虽然上一个示例触发了 `handleMessage()` 处理器回调调用，但它没有利用消息对象向处理器发送数据。在教程的这一阶段，示例将被进一步修改，以便在线程和处理器之间传递数据。首先，`buttonClick()`\
  \ 方法中更新的线程将从系统获取字符串格式的日期时间，并将该信息存储在 `Bundle` 对象中。然后将调用处理器对象的 `obtainMessage()` 方法从消息池中获取一个消息对象。最后，在通过调用处理器对象的\
  \ `sendMessage()` 方法发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n接下来，更新处理器的 `handleMessage()` 方法，从消息中的 `bundle` 提取日期时间字符串并将其显示在 `TextView`\
  \ 上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper()) {\n    @Override\n\
  \    public void handleMessage(Message msg) {\n        Bundle bundle = msg.getData();\n\
  \        String string = bundle.getString(\"myKey\");\n        binding.myTextView.setText(string);\n\
  \    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮现在是否会在线程结束后在 `TextView` 对象上显示“Thread Complete”消息。\n\
  \n## 60.8 Java 并发\n\n到本章为止，我们只查看了直接创建和管理 Java 线程。虽然对于简单的多线程任务是可以接受的，但在处理涉及大量线程的复杂情况时，这可能是不够的。例如，启动和停止线程涉及系统开销。因此，创建一个并销毁大量线程的应用程序面临性能下降的风险。基本的线程\
  \ API 未提供用于调度或重复执行或从任务返回结果的预构建选项。\n\n通过使用 Java 并发框架（java.util.concurrent 部分）的 `Executor`\
  \ 类，可以克服直接操作线程的缺点。该框架允许创建活动线程池并管理如何将任务分配给这些线程。这允许现有线程重用于其他任务，而不断创建线程。\n\n该框架还提供了额外功能，包括任务完成后返回结果的能力（称为\
  \ `Callable` 任务）、检查线程状态以及调度任务在超时后或按重复间隔运行。\n\n## 60.9 使用 Runnable 任务\n\n探索此框架的第一步是修改\
  \ `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\n```java\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\n\npublic void buttonClick(View view) {\n\
  \    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(new\
  \ Runnable() {\n        public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \         Message msg = handler.obtainMessage();\n            Bundle bundle = new\
  \ Bundle();\n            bundle.putString(\"myKey\", \"Button Pressed\");\n    \
  \        msg.setData(bundle);\n            handler.sendMessage(msg);\n        }\n\
  \    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程中执行。然而，对方法的更改需要一些解释。首先，从系统\
  \ `Executors` 实例获取 `ExecutorService` 实例引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个仅包含一个线程的池。可以通过以下方式请求指定数量线程的池：\n\n`ExecutorService executor = Executors.newFixedThreadPool(10);`\n\
  \n\n\n\n```java\nlong endTime = System.currentTimeMillis() + 20 * 1000;\n```\n\n\
  从这一点开始，任务将一直运行直到完成。然而，一旦完成，执行服务将继续运行。如果你不再需要该服务，则应该将其关闭。\n\n## 60.10 关闭执行器服务\n\n\
  `ExecutorService` 提供了几种启动关闭的技巧。要通知服务在当前正在运行的任务完成后自动关闭，应该如下所示调用 `shutdown()` 方法：\n\
  \n```java\nexecutor.shutdown();\n```\n\n另一方面，调用 `shutdownNow()` 方法会停止服务上所有正在运行的任务，并取消对等待（pending）任务的处理：\n\
  \n```java\nexecutor.shutdownNow();\n```\n\n## 60.11 使用 Callable 任务和 Future\n\n如前所述，`ExecutorService`\
  \ 支持所谓的“Callable”任务，这些任务能够在任务完成后返回一个结果。在独立线程上运行的任务通常预计需要一些时间才能完成（否则它们从初可能就不需要在独立线程中运行了）。这引出了一个问题：如何将结果返回给启动任务的线程中的代码？这通过使用\
  \ `Future` 值类型来实现，它代表了未来某个时刻将提供的值。\n\n当执行可调用任务时，它会返回一个 `Future` 实例，应用可以使用该实例在任务完成后获取结果。要查看此操作，首先编辑\
  \ `activity_main.xml` 文件，添加一个标记为“Status”的按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 的方法：\n\n![](img/as_thread_example_ui.jpg)\n\n图 60-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行一个 `Callable` 任务，该任务配置为通过 `Future` 变量返回 `String` 值：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public void buttonClick(View view) {\n  \
  \      ExecutorService executor = Executors.newSingleThreadExecutor();\n       \
  \ future = executor.submit(new Callable<String>() {\n            public String call()\
  \ {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n  \
  \              while (System.currentTimeMillis() < endTime) {\n                \
  \    synchronized (this) {\n                        try {\n                    \
  \        wait(endTime - System.currentTimeMillis());\n                        }\
  \ catch (Exception e) {\n                        }\n                    }\n    \
  \            }\n                return(\"Task Completed\");\n            }\n   \
  \     });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，对启动任务的方式也做了一些更改：\n\n```java\nfuture = executor.submit(new\
  \ Callable<String>() {\n    public String call() {\n```\n\n这里的关键点是，我们现在不是向执行器服务提交\
  \ `Runnable` 任务，而是传递一个 `Callable` 任务（声明返回 `String` 值）。同样注意，任务的结果被赋值给 `Future` 变量。此外，使用了\
  \ `call()` 方法而不是之前在提交 `Runnable` 任务时使用的 `run()` 方法。最后，添加了一个返回语句来返回\n\n## 60.12 处理\
  \ Future 结果\n\n`Future` 变量用于存储结果。应用随后可以使用 `get()` 方法来检索该值。由于 `get()` 是一个阻塞调用，它将等待直到结果可用。\n\
  \n```java\nString result = null;\ntry {\n    result = future.get();\n} catch (ExecutionException\
  \ | InterruptedException e) {\n    e.printStackTrace();\n}\n```\n\n`get()` 方法的使用如下：\n\
  \n```java\nif (future != null future.isDone()) {\n    myTextView.setText(result);\n\
  } else {\n    myTextView.setText(\"Waiting\");\n}\n```\n\n完成更改后，运行应用并点击“Press Me”按钮。在任务运行期间，点击\
  \ Status 按钮。只要任务仍在运行，“Waiting”消息将显示在 TextView 中。然而，一旦任务完成，`isDone()` 方法将返回 true\
  \ 值，`get()` 方法将被调用，任务返回的字符串（“Task Complete”）将显示在 TextView 上。\n\n## 60.13 调度任务\n\n\
  最后一个要涵盖的领域涉及使用 `ExecutorService` 调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，需要在其上调用\
  \ `schedule()` 方法，传递要执行的 `Runnable` 任务以及时间延迟。`schedule()` 调用将返回一个 `ScheduledFuture`\
  \ 实例，可以使用它来识别任务预计开始之前的剩余时间。\n\n例如，下面的代码调度了一个任务在 30 秒后运行，并访问了剩余延迟：\n\n```java\nScheduledExecutorService\
  \ executor = Executors.newScheduledThreadPool(1);\n\nRunnable task = () -> {\n \
  \   // 在处执行任务的代码\n};\n\nScheduledFuture<?> future = executor.schedule(task, 30,\
  \ TimeUnit.SECONDS);\n\nlong delayRemaining = future.getDelay(TimeUnit.SECONDS);\n\
  ```\n\n同样，`ScheduledExecutorService` 可用于在可选的初始延迟后按固定的间隔重复执行任务。例如，下面的代码导致任务在初始 30\
  \ 秒延迟后每隔 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task, 30, 10, TimeUnit.SECONDS);\n\
  ```\n\n`scheduleAtFixedRate()` 方法无论之前调度的任务是否完成，都会启动任务的下一个实例。若要指定任务执行结束与下一次执行开始之间的固定时间间隔，请使用\
  \ `scheduleWithFixedDelay()` 方法。在以下示例中，第一个任务调度在 0 秒延迟后，随后的每次执行都会在前一个任务完成后 10 秒后进行：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n## 60.14 总结\n\n\n\n\n\n本章的目标是概述 Android 应用中的多线程处理。当应用程序在进程中首次启动时，运行时系统会创建一个主线程，随后启动的所有应用程序组件默认都会在该线程中运行。主线程的主要作用是处理用户界面，因此，在该线程中执行的任何耗时任务都会导致应用程序出现假死的现象。因此，将可能需要时间完成的任务在单独的线程中启动是关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，因此不应在主线程之外的任何线程对用户界面进行更改。可以通过在主线程创建一个 handler 来实现用户界面的更改，从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java Concurrent 框架的执行器服务。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果的返回以及执行调度。\n\
  \n## 61 在 Android 中进行运行时权限请求\n\n在前面的章节中创建的许多示例项目中，已对 `AndroidManifest.xml` 文件进行了修改，以请求应用程序执行特定任务的权限。例如，在某些情况下，请求了互联网访问权限以允许应用下载和显示网页。在此之前，在每种情况下，应用仅需向清单文件中添加请求，即可从用户处获得执行指定任务的权限。\n\
  \n然而，对于某些权限，在 Android 6.0 或更高版本上运行时，应用需要额外的步骤才能正常运行。这些所谓的“危险”权限中的第一个将在下一章遇到。不过，在到达这一点之前，本章将概述在最新版本的\
  \ Android 上运行时请求此类权限的涉及步骤。\n\n## 61.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来实施安全性。在\
  \ Android 6 引入之前，在应用安装到设备时总是会请求权限。例如，图 61-1 显示了通过 Google Play 安装应用时寻求各种权限的典型屏幕。\n\
  \n![](img/Image24251.jpg)\n\n图 61-1\n\n对于许多类型的权限，这种场景仍然适用于 Android 6.0 或更高版本上的应用。这些权限被称为**普通权限**，仍然要求在安装时由用户接受。第二类权限被称为**危险权限**，也必须以与普通权限相同的方式在清单文件中声明，但必须在应用程序首次启动时向用户请求。当发出此类请求时，它将以对话框的形式出现，如图\
  \ 61-2 所示：\n\n![](img/Image24341.jpg)\n\n图 61-2\n\n危险类别的权限完整列表包含表 61-1 中：\n\n| 权限组\
  \ | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDARWRITE_CALENDAR |\n| 摄像头 | CAMERA\
  \ |\n| 联系人 | READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS |\n| 位置 | ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION\
  \ |\n| 麦风 | RECORD_AUDIO |\n| 通知 | POST_NOTIFICATIONS |\n| 电话 | READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短信 | SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS\
  \ |\n| 存储 | MANAGE_EXTERNAL_STORAGEREAD_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE |\n\
  \n表 61-1\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许应用访问设备外部存储器上的所有文件，包括属于其他应用的文件。因此，只有当 Google\
  \ 在审核过程中验证需要此级别的访问权限时，权限才会对您的应用启用。为了在提交应用到 Google Play 商店之前对其进行测试，可以执行以下 `adb` 命令来临时为测试设备上的应用启用访问：\n\
  \n```bash\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE allow\n\
  ```\n\n可以通过以下方式关闭此模式：\n\n```bash\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE\
  \ default\n```\n\n## 61.2 创建权限示例项目\n\n从欢迎界面选择 New Project（新建项目）选项，在出现的新项目对话框中，点击\
  \ Next（下一步）按钮之前选择 Empty Views Activity 模板。\n\n在 Name 字段中输入 `PermissionDemo` 并指定\
  \ `com.ebookfrenzy.permissiondemo` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为\
  \ API 26: Android 8.0 (Oreo)，并将 Language 菜单更改为 Java。\n\n## 61.3 检查权限\n\nAndroid\
  \ Support Library 包含多个方法，可以在 Android 应用的代码中查找和管理危险权限。无论应用运行的 Android 版本如何，都可以安全地进行这些\
  \ API 调用，但只有在 Android 6.0 或更高版本上执行时才会执行有意义的任务。\n\n在应用尝试使用需要危险权限许可的功能之前，无论之前是否授予过权限，代码都必须检查是否已授予。这可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动引用和请求的权限作为参数传递。该方法将检查权限是否已授予，并返回与\
  \ `PERMISSION_GRANTED` 或 `PERMISSION_DENIED` 匹配的整数。\n\n在项目的 `MainActivity.java`\
  \ 文件中，修改代码以检查是否已授予应用录音权限：\n\n```java\npackage com.ebookfrenzy.permissiondemo;\n\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.pm.PackageManager;\nimport android.util.Log;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private final String TAG = \"PermissionDemo\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setupPermissions();\n    }\n\
  \n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission denied\");\n        }\n    }\n}\n```\n\n\
  编辑 `AndroidManifest.xml` 文件（位于 Project 窗口中的 app -> manifests 下），并添加以下行来请求权限：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.permissiondemo\" >\n\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <activity android:name=\".MainActivity\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n\n</manifest>\n\
  ```\n\n\n\n\n在设备或模拟器上运行应用，并打开 `Logcat` 工具窗口。请注意，尽管权限已添加到 manifest 文件中，但仍出现了“拒绝权限（permission\
  \ denied）”的消息。这是因为 Android 要求除了在 manifest 文件中添加请求外，应用必须在运行时请求危险权限。\n\n## 61.4 在运行时请求权限\n\
  \n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将以异步方式处理，并在任务完成后调用一个名为\
  \ `onRequestPermissionsResult()` 的方法。\n\n`requestPermissions()` 方法接收的参数包括当前 Activity\
  \ 的引用、所请求权限的标识符以及一个请求代码（request code）。请求代码可以是任意整数值，并将用于标识是哪个请求触发了对 `onRequestPermissionsResult()`\
  \ 方法的调用。修改 `MainActivity.java` 文件以声明请求代码并在权限检查失败时请求录音权限：\n\n```java\nimport androidx.core.app.ActivityCompat;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ String TAG = \"PermissionDemo\";\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n\n    @Override\n    private void setupPermissions() {\n        int permission\
  \ = ContextCompat.checkSelfPermission(this,\n                Manifest.permission.RECORD_AUDIO);\n\
  \        if (permission != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission to record denied\");\n            makeRequest();\n        }\n   \
  \ }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \                    @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission has been denied\");\n        } else {\n            Log.i(TAG, \"\
  Permission has been granted\");\n        }\n    }\n}\n```\n\n在模拟器或设备上编译并运行应用，注意到如图\
  \ 6-3 所示会出现一个请求录音权限的对话框。\n\n图 6-3\n\n点击应用按钮，并检查 Logcat 面板中显示“用户已授予权限（Permission\
  \ has been granted by user）”的消息。一旦用户授予了请求的权限，`checkSelfPermission()` 方法在后续调用中将返回\
  \ `PERMISSION_GRANTED`，直到用户卸载并重新安装应用，或者在设置中更改了应用的权限。\n\n## 6.5 为权限请求提供理由（Rationale）\n\
  \n如图 6-3 所示，用户可以拒绝请求的权限。在这种情况下，除非用户在点击“拒绝（Deny）”按钮之前选择了“不再询问（Never again）”选项，否则应用每次启动时都会继续请求权限。用户的反复拒绝可能表明用户不理解为什么应用需要该权限。因此，如果在请求时解释原因，用户更有可能授予权限。遗憾的是，无法更改请求对话框的内容包含此类解释。\n\
  \n最好的做法是将解释包含在一个独立的对话框中，该对话框可以在请求对话框向用户之前显示。这引出了何时显示此解释对话框的问题。Android 文档建议，只有当用户之前拒绝过该权限时才显示解释对话框，并提供了一个方法来识别此类情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，则返回\
  \ `true` 结果；如果之前未请求过，则返回 `false`。在结果为 `true` 的情况下，应用应该显示一个包含权限理由的对话框，一旦用户关闭了对话框，就应该重复权限请求。\n\
  \n要向示例应用添加此功能，请修改 `onCreate()` 方法，其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder = new AlertDialog.Builder(this);\n            builder.setMessage(\"Permission\
  \ to access the microphone is required for this app to record audio.\")\n      \
  \              .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝过请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，并在按钮上配置了监听器，以便在点击按钮时调用 `makeRequest()` 方法。如果之前未请求过权限，代码将直接进入权限权限。\n\n\
  ## 6.6 测试权限应用\n\n在执行测试的设备或模拟器会话上，启动“设置”应用，选择“应用（Apps）”选项，滚动并选择 PermissionDemo 应用。在应用设置屏幕上，点击卸载按钮移除应用。\n\
  \n重新运行应用，并在权限请求对话框出现时点击“不允许（Don’t allow）”按钮。停止并重启应用，验证理由对话框是否出现。点击 OK 按钮，并在权限请求对话框出现时点击“在使用应用时（While\
  \ using the app）”按钮。\n\n返回“设置”应用，再次选择“应用”选项，并从列表中选择 PermissionDemo 应用。一旦列出应用的设置，验证“权限”部分列出了“麦克风”权限：\n\
  \n![](img/as_permission_microphone.jpg)\n\n图 6-4\n\n## 6.7 总结\n\n在 Android 6.0 引入之前，应用请求访问某些功能的权限的唯一步骤是在应用程序\
  \ manifest 文件中添加适当的行。用户在安装应用时将收到许可许可提示。对于大多数权限来说仍然如此，但一组被认为是危险的权限组除外。被认为是危险的权限通常具有允许应用违反用户隐私的潜力，例如允许访问麦克风、联系人列表或外部存储。\n\
  \n\n\n\n如本章所述，基于 Android 6 或更高版本的应用现在必须在应用启动时向用户请求危险权限许可，并在清单文件中包含该权限请求。\n\n## 62\
  \ Android 通知教程\n\n通知提供了一种让应用程序在未运行或处于后台时向用户传达消息的方式。例如，消息应用可能会通知用户收到了来自联系人的新消息。通知可以分为本地通知和远程通知。本地通知是由运行在设备上的应用本身触发的。另一方面，远程通知由远程服务器启动并递送到设备上展示给用户看。\n\
  \n通知显示在从屏幕状态栏向下拉出的通知栏中，每个通知都可以包含某些操作，例如用于打开发送该通知的应用程序的按钮。Android 还支持直接回复（Direct\
  \ Reply）通知，该功能允许用户直接在通知面板内输入并提交对通知的回复。\n\n本章将概述在 Android 应用程序中实现本地通知的步骤。下一章（“Android\
  \ 直接回复通知教程”）将介绍直接回复通知的实现方法。\n\n## 62.1 通知概述\n\n当在 Android 设备上启动通知时，它会以图标的形式出现在状态栏中。例如，图\
  \ 62-1 显示了一个带有多个通知图标的状态栏：\n\n![](img/Image24252.jpg)\n\n图 62-1\n\n要查看通知，用户需要从状态栏开始向下滑动，以拉下通知栏，如图\
  \ 62-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\n图 62-2\n\n在运行 Android\
  \ 8 或更高版本的设备上，长按应用启动图标将显示与该应用相关的任何待处理通知，如图 62-3 所示：\n\n![](img/Image2442.jpg)\n\n\
  图 62-3\n\nAndroid 8 及后续版本还支持通知点，当有通知等待用户查看时，该点会出现在应用启动图标上。\n\n典型的通知会显示一条消息，并在点击时启动负责发布该通知的应用。通知还可能包含操作按钮，点击这些按钮可以执行与对应应用特定的任务。例如，图\
  \ 62-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存传入的消息：\n\n![](img/Image2450.jpg)\n\n图 62-4\n\n\
  用户还可能在通知中输入内联文本回复并将其发送给应用，如下方的图 62-5 所示。这允许用户在不将相应的应用调到前台的情况下对通知做出响应：\n\n![](img/Image2458.jpg)\n\
  \n图 62-5\n\n本章的剩余部分将详细介绍如何创建和发布一个包含操作的简单通知。关于直接回复支持的主将在下一章中介绍，标题为“Android 直接回复通知教程”。\n\
  \n## 62.2 创建 NotifyDemo 项目\n\n从欢迎界面上选择“新建项目（New Project）”选项，在弹出的新项目对话框中，点击“下一步（Next）”按钮之前选择“空视图\
  \ Activity（Empty Views Activity）”模板。\n\n在`Name`字段中输入 `NotifyDemo`，并将`com.ebookfrenzy.notifydemo`指定为包名。在点击完成（Finish）按钮之前，将最小\
  \ API 级别设置为`API 33: Android 13 (Tiramisu)`，并将语言菜单更改为 `Java`。\n\n## 62.3 设计用户界面\n\
  \n主 Activity 将包含单个按钮，其目的是创建并发布意图（intent）。在布局编辑器（Layout Editor）工具中找到并加载`activity_main.xml`文件，并删除默认的`TextView`组件。\n\
  \n在启用自动连接（Autoconnect）的情况下，从面板中将`Button`对象拖并放置到布局画布的中心，如图 62-6 所示。\n\n在布局中选中`Button`组件后，使用属性（Attributes）面板配置\
  \ `onClick` 属性，以调用名为 `sendNotification` 的方法。\n\n![](img/as_notification_ui.jpg)\n\
  \n图 62-6\n\n选中`Button`组件，将属性工具窗口中的文本属性更改为“Notify”，并将属性值提取为字符串资源。\n\n## 62.4 创建第二个\
  \ Activity\n\n在本例中，应用将包含第二个 Activity，该 Activity 将由用户从通知内部启动。通过右键点击位于`app -> java`下的`com.ebookfrenzy.notifydemo`包名，并选择`New\
  \ -> Activity -> Empty Views Activity`菜单选项显示新 Android Activity 对话框，向项目添加此新 Activity。\n\
  \n在`Activity Name`字段中输入`ResultActivity`并将布局文件命名为`activity_result`。由于此 Activity 在应用程序启动时不启动（它将通过通知内部的意图启动），因此在点击完成（Finish）按钮之前，确保禁用“启动器\
  \ Activity（Launcher Activity）”选项很重要。\n\n打开第二个 Activity 的布局（`app -> res -> layout\
  \ -> activity_result.xml`），并拖并放置一个`TextView`组件使其位于布局中心。编辑`TextView`的文本为“Result”，并将其提取为资源。\n\
  \n## 62.5 创建通知\n\n在应用程序发送通知之前，它必须创建一个通道（channel）。通道由一个唯一标识通道的 ID、一个名称和一个描述组成（只有后者会被用户看到）。通道是通过配置`NotificationChannel`实例并将其传递给`NotificationManager`类的`createChannel()`方法来创建的。在本例中，应用将包含一个名为“Notify\
  \ News”的通道。编辑`MainActivity.java`文件并实现在应用启动时创建通道的代码：\n\n```\n\n\n\n该代码声明并初始化了一个 `NotificationManager`\
  \ 实例，然后创建了一个低重要级别的新通道（其他选项为 high、max、min 和 none），并配置了名称（name）和描述（description）属性。通道中还添加了一系列可选设置，以自定义用户如何接收通知到达的告报。这些设置适用于所有发送到此通道的通知。最后，通过将通知通道对象传递给通知管理器实例的\
  \ `createNotificationChannel()` 方法来创建该通道。\n\n## 62.6 请求通知权限\n\n在测试应用程序之前，必须在应用程序的清单文件（manifest\
  \ file）中请求适当的权限。具体而言，应用程序需要向用户发送通知的权限。在项目（Project）工具窗口中，找到并双击 `AndroidManifest.xml`\
  \ 文件将其加载到编辑器中，并修改 XML 添加该权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n</manifest>\n```\n\n上述步骤足以确保当应用安装在运行 Android 6.0 之前的版本的设备上时，用户会启用通知权限。在 Android\
  \ 中，通知访问被归类为“危险权限”（dangerous permission），因为它赋予了应用损害用户隐私的可能。为了让示例应用在 Android 6 或更高版本的设备上运行，必须添加代码以在应用运行时请求权限。\n\
  \n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令（import directives）和一个常量，作为所请求权限的识别码：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n}\n```\n\n接下来，需要添加一个方法，该方法的目的是是接收所请求权限的告报。在\
  \ `MainActivity.java` 文件中，实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, NOTICATION_REQUEST_CODE);\n\
  \    }\n}\n```\n\n使用书书中[运行时请求权限](https://example.org/making-runtime-requests) 章节中概述的方法，上述方法通过传递识别码来验证请求已处理。在\
  \ `MainActivity.java` 文件中，实现该方法：\n\n```java\n@Override\npublic void onRequestResult(int\
  \ requestCode, String[] permissions, int[] grantResults) {\n    super.onRequestResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == NOTICATION_REQUEST_CODE) {\n\
  \        if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this, \"Notification Enabled\", Toast.LENGTH_SHORT).show();\n\
  \        }\n    }\n}\n```\n\n上述代码检查通知是否已授予。为了在 Android 13 或更高版本的设备上运行应用，确保启用通知点。在\
  \ `MainActivity.java` 文件中修改 `onCreate()` 方法：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    requestPermission(Manifest.permission.POST_NOTIFICATIONS, NOTIFICATION_CODE);\n\
  }\n```\n\n随着代码更改，编译并在运行 Android 13 的设备上运行应用。当出现所示的对话框时，点击允许按钮启用通知：\nOEBPS/image/enable_notifications.jpg\n\
  \n启动应用后，将其放入后台并打开设置。在设置中，选择应用，并在随后的屏幕上点击通知。通知屏幕应显示通知类别为激活状态：\nOEBPS/image/app_notifications.jpg\n\
  \n在继续之前，确保通知点已启用。虽然这不是示例的要求，但值得注意的是可以通过通知管理器的 `deleteChannel()` 方法删除通道，传递要删除通道的\
  \ ID：\n\n```java\nString channelID = \"com.ebookfrenzy.audioapp\";\nnotificationManager.deleteChannel(channelID);\n\
  ```\n\n## 62.7 创建并发布通知\n\n通知使用 `Builder` 类创建，并必须包含图标、标题和内容。打开 `MainActivity.java`\
  \ 文件并实现 `sendNotification()` 方法以构建通知：\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n\npublic void sendNotification(View view) {\n    String\
  \ channelID = \"com.ebookfrenzy.audioapp\";\n    Notification notification = new\
  \ Notification.Builder(MainActivity.this, channelID)\n        .setContentTitle(\"\
  示例通知\")\n        .setContentText(\"这是一个示例通知。\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(channelID)\n        .build();\n}\n```\n\n一旦构建完成后，就需要使用 `NotificationManager`\
  \ 实例的 `notify()` 方法进行发布。访问 `NotificationManager` 并发布通知的代码添加到 `sendNotification()`\
  \ 方法中：\n\n```java\nprotected void sendNotification(View view) {\n    int notificationID\
  \ = 101;\n    String channelID = \"com.ebookfrenzy.audioapp\";\n    Notification\
  \ notification = new Notification.Builder(MainActivity.this, channelID)\n      \
  \  .setContentTitle(\"新消息\")\n        .setContentText(\"你收到了新消息。\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(channelID)\n        .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n请注意，当发布通知时，它会被分配一个通知 ID。这可以是任何整数，并且以后可用于更新通知。\n\n编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏时，触摸并从状态栏向下滑动查看完整通知：\n\
  \n\n\n\n![](img/as_notification.jpg)\n\n图 62-9\n\n点击并按住通知查看更多信息：\n\n![](img/as_notification_details.jpg)\n\
  \n图 62-10\n\n接下来，将应用置于后台，导航到显示所有应用启动图标的主屏幕，并注意如图 62-11 中的箭头所示，`NotifyDemo`启动图标上出现了一个通知点：\n\
  \n![](img/as_notification_dot.jpg)\n\n图 62-11\n\n如果没有出现该圆点，请检查`Settings`应用中 `NotifyDemo`\
  \ 的通知选项，以确认是否已启用通知点（这正如本章前面概述的那样）。如果圆点仍未出现， touch 并长按设备主屏幕的空白区域，从弹出的菜单中选择`Home Settings`\
  \ 选项，并启用`Notification dots` 选项。\n\n在启动图标上长按将显示一个包含通知的弹出窗口：\n\n![](img/as_app_dot_detail.jpg)\n\
  \n图 62-12\n\n如果一个应用有多个待处理通知，长按菜单弹出框将包含通知计数（在图中突出显示）。此数字可以在构建通知时通过调用`setNumber()`\
  \ 方法在应用内部进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现方式，无论从何处访问，点击通知都没有效果。下一步是配置通知，以便在点击时启动一个 activity。\n\n## 62.8 从通知启动\
  \ Activity\n\n通知应该允许用户执行执行某些操作，例如启动相应的应用或响应通知采取其他操作。一个常见的需求是在用户点击通知时，启动属于该应用的 activity。\n\
  \n这种方法需要启动一个 activity，并配置一个启动该 activity 的 `Intent`。假设应用包含一个名为 `ResultActivity` 的\
  \ activity，则 intent 的创建方式如下：\n\n```java\nIntent resultIntent = new Intent(this,\
  \ ResultActivity.class);\n```\n\n此 intent 然后需要被封装在 `PendingIntent` 实例中。`PendingIntent`\
  \ 对象的设计旨在将 intent 传递给其他应用程序，本质上是授予这些应用程序在未来某个时刻执行该 intent 的权限。在这种情况下，`PendingIntent`\
  \ 对象被用于为通知系统提供一种方法在用户点击通知面板时启动 `ResultActivity` activity：\n\n```java\nPendingIntent\
  \ pendingIntent =\n    PendingIntent.getActivity(\n        this,\n        0,\n \
  \       resultIntent,\n        PendingIntent.FLAG_IMMUTABLE\n    );\n```\n\n剩下的工作是在通知构建过程中使用`setContentIntent()`\
  \ 方法分配 `PendingIntent` 对象。\n\n将这些更改整合在一起得到了一个修改后的 `sendNotification()` 方法，其内容如下：\n\
  \n```java\nimport android.app.PendingIntent;\nimport android.content.Intent;\nimport\
  \ android.graphics.drawable.Icon;\n// ...\n\nprotected void sendNotification(View\
  \ view) {\n    int notificationId = 101;\n    Intent resultIntent = new Intent(this,\
  \ ResultActivity.class);\n    PendingIntent pendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_IMMUTABLE\n            );\n    String CHANNEL_ID\
  \ = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n            .setContentTitle(\"Example Notification\")\n        \
  \    .setContentText(\"This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(CHANNEL_ID)\n            .setContentIntent(pendingIntent)\n\
  \            .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n编译并重新运行应用，点击按钮并显示通知栏。然而，这一次点击通知将导致 `ResultActivity` 启动。\n\n## 62.9 为通知添加操作\n\
  \n向通知添加交互性的另一种方法是创建操作（actions）。这些操作显示为通知消息下方的按钮，并程序化为点击时触发特定的 intent。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“Open”的动作，它会启动引用的 pending intent：\n\n```java\n\
  final Icon icon = Icon.createWithResource(MainActivity.this, android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n    .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法并运行应用。发布通知并注意通知中出现的 Open 动作（取决于 Android 版本，可能需要下拉通知面板才能显示\
  \ Open 动作）：\n\n![](img/as_notification.jpg)\n\n图 62-13\n\n点击动作将触发 pending intent\
  \ 并启动 `ResultActivity`。\n\n## 62.10 合叠通知\n\n如果一个应用倾向于定期发布通知，可能会出现这些通知迅速占用状态栏和通知栏的情况，从而为用户提供欠佳的体验。这对于每次收到突发新闻或新消息都会发送通知的新闻或消息应用尤为如此。例如，考虑图\
  \ 62-14 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 62-14\n\n现在想象如果有十甚至二十条新消息。为了避免这个问题，Android\
  \ 允许将通知合叠分组。\n\n要合叠通知，必须通过`setGroup()` 方法指定每个通知属于同一个组，并且发布并配置一个额外的摘要通知。例如，以下代码创建并发布了上述图\
  \ 62-14 所示的三个通知，但将它们合叠到了同一个组。代码还发布了一个作为摘要的通知：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_key_notify\";\nNotification.Builder builderSummary =\n    new Notification.Builder(this,\
  \ channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n       \
  \ .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have 3 new\
  \ messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You have a new message from Kassidy\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder builder2 =\n    new\
  \ Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info);\n\
  ```\n\n\n\n\n\n```java\n.setContentTitle(\"New Message\")\n.setContentText(\"You\
  \ have a new message from Caitlyn\")\n.setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Jason\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0\
  \ = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\nint notificationId3\
  \ = 103;\n\nnotificationManager.notify(notificationId1, builder1.build());\nnotificationManager.notify(notificationId2,\
  \ builder2.build());\nnotificationManager.notify(notificationId3, builder3.build());\n\
  notificationManager.notify(notificationId0, builderSummary.build());\n```\n\n当代码执行时，尽管应用程序发布了四条通知，状态栏中只会出现一个通知图标。在通知栏中，会显示一个汇总通知，列出每个组包通知中的信息：\n\
  \n![](img/Image2528.jpg)\n图 62-15\n\n继续向下滑动通知条目，可以展开面板以显示每个组包通知的详情：\n\n![](img/Image2536.jpg)\n\
  图 62-16\n\n## 62.11 总结\n\n通知为应用程序提供了一种在未运行或处于后台时向用户传递消息的方法。通知显示在状态栏和通知栏中。本地通知由运行的应用程序在设备上触发，而远程通知由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n正如本章所示，可以通过操作（actions）、意图（intents）和\
  \ `PendingIntent` 类配置通知为用户提供选项（例如启动活动或保存消息）。通知分组（Notification bundling）提供了一种分组通知的机制，为发布更多通知的应用程序提供了改进的体验。\n\
  \n## 63. Android 直接回复通知教程\n\n直接回复（Direct reply）是 Android 的一项功能，允许用户在通知中输入文本并将其发送到与通知相关的应用程序。这允许用户在不启动应用程序内活动的情况下直接回复通知中的消息。本章将基于上一章学到的知识，创建一个使用此通知特性的示例应用程序。\n\
  \n### 63.1 创建 DirectReply 项目\n\n从欢迎界面上选择“新建项目（New Project）”选项，在出现的新项目对话框中，点击“下一步（Next）”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在“名称（Name）”字段中输入 `DirectReply` 并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击“完成（Finish）”按钮之前，将最小 API 级别设置设置为 `API 33`：Android 13，并将语言菜单设置为 `Java`。按照第\
  \ 11.8 将项目迁移到视图绑定 部分列出的步骤修改项目以支持视图绑定。\n\n### 63.2 设计用户界面\n\n将布局文件 `activity_main.xml`\
  \ 加载布局工具。在启用自动连接（Autoconnect）的情况下，在现有的“Hello World!”标签下方添加一个 `Button` 对象，如图 63-1\n\
  图 63-1\n\n### 63.3 请求通知权限\n\n在项目（Project）窗口中，找到并双击 `AndroidManifest.xml` 文件，将其加载到编辑器中并修改\
  \ XML 添加权限元素（permission element）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n```\n\n.\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，用作所请求权限的请求标识代码：\n\
  \n.\n\n```java\nimport androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n```\n\n.\n\n```java\n\
  public class MainActivity extends AppCompatActivity {\n    \n\n.\n.\n```\n\n接下来，需要在类中添加一个方法，其目的是将请求的权限和相应的标识代码作为参数。留在\
  \ `MainActivity.java` 类中，如下所示实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n当请求被处理后，将在活动中调用方法并传递标识代码和请求结果。因此，下一步是在 `MainActivity.java` 文件中实现此方法：\n\
  \n```java\n@Override\npublic void onRequestPermissions(int requestCode, @NonNull\
  \ String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissions(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == NOTIFICATION_REQUEST_CODE)\
  \ {\n        if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this, \"Notification required\", Toast.LONG).show();\n\
  \        }\n    }\n}\n```\n\n在测试应用程序之前，需要在应用程序启动时调用新添加的 `requestPermission()` 方法。留在\
  \ `MainActivity.java` 文件中，如下修改 `onCreate()` 方法：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\
  \ NOTIFICATION_REQUEST_CODE);\n}\n```\n\n### 63.4 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加代码以创建一个新通道：\n\n```java\n.\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n.\n```\n\n```java\npublic class MainActivity extends\
  \ AppCompatActivity {\n.\n.\n    private NotificationManager notificationManager;\n\
  \    private final String channelID = \"com.ebookfrenzy.directreply.news\";\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n.\n.\n\
  \        notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID, \"DirectReply News\", \"Example News\
  \ Channel\");\n    }\n    protected void createNotificationChannel(String id, String\
