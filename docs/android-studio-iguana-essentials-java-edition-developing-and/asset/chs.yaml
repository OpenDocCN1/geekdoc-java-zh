  主详情用户界面由主列表组成，选择后会在详情面板中显示有关该项目的信息。主详情流（Primary/Detail Flow）是 Android 提供的一种模板，可以快速创建此类功能。\n\
  \n## 53 服务概览\n\nAndroid `Service` 类允许应用程序启动并执行后台任务。与广播接收器（broadcast receiver）旨在快速执行任务并退出不同，服务设计用于执行耗时较的任务（例如通过互联网连接下载文件或流媒体音乐）。\n\
  \n本章将概述可用的服务，包括绑定服务和 Intent 服务。\n\n### 53.1 Intent 服务\n\n如前所述，服务默认在启动它的组件相同的线程中运行。因此，任何需要由服务执行的\
  \ 密集型任务都应该在新线程中进行。\n\n`JobIntentService` 类是 `Service` 类的一个便利类，它为后台任务设置了工作线程，并异步处理每个请求。当服务处理完所有队列中的请求后，它就会退出。使用\
  \ `JobIntentService` 类只需要实现 `onHandleWork()` 方法，该方法包含为每个请求执行的代码。\n\n### 53.2 绑定服务\n\
  \n绑定服务允许启动组件与服务交互并获取其结果。这种交互也可以通过进程间通信（IPC）跨进程边界进行。例如，活动可能会启动一个服务来处理音频播放。该活动可能会包含一个用户界面，为用户提供暂停播放或跳到下一首的控制。\n\
  \n\n\n\n\n一个组件（在此文中称为客户端）通过调用 `bindService()` 方法启动并绑定到已绑定的服务。此外，多个组件可以同时绑定到某个服务。当客户端不再需要该服务绑定时，应该调用\
  \ `unbindService()` 方法。当最后一个绑定的客户端从服务中解绑时，Android 运行时系统将终止该服务。需要记住的是，绑定服务也可以通过调用\
  \ `startService()` 来启动。一旦启动，组件就可以通过 `bindService()` 调用绑定到它。当通过调用 `startService()`\
  \ 启动一个绑定服务时，即使在最后一个客户端从其处解绑后，它仍将继续运行。\n\n绑定服务必须包含 `onBind()` 方法的实现，该方法在服务首次创建以及其他客户端后续绑定到正在运行的服务时都会被调用。该方法的目的是向绑定的客户端返回一个类型为\
  \ `IBinder` 的对象，该对象包含了客户端与服务通信所需的所有信息。\n\n在实现客户端与绑定服务之间的通信时，推荐的技术取决于客户端和服务是处于同一个进程还是不同的进程中，以及该服务对客户端是否是私有的。本地通信可以通过扩展\
  \ `Binder` 类并在 `onBind()` 方法中返回一个实例来实现。而，进程间通信则需要 `Messenger` 和 `Handler` 的实现。这两种方法的详细细节将在后续章节中介绍。\n\
  \n## 53.3 服务的内部结构\n\n如前所述，服务必须创建为 `Android Service` 类（具体地说是 `android.app.Service`）或其子类（例如\
  \ `android.app.IntentService`）的子类。在子类化过程中，根据所创建服务的具体性质，必须重写以下一个或多个父类回调方法：\n\n- `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 方法启动服务时，调用此方法。对于绑定服务，不需要实现此方法。\n- `onBind()` – 当组件通过调用\
  \ `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象，以便于与客户端进行通信。\n- `onCreate()`\
  \ – 意用于执行初始化任务，该方法在调用 `onStartCommand()` 或第一次调用 `onBind()` 方法之前立即被调用。\n- `onDestroy()`\
  \ – 当服务被销毁时调用。\n- `onHandleWork()` – 仅适用于 `JobIntentService` 子类。此方法被调用以处理服务的逻辑。它在与主应用程序不同的线程中执行。\n\
  \n注意，`IntentService` 类包含了它自己的 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要实现这些方法。\n\
  \n## 53.4 控制销毁服务的重启选项\n\n`onStartCommand()` 回调方法需要返回一个整数值，以定义当 Android 运行时系统销毁服务时，该服务应该发生什么。这些方法的可能的返回值如下：\n\
  \n- `START_NOT_STICKY` – 告知系统，如果服务被销毁，除非有待交付的意图（intent），否则不应重启服务。\n- `START_STICKY`\
  \ – 表示如果销毁发生在 `onStartCommand()` 方法返回后，则应在销毁后尽快重启服务。如果没有待交付的意图，则调用 `onStartCommand()`\
  \ 回调方法并传入 `NULL` 意图值。服务被销毁时正在处理的意图将被丢弃。\n- `START_REDELIVER_INTENT` – 表示如果服务在从 `onStartCommand()`\
  \ 回调方法返回后销毁，则应该重启服务，并将当前意图重新递送给 `onStartCommand()` 方法，随后是任何其他待处理的意图。\n\n## 53.5\
  \ 在 Manifest 文件中声明服务\n\n为了使服务可用，必须首先在清单文件中声明它。这涉及将配置适当的 `<service>` 元素嵌入现有的 `<application>`\
  \ 条目中。至少，`<service>` 元素必须包含一个声明服务类名的属性，如下 XML 片段所示：\n\n```xml\n<application\n  \
  \  android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \ >\n    <activity\n        android:label=\"@string/app_name\"\n        android:name=\"\
  .MainActivity\" >\n        <intent-filter>\n            <action android:name=\"\
  android.intent.action.MAIN\" />\n            <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n        </intent-filter>\n    </activity>\n    <service android:name=\".MyService\"\
  >\n</application>\n```\n\n默认情况下，服务被声明为公共，因为它们可以被所在包之外的组件访问。要将服务设为私有，必须在 `<service>`\
  \ 元素内将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\" android:exported=\"false\"/>\n```\n\n在处理 `JobIntentService` 时，清单声明还必须如下所示请求\
  \ `BIND_JOB_SERVICE` 权限：\n\n```xml\n<service\n    android:name=\".JobIntentService\"\
  \n    android:permission=\"android.permission.BIND_JOB_SERVICE\" />\n```\n\n如前所述，服务默认在与调用组件相同的进程中运行。要强制服务运行在自己的进程中，请向\
  \ `<service>` 元素添加 `android:process` 属性，并声明一个以冒号（:`）开头的进程名：\n\n```xml\n<service\
  \ android:name=\".MyService\" android:exported=\"false\" android:process=\":myprocess\"\
  />\n```\n\n冒号前缀表示新进程对本地应用程序私有。然而，如果进程名是以小写字母而不是冒号开头，则该进程是全局的，供其他组件使用。\n\n最后，利用与\
  \ Activity 相同的意图过滤器机制，服务也可以向设备上的其他应用程序宣告其能力。关于意图过滤器的更多细节，请参阅“Android 意图概览”章节。\n\n\
  ## 53.6 在系统启动时启动服务\n\n考虑到服务的特性，在 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器来实现，并配置意图过滤器监听系统的\
  \ `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器将调用相应的服务并返回。注意，为了运行，此类广播接收器必须请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 53.7 总结\n\nAndroid 服务是一种强大的机制允许允许在后台执行任务。服务一旦启动，无论调用它的应用程序是否处于前台任务，即使启动服务的组件被销毁，它都将继续运行。\n\
  \n服务通过继承 `Android Service` 类来实现。绑定服务为其他客户端组件提供了通信接口，通常一直运行到最后一个客户端从服务中解绑。\n\n\n\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程来处理 CPU 密集型任务。通过对应用程序清单文件（manifest\
  \ file）中相应的 `<service>` 项进行少量配置更改，可以在单独进程中启动远程服务。\n\n`IntentService` 类（Android `Service`\
  \ 类的子类）提供了一种方便的机制，用于在独立的辅助线程中处理异步服务请求。\n\n# 54. Android Intents 概述\n\n读到本书的这一阶段，读者应该清楚\
  \ Android 应用程序由一个或多个活动（activities）等组成。然而，一个尚未详细介绍的领域是一个活动触发另一个活动启动的机制。正如标题为“Android\
  \ 应用剖析”#App_Anatomy.xhtml__idTextAnchor278 是一个活动可以启动另一个活动的消息传递系统。例如，一个活动可以发出一个意图来请求启动位于同一应用程序中的另一个活动。Intents\
  \ 的概念还超出了此，它允许活动请求设备上任何其他已配置权限且已适当注册的活动的服务。例如，考虑应用程序中的一个活动，它需要加载并向用户显示一个网页。应用程序不需要包含第二个活动来执行此项任务，代码可以向\
  \ Android 运行时发送一个意图，请求任何已注册显示网页能力的活动的服务。运行时系统会将请求与设备上的可用活动进行匹配，并启动匹配的活动，或者在存在多个匹配项的情况下，允许用户决定使用哪种活动。\n\
  \nIntents 还允许数据从发送活动传输到接收活动。例如，在之前述述的场景中，发送活动需要将要显示的网页的 URL 发送给第二个活动。同样，接收活动也可以配置为在完成所需任务后向发送活动返回数据。\n\
  \n虽然在后面的章节中才会介绍，但值得强调的是，除了启动活动外，int 还用于启动并与服务及广播接收器（broadcast receivers）进行通信。\n\n\
  Intents 分为显式或隐式。\n\n## 54.2 显式意图\n\n显式意图通过引用目标活动的组件名称（即类名）来请求启动特定的活动。当启动与发送活动位于相同应用程序的活动时，这种方法最为常见（因为开发者知道类名）。\n\
  \n显式意图通过创建 `Intent` 类的实例来发出，传递活动上下文环境（activity context）和要启动的活动的组件名称。然后调用 `startActivity()`\
  \ 方法，并将意图对象作为参数传递。例如，以下代码段发出了启动类名为 `ActivityB` 活动的意图：\n\n```java\nIntent i = new\
  \ Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n在通过启动意图对象之前，可以通过调用意图对象的\
  \ `putExtra()` 方法将数据添加到意图对象中，从而传输到接收活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，向意图中分别添加了键为 `\"\
  myString\"` 和 `\"myInt\"` 的 `String` 和整数值：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  );\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为 `Bundle` 对象的一部分接收数据，该对象可以通过调用\
  \ `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()` 方法返回启动该活动的意图，而 `Intent`\
  \ 类的 `getExtras()` 方法返回一个包含数据的 `Bundle` 对象。例如，提取传递给 `ActivityB` 的数据值：\n\n```java\n\
  Bundle extras = getIntent().getExtras();\nif (extras != null) {\n    String myString\
  \ = extras.getString(\"myString\");\n    int myInt = extras.getInt(\"myInt\");\n\
  }\n```\n\n当使用意图在同一应用程序内启动其他活动时，这些活动必须在应用程序清单文件中文件中列出。以下 `AndroidManifest.xml` 内容为包含名为\
  \ `ActivityA` 和 `ActivityB` 的活动的应用程序正确配置：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.MAIN\"\
  \ />\n                <category android:name=\"android.category.LAUNCHER\" />\n\
  \            </intent-filter>\n        </activity>\n        <activity\n        \
  \    android:name=\"ActivityB\"\n            android:label=\"ActivityB\" />\n  \
  \  </application>\n</manifest>\n```\n\n## 54.3 从活动返回数据\n\n如上一节示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个活动（我们将其称为\
  \ `ActivityA`）。然而，这可以通过启动 `ActivityB` 作为子活动（sub-activity）来实现。通过创建 `ActivityResultLauncher`\
  \ 实例可以启动子活动。通过调用 `registerForActivityResult()` 方法创建 `ActivityResultLauncher` 实例，并以\
  \ lambda 形式传递回调处理器。当子活动返回时，将调用此处理器并传递返回数据。一旦创建了 `ActivityResultLauncher` 实例，就可以带有意图参数调用来启动子活动。创建\
  \ `ActivityResultLauncher` 的代码通常如下：\n\n```java\nActivityResultLauncher<Intent> startForResult\
  \ = registerForActivityResult(\n    new ActivityResultContracts.StartActivity(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 处理返回数据的代码\n            }\n        }\n    });\n```\n\n一旦启动器就绪，就可以这样调用它并传递要启动的意图：\n\
  \n```java\nIntent i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n\
  ```\n\n为了向父活动返回数据，子活动必须实现 `finish()` 方法，该方法的目的是创建一个包含要返回数据的新意图对象，然后调用闭包活动的 `setResult()`\
  \ 方法，传递结果代码和包含返回数据的意图。结果代码通常是 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求使用自定义值。如果子活动崩溃，父活动将收到\
  \ `RESULT_CANCELED` 结果代码。\n\n例如，以下代码说明了典型的子活动 `finish()` 方法的代码：\n\n```java\npublic\
  \ void finish() {\n```\n\n\n\n\n\n```java\nIntent data = new Intent();\ndata.putExtra(\"\
  returnString1\", \"Message to parent activity\");\nsetResult(RESULT_OK, data);\n\
  super.finish();\n```\n\n## 54.4 隐式意图 (Implicit Intents)\n\n显式意图引用的是要启动的 Activity\
  \ 的类名，与之不同，隐式意图通过指定要执行的操作（action）和接收 Activity 所需处理的数据类型来识别要启动的 Activity。例如，一个类型为\
  \ `ACTION_VIEW` 的操作配合以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动一个支持网络浏览器的 Activity。以下隐式意图在\
  \ Android 设备上执行时，将导致指定的网页在网络浏览器 Activity 中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n\
  \        Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n\
  ```\n\n当 Activity 发出上述隐式意图时，Android 系统将通过一种称为“意图解析”（intent resolution）的过程，在设备上搜索已注册能够处理\
  \ `HTTP` 方案数据的 `ACTION_VIEW` 请求的 Activity。在系统使用隐式意图启动 Activity 之前，用户必须验证或启用该 Activity。如果这两个条件都不满足，意图将不会启动该\
  \ Activity。在探索这两个选项之前，我们首先需要谈论意图过滤器（intent filters）。\n\n## 54.5 使用意图过滤器 (Using Intent\
  \ Filters)\n\n意图过滤器是 Activity 向 Android 意图解析过程“宣告”其支持的操作和数据处理能力的机制。这些声明还包括了执行链接验证过程所需的设置。下面的\
  \ `AndroidManifest.xml` 文件展示了名为 `MyWebView` 的应用中名为 `WebActivity` 的 Activity 的配置，并配置了恰当的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest>\n    <application\n\
  \        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyWebView\"\
  >\n        <activity\n            android:name=\"WebActivity\"\n            android:exported=\"\
  true\">\n            <intent-filter android:autoVerify=\"true\">\n             \
  \   <action android:name=\"android.intent.action.VIEW\" />\n                <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n                <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n                <data android:scheme=\"\
  https\" />\n                <data android:host=\"www.ebookfrenzy.com\"/>\n     \
  \       </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n该清单文件配置了 `WebActivity` Activity，当意图包含 `https://www.ebookfrenzy.com` URL 时，响应来自另一个\
  \ Activity 的隐式意图并启动。例如，以下代码将启动 `WebActivity` Activity（假设用户已验证或启用了 `MyWebView` 应用链接）：\n\
  \n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n        Uri.parse(\"\
  https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n## 54.6 自动链接验证\
  \ (Automatic Link Verification)\n\n使用网页链接在 Android 设备上启动 Activity 被认为存在潜在的安全风险。为了降低这种风险，用于启动意图的链接要么必须经过自动验证，要么由用户在设备上手动添加为支持链接。要启用自动验证，目标\
  \ Activity 中对应的意图声明必须将 `autoVerify` 设置为 `true`，如下：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n    ...\n</intent-filter>\n```\n\n接下来，链接 URL 必须与链接所属的网站关联。这是通过创建一个名为 `assetlinks.json`\
  \ 的数字资产链接（Digital Assets Link）并将其安装在网站的 `.well-known` 文件夹实现的。数字资产链接包含一个 `relation`\
  \ 语句（授权目标应用使用网站链接启动）和一个 `target` 语句（声明了该项目的伴侣包名和 SHA-256 指纹）。一个典型的资产链接例如，内容如下：\n\
  \n```json\n[{\n  \"relation\": [\"delegate_permission/common.all_urls\"],\n  \"\
  target\": {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"com.ebookfrenzy.webview\"\
  ,\n    \"sha256_cert_fingerprints\": [\"<certificate fingerprint>\"]\n  }\n}]\n\
  ```\n\n注意，你可以手动创建此文件，也可以使用以下 URL 提供的在线工具生成：https://developers.google.com/digital-asset-links/tools/generator。在开发\
  \ Android 应用时，`namespace` 值始终设置为 `android_app`，而 `package_name` 对应于要启动的应用。最后，证书指纹是用于构建应用的哈希值。\n\
  \n当你在测试应用时，这将是包含在 `debug.keystore` 中的证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：`\\\
  Users\\<user name>\\.android\\debug.keystore`。在 macOS 和 Linux 系统上，可以在 `$HOME/.android/debug.keystore`\
  \ 找到文件。一旦找到文件，可以在终端或命令提示符中运行以下命令获取 SHA 256 指纹：\n\n```bash\nkeytool -list -v -keystore\
  \ <path to debug.keystore file>\n```\n\n当提示密码时，输入 `android`，随后将出现输出，包括 SHA 256 指纹：\n\
  \nCertificate fingerprints:\nSHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9D\n\
  SHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:AD:6E:3C:64:A9:29\n\
  \n当你准备好构建应用的发布版本时，必须确保将发布版本的 SHA 256 指纹添加到资产文件中。有关生成发布密钥库文件的详细信息在“创建、测试和上传 Android\
  \ 应用”章节中有所介绍。一旦你有了发布版密钥库文件，运行上述 `keytool` 命令获取指纹。\n\n一旦你将数字资产文件放在网站的正确位置，在设备或模拟器上安装应用，并等待\
  \ 30 秒让链接验证。要检查验证状态，可以在终端运行以下命令：\n\n```bash\nadb shell pm get-app-links --user cur\
  \ com.example.webview\n```\n\n输出应包含链接已验证的确认：\n\n```text\ncom.example.webview:\n\
  \  ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b06ec\n  Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:AD:6E:3C:64:A9:29]\n\
  \  Domain verification state:\n    www.ebookfrenzy.com: verified\n  User 0:\n  \
  \  Verification link handling allowed: true\n  Selection state:\n    Disabled:\n\
  \      www.ebookfrenzy.com\n```\n\n也可以从设备上的设置应用内部检查状态，步骤如下：\n\n1. 启动设置应用。\n2. 从主列表中选择应用（Apps）。\n\
  3. 在已应用列表中找到并选择你的应用。\n4. 在应用的设置页面上，选择“默认打开”（Open by Default）选项。\n\n在应用的设置页面上选择“默认打开”。进入后页面应显示链接已验证，如图\
  \ 54-1 所示：\n\n要查看哪些链接已验证，点击上图箭头所示的详情按钮，以显示以下面板：\n\n\n\n\n\n`assetlinks.json` 文件可以包含多个数字资产链接，允许单个网站与多个应用相关联。如果你无法使用自动链接验证，请在你的应用中添加代码以提示用户手动启用链接。\n\
  \n## 54.7 手动启用链接\n\n在无法使用上述步骤自动验证链接的情况下，唯一的选项是请求用户手动启用应用链接（app links）。这涉及启动目标应用在“设置”应用中的“默认打开”（Open\
  \ by Default）屏幕，用户可以在该界面启用链接。\n\n由于“默认打开”屏幕的突然出现可能会让普通用户感到困惑，建议在启动“设置”应用之前显示一个说明性对话框。\n\
  \n为了给用户提供手动启用链接的选项，在尝试启动意图（intent）之前需要执行以下代码：\n\n```java\n// 此处编写代码以显示对话框，解释需要启用链接\n\
  \nIntent intent = new Intent(\n        Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \        Uri.parse(\"package:com.ebookfrenzy.mywebview\"));\nstartActivity(intent);\n\
  ```\n\n上面的示例代码将为我们的目标应用 MyWebView 显示“默认打开”设置屏幕，用户可以在其中点击“添加链接”（Add Link）按钮：\n\n\
  ![](img/as_links_add_link.jpg)\n\n图 54-3\n\n点击后，将出现一个对话框，并初始化通过意图传递的链接。可以通过勾选复选框如图\
  \ 54-4 所示来启用它：\n\n![](img/as_adding_support_link.jpg)\n\n图 54-4\n\n## 54.8 检查意图可用性\n\
  \n假设某个活动（activity）对于某个特定意图（intent）可用是不明智的，特别是因为缺少匹配的动作（action）通常会导致应用程序崩溃。幸运的是，在意图发送到运行时系统之前，可以识别活动对于特定意图的可用性。可以使用以下方法来识别指定意图动作类型对应的活动可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list =\n   \
  \         packageManager.queryIntentActivities(intent,\n                    PackageManager.MATCH_DEFAULT_ONLY);\n\
  \    return list.size() > 0;\n}\n```\n\n## 54.9 总结\n\n意图（Intents）是一个 Android 活动启动另一个活动的消息机制。显式意图（explicit\
  \ intent）通过类名引用接收活动来引用要启动的特定活动。显式意图通常（但不仅限于）用于启动同一应用程序内的活动。隐式意图（implicit intent）指定要执行的动作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动进行启动。隐式意图通常用于启动位于不同应用程序中的活动。\n\n在处理隐式意图时，安全限制要求用户在启动意图之前自动验证或手动启用包含意图活动目标的应用。自动验证涉及在与链接\
  \ URL 对应的网站上放置数字资产链接文件（Digital Assets Link file）。\n\n只有当一个活动作为发送活动的子活动（sub-activity）启动时，它才能向接收活动发送数据。活动通过在应用程序清单文件中指定意图过滤器（intent\
  \ filters）来向 Android 意图解析过程声明功能。发送活动和接收活动都必须请求适当的权限来执行任务，例如访问设备联系人数据库或互联网。\n\n在涵盖意图理论后，接下来的几章将在\
  \ Android Studio 中创建一些示例，将显式和隐式意图投入实践。\n\n## 55. Android 显式意图 – 实例教程\n\n标题为 Android\
  \ 意图概览的章节涵盖了使用意图启动活动的理论。本章将通过创建一个示例应用程序将该理论付诸实践。\n\n在本章创建的 Android Studio 应用项目将演示如何使用显式意图启动活动，包括在发送和接收活动之间传输数据。下一章（Android\
  \ 隐式意图 – 实例教程）将演示使用隐式意图。\n\n## 55.1 创建显式意图示例应用\n\n从欢迎界面选择“新建项目”（New Project）选项，在出现的新项目对话框中，点击“下一步”（Next）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `ExplicitIntent`，并指定 `com.ebookfrenzy.explicitintent`\
  \ 为包名。在点击“完成”（Finish）按钮之前，将最低 API 级别设置改为 API 26: Android 8.0 (Oreo)，并将语言菜单更改为 Java。按照\
  \ 11.8 将项目迁移到 View Binding 节列出的步骤，将项目转换为使用视图绑定（view binding）。\n\n## 55.2 设计 MainActivity\
  \ 的用户界面布局\n\n`MainActivity` 的用户界面将由一个 `ConstraintLayout` 视图组成，包含 `EditText`（纯文本）、`TextView`\
  \ 和 `Button` 视图，分别名为 `editText1`、`textView1` 和 `button1`。使用 Project 工具窗口找到 `activity_main.xml`\
