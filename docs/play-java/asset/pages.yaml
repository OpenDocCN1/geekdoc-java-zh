  md: '# CHAPTER 4 An enterprise app, Play-style


    +   - Independent deployment of components


    +   - Intermediary components to reduce latency, enforce security, and encapsulate
    legacy systems


    If we translate this enterprise term, it means greater interoperability between
    applications, standard ways to produce interfaces using predefined operations
    (for example, GET, PUT, POST, or DELETE), and loose coupling between components.
    This is exactly what enterprise applications are looking for.


    The REST style describes six architectural constraints:


    +   - Client-server—A uniform interface separates clients from servers. This separation
    of concerns means that, for example, clients are not concerned with data storage,
    which remains internal to each server, so that the portability of client code
    is improved. Servers are not concerned with the user interface or user state,
    so servers can be simpler and more scalable. Servers and clients may also be replaced
    and developed independently, as long as the interface between them is not altered.


    +   - Stateless—The-server communication is further constrained by no client context
    being stored on the server requests. Each request from any client contains all
    of the information necessary to serve the request, and any state is held in the
    client.


    +   - Cacheable—As on the World Wide Web, clients can cache responses. Responses
    must therefore, implicitly or explicitly define themselves as cacheable or not
    to prevent clients reusing or inappropriate data in response to further requests.
    Well-managed caching partially or completely eliminates client interactions, further
    improving scalability and performance.


    +   - Layered system—A client cannot ordinarily tell whether it''s connected directly
    to the server or to an intermediary along the way. Intermediary servers may improve
    scalability by enabling load-balancing and by providing shared caches.


    +   - Code on demand (optional)—Servers can temporarily extend or customize the
    functionality of a client by sending executable code. Examples of this include
    client-side scripts as JavaScript.


    +   - Uniform interface—The uniform interface between clients and servers, discussed
    ahead, simplifies and decouples the architecture, which enables each part to evolve
    independently.


    Complying with these constraints and conforming to the REST architectural style
    enables any kind of distributed hypermedia system to have desirable emergent properties,
    such as performance, scalability, simplicity, modularity, visibility, portability,
    and reliability. The nature of Play enforces these principles, which means it
    has never been easier to implement a RESTful web application than with Play.


    Going back to an enterprise context, when creating a new application, on a high
    level, we want to:'
