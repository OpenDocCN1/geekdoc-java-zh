    # 2.2 A New Play application in Eclipse


    First of all, you need to generate the Eclipse-specific files that instruct Eclipse
    how to load your application and its dependencies and how to build it. Play generates
    the necessary files for you when you run the eclipse command from the Play console.

    Once these files have been generated, Eclipse will be able to recognize your application''s
    directory as an Eclipse project, and can import it directly. To do so, use the
    Import command under the File menu in Eclipse''s menu bar. When Eclipse asks you
    what want to import, go to General > Existing Projects into Workspace. On the
    next screen, click Browse to select your application''s root directory, and Eclipse
    will recognize the project as figure 2.3 shows. Click the Finish button, and you''re
    all done setting up your Eclipse project.


    # 2.7 NetBeans


    NetBeans is another well-known and widely used Java IDE. It is open source and
    free to use. NetBeans 7.3 supports Play natively. All you need to do is to install
    the NBPlay plugin in NetBeans IDE. To do so, go to http://plugins.netbeans.org/plugin/47637/.'
