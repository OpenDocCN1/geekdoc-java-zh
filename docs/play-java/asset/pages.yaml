  md: "# Using to route URLs to action methods\n\n# A about simple data binding\n\n\
    Type conversion is handled automatically by Play, so you don't have to handle\
    \ the conversion from Strings and other types. The automatic conversion is called-binding\
    \ values from the HTTP requests (which are strings by definition) to a Java type.\
    \ In chapter 6, we will explain how Play can bind to other types. Binding is also\
    \ part of the translation process from HTTP to your Java code.\n\nThis is a really\
    \ nice feature that allows us to concentrate on the problem at hand. If you were\
    \ using Servlet or any other framework, you'd probably have to write something\
    \ along the lines of the following listing.\n\n# 5.7 A conventional servlet method\n\
    \n```\npublic void doGet(HttpServletRequest request, HttpServletResponse response)\
    \ throws ServletException, IOException {\ntry {\n    final String id = request.getParameter(\"\
    id\");\n    final Long code = Long.parseLong(id);\n    // Process...\n} catch\
    \ (NumberFormatException e) {\n    final int status = HttpServletResponse.SC_BAD_REQUEST;\n\
    \    response.sendError(status, e.getMessage());\n}\n```\n\nPlay takes care of\
    \ this for you. Now you'll only see the message between brackets (in 5.11) while\
    \ developing. In production, the detailed information is left out. Now let's get\
    \ to the discussion about dynamic route parts.\n\nWhen using this syntax to define\
    \ dynamic path parts, each parameter will match exactly one path, which means\
    \ each part between forward slashes (or the start of the path).\n\nBut you might\
    \ sometimes want more flexibility. If you want a dynamic path more than one request\
    \ path segment, separated by forward slashes, you can define a dynamic path using\
    \ the *id syntax, with the rest of the path for the parameter.\n\nFor example,\
    \ let's say that we want to bind to our product image. The route definition is\
    \ follows:\n\n```\nGET /product/image/*imagePath controllers.Products.downloadImage(imagePath:\
    \ String)\n```\n\nIf we issue a request like GET /products/image/29929/paperclip.jpg,\
    \ the imagePath value will be 29929/paperclip.jpg.\n\nIf you know what regular\
    \ expressions are, you can also define your regular expression for the dynamic\
    \ parts using the $id<regex> syntax:"
