  md: "As a reminder, when an HTTP request is made, Play 2 parses the request header.\
    \ Then the request body is received. Next Play 2 parses the body, as explained\
    \ in chapter 9. The next thing is to send the HTTP response. An HTTP response\
    \ is a set of response headers, followed by a response body. Filters act just\
    \ after Play 2 parses the HTTP headers of an incoming request and the body is\
    \ parsed.\n\nIn Play 2, filter is more of a Scala feature than Java. But it's\
    \ still possible to create a filter in Java, even if some parts might be strange\
    \ to a normal Java developer. Let's see how we can create our basic authentication\
    \ filter.\n\nFirst, we need to create a new BasicAuthenticationFilter class in\
    \ the utils package:\n\n```\nwarehouse\n  app\n    utils\n      BasicAuthenticationFilter.java\n\
    \  conf\n  public\n  project\n  test\n```\n\nA filter implements the EssentialFilter\
    \ interface. This interface has only one method, which takes an EssentialAction\
    \ and returns an EssentialAction. An EssentialAction is an interface that essentially\
    \ represents what needs to be sent back to the client: HTTP headers and body.\
    \ For example, an OK response is an EssentialAction with an HTTP header response\
    \ code 200 and a body text ok. In our case, a filter allows you to chain EssentialActions\
    \ to a piece of code to them. In our case, we want to check for an Authorization\
    \ header, and if the username and password included in this header are valid,\
    \ proceed with the next EssentialAction. EssentialActions are chained one after\
    \ another—all we need to implement is our EssentialAction.\n\nBecause we're using\
    \ Scala from Java, we need to slightly adapt our code. We're going to dive into\
    \ the Play 2 mechanism. The first thing to do is to create an abstract class that\
    \ will allow us to reuse Scala functions property and extends the EssentialAction\
    \ interface. This is easily done with the following code. We won't go into details,\
    \ but the AbstractFunction is a Scala-Java bridge provided by the Scala library.\n\
    \n```\npublic abstract class JavaEssentialAction extends\n  AbstractFunction<RequestHandler,\
    \ Iterate<byte[], Result>>\n  implements EssentialAction\n```\n\nWe're now ready\
    \ to implement our BasicAuthenticationFilter. The following listing shows the\
    \ complete source code of our basic authentication filter."
