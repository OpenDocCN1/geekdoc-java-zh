    \ compiled into a class with the name views.html(template). In this case, we created\
    \ a compiled template under the views/products/ directory, the corresponding class\
    \ is views.products.list.\n\nWhen we render the template, the generated classes\
    \ contain a render method. In Play, templates are type-safe, which means the render()\
    \ method expects a certain number of parameters of the correct types. In this\
    \ case, we have to pass the products as a parameter. All of this will be explained\
    \ in more detail in chapter 8.\n\nWhat matters to us at the moment is to understand\
    \ how we send HTML from our controller. In chapter 3, we rendered the template\
    \ and immediately passed it the ok() method, like so:\n\n```\npublic static Result\
    \ list() {\n  return ok(list.render(products));\n}\n```\n\nThis is the most concise\
    \ way to render a template and return a Result that wraps the rendered content,\
    \ but we could also have used an intermediary variable, like so:\n\n```\npublic\
    \ static Result list() {\n  Html renderedTemplate = list.render(products);\n \
    \ return ok(renderedTemplate);\n}\n```\n\nAs you can see, the template rendering\
    \ doesn't simply return a string containing HTML; it actually returns an object\
    \ of type play.api.templates.Html. That class is a subtype of play.mvc.Content,\
    \ which is a type that is used as a parameter for the ok() method (and all result\
    \ methods, for matter)."
