  md: "# CHAPTER 12 Testing your application\n\n# 12.3 Integration testing\n\nIntegration\
    \ testing is all about testing your application's behavior when dealing with the\
    \ \"outside world.\" This can be anything from a user's web browser to the communication\
    \ with another web service—whether you're calling it from your application, or\
    \ it's calling your application.\n\nIntegration testing differs from the way we've\
    \ been testing so far. Up to now, we've been testing our application's code directly\
    \ by calling methods and checking the results. Integration testing tests your\
    \ application as a whole, by verifying the behavior of its external interface\
    \ (your UI or web service API).\n\n# 12.3.1 Testing your HTTP interface\n\nAs\
    \ we've seen throughout the book, any application, whether it's a web service\
    \ or meant to be used through a web browser, consists of a set of HTTP URLs as\
    \ far as the outside world is concerned. When doing integration testing, you make\
    \ these calls and inspect the results. Other than testing something completely,\
    \ the actual test is the same—you run some code, and run assertions on the results.\
    \ Play comes with helpers to make this easy.\n\nThe first step in writing an integration\
    \ test is to get the application running. A fake application like we saw in section\
    \ 12.2 isn't enough—we need a running server. For that, we'll use the `testServer()`\
    \ method, instead of the `fakeApplication()` method that we saw in section 12.2.\
    \ The `testServer()` method takes one parameter: the port number on which the\
    \ server will run.\n\nOther than using a `TestServer` instead of a `FakeApplication`,\
    \ the mechanism for testing with a test server is the same as when testing using\
    \ a fake application: use the `running()` method, and pass the `TestServer` instance\
    \ and a `Runnable` that contains the test code. The following listing illustrates\
    \ this.\n\nListing 12.8 Testing using a test server\n\n```\npublic void myIntegrationTest()\
    \ {\n    running(9001), new Runnable() {\n        @Override\n        public void\
    \ run() {\n            // Test code goes here\n        }\n    }\n});\n```\n\n\
    To actually make our HTTP calls, we can use the WS class. The WS class is part\
    \ of WS (WebService) library provided with Play and allows us to make web calls\
    \ to remote systems from a client perspective. It's straightforward to use, as\
    \ we'll see. We'll test that the products list URL returns status code 200 and\
    \ has a non-empty body. Listing 12.9 shows the test. Go ahead and run it: it should\
    \ pass."
  merge: -1
