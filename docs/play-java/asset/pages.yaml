  md: '# 4 CHAPTER 1 An introduction to Play


    suits you best. If you''ve used Play 1.x before, you''ll notice that the API has
    become more type-safe.

    Play isn''t about Scala and type safety, either. An important aspect of Play is
    the usability and attention to detail that results in a better developer experience
    DX. When you add this to higher developer productivity and more APIs and architectures,
    you get a new emergent property: Play is fun.


    # 1.1 What Play is


    Play is fun. Play makes you more productive. Play is also a web framework whose
    HTTP interface is simple, convenient, flexible, and powerful. Most importantly,
    Play improves on the most popular non-java web development languages and frameworks—PHP
    and Ruby on Rails—by introducing the advantages of the Java Virtual Machine (JVM).


    # 1.1.1 Key features


    +   A variety of features and qualities makes Play productive and fun to use:

    * Simplicity

    * Declarative application URL scheme configuration

    * Type-safe mapping from HTTP to idiomatic Scala or Java API

    * Type-safe template syntax

    * Architecture that embraces HTML5 client technologies

    * Live code changes when you reload the page in your web browser

    * Full-stack web-framework features, including persistence, security, and internationalization

    * Support for event-driven, resilient, and scalable applications


    We''ll get back to why Play makes you more productive, but first let''s look a
    little more closely at what it means for Play to be a full-stack framework. A
    full-stack framework gives you everything you need to build a typical web application,
    as illustrated in figure 1.1.


    | Integrated HTTP server | |

    |---||

    | Expressive HTTP interface (provides full access to HTTP features) | RESTful
    web services API | |

    | High-performance template engine | Public asset compilation | Asynchronous I/O
    | Integrated console and build system |

    | HTML form validation | Integrated cache | Akka |

    | Datastore-agnostic model persistence | |


    Figure 1.1 Play framework stack'
