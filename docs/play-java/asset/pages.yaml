  md: "# 12.1 Testing Play applications\n\nAs we've seen in the previous chapters,\
    \ a Play application consists of several core components—controllers, models,\
    \ templates, forms, and so on. One of the nice things about Play is that they\
    \ all return in runnable code. This means that for all these concepts, there's\
    \ a class or method that you can access from your Java code. It also means that\
    \ you can take any separate component and test it by executing its code and checking\
    \ the result. This is the core principle of automated testing—run some code, compare\
    \ the result against an expected value, and return the findings. This kind of\
    \ testing is called unit testing. It's called unit testing because you take an\
    \ individual unit of code and well... test it.\n\nYou also want to make sure that\
    \ it interacts with the outside world—the browser or system that you're calling\
    \ your web app or API. This is called integration testing. Play offers a library\
    \ to test your web API and integration with a tool called Selenium. This will\
    \ test how your application behaves in a browser.\n\nPlay has facilities to make\
    \ it possible to test every part of your application and make running your tests\
    \ easy. In this section, we'll create our first test, and learn how to run it.\
    \ In the following sections, we'll show you how to test every aspect of your application.\n\
    \nBut first things first. Let's see how to write and run tests in Play.\n\n# 12.2\
    \ Writing tests\n\nIn Play 2, all tests are written with JUnit. JUnit is probably\
    \ the most popular testing framework for Java. In JUnit, a test is a method annotated\
    \ with the @org.junit.Test annotation. Inside a test method, you write some code\
    \ and verify your assumptions by using code that assertions—methods that compare\
    \ an expected and an actual value. JUnit provides a lot of assertion methods to\
    \ help you make comparisons and report what's wrong when an assertion fails.\n\
    \nLet's write a simple test to see how this works in Play. Any test you write\
    \ to go in your application's test folder, create one now. If you're using an\
    \ IDE, you might have to regenerate your IDE project files for it to show up properly.\
    \ In this folder, create a new class called ApplicationTest, with the contents\
    \ shown in the following listing.\n\nListing 12.1 ApplicationTest.java\n\n```\n\
    import org.junit.Test;\nimport static org.junit.Assert.*;\n\npublic class ApplicationTest\
    \ {\n\n  @Test\n  public void testPassingTest() {\n    String first = \"OK\";\n\
    \    String second = \"OK\";\n```"
