  md: "# Chapter 12 Testing your application\n\nNow that we've verified that our product\
    \ list page correctly shows up in a browser, let's test some interaction. When\
    \ we click the link, we expect to be taken to the product's detail page. To verify\
    \ this behavior, we need to click the link, and then check the state of the browser.\n\
    \nTo click the link, we can select it and then call the click() method on it.\
    \ To check the location of the browser, we can call the url() method on the browser\
    \ object. Of course, the URL isn't enough to convince us. To verify that this\
    \ is the product detail page, we'll check its test for the product name. The final\
    \ test is shown in the following listing.\n\n# Listing 12.12 Testing interaction\n\
    \n```\n...\n@Test\npublic void productListingTest() {\n    running(tester(3333)\n\
    ```\n\nIf you haven't, go ahead and run these tests—they'd all pass fine. Now,\
    \ these tests may seem silly—why test if a link works, when you could easily check\
    \ the value of its href attribute? Well, it's correct that, in case, we are essentially\
    \ testing if the browser works, a JavaScript-heavy web page. An event handler\
    \ might actually break navigation functionality. There is no way to test that\
    \ without automation—tests are incredibly useful—they test your web pages like\
    \ a user would, without burdening an actual human with it all sorts of tedious\
    \ clicking. Now that we've automated this kind of testing, we can test our application\
    \ at every level.\n\n# 12.4 Summary\n\nIn this chapter, we've seen how Play helps\
    \ you write automated tests. We've seen how we can run JUnit tests, and the difference\
    \ between unit, integration, and browser tests. We've seen that we could test\
    \ different parts of our Play application: the mod"
