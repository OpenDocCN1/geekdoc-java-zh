  md: '# CHAPTER 2 The parts of an application


    sent to the client in an HTTP body, such as an HTML page, is called a view, there-fore,
    the files are in the views syntax. An important


    The template files contain a template in Play''s Scala template syntax. An aspect
    of Scala templates is that they are compiled to regular classes. This has all
    sorts of advantages, the most important of which are compile-syntax and type checking.


    > You don''t have to learn Scala

    Although Play''s Scala templates in fact contain Scala code, this does not mean
    you to learn or understand Scala. Any template language has structures you know
    to build your purposes, and Scala templates are no different. Once you know what
    you have to do, for example, iterate over a collection or insert a variable value
    somewhere, where you know all you know to use that feature. You don''t have to
    think of it as Scala if you don''t want to. Think of it as another template language.


    Now if you happen to know Scala, you will recognize the structures used in the
    tags and understand why they work the way they work. But the point is that you
    don''t have to order to use the template syntax and enjoy all the benefits it
    brings.


    Another thing that''s important to note about the app directory is that it''s
    the root of all source code, where any subfolder will automatically have a pack-age,
    with any regular Java project.


    You might be having your packages look more like a domain space, such as org.mycompany.myproject.mypackage,
    but there''s nothing in the Java language that forces you to do that. It happens
    to be convention, and convention mainly exists for namespaces purposes, to prevent
    classes with the same name stepping on each other''s turf. Because you won''t
    be running 2 Play apps in the JVM at the same time, you don''t have to worry about
    that in your Play apps, so Play doesn''t follow that convention. That''s why your
    controllers are in the controller package, your views in the views package, and
    so on. Nice, concise, and easy to follow.


    Now let''s look at another cool feature in Play that also uses the app directory:
    compiled-assets.


    # 2.6. Compiled assets


    We''ve seen what assets are in 2.5, where we introduced assets files to the client,
    but assets can also be the result of compilation. A CSS or JavaScript file doesn''t
    have to be compiled, but there are certain tools that generate them. Play has
    the option to preprocess assets before they''re served to the client, giving you
    more convenience and flexibility over these files. Out of the box, Play 2 comes
    with support for LESS, CoffeeScript, and Google''s Closure compiler. Using is
    completely optional, but Play makes it easier for you to use these technologies
    if you want to.


    The source files for compiled assets should be kept in your application''s app/assets
    directory. That is not auto-generated by Play, so create it if you want to use
    this feature.'
