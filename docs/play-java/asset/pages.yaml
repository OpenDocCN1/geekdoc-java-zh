  md: "# Chapter 8 Producing output with view templates\n\n# Listing 8.6 Iteration\
    \ with index variable\n\n```\n@(products: Set [Product])\n<table class=\"table\
    \ table-striped\">\n// We'll skip the irrelevant parts\n@for(product, i) <- products.zipWithIndex)\
    \ {\n  <tr>\n    <td>@i<i></td>\n    <td><a href=\"/routes.Products.show(ean)\"\
    >&anc;/a</a></td>\n    <td>@product.name</td>\n    <td>@product.description</dd</td>\n\
    \  </tr>\n}\n</table>\n```\n\nThe Scala for syntax has more features than this,\
    \ but these techniques should be enough for most templates you'll write. Let's\
    \ move on to making decisions using if/else statements.\n\n# 8.3.2 Making decisions\n\
    \nOf course, Scala has if/else statements, and they're available from Scala templates.\
    \ As an example, we'll expand the products list template to show a friendly message\
    \ when no products are available (see the following listing).\n\n# Listing 8.7\
    \ If/else statements\n\n```\n@if(products.isEmpty()) {\n  <p>No products found.</p>\n\
    } else {\n  <dl>\n    // List products here.\n  </dl>\n}\n```\n\nAs you can see,\
    \ if statements are pretty straightforward, and exactly the same as in Java. But\
    \ we could make the if statement a little shorter; in Scala, the period before\
    \ the method call is optional, as are parentheses. We could rewrite the condition\
    \ as seen in the following listing.\n\n# Listing 8.8 More concise statements\n\
    \n```\n@if(products.isEmpty()) {\n  <p>No products found.</p>\n} else {\n  <dl>\n\
    \    // List products here.\n  </dl>\n}\n```"
