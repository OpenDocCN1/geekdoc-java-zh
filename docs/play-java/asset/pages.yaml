  md: "# Data binding\n\nGET /product/:ean Product.details(ean: Int)\n\nPlay would\
    \ make sure to convert\n\n```\n/product/1122334455\n```\n\ninto an Integer with\
    \ the value 1122334455. If we were to use aabbcc1122334455, Play would yield an\
    \ error, because it can't convert aabbcc1122334455 into Integer.\n\nTherefore,\
    \ there is a mechanism that allows Play to transform part of a URL (URL parameter,\
    \ string) into an object. This means that we could, for example, automatically\
    \ load and bind our Product objects based on the EAN number that is used in our\
    \ URL.\n\nWhenever we call\n\n```\n/product/11111111111\n```\n\nwe can have the\
    \ matching product passed to our controller, and we can have a details action\
    \ method that looks like this:\n\n```\npublic static Result details(Product product)\n\
    models.Product>productForm = form(models.Product.class);\nproductForm = productForm.fill(product);\n\
    return ok(edit.render(productForm));\n```\n\n> The product should automatically\
    \ be looked up using the product's EAN key\n\n6.9 illustrates what we want to\
    \ achieve: automatic binding of our Product object based on the EAN product number.\n\
    \nPlay allows you to define your binder for URL paths. This is called a bindable\
    \ path. In order to provide our custom URL path binder, we need to create a new\
    \ class that implements the play.mvc.PathBindable interface, and our implementation\
    \ reference if we create a class called ProductBinder, we have to implement play.mvc.PathBindable.\n\
    \nBecause we want to bind the Product entity that is used in our URL, we need\
    \ to implement the play.mvc.PathBindable interface on our Product class.\n\nOpen\
    \ your editor and edit the Product .java class from the models directory.\n\n\
    ```\nHTTP path parameters:\n/product/11222bbassed\n```\n\n| Product object instance\
