    Play 2''s action composition mechanism makes sure that when @Security.Authenticated
    annotation is encountered, the cookie session is checked for the user''s email.
    This is basically a helper for what you learned about action composition in chapter
    5.


    Now, try to access the product page—http://localhost:9000/products/. If you''re
