  md: '# Using Less and CoffeeScript: the asset pipeline


    # 8.5.3 The asset pipeline


    No curly bars are used around the object, and the function definition is more
    concise.


    There are many ways to use CoffeeScript or LESS. For languages, command-line tools
    are available that transform files into their regular JavaScript or CSS equivalents.
    For both there are also JavaScript interpreters that allow you to use these files
    in a browser directly.


    Play supports automatic build-time CoffeeScript and LESS compilation, and shows
    compilation errors in the familiar Play error page. This highlights the offending
    lines of code when you have syntactic errors in your CoffeeScript or LESS code.


    Using LESS or CoffeeScript is trivial. You simply place the files in the app/assets
    directory or a subdirectory of the same. Give Coffee files a .coffee extension
    and LESS files a .less extension, and Play will automatically compile them to
    JavaScript and CSS files and make them available in the public folder.


    For example, if you place a CoffeeScript file in app/assets/javascript /application.coffee,
    you can refer it from a template using


    ```

    <script src="routes.Assets.at(\''javascript/application.js")"></script>

    ```


    You can also use an automatically generated minified version of your JavaScript
    file by changing application.js to application.min.js.


    > COMPILED FILE LOCATION Although you can compile the files if they reside in
    the public directory, Play actually keeps them in the resources_managed directory
    in the target directory. The assets controller will look there when it receives
    a request for a file.


    Apart from LESS and CoffeeScript, Play also has support for the Google Closure
    compiler. This is a JavaScript compiler that compiles JavaScript to better, faster
    JavaScript. Any file that ends in .js is automatically compiled by the Closure
    compiler.


    There are occasions when you don''t want a LESS file to be automatically compiled.
    Suppose that you have a LESS file a.less that defines a variable @x and includes
    b.less, which references the variable. On its own, b.less won''t compile, because
    @x is undefined. Even though you never intended to call b.less directly, Play
    tries to compile it and throws an error. To avoid this, rename b.less to b_less.
    Any .less,.coffee, or .js file that starts with an underscore is not compiled.


    > CONFIGURE COMPILATION INCLUDES AND EXCLUDES Times it''s inconvenient to only
    exclude an existing LESS library that isn''t designed that way. Luckily, it''s
    possible to configure the behavior of Play regarding which files it should compile.
    See the Play documentation for more details.


    Now we''ve shown you how to use the asset pipeline, we will continue in the next
    section with adapting your pipeline for multiple languages.'
  merge: -1
