  md: '# Internationalization


    # 203


    This is a comma-separated list of languages, in which each language consists of
    an ISO 639-2 language code, optionally followed by a hyphen and an ISO 3166-1
    alpha-2 country code.


    Then, for each of these languages, you must create a messages file in the conf
    directory, with the filename LANG, where LANG is replaced by the language. A French
    messages file will be stored in conf/messages.fr, with the following content:


    ```

    welcome=Bienvenue!

    ```


    Additionally, you can create a messages without an extension, which serves as
    the default and fallback language. If a message is not translated in the messages
    file for the language you''re using, the message from this messages file will
    be used.


    To deal with messages in your application, it''s recommended that you start with
    a messages file and make sure that it''s complete. If you later decide to add
    more messages files, when you forget to add a key to another language messages
    file, or when you don''t have the translation for that message, the default messages
    file will be used instead.


    # 8.6.2 Using messages in your application


    To use messages in your application, you can use the get() method on the play.i18n.Messages
    class:


    ```

    Messages.get("welcome")

    ```


    By default, play will use the language specified in the current request''s Accept-Language
    header, or default to the language defined in your application''s configuration.
    If you want to, you can override the language that you want to use, like so:


    ```

    Messages.get(new Lang("fr"), "welcome")

    ```


    In a template, you can use the Messages class as follows:


    ```

    @

    <h1>@Messages.get("welcome")</h1>

    ```


    Prior to Play 2.1, in order for the automatic language selection to work in templates,
    you had to add an implicit parameter so that the request is available. You can
    do that as follows:


    ```

    @(title:String = "Paperclips!") (implicit request: Request)

    <h1>@Messages.get("welcome")</h1>

    ```


    Messages aren''t just strings; they''re patterns formatted using java.text.MessageFormat.
    This means you can use parameters in your messages:


    ```

    validation.required={} is required

    ```'
