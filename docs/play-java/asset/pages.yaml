  md: '# Play''s configuration files


    We''ll take a closer look at each of the top-level directories. The app directory
    is the most important one, but we''ll cover that last, and talk about the others
    first.


    To start


    Now that we know what to ignore, let''s start discussing the first directory of
    interest.


    # 2.3 Play''s configuration files


    The conf directory is where you configure the application. Its contents look like
    this:


    +   - application.conf routes


    As you can see, this directory contains two files: application.conf and routes.
    The application.conf file contains configuration information about Your application.
    This is where you will configure things like logging, database connections, or
    the port server runs on, and more.


    The application configuration file is loaded at startup time and is globally accessible.
    This means that if you need configuration options for your application, you can
    add some custom options to the file, and use them in your own code. Play generated
    an example configuration when you run play new, so open it and poke around it
    if you''re curious. We''ll cover some of the options here when we run them later,
    both in this chapter and the rest of the book.


    The other file in the conf directory is the routes file. Here you can define your
    application routes, mappings from HTTP URLs to application code. It already contains
    two example routes:


    ```

    # Home page

    GET / controllers.Application.index()


    # Map static resources from the /public folder to the /assets URL path

    GET /assets/* controllers.Assets.path(path="public", file)

    ```


    Every line of the routes file defines a single route. Let''s focus on the first
    route; we''ll explain what the second route does in section 2.5.


    Any route consists of three parts: the HTTP method, the path, and the action method,
    as illustrated in figure 2.1.


    Our example route maps any HTTP request for ''/'' to controllers.Application.index().
    This means that any GET request for the (root) URL is handled by the index'
