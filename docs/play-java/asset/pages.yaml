  md: "# CHAPTER 9 Asynchronous data\n\nOnce we have our result, we are giving back\
    \ a Result\n\n```\npromises.map(\n    new Function<List<Report>, Result>()() {\n\
    \        public Result ok(List<Report> reports) {\n            return ok(report.render(reports));\n\
    \        }\n    }\n);\npublic static Report ReportintensiveKPIRport() {\n    Report\
    \ r = new Report(\"KPI report\");\n    r.execute();\n    return r;\n}\n\npublic\
    \ static ReportintensiveETARport() {\n    Report r = new Report(\"ETA report\"\
    );\n    r.execute();\n    return r;\n}\n```\n\nRender the reports. The view will\
    \ be created later on.\n\nThe preceding code needs careful explanation. First,\
    \ we’re wrapping each report generation blocks of code that are run asynchronously\
    \ (using the Callable implementations). Then we tell that before we return a result,\
    \ we need to wait for reports to be generated. Using the Promise object allows\
    \ not to wait for the reports to be processed, but to suspend the current request.\
    \ You may have noticed that we use the async() method to wrap our Result object.\
    \ This tells Play that whatever we're doing, it doesn't wait for it, because it\
    \ is going to take some time. Instead, once the processing of the report is done,\
    \ the Promise object will make sure Play knows when to return a Result.\n\n# 9.2.2\
    \ Returning the asynchronous result\n\nYou probably noticed that we returned a\
    \ Result that is in fact a Promise of a result. This is done using the async()\
    \ method, as shown in the following code:\n\n```\nPromise<List<Report>> promises\
    \ =\nPromise.waitAll(promiseOfKPIRport, promiseOfETARport);\nreturn async(\n \
    \   promises.map(\n        new Function<List<Report>, Result>()() {\n        \
    \    public Result ok(List<Report> reports) {\n                return ok(index.render(reports));\n\
    \            }\n        }\n    )\n);\n```\n\nThe apply method is acting as a constructor\
    \ here\n\nThis is effectively an inner class that we implement; it simulates a\
    \ function given as parameter\n\nThe async() method itself takes a Promise object.\
    \ The Promise object is nothing more than a holder that indicates when the report’s\
    \ processing is finished. This is called redeeming the promise."
