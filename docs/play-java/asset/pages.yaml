    The Author Online forum and the archives of previous discussions will be accessible
    from the publisher''s website as long as the book is in print.


    # About the authors


    NICOLAS LEROUX is a senior architect and Technical Director at Lunatech Research
    where he''s worked since 2001 and where he is mainly involved in JEE projects
    for Lunatech''s customers. Since 2009, Nicolas has developed a passion for the
    Play framework and is a core developer of its open source project. He was involved
    in the first version of the Play framework and is contributing to the second one.
    Nicolas also enjoys introducing Play to new audiences and is a frequent speaker
    at conferences.'
