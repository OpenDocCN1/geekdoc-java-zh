  md: '# 1.2.2 Simplicity, productivity, and usability


    In a framework, simplicity comes from making it easy to do simple things in a
    few lines of code without extensive configuration. A “Hello World” in PHP is a
    single line of code; the other extreme is Java Faces, which requires numerous
    files of code before you can serve a blank page.


    Productivity starts with being able to make a code change, reload the web page
    in the browser, and see the result. This has been the norm for many web developers,
    whereas Java web frameworks and application servers often have long-developed
    cycles. Java hot-deployment solutions exist, but are not standard and come at
    the cost of additional configuration. Although there is more to productivity,
    this is what matters.


    Usability is related to developer productivity, but also to developer happiness.
    You''re certainly more productive if it''s easier to get things done, no matter
    how smart you are, but a usable framework can be more than that; it can be a joy
    to use. Fun, even.


    # 1.3 Reactive programming


    Play unique features in the Java world. It allows applications to be nonblocking,
    asynchronous, and reactive. But what does this mean exactly? As''ll see in chapter
    4, application requirements have changed dramatically in recent years. Today applications
    are deployed on everything from mobile devices to cloud-based clusters. User expectations
    are high: applications need to respond in milliseconds, and no downtime is allowed.
    Data are expanding into the petabytes.


    Before and similar frameworks, scaling was achieved through larger servers, and
    concurrent processing via multithreading. Applications were running inside managed
    servers and containers. Applications were made little use of the multiple processors
    available to them.


    Reactive programming is about providing an architecture that allows developers
    to build systems that are event-driven, scalable, resilient, and responsive: delivering
    highly responsive user experiences with a real-time feel, backed by a scalable
    and resilient application stack, ready to be deployed on multicore and cloud computing
    architectures. The Play framework has these goals in mind and aims to fulfill
    them. Let''s review each of the goals.


    # 1.3.1 Event-driven


    An application based on asynchronous communication implements a loosely coupled
    design. The sender and recipient can be implemented without regard to the details
    of how the events are propagated, allowing the interfaces to focus on the communication.
    Because the recipient of asynchronous communication can remain dormant until an
    event occurs or a message is received, an event-driven approach can make efficient
    use of existing resources, allowing large numbers of recipients to share a single
    hardware thread. A nonblocking application that is under heavy load can have'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'lower latency and higher throughput than a traditional application based on
    blocking synchronization.


    # 1.3.2 Scalable


    A scalable application is one that can be expanded according to its demand. This
    can be achieved by adding elasticity to the application by adding or removing
    application nodes (servers or CPUs, for example). The architecture should handle
    elasticity without redesigning or rewriting the application. Cloud-computing environments
    tend to provide near perfect elasticity to your application. An event-driven system
    provides the foundation for scalability because it provides loose coupling and
    location independence between components and subsystems.


    # 1.3.3 Resilient


    Application downtime nowadays is not allowed, and business users expect 24/7 uptime.
    If an application crashes for one reason or another, the rest of the application
    should work as expected. This means that each component needs to be isolated from
    other components'' failure. The event-driven model has the necessary primitives
    to realize this model of failure management.


    # 1.3.4 Responsive


    Responsive applications are real-time and collaborative applications. Today, businesses
    try to engage their customers more and more. They are also trying to be responsive
    to your customer feedback. Applications should therefore be real time and allow
    you to react to any customer feedback. Responsive applications are real time interaction
    between the different users. One example is Google Docs, which enables users to
    edit documents collaboratively in real time—allowing them to see each other''s
    edits and comments as they are made.


    Now that we know all Play''s goals, let''s see how Play fits at work. Not all
    enterprise applications have to be reactive.


    # 1.4 Play 2 enterprise features


    Play is also adapted to an enterprise environment. Mainly it satisfies the following
    enterprise requirements.


    # 1.4.1 Simplicity


    Play provides a clean model that makes it easy to build scalable web applications
    that are testable. Simplicity has always been the Play framework''s strong point
    and is important in an enterprise context. Developers need to concentrate on their
    business problems at hand and not on the framework. The framework should help
    them and not be in the way. Play framework''s first focus was always simplicity.
    Simplicity doesn''t mean a simple application: quite the opposite. Play provides
    simple but efficient building blocks, allowing development of complex applications.
    Simplicity'
