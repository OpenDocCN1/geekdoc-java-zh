    \ retrieve the StockItem objects. First, we need a field to store them in, as\
    \ a List-StockItem field to the Product class. All we need to do now is mark it\
    \ as a one-to-many relation, as we did with the many-to-one field on StockItem:\
    \ annotate it with @ManyToMany. Because the StockItem class is the side that persists\
    \ the relation, we need to indicate what property on the StockItem class holds\
    \ the relation we're mapping. We do this by using the mappedBy attribute in the\
    \ annotation, as in the following listing.\n\n# 7.8 Making the Product-StockItem\
    \ relationship bidirectional\n\n```\nimport javax.persistence.*;\n...\n\n@Entity\n\
    public class Product extends Model {\n    @Id\n    public Long id;\n    public\
    \ Long bean;\n    public String name;\n    public String description;\n    @ToMany(mappedBy=\"\
    product\")\n    public List<StockItem> stockItems;\n}\n```\n\nNow whenever you\
