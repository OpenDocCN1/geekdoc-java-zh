  md: '# 7.5.3 Loading initial data


    We have established that we need to load data at application startup. Play allows
    you to load data in two ways:


    +   - Evolution scripts

    - onCreate() method on the Global Java class called at application startup and
    a YAML data file


    EVOLUTION SCRIPTS

    We have seen in section 7.3.1 that Play generates a database script to create
    our schema. We all need to do then is add data to this script. Another alternative
    is to create a file called 2.sql in the conf/evolutions/default/ directory and
    add an SQL insert to add data at application startup. An evolution SQL script
    has the following format:


    ```

    # -- Initialize tags

    # -- Ups

    insert into tag(id,name) values (1, ''lightweight'');

    insert into tag(id,name) values (2, ''metal'');

    insert into tag(id,name) values (3, ''plastic'');

    # -- !Downs

    SET REFERENTIAL_INTEGRITY FALSE;

    ```


    Evolution scripts are used to create database schemas and populate initial data
    to your application. They are also used to perform schema updates between different
    versions of your application. Evolution scripts contain two parts: SQL that is
    executed at application startup and SQL that is executed at application shutdown.


    Evolution scripts are called sequentially (1.sql,2.sql and so on); at application
    startup the SQL defined in the Ups section is applied, and at application shutdown
    the Downs section is applied.

    You can prepopulate your database with existing products by adding SQL insert
    statements in your evolution script in the Ups section.


    YAML DATA FILE

    We have seen in chapter 6 6.2.3 that Play provides a way to include custom code
    during application startup using the onCreate() method of the Global class. This
    is instantiated automatically and the onCreate() method is called when our application
    is starting.


    We will use this technique to load a file that contains your tag catalog. Our
    catalog will be written in YAML. YAML is a human-friendly data serialization standard
    for all programming languages.


    Edit the Global.java located in the app directory and modify the onCreate() method
    as shown in the following listing.'
