  md: '# About scopes


    We are able to be notified of any exceptions occurring in our code. This is a
    trivial example, but think about how you can use interceptors for transactions,
    security, and for a lot of other examples you can think of.


    There''s one more important aspect of controllers that we haven''t covered yet:


    # 5.5 About scopes


    We saw that using the controllers and the routes, we''re able to retrieve data
    from the clients and send data back to those clients. We didn''t really talk about
    the lifetime and accessibility of data. We assumed the data was transmitted each
    time a communication was made between the server and the client; that really is
    what''s happening.


    But as a developer, you don''t really want to manage dataflow. You want to store
    data for a certain period of time; for example, the duration of a request or a
    browser session. You store that data in a certain scope. Play supports a number
    of scopes, for which it stores data for a certain lifetime. They''re accessed
    in a similar way as a Map in Java; you store and retrieve values based on a key.


    # 5.5.1 A bit of history about the scopes


    Java EE traditionally defines these scopes:


    +   - Application scope

    - Session scope

    - Request scope

    - Page scope


    The application scope has an application lifetime: you store that data that will
    stay as long as your application is running.


    The session scope has a session lifetime: you store that data that will stay as
    long as your browser is open. This is traditionally the JSESSIONID parameter you
    sees in in URLs. The JSESSIONID is also stored in a cookie, so it''s available
    to the server on consecutive requests. This JSESSIONID is just an ID that points
    to some server-side storage space. The session scope is usually used to store
    information about your shopping basket or the fact that you''re logged in.


    The request scope defines data within the lifetime of request: the client makes
    an HTTP request, and with the request comes some data. That is stored in the request
    scope and can only be accessed while that particular request is being processed.


    The page scope defines data that is accessible in the view only: it can be accessed
    during the rendering phase. For example, you might want to store the current breadcrumb
    of your application in scope, to display the current application path.


    The different scopes can be conceptually viewed as shown in figure 5.13.


    NOTE Though some Java frameworks introduce a conversation scope, we don''t think
    this is relevant for our explanation and may be confusing more than anything-else.'
