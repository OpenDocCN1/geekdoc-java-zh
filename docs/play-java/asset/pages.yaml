    \ the total number of results is 50 and then we get 10 results for the current\
    \ page. Of course, we pre-filled our database with 50 products, as explained in\
    \ section 7.5.3.\n\n> Using a different configuration for tests\nBy default, fakeApplication()\
    \ instantiates a fake Play application based on your current application.conf\
    \ file. But if you want to test a different setup times, for when you want to\
    \ use a different database. For reason, you can supply a Map<String, String> as\
    \ a parameter to fakeApplication(). You can use that map to supply configuration\
    \ key/value pairs, and they will override the configuration from your application.conf.\n\
    \n# 12.2 Functional testing\n\nIn this section we are going to test various functions\
    \ of our application. The first test is to confirm that not every user can log\
    \ in to our application.\n\n# 12.2.1 Testing your controllers\n\nIn order to know\
    \ if our application works correctly, we need to test that not everyone can access\
