  md: '# JAVA/WEB DEVELOPMENT


    # Play FOR JAVA


    Leroux \u2013 de Kaper


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_320_0.png)


    For a Java developer, the Play web application framework is a breath of fresh
    air. With Play you get the power of Scala''s strong type system and functional
    programming model, and a rock-solid Java API that makes it easy to create stateless,
    event-driven, browser-based applications ready to deploy against your existing
    infrastructure.


    > "Helps you transition to more productive ways to build modern web apps."


    Play for Java teaches you how to build Java-based applications using Play 2. This
    book starts with an example project and then explains each part by discussing
    simple snippets as they are added to a larger example. Along the way, you''ll
    contrast Play and JEE patterns and learn how to build a stateless web application
    can fit seamlessly in an enterprise Java environment. You''ll also learn how to
    develop asynchronous and reactive web applications.


    --- From the word James Ward, Typesafe


    > "The easiest way to learn the easiest web framework."


    --- Franco Lombardi Molteni Informatica


    > "The definitive guide to Play 2 for Java."


    --- Ricky Yim, DiUS Computing


    # What''s Inside


    +   * Build Play 2 applications using Java

    * Leverage your JEE skills

    * Work in an asynchronous way

    * Secure and test your Play application


    > "A good cocktail of theory and practical information."


    --- Jeroen Nowws, XTI


    The book provides a background in Java. No knowledge of Play or Scala is assumed.


    > "An excellent tutorial on the Play 2 framework."


    --- Lochana C. Minikarachchi PhD, University of Connecticut


    Nicolas Leroux is a core developer of the Play framework. Sietse de Kaper develops
    and deploys Java-based applications.


    Download their free eBook in PDF, ePub, and Kindle formats, owners of this book
    should visit manning.com/PlayForJava


    ISBN 13: 978-1-61729-90-9

    ISBN 10: 1-61729-090-4


