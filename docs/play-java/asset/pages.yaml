  md: '# Scala template syntax


    Although compiled templates and type safety are nice, they don''t explain why
    the template language is Scala. After all, Java itself has those features, why
    not use Java instead? The answer is that Scala has some features that aren''t
    available in Java, or that make the code less verbose. For example, the Scala
    compiler does a more type inference than Java,² saving a lot of type declaration.


    Now that we know why, let''s take a look at the how: the actual template syntax.


    # 8.2 Scala template syntax


    Scala template syntax is not very complicated: there''s just text and Scala code,
    and a way to distinguish between the two. Of course, things you get more complicated
    if you don''t know Scala already. Don''t worry, we''ll show you everything you
    need to know to use Scala templates. The most basic thing to remember about Scala
    templates is the @ symbol switches to Scala context; everything that follows is
    Scala code until the logical end of the expression. We''ll show you how that works
    in a bit, but first, let''s take a look at how you define a Scala template.


    # 8.2.1 Template definition


    As we showed in earlier chapters, Scala templates get compiled to classes, which
    you can call from your Java code. The compiled classes will end up in a view package,
    and they will all contain a method called render. What parameters this method
    depends on the template parameters that are defined at the top of the template
    itself.


    Template parameters are function parameters, like method parameters in Java, they
    require a name and a type. In Scala, the name comes first, followed by a : and
    then them. The template can have zero, or more parameters, which are separated
    by commas, and they should all be placed at the top of the template file, meters
    for a template which has a products parameter of type List<Product> and a count
    parameter of type Integer.


    ```

    @(product: List[Product], count: Integer)

    ```


    As you can see, the type parameter for the List is a little from the regular Java
    syntax: where Java uses angled brackets, in List<Product>, Scala uses brackets,
    which means you have to write List[Product] instead. The only difference is the
    syntax; the meaning is still the same.


    Now that we know how to define template parameters, we can take a look at the
    actual body of a template.


    # 8.2.2 Template body


    A template body consists of plain text (which can be anything, such as HTML, JSON,
    XML, or CSV) mixed with Scala code. The text will get copied straight to the output,
    whereas the Scala code implements the template''s logic and dynamic parts.


    > ² This means the compiler knows what type an object is, without it being stated
    in the source code.'
