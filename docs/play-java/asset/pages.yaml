  md: "# FILLING A FORM WITH INITIAL VALUES\n\nBecause we are using a form object\
    \ in our view, we can decide to prefill the form with some default values. This\
    \ is exactly what we need to do if we want to edit a product. When we know the\
    \ unique identifier for the object we want to edit, we can then fetch it from\
    \ our database so can use the values in our HTML form. The action method we wrote\
    \ to accomplish this is shown in the following listing.\n\n# 6.2 Displaying a\
    \ form with preset values\n\n```\npublic class Products extends Controller {\n\
    \    private static final Form<Product> productForm =\n        Form.product(Product.class);\n\
    \    ...\n    public static Result details(String ean) {\n        final Product\
    \ product = Product.findBy(ean);\n        if (product == null) {\n           \
    \ return notFound(String.format(\"Product %s does not exist.\", ean));\n     \
