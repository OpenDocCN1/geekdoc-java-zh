  md: '# 5.5.7 The flash scope


    Objects stored in the flash scope have a lifetime of exactly two requests. It
    means that data in the flash scope will service one redirect. This is really useful
    when you want to retain data after a redirection. To understand this better, let''s
    look at a concrete example.


    The client issues the following request:


    ```

    GET /

    ```


    The server renders an HTML page. On the page, we have a form to input a telephone
    number and a Submit button. When the user submits the form, a POST request is
    made to the server to the following address:


    ```

    POST /phonumber/

    ```


    Now, once the controller receives the request, it attempts to validate the phone
    number. In case the validation fails, the server renders the same page with an
    error message. If you try to refresh your browser, you''re in for a surprise:
    your browser is asking if you want to submit the data. Why is that? This is because,
    as far as client is concerned, its last execution point POST /phonumber. And indeed,
    the URL that your browser shows is http://localhost:9000/phonumber.


    Figure 5.15 illustrates the problem we just described.


    A way to avoid bad surprises is to send a redirect instruction to your client,
    so it redirects to /. In the meantime, because of the redirect, you lost your
    error message. This is exactly the case for which flash scope was invented. Storing
    the error messages in the flash scope allows you to still have access to your
    error messages after the redirect.


    In Play, the objects in the flash scope are stored in a special cookie that flushed
    after the second consecutive request.


    Figure 5.16 illustrates the same problem, but uses the flash scope as a solution.


    NOTE The flash scope has been introduced in Java EE 6 and defines the lifetime
    as its Play equivalent, but it lives server-side. At the time of this writing,
    Java EE web frameworks do not have flash scope.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_120_0.png)


    Figure 5.15 Submitting an invalid form without using the flash scope'
