    \ More importantly, we're now able to map and back from check boxes or fields\
    \ to select our object model.\n\nLet's see what happens if we want to bind a type\
    \ that Play doesn't know about yet.\n\n# 6.2.3 Custom data binders and formatters\n\
    \nAs we have seen in the previous section, Play is able to bind most of the usual\
    \ types automatically. But what about special types? Play allows you to define\
    \ your own binder or your own formatter. There are three different ways of binding\
    \ objects. You can bind objects via the URL or via URL parameters, and it's also\
    \ possible to use a custom formatter that will transform your object when submitting\
    \ a form.\n\nPATH BINDERS\n\nWhen requesting a URL with a named parameter in it,\
    \ Play already performs some kind of binding. For our application, we have:\n\n\
    ```\n/product/1111111111111\n```\n\nwhere 1111111111111 is our product EAN number.\
    \ Internally, Play binds this value to the product's EAN number. This is done\
