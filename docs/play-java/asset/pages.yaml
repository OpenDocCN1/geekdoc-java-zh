  md: '108


    CHAPTER 6 Handling user input


    We''ve seen how our form submission is processed. Once the form is displayed,
    the user enters the data and submits the form. The browser will then send a POST
    request with the form data to our application. The routes file determines that
    the processing is be delegated to the `save()` action.


    We''re now able to add or edit a product, but let''s see in more detail how our
    action managed to transform the HTTP form parameters into a Form object.


    # 6.2 Data binding


    Play transformed the submitted information into a Java object using a process
    called data binding. Data binding is the process of converting elements of a request
    into objects. There are three binding types in Play:


    +   - Form binding, which we saw in the previous section

    - URL query parameters binding

    - URL path binding


    Data binding is a simple principle. The HTTP parameters are mapped to their counterpart
    attributes on the Java object. The mapping is done using the parameter''s name.
    Each time a parameter name matches the name of an object attribute, the object
    attribute is set to the parameter''s value. Figure 6.5 illustrates this


    In Play, form binding is primarily done with the help of a Form object, via the
    `bindRequest()` method. The binding processing is delegated to Spring Data, a
    library that can take a request''s body and convert it to the properties of a
    Java object.


    URL query parameter binding consists of taking the URL''s parameters (for example,
    `?x=y`) and mapping them onto a Java object. The pattern is derived from the routes
    file.


    For example, if our products have an ID, we could have a route like this:


    ```

    GET /products.edit(id: Long)

    ```


    Which would match the following URL:


    ```

    http://localhost:9000/products?id=12

    ```


    Play will convert the string "12" (query parameters are always strings) to the
    string. URL path binding consists of mapping a query path (again, always a string),
    to another type or object. This also happens when the route definitions. For example,
    when you declare:


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_130_0.png)


    > Figure 6.5 The binding process'
