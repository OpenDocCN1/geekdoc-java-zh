  md: "# Bob's post might look like this:\n\nHello! Look here:\n<img src=\"http://paperclips.example.com/transfer?productId=l&to=Bob*\"\
    >\n\nBecause our warehouse application authentication information in a cookie,\
    \ the cookie hasn't expired, the attempt by the browser to load the image will\
    \ submit the product form with the cookie, thus authorizing a transaction without\
    \ the original user's approval. Play 2 provides a simple mechanism that prevents\
    \ request forgery attacks; the only way to secure critical actions properly is\
    \ to issue an authenticity token. The idea is to generate a unique token for the\
    \ given user and check that this same token is submitted with the form. Play 2\
    \ provides all the tools to do so.\n\nWe're going to secure our new product form\
    \ against cross-site request forgery. In order to do that, we have to enable a\
    \ special filter. We're going to explain everything about filters in the next\
    \ section. For now, to enable the filter, we need to import the module into our\
    \ application project.\n\nThis is done by editing the file build.sbt. The following\
    \ shows where to locate the build.sbt:\n\n+   - warehouse\n    - app\n    - conf\n\
    \    - public\n    - project\n        - test\n    - build.sbt\n\nWe need to add\
    \ the filter module to our build.sbt file. This is easily done in the libraryDependencies\
    \ section of the ApplicationBuild project class.\n\n# Listing10.1 build.sbt\n\n\
    ```\nname := \"warehouse\"\nversion := \"1.0-SNAPSHOT\"\nlibraryDependencies ===\
    \ Seq(\njavaJdbc,\njavaEbean,\ncache,\n\"com.google.guava\" % \"guava\" % \"14.0\"\
    ,\nfilters\n)\nplay.Project.playJavaSettings\n```\n\nThe filters module\n\nWe\
    \ also need to create a new class called Global.java that extends GlobalSettings.\
    \ The following shows where to create the new Global class.\n\n+   - warehouse\n\
    \    - app\n    - Global.java"
