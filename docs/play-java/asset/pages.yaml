    Here we use HAProxy to listen to 80 and use the play back as the default back
    end for incoming traffic. The play back is configured to two servers: one is listening
    on port 9000 and the second one on port 9001. The check option in the server line
    allows HAProxy to periodically establish a TCP connection to the back-server to
    see if it''s up. If it''s not, no requests will be sent to that server.


    HAProxy creates the connection to the Play applications, from the Play-perspective,
    HAProxy is the client. It is useful to use the client''s IP address as in the
    Play application, for logging purposes. That''s why the forwardfor option makes
    HAProxy add a header X-Forwarded-For that contains the client''s IP address to
    the request.


    Finally, because we use WebSockets, we set the http-server-close option which
    prevents a WebSocket connection from being sent to the server over an existing
    TCP connection, which doesn''t work.


    Apache is the most commonly used web server, and it also has proxy capabilities.
    It does not support WebSockets, but that''s not a problem if your application
    doesn''t use them. If you''re already using Apache, it might be interesting to
    stick to Apache as proxy, to reduce the number of components in your architecture.
    The following listing shows a typical Apache configuration.


