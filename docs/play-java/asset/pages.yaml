  md: '# About scopes


    You could also store more information by serializing your data into strings, but
    remember that you can only store up to 4 KB per cookie. therefore save only what
    you need, which is often IDs.


    Finally, to discard a cookie, use `discardCookies`:


    ```

    response().discardCookies("theme");

    ```


    As you can see, the response is rather straightforward.


    # 5.5.6 The session scope


    Objects stored in the session scope have a session lifetime: you can store data
    that will as long as the client''s browser is open. It''s important to understand
    that sessions are not stored on the server but are available to subsequent HTTP
    request, using the cookie mechanism. The data size is very limited (up to 4 KB),
    and you can only store string values. The Session object should not be used as
    a cache! Play also offers a caching mechanism, which you can use instead.


    To store a value in the session:


    ```

    Context.current().session().put("x", "myfile");

    String value = Context.current().session().get("x");

    System.out.println(value);

    ```


    From a controller, you also use the convenience methods provided by the controller:


    ```

    session("x", "myfile");

    String value = session.get("x");

    System.out.println(value);

    ```


    > Why can I only store strings in my Session?


    You may argue that a Session object that can only store String objects is a regression;
    we feel that it is the way it should be. By disabling the storage of complex objects,
    we''re also removing a lot of associated problems of synchronizing the object
    states/or any side effects. By storing immutable objects, like Strings, in our
    session, no side effects can occur.


    For example, if we were to store an object (marked as connected to the DB) database
    entity in our session, the entity might really be detached (no longer connected
    to the DB) next time we access the object, causing all sorts of troubles. Or entity
    may have been modified by a third party since we last accessed it, causing unexpected
    behavior.'
