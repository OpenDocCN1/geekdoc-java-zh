  md: "# 150 CHAPTER 7 Models and persistence\n\nNow, as a reminder, here are the\
    \ relevant parts of the Products.save() action method. This, as you will remember,\
    \ is the method responsible for saving Product instances from our web forms.\n\
    \n```\npublic static Result save() {\n  ...\n  Product product = boundForm.get();\n\
    \  product.save();\n  return redirect(routes.Products.list());\n}\n```\n\nBecause\
    \ we removed our save() method, we're now using the one provided by the Model\
    \ class. If you wanted, you could be more explicit about what exactly is doing\
    \ the saving:\n\n```\n...\nProduct product = boundForm.get();\nEbean.save(product);\n\
    return redirect(routes.Products.list());\n..\n```\n\n# Preventing model anemia\n\
    \nThe Model class provides some common database-related methods in an effort to\
    \ prevent you from ending up with what Martin Fowler dubbed an Anemic Domain Model.¹An\
    \ anemic domain model is a model that has no behavior (methods) or state (fields).\
    \ This is often called an anti-pattern, because the whole of object-oriented programming\
    \ is coupled to behavior and persistence.\n\nBy providing the database operations\
    \ with the entity classes, it becomes possible to do a database operation anywhere\
    \ you have an entity instance, without having to \"hunt\" for some other object\
    \ or class that provides that. It's important to remember that this doesn't have\
    \ to stop with the behavior provided by the Model class. When aiming for rich\
    \ model classes, it's a good idea to add any functionality that operates on entities\
    \ to the entities themselves, rather than to a controller or utility class.\n\n\
    Ultimately, it's your choice whether you want a rich data model or one that serves\
    \ as a container for data, but it's worth to make that choice consciously.\n\n\
    Now let's see if everything works as expected. Go to the \"create\" form in your\
    \ browser, at http://localhost:9000/products/new, and create a new product. Next,\
