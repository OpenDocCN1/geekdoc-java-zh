  md: 'an object of type Action. It''s used as a way to reference our action methods
    from the controller, but it''s also used anywhere else we need it (in our views,
    for example). Our action methods are added to the object at compilation time,
    when Play generates the routes object.


    The routes object provides what the name implies, that we call reverse routing.


    Reverse routing is the opposite of regular routing: it translates from Java to
    HTTP. Reverse routing is important, as it allows us to get an HTTP request for
    a given action method.


    For example, you may want to be able to point your client to the edit method.
    Remember, your client only speaks HTTP. You need to return an HTTP call: an HTTP
    method and a URL. It''s just like asking the routes object how to access the action
    method. The routes object returns a play.mvc.Call object. The play.mvc.Call defines
    HTTP, and provides both the HTTP method and the URL. It also makes sure the method
    is correctly translated, especially when parameters are part of the action method.
    For example, the following call:


    ```

    routes.products.list(4)

    ```


    is translated to:


    ```

    GET /products?page=4

    ```


    You now know everything about how to translate HTTP requests to action methods
    and vice versa with reverse routing. You should have a complete picture of how
    Play operates when a request is received from the client and executed as Java
    code. Now it''s time to see in more detail how to simplify some tedious operations
    in the controller.


    # 5.4 Interceptors


    Let''s get back to our warehouse application. From time to time, an exception
    may occur. But if it happens, we can''t spot it. It would be nice if we could
    just tell Play to send an email with the error whenever an exception occurs in
    specific controllers or action methods.


    Action methods can be easily composed. This means that you can add extra behavior
    to action methods, and that''s what we want to do: want to catch any exceptions
    occurring in our action methods and send an email about them. Let''s see how it
    works.


    Play provides an @With annotation, which allows you to compose an action. The
    @With annotation is used before an action method declaration. It can also be used
    on the class level—the controller itself. Declaring the @With annotation on our
    action method tells Play that a certain action must be performed around each execution,
    meaning before and after. This is also called an interceptor, because it intercepts
    a call to the action method.'
  merge: -1
  pgno: 111
- img_proc: true
  md: "The @With annotation takes one parameter: the type of Action we want our code\
    \ to be composed with. We will build a CatchAction class shortly.\n\nFor example,\
    \ the following code tells Play to execute the action method using the CatchAction\
    \ action:\n\n```\n@With(CatchAction.class)\npublic static Result show(Long e)\
    \ { ... }\n```\n\nBecause we specify the annotation on the method level, Play\
    \ will only use it for this specific method. If we were to declare it at the class\
    \ level, the CatchAction would be used for all the controller's actions:\n\n```\n\
    @With(CatchAction.class)\npublic class Products extends Controller { ... }\n```\n\
    \nBut what is this CatchAction class? It's where we put our code that will provide\
    \ the additional functionality. We need to build it. The @With annotation takes\
    \ an Action object as a parameter. An action object must execute the abstract\
    \ class play.mvc.Action, which means it must implement the following method:\n\
    \nThe method is called before the action execution. From there, the call method\
    \ must actually call the action method using the delegate object. The delegate\
    \ object is a reference to the action method of play.mvc.Action that is marked\
    \ with the @With annotation. In other words, it represents the original action\
    \ method.\n\nLet's just go and code our exception interceptor. First, we'll create\
    \ a ExceptionMailer class, to stand in for what would be an actual mailing class,\
    \ which is not the point of this exercise. Create the file shown in the following\
    \ listing:\n\n+   Listing 5 /app/utils/ExceptionMailer.java\n\n```\npackage utils;\n\
    public class ExceptionMailer {\n    public static void send(Throwable e) {\n \
    \       System.out.println(\"Sending email containing exception \" + e);\n   \
    \ }\n}}\n```\n\nWe'll create interceptor action by extending the Play.SimpleAction\
    \ abstract class that Play provides. The Play.SimpleAction class provides everything\
    \ we need to get started. In the next listing, we'll define our CatchAction, which\
    \ will catch any exceptions and email them."
