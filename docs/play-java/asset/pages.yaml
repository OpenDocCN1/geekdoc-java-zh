  md: '# Modeling the real world in code


    the name of our Person, we can''t, because its internal state is exposed to the
    world to see, and our client code depends on it being there. This is why it''s
    common to use classes with private fields, and corresponding getters that return
    the values of the fields, as well as future-proofing the class''s API.


    Another good reason for getters and setters is that they''re part of the JavaBeans
    specification, which offers a standardized way to expose properties through methods.
    Many tools require this, including Ebean, which we''ll cover later in this chapter.
    That depend on the JavaBean convention won''t work without getters and setters.


    Although the case for getters and setters is strong, the downside is that they
    generate a lot of noise; a simple field with both a getter and a setter requires
    around seven extra lines of code (depending on your code-formatting convention).
    Although this might not seem like, the noise adds up if you have a class with
    lot of fields; you have to remember to generate or write the correct method whenever
    you introduce a new field. Wouldn''t you rather focus on something else?


    # 7.1.2 Let eliminate some noise for you


    Play helps eliminate all this boilerplate code in which you''d normally use a
    simple getter and setter, and allows you to use public fields whenever you don''t
    require special logic to put in a getter or setter.


    Don''t worry you still get to use your models like JavaBeans. Play uses a trick
    called bytecode enhancement to add getters and setters right after your original
    code is compiled, and then it rewrites your client code to use the generated getters
    and setters. If you change from field access to getters/setters, or the other
    way around, you''ll find your code no longer compiles. because the bytecode enhancement
    takes place after your class is compiled, which means it has to compile first


    > Pay no attention to the man behind the curtain

    The bytecode enhancement Play uses to transparently add getters and setters is
    an example of "magic"; there are things going on behind the scenes that are not
    obviously looking at the code, but the effects are. It''s arguably whether this
    is a desirable situation, but in practice it turns out that the pros often outweigh
    the cons.


    This means if you ever change about using getters and setters, you''ll have to
    rewrite your code. Fortunately, all IDEs will help you do that automatically,
    and if you happen to miss an occurrence, you''ll get a compile-time error informing
    you. It''s not that a big deal, as long as it''s in


    > Used to be more "magic" like in Play 1.x, but in Play 2, this is the only thing
    that was carried over from Play 1. You don''t have to use it if you don''t want
    to; you can create your own getters and setters, and Play won''t touch your classes.


    Visit http://docs.oracle.com/jave/tutorial/javabeans/ for more information.'
