- img_proc: true
  md: '# 11.3.1 Packing up your application


    When you play run, your application is started in development mode. This is unsuitable
    for running your application in production, because at each Request checks whether
    any files are changed, greatly slowing down your application.


    As a better alternative, you can play start. This will start play in production
    mode. In production mode, a new JVM is forked for your application, and it runs
    separately from SBT. You can see your application''s logging output to verify
    that it started correctly. When you''ve seen enough, type Ctrl-D, and the SBT
    process will terminate or leave your application running. You can stop this application
    with play stop.


    Though play start starts your application in the proper mode, it is often not
    a suitable way of starting your app. It requires interaction to end and detach
    the SBT from your application. Generally, you''ll want your application to start
    without human intervention. Also, you may not always have the play command available
    on the machine where you want to deploy.


    For this, Play provides the stage and dist tasks. When running stage, Play compiles
    your application to a JAR file, and—together with all the dependency JARS—puts
    it in the target/ directory. It also creates a start script in target/


    With this script, you can start your application without the play command. Just
    running target/start will start your application.


    > PLAY DOESN''T SUPPORT WINDOWS IN DIST MODE. Unfortunately, Play doesn''t support
    Windows while working in production mode. This is because running a Windows service
    is not all comparable to running a background process on a Unix-based environment.
    For this reason, the stage and dist tasks won''t work on Windows.


    The dist task does something similar, and zips the start script and dependencies
    into a file. When running play dist, you get a directory dist, which contains
    a zip file with your application. You can transfer this file to the server where
    you want to deploy, unzip it, and run the start script that''s contained in the
    zip file. You might need to make the start script executable with chmod +x start.


    The stage and dist commands make particularly nice distributions. All your dependencies
    are packed with your application, including Play and Scala! This means the only
    thing you need on the target machine is a Java installation. This makes an application
    packaged with the dist command extremely portable.


    # 11.3.2 Working with multiple configurations


    During development, you only need a single application configuration in the file
    conf/application.conf. When you deploy to production, you need to be able to use
    different configuration settings. This applies to settings that are either machine-or
    environment-specific, such as directory paths, and to sensitive information such
    as database passwords. In this section, we''ll see how we can configure the production
    environment separately.'
