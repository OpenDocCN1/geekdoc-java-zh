    Don''t worry, we''ll make it better in a bit. But first, without going into too
    much detail (chapter 8 for more detail on templates), let''s see what happens
    in the template.


    # HOW THE TEMPLATE WORKS


    The first line of the list template is the parameter-list.


    ```

    @products: List[Product]

    ```


    With the parameter list, we define which parameters this template accepts. Every
    entry in the parameter list consists of a name, followed by a colon and the type
    of the parameter. In our example, we have one parameter called name, of type List<Product>.^3
    to represent the list of products we want to render. This parameter list will
    be part of the method definition for this template''s render method, which is
    how Play achieve safety for templates.


    Let''s take a look at the next line of code, which starts a block of code:


    ```

    @main("Products catalogue") {

    ...

    }

    ```


    With this code we call another template, the one called main. This is the template
    at /app/views/scala.html, which Play created for us when we created the application.
    It contains some boilerplate HTML that we wrap around all of our pages, so we
    don''t have to worry about that anymore. The code we write in the block will end
    up in the <body> tag of our rendered HTML page. This is how you can compose templates
    in Play, and we''ll see more of this in later chapters.


    > ^3 In Scala syntax, generic type arguments are indicated using square brackets
    instead of angle brackets as in Java.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_66_0.png)'
