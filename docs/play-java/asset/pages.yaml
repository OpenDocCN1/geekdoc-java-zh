  md: '# Deploying to production


    # 265


    A nice thing about the configuration library is that the configuration doesn''t
    break if the development.conf file doesn''t exist; the library silently ignores
    it. This means developers don''t have to provide their own overrides if they don''t
    need to, perhaps because they''re not working on email notifications.


    Make sure to add conf/development.conf to the .gitignore file, whatever version
    control system uses to specify files that aren''t under control, so that one developer''s
    configuration doesn''t affect anyone''s development environment.


    Finally, we have to set up the production environment configuration. In this case,
    including a file that overrides the default settings, like we just with development.conf
    isn''t such a good idea because there will be no error if the file is missing.
    In addition, the file location might not be in advance, often because the production
    database passwords safe from developers (keeping production database safe from
    developers)


    For production, we can use a separate /etc/paperclips/production.conf configuration
    file:


    ```

    include "application.conf"

    email.override.enabled=false

    ```


    This time, the file starts by loading the default configuration in application.conf
    as a resource from the deployment archive, which is followed by the environment
    settings. To use the production configuration instead of the default configuration,
    specify the file as a system property when starting the application:


    ```

    play "start -DConfig.file=/etc/paperclips/production.conf*"

    ```


    In this case, you''ll get an error if the file is missing.


    ```

    (Starting server)

    Type Ctrl+D to exit logs, the server will remain in background

    ```


    ```

    Play server process ID is 61819

    Ops cannot start the server.

    Configuration error:

    Configuration error(/etc/paperclips/production.conf):

    /etc/paperclips/production.conf (No such file or directory )

    ```


    Alternatively, instead of -DConfig.file, you can use -DConfig.url to load the
    configuration file from a remote location.


