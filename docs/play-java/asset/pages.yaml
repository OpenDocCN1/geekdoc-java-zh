  md: '# Using routing to wire URLs to action methods


    ROUTE WITH DEFAULT VALUE

    We (and should) choose a default value to use if none is specified in the request.
    For example, for our list of products with pagination, the following syntax will
    request the first page to be displayed if no page is specified.


    ```

    GET /products controllers.Products.list(page: Int = 0)

    ```


    Using this syntax, it''s impossible to get "Bad request" errors due to missing
    parameters. When the parameter isn''t provided, the specified value "1" in this
    case will be used instead. Please note that we''re using the Int key, as it is
    the Scala representation of an integer. This is the equivalent of the Java Integer
    type.


    FIXED VALUE AS PARAMETER

    Now that we saw the home page to display the first page of our product list, we
    can do this using a fixed value as a parameter:


    ```

    GET / controllers.Products.list(page: Int = 0)

    ```


    The value of the page parameter will always be 1 on the home page, even if another
    value is provided using a query string parameter.

    Using all these syntaxes for route definition, it''s very possible to construct
    multiple routes that will match the same URL. What happens then?


    CONFLICTING ROUTES

    Many routes match the same request, if there is a conflict, the first route (in
    declaration order) is used. For example, in our routes we will have the following
    definitions:


    ```

    GET /products/new controllers.Products.newProduct()

    GET /products/:ean controllers.Products.details(ean: String)

    ```


    The bottom line would also match /products/new. But since there is a line matching
    that URL, first is the one that is used. Therefore, calls to /products/new will
    be served by newProduct(), which is exactly what we want. If we want to switch
    the lines, the same request would be handled by the details() method with the
    value "new" used for the ean parameter, which would cause problems.

    We now enough about route definitions. Let''s get back to our application.


    # 5.3.4 Completing our routes file


    With all we''ve learned about routes far, we can finish the routes for our application''s
    product catalog. Edit the routes file so it contains the routes shown in the following
    listing.


    | Listing 5.8 Our current routes file |


    ```

    # Home page

    GET / controllers.Products.index()

    GET /products controllers.Products.list(page: Integer = 1)

    POST /products/ controllers.Products.save()

    ```


