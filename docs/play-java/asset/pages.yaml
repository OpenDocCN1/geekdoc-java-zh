  md: "# Forms 107\n\nAs you see, the edit product form and the create new product\
    \ form can use the template. If the form contains a value for the product's ID,\
    \ it's an update; other-wise, we're creating a new product.\n\nWe're now able\
    \ to display a form to create or edit a product. Next, we need to process the\
    \ data from the submitted form.\n\n# 6.1.3 Processing input\n\nAfter the form\
    \ is submitted, our action method that handles the form submission transforms\
    \ the data sent to the server into a Product instance and saves. Finally, it sets\
    \ a success message in the flash scope¹ and redirects to the page showing all\
    \ products. The following lists save(), an action method that processes the form\
    \ submission.\n\n# Listing 6.4 The save ( ) action method\n\n```\npublic class\
    \ Products extends Controller {\n    private static final Form<Product> productForm\
    \ =\n    Form.form(Product.class);\n```\n\n```\npublic static Result save() {\n\
    \    Form<Product> boundForm = productForm.bindFromRequest();\n    if (boundForm.hasErrors())\
    \ {\n        flash(\"error\", \"Please correct the form below.\");\n        return\
    \ badRequest(details.render(boundForm));\n    }\n\n    Product product = boundForm.get();\n\
    \    product.save();\n    flash(\"success\", String.format(\"Successfully added\
    \ %s\", product));\n    return redirect(routes.Products.list(1));\n}\n```\n\n\
    Save that instance\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_129_0.png)\n\n\
    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_129_1.png)\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_129_2.png)\n\
    \n![](img/1f90c92b70e5931c18b6f9f04c8da72e_129_3.png)\n\nFirst, we're creating\
    \ the form with all the information that we have received via HTTP ①. Then, we\
    \ check whether the submitted information is valid, and display a message if it\
    \ isn't.\n\nIf everything's in order, we ask the new-populated form for the Product\
    \ instance ② The object instance will have its fields populated with the data\
    \ extracted from the HTTP request. We then save the Product instance to our data\
    \ store. Finally, we present another page to the user, using a redirect to the\
    \ \"all products\" page.\n\nOur save() action method is also represented in our\
    \ routes file:\n\n```\n/ /products/ controllers.Product.save()\n```\n\n> ¹ We\
