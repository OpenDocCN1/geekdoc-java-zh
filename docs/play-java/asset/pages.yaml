  md: '# Determining today''s enterprise application challenges 63


    SOA is relatively new in enterprises. The main drawback is complexity due to the
    abundance of configurations and implementation details. The fact is that extra
    effort to maintain all the services is required. Most of the time communication
    between the different services happens through message exchange. Extra care is
    required to design the message exchange flow and message composition. SOA is also
    often not well compliant, meaning exposing services over the web still requires
    extra effort.


    Obviously, nothing new is starting to change this status quo: the web. This is
    a game changer for enterprise applications, and it brings new challenges.


    # 4.2 Determining today''s enterprise application challenges


    It seems natural today to request information and get it immediately. The internet
    has changed our everyday life. If we want to know what time flight from Singapore
    arrives, we can connect to the airport website and get immediate results. We don''t
    need to wait one or two hours to have information. Better information is pushed
    to us; our phones can alert us when important (or not so important) events occur.
    For example, our phones can tell us as soon as the Celtics win the NBA tournament.
    Applications reactive.


    As users, we''re now dealing with multiple flows of information. We are longer
    pulling information; now information is pushed at us.


    A user''s interaction with an IT system has also changed dramatically. We don''t
    need to read a user manual before using a hotel reservation system, nor do we
    need a training session. Software is now accessible and usable by everyone.


    Because the software is easily reachable and accessible, users can add and more
    information to the different systems, creating more and more data. Today, we''re
    dealing with a large quantity of information.


    With such a large amount of information, most internet web applications provide
    a way to query that through a public API, allowing third parties to combine that
    information and redistribute it in real time. Web applications talk to each other
    in real time.


    Simplicity is also key. Most of popular web applications focus on one problem
    and provide a simple solution. Enterprise applications should learn from them.
    This doesn''t mean that the application is simple in itself; it means that the
    application can be used to extend.


    Scalability is usually a strong requirement for enterprise. But talking about
    enterprise scalability is not the same as talking web-application scalability.
    The latter case, we usually mean that the application can handle millions of users.
    Enterprise scalability means that the applications should be able to grow with
    enterprise needs. This can be in terms of users, but it also means that the applications
    should be able to scale to new business requirements. For example, if company
    X acquires company Y, the address book application from company X should be able
    to absorb company Z''s address book. Scalability is a matter of supporting more
    users and more data'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'but also integrating more systems. Cloud computing helps with the first part,
    and simple architecture and cloud APIs help in the second case. Again, modern
    web applications provide for these two requirements naturally.


    You probably agree that all of this is now a given when we talk about web applications.
    Enterprise applications rarely meet these requirements. And as guessed, enterprise
    has to address these challenges to stay on the competitive edge:


    +   - Push real-time data to their customers/employees

    - Deal with a large flow of data

    - Improve scalability and integration

    - Provide easy integration with the latest clients

    - Ensure interoperability between applications and existing systems


    The internet, HTML5, XML, JSON, and the HTTP protocol (and good developers) provide
    most of the low-level requirements to address these challenges, as we''ll see
    in the next chapters. There''s also a paradigm shift in which client-side programs
    are becoming more and more elaborate due to the hardware evolution; for example,
    your phone is more powerful than your two-year-old desktop computer. Enterprise
    will adapt to this new paradigm as well.


    In enterprise, the main challenge is to aggregate and redistribute data to other
    systems or users. Usually the needed information is dispatched over multiple systems,
    and one needs to aggregate them. Because we''re dealing with more and more information,
    processing large amounts of data in real time will be the big requirement. Another
    implicit requirement is overall simplicity and the tool''s simplicity. The systems
    we''re building should be comprehensive, and the tooling should make it easy for
    us to build a great system, removing complexity from our way. The Play framework
    completely meets that requirement. Building simple blocks allows us to create
    reliable and complex systems that match business needs. A modern framework should
    be able to help address the mentioned challenges. Obviously, we''ll discover through
    the book that Play addresses exactly these challenges; but first, let''s see how
    Play''s application architecture should work in an enterprise context.


    # 4.3 Understanding Play''s application in an enterprise context


    As we already explained in chapter 1, Play is a web framework that focuses on
    the following:


    +   - Simplicity

    - High productivity

    - Modern web application development


    Simplicity doesn''t mean that you can only build simple applications. On the contrary,
    it means that should be easy to integrate your application components. The idea
    is to decompose your complex application with simple building blocks. Each building
    block should be simple enough that it''s comprehensible by everyone without much'
