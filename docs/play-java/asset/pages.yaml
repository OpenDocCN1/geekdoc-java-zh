  md: '# About scopes


    95


    Well, really, there is no secret. Play stores the client-side using cookies. It
    also encourages developers to think differently, to architect their application
    differently (following REST principles), and to fully embrace client-side technology.

    While a EE developer would see the session as a cache in which everything is allowed,
    Play forces developers to think in terms of web development. And it is a good
    thing, since we happen to use Play mainly to develop web applications. So, no,
    you can''t save your complete object tree in your session. And no, you can''t
    save your last 10,000 database results. In fact, you can "only" up to 4 KB (maximum
    cookie size), and you can only store string values. You might see that in as a
    step back, but we''ll attempt to explain to you that in fact it''s a step forward.
    But first, let''s go back and explain the four scopes in Play.

    The four different scopes can be viewed as shown in figure 5.14.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_117_0.png)


    Figure 5.14 In Play, request scope is the shortest lived and session is the longest
    lived.


    # 5.5.3 The context object


    First of all, all accessible scopes in Play are stored in a Context object. The
    Context object is a final class that contains the Request, Response, Session,
    and Flash objects. You can access it statically using the current() method. From
    there, you can access the Play scopes:


    ```

    Context ctx = Context.current();

    Request request = ctx.request();

    Response response = ctx.response();

    Session session = ctx.session();

    Flash flash = ctx.flash();

    ```


    In your controllers, the request, response, session, and flash objects are also
    available directly, since they are part of the Controller class that any controller
    must extend.

    Let''s take a look at all the scopes, with the request scope.


    # The context object and thread safety


    If the object is static, what does that mean for thread safety? The answer is
    easy. Each Context object is associated to the current thread using a ThreadLocal
    object. This ensures that there''s no thread-safety problem and that your context
    object is really your context object and not the one from your neighbor (each
    thread holds an implicit reference to its copy of a thread-local variable). This
    ensures that our scope objects are our scope objects.


    If you didn''t follow all of that, just take our word for: access to the context
    and scope objects is thread-safe.'
