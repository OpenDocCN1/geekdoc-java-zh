  md: "# CHAPTER 6 Handling user input\n\nWhen Play encounters this URL, it should\
    \ look up the Product in the database, based on the provided EAN. In order to\
    \ achieve that, we have to implement the play.mvc.QueryStringBindable interface,\
    \ similar to how we implemented Path-Bindable. Because we need to look up Product\
    \ objects, we'll implement the interface on our Product model class.\n\nEdit the\
    \ Product model class.\n\n# Listing 6.11 Project directory structure\n\n```\n\
    warehouse\napp\n    ├── controllers\n    ├── models\n    │   └── Product.java\
    \  The Product class we're going to edit\n    └── views\nconf\n    ├── routes\n\
    \    └── public\n    test\n```\n\nThis time we need to change it to implement\
    \ the play.mvc.QueryStringBindable interface. Like PathBindable, this interface\
    \ provides three methods we need to implement:\n\n+   * Option<T> bind(String\
    \ key, Map<String,String<>> data)\n* String unbind(String key)\n* String javascriptUnbind()\n\
    \nThe bind gives us access to the query parameters, both values and associated\
    \ keys, and must return an Option object of type T. In our case, T is Product.\
    \ Option is the class that allows us to say either we return something or we return\
    \ nothing, giving a nicer alternative to returning null. The data parameter of\
    \ the bind method gives us access to the query parameters. It's represented by\
    \ a Map that contains the query parameter name with their corresponding values.\n\
    \nLike before, bind indicates how to bind our product from the URL parameters,\
    \ unbind tells when a Product is referenced from the view, and javascriptUnbind\
    \ tells us JavaScript. In our case, the logic is based on the id property of our\
    \ Product class.\n\nLet's implement the required methods in the Product model\
    \ class. Please note that this is a simple example, so it doesn't check for null\
    \ values or other possible errors.\n\n# Listing 6.12 Product class that is QueryStringBindable-aware\n\
    \n```\n...\nimport play.mvc.PathBindable;\nimport play.mvc.QueryStringBindable;\n\
    public class Product\n    implements QueryStringBindable<Product> {\n    ...\n\
    // We're telling Play that we're defining a new Binder to bind query parameters\n\
    ```"
