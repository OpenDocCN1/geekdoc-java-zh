  md: "```\nlibraryDependencies === Seq(\njavaJdbc,\njavaEbean,\ncache,\n\"com.google.guava\"\
    \ % \"guava\" % \"14.0\"\n)\nplay.Project.playJavaSettings\n```\n\nThe next time\
    \ your application is started, Play will resolve the dependency, automatically\
    \ download the JAR, and add it to the classpath.\n\nThe dependency resolving works\
    \ is that for some preconfigured dependency repositories are queried for the correct\
    \ versions of the files you need. There are various dependency repositories on\
    \ the internet that serve the majority of the libraries available in the Java\
    \ ecosystem. The best-known repository is the Maven central repository at http://search.maven.org/.\n\
    \nThe dependency management system is smart enough to download your dependencies',\
    \ also called transitive dependencies. If you're using transitive dependencies,\
    \ and you want to include a library that has lists of dependencies yourself, you\
    \ no longer have to keep track of what version of JAR to put. The dependency management\
    \ system does all of this for you.\n\nAnother great benefit of using dependencies\
    \ is that you don't need to keep any library with your source files, keeping your\
    \ codebase nice and small, while ensuring that it will always build (as long as\
    \ any repository server containing the files is still available). Another bonus\
    \ you get is that it's easy to upgrade a library to a different version: change\
    \ the version in your dependency declaration, and you're done.\n\nPlay 2 will\
    \ automatically resolve any dependencies as soon as it finds any change in this\
    \ file when your application starts, so you don't need to worry about having to\
    \ trigger a dependency update.\n\nIf you want to use a library that's not in any\
    \ repository (yet)—example, when it's a new library, or one you developed in-house—you\
    \ don't have to use dependency management to use it. You can create a new directory\
    \ lib in your application's root directory, and a JAR Play finds there will be\
