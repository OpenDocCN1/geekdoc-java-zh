    \ 9.9 shows the new view.\n\n# Listing 9.9 Comet client-side implementation (our\
    \ view)\n\n```\n@main(\"Comet\") {\n    <iframe style=\"display:none\" id=\"messages\"\
    \n        src=\"@Routes.Application.liveUpdate.unique()\"></iframe>\n    <ul id=\"\
    container\" style=\"text-align:center\"\n        class=\"nav nav-tabs nav-stacked\"\
    ></ul>\n}\n```\n\nFor each chunk we receive, we add the order to the div with\
    \ ID container. The script tag refers to the parent jQuery functions. Because\
    \ the iframe receives the liveUpdate action method, the end user sees the comet\
    \ as a normal web page. We now need to update our route file with the following\
    \ routes:\n\n```\nGET /live controllers.Application.index()\nGET /live-update\
    \ controllers.Application.liveUpdate()\n```\n\nIf you run this from a web browser\
    \ (http://localhost:9000/live), you will see orders getting displayed on the web\
    \ page.\n\nPlay provides a helper to handle Comet-chunked streams that does almost\
    \ the same as we just wrote. It actually does, by pushing initial blank data for\
    \ browser compatibility and supporting both String and JSON messages. Let's rewrite\
    \ the example to use Comet (see listing 9.10).\n\n# Listing 9.10 liveUpdate()\n\
    \n```\npublic static void liveUpdate() {\n    Comet comet = new Comet(\"parent.cometMessage\"\
