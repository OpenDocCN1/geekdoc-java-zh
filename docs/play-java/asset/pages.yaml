  md: '# What Play is


    Being “full stack” is not only a question of functionality, which may already
    exist as a collection of open source libraries. After all, what''s the point of
    a framework if libraries already exist and provide everything you need to build
    an application? The difference is that a full-stack framework provides a documented
    pattern for using separate libraries together in a certain way, and therefore
    confidence that a developer can make the separate components work together. Without
    this, you never know you''re going to end up with two incompatible libraries or
    a badly designed architecture.


    When it comes to building a web application, what this all means is that the common
    tasks are directly supported in a simple way, which saves you time.


    # 1.1.2 Java and Scala


    Play supports Java, is in fact the best way to build a Java web application. Java’s
    success as a programming language, particularly in enterprise development, means
    that Play 1x has been able to quickly build a large user community. If you''re
    planning to use Play with Java, you particularly get to benefit from this community''s
    size.


    Recent years have seen the introduction of numerous JVM languages that provide
    a modern alternative to Java, usually aiming to be more concise and for functional
    programming, the ultimate goal of allowing developers to be more expressive and
    productive when writing code. Scala is currently the most evolved of the statically
    typed JVM languages, and is the second language that Play supports. Scala is meant
    (and proven) to be a scalable language, hence the name. Play 2 takes full advantage
    of the scalability that Scala offers, which means your Java applications will
    get these benefits, too.


    Scalability is one of the major features of Play; it allows you to easily create
    highly scalable applications. Scalability can mean a lot of different things,
    and throughout the book you''ll see examples of how Play allows you to scale both
    horizontally and vertically. Most of this is thanks to Play''s stateless nature,
    but also its foundation of Scala (Akka), which enabled the developers of the framework
    to provide concurrent and nonblocking request processing. It enabled developers
    to support applications in an event-driven way without sacrificing scalability.
    Nowadays, applications need to react to events and display feeds rather than batch
    process during the night. Play was conceived with this perspective in mind. We''ll
    talk more about this in the reactive programming section in this chapter.


    > Our sister book: Play for Scala

    If you''re interested in using Play to build web applications in Scala, then you
    should look at Play for Scala, which was written at the same time as this book.
    The differences between Scala and Java go beyond the syntax, and the book is much
    more than a copy of this book with code samples in Scala. Play for Scala is focused
    on the idiomatic use of the Scala language with Play 2.'
