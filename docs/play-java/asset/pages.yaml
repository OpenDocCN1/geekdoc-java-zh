  md: '# Internationalization


    Users of your application may come from different countries and use different
    languages, as well as have different rules for properly formatting numbers, dates,
    and times. The combination of language and formatting rules is called a *locale*.
    The adaptation of a program to different locales is called internationalization
    and localization. These words are so lengthy and often used together—which makes
    it even worse—they are often abbreviated as *i18n* and *l10n*, the number between
    the first and last letter is the number of replaced letters. In this section,
    we''ll demonstrate the tools Play provides to help you with internationalization.


    > Internationalization versus localization

    Although it''s easy to mix them up, internationalization and localization are
    different things. Internationalization is a refactoring to remove locale-specific
    code from your application. Localization is making a locale-specific version of
    an application. In an internationalized app, this means having one or more locale-specific
    versions. In practice, the two steps go together; you usually internationalize
    and localize one part of an application at a time.


    In this section we only discuss internationalizing the static parts of your application:
    things that you''d normally hard-code in your templates or your error messages,
    for example. We won''t cover internationalizing your dynamic content, so having
    the content of your web application in multiple languages isn''t included.


    # 8.1 Configuration and message files


    Building a localized application in Play is mostly about text and involves writing
    message files. Instead of putting literal strings like "Log in," "Thank you for
    your order," or "Email is required" in your application, you create a file in
    which message keys are mapped to these strings.


    For each language that your application supports, write a message file that looks
    like:


    ```

    welcome = Welcome!

    users.login = Log in

    shop.thanks = Thank you for your order

    validation.required = (0) is required

    ```


    Here you can see how the message keys are mapped to the actual messages. In the
    last example, there''s a placeholder that will be replaced by a value when this
    message is used. The dots in the keys have no meaning, but you can use them for
    logical grouping.


    To get started, you must configure Play so that it knows which languages are supported.
    In the `application.conf` file, list the languages that you support:


    ```

    application.langs=en,en-US,nl

    ```'
