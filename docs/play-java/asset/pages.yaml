  md: "# Current Orders\n\nPrepare them all\n\n| Order 221862654 |\n| Order 1068025170\
    \ |\n| Order 683713848 |\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_238_0.png)\n\
    \nFor example, the following code sends back the \"Hello World\" message to clients:\n\
    \n```\npublic static Result index() {\n    return ok(\"Hello World\");\n}\n```\n\
    \nSince Play knows the entire response body (\"Hello World\"), Play sets the appropriate\
    \ Content-Length HTTP header, as well as any other mandatory headers. You don't\
    \ have to specify anything yourself to make this happen.\n\nThis would be the\
    \ appropriate method to use if the number of expedited orders was fixed. For our\
    \ case, the number of expedited orders is unpredictable; we want to stream them\
    \ as they arrive. Play can't calculate the length of the response, and we don't\
    \ know if and when to close the connection. Therefore, this method of sending\
    \ responses is not suitable in this case.\n\nAnother problem with this approach\
    \ is that the entire response must be loaded into memory—which can be problematic\
    \ if the response is very big, as is when transferring files.\n\n# 9.4.2 Serving\
    \ files\n\nPlay is able to stream a file to web clients without loading the file's\
    \ content into memory. If we take our previous report example, or the report computation\
    \ is done, we can easily send the computed report as a PDF file:\n\n```\npublic\
    \ static Result retrievePdf(String reportId) {\n    return ok(new java.io.File(report.asPdfFile()));\n\
    }\n```"
