  md: "# Modeling the real world in code\n\nWe'll start this chapter by developing\
    \ the data model as Java classes, extending the application we created last chapter.\
    \ Then we'll make it possible to store data in a relational database using persistence\
    \ facilities that come with Play.\nFirst, we'll expand our data model.\n\n# 7.1\
    \ Modeling the real world in code\n\nThe most basic requirement of our warehouse\
    \ application is tracking of what stock items are in what kind of product item\
    \ is. A common trick for creating a data model is to use a case, and write down\
    \ all the nouns and the relationships between these nouns. If we apply the requirements\
    \ from chapter 4, we get the model shown in 7.1.\n\nA data model can be seen as\
    \ a representation of a real-world concept. Object-oriented languages are quite\
    \ suitable for this. A key aspect of objects is that they group data and behavior\
    \ in a single entity. For our current data model, we're only interested in grouping\
    \ data; there's no behavior we want to capture yet. JavaBeans are exactly this\
    \ kind of object; they state, but not behavior. They're a collection of fields,\
    \ accessible through instance methods called getters and setters.\n\nA typical\
    \ JavaBean is a pretty piece of code, with unnecessary boilerplate code. If you\
    \ think about it, JavaBeans are private fields with simple getters and setters.\
    \ JavaBeans are full of boilerplate code that can be generated by any IDE of your\
    \ choice. \n\n# 7.1.1 The reasons for getters and setters\n\nThe main reason Java\
    \ classes, and JavaBeans in particular, are often given getter and setter methods\
    \ is to encapsulate data and hide the internal representation of an object.\n\n\
    The difference between calling a getName() method on a Person object and accessing\
    \ its name directly is the difference between asking a person for their name and\
    \ accessing their birth certificate and reading the name on it.\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_161_0.png)"
  merge: -1
  pgno: 161
