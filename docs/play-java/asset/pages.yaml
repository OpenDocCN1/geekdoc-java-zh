  md: "# Build configuration files\n\n# 2.4 Build configuration files\n\nThe project\
    \ directory looks like this:\n\n+   - README\n- app\n- project\n  - build.properties\n\
    \  - plugins.sbt\n  - build.sbt\n  - public\n\nOf these files, you'll only deal\
    \ with build.sbt at the top root directory. Both build.properties and plugins.sbt\
    \ are SBT configuration files, which describe the Play version to use and the\
    \ SBT version to use. SBT (Scala Build Tool) is the tool that Play's console and\
    \ build is based upon. We'll tell you more about what this file does when we need\
    \ to change it, but don't worry about it for now.\n\nThe build.sbt is a file you\
    \ will have to edit occasionally. The file looks like this when generated:\n\n\
    ```\nname := \"warehouse\"\nversion := \"1.0-SNAPSHOT\"\nlibraryDependencies +=\
    \ Seq(\njavaJdbc,\njavaBean,\ncache\n)\n```\n\nPlay.project.JavaSettings defines\
    \ your application's version number as well as any managed dependencies it might\
    \ need. Managed dependencies are libraries and modules you use in your application\
    \ that Play can look up and download automatically. This is called resolving dependencies.\
    \ You might be familiar with this process if you've used Maven or Ivy before.\n\
    \nAs you can see, Play has already added some default modules for you. Every Play\
    \ project uses by default the javaJdbc component to interact with databases, the\
    \ javaBean component and the cache module to provide caching capabilities. You\
    \ can read more about the database modules in chapter 7.\n\nIf you want to add\
    \ a dependency on a library, you will need to add a line to the list of dependencies.\
    \ For an example, suppose you want to use Google's Guava library to get some useful\
    \ functionality on top of what the JDK standard library provides. You'd add a\
    \ dependency on version 14.0 like this:\n\n```\nname := \"warehouse\"\nversion\
    \ := \"1.0-SNAPSHOT\"\n```\n\n> 3 Play delegates to SBT.\n4 Visit http://code.google.com/p/guava-libraries/\
    \ for more information on Guava."
