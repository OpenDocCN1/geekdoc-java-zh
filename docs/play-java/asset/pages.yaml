  md: "# Listing 12.10 IntegrationTest.java\n\n```\nimport static play.test.Helpers.*;\n\
    import org.junit.Test;\nimport play.libs.Fibs;\nimport play.test.TestBrowser;\n\
    \nimport static org.junit.Assert.*;\n\npublic class IntegrationTest {\n    @Test\n\
    \    public void simpleProductsTest() {\n        running(testServer(3333), HTMLUNIT,\n\
    \            new F.Callback<TestBrowser>(){\n                @Override\n     \
    \           public void invoke(TestBrowser browser)\n                    throws\
    \ Throwable {\n                    // Test code here\n                }\n    \
    \        });\n    }\n}\n```\n\nWe've configured our test to use the HTMLUnit TestBrowser,\
    \ which instructs Play to use Selenium with the headless HTMLUnit test browser.\
    \ Since this browser is often used, play.test.Helpers.HTMLUnit makes this test\
    \ conveniently available as a constant. There's also a FIREFOX constant that sets\
    \ up the test to use Firefox, but we'll use HtmlUnit.\n\nNow that we have the\
    \ framework for the test, let's implement it. You might notice that the invoke\
    \ method is passed a browser parameter. That object actually represents our test\
    \ browser and allows us to interact with it using FluentSelenium API. We'll use\
    \ it to create the following test:\n\n+   1. Go to the URL for the product list\n\
    2. Assert that at least one link to a product is present on the page\n3. Click\
    \ one of the products in the list\n4. Assert that the browser's location has changed\
    \ to the URL of the product detail page.\n5. Assert that the page displays the\
    \ correct product name.\n\nThe bold verbs in our steps highlight what kind of\
    \ interaction we want with our test browser: we will be able to control navigation\
    \ (go to), simulate interaction (click), and read information from the page so\
    \ we can verify that it works (expect).\n\nThe first step\n\n```\nbrowser.goTo(\"\
    http://localhost:3333/products\");\n```"
  merge: -1
