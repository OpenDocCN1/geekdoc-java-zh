  md: '# 6.6 Summary


    This chapter has been dense, and we saw a lot. We learned how to handle user input—from
    a simple form submission to a more complex submission. We also learned how all
    this was possible through the use of body parsers. We saw in detail how the Play
    binding process transforms user-submitted data into data that our application
    can understand. We also learned how we extend that binding process; we know how
    to customize and create our own binders.


    Once we were ready to process user data, we saw how to validate data. We also
    saw how we could create our own validator if needed. We then saw how to handle
    invalid data and to report those errors back to the user. We finished the chapter
    with a concrete example of how to handle file submission. We''re now able to handle
    any data type, process it, and validate it when in needed. In the next chapter,
    we''ll see how to model our warehouse application.


