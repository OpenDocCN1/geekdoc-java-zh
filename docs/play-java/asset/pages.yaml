  md: '# CHAPTER 5 Controllers—handling HTTP requests


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_122_0.png)


    Figure 5.17 Secret key with a cluster of applications


    This is the key we''re signing our cookies with. It''s essential to keep it, so
    sure you don''t divulge your key. This also brings us to another important point:
    if you''re running multiple instances of your application, the secret key needs
    to be shared between the applications, or one instance won''t be able to verify
    the data that has been set by another instance.


    Let''s imagine the following scenario: One load balancer and the same application
    are running on two different nodes: server1 and server2. If server1 and server2
    don''t share the same key, the clients will need to communicate with the server
    every time; otherwise the server can''t decipher the cookies. If both server1
    and server2 have the same key, they can decipher the cookies, and neither the
    load balancer will need to distinguish between server1 and server2.


    Figure 5.17 illustrates the data encryption/decryption flow.


    > But what about my session timeout?

    We agree that session timeouts were introduced as a technical solution for server-side
    session storage rather than as useful feature. Indeed, without this feature, user
    sessions could only grow on the server, resulting in memory deprivation. But developers
    are so used to session timeouts that they actually see them as useful functionality.'
