  md: "At you first expect to avoid this issue by deploying the application and then\
    \ editing\nt configuration by hand. This doesn't work, or is at least inconvenient,\
    \ because the\napplication is packaged in a JAR file. Besides, modifying the distributed\
    \ application is\nerror-prone and not convenient to automate\n\n# Don't use the\
    \ same credentials for your production database\n\nYou might be the first person\
    \ to consider the \"pragmatic\" solution of using the\nsame settings for development,\
    \ test, and production environments, to avoid the need\nfor separate configurations.\
    \ This seems like a good idea right up the moment\na team member mistakenly thinks\
    \ he's logged into a development environment\ndeletes the entire production database.\n\
    \nIf you use different database credentials for each environment, perhaps adding\
    \ test\nor dev user names, then you have to try a lot harder to make this kind\
    \ of mistake.\n\nWhat you need is a default application configuration that is\
    \ \"safe\" for the test environment. A safe configuration is one that won't cause\
    \ unwanted side effects when you do\nthings like running.\n\nSuppose your application\
    \ sends email notifications to users. In the test environment, it would be useful\
    \ to configure the application to override the recipient address\n use a safe\
    \ email address like info@example.com instead. Put the following\ning in config/application.conf:\n\
    \n```\nmail.override.enabled = true\nmail.override.address = \"info@example.org\"\
