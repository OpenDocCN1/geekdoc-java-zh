    # About HTTP methods


    If you''re unfamiliar with the HTTP protocol, the concept of an HTTP "method"
    may be new to you. An HTTP method has nothing to do with the kinds of methods
    you find in Java. There''s a lot of documentation to be found about the HTTP protocol
    and its methods and what they imply; search the web if you''re curious, but here''s
    a summary of what you will get through the chapter.


    The method of an HTTP request signifies the purpose of your request: whether you
    want to retrieve a resource from the server or post information to it, for example.
    A number of different methods are defined in the HTTP specification, and some
    extensions to the protocol add more, but the two most-used methods in the HTTP
    standard are `GET` and `POST`.


    A `GET` request is a retrieval for a resource, and it contains no body, although
    the URL may contain parameters (everything that comes after the ?). It''s important
    that a `GET request may never have any lasting effects on the server; every time
    you `GET` a URL it should have the same effect. The fancy word for this *idempotence*.
    The most important thing to remember is that you should only use it for information
    *retrieval*, not for submission of data.


    The POST method, on the other hand, is a request for data submission, and may
    contain a body. It is still directed at a URL, but a `POST` request has effects
    server-side. A `POST` request is often used for forms that create or modify information.
    This is why your browser will warn you when you reload a URL that you POSTed to.


    There are many methods in the HTTP standard, such as `PUT` and `DELETE`, but we
    will talk about them when we discuss HTTP APIs.


    The `Application` class in the `controllers` package. We call methods that handle
    requests `action methods`.


    The `routes` file is important to any Play application. It allows you to "design"
    your URLs. This is a big deal. (If not most) other Java web frameworks dictate
    what your URLs should be, or the framework can''t do its job. Because Play gives
    you full control over your URL schema, you can design clean, human-readable, bookmarkable
    URLs.


    The next directory in our list is the `project` directory, and it contains files
    that configure your build process.'
