  md: "# Body parsers\n\n# Listing 6.17 Registering your AnnotationDateFormat in the\
    \ Global.java file\n\n```\npublic class Global extends GlobalSettings {\n    public\
    \ void onStart(Application app) {\n        Formatters.register(Date.class, new\
    \ AnnotationDateFormat());\n    }\n}\n```\n\nNow we can annotate any object on\
    \ a model class to indicate that we want to bind and unbind Date from a Form object\
    \ using the following syntax:\n\n# Listing 6.18 Object model using the DateDateFormat\n\
    \n```\npublic Person {\n    @DateFormat(\"MM-dd-yyyy*\")\n    public Date birthDate;\n\
    }\n```\n\nNow in our view, each Person's birth date will be displayed as MM-dd-yyyy.\
    \ When submitting a form, the birthDate attribute will contain a Date object with\
    \ the expected date. Note that in the example, what we've seen is already part\
    \ of Play. You don't need to code it and can use the @DateTime annotation defined\
    \ in play.data.format.Format classes.\n\n# Body parsers\n\nWe've looked at request\
    \ body data mapped to form objects and vice versa, but we haven't explored how\
    \ the raw bodies are processed. This process is the job of body parsers.\n\nEach\
    \ incoming HTTP POST and PUT request contains a body. This body may be single\
    \ or multipart, and may contain XML, JSON, binary data, or any other type specified\
    \ in the request's Content-Type header. A body parser will parse the body (the\
    \ name) into a Java object. Further operations, such as formatting, can then take\
    \ place. Figure 6.10 illustrates this process.\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_145_0.png)\n\
    \nFigure 6.10 Body parser interaction with an incoming request"
