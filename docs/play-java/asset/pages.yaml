    # 2.7.3 IntelliJ IDEA


    IntelliJ IDEA is a conceptual IDE from JetBrains. It is open source, and the community
    edition is free to use, with more powerful features available in the paid "ultimate"
    edition.


    Since version 12, IntelliJ supports for Play 2. This means you get syntax highlighting,
    checking, and autocomplete in Play 2 templates and routes files as shown in figure
    2.8.


    Play 2 can make an IntelliJ "project" out of your application, the model that
    is part of this project can be imported into any existing project you might have.
    To create the IntelliJ, run the idea command from the Play 2 console.


    To open the project in IntelliJ, select File > Open project... from the menu bar,
    and choose the directory for your application.


    # 2.7.4 Using a debugger


    One of the most useful features in Java IDEs are their debuggers, which tap into
    the JVM and allow you to pause code execution at any point (such as a point called
    a break point) to inspect the state of your application.


    To debug a Play application, you need to start it in debug mode, and configure
    your debugger to use remote debugging, which means your debugger will connect
    to a JVM that''s already running, rather than the IDE launching and connecting
    to that.'
