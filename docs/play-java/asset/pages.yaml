  md: 'You can substitute these by specifying more parameters in the call to Messages.get():

    Messages.get("validation.required", "email")


    This will result in the string email is required. MessageFormat gives you more
    options. Suppose that we want to vary our message slightly, depending on the parameters.
    Suppose that we are showing the number of items in our shopping cart, and we want
    to display "Your cart is empty," "Your cart has one item," or "Your cart has 42
    items" depending on the number of items in the cart. We can use the following
    pattern for that:


    ```

    shop.basketCount=Your cart (0,choice,0#is empty|1#has one item|1 < has 0 items).

    ```


    Now if we use the following in a template


    ```

    <p>@Messages("shop.basket", 0)</p>

    <p>@Messages("shop.basket", 1)</p>

    <p>@Messages("shop.basket", 42)</p>

    ```


    we get the following output:


    ```

    Your cart is empty.

    Your cart has one item.

    Your cart has 42 items.

    ```


    Using this, you can achieve advanced formatting that can be different for each
    language, decoupled from your application logic. For more possibilities with Message-Format,
    consult the Java SE API documentation.


    # 8.7 Summary


    In this chapter, we''ve seen that Play ships a type-safe template engine, based
    on Scala. This type-safe template engine helps you write more robust templates
    that give you more confidence that everything will still work as intended after
    you refactor. On top


    The template syntax is quite concise: The # character is the special character.
    Any value referenced in the template actually resolves to an object, and you can
    call methods on it. If you attempt to use a value or method that does not exist,
    Play will tell you exactly what and where the mistake is.


    Templates are compiled to classes, and we have seen how to compile complex pages
    from reusable pieces, by making use of composition.


    With the asset pipeline, we can effortlessly use LESS and CoffeeScript instead
    of CSS and JavaScript, and it can also compile JavaScript into better JavaScript
    with the Google Closure compiler.


    Finally, the internationalization functionality of Play is powerful and allows
    you to make your application available in multiple languages.


    In the next chapter, we''ll take a closer look at the advanced asynchronous features
    Play 2 provides.'
