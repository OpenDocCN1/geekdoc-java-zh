  md: '# CHAPTER 8 Producing output with view templates


    In this chapter we''ll show you everything you need to know to use Scala templates
    in your Play application to create views. But Scala templates are not your only
    option. At the end of the chapter, we''ll show you alternative template engines.


    But first, we''ll dive deeper into how Scala templates work, and why they''re
    the default option, for Java applications.


    # 8.1 The benefits of compiled, type-safe templates


    Even when developing a Play 2 application in Java, your default option for templating
    is the Scala template engine. This might be surprising, because you explicitly
    chose to use Java over Scala.


    First of all, don''t be afraid; unlike any other templating system, you can just
    learn how to do certain things, such as iterating over a collection or making
    an if/else decision, without knowing how it works or what the syntax means. Also,
    lot of the Scala syntax is very similar to Java; the following snippet code is
    valid syntax for calling a method with a parameter on an object in both Java and
    Scala:


    ```

    catalog.getProduct(ean);

    ```


    The use of Scala is not the only thing that sets the Scala templating engine apart
    from other templating systems. The most conventional templating systems work is
    that you write a template file in a custom syntax, and you call the engine by
    the filename of that template. The template engine then loads and evaluates it.¹
    This is when it''ll depict custom instructions, often called tags, which describe
    the template structure. These are usually instructions such as loops, if/else
    structures, or including or extending some other template file.


    After the template structure is parsed, the template engine will start generating
    output, at which point it will evaluate the dynamic parts of the template, the
    expressions. These resolve the values that serve as input for the template tags,
    or just output variable. These expressions are often defined in some template
    language, such as the Unified Expression Language in JEE frameworks, or any dynamic
    language as Ruby or Groovy.


    One of the downsides of this approach is that this expression-evaluation work
    has to be repeated every time the template is rendered. Every single time. That''s
    wasteful.


    Another downside is that most expression engines are dynamically typed, meaning
    that there''s no way to guarantee what kind of object will end up in your templates,
    and therefore the compiler can''t warn you ahead of time when you''re trying to
    do something that can''t work. Any mistake you make in regard will show up as
    a runtime exception, and you have to hope to run into it before the mistake makes
    it into production.


    ¹ The way this evaluation differs per template system. JSP and Groovy templates,
    for example, get compiled into actual bytecode.'
  merge: -1
