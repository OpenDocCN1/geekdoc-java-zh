    # 9.3 Scheduling asynchronous tasks


    In Play, you can schedule repetitive tasks using Akka, either by using an actor
    or by passing a Runnable class. For example, to send an order to the default actor
    every five seconds:


    ```

    Akka.system().scheduler().schedule(

