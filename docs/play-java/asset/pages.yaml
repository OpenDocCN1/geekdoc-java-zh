  md: '+   * Loose coupling

    * Service reusability

    * Standardized service contracts

    * Service discoverability


    Service-oriented architecture (SOA) is a software design and software architecture
    pattern based on structured collections of software modules, known as services,
    that collectively provide the complete functionality of a large software application.
    The purpose of SOA is to allow easy cooperation of a large number of applications
    that are connected over a network.


    The most common implementations are done the so-called ESB (enterprise service
    bus). Each service communicates through messages. An ESB usually performs the
    following tasks:


    +   * Monitor and control routing of message exchange between services

    * Control deployment and versioning of services

    * Ensure reusability of services

    * Provide commodity services like event handling, data transformation, message
    and event queuing, security or exception handling


    Figure 4.3 illustrates a typical SOA implementation of the applications from the
    previous figure.


