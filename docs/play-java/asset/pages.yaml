  md: "# Data binding\n\nGET /products/:id Products.edit(id: Long)\nand you call:\n\
    \nhttp://localhost:9000/products/12\nPlay will convert the string \"12\" (the\
    \ query path) to the Long 12.\n\nData binding is the reverse process. We have\
    \ an object and we want to translate it into a valid URL or form representation.\
    \ This is notably used in case of reverse routing. For more information about\
    \ reverse routing, please refer to section 5.3.5.\n\nIt's important to note that\
    \ in Play, each type of binding can be customized and extended. Let's take a step\
    \ back first, and see how our product is mapped.\n\n# 6.2 Binding simple values\n\
    \nProduct is defined as the following class:\n\n```\npublic class Product {\n\
    \    public String bean;\n    public String name;\n    public String description;\n\
    }\n```\n\nTo fully understand how binding works, we'll cheat a little and respond\
    \ to a GET HTTP request to trigger our save() action method, so that we can easily\
    \ make requests using a browser.\n\nLet's edit our routes file, and add the following\
    \ line:\n\n```\nGET /products/save controllers.Product.save()\n```\n\nWe can now\
    \ invoke our save() action method from the browser, and we should remove this\
    \ route entry we're done experimenting (and use the POST /products/one).\n\n```\n\
    http://localhost:9000/product/save?bean=111111111111111&name=product&description=%a20description\n\
    ```\n\nThe first line of the save() action method is the most important one:\n\
    \n```\nForm<models.Product> productForm = form(models.Product.class).bindFromRequest();\n\
    ```\n\nThis creates a new Product instance and then, for each HTTP request that\
    \ matches a property name, we set the value on that property. For this GET request,\
    \ a new Product is created and the bean parameter is bound to the bean property,\
    \ the name parameter is bound to the name property, and so on.\n\nOur product\
    \ form is filled with the HTTP parameter values from our request. We can then\
    \ access the newly created Product instance with the following code:\n\n```\n\
    models.Product product = productForm.get();\n```\n\nAnd the product object contains\
    \ the following data:\n\n```\nean: 111111111111111,\nname: product,\ndescription=a20\
    \ description\n```"
