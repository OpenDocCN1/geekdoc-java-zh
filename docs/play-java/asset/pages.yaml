  md: '# What do we mean by asynchronous data?


    Traditional web frameworks use "call-and-return," also known as synchronous processing.
    It means that the client of a service calls the service and stops; it waits for
    the service to complete its task before the client continues. If the client code
    has nothing else to do, this places a burden on the system running the client,
    it keeps the code hanging around in memory with nothing going. For example, let''s
    imagine you''re requesting a report to be displayed on the page. Generating the
    report is pretty intensive computation. Using synchronous processing means that
    every client will have to wait for this intensive computation to finish, as illustrated
    in figure 9.1.


    In contrast, if we were to delegate the intensive processing to another subsystem,
    our framework would have more time to answer the other clients or do other things.
    For example, we could call one of the services to compute the report and another
    time to calculate a second report. These two reports could be executed in parallel
    instead of sequentially. In these cases, what''s called for asynchronous processing.
    You can think of this as a client firing off a message to a service and then doing
    some other work. The service does its work and when it''s done, it fires a response
    back to the client.


    To accomplish this kind of functionality, Play uses an event-driven framework
    called Akka^1 to process every client request. This means that every request is
    sent, the processing of the request is delegated to the Akka event-driven framework,
    making Play asynchronous by nature. The Akka subsystem finishes processing the
    request, Akka calls back to Play, and Play issues a response to the client. Figure
    9.2 illustrates precisely that.


    By default, Play is intended to work with short requests. That means that if a
    client''s processing time is long (for example, waiting for a long computation),
    it''ll


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_230_0.png)


    ^1 Akka is also part of the type-safe stack. If you want to know more about Akka,
    visit http://akka.io and read Akka in Action: http://www.manning.com/rostenburg/.'
