  md: '# Adding a controller and actions


    In chapter I we edited the Application class, changing the default output and
    adding custom operations. The Application class is an example of a controller
    class. Control-lers are used as a home for action methods, which are the entry
    points of your application. Whenever an HTTP request reaches the Play server,
    it is handled by something aptly named the router, which, in turn, is configured
    using the conf/routes file, as described in section 2.3. After the correct action
    method is selected, the method executes the logic necessary to come up with a
    return to the client in response to the request. This process is illustrated in
    figure 3.1.


    Let''s create a controller for the new application that we created in the previous
    chapter. The only requirement of a controller class is that it extends play.mvc.Controller.
    It does not have to be part of a specific package, although it is convenient to
    put controllers in the controllers package. Let''s create one for our product
    catalog. Because we''re dealing with products, we''ll call it Products. Create
    Products class under the controllers package (which means the file is named /app/controllers/Products.java).
    Have this class extend Controller, so:


    ```

    package controllers;

    import play.mvc.Controller;

    public class Products extends Controller {

    }

    ```


    An empty controller doesn''t do anything. The whole purpose of controllers is
    to provide action methods. An action method must conform to the following requirements:


    +   - It has to be public.

    - It has to be static.

    - It has to have a return type (a subclass) of Result.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_60_0.png)


    Figure 3.1 Requests routed to actions'
  merge: -1
  pgno: 60
