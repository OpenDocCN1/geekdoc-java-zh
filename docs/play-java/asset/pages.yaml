  md: '# Unidirectional communication with Comet


    Comet sockets are a useful application of chunked transfer encoding. Comet is
    a web application model in which a long-held HTTP request pushes data to a browser,
    without the browser explicitly requesting it. 9.7 illustrates how Comet works.


    With Comet, the browser starts a request, and the server keeps the connection
    open until it has something to send. It''s more efficient than traditional polling,
    in which web client queries the server at regular intervals to see if there are
    new messages. But it only allows for receiving messages from the server: it''s
    a unidirectional communication protocol.


    Comet is an umbrella term, encompassing multiple techniques for achieving this
    interaction. These methods rely on features included by default in browsers, such
    as JavaScript, rather than nondefault plugins. The Comet approach differs from
    the original model of the web, in which a browser requests a complete web page
    at a time.


    A Comet socket is just a chunked text containing only HTML <script> elements.
    In each chunk, we write a <script> tag containing JavaScript that is immediately
    executed by the web browser upon receipt. With this way we can send events to
    the browser from the server; for each message, we wrap it in a <script> tag that
    calls a JavaScript callback function, and write it to the chunked response.


    To illustrate how Comet works, let''s extend our previous example with the concepts
    we just mentioned. Listing 9.8 shows how to send back commands from the server.


    # Listing 9.8 The scheduler onReceive method


    Write to all registered clients a JavaScript command to be executed by the client;
    append order to the html element with id counter


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_242_0.png)'
  merge: -1
