    to access the product form—http://localhost:9000/product/new. If your application
    is no longer public. The @Security.Authenticated method can also be applied at
    the action method level.


    # 10.4 Summary


    In this chapter, you learned Play 2 deals with web security concerns. We first
    saw the general security concepts and the common security breaches. As an example,
    we added protection against cross request forgery to our application. From there,
    we learned what filters are and how to implement basic authentication using them.
    We also saw that filters apply to all requests, they''re a potential tool for
    securing the whole web application. We saw how to use action composition to implement
    fine-grained authentication. Then we put our knowledge into practice: using Play
    2 helpers, we secured our warehouse web application, allowing only users to access
    it.


    Our application is almost done, and in the next chapter, we''re going to learn
    how to deploy it.'
