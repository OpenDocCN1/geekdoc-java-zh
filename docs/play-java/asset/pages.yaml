  md: "# Integration testing\n\n# Listing 12.9 A simple test for an HTTP call\n\n\
    ```\npublic void myIntegrationTest() {\n    running(testServer(9001), new Runnable()\
    \ {\n        @Override\n        public void run() {\n            final WS.Response\
    \ response =\n            WS.url(\"http://localhost:9001\").get().get();\n   \
    \         assertEquals(200, response.getStatus());\n            assertFalse(response.getBody().isEmpty());\n\
    \        }\n    });\n}\n```\n\nUsing the techniques we've seen so far, you can\
    \ test a fair amount of your application. If your application has no UI, it is\
    \ \"just\" a web service, you can test pretty everything. If you have a web application\
    \ with HTML/CSS/JavaScript interface, that's a big part of your application that\
    \ you can't test by verifying the results of your Play code. You need a browser,\
    \ and a way to automate your UI.\n\n# 12.3.2 Browser testing\n\nPlay comes with\
    \ integration with Selenium² and FluentSelenium.³ Selenium is a tool that allows\
    \ automated browser testing. It support for several browsers, as well as HtmlUnit,\
    \ which is a way to do headless testing—browser testing without actually a browser.\
    \ FluentSelenium is a test framework that allows you to write tests much like\
    \ you would a unit test, rather than recording and playing back browser interaction,\
    \ which is the \"regular\" way to create Selenium tests.\n\nPlay makes easy to\
    \ run Selenium/FluentSelenium tests. The basic approach is the same as what we've\
    \ seen with integration tests: use the running() method, and pass it testServer\
    \ and an object that holds your actual test code. The difference is that we must\
    \ also pass it in a browser configuration, and that our test is contained in a\
    \ Callback rather than a Runnable.⁴\n\nExplaining all of Selenium and FluentSelenium\
    \ would require a whole book, so we won't attempt to do that, but we'll show you\
    \ a basic test to illustrate how you can use these tools with Play. If you'd like\
    \ to know more, both Selenium and FluentSelenium have excellent documentation.\n\
    \nFor our test, let's see if the product list looks like we expect. We're going\
    \ to test that the page actually contains the product list, and that clicking\
    \ on a product takes up to the product detail view. First, let's set up the basic\
    \ test structure. Listing 12.10 shows how.\n\n+   ² http://seleniumhumq.org\n\n\
    +   ³ https://github.com/FluentSelenium/FluentSelenium\n\n+   ⁴ We use a Callback\
    \ because it can take a parameter, and a Runnable can't."
  merge: -1
  pgno: 305
