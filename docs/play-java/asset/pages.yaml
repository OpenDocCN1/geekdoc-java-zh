  md: "# Validation\n\napplies. We can do that with the help of the groups attribute\
    \ from our annotations. Let's change our Product model class to that:\n\n```\n\
    public Product extends Model {\n    public interface Step1()\n    public interface\
    \ Step2()\n    @Required(groups = Step1.class)\n    public String name;\n    @Required(groups\
    \ = Step2.class)\n    public String ean\n}\n```\n\nDefine first step\n\nDefine\
    \ second step\n\nThis constraint only applies to first step\n\nThis constraint\
    \ only applies to second step\n\nWe now need to indicate which step we're at.\
    \ Request Step1:\n\n```\n// we restrict the validation to the Step1 \"group\"\n\
    Form<Product> productForm =\nform(Product.class, Product.Step1.class).bindFromRequest();\n\
