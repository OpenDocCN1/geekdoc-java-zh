  md: "# Validation\n\n# 127\n\nIf a validation occurred\n\n```\nif (productForm.hasErrors())\
    \ {\n    return ok(edit.render(productForm));\n} else {\n    newProduct.saveOrUpdate();\n\
    \    return redirect(routes.Product.all());\n}\n```\n\nRerender our form\n\nSave\
    \ or update our current Product object\n\nRedirect to our \"view all products\"\
    \ page\n\nAs you can see, validating a form is straightforward. Play comes with\
    \ a lot of commonly used validations, and these are detailed in table 6.1.\n\n\
    Table 6.1 Built-in Play validation annotations\n\n| Name | Description |\n| ---\
    \ | --- |\n| @Required | A Play-specific validation indicating the field must\
    \ be non-null, or in the case of Strings and Collections, not null and not empty.\
    \ Works with any object. |\n| @Min | Indicates the minimum number this should\
    \ be; for example, @Min(1). |\n| @Max | Indicates the maximum number this should\
    \ be; for example, @Max(2). |\n| @MinLength | Defines a minimum length for a string\
    \ field. |\n| @MaxLength | Defines a maximum length for a string field. |\n| @Pattern\
    \ | Checks if the annotated string matches the regular expression pattern. |\n\
    | @ValidateWith | Uses a custom validator (see section 6.4.3). |\n| @Email | Checks\
    \ whether the specified string is a valid email address. |\n\nPlay uses an implementation\
    \ of the JSR-303 specification,⁴ better known as Bean Validation, to perform the\
    \ validation. The standard also comes with its own set of validation annotations\
    \ that covers most use cases.\n\nTable 6.2 shows built-in annotations that come\
    \ with Bean Validation. They can be found in the javax.validation package.\n\n\
    Table 6.2 Built-in Hibernate validation annotations\n\n| Name | Description |\n\
    | --- | --- |\n| @Null | Indicates that the field should be null (but it can be\
    \ empty). |\n| @NotNull | Indicates that the field cannot be null. |\n| @NotEmpty\
    \ | Checks if the string is not null or empty. |\n| @AssertTrue | Asserts that\
    \ this field is a Boolean that resolves to true. |\n\n> ⁴ Hibernate Validator,\
    \ to be precise."
