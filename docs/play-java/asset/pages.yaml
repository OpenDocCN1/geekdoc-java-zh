    # 11.2 Splitting your application into multiple sub-applications


    When projects grow, or if the application scope requires a large team, it''s better
    to split your application up into several smaller applications. Having several
    small applications allows you to distribute the work and help to ensure that each
    single application stays simple and manageable. This is where Play sub-applications
    come in handy.


    A sub-application is a Play application within a Play application. It is time
    to give you an overview of how this works and how to construct your project. Let''s
    predict that our application needs to be handled by two teams: Team A will care
    of the product details while Team B will handle the reports. We will need two
    sub-applications inside our application: the report application and the product
    application.


    Application dependencies are declared in the build.scala file of the project.
    A sub-application is also called a sub-project. Our current main application is
    going to be shared by both sub-applications. Both the report and product applications
    depend on some common libraries as well. The common libraries include the model
    classes that are shared between all the sub-applications. The build.scala file
    with the sub-projects and common have extra entries, as shown in the following
    list:


    Listing 11.6 Directory of our application and sub-applications


    ```

    lazy val common = project -> Common libraries such as utils and models packages

    .settings(playJavaSettings: _*)

    lazy val report = project -> Tell the build system it''s a Play application structure

    .settings(playJavaSettings: _*)

    .dependsOn(common)

    lazy val product = project -> Product sub-application depends on common

    .settings(playJavaSettings: _*)

    .dependsOn(common)

    lazy val root = project.in(file(".*"))

    .dependsOn(common)

    ```'
