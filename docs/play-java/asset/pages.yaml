  md: "Bootstrap provides some CSS and image files that make HTML look good and adding\
    \ an HTML class here and there. It's easy to use Bootstrap in your Play applications.\
    \ Here's how.\n\nFirst, download the latest version of Bootstrap from the website\
    \ at http://bootstrap.com. Extract the contents of the zip file to a bootstrap\
    \ directory under your application's public directory. This will make the files\
    \ available from your application.\n\nNext, we will include the Bootstrap CSS\
    \ in our templates. We're going to need it all of our pages, the main template\
    \ is the best place to do that. Open the file /app/views/main.scala.html, and\
    \ add the line below inside the <head> element:\n\n```\n<link href=\"@Routes.Assets.get('bootstrap/bootstrap.min.css\"\
    ) rel=\"stylesheet\" media=\"screen\">\n```\n\nThis will allow your pages to be\
    \ styled by Bootstrap, and now on, we'll use Bootstrap to make all of our examples\
    \ look nicer. If you want to learn more about Bootstrap, check out the website\
    \ at http://bootstrap.com.\n\n# RENDERING THE TEMPLATE\n\nNow that we have a template,\
    \ all that is left for us is to gather a list of products and render the template\
    \ in our list action method. The following list shows how:\n\n# 3.8 Rendering\
    \ the list template\n\n```\n...\nimport views.html.products.list;\n\npublic class\
    \ Products extends Controller {\n\n    public static Result list() {\n       \
    \ List<Product> products = Product.findAll();\n        return ok(list.render(products));\n\
    \    }\n}\n\n```\n\nAs you can tell from the import in this example, the template\
    \ /views/products/list.scala results in a class called views.html.products.list.\
    \ This class has a static method render, which as your IDE can tell you, takes\
    \ one parameter of type List<Product> and returns an object of type Html. The\
    \ parameter is the one defined at the top of our template, whereas the return\
    \ type is determined by the .html extension of the template filename.\n\nThe render\
    \ method on the template results in an HTML page, which we want to return to the\
    \ client in the body HTTP response. To do this, we wrap it in a Result object\
    \ by passing it to the ok method."
  merge: -1
