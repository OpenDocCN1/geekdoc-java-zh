  md: "# CHAPTER 7 Models and persistence\n\ngives the person name we want to know\
    \ a lot more control than the latter, and the latter is also possibly exposing\
    \ a lot more information than that person might choose to give, we may destroy\
    \ the birth certificate. It doesn't matter whether we it unintentionally or on\
    \ purpose.\n\nNow consider a person wearing a tag: the name is there, clearly\
    \ visible to everyone, not giving any more information than that, and it is not\
    \ modifiable. The fact that the person has a name is not exposing anything about\
    \ the person we don't already know; a person always has a name, you could say\
    \ it's part of their public interface. In this case, asking the person for their\
    \ name seems silly. This situation is similar to having a Person class with a\
    \ name that is marked both final and public.\n\nLet's see what all this looks\
    \ like in code. The following listing shows the situation when using a getter.\n\
    \n# Listing 7.1 Person with getName()\n\n```\npublic class Person {\n    private\
    \ final String name;\n\n    public Person(String name) {\n        this.name =\
    \ name;\n    }\n\n    public String getName() {\n        return name;\n    }\n\
    ```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_162_0.png)\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_162_1.png)\n\
    \n![](img/1f90c92b70e5931c18b6f9f04c8da72e_162_2.png)\n\nString name = new Person(\"\
    John Doe\").getName();\nIn this example, we define a field, but access to it is\
    \ delegated through the getName() method. we “ask” the Person for its name, using\
    \ the getter method.\n\nThe following listing shows the same class, implemented\
    \ using a public field.\n\n# Listing 7.2 Person with a public name property\n\n\
    ```\npublic class Person {\n    public final String name;\n\n    public Person(String\
    \ name) {\n        this.name = name;\n    }\n\nString name = new Person(\"John\
    \ Doe\").name;\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_162_3.png)\n\n\
    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_162_4.png)\n\nIn this example, we expose\
    \ the field, and now the client reads the name field directly. We've achieved\
    \ the same result as in the previous example, but with less code.\n\nThe problem\
    \ with public field access to object properties is that we don't get to change\
    \ our minds. If we expose a field, it's part of object's API, and we should support\
    \ it forever, or risk breaking client that depends on it. For example, if we introduce\
    \ a public name field, and later decide we want to “lie”"
