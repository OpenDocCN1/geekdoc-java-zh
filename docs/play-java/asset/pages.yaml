  md: 'push data from clients to the server; it’s a one-way, communication. You can
    read more on this subject in the excellent Manning book Single Page Web Applications
    by Michael S. Mikowski and Josh C. Powell (www.manning.com/mikowski/). This brings
    us to the next section, about WebSocket: a protocol that makes bidirectional communication
    possible.


    # Bidirectional communication with WebSockets


    Until now, we''ve only seen that the web supports one-way communication: the web
    client issues requests to the server, and the server sends a response. We''ve
    also seen how to stream data from server to web client, effectively making a permanent
    connection between web clients and the server and allowing us to push data to
    web clients. We could stop right here, it’s a long chapter ahead, but we think
    it might be worth to know about the use cases for when you really need to have
    a bidirectional means of communication—such as whenever you need real-time interactions
    with your users.


    Let’s try to extend our previous example. We’re now able to display an order’s
    list in real time. Each order needs to be processed by the warehouse operators.
    In warehouse, different people will prepare different orders. If we don’t allow
    operators to notify others that they’re working on a particular order, chances
    the same order will be prepared twice. What we want is to allow people to click
    on an order and notify all other operators that the order is being processed.

    9.8 shows the resulting application.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_245_0.png)'
  merge: -1
  pgno: 245
- img_proc: true
  md: "We want to receive data, but we also want to send back data over the same connection.\
    \ Happily, modern web browsers natively support such two-way communication via\
    \ WebSockets. WebSocket is a web technology providing bidirectional, full-duplex\
    \ communication over a single TCP connection.\n\n# 9.6.1 WebSockets explained\n\
    \nThe WebSocket API is standardized by the W3C, and the WebSocket protocol is\
    \ standardized by the IETF by RFC 6455 (http://tools.ietf.org/html/rfc6455). WebSocket\
    \ can be used by any client or server application, even if the primary focus is\
    \ web clients and web servers. The protocol defines a standard way to enable bidirectional\
    \ communication between servers and clients. It also defines a JavaScript API\
    \ to be used within web browsers. Figure 9.9 shows the bidirectional nature of\
    \ the protocol.\n\n| | Time |\n|---|---|\n| | Open connection |\n| Send data |\
    \ Push data |\n| | Push data |\n| Send data | Push data |\n| Client's action |\
    \ Server's action |\n\n> Figure 9.9 Bidirectional communication with WebSocket\n\
    \nIn addition, the communication happens over the regular TCP port number 80,\
    \ which is of benefit for those environments which block nonstandard internet\
    \ connections using a firewall. The WebSocket protocol is currently supported\
    \ in several browsers, including Safari, Firefox, and Google Chrome. WebSocket\
    \ also requires server-side support from the web applications in order to work.\n\
    \nUntil now we've been using a simple action method to handle requests and send\
    \ back HTTP results. WebSockets are a totally beast and can't be handled by standard\
    \ actions. To handle a WebSocket, your method must return a WebSocket instead\
    \ of a Result. Your server-side WebSocket support defines how to interact with\
    \ clients:\n\n```\n/**\n * Called when the WebSocket is ready\n *\n * @param in\
    \ The Socket in.\n * @param out The Socket out.\n */\npublic abstract void onReady(In<A>\
    \ in, Out<A> out);\n```\n\nThis method is the entry point for our code. Our action\
    \ method must return a WebSocket result that must implement this method. How exactly\
    \ do we interact with the clients, then? The answer is: we interact through the\
    \ In and Out objects."
  merge: -1
  pgno: 246
- img_proc: true
  md: "# Bidirectional communication with WebSockets\n\nThe In object allows you to\
    \ add handlers to incoming events. To handle client messages, you can use the\
    \ following two methods by providing a callback handler:\n\n+   * onMessage()—This\
    \ method calls the provided handler when a client sends a message.\n* onClose()—This\
    \ method calls the provided handler when a client closes its connection with the\
    \ server.\n\nTo send messages to clients, methods need to be implemented:\n\n\
    +   * write—Send a message to clients.\n* close—Close the connection with clients.\n\
