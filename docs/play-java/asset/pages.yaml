- img_proc: true
  md: 'as across requests, which is something Play has no use for, due to its stateless
    nature. Instead Play comes with a different ORM framework: Ebean. Ebean is the
    default persistence solution for Play 2.0 and 2.1.


    # 7.2.3 Introducing Ebean


    Ebean is an ORM framework that takes a different approach to managing entities
    than most other ORM tools, such as JPA. The main difference—and this is what makes
    it a good match for Play—is it has a seamless API. Don''t worry too much about
    what that means, but if you''ve used JPA before, you''ll notice that you''ll spend
    less time on managing entity state. If you haven''t used JPA before—congratulations,
    you won''t ever have to worry about what it means to “refresh an entity,” or what
    the difference is between “attached” entities and “detached” entities.


    There''s one aspect of JPA that Ebean borrows: the annotations for mapping entities.
    When using Ebean, you map entities exactly the same as with JPA. Let''s see how
    this works.


    REUSING YOUR JPA ENTITY CLASSES Because Ebean uses regular JPA annotations, you
    can easily reuse existing model classes. This can be extremely useful when you''re
    writing a Play version of an existing JEE application.


    # 7.3 Mapping basic entities


    SKIP AHEAD IF... If you already know how to map entities using JPA, you could
    skip ahead to the next section. Take a look at the code samples to get up speed
    with the data model.


    When mapping classes to the database, you will have to instruct the ORM tool,
    Ebean in this case, what data in the object model goes where in the database.
    You do this by mapping classes to tables and fields to columns. You also need
    to flag a class as an entity, telling the tool that this is a class you want to
    use as part of the data model you''re mapping. We''ll do all this using annotations
    from JPA (found in the javax.persistence package).


    In mapping a class, it''s a good idea to leave your entity class Play''s Model
    class. The Model class will take some of the work you hand off, adding some convenience
    to the entity, which we''ll discuss later in this chapter.


    Anything stored in a database needs some way to identify it. This is called its
    primary key. Although we could use a field on the entity that''s guaranteed to
    be unique (this is called a natural key), like the EAN field on the Product class,
    it''s often considered good practice to have a field specifically for this purpose
    (called a synthetic key). Therefore, we''ll introduce a Long field called id to
    our entities, and annotate it with @Id to indicate that we use it as the identifier
    for the class.


    Let''s start with the simplest case, one without relationships: the Product class.
    As you can see in figure 7.3, the class itself owns no relationships.'
