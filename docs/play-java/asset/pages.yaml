  md: "# CHAPTER 6 Handling user input\n\nLet's define our formatter. We have to indicate\
    \ that we want an annotation formatter. This is done by extending Formatters.AnnotationFormatter.\n\
    \n# Listing 6.16 The AnnotationDateFormatter class\n\n```\nExtends Formatters.AnnotationFormatter\
    \ so we're\nannotation aware--the Formatter applies to\nDateFormat annotation\
    \ and to Date object\npublic static class AnnotationDateFormatter\n    extends\
    \ Formatters.AnnotationFormatter<DateFormat, Date> {\n        public Date parse(DateFormat\
    \ annotation, String text,\n            Locale locale)\n            throws java.text.ParseException\
    \ {\n            if(text == null || text.trim().isEmpty()) {\n               \
    \ return null;\n            }\n            SimpleDateFormat sdf = new\n      \
    \          SimpleDateFormat(annotation.value(), locale);\n            sdf.setLenient(false);\n\
    \            return sdf.parse(text);\n        }\n        public String print(DateFormat\
    \ annotation, Date value,\n            Locale locale) {\n            if(value\
    \ == null) {\n                return \"\";\n            }\n            return\
    \ new SimpleDateFormat(annotation.value(), locale)\n                .format(value);\n\
    \        }\n}\n```\n\nBecause we're extending the Formatters.AnnotationFormatter\
    \ abstract class, as before with the SimpleDateFormat class, we have to implement\
    \ two methods: the parse() method and the print() method. And as before, the parse()\
    \ method does the string representation to a create Date object, whereas the print()\
    \ method does the exact opposite. But this time, the Formatters.AnnotationFormatter\
    \ is annotation aware, and our print() and parse() methods take an extra parameter:\
    \ our dateFormat annotation. We use it to access the configured pattern.\n\nAs\
    \ we've seen in the previous section, we need to register our AnnotationDate-Formatter\
    \ in our Global.java class. Listing 6.17 shows how to do that."
