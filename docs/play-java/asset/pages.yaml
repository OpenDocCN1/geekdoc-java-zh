- img_proc: true
  md: '# x PREFACE


    Soon after Nicolas introduced Play at Lumatech, it became clear that this was
    going to

    be the framework we''d using for all new projects. Play "gets it." For "it," in
    this case,

    lot of things can be substituted. Play "gets" HTTP and the web in general, how

    was clear from the early Play 1 Beta versions, and that''s why we''ve used it
    on many

    projects since 1.0 out. It didn''t disappoint.


    Now, with Play 2, Play continues to improve web development for the Java platform.


    It''s interesting that we have to say "Java platform," rather than just Java.
    The Java

    platform is no longer synonymous with the Java language—there are a lot of different

    languages targeting the JVM, all trying to improve the developer experience in
    their

    way. Play 2 embraces Scala, type-safe for its benefits as a reactive^1 language,
    but also

    for all the benefits of type-safe language provides. By supplying a first-class

    Java API to the framework, Play 2 provides the best of all worlds.


    We wrote this book in the hope that it will help you take advantage of all the
    bene-

    fits that web development using Play offers. But, perhaps importantly, we also

    wanted to teach you all the core concepts behind Play. They''re just "good" principles

    when developing for the web, and Play makes it easy to apply them. We hope we
    suc-

    ceeded in these goals, and that you''ll enjoy this book and developing Play applications.


    SIESTSE DE KAPER


    1 Read the Reactive Manifesto at http://www.reactivemanifesto.org/ if you want
    to know what that means,

    exactly.'
