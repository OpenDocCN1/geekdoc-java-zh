    This will start your application, and it will listen on port 9000 for HTTP traffic,
    as on port 9001 for HTTPS traffic. If you point your browser to https://localhost:9001/,
    you should get a warning that the certificate is not trusted. This is expected
    because you don''t have a certificate signed by a trusted certificate authority.
    During development it is safe to ignore this, and allow this certificate in your
    browser.


    The generated key is saved in conf/generated.keystore, and Play will reuse it
    if you restart your application so you don''t get the certificate warning again
    and again.


    If you want to use SSL in production, you need to get a certificate that''s either
    trusted by your organization or signed by an authority that''s trusted by major
    browser vendors if it is to be used for a public application. These certificates
    can be bought from commercial vendors.


    The process involves generating a private key, creating a certificate signing
    request (CSR), and sending the CSR to the certificate vendor. They will create
    a certificate and send it back to you, with root and intermediate certificates.
    Finally, you need to create a Java store containing your private key, your certificate,
    and the root and intermediate certificates. Your certificate vendor should have
    instructions on how to do this.


    Once you have a certificate file with your key and certificates, you need to point
    Play to it. You need to set https.keyStore to point to your key store, and set
    https.keyStorePassword=password


    ```

    play -Dhtps.port=9000 -Dhtps.keyStore=keystore.jks -Dhtps.keyStorePassword=mypassword
    run

    ```


    Even Play supports SSL, the recommended way to use SSL in production is to let
    the front-end—HAProxy or Apache—handle it.


    # Configuration settings versus system properties


    Note that http.port, https.port, https.keyStore, and https.keyStorePassword are
    not configuration settings but Java system properties.


