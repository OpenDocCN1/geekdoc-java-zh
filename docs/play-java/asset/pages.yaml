  md: '# 94 CHAPTER 5 Controllers—handling HTTP requests


    In a traditional Java EE environment, all the storage happens server-side. This
    means that each client has a unique ID, and the server uses that unique ID to
    retrieve the client storage space server-side.


    Though this has the advantage of potentially using less bandwidth, it can be problematic
    when scaling up (adding more servers) since you need to synchronize all the client
    storage space between the different servers. Another disadvantage is that it makes
    the servers compute more operations, while the client stays to be an advantage,
    but nowadays web clients are powerful beasts. An iPhone is more powerful, CPU-wise,
    than any computer older than five years. Moreover, web standards have evolved
    and added a lot of features to web clients, such as local storage and web workers.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_116_0.png)


    # 5.5.2 Storing data with Play


    Of course, as you may have guessed now, Play is a bit different from Java frameworks.
    It is interesting to note that fact web frameworks from other languages, such
    as Django, Ruby on Rails, and Symphony, have been following an approach similar
    to that of Play.


    Play defines four scopes:


    +   * Session scope

    * Flash scope

    * Request scope

    * Response scope


    Before we start explaining those, there is a fundamental difference between Play
    and the more traditional Java EE frameworks (read: servlet-frameworks). Play doesn''t
    hold any data serverside. Data is either in the client or in the database. Because
    of that, scaling up is easy with Play. Just add a new server and a load balancer,
    and you''re done. No server-side session replication is needed, so there''s no
    risk of losing data on the server since there is no data to lose. But how does
    that work? What''s Play''s secret?


    # What is a cookie?


    A cookie, also known as an HTTP cookie, web cookie, browser cookie is used by
    a web server to store data in the client''s browser. The server sends information
    on every request. That information can be used, for example, for authentication,
    identification of a user session, user preferences, shopping carts, or anything
    else that can be accomplished through storing text on the user''s computer. A
    cookie can only be used to store text.'
