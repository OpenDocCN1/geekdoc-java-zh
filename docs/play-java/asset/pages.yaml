  md: '# Controllers and action methods


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_95_0.png)


    Figure 5.1 Role of the controller


    # 5.1 Controllers and action methods


    Business data is often stored in a relational database. That means that if you
    wanted to add a new product to the catalog, you''d have to write some SQL. But
    that wouldn''t be very practical, would it? This is where web applications come
    to the rescue. Using a web application, the warehouse manager can interact with
    the database stock level. This is an easier and cheaper solution than learning
    SQL or having an on-site SQL expert.


    But there''s a problem: the web browser can''t directly access the data because
    it doesn''t speak SQL. The web browser speaks HTTP. Moreover, the model layer
    is so finely-grained, whereas the user wants to execute a series of actions in
    one example, when you add a product, you want to make the data describes a valid
    product and that the product wasn''t already created.


    This is precisely the role the controller plays. The controller connects HTTP
    requests to the server logic. It acts as glue between domain model objects and
    transport layer elements. A controller exposes some functionality at a client
    address or URI (unique resource identifier). In fact, it exposes the business
    logic at a given address: it''s our web application''s public API. Like the HTTP
    interface, controllers are procedural and request/response oriented.


    Figure 5.1 illustrates the role of the controller in a typical web application.
    A controller is one of the central points in Play, in any MVC framework. It is
    also the application entry point for you as a developer. So as a client (for example,
    a web browser) issues a request, Play will accept this request and delegate the
    processing of it to a controller. This is usually where your code comes into play.
    Figure 5.2 illustrates this lifecycle.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_95_1.png)


    Figure 5.2 Controller lifecycle'
