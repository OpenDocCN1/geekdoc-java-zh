  md: '# 86

    CHAPTER 5 Controllers—handling HTTP requests


    ```

    GET /product/$ean{0-9}(13)

    controllers.Products.details(ean: Long)

    ```


    This route will only apply if the EAN consists of 13 digits, which is handy in
    our case, we know that our EAN code consists of 13 digits. Play will return a
    not found error code if the EAN contains alphanumeric characters as IDs.


    As you know, you can also pass parameters with your URL. For example, http://google.com/query=playframework
    contains a parameter query, with the value "playframework". How do you specify
    a parameter in your routes file so that you can access it from your action methods?
    Actually, you don''t even have to declare it in your routes file you can just
    use a parameter of the same name in your action method signature:


    ```

    public static Result results(String filter) {

    ...

    ```


    If the action method defines some parameters, all of these parameter values will
    be searched for in the request path. They will be extracted from the request path
    as we saw before, or they will be extracted from the query string.


    Let''s see a more detailed example. Let''s say we want to display a list of products.
    But potentially a very large list, we want to paginate. To access the first 10
    items, we will receive the first page; for the next 20, we will receive the second
    page, and so on. The following route definitions can be seen as equivalent, functionally:


    ```

    GET /products/:page controllers.Products.list(page: Int)

    GET /products/ controllers.Products.list(page: Int)

    ```


    What is the difference between the two route definitions? The first route definition
    has the page parameter as part of the actual request path. The client requests
    the following second product list: http://localhost/products/2. The second route
    definition doesn''t require the page parameter to be part of the request URL.
    Instead, it''s a parameter that the user needs to use. This is by requesting the
    following URL: http://localhost/products/page=2.


    It''s interesting to note that http://localhost/products/2 (where "2" is the page
    number) isn''t a good identifier for a resource. The product list for the second
    page is likely to change over time. Therefore the second definition is to be preferred.
    For more information about RESTful concepts like this, please refer to chapter
    4.


    Also notice that Play complains if we don''t specify the page parameter in the
    request URL, as shown in figure 5.12. The error is thrown because Play has no
    way to tell what the default value for the parameter is. There''s a way to find
    out, though: default values in the routes file.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_108_0.png)


    Figure 5.12 Bad error screen for missing parameter'
