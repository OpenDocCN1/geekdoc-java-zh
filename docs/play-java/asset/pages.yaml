  md: "This isn't going to work in our case because we can only use the render() method\
    \ for simple cases, but it's important to understand what's going on. In this\
    \ test, we first need to retrieve a list of test products that we'll pass to the\
    \ template ①, and we call the render method on our template's class (views.html.catalog)\
    \ ②. That method returns an object of type Content, on which we can run assertions.\n\
    \nNow we assert the Content returned is of the expected type: text/html ③. Then\
    \ we check the rendered HTML for the names of our test products\n\nWe can only\
    \ use the render() method for simple cases, when we're not making use of the Play\
    \ scopes. As we stated earlier, the fakeApplication() doesn't provide a session\
    \ or a request. This means that without the flash scope, the session scope, and\
    \ the request scope can't be used. Actually, if they're used by your template,\
    \ Play will give you an error stating that there is no HTTP content available.\
    \ This is useful for testing independent HTML components we defined in section\
    \ 8.4.1, and this is why we present this test. But this is the case for the product\
    \ listing page, because we're using the flash scope in our main: scala.template.\n\
    \nLet's now how to correctly implement our test for the product listing page.\
    \ We edit our FunctionalTest.java file and add the test to the following listing:\n\
