  md: "# Streaming HTTP responses\n\nThe class ExpeditedOrders might look cryptic,\
    \ but with a bit of explanation it quite straightforward. As seen in 9.3, the\
    \ Akka.system.scheduler allows us to schedule a background job; the job starts\
    \ four seconds after initialization and occurs every five seconds. The container\
    \ for this job is the ExpeditedOrder object, and we send to the container a new\
    \ Order.\n\nEvery five seconds, a new order is created and sent to the ExpeditedOrder\
    \ object. Upon receipt, the ExpeditedOrders onchange method writes to all the\
    \ channels (the Chunks.outs list object) and sends a chunk to every connected\
    \ web client, streaming the orders. Once the data is received, the client executes\
    \ the script element and adds the order to the current page.\n\nWe now need to\
    \ create our Order model class. The following listing shows the Order class.\n\
    \n# Listing 9.7 The Order model class\n\n```\npublic class Order {\n    public\
    \ Order() {}\n    public String toString() {\n        return \"Order \" + nextId()\
    \ + \" date \" + new Date();\n    }\n    private static String nextId() {\n  \
    \      Random random = new Random();\n        return new BigInteger(30, random).toString(9);\n\
    \    }\n}\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_241_0.png)\n\nTo see\
    \ the orders streamed, we need to edit the index.scala.html view with the following:\n\
    \n```\n@(message: String) {\n    @main(\"live streaming\") {\n        <iframe\
    \ style=\"width:100%;height:100%\" src=\"/routes.Application.liveUpdate()\"></iframe>\n\
    \    }\n}\n```\n\nWe need to update our routes file with the following:\n\n```\n\
    GET /live controllers.Application.index()\nGET /live-update controllers.Application.liveUpdate()\n\
    ```\n\nIf you point your browser to http://localhost:9000/live you should now\
    \ see live orders appearing on screen.\n\nAs you see, streaming data is straightforward\
    \ with a bit of explanation. But it doesn't do much by itself. Let's go a step\
    \ further and see how we can use the chunks mechanism from our views."
