  md: "# Structuring pages with template composition\n\nNow that we know how to create\
    \ a template, let's find out how we can reuse template code, to keep us from repeating\
    \ ourselves.\n\n# 8.4 Structuring pages with template composition\n\nJust like\
    \ your regular code, your pages are compositions of smaller pieces that are in\
    \ often composed of even smaller pieces. Many of these pieces are reusable on\
    \ other pages; some are used on all of your pages, whereas some are specific to\
    \ a particular page. There is nothing special about these pieces; they're templates\
    \ by themselves. In this section we will show you how to construct pages using\
    \ reusable templates.\n\n# 8.4.1 Includes\n\nWe've only shown snippets of HTML\
    \ and never a full page. Let's start to expand our proof-of-concept application\
    \ from the previous chapters into a proper application. We'll start by creating\
    \ a proper HTML document for the catalog page that lists the products we have\
    \ in our catalog, as in figure 8.5.\n\nThe code for the list action in the Products\
    \ controller remains the same as in our previous chapters, except that it uses\
    \ a different template:\n\n```\npublic Static Result list(Integer page) {\n  \
    \  Page<Product> products = Product.find(page);\n    return ok(views.html.catalog.render(products));\n\
    }\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_209_0.png)\n\nFigure 8.5 The\
    \ catalog page"
