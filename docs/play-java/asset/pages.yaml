  md: '# ABOUT THIS BOOK


    SIETSE DE Kaper started his career as a software developer at Lunate Research
    in 2007. He has worked on several commercial web applications using various frameworks—mostly
    Java, but also PHP. Ruby, and Scala. Sieste started developing applications with
    the Play framework version 1.0 came out in October 2009. After using Play on projects,
    he now considers it the most effective framework in the Java ecosystem.


    # About the cover illustration


    The figure on the cover of Play for Java is captioned "Farmer from Dobrota, Monte-negro."
    The illustration is taken from the reproduction, published in 2006, of a nineteenth-century
    collection of costumes and ethnographic descriptions Dalmatia by Professor Francesco
    Carrara (1812–1854), an archaeologist and historian, and the first director of
    the Museum of Antiquity in Split, Croatia. The illustrations were obtained from
    a helpful librarian in the Ethnographic Museum (formerly the Museum of Antiquity),
    situated in the Roman core of the medieval center of Split: the ruins of Emperor
    Diocletian''s retirement palace around AD 304. The book includes colored illustrations
    of figures from different regions of Dalmatia, accompanied by descriptions of
    the costumes and of everyday life.


    Dobrota is a small town on the Adriatic coast, officially a part of the municipality
    of Kotor, an ancient Mediterranean port on Kotor Bay, surrounded by fortifications
    built Today it is increasingly a tourist destination, due to the dramatic limestone
    cliffs and beautiful coastal vistas. The man on the cover is wearing an embroidered
    vest over black woolen trousers and a wide colorful sash. He is carrying a long
    pipe, a musket, and has pistols inserted in his sash. The rich and colorful embroidery
    on his costume is typical for this region, and marks this as an outfit for special
    occasions and not for working the land.


    Dress codes have changed since the nineteenth century, and the diversity by region,
    so rich at the time, has faded away. It is now hard to tell apart the inhabitants
    of different continents, let alone towns or regions. Perhaps we have traded cultural
    diversity for a more varied personal life—certainly for a more varied and fast-paced
    technological life.


    At a time when it is hard to tell one computer book from another, Manning celebrates
    the inventiveness and initiative of the computer business with books based on
    the rich diversity of regional life of two centuries ago, brought back to life
    by illustrations from collections such as this.'
  merge: -1
