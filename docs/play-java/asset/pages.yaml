    # 11.3 Deploying to production


    Finally you''re done. Your Play application is done, it''s great, and it''ll rule
    the world. When you realize you''re not done yet. Your application still needs
    to be deployed to production. There are many ways to deploy your application standalone
    on your own server, or maybe on the infrastructure of a cloud provider. If you''re
    in an enterprise Java environment, changes are that you want or need to deploy
    on an application server.


    In this section we''ll go through the various options and help you decide which
    way is best for you.'
