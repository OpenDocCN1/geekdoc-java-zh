  md: '# Play is not Java EE


    Before Play, Java web frameworks were based on the Java Servlet API, the part
    of the Java Enterprise Edition (Java EE) stack that provides the HTTP interface.
    Java EE and its architectural patterns seemed like a good idea, and brought some
    needed enterprise software development. But this turned out to be a bad idea,
    because structure came at the cost of additional complexity and low developer
    satisfaction. Play is different, for several reasons, which we will detail later
    in this chapter. The biggest difference between Java EE and Play is Play focuses
    on providing simplicity to developers so they can focus on their business problems
    and not on the framework itself. In contrast, Java EE used to be quite complex.


    Play''s design and evolution focused on the Java platform, which also seemed like
    a good idea to developers who were consolidating various kinds of software development.
    From a Java perspective, the web is the only external system. The Servlet API,
    for example, is an abstraction layer over the web''s architecture that provides
    a more Java-like API. Unfortunately, this turned out to be a bad idea as well,
    because the web is more important than Java. When a web framework starts an fight
    with the web, the framework loses. What we need is a web framework whose architecture
    embraces the web''s, and whose API embraces HTTP.


    # High-productivity web development


    Web frameworks for developers are different. They embrace HTTP and provide APIs
    that use HTTP''s features instead of trying to hide HTTP, in the same way that
    developers build expertise in the standard web technologies—HTTP, HTML, CSS, and
    JavaScript—instead avoiding them.


    # Working with HTTP


    Working with HTTP means letting the application developer make the web application
    aware of the HTTP methods, such as GET, POST, PUT, and DELETE, instead of using
    an RPC-style layer on top of HTTP requests in order to let the application whether
    you want to create, update, or delete data. It also means that application URLs
    are part of the application''s public interface and should be up to the application
    developer to design instead of fixed by the framework.


    This approach is for developers who do not work with the architecture of the World
    Wide Web instead against it, but who may have read it. 1


    In the past, none of these web frameworks were written in Java, because the Java
    platform''s web technologies failed to emphasize simplicity, productivity, and
    usability. This is the world that started with Perl (not Lisp as some might assume),
    was largely taken over by PHP, and in more recent years has seen the rise of Ruby
    on Rails.'
