  md: '# foreword


    Before Struts existed I wrote an entire Java web application inside a single Servlet
    method because that is basically how I''d done things in Perl. Back then java
    web apps were simple and the tools were immature. As the web evolved, dozens of
    Java web frameworks emerged which were all built on the same Servlet foundation.
    Being over 15 years old, the Servlet foundation is showing its age. The traditional
    Java frameworks haven''t kept up with the modern needs for higher developer productivity
    and emerging web techniques like RESTful JSON services, WebSockets, asset compilers,
    and reactive architectures.


    Play Framework was created to revolutionize Java web application development.
    Play is built for modern web needs and puts developer productivity at the core
    of the framework. I love that with Play I hit Refresh in my browser and instantly
    see my changes, whether they''re Java, JavaScript or CSS. There is no container
    to redeploy or restart. If there are compile errors I see them in a helpful way
    in my browser. Things like testing, persistence libraries, JSON support, and other
    commonly needed pieces come out-of-the-box with Play. By being RESTful by default,
    supporting push channels, and utilizing non-blocking connections, Play provides
    a solid foundation for scalable reactive applications.


    When I made the transition from Perl to object-oriented Java apps, I needed some
    help to get over the hurdles of figuring out ways to do. Luckily books like Thinking
    in Java (Bruce Eckel) and Java Servlet Programming (Jason Hunter) helped me move
    into a new way of thinking which allowed me to quickly and easily make the transition
    to something new and better. I have no doubt that the book you''re reading now
    will do the same for you. Nicolas and Sieste have been using Play'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'from its early days. They''re experts who haven''t just played with the framework,
    they''ve built numerous production applications using Play. They''ve experienced
    the challenge of adopting something new and know the pains you can avoid.


    Web programming has changed dramatically since the early Servlet days. Play has
    revolutionized the development experience for building modern Java web applications.
    This book will help you quickly make the transition to more productive ways to
    build modern web apps. I''m confident that down the road you will look back on
    this book like I look back on Eckel''s and Hunter''s books. I just wish this book
    had existed when I learned Play.


    JAMES WARD


    PRODUCT OWNER OF PLAY FRAMEWORK AT TYPESAFE

    @_JAMESWARD | WWW.JAMESWARD.COM'
  merge: -1
