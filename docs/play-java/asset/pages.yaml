    \ deb packages designed specifically for recent versions of Ubuntu.\n\n# 11.3.4\
    \ Setting up a front-end proxy\n\nGenerally, web applications are run on port\
    \ 80. This is a privileged port on Unix machines, which means programs running\
    \ under a regular user account can't bind to such port. This explains why Play\
    \ doesn't use port 80 as the default port number, but something else.\n\nOf course,\
    \ you can tweak the permissions so it's possible to run your Play application\
    \ on port 80, and let it serve web traffic directly. But the common way to let\
    \ your application be available on port 80 is to set up a front-end proxy, like\
    \ HAProxy, nginx, or Apache. This proxy will bind to port 80 and redirect all\
    \ traffic intended for your Play application, which listens to an unprivileged\
    \ proxy.\n\nThe use of a proxy isn't limited to limiting the application available\
    \ on a specific port. It can also provide load balancing between multiple instances\
    \ of your application. You can, for example, run two instances of your application\
    \ and let the front end proxy divide traffic between the two instances. This means\
    \ you're not bound to a single machine; you can utilize multiple machines for\
    \ your application.\n\nIt also gives you the ability to upgrade without downtime.\
    \ If you have a front-end proxy do load balancing between two application instances,\
    \ you can take one instance down, upgrade it, and bring it back up, all without\
    \ downtime. When the upgraded instance is up, you can do the same to the other\
    \ one. When done, you've upgraded your application with powerful zero downtime\
    \ for your clients.\n\nHAProxy is a powerful and reliable proxy that has a plethora\
    \ of advanced options, but is still easy to get started with.\n\nSuppose we want\
    \ to set up HAProxy to listen on port 80 and redirect traffic to two instances\
    \ of our Play application. We'll also use WebSockets in this application (these\
    \ are explained in chapter 9), so we must make sure that these connections are\
    \ properly proxied well.\n\nThis is accomplished with a configuration file as\
    \ shown in the following listing:\n\nListing 11.8 HAProxy configuration\n\n```\n\
    global\n  daemon\n  maxconn 256\n\ndefaults\n  mode http\n  timeout connect 5s\n\
    \  timeout client 50s\n```"
