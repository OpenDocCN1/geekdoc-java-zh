  md: "Again, Play will set the appropriate Content-Length HTTP header. It can do\
    \ because it can tell how big the file is before it starts sending out the response.\
    \ Additionally, this helper will determine the Content-Type header from the filename\
    \ and set the Content-Disposition header to specify how the web browser should\
    \ handle this response. Once the response is consumed, the connection is again\
    \ closed.\n\nLike the previous approach, this approach only works because the\
    \ size of the response is known beforehand. We're no closer to sending content\
    \ that is computed on the fly, without knowing how big the content will be.\n\n\
    We just saw how to stream large files to our web clients with a fixed-size response.\
    \ Let's see how we can stream serialized data back to our clients.\n\n# 9.4.3\
    \ Chunked responses\n\nOur application example needs to stream expedited orders.\
    \ There is no predefined content length; it could really be an infinite number:\
    \ For this kind of response we use chunked transfer encoding, and Play provides\
    \ full support for it.\n\nAs the name says, chunked transfer encoding sends the\
    \ response in multiple chunks. The way this works is that these chunks of data\
    \ are sent out as soon as a reasonable number of bytes becomes available. The\
    \ server first sends the size of the next chunk, and then the chunk itself. This\
    \ is repeated until the response is complete.\n\nThe advantage of this approach\
    \ is that we can serve live data as it becomes available. The drawback is that\
    \ since the web browser doesn't know the content size, it isn't able to display\
    \ a proper download progress bar, which isn't an issue for our expedited orders.\n\
    \nLet's say we have a service that provides our expedited orders from another\
    \ system as soon as they are entered. We can ask Play to stream this content directly\
    \ using a chunked response:\n\n```\npublic static Result index() {\n    InputStream\
    \ is = getExpeditedOrders(); return ok(is);\n}\n```\n\nThis requires us to implement\
    \ the expedited-orders service to return an InputStream. Expedited orders are\
    \ written to the input stream as soon as they are entered.\n\nAnother (simple)\
    \ alternative is to implement your own chunked response builder. The Play Java\
    \ API supports both text and binary chunks (via String and byte[]). Listing 9.5\
    \ shows the liveUpdate() action method of our Applicationjava controller.\n\n\
    > Listing 9.5 Streaming expedited orders: Application controller\n\n```\npublic\
    \ static Result liveUpdate() {\n    // Prepare a chunked text Chunks<String>\n\
    \    chunks = new StringChunks<String>();\n\n    // When the stream is ready\n\
    \    public void onReady(Chunks.Out<String> out) {\n        ExpeditedOrders.registerChunkOut(out);\n\
    }\n```\n\nMethod called when the connection is established with the client"
