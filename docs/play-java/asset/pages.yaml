    **Figure 7.9 The relationship between

    StockItems and Products**


    In our warehouse''s product catalog, we''ll store many different kinds of

    products: red paper clips, blue paper clips, and so on.


    In our physical warehouse, we''ll store batches of those products, which we

    call stock items. For example, suppose the product catalog has an "Box of 1000

    blue paperclips," and we have three palettes of each type, each holding

    500 boxes. One is currently in warehouse A, and the other two are in warehouse

    . We have three stock items in total.


    Each individual stock item will represent the stock of exactly one product from
    the

    product catalog. This means the stock items have a "many-to-one" relation to their

    product. The opposite is also true; each product is potentially referenced by
    many

    stock items, so the product has a "one-to-many" relationship to the stock items.

    concept is illustrated in figure 7.9.


    In a relational database, a one-to-many relationship is usually modeled as a column

    on the "many" side (in this case, the stock item) pointing to the ID of a record
    on the

    "one" side (such as the product). Whenever a stock item is retrieved from the
    data-

    base, that ID can be used to retrieve the correct row from the product table,
    if needed.\ ID used to point to the primary key of any other table is called a
    foreign key. This is

    illustrated in figure 7.10.


