    # 10.2 Adding basic authentication with filters


    In this section we''re going to discuss filters, an advanced Play 2 feature. In
    the next section, we''ll see how to use more out-of-the-box Play authentication
    features, but it''s important to understand the more advanced features as well.
    It''s time to secure our warehouse application and only let selected users access
    it. For this, we''re going to implement basic authentication. Basic authentication
    is simple and supported by all browsers. When the server asks the user to authenticate
    it can send a request for authentication. This request should be sent using the
    HTTP 401 Unauthorized response code containing a WWW-Authenticate header. The
    WWW-Authenticate header for basic authentication (most often) is constructed as
    follows:


    ```

    WWW-Authenticate: Basic realm="warehouse app"

    ```


    On the client side, when the user agent wants to send the authentication credentials,
    it may use the Authorization header. The Authorization header is constructed as
    follows: Username and password are combined into a string: username:password.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'The resulting string literal then encoded using Base64. The authorization method
    and a space are then placed before the encoded string (for example, "Basic").
    So if the user agent uses Nicolas as username and secret then the header is formatted
    as follows:


    ```

    Authorization: bmljb2xhczzpZNyVXZQ==

    ```


    10.3 summarizes the basic authentication protocol, we need to check every incoming
    request for the Authorization header to see if the client is authorized. If there''s
    a value for the Authorization header we need to decode it and check the username
    and password. We do that for every action method we implement, but this isn''t
    handy, as we really want the authentication to be applied over the whole application.
    This is where filters come in.


    Filters are essentially pieces of code that are applied to every incoming request
    and/or response. Filters are also reusable project to project. This is actually
    different from implementing custom code in the Global class and overriding the
    Request method (this method is called at the same moment as filters,).


    No authorization header


