  md: '# CHAPTER 4 An enterprise app, Play-style


    entities; is developed in a business organization; and is deployed in a manner
    responsive to business needs.


    In today''s corporate environment, enterprise applications are complex, scalable,
    distributed, component-based, and often mission critical. They are data-centric
    and must meet stringent requirements for security, administration, and maintenance.
    Most of the time, business applications are isolated. One enterprise application
    addresses business requirements for one specific business unit. Because of isolation
    and business constraints, most enterprise applications are unable to talk to each
    other. It''s usual to see multiple business applications performing similar tasks
    because of that.


    Enterprise applications usually live inside the IT department and are usually
    hosted within the organization.


    Current enterprise applications are applications that are created to fulfill a
    business need such as IT management, customer-relationship management, enterprise-resource
    planning, business intelligence, project management, collaboration, human-resource
    management, manufacturing, enterprise-application integration, and so on.


    Figure 4.1 illustrates a typical enterprise application ecosystem.


    As we can see, because an enterprise application is secured and usually satisfies
    one business need, it''s isolated and confined within its business context. It''s
    also not exposed to the outside world, and the information it holds is not accessible
    by other systems. Because of that, often new business applications are built to
    gather


