  md: '# CHAPTER 11 Modules and deployment


    chapter 2, we saw how we could use build.sbt to add a dependency on any library
    to use Java as normally would. But Play provides an additional form of code reuse
    in the form of modules. Currently available modules for Play 2 provide anything
    from alternate template engines to NoSQL-database layers. This section will explain
    how to use a custom module and later, how to build one yourself.


    We''ll show you how to use the SecureSocial module. Another module that is free
    is the Mailer¹ module, which, as you might guess from the name, allows you to
    send email.


    # 11.1 Using modules


    Play modules are, just any other library, a collection of files in a JAR. The
    difference is that there will be Play-specific non classes in that JAR and the
    code depends on Play. This means that you add a module to your project the same
    way you add any other library: you add it to libraryDependencies in build.sbt.


    Let''s say your application''s users to log in, and later, possibly allow them
    to log in with OAuth. If we find a module that we can use, we don''t want to waste
    time writing our own code. You can find a comprehensive list of modules that are
    available in the Play 2 modules directory.


    If we search for "social" on that page, we''ll find a module named SecureSocial
    which fits to the bill.³ Each module''s entry shows a URL and a short description.
    We can now follow the URL to find how to use the module. The entry for SecureSocial
    points to the website.⁴ Once you navigate to the installation instructions, you
    will have to add a dependency and a resolver. A resolver is how we tell SBT to
    look for libraries that can''t be found in the default repositories.


    Let''s get started. Open build.sbt and add the new dependency to library-Dependencies
    and the resolver in the project settings. Your build.sbt should now look like
    the following listing:


    # Listing 11.1 The build properties–build.sbt


    ```

    ame := "warehouse"

    version := "1.0-SNAPSHOT"

    libraryDependencies += Seq(

    javaJdbc,

    javaBean,

    cache,

    "com.google.guava" % "guava" % "14.0",

    filters.)

    ```


    > ¹ https://github.com/typesafehub/play-plugins

    ² http://www.playframework.com/documentation/2.1.1/Modules

    ³ SecureSocial is for authentication (logging in). It works well in combination
    with the Deadbolt 2 module, which does authorization (permission checking).

    ⁴ http://securesocial.ws/'
