  md: "# Fine-grained authentication with action composition 247\n\n```\nreturn redirect(\n\
    routes.Products.index()\n);\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_269_0.png)\n\
    \nThe implementation of the authenticate method is trivial, and the annotations\
    \ in listing 10.8 should be clear enough. The important thing to remember is that\
    \ we'll use the email session attribute later to find the currently logged-in\
    \ user.\n\nNOTE We've used the login validate method as we saw in section 6.4.3,\
    \ but to simplify the explanation we chose not to.\n\nNow that we're all to log\
    \ in, we can start protecting actions with authentication. Play allows us to do\
    \ this using action composition. Action composition is the ability to compose\
    \ multiple actions together in a chain. Each action can do something to the request\
    \ before delegating to the next action, and can modify the result. Action can\
    \ also decide not to pass the request to the next action, and instead generate\
    \ the result itself. We already explained how action composition works in section\
    \ 5.4.3, so in this section, we'll put our knowledge into practice. We're also\
    \ going to show Play 2 provides action composition helpers, making it easier.\n\
    \nIn our case, Play 2 comes with a built-in authenticator, Security.Authenticator,\
    \ which we'll extend to add our logic. We will call this authenticator Secured.\
    \ We will create a Secured class in our app/controllers directory. The following\
    \ shows the Secured class content.\n\n# Listing 10.9 Secured.java\n\n```\npackage\
    \ controllers;\n\nimport play.mvc.Http.Context;\nimport play.mvc.Result;\nimport\
    \ play.mvc.Security;\n\npublic class Secured extends Security.Authenticator {\n\
    \n    @Override\n    public String getUsername(Context ctx) {\n        return\
    \ ctx.session().get(\"email\");\n    }\n\n    @Override\n    public Result onUnauthorized(Context\
    \ ctx) {\n        return redirect(routes.Application.login());\n    }\n}\n\n```\n\
    \nWe need to implement two methods. getUsername is used to get the username of\
    \ the current logged-in user. In case this is the email address that we set in\
    \ the email attribute in the session when the user logged in (the application's\
    \ authenticate method). If this method returns a value, then the authenticator\
    \ considers the user to"
