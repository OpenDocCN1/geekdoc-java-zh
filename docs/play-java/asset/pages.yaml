  md: "# Mapping URLs to action methods using routes\n\nLet's add action methods to\
    \ our controller. For our proof-of-concept application, we'll want to list products\
    \ in our catalog, show details for an individual product, and save new and updated\
    \ products. We'll add actions for these operations later, but for now we'll make\
    \ them return a special type of result: TODO. A TODO result signifies that the\
    \ method is to be implemented. The corresponding actions, as shown in the following\
    \ listing:\n\n# Listing 3.1 Adding action methods\n\n```\npackage controllers;\n\
    import play.mvc.Controller;\nimport play.mvc.Result;\n\npublic class Products\
    \ extends Controller {\n    public static Result list() {\n        return TODO;\n\
    \    }\n\n    public static Result newProduct() {\n        return TODO;\n    }\n\
    \n    public static Result details(String ean) {\n        return TODO;\n    }\n\
    \n    public static Result save() {\n        return TODO;\n    }\n}\n```\n\n>\
    \ List all products\n\n> Show a blank product form\n\n> Show a product edit form\n\
    \n> Save a product\n\nNow that we have action methods, let's give them URLs so\
    \ that we can reach them.\n\n# 3.2 Mapping URLs to action methods using routes\n\
    \nIn order to determine which action method will handle a given HTTP request,\
    \ Play takes the properties of that request, such as its method, URL, and parameters,\
    \ and does a lookup on a set of mappings routes. Like we saw before, in section\
    \ 2.3, routes are configured in the routes file in your application's conf directory.\
    \ Add routes for our new operation, as in the following listing:\n\n# Listing\
    \ 3.2 Adding routes for our product catalog\n\n| GET /products/ | controllers.Products.list()\
    \ |\n| GET /products/new | controllers.Products.newProduct() |\n| GET /products/:ean\
    \ | controllers.Products.details(ean: String) |\n| POST /products/ | controllers.Products.save()\
    \ |\n\nNow that we have some routes, let's try them out. Start your application\
    \ if it's not already running, and point your browser to http://localhost:9000/products/.\
    \ You should see the page shown in figure 3.2."
