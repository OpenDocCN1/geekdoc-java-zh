  md: '# Scala template syntax


    that any all characters that are invalid as HTML text are properly escaped for
    display in an HTML document. If you ever wish to display the raw, unescaped value
    of an expression document, you can use @Html():


    ```

    // boldName = <b>world</b>

    Hello ${boldName}!

    ```


    As stated before, Scala expressions start with the @ character. But when does
    an expression and the rest of the text begin?


    # 8.2.3 Expression scope


    In the case of this for loop, the scope of the Scala expression is clear: the
    expression at the beginning of the line and, if it contains a block, ends at the
    end of the block, designated by the curly brace.


    The situation is less clear with inline expressions, such as a function call to
    routes.product.show() to generate the value for the product link''s href attribute,
    or value references that make up most of the link''s text. In those cases, the
    template engine is smart enough to recognize an expression and outputs the first
    value it finds. As a consequence, this syntax works for simple expressions. Consider
    the text for our product links (described in section 8.3). The breakdown into
    expression and plain text is shown in figure 8.2.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_205_0.png)


    Figure 8.2 Link text, broken down


    Here, the template engine knows where the Scala expression ends, and continues
    to consider the rest of the line as until the next @ character.


    Sometimes a simple expression is not enough; you might want to output some value
    that requires a little modification. In that case, you can still use the @ syntax,
    but you should wrap the expression in braces well, as shown in figure 8.3.


    This style of syntax allows you to write a more complicated expression by being
    explicit about where it ends. Now if you wanted to, you could write a more verbose,
    multistatement expression by using curly braces instead of regular braces, as
    shown in figure 8.4.


    This style of syntax allows you to write more complex expressions if you ever
    need them.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_205_1.png)


    Figure 8.3 A multitoken statement'
