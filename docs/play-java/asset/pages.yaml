  md: "```\n</ul>\n</div>\n<a href=\"@routes.Products.newProduct() class=\"btn\">\n\
    <i class=\"icon-plus\"></i> New product</a>\n```\n\nEverything should be factored\
    \ out of the template for the catalog action. We could use the includes technique,\
    \ but it isn't ideal here because we need to extract some HTML that's above the\
    \ content and some HTML that's below the content. If we use includes, we need\
    \ to extract two new templates. One would contain the HTML before the content,\
    \ and the other one would contain everything after the content. This is not good,\
    \ because HTML belongs together. We want to avoid having an HTML start in one\
    \ template and the corresponding end tag in another. That would break coherence\
    \ in our template.\n\nLuckily, the Scala template engine offers some compositional\
    \ features that allow us to extract all this code into a single, coherent template.\
    \ From the .scala template, we extract all HTML that shouldn't be the responsibility\
    \ of the catalog template, in the following listing:\n\n# Listing page layout\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>paper-clips.example.com</title>\n\
    \  <link href=\"@routes.Assets.at('bootstrap/css/bootstrap.min.css') rel=\"stylesheet\"\
    \ media=\"screen\">\n  <link href=\"@routes.Assets.at('stylesheets/main.css')\
    \ rel=\"stylesheet\" media=\"screen\">\n  <link rel=\"shortcut icon\" type=\"\
    image/png\" href=\"@routes.Assets.at('favicon.png')>\n  <script src=\"@routes.Assets.at('javascripts/jquery-1.9.0.min.js')\
    \ type=\"text/javascript\"></script>\n</head>\n<body>\n  <navigation>\n    <div\
    \ class=\"container\">\n      @if(flash.containsKey('success')) {\n        <div\
