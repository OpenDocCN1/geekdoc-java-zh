  md: '# about this book


    This book will get you started developing web applications with Play 2, using
    the Java programming language. But, perhaps more importantly, it''ll also teach
    you the concepts behind web development frameworks.


    There many Java web frameworks, but most of them have a key flaw: they try to
    hide the web behind an abstraction layer, rather than embracing it. That is the
    most important difference between Play and other Java web frameworks (Servlets,
    we''re looking at!).


    Developing a web application with Play teaches you how to achieve that. If you''re
    a Java EE veteran, we''ll do our best to lessen the culture shock. But if you''re
    new to web development, or web development in general, we''ve got your back. We
    will do our best to explain everything about web development that you need to
    know.


    The only assumption we make is that you have some background in Java programming—you
    should be comfortable reading and writing Java code. We''ve used Java 7 syntax
    throughout this book, since that is the supported version of Java at the time
    of writing.


    You''ve probably already heard that Play 2 is written in Scala. That is absolutely
    true, and we feel that the language and the tools available for the platform are
    an excellent choice to write a web platform. We also feel that there is no reason
    you should have to build a web application in Scala. Java developers agree because
    Play has a first-class Java API, which means you can write a full application
    using Play 2 without writing a single line of Scala.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'In this book, we avoid Scala wherever possible. There is one subject

    where this wasn''t avoidable: view templates in Play 2 are based on the Scala
    language.

    But in the rest of the book we treat it as another template language, showing
    you

    t basic constructs you need to create your templates. We promise you don''t need
    to

    learn Scala to follow along with this book.


    As we write, the current version of Play is 2.2. That means all the code we

    demonstrate assumes Play version of 2.2.x, and we''ve tested every code sample

    under version 2.2.0.


    # Roadmap


    This book is organized in three parts. The first part introduces you to all the
    basic-

    cept of Play. The second part goes deeper into the core elements of a Play applic-

    t, while the third part demonstrates advanced things that you can do in

    Play. Here''s a quick overview of all the chapters.


    Chapter 1 introduces Play, and highlights of its important features. It then

    shows how to install Play and create a simple "Hello World" application.


    Chapter 2 takes a look at what makes a Play application. It goes over all the

    directories and files, and explains what every component is for. We also show
    how you

    y import a Play application into your IDE.


    Chapter 3 shows a simple web application, without going into too much detail.
    In

    this chapter, we''ll see every important part of Play in action: controllers,
    actions,

    templates, and forms. This is the start of an application that we develop in the
    book.


    Chapter 4 takes a step back and looks at where Play fits in a more conventional

    enterprise architecture. It contrasts Play with conventional JEE development,
    and

    shows how Play can tackle major challenges in such an architecture.


    Chapter 5 is all about controllers. It explains how controllers are and how action

    methods help you interface with the web. It also explains how routing works and

    the different scopes.


    Chapter 6 covers how to handle user input. We show you how to use Play''s

    API, as well as how binding and validation work.


    Chapter 7 introduces database persistence. We explain the concept of an ORM and

    show how to use the Ebean ORM tool with Play. At the end of the chapter, we dis-

    how you can use JPA instead of Ebean, should you choose to do so.


    Chapter 8 explains how templates work. It explains the template syntax, and\show
    how use composition to structure your projects in a reusable manner. At the

    of the chapter, we look at using Play''s support for LESS and CoffeeScript, and

    introduce the internationalization API.


    Chapter 9 covers one of the most powerful features of Play: asynchronous request

    handing. It explains why long-running tasks are better performed "in the back-

    ground," and how to achieve that easily. It also shows how you can have a web
    applic-

    streaming data, using WebSockets or Comet.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# ABOUT THIS BOOK


    xxi


    Chapter 10 explains how you can build a secure application in Play. It also explains
    how you can avoid common security problems, and how you can use filters to implement
    authentication.


    Chapter 11 covers the build process of Play. It explains the configuration files,
    and shows how to package your code in reusable modules. Finally, it shows what
    you''s involved with taking your application to production.


    Chapter 12 introduces the tools that Play has for testing your application. It
    explains the different kinds of automated tests there are, and how you can write
    them for your application.


    # Code conventions and downloads


    All source code in listings or text is in a `fixed-width font like this` to separate
    it from ordinary text. Code annotations accompany many of the lists, highlighting
    important concepts. The current version of Play is 2.2 at the time of writing.
    That means all the code we demonstrate assume a Play version of 2.2.x, and we''ve
    tested every code sample under version 2.2.0.


    Source for all working examples in this book is available for download from GitHub
    at https://github.com/playforjava, as well as from the publisher''s website at
    www.manning.com/Playforjava.


    # Author Online


    The purchase of Play for Java includes access to a private web forum by Manning
    Publications where you can make comments about the book, ask questions, and receive
    help from the authors and other users. To access the forum and subscribe to it,
    visit www.manning.com/PlayforJava. This page provides information on how to get
    on the forum once you''re registered, what kind of help is available, and the
    rules of conduct on the forum.


    Manning''s commitment to readers is to provide a venue for meaningful dialogue
