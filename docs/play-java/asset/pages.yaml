    # 7.6 Using JPA instead of Ebean


    When developing a new application, you should definitely consider using Ebean;
    it''s a better match for Play, given its stateless and explicit nature. There
    are a few good reasons to use JPA instead. For example, you might be more familiar
    with it, or have legacy code you want to include, or might just think it''s cooler.
    Play won''t stop you. In fact, Play is nice enough to include supporting features
    for it. We won''t have to go into the details of using JPA with Play (you''re
    probably already familiar with it, if you decide to use it). Here''s how you can
    set up your JPA app to use Play.


    # 7.6.1 Configuring Play


    There are two steps to enable JPA in Play: exposing the data source to JNDI and
    adding JPA dependencies to the dependencies list.


    First, open your application.conf file, and add database configuration as usual
    (see section 7.3.1). Also add the jndiName property to your database configuration,
    and configure a default persistence unit name for JPA like:


    ```

    db.default.driver=org.h2.Driver

    db.default.url=*jdbc:h2:mem:play*A

    ```'
