  md: '# Security


    # This chapter covers


    +   - Play security concepts

    - Adding basic authentication with filters

    - Fine-grained authentication with action composition


    In this chapter, we''ll first look at Play 2 security concepts to understand what
    it means from a developer''s point of view to secure your application. We''ll
    review the different types of attacks our application can be exposed to and the
    tools Play 2 provides to secure our application. We''ll then move forward to actually
    implement security in our application, with basic authentication and authorization,
    using filters. This section shows a low-level framework security implementation,
    by course Play provides built-in helpers for authentication and authorization.
    Last, we''ll see how to use those helpers together with action composition to
    add more-grained security constraints to our application.


    # 10.1 Play security concepts


    Web application frameworks are made to help developers building web applications.
    Some of them also help secure the web application. One framework is not more secure
    than another: if you use them correctly, you''ll be able to build secure'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Play security concepts


    apps with many frameworks. Some frameworks have some helper methods, for example
    against SQL injection, which makes it easier to build secure web applications.


    In general there is no such thing as this plug-and-play security. Security depends
    on the people using the framework, and sometimes on the development method. And
    it depends on all layers of a web application environment: the back-end storage,
    the web server, and the web application itself (possibly other layers or applications).


    It''s estimated that about 75% of attacks are at the web application layer. In
    2004, a study found that out of 97% of the 300 Web sites were found vulnerable
    to web application attack.¹ Web applications are relatively easy to attack, as
    they''re simple to understand and manipulate. The threats against web applications
    include user account hijacking, bypassing access control, reading or modifying
    sensitive data, or presenting fraudulent content. Or an attacker might be able
    to steal users'' personal information, steal money, or cause brand damage by modifying
    content


    In order to prevent attacks, minimize their impact, and remove points of attack,
    you first have to fully understand the attack methods in order to find the correct
    countermeasures. The aim of this section, will expose some of the most common
    web application security issues,


    # 10.1.1 Play 2 session


    You need to keep information associated with a user, in particular the user''s
    login status. Without a session, the user would need to pass credentials with
    each request. That what sessions are: a set of cookies stored in the user''s browser
    to identify the user to the website, and provide other information your web application
    may choose to store rather than in the data layer (for example, the user''s locale).


    With Play 2, a session is a cookie that lives on the client side. It''s important
    to understand the implications of this. You can''t store large objects in the
    session; instead you should store them in the database and save their IDs in the
    session.


    This will eliminate synchronization headaches and it won''t fill your session
    storage space. This would also be a good idea if you modify the structure of an
    object which old versions of it are still in some user''s cookies. Critical data
    would not be stored in session. If the user clears cookies or closes the browser,
    they''ll be lost. And with client-side storage, the user can read the data.


    The cookie session is a hash of key/values, but signed but not encrypted. It''s
    signed with a secret key stored in the file config/application.conf. The property
    application.secret defines how the cookie is signed using the keyed-hash message
    authentication code SHA1 algorithm. It means that nobody can tamper with the cookie
    content. Every time a request is received, Play 2 verifies that the the cookie
    hasn''t been tampered with. Here''s what the application.secret secret key looks
    like:


    ```

    application.secret=*6u034sXWd:vm../19]6H4cm0JvpNgQOIIw*

    ```


    ¹ http://www.blackhat.com/presentations/win-usa-04/bh-win-04-grossman/bh-win-04-grossman-up.pdf'
  merge: -1
  pgno: 255
