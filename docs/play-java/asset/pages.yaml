    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_257_0.png)


    Figure 10.2 Pop-up window hello user


    By default, Play 2 is protecting you against the cross-site scripting attack.
    For some reason you might want to allow the raw data to be rendered, you script
    the @Html directive in your template. So, following our previous example:


    ```

    @Html(product.description)

    ```


    The user will see the pop-up in figure 10.2. This is why you need to be careful
    when using the @Html directive in the templates.


    # 10.1.3 SQL injection


    SQL injection is an exploit that consists of using user input to execute a SQL
    query that wasn''t intended by the developer. This can be used to destroy data,
    or get access to data that shouldn''t be visible to the current user. When you''re
    using high-level "find" methods, you should be covered against SQL injection.
    When you build your own queries manually, you need to be careful not to concatenate
    strings with but use query marks (?) and the underlying persistence service correctly
    escape the data.


    For example, JPA style, the following is to SQL injection:


    ```

    JPA.em().createQuery(''select * from product where name=" + name);

    ```


    This means that could insert the following name:


    ```

    ''nicol'':drop table users;

    ```


    Obviously this is not desirable.


    Instead you should use the following:


    ```

    JPA.em().createQuery("SELECT * from product where name = ?")

    .setParameter(1, name);

    ```


    # 10.1.4 Cross-site request forgery


    This attack method works by including malicious code or a link that connects a
    web application into a page that the authenticated user is viewing. If the session
    of that web application hasn''t timed out, an attacker may execute unauthorized
    commands.


    In our case, this might be a link to our warehouse application. For an example,
    you might be browsing a chat forum where another user, Bob, has posted a message.
    Suppose that Bob has crafted an HTML image element that references an action on
    our warehouse website (rather than an image file).'
