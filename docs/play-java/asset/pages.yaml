  md: '# Chapter 5 Controllers—handling HTTP requests


    While the controller is a central point in any Play application, its actual code
    resides in its action methods.


    # 5.1.1 Action methods


    In Play, a controller is an aggregation of action methods. An action method is
    a static method that takes some parameters as input and returns an instance of
    a (subclass of) the Result class. In other words, an action method always takes
    the follow-ing form:


    ```

    public static play.mvc.Result methodName(params . . .)

    ```


    Note that action methods are static. This is because controllers are effectively
    single-tons, which fits the HTTP approach. Because HTTP doesn''t have the concept
    of an object but is mainly procedural, we shouldn''t try to map those object concepts
    in our controller. You should really think of your action methods as the entry
    point from HTTP to your application. You could compare them to the static main()
    method of a Java program.


    Since an action method serves as an entry point, you shouldn''t put too much business
    logic into your controllers and action methods. Rather, what do we is necessary
    to translate an incoming HTTP request to data your business logic understands,
    hand off to that logic, and translate the result into an HTTP response.


    When coding static, thread safety is usually a concern, but Play will make sure
    all action methods are thread-safe. You will see that making action methods static
    has little impact on how you write code.


    For imagine, that Play queues the incoming requests for a controller in order
    to process them as fast as possible. Netty and Akka are used under the hood to
    dispatch and process users'' requests as fast as possible in a thread-safe way.
    But the cool thing about Play is that this complexity is handled for you, so you
    don''t have to worry about it.


    We''ve already created our first controller, Products, in chapter 3. Let''s examine
    it.


    # 5.1.2 Examining our controller


    In chapter 3, we created a controller class called Products. We put it in the
    /app/controllers/ folder, which is the default location for all controllers in
    a Play application. You can change these defaults if you want to, but you should
    rarely need to do so.


    Let''s revisit the contents of the controller. In your favorite text editor or
    IDE, open the file called Products.java in the app/controllers directory, as shown
    in listing 5.1.'
