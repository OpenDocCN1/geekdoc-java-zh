    >\nvar cometMessage = function (event) {\n  console.log('Received event: ' + event);\n\
    \  $(('#container').append(\"<li><a href=\"#\"\" + event + \"</a></li>\");\n}\n\
    </script>\n<div class=\"hero-unit\">\n<h1>Current Orders</h1>\n<p>Prepare them\
    \ all</p>\n<iframe style=\"display:none\" id=\"messages\"\nsrc=\"@routes.application.update\"\
    ></iframe>\n<ul id=\"container\" style=\"text-align:center\"\nclass=\"nav nav-tabs\
    \ nav-stacked\"></ul>\n</div>\n```\n\nComet essentially consists of opening a\
    \ permanent connection to the server through an iframe element. The server can\
    \ decide when to send chunked responses to the web client. Each time a response\
    \ is sent, the JavaScript callback message is called. The response is passed as\
    \ a function argument. In our case, the web thread updates the page and pushes\
    \ the response. Due to the nature of Play, it allows all connections to be open\
    \ concurrently without saturating the server. In fact, as we previously explained,\
    \ for each connection open there is no matching thread. This allows the Play server\
    \ to scale to thousands of concurrent open connections. You'll still have one\
    \ socket per connection.\n\nThis solution allows us to push data from the server\
    \ to the client. To send data from the web client to the server, you might want\
    \ to use AJAX requests in combination with Comet. But this is out of scope for\
    \ this chapter. The protocol doesn't allow you to"
