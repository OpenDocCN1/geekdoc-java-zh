  md: "# Streaming HTTP responses\n\nThe Akka.system.scheduler allows us to schedule\
    \ a background job; the job starts four seconds after initialization and occurs\
    \ every five seconds. Every five seconds, we send a new Order to the default actor.\
    \ Explaining an actor is the topic of this book, but actors can be seen as a form\
    \ of active objects for invoking a method corresponds to sending a message. You\
    \ can read more about actors and Akka in the excellent Akka in Action³ published\
    \ by Manning.\n\nInstead of an actor, you can use a class that implements Runnable\
    \ and pass your business logic inside the run() method:\n\n```\nAkka.system().scheduler().schedule(\n\
    \  Duration.create(10, TimeUnit.SECONDS),\n  new Runnable() {\n    public void\
    \ run() {\n      // Your business logic here.\n    }\n});\n```\n\nLet's see how\
    \ Play responds to clients, and how Play can stream large amounts of data to its\
    \ clients.\n\n# 9.4 Streaming HTTP responses\n\nAs we've seen in the earlier chapters,\
    \ after receiving and interpreting a request message, the Play responds with an\
    \ HTTP response message.\n\nSometimes we want to stream information to the clients.\
    \ This means that we want to continuously send data to our web clients. As an\
    \ example for our application, we want to send the expedited orders; we want to\
    \ see our client orders on a screen as soon as they are entered. People in the\
    \ warehouse can then pack and ship those orders as soon as they see. Figure 9.6\
    \ shows our final application.\n\nBut before we start our expedited orders, let's\
    \ recap the different methods to return data with Play and, from there, how streaming\
    \ data is different from a technical point of view.\n\n# 9.4.1 Standard responses\
    \ and Content-Length header\n\nWhen you send a standard (non-streaming) HTTP response,\
    \ Play automatically sends the appropriate Content-Length header with the response,\
    \ and the connection between client and server is closed as soon as all bytes\
    \ are in the response as all bytes have been transmitted. For this to work, Play\
    \ needs to know the entire content of the response before it starts it.\n\n> ³\
    \ Akka in Action, http://www.manning.com/roestenburg/, by Raymond Roostenburg,\
    \ Rob Bakker, and Rob Williams."
  merge: -1
  pgno: 237
