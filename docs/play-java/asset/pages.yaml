  md: '# Implementing the list method


    The body of our code block is mainly HTML, which will be included in the ren-der
    page verbatim. There''s one bit of template code left—the bit that iterates over
    our products list:


    ```

    @for(product <- products) {

    ...

    }

    ```


    This bit of code is comparable to a regular Java for-each loop: it iterates over
    a colle-ction and repeats the code it writes for every element in it, assigning
    the current-element to a variable. In our example, it generates a pair of <td>
    for every Product in our products list. Listing 3.7 shows the full loop as a reminder:


    # Listing 3.7 for-each loop generating the product descriptions


    ```

    @products: List[Product]

    <table class="table table-striped">

    <head>

    <tr>

    <th>EAN</th>

    <th>Name</th>

    <th>Description</th>

    </tr>

    </head>

    <body>

    @for(product <- products) {

    <tr>

    <td><a href="@routes.Products.details(product.ean)">

    @product.ean

    </td>

    <td><a href="@routes.Products.details(product.ean)">

    @product.name</a></td>

    <td><a href="@routes.Products.details(product.ean)">

    @product.name</a></td>

    </tr>

    }

    </body>

    </table>

    ```


    The pieces of code that follows the @ are evaluated, and the result is included
    in the output. In this case, we use it to print out properties of product and
    generate links to our action methods based on our routing configuration. For everything
    routing, we see chapter 5. We''ll render our template soon, but first let''s add
    some style.


    # ADDING BOSTRAP


    During our examples, we focus more on functionality than styling; this is a book
    about Play, after all, and not about web design. But there is a way to make things
    look nicer with little effort: Bootstrap, by Twitter.'
  merge: -1
