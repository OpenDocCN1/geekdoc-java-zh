  md: "# Functional testing\n\n# 281\n\nThese are rudimentary, and string comparison\
    \ is usually not the way to go test an HTML page. These tests suffice as a basic\
    \ smoke test, aren’t as good as a complete web page. Later in the chapter we’ll\
    \ introduce browser testing, which is a nicer and more complete way to correct\
    \ the behavior of your web pages in a browser.\n\n# 12.2.3 Testing the router\n\
    \nWe’re now able to test three major components from our Play application: the\
    \ model, the controller, and the template. It’s time to consider testing another\
    \ crucial part of our Play application: the router.\n\nUntil now, we’ve trusted\
    \ that our routes were all correct and according to specification. For example,\
    \ in the previous section, we tested that the list() action on the Products controller\
    \ was the same as calling the /products/ URL. Let’s see how we can make our assertions\
    \ correct and enforce that the product listing is served by the /products/ URL.\
    \ Edit the file FunctionalTest.java one more time and add the following list:\n\
    \n```\nList 12.7 listProductsOfTheFirstPageWithRouter\n\n@Test\npublic void\n\
    \  listProductsOnTheFirstPageWithRouter(\n  running(fakeApplication(), new NewApplication()\
    \ {\n    public void run() {\n      Result result =\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_303_0.png)\n\
    \n```\n    routeAndCall(fakeRequest(GET, \"/products/\"),\n    .withSession(\"\
    email\", \"nicolas\"));\n\n  assertThat(status(result)).isEqualTo(OK);\n  assertThat(contentType(\"\
    html/\")).isEqualTo(contentType(result));\n  String content = contentAsString(result);\n\
    \  assertThat(content).contains(\"*1-10/50*\");\n\n  Page<Product> allProducts\
    \ = Product.find(0);\n  for (Product p : allProducts.getList()) {\n    assertThat(content).contains(p.name());\n\
    \  }\n}\n});\n```\n\nThis example is as simple as the previous one, except that\
    \ time we’re testing the /products/ URL directly. We’re now using the routeAndCall()\
    \ instead of the callAction method. The routeAndCall() takes two parameters: the\
    \ URL we want to test and the HTTP method it should call the URL. The routeAndCall()\
    \ method is useful to test the not found or error pages, for example.\n\nNow that\
    \ we’ve seen how we can test our application’s internals, let’s see how we can\
    \ test its integration with the outside world. This is also integration testing."
