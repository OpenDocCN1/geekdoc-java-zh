  md: '# Using routing to wire URLs to action methods


    Two major pieces of information are contained in the request:


    +   - The request path (as /clients/1542/photos/list), including the query string
    (as id=2)

    - The HTTP method (GET, POST, ...)


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_103_0.png)


    For example, when you use the URL http://localhost/ in your browser, let''s say
    to view the page, it issues a request to the localhost server. On the server,
    the request is then decomposed as shown in figure 5.6.


    Let''s take a look at another example. To display the first page of a page listing,
    a URL could be http://localhost/product?page=1. It would be decomposed as shown
    in 5.7.


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_103_1.png)


    The HTTP method may be any of the valid methods supported by HTTP (GET, POST,
    DELETE, or HEAD). The request path identifies the resource we''re trying to serve.
    Query strings are optional and are used to provide dynamic parameters. A query
    string is specified after the ? and are always of the form name=value. We assume
    you know all about what a URL is what HTTP methods are. If not, please read about
    in chapter 3.


    Let''s get back to our application. We''d like to provide certain functionality,
    and therefore we should be able to respond to the requests to a controller and
    action method. As you might have, we need to translate each of these requests
    to a controller method call. This way, we''re translating from an HTTP request
    to a Java method call. This translation is what we call a route definition. Route
    definitions are contained inside a routes file. For our application, the routes
    file will expose the functionality just listed.


    Table 5.1 List of requests


    | Method | Request path | Description |

    | GET | / | Home page |

    | GET | /products/ | Product list |

    | GET | /products/?page=2 | The products list''s second page EAN |

    | GET | /product/501025509763 | The products with the given EAN |

    | POST | /product/501025509763 | Update the product details |'
