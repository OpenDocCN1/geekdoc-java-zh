  md: "# 124 CHAPTER 6 Handling user input\n\nBody parsers “decode” the request and\
    \ transform it into objects that can then be used by the other Play components.\
    \ Because a JSON body is parsed differently to an XML body, Play usesgable body\
    \ parsers. Different content types, therefore, have specific body parsers that\
    \ can translate arbitrary incoming data into something Play understand.\n\nUsing\
    \ body parsers, it's possible to directly manipulate the object obtained from\
    \ a request. The interaction is done through a body-parser API.\n\n# 6.3.1 The\
    \ body-parser API\n\nAll body parsers must generate a play.mvc.Http.RequestBody\
    \ value. This value can then be retrieved via request().body(). The following\
    \ listing shows how to use the API.\n\n> Listing 6.19 Accessing the request body\n\
    \n```\npublic static Result index() {\n    RequestBody body = request().body();\n\
    \    return ok(\"Here is the body received: \" * + body);\\n}\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_146_0.png)\n\
    \nYou can specify the BodyParser to use for a particular action using the @BodyParser.Of\
    \ annotation. This means that we can use a specific body parser to parse the request\
    \ and then access the request to read the value. Listing 6.20 shows an example\
    \ where we're specifying a JSON body parser and reading the result via the body.asJson()\
    \ method.\n\n> Listing 6.20 Specifying a specific body parser to use\n\n```\n\
    @BodyParser.Of(BodyParser.Json.class)\npublic static Result index() {\n    RequestBody\
    \ body = request().body();\n    return ok(\"Expected to get json: \" * + body.asJson());\n\
    }\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_146_1.png)\n\nAll body parsers\
    \ give you a play.mvc.Http.RequestBody value. From this body you can retrieve\
    \ the request body content in the most appropriate type. In our previous example,\
    \ we used the asJson() method. If we used an XML body parser, we'd use the asXML()\
    \ method.\n\nREQUESTBODY METHODS RETURN NULL RequestBody methods such as asText()\
    \ or asJson() return null if the parser can't handle that content type. For example,\
    \ in an action method annotated with @BodyParser.Of(BodyParser.Json.class), calling\
    \ asXml() on the generated body will return null.\n\nSome parsers can provide\
    \ a more specific type than Http.RequestBody (a subclass of Http.RequestBody).\
    \ You can automatically cast the request body into another type using the as()\
    \ helper method. An example is shown in the following listing."
  merge: -1
