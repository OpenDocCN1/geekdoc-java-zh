  md: "# Listing 10.3 BasicAuthenticationFilter.java\n\npackage utils;\n\n```\nimport\
    \ static play.mvc.Results.*;\nimport play.api.libs.iteratee.*;\nimport play.api.libs.iteratee.Done;\n\
    import play.api.mvc.*;\nimport play.libs.Scala;\nimport scala.Option;\nimport\
    \ scala.Tuple;\nimport scala.collection.Seq;\nimport scala.runtime.AbstractFunction1;\n\
    import sun.misc.util.BASE64Decoder;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\
    ```\n\n```\npublic class BasicAuthenticationFilter implements EssentialFilter\
    \ {\n\n    public BasicAuthenticationFilter() {\n        // Left empty\n    }\n\
    \n    public EssentialAction apply(final EssentialAction next) {\n\n        return\n\
    ```\n\n> Implement the only method from EssentialFilter interface. The let us\
    \ continue with next action (chaining).\n\n```\nnew JavaEssentialAction()\n```\n\
    \n> Implement EssentialAction. (a JavaEssentialAction's Scala compatible)\n\n\
    ```\n@Override\npublic EssentialAction apply() {\n    return next.apply(rh);\n\
    }\n```\n\n> Apply method from EssentialAction. Apply method that takes RequestHeader\
    \ and return response in form of a body and a Result (Iteratee<byte[]>)\n\n```\n\
    @Override\npublic Iteratee<byte[]>, SimpleResult> apply(RequestHeader rh) {\n\
    \    Option<String> authorization=rh.headers().get(\"authorization\");\n    if\
    \ (authorization.isEmpty()) {\n        String auth=authorization.get();\n    \
    \    BASE64Decoder decoder=new BASE64Decoder();\n        String pass=auth.split(\"\
    :\\*\")[1];\n        try {\n            String[] pass=new String(decoder.decode(pass)).split(\"\
    :\");\n            String username=pass[0];\n            String password=pass[1];\n\
    \            if (\"nicolas\".equals(username)&&\"nicolas\".equals(password)) {\n\
    \                return next.apply(rh);\n            }\n        } catch (Exception\
    \ e) {\n            // Nothing\n        }\n    }\n```\n\n> If we have an Authorization\
    \ header, proceed with decoding this content\n\n> If username and password match,\
    \ proceed with next EssentialAction"
