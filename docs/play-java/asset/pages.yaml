  md: "# Listing 6.9 Project directory structure\n\n> The class that we need to edit\n\
    \nThe code is simple; all we need to implement three methods. Like we said, our\
    \ Product class implements the play.mvc.PathBindable interface and references\
    \ itself (we have the class declaring a Product, and play.mvc.PathBindable provides\
    \ Product via the use of generics). The three methods we need to implement to\
    \ satisfy our interface:\n\n+   - bind(String key, String txt)\n- String unbind(String\
    \ key)\n- String javascriptUnbind()\n\nThe bind method indicates how to display\
    \ when a Product is referenced from the URL. The unbind method tells play from\
    \ the view, for example, in case of reverse routing (chapter 5). In our case,\
    \ we show the product's EAN number. The method javascriptUnbind is used for Ajax\
    \ calls. We also want to use the product's EAN number for that.\n\nLet's add our\
    \ new methods. The bind method performs a lookup in the database, using the EAN\
    \ number. The EAN number is passed via the txt parameter. That is the EAN number\
    \ as it appears in the URL. The unbinding process is simple and consists of returning\
    \ our Product instance's EAN number. The following lists shows our implementation.\n\
    \n# Listing 6.10 Product class that is PathBindable-aware\n\n```\n...\nimport\
    \ play.mvc.PathBindable;\nimport play.mvc.libs.Option;\n\npublic class Product\
    \ implements PathBindable<Product> {\n\n    @Override\n    public Product bind(String\
    \ key, String value) {\n        return findByEan(value);\n    }\n\n    @Override\n\
    \    public String unbind(String key) {\n        return this.ean;\n    }\n}\n\
    ```\n\n> We're telling Play that're defining a new Binder to bind URL paths\n\n\
    > Binding—we're looking in the DB for a product with an EAN number equal to the\
    \ one passed in URL\n\n> Unbinding—we're returning our raw data"
