    the start without losing time setting the environment or understanding the details
    of the other blocks.


    High productivity means that any developers can produce working software within
    a matter of hours and be able to do it without external help.


    Modern framework means that the framework concentrates on the server side and
    delegates as much as possible to the (rich) clients. Play makes sure to delegate
    as much as possible to the web browser and allows easy integration with the latest
    browser specifications. Today, a lot of innovation happens at the client level.
    Our smartphones are now more powerful than desktop computers of two years ago.
    Therefore, the server should delegate as much as possible to the clients. The
    less the server does for the client (for example, rendering or user-interface
    interaction), the more scalable the application is.


    Play is also designed to easily integrate with other web applications through
    HTTP. It provides functionality to easily talk to other web applications.


    How do such concepts fit the enterprise context? If you see the web as a giant
    company and the different web applications as business units, everything is explained.
    A lot of web applications are able to get data from other web applications. For
    example, most new web applications allow you to log in using your existing Framework
    credentials; you not need to reimplement user authentication. Let''s see in more
    detail what we mean and how Play helps.


    Play achieves reachability and interoperability between applications by promoting
    RESTful web applications. This means that web applications should expose their
    methods and data using REST, and most of the time they should expose themselves
    as web services as well.


    A RESTful web application is a web application implemented using HTTP and REST
    principles. It''s a collection of resources, with four defined aspects:


    +   - The base UI for the web application, as http://example.com/warehouses/

    - The internet media type of data supported by the web API

    - The set of operations supported by the web API using HTTP methods (for example,
    GET, PUT, POST, or DELETE)

    - A hypertext-driven API (that, URLs define the API)


    In order to facilitate communication within a web application, web APIs are usually
    part of the web application. REST promotes reusing the existing information systems.
    This means that REST APIs tend to reuse the same architecture, making it easier
    for developers.


    RESTful architecture goals are:


    +   - Scalability of component interactions

    - Generality of interfaces'
