  md: '234


    CHAPTER 10 Security


    As your secret is safe, it''s not possible for a third party to forge sessions.
    It''s important to keep it private: don''t commit it in a public repository, and
    when you install an application written by someone else, change the secret key
    to your.


    Don''t store critical data: it''s not encrypted, you shouldn''t store critical
    data in the session. The cookie''s content (your session) can be seen by looking
    the user cookie, or by sniffing the connection on a local network or WiFi. As
    we said previously, the secret is stored in a cookie, and cookies are limited
    to 4 KB. In addition to this limit, only strings can be stored.


    # 10.1.2 Cross-site scripting


    Cross-site scripting is one of the most common vulnerabilities in web applications.
    It consists of injecting malicious JavaScript into web pages that your application
    provides. Using JavaScript, one can easily redirect users to another website,
    asking them for personal information.

    For example, in our application, when adding a product, the user is asked to fill
    a description for the product, as shown in figure 10.1. If you blindly include
    what commenters have written into your HTML page, you''re opening your site to
    attacks.

    Using this technique, an attacker could:


    +   - Show a pop-up to your visitors

    - Redirect your visitors to a site controlled by the attacker

    - Steal information that''s supposed to be visible to the current user, and send
    it back to the attacker''s site


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_256_0.png)


    Figure 10.1 New product form


    Consequently it''s crucial to protect yourself from those attacks. That''s why,
    by default, Play 2 will escape any content entered by the user. For example, if
    the user enters


    ```

    <script>alert("hello user");</script>

    ```


    in the description field, Play 2, when displaying the content, will escape it
    so the JavaScript won''t be executed. Instead, it will render the following HTML
    code:


    ```

    &lt;script&gt;alert(&quot;hello user&quot;&lt;/script&gt;

    ```'
