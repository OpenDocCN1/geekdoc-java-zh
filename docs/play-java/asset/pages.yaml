  md: 'els, the controllers, the templates, and the router. Using FakeApplication,
    and the running() method found in the play.test.Helpers class, your entire application
    can be tested by calling the application code directly. The TestServer allows
    you to call your application''s HTTP interface like a client application, enabling
    you to run integration tests. Play''s integration with Selenium and Fluenium means
    that you can easily test your application as the user sees it, including the effects
    of JavaScript and user interaction.


    You''ve now made it through Play and learned a lot; you have the knowledge to
    tackle modern web applications and can expand on that knowledge. As a final suggestion,
    try to keep in touch with the Play community. It''s a busy and exciting place,
    and we''d love to hear from you there. Hope you''ve enjoyed the ride!'
