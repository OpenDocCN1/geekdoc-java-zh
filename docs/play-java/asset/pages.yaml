    The csrfToken is automatically generated and Play 2 will automatically check that
    this is a valid CSRF token for the POST request. If someone tampers with it, you''ll
    receive an invalid CSRF token error message like the following:


    Invalid CSRF Token


    You can tune-the CSRF filter using the following properties in your application

    conf:


    ```

    csrf.token.name=csrfToken

    csrf.cookie.name=

    csrc.tokenInBody=true

    csrf.cookie.createIfNotFound=true

    csrf.unsafe.methods=POST

    ```


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_260_0.png)


    We just used a filter, but it''s important to understand exactly how it works
