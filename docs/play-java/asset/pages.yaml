  md: '# CHAPTER 7 Models and persistence


    There are a few tricks that most databases implement to help cope with the lack
    of these relations. For example, you can enforce the value of a certain column
    is in another table by identifying column (primary key), which you can use to
    keep your data using JOIN clauses while querying data. Data relationship isn''t
    strong, however, because the records aren''t actually linked; it''s a trick to
    look up data that''s related. It happens to be the database that is optimized
    to perform.


    An object hierarchy, on the other hand, does have relationships between its entities.
    One object can "have" other objects, and that relationship can go both ways (a
    warehouse has stock items, but a book item has a warehouse as well). Another concept
    from the object-oriented world, which you generally won''t find in a database,
    is inheritance. Inheritance is a different kind of relationship. These two different
    views on data structures is a challenge when using an object-oriented language
    with a relational database.


    # 7.2.2 Bridging the real world and the OO world


    Although there are mismatches between the OO world and the relational world, it''s
    not impossible to map objects to databases and vice versa. This process is called
    Object-Relational Mapping (ORM). There are many tools that offer ORM for Java,
    the standardized one is the Java Persistence API (JPA). Another well-known tool
    for this Hibernate, and Hibernate can also serve as a JPA implementation. If you''ve
    done anything database-related in Java, you''ve probably used these, or you''ve
    at least heard of them.


    +   * (Relational) databases and object models are fundamentally different.

    * They can be mapped onto each other; this is called Object-Relational Mapping


    JPA allows you to use annotations to specify the mapping of classes and fields
    to tables and columns. Any class mapped to the database is referred to as an entity,
    and we will use this from now on. In addition to mapping entities, JPA also specifies
    an API for saving and updating entities, managing transactions, and querying data
    for entities.

    Jpa has more or less the default persistence API in the Java ecosystem, particularly
    in the JEE world. Play doesn''t prevent you from using JPA and/or Hibernate (or
    any other persistence solution, for that matter), it isn''t the default solution.
    This is because a big part of the JPA spec is based on managing entity state,
    such'
  merge: -1
