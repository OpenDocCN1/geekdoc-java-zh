  md: '# CHAPTER 5 Controllers—handling HTTP requests


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_102_0.png)


    Figure 5.4 Adding Content to the controller lifecycle


    We are now able to serve content according to the client''s wishes. We added our
    Content object to the diagram to explain the complete request/response lifecycle
    in Play, as shown in figure 5.4.


    We are now able to respond to a request with some content. Let''s take a look
    at how our code is actually called in response to a request.


    # 5.3 Using to route URLs to action methods


    We now know how to render some content and how to execute business logic. But
    how do we link the controller method to be executed to the URL that the client
    invokes?


    # 5.3.1 Translating HTTP to Java code


    Remember, our client only speaks HTTP. But the code that we''re writing is in
    Java. We therefore need to translate the HTTP “language” to the Java language.
    This is the role of the router: translating each incoming HTTP request to an action
    method call. In this way, it exposes the controller methods to the client. An
    HTTP request can be seen as an event, from Play''s point of view. The router''s
    role is to coordinate a reaction to such an event (figure 5.5).


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_102_1.png)


    Figure 5.5 Role of the router'
