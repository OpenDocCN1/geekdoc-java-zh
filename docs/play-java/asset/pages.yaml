  md: "# Play security concepts\n\n```\nconf\npublic\nproject\ntest\n```\n\nThe following\
    \ listing shows the new filters() method of our Global.java class.\n\n# Listing\
    \ 10.2 Global.java\n\n```\nimport play.*;nimport play.api.mvc.EssentialFilter;\n\
    import play.filters.csrf.CSRFFFilter;\n\npublic class Global extends GlobalSettings\
    \ {\n\n  @Override\n  public Class<T extends EssentialFilter> Class<T> filters()\
    \ {\\n    filters = (CSRFFFilter.class);\n    return filters;\n  }\n\n}\n```\n\
    \nGlobal class is our application entry point\n\n> Override filter methods to\
    \ provide our custom filters\n\n> CSRFFFilter that takes care of cross-site forgery\
    \ attack\n\nThe Global class extends the GlobalSettings class. It calls methods\
    \ during your application lifecycle, namely onStart, onStop, onError, and so.\
    \ You can look at the javadoc class for more information. In our case, we want\
    \ to provide a filter that allows us to change the cross-site request forgery\
    \ attack.\n\nWe need to change our product form to include the generated token.\
    \ Lets change our details.scala.html form located in the app/views/products directory\
    \ as shown in the following:\n\n+   - app\n  - controllers\n    models\n     \
    \ products\n        details.scala.html\n- conf\n  public\n  project\n  test\n\n\
    We need to change our form to use the specific CSRF helper. In the details.scala.html\
    \ file, we need to replace the following line:\n\n```\n@helper.form(action = routes.Products.save()),\n\
    \  'encctype -> \"multipart/form-data\" {\n```\n\nWith the following:\n\n```\n\
    @helper.form(action = helper.CSRF(routes.Products.save())),\n  'encctype -> \"\
    multipart/form-data\" {\n```"
