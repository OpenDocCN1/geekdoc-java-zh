  md: "# Integration testing\n\nNow, presumably, our browser has opened the page at\
    \ the URL we gave it. But do we verify that we're actually where we want to be,\
    \ and that the correct page is showing? That's step of our test: \"Assert that\
    \ the product list is present on the page.\"\n\nFor assertions, we use JUnit,\
    \ just like we've been doing along. The only thing that's not immediately obvious\
    \ is how to ask the browser for information about the page that is currently rendered.\
    \ For that, we can use Fluentium API as well.\n\nIf you've ever used CSS or jQuery,\
    \ you're probably familiar with selectors. Select allow you to select elements\
    \ of an HTML page by specifying element names, classes, and IDs. Fluentium allows\
    \ you to use these selectors for purpose. Play's integration with Fluentium borrows\
    \ the $ syntax of jQuery to get access-the browser object has a $ method that\
    \ allows us to run selectors on the currently rendered page.\n\nNow that we have\
    \ the tools, let's assert that we have a product list on our page. First, we need\
    \ to sign in to the application as an authorized user. We're using the fill()\
    \ method to input our username and password in the login screen. The selector\
    \ for our input element is simple `[name='email']` and `[name='password']`, as\
    \ defined in HTML. We then submit the sign-in form and are redirected to the product\
    \ list page, where we're looking for at least one element in a td element. The\
    \ selector for this is \"table td a\". To assert that we have at least one result,\
    \ we'll use the isNotEmpty method. The next lists the corresponding code.\n\n\
    # Testing the presence of the product list\n\n```\nimport org.junit.*;\nimport\
    \ play.mvc.*;\nimport play.test.*;\nimport play.libs.F.*;\n\nimport static play.test.Test.*;\n\
    import static org.test.assertions.Assertions.*;\n\nimport static org.fluentium.core.FilterFilterConstructor.*;\n\
    \npublic class IntegrationTest {\n  @Test\n  public void productListingTest()\
    \ {\n    running(testServer(3333),\n      fakeApplication(),\n      HTML_UNIT,\
    \ new Callback<TestBrowser>() {\n        public void invoke(TestBrowser browser)\
    \ {\n        browser.goto(\"http://localhost:3333\");\n        // login\n    \
    \    browser.fill(\"input[name='email']\").with(\"nicolas\");\n        browser.fill(\"\
    input[name='password']\").with(\"nicolas\");\n        browser.submit(\"button[type='submit']\"\
    );\n        assertThat(browser.$(\"table td a\").isNotEmpty());\n      }\n   \
    \ });\n  }\n}\n```"
