  md: "# Listing 6.21 Using the as() helper method\n\n```\n@BodyParser.Of(BodyLengthParser.class)\n\
    public static Result index() {\n    BodyLength body = request().body().as(BodyLength.class);\n\
    \    return ok(\"Request body length: \" + body.getLength());\n}\n```\n\nIf you\
    \ don't specify a parser, Play will use the Content-Type header to determine which\
    \ built-in parser to use:\n\n+   - text/plain-String, accessible as as()\n- application/json-JsonNode,\
    \ accessible as Json()\n- text/org.w3c.Document, accessible as Xml()\n- application/form-URL-encoded-Map<String,\
    \ String>, accessible via FormUrlEncoded()\n- multipart/form-data-Http.MultipartFormData,\
    \ accessible as MultipartData()\n- Any other content-type-Http.RawBuffer, accessible\
    \ as Raw()\n\nPlease note that if the requested body isn't available, the method\
    \ will return null. The following listing shows an example of how asText() can\
    \ be used.\n\n# Listing 6.22 Using the body.asText() method\n\n```\npublic static\
    \ Result save() {\n    RequestBody body = request().body();\n    String textBody\
    \ = body.asText();\n\nif(textBody != null) {\n    return ok(\"Got: \" + text);\n\
    } else {\n    return badRequest(\n        (\"Expecting text/plain request body\"\
    )\n    );\n}\n```\n\nText-based parsers (such as text, JSON, XML-, or URL-encoded\
    \ forms) use a maximum content length because they have to load all the content\
    \ into memory. There is a default content length limit of 100 KB.\n\n**OVERRIDING\
    \ THE DEFAULT MAX CONTENT-LENGTH** The default size can be defined in application.conf:\
    \ parsers.text.maxLength=128K.\n\nYou can also specify a maximum length via the\
    \ @BodyParser.Of annotation, for example to accept 10 KB of data:\n\n```\n@BodyParser.Of(value\
    \ = BodyParser.Text.class, maxLength = 10 * 1024)\npublic static Result index()\
    \ {\n    n...\n```"
