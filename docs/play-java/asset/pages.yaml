  md: '# preface


    Back in 2009, I discovered Play by chance while surfing the web. I was surprised
    at how easy it was to get started with the framework. At the time, I was doing
    most of my web development using the Seam web framework. Play was a game changer
    then, and I started to build all my applications using it. Soon enough, I joined
    Guillaume Bort, the founder of Play, and contributed to the framework.


    The framework started to gain more and more traction, though mostly in Europe.
    Time passed, and we released Play 1.1 and then Play 1.2. Guillaume started to
    envision a complete rewrite of Play using Scala as a core language, giving Play
    extra power. The goal was to empower Play''s users while keeping the main successes
    intact: Play''s simplicity and rapidity. Guillaume joined forces with Sadek Drobi.
    Sadek Play 2 core uses advanced Scala features, Play 2 focuses on simplicity and
    has a fully supported Java API. Play 2 Java is probably the best option for building
    scalable web applications with simplicity without sacrificing scalability and
    other features.


    While I contributed to Play 2''s codeways, my main contribution to Play 2 adoption
    is this book. I hope it will become an invaluable asset to professional Play developers.
    In truth, my coauthor Siete and I could have added even more information to this
    book, but we hope that we''ve stuck a good balance between useful content and
    weight. We also hope that you will enjoy the book and that it will help you unleash
    the full potential of Play while keeping its simplicity in mind.


    NICOLAS LEROUX'
  merge: -1
