  md: '# Modularity


    Play is modular by design and allows developers to build simple, reusable pieces
    of soft-ware. Stacking those reusable pieces makes possible to build complex and
    robust systems. Each team can concentrate on a piece of the puzzle and each piece
    of the puzzle can be tested independently. Reusable modules can be shared among
    devel-opers and enterprise departments. For example, an enterprise can build its
    authenti-cation module and make it as a module to be reused by all applications.


    After this Play framework overview, it''s now time to experience simplicity!


    # Hello Play!


    As you expect, it''s easy to do something simple as output "Hello world!" All
    you need to do is use the Play command that creates a new application and a couple
    of lines of Java code. To begin to understand Play, you will run the command and
    the type code, because only then will you get your first experience of Play''s
    simplicity, productivity, and usability. But to do that, you will need to have
    Play installed. We''ll get that in a minute.


    First, it''s interesting to talk about why there even an installation step with
    Play 2. Most frameworks in the Java world are libraries that allow you to add
    your project and bootstrap with configuration file (such as web.xml) or boilerplate
    code to run in a Servlet container or application server. With these frameworks,
    there is no install step. Play is more than a library; it provides a complete
    tool suite, including a web server and a build tool.


    Installing Play is easy; here''s how.


    # Installing Play


    First, download Play 2.2 from the web site at http://playframework.org. Extract
    the zip file to the location where you want to install Play 2 (your home directory
    is fine). Next, you need to add this directory to your PATH system variable, which
    will make it possible for you to launch Play from anywhere.


    Setting the PATH variable is easy Here are the instructions for OS X, Linux, and
    Windows:


    +   - Mac X—Open the file /etc/paths in a text editor, and add the path you installed
    Play.

    - Linux—Open your startup file in a text editor. The name of the file depends
    on which shell you use; for example, .bashrc or .zshrc for zsh. Adding the following
    line to it: PATH=$PATH:/path/to/play (with the proper path substituted).

    - Windows 7—Go to Control Panel > System and Security > Click Advanced System
    Settings on the right side. Click the button Environment Variables. You''ll see
    a window listing variables (as in figure 1.2), and there should be a user variable
    called PATH. Simply add the path to your Play installation to the end of its value.'
