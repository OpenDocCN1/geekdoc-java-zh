  md: "As you see, it matches with the parameters we supplied in our URL. It's a simple\
    \ and predictable mechanism. It's now trivial to map back and forth from HTTP\
    \ parameters to objects.\n\nIt works for simple types such as String, Integer,\
    \ Long, and so forth. Play also provides support for more complex types such as\
    \ Date and for multiple values that must be mapped to an array or List object.\n\
    \nFor dates, you can annotate your model with the @play.data.format.Formats .DateTime.DateTime(pattern\
    \ = \"yyyy-MM-dd\") public Date date;\n\nIf we use the HTTP parameter with a year,\
    \ month, and day format, Play will be able to transform the string into a Date\
    \ object using a form data binder.. For example,\n\n```\nhttp://localhost:9000/project/save?date=2021-10-02\n\
    ```\n\nresults in a Date object when bound to a Form object.\n\nPlay provides\
    \ some built-in Formatters, namely DateTime, AnnotationDate-Formatter, and AnnotationEmptyFormatter.\
    \ DateFormatter attempts to convert parameters with a Date format of yyyy-MM-dd\
    \ whenever a Date object is required. AnnotationDate is used in conjunction with\
    \ the @Date annotation and allows you to specify a date format. The AnnotationNonEmptyFormatter\
    \ is used in conjunction with the @NonEmpty annotation and prints an empty string\
    \ instead of a null value\n\nAll the built-in Formatters are located in the play.mvc.data.Formats\
    \ class. Next, let's see how binding multivalued parameters works.\n\n# 6.2 Binding\
    \ multiple values\n\nThis is a common case: the user selects multiple values from\
    \ a list of possible values, and we have to store them. To illustrate this case,\
    \ let's define a new scenario. We want to be able to tag your product with a label.\
    \ We can tag a product with the words metal or plastic. Each product can have\
    \ zero or more tags, and each tag can be applied to multiple products. 6.6 illustrates\
    \ this relationship.\n\n| Product | 1..n | 1..n |\n|---|---|---|\n\nFigure 6.6\
    \ Product-Tag relationships\n\nWe need to define our new model. Let's create a\
    \ Tag model class. We create a new file in the app/models directory.\n\n+   6.5\
    \ Project directory structure\n\n```\nwarehouse\n- app\n    - controllers\n  \
    \      └── Products.java\n    - models\n```"
