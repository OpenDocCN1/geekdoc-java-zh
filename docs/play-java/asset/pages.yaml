    The preceding list might seem complicated at first, but it''s not that. It has
    two distinct parts: the EssentialFilter implementation and the EssentialAction
    implementation. The EssentialFilter part consists of implementing the apply method.
    It allows us to use the next filter or action if the authentication is successful.
    The EssentialAction main mainly consists of implementing its apply method. This
    implementation extracts the Authorization header and performs the authentication
    check. If successful, we pass it on to the next EssentialAction; otherwise we
    return a response with a forbidden result.

    The only thing left is to enable it in the BasicAuthentication filter. As we''ve
