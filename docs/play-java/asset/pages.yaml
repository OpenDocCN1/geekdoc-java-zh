  md: "# CHAPTER 6 Handling user input\n\nCustom body parsers must be written in Scala,\
    \ because they process data incrementally using Scala's Iterate I/O.\n\nBut has\
    \ body parsers for typical web content types as JSON and binary data, and these\
    \ can be reused to create body parsers in Java.\n\nNow that we understand how\
    \ to receive and transform data, we need to be able to ensure the data is valid.\n\
    \n# 6.4 Validation\n\nWe've seen how we can translate user data to our object\
    \ model and vice versa. But we also need to ensure the data is valid in the context\
    \ of our application meeting certain criteria. For example, some fields might\
    \ be mandatory. The binding process can guarantee that data is valid. Play allows\
    \ you to define constraints to catch invalid submitted data. Play also provides\
    \ detailed feedback to the client in the case of invalid data. In this section\
    \ we will see how we can define constraints on the data inputs.\n\n# 6.4.1 Using\
    \ the built-in validators\n\nPlay validates the data it is bound to the domain\
    \ model. Play uses JSR-303 and Hibernate validators for this step. Defining constraints\
    \ is as simple as annotating the object model. For example, ensuring that the\
    \ user provides an EAN number in our product form is simple as adding the @Required\
    \ annotation on the Product object:\n\n```\nimport play.data.validation.Constraints;\n\
    \npublic Product extends Model {\n    @Required\n    public String Bean;\n}\n\
    ```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_148_0.png)\n\nTo ensure the user\
    \ input complies with the constraint defined by the annotation, we need to check\
    \ the hasError method on Form object. Validation occurs immediately after binding\
    \ and registers errors in the form as they are found. The validation process sets\
    \ all errors to the Form that was built. Validation errors contain the relevant\
    \ i18n error message key, the field name, and a potential parameter list to display\
    \ with the error message. Listing 6.23 shows the save method seen in section 6.1.3,\
    \ with the validation check added.\n\nListing 6.23 Save action method for validation\n\
    \n```\npublic static Result save(\\ {\nForm<models.Product> productForm = \nform(models.Product.class).bindFromRequest(request);\n\
    models.Product newProduct = productForm.get();\n}\n```\n\n![](img/1f90c92b70e5931c18b6f9f04c8da72e_148_1.png)\n\
    \n![](img/1f90c92b70e5931c18b6f9f04c8da72e_148_2.png)\n\n³ JSR-303 is a Java specification\
    \ that defines a metadata model and API for JavaBean validation based on annotations;\
    \ see http://jcp.org/en/js/j/detail=303."
