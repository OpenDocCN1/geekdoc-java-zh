  md: '# Using routing to wire URLs to action methods


    # TYPE SAFETY IN THE ROUTES FILE


    Beside the obvious error reporting, another benefit of compilation is that the
    routes object is accessible from the controllers and templates. This comes in
    when you want to refer from one action method to another, or when you want to
    link to an action from a template.


    An example of the routes from a controller is redirection. Let''s say for an index
    method available at http://localhost:9000/ that should redirect the client to
    the product list method available at http://localhost:9000/product. Using the
    routes object, you can simply refer to the products method, which is used to do
    something called reverse routing, which is explained in section 5.3.5. But now,
    let''s focus on the syntax of the routes file.


    # 5.3.2 The routes files explained


    So, what are routes, exactly? As explained previously, the routes is the translation
    between the HTTP request and your code is performed. Let''s take a look at the
    routes file lists all of the routes needed by the application, and each route
    consists of an HTTP method and a URI pattern associated with a call to an action
    method. This is what a route definition is.


    Let''s see what a route definition looks like for the products home page:


    ```

    GET / controllers.Products.index() // Assume we have a Products controller with
    an action index method

    ```


    This means when a client issues an HTTP request GET /, the action method located
    in the Products class should be called. The Products class is our code; it''s
    our entry point.


    In the routes file, a route definition is composed of the following parts:


    +   - The HTTP method

    - The request path

    - Optionally, the query string

    - The call definition


    Figure 5.9 breaks down our route definition. Figure 5.10 breaks down a route definition
    that includes the optional query string.


    Let''s take a look at a more route definition. If we want to have a route definition
    that displays product details based on the product EAN, we could put the following
    entries into our route files:


    ```

    GET /products controllers.Products.list

    ```


    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_105_0.png)'
