    # 2.8 Summary


    In this chapter, we''ve created a new Play 2 Java project and identified what
    directories and files make up a Play application.


    We''ve learned that compiled code goes under `/app/`, and that includes compiled
    assets, such as LESS and CoffeeScript files. Static assets go in `/public/`, and
    `/conf/` holds important configuration data, such as the routes file and application.conf.


    We''ve also seen how to set up an IDE and how to attach a debugger to a running
    Play application.


    In the next chapter, we''ll start coding our example application.'
