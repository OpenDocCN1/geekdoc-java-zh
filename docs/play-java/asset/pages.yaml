  md: "# Your basic building blocks\n\nalready: in section 5 of chapter 3 we used\
    \ it to loop over the products list. As a reminder, the following listing shows\
    \ the relevant template code:\n\n# 8.4 Looping over the products list\n\n```\n\
    <dl>\n#for(product <- products) {\n  <a href=\"@routes.Products.show(product.ean)\"\
    >\n    @product.ean @product.name\n  </a>\n\n  <dd>@product.description</dd>\n\
    }\n</dl>\n```\n\nAs you can see, this syntax looks like the familiar Java for-each\
    \ loop, but with colon replaced by a left-arrow. Also, because of a feature called\
    \ type inference, we don't have to declare the type of the product variable; the\
    \ compiler is smart enough to figure out if you have a list of Product objects,\
    \ the variable should also be Product itself.\n\nScala for loops have some useful\
    \ features. For example, you can loop over a map. Suppose we have a Map<Long,\
    \ Product>, mapping EAN codes to a Product instance. You could rewrite listing\
    \ 8.4 as shown in listing 8.5.\n\n# 8.5 Looping over a Map\n\n```\n@(ean:Map[Long,\
    \ Product])\n<table class=\"table-striped\">\n  // We iterate the irrelevant parts\n\
    @for((ean, product) <- eanMap) {\n  <tr>\n    <td><a href=\"@routes.Products.show(ean)\"\
    >\n      @ean</a>/@product.name</td>\n    <td><dd>@product.description</dd></td>\n\
    \  </tr>\n}\n</table>\n```\n\nThis way of looping over a map also allows you do\
    \ iteration by default because there's no conventional way to maintain an incrementing\
    \ variable for the entries in our list, to get the index variable for list, use\
    \ the zipWithIndex method that Scala provides for us. The zipWithIndex converts\
    \ the Set[Product] into a Map[Product, Int], where the value of the map is the\
    \ index. That would allow you to write a template such as that in listing 8.6.\n\
    \nActually, they're comprehensions, but for our purposes they might as well be\
    \ loops."
