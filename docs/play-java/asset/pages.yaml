  md: "# CHAPTER 8 Producing output with view templates\n\nThe problem is here that\
    \ the mistake wasn't discovered until runtime because the template engine had\
    \ no way of knowing what to expect and what values would actually get passed.\
    \ Although the problem in this example happens every time, and will probably be\
    \ caught before it makes into a production system, it's very possible that more\
    \ subtle mistakes won't be caught until they cause trouble.\n\nScala templates\
    \ avoid all these problems. Instead of being evaluated at runtime, they get compiled\
    \ beforehand, including all the expressions. Because all this work is done before\
    \ the template is rendered to a page, when it does the actual rendering, it renders\
    \ very fast. After all, all the hard work has been done already. It's like running\
    \ plain code!\n\nIn addition to the better performance, Scala templates are type-safe.\
    \ Try to pass the template object of a different type than expected, and the code\
    \ that's trying to call the template function without compile. Try to use a method\
    \ that's not available for the class of object, and the template itself won't\
    \ compile.\n\nTake a look at listing 8.2, which shows the Pl 2 version of our\
    \ example template.\n\n# Listing 8.2 A-safe Scala template\n\n```\n@products:\
    \ List[Product]\n<table class=\"table table-striped\">\n<head>\n  <tr>\n    <th>Name/</th>\n\
    \  </tr>\n</head>\n<body>\n  @for (product <- currentPage.getList()) {\n    <tr>\n\
    \      <td>${product.name}</td>\n    </tr>\n  }\n</body>\n</table>\n```\n\n> Parameter\
    \ definition\n\nAside from some minor syntax differences, this template looks\
    \ almost the same as the Groovy version, with one important addition: we define\
    \ the parameter for this template, the template \"knows\" what kind of values\
    \ it has, and the compiler refuses to compile if we provide a value of the wrong\
    \ type or attempt to use the wrong way.\n\nAll these forced checks and error messages\
    \ may seem restrictive, which actually result in an application of higher quality;\
    \ after all, it's harder to mess things up, because the compiler will scream at\
    \ you if you get anything wrong.\n\nAs an added bonus, because your code makes\
    \ it clear what kind of objects the templates expects, your tools can be more\
    \ helpful. For example, your IDE now has the information it needs to autocomplete\
    \ expressions in your template, as well as to tell you what arguments your template's\
    \ render method expects. IDE support for this is already pretty decent—and improving\
    \ rapidly."
