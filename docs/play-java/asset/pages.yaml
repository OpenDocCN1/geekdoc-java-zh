    ```\n\n```\n@Override\npublic String unbind(String key) {\n    return this.id;\n\
    }\n```\n\n```\n@Override\npublic String javascriptUnbind() {\n    return this.id;\n\
    }\n```\n\nWe need to declare a new route in our routes files that the URL call\
    \ to our controller. Open the routes file located in your conf directory, and\
    \ add the following route:\n\n```\nGET /products/ controllers.Product.details(ean:\
    \ models.Product)\n```\n\nWe're ready to accept URLs as /products?ean=1. Modify\
    \ the details method on the Products controller, if you haven't already done in\
    \ the previous section.\n\n# 6.13 Project directory structure\n\n+   - warehouse\n\
    - app\n  - controllers\n    - Products.java\n    - models\n      - Product.java\n\
    \  - conf\n    - routes\n  - public\n  - test\n\nThe edit method becomes the same\
    \ as we use the path binder:\n\n```\npublic static Result details(Product product)\
    \ {\n    Form<Product> filledForm = productForm.fill(product);\n    return ok(this.details.render(filledForm));\n\
    }\n```\n\nAs you see, we can manipulate the Product object straight from our controller\
    \ methods. This is quite nice if you want to reduce the size of your controller\
    \ code. We can automatically bind URL parameters (id, in our case) to an instance\
    \ of Product. Calling http://localhost:9000/products?ean=1 shows the product with\
    \ id 1.\n\n# FORM FIELD BINERS\n\nAnother form of binding occurs when a form is\
    \ submitted or displayed. Values are mapped back and forth between the Form object\
    \ and the forms in the views. Inside the form object, the data is stored as objects,\
    \ but on the client side we can only display their string representations. This\
    \ is why form field binders can be useful."
