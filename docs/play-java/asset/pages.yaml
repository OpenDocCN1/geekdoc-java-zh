  md: '# Play 2 enterprise features


    is important in an enterprise context because it allows wide adoption of the framework
    within the company by lowering the barrier of entrance.


    # 1.4.2 Traditional data access


    Play provides all the necessary data access to enterprise data. This usually means
    accessing several databases from one application. With Play, by default, you can
    access those data via JPA, the standard Java EE Java Persistence API, or via Ebean.
    JPA is currently widely adopted in the enterprise, so developers will not lose
    feel. Ebean is quite similar to JPA, but tries to be stateless with data. You
    can use Play’s JDBC helpers to help you manage low-level data access.


    # 1.4.3 Flexibility


    Play is flexible: everything is pluggable, configurable, and customizable. This
    means it’s easy to change or extend any part of the framework. For example, you
    can rewrite the Play handles request parsing. You can also plug your own logic
    inside the framework lifecycle, for example, before your application is started.
    Play is modular from the start. Play is composed of several modules: core, jdbc,
    jpa, json, cache, and more.


    # 1.4.4 Integration


    Because Play is flexible, it’s easy to integrate a Play framework with other (legacy)
    systems. For example, you can easily integrate with an LDAP server using third-party
    libraries and make calls into it. Play provides hooks to plug into your custom
    code throughout the framework. Out of the box, you can integrate with any existing
    database through JPA, JDBC, or add your own persistence layer.


    Through the use of modules, Play provides even more ways to integrate with other
    systems. As an enterprise, you can write your own reusable modules to integrate
    with legacy systems.


    # 1.4.5 Large-team applications


    Play is also made to work with large teams; it’s possible to set up a project
    with multiple subprojects. The project can be split among multiple teams with
    each team working on a subproject. Play provides support to manage those subprojects
    so they’re automatically built and updated when releasing the application: applications
    can depend on other options, and Play allows you to declare that and make it explicit.


    # 1.4.6 Security


    Play provides the backbone for handling authentication and authorization. As a
    developer, you need to hook into the Play security mechanism and provide the implementation
    that authenticates against your enterprise servers. Play goes even step further,
    because it allows you to completely rewrite that part as if the model doesn’t
    fit your enterprise security model. Because Play stays simple, it’s not difficult
    to plug in your own mechanism.'
