  md: '# 7.5.4 Creating more complex queries


    We know how to load data at application startup, which is pretty useful. You can
    now safely tag products, as the tags are now referenced in the database. You''ll
    now need more powerful ways to query the database. Let''s see what Ebean and the
    Finder have to offer.


    Databases are good at watching for data on any criteria you want. As mentioned
    before, SQL is the language used when searching for data in an RDBMS. A downside
    of SQL used in an object-oriented environment is that it''s based on a relational
    view of the world; it''s not compatible with object-oriented programming, which
    is the whole point of our ORM exercise.


    JPA and Hibernate (and some other solutions) get around this issue by defining
    a different query language, which looks like SQL but also lets you query your
    classes and objects rather than database tables and columns.


    Creating queries like that Java would mean using strings to form them. If we need
    to compose a query dynamically, which is an OO sort of thing to do, we''d need
    to concatenate strings; which would get messy and confusing fast, which means
    our code would get hard to read or, worse, buggy. With strings is not something
    you want to do; among others it''s tedious, messy, and error-prone, and the compiler
    can''t help us at all. It''s not nice to do in a type-safe world.


    An alternative to constructing databases is a criteria-based API. A criteria-based
    API allows you to use object composition to construct a query object that will
    construct and execute an SQL query for you. This means you don''t have to deal
    with messy strings; you get to construct objects to tell the database what you
    want instead. Let''s see how that works.


    WE''LL STOP SHOWING YOU TWO APIS NOW Until now, we''ve been showing you how to
    use the Ebean API and Play''s Finder class. For this point forward, we''ll stop
    showing you and use only the Finder. Everything you can do through the Finder
    class you can do through Ebean directly, so if you prefer to do things that way,
    read through the Ebean documentation to learn how to do things using the Ebean
    API. It''s not particularly different, and the concept is exactly the same.


    When querying the database, you specify the clauses:


    +   - What data you want

    - One or more criteria that data must satisfy

    - The order of the data

    - How much data you want (that is, pagination)


    Not all of these parts are required. If you omit any of these clauses, defaults
    are used instead. Here''s an example, in plain English, that we could ask the
    database:


    +   - Give me all StockItems...

    - that have a quantity of 300 or more...'
