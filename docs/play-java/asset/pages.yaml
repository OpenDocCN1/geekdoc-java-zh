  md: '# 9.7 Summary


    In this chapter, you learned advanced techniques for manipulating asynchronous
    data. This has been a long chapter, but you''ve learned a lot. You saw how to
    process requests asynchronously and how to return an asynchronous result. Asynchronous
    results allow you to process a large number of requests concurrently. This is
    important when you have to deal with multiple data sources.


    You also saw how to stream data, from fixed-size data such as a file to arbitrary-length
    responses. From there, you learned about the concept of chunked responses. To
    better understand how chunked responses can be put to use, you saw a demonstration
    of how they''re used within the Comet protocol. The chapter ended by explaining
    the newer WebSocket protocol and how to use it from Play applications.


    In the next chapter, you''re going to find out about Play''s security mechanisms
    and see how to secure your application.'
