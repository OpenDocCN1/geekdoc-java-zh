  md: "# Implementing the list method\n\n# 3.5 Implementing the list method\n\nWe\
    \ will start with the implementation for the list method. As we said before, an\
    \ action always returns a result. What that means is that it should return an\
    \ object with a type that is a subclass of play.mvc.Result. Objects of that type\
    \ can tell Play all that it needs to construct an HTTP response.\n\nAn HTTP response\
    \ consists of a status code, a set of headers, and a body. The status codes indicate\
    \ whether a result was successful and what the problem is if it wasn’t. Play’s\
    \ Controller has a lot of methods to generate these result objects. Let’s go ahead\
    \ and replace our TODO result with a code 200 result, which means “OK.” To do\
    \ this, we use the method to obtain a new OK result, like this:\n\n```\npublic\
    \ static Result list() {\n  return ok();\n}\n```\n\nIf you try to open this in\
    \ a browser, you'll get an empty page. If you try to check the HTTP response,²\
    \ you'll see why the status code has changed from 501 - Not Implemented to 200\
    \ - OK. The reason why our browser shows an empty page is that our response has\
    \ no body yet. That makes sense, because we didn't put one in yet. To generate\
    \ our body, we want to generate an HTML page. For this, we'll want to write a\
    \ template.\n\n# 3.5.1 The list template\n\nAs we saw in the previous chapters,\
    \ a Play template is a file containing some HTML and Scala code that will compile\
    \ into a class that we can use to render an HTML page. Templates in your application’s\
    \ views directory and, to keep things clean and separated by functionality, we’ll\
    \ create a products directory there. Next, create a file called list.scala.html,\
    \ and add it to the contents shown in the following listing.\n\nListing 3.6 /app/views/products/list.scala.html\n\
    \n```\n@(products: List[Product])\n@main(\"Products catalogue\")</h2>\n<table\
    \ class=\"table table-striped\">\n<head>\n<tr>\n<th>EAN</th>\n<th>Name</th>\n\
    <th>Description</th>\n</tr>\n</tr>\n</head>\n<tbody>\n@for(product <- products)\
    \ {\n```\n\n² Your browser probably has tools to do that."
  merge: -1
