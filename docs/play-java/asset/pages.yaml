  md: '# Summary


    > In Play, there is no technical timeout for the session. It expires when the
    user closes the web browser. If you need a functional timeout for a specific application,
    just store a time stamp in the user session and check it against your application
    needs (max session duration, max inactivity duration, and so forth).


    # 5.6 Summary


    We started this chapter by explaining what controllers are. We then looked into
    the specifics of Play controllers and more particularly the controller''s action
    methods. We learned about routing our clients'' requests to our action code.


    Let''s pull out some of the key practices to take away from the chapter:


    +   - Use flash scope. Flash scope is ideal for passing messages to the user (when
    a redirect is involved).


    +   - Use action methods. This is the entry point for your business logic. Keep
    them short and delegate all business logic to your business models.


    +   - Simple binding is URL-centric data mapping to your action methods.


    We covered how to use interceptors and why they''re useful. We implemented a simple
    interceptor that catches all errors and sends an email.


    We''ve learned a lot about the internals of controllers in this chapter, and in
    the next chapter we''ll build on our knowledge by implementing some nice views
    to give our warehouse application some visual appeal.'
