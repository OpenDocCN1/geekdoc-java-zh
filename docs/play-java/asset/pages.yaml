    | Web application client | Request page with Authorization: Basic | Web application
    server | Web application client |

    | --- | --- | --- | --- |


    Send the requested page


    QWhXZGRbpjpcvcGulHnic2FZQ==


    Web client displays a pop-up window


    With incorrect authorization header


    | Web application client | Request page | Web application server | Web application
    client |

    | --- | --- | --- | --- |


    Send 401 response code with WWW-Authenticate: Basic realm="Warehouse app" header


