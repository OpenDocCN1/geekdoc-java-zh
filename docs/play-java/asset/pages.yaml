  md: "# CHAPTER 6 Handling user input\n\nForm field binders in Play are also referred\
    \ to as formatters, because they format data to and from controllers.\n\nFormatters,\
    \ both predefined and custom, are always used to map Strings to objects. You can\
    \ register a Formatter using the register() method of play.data.format.Formatters.\
    \ Let's do now with a custom formatter for dates, extending the SimpleFormatter\
    \ class. We have to register the formatter at application startup in the Global\
    \ object (or a class that extends GlobalSettings and overrides the onStart method).\
    \ For that we need to create a Global.java file in the app folder. The Global\
    \ object is part of Play and defines methods that are called during the application\
    \ lifecycle (onStart, stop, onError, and so forth). The Global.java file content\
    \ is shown in the following listing.\n\n# Listing 6.14 Registering a DateFormatter\
    \ class\n\n```\nimport play.*;\nimport play.libs.*;\nimport java.util.*;\nimport\
    \ models.*;\nimport play.data.format.Formatters.*;\nimport java.text.ParseException;\n\
    import java.text.SimpleDateFormat;\nimport java.util.Date;\nimport java.util.Locale;\n\
    \npublic class Global extends GlobalSettings {\n    public void onStart(Application\
    \ app) {\n        Formatters.register(Date.class, \n            new SimpleFormatter<Date>()\
    \ {\n                private final static String PATTERN = \"dd-MM-yyyy\";\n\n\
    \                public Date parse(String text, Locale locale) throws java.text.ParseException\
    \ {\n                    if (text == null || text.trim().isEmpty()) {\n      \
    \                  return null;\n                    }\n                    SimpleDateFormat\
    \ sdf = new SimpleDateFormat(PATTERN, locale);\n                    sdf.setLenient(false);\n\
    \                    return sdf.parse(text);\n                }\n\n          \
    \      public String format(Date date, Locale locale) {\n                    if\
    \ (date == null) {\n                        return \"\";\n                   \
    \ }\n                    return new SimpleDateFormat(PATTERN, locale).format(date);\n\
    \                }\n            });\n    }\n}\n\n```\n\nOur Global object is part\
    \ of Play's lifecycle\n\nRegister our new Formatter, extending the SimpleFormatter\
    \ class and specifying that the formatter applies to Date objects\n\nCreate a\
    \ Date object based on our date-format-binding process\n\nCreate a string representation\
    \ of our Date object based on our date-format-unbinding process\n\nThe onStart\
    \ method is called when Play starts our application"
  merge: -1
