  md: '# LESS


    LESS (http://lesscss.org) is a dynamic stylesheet language that is compiled to
    CSS, offering a more powerful and flexible stylesheet language that is compatible
    with any browser. .less file saved in the app/assets directory will be compiled
    into the application''s public folder, which means the result will be available
    as a regular public asset.


    # COFFEESCRIPT


    CoffeeScript (http://coffeescript.org) is a programming language that compiles
    to JavaScript. It''s generally considered a cleaner and more readable language
    than JavaScript, and gaining popularity. .coffee file placed in app/assets will
    be compiled to the application''s public folder, like LESS files.


    # JAVASCRIPT


    If you''re not using CoffeeScript, JavaScript, you might want to use Google''s
    Closure compiler (https://developers.google.com/closure/compiler/; not be confused
    with the programming language "Clojure". The Closure compiler analyzes your JavaScript
    code, tries to make it run faster, and warns you about potential problems. It
    also makes your code smaller (this is called minifying), which will make it download
    and run faster. Like LESS and CoffeeScript, place any .js files you want to compile
    in the app/assets directory, they will be compiled to /public.


    # Setting up an IDE


    Now that we know all the directories and files are for, we''re going to edit some
    of them in a moment, and then implementing our proof-of-concept application. You
    could edit the files with a plain text editor. But if you use a Java IDE such
    as Eclipse or IntelliJ, you''ll find that your source code becomes easier, and
    you more productive. One of the advantages of using a type-safe language like
    Java is that tools like IDEs can do to make coding faster (and therefore more)
    fun. Most IDEs offer features such as autocompletion, automated refactoring, and
    static code analysis. In short, an IDE makes your life easier.


    Play makes it easy to import your applications into most well-known IDEs by including
    commands that will set up a project for you. Play comes with support for Eclipse
    and IntelliJ IDEA. This does not mean you can''t use any IDE you want; it means
    you have to set up the project in your IDE yourself if you use an IDE other than
    Eclipse or IntelliJ IDEA.


    # Eclipse


    Eclipse is one of the most well-known and widely used Java IDEs. It''s open source
    and free to use. Figure 2.2 shows how you set up your application for Eclipse.'
