    ![](img/1f90c92b70e5931c18b6f9f04c8da72e_206_0.png)


    Figure 8.4 A multistatement expression


    AVOID COMPLEX TEMPLATE CODE Although the syntax allows you to, think long and
    hard what you''re doing when you feel to write a multistatement expression. Templates
    are not the place to put complex logic, and anything more than a simple expression
    is pushing it. Consider placing this logic in the model or controller layer, keeping
    the template logic simple and readable.


    There are two cases of the syntax that we haven''t covered yet: escaping and commenting.
    Escaping is simple: the only character you''ll need to escape when you want to
    use it in a template is the @ character. Use @@ instead of:


    My Twitter username is: @target


    To escape some template code, use the following syntax:


    ```

    @* This is a comment. *@

    ```


    This works across lines as well, making it possible to use ScalaDoc (http://docs.scalanglang.org/style/scaladoc.html)
    to document your templates:


    +   * A product listing.

    * @param products The products to list

    *@@


    This covers all of the syntax there is to Scala templates. One way of looking
    at it is that there''s little syntax; escape to Scala mode or plain text. Another
    way of looking at it is that you have the entire Scala language at your disposal.


    Of course, there''s a lot more templates than just this, so let''s look at some
    things that you will do when using Scala templates.


    # 8.3 Your basic building blocks


    Like we promised before, you won''t actually have to learn Scala to write templates.
    But you will need to know how to perform some basic tasks, such as looping, making
    decisions, and importing classes. Let''s start with looping and iteration.


    # 8.3.1 Iterating


    Scala (and, by extension, Scala template syntax) doesn''t have an equivalent of
    Java''s conventional "for" loop. But it does have an equivalent to Java''s "for-each"
    loop, allowing you to iterate over the members of a collection.3 We''ve seen an
    example of this'
