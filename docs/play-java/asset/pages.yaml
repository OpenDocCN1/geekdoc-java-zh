  md: "# Data binding\n\nBecause we're extending the SimpleFormatter class, we have\
    \ to implement two methods: the parse() method and the print() method. The parse()\
    \ method converts a String to a Date (the binding process), whereas the print()\
    \ method converts a Date to a String (the unbinding process). An incoming date\
    \ string, as 11-02-2008, will be converted to a Date object representing that\
    \ date. Similarly, going Date object will be converted to a \"dd-MM-yyyy\"-formatted\
    \ string.\n\nAs you can see, this is straightforward to declare. Every time we\
    \ encounter a Date object, Play knows how to bind a date and send it back as String.\
    \ There are cases when you don't want the format to be global, or when the date\
    \ format is enforced and/or different.\n\nIf we were to add a date to our product,\
    \ the user would have to enter the date as 21-01-2012 in a product details input\
    \ field using the format we defined. Similarly, the date will be 21-01-2012 in\
    \ our model, however, it will be a Date and not a String; the formatter handles\
    \ the conversion between String and Date.\n\nFor example, if you want to have\
    \ multiple date representations? For example, suppose you want to use 11-02/08\
    \ on the main page and 11/02/08 on the login screen. Play allows you to control\
    \ the binding behavior with annotations, including custom annotations. Let's transform\
    \ our date formatter into an annotation-based formatter by creating the following:\n\
    \n+   - An annotation\n- A formatter that extends Play's AnnotationFormatter\n\
    \nLet's start with our annotation:\n\n```\nListing 6.15 The DateFormat annotation,\
    \ /app/utils/DateFormat.java\npackage utils;\n\nimport play.data.Form;\nimport\
    \ play.lang.annotation.*;\n@Target(ElementType.FIELD)\n@Retention(RetentionPolicy.RUNTIME)\n\
    @Form.field(name = \"format.date\", attributes = {\\value\"})\npublic @interface\
    \ DateFormat {\n    String value();\n}\n```\n\nThe annotation is simple and is\
    \ a holder for our date format. The Display annotation defined on the DateFormat\
    \ holds metadata for Play. When a date can't be bound because of an incorrect\
    \ date format, Play uses metadata to display an error message on the form. The\
    \ annotation tells Play to use the format.date message key and that value can\
    \ be used as a parameter for the message."
