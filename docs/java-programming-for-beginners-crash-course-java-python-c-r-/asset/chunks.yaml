  trans: "\n\nNOT 布尔语句的唯一区别在于 `! (user)` 函数。该运算符将使用感叹号置于变量之前。一如既往，对变量进行测试以检查它是否为负值（假）。\n\
    \n由于 user 变量通常被设置为 true，因此会对它们进行测试，以检查是否存在任何 false 值。如果值被设置为 false，情况则完全相反。\n\n\
    # 第七章：分支语句与循环\n\n在编写脚本时，我将使用 `switch` 语句，这样我为所使用的变量设置的值就有更广泛的选择范围。本质上，这些实际上是非常长且有些为复杂的\
    \ `if else if` 语句。\n\n一个 `switch` 语句 get 看起来如下：\n\n```\nSwitch ( variable_to_test_\
    \ {\n    Case value:\n        Code_here;\n        Break;\n    Case value:\n  \
    \      Code_here;\n        Break;\n    Default:\n        Values_not_caught_above;\n\
    }\n```\n\n用于 `switch` 语句的关键字是 `switch`，后面将紧跟一组括号。我想检查的变量需要放在我 `switch` 语句中括号的中间。不仅变量放在括号之间，语句的其他部分也是如此。`case`\
    \ 关键字将检查程序需要审查的所有可能情况。\n\n`Case` 值将使用冒号而不是分号。程序中将发生的事件需要与值正确对应，以便代码能够按照预期方式运行。每当语句中添加一个新\
    \ `case` 时，都会使用 `break` 关键字。\n\n`Default` 值可以使用，但我并不一定需要使用。我可以为语句添加任何想要的值，以便在\
    \ `switch` 语句中进行评估。\n\n## 示例\n\n```\nPublic static void main(String [ ] args)\
    \ {\n    Int user = 87;\n    Switch ( user ) {\n        Case 45:\n           \
    \ System. out. printIn(“ the price is 45 dollars”) ;\n            Break ;\n  \
    \      Case 65:\n            System. out. printIn (“ the price is 65 dollars”)\
    \ ;\n            Break ;\n        Case 88: \n            System. out. printIn\
    \ (“ the price is 88 dollars”) ;\n            Break ;\n        Default:\n    \
    \        System. out. printIn (“ the price is 45, 65, and 88 dollars”) ;\n   \
    \ }\n}\n```\n\n`switch` 语句代码需要测试用户输入的整数。在这个示例中，`case` 值已设置为 `87`，这告诉程序检查其内部的所有内容。每个\
    \ `case` 将被单独检查，以查看是否有与我设置的值匹配。找到匹配的 `case` 后，代码将停止，程序将终止。\n\n超出范围的值即使被放置在 `case`\
    \ 中，也无法通过测试。\n\n## 示例\n\n```\nCase ( user >= 55 ) ;\n```\n\n这个 `case` 无法使用，并将导致\
    \ Java 错误。但我可以使用像这样的 `case`：\n\n`Case 5: Case 6: Case 7: 等.`\n\n使用的每个值都需要列出并进行检查。\n\
    \n# 循环\n\nJava 的流是顺序的，就像书写书籍一样向下移动。但可以使用某些函数来改变流变为不同的内容。为了中断 Java 自然使用的流，我将创建一个\
    \ `loop`。通过 `loop`，程序将连续运行脚本行，直到被要求停止。\n\n## 示例\n\n```\nInt subtraction 100-5-3-4-8-6-2-9\n\
    ```\n\n我并不总是想使用这种方法，但 `loop` 将一直运行直到满足我设置的参数。\n\n## 循环\n\n`for` 循环将使用 `for` 关键字。`for`\
    \ 循环如下：\n\n```\nFor (beginning_value; last_value; increment amount) {\n    //\
    \ code\n}\n```\n\n`while` 循环将使用 `while` 关键字。`while` 循环如下：\n\n```\nWhile (condition)\
    \ {\n    // code\n}\n```\n\n`do while` 循环将使用 `do while` 关键字。`do while` 循环如下：\n\
    \n```\nDo {\n    // code\n} While (condition) ;\n```\n\n"
