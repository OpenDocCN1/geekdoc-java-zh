    # Introduction


    Congratulations on downloading Java and thank you for doing so.


    The following chapters will discuss how Java works and what needs to be known
    so that you can have the best experience when you are working with Java.


    Programming is not going to be easy and it is going to take a lot of time and
    patience, do not be discouraged if it does not work out the first time, it will
    work eventually.


    I am going to tell you that Java is going to benefit you in ways that you may
    not ever realize. Java can help you get a new job or even advance in your job
    that you currently have, so learning Java is going to be good for you on a professional
    and personal level.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    # Chapter one: This is Java


    I have found that the hardest thing to learn about Java is what needs to be installed
    before I can write the code that I want to write. If I do not have all of the
    programs, then I am going to be setting myself up for a headache because I am
    not going to be able to run the program properly.


    ## VM


    Java has a platform that is going to run by itself without the need to have any
    other programs assisting. Therefore, it is going to run off of any operating system
    that I want to work with. This is thanks to the Virtual Machine that the creators
    of Java made.


    The virtual machine is going to aid in making sure that my code is processed correctly.
    Not only that, but it is not going to run Java code without having the virtual
    machine installed.


    Oracle was the company that created Java and on their website, is the download
    links to any Java related programs that need to be downloaded such as Java Virtual
    Machine otherwise known as Java Runtime Environment.


    I first need to check to see if my computer already has Java Runtime Environment
    because there are a lot of computers that come with Java preinstalled. To do this,
    I am going to go to the Oracle website and click on the box that says “Do I have
    Java?” Clicking on this link is going to scan my computer to let me know if I
    have Java or not.


    In the event that I do not have it, I am going to be able to download it and get
    it on my computer so that I can write the code that I want to write.


    ## Software development


    After I have installed Java, it is going to run off my computer just like any
    other program is going to run. However, before I am able to write code, I am going
    to have to download the software development kit.


    The kit is going to be the standard edition and it is going to download the NetBeans
    program. While this download is going to take up a lot of time because it is a
    large file, once it has been downloaded, the code is going to be able to be written
    into the program so that I can create my own Java programs.


    ## innerworkings of Java


    When I am coding for Java, I am going to be using a text editor. My code is going
    to be called Source code and when I am saving my work, I am going to be saving
    it with the extension of `.java`.


    At the point in time that I save my file, I am going to launch `javac` so that
    I can now create my class file. Thanks to NetBeans, I am going to run my program
    using its own software so that I do not have to open multiple windows to enter
    commands and then run them to test my code. I can do everything from one window.


    # Chapter two: NetBeans the Program


    When I first open NetBeans, it is going to show me how to use it. After the program
    has been loaded, I will see the projects that I have created. The IDE is going
    to allow me to see all of the projects I have created. When I select the plus
    sign next to the projects name, I am going to see any and all folders. The folders
    are going to expand as well so that I can see where my code is being stored.


    My code is going to be shown on the right hand side in the text area. Should I
    not see my code, I am going to need to double click on the project to force my
    code to appear so that I can work on it.


    The file name and the class name are going to need to match or Java is not going
    to work with that program the way it is supposed to work. I will ultimately end
    up getting an error when I have to compile my code so that it can run properly.


    ## Java Comments


    Once I have created a new project, I am going to see spots of text that are grayed
    out and are either going to have slashes or asterisks. The gray text is the comments
    that are ignored by the program when the code is run. I can type anything that
    I want into a comment and that comment is not going to be seen by anyone that
    is not working on the code. Most of the time, these comments explain what is going
    on with the code so that it can be worked on by other programmers.


    ### Example


    ```

    //I have created a comment

    // This is where my comment starts

    // and this is where it is going to continue because it is a long comment.

    ```


    ```

    /* I have made a different type of comment here


    While it goes on to another line here


    */

    ```


    I can also use a Javadoc comment to enter comments. These comments are going to
    have a forward slash followed by two asterisks while ending with a single asterisks
    and one slash. However, every line I create is going to need to have an asterisks
    in front of it so that it is deemed a comment.


    Javadoc is going to use comments in the document’s code so that the code is explained
    whenever it is turned into an HTML page that is going to be used by other people.

