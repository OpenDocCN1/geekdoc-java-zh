    \ since I have not written any code, I am not going to see anything in my window.\
    \ NetBeans does generate comments automatically so that I can see an example,\
    \ and I can delete these comments so that I can insert my own.\n\n# Structure\
    \ Java Code\n\nLooking at how the code is going to be structured, the name for\
    \ the package is going to come first when I am looking at my code. This line is\
    \ going to end with a semicolon and if I do not put that semicolon in, then the\
    \ program is not going to be able to be compiled therefore, it is not going to\
    \ run. Listed after the package name is going to be the class name.\n\nThe class\
    \ name is going to be set up like it is a segment of code. I have to indicate\
    \ where the code is going to start and where it ends by using the curly brackets\
    \ `{ }`. Everything that is inside of the brackets is going to be known as a code\
    \ segment that is going to be executed by Java.\n\nAs I am writing my code, I\
    \ need to include the keyword of `main` so that Java is aware of where the code\
    \ should start being executed. It is going to be much like the curly brackets.\
    \ If I happen to forget to put the `main` keyword then the program is going to\
    \ give me an error message.\n\n# Running programs\n\nAny Java program is going\
    \ be run in an output window that is different than the window that I type all\
    \ of my code in. This makes it to where I do not need to have any other windows\
    \ open to run my code. Everything is run inside of NetBeans.\n\nThe easiest way\
    \ that I can run a program in Java is to press `F6`, this is going to automatically\
    \ run the program so that I do not have to accidentally close my program. But,\
    \ in the event that I do not want to do that, I can always go to the start menu\
    \ and select the button that says “run project”.\n\nIf all else fails, I can locate\
    \ a green button on my tool bar that is going to run the program same as any other\
    \ method that I might choose. I am going to need to make sure that the proper\
    \ code is being run though especially if I have been working with multiple coding\
    \ projects. To do this, I can right click on the project that I am wanting to\
    \ be run.\n\n# Chapter three: Manipulating Java Data\n\nJava is just like any\
    \ other programming language that is going to allow me to manipulate the data\
    \ that I input into it while the program stores it on the memory. This data is\
    \ known as text, objects, and even amounts. I have to give any data that I use\
    \ a name, and this data can always be renamed. However, the name and the value\
    \ are going to be Java variables.\n\n## Java amounts\n\nAmounts can be stored\
    \ in the memory of Java by using whole numbers or floating point numbers. Floating\
    \ point numbers are going to be stored with an equals sign while whole numbers\
    \ are stored with the keyword `int`.\n\n### Example\n\n```\npublic static void\
    \ main(String [ ] args) {\n    int last_amount;\n    System.out.println(\"I wrote\
    \ Java code!\");\n}\n```\n\nI am going to need to communicate with the program\
    \ so that I can let it know what integers I want to be saved to the memory of\
    \ Java; to do this I am going to use the `int` keyword and place a space after\
    \ it. I am going to enter what I want this variable to be named as well, but I\
    \ am going to have to follow a set of rules that has been set forth by Java.\n\
    \n1. I cannot use keywords in my variable names. If the word turns blue in my\
    \ code window, then the word is a keyword for Java.\n2. I cannot use spaces. Doing\
    \ this will cause an error code to be returned, but, I can use underscores and\
    \ uppercases to “separate” words like I normally would with a space.\n3. I cannot\
    \ have a number for the first character of a variable name. If I spell the number\
    \ out, then that will work, but using the actual number is not going to work.\n\
    4. Having a name that is completely lowercased is going to be different than having\
    \ one that has two uppercased letters.\n\nWhen I want to put an integer in after\
    \ the variable name, I am going to need to use an equals sign to ensure that the\
    \ variable’s value is stored properly.\n\n### Example\n\n```\npublic static void\
    \ main(String [ ] args) {\n    int some_number;\n    some_number = 55;\n    System.out.println(\"\
    Java code\");\n}\n```\n\nJava is going to store the number 55 to the variable\
    \ `some_number`. If I do not like how this looks, I can put all of the code in\
    \ one line instead.\n\n### Example\n\n```\npublic static void main(String [ ]\
    \ args) {\n    int some_number = 55;\n    System.out.println(\"Java code\");\n\
    }\n```\n\nI will have manipulated the last line of the script so that it will\
    \ fit into one line. When I place information between the parentheses, it is going\
    \ to need to be placed inside of a set of double quotes. The plus sign `+` is\
    \ going to make sure that two halves of the expression that I create are joined\
    \ together so that the name of the variable is concatenated.\n\nAfter all the\
    \ code is typed out the way that I want it to look, I can run it in the output\
    \ window to see how it looks before I put it on a website that is going to be\
