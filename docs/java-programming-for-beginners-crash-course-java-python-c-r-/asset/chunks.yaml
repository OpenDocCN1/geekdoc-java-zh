  trans: "\n\n`scanner` 类的作用是从用户那里获取信息，同时将用户的输入赋值给它所属的变量。\n\n## 选项\n\n当我尝试尝试从程序用户获取所需的信息时，可以通过\
    \ `JOptionPane` 函数获得一个选项列表供我使用。该类将出现在屏幕上，允许用户在显示其输入的内容之前输入适当的响应。\n\n### 示例\n\n\
    ```java\nimport javax.swing.JOptionPane;\n```\n\n这次我将不得不告诉 Java 我想在 `swing` 目录下使用哪个类。由于我不想修改已经写好的代码，我为这个方法创建了一个新项目。当我把代码放进去时，我注意到\
    \ `javax.swing.JOptionPane` 被了下划线，就像是一个错误一样。但并不是错误，它将把数据重定向到需要存储的变量下。\n\n### 示例\n\
    \n```java\nString your_age;\nYour_age = JOptionPane.showInputDialog(\"Your age\"\
    );\n```\n\n`JOptionPane` 允许我输入一个句号，这样我的选项列表就会出现。在这个列表中，我将通过双击来选择 `showInputDialog`。这会在我的代码中放置括号，括号将用于放置我想显示给用户的消息。同样，我也需要使用双引号。\n\
    \n### 示例\n\n```java\nString your_age;\nYour_age = JOptionPane.showInputDialog(\"\
    your age\");\nString your birthday;\nYour birthday = \"You were born on\" + month\
    \ + \"\" day;\nJOptionPane.showMessageDialog(null, birthday);\n```\n\n这是我希望我的对话框再次出现的地方，并带有所有我可以使用的选项。括号中放入了\
    \ `null`，以便 Java 知道这个框与我刚刚创建的程序没有关系。最终产品文本中的标点符号将按照我在 Java 中输入的那样显示。\n\n在我代码的末尾，会有一些我没有手动放进去的新代码。这些代码旨在告诉程序何时退出系统，因为它已经完全执行完毕。即使是这样做，存储在\
    \ Java 内存中的值和变量也将被存储，供下次使用程序时。\n\n每当我的代码正确执行时，都会弹出窗口，向用户索取不同的数据，例如他们的姓名或年龄。当用户点击“确定”按钮后，输入将显示用户在框中输入的内容。这将导致程序退出系统，因为所有需要做的事情都完成了。\n\
    \n## 第六章：控制 Java 的运行\n\n所有使用 Java 编写的代码都是所谓的“顺序编程”。在这种情况下，代码被输入，程序从上到下读取它，不会跳过我输入的任何行。但是，并不是所有的\
    \ Java 程序都是这样运行的。\n\n有些脚本只在设置的条件满足时运行一次。例如，可能我不想让来自特定州的人进入我的网站，因此如果发现此条件为真，则程序将运行；但如果用户来自该州，程序将终止。通过使用条件逻辑，可以控制\
    \ Java 的运行。\n\n最常见的条件语句是 `if` 语句。\n\n### If\n\n使用 `if` 语句，每当条件被触发时，代码就会执行，而无需等待用户执行某些操作。`if`\
    \ 语句将是一个简单的脚本。\n\n```java\nif (expression) {\n\n}\n```\n\n使用之前的示例，如果用户来自纽约，那么我不希望他们进入我的网站。与其输入实现此功能所需的全部代码，我将将缩短脚本，以便我和其他程序员更易阅读。\n\
    \n### 示例\n\n```java\nif(client < New York) {\n    // 此站点受限制\n}\n```\n\n所以，如果我的用户不是来自纽约，那么在程序执行时，会有两组括号被\
    \ Java 跳过。但是，放在它们之间的任何代码都将被执行，但在此发生之前必须满足我设置的条件。\n\n我学到的另一个简写技巧是，大于符号由一个指向右侧三角形表示。\n\
    \n### 示例\n\n```java\nif(client > New York) {\n    // 给用户的消息\n}\n```\n\n即使对于那些不住在纽约的人，代码也是相同的。\n\
    \n### If/else\n\n当 `if` 语句不再足够时，我将使用 `if else` 语句。\n\n```java\nif(我想在程序运行前完成的内容)\
    \ {\n\n}\nelse {\n\n}\n```\n\n这段代码的第一行将以 `if` 语句开头，后面跟着我设置的参数。括号将划分我的代码，使代码根据我的参数执行。第二部分将跟在\
    \ `else` 语句之后。所以，如果没有发生这种情况，就会执行这个。\n\n使用 `if else` 语句与 `if` 语句一样，只是它有第二个表达式，落在新的一组括号之间。如果第一个条件没有满足，代码将被分流并通过第二个表达式运行，以检查它是否满足该条件。如果我漏掉了一个括号，我将收到错误代码。\n\
    \n```java\nif(expression_one) {\n\n}\nelse if (expression_two) {\n\n}\nelse {\n\
    }\n```\n\n在 `if else` 内部可以设置的条件如下：\n- 大于 (`>`)\n- 小于 (`<`)\n- 大于等于 (`>=`)\n- 小于等于\
    \ (`<=`)\n- 与 (`&&`)\n- 或 (`||`)\n- 等于 (`==`)\n- 非 (`!`)\n\n在 AND 条件下，将同时测试多个条件。\n\
    \n### 示例\n\n```java\nelse (user > 45 && user < 55)\n```\n\n### 嵌套的 If\n\n当我将一个表达式放在另一个内部时，我就是在将两者嵌套。这可以通过任何\
    \ `if` 表达式完成。\n\n### 示例\n\n```java\nif(client < 55) {\n    system.out.println(\"\
    55 or less\");\n}\n```\n\n为了查看客户是否大于 45，我将在另一个放在第一个里面。\n\n### 示例\n\n```java\n\
    if(client < 45) {\n    if(client > 48 && client < 45) {\n        System.out.println(\"\
    You are 46 or 47\");\n    }\n    else {\n        System.out.println(\"45 or younger\"\
    );\n    }\n}\n```\n\n## Boolean\n\n布尔值只允许为 true 或 false。如果是其他任何值，它们就不是布尔值。在处理布尔值时不需要使用\
    \ `int`、`string` 或任何其他关键字。相反，只需输入小写的 `boolean`，以确保后面的内容是布尔值。但我必须确保值是 true 或 false。我将使用两个等号\
    \ (`==`) 来评估表达式的值。\n\n### 示例\n\n```java\nboolean client = true;\nif (user == true)\
    \ {\n    System.out.println(\"the expression contains the truth\");\n}\nelse {\n\
    \    System.out.println(\"this expression is false\");\n}\n```\n\n`if` 语句将检查变量以判断它们是否构成真的布尔语句。如果用户输入已经是真的，则将被检查是否为假。不需要说明该值不是假的，因为很容易看出该值实际上是真实的，反之亦然。\n\
    \n非运算符 (`!`) 也会在我创建布尔值时使用。\n\n### 示例\n\n```java\nboolean client = true;\nif (!user)\
    \ {\n    System.out.println(\"there is no truth\");\n}\nelse {\n    System.out.println(\"\
    this is the truth\");\n}\n```\n\n"
- fmt: "\nThe only difference in the NOT Boolean statements is the `! (user)` function.\
    \ The operator is going to be placed before the variable with the use of an exclamation\
    \ mark. As always, the variable is going to have to be tested to see if it is\
    \ negative.\n\nBeing that the user variables are usually set to true, they are\
    \ then tested to see if there are any false values in them. It is exactly the\
    \ opposite if the value is set to false.\n\n# Chapter seven: Switches and Loops\n\
    \nAs I am working on my script, I am going to use `switch` statements so that\
    \ I have a wider range of options for the values that I am going to set for my\
    \ variables that I use. In essence, these are really long and somewhat complicated\
    \ `if else if` statements.\n\nThis is how a `switch` statement is going to look:\n\
    \n```\nSwitch ( variable_to_test_ {\n    Case value:\n        Code_here;\n   \
    \     Break;\n    Case value:\n        Code_here;\n        Break;\n    Default:\n\
    \        Values_not_caught_above;\n}\n```\n\nThe keyword used for `switch` statements\
    \ is going to be `switch` which will then have a set of parentheses following\
