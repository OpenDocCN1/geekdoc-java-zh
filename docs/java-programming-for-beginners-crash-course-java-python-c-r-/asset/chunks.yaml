    Result = fifth_number + tenth_number


    The result is the sum of the fifth number and the tenth number. The sum is not
    going to be assigned until after Java has successfully done the math for this
    equation.


    Example


    Answer = 90+66


    Since there are two variables, Java understands this and the name for these variables
    does not have to be used. Doing this is going to change how the code that I created
    looks.


    Example


