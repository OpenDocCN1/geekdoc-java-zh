  trans: "\n\n我无法确定数组中的具体值，但我可以使用 `ArrayList`，这样我就可以查看数据的结构。我列表中的项可以添加或删除。但是，普通数组的数据是不会移动的，因为对于我创建的内容，我没有能力更改数组的大小。\n\
    \n当我设置一个数组列表时，我将不得不从 Java 的包中提取数据。\n\n### 语法\n\n```java\nimport java.util.ArrayList;\n\
    ```\n\n在我引入了创建新对象所需的数据后，我将使用不同的语法。\n\n```java\nArrayList listTest = new ArrayList(\
    \ );\n```\n\n在为数组创建列表时，我不会使用括号。\n\n### 示例\n\n```java\nlistTest.add( \"and\" );\n\
    listTest.add( \"for” );\nlistTest.add( “but \" );\nlistTest.add( 8 );\n```\n\n\
    括号中的任何内容都将被放在我的数组列表中。通过这种方法，我可以添加任何想要的对象。出现在列表中的前三个项是通常添加到字符串中的对象。最后一个项是一个整数。\n\
    \n我列表中的所有项都可以通过它们的索引值找到。\n\n### 示例\n\n```java\nlistTest.get(5); \n```\n\n数字五准确地告诉我需要去哪里找到我正在找的东西。索引值总是像\
    \ Java 中使用的其他东西一样从零开始。考虑到这一点，对于上面的示例，将查看第六位置。\n\n当我想要删除对象时，我将使用不同的语法。\n\n### 示例\n\
    \n```java\nlistTest.remove(5);\n```\n\n我也可以删除数组上的字符串值。\n\n```java\nlistTest.remove(“but”);\n\
    ```\n\n在删除项时，列表会自动调整大小。正如此，我在删除对象时必须非常小心，否则我的列表索引将会发生巨大变化，我将不知道列表中的任何位置。所以，如果我删除了列表中的第二个项，那么在删除之后，后面的三个项将在列表中向上移动。\n\
    \n### 结论\n\n感谢你读到 Java 的最后，希望它能为你提供启发，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\n下一步是下载\
    \ NetBeans，并根据我提供的信息开始创建自己的 Java 程序。有些内容可能看起来很困惑，但练习得越多，就会变得越容易。\n\n如果你发现这本书的任何部分让你困惑，请回去重读一遍。正如我在引言中所说的，编程并不容易，它不会在一夜之间让你学会。\n\
    \n不要因为你使用的某段代码不起作用就停止学习 Java。如果你这样做，你就永远不会知道自己哪里搞错了。相反，采取那个错误并从中学习，这样你就不必重复同样的错误了。\n\
    \n最后，如果你觉得这本书在任何方面都有用，非常感谢你在 Amazon 上的评价！\n\n祝你好运！\n\n# 加入成千上万创建了自己语言的编码者行列。\n\
    \n![`createyourproglang.com/images/real_book.png`](http://1.macoaff.pay.clickbank.net/)\n\
    \n## “获得一个涵盖了 JavaScript 95% 功能的语言非常有趣，而且工作量少得惊。”\n\n— [Jeremy Ashkenas](http://ashkenas.com/)，在阅读这本书后创建了\
    \ [CoffeeScript](http://coffeescript.org/)。\n\n## “我喜欢这本书！它帮助我创建了自己的 Awesome-to-PHP\
    \ 编译器。虽然它还不是一个全功能的编译器，但我编写它时非常有趣，并且学到了很多。”\n\n— [Julien Desrosiers](http://twitter.com/jdesrosiers)，在阅读这本书后创建了\
    \ [Phlower](http://github.com/juliend2/phlower)。\n\n## “我在大学期间没有机会学习语言内部原理，虽然我很感兴趣，但我发现它们的运行机制令人生畏。通过这门课程，我发现了一个关于词法器、解析器、解释器和编译器世界的简单但引人入胜的介绍，编程的一个全新世界向我打开了。强烈推荐。”\n\
    \n— [David Bolton](http://davidbolton.net/)\n\n***\n\n### 使用此系统创建的一些语言 ...\n\n\
