  raw: 'The only difference in the NOT Boolean statements is the (!user) function.
    The operator is going to be placed before the variable with the use of an exclamation
    mark. As always, the variable is going to have to be tested to see if it is negative.


    Being that the user variables are usually set to true, they are then tested to
    see if there are any false values in them. It is exactly the opposite if the value
    is set to false.


    Chapter seven: Switches and Loops


    As I am working on my script, I am going to use switch statements so that I have
    a wider range of options for the values that I am going to set for my variables
    that I use. In essence, these are really long and somewhat complicated if else
    if statements.


    This is how a switch statement is going to look:


    Switch ( variable_to_test_ {


    Case value:


    Code_here;


    Break;


    Case value:


    Code_here;


    Break;


    Default:


    Values_not_caught_above;


    }


    The keyword used for switch statements is going to be switch which will then have
    a set of parentheses following it. The variables that I want to check will need
    to go in the middle of the brackets that I have placed in my switch statement.
    Not only will the variables be placed between the brackets, but so will other
    parts of the statements. The case keywords are going to review all the powers
    that have to be reviewed by the program.


    Case values are going to use colons instead of semicolons. The events that are
    going to occur with the program are going to need to correspond with the value
    correctly so that the code is run the way that it should be. The break keyword
    is going to be used whenever there is a new case that has been added to the statement.


    Default values are going to be used but they do not have to be used by me. I can
    add any value that I want to for the statement to be evaluated in my switch statement.


    Example


    Public static void main(String [ ] args) {


    Int user = 87;


    Switch ( user ) {


    Case 45:


    System. out. printIn(“ the price is 45 dollars”) ;


    Break ;


    Case 65:


    System. out. printIn (“ the price is 65 dollars”) ;


    Break ;


    Case 88: 


    System. out. printIn (“ the price is 88 dollars”) ;


    Break ;


    Default:


    System. out. printIn (“ the price is 45, 65, and 88 dollars”) ;


    }


    }


    The switch statement code is going to need to test the integers that are being
    entered by the user. The codes value has been set to 87 in this example which
    tells the program to check everything that is inside of it. Each case will be
    checked individually to see if there is one that matches the value that was set
    by me. After the case that matches has been found, the code will stop and the
    program will be terminated.


    The values that are out of range cannot be tested even though they have been placed
    in the case.


    Example


    Case ( user >= 55 ) ;


    This case cannot be used and will result in an error from Java.


    But, I can use a case such as this:


    Case 5: Case 6: Case 7: etc.


    Each value that is used will need to be spelled out and checked.


    Loops


    The flow in Java is sequential and moves down the page just like a book is written.
    But, there are functions that can be used so that the flow is changed to something
    different. In order to interrupt the flow that Java naturally uses, I am going
    to create a loop. With a loop, the program is going to continuously run the lines
    of script until it is told to stop.


    Example


    Int subtraction 100-5-3-4-8-6-2-9


    I am not always going to want to use this method but the loop will keep going
    until the parameter that I have set up has been met. Once that condition has been
    met successfully, then the loop will be terminated and the next chunk of code
    is going to be evaluated.


    Loops that use for


    The loops that are going to use the keyword for are going to be one of the most
    commonly used loops when I am working with Java. this loop is going to set how
    many times the code has to be repeated before it is terminated.


    For loops are going to look a little something like this:


    For ( beginning_value; last_value ; increment_amount) {


    //I am going to enter my code into this section here


    }


    The parentheses are going to contain three different values that are going to
    determine the entire loop. The beginning value is where the loop is going to start,
    the last value is going to be the value that the loop needs to reach, and the
    increment amount is going to determine how many times the loop is going to go
    around. The increment amount is going to be defaulted to a value of one, but it
    does not have to be, I can make it whatever integer that I see fit.


    The brackets that come next in the expression are going to be the code that is
    sectioned off so that it can be repeated.


    Example


    Boxed  loops ;


    Public class ForLoops {


    Public static void main (String [ ] args) {


    Int loopVal;


    Int last_value = 100;


    For (loopVal = 5; loopVal < last_value; loopVal++) {


    System. out. printIn ( “Loop Value = “ + loopVal) ;


    }


    }


    }


    The value that the integer is set to is going to be called a loopVal and this
    is going to be where the integer for the variable is placed. This variable is
    the one that will be used up until the loop is terminated.


    Java has to be told where the loop is going to start and where it is going to
    end. loopVal  is going to be a smaller value than the one that is used for the
    last value. When the word for is used, the value will need to be an amount that
    is smaller than the variable that has been placed at the end of the loop.


    loopVal++ will result in letting me know what integer is being used each time
    the amount I am going to go up each time the loop is repeated.


    Loops for while


    A loop that uses while statements are going to be easier to understand, but they
    are not used as often.


    While loops look similar to for loops.


    While ( condition) {


    }


    While will be lower cased and my parameter is going to be in parentheses.


    Example


    Int loopVal = 8;


    While (loopVal < 33) {


    System.out.printIn (“my text”);


    loopVal++ ;


    }


    The conditions that I set forth are going to be less than adequate while the code
    placed in the brackets will be displayed.  Some loops can be on repeat for all
    eternity since they do not have any value assigned to them.


    To eliminate the loopVal, I have to reach the end of my condition. While loops
    are going to count values instead of checking them. the code will keep going until
    a button has been pressed on the users keyboard.


    Do while


    Do while loops look different than for and while loops.


    Int loopVal = 6;


    Do {


    System. out. printIn( text”) ;


    loopVal++;


    }


    While ( loopVal < 2 ) ;


    Loops are going to go up until the condition is satisfied. The distinction between
    while loops and do while loops is that the script I enter is going to be inside
    of two brackets. This code will be examined from top to bottom until the condition
    has been met.


    Loop is going to be terminated and the code will not be executed if Java decides
    to not run it. As I wait for the program to test my script, I am going to need
    to use a while loop before I can use a do loop. The value will change for the
    variable that I have set forth in order for the code to run. The text is not going
    to be displayed as it was with the other loops.


    Chapter eight: Arrays


    The arrays that Java uses can hold multiple values at the same time. It is easier
    for me to think of an array like a list that has been placed on a spread sheet.
    I am going to be able to create as many columns in the array as I want to.


    Example


    0 – 55


    1 – 654


    2 – 566


    3 – 552


    4 – 6


    5 – 852


    Every row is going to be assigned a position just as if I had created it on a
    spread sheet. The positions are going to always start at zero and go up by one
    each time that an integer is added.


    As I set up my arrays, I am going to give Java the knowledge of the data that
    I am placing in the array. I am going to have to tell Java how many positions
    I am using so that it knows where it should stop.


    Syntax for arrays:


    int [ ] aryNums;'
