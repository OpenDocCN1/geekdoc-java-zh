    line. When I place information between the parentheses, it is going to need to
    be placed inside of a set of double quotes. The plus sign is going to make sure
    that two halves of the expression that I create are joined together so that the
    name of the variable is concatenated.


    After all the code is typed out the way that I want it to look, I can run it in
    the output window to see how it looks before I put it on a website that is going
    to be used by other people.


    The integer is going to be some_number in this example.


    Two integers can be added together so that only one amount is stored as the result
