    aryAmounts[0][1] = 124;


    aryAmounts[0][2] = 433;


    aryAmounts[0][3] = 11554;


    aryAmounts[0][4] = 262;


    First the row is going to start with zero just like any other array, while the
    columns are going to be different for each array because each array is going to
    require a different number of columns.


    Example


    The second row for my array will be


    aryAmounts[1][0] = 2560;


    aryAmounts[1][1] = 43255;


    aryAmounts[1][2] = 560;


    aryAmounts[1][3] = 133;


    aryAmounts[1][4] = 3385;


    The positions in my loop is going to depend on the values I use. The first example
    uses the I variable while the second uses the same variable. Both are going to
    start at zero.


