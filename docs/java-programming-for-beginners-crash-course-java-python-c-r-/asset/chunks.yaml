    They will range from zero all the way to fifty-five.


    As I go to assign values to the positions, then I am going to use the normal methods
    that I have used previously.


    aryNum [ 8 ] = 32 ;


    The amount of 32 is going to be assigned to the space of 8 in the array. 


    I have to remember that arrays have to start at zero.


    Example


    Setting up my arrays like this is going to make it easier for me to deal with.


    Int [ ] aryNims = { 8, 5, 6, 2 } ;


    This method has created my array inside of the brackets where the first value
    is placed at zero. The square brackets that come after my keyword are going to
    make sure that the data type is not repeated elsewhere. This method is going to
    also be used with string values and chars when I want to use new keywords.


    Example


    String [ ] aryStrings = { “ Vampires, Werewolves, Hybrids, Witches” } ;


    This will work with Java


    Boolean [ ] aryBools = { yes, no, no, yes  } ;


    This will not work.


    If I want to use Boolean values I have to use a new keyword all together.


    Example


    Boolean [ ]  aryBools = new Boolean [ ]  { yes, no, no, yes   } ;


    Arrays for loops


    Arrays use special rules for their loops. The values in an array will be assigned
    using the array syntax. This does not make sense to me, but this is how values
    will be assigned,


    Example


    Package prjarrays ;


    Public class ArrayTest {


    Public static void main (String [ ]  args) {


    Int [ ]  ticket _ prices = new int [ 65 ] ;


    Int I ;


    For ( I = 0; I < ticket_prices . length ; i++) {


    Ticket_prices [ I ] = I +1;


    System. out. printIn ( ticket_prices [ 6 ] ) ;


    }


    }


    }


    The array above will contain 65 integers. The loop is going to go until this number
    has been reached and the I is going to be a value that is smaller than the arrays
    size.


    To appoint values to the positions that I want them to be in, I am going to use
    a different code.


    Example


    Ticket_prices [ I ] I + 1 ;


    The values that I use are not going to be hard coded when they are placed between
    the brackets, instead every variable is going to increase by one digit each time
    that the loop is repeated. The array is also going to increase with the loops
    value. This value is going to be assigned thanks to the last bit of the script
    that is entered. The loop is going to start at zero always and go up through the
    number 65 for this example.


    The next bit of script will be the value for the positions in the array. In the
    event that I want to type out all my code, it is going to end up jumbled because
    of the amounts found in the array.


    Sorting


    The arrays I make can be sorted out by using the sorting method. I will however
    have to reference what I am sorting to a directory in Java. The import statement
    will be used for this.


    Import java. util. Arrays ;


    Example


    Package prjarrays;


    Import java . util. Arrays ;


    Public class ArraysTest {


    Public static void main ( String [ ]  args) {


    Int [ ]  aryNums;


    aryNums = new int [ 9 ] ;


    aryNums [ 0 ] = 65 ;


    aryNums [ 1 ] = 54;


    aryNums [ 2 ] = 689 ;


    aryNums [ 3 ] = 654;


    aryNums [ 4 ] = 6543 ;


    aryNums [ 5 ] = 55 ;


    The libraries for an array are going to be imported along with the sort method.
    Arrays . sort( aryNums ) ;


    The keyword that falls first in the importing is array after that I am going to
    insert a dot. That dot is going to open up a box that is going to give me a list
    of everything that I can do with that array. The sort word is going to say where
    the name of the array is placed and then the brackets are going to fall after
    that.


    Example


    Package prjarrays;


    Import java . util. Arrays ;


    Public class ArraysTest {


    Public static void main ( String [ ]  args) {


    Int [ ]  aryNums;


    aryNums = new int [ 9 ] ;


    aryNums [ 0 ] = 202 ;


    aryNums [ 1 ] = 1696 ;


    aryNums [ 2 ] = 385 ;


    aryNums [ 3 ] = 2956 ;


    aryNums [ 4 ] = 4554 ;


    aryNums [ 5 ] = 126 ;


    Arrays . sort (aryNums) ;


    Int I;


    For ( I = 0 ; I < aryNums . length ; i++) {


    System. out. printIn (“num: “ + aryNums [ I ] ) ;


    }


    }


    }


    Sorting is going to arrange things in a descending order when I write out my own
    code for sorting. I can also convert an array into objects that are used for integers
    that have also been imported from a directory.


    Example


    Package prjarrays;


    Import java . util. Arrays ;


    Import java.util. collections ;


    Public class SortDescending {


    Public class ArraysTest {


    Public static void main ( String [ ]  args) {


    Int [ ]  aryNums;


    aryNums = new int [ 99 ] ;


    aryNums [ 0 ] = 65 ;  aryNums [ 1 ] = 2415 ; aryNums [ 2 ] =  ;645


    aryNums [ 3 ] = 263 ; aryNums [ 4 ] = 4005 ; aryNums [ 5 ] = 12245 ;


    Arrays . sort (aryNums) ;


    Int I;


    For ( I = 0 ; I < aryNums . length ; i++) {


    System. out. printIn (“num: “ + aryNums [ I ] ) ;


    }


    }


    }


    Array strings


    Strings for integers can be placed in arrays as well.


    Example


    String [ ]  aryString= new String [ 6 ] ;


    aryString [ 0 ] = “i” ;


    aryString [ 1 ] = “am” ;


    aryString [ 2 ] = “using” ;


    aryString [ 3 ] = “java” ;


    aryString [ 4 ] = “yay” ;


    In this example, there are six positions needing filled with data. In this loop
    however, the positions will be displayed on the screen.


    Syntax


    Int I ;


    For ( I = 0 ; I < aryString . length ; i++ ) {


    System. out. printIn ( aryString [ I ] ) ;


    }


    A loop is going to continue up till a value of lesser amount is found than what
    the range calls for.


    I can also sort arrays alphabetically. Java uses Unicode for the letters that
    are entered into the system. Letters that are capitalized are going to come before
    those that are not.


    Example


    Package strings1 ;


    Import java. util. Arrays ;


    Public class StringArrays {


    Public static void main(String [ ]  args) {


    String [ ]  aryString= new String [ 5 ] ;


    aryString [ 0 ] = “I ” ;


    aryString [ 1 ] = “have” ;


    aryString [ 2 ] = “made” ;


    aryString [ 3 ] = “an” ;


    aryString [ 4 ] = “array” ;


    arrays. Sort ( aryString ) ;


    int I ;


    for ( I = 0; I < aryString . length ; i++) {


    system. out. printIn ( aryString [ I ] ) ;


    }


    }


    }


    Multi dimensional


    The arrays that I have created can be put into multiple columns that are going
    to be known as multi-dimensional arrays.


    Example


    60 – 1550 – 1285 -436 – 151 - 252


    41 – 2035 – 4325 -5326 – 1231 - 2333


    23 – 3240 – 6357 – 3225 – 1425 – 44352


    335 – 40352 – 12321 – 8237 – 135214 - 53545


    4654 – 50232 – 8699 – 6625 – 103 – 6656


    5354- 62350 – 653 – 644 – 1632 – 161


    Arrays that are multi dimensional are arranged in a certain fashion that is going
    to tell Java that it is a multi dimensional array over a regular array.


    Syntax


    Int [ ] [ ] aryAmounts = new int [ 8 ] [ 33 ] ;


    The array syntax is like normal, but there are now two brackets that allow Java
    to know how many rows there are and how many columns will be made.


    Example


