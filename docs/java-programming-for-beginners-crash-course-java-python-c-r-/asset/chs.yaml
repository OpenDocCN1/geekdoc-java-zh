  \ = new Boolean [ ] { yes, no, no, yes } ;\n```\n\n### 数组循环\n\n数组的循环有其特殊的规则。数组中的值将使用数组语法进行赋值。这对我来说似乎并不理解，但这就是值赋值的方式。\n\
