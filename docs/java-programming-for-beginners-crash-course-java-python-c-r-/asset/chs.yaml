  \ – fifteenth_value +twohundredith_value;\n```\n该表达式将按照输入 `Java` 的顺序进行求值。发生的情况是，从\
  \ `5` 中减去 `654` 得到结果 `-649`，然后加上 `54`，得到总和 `-595`。\n\n当我想让表达式中的某个部分优先时，我会在它周围加上括号。在运算顺序上，乘法和除法总是先执行。\n\
