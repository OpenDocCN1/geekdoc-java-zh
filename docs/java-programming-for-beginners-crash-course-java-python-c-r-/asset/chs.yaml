  \            Ticket_prices [ I ] = I +1;\n            System. out. printIn ( ticket_prices\
  \ [ 6 ] ;\n        }\n    }\n}\n```\n\n上面的数组将包含 65 个整数。循环将持续到达到这个数字为止，并且 `I` 将是一个小于数组大小的值。为了给我想要的位置分配值，我将使用不同的代码。\n\
  \n### 示例\n\n```\nTicket_prices [ I ] = I + 1 ;\n```\n\n当我将值放在括号之间时，我使用的值并不是硬编码的，相反，每重复一次循环，每个变量都会增加一个数字。数组也会随着循环的值而增加。这个值将得益于输入的最后一段脚本而被赋值。循环总是从\
  \ 0 开始，并在这个示例中一直增加到 65。下一部分脚本将是数组中位置的值。如果我想写出所有的代码，由于数组中找到的数值，它最终会变得混乱。\n\n### 排序\n\
