  \n# 第六章：控制 Java 的运行\n\n所有使用 Java 编写的代码都是所谓的“顺序编程”。在这种情况下，代码被输入，程序从上到下读取它，不会跳过我输入的任何行。但是，并不是所有的\
  \ Java 程序都是这样运行的。\n\n有些脚本只在设置的条件满足时运行一次。例如，可能我不想让来自特定州的人进入我的网站，因此如果发现此条件为真，则程序将运行；但如果用户来自该州，程序将终止。通过使用条件逻辑，可以控制\
  \ Java 的运行。\n\n最常见的条件语句是 `if` 语句。\n\n### If\n\n使用 `if` 语句，每当条件被触发时，代码就会执行，而无需等待用户执行某些操作。`if`\
  \ 语句将是一个简单的脚本。\n\n```java\nif (expression) {\n\n}\n```\n\n使用之前的示例，如果用户来自纽约，那么我不希望他们进入我的网站。与其输入实现此功能所需的全部代码，我将将缩短脚本，以便我和其他程序员更易阅读。\n\
  \n### 示例\n\n```java\nif(client < New York) {\n    // 此站点受限制\n}\n```\n\n所以，如果我的用户不是来自纽约，那么在程序执行时，会有两组括号被\
  \ Java 跳过。但是，放在它们之间的任何代码都将被执行，但在此发生之前必须满足我设置的条件。\n\n我学到的另一个简写技巧是，大于符号由一个指向右侧三角形表示。\n\
  \n### 示例\n\n```java\nif(client > New York) {\n    // 给用户的消息\n}\n```\n\n即使对于那些不住在纽约的人，代码也是相同的。\n\
  \n### If/else\n\n当 `if` 语句不再足够时，我将使用 `if else` 语句。\n\n```java\nif(我想在程序运行前完成的内容)\
  \ {\n\n}\nelse {\n\n}\n```\n\n这段代码的第一行将以 `if` 语句开头，后面跟着我设置的参数。括号将划分我的代码，使代码根据我的参数执行。第二部分将跟在\
  \ `else` 语句之后。所以，如果没有发生这种情况，就会执行这个。\n\n使用 `if else` 语句与 `if` 语句一样，只是它有第二个表达式，落在新的一组括号之间。如果第一个条件没有满足，代码将被分流并通过第二个表达式运行，以检查它是否满足该条件。如果我漏掉了一个括号，我将收到错误代码。\n\
  \n```java\nif(expression_one) {\n\n}\nelse if (expression_two) {\n\n}\nelse {\n\
  }\n```\n\n在 `if else` 内部可以设置的条件如下：\n- 大于 (`>`)\n- 小于 (`<`)\n- 大于等于 (`>=`)\n- 小于等于\
  \ (`<=`)\n- 与 (`&&`)\n- 或 (`||`)\n- 等于 (`==`)\n- 非 (`!`)\n\n在 AND 条件下，将同时测试多个条件。\n\
  \n### 示例\n\n```java\nelse (user > 45 && user < 55)\n```\n\n### 嵌套的 If\n\n当我将一个表达式放在另一个内部时，我就是在将两者嵌套。这可以通过任何\
  \ `if` 表达式完成。\n\n### 示例\n\n```java\nif(client < 55) {\n    system.out.println(\"\
  55 or less\");\n}\n```\n\n为了查看客户是否大于 45，我将在另一个放在第一个里面。\n\n### 示例\n\n```java\nif(client\
  \ < 45) {\n    if(client > 48 && client < 45) {\n        System.out.println(\"You\
  \ are 46 or 47\");\n    }\n    else {\n        System.out.println(\"45 or younger\"\
  );\n    }\n}\n```\n\n## Boolean\n\n布尔值只允许为 true 或 false。如果是其他任何值，它们就不是布尔值。在处理布尔值时不需要使用\
  \ `int`、`string` 或任何其他关键字。相反，只需输入小写的 `boolean`，以确保后面的内容是布尔值。但我必须确保值是 true 或 false。我将使用两个等号\
  \ (`==`) 来评估表达式的值。\n\n### 示例\n\n```java\nboolean client = true;\nif (user == true)\
  \ {\n    System.out.println(\"the expression contains the truth\");\n}\nelse {\n\
  \    System.out.println(\"this expression is false\");\n}\n```\n\n`if` 语句将检查变量以判断它们是否构成真的布尔语句。如果用户输入已经是真的，则将被检查是否为假。不需要说明该值不是假的，因为很容易看出该值实际上是真实的，反之亦然。\n\
  \n非运算符 (`!`) 也会在我创建布尔值时使用。\n\n### 示例\n\n```java\nboolean client = true;\nif (!user)\
  \ {\n    System.out.println(\"there is no truth\");\n}\nelse {\n    System.out.println(\"\
  this is the truth\");\n}\n```\n\n\n\n\n\nNOT 布尔语句的唯一区别在于 `! (user)` 函数。该运算符将使用感叹号置于变量之前。一如既往，对变量进行测试以检查它是否为负值（假）。\n\
  \n由于 user 变量通常被设置为 true，因此会对它们进行测试，以检查是否存在任何 false 值。如果值被设置为 false，情况则完全相反。\n\n\
  # 第七章：分支语句与循环\n\n在编写脚本时，我将使用 `switch` 语句，这样我为所使用的变量设置的值就有更广泛的选择范围。本质上，这些实际上是非常长且有些为复杂的\
  \ `if else if` 语句。\n\n一个 `switch` 语句 get 看起来如下：\n\n```\nSwitch ( variable_to_test_\
  \ {\n    Case value:\n        Code_here;\n        Break;\n    Case value:\n    \
  \    Code_here;\n        Break;\n    Default:\n        Values_not_caught_above;\n\
  }\n```\n\n用于 `switch` 语句的关键字是 `switch`，后面将紧跟一组括号。我想检查的变量需要放在我 `switch` 语句中括号的中间。不仅变量放在括号之间，语句的其他部分也是如此。`case`\
  \ 关键字将检查程序需要审查的所有可能情况。\n\n`Case` 值将使用冒号而不是分号。程序中将发生的事件需要与值正确对应，以便代码能够按照预期方式运行。每当语句中添加一个新\
  \ `case` 时，都会使用 `break` 关键字。\n\n`Default` 值可以使用，但我并不一定需要使用。我可以为语句添加任何想要的值，以便在 `switch`\
  \ 语句中进行评估。\n\n### 示例\n\n```\nPublic static void main(String [ ] args) {\n    Int\
  \ user = 87;\n    Switch ( user ) {\n        Case 45:\n            System. out.\
  \ printIn(“ the price is 45 dollars”) ;\n            Break ;\n        Case 65:\n\
  \            System. out. printIn (“ the price is 65 dollars”) ;\n            Break\
  \ ;\n        Case 88: \n            System. out. printIn (“ the price is 88 dollars”)\
  \ ;\n            Break ;\n        Default:\n            System. out. printIn (“\
  \ the price is 45, 65, and 88 dollars”) ;\n    }\n}\n```\n\n`switch` 语句代码需要测试用户输入的整数。在这个示例中，`case`\
  \ 值已设置为 `87`，这告诉程序检查其内部的所有内容。每个 `case` 将被单独检查，以查看是否有与我设置的值匹配。找到匹配的 `case` 后，代码将停止，程序将终止。\n\
  \n超出范围的值即使被放置在 `case` 中，也无法通过测试。\n\n### 示例\n\n```\nCase ( user >= 55 ) ;\n```\n\n\
  这个 `case` 无法使用，并将导致 Java 错误。但我可以使用像这样的 `case`：\n\n`Case 5: Case 6: Case 7: 等.`\n\
  \n使用的每个值都需要列出并进行检查。\n\n## 循环\n\nJava 的流是顺序的，就像书写书籍一样向下移动。但可以使用某些函数来改变流变为不同的内容。为了中断\
  \ Java 自然使用的流，我将创建一个 `loop`。通过 `loop`，程序将连续运行脚本行，直到被要求停止。\n\n### 示例\n\n```\nInt\
  \ subtraction 100-5-3-4-8-6-2-9\n```\n\n我并不总是想使用这种方法，但 `loop` 将一直运行直到满足我设置的参数。\n\
  \n## 循环\n\n`for` 循环将使用 `for` 关键字。`for` 循环如下：\n\n```\nFor (beginning_value; last_value;\
  \ increment amount) {\n    // code\n}\n```\n\n`while` 循环将使用 `while` 关键字。`while`\
  \ 循环如下：\n\n```\nWhile (condition) {\n    // code\n}\n```\n\n`do while` 循环将使用 `do\
  \ while` 关键字。`do while` 循环如下：\n\n```\nDo {\n    // code\n} While (condition) ;\n\
  ```\n\n\n\n\n\n在我正式选择了将使用的数据类型后，普通整数将被放在括号中。括号让 Java 知道正在使用的是数组而不是任何其他数据类型。数组使用\
  \ `aryNums` 函数，以确保数组被正确设置。之后，任何我想要放入数组的变量都可以被放在其中。\n\n一旦我为数组设置了一个新对象，Java 就会知道我为数组使用了多少个空间。\n\
  \n### 示例\n\n```\naryNums = new int [ 55 ];\n```\n\n这告诉 Java 在数组中将使用 55 个空间用于整数。它们的范围从\
  \ 0 直到 55。\n\n当我开始为这些位置赋值时，我将使用我之前用过的普通方法。\n\n```\naryNum [ 8 ] = 32 ;\n```\n\n\
  数值 32 将赋值给数组中索引为 8 的空间。我必须记住，数组必须从 0 开始。\n\n### 示例\n\n这样设置我的数组将使我处理起来更加方便。\n\n```\n\
  Int [ ] aryNims = { 8, 5, 6, 2 } ;\n```\n\n这种方法在括号内创建了我的数组，第一个值被放置在 0 处。关键字后面的方括号将确保数据类型不会在其他地方重复。当我想使用新关键字时，这种方法也将用于字符串值和字符。\n\
  \n### 示例\n\n```\nString [ ] aryStrings = { “ Vampires, Werewolves, Hybrids, Witches”\
  \ } ;\n```\n\n这在 Java 中是可以运行的。\n\n```\nBoolean [ ] aryBools = { yes, no, no, yes\
