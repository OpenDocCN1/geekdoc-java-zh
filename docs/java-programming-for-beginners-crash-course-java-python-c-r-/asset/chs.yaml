  \n- 加法 – 加号 `+`\n- 减法 – 负号\n- 乘法 – 星号 `*`\n- 除法 – 正斜杠 `/`\n\n### 运算符优先级\n无论我在 `Java`\
  \ 中进行什么样的数学运算时，我都必须确保将每个值都放在正确的位置，这样我就知道正在执行什么，以及执行的顺序是什么。\n\n### 示例\n```\nTenth_value=\
