  \n[点击获取！](http://1071173znfarcld6m3q4q25z32.hop.clickbank.net/)\n\n# 引言\n\n恭喜你下载了\
  \ Java，感谢你的支持。\n\n后续章节将讨论 Java 的工作原理以及需要了解的知识，以便你在使用 Java 时获得最佳体验。\n\n编程并非易事，需要花费大量的时间和耐心。如果第一次尝试没有成功，请不要气馁，它最终会成功的。\n\
  \n我想告诉你，Java 将以你可能无法意识到的方式对你有益。Java 可以帮助你找到新工作，甚至在你目前的工作中晋升，因此学习 Java 对你的职业和个人层面都是大有益的。\n\
  \n市场上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽全力确保它包含尽可能有用的信息，请尽情享受！\n\n# 第一章：什么是 Java\n\n我发现学习\
  \ Java 最难的部分是在编写我想要写的代码之前需要安装哪些内容。如果我没有所有的程序，那么我就是在给自己找麻烦，因为我将无法正常运行程序。\n\n## 虚拟机\
  \ (VM)\n\nJava 有一个可以独立运行的平台，不需要其他程序的辅助。因此，它可以在我想使用的任何操作系统上运行。这归功于 Java 创建者开发的虚拟机。\n\
  \n虚拟机有助于确保我的代码被正确处理。不仅如此，如果没有安装虚拟机，Java 代码将运行。\n\nOracle 是创建 Java 的公司，在他们的网站上提供了任何\
  \ Java 相关程序的下载链接，例如 Java 虚拟机，称为 Java 运行环境（JRE）。\n\n我首先需要检查电脑是否已经安装了 Java 运行环境，因为很多电脑都预装了\
  \ Java。为了做到，我将访问 Oracle 网站并点击写有“我有 Java 吗？”的框。点击此链接将扫描我的电脑并告诉我是否安装了 Java。\n\n如果我没有，我就可以下载并安装到电脑上，这样我就可以编写想要代码了。\n\
  \n## 软件开发\n\n安装 Java 后，它将像任何其他程序一样在我的电脑上运行。然而，在我编写代码之前，我必须下载开发工具包（SDK）。\n\n该工具包将是标准版，并将下载\
  \ NetBeans 程序。虽然由于文件较大，下载将花费很多时间，但一旦下载完成，代码就可以写入程序中，以便我创建自己的 Java 程序。\n\n## Java\
  \ 的内部原理\n\n当我为 Java 代码时，我将使用文本编辑器。我的代码被称为源代码（Source code），当我保存工作时，我会使用 `.java` 后缀进行保存。\n\
  \n保存文件的同时，我将启动 `javac`，这样我就可以创建类文件了。感谢 NetBeans，我将使用它自己的软件运行程序，而无需打开多个窗口来输入命令并运行它们来测试我的代码。我可以在一个窗口内完成所有操作。\n\
  \n# 第二章：NetBeans 程序\n\n当我第一次打开 NetBeans 时，它会向我展示如何使用。程序加载后，我将看到创建的项目。集成开发环境（IDE）允许我查看创建的项目。当我选择项目名称旁的加号时，我将看到所有文件夹。文件夹也会展开，以便我看到代码存储的位置。\n\
  \n我的代码将显示在右侧的文本区域。如果我没有看到代码，我需要双击项目来强制代码出现，以便我对其进行操作。\n\n文件名和类名必须匹配，否则 Java 将无法以预期方式运行程序。在编译代码以使其正常运行时，我最终会遇到错误。\n\
  \n## Java 注释\n\n一旦我创建一个新项目，我将看到一些灰色的文本区域，这些文本通常带有斜杠或星号。灰色文本是程序在运行代码时忽略的注释。我可以在注释中输入任何我想要的内容，这些注释不会被任何编写代码的人看到。大多数情况下，这些注释会解释代码的运行情况，以便其他程序员进行维护。\n\
  \n### 示例\n\n```\n//我创建了一个注释\n// 这是我的注释开始的地方\n// 然后在这里继续，因为它是一条长注释\n```\n\n```\n\
  /* 我在这里创建了另一种类型的注释\n\n这里它延伸到了另一行\n\n*/\n```\n\n我还可以使用 Javadoc 注释来输入注释。这些注释将以正斜杠后跟两个星号开头，并以单星号和一个斜杠结束。然而，我创建的每一行前面都必须有一个星号，以便被判定为注释。\n\
  \nJavadoc 将使用文档代码中的注释，这样当代码被转换为其他人使用的 HTML 页面时，代码就会被解释。\n\n\n\n\n\n我需要在 NetBeans\
  \ 菜单中生成一个 Javadoc，但由于我还没有写任何代码，所以我的窗口里什么都看不见。NetBeans 会自动生成注释，以便我看到一个示例，然后我可以删除这些注释，从而插入我自己的注释。\n\
  \n## Java 代码结构\n\n从代码将如何结构来看，当我查看代码时，包名（package name）将出现在最前面。这一行将以分号结尾，如果我不加这个分号，程序将无法被编译，因此它将无法运行。列在包名之后的是类名（class\
  \ name）。\n\n类名的写法将像代码段一样被设置。我必须使用大括号 `{ }` 来指示代码从哪里开始到哪里结束。括号内的所有内容都将被视为由 Java 执行的代码段（code\
  \ segment）。\n\n在编写代码时，我需要包含 `main` 关键字，这样 Java 就能知道代码应该从哪里开始执行。这与大括号非常。如果我不小心忘了\
  \ `main` 关键字，程序将给我返回一条错误信息。\n\n## 运行程序\n\n任何 Java 程序都将在一个输出窗口中运行，该窗口与我输入所有代码的窗口不同。这意味着我不需要打开任何其他窗口就可以运行我的代码。一切都在\
  \ NetBeans 内部运行。\n\n在 Java 中运行程序最简单的方法是按下 `F6`，这会自动运行程序，这样我就不会意外关闭我的程序。但是，如果不想这样做，我一直可以进入菜单并选择“运行项目”（run\
  \ project）按钮。\n\n如果所有其他方法都失败了，我可以在工具栏上找到一个绿色按钮，运行程序的方式和我可能选择的任何方法相同。不过，我需要确保运行的是正确的代码，特别是当我处理过多个编码项目时。为了做到这一点，我可以右键点击我想要运行的项目。\n\
  \n# 第三章：操作 Java 数据\n\nJava 与任何其他编程语言一样，允许我操作输入到程序中的数据，同时程序将其存储在内存中。这些数据被称为文本（text）、对象（objects），甚至是数值（amounts）。我必须为我使用的任何数据进行命名，而且这些数据可以随时重命名。然而，名称和值将是\
  \ Java 变量（Java variables）。\n\n## Java 数值\n\n数值可以使用整数或浮点数存储在 Java 内存中。浮点数将用等号存储，而整数将用关键字\
  \ `int` 存储。\n\n### 示例\n\n```\npublic static void main(String [ ] args) {\n    int\
  \ last_amount;\n    System.out.println(\"I wrote Java code!\");\n}\n```\n\n我需要与程序通信，以便让它知道我想哪些整数保存到\
  \ Java 内存中；为了这样做，我将使用 `int` 关键字并在其后加一个空格。我将输入我想给这个变量命名的名称，但我必须遵循 Java 设定的一系列规则。\n\
  \n1. 我不能在变量名中使用关键字。如果单词在我的代码窗口中变成蓝色，那么这个词就是 Java 的关键字。\n2. 我不能使用空格。这样做会导致返回错误代码，但我可以使用下划线和大写字母来像我平时使用空格那样来“分隔”单词。\n\
  3. 变量名的第一个字符不能是数字。如果我把数字拼写出来，那么是可以的，但使用实际的数字是不行的。\n4. 完全小写的名称与带有两个大写字母的名称是不同的。\n\
  \n当我想在变量名后放入一个整数时，我需要将变量名后放入一个整数。\n\n```java\npublic static void main(String [ ]\
