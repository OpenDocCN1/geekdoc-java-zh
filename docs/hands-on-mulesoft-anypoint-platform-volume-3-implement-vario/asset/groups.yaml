    # Understanding cache scope implementation


    In our previous volumes, we have not spoken about cache scope because the cache
    scope can be understood using a single array list, or this can be better understood
    using a proper DB call. Moreover, in practical scenarios, cache scope will be
    tightly depend on the object store component. So, it is better to understand cache
    behavior along with a real-time DB example.


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_81_0.png)


    Figure 2.27: Creating a caching strategy


    Now, let us create a caching strategy by specifying the payload id as the key
    expression to be cached.'
  - '[PAGE 82]


    When given a key expression, the caching mechanism will not fetch the values directly
    from DB for all queries having the same payload id.


    Let us assign this caching strategy to our select values using dynamic flow.


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_82_0.png)


    Figure 2.28: Completed flow after referring to the caching strategy


    Now, in the preceding canvas, you can see two logger components and one select
    statement inside the cache scope.


    This means you can pass a payload id the first time, then that will get processed
    inside the cache scope, and no logger output can be seen in the console.'
