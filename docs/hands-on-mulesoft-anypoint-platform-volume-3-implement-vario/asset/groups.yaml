    # Hands-on MuleSoft Anypoint Platform


    Implement various connectors including Database, File, SOAP, Email, VM, JMS, AMQP,
    Scripting, SFTP, LDAP, Java and ObjectStore


    NANDA NACHIMUTHU


    # Hands-on MuleSoft Anypoint Platform

    Volume 3,


    Implement various Connectors including Database, File, SOAP, Email, VM, JMS, AMQP,
    Scripting, SFTP, LDAP, Java and ObjectStore


    Nanda Nachimuthu


    FIRST EDITION 2022


    Copyright © BPB Publications, India


    ISBN: 978-93-55510-006


    All Rights Reserved. No part of this publication may be reproduced, distributed
