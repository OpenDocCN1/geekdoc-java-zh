    # 实战 MuleSoft Anypoint 平台


    实现各种连接器，包括数据库、文件、SOAP、电子邮件、VM、JMS、AMQP、脚本、SFTP、LDAP、Java 和 ObjectStore


    NANDA NACHIMUTHU


    # 实战 MuleSoft Anypoint 平台

    第 3 卷，


    实现各种连接器，包括数据库、文件、SOAP、电子邮件、VM、JMS、AMQP、脚本、SFTP、LDAP、Java 和 ObjectStore


    Nanda Nachimuthu


    2022年第一版


    版权 © BPB Publications, India


    ISBN: 978-93-55510-006


    保留所有权利。未经出版者书面许可，不得以任何形式或通过任何手段复制、分发、传输或存储在数据库或检索系统中本书物的任何部分，但可以在计算机系统中输入、存储和执行的程序列表除外，但这些程序不能通过出版、影印、录制或任何电子和机械手段进行复制。


    # 责任限制与免责声明


    书中包含的信息力求准确正确，并基于作者和出版者的最佳知识。作者已尽一切确保这些出版物的准确性，但对于因书中任何信息引起的任何损失或损害，出版者不承担责任。


    书中提到的所有商标均承认其各自所有者的财产，但 BPB Publications无法保证这些信息的准确性。


    # 献给


    Rathi Shravanti Shashank


    # 关于作者


    Nanda Nachimuthu 毕业于泰米尔纳德邦农业大学（泰米尔纳德邦哥姆拜伊尔），并在印度理工学院拉格普尔获得了 Java 和互联网计算领域的高级文凭。他还在德里印度国际贸易学院完成了高级文凭，该学院专门从事国际业务战略。此外，他还是计算机科学领域的
    WHRPC 荣誉博士。


    他拥有25年涵盖银行、医疗、政府和航空等多个领域的经验。他精通 Java、大数据、云、ESB、安全和物联网等技术。他曾担任技术架构师、解决方案架构师、云架构师和企业集成架构师等多种角色，并一直希望能拥有实战编码经验的个人贡献者角色。


    他对社会创业以及信息技术、制造业、贸易、农业和物联网等领域的公益咨询充满热情。


    他是一些社交平台的创始人，并拥有旗下的几个商标。


    目前，他专注于像 MuleSoft 这样的集成技术平台，他认为数字营销和机器间通信（M2M）在未来有广阔的前。


    # 关于评审员


    Vinoth Kumar 在 IT 行业拥有24多年的经验，是一位专攻云、AI/ML、机器人、区块链、SOA 和 Web 技术的企业架构师。他是 IBM 认证的
    Websphere 集成开发人员，为 IBM、Oracle 和 Mule SOA 平台产品提供解决方案。Vinoth Kumar 在云迁移、企业应用集成、使用人工智能/机器学习进行数据分析以及使用
    Web3、以太坊和 Hyperledger 的区块链解决方案方面拥有经验。凭借他在云、物联网、人工智能机器人领域的丰富经验，他专注于构建智能工厂的工业4.0
    框架。


    Arul ChristhruRaj Alphonse 是一位集成架构师、顾问和集成开发人员，对与集成、云和 API 相关的所有主题都特别感兴趣。他曾多次获得
    Udemy 上关于 MuleSoft 和 SoftwareAG webMethods 课程的畅销导师。


    他被认可为 MuleSoft 导师，是 MuleSoft 认证开发人员 - Level1、MuleSoft 认证集成架构师以及 MuleSoft 认证平台架构师。他热爱教授
    MuleSoft，帮助学习者准备参加 MuleSoft 认证，最重要的是解决现实中的问题。他连续五次被评为 MuleSoft 社区顶级贡献者。


    他对 SoftwareAG webMethods 也充满热情。他自2006年以来一直致力于 webMethods。他还是 webMethods 技术社区的活跃成员，在他在
    YouTube 的 Techlightning 频道上分享技术视频。


    在空闲时间，他喜欢烹饪、看电视节目和去很棒的地方旅行！


    # 致谢


    尽管我也拥有深厚的技术背景，并且从 MuleSoft 成立之初就在其中，但当 API 驱动的连接性范式转移开始时，我发现很难跟上整个平台架构的使命和愿景。我也曾努力理解
    MuleSoft 团队未来的实现方法。


    然后，我开始深入研究整个 MuleSoft 生态系统，寻找 MuleSoft 的一些关键技术方面。我才意识到，由于销售发票等信息在 SAP 和 Financial
    Force 等 SaaS 系统之间流动的，对于许多初学者来说，获得机会参与这些应用程序设置是非常困难或在实际上是不可能的。特别是当大多数基于云的 SaaS
    都是安全部署、授权并基于社区的。


    因此，系统集成和企业架构对于许多新手和经验中等的候选人来说仍然是新的领域。如果你想进入 API 设计师和 API 开发人员等角色，接触许多此类 SaaS 应用并理解它们的
    API 模型将在未来发挥重要作用。


    在尝试阅读 SaaS 系统暴露的 API 之前，了解 Web 服务等概念非常重要。我们需要深入理解 REST 和 SOAP 等 Web 服务，因为未来作为
    API 设计师，我们将定义 Web 规范。此外，对于对企业集成实践不太熟悉但只要有机会（且具备一些基础知识）就可以成为 API 设计师或业务分析师的读者来说，这一点是重要的。


    所以，此时，在开始《精通 MuleSoft》系列之际，我想感谢活跃的 MuleSoft 社区，无论是聚会活动、博客、LinkedIn 资料、独立教程提供者以及许多其他
    MuleSoft 活动家。


    没有他们的贡献和网络存在，对我来说设计和编写这个《精通 MuleSoft》系列实际上是非常困难的。


    再次感谢各位 Muleys！


    # 前言


    在我看来，对于一个新兴的技术或业务候选人来说，要获得参与高级系统集成场景的机会并不容易。想象一个财务集成场景，销售发票等信息在 SAP 和 Financial
    Force 等 SaaS 系统之间流动。对于许多新人来说，获得机会处理这些应用程序设置是非常困难或实际上是不可能的。特别是当大多数基于云的 SaaS 应用都是安全部署、授权并基于社区的。


    因此，系统集成和企业架构对于许多新手和经验中等的候选人来说仍然是新的。如果你想进入 API 设计师和 API 开发人员等角色，接触许多此类 SaaS 应用并理解它们的
    API 模型将在未来发挥重要作用。


    在尝试阅读 SaaS 系统暴露的 API 之前，了解 Web 服务等概念是非常重要的。我们需要深入理解 REST 和 SOAP 等 Web 服务，因为未来作为
    API 设计师，我们将定义 Web 服务规范。此外，我们团队开发的 API 规范将用于 SaaS 应用、遗留应用程序、移动设备、机器间通信等。


    因此，对于本书的读者来说，理解他们将成为大型企业架构不可或缺的一部分，而不是致力于某个特定的项目、产品或服务层是非常重要的。


    在书中十章中，你将学习到：


    - 第一章应用 API 详情、MuleSoft 连接器、通过 Anypoint 平台提供的连接器、将连接器添加到项目。

    - 第二章 Apache Netbeans、Derby、数据库连接器、数据库操作、DDL、缓存、按表行

    - 第三章文件连接器模块、文件连接器配置、文件读取组件、文件写入组件、文件列表组件、文件属性、删除组件、移动组件、复制组件、创建目录组件、重命名组件、新或更新的文件

    - 第四章基础 Web 项目、服务器设置、从 Anypoint Studio 获取 Netbeans 响应、HTML5 应用、Netbeans Web 服务、Web
    服务项目、WSDL、Web 服务组件、调用 WSDL、输入参数、调用 Web 服务、多个 Web 服务操作。

    - 第五章电子邮件 SMTP、启用 SMTP 启动 TLS、Gmail 设置中的低安全性选项、文件附件、启用 IMAP 和 POP3 访问、SMTP IMAP
    和 POP3 配置、Mozilla


    '
