    ## Introduction


    ActiveMQ is a popular Java-based messaging server. In the ActiveMQ, queues and
    topics can be created, and publishers and consumers can publish and consume messages.


    ## Getting started with ApacheMQ


    Have some basic understanding of messaging systems. Follow the steps involved
    in installing ApacheMQ, integrate with MuleSoft.


    ## Objectives


    After studying this unit, you will be able to:

    - Install ActiveMQ on your local machine

    - Create queues and topics

    - Publish and consume through MuleSoft


    ## Structure


    In this chapter, we will discuss the following:

    - Downloading ApacheMQ

    - Checking the ApacheMQ installation

    - Checking the created queues

    - Checking the created topics

    - Understanding listener component


    ## Key terms to explore


    - Point to remember

    - Structure

    - Result of flow

    - Result of listener


    ## Conclusion


    In this chapter, we learned about VM connectors. In the upcoming chapter, we will
    study about JMS.

