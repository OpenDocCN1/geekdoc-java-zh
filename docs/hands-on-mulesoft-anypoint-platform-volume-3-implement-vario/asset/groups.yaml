- md: "\n# Point to remember\n\nTry the JMS connectivity with other JMS providers\
    \ as well; you can try some of the cloud-based JMS providers also.\n\n# Key terms\
    \ to explore\n\n- ApacheMQ\n- ActiveMQ Web interface\n- Queue creation\n- ApacheMQ\
    \ connector\n- Publish and consume components\n- Listener component\n\n# Structure\n\
    \nIn this chapter, we will discuss the following topics:\n\n- RabbitMQ installation\
    \ and enabling management plugins and running\n- Accessing RabbitMQ Web management\
    \ interface\n- AMQP connector configurations\n- Using publish and listener components\n\
    - Publish and listener components in action\n\n# Objectives\n\nAfter studying\
    \ this unit, you will be able to:\n\n- Install and run RabbitMQ\n- Access RabbitMQ\
    \ Web management interface\n- Connect AMQP with MuleSoft\n- Publish and consume\
    \ messages\n\n# Introduction\n\nWe have seen VM queue in our previous chapters,\
    \ which is an in-built messaging platform that comes with MuleSoft as a component.\
    \ Then we have seen a Java messaging platform called Apache MQ which will act\
    \ as an external JMS platform. In this chapter, let us explore one more messaging\
    \ middleware called RabbitMQ, which is supporting AMQ protocol, i.e. advanced\
    \ message queuing protocol. We are not going to explore the AMQP specific functionalities,\
    \ and that is not our intention here; rather, we understanding the software installation\
    \ and connecting the AMQP server using the MuleSoft AMQP connector. Let us see\
    \ the steps involved to do so.\n\n# Install and run RabbitMQ\n\n```\nC:\\Windows\\\
    System32\\cmd.exe - rabbitmq-server\nMicrosoft Windows [Version 10.0.19045]\n\
    (C)2015 Microsoft Corporation. All rights reserved.\nC:\\Program Files\\RabbitMQ\\\
    Server\\rabbitmq-server-3.8.14\\bin\\rabbitmq-plugins enable rabbitmq_management\n\
    (enabled all plugins for rabbit@DESKTOP-9U7EE0:)\nThe following plugins have been\
    \ configured:\nrabbitmq_management\nrabbitmq_agent\nrabbitmq_web_dispatch\n-configuration\
    \ to rabbit@DESKTOP-9U7EE0:\nPlugin configuration unchanged.\nC:\\Program Files\\\
    RabbitMQ\\Server\\rabbitmq-server-3.8.14\\bin\\rabbitmq-plugins\nConfiguring logger\
    \ redirection\n11:21:36.770 (warning) Using RABBITMQ_ADVANCED_CONFIG_FILE: C:/Users/Admin/AppData/Roaming/RabbitMQ/advanced.config\n\
    ```\n\n**Figure 8.1:** RabbitMQ installation and enabling management plugins and\
    \ running\n\nDownload rabbitmq_server-3.8.14 binary and unzip the file to your\
    \ local directory.\n\nGet into the sbin directory and execute the following commands.\n\
    \n```\nrabbitmq-plugins enable rabbitmq_management\nrabbitmq-server\n```\n\nThese\
    \ procedures will enable RabbitMQ management console and the server to be started\
    \ now.\n\n# Access RabbitMQ Web management interface\n\nAccess the following URL.\
    \ And use guest, guest as the username and password, respectively.\n\nhttp://localhost:15672/\n\
    \nYou can visit the RabbitMQ management console, as shown in figure:\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_223_0.png)\n\
    \nFigure 8.2: Accessing RabbitMQ Web management interface\n\n# Connect AMQP with\
    \ MuleSoft\n\nCreate a Mule project and bring in a scheduler component.\n\nAdd\
    \ the AMQP module to the project and add a Publish component next to the scheduler.\n\
    \nIn the publish component property panel, you can see the option to create an\
    \ AMQP connector.\n\nOpen the connector configuration and provide the server,\
    \ username and password details as shown in figure.\n\nYour connector configuration\
    \ in the config XML file must be looking like this.\n\n```\nname=\"AMQP_Config\"\
    \ docname=\"AMQP Config\" doc:id=\"5c39b16-81a6-41d7-a293-fe470971e2c7\" \nhost=\"\
    localhost\" username=\"guest\" password=\"guest\" />\n```\n\n# AMQP Config\n\n\
    Base configuration for AmqpConnector\n\n| General | Consumer | Publisher | Quality\
    \ of Service | Advanced | Notes | Help |\n| :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- |\n| Name: AMQP_Config | | | | | | |\n\n| General | Socket Configuration\
    \ | TLS | Advanced | Connection | | |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| Host: localhost | | | | | | |\n| Port: / | | | | | |\n\n| Virtual\
    \ host: | | | | | | |\n| Username: guest | | | | | | |\n| Password: guest [Show\
    \ password] | | | | | | |\n| - Use tls | | | | | | |\n| - Use snii | | | | | |\
    \ |\n| Heartbeat timeout: 60 | | | | | | |\n| Fallback addresses: None | | | |\
    \ | | |\n| General | Test Connection... OK Cancel | | | | | |\n\nFigure 8.3: AMQP\
    \ connector configurations\n\n# Publish and consume messages\n\nCreate a publish\
    \ component in the first flow after the scheduler and provide the queue details\
    \ and pass the payload to the queue. Once you have done this, your config file\
    \ flow will look like the following:\n\n```\ndoc-name=\"Publish\" doc:id=\"91e07840-3249-4efa-8da6-c02116855826\"\
    \nconfig-ref=\"AMQP_Config\" exchangeName=\"amq.topic\">\n{\n  signment_number:\
    \ randomInt(10000),\n  items: \"Cosmetics\"\n}\npriority=\"3\"\n```\n\nNow bring\
    \ in a AMQP listener and point it to the message published queue. So that your\
    \ amqp listener config XML will look like the following:\n\n```\ndoc-name=\"Listener\"\
    \ config-ref=\"AMQP_Config\"\nqueueName=\"test\"//>\ndoc-name=\"Transform Message\"\
    \ >\n>2.0\noutput application/xml\n---\n{\n  items: payload\n}\n]]>\nlevel=\"\
    INFO\" docName=\"Logger\" message=\"#[payload.items]\" />\n```\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_227_0.png)\n\
    \n**Figure 8.4:** Using publish and listener components\n\nHere is the completed\
    \ AMQP flow with publish and listener components.\n\nOn running the project, the\
    \ following illustrated logger results can be obtained.\n\n```\nINFO 2023-03-12\
    \ 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message published\nINFO 2023-03-12 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING\
    \ @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor: message\
    \ published {\n  signment_number: 5576,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12\
    \ 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message published {\n  signment_number: 8144,\n  items: \"Cosmetics\"\n}\nINFO\
    \ 2023-03-12 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\n\
    org.mule.runtime.core.internal.processor.LoggerProcessor: message published {\n\
    \  signment_number: 1560,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12 15:46:27,042\
    \ [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message published {\n  signment_number: 9321,\n  items: \"Cosmetics\"\n}\nINFO\
    \ 2023-03-12 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\n\
    org.mule.runtime.core.internal.processor.LoggerProcessor: message published {\n\
    \  signment_number: 4022,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12 15:46:27,042\
    \ [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message published {\n  signment_number: 6781,\n  items: \"Cosmetics\"\n}\n```\n\
    \nFigure 8.5: Publish and listener components\n\n# Conclusion\n\nIn this chapter,\
    \ we have installed, run, and tested the RabbitMQ AMQP messaging broker. We have\
    \ connected the AMQP server with our MuleSoft AMQP server, and we have published\
    \ and consumed messages from the server. In the upcoming chapter, we are going\
    \ to study about scripting engine connectors to connect and execute other scripting\
    \ programs such as Groovy and Python from the MuleSoft scripting connector.\n"
  mdcn: "\n\n# 需要记住的点\n\n尝试与其他 JMS 提供商进行 JMS 连接；你也可以尝试一些云端 JMS 提供商。\n\n# 需要探索的关键术语\n\
    \n- ApacheMQ\n- ActiveMQ Web 界面\n- 队列创建\n- ApacheMQ 连接器\n- 发布和消费组件\n- 监听器组件\n\n\
    # 结构\n\n在本章中，我们将讨论以下主题：\n\n- RabbitMQ 的安装、启用管理插件及运行\n- 访问 RabbitMQ Web 管理界面\n\
    - AMQP 连接器配置\n- 使用发布和监听器组件\n- 发布和监听器组件的实际应用\n\n# 目标\n\n学习完本单元后，你将能够：\n\n- 安装并运行\
    \ RabbitMQ\n- 访问 RabbitMQ Web 管理界面\n- 将 AMQP 与 MuleSoft 连接\n- 发布和消费消息\n\n# 介绍\n\
    \n在之前的章节中，我们已经看到了 VM 队列，它是 MuleSoft 自带的一个组件内置消息平台。然后我们看到了一个名为 Apache MQ 的 Java\
    \ 消息平台，它将作为外部 JMS 平台。在本章中，让我们探索另一个名为 RabbitMQ 的消息中间件，它支持 AMQ 协议，即高级消息队列协议。我们并不打算探索\
    \ AMQP 特有的功能，这并不是我们的意图；相反，我们将理解软件安装以及使用 MuleSoft AMQP 连接器连接 AMQP 服务器。让我们来看看完成这些操作的步骤。\n\
    \n# 安装并运行 RabbitMQ\n\n```\nC:\\Windows\\System32\\cmd.exe - rabbitmq-server\n\
    Microsoft Windows [Version 10.0.19045]\n(C)2015 Microsoft Corporation. All rights\
    \ reserved.\nC:\\Program Files\\RabbitMQ\\Server\\rabbitmq-server-3.8.14\\bin\\\
    rabbitmq-plugins enable rabbitmq_management\n(enabled all plugins for rabbit@DESKTOP-9U7EE0:)\n\
    The following plugins have been configured:\nrabbitmq_management\nrabbitmq_agent\n\
    rabbitmq_web_dispatch\n-configuration to rabbit@DESKTOP-9U7EE0:\nPlugin configuration\
    \ unchanged.\nC:\\Program Files\\RabbitMQ\\Server\\rabbitmq-server-3.8.14\\bin\\\
    rabbitmq-plugins\nConfiguring logger redirection\n11:21:36.770 (warning) Using\
    \ RABBITMQ_ADVANCED_CONFIG_FILE: C:/Users/Admin/AppData/Roaming/RabbitMQ/advanced.config\n\
    ```\n\n**图 8.1：** RabbitMQ 安装、启用管理插件及运行\n\n下载 rabbitmq_server-3.8.14 二进制文件并将文件解压到本地目录。\n\
    \n进入 sbin 目录并执行以下命令。\n\n```\nrabbitmq-plugins enable rabbitmq_management\nrabbitmq-server\n\
    ```\n\n这些步骤将启用 RabbitMQ 管理控制台并启动服务器。\n\n# 访问 RabbitMQ Web 管理界面\n\n访问以下 URL。并分别使用\
    \ guest、guest 作为用户名和密码。\n\nhttp://localhost:15672/\n\n你可以访问 RabbitMQ 管理控制台，如图所示：\n\
    \n![](img/b37db39e68b5c0bef5ff8f878466ecb7_223_0.png)\n\n图 8.2: 访问 RabbitMQ Web\
    \ 管理界面\n\n# 将 AMQP 与 MuleSoft 连接\n\n创建一个 Mule 项目，并引入一个调度器（scheduler）组件。\n\n向项目添加\
    \ AMQP 模块，并在调度器旁边添加一个发布（Publish）组件。\n\n在发布组件的属性面板中，你可以看到创建 AMQP 连接器的选项。\n\n打开连接器配置，并如图所示提供服务器、用户名和密码详情。\n\
    \n你在配置 XML 文件中的连接器配置必须看起来如下。\n\n```\nname=\"AMQP_Config\" docname=\"AMQP Config\"\
    \ doc:id=\"5c39b16-81a6-41d7-a293-fe470971e2c7\" \nhost=\"localhost\" username=\"\
    guest\" password=\"guest\" />\n```\n\n# AMQP Config\n\nAmqpConnector 的基础配置\n\n\
    | 通用 | 消费者 | 发布者 | 服务质量 | 高级 | 备注 | 帮助 |\n| :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- |\n| 名称: AMQP_Config | | | | | | |\n\n| 通用 | 套接字配置 | TLS | 高级 |\
    \ 连接 | | |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 主机: localhost\
    \ | | | | | | |\n| 端口: / | | | | | | |\n\n| 虚拟主机: | | | | | | | |\n| 用户名: guest\
    \ | | | | | | | |\n| 密码: guest [显示密码] | | | | | | | |\n| - 使用 tls | | | | | |\
    \ | |\n| - 使用 snii | | | | | | | |\n| 心跳超时: 60 | | | | | | | |\n| 备用地址: 无 | |\
    \ | | | | | |\n| 通用 | 测试连接... OK 取消 | | | | | | |\n\n图 8.3: AMQP 连接器配置\n\n# 发布和消费消息\n\
    \n在调度器的第一个流中创建一个发布组件，提供队列详情并将负载（payload）传递给队列。完成后，你的配置文件流将如下：\n\n```\ndoc-name=\"\
    Publish\" doc:id=\"91e07840-3249-4efa-8da6-c02116855826\"\nconfig-ref=\"AMQP_Config\"\
    \ exchangeName=\"amq.topic\">\n{\n  signment_number: randomInt(10000),\n  items:\
    \ \"Cosmetics\"\n}\npriority=\"3\"\n```\n\n现在引入一个 AMQP 监听器（listener）并将其指向发布的队列。这样你的\
    \ AMQP 监听器配置 XML 将如下：\n\n```\ndoc-name=\"Listener\" config-ref=\"AMQP_Config\"\
    \nqueueName=\"test\"//>\ndoc-name=\"Transform Message\" >\n>2.0\noutput application/xml\n\
    ---\n{\n  items: payload\n}\n]]>\nlevel=\"INFO\" docName=\"Logger\" message=\"\
    #[payload.items]\" />\n```\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_227_0.png)\n\
    \n**图 8.4：** 使用发布和监听器组件\n\n这里是带有发布和监听器组件的完整 AMQP 流。\n\n运行项目时，可以获得以下图示的日志结果。\n\n\
    ```\nINFO 2023-03-12 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING\
    \ @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor: message\n\
    INFO 2023-03-12 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING\
    \ @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor: message\
    \ {\n  signment_number: 5576,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12 15:46:27,042\
    \ [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message {\n  signment_number: 8144,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12\
    \ 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message {\n  signment_number: 1560,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12\
    \ 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message {\n  signment_number: 9321,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12\
    \ 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message {\n  signment_number: 4022,\n  items: \"Cosmetics\"\n}\nINFO 2023-03-12\
    \ 15:46:27,042 [[MuleRuntime].uber.28: [sftp].sftpFlow.BLOCKING @67f24050\norg.mule.runtime.core.internal.processor.LoggerProcessor:\
    \ message {\n  signment_number: 6781,\n  items: \"Cosmetics\"\n}\n```\n\n图 8.5:\
    \ 发布和监听器组件\n\n# 总结\n\n在本章中，我们安装、运行并测试了 RabbitMQ AMQP 消息代理。我们将 AMQP 服务器与我们的 MuleSoft\
    \ AMQP 服务器连接起来，并从服务器发布和消费了消息。在接下来的章节中，我们将学习脚本引擎连接器，以便从 MuleSoft 脚本连接器连接并执行 Groovy\
    \ 和 Python 等脚本程序。\n\n"
