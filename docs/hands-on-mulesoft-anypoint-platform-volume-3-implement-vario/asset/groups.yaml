    \nLet us list the process flow involved in the banking loan application as follows:\n\
    \n- Customer applies for a loan by providing his personal/ finance kind of details.\n\
    - Bank should verify his personal details and finances details, and the bank should\
    \ calculate his credit score based on the details verified.\n- If verification\
    \ is successful, the loan approver can finalize the approval limit of the loan.\n\
    - Next will be the dispersal process if the customer agrees to the bank’s conditions.\n\
    - Once the amount is disbursed, the repayment schedule will start on that loan.\n\
    - If repayment is not happening as per banks’ norms, a collection process will\
    \ be initiated.\n- If the collection process also fails, then a legal process\
    \ will be initiated.\n- By initiating a legal process, some financial settlements\
