    # Introduction


    Other than the routine MuleSoft programming, there may be a need for custom code
    creation via different script engines for various business needs such as asynchronous
    executions of larger batch jobs, file reads, logger monitoring, MuleSoft directory
    access, and so on. MuleSoft comes out with a scripting component using which we
    can link the scripting engines such as Groovy, Python, Ruby, and ECMAScript into
    our flow to achieve specific business paradigms. Let us see how to execute these
    kinds of script codes from MuleSoft flows.'
  - '[PAGE 236]


    # Scripting engine


    There are a lot of differences between programming language and scripting languages,
    the way it is written and executed and the purpose they solve. For example, the
    JavaScript language need not have a compiler; you write a series of commands,
    and an in-built JavaScript engine that is embedded into your browser can start
    executing the commands you have written. This is the same in the case of scripting
    languages such as Jython, Groovy, and Ruby. Whereas a programming language like
    Java needs a compiler and an interpreter for compiling and executing the binaries.


    When it comes to usage, the scripting languages will be used for larger non-transactional
    activities where there is no need of applying a lot of efforts such as memory
    management, object storage, transactions, acknowledements, persisting object states,
    and so on.


    Imagine a practical scenario like a project handling larger file collection that
    means, from various parts of the world, the files are generated and dumped in
    a file system in a larger volume, say a million of tiny files per second. In this
    case, the architecture design of the project is not demanding maintenance of transactional
    details like from where the file is written into the system or should the file
    any transactional ID so that when reading the file, the transaction IDs must be
    carried inside the database.'
  - '[PAGE 237]


    Instead, the design may insist on just reading the file, inserting the contents
    in a database and deleting the files. In this case, there is no need of using
    an object-oriented or memory and resource-hungry programming language because
    the heap memory of that programming language may go for a toss. So, in this case,
    if that programming language delegates these kinds of “do and forget” tasks to
    a scripting programming script, then the efficiency also will be improved, and
    complex transactional and memory-related situations can be avoided.'
