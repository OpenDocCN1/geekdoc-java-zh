    \nFigure 4.4: Server settings\n\nIn the **Server setting**, the dialogue selects\
    \ the server as **GlassFish** and provides a context path.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_138_0.png)\n\
    \nFigure 4.5: Framework selection screen\n\nYou can select Spring Web MVC as your\
    \ framework.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_138_1.png)\n\nFigure\
