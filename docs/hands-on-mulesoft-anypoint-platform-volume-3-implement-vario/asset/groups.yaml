    \n让我们在互联网上进行简单的研究，假设我们想了解一种支出分析软件。请尝试使用关键词在互联网上搜索。同样，尝试使用关键词 Capital 进行搜索，然后你可能会发现一个名为\
    \ Workday 的流行 HCM 应用。参考图示\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_30_0.png)\n\
    \n图 1.1：流行的 HCM 应用 Workday\n\n## 云端 SaaS 应用暴露的 API\n\n你现在必须理解，有许多是为了解决各种业务需求而开发的。因此，理解行业业务领域至关重要，这意味着对于管理业务流程具有重要的业务领域。下面给出了业务领域列表；尝试尽可能进行搜索以理解现有的应用程序。你可以搜索\
    \ 5 个业务领域以寻找各种可用领域，以及这些领域中使用的前 5 或 10 个应用程序。\n\n现在，我们已经了解到 HR 部门使用着一个名为 Workday\
    \ 的 HCM 应用，并且我们发现了一个连接器（另见图示），该可用于 MuleSoft 集成。如果任何应用程序想要通过 API 安全地向世界其他部分共享信息，那么它们必须为所有操作实现\
    \ REST 或 SOAP 等 Web 服务。因此，下一个问题是我们如何探索像 Workday 这样的应用程序所提供的 API。答案很简单，再次使用关键词\
    \ API 进行搜索，你可以到达 Workday 提供所有 API 信息的页面。\n\n## Workday Web Services (WWS) 目录 (v34.2\
