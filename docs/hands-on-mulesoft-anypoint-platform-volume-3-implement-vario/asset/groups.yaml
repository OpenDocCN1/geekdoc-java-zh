    ## 引言


    ActiveMQ 是一个流行的 Java 消息服务器。在 ActiveMQ 中，可以创建队列和主题，发布者和消费者可以发布和消费消息。


    ## 开始使用 ApacheMQ


    对消息系统有一定的基本了解。按照步骤安装 ApacheMQ 并与 MuleSoft 集成。


    ## 目标


    学习本单元后，你将能够：

    - 在本地机器安装 ApacheMQ

    - 创建队列和主题

    - 通过 MuleSoft 发布和消费


    ## 结构


    在本章中，我们将讨论：

    - 下载 ApacheMQ

    - 检查 ApacheMQ 安装情况

    - 检查创建的队列

    - 检查创建的主题

    - 理解监听器组件


    ## 术语


    - 注意事项

    - 结构

    - 流程结果

    - 监听器结果


    ## 结论


    本章学习了 VM 连接器。在接下来的章节中，我们将学习 JMS。


