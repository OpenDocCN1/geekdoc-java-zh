    \ XML formatted Web service interface.\n\n# Basics of SOAP Web services\n\nTo\
    \ begin with, let us use NetBeans for creating some Web projects and understanding\
    \ the basics of SOAP Web services.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_134_0.png)\n\
