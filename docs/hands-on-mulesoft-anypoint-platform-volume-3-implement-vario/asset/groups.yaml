    # Introduction


    We have seen VM queue in our previous chapters, which is an in-built messaging
    platform that comes with MuleSoft as a component. Then we have seen a Java messaging
    platform called Apache MQ which will act as an external JMS platform. In this
    chapter, let us explore one more messaging middleware called RabbitMQ, which is
    supporting AMQ protocol, i.e., advanced message queuing protocol. We are not going
    to explore the AMQP specific functionalities, and that is not our intention here;
    rather, we understanding the software installation and connecting the AMQP server
    using the MuleSoft AMQP connector. Let us see the steps involved to do so.'
