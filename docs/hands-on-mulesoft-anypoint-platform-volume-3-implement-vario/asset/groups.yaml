    \ architecture），只有当我们拥有针对数据库、JMS、文件等各种应用程序的连接器时，这种架构才可行。可用连接器列表可以在此链接查看。\n\n在此链接中，你可以看到针对行业热门应用程序的现成认证连接器。当应用程序通过\
