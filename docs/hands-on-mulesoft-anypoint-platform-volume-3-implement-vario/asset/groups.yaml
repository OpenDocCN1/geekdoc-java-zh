- md: "\n## On table row listener\n\nOn-table-row listener is used to listen to a\
    \ table and trigger a process based on a new row insertion.\n\nTo achieve this,\
    \ create a simple table called map and have a primary key called\n\nMake that\
    \ map_id column as a watermark column and complete the configurations of\n\nNow,\
    \ we already have a flow for bulk row insertion, change the script to insert bulk\
    \ rows to the map table.\n\nYou can run the project and now see on the table row\
    \ listener is in action.\n\n```\ncessor: ************record inserted through bulk\
    \ insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\n```\n\nIn the console, you can see\
    \ for each row inserted by a bulk row scheduler; the on-table row listener will\
    \ send a logger message as a new row is inserted.\n\n## Conclusion\n\nWe have\
    \ covered the basic DB concepts using a third-party tool NetBeans, and we were\
    \ able to use the dummy table data provided by NetBeans; we have also created\
    \ our own data and tested all DB operations. In the upcoming chapter, we are going\
    \ to explore file connectors. Thank You.\n\n## Points to remember\n\n- Create\
    \ multiple tables and execute DB operations from MuleSoft.\n- Understand one to\
    \ one, one to many kinds of relationships and apply them in your project.\n\n\
    ## Key terms to explore\n\n- Apache NetBeans\n- Derby database\n- Derby client\
    \ jar\n- Insert script\n- Update statement\n- DDL data definition language\n-\
    \ Execute script\n- Stored procedure\n- Inserting bulk data\n- Updating bulk data\n\
    - Deleting bulk records\n- Bulk insertion\n- OnTableRow listener\n\n## Structure\n\
    \nIn this chapter, we will discuss the following topics:\n\n- Add file connector\
    \ module to project\n- File connector configuration\n- File read component\n-\
    \ File write component\n- File list component\n- Checking the available file attributes\
    \ in debug mode\n- Delete component\n- Move component\n- Copy component\n- Create\
    \ directory component\n- Rename component\n- On new or updated file\n\n## Objectives\n\
    \nAfter studying this chapter, you will be able to:\n\n- Handle file-related operations\n\
    - Combine file operations with schedulers and DB\n- Design and create file-based\
    \ MuleSoft flows\n\n## Introduction\n\nMuleSoft file connector is simple, and\
    \ it covers all file-related operations such as read, write, copy, deletes, and\
    \ so on. It also provides information about file Metadata. Let us go through quickly\
    \ the file operations in this chapter.\n\nThe following screenshots and steps\
    \ will help you in understanding the MuleSoft file connector usage.\n\nGo to Add\
    \ modules and look out for File connector, drag it to the project modules pane,\
    \ and you can see the file operations supported such as and so on.\n\nFigure 3.1:\
    \ Add file connector module to project\n\nConfiguring file connector is nothing\
    \ but specifying the working directory, mention from your local file system from\
    \ where the files will be read.\n\nFigure 3.2: File connector configuration\n\n\
    Specify the file to be read and use payload as a message in the logger to see\
    \ the file contents.\n\nFigure 3.3: Using file read component\n\nSpecify the file\
    \ to be written, provide the contents in the content field.\n\nFigure 3.4: Using\
    \ file write component\n\nCreate parent directories, and the directories will\
    \ be created as you mention.\n\nWrite mode will have three options, overwrite—will\
    \ erase all previous content, append—will add to the previous contents, and create\
    \ new-will create a new file.\n\n### Figure 3.5: Using file component\n\nWait,\
    \ the text says Figure 3.5: Using file list component\n\nList component will provide\
    \ an array of all files available in a particular directory. The preceding matchers\
    \ are self-explanatory. You must be familiar with regular expressions in Java\
    \ to use these matchers effectively.\n\n## Variables\n\n```\nChoice =\n  attributes\
    \ = LocalFileAttributes[lastModifiedTime=2021-03-10T12:38:20.177898,lastAccessTime=2021-03-10T13:15:34.375990,...\n\
    \  mediaType =\n    creationTime = 2021-03-10T13:15:34.375990\n  directory = file\n\
    \    fileName = \"test - Copy (2).txt\"\n    lastAccessTime = 2021-03-10T13:15:34.375990\n\
    \    MAX = 999999999-12-31T23:59:59.999999999\n    MIN = 999999999-01-01T00:00:00.000\n\
    \    date = 2021-03-10\n    serialVersionID = 602766400453656\n    time = 13:15:34.375990\n\
    \  lastModifiedTime = 2021-03-10T12:38:20.177898\n    MAX = 999999999-12-31T23:59:59.999999999\n\
    \    MIN = 999999999-01-01T00:00:00.000\n    date = 2021-03-10\n    serialVersionID\
    \ = 602766400453656\n    time = 12:38:20.177898\n  path = \"C:\\FileConnector\\\
    test - Copy (2).txt\"\n  regularFile = true\n  serialVersionID = 324978073227598\n\
    \  size = 0\n  symbolicLink = false\n  correlationId = \"2c56e10b-8175-11eb-b2d2-3d821a1a5816\"\
    \n  ItemSequenceInfo = ItemSequenceInfo(position=0, sequenceSize=<not set>)\n\
    ```\n\nFigure 3.6: Checking the available file attributes in debug mode\n\nIf\
    \ you run the previous example in debug, you can see the file attributes available\
    \ for each file, as shown in figure\n\n## Figure 3.7: Using delete component\n\
    \nAdd a Delete component and provide a file name to be deleted and run the project;\
    \ you can see the file get deleted, the name of the file to be deleted can be\
    \ passed dynamically also.\n\n## Figure 3.8: Using move component\n\nMove component\
    \ will expect the source and target paths. Apart from this move component will\
    \ have options for creating a parent directory, overwrite, and renaming.\n\n##\
    \ Figure 3.9: Using copy component\n\nCopy component also will have source and\
    \ target path. Apart from this copy component will have options for create a parent\
    \ directory, overwrite, and renaming.\n\n## Figure 3.10: Using create directory\
    \ component\n\nIf you want to go for a new directory, you can use Create directory\
    \ component.\n\nFigure 3.11: Using rename component\n\nFor backing up files or\
    \ renaming a file, we can use Rename component.\n\nWe can trigger a new process\
    \ if a directory got a new file or a working file got modified using on new or\
    \ update file component. Once we process the file, we can move the file to the\
    \ archive directory as well as we can delete the file from the source based on\
    \ the post-processing action configuration.\n"
  mdcn: "\n\n## 表格行监听器 (On table row listener)\n\nOn-table-row监听器用于监听表格并在插入新行时触发处理流程。\n\
    \n要实现这一点，请创建一个名为 map 的简单表，并创建一个名为 map_id 的主键。\n\n将 map_id 列设置为水线列（watermark column），并完成相关配置的配置。\n\
    \n现在，我们已经有一个批量插入行的流程，修改脚本以将批量行插入到 map 表中。\n\n你可以运行项目，现在就可以看到表格行监听器正在运行。\n\n```\n\
    cessor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    essor: ************record inserted through bulk insert flow***\nessor: ************New\
    \ record identified by OnTableRowListener\nessor: ************record inserted\
    \ through bulk insert flow***\nessor: ************New record identified by OnTableRowListener\n\
    ```\n\n在控制台中，你可以看到由批量行调度器插入的每一行；当插入新行时，表格行监听器会发送一条日志消息。\n\n## 总结\n\n我们使用第三方工具\
    \ NetBeans 涵盖了基本的数据库概念，并能够使用 NetBeans 提供的虚拟表数据；我们还创建了自己的数据并测试了所有的数据库操作。在接下来的章节中，我们将探索文件连接器。谢谢。\n\
    \n## 注意事项\n\n- 从 MuleSoft 创建多个表并执行数据库操作。\n- 理解一对一、一对多等关系类型，并将它们应用到你的项目中。\n\n##\
    \ 待探索的关键术语\n\n- Apache NetBeans\n- Derby 数据库\n- Derby client jar\n- 插入脚本 (Insert\
    \ script)\n- 更新语句 (Update statement)\n- DDL 数据定义语言\n- 执行脚本 (Execute script)\n\
    - 存储过程 (Stored procedure)\n- 批量插入数据 (Inserting bulk data)\n- 批量更新数据 (Updating\
    \ bulk data)\n- 批量删除记录 (Deleting bulk records)\n- 批量插入 (Bulk insertion)\n- OnTableRow监听器\n\
    \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n- 为项目添加文件连接器模块\n- 文件连接器配置\n- 文件读取组件\n- 文件写入组件\n\
    - 文件列表组件\n- 在调试模式下检查可用文件属性\n- 删除组件\n- 移动组件\n- 复制组件\n- 创建目录组件\n- 重命名组件\n- 新文件或更新文件时触发\n\
    \n## 目标\n\n学习本章后，你将能够：\n\n- 处理文件相关操作\n- 将文件操作与调度器及数据库结合\n- 设计并创建基于文件的 MuleSoft\
    \ 流程\n\n## 介绍\n\nMuleSoft 文件连接器非常简单，它涵盖了所有文件相关操作，如读取、写入、复制、删除等。它还提供了关于文件元数据（Metadata）的信息。让我们浏览本章中的文件操作。\n\
    \n以下截图和步骤将帮助你理解 MuleSoft 文件连接器的用法。\n\n进入“添加模块 (Add modules)”并寻找文件连接器 (File connector)，将其拖到项目模块面板中，你就可以看到支持的文件操作，如等。\n\
    \n图 3.1：为项目添加文件连接器模块\n\n配置文件连接器无非指定工作目录，从你的本地文件系统中指定从何处读取文件。\n\n图 3.2：文件连接器配置\n\
    \n指定要读取的文件，并在日志记录器（logger）中使用 payload 作为消息来查看文件内容。\n\n图 3.3：使用文件读取组件\n\n指定要写入的文件，在\
    \ content 字段中提供内容。\n\n图 3.4：使用文件写入组件\n\n创建父目录，目录将按照你的指定的进行创建。\n\n写入模式有三个选项：覆盖（overwrite）——将删除所有之前的内容；追加（append）——将添加到之前的内容；以及新建（create\
    \ new）——将创建一个新文件。\n\n### 图 3.5：使用文件组件\n\n等等，文本写的是 图 3.5：使用文件列表组件\n\n列表组件（List\
    \ component）将提供特定特定目录下所有可用文件的数组。先前的匹配器（matchers）是不言自明的。你必须熟悉 Java 中的正则表达式才能有效地使用这些匹配器。\n\
    \n## 变量 (Variables)\n\n```\nChoice =\n  attributes = LocalFileAttributes[lastModifiedTime=2021-03-10T12:38:20.177898,lastAccessTime=2021-03-10T13:15:34.375990,...\n\
    \  mediaType =\n    creationTime = 2021-03-10T13:15:34.375990\n  directory = file\n\
    \    fileName = \"test - Copy (2).txt\"\n    lastAccessTime = 2021-03-10T13:15:34.375990\n\
    \    MAX = 999999999-12-31T23:59:59.999999999\n    MIN = 999999999-01-01T00:00:00.000\n\
    \    date = 2021-03-10\n    serialVersionID = 602766400453656\n    time = 13:15:34.375990\n\
    \  lastModifiedTime = 2021-03-10T12:38:20.177898\n    MAX = 999999999-12-31T23:59:59.999999999\n\
    \    MIN = 999999999-01-01T00:00:00.000\n  path = \"C:\\FileConnector\\test -\
    \ Copy (2).txt\"\n  regularFile = true\n  serialVersionID = 324978073227598\n\
    \  size = 0\n  symbolicLink = false\n  correlationId = \"2c56e10b-8175-11eb-b2d2-3d821a1a5816\"\
    \n  ItemSequenceInfo = ItemSequenceInfo(position=0, sequenceSize=<not set>)\n\
    ```\n\n图 3.6：在调试模式下检查可用文件属性\n\n如果你在调试模式下运行之前的示例，你可以看到每个文件的可用属性，如图所示\n\n图 3.7：使用删除组件\n\
    \n添加一个删除组件并提供要删除的文件名，运行项目；你可以看到文件被删除，要删除的文件名也可以动态传递。\n\n图 3.8：使用移动组件\n\n移动组件需要源路径和目标路径。此外，移动组件具有创建父目录、覆盖和重命名的选项。\n\
    \n图 3.9：使用复制组件\n\n复制组件同样需要源路径和目标路径。此外，复制组件具有创建父目录、覆盖和重命名的选项。\n\n图 3.10：使用创建目录组件\n\
    \n如果你想去创建一个新目录，可以使用创建目录组件。\n\n图 3.11：使用重命名组件\n\n为了备份文件或重命名文件，我们可以使用重命名组件。\n\n\
    当目录获得新文件或工作文件被修改时，可以使用新文件或更新文件组件触发新流程。一旦我们处理了文件，我们可以将文件移动到存档目录，也可以根据后处理操作配置从源位置删除文件。\n\
    \n"
