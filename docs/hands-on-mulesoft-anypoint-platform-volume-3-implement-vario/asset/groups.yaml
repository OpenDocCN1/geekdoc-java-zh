    # LDAP Connector


    # Structure


    In this chapter, we will cover the following topics:


    - Downloading LDAP connector from Anypoint exchange

    - Inspecting the LDAP operations

    - Installing and running ApacheDS

    - Creating a new LDAP connection through LDAP studio

    - Providing authentication details

    - Establishing LDAP connection to LDAP studio

    - Providing LDAP server details to Anypoint Studio LDAP connector

    - Inspecting the object details of the LDAP directory

    - Using LDAP lookup component

    - Fetching Apache DS LDAP directory details from MuleFlow


    # Objective


    After studying this chapter, you will be able to understand:


    - LDAP basics

    - Installing and connecting with an LDAP server

    - MuleSoft LDAP connector configurations

    - Invoking LDAP operations from MuleSoft flow


    # Introduction


    The information about the enterprise users, passwords, systems, and networks will
    be stored in a distributed directory information service. These directory services
    must follow an industry-standard protocol called Lightweight Directory Access
    Protocol. Some of the famous open-source LDAPs are OpenLDAP, Apache-DS, and 389
    Directory Server. Some of the proprietary LDAP servers are IBM Tivoli, Oracle
    Directory Server, and PingDirectory. Any enterprise may use any one of the above
    stated LDAP directory services. In this chapter, let us explore ApacheDS open-source
    LDAP server, ApacheDS LDAP studio, and MuleSoft connector for LDAP.


    # LDAP connector from Anypoint exchange


    MuleSoft comes with a default LDAP connector which is available in Anypoint exchange.
    Let us see how to download and explore the LDAP connector. Follow the steps given
    as follows and refer to the screenshots for configuring the LDAP server:


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_263_0.png)


    Figure 11.1: Downloading LDAP connector from Anypoint exchange


    Use your Anypoint credentials to access the exchange using the option given in
    the pallet.


