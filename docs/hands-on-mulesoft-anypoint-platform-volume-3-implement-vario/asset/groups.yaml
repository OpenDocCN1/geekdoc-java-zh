    # Conclusion\n\nIn this chapter, we get to know the basics of Web applications;\
    \ we have developed some Web applications and Web services from scratch in our\
    \ local system using NetBeans IDE. We have connected with public SOAP Web services\
    \ and locally developed SOAP Web services and are able to invoke from the MuleSoft\
    \ Web service connector. In the upcoming chapter, we will explore e-mail connectors.\n\
    \n# Points to remember\n\n- Try invoking more public or mock SOAP Web services.\n\
    - Understand WSDL elements in detail.\n\n# Key terms to explore\n\n- Selecting\
    \ basic Web application project\n- Server settings\n- Getting the NetBeans response\
    \ from Anypoint Studio\n- HTML5 application\n- Web services from NetBeans\n- Web\
    \ services project\n- WSDL\n- Web service Consumer component\n- Invoking WSDL\n\
    - Input parameters\n- Invoking Web services\n- Multiple Web service operations\n\
    \n# Structure\n\nIn this chapter, we will discuss the following topics:\n\n- Create\
    \ a dummy e-mail account for testing purposes\n- E-mail SMTP settings\n- E-mail\
    \ SMTP StartTLS enabling\n- E-mail fields\n- Turn on less security options in\
    \ G-mail settings\n- File attachment\n- Enabling IMAP and POP3 access\n- SMTP\
    \ IMAP and POP3 configurations\n- Mozilla Thunderbird configuration\n- SSL IMAP\
    \ and POP3 settings\n- NON-SSL IMAP and POP3 settings\n\n# IMAP in action\n\n\
    # ## Objectives\n\nAfter studying this chapter, you will be able to:\n\n- Send\
    \ e-mails from MuleSoft connector\n- Use IMAP and POP3 kind of protocols\n- Send\
    \ attachment with e-mails\n\n# Introduction\n\nSending e-mails after completing\
    \ any process is inevitable in enterprise integration. The e-mails may contain\
    \ sensitive information. In this chapter, let us see how we can use MuleSoft connector.\n\
    \n# E-mail connector_usage\n\nLet us see the steps involved one by one. Let us\
    \ try to send an e-mail through a free server, like G-mail. Create a dummy e-mail\
    \ account for testing purposes as shown in figure 5.1. \n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_168_0)\n\
    \n| First name | Last name |\n| --- | --- |\n| mulesofttest | mulesoft |\n| Username\
    \ | |\n| mulesofttest | @gmail.com |\n\n| Password | Confirm |\n| --- | --- |\n\
    | Mypass!#123 | Mypass!@123 |\n\nPlease choose a stronger password. Try a mix\
    \ of letters, symbols.\n\n**Figure 5.1:** Create a dummy e-mail account for testing\
    \ purposes\n\nWe have created the preceding e-mail id for testing purposes.\n\n\
    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_169_0.png)\n\n# Figure 5.2: E-mail settings\n\
    \nThen create an EMailDemo Mule project in Anypoint Studio. Create a Listener\
    \ event trigger and add a Send E-mail component.\n\nIn the connector configuration\
    \ you have to provide the following values:\n\n```\nname=\"Email_SMTP\"\n```\n\
    \n# Email SMTP\n\nConfiguration for operations that are performed through the\
    \ SMTP (Simple Mail Transfer Protocol) protocol.\n\n```\nname=\"Email_SMTP\"\n\
    host=\"smtp.mail.com\",\nuser=\"mulesofttest@gmail.com\",\npassword=\"Mypass!@123\"\
    \nport=\"587\"\n```\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_170_0.png)\n\n\
    # Figure 5.3: E-mail SMTP StartTLS enabling\n\nNow go to the Advanced tab as shown\
    \ in figure and using the properties edit option, add a new e-mail property and\
    \ set the value to\n\nThe final configuration XML will be as follows:\n\n```xml\n\
    name=\"Email_SMTP\" doc:name=\"Email SMTP\" doc:id=\"a6ae9968-5a6c-4104-aec7-\"\
    \ >\nhost=\"smtp.mail.com\" user=\"mulesofttest@gmail.com\"\npassword=\"Mypass!@123\"\
    \ port=\"587\">\n>key=\"mail.smtp.starttls.enable\" value=\"true\" /\n```\n\n\
    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_171_0.png)\n\n# Figure 5.4: E-mail fields\n\
    \nLet us set the values required to send e-mail. As shown in the figure and set\
    \ the following values:\n\n```\ndoc:name=\"Send\"\n```\n"
