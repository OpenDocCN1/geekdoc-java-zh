    />\n  </xs:sequence>\n</xs:complexType>\n\n<xs:complexType name=\"SayHelloResponse\"\
    >\n  <xs:sequence>\n    <xs:element name=\"HelloResponse\" type=\"tns:helloResponse\"\
    />\n  </xs:sequence>\n</xs:complexType>\n```\n\n图 4.18：探索 WSDL\n\n探索 WSDL，它可以通过以下路径访问。\n\
