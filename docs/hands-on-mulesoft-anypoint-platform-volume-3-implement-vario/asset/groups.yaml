    \ panel, now your DB is up and Window running.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_64_0.png)\n\
    \n![](img/b37db39e68b5c0bef5ff8f878466ecb7_65_0.png)\nCome back to Anypoint Studio\
    \ and click the Test Connection button, and you can find the connection is established.\n\
    \n## Understanding MuleSoft connector configuration and basic DB operation\n\n\
    Let us try to understand how the connectors are designed to get the connection\
    \ from the respective applications and will perform a rudimentary DB operation\
    \ to start with.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_66_0.png)\nFigure\
    \ 2.10: Inspecting Config XML entries\n\nInspect the config XML file, and you\
    \ can see the preceding entries.\n\n```\nname=\"dbSelectFlow\" doc:id=\"c1560de2-3f36-422a-8aa3-4409fec31be\"\
    \ndoc:name=\"Scheduler\" doc:id=\"1b146f79-443c-4e57-8f14-8b7a7f8baad\"\nfrequency=\"\
    10\" timeUnit=\"\"/>\"/>\nSELECT * FROM APP.CUSTOMER FETCH FIRST 1000 ROWS ONLY\n\
    ```\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_67_0.png)\n### Figure 2.11: Including\
    \ transformer component\n\nIntroduce a transformation component to read the results\
    \ in JSON format, as shown in figure:\n\ndoc:name=\"Transform Message\" doc:id=\"\
    1f286513-6beb-4f47-a585-82326e6e8a7a\" >\n\n```\n2.0\noutput application/json\n\
    payload\n```\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_68_0.png)\n### Figure\
    \ 2.12: Running the project and checking DB values in console\n\nYou are all set\
    \ to run, make sure you have a scheduler, select component, and a logger with\
    \ payload, run the project and experience the result as shown in the figure.\n\
    \n### Modules and connectors\n\nHaving understood a connector configuration with\
    \ a working example, let us revisit the available connectors and how to browse\
    \ through various connectors. We can also try to examine module operations and\
    \ connector configurations pertaining to.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_69_0.png)\n\
    ### Figure 2.13: Understanding other modules\n\nBrowse multiple modules, add to\
    \ your project, drag and drop the operations into flows to understand how they\
    \ are designed. Check your project structure and POM file.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_70_0.png)\n\
    Click in exchange to browse more modules that do not come by default. You need\
    \ to provide your Anypoint credentials. We can similarly search for SharePoint,\
    \ Kafka, JIRA, and so on.\n\n### Figure 2.15: Choosing and downloading modules\n\
    \nYou can see the connector status, as shown in figure.\n\n### Figure 2.16: Checking\
    \ the added modules in project\n\nRead a file of your choice from the preceding\
    \ screen that we have added Salesforce, Workday, connectors for testing purposes,\
    \ and find these dependencies in the project explorer.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_72_0.png)\n\
    ### Figure 2.17: Checking the added modules in Palette\n\nYou can select the module\
    \ to add it to canvas, and examine the properties of that component.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_73_0.png)\n\
    ### Figure 2.18: Checking configuration details\n\nAccess Token must be provided\
    \ to establish a connection with the app. These connection parameters vary among\
    \ the rest of apps.\n\n```\n<scheduler doc:name=\"Scheduler\" doc:id=\"78be7e4c-724c-4a9b-a119-bd0a471964\"\
    >\n  <strategy frequency=\"10\" timeUnit=\"SECONDS\"/>\n</scheduler>\n<dbselect\
    \ doc:name=\"Select\" doc:id=\"21189b0f-5c80-470f-ab90-2b62975e4c2\" config-ref=\"\
    Database_Config\">\n  <dbsql><![CDATA[SELECT * FROM APP_CUSTOMER FETCH FIRST 100\
    \ ROWS]]></dbsql>\n</dbselect>\n<ee:transform doc:name=\"Transform Message\" doc:id=\"\
    c323b4be-2880-4c93-ad83-f29fa0848ee\">\n  <ee:message>\n    <ee:set-payload><![CDATA[2.0\n\
    output application/json\npayload]]></ee:set-payload>\n  </ee:message>\n</ee:transform>\n\
    <logger level=\"INFO\" name=\"Logger\" doc:id=\"ad8ce11-ccf0-4e47-9272-81f47b44d34\"\
    \ message=\"${payload}\"/>\n```\n### Figure 2.19: Final Config XML\n\nHave a look\
    \ at your final config file. This selection is done using a dynamic scheduler.\n\
    \n### Passing dynamic parameters to sql query and iterating results\n\nWe need\
    \ to pass values to our flow using a query parameter or post method, so let us\
    \ convert this flow as an HTTP listener.\n\n```\n<dbconfig name=\"Database_Config\"\
    \ docname=\"Database_Config\" docid=\"d0938818-e513-4a76-9253-b8da064294d7\">\n\
    \  <dbjdbcconnection url=\"jdbc:derby://localhost:3306/client\" classname=\"org.apache.db.jdbc.ClientDriver\"\
    \ user=\"app\" password=\"app\"/>\n  <config name=\"HTTP_listener_Config\" docname=\"\
    HTTP_listener_Config\" docid=\"62f910d3-f9d3-48f5-b8f5-a45ed9b4a9\">\n    <listener\
    \ connectionUrl=\"http://localhost:8085\"/>\n    <flow name=\"DBInload\" docid=\"\
    52f7b0d0-a6e4-4256-b536-72f9732777\" config-ref=\"HTTP_listener_Config\" path=\"\
    /db\">\n      <db:select name=\"Select_City\" docname=\"Select_City\" docid=\"\
    c7a1a3b0-3075-4ef1-92d1-c635411b2c7\" config-ref=\"Database_Config\">\n      \
    \  <query>SELECT CITY, EMAIL FROM APP_CUSTOMER FETCH 1000 ROWS ONLY</query>\n\
    \      </db:select>\n    </flow>\n  </config>\n  <db:sets>\n    <messages>\n \
    \     <transform name=\"JSON_Transform\" docid=\"d57a00b2-3675-4788-a821-e3d4f516394\"\
    >\n        <payload>application/json</payload>\n        <output>application/json</output>\n\
    \      </transform>\n      <set-payload>\n        <content><![CDATA[{\"payload\"\
    :$message.payload[0]\"}]]></content>\n      </set-payload>\n    </messages>\n\
    \    <logger>\n      <logger level=\"INFO\" name=\"Logger\" docid=\"d57a00b2-3675-4788-a821-e3d4f516394\"\
    \ message=\"${payload}\"/>\n    </logger>\n  </db:sets>\n</dbconfig>\n```\n###\
    \ Figure 2.20: Config XML file for HTTP listener\n\nWe have introduced an HTTP\
    \ listener with port number 8085, and the endpoint is DB.\n\nAlso, we are fetching\
    \ only two values like city and e-mail.\n\nRun this project and call the endpoints\
    \ from the postman.\n"
