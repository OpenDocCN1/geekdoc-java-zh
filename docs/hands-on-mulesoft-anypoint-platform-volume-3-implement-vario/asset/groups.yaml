    # Object store testing


    Follow these instructions to test the bank loan object store project we have developed.
    Run the project now.


    Hit the following URLs:


    - http://localhost:8081/store?loanID=1234&&loanStatus=Success

    - http://localhost:8081/store?loanID=1235&&loanStatus=Pending

    - http://localhost:8081/store?loanID=1236&&loanStatus=Success

    - http://localhost:8081/store?loanID=1237&&loanStatus=Processing

    - http://localhost:8081/store?loanID=1238&&loanStatus=Rejected


    These keys and values will be added to the object store.


    - http://localhost:8081/retrieve?loanID=1234. — get the status of loan ID.

    - http://localhost:8081/retrieveall. — get all keys and values.

    - http://localhost:8081/remove?loanID=1238. — remove key 1238.

    - http://localhost:8081/contains?loanID=1236. — you will get a yes or no.

    - http://localhost:8081/clear. — removes all values from object store.


