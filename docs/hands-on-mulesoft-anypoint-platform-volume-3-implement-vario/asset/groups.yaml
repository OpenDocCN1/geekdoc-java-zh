    \nFigure 4.9: Getting the NetBeans response from Anypoint Studio\n\nSimilarly,\
    \ create a project in Anypoint Studio, and you can call the Web service running\
    \ in NetBeans through an HTTP request component and display the payload in PostMan.\n\
    \n![](img/b37db39e68b5c0bef5ff8f878466ecb7_142_0.png)\n\n# Figure 4.10: Creating\
