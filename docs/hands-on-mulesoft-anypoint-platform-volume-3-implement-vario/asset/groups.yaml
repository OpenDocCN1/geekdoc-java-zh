- md: "\n# Objectives\n\nAfter studying this unit, you will be able to learn:\n\n\
    - What scripting engine is\n- How to integrate with script engines\n- How to execute\
    \ Groovy, Python, Ruby, and ECMAScript engines from MuleSoft\n\n# Introduction\n\
    \nOther than the routine MuleSoft programming, there may be a need for custom\
    \ code creation via different script engines for various business needs such as\
    \ asynchronous executions of larger batch jobs, file reads, logger monitoring,\
    \ MuleSoft directory access, and so on. MuleSoft comes out with a scripting component\
    \ using which we can link the scripting engines such as Groovy, Python, Ruby,\
    \ and ECMAScript into our flow to achieve specific business paradigms. Let us\
    \ see how to execute these kinds of script codes from MuleSoft flows.\n\n# Scripting\
    \ engine\n\nThere are a lot of differences between programming language and scripting\
    \ languages, the way it is written and executed and the purpose they solve. For\
    \ example, the JavaScript language need not have a compiler; you write a series\
    \ of commands, and an in-built JavaScript engine that is embedded into your browser\
    \ can start executing the commands you have written. This is the same in the case\
    \ of scripting languages such as Jython, Groovy, and Ruby. Whereas a programming\
    \ language like Java needs a compiler and an interpreter for compiling and executing\
    \ the binaries.\n\nWhen it comes to usage, the scripting languages will be used\
    \ for larger non-transactional activities where there is no need of applying a\
    \ lot of efforts such as memory management, object storage, transactions, acknowledements,\
    \ persisting object states, and so on.\n\nImagine a practical scenario like a\
    \ project handling larger file collection that means, from various parts of the\
    \ world, the files are generated and dumped in a file system in a larger volume,\
    \ say a million of tiny files per second. In this case, the architecture design\
    \ of the project is not demanding maintenance of transactional details like from\
    \ where the file is written into the system or should the file any transactional\
    \ ID so that when reading the file, the transaction IDs must be carried inside\
    \ the database.\n\nInstead, the design may insist on just reading the file, inserting\
    \ the contents in a database and deleting the files. In this case, there is no\
    \ need of using an object-oriented or memory and resource-hungry programming language\
    \ because the heap memory of that programming language may go for a toss. So,\
    \ in this case, if that programming language delegates these kinds of “do and\
    \ forget” tasks to a scripting programming script, then the efficiency also will\
    \ be improved, and complex transactional and memory-related situations can be\
    \ avoided.\n\n# Execute ECMA scripts\n\nOracle Nashhorn ECMA script comes by default\
    \ with MuleSoft, so there is no need to make any additional set-up; let us see\
    \ the steps involved in executing ECMA scripts.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_238_0.png)\n\
    \n**Figure 9.1:** Create MuleSoft flows and bring in the scripting component\n\
    \nCreate a Mule flow as shown in figure and add the **Scripting** module and bring\
    \ it to the canvas as shown.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_239_0.png)\n\
    \nFigure 9.2: Configuring ECMA scripting engine\n\nSelect the **Engine** from\
    \ the canvas in the properties panel, choose the Engine as **Oracle Nashorn**\
    \ and provide the **print** statement, as shown in figure.\n\nYour completed flow\
    \ code must look like this. Call this from browser or postman using the endpoint\
    \ localhost:8081/Nashorn, and you can see the engine got invoked, and the corresponding\
    \ values are printed in browser and console.\n\n```xml\nname=\"nashornFlow\" doc:id=\"\
    af7474c9-b833-4482-93d1-acoe2752c5b4\"\ndoc:name=\"Listener\" doc:id=\"05452d74-b3be-402a-be3c-4bb9da52872b2\"\
    \ config-ref=\"HTTP_Listener_config\" path=\"nashorn\"/\nengine=\"ECMAScript\"\
    \ doc:name=\"Execute\" doc:id=\"cb698e1e-64fe-4064-8e30-9990e8eb2f89\" >\n\n```\n\
    >ORACLE NASHORN ECMASCRIPT SCRIPTING\nENGINE********************');]]>\nvalue=\"\
    ORACLE NASHORN ECMASCRIPT ENGINE CALLED\"\ndoc:name=\"Set Payload\" doc:id=\"\
    e555334d-442d-4a5b-bda6-ac271df11e5\" />\n```\n\n# Execute Groovy, Python, and\
    \ Ruby scripts\n\nFor Groovy, Python, and Ruby, we need to do the following entries\
    \ in the POM file.\n\nAdd the following entries in your POM dependency section.\n\
    \n```xml\norg.codehaus.groovy\ngroovy-all\n2.4.16\nindy\norg.ruby\njyruby-core\n\
    9.2.11.1\norg.python\njnython-standalone\n2.7.2\n```\n\n```xml\n<dependency>\n\
    \  <groupId>org.mule</groupId>\n  <artifactId>mule-plugin</artifactId>\n  <version>2.0.0</version>\n\
    </dependency>\n<dependency>\n  <groupId>org.codehaus.groovy</groupId>\n  <artifactId>groovy-all</artifactId>\n\
    \  <version>2.4.16</version>\n  <type>indy</type>\n</dependency>\n<dependency>\n\
    \  <groupId>org.ruby</groupId>\n  <artifactId>jyruby-core</artifactId>\n  <version>9.2.11.1</version>\n\
    </dependency>\n<dependency>\n  <groupId>org.python</groupId>\n  <artifactId>jnython-standalone</artifactId>\n\
    \  <version>2.7.2</version>\n</dependency>\n```\n\nFigure 9.3: POM file entries\
    \ for Groovy, Python, and Ruby dependencies\n\nOpen the POM file and check in\
    \ the design tab; your entries must be reflected, as shown in figure.\n\nAdd the\
    \ following shared libraries entries to your POM build section:\n\n```xml\norg.apache.maven.plugins\n\
    maven-clean-plugin\n3.0.0\norg.mule.tools.maven\nmule-maven-plugin\n${mule.maven.plugin.version}\n\
    true\norg.codehaus.groovy\ngroovy-all\norg.python\njython-standalone\n```\n\n\
    ```xml\norg.jruby\njruby-core\n```\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_243_0.png)\n\
    \nFigure 9.4: Adding shared entries for Groovy, Python, and Ruby\n\nAfter adding\
    \ the library entries, your POM should reflect as shown in figure. Go to the project,\
    \ and create another flows and follow the same steps we used for the ECMA script.\n\
    \n```xml\n<listener name=\"Listener\" config-ref=\"HTTP_Listener_config\" path=\"\
    nashorn\"/ engine=\"ECMAScript\" doc:name=\"Execute\" doc:id=\"cb698e1e-64fe-4064-8e30-9990e8eb2f89\"\
    \ >\n\n```\n>ORACLE NASHORN ECMASCRIPT SCRIPTING\nENGINE********************');]]>\n\
    value=\"ORACLE NASHORN ECMASCRIPT ENGINE CALLED\"\ndoc:name=\"Set Payload\" doc:id=\"\
    e555334d-442d-4a5b-bda6-ac271df11e5\" />\n```\n\n<flow name=\"Groovy\">\n  <listener\
    \ name=\"Listener\" config-ref=\"HTTP_Listener_config\" path=\"groovy\"/>\n  <execute\
    \ engine=\"Groovy\" doc:name=\"Execute\">\n    <script><![CDATA[println('FROM\
    \ GROOVY SCRIPTING ENGINE')]]></script>\n  </execute>\n  <set-payload value=\"\
    GROOVY ENGINE CALLED\" doc:name=\"Set Payload\" />\n</flow>\n\n<flow name=\"Python\"\
    >\n  <listener name=\"Listener\" config-ref=\"HTTP_Listener_config\" path=\"python\"\
    />\n  <execute engine=\"python\" doc:name=\"Execute\">\n    <script><![CDATA[print('FROM\
    \ PYTHON SCRIPTING ENGINE')]]></script>\n  </execute>\n  <set-payload value=\"\
    PYTHON ENGINE CALLED\" doc:name=\"Set Payload\" />\n</flow>\n\n<flow name=\"Ruby\"\
    >\n  <listener name=\"Listener\" config-ref=\"HTTP_Listener_config\" path=\"ruby\"\
    />\n  <execute engine=\"ruby\" doc:name=\"Execute\">\n    <script><![CDATA[puts('FROM\
    \ Ruby SCRIPTING ENGINE')]]></script>\n  </execute>\n  <set-payload value=\"RUBY\
    \ ENGINE CALLED\" doc:name=\"Set Payload\" />\n</flow>\n```\n\nFigure 9.5: Setting\
    \ up MuleSoft flows for Groovy, Python, and Ruby\n\nAfter creating another three\
    \ different flows for Groovy, Python, and Ruby, your script will look like this.\
    \ Now call all engines triggering the following endpoints and check the result\
    \ in browser and console. The results are shown in:\n\n- http://localhost:8081/groovy\n\
    - http://localhost:8081/nashorn\n- http://localhost:8081/jyton\n- http://localhost:8081/ruby\n\
    \n```\n****From GROOVY SCRIPTING ENGINE******\nINFO 2021-05-09 21:13:18,123 [http-03\
    \ SelectorRunner] org.mule.service.impl.util.DefaultReque:\nINFO 2021-05-09 21:13:18,245\
    \ [http-03 SelectorRunner] org.mule.service.impl.util.DefaultReque:\n***From ORACLE\
    \ NASHORN ECMASCRIPT SCRIPTING ENGINE***\n***From PYTHON JYTHON SCRIPTING ENGINE***\n\
    ***From RUBY SCRIPTING ENGINE***\n```\n\nFigure 9.6: Invoking all ECMA Groovy,\
    \ Python, and Ruby scripts result\n"
  mdcn: "\n\n# 目标\n\n学习本单元后，你将能够学习：\n\n- 什么是脚本引擎\n- 如何与脚本引擎集成\n- 如何在 MuleSoft 中执行\
    \ Groovy、Python、Ruby 和 ECMAScript 引擎\n\n# 简介\n\n除了常规的 MuleSoft 编程外，根据各种业务需求，可能需要通过不同的脚本引擎创建自定义代码，例如大型批处理作业的异步执行、文件读取、日志记录监控、MuleSoft\
    \ 目录访问等。MuleSoft 提供了一个脚本组件（scripting component），通过它，我们可以将脚本引擎（如 Groovy、Python、Ruby\
    \ 和 ECMAScript）连通到我们的工作流（flow）中，以实现特定的业务范式。让我们看看如何从 MuleSoft 流中执行此类脚本代码。\n\n#\
    \ 脚本引擎\n\n编程语言与脚本语言在编写方式、执行方式以及它们解决的问题上存在许多差异。例如，JavaScript 语言不需要编译器；你编写了一系列命令，嵌入到浏览器中的内置\
    \ JavaScript 引擎就可以开始执行你编写的命令。Jython、Groovy 和 Ruby 等脚本语言也是如此的。而像 Java 这样的编程语言则需要编译器和解释器来编译和执行二进制文件。\n\
    \n在用法方面，脚本语言将用于较大的非事务性活动，这些活动不需要投入大量精力进行内存管理、对象存储、事务、确认、持久化对象状态等。\n\n想象一个实际场景：一个项目处理大型文件集合，这意味着从世界各地产生并向大量丢到文件系统中的文件，例如每秒百万个小文件。在这种情况下，项目的架构设计不需要维护事务细节，例如文件是从哪里写入系统的，或者文件是否应该带有某个事务\
    \ ID，以便在读取文件时事务 ID 必须携带在数据库中。\n\n相反，设计可能仅要求读取文件、将内容插入数据库并删除文件。在这种情况下，没有需要使用面向对象或消耗内存和资源的编程语言，因为该语言的堆内存可能会被耗尽。因此，在这种情况下，如果该编程语言将此类“只完不顾”的任务委托给脚本程序，那么效率也将提高，并且可以避免复杂的事务和内存相关问题。\n\
    \n# 执行 ECMA 脚本\n\nOracle Nashhorn ECMA 脚本随 MuleSoft 默认，因此不需要任何额外的设置；让我们来看执行 ECMA\
    \ 脚本的步骤。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_238_0.png)\n\n**图 9.1:**\
    \ 创建 MuleSoft 流并引入脚本组件\n\n如图所示创建一个 Mule 流，并添加 **Scripting** 模块，将其所示拖入画布。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_239_0.png)\n\
    \n图 9.2: 配置 ECMA 脚本引擎\n\n在属性面板中从画布上选择 **Engine**，将引擎选择为 **Oracle Nashorn**，并如图所示提供\
    \ **print** 语句。\n\n你完成的流代码必须看起来像。从浏览器或 Postman 使用端点 `localhost:8081/Nashorn` 访问它，你可以看到引擎被触发，相应的值在浏览器和控制台中打印出来。\n\
    \n```xml\nname=\"nashornFlow\" doc:id=\"af7474c9-b833-4482-93d1-acoe2752c5b4\"\
    \ndoc:name=\"Listener\" doc:id=\"05452d74-b3be-402a-be3c-4bb9da5287b2\" config-ref=\"\
    HTTP_Listener_config\" path=\"nashorn\"/engine=\"ECMAScript\" doc:name=\"Execute\"\
    \ doc:id=\"cb698e1e-64fe-4064-8e30-99908eb2f89\" >ORACLE NASHORN ECMASCRIPT SCRIPTING\
    \ ENGINE******value=\"ORACLE NASHORN ECMASCRIPT ENGINE CALLED\"doc:name=\"Set\
    \ Payload\" doc:id=\"e55334d-442d-4a5b-bda6-ac21df115 />\n```\n\n## Groovy, Python\
    \ 和 Ruby\n\n对于 Groovy、Python 和 Ruby，我们需要在 POM 文件执行以下操作。\n\n在你的 POM dependency\
    \ 部分中添加以下项：\n\n```xml\n<dependency>\n  <groupId>org.codehaus.groovy</groupId>\n\
    \  <artifactId>groovy-all</artifactId>\n  <version>2.4.16</version>\n</dependency>\n\
    <dependency>\n  <groupId>org.ruby</groupId>\n  <artifactId>ruby-core</artifactId>\n\
    \  <version>9.2.11</version>\n</dependency>\n<dependency>\n  <groupId>org.python</groupId>\n\
    \  <artifactId>jython-standalone</artifactId>\n  <version>2.7.2</version>\n</dependency>\n\
    ```\n\n图 9.3: Groovy、Python 和 Ruby 的 POM 项\n\n打开 POM 文件并在 design 标签中检查；你的项必须如图所示。\n\
    \n在你的 POM build 部分添加以下共享库：\n\n```xml\n<plugin>\n  <groupId>org.apache.maven.plugins</groupId>\n\
    \  <artifactId>maven-clean-plugin</artifactId>\n  <version>3.0.0</version>\n</plugin>\n\
