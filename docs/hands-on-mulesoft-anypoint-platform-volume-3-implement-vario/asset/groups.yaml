- md: "\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_76_0.png)\n\n**Figure 2.21:** Fetching\
    \ records through HTTP listener through PostMan\n\nHere is the result of the select\
    \ statement call through the PostMan.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_77_0.png)\n\
    \n# Figure 2.22: Posting dynamic parameters to SQL script\n\nThe next important\
    \ requirement is passing a where condition value dynamically from HTTP call to\
    \ MuleSoft flow.\n\nThe preceding screen shows how to assign dynamic values to\
    \ SQL queries.\n\nIn the input parameters we have to define the payload variable\
    \ and query variable assignment as follows:\n\n> * FROM APP.CUSTOMER where customer_id=:payload_id\n\
    \n# #[{{'payload_id' : payload.id/db}}]\n\n| POST | http://localhost:8081/ | Pre-request\
    \ Script | Tests | Settings |\n|---|---|---|---|---|\n| Params | Authorization\
    \ | Headers (9) | Body . | | |\n| none | form-data | x-www-form-urlencoded | raw\
    \ | binary | GraphQL JSON |\n\n```json\nBody Cookies (3) Test Results\nPretty\
    \ Raw Preview Visualize JSON\n{\n  \"firstName\": [\n    \"N\"\n  ],\n  \"lastName\"\
    : [\n    \"95117\"\n  ],\n  \"age\": [\n    100000\n  ]\n}\n```\n\n**Figure 2.23:**\
    \ PostMan call by posting dynamic value\n\nThe result of passing dynamic value\
    \ through HTTP call is shown in figure\n\n# Figure 2.24: Config XML file after\
    \ setting the dynamic value\n\nThe complete config file for setting the dynamic\
    \ value to SQL script is shown in figure\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_79_0.png)\n\
    \nYou can also introduce a \"for-each-scope\" for each of the payloads that you\
    \ are getting from a select query, and you can iterate each row as shown in figure\n\
    \n```xml\n<dbconfig name=\"Database_Config\" docname=\"DatabaseConfig\" id=\"\
    cd91018-e13d-4a76-9fb3-0bd6d4d2e947\">\n  <dbgeneric-listener name=\"HTTP_listener\"\
    \ listenerconfig=\"Database_Config\" url=\"jdbc:postgresql://localhost:5432/sample\"\
    \ driverClassName=\"postgresql.ClientDriver\" user=\"pass\">\n    <http:listener\
    \ name=\"HTTP_listener\" listenerconfig=\"Database_Config\" driverClassName=\"\
    org.apache.commons.dbcp4\" id=\"d1899-dc641-4040-89f5-a4b15b6394d\">\n      <http:connection-pool\
    \ name=\"HTTP_pool\" dbname=\"5d2f08b2-a06e-4a56-b2d9-e2109772727\">\n       \
    \ <listener:config name=\"listener\" docid=\"e3d60db5-f315-4a00-82ce-f93112b8\"\
    \ config-ref=\"HTTP_config\" path=\"/db\">\n          <db:sql id=\"CODATA\">SELECT\
    \ * FROM APP_CUSTOMER_FETCH FIRST 1000 ROWS ONLY</db:sql>\n        </listener:config>\n\
    \        <ee:foreach name=\"For Each\" docid=\"c52e7780-b5f1-41d0-ae71-c75261526c3\"\
    \ collection=\"#payload\">\n            <ee:process name=\"Transform Message\"\
    \ docid=\"5d60a5b3-81e8-4097-ae81-c35b4892c2\">\n              <ee:message>\n\
    \                <output application/json>\n                  <ee:set payload=\"\
    {\n                    firstname: payload.DISCOUNT_CODE,\n                   \
    \ lastname: payload.ZIP,\n                    age: payload.CRED_LIMIT\n      \
    \            }\"/>\n                </output>\n              </ee:message>\n \
    \           </ee:process>\n          </ee:foreach>\n        </ee:message>\n  \
    \      <logger level=\"INFO\" docname=\"logger\" docid=\"057a00b2-5075-4a78-a01-e228bf6516394\"\
    \ message=\"#payload\" />\n      </http:listener>\n```\n\nFigure 2.26: Config\
    \ file for iterating records using for each\n\nThe complete config file for for-each\
    \ component figure\n\n# Understanding cache scope implementation\n\nIn our previous\
    \ volumes, we have not spoken about cache scope because the cache scope can be\
    \ understood using a single array list, or this can be better understood using\
    \ a proper DB call. Moreover, in practical scenarios, cache scope will be tightly\
    \ depend on the object store component. So, it is better to understand cache behavior\
    \ along with a real-time DB example.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_81_0.png)\n\
    \nFigure 2.27: Creating a caching strategy\n\nNow let us create a caching strategy\
    \ by specifying the payload id as the key to be cached.\n\nWhen given a key expression,\
    \ the caching mechanism will fetch the values directly from DB for all queries\
    \ having the same payload id. Let us assign this caching strategy to our select\
    \ flow.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_82_0.png)\n\nFigure 2.28:\
    \ Completed flow after referring to caching strategy\n\nNow, in the preceding\
    \ canvas, you can see two logger components and one select statement inside the\
    \ cache. This means if you pass a payload id the first time it will get processed\
    \ inside the cache, and no logger output is seen in the console. Whereas if you\
    \ call the select query one more using the same payload id, the query will not\
    \ get executed by hitting the DB; instead, the values will be printed from the\
    \ cache. You can refer to the following screenshot to check caching action:\n\n\
    ```\nINFO 2021-03-09 12:25:43,119 [MuleRuntime.uber:01:cachingStrategy-7693046]\
    \ [processor: dbcacheFlow/processors/0]\nINFO 2021-03-09 12:25:43,269 [MuleRuntime.uber:05:dbcache1][dbcacheFlow.BLOCKING\
    \ @eee6e5] [processor: dbcacheFlow/processors/1]\nINFO 2021-03-09 12:25:43,373\
    \ [MuleRuntime.uber:05:dbcache1]:dbcacheFlow.CPU_INTENSIVE @34db25f3] [processor:\
    \ dbcache1]\nmule.runtime.core.internal.LoggerMessageProcessor: {\n  \"FirstName\"\
    : [\n  \"lastName\": [\n    \"95117\"\n  ],\n  \"age\": [\n    100000\n  ]\n}\n\
    INFO 2021-03-09 12:25:46,636 [MuleRuntime.uber:02:dbcache1]:dbcacheFlow.CPU_INTENSIVE\
    \ @34db25f3] [processor: dbcache1]\nmule.runtime.core.internal.LoggerMessageProcessor:\
    \ {\n  \"FirstName\": [\n  \"lastName\": [\n    \"95117\"\n  ],\n  \"age\": [\n\
    \    100000\n  ]\n}\n```\n\nFigure 2.29: Checking cache scope results in the console\
    \ output\n\nThe highlighted portion shows the first DB call for a specific payload\
    \ id. Now hit the endpoint using the same payload id you can see the logger messages\
    \ before and after DB will not be printed, which means the DB is not getting queried;\
    \ instead, the values are getting printed from the cache.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_84_0.png)\n\
    \n# Figure 2.30: Invalidating strategy\n\nAlso, you have to understand how to\
    \ invalidate a caching strategy. Introduce a invalidate caching strategy component\
    \ at the end of each flow, as shown in figure. Now select the strategy you want\
    \ to invalidate based on certain conditions; here, we did not apply any condition\
    \ because we just want to explain how invalidate cache is functioning.\n\n```\n\
    INFO 2023-08-09 12:34:56,729 [MuleRuntime.uber:17:cachingstrategy.null @a643f53]\
    \ [processor: dbcacheFlow/processors/8/8]; event: a3993758-08w5-11mule.runtime.core.internal.LoggerMessageProcessor]:\
    \ Before df\nINFO 2023-08-09 12:34:56,735 [MuleRuntime.uber:15:dbcacheFlow.BLOCKING\
    \ @b793152] [processor: dbcacheFlow/processors/8/2]; event: a39937-mule.runtime.core.internal.LoggerMessageProcessor]:\
    \ After df\nINFO 2023-08-09 12:34:56,708 [MuleRuntime.uber:15:dbcacheFlow.CPU_INTENSIVE\
    \ @a6bdd66] [processor: dbcacheFlow/processors/2/2]; event: a3993758-08w5-11mule.runtime.core.internal.LoggerMessageProcessor]:\
    \ After df\n{\n  \"instance\": {\n    \"id\": [\n      \"95117\"\n    ],\n   \
    \ \"100000\"\n  }\n}\n```\n\n# Figure 2.31: Checking the invalidate caching results\n\
    \nThe preceding screenshot, you can see for each and every duplicate payload id;\
    \ the DB is getting called because we have invalidated that particular cache.\
    \ Please keep in mind that the cache design does not end here; we have one more\
    \ complex caching functionality along with the ObjectStore component, which we\
    \ will explore soon.\n\n# Database operations such as insert, update, DDL, script,\
    \ and stored procedure\n\nLet us quickly go through the DB operations, which are\
    \ available and how to invoke them and check the results back in the DB.\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_86_0.png)\n\
    \nFigure 2.32: Adding a row through NetBeans IDE\n\nLet us insert a row from NetBeans\
    \ IDE. You can find the plus button to insert a record using a form dialogue.\
    \ You can enter values of your choice and click Show\n"
  mdcn: "\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_76_0.png)\n\n**图 2.21：** 通过\
    \ PostMan 通过 HTTP 监听器获取记录\n\n以下是通过 PostMan 调用 `select` 语句执行的结果。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_77_0.png)\n\
    \n# 图 2.22：向 SQL 脚本发布动态参数\n\n下一个重要要求是从 HTTP 调用动态地将 `where` 条件值值传递到 MuleSoft 工作流中。\n\
    \n上一个屏幕显示了如何为 SQL 查询分配动态值。\n\n在输入参数中，我们必须按照如下方式定义 payload 变量和查询变量赋值：\n\n> * FROM\
    \ APP.CUSTOMER where customer_id=:payload_id\n\n# #[{{'payload_id' : payload.id/db}}]\n\
    \n| POST | http://localhost:8081/ | 预请求脚本 | 测试 | 设置 |\n|---|---|---|---|---|\n\
    | 参数 | 授权 | 请求头 (9) | 主体 | | |\n| 无 | form-data | x-www-form-urlencoded | 原始 |\
    \ 二进制 | GraphQL JSON |\n\n```json\nBody Cookies (3) Test Results\nPretty Raw Preview\
    \ Visualize JSON\n{\n  \"firstName\": [\n    \"N\"\n  ],\n  \"lastName\": [\n\
    \    \"95117\"\n  ],\n  \"age\": [\n    100000\n  ]\n}\n```\n\n**图 2.23：** 通过发布动态值的\
    \ PostMan 调用\n\n通过 HTTP 调用传递动态值的结果如图所示。\n\n# 图 2.24：设置动态值后的 Config XML 文件\n\n\
    为 SQL 脚本设置动态值的完整配置文件如图所示。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_79_0.png)\n\
    \n你也可以为从 `select` 查询中获取的每个 payload 引入 \"for-each-scope\"，并可以如图所示遍历每一行：\n\n```xml\n\
    <dbconfig name=\"Database_Config\" docname=\"DatabaseConfig\" id=\"cd91018-e13d-4a76-9fb3-0bd6d4d2e947\"\
    >\n  <dbgeneric-listener name=\"HTTP_listener\" listenerconfig=\"Database_Config\"\
    \ url=\"jdbc:postgresql://localhost:5432/sample\" driverClassName=\"postgresql.ClientDriver\"\
    \ user=\"pass\">\n    <http:listener name=\"HTTP_listener\" listenerconfig=\"\
    Database_Config\" driverClassName=\"org.apache.commons.dbcp4\" id=\"d1899-dc64-4040-89f5-a4b15b6394d\"\
    >\n      <http:connection-pool name=\"HTTP_pool\" dbname=\"5d2f08b2-a06e-4a56-b2d9-e2109772727\"\
    >\n        <listener:config name=\"listener\" docid=\"e3d60db5-f315-4a00-82ce-f93112b8\"\
    \ config-ref=\"HTTP_config\" path=\"/db\">\n          <db:sql id=\"CODATA\">SELECT\
    \ * FROM APP_CUSTOMER_FETCH FIRST 1000 ROWS ONLY</db:sql>\n        </listener:config>\n\
    \        <ee:foreach name=\"For Each\" docid=\"c52e7780-b5f1-41d0-ae71-c75261526c3\"\
    \ collection=\"#payload\">\n            <ee:process name=\"Transform Message\"\
    \ docid=\"5d60a5b3-81e8-4097-ae81-c35b4892c2\">\n              <ee:message>\n\
    \                <output application/json>\n                  <ee:set payload=\"\
    {\n                    firstname: payload.DISCOUNT_CODE,\n                   \
    \ lastname: payload.ZIP,\n                    age: payload.CRED_LIMIT\n      \
    \            }\"/>\n                </output>\n              </ee:message>\n \
    \           </ee:process>\n          </ee:foreach>\n        </ee:message>\n  \
    \      <logger level=\"INFO\" docname=\"logger\" docid=\"057a00b2-5075-4a78-a01-e228bf6516394\"\
    \ message=\"#payload\" />\n      </http:listener>\n```\n\n图 2.26：使用 for each 迭代记录的配置文件\n\
    \n图中 for-each 组件的完整配置文件\n\n# 深入 cache scope 的实现\n\n在我们之前的卷册中，我们没有讨论过 cache scope（缓存范围），因为可以使用单个\
    \ array list 来理解 cache scope，或者通过适当的 DB 调用来更好地理解它。此外，在实际场景中，cache scope 将紧密依赖\
    \ object store（对象存储）组件。因此，结合实时数据库示例来理解缓存行为更好。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_81_0.png)\n\
    \n图 2.27：创建缓存策略\n\n现在让我们通过指定 payload id 为要缓存的键来创建一个缓存策略。\n\n当给出一个键表达式时，缓存机制将为所有具有相同\
    \ payload id 的查询直接从数据库获取值。让我们将此缓存策略分配到我们的 `select` 工作流中。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_82_0.png)\n\
    \n图 2.28：参考缓存策略后的完成工作流\n\n现在，在之前的画布中，你可以看到 cache 内部有两个 logger 组件和一个 `select` 语句。这意味着如果你第一次传递\
    \ payload id，它将在 cache 内部处理，且控制台中看不到 logger 输出。而如果你再次使用相同的 payload id 再次调用 `select`\
    \ 查询，查询将不会通过访问数据库来执行；相反，值将从缓存中打印。你可以参考以下截图来检查缓存操作：\n\n```\nINFO 2021-03-09 12:25:43,119\
    \ [MuleRuntime.uber:01:cachingStrategy-7693046] [processor: dbcacheFlow/processors/0]\n\
    INFO 2021-03-09 12:25:43,269 [MuleRuntime.uber:01:cachingStrategy-7693046] [processor:\
    \ dbcacheFlow/processors/0]\n```\n\n2021-03-09 12:25:43,119 [MuleRuntime.uber:01:cachingStrategy-7693046]\
    \ [processor: dbcacheFlow/processors/0]\n2021-03-09 12:25:43,269 [MuleRuntime.uber:01:cachingStrategy-7693046]\
    \ [processor: dbcacheFlow/processors/0]\n（注：此处根据上下文逻辑对日志内容进行了对齐并保持格式一致）\n\n**图\
    \ 2.23：通过发布动态值的 PostMan 调用**\n\n通过 HTTP 调用传递动态值的结果如图所示。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_89_0.png)\n\
    \n 图 2.24：设置动态值后的 Config XML 文件\n\n为 SQL 脚本设置动态值的完整配置文件如图所示。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_79_0.png)\n\
    \n你也可以为从 `select` 查询中获取的每个 payload 引入 \"for-each-scope\"，并可以如图所示遍历每一行：\n\n（代码块保持不变）\n\
    \n图 2.26：使用 for each 迭代记录的配置文件\n\n图中 for-each 组件的完整配置文件\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_81_0.png)\n\
    \n图 2.27：创建缓存策略\n\n现在让我们通过指定 payload id 为要缓存的键来创建一个缓存策略。\n\n当给出一个键表达式时，缓存机制将为所有具有相同\
    \ payload id 的查询直接从数据库获取值。让我们将此缓存策略分配到我们的 `select` 工作流中。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_82_0.png)\n\
    \n图 2.28：参考缓存策略后的完成工作流\n\n现在，在之前的画布中，你可以看到 cache 内部有两个 logger 组件和一个 `select` 语句。这意味着如果你第一次传递\
    \ payload id，它将在 cache 内部处理，且控制台中看不到 logger 输出。而如果你再次使用相同的 payload id 再次调用 `select`\
    \ 查询，查询将不会通过访问数据库来执行；相反，值将从缓存中打印。你可以参考以下截图来检查缓存操作：\n\n（代码块保持不变）\n\n**图 2.29：缓存范围的作用**\n\
    \n在之前的屏幕图中，你可以看到对于每一个重复的 payload id；数据库都会被调用，因为我们使了特定的缓存失效。请记住，缓存设计并未此结束；我们还有与\
    \ ObjectStore 组件配合的更复杂的缓存功能，很快就会探讨。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_89_0.png)\n\
    \n# 图 2.30：失效策略\n\n此外，你必须理解如何失效缓存。在工作流末尾引入失效缓存组件，如图所示。现在根据某些条件失效策略；这里我们没有应用任何条件，只是想解释失效缓存是如何工作的。\n\
