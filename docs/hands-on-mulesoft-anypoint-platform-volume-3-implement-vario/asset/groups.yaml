    \n图 12.3：使用 new 和 invoke 组件调用 Java 程序的公共方法\n\n## 结论\n\n在本章中，我们使用 MuleSoft Java\
    \ 连接器连接到了外部 Java 程序。连接成功后，我们使用了 `invoke-static` 组件调用静态 Java 方法，并使用 `new` 和 `invoke`\
    \ 组件调用非静态方法。本卷的最后一章将是对象存储（Object Store）。\n\n## 重点\n\n- 在你自己的 Java 程序中创建不同的静态和非静态方法并尝试调用它们。\n\
    - 尝试用 Java 开发一个邮件发送程序并集成到 MuleSoft 流中，并观察为什么要引入单独的 Java 邮件程序，以及使用 MuleSoft 提供的邮件连接器时有哪些局限性。\n\
    - 尝试在本地系统中实现一些 Groovy 脚本，并创建一个 Java 程序以多线程方式执行它们，看看它是如何解决某些 ETL 相关的性能问题的。\n\n\
    ## 关键术语探索\n\n- Java 程序的静态方法\n- Java 程序的公共方法\n- New 和 invoke 组件\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
    \n- 对象存储配置\n- 向对象存储添加键值对的操作\n- 从对象存储中获取值的操作\n- 从对象存储中获取所有值的操作\n- 从对象存储中移除特定值\n\
    - 从对象存储中获取所有键\n- 检查对象存储中是否存在某个键\n- 清空对象存储内容\n\n## 目标\n\n学习本单元后，你将能够：\n\n- 缓存和对象存储的使用模式\n\
    - 在 MuleFlow 中实现对象存储\n\n## 配置对象存储\n\n对象存储通过实现键值对机制用于存储大型的集中分布式集群环境负载，而缓存作用域（cache\
    \ scope）仅用于存储可重复的静态负载请求（如 SQL 查询或文件请求）。对象存储是随 MuleSoft 一带的模块，并在 CloudHub 中以 SaaS\
    \ 版本可用。这意味着对象存储可以被视为独立的云端负载分配存储，企业的所有应用程序都可以通过 CloudHub 对象存储版本 2 获取共享负载。\n\n让我们看看对象存储模块提供的集成方面和操作。\n\
    \n- 创建 HTTP listener 端节点并向项目添加对象存储模块。\n- 引入 store 组件并在对象存储连接器中提供前面的细节。\n\n在下面的配置中，如图所示，我们配置了\
    \ 100 条记录，有效期为一天。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_291_0.png)\n\n###\
    \ 图 13.1：对象存储配置\n\n持久（persistent）复选框用于表示对象存储条目的本地驱动器存储；取消选中将导致内存存储，这意味着存储的数据在重启后将不可用。\n\
    \n```\nname=\"BankLoan_HTTP_Listener_config\" doc:name=\"HTTP Listener config\"\
    \ > host=\"o.o.o.o\" port=\"8081\" />\n```\n\n```\nname=\"BankLoanStore doc:name=\"\
    Object store\" entryTtl=\"1\" entryTtlUnit=\"DAYS\" maxEntries=\"50\" />\n```\n\
    \n一旦完成配置，如图所示提供键（Key）和值（Value）\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_292_0.png)\n\
    \n### 图 13.2：向对象存储添加键值的操作\n\n监听配置将产生如下 URL：\n\n```\nname=\"loanStoreFlow\" >\n\
