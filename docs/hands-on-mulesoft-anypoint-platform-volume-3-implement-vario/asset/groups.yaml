    All trademarks referred to in the book are acknowledged as properties of their
    respective owners but BPB Publications cannot guarantee the accuracy of this information.


    # Dedicated to


    Rathi Shravanti Shashank


    # About the Author


    Nanda Nachimuthu is an Engineering graduate from Tamil Nadu Agricultural University,
    Coimbatore, Tamil Nadu, and has done Advanced Diploma from the Indian Institute
    of Technology, Kharagpur in the field of Java and Internet Computing. He has also
    completed an Advanced Diploma from the Indian Institute of International Trading,
    Delhi which specializes in Strategies for International Business. Also, he is
    a WHRPC honorary Doctorate awardee in the Computer Science field.


    He 25 years of experience comes from various domains like Banking, Healthcare,
    Government, and Airlines. He is into the technologies like Java, Big Data, Cloud,
    ESB, Security, and IoT. He played various roles like Technical Architect, Solutions
    Architect, Cloud Architect, and Enterprise Integration Architect and wanted to
    be in an Individual Contributor role always with hands-on coding experience.


    He is passionate about Social Entrepreneurship and Pro Bono consultations in multiple
    fields like Information Technology, Manufacturing, Trading, Agriculture, and the
    Internet of Things.


    He is the founder of some social platforms and he owns a few trademarks under
    his kitty.


    Presently, he is focusing on Integration Technology Platforms like MuleSoft where
    he finds lots of scope in the future for Digital Marketing and Machine to Machine
    Communications.


    # About the Reviewers


    With over 24 years of experience in the IT industry, Vinoth Kumar is an Enterprise
    Architect specializing in Cloud, AI/ML, Robotics, Blockchain, SOA, and Web technologies.
    He is an IBM-certified Websphere integration developer and provides solutions
    for IBM, Oracle, and Mule SOA platform products. Vinoth Kumar has experience in
    Cloud migrations, Enterprise application integration, Data analytics using Artificial
    Intelligence/Machine Learning, and Blockchain solutions using Web3, Ethereum,
    and Hyperledger. With his rich experience in Cloud, IoT, Artificial Intelligence,
    and Robotics, he is focusing on Industry 4.0 framework to build smart factories.


    Arul ChristhruRaj Alphonse is an Integration Architect, Consultant, and Integration
    Developer, who has particular interest in all topics related to Integration, Cloud
    & API. He has also been the best seller instructor on Udemy for his courses on
    MuleSoft and SoftwareAG webMethods many times.


    He is recognized as a MuleSoft Mentor and is a MuleSoft Certified Developer -
    Level1, MuleSoft Certified Integration Architect & MuleSoft Certified Platform
    Architect. He loves teaching MuleSoft, to get learners ready for their MuleSoft
    certifications and most importantly for solving real-time problems. He is recognized
    as a top Mule community contributor more than five times in a row.


    He also has a passion for SoftwareAG webMethods. He has been working on webMethods
    since 2006. He is also an active member of the webMethods tech community, sharing
    technical videos on YouTube in his Techlightning channel.


    During his spare time, he enjoys cooking, watching TV shows, and traveling to
    awesome destinations!


    # Acknowledgement


    Even though I too came from a rich technical background and am with MuleSoft since
    its inception, when the API Led Connectivity paradigm shift started it was difficult
    for me to cope up with the mission and vision of the entire Platform Architecture.
    I too have struggled to understand the futuristic implementation approaches of
    the MuleSoft team.


    Then I started taking a deep dive into the entire MuleSoft ecosystem to find out
    some of the key technical aspects of MuleSoft. I understood after 2-3 years how
    the MuleSoft Integration Platform will become the most sought after Integration
    approach after thoroughly studying the Centre for Enablement, Machine to Machine
    communications, IoT implementations and even more.


    When I started following the MuleSoft updates provided in the form of Meetups
    or LinkedIn tutorials, I felt that there must be a book available for the audience
    who are not much aware of the Enterprise Integration Practices but they can become
    an API designer or Business Analyst, given a chance, provided if they have some
    initial rudimentary knowledge, and this book.


    So at this point in time, when beginning the Mastering MuleSoft Series, I would
    like to thank the active MuleSoft community, be it the meet-ups, blogs, LinkedIn
    materials, independent tutorial providers, and many other MuleSoft activists.


    Without their contributions and web presence, it would have been practically difficult
    for me to design and write this Mastering MuleSoft series.


    Thanks again Muleys!


    # Preface


    According to my opinion, it is not so easy for an upcoming technical or business
    candidate to get a chance to work with advanced system integration scenarios.
    Imagine a financial integration scenario where information like sales invoices
    is flowing across the SaaS systems like SAP and Financial Force. It is difficult
    or practically not possible for many of the freshers to get a chance to work on
    these applications set up. Especially when most of the cloud-based SaaS applications
    are securely deployed, licensed and community-based.


    So, system integration and enterprise architecture are still new to many of the
    fresh and averagely experienced candidates. The exposure to many of these SaaS
    applications and understanding of their API models will be playing an important
    role in the future if you want to get into the roles like API Designer and API
    Developers.


    It is important to get to know the concepts like web services before trying to
    read about the APIs exposed by SaaS systems. We need to have a strong understanding
    of web services like REST and SOAP because we will be defining the specifications
    for web services in the future as API designers. Moreover, the API specifications
    developed by our team will be for handshaking SaaS applications, Legacy applications,
    Mobile devices, machine-to-machine communications, etc.


    So it is important for the audience of this book to understand that they will
    become an integral part of a larger enterprise architecture rather than working
    on a particular project, product, or service layer.


    Over the 10 chapters in this book, you will learn the following:


    - Chapter 1 application API details, MuleSoft Connectors, Connectors provided
    by MuleSoft through Anypoint platform, Adding Connectors to Project.

    - Chapter 2 Apache Netbeans, Derby, DB connector, DB operations, DDL, Cache, On
    Table Row

    - Chapter 3 File Connector Module, File Connector Configuration, File Read Component,
    File Write Component, File List Component, File Attributes, Delete Component,
    Move Component, Copy Component, Create Directory Component, Rename Component,
    New or Updated File

    - Chapter 4 Basic Web Application Project, Server Settings, Getting the Netbeans
    Response From Anypoint Studio, HTML5 application, Web Services from Netbeans,
    Web services project, WSDL, Webservice Consumer component, Invoking WSDL, input
    parameters, Invoking web services, multiple web service operations.

    - Chapter 5 EMail SMTP, EMail SMTP starttls enabling, Less security option in
    Gmail settings, File Attachment, Enabling IMAP and POP3 access, SMTP IMAP and
    POP3 Configurations, Mozilla

    '
