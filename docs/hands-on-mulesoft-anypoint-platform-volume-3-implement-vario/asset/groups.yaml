    # SOAP WebService 连接器


    # 结构


    在本章中，我们将讨论以下主题：


    - Web 应用程序的基础是什么

    - 在 NetBeans 中创建新项目

    - 选择基础 Web 应用程序项目

    - 项目名称和位置

    - 服务器设置

    - 默认索引页

    - 在浏览器中运行索引页

    - 在 PostMan 中检查响应

    - 从 Anypoint Studio 获取 NetBeans 响应

    - 使用 NetBeans 创建 HTML5 应用

    - 运行 HTML 5 应用


    # 探索应用


    - Web 服务的基础

    - 从 NetBeans 创建 Web 服务

    - 探索 Web 服务项目

    - 运行 Web 服务

    - 探索 WSDL

    - WebServices 和 MuleSoft

    - 使用 Web 服务消费者组件

    - 探索 WSDL

    - 在无输入参数的情况下调用 WSDL

    - 向 WebServices 提交输入参数

    - 通过 PostMan 获取响应

    - 调用本地开发的 NetBeans Web 服务

    - 通过转换器组件向 Web 服务发送值

    - 在 PostMan 中检查 Web 服务响应

    - 调用托管在  上的 Web 服务

    - 检查可用的多个 Web 服务操作

    - 转换组件设置


    # 目标


    学习本章后，你将能够：


    - 区分 SOAP 和 REST Web 服务

    - 使用 NetBeans IDE 了解 SOAP 的基础

    - 通过 MuleSoft SOAP Web 连接器调用 SOAP Web 服务


    # 引言


    如果你学习过第 1 卷和第 2 卷，你对 RESTful API 服务有了相当的了解。现在我们将介绍另一种 Web 服务模型，即简单对象访问协议（Simple
    Object Access Protocol），它用于通过 Web 服务调用进行复杂对象的传输。


    Web 服务无非是通过 RESTful 和 SOAP 等标准协议在 Web 上提供特定功能的服务；在这里，REST 被用作一种架构模式而不是像 SOAP 那样的协议；因此，它变得轻量级并且可以通过简单的
    URL/URIs 轻松访问。而 SOAP 本身是一种协议，它需要一个符合 XML 格式的 Web 服务接口。


    # SOAP Web 服务基础


    首先，让我们使用 NetBeans 创建一些 Web 项目并理解 SOAP Web 服务的知识。


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_134_0.png)


    图 4.1：在 NetBeans 中创建新项目


    进入 NetBeans 并创建一个新项目。


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_135_0.png)


