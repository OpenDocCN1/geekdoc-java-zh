    We have seen all operations related to object store in this chapter. This is our
    last chapter in the Hands-on MuleSoft Anypoint Platform Volume-III. Our upcoming
    fourth volume will talk about SaaS connectors for MuleSoft such as Google Drive,
    Google Sheets, Google Calendar, Google Maps, Google Analytics, Google Ad Manager,
    Box, FB, Linkedin, Twitter, Slack, Stripe, Quartz, PayPal, Hadoop, MongoDB, Cassandra,
    Kafka, and so on. After completing the fourth volume assignments, you will be
    getting thorough knowledge about all flavors of MuleSoft connectors.


