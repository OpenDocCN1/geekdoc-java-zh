    \n# 图 4.19：在没有输入参数的情况下调用 WSDL\n\n如果你按原样调用 SOAP Web 服务，将收到一个错误消息，显示没有输入参数的 hello\
    \ 服务不存在，因此我们需要向 SOAP Web 服务传递所需的参数。\n\n![](img/b37db39e68b5c0bef5ff8f878466ecb7_151_0.png)\n\
    \n# 图 4.20：向 Web 服务提交输入参数\n\n需要为 SOAP Web 服务提供以下转换代码作为输入：\n\n```dw\n%dw 2.0\n\
    output application/xml\nns nso http://learnwebservices.com/services/hello\n---\n\
    {\nnso#SayHello : {\nnso#HelloRequest : {\nnso#Name: \"James\"\n}\n}\n}\n```\n\
    \n```json\n{\n  body:<SayHelloResponse xmlns=\"http://learnwebservices.com/services/hello\"\
    ><HelloResponse><Message>Hello James!</Message></SayHelloResponse>\n  headers:\
    \ [],\n  attachments: []\n}\n```\n\n 图 4.21：通过 PostMan 获取响应\n\n现在你可以看到 Web 服务正在连同你的输入参数返回响应。\n\
    \n![](img/b37db39e68b5c0bef5ff8f878466ecb7_153_0.png)\n\n**图 4.22：** 调用本地开发的 NetBeans\
    \ Web 服务\n\n现在，你已经知道如何调用 SOAP Web 服务以及如何传递输入参数了。\n\n让我们调用在 NetBeans IDE 中运行的本地计算器\
