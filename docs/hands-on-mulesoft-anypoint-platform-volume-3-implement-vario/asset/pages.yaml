    its inception, when the API Led Connectivity paradigm shift started it was difficult
    for me to cope up with the mission and vision of the entire Platform Architecture.
    I too have struggled to understand the futuristic implementation approaches of
    the MuleSoft team.


    Then I started taking a deep dive into the entire MuleSoft ecosystem to find out
    some of the key technical aspects of MuleSoft. I understood after 2-3 years how
    the MuleSoft Integration Platform will become the most sought after Integration
    approach after thoroughly studying the Centre for Enablement, Machine to Machine
    communications, IoT implementations and even more.


    When I started following the MuleSoft updates provided in the form of Meetups
