- img_proc: true
  md: 'Create a project and bring in a scheduler, then add the VM module to the project
    and add a publish component.


    In the connector configuration, choose general, queues, queues edit inline options.


    Enter a new queue name, and transient must be the default option for queue type;
    leave it as it is.


    Max outstanding messages can be 100.


    ```

    name="VM_Config" doc:name="VM Config" doc:id="78001dfe-41d7-43c2-9fod-7f6c6fb6do6"
    />

    queueName="test" maxOutstandingMessages="100" />

    queueName="test1" maxOutstandingMessages="100" />

    queueName="test2" maxOutstandingMessages="100" />

    ```'
  merge: -1
