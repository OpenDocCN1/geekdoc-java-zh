  md: '# Starting the VM queue implementation


    Let us start implementing the VM queue for a MuleSoft project by configuring the
    VM and using the publish and consume future. The steps are given as follows:


    # VM Config


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_187_0.png)


