  md: '# # Anypoint Connector Development


    This document quickly walks you through the decisions to make and the steps to
    get an Anypoint Connector development project started, get the connector working,
    and enhance it with the functionality you need. You can use this as a roadmap
    for your connector development effort.


    # ## Prerequisites


    This document assumes you are familiar with the Anypoint Connector Development
    and have installed the appropriate versions of DevKit, the Anypoint Connector
    Plugin and Maven as specified in Setting Up Your Environment.


    # ## Outline of the Connector Development Process


    When you develop a connector using DevKit, your use cases drive a series of decisions
    about what the connector will do, how it will receive and send data to the external
    application or other resource. These choices, in turns, drive what you develop.
    Where a choice exists, this document provides information to help you make a decision
    and provides links to the process details.


    ![](img/b37db39e68b5c0bef5ff8f878466ecb7_43_0.png)'
