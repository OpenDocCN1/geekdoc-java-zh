  md: '# Configuring object store


    Object store is used for storing large size centrally distributed cluster environment
    payloads by implementing a key and value pair mechanism, whereas cache scope is
    only a technique used for storing repeatable static payload requests like SQL
    queries or file requests. The object store is a module that comes along with MuleSoft,
    and it is available as a SaaS version in CloudHub. This means object store can
    be treated as a separate cloud-based payload distribution storage where all applications
    of enterprise can get the shared payload via CloudHub object store version 2.


    Let us see the integration aspects and operations available in object store module.


    Create an HTTP listener endpoint and add object store module to the project.


    Bring in a store component and provide the preceding details in object store connector.


    In the following configuration, as shown in figure we have configured 100 entries
    to live up to a day time.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '![](img/b37db39e68b5c0bef5ff8f878466ecb7_291_0.png)


