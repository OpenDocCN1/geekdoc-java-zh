    Figure 5.8: SMTP IMAP and POP3 configurations


    Your SMTP, POP3, and IMAP configuration are completed.


    But if you try to use POP and IMAP, you will get an error message because POP
    and IMAP are used to read the entire messages in a particular folder, and you
    can delete the messages based on a keyword, or you can forward the messages to
    any other e-mail ids.


    That means you have SMTP for simple mail transfer and IMAP and POP for managing
    the entire mailbox programmatically. So, a public e-mail server server like G-mail
    will not allow you to use POP and IMAP.'
