  md: '# Introduction


    If you have studied Volumes 1 and 2, you will have a fair idea about RESTful API
    services. Now we are going to cover one more Web service model that is Simple
    Object Access Protocol which is used for complex object transfers over a Web service
    call.


    A Web service is nothing but a service that serves a particular functionality
    over the Web using standard protocols as RESTful and SOAP; here, REST is used
    as an architectural pattern rather than a protocol like SOAP; hence, it becomes
    lightweight and easily accessible through simple URL/URIs. Whereas, SOAP itself
    is a protocol and requires a proper XML formatted Web service interface.'
  merge: -1
