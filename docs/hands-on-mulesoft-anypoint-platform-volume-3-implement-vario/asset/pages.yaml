  md: '# Mock project wireframe and endpoints design


    Before drilling down into connectors in detail, let us try to mock an imaginary
    banking application. Let us assume we have a virtual bank as our client; the bank
    provides loans for its customers based on their credit score. The wireframe of
    the project will normally show the process involved in disbursing the loan.


    Let us list the process flow involved in the banking loan application as follows:


    Customer applies for a loan by providing his personal/ finance kind of details.


    Bank should verify his personal details and finances details, and the bank should
    calculate his credit score based on the details verified.


    If verification is successful, the loan approver can finalize the approval limit
    of the loan.


    Next will be the dispersal process if the customer agrees to the bank’s conditions.


    Once the amount is disbursed, the repayment schedule will start on that loan.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'If repayment is not happening as per banks’ norms, a collection process will
    be initiated.


    If the collection process also fails, then a legal process will be initiated.


    By initiating a legal process, some financial settlements may happen. This settlement
    results in the closure of the entire loan process.


    The following block diagram shows the overall view of the processes involved.
    The next step will be designing the endpoints for this loan'
  merge: -1
