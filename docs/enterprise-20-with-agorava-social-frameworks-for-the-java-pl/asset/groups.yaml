    No, this is not a non-twister of \"JSR 375\", although many security aspects had\
    \ been planned, especially a tight integration with CDI so quite familiar [30].\n\
    \n## Digital Identity \n\n### Who is No.6?\n\nA question from the famous 1960s\
    \ Sci-Fi series \"The Prisoner\" where No.6 tries to find out his identity and\
    \ that of others holding him captive; both users of social media services and\
    \ the systems often stumble into identity crisis.\n\nEspecially the biggest players\
    \ in Social Media often face major problems when it comes to authentication and\
    \ the true identity of their users.\n\n## Privacy\n\nThe term privacy comes from\
