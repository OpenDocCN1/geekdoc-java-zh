    Social Security {#social-security .DPHeading1} 28


    Although OpenID has so far not been standardised by an organisation IETF, many
    large Internet, Social and Telex players like it, AOL, Flickr, Blogger, France
    Telecom, Google, Ives, LiveJournal, Microsoft, Mixi, Myspace, Novell, Orange,
    Sun, Telecom Italia, Telefonica O2, Universal Music Group, VerisSign, WordPress
    or Yahoo!


    Over times like SourceForge, PayPal or Facebook joined supporters of OpenID under
    the OpenID Foundation. However, in the last 2-3 years there''s a steady decline
    in OpenID supporters. Facebook left OpenID, SourceForge also stopped offering
    an OpenID login (at the very after Dice took it from Geeknet) and in September
    2013 Social Login SaaS provider Janran announced that its service MyOpenID.com
    would be shut down on February 1, 2014.


    So does mean OpenID is dead? More or less in its original form, but at least still
    Google has hopes for it. Strange coincidence, the initial creator of OpenID, Brad
    Fitzpatrick now works at Google, possibly a main reason why the remained remained
    OpenID, when most former supporters abandoned it. OpenID Connect, Google''s new
    approach has however not that much in common with the old version of OpenID. It
    adds improved authentication and Identity Management on top of the otherwise winning
    combination of Oauth 2, JSON and RESTful Web Services.


    OpenID Connect was released just at the end of February 2014. Beside Google, Microsoft,
    Sales-force.com or Deutsche Telekom adopted it so far. At Mobile World Congress
    2014 in Barcelona GSMA announced plans for a mobile version "Mobile Connect".
    Even suggesting this "flavour of OAuth" may also stay for some time.


    # Security Frameworks {#security-frameworks .DPHeading2}


    There are several Java-based security frameworks aside from base technologies
    like JAAS (Java Authentication and Authorization Service) supporting authorisation,
    authentication or both:


    +   - Scribe

    - PickettLink (by JBoss)

    - Apache Shiro

    - Spring Security (formerly Acegi)

    - Google OAuth for Java

    - Socialauth

    - JSR 375


    # Scribe


    The Scribe project has built-in support for many popular services that use OAuth,
    such as Facebook, Twitter, Google or LinkedIn. It has very few external dependencies,
    mainly Apache Common Code,'
