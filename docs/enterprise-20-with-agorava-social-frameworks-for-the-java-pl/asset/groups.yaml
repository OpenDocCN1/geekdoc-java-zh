  mdcn: "\n\n## 社会安全\n\n图 7 - OAuth 2 “之舞”\n图 7 展示了 OAuth 2 的流程。你可以看到通信已经变得简化，而且每次交换必须经过\
    \ SSL 加密。在 OAuth 1.0 中，这是可选的，因此大多数实现案例都忽略了它。相比之下，OAuth 2 面临着更大的被拦截或篡改的风险。\n\n\
    ## 身份验证\n\n- 1.\n\n“Authentication”（身份验证）一词也源自希腊语术语。它源自希腊语“aftentikos”，是名词“authentes”（执行者、主宰）的派生词，而该词由“autos”（自我）和词根\
    \ -hentes（执行者、存在者）组成。\n\n虽然是社交媒体和 API 目前最流行的身份验证方式，但 OAuth 并非真正的身份验证，而是“伪身份验证”，应用程序专门请求一个限制的访问令牌（“管家钥匙”）而非真实的凭据（如“护照”），请参见图\
    \ 8 和图 9。\n\n### OpenID\n\nOpenID 协议最初由 Brad Fitzpatrick 在 2005 年创建，在他将社交网络 LiveJournal\
    \ 卖给这家博客公司之后。这个名字似乎与“Six Degrees of Separation”（六度隔阂）有六天的区别，但它最初代号为 Yadis（“另一种身份系统”的缩写），随后在\
    \ David Cohn 曾考虑过类似的单点登录项目后被正式命名为 OpenID，并捐赠了 \"openid.net\"  [29]。\n\n**使用 OAuth\
    \ 的伪身份验证**\n- 1. 你是谁。不要忘记你的电子邮箱！\n- 2. 这是证书。请写一封信。\n- 3. 你在这里\n\n### 图 9 - OpenID\
    \ 身份验证\n\n图 10 展示了 OpenID 流程及其参与者\n\n- 浏览器\n- 用户\n- 依赖方 (Relying Party)\n- 身份提供者\
    \ (Identity Provider)\n\n### 图 10 - OpenID 流程\n\n尽管 OpenID 目前尚未由 IETF 标准化，但许多大型互联网和社交玩家如：AOL、Flickr、法国电信、Google、Ives、LiveJournal、Microsoft、Myspace、Novell、Orange、Sun、意大利电信、2、Universal\
    \ Music Group、VerisSign 或 Yahoo! 都加入了 OpenID 基金会。然而，在过去的 3 年里，OpenID 的支持者持续下降。Facebook\
    \ 离开了 OpenID，SourceForge 也停止提供 OpenID 登录，Janran 在 2013 年 9 月宣布其 MyOpenID.com 将于\
    \ 2014 年 2 月 1 日关闭。\n\n这意味着 OpenID 已经死了吗？至少 Google 对它还有希望。巧合的是，OpenID 的创始人 Brad\
    \ Fitzpatrick 现在在 Google 工作，这可能是大多数支持者放弃它的主要原因。OpenID Connect 在 OAuth 2、JSON 和\
    \ RESTful Web 服务这一胜利组合之上增加了改进的身份验证和身份管理。\n\nOpenID Connect 于 2014 年 2 月底发布。除了\
    \ Google、Microsoft、Salesforce 或德国电信已采用了它之外，GSMA 在 2014 年巴塞罗纳移动世界大会上宣布了移动版本“Mobile\
    \ Connect”。这种“OAuth 风格”可能还会持续一段时间。\n\n## 安全框架\n\n除了 JAAS（Java 身份验证和授权服务）等基础技术外，还有几个基于\
    \ Java 的安全框架支持：\n\n- Scribe\n- PicketLink（由 JBoss 提供）\n- Apache Shiro\n- Spring\
    \ Security（原名 Ace）\n- Google OAuth for Java\n- Socialauth\n- JSR 375\n\n### Scribe\n\
    \nScribe 项目内置支持许多使用 OAuth 的流行服务，如 Facebook、Twitter 或 LinkedIn。它的外部依赖很少，允许无缝集成到更大更复杂的解决方案。在\
    \ Scribe 中调用 OAuth 提供者就像下面的单行代码一样简单：\n\n```\nOAuthService = new ServiceBuilder()\n\
    \  .provider(LinkedInApi.class)\n  .apiKey(YOUR_API_KEY)\n  .apiSecret(YOUR_API_SECRET)\n\
    \  .build();\n```\n\n在 Agora 0.6 版本之前，它是其功能的核心。从 Agora 0.7 开始，它被 PicketLink 取代。\n\
    \n### PicketLink\n\nPicketLink 是 Red Hat/JBoss 生态系统中多个相关项目的伞。虽然 Agora 不是 Red Hat\
    \ 官方创建的项目，但它是为了这个生态系统和标准创建的。PicketLink 是一个用于 Java EE 的应用程序安全框架。\n\n以下是 PicketLink\
    \ 解决的 8 个 Java 安全问题：\n\n1. 为应用程序添加安全性的最佳方法是什么？\n2. 我如何验证用户并授权用户？\n3. 我如何控制对类和方法的访问？\n\
    4. 我如何为应用程序添加身份访问管理 (IAM)？\n5. 我如何为我的 SaaS（软件服务）应用程序创建安全的多租户架构？\n6. 我如何在应用程序中启用基于\
    \ SAML（安全断言语言）的单点登录？\n7. 我如何为我的 REST 层添加身份验证和授权？\n8. 我的应用程序如何使用用户的 Facebook、Twitter\
    \ 或 Google 账户进行身份验证？\n\n图 11 展示了 PicketLink 的概述、它支持的关键组件和技术。某些标记为“即将推出”的已经在开发中，但尚未随\
    \ PicketLink 的 GA（通用可用或“稳定”）版本发布。\n\n| 模块 | |\n| :--- | :--- |\n| 基础模块 (Base Module)\
    \ | 身份验证 API、权限 API、基于会话的身份、CDI 集成 |\n| 联邦 (Federation) | IDM |\n| SCIM | SAML\
    \ v1.1, SAML 2.0, WS-Trust |\n| OpenID | 用户、组和角色管理，凭据管理与验证 |\n| 社会 (Social) |\
    \ 社交网络（即将推出） |\n| 身份存储库 (Identity Stores) | 支持 OAuth（即将推出） |\n| 通用 (Common) |\
    \ 通用工具类、日志记录 |\n\n**图 11 - PicketLink 概述**\n\n然而 Agora 使用了 PicketLink 的许多功能，如身份验证\
    \ API 或 CDI 集成。特定的 OAuth 和社交连接由 PicketLink 要素执行。这里是扩展 BaseAuthenticator 的示例：\n\
    \n```java\npublic class SimpleAuthenticator extends BaseAuthenticator {\n  @Inject\
    \ DefaultLoginCredentials credentials;\n  @Override\n  public void authenticate()\
    \ {\n    if (\"agentsmith\".equals(credentials.getUserId()) && \"matrix123\".equals(credentials.getPassword()))\
    \ {\n      setStatus(AuthenticationStatus.SUCCESS);\n      setAccount(new User(\"\
    agentsmith\"));\n    } else {\n      setStatus(AuthenticationStatus.FAILURE);\n\
    \      FacesContext.getCurrentInstance().addMessage(null, new FacesMessage(\"\
    身份验证失败 - 提供的用户名或密码无效。\"));\n    }\n  }\n}\n```\n\n3.2.1 Agora PicketLink 将详细地展示如何通过\
    \ Agora Core 及其 PicketLink 模块应用。\n\n### JSR 375\n\n不，这不是“JSR 375”的误转，尽管许多安全方面已经过计划，特别是与\
    \ CDI 的紧密集成已非常熟悉 [30]。\n\n## 数字身份 \n\n### 谁是 No.6？\n\n这是一个著名的 1960 年代科幻剧《囚犯》中的问题，剧中\
    \ No.6 试图弄清楚自己的身份以及囚禁他的人的身份；社交媒体服务的用户和系统经常会陷入身份危机。\n\n特别是社交媒体领域的巨头在处理身份验证和用户真实身份时经常面临重大问题。\n\
    \n## 隐私\n\nPrivacy（隐私）一词源自“private”，源于拉丁语“privatus”，字面意思是从公共事务中被剥夺。\n\n虽然古代罗马人可能向公众观众和当时的著名作家隐藏他们的某些事务，而且从事情实际发生到写下来被读者阅读之间至少有几天、几个月甚至几年，但现在有时只需要眨眼或点击一下鼠标按钮的时间。\n\
    \n"
