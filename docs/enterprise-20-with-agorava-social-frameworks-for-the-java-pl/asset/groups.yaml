    Two things form the bedrock of any open society - freedom of expression and rule
    of law. If you don''t have those things, you don''t have a free country. - Sir
    Salman Rushdie


    Freedom of expression, when inspired by innocent intent, is the defining force
    behind openness. This powerful force now has new wings to social media. Social
    media grants voice to the unheard all around this divergent little planet of ours
    and we are still beginning to see what it can do - be in Kiev, Moscow, Ferguson,
    Baltimore, Tunis, Cairo, Istanbul, Riyadh, Tehran or Gaza. You would be fooling
    yourself if you don''t think these in the legacy halls of power would not love
    to suppress, subvert and abuse this grassroots force. You need not look much further
    to find evidence of this gritty documentary named Citizenfour and a meek young
    named Edward Snowden.


    One of the many things that pose a serious risk to the openness of social media
    is its far proprietary nature. It would be shocking to deny anyone that there
    are few or no open technical standards in the social media space. There are some
    good reasons for such immunity and a very rapid pace of innovation. There are
    also not very good reasons for such cutthroat competition to monetize social media
    and a resulting lack of interest in mutual cooperation towards openness.


    Hopefully things will change as the social media industry standardizes a bit and
    is more ready for standardization. In the meanwhile community projects like Agora
    have a very important part play. In absence of any real open stores, Agora can
    provide some level of interoperability through a common interface for the divergent
    social media APIs of today - at least for Java and Java EE developers. The project
    is also very significant to the Java EE ecosystem on its own. It demonstrates
    first-hand how CDI extensions can effectively build upon the stable core of the
    Java EE platform where needed while still adhering as closely as possible to the
    principles of interoperability and vendor-neutrality.


    This book is critically important to the project. It provides great background
    of the social media industry, explains the core concepts for Java social media
    developers, describes the so far efforts towards standardization, covers the other
    social media projects, shares the motivation for the project as well as of providing
    a technical overview and deep dive of the Agorava API. Given the volatility, depth
    and complexity of the topic, this book was no doubt a very tough to write.


    To boot I can''t think of a better person than Werner to write the book. He has
    demonstrated his personal commitment to openness, standardization, Java and Java
    EE over many years as well as his clear command of the social media industry and
    Agorava.


    Reza Rahman

    Founder Java EE Guardians Former Java EE Evangelist @ Oracle


    ## Ancient History


    Most people assume social media to be a modern-day invention of companies like
    Yahoo!, Google, MySpace, Facebook and Twitter. In actual fact, social media has
    a history that reaches back over thousands of years.


    To some the postal service was one of the earliest forms of social media. From
    the days of the ancient Persian postal service to the Greek Agora [1] and Roman
    Forum [2], the postal service served as a medium for social and political discussion.
    The first recorded equivalents to Wiki or "Forum posts" were literally carved
    into the walls of Roman Forums [3] Recording events like the destruction of Pompeii
    by Mt. Vesuvius or several parts of Rome under Nero.


    The Ancient Agora of Athens acted as incubator to democracy being a favorite venue
    for social and political debate. Until today, this worked in similar ways the
    forums turned digital. From Tunisia to Ukraine opposition movements used social
    media to bring democracy to places where it''s often been surprised and uncommon
    for a long time. [4]


    ## Modern History


    In 1975, shortly before the American military out of Vietnam, the libertarian
    Samuel Konkin III introduced a philosophy called Agora, a social philosophy of
    counter-economics and the ideas associated with that practice [5]. In a market
    anarchist society, law and security would be provided by market actors instead
    of political institutions. Agorists recognise situation cannot develop through
    political reform. Instead, it will arise as a result of market processes. Its
    social values can be found today the Occupy Movement, its primary goal being to
    make the economic and political relations in all societies less hierarchical and
    more flatly distributed. Or in protest parties like Beppe Grillo in Italy, Syria
    in Greece (where it even took government), Podemus in Spain or the Pirate Parties.
    Agora also put forth the idea of using currencies, something modern social media
    and online communities are adopting with digital currencies like Bitcoin.


    In 1966, the email was invented, followed by the arrival of CompuServe in 1969.
    CompuServe launched its email service in the 80s and expanded into early 90s,
    before finally dissolving original CompuServe in 2009 after several takeovers.


    Usenet started up in 1979 and provided its users with forums and newsgroups. Surprisingly,
    most of their functions have changed very little and still exist today.


    Internet Relay Chat (IRC) began in 1988 and was widely used across academic networks
    before emerging into what is now the Internet. IRC remains quite active today,
