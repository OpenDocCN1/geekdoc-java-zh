    # 标准化


    ![](img/0b9ef25bba76e41e13d568c065fdf1e4_14_0.png)


    标准化


    图 4 - OPENii 概念


    除了上述对社交媒体标准进行剖析和分类外，这些是 API 及相关标准具有的三个最重要的共同点：


    - 几乎所有的社交媒体服务都使用 REST 作为传输协议

    - 它们大部分以 JSON 格式传输数据，部分使用 XML 或其他格式

    - 身份识别与验证几乎总是基于 OAuth 协议


    你会发现图 2 中缺失了像 REST、XML 或 JSON 这样“琐碎”的基础标准，因为 [16] 的作者认为这些内容现在应该已经被掌握。基于此，我也认为读者对这些内容已经很熟悉。


    我们将在第 2 章中详细探讨安全、授权、身份验证或数字身份，以及隐私或数据保护等方面。在学习 Agorava 之前，让我们先来看看相关的社交媒体 API 和框架。


    ## Java 社交


    遵循 Portlet API 或 Java Enterprise 的各个部分等 Java 标准，有几个用于社交媒体的 Java 框架和库。


    1. 1. 1.

    2.


    ### Twitter4j


    Twitter4j 是一个用于 Twitter API 的非官方 Java 库。通过 Twitter4j，你可以轻松地在 Java 应用中集成 Twitter
    调用。


    其作者 Yuki Yamamoto 在 2012 年将其用于 Twitter。在使用期间，他曾被简要提到社交 JSR 专家小组代表 Twitter。更多内容将在稍后介绍……


    它非常轻量级，大部分与 Java 1.4 向后兼容，使其也易于集成到移动应用中。这并不意外，从 JME 到 Android 的任何地方都能找到受其启发的分支或项目，尽管它们的正式程度各不相同。Twitter4j
    是一个 API 绑定库，主要用于消费信息。虽然扩展或你的应用程序可以对其进行分析或转换，但该框架在 Twitter 之外不提供额外支持。根据 Hinchcliffe
    的分类，Twitter4j 可能被视为基础 API，但具有某些高阶特性。


    在编写本文时，官方的 Twitter4j 网站 (twitter4j.org) 由于维护停机或容量问题暂时无法处理请求。无论这是否意味着作者和贡献者缺乏维护，我指向
    GitHub 项目页面 [18]，Twitter 本身不应竞争或强制 GitHub 拒绝。最后更新是在一个月前，其他一些模块在过去 3-8 个月内更新过，因此它可能活跃度不高，但至少看起来维护良好。


    ### Apache Shind


    **Apache Shindid** [19] 在 OpenSocial [15] 计划开始后不久便启动了。由于明显的原因，主要由 Google 及其 Orkut
    驱动，其他贡献者特别是 IBM 后加入。由于 OpenSocial 转向“社交内网”，没有任何声称使用它的网站或软件是确切地做到了这一点。事实上，Google
    Partuza 指向了一个不存在的页面，因此它像我们听过的其他项目一样被关闭了。


    LinkedIn 和大多数其他社交媒体提供商也逐渐或完全地从其网站中放弃了 OpenSocial。


    Google 开发 OpenSocial 应用的一种有趣方法是使用 Eclipse IDE OpenSocial 开发 (OSDE) [20] 的 WYSIWYG
    环境。可以假设部分内容已由 IBM 接管并集成到 RAD 等基于 Eclipse 的社交版开发工具中，而 Google Code 项目最后更新是在 2010
    年 6 月。


    Apache 指出的 OpenSocial 规范似乎不再由 OpenSocial 支持者 Atlassian 托管，链接指向一个错误页面。这究竟意味着 Atlassian
    不相信 OpenSocial 并不会在在其产品的后续版本中使用它，还是仅仅是一个在 W3C 上复兴整个 OpenSocial 运动的过程？在此，所有版本的
    OpenSocial（特别是 1.0 或 2.0）都是失败的，像 Orkut 这样的网站最多使用了 0.7 或 0.8 版本。


    根据支持 OpenSocial 的 Dachis Group [16] 的说法，Shindid 作为体现代表了基础标准 (2c)。它具有**提供**和**消费信息的手段。


    2014 年 9 月 30 日，Google **关闭了** Orkut，使 Google+ 成为唯一的 Google 参考。


    当然，Google 已经停止使用 Shindid，转而使用其自己的 Google Code 项目。其中大部分项目也已关闭，要么指向 OpenSocial 页面，要么已不存在。一年后，2015
    年 10 月 23 日，Apache 基金会**退役了** Shindid 项目。OpenSocial 是否会步其后尘仍待观察，作为 OpenSocial
    的事实性参考实现，这看起来确实是其棺材上的又一个大钉子。


    ## Sun/Oracle 的努力


    2008 年左右，Enterprise Social 推出时，驱动 BEA Systems [13] 刚被 Oracle 收购，Java 的创造者 Sun
    Microsystems 没有给出完全相似的面貌，类似的情况也即将临头。基于 OpenSocial，Sun 从 Apache Shindid 派生出了名为
    **SocialSite** [21] 的分支或项目。


    SocialSite 在 Java.net 上仍有 231 名成员，但该项目处于**非活跃状态**。其中一次提交来自 Kohsuke Kawaguchi，他是
    Sun 的 Hudson 创建者（后由 CloudBees 维护）。在收购 RightNow Technologies 后（见 2011 年底的 [23]）。


    ## 标准化


    原 RightNow 团队被并入 Oracle 社交部门。JavaOne 2012 举办了一场我参加的社交日，当时 Facebook 的开发者经理 James
    Pearce 也出席。Oracle 本身展示了一个由自由承包商编写的“单人”项目，代号为 "Project Sneaker"，该项目在 JavaOne 2012
    之后作为 Oracle Social 发布在 Java.net [24]。它从未吸引 Oracle 之外的追随者，被认为比 SocialSite 更死。


    ### DaliCore


    在 Oracle 接手 Sun 后，被弃的 SocialSite 在 DaliCore [22] 中找到了它的对等物和继者。


    它最初基于一家比利时初创公司制作的 CMS，主要是 BeUG (DevXX) 的成员如 Johan Vos。DaliCMS (2006) 被称为“Web 2.0
    CMS”，是一个具有社区功能的开源项目。2008 年，在 Sun 对 SocialSite 做类似的事情的同时，CMS 与 Shindig 集成。DaliCMS
    使用了来自 Shindig 的 JavaScript 代码和 Java 代码。


    最终它变成不仅仅是一个 CMS，其底层模块转变为 DaliCore。在 JavaOne 2013 的演讲中，他揭晓了“Dali”部分，该项目最初代表的是“荷兰爱好者计划”（Dutch
    Lovers Initiative）。这是对互联网和云先驱 Amazon 的致敬。


    DaliCore 在 Java EE 6 之上增加了用户管理、内容或权限的功能。重点关注用户和权限。在几乎每个使用 DaliCore 的项目中，用户都应该能够使用凭据（Facebook、Twitter、Google、LinkedIn...）登录。因此
    Dali 模块扩展了 DaliCore。虽然与 Facebook 等社交供应商有某些连接，但它们主要作为 DaliCore SSO（单点登录）功能的身份提供者。此外，DaliCore
    旨在提供信息。


    DaliCore 的重要方面：


    - 大多数带有社交功能的社交容器和 CMS

    - 支持 EJB、IPA 或类似的 Java 持久化

    - 模块没有分离，特别是 API/规范与实现，大多数情况下共享同一个模块甚至相同的包空间。这使得复用和扩展变得困难，尽管通过 Dali 模块尝试这样做。

    - 目前显得有些沉，对全 Java EE 栈有强依赖，即目前仅使用其 Web Profile 似乎可行

    - 在 GlassFish 作为首选应用程序服务器的情况下，支持和集成是积极的。对于 Java EE 标准是不可能的，但在其他容器中使用可能更困难。


    '
