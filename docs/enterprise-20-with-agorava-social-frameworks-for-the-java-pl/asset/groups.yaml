    # 引言


    尽管被 Twitter 等即时消息服务掩盖，全球范围内仍有 3200 个 IRC 服务器，提供数十万个通道。


    基于“六度人脉”理论 [6] 的概念，首个现代社交网络 sixdegrees.com 成立于 1997 年。它允许成员将其他成员链接为好友、编写消息或在公告板上发布内容。在出售给另一公司后，它于
    2001 年关闭，当时约有一百万用户。当 Amazon、Yahoo! 和 1998 年的 Google 最初出现时，它们并不被视为社交网络。


    1995 年，微软通过推出微软网络（MSN）捕捉到了新兴趋势。MSN 成为一个“门户网站”而闻名，这是个性化在线商务的另一种说法。几年后，许多门户产品、服务和供应商也加入了社交浪潮，这并不意外。


    微软和雅虎在社交媒体这群“新秀”面前都落后了，与 YouTube 的合作是一次相当明智且快速的举措；社交媒体大多数其他方面也都被 Google 低估了，它通过
    Google+ 回归，并确实在观察是否能主导每一个方面。雅虎也提供了大量的社交功能，并在近期的复苏中，它在网络领域超过了如 Flickr 或 Tumblr
    等较小的供应商。1993 年，Brad Fitzpatrick 现也工作于 Google Livejournal。


    在 21 世纪初，MySpace 和 LinkedIn 出现（尽管多年后它们的地位已大不相同）；到该世纪十年代中期，当当今巨头 Twitter 或 Facebook
    成立时，Google 已经收购了 YouTube。在过去的几年里，我们看到了几次接管，最引人注目的是 Facebook 以近十亿美元的价格收购了 Instagram，以及其对移动消息提供商
    WhatsApp 的巨额收购报价。


    社交网络一直存在，从人类首次开始通信以来就是技术手段随着时间的推移而变化，在不久的将来可能会变化得更快。某些服务将被合并；其他服务可能会变得过时并早晚消失。使用厂商中立的标准和框架至关重要，因为这不会让你被束缚在单一提供者的产品中，除非你愿意花费更多时间在快速变化的
    API 上，而不是将它们用于某些生产性工作。更糟糕的是，当特定供应商提供的私有 API 和框架不再可用时，你不得不切换到另一个提供者。虽然它不是 Twitter
    或 Facebook 意义上的社交网络，但最近关闭的比特币交易网站 Mt.Gox [7] 是这种困境的绝佳例子。它在很一段时间内一直是该领域的领导者，提供比特币的应用程序和电子商务解决方案可能直接使用了它的
    API，现在却被迫抛弃这些应用并重写它们。


    如果在此类 API 之上创建一个厂商中立的抽象层，那么处理由于供应商破产或被他人收购引起的问题和变化将容易得多。


    这就是 Agora 发挥用场的地方。


    # 标准化


    ## 早期方法


    我们在引言中遇到的理论，如“六度人脉”[6]，影响了后来的概念，如“朋中之友”（FOAF）[8]。这两者的方面在当今社交网络使用的大多数“朋友”机制中都能找到。


    富源内容摘要（RSS）[9] 是社交媒体数字形式的早期示例。在参与 RSS 设计和标准化的开发者中，Aaron Swartz 在 2013 年初不幸去世前，曾编写过一本名为《可编程
    Web》[10] 的书，这是该领域非常非常务实、机明的学术论文。


    便携式联系人（Portable Contacts）由 Plaxo 创建，这是一种社交地址录服务，由 Sean Parker 为核心的一群企业家于 2002
    年创立。在它的 Napster 媒体交换门户被强制关闭后，Parker 陷入了法律麻烦，导致大家无法联系到 Aaron Swartz，但幸运的是，如今的多个社交媒体知名品牌不得不以不同的方式来应对这一点。便携式地址录或“数字名片”的概念被整合得很好，特别是从用户的角度来看非常有意义，但竞争对手的商业利益——他们每一个人都贪于分享数据，甚至不与创建它的人分享数据——为这个本意良好的主意设置了重重障碍。尽管
    Plaxo 在多年后仍在运营，但它并不一定是他最成功的作品，投资者以某种方式将他踢出去，这与 Facebook 介入时联合创始人 Eduardo Verin
    所遭遇的情况并不相似。在财务上，这让他变得富有，并排在了其他服务之后——Spotify。似乎并不巧合，它看起来非常像 Napster，但是以更受市场接受的方式呈现，这也得益于他在
    Facebook 之后的名声和财富。便携式联系人曾是社交媒体运动的重要组成部分，但不再被使用。这是因为大型公司内部使用的 API 已不再与便携式联系人兼容。唯一仍在在使用的是
    vCard，它被许多公司和应用程序使用。


    ## 混合（Mashup）


    Java 语言发挥了越来越重要的作用，首先是在桌面端（早期主要是 Java Applets，或 AWT/Swing 独立应用程序），然后在世纪交替之际也出现在服务器端，Sun
    及其其他公司（其中至少 HP 和 IBM 仍在活跃，而 Sun 现在已成为 Oracle 的一部分）开始在所谓的 Java 社区进程（成立于 1998 年）或
    JCP 中对 Java 平台的部分部分进行标准化。


    # 标准化


    在被拒绝或撤回通知后，社交网络（当时常被称为“门户”，早期 MSN 如此称）的显著标准是 JSR 168 Java 门户规范 [11]。在理想的世界中，它允许门户应用程序部署到多个门户服务器中，无论供应商是哪个；通过其他标准，由
    OASIS 定义的 WSRP（远程小部件 Web 服务）为这些应用程序之间的操作性带来了希望。10 年后，随着其他技术和语言（特别是“轻量级容器”）的兴起，Java
    门户标准即将获得 3.0 版本更新（JSR 362），计划纳入一些后来的标准。


    虽然看起来更易用，漏洞和安全问题也随之而来，通常由“脚本小子”或在学校里要要的学生演示如何破坏或入侵这些服务。全面的 Java 企业级应用和小部件仍然很难被攻破，如果系统管理员做好了功课，所有关于
    Java 安全或其被用于传输恶意软件的传言通常影响的是客户端。


    在大多数 OpenSocial 代码运行的地方，它比大多数运行在服务器端或精心混合的服务器端（Java EE 或其他环境）与客户端层（JavaScript）的代码更易暴露，参见图
    N——不同类型 Web 端企业应用程序的分层架构。Java EE，但它可能会被 Python、PHP、Ruby 或 Scala 等语言取代，而层结构是相同的。


    虽然 Google 开始在其 Orkut 服务中使用 OpenSocial（在拉丁美洲和印度等其他几个国家流行），但最初计划支持它的其他供应商相继放弃了这些计划。LinkedIn
    和 XING 特别是出于安全原因这样做的。关于 XING，我们稍后的安全和隐私部分也会有更多内容，后者也是如此。不是 Facebook 或 Twitter，这两个是上个十年后半叶统治者。'
