  mdcn: "\n\n## Agorava\n\nAgora Core 也提供了这些服务的实现。目前主要的实现基于基于 CDI 和 DeltaSpike，但大多数服务已经使用\
    \ JSR 330（依赖注入）进行了泛化，这允许使用轻量级的 Java SE 替代方案，例如 Google Guice、Dagger 或 CDI 实现的 SE\
    \ 版本。\n\n图 14 - Agora Core API 架构\n\n## Agora PicketLink\n\nAgora Core 与 OAuth\
    \ 功能和用户配置谱管理协同工作，包含一个基于 PicketLink 的安全子系统。\n\n正如 2.3.2 中承诺的那样，专门的 Agora 版本的 PicketLinkBaseAuthenticator:@Generic\n\
    \n```java\npublic class AgoraAuthenticator extends BaseAuthenticator { @InjectWithQualifier\n\
    OAuthAppSettings settings; @Inject\n```\n\n## Agora\n\n```java\nDefaultLoginCredentials\
    \ credentials;\n@Inject\n@DeltaSpike\nInstance<HttpServletResponse> response;\n\
    @Inject\nOAuthLifeCycleService lifeCycleService;\n@Override\npublic void authenticate()\
    \ {\nif (lifeCycleService.getCurrentSession().isConnected()) {\nOAuthSession session\
    \ = lifeCycleService.getCurrentSession();\nUserProfile userProfile = session.getUserProfile();\n\
    credentials.setCredential(session.getToken());\nsetStatus(AuthenticationStatus.SUCCESS);\n\
    User user = new User(userProfile.getId());\nuser.setFirstName(userProfile.getFullName());\n\
    setAccount(user);\n} else {\nString authorizationUrl = lifeCycleService.startDanceFor(settings.getQualifier());\n\
    try {\nresponse.get().sendRedirect(authorizationUrl);\n} catch (IOException e)\
    \ {\ne.printStackTrace();\n}\ncredentials.setStatus(Status.IN_PROGRESS);\nsetStatus(AuthenticationStatus.DEFERRED);\n\
    }\n}\n```\n\n## Connectors\n\nAgorava 目前带有连接到以下平台的默认连接器：\n\n- Facebook\n- LinkedIn\n\
    - Twitter\n\n此外，还为以下服务创建了第三方 Agorava 连接器：\n\n- EmpireAvenue\n- GitHub\n- Google+\n\
    - Instagram\n- Meetup\n- StackOverflow\n- Triplit\n- WordPress\n- XING\n- Yammer\n\
    \n### 连接器的剖析\n\n## Socializer\n\nSocializer 是 Agorava 的一个真实世界演示 Web 应用。\n\n它允许你连接到各种社交媒体，并查看你的时间线和发布更新。\n\
    \nSocializer 曾从 Java Server Faces 迁移到 Apache Wicket Web 框架，最近迁移到了 AngularJS。\n\
    \n这两个迁移版本目前仍然具有实验性，因此不是 Agorava 生态系统的正式部分。\n\n### 集成连接器\n\n在 Socializer 中添加新连接器非常简单。我们将以\
    \ XING 连接器为例来说如何操作。\n\n在克隆 https://github.com/agorava/agorava-socializer 后，在 Socializer\
    \ pom.xml 中添加以下行\n\n```xml\n<!-- XING -->\n<dependency>\n  <groupId>org.agorava</groupId><artifactId>agorava-xing-api</artifactId>\n\
    \  <version>0.3.0-SNAPSHOT</version>\n  <scope>compile</scope>\n</dependency>\n\
    <dependency>\n  <groupId>org.agorava</groupId><artifactId>agorava-xing-cdi</artifactId>\n\
    \  <version>0.3.0-SNAPSHOT</version>\n  <scope>runtime</scope>\n</dependency>\n\
    ```\n\n为 XING API 和 CDI 实现定义依赖项。\n接下来，我们在 CDI 生产者类 org.agorava.socializer.SettingsProducer.java\
    \ 中为 XING 添加应用设置。\n\n```java\n@ApplicationScoped\n@Produces\n@Xing\n@OAuthApplication(params\
    \ = {@Param(name = OAuthAppSettingsBuilder.PREFIX, value = \"xing\")})\npublic\
    \ OAuthAppSettings settings;\n```\n\n由属性文件支持\nsrc/main/resources/local/agorava.properties\n\
    xing.apiKey=<your API Key>\nxing.apiSecret=<your API Secret>\n\n对于本地 Socializer\
    \ ，必须在所选的社交媒体账户中定义 API key 和 API secret，XING 请访问 https://dev.xing.com/applications/dashboard。\n\
    \n## Agorava\n\n遗憾的是，有些平台（尤其是 Facebook）现在忽视了对开发者的需求。Facebook 在最新版本 (v2.5) 中的 Graph\
    \ API 也包含一个已弃用的调用。\n\n```xml\n<ui:composition xmlns=\"http://www.w3.org/1999/xhtml\"\
    \nxmlns=\"http://java.sun.com/jsf/facelets\"\nxmlns=\"http://java.sun.com/jsf/core\"\
    \nxmlns=\"http://primefaces.org/ui\">\n<h:panelGroup id=\"xingtli\" layout=\"\
    block\">\n<div class=\"well\">\n<h:outputText>What's on your mind?</h:outputText>\n\
    <p:inputText value=\"#{client.status}\" style=\"post-area\" />\n</div>\n</h:panelGroup>\n\
    </ui:composition>\n```\n\n## 企业社交\n\n有许多社交媒体网站，无论是通用的还是特殊社区，包括前酒精爱好者、音乐迷、外籍人士、学生、教师、政府员工、编织爱好的人士。《五十\
    \ Shades的灰》书和电影可能会为此类列表增加更多色彩。\n\n## 广告与分析\n\n## 位置\n\n## 媒体\n\n## 产品与服务\n\n##\
    \ 简介\n\n## 特长\n\n### 软件开发\n\n### 健康与健身\n\n## 参考文献\n\n1. Agora: http://en.wikipedia.org/wiki/Agora\n\
    2. 论坛: http://en.wikipedia.org/wiki/Forum\n3. 信息历史 – 论坛帖子: http://www.historyofinformation.com/expanded.php?category=Social+Media+Networks\n\
    4. The Role of Social Media in Mobilisation, delineation by Madeline Storck, 2020:\
    \ http://www.culturaldiplomacy.org/content/pdf/participating-papers/\n"
