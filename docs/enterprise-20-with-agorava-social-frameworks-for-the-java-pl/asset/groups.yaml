    或 Microsoft 开发企业级系统，并使用 Adobe、Ajax/JavaScript 以及动态或函数式语言进行 Web 设计和开发。


    在为大型公司工作之余，他利用业余时间运营自己的创意与人才机构 Creative Arts & Technologies，运行并支持开源项目，并创作歌词、小说、剧本以及技术书籍和文章。


    Werner 是首批提交 Sysdeo Tomcat Launcher（Eclipse WTP 的前身）的人之一，特别负责了其 UI 设计。他是 Apache
    基金会、Eclipse 基金会、Baseline Language 的委员会成员，Momo 项目负责人，Java 社区进程（JCP）的活跃成员，参与了 JSRs
    321 (Trusted Java)、331 (CP)、344 (JSR 2.2)、358/364 (JCP.next)、350 (Java State)、351
    (Java Identity)、354 (Money and Currency)、360/361 (ME Embedded)、363 (Portlet 3)、366
    (Unit-API，同时也担任规范主导) 以及 367 (桌面/嵌入式应用框架)，他是美国境外唯一的执行委员会个人成员。


