    \  - c. Integration/Interoperability\n  - d. Security\n\nThen you may look at\
    \ the way, Social standards, frameworks and libraries communicate. By either\n\
    \n- Consuming information\n- Analysing information\n- Transforming information\n\
    - Providing example information\n\nA typical example for consuming information\
    \ would be showing your status in your favourite social networks inside another\
    \ application, e.g. your blog or corporate website.\n\nAnother one is if you include\
    \ a map to service to show directions to an event you host or participate in.\n\
    \nAnalysing information involves some sort of calculation, ranking or benchmarking.\
    \ Often consuming more than one source of information, so you can get a better\
    \ picture. An example of such a service would be Klout. Where activities across\
    \ multiple social networks influence your overall ranking.\n\nTransforming information\
    \ can be either by merging and combining several data streams, a simple sum of\
    \ two numbers, or if e.g. your booking site predicts the cost of a trip in your\
    \ local currency based on conversion rates. Translation services like Google Translate\
    \ would be another, more sophisticated example of transforming information.\n\n\
    Last not least providing information is any service or sometimes just content\
    \ your application available to others. Ideally via an API allowing others to\
    \ consume, analyse or transform it based on their needs.\n\nAnother way of looking\
    \ at Enterprise Social Networks, related standards or products according to IDC\
    \ [Figure 3] would be:\n\n- Stand-a-Lone Products or services with social aspect\
    \ that can be installed and used on their own. Though by the nature some, e.g\
    \ those embracing OpenSocial aim to be interoperable with others, ideally across\
    \ multiple vendors\n- Embedded Social facts or features within a larger product\
    \ or suite. A classical examples would be Oracle Fusion Middleware, containing\
    \ social functionality in the footsteps of BEA AquaLogic [13] or several other\
    \ de-specific to Social.\n\n## Standardisation\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_12_0.png)\n\
    \nFigure 3 – Categories of Enterprise Social\n\nOPENI (a Social research group\
    \ funded by the European Union) [17] tries to group standards and APIs in a somewhat\
    \ contextual manner:\n\n- Advertising and Analytics API enabling the collection,\
    \ aggregation and analysis of end-user needs, interests and preferences based\
    \ on Their interaction with advertising/Application behavioural data\n- Location\
    \ API enabling location awareness through Check-ins, Direction, Reviews and Tips.\
    \ It is a strong API with location, which can be extracted by a GPS sensor and\
    \ can be mapped on a map. Relevant Categories: Mapping, Location-based Services\n\
    - Media API Bringing together photo, music and video sharing services with file\
    \ transfer and syncing functionalities. It is related with the Gallery Application\
    \ and the file system of a device. Relevant Categories: File Transfer & Syncing,\
    \ Location-based Services\n- Products & Services API Embracing Payments and Shopping\
    \ services. This special case of commercialization-relevant objects, requires\
    \ a strong API with transactional capabilities, and enhanced security. It is related\
    \ to the store application of a phone. Relevant Categories: Location-based Services,\
    \ Payments, Shopping.\n- Profiles API Extrapolating information about people based\
    \ on Analytics, Contacts, Gaming, Health, Location-based Services, Messaging &\
    \ Chat, Music, Social, etc. services. Typically, people can be represented in\
    \ various ways, with multiple profiles. This API brings all that information:\
    \ avatars, profiles, contacts and accounts, relating different profiles, in different\
    \ services. It is directly related to the Agenda application of a smartphone.\n\
    \nWhile OpenNI has not made any of their API available on GitHub (as their site\
    \ promised in 2013;-) its work caught attention of e.g. W3C OpenSocial [15] is\
    \ now further discussed. So if not APIs of its own, OpenNI and its concepts may\
    \ help there. We'll highlight OpenSocial in more detail when looking at 1.4.2\
    \ Apache Shindig.\n"
  mdcn: "\n\n## 标准化\n\n你是否曾关注过 OpenSocial？更重要的是，当情况显而易见时，Google 杀了自己的产物。Google+ 也永远不会支持它。少数主要来自服务器和大型企业部门的供应商（如\
    \ IBM、SAP 或 Confluence 的作者 Atlassian）仍然支持 OpenSocial。\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_8_0.png)\n\
    \n[[#_Ref363567312_anchor][#_Ref363567178_anchor]]图 1 – N 层企业级应用\n\n最近被 Sprinklr\
    \ 收购的 Dachs Group 是社交媒体和企业数据分析的“智库”，也深度参与其中，尽管它的重点更多地转向大数据和 NoSQL 系统。它公开承认，与剩下的\
    \ OpenSocial 支持者（或在 ThoughtWorks 定期技术“雷达”调查中关于值得关注或实现的关注关注者）一样，它是未来成为企业和内网的唯一场所。数据可以被视为一种聚合（Mashup），但它主要承担\
    \ EIS 或 DB 层的功能（见图 1），因此我在此不再过多讨论。这些技术也值得专门写本书，并且超出了本书的范畴 ;-)\n\n与其将 Google、Facebook、Twitter、LinkedIn、Microsoft\
    \ 或 Yahoo! 进行无缝聚合，OpenSocial 现在唯一的价值在于将人力资源、销售或会计部门相互连接，并为管理层提供一个大型企业所有部门和子公司的精巧“社交”聚合。这使得对于那些希望在\
    \ Twitter Feed 流旁边旁边看到 Facebook 时间线的人来说，它在实际上毫无用处。而这并不是 OpenSocial 最初设计的初衷。\n\n\
    OpenSocial 故事的最新转折是尝试创建一个基于 OpenSocial 的 W3C 标准。\n\n在语义网案例中，这是一条艰难且艰棘的道路，但在这里似乎几乎是不可能的；特别是考虑到我们之前发现的大多数参与者更倾向于自己的“围墙花园”[14]。\n\
    \n虽然 W3C 定义了一个名为“语义网”的有趣标准，它听起来与 OpenSocial 的某些想法具有协同效应，但语义网到目前仅用于生物学或医疗保健等少数孤立领域。\n\
    \nW3C 的工作进度非常缓慢，类似于（甚至慢于）HTML5，例如始于 2008 年的 HTML5。今天它仍处于候选状态（尽管许多供应商已经提出了基于此的解决方案和产品）。预计在\
    \ 2014 年底给出最终建议，两年之后进行进一步的更新和改进，以此此类推。这将使得这种方式标准化的东西出现之前会有超过十年的时间。\n\n## 标准类型\n\
    \n除了对 OpenSocial [15] 这种“基础标准”的游说外，图 2 提供了 Dachis Group 在系列文章 [16] 中对社交标准的详尽概述。\n\
    \n## 社交业务标准中还缺少了什么？\n\n### 高级标准\n\n- 用于……的通用货币：\n  社交参与\n  - 点赞\n  - 转发\n  - 评论\n\
    \  - 贴子\n  - 等\n- 用于……的数据跟踪模型：\n  社交行为\n  - 浏览\n  - 参与\n  - 推荐\n  - 活动\n  - 等\n\
    - 针对……的领域特定衡量：\n  社交指标\n  - 净推荐值 (NPS)\n  - 社交业务指数\n  - 客户满意度 (OSAT)\n  - 客户留存率\
    \ (LTR)\n\n### 基础标准\n（正式和临时的）\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_10_0.png)\n\
    \n![](img/0b9ef25bba76e41e13d568c065fdf1e4_10_1.png)\n\n- 社交身份/图谱\n  - LDAP/活动目录\n\
    \  - Facebook Graph API\n  - Twitter 朋友/关注者 API\n  - 可移植联系人\n  - Google Contacts\
    \ API\n- 社交活动\n  - 活动流\n  - RSS\n  - ATOM\n  - Pubsubhubbub\n  - Salmon\n  - OSStatus\n\
    - 社交整合\n  - OpenSocial\n  - Open Graph\n  - OAuth/xAuth\n- 安全/隐私/策略\n  - SAML\n\
    \  - OpenID\n  - OAuth\n  - P2P\n  - DNT\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_10_2.png)\n\
    \n> socialbusinessbydesign.com 的持续讨论\n> 图设计：Dion Hincliffe & Bill Keaggy\n\n图\
    \ 2 – 社交业务标准中缺少了什么？\n\n主要有两个类别：\n\n- 1. 高级标准：面向行为和领域驱动的业务导向标准和 API。[16] 的作者并未详细说明大部分内容。\n\
    - 2. 基础标准：之前提到了一些，这里将其分为 4 个子类：\n  - a. 联系人\n  - b. 活动/消息\n  - c. 整合/互操作性\n  -\
    \ d. 安全\n\n你可以观察社交标准、框架和库的通信方式。通过以下方式：\n\n- 消费信息\n- 分析信息\n- 转换信息\n- 提供示例信息\n\n\
    消费信息的典型示例是在另一个应用程序（例如，你的博客或公司网站）中显示你喜爱的社交网络中的状态。\n\n另一个是包含一个地图服务，以显示你举办或参加的活动的路线图。\n\
    \n分析信息涉及某种计算、排名或基准测试。通常会消耗超过一个来源的信息，以便你可以获得更全面的视图。此类服务的示例是 Klout。跨社交网络的活动会影响你的整体排名。\n\
    \n转换信息可以通过合并和整合多个数据流来实现，或者根据汇率进行。像 Google Translate 这样的服务是转换信息的另一个示例。\n\n最后，提供信息是指任何服务，理想情况下是通过\
    \ API 让其他用户消费、分析或转换内容。\n\n根据 IDC [图 3]，查看社交网络标准、产品的另一种方式是：\n\n- 具有社交属性的独立产品或服务，可以单独安装和使用。由于其性质，采用\
    \ OpenSocial 的某些目标是与其他具有互操作性。\n- 嵌入在大型产品或套件中的社交事实或功能。经典示例是包含社交功能的 Oracle Fusion\
    \ Middleware [13] 或其他特定的。\n\n## 标准化\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_12_0.png)\n\
    \n图 3 – 企业社交的分类\n\nOPENI（一个由欧盟资助的社交研究小组）[17] 尝试以某种上下文的方式分类标准和 API：\n\n- 广告和分析\
    \ API：通过收集、聚合和分析用户的需求、兴趣和偏好，基于他们与广告/应用程序行为数据的交互\n- 位置 API：通过签到、路线、评论和提示实现位置感知。这是一个关于位置的强\
    \ API，可以由 GPS 传感器提取并映射到地图上。相关类别：地图、位置服务。\n- 媒体 API：将照片、音乐和视频共享服务与文件传输和同步功能相结合。它与相册应用程序和设备的文件系统相关。相关类别：文件传输与同步、位置服务。\n\
    - 产品和服务 API：涵盖支付和购物服务。这种商业化相关的特殊对象需要具有事务能力的强 API 以及更高的安全性。它与手机商店应用程序相关。相关类别：位置服务、支付、购物。\n\
    - 配置 API：根据分析、联系人、游戏、健康、位置服务、消息与聊天、音乐、社交等服务提取人的信息。通常，人们可以用多种方式表示，拥有多个配置文件。该 API\
    \ 汇总了所有信息：头像、配置文件、联系人和账户，关联不同服务中的配置。它与智能手机日程应用程序直接相关。\n\n虽然 OpenNI 没有在 GitHub\
    \ 上发布任何他们的 API（正如其网站在 2013 年承诺的那样 ;-)），但它的工作引起了例如 W3C OpenSocial [15] 的关注。因此，即使没有它自己的\
    \ API，OpenNI 及其概念在某些方面也有帮助。我们在查看 1.4.2 Apache Shindig 时更详细地介绍 OpenSocial。\n\n"
