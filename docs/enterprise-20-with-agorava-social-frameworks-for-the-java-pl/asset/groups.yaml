    # About the Author [#the-author .DPline4ParagraphHeading]


    Werner Keil is DevOps Build Manager, Java and NET expert at a prime and media
    world leader working as Scrum Master and Eclipse/Java Consultant for a leading
    vendor of Real-time/Embedded systems, DevOps Build Managers at Merck, Agile Coach,
    Principal Consultant and District Architect for a Financial Services company and
    as an agile consultancy. Helping Global 500 Enterprises across industries like
    Mobile/Telco, Web 2.0, Finance, Travel/Logistics, Automotive, Healthcare, Environment
    & Public Services, as well as IT vendors like Oracle or IBM. Among his early clients
    was Sony where he designed and implemented micro-format based tags in online mobile
    ports.


    He has worked for more 25 years as developer, project manager, software architect,
    analyst and consultant on leading-edge technologies for Banking, Insurance, Telco/Mobile,
    Media and Public sector. Werner developed enterprise systems using Java/JEE, Oracle,
    IBM or Microsoft, does Web design and development using Adobe, Ajax/JavaScript,
    dynamic or functional languages.


    Besides working for major companies, he runs his own creative and talent agency
    Creative Arts & Technologies in his spare time, runs and supports open-source
    projects, writes lyrics, novels, screenplays, technical books and articles.


    Werner was one of the first commit to Sysdeo Tomcat Launcher, a predecessor of
    Eclipse WTP, especially designing his UI. He is Committee at Apache Foundation,
    Eclipse Foundation, Baseline Language own, Momo Project Lead an active member
    of the Java Community Process, in JSRs 321 (Trusted Java), 331 (CP), 344 (JSR
    2.2), 358/364 (JCP.next), 350 (Java State), 351 (Java Identity), 354 (Money and
    Currency), 360/361 (ME Embedded), 363 (Portlet 3), 366 (Unit-API, also Spec Led),
    367 (Desktop/Embedded Application Framework) and the only Individual Member of
    the Executive Committee outside the United States.'
