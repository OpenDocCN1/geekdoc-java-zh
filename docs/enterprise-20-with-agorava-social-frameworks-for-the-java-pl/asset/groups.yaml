    # Standardisation


    ![](img/0b9ef25bba76e41e13d568c065fdf1e4_14_0.png)


    Standardisation


    Figure 4 - OPENii concept


    Apart from dissecting and categorising Social Media standards as above, these
    are the 3 most important things APIs and related standards have in common:


    - Practically all Social Media services use REST as transmission protocol

    - Most of them transmit data in JSON format, some in XML or other

    - Identification & Authentication are almost always based on the OAuth protocol


    You''ll notice "trivial" basic standards like REST, XML, or JSON missing from
    Figure 2 as the authors of [16] believe must be known by now. Along those lines
    I also consider the reader familiar with them.


    We''ll take a closer look at Security, Authorization, Authentication or Digital
    Identity in chapter 2, as well as aspects of Privacy or Data Protection. First
    let''s have a look at relevant Social Media APIs and Frameworks before and learning
    to Agorava.


    ## Java Social


    Following Java standards like Portlet API or various parts of Java Enterprise
    there have several Java frameworks and libraries for Social Media.


    1. 1. 1.

    2.


    ### Twitter4j


    Twitter4j is an unofficial Java library for the Twitter API. Twitter4j, you can
    easily integrate Twitter calls in your Java application.


    Its author, Yuki Yamamoto used to use for Twitter in 2012. While he did, he was
    briefly mentioned to represent Twitter in the Social JSR Expert Group. More on
    that later...


    Its lightweight, mostly backward-compatible with Java 1.4, making it also easy
    to integrate into Mobile apps for instance. Not very surprising or less official
    classes of forks or projects inspired by it are available anywhere from JME to
    Android. Twitter4j is an API Binding Library, primarily for consuming information.
    While extensions or your application could analyse or transform it, the framework
    doesn''t provide support beyond that Twitter itself. Based on Hinchcliffe''s categorization
    Twitter4j could possibly be seen as a Basic API, but with aspects of Higher-Order.


    At the time of writing, the official Twitter4j website (twitter4j.org) was temporarily
    unable to service requests due to maintenance downtime or capacity problems. Whether
    or not it is a signal for lack of maintenance by the author and contributors I
    point to the GitHub project page [18] Twitter itself shouldn''t contest or force
    GitHub to turn down, is likely to remain. The last update was a month ago, some
    other modules have been updated within the past 3-8 months, so it may not see
    high activity, but seems well-maintained at least.


    ### Apache Shind


    **Apache Shindid** [19] was started relatively soon after the OpenSocial [15]
    efforts began. Mainly driven by Google and its Orkut for first obvious reasons,
    other contributors especially IBM joined later. Due to the refocus of OpenSocial
    towards a "Social Intranet" none of the sites or software claimed to use are sure
    to do so. In fact, Google Partuza points to a non-existing page, hence it was
    shut-down like others that we heard of.


    LinkedIn and most other social media providers have gradually or completely abandoned
    OpenSocial from its sites, too.


    An interesting approach by Google to develop OpenSocial applications is WYSIWYG
    environment of Eclipse IDE OpenSocial Development (OSDE) [20]. It is safe to assume
    some was taken over by IBM and integrated into Social editions of Eclipse based
    development tools like RAD, etc. while the Google Code project was last updated
    in June 2010.


    OpenSocial specifications pointed by Apache are no longer hosted by OpenSocial
    supporter Atlassian it seems, the link points to an error page. Whether or not
    means Atlassian doesn''t believe in OpenSocial and won''t use it in later versions
    of its products or it''s simply a process of reviving the whole OpenSocial movement
    on W3C be seen. In the meantime all versions of OpenSocial, especially 1.0 or
    2.0 have been failures and sites like Orkut at most used 0.7 or 0.8 versions.


    According to OpenSocial supporting Dachis Group [16] Shindid as manifestation
    represents a Basic standard (2c). It has means of **providing** and **consuming**
    information.


    On September 30th, 2014 Google has **shut down** Orkut, making Google+ the only
    remaining Google reference.


    Of course, Google had already stopped using Shindid in favour of its own Google
    Code projects. Most of them were also closed and either point to the OpenSocial
    page, or no longer exist. A year later, on October 23, 2015 Apache Foundation
    has **retired** the Shindid project. It remains to be seen, if OpenSocial will
    follow its fate, having the de facto Reference Implementation of OpenSocial, it
    certainly looks like another big nail to its coffin.


    ## Efforts by Sun/Oracle


    Around 2008, Enterprise Social launched driver BEA Systems [13] had just acquired
    by Oracle, Java creator Sun Microsystems did not give quite a similar face was
    also around the corner for it. Based on OpenSocial, Sun created a fork or derived
    project from Apache Shindid named **SocialSite** [21.


    SocialSite still counts 231 members on Java.net, but the project is **inactive**.
    One of the commits was by Kohsuke Kawaguchi, Sun’s creator of Hudson later by
    CloudBees. Following the acquisition of RightNow Technologies (see [23] end of
    2011)


    ## Standardisation


    The former RightNow teams were incorporated into Oracle Social department. JavaOne
    2012 featured a Social Day I attended with Facebook''s Developer Manager James
    Pearce. Oracle itself presented a "one man" project written by freelance contractor
    under the codename "Project Sneaker" which just after JavaOne 2012 was published
    as Oracle Social on Java.net [24] never attracted followers outside Oracle and
    must be considered more dead than SocialSite


    ### DaliCore


    After Oracle took sun, the abandoned SocialSite found its best equivalent and
    successor in DaliCore [22].


    It was originally based on a CMS made by a Belgian start-up, mainly around BeUG
    (DevXX) members like Johan Vos. DaliCMS (2006) was called a "Web 2.0 CMS Mostly
    an Open Source project with community features. 2008, around the same time Sun
    did with SocialSite,CMS got integration with Shindig. Mostly JavaScript code from
    Shindig and Java code was used by DaliCMS.


    Eventually it became more than a CMS, and the underlying modules turned into DaliCore.
    During his talk at JavaOne 2013 unveiled the "Dali" part of projects originally
    stood for "Dutch Lovers Initiative". A tribute to Internet and Cloud pioneer Amazon.


    DaliCore adds functionality to user management, content or permissions on top
    of Java EE 6. With a strong focus on users and permissions. In about every project
    that uses DaliCore, users should be able to login with existing credentials (Facebook,
    Twitter, Google, LinkedIn...) So Dali modules extend DaliCore. While certain connectivity
    to social providers like Facebook, these mainly serve as authentication providers
    for DaliCore SSO (Single Sign-On) functionality. Aside from DaliCore aims at providing
    information.


    Important aspects of DaliCore:


    - Mostly Social Container and CMS support with Paypal Social features

    - Java Persistence support with EJB, IPA or similar standards

    - No separation of modules, especially API/Spec and Implementation, in most cases
    shares the same module and even package space. Making reuse and extension harder
    the attempt for that via Dali Module

    - Currently sits a bit heavy, strong dependencies on the Full Java EE stack, i.e.
    using only its Web Profile seems at the moment

    - GlassFish support and integration is positive where it is the preferred application
    server. To the Java EE standard it is impossible, but could be harder to use with
    other containers

