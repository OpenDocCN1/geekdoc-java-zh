    任何开放社会的基石由两件事组成——言论自由和法治。如果你没有这些东西，你就没有一个自由的国家。—— 萨尔曼·鲁迪爵士


    言论自由在受到纯真意图启发时，是开放背后的决定力量。这种强大的力量现在为社交媒体插上了新的翅膀。社交媒体为我们这个分歧的小星球上那些被忽视的人发出了声音，我们才开始看到它能做什么——无论是在基辅、莫斯科、费格森、巴尔的摩、突尼斯、开罗、伊斯坦布尔、利雅德、德黑还是加沙。如果你认为这些权力殿堂的人不会爱上抑制、颠覆和滥用这种基层力量，那你就是在自欺欺人。你不需要到处寻找，就能找到名为《公民四》的真实纪录片的证据，以及一个谦弱的年轻人爱德华·斯诺登。


    对社交媒体开放性构成严重风险的众多因素之一是其高度的专有性质。否认社交媒体领域几乎几乎没有开放的技术标准将是令人震惊的。这种豁免和极快的创新速度有一些合理的理由。但对于为了使社交媒体变现而进行的这种激烈竞争以及由此导致的对开放性合作兴趣的缺乏，并没有很好的理由。


    希望随着社交媒体行业稍微标准化并为标准化做好充分准备，情况将会发生变化。在此期间，像 Agora 这样的社区项目发挥着非常重要的作用。在缺乏任何真实商店的情况下，Agora
    可以通过通用接口为当今不同的社交媒体 API 提供某种程度的互操作性——至少对于 Java 和 Java EE 开发者而言。该项目本身对 Java EE 生态系统也意义重大。它直观展示了
    CDI 扩展如何在需要并在 Java EE 平台稳定核心的基础上进行有效构建，同时尽可能地遵守互操作性和厂商中立的原则。


    这本书对于该项目至关重要。它提供了社交媒体行业丰富的背景，解释了 Java 社交媒体开发者的核心概念，描述了迄为止在标准化方面的努力，涵盖了其他社交媒体项目，分享了该项目的动机，并提供了
    Agorava API 的技术概述和深度解析。鉴于该主题的波动性、深度和复杂性，这本书的编写无疑非常困难。


    此外，我找不到比 Werner 更适合写这本书的人了。多年来，他证明了自己对开放、标准化、Java 和 Java EE 的个人承诺，以及对社交媒体行业和 Agorava
    的清晰掌握。


    Reza Rahman

    Java EE Guardians 创始人，前 Oracle Java EE 传教士 @ Oracle


    ## 古代史


    大多数人认为社交媒体是 Yahoo!、Google、MySpace、Facebook 和 Twitter 等公司的现代发明。事实上，社交媒体的历史可以追溯到数千年前。


    对某些人来说，邮政是最早的社交媒体形式之一。从古代波斯邮政到希腊集市 [1] 和罗马广场 [2]，邮政一直作为社交和政治讨论的媒介。最早记录的等同于 Wiki
    或“论坛帖子”的内容实际上直接刻在罗马广场的墙壁上 [3] 记录了如维苏威火山摧毁庞贝或尼禄皇帝时期罗马部分地区等事件。


    雅典的古集市曾是民主的孵化器，是社交和政治辩论的首选场所。直到今天，这种运作方式与论坛转变为数字化非常相似。从突尼斯到乌克兰，反对运动利用社交媒体将民主带到那些长期以来一直感到惊讶且不寻常的地方。[4]


    ## 现代史


    1975 年，在美军撤出越南不久，自由意志主义者萨缪尔·康金三世引入了一种名为“Agora”的哲学，这是一种反经济学的社会哲学以及与该实践相关的思想 [5]。在市场无政府主义社会中，法律和安全将由市场参与者而非政治机构提供。Agora主义意识到这种情况无法通过政治改革来实现。相反，它将作为市场过程的结果产生。它的社会价值观今天可以在占领运动中找到，其主要目标是让所有社会的经济和政治关系去阶级化并更加扁平。或者出现在抗议党中，如意大利的
    Beppe Grillo、希腊的 Syria（它甚至执过政）、西班牙的 Podemos 或海盗党。


    1966 年，电子邮件被发明，随后 CompuServe 在 1969 年出现。CompuServe 在 80 年代推出了其电子邮件服务并在 90 年初进行扩张，在经历多次收购后，于
    2009 年最终解散了原始的 CompuServe。


    Usenet 起于 1979 年，为用户提供论坛和新闻组。惊讶的是，它们的大部分功能几乎没有变化，并且仍然存在。


    网络中继聊天（IRC）始于 1988 年，在学术网络中广泛使用，随后进入了现在被称为互联网。IRC 在今天仍然相当活跃，尽管它主要在


