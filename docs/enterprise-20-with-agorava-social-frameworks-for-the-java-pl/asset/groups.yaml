    ## 标准化


    - 它证明了在某些客户高强度使用情况下的可扩展性，例如比利时的一个电子投票网站 Apache Shindir 或 Sun SocialSite（在大多数情况下，DaliCore
    似乎是其自然的继任者），目前至少在比荷卢国家（Benux countries）被实际客户使用。


    在 Oracle 宣布后，它将不再为 GlassFish 提供商业支持或增强功能，例如集群（除了由 Java EE 实现提供的 POC 质量外，它将保留）、性能调优，这也是
    DaliCore 的一个主要论点。Oracle 推荐其 WebLogic/Fusion Middleware 产品，而当前的 GlassFish 用户如果需要商业支持，将被迫迁移到其他平台。


    DaliCore 的作者 Johan Vos 和他的比利时初创公司声称，他们将为客户提供商业支持，甚至可能倾向于扩展，但 DaliCore 已成为此事的牺牲品。自
    2013 年初以来，java.net 仓库就没有活动了，因此在许多情况下，它可能无法与领先的社交提供者的 API 兼容。托管网站可能不那么关键，但对于那些想要规划不仅仅是一个小型私人博客的人来说，他们可能倾向于寻找其他地方。


    虽然 Johan Vos 最近告诉我们他仍在致力于此，并确认这现在已移至 BitBucket 的私有仓库中。因此，他的声明可以通过这种方式得到验证，但 DaliCore
    不再被视为“开源”。至少源代码是不可访问的，因此客户受命于 Johan 的公司。这种风险在本文的大多数示例中并不存在，即使这些示例仅由一个人或一家公司维护。Johan
    公司的网站 LodQN 目前似乎在底层使用了 DaliCMS，但它没有提到 DaliCore，也没有暗示它可能再次变为开源。


    ### Spring Social


    SpringSource 最近由其母公司 Pivotal 重新命名，它长期以来一直热于追逐趋势，并为几乎所有领域提供针对 Spring Framework
    的库或扩展。


    Spring Social [25] 是一个用于消费信息的绑定库。尽管将 OAuth 集成到 Spring Security 及其他部分是基础级 API（Basic
    API）的特征，但它展示了许多作为高阶 API（Higher-Order API）的方面，而且支持良好，但 Pivotal 员工在更改或在会议上宣布功能后
    6 到 9 个月或更久之后才会发布更新或博客文章。这不是向社区传达的最强信号，但 Spring Social 可以被认为相当成熟。有证据表明某些产品或解决方案中已存在商业采用，但供应商也担心
    VMware 会放弃它转而支持其大系统中更具战略意义的部分。


    像 GitHub 这样的开源生态系统展示了各种扩展或插件，但并非所有的都实现了足够实用的社交网络或 API。某些仅仅是概念验证（PoC），而且大多数已经很长时间没有活跃维护。


    Spring Social 的重要方面包括：


    - 出于明显的原因，它主要与 Spring Framework 或 Spring 生态的其他部分一起工作

    - Spring MVC 之外的 UI 框架相对难以集成

    - 官方 Spring Social 连接主要关注 Facebook，到目前为止示例仅显示了单服务方法。没有对多个服务或提供者的直接支持。

    - 尽管 Spring 社区一直活跃，即使在 Pivotal/VMware 内部，对其支持和活动也存在怀疑，特别是在一些人离开两家公司之后。这得到了高级架构师的确认，他们表示重心在其他地方，尽管没有完全放弃的计划。

    - 然而，事实是，Spring Social 最活跃的评论者和推动者之一受雇于单一公司。


    Spring Social 目前也支持 .NET。我无法说任何代码是否具有迁移性，但那些需要支持多个平台的人可能会喜欢 Java 和 .NET 通用的 API。事实上，Pivotal
    最近（2015 年第一季度）宣布它将停止对更大的开源项目（如流行的 Groovy / Grails 生态系统的商业支持。没有证据表明 Pivotal 计划将其进一步资源投入到像
    Spring Social 这样小得多的“鱼类”。


    ### Seam Social


    Seam Social 是 JBoss Seam 3 项目的一部分，在 CDI [28] 等 Java 标准之上提供社交连接功能。Seam Social 是一个消费信息的绑定库。虽然建立在
    CDI 和 Java 事件之上的 OAuth 可以被视为基础级 API，但 Seam Social 通过为 Seam 行为提供 CDI 事件（如点赞、发布到用户时间轴的签到），成为了最丰富的高阶
    API。在大多数情况下，常见的 API 绑定由提供者的 API 定义或直接从其生成的决定，这些灵感源于 Spring Social，但 Seam 从未是 Spring
    的克隆或分支，它与 Spring 的关系就像 CDI 之于 Spring Framework 的扩展。


    2012 年初，Seam 停止与 Apache DeltaSpike 合并。这导致了 Seam Social 走向未来……变成了 Agora [26]。


    ### JSR 357


    在 JavaOne 2011 和之后如安特卫普的 DevOps 等会议期间，我与 CDI 规范负责人 Peter Muir、Twitterj 的 Yusuke
    Yamamoto 或 Seam Social 创始人 Antoine Sabot-Durand 发起了一系列讨论，以探索 Java 社区进程（JCP）中 Java
    平台社交媒体 API 的标准化。


    他们认为这是一个值得追求的想法。虽然其他 API 和项目（如 DaliCore）被认为可能与 Java EE 下的信息提供提供相关，但对 CDI 的强使用以及
    API 与实现之间良好的结构分离使得 Seam Social 成为初始代码库的最佳候选。


    ## 标准化


    该 JSR 由我和 Antoine 作为共同规范负责人（Specs Leads）提出，并有 Red Hat/JBoss、eXO Platform 或 Twitter（由
    Yusuke Yamamoto 代表）等公司，以及 JSR Chennai、来自比利时的 DaliCore 或 Java EE 7 EG 成员以及 Oracle
    ACE 主管 Markus Eisele（现在在 Red Hat 工作，让 Antoine 吧）加入。可以说，这是企业、个人和 Java 用户小组（JUGs）的健康混合。


    然而，在 IBM 首次提出 JSR 后，其他成员如 SAP 也加入了，一个 JUG（SouJava）投了赞成票，另一个（LJ）投了反对，战斗以 8 比 5
    结束，停止了 JSR 357 的创建。遗憾的是，尽管我们早些听到大供应商倾向于“围墙花园”[14] 而非开放标准，但这并不完全意外，甚至利益相关方 EG 成员候选
    Twitter 也缺席了。并不是反对，但由于 3 票之差，也没有投票。[26] 是关于该主题的文章。


    IBM 认为，正如其某些支持者如 Adjuvi 的 Hinchcliffe [16] 所解释的（尽管晚了一点），OpenSocial 是 JSR357 主要目标的基础标准，后者的目标是为
    Java 平台提供高阶 API 和绑定。以 WebSockets 为例，它在 JSR 355 中具有协同潜力。与 OpenSocial 类似的 W3C 标准希望通过定义为
    HTML5 伞形的一部分来确保这些计划成功，而 Oracle 则创建一个 Java 实现。即使在 Java 平台上，已经存在且被广泛采用的 WebSockets
    开源项目，尽管如此，它也被认为值得拥有一个 JSR。对于 JSON ，可能更显著的是事实上的 Reference JSON “父亲” Douglas Crockford
    启发了 JSON JSR，但 Crockford 最初在去年的荷兰移动会议上对我个人说“支持这个 JSR”时，他不再打算参与。并且从未停止支持和推广他围绕其自己的库。


    事实上，在 JSR 357 被投票否决的那周，第一批反对 IBM 的数百人将数以千计的社交媒体软件专利给了 Facebook，这看起来并不难看。这也让 IBM
    自己对 OpenSocial 的支持变得可疑，如果社交媒体专利和专有技术被卖给 Facebook，以增强其对抗 Twitter 等其他竞争者的军库。这可能是
    Twitter| Yusuke Yamamoto 在一段时间后离开 Twitter 的原因之一。无论在投票的最后一刻是否有“情绪波动”。也许是种巧合，但像
    IBM 或 SAP 这样的 EC 成员不希望 Red Hat 在包括 Hibernate、CDI/Seam 或 Arquillian 在内的几个关键开源项目中担任影响力的角色，这可能是另一个原因。特别是对于这一点，我想如果这是许多意图之一，它适得其反，导致了
    Agora 的创建和活跃开发，这不仅仅由一家公司（如 DaliCore 或 Social Link），而是来自世界各地的各种贡献者，其中大多数人都是 EG
    成员。


    杀掉 Java 社交“王位”的继承者，特别是通过法国式的划分，可能会引发一场名为 Agora 的 Java 框架“法国大革命”。'
