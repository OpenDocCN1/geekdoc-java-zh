    \n> A continuing discussion of socialbusinessbydesign.com\n> Visual by Dion Hincliffe\
    \ & Bill Keaggy\n\nFigure 2 – What is missing in Social Business Standards?\n\n\
    Two main categories are:\n\n- 1. Higher-Order Standards: Behaviour and Domain-Driven\
    \ business oriented standards and APIs. Most of them are not clearly fleshed out\
    \ by the authors of [16]\n- 2. Basic Standards: Some were mentioned before, here\
