    # Authentication {#authentication .DPHeading2}


    +   1.


    The word “Agora”, authentication is also derived from Greek terms. Originally
    from Greek “aftentikos”, it was a derivative of the noun “authentes”, “doer, master”,
    which was formed from “autos”, “self” and the base -hentes, “doer, being”.

    While by far the most popular authentication for social media and APIs, OAuth
    is not a genuine authentication, “pseudo-authentication”, where the application
    specifically requests a limited access OAuth Token (“valet key”) rather than actual
    credentials (like a “passport”) see Figure 8 and Figure 9.


    # OpenID {#openid .DPHeading3}


