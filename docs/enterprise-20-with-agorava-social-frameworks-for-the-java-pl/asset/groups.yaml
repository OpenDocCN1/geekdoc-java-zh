- md: "\n## Agorava\n\nAgora Core also provides implementations to these services.\
    \ The main implementation is based on CDI and DeltaSpike right now, but most services\
    \ have been generalised using JSR 330 (Dependency Injection) which allows lightweight\
    \ Java SE alternatives like Google Guice, Dagger or the SE version of the CDI\
    \ Implementation.\n\nFigure 14 - Agora Core API Architecture\n\n## Agora PicketLink\n\
    \nWorking together with OAuth functionality and user profile management, Agora\
    \ Core contains a secure sub-system based on PicketLink.\n\nAs promised in 2.3.2,\
    \ the specialised Agora version of the PicketLinkBaseAuthenticator:@Generic\n\n\
    ```java\npublic class AgoraAuthenticator extends BaseAuthenticator { @InjectWithQualifier\n\
    OAuthAppSettings settings; @Inject\n```\n\n## Agora\n\n```java\nDefaultLoginCredentials\
    \ credentials;\n@Inject\n@DeltaSpike\nInstance<HttpServletResponse> response;\n\
    @Inject\nOAuthLifeCycleService lifeCycleService;\n@Override\npublic void authenticate()\
    \ {\nif (lifeCycleService.getCurrentSession().isConnected()) {\nOAuthSession session\
    \ = lifeCycleService.getCurrentSession();\nUserProfile userProfile = session.getUserProfile();\n\
    credentials.setCredential(session.getToken());\nsetStatus(AuthenticationStatus.SUCCESS);\n\
    User user = new User(userProfile.getId());\nuser.setFirstName(userProfile.getFullName());\n\
    setAccount(user);\n} else {\nString authorizationUrl = lifeCycleService.startDanceFor(settings.getQualifier());\n\
    try {\nresponse.get().sendRedirect(authorizationUrl);\n} catch (IOException e)\
    \ {\ne.printStackTrace();\n}\ncredentials.setStatus(Status.IN_PROGRESS);\nsetStatus(AuthenticationStatus.DEFERRED);\n\
    }\n}\n```\n\n## Connectors\n\nAgorava currently comes with default connectors\
    \ to:\n\n- Facebook\n- LinkedIn\n- Twitter\n\nIn addition to, 3rd party Agoraava\
    \ Connectors were created for services like:\n\n- EmpireAvenue\n- GitHub\n- Google+\n\
    - Instagram\n- Meetup\n- StackOverflow\n- Triplit\n- WordPress\n- XING\n- Yammer\n\
    \n### Anatomy of a Connector\n\n## Socializer\n\nSocializer is a real life demonstration\
    \ Web App for Agorava.\n\nIt allows you to connect to various social Media, and\
    \ see your timeline and post update.\n\nSocializer was since ported from Java\
    \ Server Faces to the Apache Wicket Web Framework and more recently AngularJS.\n\
    \nBoth ports are currently still rather experimental and therefore not official\
    \ parts of the Agorava ecosystem.\n\n### Integrating a connector\n\nAdding a new\
    \ connector to Socializer is quite easy. We'll take the XING connector as example\
    \ how to do it.\n\nAfter cloning https://github.com/agorava/agorava-socializer\
    \ the following lines in the Socializer pom.xml\n\n```xml\n<!-- XING -->\n<dependency>\n\
    \  <groupId>org.agorava</groupId><artifactId>agorava-xing-api</artifactId>\n \
    \ <version>0.3.0-SNAPSHOT</version>\n  <scope>compile</scope>\n</dependency>\n\
    <dependency>\n  <groupId>org.agorava</groupId><artifactId>agorava-xing-cdi</artifactId>\n\
    \  <version>0.3.0-SNAPSHOT</version>\n  <scope>runtime</scope>\n</dependency>\n\
    ```\n\nDefine dependencies for XING API and CDI Implementation.\nNext we add the\
    \ app settings for XING to CDI producer class org.agorava.socializer.SettingsProducer.java\n\
    \n```java\n@ApplicationScoped\n@Produces\n@Xing\n@OAuthApplication(params = {@Param(name\
    \ = OAuthAppSettingsBuilder.PREFIX, value = \"xing\")})\npublic OAuthAppSettings\
    \ settings;\n```\n\nBacked by the properties file\nsrc/main/resources/local/agorava.properties\n\
    xing.apiKey=<your API Key>\nxing.apiSecret=<your API Secret>\n\nBoth API key and\
    \ API secret have to be defined for a local Socializer application in the social\
    \ media account of your choice, see https://dev.xing.com/applications/dashboard\
    \ for XING.\n\n## Agorava\n\nUnfortunately some, notably Facebook ignore the need\
