    \ |\n| Social | Social network (Coming Soon) |\n| Identity Stores | Support for\
    \ OAuth (Coming Soon) |\n| Common | Common utility classes, Logging |\n\n**Figure\
    \ 11 - PicketLink Overview**\n\nAgora however uses many base functionality of\
