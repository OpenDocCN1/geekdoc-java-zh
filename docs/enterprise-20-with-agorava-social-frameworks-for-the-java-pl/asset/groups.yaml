    ## Standardisation


    - It demonstrated scalability also under heavy usage with some customers, e.g.
    an e-Voting site in Belgium Apache Shindir or Sun SocialSite(which DaliCore seems
    like a natural successor in most cases) it is used by actual customers at least
    in Benux countries as of now.


    After Oracle announced, it will no longer provide commercial support for GlassFish
    or enhanced features like Clustering (beyond Poc quality provided by a Java EE
    Implementation, it will remain), Performance tuning, a major argument for DaliCore
    announced. Oracle recommends its WebLogic/Fusion Middleware products, or current
    GlassFish users will be forced to migrate to others if they need commercial support.


    DaliCore author Johan Vos and his Belgian start-up claim, they''ll offer commercial
    support for their customers, may prefer even to extend to that, but DaliCore has
    become a victim of this. Since early 2013 there has been no activity in the java.net
    repository, so in many cases, it may not work with API by leading social providers.
    Hosting a site may be less critical, but with the those who want to plan more
    than a small, private Blog may prefer to look elsewhere.


    While Johan Vos recently told us, he is still working on it, and he confirmed,
    this is now down in a private repository at BitBucket. Thus his statement can
    be verified that way, nor DaliCore will be considered "Open Source". At least
    the source is not accessible, and clients therefore at the mercy of Johan''s company.
    A risk that does not exist for most examples here, even if those are only maintained
    by a single person or company. The website of Johan''s company, LodQN seems like
    it currently uses DaliCMS under the hood, but it does not mention DaliCore or
    suggests it could become Open Source again.


    ### Spring Social


    SpringSource, recently rebranded by its parent companies Pivotal has a long history
    of jumping on trends and providing libraries or extensions to its Spring Framework
    for just about everything it seems.


    Spring Social [25] is a binding library for consuming information. Although integrating
    OAuth with Spring Security and other parts are symptomatic of a Basic API it shows
    many aspects of a Higher-Order API than it is very well supported and updates
    or blog posts by Pivotal staff 6 to 9 months or longer after a change was made
    or a feature announced at a conference. This is not the strongest signal to the
    community, but Spring Social can be considered reasonably mature. There is evidence
    of some commercial adoption in products or solutions, but vendors also worry about
    VMware stop it in favor of more strategic parts of their big ২০১০.


    Open Source ecosystems like GitHub show various extensions or plugins, but not
    all of them implement enough of a social network or API to be useful. Some are
    merely a PoC and most of them have not been actively maintained for some time
    either.


    Important aspects of Spring Social are:


    - It works primarily with Spring Framework or other parts of the Spring landscape
    for obvious reasons

    - UI frameworks other than Spring MVC are relatively harder to integrate

    - Official Spring Social connects focus mostly on Facebook, so far examples only
    show Single Service approach. No straightforward support of multiple services
    or providers

    - Despite an ever lively Spring community, even inside Pivotal/VMware there is
    doubt about support and activity, especially after some people left both companies.
    This has been confirmed by top level architects who said priorities lie elsewhere,
    although there are no immediate plans to abandon completely

    - However, this has the fact of one, of most active commenters and drivers behind
    Spring Social. Employed by a single company.


    Spring Social currently supports .NET as well. I cannot say, if there is portability
    of any code, but those who need to support more than one platform may appreciate
    a familiar API for both Java and .NET. The fact, that Pivotal announced recently
    (Q1/2015) it''ll drop commercial support for even larger Open Source projects
    like the popular Groovy / Grails ecosystem for itself. There is no evidence that
    Pivotal plans to invest its further resources in much smaller "fish" like Spring
    Social.


    ### Seam Social


    Seam Social was part of the JBoss Seam 3 project offering social connectivity
    on top of Java standards like CDI [28]. Seam Social is a binding library for consuming
    information. While OAuth on top of CDI and Java Events can be considered a Basic
    API, Seam Social is the richest Higher-Order API by providing CDI events for Seam
    Behavior such as Likes, CheckIns to a user''s Timeline. Common API bindings in
    most cases dictated by a provider''s API definition or something generated directly
    from were inspired by Spring Social, but Seam was never a clone or fork, as it
    stands to Spring like CDI and extensions to Spring Framework.


    In early 2012, Seam was stopped to be merged with Apache DeltaSpike. Which was
    a reason for Seam Social to move on all well...becoming Agora [26].


    ### JSR 357


    Between JavaOne 2011 and further conferences like DevOps in Antwerp I initiated
    a series of discussions with CDI Spec Lead Peter Muir, Twitterj Yusuke Yamamoto
    or Seam Social creator Antoine Sabot-Durand to explore a possible standardisation
    of Social Media APIs for the Java Platform in the Java Community Process.


    They thought it was an idea worth pursuing. While other APIs and projects, like
    DaliCore were considered possibly relevant to the especially providing information
    under Java EE the strong use of CDI and well-structured separation of API and
    implementation made Seam Social the best candidate for initial codebase.


    ## Standardisation


    The JSR was proposed by me and Antoine as co Specs Leeds, joined by companies
    like Red Hat/JBoss, eXO Platform or Twitter (represented by Yusuke Yamamoto) as
    well as JSR Chennai, DaliCore from BeUG or Java EE 7 EG Member and Oracle ACE
    director Markus Eisele (now working at Red Hat, let Antoine). A healthy mix of
    corporate, individuals and JUGs one might say.


    However, after IBM first proposed the JSR other members like SAP followed, one
    JUG (SouJava) voted in favor, the other (the LJ) voted against it, and the creation
    battle ended 8 against 5 stopping the creation of JSR 357. Sadly, although we
    heard earlier about big vendors preferring "walled gardens" [14] over open standards
    not entirely surprising, even interested party and EG member candidate Twitter
    absent. Not against it, but with a difference of 3 votes not voting either. [26]
    for an article on the subject.


    IBM feels but as some of its supporters like Adjuvi''s Hinchcliffe [16] explained
    (a bit later though) OpenSocial is a Basic Standard for the main goal of JSR357
    following Social was to offer a Higher-Order API and binding to the Java Platform.
    Take WebSockets, among the JSR 355 having potential for synergies. The W3C standard
    just along the lines of OpenSocial hopes to have those plans successful were defined
    as part of the HTML5 umbrella, while Oracle creates a Java implementation. Even
    on the Java Platform there have been existing, well-adopted Open Projects for
    WebSockets, nevertheless it was found worth a JSR, too. For similar for JSON and
    maybe even more striking as de facto Reference JSON "father" Douglas Crockford
    inspired the JSON JSR, but Crockford initially "Supporting this JSR" told me personally
    at Dutch Mobile Conference last year, he no longer intended to be involved. And
    has never stopped supporting and promoting his own libraries around it.


    The fact, that first opposing IBM Hundreds, while thousands of Social Media Software
    Patents to Facebook the week JSR 357 was voted down did not present a bad optic.
    It also makes IBM''s own support of OpenSocial bit questionable if Social Media
    patents and proprietary technologies are sold to Facebook bolstering its arsenal
    against competitors like Twitter and others. Could be a reason behind that Twitter|
    Yusuke Yamamoto left Twitter after some. Whether or not mood swing" at the last
    moment of the ballot. Maybe a coincidence, but EC Members like IBM or SAP didn''t
    want Red Hat in an influential role in key Open Source projects after Hibernate,
    CDI/Seam or Arquillian just to name a few it could have been another reason, too.
    Especially on that one I''d say if it was among many intentions, it backfired
    with the creation and active development of Agorava, not just by one company (like
    DaliCore or Social Link;) but a variety of contributors around the world, most
    of them proposed EG Members.


    Murdering the heir to the Java Social "throne", specifically with a French partition
    may create a "French Revolution" of Java Frameworks named Agora.

