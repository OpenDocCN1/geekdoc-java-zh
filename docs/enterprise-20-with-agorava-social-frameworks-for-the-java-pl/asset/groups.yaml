  - '[PAGE 9]


    What has been a hard and thorny path in the case of the Semantic Web seems almost
    impossible here; especially given a majority of players prefer their “walled garden”
    as we found earlier [14]


    While W3C defined an interesting standard called semantic web, which sounds synergetic
    to some OpenSocial’s ideas, semantic web is so far used only in a few isolated
    sectors like biology or healthcare.


    Work at W3C happens at rather slow pace, similar to (or even slower than) HTML5,
    for example, which started in 2008. Today it is still in candidate state (despite
    many vendors already proposing solutions and products being based on it). A final
    recommendation is expected by the end of 2014 with further updates and improvements
    to come two years after that, and so on. That will make it well over a decade
    before something standardised this way.


    # Types of Standards


    Aside from their lobbying of “Basic Standards” like OpenSocial [15], Figure 2
    provides a decent overview of Social Standards by Dachis Group from a series of
    articles [16]'
