- md: "\n# Social Security\n\nThe revelations by whistleblower Edward Snowden were\
    \ the most extensive, but certainly not first case of privacy concerns brought\
    \ into public light with regards to Social Networks or similar Online Services\
    \ [32]. The ability to combine data from various sources and everyday life aspects\
    \ into a digital picture and footprint of users was in prior decades mostly the\
    \ domain of privacy and secret service tools like \"Dragnet\" (not so the movie,\
    \ though it referred to the system in a humorous way).\n\nNot just Snowden and\
    \ his skills now available to his hosts in Russia is a clear indicator, Western\
    \ countries and agencies aren't the only ones interested in such information.\
    \ Many try to control simply block or restrict entries, if they are not provided\
    \ the same access to vital information by the social networks intelligence agencies\
    \ in their home country, usually the United States. China, Russia or Turkey, the\
    \ list keeps growing of countries temporarily or permanently blocking providers.\
    \ If ownership or hosting is outsourced, not for tax but cheap workforce reasons,\
    \ then some services can be practiced by these countries, too. One of the most\
    \ popular we heard about, because OpenID 1.0 once created there is LiveJournal.\
    \ In 2007 it was sold by Six Apart Russian media group SUP in December 2007.\n\
    \nAfter 2009 most of its production was also moved to Russia and employees hired\
    \ in Silicon Valley. Although privately owned, SUP Media is clearly controlled\
    \ and also censored by Russian secret services. For example in 2007 Russian blogger\
    \ Savva Terentyev was accused of fostering social hatred to the staff of Internal\
    \ Affairs and sentenced to one year probation due to his comment in the log of\
    \ a local journalist. Not to mention recent murders like that of regime-critical\
    \ Boris Nemsov in Moscow only after he had announced to disclose information on\
    \ Russia's involvement in Ukraine. Ironically, even in one of the most censored\
    \ countries like Russia, there is a tiny glimpse of hope, Social media if not\
    \ bring real reforms may yet help finding clues to his murder [33].\n\nWhile the\
    \ effort of \"National Security\" and trying to catch terrorists or severe criminals\
    \ online was used to justify mass surveillance on a global scale, critical bloggers\
    \ or journalists often risk not just their privacy if their lives are unveiled\
    \ to people and agencies they criticise.\n\nWhile efforts like the \"Vorratsdatensicherung\"\
    \ by European hosting providers and other mobile companies, there isn't total\
    \ privacy in Europe either, most EU countries, Germany have strong privacy and\
    \ data protection laws compared to the United States and many other parts of the\
    \ world. A few countries like Iceland (not currently in EU, but EFTA) have even\
    \ stronger data protection laws, as well as Scandinavian countries.\n\nSocial\
    \ networks genuinely based in these countries, e.g. German XING, also Deutsche\
    \ Telekom and other internet companies from Germany GMX/1&1, their data is safe\
    \ from direct access by NSA or other spies. Although local and international inquiries\
    \ will be executed by these if probable cause exists against a user of serious\
    \ offences like murder, terror, organised crime or pornography, neither of these\
    \ services are likely to conduct mass-screening of every single user on a daily\
    \ basis like NSA and other agencies do in the US and other countries. Without\
    \ a warrant to access records or pre-emptively sniff into communication most European\
    \ users should feel safe if the provider and their servers are genuinely based\
    \ in Europe and data isn't safe via connections.\n\nIn addition to that, services\
    \ like XING also offer much finer grained levels of access permissions and control\
    \ by its users. Where it is possible to sometimes restrict e.g. who can see each\
    \ individual data item. Let's say you want to show your name and day of birth,\
    \ but not the year or your age to everyone visiting your profile, or allow only\
    \ your friends to see your phone number, and this and more can be controlled by\
    \ systems like XING.\n\nThis was also among the main reasons, why XING abandoned\
    \ OpenSocial, because it cannot offer such fine grained access control or in some\
    \ cases won't provide any, but instead show everything to everyone or at least\
    \ data to all of your friends.\n\nAs opposed to that, Agorava can leverage security\
    \ mechanisms and access control by individual social networks. And being able\
    \ to connect to selected services, even multiple of them in a single session,\
    \ you can decide where you place what information and access it from the provider\
    \ you best trust to handle it with the necessary care.\n\n# Agorava\n\n## Overview\n\
    \nAgorava [34] is a Social Framework, providing CDI modules, contexts and extensions\
    \ to interact with major social networks or similar services exposing APIs. It\
    \ offers these services to Java and Java Enterprise applications and eases mixing\
    \ them in the spirit of mashups [12].\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_36_0.png)\n\
    \nFigure 12 - Agorava Macro Architecture\n\nThese are the key characteristics\
    \ and features of Agorava\n\n- A generic portable REST client API\n- A generic\
    \ API to handle OAuth 1.0a and 2.0 services\n- A generic API to work with JSON\
    \ serialization and de-serialization\n- A generic identification API to retrieve\
    \ basic user information from a Social Service (as Identity Provider)\n- A Multis\
    \ manager API allowing to deal with multiple OAuth applications and sessions in\
    \ the same application\n- Currently out of the box, Agorar connects to:\n  - Twitter\n\
    \  - Facebook\n  - LinkedIn\n  - And offers an easy way to extend it by creating\
    \ a new modules for any other service or API required\n\nAgorar is independent\
    \ of CDI implementation and fully portable between Java EE 6 (minimum) and Servlet\
    \ environments. It has been fully tested with the CDI implementation (JBoss Weld).\
    \ Open Web Beans and Caucho Resin are also supported since the 0.5 release.\n\n\
    Agorar is often explained as a sort of \"Java Connector Architecture for Social\"\
    . And indeed, there are striking similarities between the idea behind Agorar and\
    \ what Java Connector Architecture (JCA) does under the Java EE umbrella.\n\n\
    Java EE Connector Architecture defines a standard architecture for connecting\
    \ the Java EE platform to heterogeneous Information Systems (EIS) including transaction\
    \ processing systems such as CICS Transaction Server and Enterprise Resource Planning\
    \ (ERP) systems like SAP. Especially so called Common Client Interface (CCI),\
    \ which defined a standard client API allowing applications to access multiple\
    \ resource adapters.\n\n# Agora\n\n## Client Interface\n\n![](img/0b9ef25bba76e41e13d568c065fdf1e4_38_0.png)\n\
    \nFigure 13 - JCA Common Interface\n\nOne must add, JCA is a fairly old part of\
    \ the Java EE umbrella, last updated with EE 6. It received a Maintenance Release\
    \ about a year ago, also with CDI support, but compared to some of the new, Cloud\
    \ and API based solutions along the lines of Salesforce, it seems a bit outdated\
    \ and is also among the lesser known and used parts of the Java EE ecosystem.\n\
    \nThough the JSR 357 proposal did not explicitly phrase it \"JCA way\", it is\
    \ also possible, some of the supporters and JCA Experts (beside Oracle that was\
    \ mostly IBM or SAP, most other companies dominating in the Cloud didn't even\
    \ exist when JCA was originally designed) felt the little \"dinosaur\" they fostered\
    \ could be threatened by a new standard like a Java Social Connector API.\n\n\
    ## Core\n\nAgor Core includes common, social networking services that are independent\
    \ of a particular provider. Offering features such as:\n\n- OAuth connectors to\
    \ authenticate against OAuth providers\n- Support for generic authentication and\
    \ user profile management\n- A Social Multi-Account Service supporting\n  - Multiple\
    \ Social Network Connections\n  - Multiple Sessions for the same Social Network\
    \ provider, e.g. connected to multiple accounts or queries at the same time\n"
  mdcn: "\n\n# 社会安全\n\n告密人爱德华·斯诺登（Edward Snowden）的揭露是最广泛的，但绝对不是首次将社交网络或类似的在线服务的隐私问题带入公众视野\
    \ [32]。将来自各种来源和日常生活各个方面的数据合并成用户的数字肖像和数字足迹的能力，在过去的几十年里主要是隐私和秘密部门工具领域，例如“拖网”（Dragnet，虽然不是那部电影，但它幽默地指代该系统）。\n\
    \n不仅是斯诺登，他现在供其俄罗斯东主的技能也清楚地表明，西方国家和机构并非对这类信息感兴趣的唯一。如果社交网络所在国家的情报机构（通常是美国）不为其提供相同的关键信息访问权限，许多国家就会尝试控制、阻止或限制进入。中国、俄罗斯或土耳其，临时或永久封锁提供商的国家名单不断增加。如果所有权或托管被外包（不是为了避税，而是为了廉价劳动力），那么这些国家也可以运行某些服务。我们听过的最流行的之一是\
    \ LiveJournal，因为那里曾创建过 OpenID 1.0。2007年12月，它被俄罗斯媒体集团 SUP 卖出。\n\n2009年后，其大部分生产工作也转移到了俄罗斯，并在硅谷聘佣了员工。尽管\
    \ SUP Media 是私有所有的，但它显然受到俄罗斯秘密情报部门的控制和审查。例如，2007年，俄罗斯博主萨瓦·特伦廷耶耶夫（Savva Terentyev）被指控煽动对内政部人员的仇恨，并因他在当地一名记者日志中的评论被判处一年缓刑。更不用说最近发生的谋杀案，如在莫斯科的政权反对人士鲍里斯·内姆索索夫（Boris\
    \ Nemsov），他在宣布将披露有关俄罗斯参与乌克兰的信息后不久便遇害。讽刺的是，即使在俄罗斯这样一个审查最严格的国家之一，仍有一丝微的希望：社交媒体如果不能带来真正的改革，或许有助于找到他被杀案的线索\
    \ [33]。\n\n虽然“国家安全”的努力以及试图在网上捕捉恐怖分子或严重罪犯的行为被用来证明全球范围内大规模监控，但批判性博主或记者如果他们的生活暴露在他们所批评的人和机构面前，往往面临的不仅是隐私风险。\n\
    \n虽然欧洲托管供应商和其他移动公司付诸了“数据保留”（Vorratsdatensicherung）等努力，但欧洲也没有完全的隐私；与美国和世界其他许多地区相比，大多数欧盟国家（如德国）拥有强大的隐私和数据保护法。少数国家如冰岛（目前不在欧盟，但属于\
    \ EFTA）以及斯堪的纳维亚国家拥有更强的数据保护法。\n\n真正位于这些国家的社交网络，例如德国的 XING，以及德国电信和来自德国的其它互联网公司 GMX/1&1，其数据免受美国国家安全局（NSA）或其他间谍的直接访问。尽管如果对用户存在谋杀、恐怖、组织犯罪或色情等严重罪行的合理理由，这些机构将执行当地和国际调查，但这些服务都不可能像\
    \ NSA 以及美国和其他国家的机构那样，每天对每个用户进行大规模筛选。在没有授权访问记录或预先嗅探通信内容的情况下，如果提供商及其服务器确实位于欧洲，且数据通过连接传输是安全的，大多数欧洲用户应该感到安全。\n\
    \n此外，XING 等服务还为其用户提供了更细粒度的访问权限级别和控制。在某些情况下，可以限制例如谁可以看到每个单独的数据项。假设你想向所有访问你个人资料的人显示你的名字和出生日期，但不显示年份或年龄，或者只允许你的朋友看到你的手机号码，这些及更多都可以通过\
    \ XING 这样的系统进行控制。\n\n这也是 XING 放弃 OpenSocial 的主要原因之一，因为它无法提供这种细粒度的访问控制，或者在某些情况下不提供任何，而是向所有人显示所有内容，或至少向你所有朋友显示数据。\n\
    \n与之相反，Agorava 可以利用各个社交网络的安全机制和访问控制。并且能够连接到选定的服务，即使是多个服务，并且可以通过各个社交网络的安全机制和访问控制来利用。你可以根据你信任的多个服务来处理\
    \ Agorava。\n\n# Agorava\n\n## 概述\n\nAgorava [34] 是一个社交框架，提供 CDI 模块和扩展，用于与主要的社交网络或类似服务交互。它为\
    \ Java 应用提供了这些服务，并允许进行混合（mashups）[12]。\n\n（此处为图片占位符：图12 - Agorava 架构）\n\n图 12\
    \ - Agorava 架构\n\n这些是 Agorava 的关键特点和功能：\n\n- 通用 REST 客户端\n- 处理 OAuth 1.0 和 2.0\
    \ 服务的通用 API\n- 用于 JSON 序列化和反序列化的通用 API\n- 从社交服务（作为身份提供商）检索基本信息的通用 API\n- 允许在同一个应用程序中处理多个\
    \ OAuth 应用的应用管理器\n- 目前开箱连接到：\n  - Twitter\n  - Facebook\n  - LinkedIn\n  - 并通过创建任何其他服务的模块来扩展它\n\
    \nAgorava 独立于 CDI 实现，并在 Java EE 6（最低）和 Servlet 环境之间完全可移植。它已经在 CDI 实现（Jeld）上进行了充分测试。从\
    \ 0.5 版本起也支持 Open Web Beans 和 Caucho Resin。\n\nAgorar 通常被解释为某种“社交 Java 连接架构”。事实上，Agorar\
    \ 背后的思想与 Java 连接架构（JCA）在 Java EE 伞下的功能有着惊人的相似之处。\n\nJava EE 连接架构定义了一种标准架构，将 Java\
    \ EE 平台连接到异构信息系统（EIS），包括 CICS 事务处理系统和 SAP 等企业资源计划（ERP）系统。特别是所谓的通用客户端接口（CCI），它定义了标准的客户端\
    \ API，允许应用程序访问多个资源适配器。\n\n# Agora\n\n## 客户端接口\n\n（此处为图片占位符：图13 - JCA 通用接口）\n\n\
    图 13 - JCA 通用接口\n\n必须补充的是，JCA 是 Java EE 伞下的一个相当老的部分，最后是在 EE 6 中更新的。它在大约年前获得过维护发布，也支持\
    \ CDI，但与 Salesforce 等的一些新的云和 API 解决方案相比，它显得有些过时，也是 Java EE 生态系统中较少为人知和使用的部分。\n\
    \n尽管 JSR 357 提案没有明确表述为“JCA 方式”，但也可能是某些支持者和 JCA 专家（除了主要是 IBM 或 SAP 的 Oracle，大多数公司在\
    \ JCA 设计时甚至不存在）担心他们培养的小“恐龙”会被新的 Java 社交连接 API 所威胁。\n\nCore 包含了与特定提供者无关的通用社交网络服务。提供如下功能：\n\
    \n- 用于向 OAuth 提供者进行身份验证的 OAuth 连接器\n- 支持通用身份验证和用户配置管理\n- 支持多账户的社交服务\n  - 多个社交网络连接\n\
    \  - 同一社交网络提供者的多个会话（例如同时连接到多个账户或查询）\n\n"
