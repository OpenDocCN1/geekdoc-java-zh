- md: "\n## Social Security\n\n## Authorisation\n\nAuthorization, also known as access\
    \ control, is the process of managing access to resources. In other words, controlling\
    \ who has access to what in an application.\n\nMore formally, to authorize is\
    \ to define an access policy. Examples of authorization: Is a user allowed to\
    \ look at this webpage, read or edit this information, view this form, or use\
    \ this printer? Those are all decisions determining what a user may access.\n\n\
    ### 1.1. Java Authorization\n\nJava has a security architecture that protects\
    \ systems from unauthorized access by mobile/dynamic or static code. The problem\
    \ is in determining the set of security access rights required to execute a library\
    \ or application. The commonly used strategy is to execute the code, note authorization\
    \ failures, allocate additional access rights, and test again. This process iterates\
    \ until the code successfully runs for the used cases. Those cases may not always\
    \ cover all paths through the code, so failures can occur in deployed systems.\
    \ On the other hand, a broad set of access rights may be allowed to the code to\
    \ prevent authorization failures from occurring. However, this often leads to\
    \ a violation of the Least Privilege design principle [27].\n\nThe Least Privilege\
    \ principle represents a minimalistic approach to granting access rights to specific\
    \ information and tools. Additionally, access rights should be time based to limit\
    \ resources access to the time needed to complete necessary tasks. The implications\
    \ of granting access beyond this scope will allow for unnecessary access and the\
    \ potential for data to be updated out of the approved context. The assigning\
    \ of rights will limit system damaging from users whether they are intentional\
    \ or not.\n\nBasic SE Security relies on permissions, e.g. FilePermission to access\
    \ the file system or AWTPermission to use resources like the clipboard in AWT/Swing\
    \ applications.\n\nIf someone wants to allow a new type of permission for specific\
    \ applications, this can be done by adding an entry in a policy file.\n\nAn example\
    \ of a policy file granting code from \"http://mysocialtv.com/\" permission to\
    \ watch Sky Sports 3 would be:\n\n```java\ngrant codeBase \"http://mytvstation.com/\"\
    \ {\n  permission com.sky.TVPermission \"sky-sports-3\", \"watch\";\n}\n```\n\n\
    ## Java Enterprise Edition\n\nSecurity in Java EE is based on some essential terms:\n\
    \n- User is an identity defined in the identity storage. The storage can be a\
    \ database, flat file or LDAP server.\n- Group is a set of users with the same\
    \ needs or access levels.\n- Security Realm is the access channel for the application\
    \ server to user and group information.\n- Role is a Java EE concept of access\
    \ levels. A Java EE developer specifies which roles can access set of application\
    \ functionalities. These roles are then mapped to users and groups via vendor\
    \ specific configuration data.\n- Principal is an identity with known credentials\
    \ which can be authenticated using an authentication protocol.\n- Credential contain\
    \ or references information used to authenticate a principal for Java EE applications.\
    \ e.g. by entering a password, or calling external services. More in “2.2 Authentication-\n\
    \nAgora rivals over CDI, a Java standard called “Context and Dependency Injection,\
    \ like several other parts of Java EE from version 6 on. We consider the reader\
    \ somewhat familiar with the CDI standard, if you need to learn about it, please\
    \ see [28].\n\nYou'll remember from chapter 1,3, that almost every social service\
    \ or similar API uses RESTful Web Services. REST stands for “Representational\
    \ State Transfer”. JAX-RS is the Java API for RESTful Web Services (current version\
    \ 2 or JSR 339)\n\nHere a brief example, how authorization can be done by injecting\
    \ a JAX-RS SecurityContext instance using a @Context annotation. The injected\
    \ security context works on top of lower HttpServletRequest API. The injected\
    \ security context depends on the actual JAX-RS application deployment.\n\nSecurityContext\
    \ can be used with sub-resource locators to return different resources based on\
    \ the specific roles a user principal is included in. For example, a sub-resource\
    \ locator could return a different resource if the user is a “preferred customer\"\
    \n\n```java\n@Path(\"basket\")\npublic ShoppingBasketResource get(@Context SecurityContext\
    \ sc) {\n    if (sc.isUserInRole(\"PreferredCustomer\")) {\n        return new\
    \ PreferredCustomerShoppingBasketResource();\n    } else {\n        return new\
    \ ShoppingBasketResource();\n    }\n}\n```\n\n### Using SecurityContext for a\
    \ Resource Selection\n\n```java\n@Path(\"resource\")\n@Singleton\npublic static\
    \ class MyResource {\n    // Jersey will inject proxy of Security Context\n  \
    \  @Context\n    SecurityContext securityContext;\n\n    @GET\n    public String\
    \ getUserPrincipal() {\n        return securityContext.getUserPrincipal().getName();\n\
    \    }\n}\n```\n\n### Injecting SecurityContext into a singleton resource\n\n\
    Where a JAX-RS application is deployed in a Servlet container you can rely on\
    \ the standard Java EE: Web application security offered by the Servlet container\
    \ and configurable via the web.xml descriptor.\n\nBy defining <security-constraint>\
    \ elements in web.xml and assigning roles which are able to access these resources.\
    \ You can also define HTTP methods that are allowed to be executed. See the following\
    \ example:\n\n```xml\n<security-constraint>\n  <web-resource-collection>\n   \
    \ <url-pattern>/rest/admin/*</url-pattern>\n  </web-resource-collection>\n  <auth-constraint>\n\
    \    <role-name>admin</role-name>\n  </auth-constraint>\n</security-constraint>\n\
    <security-constraint>\n  <web-resource-collection>\n    <url-pattern>/rest/orders/*</url-pattern>\n\
    \  </web-resource-collection>\n  <auth-constraint>\n    <role-name>customer</role-name>\n\
    \  </auth-constraint>\n</security-constraint>\n<login-config>\n  <auth-method>BASIC</auth-method>\n\
    \  <realm-name>my-realm</realm-name>\n</login-config>\n```\n\n## OAuth\n\n**OAuth**\
    \ is an authorization protocol to delegate rights for an application to act on\
    \ the behalf of a user without giving login credentials like username or password.\
    \ It was developed by Twitter, Magnolia and registered as IETF standard in April\
    \ 2010 under RFC 5849.\n\nOAuth version 2.0 is simpler to use but often criticised\
    \ for having many flavours. OAuth 2 was standardized again by IETF in 2012 under\
    \ RFC 6749 and 6750. It is not backward compatible with OAuth 1.0a. Some notable\
    \ adopters are Facebook, Amazon, Google, Salesforce.com or Microsoft.\n\nAll relevant\
    \ social media APIs are based on OAuth 1.0a or 2.0.\n\nFigure 5 shows the actors\
    \ of the OAuth flow, often called the “OAuth Dance”.\n\n- Resource Owner\n- Client\n\
    - Server\n\nTo use OAuth, one has to create an application on the target service\
    \ to have an entry point for the consumer or resource owner. Allowing access tokens\
    \ to be issued to third-party clients by an authorization server, with the approval\
    \ of the resource owner, or end-user. The client then uses the access token to\
    \ access the protected resources hosted by the resource server.\n\n## Social Security\n\
    \nThe OAuth \"Dance\" has 3 major steps:\n\n- **Creation**: Creating an application\
    \ in the OAuth Social Media service\n- **Initialization**: the right granting\
    \ phase also called the OAuth Dance. At the end of the dance we obtain an access\
    \ token (formed by a public and secret part) use in next step\n- **Signature**:\
    \ each request is signed with access token and token identifying the OAuth application\
    \ that was granted the rights\n\nFigure 6 shows the steps and authentication flow\
    \ in detail for OAuth 1.0a.\n"
  mdcn: "\n\n## 社会安全\n\n## 授权\n\n授权（Authorization），也称为访问控制，是管理对资源访问的过程。换句话说，就是控制应用程序中谁可以访问什么内容。\n\
    \n更正式地说，授权是定义一种访问策略。授权的示例包括：用户是否被允许查看此网页、读取或编辑此信息、查看此表单，或使用这台打印机？这些都是决定用户可以访问什么内容的决策。\n\
    \n### 1.1. Java 授权\n\nJava 拥有一种安全架构，可以保护系统免受移动/动态或静态代码的未经授权访问。问题在于如何确定执行库或应用程序所需的安全访问权限集。常用的策略是执行代码、记录授权失败、分配额外的访问权限并再次测试。这个过程会不断迭代，直到代码在使用的用例中成功运行。。这些用例并不总是能覆盖代码中的所有路径，因此在部署的系统中可能会发生失败。另一方面，可能允许代码拥有广泛的访问权限，以防止授权失败的发生。然而，这通常会导致违反**最小权限**设计原则\
    \ [27]。\n\n最小权限原则代表了向特定信息和工具授予访问权限的极简方法。此外，访问权限应该是基于时间的，以将对资源的访问限制在完成必要任务所需的时间。超出此范围的授权授予将导致不必要的访问，并可能导致数据在批准的上下文之外被更新。权限的分配将限制用户（无论是故意还是无意）对系统的破坏。\n\
    \n基础 SE 安全依赖于权限，例如 `FilePermission` 用于访问文件系统，或 `AWTPermission` 用于在 AWT/Swing 应用中使用剪贴板等资源。\n\
    \n如果有人想为特定应用程序允许新类型的权限，可以通过在策略文件中添加条目来实现。\n\n一个允许来自 \"http://mysocialtv.com/\"\
    \ 的代码查看 Sky Sports 3 权限的策略文件示例如下：\n\n```java\ngrant codeBase \"http://mytvstation.com/\"\
    \ {\n  permission com.sky.TVPermission \"sky-sports-3\", \"watch\";\n}\n```\n\n\
    ## Java 企业版\n\nJava EE 的安全性基于一些核心术语：\n\n- 用户（User）是在身份存储器中定义的身份。该存储器可以是数据库、扁平文件或\
    \ LDAP 服务器。\n- 组（Group）是具有相同需求或访问级别的用户集。\n- 安全域（Security Realm）是应用程序服务器获取用户和组信息的访问通道。\n\
    - 角色（Role）是 Java EE 中访问级别的概念。Java EE 开发者指定哪些角色可以访问一组应用程序功能。这些角色随后通过特定厂商的配置数据映射到用户和组。\n\
    - 主体（Principal）是具有已知凭据的身份，可以使用身份验证协议进行验证。\n- 凭据（Credential）包含或引用用于身份验证 Java EE\
    \ 应用主体的信息。例如，通过输入密码或调用外部服务。更多请参见“2.2 身份验证-\n\nAgora 正在争夺 CDI，CDI 是一种 Java 标准，称为“上下文和依赖注入”（Context\
    \ and Dependency Injection），与从 6 版本开始的 Java EE 的其他部分类似。我们认为读者对 CDI 标准相当熟悉，如果你需要学习它，请参阅\
    \ [28]。\n\n你可能从第 1.3 章记得，几乎每个社交服务或类似的 API 都使用 RESTful Web 服务。REST 代表“表述状态转换”（Representational\
    \ State Transfer）。JAX-RS 是用于 RESTful Web 服务的 Java API（当前版本为 2 或 JSR 339）。\n\n\
    这里有一个简单的示例，展示了如何通过使用 `@Context` 注解注入 JAX-RS SecurityContext 实例来实现授权。注入的安全上下文运行在底层的\
    \ `HttpServletRequest` API 之上。注入的安全上下文取决于实际的 JAX-RS 应用程序部署。\n\nSecurityContext\
    \ 可以与子资源定位器（sub-resource locators）结合使用，根据用户主体所属的特定角色返回不同的资源。例如，如果用户是“优惠客户”，子资源定位器可以返回不同的资源。\n\
    \n```java\n@Path(\"basket\")\npublic ShoppingBasketResource get(@Context SecurityContext\
    \ sc) {\n    if (sc.isUserInRole(\"PreferredCustomer\")) {\n        return new\
    \ PreferredCustomerShoppingBasketResource();\n    } else {\n        return new\
    \ ShoppingBasketResource();\n    }\n}\n```\n\n### 使用 SecurityContext 进行资源选择\n\n\
    ```java\n@Path(\"resource\")\n@Singleton\npublic static class MyResource {\n \
    \   // Jersey 将注入 Security Context 的代理\n    @Context\n    SecurityContext securityContext;\n\
    \n    @GET\n    public String getUserPrincipal() {\n        return securityContext.getUserPrincipal().getName();\n\
    \    }\n}\n```\n\n### 将 SecurityContext 注入单例资源中\n\n当 JAX-RS 应用部署在 Servlet 容器中时，你可以依赖\
    \ Servlet 容器提供的标准 Java EE Web 应用程序安全性，并通过 `web.xml` 描述符进行配置。\n\n通过在 `web.xml`\
    \ 中定义 `<security-constraint>` 并分配能够访问这些资源的角色。你还可以定义允许执行的 HTTP 方法。查看以下示例：\n\n```xml\n\
    <security-constraint>\n  <web-resource-collection>\n    <url-pattern>/rest/admin/*</url-pattern>\n\
    \  </web-resource-collection>\n  <auth-constraint>\n    <role-name>admin</role-name>\n\
    \  </auth-constraint>\n</security-constraint>\n<security-constraint>\n  <web-resource-collection>\n\
    \    <url-pattern>/rest/orders/*</url-pattern>\n  </web-resource-collection>\n\
    \  <auth-constraint>\n    <role-name>customer</role-name>\n  </auth-constraint>\n\
    </security-constraint>\n<login-config>\n  <auth-method>BASIC</auth-method>\n \
    \ <realm-name>my-realm</realm-name>\n</login-config>\n```\n\n## OAuth\n\n**OAuth**\
    \ 是一种授权协议，允许应用程序代表用户执行操作，而无需提供用户名或密码等登录凭据。它由 Twitter、Magnolia 开发，并在 2010 年 4 月注册为\
    \ IETF 标准（RFC 5849）。\n\nOAuth 2.0 版本使用更简单，但通常因存在许多变而受到批评。OAuth 2 在 2012 年由 IETF\
    \ 再次标准化（RFC 6749 和 6750）。它与 OAuth 1.0a 不兼容。一些著名的采用包括 Facebook、Amazon、Google、Salesforce.com\
    \ 或 Microsoft。\n\n所有相关的社交媒体 API 都基于 OAuth 1.0a 或 2.0。\n\n图 5 显示了 OAuth 流的参与者，通常被称为“OAuth\
    \ 舞蹈”。\n\n- 资源所有（Resource Owner）\n- 客户端（Client）\n- 服务器（Server）\n\n要使用 OAuth，必须在目标服务上创建一个应用程序，为消费者或资源所有提供入口。允许授权服务器在资源所有者批准的情况下，向第三方客户端授予访问令牌。然后客户端使用访问令牌访问托管在资源服务器上的受保护资源。\n\
    \n## 社会安全\n\nOAuth “舞蹈”包含三个主要步骤：\n\n- **创建**：在 OAuth 社交媒体服务中创建应用程序。\n- **初始化**：权限授予阶段，也称为\
    \ OAuth 舞蹈。在舞蹈结束时，我们获得访问令牌（由公共和私有部分组成），用于下一步。\n- **签名**：每个请求使用访问令牌和标识授予权利的 OAuth\
    \ 应用程序令牌进行签名。\n\n图 6 详细显示了 OAuth 1.0a 的步骤和身份验证流。\n\n"
