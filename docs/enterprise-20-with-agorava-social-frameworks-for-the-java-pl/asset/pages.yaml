  md: '# Agorava {#agorava .DPHeading1}


    # Overview {##overview .DPHeading2}


    Agorava [34] is a Social Framework, providing CDI modules, contexts and extensions
    to interact with major social networks or similar services exposing APIs. It offers
    these services to Java and Java Enterprise applications and eases mixing them
    in the spirit of mashups [12]


    ![](img/0b9ef25bba76e41e13d568c065fdf1e4_36_0.png)


    Figure 12 - Agorava Macro Architecture


    These are the key characteristics and features of Agorava


    +   - A generic portable REST client API

    - A generic API to handle OAuth 1.0a and 2.0 services

    - A generic API to work with JSON serialization and de-serialization'
