  md: '# # Standardisation {#standardisation .DPHeading1}


    # ## Early Approaches


    The theories we encountered in the introduction, such as Six Degrees of Separation
    [6], influenced later concepts got Friend of a Friend (FOAF) [8]. Aspect of both
    can be found in most "Friend" mechanisms used by social networks today.


    Rich Site Summary (RSS) [9] is an early example of a digital form of social media.
    Among the developers involved in the design and standardisation of RSS was Aaron
    Swartz, before his untimely death in early 2013, had worked on a book A Programmable
    Web [10] a rather down-to-earth, street-smart could academic papers in this field.


    Portable Contacts was created by Plaxo, a Social Address book service founded
    in 2002 by a group of entrepreneurs around Sean Parker. Parker had legal troubles
    everyone one couldn''t call Aaron Swartz after his Napster media exchange portal
    was forced out of business, but fortunately talking for more than one Social Media
    household name of today had to cope with it differently. The idea of a portable
    address book or "Digital Business Cards" was well-integrated and makes sense especially
    from a user''s point of view, but commercial interests of competing players each
    of them greedy to share date even with those who created it many roadblocks to
    an otherwise good idea. Plaxo while in still business after all years was not
    necessarily his greatest hit and investors kicked him out in ways not so different
    from what had happened to co-founder Eduardo Verin when Facebook got involved.
    Financially this made him rich and put behind other services, e. Spotify. Little
    coincidence, it seems quite a bit like Napster, but in a more commercially accepted
    way, also thanks to his fame and fortune after Facebook. Portable Contacts have
    been a significant part of the social media movement but are no longer used. This
    is because of the API''s used within larger companies are no longer compatible
    with Portable Contacts. The only remainder still in use is vCard, used by many
    companies and applications.


    # ## Mashup


    The Java language played a more and more important role first on the desktop (mostly
    Java Applets in the early days, or AWT/Swing standalone applications) then around
    the turn of the century also on the server, Sun and other companies (of those
    at least HP and IBM are still active, plus Sun now part of Oracle) began to standardize
    parts of the Java Platform in the so called Java Community Process (founded 1998)
    or JCP.'
