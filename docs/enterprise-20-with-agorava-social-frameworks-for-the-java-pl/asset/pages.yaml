  md: '# Standardisation #standardisation _DPHeading1


    +   * Consuming information

    * Analysing information

    * Transforming information

    * Providing example information


    A typical example for consuming information would be showing your status in your
    favourite social networks inside another application, e.g. your blog or corporate
    website.


    Another one is if you include a map to service to show directions to an event
    you host or participate in.


    Analysing information involves some sort of calculation, ranking or benchmarking.
    Often consuming more than one source of information, so you can get a better picture.
    An example of such a service would be Klout. Where activities across multiple
    social networks influence your overall ranking.


    Transforming information can be either by merging and combining several data streams,
    a simple sum of two numbers, or if e.g. your booking site predicts the cost of
    a trip in your local currency based on conversion rates. Translation services
    like Google Translate would be another, more sophisticated example of transforming
    information.


    Last not least providing information is any service or sometimes just content
    your application available to others. Ideally via an API allowing others to consume,
    analyse or transform it based on their needs.


    Another way of looking at Enterprise Social Networks, related standards or products
    according to IDC [Figure 3] would be


    +   * Stand-a-Lone Products or services with social aspect that can be installed
    and used on their own. Though by the nature some, e.g those embracing OpenSocial
    aim to be interoperable with others, ideally across multiple vendors

    * Embedded Social facts or features within a larger product or suite. A classical
    examples would be Oracle Fusion Middleware, containing social functionality in
    the footsteps of BEA AquaLogic [13] or several other Oracle acquisitions [23]
    in the Social sector since then

    * Specialty often Domain-specific Social Networks, e.g. for Healthcare, Fashion,
    Pets or any other area of interest to a significant community. You''ll hear about
    a range of these later in 4 Enterprise Social.'
