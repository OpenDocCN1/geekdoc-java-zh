    # Java Enterprise Edition {#java-enterprise-edition .DPHeading3}


    Security in Java EE is based on some essential terms:


    +   * User is an identity defined in the identity storage. The storage can be
    a database, flat file or LDAP server.

    * Group is a set of users with the same needs or access levels.

    * Security Realm is the access channel for the application server to user and
    group information.

    * Role is a Java EE concept of access levels. A Java EE developer specifies which
    roles can access set of application functionalities. These roles are then mapped
    to users and groups via vendor specific configuration data.

    * Principal is an identity with known credentials which can be authenticated using
    an authentication protocol.

    * Credential contain or references information used to authenticate a principal
    for Java EE applications. e.g. by entering a password, or calling external services.
