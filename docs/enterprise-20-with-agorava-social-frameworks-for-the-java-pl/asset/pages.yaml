    \  <version>0.3.0-SNAPSHOT</version>\n  <scope>runtime</scope>\n</dependency>\n\
    ```\n\nDefine dependencies for XING API and CDI Implementation.\nNext we add the\
    \ app settings for XING to CDI producer class\norg.agorava.socializer.SettingsProducer.java\n\
    \n```\n@ApplicationScoped\n@Produces\n@Xing\n@OAuthApplication(params = {@Param(name\
    \ = OAuthAppSettingsBuilder.PREFIX, value = \"xing\")})\npublic OAuthAppSettings\
    \ settings;\n```\n\nBacked by the properties file\nsrc/main/resources/local/agorava.properties\n\
    xing.apiKey=<your API Key>\nxing.apiSecret=<your API Secret>\n\nBoth API key and\
