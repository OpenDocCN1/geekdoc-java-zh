    # Authorisation {#authorisation .DPHeading2}


    Authorization, also known as access control, is the process of managing access
    to resources. In other words, controlling who has access to what in an application.


    More formally, to authorize is to define an access policy. Examples of authorization:
    Is a user allowed to look at this webpage, read or edit this information, view
    this form, or use this printer? Those are all decisions determining what a user
    may access.


    +   1. 1. 1. Java Authorization {#java-authorization .DPHeading3}


    Java has a security architecture that protects systems from unauthorized access
    by mobile/dynamic or static code. The problem is in determining the set of security
    access rights required to execute a library or application. The commonly used
    strategy is to execute the code, note authorization failures, allocate additional
    access rights, and test again. This process iterates until the code successfully
    runs for the used cases. Those cases may not always cover all paths through the
    code, so failures can occur in deployed systems. On the other hand, a broad set
    of access rights may be allowed to the code to prevent authorization failures
    from occurring. However, this often leads to a violation of the Least Privilege
    design principle [27].


    The Least Privilege principle represents a minimalistic approach to granting access
    rights to specific information and tools. Additionally, access rights should be
    time based to limit resources access to the time needed to complete necessary
    tasks. The implications of granting access beyond this scope will allow for unnecessary
    access and the potential for data to be updated out of the approved context. The
    assigning of rights will limit system damaging from users whether they are intentional
    or not.


    Basic SE Security relies on permissions, e.g. FilePermission to access the file
    system or AWTPermission to use resources like the clipboard in AWT/Swing applications.


    If someone wants to allow a new type of permission for specific applications,
    this can be done by adding an entry in a policy file.


    An example of a policy file granting code from "http://mysocialtv.com/" permission
    to watch Sky Sports 3 would be:


    grant codeBase "http://mytvstation.com/" {'
