  md: '# Ancient History


    Ancient History


    Most people assume social media to be a modern-day invention of companies like
    Yahoo!, Google, MySpace, Facebook and Twitter. In actual fact, social media has
    a history that reaches back over thousands of years.


    To some the postal service was one of the earliest forms of social media. From
    the days of the ancient Persian postal service to the Greek Agora [1] and Roman
    Forum [2], the postal service served as a medium for social and political discussion.
    The first recorded equivalents to Wiki or "Forum posts" were literally carved
    into the walls of Roman Forums [3] Recording events like the destruction of Pompeii
    by Mt. Vesuvius or several parts of Rome under Nero.


    The Ancient Agora of Athens acted as incubator to democracy being a favorite venue
    for social and political debate while doing business in ancient Greece. Until
    today, this worked in similar ways the forums turned digital. From Tunisia to
    Ukraine opposition movements used social media to bring democracy to places where
    it''s often been surprised and uncommon for a long time. [4]


    Modern History


    In 1975, shortly before the American military out of Vietnam, the libertarian
    Samuel Edward Konkin III introduced a philosophy called Agora, a social philosophy
    of counter-economics and the ideas associated with that practice [5]. In a market
    anarchist society, law and security would be provided by market actors instead
    of political institutions. Agorists recognise situation cannot develop through
    political reform. Instead, it will arise as a result of market processes. Its
    social values can be found today the Occupy Movement, its primary goal being to
    make the economic and political relations in all societies less hierarchical and
    more flatly distributed. Or in protest parties like Beppe Grillo in Italy, Syria
    in Greece (where it even took government), Podemus in Spain or the Pirate Parties.
    Agora also put forth the idea of using currencies, something modern social media
    and online communities are adopting with digital currencies like Bitcoin.


    In 1966, the email was invented, followed by the arrival of CompuServe in 1969.
    CompuServe launched its email service in the 80s and expanded into early 90s,
    before finally dissolving original CompuServe in 2009 after several takeovers.


    Usenet started up in 1979 and provided its users with forums and newsgroups. Surprisingly,
    most of their functions have changed very little and still exist today.


    Internet Relay Chat (IRC) began in 1988 and was widely used across academic networks
    before emerging into what is now the Internet. IRC remains quite active today,
    although it is largely'
