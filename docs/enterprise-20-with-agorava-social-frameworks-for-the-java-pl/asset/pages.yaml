    # PicketLink


    PicketLink is an umbrella for several related projects in the Red Hat/JBoss Middleware
    ecosystem. While Agora is not a project officially created by Red Hat, it was
    created for this ecosystem and standards used like CLI. Before supporting OAuth
    and Java EE Security through the means of PicketLink seemed a logical step for
    Agora.


    PicketLink is an Application Security Framework for Java EE applications. It provides
    features for authenticating users, authorizing access to business methods of your
    application, managing the application''s users, groups, roles and permissions,
    etc.


    These are the Top 8 Java Application Security Problems Solved by PicketLink:


    +   1. What’s the best way to add security to the application?

    2. How do I authenticate and authorize users?

    3. How can I control access to classes and methods?

    4. How do I add Identity and Access Management (IAM) to my application?

    5. How can I create a secure multi-tenancy architecture for my SaaS (Software
    as a Service) application?

    6. How can I enable Single Sign-On based on SAML (Security Assertion Markup Language)
    in my application?

    7. How do I add authentication and authorization to my REST layer and API?

    8. How can my application authenticate users using their Facebook, Twitter or
    Google accounts?


    Figure 11 shows an overview of PicketLink, its key components and technologies
    it supports. Some marked “Coming Soon” are already under development, but do not
    come with the GA (Generally Available or “Stable”) version of PicketLink yet.'
