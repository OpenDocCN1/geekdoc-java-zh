  md: '# Agorar #agorava.DPHeading1 35


    +   * A generic identification API to retrieve basic user information from a Social
    Service (as Identity Provider)

    * A Multis manager API allowing to deal with multiple OAuth applications and sessions
    in the same application

    * Currently out of the box, Agorar connects to:


    +   * Twitter

    * Facebook

    * LinkedIn


    +   * And offers an easy way to extend it by creating a new modules for any other
    service or API required


    Agorar is independent of CDI implementation and fully portable between Java EE
    6 (minimum) and Servlet environments enhanced by CDI. It can also be used with
    CDI in Java SE in a Desktop or SE Embedded/Mobile application. It has been fully
    tested with the CDI RI implementation (JBoss Weld). Open Web Beans and Caucho
    Resin are also supported since the 0.5 release.


    Agorar is often explained as a sort of "Java Connector Architecture for Social".
    And indeed, there are striking similarities between the idea behind Agorar and
    what **Java Connector Architecture (JCA)** does under the Java EE umbrella.


    Java EE Connector Architecture defines a standard architecture for connecting
    the Java EE platform to heterogeneous Enterprise Information Systems (EIS) including
    transaction processing systems such as CICS Transaction Server and Enterprise
    Resource Planning (ERP) systems like SAP.


    Especially so called Common Client Interface (CCI), which defined a standard client
    API allowing applications to access multiple resource adapters.'
