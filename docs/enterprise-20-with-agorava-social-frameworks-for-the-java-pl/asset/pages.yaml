  md: '# Social Security [#social-security .DPHeading1]


    The revelations bywhistleblower Edward Snowden were the most extensive, but certainly
    not first case of privacy concerns brought into public light with regards to Social
    Networks or similar Online Services [32]. The ability to combine data from various
    sources and everyday life aspects into a digital picture and footprint of users
    was in prior decades mostly the domain of privacy and secret service tools like
    "Dragnet" (not so the movie, though it referred to the system in a humorous way).


    Not just Snowden and his skills now available to his hosts in Russia is a clear
    indicator, Western countries and agencies aren the only ones interested in such
    information. Many try to control simply block or restrict entries, if they are
    not provided the same access to vital information by the social networks intelligence
    agencies in their home country, usually the United States. China, Russia or Turkey,
    the list keeps growing of countries temporarily or permanently blocking providers.
    If ownership or hosting is outsourced, not for tax but cheap workforce reasons,
    then some services can be practiced by these countries, too. One of the most popular
    we heard about, because OpenID1.0 once created there is LiveJournal. In 2007 it
    was sold by Six Apart Russian media group SUP in December 2007.


    After 2009 most of its production was also moved to Russia and employees hired
    in Silicon Valley. Although privately owned, SUP Media is clearly controlled and
    also censored by Russian secret services. For example in 2007 Russian blogger
    Savva Terentyev was accused of fostering social hatred to the staff of Internal
    Affairs and sentenced to one year probation due to his comment in the log of a
    local journalist. Not to mention recent murders like that of regime-critical Boris
    Nemsov in Moscow only after he had announced to disclose information on Russia''s
    involvement in Ukraine. Ironically, even in one of the most censored countries
    like Russia, there is a tiny glimpse of hope, Social media if not bring real reforms
    may yet help finding clues to to his murder [33]


    While the effort of "National Security" and trying to catch terrorists or severe
    criminals online was used to justify mass surveillance on a global scale, critical
    bloggers or journalists often risk not just their privacy if their lives are unveiled
    to people and agencies they criticise.


    While efforts like the "Vorratsdatensicherung" by European hosting providers and
    other mobile companies, there isn''t total privacy in Europe either, most EU countries,
    Germany have strong privacy and data protection laws compared to the United States
    and many other parts of the world. A few countries like Iceland (not currently
    in EU, but EFTA) have even stronger data protection laws, as well as Scandinavian
    countries.


    Social networks genuinely based in these countries, e.g. German XING, also Deutsche
    Telekom and other internet companies from Germany GMX/1&1, their data is safe
    from direct access by NSA or other spies. Although local and international inquiries
    will be executed by these if probable cause exists against a user of serious offences
    like murder, terror, organised crime or pornography, neither of these services
    are likely to conduct mass-screening of every single user on a daily basis like
    NSA and other agencies do in the US and other countries. Without a warrant to
    access records or pre-emptively sniff into communication most European users should
    feel safe if the provider and their servers are genuinely based in Europe and
    data isn''t safe via connections.'
