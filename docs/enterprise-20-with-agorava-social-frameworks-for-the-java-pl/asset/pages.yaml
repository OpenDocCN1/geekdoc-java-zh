    # # OAuth #DPHeading3


    **OAuth** is an authorization protocol to delegate rights for an application to
    act on the behalf of a user who granted their rights without giving away login
    credentials like username or password.


    It was developed by Twitter, Magnolia and Google and registered as IETF standard
    in April 2010 under RFC 5849.


    OAuth version 2.0 is simpler to use but often criticised for having too many flavours
    and implementations. OAuth 2 was standardized again by IETF in October 2012 under
    RFC 6749 and 6750. It is not backward compatible with OAuth 1.0a.


    Some notable adopters are Facebook, Amazon, Google, Salesforce.com or Microsoft.


    All relevant social media APIs are based on either OAuth 1.0a or 2.0.'
