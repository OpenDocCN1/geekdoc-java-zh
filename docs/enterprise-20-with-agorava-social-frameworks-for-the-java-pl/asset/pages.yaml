  md: '# Standardisation #standardisation DPHeading1


    After being turned down or withdrawn a notice, notable standards for Social Networks,
    then often called "Portal" (by MSN earlier) was JSR 168 the Java Portal Specification
    [11] In an ideal world it allowed portal applications to be deployed into multiple
    portal servers regardless of the vendor and with other standards, the OASIS-defined
    WSRP (Web Services for Remote Portlets) raised hopes for interoperability between
    these applications across different ports. After 10 years, with other technologies
    and languages, especially "light weight containers" on the rise, the Java Portal
    standard is currently about to get a version 3.0 update (JSR 362) Planning to
    incorporate some of the later Social standards where possible.


    While Portlets and related standards are still mostly the dream of large scale
    Enterprise Application served by music or copies and remixes in a large language
    and platform approach called Mash [12] started shortly after the first Portal
    standard. Whether it was Yahoo Pipes, Microsoft Popfly, Google Mash Editor, IBM
    Mash Center or BEALogic [13] all of them promised interoperability and personalised
    widgets, with an experience similar to Google. A service, which mostly due to
    Google+ taking personalisation and a more "Integrated Social Media" to the next
    level, was shut down on November 1 2013.


    So RSS, was only a few months after Aaron Swartz''s death. Google Swartz as discontinued
    his unfinished book [10] advocated an open API based programmable web, most of
    the big providers have different plans, as numerous articles around Google Reader''s
    end like this one [14] express.


    Another social standard has been affected by this development most since its inception:
    OpenSocial [15] Developed by Google with a handful initial supporters, MySpace
    still the most popular social network at the time, Ning or Plaxo. At this time
    Portal Contacts mentioned earlier would also fit into the ideal idea of use Widgets
    and Services across a variety of social networking providers. As opposed to e.g.
    Version 2.0 of the Java Portal standard which released its Public Draft around
    the same time.


    While seemingly easier to use, so were exploits and security issues, often demonstrated
    by "script kids" or less of primary using schools to break or compromise these
    services and widgets. Full scale Java enterprises and Portlets are still and much
    harder to break into, if system administrators do their homework and all the fuzz
    about Java Security or it being used to transport malware usually affects the
    client side.


    Exactly where a vast majority of OpenSocial code runs it more exposed than a mostly
    server-side or carefully used mix of server (Java EE or other environments) and
    client tier (JavaScript.), See Figure N—Tier Enterprise Application for different
    types of the webbased Enterprise Application. Java EE, but it may replace it by
    other languages like Python, PHP, Ruby or Scala with the layers being the same.


    While Google began to use OpenSocial in its Orkut service (popular in Latin America
    and a few other countries like India, but really picked up others vendors initially
    planning to support it abandoned those plans one after the other. The likes of
    LinkedIn and XING especially did so for security reasons. XING as we''ll hear
    more about Security and Privacy about the latter, too. Neither Facebook nor Twitter,
    the two dominators from the second half of the last decade'
