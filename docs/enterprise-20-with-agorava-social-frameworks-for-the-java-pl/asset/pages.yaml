  md: '# Introduction


    overshadowed by short messaging services like Twitter. There are still around
    3200 IRC servers around the world with hundreds of thousands of channels available.


    Based on the notion of Six Degrees of Separation [6], the first modern social
    network, sixdegrees.com, was founded in 1997. It allowed members to link to other
    members as friends, write messages or post on bulletin boards. After being sold
    to another company, it was shut down in 2001 with roughly one million users. When
    services like Amazon, Yahoo! and 1998 Google first came into existence, they were
    not considered social networks.


    In 1995, Microsoft picked up on the emerging trends by launching the Microsoft
    Network (MSN). MSN became known as a ''portal'', another word for personalised
    online commerce. It wasn''t surprising when many portal products, services and
    vendors joined the social bandwagon a few years later.


    Both Microsoft and Yahoo! had fallen behind of social media''s new kids on the
    block and became a rather brilliant and fast move with YouTube, most other aspects
    of social media were also underestimated by Google, it returned via Google+ and
    is certainly here to see if it may not lead every aspect of it. Yahoo! also offers
    plenty of social features and has since its recent recovery over smaller vendors
    in the networking space like Flickr or Tumblr. 1993. Brad Fitzpatrick, now also
    working at Google Livejournal.


    At the start of the 2000s, MySpace and LinkedIn(and their somewhat different standing
    today years later) to the middle of that decade, when current giants Twitter or
    Facebook were founded, already Google acquired YouTube. In the last few years,
    we have seen several take-overs, most notably Facebook buying Instagram for close
    to a billion dollars or its gigantic takeover bid for mobile messaging provider
    WhatsApp.


    Social networks have always existed, since people first started to communicate.
    Technical means changed over time, and are are likely to change even faster in
    the near future. Some services will be merged; others might become irrelevant
    and vanish sooner or later. Using vendor-neutral standards and frameworks, that
    wont tie you into the offerings of just single provider is crucial, unless you
    want to spend more time on rapidly changing APIs than using it for something productive.
    Or worse, having to switch over to another provider, proprietary API and framework
    offered by a particular vendor is no longer available. While not a Social Network
    in the sense of Twitter of Facebook, the recently closed Bitcoin trading site
    Mt.Gox [7] was a good example for dilemma. It used to be market leader in this
    area for a long time, applications and e-commerce solutions offering Bitcoin may
    have used its API directly, now forced to throw these apps away and rewrite them.


    If a vendor-neutral abstraction is created on top of such API, then it is much
    easier to cope with problems and changes like those caused a vendor going out
    of business or being taken over by others.


    This is where Agora comes into play.'
