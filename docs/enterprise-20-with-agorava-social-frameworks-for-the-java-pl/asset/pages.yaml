  md: 'Social Security [#social-security .DPHeading1] 33


    In addition to that, services like XING also offer much finer grained levels of
    access permissions and control by its users. Where it is possible to sometimes
    restrict e.g. who can see each individual data item. Let''s say you want to show
    your name and day of birth, but not the year or your age to everyone visiting
    your profile, or allow only your friends to see your phone number, and this and
    more can be controlled by systems like XING.


    This was also among the main reasons, why XING abandoned OpenSocial, because it
    cannot offer such fine grained access control or in some cases won''t provide
    any, but instead show everything to everyone or at least data to all of your friends.


    As opposed to that, Agorava can leverage security mechanisms and access control
    by individual social networks. And being able to connect to selected services,
    even multiple of them in a single session, you can decide where you place what
    information and access it from the provider you best trust to handle it with the
    necessary care.'
