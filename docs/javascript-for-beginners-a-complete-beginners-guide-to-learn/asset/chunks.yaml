    ### 3.10 Built-in Functions

    JavaScript has the ability to work with some built-in functions that can be used
    in your code. The example below shows the use of a built-in math function.


    Example 18: The following program showcases a simple JavaScript program that uses
    built-in functions.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h1>Javascript Example</h1>

    <p id="demo"></p>

    <script>document.getElementById("demo").innerHTML = Math.PI;</script>

    </body>

    </html>

    ```


    ### 3.11 Working with Arrays

    JavaScript has the ability to work with elements as arrays. This helps programmers
    to work with a continuous set of elements as shown below.


    Example 19: The following program is used to showcase a simple JavaScript program
    that uses arrays.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h1>Javascript Example</h1>

    <p id="demo"></p>

    <script>var val = ["1", "2", "3"];document.getElementById("demo").innerHTML =
    val[0];</script>

    </body>

    </html>

    ```


    ### 3.12 Working with Errors

    JavaScript also has the ability to work with errors generated in the program by
    using try, catch blocks. The below example shows a simple program working with
    try, catch blocks.


    Example 20: The following program showcases a simple JavaScript program that uses
    error handling.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="demo"></p>

    <script>try {funcA("Hello World");}catch(err) {document.getElementById("demo").innerHTML
    = err.message;}</script>

    </body>

    </html>

    ```


    ### 3.13 Ability to Work with JSON

    JSON is known as JavaScript Object Notation and is used as an intermediate language
    like XML. JavaScript can also work with JSON objects as shown in the example below.


    Example 21: The following program showcases a simple JavaScript program that works
    with JSON.


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h2>JavaScript Example</h2>

    <p id="demo"></p>

    <script>var text = ''{"Names":['' +''{"firstName":"John","lastName":"Doe" },''
    +''{"firstName":"Peter","lastName":"Smith" }]}'';obj = JSON.parse(text);document.getElementById("demo").innerHTML
    =obj.Names[1].firstName + " " + obj.Names[1].lastName;</script>

    </body>

    </html>

    ```

