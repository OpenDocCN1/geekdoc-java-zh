    There are also numerous popular frameworks that have been developed based on the
    JavaScript language. Some of the most popular ones are given below with a short
    example of how the code looks for each.


    ### 2.1 Angular

    AngularJS is a structural framework for creating dynamic web applications. HTML
    can be used as the template language and AngularJS lets you then extend HTML''s
    syntax to express the application''s components clearly. AngularJS has support
    for data binding and dependency injection, which eliminates the needs to write
    this code yourself to carry out these tasks.


    Example 5: The following program is used to showcase a simple AngularJS program.


    ```html

    <!DOCTYPE html><html><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js"></script><body><div
    ng-app=""><p>Hello World</p></div></body></html>

    ```


    ### 2.2 Node.JS

    Node.JS is an open-source, cross-platform JavaScript run-time environment for
    executing JavaScript code server-side. Normally JavaScript is used as a client
    side language, but Node.JS changed this by implementing JavaScript that could
    be used on a server side framework.


    Example 6: The following program is used to showcase a simple Node JS program.


    ```javascript

    var http = require(''http'');http.createServer(function (req, res) {res.writeHead(200,
    {''Content-Type'': ''text/plain''});res.end(''Hello World!'');}).listen(8080);

    ```


    ### 2.3 React

    ReactJS is an open-source JavaScript library for building user interfaces. It
    is maintained by Facebook, Instagram and a community of individual developers
    and corporations.


    Example 7: The following program is used to showcase a simple React JS program.


    ```javascript

    var App = React.createClass({render: function() {return <div>Hello World</div>}});React.render(<App
    />, document.body);

    ```


    ### 2.4 JQuery

    JQuery is a fast, small, and feature-rich JavaScript library. It makes things
    like HTML document traversal and manipulation, event handling, animation, and
    Ajax much simpler with an easy-to-use API that works across a multitude of browsers.


    Example 8: The following program is used to showcase a simple JQuery program.


    ```html

    <!DOCTYPE html><html><script>$(document).ready(function(){$("p").click(function(){$(this).hide();});});</script><body></body></html>

    ```


    ## 3. Features of JavaScript

    JavaScript has an assortment of features. I will go over a few of them below:


    ### 3.1 Working with Objects

    Data in JavaScript is expressed as objects, which makes it easier and more extensible
    to work with various forms of data in JavaScript. Below is a simple example of
    a JavaScript program that uses an object defined as a variable.


    Example 9: The following program is used to showcase a simple JavaScript object.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="demo"></p><script>var
    value="Hello World";document.getElementById("demo").innerHTML = value;</script></body></html>

    ```


    ### 3.2 Data Types

    JavaScript works on the fact that it is a dynamically typed language. A variable
    can be set to a number and later to a string. Below is a simple example of a JavaScript
    program which works with data types.


    Example 10: The following program is used to showcase a simple JavaScript program
    on data types.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="demo"></p><script>var
    value=1;value="Hello World";document.getElementById("demo").innerHTML = value;</script></body></html>

    ```


    ### 3.3 Structured Language

    JavaScript follows a structured programming syntax wherein you can use the normal
    loop statements like “while loops” and “if statements”. Below is a simple example
    of a JavaScript program which works with decision making and loops.


    Example 11: The following program is used to showcase a simple JavaScript program
    on loop statements.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="demo"></p><script>var
    txt="";var i = 0;do {txt += "<br>The value is " + i;i++;}while (i < 10);   document.getElementById("demo").innerHTML
    = txt;</script></body></html>

    ```


    ### 3.4 Object Oriented

    JavaScript is almost an entirely object oriented language with the ability to
    define properties for variable objects. Below is a simple example of a JavaScript
    program which works with objects.


    Example 12: The following program is used to showcase a simple JavaScript program
    with objects.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><p id="chapter"></p><script>var
    Tutorial={Name:"Javacript",chapter:"Features"}document.getElementById("Name").innerHTML
    = Tutorial.Name;document.getElementById("chapter").innerHTML = Tutorial.chapter;</script></body></html>

    ```


    ### 3.5 Defining Functions

    JavaScript has the ability to split code into modules with the help of functions.
    The logic of a program can be split by defining functions across a JavaScript
    program. Below is a simple example of a JavaScript program which works with functions.


    Example 13: The following program is used to showcase a simple JavaScript program
    on classes.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><p id="chapter"></p><script>function
    myFunction() {return "Hello World";   document.getElementById("Name").innerHTML
    = myFunction();</script></body></html>

    ```


    ### 3.6 Event Handling

    Events can also be handled in JavaScript. So if you wanted code to run at the
    click of a button, it can be done. Functions can be used to define code that can
    be run when an event is triggered. Below is a simple example of a JavaScript program
    which works with event handling.


    Example 14: The following program is used to showcase a simple JavaScript program
    that works with event handling.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><p id="chapter"></p><script>function
    myFunction() {document.getElementById("Name").innerHTML = "Hello World";}</script><button
    onclick="myFunction()">Click Me</button></body></html>

    ```


    ### 3.7 Working with HTML DOM

    Probably the most important feature to have is the ability to modify the elements
    of an HTML page via its DOM structure. This is what makes JavaScript such a popular
    scripting language. Below is a simple example of a JavaScript program which works
    with HTML DOM.


    Example 15: The following program is used to showcase a simple JavaScript program
    that works with HTML DOM.


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p1 id="Name"></p1><script>document.getElementById("Name").innerHTML
    = "Hello World";</script></body></html>

    ```


    ### 3.8 Working with the Browser

    JavaScript is also deigned to work with many different browsers and has the capability
    of getting information from the browser window it is running in.


    Example 16: The following program showcases a simple JavaScript program that can
    be used to work with the browser window.


    ```html

    <!DOCTYPE html><html><body><h1>Javascript Example</h1><p1 id="demo"></p1><script>document.getElementById("demo").innerHTML
    = screen.width;</script></body></html>

    ```


    ### 3.9 Scope of Variables

    Variables in JavaScript also work with the concept of global vs local scope. The
    scope of the variable is in the block it is defined in. The example below shows
    a variable that is scoped locally.


    Example 17: The following program showcases a simple JavaScript program that uses
    a variable with local scope.


    ```html

    <!DOCTYPE html><html><body><h1>Javascript Example</h1><p1 id="demo"></p1><script>function
    demo() {var val=1;// The variable val an only used here}</script></body></html>

    ```

