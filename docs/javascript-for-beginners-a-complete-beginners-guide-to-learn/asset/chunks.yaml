    \ Implementing JavaScript\nNow that we have a general idea as to what JavaScript\
    \ is, we can start working with this language. As JavaScript code is part of the\
    \ HTML document, we need to know how to tell browsers to run our scripts. There\
    \ are two common options available to us when we want to include JavaScript in\
    \ a web document and in both cases we will use the `<script>` element. The `<script>`\
    \ tag is used when we want to tell the browser where the JavaScript code begins\
    \ and where it ends. As such this tag can be included either in the head or the\
    \ body of the page.\n\nThe first option is to place the code inline within the\
    \ document. To do this we will begin by opening a `<script>` tag, entering the\
    \ JavaScript code, and then finish by closing with the `</script>` tag. We can\
    \ theoretically leave the document like this as all browsers will assume that\
