    can see that operators are also useful when we want to join text and/or combine
    variables. As a matter of fact, we can use this to construct more logical sentences.
    For example, we can combine the "My name is" text with a value from a calculated
    variable. var firstName = "Martwan"; var lastName = "Jenkins"; var fullName =
    firstName+" "+lastName; document.write("My name is " +fullName); Note: When performing
    several mathematical operations in one statement, the rules of precedence apply. Assignment
    OperatorsJust like things change in real life, so do variables within a JavaScript
    program. And to change variables within JavaScript we will use assignment operators.
    We are already familiar with the fundamental assignment operator, the equal sign
    (=), which is used to give an initial or a new value to a variable. There are
    other assignment operators that also change the value of a variable, but they
    do this in a slightly different way.  For example, as the year passes we grow
    older and our age incrementally changes by one. To make this change in JavaScript
    there are several different approaches we can take, all with the same results.
    To play around with the possibilities of changing variables, we can try the following
    code where after the age variable changes its value is displayed in the browser: var
    age = 35; document.write("<p>My age is "+age+"</p>"); age = age + 1; document.write("<p>A
    year has passed, so now I am " +age+"</p>"); age += 10;document.write("<p>What?
    Are you telling me that I am a grandad now? But I am only " +age+"</p>");   While
    at first these operations might appear slightly confusing, they are still logical
    if viewed from the programming angle. For example, if we read the statement age=age+1
    backwards what happens is that the value of 1 is added to the current age of 35
    which would make 36 the new value of age. Additionally, we can use a complex assign
    operator such as (+=) in the statement age+=10, to increase the value of the variable
    by 10. We can also use the same logic to other operations like subtraction, division
    and multiplication.  age-=5;is the same asage = age - 5; age*= 5;is the same asage
    = age * 5; age/=5;is the same asage = age / 5; Additionally, when we want to increase/decrease
    the value of the variable by 1, we can also use the following assignment operators: age++;is
    the same asage = age + 1; age--;is the same asage = age - 1; Comparison OperatorsLike
    the name suggests comparison operators are used to compare two values. After the
    comparison is made a value of either true or false is returned depending on whether
    the comparison was exact or not.   Chapter 3: The History of JavaScriptJavaScript
    is a language that was created by Netscape in 1995 to develop products and applications
    to run in the browser. JavaScript has nothing to do with the Java language itself.
    It was just a ploy to name the language after the more popular Java language that
    was present at that point in time. Microsoft also tried to create its own scripting
    technologies such as VBScript and JScript.In November 1996, JavaScript was made
    a standard specification. ECMAScript is the name of the official standard, with
    JavaScript being the most well-known of the implementations. Since then, the language
    has undergone modifications and changes to ensure it remained one of the most
    popular client side scripting languages. Since JavaScript was adopted as an ECMA
    standard in 1997, it followed the release cycle of the ECMA standard.Below are
    the versions of the ECMAScript Language.'
