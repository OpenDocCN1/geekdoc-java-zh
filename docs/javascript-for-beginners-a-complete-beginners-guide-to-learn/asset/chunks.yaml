    <body>\n\n</body>\n</html>\n```\n\nWe can save the `firststeps.html` document\
    \ and open it in a web browser. Once the page opens, we will get an alert window\
    \ with the message \"JavaScript is starting to make a little sense\".\n\nNow that\
    \ we know what the effect is, let us go back to the JavaScript statement and interpret\
    \ it into common language so it makes more sense.\n\n```javascript\nalert(\"JavaScript\
    \ is starting to make a little sense.\");\n```\n\nJavaScript statements are instructions\
    \ which are executed by the web browser. The statement starts with a command,\
