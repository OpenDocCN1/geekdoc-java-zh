    \ from an external file into our HTML document. For this purpose we can use the\
    \ `<script>` element again, but this time in addition to the `type` attribute\
    \ we will also include the URL to the external file in the `src` attribute of\
    \ the `<script>` element. The external file must be a text-only file with `.js`\
    \ extension that contains only JavaScript code without any HTML elements or CSS\
    \ rules. For example, to call the `script.js` file into our browser we would use\
    \ the following:\n\n```html\n<script src=\"script.js\" type=\"text/javascript\"\
    ></script>\n```\n\nWe put JavaScript in an external file and include it in the\
    \ web page when we like to share functionalities across our entire site. Otherwise,\
    \ if we just need to add some local behavior, we embed the code within the page.\n\
    \n**Note:** Script files are loaded in the order in which they are placed in the\
    \ HTML code\n\n# Chapter 2: Fundamental JavaScript Concepts\nGenerally, when we\
    \ hear the term programming we immediately think of other people an incomprehensible\
    \ string of letters and numbers. Programming looks like magic beyond the realm\
    \ of mortals. Nevertheless, the concepts in programming are not difficult to grasp\
    \ as they always have real applications. JavaScript, although it is not simple\
    \ as HTML or CSS, is not an overly complicated language. Unlike other languages,\
    \ its \"grammar\" is more less descriptive and intuitive making it a good fit\
    \ for a first programming language. Basically, learning JavaScript is like learning\
    \ a new language, but a new language that is similar to English. Once we learn\
    \ the new words, and understand how to put them together to form \"sentences\"\
    \ we'll be to go.\n\n## Syntax\nEvery language has its own set of characters and\
    \ words that go along with a set of rules as how to arrange these characters and\
    \ words into a well-formed sentence. These rules are also known as the language\
    \ syntax and it is the syntax that holds the language together and gives it meaning.\n\
    \nBefore start with some examples of JavaScript syntax, let us first set up the\
