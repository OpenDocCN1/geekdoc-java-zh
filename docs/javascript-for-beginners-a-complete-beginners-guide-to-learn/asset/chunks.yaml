    \ quote marks (\"sense\") or single quote marks ('sense') present the text.\n\n\
    Before we move on, let us look at another statement. In the `<script>` element\
    \ replace the previous code with the following and preview it in web browser to\
    \ see the results:\n\n```javascript\ndocument.write(\"<p>JavaScript is starting\
    \ to make a little sense.</p>\");\n```\n\nWhat we can see from the results is\
    \ that the previously empty, now has one paragraph of text. Following the previous\
    \ interpretation of how JavaScript works and from web results we can correctly\
    \ assume that `document.write` commands the browser to write directly onto whatever\
    \ is placed between the opening and closing brackets.\n\n## Variables\nOne of\
    \ the fundamental aspect of JavaScript, and any programming language in general,\
    \ is the concept of variables. A variable is a way to declare and store information\
    \ which can be used. This information can vary with the circumstances and hence\
    \ the name. Let us look the following statement.\n\n```javascript\nvar name =\
    \ \"Martin\";\n```\n\nIn plain language this is the same as saying \"My name is\
    \ Martin\". The keyword `var` is speak for \"create a variable\", or in programming\
    \ dialect, \"declare a variable\". What follows is the name of the variable which\
    \ can be anything with certain limits. Assigning a value to the variable is done\
    \ with the `=` sign, which is not immediately necessary, as this can happen later.\
    \ We can declare an undefined variable in one statement and assign it a value.\
    \ For example:\n\n```javascript\nvar name;\nname = \"Martin\";\n```\n\nAs mentioned\
    \ previously, variable names can contain letters, numbers, dollar sign (`$`),\
    \ or underscore (`_`), other special characters are not allowed. Furthermore,\
    \ a variable name cannot begin with a number, any other value is acceptable. Finally,\
    \ variable names are case-sensitive, meaning that the interpreter makes distinction\
    \ between uppercase and lowercase letters.\n\n**Note:** Although we can use almost\
    \ anything for a variable name, it is wise to use names which are meaningful as\
    \ this will help us and other programmers to better understand.\n\n## Variable\
    \ Types\nBased on the type of data, variables come in different flavors. The three\
    \ most basic types are number, string, and boolean.\n\nA number variable is represented\
    \ by a numeric character. This variable can accept whole integers, negative integers\
    \ and fractional integers. Numbers are frequently used in calculations, hence\
    \ our number variables are often included in mathematical operations. The following\
    \ statement declares a variable named `age` and assigns it a value of 35.\n\n\
