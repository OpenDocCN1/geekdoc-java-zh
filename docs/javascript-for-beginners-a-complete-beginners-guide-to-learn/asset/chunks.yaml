    \ a part of the HTML code. Therefore, in order to work with JavaScript we will\
    \ first need to create a HTML document. So to start, let us open a text editor\
    \ (like Notepad) and type in the HTML code for the most basic web page. In addition\
    \ to the basic HTML tags, we will include a `<script>` element in the `<head>`\
    \ section where we will start placing the JavaScript code.\n\n```html\n<!doctype\
    \ html>\n<head>\n<title>First Steps in JavaScript</title>\n<script type=\"text/javascript\"\
    ></script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\nLet us save this document\
    \ as `firststeps.html`. If we are using Notepad, we have to remember to change\
    \ the Save as Type field to ‘All files’.\n\n## Statements\nTo express ourselves\
    \ in everyday common language we use sentences as the basic form of communication.\
    \ Similarly, in JavaScript we also form sentences to express our intentions which\
    \ are more formally called statements. A JavaScript sentence is the basic unit\
    \ of communication, usually representing a single step in the program. And just\
    \ like we put sentences together to express an opinion, we combine statements\
    \ together to create a program.\n\nLet us look at a simple JavaScript statement\
    \ and see what it does. Between the opening and closing `<script>` tag of the\
    \ html document places the following text:\n\n```javascript\nalert(\"JavaScript\
    \ is starting to make a little sense.\");\n```\n\nIn further examples we will\
    \ not show the complete HTML code unless it is necessary, but for initial reference\
    \ your document should look like the following:\n\n```html\n<!doctype html>\n\
