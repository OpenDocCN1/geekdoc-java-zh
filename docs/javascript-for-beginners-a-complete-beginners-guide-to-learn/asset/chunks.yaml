- fmt: "\n# Chapter 4: Basics of CSS3\n\nCascading Style Sheets or CSS provide the\
    \ presentation that webpages are known for. Although, HTML is capable of providing\
    \ a basic structure to the webpage, CSS offers developers host of design options.\
    \ Besides this, it is fast and efficient, which makes it an all more popular design\
    \ tool. CSS is known to have evolved from SGML (Standardized Generalized Markup\
    \ Language). The goal of efforts made in this direction was to standardize the\
    \ manner in which web pages looked. The latest version of this technology is `CSS3`,\
    \ which is a collection of 50 modules.\n\nThe most powerful characteristic of\
    \ CSS is its cascading ability. Simply, it allows a webpage to take its styles\
    \ from multiple sheets in such a manner that changes to the style in subsequently\
    \ read sheets overwrite the style already implemented from one or more of the\
    \ previous sheets.\n\n## How to Define and Apply Style\n\nThe definition and application\
    \ of a style involves two facets or parts: selector and declaration. While the\
    \ selector determines the area of the webpage that needs to be styled, the declaration\
    \ block describes the style specifications that have to be implemented. In order\
    \ to illustrate how it works, let us consider the following example:\n\n```css\n\
    body {color: white;}\n```\n\nIn this example, the selector selects the `body`\
    \ of the webpage and the declaration block defines that font color should be changed\
    \ to white. This is a simple example and declarations can be much complex than\
    \ this.\n\n## How to Add Comments\n\nComments can be added to the style sheet\
    \ using the following format:\n\n```css\n/*write the comment*/\n```\n\n## How\
    \ to Create an Inline Style\n\nEvery element has an associated global attribute\
    \ `style`. This global attribute can be manipulated within the tag to modify the\
    \ appearance of that element. This type of styling does not require you to specify\
    \ the selector. Only the declaration block is required. An example of how this\
    \ is done is below:\n\n```html\n<body style='color: white;'></body>\n```\n\nThis\
    \ `HTML` tag performs the same functionality as the CSS code specified in previous\
    \ section. The advantage of using this approach is that the style information\
    \ given in this manner overwrites any other. Therefore, if you need to use different\
    \ style for one element while the rest of the document needs to follow a different\
    \ style, you can use a stylesheet for the document and specify the style for this\
    \ element in its tag.\n\n## How to Use Embedded Style\n\nAnother approach for\
    \ accomplishing the same outcome as inline styles is to use the `<style>` element\
    \ within the element concerned for defining its style specification. Here is how\
    \ this can be done:\n\n```html\n<!DOCTYPE html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n\
    <head>\n<title></title>\n<style>body {color: white;}</style>\n</head>\n<body></body>\n\
    </html>\n```\n\n## How to Create External Style Sheet\n\nFor usages where you\
    \ wish to use the same style for the complete webpage or a number of webpages,\
    \ the best approach is to use an external style sheet. This external style sheet\
    \ can be linked to the HTML page in the following manner:\n\n```html\n<!DOCTYPE\
    \ html>\n<html xmlns='http://www.w3.org/1999/xhtml'>\n<head>\n<title></title>\n\
    <link rel='stylesheet' type='text/css' href='Content/main.css' />\n</head>\n<body></body>\n\
    </html>\n```\n\nYou must create a file `main.css`, in the `Content` folder, and\
    \ put the style rule specified below into it:\n\n```css\nbody {color: white;}\n\
    ```\n\n## Defining Media\n\nIt is important to note that a style sheet can contain\
    \ as many style rules as you want. Besides this, you can also link different CSS\
    \ files for different media. The different media types are as follows:\n* `all`\n\
    * `embossed`\n* `braille`\n* `print`\n* `handheld`\n* `speech`\n* `screen`\n*\
    \ `tv`\n* `tty`\n\nThe media used can be defined in the following manner:\n\n\
    ```html\n<link rel='stylesheet' type='text/css' href='Content/all.css' media='all'/>\n\
    ```\n\n## Defining Character Encoding\n\nYou can also define the character encoding\
    \ used, using the following format:\n\nStyle sheet:\nPlace the following line\
    \ above the style rule in the style sheet.\n```css\n@charset 'UTF-8';\n```\n\n\
    HTML page:\nYou must place this line above the link element.\n```html\n<meta http-equiv='Content-Type'\
    \ content='text/html;charset=UTF-8'>\n```\n\n## Importing style Sheets\n\nAs your\
    \ web pages becomes complex, the style sheets used shall also grow in complexity.\
    \ Therefore, you may need to use many style sheets. You can import the style rules\
    \ present in one style sheet to another by using:\n\n```css\n@import url('/Content/header.css');\n\
    ```\n\nHere, `header.css` is imported and the `url` gives the relative address\
    \ of the style sheet to be imported.\n\n## Importing Fonts\n\nFonts can be imported\
    \ using the following format:\n\n```css\n@font-face {font-family: newFont;src:\
    \ url('New_Font.ttf'),url('New_Font.eot'); /* IE9 */\n```\n\n## Selectors, Specificity\
    \ and Cascading\n\nSelectors can be of three types: class selectors, ID selectors\
    \ and element selectors. The element selector type is the simplest and requires\
    \ you to simply name the element that needs to be used. For instance, if you wish\
    \ to change the background color of the `body`, then the element selector used\
    \ is `body`.\n\nWhile declaring any element, you can assign an ID to it using\
    \ the `id` attribute. You can use this ID prefixed with a `#` as a selector. For\
    \ example, if you have created a button with ID `btnID`, then the ID selector\
    \ for this will be `#btnID`. Similarly, you can assign a class name to an element\
    \ using the `class` attribute. Class name can be used prefixed by a dot (`.`)\
    \ in the following manner, `.className`. However, if you wish to select all the\
    \ elements of the webpage, then asterisk `*` to it.\n\n## Using Descendent and\
    \ Child Selectors\n\nYou may wish to apply a particular style to a descendant\
    \ of a selector. This can be done by specifying the complete selector change.\
    \ It can be done in the following manner:\n\n```css\nli a {text-color: black;}\n\
    ```\n\nOn the other hand, you may want to apply to an element only if it is a\
    \ direct child of the selector. This can be implemented by specifying the parent\
    \ and child separated by a greater than (`>`) sign, in the following manner:\n\
    \n```css\nli > a {color: white;}\n```\n\n## Pseudo-element and Pseudo-class Selectors\n\
    \nNow that you know how to apply styles to specific elements, let us move on to\
    \ implementing styles to more specific sections like the first line of the second\
    \ paragraph. In order to style elements that cannot be classified on the basis\
    \ of name, content or is not a part of the DOM tree can be styled using pseudo-classes.\
    \ The available pseudo-classes include:\n* `:visited`\n* `:link`\n* `:hover`\n\
    * `:active`\n* `:checked`\n* `:focus`\n* `:nth-last-child(n)`\n* `:not`\n* `:only-child`\n\
    * `:nth-child(formula)`\n* `:lang(language)`\n* `:first-of-type`\n* `:only-of-type`\n\
    \nIf you want to access information of the DOM tree that is not accessible, you\
    \ can use pseudo-elements. Pseudo-elements include:\n* `::first-letter`\n* `::first-line`\n\
    * `::after`\n* `::before`\n\n## Grouping Selectors\n\nMultiple selectors can be\
    \ used for a style rule. These selectors must be separated by commas.\n\n```css\n\
    body, button {color: white;}\n```\n\n## Using Adjacent Selectors\n\nIf you want\
    \ to style the first heading in a `div` or any adjacent elements, the selector\
    \ is constructed using plus sign (`+`) between the two selectors.\n\n```css\n\
    div + h1 {color: white;}\n```\n\n## Sibling Selectors\n\nSibling selectors are\
    \ similar to adjacent selectors except for the fact that all matching elements\
    \ are styled against adjacent selectors, which only style the first matching element.\
    \ The selector is constructed using `~` sign between the two.\n\n```css\ndiv ~\
    \ h1 {color: white;}\n```\n\n## Using Attribute Selector\n\nThis selector selects\
    \ all the elements for which the specified attribute exists. The selector is written\
    \ in this form:\n\n```css\na[title]\n```\n\nThis selector will select all the\
    \ links for which `title` attribute has been specified. Moreover, this selector\
    \ type can be modified into attribute-value selector by specifying the attribute\
    \ value in the following manner:\n\n```css\na[title = value]\n```\n\n## Built\
    \ Styles of Browsers\n\nEvery browser has a built-in stylesheet, which is applied\
    \ to all the webpages opened using this browser. In fact, this stylesheet is applied\
    \ before any other style sheet. You can define your own style sheet for the browser\
    \ using the Accessibility option. However, user style sheets are browser specific.\
    \ Therefore, if you open a different browser, the style sheet you defined may\
    \ not be accessible. In case you want your user-defined stylesheet to override\
    \ any other style specified in the HTML page, then you can use the `important`\
    \ modifier. This modifier sets highest priority for the specified style statement.\n\
    \n```css\nbody {color: white !important;}\n```\n\n## Cascading of Styles\n\nThe\
    \ precedence and priority of the styles are decided on the basis of the following\
    \ parameters:\n* Importance\n* Specificity\n* Textual Order\n\n## Working with\
    \ CSS Properties\n\nNow that you are thorough with the use of selectors, the next\
    \ step is to look at CSS properties.\n\n### Color\n\nOne of the most crucial properties\
    \ that are used in a web page is `color`, which can be defined using ARGB, RGB\
    \ and color names. RGB value are typically defined using a decimal number, which\
    \ lies between 0-255. \n* white `#ffffff`\n* red `#ff0000`\n* black `#000000`\n\
    * green `#008000`\n\nColor values can also be used instead of the color name.\
    \ An example of how this can be used is given below:\n\n```css\nbody {color: #ffffff;}\n\
    ```\n\nAnother way to specify the color is using the `rgb` function, which specifies\
    \ the values of parameters using a number between 0-255 or percentage. Example\
    \ of this type of declaration is given below:\n\n```css\nh1 { color: rgb(255,0,0);\
    \ }\n```\n\nOther ways to specify color are `RGBA`, which accepts 4 values and\
    \ `HSL`, which defines values for hue, saturation and lightness.\n\n### Transparency\n\
    \nThe transparency or opacity are defined by a value between 0.0 (invisible) and\
    \ 1.0 (opaque).\n\n### Text\n\nAs far as text is concerned, `font-face` and `font-size`\
    \ can be specified. These properties can be defined in the following manner:\n\
    \n```css\nh1 { font-family: arial, verdana, sans-serif; }\nh1 { font-size: 12px;\
    \ }\n```\n\n### The CSS Box Model\n\nThe CSS Box Model assumes that a webpage\
    \ can be considered to be made up of boxes. The spacing between these boxes are\
    \ given by margins and padding settings. These properties can be given values\
    \ in the following manner:\n\n```css\nmargin: 15px;\npadding: 25px;\nborder: 10px;\n\
    ```\n\n### Positioning `<div>` elements\n\nThe element used for creating page\
    \ layouts is `<div>`. Although, HTML5 recommends the use of semantic markup instead\
    \ of `div` elements, there are still used for content that cannot be styled using\
    \ semantic markup. A `div` element can be imagined as a rectangular block and\
    \ is declared in the following manner:\n\n```html\n<div>--other elements are enclosed\
    \ within</div>\n```\n\nProperties used to define the position of `div` include:\n\
    * `top`\n* `bottom`\n* `left`\n* `right`\n* `static`\n* `relative`\n* `float`\n\
    * `clear`\n* `box-sizing`\n\n### Centering Content\n\nIf you are using `fixed`,\
    \ the `div` element can be centered using `margin-left` and `margin-right`. If\
    \ you set the `width` to `auto`, the extra space is equally divided. It can be\
    \ done in the following manner:\n\n```css\n#container {width: 850px;margin-left:\
    \ auto;margin-right: auto;}\n```\n\n# Chapter 5: Thinking Slowly and Staying Humble\n\
    \nWriting code can go quickly especially when you know what you are doing and\
    \ when you have a lot of experience with the codes that you are writing. You may\
    \ go quickly, and that can cause you to make mistakes. This is especially true\
    \ if you are becoming very experienced with JavaScript and if you feel like you\
    \ are going to do more with it. You may also find that, when you get better at\
    \ writing code, you rush. It is not a terrible thing to have confidence, but it\
    \ can lead to you missing out on some of the things. To make sure that you are\
    \ doing the best job with your code, even when you are practicing, you should\
    \ make sure that you think as slowly as possible and that you don’t get overly\
    \ in your abilities.\n\n## Slowing Down\n\nAs you write the codes that you are\
    \ thinking about, make sure that you go as slow as possible. It may take more\
    \ time initially, but it will save you a lot of time when it comes to going back\
    \ and looking at the different things that you have made. By going slowly, you\
    \ will be less likely to create errors. Even as you are looking back at your code\
    \ and going through each line, look at it slowly. Read each letter and symbol\
    \ so that you will know what you are talking and so you will be able to see if\
    \ you missed anything. This is like proofreading the way that you might have done\
    \ in high school or college when you wrote a paper. Slow down to proofread the\
    \ work that you wrote and the codes that you did line by line. This slow pace\
    \ will help you catch any mistakes you may have. It is also worth noting that\
    \ going slower will help you avoid any major errors in the work. If you are moving\
    \ at a slower pace, you will be more aware of each keystroke and each thing you\
    \ put into all of lines of code.\n\n## Taking a Break\n\nIt is always beneficial\
    \ for you to take a break from the work that you are doing. After looking at lines\
    \ of code for hours on end, your eyes will not only be tired but your mind will\
    \ begin to get weary, too. A break will help you to refresh what you are doing\
    \ and allow you the chance to come back and start over with a blank canvas in\
    \ your mind. There are many benefits of having a fresh mind when you are writing\
    \ code and breaks will give you the perfect refresher. In general, for every hour\
    \ that you work on code, you should take 5-10 minutes to look away from the computer,\
    \ get up and walk around and do something that does not involve anything with\
    \ JavaScript. It is a good idea to take this time to step outside and get some\
    \ fresh air or to simply walk around getting a bit of exercise. Doing both of\
    \ these activities will help get the blood flowing and will give you the oxygen\
    \ that you need in your brain to help it work more efficiently when you decide\
    \ to go back down and start working on the code again.\n\nA word of caution: try\
    \ to stay off of your cell phone during the time that you are taking a break from\
    \ your computer screen. While much smaller, the screen on your cell phone emits\
    \ the same blue light that can be detrimental from your computer screen. Set aside\
    \ specific time for using your cell phone while you are working so that you don’t\
    \ have to use up your break time to chat with your friends or check your non-business\
    \ emails. It is a good idea to just keep the cell phone out of reach when you\
    \ are taking a break.\n\n## Working Through It\n\nOnce you have written the code\
    \ that you want to write, you need to make sure that you are working your way\
    \ through it. Do this as slowly as you did the writing process so that you will\
    \ be able to catch any mistakes you have made. You should do this after you have\
    \ written your final line of code and before you take the chance to check it out\
    \ by testing it for different things. It is always a good idea to make that you\
    \ are going slowly and looking at each line of code.\n\nOne way that you can be\
    \ sure that you are looking at every character of code that you have written is\
    \ to read it out loud. Say each of the letters, numbers and characters to yourself\
    \ so that you will not miss. Reading it out loud will show you what you actually\
    \ written and will take more time than just reading it in your head.\n\n# Chapter\
    \ 6: Basic Operators\n\n## What are operators?\n\nOperators are basically symbols\
    \ which act as a function, though they differ from functions syntax-wise. They\
    \ take input (operands) and produce a certain output based on the operands. For\
    \ example in `5+2`, `5` and `2` are operands (the input), and the `+` symbol is\
    \ the operator, which results to `7`.\n\n## Classification of operators\n\nOperators\
    \ are generally classified on the basis of the type of operation they do. Operators\
    \ like `typeof`, `instanceof`, etc. are unique and thus cannot be classified under\
    \ the categories about which you will read below.\n\n## Arithmetic Operators\n\
    \nAs the hints, these are the operators which perform arithmetic tasks on the\
    \ operand(s). Listed below are the arithmetic operators.\n\n* Addition (`+`):\
    \ This operator performs an addition operation on two operands if both of them\
    \ are numerical; if anyone or both of the two operands are of string type then\
    \ this operator concatenates/joins the two operands.\n  ```\n  4 + 2 // evaluates\
    \ to 6\n  'example' + 5 // evaluates to \"example5\"\n  'thisIs' + 'Example' //\
    \ evaluates to \"thisIsExample\"\n  ```\n* Subtraction (`-`): This operator performs\
    \ a subtraction operation on two operands.\n  ```\n  4-2 // produces the result\
    \ 2\n  ```\n* Division (`/`): This operator performs division operation on two\
    \ operands, where the operand on left side (dividend) is divided by the operand\
    \ on the right side (divisor).\n  ```js\n  15/3 // produces the result 3\n  ```\n\
    * Multiplication (`*`): This operator performs multiplication operation on two\
    \ operands.\n  ```js\n  4*2 // produces the result 8\n  ```\n* Modulus (`%`):\
    \ Also known as a Remainder operator, this operator results in the remainder of\
    \ the two operands when they are divided.\n  ```js\n  5%2 // produces the result\
    \ 1\n  5%3 // produces the result 2\n  ```\n* Increment (`++`): Increases the\
    \ value of its numerical operand by one. The position of this operator matters,\
    \ i.e., whether it is placed before or after it. If placed before operand, then\
    \ situation is called prefix (`++x`), and the value is returned after the incrementing\
    \ operation; if placed after the operand then situation is called postfix (`x++`).\n\
    \  ```js\n  console.log(++x); // prints 6\n  console.log(y++); // prints 5, then\
    \ becomes 6\n  ```\n* Decrement (`--`): Decreases the value of its numerical operand\
    \ by one. Similar to increment operator, the postfix and prefix rule applies here.\n\
    \  ```js\n  console.log(--x); // prints 4\n  console.log(y--); // prints 5-6\n\
    \  ```\n* Exponential (`**`): This operator produces the result obtained by increasing\
    \ the first operand by the second operand.\n  ```js\n  2**3 // produces the result\
    \ 8\n  ```\n\n## Assignment Operators\n\nThese operators are used to assign values\
    \ to variables. Value is assigned to the left operand based on the right operand.\n\
    \n* Equal (`=`): This operator simply assigns the value of its right operand to\
    \ the left operand.\n  ```js\n  x=5\n  ```\n* Addition (`+=`): This operator adds\
    \ the value of the left operand and the right operand and assigns the result to\
    \ the left operand.\n  ```js\n  x+=3 // result 8\n  ```\n* Subtraction assignment\
    \ (`-=`): This operator subtracts the value of the right operand from the left\
    \ operand and then assigns the result to the left operand.\n  ```js\n  x-=3 //\
    \ result 5\n  ```\n* Multiplication assignment (`*=`): This operator multiplies\
    \ the left and right operand and assigns the result to the left operand.\n  ```js\n\
    \  x*=2 // result 10\n  ```\n* Division assignment (`/=`): This operator divides\
    \ the left operand (dividend) by the right operand (divisor) and then assigns\
    \ the result to the left operand.\n  ```js\n  x/=2 // result 5\n  ```\n* Modulus\
    \ assignment (`%=`): This operator divides the left operand (dividend) by the\
    \ right operand (divisor) and then assigns the REMAINDER to the left operand.\n\
    \  ```js\n  x%=2 // result 1\n  ```\n* Exponentiation assignment (`**=`): This\
    \ operator increases the value of left operand by the power of right operand and\
    \ assigns the result produced to the left operand.\n  ```js\n  x**=3 // result\
    \ 8\n  ```\n\n## Other Operators\n\nThese are the type of operators which cannot\
    \ be categorized under the above-mentioned.\n\n* `typeof`: This operator returns\
    \ the type of operand in string format.\n  ```js\n  typeof 2 // evaluates to \"\
    number\"\n  typeof 1.23 // evaluates to \"number\"\n  typeof \"2\" // evaluates\
    \ to \"string\"\n  typeof 'hi' // evaluates to \"string\"\n  typeof true // evaluates\
    \ to \"boolean\"\n  typeof false // evaluates to \"boolean\"\n  typeof {ob:1}\
    \ // evaluates to \"object\"\n  typeof new Date() // evaluates to \"object\"\n\
    \  typeof Math.cos // evaluates to \"function\"\n  typeof function(){} // evaluates\
    \ to \"function\"\n  ```\n* `instanceof`: This operator checks if the first operand,\
    \ which should be an object, is of a specific type, where the type to be checked\
    \ is specified as the second operand. It returns true or false based on whether\
    \ the object type matched or not.\n  ```js\n  new String(\"A\") instanceof String\
    \ // evaluates to true\n  [\"this\",\"is\",\"array\"] instanceof Array // evaluates\
    \ to true\n  new String(\"A\") instanceof Array // evaluates to false\n  [\"this\"\
    ,\"is\",\"array\"] instanceof String // evaluates to false\n  ```\n* `delete`:\
    \ This operator removes a property from an object.\n  ```js\n  var myObject =\
    \ {prop1:\"test\",prop2:\"test\"};\n  delete myObject.prop1 // deletes the prop1\
    \ property of object myObject\n  ```\n* `in`: This operator checks whether a specified\
    \ property (first operand) is in the specified object (second operand). It returns\
    \ true or false based on whether the property is in the object or not.\n  ```js\n\
    \  var myObject = {prop1:\"test\",prop2:\"test\"};\n  \"prop1\" in myObject //\
    \ evaluates to true\n  \"prop45\" in myObject // evaluates to false\n  ```\n\n\
    This chapter explained operators in JavaScript. I hope you found it useful.\n"
