    还有许多基于 JavaScript 语言开发的流行框架。下面是其中最流行的几个，并附带每个代码的简短示例。


    ### 2.1 Angular

    AngularJS 是一个用于创建动态 Web 应用程序的结构框架。HTML 可以作为模板语言，而 AngularJS 允许你扩展 HTML 语法来清晰地表达应用程序组件。AngularJS
    支持数据绑定和依赖注入，这消除了自己编写代码来执行这些任务的需求。


    示例 5：以下程序用于展示一个简单的 AngularJS 程序。


    ```html

    <!DOCTYPE html><html><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.4/angular.min.js"></script><body><div
    ng-app=""><p>Hello World</p></div></body></html>

    ```


    ### 2.2 Node.JS

    Node.JS 是一个开源、跨平台的 JavaScript 运行时，用于在服务器端执行 JavaScript 代码。通常 JavaScript 被用客户端语言，但
    Node.JS 通过实现可以在服务器端框架上使用的 JavaScript 改变了这一点。


    示例 6：以下程序用于展示一个简单的 Node JS 程序。


    ```javascript

    var http = require(''http'');http.createServer(function (req, res) {res.writeHead(200,
    {''Content-Type'': ''text/plain''});res.end(''Hello World!'');}).listen(8080);

    ```


    ### 2.3 React

    ReactJS 是一个用于构建用户界面的开源 JavaScript 库。它由 Facebook、Instagram 以及个人开发者和公司社区维护。


    示例 7：以下程序用于展示一个简单的 React JS 程序。


    ```javascript

    var App = React.createClass({render: function() {return <div>Hello World</div>}});React.render(<App
    />, document.body);

    ```


    ### 2.4 JQuery

    JQuery 是一个快速、轻量且功能丰富的 JavaScript 库。它通过一个易于使用且适用于多种浏览器的 API，让 HTML 文档遍历与操作、事件处理、动画和
    Ajax 等操作变得简单多倍。


    示例 8：以下程序用于展示一个简单的 JQuery 程序。


    ```html

    <!DOCTYPE html><html><script>$(document).ready(function(){$("p").click(function(){$(this).hide();});});</script><body></body></html>

    ```


    ## 3. JavaScript 的特性

    JavaScript 拥有一系列特性。我将在下面介绍其中一些：


    ### 3.1 使用对象

    JavaScript 中的数据以对象的形式表示，这使得处理 JavaScript 中各种形式的数据变得更加容易且更具扩展性。下面是一个使用变量定义对象的 JavaScript
    程序简单示例。


    示例 9：以下程序用于展示一个简单的 JavaScript 对象。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="demo"></p><script>var
    value="Hello World";document.getElementById("demo").innerHTML = value;</script></body></html>

    ```


    ### 3.2 数据类型

    JavaScript 的工作基于它是一种动态类型语言。变量可以设置为数字，稍后设置为字符串。下面是一个处理数据类型的 JavaScript 程序简单示例。


    示例 10：以下程序用于展示一个关于数据类型的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="demo"></p><script>var
    value=1;value="Hello World";document.getElementById("demo").innerHTML = value;</script></body></html>

    ```


    ### 3.3 结构化语言

    JavaScript 遵循结构化编程语法，你可以使用“while 循环”和“if 语句”等普通循环语句。下面是一个处理决策和循环的 JavaScript 程序简单示例。


    示例 11：以下程序用于展示一个关于循环语句的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="demo"></p><script>var
    txt="";var i = 0;do {txt += "<br>The value is " + i;i++;}while (i < 10);   document.getElementById("demo").innerHTML
    = txt;</script></body></html>

    ```


    ### 3.4 面向对象

    JavaScript 几乎是一门完全面向对象的语言，能够为变量对象定义属性。下面是一个处理对象的 JavaScript 程序简单示例。


    示例 12：以下程序用于展示一个带有对象的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><p id="chapter"></p><script>var
    Tutorial={Name:"Javacript",chapter:"Features"}document.getElementById("Name").innerHTML
    = Tutorial;document.getElementById("chapter").innerHTML = Tutorial;</script></body></html>

    ```


    ### 3.5 定义函数

    JavaScript 能够通过函数将代码拆分为模块。下面是一个在 JavaScript 程序中使用函数的简单示例。


    示例 13：以下程序用于展示一个关于类的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><p id="chapter"></p><script>function
    myFunction() {return "Hello World";}document.getElementById("Name").innerHTML
    = myFunction();</script></body></html>

    ```


    ### 3.6 事件处理

    事件也可以在 JavaScript 中处理。如果你想在点击按钮时运行代码是可以实现的。可以使用函数来定义在事件触发时运行的代码。下面是一个处理事件处理的 JavaScript
    程序简单示例。


    示例 14：以下程序用于展示一个处理事件处理的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><p id="chapter"></p><script>function
    myFunction() {document.getElementById("Name").innerHTML = "Hello World";}</script><button
    onclick="myFunction()">Click Me</button></body></html>

    ```


    ### 3.7 使用 HTML DOM

    最重要的特性之一是通过 DOM 修改元素。这使得 JavaScript 成为一种流行的脚本语言。下面是一个处理 HTML DOM 的 JavaScript
    程序简单示例。


    示例 15：以下程序用于展示一个处理 HTML DOM 的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>javascript Example</h1><p id="Name"></p><script>document.getElementById("Name").innerHTML
    = "Hello World";</script></body></html>

    ```


    ### 3.8 使用浏览器

    JavaScript 还设计用于与许多浏览器协作，并具有获取其所在的浏览器窗口信息的能力。


    示例 16：以下程序展示了一个可以与浏览器窗口工作的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>Javascript Example</h1><p1 id="demo"></p1><script>document.getElementById("demo").innerHTML
    = screen.width;</script></body></html>

    ```


    ### 3.9 变量的作用域

    JavaScript 中的变量涉及全局与局部作用域的概念。变量的作用域在其定义的块中。下面的示例展示了一个局部作用域的变量。


    示例 17：以下程序展示了一个使用局部作用域变量的简单 JavaScript 程序。


    ```html

    <!DOCTYPE html><html><body><h1>Javascript Example</h1><p1 id="demo"></p1><script>function
    demo() {var val=1;// 变量 val 仅在此处使用}</script></body></html>

    ```'
