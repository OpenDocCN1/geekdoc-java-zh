    - [Conclusion](#part0011.xhtml)\n\n# Introduction\nHTML is not very smart. It\
    \ mostly lets people look at text and images and allows them to move to other\
    \ pages where they will do more of the same. What adds the intelligence to a web\
    \ page is JavaScript. It makes the website more engaging, effective, and useful\
    \ by letting pages respond to our visitors when they interact with the content.\n\
    \nThis book assumes that we already know how to use HTML to specify web page structure\
    \ and content. It will be additionally beneficial if we are familiar how pages\
    \ are styled with CSS, separate from the web page structure. If this is the case\
    \ then we are ready to add a little behavior to the page and make it more dynamic\
    \ and interactive with JavaScript. Otherwise, without HTML and CSS, JavaScript\
    \ will not do us much good. They are viewed as the three fundamental pillars of\
    \ the web page: structure, presentation and behavior.\n\n# Chapter 1: What is\
    \ JavaScript?\nJavaScript is the scripting language of the web with the sole purpose\
    \ of adding interactivity to our pages. In addition to interactivity, modern versions\
    \ of JavaScript can also be used to load and parse information from external sources\
    \ or even the website's users. JavaScript is essentially a piece of programming\
    \ code embedded in the HTML structure of a web page. When the web browser reads\
    \ this code it activates a built-in interpreter that understands how to decipher\
    \ this language and process its commands.\n\nAlthough programming is involved\
    \ during coding, JavaScript is not a programming language. In conventional web\
    \ programming languages, like Java or .NET, the code has to be compiled before\
    \ it is executed. Compiling means that the code has to be first sent to a special\
    \ program that is run on the server. This program, also known as application server\
    \ software, translates the code, creates the requested page and/or functionality\
    \ and serves this back as HTML. Scripting languages, like JavaScript, are not\
    \ compiled, but rather are interpreted on-the-fly. This means that no special\
    \ software is involved as the user's own browser runs and executes the code as\
    \ it is encountered.\n\n**Note:** JavaScript was created during a time when Java\
    \ was a very popular language. Other than that, the languages are not related\
    \ and have almost nothing in common except for basic programming logic.\n\n##\
    \ Implementing JavaScript\nNow that we have a general idea as to what JavaScript\
    \ is, we can start working with this language. As JavaScript code is part of the\
    \ HTML document, we need to know how to tell browsers to run our scripts. There\
    \ are two common options available to us when we want to include JavaScript in\
    \ a web document and in both cases we will use the `<script>` element. The `<script>`\
    \ tag is used when we want to tell the browser where the JavaScript code begins\
    \ and where it ends. As such this tag can be included either in the head or the\
    \ body of the page.\n\nThe first option is to place the code inline within the\
    \ document. To do this we will begin by opening a `<script>` tag, entering the\
    \ JavaScript code, and then finish by closing with the `</script>` tag. We can\
    \ theoretically leave the document like this as all browsers will assume that\
    \ the scripting language between the `<script>` tags is JavaScript by default.\
    \ Nevertheless, for maximum compatibility we will extend this tag with the `type`\
    \ attribute and the `text/javascript` value in order to instruct the browser how\
    \ exactly interpret the code.\n\n```html\n<script type=\"text/javascript\">A JavaScript\
    \ comment\n</script>\n```\n\nThe second option is to load the JavaScript code\
    \ from an external file into our HTML document. For this purpose we can use the\
    \ `<script>` element again, but this time in addition to the `type` attribute\
    \ we will also include the URL to the external file in the `src` attribute of\
    \ the `<script>` element. The external file must be a text-only file with `.js`\
    \ extension that contains only JavaScript code without any HTML elements or CSS\
    \ rules. For example, to call the `script.js` file into our browser we would use\
    \ the following:\n\n```html\n<script src=\"script.js\" type=\"text/javascript\"\
    ></script>\n```\n\nWe put JavaScript in an external file and include it in the\
    \ web page when we like to share functionalities across our entire site. Otherwise,\
    \ if we just need to add some local behavior, we embed the code within the page.\n\
    \n**Note:** Script files are loaded in the order in which they are placed in the\
    \ HTML code\n\n# Chapter 2: Fundamental JavaScript Concepts\nGenerally, when we\
    \ hear the term programming we immediately think of other people an incomprehensible\
    \ string of letters and numbers. Programming looks like magic beyond the realm\
    \ of mortals. Nevertheless, the concepts in programming are not difficult to grasp\
    \ as they always have real applications. JavaScript, although it is not simple\
    \ as HTML or CSS, is not an overly complicated language. Unlike other languages,\
    \ its \"grammar\" is more less descriptive and intuitive making it a good fit\
    \ for a first programming language. Basically, learning JavaScript is like learning\
    \ a new language, but a new language that is similar to English. Once we learn\
    \ the new words, and understand how to put them together to form \"sentences\"\
    \ we'll be to go.\n\n## Syntax\nEvery language has its own set of characters and\
    \ words that go along with a set of rules as how to arrange these characters and\
    \ words into a well-formed sentence. These rules are also known as the language\
    \ syntax and it is the syntax that holds the language together and gives it meaning.\n\
    \nBefore start with some examples of JavaScript syntax, let us first set up the\
    \ environment for JavaScript. As discussed previously, JavaScript code is always\
    \ a part of the HTML code. Therefore, in order to work with JavaScript we will\
    \ first need to create a HTML document. So to start, let us open a text editor\
    \ (like Notepad) and type in the HTML code for the most basic web page. In addition\
    \ to the basic HTML tags, we will include a `<script>` element in the `<head>`\
    \ section where we will start placing the JavaScript code.\n\n```html\n<!doctype\
    \ html>\n<head>\n<title>First Steps in JavaScript</title>\n<script type=\"text/javascript\"\
    ></script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\nLet us save this document\
    \ as `firststeps.html`. If we are using Notepad, we have to remember to change\
    \ the Save as Type field to ‘All files’.\n\n## Statements\nTo express ourselves\
    \ in everyday common language we use sentences as the basic form of communication.\
    \ Similarly, in JavaScript we also form sentences to express our intentions which\
    \ are more formally called statements. A JavaScript sentence is the basic unit\
    \ of communication, usually representing a single step in the program. And just\
    \ like we put sentences together to express an opinion, we combine statements\
    \ together to create a program.\n\nLet us look at a simple JavaScript statement\
    \ and see what it does. Between the opening and closing `<script>` tag of the\
    \ html document places the following text:\n\n```javascript\nalert(\"JavaScript\
    \ is starting to make a little sense.\");\n```\n\nIn further examples we will\
    \ not show the complete HTML code unless it is necessary, but for initial reference\
    \ your document should look like the following:\n\n```html\n<!doctype html>\n\
    <head>\n<title>First Steps in JavaScript</title>\n<script type=\"text/javascript\"\
    >alert(\"JavaScript is starting to make a little sense.\");</script>\n</head>\n\
    <body>\n\n</body>\n</html>\n```\n\nWe can save the `firststeps.html` document\
    \ and open it in a web browser. Once the page opens, we will get an alert window\
    \ with the message \"JavaScript is starting to make a little sense\".\n\nNow that\
    \ we know what the effect is, let us go back to the JavaScript statement and interpret\
    \ it into common language so it makes more sense.\n\n```javascript\nalert(\"JavaScript\
    \ is starting to make a little sense.\");\n```\n\nJavaScript statements are instructions\
    \ which are executed by the web browser. The statement starts with a command,\
    \ presented by keyword. The keyword identifies the action that needs to be performed.\
    \ In this case the keyword `alert` makes the web browser open a dialog box and\
    \ display a message. If we just had the statement `alert()` the dialog box would\
    \ have been empty, however in our case the statement consists of a specific input,\
    \ the actual message text, also known as an argument. Finally, just like every\
    \ sentence ends with a period, a JavaScript sentence ends with a semicolon. The\
    \ semicolon makes it clear that the statement is over and once the interpreter\
    \ executes it, it should move on to the next item.\n\nNow we are ready to translate\
    \ the JavaScript statement. Its plain English interpretation would be, \"Open\
    \ a dialog box and display the text JavaScript is starting to make a little sense'\
    \ in that box.\"\n\n**Note:** When passing text arguments, we can use either double\
    \ quote marks (\"sense\") or single quote marks ('sense') present the text.\n\n\
    Before we move on, let us look at another statement. In the `<script>` element\
    \ replace the previous code with the following and preview it in web browser to\
    \ see the results:\n\n```javascript\ndocument.write(\"<p>JavaScript is starting\
    \ to make a little sense.</p>\");\n```\n\nWhat we can see from the results is\
    \ that the previously empty, now has one paragraph of text. Following the previous\
    \ interpretation of how JavaScript works and from web results we can correctly\
    \ assume that `document.write` commands the browser to write directly onto whatever\
    \ is placed between the opening and closing brackets.\n\n## Variables\nOne of\
    \ the fundamental aspect of JavaScript, and any programming language in general,\
    \ is the concept of variables. A variable is a way to declare and store information\
    \ which can be used. This information can vary with the circumstances and hence\
    \ the name. Let us look the following statement.\n\n```javascript\nvar name =\
    \ \"Martin\";\n```\n\nIn plain language this is the same as saying \"My name is\
    \ Martin\". The keyword `var` is speak for \"create a variable\", or in programming\
    \ dialect, \"declare a variable\". What follows is the name of the variable which\
    \ can be anything with certain limits. Assigning a value to the variable is done\
    \ with the `=` sign, which is not immediately necessary, as this can happen later.\
    \ We can declare an undefined variable in one statement and assign it a value.\
    \ For example:\n\n```javascript\nvar name;\nname = \"Martin\";\n```\n\nAs mentioned\
    \ previously, variable names can contain letters, numbers, dollar sign (`$`),\
    \ or underscore (`_`), other special characters are not allowed. Furthermore,\
    \ a variable name cannot begin with a number, any other value is acceptable. Finally,\
    \ variable names are case-sensitive, meaning that the interpreter makes distinction\
    \ between uppercase and lowercase letters.\n\n**Note:** Although we can use almost\
    \ anything for a variable name, it is wise to use names which are meaningful as\
    \ this will help us and other programmers to better understand.\n\n## Variable\
    \ Types\nBased on the type of data, variables come in different flavors. The three\
    \ most basic types are number, string, and boolean. \n\nA number variable is represented\
    \ by a numeric character. This variable can accept whole integers, negative integers\
    \ and fractional integers. Numbers are frequently used in calculations, hence\
    \ our number variables are often included in mathematical operations. The following\
    \ statement declares a variable named `age` and assigns it a value of 35.\n\n\
    ```javascript\nvar age = 35;\n```\n\nA string variable is used to represent any\
    \ series of letters like words or sentences. Strings are represented as a series\
    \ of characters enclosed within quotation marks, with the quotation marks signaling\
    \ to the interpreter that what follows is a string variable. JavaScript allows\
    \ us to use both double quotes (`\"`) or single quote (`'`) marks, but we have\
    \ to be mindful to use the same type of quotation mark.\n\n```javascript\nvar\
    \ location = \"California\";\n```\n\nA boolean variable is rather simple as it\
    \ can accept only one of two values: `true` or `false`. This variable is used\
    \ when we create programs that we want to intelligently react to user actions.\n\
    \n## User Variables\nJavaScript would not be fun if it't allow us to share our\
    \ thoughts and create or alter the variables directly. One of the simplest ways\
    \ to give our input is to use the `prompt()` command.\n\n```javascript\nvar name\
    \ = prompt(\"What is your name?\", \"\");\ndocument.write(name);\n```\n\nThe result\
    \ of the `prompt()` command is a dialog box. Instead of just displaying a message\
    \ like the alert dialog box, the prompt dialog box can also receive an answer.\
    \ Hence, in the syntax for a prompt dialog box it is necessary to provide two\
    \ arguments between the parentheses separated with a comma. The first argument\
    \ is the prompt text that is displayed in the box, while the second argument is\
    \ the default value for the text box, and consequently, the variable.\n\nIn the\
    \ example above, the prompt text displayed in the box will be 'What is your name?'\
    \ and the default value presented in the box will be empty, as there is obviously\
    \ no content between the quotation marks. Once we type in something in the box\
    \ and either click OK or press the Enter key, the variable receives the value\
    \ that entered in the field. Consequently, the name will be displayed on the web\
    \ page. Otherwise, if we click on Cancel, press the Esc key or close the prompt\
    \ box, the returned value would be empty and there would be no text on the screen.\n\
    \n**Note:** Instead of `prompt()` we can also use the more formal `window.prompt`\
    \ command.\n\n# Operators\nStoring information in a variable is a first step,\
    \ the beauty of programming is the ability to manipulate this information in many\
    \ creative ways. For this, JavaScript provides different operators that allow\
    \ us to modify data. An operator, represented by a symbol or a word, is something\
    \ that can change one or more values into something else. The type of operators\
    \ available are different based on the data type.\n\n## Mathematical Operators\n\
    The basic mathematical operators like addition (`+`), subtraction (`-`), multiplication\
    \ (`*`) and division (`/`) are readily available in JavaScript. They can be used\
    \ in independent statements or used when declaring variables. For example, by\
    \ operating with the variables `currentYear` and `yearOfBirth`, we can determine\
    \ the value of the variable `age`.\n\n```javascript\nvar currentYear = 2015;\n\
    var yearOfBirth = 1979;\nvar age = currentYear - yearOfBirth;\ndocument.write(age);\n\
    ```\n\n**Note:** Calling a variable to be presented on a web page is easy. Simply\
    \ use the `document.write()` command.\n\nMathematical operators, specifically\
    \ the addition operator, can be used to combine two or more strings. This process\
    \ of combining strings is called concatenation. In the following example:\n\n\
    ```javascript\nvar firstName = \"Martwan\";\nvar lastName = \"Jenkins\";\nvar\
    \ fullName = firstName + lastName;\ndocument.write(fullName);\n```\n\nMathematical\
    \ operators, specifically the addition operator, can be used to combine two or\
    \ more strings. This process of combining strings is called concatenation. In\
    \ the following example:\n\n```javascript\nvar firstName = \"Martwan\";\nvar lastName\
    \ = \"Jenkins\";\nvar fullName = firstName + lastName;\ndocument.write(fullName);\n\
    ```\n\nMathematical operators, specifically the addition operator, can be used\
    \ to combine two or more strings. This process of combining strings is called\
    \ concatenation. In the following example:\n\n```javascript\nvar firstName = \"\
    Martwan\";\nvar lastName = \"Jenkins\";\nvar fullName = firstName + lastName;\n\
    document.write(fullName);\n```\n\nMathematical operators, specifically the addition\
    \ operator, can be used to combine two or more strings. This process of combining\
    \ strings is called concatenation. In the following example:\n\n```javascript\n\
    var firstName = \"Martwan\";\nvar lastName = \"Jenkins\";\nvar fullName = firstName\
