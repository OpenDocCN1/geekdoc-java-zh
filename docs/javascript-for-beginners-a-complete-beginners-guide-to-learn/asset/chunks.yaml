    media used can be defined in the following manner:<link rel=''stylesheet'' type=''text/css''
    href=''Content/all.css'' media=’all’ />Defining Character EncodingYou can also
    define the character encoding used, using the following format:Style sheet:Place
    the following line above the style rule in the style sheet.@charset ''UTF-8'';HTML
    page:You must place this line above the link element.<meta http-equiv=''Content-Type''
    content=''text/html;charset=UTF-8'' >Importing style SheetsAs your web pages becomes
    complex, the style sheets used shall also grow in complexity. Therefore, you may
    need to use many style sheets. You can import the style rules present in one style
    sheet to another by using:@import url(''/Content/header.css'');Here, header.css
    is imported and the url gives the relative address of the style sheet to be imported.Importing
    FontsFonts can be imported using the following format:@font-face {font-family:
    newFont;src: url(''New_Font.ttf''),url(''New_Font.eot''); /* IE9 */Selectors,
    Specificity and CascadingSelectors can be of three types, class selectors, ID
    selectors and element selectors. The element selector type is the simplest and
    requires you to simply name the element that needs to be used. For instance, if
    you wish to change the background color of the body, then the element selector
    used is body.While declaring any element, you can assign an ID to it using the
    id attribute. You can use this ID prefixed with a # as a selector. For example,
    if you have created a button with ID btnID, then the ID selector for this will
    be #btnID. Similarly, you can assign a class name to an element using the class
    attribute. Class name can be used prefixed by a dot(.) in the following manner,
    .className.   However, if you wish to select all the elements of the webpage,
    then asterisk (*) to it. Using Descendent and Child SelectorsYou may wish to apply
    a particular style to a descendant of a selector. This can be done by specifying
    the complete selector change. It can be done in the following manner:li a {text-color:
    black;}On the other hand, you may want to apply to an element only if it is a
    direct child of the selector. This can be implemented by specifying the parent
    and child separated by a greater than (>) sign, in the following manner:li > a
    {color: white;}Pseudo-element and Pseudo-class SelectorsNow that you know how
    to apply styles to specific elements, let us move on to implementing styles to
    more specific sections like the first line of the second paragraph. In order to
    style elements that cannot be classified on the basis of name, content or is not
    a part of the DOM tree can be styled using pseudo-classes. The available pseudo-classes
    include:●        :visited●        :link●        :hover●        :active●       
    :checked●        :focus●        :nth-last-child(n)●        :not●        :only-child●
           :nth-child(formula)●        :lang(language)●        :first-of-type●       
    :only-of-typeIf you want to access information of the DOM tree that is not accessible
    otherwise, you can use pseudo-elements. Pseudo-elements include:●        ::first-letter●
           ::first-line●        ::after●        ::beforeGrouping SelectorsMultiple
    selectors can be used for a style rule. These selectors must be separated by commas.
    Sample implementation:body, button {color: white;}Using Adjacent SelectorsIf you
    want to style the first heading in a div or any similar adjacent elements, the
    selector is constructed using a plus sign (+) between the two selectors. Sample
    implementation:div + h1 {color: white;}Sibling SelectorsSibling selectors are
    similar to adjacent selectors except for the fact that all the matching elements
    are styled as against adjacent selectors, which only style the first matching
    element. The selector is constructed using a ~ sign between the two selectors.
    Sample implementation:div ~ h1 {color: white;}Using Attribute SelectorThis selector
    selects all the elements for which the specified attribute exists. The selector
    is written in this form:a[title]This selector will select all the links for which
    the title attribute has been specified. Moreover, this selector type can be modified
    into attribute-value selector by specifying the attribute value in the following
    manner:a[title = value]In-Built Styles of BrowsersEvery browser has a built-in
    stylesheet, which is applied to all the webpages opened using this browser. In
    fact, this stylesheet is applied before any other style sheet. You can define
    your own style sheet for the browser using the Accessibility option in Tools.
    However, user style sheets are browser specific. Therefore, if you open a different
    browser, the style sheet you defined may not be accessible.  In case, you want
    your user-defined stylesheet to override any other style specified in the HTML
    page, then you can use the ‘!important’ modifier. This modifier sets highest priority
    for the specified style statement. Sample implementation:body {color: white !important;}Cascading
    of StylesThe precedence and priority of the styles are decided on the basis of
    the following parameters.●        Importance●        Specificity●        Textual
    OrderWorking with CSS PropertiesNow that you are thorough with the use of selectors,
    the next step is to look at CSS properties.ColorOne of the most crucial properties
    that are used in a web page is color, which can be defined using ARGB, RGB and
    color names.RGB value are typically defined using a decimal number, which lies
    between 0-255. ●        white #ffffff●        red #ff0000●        black #000000●       
    green #008000Color values can also be used instead of the color name. An example
    of how this can be used is given below.body {color: #ffffff;}Another way to specify
    the color is using the RGB function, which specifies the values of parameters
    using a number between 0-255 or percentage. Example of this type of declaration
    is given below:h1 { color: rgb(255,0,0); }Other ways to specify color are RGBA,
    which accepts 4 values and HSL, which defines values for hue, saturation and lightness.TransparencyThe
    transparency or opacity are defined by a value between 0.0 (invisible) and 1.0
    (opaque).TextAs far as text is concerned, font-face and font-size can be specified.
    These properties can be defined in the following manner:h1 { font-family: arial,
    verdana, sans-serif; }h1 { font-size: 12px; }The CSS Box ModelThe CSS Box Model
    assumes that a webpage can be considered to be made up of boxes. The spacing between
    these boxes are given by margins and padding settings. These properties can be
    given values in the following manner:margin: 15px;padding: 25px;border: 10px;Positioning
    <div> elementsThe element used for creating page layouts is <div>. Although, HTML5
    recommends the use of semantic markup instead of div elements, there are still
    used for content that cannot be styled using semantic markup. A div element can
    be imagined as a rectangular block and is declared in the following manner:<div><!—other
    elements are enclosed within this area--></div>Properties used to define the position
    of a div element include:●       The position of the div element can be defined
    using the properties, top, bottom, left and right, in pixels.●        A property,
    position, is used to define if the position specified is static or relative.●      
    The float property can be used to allow elements to float to the right or left
    and is defined as float: left or float: right.●        The clear property places
    a clear element right after the floating element.●       You can also change the
    manner in which the browser calculates width with the help of the box-sizing property.
    This property can take three values: content-box (default setting), border-box
    and padding-box.Centering ContentIf you are using a fixed width, the div element
    can be centered using the properties, margin-left and margin-right. If you fix
    the width and set the margins to auto , the extra space on the margins is equally
    divided. It can be done in the following manner:  #container {width: 850px;margin-left:
    auto;margin-right: auto;}Chapter 5: Thinking Slowly and Staying Humble  Writing
    code can go quickly especially when you know what you are doing and when you have
    a lot of experience with the codes that you are writing in your JavaScript strings.
    You may go quickly, and that can cause you to make mistakes. This is especially
    true if you are becoming very experienced with JavaScript and if you feel like
    you are going to be able to do more with it. You may also find that, when you
    get better at writing code, you get very confident with everything that you are
    doing. It is not a terrible thing to have confidence, but it can lead to you missing
    out on some of the things that you could have created errors with. To make sure
    that you are doing the best job with your code, even when you’re practicing, you
    should make sure that you think as slowly as possible and that you don’t get overly
    confident in your abilities. Slowing DownAs you write the codes that you are thinking
    about, make sure that you go as slow as possible. It may take more time this way
    initially, but it will save you a lot of time when it comes to going back and
    looking at the different things that you may have to do with the errors that you
    have made. By going slowly, you will be less likely to create errors. Even as
    you are looking back at your code and going through each of the lines of JavaScript,
    look at it slowly. Read each and every letter and symbol so that you will know
    what you are talking about and so you will be able to see if you missed anything.
    This is like proofreading it the way that you might have done in high school or
    college when you wrote a paper. Slow down to proofread the work that you wrote
    and the codes that you did line by line. This slow pace will help you catch any
    mistakes that you may have made. It is also worth noting that going slower will
    help you avoid any major errors in the work. If you are moving at a slower pace,
    you will be more aware of each keystroke and each thing that you put into all
    of your lines of code. The slow pace will not only help you when you are looking
    back at what you wrote down but also at what you were doing when you were writing
    it. Make sure that you are prepared to go as slow as possible and that you don’t
    rush your work. Taking a BreakIt is always beneficial for you to take a break
    from the work that you are doing. After looking at lines of code for hours on
    end, your eyes will not only be tired, but your mind will begin to get weary,
    too. A break will help you to refresh what you are doing and allow you the chance
    to come back and start over with a blank canvas in your mind. There are many benefits
    to having a fresh mind when you are writing code and breaks will give you the
    perfect refresher. In general, for every hour that you work on code, you should
    take 5-10 minutes to look away from the computer, get up and walk around and do
    something that does not involve anything with JavaScript. It is a good idea to
    take this time to step outside and get some fresh air or to simply just walk around
    getting a bit of exercise. Doing both of these activities will help get the blood
    flowing and will give you the oxygen that you need in your brain to help it work
    more efficiently when you decide to go sit back down and start working on the
    code again. A word of caution: try to stay off of your cell phone during the time
    that you are taking a break from your computer screen. While much smaller, the
    screen on your cell phone emits the same blue light that can be detrimental from
    your computer screen. Set aside specific time for using your cell phone while
    you are working so that you don’t have to use up your screen break time to chat
    with your friends or check your non-business emails. It is a good idea to just
    keep the cell phone out of reach when you are taking a break. Working Through
    ItOnce you have written the code that you want to write, you need to make sure
    that you are working your way through it. Do this as slowly as what you did the
    writing process so that you will be able to catch any mistakes that you have made.
    You should do this after you have written your final line of code and before you
    take the chance to check it out by testing it for different things. It is always
    a good idea to make sure that you are going slowly and looking at each line of
    code. One way that you can be sure that you are looking at every character of
    code that you have written is to read it out loud. Say each of the letters, numbers
    and characters to yourself so that you will be able to make sure that they are
    written the right way. It is always a good idea to read it out loud because reading
    it out loud will show you what you have actually written. It will take more time
    for you to read it out loud than it would to just read it in your head. There
    are many things that you may miss if you are reading it in your head. While it
    may seem complicated to have to read each and every line of code that you have
    written out loud, you should still try to do so. Doing this will give you the
    chance to see what you may have missed. If you are good at reading and you make
    sure that you are not making any mistakes, you will be able to do this efficiently,
    and it will not waste a lot of time. It will actually take less time than needing
    to go back to fix all of your errors. Leveling ConfidenceWhile you may not come
    across this problem when you are first getting started or while you are learning
    code, confidence can be a big problem for those who write JavaScript. You think
    that you know enough about it and you, essentially, let your guard down when you
    are writing it. This is a problem because you will not be as quick to catch mistakes
    when you are writing the code, and you may think that you have not done anything
    wrong with the code that you wrote. It is important to make sure that you keep
    your confidence in check. Even if you feel that you are very good at writing code
    and that you will never make a mistake, the chances of you making a mistake are
    still very high. It can happen to anyone at any time while they are writing any
    type of line of code. Make sure that you know what you are doing and that you
    do not get narcissistic about the skills that you have. There is always something
    more that you can learn when it comes to coding, and nobody knows all of it. Your
    confidence can even trick you into forgetting things that you have learned about
    code. Confidence tells you that you know what you are doing and that you know
    the best way to be able to write code. It tells you that there is nothing wrong
    with writing the same things over and over for each line of code but it also tells
    you that you don’t need to try harder with different options for codes that you
    write. Make sure that you are confident with your skills but that you don’t let
    that confidence get too high to where it obstructs your view of success.Distrusting
    YourselfDon’t trust yourself. Your mind will try to tell you that you are not
    making mistakes and that you have not missed anything when you are looking over
    the code that you wrote but the chances are that you have actually missed some
    different lines and that you have made some mistakes. Be sure that you always
    question whether or not you are doing the best coding job possible so that you
    will be able to write the exact code that you are hoping for. Don’t trust yourself
    to do it but always check whether or not you are doing the right thing. A good
    way to do this is to take a break in between writing and checking the code. Make
    sure that the break is long enough that you will be able to truly refresh your
    mind. Make it like one of your refresher breaks but take an even longer amount
    of time so that you will truly be able to come back with a clean slate when you
    start to test it and look at the code. If you are staring at the same 100 lines
    of code for 5 hours and then try to edit them, you will have a difficult time
    picking out the mistakes that you have made. All of the tips that were in the
    chapters of the first part of this book involve practicing and learning what you
    can do while you are practicing. They are essentially minding tricks that you
    can use to make your coding practice go better. For the rest of the book, you
    will learn how to apply each of these when you start to code. The real fun comes
    when you learn the best codes to be able to use right here in the second part
    of this book.Chapter 6: Basic OperatorsWhat are operators?Operators are basically
    symbols which act as a function, though they differ from functions syntax-wise.
    They take input(operands) and produce a certain output based on the operands.
    For example in “5+2”, “5” and “2” are operands(the input), and the “+” symbol
    is the operator, which results to “7”.Classification of operatorsOperators are
    generally classified on the basis of the type of operation they do. Operators
    like typeof, instanceof, etc. are unique and thus cannot be classified under the
    categories about which you will read below.Arithmetic OperatorsAs the name hints,
    these are the operators which perform arithmetic tasks on the operand(s). Listed
    below are the arithmetic operators.Addition[+]: This operator performs an addition
    operation on two operands if both of them are numerical, if anyone or both of
    the two operands are of string type then this operator concatenates / joins the
    two operands.Example:4 + 2//evaluates to 6‘example’ + 5//evaluates to “example5”‘thisIs’
    + ’Example’ //evaluates to “thisIsExample”.Subtraction[-]: This operator performs
    a subtraction operation on two operands. Example: “4-2” produces the result “2”.Division[/]:
    This operator performs division operation on two operands, where the operand on
    left side(dividend) is divided by the operand on the right side(divisor). Example:
    “15/3” produces the result “3”.Multiplication[*]: This operator performs multiplication
    operation on two operands. Example: “4*2” produces the result “8”.Modulus[%]:
    Also known as a Remainder operator, this operator results in the remainder of
    the two operands when they are divided. Example: “5%2” produces the result “1”,
    “5%3” produces the result “2”.Increment[++]: Increases the value of its numerical
    operand by one. The position of this operator matters, i.e., whether it is placed
    before operand or after it. If placed before operand, then this situation is called
    prefix(example ++x), and the value is returned after the incrementing operation,
    and if placed after the operand then this situation is called postfix(example
    x++), and value is returned before the incrementing operation. Example://say x
    value is 5console.log( ++x ); //prints 6//value of x at this point is 6//say y
    value is 5 tooconsole.log( y++ ); //prints 5 NOT 6//but value of y at this point
    is 6 so incrementation was done but after the expression returned valueDecrement[--]:
    Decreases the value of its numerical operand by one. Similar to increment operator,
    the postfix and prefix rule applies here too.Example://say x value is 5console.log(
    --x ); //prints 4// value of x at this point is 4//say y value is 5 tooconsole.log(
    y-- ); //prints 5//value of y at this point is 4Exponential[**]: This operator
    produces the result obtained by increasing the first operand power by the second
    operand, i.e., FirstOperandSecondOperand . Example: “2**3” produces the result
    “8”.Assignment OperatorsThese operators are used to assign values to variables.
    Value is assigned to the left operand which is based on the right operand value.
    Listed below are the assignment operators.Equal[=]: This operator simply assigns
    the value of its right operand to the left operand. Example: “x=5” this assigns
    5 to x, so now the value of x is 5.Addition assignment[+=]: This operator adds
    the value of the left and the right operand and then assigns the result to the
    left operand. Example: say x = 2 then “x += 3” will make x’s value 5. Subtraction
    assignment[-=]: This operator subtracts the value of the right operand from the
    left operand and then assigns the result to the left operand. Example: say x =
    8 then “x -= 3” will make x’s value 5.Multiplication assignment[*=]: This operator
    multiplies the left and the right operand and assigns the result to the left operand.
    Example: say x = 5 then “x *= 2” will make x’s value 10.Division Assignment[/=]:
    This operator divides the left operand(dividend) by the right operand(divisor)
    and then assigns the result to the left operand. Example: say x = 10 then “x /=
    2” will make x’s value 5.Modulus Assignment[%=]: This operator divides the left
    operand(dividend) by the right operand(divisor) and then assigns the REMAINDER
    to the left operand. Example: say x = 5 then “x %= 2” will make x’s value 1.Exponentiation
    assignment: This operator increases the value of left operand by the power of
    right operand and then assigns the result produced to the left operand. Example:
    say x = 2 then “x **= 3” will make x’s value 8.Other OperatorsThese are the type
    of operators which cannot be categorized under the above-mentioned categories.
    Listed below are such operators.typeof operator: This operator returns the type
    of operand in string format. Examples:typeof 2//evaluates to “number”typeof 1.23//evaluates
    to “number”typeof “2”//evaluates to “string”typeof ‘hi’//evaluates to “string”typeof
    true//evaluates to “boolean”typeof false//evaluates to “boolean”typeof {ob:1}//evaluates
    to “object”typeof new Date()//evaluates to “object”tyepof Math.cos//evaluates
    to “function”typeof function(){}//evaluates to “function”instanceof operator:
    This operator checks if the first operand, which should be an object, is of a
    specific type, where the type to be checked is specified as the second operand.
    It returns true or false based on whether the object type is matched or not.Examples:new
    String(“Astring”) instanceof String//evaluates to true[“this”, “is”, “array”]
    instanceof Array//evaluates to true.new String(“Astring”) instance of Array              //evaluates
    to false[“this”, “is”, “array”] instanceof String//evaluates to falsedelete operator:
    This operator removes a property from an object. Example:var myObject = {prop1:
    “test”,prop2: “test2”};delete myObject.prop1;//deletes the prop1 property of object
    myObjectin operator: This operator checks whether a specified property(first operand)
    is in the specified object(second operand). It returns true or false based on
    whether the property is in the object or not.Examples:var myObject = {prop1: “test”,prop2:
    “test2”};“prop1” in myObject;//evaluates to true“prop45” in myObject;//evaluates
    to falseThis chapter explained operators in JavaScript. I hope you found it useful.ConclusionThat
    should give you a basic idea of how events are used in JavaScript and why is it
    necessary to use them in the first place. The things to note are that events are
    anything that happens in the application, and we can attach event-listeners to
    make sure we get to know when that event occurs so that we can execute some code
    at that time.Thank you very much for downloading JavaScript: Beginner JavaScript
    Coding From The Ground Up! Please be on the lookout for the next book in this
    series, JavaScript: Intermediate JavaScript Coding From The Ground Up. There is
    more yet left to learn to further your coding knowledge base. The journey does
    not stop at beginner for us.If you have enjoyed this book, please leave a positive
    review on Amazon to show your support. Your feedback is greatly appreciated!'
