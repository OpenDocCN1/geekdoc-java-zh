    # 介绍

    HTML 并不智能。它主要让人们查看文本和图像，并允许他们到其他页面执行更多相同的操作。为网页增加智能的是 JavaScript。它通过让页面在访问者与内容交互时做出响应，使网站更具吸引力、更高效且实用。


    本书假设我们已经知道如何使用 HTML 来指定网页结构和内容。如果我们熟悉如何使用 CSS 对页面进行样式设计（独立于网页结构），将更有益。如果是这样，我们就准备好使用
    JavaScript 为页面添加一些行为，使其更具动态感和交互性。否则，没有 HTML 和 CSS，JavaScript 对我们没有大用处。它们被视为网页的三大支柱：结构、表现和行为。


    # 第一章：什么是 JavaScript？

    JavaScript 是 Web 的脚本语言，其唯一目的是为我们的页面添加交互性。除了交互性外，现代版本的 JavaScript 还用于从外部源甚至网站用户加载并解析信息。JavaScript
    本质上是嵌入网页 HTML 结构中的一段程序代码。当浏览器读取这段代码时，它会激活内置的解释器，该解释器理解如何解码这种语言并处理其命令。


    虽然编码过程中涉及编程，但 JavaScript 并不是一种编译语言。在传统的 Web 编程语言（如 Java 或 .NET）中，代码在执行之前必须编译。编译意味着代码必须先发送到运行在服务器上的特殊程序。该程序也称为应用服务器软件，它翻译代码、创建请求的页面和/或功能并将其作为
    HTML 返回。像 JavaScript 这样的脚本语言是不编译的，而是即时解释的。这意味着不需要任何特殊软件，因为用户自己的浏览器会在遇到代码时运行并执行它。


    **注意：** JavaScript 创建于 Java 是一种非常流行的语言的时代。除此外，这些语言之间没有关系，除了基本的编程逻辑外几乎没有任何共同点。


    ## 实现 JavaScript

    现在我们对 JavaScript 是什么有了大致了解，可以开始使用这种语言。由于 JavaScript 代码是 HTML 文档的一部分，我们需要知道如何告诉浏览器运行我们的脚本。当我们想在
    Web 文中包含 JavaScript 时，有两种常用选项。两种情况下我们都会使用 `<script>` 元素。`<script>`标签用于告诉浏览器 JavaScript
    代码的开始和结束。此标签可以包含在页面的 `head` 或 `body` 中。第一个选项是将代码内联在文档中。实现这一点，我们将打开 `<script>`
    标签，输入 JavaScript 代码，然后用 `</script>` 标签结束。理论上，我们可以这样留下文档，因为所有浏览器默认认为 `<script>`
    标签之间的脚本语言是 JavaScript。然而，为了最大的兼容性，我们将使用 `type` 属性和 `text/javascript` 值来扩展此标签，以指示浏览器如何精确解释代码。


    ```html

    <script type="text/javascript">JavaScript 注释</script>

    ```


    第二个选项是从外部文件将 JavaScript 代码加载到我们的 HTML 文档。为了这个目的，我们可以再次使用 `<script>` 元素，但这次除了 `type`
    属性，我们还在 `<script>` 元素的 `src` 属性中包含外部文件的 URL。外部文件必须是带有 `.js` 扩展名的纯文本文件，包含 JavaScript
    代码而不包含任何 HTML 元素或 CSS 规则。例如，将 `script.js` 文件调用到浏览器，我们将使用：


    ```html

    <script src="script.js" type="text/javascript"></script>

    ```


    当我们想在整个站点共享功能时，我们将 JavaScript 放在外部文件中并包含在网页中。否则，如果我们只需要添加本地行为，我们将代码嵌入页面中。


    **注意：** 脚本文件按照它们在 HTML 代码中的放置顺序进行加载。


    # 第二章：JavaScript 基础概念

    通常，当我们听到“编程”一词时，我们会立即想到其他人和难以理解的字母和数字字符串。编程看起来像是凡人之外的魔法。然而，编程概念并不难掌握，因为它们总有实际应用。JavaScript
    虽然不像 HTML 或 CSS 那么简单，但并不是一种过于复杂的语言。与其他语言不同，它的“语法”较具描述性且直观，使其非常适合作为第一门编程语言。基本上，学习
    JavaScript 就像学习一种新语言，但是一种类似于英语的新语言。一旦我们学会了新单词，并理解了如何将它们组合成“句子”，我们了。


    ## 语法

    每种语言都有自己的一组字符和单词，并有一套如何将这些字符和单词排列成完整句子的规则。这些规则被称为语言语法，它将语言结合并赋予其意义。


    在开始一些 JavaScript 示例之前，让我们先为 JavaScript 准备环境。如之前所述，JavaScript 代码始终 HTML 代码的一部分。因此，为了使用
    JavaScript，我们首先需要创建一个 HTML 文档。为了开始，让我们打开文本编辑器（如记事本）并输入基础网页的 HTML 代码。除了基础 HTML
    标签外，我们在 `<head>` 部分包含一个 `<script>` 元素，我们将开始放置 JavaScript 代码。


    ```html

    <!doctype html>

    <head>

    <title>JavaScript 初步</title>

    <script type="text/javascript"></script>

    </head>

    <body>


    </body>

    </html>

    ```


    我们将此文档另存为 `firststeps.html`。如果我们使用记事本，必须记住将“保存类型”更改为“所有文件”。


    ## 语句

    为了用日常语言表达我们，我们使用句子作为通信的基本形式。同样，在 JavaScript 中，我们也形成句子来表达我们的意图，这些正式地被称为语句。JavaScript
    句子是通信的基本单元，通常代表程序中的单个步骤。就像我们组合句子来表达观点一样，我们将语句组合在一起创建一个程序。


    让我们看一个简单的 JavaScript 语句并看看它的作用。在 html 文档的打开和关闭 `<script>` 标签之间放置了以下文本：


    ```javascript

    alert("JavaScript 开始变得有点意义了。");

    ```


    在后续示例中，除非必要，否则不会显示完整的 HTML 代码，但对于初始参考，您的文档应该是：


    ```html

    <!doctype html>

    <head>

    <title>JavaScript 初步</title>

    <script type="text/javascript">alert("JavaScript 开始变得有点意义了。");</script>

    </head>

    <body>


    </body>

    </html>

    ```


    我们可以保存 `firststeps.html` 文并在浏览器中打开它。一旦页面打开，我们将得到一个带有消息“JavaScript 开始变得有点意义了”的警报窗口。


    现在我们知道了效果是什么，让我们回到 JavaScript 语句并将其翻译成普通语言，使其更有意义。


    ```javascript

    alert("JavaScript 开始变得有点意义了。");

    ```


    JavaScript 语句是 Web 浏览器执行的指令。语句以关键字呈现的命令开始。关键字标识了需要执行的操作。在这种情况下，关键字 `alert` 让 Web
    浏览器打开对话框并显示消息。如果我们只有 `alert()` 语句，对话框将是空的，然而在我们的情况下，语句由一个特定输入，即实际的消息文本，也称为参数。最后，就像每个句子都以句号结束，JavaScript
    句子以分号结束。分号明确语句已结束，一旦解释器执行了它，就应该移动到下一个项目。


    现在我们准备好翻译 JavaScript 语句了。它的普通英语解释是：“打开一个对话框并显示文本。”


    **注意：** 在传递文本参数时，我们可以使用双引号（`""`）或单引号（`''''`）。


    在继续之前，让我们看另一个语句。在 `<script>` 元素中将之前的代码替换为以下并在浏览器中预览结果：


    ```javascript

    document.write("<p>JavaScript 开始变得有点意义了。</p>");

    ```


    从结果中我们可以看到之前的空内容现在有一段文本。根据之前对 JavaScript 如何运作的解释，我们可以正确地假设 `document.write` 命令让浏览器直接写入打开和关闭括号之间的任何内容。


    ## 变量

    JavaScript 以及任何通用编程语言的一个基本方面是变量的概念。变量是一种声明和存储可以使用信息的方法。这些信息可以随情况而变化，因此有了名称。让我们看看下面的语句：


    ```javascript

    var name = "Martin";

    ```


    在普通语言中这等同于说“我的名字是 Martin”。关键字 `var` 表示“创建一个变量”，或者在编程中中“声明一个变量”。后面是变量的名称，可以是任何具有特定限制的内容。使用
    `=` 符号为变量赋值，这并不是立即需要的，因为这以后可以发生。我们可以在一个语句中声明未定义的变量并为其赋值。例如：


    ```javascript

    var name;

    name = "Martin";

    ```


    正如之前提到的，变量名可以包含字母、数字、美元符号（`$`）或下划线（`_`），不允许其他特殊字符。此外，变量名不能以数字开头，任何其他值都是接受的。最后，变量名对大小写敏感，这意味着解释器区分大写和小字母。


    **注意：** 虽然我们可以使用任何内容作为变量名，但使用有意义的名称是明智的，这将帮助我们和其他程序员更好地理解。


    ## 变量类型

    根据数据类型，变量有不同的种类。三个基本的类型是数字、字符串和布尔。


    数字变量由数字表示。该变量可以接受整数、负整数和分数整数。数字经常用于计算，因此我们的数字变量经常包含数学运算中。下面的语句声明了一个名为 `age` 的变量并赋值为
    35。


    ```javascript

    var age = 35;

    ```


    字符串变量用于表示任何字母序列，如单词或句子。字符串表示为引号内的字符序列，引号指示解释器后面是一个字符串。JavaScript 允许我们使用双引号（`"`）或单引号（`''`），但必须注意使用相同类型的引号。


    ```javascript

    var location = "California";

    ```


    布尔变量非常简单，因为它只接受两个值之一：`true` 或 `false`。该变量用于我们想要智能地响应用户操作的程序中。


    ## 用户变量

    如果 JavaScript 不允许我们分享想法并直接创建或更改变量，将不再有趣。提供输入的最简单方法之一是使用 `prompt()` 命令。


    ```javascript

    var name = prompt("你的名字是什么?", "");

    document.write(name);

    ```


    `prompt()` 命令的结果是一个对话框。与仅仅显示消息的 alert 对话框不同，提示对话框也可以接收答案。因此，在提示对话框的语法中，需要在逗号分隔提供两个参数。第一个参数是显示在框中的提示文本，而第二个参数是文本框的默认值，因此是变量。


    在上面的示例中，框中显示的提示文本是“你的名字是什么？”，默认值将为空，因为引号之间明显没有内容。一旦我们在框中输入内容并点击确定或按回键，变量就会接收字段的值。因此，名字将显示在网页上。否则，如果我们点击取消、按
    Esc 键或关闭提示框，返回的值将为空，屏幕上没有文本。


    **注意：** 除了 `prompt()`，我们还可以使用更正式的 `window.prompt` 命令。


    # 运算符

    在变量中存储信息是第一步，编程的魅力在于以许多创造性的方式处理这些信息。为此此，JavaScript 提供了不同的运算符允许我们修改数据。运算符由符号或单词表示，是可以将一个或多个值更改其他东西的东西。可用运算符的类型根据数据类型不同。


    ## 数学运算符

    基本的数学运算符如加（`+`）、减（`-`）、乘（`*`）和除（`/`）在 JavaScript 中很容易可用。它们可以在独立语句中使用或在声明变量时使用。例如，通过操作变量
    `currentYear` 和 `yearOfBirth`，我们可以确定变量 `age` 的值。


    ```javascript

    var currentYear = 2015;

    var yearOfBirth = 1979;

    var age = currentYear - yearOfBirth;

    document.write(age);

    ```


    **注意：** 调用变量并在网页显示是简单的。只需使用 `document.write()` 命令。


    数学运算符，特别是加运算符，可以组合两个或多个字符串。这种组合字符串的过程被称为拼接。在下面的示例中：


    ```javascript

    var firstName = "Martwan";

    var lastName = "Jenkins";

    var fullName = firstName + lastName;

    document.write(fullName);

    ```


    （注：由于原文后续存在大量重复段落，此处已仅翻译唯一核心内容）

