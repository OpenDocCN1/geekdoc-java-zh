    \ series of letters like words or sentences. Strings are represented as a series\
    \ of characters enclosed within quotation marks, with the quotation marks signaling\
    \ to the interpreter that what follows is a string variable. JavaScript allows\
    \ us to use both double quotes (`\"`) or single quote (`'`) marks, but we have\
    \ to be mindful to use the same type of quotation mark.\n\n```javascript\nvar\
    \ location = \"California\";\n```\n\nA boolean variable is rather simple as it\
    \ can accept only one of two values: `true` or `false`. This variable is used\
    \ when we create programs that we want to intelligently react to user actions.\n\
    \n## User Variables\nJavaScript would not be fun if it't allow us to share our\
    \ thoughts and create or alter the variables directly. One of the simplest ways\
    \ to give our input is to use the `prompt()` command.\n\n```javascript\nvar name\
    \ = prompt(\"What is your name?\", \"\");\ndocument.write(name);\n```\n\nThe result\
    \ of the `prompt()` command is a dialog box. Instead of just displaying a message\
    \ like the alert dialog box, the prompt dialog box can also receive an answer.\
    \ Hence, in the syntax for a prompt dialog box it is necessary to provide two\
    \ arguments between the parentheses separated with a comma. The first argument\
    \ is the prompt text that is displayed in the box, while the second argument is\
    \ the default value for the text box, and consequently, the variable.\n\nIn the\
    \ example above, the prompt text displayed in the box will be 'What is your name?'\
    \ and the default value presented in the box will be empty, as there is obviously\
    \ no content between the quotation marks. Once we type in something in the box\
    \ and either click OK or press the Enter key, the variable receives the value\
    \ that entered in the field. Consequently, the name will be displayed on the web\
    \ page. Otherwise, if we click on Cancel, press the Esc key or close the prompt\
    \ box, the returned value would be empty and there would be no text on the screen.\n\
    \n**Note:** Instead of `prompt()` we can also use the more formal `window.prompt`\
    \ command.\n\n# Operators\nStoring information in a variable is a first step,\
    \ the beauty of programming is the ability to manipulate this information in many\
    \ creative ways. For this, JavaScript provides different operators that allow\
    \ us to modify data. An operator, represented by a symbol or a word, is something\
    \ that can change one or more values into something else. The type of operators\
    \ available are different based on the data type.\n\n## Mathematical Operators\n\
    The basic mathematical operators like addition (`+`), subtraction (`-`), multiplication\
    \ (`*`) and division (`/`) are readily available in JavaScript. They can be used\
    \ in independent statements or used when declaring variables. For example, by\
    \ operating with the variables `currentYear` and `yearOfBirth`, we can determine\
    \ the value of the variable `age`.\n\n```javascript\nvar currentYear = 2015;\n\
    var yearOfBirth = 1979;\nvar age = currentYear - yearOfBirth;\ndocument.write(age);\n\
    ```\n\n**Note:** Calling a variable to be presented on a web page is easy. Simply\
    \ use the `document.write()` command.\n\nMathematical operators, specifically\
    \ the addition operator, can be used to combine two or more strings. This process\
    \ of combining strings is called concatenation. In the following example:\n\n\
    ```javascript\nvar firstName = \"Martwan\";\nvar lastName = \"Jenkins\";\nvar\
    \ fullName = firstName + lastName;\ndocument.write(fullName);\n"
