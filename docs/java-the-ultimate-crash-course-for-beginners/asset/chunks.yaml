  trans: "\nJava applet 是一种特殊的程序类型，专用于在线传输，并由启用了 Java 的在线浏览器即时应用。此外，Java applet 是根据需要下载的，不需要复杂的用户交互。一旦用户访问包含\
    \ applet 的链接，计算机将立即下载文件并执行下载代码。Applet 被设计为微型程序。它们通常用于从服务器显示信息、提供基本功能，并管理来自用户的输入。\n\
    \nApplet 的开发改变了在线编程，因为它扩大了可以在网络空间中轻松移动的对象范围。通常，我们两类从用户传输到服务器的宽大对象类别，例如被动的、动态的和主动的程序。\n\
    \n如果你在读一封邮件，你读的是被动类型的数据。即使在下载程序，除非你启动它，否则程序代码仍然是被动的。与此同时，applet 是一个活跃的、自启动的程序。\n\
    \n## 可移植性\n\n可移植性是互联网的一个主要方面，因为连接其上有各种操作系统和计算机。如果你在连接到 Web 的任何计算机上运行 Java 程序，应该有一种方法使该程序能够在不同的系统上启动。\n\
    \n对于 applet 来说，它应该由在线的多种 CPU、浏览器、操作系统下载并运行。为不同的计算机准备不同的 applet 版本是不理想的。一种代码应该适用于所有计算机。因此，应该有一种方式生成可移植的且可执行的代码。\n\
    \n## 安全性\n\n每当你从互联网下载任何内容时，始终存在你的计算机或服务器被感染病毒的风险。一旦有害代码获得你系统的访问，可能会对系统造成破坏。例如，病毒可能会收集隐私数据，如银行账户信息、信用卡号和密码。\n\
    \n为了允许 applet 安全地下载并在用户的计算机上启动，禁止 applet 执行攻击至关重要。Java 通过限制 applet 仅在 Java 执行平台上运行，并且不允许访问系统的其他部分，实现了这种保护。\n\
    \n带安全性下载 applet 的能力是 Java 最创新的方面。\n\n## Java 字节码\n\nJava 能够同时解决可移植性和安全性问题的原因是编译器的输出不是执行代码。相反，它是字节码，这是一段为了在\
    \ `JVM` 中运行而经过优化的指令。\n\n将 Java 程序转换为字节码将使其在不同平台上执行程序变得更容易，因为每个平台都需要执行 `JVM`。当包适用于特定系统可用时，Java\
    \ 程序即可运行。请注意，尽管每个平台的 `JVM` 细节可能不同，但都可以解释相同的字节码。一旦程序被编译，每种类型的联网计算机都应该存在类似的程序。\n\
    \n 面向对象编程\n\n面向对象编程（OOP）是 Java 的核心元素。OOP 方法在 Java 中是不可缺的。因此，在学习 Java 时理解 OOP 是至关重要的。\n\
    \n`OOP` 是编写程序的有效方法。自从计算机出现以来，编程方法论发生了巨大变化，以应对日益增长的程序复杂度。\n\n例如，当计算机最初开发时，编程是通过通过\
    \ PC 的前面板更改二进制机器指令来实现的。如果程序长度平均，这种方法是实用的。随着程序的增长，开发了汇编语言，以便程序员使用机器指令的符号表示来管理更大、更复杂的程序。\n\
    \n随着程序的不断扩展，程序员开发了高级语言，这为程序员提供了更多管理复杂性的工具。\n\n`OOP` 使用了结构化程序的最佳思想并将其与不同的概念相结合。这导致了程序的特殊方式。通常，程序可以通过代码或数据进行结构化。仅使用结构化程序技术时，程序通常根据代码组织。\n\
    \n为了支持 `OOP`，Java 以及其他语言具有三个共同属性：继承、多态和封装。\n\n### 继承\n\n继承指的是对象可以获得另一个对象的属性的过程。这是至关重要的，因为它支持了分层组织的概念。如果没有层次结构，每个对象都必须显式地定义。通过继承，对象只需要定义使其在类中具有独特的特性。它可以从父类继承其基本属性。因此，这种继承机制使得对象很容易成为一个特定的实例。\n\
    \n### 多态\n\n多态（许多形式）是一种允许接口访问基本类动作的属性。特定的动作由情况的特定性质决定。多态的概念通常由“多个方法，一个接口”这句话来定义。因此，可以为一组相关的活动设计一个通用接口。多态可以通过访问相似的接口（你可以用它确定一类动作）来降低复杂度。\n\
    \n### 封装\n\n封装是一种编程方法，它将代码以及其所处理的数据集成在一起，并将它们都存储起来以避免误用和外部干扰。在 `OOP` 语言中，数据和代码可以结合在一起，构建出一个自包含的黑盒。盒子内部是所有关重要的代码和数据。如果代码和数据以这种方式结合，我们就可以创建一个对象。因此，对象是支持封装的设备。\n\
    \n# 第二章 – 编写你的第一个程序\n\n现在你已经学习了 Java 的基础，是时候开始编写你的第一个 Java 程序了。在编译和运行程序之前，你应该安装\
    \ Java 开发工具包（JDK）。这是来自 Oracle 的免费程序。截至出版此时，最新版本是 `JDK 8`。\n\n由于 `JDK 8` 提供了若干初始\
    \ Java 版本未包含的新功能，最好使用 `JDK 8` 来编译和运行你将在书中学习的程序。使用早期版本可能会导致程序无法编译。\n\n你可以通过此链接下载最新版本的\
    \ JDK：\n\n`http://www.oracle.com/technetwork/java/javase/downloads/index.html`\n\
    \n访问 Oracle 下载页面并选择你的计算机类型。安装 JDK 后，你可以编译并运行程序。`JDK` 支持两个主要程序：`javac` 和 `java`。后者是基本的\
    \ Java 解释器，也被称为应用程序启动器。\n\n请注意 `JDK` 不是窗口应用程序。它在命令提示符环境中运行，使用命令行工具。这也不是集成开发环境（IDE）。\n\
    \n除了 JDK 提供的标准命令行工具外，你还可以使用其他 IDE 如 `NetBeans`。使用 `IDE` 对商业应用的开发和部署有所帮助。\n\n##\
    \ 编写你的第一个 Java 程序\n\n现在我们已经准备就绪，可以开始编译和运行一个短程序。使用以下代码：\n\n![nuno.jpg](img/00001.jpeg)\n\
    \n你有三个基础步骤需要遵循：输入、编译和运行。\n"
