    # Chapter 5 – Java Methods, Objects, and Classes


    An important concept that you must learn in Java is the use of class. The class
    is considered as the core of Java, because it serves as the foundation upon which
    the whole Java language is created, because the class can describe the nature
    of the object. Hence, we can say that in Java, the class forms the foundation
    for object-oriented programming.


    Inside a class are defined data and code, which acts according to that data. The
    code is confined in the methods. Since methods, objects, and classes are basic
    to Java, they are included in this book. Learning the basic of these features
    will train you to write more complicated programs, and you can better understand
    specific key element of Java.


    ## Fundamentals of Java Class


    Because all activities of Java happen inside a class, we have been utilizing classes
    since the beginning of this book. But simple examples have been used, and there
    is more to them in programming. There are classes with substantial power compared
    to what we have used.


    Let’s start by going over the basics. A class is generally a template, which defines
    the object form. It also describes the data as well as the code, which will operate
    on this data. Objects are occurrences of a class. So in essence, a class is a
    set of plans, which define how you can build an object. It is crucial to clarify
    this one concern: a class is a logical abstraction. A physical representation
    of this class will exist in memory only when an object of that particular class
    has been made.


    Also take note that the variables and methods that compose a class are known as
    members of the class. The members of data are also named instance variables.


    ## Class Forms


    Once you define a class, you are declaring its actual nature and form. You can
    do this by specifying the instance variables, which it contains as well as the
    methods you use to operate them.


    Even though simple classes may contain only instance variables or only methods,
    many actual classes can handle both.


    The keyword `class` is used to create a class. Below is a simple general form
    of a class:


    ![nuno33.jpg](images/00033.jpeg)


    Even though there’s no solid rule, which enforces it, a class that is well-designed
    must describe only one logical object. For instance, a class storing employee
    names and their ID numbers will normally not store information about the daily
    temperature, stock market prices, or foreign exchange rates. The key here is that
    class groups that are well-written will only group information that are logically
    related. Confining unrelated information within the same class will affect the
    structure of your code.


    At this point, we have been only using one method: `main()`. As you study Java
    programming, you will also learn how to create other methods. But you should take
    note that the general form of a class does not define a `main()` method. A `main()`
    method is only required if this class is the beginning point for your program.
    In addition, some types of Java applications like applets do not need a `main()`.


    ## Methods


    Methods and instance variables are components of classes. Even though data-only
    classes are valid, most classes will have methods. Methods are subroutines, which
    control the data assigned by the class, and in most cases, offer access to this
    data. More often than not, other portions of the program will engage with a class
    using its methods.


    A method confines several statements. A code that is well-written will define
    one method to function a single task. Every method has its name, and this name
    will be used to call the method. Generally, you can provide a method, regardless
    of the name you want. But bear in mind that `main()` is reserved for the method,
    which starts running the program. Meanwhile, you should not use Java keywords
    for the name of the methods.


    A method is always followed by parentheses after the name. For instance, if a
    method is `obtainval`, it should be written as `obtainval()` when the name is
    used in the sentence. This notation could help you in distinguishing variable
    names.


    Below is a general form of a method:


    ```

    ret-type name( ) {

    // method body

    }

    ```


    In this format, the `ret-type` will specify the data type that is returned. If
    the method is not returning a value, the return type should be `void`. The `name`
    is specified by the identifier. The `par list` will be empty if the method has
    no parameters.


    # Chapter 6 – Arrays


    In Java programming, an array refers to the group of variables of similar kind,
    which is referred by a common name. Arrays could have several dimensions, though
    the one-dimensional array is the most common.


    Arrays are used for different purposes, because they provide an easy way to group
    together variables that are related to each other. For instance, you can use an
    array to store a record of temperature readings every day for a year, a list of
    forex market exchange, or a list of all books about computers in a library.


    The main benefit of an array is that it could organize data in such a way, which
    it could be controlled easily. If you have an array holding the salaries of people
    in a specific profession, it will be easy to calculate the average salary by organizing
    an array. In addition, arrays arrange data in such a manner, which it could be
    easily sorted.


    Even though arrays in Java could be used similar to arrays in other languages,
    they have one special trait: they are executed as objects. There are several benefits
    of running arrays as objects.


    ## One-Dimensional Java Arrays


    A one-dimensional array refers to a list of variables that are connected to each
    other. This is very common in programming. For instance, you can use a one-dimensional
    array to hold the ID numbers of active employees on a company. Another array could
    be used to hold the present survey ratings for a media network.


    To express a one-dimensional array, this format can be used:


    ```

    type name-array[ ] = new size[type];

    ```

