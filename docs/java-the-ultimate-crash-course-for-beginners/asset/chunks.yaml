    # 第 4 章 – Java 控制语句


    在方法内部，程序从一行运行到另一行，从上向下。但像其他编程语言一样，Java 还允许程序员通过不同的程序控制语句来控制流程，例如 `if` 语句和 `for`
    循环。


    ## if 语句


    可以使用条件 `if` 语句选择性地运行程序的部分。Java 中的 `if` 语句非常类似于其他语言中的 `IF` 语句。下面是它的简单形式：


    `if(condition) statement;`


    在这一行中，`condition` 是一个布尔表达式。如果条件为真，则程序将运行代码。如果条件为假，则该语句将被忽略。下面是一个示例：


