    这一行通过使用`list separator`（列表分隔符）分隔的列表表示变量 `x`、`y` 和 `z`。正如我们之前讨论的，如果你需要几个相同类型的变量，你可以在单条语句中表示它们。你只需要用逗号分隔这些变量即可。


    # for 循环


    在 Java 中，可以通过循环重复执行一系列代码。Java 支持功能强大的循环范围。目前，我们将查看 `for` 循环。下面是 `for` 循环最简单的格式：


    ```java

    for(initialization; condition; iteration) statement;

    ```


    在这种常用格式中，循环的初始化部分将循环控制变量设置为一个初始值。条件是一个布尔行，用于检查循环控制变量。如果测试结果为真，`for` 循环将继续运行。如果结果为假，`for`
    循环将终止。迭代行定义了每次循环迭代时循环控制变量是如何变化的。


    下面是一个简单的程序，展示了 `for` 循环：


    ![nuno27.jpg](img/00027.jpeg)


    运行程序时显示的输出如下：


    ![nuno28.jpg](img/00028.jpeg)


    在这种情况下，循环控制变量是 `count`。在 `for` 的初始化部分，默认值为 0。在每次迭代的开始（包括第一次），都会执行条件测试 `count <
    6`。如果此测试的结果为真，则执行 `print( ` 这一行，然后循环的迭代部分将通过将 `count` 加一个单位来运行。这个序列将一直持续，直到条件测试为假，此时执行将跳转到循环的底部。


    有趣的是，在编写良好的程序中，你不会看到循环的一部分被写在迭代部分中。很少你会看到如下这样的代码：


    ```java

    count = count + 1;

    ```


    在 Java 中，你可以使用一个特殊的自增运算符来执行此操作。双加号 (`++`) 是自增运算符，它将操作数加 1。通过这个自增运算符，语句可以写成：


    ```java

    count++;

    ```


    因此，上一个程序的 `for` 可以这样写：


    ```java

    for(count=0; count < 6; count++)

    ```


    你可以尝试一下，你会发现循环的运行方式是相同的。同时，Java 还支持使用双减号 (`--`) 的自减运算符，它将操作数减 1。


    # 代码块创建


    代码块是 Java 的另一个核心元素。代码块指的是两个或多个语句的组。创建代码块可以通过将语句限制在左大和右大括号 `{ }` 之间完成。当你创建一个代码块时，它将成为一个逻辑单元，可以用于任何一个语句可以使用的地方。例如，代码块可以是
    Java 中 `if` 和 `for` 语句的目标。看这个 `if` 语句：


    ![nuno29.jpg](img/00029.jpeg)


    在这个例中，如果 `k` 小于 `l`，则块内的语句将运行。因此，块内的两个语句将创建一个逻辑单元，如果没有另一个语句运行，另一个语句就无法运行。


    这里的要点是，创建一个块将允许你从逻辑上连接两个或多个语句。代码块还允许以更高的效率和更清晰度执行多个算法。


    下面是一个程序，它使用代码块来防止除以零：


    ![nuno30.jpg](img/00030.jpeg)


    运行此程序将显示此输出：


    ![nuno31.jpg](img/00031.jpeg)


    在程序中，`if` 语句的目标是一个代码块，而不仅仅是一个语句。如果控制 `if` 的条件为真（如我们的示例所示），则块内的三个语句将运行。尝试将 `h`
    设置为 0，并查看结果。你会发现整个块都会被程序忽略。


    # 在 Java 中使用分号


    在 Java 编程中，分号用作分隔符，用于结束一条语句。因此，每条语句都应该以分号结束。它标志着一个逻辑对象的结束。


    如你所知，块是一组由左括号和右括号限制的逻辑相关的语句。块不应该以分号结束。因为块是语句的集合，每条语句后面都有分号，所以没有需要用分号来结束块。相反，代码块是用右大括号结束的。


    Java 不会将行尾读取为终止符。因此，语句的位置并不重要。


    例如：


    ```java

    a = b;

    b = b + 1;

    System.out.println(x + " " + b);

    ```


    这一行在 Java 中被解释为相同：


    ```java

    a = b; b = b + 1; System.out.println(x + " " + b);

    ```


    此外，语句的每个元素也可以限制在单独的行上。例如，这一行是可以的：


    ```java

    System.out.println("This is a lengthy output" + a + b + c + "more display");

    ```


    以这种方式分解长行通常用于提高程序的可读性。这也可以防止过多的自动换行。


    # 缩进


    你可能已经注意到，在之前的程序中，特定的语句被缩进了。在某行上放置语句的位置并不真的重要。但多年来，已经发展出一种的缩进方式来提高程序的可读性。本书遵循那种风格，最好也遵循这一约定。在这种风格下，你应该在每个左大括号后缩进一层，并在每个右大括号后回退一层。


    # Java 关键字


    Java 定义了 50 个关键字，你可以将它们与分隔符和运算符的语法结合。请注意，你不能使用这些关键字作为方法、类或变量名。


    以下是 Java 关键字：


    ![nuno32.jpg](img/00032.jpeg)


    `goto` 和 `const` 关键字被 Java 保留，但这些没有被使用。在 Java 早期，有一些关键字被保留以便将来可以使用。但 Java Java
    规范仅描述了上述列出的关键字。


    除了这些关键字之外，Java 还保留了以下内容：`null`、`true` 和 `false`。这些是 Java 已定义的值。你不能使用这些单词来命名你的变量或类。


    # Java 标识符


    Java 标识符指的是用户定义的特定变量、方法或其他任何项目的名称。它们的长度可以从一个到几个字符不等。变量名可以是任何字母、美元符号或下划线开头。使用下划线是理想的，因为它增强了变量名的可读性，例如
    `java_data_program` 而不是 `javataprogram`。同样请注意，大和小写是不相同的。因此，`datavar` 与 `DataVar`
    不同。


    以下标识符是可以接受的：


    ```

    Test

    b

    b3

    LoadInfo

    $pu

    _bot

    var_one

    sampler_18

    ```


    请注意，不允许使用数字开头作为标识符。因此，`23sampler` 是不允许的。


    正如之前讨论的，我们不能使用保留的 Java 关键字作为标识符名称。你也不能使用 Java 方法名称（如 `println`）。


