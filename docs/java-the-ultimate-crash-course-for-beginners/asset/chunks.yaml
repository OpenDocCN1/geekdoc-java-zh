    any way. Rather, the comment explains or describes the program operation to other
    readers of the source file. At this point, the comment provides a description
    of the program and includes a reminder that the source file must be named as FirstProgram.java.


    There are three comment styles in Java. A comment inserted at the top of the program
    is a “multiline” comment. This comment type should start with /* and ends with
    */. All the text confined inside these two comment symbols will be ignored by
    the compiler. As the name implies, a multiline comment could be several lines
    long.


    The next code line in our first program is shown below:


    ![nuno5.jpg](images/00006.jpeg)


    In this line, we will use the class keyword to state that a new class will be
    defined. Remember, the class is the basic unit of encapsulation in Java. FirstProgram
    is the class name. The class definition starts with the opening curvy bracket
    ({) and terminates with the closing curvy bracket (}). The codes confined between
    these braces are known as class members.


    For now, don’t worry about the specifics of a class, but do take note that in
    Java the program activity happens inside one.


    The next line in this program is the single-line comment like below:


    ![nuno6.jpg](images/00007.jpeg)


    This is another type of comment in Java. A one-line comment starts with two right
    slanting lines (//) and terminates at the end of the line. In programming, you
    can use multiline comments for longer comments and one-line comments for short,
    line after line remarks.


    Here is the next code line:


    ![nuno7.jpg](images/00008.jpeg)


    This line starts the main( ) method. In Java, a subroutine is a method. As described
    in the earlier comment, this is the line where the program starts the execution.
    Java apps start executing codes by calling main( ).


    We still cannot provide the specific meaning of every part of the line because
    it requires deeper understanding of other Java features. But because many of the
    examples in this book will use this code line, here’s a basic information about
    every part.


    The keyword public is the access modifier, which defines how other parts of the
    program could access the class members. When you see a class member preceded by
    the keyword public, this member could be accessed by the code outside the class.
    The opposite keyword is private that prohibits a member from being used by code
    declared outside the class. At this point, main( ) should be defined as public,
    because it should be called by code outside the class once the program runs. The
    keyword static lets main( ) to be called before the object of the class has been
    made. This is crucial because main( ) is known by the JVM before any objects are
    created. Next, the keyword void will basically tell the compiler, which main(
    ) does not yield a value. Methods can also yield values.


    As already described, main( ) is the method called once a Java application runs.
    Any data, which you need to pass through a method, is accepted by variables defined
    within the set of parentheses, which follow the name of the method. These variables
    are known as parameters. If there are no required parameters, you can still include
    empty parameters. In main( ), we only have one parameter:


    String args[ ]


    This declares a parameter known as args. This is an array of objects of String
    type. Arrays refer to the group of similar objects. String type objects handle
    character sequences. At this point, args will receive any control-line arguments
    present once you run the program.


    The last element on the line is the {, which signals the start of the body of
    main( ). All the code confined within a method will happen between the opening
    curvy brackets of the method and the closing curvy bracket.


    Here is the next code line. Take note that this is confined within main( ).


    ![nuno8.jpg](images/00009.jpeg)


    This code line will display the string “Java is a great programming language”
    followed by a new line on the screen. The output can be accomplished through the
    built-in method: printIn( ). At this point, print( ) shows the string that has
    been passed to it. As you can see, printIn( ) could also be used to show other
    kinds of information. The line starts with System.out.


    System is a pre-established class, which provides access to the system, while
    out is the output stream, which is linked to the console. Hence, System.out is
    an object, which encapsulates output console.


    Take note that the printIn( ) statement terminates with a semicolon. Java statements
    should be ended with a semicolon. Other lines in the programs that are not ending
    in a semicolon are actually not statements.


    The first curvy bracket in the program terminates main( ), and the last } terminates
    the FirstProgram class definition.'
