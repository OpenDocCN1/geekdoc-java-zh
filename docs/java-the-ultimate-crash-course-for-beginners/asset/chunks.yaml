    # The for Loop


    In Java, it is possible to execute a series of code repeatedly through a loop.
    Java supports a powerful range of loops. For now, we will take a look at `for`
    loop. Below is the simplest format of the `for` loop:


    ```java

    for(initialization; condition; iteration) statement;

    ```


    In this common format, the initialization part of the loop will set the loop control
    variable to an initial value. The condition is a Boolean line, which checks the
    variable control loop. If the result of that test is true, the `for` loop will
    continue to run. If the result is false, the `for` loop will be terminated. The
    iteration line defines how the variable control loop is changed every time the
    loop iterates.


    Below is a simple program, which shows the `for` loop:


    ![nuno27.jpg](images/00027.jpeg)


    The output displayed when you run the program should be like this:


    ![nuno28.jpg](images/00028.jpeg)


    In this case, the loop control variable is `count`. The default zero in the initialization
    part of the `for`. At the beginning of every iteration, which includes the first
    one, the conditional test `count < 6` is executed. If the result of this test
    is true, the `print( ` line is performed and then the iteration part of the loop
    will run by increasing the `count` by one unit. This sequence will continue until
    the condition test will be false, in which the execution will pick up at the bottom
    of the loop.


    It is interesting to take note that in a well-written program, you will not see
    a part of the loop written in the iteration. Rare is the chance that you will
    see line such as this:


    ```java

    count = count + 1;

    ```


    In Java, you can use a special increment operator to perform this operation. The
    double plus sign (`++`) is the increment operator, which increases the operand
    by 1. Through this increment operator, the statement can be written like this:


    ```java

    count++;

    ```


    Hence, the `for` in the previous program can be written like this:


    ```java

    for(count=0; count < 6; count++)

    ```


    You can try this, and you will notice that the loop will run the same. Meanwhile,
    Java also supports a decrement operator using the two minus signs (`--`), which
    decreases the operand by 1.


    # Code Blocks Creation


    Code block is another core element of Java. Code block refers to a group of two
    or more statements. Creating code blocks can be done by confining the statements
    within opening and closing curvy brackets `{ }`. When you create a code block,
    it will become a logical unit, which could be used in any place that one statement
    can. For instance, a code block could be a target for `if` and `for` statements
    in Java. Take a look at this `if` statement:


    ![nuno29.jpg](images/00029.jpeg)


    In this example, if `k` is less than `l`, the statements within the block will
    run. Hence, the two statements within the block will create a logical unit, and
    a statement cannot run without the other also running.


    The main point here is that creating a block will allow you to logically connect
    two or more statements. Code block also permit several algorithms to be executed
    with better efficiency and clarity.


    Below is a program, which uses a code block to prohibit division by zero:


    ![nuno30.jpg](images/00030.jpeg)


    Running this program will display this output:


    ![nuno31.jpg](images/00031.jpeg)


    In this program, the target of the `if` statement is a code block and not only
    one statement. If the condition that is controlling the `if` is true (like in
    our example), the three statements within the block will run. Try setting `h`
    to zero, and take a look at the result. You will notice that the whole block will
    be ignored by the program.


    # Using Semicolon in Java


    In Java programming, the semicolon is used as a separator, which is used to end
    a statement. Hence, every statement should be terminated with a semicolon. It
    signifies the end of one logical object.


    As you already know, a block is a group of logically related statements confined
    by opening and closing brackets. A block should not be ended with a semicolon.
    Because a block is a collection of statements, with a semicolon after every statement,
    there is no need to end the block with a semicolon. Rather, the code block is
    ended with a closing brace.


    Java doesn’t read the end of the line as a terminator. Hence, the position of
    the statement doesn’t matter.


    For instance:


    ```java

    a = b;

    b = b + 1;

    System.out.println(x + " " + b);

    ```


    This line will be interpreted as the same with Java:


    ```java

    a = b; b = b + 1; System.out.println(x + " " + b);

    ```


    Moreover, each element of a statement can also be confined on individual lines.
    For instance, this line is acceptable:


    ```java

    System.out.println("This is a lengthy output" + a + b + c + "more display");

    ```


    Breaking down lengthy lines in this manner is typically used to make the programs
    more readable. This could also prevent too much lines for wrapping.


    # Indentation


    Probably you have already noticed that in the previous programs, specific statements
    were indented. It really doesn’t matter where you position the statements on a
    line. But through the years, a conventional manner of indentation has been developed
    to make the programs more readable. This book adheres to that style, and it is
    best to follow this convention. In this style, you should indent a level after
    every opening bracket, and move back a level after every closing bracket.


    # Java Keywords


    There are 50 keywords defined by Java, which you can combine with the syntax of
    separators and operators. Take note that you cannot use these keywords as name
    for your method, class, or variable.


    The following are Java keywords:


    ![nuno32.jpg](images/00032.jpeg)


    The keywords `goto` and `const` are reserved by Java but these are not used. During
    the initial years of Java, there are keywords that were reserved so that they
    can be used in the future. But the existing specification for Java described only
    the keywords that are listed above.


    Aside from these keywords, Java also reserves the following: `null`, `true`, and
    `false`. These are values that are already defined by Java. You cannot use these
    words to name your variables or classes.


    # Java Identifiers


    Java identifiers refer to the name of a specific variable, a method, or any other
    item that are defined by the user. They could run from one to several characters
    long. Variable names may begin with any letter, a dollar sign, or an underscore.
    The underscore is ideal to use as it enhances the readability of the variable
    name such as `java_data_program` instead of `javataprogram`. Also take note that
    uppercase and lowercase are not the same. Hence, `datavar` is different from `DataVar`.


    The following identifiers are acceptable:


    ```

    Test

    b

    b3

    LoadInfo

    $pu

    _bot

    var_one

    sampler_18

    ```


    Take note that starting an identifier using a digit is not allowed. Hence, `23sampler`
    is not allowed.


    As discussed earlier, we cannot use the reserved Java keywords as the name identifier.
    You must not also use the name of Java methods like `println`. Beyond these limitations,
    professional programming practice recommend using identifier names, which reflect
    the usage or meaning of the items named.

