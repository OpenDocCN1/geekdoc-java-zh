    在这种格式中，类型表示数组中元素的类型，也称为基本类型。元素类型定义了数组中每个元素的数据类型。数组可以容的元素数量由大小（size）决定。因为数组是作为对象运行的，所以数组的是一个双重过程。首先，你需要表示变量
    `array` 的引用。然后，你可以为 `array` 定义内存，为变量 `array` 定义指向内存的引用。因此，Java 数组是通过使用 `new` 运算符动态分配的。


    在下例示例中，代码生成了一个包含 10 个元素的 `int` 数组，并将其连接到名为 `javalist` 的变量引用 `array`：


    ```

    int javalist[] = new int[5];

    ```


    此声明的功能与对象的声明非常相似。变量 `sample` 存储了指向由 `new` 定义内存的引用。这块内存足够存储 10 个 `int` 类型的元素。像对象一样，你可以将第一个表达式拆分为两行：


    ```

    int javalist[];

    javalist = new int[5];

    ```


    在这种格式中，如果先创建 `javalist`，它将不会引用任何物理对象。只有在第二条语句运行后，`javalist` 才会通过数组连接。


    你可以使用索引访问数组中某个特定的元素。索引描述了元素在数组中的位置。在 Java 中，数组的第一个元素的索引为 0。


    由于 `javalist` 有 10 个元素，索引值将从零到九。要对数组进行索引，你可以在方括号指定你喜欢的元素编号。因此，`javalist` 中的第一个元素是
    `javalist[0]`，最后一个元素将是 `javalist[9]`。


    ## 多维数组


    在 Java 中，多维数组被视为数组的数组。多维数组最基本的形式是二维数组。通常情况下，二维数组是一个一维数组的列表。为了表示一个大小为 5, 10, 15
    的二维整数数组 `score`，你可以按照这种格式编写：


    ```

    int score[ ] [ ] = new int [ 5 ] [ 10 ];

    ```


    注意该声明。与其他使用逗号分隔维度数组的编程语言不同，Java 可以将每个维度放在各自的括号中。要访问数组 `score` 的第 4 和第 8 个点，你可以使用
    `score [4] [8]`。


