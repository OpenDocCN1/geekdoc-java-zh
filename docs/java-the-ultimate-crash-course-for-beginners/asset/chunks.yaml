    我们在本章中使用的程序使用了 Java 中两种常用的内置方法：`print()` 和 `println()`。你可以通过 `System.out` 访问这些方法。`System`
    指的是由 Java 定义的类，它被立即编码到你的程序中。通常情况下，Java 平台依赖于不同的内置类库，这些库包含了许多内置方法，为图形界面、网络、字符串管理和
    I/O 等功能提供支持。


    标准 Java 类还可以支持图形用户界面（GUI）。因此，Java 整体是其标准类之上对编程语言本身的整合。


    当你练习 Java 时，你会发现类库提供了代码随附的大部分功能。作为一名程序员，学习标准 Java 类对你是非常重要的。你无法通过阅读这本书学习所有的 Java
    库，因为你需要你自己进行更多探索的领域。


    # 第 5 章 – Java 方法、对象和类


    在 Java 中你必须学习的一个重要概念是类（class）的使用。类被认为是 Java 的核心，因为它是整个 Java 语言创建的基础，而且类可以描述对象的本质。因此，我们可以说在
    Java 中，类构成了面向对象编程的基础。


    类内部定义了数据以及根据这些数据执行的代码。代码被限制在方法（methods）中。由于方法、对象和类是 Java 的基础，它们包含在书中。学习这些特征的基础将训练你编写更复杂的程序，并让你更好地理解
    Java 的特定关键元素。


    ## Java 类基础


    由于 Java 的所有活动都发生在类内部，我们从本书开始就开始使用类。但目前使用的是简单的示例，在编程中它们还有更多内涵。与我们使用的相比，有些类拥有巨大的威力。


    让我们从基础开始。类通常是一个模板，定义了对象的形状。它还描述了数据以及对这些数据操作的代码。对象是类的实例。所以从本质上说，类是一组计划，定义了你如何构建一个对象。需要澄清这一点至关重要：类是一个逻辑抽象。只有当创建了特定类的对象时，该类的物理表示才会存在于内存中。


    另外请注意，组成类的变量和方法被称为类的成员（members）。数据成员也被称为实例变量（instance variables）。


    ## 类形式


    一旦你定义了一个类，你就在声明它的实际本质和形式。你可以通过指定它包含的实例变量以及你用于操作这些变量的方法来实现。


    尽管简单的类可能只包含实例变量或只包含方法，但许多实际类可以同时处理两者。


    关键字 `class` 用于创建类。下面是类的一种简单通用形式：


    ![nuno33.jpg](img/00033.jpeg)


    尽管没有硬性规则强制执行，但一个设计良好的类必须只描述一个逻辑对象。例如，存储员工姓名和其 ID 号的类通常不会存储关于每日气温、股市价格或外汇汇率的信息。这里的关键在于，编写良好的类组会将逻辑上相关的信息组合在一起。将不相关的信息限制在同一个类中将影响你代码的结构。


    到目前，我们只使用了一个方法：`main()`。当你学习 Java 编程时，你也将学习如何创建其他方法。但你应该注意，类的通用形式并没有定义 `main()`
    方法。只有当该类是你的程序的起点时，才需要 `main()` 方法。此外，某些类型的 Java 应用（如 applet）不需要 `main()`。


    ## 方法


    方法和实例变量是类的组件。尽管只有数据的类是有效的，但大多数类都会有方法。方法是子程序，控制类分配的数据，并在大多数情况下提供对这些数据的访问。通常，程序的其他部分通过使用其方法与类交互。


    一个方法限制了多个语句。编写良好的代码会定义一个方法来执行单一任务。每个方法都有自己的名称，这个名称将用于调用该方法。通常情况下，你可以提供一个方法，无论你想要什么名称。但请记住，`main()`
    是留给启动运行程序的方法的。同时，你不应该使用 Java 关键字作为方法的名称。


    方法名称后总是紧跟括号。例如，如果一个方法是 `obtainval`，那么在句子中使用该名称时，应该写成 `obtainval()`。这种表示法可以帮助你区分变量名。


    下面是方法的通用形式：


    ```

    ret-type name( ) {

    // 方法体

    }

    ```


    在这种格式中，`ret-type` 将指定返回的数据类型。如果方法不返回值，则返回类型应该是 `void`。`name` 由标识符指定。如果方法没有参数，则
    `par list` 将为空。


    # 第 6 章 – 数组


    在 Java 编程中，数组指的是一组类型相似的变量，通过一个公共名称引用。数组可以有多个维度，尽管一维数组是最常见的。


    数组用于不同的目的，因为它们提供了一种将相互相关的变量分组的简单方法。例如，你可以使用数组来存储一年中每天的气温读取记录、外汇市场交易列表，或图书馆中所有关于计算机的书籍列表。


    数组的主要优点是它可以以一种简单的方式组织数据，从而便于控制。如果你有一个持有特定职业人员薪资的数组，将组织数组轻松计算平均薪水。此外，数组以这种方式排列数据，可以更容易排序。


    尽管 Java 数组的使用方式与其他语言中的数组相似，但它们有一个特殊特性：它们作为对象执行的。将数组作为对象运行有几个好处。


    ## 一维 Java 数组


    一维数组指的是一组相互连接的变量列表。这在编程中非常常见。例如，你可以使用一维数组存储公司活跃员工的 ID 号。另一个数组可以用于存储媒体网络的当前调查评级。


    要表示一个一维数组，可以使用这种格式：


    ```

    type name-array[ ] = new size[type];

    ```


    '
- fmt: '

    In this format, type expresses the type of element of the array, which is also
    known as the base type. The element type defines the data type for every element
    confined in the array. The number of elements, which the array can hold is determined
    by size. Because arrays are run as objects, the creation of an array is a dual
    process. You first need to express the reference for the variable `array`. Then,
    you can define memory for the `array`, defining a reference to the memory to the
    variable `array`. Hence, Java arrays are allocated dynamically by using the operator
    `new`.


    In the example below, the code generates an int array of 10 elements and connects
    it to the variable reference `array` named `javalist`:


    ```

    int javalist[] = new int[5];

    ```


    The function of this declaration is quite similar to the declaration of an object.
    The variable `sample` stores a reference to the memory defined by `new`. This
    memory is large enough to store 10 elements of type `int`. Like objects, you can
    break the first expression into two lines:


    ```

    int javalist[];

    javalist = new int[5];

    ```


    In this format, if the `javalist` is first created, it will refer to no physical
    object. It is only after the second statement runs the `javalist` will be connected
    through an array.


    You can access a separate element confined in an array, using an index. The index
    describes the element position confined in an array. In Java, the arrays have
    zero as the index of the first element.


    Since `javalist` has 10 elements, the index values will be from zero to nine.
    To index the array, you can specify the number of the element that you like, confined
    by square brackets. Hence, the first element in `javalist` is `javalist[0]`, and
    the last element will be `javalist[9]`.


    ## Multidimensional Arrays


    In Java, a multidimensional array is considered as an array of arrays. The most
    basic form of multidimensional array is the two-dimensional array. In general,
    a two-dimensional array is a list of one-dimensional arrays. In order to express
    a two-dimensional integer array `score` of size 5, 10, 15 you can write in this
    format:


    ```

    int score[ ] [ ] = new int [ 5 ] [ 10 ];

    ```


    Take note of the declaration. Not similar to other programming languages that
    use commas to separate the dimension array, Java can place every dimension on
    its confined brackets. In order to access point 4 and 8 of array `score`, you
    can use `score [4] [8]`.


    ## Conclusion


