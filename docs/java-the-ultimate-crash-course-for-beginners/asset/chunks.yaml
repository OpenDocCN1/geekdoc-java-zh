    # 第 3 章 – 语法错误与数据类型


    如果你以前尝试过编程，你现在已经知道拼写错误是非常常见的现象，这可能会导致错误。如果代码中存在错误，编译器在尝试编译后会显示语法错误提示。Java 编译器无论你写了什么，都会尝试解释源代码。因此，所显示的错误并不总是代表问题的实际原因。


    例如，在我们的 `FirstProgram` 示例中，无意中漏掉了方法 `main()` 后的左大括号，这会导致编译器显示以下错误：


