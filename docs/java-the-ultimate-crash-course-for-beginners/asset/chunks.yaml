    As we have already discussed, Java is case sensitive. Disregarding this might
    cause serious problems. For instance, if you have mistakenly type `Main` instead
    of `main`, or `PrintIN` rather than `println`, the program before this could be
    wrong. Moreover, even though the Java compiler could compile classes, which don’t
    contain the `main()` method, there is no way to run them. Hence, if you had incorrectly
    entered `main`, the compiler will still compile the program. But the interpreter
    will result to an error, because it is not capable of finding the method `main()`.


    # Chapter 3 – Syntax Errors and Data Types


    If you have tried programming before, you know by now that typos are very common,
    which could lead to errors. If there is a mistake in the code, the compiler will
    show a syntax error prompt after trying to compile it. The Java compiler will
    try to interpret the source code regardless of what you have written. Hence, the
    error that is shown doesn’t always represent the actual cause of the problem.


    For instance, in our `FirstProgram` example, an unintended omission of the opening
    curvy bracket after the method `main()` will cause the compiler to display the
    following errors:


    ![nuno9.jpg](images/00010.jpeg)


    The first message error is clearly wrong, because what has been omitted is a curvy
    bracket and not a semicolon.


    If your program has a syntax error, there is no need to interpret the message
    compiler literally. More often than not, the messages could be misleading. You
    still need to assess the error message to find out the real problem. You should
    also pay attention to the last several code lines in the program that precedes
    the line with suspected error.


    ## Second Program


    Probably no other construct is as crucial to a programming language as the assigning
    of a value to a variable. A variable refers to a defined memory location, which
    could be allocated with a value. Moreover, the value of a variable could be transformed
    during the program run. It is important to take note that the variable content
    can be changed. It is not fixed. In the program below, we can create two variables
    known as `var1` and `var2`.


    ![nuno10.jpg](images/00011.jpeg)


    ![nuno11.jpg](images/00012.jpeg)


    Once you run this program, the following output should display on your screen:


    ![nuno12.jpg](images/00013.jpeg)


    We are introduced with new concepts in this program. First, we have the statement:


    ![nuno13.jpg](images/00014.jpeg)


    This expresses a variable known as `var1` of integer type. Take note that in Java,
    you need to declare all variables before you can use them. Moreover, you should
    also specify the type of values that the variable can hold. This is known as the
    variable type. In this example, `var1` can store values of the integer type or
    whole number values. To express an integer variable in Java, it should be preceded
    with the `int` keyword. Hence, the preceding statement expresses a variable known
    as `var1` of the `int` type.


    The line below expresses another variable known as `var2`:


    ![nuno14.jpg](images/00015.jpeg)


    Take note that this line utilizes the same format similar to the first line. The
    only difference is the name of the variable.


    Generally, you need to use the line below to express a variable:


    `type var-name;`


    In this format, the `type` specifies the type of variable you want to express,
    while the `var-name` is the variable name. Aside from `int`, Java is supporting
    other types of data.


    Take note that in Java, the operator assignment is the equals sign. Its function
    is to copy the value in the left side to the right side.


    The next line displays the value assigned to `var1` preceded by the string: “var1
    has”:


    ![nuno15.jpg](images/00016.jpeg)


    In the line above, the `+` symbol will cause the `var1` value to be shown after
    the string, which precedes it. This method could be generalized. Through the `+`
    operator, you can combine together several objects as you prefer inside a single
    `println()` statement.


    The next code defines the value of `var2` – the `var1` value divided by 3:


    ![nuno16.jpg](images/00017.jpeg)


    This code will divide the value assigned in `var1` by 3, and then store the result
    in `var2`. Hence, after executing the line, `var2` will store the value of 345.
    The value assigned to `var1` will be fixed. Similar to most other programming
    languages, Java uses arithmetic operators: addition (`+`), subtraction (`-`),
    multiplication (`*`), and division (`/`).


    Below are the next codes in the program:


    ![nuno17.jpg](images/00018.jpeg)


    There are two new things that are happening here: the `print()` method is used
    to show the string “var 2 contains var1 / 3: ”. Notice that this string is not
    followed by a new line. Hence, once we generate the next output, it will begin
    on the same line. The `print()` method is similar to `println()`, except that
    it doesn’t display a new line after every call. Next, in the line to `println()`,
    take note that `var2` is used as itself. The `print()` and `println()` could be
    utilized to display the values of any of Java’s built-in types.


    Before we proceed, you first need to understand another important concept in expressing
    variables. You can express two or more variables even with one declaration line.
    You just need to separate the variable names by using commas.


    For instance, `var1` and `var2` could be expressed like this:


    ![nuno18.jpg](images/00019.jpeg)


    ## Floating Point Types


    In the previous program, we have used `int`. But this type can only store whole
    numbers. To store fractional components, you can use `float` or `double`. These
    floating point types represent single and double precision values. The `double`
    type is commonly used.


    In order to declare a double type, you can use a statement like this:


    `double a;`


    In this statement, `a` refers to the variable name, which is `double`. Since `a`
    has fractional components, it could store 133.43, 0.045, or -20.5.


    In order to understand the difference between `int` and `double` you can try the
    following program:


    ![nuno20.jpg](images/00021.jpeg)


    When you run this program, you will see the output below:


    ![nuno21.jpg](images/00022.jpeg)


    As you will notice, when `var` was divided by 8, the program performed a whole
    number division, and the result is 2 instead of 2.5 because the fractional component
    was lost. But when `a` was divided by 8, the program preserved the fractional
    component and the correct answer was shown.


    Another new component in this program is the use of `println()` without any args
    in order to insert a blank line.


    # Chapter 4 – Java Control Statements


    Within a method, the program runs from one line to another, from up to down. But
    like other programming languages, Java also allows the programmer to control the
    flow by using the different program control statements such as the `if` statement
    and the `for` loop.


    ## The if Statement


    It is possible to selectively run a part of a program by using the conditional
    `if` statement. The `if` statement in Java works much like the `IF` statement
    in other languages. Below is its simplest form:


    `if(condition) statement;`


    In this line, `condition` is a Boolean expression. If the condition is true, then
    the program will run the code. If the condition is not true, then the statement
    will be ignored. Below is an example:


    ![nuno22.jpg](images/00023.jpeg)


    In this example, because 20 is lower than 21, the conditional expression is true,
    so the `println()` will run.


    Take a look in the line below:


    ![nuno23.jpg](images/00024.jpeg)


    In this example, 20 is not lower than 19. Hence, the `println()` will not be executed.


    Java supports a range of complementary relational operators, which could be used
    in conditional expressions:


    - Less Than (`<`)


    - Less Than or Equal (`<=`)


    - Greater Than (`>`)

