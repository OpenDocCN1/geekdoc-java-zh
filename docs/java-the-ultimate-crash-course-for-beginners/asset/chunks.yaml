  raw: 'Java applets are special types of program, which are developed to be carried
    over online and instantly applied by an online browser that is enabled with Java.
    Moreover, Java applets are downloaded depending on the demand, without complicated
    user interaction. Once a user access a link, which has an applet, the computer
    will instantly download the files and execute the download codes. Applets are
    designed to be minor programs. These are usually utilized to display information
    from the server, deliver basic functions, and manage input from the user.


    Applet’s development transformed the online programming as this widened the range
    of objects, which can move easily in cyberspace. Generally, we have two wide object
    categories that are channeled from the user to the server such as programs that
    are passive, dynamic, and active.


    If you read an email, you’re reading a passive type of data. Even when downloading
    a program, the code of the program is still passive unless you launch it. Meanwhile,
    the applet is a vibrant, self-launching program.


    Portability


    Portability is a primary aspect of the Internet, because there are various kinds
    of operating systems and computers attached to it. If you run a Java program to
    any computer connected to the Web, there should be a method to enable this program
    to launch on different systems.


    For the applet, it should be downloaded and run by the wide range of several CPUs,
    browsers, OS that are connected online. It is not ideal to have different applet
    versions for various computers. One code should work for all computers. Hence,
    there should be a way to generate codes that are portable and executable.


    Security


    Whenever you are downloading anything from the Internet, there is always the risk
    of getting your computer or server infected with virus. A harmful code may cause
    damage to the system once it gains access to your system. For instance, a virus
    could collect private data such as bank account information, credit card numbers,
    and passwords.


    To allow applets to be downloaded safely and launched on the user’s computer,
    it was important to prohibit an applet from executing the attack. Java enabled
    this protection by restricting applets to the execution platform of Java, and
    not permitting access to other parts of the system.


    The capacity to download applets with security is the most innovative aspect of
    Java.


    The Java Byte-code


    The reason why Java can address both portability and security concerns is because
    the compiler output is not an executable code. Instead, it is bytecode, which
    is a well-optimized chunk of commands developed to run in JVM.


    Converting Java program into byte-code will make it easier to execute a program
    in different platforms as the JVM requires to be executed for every platform.
    When the package is available for a specific system, a Java program could run.
    Take note, that even though the JVM details could differ from every platform,
    everyone can interpret the same bytecode. Once the program is compiled, the various
    programs of similar program should exist for every type of computer with Internet.


    Object Oriented Programming


    Object-Oriented Programming (OOP) is a core element of Java. The OOP method is
    indispensable in Java. Hence, it is crucial to understand OOP in learning Java.


    OOP is an effective method to write programs. The methodologies in programming
    have significantly changed since the rise of computers to address growing program
    complexity.


    For instance, when computers were first developed, programming was performed by
    changing the binary machine instructions through the front panel of the PC. This
    method is practical if the programs are of an average length. Assembly language
    was developed as the programs grew, to make it easier for the programmer to manage
    larger and more complex programs using symbolic representations of machine instructions.


    As programs continue to expand, programmers developed high-level languages, which
    gave the programmer more tools that could manage complexity.


    OOP used the best ideas of structured programs and integrated them with different
    concepts. This resulted to a special way in structuring a program. In general,
    a program could be structured through a code or through data. Using only structured
    program techniques, programs are usually organized relevant to the code.


    In order to support OOP, Java, as well as other languages, have three common attributes:
    inheritance, polymorphism, and encapsulation.


    Inheritance


    Inheritance refers to the process by which an object can obtain the properties
    of another object. This is crucial as it supports the idea of hierarchical organization.
    Without hierarchies, every object should be defined explicitly. Through inheritance,
    an object is only required to define the qualities, which make it unique within
    the class. This could inherit its basic attributes from the parent. Hence, this
    is the inheritance mechanism that makes it easy for an object to be a specific
    occurrence.


    Polymorphism


    Polymorphism (many forms) is the attribute, which allows an interface to access
    basic class of actions. The certain action is defined by the specific nature of
    the situation. The concept of polymorphism is usually defined by the phrase “multiple
    methods, one interface.” Hence, it is possible to design a generic interface to
    a group of relevant activities. Polymorphism can help in decreasing complexity
    by accessing similar interface that you can use to ascertain a general class of
    action.


    Encapsulation


    Encapsulation is a programming method, which integrates the code including the
    data that it handles, and that stores both to avoid misuse and external interference.
    In an OOP language, the data and code can be combined together in such a manner
    that a self-containing black box is built. Inside the box are the all-important
    code and data. If code and data are combined together in this manner, we can create
    an object. Hence, an object is the device that supports encapsulation.


    # Chapter 2 – Writing Your First Program


    Now that you have learned the fundamentals of Java, it is time to begin writing
    your first Java program. Before compiling and running the programs, you should
    install the Java Development Kit (JDK). This is a free program from Oracle. As
    of press time, the latest release is JDK 8\.


    Since JDK 8 offers several new features that are not included in the initial Java
    versions, it is best to use JDK 8 to compile and run the programs you will learn
    in this book. Using an earlier version may result to the programs not compiling.


    You can download the latest version of the JDK through this link:


    [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)


    Just visit the Oracle download page and choose your computer type. After installing
    the JDK, you can compile and run programs. JDK supports two main programs: javac
    and java. The latter is the basic Java interpreter and also known as the app launcher.


    Take note that JDK is not a windowed application. It runs in a command prompt
    environment, which uses command-line tools. This is also not an integrated development
    environment (IDE).


    Aside from the standard command-line tools offered with the JDK, you can use other
    IDEs like NetBeans. Using an IDE could be helpful in the development and deployment
    of commercial applications.


    Write Your First Java Program


    Now that we are all set, we can start compiling and running a short program. Use
    the code below:


    ![nuno.jpg](images/00001.jpeg)


    There are three basic steps that you need to follow: Enter, Compile, and Run


