    手动输入程序是可能的。在这个示例中，你可以通过文本编辑器将程序输入计算机。记住不要使用文字处理器，因为它通常会在存储文本的同时存储格式数据。这些数据将与 Java
    编译器产生冲突。如果你使用 Windows 电脑，可以使用 `WordPad` 或任何你喜欢的编程软件。


    在其他编程语言中，存储程序源代码的文件名可以是随机的。在 Java 中，情况并非如此。源文件的名称在 Java 中非常关键。在我们的示例中，源文件的名称必须是
    `FirstProgram.java`。


    在 Java 编程中，源文件正式称为编译单元。这是一个文本文件，其中包含一个或多个类定义。在目前，我们将使用包含单个类的源文件。


    Java 编译器会调用以 `.java` 为后缀的文件作为源文件。正如我们在第一个程序中看到的，程序的类名也是 `FirstProgram`。这并不是随机发生的。所有代码都应该被限制在一个类内部。按照惯例，主类的名称必须与存放程序的文件名匹配。


    注意，文件名的大小写必须与类名匹配。Java 对字符的大小写敏感。这种格式有助于更容易维护和组织程序。


    ## 编译程序


    在编译 `FirstProgram` 时，通过在控制命令行指定源文件名来启动编译器 `javac`，如下所示：


    ![nuno1.jpg](img/00002.jpeg)


    Java 编译器将创建一个名为 `FirstProgram.class` 的文件，它存储程序的字节码版本。注意，字节码不是可执行代码。字节码应该使用 `JVM`
    执行。因此，`javac` 的输出不是一个可以直接执行的代码。


    要运行程序，你可以使用 Java 解释器 `java`。为了做到这一点，如如下所示，将类名 `FirstProgram` 作为控制命令行参数传递：


    ![nuno2.jpg](img/00003.jpeg)


    一旦你运行了程序，将显示下面的输出：


    ![nuno3.jpg](img/00004.jpeg)


    当你编译程序时，每个类都会被限制在以类命名并使用 `.class` 扩展名的输出文件中。因此，为你的 Java 源文件提供与它们所处理的类相似的名称是理想的——源文件名将与
    `.class` 文件名匹配。一旦你运行 Java 解释器，你实际上是在指定你想让解释器运行的类名。这将立即通过该名称和 `.class` 扩展名搜索文件。一旦找到文件，它将运行包含定义类的代码。


    尽管 `FirstProgram.java` 有点短，但它包含了一些所有 Java 程序共有的关键特性。


    我们的程序从以下几行开始：


    ![nuno4.jpg](img/00005.jpeg)


    起始行是“注释”。与其他编程语言类似，Java 允许你直接在程序的实际源文件中插入注释。编译器会忽略这些注释，因此它们不会以任何方式影响代码。相反，注释向源文件的其他读者解释或描述了程序的操作。在此时，注释为程序提供了一个描述，并包含了一个提醒，即源文件必须命名为
    `FirstProgram.java`。


    Java 中有三种注释样式。插入在程序顶部的注释是“多行”注释。这种类型的注释应该以 `/*` 开始并以 `*/` 结束。这两个注释符号限制的所有文本都将由编译器忽略。正如名称所意，多行注释可能有几行那么长。


    我们第一个程序中的下一行代码所示：


    ![nuno5.jpg](img/00006.jpeg)


    在这一行中，我们将使用 `class` 关键字来声明定义一个新类。记住，类是 Java 中封装的基本单元。`FirstProgram` 是类名。类定义以左大括号（`{`）开始并以右大括号（}`）结束。这些括号之间的代码被称为类成员。


    目前，不要担心类的细节，但请注意在 Java 中程序活动发生在类内部。


    此程序的下一行是如下的单行注释：


    ![nuno6.jpg](img/00007.jpeg)


    这是 Java 中的另一种注释类型。单行注释以两个右斜杠（`//`）开始，并在行尾结束。在编程中，你可以使用多行注释进行长注释，使用单行注释进行短的逐行备注。


    这是下一行代码：


    ![nuno7.jpg](img/00008.jpeg)


    这一行启动了 `main()` 方法。在 Java 中，子程序是一个方法。正如前面的注释所述，这是程序开始执行的行。Java 应用通过调用 `main()`
    开始执行代码。


    我们仍然无法提供该行每个部分的具体含义，因为这需要对其他 Java 特性有更深入的理解。但由于书中的许多示例将使用这行代码，这里是关于每个部分的基础信息。


    关键字 `public` 是访问修饰符，它定义了程序的其他部分如何访问类成员。当你看到类成员前面写有 `public` 关键字时，该成员可以被类之外的代码访问。相反的关键字是
    `private`，它禁止类之外声明的代码使用该成员。此时，`main()` 应该被定义为 `public`，因为它应该在类之外被调用。`static` 关键字让
    `main()` 在对象创建之前即可被调用。接下来，`void` 关键字基本上告诉编译器 `main()` 不产生值。方法也可以产生值。


    正如前面所述，`main()` 是 Java 运行时被调用的方法。传递给方法的任何数据都由方法名括号内定义的变量接收。这些变量被称为参数。如果没有需要的参数，你仍然可以包含参数。在
    `main()` 中，我们只有一个参数：


    `String[]`


    这声明了一个名为 `args` 的参数。这是一个 `String` 类型对象的数组。数组指向相似的对象组。`String` 类型对象处理字符序列。此时，一旦你运行程序，`args`
    将接收任何存在的命令行参数。


    该行的最后一个元素是 `{`，它标志着 `main()` 体的开始。限制在方法的所有代码都发生在方法的左大括号和右大括号之间。


    这是下一行代码。注意它限制在 `main()` 内部。


    ![nuno8.jpg](img/00009.jpeg)


    这行代码将显示字符串“Java 是一种很棒的编程语言”，并在屏幕上换行。输出可以通过内置方法：`println()` 完成。此时，`print()` 显示传递给它的字符串。正如你所看到的，`println()`
    也可以用于显示其他类型的信息。该行以 `System.out` 开始。


    `System` 是一个预定义的类，提供了对系统的访问，而 `out` 是输出流，它连接到控制台。因此，`System.out` 是一个对象，封装了输出控制台。


    注意 `println()` 语句以分号结束。Java 语句应该以分号结束。程序中其他不以分号结尾的行实际上不是语句。


    程序中的第一个括号结束了 `main()`，最后一个 `}` 结束了 `FirstProgram` 类的定义。

