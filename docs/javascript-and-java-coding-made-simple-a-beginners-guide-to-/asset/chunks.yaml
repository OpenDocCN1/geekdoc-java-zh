    ## 1.7 变量与数据类型


    变量是任何编程语言中的基础构建。它们允许你存储和操作数据。在 JavaScript 中，你可以使用 `var`、`let` 或 `const` 关键字来声明变量。让我们探索这些关键字及其特性。


    `var` 关键字在历史上一直用于声明 JavaScript 中的变量。它具有函数级作用域，这意味着用 `var` 声明的变量在定义的函数内部是可以访问的。然而，如果它没有在函数内部显式声明，也可以在函数外部访问。


    随着 ES6 的引入，引入了 `let` 和 `const` 关键字来解决 `var` 的某些缺点并提供块级作用域。用 `let` 声明的变量具有块级作用域。它们的作用域限制在定义的块内，例如循环内部或
    `if` 语句内部。这有助于变量命名冲突并促进更好的代码组织。


    另一方面，用 `const` 关键字声明的变量也是块级作用域的，但有一个额外的特性：它们是常量。一旦给常量赋值了值，就无法重新赋值或修改。当你有在整个代码执行过程中应该保持不变的值时，常量是非常用的。


    在声明变量时，考虑它们将持有的数据类型是非常重要的。JavaScript 有几种内置数据类型，包括：


    - 字符串（Strings）：用于表示文本，并包含单引号或双引号中。例如，`"Hello, World!"` 或 `''JavaScript''`。

    - 数字（Numbers）：用于表示数值，包括整数和浮点数。例如，`42` 或 `3.14`。

    - 布尔值（Booleans）：用于表示逻辑值，即 `true` 或 `false`。布尔值经常用于条件语句和比较。

    - 数组（Arrays）：用于在单个变量中存储多个值。数组可以包含任何数据类型的元素，并用方括号表示。例如，`["apple", "banana", "orange"]`。

    - 对象（Objects）：用于存储键值对集合。对象用大括号表示，可以包含属性和方法。例如，`{ name: "John", age: 30 }`。


    JavaScript 是一种动态类型语言，这意味着在声明变量时不需要显式指定变量的数据类型。变量的类型根据赋值给它的值自动确定。这种灵活性允许你在整个代码中同一个变量中处理不同的数据类型。


    你可以对变量执行各种操作，例如数学计算、字符串拼接和逻辑比较。JavaScript 提供了广泛的运算符，包括算术运算符（`+`、`-`、`*`、`/`）、字符串运算符（`+`）、比较运算符（
    `>`, `<`, `===`）和逻辑运算符（`&&`、`||`、`!`）。


    理解变量和数据类型关关，因为它们是 JavaScript 编程的基础。有了这些知识，你可以开始编写更复杂的程序，动态操作数据并构建交互式 Web 应用程序。


    这里就是《JavaScript 世界：初学者 Web 开发指南》第一章的结束。在本章中，我们提供了 JavaScript、其历史及其在 Web 开发中重要性的概述。我们还设置了开发环境并编写了第一个
    JavaScript 程序。最后，我们介绍了变量和数据类型。


    在下一章中，我们将深入研究 JavaScript 语法、运算符和表达式。准备好提升你的 JavaScript 能力，向成为精通的 Web 开发者迈出一步！


    # 第 2 章：JavaScript 语法、运算符和表达式


    在第一章中，我们了解了 JavaScript 的基础，包括它的历史、在 Web 开发中的作用以及如何设置开发环境。现在，让我们深入研究 JavaScript
    语法、运算符和表达式。这些基础概念将为编写更复杂、交互性的 JavaScript 代码铺平道路。


    ## 2.1 JavaScript 语法


    语法是指规定编程语言中如何编写代码的规则集。正确的语法确保代码结构正确，并且可以被人类和机器理解。让我们探索 JavaScript 语法的一些基本方面。


    ### 2.1.1 语句和分号


    在 JavaScript 中，语句是代码的构建块。语句是执行特定操作的指令。JavaScript 中的每个语句都以分号（`;`）结束，表示语句的完成。虽然分号在
    JavaScript 中并非总是强制，但一致地使用分号被认为是良好的做法，可以避免潜在的问题。


    例如，以下语句为变量赋值：


    ```javascript

    var name = "John";

    var age = 25;

    ```


    ### 2.1.2 注释


    注释用于在代码中添加说明。它们会被 JavaScript 引擎忽略，旨在开发者提供上下文并提高代码的可读性。JavaScript 有两种注释：


    - 单行注释：用双斜杠（`//`）表示。`//` 之后的所有内容都被视为注释，不会执行。


    ```javascript

    // 这是一个单行注释

    ```


    - 多行注释：封装在 `/*` 和 `*/` 之间。多行注释可以跨多行，适用于提供较长的解释或注释代码。


    ```javascript

    /*

    这是一个多行注释。

    它可以跨多行。

    */

    ```


    ## 2.2 JavaScript 运算符


    JavaScript 中的运算符是对操作数（值或变量）执行操作的符号。它们用于执行数学计算、比较值、赋值等。让我们探索 JavaScript 中常用的运算符。


    ### 2.2.1 算术运算符


    算术运算符用于执行数学计算。JavaScript 包含以下算术运算符：


    字体 加（`+`）：相两个数字或拼接两个字符串。

    - 减（`-`）：从一个数字减去另一个。

    - 乘（`*`）：乘以两个数字。

    - 除（`/`）：用一个数字除以另一个数字。

    - 取模（`%`）：返回除法的余数。

    - 增（`++`）：将值加 1。

    - 减（`--`）：将值减 1。


    这是一个演示使用算术运算符的示例：


    ```javascript

    var x = 5;

    var y = 2;

    var sum = x + y;      // 7

    var difference = x - y; // 3

    var product = x * y;   // 10

    var quotient = x / y;   // 2.5

    var remainder = x % y;  // 1

    x++; // x 现在是 6

    y--; // y 现在是 1

    ```


    ### 2.2.2 赋值运算符

