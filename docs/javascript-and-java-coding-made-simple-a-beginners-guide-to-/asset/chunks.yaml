    \ week.\"。\n\n## 3.3 循环语句：for, while 和 do-while\n\n循环语句允许我们多次执行一个代码块。Java 提供了三种循环语句：`for`、`while`\
    \ 和 `do-while`。\n\n### 3.3.1 for 循环\n\n`for` 循环用于提前知道迭代次数的情况。它由三部分组成：初始化、条件和增/减。\n\
    \nfor 循环的语法如下：\n\n```java\nfor (initialization; condition; increment/decrement)\
    \ {\n    // 需要重复的代码\n}\n```\n\n示例：\n\n```java\nfor (int i = 1; i <= 5; i++) {\n\
