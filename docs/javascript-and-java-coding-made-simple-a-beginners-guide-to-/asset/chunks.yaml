    Representational State Transfer (REST) is an architectural style for building
    web services that are lightweight, scalable, and stateless. RESTful web services
    provide APIs that allow clients to interact with server resources using standard
    HTTP methods like GET, POST, PUT, and DELETE.


    Java offers several frameworks for building RESTful web services, including:


    ### 11.3.1 JAX-RS (Java API for RESTful Web Services)


    JAX-RS is a Java API that simplifies the development of RESTful web services.
    It provides annotations and classes for defining resources, handling HTTP requests
    and responses, and mapping Java objects to JSON or XML representations.


