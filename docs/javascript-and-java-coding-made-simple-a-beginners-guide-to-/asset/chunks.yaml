    代码吧！


    # 第 4 章：JavaScript 函数


    在第 3 章中，我们探索了 JavaScript 中的控制流语句，它们允许我们做出决策并重复代码块。现在，让我们深入研究 JavaScript 函数，它是构建模块化可重用代码的重要部分。


    ### 4.1 函数简介


    JavaScript 中的函数是一个执行特定任务或计算值的代码块。函数允许我们将代码组织成逻辑清晰且可重用的单元。它们有助于提高代码的可读性，促进代码重重用，并使我们的程序更易管理。


    ### 4.2 函数声明


    在 JavaScript 中，我们可以使用 `function` 关键字声明函数，后面跟着函数名、参数列表（可选）以及用大括号括起来的代码块。以下是函数声明的基本语法：


    ```javascript

    function functionName(parameter1, parameter2, ...) {

    // 要执行的代码

    }

    ```


    让我们定义一个计算数字平方的简单函数：


    ```javascript

    function square(number) {

    var result = number * number;

    return result;

    }

    ```


    在这个示例中，我们声明了一个名为 `square` 的函数，它接受一个名为 `number` 的参数。在函数内部，我们通过将 `number` 自乘来计算其平方，并将结果赋值给名为
    `result` 的变量。最后，我们使用 `return` 语句返回计算结果。


    ### 4.3 函数调用


    为了执行函数并获得所需的结果，我们需要通过使用函数名后跟括号 `()` 并传递必要的参数（如果有）来调用或触发函数。以下是调用 `square` 函数的示例：


    ```javascript

    var number = 5;

    var squaredNumber = square(number);

    console.log(squaredNumber); // 输出: 25

    ```


    在这个示例中，我们将值 `5` 赋值给变量 `number`。然后，我们通过传递 `number` 作为参数来调用 `square` 函数。返回的结果 `25`
    被赋值给变量 `squaredNumber`，然后我们将其打印到控制台。


    ### 4.4 函数参数与参数


    函数可以接受参数，这些是传递给函数的占位符。参数允许函数具有灵活性并处理不同的值。当我们调用函数时，传递的是参数，它们是替换函数参数的值。让我们修改 `square`
    函数以利用参数：


    ```javascript

    function square(number) {

    var result = number * number;

    return result;

    }

    var number = 5;

    var squaredNumber = square(number);

    console.log(squaredNumber); // 输出: 25

    ```


    在这个示例中，函数声明中的 `number` 参数作为调用函数时传递的值（在本例中为 `5`）的占位符。


    ### 4.5 返回语句


    函数中的 `return` 语句用于指定函数返回的值。它标记了函数执行的结束并将指定的值发送给调用者。让我们修改 `square` 函数以包含 `return`
    语句：


    ```javascript

    function square(number) {

    return number * number;

    }

    var number = 5;

    var squaredNumber = square(number);

    console.log(squaredNumber); // 输出: 25

    ```


    在更新的版本中，`return` 语句直接返回计算结果，不再使用中间变量。


    ### 4.6 函数作用域


    JavaScript 中的函数有自己的作用域。在函数内部定义的变量是局部的，意味着只能在函数内部访问。相反，在任何函数外部定义的变量具有全局作用域，可以在代码的任何地方访问。让我们通过示例来检查函数作用域的概念：


    ```javascript

    var globalVariable = "I''m a global variable";

    function myFunction() {

    var localVariable = "I''m a local variable";

    console.log(localVariable); // 输出: I''m a local variable

    console.log(globalVariable); // 输出: I''m a global variable

    }

    myFunction();

    console.log(localVariable); // 错误: localVariable is not defined

    console.log(globalVariable); // 输出: I''m a global variable

    ```

