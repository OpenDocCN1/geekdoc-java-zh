    \ \"You are eligible to vote.\"。如果条件为假，将显示消息 \"You are not eligible to vote yet.\"\
    。\n\n## 3.2 switch 语句\n\nswitch 语句提供了根据表达式的值执行多次条件检查的替代方法。它允许你为表达式的不同可能值指定不同的操作。\n\
    \nswitch 语句的语法如下：\n\n```java\nswitch (expression) {\n    case value1:\n      \
