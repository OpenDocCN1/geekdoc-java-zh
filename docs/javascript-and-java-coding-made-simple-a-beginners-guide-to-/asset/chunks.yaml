    # Chapter 2: Variables and Data Types


    In Chapter 1, we introduced the basics of Java programming and explored the importance
    of Java as a versatile language. In this chapter, we will delve deeper into variables
    and data types in Java. Understanding variables and their associated data types
    is essential for storing, manipulating, and working with different kinds of information
    in your programs.


    ### 2.1 What are Variables?


    In Java, a variable is a named storage location that holds a value. It acts as
    a container for storing data that can be modified during program execution. Variables
    allow you to assign values, retrieve them, and perform operations on them.


    Before using a variable, you must declare it by specifying its data type and giving
    it a name. This informs the compiler about the type of data the variable can hold
    and reserves memory for it.


    ### 2.2 Primitive Data Types


    Java provides several primitive data types that represent basic types of data.
    These data types are built into the language and have predefined characteristics.


    Here are the commonly used primitive data types in Java:


    - `byte`: Used to store small integers from -128 to 127.


    - `short`: Used to store integers with a larger range from -32,768 to 32,767.


    - `int`: Used to store integers with a broader range from -2,147,483,648 to 2,147,483,647.


    - `long`: Used to store larger integers beyond the range of `int`.


    - `float`: Used to store decimal numbers with single-precision.


    - `double`: Used to store decimal numbers with double-precision (higher precision
    than `float`).


    - `boolean`: Used to store either `true` or `false` values.


    - `char`: Used to store a single character or ASCII value.


