    ### 3.2 Looping Statements


    Looping statements allow us to repeat a block of code multiple times. They are
    useful when we want to perform a task repeatedly or iterate over a collection
    of data. JavaScript provides several looping statements, including the `for` loop,
    the `while` loop, and the `do...while` loop.


    ### 3.2.1 The for Loop


    The `for` loop is commonly used when we know the number of iterations in advance.
    It consists of three parts: initialization, condition, and update. Here''s the
    syntax:


    ```javascript

    for (initialization; condition; update) {

    // code to be executed in each iteration

    }

    ```


    Let''s see an example of a `for` loop:


    ```javascript

    for (var i = 1; i <= 5; i++) {

    console.log(i);

    }

    ```


    In this example, the loop will iterate five times, and the numbers 1 to 5 will
    be displayed.


    ### 3.2.2 The while Loop


    The `while` loop is used when we don''t know the exact number of iterations in
    advance. It continues to execute a block of code as long as the specified condition
    is true. Here''s the syntax:


    ```javascript

    while (condition) {

    // code to be executed in each iteration

    }

    ```


    Let''s see an example of a `while` loop:


    ```javascript

    var i = 1;

    while (i <= 5) {

    console.log(i);

    i++;

    }

    ```


    In this example, the loop will iterate five times, similar to the previous `for`
    loop example.


    ### 3.2.3 The do...while Loop


    The `do...while` loop is similar to the `while` loop but guarantees that the code
    block is executed at least once before checking the condition. Here''s the syntax:


    ```javascript

    do {

    // code to be executed in each iteration

    } while (condition);

    ```


    Let''s see an example of a `do...while` loop:


    ```javascript

    var i = 1;

    do {

    console.log(i);

    i++;

    } while (i <= 5);

    ```


    In this example, the loop will iterate five times, just like the previous examples.


