    \ 的 `write()` 方法将字符串 \"Hello, World!\" 写入文件。\n\n通过对文件 I/O 操作使用适当类和方法，我们可以在 Java\
    \ 中对文件进行读写数据、操作其内容并执行各种文件相关任务。\n\n在下一章中，我们将深入另一个重要主题：泛型（Generics）。泛型允许我们创建可以处理不同数据类型的复用代码，提供类型安全并并消除对类型转换的需要。\n\
    \n# 第 8 章：泛型\n\n在之前的章节中，我们涵盖了 Java 编程的各个方面，包括变量、控制流、方法、面向对象编程 (OOP)、异常处理和文件 I/O。现在，在第\
    \ 8 章，我们将探索 Java 中的泛型概念。\n\n## 8.1 泛型简介\n\n泛型提供了一种创建处理不同数据类型的复用代码的方法。它允许我们对类型、类和方法进行参数化，提供类型安全并消除对显式类型转换的需要。\n\
    \n在 Java 中使用泛型的主要优势是：\n\n1. **类型安全**：泛型确保在编译时使用正确的类型，防止运行时出现类型错误。\n2. **代码复用性**：通过泛型，我们可以编写可用于多种数据类型的代码，提高代码的复用性并减少冗余。\n\
    3. **编译时类型检查**：编译器对泛型代码进行类型检查，在代码执行之前检测出类型相关的错误。\n\n## 8.2 泛型类的语法\n\n要定义泛型类，我们在类名后使用角括号（`<>`）来指定类型参数。类型参数可以是任何有效的标识符，通常用单个大写字母表示。\n\
    \n语法：\n\n```java\npublic class ClassName<T> {\n    // 类成员和方法\n}\n```\n\n示例：\n\n\
    ```java\npublic class Box<T> {\n    private T item;\n    public void setItem(T\
    \ item) {\n        this.item = item;\n    }\n    public T getItem() {\n      \
    \  return item;\n    }\n}\n```\n\n在上面的示例中，我们定义了一个带有类型参数 `T` 的泛型类 `Box`。`Box` 类有一个类型为\
    \ `T` 的私有成员变量 `item`。我们提供了 getter 和 setter 方法来操作 `item` 变量。\n\n## 8.3 在方法中使用泛型\n\
    \n我们可以在方法中使用泛型来创建处理不同数据类型的参数化方法。\n\n语法：\n\n```java\npublic <T> void methodName(T\
    \ parameter) {\n    // 方法体\n}\n```\n\n示例：\n\n```java\npublic <T> void printArray(T[]\
    \ array) {\n    for (T element : array) {\n        System.out.println(element);\n\
    \    }\n}\n```\n\n在上面的示例中，我们定义了一个泛型方法 `printArray`，它接受类型为 `T` 的数组作为参数。该方法遍历数组元素并将每个元素打印到控制台。\n\
    \n## 8.4 边界类型参数\n\n我们可以通过使用边界类型参数来进一步限制使用的类型。边界类型参数允许我们指定类型必须是某个类的子类或实现某个接口。\n\
    \n语法：\n\n```java\npublic class ClassName<T extends BoundType> {\n    // 类成员和方法\n\
    }\n```\n\n示例：\n\n```java\npublic class Box<T extends Number> {\n    private T\
    \ item;\n    public void setItem(T item) {\n        this.item = item;\n    }\n\
    \    public T getItem() {\n        return item;\n    }\n}\n```\n\n在上面的示例中，我们定义了一个带有类型参数\
    \ `T` 的泛型类 `Box`，该参数必须是 `Number` 的子类。\n\n## 8.5 泛型中的通配符\n\n通配符允许我们表示未知类型或类型范围。Java\
    \ 泛型中的两种通配符类型是 `?` 通配符（无边界通配符）和 `? extends Type` 通配符（边界通配符）。\n\n语法：\n\n```java\n\
    public void methodName(List<?> list) {\n    // 方法体\n}\n```\n\n示例：\n\n```java\n\
    import java.util.List;\npublic void processList(List<?> list) {\n    for (Object\
    \ element : list) {\n        System.out.println(element);\n    }\n}\n```\n\n在上面的示例中，我们定义了一个方法\
    \ `processList`，它接受带有无边界通配符 `?` 的列表。该方法可以接受任何类型的列表。\n\n## 8.6 泛型的类型推断\n\n在 Java\
    \ 7 及更高版本中，编译器可以根据方法参数推断泛型方法调用的类型参数。这种特性被称为类型推断。\n\n示例：\n\n```java\nList<String>\
    \ stringList = new ArrayList<>();\nstringList.add(\"Hello\");\nstringList.add(\"\
    World\");\nprintList(stringList); // 类型推断生效\n\npublic static void printList(List<?>\
    \ list) {\n    for (Object element : list) {\n        System.out.println(element);\n\
    \    }\n}\n```\n\n在上面的示例中，我们创建一个 `String` 对象的 `List`。当我们使用 `stringList` 参数调用 `printList`\
    \ 方法时，编译器根据参数类型自动推出类型参数 `String`。\n\n## 8.7 擦除与边界\n\nJava 使用类型擦除实现泛型，这意味着类型参数在运行时会被擦除。编译器会将类型参数替换为它们的边界类型，或者在未指定边界时替换为\
    \ `Object` 类型。\n\n示例：\n\n```java\npublic class Box<T extends Number> {\n    private\
    \ T item;\n    public void setItem(T item) {\n        this.item = item;\n    }\n\
    \    public T getItem() {\n        return item;\n    }\n}\n```\n\n"
