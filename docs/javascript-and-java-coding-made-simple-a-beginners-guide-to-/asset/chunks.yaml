    ### 11.5.1 云平台


    云平台为部署和扩展 Java Web 应用程序提供了方便的方法。`Amazon Web Services` (`AWS`)、`Microsoft Azure`
    和 `Google Cloud Platform` (`GCP`) 等供应商提供了专门为托管和管理 Web 应用程序设计的服务。


    这些云平台提供了自动伸缩、负载均衡、数据库服务以及与其他云资源轻松集成等功能。在云平台上部署 Java Web 应用程序提供了灵活性、扩展性和可靠性。


    ### 11.5.2 容器化


    容器化在部署 Web 应用程序变得日益流行。容器提供了一个轻量且隔离的运行时环境，封装了应用程序及其依赖项。`Docker` 是一个流行的容器化平台，允许开发者将应用程序打包并部署为容器。


    通过容器化，Java Web 应用程序可以轻松部署在任何支持 `Docker` 的平台上。容器提供了跨环境的一致性，并简化了部署过程，确保应用程序无论底层基础设施如何都能可靠地运行。


    ### 11.5.3 持续集成与部署 (CI/CD)


    持续集成与部署 (`CI/CD`) 实践简化了构建、测试和部署应用程序的过程。`CI/CD` 流水线自动化了从开发环境交付到生产环境所需的步骤。


    `Jenkins`、`Travis CI` 和 `GitLab CI/CD` 等工具可用于 Java Web 应用程序设置 `CI/CD` 流水线。这些工具与版本控制系统、构建工具和部署平台集成，实现了高效自动的应用程序部署。


    通过采用 `CI/CD` 实践，开发者可以确保发布更快、更可靠，减少错误风险并增强整个开发流程。


    ## 11.6 总结


    使用 Java 进行 Web 开发为创建强大且可扩展的 Web 应用程序提供了广泛的可能性。无论你选择使用 servlets、`JavaServer Pages`
    (`JSP`)、`JavaServer Faces` (`JSF`)，还是 `Spring MVC` 和 `JAX-RS` 等框架，Java 都提供了构建健壮
    Web 解决方案所需的工具和库。在本章中，我们探索了 Java 生态系统中的各种 Web 开发技术，包括 servlets、`JSP`、`JSF`、`Spring
    MVC`、`JAX-RS` 以及 `JAAS` 和 `Spring Security` 等安全框架。我们还讨论了不同的部署选项，例如 servlet 容器、应用服务器、云平台、容器化和
    `CI/CD` 实践。


    通过精通 Java Web 开发，你可以创建满足现代用户需求的动态交互 Web 应用程序。在下一章中，我们将深入数据库的世界，学习 Java 在数据存储和检索方面的能力。


    # 第 12 章：Java 数据库连接


    在当今数据驱动的世界中，存储、检索和操作数据的能力对于构建健壮且可扩展的应用程序至关重要。Java 提供了用于处理数据库的强大功能和库，允许开发者创建高效可靠的数据驱动应用程序。在本章中，我们将探索使用
    Java 进行数据库连接的世界。


    ## 12.1 数据库简介


    数据库是结构化的数据集合，经过组织和管理以便于访问、存储和检索。数据库通过提供集中且高效的数据存储和管理方式，在应用程序中起着至关重要的作用。


    有不同类型的数据库，包括关系型数据库（如 `MySQL`、`PostgreSQL` 和 `Oracle`）、NoSQL 数据库（如 `MongoDB` 和
    `Cassandra`）以及内存数据库（如 `Redis` 和 `Apache Ignite`）。每种类型都有自己的优势和适用场景。


    ## 12.2 JDBC: Java 数据库连接


    Java Database Connectivity (`JDBC`) 是连接 Java 应用程序到数据库的标准 API。它提供了一系列类和接口，允许开发者使用
    `SQL` 查询与数据库进行交互。


    `JDBC` 允许 Java 应用程序执行基本的数据库操作，如建立连接、执行查询、处理结果集和管理事务。它充当 Java 应用程序与数据库之间的桥梁，提供了访问和操作数据的标准化方法。


    ## 12.3 连接到数据库


    使用 `JDBC` 连接到数据库涉及几个步骤：


    ### 12.3.1 加载 JDBC 驱动


    在建立连接之前，必须加载特定数据库的 `JDBC` 驱动程序。驱动程序提供了连接数据库和执行查询的功能。


    在加载 `MySQL` 的 `JDBC` 驱动：


    ```java

    Class.forName("com.mysql.jdbc.Driver");

    ```


    ### 12.3.2 建立连接


    加载 `JDBC` 驱动后，需要与数据库服务器建立连接。连接需要 `URL`、`用户名` 和 `密码` 来访问数据库。


    连接到 `MySQL` 数据库的示例：


    ```java

    String url = "jdbc:mysql://localhost:3306/mydatabase";

    String username = "root";

    String password = "password";

    Connection connection = DriverManager.getConnection(url, username, password);

    ```


