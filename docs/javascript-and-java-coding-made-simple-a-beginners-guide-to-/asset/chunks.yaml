    \n# 2. 变量与数据类型\n\n在第 1 章中，我们介绍了 Java 编程的基础并探索了 Java 的重要性。在本章中，我们将深入研究变量和数据类型。理解变量及其相关的数据类型对于在程序中存储、处理和操作各种信息关重要。\n\
    \n### 2.1 什么是变量？\n\n在 Java 中，变量是一个存储了值的命名存储位置。它作为执行过程中可以修改的数据的容器。变量允许你对其赋值、获取值并对其进行操作。\n\
