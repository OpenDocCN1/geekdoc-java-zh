    \n### 7.2 事件处理器\n\n事件处理器是在响应特定事件执行的函数。我们可以将事件处理器绑定到 HTML 元素上，以定义事件发生时应该发生什么。这里有一个示例：\n\
    \n```javascript\nvar button = document.getElementById(\"myButton\");\n\nbutton.onclick\
