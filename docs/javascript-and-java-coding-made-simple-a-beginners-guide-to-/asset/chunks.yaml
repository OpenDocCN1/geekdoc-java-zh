    ### 3.2 循环语句


    循环语句允许我们多次重复一段代码块。当我们想要重复执行任务或遍历数据集合时，这些语句非常有用。JavaScript 提供了几种循环语句，包括 `for` 循环、`while`
    循环和 `do...while` 循环。


    ### 3.2.1 for 循环


    `for` 循环通常用于提前知道迭代次数。它由三个部分组成：初始化、条件和更新。其语法如下：


    ```javascript

    for (initialization; condition; update) {

    // 每次迭代时执行的代码

    }

    ```


    让我们来看一个 `for` 循环的示例：


    ```javascript

    for (var i = 1; i <= 5; i++) {

    console.log(i);

    }

    ```


    在这个示例中，循环将迭代五次，并显示数字 1 到 5。


    ### 3.2.2 while 循环


    `while` 循环用于我们提前知道确切迭代次数的情况。只要指定的条件为真，它就会继续执行代码块。其语法如下：


    ```javascript

    while (condition) {

    // 每次迭代时执行的代码

    }

    ```


    让我们来看一个 `while` 循环的示例：


    ```javascript

    var i = 1;

    while (i <= 5) {

    console.log(i);

    i++;

    }

    ```


    在这个示例中，循环将迭代五次，与之前的 `for` 循环示例类似。


    ### 3.2.3 do...while 循环


    `do...while` 循环与 `while` 循环相似，但它保证在检查条件之前至少执行一次代码块。其语法如下：


    ``````javascript

    do {

    // 每次迭代时执行的代码

    } while (condition);

    ```


    让我们来看一个 `do...while` 循环的示例：


    ```javascript

    var i = 1;

    do {

    console.log(i);

    i++;

    } while (i <= 5);

    ```


    在这个示例中，循环将迭代五次，就像之前的示例一样。


