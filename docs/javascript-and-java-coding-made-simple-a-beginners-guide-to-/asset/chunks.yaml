    \n## 6.8 抽象\n\n抽象通过仅表示基本细节并隐藏不必要的复杂性来简化系统的过程。在 Java 中，抽象是通过抽象类和接口实现的。\n\n抽象类是一种无法实例化的类，旨在供子类扩展。它可能包含抽象方法（没有实现的方法）和具体方法（具有实现的方法）。\n\
