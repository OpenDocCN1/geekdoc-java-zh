  \n输出：3\n\n### Q89. NumPy 和 SciPy 之间的区别是什么？\n\n答：在理想情况下，NumPy 只包含数组数据类型并提供最基础的操作：索引、排序、重塑、基本的元素级函数等。\n\
  \n所有的数值代码都应该位于 SciPy 中。然而，NumPy 的重要目标之一是兼容性，因此 NumPy 尝试保留任一前身支持的所有功能。\n\n因此，Num\
  \ 包含一些代数函数，尽管这些函数更属于 SciPy。在任何情况下，SciPy 都包含功能更完整的代数模块，以及许多其他数值算法。\n\n### Q90. 如何使用\
  \ NumPy/SciPy 进行 3D 绘图/可视化？\n\n\n\n\n\n答：类似于 2D 绘图，3D 图形超出了 `NumPy` 和 `SciPy` 的范围，但即使在\
  \ 2D 情况下，也存在与 `NumPy` 集成的包。`Matplotlib` 在 `mplot3d` 子包中提供了基本的 3D 绘图，而 `Mayavi` 则利用强大的\
  \ `VTK` 引擎提供了系列高质量的 3D 可视化功能。\n\n## 多选题 (MCQ) – Python 面试题\n\n### Q91. 下述哪些可以创建字典？（多选）\n\
  \na) `d = {}`\nb) `d = {“john”:40, “peter”:45}`\nc) `d = {40:”john”, 45:”peter”}`\n\
