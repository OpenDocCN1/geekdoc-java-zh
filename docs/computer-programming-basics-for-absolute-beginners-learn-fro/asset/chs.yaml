  \na) `/`\nb) `//`\nc) `%`\nd) 以上均不是\n\n答案：b) `//`\n\n当两个操作数都是整数时，python 会舍弃小数部分并提供取整值，为了获得准确的答案，请使用地板除。例如，`5/2\
  \ = 2.5` 但由于两个操作数都是整数，所以该表达式在 python 中的结果是 `2`。为了得到去掉 .5 的结果，请使用 `//` 进行地板除。因此，`5//2\
  \ = 2`。\n\n### Q93. 标识符的最大可能长度是多少？\n\na) 31 个字符\nb) 63 个字符\nc) 79 个字符\nd) 以上都不是\n\
  \n答案：d) 以上都不是\n\n标识符通常可以是任意长度。\n\n### Q94. 为什么不建议以下划线开头局部变量名？\n\na) 它们通常表示类的私有变量\n\
  b) 它们会混淆解释器\nc) 它们通常表示全局变量\nd) 它们会干扰执行\n\n答案：a) 它们通常表示类的私有变量\n\n由于 Python 没有私有变量的概念，下划线通常表示不能从类外部访问的变量。\n\
