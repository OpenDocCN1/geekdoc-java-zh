  ### Q77. 解释如何在 Django 中查找数据库。\n\n答：你将使用 `edit mysite/setting.py` 命令，它是一个传统的 Python\
  \ 模块，模块级代表 Django 设置。\n\nDjango 默认使用 `SQLite`；对于 Django 用户来说，这非常简单，从本质上不需要其他类型的安装。如果你的数据库选择不同，你只需要调整\
  \ `DATABASE` ‘default’ 项下的后续键，以匹配你的数据库连接设置。\n\n引擎（Engines）：你将通过 `django.db.backends.sqlite3`、`django.db.backeneds.mysql`、`django.db.backends.postgresql_psycopg2`、`django.db.backends.oracle`\
  \ 等更改数据库。\n\n名称（Name）：你的数据库名称。如果你使用 `SQLite` 作为数据库，那么数据库将是你计算机上的一个文件，Name 应该是完整的绝对路径，包括该文件的文件名。\n\
  \n如果你不选择 `SQLite` 作为数据库，则必须添加 `Password`（密码）、`Host`（主机）、`User`（用户）等设置。\n\nDjango\
  \ 使用 `SQLite` 作为默认数据库，它将数据存储为文件系统中的。如果你有一个数据库服务器——`PostgreSQL`、`MySQL`、`Oracle`、`MSSQL`\
  \ 并想用它代替 `SQLite`，请使用你的数据库管理工具为 Django 项目创建一个数据库。无论何种方式，配合你本地的（空）数据库，仍然需要告知 Django\
  \ 如何使用。这通常是项目 `settings.py` 文件的用场。\n\n我们将在 `setting.py` 文件中添加以下代码：\n\n![](img/Image00050.jpg)\n\
  \n### Q78. 举例说明如何在 Django 中编写一个 VIEW（视图）？\n\n答：这通常是我们在 Django 中编写视图的方式：\n\n```python1.\
