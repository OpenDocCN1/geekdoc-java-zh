- "# 零基础初学者计算机编程基础：从基础到高级学习 Python、Php、C++、C#、Html 和 Css、Java、Javascript、SQL 的快速进阶指南\n\
  \n\n\n![](img/cover1.jpeg)\n\n\n\n![](img/Image00000.jpg)\n\n\n## 引言\n《高级 JAVA 与\
  \ PYTHON》一书完全关于 Java 和 Python 的面试题。Java 是由 James Gosling 在 Sun Microsystems（Sun）于\
  \ 1991 年创建的编程语言。Java 的目标是编写一次程序，然后在多个操作系统上运行该程序。Java 的第一个公开版本（`Java 1.0`）于 1995\
  \ 年发布……现在 Oracle 接管了 Java 的主权。Python 是一种广泛使用的通用高级编程语言。它由 Guido van Rossum 于 1991\
  \ 年创建，并由 Python 软件基金会进一步开发。它的设计强调代码的可读性，其语法允许程序员用更少的代码行表达他们的概念。\n\n## Java\n我们实际上整理了一份最常问的\
  \ Java 面试题及答案，这将帮助你准备好面试官在面试过程中可能提出的基础 Java 面试问题。在这些基础 Java 面试题列表中，我们涵盖了所有高频的基础和创新性\
  \ Core Java 面试题，并提供了详尽的解决方案以帮助你通过工作面试。\n\n以下清单包含了 100 道面向面试者的重要 Core Java 面试题，以及面向资深程序员的\
  \ Java 面试题和答案，帮助他们准备面试。这份全面的 Java 编程面试题指南将帮助你顺利通过工作面试（2021 年）。\n\n## 100 道常用 Java\
  \ 面试题及答案\n### 面针对新手和经验丰富者的 Core Java 面试题及答案\n\n**Q1\\.内部类（Inner Class）和子类（Sub-Class）有什么区别？**\n\
  答：内部类是嵌套在另一个类中的类。内部类拥有其嵌套的类的访问权限，并且它可以访问外部类中定义的所有方法和变量。\n\n子类是继承自一个称为父类的类。子类可以访问其父类中所有受保护和公共的方法以及区域。\n\
  \n**Q2\\. Java 类中有哪些访问修饰符？**\n答：在 Java 中，访问修饰符是类名之前使用的关键短语，用于定义访问范围。类的访问修饰符类型有：\n\
  \n1. `Public`（公共）：类、`方法`、`字段`可以从任何地方访问。\n2. `Protected`（保护）：**方法`、`字段`可以从所属的类或其子类，以及来自相同包的类访问，但不能从外部访问。\n\
  3. `Default`（默认）：`方法`、`字段`、`类`只能从同一个包访问，不能从其原生包之外访问。\n4. `Private`（私有）：`方法`、`字段`只能从所属的同一个类访问。\n\
  \n**Q3\\.静态方法（Static methods）和静态变量（static variables）的作用是什么？**\n答：当需要在类的多个对象之间共享方法或变量，而不是为每个项目创建不同的副本时，我们使用\
  \ `static` 关键字来使方法或变量对所有对象共享。\n\n**Q4\\.什么是数据封装？它有什么意义？**\n答：封装是面向对象编程中的一个概念，将数据和方法整合到一个单一系统中。\n\
  \n封装帮助开发人员遵循软件开发的模块化方法，因为每个对象都有自己的方法和变量，并提供独立于其他各种对象的功能。封装还提供了信息隐藏的目标。\n\n**Q5\\\
  .什么是单例类（singleton class）？请提供一个合理的使用示例。**\n答：`java` 中的单例类只能有一个实例，因此它的所有变量和方法都来自这一个实例。单例类原则适用于需要限制类实例数量的情况。\n\
  \n由于任何类型的许可问题，单例使用场景的最佳示例是由于某些驱动限制，限制对数据库的唯一连接时。\n\n**Q6\\.Java 中的循环（Loops）是什么？有三种类型的循环？**\n\
  答：循环在程序中用于重复执行一个声明或语句块。Java 中有 3 种循环：\n\n1) `For 循环`\n`for` 循环用于 Java 用于按指定的次数重复执行声明。当程序员知道执行声明的次数时，使用\
  \ `for` 循环。\n\n2) `While 循环`\n当某些语句需要重复执行直到满足条件时，使用 `while` 循环。在 `while` 循环中，在执行语句之前会检查条件。\n\
  \n3) `Do While 循环`\n`do while` 循环与 `while` 循环相同，区别仅在于是在执行语句后检查条件。\n\n\n\n\n使用 `Math.random()`，你可以创建大于或等于\
  \ 0.1 且小于 1.0 的随机数。\n\n利用 `java.util` 包中的 `Random` 类。\n\n### Q13. 什么是默认实例？请提供一个实例。\n\
  \n答：在 `switch` 语句中，当没有其他分支情况匹配时，会执行 `default` 情况。一旦所有其他不同的 `switch` 实例都已编写完毕，`Default`\
  \ 情况是一个可选的分支。它只能被声明。\n\n在下面的实例中，当 `score` 不为 1 或 2 时，会使用 `default` 情况。\n\n![](img/Image00005.jpg)\n\
  \n### Q14. Java 中所有类派生的基类是什么？\n\n答：`java.lang.object`。\n\n### Q15. Java 中的 `main()`\
  \ 方法可以返回任何数据吗？\n\n答：在 Java 中，`main()` 方法不能返回任何信息，正因如此，它始终被声明为 void 返回类型。\n\n###\
  \ Q16. 什么是 Java 包（Packages）？包（bundles）有什么意义？\n\n答：在 Java 中，`package` 是类和接口的集合，它们因为属于不同的其他实体而被打包在一起。使用包有助于设计人员将代码模块化，并为团队进行代码组织以便适当复用。一旦代码被封装在包中，就可以在其他不同的类中导入并使用。\n\
  \n### Q17. 可以在没有任何抽象方法的情况下将一个类声明为抽象（Abstract）吗？\n\n答：是的，我们可以通过在类名之前使用 `abstract`\
  \ 关键字开发一个 `abstract` 类，即使它没有任何类型的抽象方法。然而，如果一个类包含一个抽象方法，它必须被声明为 `abstract`，否则会报错。\n\
  \n### Q18. Java 中抽象类（Abstract Course）和接口（Interface）之间的区别是什么？\n\n答：抽象类和用户接口之间的主要区别在于，`interface`\
  \ 只能有 `public static` 方法的声明而没有具体实现，而抽象类可以具有任何访问修饰符（`public`、`private` 等）的成员，并且可以有也可以没有具体执行。\n\
  \n使用抽象类和用户接口的另一个关键区别是，实现 `interface` 的类必须执行 `interface` 中的所有方法，而继承自抽象类的类并不要求实现其父类中的所有方法。\n\
  \n一个类可以应用多个接口，但它只能继承一个抽象类。\n\n### Q19. 接口相对于抽象类在效率方面有什么影响？\n\n答：与抽象类相比，接口的效率较低，因为接口需要额外的间接层。开发者需要考虑的另一个重要变量是，任何类型的类只能扩展一个抽象类，而一个类可以执行许多用户接口。\n\
  \n使用用户接口还给开发人员增加了额外负担，因为在类中任何时候执行用户接口时，程序员都被迫执行用户接口的每一个方法。\n\n### Q20. 在 Java 中导入一个包会同时导入它的子包吗？\n\
  \n答：在 Java 中，当导入一个包时，它的子包不会被导入，如果需要，设计人员需要独立地导入它们。\n\n如果设计人员导入了包包 `college.*`，则名为\
  \ `college` 的包中的所有类都会被加载，但子包中的任何类都不会被加载。要加载其子包中的类（例如 `department`），设计师必须显式地导入它，格式如下：\n\
  \n### Q21. 我们可以将类的主要方法声明为私有（personal）吗？\n\n答：在 Java 中，`main` 方法需要是 `public static`\
  \ 才能正确运行任何应用程序。如果 `main` 方法被声明为 `private`，开发者不会得到任何编译错误，但它将无法执行，并且会产生运行时错误。\n\n\
  ### Q22. 我们具体如何通过引用而不是通过值向特征传递参数？\n\n答：在 Java 中，我们只能通过值向函数传递参数，而不能通过引用。\n\n### Q23.\
  \ 对象在 Java 中是如何被序列化的？\n\n答：在 Java 中，为了通过序列化将项直接转换为字节流，类应用了名为 `Serializable` 的接口。所有实现\
  \ `Serializable` 接口的类对象都会被序列化，其状态会被保存在字节流中。\n\n### Q24. 我们应该什么时候使用序列化？\n\n答：当数据需要通过网络发送时使用序列化。利用序列化，对象的状态被保存并转换为字节流。字节流通过网络传输，并在位置重建对象。\n\
  \n### Q25. 在 Java 中，为了处理异常，`Try` 块必须与 `Catch` 块连用吗？\n\n答：`try` 块要求与 `catch` 块或 `finally`\
  \ 块或两者都连用。从 `try` 块抛出的任何异常都需要在 `catch` 块中捕获，否则代码中止前需要执行任何详细工作将放在 `finally` 块中。\n\
  \n### Q26. 即使在异常块中发生了异常，是否存在方法可以跳过 `Finally` 块？\n\n答：如果在 `try` 块中增加异常，控制将传递到 `catch`\
  \ 块（如果存在），否则传递到 `finally` 块。发生异常时该块总是会被执行，避免 `finally` 块中任何类型声明执行的唯一方法是在 `try` 块末尾通过符合规范的代码行强制终止代码：\n\
  \n![](img/Image00006.jpg)\n\n### Q27. 类的构造函数（builder）何时被调用？\n\n答：每当使用新关键字开发一个项时，类的构造函数就会被实例化。\n\
  \n例如，在以下类中，使用新关键字开发了两个项。\n\n![](img/Image00007.jpg)\n\n### Q28. 类可以有多个构造函数吗？\n\n\
  答：是的，一个类可以有多个构造函数。使用哪一个取决于传递的参数。\n\n### Q29. 我们可以重写类的静态方法吗？\n\n答：我们不能重写静态方法。静态方法来自类而不是单个项，并且在编译时（而不是运行时）进行处理的。即使我们尝试重写静态方法，也不会得到编译错误，在运行代码时也不会有重写效果。\n\
