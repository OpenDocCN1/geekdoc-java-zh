  5. now = datetime.datetime.now()\n6. html = \"&amp;lt;html&amp;gt;&amp;lt;body&amp;gt;It\
  \ is now %s&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt; now known\n7. return HttpResponse(html)\n\
  ```\n\n作为 HTML 文档返回当前的日期和时间。\n\n### Q79. 提到 Django 模板中包含的内容。\n\n答：模板可以是一个简单的文档。它可以创建任何文本格式，如\
  \ `XML`、`CSV`、`HTML` 等。模板包含变量，这些变量在模板评估时会被替换，以及控制模板逻辑的标签（`% tag %`）。\n\n图：Python\
  \ 面试题 – Django 模板\n\n![](img/Image00051.jpg)\n\n### Q80. 解释 Django 框架中 session（会话）的用途？\n\
  \n答：Django 提供了一种 session，允许你根据每个网站访问者存储和检索数据。Django 通过在客户端放置 session ID cookie 将所有相关数据存储在服务器端，抽象了发送和接收\
  \ cookie 方法。\n\n![](img/Image00052.jpg)\n\n图：Python 面试题 – Django 框架\n\n因此数据本身不存储在客户端。这从安全角度来看通常是好的。\n\
  \n### Q81. 列出 Django 中的继承样式。\n\n答：在 Django 中，有三种可能的继承样式：\n\n- **抽象基类（Abstract Base\
  \ Classes）**：当你只需要父类携带信息，而不想在每个子模型中重复输入它时，使用这种样式。\n- **多表继承（Multi-table Inheritance）**：如果你正在对现有模型进行子类化，并希望每个模型拥有自己的数据库表，则使用这种样式。\n\
  - **代理模型（Proxy models）**：如果你只想切换模型的 Python 层行为，而不改变模型的字段，则使用这种模型。\n\n网络爬虫 – Python\
  \ 面试题\n\n### Q82. 在已知图片 URL 地址的情况下如何使用 Python 将其保存到本地？\n\n答：我们将使用以下代码从 URL 地址保存大量图片到本地\n\
  \n![](img/Image00053.jpg)\n\n### Q83. 如何获取任何 URL 或网页页的 Google 缓存年龄？\n\n答：使用以下 URL\
  \ 格式：\n\n`http://webcache.googleusercontent.com/search?q=cache:URLGOESHERE`\n\n\
  确保将 `URLGOESHERE` 替换为你想要检索并查看缓存时间的页面或网站的正确网页地址。例如，查看 `edureka.co` 的 Google 网页缓存年龄，你将使用以下\
  \ URL：\n\n`http://webcache.googleusercontent.com/search?q=cache:edureka.co`\n\n\
  ### Q84. 要求从某个 URL 页面爬取数据。它应该包含电影名称、年份和评分。\n\n答：我们将使用以下代码从 URL 爬取数据：\n\n```python\n\
  1. from bs4 import BeautifulSoup\n2. import requests\n3. import sys\n4. url = 'http://www.imdb.com/chart/top'\n\
  5. response = requests.get(url)\n6. soup = BeautifulSoup(response.text)\n7. tr =\
  \ soup.findChildren(\"tr\")\n8. tr = iter(tr)\n9. next(tr)\n10. for movie in tr:\n\
  11. title = movie.find('td', {'class': 'titleColumn'} ).find('a').contents[0]\n\
  12. year = movie.find('td', {'class': 'titleColumn'} ).find('span', {'class': 'secondaryInfo'}).contents[0]\n\
  13. rating = movie.find('td', {'class': 'ratingColumn imdbRating'} ).find('strong').contents[0]\n\
  14. row = title + ' - ' + year + ' ' + rating\n15. print(row)\n```\n\n上述代码将帮助从 IMDb\
  \ 250 获取数据\n\n数据分析 – Python 面试题\n\n### Q85. Python 中的 map 函数是什么？\n\n答：map 函数通过在第二个参数的可迭代对象上执行给定的函数。如果给定的函数接受超过\
