    b) 它们会混淆解释器

    c) 它们通常表示全局变量

    d) 它们会干扰执行


    答案：a) 它们通常表示类的私有变量


    由于 Python 没有私有变量的概念，下划线通常表示不能从类外部访问的变量。


    ### Q95. 下述哪个是无效语句？


    a) `abc = 1,000,000`

    b) `a b c = 1000 2000 3000`

    c) `a,b,c = 1000, 2000, 3000`

    d) `a_b_c = 1,000,000`


    答案：b) `a b c = 1000 2000 3000`


    变量名中不允许包含空格。


