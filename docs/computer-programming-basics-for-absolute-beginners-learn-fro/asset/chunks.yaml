    ### Q55. 用示例解释 Python 中的继承。


    答：继承允许一个类实现另一个类的所有成员（例如属性和方法）。继承提供了代码重用性，使得构建和维护应用程序更容易。继承的类被称为基类，而被继承的类被称为派生类。


    Python 支持的不同继承类型有：


    - 单继承——派生类获取一个基类的成员。

    - 多级继承——派生类 `d1` 继承自 `base1`，`d2` 继承自 `base2`。

    - 层继承——从一个基类继承任意数量的子类。

    - 多继承——派生类继承自多个基类。


