    `StringBuffer` 始终是一个极佳的选择。对于每次数据转换，都会产生一个新的 `String` 对象，如果在这种情况下使用 `String`，将会产生额外的开销。


    ### Q39. 在每个切换语句实例中使用 Break 的作用是什么？

