    ### Q25\. what''s the difference between `range` & `xrange`?


    Ans: For the foremost part, `xrange` and `range` are the precise same in terms
    of functionality. They both provide how to get an inventory of integers for you
    to use, however you please. the sole difference is that `range` returns a Python
    list object and `xrange` returns an `xrange` object.


    This means that `xrange` doesn’t actually generate a static list at run-time like
    `range` does. It creates the values as you would like them with a special technique
    called `yielding`. this system is employed with a kind of object referred to as
    `generators`. meaning that if you''ve got a very gigantic `range` you’d wish to
    generate an inventory for, say one billion, `xrange` is that function to use.


    This is very true if you''ve got a very memory sensitive system like a telephone
    that you simply are working with, as `range` will use the maximum amount memory
    because it can to make your array of integers, which may end in a Memory Error
    and crash your program. It’s a memory hungry beast.


