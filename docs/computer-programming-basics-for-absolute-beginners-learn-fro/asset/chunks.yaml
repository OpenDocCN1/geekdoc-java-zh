    ### Q58. Python 支持多继承吗？


    答：多继承意味着一个类通常继承自多个父类。Python 支持多继承，与 Java 不同。


    ### Q59. Python 中的多态是什么？


    答：多态意味着具有多种形式。例如，如果父类有一个名为 `ABC` 的方法，那么子类也可以有一个具有相同名称 `ABC` 的方法，拥有它们自己的参数和变量。Python
    允许多态。


