    ### Q73. 是否可以在 Java 类中指定一个方法，但在另一种语言（如 C）中提供它的实现？


    答：可以，我们可以通过原生方法（native methods）来实现。在基于原生方法的扩展的情况下，我们在 Java 类中定义 `public static`
    方法但不包含其实现，之后在 C 等另一种语言中独立地执行实现。


    ### Q74. Java 中是如何指定析构函数的？


    答：在 Java 中，类中没有指定的析构函数，因为没有这种要求。当对象不再被引用时，Java 有它自己的垃圾回收机制来处理工作。


    ### Q75. 变量可以既是静态的又是局部的？


    答：不可以，变量不能既是静态的又是局部。将局部变量定义为静态会导致错误。


    ### Q76. 接口可以拥有静态方法吗？


    答：静态方法无法在类中被重写，而接口中的任何方法默认都是抽象的，并期望在类中执行。因此，在接口中有静态方法是没有意义的。


    ### Q77. 在接口类中，我们可以更改接口定义变量的值吗？


    答：不可以，我们无法更改接口变量的值，因为接口中的所有变量默认都是 public、final 和 static，即常量。


    ### Q78. 是否认为由于 Java 的垃圾属性，Java 程序永远不会内存溢出？


    答：虽然 Java 提供了自动回收，但它不能确保 Java 程序永远不会溢出，因为 Java 对象的创建速度可能快于回收速度，导致可用内存资源耗尽。


    垃圾回收有助于减少内存溢出的概率，但不能保证这一点。


    ### Q79. 主方法可以除 void 以外的其他返回类型吗？


    答：不可以，Java 类的主方法只能有 `void` 返回类型以便程序有效执行。如果你必须在主方法结束时返回值，可以使用 `System.exit(int
    status)`。


    ### Q80. 一旦被垃圾回收，我想使用一个对象并重新访问。这可行吗？


    答：当对象实际上被垃圾回收销毁后，它不再存在于栈中，无法再次访问。


    ### Q81. 在 Java 接口中，哪个方法是所有线程必须实现的应用？


    答：`Run()` 是 `Runnable` 接口的方法，所有线程都必须执行它。


