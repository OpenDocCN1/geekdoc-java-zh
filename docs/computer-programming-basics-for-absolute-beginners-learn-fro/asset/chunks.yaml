    ### Q84. 我希望我的类被开发成这样：即任何其他类（包括继承的类）都无法产生它的东西。我该如何做？


    答：如果我们将一个类的构造方法声明为 `exclusive`（私有的），它将不会被任何其他类访问，由于这个原因，其他任何类都无法实例化它，其对象的创建也将仅限于其自身。


    ### Q85. 对象在 Java 中是如何保存的？


    答：在 Java 中，每个对象在开发时都会从 `heap`（堆）中获得一个内存空间。当一个对象被垃圾回收器回收时，分配给它的内存区域将被重新分配到堆，并供任何类型的新对象使用。


    ### Q86. 我们如何发现堆上对象的真实大小？


