    ### Q44. Python 的内置排序有哪些？


    答：Python 中的内置类型如下——


    - 整数

    - 浮点数

    - 复数

    - 字符串

    - 布尔值


    ### 内置函数


    ### Q45. NumPy 数组相比于（嵌套）Python 列表有哪些优势？


    答：


    Python 列表是高效的通用型容器。它们支持（相当）高效的插入、删除、追加和拼接，而且 Python 的列表推导式使得它们易于构建和操作。


    它们也有某些局限性：它们不支持“向量化”操作（如元素级加法和乘法），因此它们包含不同类型对象的这一不可否认的事实意味着 Python 必须为每个元素存储类型信息，并在操作每个元素时必须执行类型分发代码。


    NumPy 不仅更高效，而且更方便。你可以免费获得大量的向量和矩阵操作，这有时允许人们避免不必要的工作，而且它们也是经过高效实现的。


    NumPy 数组速度更快，而且 NumPy 内置了许多功能，如 FFT、卷积、快速搜索、基础统计、代代数、直方图等。


    ### Q46. 向 Python 数组添加值的方法是什么？


    答：通常使用 `append()`、`extend()` 和 `insert(i,x)` 函数将元素添加到数组中。


    示例：


    ![](img/Image00036.jpg)


    输出：


    ```

    array(‘d’, [1.1, 2.1, 3.1, 3.4])

    array(‘d’, [1.1, 2.1, 3.1, 3.4, 4.5, 6.3, 6.8])

    array(‘d’, [1.1, 2.1, 3.8, 3.1, 3.4, 4.5, 6.3, 6.8])

    ```


    ### Q47. 从 Python 数组中移除值的方法是什么？


    答：通常使用 `pop()` 或 `remove()` 方法移除数组元素。这两个函数之间的区别在于前者返回被删除的值，而后者不返回。


    示例：


    ![](img/Image00037.jpg)


    输出：


    ```

    4.6

    3.1

    array(‘d’, [2.2, 3.8, 3.7, 1.2])

    ```


    ### Q48. Python 有面向对象编程的概念吗？


    答：Python 是一种面向对象的编程语言。这意味着任何程序通常都可以通过创建对象模型在 Python 中解决。然而，Python 也被视为过程化和结构化语言。


    ### Q49. 深拷贝（deep copy）和浅拷贝（shallow copy）之间有什么区别？


    答：当创建一个替换实例类型时使用浅拷贝，它保留了在新实例内复制的值。浅拷贝用于复制引用指针，有点像复制了值一样。这些引用指向第一个对象，因此对该类别中任何成员的更改也将会影响它的第一个拷贝。浅拷贝允许程序执行得更快，它取决于所用信息的维度。


    深拷贝用于存储已经复制的值。深拷贝不会复制指向对象的引用提示。它针对对象进行操作，因此被另一个对象指向的新对象会被存储下来。原始拷贝内部的更改不会影响使用该对象的另一个拷贝。由于确保了每个被调用的对象进行拷贝，深拷贝使得程序的执行速度变慢。


    ### Q50. Python 中如何实现多线程？


    答：


    Python 拥有多线程包，但如果你想通过多线程来加速代码，那么使用它通常不是一个明智的主意。


    Python 有一个名为全局解释器锁（`GIL`）的结构。`GIL` 确保在任何时候只有一个“线程”可以执行。一个线程获取 `GIL`，执行少量工作，然后将
    `GIL` 传递给后续线程。


    这种情况发生得非常快，因此在人类看来，你的线程似乎正在并行执行，但它们实际上只是在轮替使用等效的 CPU 核心。


    所有这些 `GIL` 的传递给执行增加了开销。这意味着如果你想让你的代码运行得更快，那么使用 `threading` 包通常不是一个明智的主意。


    ### Q51. Python 中编译和链接的方法是什么？


    答：编译和链接允许新扩展在无错误的情况下正确编译，因此链接通常在通过编译后的过程时进行。如果使用了动态加载，则取决于提供给系统的设计。Python 解释器通常不提供配置设置文件的动态加载，并且可以重新构建解释器。


    在此过程中所需的步骤如下：


    1. 创建一个任意名称且使用你系统编译器支持的任何语言编写的文件。作为示例文件：`file.c` 或 `file.cpp`。

    2. 将此文件放入正在使用的发行版的 `Modules/` 目录。

    3. 在 `Modules/` 目录下的 `Setup.local` 文件中添加一行。

    4. 使用 `spam file.o` 运行文件。

    5. 成功运行此后，在顶层目录上使用 `make` 命令重新构建解释器。

    6. 如果修改了文件，使用命令 `make Makefile` 运行 `rebuildMakefile`。


    ### Q52. 什么是 Python 库？列举几个。


    Python 库是一组 Python 包。许多常用的 Python 库包括：`Numpy`、`Pandas`、`Matplotlib`、`Scikit-learn`
    等非常多。


