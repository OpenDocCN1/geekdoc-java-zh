    `Random` 类在使用和实例化时会创建多个独立的随机数生成器。


    # Python 面试题


    ### Q25\. `range` 和 `xrange` 之间有什么区别？


    答：首先，在功能方面，`xrange` 和 `range` 是完全相同的。它们都为你提供一个整数序列供你随心使用。它们唯一的区别在于 `range` 返回一个
    Python 列表对象，而 `xrange` 返回的是一个 `xrange` 对象。


    这意味着 `xrange` 实际上不会像 `range` 那样在运行时生成一个静态列表。它通过一种名为 `yielding`（产生）的特殊技术按需需要创建值。这种系统被应用于称为“生成器”（`generators`）的对象。这意味着如果你需要生成一个巨大的
    `range` 序列（比如十亿个），`xrange` 是你应该使用的函数。


    如果你正在处理一个像电话这样对内存非常敏感的系统，这一点非常重要，因为 `range` 会尽可能使用最大内存来创建整数数组，这可能导致内存溢出（Memory
    Error）并导致你的程序。它是一个内存大怪兽。


    ### Q26\. 在 Python 中如何写注释？


    答：Python 中的注释以 `#` 字符开头。然而，有时也可以使用 `docstrings`（用三引号括的字符串）来完成注释。


    > 示例：


    ```python

    # Python 中的注释像这样开头

    print("Comments in Python start with a #")

    ```

    输出：Comments in Python start with a #


    ### Q27\. 什么是 pickling（序列化）和 unpickling（反序列化）？


    答：`Pickle` 模块接受任何 Python 对象并将其转换为字符串表示，通过使用 `dump` 函数将其写入文件，这个过程被称为序列化（pickling）。而从存储的字符串表示中检索原始
    Python 对象的方法被称为反序列化（unpickling）。


    ### Q28\. Python 中的生成器（generators）是什么？


    答：返回可迭代集合的函数被称为生成器（`generators`）。


    ### Q29\. 如何将字符串的首字母大写写？


    答：在 Python 中，`capitalize()` 方法会将字符串的首字母大写写。如果字符串开头已经是大写字母，则它返回原字符串。


    ### Q30\. 如何将字符串转换为全小写或部分小写？


    答：要将字符串转换为小写，通常使用 `lower()` 函数。


    示例：


    ![](img/Image0031.jpg)


    输出：abcd


    ### Q31\. 在 Python 中如何进行多行注释？


    答：多行注释出现在多行中。所有需要注释的行都必须以 `#` 开头。你还有一个非常棒的快捷方法来对多行注释：你只需要按住 `ctrl` 键，在每个想要插入 `#`
    字符的地方左键单击，然后输入一次 `#`。这可能会注释你放置光标所在的所有行。


    ### Q32. Python 中的 docstrings 是什么？


    答：`docstrings` 实际上不是注释，而是它们是文档字符串。这些 `docstrings` 位于三引号之内。它们没有被赋值给任何变量，因此，有时也起到注释的作用。


    **示例：**


    ![](img/Image00032.jpg)


    输出：2.0


    ### Q33\. `is`、`not` 和 `in` 操作符目的是什么？


    答：运算符是特殊的函数。它们接受一个或多个值并产生相应的结果。


    `is`：当两个操作数都为真时返回真（例如：“a” is ''a''）

    `not`：返回布尔值的反反

    `in`：检查某些元素是否存在于某些序列中


    ### Q34\. Python 中 `help()` 和 `dir()` 函数的作用是什么？


    答：`Help()` 和 `dir()` 函数都可以从 Python 解释器访问，用于查看内置函数的汇总导出。


    `Help()` 函数：`help()` 函数用于显示文档字符串，并帮助你确定与模块、关键字、属性等相关的帮助信息。


    `Dir()` 函数：`dir()` 函数用于显示定义的符号。


    ### Q35\. 每当 Python 退出时，为什么所有内存都没有被释放？


    答：

    每当 Python 退出时，特别是那些与其他对象存在循环引用的 模块，或者从全局命名空间引用的对象，并不总是会被释放或回收。


    释放由 C 库保留的那些内存部分是不可能的。


    在退出时，由于其拥有高效的清理机制，Python 会尝试释放/销毁所有其他对象。


    ### Q36\. Python 中的字典（dictionary）是什么？


    答：Python 中的内置数据类型名为字典（`dictionary`）。它定义了键和值之间的一一关系。字典包含键及其对应值的对。字典通过键进行索引。


    举个例子：

    以下示例包含了一些键：国家、首都和总理。它们对应的值分别是印度、德里和莫迪。


    ![](img/Image00033.jpg)


    ### Q37\. 如何在 Python 中利用三元运算符？


    答：三元运算符用于显示条件语句。


    语法：

    `[on_true] if [expression] else [on_false]`


    示例：

    `x, y = 25, 50`

    `big = x if x < y else y`


    ### Q38\. `*args`, `**kwargs` 意味着什么？为什么要使用它们？


    答：当我们不确定会有多少参数传递给函数，或者如果我们想传递存储的参数列表或元组时，我们会使用 `*args`。`**kwargs` 用于不确定会有多少关键字参数传递给函数，或者它经常用于将字典的值作为关键字传递。标识符
    `args` 和 `kwargs` 是一种约定，你也可以使用 `*bob` 和 `**billy`，但那可能并不明智。


    ### Q39\. `len()` 是做什么的？


    答：它用于确定字符串、列表、数组等的长度。


    示例：


    ![](img/Image00034.jpg)


    ### Q40\.解释 Python 中 `re` 模块的 `split()`、`sub()`、`subn()` 方法。


    答：为了替换字符串，Python 的 `re` 模块提供了 3 方法。它们是：


    `split()` – 使用正则表达式将给定字符串“分割”为一个序列。


    `sub()` – 查找所有匹配正则表达式的子字符串，然后将其替换为特殊字符串。


    `subn()` – 它和 `sub()` 相似，但还会返回新字符串以及替换次数。


