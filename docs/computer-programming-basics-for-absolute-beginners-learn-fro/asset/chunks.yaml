    答：JDK 是 Java 的开发工具包，在开发时需要它，但要在机器上运行 Java 程序，不需要 JDK。只需要 JRE。


    ### Q72. equals() 方法的比较与 == 运算符比较的区别是什么？


    答：在 Java 中，`equals()` 方法用于比较两个字符串对象的内容，如果两者都具有相同的值则返回 true；而 `==` 运算符比较的是两个字符串对象的引用。


    在拷贝的代码中，`equals()` 返回 true，因为两个字符串具有相同的值。然而，`==` 运算符返回 false，因为两个字符串引用的是不同的对象：


