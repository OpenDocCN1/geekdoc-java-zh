  md: '# CHAPTER 11

    Packaging and Deployment


    The thought occurred to me, as I waited around that day,

    that it would be easier to lift my trailer up and, without

    any of its contents being touched, put it on the ship.


    > —Malcom McLean


    Malcom McLean had an idea in 1937 that would lead to his legacy as the "father
    of containerization." It came to him while waiting in Hoboken for cotton bales
    he had delivered to be loaded for transport oversees. It wasn''t until 1956 that
    McLean developed the metal shipping container, which greatly simplified cargo
    handling and revolutionized the shipping industry. Innovations in packaging lead
    to efficiencies in shipping. technology, deployment and distribution of applications
    is analogous to shipping. Java provides standardized packaging, which is foundational
    to the distribution of code and deployment of applications.


    # Java and JEE Packaging


    Java packaging formats are fundamental building blocks in JEE applications. They
    are also used in more recent deployment processes that do not adhere strictly
    to the JEE specification.


    Java developers initially develop code outside of deployment packages. A Java
    class corresponds with a file on the operating system. Confusing enough, a Java
    package is not really related to packaging but instead is a namespace that reflects
    the path from an application root to a directory where a class resides. It is
    rare to encounter classes and packages on their own outside of a programmer''s
    development environment. An application or module is compressed and packaged as
    a unit before it is deployed to a production environment or end user.


    The Java Archive (JAR) file is used to bundle Java class files and related resources
    into a single archive. JAR files are compressed using a ZIP file format and include
    a manifest'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'file with path name of META-INF/MANIFEST.MF. They can be created the jar utility
    included in the JDK. At its simplest, a JAR is a .zip file with a few characteristics
    defined in its META-INF directory.


    JARs are not JEE-specific. They are part of standard JDKs and their specification
    is included in the JDK documentation. JEE does describe special usages of JAR
    files. Application client modules and EJB modules are packaged as JARs. All other
    JEE packaging formats are based on the JAR format as well. In fact, the JEE-specific
    formats are JAR files with a file extension to their function and contents. JEE
    archives can be created manually but are more often assembled using tools like
    Ant, Maven, or Gradle.


    A web module is the smallest deployable unit in the JEE world. A module contains
    web components and resources, primarily static content. A web module can be packaged
    into a web archive or WAR. A WAR includes a /WEB-INF directory that contains a
    named web.xml file defines the structure of the web application and references
    other assets included in the archive. WARs are very flexible and can be deployed
    to a web container that supports a relatively small subset of the JEE specification.


    Popular web containers include Tomcat and Jetty. Web container development tends
    to precede definition of technologies in the JEE specification, and significantly
    different sets of features are available in each one.


    An enterprise archive, or EAR file, contains WAR files, JAR files, and an application.xml
    defines modules and security rules. As suggested by the name, EARs are intended
    for enterprise applications. EARs must be deployed to an application server, which
    supports a greater portion of the JEE specification than a web container. They
    cannot be run on a web container because they require EJB support and other services.
    Application servers include JBoss, IBM’s WebSphere, and Oracle’s WebLogic Server.


    A less familiar archive for the sake of completeness is the resource adapter module
    (RAR). This type of archive is used to allow connectivity to an Enterprise Information
    System (EIS). An EIS is typically a legacy system such as an ERP, Main-Frame,
    Queue, or other service. A RAR’s purpose is similar to that of a JDBC system but
    it is not limited to JDBC driver to accessing relational databases. See Table
    11-1 for a list with related file extensions.'
