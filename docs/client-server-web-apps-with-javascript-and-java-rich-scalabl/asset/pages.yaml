  md: 'The implications of this console not being defined are more a mere curiosity,
    not the least of which console.log is not available in certain versions of Microsoft''s
    Internet Explorer and consequently, unexpected errors can occur. Many of the challenges
    and problems associated with the JavaScript programming language are the fault
    of the execution environment (which is often a web browser). The DOM is a cross-platform,
    language-independent means of referencing and manipulating HTML elements. It is
    not part of the JavaScript language itself.


    Back to the Hello World example itself: you might have noticed that single quotes
    were used instead of double quotes and that there was no trailing semicolon. JavaScript
    syntax is forgiving (or ambiguous, if you prefer). There have been a number of
    ways to reduce confusion in this area. A "strict" mode was created to enforce
    the language. Utilities like Douglas Crockford''s JSLint were created to ensure
    the "good parts" of the JavaScript language. His book on the subject provides
    in-depth coverage. Suffice to say, JavaScript has a number of leniencies that
    can result in an undisciplined developer or team causing difficult-to-debug problems.
    It is worth the time to learn the language well enough to adopt conventions and
    practices that avoid these problems.


    # File system organization


    The file and directory structure of a Java project are directly linked to the
    structure of the code. A file generally contains a single (public) class with
    the same name as the file. The file exists in a directory that reflects the package
    name associated with the class. (There are a few other rules and exceptions to
    inner classes, access modifiers, and other constructs, but it is clear that file
    and directory structures will follow similar structures across Java projects.)
    At times, these restrictions can be an inconvenience (especially in small applications).
    As a project grows, it provides an clear indication of the general scope and organization
    of the code base. A glance at the file system makes it immediately evident when
    a project is disorganized without ever opening a file.


    JavaScript enforces no restrictions. There is no necessary connection between
    file or directory structures. And, you need to give particular attention to the
    organization of your code as a project grows, and will likely need to invest in
    refactoring it if a larger development team is involved. Alex McCaw explains this
    well in JavaScript Web Applications (O''Reilly):'
