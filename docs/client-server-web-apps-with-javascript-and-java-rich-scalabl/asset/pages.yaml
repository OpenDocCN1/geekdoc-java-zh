    approaches that are less familiar to Java developers (but are recognizable to
    those moving from other implementations to the JVM). These tend to require you
    to use the devel-opment installation procedures, toolchain, and commands specific
    to their community.


    # # Java-Based Servers


    Servers can be written in Java alone or can use one of several higher-level libraries.
    The same basic pattern is used in many cases: a server class declares requests
    to a handler, which extends an abstract class or implements an interface, which
    defines a handle method. Figure 6-2 illustrates the basic relationship between
    the server class, which uses a handler class. The handler method is implemented
    by the concrete handler. In the examples that follow, the handler will return
    a JSON object.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_110_0.png)


    Figure 6-2. Server-handler class diagram'
