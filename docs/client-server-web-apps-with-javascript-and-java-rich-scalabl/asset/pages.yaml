  md: '# Conclusion


    In any successful development team, each member has unique strengths that she
    brings to bear for the benefit of the project. The focus of one member allows
    others to pay closer attention in other areas, effectively limiting the problem
    scope under their attention. Starter projects and JavaScript frameworks insulate
    developers from details of BOM and DOM implementations, browser compatibility
    issues, initial concerns with code organization, and other challenges.


    Hardware improvements and JavaScript performance optimization has made it possible
    to create large-scale JavaScript applications. Large-scale applications are much
    easier to manage when standard design is used, and project focus is enhanced by
    eliminating repetitive tasks required in every web development project. The frameworks
    introduced in this chapter are specific examples of projects that can jumpstart
    your next development effort and focus your team''s attention immediately on the
    functional concerns of your project.'
