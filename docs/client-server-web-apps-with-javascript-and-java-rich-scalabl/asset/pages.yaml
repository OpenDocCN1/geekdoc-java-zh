    # Learning JavaScript


    The Java language has been widely adopted in educational settings. Developer certifications
    have been available for a number of years. There is therefore a well-understood,
    standardized, general common body of knowledge associated with Java. Java is often
    learned first in the classroom, and professionals obtain certification after a
    fairly defined program of self-study. The same cannot be said of JavaScript, but
    there are a number of good books on JavaScript:


    +   - JavaScript: The Good Parts (O''Reilly), by Crockford, has been mentioned
    already. It has become fashionable in some circles to issue with Crockford at
    various parts, but that is because he is a recognized authority who has shaped
    the thinking of many JavaScript developers. In some cases, he provides arguably
    strict "rules of thumb", but you will do yourself great service if you don''t
    understand the subset of the language he considers "the good parts" and the parts
    he avoids.

    - Secrets of the JavaScript Ninja (Manning Publications) is by John Resig and
    Bear Bault. John Resig is the author of jQuery and as he has a broad understanding
    of practical challenges related to browser compatibility and DOM implementations.

    - Several books are closer to standard language reference texts, including JavaScript:
    The Definitive Guide (O''Reilly) and Professional JavaScript for Web Development
    by Nicholas C. Zakas (Wrox Press). These are more comprehensive (and less opinionated)
    than the previous two books. They may not be the type of book you would read end
    to end, but they are invaluable for delving into specific topics.


    This section will not attempt to replicate all that you can learn from these and
    other books, but will provide starting points for you to evaluate your own knowledge
    of JavaScript. Additional books and resources will be referenced throughout the
    chapter if you encounter terms or concepts you want to research further.'
