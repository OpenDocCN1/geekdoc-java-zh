    does make many observations that are applicable in other areas. For example, off-reading
    for an API response is not Fielding highlights the lack of visibility when using
    solutions like Java applets. This concern could imply that in many situations,
    formatted JSON would be beneficial. The clarity provided to a client-side developer
    often outweighs the few spaces saved in a compacted message (not to mention that
    server compression is more effective for improving performance and size).


    REST was conceived of as an abstract model. Abstract models stand outside of space
    and time. As such, it does not directly take account the fact that systems change
    over time. The ease-of-use value suggests changes that should be made in a manner
    that is backward compatible if possible. Versioning of APIs provides a great deal
    of flexibility in this area.


    Recall that one of the constraints of REST is a uniform interface. A uniform interface
    is almost completely self-describing. Ideally, a system with such an interface
    needs no'
