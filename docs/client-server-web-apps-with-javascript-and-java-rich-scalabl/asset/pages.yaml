  md: '# Medium Specificity


    Medium specificity is a term that appears in aesthetics and modern art criticism
    but can be applied to technology as well. It indicates the "appropriateness" of
    a given artistic subject to be presented by a given medium. The idea has been
    around for centuries. Gotthold Ephraim Lesser states in the Lacoon:


    +   [B]odies, with their visible properties, are the legitimate subjects of painting.
    [A]ctions are [there] the legitimate subjects of poetry.


    > The Limits of Poetry and Painting


    Its application in modern art is usually to challenge traditional limits that
    appeared in the arts. Technology is a creative activity, but our primary concern
    is working systems, not abstract beauty. The idea of medium specificity is important
    in that, if you ignore the underlying nature of a platform, the resulting system
    will never perform in an optimal manner or will work at all. This has become obvious
    in many areas of technology. The goal of this book is to promote web application
    design strategies that are aligned with the way the Web itself is designed. Such
    applications operate well because they work within the Web''s fundamental constraints
    rather than them.


    # The Nature of the Web


    The essence of the Web has not changed. It is still made up of servers that serve
    HTML documents to clients via the HTTP protocol. See Figure 1-1.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_25_0.png)


    Figure 1-1. HTTP request and response


    A client-server web architecture more closely maps to the underlying architecture
    of the Web itself. Although not technically protocol-specific, REST was developed
    based and in conjunction with HTTP. REST essentially defines constraints on the
    usage of HTTP. It seeks to describe a well-designed web application: a reliable
    application that performs well, scales, and has a simple elegant design, and can
    be easily modified (Figure 1-2).'
  merge: -1
  pgno: 25
- img_proc: true
  md: '![](img/c4c4d9ed47c25b9284df211399b9ccea_26_0.png)


    Figure 1-2. REST request and response


    In fact, to more accurately emphasize the challenges in the modern web environment,
    we need to consider multiple devices and cloud deployments. See Figure 1-3.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_26_1.png)


    Figure 1-3. Multiple devices and cloud deployments


    The specific area of “medium specificity” has been ignored in web development
    in general (and in component frameworks in particular) is the stateless, client-server
    nature of the Web itself.


    # Server-Driven Web Development Considered Harmful


    Just because a given feature is available does not mean that it should be used.
    In many cases, a server-driven, component-based approach to web development should
    be replaced with a client-server one. Server-driven approaches obscure the nature
    of the Web itself, which is a client-server technology built on the HTTP protocol.
    Ignoring or obscuring the fundamental underlying architecture of the Web makes
    development, debugging, and support of systems more difficult. The intention,
    to make the Web somehow simpler or easier to understand, breaks down quickly in
    any non-trivial system where there needs to be a clear understanding what functionality
    is available and how the system actually works.'
  merge: -1
