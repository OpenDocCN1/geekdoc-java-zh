    Other RVM Functions

    RVM does a great deal more than simply let you interactively maintain Ruby versions.
    With it, you can set project-specific Ruby environments called gemsets that are
    independent-of other Ruby projects. It can be called at the command line to execute
    scripts that use a specific Ruby version and gemset. It even go beyond simple
    diagnostic advice; for instance, SSL certificate issues can sometimes be resolved
    by simply running the following RVM command:

    rvm osx-ssl-certs update all


    # Packages


    Ruby packages are called gems and are maintained using the gem utility. Gems are
    released with various versions, and a project can be developed that uses a specific
    set of dependencies. A set of gems can be associated with a single Ruby environment,
    which allows for simultaneous development of several Ruby projects that use different
    versions of Ruby and different sets of gems. In order to deploy a given project
    to other machines, the specific set of dependencies can be maintained declaratively
    using the bundler gem. Bundler dependencies are listed in the Gemfile.


    Using RVM, you can set up a new Ruby environment. You can then install a batch
    of gems individually and tweak the environment until all of the correct dependencies
    and versions are available. When these are available, populate a bundler Gemfile
    with all the versions in use in your current environment. The following sequence
