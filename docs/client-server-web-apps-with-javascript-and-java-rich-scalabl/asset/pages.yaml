  md: '# CHAPTER 5

    Client-Side Frameworks


    > You know also that the beginning is the most important part of any work...for
    that is the time at which the character is being formed and the desired impression
    is more readily taken.

    —Plato


    # Overview


    In the early days of the Web, starting a new web page involved opening a text
    editor and creating an HTML document from scratch. This approach still works for
    creating minimal examples for educational purposes or testing isolated bits of
    JavaScript functionality. However, this starting point is not the place from which
    modern web applications originate. Instead, a viable project template includes
    a well-organized directory structure and some combination of a particular set
    of Javascript libraries, CSS files, HTML, and other assets. The selection may
    vary from project to project, but in general should address concerns such project
    consistency, cross-browser compatibility, sound design principles, software development
    practices (such as unit testing), and superior performance.


    Historically, starter projects have been generated (by tools like Maven, utilizing
    archetypes) or specified during the creation of a new project in an IDE. Such
    projects were often tied to the tool that generated them. With no standard IDE
    or build tool for web development, starter projects have no tie to (though they
    are integrated in tools and IDEs). They vary in complexity and purpose, but successful
    ones have a common characteristic of being simple to understand, set up, and deploy.
    They provide a basic infrastructure that reduces tedious manual work not directly
    related to the main purpose of the web application.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'The choice of a starting point involves the fundamental building blocks of
    a client-side web page: HTML, CSS, and JavaScript in the context of a web page
    running in a web browser. This is shown in Figure 5-1.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_95_0.png)


    Figure 5-1. Client-side web page


    The widest context to consider is the client itself. There are many versions.
    browsers are no longer specific to desktop applications, but run on mobile devices.
    Each browser instance runs on specific hardware that can have a wide range of
    capabilities. The hardware can vary in processor, disk space, memory, screen size,
    and display characteristics. This is obvious, often forgotten by a developer whose
    view is restricted to a few browsers running on a development workstation.


    Starter projects can be oriented toward specific content, style, and/or behavior.
    HTML defines the fundamental structure and content of the page. CSS defines style
    and design presentation. JavaScript provides behavioral capabilities. Those with
    design skills might opt for a starter project that is more minimal or provides
    more flexibility in CSS styles, but might want a JavaScript infrastructure that
    supports a wide range of plug-ins and requires minimal programming. A developer
    might choose a project that provides a passable design out of the box, but be
    comfortable with a bleeding-edge JavaScript library that takes advantage of the
    latest browser capabilities.


    The choice of a starter project is also based on your application requirements
    and your audience. The goal of compatibility over the largest selection of available
    browsers might suggest one starter project, while the goal of a highly optimized
    application for specific mobile devices would suggest another. For example, frameworks
    like PhoneGap include starter projects that specifically target mobile devices.
    If your project is a game or other graphically intensive project then starter
    projects that include JavaScript libraries with graphics and physics engine capabilities
    are relevant.


    Specific requirements can suggest a starting point that is not immediately apparent
    or popular. It is easy to become enamoured with a particular framework or design
    trend,'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'but a project''s idiosyncrasies might require a different approach. For instance,
    if you need to actively target a particular browser (due to in-house browser standards,
    target web demographic, and so on), you might orient development to its peculiarities
    and choose a starting project that accounts for these. In addition, HTML, CSS,
    and JavaScript can be used to develop a range of applications outside of a standard
    web page such as browser extensions and native applications. A general-purpose
    approach getting a range of browsers and devices is optimal, but it is certainly
    not the only valid one.


    In general, most web development projects today are intended to be fully featured
    applications that work on variety of devices. Most are also created with an expectation
    that they will be relatively large and sophisticated. This suggests the use of
    a client-side JavaScript framework related to standard software patterns and code
    organization. Differences in display, browser capabilities, and device functionality
    imply the use of well-thought design that adapts to a range of devices and degrades
    gracefully when features are not available. The range of target device features
    that are expected to be leveraged over the life of the application imply the use
    of additional libraries and frameworks. These did not need to be considered in
    traditional, limited desktop browser applications.


    # The High Cost (or Value) of Early Decisions


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_96_0.png)


    This section might seem to elaborate the obvious. Pick a starter project and let''s
    roll!


    The issue at stake in making well-thought-out early choices has its roots in high
    impact down the road. The idea is expressed by economists and social scientists
    using the term path dependence. The basic idea is that early decisions are a "disproportionate
    cause of later circumstances." Problems introduced early in a project might be
    impossible to reverse at a later point. For instance, a choice of an immature
    JavaScript library can lead to numerous fixes and hacks being added to address
    browser incompatibilities. Though not obvious during our initial development (where
    developers have focused on modern browsers), later support can become burdensome-some,
    and the large amount of additional code can lead to a situa-tion where there is
    no turning back. Conversely, a well-thought-out starter project can reduce the
    support burden significantly far into a project''s implementation.


    # Starting Point One: Responsive Web Design


    On May 25, 2010, Ethan Marcotte''s article titled "Responsive Web Design" appeared
    on A List Apart. Responsive Web Design (or RWD) has now become a general term
    used as a shorthand to capture the ideas he expressed. Rather than designing specifically
    for'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'each device display, this style of design strives to provide an optimal viewing
    experience across a wide range of devices. Like software design patterns (which
    were inspired by Christopher Alexander''s architectural patterns), the concept
    finds its origin in building architecture. Responsive architecture considers how
    physical spaces can adapt as people pass through them. Responsive Web seeks to
    adapt user experiences on a variety of devices with diverse methods of interaction
    based on device capabilities. Three components of RWD are:


    # Flexible grids


    Adapt the typographic grid for use on the Web. They take advantage of relative
    sizing available in CSS to provide display of a grid and its components in a manner
    properly proportioned to its context.


    # Flexible


    Include using CSS max-width to cause images and other media to render within their
    containing element and related techniques to avoid fixed-point styling that does
    not adapt to all devices.


    # CSS3 media queries


    Inspect the physical characteristics of the context where the page is rendered
    and respond with a specific display fixed-unit format.


    The fluid layout flexible images (which rely on relative sizing) combining with
    CSS3 media queries (allowing adaptive layout targeting fixed sizing) provide the
    basis of RWD. Fluid layout is proportionally scaled, and adaptive breaks at given
    points. This prevents the skewing that occurs with a fluid approach or the lack
    of adaptation to mediate display possibilities from a purely adaptive design.


    By using these constructs of RWD, a single well-constructed set of web resources
    can produce pages that can be viewed and used effectively on a variety of devices.
    Marcotte later developed the ideas introduced in the article in a book on the
    subject. A number of projects have been developed based on these principles, among
    them HTML Boilerplate and Twitter Bootstrap.


    # HTML5 Boilerplate


    HTML5 Boilerplate provides a set of resources that satisfy the requirements of
    RWD. Its features include a standard directory structure and template files related
    to a website and web server configuration. It includes CSS that incorporates normalize.css
    (a stylesheet that provides consistent rendering in line with modern standards
    across browsers, some additional CSS defaults, common helpers, placeholder media
    queries, and print styles. The jQuery and Modernizr JavaScript libraries are provided
    as well.'
