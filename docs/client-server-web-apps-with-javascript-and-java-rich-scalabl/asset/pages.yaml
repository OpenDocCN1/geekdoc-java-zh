    # Theory in Practice


    REST in its pure form remains an ideal standard. It serves as a measure of projects
    implemented with it. In it might be studied and understood. But the value of other
    technologies, namely JSON, has been proven as well. JavaScript-based clients easily
    consume JSON. The lack of a universally accepted mechanism for linking in JSON
    has not deterred developers from adopting it as the data transport of choice.
    Supplementing APIs with documentation and other practical considerations has made
    the difference between theoretically perfect systems that are never delivered
    and practical solutions that need immediate needs.


    The applicability of RESTful web APIs to the practical problems faced by developers
    has grown over time and resulted in the change in architectural approaches. Such
    APIs can be consumed by devices with a wide array of capabilities, including those
    by third-party developers. They are lighter weight than SOAP and other service
    implementations that include complex envelopes and exchange patterns. They can
    be used to create applications without problems related to state data on the client.
    They effectively distribute processing to clients that have significant computing
    power. They are horizontally scalable by simply adding additional server applications
    when deployed in a cloud-based platform like Amazon Web Services. These and other
    characteristics have resulted in developers switching from occasionally implementing
    or consuming a service to developing entire applications with a consistent approach
    leveraging REST APIs.'
