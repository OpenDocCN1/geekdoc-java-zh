    # # Curl for Web APIs


    The Curl can transfer data to or from a server using a variety of different protocols.
    A small subset of command-line options are sufficient for most operations related
    to RESTful web APIs over HTTP, as shown in Table B-7.


    Table B-7. Selected HTTP-related Curl options


    | Option | Description |

    |---|---|---|

    | -H | Header | Specify an HTTP header |

    | -d | Data | Sends the specified string data to the server |

    | -s | Silent option | Don''t show progress meter or error messages |

    | -L | Location | If the server responds with a location header and a 3xx response
    code, redo the request on the new location (limit the redirects with --max-redirects)
    |

    | -X | Execute option | Specify the HTTP request method |

    | -A | Agent | Specify the user agent |

    | -b | Cookie | Specify a cookie (easier to remember using --cookie rather than
    -b) |

    | -o | Output | Output to a file (or -O to write to a file named as the remote
    one) |


    Sample call:


    ```

    curl -s -H "Accept: application/json" \

    n-H "Content-Type: application/json" \

    nhttp://localhost:8080/hello/world \

    n-X PUT -d ''{"hello": "world"}''

    ```'
