  md: 'expressed it. But for better or worse, the term REST has been adopted in a
    broader context, and has become a useful shorthand for identifying the architectural
    style of minimal API design that is based largely on the underlying functionality
    of HTTP.


    # Pragmatic REST


    Why many APIs have been designed in this "pragmatic" way? In part, it is because
    the HATEOAS principle places such a high bar for the client-side. A programmer
    who, inadvertently or on purpose, hardcodes a URI path into an application may
    be in a rude shock in the future, and the server-side API team may simply tell
    the client that they failed to follow the spec.


    Although HATEOAS is a good theoretical approach to designing an API, it may not
    apply in practice. It is important to take into account the audiences of the API
    and their possible approaches to building apps against it and factor that into
    your design decisions. HATEOAS, some may be the right choice.


    > - APIs: A Strategy Guide (O''Reilly)


    It is fascinating that Fielding does recognize JavaScript in his dissertation
    in relation to REST. He discusses the reasons for JavaScript''s success on the
    Web as opposed to embedded Java "applets," which were not widely adopted as a
    client-side development technology. He points out that JavaScript fits the deployment
    model of the Web, is consistent with the principle of visibility with HTML, includes
    fewer security complications, involves less user-perceived latency, and does not
    require a separate, independent, monolithic download.


    Typical JavaScript usage is consistent with the design principles of the Web.
    Its extensive use in the browser makes JSON an attractive option for data interchange
    that could be easily produced and consumed.


    Unfortunately, the fact that JSON was specified as a subset of JavaScript rather
    than a hypermedia format means that remains an impedance mismatch between JSON
    and strictly RESTful APIs. Although a browser running JavaScript is consistent
    with the design of the Web and the formal definition of REST, the use of JSON
    as a data interchange format is not.


    Not everyone is interested in using the strict definition to classify whether
    a web API is RESTful or not. The fact that JSON web APIs are popular and REST
    design is influential has to the development of a few different measures for classifying
    REST compatibility on a spectrum.


    # API Measures and Classification


    The Richardson Maturity Model introduced by Leonard Richardson in 2008 expresses
    a continuum by which services can be evaluated against the REST standard.'
