  md: '# Simpler Server-Side Solutions


    The explosion of client-side technologies is overwhelming due to the inherent
    challenges of web browsers as a platform, the JavaScript language itself, and
    the JavaScript libraries used to help manage the complexity. An additional complexity
    is device-specific development, which can involve either mobile applications or
    native applications that make HTTP web service calls. One pleasant surprise in
    the new client-server paradigm is a corresponding simplification of a server-side
    code.


    A web application traditionally has been a relatively large construct that ran
    in an application server, container, or web server. At the time of this writing,
    the venerable Apache web server had over two million lines of code and required
    hundreds of years of effort to complete. JEE development was notoriously complex
    (resulting in its vastly simplified in more recent JEE versions). Server-Model-View-Controller
    projects (Struts) and dependency injection frameworks (Spring) organized and eased
    the configuration burden, but highlighted the size and scale of a typical server-side
    implementation that appeared to be required to develop a Java-based web application.


    Client-server web applications that do not maintain session state and consist
    of large APIs. Though such servers can take advantage of middleware and supporting
    services, these are often not necessary. By direct and indirect influence from
    the scripting world, it is now trivial to set up a minimal server to provide adequate
    functionality for front-end developers to work without a need for the full-scale
    server implementation. Java and JVM languages allow for many possibilities that
    allow a developer to include server functionality in a project without the need
    to install, configure, and maintain a full server implementation. This opens up
    possibilities for very different workflows that were previously possible. In addition
    to benefits during development, the practice of horizontal scaling in cloud-based
    production deployments is eased by having a lightweight server solution.


    A "containerless" web application can be constructed by using Java on the JVM
    or by taking advantage of libraries. Figure 6-1 illustrates the ones used in this
    chapter and their relationship to each other. Libraries located on the diagram
    have greater infrastructure, are more opinionated, and (in theory) are a more
    productive starting point for a framework suited to a domain. They are not exhaustive,
    but could be extended in various directions. For example, the various JVM languages
    have corresponding web frameworks (Sinatra or Rails for Ruby, and Django for Jython).
    Typeset is a Scala framework built on top of Play. Vert.x distinguishes itself
    as supporting several JVM languages.'
