- img_proc: true
  md: '# Why REST over SOAP?


    Involved debates have taken place over the virtues of REST over SOAP, or vice
    versa. Although SOAP does provide a formal contract and is suitable as a sophisticated
    RPC architecture, it introduces additional overhead and complexity without providing
    substantial advantages for most web development. SOAP remains in heavy use as
    an RPC platform due to nontechnical considerations such as the fact that it is
    firmly entrenched in large-scale legacy applications.


    SOAP messages are large, require extensive processing, and are expressed in verbose
    XML envelopes. This makes the protocol unattractive for client-server-web applications,
    which can so easily process JSON using JavaScript.


    Many developers initially encounter REST as a web services protocol characterized
    by pretty URLs and free-form, lightweight messages. While this perspective has
    great practical value, it is important to understand REST as it was articulated
    by its author Roy Fielding.


    # What Is REST?


    Fielding states that the "Representational State Transfer (REST) architectural
    style... [was] developed to represent the model for how the modern Web would work."
    Although technically protocol-agnostic, it was developed in conjunction with HTTP.
    And because of this association, a few of the salient features of HTTP should
    be kept in mind.


    # Resources


    A web resource is simply something available on the Web. The definition of a web
    resource has expanded over time. It originally referred to a static accessible
    document or file. It was later given more abstract definition and now encompasses
    every entity that can be identified, named, addressed, or handled on the Web.
    Some examples of resources are a traditional HTML web page, a document, an audio
    file, and an image file. Resources can refer to things that you might not find
    in your typical digital library as well, such as a hardware device, a person,
    or a collection of other resources.


    REST uses web addresses (URIs) to access and manipulate resources using verbs
    (HTTP request methods).


    # Verbs (HTTP Request Methods)


    HTTP 1.1 defines a set of verbs (or request methods) that indicate an action taken
    on a resource. Of those available, the ones of greatest significance using RESTful
    approach'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'are GET, POST, PUT, and DELETE. One way of thinking about these verbs is by
    comparing them with commands used to manipulate data in a database.


    In a database, a data entity is typically referred to as a record. In REST, the
    corresponding entity is the resource. The HTTP verbs (POST/GET/PUT/DELETE) roughly
    correspond to traditional CRUD (create/read/update/delete) operations in a database
    or object-relational-management (ORM) system. A REST architecture stipulates that
    resources on the Web are retrieved or changed in the same way that SQL or similar
    query language is used to access or modify records in a database. A full listing
    of HTTP 1.1 options to REST can be found in Appendix B.


    | HTTP verb | Action to take on a resource | Analogous database operation |

    |---|---|-|

    | POST | Create (or append) | insert |

    | GET | Retrieve | select |

    | PUT | Update (or create) | update |

    | DELETE | Delete | delete |


    # Other HTTP Methods


    Several other HTTP methods are useful but do not correspond to traditional database
    operations. The HEAD method is identical to GET except that the response does
    not include a response body. This is applicable when using REST-related technologies
    that take advantage of HTTP Headers. Cross-Origin Resource Sharing (CORS) returns
    JSON otherwise forbidden to browser''s same security policy and its negotiations
    with servers using HTTP headers. Method of specifying links for documents use
    headers as the location header rather than the body. So at times the salient information
    resides in the response header it makes sense to use a HEAD call rather than incurring
    additional overhead of returning the response by a standard GET.


    The OPTIONS method can be used to retrieve a listing of HTTP request methods available
    for a resource. This has implications not only for debugging and support also
    for creating systems with a uniform interface available through a single entry
    point embodying a self-describing system. In conjunction with such links, which
    represent the accounts for all resources in a system, a proper implementation
    of HTTP OPTIONS would return a comprehensive list of methods available for each
    resource through a link.


    # Uniform Resource Identifiers


    In a networked system there needs to be some sort of handle or address that allows
    a resource to be acted upon. Uniform Resource Identifier (URI) is the general
    term for a string of characters used to accomplish this. A URI can be further
    differentiated as either'
