  md: 'from project to project, by following well-understood and established programming
    practices, it is possible to decrease ramp-up time and maintain control of a project
    with minimal impact on programmer productivity. Simply put, such an infrastructure
    allows a project team to scale in ways that would otherwise be impossible.


    # Build Tools


    One of the most important decisions an architect or lead developer makes is what
    assets to initially include in a project. This decision subsequent development
    when the project stabilizes but becomes more difficult to change. The choice of
    a build system has immense ramifications for later activities. There are a number
    of factors that go into this choice.


    The flexibility provided by the syntax of a programming tool is a significant
    factor in its usefulness. Martin Fowler has contrasted make (which has its own
    syntax) with ant (which uses an XML-based syntax) and rake (which uses the Ruby
    programming language) to call attention to the value of having a full-fledged
    programming language available to build scripts. A factor that is of perhaps great
    interest in recent years is the availability of dependency management in a build
    tool. Without dependency management of some sort, a developer is in the unhappy
    situation of having to identify, locate, download, and install modules and related
    resources (sometimes with limited documentation). The automatic management of
    specified versions of modules from online code repositories is immensely valuable
    to developers and benefits general stability of a project. See Table 4-1.


    Table 4-1. Comparison of build tools


    | Custom DSL | XML | DSL | Programming language | Dependency management |

    | --- | --- | --- | --- | --- |

    | make | Y | N | | N |

    | ant | N | Y | | N |

    | rake | N | N | Ruby | N |

    | maven | N | Y | | Y |

    | gradle | N | N | Groovy | Y |

    | SBT | N | N | Scala | Y |


    This is a bit of a simplification because build tools are incredibly extensible.
    Dependency management adds-ons and support for other programming languages can
    be added to expand the capacities of those that do not provide them. For example,
    Ant supports dependency management using Gant, and a Groovy-based version of the
    project named Gant also exists.


    The list is representative of widely used build tools but is not exhaustive. Since
    1977, Make has influenced most other build tools to some degree (including Rake).
    Rake itself has inspired early Java-oriented projects (including Raven and Apache
    buildr).'
