  md: '# Client-Side Templating


    Some of the JavaScript frameworks previously discussed bundle a JavaScript templating
    solution. A variety of others exist can be swapped in your discretion with a variety
    of frameworks. LinkedIn engineering considered 26 client-side templating technologies
    before settling on dust. There are some fascinating developments in this area,
    including the possibility of implementing client-side JavaScript templates that
    can failover to server-side rendering if needed.


    # Asset Pipelines


    Old-school web development involved simply editing and including relevant assets
    on the web server. Resources can be provided externally through Content Delivery
    Networks (CDNs). In addition, rather than simply editing and including the resources,
    they are commonly preprocessed in a variety of ways prior to being served on the
    web server. An asset pipeline can be used to precompile, concatenate, and minify
    applicable resources and take relevant actions related to the caching of these
    resources.


    Asset compilers emerged in the Ruby community in the last several years. Early
    examples were Jammit and Sprockets. later, asset pipelines were incorporated into
    Rails and have been adopted by web frameworks in other languages such as Java''s
    Play2.


    Asset pipelines are used for a number of tasks. Some are geared towards reducing
    network latency when serving large files. JavaScript and CSS files can be minified
    (removing whitespace and other characters), concatenated (resulting in fewer total
    network calls), and compressed (using zip or compression algorithms). Others relate
    to caching. For example, the Play framework uses ETag HTTP Headers to append a
    value generated from the resource name and the file''s last modification date
    and also provides the option of setting Cache-Control headers.


    In addition, having a preprocessing step opens up the possibility of compiling
    other languages to JavaScript (such as CoffeeScript and Dart). This provides a
    range of possibilities for those who find the JavaScript language itself distasteful.


    CSS can also be preprocessed, which reduces the amount of duplicate code. Less
    duplicated code makes the application styling easily maintainable at the expense
    of adding an additional build step. A precompiler processes an initial file at
    point prior to being referenced in an HTML page and resolves references in the
    code so that a standard stylesheet is rendered. Examples of the type of preprocessing
    available through a CSS compiler include:


    +   - Definition of variables that replace values (for example, a color used in
    various CSS classes)'
