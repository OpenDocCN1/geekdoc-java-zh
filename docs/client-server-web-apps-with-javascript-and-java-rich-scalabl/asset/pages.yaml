  md: '# JSON Syntax


    JSON is a simple data exchange format which is a subset of JavaScript.


    # JSON Types


    +   - Array (ordered, comma-separated values enclosed in square brackets)

    - Object (an unordered, comma-separated collection of key:value pairs)

    - Number

    - String

    - Boolean

    - Null


    # Railroad Diagrams


    The following railroad diagrams give a more formal description of the subset of
    JavaScript that constitutes the JSON data exchange format.


    # Object


    An JSON object is a set of zero or more pairs of strings with associated values
    enclosed in brackets. Each string is followed by a colon, followed by its associated
    value. If there is more than one string-value pair, they are separated by commas.
    See Figure B-1.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_243_0.png)


    Figure B-1. Object'
