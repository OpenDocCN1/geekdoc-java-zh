  md: '# Code Examples


    Projects and code examples in this book are hosted on https://github.com/java-javascript/client-server-web-apps.
    You can view them online or download a .zip file for local use. The assets are
    organized by chapter.


    The code examples provided in this book are geared toward illustrating specific
    functionality rather than addressing all of a fully functional application. Differences
    include:


    +   - Production systems include greater refinement of selected data types, validation
    rules, exception handling routines, and logging mechanisms.


    +   - Most production systems will include one or more backend datastores. To
    limit the scope of discussion, databases are not accessed in most of the examples.


    +   - The modern web application includes a large amount of infrastructure geared
    toward mobile device access and browser compatibility., unless these are the specific
    topic of discussion, responsive design is eschewed for a more minimal design.


    +   - The practice of some degree of unobobtrusive JavaScript to separate CSS
    and JavaScript-Script from the examples in this book, they are frequently commingled
    because all aspects of a given application can be immediately appraised by viewing
    a single file.


    +   - Unit tests and examples are only included when they are directly related
    to the topic under discussion. Production systems would include greater coverage
    and extensive testing in general.


    That said, this book is intended to help you get your job done. In general, you
    may use the code in this book in your programs and documentation. You do not need
    to contact us for permission unless you are reproducing a significant portion
