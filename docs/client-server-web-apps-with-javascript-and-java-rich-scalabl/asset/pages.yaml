    # Client Side: AngularJS


    AngularJS (often referred to simply as Angular) is an MV* JavaScript framework
    developed in 2009 by Miško Hevery and Adam Abrons. As of 2014, a team at Google
    that includes Igor Minár and Vojta Jain maintain the project. Angular reads the
    DOM of its associated HTML document, processes custom elements and attributes
    (directives), and binds data in an associated model to the page.


    Angular seeks a comprehensive approach to the development of web applications.
    It recognizes the declarative nature of HTML and enhances its behaviors. It is
    a very sophisticated framework that has entire books to in-depth coverage. The
    purpose here is not to exhaustively describe the project, but to demonstrate how
    to quickly get up and running with it. There are a number of concepts related
    to Angular that need to be understood in order to use it effectively.


    # Model


    If you have done server-side MVC development, you probably think of a model as
    a class that contains attributes and is associated with a relational database.
    Hibernate and MyBatis are used by Java developers, and ActiveRecord is used in
    Rails to serve in its capacity. There are also JavaScript frameworks like Backbone
    that include a specific model object that is recognized by the framework.


    Angular is quite different in this regard. Unlike some other JavaScript frameworks
    that have a specific model object, an Angular model is a plain JavaScript object.
    The model in Angular is simply the data. Because of how little attention is given
    to the model in Angular, some have seen it as more of a templating solution, as
    cited in the Angular FAQs. However, the rest of the features of the framework,
    including bidirectional data binding, make Angular more than simply a templating
    system.'
