  md: '# Underlying Platform(s)


    The operating system along installed infrastructure software comprises the underlying
    local deployment platform. A reasonably powerful workstation or two (along with
    an extra monitor for added screen estate) is the equivalent of a supercomputer
    from a few years ago. Initial setup to allocate sufficient JVM memory or shut
    off unneeded programs from consuming resources might be of some value, but often,
    fundamental aspects of application design play a larger factor. In some cases,
    having a faster file system will make a noticeable impact on build time.


    The use of centralized databases versus developer-maintained copies can be an
    important decision. In a developer-maintained scenario, migration frameworks like
    FlyWayDB can be of assistance. If working with remote resources, networking can
    become a significant concern, particularly when working with distributed teams.


    # Conclusion


    By design, there is no sample project with this chapter. Productivity, or simply
    efficiency during the development process, requires a step back to consider available
    options and how they fit with the project at hand. Each stage of a project includes
    macro- and micro-level tasks that might be simplified, automated, or performed
    more efficiently. There is no substitute for “coming up for air” and giving the
    appearance of leisure that allows sufficient reflection on the best options available.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# CHAPTER 8

    API Design


    > In theory, there is no difference between theory and

    practice. But, in practice, there is.

    —Author Unknown


    There are two basic ways to solve solve problems: start with a comprehensive theory
    and work out the details, or start with particular facts and develop a theory
    that ties them together. "Detail people" derive solutions by studying the minutiae
    of a particular problem. "Big-picture people" fit problems into categories that
    relate to their overarching theories. Each approach has value, and problem-solving
    involves adeptly switching between them.


    # Waxing Philosophical


    In philosophy, Plato describes "universals" as abstracted to the highest and most
    fun-damental "realm of ideas." His student Aristotle instead finds them in specific,
    particular, real-world things. These starting points are more than an intellectual
    curiosity. In design analysis, starting points affect the ultimate outcome of
    the process. The best solutions are often the result of both approaches being
    applied in a complementary manner. These ancient points are related to modern
    data science techniques by the authors of The Handbook of Statistical Analysis
    and Data Mining Applications (Elsevier):


    Traditional statistical analysis follows the deductive method in the search for
    relation-ships in data sets. Artificial intelligence (e.g., expert systems) and
    machine learning techniques (e.g., neural nets and decision trees) follow the
    inductive method to find patterns of relation in data sets. Deduction (or deductive
    reasoning) is the Aristotelian process of analyzing detailed data, calculating
    a number of metrics, and forming some conclusions based (or deduced) solely on
    the mathematics of those met-rics. Induction is the Platonic process of using
    information in a data set as a "spring board" to make general conclusions, which
    are not wholly contained directly in the input data.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'REST and practical web API design are representative of these starting points
    as well. REST was articulated by Roy Fielding in purely abstract terms. RESTful
    web APIs, while inspired by the ideals of REST, are created to solve specific
    problems and implement details that don''t fit the theory in its purest form.
    Much of the disagreement that occurs in discussions concerning REST can be traced
    to the starting points chosen consciously or unconsciously by each party.


    Obviously, REST specifies constraints that provide immediate practical value for
    web API authors. The discrete division between client and server tiers, the use
    of HTTP verbs, and identification of web resources have been demonstrated to be
    useful in the creation of a variety of real-world web APIs. The fact remains HATEOAS,
    while theoretically compelling, proved difficult to implement consistently. It
    is especially challenging to reconcile due to the widespread adoption of JSON
    as the de facto transport format for web APIs.


    # A Decision to Design


    Although web services have existed in one form or for another, the shift to use
    them as a foundational design element did not occur immediately. The gradual adoption
    of Ajax and the creation of JSON and related lightweight web APIs initially impacted
    systems built on server-side MVC. As developers pushed the limits of these technologies
    to create sophisticated single-page applications, it became clear that server-driven
    MVC approach did not adapt well to pervasive use of the new technologies. This
    led to a fundamental change to the design of web applications that broke continuity
    with previous practices. See Figure 8-1 for a timeline illustrating the technological
    progress that led to client-server-style web applications.


    # A Shift to a Client-Server Approach


    The technologies used in a client-server approach to web development are not new.
    The programming languages used have matured but are not fundamentally different,
    servers, browsers, and the HTTP protocol have been around since the Web was created.
    However, the design methodology applied in a consistent manner is a more recent
    development and is largely a result of various technologies developed.


    The first web pages were simple, static content served by web servers and rendered
    in browsers. Dynamic content was introduced in the mid-1990s with CGI programs
    on the server and JavaScript. JavaScript was relatively slow, and client computers
    were not powerful, so the focus was on utilizing server-side processing to create
    dynamic content. The complexities resulted in the introduction of patterns such
    as Model-View-Controller (MVC) to the server side.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'The MVC pattern remains a staple of server-side Java development and appears
    in major standards like JEE and frameworks like Spring. Further JavaScript innovations
    like Ajax and JSON immediately influenced server-side MVC developers, who used
    these technologies in an ad hoc,cemeal manner. Frameworks have not disappeared,
    but their design and use have been significantly affected. In terms of design,
    MVC frameworks like Spring adopted "pretty URLs" that reflect resources being
    acted on. In terms of use, APIs of course be used in conjunction with traditional
    MVC. Regardless of the framework in use, many applications today are based on
    web APIs without MVC, which is effectively a client-server approach.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_144_0.png)


    Figure 8-1. History of technologies related to client-server web development


    A client-server approach involves a specific design decision to develop RESTful
    web APIs to deliver data to client-side views and to avoid generating views server-side.
    This begs the question of how to best design web APIs in a consistent, supportable
    manner. Design decisions of this type always elicit a range of opinions, but there
    is a fairly established consensus. The general agreement is that web APIs should
    be significantly influenced by REST without being rigidly restricted by controversial
    or impractical constraints.


    # Practical Web APIs Versus RESTful APIs


    While what is practical might be subject to interpretation, there is widespread
    agreement that web APIs should be easy to use. They should be easily understood
    by an outside developer, consistent, predictable, and conform to many parts of
    REST. Implementation of certain aspects of REST provides this kind of ease-of-use
    by design. This is despite the fact that REST was not originally specified with
    any particular intention about short-term productivity or developer ease-of-use
    as it is understands.'
  merge: -1
