  md: '# Consolidated Executable JARs

    Although it is common for Java projects to reference multiple JARs,

    a project can be packaged and deployed as a single executable unit.

    Utilities to package JARs inside JARs include one-jar and build tool

    plug-ins like the Maven Shade plug-in.


    # Implications of Deployment Choice


    The method of deployment chosen has significant implications for security, scalability,

    and overall support of an application. Deployment methods vary in their flexibility
    for

    quick changes.


    It is possible in simple deployments with a single server and an exploded EAR
    or WAR

    hot-patch a system. A change to code or a configuration file can update the application

    without the overhead of doing a full deploy. This practice itself raises a host
    of process

    and security concerns, but is highlighted since it is not possible to do this
    type of

    change in more complex deployment scenarios.


    Credentials and connection strings are easy to modify in an externally administered

    application server. This is not the case in systems where the application server
    is de-

    ployed alongside or built into an application''s packaging.


    Deployments that do not rely on externally administered application servers provide

    tremendous flexibility in horizontal scaling. By building intelligence into load

    balancers, it is possible to make quick changes with little downtime by creating
    new

    server instances with the desired configuration data rather than changing existing

    servers.


    The nature of the deployment can impact the development process and the choice
    of

    modules that comprise the foundation of an application. The deployment process
    is best

    identified early in the development process to ensure that the required resources
    are

    available and the relevant processes enacted.


    # Load Balancing


    Load balancing is closely related to deployment in its implementation determines

    the network and server topology to run an application. The goal of load bal-

    ancing is to distribute incoming requests as efficiently as possible with available
    pro-\ccess power. In the case of a web application, incoming HTTP requests are
    redirected

    from a designated load-balancing server (or cluster of servers) onto multiple
    web

    servers.


    The decision of how to distribute the load varies based upon the amount of work-

    involved to process each request, the power of the servers, and the choice of
    hardware

    and/or software that will perform load balancing operations. Tasks can be distributed'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'evenly between the servers in a round-robin fashion, or weighted to distribute
    work to servers with greater processing power. There are more sophisticated schemes
    that tracks the requests being processed by each server or allow each server to
    essentially pull when they are available, which makes better use of available
    processing power. Some load balancers are able to detect node failures and will
    not route requests to dead nodes. Load balancing is illustrated in Figure 11-8.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_198_0.png)


    Figure 11-8. Load balancing


    Not all of the functionality available in physical load balancers is replicated
    in software load balancers. This includes security concerns like distributed denial
    of service protection and SSL termination, as well as performance-enhancing features
    like compression, connection pooling, buffering, and caching. These features are
    not necessarily inherent to load balancing, but in some cases are essential to
    use it effectively.


    # Loads More on Load Balancing


    There are many factors to load balancing that are not really relevant in the context
    of client-server web development. Jboss includes internal load balancing for JNDI,
    and EJBs within a cluster. Other Java web servers include a clustering feature
    to make sessions available to multiple application servers. Load balancing schemes
    in regard to whether multiple requests from the same client be directed to the
    same server. DNS-based load balancing provides a similar functionality to round-robin
    processing, but clients that cache the IP will return to the same server after
    the initial lookup. Sticky sessions can be used to HTTP requests associated with
    the same session to be sent to the same server. The range of possibilities is
    very large and can range from internal management of load balancers for independent
    operations to cloud deploy'
  merge: -1
