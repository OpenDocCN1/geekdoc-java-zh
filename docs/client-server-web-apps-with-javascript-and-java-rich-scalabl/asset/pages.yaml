  md: '# HTTP Headers


    A version identifier is only one of many uses for request response headers. Other
    "out of band" information can be stored here as well. Twitter reports rate limit
    data in headers to alert a developer when her application is approaching a limit.
    ETags can be used to control caching, and other headers apply to security and
    authorization. Headers are often used to communicate secondary but essential information.
    They don''t neatly fit into an abstract model, but they have many practical uses
    that need to be considered.


    Accept and content type headers can be used to impact how the server responds
    to a request and what sort of response it provides. Besides the obvious differentiation
    between XML and JSON content, these are used to return padded JSON (JSONP) rather
    than straight JSON. This is part of the magic that allows JSON content to be sent
    to a remote server without violating cross-domain restrictions. In essence, it
    allows access to a JSON API by wrapping a JSON payload in a function call. An
    example of this is provided in the project later in this chapter.


    # Linking


    Pagination presumes the ability to link to the previous and next resources relative
    to the subset being displayed. API designers recommend including the entire link
    for the next and previous page in the results of your API, while others recommend
    only the inclusion of IDs to save space and eliminate repeated text. While providing
    links is a good decision and limits the need for additional documentation, strict
    HATEOAS is not practical or possible for every situation at this point.


    # Responses


    Having an API that is self-describing is an excellent ideal. If resources are
    specified and reflected in the URLs and HTTP headers leveraged, this can be accomplished
    to a significant degree. Following convention in the use of HTTP response codes
    (for example, 400 reflects client concerns while 500 indicates server issues)
    will contribute to this well. Ideally, your system error messages will provide
    immediate, actionable descriptions to address their triggers. But in some systems,
    documentation will be needed at least in a few basic areas. Error codes are often
    a bit terse. They should therefore be keyed to documentation. Ideally, errors
    will be described in documentation at a level that is impractical in a system
    error message (for instance, identifying each field in a PUT/POST/PATCH and the
    errors it can cause).


    # Documentation


    Documentation should be easy to locate, search, and understand. One convention
    adopted by some web API developers is to use a Web Application Description Lan-'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'gage (WADL), which is a machine-readable description of a web application,
    generally in XML format. These are often easy to locate, but will not be sufficient
    if simply generated by a utility. Providing examples that can be replicated by
    a developer curl at the command line can go a long way clarifying the intent of
    your API. If an API is directed toward third-party developers, even more attention
    will be required.


    Documentation on RESTful APIs will involve manual effort, but there are tools
    that can ease this by automatically generating documentation. Servers create a
    WADL as a resource available at the API server. For example, Jersey generates
    a basic WADL at runtime that you can request using a GET to /application.wadl.
    Additional information can be included in the WADL by selecting specific directives.
    If you are using a server that does not generate a WADL out of the box, a package
    like Enunciate be added and configured for your project to generate one. There
    are also websites like http://apiary.io you can design and document your API outside
    of the context of any specific project.


    # Formatting Conventions


    Finally, following simple format conventions can make an API much more approachable.
    Developers need to view and read documents during initial development as well
    as ongoing support. Because JSON is JavaScript, it makes sense to follow idiomatic
    JavaScript practices like using camel case for naming fields.


    Another simple practice is to pretty-printing JSON responses makes it easier for
    people to read. The usual argument against this is that pretty-printing JSON increases
    the response size and hurts performance, but greater performance can be gained
    by configuring JSON responses to be Gzipped. The few spaces added in a formatted
    response can be worth the performance because developers can view responses without
    first formatting it in an IDE or using a command-line utility like jq.


    # Security


    REST does not provide specific guidelines related to security. This is because
    it was designed with the assumption that APIs would be publicly available on the
    Internet. It is often a good idea to serve APIs over HTTPS rather than HTTP. For
    APIs that are not intended to be restricted to a server, a JSON API can be made
    public via JSONP or CORS.


    # Project


    The following project demonstrates how Jersey can be used to return JSON, XML,
    or JSON content. A single resource (greeting) is used in this Hello World-style
    application. The project is available on GitHub.'
