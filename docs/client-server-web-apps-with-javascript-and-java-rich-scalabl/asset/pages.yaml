- img_proc: true
  md: 'Uniform Resource Name URN that represents the name of a resource or a Uniform
    Resource Locator (URL) that represents the address of a resource.


    Most REST schemes use their URL syntax on this general format:


    ```

    <scheme>://<user>:password@<host>:<port>/<path>;<parameters>?<query key/value
    pairs>#fragment identifier

    ```


    See HTTP: The Definitive Guide (O''Reilly) for more details about URIs and HTTP
    in general.


    In REST, resources are specifically identified as elements. Slashes in the URL
    are used to delimit resources and express their relationship in a hierarchical
    manner. REST URLs are demonstrated in examples and explained in greater detail
    in Chapter 8.


    In web-based APIs, URL names are used to identify resources and specify their
    relationship to others adhere to additional conventions. These are not required
    by REST, but are stylistic choices that promote readability and consistency of
    URLs. For the most part, URLs should be lowercase, use hyphens but not underscores,
    and include trailing slashes. An individual resource is referred to using a singular
    noun. A collection of resources is identified using a plural noun. File extensions
    are discouraged but show up when an API supports multiple formats like XML and
    JSON. More suitable alternative is to use "Accept" and "Content-Type" headers
    to control the format. The REST API Design Rulebook by Mark Masse (O''Reilly)
    includes the conventions listed above and many others, but in practice, there
    is a fair amount of latitude in the structure and format of URLs.


    # Hyphens Instead of underscores?


    It should be emphasized that all of the URL naming conventions mentioned are not
    etched in stone. Many popular APIs, including Twitter and Dropbox, use underscores.
    There are other considerations such as engine optimization that caused this to
    be considered a bad practice in the past (underscored elements were concatenated
    together in Google''s search indexes, while hyphenated strings were broken into
    separate words). Though there are differences of opinion in these details, there
    is clear agreement that URLs should be as short as possible, readable, clear,
    and consistent across an API.


    # REST Constraints


    REST is defined as a specific software architectural style characterized by a
    group of selected constraints. Beneficial system properties and sound engineering
    principles are evident in a system designed to conform to these constraints.'
