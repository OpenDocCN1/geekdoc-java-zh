    # Conclusion


    In past, deployment of Java applications followed JEE processes that were rather
    well defined. While JEE style deployments remain applicable in many situations,
    the Java community has also adopted new approaches to deployment that are of particular
    interest to designers of client-server-style web applications. The next chapter
