    # CMM to Assess Process Uniformity


    Conway''s Law suggests that "Any organization that designs a system will produce
    a design whose structure is a copy of the organization''s communication structure."
    It might also be said that software process maturity (the extent to which processes
    are clearly defined and controlled) is reflected by the state of an organization''s
    software tests. The Capability Maturity Model (CMM) defines a hierarchy of stages
    describing degrees of structure, process stability, and discipline for an organization
    reflected in processes for developing and maintaining software. This is shown
    in Table 13-1.


    Table 13-1. Capability maturity model stages


    | Level | Name | Description | Testing |

    |---|---|---||

    | Level 1 | Initial | Inconsistent, disorganized | None, ad hoc |

    | Level 2 | Repeatable | Disciplined processes | Some unit testing |

    | Level 3 | Defined | Standard, consistent processes | Uniform projects, unit
    tests run each build |

    | Level 4 | Managed | Predictable processes | Continuous integration testing |

    | Level 5 | Optimizing | Continuously improving processes | Coverage, code quality,
    reports |


    An organization that is highly optimized is less reliant on the heroic effort
    of a few individuals. It is prone to missed deadlines, "death marches", and other
    symptoms of a project that is out of control. With the focus on application scalability,
    it is possible to lose sight of organizational scalability.


    Higher CPM is essential if there is an intention to grow an organization over
    time. Consistent processes and procedures ease the transition of new members to
    the team. They minimize the amount of time lost having each new member a set of
    in-house, undocumented, unforced practices. They lessen the possibility that actions
    taken by masses will stabilize the existing application. In the best case, good
    processes subtly teach employees approaches that will benefit other projects that
    do not yet have controls in.


