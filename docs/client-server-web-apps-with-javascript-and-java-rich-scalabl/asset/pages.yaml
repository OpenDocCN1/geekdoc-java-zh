    # Guidelines


    Unlike technologies whose specifications are dictated by standards committees,
    web APIs are constructed at the whim of a developer. In practice, it makes sense
    to create APIs that conform to the expectations of the broader development community.
    The following sections reflect the significant influence of REST on development
    of light-weight web services. They are suggested guidelines for designing easily
    understandable and usable web APIs.


    # Nouns as Resources; Verbs as HTTP Actions


    As dictated by REST, resources are nouns. Nouns in a RESTful system are represented
    in the URL path and are used to manipulate the resource referenced. Actions are
    verbs that correspond with functions and are used to manipulate the resources.
    Verbs in a RESTful system are specifically related to HTTP operations.


    Resources correspond with objects, entities, or tables in other design approaches.
    Nouns are modeled as classes in UML class diagrams. They are modeled as entities,
    which are often later implemented as tables in relational databases in Entity
    Relationship Diagrams (ERDs).


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_146_0.png)


    UML class diagrams and ERDs are related in that they are notations based on mathematical
    graphs, but include additional semantics to indicate what nodes and edges represent.


    UML and ERDs are not unique in giving special attention to nouns. REST gives them
    a place of prominence as well. Table 8-1 shows the correspondence between these
    systems. In REST, nouns are represented as resources; in UML class diagrams, they
    are classes, and in ERDs, they are entities that are implemented as database tables.
    Methods used to decompose domains for presentation on class or ERD diagrams can
    be used when analyzing and modeling a system for a REST API. This is especially
    true in systems that map well to CRUD operations.'
