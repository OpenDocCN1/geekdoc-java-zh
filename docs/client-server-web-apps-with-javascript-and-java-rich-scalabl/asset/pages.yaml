    # # Conclusion


    In the 1980s, the term "virtual reality" was popularized by Jaron Lanier. Movies,
    video games, and sophisticated simulations have benefited from VR advances since
    then, the world of virtualization that had a larger scale impact among computer
    professionals is the virtualization of computer hardware itself.


    Java''s success is largely due to the Java Virtual Machine, an abstraction layer
    that hides underlying operating system details. Servlet containers and JEE application
    servers provide an additional level of abstraction. The development of higher
    levels of abstraction allows a higher degree of specialization by removing entire
    classes of problems from the immediate problem space. Client-server applications
    easily run on highly scalable solutions using modern virtualization and can be
    discretely packaged for easy deployment due to their structured, compartmentalized
    architecture. There is obviously tremendous benefit to be found in technologies
    that are in essence the same as—yet not formally equivalent to—some underlying
    layer of functionality.


    It seemed fitting to open a chapter on virtualization with a quote from a fictional
    character. A compelling character in a movie—no matter how engaging—is distinct
    from a real person. Even so, virtualization in its many forms initiates underlying
    technology in a way that can make it appear from certain vantage points indistinguishable
    from the physical representation it emulates.'
