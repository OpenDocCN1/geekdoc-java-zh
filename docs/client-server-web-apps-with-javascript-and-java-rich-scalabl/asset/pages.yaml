- img_proc: true
  md: '# Table B-3. Successful status codes 2xx


    | Code | Meaning | Description |

    |---|---|--|

    | 200 | OK | Accepted |

    | 201 | Created | A new resource is being created |

    | 202 | Accepted | Accepted, but processing not complete |

    | 203 | Non-Authorative Information | Subset or requested metadata returned in
    the entity header |

    | 204 | No Content | No response body included |

    | 205 | Reset Content | Client should initiate a request to view the resource
    associated with the initial request |

    | 206 | Partial Content | Response to a request that included a range header |


    # Table B-4. Redirection status codes 3xx


    | Code | Meaning | Description |

    |---|---|--|

    | 300 | Multiple Choices | Resource is available in multiple representations in
    different locations |

    | 301 | Moved Permanently | Resource has been assigned a new URI |

    | 302 | Found | Resource has been assigned a new temporary URI |

    | 303 | See Other | The requested is available under a different URI |

    | 304 | Not Modified | Response to a conditional GET request where the document
    has not been modified |

    | 305 | Use Proxy | Requested resource is accessible through a returned URI of
    the proxy |

    | 306 | (Unused) | Not used in current HTTP version |

    | 307 | Temporary Redirect | The requested resource resides temporarily under
    a different URI


    # Table B-5. Client error codes 4xx


    | Code | Meaning | Description |

    |---|---|--|

    | 400 | Bad Request | Request not understood |

    | 401 | Unauthorized | Request not authorized |

    | 402 | Payment Required | Reserved for future use |

    | 403 | Forbidden | Request not allowed (even with additional authorization) |

    | 404 | Not Found | Resource not found |

    | 405 | Method Not Allowed | Invalid HTTP method for the specified URL |

    | 406 | Not Acceptable | Resource can be generated using the content specified
    in the accept headers |

    | 407 | Proxy Authentication Required | Request not authorized (authentication
    required through a proxy) |

    | 408 | Request Timeout | Client did not make a request in the time specified
    by the server |

    | 409 | Conflict | Request not completed due to the current state of the resource
    (e.g., changing due to a PUT) |

    | 410 | Gone | Resource is no longer available |

    | 411 | Length Required | Content-length header required |

    | 412 | Precondition Failed | A precondition in the request-header fields evaluated
    to false'
