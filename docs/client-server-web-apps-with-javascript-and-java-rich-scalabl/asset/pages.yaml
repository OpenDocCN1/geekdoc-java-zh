    —Douglas Crockford


    Thus Douglas Crockford summarizes JavaScript as the language that many use but
    few learn. His book goes on to identify parts of the language that are legitimately
    useful and powerful and points out that are truly problematic and best avoided.
    If you are a programmer required to extensively use JavaScript, it simply makes
    sense to take the time and energy to study it thoroughly. Crockford''s approach
    makes the programmer''s learning more manageable by effectively ignoring large
    parts of the language and focusing on a powerful and concise subset.


    In addition to learning JavaScript itself (later standardized under the name ECMAScript),
    you need to invest time learning about the specific programming environment. While
    other languages run on underlying operating systems, relational databases, or
    host applications, JavaScript was designed originally to run in a browser. The
    ECMAScript Language Specification explicitly states this.


    ECMAScript was originally designed to be a Web scripting language, providing a
    method- to enliven Web pages and to perform server computation as part of a Web-based
    client-server architecture.


    — ECMAScript Language Specification


    The core JavaScript language needs to be understood in relation to the document
    to two distinct APIs: the Browser Object Model (BOM) and the Document Object Model
    (DOM). The BOM'
