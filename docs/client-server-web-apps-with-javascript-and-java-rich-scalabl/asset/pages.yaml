  md: '# CHAPTER 13

    Testing and Documentation


    > Without language, thought is a vague, uncharted nebula.

    Nothing is distinct before the appearance of language.

    —Saussure


    James Lind was an 18th-century Scottish physician. While serving in the Navy,
    he conducted what today might be described as the first clinical trial. By dividing
    a dozen sick into groups of two and providing a controlled diet and specific treatments,
    he was able to determine that oranges and lemons were effective for warding off
    scurvy. We know today that scurvy is a result of vitamin C deficiency, but it
    would take a century of similar experiments to eventually lead Casimir Funk to
    coin the term “vitamin” in 1912.


    Clinical trials are an application of the experimental method of the scientific
    method. Oxford Dictionary describes the scientific method as “method of procedure
    that has characterized natural science since the 17th century, consisting of systematic
    observation, measurement, and experiment, and the formulation, testing, and modification
    of hypotheses.\ This definition, while accurate, does not capture one of the important
    outcomes of repeated experimentation, the characterization of phenomena and development
    of hypotheses that are articulated in clear, unambiguous language. Testing at
    its best leads to crisp, clear descriptions of the subject being that allow subsequent
    researchers to more clearly communicate.


    Software testing finds its roots in this same tradition. It essentially adopts
    procedures that have been practiced in the natural sciences for the past 400 years.
    Testing is done to prove or disprove hypotheses. In the case of software testing,
    this involves an assertion that all or part of a system functions as specified. Software
    testing can also lead to insights into how an application might be better designed,
    modularized, and structured. In addition, it can help clarify requirements and
    identify precise language to describe the system being scrutinized.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# # Types of Testing


    Most software development projects include some claim of being tested, but what
    precisely is meant by this is not necessarily evident. Testing is a broad subject
    and can be subdivided on the outcome of testing, the construction of the tests,
    the portion of an overall system being tested, or the role of the people involved.


    # ## Formal Versus Informal


    Ad hoc testing is used when the purpose of testing is not clear and the outcome
    is expected to be informal or arbitrary. It is analogous to exploratory programming
    in an REPL. It is a preliminary step to other forms of testing and is a way of
    kicking the tires of an unfamiliar system. Formalized acceptance testing is on
    the opposite end of the spectrum, as it is structured, organized, defined, and
    specifically intended to determine whether the customers are going to accept a
    system. Informal testing is generally a manual endeavor, whereas formal methods
    can be highly automated.


    Rather than memorizing a laundry list of testing methods and methodologies, it
    is more important to understand the goal of testing and choose an approach that
    is rigorous enough for the project without adding unnecessary overhead. As shown
    in Figure 13-1, in the case of test formality, a continuum can be visualized that
    comprises the range of possible choices. Though the simplistic method was cited
    in this chapter, the selection of applicable test approaches for a given project
    is more an art than a science.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_217_0.png)


    # ## Extent of Testing


    The extent of testing can vary a great deal. Simple smoke tests (sanity tests)
    can be carried out to provide minimal assurance of no obvious disruptive effects,
    whereas exhaustive testing is intended to exercise every aspect of a system. The
    extent to which a system has been tested can be quantified from different perspectives.
    Test coverage analysis indicates which lines of code are being tested. Even in
    a system that has'
  merge: -1
  pgno: 217
- img_proc: true
  md: '100% coverage, every possible permutation of inputs is required to substantiate
    a claim of exhaustive testing. Few projects can make such a claim, but those do
    might only be exercising the functional aspects of the system.


    Nonfunctional attributes of a system can be tested as well, including load testing,
    stress testing, and testing on diverse platforms, browsers, or devices. Cloud
    deployments led to innovations in testing that have pushed the boundaries of testing
    to include intentionally introducing significant system failures to ensure system
    resilience. For instance, Netflix''s Chaos Monkey runs within Amazon Web Services
    and verifies the ability of a system to withstand repeated server failures by
    seeking out and terminating VM instances in Auto Scaling Groups.


    # Who Tests for Whom?


    The time, manager, creator, and audience for tests are also significant concerns.
    Unit tests can be created by developers before code is written or added when it
    is all complete. Black-box testing generally involves higher-level functional
    tests written by testers without reference to the software internal structure.
    Unit tests are tied closely to implementation in code, while black-box tests created
    without reference might evaluate evaluate a single aspect of a system, whereas
    integration testing can ensure defects do not exist in interfaces between related
    systems.


    Testing can also be considered in terms of the people who create the tests and
    evaluate the results. The audience for test is initially developers, later, QA
    analysts and eventually those to accept a system is viable. Tests can be authored
    by different parties, including testers and developers. Since tests are created
    in relation to requirements, there can be significant involvement from business
    analysts and stakeholders involved in defining requirements. In fact, the definition
    of tests can contribute to the development of a common, unambiguous language for
    all parties involved in testing a system.


    # Testing as an Indicator of Organizational Maturity


    In practice, requirements for a software system can reside in many places and
    exist in many forms. Although documentation is generally assumed to be a primary
    source, not all projects have formally defined requirements and a system description,
    these tend to quickly become outdated in an actively developed system if not automatically
    generated or intentionally maintained. There are instances where a programmer''s
    memory or comments in code specifically describe behavior. In the absence of these,
    the source code itself might be the only remaining formal description of system
    functionality. The inaccessibility of source code is an excellent reason why tests
    can serve as the most accurate final definition of software requirements outside
    the system itself.'
