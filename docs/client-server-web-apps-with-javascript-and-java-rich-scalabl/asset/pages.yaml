    an application server. One is to bundle the web application with the application
    server. The application server, though separate and distinct, is installed alongside
    the application at the time of deployment, as shown in Figure 11-5.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_195_0.png)


    Figure 11-5. Server alongside the web application


