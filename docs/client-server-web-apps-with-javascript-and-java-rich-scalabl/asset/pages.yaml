  md: '# Conclusion


    The immediate feedback provided by CLIs makes them a particularly effective tool
    despite the move toward graphical methods. Scripts can be constructed by iterative
    experiments within a CLI, and this process removes not only the traditional build
    step but even the need to specifically execute a source file. This type of interaction
    is well understood by many developers, but those who have focused on Java might
    have had limited exposure. The JavaScript console available in modern web browsers
    is a modern implementation of a CLI, and as this chapter illustrates, similar
    server-side processing is available to Java programmers with just a bit of initial
    setup.'
