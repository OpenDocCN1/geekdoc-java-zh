  md: '# Functionality of Maven


    Maven itself is fairly simple and provides little functionality out of the box.
    Through the use of plug-ins, it can execute a range of standard build tasks and
    can be extended to incorporate any others you can imagine. A few concrete examples:


    +   * Standard testing via JUnit and code coverage reports are included as standard
    features when generating new projects (from Maven project templates called archetypes).

    * A project website can be created using the default wiki-like format Almost Plain
    Text (APT) or other supported option. This site provides a central location for
    project information, contacts, reports, and resources.

    * An embedded application server can run with minimal configuration using a simple
    command (mvn jetty:run) for use during development. This server can also run as
    part of the build itself to support unit tests. Other plug-ins are available to
    deploy applications to your application server of choice.

