    # Sinatra


    Sinatra, as described on its website, is a DSL for "quickly creating web applications
    in Ruby with minimal effort." It wraps HTTP in a Ruby-accessible interface that
    runs on Rack (a common interface for Ruby web servers and web frameworks). A Sinatra
    application is made of routes (each HTTP method paired with a URL-matching pattern).
    A route is associated with a block, which can be used to fill the request (by
    executing Ruby code, rendering a template, and so on.


    Sinatra can also serve static files from a named public by default (see Figure
    10-2). This makes it ideal for creating a set of web APIs in Ruby that back HTML/CSS/JavaScript
    applications. It is by no means to limit this. A standard server-side MVC approach
    involves Ruby-based templates (ERB) in the views directory (by default).


    Sinatra is minimal and sometimes referred to as a microframework. Like the best
    of other Ruby libraries, it stays out of your way and exposes a clear interface
    that can be referenced as you fit.


    Or perhaps more accurately stated, as a Domain Specific Language, it improves
    programmer productivity and communication due to its alignment with the domain
    it represents: HTTP for web applications.


    Sinatra lends itself to being expanded from trivial apps (in classic style) to
    a form considered more suitable for production deployments (written modular style).
    So it is feasible to begin work on a tiny Sinatra app that is gradually built
    out into a final application. Because of its simple and transparent nature, it
    can also be used for proto'
