  md: 'Object orientation (in the classical sense) is not particularly influential
    in the JavaScript community, but other solutions address the challenge of keeping
    variables in sync. These include two-way data binding between model and view components
    (AngularJS) and Functional Reactive Programming, which defines data types that
    represent a value over time (rather than being concerned only about a variable''s
    value at a particular instant).


    # Functional Reactive Programming


    > Functional Reactive Programming (FRP) is a declarative approach to GUI design
    that has been garnering recent attention. Its selling point is that many of the
    constructs addressed directly by jQuery (event handlers, callbacks, and DOM manipulations)
    are not done directly.


    jQuery has its limitations, and separate projects have sprung up to provide niceties
    client-side templates, modularization of code, and management of callbacks. Others
    seek to simplify the complexities of direct DOM manipulation. Many of these can
    be used in conjunction with jQuery, and jQuery''s success in taming browser incompatibilities
    and providing a consistent interface for DOM manipulation have made it an established
    presence in JavaScript development.


    # Project


