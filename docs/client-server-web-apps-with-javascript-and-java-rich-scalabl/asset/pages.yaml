  md: 'Quickest Mock Server Ever

    With this simple setup, client-side developers can begin work while working server-side
    code is not yet available. Mock JSON responses can be created in files within
    a directory structure that reflects the API paths. This JSON response files can
    also be used to essentially document the API and even serve as validation server-side
