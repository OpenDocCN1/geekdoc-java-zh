    image. Packer also compliments Puppet''s functionality, as it can take the artifact
    and turn it into a Vagrant using post-constructors.


    A constant syntax and workflow for configuring VMs for different providers does
    not address provisioning and maintenance concerns. Additional automation can be
    provided through a few shell scripts. Terminal enhancements like cshX for OS X
    to run ssh commands on multiple machines or a tool like Capistrano might suffice
