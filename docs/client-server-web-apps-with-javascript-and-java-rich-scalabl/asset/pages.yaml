  md: '# CHAPTER 6

    Java Web API Servers


    > A man wrapped up in himself makes a very small bundle.

    —Benjamin Franklin


    Packaging makes it possible to extend the capabilities of a language by including
    reusable components. The packaging available for a given language affects deployment
    options. Packaging schemes include consideration for standard naming conventions,
    metadata files, digital signatures, code obfuscation, arrangement of code, inclusion
    of related files/resources, and compression mechanisms.


    Packaging necessarily impacts deployment. The facto deployment options available
    in a language tend to suggest the structure of a project and its development workflow.
    In Java, this is even more pronounced than other languages. Java source file names
    reflect the name of the file system. Java utilizes several specific package types.
    General purpose source code is included in Java Archives (JARs), web applications
    are stored in Web Application Archives (WARs), and groups of related web applications
    can be packaged together in Enterprise Application Archives (EARs). WARs can be
    deployed to servlet containers, while EARS require full Java Enterprise Edition
    support, which is available in application servers like JBoss.


    Java''s paradigm has many benefits but has resulted in a constrained view of deployment
    possibilities. Standard web application development practices in place since Java''s
    initial development required independently installed and configured application
    servers. These are not, in fact, required to deploy Java web applications. Even
    if a web container is used, it is possible to avoid the overhead of installing
    and configuring it prior to beginning development.'
  merge: -1
  pgno: 108
