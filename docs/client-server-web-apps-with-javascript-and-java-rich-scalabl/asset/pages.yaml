  md: '# Technology


    Java web application developers are typically familiar with server-side dynamic
    content. J2EE and JSP have been refined into JEE and JSF. Projects such as Spring
    provide additional capabilities geared towards server-side development. This mode
    of development made a great deal of sense in the early days of the Web, when web
    pages were relatively static, servers JavaScript engines were slow, and there
    were few libraries and techniques to address browser incompatibilities.


    By contrast, a more client-server approach involves a server largely responsible
    for providing access to resources (typically communicated as messages in XML or
    JSON) in response to client requests. In the old server-driven approach, the browser
    requested an page and it was generated (along with relevant data) for rendering
    in the browser. In the client-server approach, the server serves pages with little
    data. The page makes asynchronous requests to the server as the user interacts
    with it and the server simply responds to these events that cause the current
    page to be updated.


    Initial web development consisted of the creation of static HTML sites. Later,
    these sites were augmented with dynamic content using server-side processing (CGI,
    Java Servlets). Subsequently, more structured language integration emerged using
    server-side templating (ASP, PHP, JSP) MVC frameworks. More recent technologies
    continue in the same tradition and provide additional abstractions of one or another.


    Based on a desire to shield developers from design concerns and the underlying
    architecture of the Web, component-based frameworks have emerged. Tag libraries
    were an early innovation, and now a component-based approach has been widely adopted
    in several popular frameworks:


    +   - Java Server Faces (JSF), an XML-based templating system and component framework
    with centralized configurable navigation.

    - The Google Web Toolkit is another component framework that leverages the abilities
    of programmers by letting them focus on Java coding with little need to directly
    modify HTML, CSS, or JavaScript.


    Each of these frameworks has its place and has been used successfully in production
    systems. But like many solutions that try to hide underlying complexities, their
    usage is problematic in situations where you need greater control (such as the
    ability to integrate large amounts of JavaScript or you do not conform to the
    framework assumptions (for instance, availability of server sessions). This is
    because these solutions attempt to hide the fundamental architecture of the Web,
    which uses an HTTP request-response protocol following the client-server computing
    model.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Browser innovations also led to a shift of responsibility from the server to
    the client. In the late 1990s, Microsoft developed the underlying technologies
    that led to Ajax (a term coined on February 18, 2005 by Jesse James Garrett).
    Ajax is an acronym for "asynchronous JavaScript and XML," but it is generally
    applied to various technologies used to communicate with the server within the
    context of a given web page. This allowed small messages to be sent, which made
    much better use of bandwidth when designing JavaScript-based applications. Browser
    performance has increased significantly due to processor improvements and optimizations
    to JavaScript engines, so it has made sense to offload more work from the server
    to the browser. User interface responsiveness has evolved to a new level of sophistication.


    Mobile devices browsers have also provided an additional incentive to further
    client-side code from the server. In some cases, a well-designed architecture
    leveraging responsive design principles can be created. If this is not an option,
    a single consistent API available for all devices is very appealing.


    Roy Fielding''s doctoral dissertation in 2000 led Java EE to new APIs that deviated
    from the previous component-based trajectory. JAX-RS (Java API for RESTful Web
    Services) and Jersey ("production quality reference implementation") are designed
    to create applications reflecting a client-server architecture with RESTful communications.


    # Software Development


    In the past, setting up a new project was a rather monumental task. A vast array
    of configuration options made it tedious and error-prone. Very little was automated,
    as the assumption that each project would have unique characteristics that developers
    would want to account for meet their specific requirements.


    Later inferences led to innovations that made setting up a project much simpler.
    "Convention over configuration" was an influential mantra of the Ruby on Rails
    community. Maven and other projects also chose sensible defaults and target easy
    setup for a subset of use cases.


    The availability of scripting languages on the JVM makes it possible to speed
    development by bypassing the somewhat rigorous type checking of Java. Languages
    like Groovy, Python (Jython), and Ruby are loosely coupled and constructed in
    a manner that requires less code to achieve equivalent functionality. So-called
    microframeworks like Sinatra or Play provide minimal Domain Specific Languages
    (DSLs) to quickly write web applications and services. And today, it is a trivial
    task to set up a minimal set of web services in a development environment.


    The failure of enough large-scale waterfall-style projects has also made it clear
    that there are many advantages to producing a small-scale version of the final
    product. A prototype (or prototypes) of the final product can serve many purposes:'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   - Verify technical foundation of the project

    - Create constructs that bridge disparate technologies to be used together

    - Allow end user interaction to clarify intended usage and user interface design

    - Allow system designers to clarify the interfaces and data structures to be passed
    between systems

    - Allow programmers to work on different parts of the application in parallel


    Prototypes have numerous benefits:


    +   - They are a specific, tangible asset representing the final system to be
    designed. As such, they incorporate information that is otherwise stored in design
    documents, diagrams, and other artifacts (and frequently in more informal locations
    like email and people''s memories of water-cooler conversations).

    - Prototypes are concrete implementations. As such, they present the requirements
    in a much more tangible form. This can lead to a better understanding of the extent
    and quality of the requirements gathered, and can suggest areas where there is
    need of clarification.

    - Prototypes can immediately expose points of failure that are not apparent before
    attempting a specific implementation.

    - The preceding benefits can lead to better estimates and scheduling due to a
    more comprehensive understanding of what is intended.


    Prototyping can be leveraged extensively in client-server web development because
    of the clear and unambiguous separation between the client and server. Prototypes
    of the server can be provided to the client developers (and vice versa) while
    development proceeds in parallel. Or development is not proceeding in parallel,
    server-side calls can be quickly stubbed out that client-side code can be developed.


    # What Has Not Changed


    The fundamental nature of the Web (a client-server architecture transmitted over
    HTTP) has not changed.


    New technology does not change everything. High-level programming languages have
    not removed the need to understand operating system specifics. Object-relational
    mapping frameworks have not removed the need to understand relational databases
    and SQL. In like manner, there have been consistent attempts to ignore the underlying
    architecture of the Web in an effort to emulate the experience of desktop applications.'
  merge: -1
