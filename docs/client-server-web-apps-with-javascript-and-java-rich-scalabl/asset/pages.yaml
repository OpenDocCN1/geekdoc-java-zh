  md: 'This chapter points out the variety of languages that can be run on the Java
    platform. This allows the possibility of choosing the best language for a particular
    task or group of people. This chapter also describes Maven as a tool that promotes
    a variety of established practices related to programming with groups of people.


    # Java Language


    Although Java is a mature, stable, and well-known language, there are challenges
    with its usage in instances because of its design as a class-based, statically-typed,
    object-oriented language. It is helpful to acknowledge areas where there might
    be a mismatch between technologies and to consider alternatives up front that
    might alleviate the disjunction altogether.


    Developers are familiar with the challenge of integrating an object-oriented language
    (like Java) with a relational database system in all the most trivial of cases.
    Although some of the tension can be mitigated by altering usage practices, there
    is always a layer of mapping involved due to fundamental philosophical differences
    between the object-oriented and relational model.


    This is not unique to Java; such a tension exists between JSON and REST. REST
    requires links as defined in the HATEOS Uniform Interface constraint. JSON, as
    a subset of the JavaScript language, has no structure. Neither implementation
    is inherently wrong, but they have different origins that result in incongruities
    when they are integrated.


    A similar tension exists between object-oriented systems and REST. In an object-oriented
    system, you take actions on an object itself. In REST, a resource is manipulated
    through its representation. This additional level of abstraction allows resources
    to be manipulated through a common interface not available by default in an object
    system.


    Java developers have devised specific libraries that can be used to address most
    translation or integration activities related to interfacing with other technologies.
    In addition, a component of the Java platform itself introduces the possibility
    of using an entirely different language is the Java Virtual Machine (or JVM).


    # Java Virtual Machine (JVM)


    Java is translated into bytecode, which is executed on the JVM (see Figure 4-1).
    Because Java was designed to be executable cross-platform, JVMs have been developed
    and refined for a wide range of operating systems, from high-powered servers to
    embedded device implementations.'
