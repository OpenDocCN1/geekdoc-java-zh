  md: '# Considered Harmful


    In 1968, Edsger W. Dijkstra published a letter entitled "Go To Statement Considered
    Harmful". Besides being of interest because it made a considerable impact on reducing
    the use of the 70 go statement in structured programming, it introduced the phrase
    "considered harmful" into hacker culture. Tom Christians argued against programming
    in csh. Douglas Crawford published a blog post entitled "With Considered Harmful".
    The phrase has appeared in many other settings as well, and despite the amusingly
    self-referential "Considered Harmful Essays Considered Harmful" by Eric A. Meyer,
    the phrase continues to appear.


    Although "Considered Harmful" attention articles are not always equal of merit,
    the theme arises out of valid recognition that just because a language feature
    or technical solution is available, does not mean it is a great purpose, long-term
    solution.


    # Why Client-Server Web Applications?


    There are a number of advantages to a client-server approach to web development.


    # Code Organization/Software Architecture


    There are clear advantages to being able to decouple logical sections of code
    and promote higher cohesion both in the original construction and ongoing support
    of any system. The clear separation between client and server tiers makes for
    manageable, modular sections of code. In addition, data and display markup can
    be more clearly separated. The data be delivered in JSON rather than inline. This
    is consistent with the modern JavaScript notion of unobtrusive JavaScript where
    a page''s behavior, structure, and pre-presentation are separated.


    Flexibility and code reuse are a logical outcome of good organization. There is
    flexibility at many stages in the application life cycle when sections of code
    can be developed in relative isolation (APIs can be exposed, mobile device clients
    created, new versions of sections of the application tested and released independently).
    Code reuse is more likely when there are clear components. At minimum, the RESTful
    APIs can be used to serve data to a wide range of browsers and mobile devices.


    Component approaches tend to introduce brittle coupling and are less adaptable.
    There is no way to plug in a frontend easily.


    # Flexibility of Design/Use of Open Source APIs


    Component-based approaches include tightly integrated server-side code that requires
    specific JavaScript technology. They also generate HTML and CSS that limits the
    options'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'available from a design and behavior perspective. A distinct client running
    JavaScript can take advantage of the latest libraries that ease browser compatibility,
    standardize DOM manipulation, and provide complex widgets.


    # Prototyping


    Prototyping works well with client-server applications due to the clear separation
    between tiers. As previously mentioned, prototypes can test and verify initial
    ideas. They help clarify vague notions and facilitate clear communication regarding
    requirements. They help inspire and generate new ideas as people interact with
    more concrete than a long text description or a series of pictures. Bad ideas
    and inconsistencies can be quickly recognized and eliminated. Used correctly,
    prototypes can save time, money, and resources and result in a better final product.


    # Developer Productivity


    Besides the ability to prototype either the client portion or the server component
    (or both), work can be split cleanly, and development can progress in parallel.
    The separation allows sections of code to be built in isolation. This prevents
    the problem in component approaches where a server is required every time a page
    is changed during development. Development tasks require less time and effort,
    changes are less complex, and troubleshooting is simplified.


    This is especially evident when a need arises to replace, upgrade, or relocate
    server-side code. Changes can be done independently, without affecting the client.
    The only limitation is that the original interface, specifically the URL and message
    data structure, must remain available.


    # Application Performance


    User experience is greatly impacted by the perceived performance of a page in
    the browser. Faster JavaScript engines allow the client to perform computationally
    intensive operations so server workload can be effectively offloaded to the client.
    Ajax requires small amounts of data to be retrieved when needed so full page reloads
    occur infrequently and less data is sent in the intervening requests. Users perceive
    a snappier, more immediate response as they interact with an application.


    There are many benefits to stateless design that ease the lives of developers
    and support staff. Resources dedicated to session management can be freed up.
    This simplifies load-balancing and configuration that would otherwise be required.
    Servers can be easily added to accommodate increased load allowing for horizontal
    scalability. This replaces the unwieldy process of hardware upgrades traditionally
    used to increase throughput and performance.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'The benefits ever extend to the simplification of the overall architecture
    of a system. For instance, problems related to maintaining state are extremely
    challenging in a cloud-based environment. When using traditionalful sessions,
    it is challenging to efficiently persist data that it is readily available across
    multiple requests within a user''s session. If data is stored on a backend server,
    subsequent requests directed to different servers will not have access to it.
    Possible solutions include:


    +   - Use an application server that supports clustering and failover. Weblogic
    uses the concept of managed servers, for instance. These solutions require additional
    management and vary in each application server implementation.

    - Use session affinity or sticky sessions. In this scenario, all requests within
    a user are sent to the same backend server. This does not provide automatic failover.

    - Utilize a separate centralized data store. Typically this involves persisting
    data in a database. This option may not provide the best performance.

    - Store the data on the client side. This avoids the performance problems associated
    with storing data in a database as well as the failover issues with sticky sessions.
    This is because any backend server can handle each client''s request.


    The move toward avoiding server-side state management is becoming more prevalent.
    Even a framework like JSF, which is designed for the traditional server-side management
    of user sessions, is adding features for stateless functionality.


    There are few inherent challenges in creating client-server applications. It is
    necessary to embrace JavaScript as a first-class development language in its own
    right. This means learning the language in some depth, utilizing available libraries,
    and adopting mature development techniques. Areas of application architecture
    that were previously generally accepted require a different design, such as practices
    regarding session management. There is no carefully defined standard for client-server
    web applications. Certain parts of JEE, such as JAX-RS, provide some clarification;
    others as JSF do not apply.


    Beyond the initial learning (and unlearning) curve, a client-server approach for
    building web applications is extremely effective and stable. The clear separation
    of responsibilities between client and server allow for easy modification extension
    to a code base. A recognition of the essential nature of the Web reduces problems
    that result from tempting to obscure its design. The capacity for horizontal scalability
    far exceeds what is possible using other patterns of design.'
  merge: -1
  pgno: 29
