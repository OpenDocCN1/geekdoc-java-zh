  md: "# Unit Testing\n\nThere are a number of unit testing frameworks that have been\
    \ developed for JavaScript. Jasmine is a Behavior-Driven Development framework\
    \ with no dependencies and a simple syntax that will be used in this book.\n\n\
    Java unit tests can be executed each time a project is built by the build tool\
    \ or. JavaScript can use a node module Karma, which was formerly known as Testacular\
    \ to execute unit tests on a variety of different browsers each time a source\
    \ code file is changed and saved! This is really worth noting. If you are disciplined\
    \ about your creation of unit tests, the ability to run them each time a source\
    \ file is saved can result in early identification of otherwise obscure bugs.\
    \ This is especially valuable when working with languages like JavaScript that\
    \ not use a compiler to perform initial code validation. Frequent, effective unit\
    \ tests serve as a sort of pseudo-compiler. They provide immediate feedback regarding\
    \ the quality of the code and catch bugs as soon as they are introduced.\n\n#\
