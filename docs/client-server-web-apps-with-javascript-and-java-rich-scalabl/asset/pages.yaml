  md: '# HSQLDB


    HSQLDB is known for its inclusion in open source projects like OpenOffice as well
    as commercial products like Mathematica. Unlike H2, a username and password are
    not required when getting the connection, and a VARCHAR length is required in
    the name column:


    ```

    load ''dbutils.rb''


    require ''jdbc/hsqldb''

    Jdbc::HSQLDB.load_driver


    conn = java.sql.DriverManager.getConnection(''jdbc:hsqldb:test'')

    exec(''CREATE TABLE test (id, name varchar(10))'', conn)

    exec(''INSERT INTO test (id, name) VALUES (1, ''a'')'', conn)

    displayResultSet(execQuery(''select * from test'', conn))

    exec(''DROP TABLE test'', conn)

    conn.close()

    ```


    # Derby


    Derby is an Apache project whose lineage goes back to the 1990s. It has continued
    through various incarnations at CloudScape, Informix, and IBM. Since Java 6, Sun
    (later acquired by Oracle) included Derby in the JDK as Java DB. create=true attribute
    in the JDBC connection string ensures that database be created if it does not
    exist when the connection is requested. In addition, Derby requires a result set
    to be explicitly closed before dropping a table that references it:


    ```

    load ''dbutils.rb''


    require ''jdbc/derby''

    Jdbc::Derby.load_driver


    conn = java.sql.DriverManager.getConnection(''jdbc:derby:test;create=true'')

    exec(''CREATE TABLE test (id, name varchar(10))'', conn)

    exec(''INSERT INTO test (id, name) VALUES (1, ''a'')'', conn)

    r = execQuery(''select * from test'', conn)

    displayResultSet(r)

    r.close()

    exec(''DROP TABLE test'', conn)

    conn.close()

    ```


    Although relational databases were the focus of the previous example, it should
    be obvious that any Java library can be accessed via a script and explored using
    a similar process.'
  merge: -1
