- img_proc: true
  md: '# Code on Demand


    The ability to provide code on demand—through JavaScript or embedded browser applications—is
    allowed in REST but not required. This opens up a wide range of possibilities
    in how an application might be extended. The downside is a reduction in visibility
    otherwise inherent to RESTful systems (especially in the case of objects like
    Java Applets).


    # HTTP Response Codes


    When developing REST APIs, standard HTTP status codes (shown in Appendix B) provide
    feedback to the client and report potential errors. The exact nature of a given
    response can be dependent on the HTTP method in use.


    # What Is Success?


    There is no widespread agreement on the use of HTTP codes in web APIs. In part,
    this is because the responses are not aligned with the HTTP verbs, but with five
    categories of occurrences: successful request, redirect, error on the client side,
    or error on the server tier. In some cases, the response code appropriate to a
    call is evident, but in others, it is dependent on the specific API call or discretion
    of the API designer.


    Take for instance a (nonspecific) success (200). This is recognized as the proper
    response to a successful GET in most cases. In fact, HTTP 1.1, it is specifically
    listed in regards to GET and POST. The response depends on the HTTP request type,
    as indicated in Table 3-2.


    | HTTP verb | Expected response content |

    | GET | An entity corresponding to the requested resource |

    | HEAD | The entity-header fields corresponding to the requested resource without
    any message-body |

    | POST | An entity describing or containing the result of the action |

    | TRACE | An entity containing the request message as received by the server |


    And though some would also use an HTTP 200 in response to a PUT or DELETE, other
    codes could be used. A HTTP 201 (created) is used by some APIs in the case of
    a PUT or POST. A 204 (no content) might be used for a DELETE that returned no
    other response, but might also apply to other verbs (even a GET) if a request
    is successful but the server intentionally does not return content. If a web application
    is using basic authentication, the logoff can be accomplished by returning an
    HTTP 401 (not authorized) response code to the browser. So the definition of success
    depends on the context,'
