  md: 'He also emphasized JSON''s advantages over XML:


    +   - Response sizes are smaller because begin and end tags and metadata require
    additional spatial space in XML.


    +   - JSON interoperability is better with web pages. It is a subset of JavaScript
    making client-side integration trivial.


    +   - The previous two characteristics result in performance benefits and ease
    of integration in the context of Ajax calls.


    JSON does have a few quirks worth noting:


    +   - JSON is "almost valid" JavaScript.


    +   - There is no way to specify a comment in JSON.


    +   - As previously mentioned, because it is a subset of JavaScript, it can be
    consumed by JavaScript eval(). However, the value of eval() is dangerous. It is
    often said that "eval() is evil."


    +   - The same origin policy that is in most web browsers prevents JSON from being
    evaluated from a separate site. JSONP (sometimes referred to as JSON-P or "JSON
    with padding") has been used to request data from a server in a different domain
    (via HTTP GET). A call to a function already defined in the caller''s environment
    used manipulate the JSON data. This function is the cause of the "padding" used
    in this approach. More recently, Cross-Origin Resource Sharing (CORS) has been
    developed as a more robust, secure alternative to JSONP. CORS uses HTTP headers
    to allow servers from specified domains to serve resources. It requires specific
    server-side configuration for the service emitting the JSON to operate.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_64_0.png)


    Comments in JSON

    The fact that JSON does not allow comments is a surprising and has led to various
    workarounds. One is to add "comment" elements to JSON objects with comment content
    as a corresponding value. One possibility that should be avoided is creating two
    elements with the same name and assume that the parser will choose the last one.
    For example:


    ```

    ("a":"This is a comment", "a":"CONTENT"})

    ```


    Although this happens to work in a number of JSON parsers, it is a result of their
    implementation and not a part of the specification.


    JSON (JavaScript Object Notation) | 45'
