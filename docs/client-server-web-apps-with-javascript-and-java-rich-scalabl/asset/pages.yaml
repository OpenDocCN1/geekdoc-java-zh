- img_proc: true
  md: 'The stateless design of REST is one of the most challenging aspects for many
    developers to comprehend. It requires some significant adjustments to typical
    web development practices. The benefits are many, and the performance concerns
    due to the entire state being contained in each request are not insurmountable,
    especially when REST''s next constraint is considered.


    # Cacheable


    The performance issues associated with REST''s stateless constraint can largely
    be compensated via caching. REST requires that data be labeled to indicate whether
    or not it is cacheable. This allows a client application to reuse cacheable responses
    rather than making frequent requests at a later point. Like caching in any system,
    this can provide a performance boost to the client application but also introduces
    the standard complexities associated with proper cache validation to avoid state.
    In the context of the Web, caches can be maintained client-side (in the browser),
    server-side, or in between (a gateway or proxy server).


    # Uniform Interface


    A uniform interface stipulates a common way to address resources that all REST
    applications use. Every REST system therefore has a common structure immediately
    evident to those familiar with the architecture. This severely restricts the ability
    to customize an interface for application-specific needs, but there is a great
    deal of flexibility within the constraint bounds. HTTP itself has been enhanced
    in each version to provide additional mechanisms available for RESTful design
    (the inclusion of new method methods, for instance). This particular constraint
    actually includes a number of other constraints that comprise it (see Table 3-1).


    Table 3-1. Uniform interface constraints


    | Uniform interface constraint | Description |

    | --- | --- |

    | Identification of resources | Resources are addressable through URIs. |

    | Manipulation of resources representations | The resource is the thing represented.
    Its representation is what is sent in the request (e.g., the XML/JSON document).
    |

    | Self-descriptive messages | Stateless requests use HTTP verbs. |

    | Hypermedia as the engine of application state | HATEOAS: Availability of links
    that dictate how the application state can be changed. |


    # Layered


    A layered design allows for network components to interact with each request on
    route. Each component does not have visibility with the layer with it is communicating.
    This means that familiar network devices like firewalls and gateways can be in
    use, and caching or translation can be done by proxy servers.'
