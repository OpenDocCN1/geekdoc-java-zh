- img_proc: true
  md: '# 11-2: Jboss web admin


    JBoss, being a full-featured application server, bundles many useful modules,
    which minimize the amount of code to include with a WAR. It can also result in
    obscure errors if similar modules exist both within JBoss and within your application.
    The WAR associated with this chapter includes Jersey among its dependencies. Including
    Jersey could result in an error during deployment. The error is reported by RestEasy
    (included with JBoss), which scans by default and identifies Jersey as a conflicting
    JAX-RS implementation. The solution is to add context parameters to the web.xml
    to disable this scan:


    ```

    <context-para>

    <param-name>resteasy.scan</param-name>

    <param-value>false</param-value>

    </context-para>

    <context-para>

    <param-name>resteasy.providers</param-name>

    <param-value>false</param-value>

    </context-para>

    <context-para>

    <param-name>resteasy.resources</param-name>

    <param-value>false</param-value>

    </context-para>

    ```


    The solution is simple enough but highlights the point that although JEE specifies
    clearly defined packaging mechanisms, it is ambiguous about which services will
    be included in


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_191_0.png)'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'a given deployment environment. These types of idiosyncrasies are a major reason
    why mantras like, “Write once, deploy anywhere” can only be true with significant
    qualifications when applied to JEE deployment.


    # # Command-Line Administration


    Administrative GUIs are convenient for initial setup of an application. They present
    available administrative options in an easy-to-understand user interface. This
    clarity makes them ideal for learning an application server and reviewing available
    functionality. Like all GUIs, they do not lend themselves to scripting and subsequent
    automation as command-line alternatives. Though a mere convenience for small-scale
    deployment scenarios, they are essential to complex deployment scenarios (or even
    simple ones with a large number of servers).


    JBoss includes a command-line interface that allows administrative actions to
    be taken from a prompt or script. Almost any action in a GUI is available through
    a command-line equivalent. A command-line session is initiated by accessing the
    command-line interface and connect to a running application server. To do so,
    call the cli with the -c option (which immediately establishes a connection to
    the application server):


    ```

    $ bash bin/jboss-cli.sh -c

    ```


    Once logged in, you can use help to get a list of available commands:


    ```

    [standalone@localhost:9999] / help

    ```


    Knowledge of few basics is enough to perform most common actions. To view a list
    of contents available at the particular node path, use the ls command:


    ```

    [standalone@localhost:9999] / ls

    ```


    The JBoss environment can be navigated like an operating system file system using
    cd to change directory and ls to see the content at a given node path. To view
    the WAR that was deployed:


    ```

    [standalone@localhost:9999] / deployment

    rest-jersey-server.war

    ```


    The syntax is not completely consistent with the corresponding operating system
    commands. For instance, additional information about the WAR in the deployment
    directory can be obtained using the ls command and identifying the deployment
    using an equals sign:


    ```

    [standalone@localhost:9999] / ls /deployment=rest-jersey-server.war

    ```


    This design lends itself to executing JBoss CLI commands from an external script.
    The following command prints out the current list of deployments straight from
    an OS command prompt:'
  merge: -1
  pgno: 192
- img_proc: true
  md: '```

    $bash bin/jboss-cli.sh -c --commands=''ls deployment''

    ```


    The availability of a CLI opens the possibility of creating sophisticated scripts
    to interact with the application server well as the operating system and other
    applications. The examples to this point have been limited to query operations,
    but the CLI is not limited to these. It can also take actions which might modify
    the state of the application server, such as deploying or redeploying a WAR:


    ```

    [standalone@localhost:9999 /] deploy rest-jersey-server.war

    [standalone@localhost:9999 /] deploy /tmp/rest-jersey-server.war

    ```


    Administrators can replace manual GUI interaction for a wide range of administrative
    tasks, but the CLI has its own syntax and organization that takes some time to
    understand and use effectively. If the only administrative concern is to deploy
    the application, the GUI and the CLI can be avoided by copying files to a designated
    deployment directory. Copies can be done interactively or via a script, so automated
    deployment is possible without learning the CLI at all. Developers who scripting
    frequent deployment can copy applications and rely on the deployment scanner or
    on hooks integrated into their standard toolchain. **Plug-ins** have been written
    for Maven and other build tools and IDEs that couple the deployment of the application
    with the build process itself.


    # Non-JEE Deployment


    For many years, Java development was synonymous with Java Enterprise Edition.
    It can be jarring (pun intended) for Java developers to realize that the JEE model
    for web application deployment is not the only available, and in fact, might not
    be the best for one given system. Java technology encompasses far more than web
    application development, and JEE is just one approach to web application development
    possible on the Java platform. Figure 11-3 shows the Java web application development
    model.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_193_0.png)


    Figure 11-3. Web development in Java


    A non-JEE web application deployment does not require the existence of a previously
    installed application server. From the perspective of a Java web application,
    the appli-'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'cation server providing its context might be *outside, inside, or alongside
    it*. These options are not unique to application servers but also might apply
    to other software that provides an independent service (such as a database).


    # Server Outside


    Application servers are complex, mature pieces of software that have been around
    for years. In one time, due to space and processing limitations as well as configuration
    complexities, the only option was to expend a fair amount of time and effort before
    installing them. Once installed, a web application could be installed and configured
    to connect to these existing services. The web app ran "on" a server, as shown
    in Figure 11-4. The app server functioned as the deployment target for the web
    application, outside of the web app itself.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_194_0.png)


    Figure 11-4. Server outside the web application


    This approach is the de facto JEE method for deployment described earlier in the
    chapter. It works well when your application needs to be deployed to an internal
    system that is already running an application server, or when you want to host
    multiple web applications and JEE packages on a single web application. In many
    cases, there is precious little administration required for an application. An
    application server or container might be required to run it, but no administration
    is expected. This led developers to defer deployment of the application server
    until the web application itself was deployed.


    # The Trend Toward Lightweight Containers


    The trend away from large, monolithic, manually configured installations of application
    servers is part of a larger trend toward virtualization and lightweight deployment
    of applications. The advent of cloud-based deployments has led to a much more
    transient view of servers and their contents. This view mandates an approach to
    deployments to make them fast, as simple as possible, and highly automated.'
  merge: -1
