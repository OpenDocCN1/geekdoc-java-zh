  md: '# HATEOAS


    JSON is a very simple and terse format. Unlike other formats that provide elaborate
    systems for the data they represent, only a few data types are available in JSON.
    These data types—strings, numbers, booleans, objects, arrays, and null—are more
    extensive and expressive enough for most applications. Because of JSON''s popularity
    as a data interchange format used by RESTful APIs, you might expect a specific
    type for hyperlinks, but no such type exists! This is especially problematic since
    REST includes a constraint called Hypermedia as the Engine of Application (HATEOAS).


    This constraint restricts a client to interactions through links that are included
    under the term "hypermedia". Therefore, a web API cannot be properly classified
    as "RESTful" in a strict sense because there is no link data type in JSON or in
    JavaScript (upon which it is based).


    XML-based REST APIs often use Atom Syndication Format (where links consist of
    a rel, href, hreflang, and type) in headers. Likewise, JSON extensions provide
    for standardized linking within JSON documents have been developed:


    +   * HAL

    * Siren

    * JSON-LD

    * JSON+JSON

    * Collection+JSON

    * JSON API (extracted from the Ember JS REST Adapter)


    The W3C has a JSON-based Serialization for Linked Data posted on its site (at
    the time of this writing: W3C Recommendation 16 January 2014).


    Many links conform to a similar category or relationship regardless of the entity
    represented. For example, in a collection, there is a convention of referencing
    the first, last, or previous member of the collection. A help, glossary, or about
    link appears and is relevant in many different contexts. Because of these commonalities,
    there have been efforts to standardize link relations as well. An established
    set of link relations would make automatic generation of links much more specific
    and attainable.'
