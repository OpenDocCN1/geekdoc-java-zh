    similar functionality: consistent handling of objects and arrays in a concise,
    functional manner (Lo-Dash, for example, is intended to be an optimized replacement
    for underscore).


    # # Frameworks


    Direct DOM manipulation (à la Query) is a fine approach with small- to mid-sized
    JavaScript scripts. With larger data, it is much easier to manipulate JavaScript
    classes that incorporate interactive data and include additional functionality,
    such as data validation. These classes can then be populated and connected to
    the graphical elements in a page. This type of design has the beneficial effect
    of avoiding direct DOM manipulation. Instead, changes to the data are reflected
    on the page based on the state of the data in. Interaction with the objects (and
    data changes due to external events) result in changes to the state of the model
    that trickle down to all affected components. The first MVC frameworks were created
    many years ago for this purpose, the pattern has been adopted in modern JavaScript
    frameworks. There are several variations of MVC, which include Model-View Presenter
    (MVP) and Model-View ViewModel (MVVM) and so the term MV* is sometimes used as
    a general umbrella to identify these patterns as a group.


    The choice of an initial framework can be rather daunting from the outside. If
    you do not have a particular bias, it can take a bit of effort to make a decision
    about which one to use. Some basic criteria beyond current in-house development
    skills are the functionality of given given framework and popularity.


    # # Functionality


    The list of MV* frameworks is rather extensive and constantly changing. One site
    that provides immediate specific comparison of the functionality of popular frameworks
    is TODO MVC. TODO MVC allows you to compare the implementation of a simple fully
    functional TODO list application in a variety of MV* frameworks.'
