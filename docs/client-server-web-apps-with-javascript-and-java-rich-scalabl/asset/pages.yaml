    # Server Side: Jython


    The Python programming language was initially released in the mid-1990''s by Guido
    van Rossum (its principal author and "Benevolent Dictator For Life"). Python is
    known for its clear, readable, and regular syntax. It differs from many of the
    idioms of C-based languages (like curly brackets). Because of its consistency
    and clarity, it has been adopted in many educational settings as the language
    taught introductory programming classes. Python generally requires fewer lines
    of code than Java to perform a given task.


    Jython is an implementation of Python that runs on the JVM. This allows for the
    creation of clear, concise Python programs that run wherever Java is installed.
    Jython programs can also interact with Java objects, which introduces a range
    of possibilities for embedding Python or using it in conjunction with native Java
    libraries.


    # Python Web Server


    As a scripting language, Python can also be used in ways unfamiliar to Java developers.
    For instance, to run a static web server that serves files from an arbitrary directory
    without writing an original line of code, you can simply navigate to the directory
    and invoke the following:


    ```

    python -m SimpleHTTPServer

    ```


    # Jython Web Server


    Creating a Python-based web server using the SimpleHTTPServer referenced above
    requires only a few lines of code:


    ```

    import SimpleHTTPServer

    import SocketServer

    import os


    os.chdir(''src/main/resources'')

    httpd = SocketServer.TCPServer((", 8000))

    SimpleHTTPServer.SimpleHTTPRequestHandler

    print("serving at port 8000")

    httpd.serve_forever()

    ```'
