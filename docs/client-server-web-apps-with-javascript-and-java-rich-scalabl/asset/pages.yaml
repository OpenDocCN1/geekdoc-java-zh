  md: "# Event Handling\n\njQuery selectors can be used to attach event handlers to\
    \ specific elements. The actual syntax used to this has varied a bit over time.\
    \ Methods such as bind, live, and delegate have been superseded by on and off.\
    \ One challenge introduced with dynamically interfaces is that you might want\
    \ to define an event handler for an element that could come into existence at\
    \ some point depending on user interaction. The solution to this challenge using\
    \ jQuery is to bind the event at a higher level of the DOM. When the event is\
    \ fired, even though the event is not directly associated with the element, it\
    \ will be propagated and handled when the element is selected:\n\n```\n$(document).on('click',\
    \ '.myClass', function() {\n  console.log('You clicked me.');\n});\n```\n\n# Ajax\n\
    \njQuery wraps the XMLHttpRequest browser object into a more usable, simple form\
    \ that behaves in a consistent manner across browsers. jQuery.ajax is a general\
    \ Ajax request, and more specific functions provide a shorthand for commonly used\
    \ HTTP or POST commands. Because of the popularity of JSON communication in Ajax\
    \ applications, it provides a getJSON method as well and provides the ability\
    \ to make calls using JSONP.\n\njQuery is an amazing but relatively simple library.\
    \ The concepts introduced in this chapter cover the bulk of what it is at a high\
    \ level. Books like Code jQuery Cookbook (O'Reilly) are very helpful in showing\
    \ how the library can be used for specific tasks.\n\n# jQuery and Higher-Level\
    \ Abstractions\n\njQuery greatly simplifies cross-browser development and made\
    \ it possible to develop a class of applications with significant Ajax interactions,\
    \ event handling, and DOM manipulation much more easily. Its popularity suggests\
    \ it will continue to be influential for many years. But as web apps have grown\
    \ in size, new approaches have emerged to manage the complexity. Larger-scale\
    \ design patterns (MVC) and programming paradigms (functional programming) provide\
    \ alternatives and complements to the functionality in jQuery.\n\nConsider, for\
    \ example, the simple practice of assigning variables. This basic task becomes\
    \ burdensome as the number of variables in a program (with dependencies on one\
    \ another) begins to grow. Object-oriented programming was popularized the notion\
    \ that an object could encapsulate a group of variables that represent the state\
    \ of an object. The object would be given defined methods to access to and manipulation\
    \ of an object's state."
