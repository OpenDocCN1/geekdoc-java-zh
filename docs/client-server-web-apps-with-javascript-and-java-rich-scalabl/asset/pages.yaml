    \ can be attached to objects and then referred to as methods. A method is implicitly\
    \ passed the object that called. It can access and manipulate data that is contained\
    \ within it. The object is referred to using the this keyword as illustrated here:\n\
    \n```\nvar obj = {}; // Create a new JavaScript object\nobj.myVar = 'data associated\
