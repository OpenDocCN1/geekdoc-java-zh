    | HTTP-based Type I | Y | Y | N | N |

    | HTTP-based Type II | | | Y | N |

    | REST | Y | Y | | Y |


    Both of these classification systems show the admirable purpose of preserving
    Fielding''s strict definition of REST while recognizing the compromises that have
    been made in implementing web APIs.


    # Functional Programming and REST


    Functional programming and REST share a number of common traits. Both are declarative
    in nature and include very little description of control flow. Both have a similar
    view about controlling side effects, maintaining referential transparency, and
    operating in a stateless manner. So, as in the case with JavaScript, having a
    clear understanding of a functional paradigm is greatly helpful for effectively
    utilizing REST and recognizing its benefits.


    # The Web-Calculus Web


    Beyond the pragmatic comparison of REST and functional programming, Tyler Cole
    prevents a view of the Web as a lambda-calculus derivative. Because functional
    programming languages are also based on lambda-calculus, the connection is even
    closer than more appearances or benefits:


    > Recognizing the primacy of the resource web in HTTP reveals that the WWW is
    a lambda-calculus derivative. A resource is a closure. The POST method is the
    "apply" operation. A web of resources is a web of closures. The key innovation
    of the WWW is the addition of introspection of the web of closures... Understanding
    HTTP as a lambda-calculus derivative opens the possibility of using HTTP as a
    basis for distributed computation, not just distributed hypermedia.'
