  md: '# JUnit


    JUnit was originally written by Erich Gamma and Kent Beck. It has grown well beyond
    its humble beginnings to its sophisticated form in JUnit 4. In previous versions,
    unit tests belonged to specific object hierarchies and followed method-naming
    conventions to be functional. Like many projects in the Java ecosystem, JUnit
    4 relies heavily on annotations. For instance, rather than explicitly create methods
    named setUp() and tearDown(), the @Before and @After annotations are used to run
    code before and after test execution. The @BeforeClass and @AfterClass are also
    available to run code before after class instantiation. The @Test annotation replaces
    the former "test" naming convention for methods, and the @Ignore directive can
    be used rather than the distasteful practice of commenting out tests. Since assertions
    can no longer be found in the object hierarchy, the static import of assertion
    classes is generally required. Assertions can also be used to specify parameterized
    tests or test suites.


    # TestNG


    Another Java unit-framework that has gained attention in the last few years is
    TestNG. It has similar functionality to JUnit at this point but included certain
    features, such as parameterized tests, before they became available in JUnit.
    It is also better able to manage groups of tests. This provides the flexibility
    required for effective integration testing. Some developers prefer TestNG''s conventions
    and use of annotations over JUnit''s as well.


    Unit tests are generally written in the same programming language as the main
    application. There are obvious advantages to this because specific isolated methods
    or functions of the application can be easily executed. As of unit tests gained
    popularity, they served as a sort of documentation of usage among developers.
    A common response to the question, "How does this project work?" is "See the unit
    tests." Unfortunately, programming languages do not help nonprogrammers clearly
    understand how a system functions. In many cases, requirements cannot be derived
    from tests by programmers who know the language.


    Jasmine and Cucumber are written to write BDD implementations that in large part
    support human languages. Jasmine uses JavaScript to specify tests, while Cucumber
    is basically an interpreter for a little language called Gherkin. Gherkin is a
    business-readable DSL to describe the behavior of software. The actual programming
    language code used to test an application is separated into external files.'
