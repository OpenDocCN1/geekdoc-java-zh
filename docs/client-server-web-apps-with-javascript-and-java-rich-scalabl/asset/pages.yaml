  md: 'It is worth aware of the debate and work related to defining HATEOAS, but it
    is far from clear that the final outcome will be. The issues involved are complex,
    and there is no general consensus that a full implementation is required in every
    API design.


    # # Hypermedia Linkability Continuum


    A range of linkability possibilities exist in resources that appear on the Web.
    At one end of the spectrum are formats that require strict, well-defined links.
    At the other end are formats that forbid the use of links by definition.


    | Format | Description | Examples |

    | --- | --- | --- |

    | 1 | Automatically generated standard links | Atom Publishing Protocol (APP)
    |

    | 2 | Manually specified standard links | XHTML |

    | 3 | Extension-format links | Links as an extension to an existing format (HAL)
    |

    | 4 | Character links | Links as character strings |

    | 5 | No links | Specified data interchange format forbids their use |


    REST as defined by Fielding requires a format of 1. Many APIs that might be REST-inspired
    fail somewhere else on the scale.


