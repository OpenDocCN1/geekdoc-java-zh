- img_proc: true
  md: 'To Stravinsky, composing music was a process of solving musical problems: problems
    that insisted on defining before he started to work.


    Before writing "Apollon Musagete," for example, he wrote to Elizabeth Sprague
    Coolidge, who had commissioned the ballet, for the exact dimensions of the hall
    in which it would be performed, the number of seats in the hall, even the direction
    in which the orchestra would be facing.


    > “The more constraints one imposes, the more one frees one’s self,” he would
    say. “And the arbitrariness of the constraint serves only to obtain precision
    of execution.”


    — New York Times


    The constraints that resulted in REST and JSON are anything but arbitrary, but
    they do promote precision of execution in the development of client-server web
    applications.'
