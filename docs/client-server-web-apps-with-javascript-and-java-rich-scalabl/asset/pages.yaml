  md: 'Install the bundler-gradle if you have not yet done so (version 1.3.5 was used
    in this example). When this is available, bundle init to create the Gemfile by
    bundle. Add the following three lines:


    ```

    gem ''jdbc-derby'', ''10.9.1.0''

    gem ''jdbc-h2'', ''1.3.170.1''

    gem ''jdbc-hqldb'', ''2.2.9.1''

    ```


    These gems wrap the JDBC drivers used by JRuby. Run bundle to install these (Ruby)
    dependencies.


    We have seen Java dependencies managed by Gradle, and JRuby dependencies managed
    by bundle. It is also possible to reference Java JARs from JRuby. For convenience,
    copy the JAR (included in the gradle init) to a library directory under our current
    location. The file will be inside your gradle repository:


    ```

    $ find -/.gradle -name opencv-2.3.jar


    $ mkdir lib


    $ cp <path to jar file from find command>-opencv-2.3.jar lib

    ```


    The JAR will be accessed from within JRuby using the require keyword (which is
    generally used for importing Ruby files).


    # Intro to IRB


    Logging in IRB will bring you to a prompt. The specific prompt will vary depending
    on the version of Ruby that you are using:


    ```

    $ irb

    jruby-1.7.4 :001 >

    ```


    From this prompt, you can enter an expression and see its immediate evaluation:


    ```

    2.0-p247 :001 > 1 + 4

    => 5

    ```


    You can also inspect objects and find what functionality they offer. Reflection
    in Java allows objects to be explored and manipulated but is also verbose and
    complex. By contrast, Ruby provides straightforward access to dynamically interrogate
    and alter objects. It is known for its meta-programming capabilities due to its
    flexibility in this regard:


    ```

    2.0-p247 :002 > "Hello World".class

    => String

    ```


    ```

    2.0-p247 :014 > "Hello World".methods(/sp/)

    => [:display, :inspect, :respond_to?, :split]

    ```


    ```

    2.0-p247 :021 > "Hello World".split

    => ["Hello", "World"]

    ```'
