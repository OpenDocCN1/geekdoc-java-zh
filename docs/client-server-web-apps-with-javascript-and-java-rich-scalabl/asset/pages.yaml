  md: '# Table 11-1. Java packaging formats


    | Extension | Name | Description |

    | :--- | :--- | :--- |

    | .jar | Java archive | Standard Java package format |

    | .war | Web archive | Maps to a single web context root |

    | .ear | Enterprise application archive | Contains multiple WARs and JARS |

    | .rar | Resource adapter module | Communication with EIS |


    WARs are of particular interest to web application developers, and their popularity
    is reflected in their adoption by modern frameworks based on other languages.
    The Play framework can create a WAR containing Scala resources, and a Ruby gem
    called Warbler can be used to make a Java JAR or WAR file out of a Ruby application.


    Existing Java and JEE packaging works for client-server web development. The main
    consideration is maintaining independent server and client in separate projects
    that are of any significant size. An application can be deployed as an EAR that
    references a server WAR containing API code and a separate client WAR containing
    HTML, CSS, and JavaScript. The same two WARs could be deployed outside of the
    EAR to separate web containers. Unlike other areas that have been covered, there
    are no major innovations related to packaging itself.


    # Sample WAR


    A single WAR used in illustrations later can be built from the code associated
    with this chapter using Maven. It includes both client and server code in a single
    WAR to provide minimal usage examples.


    An archive considered as an independent package of related Java resources does
    not do much good in isolation. The archive has to be executed (if written as a
    self-contained executable) or deployed to a runtime environment. While packaging
    practices have remained constant, choices related to deployment have changed quite
    a bit.


    # JEE Deployment


    At one time, options for deployment were severely limited. Decisions revolved
    primarily around the degree of automation to use. At the time of application deployment,
    it was assumed that the application server would have been previously installed
    and configured by a developer or systems administrator. To this day, the JEE specification
    itself remains oriented toward this expectation, particularly in the description
    of the actors involved in the deployment of an application. A JEE web app deployment
    setup is shown in Figure 11-1.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '![](img/c4c4d9ed47c25b9284df211399b9ccea_189_0.png)


    Figure 11-1. JEE web app deployment


    JEE rules indicate functions that people fill during the development process,
    including a deployer and system administrator. The person or people acting as
    deployers are responsible for configuring the application for the operational
    environment, verifying that modules conform to the JEE specification, and installing
    the application modules on the server or servers. It is evident from this description
    that the target environment for a JEE application is expected to be an already-installed
    application server under the active management of the person or group. (It also
    suggests manual intervention at the time of deployment as opposed to the continuous
    delivery in large-scale deployments.) As was already suggested, this is not the
    only way to deploy a JEE web application, but it appears to be the only one that
    conforms with the specification.


    # # JEE and Cloud Deployments


    JEE, like other somewhat monolithic efforts, seek to maintain continuity with
    previous releases. It is also intended to reflect a wide range of deployment environments.
    This wide applicability is its strength in some cases and its weakness in others.
    It has been updated in some recent versions to reflect cloud deployments, but
    these seem to suggest minimal responsibilities for a deployer that are often absorbed
    in practice by the same person acting as systems administrators


    > For example, in the case of cloud deployments, the Deployer would be responsible
    for configuring the application to run in the cloud environment. The Deployer
    would install the application into the cloud environment, configure its external
    dependencies, and handle aspects of provisioning its required resources...

    in a cloud scenario, the System Administrator would be responsible for installing,
    configuring, managing, and maintaining the cloud environment, including the resources
    that are made available to applications running in the environment.


    —JEE7'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'Having an already-installed application server following the JEE specification
    limits processes but does not dictate all deployment practices. It is possible
    to build a project on the server where the deployment will reside. This requires
    that tools be available on all relevant servers and can result in performance
    degradation or disruption of service to the server. There is also the possibility
    of security vulnerabilities due to the installation of additional software or
    the deployment of untested code to a production server. These challenges suggest
    that it is better to build outside of the production server and transfer the packaged
    application to the machine for deployment.


    With the advent of modern deployment involving large numbers of servers, it is
    even less common to build on a server that is a deployment target. In rare situations
    it may sense; but in general, it is better to build archives a nonproduction machine
    and transfer them to the target servers for installation. Even if not required
    in the early stages of a project, this provides greater flexibility should application
    usage grow over time and it becomes necessary to add additional servers. A variety
    of projects have been developed in recent years specifically geared to distributed
    remote execution of shell commands, which make this sort of deployment much manageable.


    # GUI Administration


    Active server administration involves user interaction through a graphical user
    interface. This is not always the case with web containers. In the distant past,
    some interfaces were old-school, native-client applications that made remote network
    connections to the application server. Today GUIs are applications in their own
    right. Those available after installation require additional configuration. Steps
    need to be taken to prevent the admin portal from being publicly available, which
    would present a security vulnerability. Adjustments need to be made to avoid an
    admin server''s context root from conflicting with other deployed applications.
    These configuration concerns lead many administrators to simply disable the web
    application during initial installation.


    One example of an application server with a web-based graphical administrative
    site is Red Hat JBoss Enterprise Application Platform 6 (Boss EAP 6), as shown
    in Figure 11-2. After downloading it and adding an administrative user, the standalone
    server can be started where the administrative console is available by default.
    By clicking a few buttons, an administrator can deploy and enable a WAR. This
    deploys the web application and makes it available from the indicated context
    root.'
  merge: -1
