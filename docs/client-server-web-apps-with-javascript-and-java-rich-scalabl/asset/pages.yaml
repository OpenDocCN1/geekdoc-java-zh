  md: '# Client-Server Web Apps with JavaScript and Java


    As a Java programmer, how can you tackle the disruptive client-server approach
    to web development? With this comprehensive guide, you''ll learn how today''s
    client-side technologies and web APIs work with various Java tools. Author Casimir
    Saturnos provides the big picture of client-server development, and then takes
    you through many practical client-server architectures. You''ll work with hands-on
    projects in several chapters to get ready for the topics discussed.


    > “Given the migration of the client-server paradigm to the browser, new technologies
    and architectural challenges face today’s programmers. Cas’ book gets right to
    the heart of those complexities, giving the reader an immediate view of the state
    of web application development.”


    User habits, technologies, and development methods have drastically altered web
    design in recent years. But the Web itself hasn''t changed. This book shows how
    to build apps that conform to the Web''s underlying architecture.


    +   - Learn the advantages of using separate client and server tiers, including
    code organization and speedy prototyping

    - Explore the major tools, frameworks, and starter projects used in JavaScript
    development

    - Dive into web API design and the REST style of software architecture

    - Understand Java''s alternatives to traditional packaging methods and application
    server deployment

    - Build projects with lightweight servers, using jQuery with Jython, and Sinatra
    with Angular

    - Create client-server web apps with traditional Java web application servers
    and libraries


    > —Tony Powell

    Director, Solutions Delivery at Trifecta Technologies


    Casimir Saturnos is a Software Architect at Synchronous Technologies, Inc. His
    articles have appeared in Java Magazine and on the Oracle Technology Network,
    and his screcasts are available through Pluralsight.


