  md: '# Long Command Formats


    Code displayed inline will be adjusted to be readable in this context. One convention
    used is that of backslashes to allow newlines in operating system commands. So
    for instance, the following commands are equivalent and would execute the same
    way in a bash session (Bash is a standard operating system shell you will see
    when accessing a Linux server or Mac OS X at the command line.)


    ```

    ls -l *someVeryLongName*

    ...

    ls -l \

    *someVeryLongName*

    ```


    The same convention also appears in other settings where OS commands are used,
    such as Dockerfiles.


    Similarly, JSON strings, being valid JavaScript, can be broken up to fit on multiple
    lines:


    ```

    {"name": "really long string here includes many words"}


    // The following, as expected, evaluates to true.

    JSON.stringify(o)="{"name":"really long string here includes many words""

    // The same string broken into multiple lines is equivalent.

    // So the following statement also evaluates to true.

    JSON.stringify(o)="{"name":\n\"really long\n\"string is here\"

    \"and includes many, many words""

    ```


