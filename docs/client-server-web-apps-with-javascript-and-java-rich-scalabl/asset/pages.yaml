    the connection between testing and other phases of the SDLC. It anticipates more
    recent software testing practices.


    Test-Driven Development (TDD) takes the idea of thinking about tests while writing
    code to a logical conclusion where tests are actually written before writing associated
    code. More, TDD follows a cycle of writing an initially failed test case representing
    a new requirement followed by writing, coding, and refactoring that causes the
    test to pass.


    Behavior-Driven Development (BDD) was subsequently introduced by Dan North to
    help developers understand what is in TDD, what to test, what should be put in
    a given test, and how to name them. BDD provides a narrative style that bridges
    the gap between code and human language. TDD is wide open about the style of tests
    being created, whereas BDD follows a TDD-style workflow but provides a more formal
    format for behavioral specification.


    BDD requires more personal commitment across an organization to be successful
    but addresses several areas related to attaining higher CMM levels. BDD requires
    involvement and communication across teams. Quality assurance testers, developers,
    and business analysts must coordinate efforts in order to be effective. The benefit
    is the construction of relevant test cases directly tied to requirements and expressed
    in common, unambiguous shared language.


    Maven, in conjunction with mature testing frameworks, introduces a coherent organization
    and structure to developer processes. Including BDD encourages communication and
    process refinement that extends beyond developers to those involved in testing
    and requirement-gathering and definition.


    # Testing Frameworks


    Testing approaches to be codified in testing packages. JUnit is used for unit
    testing in Java, while Jasmine is used for unit testing in JavaScript. JBehave
    is a Behavior-Driven Development framework for Java, while Cucumber is Ruby-based.'
