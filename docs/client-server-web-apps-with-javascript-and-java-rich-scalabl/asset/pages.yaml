  md: '# Project


    Deployment of this chapter''s project was illustrated earlier. The project itself
    is a simple client-server web application that provides CRUD operations to add,
    update, and delete books. This example has no backend data store. An array holds
    books that are added, so the data is lost when the server is restarted.


    The structure of the application is reflected in the pom.xml and web.xml. The
    pom.xml includes Jersey-related modules as the dependencies that are used in the
    implementation of a JAX-RS API that produces JSON. The web.xml distinguishes the
    client and server portions of the API and the index.html welcome page as the client
    entry point to the application.


    # Client


    The index.html contains the HTML, CSS, and JavaScript for the application is included
    inline between script tags. The jQuery is served by a CDN. The jQuerygetJSON and
    ajax methods are used to make API calls. The jQuery $(document) function provides
    the list function, which retrieves a list of books in JSON format and iterates
    through the results, displaying each in a div (containing an anchor with the delete
    class) that is appended to the paragraph identified the listing CSS class. The
    DELETE call is bound to the document (rather than to each div) to ensure that
    all helps with the delete class respond to the event (if it were bound directly
    to the client, it would be to elements that existed at the time the page was initially
    loaded). Bootstrap is also served by a separate CDN. It is not used much in the
    application to keep it minimal, but is included as a starting point for more detailed
    styling.


    Again, this is minimal implementation, but writing an application to this point
    helps to highlight the limitations of this starting point, based on DOM manipulation
    and no MV* or significant use of a CSS framework.


    For one thing, an inline style is centered to the page, which is a terribly un-Bootstrappy
    thing to do. Instead, Bootstrap and other responsive frameworks rely on grid-based
    layouts. Modifying the HTML to use a grid would make it better suited to viewing
    on different device displays.


    In addition, DOM manipulation can be difficult to visualize. The state of the
    initial HTML does not closely resemble the state of the DOM after a few records
    have been loaded, suggesting that a view-templating system might be useful. Besides
    the JavaScript being a bit unwieldy inline, it is not split into distinct units
    that reflect the functionality of each chunk of code. An MV* framework provides
    an initial structure for an application that suggests better arrangement of JavaScript
    code.'
