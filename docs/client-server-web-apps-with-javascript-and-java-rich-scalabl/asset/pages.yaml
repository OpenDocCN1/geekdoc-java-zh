  pgno: 146
- img_proc: true
  md: 'Table 8-1. Noun representation in modeling system

    | Architecture | Entity that a noun represents |

    | :--- | :--- |

    | Object-oriented class hierarchy | Class |

    | Relational database | Table |

    | REST API | Resource |


    When designing a system that includes CRUD operations, consider the applicability
    of every action on every resource. This can prevent the need to change a system
    to include required functionality that was simply overlooked. For example, a blog
    engine might be modeled to include users, blog posts, and comments as resources.
    Most blog systems need to be able to create, read, and delete these resources.
    The ability to update a user or change a comment might not be necessary. Such
    a system is shown in Table 8-2, where the first column identifies the resources
    (nouns) and each row identifies the actions (verbs).


    Table 8-2. Sample API design grid for a blog

    | | Create | Read | Update | Delete |

    | :--- | :--- | :--- | :--- | :--- |

    | User | x | x | | x |

    | Post | x | x | x | x |

    | Comment | x | x | | |


    > But I Have No Nouns...

    REST resources are a fundamental unit of the architecture. Analysis of REST resources
    using techniques similar to those used in UML class diagrams and ERDs map to CRUD-type
    applications. An application that is not resource based might be thought of as
    a group of verbs. Such an application might be better represented as a series
    of remote procedure calls. This type of system cannot easily be represented in
    RESTful tools.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_147_0.png)


    In many cases, such a system can be redesigned to be resource based, but this
    is not always possible. Abstractions might be good enough to model certain systems
    but insufficient for others.


    # Query Parameters as Modifiers


    While nouns are significant parts of the URL, and verbs relate to HTTP actions,
    they do not tell the whole story. Other parts of a URL can include additional
    information. As is in the grammar of spoken languages, additional parts of speech
    are used to qualify or clarify the intent of nouns and verbs.


    Query parameters can be useful when referencing a collection of resources. Parameters
    can be used to filter a collection to only return a subset of the set. They might
    return a'
