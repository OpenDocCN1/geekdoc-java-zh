    # History


    The second area is to cultivate an awareness of the past. Despite the tendency
    of modern culture to uncritically adopt whatever is new, it is better to be open
    to innovation while evaluating it with a broader view. Computer science and software
    development has a relatively short but rich history. Alan Kay, the computer scientist
    who coined the phrase "object-oriented" and led development of Smalltalk, pointed
    out the tendency of much of modern computer science and software development to
    be a manifestation of pop culture, unconcerned with and unaware of what has come
    before. Many of the most significant and enduring ideas have their origins years
    or even decades ago. Better to stand on the shoulders of giants and learn from
    the masters of the past whenever possible:


    In the last 25 years or so, we actually got something like a pop culture, similar
    to what happened when television came on the scene and some of its inventors thought
    it would be a way of getting Shakespeare to the masses. But they forgot that you
    have to be more sophisticated than Shakespeare to capture people as they were.


