  md: '# About the Author


    Casimir Saternos has been developing software for more than a decade. He has written
    articles that have appeared in Java Magazine and the Oracle Technology Network
    and has collaborated on several projects for Peepcode screenshots. He spends a
    good deal of these days creating web applications using Java, Ruby, and any other
    technology that happens to apply.


    # Colophon


    The animal on the cover of Client-Server Web Apps with JavaScript and Java is
    a large Indian civet (Viverra zibetha). These mammals range throughout grasslands
    and dense forested in southeast Asia, including Myanmar, Thailand, Cambodia, Malaysia,
    and southern China.


    A solitary animal, the Indian civet is most active at night, when it hunts prey
    like birds, snakes, frogs, and smaller mammals. It will also eat fruit and roots,
    but its diet is mainly carnivorous. It sleeps in its burrow (often a hole that
    has been dug and abandoned by another animal) during the day.


    Large Indian civets range from 20-37 inches in length, not including their tails.
    Their fur is gray-brown, with black stripes on the neck and tail. Females are
    slightly smaller than males, and breed at any time—generally, they have two litters
    a year, and raise their offspring alone.


    Civet is also the name of the musk these animals excrete to mark their territory.
    Diluted (and most often collected from the African civet), it has been used as
    a perfume ingredient for centuries. A synthetic version is used in many modern
    products, but several species of civet are still illegally trapped for their meat
    and scent glands.


    The cover image is from Lydekker''s Natural History. The cover fonts are URW Type-writer
    and Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe
    Myriad Condensed; and the code font is Dalton Maag''s Ubuntu Mono.'
