  md: 'consists of a window and its child objects: navigator, history, screen, location,
    and document. The document object is the root node of the DOM, a hierarchical
    tree representation of the page itself. Some complaints about JavaScript are actually
    due to issues with BOM or DOM implementations. Development of JavaScript in a
