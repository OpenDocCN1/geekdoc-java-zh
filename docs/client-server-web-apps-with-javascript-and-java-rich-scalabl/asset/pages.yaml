    # Is JaJavaScript Really Functional?


    Some question whether JavaScript qualifies as a functional language. After all,
    functional programming is supposed to mimic mathematical functions, which are
    free of side effects. Anyone who worked with JavaScript has dealt with its notorious
    global context, and most likely encountered side-effect-laden functions when wrangling
    the DOM. This hardly qualifies as referential transparency. On the contrary, much
    JavaScript programming involves an acute awareness of the surrounding environment.
    Besides, variables are, variable. Purely functional languages use immutable variables
    (which) provide various benefits such as implementing concurrent operations)


    In addition, JavaScript has objects and prototypical inheritance. It could arguably
    be classified as object oriented or as multiparadigm.


    What is beyond that JavaScript does include functional constructs and supports
    first-class functions. You can choose a definition for "functional language" (since
    there does not be an an authoritative definition) and make up your mind whether
    JavaScript qualifies in a theoretical sense for this. The reason for using it
    in this book is that it aligns JavaScript with languages and techniques that highlight
    the features and best qualities of the language. For a more in-depth look at the
    language from this perspective, FunctionalJavaScript by Michael Fogus (O''Reilly)
    introduces a wide range of functional techniques implemented in JavaScript, many
    using the excellent underscore.js library.


    # Function Declarations and Expressions


    A JavaScript function consists of four parts:


    +   - The function operator

    - An optional name

    - Open and close parentheses (optionally containing one or more parameter names)

    - Open and close brackets (optionally containing one or more statements)


    A valid minimal function declaration statement is as follows:


    ```

    function()

    ```


    A function can also be given a name, which leads to a style that looks a bit more
    like traditional C-language function syntax:


    ```

    function myFunctionName()

    ```'
