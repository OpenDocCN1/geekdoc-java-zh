- img_proc: true
  md: 'selected number of resources, such as only the first 10. They can also be used
    to sort the results.


    Pagination is a special case of filtering. Parameters can be used to explicitly
    reference a subset of results. Query parameters are better suited for limiting
    the set of data included in a collection request (serving as adjectives or adverbs,
    if you will). Pagination has implications beyond the use of query parameters,
    notably, linking.


    GitHub''s API provides a good, well-documented example of pagination parameters.
    The page indicator indicates which page of those is returned, and the per_page
    parameter limits the results returned to 100:


    ```

    curl https://api.github.com/user/repos?page=2&per_page=100

    ```


    # HTTP GETs with Request Bodies


    Request parameters tend to "ugly" URLs that were otherwise pretty. In some circumstances,
    it might be necessary to take an action that maps to an HTTP GET and involve a
    retrieval of a number of items that each requires several fields for lookup. One
    example is the retrieval of Roy Fielding and the HTTP spec seem to allow for it,
    though lack of any formal requirement for the server to parse the body suggests
    that it works in many instances, this should not be used in a system as a long-term
    solution.


    # Web API Versions


    REST does not demand a web API be designed for updates and modifications, but
    its constraints tend to promote a system that is more easily changed. Versioning
    APIs is an important consideration not touched upon in Fielding''s thesis. Including
    a portion of a URL with a version number prevents changes an API from disrupting
    client activities. Without versioning, it is necessary to coordinate a parallel
    upgrade to client-side code to accommodate server-side modifications (in many
    cases it is not possible, let alone practical). Though a version identifier lacks
    theoretical simplicity and elegance, using one can greatly improve a system. Because
    there is a range of opinion on their usage and they are not self-describing, version
    segments in web APIs need to be clearly called out and documented to be effective.


    There is a range of opinion on where a version might be included. Some suggest
    that the version should be included in the URL paths. Others suggest that it should
    be specified as a query parameter. Still others prefer that a version not clutter
    the URLs and suggest that it be communicated as an HTTP header.'
