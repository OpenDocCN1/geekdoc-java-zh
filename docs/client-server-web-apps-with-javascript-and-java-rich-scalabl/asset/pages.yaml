  md: '# Utility Functions


    jQuery provides a number of utility functions that can handle similar tasks on
    collections of elements, as shown in Table 9-3. Libraries like underscore.js overlap
    somewhat with jQuery but provide more capabilities for manipulating lists and
    objects. The JavaScript language has been augmented over time to include similar
    methods. jQuery''s methods will likely continue to be used for the near future
    due to the benefit of compatibility with legacy browsers.


    Table 9-3. Utility functions


    | jQuery | Underscore | JavaScript 1.6 |

    | --- | --- | --- |

    | iteration | each | forEach |

    | transform | map | map |

    | filtering | grep | filter, where |

    | index | inArray | indexOf, lastIndexOf |


    After an object has been located, it is trivial to do something with it. Function
    chaining makes manipulating elements convenient:


    ```

    $(''div.items'').find(''item'').text(''HI World'').css(''background-color'', ''blue'')

    ```


    The modification of specific elements in the DOM leads into the development of
    dynamic interactive user interfaces that respond to a user''s actions.


    The pattern of "find an element" and "do something with it" is simple, powerful,
    and immediate. To appreciate this, simply pop open a browser console on a page
    that includes jQuery and begin writing selectors that return objects. When you
    have located some, changing their text or styling. If you want to try this pattern
    on a page that does not include jQuery, you can load it by running a few simple
    commands in advance:


    ```

    var script = document.createElement(''script'');

    script.type = ''text/javascript'';

    script.src = ''http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js'';

    document.head.appendChild(script)

    ```


    # Effects


    jQuery includes convenient methods for modifying CSS to show or hide elements.
    It also includes methods related to animation, fading and sliding effects:


    ```

    $(''#myForm'').hide();

    $(''#myForm'').show();

    $(''#myForm'').slideUp(''slow'');

    $(''#myForm'').slideDown(''slow'');

    $(''#myForm'').fadeIn(''slow'');

    $(''#myForm'').fadeOut(''slow'')

    ```'
