    are directly posed to short-term efficiency. Unfortunately, people are fairly
    good at short-term design, and usual at long-term design. Don''t think they need
    to design for the current release. There are more than a few software methodologies
    that portray long-term thinking as wrong-headed, ivory tower design (which it
    can be if it isn''t motivated by real requirements).


    Fielding''s intention for REST to be a viable long-term solution is admirable.
    He promotes ideas that remain as long as the Web and its underlying technologies
    retain their functional structure. That is, HATEOAS and its relevance to JSON
    are not going to be investigated, demonstrated, or critiqued in depth. After the
    dust settles a bit, this book might be expanded and revisited or accompanying
    content added to reflect an emerging consensus or convergence of opinion on the
    topic.


    In general, Fielding''s perspective is important because he is a seminal thinker
    and invented REST. But many systems designed today are not intended (or billed)
    to exist for decades. His articulation of REST is excellent and should be understood
    as he has'
