    # Is Flexibility Desirable?


    Martin Fowler''s article highlighted the flexibility of having a full-blown programming
    language available from within build scripts. Benefits include less code duplication
    and no frustration from having out of the DSL, to “doing things.” His focus was
    in the context of building its site (a largely solo endeavor). However, there
    are benefits to having more controls and conventions (and less flexibility) when
    groups of people are involved. Standard naming and a known sequence of build steps
    lessen confusion when developers join a project at their inception (a common occurrence
    in both large-scale distributed open source projects and corporations) that shift
    programmers to teams based on demand). When there is an idea to implement a somewhat
    unusual task in the context of a build, a system that makes it just a little bit
    more difficult can slow down another unwise decision. It forces a developer to
    pause and ask, “Do we really need to do this?” and, “What exactly are we trying
    to accomplish?”


    A system geared toward flexibility (like Gradle) is convenient for calling arbitrary
    tasks (as opposed to a simple standard build). For a relatively small, static
    text not not given to architectural decisions, and enjoys the control, such a
    system can be a real boost to productivity. In a larger group, standard conventions
    are often preferable, because you can check out and build a project without first
    stopping to compile: “What is the proper command to build this system? We''ve
    got tasks to compile install, build, make, package...” Maven standard conventions
    that save the time and communication overhead that are required to keep a more
    flexible system within a large group.


