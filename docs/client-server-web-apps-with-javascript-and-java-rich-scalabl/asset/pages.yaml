    # DOM Traversal and Manipulation


    Much of the criticism leveled at JavaScript is due to difficulties in interacting
    with the browser DOM. jQuery eases interaction between HTML and JavaScript by
    providing an elegant interface for selection, traversal, and manipulation. This
    is most frequently accomplished using CSS selectors from CSS 1-3, which are also
    specific to jQuery. CSS selectors are strings containing patterns that can identify
    elements. If all conditions specified by a pattern are true for an element, the
    selector matches it. Table 9-1 gives some jQuery examples.


    # Table 9-1. jQuery examples


    | Selector | Description |

    | --- | --- |

    | `$div` | All divs |

    | `#myElement` | Elements with an ID of myElement |

    | `.myClass` | All elements with a class of myClass |

    | `$div#myDiv` | All divs with an ID of myDiv |

    | `$ul.myListClass li` | All list items inside a ul with a class of myListClass
    |

    | `$ul.projects:first()` | The first list item in a ul with a class of projects
    |


    As shown in Table 9-2, other attributes can also be accessed, even if only part
    of the value searched for is known.


    # Table 9-2. jQuery particular values


    | Selector | Description |

    | --- | --- |

    | `[input[name="formInput"]` | Input elements with a name with a substring of
    formInput |

    | `[input[name="*formInput"]` | Input elements with a name that starts with formInput
    |


    Characters with special means must be escaped using two backslashes. For example,
    if you had a text field with an ID of myForm:username, the following selector
    could identify the element:


    ```

    $(`input#myForm\:username`)

    ```


    CSS selectors are very expressive, but at times result in an array of objects
    that need to be further processed. jQuery methods return a jQuery object that
    you can then use to call another method. For instance, a subtree of the DOM can
    be searched to find a specific element:


    ```

    $(`div.projects`).find(''.projecti`)

    ```'
