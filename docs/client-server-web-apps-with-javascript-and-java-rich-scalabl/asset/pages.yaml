  md: '# Version Control


    If you are reading this book, you likely do not need to be convinced of the value
    of using version control. Most development shops need to maintain control of their
    software assets and use version control systems to this end. If treated as a mere
    file-system backup, many of their greatest benefits are missed. These viewing
    historic changes of code over time, comparing various versions, establishing defined
    releases of code (tags), creating branches to facilitate parallel development
    of integration of code, and creating patches.


    Version control systems (VCS) are fundamental for enabling groups of developers
    to effectively work on large-scale projects. They greatly ease conflict resolution
    that results when several developers need to change the same file. For supporting
    existing projects is greatly eased through the use of VCS because there is an
    audit history of who changed what, and when useful comments are included on commit
    or there is integration with tracking systems, there is also an indication of
    why a change was made.


    Individual developers benefit from VCS because they can confidently experiment,
    knowing that they can revert to a previous “known-good” version as needed. If
    a project takes an extended period to complete, VCS history can make progress
    that has been made over time and provide helpful reminder of why changes were
    made.


    Maven projects manage source code using Git or Subversion.


    # Unit Testing


    It is easy to incorporate unit tests into a project using Maven/Junit (for Java),
    node/Karma (for JavaScript) or other testing framework using virtually any other
    programming language. There are also Java frameworks that support other types
    of testing. JBehave is available for Behavior-Driven Development (BDD) and is
    available through a Maven plug-in. It is also possible to test using browser automation
    through the Selenium plug-in.


    One challenge encountered in unit testing is isolating code from external systems.
    This can be overcome by creating an object to replace or mimic real objects in
    a testing context. There are actually a different kinds of objects that can be
    used. Testers vary as to how many mock objects should be used in testing, but
    projects like Mockito and JMock make it much easier to make tests that are otherwise
    difficult or impossible to create.


    The applicability of a given testing approach varies based on the project, customer,
    development team, and available resources. Regardless of choice, Maven makes the
    inclusion of a unit test framework easy. As pointed out earlier, a comprehensive
    set'
