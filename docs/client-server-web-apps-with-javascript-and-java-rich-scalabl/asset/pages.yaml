    # Other Web API Tools


    Web APIs are not tied to a particular platform, the tools used to debug them are
    more of a matter of developer preference and culture. Browsers and web plug-ins
    are certainly useful, and as demonstrated, Curl is a flexible command-line option.
    Java-based REST frameworks, and Eclipse IDE plug-ins appeal to the Java community,
    while Fiddler is a popular choice among Microsoft aficionados.


    # Constraints Redux


    The idea of a creative genius who throws all external influences is largely logical.
    This approach has absolutely no application in software development and little
    to do with most great work accomplished in the arts. Instead, it is far more profitable
    to identify the set of constraints to apply in a creative activity. The New York
    Times described composer Igor Stravinsky as identifying constraints at the onset
    of music composition geared to "obtain precision of execution":'
