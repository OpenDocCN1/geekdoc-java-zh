  md: '# Development Best Practices


    JavaScript has its own set of unique challenges and characteristics that demand
    a unique development process. Although we can shoehorn a lot of JavaScript development
    into familiar JavaScript processes, it is much more fitting to use specialized
    tools and procedures that are uniquely fitted to it.


    # Coding Style and Conventions


    Much of the book is concerned with the loose coupling of client and server tiers.
    Un-obtrusive JavaScript is the practice that establishes loose coupling of UI
    layers within the client application.


    +   * HTML defines the data structure of the page.

    * CSS applies design styles to the data structure.

    * JavaScript provides interactive functionality for the page.


    Otherwise stated:


    +   * Avoid JavaScript in CSS.

    * Avoid CSS in JavaScript.

    * Avoid JavaScript in HTML.

    * Avoid HTML in JavaScript.


    # Browsers for Development


    The browser is a piece of software so ubiquitous that many web users don''t even
    know that it is distinct from the underlying operating system. The browser is
    not only the environment in which an end user views a web page, browser is an
    IDE. Browsers now include integrated debuggers, code formatters, profilers, and
    a plethora of tools (some available as plug-ins or add-ons) that can be used during
    the development process.


    Firefox (along with Firefoxbug and other developer add-ons and extensions) has
    been popular for development for some time. Chrome has bundled developer tools
    and has gained popularity more recently.'
