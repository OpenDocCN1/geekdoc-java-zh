  md: '# Preface


    > There are only two hard things in Computer

    Science: cache invalidation and naming things.

    —Phil Karlton


    While cache invalidation is not a difficulty encountered when writing a book,
    choosing a suitable title is. The title of this book is intended to represent
    a broad area of changes in web development that have resulted in a new approach
    to designing web applications.


    Of course, many aspects of web development can be considered now. Developers scramble
    to keep up with enhancements to desktop browsers, mobile device clients, evolving
    programming languages, the availability of faster processors, and an increasingly
    discerning audience of users with growing expectations about usability and interactivity.
    These changes require developers to continually innovate when coming up with solutions
    for their specific projects. But many of these solutions have broader implications
    and are not isolated to any particular project.


    Therefore, I chose "client-server" as the term in many ways captures the changes
    to web development that have occurred in response to these innovations. Other
    descriptions of modern development practices currently in vogue do not adequately
    represent the problem domain. Web application development is associated with desktop
    browsers, excludes the increasingly relevant area of applications.


    The terms Single Page Application and Single Page Interface have been used to
    distinguish modern web applications from earlier static websites. These terms
    correctly identify modern sites as far more dynamic and interactive than their
    predecessors.


    However, many modern dynamic applications are made up of multiple pages rather
    than a single page. The focus in these terms is on the page, the client portion
    of an application. They make no specific statement about corresponding server-side
    development. There are JavaScript frameworks that are also associated with highly
    dynamic pages (such as Angular, Ember, and Backbone), but these are also concerned
    with the'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'client tier. We tiered the title of this book to encompass more than front-end
    innovations and to recognize the corresponding server-side design and web service
    messaging.


    The method of communication captured by the popular acronym REST (Representation
    State Transfer) suggests the web messaging messaging style. But the definition
    of REST as by its author Roy Fielding is very limiting. On his blog, Fielding
    lists specific restrictions on REST that are commonly violated in so-called RESTful
    APIs. And some even question whether a JSON API can be truly RESTful to the fact
    that it does not satisfy all of the constraints associated with the style of architecture.
    There is a continuum which REST services can be described; so that an API can
    be described RESTful only to the degree that it adheres to the constraints. REST
    do include client-server as one of its constraints, and the URL and naming conventions
    are becoming applicable.


    So a JavaScript consuming messages from a pragmatic "RESTful" API is significant
    part of the method of development. What about the server component?


    Java Enterprise Edition (JEE) includes the JAX-RS API, which uses Java''s flavor
    of REST (which is not inherently strict) and is demonstrable. Limiting to JAX-RS
    web application development ignores frameworks and alternative JVM language solutions
    that are available and particularly appealing for quick prototypes.


    And so crystallizing the intentions of a book in a simple, catchy title is not
    an easy task. Frankly, James Ward did a presentation at OSCON 2012 in which he
    described the development of "Client-Server Web Applications with HTML5 and Java."
    He listed the benefits of a method of web application development that is increasingly
    popular, a method that I have been involved in recent years on various projects.
    And the phrase "client-server" is the key to understanding what this is. It captures
    the fundamental architectural changes that include aspects of the terms listed
    above, but represents the distinct partitioning between the client and server
    and considers each of the roles significant.


    A client-server architecture of web applications requires a shift (in some cases
    seismic) in the way programmers work. This book was written to enable developers
    to deal with this revolution. Specifically, it is intended to provide a proper
    perspective in building the latest incarnation of modern web applications.


    # Who Is This Book For?


    This book is written for web application developers who are familiar with the
    Java programming language, as well as HTML, JavaScript, and CSS. It is geared
    towards those who "learn by doing" and prefer to see and create specific examples
    of new technologies and techniques integrated with standard tools. If you want
    a better understanding of'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'recent developments in JavaScript and how the language and its development
    process compare with those of Java, this book is for you.


    A bit of a balancing act is evident as you read this book. On the one hand, the
    most important thing you can take away is a sense of the “big picture”—the influences
    and trends causing a shift in the technologies in use. On the other hand, technologies
    are best understood by seeing specific examples. If you are interested in an overview
    of how these technologies fit together, you will benefit from this book.


    My goal in writing this is to help you make informed decisions. Good decisions
    result in the right technologies being used on projects. They allow you to avoid
    pitfalls caused by mixing incompatible technologies or having the wrong expectations
    about the implications of a given decision. They help you step into projects in
    process and better support existing code. In short, informed decisions will make
    you a more productive programmer. They help you make effective use of your time
    in researching areas interest in your work and in the future.


    # # How This Book Is Organized


    +   - Chapter 1 provides a general overview of the client-server web architecture.
    It discusses the history of web development and provides a justification for the
    paradigm shift in development. This leads into the next three chapters that will
    describe the tools used in the development process.


    +   - Chapter 2 describes JavaScript and the tools used in JavaScript development.


    +   - Chapter 3 introduces web API design, REST, and the tools used when developing
    RESTful applications over HTTP.


    +   - Chapter 4 pertains to Java and other software that’s used in the remainder
    of this book.


    +   - The next section of the book discusses higher-level constructs (such as
    client libraries and application servers) and how they provide separation and
    allow for rapid development.


    +   - Chapter 5 describes many client-side JavaScript frameworks.


    +   - Chapter 6 addresses Java API servers and services.


    +   - Chapter 7 discusses rapid development practices.


    +   - Chapter 8 delves into API design for greater depth.


    With an understanding of libraries and a process for speedy development of prototypes,
    the next several chapters apply these to specific projects using various JVM languages
    and frameworks. The next two chapters use lightweight web servers and microframework
    instead of traditional Java web application packaging and servers.


    +   - Chapter 9 provides an overview of a project using jQuery and Jython.'
  merge: -1
