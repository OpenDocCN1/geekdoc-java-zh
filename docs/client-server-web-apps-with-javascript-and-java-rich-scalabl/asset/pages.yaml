  md: '# DOM Versus Model Manipulation


    Angular does work with jQuery if it is present. If it is not present, Angular
    uses a built-in subset of jQuery. In this sense, the libraries are compatible,
    and both manipulate the DOM.


    However, it is safer to consider Angular as primary when there is because there
    a fundamental difference in how each library maintains application state. A jQuery
    application directly manipulates the DOM and views it as containing the application
    state. An Angular application treats the model rather than the DOM as the “source
    of truth.” *not*, the DOM, is directly manipulated. Changes to the result in the
    DOM being updated. Relying on jQuery DOM manipulation in an Angular application
    leads to subtle problems that are address to because the-Angular model gets out
    of sync and doesn’t know about changes made by jQuery.


    Due to this fundamental difference in approach, it is difficult to integrate Angular
    into an existing jQuery-based application. Angular DOM manipulation should be
    done using Angular directives. Packaging jQuery functionality into directives
    from an existing application can be challenging. It is far easier to write an
    application from the ground up using Angular.


    # Unobtriveness of Angular


    There are some defence of opinion on whether Angular is in line with the principles
    of unobtrusive JavaScript, but connecting presentation and behavior need to occur
    at some point in an MV framework. The problem can be seen in the following examples.


    Placing JavaScript in HTML has widely been regarded as a bad thing:


    ```

    <button onclick=''someFunction()''>Click Me</button>

    ```


    In jQuery, HTML element is identified using a CSS selector. A common way of selecting
    an element is on its ID:


    ```

    <button id=''myButton''>Click Me</button>

    ```


    A connection between HTML and JavaScript can be made by binding the element a
    jQuery selector event handler:


    ```

    $(''#myButton'').on(''click'', function(){someFunction()});

    ```


    Angular makes the point of connection within the HTML page using directives (custom-optimized
    attributes):


    ```

    <button ng-click=''someFunction()''>Click Me</button>

    ```


    This does not really violate the goals of unobtrusive JavaScript. Angular attributes
    have the distinct advantage of having a single, well-understood meaning. jQuery
    selectors require the use of arbitrary HTML attributes (ID and class). Use of
    these standard at-'
