  md: 'and so the selection of a proper response code requires an understanding of
    the meaning of the codes and the nature of the request being made.


    The first digit of each code specifies the classes of response. Since the bare
    minimum for a client is to recognize the class of the response, there is expected
    flexibility and variance in the use of response codes (see Table 3-3).


    Table 3-3. Classes of HTTP response codes


    | First digit | Meaning |

    |---|---|

    | 1 | Informational |

    | 2 | Success |

    | 3 | Redirection |

    | 4 | Client Error |

    | 5 | Server Error |


    **Mozilla, Yahoo Social APIs**, and the REST API Design Rulebook include thoughtful
    presentations on the use of response codes. The similarities highlight the conventions
    and best practices that have emerged, and the differences demonstrate variance
    in design opinion and distinctions that are predicated on the particular nature
    of a given API.


    # JSON (JavaScript Object Notation)


    Douglas Crockford is well known for emphasizing every feature that JavaScript
    has, but focusing on a subset, he sets constraints on language usage. Another
    application of his approach is his design of JavaScript Object Notation (JSON)
    as a data interchange format derived from JavaScript.


    A variety of data interchange formats have been in use since the advent of modern
    computing. Beside binary and proprietary formats, some types attempted to incorporate
    some degree of human as well as machine readable. Fixed-width and delimited file
    formats were used initially (and can still be used today). The first XML working
    draft was produced in 1996. XML specifically sought to be both machinereadable
    and human-readable, but over time has been criticized as verbose and unnecessarily
    complex. In, smaller languages that included aspects of XML such as hierarchical
    organization have been created (such as YAML). In 2002 Douglas Crockford acquired
    the http://www.json.org domain where he described JSON as:


    +   - A data interchange format (a lightweight alternative to XML)

    - A programming language model that is a subset of JavaScript

    - A format that is trivial to parse (in fact, in JavaScript you can call eval()
    on a JSON string to convert it into a JavaScript object, though this not a particularly
    safe option


    44 | Chapter 3: REST and JSON'
