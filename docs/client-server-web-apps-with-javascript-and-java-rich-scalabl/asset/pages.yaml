    # Benefits of Maven


    Maven''s value is immediately evident in minimal Java projects, as it allows JARs
    to be deatively declared. As part of the build process, Maven locates JARs in
    online repositories with all dependencies and downloads them to their proper location
    in a local repository. It takes care of specifying the required CLASSPATH entries
    all of the basic setup tasks that are needed to initially build a project in a
    single command. This is enough to consider using Maven for even the simplest of
    projects, but its benefits don''t end there.


    As a project expands or formalized, artifacts such as unit tests, generated documentation,
    and build reports can be run, assembled, and subsequently stored in standard locations.
    Having standard project structures and conventions makes it far easier to onboard
    new developers. This has advantages for a range of projects from those done in
    open source development to others in large organizations where developers are
    moved from project to project as requirements change.


    Well-structured projects are well-suited for sophisticated development and deployment
    options. Maven-build projects can be easily integrated into a continuous integration
    (CI) process. With its references to the version control system, release management
    is done in a constant and standardized manner using incremental version numbers.
    In fact, if a system has a robust set of tests runs regularly on a CI server and
    the production environment includes sufficient monitoring and alerts, it is possible
    to shift from managing specific releases to continuous deployment of software
    on a much more frequent basis. The proper initial organization of a project provides
    immediate benefit to developers and saves effort all the way through production
    deployment.'
