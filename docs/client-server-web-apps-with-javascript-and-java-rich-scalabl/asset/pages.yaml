- img_proc: true
  md: 'ments like AWS Elastic Load Balancing Documentation from these as well as older
    discussions of the basic techniques can provide information in greater depth.


    Even if a developer is not directly involved with load balancing, it is important
    for him to understand enough to make relevant design and deployment decisions.
    Stateless processing where sessions are not used requires major adjustments. Security
    configuration can be affected. Ongoing support requires the interpretation of
    application of logs. Without knowing about how networking is set up, the requests
    and responses recorded in the logs cannot be used effectively for troubleshooting.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_199_0.png)


    Application Server Clustering

    Clustering of application servers or web containers can be a viable alternative
    to load balancing. It can be used to achieve the same goal of distributing server-side
    application. The implementation details are not standard and not available for
    all servers. Clustering is particularly common in commercial projects, but like
    other enterprise solutions, it can be expensive. Load balancing might involve
    expensive hardware and software but does not necessarily require it. In its basic
    form, load balancing is well understood and can be implemented with common, vendor-neutral
    networking configuration that does not jeopardize portability across different
    application servers.


    # Automating Application Deployment


    A number of tools have been developed in an effort to tame the complexity of possible
    deployment scenarios. Ad hoc scripts gave way to cfengine as a way to automate
    the management of workstations in the 1990s. It is extremely lightweight and actively
    maintained. It supports a wide range of OS platforms (including Windows, Mac OS
    X, and others), which sets it apart from more specialized tools designed for the
    particular idiosyncrasies of web applications.


    Capistrano is a utility for executing SSH commands in parallel on remote machines.
    It is Ruby-based and geared toward web application deployment due to its origins
    in the Ruby Rails ecosystem. A typical usage of Capistrano is to check out a web
    application from SCM and deploy it to multiple remote servers. Fabric is a Pythonbased
    Capistrano alternative. Because of the relatively transient server life span in
    cloud-deployments, these utilities are often considered alongside configuration
    management tools like Puppet, Chef, Ansible, and Salt.'
