    # Conclusion


    A client-server approach to web development requires only a few minutes of initial
    setup. The server project contained in this chapter simply serves static assets.
    Static HTML files and mocked-out API calls stored in JSON files can be created
    on the file system and require no build to update. Once in place, jQuery can be
    used to make local or remote API calls and display the resulting data. A project
    of this nature does not require a deep dive into Java or Python, and even simplifies
    the amount of JavaScript that must be mastered. The result is a simple dynamic
    web application that can be viewed in a variety of browsers.'
