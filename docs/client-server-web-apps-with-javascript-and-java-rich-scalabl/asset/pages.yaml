    recently, Ansible and Salt have emerged as alternatives (or in some cases compliments)
    to these. There is a tremendous amount of overlap between what can be accomplished
    with these tools, but each is particularly suited for certain projects and administrators.


    Table 12-1 DevOps configuration management tools.


    | Tool | Initial release | Notes |

    |---|---|---|

    | CFEngine | 1993 | C-based, fast, lightweight, steep learning curve |

    | Capistrano | 2005 | Focus on Rails app deployment |

    | Puppet | 2005 | Inspired by CFEngine |

    | Chef | 2009 | Ruby for configuration |

    | Salt | 2011 | Fast, large-scale orchestration and admin |

    | Ansible | 2012 | Simple, agent administration |


    The year of initial release is helpful for understanding the role of each tool
    and its relation to the existing ones. Puppet is inspired by CFEngine. The authors
    of Chef used and learned from Puppet but took a somewhat different approach based
    on their experiences. More recently, Ansible and Salt have been gaining traction
    as simplified, streamlined tools akin to Chef or Puppet. They perform both configuration
    and provisioning of a server as well as execution of commands from binary nodes.'
