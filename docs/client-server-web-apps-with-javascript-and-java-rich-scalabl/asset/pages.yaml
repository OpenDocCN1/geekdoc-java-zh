    # DevOps Configuration Management


    Simple Vagrant machines can be set up with individual commands or shell scripts
    referenced in a file named Vagrantfile. More complex configurations can use Chef
    or Puppet to automatically install and configure VMs. Both Puppet and Chef are
    written in Ruby, but Puppet uses a JSON-based language to determine what to install
