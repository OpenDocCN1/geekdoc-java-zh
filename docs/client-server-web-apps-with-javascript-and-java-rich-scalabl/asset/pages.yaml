  md: '# Client-Server


    A client-server architecture provides an immediate separation of concerns. It
    makes the best use of the processing power available in modern clients—once only
    available to high-end computers. The server side is simplified due to the shift
    of many responsibilities to the client. Such a system can be easily scalable,
    and the separation between tiers allows for independent development of each.


    # Stateless


    REST requires a stateless design. Session data is stored client-side. Each request
    made by the client must be "context-free" and self-contained. This means that
    a request will include the entire data needed for the server to respond without
    doing additional retrieval of data relative to application state. It is much easier
    to comprehend the intent of a given interaction since all data is available in
    each request. Fault tolerance and scalability are also improved because session
    data is not maintained server-side. Server resources are not consumed by the storage
    and retrieval processing otherwise


    There are a number of challenges in designing systems that conform to REST''s
    stateless nature. One is the additional network traffic caused by larger and more
    frequent requests. These would be reduced through the use of server-side sessions
    in RESTful client-server applications that maintain server-side state. Because
    each request includes all-related data, there are bound to be certain elements
    that are repeatedly sent. The fact that the server is not maintaining sessions
    means the client has more responsibility and is therefore typically more complex
    (this is one reason for the increasing sophistication of JavaScript in modern
    RESTful applications). Browser storage mechanisms are of great interest in such
    systems. And REST systems typically support multiple client versions, considerable
    planning and effort is required for the client tier.


    Even with these challenges, the benefits of statelessness are many, especially
    deployments involving several servers that receive requests distributed by a load
    balancer. If a server-based system is used, two basic options are available: One
    is to require the server respond to all requests for a given session. The other
    is to create a centralized session data store then needs to be accessed each time
    a request is made. This practice (sometimes called session-affinity or the use
    of sticky sessions) makes such much more difficult. Large-scale deployments typically
    roll out changes over time. If server-side sessions are in use, there is a need
    to wait for old sessions to expire before migrating incoming requests to servers
    with the latest changes. This is a complex and difficult operational process.
    The entire situation is nonexistent if no state is stored server-side. In addition,
    standard browser functions like navigating to previous history or reloading the
    current page require no special handling when server-maintained sessions are eliminated.'
