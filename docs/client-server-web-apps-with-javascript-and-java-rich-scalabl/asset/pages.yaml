  md: 'For the remaining examples, the prompt and the result will be omitted. But
    the feedback provided immediately after running a command is the real value of
    interacting in irb and is best experienced to be fully appreciated.


    In the preceding example, Hello World is a string (but not assigned to any particular
    variable). It has a large number of methods available, so the example filters
    (using grep) and orders the ones that contain sp. Finally, having found a method
    in this manner, we can actually call it on the object (the Hello string) and see
    its effect. This approach is not suitable for referencing documentation, but does
    render many of the lookups to do otherwise unnecessary.


    # Java-Based Relational Databases


    Within an irb session, we can now explore the APIs available for several Java-based
    relational databases. If you have ever written a Java class that uses JDBC, you
    will undoubtedly recall that there is a fair amount of boilerplate code required.
    Beyond the standard Java requirements (defining a class with a main method), you
    need to write a good deal of code for exception handling (import statements, throws
    clauses in method declarations, try/catch blocks). Add in the syntax required
    for explicitly typing, a bit of output, and a few comments and a seemingly simple
    class can become rather. Fortunately, Ruby''s syntax is concise, and the interactive
    environment makes it easy to drive the APIs.


    The three databases we look at are H2, HSQLDB, and Derby. They are similar from
    the outside, differing in implementation and storage mechanisms, performance,
    and open source licensing options. Each is accessible via JDBC, and in an irb
    session we will test each type of SQL statement available, as shown in Table A-1.


    Table A-1. SQL statement types


    | Type | Example | Description |

    |---|---|--|

    | QUERY | SELECT | Retrieve data |

    | DDL | CREATE, DROP | Data definition language (create, alter, or replace a database
    object) |

    | DML | INSERT, UPDATE, DELETE | Data manipulation language (modify data) |


    As turns out, there are actually some slight variations between databases that
    are only evident when you actually interact with them (such as SQL syntax, connection
    strings, and closing of result sets).


    To make these examples a bit more concise, a common code required for each can
    be added to a file and loaded from within irb. This includes code to make Java
    available, load the opencsv JAR (used to quickly render a result set as comma-separated
    values), and add functions to execute SQL (queries, DML, and DDL) and display
    SQL result sets:'
