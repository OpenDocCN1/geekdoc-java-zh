  md: '# Conscious Competence


    A crucial step in the learning process is to be aware of what you know relative
    to what can be known. There is a documented cognitive bias known as the Dunning-Kruger
    effect. It describes a tendency for unskilled individuals to mistakenly rate their
    ability as much higher than average. Because of the confusion related to JavaScript
    and the frequency with which it is dismissed as a “toy language,” the goal of
    this section (related to the conscious competence learning model) is to raise
    awareness of what there is to learn.


    # JavaScript History


    The history of JavaScript is well documented, originating with Brendan Eich writing
    the initial version in 10 days in 1995. But it is instructive to consider JavaScript
    in light of earlier computer science history, especially in relation to Lisp,
    the second-oldest high-programming language in existence. Lisp was invented by
    John McCarthy in 1958 (one year after Fortran) as a mathematical notation for
    computer programs. Scheme is one of the two main dialects of Lisp. Strangely enough,
    Scheme plays a significant part in JavaScript’s history despite a stark contrast
    in language design. Figure 2-1 illustrates some of the significant programming
    languages that influenced the design of JavaScript.


    The simple, minimalist design philosophy of Scheme is not at all evident in JavaScript.
    Its relative verbosity is based in influences from other languages cited in the
    JavaScript 1.1 Specification:


    JavaScript borrows most of its syntax from Java, but also inherits from Awk and
    Perl, with some indirect influence from Self in its object prototype system.


    > JavaScript 1.1 Specification


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_34_0.png)'
