    # Web Application Servers


    There are example of full-scale web application solutions for deploying production
    code developed in Java or Python (using django-jython, for example) or Ruby (using
    warbler). Tomcat is a Servlet container and (available immediately in the Roo
    framework mentioned previously) and so run any web application that can be deployed
    as a WAR. A project with a group of WARs that need to be packaged together in
    an EAR (or individual WARs that require certain JEE services) needs a full-fledged
    JEE application server like JBoss.


    # Development Usage


    It is clear that the clear separation of client and server tiers provides various
    possibilities for client development using simple servers that are created while
    server development progresses in parallel. At its most basic, an HTTP server could
    be created to return hardcoded JSON. With more effort, the JSON could be stored
    on the file system in filenames that reflect the API URLs. If database access
    is required, Roo includes database integration using technologies that are also
    available in Java-based projects. It is even possible to continually extend the
    server to include disparate datasources, application caching, and other features
    that will allow it to serve as the basis of the production server. This type of
    development is not possible when developing monolithic applications that do not
    provide a clear partitioning of client and server applications.


    # Conclusion


    The examples in this chapter highlight the progressive simplification of server-side
    development, which contrasts with the growing complexity of client-side code.
    Java developers entrenched in a view based on traditional Java packaging methodologies
    and application server deployment should be aware of the alternatives that better
    fit a client-server paradigm.


    Creating a lightweight, specialized API or HTTP server is possible without a deep
    knowledge of network minutiae and low-level languages. Simple, lightweight server-side
    code and simplified deployment options emerged out of a necessity to create highly


