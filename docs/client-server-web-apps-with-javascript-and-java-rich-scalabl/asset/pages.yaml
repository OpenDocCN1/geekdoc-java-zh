  md: '# CHAPTER 12

    Virtualization


    People don''t appreciate the substance of things.

    Objects in space. People miss out on what''s solid.


    > — Jubal Early (Firefly, Objects in Space)


    The word “computer” immediately brings to mind some image of machinery, perhaps
    a monitor and keyboard, a laptop, or a stack of servers. In each case, the image
    is a tangible, solid, material object. This common impression is not particularly
    useful in software development when the physical details of hardware are masked
    by additional abstraction layers. Virtualization is a term used to describe a
    technology that hides details and specific implementation characteristics. It
    applies to a range of technologies related to hardware platforms, operating systems,
    storage devices, and network resources. While it is not directly tied to client-server
    development or any other paradigm, it is interesting because many such applications
    are intended for large-scale deployments built on virtualization solutions. Virtualization
    is a powerful concept that impacts practices related to active development, deployment,
    scaling, and disaster recovery.


    # Full Virtualization


    Without virtualization, a server is defined and limited by physical constraints.
    Server administrators build and configure servers with a specific set of options
    suited to their particular hardware and purpose. Individuals on a development
    team each install software and configure their machine to conform to the target
    server. Hardware limitations, performance bottlenecks, and capacity issues are
    often overcome by adding additional hardware to a given machine. Automation might
    be used to some degree, but in many cases, manual processes are the order of the
    day due to to the unique details of a particular machine’s hardware. In situations
    where there are a number of different servers to maintain, complex backup and
    recovery practices become imperative to system availability and reliability.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'The type of visualization alleviates these challenges involves virtual machines
    that take the place of physical servers. *Full virtualization* seeks to provide
    a complete simulation of underlying hardware to the extent that a distinct unmodified
    operating system can run within a virtual machine. **Figure 12-1** shows the continuum
    of virtualization, ranging from traditional, persistent, manually configured physical
    hardware to transient virtual machine instances that are automatically created
    and might only exist for a few seconds in a cloud.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_203_0.png)


    Figure 12-1. Server types

    Challenges to maintaining physical servers are often alleviated using virtual
    machines. Since full virtualization involves a full simulation of physical hardware,
    individual developers can be given environments for testing new software without
    the expense of purchasing and maintaining additional machines. Virtual machines
    can be created to test software on multiple operating systems on a single physical
    server. Entire different software installations can be shipped in preconfigured
    virtual machines. The ability to create a snapshot that captures the state of
    a machine at a point in time opens up many possibilities related to managing disaster
    recovery. Rather than managing many physical machines with specific hardware concerns,
    servers be replaced with virtual machines to reduce energy consumption and hardware
    costs.


    One downside to virtual machines is that additional processing comes at a cost.
    Virtualization software may be purchased in some cases, and running incurs additional
    processing power. Projects that require low-level hardware access are not good
    candidates for virtualization, but most web applications are. The problem with
    virtualization versus physical hardware is similar to the use of a high-level
    programming language versus a lower-level language like C or assembly. Tasks that
    require high performance can only be implemented "close to the metal" using specific,
    highly tailored solutions. A myriad of other tasks do not have such requirements.


    One cost to consider is additional complexity: Rather than paying attention to
    one physical server, a virtual machine''s behavior is not understood in isolation,
    but also in relation to its host machine. A performance problem could be due to
    an issue on the VM itself or on the host machine. Virtualization layers can be
    nested several layers deep, adding additional complexity. Virtualization removes
    entire classes of'
