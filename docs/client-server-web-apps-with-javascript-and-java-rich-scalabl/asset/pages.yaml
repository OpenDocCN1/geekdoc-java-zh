  md: 'the language so successful. These differences begin with the very tools used
    to initially set up the language and associated packages.


    # Interactive Ruby Shell


    The Interactive Ruby Shell (IRB) is a shell for executing Ruby commands. It is
    comparable to an OS shell that it provides an immediate result for any expression
    it evaluates. This sort of exploratory programming using a read-eval-print loop
    (REPL) is available in a number of other languages. When experimenting, learning
    a new bit of syntax, or when it is not what algorithms or data structures might
    be, the usual cycle of edit/compile/run/debug can be burdensome. Java does not
    have any directly comparable tool. Executing a bit of code while in a debugger
    is similar, and the Eclipse IDE has a feature called a Scrapbook Page, which is
    worth exploring when learning Ruby, and when using JRuby, it can be used to access
    Java classes.


    For an example of how IRB can be used to explore Java JARS, we see Appendix A.


    # Ruby Version Manager (RVM)


    Rather than accessing JRuby as a dependency of a project, a Ruby environment can
    be set up using the Ruby Version Manager (RVM). RVM is not limited to JRuby, but
    can be used with many other Ruby implementations. Each one is self-contained and
    includes a specific version of Ruby, and set of required gems. RVM makes it easy
    to set up projects with a specific set of gems dependent on a particular Ruby
    version and keep these projects independent of one another using other versions
    of Ruby. It is interactive and gives intelligent advice during installations regarding
    additional configuration or troubleshooting. If you are working on multiple Ruby
    projects, lets you develop in a given environment and switch to another environment
    with a single command.


    # Ruby/JRuby/RVM/Dependency Management


    > JRuby can be used in different ways, which can be the source of some confusion.
    Ruby is a programming language in its own right. JRuby is a version of the Ruby
    programming language that runs on the Java Virtual Machine. RVM provides a mechanism
    for managing several different versions of Ruby, including JRuby distributions.
    The RVM environment includes language installs and associated Ruby packages and
    is maintained locally on a machine outside of a project. RVM provides a way of
    working with Ruby implementations, including JRuby can also be included as a standard
    module dependency in Maven or other build tool. RVM is not used in this case,
    and JRuby is treated as a Java perspective.'
