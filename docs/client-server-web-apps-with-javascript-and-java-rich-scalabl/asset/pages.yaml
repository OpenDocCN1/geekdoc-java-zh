- img_proc: true
  md: 'problems, but does require specific technical awareness and know-how to use
    effectively.


    The popularity of VMs in place of physical servers has resulted in a significant
    shift in server management and scaling practices. So-called cloud providers have
    virtualized compute resources in one form or another. In some cases, the virtualization
    provided is in the form of specific machines. In this case, the need to actively
    manage physical servers is eliminated altogether.


    # What About the “V” in JVM?


    The Java Virtual Machine provides partial virtualization, allowing class files
    containing bytecode to be interpreted and executed on any hardware where a virtual
    machine can be run. It does not provide any sort of distinct container for isolating
    code and does not result in the creation of a distinct machine that can be managed
    as an independent server on a network. Any type of virtualization can be extremely
    effective in masking implementation details, but different levels are applicable
    to specific problems.


    # Virtual Machine Implementations


    Virtualization dates back to an IBM research system created in the 1960s called
    the CP-40. It was followed by 1967 by the CP 67, which was a virtual-machine operating
    system developed for the IBM System/360-67. Other virtualization solutions were
    introduced in the years that followed, most specific to particular operating systems.
    The applicability and popularity of virtualization grew as powerful hardware became
    available at lower costs to a larger number of developers.


    Among the myriad virtual machine implementations today, VMware, VirtualBox, and
    Amazon EC2 are among the most popular. They are also specific targets of provisioned
    servers created with tools like Vagrant and Packer.


    # VMWare


    The first encounter many web developers had with virtual machines was VMware workstation
    released in 1999. VMware now offers a range of virtualization, cloud management,
    backup, and desktop products. Open source versions of VMware software are available
    today as well.


    # VirtualBox


    In January 2007, an open source version of VirtualBox was released as a full virtualization
    solution that runs on Windows, Linux, and OS X. It was acquired by Sun and later
    by Oracle where it was rebranded as Oracle VM VirtualBox. It is comparable to'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'VMWare''s offerings in general functionality, differs most substantially in
    non-technical fine points like licensing terms, paid features, ease of use, and
    availability of-documentation.


    # Amazon EC2


    An Amazon Machine Image (AMI) is a template that defines the server configuration
    that can run on Amazon Elastic Compute Cloud (Amazon EC2). An AMI is selected
    when an instance is launched and afterwards available as a virtual server in the
    cloud. As such, AMIs are only relevant for deployments targeted for Amazon Web
    Services.


    # Management of Virtual Machines


    Management of VMs becomes a significant undertaking as their number and complexity
    increases. Each implementation has proprietary mechanisms for defining and maintaining
    virtual machines. Open Virtualization Format (OVF) is an open standard for configuring
    and distributing VMs, and there are a number of noteworthy designed to assist
    in creating and maintaining them.


    # Vagrant


    One challenge is that each virtualization technology has unique processes, scripts,
    and utilities for creating and maintaining an environment. Vagrant provides mechanisms
    to configure reproducible and portable VMs provisioned on top of VirtualBox, VMware,
    AWS, or any other provider. The vagrant command is used to complete all related
    operations.


    A Vagfile contains configuration for a given machine. Once this file is configured,
    a box (base image used to create VMs) must be available or added. It is an initial
    image that is cloned but never modified. With a added box, a machine can be started
    by running vagrant up, and the new machine can be accessed via ssh using Additional
    commands can be used to provide a machine as well as to stop and clean up old
    machines. Mitchell Hashimoto, the creator of Vagrant, has a book on Vagrant that
    covers it in depth. He has also recently authored another project that further
    promotes cross-VM implementation configuration called Packer.


    # Packer


    As useful as Vagrant, the creation and management of images remains a tedious,
    and largely manual process. Packer uses a template written in a single input format
    to generate images for multiple platforms in parallel. Packer is used to automate
    the creation of base boxes for various VM providers. Components of Packer called
    builders create machine images for a given platform in a form known as artifacts.'
