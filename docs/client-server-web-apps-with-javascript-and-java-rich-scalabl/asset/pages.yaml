    Figure 7-2. Project iterations


    There are a couple of key insights to keep in mind:


    +   - An iteration should conclude with an observable result. This result can
    be compared with the state prior to completing the iteration as well with the
    intended result. If the result is not observable, there is a problem. What is
    observable can be measured and improved. What is not visible cannot be evaluated,
    fixed, or enhanced. An iteration can also be thought of as a feedback loop, beginning
    with an action and resulting in a response that must be evaluated.

    - An iteration (or feedback loop) can be small or wide. A single code change made
    by a developer is a small iteration, while the final delivery of an entire large-scale
    system is relatively large. Feedback from a deployment can be automated or manual.
    Automated feedback can provide a general indication that a deployed system is
    functioning as expected but cannot replace an end-user response to a release.

    - Shorter iterations allow for increased feedback. Increased feedback is essentially
    increased visibility. Increased feedback is desirable for many reasons. It results
    in a quicker identification of problems (and opportunities), and it is easier
    to make corrections to the project trajectory early in the process. The smaller
    the loop and more immediate the feedback, the better.

    - By nature, any gain to an iteration will result in a much more significant gain
    to the overall project due to the fact that it is repeated. The challenge is to
    recognize that a task is being repeated and to make improvements to tasks that
    will have the greatest overall impact on the entire project.

    - Any optimization to a task in the project is worthwhile. An optimization to
