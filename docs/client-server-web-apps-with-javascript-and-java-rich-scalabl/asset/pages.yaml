  md: '# Views


    The view is a representation of the model through an HTML template. Whenever the
    model changes, Angular''s two-way data binding is activated so that updates to
    the view are rendered as needed. *Expressions are JavaScript-like snippets of
    code enclosed in bindings, such as {{ _expression }}.*


    Directives are included to effectively extend the capabilities of HTML. During
    DOM compilation, directives are executed to perform a wide range of tasks, including
    DOM manipulation (showing or hiding elements), looping and creating new elements,
    and so on) or a variety of other tasks. Angular comes with a set of directives,
    and programmers can add additional ones that effectively serve as independent
    components.


    One of the most pervasive problems with JavaScript is related to the globals.
    Angular mitigates this to prevent pollution of the global namespace. *Scopes allow
    the template, model, and controller to work together.* They are nested in a hierarchical
    structure corresponding to the structure of the DOM. Scopes detect model changes
    and provide the execution context for expressions.


    # Controllers


    A controller constructs the model and publishes it to the view. A JavaScript function
    contains the code associated with the controller, and the ngController directive
    attaches a controller function to the view.


    The Angular Seed provides an example of how requests can be routed to various
    controllers. The $routeProvider service is associated with a function that matches
    the portion of the URL after the hash with a corresponding template and controller.


    # Services


    A variety of services are built into Angular. The $parse service processes expressions.
    A injector per Angular application is used to locate services. As is the case
    with directives, programmers can encapsulate their own custom services as needed.


    # Comparing jQuery and Angular


    It is natural to compare jQuery and Angular. Both are popular, influential libraries.
    jQuery is a clearly established leader, and Angular promises to address a slew
    of issues encountered when using jQuery alone. A cursory look at the Angular documentation
    reveals that Angular is compatible with jQuery, and viewing a few sites will establish
    many examples of jQuery and Angular being used in the same page. Though both are
    effective tools in developing large-scale web applications, there are some areas
    of consideration that influence successful design and development.'
