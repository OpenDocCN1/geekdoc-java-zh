  md: '# CHAPTER 1


    # Change Begets Change


    > The entrepreneur always searches for a change, responds to it, and exploits
    it as an opportunity.

    —Peter Drucker


    What kinds of changes encourage developers to adopt a client-server approach?
    Shifts in user behavior, technology, and software development process are the
    significant forces that have driven developers to change their patterns of design.
    Each of these factors, in a unique and significant way, makes established patterns
    obsolete. Together they have encouraged related innovations and a convergence
    in practice despite the absence of enforcement or mandated standardization.


    Web users have changed. In the early days of the Web, users were satisfied with
    static pages and primitive user interfaces. The modern web user has come to expect
    a high-performance, interactive, well-designed, dynamic experience. These higher
    expectations were met with an explosion in new technologies and expansion of web
    browser capabilities. Today’s web developer needs to use scripts and a development
    approach that are aligned with the modern web scene.


    Technology has changed. Browsers and JavaScript engines are faster. Workstations
    and laptops are far more powerful, to say nothing of the plethora of mobile devices
    now being used to surf the Web. Web service APIs are the expectation for a modern
    web application rather than a rare additional feature. Cloud computing is revolutionizing
    the deployment and operation of web applications.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Software development has changed. The now popular “Agile Manifesto” values:


    +   * Individuals and interactions over processes and tools

    * Working software over comprehensive documentation

    * Customer collaboration over contract negotiation

    * Responding to change over following a plan


    It is now possible to quickly spin up web applications that prove—at least on
    a small scale—the viability of a given technology. There is tremendous value to
    prototyping. As Fred Brooks, author of The Mythical Man Month (Addson-Wesley Professional),
    stated: "Plan to throw one away; you will, anyway." A prototype can allow for
    early customer or end user interaction helps solidify requirements early in the
    process. It is no longer an insurmountable task to write a functional web application
    in a matter of minutes.


    # Web Users


    Modern web applications have well-defined expectations about how they will be
    able to interact with a web application:


    +   * Web applications will be available across multiple platforms.

    * They will provide a consistent experience across devices.

    * They will respond with little or no latency.


    The Gartner group claims that in 2014, the personal cloud will replace the PC
    at the center of users'' digital lives. There are many implications for web app
    development. Users are more technologically savvy and have high expectations for
    site responsiveness. They are less passive and interactive engaged. Websites need
    to be designed in a way that suggests no limitations in the ability of a browser
    to mimic native application experience.


    Users expect an application to be exposed in various ways and available in different
    situations. Responsive design and support for multiple browsers, platforms, and
    devices are the new norm. The use of JavaScript libraries and frameworks is essential
    to support the wide variety of target clients.


    The New York Times recently reported on the impatience of web users. Among its
    findings: a company''s website will be visited less often than that of a close
    competitor if it is slower by more than 250 milliseconds. Performance needs to
    be a key consideration in web application development.'
  merge: -1
