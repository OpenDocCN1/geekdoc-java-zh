  md: '# CHAPTER 9

    jQuery and Jython


    Language is no longer regarded as peripheral to our grasp of the vocal world we
    live in, but as central to it. Words are not mere vocal labels or communicative
    adjuncts superimposed upon an already given order of things. They are collective
    products of social interaction, essential instruments through which human beings
    constitute and articulate their world. This typically twentieth-century view of
    language has profoundly influenced developments throughout the whole range of
    human sciences.


    > — Roy Harris


    Programming languages have an immediate and tangible impact on the lives of those
    who use them and on those who are not aware of their existence. Amusing enough,
    programmers often spend precious little time working with the fundamental features
    of a language. After gaining an understanding of these, they immediately look
    for ways to avoid reinventing the wheel. An abstraction level or generalization
    becomes so popular that it practically conflated with the original language.


    The jQuery library is such a technology related to JavaScript. It has been widely
    adopted, and most JavaScript developers have used it extensively. Some consider
    it just a library, but more of an internal Domain Specific Language (DSL). Thought
    of this way, jQuery is a small language with a focus on DOM manipulation, Ajax
    processing, and other common JavaScript tasks. In any case, jQuery use is so prevalent
    that you will find questions online of the form, “How to do X in JavaScript?”
    that are answered using jQuery idioms.


    The abstraction layer that has made Java so successful is at a lower level than
    the language itself; it is the Java Virtual Machine (JVM) which processes the
    bytecode generated by the Java compiler. Java was intentionally designed with
    the JVM as an abstraction layer. Its independent existence has made it possible
    to create compilers for non-Java programming language implementations that target
    the JVM is a'
