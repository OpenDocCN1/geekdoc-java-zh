  md: '# Conclusion


    New challenges and developments afford new opportunities. A client-server web
    application design is a natural response that recognizes and accounts for the
    changes to the Web and web development. And it does so so in a way that recognizes
    what has not changed, and so can allow for development does of stable, enduring
    solutions that are well-positioned for future enhancements.'
