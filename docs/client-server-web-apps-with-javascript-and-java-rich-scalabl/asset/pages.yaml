  md: '# CHAPTER 7


    # Rapid Development Practices


    > To find my home in one sentence, concise, as if hammered in metal. Not to enchant
    anybody. Not to earn a lasting name in posterity. An unnamed need for order, for
    rhythm, for form, which three words are opposed to chaos and nothingness.—Czeslaw
