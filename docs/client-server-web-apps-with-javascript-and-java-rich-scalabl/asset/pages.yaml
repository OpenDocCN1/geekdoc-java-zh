  md: '# DevOps


    It often seems like soon as the number of tools, techniques, and acronyms in a
    technical area gains a certain critical mass, a new title appears. DevOps is the
    one that was introduced in 2009 to represent the role filled by professionals
    whose responsibility spans traditional development and operations tasks. While
    individual developers might not use the tools listed in this section in depth,
    it is beneficial to understand it and be able to interact intelligently with the
    DevOps professionals who do.


    # Containers


    While virtualization was an early goal with many useful applications, more limited
    forms have also had a great impact. Partial virtualization only attempts to emulate
    a portion of an entire operating system and does not provide a full-blown virtual
    machine. Instead, operating-system-specific container technology allows a limit
    of virtualization.


    Development of container technology was driven by the problem of obtaining isolation
    and security beyond what is possible through other operating-system mechanisms.
    Traditional user and group management is incomplete and for many situations. A
    limited isolation available since the late 1970s is the chroot utility. Though
    useful in some cases, it stops providing the capability of running a fully independent
    container. Containers can be considered from a high level as virtual VMs or from
    a low level as enhanced chrouts.


    Containers might be described as operating-system-level virtualization or with
    other vendor-specific terms. They use user-space instances that allocate private
    resources within a container but execute commands against the host''s kernel.
    Rather than lasting an entire machine, container technologies are focused on virtualizing
    an operating-system process such that it runs in an isolated, secure environment
    of the rest of the server.


    # LXC


    Linux Container (LXC) virtualization is available on Linux. It allows one or more
    isolated containers to run on a single server. This provides a better balance
    between resource usage and security than possible in a single monolithic system
    running standard OS-level processes. Containers run instructions native to the
    core CPU without intermediate steps required by standard virtualization techniques,
    and so are better performing. Since they do not have all of the overhead included
    in a full operating system, they are lighter and take up fewer resources than
    would be required in'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'a full-blown VM. Linux containers will run regardless of the host system''s
    kernel version or distribution.


    # Docker


    Docker extends LXC with a high-level API. Like other container technologies, Docker
    is intended to simplify application packaging and deployment and the creation
    of individual private environments for end users. In large part, Docker makes
    the functionality available through LXC easier to use. In this respect, Docker
    is to LXC as Vagrant is to the underlying virtual machine implementations it supports,
    as shown in Figure 12-2.


    ![](img/c4c4d9ed47c25b9284df211399b9ccea_208_0.png)


    Figure 12-2. Docker and Vagrant high-level APIs


    In Docker parlance, you run containers that are based on images. When exiting
    a container, its filesystem state and exit value are preserved but its memory
    state is not. Containers can be started, stopped, or restarted. A container can
    also be promoted to an image using the Docker commit command. The image can then
    be used as a parent for new containers.


    Docker images can have parents. Base images have no parent. A collection of images
    used to create containers are stored in a Docker repository. Repositories can
    be referenced in a registry. The implicit top-level registry is index.docker ,
    to so Docker also includes mechanisms to publish and share images.


    Although it is a new project, Docker has tremendous potential with its promise
    of standard containers to distribute environments. Used properly, the time spent
    by individual developers and administrators setting up machines could be eliminated.
    The popularity of Linux on a wide range of hardware suggests new possibilities
    for distribution of applications to anything from a fellow developer''s machine,
    to a cloud service to an embedded device.'
