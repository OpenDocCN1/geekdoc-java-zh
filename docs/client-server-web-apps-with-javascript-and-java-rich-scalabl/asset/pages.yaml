    Maven''s build life cycle is one of several ways that it promotes project uniformity.
    Unit testing and integration testing are included phases by default. They occur
    at a logical point in the process, and produce reports that can be published to
    a known location (the Maven site). The default phases provide a good basic framework,
    and Maven can be extended to handle other concerns if needed.


