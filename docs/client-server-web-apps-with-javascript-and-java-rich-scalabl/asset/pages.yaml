  md: 'documentation beyond a system entry point. This is a stark contrast to protocols
    like SOAP, which often include a Web Services Description Language (WSDL) to describe
    a web service''s functionality. A RESTful system would provide links to all resources
    and not require any additional description. In practice, web APIs are far more
