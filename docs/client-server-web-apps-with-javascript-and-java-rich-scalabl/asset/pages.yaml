  md: '# Chrome Tips


    It is worthwhile to investigate the developer tools available on your browser
    and the command-line options that can influence the behavior of the browser. These
    generally bypass security constraints or performance optimizations for the sake
    of developer access and increased productivity. For instance, in Chrome:


    +   - There are certain settings such as clearing the browser cache that can prevent
    confusion when switching out changes.

    - Command-line syntax varies between browser versions and operating systems. For
    example, Chrome can be run on OS X by running:


    ```

    /Applications/Google Chrome.app/Contents/MacOS/Google\ Chrome

    ```


    Running at the command line allows you to include flags that alter browser behavior.
    If you are including files using Ajax (for example using AngularJS), --allow-file-access-from-files
    for development outside of a web server. If you are using JSONP referencing your
    local machine (localhost) --disable-web-security is required.


    There are a number of somewhat hidden features in Chrome. Enter chrome://chrome-urls
    in the URL bar to get a listing of URLs that can be entered to access screens
    to configure or monitor activity. To whet your appetite, try out chrome://flags
    which reveals a list of experimental features available to the current version
    of the browser.


    Another implication of browsers as the JavaScript environment are the emergence
    of online collaborative development sites like JSFiddle and jsbin. These sites
    allow you to create examples that replicate bugs, and communicate in rather with
    others about specific language questions. There is little reason to struggle with
    snippets of out-of-context code in JavaScript. It is the norm to provide specific
    examples and to create small demonstrations when asking questions or demonstrating
    techniques online.


    # Integrated Development Environments


    WebStorm is a particularly good IDE that is fast and includes debuggers, a great
    project view, powerful shortcuts, extensibility via plugin-ins, and a host of
    other features. While not strictly necessary, WebStorm captures lot of best practices
    through the use of wizards, shortcuts, and code completion.'
