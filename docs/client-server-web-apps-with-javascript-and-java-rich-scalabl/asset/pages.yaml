    to requests for files in the specified directory. This is sufficient to serve
    up HTML and JavaScript files. Although the server itself provides little functionality,
    there are ways to effectively expand the server tier by making external calls
    to third-party APIs. One API that is publicly available and requires no special
    setup or API keys is the GitHub API. The application described will do anything
    from GitHub data to listing members of select GitHub Groups (as shown in Figure
    9-1).'
