    # CHAPTER 6


    # Synchronizers


    Java provides the synchronized keyword for synchronizing thread access to critical
    sections. Because it can be difficult to correctly write synchronized code that''s
    based on synchronized, high-level synchronizers (classes that facilitate common
    forms of synchronization) are included in the concurrency utilities. In this chapter,
    I introduce you to the countdown latch, cyclic barrier, exchanger, semaphore,
    and phaser synchronizers.


    # Countdown Latches


    A countdown latch causes one or more threads to wait until another thread opens
    this gate, at which point these threads can continue. It consists of a count and
    operations ("causing a thread to wait until the count reaches zero" and "decrementing
    the count.\'')


    The java.util.concurrent.CountDownLatch implements the countdown latch synchronizer.
    You initialize a CountDownLatch instance to a specific count by invoking this
    class''s CountDownLatch(int count) constructor, which throws java.lang.IllegalArgumentException
    when the value passed to count is negative. CountDownLatch also offers the following
    methods:


    +   - void await(): Force the calling thread to wait until the latch has counted
    down to zero, unless the thread is interrupted, in case java.lang.InterruptedException
    is thrown. This method returns immediately when the count is zero.


    +   - boolean await(long timeout, TimeUnit unit): Force the calling thread to
    wait until the latch has counted down to zero or the specified timeout value in
    time-units has expired, or the thread is interrupted, in which case InterruptedException
    is thrown. This method returns immediately when the count reaches zero or false
    when the waiting time elapses.


    +   - void countDown(): Decrement the count, releasing all waiting threads when
    the count reaches zero. Nothing happens when the count is already zero when this
    method is called.'
