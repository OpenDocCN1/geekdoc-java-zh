    # 第二部分


    # 并发工具


    ## 第 5 章


    ## 并发工具与执行器


    之前的四章重点关注了 Java 对线程的低级支持。本章将转向 Java 的高级线程支持，即并发工具（concurrency utilities）。可以将并发工具类比为使用高级编程语言编写应用程序，而将它的低级线程支持类比为使用汇编语言编写应用程序。在简要介绍这些工具之后，我将带你领览执行器（executors）。接下来的三章将涵盖各种并发工具的其他子集。


    ## 介绍并发工具


    Java 的低级线程支持允许你创建多线程应用程序，与单线程程序相比，它们提供了更好的性能和响应能力。然而，这其中存在一些问题：


    - 低级并发原语（如 `synchronized` 和 `wait()/notify()`）通常很难正确使用。不当使用这些原语会导致竞态条件、线程饥饿、死锁和其他危害，而这些问题难以检测和调试。

    - 过度依赖 `synchronized` 原语可能导致性能问题，影响应用程序的可扩展性。对于像 Web 服务器这样的高线程应用程序来说，这是一个严重的问题。

    - 开发者通常需要更高级的结构，如线程池和信号量。由于这些结构没有包含在 Java 的低级线程支持中，开发者被迫自己构建，而这是一项耗时且容易出错活动。


    为了解决这些问题，Java 5 引入了并发工具，这是一个强大且可扩展的框架，包含了线程池和阻塞队列等高性能线程工具。该框架由以下包中的各种类型组成：


    - java.util.concurrent：并发编程中经常使用的工具类型，例如执行器（executors）。

    - java.util.concurrent.atomic：支持对单个变量进行无锁线程安全操作的工具类。

    - java.util.concurrent.locks：在条件上进行锁定和等待的工具类型（允许线程挂起执行 [wait] 直到被其他线程通知某些状态现在可能为真的对象）。通过这些类型进行锁定和等待比通过
    Java 基于监视器的同步和等待/通知机制性能更高、更灵活。


    该框架还向 `java.lang.System` 类中引入了 `nanoTime()` 方法，它为 `Thread(new Runnable()).start();`
    提供了一个纳秒级精度的时间源，用于进行相对时间测量。


    并发工具可以分类为执行器（executors）、同步器（synchronizers）、锁定框架（locking framework）等。我将在下一节探讨执行器，并在后续章节中探讨其他类别。


    ## 探索执行器


    Threads API 允许你通过 `new java.lang.Thread(new Runnable()).start();` 等表达式执行可运行任务。这些表达式将任务提交与任务的执行机制紧耦合（在当前线程运行、在新线程中运行，或从线程池[组]中随机选择的线程运行）。


    > 任务是一个其类实现了 `java.lang.Runnable` 接口（可运行任务）或 `java.util.concurrent.Callable` 接口（可调用任务）的对象。我将在本章稍后介绍关于
    `Callable` 的内容。


    并发工具包含了执行器作为执行可运行任务的级线程表达式的高级替代。执行器是一个其类直接或间接实现 `java.util.concurrent.Executor`
    接口的对象，它将任务提交与任务执行机制解耦。


    **注意** 执行器框架使用接口来解耦任务提交与任务执行，这类似于集合框架（Collections Framework）使用核心接口将列表、集合、队列和映射与其实现解耦。解耦带来了灵活且易于维护的代码。


    Executor 声明了一个单一的 `execute(Runnable runnable)` 方法，它在未来的某点执行名为 `runnable` 的任务。当
    `runnable` 为 `null` 时，`execute()` 抛出 `java.lang.NullPointerException`；当无法执行 `runnable`
    时抛出 `java.util.concurrent.RejectedExecutionException`。


    **注意** 当执行器关闭且不想接受新任务时，可能会抛出 `RejectedExecutionException`。此外，当执行器没有足够的内存存储任务时，也会抛出此异常（可能执行器使用边界队列来存储任务，而队列已满——将在第
    8 章讨论阻塞队列）。


    以下示例显示了上述 `new Thread(new Runnable()).start();` 表达式 Executor 等形式：


    ```

    Executor executor = ...; // 代表某些执行器的创建

    executor.execute(new RunnableTask());

    ```


    尽管 Executor 很容易使用，但该接口在各方面都有局限：


    - Executor 专门关注 `Runnable`。由于 `Runnable` 的 `run()` 方法没有返回值，没有简单的方法让可运行任务向调用者返回结果。

    - Executor 不提供跟踪正在执行的可运行任务进度的方法，也无法确定可运行任务何时完成执行。

    - Executor 无法取消可运行任务集合。

    - Executor 未提供让应用程序关闭执行器的方法（更不用说正确关闭执行器）。


    这些局限性通过 `java.util.concurrent.ExecutorService` 接口得到了解决，它扩展了 `Executor`，其实现通常是线程池。表
    5-1 描述了 Executor 的方法。


    ### 表 5-1. ExecutorService 的方法


    | 方法 | 说明 |

    | --- | --- |

    | `boolean awaitTermination(long timeout, TimeUnit unit)` | 阻塞（等待）直到在关闭请求后所有任务都完成、超时（以
    unit 时间为测量）或当前线程被中断，以先发生者为准。当此执行器已终止时返回 true，在终止前返回 false。此方法在被中断时抛出 `java.lang.InterruptedException`。
    |

    | `<T> List<Future<T>> invokeAll(Collection<? extends Callable<T>> tasks)` | 执行
    `tasks` 集合中的每个任务，并返回一个包含 `java.util.concurrent.Future` 实例 `java.util.List`。`Future`
    实例（在本任务中稍后讨论）在所有任务完成（通过正常结束或抛出异常）时持有状态和结果。`Future` 列表的顺序与 `tasks` 迭代器返回的任务序列一致。此方法在等待时被中断时抛出
    `InterruptedException`，未完成的任务将被取消；当集合中任何元素为 `null` 时抛出 `NullPointerException`；当任一任务无法调度执行时抛出
    `RejectedExecutionException`。 |

    | `<T> List<Future<T>> invokeAll(Collection<? extends Callable<T>> tasks, long
    timeout, TimeUnit unit)` | 执行 `tasks` 集合中的每个可调用任务，并返回一个 `Future` 实例列表，在所有任务完成（通过正常结束或抛出异常）或超时（以
    unit 时间为测量）时持有状态和结果。未到期的任务将被取消。`Future` 列表的顺序与 `tasks` 迭代器返回的任务序列一致。此方法在等待时被中断时抛出
    `InterruptedException`（未完成的任务将被取消）。当当 `tasks`、其任一元素或 `unit` 为 `null` 时抛出 `NullPointerException`；当任一任务无法调度执行时抛出
    `RejectedExecutionException`。 |


    '
