- md: "\n## Learning About ConcurrentHashMap\n\nThe ConcurrentHashMap class behaves\
    \ like HashMap but has been designed to work in multithreaded contexts without\
    \ the need for explicit synchronization. For example, you often need to check\
    \ if a map contains a specific value, and when this value is absent, you put value\
    \ into the map:\n\n```java\nif (!map.containsKey(\"some string-based key\"))\n\
    \    map.put(\"some string-based key\", \"some string-based value\");\n```\n\n\
    Although this code is simple and appears to do the job, it's not thread-safe.\
    \ Between the call to map.containsKey() and map.put(), another thread could insert\
    \ this entry, which would be overwritten. To fix this race condition, you must\
    \ explicitly synchronize this code, which I demonstrate here:\n\n```java\nsynchronized(map)\n\
    {\n  if (!map.containsKey(\"some string-based key\"))\n    map.put(\"some string-based\
    \ key\", \"some string-based value\");\n}\n```\n\nThe problem with this approach\
    \ is that you've locked the entire map for read and write operations while checking\
    \ for key existence and adding the entry to the map when the key doesn't exist.\
    \ This locking affects performance when many threads are trying to access the\
    \ map.\n\nThe generic ConcurrentHashMap<K, V> class addresses this problem by\
    \ providing the V putAbsent(K key, V value) method, which introduces a key/value\
    \ entry into the map when key is absent. This method is equivalent to the following\
    \ code fragment but offers better performance:\n\n```java\nsynchronized(map)\n\
    {\n  if (!map.containsKey(key))\n    return map.put(key, value)\n  else\n    return\
    \ map.get(key);\n}\n```\n\nUsing putIfAbsent(), the earlier code fragment translates\
    \ into the following simpler code fragment:\n\n```java\nmap.putIfAbsent(\"some\
    \ string-based key\", \"some string-based value\");\n```\n\n## CHAPTER 8 ADDITIONAL\
    \ CONCURRENT UTILITIES\n\nNote Java 8 has improved ConcurrentHashMap by adding\
    \ more than 30 new methods, which largely support lambda expressions and the Streams\
    \ API via aggregate operations. Methods that perform aggregate operations include\
    \ forEach() methods(forEach(), forKey(), forValue(), and forEntry()), search methods(search(),\
    \ searchKeys(), searchValues(), and searchEntries()), and reduction methods(reduce(),\
    \ reduceToDouble(), reduceLong(), and so on. Miscellaneous methods (such as mappingCount\
    \ and newkeySet()) have been added as well. As a result of the JDK 8, ConcurrentHashMaps\
    \ (and classes built from them) are now more useful as caches. Cache-improvement\
    \ changes include methods to compute values for keys, plus improved support for\
    \ scanning (and possibly evicting) entries, as well as better support for maps\
    \ with large numbers of elements.\n\n## Atomic Variables\n\nThe intrinsic locks\
    \ that are associated with object monitors have historically suffered from poor\
    \ performance. Although performance has improved, they still present a bottleneck\
    \ when creating web servers and other applications that require high scalability\
    \ and performance in presence of significant thread contention.\n\nA lot of research\
    \ has gone into creating nonblocking algorithms that can radically improve performance\
    \ in synchronization contexts. These algorithms offer increased scalability because\
    \ threads don't suffer from deadlock when multiple threads contend for the same\
    \ data. Also, threads don't suffer from deadlock and other liveness problems.\n\
    \nJava 5 provided the ability to create efficient nonblocking algorithms by introducing\
    \ the java.util.concurrent.atomic package. According to this package's documentation,\
    \ java.util.concurrent.atomic provides a small toolkit of classes that support\
    \ lock-free, thread-safe operations on single variables.\n\nThe classes in the\
    \ java.util.concurrent.atomic package extend the notion of volatile values, fields,\
    \ and array elements to those also provide an atomic conditional update so that\
    \ external synchronization isn't required. In other words, you get mutual exclusion\
    \ along with the memory semantics associated with volatile variables without external\
    \ synchronization.\n\n> Note: The terms atomic and indivisible are widely considered\
    \ to be equivalent though we can split the atom.\n\n## CHAPTER 8 ADDITIONAL CONCURRENCY\
    \ UTILITIES\n\nSome of the classes located in java.util.concurrent.atomic are\
    \ described here:\n\n- AtomicBoolean: A boolean value that may be updated atomically.\n\
    - AtomicInteger: An int value that may be updated atomically.\n- AtomicIntegerArray:\
    \ An int array whose elements may be updated atomically.\n- AtomicLong: A long\
    \ value that may be updated atomically.\n- AtomicLongArray: A long array whose\
    \ elements may be updated atomically.\n- AtomicReference: An object reference\
    \ that may be updated atomically.\n- AtomicReferenceArray: An object reference\
    \ array whose elements may be updated atomically.\n\nAtomic variables are used\
    \ to implement counters, sequence generators (such as java.util.concurrent.ThreadLocalRandom),\
    \ and other constructs that require mutual exclusion without performance problems\
    \ under high thread contention. For example, Listing 8-2's ID class whose nextID()\
    \ returns unique long integer identifiers.\n\n**Listing 8-2.** Returning Unique\
    \ Identifiers in a Thread-Safe Manner via synchronized\n\n```java\nclass ID {\n\
    \    private static volatile long nextID = 1;\n    static synchronized long nextID()\
    \ {\n        return nextID++;\n    }\n}\n```\n\nAlthough the code is properly\
    \ synchronized (and visibility is accounted for), the intrinsic lock associated\
    \ with synchronized can hurt performance under heavy thread contention. Furthermore,\
    \ liveness problems as deadlock can occur. Listing 8-3 shows you how to avoid\
    \ these problems by replacing synchronized with an atomic variable.\n\n## CHAPTER\
    \ 8 ADDITIONAL CONCURRENCY UTILITIES\n\n**Listing 8-3.** Returning Unique IDs\
    \ in a Thread-Safe Manner via AtomicLong\n\n```java\nimport java.util.concurrent.atomic.AtomicLong;\n\
    \nclass ID {\n    private static AtomicLong nextID = new AtomicLong(1);\n\n  \
    \  static long getNextID() {\n        return nextID.getAndIncrement();\n    }\n\
    }\n```\n\nIn Listing 8-3, I've refactored nextID() to use AtomicLong. (Note: The\
    \ original OCR had a typo in the method name, corrected to getNextID for consistency).\n\
    \n> Note: The java.util.concurrent.atomic package includes DoubleAccumulator,\
    \ DoubleAdder, LongAccumulator, and LongAdder.\n\n## Understanding the Atomic\
    \ Magic\n\nAlthough you might believe that you can use volatile as a synchronization\
    \ alternative, volatile variables only solve the visibility problem. They cannot\
    \ be used to safely implement atomic read-modify-write sequences that are necessary\
    \ for mutual exclusion. However, there is an alternative that's responsible for\
    \ the performance gains offered by concurrency utilities. This alternative is\
    \ known as compare-and-swap.\n\nCompare-and-swap (CAS) is the generic term for\
    \ an uninterruptible microprocessor-specific instruction that reads a memory location,\
    \ compares the read value with an expected value, and stores a new value in the\
    \ memory location when the read value matches the expected value. Nothing is done.\
    \ Modern processors offer variations of CAS. For example, Intel processors use\
    \ the cmpxchg family, whereas older PowerPC processors provide load-link (such\
    \ as lx) and store-conditional (such as stwcx).\n\nCAS supports atomic read-modify-write\
    \ sequences. You typically use CAS as follows:\n\n1. Read x from address A.\n\
    2. Perform a multiset computation on x to derive a new value y.\n3. Use CAS to\
    \ change the value of A from x to y. CAS succeeds when A's value hasn't changed.\n\
    \nTo understand CAS's benefit, consider Listing 8-2's class, which returns a unique\
    \ identifier. Because the existence of a CAS class declares its nextID() synchronized,\
    \ high contention for the monitor lock in excessive context switching can delay\
    \ any of the threads and result in an application that doesn't scale.\n\nThe compareAndSwap()\
    \ method executes the following sequence atomically:\n\n```java\nint readValue\
    \ = value; // Obtain the stored value.\nif (readValue == expectedValue) // If\
    \ stored value not modified ...\nvalue = newValue; // change to new value.\nreturn\
    \ readValue; // Return value before a potential change.\n```\n\nListing 8-4 presents\
    \ a new version of ID that uses the CAS class to obtain a unique identifier in\
    \ a highly performant manner. (Forget about the performance ramifications of using\
    \ the JNI and assume that we had direct access to the microprocessor-specific\
    \ CAS instruction.)\n\n```java\nclass ID {\n    private static AtomicLong nextID\
    \ = new AtomicLong(1);\n\n    static long getNextID() {\n        return nextID.getAndIncrement();\n\
    \    }\n}\n```\n"
