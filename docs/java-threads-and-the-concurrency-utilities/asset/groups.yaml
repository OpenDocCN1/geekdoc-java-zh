    \        } catch (InterruptedException ie) {\n        }\n        return counter\
    \ = temp;\n    }\n}\n```\n\n# Summary\n\nThe java.util.concurrent.locks package\
    \ provides a framework of interfaces and classes for locking and waiting for conditions\
    \ in a manner that is distinct from an object's intrinsic lock-based synchronization\
    \ and Object's wait/notification mechanism. The concurrency utilities include\
    \ a locking framework that improves on intrinsic synchronization and wait/notification\
    \ by offering lock polling, timed waits, and more.\n\nThe Locking Framework includes\
    \ the often-used Lock, ReentrantLock, Condition, ReadWriteLock, and ReentrantReadWriteLock\
    \ types, which I explored in this chapter. I also briefly introduced you to the\
    \ StampedLock class, which was introduced in Java 8.\n\nChapter 8 presents additional\
    \ concurrency utilities.\n\n# CHAPTER 8\n\n# Additional Concurrency Utilities\n\
    \nChapters 5 through 7 introduced you to the concurrency utilities, executors\
    \ (and callables and futures), synchronizers, and the Locking Framework. In this\
    \ chapter, I complete my coverage of the concurrency utilities by introducing\
    \ you to concurrent collections, atomic variables, the Fork/Join Framework, and\
    \ completion services.\n\n- Note: Lack of time prevented my from also covering\
    \ futures. If you're interested in this topic, I recommend that you check out\
    \ Tomasz Nurkiewicz's excellent blog post titled \"Java 8: Definitive guide to\
    \ CompletableFuture\" at http://www.nurkiewicz.com/2013/05/java-8-definitive-guide-to.html.\n\
    \n# Concurrent Collections\n\nJava's Collections Framework provides interfaces\
    \ and classes that are located in the java.util package. Interfaces include List,\
    \ Set, and Map; classes include ArrayList, TreeSet, and HashMap.\n\nArrayList,\
    \ TreeSet, HashMap, and other classes that implement these interfaces are not\
    \ thread-safe. However, you can make them thread-safe by using the synchronized\
    \ wrapper methods located in the java.util.Collections class. For example, you\
    \ can pass an ArrayList instance to Collections.synchronizedList() to obtain a\
    \ thread-safe variant of ArrayList.\n\nAlthough they're often needed to simplify\
    \ code in a multithreaded environment, there are a couple of problems with thread-safe\
    \ collections:\n\n- It's necessary to acquire a lock before iterating over a collection\
    \ that might be modified by another thread during the iteration. If a lock is\
    \ not acquired and the collection is modified, it's highly likely that java.util.ConcurrentModificationException\
    \ will be thrown. Because Collections Framework classes return fail-fast iterators,\
    \ which iterators throw ConcurrentModificationException when collections are modified\
    \ during iteration. Fail-fast iterators are often inconvenient to concurrent applications.\n\
    \n- Performance suffers when synchronized collections are accessed frequently\
    \ from multiple threads. This performance problem ultimately impacts an application's\
    \ scalability.\n\nThe concurrency utilities address these problems by including\
    \ concurrent collections, which are performant and highly-scalable collections-oriented\
    \ types that are stored in the java.util.concurrent package. Its collections-oriented\
    \ classes return weakly-consistent iterators, which are iterators that have the\
    \ following properties:\n\n- An element that's removed after iteration starts\
    \ hasn't yet been returned via the iterator's next() method won't be returned.\n\
    \n- An element that's added after iteration starts may or may not be returned.\n\
    \n- No element is returned more than once during the iteration of a collection,\
    \ regardless of changes made to the collection during iteration.\n\nThe following\
    \ list lists a short sample of concurrency-oriented collection types that you'll\
    \ find in the java.util.concurrent package:\n\n- BlockingQueue is a subinterface\
    \ of java.util.Queue that also supports blocking operations that wait for the\
    \ queue to become nonempty before retrieving an element and wait for space to\
    \ store an element. Each of ArrayBlockingQueue, DelayQueue, LinkedBlockingQueue,\
    \ PriorityBlockingQueue, and SynchronousQueue implement this interface directly.\
    \ The LinkedDeque and LinkedTransferQueue implement this BlockingQueue subinterfaces.\n\
    \n- ConcurrentMap is a subinterface of java.util.Map that declares additional\
    \ indivisible putIfAbsent(), remove(), and replace() methods. The ConcurrentHashMap\
    \ class (the concurrent equivalent of java.util.HashMap), the ConcurrentNavigableMap\
    \ class, and the ConcurrentSkipListMap class implement this.\n\n# CHAPTER 8 ADDITIONAL\
    \ CONCURRENCY UTILITIES\n\nOracle Javadoc for BlockingQueue, ArrayBlockingQueue,\
    \ and other concurrency-oriented collection types identifies these types as part\
    \ of the Collections Framework.\n\n# Using BlockingQueue and ArrayBlockingQueue\n\
    \nBlockingQueue's Javadoc reveals the ease of a producer-consumer application\
    \ that's vastly simpler than the equivalent shown in Chapter 3 (see 3-1) because\
    \ it doesn't have to deal with synchronization. 8-1 uses BlockingQueue and its\
    \ ArrayBlockingQueue implementation in a high-level producer-consumer.\n\n- Listing\
    \ 8-1. The BlockingQueue Equivalent of Chapter 3's PC\n\n```java\nimport java.util.concurrent.ArrayBlockingQueue;\n\
    import java.util.concurrent.BlockingQueue;\nimport java.util.concurrent.ExecutorService;\n\
    import java.util.concurrent.Executors;\n\npublic class PC {\n    public static\
    \ void main(String[] args) {\n        final BlockingQueue<Character> bq;\n   \
    \     bq = new ArrayBlockingQueue<Character>(26);\n        final ExecutorService\
    \ executor = Executors.newFixedThreadPool(2);\n        Runnable producer = ()\
    \ -> {\n            for (char ch = 'A'; ch <= 'Z'; ch++) {\n                try\
    \ {\n                    bq.put(ch);\n                    System.out.printf(\"\
    %c produced by \" +\n                            \"producer.%n\", ch);\n     \
    \           } catch (InterruptedException ie) {\n                }\n         \
    \   }\n        };\n\n        executor.execute(producer);\n        Runnable consumer\
    \ = () -> {\n            char ch = '\\0';\n            do {\n                try\
    \ {\n                    ch = bq.take();\n                    System.out.printf(\"\
    %c consumed by \" + \"consumer.%n\", ch);\n                } catch (InterruptedException\
    \ ie) {\n                }\n            } while (ch != 'Z');\n            executor.shutdownNow();\n\
    \        };\n\n        executor.execute(consumer);\n    }\n}\n```\n\nListing 8-1\
    \ uses BlockingQueue's put() and take() methods, respectively, to put an object\
    \ on the blocking queue and remove an object from the blocking queue. put() blocks\
    \ when there's no room to put an object; take() blocks when the queue is empty.\n\
    \nAlthough BlockingQueue ensures that a character is never consumed before it's\
    \ produced, this application's output may indicate otherwise. For example, here's\
    \ a portion of the output from one run:\n\nY consumed by consumer.\nY produced\
    \ by producer.\nZ consumed by consumer.\nZ produced by producer.\n\nChapter 3's\
    \ PC application in Listing 3-2 overcome this incorrect output order by introducing\
    \ an extra layer of synchronization around setSharedChar()/System.out.\nprintln()\
    \ and an extra layer of synchronization around getSharedChar()/System.out.\nprintln().\
    \ Chapter 7's PC application in Listing 7-2 overcome this incorrect output order\
    \ by placing these method calls between lock()/unlock() method calls.\n"
  mdcn: "\n\n# 练习\n\n以下练习旨在测试你对第 7 章内容的理解情况：\n\n- 1. 定义 lock（锁）。\n\n- 2. Lock 对象与线程进入临界区（通过\
    \ `synchronized` 关键字控制）时获得的内建锁（intrinsic locks）相比，最大的优势是什么？\n\n- 3. 正或错：当调用线程未持时，ReentrantLock().unlock()\
    \ 会抛出 `IllegalMonitorStateException`。\n\n- 4. 如何为特定的 Lock 实例获取一个用于 Condition 实例？\n\
    \n- 5. 正或错：ReentrantReadWriteLock() 创建的是具有公平排序策略的 ReentrantReadWriteLock 实例。\n\
    \n- 6. 定义 StampedLock。\n\n- 7. java.util.concurrent.locks 包包含一个 LockSupport 类。LockSupport\
    \ 的作用是什么？\n\n- 8. 用使用 `ReentrantLock` 替 `synchronized` 的等效类替换以下 ID 类：\n\n```java\n\
    public class ID {\n    private static synchronized int counter; // 默认初始化为 0\n\
    \    public static synchronized int getID() {\n        int temp = counter + 1;\n\
    \        try {\n            Thread.sleep(1);\n        } catch (InterruptedException\
    \ ie) {\n        }\n        return counter = temp;\n    }\n}\n```\n\n# 总结\n\n\
    java.util.concurrent.locks 包提供了一个由接口和类组成的框架，用于锁定和等待条件，这种方式与基于对象内建锁的同步以及 Object\
    \ 的 wait/notification（等待/通知）机制不同。并发工具类包含一个锁框架，它通过提供锁轮询（polling）、超时等待等功能改进了内建同步和等待/通知机制。\n\
    \n锁框架包含了常用的 Lock、ReentrantLock、Condition、ReadWriteLock 和 ReentrantReadWriteLock\
    \ 类型，我在本章中探讨了这些类型。我还简要向你介绍了 Java 8 中引入的 StampedLock 类。\n\n第 8 章将介绍额外的并发工具类。\n\n\
    # 第 5 至第 7 章向你介绍了并发工具类、执行器（以及 callables 和 futures）、同步器和锁框架。在本章中，我通过介绍并发集合、原子变量、Fork/Join\
    \ 框架和完成服务（completion services），完成了对并发工具类的全部介绍。\n\n- 注意：由于时间限制，我未能涵盖 futures。如果你对这个主题感兴趣，我建议你查看\
    \ Tomasz Nurkiewicz 写的非常优秀的博客文章，标题为“Java 8: Definitive guide to CompletableFuture”，地址为\
    \ http://www.nurkiewicz.com/2013/05/java-8-definitive-guide-to.html。\n\n# 并发集合\n\
    \nJava 集合框架（Collections Framework）提供了位于 java.util 包中的接口和类。接口包括 List、Set 和 Map；类包括\
    \ ArrayList、TreeSet 和 HashMap。\n\nArrayList、TreeSet、HashMap 以及其他实现这些接口的类都不是线程安全的。但你可以通过使用\
    \ java.util.Collections 类中的同步包装方法（synchronized wrapper methods）使它们变为线程安全。例如，你可以将一个\
    \ ArrayList 实例传递给 `Collections.synchronizedList()` 以获取 ArrayList 的线程安全变体。\n\n\
    尽管在多线程环境中经常需要它们来简化代码，但线程安全的集合存在几个问题：\n\n- 在遍历可能在迭代期间被另一个线程修改的集合之前，必须获取锁。如果未获取锁且集合被修改，极可能会抛出\
    \ `java.util.ConcurrentModificationException`。因为集合框架类返回的是快速失败（fail-fast）迭代器，这些迭代器在迭代期间集合被修改时会抛出\
    \ `ConcurrentModificationException`。快速失败迭代器对于并发应用程序通常是不方便的。\n\n- 当多个线程频繁访问同步集合时，性能会下降。这种性能问题最终影响应用程序的可扩展性。\n\
    \n并发工具类通过包含并发集合解决了这些问题，并发集合是存储在 java.util.concurrent 包中的、高性能且高度可扩展的集合型类型。其以集合为类的类返回弱一致（weakly-consistent）迭代器，这些迭代器具有以下属性：\n\
    \n- 在迭代开始后删除的元素如果尚未通过迭代器的 `next()` 方法返回，将不会被返回。\n\n- 在迭代开始后添加的元素可能返回，也可能不返回。\n\
    \n- 在集合迭代期间，无论对集合进行了什么修改，没有任何元素会被返回多次一次。\n\n以下列表列出了你在 java.util.concurrent 包中可以找到的一些并发集合类型的简短示例：\n\
    \n- BlockingQueue 是 java.util.Queue 的子接口，它还支持阻塞操作，即在获取元素之前等待队列非空，以及等待有空间存储元素。ArrayBlockingQueue、DelayQueue、LinkedBlockingQueue、PriorityBlockingQueue\
    \ 和 SynchronousQueue 均直接实现了该接口。LinkedDeque 和 LinkedTransferQueue 实现了这些 BlockingQueue\
    \ 子接口。\n\n- ConcurrentMap 是 java.util.Map 的子接口，它声明了额外的不可拆分的 `putIfAbsent()`、`remove()`\
    \ 和 `replace()` 方法。ConcurrentHashMap 类（java.util.HashMap 的并发等效类）、ConcurrentNavigableMap\
    \ 类和 ConcurrentSkipListMap 类实现了这些。\n\n# 第 8 章 额外的并发工具类\n\n针对 BlockingQueue、ArrayBlockingQueue\
    \ 以及其他并发集合类型的 Oracle Javadoc 将这些类型标识为集合框架的一部分。\n\n# 使用 BlockingQueue 和 ArrayBlockingQueue\n\
    \nBlockingQueue 的 Javadoc 揭示了生产者-消费者应用的简单性，它比第 3 章中显示的等效实现（见 3-1）简单得多，因为它不需要处理同步问题。8-1\
    \ 使用 BlockingQueue 及其 ArrayBlockingQueue 实现实现了高层生产者-消费者模型。\n\n- 列表 8-1. 第 3 章\
    \ PC 的 BlockingQueue 等效实现\n\n```java\nimport java.util.concurrent.ArrayBlockingQueue;\n\
    import java.util.concurrent.BlockingQueue;\nimport java.util.concurrent.ExecutorService;\n\
    import java.util.concurrent.Executors;\n\npublic class PC {\n    public static\
    \ void main(String[] args) {\n        final BlockingQueue<Character> bq;\n   \
    \     bq = new ArrayBlockingQueue<>(26);\n        final ExecutorService executor\
    \ = Executors.newFixedThreadPool(2);\n        Runnable producer = () -> {\n  \
    \          for (char ch = 'A'; ch <= 'Z'; ch++) {\n                try {\n   \
    \                 bq.put(ch);\n                    System.out.printf(\"%c produced\
    \ by \" +\n                            \"producer.%n\", ch);\n               \
    \ } catch (InterruptedException ie) {\n                }\n            }\n    \
    \    };\n\n        executor.execute(producer);\n        Runnable consumer = ()\
    \ -> {\n            char ch = '\\0';\n            do {\n                try {\n\
    \                    ch = bq.take();\n                    System.out.printf(\"\
    %c consumed by \" + \"consumer.%n\", ch);\n                } catch (InterruptedException\
    \ ie) {\n                }\n            } while (ch != 'Z');\n            executor.shutdownNow();\n\
    \        };\n\n        executor.execute(consumer);\n    }\n}\n```\n\n列表 8-1 分别使用\
    \ BlockingQueue 的 `put()` 和 `take()` 方法将对象放入阻塞队列和从阻塞队列中移除对象。`put()` 在没有空间放入对象时阻塞；`take()`\
    \ 在队列为空时阻塞。\n\n尽管 BlockingQueue 确保字符在产生之前不会被消费，但此应用程序的输出可能相反。例如，这里是某次运行的部分输出：\n\
    \nY consumed by consumer.\nY produced by producer.\nZ consumed by consumer.\n\
    Z produced by producer.\n\n第 3 章的 PC 应用（列表 3-2）通过在 setSharedChar()/System.out.周围周围引入额外的同步层解决了这种错误的输出顺序。第\
    \ 7 章的 PC 应用（列表 7-2）通过将这些方法调用放在 `lock()` 和 `unlock()` 方法调用之间解决了这种错误的输出顺序。\n\n"
