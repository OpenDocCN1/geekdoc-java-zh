    # CHAPTER 7 THE LOCKING FRAMEWORK


    Listing 7-2 is similar to Listing 3-2''s PC application. However, it replaces
    synchronized and wait/notify with locks and conditions.


    PC''main() method initializes the Shared, Producer, and Consumer classes. The
    Shared instance is passed to the Producer and Consumer constructors and these
    threads are started.


    The Producer and Consumer constructors are called on the default main thread.
    Because the Shared instance is also accessed by the producer and consumer threads,
    this instance must be visible to these threads (especially when these threads
    run on different cores). In each Producer and Consumer, I accomplish this by declaring
    it be final. I could have declared this field to be volatile, but volatile suggests
    writing to the file and it shouldn''t been changed after being initialized.


    Check out Shared''s constructor. Notice it creates a lock via ReentrantLock();
    and creates a condition associated with this lock via lock.newCondition(); This
    lock is available to the producer and consumer threads via the getLock().


    The producer invokes Shared''s setSharedChar(char c) method to generate a new
    character and outputs a message identifying the produced character. This method
    locks the previously created lock object and ensures a loop that repeatedly tests
    variable available, which is when a produced character is available for consumption.


    While availability is true, the producer invokes the condition''s await() method
    to wait for availability to become false. The consumer signals the condition to
    wake up the producer when it has consumed the character. (Use a loop instead of
    an if statement because spurious wakeups are possible and availability might still
    be true.)


    After leaving its loop, the producer records the new character, assigns true to
    available to indicate that a new character is available for consumption, and signals
    the condition to wake up a waiting consumer. Lastly, it unlocks the lock and setSharedChar().


    > Note I lock the setSharedChar()/System.out.println() block in Producer''s run()
    method and the getSharedChar()/System.out.println() block in Consumer''s run()
    method to prevent the application from outputting consuming messages before producing
    messages, even though characters are produced before they''re consumed.


    The behavior of the consumer getSharedChar() method is similar to what I''ve just
    described for the producer thread and setSharedChar() method.


    > Note I didn''t use the try/finally idiom for ensuring a lock that is disposed
    of Producer''s and Consumer''s run() methods because an exception isn''t thrown
    from this context.'
