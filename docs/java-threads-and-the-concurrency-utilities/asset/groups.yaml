    # 关于作者


    ![](img/ee8e13b7e1a7473b1b247bbdf36a1be7_9_0.png)


    Jeff Friesen 是一位专注于 Java 的自由职业导师和软件开发者。除了编写了《Learn Java for Android Development》并合著了《Android
    Recipes》之外，Jeff 还为 JavaWorld (JavaWorld.com)、informIT (InformIT.com)、Java.net
    和 DevSource (DevSource.com) 写了许多关于 Java 和其他技术的文章。可以通过他的网站 TutorTutor.ca 与他联系。


    # 关于技术审查员


    ![](img/ee8e13b7e1a7473b1b247bbdf36a1be7_10_0.png)


    **Sumit Pal** 在软件行业拥有超过 22 年的经验，涵盖了从初创公司到大型企业的各种角色。他是一位大数据、可视化和数据科学顾问，也是一位软件架构师和大数据爱好者，致力于构建端到端的数据驱动分析系统。


    Sumit 曾在微软（SQL server 开发团队）、甲骨文（OLAP 开发团队）和 Verizon（大数据分析团队）工作，职业生涯跨越 22 年。


    目前，他为多个客户提供数据架构和大数据解决方案的咨询服务，并使用 Spark、Scala、Java 等进行代码开发。


    他在构建跨越中间层、数据层到分析应用可视化的全栈可扩展系统方面拥有丰富经验，使用了大数据、NoSQL 数据库。Sumit 在数据库内部原理、数据仓库、维度建模、使用
    Java 和 Python 进行数据科学以及 SQL 方面拥有深厚的专业知识。


    Sumit 拥有计算机科学的硕士和学士学位。


    # 致谢


    我要感谢许多协助我开发此书的人。我特别感谢 Steve Anglin 邀请我编写这本书，并感谢 Mark Powers 在写作过程中对我的指导。


    # 引言


    线程和并发工具并不是非常“酷”的话题，但它们是非复杂应用程序的重要部分。本书向你介绍了截至 Java 8 更新 60 包含的大多数 Java 特性和并发工具。


    第 1 章向你介绍了 `Thread` 类和 `Runnable` 接口。你将学到如何如何创建 `Thread` 和 `Runnable` 对象、获取和设置状态、启动线程、中断线程、将一个线程连接到另一个线程以及导致线程休眠。


    第 2 章侧重于同步。你将学习诸如竞态条件等问题，这些问题如果没有同步是无法解决的。你还将学习如何创建同步方法和同步块，以及如何使用忽略互斥的轻量级同步。


    第 3 章探讨了等待和通知这些重要主题。我回顾了 `Object` 类中支持这些概念的小型 API，然后通过一个生产者/消费者应用程序进行演示，在该程序中一个线程生产，另一个线程消费。


    第 4 章介绍了前章节未涵盖的三个概念。首先，你将学习线程本地变量 (thread-local variables)，它们并没有你想象的那么有用。最后，你将学习
    `Timer` 框架，它简化了定时任务的处理。


    前四章涵盖了低层线程处理。第 5 章通过引入并发工具切换到更高层次，这些工具可以简化多线程应用程序的开发并提高性能。本章随后探讨了使用 `Callable`
    和 `Future` 的执行器。


    第 6 章侧重于同步器（高级同步构造结构）。你将学习倒计时器 (latches)(一个或多个线程在“门”处等待，直到另一个线程打开这扇门，这些其他线程才能继续）、循环栅障
    (cyclic barriers)、信号量 (semaphores) 和栅栏器 (phasers)。


    第 7 章探讨了锁框架，它提供了不同于对象内置锁同步和 `Object` 等待/通知机制的条件等待和锁定接口及类。它提供了锁轮 (lock polling)
    等改进。


    最后，第 8 章介绍了第 5 到 7 章未涵盖的额外并发工具。具体来说，它向你介绍了并发集合、原子变量、Fork/Join 框架和完成服务。


