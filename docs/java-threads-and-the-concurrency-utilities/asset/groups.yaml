    \ the following code sequence:\n\n```\nID id = new ID();\nSystem.out.println(id.getID());\n\
    ```\n\nThe lock is associated with the ID object whose reference is stored in\
    \ id. If another thread called id.getID() while this method was executing, the\
    \ other thread would have to wait until the executing thread released the lock.\n\
    \nWhen synchronizing on a class method, the lock is associated with the java.lang.Class\
    \ object corresponding to the class whose class method is called. For example,\
    \ consider the following ID class:\n\n```java\npublic class ID\n{\n    private\
    \ static int counter; // initialized to 0 by default\n\n    public static synchronized\
    \ int getID()\n    {\n        return counter++;\n    }\n}\n```\n\nSuppose you\
    \ specify the following code sequence:\n\n```\nSystem.out.println(ID.getID());\n\
    ```\n\nThe lock is associated with ID.class, the Class object associated with\
    \ ID. If another thread called ID.getID() while this method was executing, the\
    \ other thread would have to wait until the executing thread released the lock.\n\
    \n## Using Synchronized Blocks\n\nA synchronized block of statements is prefixed\
    \ by a header. This has the syntax:\n\n```\nsynchronized(object)\n{\n    /* statements\
