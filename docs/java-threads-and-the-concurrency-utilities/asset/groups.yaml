    # 总结


    Java 提供了 `synchronized` 关键字来同步线程对临界区域的访问，因为很难正确编写基于 `synchronized` 的同步代码。高级同步器被包含在并发工具类中。


    倒计时计数器（latch）导致一个或多个线程在“大门”处等待，直到另一个线程打开这扇门，此时这些线程就可以继续。它由一个计数以及“导致线程等待直到计数减零”和“递减计数”的操作组成。


    循环屏障（cyclic barrier）允许一组线程等待彼此到达共同的屏障点。该同步器适用于涉及固定大小线程组的应用，这些线程偶尔需要相互等待。它是循环的，因为在等待的线程被释放后，它可以被重用。


    交换器（exchanger）提供了一个同步点，线程可以在此处交换对象。每个线程在进入交换器的 `exchange()` 方法时提供某个对象，与一个伙伴线程匹配，并在返回时接收其伙伴的对象。


    信号量（semaphore）维护一组许可，用以限制访问有限资源的线程数量。尝试获取许可的线程在没有可用许可时会被阻塞，直到其他某个线程释放许可。


    `phaser`（注册器）是一个更灵活的循环屏障。像循环屏障一样，`phaser` 允许一组线程在屏障上等待；这些线程在最后一个线程到达后继续。`phaser`
    还提供了等同于屏障动作（barrier action）的功能。与协调固定数量线程的循环屏障不同，`phaser` 可以协调数量数量的线程，线程可以随时注册。为了实现这一功能，`phaser`
    使用阶段（phases）和阶段数（phase numbers）。


    第 7 章介绍了锁框架。


    # 第 7 章


    # 锁框架


    `java.util.concurrent.locks` 包提供了一个由接口和类组成的框架，用于锁定和等待条件，这种方式与对象基于内置锁的同步以及 `java.lang.Object`
    的 `wait/notification` 机制有所不同。并发工具类包含了锁框架，它通过提供锁轮（lock polling）、超时等待等改进了内置同步和等待/通知机制。


    # 同步化与低级锁


    Java 支持同步，以便线程可以安全地更新共享变量，并确保线程的更新对其他线程可见。我们通过在方法或代码块上标记 `synchronized` 关键字来在代码中利用同步。这些代码序列被称为临界区域（critical
    sections）。Java 虚拟机（JVM）通过监视器（monitors）和 `monitorexit` JVM 指令支持同步。


    每个 Java 对象都关联有一个监视器，这是一种互斥结构（允许只有一个线程在临界区域内执行），它可以防止多个线程并发执行临界区域。在线程进入临界区域之前，需要锁定监视器。如果监视器已被锁定，线程将阻塞，直到监视器解锁（由另一个线程离开临界区域）。


    在多核/多处理器环境中，当线程锁定监视器时，存储在主内存中的共享变量会被读取到存储在线程工作内存（称为本地内存或缓存内存）中的变量副本中。此操作确保线程将使用这些变量的最新值而不是旧值，这被称为可见性（visibility）。线程继续使用其共享变量的副本进行工作。当线程离开临界区域并解锁监视器时，其共享变量副本中的值会被写回主内存，使得下一个进入临界区域的线程能够访问这些变量的最新值。（`volatile`
    关键字仅解决可见性问题。）


    锁框架包含了常用的 `Lock`、`ReentrantLock`、`Condition`、`ReadWriteLock` 和 `ReentrantReadWriteLock`
    类型，我将在本章中探讨它们。我还会简要介绍 Java 8 引入的 `StampedLock` 类。


    # Lock


    `Lock` 接口提供了比通过监视器获取更具表达力的锁定操作。例如，当锁不可用时你可以立即退出获取尝试。该接口了以下方法：


    - void lock(): 获取锁。当锁不可用时，调用线程被强制等待直到可用。

    - void lockInterruptibly(): 获取锁，除非调用线程被中断。当锁不可用时，调用线程被强制等待直到可用或线程被中断，这会导致该方法抛出
    `java.lang.InterruptedException`。

    - Condition newCondition(): 返回一个绑定到此 `Lock` 实例的新 `Condition` 实例。当 `Lock` 类不支持时，该方法会抛出
    `java.lang.UnsupportedOperationException`。

    - boolean tryLock(): 在调用此方法时可用时获取可用。获取锁时返回 `true`，未获取锁时返回 `false`。

    - boolean tryLock(long time, TimeUnit unit): 在等待时间内（以 `java.util.concurrent.TimeUnit`
    单位，如秒、毫秒等测量）且调用线程未被中断时可用获取锁。当锁不可用时，调用线程被强制等待直到在等待时间内可用或被中断，这会导致该方法返回 `true` 或
    `false`。

    - void unlock(): 释放锁。


    获取的锁必须释放。在 `synchronized` 块和与对象相关的隐式监视器上下文中，锁的获取和释放是以块结构方式进行的。当获取多个锁时，它们以相反顺序释放，并且所有锁都在获取它们的相同作用域内释放。


    在 `Lock` 实现上下文中，锁的获取和释放可以更灵活。例如，某些并发访问数据结构的算法需要使用“手递锁”（hand-over-hand）或“链锁”（chain
    locking）：你获取节点 A 的锁，然后是 B，释放 A 并获取 C，然后释放 B 并获取 D，以此此类推。


