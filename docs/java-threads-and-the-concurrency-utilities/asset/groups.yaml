    # 附录 B Swing 中的多线程


    Swing 是单线程的，其结果之一是你只能在 EDT（事件分发线程）上创建 Swing 应用程序的 GUI。在任何其他线程上创建此 GUI 都是错误的，包括运行
    Java 应用程序 `main()` 方法的默认主线程。


    大多数 Swing 对象（例如 `javax.swing.JFrame`，它描述了带有窗口、菜单栏和边框的 GUI 顶层“框架 (frame)”）都不是线程安全的。从多个线程访问这些对象会带来线程干扰和/或不一致性错误的风险：


    - **线程干扰（Thread interference）：** 两个线程在操作相同数据时正在执行两个不同的操作。例如，一个线程读取一个 `long` 计数器变量，而另一个线程在更新该变量。由于在
    32 位机器上读取或写入一个 `long` 类型需要两次读取/写入访问，可能出现读取线程读取了该变量当前值的部分内容，然后写入线程更新了变量的其余部分，紧接着读取线程又读取了错误的值。


    - **内存不一致性错误（Memory inconsistency errors）：** 运行在不同处理器或处理器核心上的两个或多个线程对相同数据拥有不一致的值。例如，在一个处理器上写入或更新一个计数器变量，然后在另一个处理器上写入或读取该变量。然而，由于使用了缓存机制来提高性能，两个线程都没有访问主内存中变量的单份拷贝。每个线程都从本地内存（缓存）访问其各自的变量拷贝。


    当 GUI 不在 EDT 上创建时，这些问题是如何发生的呢？John Zakowski 在他的 JavaWorld 文章 [Swing threading-and-the-event-dispatch
    thread-(www.javaaworld.com/article/2077754/core-java/swing-threading-and-the-event-dispatch-thread)
    中演示了这种场景。


    Zukowski 提供了一个向框架窗口组件添加容器监听器（container listener）的示例。当组件被添加到框架或从框架中移除时，监听器方法会被调用。他演示了在默认主线程实现框架（realized）之前，在监听器方法中运行
    EDT 代码。


    注意：被实现（realized）意味着组件的 `paint()` 方法已经过调用，或者可能会被调用。通过在此容器组件上调用 `setVisible(true)`、`show()`
    或 `pack()` 中的任意一个，框架窗口会被实现。框架窗口被实现后，它包含的所有组件也随之实现。实现组件的另一种方法是将其添加到已经set的容器中。


    当 EDT 开始在监听器方法中运行，而默认主线程继续初始化 GUI 时，组件可能由默认主线程创建并被 EDT 访问。EDT 可能会在组件存在之前尝试访问它们；因此这样做可能会导致应用程序崩溃。


    即使 GUI 不是在 EDT 上创建的，如果 EDT 在默认主线程创建组件之前尝试访问它们，也可能导致应用程序崩溃。示例 B-1 展示了由于缓存，EDT 在监听器方法中无法访问组件时可能出现的
    `NullPointerException` 异常。该示例展示了 Swing 线程中的问题。


    '
