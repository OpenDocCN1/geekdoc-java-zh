    \n```\nThread t = new Thread(r);\nSystem.out.println(t.isDaemon()); // 输出: false\n\
    ```\n\n## 第1章 线程与可运行对象\n\n默认情况下，与 Thread 对象关联的线程是非守护线程。要创建一个守护线程，必须调用 Thread 的\
