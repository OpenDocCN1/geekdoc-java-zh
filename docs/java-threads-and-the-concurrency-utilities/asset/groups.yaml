    # Semaphores


    A semaphore maintains a set of permits for restricting the number of threads that
    can access a limited resource. A thread attempting to acquire a permit when no
    permits are available blocks until some other thread releases a permit.


    > Semaphores whose current values can be incremented past 1 are known as counting
    semaphores, whereas semaphores whose current values can be only 0 or 1 are known
    as binary semaphores or mutexes. In either case, the current value cannot be negative.


    The java.util.concurrent.Semaphore class implements this synchronizer and conceptualizes
    a semaphore as an object maintaining a set of permits. You initialize a semaphore
    by invoking the Semaphore(int permits) constructor where permits specifies the
    number of available permits. The resulting semaphore''s fairness policy is set
    to false (unfair). Alternatively, you can invoke the Semaphore(int permits, boolean
    fair) constructor to also set the semaphore''s fairness setting to true (fair).


