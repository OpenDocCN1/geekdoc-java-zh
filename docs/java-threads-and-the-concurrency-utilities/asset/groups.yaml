    \ from within a synchronized block that synchronizes the same object as the object\
    \ on wait() is called (obj). Because of the possibility of spurious wakeups (a\
    \ thread wakes up without being notified, interrupted, or timing out), wait()\
    \ is called within a while loop that tests for the condition holding and reexec\
    \ wait() when the condition still doesn't hold. While the while loop exits, the\
    \ condition exists and an action appropriate to the condition can be performed.\n\
    \n> Caution Never call a wait() method outside of a loop. The loop tests the condition\
    \ before and after the wait() call. Testing the condition before calling wait()\
    \ ensures liveness. If this test was not present, and if the condition and notify()\
    \ had been called prior to wait() being called, it's unlikely that the waiting\
    \ would ever wake up. Retesting the condition after calling wait() ensures safety.\
    \ If testing didn't occur, or if the condition didn't hold after the thread had\
    \ awakened from the wait() call (perhaps another thread call notify() accidentally\
    \ when the condition didn't hold), the thread would proceed to destroy the lock's\
    \ invariants.\n\nThe following code fragment demonstrates the notify() method,\
    \ which notifies the waiting thread in the previous example:\n\n```\nsynchronized(obj)\n\
    {\n  // Set the condition.\n\n  obj.notify();\n}\n```\n\nNotice that notify()\
    \ is called from a critical section guarded by the same object (obj) as the critical\
    \ section for the wait() method. Also, notify() is called using the same object\
    \ reference. Follow this pattern and you shouldn't get into trouble.\n\n> Note\
    \ There has been much discussion about which notify method is better: notify()\
    \ or notifyAll(). For example, check out \"Difference between notify() and notifyAll()\"\
    \ (http://stackoverflow.com/questions/14924610/difference-between-notify-and-notifyall).\
    \ If you're wondering which method to use, I would use notify() in an application\
    \ where there are only two threads, and either thread occasionally waits and needs\
    \ to be notified by the other thread. Otherwise, I would use notifyAll().\n\n\
    # Producers and Consumers\n\nA classic example of thread communication involving\
    \ conditions is the relationship between a producer thread and a consumer thread.\
    \ The producer thread produces data items to be consumed by the consumer thread.\
    \ Each produced data item is stored in a shared variable.\n\nImagine that the\
    \ threads are running at different speeds. The producer might produce a new data\
    \ item and record it in the shared variable before the consumer retrieves the\
    \ previous item for processing. Also, the consumer might retrieve the contents\
    \ of the shared variable before a new data item is produced.\n\nTo overcome these\
    \ problems, the producer thread must wait until it's notified that the previously\
    \ produced data item has been consumed, and the consumer thread must wait until\
    \ it's notified that a new data item has been produced. Listing 3-1 shows you\
    \ how to accomplish this task wait() and notify().\n\nListing 3-1. The Producer-Consumer\
    \ Relationship Version 1\n\n```\npublic class PC {\n    public static void main(String[]\
    \ args) {\n        Shared s = new Shared();\n        new Producer(s).start();\n\
    \        new Consumer(s).start();\n    }\n}\n\nclass Shared {\n    private char\
    \ c;\n    private volatile boolean writeable = true;\n\n    synchronized void\
    \ setSharedChar(char c) {\n        while (!writeable) {\n            try {\n \
    \               wait();\n            } catch (InterruptedException e) {\n    \
    \        }\n        }\n        this.c = c;\n        writeable = false;\n     \
    \   notify();\n    }\n}\n```\n\n```\nclass Producer extends Thread\n{\n    private\
    \ final Shared s;\n\n    Producer(Shared s) {\n        this.s = s;\n    }\n\n\
    \    @Override\n    public void run() {\n        for (char ch = 'A'; ch <= 'Z';\
    \ ch++) {\n            s.setSharedChar(ch);\n            System.out.println(ch\
    \ + \" produced by producer.\");\n        }\n    }\n}\n```\n\n```\nclass Consumer\
    \ extends Thread\n{\n    private final Shared s;\n\n    Consumer(Shared s) {\n\
    \        this.s = s;\n    }\n}\n```\n\n# CHAPTER 3 WAITING AND NOTIFICATION\n\n\
    ```\n@Override\npublic void run() {\n    char ch;\n    do {\n        ch = s.getSharedChar();\n\
    \        System.out.println(ch + \" consumed by consumer.\");\n    }\n    while\
    \ (ch != 'Z');\n}\n```\n\nThis application creates a Shared object and two threads\
    \ that get a copy of the object's reference. The producer calls the object's setSharedChar()\
    \ method to save each of 26 uppercase letters; the consumer calls the object's\
    \ getSharedChar() method to acquire each letter.\n\nThe writable instance field\
    \ tracks two conditions: the producer waiting on the consumer to consume a item\
    \ and the consumer waiting on the producer to produce a new item. It helps coordinate\
    \ execution of the producer and consumer. The following scenario, when the consumer\
    \ executes first, illustrates this coordination:\n\n1. The consumer executes s.getSharedChar()\
    \ to retrieve a letter.\n2. Inside of synchronized method, the consumer calls\
    \ wait() because writable contains true. The consumer now waits until it receives\
    \ notification from the producer.\n3. The producer executes s.setSharedChar(ch);\n\
    4. When the producer enters synchronized method(which is possible because the\
    \ consumer released the lock inside of wait() method prior to waiting), the producer\
    \ discovers writable's value to be true and doesn't call wait().\n5. The producer\
    \ saves the character, sets writable to false (which will cause the producer to\
    \ wait on the next setSharedChar() call when the consumer has not consumed the\
    \ character by that time), and calls notify() to awaken the consumer (assuming\
    \ the consumer is waiting).\n6. The producer exits setSharedChar(char c).\n7.\
    \ The consumer wakes up (and acquires the lock), sets writable to true (which\
    \ will cause the consumer to wait on the next getSharedChar() call when the producer\
    \ has not produced a character by that time), notifies the producer to awaken\
    \ that thread (assuming the producer is waiting), and returns the shared character.\n"
  mdcn: "\n\n# 第 3 章 等待与通知\n\n- notify(): 如果有任何线程等待该对象的监视器（monitor），则会选择其中一个线程进行唤醒。这种选择是随机的，取决于具体的实现。被唤醒的线程在当前线程释放该对象的锁之前将无法继续。被唤醒的线程将以通常的方式与任何可能积极竞争该对象同步的线程进行竞争；因为，被唤醒的线程在下一个锁定该对象的线程中既没有优势也没有劣势。\n\
    \n- notifyAll(): 唤醒所有等待该对象监视器的线程。被唤醒的线程在当前线程释放该对象的锁之前将无法继续。被唤醒的线程将以通常的方式与任何可能积极竞争该对象同步的线程进行竞争；因为，被唤醒的线程在下一个锁定该对象的线程中既没有优势也没有劣势。\n\
    \n当当前线程等待通知之前或期间有任何线程被中断时，`wait()` 方法会抛出 `java.lang.InterruptedException`。抛出此异常时，当前线程的中断状态会被清除。\n\
    \n> 当调用对象的 `wait()` 方法时，线程会释放与对象相关的监视器的所有权。\n\n此 API 利用了对象的条件队列（condition queue），该数据结构存储了等待某个条件存在的线程。这些等待线程被称为等待集（wait\
    \ set）。由于条件队列与对象的锁紧密绑定，所有五个方法都必须在同步上下文（synchronized context）中调用（当前线程必须是对象监视器的所有者）；否则，将抛出\
    \ `java.lang.IllegalMonitorStateException`。\n\n以下代码/伪代码片段演示了无参数的 `wait()`：\n\n\
    ```\nsynchronized(obj) {\n    while (<condition does not hold>) {\n        obj.wait();\n\
    \    }\n    // 执行符合条件的操作。\n}\n```\n\n# 第 3 章 等待与通知\n\n`wait()` 方法是在 `synchronized`\
    \ 块内部调用的，该块与调用 `wait()` 的对象（`obj`）同步的是同一个对象。由于存在虚假唤醒（spurious wakeups，即线程在没有被通知、中断或超时的情况下被唤醒），`wait()`\
    \ 是在一个 `while` 循环内调用的，该循环测试条件是否满足，并在条件仍不满足时重新执行 `wait()`。当 `while` 循环退出时，条件已经满足，可以执行符合条件的操作。\n\
    \n> 警告：永远不要在循环之外调用 `wait()` 方法。循环在 `wait()` 调用之前和之后都会测试条件。在调用 `wait()` 之前测试条件可以确保存活性。如果没有进行这个测试，且条件和\
    \ `notify()` 在调用 `wait()` 之前已经被调用，那么等待可能永远不会被唤醒。在调用 `wait()` 之后重新测试条件可以确保安全性。如果没有进行测试，或者在线程从\
    \ `wait()` 调用中唤醒后条件仍不满足（可能可能另一个线程在条件不满足时意外调用了 `notify()`），该线程将继续破坏锁的不变性。\n\n以下代码片段演示了\
    \ `notify()` 方法，它通知了上一个示例中的等待线程：\n\n```\nsynchronized(obj)\n{\n  // 设置条件。\n\n\
    \  obj.notify();\n}\n```\n\n注意，`notify()` 是在同一个对象（`obj`）保护的临界区内调用的，这与 `wait()`\
    \ 方法的临界区相同。此外，`notify()` 使用相同的对象引用。遵循这种模式，你就不会遇到麻烦。\n\n> 注意：关于哪种 `notify` 方法更好（`notify()`\
    \ 还是 `notifyAll()`）一直有很多讨论。例如，查看“notify() 和 notifyAll() 之间的区别”（http://stackoverflow.com/questions/14924610/difference-between-notify-and-notifyall）。如果你想知道应该使用哪种方法，在只有两个线程且其中一个线程偶尔等待并需要另一个线程通知的应用程序中，我会使用\
    \ `notify()`。否则，我会使用 `notifyAll()`。\n\n# 生产者与消费者\n\n涉及条件的线程通信的一个经典示例是生产者线程与消费者线程之间的关系。生产者线程产生供消费者线程消费的数据。每个产生的数据项都存储在共享变量中。\n\
    \n假设线程以不同的速度运行。生产者可能在消费者获取上一个项目进行处理之前产生一个新的数据项并将其记录在共享变量中。同样，消费者可能在新数据项产生之前获取共享变量的内容。\n\
    \n为了解决这些问题，生产者线程必须等待被通知之前产生的数据项已被消费，而消费者线程必须等待被通知一个新数据项已产生。列表 3-1 显示了如何通过 `wait()`\
    \ 和 `notify()` 完成此任务。\n\n列表 3-1. 生产者-消费者关系版本 1\n\n```\npublic class PC {\n   \
    \ public static void main(String[] args) {\n        Shared s = new Shared();\n\
    \        new Producer(s).start();\n        new Consumer(s).start();\n    }\n}\n\
    \nclass Shared {\n    private char c;\n    private volatile boolean writeable\
    \ = true;\n\n    synchronized void setSharedChar(char c) {\n        while (!writeable)\
    \ {\n            try {\n                wait();\n            } catch (InterruptedException\
    \ e) {\n            }\n        }\n        this.c = c;\n        writeable = false;\n\
    \        notify();\n    }\n}\n```\n\n```\nclass Producer extends Thread\n{\n \
    \   private final Shared s;\n\n    Producer(Shared s) {\n        this.s = s;\n\
    \    }\n\n    @Override\n    public void run() {\n        for (char ch = 'A';\
    \ ch <= 'Z'; ch++) {\n            s.setSharedChar(ch);\n            System.out.println(ch\
    \ + \" produced by producer.\");\n        }\n    }\n}\n```\n\n```\nclass Consumer\
    \ extends Thread\n{\n    private final Shared s;\n\n    Consumer(Shared s) {\n\
    \        this.s = s;\n    }\n}\n```\n\n# 第 3 章 等待与通知\n\n```\n@Override\npublic\
    \ void run() {\n    char ch;\n    do {\n        ch = s.getSharedChar();\n    \
    \    System.out.println(ch + \" consumed by consumer.\");\n    }\n    while (ch\
    \ != 'Z');\n}\n```\n\n此应用程序创建了一个 `Shared` 对象和两个获取了该对象引用的线程。生产者调用对象的 `setSharedChar()`\
    \ 方法来保存 26 个大写字母；消费者调用对象的 `getSharedChar()` 方法获取每个字母。\n\n`writeable` 实例字段跟踪了两个条件：生产者等待消费者消费项目，消费者等待生产者产生新项目。它有助于协调生产者和消费者的执行。以下场景（当消费者先执行）说明了这种协调：\n\
    \n1. 消费者执行 `s.getSharedChar()` 来检索字母。\n2. 在 `synchronized` 方法内部，由于 `writeable`\
    \ 为 `true`，消费者调用了 `wait()`。消费者现在等待来自生产者的通知。\n3. 生产者执行 `s.setSharedChar(ch)`。\n\
    4. 当生产者进入 `synchronized` 方法时（由于消费者在调用 `wait()` 方法之前释放了锁），生产者发现 `writeable` 的值为\
    \ `true` 并且没有调用 `wait()`。\n5. 生产者保存字符，将 `writeable` 设置为 `false`（这会导致生产者在消费者消费该字符之前在下次调用\
    \ `setSharedChar()` 时进入等待），并调用 `notify()` 唤醒消费者（假设消费者正在等待）。\n6. 生产者退出 `setSharedChar(char\
    \ c)`。\n7. 消费者唤醒（并获取锁），将 `writeable` 设置为 `true`（这会导致消费者在生产者产生字符之前在下次调用 `getSharedChar()`\
    \ 时进入等待），并通知生产者以唤醒该线程（假设生产者正在等待），并返回共享字符。\n\n"
