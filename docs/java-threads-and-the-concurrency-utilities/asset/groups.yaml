- md: "\n# EXERCISES\n\nThe following exercises are designed to test your understanding\
    \ of Chapter 7's content:\n\n- 1. Define lock.\n\n- 2. What is the biggest advantage\
    \ that Lock objects hold over the intrinsic locks that are obtained when threads\
    \ enter critical sections (controlled via the synchronized reserved word)?\n\n\
    - 3. True or false: ReentrantLock().unlock() throws IllegalMonitorStateException\
    \ when the calling thread doesn't hold the lock.\n\n- 4. How do you obtain a Condition\
    \ instance for use with a particular Lock instance?\n\n- 5. True or false: ReentrantReadWriteLock()\
    \ creates an instance of ReentrantReadWriteLock with a fair ordering policy.\n\
    \n- 6. Define StampedLock.\n\n- 7. The java.util.concurrent.locks package includes\
