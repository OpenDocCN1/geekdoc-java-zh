    # Exchangers


    An exchanger provides a synchronization point where threads can swap objects.
    Each thread presents some object on entry to the exchanger''s exchange() method,
    matches with a partner thread, and receives its partner''s object on return. Exchangers
    can be useful in applications such as genetic algorithms (see http://en.wikipedia.org/wiki/Genetic_algorithm)
    and pipeline designs.'
