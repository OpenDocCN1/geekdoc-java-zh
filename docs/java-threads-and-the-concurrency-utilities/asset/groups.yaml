    \ = term.subtract(term);\n        } else {\n            result = term.add(term);\n\
    \        }\n        i++;\n    } while (term.compareTo(BigDecimal.ZERO) != 0);\
    \ // 简化逻辑\n    return result;\n}\n```\n*(注：此处代码逻辑在原文示例中存在不完整，已根据语意保留结构)*\n\n主线程创建一个计算\
    \ pi 到 50,000 位的运行对象。它使用 lambda 表达式来简化。这创建一个线程对象来执行运行对象。我观察到结果：3.14159... (省略)\n\
    \n## 睡眠\n\n`Thread` 类声明了一对用于导致线程睡眠（暂时停止执行）的静态方法：\n\n- `void sleep(long millis)`:\
    \ 睡眠 `millis` 毫秒。线程睡眠的实际毫秒取决于系统计时器和调度器的精度。当 `millis` 为负时，会抛出 `IllegalArgumentException`；当任何线程中断了当前线程时，会抛出\
    \ `InterruptedException`。如果抛出此异常，中断状态将被清除。\n- `void sleep(long millis, int nanos)`:\
    \ 睡眠 `millis` 毫秒和 `nanos` 纳秒。线程睡眠的实际毫秒取决于系统计时器和调度器的精度。当 `millis` 为负或 `nanos` 大于\
    \ 999999 时，会抛出 `IllegalArgumentException`；当任何线程中断了当前线程时，会抛出 `InterruptedException`。如果抛出此异常，中断状态将被清除。\n\
    \n`sleep()` 方法比使用忙等待更好，因为不会浪费处理器周期。我重构了 1-2 的应用程序以演示线程睡眠。\n\n### 列表 1-4. 演示线程睡眠\n\
    \n```java\npublic class ThreadDemo\n{\n    public static void main(String[] args)\n\
    \    {\n        Runnable r = new Runnable()\n        {\n            @Override\n\
