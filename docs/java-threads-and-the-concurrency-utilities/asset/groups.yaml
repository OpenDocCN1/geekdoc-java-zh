    \n## 获取和设置线程的守护状态\n\nJava 允许线程作为守护线程（daemon threads）或非守护线程（nondemon threads）。守护线程是作为非守护线程辅助者的线程，当应用程序最后一个非守护线程死亡时，它会自动死亡，以便应用程序能够终止。\n\
