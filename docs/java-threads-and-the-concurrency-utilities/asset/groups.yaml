    \ to be reentrant to prevent deadlock (discussed later). When a thread attempts\
    \ to acquire a lock that it's already holding, the request succeeds.\n\n> The\
    \ java.lang.Thread class declares a static boolean holdsLock(Object o) method\
    \ that returns true when the calling thread holds the lock on object o. You will\
    \ find this method handy in assertion statements, such as assert Thread.holdsLock(o);\n\
    \nJava provides the synchronized keyword to serialize thread access to a method\
    \ or a block of statements (the critical section).\n\n## Using Synchronized Methods\n\
    \nA synchronized method includes the synchronized keyword in its header. For example,\
    \ you can use this keyword to synchronize the former getID() method and overcome\
