    can access a limited resource. A thread attempting to acquire a permit when no
    permits are available blocks until some other thread releases a permit.


    A phaser is a more flexible cyclic barrier. Like a cyclic barrier, a phaser lets
    a group of threads wait on a barrier; these threads continue after the last thread
    arrives. A phaser also offers the equivalent of a barrier action. Unlike a cyclic
    barrier, which coordinates a fixed number of threads, a phaser can coordinate
    a variable number of threads, which can register at any time. To implement this
    capability, a phaser uses phases and phase numbers.


    Chapter 7 presents the Locking Framework.'
