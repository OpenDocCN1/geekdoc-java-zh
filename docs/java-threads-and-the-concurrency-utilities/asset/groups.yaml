    The concurrency utilities address these problems by including concurrent collections,
    which are performant and highly-scalable collections-oriented types that are stored
    in the java.util.concurrent package. Its collections-oriented classes return weakly-consistent
    iterators, which are iterators that have the following properties:


    +   * An element that''s removed after iteration starts hasn''t yet been returned
    via the iterator''s next() method won''t be returned.


    +   * An element that''s added after iteration starts may or may not be returned.


    +   * No element is returned more than once during the iteration of a collection,
    regardless of changes made to the collection during iteration.


    The following list lists a short sample of concurrency-oriented collection types
    that you''ll find in the java.util.concurrent package:


    +   * BlockingQueue is a subinterface of java.util.Queue that also supports blocking
    operations that wait for the queue to become nonempty before retrieving an element
    and wait for space to store an element. Each of ArrayBlockingQueue, DelayQueue,
    LinkedBlockingQueue, PriorityBlockingQueue, and SynchronousQueue implement this
    interface directly. The LinkedDeque and LinkedTransferQueue implement this interface
    BlockingQueue subinterfaces.


    +   * ConcurrentMap is a subinterface of java.util.Map that declares additional
    indivisible putIfAbsent(), remove(), and replace() methods. The ConcurrentHashMap
    class (the concurrent equivalent of java.util.HashMap), the ConcurrentNavigableMap
    class, and the ConcurrentSkipListMap class implement this.'
