  - '[PAGE 200]


    # APPENDIX B THREADING IN SWING


    The only remaining significant model object to create is the projector, and main()
    accomplishes this task by passing the List Slide objects returned from loadSlides()
    and the previously created Screen object to Projector''s constructor.


    main()''s final task is to cause the GUI to be constructed on the EDT. This sets
    the content pane to the Screen object and invokes Projector''s void start() method
    to begin the slide show. It also creates a window listener that invokes Projector''s
    void stop() when the user attempts to close the window. The window is disposed.


    Projector is responsible for managing the slide show. The main timer object is
    responsible for advancing the projector to the next slide, and the subordinate
    timer object (which is created each time the main timer fires an action event)
    is responsible for transitioning from the currently displayed slide image to the
    next slide''s image (with help from blend()).


    Each timer instance runs on the EDT. It''s important that the main timer does
    not execute a timer task while the subordinate timer is running. If this rule
    isn''t followed, the slide executions will malfunction. I''ve chosen a period
    of 3000 milliseconds between successive executions of the main timer task and
    10 milliseconds between successive executions of the subordinate timer task, which
    runs 100 times for an approximate total of 1000 milliseconds. When the subordinate
    timer task finishes, it stops itself.


    Compile Listing B-6 as follows:


    ```

    javac SlideShow.java

    ```


    Assuming a Windows operating system, run the resulting application as follows:


    ```

    java SlideShow ..ss

    ```


    ss identifies the example solar system slide show (included in this book''s code)
    and is located in the parent directory of the current directory.'
