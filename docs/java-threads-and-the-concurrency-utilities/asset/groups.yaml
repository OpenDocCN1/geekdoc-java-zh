    \                condition.await();\n            }\n        } catch (InterruptedException\
    \ ie) {\n            ie.printStackTrace();\n        } finally {\n            this.c\
    \ = c;\n            available = true;\n            condition.signal();\n     \
    \       lock.unlock();\n        }\n    }\n}\n\nclass Producer extends Thread {\n\
    \    private final Lock l;\n    private final Shared s;\n\n    Producer(Shared\
    \ s) {\n        this.s = s;\n        l = s.getLock();\n    }\n\n    @Override\n\
    \    public void run() {\n        for (char ch = 'A'; ch <= 'Z'; ch++) {\n   \
