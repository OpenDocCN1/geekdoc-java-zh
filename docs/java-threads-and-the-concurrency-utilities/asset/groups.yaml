  - '[PAGE 106]


    # SEMAPHORES AND FAIRNESS


    When the fairness setting is false, Semaphore makes no guarantees about the order
    in which threads acquire permits. In particular, barging is permitted; that is,
    a thread invoking acquire() can be allocated a permit ahead of a thread that has
    been waiting—log the new thread places itself at the head of the queue of waiting
    threads. When fair is true, the semaphore guarantees that threads invoking any
    of the acquire() methods are selected to obtain permits in the order in which
    their invocation of these methods was processed (first-in-first-out; FIFO). Because
    FIFO ordering necessarily applies to specific internal points of execution within
    these methods, it''s possible for one thread to invoke acquire() before another
    thread reach the ordering point after the other thread, and similarly upon return
    from the method. Also, the untried tryAcquire() methods don''t honor the fairness
    setting; they''ll take any available permits.


    Generally, semaphores used to control resource access should be initialized as
    fair, to ensure that no thread is starved out from accessing a resource. When
    using semaphores for other kinds of synchronization control, the throughput advantages
    of unfair ordering outweigh fairness considerations.


    Semaphore also offers the permit from the following methods:


    +   - void acquire(int permits): Acquire permits from this semaphore, blocking
    until they are available or the calling thread is interrupted. InterruptedException
    is thrown when interrupted; IllegalArgumentException is thrown when permits is
    less than zero.


    +   - void acquireUninterruptibly(): Acquire a permit, blocking until one is available.


    +   - void acquireUninterruptibly(int permits): Acquire permits, blocking until
    they are all available. IllegalArgumentException is thrown when permits is less
    than zero.


    +   - int availablePermits(): Return the current number of available permits.
    This method is useful for debugging and testing.


    +   - int drainPermits(): Acquire and return a count of all permits that are immediately
    available.'
