    # CHAPTER 4 ADDITIONAL THREAD CAPABILITIES


    After the last live reference to a Timer object goes away and all outstanding
    timer tasks have completed execution, the timer''s task-execution thread terminates
    gracefully (and becomes subject to garbage collection). However, this can take
    arbitrarily long to occur. (By default, the task-execution thread doesn''t run
    as a daemon, so it''s capable of preventing an application from terminating.)
    When an application wants to terminate a timer''s task-execution thread rapidly,
    the application should invoke Timer''s cancel().


    When the timer''s task-execution thread terminates unexpectedly, for example,
    because its stop() method was invoked (you should never call any of Thread''s
    stop() methods because they''re inherently unsafe), any further attempt to schedule
    a timer task on the timer results in IllegalStateException, as if Timer''s cancel()
    method had been invoked.


    # TimerTask in Depth


    Timer tasks are instances of classes that subclass the abstract TimerTask class,
    which implements the Runnable interface. When subclassing TimerTask, you override
    your run() method to supply the timer task''s code.


    > Note Timer tasks should complete quickly. When a timer task takes too long to
    complete, it "hogs" the timer''s task-execution thread, delaying the execution
    of subsequent timer tasks, which may "bunch up" and execute in rapid succession
    if and when the offending task finally completes.


    You can also call the following methods from within the overriding timer task''s
    run() method:


    +   - cancel(): Cancel this timer task. The timer task has been scheduled for
    one-shot execution and hasn''t run or when it hasn''t been scheduled, it will
    never run. When the timer has been scheduled for repeated execution, it will never
    run again. (When the timer is running when this call occurs, the timer will run
    to completion, but never run again.) Calling cancel() within the run() of a repeating
    timer task absolutely guarantees that the timer task won''t run again; the second
    and subsequent calls have no effect. This method returns true when this timer
    task is scheduled for one-shot execution and hasn''t run or when this timer task
    is scheduled for repeated execution. It returns false when the timer task was
    scheduled for one-shot execution and has already run, or when the timer task was
    already canceled. (Loosely speaking, this method returns true when it prevents
    one or more scheduled executions from taking place.)


