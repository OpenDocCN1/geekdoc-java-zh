    # # Summary


    Java applications execute via threads, which are independent paths of execution
    through an application''s code. Each application has a default main thread that
    executes the main() method. The application can also create threads to perform
    time-intensive tasks in the background so it remains responsive to its users.
    These threads execute code sequences encapsulated in objects that are known as
    runnables.


    The Thread class provides a consistent interface to the underlying operating system
    threading architecture. (The operating system is typically responsible for creating
    and managing threads.) A single operating system thread is associated with the
    thread that''s associated with a Thread object.


    The Runnable interface supplies the code to be executed by Runnable''s run() method—a
    thread receives no arguments and returns no value although it might throw an exception.'
