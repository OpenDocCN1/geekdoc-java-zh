    # 第4章 额外的线程能力


    当对 `Timer` 对象的最后一个活引用消失且所有待处理定时器任务都完成执行后，定时器的任务执行线程将优雅终止（并变为垃圾回收对象）。然而，这种情况发生可能需要任意长的时间。（默认情况下，任务执行线程不作为守护线程运行，因此它能够阻止应用程序终止。）当应用程序想要快速终止定时器的任务执行线程时，应该调用
    `Timer` 的 `cancel()`。


    当定时器的任务执行线程意外终止时（例如，因为调用了它的 `stop()` 方法，你永远不要调用 `Thread` 的任何 `stop()` 方法，因为它们在本质上是不安全的），任何进一步在定时器上尝试调度定时器任务的尝试都会导致
    `IllegalStateException`，就像调用了 `Timer` 的 `cancel()` 方法一样。


    # 深入理解 TimerTask


    定时器任务是抽象类 `TimerTask` 子类的实例，该类实现了 `Runnable` 接口。在子类 `TimerTask` 时，你需要重写 `run()`
    方法以提供定时器任务的代码。


    > 注意：定时器任务应该快速完成。当一个定时器任务完成时间过长时，它会“占用”定时器的任务执行线程，延迟后续定时器任务的执行，这可能导致这些任务在违规任务最终完成时“聚集”并连续快速执行。


    你也可以在重写的定时器任务的 `run()` 方法内部调用以下方法：


    - cancel(): 取消此定时器任务。当定时器任务已调度为单次执行且尚未运行，或者当未被调度时，它将永远不会运行。当定时器已调度为重复执行时，它将不再再次运行。（当发生此调用时定时器正在运行，定时器将运行到完成，但不再再次运行。）在重复定时器任务的
    `run()` 中调用 `cancel()` 绝对保证该定时器任务不会再次运行；第二次及随后的调用没有影响。当此定时器任务被调度为单次执行且尚未运行，或者当此定时器任务被调度为重复执行时，该方法返回
    `true`。当定时器任务被调度为单次执行且已经运行，或者当定时器任务已被取消时，它返回 `false`。（粗略来说，当该方法阻止了一个或多次调度执行的发生时，返回
    `true`。）


    long scheduledExecutionTime():

    返回定时器任务最近一次实际执行的调度执行时间。（当在定时器执行过程中调用此方法时，返回值为当前正在进行的定时器任务执行的调度执行时间。）此方法通常从任务的
    `run()` 中调用，以确定定时器任务的当前执行是否足够及时，以值得执行调定的活动。例如，你可以在 `run()` 的开头指定类似于 `if (System.currentTimeMillis()-scheduledExecutionTime()
    > MAX_TARDINESS) return;` 的代码，在定时器任务不及时时终止当前的定时器任务。此方法通常不与固定延迟执行的重复定时器任务结合使用，因为它们的调度执行时间允许随时间漂移，因此并不重要。

    `scheduledExecutionTime()` 返回此任务最近一次执行被调度发生的时间，格式为 `java.util.Date.getTime()`
    返回的格式。当定时器尚未开始第一次执行时，返回值未定义。


