  mdcn: "\n\n# 第 7 章 锁框架\n\n`Lock` 接口的实现允许在不同的作用域内获取和释放锁，并允许以任何顺序获取和释放多个锁，从而使得这些技术成为可能。\n\
    \n这种灵活性的增加也带来了额外的责任。块结构化锁的缺失意味着消除了在 `synchronized` 方法和块中发生的锁的自动释放机制。因此，你通常应该采用以下获取和释放的惯用法：\n\
    \n```\nLock l = ...; // ... 是获取锁代码占位符\nl.lock();\ntry {\n    // 访问受此锁保护的资源\n}\
    \ catch (Exception ex) {\n    // 恢复不变性\n} finally {\n    l.unlock();\n}\n```\n\
    \n这种惯用法确保了已获取的锁始终会被释放。\n\n> 注意：所有 `Lock` 实现都强制执行与内置监器锁（monitor lock）相同的内存同步语义。\n\
    \n# ReentrantLock\n\n你通过调用以下构造函数之一来初始化 `ReentrantLock`：\n\n- ReentrantLock():\
    \ 创建一个 `ReentrantLock` 实例。此构造函数等同于 `ReentrantLock(false)`。\n- ReentrantLock(boolean\
    \ fair): 创建一个具有特定公平策略的 `ReentrantLock` 实例。当此锁应使用公平排序策略时，传入 `true`：即在竞争情况下，锁将倾向于授予等待时间最长的线程访问权限。\n\
    \n`ReentrantLock` 实现了 `Lock` 的方法。然而，当调用线程未持有锁时，它的 `unlock()` 实现会抛出 `java.lang.IllegalMonitorStateException`。此外，`ReentrantLock`\
    \ 还提供了了自己的方法。例如，`boolean isFair()` 返回公平策略，`boolean isHeldByCurrentThread()` 在锁被当前线程持有时返回\
    \ `true`。7-1 演示了 `ReentrantLock`。\n\n列表 7-1. 使用 ReentrantLock 实现同步\n\n```java\n\
    import java.util.concurrent.Executors;\nimport java.util.concurrent.ExecutorService;\n\
    import java.util.concurrent.TimeUnit;\n\nimport java.util.concurrent.locks.ReentrantLock;\n\
    \npublic class RLDemo {\n    public static void main(String[] args) {\n      \
    \  ExecutorService executor = Executors.newFixedThreadPool(2);\n        final\
    \ ReentrantLock lock = new ReentrantLock();\n    }\n\n    class Worker implements\
    \ Runnable {\n        private final String name;\n\n        Worker(String name)\
    \ {\n            this.name = name;\n        }\n\n        @Override\n        public\
    \ void run() {\n            lock.lock();\n            try {\n                if\
    \ (lock.isHeldByCurrentThread()) {\n                    System.out.printf(\"Thread\
    \ %s entered critical section.%n\",name);\n                    System.out.printf(\"\
    Thread %s performing work.%n\", name);\n                    try {\n          \
    \              Thread.sleep(2000);\n                    } catch (InterruptedException\
    \ ie) {\n                        ie.printStackTrace();\n                    }\n\
    \                    System.out.printf(\"Thread %s finished working.%n\", name);\n\
    \                }\n            } finally {\n                lock.unlock();\n\
    \            }\n        }\n        executor.execute(new Worker(\"ThreadA\"));\n\
    \        executor.execute(new Worker(\"ThreadB\"));\n        try {\n         \
    \   executor.awaitTermination(5, TimeUnit.SECONDS);\n        } catch (InterruptedException\
    \ ie) {\n            ie.printStackTrace();\n        }\n        executor.shutdownNow();\n\
    \    }\n}\n```\n\n列表 7-1 描述了一个应用程序，其默认主线程创建了一对工作线程，这些线程进入、模拟工作并离开临界区。它们使用 `ReentrantLock`\
    \ 的 `lock()` 和 `unlock()` 方法来获取和释放重入锁。当线程调用 `lock()` 且锁不可用时，该线程将被禁用（无法调度），直到锁变得可用。\n\
    \n按照如下方式编译列表 7-1：\n\n```\njavac RLDemo.java\n```\n\n按照如下方式运行生成的程序：\n\n```\njava\
    \ RLDemo\n```\n\n你应该发现输出类似于以下内容（消息顺序可能略有不同）：\n\n```\nThreadA entered critical\
    \ section.\nThreadA performing work.\nThreadA finished working.\nThreadB entered\
