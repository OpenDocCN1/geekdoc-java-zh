- md: "\n# INTRODUCTION\n\nAppendix B provides a tutorial on threading in Swing. You\
    \ learn about Swing’s single-threaded programming model and various APIs for avoiding\
    \ problems when additional threads are used in graphical contexts. You also explore\
    \ a slide show Swing application as a fun way to end this book.\n\n> Note I briefly\
    \ use Java 8's lambda expression feature in some examples, but don't provide a\
    \ tutorial on it. You'll need to look elsewhere for that knowledge.\n\nThanks\
    \ for purchasing this book. I hope you find it helpful in understanding threads\
    \ and the concurrency utilities.\n\nJeff Friesen (October 2015)\n\n> Note You\
    \ can download this book's source code by pointing your web browser to www.apress.com/9781484216996\
    \ and clicking the Source Code tab followed by the Download Now link.\n\n# Thread\
    \ APIs\n\n# CHAPTER 1\n\n# Threads and Runnables\n\nJava applications execute\
    \ via threads, which are independent paths of execution through an application's\
    \ code. When multiple threads are executing, each thread's path can differ from\
    \ other thread paths. For example, a thread might execute one of a switch statement's\
    \ cases, and another might execute another of this statement's cases.\n\nEach\
    \ application has a default main thread that executes the main() method. The application\
    \ can also create threads to perform time-intensive tasks in the background so\
    \ that it remains responsive to its users. Threads execute code sequences encapsulated\
    \ in objects that are runnables.\n\nThe virtual machine (JVM) gives each thread\
    \ its own JVM stack to prevent threads from interfering with each other. Separate\
    \ stacks let threads keep track of their next instructions to execute, which can\
    \ differ from thread to thread. The stack provides a thread with its own copy\
    \ of method parameters, local variables, and return value.\n\nJava supports threads\
    \ primarily through its interface java.lang.Class and java.lang.Runnable interface.\
    \ This chapter introduces you to these types.\n\n# Introducing Thread and Runnable\n\
    \nThe Thread class provides a consistent interface to the underlying operating\
    \ system's threading architecture. (The operating system is typically responsible\
    \ for creating and managing threads.) A single operating system thread is associated\
    \ with a Thread object.\n\nThe Runnable interface supplies the code to be executed\
    \ by the thread that's associated with a Thread object. This code is located in\
    \ Runnable's void run()—a thread receives no arguments and returns no value, although\
    \ it might throw an exception, which I discuss in Chapter 4.\n\n# Creating Thread\
    \ and Runnable Objects\n\nExcept for the default main thread, threads are introduced\
    \ to applications by creating the appropriate Thread and Runnable objects. Thread\
    \ declares several constructors for initializing Thread objects. Several of these\
    \ constructors require a Runnable object as an argument.\n\nThere are two ways\
    \ to create a Runnable object. The first way is to create an anonymous class that\
    \ implements Runnable, as follows:\n\n```\nRunnable r = new Runnable()\n{\n  \
    \  @Override\n    public void run()\n    {\n        // perform some work\n   \
    \     System.out.println(\"Hello from thread\");\n    }\n}\n```\n\nBefore Java\
    \ 8, this was the only way to create a runnable. Java 8 introduced the lambda\
    \ expression to more conveniently create a runnable:\n\nRunnable r = () -> System.out.println(\"\
    Hello from thread\");\n\nThe lambda is definitely less verbose than the anonymous\
    \ class. I'll use both language features throughout this and subsequent chapters.\n\
    \n> **Note** A lambda expression (lambda) is an anonymous function that can be\
    \ passed to a constructor or method for subsequent execution. Lambdas with functional\
    \ interfaces (interfaces that declare single abstract methods), such as Runnable.\n\
    \nAfter creating the Runnable, you can pass it to a Thread constructor that receives\
    \ a Runnable argument. For example, Thread(Runnable runnable) initializes a new\
    \ Thread object to the specified runnable. The following code fragment demonstrates\
    \ this task:\n\nThread t = new Thread(r);\n\nA constructors don't take Runnable\
    \ arguments. For example, Thread() doesn't initialize Thread to a Runnable argument.\
    \ You must extend Thread and override its run() method (Thread implements Runnable)\
    \ to supply the code to run, which the following code fragment accomplishes:\n\
    \n```\nclass MyThread extends Thread\n{\n    @Override\n    public void run()\n\
    \    {\n        // perform some work\n        System.out.println(\"Hello from\
    \ thread\");\n    }\n}\n// ...\n```\n\nMyThread mt = new MyThread();\n\n# Getting\
    \ and Setting Thread State\n\nA Thread object associates state with a thread.\
    \ This state consists of a name, an indication of whether the thread is alive\
    \ or dead, the execution state of the thread (is it runnable?), the thread's priority,\
    \ and an indication of whether the thread is daemon or nonondaemon.\n\n# Getting\
    \ and Setting a Thread's Name\n\nA Thread object is assigned a name, which is\
    \ useful for debugging. Unless a name is explicitly specified, a default name\
    \ starts with Thread- prefix is chosen. You can get this name by calling Thread's\
    \ String getName() method. To set the name, pass it to a constructor, such as\
    \ Thread(Runnable, String name), or call Thread's void setName(String name) method.\
    \ Consider the following code fragment:\n\n```\nThread t1 = new Thread(r, \"thread1\"\
    );\nSystem.out.println(t1.getName()); // Output: thread1\nThread t2 = new Thread(r);\n\
    t2.setName(\"thread2\");\nSystem.out.println(t2.getName()); // Output: thread2\n\
    ```\n\n> Note Thread's long getId() method returns a unique long integer-based\
    \ name for a thread. This number remains unchanged during the thread's lifetime.\n\
    \n# Getting a Thread's Alive Status\n\nYou can determine if a thread is alive\
    \ or dead by calling Thread's boolean isAlive() method. This method returns true\
    \ when the thread is alive; otherwise, it returns false. A thread's lifespan ranges\
    \ from just before it is started from the start() method (discussed later) to\
    \ after it leaves the run() method, at which it dies. The following code fragment\
    \ outputs the alive/dead status of a newly-created thread:\n\n```\nThread t =\
    \ new Thread(r);\nSystem.out.println(t.isAlive()); // Output: false\n```\n\n#\
    \ Getting a Thread's Execution State\n\nA thread has an execution state that is\
    \ identified by one of the Thread.State constants:\n\n- NEW: A thread that has\
    \ not yet started is in this state.\n- RUNNABLE: A thread executing in the JVM\
    \ is in this state.\n- BLOCKED: A thread waiting for a monitor lock is in this\
    \ state. (I'll discuss monitor locks in Chapter 2.)\n- WAITING: A thread is waiting\
    \ indefinitely for another thread to perform a particular action is in this state.\n\
    - TIMED_WAITING: A thread that is waiting for another thread to perform an action\
    \ up to a specified waiting time is in this state.\n- TERMINATED: A thread that\
    \ has exited in this state.\n\nThread lets an application determine the thread's\
    \ current state by providing the Thread.State getState() method, which is demonstrated\
    \ here:\n\n```\nThread t = new Thread();\nSystem.out.println(t.getState()); //\
    \ Output: NEW\n```\n\n# Getting and Setting a Thread's Priority\n\nWhen a computer\
    \ has enough processors and/or cores, the computer's operating system assigns\
    \ a separate thread to each processor or core so the threads execute simultaneously.\
    \ When a computer doesn't have enough processors and/or cores, various threads\
    \ must wait their turns to use the shared processors/cores.\n\n> Note You can\
    \ identify the processors and/or cores that are available for the JVM by the java.lang.Runtime\
    \ class's int availableProcessors() method. The return value could change during\
    \ JVM execution and is never smaller than 1.\n\nThe operating system uses a scheduler\
    \ (http://en.wikipedia.org/wiki/Scheduling_(computing)) to determine when a waiting\
    \ thread executes. The following lists three different schedulers:\n\n- Linux\
    \ 2.6 through 2.63 uses the O(1) Scheduler (http://en.wikipedia.org/wiki/O(1)_scheduler).\n\
    - Linux 2.63 also uses the Completely Fair Scheduler (http://en.wikipedia.org/wiki/Completely_Fair_Scheduler),\
    \ which is the default scheduler.\n- Windows NT-based operating systems (such\
    \ as NT, XP, Vista, and 7) use a multilevel feedback queue scheduler (http://en.wikipedia.org/wiki/Multilevel_feedback_queue).\
    \ This scheduler is adjusted in Windows Vista and Windows 7.\n\nA multilevel feedback\
    \ queue and many other schedulers take priority (thread relative importance) into\
    \ account. They often combine preemptive scheduling (higher priority threads preempt-interrupt\
    \ and instead of—lower priority threads) with round robin scheduling (equal priority\
    \ threads are given equal slices of time, which are known as time slices, and\
    \ take turns execution).\n"
