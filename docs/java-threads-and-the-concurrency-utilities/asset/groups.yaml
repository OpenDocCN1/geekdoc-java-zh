    5-1 refers to java.util.concurrent.TimeUnit, an enum that represents time durations
    at units of granularity: DAYS, HOURS, MICROSECONDS, MILLISECONDS, SECONDS, and
    Seconds. TimeUnit declares methods for converting across units (such as hours(long
    duration)), and for performing timing and delay operations (such as sleep(long
    timeout)) in these units.

    5-1 also refers to callable tasks. Unlike Runnable, whose run() method cannot
    return a value and throw checked exceptions, Callable<V> call() method returns
    a value and can throw checked exceptions because it''s declared with a throws
    Exception clause.'
  - '[PAGE 84]


    # CHAPTER 5 CONCURRENCY UTILITIES AND EXECUTORS


    Finally, 5-1 refers to the Future interface, which represents the result of an
    asynchronous computation. The result is known as a Future because it will be available
    until some moment in the Future. Future, whose generic type is Future<V>, provides
    methods for canceling a task, for returning a task''s value, and for determining
    whether or not the task has finished. Table 5-2 describes Future''s methods.


    # Table 5-2. Future''s Methods


    | Method | Description |

    | --- | --- |

    | boolean cancel(boolean mayInterruptRunning) | Attempt to cancel execution of
    this task and return true when the task is canceled; otherwise, return false (the
    task may have completed normally before cancel() was called). Cancellation fails
    when the task is done, canceled, or couldn''t be canceled for another reason.
    If successful and this task hadn''t yet started, the task should never run. If
    the task has started, mayInterruptRunning determines (true) or not (false) the
    thread running this task should be interrupted in an attempt to stop the task.
    After returning, subsequent calls to isDone() always return true; isCancelled()
    always return true when cancel() returns. |

    | V get() | Wait for the task to complete and return the result. This method throws
    java.util.concurrent.CancellationException when the task was canceled prior to
    this method being called, ExecutionException when the task threw an exception,
    and InterruptedException when the current thread was interrupted while waiting.
    |

    | V get(long timeout, TimeUnit unit) | Wait at most timeout units (as specified
    by unit) for the task to complete and return the result (if available). This method
    throws CancellationException when the task was canceled prior to this method being
    called, ExecutionException when the task threw an exception, InterruptedException
    when the current thread was interrupted while waiting, and TimeoutException when
    this method''s value expires (wait times out). |

    | boolean isCancelled() | Return true when this task was canceled before it completed
    normally; otherwise, return false. |

    | boolean isDone() | Return true when this task completed; otherwise, return false.
    Completion may be due to normal termination, an exception, or cancellation—this
    method returns true in all of these cases. |'
  - "[PAGE 85]\n\nSuppose you intend to write an application whose graphical user\
    \ interface lets the user enter a word. After the user enters the word, the application\
    \ presents this word to several online dictionaries and obtains each dictionary's\
    \ entry. These entries are subsequently displayed to the user.\n\nBecause online\
    \ access can be slow, and because the user interface should remain responsive\
    \ (perhaps you unload the \"obtain word entries\" task to an executor that runs\
    \ on a separate thread). The following example uses ExecutorService, Callable,\
    \ and Future to accomplish this objective:\n\n```\nExecutorService executor =\
    \ ...; // ... represents some executor creation\nFuture<String[]> taskFuture =\
    \ \nexecutor.submit(new Callable<String[]>() {\n    @Override\n    public String[]\
    \ call() {\n\n        String[] entries = ...;\n        // Access online dictionaries\n\
    \        // with search word and populate\n        // entries with their resulting\n\
    \        // entries.\n        return entries;\n    }\n});\n```\n\n```\n// Do stuff.\n\
    String entries = taskFuture.get();\n```\n\nAfter obtaining an executor in some\
    \ manner (you will learn how shortly), the example's thread submits a callable\
    \ task to the executor. The submit() method immediately returns with a reference\
    \ to a Future object for controlling task execution and accessing results. The\
    \ thread ultimately calls this object's get() method to get these results.\n\n\
    > Note The java.util.concurrent.ScheduledExecutorService interface extends ExecutorService\
    \ and describes an executor that lets you schedule tasks to run once or periodically\
    \ after a given delay.\n\nAlthough you could create your own Executor, ExecutorService,\
    \ and ScheduledExecutorService implementations (such as class DirectExecutor implements\
    \ Executor { @Override public void execute(Runnable r) { r.run(); } —run executor\
    \ directly on the calling thread), there's a simpler alternative: java.util.concurrent.Executors."
- md: "\n## CHAPTER 5 CONCURRENCY UTILITIES AND EXECUTORS\n\n> **Tip** If you intend\
    \ to create your own ExecutorService implementations, you will find it helpful\
    \ to work with the java.util.concurrent.AbstractExecutorService and java.util.concurrent.FutureTask\
    \ classes.\n\nThe Executors utility class declares several class methods that\
    \ return instances of various ExecutorService and ScheduledExecutorService implementations\
    \ (and other kinds of instances). This class's static methods accomplish the following\
    \ tasks:\n\n- Create and return an ExecutorService instance that is configured\
    \ with commonly used configuration settings.\n- Create and return a ScheduledExecutorService\
    \ instance that's configured with commonly used configuration settings.\n- Create\
    \ and return a \"wrapped\" ExecutorService instance that disables reconfiguration\
    \ of the executor service by making implementation-specific methods inaccessible.\n\
    - Create and return a java.util.concurrent.ThreadFactory instance (that is, an\
    \ instance of a class that implements the ThreadFactory interface) for creating\
    \ new Thread objects.\n- Create a Callable instance out of other closure forms\
    \ so that it can be used in execution methods that require Callable arguments\
    \ (such as ExecutorService's submit(Callable) method). Wikipedia's \"Closure\"\
    \ entry at http://en.wikipedia.org/wiki/Closure_(computer_science) introduces\
    \ the topic of closures.\n\nFor example, static ExecutorService newFixedThreadPool(int\
    \ nThreads) creates a thread pool that reuses a fixed number of threads operating\
    \ off a shared unbounded queue. At most, nThreads threads are actively processing\
    \ tasks. If additional tasks are submitted when all threads are active, they are\
    \ queued for an available thread.\n\nIf any thread terminates due to a failure\
    \ during execution before the executor shuts down, a new thread will take its\
    \ place when needed to execute subsequent tasks. The threads in the pool will\
    \ exist until the executor is explicitly shut down. This method throws IllegalArgumentException\
    \ when you pass zero or a negative value to nThreads.\n\n> **Note** Thread pools\
    \ are used to eliminate the overhead from creating a new thread for each submitted\
    \ task. Thread creation isn't cheap, and having to create many threads could severely\
    \ impact an application's performance.\n\nYou would commonly use executors, runnables,\
    \ callables, and futures in file and network input/output contexts. Performing\
    \ a lengthy calculation offers another scenario where you could use these types.\
    \ For example, Listing 5-1 uses an executor, a callable, and a future in a calculation\
    \ context of Euler's number e (2.71828...)\n\n# Listing 5-1. Calculating Euler\
    \ e\n\n```java\nimport java.math.BigDecimal;\nimport java.math.MathContext;\n\
    import java.math.RoundingMode;\n\nimport java.util.concurrent.Callable;\nimport\
    \ java.util.concurrent.ExecutionException;\nimport java.util.concurrent.ExecutorService;\n\
    import java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\n\n\
    public class CalculateE\n{\n    final static void main(String[] args)\n    {\n\
    \        ExecutorService executor = Executors.newFixedThreadPool(1);\n       \
    \ Callable<BigDecimal> callable = new Callable<BigDecimal>()\n        {\n    \
    \        @Override\n            public BigDecimal call()\n            {\n    \
    \            MathContext mc = new MathContext(100, RoundingMode.HALF_UP);\n  \
    \              BigDecimal result = BigDecimal.ZERO;\n                for (int\
    \ i = 0; i <= LASTITER; i++)\n                {\n                    BigDecimal\
    \ factorial = factorial(new BigDecimal(i));\n                    BigDecimal res\
    \ = BigDecimal.ONE.divide(factorial, mc);\n                    result = result.add(res);\n\
    \                }\n                return result;\n            }\n        }\n\
    \    }\n}\n```\n\n```java\npublic BigDecimal factorial(BigDecimal n)\n{\n    if\
    \ (n.equals(BigDecimal.ZERO))\n        return BigDecimal.ONE;\n    else\n    \
    \    return n.multiply(factorial(n.subtract(BigDecimal.ONE)));\n}\n\nFuture<BigDecimal>\
    \ taskFuture = executor.submit(callable);\ntry {\n    while (!taskFuture.isDone())\
    \ {\n        System.out.println(\"waiting\");\n    }\n    System.out.println(taskFuture.get());\n\
    } catch (ExecutionException ee) {\n    System.out.println(\"task threw an exception\"\
    );\n    System.out.println(ee);\n} catch (InterruptedException ie) {\n    System.out.println(\"\
    interrupted while waiting\");\n}\nexecutor.shutdownNow();\n```\n\nThe default\
    \ main thread that executes main() first obtains an executor by calling Executors'\
    \ newFixedThreadPool() method. It then instantiates an anonymous class that implements\
    \ the Callable interface and submits this task to the executor, receiving a Future\
    \ in response.\n\nAfter submitting a task, a thread typically does some other\
    \ work until it requires the task's result. I simulate this by having the main\
    \ thread repeatedly output a waiting message until the Future's isDone() method\
    \ returns true. (In a realistic application, I would avoid this.) At this point,\
    \ the main thread calls the executor's get() method to obtain the result, which\
    \ is then output. The main thread then shuts down the executor.\n\n> **Caution**\
    \ It’s important to shut down an executor after it completes; otherwise, the application\
    \ might not end. The previous executor accomplishes this task by calling shutdownNow().\
    \ (You could also use the shutdownNow() method.)\n\nThe callable's call() calculates\
    \ e by evaluating the mathematical power series e = 1 / 0! + 1 / 1! + 1 / 2! +\
    \ .... This series can be evaluated by summing 1 / n!, where n ranges from 0 to\
    \ infinity (and stands factorial).\n\ncall() instantiates java.math.MathContext\
    \ to encapsulate a precision (number of digits) and a rounding mode. I chose 100\
    \ as an upper limit on e's precision, and I also choose HALF_UP as the rounding\
    \ mode.\n\n- Increase the precision as well as the value of LASTITER to convert\
    \ the series to a longer and more accurate approximation of e.\n\ncall() next\
    \ initializes a java.math.BigDecimal variable named result to BigDecimal.ZERO.\
    \ It then enters a loop that calculates a factorial, divides BigDecimal.ONE by\
    \ the factorial, and adds the division to result.\n\ndivide() takes the MathContext\
    \ instance as its second argument to provide rounding information. (If specified\
    \ as precision for the math context and a nonterminating decimal exception [the\
    \ quotient result of the division cannot be represented exactly—0.33333333...,\
    \ for example] occurred, java.lang.ArithmeticException would be thrown to alert\
    \ the caller that the quotient cannot be represented exactly. The executor would\
    \ redraw this exception as ExecutionException).\n\nCompile Listing 5-1 as follows:\n\
    \n```bash\njavac CalculateE.java\n```\n\n```bash\njava CalculateE\n```\n\nYou\
    \ should observe output that's similar to the following (you'll probably see more\
    \ messages):\n\n```\nwaiting\nwaiting\nwaiting\nwaiting\nwaiting\n2.718218284590457075160477958486050611789796352510326989007350\n\
    ```\n\n# EXERCISES\n\nThe following exercises are designed to test your understanding\
    \ of Chapter 5’s content:\n\n1. What are the concurrency utilities?\n2. Identify\
    \ the packages in which the concurrency utilities types are stored.\n3. Define\
    \ task.\n4. Define executor.\n5. Identify the Executor interface’s limitations.\n\
    6. How are Executor’s limitations overcome?\n7. What differences exist between\
    \ Runnable’s run() method and Callable’s call() method?\n8. True or false: You\
    \ can throw checked and unchecked exceptions from Runnable’s run() method but\
    \ can only throw unchecked exceptions from Callable’s call() method.\n9. Define\
    \ future.\n10. Describe the Executors class’s newFixedThreadPool() method.\n11.\
    \ Refactor the following CountingThreads application to work with Executors and\
    \ ExecutorService:\n\n```java\npublic class CountingThreads\n{\n    public static\
    \ void main(String[] args)\n    {\n        Runnable r = new Runnable()\n     \
    \   {\n            @Override\n            public void run()\n            {\n \
    \               String name = Thread.currentThread().getName();\n            \
    \    int count = 0;\n                while (true)\n                    System.out.println(name\
    \ + \": \" + count++);\n            }\n        }\n    }\n}\n```\n"
  mdcn: "\n\n## 第 5 章 并发工具与执行器\n\n> **提示** 如果你打算创建自己的 ExecutorService 实现，你会发现通过与 java.util.concurrent.AbstractExecutorService\
    \ 和 java.util.concurrent.FutureTask 类工作将非常有帮助。\n\nExecutors 工具类声明了几个类方法，这些方法可以返回各种\
    \ ExecutorService 和 ScheduledExecutorService 实现（以及其他类型的实例）的实例。该类的静态方法完成了以下任务：\n\
    \n- 创建并返回一个配置了常用配置设置的 ExecutorService 实例。\n- 创建并返回一个配置了常用配置设置的 ScheduledExecutorService\
    \ 实例。\n- 创建并返回一个“被封装的” ExecutorService 实例，该实例通过使特定于实现的方法不可用来禁用执行器服务的重新配置。\n- 创建并返回一个\
    \ java.util.concurrent.ThreadFactory 实例（即实现 ThreadFactory 接口的类的实例），用于创建新的 Thread\
    \ 对象。\n- 将其他闭包形式转换为 Callable 实例，以便其在需要 Callable 参数的执行方法中使用（例如 ExecutorService\
    \ 的 submit(Callable) 方法）。维基百科 http://en.wikipedia.org/wiki/Closure_(computer_science)\
    \ 上的“Closure”（闭包）条目介绍了闭包这一主题。\n\n例如，静态方法 ExecutorService newFixedThreadPool(int\
    \ nThreads) 创建了一个使用固定数量线程并在共享无界队列上运行的池。最多有 nThreads 个线程正在处理任务。如果在所有线程都处于活动时提交了额外任务，这些任务将进入队列等待可用线程。\n\
    \n如果任何线程在执行器关闭之前因执行期间失败而终止，当需要执行后续任务时，一个新线程将取代它。池中的线程一直存在到执行器被显式关闭。当你向 nThreads\
    \ 传递零或负值时，此方法会抛出 IllegalArgumentException。\n\n> **注意** 线程池用于消除为每个提交的任务创建新线程的开销。线程的创建并不是廉价的，创建许多线程可能会严重影响应用的性能。\n\
    \n你通常会在文件和网络输入/输出上下文中使用 executors、runnables、callables 和 futures。执行耗时计算是你可以使用这些类型的另一个场景。例如，列表\
    \ 5-1 在欧拉数 e (2.71828...) 的计算上下文中使用了执行器、callable 和 future。\n\n# 列表 5-1. 计算欧拉数\
    \ e\n\n```java\nimport java.math.BigDecimal;\nimport java.math.MathContext;\n\
    import java.math.RoundingMode;\n\nimport java.util.concurrent.Callable;\nimport\
    \ java.util.concurrent.ExecutionException;\nimport java.util.concurrent.ExecutorService;\n\
    import java.util.concurrent.Executors;\nimport java.util.concurrent.Future;\n\n\
    public class CalculateE\n{\n    final static void main(String[] args)\n    {\n\
    \        ExecutorService executor = Executors.newFixedThreadPool(1);\n       \
    \ Callable<BigDecimal> callable = new Callable<BigDecimal>()\n        {\n    \
    \        @Override\n            public BigDecimal call()\n            {\n    \
    \            MathContext mc = new MathContext(100, RoundingMode.HALF_UP);\n  \
    \              BigDecimal result = BigDecimal.ZERO;\n                for (int\
    \ i = 0; i <= LASTITER; i++)\n                {\n                    BigDecimal\
    \ factorial = factorial(new BigDecimal(i));\n                    BigDecimal res\
    \ = BigDecimal.ONE.divide(factorial, mc);\n                    result = result.add(res);\n\
    \                }\n                return result;\n            }\n        }\n\
    \    }\n}\n```\n\n```java\npublic BigDecimal factorial(BigDecimal n)\n{\n    if\
    \ (n.equals(BigDecimal.ZERO))\n        return BigDecimal.ONE;\n    else\n    \
    \    return n.multiply(factorial(n.subtract(BigDecimal.ONE)));\n}\n\nFuture<BigDecimal>\
    \ taskFuture = executor.submit(callable);\ntry {\n    while (!taskFuture.isDone())\
    \ {\n        System.out.println(\"waiting\");\n    }\n    System.out.println(taskFuture.get());\n\
    } catch (ExecutionException ee) {\n    System.out.println(\"task threw an exception\"\
    );\n    System.out.println(ee);\n} catch (InterruptedException ie) {\n    System.out.println(\"\
    interrupted while waiting\");\n}\nexecutor.shutdownNow();\n```\n\n执行 main() 的默认主线程首先通过\
    \ Executors 的 newFixedThreadPool() 方法获取一个执行器。然后它实例化了一个实现 Callable 接口的匿名类，并将此任务提交给执行器，接收一个\
    \ Future 作为响应。\n\n提交任务后，线程通常会做一些其他工作，直到它需要任务的结果。我通过让主线程反复输出等待消息，直到 Future 的 isDone()\
    \ 方法返回 true 来模拟这一点。（在实际应用程序中，我会避免这样做。）此时，主线程调用执行器的 get() 方法获取结果，然后将其输出。随后，主线程关闭了执行器。\n\
    \n> **警告** 在执行器完成后后关闭它是非常重要的；否则应用程序可能不会结束。之前的执行器通过调用 shutdownNow() 完成了此任务。（你也可以使用\
