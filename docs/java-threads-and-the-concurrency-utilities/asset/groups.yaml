    \ ie) {\n        // Should never arrive here because interrupt() is never\n  \
    \      // called.\n    }\n    System.out.println(result);\n}\n```\n\nThe class\
    \ field named result demonstrates the cached variable problem. This field is accessed\
    \ by a worker thread that executes result = computePi(50000); in a lambda context,\
    \ and by the default main thread when it executes System.out.println(result).\n\
    The worker thread could store computePi()'s return value in its copy of the copy.\
    \ whereas the default main thread might not see the result = computePi(50000);\
    \ assignment and its copy would remain at the null default. This value would output\
    \ instead of result's string representation (the computed pi value).\n\n## Synchronizing\
    \ Access to Critical Sections\n\nYou can use synchronization to solve the previous\
    \ thread problems. Synchronization is a JVM feature that ensures that two or more\
    \ concurrent threads don't simultaneously execute a critical section, which is\
