    # # Summary


    The ThreadGroup describes a group of threads, which stores a set of threads. It
    simplifies threading by applying method calls to all contained threads. You should
    avoid using thread groups because the most useful methods are deprecated and because
    of a race condition.


    The ThreadLocal class describes a thread-local variable, which lets you associate
    per-thread data (such as a user ID) with a thread. It provides a separate storage
    slot to each thread in which each thread can store a different value in the same
    variable. Each thread sees only itself and is unaware of other threads having
    their own values in this variable. The InheritableThreadLocal class to pass a
    value to a child thread.


    It''s often necessary to schedule a task for one-shot execution or for repeated
    execution at regular intervals. Java 1.3 introduced the Timer Framework, which
    consists of Timer and TimerTask classes, to facilitate working with threads in
    a timer context.


