- md: "\n# CHAPTER 6 ■ SYNCHRONIZERS\n\n- `boolean tryAcquire(int permits, long timeout,\
    \ TimeUnit unit): Like the previous method but the calling thread waits when permits\
    \ aren't available. The wait ends when the permits become available, the timeout\
    \ expires, or the calling thread is interrupted, in which case InterruptedException\
    \ is thrown.\n\n- `boolean tryAcquire(long timeout, TimeUnit unit): tryAcquire(int\
    \ permits) but the calling thread waits until a permit is available. The wait\
    \ ends when the permit becomes available, the timeout expires, or the calling\
    \ thread is interrupted, in which case InterruptedException is thrown.\n\nListing\
    \ 6–4 expands on the \"controlling access to a pool of items\" Semaphore presented\
    \ in Semaphore's javadoc.\n\n## **Listing 6–4.** Using a Counting Semaphore to\
    \ Control Access to a Pool of Threads\n\n```java\nimport java.util.concurrent.Executors;\n\
    import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Semaphore;\n\
    \npublic class SemaphoreDemo {\n    public static void main(String[] args) {\n\
    \        final Pool pool = new Pool();\n        Runnable r = new Runnable() {\n\
    \            @Override\n            public void run() {\n                String\
    \ name = Thread.currentThread().getName();\n                try {\n          \
    \          while (true) {\n                        String item;\n            \
    \            System.out.println(name + \" acquiring \" + (item = pool.getItem()));\n\
    \                        Thread.sleep(200 + (int)(Math.random() * 100));\n   \
    \                     System.out.println(name + \" putting back \" + item);\n\
    \                        pool.putItem(item);\n                    }\n        \
    \        } catch (InterruptedException ie) {\n                    System.out.println(name\
    \ + \"interrupted\");\n                }\n            }\n        };\n        ExecutorService[]\
    \ executors =\n            new ExecutorService[Pool.MAX_AVAILABLE + 1];\n    \
    \    for (int i = 0; i < executors.length; i++) {\n            executors[i] =\
    \ Executors.newSingleThreadExecutor();\n            executors[i].execute(r);\n\
    \        }\n    }\n}\n```\n\n```java\nfinal class Pool {\n    public static final\
    \ int MAX_AVAILABLE = 10;\n\n    private final Semaphore available = new Semaphore(MAX_AVAILABLE,\
    \ true);\n\n    private final String[] items;\n\n    private final boolean[] used\
    \ = new boolean[MAX_AVAILABLE];\n\n    Pool() {\n        items = new String[MAX_AVAILABLE];\n\
    \        for (int i = 0; i < items.length; i++)\n            items[i] = \"I\"\
    \ + i;\n    }\n\n    String getItem() throws InterruptedException {\n        available.acquire();\n\
    \        return getNextAvailableItem();\n    }\n\n    void putItem(String item)\
    \ {\n        if (markAsUnused(item))\n            available.release();\n    }\n\
    \n    private synchronized String getNextAvailableItem() {\n        for (int i\
    \ = 0; i < MAX_AVAILABLE; ++i) {\n            if (!used[i]) {\n              \
    \  used[i] = true;\n                return items[i];\n            }\n        }\n\
    \        return null; // not reached\n    }\n\n    private synchronized boolean\
    \ markAsUnused(String item) {\n        for (int i = 0; i < MAX_AVAILABLE; ++i)\
    \ {\n            if (item == items[i]) {\n                if (used[i]) {\n   \
    \                 used[i] = false;\n                    return true;\n       \
    \         } else {\n                    return false;\n                }\n   \
    \         }\n        }\n        return false;\n    }\n}\n```\n\n6-4's default\
    \ main creates a resource pool, a runnable for repeatedly acquiring and putting\
    \ resources, and an array of executors. Each executor is told to execute the runtime.\n\
    \nPool's getItem() and putItem(String item) methods obtain and return string-based\
    \ resources. Before obtaining an item in getItem(), the calling thread must acquire\
    \ a permit from the semaphore, which guarantees that an item is available for\
    \ use. When the thread finishes with the item, it calls putItem(String), which\
    \ returns the item to the pool and releases a permit to the semaphore, which lets\
    \ another thread acquire it.\n\nNo synchronization lock is held when acquire()\
    \ is called that would prevent an item from being returned to the pool. However,\
    \ String getNextAvailableItem() and boolean markAsUnused(String item) are synchronized\
    \ to maintain pool consistency. (The semaphore encapsulates the synchronization\
    \ for restricting access to the pool separately from the synchronization that's\
    \ required for maintaining pool consistency.)\n\nCompile Listing 6-4 as follows:\n\
    \n```\njavac SemaphoreDemo.java\n```\n\nRun the resulting application as follows:\n\
    \n```\njava SemaphoreDemo\n```\n\nYou should observe a prefix of the output that's\
    \ similar to the following (message order may differ somewhat):\n\n- pool-1-thread-1\
    \ acquiring IO\n- pool-2-thread-1 acquiring I1\n- pool-3-thread-1 acquiring I2\n\
    - pool-5-thread-1 acquiring I3\n- pool-7-thread-1 acquiring I4\n- pool-4-thread-1\
    \ acquiring I5\n- pool-6-thread-1 acquiring I6\n- pool-9-thread-1 acquiring I7\n\
    - pool-8-thread-1 acquiring I8\n- pool-10-thread-1 acquiring I9\n\n## CHAPTER\
    \ 6 ■ SYNCHRONIZERS\n\n### Phasers\n\nA phaser is a more flexible cyclic barrier.\
    \ Like a cyclic barrier, it can coordinate a variable number of threads. The java.util.concurrent.Phaser\
    \ class is thoroughly described in its javadoc, I'll point out a few constructor\
    \ and methods:\n\n- `Phaser(int threads)` constructor creates a phaser whose phase\
    \ is initially set to 0.\n- `register()` method adds a new arrived thread to the\
    \ phaser at any time.\n- `arriveAndAwaitAdvance()` method records arrival and\
    \ waits for others to arrive, it returns the phase number.\n- `arriveAndDeregister()`\
    \ method arrives at this phaser and deregisters from it.\n\nA phase is the current\
    \ state of the phaser. Unlike a cyclic barrier, which coordinates a fixed number\
    \ of threads, a phaser can coordinate a variable number of threads. The phase\
    \ is identified by an integer; the phaser advances to the next phase after the\
    \ last thread arrives.\n\n**Listing 6-5.** Using a Phaser to Control a One-Shot\
    \ Action Serving a Variable Number of Parties\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.List;\n\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.Phaser;\n\
    \npublic class PhaserDemo {\n    public static void main(String[] args) {\n  \
    \      List<Runnable> tasks = new ArrayList<>();\n        tasks.add(() -> System.out.printf(\"\
    %s is running at %d%n\",\n            Thread.currentThread().getName(),\n    \
    \        System.currentTimeMillis()));\n        runTasks(tasks);\n    }\n\n  \
    \  static void runTasks(List<Runnable> tasks) {\n        final Phaser ph = new\
    \ Phaser(1); // \"1\" (register self)\n        // create and start threads\n \
    \       for (final Runnable task : tasks) {\n            ph.register();\n    \
    \        Runnable r = () -> {\n                try {\n                    Thread.sleep(50\
    \ + (int) (Math.random() * 300));\n                } catch (InterruptedException\
    \ ie) {\n                    System.out.println(\"interrupted thread\");\n   \
    \             }\n                task.run();\n            };\n            ph.arriveAndAwaitAdvance();\
    \ // await the ...\n            // creation of ...\n            // all tasks\n\
    \            Executors.newSingleThreadExecutor().execute(r);\n        }\n    \
    \    // allow threads to start and deregister self\n        ph.arriveAndDeregister();\n\
    \    }\n}\n```\n\n6-5's main thread creates a pair of runnable tasks that each\
    \ report the time (in milliseconds) at which its starts to run. It then runs these\
    \ tasks after creating a Phaser phase and waiting for both tasks to arrive at\
    \ the barrier.\n"
