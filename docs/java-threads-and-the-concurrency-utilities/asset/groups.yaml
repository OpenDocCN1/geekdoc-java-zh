    # CHAPTER 7


    # The Locking Framework


    The java.util.concurrent.locks package provides a framework of interfaces and
    classes for locking and waiting for conditions in a manner that is distinct from
    an object''s intrinsic lock-based synchronization and java.lang.Object''s wait/notification
    mechanism. The concurrency utilities include the Locking Framework that improves
    on intrinsic synchronization and wait/notification by offering lock polling, timed
    waits, and more.


    # SYNCHRONIZED AND LOW-LEVEL LOCKING


    Java supports synchronization so that threads can safely update shared variables
    and ensure that a thread''s updates are visible to other threads. We leverage
    synchronization in your code by marking methods or code blocks with the synchronized
    keyword. These code sequences are known as critical sections. The Java virtual
    machine (JVM) supports synchronization via monitors and the monitorexit JVM instructions.


    Every Java object is associated with a monitor, which is a mutual exclusion (allowing
    only one thread at a time execute in a critical section) construct that prevents
    multiple threads from concurrently executing a critical section. Before a thread
    can enter a critical section, it is required to lock the monitor. If the monitor
    is already locked, the thread blocks until the monitor is unlocked (by another
    thread leaving the critical section).


    When a thread locks a monitor in a multicore/multiprocessor environment, the variables
    of shared variables that are stored in main memory are read into the copies of
    these variables that are stored in a thread''s working memory (also as local memory
    or cache memory). This action ensures that the thread will work with the most
    recent values of these variables and not stale values, and is known as visibility.
    The thread proceeds to work with its copies of these shared variables. When the
    thread unlocks the monitor while leaving the critical section, the values in its
    copies of shared variables are written back to main memory, which leaves the next
    thread that enters the critical section access the most recent values of these
    variables. (The volatile keyword addresses visibility only.)'
  - '[PAGE 117]


    The Locking Framework includes the often-used Lock, ReentrantLock, Condition,
    ReadWriteLock, and ReentrantReadWriteLock types, which I explore in this chapter.
    I also briefly introduce you to the StampedLock class, which was introduced by
    Java 8.


    # Lock


    The Lock interface offers more expressive locking operations than can be obtained
    via the locks associated with monitors. For example, you can immediately back
    out of a lock-acquisition attempt when a lock is unavailable. This interface declares
    the following methods:


    +   - void lock(): Acquire the lock. When the lock''s unavailable, the calling
    thread is forced to wait until it becomes available.

    - void lockInterruptibly(): Acquire the lock unless the calling thread is interrupted.
    When the lock''s unavailable, the calling thread is forced to wait until it becomes
    available or the thread is interrupted, which results in this method throwing
    java.lang.InterruptedException.

    - Condition newCondition(): Return a new Condition instance that''s bound to this
    Lock instance. This method throws java.lang.UnsupportedOperationException when
    the Lock class does not support controls.

    - boolean tryLock(): Acquire the lock when it''s available at the time this method
    is invoked. The method returns true when the lock is acquired and false when the
    lock isn''t acquired.

    - boolean tryLock(long time, TimeUnit unit): Acquire the lock when it''s available
    within the waiting time, measured in unit java.util.concurrent.TimeUnit units
    (seconds, milliseconds, and so on), and the calling thread isn''t interrupted.
    When the lock isn''t available, the calling thread is forced to wait until it
    becomes available within the waiting time or is interrupted, which results in
    this method returning true or false.

    - void unlock(): Release the lock.


    Acquired locks must be released. In the context of synchronized blocks and the
    implicit monitor lock associated with every object, lock acquisition and release
    occurs in a block-structured manner. When multiple locks are acquired, they are
    released in the opposite order and all locks are released in the same lexical
    scope in which they were acquired.


    Lock acquisition and release in the context of Lock implementations can be more
    flexible. For example, some algorithms for traversing concurrently accessed data
    structures require the use of "hand-over-hand" or "chain locking": you acquire
    the lock of node A, then node B, then release A and acquire C, then release B
    and acquire D, and so'
- md: "\n# CHAPTER 7 THE LOCKING FRAMEWORK\n\nImplementations of the Lock interface\
    \ enable the use of such techniques by allowing a lock to be acquired and released\
    \ in different scopes, and by allowing multiple locks to be acquired and released\
    \ in any order.\n\nWith this increased flexibility comes additional responsibility.\
    \ The absence of block-structured locking removes the automatic release of locks\
    \ that occurs with synchronized methods and blocks. As a result, you should typically\
    \ employ the idiom for acquisition and release:\n\n```\nLock l = ...; // ... is\
    \ a placeholder for code that obtains the lock\nl.lock();\ntry {\n    // access\
    \ the resource protected by this lock\n} catch (Exception ex) {\n    // restore\
    \ invariants\n} finally {\n    l.unlock();\n}\n```\n\nThis idiom ensures that\
    \ an acquired lock will always be released.\n\n> Note: All Lock implementations\
    \ are required to enforce the same memory synchronization semantics as provided\
    \ by the built-in monitor lock.\n\n# ReentrantLock\n\nYou initialize a ReentrantLock\
    \ by invoking either of the following constructors:\n\n- ReentrantLock(): Create\
    \ an instance of ReentrantLock. This constructor is equivalent to ReentrantLock(false).\n\
    - ReentrantLock(boolean fair): Create an instance of ReentrantLock with the specified\
    \ fairness policy. Pass true to fair when this lock should use a fair ordering\
    \ policy: under contention, the lock would favor granting access to the longest-waiting\
    \ thread.\n\nReentrantLock implements Lock's methods. However, its implementation\
    \ of unlock() throws java.lang.IllegalMonitorStateException when the calling thread\
    \ doesn't hold the lock. Also, ReentrantLock provides its own methods. For example,\
    \ boolean isFair() returns the fairness policy and boolean isHeldByCurrentThread()\
    \ returns true when the lock is held by the current thread. 7-1 demonstrates ReentrantLock.\n\
    \nListing 7-1. Achieving Synchronization in Terms of Reentrant Locks\n\n```java\n\
    import java.util.concurrent.Executors;\nimport java.util.concurrent.ExecutorService;\n\
    import java.util.concurrent.TimeUnit;\n\nimport java.util.concurrent.locks.ReentrantLock;\n\
    \npublic class RLDemo {\n    public static void main(String[] args) {\n      \
    \  ExecutorService executor = Executors.newFixedThreadPool(2);\n        final\
    \ ReentrantLock lock = new ReentrantLock();\n    }\n\n    class Worker implements\
    \ Runnable {\n        private final String name;\n\n        Worker(String name)\
    \ {\n            this.name = name;\n        }\n\n        @Override\n        public\
    \ void run() {\n            lock.lock();\n            try {\n                if\
    \ (lock.isHeldByCurrentThread()) {\n                    System.out.printf(\"Thread\
    \ %s entered critical section.%n\",name);\n                    System.out.printf(\"\
    Thread %s performing work.%n\", name);\n                    try {\n          \
    \              Thread.sleep(2000);\n                    } catch (InterruptedException\
    \ ie) {\n                        ie.printStackTrace();\n                    }\n\
    \                    System.out.printf(\"Thread %s finished working.%n\", name);\n\
    \                }\n            } finally {\n                lock.unlock();\n\
    \            }\n        }\n        executor.execute(new Worker(\"ThreadA\"));\n\
    \        executor.execute(new Worker(\"ThreadB\"));\n        try {\n         \
    \   executor.awaitTermination(5, TimeUnit.SECONDS);\n        } catch (InterruptedException\
    \ ie) {\n            ie.printStackTrace();\n        }\n        executor.shutdownNow();\n\
    \    }\n}\n```\n\nListing 7-1 describes an application whose default main thread\
    \ creates a pair of worker threads that enter, simulate working in, and leave\
    \ critical sections. They use ReentrantLock's lock() and unlock() methods to obtain\
    \ and release a reentrant lock. When a thread calls lock() and the lock is unavailable,\
    \ the thread is disabled (and cannot be scheduled) until the lock becomes available.\n\
    \nCompile Listing 7-1 as follows:\n\n```\njavac RLDemo.java\n```\n\nRun the resulting\
    \ application as follows:\n\n```\njava RLDemo\n```\n\nYou should discover output\
    \ that's similar to the following (message order may differ somewhat):\n\n```\n\
    ThreadA entered critical section.\nThreadA performing work.\nThreadA finished\
    \ working.\nThreadB entered critical section.\nThreadB performing work.\nThreadB\
    \ finished working.\n```\n\n# Condition\n\nThe interface factors out Object's\
    \ wait and notification methods (wait(), notifyAll()) into distinct condition\
    \ objects to give the effect of having multiple wait-sets per object, by combining\
    \ them with the use of arbitrary Lock implementations. Where Lock replaces synchronized\
    \ methods and blocks, Condition replaces Object's wait/notification methods.\n\
    \n> A condition is intrinsically bound to a lock. To obtain a Condition for a\
    \ Lock instance, use Lock's newCondition() method.\n\nCondition declares the following\
    \ methods:\n\n- await(): Force the calling thread to wait until it's signaled\
    \ or interrupted.\n- boolean await(long time, TimeUnit unit): Force the calling\
    \ thread to wait until it's signaled or interrupted, or until the specified waiting\
    \ time lapses.\n- long awaitNanos(long nanoTimeout): Force the current thread\
    \ to wait until it's signaled or interrupted, or until the specified waiting time\
    \ lapses.\n- void awaitInterruptibly(): Force the current thread to wait until\
    \ it's signaled.\n- boolean awaitUntil(Date deadline): Force the current thread\
    \ to wait until it's signaled or interrupted, or until the specified deadline\
    \ expires.\n- void signal(): Wake up one thread.\n- void signalAll(): Wake up\
    \ all threads.\n\nListing 7-2 revisits Chapter 3's producer-consumer application\
    \ (in Listing 3-2) to show how it can be written to take advantage of conditions.\n\
    \nListing 7-2. Achieving Synchronization in Terms of Locks and Conditions\n\n\
    ```java\nimport java.util.concurrent.locks.Condition;\nimport java.util.concurrent.locks.Lock;\n\
    import java.util.concurrent.locks.ReentrantLock;\n\npublic class PC {\n    public\
    \ static void main(String[] args) {\n        Shared s = new Shared();\n      \
    \  new Producer(s).start();\n        new Consumer(s).start();\n    }\n}\n\nclass\
    \ Shared {\n    private char c;\n    private volatile boolean available;\n   \
    \ private final Lock lock;\n    private final Condition condition;\n\n    Shared()\
    \ {\n        available = false;\n        lock = new ReentrantLock();\n       \
    \ condition = lock.newCondition();\n    }\n\n    Lock getLock() {\n        return\
    \ lock;\n    }\n\n    char getSharedChar() {\n        lock.lock();\n        try\
    \ {\n            while (!available) {\n                condition.await();\n  \
    \          }\n        } catch (InterruptedException ie) {\n            ie.printStackTrace();\n\
    \        } finally {\n            available = false;\n            condition.signal();\n\
    \            lock.unlock();\n        }\n        return c;\n    }\n\n    void setSharedChar(char\
