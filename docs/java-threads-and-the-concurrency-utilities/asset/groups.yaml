    \nJava 通过其低级线程特性和高级并发特性（如线程池）支持并发。并发的问题在于它没有最大化地利用可用的处理器/核心资源。例如，假设你创建了一个排序算法，它将数组分为两半，分配两个线程分别排序每个部分，并在两个线程都完成后合并结果。\n\
