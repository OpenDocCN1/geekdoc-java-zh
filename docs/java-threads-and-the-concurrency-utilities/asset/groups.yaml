    \nThis API leverages an object's condition queue, which is a data structure that\
    \ stores threads waiting for a condition to exist. The waiting threads are known\
    \ as the wait set. Because the condition queue is tightly bound to an object's\
    \ lock, all five methods must be called from a synchronized context (the current\
