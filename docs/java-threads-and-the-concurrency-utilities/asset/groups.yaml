    # Getting and Setting Thread State


    A Thread object associates state with a thread. This state consists of a name,
    an indication of whether the thread is alive or dead, the execution state of the
    thread (is it runnable?), the thread''s priority, and an indication of whether
    the thread is daemon or nondaemon.


    # Getting and Setting a Thread''s Name


    A Thread object is assigned a name, which is useful for debugging. Unless a name
    is explicitly specified, a default name starts with Thread- prefix is chosen.
    You can get this name by calling Thread''s String getName() method. To set the
    name, pass it to a constructor, such as Thread(Runnable, String name), or call
    Thread''s void setName(String name) method. Consider the following code fragment:


    ```

    Thread t1 = new Thread(r, "thread1");

    System.out.println(t1.getName()); // Output: thread1

    Thread t2 = new Thread(r);

    t2.setName("thread2");

    System.out.println(t2.getName()); // Output: thread2

    ```


    > Note Thread''s long getId() method returns a unique long integer-based name
    for a thread. This number remains unchanged during the thread''s lifetime.


    # Getting a Thread''s Alive Status


    You can determine if a thread is alive or dead by calling Thread''s boolean isAlive()
    method. This method returns true when the thread is alive; otherwise, it returns
    false. A thread''s lifespan ranges from just before it is actually started from
    the start() method (discussed later) to after it leaves the run() method, at which
    it dies. The following code fragment outputs the alive/dead status of a newly-created
    thread:


    ```

    Thread t = new Thread(r);

    System.out.println(t.isAlive()); // Output: false

    ```


    # Getting a Thread''s Execution State


    A thread has an execution state that is identified by one of the Thread.State
    enum constants:


    +   - NEW: A thread that has not yet started is in this state.

    - RUNNABLE: A thread executing in the JVM is in this state.

    - BLOCKED: A thread that is blocked waiting for a monitor lock is in this state.
    (I''ll discuss monitor locks in Chapter 2.)'
