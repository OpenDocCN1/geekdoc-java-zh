    return a Future instance representing task''s pending results. The Future instance''s
    get() method returns task''s result on successful completion. This method throws
    RejectedExecutionException when task cannot be scheduled for execution or NullPointerException
    when task is null. | |

    | Future<?> submit(Runnable task) | Submit a runnable task for execution and return
    a Future instance representing task''s pending results. The Future instance''s
    get() method returns task''s result on successful completion. This method throws
    RejectedExecutionException when task cannot be scheduled for execution and NullPointerException
    when task is null. |

    | <Future<T> submit(Runnable task, T result) | Submit a runnable task for execution
    and return a Future instance whose get() method returns result''s value on successful
