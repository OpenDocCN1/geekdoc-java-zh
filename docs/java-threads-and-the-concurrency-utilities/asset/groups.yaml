    {\n  System.out.println(result);\n}\n```\n\nWait, if I specified synchronized(FOUR)\
    \ in one place and synchronized(\"ABC\") in another, there would be no...\n\n\
    ## Beware of Liveness Problems\n\nThe term liveness refers to something beneficial\
    \ happening eventually. A liveness failure occurs when an application reaches\
    \ a state in which it can no further progress. In a single-threaded application,\
    \ an infinite loop would be an example. Multithreaded applications face the additional\
    \ liveness challenges of deadlock, livelock, and starvation:\n\n- Deadlock: Thread\
    \ 1 waits for a resource that thread 2 is holding exclusively and thread 2 is\
    \ waiting for a resource that thread 1 is holding exclusively. Neither thread\
    \ can make progress.\n- Livelock: Thread x keeps retrying an operation that will\
    \ always fail. It cannot make progress for this reason.\n- Starvation: Thread\
    \ x is continually denied (by the scheduler) access to a needed resource to make\
    \ progress. Perhaps the scheduler executes higher-priority threads before lower-priority\
    \ threads and there is always a higher-priority thread available for execution.\
