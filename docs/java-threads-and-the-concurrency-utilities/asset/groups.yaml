    # Summary\n\nJava applications execute via threads, which are independent paths\
    \ of execution through an application's code. Each application has a default main\
    \ thread that executes the main() method. The application can also create threads\
    \ to perform time-intensive tasks in the background so it remains responsive to\
    \ its users. These threads execute code sequences encapsulated in objects that\
    \ are known as runnables.\n\nThe Thread class provides a consistent interface\
    \ to the underlying operating system threading architecture. (The operating system\
    \ is typically responsible for creating and managing threads.) A single operating\
    \ system thread is associated with the thread that's associated with a Thread\
    \ object.\n\nThe Runnable interface supplies the code to be executed by Runnable's\
    \ run() method—a thread receives no arguments and returns no value although it\
    \ might throw an exception.\n\nExcept for the default main thread, threads are\
    \ introduced to applications by creating the appropriate Thread and Runnable objects.\
    \ Thread declares several constructors for initializing Thread objects. Several\
    \ of these constructors require a Runnable object as an argument.\n\nA Thread\
    \ object associates state with a thread. This state consists of a name, an indication\
    \ of whether the thread is alive or dead, the execution state of the thread (is\
    \ it runnable?), the thread's priority, and an indication of whether the thread\
