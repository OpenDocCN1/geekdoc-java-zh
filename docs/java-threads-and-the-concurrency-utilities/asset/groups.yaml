    \ NI12\n\n# 信号量\n\n信号量维护一组许可，用于限制访问受限资源的线程数量。尝试获取许可的线程在没有许可可用时会处于阻塞状态，直到其他线程释放一个许可。\n\
    \n> 当前值可以增加超过 1 的信号量称为计数信号量，而当前值只能为 0 或 1 的信号量称为二进制信号量或互斥锁（mutexes）。在任何情况下，当前值都不为负数。\n\
    \n`java.util.concurrent.Semaphore` 类实现了这种同步器，并将信号量概念化为维护一组许可的对象。你通过调用 `Semaphore(int\
    \ permits)` 构造函数来初始化信号量，其中 `permits` 指定了可用许可的数量。生成的信号量的公平性策略设置为 `false`（不公平）。或者，你也可以调用\
    \ `Semaphore(int permits, boolean fair)` 构造函数将信号量的公平性设置设置为 `true`（公平）。\n\n# 信号量与公平性\n\
    \n当公平性设置为 `false` 时，Semaphore 不保证线程获取许可的顺序。特别是，它允许“插队”（barging）——即，调用 `acquire()`\
    \ 的线程可能会比已经在等待的线程先分配许可，只要新线程将自己置于那里。\n\nSemaphore 还提供了以下方法：\n\n- `void acquire(int\
    \ permits)`: 从此信号量获取许可，阻塞直到许可可用或调用线程被中断。被中断时抛出 `InterruptedException`；当 `permits`\
    \ 小于 0 时抛出 `IllegalArgumentException`。\n- `void acquireInterruptibly()`: 获取许可，阻塞直到许可可用。\n\
    - `void acquireInterruptibly(int permits)`: 获取许可，阻塞直到许可可用。当 `permits` 小于 0 时抛出\
    \ `IllegalArgumentException`。\n- `int availablePermits()`: 返回当前可用许可的数量。此方法用于调试和测试。\n\
    - `int drainPermits()`: 获取并返回所有立即可用的许可。\n- `int getQueueLength()`: 返回等待许可的线程数的估计值。由于在方法遍历数据结构时线程数量可能会变化，返回的值仅为估计值。此方法用于监控系统状态，而不是同步控制。\n\
    - `boolean isQueuedThreads()`: 查询是否有线程正在等待许可。由于取消可能随时发生，`true` 值并不保证任何线程都能获取许可。此方法主要用于监控系统状态。当存在其他线程时返回\
    \ `true`。\n- `boolean isFair()`: 返回公平性设置（公平为 `true`，不公平为 `false`）。\n- `void release()`:\
    \ 一个许可并将其返回信号量。许可数增加一。如果有线程尝试获取许可，将选择一个线程并赋予刚刚释放的许可。该线程将被重新启用以进行调度。\n- `void release(int\
    \ permits)`: 释放许可并返回信号量。可用许可数增加 `permits`。如果有线程尝试获取许可，将选择一个并赋予刚刚释放的许可；否则，可用许可数满足该线程请求，该线程将被重新启用以进行调度；否则，线程将等待直到许可可用。如果在满足线程请求后仍有许可，当\
    \ `permits` 小于 0 时抛出 `IllegalArgumentException`。\n- `String toString()`: 返回标识此信号量及其状态的字符串。状态位于括号内，包含字面量\
    \ \"Permits =\" 以及许可数量。\n- `boolean tryAcquire()`: 从此信号量获取许可，但仅在调用时许可可用的情况下。获取许可时返回\
    \ `true`，否则立即返回 `false`。\n- `boolean tryAcquire(int permits)`: 从此信号量获取许可，但仅在调用时许可可用时进行。获取许可时返回\
    \ `true`，否则立即返回 `false`。当 `permits` 小于 0 时抛出 `IllegalArgumentException`。\n\n"
