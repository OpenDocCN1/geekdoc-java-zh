    This method is designed for use in monitoring the system state and not for synchronization
    control.


    +   - boolean isQueuedThreads(): Query whether any threads are waiting to acquire
    permits. Because cancellations may occur at any time, a true value doesn''t guarantee
    that any thread will ever acquire permits. This method is designed mainly for
    use in monitoring the system state. It returns true when there may be other threads.


    +   - boolean isFair(): Return the fairness setting (true for fair and false for
    unfair).


    +   - void release(): Release a permit, returning it to the semaphore. The number
    of permits is increased by one. If any threads are trying to acquire a permit,
    one thread is selected and given the permit that was just released. That thread
    is reenabled for thread scheduling purposes.


    +   - void release(int permits): Release permits, returning them to the semaphore.
    The number of available permits is increased by permits. If any threads are trying
    to acquire permits, one is selected and given the permits that were just released.
    otherwise, the number of available permits satisfies that thread''s request, the
    thread is reenabled for thread scheduling purposes; otherwise, the thread will
    wait until permits are available. If there permits available after this thread
    request has been satisfied, IllegalArgumentException is thrown when permits is
    less than zero.


    +   - String toString(): Return a string identifying this semaphore as well as
    its state. The state, in brackets, includes the string literal "Permits =\ followed
    by the number of permits.


    +   - boolean tryAcquire(): Acquire a permit from this semaphore but only when
    one is available at the time of invocation. Return true when the permit was acquired.
    Otherwise, return immediately with false value.


    +   - boolean tryAcquire(int permits): Acquire permits from this semaphore but
    only when they are available at the time of invocation. Return true when the permits
    were acquired. Otherwise, return immediately with false value. IllegalArgumentException
    is thrown when permits is less than zero.


