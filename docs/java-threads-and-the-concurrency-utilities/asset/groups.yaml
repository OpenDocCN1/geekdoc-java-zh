    \n这个问题（以及代码冗长且难以阅读的相关问题）可以通过递归地将任务拆分为为子任务并合并结果来解决。这些子任务并行运行，并在恰约相同的时间完成（即使不是同一时刻），此时它们的结果被合并并向上堆栈传递给上一层子任务。这使得代码不再那么冗长，并且（通常）更容易理解。Java\
    \ 提供了 Fork/Join 框架来实现这种场景。\n\nFork/Join 主要由一个特殊的执行器服务和一个线程池组成。执行器服务为框架提供一个任务，该任务被拆分成更小的任务，并从池中被分叉（由不同的线程执行）。任务会等待直到（其子任务完成）。\n\
