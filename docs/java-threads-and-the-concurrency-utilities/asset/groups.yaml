    \ true。\n\n## Fork/Join 框架\n\n代码始终有执行得更快的需求。在历史上，这种需求通过增加微处理器速度和/或支持多个处理器来满足。然而，大约在\
    \ 2003 年，由于物理限制，微处理器速度停止了增长。为了补偿这一点，处理器制造商开始在其处理器中添加多个处理器核心，通过大规模并行来提高速度。\n\n\
