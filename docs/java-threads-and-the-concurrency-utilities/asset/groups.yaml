    the Runnable interface.

    3. The Thread class provides a consistent interface to the underlying operating
    system''s threading architecture. The Runnable interface supplies the code to
    be executed by the thread that''s associated with a Thread object.

    4. The two ways to create a Runnable object are to instantiate an anonymous class
    that implements the Runnable interface and to use a lambda expression.

    5. The two ways to connect a runnable to a Thread object are to pass the runnable
    to a Thread constructor that accepts a runnable and subclass Thread and override
    its `void run()` method when the constructor doesn''t accept a runnable. Thread
    implements the Runnable interface, which makes Thread objects runnable as well.

    6. The five kinds of Thread state are a name, an indication of whether the thread
    is alive or dead, the execution state of the thread (is it runnable?), the thread''s
    priority, and an indication of whether the thread is daemon or nondemon.

    7. The answer is false: a default thread name starts with the Thread- prefix.'
