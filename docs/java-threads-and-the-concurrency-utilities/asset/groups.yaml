    void scheduleAtFixedRate(TimerTask task, Date firstTime):

    调度任务以固定速率重复执行，从以 `period` 毫秒为间隔的大约定期间隔开始。对于固定速率执行，每次执行都是相对于初始执行的调度执行时间调度的。如果某个执行由于任何原因（如垃圾回收）而延迟，则两次或多次执行将连续发生以“追赶”。从长远来看，执行频率将是
    `period` 的倒数（假设系统使用的 `Object.wait(long)` 是准确的）。因此，当调定的 `firstTime` 处于过去时，“错过的”的执行将被调度为立即进行“追赶”执行。固定速率执行适用于对延迟敏感的循环活动（例如每小时每响一次钟声，或每天在特定时间运行维护）。它也适用于执行固定次数执行所需的总时间很重要的循环活动，例如每
    10 秒跳动一次的倒计时计时器。最后，固定速率执行用于调度必须相互保持同步的重复定时器任务。当 `firstTime.getTime()` 为负数，或 `period`
