    \ on this object's monitor, one of them is chosen to be awakened. The choice is\
    \ arbitrary and occurs at the discretion of the implementation. The awakened thread\
    \ will not be able to proceed until the current thread relinquishes the lock on\
    \ this object. The awakened thread will compete in the usual manner with any other\
    \ threads that might be actively competing to synchronize on this object; for,\
    \ the awakened thread enjoys no privilege or disadvantage in the next thread to\
    \ lock this object.\n\n- notifyAll(): Wake up all threads that are waiting on\
    \ this object's monitor. The awakened threads will not be able to proceed until\
    \ the current thread relinquishes the lock on this object. The awakened threads\
    \ will compete in the usual manner with any other threads that might be actively\
    \ competing to synchronize on this object; for, the awakened threads enjoy no\
    \ privilege or disadvantage in the next thread to lock this object.\n\nThe wait()\
    \ methods throw java.lang.InterruptedException when any interrupted thread before\
    \ or while the current thread was waiting for a notification. The interrupted\
    \ status of the current thread is cleared when this is thrown.\n\n> A thread releases\
