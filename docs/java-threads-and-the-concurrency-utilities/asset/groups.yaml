    \ cancel() 之前已正常完成）。当任务已完成、已取消或其他其他原因无法取消时，取消失败。如果成功且此任务尚未启动，则任务将永远不会运行。如果任务已经启动，mayInterruptRunning\
    \ 决定（true）或否（false）运行此任务的线程应该被中断以尝试停止任务。返回后，后续对 isDone() 的调用始终返回 true；当 cancel()\
    \ 返回时，isCancelled() 始终返回 true。 |\n| V get() | 等待任务完成并返回结果。当任务在调用此方法之前被取消时，抛出 java.util.concurrent.CancellationException；当任务抛出异常时抛出\
    \ ExecutionException；当当前线程在等待期间被中断时抛出 InterruptedException。 |\n| V get(long timeout,\
    \ TimeUnit unit) | 最多等待 timeout（由 unit 指定）单位任务完成并返回结果。当任务在调用此方法之前被取消时，抛出 CancellationException；当任务抛出异常时抛出\
    \ ExecutionException；当当前线程在等待期间被中断时抛出 InterruptedException；当在任何任务成功完成之前超时时，抛出\
    \ TimeoutException。 |\n| boolean isCancelled() | 当任务在完成之前被取消时返回 true；否则返回 false。\
    \ |\n| boolean isDone() | 当任务已完成时返回 true；否则返回 false。完成可能是由于正常终止、异常或取消。 |\n\n假设你打算编写一个应用程序，其用户界面允许输入单词。用户输入单词后，应用程序会将该单词提交多个在线字典并获取每个字典的条目。随后向用户显示这些条目。\n\
    \n由于访问可能很慢，而且用户界面应该保持响应（可能你将“获取单词条目”任务加载到单独线程的执行器上）。以下示例使用 ExecutorService、Callable\
    \ 和 Future 实现这一目标：\n\n```\nExecutorService executor = ...; // ... 代表执行器的创建\nFuture<String[]>\
    \ taskFuture = \nexecutor.submit(new Callable<String[]>() {\n    @Override\n \
    \   public String[] call() {\n\n        String[] entries = ...;\n        // 访问在线字典\n\
    \        // 使用搜索单词并填充\n        // entries 条目。\n        return entries;\n    }\n\
    });\n```\n\n```\n// 执行某些操作。\nString entries = taskFuture.get();\n```\n\n在以某种方式获取执行器后（稍后我们将学习方法），示例线程向执行器提交了一个可调用的任务。submit()\
    \ 方法立即返回一个 Future 对象，用于控制任务执行并访问结果。\n\n> 注意 java.util.concurrent.ScheduledExecutorService\
    \ 接口扩展了 ExecutorService，描述允许调度任务在给定延迟后一次性或定期运行的执行器。\n\n虽然你可以创建自己的 Executor、ExecutorService\
    \ 和 ScheduledExecutorService 实现（例如类 DirectExecutor implements Executor { @Override\
    \ public void execute(Runnable r) { r.run(); } — 直接在调用线程上运行执行器），但有一个更简单的替代方案：java.util.concurrent.Executors。\n\
    \n"
