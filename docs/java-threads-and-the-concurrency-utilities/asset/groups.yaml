    # CHAPTER 5


    # Concurrency Utilities and Executors


    The previous four chapters focused on Java''s low-level support for threads. This
    chapter switches to focus on Java''s high-level thread support, which is known
    as the concurrency utilities. Think of the concurrency utilities as being analogous
    to writing applications in a high-level language and its low-level thread support
    as being analogous to writing applications in assembly language. After briefly
    introducing you to these utilities, I take you on a tour of executors. The next
    three chapters will cover other subsets of the various concurrency utilities.


    # Introducing the Concurrency Utilities


    Java''s low-level threads support let you create multithreaded applications that
    offer better performance and responsiveness over their single-threaded counterparts.
    However, there are problems:


    +   - Low-level concurrency primitives such as synchronized and wait()/notify()
    are often hard to use correctly. Incorrect use of these primitives can result
    in race conditions, thread starvation, deadlock, and other hazards, which can
    be hard to detect and debug.

    - Too much reliance on the synchronized primitive can lead to performance issues,
    which affect an application''s scalability. This is a significant problem for
    highly-threaded applications such as web servers.

    - Developers often need higher-level constructs such as thread pools and semaphores.
    Because these constructs aren''t included with Java''s low-level thread support,
    developers have been forced to build their own, which is a time-consuming and
    error-prone activity.'
  - '[PAGE 79]


    # CHAPTER 5 CONCURRENCY UTILITIES AND EXECUTORS


    To address these problems, Java 5 introduced the concurrency utilities, a powerful
    and extensible framework of high-performance threading utilities such as thread
    pools and blocking queues. This framework consists of various types in the following
    packages:


    +   - java.util.concurrent: Utility types that are often used in concurrent programming,
    for example, executors.

    - java.util.concurrent.atomic: Utility classes that support lock-free thread-safe
    operations on single variables.

    - java.util.concurrent.locks: Utility types that lock and wait on conditions (objects
    that let threads suspend execution [wait] until notified by other threads that
    some state may now be true). Locking and waiting via these types is more performant
    and flexible than doing so Java''s monitor-based synchronization and wait/notification
    mechanisms.


    This framework also introduces a nanoTime() method to the java.lang.System class,
    which makes Thread(new Runnable()).start(); nanosecond-granularity time source
    for making relative time measurements.


    The concurrency utilities can be classified as executors, synchronizers, locking
    framework, and more. I explore executors in the next section and these other categories
    in subsequent chapters.


    # Exploring Executors


    The Threads API lets you execute runnable tasks via expressions such as new java.lang.Thread(new
    Runnable()).start(); These expressions tightly couple task submission with the
    task''s execution mechanics (run on the current thread, a new thread, or a thread
    arbitrarily chosen from a pool [group] of threads).


    > A task is an object whose class implements the java.lang.Runnable interface
    (a runnable task) or the java.util.concurrent.Callable interface (a callable task).
    I will say more about Callable later in this chapter.


    The concurrency utilities include executors as a high-level alternative to low-level
    thread expressions for executing runnable tasks. An executor is an object whose
    class directly or indirectly implements the java.util.concurrent.Executor interface,
    which decouples task submission from task-execution mechanics.


    70'
  - '[PAGE 80]


    # CHAPTER 5 CONCURRENCY UTILITIES AND EXECUTORS


    **Note** The Executor Framework''s use of interfaces to decouple task submission
    from task-execution is analogous to the Collections Framework''s use of core interfaces
    to decouple lists, sets, queues, and maps from their implementations. Decoupling
    results in flexible code that''s easier to maintain.


    Executor declares a solitary execute(Runnable runnable) method that executes the
    task named runnable at some point in the future. execute() throws java.lang.NullPointerException
    when runnable is null and java.util.concurrent.RejectedExecutionException when
    it cannot execute runnable.


    **Note** RejectedExecutionException can be thrown when an executor is shutting
    down and doesn''t want to accept new tasks. Also, this exception can be thrown
    when the executor doesn''t have enough memory to store the task (perhaps the executor
    uses a bounding queue to store task tasks and the queue is full—discuss blocking
    queues in Chapter 8).


    The following example shows the Executor equivalent of the aforementioned new
    Thread(new Runnable()).start(); expression:


    ```

    Executor executor = ...; // represents some executor creation

    executor.execute(new RunnableTask());

    ```


    Although Executor is easy to use, this interface is limited in various ways:


    +   * Executor focuses exclusively on Runnable. Because Runnable''s run() method
    doesn''t return a value, there''s no easy way for a runnable task to return a
    value to its caller.

    * Executor doesn''t provide a way to track the progress of runnable tasks that
    are executing an runnable task, or determine when the runnable task finishes execution.

    * Executor cannot cancel a collection of runnable tasks.

    * Executor doesn''t provide a way for an application to shut down an executor
    (much less properly shut down an executor).


    These limitations are addressed by the java.util.concurrent.ExecutorService interface,
    which extends Executor and whose implementation is typically a thread pool. Table
    5-1 describes Executor''s methods.'
