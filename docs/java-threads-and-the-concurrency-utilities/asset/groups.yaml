  - "[PAGE 34]\n\nAssume that thread 1 invokes getInstance() first. Because it observes\
    \ a null value in the parser field, thread 1 instantiates Parser and assigns its\
    \ reference to parser. When thread 2 subsequently gets getInstance(), it could\
    \ observe that parser contains a non-null reference and simply return parser's\
    \ value. Alternatively, thread 2 could cache a null value in parser and create\
    \ a new Parser object. Because there is no happens-before ordering (one action\
    \ must precede another) between thread 1's write of parser and thread 2's read\
    \ of parser (because there is no coordinated access to parser), a data race has\
    \ occurred.\n\n# Cached Variables\n\nTo boost performance, the compiler, the Java\
    \ virtual machine (JVM), and the operating system collaborate to cache a variable\
    \ in a register or a processor-local cache, rather than rely on main memory. Each\
    \ thread has its own copy of the variable. When one thread writes to this variable,\
    \ it is writing to its copy; other threads are unlikely to see the update in their\
    \ threads.\n\nChapter 1 presented a ThreadDemo application (see Listing 1-3) that\
    \ exhibits this problem. For reason, I repeat part of the source code here:\n\n\
    ```\nprivate static BigDecimal price;\npublic static void main(String[] args)\n\
    {\n    Runnable r = () -> {\n        result = computePi(50000);\n    };\n    Thread\
    \ t = new Thread(r);\n    t.start();\n    try {\n        t.join();\n    } catch\
    \ (InterruptedException ie) {\n        // Should never arrive here because interrupt()\
    \ is never\n        // called.\n    }\n    System.out.println(result);\n}\n```\n\
    \nThe class field named result demonstrates the cached variable problem. This\
    \ field is accessed by a worker thread that executes result = computePi(50000);\
    \ in a lambda context, and by the default main thread when it executes System.out.println(result).\n\
    The worker thread could store computePi()'s return value in its copy of the copy.\
    \ whereas the default main thread might not see the result = computePi(50000);\
    \ assignment and its copy would remain at the null default. This value would output\
    \ instead of result's string representation (the computed pi value)."
