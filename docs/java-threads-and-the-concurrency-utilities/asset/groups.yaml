  mdcn: "\n\n## 第1章 线程与可运行对象\n\n给后台线程留一些时间在中断之前输出几条消息，默认主线程进入一个基于 `while` 的忙等待循环，这是一个旨在浪费某些时间的语句循环。该循环反复获取一个随机值，直到该值落在一个狭窄范围内。\n\
