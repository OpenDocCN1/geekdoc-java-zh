    # CHAPTER 1 THREADS AND RUNNABLES


    +   - WAITING: A thread that is waiting indefinitely for another thread to perform
    a particular action is in this state.


    +   - TIMED_WAITING: A thread that is waiting for another thread to perform an
    action up to a specified waiting time is in this state.


    +   - TERMINATED: A thread that has exited in this state.


    Thread lets an application determine the thread''s current state by providing
    the Thread.State getState() method, which is demonstrated here:


    ```

    Thread t = new Thread();

    System.out.println(t.getState()); // Output: NEW

    ```


    # Getting and Setting a Thread''s Priority


    When a computer has enough processors and/or processor cores, the computer''s
    operating system assigns a separate thread to each processor or core so the threads
    execute simultaneously. When a computer doesn''t have enough processors and/or
    cores, various threads must wait their turns to use the shared processors/cores.


    > Note You can identify the processors and/or processor cores that are available
    for the JVM by the java.lang.Runtime class''s int availableProcessors() method.
    The return value could change during JVM execution and is never smaller than 1.


    The operating system uses a scheduler (http://en.wikipedia.org/wiki/Scheduling_(computing))
    to determine when a waiting thread executes. The following lists three different
    schedulers:


    +   - Linux 2.6 through 2.63 uses the O(1) Scheduler (http://en.wikipedia.org/wiki/O(1)_scheduler).


    +   - Linux 2.63 also uses the Completely Fair Scheduler (http://en.wikipedia.org/wiki/Completely_Fair_Scheduler),
    which is the default scheduler.


    +   - Windows NT-based operating systems (such as NT, XP, Vista, and 7) use a
    multilevel feedback queue scheduler (http://en.wikipedia.org/wiki/Multilevel_feedback_queue).
    This scheduler is adjusted in Windows Vista and Windows 7 to optimize performance.


    A multilevel feedback queue and many other schedulers take priority (thread relative
    importance) into account. They often combine preemptive scheduling (higher priority
    threads preempt-interrupt and instead of—lower priority threads) with round robin
    scheduling (equal priority threads are given equal slices of time, which are known
    as time slices, and take turns execution).'
