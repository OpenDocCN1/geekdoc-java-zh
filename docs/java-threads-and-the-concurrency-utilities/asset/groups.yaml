    void schedule(TimerTask task, long delay, long period):

    Schedule task for fixed-delay execution, beginning after delay milliseconds. Subsequent
    executions take place at approximately regular intervals separated by period milliseconds.

    This method throws IllegalArgumentException when delay is negative, delay + System.currentTimeMillis()
    is negative, or period is zero; IllegalStateException when task was already scheduled
    or canceled, the timer was canceled, or the task-execution thread terminated;
    and NullPointerException when task is null.


    void scheduleAtFixedRate(TimerTask task, Date firstTime):

    Schedule task for repeated-rate execution, beginning at approximately regular
    intervals, separated by period milliseconds. For fixed-rate execution, each execution
    is scheduled relative to the scheduled execution time of the initial execution.
    When an execution is delayed for any reason (such as garbage collection), two
    or more executions occur in rapid succession to "catch up". In the long run, the
    frequency of execution will be the reciprocal of the period (assuming the system
    using Object.wait(long) is accurate). As a consequence, when the scheduled firstTime
    is in the past, "missed" executions will be scheduled for immediate "catch up"
    execution.Fixed-rate execution is appropriate for recurring activities that are
    sensitive to delay (such as ringing chime every hour, or running maintenance every
    day at a particular time). It''s also appropriate for recurring activities where
    the total time to perform a fixed number of executions is important, such as a
    countdown timer that ticks once every 10 seconds. Finally, fixed-rate execution
    for scheduling repeating timer tasks that must remain synchronized with one another.
    This method throws IllegalArgumentException when firstTime.getTime() is negative,
    or period is negative or zero; IllegalStateException when task was already scheduled
    or canceled, the timer was canceled, or the task-execution thread terminated;
    and NullPointerException when task or firstTime is null.


    void scheduleAtFixedRate(TimerTask task, long delay, long period):

    Schedule task for repeated-rate execution, beginning after delay milliseconds.
    Subsequent executions take place at approximately regular intervals, separated
    by period milliseconds. This method throws IllegalArgumentException when delay
    is negative, delay + System.currentTimeMillis() is negative, or period is negative
    or zero; IllegalStateException when task was already scheduled or canceled, the
    timer was canceled, or the task-execution thread terminated; and NullPointerException
    when task is null.


    # CHAPTER 4 ADDITIONAL THREAD CAPABILITIES


    After the last live reference to a Timer object goes away and all outstanding
    timer tasks have completed execution, the timer''s task-execution thread terminates
    gracefully (and becomes subject to garbage collection). However, this can take
    arbitrarily long to occur. (By default, the task-execution thread doesn''t run
    as a daemon, so it''s capable of preventing an application from terminating.)
    When an application wants to terminate a timer''s task-execution thread rapidly,
    the application should invoke Timer''s cancel().


    When the timer''s task-execution thread terminates unexpectedly, for example,
    because its stop() method was invoked (you should never call any of Thread''s
    stop() methods because they''re inherently unsafe), any further attempt to schedule
    a timer task on the timer results in IllegalStateException, as if Timer''s cancel()
    method had been invoked.


    # TimerTask in Depth


    Timer tasks are instances of classes that subclass the abstract TimerTask class,
    which implements the Runnable interface. When subclassing TimerTask, you override
    your run() method to supply the timer task''s code.


    > Note: Timer tasks should complete quickly. When a timer task takes too long
    to complete, it "hogs" the timer''s task-execution thread, delaying the execution
    of subsequent timer tasks, which may "bunch up" and execute in rapid succession
    if and when the offending task finally completes.


    You can also call the following methods from within the overriding timer task''s
    run() method:


    - cancel(): Cancel this timer task. The timer task has been scheduled for one-shot
    execution and hasn''t run or when it hasn''t been scheduled, it will never run.
    When the timer has been scheduled for repeated execution, it will never run again.
    (When the timer is running when this call occurs, the timer will run to completion,
    but never run again.) Calling cancel() within the run() of a repeating timer task
    absolutely guarantees that the timer task won''t run again; the second and subsequent
    calls have no effect. This method returns true when this timer task is scheduled
    for one-shot execution and hasn''t run or when this timer task is scheduled for
    repeated execution. It returns false when the timer task was scheduled for one-shot
    execution and has already run, or when the timer task was already canceled. (Loosely
    speaking, this method returns true when it prevents one or more scheduled executions
    from taking place.)


    long scheduledExecutionTime():

    Return the scheduled execution time of the most recent actual execution of this
    timer task.(When this method is invoked while timer execution is in progress,
    the return value is the scheduled execution time of the ongoing timer task execution.)
    This method is typically invoked from a task''s run() to determine whether the
    current execution of the timer task is sufficiently timely to warrant performing
    the scheduled activity. For example, you would specify code similar to if (System.currentTimeMillis()-scheduledExecutionTime()
    > MAX_TARDINESS) return; at the start of the run() to abort the current timer
    task when it''s not timely. This method is typically not used in conjunction with
    fixed-delay execution repeating timer tasks because their scheduled execution
    times are allowed to drift over time and are not thus significant.

    scheduledExecutionTime() returns the time at which the most recent execution of
    this task was scheduled to occur, in the format returned by java.util.Date.getTime().
    The return value is undefined when the timer has yet to commence its first execution.


    # EXERISES


    The following exercises are designed to test your understanding of Chapter 4''s
    content:


    - 1. Define thread group.

    - 2. Why might you use a thread group?

    - 3. Why should you avoid using thread groups?

