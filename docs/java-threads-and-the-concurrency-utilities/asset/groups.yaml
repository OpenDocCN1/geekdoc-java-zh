    # Cyclic Barriers


    A cyclic barrier lets a set of threads wait for each other to reach a common barrier
    point.

    The cyclic barrier is useful in applications involving a fixed-size party of threads
    that must

    synchronize because it can be reused after the waiting threads are released.


    The java.util.concurrent.CyclicBarrier class implements the cyclic barrier

    synchronizer. You initialize a CyclicBarrier instance to a specific number of
    parties

    (threads working towards a common goal) by invoking this class''s CyclicBarrier(int

    parties) constructor. This constructor throws IllegalArgumentException when the

    value passed to parties is less than 1.


    Alternatively, you can invoke the CyclicBarrier(int parties, Runnable

    barierAction) and a barrierAction that is executed when the barrier is tripped.
    In other words,

    when parties - 1 threads are waiting and one more thread arrives, the arrival

    executes barrierAction and then all threads proceed. This runnable is useful for

    updating shared state before any of the threads continue. This constructor throws

    IllegalArgumentException when the value passed to parties is less than 1. (The
    former

    constructor invokes this constructor passing null to barrierAction—no runnable
    will be

    executed when the barrier is tripped.)


