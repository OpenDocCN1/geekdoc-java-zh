    \ producer.\nD consumed by consumer.\n\n## ReadWriteLock\n\nSituations arise where\
    \ data are read more often than they are modified. For example, you might have\
    \ created an online dictionary of word definitions that many threads will read\
    \ concurrently, while a single thread might occasionally add new definitions or\
    \ update existing definitions. The Locking Framework provides a read-write locking\
    \ mechanism for these situations that yields greater concurrency when reading\
    \ and the safety of exclusive access when writing. This mechanism is based on\
    \ the ReadWriteLock interface.\n\nReadWriteLock declares the following methods:\n\
    \n- *Lock readLock():* Return the lock that's used for reading.\n- *Lock writeLock():*\
    \ Return the lock that's used for writing.\n\n## ReentrantReadWriteLock\n\nReadWriteLock\
    \ is implemented by the ReentrantReadWriteLock class, which describes a reentrant\
    \ read-write lock with similar semantics to ReentrantLock.\n\nYou initialize a\
    \ ReentrantReadWriteLock instance by invoking either of the following constructors:\n\
    \n- *ReentrantReadWriteLock():* Create an instance of ReentrantReadWriteLock.\
    \ This constructor is equivalent to ReentrantReadWriteLock(false).\n- *ReentrantReadWriteLock(boolean\
    \ fair):* Create an instance of ReentrantReadWriteLock with the specified fairness\
    \ policy. Pass true to fair when this lock should use a fair ordering policy.\n\
    \nFor the fair ordering policy, when the currently held lock is released, the\
    \ longest-waiting single writer thread will be assigned the lock, or when there's\
    \ a group of readers waiting longer than all writer threads, that group will be\
    \ assigned the read lock.\n\nA thread that tries to acquire a fair read lock (non-reentrantly)\
    \ will block when the write lock is held or when there's a waiting writer thread.\
    \ The thread will not acquire the read lock until the oldest currently waiting\
    \ writer thread has acquired and released the write lock. If a writer abandons\
    \ its wait, leaving one or more readers as the longest waiters, those readers\
    \ will be assigned the read lock.\n\nA thread that tries to acquire a fair write\
    \ lock (non-reentrantly) will block unless both the read lock and write lock are\
    \ free (which implies no waiting threads). (The nonblocking tryLock() methods\
    \ do not honor this fair setting and will immediately acquire the lock if possible,\
    \ regardless of waiting threads.)\n\nAfter instantiating this class, you invoke\
    \ the following methods to obtain the read and write locks:\n\n- *ReentrantReadWriteLock.readLock():*\
    \ Return the lock used for reading.\n- *ReentrantReadWriteLock.writeLock():* Return\
    \ the lock used for writing.\n\n## CHAPTER 7 THE LOCKING FRAMEWORK\n\nEach of\
    \ the nested ReadLock and WriteLock classes implements the Lock interface and\
    \ declares its own methods. Furthermore, ReentrantReadWriteLock declares additional\
    \ methods such as the following pair:\n\n- *int getReadHoldCount():* Return the\
    \ number of reentrant holds on the lock by the calling thread, which is 0 when\
    \ the read lock isn't held by the calling thread. A reader thread has a hold on\
    \ each for action that's not matched by an unlock action.\n- *int getWriteHoldCount():*\
    \ Return the number of reentrant holds on the lock by the calling thread, which\
    \ is 0 when the write lock isn't held by the calling thread. A writer thread has\
    \ a hold on each action that's not matched by an unlock action.\n\nTo demonstrate\
    \ ReadWriteLock and ReentrantReadWriteLock, Listing 7-3 presents an application\
    \ where writer thread produces a dictionary of word/definition entries while a\
    \ reader thread continually accesses entries at random and outputs them.\n\nListing\
    \ 7-3. Using ReadLock to Satisfy a Dictionary Application's Reader and Writer\
    \ Threads\n\n```java\nimport java.util.HashMap;\nimport java.util.Map;\n\nimport\
    \ java.util.concurrent.Executors;\nimport java.util.concurrent.ExecutorService;\n\
    \nimport java.util.concurrent.locks.Lock;\nimport java.util.concurrent.locks.ReadWriteLock;\n\
    import java.util.concurrent.locks.ReentrantReadWriteLock;\n\npublic class Dictionary\
    \ {\n    public static void main(String[] args) {\n        final String[] words\
    \ = {\n            \"hypocalcemia\",\n            \"prolificity\",\n         \
    \   \"assidduous\",\n            \"indefatigable\",\n            \"castellan\"\
    \n        };\n\n        final String[] definitions = {\n            \"a deficiency\
    \ of calcium in the blood\",\n            \"unduly prolonged or drawn out\",\n\
    \            \"showing great care, attention, and effort\",\n            \"able\
    \ to work or continue for a lengthy time without tiring\",\n            \"the\
    \ governor or warden of a castle or fort\"\n        };\n\n        Map<String,\
    \ String> dictionary = new HashMap<String, String>();\n\n        ReadWriteLock\
    \ rwl = new ReentrantReadWriteLock(true);\n        final Lock rlock = rwl.readLock();\n\
    \        final Lock wlock = rwl.writeLock();\n\n        Runnable writer = () ->\
    \ {\n            for (int i = 0; i < words.length; i++) {\n                wlock.lock();\n\
    \                try {\n                    dictionary.put(words[i], definitions[i]);\n\
