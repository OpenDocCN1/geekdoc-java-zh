    button. The label displays the count variable''s current value and the button
    text alternates between Start and Stop. Clicking the button when it indicates
    Start causes the timer to start; clicking the button when it indicates Stop stops
    the timer. The timer action listener increments the count variable and displays
    its value via the label. The space character that''s appended to count converts
    the expression to a string and ensures that its rightmost pixels are not cut off.


