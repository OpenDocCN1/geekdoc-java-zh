    \n```java\nsynchronized(map)\n{\n  if (!map.containsKey(\"some string-based key\"\
    ))\n    map.put(\"some string-based key\", \"some string-based value\");\n}\n\
    ```\n\n这种方法的问题在于，你在检查键是否存在以及键不存在时不向 map 中添加条目时，对整个 map 进行了读写操作锁定。当许多线程尝试访问 map\
    \ 时，这种锁定会影响性能。\n\n泛型 ConcurrentHashMap<K, V> 类通过提供 `V putAbsent(K key, V value)`\
    \ 方法解决了这个问题，该方法在键不存在时向 map 引入键/值条目。该方法等同于以下代码片段，但提供了更好的性能：\n\n```java\nsynchronized(map)\n\
    {\n  if (!map.containsKey(key))\n    return map.put(key, value)\n  else\n    return\
    \ map.get(key);\n}\n```\n\n使用 `putIfAbsent()`，之前的代码片段转换为下面的简单代码片段：\n\n```java\n\
    map.putIfAbsent(\"some string-based key\", \"some string-based value\");\n```\n\
    \n## 第 8 章 额外的并发工具\n\n注意 Java 8 通过增加 30 多个新方法改进了 ConcurrentHashMap，这些方法在很大程度上通过聚合操作支持\
    \ lambda 表达式和 Streams API。执行聚合操作的方法包括 forEach() 方法（forEach(), forKey(), forValue(),\
    \ 和 forEntry()）、搜索方法（search(), searchKeys(), searchValues(), 和 searchEntries()）以及归约方法（reduce(),\
    \ reduceToDouble(), reduceLong() 等）。还添加了一些杂项方法（如 mappingCount 和 newkeySet()）。由于\
    \ JDK 8 的出现，ConcurrentHashMap（以及基于它们构建的类）现在作为缓存更有用。缓存改进的变化包括为键计算值的方法，以及对扫描（并可能驱逐）条目的改进支持，以及对包含大量元素的\
    \ map 更好的支持。\n\n## 原子变量\n\n与对象监视器关联的内在锁在历史上一直性能不佳。尽管性能有所提高，但在创建 Web 服务器以及在显著线程竞争的情况下需要高扩展性和高性能的应用程序时，它们仍然会成为瓶颈。\n\
    \n许多研究致力于创建非阻塞算法，这些算法可以从根本上提高同步上下文的性能。这些算法提供了更高的扩展性，因为当多个线程争抢相同数据时，线程不会遭受死锁。此外，线程也不会遭受死锁和其他活跃性问题。\n\
    \nJava 5 通过引入 `java.util.concurrent.atomic` 包，提供了创建高效非阻塞算法的能力。根据该包的文档，`java.util.concurrent.atomic`\
    \ 提供了一组类工具包，支持对单个变量进行无锁线程安全操作。\n\n`java.util.concurrent.atomic` 包中的类扩展了 volatile\
    \ 值、字段和数组元素的概念，使它们能够提供原子的条件更新，因此不需要外部同步。换句话说，你可以在不需要外部同步的情况下获得与 volatile 变量相关的内存语义以及互斥。\n\
    \n> 注意：原子（atomic）和不可分割（indivisible）这两个词被广泛认为是等价的，尽管我们可以分裂原子。\n\n## 第 8 章 额外的并发工具\n\
    \n这里这里描述了位于 `java.util.concurrent.atomic` 中的一些类：\n\n- AtomicBoolean: 可以被原子更新的布尔值。\n\
    - AtomicInteger: 可以被原子更新的 int 值。\n- AtomicIntegerArray: 元素可以被原子更新的 int 数组。\n-\
    \ AtomicLong: 可以被原子更新的 long 值。\n- AtomicLongArray: 元素可以被原子更新的 long 数组。\n- AtomicReference:\
    \ 可以被原子更新的引用引用。\n- AtomicReferenceArray: 元素可以被原子更新的对象引用数组。\n\n原子变量用于实现计数器、序列生成器（例如\
    \ `java.util.concurrent.ThreadLocalRandom`）以及在高线程竞争下不产生性能问题的情况下需要互斥的其他结构。例如，列表\
    \ 8-2 中的 ID 类，其 `nextID()` 返回唯一的 long 整数标识符。\n\n**Listing 8-2.** 通过 synchronized\
    \ 以线程安全的方式返回唯一标识符\n\n```java\nclass ID {\n    private static volatile long nextID\
    \ = 1;\n    static synchronized long nextID() {\n        return nextID++;\n  \
    \  }\n}\n```\n\n尽管代码已经了适当的同步（并且考虑了可见性），但与 synchronized 关联的内在锁在严重的线程竞争下会损害性能。此外，可能会发生死锁等活跃性问题。列表\
    \ 8-3 显示了如何通过用原子变量替换 synchronized 来避免这些问题。\n\n## 第 8 章 额外的并发工具\n\n**Listing 8-3.**\
    \ 通过 AtomicLong 以线程安全的方式返回唯一 ID\n\n```java\nimport java.util.concurrent.atomic.AtomicLong;\n\
    \nclass ID {\n    private static AtomicLong nextID = new AtomicLong(1);\n\n  \
    \  static long getNextID() {\n        return nextID.getAndIncrement();\n    }\n\
    }\n```\n\n在列表 8-3 中，我重构了 `nextID()` 以使用 AtomicLong。（注意：原始 OCR 在方法名上有拼写错误，已修正为\
    \ getNextID）。\n\n> 注意：java.util.concurrent.atomic 包包含 DoubleAccumulator, DoubleAdder,\
    \ LongAccumulator 和 LongAdder。\n\n## 理解原子魔法\n\n尽管你可能认为可以使用 volatile 作为同步方案，volatile\
    \ 变量只能解决可见性问题。它们无法安全地实现互斥所需的原子读写序列。然而，有一种替代方案是并发工具所提供的性能提升。这种替代方案被称为比较交换（compare-and-swap，CAS）。\n\
    \n比较交换（CAS）是不可中断处理器特定指令的通用术语，它读取内存位置，将读取值与预期值进行比较，并在读取值匹配预期值时在内存位置中存储新值。现代处理器提供了\
    \ CAS 的变体。例如，Intel 处理器使用 cmpxchg 系列，而旧的 PowerPC 处理器提供加载链接（如 lx）和条件存储（如 stwcx）。\n\
    \nCAS 支持原子读写序列。你通常这样使用 CAS：\n\n1. 从地址 A 读取 x。\n2. 对 x 执行多集计算以得出新值 y。\n3. 使用 CAS\
    \ 将 A 从 x 改为 y。当 A 的值没有变化时，CAS 成功。\n\n为了理解 CAS 的用处，请考虑列表 8-2 中的类，它返回一个唯一标识符。因为\
    \ CAS 类声明其 `nextID()` 是同步的，对监视器锁的过度竞争可能会延迟任何线程，并导致应用程序无法扩展。\n\n`compareAndSwap()`\
    \ 方法以原子方式执行以下序列：\n\n```java\nint readValue = value; // 获取存储的值。\nif (readValue\
    \ == expectedValue) // 如果存储的值未被修改 ...\nvalue = newValue; // 修改为新值。\nreturn readValue;\
    \ // 返回可能更改之前的值。\n```\n\n列表 8-4 展示了 ID 的新版本，它使用 CAS 类以高效的方式获取唯一标识符。（忘记使用 JNI 的性能影响，并假设我们直接访问处理器特定的\
    \ CAS 指令。）\n\n```java\nclass ID {\n    private static AtomicLong nextID = new\
    \ AtomicLong(1);\n\n    static long getNextID() {\n        return nextID.getAndIncrement();\n\
    \    }\n}\n```\n\n"
