  mdcn: "\n假设线程 1 首先调用 `getInstance()`。由于它在 `parser` 字段中观察到空值，线程 1 实例化了 `Parser` 并将其引用赋值给\
    \ `parser`。当线程 2 随后获取 `getInstance()` 时，它可能会观察到 `parser` 包含非空引用并直接返回 `parser`\
    \ 的值。或者，线程 2 可能会在 `parser` 中缓存空值并创建一个新的 `Parser` 对象。由于线程 1 对 `parser` 的写入和线程 2\
    \ 对 `parser` 的读取之间不存在 happens-before 排序（即一个动作必须先于另一个动作发生，因为没有对 `parser` 的协调访问），因此发生了数据竞态。\n\
    \n## 缓存变量\n\n为了提高性能，编译器、Java 虚拟机（JVM）和操作系统会将变量缓存在寄存器或处理器本地缓存中，而不是依赖主内存。每个线程都有该变量的独立拷贝。当一个线程写入该变量时，它是在写入自己的拷贝；其他线程不太可能在自己的线程中看到更新。\n\
    \n第 1 章介绍了一个 `ThreadDemo` 应用（参见列表 1-3），它展示了这个问题。由于某种原因，我在此处重复了部分源代码：\n\n```\n\
    private static BigDecimal price;\npublic static void main(String[] args)\n{\n\
    \    Runnable r = () -> {\n        result = computePi(50000);\n    };\n    Thread\
    \ t = new Thread(r);\n    t.start();\n    try {\n        t.join();\n    } catch\
    \ (InterruptedException ie) {\n        // 永远不会到达这里，因为 interrupt() 永远\n       \
    \ // 没有调用。\n    }\n    System.out.println(result);\n}\n```\n\n名为 `result` 的类字段演示了缓存变量问题。该字段由工作线程在\
    \ lambda 上下文中执行 `result = computePi(50000)` 时访问，并由默认主线程在执行 `System.out.println(result)`\
    \ 时访问。\n工作线程可能将其 `computePi()` 的返回值存储在它的拷贝中；而默认主线程可能看不到 `result = computePi(50000);`\
    \ 赋值，它的拷贝将保持为默认值 null。输出将是该值，而不是 `result` 的字符串表示（计算出的 pi 值）。\n\n## 同步访问关键区域\n\n\
    你可以使用同步（synchronization）来解决上述线程问题。同步是 JVM 的特性，确保两个或多个并发线程不会同时执行关键区域，关键区域是必须按串行（一次一个线程）访问的代码段。\n\
    \n同步的这种属性被称为当另一个线程位于关键区域内部时，防止在关键区域内执行的互斥（mutual exclusion）。由于由于，线程获取的锁通常被称为互斥锁（mutex\
    \ lock）。\n\n同步还表现出可见性（visibility）属性，它确保执行关键区域的线程始终能看到共享变量的最新更改。在进入关键区域时从主内存读取这些变量，并在离开关键区域时将其写入主内存。\n\
    \n同步是通过监视器（monitors）实现的，它是控制关键区域访问的并发构造结构，且必须以不可见的方式执行。每个 Java 对象与一个监视器关联，线程可以通过获取和释放监视器的锁（令牌）来锁定或解锁监视器。\n\
    \n> 获取了锁的线程在调用 Thread 的 `sleep()` 方法时不会释放该锁。\n\n只有一个线程可以持有监视器的锁。任何其他尝试锁定该监视器的线程都会阻塞，直到它获得锁。当线程退出关键区域时，它通过释放锁来解锁监视器。\n\
    \n锁被设计为可重入的以防止死锁（稍后讨论）。当一个线程尝试获取它已经持有的锁时，请求将成功。\n\n> `java.lang.Thread` 类声明了一个静态布尔方法\
    \ `holdsLock(Object o)`，当调用线程持有对象 `o` 的锁时，返回 `true`。你会发现此方法在断言语句中非常有用，例如 `assert\
    \ Thread.holdsLock(o);`\n\nJava 提供了 `synchronized` 关键字来将线程对方法或语句块（关键区域）的访问串行化。\n\
    \n## 使用同步方法\n\n同步方法在头部头部包含 `synchronized` 关键字。例如，你可以使用此关键字来同步之前的 `getID()` 方法，并如下解决其读-修改-写竞态条件：\n\
    \n```\npublic synchronized getID()\n{\n    return counter++;\n}\n```\n\n在实例方法上进行同步时，锁与调用该方法的对象关联。例如，考虑以下\
    \ `ID` 类：\n\n```java\npublic class ID\n{\n    private int counter; // 默认初始化为 0\n\
    \n    public synchronized getID()\n    {\n        return counter++;\n    }\n}\n\
    ```\n\n假设你指定了以下代码序列：\n\n```\nID id = new ID();\nSystem.out.println(id.getID());\n\
    ```\n\n锁与存储在 `id` 中的 ID 对象关联。如果另一个线程在该方法执行期间调用了 `id.getID()`，另一个线程将必须等待直到执行线程释放锁。\n\
    \n在类方法上进行同步时，锁与被调用类方法的类对应的 `java.lang.Class` 对象关联。例如，考虑以下 `ID` 类：\n\n```java\n\
    public class ID\n{\n    private static int counter; // 默认初始化为 0\n\n    public\
    \ static synchronized int getID()\n    {\n        return counter++;\n    }\n}\n\
    ```\n\n假设你指定了以下代码序列：\n\n```\nSystem.out.println(ID.getID());\n```\n\n锁与 `ID.class`（与\
    \ ID 关联的 Class 对象）关联。如果另一个线程在该方法执行期间调用了 `ID.getID()`，另一个线程将等待直到执行线程释放锁。\n\n##\
    \ 使用同步块\n\n同步语句块由一个头部前缀。其语法如下：\n\n```\nsynchronized(object)\n{\n    /* statements\
    \ */\n}\n```\n\n根据此语法，`object` 是任意的。在之前的示例中，两个遭受缓存变量问题的应用程序指定了 `FOUR`。你可以通过两个同步块来解决这个问题：\n\
    \n```\nRunnable r = () ->\n  synchronized(FOUR)\n  {\n    result = computePi(50000);\n\
    \  };\nsynchronized(FOUR)\n{\n  System.out.println(result);\n}\n```\n\n等等，如果我在一个地方指定了\
    \ `synchronized(FOUR)` 而另一个地方指定了 `synchronized(\"ABC\")`，那么就不会有……\n\n## 注意活性问题\n\
    \n活性（liveness）一词是指最终会发生某些有利的情况。当应用程序进入无法进一步进展的状态时，就会发生活性失败。在单线程应用程序中，无限循环就是一个例子。多线程应用程序面临死锁、活锁和饥饿等额外的活性挑战：\n\
    \n- 死锁（Deadlock）：线程 1 等待线程 2 独占的资源，而线程 2 等待线程 1 独占的资源。两个线程都无法进展。\n- 活锁（Livelock）：线程\
    \ x 不断重试一个总是失败的操作。由于此原因它无法进展。\n- 饥饿（Starvation）：线程 x 持续被调度器拒绝访问进展所需的资源。也许调度器在执行低优先级线程之前执行高优先级线程，并且始终有高优先级线程可用。饥饿也被称为无限推迟。\n\
    \n考虑死锁。这种病态问题由于通过 `synchronized` 关键字的大量同步而产生。如果你不小心，可能会遇到多个线程获取锁的情况，它们都没有持有自己的锁，但持有另一个线程所需的锁，且哪个线程都无法进入并释放其关键区域，因为另一个线程持有该关键区域的锁。列表\
    \ 2-1 作为异常示例演示了这种场景。\n\n列表 2-1. 死锁的病态案例\n\n```java\npublic class DeadlockDemo\n\
    {\n    private final Object lock1 = new Object();\n    private final Object lock2\
    \ = new Object();\n\n    public void instanceMethod1()\n    {\n        synchronized(lock1)\n\
    \        {\n            synchronized(lock2)\n            {\n                 \
    \   System.out.println(\"first thread in instanceMethod1\");\n               \
    \     // 关键区域由第一个\n                    // lock1 保护，然后由 lock2 保护\n            \
    \    }\n            }\n        }\n    }\n}\n```\n"
