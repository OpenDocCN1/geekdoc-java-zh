    Thread-0: 779\nThread-1: 75\n```\n\n## 线程线程\n\n线程（如默认的主线程）偶尔会启动另一个线程来执行长时间计算、下载大文件或执行某些其他耗时的活动。在完成其他任务后，启动工作线程的线程准备好处理工作线程的结果，并等待工作线程结束并死亡。\n\
    \n`Thread` 类提供了三个 `join()` 方法，允许调用线程等待对对象调用 `join()` 的线程死亡：\n\n- `void join()`:\
    \ 无期等待此线程死亡。当任何线程中断了当前线程时，会抛出 `InterruptedException`。如果抛出此异常，中断状态将被清除。\n- `void\
    \ join(long millis)`: 最多等待 `millis` 毫秒此线程死亡。向 `millis` 传递 0 以无期等待——`join()` 方法调用\
    \ `join(0)`。当任何线程中断了当前线程时，会抛出 `IllegalArgumentException`。如果抛出此异常，中断状态将被清除。\n-\
    \ `void join(long millis, int nanos)`: 最多等待 `millis` 毫秒和 `nanos` 纳秒此线程死亡。当 `millis`\
    \ 为负或 `nanos` 大于 999999 时，会抛出 `IllegalArgumentException`。当任何线程中断了当前线程时，会抛出 `InterruptedException`。如果抛出此异常，中断状态将被清除。\n\
    \n为了演示忽略的 `join()` 方法，我创建了一个计算到 50,000 位数的 pi 的应用程序。它通过数学家 [John Machin 在 1700\
    \ 世纪早期](https://en.wikipedia.org/wiki/John_Machin) 开发的算法计算 pi。该算法首先计算 `pi/4 =\
    \ arctan(1/5)-arctan(1/239)`，然后将结果乘以 4 以获得 pi 的值。因为弧（反）正切是使用项项的幂级数计算的，项越多，得到的\
    \ pi 就越精确（就小数点后的位数而言）。列表 1-3 展示了源代码。\n\n### 列表 1-3. 演示线程连接\n\n```java\nimport\
    \ java.math.BigDecimal;\nclass ThreadDemo {\n    // pi 计算中使用的常量\n    private static\
