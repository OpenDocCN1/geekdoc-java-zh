  md: "# CHAPTER 7 THE LOCKING FRAMEWORK\n\non. Implementations of the Lock interface\
    \ enable the use of such techniques by allowing a lock to be acquired and released\
    \ in different scopes, and by allowing multiple locks to be acquired and released\
    \ in any order.\n\nWith this increased flexibility comes additional responsibility.\
    \ The absence of block-structured locking removes the automatic release of locks\
    \ that occurs with synchronized methods and blocks. As a result, you should typically\
    \ employ the idiom for acquisition and release:\n\n```\nLock l = ...; // ... is\
