    # # Summary


    Java''s low-level thread capabilities let you create multithreaded applications
    that offer better performance and responsiveness over their single-threaded counterparts.
    However, performance issues that affect an application''s scalability and other
    problems resulted in Java 5''s introduction of the concurrency utilities.


    The concurrency utilities organize various types into three packages: java.util.concurrent.atomic,
    and java.util.concurrent.locks. Basic types for executors, thread pools, concurrent
    hashmaps, and other high-level concurrency constructs are stored in java.util.concurrent;
    classes that support lock-free, thread-safe programming on single variables are
    stored in java.util.concurrent.atomic; and types- java.util.concurrent types for
    locking and waiting on conditions are stored in java.util.concurrent.locks.


    An executor decouples task submission from task-execution mechanics and is described
    by the Executor, ExecutorService, and ScheduledExecutorService interfaces. You
    obtain an executor by calling one of the utility methods of the Executors class.
    Executors are associated with callables and futures.


    Chapter 6 presents synchronizers.'
