  md: '# CHAPTER 5 CONCURRENCY UTILITIES AND EXECUTORS


    > **Tip** If you intend to create your own ExecutorService implementations, you
    will find it helpful to work with the java.util.concurrent.AbstractExecutorService
    and java.util.concurrent.FutureTask classes.


    The Executors utility class declares several class methods that return instances
    of various ExecutorService and ScheduledExecutorService implementations (and other
    kinds of instances). This class''s static methods accomplish the following tasks:


    +   - Create and return an ExecutorService instance that is configured with commonly
    used configuration settings.

    - Create and return a ScheduledExecutorService instance that''s configured with
    commonly used configuration settings.

    - Create and return a "wrapped" ExecutorService instance that disables reconfiguration
    of the executor service by making implementation-specific methods inaccessible.

    - Create and return a java.util.concurrent.ThreadFactory instance (that is, an
    instance of a class that implements the ThreadFactory interface) for creating
    new Thread objects.

    - Create a Callable instance out of other closure forms so that it can be used
    in execution methods that require Callable arguments (such as ExecutorService''s
    submit(Callable) method). Wikipedia''s "Closure" entry at http://en.wikipedia.org/wiki/Closure_(computer_science)
    introduces the topic of closures.


    For example, static ExecutorService newFixedThreadPool(int nThreads) creates a
    thread pool that reuses a fixed number of threads operating off a shared unbounded
    queue. At most, nThreads threads are actively processing tasks. If additional
    tasks are submitted when all threads are active, they are queued for an available
    thread.


    If any thread terminates due to a failure during execution before the executor
    shuts down, a new thread will take its place when needed to execute subsequent
    tasks. The threads in the pool will exist until the executor is explicitly shut
    down. This method throws IllegalArgumentException when you pass zero or a negative
    value to nThreads.


    > **Note** Thread pools are used to eliminate the overhead from creating a new
    thread for each submitted task. Thread creation isn''t cheap, and having to create
    many threads could severely impact an application''s performance.


