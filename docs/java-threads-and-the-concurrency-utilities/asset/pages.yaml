    # Thread-Local Variables


    You will sometimes want to associate per-thread data (such as a user ID) with
    a thread. Although you can accomplish this task with a local variable, you can
    only do so while the local variable exists. You could use an instance field to
    keep this data around longer, but then you would have to do it with synchronization.
    Frankly, Java supplies the lang.Threadclass as a simple (and very handy) alternative.


    Each ThreadLocal instance describes a thread-local variable, which is a variable
    that provides a separate storage slot to each that accesses the variable. You
    can think of a thread-local variable as a multiset in which each thread can store
    a different value in the same variable. Each thread sees only its value and is
    unaware of other threads having their own value in this variable.


    ThreadLocal is generically declared as ThreadLocal<T>, where T identifies the
    type of value that is stored in the variable. This class declares the following
    constructor and methods:


    +   * ThreadLocal(): Create a new thread-local variable.

    * get(): Return the value in the calling thread''s storage slot. If an entry doesn''t
    exist when the thread calls this method, get() calls initialValue().

    * initialValue(): Create the calling thread''s storage slot and store an initial
    (default) value in this slot. The initial value defaults to null. You must subclass
    ThreadLocal and override this protected method to provide a more suitable initial
    value.

    * void remove(): Remove the calling thread''s storage slot. If this method is
    followed by get() with no intervening set(), get() calls initialValue().

    * void set(T value): Set the value of the calling thread''s storage slot to value.'
