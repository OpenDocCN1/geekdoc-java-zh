  md: '# CHAPTER 1


    # Threads and Runnables


    Java applications execute via threads, which are independent paths of execution
    through an application''s code. When multiple threads are executing, each thread''s
    path can differ from other thread paths. For example, a thread might execute one
    of a switch statement''s cases, and another might execute another of this statement''s
    cases.


    Each application has a default main thread that executes the main() method. The
    application can also create threads to perform time-intensive tasks in the background
    so that it remains responsive to its users. Threads execute code sequences encapsulated
    in objects that are runnables.


    The virtual machine (JVM) gives each thread its own JVM stack to prevent threads
    from interfering with each other. Separate stacks let threads keep track of their
    next instructions to execute, which can differ from thread to thread. The stack
    provides a thread with its own copy of method parameters, local variables, and
    return value.


    Java supports threads primarily through its interface java.lang.Class and java.lang.Runnable
    interface. This chapter introduces you to these types.


    # Introducing Thread and Runnable


    The Thread class provides a consistent interface to the underlying operating system''s
    threading architecture. (The operating system is typically responsible for creating
    and managing threads.) A single operating system thread is associated with a Thread
    object.


    The Runnable interface supplies the code to be executed by the thread that''s
    associated with a Thread object. This code is located in Runnable''s void run()—a
    thread receives no arguments and returns no value, although it might throw an
    exception, which I discuss in Chapter 4.


    # Creating Thread and Runnable Objects


    Except for the default main thread, threads are introduced to applications by
    creating the appropriate Thread and Runnable objects. Thread declares several
    constructors for initializing Thread objects. Several of these constructors require
    a Runnable object as an argument.'
