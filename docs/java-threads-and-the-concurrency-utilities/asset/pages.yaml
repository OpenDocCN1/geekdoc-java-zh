  md: "# Learning About ConcurrentHashMap\n\nThe ConcurrentHashMap class behaves like\
    \ HashMap but has been designed to work in multithreaded contexts without the\
    \ need for explicit synchronization. For example, you often need to check if a\
    \ map contains a specific value, and when this value is absent, you put value\
    \ into the map:\n\n```\nif (!map.containsKey(\"some string-based key\\))\nmap.put(\"\
    some string-based key\", \"some string-based value\");\n```\n\nAlthough this code\
    \ is simple and appears to do the job, it's not thread-safe. Between the call\
    \ to map.containsKey() and map.put(), another thread could insert this entry,\
    \ which would be overwritten. To fix this race condition, you must explicitly\
    \ synchronize this code, which I demonstrate here:\n\n```\nsynchronized(map)\n\
    {\n  if (!map.containsKey(\"some string-based key\\))\n    map.put(\"some string-based\
    \ key\", \"some string-based value\");\n}\n```\n\nThe problem with this approach\
    \ is that you've locked the entire map for read and write operations while checking\
    \ for key existence and adding the entry to the map when the key doesn't exist.\
    \ This locking affects performance when many threads are trying to access the\
    \ map.\n\nThe generic ConcurrentHashMap<K, V> class addresses this problem by\
    \ providing the V putAbsent(K key, V value) method, which introduces a key/value\
    \ entry into the map when key is absent. This method is equivalent to the following\
    \ code fragment but offers better performance:\n\n```\nsynchronized(map)\n{\n\
    \  if (!map.containsKey(key))\n    return map.put(key, value)\n  else\n    return\
    \ map.get(key);\n}\n```\n\nUsing putIfAbsent(), the earlier code fragment translates\
    \ into the following simpler code fragment:\n\n```\nmap.putIfAbsent(\"some string-based\
    \ key\", \"some string-based value\");\n```"
