  md: '# CHAPTER 4


    # Additional Thread Capabilities


    Chapters 1 through 3 introduced you to the java.lang.Thread class and java.lang.Runnable
    interface, to synchronization, and to notification. In this chapter, I complete
    my coverage of thread basics by introducing you to groups and thread-local variables.
    Also, I present the Timer Framework, which leverages Thread behind the scenes
    to simplify timer-oriented tasks.


    # Thread Groups


    While exploring the Thread class, you''ve probably encountered references to the
    java.lang.ThreadGroup class in constructors such as Thread(ThreadGroup target),
    and in methods such as int activeCount() and static int enumerate(Thread[])


    The JDK documentation for Thread states that a thread group represents a set of
    threads. In addition, a thread group can also include other thread groups. The
    thread groups form a tree in which every thread except the initial thread group
    has a parent.


    Using a ThreadGroup, you can perform an operation on all contained Thread objects.
    For example, suspending a thread referenced by variable tg, suspend(); suspends
    all of the threads in the thread group. Thread groups simplify the management
    of many threads.


    Although ThreadGroup appears to be a very useful, you should largely avoid this
    class for the following reasons:


    +   - The most useful ThreadGroup methods are void suspend(), void resume(), and
    void stop(). These methods have been deprecated because, like their Thread counterparts
    (to which these methods delegate for each thread in the thread group), they are
    prone to deadlock and other problems.'
