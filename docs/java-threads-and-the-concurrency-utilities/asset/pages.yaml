  md: 'The Locking Framework includes the often-used Lock, ReentrantLock, Condition,
    ReadWriteLock, and ReentrantReadWriteLock types, which I explore in this chapter.
    I also briefly introduce you to the StampedLock class, which was introduced by
    Java 8.


    # Lock


    The Lock interface offers more expressive locking operations than can be obtained
    via the locks associated with monitors. For example, you can immediately back
    out of a lock-acquisition attempt when a lock is unavailable. This interface declares
    the following methods:


    +   - void lock(): Acquire the lock. When the lock''s unavailable, the calling
    thread is forced to wait until it becomes available.

    - void lockInterruptibly(): Acquire the lock unless the calling thread is interrupted.
    When the lock''s unavailable, the calling thread is forced to wait until it becomes
    available or the thread is interrupted, which results in this method throwing
    java.lang.InterruptedException.

    - Condition newCondition(): Return a new Condition instance that''s bound to this
    Lock instance. This method throws java.lang.UnsupportedOperationException when
    the Lock class does not support controls.

    - boolean tryLock(): Acquire the lock when it''s available at the time this method
    is invoked. The method returns true when the lock is acquired and false when the
    lock isn''t acquired.

    - boolean tryLock(long time, TimeUnit unit): Acquire the lock when it''s available
    within the waiting time, measured in unit java.util.concurrent.TimeUnit units
    (seconds, milliseconds, and so on), and the calling thread isn''t interrupted.
    When the lock isn''t available, the calling thread is forced to wait until it
    becomes available within the waiting time or is interrupted, which results in
    this method returning true or false.

    - void unlock(): Release the lock.


    Acquired locks must be released. In the context of synchronized blocks and the
    implicit monitor lock associated with every object, lock acquisition and release
    occurs in a block-structured manner. When multiple locks are acquired, they are
    released in the opposite order and all locks are released in the same lexical
    scope in which they were acquired.


    Lock acquisition and release in the context of Lock implementations can be more
    flexible. For example, some algorithms for traversing concurrently accessed data
    structures require the use of "hand-over-hand" or "chain locking": you acquire
    the lock of node A, then node B, then release A and acquire C, then release B
    and acquire D, and so'
