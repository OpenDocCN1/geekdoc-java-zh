  md: "# Phasers\n\nA phaser is a more flexible cyclic barrier. Like a cyclic barrier,\
    \ a phaser lets a group of threads wait on a barrier; these threads continue after\
    \ the last thread arrives. A phaser also offers the equivalent of a barrier action.\
    \ Unlike a cyclic barrier, which coordinates a fixed number of threads, a phaser\
    \ can coordinate a variable number of threads, which can register at any time.\
    \ To implement this capability, a phaser uses phases and phase numbers.\n\nA phase\
    \ is the phaser's current state, and this state is identified by an integer-based\
    \ phase number. When the last of the registered threads arrives at the phaser\
    \ barrier, a phaser advances to the next phase and increments its phase number\
    \ by 1.\n\nThe java.util.concurrent.Phaser class implements a phaser. Because\
    \ this class is thoroughly described in its Javadoc, I'll point out only a few\
    \ constructor and methods:\n\n+   - Phaser(int threads) constructor creates a\
    \ phaser that initially coordinates threads (which have yet to arrive at the phaser\
    \ barrier) and whose phase number is initially set to 0.\n- The register() method\
    \ adds a new unarrived thread to the phaser and returns the phase number to classify\
    \ the arrival. This number is known as the *arrival phase number*.\n- The arriveAndAwaitAdvance()\
    \ method records arrival and waits for the phaser to advance (which happens after\
    \ the other threads have arrived). It returns the phase number of which the arrival\
    \ applies.\n- The arriveAndDeregister() method arrives at this phaser and deregisters\
    \ from it waiting for others to arrive, reducing the number of threads required\
    \ to advance in future phases.\n\nListing 6-5 provides a demonstration of the\
    \ phaser synchronizer. It's based on the first example in Phaser's Javadoc.\n\n\
