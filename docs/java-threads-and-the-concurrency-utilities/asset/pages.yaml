    # Timer Framework


    It''s often necessary to schedule a task (a unit of work) for one-shot execution
    (the task runs only once) or for repeated execution at regular intervals. For
    example, you might schedule an alarm clock task to run only once (perhaps to wake
    you up in the morning) or schedule a nightly backup task to run at regular intervals.
    With either kind of task, you might want the task to run at a specific time in
    the future or after an initial delay.


    You can use Thread and related types to build a framework that accomplishes task
    scheduling. However, Java 1.3 introduced a more convenient and simpler scheduler
    in the form of the java.util.Timer and java.util.TimerTask classes.


    Timer lets you schedule Tasks for execution (in a sequential manner) on a background
    thread, which is known as the task-execution thread. Timer tasks may be scheduled
    for one-shot execution or for repeated execution at regular intervals.


    Listing 4-5 presents an application that demonstrates one-shot execution of a
    timer task.'
