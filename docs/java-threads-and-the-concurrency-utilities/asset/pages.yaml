    }\n```\n\nListing 2-5 presents an immutable Planets class whose objects store\
    \ set of planet names. Although the set is mutable, the design of this class prevents\
    \ the set from being modified after the constructor exits. By declaring Planets\
    \ final, the reference stored in this field cannot be modified. Furthermore, this\
    \ reference will not be cached so the cached variable goes away.\n\nJava provides\
