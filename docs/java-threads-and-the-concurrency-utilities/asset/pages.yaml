  md: "# CHAPTER 2 SYNCHRONIZATION\n\nAlthough the previous example clearly identifies\
    \ a deadlock state, it's often not that to detect deadlock. For example, your\
    \ code might contain the following circular relationship among various classes\
    \ (in several source files):\n\n+   - Class A's synchronized method calls class\
    \ B's synchronized method.\n\n+   - Class B's synchronized method calls class\
    \ C's synchronized method.\n\n+   - Class C's synchronized method calls class\
    \ A's synchronized method.\n\nIf thread A calls class A's synchronized method\
    \ and thread B calls class C's synchronized method, thread B will block when it\
    \ attempts to call class A's synchronized method and thread A is still inside\
    \ of that method. Thread A will continue to execute until it calls class C's synchronized\
    \ method, then deadlock is the result.\n\n> Note Neither the Java language nor\
    \ the JVM provides a way to prevent deadlock, and so the burden falls on you.\
    \ The simplest way to prevent deadlock is to avoid either a synchronized method\
    \ or a synchronized block call another synchronized method/block. Although this\
    \ advice prevents deadlock from happening, it's impractical because one of your\
    \ synchronized methods/blocks might need to call a synchronized method in a Java\
    \ API, and the advice is overkill because the synchronized method/block being\
    \ might not call any other synchronized method/block, so deadlock would not occur.\n\
    \n# Volatile and Final Variables\n\nYou previously learned that synchronization\
    \ exhibits two properties: mutual exclusion and visibility. The synchronized keyword\
    \ is associated with both properties. Java also provides a weaker form of synchronization\
    \ involving visibility only, and associates only this property with the volatile\
    \ keyword.\n\nSuppose you design your own mechanism for stopping a thread (because\
    \ you use Thread's unsafe stop() methods for this task). Listing 2-2 presents\
    \ the source code to a ThreadStopping shows how you might accomplish this task.\n\
    \nListing 2-2. Attempting to Stop a Thread\n\n```\npublic class ThreadStopping\
    \ {\n    public static void main(String[] args) {\n        class StoppableThread\
    \ extends Thread {\n            private boolean stopped; // defaults to false\n\
    \        }\n    }\n```"
