    When an exception is thrown out of the run() method, the thread terminates and
    the following activities take place:


    +   - The virtual machine (JVM) looks for an instance of Thread.UncaughtExceptionHandler
    installed via Thread''s void uncaughtExceptionHandler(Thread, Throwable) method.
    If this handler is found, it passes the exception to the instance''s void uncaughtException(Thread
    t, Throwable e) method where t identifies the Thread object of the thread that
    throws the exception, and e identifies the exception or OutMemoryError object
    was thrown. If uncaughtExceptionHandler() throws an exception/error, the exception/error
    is ignored by the JVM.

    - Assuming uncaughtExceptionHandler was not called to install a handler, the JVM
    passes control to the associated ThreadGroup object''s uncaughtException(Thread,
    Throwable) method. Assuming that ThreadGroup was not extended and that its uncaughtException()
    method was not overridden to handle the exception, uncaughtException() method
    passes control to the parent ThreadGroup object''s uncaughtExceptionHandler method
    when a parent ThreadGroup is present. Otherwise, it checks if a default uncaught
    exception handler has been installed (via Thread''s void setDefaultUncaughtExceptionHandler(UncaughtExceptionHandler)
    method). If a default uncaught exception handler has been installed, uncaughtException()
    method is called with the same arguments. Otherwise, uncaughtException() checks
    its Throwable argument to determine if it''s an instance of java.lang.ThreadDeath.
    So, Listing 4-1''s exception message shows, a message containing the thread''s
    name, as returned from the thread''s getName() method, and a stack trace, using
    the Throwable argument''s printStackTrace() method, is printed to the standard
    error stream.'
