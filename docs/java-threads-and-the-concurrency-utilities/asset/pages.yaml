    # # Summary


    This chapter completed my tour of the concurrency utilities by introducing concurrent
    collections, atomic variables, the Fork/Join Framework, and completion services.


    A concurrent collection is a concurrency performant and highly-scalable collectionsoriented
    type that is stored in the Java.util.concurrent package. It overcomes the ConcurrentModificationException
    and performance problems of thread-safe collections.


    An atomic variable is an instance of a class that encapsulates a single variable
    and supports lock-free, thread-safe operations on that variable, for example,
    AtomicInteger.


    The Fork/Join Framework consists of a special executor service and thread pool.
    The executor service makes a task available to the framework, and this task is
    broken down into smaller tasks that are forked (executed by different threads)
    from the Pool. A task waits until it''s joined (its subtasks).


    A completion service is an implementation of the CompletionService<V> interface
    that decouples the production of new asynchronous tasks (a producer) from the
    consumption of the results of completed tasks (a consumer). V is the type of a
    task result.


    Appendix A presents the answers to each chapter’s exercises.'
