  md: '# Summary


    The java.util.concurrent.locks package provides a framework of interfaces and
    classes for locking and waiting for conditions in a manner that is distinct from
    an object''s intrinsic lock-based synchronization and Object''s wait/notification
    mechanism. The concurrency utilities include a locking framework that improves
    on intrinsic synchronization and wait/notification by offering lock polling, timed
    waits, and more.


    The Locking Framework includes the often-used Lock, ReentrantLock, Condition,
    ReadWriteLock, and ReentrantReadWriteLock types, which I explored in this chapter.
    I also briefly introduced you to the StampedLock class, which was introduced in
    Java 8.


