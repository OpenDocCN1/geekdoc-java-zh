  md: "# CHAPTER 2 SYNCHRONIZATION\n\nYou've correctly synchronized access to stopped,\
    \ take a closer look at the synchronized block in the run() method. Notice the\
    \ while loop is unending because the thread executing the loop has acquired the\
    \ lock to the current StoppableThread object (via synchronized(this)), and any\
    \ attempt by the default main thread to call stopThread() on this object will\
    \ cause the default main thread to block because the default main thread needs\
    \ to acquire the lock.\n\nYou can overcome this problem by using a local variable\
    \ and assigning stopped's value to a variable in a synchronized block, as follows:\n\
    \n```\nvoid run() {\n    boolean stopped = false;\n    while (!stopped) {\n  \
    \      synchronized(this) {\n            _stopped = stopped;\n        }\n    \
    \    System.out.println(\"running\");\n    }\n}\n```\n\nHowever, this solution\
    \ is messy and wasteful because there is a performance cost (which is not as great\
    \ as it used to be) when attempting to acquire the lock, and this task is being\
