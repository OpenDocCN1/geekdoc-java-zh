  md: "# CHAPTER 1 THREADS RUNNABLES\n\nBy default, the threads associated with Thread\
    \ objects are nondemon threads. To create a daemon thread, you must call Thread's\
    \ void setDaemon(boolean isDaemon) method, passing true to isDaemon. This task\
    \ is demonstrated here:\n\n```\nThread t = new Thread(r);\nt.setDaemon(true);\n\
    ```\n\n> Note An application will not terminate when the nondemon default main\
    \ thread terminates until all background nondemon threads terminate. If the background\
    \ threads are daemon threads, the application will terminate as soon as the default\
    \ main thread terminates.\n\n# Starting a Thread\n\nAfter creating a Thread or\
    \ Thread subclass object, you start the thread associated with this object by\
    \ calling Thread's void start() method. This method throws java.lang.IllegalThreadStateException\
    \ when the thread was previously started and is running or when the thread has\
    \ died:\n\n```\nThread t = new Thread(r);\nt.start();\n```\n\nCalling start()\
    \ results in the runtime creating the underlying thread and scheduling it for\
    \ subsequent execution in the runnable's run() method is invoked. (start()) doesn't\
    \ wait for these tasks to be completed before it returns.) When execution leaves\
    \ run(), the thread is destroyed and the Thread object on start() was called is\
    \ no longer viable, which is why calling start() results in IllegalThreadStateException.\n\
    \nI've created an application that demonstrates various fundamentals from thread\
    \ and runnable creation. Check out Listing 1-1.\n\n+   Listing 1-1. Demonstrating\
    \ Thread Fundamentals\n\n```\npublic class ThreadDemo\n{\n    public static void\
    \ main(String[] args)\n    {\n        boolean isDaemon = args.length != 0;\n \
    \       Runnable r = new Runnable()(\n        {\n            @Override\n     \
    \       public void run()\n            {\n                Thread th = Thread.currentThread();\n\
    \                while (true)\n            }\n        });n    }\n}\n```"
