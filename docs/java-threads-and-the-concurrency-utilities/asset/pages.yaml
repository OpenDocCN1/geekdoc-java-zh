  md: '# CHAPTER 1 THREADS AND RUNNABLES


    Thread supports priority via its getPriority() method, which returns the current
    priority, and void setPriority(int priority) method, which sets the priority to.
    The value set to priority ranges from Thread.MIN_PRIORITY to Thread.Thread.NORMAL_PRIORITY
    identifies the default priority. Consider the following code fragment:


    ```

    Thread t = new Thread(r);

    System.out.println(t.getPriority());

    t.setPriority(Thread.MIN_PRIORITY);

    ```


    **Caution** using setPriority() can impact an application’s portability across
    operating systems because different schedulers can handle a priority change in
    different ways. For example, one operating system’s scheduler might delay lower
    priority threads from executing until higher priority threads finish. This delaying
    can lead to indefinite postponement or starvation because lower priority threads
    "starve" while waiting indefinitely for their turn to execute, and this can seriously
    hurt the application’s performance. Another operating system’s scheduler might
    not indefinitely delay lower priority threads, improving application performance.


    # Getting and Setting a Thread''s Daemon Status


    Java lets threads as daemon threads or nondaemon threads. A daemon thread is a
    thread that acts as a helper to a nondaemon thread and dies automatically when
    the application’s last nondaemon thread dies so the application can terminate.

    You can determine if a thread is daemon or nondaemon by calling Thread’s boolean
    isDaemon() method, which returns true for a daemon thread:


    ```

    Thread t = new Thread(r);

    System.out.println(t.isDaemon()); // Output: false

    ```'
