  md: '# Introduction


    Threads and the concurrency utilities are not sexy subjects, but they are an important
    part of non-trivial applications. This book introduces you to most of Java’s features
    and concurrency utilities as of Java 8 update 60.


    Chapter 1 introduces you to the Thread class and the Runnable interface. You learn
    how to create Thread and Runnable objects, get set state, start a thread, interrupt
    a thread, join a thread to another thread, and cause a thread to sleep.


    Chapter 2 focuses on synchronization. You learn about problems such as race conditions
    that cannot be solved without synchronization. You also learn how to create synchronized
    methods and blocks, and how to use a light version of synchronization that ignores
    mutual exclusion.


    Chapter 3 explores the important topics of waiting and notification. I review
    a small API in the Object class that supports these concepts, and then demonstrate
    this via a producer/consumer application where one thread produces that another
    consumes.


    Chapter 4 presents three concepts that were not covered in the previous chapters.
    First, you learn about thread-local variables, which are not as useful as you
    think. Finally, you learn about the Timer Framework, which simplifies for time
    tasks.


    The previous four chapters covered low-level threading. Chapter 5 switches to
    a higher level by introducing the concurrency utilities, which can simplify the
    development of multithreaded applications and improve performance. This chapter
    then explores executors using callables and futures.


    Chapter 6 focuses on synchronizers (high-level synchronization constructs). You
    learn about latches (one or more threads wait at a "gate" until another thread
    opens this gate, at which these other threads can continue), cyclic barriers,
    semaphores, and phosphates.


    Chapter 7 explores the Locking Framework, which provides interfaces and classes
    for waiting and locking for conditions that distinct from an object''s intrinsic
    lock-based synchronization and Object''s wait/notification mechanism. It offers
    improvements like lock polling.


    Finally, Chapter 8 presents additional concurrency utilities that were not covered
    in Chapters 5 through 7. Specifically, it introduces you to concurrent collections,
    atomic variables, the Fork/Join Framework, and completion services.


    Each chapter ends with assorted exercises that are designed to help you master
    the content. Along with long answers and true/false questions, you are often confronted
    with programming exercises. Appendix A provides the answers and solutions.'
