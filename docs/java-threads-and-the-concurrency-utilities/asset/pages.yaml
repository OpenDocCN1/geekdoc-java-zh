  md: '# CHAPTER 3


    # Waiting and Notification


    Java provides a small API that supports communication between threads. Using this
    API, one thread waits for a condition (a prerequisite for continued execution)
    to exist. In the future, another thread will create the condition and notify the
    waiting thread. In this chapter, 1 introduce you to this API.


    # Wait-and-Notify API Tour


    The java.Lang.Object class provides a Wait-and-Notify API that consists of three
    wait() methods, one notify() method, and one notifyAll() method. The wait() methods
    wait for a condition to exist; the notify() and notifyAll() methods when the condition
    exists:


    +   - wait(): Cause the current thread to wait until another thread invokes notify()
    or notifyAll() method for this object, or for some other thread to interrupt the
    current thread while waiting.

    - wait(long timeout): Cause the current thread to wait until another thread invokes
    notify() or notifyAll() method for this object, or for the specified amount of
    time measured in milliseconds (identified by timeout) to pass, or for some other
    thread to interrupt the current thread while waiting. This method throws java.IllegalArgumentException
    when timeout is negative.

    - wait(long timeout, int nanos): Cause the current thread to wait until another
    thread invokes notify() or notifyAll() method for this object, or for the specified
    amount of time measured in milliseconds (identified by nanos) to pass, or for
    some other thread to interrupt the current thread while waiting. This method throws
    IllegalArgumentException when timeout is negative, nanos is negative, or nanos
    is greater than 9999999.


