    # Timer-Based Slide Show


    A slide show is a presentation of still images on a projection screen, typically
    in a prearranged sequence. Each image is usually displayed for at least a few
    seconds before being replaced by the next image.


    A slide show involves a projector, a screen, and slides. The projector carries
    slides to be projected, the screen displays a projected slide image, and a slide
    contains an image and other attributes (such as a textual title).


