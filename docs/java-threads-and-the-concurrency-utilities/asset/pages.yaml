    # Condition


    The interface factors out Object''s wait and notification methods (wait(), notifyAll())
    into distinct condition objects to give the effect of having multiple wait-sets
    per object, by combining them with the use of arbitrary Lock implementations.
    Where Lock replaces synchronized methods and blocks, Condition replaces Object''s
    wait/notification methods.


    > A condition is intrinsically bound to a lock. To obtain a Condition for a Lock
    instance, use Lock''s newCondition() method.


    Condition declares the following methods:


    +   - await(): Force the calling thread to wait until it''s signaled or interrupted.

    - boolean await(long time, TimeUnit unit): Force the calling thread to wait until
    it''s signaled or interrupted, or until the specified waiting time lapses.

    - long awaitNanos(long nanoTimeout): Force the current thread to wait until it''s
    signaled or interrupted, or until the specified waiting time lapses.

    - void awaitInterruptibly(): Force the current thread to wait until it''s signaled.

    - boolean awaitUntil(Date deadline): Force the current thread to wait until it''s
    signaled or interrupted, or until the specified deadline expires.

    - void signal(): Wake up one thread.

    - void signalAll(): Wake up all threads.


    Listing 7-2 revisits Chapter 3''s producer-consumer application (in Listing 3-2)
    to show how it can be written to take advantage of conditions.


