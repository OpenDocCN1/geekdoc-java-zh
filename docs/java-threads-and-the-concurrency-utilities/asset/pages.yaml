  md: '# APPENDIX B


    # Threading in Swing


    Swing is a platform-independent, Model-View-Controller-based GUI toolkit for creating
    the graphical frontends of Java applications. In this appendix, I explore Swing''s
    threading architecture and then explore Swing APIs for avoiding problems when
    additional threads are used in graphical contexts. Finally, I present a Swing-based
    slide application as a significant example of this appendix''s content and as
    a fun way to end this book.


    > **Note** I''ll assume that you have some experience with Swing APIs along with
    the architecture of a Swing application.


    # A Single-Threaded Programming Model


    Swing follows a single-threaded programming model. It''s designed to be single-threaded
    instead of multithreaded graphical toolkits have shown that they inevitably lead
    to deadlock and race conditions. To learn more about these problems, check out
    the "Why are Swing Single-threaded?" blog post http://code1.com/java/java-concurrency/GUI-Applications/why-are-Single-threaded/


    The thread that use to render graphics and handle events is known as the event-dispatch
    thread (EDT). The EDT processes events that originate from the underlying Abstract
    Window Toolkit''s queue and invokes GUI component (such as button) event listeners,
    which handle events on this thread. Components redraw themselves (in response
    to paint) method calls that result in paintComponent(), paintBorder(), and paintChildren()
    method calls) on the EDT.


    Be careful about how your code interacts with the EDT to ensure that your Swing
    applications work correctly. There are two rules to remember:


    +   - Always create Swing GUIs on the EDT.


    +   - Never delay the EDT.'
