    \ SwingWorker\n\nSwingWorker provides the javax.swing.SwingWorker class to accommodate\
    \ long-running tasks\n(such as reading URL content) with reduced verbosity. You\
    \ must subclass this abstract\nclass and override one or more methods to accomplish\
    \ useful work.\n\nSwingWorker's generic type is SwingWorker<T, V>. Parameters\
    \ T and V identify the\nfinal and intermediate result types, respectively.\nYou\
    \ override the protected T doInBackground() method to execute a\n-running task\
    \ on a worker thread and return a result of T (Void is the return type\n there\
    \ is no result). When this method finishes, the protected done() method\nis invoked\
    \ on the EDT. By default, this does nothing. However, you can override\ndone()\
    \ to update the GUI.\nWhile the task is running, you can periodically publish\
    \ results to the EDT by invoking\nthe protected void process(List<V> chunks) method\
    \ whose code runs on the\nEDT. If there are no intermediate results to process,\
    \ you can specify Void for V (and avoid\nusing the publish() and process() methods).\n\
    \nSwingWorker provides two more methods that you need to know about. First, void\n\
    execute() schedules the invoking SwingWorker object for execution on a worker\
    \ thread.\nSecond, get() waits if necessary for doInBackground() to complete and\
    \ then returns\nt final result.\n\n> **Note** SwingWorker's get() method throws\
    \ an instance of the java.util.concurrent.\nExecutionException when an exception\
