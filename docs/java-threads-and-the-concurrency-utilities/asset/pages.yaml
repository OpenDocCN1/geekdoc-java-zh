    \ to acquire each letter.\n\nThe writable instance field tracks two conditions:\
    \ the producer waiting on the consumer to consume a item and the consumer waiting\
    \ on the producer to produce a new item. It helps coordinate execution of the\
    \ producer and consumer. The following scenario, when the consumer executes first,\
    \ illustrates this coordination:\n\n+   1. The consumer executes s.getSharedChar()\
    \ to retrieve a letter.\n2. Inside of synchronized method, the consumer calls\
    \ wait() because writable contains true. The consumer now waits until it receives\
    \ notification from the producer.\n3. The producer executes s.setSharedChar(ch);\n\
    4. When the producer enters synchronized method(which is possible because the\
    \ consumer released the lock inside of wait() method prior to waiting), the producer\
    \ discovers writable's value to be true and doesn't call wait().\n5. The producer\
    \ saves the character, sets writable to false (which will cause the producer to\
    \ wait on the next setSharedChar() call when the consumer has not consumed the\
    \ character by that time), and calls notify() to awaken the consumer (assuming\
    \ the consumer is waiting).\n6. The producer exits setSharedChar(char c).\n7.\
    \ The consumer wakes up (and acquires the lock), sets writable to true (which\
    \ will cause the consumer to wait on the next getSharedChar() call when the producer\
    \ has not produced a character by that time), notifies the producer to awaken\
    \ that thread (assuming the producer is waiting), and returns the shared character."
