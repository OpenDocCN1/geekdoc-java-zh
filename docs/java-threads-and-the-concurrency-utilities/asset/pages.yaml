- img_proc: true
  md: "The code fragment is an example of a common type of race condition that’s known\
    \ as check-then-act, in which a potentially stale observation is used to decide\
    \ on what to do next. In the previous code fragment, the “check” is performed\
    \ by if (a == 10.0) and the “act” is performed by b = a / 2.0.\n\nAnother type\
    \ of race condition is read-modify-write, in which new state is derived from previous\
    \ state. The previous state is read, modified, and finally updated to reflect\
    \ the result via three indivisible operations. However, the combination of these\
    \ operations is not indivisible.\n\nA common example of read-modify-write involves\
    \ a variable that’s incremented to generate a unique numeric identifier. For example,\
    \ in the following code fragment, suppose that counter is an instance of type\
    \ int (initialized to 1) and that two threads simultaneously access this code:\n\
    \n```\npublic int getID()\n  return counter++;\n```\n\nAlthough it might look\
    \ like a single operation, expression counter++ is actually three separate operations:\
    \ read counter value, add 1 to this value, and store the updated value in counter.\
    \ The read value becomes the value of the expression.\n\nSuppose thread 1 calls\
    \ getID() and reads counter’s value, which happens to be 1, before it’s suspended\
    \ by the scheduler. Now suppose thread 2 runs, calls getID(), reads counter’s\
    \ value (1), adds 1 to this value, stores the result (2) in counter, and returns\
    \ 1 to the caller.\n\nAt this point, assume that thread 2 resumes, adds 1 to the\
    \ previous value (1), stores the result (2) in counter, and returns 1 to the caller.\
    \ Because thread 2 undoes thread 2, we have lost an increment and a non-unique\
    \ ID has been generated.\n\n# Data Races\n\nA condition is often confused with\
    \ a data race in which two or more threads (in a single application) access the\
    \ same memory location concurrently, at least one of the accesses is for writing,\
    \ and these threads don’t coordinate their accesses to that memory. When these\
    \ conditions hold, access order is non-deterministic. Different results may be\
    \ generated from run to run, depending on that order. Consider the following example:\n\
    \n```\nprivate static Parser parser;\n\npublic static Parser getInstance()\n{\n\
    \  if (parser == null)\n    parser = new Parser();\n  return parser;\n}\n```"
