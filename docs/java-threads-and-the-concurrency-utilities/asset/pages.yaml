  md: "# CHAPTER 2\n\n# Synchronization\n\nDeveloping multithreaded applications is\
    \ is much easier when threads don’t interact, typically via shared variables.\
    \ When interaction occurs, various problems can arise that make an application\
    \ thread-unsafe (incorrect in a multithreaded context). In this chapter, you’ll\
    \ learn about these problems and also learn how to overcome them through the correct\
    \ use of Java’s synchronization-oriented language features.\n\n# The Problems\
    \ with Threads\n\nJava’s support for threads facilitates the development of responsive\
    \ and scalable applications. However, this support comes at the price of increased\
    \ complexity. Without care, your code can become riddled with hard-to-find bugs\
    \ related to race conditions, data races, and cached variables.\n\n# Race Conditions\n\
    \nA race condition occurs when the correctness of a computation depends on the\
    \ relative timing or interleaving of multiple threads by the scheduler. Consider\
    \ the following code fragment, which performs a computation as long as a certain\
    \ precondition holds:\n\n```\nif (a == 10.0)\n b = a / 2.0;\n```\n\nThere is no\
    \ problem with this code fragment in a single-threaded context, and there is no\
    \ problem in a multithreaded context when a and b are local variables. However,\
    \ assume that a and b identify instance or class (static) field variables and\
    \ that two threads simultaneously access this code.\n\nSuppose that one executed\
    \ if (a == 10.0) and is about to execute b = a / 2.0 when suspended by the scheduler,\
    \ which resumes another thread changes a. Variable b will not equal 5.0 when the\
    \ former thread resumes its execution. (If a and b were local variables, this\
    \ race condition would not occur because each thread would have its own copy of\
    \ these local variables.)"
