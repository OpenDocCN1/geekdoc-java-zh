  md: 'CyclicBarrier also offers the following methods:


    +   - int await():Force the calling thread to wait until all parties have invoked
    await() on this cyclic barrier. The calling thread will also stop waiting when
    it or another waiting thread is interrupted, another thread times out while waiting,
    or another invokes reset() on this cyclic barrier. If the calling thread has interrupted
    status on entry or is interrupted while waiting, this method throws InterruptedException
    and the calling thread''s interrupted status is cleared. The method throws java.util.concurrent.BrokenBarrierException
    when the barrier is reset via (reset()) while any thread is waiting, or the barrier
    is broken when await() is invoked or any thread is waiting. Any thread is interrupted
    while waiting, all other threads throw BrokenBarrierException and the barrier
    is placed in the broken state. If the calling thread is the last thread to arrive
    and a non-null barrierAction was supplied in the constructor, the calling thread
    executes this runnable allowing the other threads to continue. This method returns
    the arrival index of the calling thread, where getParties()-1 indicates the first
    thread to arrive and zero indicates the last thread to arrive.

    - await(long timeout, TimeUnit unit): This method is equivalent to the previous
    method that lets you specify how long the calling thread is waiting to wait. This
    method throws java.util.concurrent.Timeoutexception when this timeout expires
    the thread is waiting.

    - getNumberWaiting(): Return the number of parties that are currently waiting
    at the barrier. This method is useful for debugging and partnership with assertions.

    - getParties(): Return the number of parties that are required to trip the barrier.

    - boolean isBroken(): Return true when one or more parties broke out of this because
    because interruption or timeout since the cyclic barrier was constructed or the
    last reset, or when a barrier action failed of an exception; otherwise, return
    false.

    - void reset(): Reset the barrier to its initial state. If any parties are currently
    waiting at the barrier, they will return with a BrokenBarrierException. Note that
    resets for a breakage occurred for other reasons can be complicated to carry out;
    threads need to resynchronize in some other way and choose one to perform the
    rest. Therefore, it might be preferable to create a new barrier for subsequent
    use.


    Cyclic barriers are useful in parallel decomposition scenarios, where a lengthy
    task is divided into subtasks whose individual results are merged into the overall
    result of the task. CyclicBarrier''s Javadoc presents example code that''s completed
    in Listing 6-2.'
