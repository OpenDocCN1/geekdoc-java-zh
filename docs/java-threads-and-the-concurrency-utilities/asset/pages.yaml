  md: "# CHAPTER 3 WAITING AND NOTIFICATION\n\n+   - notify(): If any threads are\
    \ waiting on this object's monitor, one of them is chosen to be awakened. The\
    \ choice is arbitrary and occurs at the discretion of the implementation. The\
    \ awakened thread will not be able to proceed until the current thread relinquishes\
    \ the lock on this object. The awakened thread will compete in the usual manner\
    \ with any other threads that might be actively competing to synchronize on this\
    \ object; for, the awakened thread enjoys no privilege or disadvantage in the\
    \ next thread to lock this object.\n\n+   - notifyAll(): Wake up all threads that\
    \ are waiting on this object's monitor. The awakened threads will not be able\
    \ to proceed until the current thread relinquishes the lock on this object. The\
    \ awakened threads will compete in the usual manner with any other threads that\
    \ might be actively competing to synchronize on this object; for, the awakened\
    \ threads enjoy no privilege or disadvantage in the next thread to lock this object.\n\
    \nThe wait() methods throw java.lang.InterruptedException when any interrupted\
    \ thread before or while the current thread was waiting for a notification. The\
    \ interrupted status of the current thread is cleared when this is thrown.\n\n\
    > A thread releases ownership of the monitor associated with the object wait()\
    \ method is called.\n\nThis API leverages an object's condition queue, which is\
    \ a data structure that stores threads waiting for a condition to exist. The waiting\
    \ threads are known as the wait set. Because the condition queue is tightly bound\
    \ to an object's lock, all five methods must be called from a synchronized context\
    \ (the current thread must be the owner of the object's monitor); otherwise, java.lang.IllegalMonitorStateException\
    \ is thrown.\n\nThe following code/pseudocode fragment demonstrates the noargument\
    \ wait()\n\n```\nsynchronized(obj) {\n    while (<condition does not hold>) {\n\
    \        obj.wait();\n    }\n    // Perform an action that's appropriate to condition.\n\
    }\n```\n\n40"
