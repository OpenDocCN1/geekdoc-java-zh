    Listing 8-7 presents a MatMult class that extends RecursiveAction. To accomplish
    meaningful work, RecursiveAction''s compute() method is overridden.


    > Note compute() is normally used to subdivide a task into tasks recursively,
    I have chosen to handle the multiplication somewhat differently (for brevity and
    simplicity).


    After creating Matrixes a and b, Listing 8-7''s main() method creates Matrix c
    and instantiates ForkJoinPool. Then MatMult instantiates these three instances
    as arguments to the MatMult(Matrix a, Matrix b, Matrix c) constructor, and calls
    ForkJoinPool''s invoke(ForkJoinTask<T> task) to start running this initial task.
    This method does not return the initial task and all of its subtasks.


    The MatMult(Matrix a, Matrix b, Matrix c) constructor invokes the MatMult(Matrix
    a, Matrix b, Matrix c, int row) constructor, specifying -1 as row''s value. This
    value is used by compute(), which is invoked as a result of the aforementioned
    invoke() method, to distinguish between the initial task and subtasks.


    When compute() is initially called (row equals -1), it creates a List of MatMult
    tasks and passes this List to RecursiveAction''s Collection<T> invokeAll(Collection<T>
    tasks) method (inherited from ForkJoinTask). This method forks all of List tasks,
    which will start to execute. It waits until the invokeAll() method (which also
    joins all of these tasks), happens, which when the boolean isDone() method (also
    inherited from ForkJoinTask) returns true for each task.


    Notice the tasks.add(new MatMult(a, b, c, row)); method call. This call assigns
    a specific value to a MatMult instance. When invokeAll() is called, each task''s
    compute() method is called and detects a different value (other than -1) assigned
    to row. It then executes multiplyRowByColumn(a, b, c, row); for its specific row.'
