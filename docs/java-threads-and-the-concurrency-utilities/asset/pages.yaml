  md: "# CHAPTER 3 WAITING AND NOTIFICATION\n\nThe wait() method is called from within\
    \ a synchronized block that synchronizes the same object as the object on wait()\
    \ is called (obj). Because of the possibility of spurious wakeups (a thread wakes\
    \ up without being notified, interrupted, or timing out), wait() is called within\
    \ a while loop that tests for the condition holding and reexec wait() when the\
    \ condition still doesn't hold. While the while loop exits, the condition exists\
    \ and an action appropriate to the condition can be performed.\n\n> Caution Never\
    \ call a wait() method outside of a loop. The loop tests the condition before\
    \ and after the wait() call. Testing the condition before calling wait() ensures\
    \ liveness. If this test was not present, and if the condition and notify() had\
    \ been called prior to wait() being called, it's unlikely that the waiting would\
    \ ever wake up. Retesting the condition after calling wait() ensures safety. If\
    \ testing didn't occur, or if the condition didn't hold after the thread had awakened\
    \ from the wait() call (perhaps another thread call notify() accidentally when\
    \ the condition didn't hold), the thread would proceed to destroy the lock's invariants.\n\
    \nThe following code fragment demonstrates the notify() method, which notifies\
    \ the waiting thread in the previous example:\n\n```\nsynchronized(obj)\n{\n \
    \ // Set the condition.\n\n  obj.notify();\n}\n```\n\nNotice that notify() is\
    \ called from a critical section guarded by the same object (obj) as the critical\
    \ section for the wait() method. Also, notify() is called using the same object\
    \ reference. Follow this pattern and you shouldn't get into trouble.\n\n> Note\
    \ There has been much discussion about which notify method is better: notify()\
    \ or notifyAll(). For example, check out \"Difference between notify() and notifyAll()\"\
    \ (http://stackoverflow.com/questions/14924610/difference-between-notify-and-notifyall).\
    \ If you're wondering which method to use, I would use notify() in an application\
    \ where there are only two threads, and either thread occasionally waits and needs\
