    # Summary


    Java provides an API that supports communication between threads. This API consists
    of Object''s three wait() methods, one notify() method, and one notifyAll() method.
    The wait() methods wait for a condition to exist; notify() and notifyAll() notify
    waiting threads when the condition exists.


    The wait(), notify(), and notifyAll() methods are called from within a synchronized
    block that synchronizes on the same object on which they are called. Because of
    spurious wakeups, wait() is called from a while loop that reexec wait() while
    the condition holds.


    A classic example of thread communication involving conditions is the relationship
    between a producer thread and a consumer thread. The producer thread produces
    data items to be consumed by the consumer thread. Each produced data item is stored
    in a shared variable.


    To overcome problems such as consuming a data item that hasn''t been produced,
    the producer thread must wait until it''s notified that the previously produced
    data item has been consumed, and the consumer thread must wait until it''s notified
    that a new data item has been produced.


    Chapter 4 presents additional thread capabilities.


    49'
