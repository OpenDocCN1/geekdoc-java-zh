  md: '# CHAPTER 5 CONCURRENCY UTILITIES AND EXECUTORS


    Finally, 5-1 refers to the Future interface, which represents the result of an
    asynchronous computation. The result is known as a Future because it will be available
    until some moment in the Future. Future, whose generic type is Future<V>, provides
    methods for canceling a task, for returning a task''s value, and for determining
    whether or not the task has finished. Table 5-2 describes Future''s methods.


    # Table 5-2. Future''s Methods


    | Method | Description |

    | --- | --- |

    | boolean cancel(boolean mayInterruptRunning) | Attempt to cancel execution of
    this task and return true when the task is canceled; otherwise, return false (the
    task may have completed normally before cancel() was called). Cancellation fails
    when the task is done, canceled, or couldn''t be canceled for another reason.
    If successful and this task hadn''t yet started, the task should never run. If
    the task has started, mayInterruptRunning determines (true) or not (false) the
    thread running this task should be interrupted in an attempt to stop the task.
    After returning, subsequent calls to isDone() always return true; isCancelled()
    always return true when cancel() returns. |

    | V get() | Wait for the task to complete and return the result. This method throws
    java.util.concurrent.CancellationException when the task was canceled prior to
    this method being called, ExecutionException when the task threw an exception,
    and InterruptedException when the current thread was interrupted while waiting.
    |

    | V get(long timeout, TimeUnit unit) | Wait at most timeout units (as specified
    by unit) for the task to complete and return the result (if available). This method
    throws CancellationException when the task was canceled prior to this method being
    called, ExecutionException when the task threw an exception, InterruptedException
    when the current thread was interrupted while waiting, and TimeoutException when
    this method''s value expires (wait times out). |

    | boolean isCancelled() | Return true when this task was canceled before it completed
    normally; otherwise, return false. |

    | boolean isDone() | Return true when this task completed; otherwise, return false.
    Completion may be due to normal termination, an exception, or cancellation—this
    method returns true in all of these cases. |'
