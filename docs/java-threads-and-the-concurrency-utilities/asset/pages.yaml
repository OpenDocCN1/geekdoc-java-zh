    # Completion Services


    A completion service is an implementation of the java.util.concurrent. CompletionService<V>
    interface decouples the production of new asynchronous tasks (a producer) from
    the consumption of the results of completed tasks (a consumer). V is the type
    of task completion.


    A producer submits a task for execution (via a worker thread) by calling one of
    the submit() methods: one method accepts a callable argument and the other accepts
    a runnable argument along with result to return upon task completion. Each method
    returns a Future<V> instance that represents the pending completion of the task.
    You can then call a poll() method to poll for the task or a blocking take() method.


    A consumer takes a completed task by calling the take() method. This method blocks
    until a task has completed. It returns a Future<V> object that represents the
    completed task. You would call Future<V>get() method to obtain this result.


    With CompletionService<V>, Java 7 introduced the java.util.concurrent.ExecutorCompletionService
    class to support task execution via a provided executor. This class ensures that,
    when submitted tasks are complete, they are placed on a queue that''s accessible
    to take().


    To demonstrate CompletionService and ExecutorCompletionService, I''m revisiting
    the application for calculating Euler''s number that I first presented in Chapter
    5. Listing 8-8 presents the source code to a new application that submits two
    tasks to calculate this number to differ.


