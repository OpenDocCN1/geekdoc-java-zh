    +   1. Thread A calls instanceMethod1(), obtains the lock assigned to the lock1-referenced
    object, and enters its outer critical section (but has not yet acquired the lock
    assigned to the lock2-referenced object).

    2. Thread B calls instanceMethod2(), obtains the lock assigned to the lock2-referenced
    object, and enters its outer critical section (but has not yet acquired the lock
    assigned to the lock1-referenced object).

    3. Thread A attempts to acquire the lock associated with lock2. The JVM forces
    the thread to wait outside of the inner critical section because thread B holds
    that lock.

    4. Thread B attempts to acquire the lock associated with lock1. The JVM forces
    the thread to wait outside of the inner critical section because thread A holds
    that lock.

    5. Neither thread can proceed because the other thread holds the needed lock.
    You have a deadlock situation and the program (at least in the context of the
    two threads) freezes up.


    Compile 2-1 Listing as follows:


    ```

    javac DeadlockDemo.java

    ```


    Run the resulting application as follows:


    ```

    java DeadlockDemo

    ```


    You should observe interleaved first thread in instanceMethod1 and second thread
    in instanceMethod2 messages on the standard output stream until the application
    freezes up because of deadlock.'
