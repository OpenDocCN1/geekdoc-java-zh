  md: '# SwingUtilities and EventQueue


    The java.swing.SwingUtilities class provides a collection of static methods that
    are useful in a Swing context. Three of these methods are especially useful for
    working with the EDT and avoiding the previous problems:


    +   - invokeAndWait(Runnable doRun): Cause doRun.run() on the EDT. This call blocks
    until all pending events have been processed and (then) doRun.run(). returns invokeAndWait()
    throws java.lang.InterruptedException when the method is interrupted while waiting
    for the EDT to finish doRun.run(). It throws java.lang.InvocationTargetException
    when an exception is thrown from doRun.run(). invokeAndWait() should be used when
    an application thread needs to update the GUI from any other thread than the EDT.
    It shouldn''t be called from any thread.


    +   - invokeLater(Runnable doRun): Cause doRun.run() to be executed asynchronously
    on the EDT. This happens after all pending events have been processed. invokeLater()
    should be used when an application thread needs to update the GUI. It can be called
    from any thread; otherwise, return false.


    +   - boolean isEventDispatchThread(): Return true when the invoking thread is
