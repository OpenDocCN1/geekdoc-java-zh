  md: '# Synchronizing Access to Critical Sections


    You can use synchronization to solve the previous thread problems. Synchronization
    is a JVM feature that ensures that two or more concurrent threads don''t simultaneously
    execute a critical section, which is a code section that must be accessed in a
    serial (one thread at a time).


    This property of synchronization is known as mutual exclusion from executing in
    a critical section when another thread is inside the critical section. For this
    reason, the lock that the thread acquires is often referred to as a mutex lock.


    Synchronization also exhibits the property of visibility which it ensures that
    a thread executing in a critical section always sees the most recent changes to
    shared variables. It reads these variables from main memory entry to the critical
    section and writes its values to main memory on.


    Synchronization is implemented in terms of monitors, which concurrency constructs
    for controlling access to critical sections, which must execute invisibly. Each
    Java object is associated with a monitor, which a thread can lock or unlock by
    acquiring and releasing the monitor''s lock (a token).


    > A thread that has acquired a lock doesn''t release this lock when it calls Thread''s
    sleep() methods.


    Only one thread can hold a monitor''s lock. Any other thread trying to lock that
    monitor blocks until it can obtain the lock. When a thread exits a critical section,
    it unlocks the monitor by releasing the lock.


    Locks are designed to be reentrant to prevent deadlock (discussed later). When
    a thread attempts to acquire a lock that it''s already holding, the request succeeds.


    > The java.lang.Thread class declares a static boolean holdsLock(Object o) method
    that returns true when the calling thread holds the lock on object o. You will
    find this method handy in assertion statements, such as assert Thread.holdsLock(o);


    Java provides the synchronized keyword to serialize thread access to a method
    or a block of statements (the critical section).'
