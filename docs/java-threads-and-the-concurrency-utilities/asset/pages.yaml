  md: "# CHAPTER 8 ADDITIONAL CONCURRENCY UTILITIES\n\n**Listing 8-3.** Returning\
    \ Unique IDs in a Thread-Safe Manner via AtomicLong\n\n```\nimport java.util.concurrent.atomic.AtomicLong;\n\
    \nclass ID {\n    private static AtomicLong nextID = new AtomicLong(1);\n\n  \
    \  static long getNextID() {\n        return nextID.getAndIncrement();\n    }\n\
    }\n```\n\nIn Listing 8-3, I've converted nextID from long to an AtomicLong instance,\
    \ initializing this object to 1. I've refactored the getNextID() method to call\
    \ AtomicLong's getAndIncrement() method, which increments the AtomicLong internal\
    \ long variable by one and returns the value in one indivisible step. There is\
    \ no explicit synchronization.\n\n> Note The java.util.concurrent package includes\
    \ DoubleAccumulator, DoubleAdder, LongAccumulator, and LongAdder that address\
    \ a scalability problem in the context of maintaining a single sum, or some other\
    \ value with the possibility of updates from many threads. These new classes \"\
    internally employ contention-reduction techniques that provide high throughput\
    \ improvements compared to atomic variables. This is made possible by relaxing\
    \ atomicity guarantees in a way that is acceptable in most applications.\n\n#\
    \ Understanding the Atomic Magic\n\nJava's low-level synchronization mechanism,\
    \ which enforces mutual exclusion (the thread holding the lock that guards a set\
    \ of variables has exclusive access to them) and visibility (changes to the guarded\
    \ variables become visible to other threads that subsequently acquire the lock),\
    \ impacts hardware utilization and scalability in the following ways:\n\n+   Contended\
    \ synchronization (multiple threads constantly competing for a lock) is expensive\
    \ and hurts performance as a result. This expense is caused mainly by the frequent\
    \ context switching (switching the current processing unit from one thread to\
    \ another) that each switch operation can take many processor cycles to complete.\
    \ In contrast, modern Java virtual machines (JVMs) make unchecked synchronization\
    \ inexpensive.\nWhen a thread holding a lock is delayed (because of a scheduling\
    \ delay, for example), no thread that requires that lock makes any progress; the\
    \ hardware isn't utilized as well as it might be.\n\n132"
