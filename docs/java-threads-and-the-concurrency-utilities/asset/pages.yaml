    # ReadWriteLock


    Situations arise where data are read more often than they are modified. For example,
    you might have created an online dictionary of word definitions that many threads
    will read concurrently, while a single thread might occasionally add new definitions
    or update existing definitions. The Locking Framework provides a read-write locking
    mechanism for these situations that yields greater concurrency when reading and
    the safety of exclusive access when writing. This mechanism is based on the ReadWriteLock
    interface.


    ReadWriteLock declares the following methods:


    +   * Lock readLock(): Return the lock that''s used for reading.

    * Lock writeLock(): Return the lock that''s used for writing.'
