  md: '# CHAPTER 8


    # Additional Concurrency Utilities


    Chapters 5 through 7 introduced you to the concurrency utilities, executors (and
    callables and futures), synchronizers, and the Locking Framework. In this chapter,
    I complete my coverage of the concurrency utilities by introducing you to concurrent
    collections, atomic variables, the Fork/Join Framework, and completion services.


    +   Note Lack of time prevented my also coveringable futures. If you''re interested
    in this topic, I recommend that you check out Tomasz Nurkiewicz''s excellent blog
    post titled "Java 8: Definitive guide to CompletableFuture" at http://www.nurkiewicz.com/2013/05/java-8-definitive-guide-to.html.


    # Concurrent Collections


    Java''s Collections Framework provides interfaces and classes that are located
    in the java.util package. Interfaces include List, Set, and Map; classes include
    ArrayList, TreeSet, and HashMap.


    ArrayList, TreeSet, HashMap, and other classes that implement these interfaces
    are not thread-safe. However, you can make them thread-safe by using the synchronized
    wrapper methods located in the java.util.Collections class. For example, you can
    pass an ArrayList instance to Collections.synchronizedList() to obtain a thread-safe
    variant of ArrayList.'
