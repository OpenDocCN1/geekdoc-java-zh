  md: '# CHAPTER 8 ■ ADDITIONAL CONCURRENCY UTILITIES


    **Note** Parallelism refers to running threads simultaneously through some combination
    of multiple processors and cores. In contrast, concurrency is a more generalized
    form of parallelism in which threads run simultaneously or appear to run simultaneously
    through context switching, also known as virtual parallelism. Some people further
    characterize concurrency as a property of a program or operating system and parallelism
    as the runtime behavior of executing multiple threads simultaneously.


    Java supports concurrency via its low-level threading features and higher-level
    concurrency such as thread pools. The problem with concurrency is that it doesn''t
    maximize the use of available processor/core resources. For example, suppose you''ve
    created a sorting algorithm that divides an array into two halves, assigns two
    threads to sort each half, and merges the results after both threads finish.


    Let''s assume each thread runs on a different processor. Because different elements
    of ordering may occur in each half of the array, it''s possible that one thread
    will finish before the other thread and wait before the merge can happen. In this
    case, a processor resource is wasted.


    This problem (and the related problems of the code being verbose and hard to read)
    can be solved by recursively breaking a task into subtasks and combining results.
    These subtasks run in parallel and complete approximately at the same time (if
    not at the same moment), where their results are merged and passed up the stack
    to the previous layer of subtasks. This makes the code less verbose and (usually)
    easier to understand. Java provides the Fork/Join Framework to implement this
    scenario.


    Fork/Join consists of a special executor service and thread pool. The executor
    service makes a task available to the framework, and this task is broken into
    smaller tasks that are forked (executed by different threads) from the pool. A
    task waits until (its subtasks finish.


    Fork/Join uses work stealing to minimize thread contention and overhead. Each
    worker thread from a pool of worker threads has its double-ended work queue and
    pushes new tasks to this queue. If the queue is empty, the worker thread tries
    to get a task from the tail of another queue. Stealing is infrequent because worker
    threads put tasks into their queues in a last-in, first-out (LIFO) order, and
    the size of work items gets smaller as a problem is divided into subproblems.
    You start by giving the tasks to a central worker and it keeps dividing them into
    smaller tasks. Eventually all of the workers have something to do with minimal
    synchronization.'
