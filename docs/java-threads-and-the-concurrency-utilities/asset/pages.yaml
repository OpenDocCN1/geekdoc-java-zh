  md: '# APPENDIX B THREADING IN SWING


    One consequence of Swing being single-threaded is that you create a Swing application’s
    GUI on EDT only. It’s incorrect to create this GUI on any other thread, including
    the default main thread that runs a java application’s main() method.

    Most Swing objects (like javax.swing.JFrame, which describe GUI top-level “frame”
    with windows menu bars and borders are not thread-safe. Accessing these objects
    from multiple threads risks thread interference and/or inconsistency errors:


    +   - **Thread interference:** Two threads are performing two different operations
    while acting on the same data. For example, one thread reads a long counter variable
    while another thread updates this variable. Because a long being read from or
    written to a 32-bit machine requires two read/write accesses, it’s possible that
    the reading thread reads parts of this variable’s current value, and then the
    writing thread updates the rest of the variable, and then the reading thread reads
    an incorrect value.


    +   - **Memory inconsistency errors:** Two or more threads are running on different
    processors or processor cores have inconsistent values of the same data. For example,
    writing on one processor or updates a counter variable and then reading on another
    processor or reads this variable. However, because a caching mechanism is used
    to boost performance, neither thread accesses a single copy of the variable in
    main memory. Each thread accesses its own copy of the variable from local memory
    (a cache).


    How might these problems occur when the GUI isn’t created on the EDT? John Zakowski
    demonstrates one scenario in his JavaWorld article “Swing threading-and-the-event-dispatch
    thread”(www.javaaworld.com/article/2077754/core-java/swing-threading-and-the-event-dispatch-thread).


    Zukowski presents an example that adds a container listener to a frame window
    component. Listener methods are called when a component is added to or removed
    from the frame. He demonstrates the EDT running code within a listener method
    before the frame is realized by the default main thread.


    Note To be realized means that a component’s paint() method either has been called
    or might be called. A frame window is realized by having one of setVisible(true),
    show(), or pack() called on this container component. After a frame window is
    realized, all of the components that it contains are also realized. Another way
    to realize a component is to add it to a container that’s already realized.


    170'
