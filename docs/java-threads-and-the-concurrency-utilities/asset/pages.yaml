  md: "# Beware of Liveness Problems\n\nThe term liveness refers to something beneficial\
    \ happening eventually. A liveness failure occurs when an application reaches\
    \ a state in which it can make no further progress. In a single-threaded application,\
    \ an infinite loop would be an example. Multithreaded applications face the additional\
    \ liveness challenges of deadlock, livelock, and starvation:\n\n+   - Deadlock:\
    \ Thread 1 waits for a resource that thread 2 is holding exclusively and thread\
    \ 2 is waiting for a resource that thread 1 is holding exclusively. Neither thread\
    \ can make progress.\n- Livelock: Thread x keeps retrying an operation that will\
    \ always fail. It cannot make progress for this reason.\n- Starvation: Thread\
    \ x is continually denied (by the scheduler) access to a needed resource to make\
    \ progress. Perhaps the scheduler executes higher-priority threads before lower-priority\
    \ threads and there is always a higher-priority thread available for execution.\
    \ starvation is also commonly referred to as indefinite postponement.\n\nConsider\
    \ deadlock. This pathological problem occurs because of too much synchronization\
    \ via the synchronized keyword. If you're not careful, you might encounter a situation\
    \ where locks are acquired by multiple threads, neither holds its own lock but\
    \ holds the lock needed by some other thread, and neither thread can enter and\
    \ later release its critical section because another thread holds the lock to\
    \ that critical section. Listing 2-1 as atypical example demonstrates this scenario.\n\
    \nListing 2-1. A Pathological Case of Deadlock\n\n```\npublic class DeadlockDemo\n\
    {\n    private final Object lock1 = new Object();\n    private final Object lock2\
    \ = new Object();\n\n    public void instanceMethod1()\n    {\n        synchronized(lock1)\n\
    \        {\n            synchronized(lock2)\n            {\n                 \
    \   System.out.println(\"first thread in instanceMethod1\");\n               \
    \     // critical section guarded by first\n                    // lock1 and then\
    \ by lock2\n                }\n        }\n    }\n}\n```"
