  md: '# APPENDICE B THREADING IN SWING


    Listing B-6 models a slide in terms of Projector, Screen, Slide, and SlideShow
    classes. Projector declares several private fields, a Projector(List<Slide> slides,
    Screen s) constructor for initializing a projector to a java.util.List of Slide
    objects and a Screen object, a void start() method for starting the projector,
    and a void stop() method for stopping the projector.


    Screen, which subclasses javax.swing.JComponent to make a Screen a special kind
    of Swing component, declares several private fields, a Screen(int width, int height)
    constructor for instantiating this component to the extents of the screen to width
    and height, and a void drawImage(BufferedImage bi) method for drawing the buffered
    image passed to method on the screen''s surface. This class also overrides getPreferredSize()
    and void paint(Graphics g) to return the component''s size and paint its surface.


    Slide declares various constants, several private fields, a BufferedImage and
    String constructor for initializing a Slide object, BufferedImage getImage() and
    String getText() methods for returning the buffered image and text, a BufferedImage
    blend(Slide slide1, Slide slide2, float weight) method for blending a pair of
    images to show a transition between slides, and a List<Slides> loadSlides(String
    indexPath) class method to load all slides.


    The blend() method extracts the buffered images associated with its slide arguments
    and blends them with the amount of blending determined by weight''s value (which
    must be in the range 0.0 to 1.0). The higher value passed to weight, the more
    of slide''s image contributes to the returned image. After blending images, blend()
    blends a pair of text over the blended image. The java.awt.AlphaComposite class
    is used to take care of blending in each.


    I designed blend() to handle a special case where null is passed to slide2. This
    happens at the beginning of Projector''s start() method where it executes s.drawImage(slide.slides.get(0),
    null, 1.0)); to display the first slide—there''s no transition at this point.


    The loadSlides() method looks for a file name index in the directory identified
    by this method''s string argument and creates the List of Slides in the order
    identified by this text file contents—you can choose one to display slides that
    differs from the order of images stored in the directory. Each line is organized
    as a file name followed by a comma, which is followed by a textual description
    (such as earth, Terzan System). When specifying a file name, you specify a file
    extension; loadSlides() is hardwired to


    Slides declares a method that does this application. This method first verifies
    that a command-line argument identifying the slide directory (a directory containing
    index and JPEG files) has been specified. It then invokes loadSlides() to load
    and index all slides from directory. loadSlides() throws java.IOException when
    it''s unable to load an image or when the number of images is less than 2. After
    all, how can you create a slide show with less than two images?


    main() creates a Screen component object for displaying slide images. It passes
    the width and height of each slide (actually, the width and height of each slide
    image) to Screen''s constructor, which ensures the screen is just large enough
    to display these slides. All slide images must have the same width and height,
    although I don''t enforce this requirement in loadSlides().'
