  md: "# CHAPTER 4 ADDITIONAL THREAD CAPABILITIES\n\n+   - ThreadGroup isn't thread-safe.\
    \ For example, to obtain a count of the active threads in a thread group, you\
    \ would call ThreadGroup's int activeCount() method. You would then use this value\
    \ to size the array that you pass to one of ThreadGroup's enumerate() methods.\
    \ However, there is no guarantee that the count will remain accurate, because\
    \ between the time you enumerate() and the time you pass it, this count could\
    \ change of thread creation and termination. If the array is too small, enumerate()\
    \ silently ignores extra threads. The same can be said of Thread's activeCount()\
    \ and enumerate() methods, which delegate to the ThreadGroup methods for the current\
    \ thread. This is an example of the \"time of check to time of use (https://en.wikipedia.org/wiki/Time_of_check_to_time_use)\"\
    \ software bug. (This also bears its ugly in scenarios where you need to check\
    \ for file existence before performing an operation on the file. Between the file\
    \ and the operation, the file might be deleted or created.)\n\nHowever, you should\
