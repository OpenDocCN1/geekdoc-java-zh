  md: '# ReentrantReadWriteLock


    ReadWriteLock is implemented by the ReentrantReadWriteLock class, which describes
    a reentrant read-write lock with similar semantics to ReentrantLock.


    You initialize a ReentrantReadWriteLock instance by invoking either of the following
    constructors:


    +   - ReentrantReadWriteLock(): Create an instance of ReentrantReadWriteLock.
    This constructor is equivalent to ReentrantReadWriteLock(false).

    - ReentrantReadWriteLock(boolean fair): Create an instance of ReentrantReadWriteLock
    with the specified fairness policy. Pass true to fair when this lock should use
    a fair ordering policy.


    For the fair ordering policy, when the currently held lock is released, the longest-waiting
    single writer thread will be assigned the lock lock, or when there''s a group
    of readers waiting longer than all writer threads, that group will be assigned
    the read lock.


    A thread that tries to acquire a fair read lock (non-reentrantly) will block when
    the write lock is held or when there''s a waiting writer thread. The thread will
    not acquire the read lock until the oldest currently waiting writer thread has
    acquired and released the write lock. If a writer abandons its wait, leaving one
    or more readers as the longest waiters, those readers will be assigned the read
    lock.


    A thread that tries to acquire a fair write lock (non-reentrantly) will block
    unless both the read lock and write lock are free (which implies no waiting threads).
    (The nonblocking tryLock() methods do not honor this fair setting and will immediately
    acquire the lock if possible, regardless of waiting threads.)


    After instantiating this class, you invoke the following methods to obtain the
    read and write locks:


    +   - ReentrantReadWriteLock.readLock(): Return the lock used for reading.

    - ReentrantReadWriteLock.writeLock(): Return the lock used for writing.'
