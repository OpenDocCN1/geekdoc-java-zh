  md: '# Chapter 8: Additional thread-safe collections


    +   1. The two problems with concurrent collections are the possibility of throwing
    ConcurrentModificationException objects and poor performance. It''s necessary
    to acquire a lock before iterating a collection that might be modified by another
    thread during the iteration. If a lock isn''t acquired and the collection is modified,
    it''s highly likely that ConcurrentModificationException will be thrown. Also,
    performance suffers when synchronized collections are accessed frequently from
    multiple threads.


    +   2. A concurrent collection is a concurrency performant highly-scalable collection-oriented
    type that is stored in the java.util.concurrent package.


    +   3. A weakly-consistent iterator is an iterator with the following properties:


    +   - An element that was removed after iteration starts hasn''t been returned
    by the iterator''s next() method won''t be returned.


    +   - An element that was added after iteration starts may or may not be returned.


    +   - No element is returned more than once during the iteration of a collection,
    regardless of changes made to the collection during iteration.


    +   4. BlockingQueue is a subinterface of java.util.Queue that also supports blocking
    operations that wait for the queue to become nonempty before retrieving an element
    and wait for space to available in the queue before storing an element.


    +   5. ConcurrentMap is a subinterface of java.util.Map that declares additional
    putIfAbsent(), remove(), and replace() methods.


    +   6. ArrayBlockingQueue is a bounded blocking queue backed by an array. LinkedBlockingQueue
    is an optionally-bounded queue based on linked nodes.


    +   7. The answer is true: the concurrency-oriented collection types are part
    of the Collections Framework.


    +   8. ConcurrentHashMap behaves like HashMap but has been designed to work in
    multithreaded contexts without explicit synchronization.'
