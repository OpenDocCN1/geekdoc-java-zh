  md: "# Timer\n\nSwing provides the javax.swing.Timer class (as a simplified version\
    \ of the Timer Framework—Chapter 4) to periodically execute Swing code on the\
    \ EDT. It fires an action event to registered listeners after an initial delay\
    \ and repeatedly thereafter with events separated between-event delays.\n\nCall\
    \ the Timer(int delay, ActionListener listener) constructor to create a timer\
    \ with initial and between-event delays (milliseconds), and with the initial action\
    \ listener (which may be null) as the target of events that are sent every delay.\n\
    \nThe delay value is used as both the initial delay and the between-event delay.\
    \ You can also set these values separately by calling the void setInitialDelay(int\
    \ initialDelay) and voidDelay(int delay) methods.\n\n+   **Note** Invoke Timer's\
    \ setRepeats(boolean flag) method with a false argument to instruct the timer\
    \ to send only a single action event.\n\nCall addActionListener(ActionListener\
    \ listener) to add another listener and removeActionListener(ActionListener listener)\
    \ to remove the previously registered action listener. Call ActionListener[] getActionListeners()\
    \ to obtain all registered listeners.\n\nThe newly created timer is in its stopped\
    \ state. To start the timer, call its void start(). Conversely, you would call\
    \ void stop() to terminate the timer. You might also want to call boolean isRunning()\
    \ to determine if the timer is running.\n\nListing B-5 presents the source code\
    \ to a Counter application that creates a timer to constantly display a running\
    \ count via a label.\n\n# Listing B-5. Starting and Stopping a Count\n\n```\n\
