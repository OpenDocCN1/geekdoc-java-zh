  md: '# CHAPTER 8 ADDITIONAL CONCURRENCY UTILITIES


    Although you might believe that you can use volatile as a synchronization alternative,
    volatile variables only solve the visibility problem. They cannot be used to safely
    implement the atomic read-modify-write sequences that are necessary for implementing
    thread-safe counters and other entities that require mutual exclusion. However,
    there is an alternative that''s responsible for the performance gains offered
    by the concurrency utilities (such as the java.util.concurrent.Semaphore class).
    This alternative is known as compare-and-swap.


    Compare-and-swap (CAS) is the generic term for an uninterruptible microprocessor-specific
    instruction that reads a memory location, compares the read value with an expected
    value, and stores a new value in the memory location when the read value matches
    the expected value. Nothing is done. Modern processors offer variations of CAS.
    For example, Intel processors use the cmpxchg family of instructions, whereas
    the older PowerPC processors provide load-link (such as lx) and store-conditional
    (such as stwcx).


    CAS supports atomic read-modify-write sequences. You typically use CAS as follows:


    +   1. Read x from address A.


    +   2. Perform a multiset computation on x to derive a new value called.


    +   3. Use CAS to change the value of A from x to y. CAS succeeds when A''s value
    hasn''t changed while performing these steps.


    To understand CAS''s benefit, consider Listing 8-2''s class, which returns a unique
    identifier. Because the existence of a CAS class declares its nextID() method
    synchronized, high contention for the monitor lock in excessive context switching
    that can delay any of the threads and result in an application that doesn''t scale.


    Assume the class declares its atomic int getValue() for returning value and int
    compareAndSwap(int expectedValue, int newValue) for implementing CAS. (Behind
    the scenes, CAS relies on the Java Native Interface [JNI] to access the microprocessor-specific
    CAS instruction.)


    The compareAndSwap() method executes the following sequence atomically:


    ```

    int readValue = value; // Obtain the stored value.

    if (readValue == expectedValue) // If stored value not modified ...

    value = newValue; // change to new value.

    return readValue; // Return value before a potential change.

    ```


    Listing 8-4 presents a new version of ID that uses the CAS class to obtain a unique
    identifier in a highly performant manner. (Forget about the performance ramifications
    of using the JNI and assume that we had direct access to the microprocessor-specific
    CAS instruction.)'
