  md: '# 9.4.1 The Statement class


    A class by name Statement is created using the createStatement() method of the
    Connection class, which returns a Statement object. The syntax is the following:


    ```

    Statement stmt = dbCon.createStatement();

    ```


    The execution of the other statement object gives the instance stmt of the Statement
    object but it does not have any SQL statement to pass on to the DBMS at that point
    of time.


    The Statement class is used to build SQL statements for database operations such
    as creation, adaption, retrieval and deletion. Methods of the Statement class
    take a parameter string containing the SQL statement to be executed.


    There are three possible Statement methods which can be used to execute an SQL
    statement string:


    +   - executeQuery(String sql) This method is used for SELECT statements. Returns
    the ResultSet object. The result set consists of the rows returned by the select
    statement.

    - executeUpdate(String sql) This method is used for SQL statements such as INSERT,
    UPDATE or DELETE, which will update the database. It returns an integer value,
    which specifies the number of rows affected. This statement can also be used for
    executing DDL statements (for creating, altering and deleting tables)

    - execute(String sql) This method is used when the SQL statement may be an update
    or query. (This statement can be used in place of executeQuery() as well as executeUpdate()).


    The following is an example showing how to execute a query:


    ```

    Statement stmt = dbCon.createStatement();

    stmt.executeQuery("select * from Emp_info");

    ```


    Alternately, it can also be written as follows:


    ```

    Statement stmt = dbCon.createStatement();

    String sql = "select * from Emp_info";

    stmt.executeQuery(sql);

    ```


    The Statement object stmt that was created can be (re)used more than once for
    different SQL statements. Some of the methods in the statements class are listed
    in Table 9.5.


    Data can be inserted or updated with SQL insert and update statements using the
    method executeUpdate. The following example shows how to insert data into the
    Emp_info table:


    ```

    Statement stmt = dbCon.createStatement();

    String sql="insert into Emp_info values (1223,''raja'',''technicalwriter'',5000)";

    stmt.executeUpdate(sql);

    ```'
