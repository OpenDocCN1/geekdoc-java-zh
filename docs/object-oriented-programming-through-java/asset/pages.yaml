  md: '# 8.4.1 Running the applet using AppletViewer


    AppletViewer is a program which provides a Java run-time environment for applets.
    It accepts an HTML file as the input and executes the <applet> reference, ignoring
    the HTML statements. Usually, AppletViewer is used to test Java applets.


    To execute any applet program using AppletViewer the applet tag should be added
    in the comment lines of the program. These comment lines will not be considered
    when the programs are compiled. The command AppletViewer <appletfile.java> is
    used to view the applet. Program 8.1, we can invoke it as follows:


    ```

    c:>appletviewer SampleApplet.java

    ```


    The reader can then execute Program 8.1. It is suggested as an exercise.


    The drawing() method draws the String ‘This is a sample applet’ on the applet
    panel,starting at the coordinate (50, 50). Note that the applet panel provides
    a graphical environment in which the drawing will paint rather than print. Usually,
    the panel is specified in terms of pixels in which the upper left corner is the
    origin (0, 0).


    As mentioned earlier, applets interact with the user through AWT. In Program 8.1
    we have used AWT component—button. Observe the SampleApplet class header:


    ```

    public class SampleApplet extends Applet implements ActionListener

    ```


    The ActionListener interface is implemented by a class to handle the events generated
    by components such as buttons. The method actionPerformed() available in this
    interface is overridden so that action is performed when the button is pressed.
    In Program 8.1, it can be observed that when the applet is first executed, the
    paint() method does not display anything on the applet window. This is because
    the flag is set to false. When the button is pressed (observe the actionPerformed()
    method) the flag is set to true and repaint() method is called. This time since
    the flag is set to true, the repaint() method will display the String ‘This is
    a simple applet’.


    In Program 8.1 we use the System.out.println() method to print the sequence of
    the methods executed when the applet is running.


    The output shown in the console is in the following :


    +   * init() is called;

    * start() is called;

    * paint() is called;

    * stop() is called;

    * start() is called;

