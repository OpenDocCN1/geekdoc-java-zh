  md: '# Object Oriented Programming through Java


    Defining a class is having a name, a set of attributes and a set of methods defined.
    The attributes will not have any values associated with them when a class is defined;
    however, an object is created from this class, the attributes of this object will
    have values. The values of the attributes can be accessed and/or modified by the
    methods of that class and cannot be accessed or modified by the objects of the
    other class.


    The definition of a class must not be confused with that of an object. A class
    is the outline for an object. But a class is not an object more than a blueprints.
    We introduce the notion of data types, which makes easy to understand the difference
    between objects and classes. Consider a data type integer. We declare variables
    to be of type integer. For example, in C, we can do this with the statement


    ```

    int i, j;

    ```


    This statement defines two variables i and j of type integer. When this statement
    is executed, the two variables are created. Similarly, an object can be defined
    by a class. That is, a class is similar to a data type (data structure) and an
    object is like a variable created from some class. In other words, a class defines
    a type and an object is a particular instance of the class. Suppose Circle is
    a class, the objects A and B can be created from that class, as in C++, where
    A and B may be circles of different diameters.


    # Circle A, B:


    An object can be viewed from two perspectives. The first is useful during design
    and implementation of the. We have to define the attributes that will be held
    in the object and write the program code for the methods that make the object
    useful. The second comes in making use of the services of an object that was already
    created. When designing a solution to a large problem, we should know only the
    services that an object provides rather than the details of how the services are
    accomplished. That is, from the second point of view, an object is a black box.
    It is a part of a system whose inner workings and structure are currently hidden.
    The rest of the system only interacts with the object through a well-defined set
    of services (called messages) that it provides.


    In OOP, objects communicate with one another by sending and receiving information
    using messages. For an object, a message is a request for execution of a method.
    When a request is made to an object, it invokes the specified method in the receiving
    object, then the receiving object responds by generating the desired result. Message
    passing involves specifying the name of the object, name of the method and any
    information that needs to be sent.


    # 1.3 Characteristics of OOP


    At the heart of OOP are three main characteristics. These are the features from
    which the advantages of OOP are born.


    +   - Encapsulation

    - Inheritance

    - Polymorphism'
