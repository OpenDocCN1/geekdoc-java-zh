    uses the methods declared in the interface StudentInterface.


    Since interfaces provide only abstract method definitions, they should be implemented
    within class, using the same method signatures from the interface. Once an interface
    is included, all the methods within it have to be implemented.


    After the class implements an interface its sub-classes will inherit these new
    methods (and can override or overload them). If the class inherits from a super-class
    that implements a given interface, it is not necessary to use the keyword implements
    in the class definition.


    Implementing multiple interfaces Unlike the singly inherited class hierarchy,
    several interfaces can be used in a class. The class will implement the combined
    behaviour of all the included interfaces. To include multiple interfaces in a
    class, interface names are separated with commas. Complications may arise from
    implementing multiple interfaces. For one thing, there can be two different interfaces
    defining the same method. This problem can be solved in three ways:


    +   - If the methods in both interfaces have identical signatures, a method that
    satisfies the given definitions in both interfaces is implemented.


    +   - If the methods have different parameter lists, it is a simple case of method
    overloading. In such cases, both method signatures are implemented and each definition
    satisfies its respective interface definition.


    +   - If the methods have the same parameter lists but differ in return type,
    a method that satisfies both is created. (It must be kept in mind that method
    overloading is triggered by parameter lists, not by return type.) In this case,
    trying to compile a class that implements both interfaces will produce a compiler
    error.'
