  md: '# ## 3.2 Data Types


    A data type defines a set of values and the operations that can be performed on
    them.

    Unlike C++, Java is a strongly typed language.

    There are seven primitive data types. Some details of these are given in Table
    3.4. For example, short occupies two bytes (16-bits) and hence the minimum value
    is $-2^{15} = -32,768$ and the maximum value is $2^{15} - 1 = 32,767$. The generalized
    formula for minimum value is $-2^{(n-1)} - 1$, where $n$ is the number of bits.


    Data types in Java can be divided into three main categories: integral, floating
    point and boolean. These types are described in the following sections.


    # ## 3.2.1 Integral data types


    Integral data types consist of integers and characters: of these, integers are
    described as follows.


    # ### 3.2.1.1 Integers


    Integer data types are byte, short, int and long. They represent *signed integers*.
    Some examples of defining integer data types are given below.


    +   * int i = -215

    * int max = 0x7ffff (hexadecimal literal with a value of 2,147,483,647)

    * int min = 0x80000000 (hexadecimal literal with a value of -2,147,483,648)

    * long distance = 05402202647L (octal long literal)

    * long zipcode = 55584152L (long literal)


    # ## 3.2.2 Characters


    In Java, the character data type is represented by char. Unicode character encoding
    is used by Java. The Unicode standard was selected because it would help in internationalization
    of Java as


    Table 3.4 Primitive data types, their widths and ranges.


    | Data Types | Width (in bytes) | Minimum Value | Maximum Value |

    |---|---|---|---|

    | byte | 1 | $-2^7$ | $2^7 - 1$ |

    | short | 2 | $-2^{15}$ | $2^{15} - 1 |

    | int | 4 | $-2^{31}$ | $2^{31} - 1 |

    | long | 8 | $-2^{63}$ | $2^{63} - 1 |

    | char | 2 | 0x0 | 0xffff |

    | float | 4 | $1.401928e^{-45}$ | $3.402823e^{+38}$ |

    | double | 8 | $3.940656e^{-324}$ | $1.797693e^{308}$ |'
