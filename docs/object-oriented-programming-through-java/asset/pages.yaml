    Often first-time readers may get confused about the use of the three keywords:
    throw, throws and Throwable. It is therefore useful to dwell on the three concepts
    together in order to clarify their meaning.


    Throwable is a class. Though the Throwable class is derived from the java.lang.Object
    class in the Java class library, Throwable is the super-class of all classes that
    handle exceptions.


    The keyword throw is a statement that throws an exception. Note that an exception
    can be thrown either by the throw statement or when an error occurs during the
    execution of any other statement.


    The keyword throws is a clause specified in the method definition which indicates
    that the method throws the exceptions mentioned after the keyword throws, which
    are handled in the called methods.


    # 5.10 Advantages of the Exception-Handling Mechanism


    The main advantages of the exception-handling mechanism in object oriented programming
    over the traditional error-handling mechanisms are the following:


    +   The separation of error-handling code from normal code Unlike traditional
    programming languages, there is a clear-cut distinction between the normal code
    and the error-handling code. Further, it is also more efficient, in the sense
    that the checking of errors in the normal execution path is not needed, and requires
    fewer CPU cycles.


    +   A logical grouping of error types Exceptions can be used to group together
    errors that are related. This will enable us to handle related exceptions using
    a single exception handler. When an exception is thrown, object of one of the
    exception classes is passed as a parameter. Objects are instances of classes,
    and classes fall into an inheritance hierarchy in Java. This hierarchy can be
    used to locally group exceptions. Thus, an exception handler can catch exceptions
    of the class specified by its parameter, or can catch exceptions of any of its
    sub-classes.


    +   The ability to propagate errors up the call stack Another important advantage
    of exception handling in object oriented programming is the ability to propagate
    errors up the call stack. Exception handling allows contextual information to
    be captured at the point where the error occurs and to propagate it to a point
    where it can be effectively handled. This is different from traditional error-handling
    mechanisms in which the return values are checked and propagated to the calling
    function.'
