  md: 'The output of Program 11.10 is the following:


    ![](img/2146e82d591b04fc307195fd4ee73d50_389_0.png)


    Program 11.10 demonstrates different styles of appearance of the Swing GUI components.
    Several components have been added in this program so that one can see the changes
    in their appearance when there is a change in the look-and-feel parameters. The
    first output window shows the standard metallic appearance, and by selecting the
    motif and window options those styles can also be viewed.


    The public static class LookAndFeelInfo of the class UIManager is used to maintain
    information about the appearance.


    Consider the following statement in Program 11.10:


    ```

    private UIManager.LookAndFeelInfo looks[];

    ```


    This declares an array of type UIManager.LookAndFeelInfo (the syntax used to access
    the inner class LookAndFeelInfo). Observe the following statement :


    ```

    looks = UIManager.getInstalledLookAndFeels();

    ```


    The static method getInstalledLookAndFeels of the class UIManager is called (invoked)
    to get the array of UIManager.LookAndFeelInfo objects that describe appearance
    of the installed objects.


    The user-defined method changeTheLookAndFeel is called by the event-handler (which
    is defined in the private inner classes ItemHandler and MenuItemHandler) for the
    radio buttons and menu items defined in the program. The event-handlers pass an
    integer representing the element in the array looks of the UIManagerLookLookAndFeelInfo
    to change the appearance of the GUI components.


    Observe the following statement used in the method changeTheLookAndFeel:


    ```

    UIManager.setLookAndFeel(looks[value].getClassName());

    ```


    The static method setLookAndFeel changes the look and feel of the GUI added to
    the window. The method getClassName of the UIManager.LookLookAndFeelInfo class
    is used to determine the name of the look-and-feel class that corresponds to the
    UIManager.LookLookAndFeelInfo.'
