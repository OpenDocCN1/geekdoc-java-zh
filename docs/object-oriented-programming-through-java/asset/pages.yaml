  md: 'The start() method can also be called if the applet is stopped and to start
    animation and play sounds. A single start() method can start up one or several
    threads.


    # 8.3.3 The stop() method


    The syntax for the stop() method is the following:


    ```

    public void stop() { ... }

    ```


    The stop() method stops the applet and makes it invisible. This method can also
    be used to stop specific features of an applet, such as animation. For example,
    the stop() method runs when the user leaves the current web page. An applet is
    invisible typically when a user moves to another web page or the browser is minimized.
    The stop() method keep the applet running in the background. The stop() method
    also stops all the threads running on the applet.


    # 8.3.4 The destroy() method


    The syntax for the destroy() method is the following:


    ```

    public void destroy() { ... }

    ```


    The destroy() method is called to terminate an applet. This method runs either
    before the applet exits or before the browser exits. It is useful for clean-up
    actions, such as releasing memory after the applet is removed, killing off threads
    and closing network/database connections. Thus, this method releases all the resources
    that were initialized during an applet''s initialization.


    When the destroy() method is called, the applet is removed from the memory. A
    call to the destroy() method will call the stop() method to execute. This method
    can be overridden if any specific resources have to be released.


    # 8.3.5 The paint() method


    The syntax for the paint() method is the following:


    ```

    public void paint(Graphics g) { ... }

    ```


    The paint() method is used for applet display on the screen. The display includes
    text, images, graphics and background. The paint() method is called whenever a
    window is required to paint or repaint the applet. It can also be called when
    a browser window is maximized or when the applet is shown that was covered by
    another window. This method can be called several times during an applet''s life-cycle.
    In general, every applet program will have a paint() method, which is overridden
    to display the applet. To override paint(), we have import the java.awt.* libraries,
    which include the Graphics class that enables display of information and graphics
    in an applet''s display area.


    Unlike the other methods of an applet, paint() has one argument of type Graphics.
    Hence, to use paint(), the graphics class must be imported. Whenever paint() is
    called, an instance of'
