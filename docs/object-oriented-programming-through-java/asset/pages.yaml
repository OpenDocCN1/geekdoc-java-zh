  md: "# Object Oriented Programming through Java\n\nUsually, the initialization part\
    \ of a for statement assigns a value to some variable, and the update changes\
    \ the value of that variable with an assignment statement or with an increment\
    \ or decrement operation. The value of the variable is tested in the continuation,\
    \ and the loop ends when this condition evaluates to false. A variable used in\
    \ this way is called a loop control variable. In the for statement given above,\
    \ the loop control variable is years.\n\nCertainly, the most common type of for\
    \ is the counting loop, where a loop control variable takes on all integer values\
    \ between some minimum and some maximum value. A counting loop has the following\
    \ form:\n\n```\nfor ( variable = min; variable <= max; variable++) {\n    statements\n\
    }\n```\n\nwhere min and max are integer-valued expressions (usually constants);\
    \ variable takes on the values min, min+1, min+2, ..., max. The value of the loop\
    \ control variable is often used in the body of the loop. The for at the beginning\
    \ of this section is a counting loop in which the loop control variable takes\
    \ on the values 1, 2, 3, 4, 5.\n\nHere is an even simpler example in which the\
    \ numbers 1, 2, ... 10 are displayed as a standard output:\n\n```\nfor ( N = 1;\
    \ N <= 10; N++) {\n    System.out.println(N);\n}\n```\n\nFor various reasons,\
    \ Java programmers like to start counting at 0 instead of 1 and they tend to use\
    \ a '<' in the condition, rather than a '<='. The following variation of the above\
    \ loop prints the ten numbers 0, 1, 2, ..., 9:\n\n```\nfor ( N = 0; N < 10; N++)\
    \ {\n    System.out.println(N);\n}\n```\n\nIt is easy to count down from 10 to\
    \ 1 instead of counting up. Just start to decrement the loop control variable\
    \ instead of incrementing it and continue as long as the variable is greater than\
    \ or equal to one.\n\n```\nfor ( N = 10; N >= 1; N--) {\n    System.out.println(N);\n\
    }\n```\n\nThe for statement also allows both the initialization and the update\
    \ part to consist of several expressions, separated by commas. For example, to\
    \ count up from 1 to 10 and count down from 10 to 1 at the same time, we can write\
    \ the for loop as given below:\n\n```\nfor ( i=1, j=10; i<= j; i++, j--) {\n \
    \   Text.out.put(i,5); // Output i in a 5-character wide column.\n    Text.out.println(j,5);\
    \ // Output j in a 5-character column\n}\n```"
