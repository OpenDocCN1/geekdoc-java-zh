    # 10.8 The Java2D API


    The Java2D API provides advanced two-dimensional graphics capabilities for programmers
    who require detailed and complex graphical manipulations. The API includes features
    for processing line art, and images in packages java.awt, java.awt.image, java.awt.color,
    java.awt.geom, java.awt.print and java.awt.image.renderable.


    Drawing with the Java2D API is accomplished by using an instance of class Graphics2D
    (package java.awt). Class Graphics2D is a sub-class of Graphics, so it has all
    the capabilities demonstrated in sections 10.2 and 10.3. In fact, the actual object
    used to draw paint method is a Graphics2D object, which is passed to the paint()
    method and accessed using the super-class Graphics reference, which is, To access
    the Graphics2D capabilities, the Graphics reference passed to paint to a Graphics2D
    reference must be downcast. As the additional capabilities of Graphics2D while
    working with the Graphics class, the Graphics reference (g) must be type-cast
    to a Graphics2D reference by passing paint Component into Graphics2D. The syntax
    of casting Graphics2D to Graphics is the following:


    ```

    Graphics2D g2d = ( Graphics2D ) g;

    ```


    # 10.9 Java2D Shapes


    In this section, several Java2D shapes from the package java.awt.geom, including
    EllipseD.Double, Rectangle2D.Double, RoundRectangle2D.Double, Arc2D.Double and
    Line2D.Double dealt with. Each of these classes represents a shape with dimensions
    specified as double-precision floating-point values. There is a separate version
    of each represented with single-precision floating-point values (such as EllipseD.Float).
    In each case, Double is a static inner class of the class to the left of the operator
    (for example, Ellipse2D). To use the static inner class, simply qualify it with
    the name of the outer class.


