    \ a new maximum priority for a ThreadGroup |\n| getName() | returns as a String\
    \ the name of the ThreadGroup |\n| getParent() | determines the parent of a thread\
    \ group. |\n| ParentOf(ThreadGroup t) | returns true if t is the parent of the\
    \ ThreadGroup, otherwise it returns false |\n\nTable 6.2 The methods of a ThreadGroup."
