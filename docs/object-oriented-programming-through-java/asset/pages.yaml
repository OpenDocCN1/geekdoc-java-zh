  md: "# New Language Features of Java 1.5\n\nWith the enhancements to the for loop,\
    \ the same code fragment could be written as\n\n```\nfor(String str:StringCollection)\n\
    \  //StringCollection is a variable of type Collection\n  //process the 'str'\
    \ here\n```\n\nNote that the above for loop is read out as ‘for each String in\
    \ StringCollection’. Here the variable str is used to point to the current instance\
    \ of String in the collection.\n\nThis feature has type-safety and no casting.\
    \ The enhanced for loop simplifies programming. This feature should be used selectively.\
    \ It is not usable in the place of loops where there is a need to replace elements\
    \ in an array traverse.\n\n# 14.4 Autoboxing and Unboxing\n\nPrimitive types have\
    \ built-in functionalities in the language. Primitive data-types are byte, short,\
    \ int, float, double, char and boolean. Java provides specialized classes corresponding\
    \ to each of the primitive data types. These are called wrapper classes. Examples\
    \ of wrapper classes are Integer, Character, Double and so on. Autoboxing and\
    \ Unboxing features avoid the manual conversion between primitive types and wrapper\
    \ classes.\n\nIn earlier versions of Java, it is not possible to directly put\
    \ primitives into collections and vice versa, and thus conversion between these\
    \ types are necessary to store the elements in collections. The compiler does\
    \ the job of conversion, such as integer to Integer and boolean to Boolean.\n\n\
    The autoboxing and auto-unboxing features allow automatic conversion of primitive\
    \ type to its associated wrapper type, called boxing, and the conversion of wrapper\
    \ type to its associated primitive type, called unboxing.\n\n```\nInteger i =\
    \ 3; is an example of autoboxing\nint k = i; is an example of unboxing.\n```\n\
    \nThe main idea behind using autoboxing and auto-unboxing is to make it easier\
    \ to convert between primitive data types and wrapper types.\n\nConsider the following\
    \ statement:\n\n```\nboolean res = Boolean.TRUE && Boolean.FALSE;\n```\n\nThis\
    \ would have generated the following error previously\n\n```\noperator && cannot\
    \ be applied to java.lang.Boolean.\n```\n\nWith Java 1.5, Booleans are automatically\
    \ converted to booleans before the && operator is applied.\n\n```\nboolean res\
    \ = Boolean.TRUE && Boolean.FALSE;\n```"
