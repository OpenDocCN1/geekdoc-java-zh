    has a data type and is associated with a set of constraints such as primary key,
    unique and not null.


    # 9.1.1 Database operations


    A Structured Query Language (SQL) is widely used to operate on a database to create,
    delete and manipulate the tables. The SQL mainly falls into one of two types:


    +   - Data Definition Language (DDL) The DDL provides commands for creating, altering
    and deleting the tables (as described in Table 9.2).

    - Data Manipulation Language (DML) The DML enables the user to insert, update
    and delete the tuples in the database (as described in Table 9.3.).


    The statement to retrieve information is often known as query; however, query
    statements and manipulation statements are commonly referred to as DML statements.


    # 9.1.2 Database application architectures


    In general database applications consist of several components, such as the following:


    +   - Presentation logic

    - Data access logic

    - Business logic


    In client-server architectures these tasks can be distributed between client and
    server in a number of ways. In the following sections, the way in which the above
    components are distributed in different types of architecture are described.'
