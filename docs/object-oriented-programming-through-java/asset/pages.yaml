    # 9.4.2 Accessing rows returned from a query


    Rows produced by an executeQuery() will be returned within an object of type ResultSet,
    which is of us acting on it that. The following code shows shows the assignment
    of the execution of the select statement to the instance rs of the ResultSet object.


    ```

    Statement stmt = dbCon.createStatement();

    String sql = "select * from Emp_info";

    ResultSet rs = stmt.executeQuery(sql);

    ```


    Note that the executeQuery method returns a ResultSet object that contains the
    results of the query, whereas the executeUpdate method returns an int that represents
    the number of rows updated by the SQL statement.


    Rows are retrieved from a ResultSet object by iterating through each of the rows
    and requesting information on the contents of each column. Iteration through its
    rows is similar to iterating through a set of elements in an Enumeration object.


    The ResultSet class provides a cursor (also called handle) that can be used to
    access each row. The method next() of the ResultSet class is used to move the
    cursor that points to a row in the result set. Once the cursor is positioned on
    a row, we can request the data for each of its columns. Initially the cursor is
    set just before the first row. The first invocation of the method next sets the
    cursor on the first row. That is, to access the first row in the result set, the
    method next must be called once. Each invocation of next makes the cursor move
    to the next row. The method next returns a boolean value on whether the next row
    is present. If a row exists, it returns true, otherwise, it returns false. Table
    9.6 gives a description of the methods in the ResultSet class.


    # 9.4.3 Accessing column data


    The method XXX is used to access the columns in a row that are being pointed by
    the cursor currently. Here, XXX represents a Java data type. such as, for example,
    int. As each column may contain a different data type, we need a ResultSet method
    specific to that data type.The getInt(int column) can be used to retrieve a column
    with an integer value and getString(int column) can be used to retrieve a column
    with a string value. Under usual circumstances, we can use the getString(int column)
    method to get all types of database value. In such cases the retrieved values
    will be converted to a string type in Java.'
