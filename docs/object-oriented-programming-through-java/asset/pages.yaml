  md: "The above statements are explained in the example given.\n\n# Example\n\n```\n\
    int x=1;\nwhile (x<=5) // where x<=5 is a boolean expression\n{\n    x++;\n  \
    \  System.out.println(x);\n}\n```\n\nThe semantics of this statement go like this,\
    \ When the execution comes to a while statement, it evaluates the boolean-expression,\
    \ which yields either true or false as the value. If the value is false, the computer\
    \ skips over the rest of the while loop and proceeds to the next command in the\
    \ program. If the value of the expression is true, the computer executes the statement\
    \ or block of statements inside the loop. Then it returns to the beginning of\
    \ the while loop and repeats the process. This process will continue until the\
    \ value of the expression is false, if that never happens, then there will be\
    \ an infinite loop.\n\nThe compiler will not detect the infinite loop and hence\
    \ the process will continue forever; to stop this process, the user has to perform\
    \ abnormal termination using Ctrl+Break buttons.\n\nProgram 3.13 Printing numbers\
    \ from 1 to 5.\n\n```\nclass WhileExample\n{\n    public static void main(String\
    \ args[]) {\n        int number;\n        number = 1;\n        while (number <\
    \ 6) {\n            System.out.println(number);\n            number = number +\
    \ 1;\n        }\n    }\n```\n\nIn the above program, the variable number is initialized\
    \ with the value 1. So the first time through the while loop, when the computer\
    \ evaluates the expression number < 6, it is asking whether 1 is less than 6,\
    \ which is true. The computer therefore proceeds to execute the two statements\
    \ inside the loop. The first statement prints out ‘1’. The second statement adds\
    \ 1 to number and stores the result back into the variable number, the value of\
    \ number has been changed"
