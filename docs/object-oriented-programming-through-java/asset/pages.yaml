  md: '# Database Handling using JDBC


    optimal plan in turn gets converted into a binary execution plan. After the execution
    of the binary code, the DBMS returns an identifier to the application program.


    Here is how each JDBC Statement is prepared and executed.


    +   - The Statement object is prepared and executed in one step in the Java code.

    - The PreparedStatement object—The driver stores the execution plan handler for
    use.

    - The CalledStatement object—The SQL statement is actually making a call to a
    stored procedure that is usually already optimized.


    When using a simple Statement object, the optimal query plan is generated each
    time SQL statement is executed. In the case of the PreparedStatement object, it
    is required to generate the optimal query plan for SQL statement once and it can
    be used several times. For instance, when inserting many rows in a table, we have
    to execute the same Statement object more than once (with a different set of row
    values). Thus, to execute an SQL statement several times, it takes less time if
    the PreparedStatement is used. In the case of the CalledStatement object, the
    binary code is executed which was previously optimized and stored in the database.


    # 9.5 The Transactions Commit and Rollback


    When a database is updated with each Statement object, by default, it will automatically
    commit the changes (permanently) to the database immediately. In general, to complete
    a transaction, it is required that one or more statements are executed. Thus,
    there are situations where a commit statement is needed after execution of more
    than one statement. In Java, the Connection object performs transaction control.
    The Connection object provides a method autoCommit(boolean value) to specify whether
    a transaction (or a set of transactions) should commit automatically or manually.
    By default, it is set to auto-commit mode. The syntax for this is:


    ```

    dbcon.setAutoCommit(true);

    ```


    This auto-commit feature can be turned off with the statement :


    ```

    dbcon.setAutoCommit(false);

    ```


    To commit a transaction, when the auto-commit feature is off, the statement to
    be used is the following :


    ```

    dbcon.commit();

    ```


    If a transaction is to be rolled back at any point, this can be specified as follows:


    ```

    dbcon.rollback();

    ```


    In general, the rollback statement is used in exception handlers to recover from
    errors that may have occurred during execution of a transaction.'
