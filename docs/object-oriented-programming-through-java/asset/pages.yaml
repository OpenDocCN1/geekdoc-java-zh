  md: '# Preface


    No programming language has ever gathered as many adherents in such a short span
    as Java. A product of Sun Microsystems, Java gels well with web browsers and has
    great features as Object Oriented Programming, GUI programming, Database Access
    and Networking and also has in-built security.


    Java came into the public domain in mid-1995, and since then its popularity has
    skyrocketed. In mere six months, Java was being used by over one thousand programmers.
    By 2000, the number of Java users reached one million, and this is multiplying
    by thousands every year. It is the increasing demand that has resulted in over
    half a million programmers registering with the Sun Java Developer Group.


    Complex programs are built into simple, smaller constructs using the concepts
    of object oriented programming (OOP). The various characteristics of OOP include
    class, abstraction, inheritance, polymorphism and encapsulation. This book is
    an introduction to Java and object oriented programming to readers who are not
    familiar with the world of Java. This book, spread over fourteen chapters, is
    designed for undergraduate and post-graduate engineering and technology students.


    Chapter 1 covers the basics of object oriented programming and Chapter 2 provides
    a brief introduction to Java along with an overview of arrays, methods and structures
    in Java. A summary on Java applications and applets is also provided to familiarize
    the reader with Java programming. This chapter is designed to introduce beginners
    to Java programming, while experienced programmers would find it helpful in refining
    their skills.


    Chapter 3, divided into two parts, deals with the fundamentals of Java programming
    language. While the first part is on various data types in Java, literals, operators
    and the like, the second part focuses on various control statements and arrays
    in Java. Chapter 4 deals with object oriented programming concepts in the context
    of Java programming language.


    Java offers an exception-handling mechanism which is easy to understand and implement,
    and Chapter 5 provides an insight into exception handling. Multithreading is a
    powerful programming tool that makes concurrent execution of multiple units of
    a program happen. A brief overview on multithreading is provided in Chapter 6.


    Chapter 7 covers various input and output streams provided in Java for reading
    and writing data. Chapter 8 covers the essentials of applets and their life cycle.
    Applets are useful for client-side programming and facilitate graphics. A programming-level
    interface for communicating with'
