    In some cases, there will be a situation in which the SQL statement can be executed
    more than once. So, to avoid constructing a new execution plan for each SQL statement
    we can use theparedStatement method. Using this, the execution plan needs to be
    prepared only once. That is, this statement allows the creation of a parameterized
    statement for values which can be inserted during the run-time, thereby allowing
    the same SQL statement to be used many times, each with different parameters.


    Look at the following example of PreparedStatement:


    The question marks in the above example indicate positions where parameter values
    are to be placed (these are also called place holders). The code pstmt.setString(1,
    empno) sets the value of the first parameter to the string contained in the empno
    variable. When accessing values returned from a query, the programmer needs to
    know the type of the database field parameter corresponds to.


    While using PreparedStatement, there is no need to pass an argument to the executeUpdate
    method as it already contains the SQL statement that is to be executed.


