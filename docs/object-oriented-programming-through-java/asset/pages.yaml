  md: "# Exception Handling\n\nA catch block contains Java code to handle exceptions\
    \ so that the program will not terminate abnormally. Look at the following code:\n\
    \n```\npublic static float Divide(float a , float b)\n{\n    float c;\n    try\
    \ {\n        c = a/b;\n    }\n    catch (Arithmetic Exception e)\n{\n        System.out.println(\"\
    The exception is \" +e);\n    }\n}\n```\n\nIn the above method, divide(), when\
    \ the statement in the try block attempts to divide by zero (by passing zero value\
    \ for b), the exception ArithmeticException will be raised. Immediately, the catch\
    \ block catches this exception and handles it. The catch block displays the string\
    \ in the println().\n\nWhen an exception occurs, as described in the previous\
    \ paragraph, Java creates an exception object and performs an action called throwing\
    \ an exception. The run-time system searches through the catch block, which is\
    \ a block of code that is designed to handle the exception. It searches, starting\
    \ from the method in which the exception occurred and searches backwards to the\
    \ call stack. This search continues until the run-time system finds a method that\
    \ contains an appropriate exception handler. An exception handler is said to be\
    \ appropriate if the type of the exception thrown is the same as the type of exception\
    \ that can be dealt with by the handler or one of its sub-classes. The way to\
    \ handle an exception is to first look for an appropriate handler associated with\
    \ the block that has been thrown. If there is no appropriate handler, within the\
    \ block the search progresses up the call stack until an appropriate handler is\
    \ found which can handle the exception. If no appropriate exception handler is\
    \ found, the run-time system stops and the program terminates.\n\n> Once an exception\
    \ is thrown, the block in which the exception is thrown expires and control cannot\
    \ return to the throw point.\n\nThat is an unconditional transfer of control.\
    \ Thus Java uses the termination model of exception handling rather than the resumption\
    \ model. In the resumption model, control would return to the point at which the\
    \ exception was thrown and the program would resume execution. (This is similar\
    \ to a function call.)\n\nWhen an exception occurs, it is possible to communicate\
    \ information to the exception handler from the vicinity of the location of the\
