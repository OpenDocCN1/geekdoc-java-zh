  md: '# 4.2.1 Controlling access to methods and variables


    While a class may define various methods and variables, not all of them are useful,
    and some may be harmful, if they are not used in the way they are intended to
    be used. Access control is about controlling visibility.


    From the point of class and object design, the important modifiers that control
    the visibility of and access to variables and methods inside the classes. In the
    following text the importance of access control and the methods to ensure different
    levels of visibility is described.


    # 4.2.1.1 Why access control is visible to another class


    When a method or variable is visible to another class, methods of the second class
    can reference (that is, call or modify) that method or variable. Protecting those
    methods and instance variables limits the visibility and the use of those methods
    and variables. As a designer of a class or an entire hierarchy of classes, it
    is a good idea to define the external appearance of a class going to be, which
    variables and methods will be accessible for other users of that, and which ones
    are for internal use only. This is called *encapsulation* and is an important
    feature of object oriented design.


    > Encapsulation is the process of hiding the internal parts of an object implementation
    allowing access to that object only through a defined interface.


    # 4.2.1.2 The four Ps of protection


    Java provides four levels of protection for methods and instance variables: public,
    private, protected and package. Before applying protection levels to a program,
    one should know what each form means and understand the fundamental relationships
    that a method or variable within a class can have to the other classes in the
    system.


    **Package** Methods and variables with package protection are visible to all other
    classes in the same package but not outside that package. Most of the time, the
    programmer needs to be more explicit when protection is defined for methods and
    variables of a class. Package protection is the default level of protection. Package
    protection is not an explicit modifier, it can be added to the definition of a
    method or variable.


    **Private** The keyword limits the visibility of methods and instance variables
    to the class in which they are defined. For example, private instance variable
    can be used by methods inside the same class but cannot be seen or used by any
    other class or object. In addition, private variables private methods are not
    inherited by sub-classes.


    Private protection ensures that methods and variables are accessible only to other
    methods in the same class. To create a private method or instance variable, add
    the private modifier to its definition as shown in Program 4:14:'
