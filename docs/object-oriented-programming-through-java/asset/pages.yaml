  md: 'Java Language Fundamentals


    For example, the integer literal for 12 can be represented in the following ways:


    +   - 12 in decimal format

    - 0xC in hexadecimal format

    - 014 in octal format


    # 3.1.2.2 Floating-point literals


    Floating-point literals represent decimal numbers with fractional parts, such
    as 3.145. They can be expressed in either standard or scientific notation, meaning
    that the number 563.84 can also be expressed as 5.6384e2. Unlike integer literals,
    floating-point literals deault to the double type, which is a 64-bit value. Programmers
    can use the smaller, 32-bit float if they know that the full set of 64 bits is
    not required. This is achieved by appending an f or F to the end of the number,
    as in 5.6384e2f. The programmer can also explicitly state that he wants a double
    type for literal, as in 3.142d. However, this addition is not required as the
    default storage for floating-point numbers is already double.


    # 3.1.2.3 Boolean Literals


    Boolean literals are commonly used in Java programming. A reason for their frequent
    use is that they are present in almost every type of control structure. Boolean
    literals are needed to represent a condition or state that has only two possible
    values. Boolean values can be denoted using the reserved literals true or false.


    # 3.1.2.4 Character Literals


    Unicode is a standard universal character representation. It uses two bytes (16-bit
    character set) and also represents all international languages as character sets
    in Java. Unicode is language-independent and is maintained by the Unicode Consortium.
    This encoding standard provides the basis for processing, storage and interchange
    of text data in any language in modern software and information technology protocols.


    Table 3.2 Special characters.


    | Description | Representation | Description | Representation |

    |---|---|---|---|

    | Backslash | \\ | Newline | \n |

    | Continuation | \'' | Single quote | \'' |

    | Backspace | \b | Double quote | \" |

    | Carriage return | \r | Unicode character | \ddd |

    | Form feed | \f | Octal character | \ddd |

    | Horizontal tab | \t | | |'
