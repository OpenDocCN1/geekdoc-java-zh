    # 9.2.2 Types of database driver


    Database vendors can provide drivers of various types. Sun Microsystems have specified
    four types of driver:


    Type 1—Bridge Drivers These drivers use bridge technology like ODBC to connect
    to the database. The JDBC–ODBC Bridge Driver is the most commonly used driver.


    Type 2—Part-Java Drivers This type wraps a thin layer of Java code over the native
    code libraries to implement JDBC.


    Type 3—Network All-Java Drivers This type consists of a Java code which connects
    to middleware to access a database via a network protocol. Generally this type
    of driver is not used for data access.


    Type 4—Direct All-Java Drivers This type provides a pure Java JDBC implementation,
    which can be accessed directly and provides services to networking middleware.
    This is used mainly for internet applications.


    # 9.3 Working with JDBC


    Java connectivity is essential for building stand-alone database applications
    and also for developing dynamic Java-based web applications. Before working with
    JDBC, it is required to install Java, a JDBC driver and the DBMS on the computer
    systems. Usually, the JDBC–ODBC bridge driver is bundled with the JDK.


    # 9.3.1 Accessing a database using JDBC


    The JDBC API provided by Sun Microsystems is designed to allow access to third-party
    database products. It causes the applications to be platform-independent and also
    allows making vendor-'
