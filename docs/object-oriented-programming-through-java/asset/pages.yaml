    # 7.5 Filter Streams


    The java.io package provides a set of abstract classes that define and partially
    implement Filter. A Filter stream filters data as it is being read from or written
    to the stream. The two filters for reading and writing data are FilterInputStream
    and FilterOutputStream, respectively.


    A filter is constructed on another stream. That is, every filter must be attached
    to another stream. This can be achieved by passing an instance of InputStream
    or OutputStream to a constructor. This implies that filter streams are chained.
    Multiple filters can be added by chaining them to a stream of bytes.'
