    # 9.2 JDBC Architecture


    9.3 is a representative sketch of the JDBC architecture. This can be used in Java
    applications, applets, servlets, or any other program where Java codes used. Java
    codes only interact with the JDBC Application-Program Interface (API). The JDBC
    API is a simple SQL-Level interface, which allows execution of SQL statements
    through Java.


    The JDBC API consists of a set of interfaces and classes designed to perform actions
    on a database. The JDBC API class DriverManager, which is used to establish the
    connection to the database, is responsible for managing the different JDBC drivers.
    Other classes of JDBC API are useful when the programmer wishes to develop specific
    drivers of her own. The JDBC–ODBC bridge performs translations of JDBC calls to
    an ODBC-compatible format. This bridge is required to maintain compatibility with
    non-JDBC databases.


    # 9.2.1 Interfaces in JDBC API


    The JDBC API is defined in java.sql package and it consists of the following interfaces:


    +   - The interface java.sql.Environment, which allows the creation of new database
    connections.

    - java.sql.Connection, which permits connecting to the database.'
