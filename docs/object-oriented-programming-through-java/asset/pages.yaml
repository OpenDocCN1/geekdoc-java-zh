  md: '# 2.1.3 Java as a new paradigm is offered in programming


    There are a number of other factors that are attributed to the rise in popularity
    of Java. These include the following:


    +   - Familiarity of Java as a programming language to users of other popular
    languages, notably C++ and Smalltalk: due to this factor, users find it simple
    and easy to relate and comprehend.

    - The Java development kit is offered free of cost: this allows potential users
    to try out the language with minimal start-up cost.

    - Its availability: Java is offered as freely downloadable software from the Sun
    Microsystems website. The software is also available on other websites.

    - Finally, its timing: Java gained popularity as it emerged at the right time—when
    the Internet was in its nascent stage and was all set to grow in popularity.


    # 2.2 Features of Java


    Java has unrivalled features that make it popular as a programming language. It
    is simple, highly robust, secure, platform-independent and, hence, portable. These
    features of Java are given below:


    +   - **1. Java is a simple and object oriented language** Java is based on object
    oriented concepts. This makes it familiar to programmers using C++ and other object
    oriented programming languages. It is attuned to current software practices.

    - Java gives programmers access to libraries of tested objects that provide functionality
    ranging from basic data types through input/output and network interfaces to graphical
    user interface toolkits. These libraries can also be extended to provide new behaviour.

    - **2. Java is highly secure** Java allows programmers to develop (or create)
    highly reliable software applications. It provides extensive compile-time checking,
    followed by a second level of run-time checking. The features of Java guide programmers
    towards reliable programming.


    Using Java makes memory management extremely simple. In Java, objects are created
    with the operator new. There are no explicit pointer data types and no pointer
    arithmetic. At the same time, garbage collection is automatic. This simple memory
    management eliminates classes of programming errors that haunt C and C++ programmers.


    When a pointer goes out of scope, a garbage collector usually relies on the compiler
    to deallocate the pointer points. Most of C and C++ compilers do not provide garbage-collection
    mechanisms and the programmer has to explicitly specify the free() in C or delete
    in C++. In large and complex programs, improper use of references may lead to
    errors during execution. In Java, when an object is no longer required, the Java
    collector automatically reclaims the memory occupied by the object. The memory
    allocated to an object is not deallocated explicitly when it is used.'
