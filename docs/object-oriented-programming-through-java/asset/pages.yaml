    \ the for loop, the if statement, and the switch statement. Each of\nthese structures\
    \ is considered to be a single 'statement', but each is in fact a structured statement\n\
    t can contain one or more statements inside it.\n\n# # 3.6.1 Block\n\nBlock is\
