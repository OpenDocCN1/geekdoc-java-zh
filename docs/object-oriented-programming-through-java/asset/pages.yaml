    # 14.9 Metadata (Annotations)


    The purpose of the metadata facility is to add annotations that do not alter its
    semantics,

    but provide additional information that can be used by a compiler. These tools
    generate Java source

    program, as specified by an annotation. This means, the programmer performs an
    action in the source

    code and the tool actually provides the source code. This style of programming
    is often referred

    as as declarative programming. One of the main advantages of such an approach
    is that it reduces

    t amount of repetitive code that a programmer must write.


    In Java 1.5, the metadata feature provides the ability to associate additional
    data alongside

    Java classes, interfaces, methods and fields. One of the primary reasons for adding
    metadata to

    the Java platform is to enable development and run-time tools to have a common
    infrastructure,\sand to reduce the effort required for programming and deployment.

    This also avoids writing boilerplate code that is inserted repeatedly, into many
    different

    programs. The @ symbol is used to tell the compiler to fetch the code from somewhere
    else, and

    insert it under many circumstances enabling tools to generate it from annotations
    in the source

    code. Also, it eliminates the need for maintaining ''side files'' that must be
    kept up-to-date with

    changes in source files, instead the information can be maintained in the source
    file. The annotation

    type declaration is itself sometimes annotated. Such annotations are meta-annotations.

