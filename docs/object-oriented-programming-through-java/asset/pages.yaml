    # 3.9 The StringBuilder Class


    An object of the String is immutable. In order to achieve mutability, Java provides
    a class called StringBuilder. A StringBuilder is a mutable string, which can be
    changed during the program. It is a changeable set of characters that can grow
    in size. When ever the + (concatenation) operator is used on string objects, the
    string will be changed into an instance of StringBuilder and the append() method
    is called on instance of StringBuilder. After that, StringBuilder is changed into
    String by using the toString() method of the Object class. StringBuilder also
    facilitates the insertion of a character in the middle of a string.


    # 3.9.1 Constructors of the StringBuilder class


    There is a default constructor that creates a StringBuilder with a capacity of
    16 characters. This takes the form shown below:


    ```

    StringBuilder();

    ```


    The following type of constructor will specify the size of the StringBuilder.


    ```

    StringBuilder(int size);

    ```


    The following type of the constructor will create the StringBuilder with the String
    object.


    ```

    StringBuilder(String str);

    ```


    Whenever the size of the StringBuilder is not specified, it will allocate space
    for the 16 additional characters because reallocation is a costly process. These
    are some methods which are not part of the String object. StringBuilder also supports
    all the methods that are supported by String.


    Table 3.15 lists various methods in StringBuilder class.'
