  md: "# Java as an OOP Language\n\nJava is an object oriented programming language.\
    \ A Java program consists of a set of objects that interact and communicate with\
    \ each other. Classes are the blueprints or construction plans for these objects\
    \ and specify the properties/state and behaviour of objects. This chapter deals\
    \ with concepts in object oriented programming in the context of Java.\n\n# 4.1\
    \ Defining Classes\n\n> Classes are the fundamental building blocks of any object-oriented\
    \ language.\n\nA class describes the data and behaviour associated with instances\
    \ of that class. When a class is instantiated, an object is created: this object\
    \ has properties and behaviour similar to other instances of the same class. The\
    \ data associated with a class or object is stored in variables. The behaviour\
    \ associated with a class or object is implemented by means of methods. Methods\
    \ are similar to the functions or procedures of procedural languages such as C\
    \ or Pascal.\n\nA class can be defined as:\n\n```\nclass First\n{\n  Body of the\
    \ class\n}\n```\n\nThe keyword class is used to define a class. The keyword is\
    \ followed by the name of the class (in the above example First). The body of\
    \ the class is contained within curly brackets. The body consists of statements\
    \ related to constructors, methods and variables.\n\n> Every class defined in\
    \ Java is a child of the Object class.\n\n# 4.1.1 Creating instance and class\
    \ variables\n\nA class usually contains variables and methods. Certain specific\
    \ rules have to be followed for defining variables and methods within a class.\
    \ This section deals with the definition of different types of variable, namely\
    \ instance variables, constants and class variables."
