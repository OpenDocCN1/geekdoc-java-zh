  md: '# 3.7 Arrays


    Arrays are data structures that hold data of the same type in contiguous memory.
    A group of memory cells that are contiguous have the same name and store the same
    data type. The purpose of an array is to store data where each piece of data is
    of the same type.


    # 3.7.1 One-dimensional arrays


    # 3.7.1.1 Declaration of one-dimensional arrays


    All arrays must be declared before they can be used. The general way to declare
    a one-dimensional array is to declare the type of array, then the name of the
    array followed by the brackets []. This is done as in the following examples:


    ```

    int age[];

    double score[];

    String lastnames];

    ```


    In Java, arrays can be declared anywhere, just like any other variable. Failure
    to declare an array will result in a compile-time error message.


    # 3.7.1.2 Allocation of memory and initialization


    Memory must be allocated for an array before it is used. This is done by making
    a statement given in the following examples. In the statement, the data type is
    mentioned again and this must be the same as the data type that was indicated
    when the array was declared.


    ```

    age = new int[10];

    score = new double[100];

    lastnames = new String[1000];

    ```


    If array size is declared as N then the elements are numbered from 0 ... (N-1).

    In the example given, age has elements 0 ... 9, score has elements 0 ... 99, and
    lastnames has elements 0 ... 9999.


    An array can be declared and created in a single statement.


    ```

    int[] anArrayOfInt = new int[10];

    ```


    Accessing an element that does not exist (or is out of scope) causes a run-time
    error and the program terminates abruptly at that point. Such an error is indicated
    by the phrase Array out of Index.


    > Normally, in Java, memory is allocated for arrays in the constructor for application
    programs and in the init() function for applets.'
