  md: "# 10.6.8 Scroll bars\n\nScroll bars are used to select some values from a range.\
    \ A scroll bar has a thumb, which is dragged to change the value. It can be formed\
    \ with the following constructors:\n\n```\nScrollbar();\nScrollbar(int style);\n\
    Scrollbar(int style, int initialValue, int thumbsize, int min, int max);\n```\n\
    \nThe second constructor creates a scroll bar with specified orientation, that\
    \ is, horizontal or vertical. The third form specifies the initial value and the\
    \ maximal value along with the thumb size. After initiating the Scroll with the\
    \ default constructor, the values can be set using the following method:\n\n```\n\
    void setValues(int initial, int thumbsize, int max);\n```\n\nThe methods getValue()\
    \ and setValue() are used to get and set the value of the scrollbar at a particular\
    \ instant. The unit increment and block increment can be set using the methods:\n\
    \n```\nvoid setUnitIncrement(int new);\nvoid setBlockIncrement(int new);\n```\n\
    \nThe minimum value and the maximum value of the scrollbar can be obtained using\
    \ getMinimum() and getMaximum() methods. There are two types of the scrollbars—vertical\
    \ and horizontal. When creating scrollbars, the constants Scrollbar.VERTICAL and\
    \ Scrollbar.HORIZONTAL are used. When a block in the scrollbar is adjusted, AdjustmentEvent\
    \ is generated and hence the AdjustmentListener interface has to be used to handle\
    \ the scrollbar. Program 10.6 illustrates the use of scroll bars.\n\n+   * Program\
