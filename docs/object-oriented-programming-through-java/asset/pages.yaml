  md: '# Object Oriented Programming


    These characteristics differentiate object oriented programming from the traditional
    procedural programming model. They are now examined in more detail.


    # 1.3.1 Encapsulation


    An object encapsulates the methods and data that are contained inside it. The
    rest of the system interacts with an object only through a well-defined set of
    services that it provides.


    > The concept of sealing data and methods that operate on the data into an object
    (a single unit) is known as encapsulation.


    Encapsulation of data and methods within an object implies that it should be self-governing,
    which means the attributes contained in an object should only be modified within
    the object. Only the methods within an object should have access to the attributes
    that object. If the state of an object needs to be changed, there should be some
    service methods available to accomplish the change. one should never be able to
    access and change the values of an object''s attributes directly from outside.


    For example, embedding the attributes and methods defined for car in a single
    class is referred to as encapsulation (see Figure 1.1(b)). The methods described
    in the car can only modify/access the attributes defined in its class. Suppose,
    Zen is an object of car class, to set the parking light of Zen, use the method
    set_parking_light_on; however, other objects of the same class such as Maruti
    800 or objects of any other class cannot access/modify the value of parking_light
    for Zen.


    Encapsulation helps in building better, structured and more readable programs.


    # 1.3.1.1 Abstraction via encapsulation


    Encapsulation facilitates abstraction. A software object is an abstract entity,
    in that we view it from outside without concerning the details of how it works
    on the inside. For example, we do not need to understand the internal workings
    of the gears of a car to use it, we only need to know how to make it. Because
    of this source code for an object can be written and maintained independently
    by the source code for other objects. Also, an object can be easily passed around
    the system.


    Since, an object is a self-contained entity in a program, it can be referenced
    at different parts of the program wherever it is required. This feature enhances
    the modularity of the program. That the program consists of several modules, and
    if there are problems with any module, they can be addressed independently. Also,
    these modules can interact with each other without knowing the internal implementation
    of the other. Dividing a program into modules is called modularity; not having
    to know the internal implementation of a module is called abstraction. Hence,
    the feature of ‘abstraction’ facilitates a programmer to do ‘modular’ programming.'
