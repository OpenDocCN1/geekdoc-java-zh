  md: '# 4.1.1.1 Instance variables


    Instance variables are declared and defined in almost the same way as local variables,
    the main difference being their location in the class definition. Variables are
    considered instance variables if they are declared outside a method definition.
    It is customary to define instance variables just after the first line of the
    class definition.


    # 4.1.1.2 Constants


    A constant variable or constant is a variable whose value never changes.


    Constants are used to define shared values for all the methods of an object so
    that object-wide values that will never change can be given meaningful names.
    In Java, only instance and class variables can be constants (not local variables).
    To declare a constant, the keyword final is used. It should be placed before declaration
    of the variable and include an initial value for that variable, as shown in the
    following examples:


    ```

    final float pi = 3.14;

    final boolean debug = false;

    final int maxSize = 40000;

    ```


    Constants can be useful for naming various states of an object and testing them.
    For a test case that can be aligned left, right or centre, the values can be defined
    as constant integers.


    ```

    final int LEFT = 0;

    final int RIGHT = 1;

    final int CENTER = 2;

    ```


    # 4.1.1.3 Class variables


    Class variables are global to a class and to all instances of that class. Class
    variables are used for communication between different objects within the same
