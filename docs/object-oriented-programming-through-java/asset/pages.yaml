    # 12.7 Session Management


    In a web server, a session is a collection of all the requests made by a client
    (browser).


    HTTP is a stateless protocol. Between requests, it does not maintain any state
    of the client (browser). Suppose the client makes request for a web page, it should
    be checked whether the request is from an authorized user. It is impossible to
    check the authorization for each web page. It is necessary to maintain some information
    of the user while a user navigates between web pages. Thus, it is useful to maintain
    the state of client. The following processes are used to maintain the state of
    a client:


    +   * URL rewriting

    * Hidden fields

    * Cookies

    * Sessions


    Hidden fields are the easiest way of maintaining the state of a client. These
    are the same as the HTML input tags. These are specified as follows:


    ```

    <input type="HIDDEN" name="item" value="Book" >

    ```


    These tags will not display information on the web page but are very useful to
    present some information to the next page as name–value pairs.


    Rewriting URLs Rewriting the URL plays an important role in the session management
    of the HTTP. This method passes the state information between the client and server
    by embedding the information as name–value pairs in the URL.


    ```

    <A href="SampleServlet?item= Book&quantity=5">Items</A>

    ```


    or


    ```

    <form method="Get" action="SampleServlet?item= Book&quantity=5">

    ```


    Name–value pairs are placed within the anchor tag separated by the ampersand (&).
    The Servlet API is capable of accessing the QueryString (name–value pairs after
    the URL that are found after the question mark (?) by using the getPropertyValue()
    and getParameterNames() methods of the ServletRequest object.


    Cookies Another way to maintain the state of a client is by using cookies. A cookie
    is an object sent by the server to a client. A cookie is created by the server
    and to the client along with the requested response. Each cookie has a definite
    lifetime. In general, cookies are insecure and thus, they are considered to make
    privacy issues difficult.'
