    # 3.5.6 Bitwise operators


    Java declares a variety of bitwise operators. Programmers use these, operators
    to manipulate integer data types (int, long, short and byte) and the char type.
    These operators perform boolean algebra on the corresponding bits in their arguments
    to generate the result. Table 3.12 gives a description of bitwise assignment and
    shift operators.


    In order to unite/combine assignment, bitwise operators are joined with the sign.
    Legal operators include &= |= and ^=. (It should be noted that ~ is a unary operator
    it cannot be combined with the = sign.)


    In case of boolean data type, which is treated as a 1-bit value and so is somewhat
    different, programmers can perform bitwise AND, OR XOR operations. This is because
    a boolean data type is a 1-bit value. The bitwise NOT operation cannot be performed
    on boolean types.


    # 3.5.7 Shift operators


    Java also shift operators to manipulate bits. These operators can be used only
    with primitive integers. The left-shift operator (<<) acts on the operand to the
    left of the operator and produces a result shifted to the left by the number of
    bits specified after the operator (inserting zeros at the lower-order bits). The
    signed right-shift operator (>>) acts on the operand to the left of the operator
    and produces a result shifted to the right by the number of bits specified after
    the operator. The signed right shift >> uses sign extension: if the value is positive,
    zeros are inserted


    Table 3.12 Bitwise and shift operators.


    | Description | Operator | Results |

    |---|---|---|

    | Bitwise AND | & | Gives output 1 if both input bits are 1, else 0 |

    | Bitwise OR | | | Gives output 1 if at-least one of the input bit is 1, else
    0 |

    | Bitwise XOR | ^ | Gives output 1 if anyone bit is 1 but not both, else 0 |

    | Bitwise NOT | ! | Gives output 1 if input bit is 1 and output 1 if input bit
    is 0 |

    | Left-shift | << | Shifts the bits of operand to left by number of bits specified
    and insert zeros at lower order bits |

    | Right-shift | >> | Shifts the bits of operand to right by number of bits specified.
    If operand is positive, zeros are inserted at the higher order bits, ones are
    inserted in the higher order bits |

    | Zero-fill-right-shift | >>> | It is unsigned right shift. Shifts the bits of
    operand to right by number of bits specified and insert zeros at lower order bit
    irrespective of the sign of the operand.'
