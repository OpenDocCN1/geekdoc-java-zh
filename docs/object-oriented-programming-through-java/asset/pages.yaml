  md: "# Java as an OOP Language 113\n\ndefines a default finalizer method. To create\
    \ a finalizer method, override the finalize() method using the following signature:\n\
    protected void finalize() throws Throwable\nnThe body of finalize() method can\
    \ include several objects including super.finalize(). This object allows the parent\
    \ class to finalize an object, if necessary. The finalize() method can be called\
    \ at any time; however, calling finalize() does not trigger an object to be garbage-collected.\
    \ Only removing references to an object will cause it to be marked for deleting.\\\
    Finalizer methods are best used for optimizing the removal of an object (for example,\
    \ removing references to other objects) by releasing external resources that have\
    \ been acquired (for example, external files), or for other behaviours that may\
    \ make it easier for that object to be removed.\n\n# 4.2 Modifiers\n\nModifiers\
    \ are keywords used to define the scope and behaviour of classes, methods and\
    \ variables in Java. Java has a wide variety of modifiers that can be categorized\
    \ as shown below:\n\n+   * Modifiers for controlling access to a class, method\
    \ or variable, which are: public, protected and private. (These are also termed\
    \ access modifiers).\n* The static modifier for creating class methods and variables.\n\
    * The abstract modifier, for creating abstract classes and methods.\n* The final\
    \ modifier, for finalizing the implementations of classes, methods and variables.\n\
    * The synchronized and volatile modifiers, which are used for threads.\n* The\
    \ native modifier, which is used for creating native methods.\n\nGiven below some\
    \ examples of the above modifiers.\n\n```\npublic class MyApplet extends java.applet.Applet\
    \ {\n    private boolean SwitchState;\n    static final double pi = 3.14;\n  \
    \  protected static final int MAXNUMLEMENTS = 128;\n    public static void main(String[]\
    \ args) { }\n```\n\nIt should be remembered that there cannot be more than one\
    \ access modifier for a class, method or variable. All the modifiers are essentially\
    \ optional, none have to appear in a declaration. Object oriented programming\
    \ style suggests that modifiers should be added to best describe the intended\
    \ use of, and restrictions on, the things that are declared. In special situations\
    \ (for example, inside an interface) certain modifiers are implicitly defined."
