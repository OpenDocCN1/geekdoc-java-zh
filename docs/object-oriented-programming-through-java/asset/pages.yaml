  md: '# 13 Networking and Remote Method Invocation


    Java supports easy writing of network applications because it does not take into
    account implementation details that are operating system specific. The java.net
    package contains classes and interfaces that provide a powerful infrastructure
    for networking in Java. Many of the classes in this package provide support for
    working with sockets in Java. Remote Method Invocation (RMI) provides a distributed
    computing application interface for Java programs. It handles the communication
    between distributed objects. Java RMI allows a program running in one JVM to call
    method on a remote object running in another JVM. This chapter covers aspects
    of support provided by Java for network programming and RMI.


    # 13.1 Introduction to Networking


    Computers on the Internet communicate with each other using either the Transmission
    Control Protocol (TCP) or the User Datagram Protocol (UDP). Figure 13.1 illustrates
    the TCP/IP Networking model. When Java programs are written that communicate with
    each other over the network, programming is done at the application layer. The
    java.net package provides the features required for communication over a network
    and thus, the programmer need not be concerned about the TCP and UDP layers. The
    classes in the java.net package are responsible for providing system-independent
    network communication; to work with these Java classes, an understanding of TCP
    and UDP is essential.


    **Transmission Control Protocol** This is a connection-based protocol that provides
    a reliable flow of data between two computers. When reliable communication is
    desired between two applications a connection is established and data are sent
    back and forth over the connection.


    **User Datagram Protocol** This is a protocol that sends independent packets of
    data, called datagrams, from one computer to another and does not guarantee the
    communication between two applications on a network. Unlike the TCP, UDP is a
    connection-less protocol.'
