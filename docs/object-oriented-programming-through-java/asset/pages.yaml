  md: '# 12.3.1 Instantiating and initializing a servlet—the init() method


    When a server receives a servlet request from a browser, the servlet engine at
    the server does the following:


    +   * It finds the specified servlet or one or more instances of the servlet.

    * It instantiates one or more instances of the servlet class.

    * It initializes the servlet instances by calling the init() method.


    Initially, a servlet engine finds the servlet class and loads it into the JVM.
    A servlet class may reside on the local system, remote system or any other network
    resource. After loading the servlet class, the servlet engine instantiates an
    instance of the servlet class. To receive and handle client requests, the instantiated
    servlet must be initialized.


    The init() method initializes the instance(s) of the servlet. This method can
    be specified either with no arguments or with a ServletConfig object as an argument.
    This method throws the ServletException.


    ```

    public void init() throws ServletException;

    public void init(ServletConfig config) throw ServletException;

    ```


    This method is useful because all the initialization variables can be put in.
    The servlet gets access to resources (database connection, network resource and
    the like) to handle client requests during the initialization. If an error occurs
    during initialization, the init() method throws an UnavailableException(this is
    because of the network failure) or ServletException. Note that the System.exit()
    should not be called in the init() method.


    The init() method is called only when the servlet is requested by a browser (client)
    for the first time. It is not required to call this method for requests that follow
    the first request. Only one instance of the servlet is instantiated and this instance
    handles all browser requests. It is important to note that only a single instance
    of the servlet class will ever exist when the web server is running. It should
    be noted that there are many threads running within the JVM which share the instance.
    The init() method will not be called again unless the servlet is reloaded (reinstantiated).
    A servlet can not be reloaded unless the server destroys the servlet.


    ![](img/2146e82d591b04fc307195fd4ee73d50_412_0.png)'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# 12.3.2 Handling client requests and responses—the service() method


    The service() method is called in two cases:


    +   1. After the init() method is called

    2. On every subsequent request to that particular servlet

    The method follows the syntax given below:


    ```

    public void service(ServletRequest request, ServletResponse response) throws

    ServletException, IOException;Exception;

    ```


    Servlets are self-contained modules and do not have any main();instead they implement
    the method service() of the javax.servlet.Servlet class to handle requests. A
    servlet handles client requests at the server and sends the responses back to
    the clients.


    Figure 12.4 shows the flow of work in the handling of client requests by the web
    server. Each time a server receives a request for a servlet, the server creates
    a new thread and calls the servlet''s service() method. The service() method by
    default checks the HTTP header. Based on the header, it either calls doGet() or
    doPost() methods.


    # 12.3.3 Destroying the Servlet—the destroy() method


    Servlets run until the server destroys them. When the web server shuts down, it
    calls the servlet''s destroy() method using the following syntax.


    ```

    public void destroy();

    ```


    This method is useful in writing clean-up processes such as closing database connections,
    closing any socket connections and updating log files. The destroy() method is
    run only once. The server will not run the destroy() method again until after
    the server reloads and reinitializes the servlet. That is, the destroy() method
    is called only once in the servlet''s life-cycle.


    Before destroying the servlet instance, all threads running on the instance must
    complete the execution of the service() method. That is, before destroying the
    instance of the servlet, it must be ensured that all the threads providing service
    to clients must be completed.


    ![](img/2146e82d591b04fc307195fd4ee73d50_413_0.png)


    Fig. 12.4 Handling client requests.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '(See http://www.universitiespress.com/downloads/81-7371-572-6.pdf, the SampleServlet
    example in 12.2, which demonstrates the use of the three servlet methods.)


    HTTP servlets are, typically, capable of serving multiple clients concurrently.
    By default, multiple threads access the same servlet at the same time. If the
    methods in a servlet work for clients by accessing a shared resource, we have
    to do one of the following.


    +   - Synchronize the mode of access to the specific resource.

    - Create a servlet that handles only one client request at a time.


    Servlet API provides an interface called SingleThreadModel, which guarantees that
    only one browser request will be handled at a time.


    ```

    public class servletname extends HttpServlet implements SingleThreadModel

    {

    ```


    The SingleThreadModel interface ensures only one thread can execute the service
    method for a particular instance of servlet. For this purpose, it performs one
    of the following tasks:


    +   - Synchronizes the request.

    - Creates more than one instance.


    The choice whether to synchronize the request or create more than one instance
    will depend on the web server. Currently, web servers use a combination of these
    two techniques.

    A servlet also provides a description of itself by overriding the method getServletInfo().


