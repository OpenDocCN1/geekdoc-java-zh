  md: '# 5 Exception Handling


    Java offers an excellent exception-handling mechanism which is easy to understand
    and implement. Java treats exceptions as objects and all the exceptions (errors)
    are arranged in a hierarchy. Its features include exception propagation, handling
    multiple exceptions based on inheritance hierarchy and providing user-defined
    exceptions. This chapter starts with a general discussion of exception-handling
    in object oriented programming languages and covers various concepts of Java''s
    exception-handling features.


    # ## 5.1 Introduction


    An exception is an abnormal condition occurring during the execution of a program
    that causes it to deviate from the normal execution path. When an exception occurs,
    it makes further execution of the program impossible. An exception can be defined
    as follows:


    > An exception is an event that may cause abnormal termination of the program
    during its execution.


    Different types of error—user errors, logic errors or system errors—can cause
    exceptions. Examples of errors include division by zero, out of array bounds,
    running out of virtual memory, opening an invalid file for reading and trying
    to read from an empty stack.


    Whenever an error occurs during the execution of a program, it throws an exception.
    If the exception is not handled properly, the program execution is abruptly terminated,
    causing problems. In some books, the phrase ''throws an exception'' is sometimes
    replaced by ''raises an exception'' or ''triggers an exception''.


    Run-time error management in programming languages is a challenging task. In traditional
    programming languages such as C, Pascal and Fortran, common errors are handled
    by providing if-else statements. Detection of errors and handling them is often
    confusing, tedious and time consuming. On other hand, object oriented programming
    languages such as C++ and Java treat errors (or error conditions) as objects and
    provide exception handlers that are separate from the basic code so that the errors
    can be tackled efficiently.


    **What is involved in handling exceptions?** Exception handling is a mechanism
    that enables programs to detect and handle errors before they occur rather than
    allowing them to occur and suffering the consequences. It is designed for dealing
    with synchronous errors such as an attempt to divide by zero.'
