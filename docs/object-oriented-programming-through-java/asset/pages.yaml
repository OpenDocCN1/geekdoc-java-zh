    # 4.1.9 Inheritance, polymorphism and abstract classes


    A class represents a set of objects that share the same structure and behaviour.
    The class determines the structure of objects by specifying variables that are
    contained in each instance of the class, and it determines behaviour by providing
    the instance methods that express the behaviour of the objects. Object oriented
    programming really distinguishes itself from traditional programming in that it
    allows classes to express the similarities among objects that share some, but
    not all, of their structure and behaviour. Such similarities can be expressed
    using the properties of inheritance and polymorphism.


    # 4.1.9.1 Inheritance


    The term refers to the fact that one class can inherit a part or all of its structure
    and behaviour from another class. The class that inherits the property from another
    class (parent class) is termed child class (or sub-class). For example, if class
    B inherits all the properties of class A, then class B is the child class and
    class A is the parent class. (Sometimes the terms *derived class* and *base class*
    *sub-class* and *super-class* are also used, respectively, to denote the child
    class and parent class.)


    A sub-class can add to the structure and behaviour that it inherits. It can also
    replace or modify inherited behaviour (though not inherited structure). The relationship
    between the sub-class and super-class is sometimes shown by a diagram in which
    the sub-class is shown below its super-class is placed above and connected to
    it. This is illustrated in Figure 4.1.


    | Class A |

    | (super-class) |

    | --- |

    | Class B |

    | (sub-class) |


    **Fig. 4.1** A representation of class structure.'
