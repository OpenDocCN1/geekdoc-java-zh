    The method setConstraints sets the GridBagConstraints defined for the components
    of the GridBagLayout. This later, component is added to the container using the
    add() method.


    To use GridBagLayout, an object of the class GridBagConstraints must be constructed.
    This object specifies how a component is placed in a GridBagLayout. Several instance
    variables of the class GridBagConstraints are described briefly in Table 11.4.


    Variables gridx and gridy specify the top-left corner of the display area within
    the container. In the same way, the number of columns and the number of rows that
    a component would occupy are specified with the variables gridwidth and gridheight,
    respectively.


    Whenever the container is resized, the variable weightx specifies how to distribute
    the components in GridBagLayout along the changed horizontal space. If weight
    is zero, then the component cannot grow itself horizontally on its space; however,
    if another component in the same column has a non-zero value for weight, then
    the first component will grow horizontally in the same proportion as the latter
    component. This is because each component must be maintained in the same row and
    column in which it was originally placed. Similarly, the weight specifies how
    to distribute the components in the GridBagLayout along the changed vertical space


    The effects of weightx and weighty can be seen only when the window or container
    is resized. The components with larger weightx and weighty occupy more of the
    extra space that is created when the container is resized than components with
    less weightx and weighty.


    # Table 11.4 GridBagLayout constraints.


    | Instance variables of GridBagConstraints | Description |

    |---|--|

    | Gridx | Specifies the column in which the component will be placed. |

    | Gridy | Specifies the row in which the component will be placed. |

    | Gridwidth | Specifies the number of columns the component occupies. |

    | Gridheight | Specifies the number of rows the component occupies. |

    | Weightx | Specifies the portion of extra space to allocate horizontally. When
    this is specified components can become wider |

    | Weighty | Specifies the portion of extra space to allocate vertically. When
    this is specified components can become taller. |'
