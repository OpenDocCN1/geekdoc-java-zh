    Interfaces complement and extend the power of classes, and the two can be treated
    almost

    elike. One of the few differences between them is that an interface cannot be
    instantiated,

    t keyword new can create only instances of classes.


    # 4.4.2 Creating and extending interfaces


    Interfaces look very much like classes. They are declared in much the same way
    and can be

    aranged in a hierarchy. There are rules for declaring interfaces that must be
    followed. These are

