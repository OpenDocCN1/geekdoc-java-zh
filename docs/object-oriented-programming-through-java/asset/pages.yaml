  md: 'codebase This refers to the base URL of the applet. That is, the URL of the
    directory that contains the applet class file. If this attribute is not specified
    then the HTML document''s directory is taken as the CODEBASE.


    archive There are one or more archive files containing Java classes and other
    resources that will be preloaded. The classes are loaded using an instance of
    the AppletClassLoader class with the given codebase. The archives in archelist
    are separated by a comma, ( ).


    alt This refers to text to be displayed if the browser understands the applet
    tag but cannot run Java applets.


    name refers to a name for the applet instance which makes it possible for applets
    to communicate with each other on the same HTML page. The getApplet() method,
    which is defined in the AppletContext interface, can be used to get the applet
    instance using name.


    align refers to the alignment of the applet. The possible attribute values are
    LEFT, RIGHT, TOP, BOTTOM, MIDDLE, BASELINE, TEXTTOP, ABSMIDDLE AND ABSBOTTOM.


    vspace This refers to the space, specified in number of pixels, used as a margin
    above and below the applet.


    param The param tag, specifies an applet parameter as a name–value pair. The name
    is the parameters name, value is its value. The values of these parameters can
    be obtained using the getParameter() method.


    alternateHTML This is ordinary HTML to be displayed in the absence of Java or
    if the browser does not understand the applet tag. This is different from the
    alt attribute which understands the applet tag but cannot run, whereas the alternateHTML
    tag is provided when a browser does not support applets.


