  md: '# 13.2 Understanding Ports


    A socket is an end-point of a communication link. It is one of the most fundamental
    technologies of computer networking which allow applications to communicate using
    standard mechanisms built into network hardware and operating systems. A socket
    represents a single connection between two network applications. These two applications
    generally run on different computers. Applications can create multiple sockets
    for communicating with each other. Sockets are bi-directional and thus either
    side of the connection is capable of sending as well as receiving data.


    A socket with a number is called the port. Normally, a computer has a single physical
    connection to the network. All the data intended to be sent to that computer arrives
    through that connection; however, the data may be intended for different applications
    running on the same computer. Hence, through the use of ports, the computer knows
    which application the data is to be forwarded.


    Data are transmitted over the Internet are accompanied by the addressing information,
    which identifies the computer and the port it are sent to. A computer is identified
    by its 32-bit IP address, which is used by Internet Protocol (IP) to deliver the
    data to the right computer on the network. A port is identified by a 16-bit number,
    by means of which the TCP and UDP deliver the data to the right application.


    In a connection-oriented communication such as TCP, the server application binds
    a socket to a specific port number. Hence the system receives all the data that
    is destined to it from the server. A client can then meet the server at the server''s
    port as shown here to map the incoming data to a particular process running on
    a computer, by the TCP and UDP. In a connection-less communication such as UDP,
    the datagram contains only the port number of its destination and UDP routes it
    to the appropriate application.


    Port numbers are represented by 16-bit numbers, which range from 0 to 65,535.
    The port numbers ranging from 0–1023 are reserved for what are called well-known
    services, such as HTTP (port 80) and FTP (port 21) and other system services,
    and are restricted to such use. The above-mentioned ports are the well-known ports.
    Applications should not attempt to bind these ports.


    ![](img/2146e82d591b04fc307195fd4ee73d50_444_0.png)


    | Application (HTTP FTP, telnet,...) |

    | Transport (TCP, UDP,...) |

    | Network (IP,...) |

    | Link (Device driver, ...) |'
