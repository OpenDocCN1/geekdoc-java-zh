    # 10.2.3 Font


    The class Font is used to control graphical fonts using the methods and the constants
    defined in it. The Font class constructor takes three parameters—the name of the
    font, the style of the font and the size of the font. Fonts supported by Java
    are specified using the parameter font name. The font style parameter can be plain,
    bold, italic or a combination of these styles. Font style constants are Font.PLAIN,
    Font.ITALIC and Font.BOLD. The third argument will specify the size of the font
    in points. In general, a point is 1/72 of an inch.


