  md: '# 12


    # Servlets


    A Java servlet is a key component of server-side java development. A servlet is
    a server-side Java object that runs within JVM attached to a web server. Java
    is inherently suited for large client–server applications because of its cross-platform
    nature, which is extremely useful for the organization of heterogenous servers
    running under different operating systems such as Unix and Microsoft Windows.
    The servlet API is powerful and complex and it requires knowledge of HTML and
    Java.


    # 12.1 Introduction


    Servlets are Java classes, or in other words, modules that extend request-response-oriented
    mechanisms over Java-enabled servers. Servlets are executed at the server side,
    whereas applets are run at the browser (client side). That is, a servlet can be
    referred to as the server-side image of an applet. Like applets, servlets are
    called from HTML documents; however, unlike applets, servlets have no GUI and
    do not require the support of Java in the web browser.


    Servlets can run in any server that has a servlet engine as ISAPI for the Internet
    Information Server of Microsoft (IIS). Servlets are written using servlet API,
    which is provided by Sun Micros. The purpose of the servlet is to find out the
    server’s environment or protocol, as it cannot be found by servlet API.


    Servlets are most widely used within Hypertext Transfer Protocol (HTTP) servers.
    Many web servers support Java servlet technology. Hypertext Transfer Protocol
    is the communications protocol that is used to communicate between web browsers
    and servers. It is a simple protocol for the request–response mechanism. First,
    a client establishes a connection with a server and sends a request to it. The
    request usually contains a request method identifier, a Uniform Resource Locator
    (URL), some version information and other message information. The server responds
    with some status information, possibly followed by a message (in a format as text
    or HTML) containing the client requested.


    In general, client–server communication is supported by the HTTP protocol. The
    two commonly used request methods on the HTTP protocol are GET and POST. GET retrieves
    information that is located at the given URL and POST provides (posts) a block
    of information provided by the client to the server.


    The biggest performance benefit of servlets is that they do not require the creation
    of a new process for each request. Servlets support threads, so there can be one
    servlet invocation support multiple clients. In the web-server environment, servlets
    can run in parallel within the same process as the server. Servlets require only
    lightweight thread context switches. Servlets contain'
