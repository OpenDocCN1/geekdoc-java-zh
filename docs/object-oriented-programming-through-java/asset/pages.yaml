  md: '# Java as an OOP Language


    +   * Packages provide protection to variables, methods and classes in finer ways
    than can be done on a class-by-class basis.


    +   * Packages can be used to identify classes. Furthermore, when proper naming
    conventions are adopted, packages can be used to identify the programmer / organization.


    Although a package is typically a collection of classes, they can also contain
    other packages, forming yet another level of organization somewhat analogous to
    the inheritance hierarchy. Each ''level'' usually represents a smaller, more specific
    grouping of classes. The Java class library itself is organized along these lines.
    The top level is called Java, the next level includes names itself as IO, net,
    util and aw.


    # 4.3.1 Using packages


    In order to access a package within a particular program the keyword import followed
    by the package name is used. All the classes, variables and methods within a package
    can be imported. Java provides three mechanisms of using a class contained in
    a package:


    +   * If the class is contained within the package java.lang (for example, System
    or Date), then the class can be utilized by just giving its reference. This is
    possible because java.lang is the default package.


    For example,


    ```

    System.out.println("Learning packages");

    ```


    Since System is a class in the default package, there is no need of importing
    java.lang package or class java.lang.system. So, the class System can be used
    by just writing its class name, wherever it is used in a program.


    +   * If the class is in some other package (other than default package), that
    class can be referred by its full name (for example java.awt.Font). Classes that
    are frequently imported individually (or a whole package of classes). After a
    class or a package has been imported, it can be referred to using its class name.


    +   * If classes are not explicitly associated with a package, Java puts them
    into an unnamed default package. These classes can be accessed by just invoking
    their class names from anywhere in the code.


    # 4.3.2 Using package and class names in full


    To refer to a class in some other package, the syntax is to use the full name
    of the class preceded by the package name. In such cases, classes or packages
    need not be imported specifically. Instead, the following signature can be followed.


    ```

    // This accesses the Font class from

    java.awt.Font f = new java.awt.Font();

    // the java.awt package.

    ```'
