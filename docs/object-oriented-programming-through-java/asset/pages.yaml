  md: '# New Language Features of Java 1.5


    The Queue<int> type is called a constructed type. Here, every occurrence of T
    is replaced with the type argument int. In the example class Queue<T> there is
    only one type parameter. In general, generics type declaration can include more
    than one type parameter. Note that generics provide additional information in
    declarations.


    After compilation of a generic type, the compiler produces intermediate language
    instructions and metadata. When an application creates an instance of a generic
    type, the compiler converts the intermediate language instructions and metadata
    to native code. During this process, it substitutes the actual types for type
    parameters. So for the next call to same generic type, the compiler uses the same
    native code. Thus, the compiler maintains one copy of the native code for each
    generic instantiation with a value type and shares it for all other references.


    Generics provide a way to create and use type-safe data structures. Using generics,
    compile-time safety resolves type-casting problem. Examples of generics are ArrayList,
    Hashtable, HashMap, LinkedList, PriorityQueue, Queue, Stack, TreeMap, TreeSet
    and Vector. According to the programmers'' need, generics can be recompiled with
    different types. Consider the example below:


    +   List numbers = new List();


    Using generics, the code can be written as


    ```

    List<Integer> numbers = new List<Integer>();

    ```


    Note that insertion of elements other than string type results in an error at
    compile-time. This feature helps in fixing the bug at compile-time rather than
    having a run-time exception, as was the earlier versions of Java.


    Another advantage of generics is that after the declaration of generics, no type-casting
    is required. For example, the following statement


    ```

    String s1 = ((Integer) numbers.get(i).toString();

    ```


    can be written as shown below:


    ```

    String s1=numbers.get(i).toString();

    ```


    Other advantages of generics include generalizing existing methods, classes and
    interfaces. It is easier to understand than class method parameterization.


    A major goal of generics is that it increases type-safety without type variation.
    Type-mismatch errors occur at compile-time rather than at run-time and improve
    understandability of the code and APIs (Application Programmer Interface). The
    generic feature makes Java a strongly typed language. That is, an error occurs
    during compile-time itself, whenever a wrong type is used.


