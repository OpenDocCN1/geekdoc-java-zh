  md: '# 2.4 Applications and Applets


    Typically, Java programs are compiled into applets or applications. Applications
    are stand-alone programs executed by a virtual machine, while applets are intended
    to be loaded into and interpreted by a browser such as Netscape or Internet Explorer.
    Applets are more complex than applications because they interact with the current
    environment of the browser, while applications are more like standard programs.
    Applets are discussed in detail in chapter 10.


    Java has no pointer types and presents a computation model in detail that guarantees
    safety. Thus, when an user executes a Java application or applet from an untrusted
    source, or he can be assured that the Java program will not use the memory in
    unknown or perhaps malignant manner.


    Moreover, the popularity of Java code distribution has come about because it is
    portable. Unlike source code, byte code can be distributed. When an application
    has to be given to multiple users working on different platforms, the Java byte
    code can be distributed instead of the source code. A byte code cannot be modified
    by a programmer this limits software piracy.


