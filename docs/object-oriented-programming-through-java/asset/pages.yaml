    The example below illustrates how to read characters using the FileReader.


    ```

    FileReader fr = new FileReader("filename.txt");//Create a FileReader class from
    the file filename.txt.

    int i = fr.read(); //Read a character

    ```


    Internally, to represent characters in computers, a character-encoding scheme
    (for example, ASCII) is generally used and every platform has a default character-encoding
    scheme. Java uses 16-bit Unicode character-encoding scheme to represent characters
    internally. The Reader classes support conversions of Unicode characters to internal
    character storage. Besides default encoding, Reader and Writer classes can also
    specify which encoding scheme to use.


    Most programs use Reader and Writer streams to read and write textual information.
    This is because they can handle any character in the Unicode character set. On
    the other hand, the byte streams are limited to ISO-Latin-1 8-bit bytes.


    # 7.2.2 Byte streams


    Byte streams are used in program to read and write 8-bit bytes. InputStream and
    OutputStream are the abstract super-classes of all byte streams that have a sequential
    nature. InputStream and OutputStream provide the Application-Program Interface
    (API) and partial implementation for input streams (streams that read bytes) and
    output streams (streams that write bytes). These streams are typically used to
    read and write binary data as those related to images and methods. Methods of
    these two classes throw the IOException. All methods of the OutputStream will
    have the return type void.


