    # 2.1 Introduction


    A computer program is usually written using a programming language (such as C,
    C++ or Java). It can be defined as follows:


    > A program is a series of instructions (usually long and complex) that are carried
    out (or executed, or run) by a computer.


    These instructions define what the program does, whether it is a word processor,
    spreadsheet, game or any other kind of program.

    Programming can fall into the category of application programming or systems programming.

    Application programming is a programming process that is aimed at developing an
    application (such as banking applications, railway reservation application and
    so on) to be used by people (end users). Systems programming, on the other hand,
    is the activity of writing, amending or extending the operating system, which
    is a program that runs on the computer hardware in order to allow other applications
    to be run.


    # 2.1.1 Overview of Java technology


    Java technology is simultaneously a programming language and a platform.'
