  md: 'Java Application Programming Interface (JavaAPI) This is a collection of software
    components that offer very useful functions. The API is grouped in the form of
    packages (libraries) of interrelated classes as well as interfaces.


    # 2.1.2 A short history of the development of Java


    +   - Java is a result of the efforts of programmers in the early 1990s to develop
    a portable, secure and scalable language to be used for communication between
    electronic devices.

    - A team of programmers led by James Gosling of Sun Microsystems developed the
    first version of Java. This version was called Oak. Java language was meant for
    programming the embedded systems in consumer electronics devices.

    - Since the Oak trademark was already registered with some other organization,
    Sun Microsystems renamed the language Java, in January 1995.

    - During the period when Oak was being developed, the computer world witnessed
    the emergence of the Internet. As Internet usage became widespread, the need for
    a portable, secure programming language increased. Java fit the bill perfectly.
    Initially developed for use on different electronic devices, the language was
    later adapted for Internet programming.

    - Java met all the requirements specified for web-based applications as it could
    be used to write platform-independent code.

    - In 1995, Sun Microsystems released the first version of the Java Development
    Kit (JDK) and HotJava, Java was capable of running Java applications in the form
    of Java Applets embedded in web pages, a feature since taken up by browsers from
    Microsoft and Netscape.


    An important consequence of the evolution of Java is that it has grown into a
    full-scale development system, capable of being used for developing large applications
    that exist outside of the web (Internet) environment that is, all of program that
    run on a PC), including those that make extensive use of networking to enable
    communication between programs.


    Sun Microsystems are now working to further refine and develop Java language.
    In addition, they are also working on other Java tools and applications. Prominent
    among these are the following:


    +   - Java Beans—the Java object component technology.

    -—a complete web server application written in Java, supporting servlets.

    - JDBC Database Connectivity, providing a Java-based interface to SQL databases.

    - Java Workshop—a Java programming environment for developing Java programs which
    is itself written in Java.


    To get the latest updates on other Java tools and applications, readers can refer
    to the website of Sun Microsystems—http://www.sun.com.'
