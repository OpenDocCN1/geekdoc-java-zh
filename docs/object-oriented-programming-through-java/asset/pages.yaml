    \ programs. Applets are usually small in size and facilitate event-driven applications\
    \ that can be transported over the web.\n\nAn applet is a Java code that must\
    \ be executed within another program. It mostly executes in a Java-enabled web\
    \ browser. An applet can be embedded in an HTML document using the tag <APPLET>\
    \ and can be invoked by web browser. Parameters can be passed to an applet using\
