  md: '# Table 7.4 Methods contained by the Reader class, for reading character arrays.


    | Name of method | Description |

    | --- | --- |

    | int read() | Returns the integer specifying the next available character in
    the input stream. Otherwise, it returns -1, that is, the end of the file. |

    | int read(char cbuf[ ]) | Allows reading up to the buffer and returns the number
    of characters read. Otherwise, it returns -1. |

    | int read(char cbuf[ ], int offset, int length) | Attempts to read number of
    characters specified by length from the offset. Otherwise, it returns -1. |


    # Table 7.5 Methods contained by the InputStream class, for reaching arrays of
    bytes.


    | Name of Method | Description |

    | --- | --- |

    | int read() | Returns integer specifying the next available byte in the input
    stream. Otherwise, it returns -1, that is the end of the file. |

    | int read(char cbuf[ ]) | Allows reading up to the buffer and returns the number
    of bytes read. Otherwise, it returns -1. |

    | int read(char cbuf[ ], int offset, int length) | Attempts to read the number
    of bytes specified by length from the offset. Otherwise, it returns -1. |


    Similarly, Writer and OutputStream are parallel concepts. Like Reader and InputStream,
    Writer (or OutputStream) defines the following methods for writing characters
    (or bytes) and arrays of characters (or arrays of bytes):


    ```

    void write(int c)

    void write(char cbuf[ ])

    void write(char cbuf[ ], int offset, int length)

    ```


    These methods are used to write into the invoking stream. The first method writes
    a single character (or byte, in the case of OutputStream) to the invoking output
    stream. The second method writes the complete array into the invoking output stream.
    The final method writes the sub-range of the length of characters (or bytes, in
    the case of output stream ) starting from the offset value of the buffer to the
    invoking stream.


    All of these stream classes, namely, Reader, Writer, InputStream and OutputStream
    are automatically opened when they are created. A stream can be closed implicitly
    or explicitly. When the stream object is no longer referenced, the garbage collector
    can implicitly close it. Alternatively, the close() method may be used to close
    the stream explicitly.


    In addition to read(), write() and close() methods, Table 7.6 lists some other
    methods that belong to InputStream and OutputStream classes.'
