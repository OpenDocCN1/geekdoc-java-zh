  md: '# Networking and Remote Method Invocation 437


    On the server side, the skeleton object interprets the information from the stub,
    and passes it to the object that executes the remote method. On every call, it
    does the following:


    +   - Unmarshall the parameters

    - Call the desired method

    - Capture the return value or exception

    - Marshall that value

    - Send it to the client stub


    # 13.6.1 Programming a client


    The client is a Java program. It is not necessarily a part of a remote or serializable
    class, though it makes use of the Remote and Serializable classes.


    A Remote method may return a Remote object when it is invoked, but a Remote object
    is essential to invoke the Remote method. There must be a separate mechanism for
    obtaining the Remote object first. This requirement is fulfilled by the Object
    Registry, which allows obtaining a Remote object using its name. The name of a
    remote object includes the following information:


    +   - The Internet name of the machine that runs the Object Registry, with which
    the remote object is registered

    - The port number to which it is listening


    If the Object Registry is running on the same machine that has requested it, then
    the name can be omitted. If the Object Registry is listening to the default port,
    1099, then it can be omitted. To see how this works, the following code is considered:


    ```

    String pro2serintfURL = "rmi://" + "127.0.0.1/Pro2serintf";npro2serintf pro2serintf
    = (Pro2serintf)Naming.lookup(pro2serintfURL);

    ```


    ```

    b=pro2serintf.Filedatalatrans(filename,filepath);

    ```


    In this code, the Naming.lookup method obtains an object handle from the Object
    Registry that runs on the local host and listens to the default port. The result
    of lookup must be type cast to the type of the Remote interface. The return value
    of the RMI in the above example is a byte array, which is converted to a file
    and stored in the desired directory. A byte array object is returned, as it is
    a Serializable class.


    # 13.6.2 Programming a server


    The server is also a Java program. It is not necessarily a Remote or a Serializable
    class.

    If class definitions for the Serializable classes from another machine are not
    to be downloaded, then the security policy of the program must be modified. To
    achieve this purpose, Java provides a security manager called RMISecurityManager.
    The RMISecurityManager defines a security policy that allows the downloading of
    Serializable classes from another machine.'
