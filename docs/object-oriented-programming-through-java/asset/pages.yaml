  md: "# Object Oriented Programming through Java\n\nInstance variables These are\
    \ members of a class and are instantiated for each object of the class. In other\
    \ words, all instances, that is, of the class will have their own instances of\
    \ these variables, which are local to the object. The values of these variables\
    \ at any given time constitute the state of the object. The data type should be\
    \ specified explicitly for a variable at the time of declaration.\n\nStatic variables\
    \ or class variables These are also members of a class, but these are not instantiated\
    \ for each object of the class and therefore belong only to the class.\n\nWhen\
    \ a variable is declared static, it can be accessed before any objects of its\
    \ class are created, without reference to any objects. Instance variables declared\
    \ as static are, essentially, global variables when objects of its class are declared;\
    \ no copy is made of a static variable. Instead, all instances of the class share\
