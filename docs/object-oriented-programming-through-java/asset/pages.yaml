- img_proc: true
  md: 'an initialization method that allows for expensive processes, for example database
    connections, to be performed only once at servlet start-up time. This means that
    all the client requests to a servlet can share global resources and take advantage
    of caching. Java can be scaled to take advantage of additional processors, so
    that the servlet''s throughput and response time can improve on more powerful
    servers.


    # 12.1.1 Advantages of servlets


    Servlets have several advantages:


    +   - Servlets are faster because the initialization takes place only once and
    it can be used to handle multiple client requests.

    - Servlets have access to a large set of Java APIs. As servlets are written in
    Java, they can be used on multiple platforms that support the JVM.

    - Servlets are persistent and hence can save status information.

    - Servlets are easier to maintain and understand as they are fully object oriented.

    - Servlets are secure as they are in Java security sandbox.


    # 12.1.2 Writing servlets


    To write the servlet, the following packages are required that have to be imported
    in the code:


    ```

    import javax.servlet.*;

    import javax.servlet.http.*;

    import java.io.*;

    ```


    The user-defined servlet class must extend the Servlet class. Since the request-response
    between the client and the web server is handled by HTTP, we have to extend the
    HttpServlet class. The classes HttpServletRequest and HttpServletResponse handle
    the request and response mechanisms, respectively, for servlets. In general, HTTP
    provides the service to the client with the methods doGet() and doPost(). The
    user interface is usually carried out through HTML code and servlet requests are
    sent using this code. The HTML code must be saved with the extension .html. Programs
    12.1.a, b illustrate how such a code may be written.


    Program 12.1.a Example of a servlet-HTML code.


    ```

    <HTML>

    <HEAD>

    <TITLE> New Document </TITLE>

    </HEAD>

    <BODY>

    <form method="post" action="http://localhost:8080/test/servlet/HtmlToServlet">

    ```'
