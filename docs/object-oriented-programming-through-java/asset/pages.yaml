    # 6.4 Thread Priorities and Thread Scheduling


    Each new thread inherits the priority of the thread that it creates. That is,
    when a new thread is created, the new thread has priority equal to the priority
    of the creating thread. Every Java thread has a priority between 1 and 10, and
    by default each thread is given normal priority, that is, 5. The constants defined
    in the Thread class are the following:


    +   - Thread.MIN_PRIORITY 1 (minimum priority)

    - Thread.MAX_PRIORITY 10 (maximum priority)

    - Thread.NORM_PRIORITY 5 (default)


    Higher the integer value assigned, higher the priority of the thread.


    # 6.4.1 setPriority and getPriority


    A thread''s priority can be set with setPriority method, which takes an int argument.
    getPriority returns the thread''s priority. If the argument to the setPriority
    method is not in the range from 1 to 10, it throws IllegalArgumentException.


    # 6.4.2 Time-slicing


    Some Java platforms support a concept called time-slicing and some do not. Without
    time-slicing, each thread in a set of equal-priority threads runs to completion
    (unless the thread leaves the running state and enters the waiting, sleeping or
    blocked state) before thread''s peers get a chance to be executed. For more than
    two threads having equal priority the thread will be selected on round robin scheme.
    With time-slicing, each thread receives a brief amount of processor time, called
    a quantum, during which that thread execute. At the end of the quantum, even if
    that thread has not executed fully, the processor is taken away from thread and
    given to the next thread of equal priority if such a thread is available. Note
    that, in this context, ''thread''s peers'' refers to the active threads (which
    are alive). The ''next thread'' means the next thread that is ready for execution.
    The scheduler decides which one is the next thread for obtaining processor time.


