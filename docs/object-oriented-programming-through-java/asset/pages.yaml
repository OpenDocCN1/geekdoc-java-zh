  md: '# 12.2 How to Run Servlets


    Web servers such as Jakarta Tomcat and Java web servers provide built-in servlet
    engines for the servlets. In the case of the Internet Information Server (IIS)
    and APACHE web servers, we need the servlet engines by name ISAPI and NSAPI to
    be added to them to make compatible with the servlets.


    Before executing the servlet, we should set the classpath to the Servlet API jar
    file within the web server. The jar file contains all the class files of the servlet
    API.


    The steps to run the servlets when Tomcat web server is used is as follows:


    +   * First the class path is set as below:

    set classpath=C:/Program Files/Apache Tomcat 4.0/common/lib/servlet.jar;

    * Next, the servlet is written by extending the Servlet API and is saved within
    the root directory of the server (or any other user-specified directory within
    the root). The root directory for Tomcat is given below:

    c/Program Files/Apache Tomcat 4.0/webapps/root

    * To run the servlet class from the root directory, the class file is placed in
    the classes folder of the WEB-INF directory in the root and the servlet is requested
    from the browser as shown below:

    http://localhost:8080/servlet/servletname.


    Here, servletname is the name of the servlet. The name of the servlet follows
    the standard format packagename. ClassName.


    +   * To run the servlet from a separate directory, which is called, for instance,
    mydirectory, the directory is created in the webapps folder as for the Tomcat
    directory structure:

    c:/program Files/Apache Tomcat 4.0/webapps> md mydirectory;

    c:/program Files/Apache Tomcat 4.0/webapps> cd mydirectory;

    c:/program Files/Apache Tomcat 4.0/webapps/mydirectory> md web-inf;

    c:/program Files/Apache Tomcat 4.0/webapps/mydirectory> cd web-inf;

    c:/program Files/Apache Tomcat 4.0/webapps/mydirectory/web-inf> cd classes


    Once the directory is created, the class-files of the servlets are saved in the
    classes directory. In general, the classes folder contains only the class files
    of the servlet. So, there is no need to have a Java file in the classes folder.


    Every application directory (like mydirectory) in Tomcat includes the Web-Inf
    sub-directory which contains the Web.xml file is used to specify an alias name
    or initialization parameter to the servlet. In addition, this file is also used
    to specify the attributes provided by the servlet container. The two terms servlet
    container and servlet engine are used interchangeably.


    ![](img/2146e82d591b04fc307195fd4ee73d50_409_0.png)'
