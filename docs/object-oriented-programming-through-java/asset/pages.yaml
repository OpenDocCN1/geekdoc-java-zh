    # 2.7 Java Source File Structure


    The source code of a Java program is written in a plain text file, which is commonly
    referred to as Java source file. The extension of this file name is .java. The
    source file contains the code required to perform a particular task.


    A Java source file consists of the following elements:


    +   * An optional package definition to specify a package name: classes and interfaces
    defined in the file will belong to this package. If the package name is not given,
    the definitions will belong to the default package.

    * A number of class and interface definitions: technically a source file need
    not have any such definitions, but that is highly useful. The classes and interfaces
    can be defined in any order. Note that JDK imposes the restriction that only one
    class may be defined per source file, and it requires that the file name match
    this class. If the name of the public class is NewApp then the file name must
    be NewApp.java.


    The above structure is depicted by a skeletal source file as shown below.


    Java Source File Structure


    ```

    // Filename: NewApp.java

    // PART 1: (OPTIONAL)

    // Package name

    package com.company.project.Package;

    // PART 2: (ZERO OR MORE)

    ```


