    the class Arc2D takes seven parameters. The first two parameters represent the
    coordinates of the arc. The third and fourth parameters represent the overall
    width and height of the ellipse of which this arc is a section, respectively.
    The fifth parameter specify the starting angle of the arc in degrees given double.
    The sixth parameter specifies the extent of the arc in degrees. The last parameter
    specifies the type of the arc that is to be (In the above example, the type is
    PIE). The type can be OPEN, CHORD or PIE.


