    # 8.2 Java Applications Versus Java Applets


    Java programs consist of applications and applets. Java applications are stand-alone
    programs and typically executed using the Java interpreter. On the other hand,
    Java applets are executed in a web browser or in a special window known as the
    Appviewer; however, the compilation stages of both are the same.


    The structure of applet differs from that of application programs; for example
    applets do not have the main() method. Applets do not interact with the console
    operations (that is, I/O operations) like application programs. Applets allow
    the user to interact through AWT.


    Applets differ from applications in the way they are executed. An application
    is started when its main() method is called. In the case of applets, an HTML file
    has to be created, which tells the browser how to load and how to run the applet.
    Java, however, allows a programmer to create software code that can function both
    as a Java application and a Java applet using a single class file. Table 8.1 illustrates
    the similarities and differences between Java applications and applets.


    # 8.3 Applet Life-cycle


    Applets need not be constructed externally. The run-time environments associated
    with the applets context, either the browser or the applet viewer, automatically
    construct them. Every applet must extend the Applet class. Unlike application
    programs, Java applets have a special programming structure.


    An applet has a life-cycle, which describes how it starts, how it operates and
    how it ends. Figure 8.2 shows the life-cycle of an applet. The life-cycle consists
    of four methods: init(), start(), stop() and destroy(). These methods are used
    as follows:


    +   - init() is called only once when the applet is first loaded and created by
    the browser.

    - start() it runs whenever the applet becomes visible.'
