  md: '# Object Oriented Programming through Java


    Allowing the programmer to write applications that interact with what appear to
    be physical objects make the task of writing computer programs easier.


    When an application is being created using OOP, the programmer needs only to remember
    a small set of flow-control commands and how to interact with the objects that
    his/her application uses.


    Object oriented programming is built on the concept of reusing code through the
    development and maintenance of object libraries. These objects are available for
    building and maintaining other applications. Usually, a library contains the code
    for various functions that are commonly required during the program development.
    These libraries can be language-specified or user-defined. Unlike traditional
    libraries, OOP languages provide object libraries which contain code along with
    the data in the form of objects, in addition to the names and entry points of
    the code located within. Objects of an object library are available for building
    and maintaining other applications.


    # 1.2 Objects and Classes


    Objects and classes are the building blocks of OOP. To understand OOP, first we
    have to know what objects and classes are.


    An object is a programming entity in OOP. It has data components representing
    the present state of an object as well as functions (called methods). Data components
    are termed attributes in the context of OOP languages. An area of memory is kept
    aside to store values for the attributes when an object is created. Functions
    define the behaviour of the object and allow the other programming entities to
    interact with the object.


    > An object contains attributes (variables) and methods (member functions). Attributes
    are the data associated with the object and the methods are the functions and
    code which operate on the data.


    A class is a model to define objects. In other words, an object is said to be
    an instance of a class. An object may be real or abstract. That, objects can model
    concrete things such as people, and data entry forms as abstractions as numbers,
    equations or geometrical concepts.


    Consider an example of a class—the class describes all car objects by specifying
    the data components and the methods that it can have. Various objects defined
    in the class could be Maruti 800, Zen, Santro, Accent and so on. The car has various
    attributes such as the seating capacity, maximum speed, engine capacity, parking
    light, current speed and current position. Typical functions of the car are to
    find acceleration and set parking lights on. See Figures 1.1(a) and (b) for an
    illustration.


    Real-world objects have two characteristics: state and behaviour. For example,
    an object ball has particular characteristics such as its diameter, colour and
    elasticity. Formally, we say that these characteristics contribute to the ball''s
    state being. We also describe a ball by what it does, such as the fact that it
    can be thrown, bounced or rolled. These activities define the ball''s behaviour.
    Similarly the object car has state (colour, wheels, current gear, number of gears
    and so on) and behaviour (braking, changing gears, accelerating, decelerating
    and so on).'
