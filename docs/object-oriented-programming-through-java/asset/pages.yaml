    # 3.5.8 Ternary If-Else operator


    This operator is unusual because it has three operands. It is truly an operator
    because it produces a value, unlike the ordinary if-else statement. The expression
    is of the form


    ```

    boolean-exp ? value0 : value1

    ```


    For example, when calculating the maximum of three numbers:


    ```

    d = (a>b)? (a>c): a; (b>c): b; c; where a, b, c, d are numerical values.

    ```


    If the values of a, b, c are 4, 5, 6, respectively, then, first a and b are compared;
    that is (4 > 5). This result is false, so the control jumps to the condition b
    > c, that is (5 > 6), whose result is again false. Hence the final result is c,
    and that is 6.


    If boolean-exp evaluates to true, value0 is evaluated and its result becomes the
    value produced by the operator. If boolean-exp is false, value1 is evaluated and
    its result becomes the value produced by the operator.'
