    | TYPE_FORWARD_ONLY | CONCUR_READ_ONLY |

    | TYPE_SCROLL_INSENSITIVE | CONCUR_UPDATABLE |

    | TYPE_SCROLL_SENSITIVE | |


    In addition to the next() method, the scrollable cursors in JDBC 2.0 API provide
    options such as absolute, previous and relative. That is, in a scrollable ResultSet
    object, the cursor can be moved backwards and forwards, to an absolute position
    or to a position relative to the current row. Examples of these are given below:


    ```

    rs.absolute(5);// move the cursor to the fifth row of rs (absolute position from
    the first row)

    rs.relative(5); // move forwards five rows from the current row

    rs.relative(-2); // move backwards two rows from the current row

    rs.previous(); // move one row backwards from the current position.

    ```


    With the help of JDBC 2.0 API, result sets can also be used to update a data source
    by positioning on the row and specifying the replacement value then calling updateRow().
    A similar set of methods can be used to insert rows.

    The may be used in two ways: (i) to update a column value in the current row and
    (ii) insert a row with column values into a table.


    The following code fragment updates the NAME column in the fifth row of the ResultSet
    rs and then uses the method updateRow to update the data source table from which
    rs was derived.


    ```

    rs.absolute(5);

    rs.updateString("empname", "Kumar");

    rs.updateRow();

    ```


    An updatable ResultSet object has a special row associated with it that serves
    as a staging area for building a row to be inserted. The following code fragment
    moves the cursor to the insert row, builds a two-column row and inserts it into
    rs and into the data source table using the method insertRow().


    ```

    rs.moveToInsertRow();

    rs.updateString(1, "Kumar");

    rs.updateString(2, "2384");

    rs.insertRow();

    rs.moveToCurrentRow();

    ```'
