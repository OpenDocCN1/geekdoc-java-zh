  md: '# 336 Object Oriented Programming through Java


    Before any of the radio button menu items are selected the text is displayed in
    plain font. If the Bold Italic menu item is selected, the text displayed will
    be as follows:


    ![](img/2146e82d591b04fc307195fd4ee73d50_354_0.png)


    When the user clicks the right mouse button on the PopupTest window, a JPopupMenu
    of fonts is displayed. If the user clicks one of the menu items that represent
    a font (that is, JRadioButtonMenuItem), then the actionPerformed() method of the
    class ItemHandler changes the font of the text displayed to the appropriate font.  The
    constructor for the class Pop-up test defines the JPopupMenu.


    ```

    final JPopupMenu popupMenu = new JPopupMenu();

    ```


    In Program 11.1, the class PopupTest extends the class JFrame and implements the
    interface MouseListener. In this class, an inner class which implements the Listener
    interface is overridden to check for the pop-trigger event. The methods mousePressed()
    and mouseReleased() are overridden. Each method calls the private method checkForTriggerEvent
    to determine if the popup-trigger event occurs. The method isPopupTrigger returns
    true if the popup-trigger event occurs. The method show() of JPopupMenu is invoked
    to display the pop-menu. The first argument of the show() method specifies the
    origin component, whose position helps determine where the pop-menu will appear
    on the screen. The last two arguments are the x and y coordinates from the origin-component''s
    upper-left corner at which the pop-menu should appear.


    When a menu item is selected from the pop-menu, the method actionPerformed() of
    the inner class ItemHandler determines which object of JRadioButtonMenuItem was
    selected by the user and accordingly displays the appropriate text on the window.


    Other than the items listed above, the JPopupMenu class contains methods to set
    the invoker, label and size of the pop-up menu.


