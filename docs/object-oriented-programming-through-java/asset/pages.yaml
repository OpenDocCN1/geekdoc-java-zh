  md: '# 11 Swings


    Advanced GUI components in Java are found in the javax.swing package. They are
    referred to as lightweight components, as opposed to the heavyweight AWT components.
    The main difference between these two is that heavyweight components are platform-dependent
    and lightweight components are platform-independent and contain built-in Java
    classes. The Swing packages contain advanced controls such as trees and tables.
    This chapter gives an overview of Swing packages.


    # 11.1 Introduction


    Java foundation classes encompass a group of features for building graphical user
    interfaces (GUIs) and adding rich graphics functionally and interactivity to Java
    applications. The Swing package contains the features that are required for general
    GUI components: for example, buttons, split panes, tables and menu bars. Swing
    has been included in the Java 2 platform, Standard Edition, J2SE 1.2. Swings are
    developed based AWT architecture. A significant benefit of layering is that greatly
    facilitatesing AWT-component programs to Swing. In fact, as both AWT and Swing
    components use the same AWT infrastructure, it is possible to mix both components
    in the same program.


    Some of the features of Swing packages have been summarized in the list below:


    +   - AWT components are operating system-dependent (that is, they use native
    methods) whereas Swing components are pure Java classes.


    +   - The Swing package introduces new layout managers, namely, BoxLayout and
    OverlayLayout.


    +   - It is possible to draw borders in many different styles around the components
    using thesetBorder method of the Swing package.


    +   - Components of the Swing packages are Java-Bean compliant. This enables them
    to be used in other Java-Bean compliant Toolkits.


    +   - Swing components contain a pluggable look-and-feel component (plaf), which
    allows the user to change the look and feel during run-time.


    The Model-View-Controller (MVC) is used to develop the swing components. Model
    contains the data to be displayed, View is used to display the data and Controller
    transforms the data. separation of model from view enables data to be displayed
    simultaneously in different views.'
