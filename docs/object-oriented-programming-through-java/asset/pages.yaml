  md: '# The Abstract Window Toolkit


    ![](img/2146e82d591b04fc307195fd4ee73d50_317_0.png)


    Fig. 10.1 An Applet.


    # Event Handlers


    An event is generated when an action occurs, such as a mouse click on a button
    or a carriage return (enter) in a text field. Events are handled by creating listener
    classes which implement listener interfaces. The standard listener interfaces
    are found in java.awt.event.


    # Layout Manager


    A layout manager is automatically associated with each container when it is created.
    Examples of these are BorderLayout and GridLayout.


    # 10.2 Basic Classes in SWT


    # 10.2.1 The class Graphics


    The class Graphics is an abstract class that provides methods for drawing and
    manipulating fonts and colours. This class performs drawings differently on different
    platforms. For example, drawing an ellipse in a Microsoft Windows operating system
    will have different capabilities when compared with doing the same thing in a
    UNIX system. The drawing capabilities in each platform are achieved by implementing
    platform-dependent sub-classes of the Graphics class. Therefore all these platform-dependent
    classes are hidden by this Graphics class, which helps the programmer to write
    platform-independent code.


    # 10.2.2 Colours


    The color class is used to manipulate colours using the methods and constants
    defined in it. Every colour is a combination of red, green and blue. Combinations
    of these three colours, which take values from 0 to 255 or 0.0 to 1.0, can generate
    any new colour. Therefore, the Color class has two constructors, one takes integer
    parameters and another takes float parameters.


    ```

    public Color(int r, int g, int b);

    public Color(float r, float g, float b);

    ```


    The Graphics class has the methods set and get which can be used to set the colour
    of the object that is being drawn and to get the colour of the drawing object,
    respectively.'
