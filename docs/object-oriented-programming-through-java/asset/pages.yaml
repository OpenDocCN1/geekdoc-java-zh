  md: '# 434 Object Oriented Programming through Java


    ![](img/2146e82d591b04fc307195fd4ee73d50_452_0.png)


    Fig. 13.5 Architecture of RMI.


    A remote method can be invoked by referring to the remote object. The object is
    exported through a server application and a remote client, either by looking up
    the object name in the registry or by checking the value returned from the remote
    method. This object must implement at least one interface that is extended by
    the java.rmi.Remote interface. All interactions with the remote object will be
    performed through this interface only. Basically, this interface describes the
    methods, which can be invoked remotely, and the remote object then implements
    it.


    When a remote object is referenced, the object is not sent over the network to
    the client that requests it. Instead, a proxy (often referred to as stub), which
    is a client-side proxy for the remote object, is sent. The client interacts only
    with this stub class. The stub class is responsible for handling data between
    the local and the remote systems. One remote object can be referenced by many
    clients. In that case, each client has its own stub object, which represents remote
    object. But in no case is the remote object duplicated.


    A skeleton class is responsible for handling over the method, class and data to
    the actual object being referenced on the server side. This acts as the server
    proxy for the object that is being exported.


    The actual implementation of the client–server application takes place at the
    Application layer. Any application that makes some of its methods available to
    its remote clients must first declare the methods in an interface that extends
    java.rmi.Remote, which is an empty interface. The main difference between remote
    and normal interface is that the remote interface throws the remote exception.
    If a class is to implement these remote interfaces, it must first implement the
    UnicastRemoteObject in the java.rmi.server package. Finally, the application registers
    itself with a naming server or with the registry with the name to obtain reference
    to its remote objects. The client simply requests the remote object from the registry
    with the given name. The reference to the remote object is cast to one of its
    remote interfaces in order to call the remote methods. The high-level calls can
    then access and export remote objects.


    The Java RMI architecture consists of three layers: (i) Proxy Layer (or Stub/Skeleton
    layer) (ii) Remote Reference Layer (RRL) (iii) Transport Layer. These are described
    below:'
