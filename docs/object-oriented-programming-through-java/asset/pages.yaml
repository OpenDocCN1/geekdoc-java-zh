  md: '# 3.7.1.3 Using arrays


    After an array is declared, elements within the array are accessed by providing
    an index (that is placed in brackets) The value inside the square brackets []
    indicates the index corresponding to the element that is to be accessed. Thus,
    the value[i] accesses the ith element of the array. The array index can be a literal
    value, a variable or an expression.


    Array indices in Java begin at 0 and end at the array length minus 1. The length
    property is referenced to obtain the size of an array (number of elements). A
    value is assigned to an array element through the combined usage of the array
    name and the index. This assignment can be done as shown in the following examples:


    ```

    area[0] = 25;

    total[i] = 100;

    name[t-1] = "Ravi";

    ```


    Accessing a value in an array element is similar to assigning a value to an element
    in an array. This is done as illustrated in the following examples:


    ```

    varAge = age[0];

    varScore = score[i];

    ```


