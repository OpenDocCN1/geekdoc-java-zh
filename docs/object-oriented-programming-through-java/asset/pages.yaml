    #  3.3 Variable Declarations


    # 3.3.1 Declaring, initializing and using variables


    Variables are defined by giving the name of the data types before the variable
    name. In Java, variables must be declared prior to their use. A variable stores
    values of data types. A variable has a particular size and a value associated
    with it. In Java, variables can only store values of primitive data types and
    references to objects. For example,


    ```

    int i;

    double d;

    char c;

    ```


    Several variables of the same type can also be declared in the same line; however,
    they need to be separated by the comma (,). For example,


    ```

    int x, y, z;

    double d, f;

    ```


    Variables can also be initialized at the time of data type declaration, as in
    the following examples.


    ```

    int i = 10;

    int x = 10, y = 20;

    char c, st1 = ''A'';

    long big = 2147483648L;

    ```


    # 3.3.2 Variable types in Java


    Java defines the three types of variable given below. Each variable can store
    values of primitive data types or references to objects only.'
