  md: 'Another example of operator overloading is that an addition sign (+) can be
    used to specify addition of two numbers (say, 200 + 6 = 206) or concatenation
    of two strings (say, ''200'' + ''6'') = ''2006'').


    Java does not support user-defined operator overloading.


    # Function overloading Function overloading is the ability to access different
    implementations of functions using the same name.


    Consider an example that displays the current date. Usually, the date is represented
    in two forms:


    +   - As a string: December 20, 2005

    - As a triplet: (day, month, year): 20, 12, 2005


    It is easier for a programmer if same function name can perform one of the tasks
    depending on the user requirements. This can be achieved using function overloading
    by writing two different functions (methods) bearing same name as below:


    ```

    Printdate (String Str) {......}

    Printdate(int dd, int mm, int yyyy) {...}

    ```


    Here, the first Printdate function takes one string parameter as argument and
    the second function takes three integer parameters as arguments. Based on the
    data types of the arguments passed in a message, the corresponding function is
    invoked. Thus, two or more functions may have the same name, so long as the parameter
    types or number of parameters are sufficiently enough to distinguish which function
    is intended. This feature is not allowed in procedural languages, as functions
    cannot have same name. A function may not be overloaded on the basis of its return
    type. In Java, function overloading is referred to as ''method overloading''.


    There are two types of function overloading: early binding and late binding.


    +   - Early Binding This allows us to have two functions in the same class that
    have the same name (function name) but with different number of parameters or
    different data types of parameters passed to it. The Printdate function described
    above is an example of early binding. Early binding takes during compile time.

    - Late Binding This allows us to have functions with same name in and derived
    classes. The derived class function will override the base class function. Consider
    the example of geometric shape and its inheritance trait, as shown in Figure 1.4.
    We want to draw and fill the different shapes given in the figure. These two operations
    differ with respect to the shape of the object and different functions have to
    be written as shown in Figure 1.5. Here, the base class functions draw() and fill()
    are overridden by the derived class functions. So, the function to be executed
    is selected dynamically during run-time, based on the shape object referred. This
    process of choosing the function dynamically at run-time is referred to as late
    binding.'
