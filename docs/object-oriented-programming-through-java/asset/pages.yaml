  md: '# Networking and Remote Method Invocation 427


    ![](img/2146e82d591b04fc307195fd4ee73d50_445_0.png)


    Fig. 13.2 A client–server connection.


    #  13.3 Networking Classes in the JDK


    Java programs use TCP or UDP to communicate over the Internet through the java.net
    classes. Both TCP and UDP use InetAddress. The classes URLConnectionSocket and
    ServerSocket use TCP for communication. The classes DatagramPacket, DatagramSocket,
    and MulticastSocket make use of UDP. The java.net.Inet class contains methods
    to convert numeric addresses and host names to numeric addresses. Table 13.1 shows
    the classes, interfaces and exceptions defined in the java.net package. The sockets
    for developing simple client-server applications in java are explained in the
    following section. The client–server program works on TCP and UDP.


    # 13.3.1 Basics of sockets


    A higher-level mechanism for accessing resources on the Internet is provided by
    the classes URL and URLConnection. At times the program requires lower-level network
    communication, for example, while writing a client–server application. In client–server
    applications, the server provides some service and the client uses the services
    provided by the server. The communication that takes place between sending data
    between the client and the server must be reliable. That is, no data can be discarded
    and the order of must data must also be preserved.


    Table 13.1 Classes, interfaces and exceptions in the java.net package.


