  md: '# Database Handling using JDBC


    Java facilitates client-server computing and allows it to integrate with popular
    commercial Data Base Management Systems (DBMS). Traditionally, Open Database Connectivity
    (ODBC) is the standard component for programming languages to communicate with
    databases. Java Database Connectivity (JDBC) provides a program-level interface
    for communicating with databases using Java programming language. This chapter
    discusses Java constructs that are used to handle databases.


    # 9.1 An Overview of DBMS


    The main concerns of data handling are the following:


    +   * How are data physically stored in the computer (storage)?

    * How are data logically specified (organization)?

    * How can data be accessed (retrieval)?

    * How can the performance of storing and accessing data be improved?


    A database is an organized collection of related data. It enables a user to easily
    specify, store, modify and retrieve the data. A Database Management System (DBMS)
    is a collection of related data and a set of programs to access and manipulate
    the data.


    Database management systems are designed to store and manage large collections
    of data. The management of data involves both the definition of storage structure
    and the access mechanisms for the manipulation of data. In addition, the database
    system must provide a mechanism of recovering stored information, besides providing
    means of managing system crashes and attempts at unauthorized access. A DBMS provides
    efficient, convenient and safe multi-user storage of and access to massive persistent
    data.


    The DBMS defines a data structure as well as storage and access techniques, which
    are collectively called the data model. There exist several data models, such
    as relational model, hierarchical model and network model. In this chapter, we
    focus on the relational model to explain database handling using JDBC.


    In relational databases, data is organized in the form of tables. A table is a
    collection of records (rows) and a record is a collection of fields (columns).
    Each table has a unique name. In relational terminology, the term table stands
    for a relation, a row forms a tuple and a column is an attribute.'
