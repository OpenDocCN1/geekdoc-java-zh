    # 4.3 Packages


    A package in Java is a group of related classes, interfaces and sub-packages.
    For example, java.io package contains classes and interfaces for managing various
    kinds of input and output. The default package is java.lang, which includes primary
    classes and interfaces essential for Java language. It also consists of wrapper
    class, Strings and multithreading. Packages provide a high-level layer of access
    protection and name space management.


    Advantages of using packages are listed below:


    +   - They help in organizing classes into units. Just as a computer hard disk
    contains folders or directories to organize files and applications, packages allow
    organization of classes into groups.

    - They reduce problems with conflicts in names. As the number of Java classes
    grows, so does the likelihood that the same class name would be repeated. This
    would result in clashes while naming and unwanted errors. Packages allow programmers
    to ‘hide’ classes so that conflicts can be avoided.'
