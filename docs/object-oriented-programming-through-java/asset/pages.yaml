    # 3.6.2.2 do...while statement


    > Sometimes it is more convenient to test the continuation condition at the end
    of a loop instead of at the beginning as is done in the while loop.


    The do...while statement is very similar to the while statement, except that the
    word ‘while,’ along with the condition that it tests, has been moved to the end.
    The word ‘do’ is added to mark the beginning of the loop. A do...while statement
    has the form


    ```

    do

    statement

    while ( boolean-expression );

    ```


    or, since, as usual, the statement can be a block,


    ```

    do

    {

    statements

    } while ( boolean-expression );

    ```


    Note the semicolon '';''at the end. This semicolon is part of the statement, just
    as the semicolon at the end of an assignment statement or declaration is part
    of the statement. Omitting it results in a syntax error.

    To execute a do loop, the computer first executes the body of the loop, that is,
    the statement or statements inside the do loop and then it evaluates the boolean
    expression. If the value of the expression is true, the execution returns to the
    beginning of the do loop and repeats the process, if the value is false, it ends
    the loop and continues with the next part of the program. Since the condition
    is not tested until the end of the loop, the body of a do loop is executed at
    least once.


    # 3.6.2.3 The For statement


    The for loop statement is almost similar to the while loop statement; however,
    for statements offer certain advantages over the while loop statements.


    > A for loop can be easier to construct and easier to read than the corresponding
    while loop.'
