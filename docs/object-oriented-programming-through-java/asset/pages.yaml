  md: '# 10

    # The Abstract Window Toolkit


    Java supports graphics that helps programmers enhance the look and feel of applets
    and application programs. Java contains powerful capabilities such as those for
    controlling the style of lines, shapes, colours and patterns. The Abstract Window
    Toolkit (AWT) is the user interface toolkit provided as part of the Java language
    class library. The package java.awt.* implements the Java AWT and contains all
    the classes necessary for creating a user interface. This chapter provides an
    overview of the Graphical User Interface (GUI) features of Java.


    # 10.1 Introduction


    The Java Foundation Class (JFC) provides two frameworks for building GUI-based
    applications—Abstract Window Toolkit (AWT) and swings. The hierarchy of AWT is
    explained in this chapter and swings are covered chapter 11.


    The AWT package can be used by importing java.awt.* as follows:


    ```

    import java.awt.*

    ```


    The AWT has a set of Java classes that provide the standard set of user-interface
    elements (windows, menus, boxes, buttons, lists and so on). That is, AWT provides
    several facilities for drawing two-dimensional shapes, controlling colours and
    fonts. Before using Java AWT classes, understanding the Java coordinate system
    is essential. By default, the top left corner of the component has coordinates
    (0,0). Here, the x-coordinate denotes the horizontal distance and the y-coordinate
    is the vertical distance from the upper left corner of the component. In Figure
    10.1, the applet''s width and height are 200 pixels each, in which the upper left
    corner is denoted by (0,0) and lower right corner is (200, 200).


    The key elements required to create a GUI include the following:


    Components A component is a visual object containing text or graphics. It can
    respond to keyboard or mouse inputs. Examples of components include buttons, labels,
    text boxes, check boxes and lists. An empty component is known as a canvas, which
    can be used as a drawing area for text or graphics. All components inherit a common
    set of methods. The most commonly used is paint.


    Container A container is a graphical object that contains components or other
    containers. Frame is the most important type of container.'
