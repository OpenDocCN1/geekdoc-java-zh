  md: '# 9.1.2.1 Two-tier architecture


    In a two-tier architecture (Figure 9.1), business logic and presentation logic
    are located on the client machine, and the database server is on another machine.
    For example, an application could be implemented using an applet in which business
    logic is contained in the applet code, which contains code for interacting with
    the database management system on the server side. The database server also contains
    data access logic. Data access logic refers to the calls to the database access
    using JDBC. The database engine provides the access logic to the database.


    This architecture is often referred to as thick-client (or fat-client) architecture,
    since a large amount of processing is located on the client machine. The database
    driver code could either be pre-installed on the client or downloaded with the
    applet.


    # 9.1.2.2 Three-tier architecture


    In a three-tier architecture (Figure 9.2), only the presentation logic is located
    on the client machine. The business logic and the database drivers are located
    on the server side, which is treated as application server. The database management
    system may also reside on a third machine, which can be treated as the database
    server.


    A three-tier architecture is often referred to as a thin-client approach where
    very little code of processing is located on the client, namely, the presentation
    logic. An example of thin-client architecture is the use of servlets. The presentation
    code is contained in the HTML document sent to the client; the business logic
    is in the servlet, which connects to a database system on the server machine.


    ![](img/2146e82d591b04fc307195fd4ee73d50_283_0.png)


    +   Fig. 9.1 Two-tier (client–server) architecture.


    ![](img/2146e82d591b04fc307195fd4ee73d50_283_1.png)


    +   Fig. 9.2 Three-tier architecture.'
