  md: '# 11.2 The Swing Packages


    Some of the packages of swing components that are used most are the following:


    +   - javax.swing

    - javax.swing.table

    - javax.swing.event

    - javax.swing.border

    - javax.swing.plaf.basic

    - javax.swing.tree


    The largest of the swing packages, *javax.swing*, contains most of the user-interface
    classes (these are J classes, the classes having the prefix J). JTableHeader and
    JComponent are the exceptional classes implemented in the packages javax.swing.table
    and javax.swing.text, respectively. *javax.swing.text* contains two sub-packages
    known as javax.swing.text.html* and *javax.swing.text.rtf* for HTML content and
    for Rich Text Format content, respectively.


    To define the look and feel of the swing component, the javax.swing.plaf.basic*
    package is used. *javax.swing.border* contains an interface Border which is implemented
    by all the border classes. These classes cannot be instantiated directly. They
    are instantiated using the factory method (BorderFactory) defined in the *javax.swing*
    package. The *javax.swing.event* package contains all the classes that are used
    for event handling. The *javax.swing.tree* package includes classes and interfaces
    that are specific to the JComponent.


    There are totally 16 packages in the swings packages and javax.swing is one of
    them. A brief description of all the packages in swing is given below.


    | javax.swing | Provides a set of "lightweight" (all-Java language) components
    to the maximum degree possible, work the same on all platforms. |

    | javax.swing.border | Provides classes and interface for drawing specialized
    borders around a Swing component. |

    | javax.swing.colorchooser | Contains classes and interfaces used by the JColorChooser
    component. |

    | javax.swing.event | Provides for events fired by Swing components |

    | javax.swing.filechooser | Contains classes and interfaces used by the JFileChooser
    component. |

    | javax.swing.plaf | Provides one interface and many abstract classes that Swing
    uses to provide its pluggable look-and-feel capabilities. |

    | javax.swing.plaf.basic | Provides user interface objects built according to
    the Basic look and feel. |

    | javax.swing.plaf.metal | Provides user interface objects built according to
    the Java look and feel (once nicknamed Metal), which is the default look and feel.
    |

    | javax.swing.plaf.multi | Provides user interface objects combine two or more
    look and feels. |'
