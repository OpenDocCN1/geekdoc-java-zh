  md: "The Iterator is used in loops to navigate sequentially through a collection\
    \ to get the elements.\nThe enhanced for statement in Java 1.5 does not require\
    \ explicit use of iterator for this purpose.\nThe new enhanced for loop feature\
    \ can be used to replace the iterator. The necessary looping\ncode is generated\
    \ by the compiler for traversing through the collection. This enhanced for loop\n\
    construct simplifies looping over collections and iterations.\n\nThe syntax used\
    \ for for loop in the earlier version of Java is as follows:\n\n```\npublic int\
    \ factorial(int a[]) {\n    int fact = 1;\n    for (int i = 1; i < a.length; i++)\n\
    \        fact = fact * i;\n    }\n```\n\nThis loop is used to calculate the product\
    \ of the elements in the array, where a.length represents\nsize of the array.\
    \ Using Java 1.5, the for loop is so much simple and adds an enhancement for\n\
    collection or array. Using the enhanced for statement, the above loop can be written\
    \ as given\nbelow:\n\n```\npublic int factorial(int a[]) {\n    int fact = 0;\n\
    \    for (int i : a) {\n        fact = fact * i;\n    }\n```\n\nThe above code\
    \ automatically gets values in the array one at a time and stores the values in\
    \ a\nstarting with first element and then calculates the fact. The colon (:) in\
    \ the above for loop is read\nas as 'in'.\n\nThe main advantages of the enhanced\
    \ for loop are the following:\n\n+   - It simplifies the code (no need of explicit\
    \ iterator)\n- It prevents boundary errors\n\nConsider a scenario wherein we have\
    \ a collection of objects of type String and we are required\nto process each\
    \ String of the collection.\n\nBefore the advent of Java 5.0, we would have addressed\
    \ the problem in the following manner:\n\n```\nfor(Iterator iter = stringCollection.iterator();\
    \ iter.hasNext()) {\n    // 'stringCollection' is a Collection of objects of type\
    \ String\n    String str = (String)iter.next(); // note that we are casting it\
    \ to type String\n    //process the 'str' here\n}\n```"
