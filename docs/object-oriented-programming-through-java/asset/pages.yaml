    # 7.6 RandomAccessFile


    Sequential files can read/write only at the beginning/end of the file. On the
    other hand, random access files allow us to read from or write to any location
    in the file. The class RandomAccessFile offers methods that allow specified mode
    accesses such as ‘read only’ and ‘read – write’ to files.


    Since RandomAccessFile is not inherited from InputStream or Output Stream it cannot
    be chained unless filtered stream classes; however, RandomAccessFile implements
    both DataInput and Output primitive data types. It must be noted that DataInputStream
    implements DataOutputStream implements DataOutput.


    The RandomAccessFile class is a very useful class for file handling. The constructors
    of these classes are the following:


    ```

    RandomAccessFile(String filename, String mode);

    RandomAccessFile(File file, String mode);

    ```


    Thus, RandomAccessFile objects can be created either from a string containing
    the filename or from a File object. The mode represents the type of access to
    the file, for example, ‘r’ for read and ‘rw’ for read and write. There are two
    other modes, namely, ‘rws’ and ‘rwd’, opens the file as read and write and stores
    the updates on the file data or metadata in the synchronized way, ‘rwd’ deals
    with the file data but not the metadata. However, metadata refers to the data
    about the files. RandomAccessFile throws an IOException if an I/O error has occurred.
    Program 7.4 illustrates the use of RandomAccessFile.'
