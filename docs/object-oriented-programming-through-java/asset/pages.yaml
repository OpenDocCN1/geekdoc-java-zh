    \n```\nimport java.applet.Applet;\npublic class SampleApplet extends Applet\n\
    {\n    // applet code\n}\n```\n\nA Java applet must be a public class. Thus, the\
    \ Applet class can be accessed when the applet is run in a web browser or in the\
    \ Appletviewer. The applet code will be compiled even if the class is not declared\
    \ as public, but the applet will not run.\n\nAn applet code looks as shown below:\n\
    \n```\nimport java.applet.Applet;\nimport java.awt.Graphics;\npublic class SimpleApplet\
