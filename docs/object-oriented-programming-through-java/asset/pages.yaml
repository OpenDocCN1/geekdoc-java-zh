  md: '# 14

    New Language Features of Java 1.5


    The Java 2 Platform, Standard Edition (J2SE) 1.5 provides new and exciting features
    that are very useful to Java programmers. Before Java 1.5 release, the boilerplate
    code (a boilerplate code is a code that can be used over and over without much
    change) was meant to be written by the programmer. In the later Java release,
    the compiler translates the code written in a short liguistic form by the programmer
    into its equivalent boilerplate code. That is, Java 1.5 shifts the programmer''s
    responsibility for writing the boilerplate code to the compiler. Since the compiler
    does this work, it results in a program free of bugs. This chapter covers basic
    features introduced in Java 1.5 version.


    # 14.1 Introduction


    J2SE 1.5 version (or, simply, Java 1.5) was released in September 2004. The new
    features of Java 1.5 enable Java developers to make programs simpler, shorter
    and easier to develop. This version provides a host of new capabilities and enhancements
    to build Java applications and tools. To quote the words of Joshua Bloch from
    Sun Microsystems about Java 1.5 version.


    > The new language features all have one thing in common: they take some idiom
    and provide linguistic support for it. In other words, they shift the responsibility
    for writing the boilerplate code from the programmer to the compiler.


    With version 1.5, Java has been extended with several additional features such
    as Generics, Enhanced for loop, Autoboxing and Unboxing, Type-Safe Enumerations,
    Varargs, Formatted I/O, Static import and Metadata.


    (See Table 14.1 in http://www.universitiespress.com/downloads/books/81-7371-572-6.pdf
    for a description of additional features in Java 1.5.)


    The following sections briefly describe some of the new features of Java 1.5.

    Note that according to J2SE naming and versioning, the external version number
    of new release is 5.0 and its internal version number is 1.5.0.'
