- img_proc: true
  md: 'Use of the interpreter Java technology solves both the binary distribution
    problem and the version problem. This ensures that the same Java programming language
    byte codes will run on any platform.


    Java technology takes portability a stage further by being strict in its definition
    of the basic language. Java technology specifies the sizes of its basic data types
    and the behaviour of its arithmetic operators. All programs are the same on every
    platform—there are no data type incompatibilities across hardware and software
    architectures. To get an idea of the variety of machines and platforms where a
    Java byte code may be executed, see Figure 2.5.


    The architecture-neutral and portable language platform of Java is known as the
    Java Virtual Machine (JVM). The JVM is the specification of an abstract machine
    for which the Java programming compilers can generate code. Implementing the JVM
    on new architectures is a relatively straightforward task as long as the target
    platform meets basic requirements such as for multithreading and other requirements.


    **4. Java shows a high performance** Higher performance is ensured by Java by
    adopting a scheme in which the interpreter runs/executes at full speed needing
    to check the run-time environment. The automatic garbage collector runs as a low-priority
    background thread, ensuring a high probability that memory is available when required,
    leading to better performance.


    **5. Java is interpreted, threaded and dynamic** The Java interpreter executes
    the Java byte code directly on any machine to which the interpreter and run-time
    system have been ported. The multithreading capability of Java provides the means
    to build applications with many concurrent threads of activity. Multithreading
    thus results in a high degree of interactivity for the end user.


    Java supports multithreading at the language level which allows asynchronous behaviour
    of the program. This is discussed in chapter 6.


    The language library provides the *thread* class, and the run-time system provides
    monitor and lock primitives. At the library level, moreover, Java technology''s
    high-level system libraries have been written to be thread-safe and the functionality
    provided by the libraries is available without conflict to multiple concurrent
    threads of execution.


    While the Java compiler is strict in its compile-time static checking, the language
    and run-time system are dynamic in their linking stages. Classes are linked only
    as needed. New modules can be linked in demand from a variety of sources, even
    from sources across a network.


    ![](img/2146e82d591b04fc307195fd4ee73d50_39_0.png)


    **Fig. 2.5** Applicability of the Java byte code.'
