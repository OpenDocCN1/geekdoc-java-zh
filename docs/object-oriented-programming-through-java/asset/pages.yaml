    and the signature of the doPost method is as shown below:


    ```

    protected void doPost(HttpServletRequest request, HttpServletResponse response)

    throws ServletException java.io.IOException;

    ```


    A servlet call using either doGet() or doPost() passes two parameter objects,
    namely, request and response objects. These two objects are instances of HttpServletRequest
    and HttpServletResponse. Using the request and response objects, the servlet instance
    handles the requests of the client.


    The HttpServletRequest class has a large set of methods that give information
    about the request such as the path, the remote user and any header information
    that comes with the request.


    The HttpServletResponse class passes either header information or error messages
    to the client. The typical output of a servlet is obtained using the following
    statements:


    ```

    response.setContentType("text/html");

    PrintWriter out = response.getWriter();

    ```


    The most common use of HttpServletResponse is to obtain an output stream that
    will be written to the client. The getWriter() method on the HttpServletResponse
    object returns the PrintWriter, which is used to send the response back to the
    client from the servlet. Similarly, OutputStream is obtained by using the get()
    method on the HttpServletResponse object. PrintWriter is used on the character
    data whereas OutputStream is used by data. To access various utility classes as
    HttpServletRequest, HttpServletResponse and HttpServletOutputStream, we must import
    javax.servlet.* and javax.servlet.http.*


