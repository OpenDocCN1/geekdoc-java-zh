  md: "# 14.5 Type-Safe Enumerations\n\nAn enumerated type is a type whose values\
    \ consist of a fixed set of constants. Using type-safe enumerations, a set of\
    \ named values can be created. It defines a set of constants of type int. The\
    \ class declaration is a special kind that supports enumeration type.\n\nThe C-style\
    \ enumerated type, enum, was omitted from the Java programming language. A commonly\
    \ used pattern for enumerated types in Java is to define a class of constants\
    \ as follows:\n\n```\npublic class Day {\n    public Day (Mon, Tues, Web, Thurs,\
    \ Fri, Sat, Sun);\n    private final Day day1;\n    private Day_enum(Day day1)\
    \ {\n        this.day1 = day1;\n    }\n    public Day day1() {\n        return\
    \ day1;\n    }\n}\n```\n\nIn Java 1.5, enum declares a class type and hence it\
    \ can have methods and fields. Classes of type enum are implicitly final subclasses\
    \ of java.lang.Enum. If an enum is a member of a class, it is implicitly static.\
    \ Also, new can never be used with an enum, even within the enum type itself.\
    \ For enum constants, equals and == amount to the same, and can be used interchangeably.\
    \ Constants in enum are implicitly public static final.\n\nJava 1.5 provides many\
    \ advantages of using type-safe enum type. It provides compile-time type-safety\
    \ and provides a proper name space for the enumerated type. Like classes, arbitrary\
    \ fields and methods can also be added into these enum types. These can be used\
    \ in collections they are objects.\n\n# 14.6 Variable-Length Arguments\n\nThe\
    \ variable-length arguments feature (Varargs) allows more flexibility and simplicity\
    \ in developing Java programs. Using this feature, a method can be declared with\
    \ variable number of parameters for a given argument; however, the argument must\
    \ be the last one in the list of formal arguments. Varargs are never null. Note\
    \ that in the earlier versions of Java, an explicit array must be created to pass\
    \ variable number of arguments.\n\nThis feature eliminates the need for manually\
    \ passing argument lists into an array when calling methods that accept variable-length\
    \ argument lists. It requires the simple notation for the method"
