  md: '# 20 Object Oriented Programming through Java


    Java technology is designed to operate in heterogeneous environments, which means
    that security is of paramount importance. The security features of Java allow
    programmers to design applications that are extremely difficult to tamper with.
    In network environments, applications written in Java are safe from intrusion
    by unauthorized codes attempting to get behind the scene and create viruses or
    invade file systems.


    3. Java is architecture neutral and portable In heterogeneous network environments,
    applications must be capable of being executed on a variety of hardware architectures
    and operating systems. In addition, the applications should be able to interoperate
    with multiple programming interfaces. Java supports applications that are deployed
    in heterogeneous network environments, the Java compiler generates a byte code.


    Unlike a C compiler, the Java compiler does not produce a native executable code
    for any particular machine. It produces a special format called the byte code
    which is architecture-neutral intermediate format designed to transport the code
    efficiently to multiple hardware and software platforms. It does not contain any
    machine- or hardware-related information.


    Using the byte code, Java solves the problem of platform-independence. The Java
    byte code written in hexadecimal codes, by by byte, looks like this:


    ```

    CA FE BA BE 00 03 00 20 0D 3E 08 03 38 00 01 08 00 20 08

    ```


    Byte codes are precisely defined and remain the same for all platforms. Java programs
    that have been compiled into byte codes still need an interpreter to execute them
    on any given platform. The interpreter reads the byte code and translates it into
    the native language of the host machine. See Figure 2.4 for an illustration of
    the process of compiling and running a Java program.


    Understanding the byte code Since the byte code is completely platform-independent,
    only the interpreter and a few native libraries need to be ported to get Java
    run on a new computer or operating system. The rest of the run-time environment,
    including the compiler and most of the class libraries, are written in Java.


    ![](img/2146e82d591b04fc307195fd4ee73d50_38_0.png)


    Figure 2.4 Complete Java environment.'
