  md: '# Object Oriented Programming through JAVA™


    Java language is the favourite platform of software developers. Using Java to
    advantage depends on learning to use its object oriented, platform independent,
    security concerned and graphic intensive features effectively.


    This book can be used by BE (Computer Science), BTech (IT), MTech, MCA and MSc
    students who study Java programming as part of their curriculum. Readers interested
    in learning object oriented Java programming on their own will also find the book
    self-explanatory and interesting.


    Crisp explanations, illustrative programs, highlighted points and an easy style
    of writing combine to convey the different aspects and power of the language.
    Supplementary material, such as tables and sample programs on each topic can be
    accessed by following web links given in the book. End-of-chapter exercises help
    students revise the material.


    # Key topics


    +   * Java language and its essentials such as classes, objects, packages and
