    +   In the first step, the SQLServer driver class is loaded and registered with
    the DriverManager in order to make a connection to the SQLServer database

    - The DriverManager class is used to connect to database through the method getConnection().
    This method chooses an appropriate driver from currently registered drivers.

    - The Connection object which is returned by getConnection() can be used to create
    an empty SQL Statement object with the createStatement() method.

    - Once created, a Statement object can be used to execute a query using the executeQuery()
    method, which returns the ResultSet object. In case the database has to be updated,
    the executeUpdate() method can be used.

    - The getMetaData() method of ResultSet is used to get the data relating to the
    ResultSet column names and their data types

    - A ResultSet object maintains a cursor (a row pointer or place-holder) which
    is incremented by the next() method. The next() method returns a boolean value
    based on whether the next row is available.

    - A ResultSet can be queried for a particular column either through a column number
    or column name (using overloaded versions of the getString() method which is also
    implemented for each primitive type, generic objects, various streams, date and
    time objects)

    - The SQLException occurs if there is any error during execution such as connection
    establishment, creating statement, retrieving the result or updating the statement
    object. If the SQLException exception occurs, the program terminates automatically.
    The programmer must provide the code for closing the Connection object, the statement
    object and ResultSet object during the SQLException. It is good practice to close
    the Connection and Statement objects in the finally block.'
