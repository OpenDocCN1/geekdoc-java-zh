  md: '# 13.5.1 Proxy layer or stub/skeleton layer


    The proxy layer is responsible for managing the remote object interface between
    the server and client. In this layer, the stub class is the client-side Proxy
    for the remote object. stub is responsible for initiating a call to the remote
    object it represents and is the application interface to that object. It is also
    responsible for marshalling the method arguments to a marshal stream. This stream
    is stream object, which simply transports the parameters, exceptions and errors
    needed for the method dispatch and returns the results. Both the stub and skeleton
    classes use this stream to communicate with each other. Once the results are returned
    to the client stub, the results are unmarshalled.


    The skeleton class is similar to the stub class in many ways. The only difference
    is that it exists on the server side. The responsibility of the skeleton class
    is to send parameters to the method implementation and sending the return values.
    They are generated using the RMI stub compiler. When the remote object from the
    naming server is requested, the stub class is downloaded to the client machine.
    The stub and skeleton classes implement the same interfaces as the remote object.


    # 13.5.2 Remote reference layer


    This layer gets a stream-oriented connection from the transport layer. It is responsible
    for dealing with the semantics of remote invocations. It is also responsible for
    handling duplicated objects and for performing implementation specific tasks with
    remote objects.


    # 13.5.3 Transport layer


    The transport layer is responsible for setting up the connection and transportation
    of data from one machine to another. The default connection is set up only in
    the TCP/IP protocol.


    # 13.6 Implementing Remote Class and Interface


    A Remote class has two parts, one is the interface and the other is the class
    itself. The Remote interface should have the following properties:


    +   * The interface must be public.

    * The interface must extend the interface java.rmi.Remote.

    * Every method in the interface must declare that it throws java.rmi.RemoteException
    and other exceptions may also be thrown.


    The Remote class has the following properties:


    +   * It must implement a Remote interface.

    * It should extend the java.rmi.server.UnicastRemoteObject class. Objects of such
    a class exist in the address space of the server and can be invoked remotely.
    While there are other ways to define a Remote class, this is the simplest way
    to ensure that objects of a class can be used as remote objects.'
