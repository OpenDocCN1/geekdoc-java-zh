    \ acquires all the method definitions and constants that that 'super interface'\
    \ defines. To extend an interface, the keyword extends is used. The example below\
    \ shows how an interface may be extended.\n\n```\npublic interface TwoWayList\
    \ extends LinkedList\n{\n    public void deleteLast(int num);\n}\n```\n\nUnlike\
    \ classes, the interface hierarchy has no equivalent of the Object class. This\
    \ hierarchy is not rooted at any one point. Interfaces can either exist entirely\
    \ on their own or inherit from another interface. Multiple inheritance is also\
    \ permitted in interfaces. A single interface can extend as many interfaces as\
    \ it needs to (separated by commas, in the extends part of the definition), and\
    \ the new interface will contain a combination of all its parent methods and constants.\
    \ This follows the syntax shown in the following example:\n\n```\npublic interface\
    \ EventListener implements ActionListener, MouseListener, KeyListener\n{\n}\n\
    ```\n\nIn the above illustration, the interface Events extends several other interfaces.\
    \ The rules for managing name conflicts in multiple inheritance are similar to\
    \ those for classes that use multiple interfaces; methods that differ only in\
    \ return type will result in a compilation error.\n\n# 4.4.2.4 Implementing and\
    \ using interfaces\n\nThe keyword implements In order to use the functionality\
