  md: "# 3.1.4 Comments\n\nA program can be documented by inserting comments at relevant\
    \ places. The Java compiler ignores these comments. Java provides three types\
    \ of comments:\n\n+   - Single-line comment All characters that follow // until\
    \ the end of the line constitute a single-line comment. For example,\n\n// This\
    \ comment ends at the end of this line.\n\n+   - Multiple-line comment A multiple-line\
    \ comment, as the name suggests, can span several lines. Such a comment starts\
    \ with /* and ends with */. For example,\n\n/* A comment on several lines.\n*/\n\
    \n+   - Documentation comment A documentation comment is a special purpose comment\
    \ which when placed at appropriate places in the program can be extracted and\
    \ used by the javadoc utility to generate HTML documentation for the program.\
    \ Documentation comments are usually placed in front of class, interface, method\
    \ and variable definitions. Groups of special tags can be used inside a documentation\
    \ comment to provide more specific information. Such a comment starts with /**\
    \ and ends with */. For example,\n\n/**\n * This class implements open an account\n\
    \ * @author PRRao\n * @version 1.0\n */\n\nComments cannot be nested. The comment-start\
    \ sequences (//, /*, /**) are not treated differently from other characters when\
    \ occurring within comments."
