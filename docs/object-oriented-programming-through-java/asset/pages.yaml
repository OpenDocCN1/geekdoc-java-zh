    **Widening** If the source is of smaller size than the destination but the source
    and destination are of compatible types, then no casting is required. An *implicit*
    widening takes place in this case. An example is assigning an int to a long.


    ```

    int i=5;

    long l=12;

    l = i; // Valid, both are of compatible types and source is of smaller size

    ```


    **Casting** If the source and destination are of compatible types, but the source
    is of larger size than the destination, an *explicit* casting is required. In
    this case, if no casting is provided then the program does not compile.


    ```

    int i=5;

    long l=12;

    i = (int) l; // Valid, both are of compatible types and source is of larger size

    // and explicitly cast.

    ```


    For more details on casting see section 3.5.12.


