    # 6.7 Thread Groups


    Sometimes it is useful to identify various threads as belonging to a thread group.
    Every thread object created in java is a member of the ThreadGroup object. In
    Java, every thread and every thread group joins some other thread group. That
    is, a thread which exists in a thread group can contain other thread groups. This
    kind of arrangement forms a hierarchical thread-group structure as shown in Figure
    6.4.


    As shown in Figure 6.4, the root of the thread-group structure is system thread
    group. JVM created main thread group, which is a sub-thread of system thread group.
    JVM may create other threads under the system thread group based on the need.
    JVM also created a main thread under the main-group. The main thread executes
    the byte instructions in the main() method. By default, any created thread is
    a member of system thread group.


    The class ThreadGroup contains methods for creating and manipulating thread groups.
    When the construction itself itself the group is given a unique name via a String
    argument. A thread


