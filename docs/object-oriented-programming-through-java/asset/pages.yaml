    # 12.3 The Life-cycle of the Servlet


    A servlet has a well-defined life-cycle that defines how it is loaded, instantiated
    and initialized and handles requests of clients, and how it is taken out of service.
    The servlet''s life-cycle includes the following steps:


    +   - Loading the servlet—the servlet is created and initialized using the init()
    method.

    - Handling requests—the servlet handles zero or more client requests and provides
    appropriate responses using the service() method.

    - Destroying the servlet—the servlet is destroyed using the destroy() method.


    The above steps are illustrated in Figure 12.3.'
