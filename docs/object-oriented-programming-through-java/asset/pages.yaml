  md: '# #1 Object Oriented Programming


    Computer programming languages have undergone a dramatic change from being procedure
    oriented to object oriented in the last decade. One reason for such a shift in
    approaches is the increased usage of software in dealing with problems having
    a high level of complexity. This and the need to reuse parts of software in different
    applications led to the popularity of object oriented programming (OOP). This
    chapter covers the basics of OOP.


    # ## 1.1 Introduction to OOP


    In early days, programs were collections of procedures acting on data. A procedure
    is defined as a collection of instructions executed in sequential order. Data
    were independent of the procedures and programmers have to keep track of functions
    and the way they modify data. Structured programming is a simpler way to tackle
    this situation.


    In structured programming, a complex program is broken into sets of smaller, understandable
    tasks; however, the drawbacks of structured programming soon became clear. These,
    first, that data and task independence were too hard to maintain. Second, programmers
    were reinventing new solutions to old problems. To address these problems, object
    oriented programming came into existence. This provides a technique for managing
    high complexity, achieving reuse of software components and coupling with data
    that the tasks manipulate.


    Object oriented programming, as a concept, was introduced by Xerox Corporation
    in the early 1970s. The first object oriented language was Smalltalk. The concept
    of object orientation in this language did not prove successful for about 10 years
    because of the limitations of early computers. Some languages that successfully
    implemented object oriented programming are C++, Java and Eiffel. Object oriented
    programming is thought to be a relatively new concept in computer science. Contrary
    to this, all the major concepts such as objects, classes, hierarchies were developed
    by researchers of Norwegian Computing Center as part of development of programming
    language Simula in the 1960s. Yet the importance of these concepts was slowly
    recognized by programmers of Simula.


    Object oriented programming deals with things called ''objects''. Objects are
    just extremely functional ways of organizing information. In an OOP language these
    are combinations of code and data that are treated as a single unit. Each object
    has a unique name and all references to that object are made using that name.*'
