- img_proc: true
  md: 'Consider the example of the car class. Suppose we want to create a new class
    called Maruti. We know that a Maruti is a car so we can derive this new class
    from our base class. Some of the data for this new class may be size and mileage
    and a function would be engine. Since this is is a derived class, we can also
    have access to the base class functions, accelerations and deceleration, plus
    the data of the base class type, colour and wheels.


    Thus, inheritance can reduce the amount of coding by letting any derived class
    use the base class''s functionality when it needs to, thus simplifying implementation
    of similar classes and structures. In addition, the derived class is compatible
    with the base class, and can be used in place of the base class. This allows us
    to override any of the base class functionality it wants and use the new objects
    where the base class would be used, adapting it to its own needs.


    Derived classes may be formed in many ways. They can be derived from a single
    base class, or they can be formed from different parent classes.


    When a class is derived from only one base class the process is called single
    inheritance. When a class is derived from more than one base class the process
    is called multiple inheritance. Multiple inheritance is shown to combine two or
    more existing classes.


    Inheritance is often diagrammatically in terms of an inheritance hierarchy or
    inheritance tree as shown in Figure 1.2. Note that the arrowhead points towards
    the base class to indicate that the child class is derived from it. In single
    inheritance the inheritance graph is a tree, whereas in multiple inheritance the
    inheritance graph is a directed acyclic graph (DAG).


    Figure 1.3 is an example of a multiple-inheritance graph.


    | Base Class | Parent Class | Car |

    |---|---|---|n| Derived Class | Child Class | Maruti 800 |


    Figure 1.2 (a) Inheritance tree; (b) an example of single inheritance.


    | Base Class 2 | Base Class 2 | Engine | Body |

    |---|---|---|---|n| Derived Class | Maruti 800 | Zen |


    Figure 1.3 (a) Multiple inheritance graph; (b) an example of multiple inheritance.'
