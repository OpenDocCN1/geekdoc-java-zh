    # 10.4 Class Hierarchy of AWT


    Figure 10.2 shows the class hierarchy of AWT. A component is an object that can
    be displayed on the screen and can interact with the user. A container is a component
    that contains other components. Windows are containers. Containers have special
    properties, layout managers and insets. A window is a container with some special
    features such as a toolkit for creating components and a warning message for security
    purpose.


    The Frame is a sub-class of the Window class. It is used to create a GUI application
    window. Frames have a title bar, a cursor, an icon and menus. Frame windows are
    the standard objects used for drawing graphics. Table 10.2 shows the important
    methods in Frame class.


    ![](img/2146e82d591b04fc307195fd4ee73d50_319_0.png)


    Fig. 10.2 Class hierarchy of AWT.


    Table 10.2 Methods in the Frame class.


    | Method | Description |

    | --- | --- |

    | public Frame(String title) | Constructs a Frame with the specified title. |

    | public void setBackground(Color c) | Sets the background colour of the frame.
    |

    | public void setState(int x, int y) | Sets the size of the frame with x pixels
    width and y pixels height. |

    | public void setVisible(Boolean b) | Makes the frame visible depending on the
    value of b. |'
