  md: "# Java Language Fundamentals\n\nWhen the computer executes a break statement\
    \ in a loop, it will immediately jump out of the loop. It then continues on whatever\
    \ follows the loop in the program. Consider, for example, the following fragment,\
    \ Program 3.21:\n\n+   - Program 3.21 Using break to terminate a loop.\n\n```\n\
    while (true) // looks like it will run forever!\nTextIO.put(\"Enter a positive\
    \ number:\");\nN = TextIO.getInt();\nif (N > 0) // input is OK; jump out of loop\n\
    break;\nTextIO.put(\"Your answer must be > 0.\");\n}\n// continue here after break\n\
    ```\n\nIf the number entered by the user is greater than zero, the break statement\
    \ will be executed and the computer will jump out of the loop. Otherwise, the\
    \ computer will print out Your answer must be > 0, and jump back to the start\
    \ of the loop to read another input value.\n\nA break statement terminates the\
    \ loop that immediately encloses the break statement. It is possible to have nested\
    \ loops, where one loop statement is contained inside another.\n\n> If you use\
    \ a break statement inside a nested loop, it will only break out of that loop,\
    \ not out of the loop that contains the nested loop.\n\nThe continue statement\
    \ keeps executing from the beginning of the loop depending on the loop condition\
    \ criteria. The following code illustrates the use of the continue statement\n\
    \n```\npublic class Testcontinue{\n    public static void main(String argv[]){\n\
    \        for(int i=1;i<10;i++){\n            if (i>5) continue;\n            System.out.print(i);\n\
    \        }\n    }\n```\n\nThe output is 1 2 3 4 5."
