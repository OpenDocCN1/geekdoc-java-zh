  md: '# 150 Object Oriented Programming through Java


    Exception in thread "main" java.lang.ArithmeticException: / by zero

    at Divide.main(Divide.java:11)

    C\javatest>


    The program will be executed successfully (as in the case of the first run, java
    Divide 4 2)

    if two conditions are met:


    +   1. If number of arguments passed at run-time are two

    2. If the arguments passed are both valid numbers


    A run-time error occurs if any of the following takes place:


    +   1. If the number of arguments passed is less than two (more precisely, not
    equal to two)

    2. If any of the arguments passed is not a number

    3. If the second argument is zero


    So when the program terminates abnormally, the last statement,

    println("Program ends here")

    is never executed.


    To prevent interruptions of the normal flow of a program from exceptions, such
    as the ones discussed above, exception handlers in the program identify the exceptions
    and handle them appropriately. Exception handlers provide applications with many
    benefits, more than the traditional error-handling mechanisms. If there is no
    user-provided exception handler, the Java run-time system provides a default mechanism
    to terminate the program.


    **What is an exception handler?** An exception handler is a piece of code used
    to deal with the exceptions, either to fix the error or abort execution in a sophisticated
    way. It is invoked when an exception is encountered. Exception handlers catch
    the exceptions raised during the execution of the code and handle them according
    to the instructions given in the handler code. In Java, exception handlers are
    represented as catch blocks.


    The catch block in Java is used to handle exceptions that are raised during program
    execution.


    # 5.2 Basics of Exception Handling in Java


    The strong capability of Java to handle exceptions makes it possible for the programmer
    to monitor the program for exceptional conditions within it and transfer control
    over such conditions to a special-exception-handling code that he or she provides
    along with the main code.


    Java''s exception-handling mechanism is geared to situations in which the method
    detects an error is. Such a method will throw an exception. There is no guarantee
    that there will be an ''Exception Handler'' that is specifically designed to process
    that particular exception. If there is, the exception will be caught and handled.'
