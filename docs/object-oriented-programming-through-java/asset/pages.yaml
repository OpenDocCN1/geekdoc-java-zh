  md: '# 428 Object Oriented Programming through Java


    To communicate with each other, the client and the server each reads and writes
    to the socket bound to the connection. For this purpose I/O streams are used.


    A socket is one end-point of a two-way communication link that exists between
    two programs running on the network. Socket classes represent the connection existing
    between a client program and a server program. The java.net package provides two
    classes, Socket and ServerSocket, of which the first implements the client side
    of the connection and the latter, the server side of the connection.


    On the client side, the client knows the hostname of the machine where the server
    is running and also the port number to which the server is connected. To request
    a connection, the client tries to meet the server on the server''s machine and
    port (Figure 13.3). On the server side, if everything goes well, the server accepts
    the connection, the server gets a new socket bound to a different port. The server
    needs this new socket with a different port number so it can continue to listen
    for connection requests while tending to the needs of the connected client.


    On the client side, if the connection is accepted, a socket is successfully created,
    and the client uses this socket to communicate with the server (Figure 13.4).
    The socket on the client side, however, is not bound to the port number which
    is used to make contact with the server. Rather, the client is assigned a port
    number which is local to the machine on which the client is running. The client
    and server can now communicate by writing to or reading from their sockets.


    # 13.3.2 Simple client-server programming


    One side of a two-way connection between the Java program and another program
    on the network is implemented by the java.net package, which provides a Socket
