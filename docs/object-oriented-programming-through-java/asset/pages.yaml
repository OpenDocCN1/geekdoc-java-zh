  md: '# 3.1.1.2 Keywords


    Programming languages have certain words, usually termed reserved words or keywords,
    that convey special meanings to the compiler. These keywords can be used only
    for their intended action and cannot be used for any other purpose. Java has a
    richer set of keywords than C or C++.


    The keywords in Java are given in Table 3.1.


    Note that in addition to the keywords in the table, names of the built-in class,
    packages and interfaces are also words that cannot be used as identifiers.


    # 3.1.2 Literals


    In Java technology a literal denotes constant value. This implies that 0 is an
    integer literal and c is a character literal. Reserved literals true and false
    are used to represent boolean literals. ‘A simple java program’ is a string literal.
    In addition there is the null literal (null) which represents the null reference.


    # 3.1.2.1 Integer Literals


    Integer literals are the primary literals used in Java programming. Integer literals
    can be of decimal, hexadecimal and octal format. Decimal (base 10) literals appear
    as ordinary numbers with no special notation. Hexadecimal (base 16) literals are
    prefixed with a leading 0x or 0X. Octal (base 8) literals appear with a leading
    0 in front of the digits.


    | Table 3.1 Keywords in Java |

    | abstract | Boolean | break | byte | case | catch |

    | char | class | const * | continue | default | do |

    | double | else | extends | final | finally | float |

    | for | goto * | if | implements | import | instanceof |

    | int | interface | | native | new | null |

    | package | private | protected | public | return | short |

    | static | strictfp | super | switch | synchronized | this |

    | throw | throws | transient | try | void | volatile |

    | while | | | | | |


    > * It is important to note that const and goto are not currently in use.

    * Also it should be remembered that Java language is case sensitive, even though
    super is a keyword, Super is not.

    All the Java technology keywords are in lower case.'
