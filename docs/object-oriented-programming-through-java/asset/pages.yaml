  md: '+   - stop() It is called when the applet becomes invisible.


    +   - destroy() It is called when the applet is shutdown.


    A better understanding of these methods and how they reutilized in the applet
    can be got from the following description of the applet life-cycle.


    In addition, there is a method point() which is used to draw the applet for display,
    Note that the paint() method is not actually part of applet life-cycle as defined
    in Figure 8.2, but without display an applet is not always useful. Hence it is
    understood to be a part of the applet life-cycle.


    When an applet is loaded (or reloaded), the browser creates an instance of the
    applet into a browser and initializes it before starting the applet. When a user
    leaves (or minimizes) a web page, the browser stops the applet and when the user
    returns to the page the browser starts the applet again.


    The default implementations of the init(), start(), stop(), destroy() and paint()
    methods do not have any code and, thus do nothing at all. All the life-cycle methods
    can be overridden to add specific features of applet program. The following is
    a brief description of the life-cycle methods:


    # # 8.3.1 The init() method


    The syntax for using init() is the following:


    ```

    public void init() { ... }

    ```


    The init() method of the Applet class provides the capability to initialize the
    applet variables. That is, this method can be overridden to perform basic initialization
    of an applet. The method init() is called when the applet is created and loaded
    for the first time into a browser (or reloaded). This method is called only once
    in the applet''s life-cycle.


    The browser calls the init() method after the constructor of the applet is called.
    Usually, most of initialization is done in the init() method instead of the constructor.
    This is because, the constructor may be called before the hosting program is ready
    to provide all of the services needed for initialization.


    # # 8.3.2 The start() method


    The syntax for using start() is the following:


    ```

    public void start() { ... }

    ```


    The start() method is called to start (or restart) the execution of the applet.
    The browser can call this method after the init() method is completed.

    The start() method runs whenever the applet becomes visible That is called each
    time the applet is going to be displayed on the screen. For example, while navigating
    the web, when a user returns to a web page in which the applet is written, the
    applet is restarted. Thus, unlike the init() method, an applet can start many
    times throughout its life-cycle.'
