  md: '# 6.5.3 Deadlocks


    Deadlocks occur on several occasions. These can be classified into one of the
    two following situations, namely, when two or more threads are waiting for two
    or more locks to be freed or circumstances in the program are such that the locks
    will never be freed.


    Suppose one thread is monitor of object A and another thread is monitor of the
    object B. In Figure 6.3, A and B are in the monitor because they are executing
    synchronized methods. At one instant, if A tries to access the synchronized method
    of B and B tries to access the synchronized method of A then they will enter the
    Deadlock state.


    If two or more threads are waiting for each other to unlock a synchronized block
    of code, where each thread reads on another to do the unlocking, then this situation
    is called deadlock situation. Deadlock situation occurs if the programmer is not
    careful while writing the synchronized methods.


    # 6.6 Daemon Threads


    Daemon thread is a thread that runs only to serve other threads. Daemon threads
    run in the background when CPU time is available that would otherwise go waste.
    For instance, the garbage collector in Java is a daemon thread. Unlike conventional
    user threads, daemon threads do not prevent the program from terminating.


    A thread can be designated a daemon by calling the method setDaemon(true); A false
    argument means that the thread is not a daemon thread. A program can include a
    combination of daemon threads and non-daemon threads. When the program exits from
    execution then daemon only exists in the program. If a thread is to be designated
    a daemon, it must be done before its start method is called. Otherwise, it throws
    an IllegalThreadStateException exception. To find whether a thread is a daemon
    thread or not, the isDaemon() method can be used. This method returns true if
    a thread is a daemon thread and returns false otherwise.


    A daemon thread can only create a new daemon thread. Note that when the JVM starts,
    there is a single non-daemon thread which typically calls the main() method of
    the class. Each thread has a daemon flag, which is initialized to whatever its
    parent''s flag was set to. Since the main thread of an applet or application has
    its flag set to false, only the way thread can be designated a daemon thread is
    by invoking the following method:


    ```

    setDaemon(true);

    ```


