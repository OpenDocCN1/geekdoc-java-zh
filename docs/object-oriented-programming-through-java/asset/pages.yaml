  md: '# 1.4 Difference between OOP and Procedure Oriented Programming


    Now that we know the basic concepts in OOP, we are in a position to compare it
    with classical procedure programming.


    In classical procedural (or structural) programming, there are techniques to write
    a code that handles some general task The most important techniques of that kind
    are functions (procedures or sub-routines). The large program is partitioned into
    functions that each perform a specific task. The main program calls these functions,
    which in turn may call other functions. The major concern of this programming
    is with respect to the data.


    Data are passed around from one non-member function to another and are available
    everywhere throughout the large program. This allows the user to access the data
    directly, alter from several points in the program and inadvertently introduce
    mistakes. If one programmer changes the representation of the data in the computer''s
    memory by rearranging fields within a structure (record), other functions in the
    program may need to be rewritten and must be retested for this change. The means
    that data are not well protected in procedure oriented programming. Though local
    variables in a function can be accessed within the function, they are not useful
    if they must be accessed by different functions.


    In contrast, OOP safely encapsulates collections of functions (called methods)
    with the data they manipulate. In other words, the data can only be manipulated
    by its own functions. This feature protects the data from the rest of the program.


    Though the concepts of object oriented programming are different from procedural
    oriented programming, structured programming constructs are still used in OOP
    especially in the coding of methods.


    # 1.5 Summary


    As stated earlier, the principles of encapsulation, inheritance and polymorphism
    form strong structures and define the major benefits and drawbacks of OOP. Let
    us take a look at these aspects.


    # 1.5.1 Benefits of OOP


    +   - **Code reusability** New objects can be derived from old objects, allowing
    for improvement and refinement of the code at each stage and preserving parts
    of the code for other programs. This is used to develop many class libraries using
    class codes that have already been written, for example, Microsoft Foundation
    Classes (MFC).

    - **Code Modularity** Everything in OOP is an object; these objects can be exchanged
    or removed to meet the users'' needs.

    - **Easier maintenance** Inheritance usually reduces maintenance because of the
    domino effect it has on derived classes when a change is made in a base class.'
