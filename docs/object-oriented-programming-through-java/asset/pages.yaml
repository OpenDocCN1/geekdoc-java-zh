    ```

    Pro2serimpl pro2serimpl=new Pro2serimpl();

    Naming.rebind("//127.0.0.1/Pro2serinf",pro2serimpl);

    ```


    The registry Object Registry accepts requests to bind and unbind objects that
    are running on the same machine; hence it is not necessary to specify the name
    of the machine when registering an object. The code for the server is placed in
    Pro2server.java.


    # 13.6.2.1 Starting the server


    Before starting the Server, one should start the Object Registry first, and let
    it run in the background. This can be done by giving the following command:


    ```

    Start rmregistry

    ```


    Usually, it takes a few seconds for the Object Registry to start running and to
    start listening on its socket. Then, the server starts and, and like the Object
    Registry, runs in the background. The example server is started by giving the
    following command:


    ```

    java Pro2server

    ```


    It takes a few seconds for the server to start running and to construct and register
    the remote objects. Hence, one should wait for a few seconds before running any
    client. A message can be printed, enabling the client to know when the server
    is ready.


    # 13.6.2.2 Running a client


    The client can run like any other Java program. The example client is executed
    as follows:


    ```

    java Pro2Client

    ```


    In order that this command runs successfully, Pro2Client, Pro2Interface and Pro2_impl
    stub classes should be available on the Client machine. In particular, the Pro2Client.class,
    Pro2Interface.class and Pro2_serimpl Stub.class files must be in one of the directories
    specified in the CLSPATH.


    In theory, it is possible for the client to download the necessary class files
    from the server even if they are not present on the client machine; however, in
    practice, this is very difficult to accomplish because classes can use other classes
    in other packages, and these packages are determined by the CLSPATH that is defined
    locally on each machine.'
