  md: "# 11.5.5 The JTable control\n\nThe JTable component is the most complex visual\
    \ component in the Swing package. The JTable class delegates a great deal of functionality\
    \ to the support classes located in the swing package. The JTable class contains\
    \ a pair of constructors for creating the JTable object.\n\n```\nJTable(Object[]\
    \ row, Object[] columnNames)\nJTable(Vector rowData, Vector columnNames)\n```\n\
    \nThe first constructor is useful if the data is an array of rows, where each\
    \ row is an array of objects. In this case, the Object[] can be passed directly\
    \ to the JTable constructor. The second constructor is useful in the case where\
    \ the data is stored in a Vector of rows, where each row is itself a Vector. Both\
    \ constructors require an array of column names of the table as second parameter.\n\
    \nUsage of the JTable component is illustrated in Program 11.9:\n\n+   * Program\
    \ 11.9\n\n```\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
    import javax.swing.event.*;\nimport javax.swing.table.*;\n\nclass TableDemoFrame\
    \ extends JFrame {\n    TableDemoFrame() {\n        super(\"Table Example\");\n\
    \        Container contentpane=getContentPane();\n        JPanel panel=new JPanel();\n\
    \        panel.setLayout(new BorderLayout());\n        JTable table;\n       \
    \ String colarr[]={{\"Employee Name\", \"Employee_Id\", \"Designation\"};\n  \
    \      String rowdata[][] ={{\"Robert\", \"1022\", \"Asst. Manager\"},\n     \
    \       {\"Williams\", \"2031\", \"Prod. Manager\"},\n            {\"Zaheer\"\
    , \"3021\", \"Clerk\"},\n            {\"Mary\", \"3021\", \"Secretary\"},\n  \
    \          {\"Shekar\", \"1011\", \"Gen. Manager\"},\n            {\"Phillips\"\
    , \"2061\", \"Prod. Manager\"},\n            {\"Lisa\", \"3918\", \"Receptionist\"\
    }};\n```"
