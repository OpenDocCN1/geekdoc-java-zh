  md: '# Object Oriented Programming through Java


    specific calls to take advantage of different features products. To be able to
    exploit this feature vendors must provide classes for using their database. The
    JDBC API also allows the programmer to access databases that reside on local as
    well as remote systems.


    # 9.3.2 Registering the driver


    To start the process of accessing a database, first load the Driver class into
    the JVM for a specified JDBC driver, which allows the program to communicate with
    the database. Loading of JDBC Driver class registers itself with the DriverManager.
    The method Class.forName() is used for this purpose.


    The following statements describe the way of loading drivers of the MS SQL server
    type (type 4), Oracle thin type and the JDBC-ODBC bridge driver (type 1), respectively.


    +   - Class.forName("com.microsoft.jdbc.sqlserver.SQLServerDriver")

    - Class.forName("oracle.jdbc.driver.OracleDriver")

    - Class.forName("sun.jdbc.odbc.jdbcOdbcDriver")


    Before loading the Driver class, classpath is to set equal to the driver classes.
    If this is not done, then the Class.forName() method throws the exception ClassNotFoundException.
    Consider the example of setting the class for an Oracle driver:


    Set classpath=%classpath%;<location-of-oracle-driver>classes12.jar;


    location-of-oracle-driver will specify the path of the Oracle driver class. This
    class had one static block. Once the class is loaded, this static block is executed
    for the purpose of registering the driver with the DriverManager class. This DriverManager
    class internally uses the Driver class.


    # 9.3.3 Connecting to the database


    Once the driver is loaded, we can get the connection to the database using the
    static getConnection() method of the DriverManager class.


    Connection dbcon = DriverManager.getConnection(url, user, password); The parameters
    userid and password represent the user name and password that are used to access
    users'' database. DriverManager matches the parameter url with the registered
    driver classes and returns the Connection object related to that URL. This Connection
    is used to create the JDBC statement that passes the SQL statement to the database
    management system.


    The location of a database is specified using an URL of the following form:


    > <Protocol>:<subprotocol>:<hostname>


    Here, we are using the JDBC so protocol is normally jdbc. Subprotocol specifies
    the database we are using and the version of the database and subname is the name
    of the data source, which identifies the location of the database.'
