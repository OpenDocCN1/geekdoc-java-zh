    \ graphics, animation and multimedia\n* provides a facility for frames\n* enables\
    \ an event handling\n* avoids a risk and provides a secure two-way interaction\
    \ between web pages.\n\nNote that it is possible to execute applets using the\
    \ Java interpreter (using the main() method) if the class is extended with Frame.\n\
    An applet can reside anywhere on the web and can be downloaded on any computer.\
    \ Applets have limited access to the resources of the client into which they are\
    \ installed from an Internet server. For this reason, applets avoid the risk of\
    \ viruses or breaking the data integrity problems at the client. Applets provide\
    \ security by reverifying the generated byte code and no memory space is allocated\
    \ till the reverification process completes. Generally, a virus cannot be hidden\
    \ in uninitialized memory. If the reverification process is not complete, the\
    \ applet will be rejected. Further, applets cannot do the following:\n\n+   *\
    \ Read or write client file system (disks) unless specified explicitly; in such\
    \ cases, the applet is allowed only in certain directories\n* Access the source\
    \ code of the applets; the applet's source code can be accessed only from the\
    \ original server\n* Execute local programs/libraries/ DLLs on the client\n* Opening\
    \ network connections other than to a HTTP server: applets only talk to the server\
    \ they live on\n* Finding information about the user such as user name, directories\
    \ and applications installed\n\nApplets are very useful for the presentation and\
    \ demonstration of a concept in an effective manner. For example, an applet designed\
    \ for explaining the bubble sort algorithm shows visually how the bubble is moved\
