  md: '# 8 Object Oriented Programming through Java


    The advantages of using inheritance are the following:


    +   * Increased productivity

    * Reduced maintenance

    * Standardization


    The major drawback of inheritance is added overhead. This is explained below:


    +   * An user must know changes in the methods of base class before using the
    derived class objects.

    * Though the derived class objects may not require all the functionalities of
    a base class, the derived class implements all the methods of base class. This
    increases the amount of memory required for execution of the program.

    * Since common functionalities exist in the base class, there is an execution
    overhead for derived class due to the implementation of base class methods when
    compared to having the functionalities in a single class itself. In the case of
    a chain of inheritances, the execution overhead may increase further.


    # 1.3.3 Polymorphism


    Polymorphism allows an entity (for example, an attribute, function or object)
    to take a variety of representations. It refers to the ability of an object to
    respond differently to the same message.


    The advantage of this property is that the behaviour of an object varies depending
    on the message passed to it without worrying about the way the message was passed.
    That is, an operation on an object may exhibit different behaviours in different
    situations. The behaviour depends on the data types and number of parameters used
    in the operation.


    For OOP languages, polymorphism ensures reusability of higher level abstractions.
    This feature is also helpful in the implementations of inheritance where some
    base class behaviour needed to be overridden. Moreover, polymorphism facilitates
    describing variables that may refer, at run-time, to objects of different classes.


    # 1.3.3.1 Overloading


    Overloading is one kind of polymorphism. In OOP, there are two types of overloading:
    operator overloading and function overloading.


    Operator overloading Operator overloading is the ability to use an operator on
    different argument types. For example, the operator ''+'' is used to add either
    integers or floating point numbers. Another example is ''-'', which is used to
    negate an expression or to return the difference between two expressions. In addition,
    an operator can be overloaded on objects. Take an object complex number. We can
    add two complex numbers by overloading the operators ''+'' and ''='', using the
    statement c3 = c1 + c2, where c1, c2 and c3 are values of the complex number type.'
