  md: '![](img/2146e82d591b04fc307195fd4ee73d50_21_0.png)


    **Fig. 1.1** (a) An object; (b) example of object car.


    Software objects are modelled after real-world objects in that they too have state
    and behaviour. Attributes define the state of the object and methods define the
    behaviour of the object. That is, a software object maintains its state in one
    or more *attributes*. Attributes can have different values at different instances
    of time; however, values of a particular attribute must have the same data type.


    An object/variable is an item of data named by an identifier, and a software object
    implements its behaviour with *methods*. A method is a function/sub-routine associated
    with an object.


    The state of an object and its behaviour work together. For example, how high
    a ball bounces depends on its elasticity. An object''s behaviour often modifies
    its state. For example, when a ball is rolled, its position changes.


    An object must have a *unique identity* that distinguishes it from all other objects.
    Two objects can have the same data types of attributes with the same names, and
    those attributes can have the same values. Therefore two objects could have the
    same state. There must be a way of distinguishing the two objects and that is
    done by using an object''s name. In a program, to define an object we need a class.


    > A class is a model or pattern from which an object is created. In other words,
    a class is a special module that defines an object.


    A class defines the data types of attribute that will be held in an object, and
    defines code for the methods. After a class was defined, an object can be created
    from it. The process of creating an object from a class is called *instantiation*.
    Every object is an instance of a particular class.'
