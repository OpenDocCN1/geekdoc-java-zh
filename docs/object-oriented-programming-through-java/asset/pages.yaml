    # 6.3.4 The dead state


    A thread goes into the dead state in two ways:


    +   - If its run() method exits.

    - A stop() method is invoked.


    The run() method exits when it finished execution naturally or throws an uncaught
    exception. The stop() method kills the thread. A thread in the dead state cannot
    be executed further.


    # 6.3.5 The blocked state


    A thread can enter the blocked state when one of the following five conditions
    occurs:


    +   - When sleep() is called,

    - When suspend() is called,

    - When wait() is called,

    - The thread calls an operation, (For example, during input/output, a thread will
    not return until the I/O operation completes.),

    - The thread is waiting for monitor.


    A thread in the blocked state waits for some action to happen so that it can get
    ready. That is, if the thread requires some of the I/O operation, it will enter
    into the blocked state by giving the access to the CPU to another thread. After
    completion of the I/O operations it will enter into the runnable state.


    A thread must move out of a blocked state into the runnable (or running) state
    by the opposite of whatever phenomenon put it into the blocked state.


    +   - If a thread has been put to sleep(), the specified timeout period must expire.

    - If a thread has called wait(), then some other thread using the resource for
    which the first thread is waiting must call notify() or notifyAll().

    - If a thread is waiting for the completion of an input or output operation, then
    the operation must finish.


