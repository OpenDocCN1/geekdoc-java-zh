  md: '# 128 Object Oriented Programming through Java


    For classes that are scarcely used in a program, it makes more sense to use their
    full names. Whereas, the keyword import should be utilized if classes of a particular
    package are used multiple times (or if the packages and sub-packages'' names are
    lengthy).


    # 4.3.3 The import command


    As mentioned earlier, to refer to classes belonging to other packages, the import
    keyword is used. This keyword ensures that the desired package with its contents
    is available to the program in which it is invoked. Using import, the entire package
    or individual class can be imported. The syntax for this is as in the following
    example:


    ```

    import java.util.Vector;

    import java.awt.*;

    ```


    When the asterisk (*) is used, implies that all the public classes, methods and
    variables can be accessed by the classes in a program of which the package is
    imported.


    The line import java.awt.*, in the above example, imports all the public classes
    in that package, but does not import sub-packages such as image and peer. To import
    all the classes in a complex package hierarchy, it is necessary to explicitly
    import each level of the hierarchy. Java also prevents use of partial class names.
    For example, L* will not import all the classes that begin with L, every class
    name has to be spelled out in full. Usually import statements are written at the
    top line within the program, before any class definitions (but after the package
    definition).


    # 4.3.4 Name conflicts


    After a class or a package of classes is imported, it is referred to by its name,
    without the package identifier; however, an explicit reference is required when
    there are multiple classes with the same name from different packages. For example,
    consider the case when a program imports two packages, as shown below:


    ```

    import java.util.*;

    import java.sql.*;

    ```


    Both packages, java.util and java.sql, contain a class called Date. The meaning
    and implementation of these two classes, however, are entirely different. It would
    be difficult to understand from which of the packages the Date class is referred
    to, especially when the Date class is referred in the program as follows:


    ```

    Date date = new Date();

    ```


    In such cases, the Java compiler will not complain about a naming conflict nor
    refuse to compile the program. As a result, the programmer will have to refer
    to the appropriate class by using the full package name as given below:


    ```

    java.util.Date date = new java.util.Date();

    ```'
