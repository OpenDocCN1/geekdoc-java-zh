    \ spaces\n\nA white space is a sequence of spaces, tabs, form feeds and line-terminator\
    \ characters. Line terminators can be newline, carriage return return–newline\
    \ sequences in a Java source file. A Java program is a free-format sequence of\
    \ characters, which is tokenized by the compiler, that is, broken into a sequence\
    \ of tokens for further analysis. Separators and operators help to distinguish\
    \ tokens, but sometimes white spaces have to be inserted explicitly. Table 3.3\
    \ explains how different white spaces can be generated in a program.\n\nFor example,\
    \ the identifier classroom will be interpreted as a single token unless a white\
    \ space is inserted to distinguish the keyword class from the identifier room.\
    \ White space aids not only in separating tokens, but also in formatting the program\
    \ so that it is easy for programmers to read. The compiler ignores the white spaces\
    \ once the tokens are identified."
