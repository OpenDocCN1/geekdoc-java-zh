  md: "# 13.7 Security\n\nOne of the common Base problems encountered with RMI is\
    \ failure due to security constraints. A program will not have a security manager\
    \ unless it is specified. A Java program may specify a security manager that determines\
    \ its security policy. Creating a SecurityManager object and calling the setSecurityManager\
    \ method of the System class sets the security policy. A security manager is essential\
    \ for certain operations. The RMISecurityManager class defines an example of\n\
    \nThe Permissions Base is used for maintaining lists of permissions that are granted\
    \ and for checking whether a particular permission has been granted. This is the\
    \ mechanism whereby the security checks checks permissions, but it does not explain\
    \ how we can specify or change the security policy. For this purpose, there is\
    \ another class Policy. Like SecurityManager, each program has a current security\
    \ policy that is obtained by calling the getPolicy(), and one can set the current\
    \ security policy using the method setPolicy(). The security policy can be set\
    \ only if one has permission to do so. The security policy is specified by a policy\
    \ configuration file, which is read either when the program starts or at any time\
    \ a request is made to refresh the security policy. The policy file defines the\
    \ permissions contained in a Policy object. The following code will grant permissions\
    \ of any kind to the code residing in the RMI directory on the C drive:\n\n```\n\
    grant code Base \"file:C/RMI/\"\n{\n    permission java.security.AllPermissions;\n\
    }\n```\n\nThe default security manager uses a policy that is defined in a collection\
    \ of policy files. executing the relevant program, usage of the policy file is\
    \ as follows:\n\n```\njava -D java.security.manager -D java.security.policy=policy-file\
    \ filename\n```\n\nHere, the option “-D” specifies system properties. The first\
    \ system property has the same effect as executing the following statement as\
