  md: "# 6.8 Communication of Threads\n\nIn Java, inter-thread communication is achieved\
    \ using the wait(), notify(), and notifyAll() methods of the Object class. These\
    \ methods are final methods in the Object class and can be called only from within\
    \ synchronized code.\n\n+   - wait() calls the thread to give up the monitor and\
    \ move to sleep until some other thread enters the same monitor and calls notify().\n\
    - notify() wakes up the first thread that called wait() on the same object.\n\
    - notifyAll() wakes up all the threads that called wait() on the same object.\
    \ The highest priority thread will run first.\n\nConsider an example of the queuing\
    \ problem in which two queues are defined: one queue, producer queue, which produces\
    \ some data, and the consumer queue, which consumes the data. Suppose the producer\
    \ has to wait until the consumer is finished before it can generate more data.\
    \ The consumer would wait many CPU cycles while it waited for the producer to\
    \ produce. This may cause polling, which can be avoided by inter-thread communication.\
    \ In I/O based programming, threads will wait in a loop and keep on checking whether\
    \ the task is accomplished or not. This is called polling. Program 6.5 illustrates\
    \ this queuing problem.\n\nProblem 6.5 Using inter-thread communication i: Polling.\n\
    \n```\nclass Queue\n{\n    int n;\n    synchronized int get() {\n        System.out.println(\"\
    Got:\"+n);\n    }\n}\n```\n\n| Name of the method | Function |\n|--- |--- |\n\
    | getThreadGroup() | returns the reference of the ThreadGroup |\n| getMaxPriority()\
