    granted to a particular thread that has entered a synchronized method. Monitor
    refers to a portion of the code in a program. It contains one specific region
    (related to data or resource) that can be occupied by only one thread at a time.
    This specific region within a monitor is known as critical section. A thread holds
    the lock from the time it enters the critical section until it leaves. That is,
    the data (or resource) is exclusively served for the thread, and any other thread
    has to wait to access that data (or resource). Some terminology while using monitors
    is as follows: entering the critical section is known as acquiring the monitor,
    working with the critical section (data or resource) is known as owning the monitor
    and leaving the critical section is known as releasing the monitor.


    The key concept in synchronization is the monitor. The monitor holds exclusive
    lock that can be owned by only object at a time. The monitor allows only one thread
    to execute a synchronized method on the object at one time. This is accomplished
    by giving the ownership of the monitor to that object, or in other words, locking
    the object when the synchronized method is invoked. That object lock is also denoted
    to have obtained the lock.


