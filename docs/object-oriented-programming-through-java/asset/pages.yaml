  md: '# 10.5.1 Adapter classes


    | Name of listener interface | Components supporting the event |

    | --- | --- |

    | MouseListener | mouseClicked(MouseEvent me)<br>mouseEntered(MouseEvent me)<br>mouseExited(MouseEvent
    me)<br>mousePressed(MouseEvent me)<br>mouseReleased(MouseEvent me) |

    | WindowListener | windowOpened(WindowEvent we)<br>windowClosing(WindowEvent we)<br>windowClosed(WindowEvent
    we)<br>windowActivated(WindowEvent we)<br>windowDeactivated(WindowEvent we)<br>windowIconified(WindowEvent
    we)<br>windowDeiconified(WindowEvent we) |

    | ItemListener | itemStateChanged(ItemEvent) |

    | TextListener | valueChanged(TextEvent) |


    Adapter classes are empty implementations of listener interfaces. An empty implementation
    is when the method declaration exits with no code definition. For example, the
    MouseMotionAdapter has two methods, mouseDragged() and mouseMoved(). The signatures
    of these empty implementations are exactly as defined in the MouseMotionListener.
    If we are interested in only mouse drag events, we could simply extend MouseMotionAdapter
    and implement mouseDragged(). In some cases, empty implementations are used to
    implement only one or two methods of the listener methods. In that case the adapter
    class is used which implements all the methods of the listener interface. The
    list of adapter classes corresponding to each of the listener interfaces is presented
    in Table 10.5.


    > Table 10.5 Adapter classes corresponding to different listener interfaces.


    | Adapter classes | Listener interfaces | Adapter classes | Listener interfaces
    |

    | --- | --- | --- | --- |

    | ComponentAdapter | ComponentListener | MouseAdapter | MouseListener |

    | ContainerAdapter | ContainerListener | MouseMotionAdapter | MouseMotionListener
    |

    | FocusAdapter | FocusListener | WindowAdapter | WindowListener |

    | KeyAdapter | KeyListener | | |'
