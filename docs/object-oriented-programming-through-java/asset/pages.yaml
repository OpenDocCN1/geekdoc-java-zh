    # 12.5 Multi-tier Applications using JDBC from a Servlet


    Servlets are the server-side components that enhance the capability of Java-enabled
    servers and allow a variety of network-based services. For example, servlets with
    the database communication can facilitate solutions for distributed applications.


    A typical three-tier architecture for database applications is shown in the Figure
    12.6. The first tier (client) contains a browser (such as Netscape or Microsoft
    IE). The second tier contains the Java-enabled web server and the JDBC driver
    (for example, JDBC-ODBC bridge driver). The database is contained in the third
    tier. Servlets allow dynamic HTML pages to communicate with the client and database
    through JDBC.


    # 12.5.1 Writing JDBC/Servlet


    Consider the example of the TestDataBase servlet in Program 12.4 which illustrates
    the use of the servlet framework in JDBC/Servlet communication. This servlet makes
    a connection to the database and returns data in HTML form.


    Servlets are built by extending a basic Servlet class and overriding some of the
    methods to deal with incoming client requests. TestDataBase extends the HttpServlet
    class that provides most of the capabilities needed to serve client requests.
    After the servlet is loaded, three methods are involved in the life-cycle of a
    servlet.


