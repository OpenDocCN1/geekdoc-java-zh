    # 9.4 Processing Queries


    Java database connectivity defines a set of API objects and methods to communicate
    with databases. In the process of communicating with databases, a Java program
    does the following:


    +   * Opens a connection to a database

    * Makes a Statement object

    * Passes SQL statements to the DBMS through the Statement Object, and

    * Retrieves the results of the SQL statements, along with information about the
    result sets.


    There are three different ways of constructing and executing SQL statements in
    JDBC. They use the following classes:


    +   * Statement This class allows the execution of static SQL command in a string
    format.

    * PreparedStatement This class allows repeated execution of a compiled statement.
    It can also use it to execute a parameter-less stored procedure.

    * CallableStatement This class allows executing the stored procedures and takes
    advantage of optimization by the database system.


    paredStatement and CallableStatement are the sub-classes of the Statement class.'
