  md: '# 7.2 Java I/O


    Streams are represented in Java as classes. The java.io package defines a collection
    of stream classes that support input and output (reading and writing). To use
    these classes, a program needs to import the java.io package, as shown below:


    ```

    import java.io.*;

    ```


    In general, streams are classified into two types known as character streams and
    the byte streams. The java.io package provides two sets of class hierarchies to
    handle character and byte streams for reading and writing:


    +   1. InputStream and OutputStream classes are operated on bytes for reading
    and writing, respectively.


    +   2. Classes Reader and Writer are operated on characters for reading and writing,
    respectively.


    There are two other classes that are useful for handling input and output. These
    are File class and RandomAccessFile class.


    A brief description of these four classes of java.io package are given in Table
    7.1.


    # 7.2.1 Character streams


    Reader and Writer are abstract super-classes for streaming 16-bit character inputs
    and outputs, respectively. Methods of these classes throw the IOException exception
    under error conditions. All the methods in the Writer class have return type void.


    | Table 7.1 Description of the four classes in the package java.io |

    | Name of class | Description |

    | --- | --- |

    | Reader, Writer | Supports read/write 16-bit Unicode characters (specified in
    Java 2). Used for only text data. |

    | InputStream, OutputStream | Define basic methods for input and output streams
    of data. These classes are used only for binary(byte) data. |

    | File | Enables creating, deleting and renaming files, navigating through the
    file system, testing file existence and information about files. |

    | RandomAccessFile | Enables the program to read/write/from/to any location in
    the file, not just the beginning/end of the file, as is the case as in the usual
    sequential access. The file works as a random-access disk file. |'
