  md: "# Object Oriented Programming through Java\n\n# 14.2 Generics\n\nIn general,\
    \ data structures use type object to store data of any type. It is easy to store\
    \ any object of any type in a collection of objects; however, when objects are\
    \ to be retrieved, casting the objects to its original type is required. A wrong\
    \ type-casting causes an error in the program. Writing programs with suitable\
    \ casting is cumbersome and hence carries a performance penalty for runtime-checking.\
    \ Generics allow parameterized types for storing and manipulation of the data\
    \ in classes, interfaces and methods.\n\nGenerics are useful for creating new\
    \ types based on a passed parameter type. The compiler uses some algorithms in\
    \ the Java 1.5 version to create these new types. These algorithms avoid casting\
    \ to the original types during insertions of objects or retrieval of objects.\n\
    \nGenerics, simply called parameterized types, can be defined as a mechanism by\
    \ which a single piece of code can be used for different data types without mentioning\
    \ entity explicitly for each data type. The programmer can generate generic methods,\
    \ classes and interfaces by using parameterized types, and the type of data on\
    \ which they wok is specified as a parameter. With this concept, the programmer\
    \ can reuse the code for different applications. Two main advantages of generics\
    \ are the following:\n\n+   - Code reuse and\n- Type-safety by avoiding explicit\
    \ casting\n\nGenerics also provide a facility for creating types that have type\
    \ parameters. It also allows creating a single class that works on different types\
    \ of data. For example the following code declares a generic Queue class with\
    \ a type parameter T. Depending on the parameters passed by the user the compiler\
    \ checks which function is to be called.\n\n```\nPublic class Queue<T>\n  T[]\
    \ element;\n  int size;\n  public void insert(T x) {....}\n  public T delete()\
    \ {....}\n\n```\n\nThe type parameter T is specified between angle brackets (<\
    \ >) after the class name. This parameter acts as a placeholder. The element to\
    \ be inserted in the queue is represented by x. The actual type, which is substituted\
    \ in place of T, is supplied as parameter when the actual class is used in a program,\
    \ when the type argument for T is specified as int then the code is of the\n\n\
    ```\nQueue<int> queue = new Queue<int>();\nqueue.insert(6);\nint x = queue.delete();\n\
    ```"
  merge: -1
