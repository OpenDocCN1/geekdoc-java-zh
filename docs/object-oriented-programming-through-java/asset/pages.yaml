  md: '# 5.5 Unchecked and Checked Exceptions


    Based on the severity of the error, Exception classes are categorized into two
    groups: unchecked exceptions and checked exceptions.


    Unchecked exceptions are those that can be either handled or ignored. If the programmer
    ignores an unchecked exception, the program will terminate when such an error
    occurs. On the other hand, if a handler is provided for an unchecked exception,
    the result of such an error will depend on the code written in the exception handler.
    An example of an unchecked exception is the RuntimeException (and its sub-classes),
    which is a sub-class of the class Exception. It is a very important class in Java
    programming.


    Checked exceptions are a type of exceptions that cannot be ignored. These exception
    classes represent abnormal conditions. The programmer should anticipate and catch
    them to avoid abnormal termination of the program. These exceptions are checked
    by the compiler and the program code must handle or declare checked exceptions,
    otherwise the program will not compile. Thus, checked exceptions should be treated
    more carefully.


    All exceptions instantiated from the Exception class, or from sub-classes of Exception
    RuntimeException and its sub-classes, must be dealt with in one of the following
    ways:


    +   - They must be handled with a try block followed by a catch block,

    - they must be declared in the throws clause of any method that can throw them.


    # 5.6 Handling Exceptions in Java


    Exception handling in Java is accomplished by using five keywords: try, catch,
    throw, throws and finally.


    In Java, the code that may generate (or throw) an exception is enclosed in a try
    block. The try block can be followed immediately by one or more catch blocks with
    a finally block as the last block. The try block can also exist without a catch
    block, and the catch blocks need not always have finally as the last block.


    Each catch block specifies the type of exception it can catch and contains an
    exception handler code. After the last catch block, an optional finally block
    provides code that is always executed regardless of whether or not an exception
    occurs. If there are no catch blocks following a try block, the finally block
    is required.


    When an exception is thrown, control goes out of the try block and the catch blocks
    are searched in the order described earlier for an appropriate handler. If the
    exception type matches the parameter type in one of the catch blocks, the code
    for that catch block is executed. If no exceptions are thrown in the try block,
    the exception handlers (catch blocks) for that block are skipped and the program
    resumes execution after the last catch block. If a finally block appears after
    the catch block, it is executed, whether or not an exception is thrown.


    We can specify with a throws clause the exceptions a method throws. An exception
    can be thrown from statements in the method or from a method that is called directly
    or indirectly from the try block. The point at which the throw is executed is
    called the throw point.'
