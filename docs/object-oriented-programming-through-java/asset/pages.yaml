  md: '# 10.6 AWT Controls


    Controls are the components that allow the user to interact with an application.
    The layout managers are used to arrange the AWT components. AWT supports several
    types of control. These are listed below:


    +   * Labels

    * Buttons

    * Lists

    * Radio Buttons

    * Scroll Bars

    * Text Field

    * Choice Lists

    * Text Area

    * Check Boxes


    # 10.6.1 Labels


    These controls are used to present some type of interactive information on a container.
    These will not interact with the user and do not fire any events. So, there is
    no listener class for the labels. The syntax for creating labels is as shown below:


    ```

    Label label=new Label();

    Label label=new Label(String str);

    Label label=new Label(String str, int alignment);

    ```


    The first form creates a blank label. The other constructors create labels with
    the specified string; the string specifies how text is aligned within the label.
    So, the second argument int.alignment will take the values Label.RIGHT, Label.LEFT
    and Label.CENTER, which are constants defined in the Label class. The string used
    in the label can be obtained using the method getText(). To set a text for a label
    the method label.setText("First Label"); is used.


    # 10.6.2 Buttons


    Push buttons are widely used in Java AWT. These contain a label that specifies
    the name of the button. Whenever a push button is clicked, it generates an event
    and executes the code of the specified listener. A push button can be created
    using the following syntax:


    ```

    Button button=new Button();

    Button button=new Button(String buttonname);

    ```


    Here also the label can be set using the jLabel(String str) method and it can
    be got using the getLabel() method. Program 10.1 illustrates the action of push
    button control.


    > Program 10.1 Using push button control.


    ```

    import java.awt.*;

    import java.awt.event.*;

    ```'
