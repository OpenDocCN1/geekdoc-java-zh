  md: '# 1.3.1.2 Data hiding


    Encapsulation provides the hiding of data/information. It prevents users from
    seeing the internal workings of an object. The main reason for doing this is to
    protect data that should not be manipulated by the user.


    An object has a public interface that other objects can use to communicate with
    it. The object can maintain private information and methods that can be changed
    at any time without affecting other objects that depend on it.


    Every class can hide some of its parts. For example, if a part of code is called
    only by methods of that class, it can be made a private method, that is, invisible
    from outside that class. Every element (field or method) of one class can have
    one of the three levels of visibility: public, private and protected.


    +   * Public elements are completely visible from outside the class. They form
    the interface with the outside world.

    * Private elements are visible only to methods of the class itself.

    * Protected elements are something between public and private. To the outside
    world, they act as private elements, but they are completely visible to inherited
    child classes (these are discussed later)—they have public behaviour for these
    classes.


    Some benefits of encapsulation are the following:


    +   * Improves program reliability

    * Reduces maintenance

    * Lends reusability

    * Facilitates information hiding

    * Improves modularity

    * Makes coding easier (This allows for inefficient codes to be optimized.)


    # 1.3.2 Inheritance


    Inheritance is the feature of OOP by which the functionality of a class, called
    the parent or base class, can be extended by creating another class, called the
    child or derived class, which inherits some or all of the features of the parent
    class. The derived class has its own methods apart from the methods of base class
    and thus extending the functionality. This is the key for code-reusability.


    > Inheritance is the process of creating a new class from previously defined classes.


    When a derived class inherits from the base class, it will contain all the attributes
    and methods of the base class but adds new characteristics of its own. Any changes
    that are made to base classes are propagated to all derived classes that inherit
    from them, unless explicitly overridden. Changes to a base could fix or break
    an application.'
