  md: '# 3

    Java Language Fundamentals


    This chapter familiarizes readers with the fundamentals of Java programming language.
    The first part of the chapter deals with various data types in Java, literals,
    identifiers, operators and so on. The second part gives an overview of various
    control statements and arrays in Java.


    # 3.1 The Building Blocks of Java


    Java, as a programming language, follows a set of rules that define any programming
    language. There are predefined conventions that specify how syntactically legal
    constructs can be formed using the language elements. A semantic definition specifies
    the meaning of syntactically legal constructs.


    # 3.1.1 Lexical tokens


    Low-level language elements are called lexical tokens. These tokens are building
    blocks for more complex constructs. Identifiers, operators and special characters
    are all examples of tokens that can be used to build high-level constructs such
    as expressions, statements, methods and classes.


    # 3.1.1 Identifiers


    Identifiers are program elements (such as a variable, function/method, class and
    so on). Java has certain rules for naming identifiers. The naming rules are given
    below:


    +   - Digits, letters, underscore or currency symbols ($, €, or ¥) are allowed

    - The first letter of any identifier cannot be a digit.

    - An identifier name must not be a reserved word

    - Since Java programs are written in the Unicode character set, the definitions
    of letter and digit are interpreted according to this character set.

    - Java is case-sensitive, label and Label are two different identifiers.


    > Legal Identifiers: number, Number, sum_, average

    Illegal Identifiers: 48sum, all/clear, end-to-end'
