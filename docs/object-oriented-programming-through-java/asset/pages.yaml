  md: "# 10.71 The FlowLayout manager\n\nThe FlowLayout manager is the layout manager\
    \ that arranges the components of the container in the same manner as the word-pad\
    \ editor arranges the words in it. That is, it will arrange the components of\
    \ the container from top-left of the container and moving towards the bottom-right\
    \ of the container with the small spaces between them. Whenever the container\
    \ is resized then the components in the container are also adjusted from the top-left\
    \ corner. Program 10.7 is an example of using layout.\n\nProgram 10.7 Using layout\
    \ managers.\n\n```\nimport java.awt.*;\nclass TestFlowLayout extends Frame\n{\n\
