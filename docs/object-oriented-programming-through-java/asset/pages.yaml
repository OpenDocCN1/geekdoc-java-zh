  md: '# Object Oriented Programming through Java


    In many ways, public is similar to the default package. Both allow methods and
    variables to be accessed by other classes in the same package. The difference
    occurs when the package is created. Variables and methods with package protection
    can be used in classes that exist in the same package. But if the class is imported
    from outside the package, these methods and variables will not be accessible unless
    they have been declared public. The syntax for declaring a variable or method
    package is as shown below:


    ```

    public Add()

    {

    }

    ```


    The final form of protection available in Java concerns the relationship between
    a class and its present and future sub-classes declared inside or outside a package.
    These sub-classes are much closer to a particular class than to any other ‘outside’
    classes, for the following reasons:


    +   - Sub-classes usually ‘know’ more about the internal implementation of a super-class.

    - Sub-classes are often written by a ripple programmer who knows the source code.

    - Sub-classes are frequently modified as to enhance the representation of the
    data within a parent class.


    To support a special level of visibility reserved for sub-classes that are required
    to be somewhat less restricted than private, Java offers an intermediate level
    of access between package and private called, protected. (The definition of packages
    and the way to use them are given in detail in Section 4.3). The keyword protected
    implies that these methods and variables are accessible to all classes inside
    the package and only sub-classes outside the package.


    A summary of types of protection The differences between various types of protection
    can be unclear particularly in the case of protected methods and variables. Table
    4.1 describes different types of protection (access specifiers).


    # Table 4.1 Different types of protection.


    | Visibility | Public | Protected | Package (No modifier) | Private |

    | --- | --- | --- | --- | --- |

    | From the same class | yes | yes | yes | yes |

    | From any class in the same package | yes | yes | no | no |

    | From any class outside the package | yes | No | no | no |

    | From a sub-class in the same package | yes | yes | yes | no |

    | From a sub-class outside the same package | yes | yes | no | no |'
