    # 8.5 The HTML APPLET Tag


    The APPLET tag is used to start an applet either from a web browser or an applet
    viewer. The HTML tag allows a Java applet to be embedded in an HTML document.


    A number of optional attributes can be used to control an applet''s appearance,
    the dimensions of the applet panel. Also, parameters can be independently defined
    which can be passed to the applet to control its syntax of the applet tag is given
    below:


    The complete syntax of the applet tag is given below:


    ```

    <applet

    code = "appletFile"-or- [object = "serializedApplet"]

    width = "pixels"

    height = "pixels" [codebase="codebaseURL"]

    [archive = "archiveList"]

    [alt = "alternateText"]

    [name = "appletInstanceName"]

    [align = "alignment"]

    [vspace = "pixels"]

    hspace = "pixels"

    >

    [param name = "appletAttribute1" value = "value">

    [param name = "appletAttribute2" value = "value">

    ...

    ...

    [alternateHTML]

    </applet>

    ```


    # 8.5.1 Attributes in the applet tag.


    The code, width and height are mandatory and all other attributes are options,
    which are shown in brackets ([ ]). The attributes need not follow the order that
    was specified in the above syntax. The description of each attribute is given
    below:


    code The name of the Java class. Class file, which contains the compiled applet
    code. This name must be relative to the base URL of the Applet and cannot be an
    absolute URL. The extension in the file name is optional.


    width This refers to the width of the applet panel specified in pixels in the
    browser window.


    height This refers to the height of the applet panel specified in pixels in the
    browser window. The width and height attributes specify the applet''s, display
    area. This applet area does not include any windows or dialogue boxes that the
    applet shows.'
