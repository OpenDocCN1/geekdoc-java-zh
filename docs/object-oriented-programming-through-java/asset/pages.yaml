  md: '# Object Oriented Programming through Java


    6. Java is dynamically linked Java does not have an explicit link phase. The Java
    source code is divided into .java files, roughly one per class. The compiler compiles
    these into .class files containing byte code. Each .java file generally produces
    exactly one .class file.


    The compiler searches the current directory and directories specified in the CLSPATH
    environment variable to find other classes explicitly referenced by name in each
    source code file. If the file that is compiled depends on other, non-compiled
    files, the compiler will try to find and compile them as well. The compiler handles
    circular dependencies as well as methods that are used before they are declared.
    It also determines whether a source code file has changed since the last time
    it was compiled.


    More importantly, classes that were unknown to a program when it was compiled
    can still be loaded at run-time. For example, a web browser can load applets of
    differing classes that it has never seen before without recompilation.


    Furthermore, Java classes tend to be small, a few kilobytes at most. It is not
    necessary to link in run-time libraries to produce a (non-native) executable.
    Instead the necessary classes are loaded from the user''s CLSPATH.


    7. Other features of Java Java has no pointers. Java programs cannot access arbitrary
    addresses in memory. Memory access is handled behind the scenes by the (presumably)
    trusted run-time environment. Java provides automatic memory allocation and de-allocation.


    # 2.3 Comparing Java and Other Languages


    The best way to describe a computer language is to compare its characteristics
    with those of other languages. The major features in which Java differs from other
    languages are listed below:


    +   - Java is similar to C and C++ but is strongly typed (that is, every identifier
    must have a type) like Pascal or Ada.

    - Java is dynamically linked which means that it does not look for a sub-program
    until it is called. This results in smaller programs than possible with statically
    linked programs and permits more efficient transfers of code over the Internet.

    - Java is case-sensitive, therefore care should be taken in naming fields, identifiers
    and other attributes.

    - Java does not support pointers. It does not permit the direct manipulation of
    addresses (results in safe programs).

    - Java allows single inheritance (that is instantiation of a child class having
    properties of only one parent class) but prevents multiple inheritance. Java permits
    multiple-level inheritance, however. Multiple inheritance can be achieved in Java
    through interfaces.

    - Java is a compiled and interpreted language, which results in faster applications
    and provides more security for the source code.'
