    \ Integer.parseInt(br.readLine());\n    rate = Integer.parseInt(br.readLine());\n\
    \n    for(int years=0;years< 5; years++) {\n      { // condition for continuing\
    \ loop\n        interest = principal * rate; //\n        principal += interest;\
    \ // do three statements\n        System.out.println(principal); //\n      }\n\
    \    }\n  }\n```\n\nThe initialization, continuation condition and updating have\
    \ all been combined in the first line of the for loop. This keeps everything involved\
    \ in the ‘control’ of the loop in one place, which makes the loop easier to read\
    \ and understand. A for loop is executed in exactly the same way as the original\
    \ code. The initialization part is executed once before the loop begins. The continuation\
    \ condition is executed before each execution of the loop, and the loop ends when\
    \ this condition evaluates to false. The update part is executed at the end of\
    \ each execution of the loop, just before jumping back to check the condition.\n\
    \nThe formal syntax of the for statement is as follows:\n\n```\nfor ( initialization;\
    \ continuation-condition; update )\n  {\n    statements\n  }\n```\n\nIf a block\
    \ statement is used, it takes the following format:\n\n```\nfor ( initialization;\
    \ continuation-condition; update )\n  {\n    statements\n  }\n```\n\nHere, continuation-condition\
    \ must be a boolean-valued expression, whereas initialization can be any expression,\
    \ as can be update. Any of the three can be empty. If the continuation condition\
    \ is empty, it is treated as if it were true, so the loop will be repeated forever\
    \ or until it ends for some other reason, such as a break statement.\n\n> Some\
    \ people like to begin an infinite loop with for (;;) instead of while (true)."
