  md: "# 10.6.7 TextField control\n\nThe reader is encouraged to execute Program 10.5\
    \ and see the result.\n\nThe TextField control holds a single line of text that\
    \ can be edited. Hence, this control is called editable control. The TextField\
    \ control is a sub-class of the TextComponent class. It can be created using the\
    \ following constructors:\n\n```\nTextField=new TextField();\nTextField=new TextField(int\
    \ numberofchar);\nTextField=new TextField(String str);\nTextField=new TextField(String\
    \ str, int numberofchar);\n```\n\nThe first constructor creates the default TextField.\
    \ The second creates a TextField of size specified by the number of characters.\
    \ The third creates a text field with the default constructor. The text control\
    \ has the methods getText() and setText(String str) for getting and setting the\
    \ values in the text field. The text field can be made editable or non-editable\
    \ by using the following methods:\n\n```\nsetEditable(Boolean edit);\nisEditable();\n\
    ```\n\nThe isEditable method returns the boolean value true if the text field\
    \ is editable and the value false if the text field is non-editable. Another important\
    \ characteristic of the text field is that the echo character can be set, while\
    \ entering password-like values. To set echo characters the following method is\
    \ called:\n\n```\nvoid setEchoCharacter(char ch)\n```\n\nThe echo character can\
    \ be obtained and it can be checked it echo character has been set using the following\
    \ methods:\n\n```\ngetEchoCharacter();\nboolean echoCharsSet();\n```\n\nSince\
    \ text field also generates the ActionEvent, the ActionListener interface can\
    \ be used to handle any type of action performed in the text field. The selected\
    \ text within the text field can be obtained by using the TextField Interface.\n\
    \n```\n{\n  new TestList1();\n}\n```"
