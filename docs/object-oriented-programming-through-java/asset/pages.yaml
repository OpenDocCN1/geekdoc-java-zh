  md: '# 302 Object Oriented Programming through Java


    The key concepts of AWT class hierarchy are the following:


    +   - Component is an abstract class. All other classes shown in Figure 10.2 are
    non-abstract (concrete).

    - The Component class is super-class of all the non-menu-related user-interface
    classes. It provides support for event handling, drawing of components and so
    on. Some of the methods of the Component class are


    ```

    void setForeground(Color c)

    void setBackground(Color c)

    ```


    As the name indicates, these methods are used to set the colour of a component.
    The font of the rendered text can be changed using the setFont(Font f) method.
    All components of the Window class and its sub-classes (Dialog and Frame) are
    visible by default. The visibility of a component can be changed using the setVisible
    method (defined in the Component class). The prototype of this method is


    ```

    void setVisible(boolean b)

    ```


    +   - The Panel class does not have a title, menu or border. The Applet class
    is used to run programs that run in a web browser.

    - The Window class represents a top-level window. Neither Window nor Panel classes
    have title, menus or borders. The Window class is rarely used directly and its
    sub-classes Frame and Dialog are more common.

    - The pack method defined in the Window class initiates the layout manager of
    sub-components of the window.


    # 10.5 Event Handling


    In Java, each component fires an event whenever a user carries out a specific
    action. Each event is represented by a class. An event is an instance of the class
    Event which is in the AWT library. Whenever an event is fired, it is received
    by one or more listeners which act on that. Thus, the source of the event and
    the place where the event is handled can be kept separate. This process is known
    as the event delegation process. That is, when an event is fired on a component,
    it is passed to another component called the listener. This listener continuously
    listens for the event to be fired and takes up a specific task on receiving the
    signal.


    Each listener is an object of a class that implements a particular type of listener
    interface. The steps taken in handling the events that take place are the following:


    +   - A class that extends a frame or an applet (any container) and implements
    a particular listener created.

    - The event with the component that fires the event is registered.

    - A class that has the implementation for the methods in the listener interface
    is created.'
