    the path and name of a directory or file. But this class is not useful in retrieving
    or storing data. The File object can be used to create, rename or delete file
    or directory it represents. A directory is treated as a file that contains a list
    of files. Each file (directory) in Java is an object of the File class. A File
    object is used to manipulate the information associated with a disk file, such
    as last modification date and time, directory path and also to navigate through
    the hierarchies of sub-directories.


    The File class has three constructors that are used to create a file object. They
    are the following:


    +   * File(String pathname); // pathname would be a file or directory name

    * File(String dirPathname, String filename); // specify directory where the file
    is created // and file name

    * File(File directory, String filename); // file object as the directory path


    These constructors return the reference to the file object.


    The File class provides several methods that deal with the files, file system,
    properties of the file and tests on the files. Some of the important methods that
    serve these purposes are listed in Table 7.7.'
