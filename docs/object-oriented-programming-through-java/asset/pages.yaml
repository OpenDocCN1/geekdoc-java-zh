    \ a newly created Thread object belongs to the same group as the Thread that creates\
    \ it. In a thread group can be dealt with as a group. It is possible to interrupt\
    \ all the threads in a group. A thread group allows the member threads to act\
    \ collectively when a method such as suspend(), resume() or stop() is invoked.\
    \ This is also true for its sub-groups. That is, these operations work in a recursive\
    \ manner.\n\nA thread group can be the parent to a child thread group. Method\
    \ calls sent to a parent thread are also sent to all the threads in parent's child\
    \ thread groups. The class ThreadGroup provides the following constructors.\n\n\
    +   - public ThreadGroup(String stringName)—constructs a ThreadGroup with name\
    \ stringName.\n- public ThreadGroup(ThreadGroup parentThreadGroup, String stringName)—constructs\
    \ a child ThreadGroup of parentThreadGroup called stringName.\n\nThe class Thread\
    \ provides three constructors that enable the programmer to instantiate a Thread\
