- img_proc: true
  md: 'The variables that you declare in JavaScript can use the strings that are stored
    along with any numbers that are stored. But, when you are doing math, JavaScript
    is going to focus mainly on numbers.


    In your script, you are going to create two different variables with two different
    numbers.


    Code:


    ```

    var apples = 5, oranges = 10;

    ```


    Now you have created your two variables. The reason that var was only used once
    because you did an initialization and gave the variables a value. When you write
    the keyword once and separate them with a comma, you save yourself extra work.


    With the help of JavaScript, you are going to be able to figure out how many pieces
    of fruit you have.


    Code:


    ```

    var piecesOfFruit = apples + oranges;

    ```


    The code is going to tell the browser that is needs to figure out the sum from
    the number on the right before it reassigns result to how many piecesOfFruit there
    are. But, the names of the variables are not going to be added together, only
    the values are going to be added. Your browser is going to know what you are doing
    and will only give you the sum of the values.'
  merge: -1
  pgno: 21
- img_proc: true
