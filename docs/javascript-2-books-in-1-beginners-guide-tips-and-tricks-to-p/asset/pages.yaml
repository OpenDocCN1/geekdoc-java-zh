- img_proc: true
  md: 'As mentioned in the previous chapter, the JavaScript that helps run interactive
    websites does not work alone and functions alongside HTML and CSS, forming the
    three core languages that make up a web page.


    So us begin writing JavaScript. Since JavaScript will run in a web page we need
    to first have a web page where the JavaScript language would be written.


    Below is a simple web page example to use as our reference:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Title here</title>

    </head>

    <body>

    <p>This is a web page</p>

    </body>

    </html>

    ```


    Code is composed of basic HTML and no CSS, very basic stuff. So now if you copy
    the code and paste it on a Notepad application, then save it as an HTML file,
    for example "first.html" and then double-click that file, (if the browser does
    not open the file when you double-click it, open the browser manually and drag
    the file to its window) then the web browser installed in your computer should
    be able to render the code successfully and produce the result of


    This is a web page.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'And just as we use opening and closing p tags to surround a paragraph, for
    JavaScript we enclose it with script tags. <script> </script>


    For the first JavaScript code to add to this HTML file example, we are going to
    use a JavaScript popup box called alert that produces a popup message box upon
    running the web page and output the text ‘Hello World’.


    ```

    <script>

    alert("Hello World!");

    </script>

    ```


    Note that in order for the popup box to appear, make sure your browser’s Privacy
    Settings would allow this.


    Now putting everything together, we add the JavaScript code to the rest of the
    HTML:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Title here</title>

    </head>

    <body>

    <p>This is a web page</p>

    <script>

    alert("Hello World!");

    </script>

    ```'
  merge: -1
