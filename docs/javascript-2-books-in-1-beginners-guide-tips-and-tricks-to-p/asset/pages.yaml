    # Variables


    Variables are going to be easier to understand if you think of them as shelves.
    Each shelf has a name that is created once the variable has been created. So,
    for the previous code, your shelf’s name is going to be “surname” and the object
    that is setting on shelf is the user’s surname.


    Anything you want to make as a variable can be made. But, it is recommended that
    you name your variables first so that you know which variable is which instead
    of naming things such as numbers or letters.


    At the point in time that you tell the browser that you are using to locate a
    variable, it is not only going to be located, but the data on that “shelf” is
    going to be given back to you. The object on the shelf is also known as a value.


    The data that is stored in the value is called a string. So the letters that make
    up someone’s last name are going to be the surname variables value and string.
    Strings do not just have to be letters; they can be numbers as well. Basically,
    string is an array of any possible character to be used.


    Essentially, every variable is going to have a value as well as a name and this
    is how data is going to be stored.


    Variables are created through two parts an an initialization and a declaration.'
