- img_proc: true
  md: "Using JavaScript logic will make the decision for the code based on what sort\
    \ of comparison has been made. Before the comparison can be made, there has to\
    \ be a condition set. There are several conditions that are used in JavaScript,\
    \ but the most common one is the If statement.\n\n# If statement\n\nWhen the condition\
    \ is found to be true, the code set is going to be run the way that it is supposed\
    \ to. Thanks to the if statement, you are going to be able to add extra code that\
    \ has to be run should the condition turn out to be true. When the condition is\
    \ returned as false, then there will have to be extra conditions and blocks of\
    \ code that are going to be run optionally. This option is going to be the if-else\
    \ statement.\n\nCode:\n\n```\nif(10 > 5) {\n  // Run the code here\n}\n```\n\n\
    Any code that has been placed between the curly brackets is going to be considered\
    \ a block and will be connected to the If statement. However, it is only going\
    \ to be run if the condition that falls between the parentheses turns out to be\
    \ true.\n\nNote: the double slashes are going to indicate a comment that has been\
    \ placed in the code and it is not going to be run as code. The comments are placed\
    \ so that the code can be easily understood by others."
