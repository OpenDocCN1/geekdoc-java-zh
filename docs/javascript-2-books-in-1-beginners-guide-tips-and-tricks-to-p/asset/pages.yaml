    # Module Loader Compatibility


    Not many developers use module loaders, and this is entirely up to you. However,
    you need to be aware that some developers that use your library might choose to
    use a module loader, so you need to make your library compatible with this feature.


    You can choose some of the popular module loaders such as AMD, RequireJS, and
    CommonJS. If choosing between these functions is hard for you, you can also try
    Universal Module Definition (UMD) which is aimed at supporting several types of
    module loaders.


    To make your library UMD compatible, you can also find some variations such'
