    # License


    Licenses are important too. Include licenses so everyone knows what material

    is copyrighted. ChooseLicense.com is recommended as an excellent resource

    for acquiring a license without any legal advisor. Save your chosen license as

    text in a LICENSE.txt file format in your project''s root.


    # Adding Versions/leases to Your Git Repository


    Versioning is necessary for a good library. The current standard for version

    naming is via the SemVer, for Semantic Versioning. This version

    prises three numbers to indicate different changes for major, minor, and

    patch. If you have a git repository, you can also add in version numbers.

    Consider the snapshots of your repository or Tags. To create a tag, open your

    terminal and do the following:


    ```

    # git tag -a [version] -m [version message]

    git tag -a v1.2.0 -m "Awesome Library v1.2.0"

    ```


    GitHub for example provides a comprehensive view of all your versions as

    well as download links for each one of them.


    # Publishing to Common Repositories


    # npm


    Most programming languages are equipped with package managers or they

