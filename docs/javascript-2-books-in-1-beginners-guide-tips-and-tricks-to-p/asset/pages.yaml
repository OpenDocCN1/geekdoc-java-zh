- img_proc: true
  md: "The code that is located inside of a browser is going to be event driven and\
    \ when you are writing applications that are interactive, you are going to have\
    \ to wait for as well as react to the events that are going to ultimately alter\
    \ the behavior from the browser. An event is going to occur when the page has\
    \ been loaded, or the user has interacted with something on the page. There are\
    \ also other times that are going to be triggered, but these have to be done manually.\n\
    \nWhen you need to react to an event, you are going to have to listen for it so\
    \ you can supply a function. The function is going to be called by the browser\
    \ whenever the event has occured and it is known as a callback.\n\nCode:\n\n```\n\
    var handleClick = function(event) {\n  // choose a different action !\n};\n```\n\
    \n```\nvar button = document.querySelector('#big-button');\nbutton.addEventListener('click',handleClick);\n\
    ```\n\naddEventListener is a method that is going to be found first on all of\
    \ the DOM elements. When it is called, the element is going to be saved in the\
    \ variable of button. The argument that is listed first in the string is the name\
    \ of the event that you should be listening for. The event in this code is the\
    \ tapping of a mouse or someone's finger. The call back is going to be the handleClick.\n\
    \nIf you are using Internet Explorer, addEventListener is not going to be supported\
    \ if you are running a version that is earlier than version 9. In that case, you\
    \ should use attachEvent instead."
