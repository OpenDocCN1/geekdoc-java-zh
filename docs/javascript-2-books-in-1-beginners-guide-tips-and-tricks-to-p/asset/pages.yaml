- img_proc: true
  md: 'When you are programming, it is important to have the ability to compare different
    values so that decisions can be made when it comes to the code and how it is going
    to be carried out. The comparison will either make your outcome false or true.
    Then, there is a special data type that is known as a Boolean data type.


    Using JavaScript to do math will bring out a set of operators that are going to
    work with Booleans. These comparisons are going to be made when you are working
    on a console. Whichever you get from every line is going to be shown as true or
    false.


    # Equality


    To determine if two different values are equal you will use three equals signs.
    (===)


    Code:


    ```

    15.234 === 15.234

    ```


    True


    To check if two variables are not equal, you will need to use two signs and also
    use exclamation sign before them. (!== )


    ```

    15.234 !== 18.4545

    ```


    True'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Strings that contains numbers, are equal to that number in value, but not in
    type, so the === comparison is going to return false


