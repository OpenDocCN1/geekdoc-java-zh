- img_proc: true
  md: 'DOM stands for Document Object Model and it will manipulate how an HTML page
    is structured and styled. It is going to be represented by the internal pages
    that the browser is going to see so that the developer is able to alter the JavaScript
    code.


    In order to look at the DOM for a page, you are going to open the developer tool
    inside of the browser that you are using and locate the "elements" pane. You can
    do this by clicking right click somewhere on the page in your browser and clicking
    "Inspect Element" from the menu list that appears. This will give you a good insight
    as to how the browser thinks. In most browsers, you are going to have the ability
    to modify and remove elements directly without asking for permission.


    # Trees and Branches


    HTML is similar to the structure of an XML in that the elements are going to contain
    parent nodes from the structure that it creates along children nodes. It is much
    like tree branches. HTML is going to have a single root element that contains
    branches much like a head and body and the limbs that are going to be attached
    to it. Because of this, DOM is also known as a DOM tree.


    When altering a DOM, you are going to pick an element and change whatever you
    want about it. This process is normally done with JavaScript. In order to access
    DOM from JavaScript, you are going to need the document for the object that is
    being used. It will be provided by the browser so that the code is allowed to
    interact with the code that is on the page’s content.


    # Getting Elements


    When you are getting an element, you are going to have several ways that you can
    do it depending on the browser that you are using.'
  merge: -1
