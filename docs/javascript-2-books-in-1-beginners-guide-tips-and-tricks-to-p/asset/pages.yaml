    surged significantly and it also shows exactly when GitHub stars for React began
    to catch up with AngularJS''s stars.


    The change is due to Redux, created by Dan Abramov during the ReactEurope2015
    conference. Redux had a simple flux implementation that convinced many programmers
    that it was time to adopt the one and only React.


    Before the materialization of Redux, React was turbulent as people were trying
    to figure out how to execute the ''Flux'' architecture. Since then, many other
    implementations being surfacing, and when they weren''t bad, they weren''t exactly
    solving any issues that most JavaScript developers wary.


