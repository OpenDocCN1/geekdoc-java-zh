- img_proc: true
  md: "Just like a circle, a loop is going to continue to repeat the same code over\
    \ multiple times. Loops are usually used when an code needs to be carried out\
    \ for an object in an array.\n\nTwo loops that you are going to use most often\
    \ are going to be while loops for loops. The conditions are going to be combined\
    \ together and then the block of code is going to be run until the condition is\
    \ forced to no longer be true.\n\n# While loops\n\nWhile loops will repeat the\
    \ code while the condition turns out to be true. While loops are very similar\
    \ to if statements statements and the condition that is placed inside the parentheses\
    \ is true.\n\nCode:\n\n```\nvar i = 1;\nwhile (i < 10) {\n  alert(i);\n  i = i\
    \ + 1;\n}\n// i is now going to be 10\n```\n\nOnce the loop has been completed,\
    \ the code will keep running even after the closing bracket. This code will produce\
    \ popup alert boxes displaying numbers from 1 to 9, and when it completes the\
    \ loop, value for i will be equal to 10.\n\n# For loops"
  merge: -1
  pgno: 32
- img_proc: true
  md: "For loops are similar to if statements, the main difference being that there\
    \ will be three semicolons to separate bits of information that is placed between\
    \ a set of parentheses. A for loop is going to initialize the condition to get\
    \ a final expression.\n\nWhile initializing, you will be creating the variable\
    \ so that you can track how far into the loop you are going to go just like you\
    \ did with the while statement. Your condition is going to be where the loop's\
    \ logic will go. The final expression is going to be run at the end of every loop\
    \ that has been created.\n\nCode:\n\n```\nfor(var i = 1; i < 10; i++) {\n  alert(i);\n\
    }\n```\n\nIn the code, an alert box is going to pop up that is going to give the\
    \ numbers 1 to 10 in their proper order. The i++ will be the same as i=i+1. (i++)\
    \ is called \"incrementing\" the value of i. As you can see, both for and while\
    \ loops works the same in this case. You probably wonder when to use for and when\
    \ to use while loop. This is a short explanation.\n\nWhile loops are generally\
    \ used when you don't know the number of how many times the loop will circle around.\
    \ For example, user is playing a game, where he needs to guess the hidden number.\
    \ You can never know how lucky the user is, so you don't know when he will pick\
    \ the right number. That is why you set the while loop and just wait for the right\
    \ number to come up.\n\nCode:\n\n```\nvar number = 0;\n// 7 is the hidden number!\n\
    prompt(\"Try to guess the number!\");\nwhile (number!= 7) {\n  number = parseInt(prompt(\"\
    Wrong number, try again!\"));\n}\n```"
