  md: '![](img/f55b088b60008aab90a6ca2520da3303_106_0.png)


    HTML and CSS are the most basic coding knowledge you need to know before you proceed
    to learn other things. Then you can move on to JavaScript and jQuery. Once you
    have created your roadmap, it''ll make it easier for you to focus on what is essential
    first so you don''t waste time and effort.


    # TIP 2: TAKE YOUR TIME


    Wanting to understand coding quickly will be one of the harmful things that halt
    your progress of learning coding and JavaScript. Attempting to skim and then moving
    on to the next issue at hand will only make you forget things even more. You''ll
    forget what you read the first time, go back to it and refresh your memory and
    move on. By this time, you''ve forgotten something else entirely. This cycle will
    keep repeating, and then you will find yourself discouraged. To prevent this from
    happening, you can do this:


    +   - Limit the amount of coding to a particular task. Learn one thing at a time

    - Practice what you''ve learned


    By learning and practicing your coding skills, you''ll find that it is a lot easier
    to remember things and absorb them as you go on learning new things. This'
  merge: -1
