    ## Chapter 2: Writing your first JavaScript code


    As mentioned in the previous chapter, the JavaScript that helps run interactive
    websites does not work alone and functions alongside HTML and CSS, forming the
    three core languages that make up a web page.


    So us begin writing JavaScript. Since JavaScript will run in a web page we need
    to first have a web page where the JavaScript language would be written.


    Below is a simple web page example to use as our reference:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Title here</title>

    </head>

    <body>

    <p>This is a web page</p>

    </body>

    </html>

    ```


    Code is composed of basic HTML and no CSS, very basic stuff. So now if you copy
    the code and paste it on a Notepad application, then save it as an HTML file,
    for example "first.html" and then double-click that file, (if the browser does
    not open the file when you double-click it, open the browser manually and drag
    the file to its window) then the web browser installed in your computer should
    be able to render the code successfully and produce the result of


    This is a web page.


    And just as we use opening and closing p tags to surround a paragraph, for JavaScript
    we enclose it with script tags. <script> </script>


    For the first JavaScript code to add to this HTML file example, we are going to
    use a JavaScript popup box called alert that produces a popup message box upon
    running the web page and output the text ‘Hello World’.


    ```

    <script>

    alert("Hello World!");

    </script>

    ```


    Note that in order for the popup box to appear, make sure your browser’s Privacy
    Settings would allow this.


    Now putting everything together, we add the JavaScript code to the rest of the
    HTML:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Title here</title>

    </head>

    <body>

    <p>This is a web page</p>

    <script>

    alert("Hello World!");

    </script>

    </body>

    </html>

    ```


    Save the file and double-click on it to open it up in the web browser. If this
    does not work, open the browser and just drag the file to the browser window;
    it will open the webpage you are creating. You should then see the alert message
    box pop up with the text ‘Hello World!.


    **Result:** Hello World!


    Congratulations – you have written your first JavaScript code. In the next chapters,
    we will discuss more about the language and how you can use it to produce better
    web pages.


    ## Chapter 3: Data and JavaScript variables


    Data is normally stored so that it can be used at a later date. This is a very
    important aspect of writing code. JavaScript is a wonderful programming language
    that is going to store the data so that you can use it later and do not have to
    worry about it getting lost.


    When you are writing code, you are going to be able to have it interact with the
    users by asking for information that may be able to be used at a later time.


    # Code


    You would like for the user to enter their last name so that you can personalize
    a greeting for them.


    ```

    var surname = prompt("Greetings user, may I ask what your surname is?");

    ```


    After the code has been run, a box is going to appear asking the user what their
    last name is. All the user is going to need to do is type in their last name before
    they hit enter or click the okay button for the information to be moved and stored
    in the proper place.


    Congratulations, you have now created a variable that will be the surname of the
    user.


    # Variables


    Variables are going to be easier to understand if you think of them as shelves.
    Each shelf has a name that is created once the variable has been created. So,
    for the previous code, your shelf’s name is going to be “surname” and the object
    that is setting on shelf is the user’s surname.


    Anything you want to make as a variable can be made. But, it is recommended that
    you name your variables first so that you know which variable is which instead
    of naming things such as numbers or letters.


    At the point in time that you tell the browser that you are using to locate a
    variable, it is not only going to be located, but the data on that “shelf” is
    going to be given back to you. The object on the shelf is also known as a value.


    The data that is stored in the value is called a string. So the letters that make
    up someone’s last name are going to be the surname variables value and string.
    Strings do not just have to be letters; they can be numbers as well. Basically,
    string is an array of any possible character to be used.


    Essentially, every variable is going to have a value as well as a name and this
    is how data is going to be stored.


    Variables are created through two parts an an initialization and a declaration.


    After you create it, you will then assign it to the proper value.


    # Declaration


    The declaration process will declare that the variable exists. Back to thinking
    of the variable like a shelf, the declaration is like when you are first picking
    out of the shelf in the store.


    To set a variable aside, the word var is used before the name of the variable
    is written in. This tells the code what the variable is named and how it should
    be run.


    Code:


    ```

    var birthday;

    var first_name;

    ```


    Note: Every line in JavaScript is going to end in a semicolon so that the code
    is run as JavaScript and not as regular text.


    # Initialization


    To give a variable the value that it needs, you will use the initialization process.
    These values can be changed at a later date, but it is only going to be initialized
    one time.


    The initialization of a variable will use the equals sign so that the statement
    reads that the value from the variable that is listed on the left side of the
    equals sign will be with the data that is on the left.


    Code:


    ```

    var name = "Sue";

    ```


    The string is going to be the name Sue and that string is going to be surrounded
    by a set of quotes either double or single.


    Code:


    ```

    var age = 22;

    ```


    Since the value for the variable is a number, it must not be in quotes to be recognized
    as a number. This type of variable is called integer.


    # Assigning


    Setting the value to the variable is known as assigning. The value can be assigned
    to the variable an unlimited number of times. It is going to be much like the
    initialization process that was mentioned earlier.


    There is going to be an equals sign used but you are not going to need to use
    the var keyword since the code already exists.


    Code:


    ```

    Name = "Sue";

    Age = 22;

    ```


    But the variable has to be declared before it can be assigned!


    ## Chapter 4: Math with JavaScript


    The variables that you declare in JavaScript can use the strings that are stored
    along with any numbers. But, when you are doing math, JavaScript is going to focus
    mainly on numbers.


    In your script, you are going to create two variables.


    ```

    var apples = 5, oranges = 10;

    ```


    Now you have created two variables. The reason that var was only used once because
    you did an initialization and gave the variables a value. When you write the keyword
    once and separate them with a comma, you save yourself extra work.


    With the help of JavaScript, you are going to be able to figure out how many pieces
    of fruit you have.


    ```

    var piecesOfFruit = apples + oranges;

    ```


    The code is going to tell the browser that needs to figure out the sum from the
    number on the right before it reassigns result to how many piecesFruit there are.
    But, the names of the variables are not going to be added together, only the values
    are going to be added. Your browser is going to know what you are doing and will
    only give you the sum of the values.


    Your sum is not going to be pieces of fruit but instead it will be piecesOff since
    variables cannot contain any spaces. It is easy to notice that the O and F in
    Of and Fruit are capitalized. This is known as camel casing and it helps to make
    the variable easier to read.


    Keep in mind that there are various ways for code to be read. That is why it is
    so important for you to be sure that your code is easy to read and understand.


    # Splitting


    There is more than just addition when you are doing math. For code, there is division.


    Code:


    ```

    var piecesForEachPerson = piecesOffFruit / 3 ;

    ```


    JavaScript is able to do this math without you having to get out a calculator
    to make sure that the math is done properly.


    Division is done with a forward slash to ensure that you are dividing the left
    side from the right side.


    # Operators


    To get the sum of a set of numbers, you are going to use symbols for every operation.


    - Multiplication ( * )

    - Addition ( )

