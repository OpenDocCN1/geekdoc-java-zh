    });\n```\n\nThe code for this is going to attach to the click handler of all the\
    \ elements that are listed in the btn class. The selector syntax will be the core\
    \ of jQuery.\n\njQuery can be placed on the website with the file like a scripting\
    \ element. You can pull the file from jquery.com or you can add from a CDN.\n\n\
    Code:\n\n```html\n<script src='http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n```\n\nYou should not always use a library, but you should choose\
    \ if it is going to have a structure that is established on the product of the\
    \ developers choosing. For example, if jQuery has an extensive document that needs\
    \ to be introduced, then the downloading is going to be slow for the page, especially\
    \ when it comes to mobile browsers that might have weak connections.\n\n## Chapter\
