  mdcn: "\n\n## 代码：\n\n```javascript\n$.ajax({\n  url: '/save',\n  method: 'POST',\n\
    \  data: { username: 'burt' },\n  success: function (data) {\n    console.log(data);\n\
    \  },\n  Error: function () {\n    //错误操作\n  }\n});\n```\n\n## 第 19 章：\njQuery\
    \ 及其他技巧\n\njQuery 将帮助你完成其他常见的任务，特别是当某些操作在系列浏览器中的表现不一致时。\n\n## DOM 加载完成 (DOM Content\
    \ Loaded)\n\n某些情况下，JavaScript 需要在 DOM 加载后运行，用于编写代码，当你尝试将对象移动到网站的各个部分，或者设计一个新网站时。这将完全由\
    \ JavaScript 完成。但它在每个浏览器中都能无法工作。\n\n代码：\n\n```javascript\nvar doSomething = function(event)\
    \ {... };\nwindow.addEventListener('DOMContentLoaded', doSomething);\n```\n\n\
    然而，使用 jQuery 这样做会更简单，而且它可以跨越多个浏览器运行。\n\n代码：\n\n```javascript\n$(doSomething);\n\
    ```\n\n# 加载 (Load)\n\n在某些情况下，你需要在等待页面完全加载后尝试对其进行任何操作。当你使用 jQuery 时，你将监听加载到窗口的事件。\n\
    \n代码：\n\n```javascript\nwindow.addEventListener('load', doSomething);\n```\n\n\
    使用 jQuery，它会更简单\n\n代码：\n\n```javascript\n$(window).load(doSomething);\n```\n\n\
    ## 类型检查 (Type Checking)\n\n要找出存储在变量中的数据，JavaScript 处理起来很笨拙，但 jQuery 能够向你展示如何轻松地完成这一点。\n\
    \n代码：\n\n```javascript\n$.isArray([1, 2, 3]);\n```\n\nTrue\n\n$.isFunction(function()\
    \ { });\n\nTrue\n\n$.isNumeric(10);\n\nTrue\n\n$.isPlainObject({name: 'Burt'});\n\
    \nTrue。\n\n## 第 20 章：\nJavaScript 控制流语句\n\n在前面的章节中我们讨论了 `if`、`else` 和循环，但本节将更详细地解释这些内容。\n\
    \n源文件将按照它们编写的精确顺序执行叙述内容。控制流语句将处理运算符根据循环、决策、分支进行流转的方式，以及程序如何由于带有条件的特定代码块得以运行。\n\
    \n## If-then (如果-那么)\n\n`if then` 语句是你将使用的最简单的控制语句。该语句仅在括号内的表达式为真（true）时才会执行你的代码。\n\
    \n驾员培训班只有在汽车已经移动时，才会允许刹车来降低汽车的加速度。\n\n代码：\n\n```javascript\nfunction applyBrakes()\
    \ {\n  // \"if\" 子句：汽车已经在运动中\n  if(isMoving) {\n    // \"then\" 子句：降低汽车的加速度\n\
    \    acceleration--;\n  }\n}\n```\n\n如果条件为假（false），则控制语句将移动到代码块中的下一个语句。大括号是严格可选的；但是，只有当它们之间的语句是单个语句时，情况才如此。\n\
    \n代码：\n\n```javascript\nfunction applyBrakes() {\n  // 与上述代码相同，只是这里没有大括号。\n  if(isMoving)\
    \ CurrentSpeed--;\n}\n```\n\n每当省略大括号时，你就让你的变得变得易出错。如果在代码中放置了另一个表达式，就会增加一个要求，意味着你必须使用大括号，但编码人员有时会忘记它们。JavaScript\
    \ 编译器不会捕获这个错误；它只会给你一个不正确的结果。\n\n## If-then-else (如果-那么-否则)\n\n`if then else` 子句将在子句最终失败时为代码创建一条次要路径。\n\
    \n代码：\n\n```javascript\nfunction applyBrakes() {\n  if(isMoving) {\n    currentSpeed--;\n\
    \  } else {\n    alert(\"汽车没有移动！\");\n  }\n}\n```\n\n## Switches (切换)\n\n`switch`\
    \ 语句为代码的执行提供了不同的路径。`switch` 语句将与 `int`、`short`、`char` 和 `byte` 数据以及枚举数据类型工作。\n\
    \n代码：\n\n```javascript\nvar month = 8;\nvar monthString;\nswitch(month) {\n  case\
    \ 1: monthString = \"January\";\n    break;\n  case 2: monthString = \"February\"\
    ;\n    break;\n  case 3: monthString = \"March\";\n    break;\n  case 4: monthString\
    \ = \"April\";\n    break;\n  case 5: monthString = \"May\";\n    break;\n  case\
    \ 6: monthString = \"June\";\n    break;\n  case 7: monthString = \"July\";\n\
    \    break;\n  case 8: monthString = \"August\";\n    break;\n  case 9: monthString\
    \ = \"September\";\n    break;\n  case 10: monthString = \"October\";\n    break;\n\
    \  case 11: monthString = \"November\";\n    break;\n  case 12: monthString =\
    \ \"December\";\n    break;\n  default: monthString = \"Invalid\";\n    break;\n\
    }\nalert(monthString);\n```\n\n作为 `switch` 块的一部分，`switch` 语句将允许（此处原文为重复性文本，已按逻辑翻译并处理）语句将允许语句\
