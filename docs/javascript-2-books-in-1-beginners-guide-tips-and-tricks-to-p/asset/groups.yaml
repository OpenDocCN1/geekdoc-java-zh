    Once you have done your testing and you are completely satisfied with the API\
    \ design for your first library version, then you can start thinking about the\
    \ site’s architecture and how exactly will your library be used.\n\n## Module\
    \ Loader Compatibility\n\nNot many developers use module loaders, and this is\
    \ entirely up to you. However, you need to be aware that some developers that\
    \ use your library might choose to use a module loader, so you need to make your\
    \ library compatible with this feature.\n\nYou can choose some of the popular\
    \ module loaders such as AMD, RequireJS, and CommonJS. If choosing between these\
    \ functions is hard for you, you can also try Universal Module Definition (UMD)\
    \ which is aimed at supporting several types of module loaders.\n\nTo make your\
    \ library UMD compatible, you can also find some variations such as the UMD GitHub\
    \ repository. Begin to create your library by using one of these templates. Another\
    \ tip is to use Babel to compile ES5 combined with Babel’s UMD plugin if you choose\
    \ to use ES2015 import/export syntax function. This way, you can use ES2015 in\
    \ your projects as well as produce a library that can be used by all kinds of\
    \ developers using various modules.\n\n## Documentation\n\nYou need to start your\
    \ documentation with basic information such as your project name as well as a\
    \ short description of what it is about. This will help others understand what\
    \ your library is meant to do and whether using your library is a good choice\
    \ for them. You can also include a little bit more information on things such\
    \ as scope and goals so users are better informed. Your roadmap can also be included\
    \ so users know what they can expect in the future in your library development\
    \ and how they can also contribute to it.\n\n## API, Tutorials and Examples\n\n\
    API documentation is an essential part of your library as it tells users how to\
    \ use it.\n\n## Contribution\n\nContributions are great when you open-source your\
    \ library.\n\n## Meta-tasks\n\nMeta-tasks are useful when you want to automate\
    \ some processes.\n\n## License\n\nLicenses are important so everyone knows what\
    \ material is copyrighted.\n\n## Adding Versions to Git Repository\n\nVersioning\
    \ is necessary for a good library. The current standard for naming is via SemVer,\
    \ Semantic Versioning. This version uses three numbers to indicate changes for\
    \ major, minor, and patch.\n\n## Publishing to Common Repositories\n\n### npm\n\
    \nMost programming languages are equipped with package managers or they have a\
    \ third party package manager that enables users to pull in specific libraries.\
    \ For example, PHP's manager is Composer and Ruby on Rails is RubyGems. For a\
    \ standalone JavaScript engine such as Node.js you have npm. By default, your\
