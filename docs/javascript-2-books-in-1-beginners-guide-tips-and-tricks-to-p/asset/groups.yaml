    \ // is false` | |\n| charAt() Shorthand | To do this, you can utilize the eval()\
    \ function however this bracket shorthand technique is much simpler than an evaluation<br>Longhand:\
    \ `'myString',charAt(0);`<br>Shorthand: `'myString'[0]; // Returns 'm'` |\n| Strings\
    \ convert to Numbers | The fastest and easiest (jsPerf) way to do this would be\
    \ using the + (plus) operator. `var one = '1';` `var numberOne = +one; // Number\
    \ 1` | |\n\nYou can also use the - (minus) operator which type-converts the value\
    \ into number but also negates it.\n\n```javascript\nvar one = '1';\n```\n\n```javascript\n\
    var negativeNumberOne = -one; // Number -1\n```\n\n### Truthy/falsy values converted\
    \ to boolean\n\nYou can convert a Truthy or Falsy value to true boolean with '!!!'\n\
    \n```javascript\n!!\" // false\n!!0 // false\n!null // false\n!undefined // false\n\
    !!NaN // false\n```\n\n```javascript\n!!\"hello\" // true\n!!1 // true\n!!{} //\
    \ true\n!![] // true\n```\n\n### Using JSON.stringify\n\nLet's say there is an\
    \ object with properties \"prop1\", \"prop2\", \"prop3\". Additional params can\
    \ be passed to JSON.stringify to selectively write properties of the object to\
    \ string like:\n\n```javascript\nvar obj = {\n  'prop1': 'value1',\n  'prop2':\
    \ 'value2',\n  'prop3': 'value3'\n};\n```\n\n```javascript\nvar selectedProperties\
    \ = ['prop1', 'prop2'];\n```\n\n```javascript\nvar str = JSON.stringify(obj, selectedProperties);\n\
    ```\n\n```javascript\n// str\n// {\"prop1\":\"value1\",\"prop2\":\"value2\" }\n\
    ```\n\nThe \"str\" will contain only info on selected properties only. Instead\
    \ of array we can pass a function also.\n\n```javascript\nfunction selectedProperties(key,\
    \ val) {\n  // the first val will be the entire object, key is empty string\n\
    \  if ('key') {\n    return val;\n  }\n\n  if (key === 'prop1' || key === 'prop2')\
    \ {\n    return val;\n  }\n\n  return;\n}\nThe last optional param takes is to\
    \ modify the way it writes t object to string.\nvar str = JSON.stringify(obj,\
    \ selectedProperties, '\\t');\n\n/* str output with double tabs in every line.\\\
    n{\n  'prop1': \"value1\",\n  'prop2': \"value2\"\n}*/\n```\n\n### Single Method\
    \ for Arrays and Writing Single Element\n\nInstead of writing separate methods\
    \ to hold an array and a single element parameter, you can write functions so\
    \ that they can handle both. You just have to concat everything into an array\
    \ first. Array.concat will accept an array or a single element.\n\n```javascript\n\
    function printUpperCase(words) {\n  var elements = [].concat(words || []);\n \
    \ for (var i = 0; i < elements.length; i++) {\n    console.log(elements[i].toUpperCase());\n\
    \  }\n}\n```\n\nPrint UpperCase is now ready to accept a single node or an array\
    \ of nodes as its parameter. It also avoids the potential TypeError that would\
    \ be thrown if no parameter was passed.\n\n```javascript\nprintUpperCase('cactus');\n\
    // => CACTUS\nprintUpperCase(['cactus','bear', 'potato']);\n// => CACTUS\n// BEAR\n\
    // POTATO\n```\n\n### Measure performance for a JavaScript Block\n\nFor quickly\
    \ measuring the performance of a JavaScript block, we can use the console functions\
    \ like console.time(label) and console.timeEnd(label)\n\n```javascript\nconsole.time(\"\
    Array initialize\");\nvar arr = new Array(100),\nlen = arr.length,\ni;\nfor (i\
    \ = 0;i < len;i++) {\narr[i] = new Object();\n};\nconsole.timeEnd(\"Array initialize\"\
    ); // Outputs: Array initialize: 0.711ms\n```\n\nHoisting will help you manage\
    \ your function scope. Variable declarations and functions are hoisted to the\
    \ top where as variable definitions are not.\n\n## Chapter 5: JavaScript Skills\
    \ to Know Moving Forward\n\nFor the past year, ReactJS has been getting more traction\
