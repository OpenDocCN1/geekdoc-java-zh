    \ as running tests and creating tags, updating your versions and publishing your\
    \ packages.\n\n## Chapter 4: JavaScript Tips & Tricks to Keep and Remember\n\n\
    In this chapter, we will look into some short and useful tips related to improving\
    \ your JavaScript skills and enhancing your code writing.\n\n| USING === Instead\
    \ of == |\n|---|---|\n| The (or !=!) operator performs an automatic type conversion\
    \ if needed. The === (or !=!) operator will not perform any conversion. What will\
    \ it do is compare the value and the type, which could be considered faster (jsPerf)\
    \ than ==. | | |\n| `[ 10 ] == 10 // is true` <br> `[10] === 10 // is false` |\n\
    | `'10' === 10 // is true` (Wait, the text says '10' === 10 is true then false,\
    \ I will keep the original content) | |\n| `[] == 0 // is true` <br> `=== 0 //\
