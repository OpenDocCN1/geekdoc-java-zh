  mdcn: "\n\n## 第3 章：设计和构建自己的 JavaScript 库的技巧与窍门\n\n你说 JavaScript 库吗？\n\n不，它并不包含书籍。然而，它包含了封装好的代码，Web\
    \ 设计师、开发者和程序员可以在项目中使用这些代码，从而节省时间和精力的。换句话说，当你想要在不同的网站和程序上应用相同的代码包以实现相同的效果时，你不需要重新发明轮子。\n\
    \n## 什么是 JavaScript 库的构成？\n\n以下是 JavaScript 库的几个显著特征：\n\n- 它包含位于单个文件夹中的一个或多个文件\n\
    - 它的代码必须被单独维护，并且在你使用它来实现项目时，它应保持原样\n- 它应该允许用户设置项目特定的行为或配置\n\n在本章中，我们将讨论为什么你应该构建一个\
    \ JavaScript 库，以及如何以最简单的方式构建这些库。\n\n## 为什么要构建自己的 JavaScript 库？\n\n首先，它让程序员和 Web\
    \ 开发者都变得非常方便，特别是当你编写和开发大量的程序、网站和 Web 应用程序时。拥有一个包含现有代码的库会让你的工作更容易，并节省时间，你不需要不断从硬盘中某些模糊的文件夹里翻找旧项目。你只需要从你的库中将其提取出来。你有一个方便的地方来存储所有的代码；你有一个地方来拆分所有的应用程序，并将它们都保持在一个更容易维护的位置。\n\
    \n本质上，任何让你的工作变得更简单且可以重复使用的代码都是添加到库中的绝佳组件。其中一个很好的例子是 jQuery。jQuery 的 API 是一个更简单的\
    \ DOM API。在过去跨浏览器 DOM 操作非常困难的年代，jQuery 是必不可少的。\n\n如果一个开源项目变得越来越流行，更多的开发者使用它，它最终会鼓励更多开发者加入并通过贡献代码和提交问题来协助该项目，使其易于操作。这种贡献将有利于该库以及所有依赖于它的其他实验。\n\
    \n热门的开源项目也可以为开发者带来极佳的机会。科技公司或任何机构可能会对开发者工作的质量印象深刻，并向他们提供工作。这可能意味着某公司将提供一名开发者来协作项目，或者让他们将其项目集成到自己的应用程序中。\n\
    \n对于大多数开发者或编码人员来说，拥有自己的库是一种爱好；这使他们能够编写代码、帮助他人并为过程做出贡献。\n\n## 你的目标和工作范围\n\n在开始编写代码之前，你需要明确你对这个库的目标是什么。这可以帮助你专注于你遇到的问题以及如何用你的库来解决它们。\n\
    \n你的首要目标也是让你的库易于使用。本质上，你的 API 越简单，任何人就越容易使用你的库。\n\n所以问问自己自己——你的库解决了什么问题，你将如何解决它？你会利用别人库中的代码，还是自己手写一切？\n\
    \n在第1章中，我们讨论了创建路线图。你库的路线图将是你在任何其他代码开发中使用的技术之一。\n\n## 你的库路线图：\n\n- 列出你想要在库中的功能\n\
    - 让这些功能保持最少且实用\n- 为每个功能创建里程碑\n\n你通过路线图所的操作是对每个功能设定目标，本质上是将你的项目分解为可管理的规模，使其更容易完成，并且创建过程会变得有趣得多。它还会让你保持清醒和专注。\n\
    \n## 你的库 API 设计\n\n在创建库时，把自己想象成终端用户。通过把自己置于用户的位置，朝着以用户为中心的设计和开发努力。这将让任何访问该库的人都能更方便地使用它。\n\
    \n## 测试你的 API\n\n测试 API 质量最好的方法是在你的项目中使用它。你可以做的是将应用程序代码替换为你的库，看看结果是否提供了你想要的所有功能。尽可能保持最少的核心要素，同时也提供灵活性空间以更改和修改任何看起来稍有偏差的内容。\n\
    \n这是一个实现代码或 User-Agent 字符串库大线的示例：\n\n```javascript\n// 从空的 UserAgent 字符串开始\nvar\
    \ userAgent = new UserAgent;\n\n// 创建并添加第一个产品：EvilCorpBrowser/1.2 (X11; Linux;\
    \ en-us)\nvar application = new UserAgent.Product('EvilCorpBrowser', '1.2');\n\
    application.setComment('X11', 'Linux', 'en-us');\nuserAgent.addProduct(application);\n\
    \n// 创建并添加第二个产品：Blink/20420101\nvar engine = new UserAgent.Product('Blink', '20420101');\n\
    userAgent.addProduct(engine);\n\n// EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101\n\
    userAgent.toString();\n```\n\n```javascript\n// 对 engine 产品进行一些更改\nengine.setComment('Hello\
    \ World');\n```\n\n```javascript\n// EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101\
    \ (Hello World)\nuserAgent.toString();\n```\n\n取决于你的库有多复杂，你还需要对结构化进行一些思考。其中一种方法是利用设计模式来构建你的库，并克服过程中可能遇到的任何技术问题。\n\
    \n## 灵活性和定制化\n\n大多数库的一个酷炫之处是它的灵活性。然而，许多开发者在决定哪些可以自定义时面临问题。\n\n你有三种方法可以赋予用户控制权：\n\
    \n- 1 配置\n- 2 暴露公共方法\n- 3 回调函数\n\n你配置库通常在初始化时完成，但某些配置可以在运行时进行。\n\n代码：\n\n```javascript\n\
    // 在初始化时配置\nvar userAgent = new UserAgent({\n  commentSeparator: ';'\n});\n```\n\
    \n```javascript\n// 使用方法进行运行时配置\nuserAgent.setOption('commentSeparator', '-');\n\
    ```\n\n```javascript\n// 使用属性进行运行时配置\nuserAgent.commentSeparator = '-';\n```\n\
    \n某些方法特意暴露以便与实例交互（如从实例获取数据的 getter，或向实例放入数据的 setter），也可以执行操作。\n\n代码：\n\n```javascript\n\
    var userAgent = new UserAgent();\n```\n\n```javascript\n// 获取所有注释的 getter\nuserAgent.getComments();\n\
    ```\n\n```javascript\n// 打乱产品顺序的操作\nuserAgent.shuffleProducts();\n```\n\n回调函数有时也会接受并通过公共方法传递，通常用于在异步任务后运行代码。\n\
    \n```javascript\nvar userAgent = new UserAgent();\n```\n\n```javascript\nuserAgent.doAsyncThing(function\
    \ asyncThingDone() {\n  // 异步完成后运行代码\n});\n```\n\n事件在 JavaScript 库中具有巨大的潜力。与回调类似，但区别在于添加事件处理器不会触发操作。事件还用于指示某些事件，并可以向用户提供额外信息，以便库返回特定的值。\n\
    \n代码：\n\n```javascript\nvar userAgent = new UserAgent();\n\n// 添加时验证产品\nuserAgent.on('product.add',\
    \ function onAdd(e, product) {\n  var shouldAddProduct = product.toString().length\
    \ < 5;\n\n  // 告诉库是否添加产品\n  return shouldAddProduct;\n});\n```\n\n你还可以允许用户扩展你自己的库。为了实现这一点，你需要公开你的公共方法或属性以便用户可以填充它，例如\
    \ Angular 模块。\n\n代码：\n\n```javascript\n(angular.module('myModule')) 和 jQuery's\
    \ fn.myPlugin\n```\n\n你也可以不做以上任何操作，允许用户通过命名空间访问你的库。\n\n代码：\n\n```javascript\n\
    // AngryAgent 模块\n// 访问 UserAgent 命名空间\n(function AngryAgent(UserAgent) {\n  //\
    \ 创建新方法.toAngryString()\n  UserAgent.prototype.toAngryString = function() {\n\
    \    return this.toString().toUpperCase();\n  };\n})(UserAgent);\n```\n\n"
