    ## ES6 At Last


    One of the things that JavaScript developers do in 2016 moving forward 2017 is
    to ensure that all their apps are ES2015 compliant. But like many complications
    with tech apps and programming language, we have the Babel vs. TypeScript issue.


    Babel mostly translates the ES6 code to ES5 whereas TypeScript is really a superset
    of JavaScript that adds necessary but optional static typing to JavaScript and
    then compiles all of this to plain JavaScript as well. Babel and TypeScript have
    been created with totally different purposes and therefore not comparable.


    Babel, developed by Facebook, supports Flow which also adds in the static type-checking
    for JavaScript. Using Babel makes a little bit more sense since you can use both
    consecutively. Babel was also the first to help bridge the difference between
    ES5 and ES6 applications.


    TypeScript on the other hand only supports ES6, thus playing second fiddle to
    Babel when it comes to progressiveness. Checking in with the GitHub stars, it
    looks like Babel is the most preferred transpiler. React developers also prefer
    to use the Babel + Webpack combo.


