    JavaScript 框架，开发者发现 Meteor 框架用起来非常愉快。Meteor 一直被认为是一个非常棒的入门框架，也非常适合进行原型设计。


    阻止 Meteor 成为主流成功的原因是随着时间推移不断出现的隐藏复杂性，特别是在涉及生产环境中。尽管 Meteor 已经筹集了大量资金，但它不像 React
    和 AngularJS 那样由拥有庞大工程师团队的领先科技企业支持。尽管 AngularJS 有很多问题，但仍有 Google 后盾；相比之下，Meteor
    被认为是一项投资风险，因为它是一个同时用于后端和前端开发的框架。为了最大限度地利用部署的便利性，Meteor 还需要进行托管。


    目前让 Meteor 不够理想的另一点是，许多开发者并不是 MongoDB 的忠实粉丝，而 Mongo 正是 Meteor 的默认数据库。Meteor 在
    2017 年仍然会是一个不错的选择，因为更多开发者可能会等待更可靠的证据，证明 Meteor 可用于大型且更复杂的应用开发。不言而喻，Meteor 在未来的
    2016 年甚至 2017 年可能仍然保持小众地位。大多数专业开发者将等待任何证明它能用于大型、复杂应用的证据。


    ## ES6 终于到来


    JavaScript 开发者在 2016 年迈向 2017 年的任务之一是确保他们所有的应用符合 ES2015 标准。但正如许多技术应用和编程语言中的复杂问题一样，我们面临
    Babel 与 TypeScript 问题。


    Babel 主要将 ES6 代码转换为 ES5，而 TypeScript 真的是 JavaScript 的超集，为 JavaScript 添加了必要的但可选的静态类型，并将所有内容都编译为纯
    JavaScript。Babel 和 TypeScript 的目的完全不同，因此没有可比性。


    由 Facebook 开发的 Babel 支持 Flow，后者也为 JavaScript 增加了静态类型检查。使用 Babel 更有意义，因为你可以连续使用这两种。Babel
    也是第一个帮助桥接 ES5 和 ES6 应用差异的工具。


    另一方面，TypeScript 只支持 ES6，因此在进展性方面仅次于 Babel。查看 GitHub 星数，Babel 是最受青的转换器。React 开发者也倾向于使用
    Babel + Webpack 组合。


    ![](img/f55b088b60008aab90a6ca2520da3303_141_0.png)


    尽管有星数支持，TypeScript 似乎是一个更有可行性的、有时甚至是更优的选择，特别是当你正在寻找一种让你的 JavaScript 代码库更易于管理的解决方案时。JavaScript
    一直被认为是一种难以阅读的语言，由于其弱类型检查系统，使其调试变得更加困难。因此在支持方面，TypeScript 拥有比 Flow 更多的追者。


    ![](img/f55b088b60008aab90a6ca2520da3303_142_0.png)


    下面的图表显示了 Google 趋势图中对 TypeScript 兴趣的增长。


    ![](img/f55b088b60008aab90a6ca2520da3303_142_1.png)


    TypeScript 可能流行的另一个原因是 Angular 2，但仅仅因为 JavaScript 获得了更多关注，这并不是 TypeScript 流行的真正原因。


    虽然 Redux 让测试变得容易得多，但 TypeScript 让代码库变得容易维护得多。此外，Google、Facebook 和微软正在合作为 JavaScript
    添加静态类型，从而为 ECMAScript 铺平道路。


    与此同时，Google 放弃了 AtScript 和 AngularJS，转而采用微软的 TypeScript。另一方面，Facebook 的 Flow 没有
    TypeScript 那样的社区流行度。


    这表明静态类型化 JavaScript 是一个活跃且不断增长的趋势，即使是 JavaScript 的不信者也会认可，而 TypeScript 是最稳妥的解决方案。


    ## 函数式编程正成为主流


    许多函数式编程平台已经进入主流编程领域，但最近，“函数式编程模型”获得了大量关注，特别是随着复杂 Web 应用的兴起。


    ![](img/f55b088b60008aab90a6ca2520da3303_144_0.png)


    Scala 回归成为拥抱函数式编程开发者的青睐语言。然而，所有程序的增长和流行与 React+Redux 相比显得相形见肘。


    问题在于，考虑到函数式编程如何完美解决现代 Web 开发的问题，人们必须承认函数式编程范式及其等概念将是 JavaScript 开发者需要掌握和学习的技能。


    ## RxJS


    但对于那些希望坚持函数式编程并继续使用 JavaScript 的人，RxJS 是必要的。Netflix 使用 RxJS，而 Angular 也依赖 RxJS。由微软开发的
    RxJS 与 TypeScript 配合得非常好，因此开发者可以预期它会被改进。然而，学习 RxJS 是一个完全不同的领域。它的陡峭学习曲线让许多开发者放弃。


    ![](img/f55b088b60008aab90a6ca2520da3303_145_0.png)


    开发者选择替代 RxJS 的兼容编程语言是 ClojScript 和 Elm。


    ## 比较搜索术


    | rxjs | clojscript | elm | bacon.js | redux |

    | --- | --- | --- | --- | --- |

    | 搜索术 | 搜索术 | 搜索术 | 搜索术 | 搜索术 |


    随时间变化的趋势


    ![](img/f55b088b60008aab90a6ca2520da3303_146_0.png)


    ## 桌面框架对决：Nw.js vs. Electron


    现在许多数据需要同步来自不同平台（如桌面和移动端）的数据。然而，许多服务首先作为 Web 应用启动，然后转换为桌面应用以增强用户体验。这样做是因为 Web
    应用的开发速度快得多，而且更容易更新。此外，用户无需安装其他任何内容即可可以立即尝试 Web 应用。


    在过去，开发者如果想使用 Web 技术为桌面应用创建前端 UI，他们受限于 CEF。这并不是一个容易的过程，而且应用本身并不具备真正的跨平台兼容性。尽管如此，Node.js
    的出现让桌面框架开发跨平台应用变得更容易。使用 Web 技术开发桌面应用的趋势开始兴起。


    '
