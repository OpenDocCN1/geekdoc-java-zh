- md: "\n## Chapter 3: Tips and Tricks to Design and Build Your Own JavaScript Library\n\
    \nJavaScript Library you say?\n\nNo, it doesn’t contain books. It does, however,\
    \ include packaged codes that web designers, developers, and programmers can use\
    \ in their projects that will save time and effort. In other words, you do not\
    \ need to reinvent the wheel when you want to apply the same package of codes\
    \ to deliver the same kind of effect on different websites and programs.\n\n##\
    \ So what makes a JavaScript Library?\n\nHere are a few distinct features of a\
    \ JavaScript Library:\n\n- It has one file or several files in a single folder\n\
    - Its coding must be maintained separately and remain as-is when you use it to\
    \ implement a project\n- It should allow the user to set project-specific behavior\
    \ or configuration\n\nIn this chapter, we will talk about why you should build\
    \ a JavaScript library and how they are built-in in the simplest ways possible.\n\
    \n## Why build your own JavaScript Library?\n\nFirstly, it makes things convenient\
    \ for programmers and web developers alike, especially if you code and develop\
    \ plenty of programs, websites, and web applications. Having a library with existing\
    \ codes makes your job easier and saves time you do not need to keep digging old\
    \ projects from some obscure folder in your hard drive. All you just need to pull\
    \ it out of your library. You have a convenient place to store all your codes;\
    \ you have a place to fragment all your applications and keep them all in an easier\
    \ to maintain location.\n\nEssentially, any code that makes your work easier and\
    \ which can be reused is a great component to be added to the library. One such\
    \ good example is jQuery. jQuery’s API is a more simplified DOM API. Back when\
    \ cross-browser DOM manipulation was difficult, jQuery was essential.\n\nAnd if\
    \ an open-source venture becomes increasingly popular, more developers use it,\
    \ and it will eventually encourage more developers to join in and assist with\
    \ this venture by contributing to the code and submitting issues that will make\
    \ it easy to manipulate. This contribution will benefit the library and all other\
    \ experiments that depend on it.\n\nPopular open-source projects can also lead\
    \ to fantastic opportunities for developers alike. A tech firm or any organization\
    \ may be impressed by the quality of a developer's work, and they will be offered\
    \ a job. It could also mean that a company will provide a developer to collaborate\
    \ on a project or get them to integrate their project into an application of their\
    \ own.\n\nFor most developers or coders, having their own library is a hobby;\
    \ one that enables them to write multiple codes and help others and contribute\
    \ to the process.\n\n## Your Goals and Scope of Work\n\nBefore you start writing\
    \ your codes, you need to be clear on what your goals are for this library. With\
    \ this, it will help you keep focused on what problems you encounter and how to\
    \ solve them with your library.\n\nYour primary goal is also to make your library\
    \ easy to use. Essentially, the simpler your API, the easier it will be for anyone\
    \ to use your library.\n\nSo ask yourself-what problems does your library solve\
    \ and how can you solve it? Will you utilize codes from someone's library or will\
    \ you write everything yourself?\n\nIn chapter 1, we discussed creating a roadmap.\
    \ This roadmap for your library will be one of the techniques you use in any other\
    \ code development you set out to do.\n\n## A Roadmap for your library:\n\n- List\
    \ out the features you want in your library\n- Make these features minimum and\
    \ practical\n- Create milestones for each feature\n\nWhat you are doing with the\
    \ roadmap is setting goals for each function, essentially breaking your project\
    \ into manageable sizes so it is easier to accomplish and the process of creating\
    \ it is a lot more enjoyable. It'll also keep you sane and focused.\n\n## Your\
    \ Library API Design\n\nWhen creating your library, think of yourself as the end-user.\
    \ By putting yourself as the user, you will work towards a user-centric design\
    \ and development. This will make your library more convenient to use by anyone\
    \ who has access to it.\n\n## Testing Your API\n\nThe best way to test the quality\
    \ of your API is to use it for your projects. What you can do is to substitute\
    \ the application code with your library and see if the result gives all the features\
    \ you want. Keep to the minimum bare essentials as possible and also provide room\
    \ for flexibility to change and revise anything that may seem slightly off.\n\n\
    Here is one example of what the implementation coding or User-Agent string library\
    \ outline would look like:\n\n```javascript\n// Start with empty UserAgent string\n\
    var userAgent = new UserAgent;\n\n// Create and add first product: EvilCorpBrowser/1.2\
    \ (X11; Linux; en-us)\nvar application = new UserAgent.Product('EvilCorpBrowser',\
    \ '1.2');\napplication.setComment('X11', 'Linux', 'en-us');\nuserAgent.addProduct(application);\n\
    \n// Create and add second product: Blink/20420101\nvar engine = new UserAgent.Product('Blink',\
    \ '20420101');\nuserAgent.addProduct(engine);\n\n// EvilCorpBrowser/1.2 (X11;\
    \ Linux; en-us) Blink/20420101\nuserAgent.toString();\n```\n\n```javascript\n\
    // Make some more changes to engine product\nengine.setComment('Hello World');\n\
    ```\n\n```javascript\n// EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101\
    \ (Hello World)\nuserAgent.toString();\n```\n\nDepending on how complex your library\
    \ is, you also need to give some thought to structuring. One way to do this is\
    \ to utilize design patterns to structure your library as well as overcome any\
    \ technical issues you may experience along the way.\n\n## Flexibility and Customization\n\
    \nA cool thing about most libraries is its flexibility. However, many developers\
    \ face problems when deciding what they can customize.\n\nThere are three ways\
    \ that you can give user control:\n\n- 1 Configuration\n- 2 Exposing public methods\n\
    - 3 Callbacks & events\n\nConfiguring a library is often done at initialization,\
    \ but some of these allow during run-time.\n\nCode:\n\n```javascript\n// Configure\
    \ at initialization\nvar userAgent = new UserAgent({\n  commentSeparator: ';'\n\
    });\n```\n\n```javascript\n// Run-time configuration using a public method\nuserAgent.setOption('commentSeparator',\
    \ '-');\n```\n\n```javascript\n// Run-time configuration using public property\n\
    userAgent.commentSeparator = '-';\n```\n\nCertain methods are exposed intentionally\
    \ to interact with an instance (getters such as to retrieve data from the instance\
    \ or to put data in the instance (setters)) as well as perform actions.\n\nCode:\n\
    \n```javascript\nvar userAgent = new UserAgent();\n```\n\n```javascript\n// A\
    \ getter to retrieve comments from all products\nuserAgent.getComments();\n```\n\
    \n```javascript\n// An action to shuffle the order of all products\nuserAgent.shuffleProducts();\n\
    ```\n\nCallbacks are also sometimes accepted and passed using public methods and\
    \ it often used to run user-codes after an asynchronous task.\n\n```javascript\n\
    var userAgent = new UserAgent();\n```\n\n```javascript\nuserAgent.doAsyncThing(function\
    \ asyncThingDone() {\n  // Run code after async thing is done\n});\n```\n\nEvents\
    \ have a huge potential in JavaScript libraries. Slightly similar to callbacks,\
    \ they have a slight difference where adding event handlers do not cause trigger\
    \ actions. Events are also used to indicate certain events and can provide additional\
    \ information to the user as well to return a specific value for the library to\
    \ correspond with.\n\nCode:\n\n```javascript\nvar userAgent = new UserAgent();\n\
