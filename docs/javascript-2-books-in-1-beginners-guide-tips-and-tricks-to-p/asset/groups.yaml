  mdcn: "\n\n-   除法 (/)\n-   减法 (-)\n\n每个符号都被称为运算符，因为它们将对某些数学数据进行操作。就像任何数学题一样，处理方式将会有一个特定的顺序，这被称为运算符优先级。\n\
    \n看到一组括号意味着在进行乘法、除法、加法或减法处理之前需要先执行它们。记住这种运算顺序的一种简单方法是 PEMDAS（括号、指数、乘除法、以及加减法）。\n\
    \n```\nCode:\n(10+2) / 2 + 4 * 2\n12 / 2 + 4 * 2\n6 + 4 * 2\n6 + 8\n```\n\n##\
    \ 第 5 章：\nJavaScript 逻辑\n\n在编程时，具备比较不同值的能力很重要，这样在涉及代码及其执行方式时就可以做出决策。比较将使你的结果为假（false）或真（true）。然后，还有一种特殊的数据类型称为布尔（Boolean）类型。\n\
    \n使用 JavaScript 进行数学计算将引入一组与布尔值一起工作的运算符。这些比较将在你在控制台操作时进行。你从每一行得到的任何结果都将显示为 true\
    \ 或 false。\n\n## 相等\n\n要确定两个不同的值是否相等，你将使用三个等号 (===)。\n\nCode:\n\n```\n15.234 ===\
    \ 15.234\n```\n\nTrue\n\n要检查两个变量是否不等，你需要使用两个符号并在它们前面加上感叹号 (!== )。\n\n```\n15.234\
    \ !== 18.4545\n```\n\nTrue\n\n包含数字的字符串在值上与该数字相等，但在类型上不等，因此 === 比较将返回 false。\n\n\
    \"10\" === 10\n\nFalse\n\n然而，如果你使用两个等号 ( == ) 比较这两个值，它将返回 true，因为两个等号只比较变量的值，而不比较类型！所以这将返回\
    \ true：\n\n\"10\"=== 10\n\nTrue\n\n## 大于/ 小于\n\n两个数字可以进行比较，判断一个比另一个大或小。当一个数字大于另一个时，你将使用大于符号\
    \ >。\n\n小于符号是大于符号 (<) 的相反。\n\nCode:\n\n```\n20.4 < 20.2\n```\n\nFalse\n\n## 组合比较\n\
    \n数字相等且大小可以使用大于或等于 ( >=) 或小于或等于 ( <= ) 运算符进行比较。\n\nCode:\n\n```\n10 >= 10\n```\n\
    \nTrue\n\n```\n10 <= 5\n```\n\nFalse\n\n## 第 6 章：\nJavaScript 条件\n\n使用 JavaScript\
    \ 逻辑将根据所做的某种比较来为代码做出决策。在进行比较之前，必须设置一个条件。JavaScript 中使用了多种条件，但最常用的是 If 语句。\n\n\
    ## If 语句\n\n当发现条件为真时，代码集将按照预期方式运行。得益于 if 语句，你可以在条件结果为真运行时必须运行的额外代码。当条件返回为假时，将会有额外的条件和代码块可以可选运行。这种选项就是\
    \ if-else 语句。\n\nCode:\n\n```\nif(10 > 5) {\n  // 在此处运行代码\n}\n```\n\n放置在花括号之间的任何代码都将被视为一个块，并与\
    \ If 语句连接。然而，只有当括号内的条件结果为真时，它才会运行。\n\n注意：双斜杠表示代码中放置的注释，它不会作为代码执行。放置注释是为了让其他人更容易理解代码。\n\
    \n## If-else\n\nif-else 语句是 If 语句的不同形式，当条件返回为假时，它将使用一段代码并运行它而不是原始代码。If 代码块中的代码将被忽略，以便运行\
    \ else 块。\n\nCode:\n\n```\nif ( 43 < 2) {\n    // 在此处运行代码\n} else {\n    // 运行不同的代码\n\
    }\n```\n\n## 第 7 章：\n使用 JavaScript 循环\n\n就像圆圈一样，循环将重复执行相同的代码多次。当需要为数组中的对象执行代码时，通常使用循环。\n\
    \n你最常用的两种循环是 while 循环和 for 循环。条件将被组合在一起，然后运行代码块直到条件强制不再为真。\n\n## While 循环\n\n\
    While 循环将在条件为真时重复代码。While 循环与 if 语句非常相似，括号内的条件为真时就会执行。\n\nCode:\n\n```\nvar i\
    \ = 1;\nwhile (i < 10) {\n  alert(i);\n  i = i + 1;\n}\n```\n\n## For 循环\n\nFor\
    \ 循环与 if 语句相似，主要区别在于括号内有三个分号来分隔信息。初始化时，你创建变量以便代码块拥有代码。\n\nCode:\n\n```\nfor(var\
