    this venture by contributing to the code and submitting issues that will make
    it easy to manipulate. This contribution will benefit the library and all other
    experiments that depend on it.


    Popular open-source projects can also lead to fantastic opportunities for developers
    alike. A tech firm or any organization may be impressed by the quality of a developer''s
    work, and they will be offered a job. It could also mean that a company will provide
    a developer to collaborate on a project or get them to integrate their project
    into an application of their own.


    For most developers or coders, having their own library is a hobby; one that enables
    them to write multiple codes and help others and contribute to the process.


    # Your Goals and Scope of Work


    Before you start writing your codes, you need to be clear on what your goals are
    for this library. With this, it will help you keep focused on what problems you
    encounter and how to solve them with your library.


    Your primary goal is also to make your library easy to use. Essentially, the simpler
    your API, the easier it will be for anyone to use your library.


    So ask yourself-what problems does your library solve and how can you solve it?
    Will you utilize codes from someone''s library or will you write everything yourself?


    In chapter 1, we discussed creating a roadmap. This roadmap for your library will
    be one of the techniques you use in any other code development you set out to
    do.


    # A Roadmap for your library:


    +   - List out the features you want in your library


    +   - Make these features minimum and practical


    +   - Create milestones for each feature


    What you are doing with the roadmap is setting goals for each function,'
