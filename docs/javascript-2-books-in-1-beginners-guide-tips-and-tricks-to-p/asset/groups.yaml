    \ `querySelector`，以便只获取返回的第一个，而不是所有元素。\n\n# 第 12 章：JavaScript 回调函数与事件\n\n位于浏览器内部的代码是事件驱动的，当你编写具有交互性的应用程序时，你必须等待并响应最终改变浏览器行为的事件。当页面加载或用户与页面上的某些内容进行交互时，就会发生事件。还有其他触发时机，但这些必须手动完成。\n\
    \n当你需要对事件做出响应时，你必须监听它以便提供一个函数。该函数会在每次事件发生时由浏览器调用，它被称为回调函数。\n\n代码：\n\n```javascript\n\
    var handleClick = function(event) {\n  // 选择不同的动作！\n};\n```\n\n```javascript\n\
    var button = document.querySelector('#big-button');\nbutton.addEventListener('click',handleClick);\n\
    ```\n\n`addEventListener` 是一个在所有 DOM 元素上都可以找到的方法。当它被调用时，该元素会被保存在变量 `button` 中。字符串中列出的第一个参数是你应该监听的事件名称。这段代码中的事件是鼠标点击或手指轻触。回调函数将是\
    \ `handleClick`。\n\n如果你使用的是 Internet Explorer，且运行的版本早于版本 9，则将不支持 `addEventListener`。在那种情况下，你应该使用\
    \ `attachEvent`。\n\n代码：\n\n```javascript\nbutton.attachEvent('onclick', handleClick);\n\
    ```\n\n如果你观察，会发现需要使用 `onclick` 而不是 `click`。这种情况在你遇到的绝多数事件中都会发生。正是此类对象创建了诸如 jQuery\
    \ 这样的库来帮助你，使得即使两个浏览器之间的监听方式不同，得益于作为回调传递的事件，这也不再重要了。\n\n这是作为回调传递的任何特定事件的数据。当你查看上面声明的\
    \ `handleClick` 时，你会发现参数 `event` 是描述对象属性的地方。\n\n代码：\n\n```javascript\n{\noffsetX:\
    \ 74,\noffY: 10,\npageX: 154,\nY: 698,\ntarget: h2,\ntimestamp: 215897564812,\n\
    type: \"click\",\nx: 154,\ny: 395\n}\n```\n\n# 第 13 章：JavaScript JavaScript AJAX\n\
    \n在进入本节之前，非常重要的一点是许多浏览器会自动阻止直接从用户机器调用的 AJAX。为了让 AJAX 正常工作，你需要一个 Web 托管或安装了本地主机（localhost）。\n\
    \n当 Web 最初出现时，情况比现在简单得多。页面现在有文本，并可能带有带你到不同网页的链接。要在页面上放置新内容，你必须从一个页面移动到另一个页面。网页开发者变得更有野心，试图让网页具有交互性。但显然，新内容需要一种新方式加载到页面，而不是每次都重新加载页面。\n\
    \n在获取新内容时，使用了一种名为 XHR 或 XML HTTP Request（XML HTTP 请求）的软件来帮助。互联网应用程序使用 AJAX 应用。AJAX\
    \ 的字母代表异步 JavaScript 和 XML。\n\n绝大多数网页都可以通过这种技术拉取新内容，而无需重新加载页面。微软实际上在创建 Outlook\
    \ 时决定应该使用 XML HTTP Request。\n\n# XML HTTP 请求\n\n你知道什么是 XML HTTP Request，但它是如何展示的呢？\n\
    \n```javascript\nvar req = new XMLHttpRequest();\nreq.onload = function ( event)\
    \ { ... };\nreq.open('get', 'some-file.txt', true);\n```\n\n```javascript\nreq.send();\n\
    ```\n\n在创建 `XMLHttpRequest` 时，你需要一个新的 `new` 关键字来调用 `XMLHttpRequest`，就像调用函数一样。回调将在信息可用的时间点发生，然后它将从该事件的输入跳到第一个参数中。\n\
    \n数据将通过使用 `req.open` 提取。第二个参数是 HTTP 技术。下一个是 URL 获取，它将与链接的 `href` 属性部分相同。\n\n下一个是一个布尔值，用于指定异步请求是否可以为\
    \ `true`。因此，`XMLHttpRequest` 将触发，然后执行的代码将继续执行，直到系统给出答案导致回调执行。\n\n异步的参数默认设置为 `false`，这会导致代码执行暂停，直到请求到适当的数据，这被称为同步。\n\
    \n同步 `XMLHttpRequest` 很少被使用，它向系统提供了一个有时可能需要很长时间的操作。同步 `XMLHttpRequest` 非常罕见。\n\
    \n使用 `XMLHttpRequest` 时，你将能够加载 JSON。在 HTTP 传输时，它们将支持 JSON。\n\n# AJAX 与库\n\n使用\
    \ AJAX 的技术被创建，以便从服务器获取 JSON。这意味着有整个库和框架被构建来帮助这一实现。\n\n# 第 14 章：JSON\n\nJSON 代表\
    \ JavaScript Object Notation（JavaScript 对象表示法）。这是一组用于在机器存储数据的文本规则。它看起来与 JavaScript\
    \ 对象字面量语法相似，但它是 JSON。\n\nJSON 可能不是 JavaScript 的官方代码，但对于理解它是如何工作仍然很重要。\n\n```json\n\
    { \"name\" : \"Luke\", age: 894, \"lightsaber\" : {\"color\": \"green\"}\n```\n\
    \n就像普通的 JavaScript 代码一样，括号用于标记特定的代码部分。\n\nJSON 在浏览器到服务器之间传输信息，或者它被保存在文本文件中以便后检索。由于这一点，你不允许存储函数等复杂数据。然而，数组和任何包含简单数据的对象将被使用。\n\
    \n当 Web 数据传输格式变为 JSON 时，JSON 将接管 XML，并且新的 API 将专门提供 JSON。这意味着你可以使用 AJAX 技术来获取\
    \ JSON。\n\n# 使用 JSON\n\n数据可以通过使用 `stringify` 方法和 `parse` 方法在 JSON 之间转换。JSON 对象在绝大多数现代浏览器中都是可用的，但如果浏览器中还没有，你可以将其添加到其中。\n\
    \n代码：\n\n```javascript\nvar json = JSON.stringify({\n  Make: \"McLaren\",\n  Model:\
    \ \"MP4-12C\",\n  Miles: 5023\n});\n```\n\n`JSON.stringify` 将对象转换为 JSON 字符串。如代码所示，`jsonString`\
    \ 将是 `{\"make\": \"McLaren\", \"model\": \"MP4-12C\", \"miles\": 5023}`。\n\n代码：\n\
    \n```javascript\nvar car = JSON.parse(jsonString);\n```\n\n字符串将被允许通过 `JSON.parse`\
    \ 转换为 JavaScript 对象，`.car` 现在它现在是一个可以使用的 JavaScript 对象。\n\n代码：\n\n```javascript\n\
    car.model = 'P1';\n```\n"
