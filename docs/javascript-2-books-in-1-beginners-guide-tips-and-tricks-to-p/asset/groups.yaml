    is the one to use.


    There are three ways that you can give your user control over your library:


    +   - 1 Configuration

    - 2 Exposing public methods

    - 3 Callbacks & events


    Configuring a library is often done at the project initialization stage, but some
    of these libraries also allow you to set during run-time. These configurations
    are commonly limited to simple issues as changing these settings will only update
