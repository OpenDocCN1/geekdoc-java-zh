  mdcn: "\n\n## 第 15 章：JavaScript 作用域\n\n作用域（Scope）是一个决定变量可见性的术。变量的作用域是指代码中访问以及修改变量的部分。JavaScript\
    \ 使用函数作用域。\n\n作用域由变量声明的代码块决定。该块可以是两个大括号内的任何内容或缩进的内容。\n\n代码：\n\n```javascript\n\
    var a = 10 ;\n\nif(a>5) {\n  var b = 5;\n}\n\nvar c = a + b; // 这是一个糟糕的编程习惯！\n\
    ```\n\n全局变量可以在应用程序的任何地方读取和修改，但它们不是最佳使用方式，因为它们会暴露代码中的安全问题，最终导致代码更难以维护。\n\n请记住，你的代码被阅读的次数多于编写的次数。每当人类阅读代码但无法确定变量源自何处或可能取什么值时，你就会遇到问题。\n\
    \n尽可能地限制变量的作用域，你将获得最佳的结果，这使得它在代码中尽可能少的部分可见。\n\n## 函数作用域\n\n由于 JavaScript 的处理方式不同，它将使用函数作用域。函数作用域意味着变量在声明它们的函数外部是不可见的。如果它们没有在函数中声明，那么它们将全局可见。\n\
    \n代码：\n\n```javascript\nvar doSomething = function() {\n  var a = 10;\n}\n\ndoSomething();\n\
    \nconsole.log(a); // 这显示 a 已定义。\n```\n\n## 子作用域\n\n变量也会出现在子作用域中，子作用域有自己的作用域。对于代码来说，如果\
    \ `doSomethingElse` 是 `doSomething` 函数的子，那么当变量 \"a\" 放在 `doSomethingElse` 内部时它是可见的。\n\
    \n代码：\n\n```javascript\nvar doSomething = function() {\n  var a = 10;\n\n  var\
    \ doSomethingElse = function() {\n    console.log(a); //a 将是 10\n  }\n\n  doSomethingElse();\n\
    };\ndoSomething();\n```\n\n函数作用域是创建优雅代码是非常强大的工具，但需要一段时间时间才能精通。\n\n## 第 16 章：JavaScript\
    \ 中的 jQuery\n\n在修改和控制 DOM 时有一组工具可以使用。但这有点混乱，因为不同类型的浏览器有不同的 DOM。为了让编码体验更简单，已经设置了大量的资源来隐藏复杂性，并在与\
    \ DOM 交互时采用更统一的方式。大多数情况下，它还会提供 AJAX 功能，从而减轻代码复杂性带来的压力。\n\njQuery 是一个广名的 DOM 库，被用于各种页面。但你与\
    \ DOM 通信的过程将被称为应用程序编程接口或 API。\n\njQuery 的语法非常独特，因为它基于美元符号 `$`。\n\n代码：\n\n```javascript\n\
    $('.btn').click(\nfunction() {\n    // 选择一个不同的动作\n});\n```\n\n此代码将挂载（attach）到\
    \ `btn` 类中列出的所有元素的点击事件处理程序上。选择器语法将是 jQuery 的核心。\n\njQuery 可以像脚本元素一样通过文件放在网站上。你可以从\
    \ jquery.com 获取文件，也可以从 CDN 添加。\n\n代码：\n\n```html\n<script src='http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
    ></script>\n```\n\n你不应该总是使用库，但你应该选择它是否具有基于开发者选择的产物所建立的结构。例如，如果 jQuery 有详尽的文档需要引入，那么页面的下载速度将会变慢，特别是在连接可能较弱的移动浏览器上。\n\
    \n## 第 17 章：jQuery DOM 和 API\n\n当元素被选中并与 DOM 交互时，最可能会使用 jQuery。坦率地说，它你很容易使用，因为在选择单个元素甚至一组元素时，语法非常简单。这与\
    \ CSS 几乎完全一样。\n\njQuery 允许同时对元素上执行的操作完成，这在你的编码过程中节省了某些时间。\n\n`$('.note')` 将选择所有具有\
    \ \"note\" 类的元素。\n\n代码：\n\n```javascript\n$('.note').css('background', 'red').height(100);\n\
    ```\n\njQuery 具有可链式（chainable）的语法，这在你设置任何方法时都有效。jQuery 将返回与选择器函数相同的元素。美元符号 `$`\
    \ 是一个函数，帮助返回一个封装了周围元素的 jQuery 对象。`.css` 方法将背景颜色改为红色，`.height` 设置你所选元素的高度。还有一个可以用于宽度。\n\
    \n### Getter 和 Setter（Getters and Setters）\n\n如所示，`.css` 和 `.height` 方法被用 getter\
    \ 和 setter。`.css` 方法将背景颜色改为红色，`.height` 设置你所选元素的高度。还有一个可以用于宽度。\n\n`$('.note')`\
    \ 将选择所有具有 \"note\" 类的元素。\n\n代码：\n\n```javascript\n$('.note').css('background',\
    \ 'red').height(100);\n```\n\n## 第 18 章：jQuery 和 AJAX\n\njQuery 有一些 AJAX 方法，可以让你节省时间并让代码看起来更轻松。它们是\
    \ `$.get`、`$.post` 和 `$.ajax`。\n\n`$.ajax` 方法是你构建 AJAX 请求的主要技术。其他方法是获取数据或发送数据的快捷方式。\n\
    \n```javascript\n$.ajax({\n  url: '/data.json',\n  method: 'GET',\n  success:\
    \ function (data) {\n    console.log(data);\n  }\n});\n```\n\n当 jQuery 需要检索数据时，将使用对象的配置。基础是提供\
    \ URL。此方法默认为 get 方法，并在数据被检索时调用函数，它命名为 success 回调。\n\n### $.get\n\n此方法的代码将获取一系列信息，由于这是函数的基础；jQuery\
    \ 将提供一个助手。\n\n代码：\n\n```javascript\n$.get('/data.json', function ( data ) {\n\
    \  Console.log(data);\n});\n```\n\n还会提供一个错误回调来让你知道是否不对，从而导致找不到服务器。\n\n代码：\n\n\
    ```javascript\n$.get('/data.json', function ( data ) {\n  Console.log(data);\n\
    }).fail (function () {\n  // 噢，那不对\n});\n```\n\n### $.post\n\n当你向系统引导输入时，你将使用\
    \ `$.post` 方法。第二个参数将导致数据发送到函数之外的任何地方。jQuery 将找到发送数据的方法。\n\n代码：\n\n```javascript\n\
    $.post('/save', {username: 'burt' }, function (data) {\n  Console.log(data);\n\
    }).fail (function () {\n  // 错误动作\n});\n```\n\n### $.ajax\n\n为了对信息如何引导拥有权限范围，你将使用\
    \ `$.ajax` 方法\n\n"
