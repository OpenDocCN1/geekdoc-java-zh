    plugin if you choose to use ES2015 import/export syntax function. This way, you
    can use ES2015 in your projects as well as produce a library that can be used
    by all kinds of developers using various modules.


    # Documentation


    You need to start your documentation with basic information such as your project
    name as well as a short description of what it is about. This will help others
    understand what your library is meant to do and whether using your library is
    a good choice for them. You can also include a little bit more information on
    things such as scope and goals so users are better informed. Your roadmap can
    also be included so users know what they can expect in the future in your library
    development and how they can also contribute to it.


    # API, Tutorials and Examples


    API documentation is also an essential part of documentation as it will tell users
    how exactly to use your library. Other good additions would be examples as well
    as tutorials. This can take up some time so you can do this as you library development
    is on-going.


    # Meta-tasks


    Users will also want to make changes to your library and this is usually in the
    form of a contribution but may want to create a custom build only for private
    use. For these users, you can include documentation for meta-tasks that include
    a list of commands to build the library, run testing, generate and convert download
    data.


    # Contribution


    Contributions are great especially when you open-source your library. Another
    documentation you can add in is to guide contributors to explain the steps in
    making a contribution to the library and what kind of criteria they should fill'
