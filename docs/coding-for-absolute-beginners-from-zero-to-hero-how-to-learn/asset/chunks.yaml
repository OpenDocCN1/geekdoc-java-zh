  trans: "\n\n每个 `html` `document` 都应该在 `<body>` 标签之后以 `title`、`heading` 和 `paragraph`\
    \ 开始，下一个要使用的主要 `tag` 是 `<h1>` 或 `heading` 标签。根据你的内容需求，`heading` 标签通过 `<h1>` 到\
    \ `<h6>` 来定义。例如：\n\n### 标题 (Headings):\n\n```html\n<html>\n<body>\n<h1>第一级标题</h1>\n\
    <h2>二级标题</h2>\n<h3>第三级标题</h3>\n<h4>第四级标题</h4>\n<h5>第五级标题</h5>\n<h6>第六级标题</h6>\n\
    </body>\n</html>\n```\n\n输出：\n![image_rsrc9FJ.jpg](img/image_rsrc9FJ.jpeg) De\n\
    \n### 段落 (Paragraph)\n\n为了添加内容，我们需要在 `html` `document` 中包含段落。例如：\n\n```html\n\
    <html>\n<head>\n<h1>标题</h1>\n</head>\n<body>\n<p>第一个段落</p>\n<p>第二个段落</p>\n</body>\n\
    </html>\n```\n\n输出：\n标题\n第一个段落\n第二个段落\n\n为了在每个段落之间添加换行符，可以使用换行标签 `<br>`。\n\n###\
    \ 摘要标签 (Summary tag)\n\n为了给段落添加摘要，带有 `summary` 标签的 html 语法定义如下：\n\n```html\n<details>\n\
    <summary>示例文本</summary>\n<p>开发教程</p>\n</details>\n```\n\n### 范围 (Span)\n\n`<span>`\
    \ 标签用于为文本的特定部分着色。例如：\n\n```html\n<p>开发 <span style=\"color:red\">有趣的</span>学习</p>\n\
    ```\n\n### 选择 (Select)\n\n`<select>` 标签用于从下拉列表中选择一个选项。例如：\n\n```html\n<select>\n\
    <option value=\"red\">红色</option>\n<option value=\"blue\">蓝色</option>\n<option\
    \ value=\"green\">绿色</option>\n<option value=\"white\">白色</option>\n</select>\n\
    ```\n\n### 表头 (The)\n\n`<thead>` 标签用于创建组头部内容，并与 `<tbody>` 和 `<footer>` 元素一起使用。例如：\n\
    \n```html\n<table>\n  <thead>\n    <tr>\n      <th>课程</th>\n      <th>最高分</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>工程</td>\n      <td>85</td>\n\
    \    </tr>\n    <tr>\n      <td>英语</td>\n      <td>90</td>\n    </tr>\n  </tbody>\n\
    \  <footer>\n    <tr>\n      <td>um</td>\n      <td>80</td>\n    </tr>\n  </footer>\n\
    </table>\n```\n![image_src9FK.jpg](img/image_src9FK.jpeg)\n\n### 格式标签 (Formatting\
    \ tags)\n\nhtml 文档中的文本可以格式化为不同的样式、字体和大小。用于格式化标题、段落和表格的标签如下：\n\n#### 粗体 (Bold)\n\
    \n写在 `<b>` 标签之间的任何文本将以粗体样式显示。例如：\n\n```html\n<p><b>开发</b></p>\n```\n输出：开发\n\n\
    #### 斜体 (Italic)\n\n写在 `<i>` 标签之间的任何文本将以斜体显示。例如：\n\n```html\n<p><i>开发</i></p>\n\
    ```\n输出：开发\n\n#### 上标/下标 (Superscript/subscript)\n\n为了以上标形式显示内容，我们使用 `<sup>` 标签，使用\
    \ `<sub>` 用于下标。例如：\n\n```html\n<p>这段文本使用了<sup>上标</sup></p>\n```\n输出：这段文本使用了 (上标)\n\
    \n#### 下划线 (Underline):\n\n写在 `<u>` 和 `</u>` 标签之间的文本将带有下划线\n\n```html\n<p><u>示例文本</u></p>\n\
    ```\n输出：示例文本\n\n#### 插入和删除标签 (Insert and deleted tags)\n\n为了插入，使用了 `<ins>` 和 `</ins>`\
    \ 标签；为了删除任何文本，我们使用了 `<del>` 和 `</del>` 标签。\n\n`<ins>插入</ins><del>删除</del>`\n\n\
    ### 链接 (Link)\n\n为了在文本中添加链接，我们使用的标签：\n\n```html\n<p><a href=\"document location\"\
    >文档</a></p>\n```\n\n### 跑灯标签 (Marquee tag)\n\n`<marquee>` 可以配合不同的属性使用，包括 `width`、`height`、`direction`、`behavior`、`scrollamount`、`scrolldelay`、`loop`、`bgcolor`、`hspace`\
    \ 和 `vspace`。marquee 标签的演示：\n\n```html\n<html>\n<head>\n<title>html marquee 标签</title>\n\
    </head>\n<body>\n<marquee>示例文本</marquee>\n</body>\n</html>\n```\n\n### 容器标签 (Container\
    \ tags)\n\n在 html 中，使用以下容器标签来格式化文本：\n\n| 开始标签 | 结束标签 | 功能 |\n| :--- | :--- | :---\
    \ |\n| `<p>` | `</p>` | 段落 |\n| `<span>` | `</span>` | 在段落内添加内联内容 |\n| `<em>`\
    \ | `</em>` | 用于强调文本强调 |\n| `<ol>` | `</ol>` | 有序列表（数字） |\n| `<ul>` | `</ul>`\
    \ | 无序列表（符号） |\n| `<li>` | `</li>` | 列表项 |\n\n### 表格 (Tables)\n\n表格、图像和框架用于以 html\
    \ 方式格式化信息。为了创建表格，我们使用了以下标签：\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>头部</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>单元格</td>\n    </tr>\n \
    \ </tbody>\n</table>\n```\n\n### 图像 (Images)\n\n图像是任何网站的重要部分。图像用于在 html 中插入图像。插入图像：\n\
    \n```html\n<img src=\"image_url\" />\n<img src=\"desktop/image1.png\" alt=\"示例文本\"\
    \ />\n```\n\n为了设置图像特定的高度和宽度，我们使用了：\n\n```html\n<img src=\"desktop/image1.png\"\
    \ alt=\"示例文本\" width=\"100\" height=\"100\" />\n```\n\n### 视频 (Videos)\n\n为了在\
    \ html 页面添加视频，我们使用了以下标签：\n\n```html\n<video>\n  <source src=\"samplevideo.mp4\"\
    \ type=\"video/mp4\">\n</video>\n```\n\n### 对齐和边框 (Alignment and border)\n\n网页上有三种对齐图像的位置：居中、右和左。为此，我们使用了\
    \ `align` 属性。例如：\n\n```html\n<img src=\"desktop/image1.png\" alt=\"示例文本\" align=\"\
    center\"/>\n```\n\n"
- fmt: "\nFor creating image border, the attribute is `border`. For example:\n\n<img\
    \ src=\"desktop/images/image1.png\" alt=\"sampled image\" border=\"4\"/>\n\n#\
    \ Frames\n\nHTML hypertext language frames were added to create multiple sections\
    \ in the browser window so that each section can be loaded with a unique HTML\
    \ document. To use frames in a page the `<frameset>` tag should be used instead\
    \ of the `<body>` tag which can then be defined with specific rows and columns\
    \ attributes.\n\nSample HTML tags for creating frames:\n\n```html\n<html>\n<head>\n\
    \  <title>html frames</title>\n</head>\n<frameset rows=\"10%,80%,10%\">\n  <framed\
    \ name=\"top\" src=\"/html/top_frame.htm\"/>\n  <framed name=\"main\" src=\"/html/main_frame.htm\"\
    />\n  <framed name=\"bottom\" src=\"/html/bottom_frame.htm\"/>\n  <noframes>\n\
    \    <body>your browser does not support frames.</body>\n  </noframes>\n</frameset>\n\
    </html>\n```\n\n# Iframe\n\nTo create a nested browsing context, the `<iframe>`\
    \ tag and be used to add a new HTML document into an existing one. To create an\
    \ iframe, the following syntax can be implemented along with the `<iframe>` tag:\n\
    \n```html\n<iframe src=\"https://www.samplewebsite.com\"></iframe>\n```\n\nCompleted\
    \ table of basic HTML tags:\n\n| <a> | <abbr> | <acronym> | <address> | <applet>\
    \ |\n| <area> | <article> | <aside> | <audio> | <b> |\n| <base> | <basefont> |\
    \ <bdi> | <bdo> | <big> |\n| <blockquote> | <body> | <br> | <button> | <canvas>\
    \ |\n| <caption> | <center> | <cite> | <code> | <col> |\n| <colgroup> | <data>\
    \ | <datalist> | <dd> | |\n| <del> | | | | | |\n| <details> | <dfn> | <dialog>\
    \ | <dir> | <div> |\n| <dl> | <dt> | <em> | <embed> | <fieldset> |\n| <figcaption>\
    \ | <figure> | <font> | <footer> | <form> |\n| <frame> | <frameset> | <h1>-<h6>\
    \ | <head> | <header> |\n| <hr> | <html> | <i> | <iframe> | <img> |\n| <input>\
    \ | <ins> | <kbd> | <label> | <legend> |\n| <li> | <link> | <main> | <map> | <mark>\
    \ |\n| <meta> | <meter> | <nav> | <noframes> | <noscript> |\n| <object> | <ol>\
    \ | <optgroup> | <option> | <output> |\n| <p> | <param> | <picture> | <pre> |\
    \ <progress> |\n| <q> | <rp> | <rt> | <ruby> | <s> |\n| <samp> | <script> | <section>\
    \ | <select> | <small> |\n| <source> | <span> | | <strong> | <style> |\n| <sub>\
    \ | <summary> | <sup> | <svg> | <table> |\n| <tbody> | <td> | <template> | <textarea>\
    \ | <tfoot> |\n| <th> | <thead> | <time> | <title> | <tr> |\n| <track> | <tt>\
    \ | <u> | <ul> | <var> |\n| <video> | <wbr> | | |\n\n# Forms\n\nHTML forms have\
    \ one aspect of interaction when edited by the user. The form is created using\
    \ such fields, buttons, select boxes, and clickable controls. The data collected\
    \ through forms is sent to the server and handled. Syntax for creating a form\
    \ the `action` and `method` describe where the data will be sent:\n\n```html\n\
    <form action=\"url\" method=\"get|post\">\n  input, buttons, etc.\n</form>\n```\n\
    \nInput form taken from user:\n\n```html\n<html>\n<head>\n  <title>my first form</title>\n\
    </head>\n<body>\n  <form>\n    <label for=\"course\">course:</label>\n    <input\
    \ type=\"text\" name=\"course\">\n    <br>\n    course: <input type=\"text\" name=\"\
    last\">\n  </form>\n</body>\n</html>\n```\n\nOutput: ![image_rsrc9FM.jpg](images/image_rsrc9FM.jpeg)\n\
    \n# Text fields\n\nText fields in HTML allow users to input text into the form.\
    \ The general syntax for creating text fields defined as follows:\n\n```html\n\
    <input type=\"text\">\n<input type=\"text\">\n```\n\n# Button controls\n\nThere\
    \ are different ways to submit data in forms. You can add clickable buttons by\
    \ using the following HTML tags:\n\n```html\n<input type=\"submit\" name=\"submit\"\
    >\n<input type=\"reset\" name=\"reset\">\n<input type=\"button\" name=\"button\"\
    >\n```\n\nOutput: ![image_rsrc9FN.jpg](images/image_rsrc9FN.jpeg)\n\n# Select\
    \ box\n\nTo create a dropdown list in HTML forms, use the `<select>` and `<option>`\
    \ element. For example:\n\n```html\n<html>\n<head>\n  <title>field upload box</title>\n\
    </head>\n<body>\n  <form>\n    <label for=\"course\">course:</label>\n    <select\
    \ name=\"course\" id=\"course\">\n      <option value=\"web engineering\">web\
    \ engineering</option>\n      <option value=\"calculus\">calculus</option>\n \
    \     <option value=\"data science\">data science</option>\n    </select>\n  </form>\n\
    </body>\n</html>\n```\n\nOutput: ![image_rsrc9FP.jpg](images/image_rsrc9FP.jpeg)\n\
    \n# Select box\n\nThe select box element allows multiple options ordered in the\
    \ form. For example:\n\n```html\n<html>\n<head>\n  <title>course</title>\n</head>\n\
    <body>\n  <form>\n    <select name=\"course\">\n      <option value=\"math\">math</option>\n\
    \      <option value=\"physics\">physics</option>\n    </select>\n  </form>\n\
    </body>\n</html>\n```\n\nOutput: ![image_rsrc9FR.jpg](images/image_rsrc9FR.jpeg)\n\
    \n# Designing\n\nThe background color of HTML is white by default. To change the\
    \ background color, use the following tags:\n\n```html\n<table bgcolor=\"green\"\
    >\n<table bgcolor=\"#f1f1f1\">\n```\n\n# Fonts\n\nFonts are essential part of\
    \ the readability of content. The font size, color, and attributes included in\
    \ the `<font>` tag can be used. To set the font size, the tags are:\n\n```html\n\
    <font size=\"14\"></font>\n```\n\nTo change the font face, the attributes are:\n\
    \n```html\n<font face=\"times new roman\" size=\"14\"></font>\n```\n\n# Font color\n\
    \nTo change the font color, use the following tags and attributes:\n\n```html\n\
    <font color=\"blue\">this text</font>\n```\n\nOutput: this text is blue\n"
