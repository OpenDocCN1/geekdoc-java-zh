  trans: "\n\nPython 编程语言包含了海量的文件、标准库和模块，其中包含数百多个模块。此外，它们还提供了跨平台的支持，用于执行多项编程任务，例如对象持久化、文本模式匹配和网络脚本。\n\
    \nPython 中 `import` 语句的语法如下：\n\n```python\nimport module_name1 [, module_name2,\
    \ ... [as module_name]]\n```\n\n与 `import` 模块一起使用的运行时操作语句有：\n\n1. `import find`\n\
    2. `import compile`\n\n若要使用名为 `newmodule` 的模块，我们可以如下调用函数：\n\n```python\nimport\
    \ newmodule\nNewmodule.functionnamed(\"name\")\n```\n\n在 Python 中从 `from` 导入模块的语法为：\n\
    \n```python\ndef newmodule import (name):\n    print(\"hello, \" + ename)\n\n\
    Person1 = {\n    \"name\": \"james\",\n    \"age\": 30,\n    \"country\": \"sweden\"\
    \n}\n```\n\n## 面向对象的 Python\n\n在面向对象编程中，我们要求定义类和对象来执行程序中的各种功能。与 C++ 和 C 等其他主流编程语言一样，我们可以使用面向对象的技术来创建、访问和更新类。\n\
    \n在 Python 中创建一个 `student` 类，代码编写如下：\n\n```python\nclass student:\n    def __init__(self,\
    \ id, ename, class):\n        self.rd = roll\n        self.nd = ename\n      \
    \  print((self.n))\n\nStud1 = student(1, \"james\")\nStud2 = student(2, \"william\"\
    )\nprint(\"data successfully stored in variables\")\n```\n\n访问对象的变量时，使用点运算符 `.`，其语法为：\n\
    \n```python\nMyobject_name.variable_name\n```\n\n## 继承\n\n继承是面向对象编程的一项有用特性，它允许开发者创建一个新类来继承现有类的所有方法和属性。我们可以使用继承技术，基于父类的属性定义一个新的子类（或称为派生类）。\n\
    \nPython 中实现继承的语法定义如下：\n\n```python\nclass baseclass1:\n    # 基类体\n\nclass derivedclass(basaclass1):\n\
    \    # 派生类体\n```\n\n以下程序展示了父类以及派生类如何继承父类的特征并调用其函数。\n\n```python\nclass vehicle:\n\
    \    # 父类\n    print(\"parent class\")\n    def __init__(self, price):\n     \
    \   self.priced = price\n\n    def display(self):\n        print('priced=', self.price)\n\
    \nclass category(vehicle):\n    # 派生类\n    print(\"child/derived class\")\n  \
    \  def __init__(self, price, ename):\n        vehicle.__init__(self, price)\n\
    \        self.named = ename\n\n    def named(self):\n        print('vehicle=',\
    \ self.named)\n\nObj = category(2000, \"mercedes\")\nObj.display()\n```\n\n输出：\n\
    parent class\nchild/derived class\npriced= 2000\n\n要在派生类中重写方法，我们可以定义一个具有相同名称和参数的新方法。语法如下：\n\
    \n```python\nclass parent:\n    print(\"parent class\")\n    def display(self):\n\
    \        print(\"this is parent class\")\n\nclass derived(parent):\n    print(\"\
    child/derived class\")\n    def display(self):\n        print(\"this is derived\
    \ class\")\n\nObj = derived()\nObj.display()\n```\n\n## 文件输入/输出\n\n文件输入/输出是磁盘上的特定位置，用于存储信息和数据。由于存储在硬盘中，我们也可以通过实现\
    \ Python 编程方法和技术来执行读写操作。Python 中的文件操作由三个主要方面：打开文档、文件、电子表格或代码。正则表达式允许程序员使用特殊语法查找相关的字符序列顺序。当在\
    \ Python 语言中编写表达式时，我们应该使用前缀 `r` 和其他特殊字符。\n\n### Match 函数\n\n`match()` 函数用于检查 Python\
    \ 中的给定表达式是否匹配字符串。如果不匹配，我们使用 `match()`。\n\n### Search 函数\n\n该函数尝试在字符串中搜索所有可能的起始点，以匹配任何位置。它包含了\
    \ `search()` 函数。\n\n### Split 函数\n\n`split()` 函数可以直接应用于字符串，因为 `str.split()` 接受一个指定分隔符的模式。\n\
    \n"
