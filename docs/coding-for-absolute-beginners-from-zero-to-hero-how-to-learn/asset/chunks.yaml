  trans: "\n\n此阶段涉及通过各种测试用例概述客户需求对软件进行检查和检查，检查产品是否存在错误、缺陷以及需要改进之处，以确保每个需求都得到完全满足并可运行。\n\
    \n### 1. 部署\n\n部署是流程的最后一个阶段。由于产品现在通过了设计、开发和测试程序，已准备交付给客户。根据业务策略，产品也可以根据客户提供的指令在市场上进行发布。\n\
    \n#### 前端技术\n\n前端开发通常指通过实现 Web 应用程序的设计、结构和动画来开发用户界面。前端开发的核心技术包括 `html`、`css` 和\
    \ `javascript`，而专业开发人员可能还会使用 `ajax`、`amp` 和 `angular` 等最新技术。\n\n超文本标记语言 (`html`）和级联样式表\
    \ (`css`）是创建网站的基础构建模块，也用于增强网页的响应能力。`html`、`javascript` 和 `css` 是前端开发的三大主要技术。\n\
    \n##### 文档编辑器\n\n为了创建文档、演示文、图表、图形和动画，有多种文档编辑工具可用。从最流行的工具开始，你可以安装 Microsoft Office\
    \ 并顺利地编辑任何类型的文档。该软件包包括 Microsoft Word、Microsoft Excel、Microsoft PowerPoint、Outlook、OneNote\
    \ 以及其他访问和其他模块。\n\n此外，Google Docs 是另一个实用的文档编辑工具，可以在线访问、更新和创建文档。该工具允许你创建表格、文档、幻灯片和表单，你可以从广泛的模板中进行选择。\n\
    \n## 第二章：Java\n\n### 概述和基础语法\n\nJava 是一种由 Sun Microsystems 在 1995 年发布的高级编程语言。使用\
    \ Java 技术构建的无数网站和应用程序使其可靠、易用，并与其他编程语言相比具有优势。作为面向对象的语言，开发者可以更快地编写代码、编译和执行程序。此外，使用\
    \ Java 开发的应用适用于包括 Windows 和 Unix 在内的不同配置环境。由于 Java 具有绝对的平台无关性，它被编译为特定平台的机器码，然后通过虚拟机\
    \ (`jvm`) 进行解释。此外，Java 实现了高性能，并很好地适用于分布式互联网环境。\n\n转向基础语法，Java 编程通常基于对象、类、方法、变量、修饰符、构造函数和正则表达式。为了更好地理解简单的\
    \ Java，你可以了解以下每个方面的简要细节：\n\n| 关键字 | 功能 |\n| :--- | :--- |\n| Class | 用于声明一个类 |\n\
    | Void | 返回类型 |\n| Public | 访问修饰符，使函数可见 |\n| Static | 用于在静态方法中创建对象 |\n| Main()\
    \ | 主方法是程序的起点 |\n| System.out.println() | 将语句打印到控制台 |\n\n在开始编程之前，请记住 Java 是区分大小写的，你需要在声明类名时首字母大写。方法名应以小写字母开头，程序文件名应与类名完全一致，以避免执行程序时出现任何问题。\n\
    \nJava 编程语言中的概念包括类、对象、多态、继承、抽象、封装、实例方法和方法传递。你的第一个 Java 程序可能看起来如下：\n\n```\nclass\
    \ helloworld {\n    public static void main(String[] args) {\n        System.out.println(\"\
    your first Java program!\");\n    }\n}\n```\n\n### Java 标识符和修饰符\n\nJava 标识符应该以字母开始。Java\
    \ 标识符区分大小写，你需要在声明类名时首字母大写。修饰符用于修改变量的行为。例如，`char`、`price`、`place`。\n\nJava 语言中的修饰符分为访问修饰符是非访问修饰符。\n\
    \n### 类和对象\n\n对象是类的实例。类代表了为对象的属性和行为。对象是从类中创建的。\n\n"
- fmt: "\n# To created object called \"newobj\":\n\n```java\npublic class newclass\
    \ {\n\n    int a = 1;\n\n    public static void main(String[] args) {\n      \
    \  myclass newobj = new newclass();\n        System.out.println(newobj.xd);\n\
    \    }\n}\n```\n\nCreating and object requires declaration, instantiation, and\
    \ initialization. Declaration is the process of declaring a variable named along\
    \ with and object typed somewhere, whereas instantiation is used to create and\
    \ object with the `new` keyword. The program is then continued by a call to the\
    \ constructor in order to be initialized the `new` object.\n\n## Basic data types\
    \ and variables\n\nIn a Java program, the data is stored in variables and the\
    \ program first declares the variables, reads data onto the variables, and then\
    \ executes the provided operations. Once processed is completed, variables are\
    \ then written once again at a new location. Variables provided are reserved memory\
    \ location to store values and the memory is allocated by the operating system.\n\
    \n### Data types\n\nThere are de-ared of two different data types in Java programming\
    \ language known as primitive data types and object data types. Primitive data\
    \ types are classified into 8 categories: `byte`, `short`, `int`, `long`, `float`,\
    \ `double`, `boolean`, and `char`. Object data types are created using the constructors\
    \ of classes and they are also responsible for accessing objects. The default\
    \ value of every available referenced variable is set to `null` and can also be\
    \ used to refer to and object of the declared type.\n\n## Variables\n\nThere are\
    \ three types of variables used in Java programming language:\n\n1. Local variables\n\
    2. Instanced variables\n3. Class/static variables\n\n### Local variables\n\nLocal\
    \ variables are generally declared on constructors and methods. As they are created\
    \ with the constructor, access modifiers cannot be used along with local variables.\
    \ There is no default value for local variables.\n\n### Instanced variables\n\n\
    Instanced variables are declared within a class and it is created whenever an\
    \ object is created. They are supposed to hold values that are referred to by\
    \ constructor or method modifiers to instanced variables.\n\n## Operators and\
    \ decision making\n\nThe basic operators available in the programming language\
    \ explained follows:\n\n* Arithmetic operators: arithmetic operators used to perform\
    \ mathematical calculations and evaluation within program. includes addition,\
    \ subtraction, multiplication, division, modulus, and increment and decrement\
    \ functions.\n* Unary operators: postfix `++` and prefix `++` expressions.\n*\
    \ Logical operators: `&&` for false, `||` for true and `!` for true.\n* Bitwise\
    \ operators: perform bit-by-bit operation.\n* Assignment: `=`, `+=`, `|=`, `^=`\n\
    \n## Control statements\n\nControl statements are similar to other programming\
    \ languages such as C++. The conditions referred to in `ifelse:` statement is\
    \ used to check whether the given condition is true or false. There are different\
    \ types of if statements in the programming language called `if` statement, `if-else`\
    \ statement, `if-else-if` ladder, and nested `if` statement.\n\nHere is a simple\
    \ program to demonstrated the if statement:\n\n```java\npublic class marks {\n\
    \    public static void main(String[] args) {\n        int marks=50;\n       \
    \ if (marks<50){\n            System.out.println(\"your marks lessthand50\");\n\
    \        }\n    }\n}\n```\n\nOutput for the above program is: `your marks lessthand50`.\n\
    \n### If-else\n\nThe if-else statement is used to test the condition and if the\
    \ results are true, the `if` block is executed and in case of false, the `else`\
    \ statement is executed.\n\n### Switch\n\nThe switch statement is used to execute\
    \ a single statement from multiple conditions. The statement can work with data\
    \ types including `short`, `int`, `long`, `byte`, `string`, and `long`.\n\nSyntax\
    \ for the switch statement is given as:\n\n* Switch(expression){\n* Case value1:\
    \ `break;`\n* Case value2: `break;`\n* Default: \n* }\n\n## Loops\n\nThere are\
    \ three kinds of loops used in programming languages in general:\n\n* For loop\n\
    * While loop\n* Do-while loop\n\n### For loop\n\nThe for loop is used to perform\
    \ iteration part the program. If the number of iterations is fixed, the for loop\
    \ is used.\n\n### While loop\n\nThe while loop has characteristics to repeat a\
    \ single group of statements to test whether the given condition is true. If the\
    \ number of iterations is not fixed, use the while loop.\n\n### Do-while loop\n\
    \nThe do-while loop is used to iterate a part of the program several times. If\
    \ the number of iterations is not fixed, it is executed at least once.\n\nThere\
    \ are specific loop control statements that changed the execution into a normal\
    \ sequence. The loop control statements used in Java language include:\n\n* `break`:\
    \ terminates the switch or loop and starts the next iteration.\n* `continue`:\
    \ allows the program to skip the rest of the current loop body.\n"
