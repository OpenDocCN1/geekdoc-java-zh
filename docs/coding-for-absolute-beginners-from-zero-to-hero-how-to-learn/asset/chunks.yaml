- fmt: "\nInternal CSS is implemented over a single document to give it a unique style.\
    \ It is remembered that it must be embedded within the head section.\n\n### Internal\
    \ CSS Syntax\n\nSyntax for implementing internal CSS:\n\n```html\n<head>\n  <title>internal\
    \ css</title>\n  <style>\n    selector {\n      property:value;\n    }\n  </style>\n\
    </head>\n```\n\n## External CSS\n\nThe external CSS has a separated file which\
    \ includes only one styled property along with the attributes. External CSS file\
    \ needs to be linked with the HTML document using the link tag.\n\n### Example\
    \ of external CSS:\n\n```css\nbody {\n  background-color:green;\n}\n\n.main {\n\
    \  Text-align:center;\n}\n\n.gfg {\n  color:#009900;\n  font-size:50px;\n  font-weight:bold;\n\
    }\n```\n\n## Basic syntax and inclusion in HTML\n\nCSS is made up of several styled\
    \ rules which are interpreted by the browser and applied over the web page. Generally,\
    \ styled rules are made up of three key elements known as selector, property,\
    \ and value.\n\nSelectors and HTML tags which are CSS styled can be applied such\
    \ as `<h1>` where property is attributed to HTML tag such as color. Values are\
    \ assigned to the properties. The basic syntax for creating CSS styled rules is\
    \ defined as follows:\n\n```css\nselector{property:value}\n```\n\nGenerally, inline\
    \ and external CSS approaches are used to associate styles with the HTML document\
    \ for which the `<style>` element is placed inside the `<head>` and `</head>`\
    \ tags. The syntax for CSS inclusion in HTML document is defined as follows:\n\
    \n```html\n<html>\n  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" media=\"\
    all\">\n    <style>\n      body {\n        background-color:grey;\n      }\n \
    \     h1 {\n        color:white;\n        margin-left:40px;\n      }\n    </style>\n\
    \  </head>\n  <body>\n    <h1>Sample heading</h1>\n    <p>Sample paragraph</p>\n\
    \  </body>\n</html>\n```\n\n![image_rsrc9FU.jpg](images/image_rsrc9FU.jpeg)\n\n\
    ## Importing CSS file\n\nTo import and external stylesheet, the following rule\
    \ can be implemented:\n\n```html\n<head>\n  @import url(\"url\");\n</head>\n```\n\
    \n### Colors and backgrounds\n\nIn CSS, colors can be defined through names or\
    \ values of different kinds. To specify the color code, the possible formats that\
    \ can be used are elaborated as follows:\n\n| Name | Syntax |\n| :--- | :--- |\n\
    | Keyword | Green, blue, etc. |\n| Hex code | #rrggbb |\n| Rgb% | Rgb(r%, g%,\
    \ b%) |\n| Rgb absolute | Rgb(r, g, b) |\n| Short hex code | #rgb |\n\nFor example\
    \ we using the following syntax:\n\n```css\nh1{color:green}\n```\n\n### Background\n\
    \nThe background properties that can be defined include background color are used\
    \ using the following CSS syntax:\n\n```css\nbody {\n  background-color;\n}\n\n\
    body {\n  background-image:url(\"image.gif\");\n}\n\nbody {\n  background-image:url(\"\
    gradient_image.gif\");\n}\n\nbody {\n  background-image:url(\"image.jpg\");\n\
    \  background-repeat:no-repeat;\n}\n\nbody {\n  background-image:url(\"image.jpg\"\
    );\n  background-position:center;\n}\n```\n\n## Formatting and design borders\n\
    \nBorder property can be used to define unique color and width for creating borders\
    \ with dotted, solid, dashed, grooved, double, inset, offset, hidden, ridged and\
    \ none. Syntax for creating border styles:\n\n```css\n.dotted{border-style:dotted}\n\
    .solid{border-style:solid}\n.dashed{border-style:dashed}\n.grooved{border-style:groove}\n\
    .double{border-style:double}\n.inset{border-style:inset}\n.offset{border-style:offset}\n\
    .hidden{border-style:hidden}\n.ridged{border-style:ridged}\n.none{border-style:none}\n\
    ```\n\n### Height and width\n\nIn CSS, height and width properties are used. Margin\
    \ property to set different margin sizes for every side. Margin property has different\
    \ values such as length, width, and margin, calculated by the browser.\n\nSyntax:\n\
    \n```css\nbody {\n  margin:size;\n}\n```\n\n### Padding\n\nCSS padding is used\
    \ to define a border order created around the element. Other different ways to\
    \ set padding on HTML website for individual sides such as top, right, bottom,\
    \ and left. Padding has length and width values for which the following CSS syntax\
    \ is implemented:\n\n```css\nbody {\n  Padding:size;\n}\n```\n\n### Font and text\n\
    \nFont property in CSS is used to specify other font properties and set the font\
    \ content. Different font properties included in style are family, weight, variant,\
    \ weight, and size.\n"
