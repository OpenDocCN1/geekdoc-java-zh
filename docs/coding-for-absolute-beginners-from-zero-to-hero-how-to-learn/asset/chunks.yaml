  trans: "\n\n![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\n# 文本\n\n现在可以通过 css 属性将文本转换为不同的颜色、样式和缩进。这些属性包括：\n\
    \n*   文本颜色：更改文本的颜色。\n*   文本对齐：指定文本的水平或垂直对齐方式。\n*   文本装饰：轮勒文本的装饰样式。\n*   文本转换：控制文本的大小写。\n\
    *   文本缩进：指定第一行的缩进。\n*   字间距：增加或减少单词（或字母）之间的间距。\n*   行高：指定行高。\n*   文本方向：设置书方向。\n\
    *   单词间距：设置单词之间的空间。\n*   文本投影：在文本上添加阴影效果。\n\n## css 文本属性的语法：\n\n### 文本颜色\n```css\n\
    Body {\n  color: red;\n}\n```\n\n### 文本对齐\n```css\nH1 {\n  Text-align: center;\n\
    }\n\nH2 {\n  Text-align: left;\n}\n\nH3 {\n  Text-align: right;\n}\n```\n\n###\
    \ 文本装饰\n```css\nH1 {\n  Text-decoration:overline/underline/line-through;\n}\n\
    ```\n\n### 文本转换\n```css\nP.uppercased {\n  Text-transform: uppercase;\n}\n\nP.lowercased\
    \ {\n  Text-transform: lowercase;\n}\n\nP.capitalized {\n  Text-transform: capitalize;\n\
    }\n```\n\n### 文本缩进\n```css\nP {\n  text-indent: 100px;\n}\n```\n\n### 字间距\n```css\n\
    H1 {\n  Letter-spacing: 3px;\n}\n\nH2 {\n  Letter-spacing: -3px;\n}\n```\n\n###\
    \ 行高\n```css\nP.small {\n  Line-height: 0.6;\n}\n\nP.big {\n  Line-height: 1.6;\n\
    }\n```\n\n### 文本方向\n```css\nP {\n  Direction: rtl;\n}\n```\n\n### 文本投影\n```css\n\
    H1 {\n  text-shadow: 4px 3px green;\n}\n```\n\n### 单词间距\n```css\nH1 {\n  Word-spacing:\
    \ 10px;\n}\n\nH2 {\n  Word-spacing: -5px;\n}\n```\n\n## 链接、表格和页边距\n\n### 链接\n\
    这里有通过 css 实现超链接的不同 css 属性。这些属性包括：`:link`, `:visited`, `:hover` 和 `:active`。实现\
    \ `link` 属性的 css 语法定义如下：\n\n```html\n<style type=\"text/css\">\nA:link {color:\
    \ #000000}\nA:visited {color: #006600}\nA:hover {color: #ffcc00}\nA:active {color:\
    \ #ff00cc}\n</style>\n```\n\n### 表格\n这里用于转换和设计 html 表格的不同 css 属性。\n\n*   框合并\n\
    *   框间距\n*   标题位置\n*   空单元格\n*   表格布局\n\n使用 css 创建简单表格的语法：\n\n```html\n<html>\n\
    <body>\n<table class=\"table\" border=\"1\">\n  <tr>\n    <th>first name</th>\n\
    \    <th>last name</th>\n    <th>marks</th>\n  </tr>\n  <tr>\n    <td>john</td>\n\
    \    <td>harry</td>\n    <td>40</td>\n  </tr>\n</table>\n</body>\n</html>\n```\n\
    \n### 输出：\n![image_rsrc9FW.jpg](img/image_rsrc9FW.jpeg)\n\n#### 框合并\n```html\n\
    <head>\n  <style type=\"text/css\">\n  table.one {border-collapse:collapse;}\n\
    \  table.two {border-collapse:separate;}\n  td.ad {\n    border-style:dotted;\n\
    \    Border-width:3px;\n    Border-color:#000000;\n    padding:10px;\n  }\n  td.bd\
    \ {\n    Border-style:solid;\n    Border-width:3px;\n    Border-color:#333333;\n\
    \    Padding:10px;\n  }\n  </style>\n</head>\n```\n\n#### 框间距\n```html\n<head>\n\
    \  <style type=\"text/css\">\n  table.one {border-collapse:collapse;}\n  table.two\
    \ {border-collapse:separate;}\n  td.ad {\n    border-style:dotted;\n    Border-width:3px;\n\
    \    Border-color:#000000;\n    padding:10px;\n  }\n  td.bd {\n    Border-style:solid;\n\
    \    Border-width:3px;\n    Border-color:#333333;\n    Padding:10px;\n  }\n  </style>\n\
    </head>\n```\n*(注：提供的文本包含输出的重复/乱码块；我已根据内容的逻辑清理了结构）\n\n#### 输出：\n![image_rsrc9FX.jpg](img/image_rsrc9FX.jpeg)\n\
    \n#### 文本对齐\n```css\n.top {vertical-align: top}\n.bottom {vertical-align: bottom}\n\
    .left {vertical-align: left}\n.right {vertical-align: right}\n```\n\n#### 空\n\
    ```css\n.empty {\n  width: 350px;\n  border-collapse: separated;\n  empty-cells:\
    \ hidden;\n}\n.empty {\n  padding: 5px;\n  border-style: solid;\n  border-width:\
    \ 1px;\n  border-color:#999999;\n}\n```\n\n#### 表格布局\n```css\ntable.auto {\n \
    \ table-layout: auto;\n}\ntable.fixed {\n  table-layout: fixed;\n}\n```\n\n####\
    \ 页边距\n```css\n.link {\n  margin: 10px;\n  border: 1px solid black;\n}\n```\n\n\
    #### 列表、图标和下拉菜单\n这里有不同类型的列表：有序列表和无序列表。有序列表使用数字或字母标记列表项，而无序列表通常使用项目符号标记。这些列表通过\
    \ circle, decimal, lower-roman, upper-roman, decimal-zeros, lower-alpha, upper-alpha\
    \ 和 square 等值来创建。\n\n\n"
