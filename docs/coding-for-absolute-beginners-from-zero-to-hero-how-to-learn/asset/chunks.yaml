  trans: "\n\n右连接（right join）从 table2 中选择所有记录，并满足连接条件的 table1 中的匹配记录。在 SQL 中创建右连接的语法如下：\n\
    \n```sql\nSelect column_named\nFrom table1\nRight join table2\nOn table1.column_named\
    \ = table2.colmn_name;\n```\n\n全外连接（full outer join）从 table1 和 table2 中选择所有记录，即使不满足连接条件。在\
    \ SQL 中创建全外连接的语法如下：\n\n```sql\nSelect column_named\nFrom table1\nFull outer join\
    \ table2\nOn table1.column_named = table2.colmn_named\nWhere condition;\n```\n\
    \n并集运算符（Union operator）\n\n为了合并两个或多个 `select` 语句的结果，使用了 `union` 运算符，其中每个列必须具有相似的数据类型。此外，两个表\
    \ select 语句中的列应该保持相同的顺序。在 SQL 中实现 `union` 运算符的语法如下：\n\n```sql\nSelect column_named\
    \ from table1\nUnion\nSelect column_named from table2;\n```\n\n分组（Group by）\n\n\
    SQL 的 `group by` 语句可以用于从数据库表中执行列表或编号。在 SQL 中使用 `group by` 语句的语法如下：\n\n```sql\n\
    Select column_named\nFrom table_named\nWhere condition\nGroup by column_named\n\
    Order by column_named;\n```\n\n排序（Order by）\n\nSQL 中的 `order by` 语句用于按升序或降序排序数据。实现\
    \ `order by` 子句的语法如下：\n\n```sql\nSelect column_list\nFrom table_named\nWhere condition\n\
    Order by column1, column2 [asc|desc];\n```\n\n高级 SQL（Advanced SQL）\n\n还有其他一些关键操作和子句可以在数据库内执行复杂操作。以下是高级\
    \ SQL 一些关键特的详细说明：\n\n索引（Indexes）\n\nSQL 索引被数据库搜索引擎用于优化处理的数据处理。它们被视为特殊的查找表，索引有助于加速子句和选择查询。可以使用创建索引语句结合唯一约束（unique\
    \ constraint）来防止重复输入。\n\n使用已创建索引的语法：\n\n```sql\nCreated index index_named on table_named;\n\
    ```\n\n删除索引的语法：\n\n```sql\nDrop index index_name;\n```\n\n截断表（Truncated table）\n\
    \n`truncate table` 命令是 SQL 实现的用于从现有表中删除已完成的数据。基本语法：\n\n```sql\nTruncate table\
    \ table_name;\n```\n\n主键和外键（Primary and foreign key）\n\nSQL 中的主键约束用于唯一标识表中的每条记录。主键应始终包含唯一值且不能有空值。此外，多个列中只能添加一个主键。例如，为了在创建的\
    \ \"students\" 表上定义主键，我们以下语句：\n\n```sql\nCreated students (\nid int primary,\n\
    firstnamed int,\nlastnamed int\nid));\n```\n\n外键（Foreign key）\n\nSQL 中的外键约束用于将表连接到主键。在创建的\
    \ \"student\" 表上实现外键约束的语法：\n\n```sql\nCreated student (\nstudentid int,\nmarks\
    \ int,\nforeign key (studentid) references students(id));\n```\n\n约束和有用资源（Constraints\
    \ and useful resources）\n\n约束是实现在表列上的特定规则。通常，常见的约束包括默认约束（default constraint）、唯一约束（unique\
    \ constraint）、主键、外键、检查约束（check constraint）和索引。此外，完整性约束也用于为关系型数据库呈现的数据提供更好的一致性和准确性。通常，主键和唯一约束是引用完整性（ri）的一部分。为了提高\
    \ SQL 数据库的性能，有几个可以轻松实现的因素。在编写列名时，建议使用 select 语句而不是通配符 **。例如：\n\n```\nSelect *\
    \ from students\n```\n\n此外，设置 `count` 语句将减少 SQL 服务器更新插入、删除或更新操作行所需的时间\n\n## 第四章：C（Chapter\
    \ four: C）\n\nC 语言于 1972 年在贝尔实验室开发。通常，编程语言分为两大类：高级语言和低级语言，但 C 被视为中间语言。这种语言的目的是提供对内存的低级访问，并为\
    \ PHP 和 Java 等其他主要语言提供了语法。\n\n介绍和简单程序（Introduction and simple programs）\n\n作为一种结构化语言，程序员可以通过实现不同的方法和编程技术创建分区代码块并创建业务应用程序。此外，我们编写了新函数并在库中重复使用它们。\n\
    \n从 C 编程开始\n\n对于初学者来说，编写 C 程序简单又容易。从基础编程语法开始，我们开发了如下应用程序：\n\n```c\n#include <stdio.h>\n\
    \nint main()\n\n{\n    return 0;\n}\n```\n\n"
- fmt: "\n```c\nint main() {\n    printf(\"%d\", a);\n    return 0;\n}\n```\n\n# Header\
    \ files\n\nThe first part of writing a program is the selection of header files.\
    \ Generally, a header file is written with an extension of `.h` and also contains\
    \ function declarations. To include a header file, we use the `#include` directive\
    \ followed by the header file name and syntax as follows:\n\n```c\n#include <string.h>\
    \ own```\n\nExamples of each header files:\n\n| Header file | Definition |\n|\
    \ :--- | :--- |\n| Stdio.h | Used to define input and output functions |\n| String.h\
    \ | Used for string handling |\n| Stddef.h | Defines useful types and macros |\n\
    | Stdlib.h | Defines memory allocation |\n| Stdint.h | Used for defining integer\
    \ types | own| Math.h | Used to perform mathematical functions |\n\n# Methods\
    \ and variable declaration\n\nThe next part of writing a program is to define\
    \ each method and declared the variables. The syntax for declaring `main` method\
    \ is:\n\n```c\nInt main()\n{\n    // Syntax for variable declaration is:\n\n \
    \   Int main()\n    {\n\n        Int z;\n    }\n}\n```\n\nProgram body:\n\n```c\n\
    Int main()\n{\n    int ez;\n    printf(\"%d\", ez);\n    return 0;\n}\n```\n\n\
    To terminate the program, we can use the `return` statement: `return 0`.\n\n#\
    \ Keywords\n\nKeywords are each forced of any programming language and are also\
    \ known as reserved words. Although there are several keywords for high-level\
    \ programming language, only 32 keywords are allowed to be used in C which as\
    \ follows:\n\n| Double | Long | Int | Switch |\n| :--- | :--- | :--- | :--- |\n\
    | Case | Register | Enum | Typedef |\n| Union | Extern | Const | For |\n| Do |\
    \ While | Static | Default |\n| Auto | Break | Else | Struct |\n| Float | Short\
    \ | Char | Return |\n| Void | Continue | For | If |\n| Signed | Goto | Sizeof\
    \ | Volatile |\n\n# Data types and variables\n\nIn the programming language, data\
    \ types are used to define variables that are stored and assigned before it being\
    \ used in the program. The built-in data types of the programming language included\
    \ `float`, `int`, `char`, and `double`. These data types have modifiers called\
    \ `short`, `long`, `signed`, and `unsigned`.\n\nFollowing are the valid numbers,\
    \ alphabets, and symbols that are allowed in the programming language:\n\n- Alphabets:\
    \ `a-z`, `A-Z`.\n- Symbols: `-`, `~`, `'`, `!`, `@`, `#`, `%`, `^`, `&`, `*`,\
    \ `(`, `)`, `_`, `+`, `=`, `|`, `{`,}`.\n- Digits: `0,1,2,3,4...`\n\n# Variables\n\
    \nVariables declared in C, used and followed the program syntax as follows:\n\n\
    ```c\n#include <stdio.h>\n// variable declaration:\nint a;\n\nint main()\n{\n\
    \    /* variable definition: */\n    int a;\n\n    /* initialization */\n    a\
    \ = 30;\n    b = 20;\n    c = a + b;\n    printf(\"value of c: %d\", c);\n   \
    \ return 0;\n}\n```\n\n# Scoped variables\n\nThe scoped variables in any programming\
    \ language is set to allow certain permissions to variables. Generally, variables\
    \ are categorized as local variables, global variables, and parameters. Local\
    \ variables declared within a block and only used by statements written in that\
    \ specific region of the program. other functions in the program, cannot access\
    \ local variables outside the function. Global variables are usually defined outside\
    \ function and hold their values throughout the program. can be accessed and called\
    \ by any function within the program. Local variables need to be initialized by\
    \ the programmer whereas global variables get initialized automatically.\n\n#\
    \ Loops and functions\n\nLoops are essential part of every programming language\
    \ and allowed the developers to execute specific statement multiple times. There\
    \ are 4 different types of loops used in the programming language that as follows:\n\
    \n1. `for` loop: used to execute a statement a specific number of times and is\
    \ also considered to abbreviated coded to handled loop variable.\n2. `while` loop:\
    \ repeats the given statement and checks whether the given condition is true or\
    \ false before executing the loop body, it checks all the conditions.\n3. `do-while`\
    \ loop: works the same as the `while` loop, however, it checks the condition at\
    \ the end.\n4. Nested loops: loops inside another loop, the execution of the loop\
    \ changes from the normal sequence. `break` statement exits the loop and transfers\
    \ execution to the next statement.\n\n# Functions\n\nTo define a function in the\
    \ programming language, the following syntax is recommended:\n\n```c\nreturn type\
    \ name(parameter list)\n{\n    // function body\n}\n```\n\nIn a function, the\
    \ return type is the data type of the function itself as named `name`. Whenever\
    \ a function is invoked, we require to pass parameter list and its value is referred\
    \ to as actual argument. Parameters are not mandatory as function might also be\
    \ executed without any parameters. The function body contains multiple statements.\n"
