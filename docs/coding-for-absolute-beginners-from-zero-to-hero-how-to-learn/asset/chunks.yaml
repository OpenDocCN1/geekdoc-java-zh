  trans: "\n\n内部 CSS 在单个文档中实现，以赋予其独特的样式。请记住，它必须嵌入在 `head>` 部分内。\n\n### 内部 CSS 语法\n\
    \n实现内部 CSS 的语法如下：\n\n```html\n<head>\n  <title>internal css</title>\n  <style>\n\
    \    selector {\n      property:value;\n    }\n  </style>\n</head>\n```\n\n##\
    \ 外部 CSS\n\n外部 CSS 有一个独立的文件，其中仅包含样式属性以及属性。外部 CSS 文件需要使用 `link` 标签与 HTML 文档链接。\n\
    \n### 外部 CSS 示例：\n\n```css\nbody {\n  background-color:green;\n}\n\n.main {\n\
    \  Text-align:center;\n}\n\n.gfg {\n  color:#009900;\n  font-size:50px;\n  font-weight:bold;\n\
    }\n```\n\n## 基础语法和在 HTML 中的引入\n\nCSS 由若干样式规则组成，这些规则由浏览器解释并应用于网页。通常，样式规则由三个关键元素组成：选择器（selector）、属性（property）和值（value）。\n\
    \n选择器和经过 CSS 样式的 HTML 标签可以应用，例如 `<h1>`，其中属性（如 color）赋值给 HTML 标签。值被分配给属性。创建 CSS\
    \ 样式规则的基础语法定义如下：\n\n```css\nselector{property:value}\n```\n\n通常使用内联和外部 CSS 方法将样式与\
    \ HTML 文档关联，其中 `<style>` 元素位于 `<head>` 和 `</head>` 标签之间。在 HTML 文档中包含 CSS 的语法定义如下：\n\
    \n```html\n<html>\n  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" media=\"\
    all\">\n    <style>\n      body {\n        background-color:grey;\n      }\n \
    \     h1 {\n        color:white;\n        margin-left:40px;\n      }\n    </style>\n\
    \  </head>\n  <body>\n    <h1>Sample heading</h1>\n    <p>Sample paragraph</p>\n\
    \  </body>\n</html>\n```\n\n![image_rsrc9FU.jpg](img/image_rsrc9FU.jpeg)\n\n##\
    \ 导入 CSS 文件\n\n要导入外部样式表，可以实现以下规则：\n\n```html\n<head>\n  @import url(\"url\");\n\
    </head>\n```\n\n### 颜色和背景\n\n在 CSS 中，颜色可以通过名称或不同类型的值定义。要指定颜色代码，可以使用的格式详述如下：\n\n\
    | 名称 | 语法 |\n| :--- | :--- |\n| 关键字 | Green, blue, etc. |\n| Hex 代码 | #rrggbb\
    \ |\n| Rgb% | Rgb(r%, g%, b%) |\n| Rgb 绝对值 | Rgb(r, g, b) |\n| 短 Hex 代码 | #rgb\
    \ |\n\n例如，我们使用以下语法：\n\n```css\nh1{color:green}\n```\n\n### 背景\n\n可以定义的背景属性包括背景颜色，使用以下\
    \ CSS 语法：\n\n```css\nbody {\n  background-color;\n}\n\nbody {\n  background-image:url(\"\
    image.gif\");\n}\n\nbody {\n  background-image:url(\"gradient_image.gif\");\n\
    }\n\nbody {\n  background-image:url(\"image.jpg\");\n  background-repeat:no-repeat;\n\
    }\n\nbody {\n  background-image:url(\"image.jpg\");\n  background-position:center;\n\
    }\n```\n\n## 格式和边框设计\n\nBorder 属性可以定义唯一的颜色和宽度，用于创建点、实线、虚线、凹槽、双线、内嵌、偏移、隐藏、脊形和无边框。创建边框样式的语法：\n\
    \n```css\n.dotted{border-style:dotted}\n.solid{border-style:solid}\n.dashed{border-style:dashed}\n\
    .grooved{border-style:groove}\n.double{border-style:double}\n.inset{border-style:inset}\n\
    .offset{border-style:offset}\n.hidden{border-style:hidden}\n.ridged{border-style:ridged}\n\
    .none{border-style:none}\n```\n\n### 高和宽\n\n在 CSS 中使用了 height 和 width 属性。Margin\
    \ 属性用于设置每个侧不同的外边距。Margin 属性有不同的值，如长度、宽度和 margin，由浏览器计算。\n\n语法：\n\n```css\nbody\
    \ {\n  margin:size;\n}\n```\n\n### 内边距 (Padding)\n\nCSS padding 用于定义元素周围创建的边框。在\
    \ HTML 网站上设置单个侧（如上、右、下、左）内边距的其他不同方法。Padding 有长度和宽度值，并实现以下 CSS 语法：\n\n```css\n\
    body {\n  Padding:size;\n}\n```\n\n### 字体和文本\n\nCSS 中的 font 属性用于指定其他字体属性并设置字体内容。样式中包含的不同字体属性包括族（family）、字重（weight）、变体（variant）、字重（weight）和大小（size）。\n\
    \n"
- fmt: "\n![image_rsrc9FV.jpg](images/image_rsrc9FV.jpeg)\n\n# Text\n\nTransforming\
    \ text into different colors, styles, and indentation is now possible with css\
    \ text properties. These properties include:\n\n*   Text color: changed color\
    \ of the text.\n*   Text alignment: specify horizontal or vertical alignment of\
    \ the text.\n*   Text decoration: outlined the decoration of the text.\n*   Text\
    \ transformation: control capitalization of the text.\n*   Text indentation: specify\
    \ the indentation of the first line.\n*   Letter spacing: increased or decreased\
    \ space between words.\n*   Line height: specify line height.\n*   Text direction:\
    \ set direction of writing.\n*   Word spacing: set space between words.\n*   Text\
    \ shadow: adds shadow effect on text.\n\n## Syntax for css text properties:\n\n\
    ### Text color\n```css\nBody {\n  color: red;\n}\n```\n\n### Text alignment\n\
    ```css\nH1 {\n  Text-align: center;\n}\n\nH2 {\n  Text-align: left;\n}\n\nH3 {\n\
    \  Text-align: right;\n}\n```\n\n### Text decoration\n```css\nH1 {\n  Text-decoration:overline/underline/line-through;\n\
    }\n```\n\n### Text transformation\n```css\nP.uppercased {\n  Text-transform: uppercase;\n\
    }\n\nP.lowercased {\n  Text-transform: lowercase;\n}\n\nP.capitalized {\n  Text-transform:\
    \ capitalize;\n}\n```\n\n### Text indentation\n```css\nP {\n  text-indent: 100px;\n\
    }\n```\n\n### Letter spacing\n```css\nH1 {\n  Letter-spacing: 3px;\n}\n\nH2 {\n\
    \  Letter-spacing: -3px;\n}\n```\n\n### Line height\n```css\nP.small {\n  Line-height:\
    \ 0.6;\n}\n\nP.big {\n  Line-height: 1.6;\n}\n```\n\n### Text direction\n```css\n\
    P {\n  Direction: rtl;\n}\n```\n\n### Text shadow\n```css\nH1 {\n  text-shadow:\
    \ 4px 3px green;\n}\n```\n\n### Word spacing\n```css\nH1 {\n  Word-spacing: 10px;\n\
    }\n\nH2 {\n  Word-spacing: -5px;\n}\n```\n\n## Links, tables, and margins\n\n\
    ### Links\nThe here are different css properties to implement hyperlinks through\
    \ css. These properties included: `:link`, `:visited`, `:hover`, and `:active`.\
    \ The css syntax for implementing `link` property is defined as follows:\n\n```html\n\
    <style type=\"text/css\">\nA:link {color: #000000}\nA:visited {color: #006600}\n\
    A:hover {color: #ffcc00}\nA:active {color: #ff00cc}\n</style>\n```\n\n### Tables\n\
    Here are different css properties that can be used to transform and design the\
    \ html table.\n\n*   Border collapse\n*   Border spacing\n*   Caption side\n*\
    \   Empty cells\n*   Table layout\n\nSyntax for creating simple table using css:\n\
    \n```html\n<html>\n<body>\n<table class=\"table\" border=\"1\">\n  <tr>\n    <th>first\
    \ name</th>\n    <th>last name</th>\n    <th>marks</th>\n  </tr>\n  <tr>\n   \
    \ <td>john</td>\n    <td>harry</td>\n    <td>40</td>\n  </tr>\n</table>\n</body>\n\
    </html>\n```\n\n### Output:\n![image_rsrc9FW.jpg](images/image_rsrc9FW.jpeg)\n\
    \n#### Border collapse\n```html\n<head>\n  <style type=\"text/css\">\n  table.one\
    \ {border-collapse:collapse;}\n  table.two {border-collapse:separate;}\n  td.ad\
    \ {\n    border-style:dotted;\n    Border-width:3px;\n    Border-color:#000000;\n\
    \    padding:10px;\n  }\n  td.bd {\n    Border-style:solid;\n    Border-width:3px;\n\
    \    Border-color:#333333;\n    Padding:10px;\n  }\n  </style>\n</head>\n```\n\
    \n#### Border spacing\n```html\n<head>\n  <style type=\"text/css\">\n  table.one\
    \ {border-collapse:collapse;}\n  table.two {border-collapse:separate;}\n  td.ad\
    \ {\n    border-style:dotted;\n    Border-width:3px;\n    Border-color:#000000;\n\
    \    padding:10px;\n  }\n  td.bd {\n    Border-style:solid;\n    Border-width:3px;\n\
    \    Border-color:#333333;\n    Padding:10px;\n  }\n  </style>\n</head>\n```\n\
    *(Note: The provided text contained repetitive/garbled blocks for the output;\
    \ I have cleaned the structure based on the logic of the content)*\n\n#### Output:\n\
    ![image_rsrc9FX.jpg](images/image_rsrc9FX.jpeg)\n\n#### Text alignment\n```css\n\
    .top {vertical-align: top}\n.bottom {vertical-align: bottom}\n.left {vertical-align:\
    \ left}\n.right {vertical-align: right}\n```\n\n#### Empty\n```css\n.empty {\n\
    \  width: 350px;\n  border-collapse: separated;\n  empty-cells: hidden;\n}\n.empty\
    \ {\n  padding: 5px;\n  border-style: solid;\n  border-width: 1px;\n  border-color:#999999;\n\
    }\n```\n\n#### Table layout\n```css\ntable.auto {\n  table-layout: auto;\n}\n\
    table.fixed {\n  table-layout: fixed;\n}\n```\n\n#### Margins\n```css\n.link {\n\
    \  margin: 10px;\n  border: 1px solid black;\n}\n```\n\n#### Lists, icons, and\
    \ dropdowns\nThe here are different types of lists: ordered and unordered lists.\
    \ Ordered lists have list items marked with numbers or alphabets, whereas unordered\
    \ lists have list items generally marked with bullets. These are created using\
    \ values such as circle, decimal, lower-roman, upper-roman, decimal-zeros, lower-alpha,\
    \ upper-alpha, and square.\n\n"
