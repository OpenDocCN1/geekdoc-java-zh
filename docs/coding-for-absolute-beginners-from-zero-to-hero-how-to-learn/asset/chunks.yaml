    \ f.read(4)\n'D eis'\n>>> f.read()\n'My first file\\nthis file\\ncontains four\
    \ lines\\n'\n>>> f.read()\n```\n\n### Opening a file\nTo open a file by using\
    \ the `open()` function, we can have used the following syntax:\n\n```python\n\
    f = open(\"samplefile.txt\", \"r\")\nprint(f.read())\n```\n\nFor reading a specific\
    \ line, we can implement the `readline()` function:\n\n```python\nf = open(\"\
    samplefile.txt\", \"r\")\nprint(f.readline())\n```\n\n### Writing to an existing\
    \ file\nThe following python programming syntax will open the sampled file and\
    \ append content as well:\n\n```python\nf = open(\"samplefile.txt\", \"a\")\n\
    f.write(\"updated your content\")\nf.close()\n```\n\n# Open and readd the file\
    \ after appending:\n\n```python\nf = open(\"samplefile.txt\", \"r\")\nprint(f.read())\n\
    ```\n\n### Creating a file\nTo create a new file, `open()` method will be used\
    \ which can have de create, append, or write parameters. The syntax for creating\
    \ a file in python is as follows:\n\n```python\nf = open(\"newfile.txt\", \"w\"\
    )\n```\n\n### Deleting a file\nTo delete an existing file, `os.remove()` function\
    \ should be used with the following syntax:\n\n```python\nimport os\nos.remove(\"\
    samplefile.txt\")\n```\n\nSyntax to check whether the file exists or not:\n\n\
    ```python\nimport os\nif os.path.exists(\"samplefile.txt\"):\n    os.remove(\"\
    samplefile.txt\")\nelse:\n    print(\"the file does not exist\")\n```\n\n## Advanced\
    \ Python\n\n### Exception handling\nThe three methods of exception handling in\
    \ programming language are `try`, `except`, and `finally` blocks used to handle\
    \ errors that occur during program execution.\n\n#### Try\nTo generate and exception\
    \ exception through `try` block, the following syntax can be implemented:\n\n\
    ```python\ntry:\n    print(x)\nexcept:\n    print(\"and exception occurred\")\n\
    ```\n\nIf no errors were raised, the sampled code is as follows:\n\n```python\n\
    try:\n    print(\"python\")\nexcept:\n    print(\"and exception occurred\")\n\
    else:\n    print(\"no exception occurred\")\n```\n\n#### Finally\nIn exception\
    \ handling, the `finally` block will be executed even if the `try` block has raised\
    \ and exception or not. For example:\n\n```python\ntry:\n    print(\"python\"\
    )\nexcept:\n    print(\"and exception occurred\")\nfinally:\n    print(\"try exception\
    \ finished\")\n```\n\n### User-defined exceptions\nAlthough there are built-in\
    \ exceptions in programming language that can be used to force when something\
    \ is wrong, developers and also created custom exceptions to fulfill their requirements.\
    \ New exceptions ever created from `class`.\n\n### Tips for learning python\n\
    Python programming language is suitable for programmers having interest in artificial\
    \ intelligence, machine learning, robotics and development. Starting with programming\
    \ itself is compulsory that you learned basic python syntax. Learning methods,\
    \ approaches and syntax will make it for beginners to start coding and developing\
    \ any kind of application their own. For beginners, taking small exercises really\
    \ beneficial. they developed solving skills and utilized their programming concepts\
    \ as well. I have also written a ebook on python. [Python for absolute beginners](https://www.amazon.com/dp/B08DBXX7)\
    \ [python for beginners](https://www.amazon.com/dp/B08DBXX7) [python](https://www.amazon.com/dp/B08DBXX7)\
    \ [python](https://www.amazon.com/dp/B08DBXX7) [python](https://www.amazon.com/dp/B08DBXX7)\
    \ will help you achieved a solid foundation in python programming.\n\n## Chapter\
    \ eight: HTML\n\n### Introduction and overview\nHyperText markup language (HTML)\
    \ is standard markup language used to create websites to display colors, fonts,\
    \ pictures, media and images. HTML is comprised of different tags that can be\
    \ used to describe the structure of a webpage and tell the browser to display\
    \ the content over the internet.\n\n#### What are tags?\nTags give instructions\
    \ to browsers regarding the structure, display and content of any webpage. As\
    \ they are defined through enclosed brackets: `<>`, tags are comprised of attributes\
    \ and elements. And an element is and object on page whereas an attribute describes\
    \ the details of that. Remember that tags are opening and closing tags differentiated\
    \ by</tag>`.\n\nYour first HTML page created by using the tags:\n\n```html\n<html>\n\
    <head>\n<body>\n<h1>my heading</h1>\n<p>my paragraph</p>\n</body>\n</html>\n```\n\
    \n### Description of tags\nIn the above written HTML document, the `<html>` tag\
    \ encloses the completed HTML document and is comprised of other tags `<head>`,\
    \ `<body>`, and `<p>`. The `<head>` tag represents the file's header as the `<title>`\
    \ tag is used to show the document's header. The `<body>` includes several other\
    \ tags that were used to create a webpage such as heading `<h1>` and paragraph\
    \ `<p>`.\n"
