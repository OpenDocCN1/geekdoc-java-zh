  trans: "\n\n- 使用 `system`：用于包含程序所需的 `system` 命名空间。\n- 命名空间声明：程序中 `data` 和 `classes`\
    \ 的集合。\n- 类声明：包含程序中所使用的数据和方法的 `class`。\n- 静态 `void main()`：关键字 `static` 表示此方法可以在不实例化类的情况下被访问。\n\
    - `Console.WriteLine()`：用于定义系统命名空间的方法。\n- `Console.ReadKey()`：让计算机等待下一个命令，并防止屏幕直接关闭。\n\
    \n### 数据类型与变量\n\n数据类型是任何编程语言不可或缺的组成，它们指定了语言支持的类型化数据。在 C# 中，数据类型是预定义的，分为三大类：值类型（evaluated\
    \ data types）、引用类型（referenced data types）和对象类型（object types）。\n\n#### 1. 值数据类型\n\
    \n值类型变量派生自 `System.Value` 类，包含字母和数字形式的数据。下表显示了 C# 编程语言中使用的类型：\n\n| 数据类型 | 表示法\
    \ | 默认值 | 范围 |\n| :--- | :--- | :--- | :--- |\n| Byte | 8 位无符号整数 | 0 | 0 到 255\
    \ |\n| Decimal | 128 位精确小数值 | 0.0m | (-7.9e 10²⁸ 到 7.9e 10²⁸) / 10⁰ 到 28 |\n|\
    \ Bool | 布尔值 | False | True/false |\n| Float | 32 位单浮点类型 | 0.0m | -3.4e 10³⁸ 到\
    \ +3.4e 10³⁸ |\n| Double | | 0.0d | (+/-)5.0e 10^-324 到 (+/-)1.7e 10³⁰⁸ |\n| Char\
    \ | 16 位 unicode 字符 | ‘`\\0`’ | U+0000 到 U+ffff |\n| Int | 32 位有符号整数类型 | 0 | -22,147,483,648\
    \ 到 2,147,483,647 |\n| Short | 16 位有符号整数类型 | 0 | -32,768 到 32,667 |\n| Long |\
    \ 64 位有符号整数类型 | 0l | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n\
    \n#### 2. 引用数据类型\n\n引用类型存储的是变量的引用而不是实际数据。通过使用多个变量，引用类型可以指向内存位置，当内存位置被一个变量改变时，其他变量的值也会自动改变。\n\
    \n#### 3. 对象类型\n\n对象类型被认为是 C# 中使用的所有数据类型。此外，对象类型和引用类型也包括自定义类型。\n\n#### 4. 指针类型\n\
    \n指针包含变量的内存地址，语法为：`Type* identifier;`\n\n### 运算符\n\nC# 使用运算符的方式与其他编程语言相同，例如 `++`、内置的算术、关系、位运算、逻辑运算符和赋值运算符。\n\
    \n### 函数与方法\n\n在 C# 编程语言中，函数允许程序员封装代码的特定部分，并从代码的其他部分复用。这避免了从多个处访问函数并执行所需操作。C#\
    \ 中的函数使用以下语法声明：\n\n`<visibility> <return type> <name>(<parameters>) { code }`\n\
    \n类中已知成员函数在 C# 中也称为方法，通常称为实例方法和静态方法。函数可以返回任何类型的数据，并执行多条语句，如读取、跟随和运行。\n\n使用函数的\
    \ C# 示例程序：\n\n```csharp\nusing System;\nclass Return2\n{\n    public static string\
    \ lastFirst(string firstName, string lastName)\n    {\n        string separator\
    \ = \", \";\n        string result = lastName + separator + firstName;\n     \
    \   return result;\n    }\n\n    public static void main()\n    {\n        Console.WriteLine(lastFirst(\"\
    john\", \"william\"));\n        Console.WriteLine(lastFirst(\"james\", \"lewis\"\
    ));\n    }\n}\n```\n\n### 数组、字符串\n\n数组用于存储固定大小的数据元素。C# 语言中的数组声明：\n\n```csharp\n\
    using System;\nnamespace Application\n{\n    class Array\n    {\n        public\
    \ static void main(string[] args)\n        {\n            int[] numbers = new\
    \ int[10];\n            // 初始化数组元素\n            for (int i = 0; i < 10; i++)\n\
    \            {\n                numbers[i] = i + 10;\n            }\n        \
    \    // 输出每个数组元素的值\n            for (int j = 0; j < 10; j++)\n            {\n\
    \                Console.WriteLine(\"element[{0}] = {1}\", j, numbers[j]);\n \
    \           }\n        }\n    }\n}\n```\n\n字符串\n\n类\n对象\n"
- fmt: "\n# Class\n\nA class is a blueprint for creating objects. A class defines\
    \ the type of object, which is also known and instantiated the class and can be\
    \ created by using the following syntax:\n\n```\nStudent object1 = new Student();\n\
    ```\n\nOnce instantiated the class has been created, the object is passed back\
    \ automatically. For example:\n\n```\nStudent object2 = new Student();\nStudent\
    \ object3 = object2;\n```\n\nThe following program shows how object is created\
    \ in C# programming language:\n\n1. Using `system;`\n2. Namespaced `User`\n3.\
    \ `{`\n4. Class `Program`\n5. `{`\n6. `static void main(string[] args)`\n7. `{`\n\
    8. `User user = new User(\"harry potter\");`\n9. `User.userdetails();`\n10. `Console.WriteLine(\"\
    pressed exit..\");`\n11. `Console.WriteLine();`\n12. `}`\n13. `}`\n14. `Public\
    \ class users`\n15. `{`\n16. `public string name { get; set; }`\n17. `public int\
    \ users(string name, int age)`\n18. `{`\n19. `Named = name;`\n20. `aged = age;`\n\
    21. `}`\n22. `public void getdetails()`\n23. `{`\n24. `Console.WriteLine(\"name:{0},\
    \ age:{1}\", name, age);`\n25. `}`\n26. `}`\n27. `}`\n\n# Inheritance and Polymorphism\n\
    \nInheritance is a major part of object-oriented programming language allowing\
    \ programmers to use different classes that required the same functionality, inherited\
    \ works in method that parent and child. parent considered base class as child\
    \ class which inherits all functionality from its parent class.\n\nSyntax:\n\n\
    ```\n<access-specifier> class base_class\n{\n    ...\n}\nclass derived_class :\
    \ base_class\n{\n    ...\n}\n```\n\nFor multilevel inheritance:\n\n```\npublic\
    \ class a\n{\n    // implementation\n}\npublic class b : a\n{\n    // implementation\n\
    }\npublic class c : b\n{\n    // implementation\n}\n```\n\n# Polymorphism\n\n\
    Polymorphism refers to the technique where multiplied functionality is performed\
    \ through a single operation. Static polymorphism is performed at compiled time\
    \ whereas dynamic polymorphism is decided at runtime. Static polymorphism C# allows\
    \ programmers to implement the following two approaches:\n\n## Function Overloading\n\
    \nFunction overloading provides multiple definitions for the same function named\
    \ in the given scope. Moreover, function definition should be different from each\
    \ other by types so that you could not overload function declarations that have\
    \ a different return type.\n\n## Constructors\n\nIn C# programming, a constructor\
    \ is automatically called whenever a structure or class is created. Class can\
    \ have multiple constructors used with default values.\n\nSyntax for creating\
    \ constructors:\n\n```\npublic class person\n{\n    private string last;\n   \
    \ private string first;\n    public person(string lastname, string firstname)\n\
    \    {\n        last = lastname;\n        first = firstname;\n    }\n    // remaining\
    \ implementation of class\n}\n```\n\n# Exception Handling\n\nExceptions used to\
    \ transfer control from one segment to another. Generally, exceptions use try,\
    \ catch, finally blocks. The `try` block outlines the block of code where the\
    \ exception is being used. The `catch` block allows the exception to be handled.\
    \ The `finally` block executed the provided statements.\n\n"
