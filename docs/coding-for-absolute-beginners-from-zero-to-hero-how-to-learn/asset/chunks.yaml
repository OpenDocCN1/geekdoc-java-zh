    \n# 向结构体传递指针\n\n我们也可以在 C 语言编程中定义结构体指针，其方法与定义另一个变量相同。为了访问指针的成员，可以考虑以下语法：\n\n`Struct_pointer->title;`\n\
    \n# C 语言文件\n\n编程要求开发者使用最有效的方法来处理不同的需求和场景。在 C 语言中执行文件处理操作，可以使用以下操作：\n\n* `printf(f)`\n\
    * `scanf()`\n* `read()`\n* `write()`\n* `seek()`\n\n通常情况下，程序终止时所有数据都会丢失，因此我们需要创建一个包含所有数据的特定文件。这还可以节省时间，并允许程序员通过输入少量命令从文件中访问数据，并通过语言运算符将数据从一台计算机传输到另一台计算机。\n\
    \n常见的两种类型是文本文件和二进制文件。文本文件是 `.txt` 文件，可以使用记事本创建，维护和更新记录所需的精力最小。二进制文件以 0 和 1 的二进制形式存储数据。此外，与文本文件相比，二进制文件可以存储更多的数据。\n\
    \n在 C 语言中，我们可以通过下表提到的简单命令创建新文件、打开现有文件、读取和向文件写入信息以及关闭文件：\n\n| 操作 | 语法 |\n| :---\
    \ | :--- |\n| 打开文件 | `Ptr = fopen(\"fileopen\",\"mode\")` |\n| 关闭文件 | `Fclose(fptr);`\
    \ |\n| 写入二进制文件 | `Fwrite(address_data,size_data,numbers_data,pointer_to_file);`\
    \ |\n| 读取二进制文件 | `Fread(address_data,size_data,numbers_data,pointer_to_file);`\
    \ |\n| 写入文本文件 | `File *fptr; Fptr = fopen(\"address\",\"w\");` |\n| 读取文本文件 | `File\
    \ *fptr; Fptr = fopen(\"address\",\"r\");` |\n| 文件寻求 | `seek(file, offset, int)`\
    \ |\n\n让初学者编程更轻松的必备提示：建议他们在代码部分使用 `/* */` 注释写入信息，这还可以提高程序的功能。此外，始终使用 `int`、`char`\
    \ 和 `float` 等变量将使执行不同的计算变得更简单。C 语言由于指针、关键字和运算符的存在而速度很快，高效编写将确保初学者不会遇到问题。\n\n#\
    \ 第五章：C++\n\nC++ 是一门免费的中间级编程语言，由 Bjarne Stroustrup 于 1979 年开发。作为编程语言的增强版本，C++\
    \ 现在已成为最常用且最适合初学者的语言，涵盖了不同的编程风格，并且允许编译器在执行程序前勾勒错误。此外，使用 C++ 进行面向对象的编程可以方便地解决复杂问题并扩展标准库的使用。C++\
    \ 是世界上最流行的编程语言，广泛应用于图形界面、操作系统和嵌入式系统。\n\n## 基础语法\n\nC++ 编程语言的基础语法与 C 相同。程序员必须遵循一组预定义的规则来正确执行程序。这是我们开始学习\
    \ C++ 时写的第一个程序：\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nint main()\n\
    {\n    cout << \"my first program in C++\";\n    return 0;\n}\n```\n\n程序输出：my\
    \ first program in C++.\n\n![output:image_rsrc9FB.jpg](img/image_rsrc9F.jpeg)\n\
    \n![output:image_rsrc9FC.jpg](img/image_rsrc9FC.jpeg)\n\n程序的详情如下：\n\n```cpp\n\
    #include<iostream> // 该语句包含预定义的输入输出函数，并通知编译器包含 iostream 文件。\nusing namespace std;\
    \ // 一个用于存储程序内函数、变量和操作的语句，其中 std 被视为命名空间名称。\nint main() // 这是程序执行开始的主函数。int 返回类型指示编译器返回我们所包含的整数值。\n\
    cout << \"my first program in C++\"; // cout 是属于 iostream 文件的对象，用于显示内容。\nreturn\
    \ 0; // 该语句从主函数返回值 0 并结束。\n```\n\n"
- fmt: "\nThere are different types of variables in C++ programming language. Each\
    \ variable is defined with a specific keyword, `must` must be used to create a\
    \ variable, specify the type, and assign the valued value by following the syntax\
    \ as given below:\n\n```\nTyped variable = value;\n```\n\nTypes of variables:\n\
    \n* `Int` is used to store integers and whole numbers. For example, `1`, `45`,\
    \ `6346`.\n* `Char` is used to store single characters. For example, `'a'` or\
    \ `'z'`.\n* `Double` is used to store floating point numbers. For example, `50.2`,\
    \ `100.2342`.\n* `Bool` is used to store valued with two states: `true` or `false`.\n\
    * `String` is used to store text. For example \"c++ programming language\".\n\n\
    To declare and assign a value to the variable we can follow the syntax mentioned\
    \ below:\n\n```\nInt newnum;\nnewnum = 50;\ncout << newnum;\n```\n\nEvery variable\
    \ that is being used in C++ should be identified with unique names which are known\
    \ as identifiers. To construct identifiers, names must contain letters, digits,\
    \ or underscores and are case sensitive as well.\n\n### Data types\n\nData types\
    \ in C++ programming language defined the type of data that can be stored in a\
    \ variable. Generally, data types in C++ are classified into three groups: built-in,\
    \ derived, and user-defined. The user-defined data type includes structures, union,\
    \ and enum, whereas derived data type is based on array, function, and pointer.\n\
    \nBuilt-in data types for C++:\n\n* `Int`\n* `Char`\n* `Float`\n* `Double`\n*\
    \ `Bool`\n\nUser-defined data types:\n\n* `Union`\n* `Enum`\n* `Struct`\n\nDerived\
    \ data types:\n\n* `Function`\n* `Array`\n* `Pointer`\n\n### Modifier types and\
    \ storage classes\n\nModifiers in C++ programming language used with `char`, `double`\
    \ and `int` data types to change the meaning based on type order to meet certain\
    \ programming conditions. These modifiers include `signed`, `unsigned`, `long`,\
    \ and `short`.\n\nTo define scoped variables and functions within a C++ program\
    \ we can use stored classes such as `auto`, `register`, `extern`, `mutable`, and\
    \ `static`. `auto` stored class is default for all local variables whereas the\
    \ static class allows the compiler to store local variables even when it goes\
    \ out of scope. The external class refers to global variables used and more functions\
    \ or modified constant member function.\n\n### Control\n\nControl in C++ language\
    \ control is referred to the order in which instructions, functions and statements\
    \ are evaluated and executed while running. The statements are executed sequentially\
    \ from top to bottom until logic is fully satisfied. Dependent on statements C++\
    \ provides specific control statements:\n\n1. `if else`\n2. `for loop`\n3. `while\
    \ loop`\n4. `break` & `continue`\n5. `switch statement`\n6. `if statement`\n\n\
    If statement is used when multiple cases need to be executed within the program.\
    \ The syntax for if statement shows that only the executed statement given true\
    \ false statements are ignored automatically.\n\n```\nIf(condition){\n  statement;\n\
    }\n```\n\nFlowchart of if statement:\n\n```cpp\n#include <iostream>\nUsing namespace\
    \ std;\nint main(){\n  int marks = 80;\n  if(marks < 100){\n    cout << \"marks\
    \ less than 100\";\n  }\n  if(marks > 100){\n    cout << \"marks greater than\
    \ 100\";\n  }\n  return 0;\n}\n```\n\n### Nested if statement\n\nIn C++, a statement\
    \ within a statement is known as nested if statement. For example:\n\n```cpp\n\
    If(condition_1){\n  Statement1;\n  If(condition_2){\n    Statement2;\n  }\n}\n\
    ```\n\nIf else statement:\n\n```cpp\nIf(condition_1){\n  Statement;\n}else if(condition_2){\n\
    \  Statement;\n}\n```\n\n### Switch case\n\nSwitch statement in C++ programming\
    \ used when multiple cases need to perform operations. The syntax for switch statement\
    \ follows:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n\
    \  int num = 10;\n  while(num > 5){\n    switch(num){\n      case 1:\n       \
    \ cout << \"case 1\";\n        break;\n      case 2:\n        cout << \"case 2\"\
    ;\n        break;\n      case 3:\n        cout << \"case 3\";\n        break;\n\
    \      default:\n        cout << \"default\";\n    }\n  }\n  return 0;\n}\n```\n\
    \n### Goto statement\n\nThe goto statement in C++ changed the execution of program\
    \ and transferred the control to another labeled statement. Syntax for goto statement:\n\
    \n```\ngoto label;\n```\n\n### Loops\n\nLoop statements in C++ are implemented\
