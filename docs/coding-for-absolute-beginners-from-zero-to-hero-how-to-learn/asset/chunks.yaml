  trans: "\n\n决策结构包含一个或多个在给定场景下需要测试的条件。如果条件为真，则可以执行下一条语句；如果给定的条件为假，程序将终止。下面的图正确地展示了决策过程的实际工作方式：\n\
    \n### 字符、字符串、数组和正则表达式\n\nJava 编程语言使用了 `Character` 包装类，并提供了多个静态方法来操作字符。要创建一个 `Character`\
    \ 对象，您需要遵循以下语法：\n\n```\nCharacter ch = new Character('a');\n```\n\n如果您向方法传递任何基本类型\
    \ `char`，编译器将自动创建一个 `Character` 对象，编译器将使用语言中的各种方法将 `char` 转换为 `Character`。\n\n\
    正如我们之前讨论过的`strings` 的重要性和功能，Java 平台也提供了 `String` 类的支持。程序员可以通过多种方式处理字符串。在 Java\
    \ 语言中创建`string` 的示例代码如下：\n\n```java\npublic class NewString {\n\n    public static\
    \ void main(String args[]) {\n        char[] studentArray = {'s', 't', 'u', 'd',\
    \ 'e', 'n', 't'};\n        String studentString = new String(studentArray);\n\
    \        System.out.println(studentString);\n    }\n\n}\n```\n\n该程序的输出为：student。\n\
    \n此外，我们还可以使用 Java 编程语言中简单的连接方法来拼接字符串，如下：\n\n```java\nString1.concat(string2);\n\
    ```\n\n在 Java 中创建`string` 对象，程序员可以选择字面量关键字方法。\n\n### 数组\n\n数组是每种编程语言的重要部分，因为它们允许程序员处理并将存储存储变量中。它们被用于存储大量数据，您也可以将数组视为同一类别变量的集合。要声明数组，可以遵循下面摘要的简单语法：\n\
    \n```\ndatatype[] arrayRefVar;\n```\n\n在 Java 中创建数组非常简单，您可以使用以下语法：\n\n```java\n\
    arrayRefVar = new datatype[size];\n```\n\n该语句将创建一个指定大小并引用的数组。通常，使用循环或 for 循环来处理数组元素。用于排序、搜索和填充数组的静态方法：\n\
    \n* `public static int binarySearch(Object a, Object key)`\n* `public static void\
    \ fill(int[] a, int val)`\n* `public static boolean equals(long[] a, long[] b)`\n\
    * `public static void sort(Object a)`\n\n### 正则表达式\n\n正则表达式用于定义模式，并用于搜索、编辑和处理文本。Java\
    \ 定义了 `java.util.regex` 包，其中包含 `Pattern` 类、`Matcher` 类和 `PatternException` 对象。`Pattern`\
    \ 类要求开发者从 `compile()` 方法开始并返回一个 `Pattern` 对象，它不提供构造函数。对于 `Matcher` 类，对象针对标准输入字符串顺序执行查找和比较操作，通过\
    \ `matcher()` 方法获取对象。`PatternException` 用于指示正则表达式模式中的错误或异常。\n\n### 文件和 I/O\n\n\
    Java 编程语言拥有负责输入和输出操作的内置包。被称为 `java.io` 的流支持处理数据的多种操作和功能。Java 中有通用的流类型，被称为 `InputStream`\
    \ 和 `OutputStream`。`InputStream` 用于从文件中读取数据。\n\nJava 语言具有各种 I/O 数据处理流，包括以下：\n\n\
    * 字节流\n* 字符流\n* 标准流\n* 文件输入流\n* 文件输出流\n\n### 面向对象的 Java\n\n面向对象编程是一种使用类和对象的方法。通过使用继承、多态、封装和抽象等多个概念，程序员可以开发应用程序。\n\
    \n### 继承\n\nJava 语言中的继承允许类从另一个类继承特征。被继承的类是超类，被继承的类是子类。要在 Java 中使用继承，请遵循下面提到的语法：\n\
    \n```java\nclass derivedClass extends baseClass {\n    // methods\n}\n```\n"
- fmt: "\nAn abstract class is keyword ind its declaration and might not contain abstract\
    \ methods. If a class has abstract method it cannot be instantiated and the programmer\
    \ will have to inherit from another class to implement the abstract method.\n\n\
    Encapsulation\n\nEncapsulation is java programming process of wrapping data and\
    \ methods together. generally, the variables of one class will be hidden from\
    \ another class and can only be accessed through methods that are used in their\
    \ recurrent class. The advantages of encapsulation that are class could be made\
    \ read or write only and can also have total control over the data stored.\n\n\
    Recursion\n\nRecursion is a technique referred to a method which calls itself\
    \ within the program. the `recurse()` method is called from the `main` method\
    \ and can also be called from the same `recurse()` method as well. This process\
    \ continues until the given condition is met and if not satisfied, infinite recursion\
    \ occurs.\n\nHered is a simple implementation of recursion in java:\n\n```java\n\
    class Sample {\n    static void printfund(int test) {\n        if (test < 1) {\n\
    \            return;\n        } else {\n            System.out.printf(\"%dd\"\
    , test);\n            // statement 2\n            printfund(test - 1);\n     \
    \       System.out.printf(\"%dd\", test);\n        }\n    }\n\n    public static\
    \ void main(String[] args) {\n        int test = 3;\n        printfund(test);\n\
    \    }\n}\n```\n\nAdvantages of recursion\n\nThere were several complex programs\
    \ in which writing recursive code and delivered several benefits. Each provides\
    \ a simplified and clean way to write code, developers can and perform operations\
    \ of different kinds without any hassle.\n\nAbstract class and abstract methods\n\
    \nAbstract class\n\nIn java programming, and abstract class is now a class which\
    \ cannot be initiated and declare using the `abstract` keyword. Remember that\
    \ objects cannot be created of abstract class will generated compilation error.\
    \ Inheritance Java program illustrating inheritance and abstract class:\n\n```java\n\
    class Abstract {\n    abstract void display();\n}\n\nclass Sample extends Abstract\
    \ {\n    public void display() {\n        System.out.println(\"id\");\n    }\n\
    \n    public static void main(String[] args) {\n        Abstract obj = new Sample();\n\
    \        obj.display();\n    }\n}\n```\n\nAbstract method\n\nTo create and abstract\
    \ method in java, the keyword `abstract` is used. The syntax follows:\n\n```\n\
    abstract void move();\n```\n\n## Chapter three: database\n\nWhat is database?\n\
    \nA database is a collection of data which can be accessed, managed and updated.\
    \ Before entering into brief discussion of database, it is important that we understand\
    \ what data actually means and how can be processed. Data generally defined as\
    \ collection of records and facts with which we can perform calculations and apply\
    \ reasoning to. To protect, save, deliver and organize data, databases were created\
    \ and the system that manages the whole process is called database management\
    \ system (dbms).\n\nDatabase management system (dbms) concepts\n\nA database management\
    \ system consists of multiple programs that allow users to access the database\
    \ and handle data through different processes. Each designed to control access\
    \ to the database, there various operations and functionalities introduced in\
    \ the dbms to make it more effective, safe and reliable.\n\nThere were 4 different\
    \ types of dbms:\n\nRelational dbms\n\nThis category of dbms defines database\
    \ relations in the form of tables.\n\nObject oriented relational dbms allows data\
    \ to be stored objects along with attributes.\n\nNetwork dbms\n\nNetwork dbms\
    \ features many-to-many relations generally used structures.\n\nHierarchical\n\
    \nHierarchical dbms follows parent-child relationship to store data structured\
    \ similarly with nodes that are used fields.\n\nDatabase environment architecture\n\
    \nThe database environment is now a collection of components which are responsible\
    \ for handling, management and data. Databases generally stored in computers,\
    \ hardware and peripherals that used dbms tools such as SQL server.\n\nThe architecture\
    \ of database dbms is usually classified into three major categories: centralized,\
    \ decentralized and hierarchical. Decentralized systems can also be designed to\
    \ be accessed by parallel architectures.\n"
