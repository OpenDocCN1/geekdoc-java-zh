    ## 图标


    通过使用 HTML 中的图标库，我们也可以通过 CSS 添加不同类型的图标。例如 Bootstrap Awesome 和 Google 图标。


    ### Font Awesome 语法：

    ```html

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    ```


    ### Bootstrap 图标语法：

    ```html

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    ```


    ### Google 图标语法：

    ```html

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?Family=material+icons">

    ```


    ### 示例：


    ```html

    <!DOCTYPE>

    <html>

    <head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>

    <body>

    <h1>css icons</h1>

    <i class="fa fa-cloud" style="font-size:32px;"></i>

    <i class="fa fa-heart" style="font-size:32px;"></i>

    <i class="fa fa-file" style="font-size:32px;"></i>

    <i class="fa fa-car" style="font-size:32px;"></i>

    </body>

    </html>

    ```


