  trans: "\n此外，代码转换为二进制格式是由编译器完成的，程序员借此运行并执行程序。包括 C、C++、C# 和 Java 在内的编程语言需要编译成二进制格式，而\
    \ PHP、Perl 和 Python 等语言也可以直接执行。\n\n# 基础语法\n\n为了让初学者更容易上手，我们将从基础开始，用 C++ 编写一个“hello\
    \ world”程序。下面编写的示例程序将帮助你理解并开始编写你的第一个程序。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n    cout << \"hello world!\";\n    return 0;\n\
    }\n```\n\n该 hello world 程序的输出如下：\n\nhello world!\n\n每个在 C++ 中编写的程序都以 `#include\
    \ <iostream>` 和 `main()` 开始（也称为 `main` 函数）。然后程序根据需求继续包含函数、字符、循环、字符串或数组。在上述编写的程序中，`main()`\
    \ 被用作一个函数，而 `cout` 是用于打印“hello world!” 的标准输出流。最后，编写了 `return 0;` 作为程序的退出状态，这对于程序的执行也是必要的。\n\
    \n如果你无法执行该程序，可能存在某些编译器未处理的语法错误或输入错误，导致程序停止编译。漏掉单个逗号、分号或句点等微小的输入错误是最可能的原因。因此，如果你没有正确遵循编程语言定义的语法，在这种情况下你的程序可能无法编译或执行。\n\
    \n# 数据类型\n\n数据类型是各种编程语言的重要部分，用于创建计算机应用程序时。它对程序中编写的每个对象或变量进行分类；数据类型告诉编译器如何使用提供的数据来执行某些操作。通常，常用的数据类型包括整数、实数、布尔、字符、字母字符串和浮点数。\n\
    \n数据类型的简要详情如下：\n\n*   Date（日期）：01/04/2015\n*   Integer（整数）：1,52,13424\n*   Boolean（布尔）：true/false\n\
    *   String（字符串）：ab, aabb\n*   Void（空）：无数据\n*   Long（长整）：5325433253\n*   Floating-point\
    \ number（浮点数）：5.2341\n*   Short（短型）：0\n\n# 语法\n\n如前所述，程序被定义为执行某些操作以交付特定输出的元素和属性集合。通过\
    \ C++ 编程语言，让我们简要概述该语言语法的工作原理。\n\n1. `class`（类）：定义类并拥有其成员函数。例如，考虑 `school` 类，它将拥有老师、学生、员工等。\n\
    2. `object`（对象）：类的实例化，具有其状态，例如，汽车有不同的颜色、型号、规格。\n3. `methods`（方法）：方法指的是类内部不同动作的执行和操作。\n\
    \n编程变量、关键字、操作符和判断是程序的组成部分，它们提供了存储值所需的内存位置，以便保存的值将创建变量并分配名称、存储值以及从变量中检索值。\n\n为了开始声明变量，我们编写了以下程序：\n\
    \n```cpp\n#include <iostream.h>\nint main() {\n    int a;\n}\n```\n\n上述编写的程序创建由\
    \ `int` 关键字指定的名为 \"a\" 的变量。这意味着该变量只能存储整数值，不允许再次定义 \"a\" 来在变量中存储另一个值。要在变量中存储值，只需在变量声明后输入你想要替换\
    \ \"a\" 的数字即可。\n\n# 关键字\n\n每种编程语言都有用于各种用途的不同关键字。虽然每种语言都提供一套完整的保留关键字，但在使用关键字时需要遵循通用规则。与\
    \ `float`、`int`、`long` 和 `string` 类似，在编程语言中常用的其他关键字如下：\n\n*   Else\n*   Switch\n\
    *   Goto\n*   Static\n*   Case\n*   Break\n*   Enum\n*   For\n*   If\n*   Union\n\
    *   Double\n*   Private\n\n# 操作符\n\n操作符是任何编程语言的关键，用于执行某些操作或逻辑计算。它们通常用于数学计算，我们可以使用程序中的各种表达式求解复杂的方程。\n\
    \n编程语言中通常有两种类型的操作符：\n\n1. 算术操作符（Arithmetic operators）：用于进行数学和算术操作的操作符。例如：`+`、`-`、`/`、`--`、`++`、`*`。\n\
    \   * 二元操作符（Binary operators）：与其他操作数工作的的操作符，如 `+`、`-`、`/`、`*`。\n   * 一元操作符（Unary\
    \ operators）：用于单个操作数的操作符。例如：`++`、`--`。\n"
- fmt: "\n# 2. Relational Operators\n\nRelational operators are the most commonly\
    \ used operators that are used whether one operand is equal to another or not.\
    \ For example: `==`, `<=`, `<=`, `>==`.\n\nHere is a table detailing basic operators\
    \ and theirir functionality within the program:\n\n| Operator | Functionality\
    \ |\n| :--- | :--- |\n| + | Addition of two operands |\n| - | Subtraction of two\
    \ operands |\n| / | Division |\n| * | Multiplication |\n| == | Check whether the\
    \ two operands are equal or not |\n| >= | Check if the left operand is greater\
    \ than or equal in evaluated as compared to the right operand |\n| <= | Check\
    \ if the left operand is less than or equal in evaluated to the right operand\
    \ |\n\nLogical operators are also essential part of all programming languages.\
    \ They are used to obtain certain decisions in various scenarios. These operators—`and`,\
    \ `or`, and `not` are used to prove true or false statements as well.\n\n## Decisions\n\
    \nDecision making is a process in which the programmer has to select one option\
    \ based on more given conditions. You will have to test whether the condition\
    \ is true or false and represent the correct output.\n\nFor different programming\
    \ languages, the decision-making statements are briefly as follows:\n\n*   `if`\
    \ statement\n*   `else` statement\n*   Switch\n*   `else if` statement\n*   Conditional\
    \ operator\n\n## Programming Characters, Arrays and Strings\n\nIn programming\
    \ languages, char is a type used to store characters and letters. They are also\
    \ responsible for storing values and delivering output whenever the character\
    \ is called within the program. You are only allowed to store a single-digit number\
    \ or alphabet inside the single quotes such as `&`, `,`, `*` or `+`.\n\nThe example\
    \ code for defining characters is as follows:\n\n```\nchar ch1 = 'a';\n```\n\n\
    ### Arrays\n\nAn array is a data structure that has the capability to store sequentially\
    \ numbered elements of the same type and is generally of a fixed size. It is comprised\
    \ of contiguous memory locations, it is also known as a set of elements stored\
    \ under the same name. If you are writing a program to store 10 integers in sequence,\
    \ creating and array of 10 will be the best solution. This is how array with fixed\
    \ number is declared:\n\n```c\nint data[10];\n```\n\nThe two types of array are:\n\
    1. one-dimensional arrays\n2. multi-dimensional arrays\n\n### Accessing Arrays\n\
    \nAfter you have declared, you can easily access elements through indices. Arrays\
    \ have index 0 and you will have to use condition-1 to access the last element.\
    \ To initialized array after follows:\n\n```c\nint arr[5] = {1, 2, 3, 4, 5};\n\
    ```\n\nArrays allow programmers to store individual variables without defining\
    \ every specifically. Similar to other types, arrays are declared using `[]` brackets\
    \ and once the array has declared, you can assign values.\n\n#### Declaration\n\
    \nIn order to declared arrays, you must remember that array size must be an integer\
    \ greater than 0 and array declared as follows:\n\n`Typed arraynamed[size];`\n\
    \n#### Initialization\n\nTo initialize and array, you used the statement mentioned\
    \ below:\n\n```c\nint arr[5] = {23, 45, 53, 64, 73}\n```\n\n### Strings\n\nString\
    \ is data type used in programming languages to represent an array of characters.\
    \ To declare and initialize a string, you need to follow the same structured arrays.\
    \ There are different techniques and ways to write strings for every programming\
    \ language but the functionality is the same in each case. Each string can also\
    \ contain spaces in phrase such as “id have waiting since 5 pm.”\n\nThe example\
    \ of string is as follows:\n\n```c\nchar ec[] = \"abcdef\";\n```\n\n## Functions\n\
    \n### Functions\n\nAd function is a known block of code which performs a specific\
    \ task within the program. There are two types of functions in programming called\
    \ standard library functions and user defined functions. The standard library\
    \ functions are assigned the duty of handling major tasks such as i/o processing,\
    \ computations and defined functions created by themselves to perform specific\
    \ tasks provided better modularity for programs.\n\nTo define a function in programming,\
    \ you need to declared return type, name, parameter list and body.\n\nFor example:\n\
    \n```cpp\n#include <iostream.h>\n\nvoid functionname() {}\n\nint main() {\n  \
    \  functionname();\n}\n```\n\n### File I/O\n\nTo store and manage files such as\
    \ images, documents, plain text, and excel sheets supported from file input/output\
    \ modes. With file input, the approach is used to write any data into the file\
    \ as file output method is used to display results from file. Generally, file\
    \ can be opened in different modes such as read-only, write-only, and read-write\
    \ mode.\n"
