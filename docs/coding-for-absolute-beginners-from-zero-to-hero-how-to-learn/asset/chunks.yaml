    The distributed database has its data stored at sites which are interconnected
    with each other through communication links. This database is further classified
    into homogeneous and heterogeneous categories. For the homogeneous distributed
    database system, the same hardware, OS, and applications are connected together
    whereas for the heterogeneous distributed database system, the system can be different
    for each location and connection.


    ## Cloud database


    The cloud database is designed and built to store data in private, public or hybrid
    cloud providing better scalability and greater storage capacity users and can
    benefit from high availability. It is the best suited option for business applications.


    ## NoSQL database


    NoSQL database is best suited for large distributed data and is conveniently managed
    through relational databases. Furthermore, they are effective for big data performance
    issues which cannot be easily solved by using relational databases.


    ## Object-oriented database


    Object-oriented database is supported by the relational database and is based
    on objects rather than actions.


    ## End user database


    End user database is shared that is specifically designed and created for the
    end user. Each features a summary of the whole database, the end user certainly
    needs not worry about the operations that being performed at any database level.


    ## Database syntax, data type and operators


    Standard query language (`sql`) is used for storing, manipulating and retrieving
    data within a database. `sql` allows administrators to perform multiple operations
    that required to manage the database. The language allows you to executed queries,
    retrieved data, insert records, updated records, deleted records, created new
    databases, created new tables, and set permissions in the database just by writing
    simple queries.


    There are different versions of `sql` and all them supported major functionalities
    such as select, delete, insert, and update.


    ## Structured query language (sql)


    `sql` is the language that is used for relational database systems such as `mysql`,
    `sybase`, `oracle` and `server`. Being a standard database language, `sql` allows
    users to describe the data, access data, and manipulated the relational database
    management systems. Furthermore, users can also create, view and drop databases
    through the structured query language.


    The different components that included in this process are optimization engines,
    `sql` query engine, classic query engine and query dispatcher to perform specific
    operations in relational database management system, we used commands below:


    | Command | Description |

    | :--- | :--- |

    | Create | Used created new table or database. |

    | Read | Used and add data stored in tables. |

    | Update | Updated tables to modify records. |

    | Delete | Deleted any record from table. |

    | Insert | Insert new record to table |

    | Select | Select specific records from tables. |

    | Alter | Bring changes with object. |

    | Drop | Deleted entire table from database. |


    Using different operations from sampled table students:


    | eid | Student | City | Subject | Marks | Percentage |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | William | New York | Mathematics | 85 | 60% |

    | 2 | James | California | English | 79 | 58% |


    The statement to fetch records from students had syntax:


    ```sql

    Select * from students;

    ```


    Different queries explained follows:


    | Query | Syntax |

    | :--- | :--- |

    | Insert | Insert into table_name(column1,column2...) Values(value1,value2...)
    |

    | Update | Updated table_name set column1=value1,column2=value2... Where |

    | Delete | Deleted from table_name where; |

    | Order by | Select column1..from table_name Order by column1 asc/desc; |

    | Min() | Select min(column_name) From table_name where; |

    | Max() | Select max(column_name) From table_name where; |

    | Where | Select column1..From table_name where; |


    ## SQL joins


    Taking the example of relational database with tables and joined through `sql`
    query. The diagram clearly shows how tables joined together to shared data: We
    will implement various join operations on example tables `patients` below:


    Table e1:


    | Patientid | Caseno | Date |

    | :--- | :--- | :--- |

    | 43221 | 1 | 9-2-2011 |

    | 82357 | 3 | 8-12-2015 |


    Table e2:


    | Caseno | Patientname | City |

    | :--- | :--- | :--- |

    | 1 | Andrew | Chicago |

    | 3 | John | La |


    To join both tables, we wrote `sql` join statement as follows:


    ```sql

    Select p.patientid, p.caseno, p.date

    From patients p

    Inner Join patients p ON p.caseno = p.patientid;

    ```


    There are four different types of `sql` join queries known as:


    * Inner join

    * Left outer join

    * Right outer join

    * Full outer join


    ### Inner join


    Inner join selects the entire record from table and where the join condition is
    satisfied. The syntax for creating an inner join in `sql` is defined as follows:


    ```sql

    Select column_name

    From table1

    Inner Join table2 On table1.column_name = table2.column_name;

    ```


    ### Left outer join


    Left join selects the entire record from table combined with the records from
    table where the join condition is satisfied. The syntax for creating left join
    in `sql` is defined as follows:


    ```sql

    Select column_name

    From table1

    Left Join table2 On table1.column_name = table2.column_name;

    ```


