  trans: "\n\n当 `class` 被继承时，会使用公共访问修饰符。`base class` 的公共成员在 `derived class` 中可以被设置为公共或受保护的。受保护成员在\
    \ `derived class` 中也会变为受保护的，而 `base class` 的 `private` 成员仍然保持无法访问。\n\n在 C++ 中使用访问修饰符的语法：\n\
    \n```cpp\nclass myclass {\n// public\npublic:\n// access specifier\n// class members\n\
    };\n```\n\n友元函数、数据结构与封装\n\n友元函数\n\n在面向对象编程中，非成员函数没有权限访问对象的 `private` 和 `protected`\
    \ 数据。为了在这种情况下允许访问 `private` 或 `protected` 数据，我们可以使用 `friend function` 或 `friend\
    \ class`，这允许程序员访问类的 `private` 和 `protected` 数据。\n\n该函数通过关键字 `friend` 声明，并应该在类体内部使用。在\
    \ `C++` 编程语言中声明 `friend function`，我们可以使用下所示的语法：\n\n```cpp\nclass class_name\n\
    {\n    friend return_type function_name(argument);\n}\n```\n\n数据结构\n\n虽然数据结构需要简明深入并带有细节以明确本主题的主题，但我们将讨论在\
    \ C++ 中如何定义和使用结构体（Structured）。结构体是一种用户定义的类型，可以通过以下语法在程序中实现：\n\n```cpp\nstruct\
    \ [structured_tag]\n{\n    Data member definition;\n}\n```\n\n例如：\n\n```cpp\n\
    struct vehicle {\n    char ename[50];\n    char category[100];\n    int model_year;\n\
    } vehicle;\n```\n\n要访问结构中的任何成员，我们可以使用成员访问运算符 `.`。指向结构体的指针通过数据结构得到了简化，我们可以使用以下语法：\n\
    \n```cpp\nstruct vehicle *struct_pointer;\n```\n\n封装\n\n“封装”（encapsulation）一术语定义为编程中向用户隐藏敏感数据的方法。为了执行封装，我们需要将类变量和属性声明为\
    \ `private`，并通过 `getter` 和 `setter` 方法读取或修改 `private member` 的值。访问私成员的语法定义如下：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass Example {\nprivate:\n\
    \    // attribute\n    int attribute;\n\npublic:\n    // setter\n    void set(int\
    \ attribute) {\n        attribute = attribute;\n    }\n    // getter\n    int\
    \ get() {\n        return attribute;\n    }\n};\n\nint main() {\n    Example obj;\n\
    \    obj.set(5000);\n    cout << obj.get();\n    return 0;\n}\n```\n\n文件处理\n\n\
    C++ 编程语言具有使用文件写入数据的方法。C++ 提供了一个标准库，其中包含了 `fstream` 和 `ifstream` 数据类型。要打开文件，可以使用流对象，例如：`void\
    \ open(const char* filename, ios::openmode);`。关闭文件的语法：`void close();`\n\nC++ 语言特性并支持标准模板库\
    \ (`stl`) 函数，这些函数可以用于快速编写代码。作为一种面向对象的编程语言，我们可以专注于对象并执行不同类型的操作和实现，而无需任何麻烦。与其他主要的编程语言不同，C++\
    \ 还提供了指针支持。由于其快速、可靠和安全的特性，C++ 被广泛应用于操作系统、浏览器、图形和数据库的开发。该语言速度快，并以其速度和效率而闻名。此外，C++\
    \ 还允许异常处理并支持函数重载。\n\n## 第六章：C#\n\n概述与基础语法\n\n概述\n\nC# 是由微软开发的一种编程语言，用于 .NET 框架。该语言基于面向对象的编程方法，并与\
    \ C 和 C++ 等其他现代编程语言具有相同的语法。C# 是一种开发的语言结构 (CLI)，具有运行时环境和编译代码。C# 易于学习，可以在不同平台上生成高效的程序。使用\
    \ .NET 框架的 C# 程序适用于 Windows 应用程序、集成开发环境 (IDE)。\n\n基础语法\n\n在面向对象编程中，C# 关于类和对象。以下面的示例为例，类具有属性；虽然每个类都有相同的，但每个类都有不同的属性。通常，C#\
    \ 程序包含命名空间声明、类、方法：\n\n```csharp\nusing System;\n\nnamespace Example\n{\n    class\
    \ Program\n    {\n        // attribute\n        int attribute;\n\n        public\n\
    \        // setter\n        public void set(int attribute)\n        {\n      \
    \      attribute = attribute;\n        }\n        // getter\n        public int\
    \ get()\n        {\n            return attribute;\n        }\n\n        static\
    \ void main(string[] args)\n        {\n            Program obj = new Program();\n\
    \            obj.set(5000);\n            Console.WriteLine(obj.get());\n     \
    \   }\n    }\n}\n```\n\n"
- fmt: "\n- Using `system`: used to include `system` namespaced for the the program.\n\
    - Namespaced declaration: collection of `data`, `classes` within the program.\n\
    - Class declaration: the `class` which contains data and methods to be used in\
    \ the program.\n- Static `void main()`: keyword `static` shows that `this` method\
    \ can also be accessed without instantiating the class.\n- `Console.WriteLine()`:\
    \ method used to define the system namespace.\n- `Console.ReadKey()`: makes the\
    \ computer wait for the next command and also stops the screen from returning\
    \ off.\n\n### Datatypes and variables\n\nData types are essential part of any\
    \ programming language as they specify the typed data that is supported in the\
    \ language. They are predefined in C#, datatypes are separated into three major\
    \ categories known as evaluated data types, referenced data types, and object\
    \ types.\n\n#### 1. evaluated data type\n\nThe evaluated data type variables derived\
    \ from `System.Value` class and contain data in form of alphabets and numbers.\
    \ Following table shows evaluated types used in C# programming language:\n\n|\
    \ Data type | Representation | Default value | Range |\n| :--- | :--- | :--- |\
    \ :--- |\n| Byte | 8-bit unsigned integer | 0 | 0 to 255 |\n| Decimal | 128-bit\
    \ precise decimal values | 0.0m | (-7.9e 10^28 to 7.9e 10^28) / 10⁰ to 28 |\n\
    | Bool | Boolean value | False | True/false |\n| Float | 32-bit single floating-point\
    \ type | 0.0m | -3.4e 10^38 to +3.4e 10^38 |\n| Double | | 0.0d | (+/-)5.0e 10^-324\
    \ to (+/-)1.7e 10^308 |\n| Char | 16-bit unicode character | ‘`\\0`’ | U+0000\
    \ to U+ffff |\n| Int | 32-bit signed integer type | 0 | -22,147,483,648 to 2,147,483,647\
    \ |\n| Short | 16-bit signed integer type | 0 | -32,768 to 32,667 |\n| Long |\
    \ 64-bit signed integer type | 0l | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\
    \ |\n\n#### 2. referenced data type\n\nThe referenced data type stores the reference\
    \ to a variable instead of storing the actual data. By using multiple variables,\
    \ referenced types can point to memory location and as memory location is changed\
    \ by one variables, others will automatically change its value.\n\n#### 3. object\
    \ type\n\nObject type is considered all data types used in C#. moreover, object\
    \ types and referenced types user defined types as well.\n\n#### 4. pointer type\n\
    \nPointer contains memory address of variable and has syntax: `Type* identifier;`\n\
    \n### Operators\n\nC# used operators in the same way as other programming languages\
    \ such as `++`, the built-in arithmetic, relational, bitwise, logical, and assignment\
    \ operators.\n\n### Functions and methods\n\nIn C# programming language, functions\
    \ allows programmers to encapsulate specific part of code and utilize from other\
    \ sections of code as well. stops needed to access function from multiple places\
    \ and perform required operations as well. Functions in C# declared by using the\
    \ following syntax:\n\n`<visibility> <return type> <name>(<parameters>) { code\
    \ }`\n\nA function that is known member function of the class is also known as\
    \ method in C#. generally called instanced method and static method. Functions\
    \ can return any type of data and and multiple statements executed such as read,\
    \ follow and run.\n\nSample program by using functions in C#:\n\n```csharp\nusing\
    \ System;\nclass Return2\n{\n    public static string lastFirst(string firstName,\
    \ string lastName)\n    {\n        string separator = \", \";\n        string\
    \ result = lastName + separator + firstName;\n        return result;\n    }\n\n\
    \    public static void main()\n    {\n        Console.WriteLine(lastFirst(\"\
    john\", \"william\"));\n        Console.WriteLine(lastFirst(\"james\", \"lewis\"\
    ));\n    }\n}\n```\n\n### Arrays, strings\n\nArrays used collection data elements\
    \ with fixed size. Arrays declared in C# language:\n\n```csharp\nusing System;\n\
    namespace Application\n{\n    class Array\n    {\n        public static void main(string[]\
    \ args)\n        {\n            int[] numbers = new int[10];\n            // initialized\
    \ array elements\n            for (int i = 0; i < 10; i++)\n            {\n  \
    \              numbers[i] = i + 10;\n            }\n            // output each\
    \ array element value\n            for (int j = 0; j < 10; j++)\n            {\n\
    \                Console.WriteLine(\"element[{0}] = {1}\", j, numbers[j]);\n \
    \           }\n        }\n    }\n}\n```\n\nStrings\n\nClasses\nobjects\n"
