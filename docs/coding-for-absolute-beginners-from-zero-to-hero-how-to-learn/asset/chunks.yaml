    ## Icons


    By using icon library from html, we can add different types of icons through CSS
    as well. Bootstrap Awesome and Google icons.


    ### Font Awesome syntax:

    ```html

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    ```


    ### Bootstrap icons syntax:

    ```html

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    ```


    ### Google icons syntax:

    ```html

    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?Family=material+icons">

    ```


    ### Example:


    ```html

    <!DOCTYPE>

    <html>

    <head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>

    <body>

    <h1>css icons</h1>

    <i class="fa fa-cloud" style="font-size:32px;"></i>

    <i class="fa fa-heart" style="font-size:32px;"></i>

    <i class="fa fa-file" style="font-size:32px;"></i>

    <i class="fa fa-car" style="font-size:32px;"></i>

    <i class="fa fa-bars" style="font-size:32px;"></i>

    </body>

    </html>

    ```

