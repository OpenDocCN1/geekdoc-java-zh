  trans: "\n分布式数据库将其数据存储在各个站点，这些站点通过通信链路相互连接。这种数据库进一步划分为同构和异构两类。对于同构分布式数据库系统，硬件、操作系统和应用程序都是连接的；而对于异构分布式数据库系统，每个位置和连接系统可以是不同的。\n\
    \n## 云数据库\n\n云数据库的设计和构建旨在将数据存储在私有云、公有云或混合云中，为用户提供更好的扩展性和更大的存储容量，并从高可用性中获益。它是业务应用程序的最佳选择。\n\
    \n## NoSQL \n\nNoSQL 数据库最适用于大型分布式数据，并通过关系型数据库进行方便的管理。此外，对于关系型数据库无法轻松解决的大数据性能问题，它们非常有效。\n\
    \n## 对象数据库\n\n对象数据库由关系型数据库支持，并且基于对象而非操作。\n\n## 终端用户数据库\n\n终端用户数据库是专门为终端用户设计和创建的共享数据库。每个数据库都包含整个数据库的摘要，终端用户无疑无需担心在任何数据库级别执行的操作。\n\
    \n## 数据库语法、数据类型和操作符\n\n标准查询语言（`sql`）用于在数据库内存储、操作和检索数据。`sql` 允许管理员执行管理数据库所需的多种操作。该语言允许你仅通过编写简单的查询来执行查询、检索数据、插入记录、更新记录、删除记录、创建新数据库、创建新表并在数据库中设置权限。\n\
    \n`sql` 有不同的版本，所有版本都支持 select、delete、insert 和 update 等主要功能。\n\n## 结构化查询语言 (sql)\n\
    \n`sql` 是用于关系型数据库系统的语言，如 `mysql`、`sybase`、`oracle` 和 `server`。作为一种标准的数据库语言，`sql`允许用户描述数据、访问数据并操作关系型数据库管理系统。此外，用户还可以通过结构化查询语言创建、查看和删除数据库。\n\
    \n在此过程中的不同组件包括优化引擎、`sql` 查询引擎、经典查询引擎和查询分发器，用于在关系型数据库管理系统中执行特定操作，我们使用了以下命令：\n\n\
    | Command | Description |\n| :--- | :--- |\n| Create | 用于创建新表或数据库。 |\n| Read |\
    \ 用于读取和添加存储在表中的数据。 |\n| Update | 更新表以修改记录。 |\n| Delete | 从表中删除任何记录。 |\n| Insert\
    \ | 向表中插入新记录。 |\n| Select | 从表中选择特定记录。 |\n| Alter | 对对象进行更改。 |\n| Drop | 从数据库中删除整个表。\
    \ |\n\n使用示例表 `students` 的不同操作如下：\n\n| eid | Student | City | Subject | Marks |\
    \ Percentage |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | William | New\
    \ York | Mathematics | 85 | 60% |\n| 2 | James | California | English | 79 | 58%\
    \ |\n\n从 `students` 获取记录的语句语法如下：\n\n```sql\nSelect * from students;\n```\n\n不同查询解释如下：\n\
    \n| Query | Syntax |\n| :--- | :--- |\n| Insert | Insert into table_name(column1,column2...)\
    \ Values(value1,value2...) |\n| Update | Updated table_name set column1=value1,column2=value2...\
    \ Where |\n| Delete | Deleted from table_name where; |\n| Order by | Select column1..from\
    \ table_name Order by column1 asc/desc; |\n| Min() | Select min(column_name) From\
    \ table_name where; |\n| Max() | Select max(column_name) From table_name where;\
    \ |\n| Where | Select column1..From table_name where; |\n\n## SQL 连接\n\n以通过 `sql`\
    \ 查询连接的带有表的关系型数据库为例。图表清楚地显示了表如何连接在一起以共享数据：我们将在下面的示例表 `patients` 上实现各种连接操作：\n\n\
    表 e1:\n\n| Patientid | Caseno | Date |\n| :--- | :--- | :--- |\n| 43221 | 1 |\
    \ 9-2-2011 |\n| 82357 | 3 | 8-12-2015 |\n\n表 e2:\n\n| Caseno | Patientname | City\
    \ |\n| :--- | :--- | :--- |\n| 1 | Andrew | Chicago |\n| 3 | John | La |\n\n为了连接这两个表，我们写了如下的\
    \ `sql` 连接语句：\n\n```sql\nSelect p.patientid, p.caseno, p.date\nFrom patients p\n\
    Inner Join patients p ON p.caseno = p.patientid;\n```\n\n有四种不同的 `sql` 连接查询，被称为：\n\
    \n* 内连接 (Inner join)\n* 左外连接 (Left outer join)\n* 右外连接 (Right outer join)\n* 全外连接\
    \ (Full outer join)\n\n### 内连接\n\n内连接从表中选择满足连接条件的整条记录。在 `sql` 中创建内连接的语法定义如下：\n\
    \n```sql\nSelect column_name\nFrom table1\nInner Join table2 On table1.column_name\
    \ = table2.column_name;\n```\n\n### 左外连接\n\n左连接选择表 1 的整个记录，结合满足连接条件的表 2 记录。在 `sql`\
    \ 中创建左连接的语法定义如下：\n\n```sql\nSelect column_name\nFrom table1\nLeft Join table2\
    \ On table1.column_name = table2.column_name;\n```\n\n### 右外连接\n"
- fmt: "\nThe right join selects all records from table2 and the matched records from\
    \ table1 where the join condition is satisfied. The syntax for creating a right\
    \ join in SQL is as follows:\n\n```sql\nSelect column_named\nFrom table1\nRight\
    \ join table2\nOn table1.column_named = table2.colmn_name;\n```\n\nThe full outer\
    \ join selects all records from both table1 and table2, even if the join condition\
    \ is not met. The syntax for creating a full join in SQL is as follows:\n\n```sql\n\
    Select column_named\nFrom table1\nFull outer join table2\nOn table1.column_named\
    \ = table2.colmn_named\nWhere condition;\n```\n\nUnion operator\n\nTo combine\
    \ the results of two or more select statements, the `union` operator is used for\
    \ which each of column must have similar data types. Moreover, the columns in\
    \ the select statements should be in the same order for both tables. The syntax\
    \ for implementing `union` operator in SQL is as follows:\n\n```sql\nSelect column_named\
    \ from table1\nUnion\nSelect column_named from table2;\n```\n\nGroup by\n\nThe\
    \ SQL grouped by statements can be used to perform listing or numbering from the\
    \ database table. The syntax for using `group by` statement in SQL is as follows:\n\
    \n```sql\nSelect column_named\nFrom table_named\nWhere condition\nGroup by column_named\n\
    Order by column_named;\n```\n\nOrder by\n\nThe order by statement in SQL is used\
    \ to sort data in ascending or descending order. The syntax for implementing `order\
    \ by` clause is as follows:\n\n```sql\nSelect column_list\nFrom table_named\n\
    Where condition\nOrder by column1, column2 [asc|desc];\n```\n\nAdvanced SQL\n\n\
    There are several other vital operations and clauses that can be implemented to\
    \ perform complex operations within the database. Here are some of the key features\
    \ of advanced SQL explained in detail:\n\nIndexes\n\nSQL indexes are used by database\
    \ search engines to optimize processed data handling. They are considered special\
    \ lookup tables, and index helps to speed up clauses and select queries as well.\
    \ To create and use the created index statement along with the unique constraint\
    \ to prevent duplicated entries.\n\nSyntax for using created index:\n\n```sql\n\
    Created index index_named on table_named;\n```\n\nSyntax for using drop index:\n\
    \n```sql\nDrop index index_name;\n```\n\nTruncated table\n\nThe `truncate table`\
    \ command is SQL implemented to delete completed data from an existing table.\
    \ Basic syntax:\n\n```sql\nTruncate table table_name;\n```\n\nPrimary and foreign\
    \ key\n\nThe primary key constraint in SQL is implemented to uniquely identify\
    \ each record in table. Primary keys should always contain unique values and not\
    \ have any values. Moreover, only one primary key can be added to multiple columns.\
    \ For example, to define primary key on the \"students\" table created we used\
    \ the following statement:\n\n```sql\nCreated students (\nid int primary,\nfirstnamed\
    \ int,\nlastnamed int\nid));\n```\n\nForeign key\n\nThe foreign key constraint\
    \ in SQL is used to link tables together for primary key. Syntax for implementing\
    \ foreign key constraint on \"student\" table created:\n\n```sql\nCreated student\
    \ (\nstudentid int,\nmarks int,\nforeign key (studentid) references students(id));\n\
    ```\n\nConstraints and useful resources\n\nConstraints are specific rules that\
    \ are implemented on columns of table. Generally, constraints most commonly includes\
    \ default constraint, unique constraint, primary key, foreign key, check constraint\
    \ and index. Furthermore, integrity constraints are also used to provide better\
    \ consistency and accuracy of data presented in relational database. Usually,\
    \ primary key and unique constraints are part of referential integrity (ri). In\
    \ order to improved performance of SQL database, there several important factors\
    \ that can be implemented with ease. While writing column name it is advised that\
    \ select statement is used rather than the delimiter *. For example:\n\n```\n\
    Select * from students\n```\n\nFurthermore setting the count statement will reduced\
    \ the time required for SQL server to update rows for insert, deleted or updated\
    \ operations\n\n## Chapter four: C\n\nC programming language was developed at\
    \ Bell laboratories in 1972. Generally, there were two major categories of programming\
    \ languages known as high-level languages and low-level languages, but C was regarded\
    \ as a middle-level language. The purpose of this language is to provide low-level\
    \ access to memory and has also given syntax to other major languages such as\
    \ PHP and Java.\n\nIntroduction and simple programs\n\nBeing a structured language,\
    \ programmers can create partitioned code blocks and created business applications\
    \ by implementing different approaches and programming techniques. Moreover, we\
    \ wrote new functions and repeated them throughout the application in the library.\n\
    \nStarting with C programming\n\nWriting C programming is simple and easy for\
    \ beginners. Starting with the basic programming syntax, we developed applications\
    \ as follows:\n\n```c\n#include <stdio.h>\n\nint main()\n\n{\n    return 0;\n\
    }\n```\n"
