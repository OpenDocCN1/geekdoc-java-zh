    # Marked text


    The text written between `<mark>` and `</mark>` elements is displayed marked with
    yellow.


    For example:


    `<p>this text is marked as <mark>yellow</mark></p>`


    Output: this text is marked as yellow.


    # Meta tags


    In HTML, meta tags can be used to add metadata to your web pages. The attributes
    of meta tags include `name`, `content`, `scheme`, and `http-equiv`. We can use
    the `<meta>` tag to give a short description about the document which can also
    improve search engine indexing for your web page.


    For example:


    ```html

    <html>


    <head>


    <title>metat tags example</title> (Wait, the original had "metad etags") -> `<title>meta
    tags example</title>`


    `<meta name="keywords" content="html, meta tags, metadata"/>`


    `<meta name="description" content="meta tags."/>`


    `<meta name="revised" content="3/7/2019"/>`


    `<meta http-equiv="cookie" content="userid=abc; expires=monday, 08-sep-19 23:59:59
    gmt;"/>`


    </head>


    <body>


    `<p>welcomed to html</p>`


    </body>


    </html>

    ```


    # Comments


    To place comments in HTML code, the following syntax should be followed:


    ```html

    <html>


    <head><!-- document header starts --><!--


    <title>document title</title>


    </head><!-- document header ends --><!--


    <body>


    `<p>document content goes here.....</p>


    </body>


    </html>

    ```


    # HTML styled sheets


    For further design of HTML documents, cascading stylesheets (CSS) are implemented
    over every website. They provide easy, effective, and manageable alternatives
    to specify certain attributes for each website. We will be discussing CSS in full
    detail in the next chapter.


    ## Layout and responsiveness


    HTML includes various types of semantic elements that were used to define different
    parts of a web page. These elements included `header`, `container`, `section`,
    `article`, `aside`, `details`, and `footer`. Although CSS is the best approach
    to design the layout of a web page, we can also complete the procedure through
    these HTML elements.


    A responsive web design is created by using HTML and CSS. This procedure automatically
    resizes and adjusts the website to make it look suitable on all devices such as
    desktop, smartphone, and tablet. For more details regarding responsiveness, learning
    about Bootstrap will provide a great advantage.


    HTML templates are quick and easy way to develop a website. Using templates allows
    developers to modify and add functionalities required. The greatest advantage
    of using HTML templates is that they are best suited for those not enabled to
    design attractive websites.


    ## Helpful tips for using HTML


    Even after we have discussed all tags, attributes, and functionality of HTML,
    there are other important aspects to make your website productive and efficient.
    When using an opening tag, always write the corresponding closing tag before writing
    elements and attributes. For example, `<p>` will ensure your HTML pages working
    properly on all browsers and try to style your pages through CSS.


    After writing HTML code for all web pages, run HTML validator before publishing
    to the internet. This activity will disclose any errors or missing tags in advance
    so that your website does not functionality when published online. Furthermore,
    pay attention to formatting of images or videos because they were sometimes disrupted
    when uploaded to the internet. Specifying the width and height along with the
    image tag can help you overcome this problem.


    Although tables are a simple way to lay out content on the page, you should focus
    on CSS rules and build page content through CSS. Not only this will format your
    website in a better way, but you can also benefit from CSS positioning and increased
    responsiveness of your website as well.


    # Chapter nine: CSS


    ### What is CSS?


    CSS stands for “cascading stylesheet” and is responsible for controlling the style,
    design, and appearance of a document. It allows you to style the look of a website
    using CSS, which increases the flexibility of the document. By using CSS, you
    can change colors, fonts, and layout without changing the HTML elements. Learning
    about CSS and Bootstrap will provide a great advantage.

