- fmt: "\nMoreover, the conversion of code into binary format is done by the compiler\
    \ through which programmers can run and execute the program as well. Programming\
    \ languages including C, C++, C#, and Java need compilation into binary format\
    \ whereas other languages such as PHP, Perl, and Python can be executed directly\
    \ as well.\n\n# Basic Syntax\n\nTo make it easier for beginners, we will be starting\
    \ from the grassroots level and write a \"hello world\" program in C++. This sampled\
    \ program written below will make it easier for you to understand and begin writing\
    \ your first program.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n    cout << \"hello world!\";\n    return 0;\n}\n```\n\nThe output\
    \ for this hello world program is as follows:\n\nhello world!\n\nEach program\
    \ that is being written in C++ starts with `#include <iostream>` and `main()`\
    \ which is also known as the `main` function. The program then continues with\
    \ functions, characters, loops, strings or arrays depending on the requirements.\
    \ In the program written above, `main()` is used as a function whereas `cout`\
    \ is the standard output stream that is implemented to print \"hello world!\"\
    . At last, `return 0;` is written as the exit status of the program which is also\
    \ necessary for program execution.\n\nIf you are unable to execute the program,\
    \ there might be some possible syntax errors or typing mistakes that are not being\
    \ processed by the compiler, and it stops the program from compiling. Small typing\
    \ errors such as the omission of a single comma, semicolon, or dot are most likely\
    \ to be the cause. So, if you are not properly following the syntax defined for\
    \ the programming language, your program might not be compiled or executed in\
    \ this case.\n\n# Data Types\n\nData types are an important part of various programming\
    \ languages and are used when creating computer applications. It classifies every\
    \ object or variable that is being written in the program; data types tell the\
    \ compiler how to use the provided data in order to perform certain operations.\
    \ Generally, commonly used data types include integer, real, boolean, characters,\
    \ alphanumeric strings, and floating-point numbers.\n\nBrief details of data types\
    \ are given as follows:\n\n*   Date: 01/04/2015\n*   Integer: 1,52,13424\n*  \
    \ Boolean: true/false\n*   String: ab, aabb\n*   Void: no data\n*   Long: 5325433253\n\
    *   Floating-point number: 5.2341\n*   Short: 0\n\n# Syntax\n\nAs stated previously,\
    \ a program is defined as collection of elements and attributes that perform certain\
    \ operations to deliver specific output. With C++ programming language, let us\
    \ briefly look at overview of how the syntax of the language works.\n\n1. `class`:\
    \ class is defined and has its member functions. For example consider the class\
    \ school which will have teachers, students, staff, etc.\n2. `object`: object\
    \ is instantiated of class that has their states for example, a car has different\
    \ colors, models, specifications.\n3. `methods`: method is referred to as the\
    \ execution and manipulation of different actions within the class.\n\nProgramming\
    \ variables, keywords, operators, and decisions are essential part of the program\
    \ that provided memory locations required to store values in order saved value\
    \ will have created variables and assigning name, storing values and retrieved\
    \ values back from variables.\n\nTo get started declaring variables, we will have\
    \ written the program:\n\n```cpp\n#include <iostream.h>\nint main() {\n    int\
    \ a;\n}\n```\n\nThe above written program creates a variable named \"a\" specified\
    \ by the `int` keyword. This means the variable can only store an integer value\
    \ and is not allowed to define \"a\" again to store another value in the variable.\
    \ To store value in the variable, just declared the number that you want to replace\
    \ in \"a\" after the declaration of variable.\n\n# Keywords\n\nThere are different\
    \ keywords for every programming language that are used for various purposes.\
    \ Although each language provides a complete set of reserved keywords, there is\
    \ common rule that needs to be followed while using the keywords. Same as `float`,\
    \ `int`, `long`, and `string`, other keywords that are mostly used in every programming\
    \ language are follows:\n\n*   Else\n*   Switch\n*   Goto\n*   Static\n*   Case\n\
    *   Break\n*   Enum\n*   For\n*   If\n*   Union\n*   Double\n*   Private\n\n#\
    \ Operators\n\nOperators are the key aspect of any programming language and are\
    \ required to perform certain operations or logical computations. They are generally\
    \ used for mathematical calculations, we can solve complex equations using various\
    \ expressions in the program.\n\nThere are two kinds of operators that are generally\
    \ used in programming languages:\n\n1. Arithmetic operators: operators that are\
    \ used to conduct mathematical and arithmetic operations. For example: `+`, `-`,\
    \ `/`, `--`, `++`, `*`.\n   * Binary operators: operators that work with other\
    \ operands such as `+`, `-`, `/`, `*`.\n   * Unary operators: operators that are\
    \ used to work with a single operand. For example: `++`, `--`.\n"
