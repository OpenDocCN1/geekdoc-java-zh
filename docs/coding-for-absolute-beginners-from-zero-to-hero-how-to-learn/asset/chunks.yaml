    \ python programming language which contained more than two hundred modules. Moreover,\
    \ they also provided a platform-independent support to perform several programming\
    \ tasks such as object persistence, text pattern matching, and internet scripting\
    \ as well.\n\nSyntax for `import` statement in python:\n\n```python\nimport module_name1\
    \ [, module_name2, ... [as module_name]]\n```\n\nThe runtime operational statements\
    \ to be used with `import` modules are:\n\n1. `import find`\n2. `import compile`\n\
    \nTo use the module named as a newmodule, we can call the function as:\n\n```python\n\
    import newmodule\nNewmodule.functionnamed(\"name\")\n```\n\nTo import `from` module\
    \ in python, the syntax is:\n\n```python\ndef newmodule import (name):\n    print(\"\
    hello, \" + ename)\n\nPerson1 = {\n    \"name\": \"james\",\n    \"age\": 30,\n\
    \    \"country\": \"sweden\"\n}\n```\n\n## Object-oriented python\n\nIn object-oriented\
    \ programming, we are required to define classes and objects to perform various\
    \ functions within the program. Like other major programming languages such as\
    \ C++ and C, we can create, access, and update classes by using object-oriented\
    \ techniques.\n\nTo create a `student` class in python, the code is written as\
    \ follows:\n\n```python\nclass student:\n    def __init__(self, id, ename, class):\n\
    \        self.rd = roll\n        self.nd = ename\n        print((self.n))\n\n\
    Stud1 = student(1, \"james\")\nStud2 = student(2, \"william\")\nprint(\"data successfully\
    \ stored in variables\")\n```\n\nFor accessing the object’s variable, the dot\
    \ operator `.` is used for which the syntax is:\n\n```python\nMyobject_name.variable_name\n\
    ```\n\n## Inheritance\n\nInheritance is a useful feature of object-oriented programming\
    \ which allows developers to create a new class to inherit all methods and properties\
    \ of an existing class. We can define a new child class or derived class with\
    \ the properties of parent class based by using inheritance techniques.\n\nThe\
    \ syntax for implementing inheritance in python is defined as follows:\n\n```python\n\
    class baseclass1:\n    # body of base class\n\nclass derivedclass(basaclass1):\n\
    \    # body of derived class\n```\n\nThe following program shows how the parent\
    \ class along with the derived class will inherit features of the parent class\
    \ and invoke its functions as well.\n\n```python\nclass vehicle:\n    # parent\
    \ class\n    print(\"parent class\")\n    def __init__(self, price):\n       \
    \ self.priced = price\n\n    def display(self):\n        print('priced=', self.price)\n\
    \nclass category(vehicle):\n    # derived class\n    print(\"child/derived class\"\
    )\n    def __init__(self, price, ename):\n        vehicle.__init__(self, price)\n\
    \        self.named = ename\n\n    def named(self):\n        print('vehicle=',\
    \ self.named)\n\nObj = category(2000, \"mercedes\")\nObj.display()\n```\n\nOutput:\n\
    parent class\nchild/derived class\npriced= 2000\n\nTo override a method in the\
    \ derived class, we can define a new method with the same name and parameters.\
    \ The syntax follows:\n\n```python\nclass parent:\n    print(\"parent class\"\
    )\n    def display(self):\n        print(\"this is parent class\")\n\nclass derived(parent):\n\
    \    print(\"child/derived class\")\n    def display(self):\n        print(\"\
    this is derived class\")\n\nObj = derived()\nObj.display()\n```\n\n## File i/o\n\
    \nFile i/o is a specific location on disk which is used to store information and\
    \ data. As stored in hard disk, we can also perform read and write operations\
    \ by implementing python programming methods and techniques. File operation in\
    \ python consists of three major aspects which are opening documents, files, spreadsheets,\
    \ or code. Regular expressions allow programmers to find relevant sequences of\
    \ characters order using specialized syntax. Whenever expressions are written\
    \ in python language, we supposed to use prefix `r` and other special characters.\n\
    \n### Match function\n\nThe `match()` function is used to check whether the given\
    \ expression matches a string in python not. If it does not match, we used `match()`.\n\
    \n### Search function\n\nThis function attempts to search for all possible starting\
    \ points within the string to match any location. It includes the `search()` functions.\n\
    \n### Split function\n\nThe `split()` function can be applied directly on a string\
    \ as `str.split()` accepts a pattern which specifies the delimiter.\n"
