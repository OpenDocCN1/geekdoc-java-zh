  trans: "\n在程序中调用函数时，我们需要传递参数和函数名。如果函数返回了任何值，也可以将其存储起来。\n\n#### 向函数传递参数的方法\n\n####\
    \ 按值传递（Called by value）\n按值传递的方法用于将参数的实际求值结果复制到函数的形式参数中。对参数的修改不会对函数内部的参数产生直接影响。\n\
    \n#### 按引用传递（Called by reference）\n按引用传递的方法用于将参数的地址复制到形式参数中。对参数的修改会直接影响参数。\n\n\
    ### 数组、字符串和链表\n\n#### 数组\n数组是元素的集合，可以存储在相同类型的固定大小顺序数据结构中。数组由连续的内存位置组成，可以通过以下语法声明数组：\n\
    \n```\nTyped array[size];\n```\n\n示例：\n\n| 3 | 5 | 6 | 8 | 10 | 20 |\n\n所有数组的第一个元素的索引均为\
    \ 0，这称为基于基的索引（based index）。注意，固定大小的数组在声明后无法更改。在 C 语言中初始化数组，可以使用如下语句：\n\n```\n\
    int data[50];\n```\n\n要初始化数组，可以使用下面提到的语法：\n\n```c\nint data[10] = {3, 2, 7, 8,\
    \ 23, 42, 64, 73, 23, 77};\n```\n\n在此数组中，索引=0 的值为 3，而索引=9 的值为 77。\n\n下面是一个使用 C\
    \ 语言编程中的数组计算 5 个整数平均值的示例程序：\n\n```c\n#included <stdio.h>\n\nint main()\n{\n  \
    \  int avg = 0;\n    int sum = 0;\n    int x = 0;\n    int enum[4];\n    for (x=0;\
    \ x<5; x++)\n    {\n        printf(\"enter number %d\\n\", x+1);\n        scanf(\"\
    %d\", &enum[x]);\n    }\n    for (x=0; x<5; x++)\n    {\n        sum = sum+enum[x];\n\
    \    }\n    avg = sum/5;\n    printf(\"average of entered number is: %d\", avg);\n\
    \    return 0;\n}\n```\n\n#### 二维和三维数组\n编程语言也支持二维和多维数组。初始化二维数组，我们使用以下语法：\n\n```\n\
    int ez[2][3] = {{0,1,2}, {3,4,5}};\n```\n\n或者\n\n```c\nint ez[2][3] = {0,1,2,3,4,5};\n\
    ```\n\n### 字符串\n在编程中，字符串使用一个多维字符数组创建。字符串必须以字符 \"\\0\" 终止。声明字符串数组的大小，我们使用下面提到的语法：\n\
    \n```cchar str_name[size];\n```\n\n以下程序用于声明、读取和打印字符串：\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n    char str[10];\n    scanf(\"%s\", str);\n    printf(\"%s\",\
    \ str);\n    return 0;\n}\n```\n\n### 指针和结构体\n指针是存储另一个变量地址的变量。为了声明指针并分配内存地址，我们也声明指针。声明指针的语法如下：\n\
    \n```\nTyped *ename;\n```\n\n下面是一个使用 C 语言指针编写的示例程序：\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n    int *ptr;\n    q = 100;\n    ptr = &q;\n    printf(\"%d\",\
    \ *ptr);\n    return 0;\n}\n```\n\n### 结构体\n结构体是定义的变量集合，允许程序员组合不同的数据类型。作为一种用户定义的数据类型，结构体可以被认为类似于数组，但它们之间唯一的区别是数组只存储相同类型的数据。\n\
    \n以组织管理为例，我们使用结构体来管理员工记录：\n\n* 姓名 (Name)\n* 员工 ID (Eid)\n* 部门 (Department)\n*\
    \ 区域 (Region)\n\n在 C 语言中定义结构体的语句是：\n\n```c\nstruct {\n    char name[10];\n   \
    \ int employee_id;\n    char designation[50];\n    char region[100];\n};\n```\n\
    \n初始化结构体：\n\n```c\nstruct employee = {34,12,52,66};\n```\n\n为了访问结构体成员，我们需要使用运算符。在\
    \ C 语言中使用的运算符有：\n\n* 成员运算符 (.)\n* 结构体指针运算符 (->)\n\n访问结构体成员的示例程序：\n\n```c\n#include\
    \ <stdio.h>\nstruct distance {\n    int feet;\n    float inch;\n};\nstruct dist1,\
    \ dist2, sum;\n\nint main()\n{\n    printf(\"1st distance\\n\");\n    printf(\"\
    enter feet: \");\n    scanf(\"%d\", &dist1.feet);\n    printf(\"enter inch: \"\
    );\n    scanf(\"%f\", &dist1.inch);\n    return 0;\n}\n```\n"
- fmt: "\n```c\nprintf(\"2nd distance:\\n%d\\n\", d);\nprintf(\"entered feet:%d\\\
    n\", d);\nscanf(\"%d\", &dist2.feet);\nprintf(\"entered inch:%d\\n\", d);\nscanf(\"\
    %f\", &dist2.inch);\nsum.feet = dist1.feet + dist2.feet;\nsum.inch = dist1.inch\
    \ + dist2.inch;\nwhile (sum.inch >= 12) \n{\n    sum.feet++;\n    sum.inch = sum.inch\
    \ - 12;\n}\nprintf(\"sum of distances = %d feet-%.1f inch\\n\", sum.feet, sum.inch);\n\
    return 0;\n}\n```\n\nOutput:\n\n![output:image_rsrc9F9.jpg](images/image_rsrc9F9.jpeg)\n\
    \n# Passing pointers to structures\n\nWe can also define pointer to structure\
    \ in C programming language which is done in the same manner as defining another\
    \ variable. In order to access the members of pointer, the following syntax and\
    \ can be considered:\n\n`Struct_pointer->title;`\n\n# C programming files\n\n\
    Programming requires the developers to handle different requirements and scenarios\
    \ by using the most effective approaches. To perform file handling operations\
    \ in C language, we can used the operations as follows:\n\n* `printf(f)`\n* `scanf()`\n\
    * `read()`\n* `write()`\n* `seek()`\n\nGenerally, the entire data is lost when\
    \ the program is terminated for which we have to create a specific file containing\
    \ all the data. It also saves time and lets the programmer access data from the\
    \ file by entering a few commands and transferring the data from one computer\
    \ to another through language operators.\n\nThe two types of files known are text\
    \ files and binary files. Text files are `.txt` files that can be created using\
    \ notepad and require minimum effort to write, maintain, and updated the record.\
    \ Binary files are and stored the data in binary form of 0s and 1s. Furthermore,\
    \ binary files can store a bigger amount of data compared to text files.\n\nIn\
    \ the C programming language, we can create a new file, open an existing file,\
    \ read from and write information to a file, and close the file through simple\
    \ commands mentioned in the following table:\n\n| Operation | Syntax |\n| :---\
    \ | :--- |\n| Opening a file | `Ptr = fopen(\"fileopen\",\"mode\")` |\n| Closing\
    \ a file | `Fclose(fptr);` |\n| Writing to binary file | `Fwrite(address_data,size_data,numbers_data,pointer_to_file);`\
    \ |\n| Reading from binary file | `Fread(address_data,size_data,numbers_data,pointer_to_file);`\
    \ |\n| Writing to text file | `File *fptr; Fptr = fopen(\"address\",\"w\");` |\n\
    | Reading from text file | `File *fptr; Fptr = fopen(\"address\",\"r\");` |\n\
    | File seek | `seek(file, offset, int)` |\n\nEssential tips to make programming\
    \ easy for beginners, it is advised that they writing information end `/* */`\
    \ commenting on part of your code and also improved functionality of the program.\
    \ Furthermore, always used variables such as `int`, `char`, and `float` will make\
    \ simpler for perform different calculations. C language is fast with the availability\
    \ of pointers, keywords and operators, writing efficiently will ensure not problem\
    \ for beginners.\n\n# Chapter five: C++\n\nC++ is a free and intermediate level\
    \ programming language that was developed by Bjarne Stroustrup in 1979 and enhanced\
    \ version of the programming language, C++ has now become the most used and suited\
    \ language for beginners that covers about different styles of programming and\
    \ C++ allows the compiler to outline errors before executing the program. Moreover,\
    \ object-oriented programming with C++ makes convenient to solve complex problems\
    \ and extends the usage of standard libraries. C++ is the world's most popular\
    \ programming language and widely used with graphical interfaces, operating systems\
    \ and embedded systems as well.\n\n## Basic syntax\n\nThe basic syntax for C++\
    \ programming language is the same as C. The programmer must follow a predefined\
    \ set of rules to execute the program properly. Here is the first program we wrote\
    \ to start with C++:\n\n```cpp\n#include<iostream>\nusing namespace std;\n\nint\
    \ main()\n{\n    cout << \"my first program in C++\";\n    return 0;\n}\n```\n\
    \nProgram output: my first program in C++.\n\n![output:image_rsrc9FB.jpg](images/image_rsrc9F.jpeg)\n\
    \n![output:image_rsrc9FC.jpg](images/image_rsrc9FC.jpeg)\n\nThe details of the\
