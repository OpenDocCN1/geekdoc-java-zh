    # 标记文本


    写在 `<mark>` 和 `</mark>` 元素之间的文本将以黄色标记显示。


    例如：


    `<p>this text is marked as <mark>yellow</mark></p>`


    输出：this text is marked as yellow.


    # 元数据标签 (Meta tags)


    在 HTML 中，元标签可以用于为网页添加元数据。元标签的属性包括 `name`、`content`、`scheme` 和 `http-equiv`。我们可以使用
    `<meta>` 标签为文档提供简短描述，这还可以提高你网页的搜索引擎索引。


    例如：


    ```html

    <html>


    <head>


    <title>meta tags example</title>


    `<meta name="keywords" content="html, meta tags, metadata"/>`


    `<meta name="description" content="meta tags."/>`


    `<meta name="revised" content="3/7/2019"/>`


    `<meta http-equiv="cookie" content="userid=abc; expires=monday, 08-sep-19 23:59:59
    gmt;"/>`


    </head>


    <body>


    `<p>welcomed to html</p>`


    </body>


    </html>

    ```


    # 注释


    若要在 HTML 代码中放置注释，应遵循以下语法：


    ```html

    <html>


    <head><!-- document header starts --><!--


    <title>document title</title>


    </head><!-- document header ends --><!--


    <body>


    `<p>document content goes here.....</p>


    </body>


    </html>

    ```


    # HTML 样式表


    为了进一步对 HTML 文档进行进一步设计，层叠样式表 (CSS) 被应用于每个网站。它们提供了一种简单、有效且易于维护的替代方案，用于为每个网站指定某些属性。我们将在下一章中详细讨论
    CSS。


    ## 布局与响应式


    HTML 包含了各种类型的语义化元素，用于定义网页的不同部分。这些元素包括 `header`、`container`、`section`、`article`、`aside`、`details`
    和 `footer`。虽然 CSS 是设计网页布局的最佳方法，但也可以通过这些 HTML 元素完成该过程。


    响应式网页设计是通过使用 HTML 和 CSS 创建的。该过程会自动调整网站的大小和布局，使其在桌面电脑、智能手机和平板等所有设备上看起来都非常合适。关于响应式的更多细节，学习
    Bootstrap 将提供极大的优势。


    HTML 模板是开发网站的一种快速方便的方法。使用模板允许开发者修改和添加所需的功能。使用 HTML 模板最大的优势是它们最适合那些不能设计吸引人的网站的人。


    # 使用 HTML 的提示


    即使在我们讨论了 HTML 的所有标签、属性和功能之后，还有其他重要方面可以让你的网站高效高效。在使用起始标签时，务必在编写元素和属性之前编写对应的结束标签。例如，`<p>`
    将确保你的 HTML 页面在所有浏览器上正常工作，并尝试通过 CSS 为页面设置样式。


    在发布到互联网之前，运行 HTML 验证器。此活动将提前发现任何错误或缺失的标签，以免你的网站在发布后无法运行。此外，请注意图像或视频的格式，因为它们在上传到互联网时有时会被破坏。在图像标签中指定宽度和高度可以帮助你解决这个问题。


    虽然表格是页面上布局内容的一种简单方法，但你应该关注 CSS 规则并通过 CSS 构建页面内容。这不仅将更好的方式格式化你的网站，你还可以从 CSS 定位和提高网站的响应式中受益。


    # 第九章：CSS


    ### 什么是 CSS？


    CSS 代表“层叠样式表”（cascading stylesheet），负责控制文档的样式、设计和外观。它允许你使用 CSS 来设置网站的外观，这增加了文档的灵活性。通过使用
    CSS，你可以在不更改 HTML 元素的情况下更改颜色、字体布局。学习 CSS 和 Bootstrap 将提供极大的优势。


