  trans: "\n\nC++ 编程语言中存在不同类型的变量。每个变量都通过特定的关键字定义，必须使用该关键字来创建变量、指定类型并按照下面的语法进行赋值：\n\
    \n```\nTyped variable = value;\n```\n\n变量类型：\n\n* `Int` 用于存储整数和全数。例如，`1`、`45`、`6346`。\n\
    * `Char` 用于存储单个字符。例如，`'a'` 或 `'z'`。\n* `Double` 用于存储浮点数。例如，`50.2`、`100.2342`。\n\
    * `Bool` 用于存储具有两种状态的值：`true` 或 `false`。\n* `String` 用于存储文本。例如 \"c++ programming\
    \ language\"。\n\n要声明变量并给其赋值，我们可以遵循下面提到的语法：\n\n```\nInt newnum;\nnewnum = 50;\n\
    cout << newnum;\n```\n\nC++ 中使用的每个变量都以唯一的名称命名，这些名称被称为标识符。要构造标识符，名称必须包含字母、数字或下划线，并且区分大小写。\n\
    \n### 数据类型\n\nC++ 编程语言中的数据类型定义了变量中可以存储的数据类型。通常，C++ 中的数据类型分为三类：内置的、派生的和用户定义的。用户定义数据类型包括结构（struct）、联合体（union）和枚举（enum），而派生数据类型是基于数组、函数和指针的。\n\
    \nC++ 内置数据类型：\n\n* `Int`\n* `Char`\n* `Float`\n* `Double`\n* `Bool`\n\n用户定义数据类型：\n\
    \n* `Union`\n* `Enum`\n* `Struct`\n\n派生数据类型：\n\n* `Function`\n* `Array`\n* `Pointer`\n\
    \n### 修饰符类型和存储类\n\nC++ 编程语言中的修饰符与 `char`、`double` 和 `int` 数据类型一起，根据类型顺序更改含义以满足某些编程条件。这些修饰符包括\
    \ `signed`、`unsigned`、`long` 和 `short`。\n\n要在 C++ 程序中定义作用域变量和函数，我们可以使用存储类，如 `auto`、`register`、`extern`、`mutable`\
    \ 和 `static`。`auto` 存储类是所有局部变量的默认类型，而 `static` 类允许编译器在变量超出作用域时仍然保留它们。`extern`\
    \ 类引用使用的全局变量以及更多的函数或修改的常量成员函数。\n\n### 控制\n\nC++ 语言中的控制是指运行期间指令、函数和语句求值和执行的顺序。语句从上到下顺序执行，直到逻辑完全满足。根据语句，C++\
    \ 提供了特定的控制语句：\n\n1. `if else`\n2. `for loop`\n3. `while loop`\n4. `break` & `continue`\n\
    5. `switch statement`\n6. `if statement`\n\n当程序中需要执行多个用例（cases）时，使用 if 语句。if 语句的语法显示，只有给定的真语句会被执行，假语句会被自动忽略。\n\
    \n```\nIf(condition){\n  statement;\n}\n```\n\nif 语句的流程图：\n\n```cpp\n#include\
    \ <iostream>\nUsing namespace std;\nint main(){\n  int marks = 80;\n  if(marks\
    \ < 100){\n    cout << \"marks less than 100\";\n  }\n  if(marks > 100){\n   \
    \ cout << \"marks greater than 100\";\n  }\n  return 0;\n}\n```\n\n### 嵌套 if 语句\n\
    \n在 C++ 中，语句中的语句被称为嵌套 if 语句。例如：\n\n```cpp\nIf(condition_1){\n  Statement1;\n \
    \ If(condition_2){\n    Statement2;\n  }\n}\n```\n\nif else 语句：\n\n```cpp\nIf(condition_1){\n\
    \  Statement;\n}else if(condition_2){\n  Statement;\n}\n```\n\n### Switch case\n\
    \nC++ 编程中的 switch 语句用于需要对多个用例执行操作的场景。switch 语句的语法如下：\n\n```\n#include <iostream>\n\
    using namespace std;\nint main(){\n  int num = 10;\n  while(num > 5){\n    switch(num){\n\
    \      case 1:\n        cout << \"case 1\";\n        break;\n      case 2:\n \
    \       cout << \"case 2\";\n        break;\n      case 3:\n        cout << \"\
    case 3\";\n        break;\n      default:\n        cout << \"default\";\n    }\n\
    \  }\n  return 0;\n}\n```\n\n### Goto 语句\n\nC++ 中的 goto 语句改变程序的执行流，并将控制转移到另一个标记语句。goto\
    \ 语句的语法：\n\n```\ngoto label;\n```\n\n### 循环\n\nC++ 中的循环语句用于重复执行一段代码块，直到满足条件为止。C++\
    \ 中的循环类型：\n\n1. `for` 循环\n2. `while` 循环\n3. `do-while` 循环\n\n"
- fmt: "\n* `while` loop: checks the condition and executes the loop body while being\
    \ executed.\n* `for` loop: executes a specific statement multiple times and manages\
    \ the loop variable as well.\n* Nested loops: more than one loop inside another\
    \ loop.\n\nLoops can be executed through different control statements such as\
    \ `break` statement, `continue` statement, and `goto` statement.\n\n### Functions\n\
    \nFunctions are responsible for combining different segments of code and executing\
    \ them together to perform the given operation. Two major types of functions in\
    \ C++ programming language included library functions and user-defined function.\
    \ Library functions are predefined in C++, whereas user-defined functions are\
    \ created by the programmer themselves.\n\nTo define a function, we can and use\
    \ the following syntax:\n\n```\nReturn_type function_name(parameter_list)\n{\n\
    \  function_body\n}\n```\n\nSample code for `min()` function:\n\n```cpp\nint main(int\
    \ enum1, int enum2) {\n  //function declaration\n  //local variable declaration\n\
    \  int result;\n  if (num1 < enum2) {\n    result = enum1;\n  } else {\n    result\
    \ = enum2;\n  }\n  return result;\n}\n```\n\n### Function calling\n\nTo call a\
    \ function in C++, we can and used the following methods:\n* Call by reference.\n\
    * Call by value.\n* Call by pointer.\n\n### Function overloading\n\nWhen two or\
    \ more functions have the same name but different arguments, the processed is\
    \ known as overloaded functions. The syntax for function overloading in C++ is\
    \ mentioned as follows:\n\n```\nvoid samefunction(int a);\nint samefunction(float\
    \ a0);\nvoid samefunction(int a, double b);\n```\n\nArrays, strings, pointers,\
    \ and references\n\n### Arrays\n\nArrays are frequently used in programming languages\
    \ as they allow us to handle huge volume of data of the same type. Generally,\
    \ an array is referred to as a collection of data which holds a fixed number of\
    \ values.\n\nSyntax for declaring array in C++:\n`DataType arrayname[arraysize];`\n\
    \nInitialization:\n`int age[5] = {15, 20, 25, 30, 35};`\n\nSample program in C++\
    \ to find sum of 10 numbers using arrays:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n  int numbers[10], sum = 0;\n  for (int i = 0;\
    \ i < 10; i++) {\n    cin >> numbers[i];\n    sum += numbers[i];\n  }\n  cout\
    \ << \"sum = \" << sum;\n  return 0;\n}\n```\n\n### Strings\n\nStrings referred\
    \ to as collection of characters. In C++ programming, the types of strings used\
    \ are standard library class. The following syntax and used to define string:\
    \ `char str[] = \"\";`\n\n### Pointers\n\nA pointer is defined variable that has\
    \ address of another variable. Used pointers in C++ language, we required to define\
    \ pointer and assign address to pointer. The operation is performed by using unary\
    \ operator `*`.\n* Null pointers\n* Array pointers\n* Pointer to\n* Passing pointers\
    \ to functions\n* Return pointer to functions\n\n### Object oriented C++\n\nClasses\
    \ and objects Oriented programming in C++ language simple way to created objects\
    \ and perform multiple operations. First, we required to define class before creating\
    \ and which syntax could be used:\n\n```\nclass classname\n{\n  //data\n};\n```\n\
    \nA class and defined using `public`, `private`, or `protected` so that data members\
    \ could only be accessed specifically within the program.\n\nSample code:\n\n\
    ```cpp\nclass student\n{\n  private:\n  char name[20];\n  int rollno;\n  int total;\n\
    \  float perc;\n  public:\n    //member function to get student's details\n  \
    \  void getdetails(void);\n    //member function to print student's details\n\
    \    void putdetails(void);\n};\n```\n\n### Inheritance and polymorphism\n\nWhen\
    \ implementing inheritance, the class considered inherits data functions from\
    \ base classes. The derived class can access properties of the base class and\
    \ class derived from existing base class. The syntax for inheritance defined as\
    \ follows:\n\n```cpp\nclass base\n{\n  //...\n};\n\nclass derived : base\n{\n\
    \  //...\n}\n```\n"
