  trans: "\n\n# 类 (Class)\n\n类是创建对象的蓝图。类定义了对象的类型，也被称为类的定义和实例化，并可以使用以下语法创建：\n\n```\n\
    Student object1 = new Student();\n```\n\n一旦实例化创建了类，对象会被自动返回。例如：\n\n```\nStudent\
    \ object2 = new Student();\nStudent object3 = object2;\n```\n\n以下程序展示了如何在 C# 编程语言中创建对象：\n\
    \n1. 使用 `system;`\n2. 命名空间 `User`\n3. `{`\n4. 类 `Program`\n5. `{`\n6. `static\
    \ void main(string[] args)`\n7. `{`\n8. `User user = new User(\"harry potter\"\
    );`\n9. `User.userdetails();`\n10. `Console.WriteLine(\"pressed exit..\");`\n\
    11. `Console.WriteLine();`\n12. `}`\n13. `}`\n14. `Public class users`\n15. `{`\n\
    16. `public string name { get; set; }`\n17. `public int users(string name, int\
    \ age)`\n18. `{`\n19. `Named = name;`\n20. `aged = age;`\n21. `}`\n22. `public\
    \ void getdetails()`\n23. `{`\n24. `Console.WriteLine(\"name:{0}, age:{1}\", name,\
