  trans: "\n\n# 创建名为 \"newobj\" 的对象：\n\n```java\npublic class newclass {\n\n    int\
    \ a = 1;\n\n    public static void main(String[] args) {\n        myclass newobj\
    \ = new newclass();\n        System.out.println(newobj.xd);\n    }\n}\n```\n\n\
    创建一个对象需要声明、实例化和初始化。声明是在某处声明一个带有名称和对象类型的变量的过程，而实例化是使用 `new` 关键字来创建对象。随后通过调用构造函数继续程序，以便对创建的\
    \ `new` 对象进行初始化。\n\n## 基本数据类型和变量\n\n在 Java 程序中，数据存储在变量中，程序首先声明变量，将数据读取到变量中，然后执行提供的操作。一旦完成处理，变量将再次写入新位置。提供的变量是用于存储值的预留内存位置，内存由操作系统分配。\n\
    \n### 数据类型\n\nJava 编程语言中有两种不同的数据类型，称为基本数据类型和对象数据类型。基本数据类型被分为 8 类：`byte`、`short`、`int`、`long`、`float`、`double`、`boolean`\
    \ 和 `char`。对象数据类型使用类的构造函数创建，并且也负责访问对象。每个可用引用变量的默认值被设置为 `null`，并且也可以用于指向已声明类型的对象。\n\
    \n## 变量\n\nJava 编程语言中使用了三种类型的变量：\n\n1. 局部变量\n2. 实例变量\n3. 类/静态变量\n\n### 局部变量\n\n\
    局部变量通常声明在构造函数和方法中。由于它们是随构造函数创建的，因此不能配合局部变量使用访问修饰符。局部变量没有默认值。\n\n### 实例变量\n\n实例变量声明在类内部，并在创建对象时创建。它们应该持有构造函数或方法引用的实例变量的值。\n\
    \n## 运算符与决策\n\n编程语言中提供的基本运算符说明如下：\n\n* 算术运算符：用于在程序内执行数学计算和评估的算术运算符。包括加、减、乘、除、模以及递增递减函数。\n\
    * 一元运算符：后置 `++` 和前置 `++` 表达式。\n* 逻辑运算符：`&&` 表示假，`||` 表示真，`!` 表示真。\n* 位运算符：执行按位操作。\n\
    * 赋值：`=`、`+=`、`|=`、`^=`\n\n## 控制语句\n\n控制语句类似于 C++ 等其他编程语言。`ifelse:` 语句中提到的条件用于检查给定条件为真为假。编程语言中有不同类型的\
    \ if ，称为 `if` 语句、`if-else` 语句、`if-else-if` 阶和嵌套 `if` 语句。\n\n这是一个演示 if 语句的简单程序：\n\
    \n```java\npublic class marks {\n    public static void main(String[] args) {\n\
    \        int marks=50;\n        if (marks<50){\n            System.out.println(\"\
    your marks lessthand50\");\n        }\n    }\n}\n```\n\n上述程序的输出为：`your marks lessthand50`。\n\
    \n### If-else\n\nif-else 语句用于测试条件，如果结果为真，则执行 `if` 块；如果为假，则执行 `else` 语句。\n\n###\
    \ Switch\n\nswitch 语句用于从多个条件中执行单个语句。该语句可以处理包括 `short`、`int`、`long`、`byte`、`string`\
    \ 和 `long` 在内的数据类型。\n\nswitch 语句的语法如下：\n\n* Switch(expression){\n* Case value1:\
    \ `break;`\n* Case value2: `break;`\n* Default: \n* }\n\n## 循环\n\n编程语言中通使用了三种循环：\n\
    \n* For 循环\n* While 循环\n* Do-while 循环\n\n### For 循环\n\nfor 循环用于执行程序的迭代部分。如果迭代次数固定，使用\
    \ for 循环。\n\n### While 循环\n\nwhile 循环具有重复一组语句的特性，以测试给定条件是否成立。如果迭代次数固定，请使用 while\
    \ 循环。\n\n### Do-while 循环\n\ndo-while 循环用于多次迭代程序的部分。如果迭代次数固定，它至少执行一次。\n\n有特定的循环控制语句可以将执行改为普通序列。Java\
    \ 语言中的循环控制语句包括：\n\n* `break`：终止 switch 或循环并开始下一次迭代。\n* `continue`：允许程序跳过当前循环体的剩余部分。\n\
    \n"
- fmt: "\nThe decision-making structure features one or more conditions that need\
    \ to be tested under a given scenario. If the condition is true, the next statement\
    \ can be executed whereas the program would terminate if the given condition is\
    \ false. The diagram below correctly shows how the decision-making process actually\
    \ works:\n\n### Characters, strings, arrays, and regular expressions\n\nJava programming\
    \ language makes use of `Character` wrapper class and offers multiple static methods\
    \ for manipulating characters. To create a `Character` object, you need to follow\
    \ the syntax as follows:\n\n```\nCharacter ch = new Character('a');\n```\n\nThe\
    \ compiler will automatically create a `Character` object if you pass any primitive\
    \ char into the method, the compiler will convert the `char` into `Character`\
    \ by using various approaches from the language.\n\nAs we have discussed the importance\
    \ and functionality of `strings` before, Java platform also provides support from\
    \ `String` class. Programmers can manipulate strings in multiple ways. Sample\
    \ code for creating a `string` in Java language is as follows:\n\n```java\npublic\
    \ class NewString {\n\n    public static void main(String args[]) {\n        char[]\
    \ studentArray = {'s', 't', 'u', 'd', 'e', 'n', 't'};\n        String studentString\
    \ = new String(studentArray);\n        System.out.println(studentString);\n  \
    \  }\n\n}\n```\n\nThe output for this program is: student.\n\nMoreover, we can\
    \ also concatenate strings by using simple concatenation approach in Java programming\
    \ language as follows:\n\n```java\nString1.concat(string2);\n```\n\nTo create\
    \ a `string` object in Java programmers can choose either the literal keyword\
    \ approach.\n\n### Arrays\n\nArrays are a vital part of every programming language\
    \ as they allow programmers to handle and store data into variables. They are\
    \ used to store larger collection of data, you can also consider an array as a\
    \ collection of variables of the same category. To declare an array, you can follow\
    \ the simple syntax briefed below:\n\n```\ndatatype[] arrayRefVar;\n```\n\nCreating\
    \ and array in Java is simple for which you used the following syntax:\n\n```java\n\
    arrayRefVar = new datatype[size];\n```\n\nThis statement will create an array\
    \ sized and referenced as well. Usually, arrays are processed by using a loop\
    \ or for each loop to access the elements. Static methods for sorting, searching,\
    \ and filling array:\n\n* `public static int binarySearch(Object a, Object key)`\n\
    * `public static void fill(int[] a, int val)`\n* `public static boolean equals(long[]\
    \ a, long[] b)`\n* `public static void sort(Object a)`\n\n### Regular expressions\n\
    \nRegular expressions are used to define patterns and also used for searching,\
    \ editing, and manipulating text. Java has defined `java.util.regex` package that\
    \ consists of `Pattern` class, `Matcher` class, and `PatternException` object.\
    \ The `Pattern` class requires developers to start with the `compile()` methods\
    \ and return a `Pattern` object it provides no constructors. For the `Matcher`\
    \ class, the object finds and compares operations against standard input string\
    \ order to obtain object through the `matcher()` method. `PatternException` is\
    \ used to indicate error or mistake in regular expression pattern.\n\n### Files\
    \ and I/O\n\nJava programming language has built-in package responsible for input\
    \ and output operations. Stream known as `java.io` and supports multiple operations\
    \ and functionality to handle data. There are general types of streams in Java\
    \ which known as `InputStream` and `OutputStream`. InputStream is used for reading\
    \ data in a file.\n\nJava language features various I/O data handling streams\
    \ that included the following:\n\n* Byteed streams\n* Character streams\n* Standard\
    \ streams\n* File input stream\n* File output stream\n\n### Object oriented Java\n\
    \nObject-oriented programming is an approach that includes the use of classes\
    \ and objects. By using multiple concepts such as inheritance, polymorphism, encapsulation,\
    \ and abstraction, programmers can develop applications.\n\n### Inheritance\n\n\
    Inheritance used in Java language allows classes to inherit features from another\
    \ class. The class that inherits is the superclass and the class that inherited\
    \ is the subclass. To use inheritance in Java, follow the syntax mentioned below:\n\
    \n```java\nclass derivedClass extends baseClass {\n    // methods\n}\n```\n"
