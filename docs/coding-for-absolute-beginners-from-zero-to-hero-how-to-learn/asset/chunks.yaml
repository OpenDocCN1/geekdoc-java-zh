  trans: "\n\n创建图像边框的属性是 `border`。例如：\n\n<img src=\"desktop/images/image1.png\" alt=\"\
    sampled image\" border=\"4\"/>\n\n# 框架 (Frames)\n\nHTML 超文本语言框架用于在浏览器窗口中创建多个区域，以便每个区域都可以加载唯一的\
    \ HTML 文档。在页面中使用框架时，应该使用 `<frameset>` 标签代替 `<body>` 标签，可以使用特定的行（rows）和列（columns）属性进行定义。\n\
    \n创建框架的 HTML 标签示例：\n\n```html\n<html>\n<head>\n  <title>html frames</title>\n\
    </head>\n<frameset rows=\"10%,80%,10%\">\n  <framed name=\"top\" src=\"/html/top_frame.htm\"\
    />\n  <framed name=\"main\" src=\"/html/main_frame.htm\"/>\n  <framed name=\"\
    bottom\" src=\"/html/bottom_frame.htm\"/>\n  <noframes>\n    <body>your browser\
    \ does not support frames.</body>\n  </noframes>\n</frameset>\n</html>\n```\n\n\
    # 内联框架 (Iframe)\n\n为了创建一个嵌套的浏览上下文，可以使用 `<<iframe>>` 标签将新的 HTML 文档添加到现有的文档中。要创建一个\
    \ iframe，可以结合 `<<iframe>>` 标签实现以下语法：\n\n```html\n<iframe src=\"https://www.samplewebsite.com\"\
    ></iframe>\n```\n\n基础 HTML 标签完整表格：\n\n| <a> | <abbr> | <acronym> | <address> |\
    \ <applet> |\n| <area> | <article> | <aside> | <audio> | <b> |\n| <base> | <basefont>\
    \ | <bdi> | <bdo> | <big> |\n| <blockquote> | <body> | <br> | <button> | <canvas>\
    \ |\n| <caption> | <center> | <cite> | <code> | <col> |\n| <colgroup> | <data>\
    \ | <datalist> | <dd> | |\n| <del> | | | | | |\n| <details> | <dfn> | <dialog>\
    \ | <dir> | <div> |\n| <dl> | <dt> | <em> | <embed> | <fieldset> |\n| <figcaption>\
    \ | <figure> | <font> | <footer> | <form> |\n| <frame> | <frameset> | <h1>-<h6>\
    \ | <head> | <header> |\n| <hr> | <html> | <i> | <iframe> | <img> |\n| <input>\
    \ | <ins> | <kbd> | <label> | <legend> |\n| <li> | <link> | <main> | <map> | <mark>\
    \ |\n| <meta> | <meter> | <nav> | <noframes> | <noscript> |\n| <object> | <ol>\
    \ | <optgroup> | <option> | <output> |\n| <p> | <param> | <picture> | <pre> |\
    \ <progress> |\n| <q> | <rp> | <rt> | <ruby> | <s> |\n| <samp> | <script> | <section>\
    \ | <select> | <small> |\n| <source> | <span> | | <strong> | <style> |\n| <sub>\
    \ | <summary> | <sup> | <svg> | <table> |\n| <tbody> | <td> | <template> | <textarea>\
    \ | <tfoot> |\n| <th> | <thead> | <time> | <title> | <tr> |\n| <track> | <tt>\
    \ | <u> | <ul> | <var> |\n| <video> | <wbr> | | |\n\n# 表单 (Forms)\n\nHTML 表单在用户编辑时具有交互性。表单通过此类字段、按钮、选择框和可点击控件创建。通过表单收集的数据将发送到服务器进行处理。创建表单的语法\
    \ `action` 和 `method` 描述数据发送的位置：\n\n```html\n<form action=\"url\" method=\"get|post\"\
    >\n  input, buttons, etc.\n</form>\n```\n\n从用户获取输入的表单：\n\n```html\n<html>\n<head>\n\
    \  <title>my first form</title>\n</head>\n<body>\n  <form>\n    <label for=\"\
    course\">course:</label>\n    <input type=\"text\" name=\"course\">\n    <br>\n\
    \    course: <input type=\"text\" name=\"last\">\n  </form>\n</body>\n</html>\n\
    ```\n\n输出：![image_rsrc9FM.jpg](img/image_rsrc9FM.jpeg)\n\n# 文本字段 (Text fields)\n\
    \nHTML 中的文本字段允许用户向表单输入文本。创建文本字段的标准语法定义如下：\n\n```html\n<input type=\"text\">\n\
    <input type=\"text\">\n```\n\n# 按钮控件 (Button controls)\n\n在表单中有多种提交数据的方法。你可以通过以下\
    \ HTML 标签添加可点击按钮：\n\n```html\n<input type=\"submit\" name=\"submit\">\n<input\
    \ type=\"reset\" name=\"reset\">\n<input type=\"button\" name=\"button\">\n```\n\
    \n输出：![image_rsrc9FN.jpg](img/image_rsrc9FN.jpeg)\n\n# 选择框 (Select box)\n\n要在\
    \ HTML 表单中创建下拉列表，使用 `<select>` 和 `<option>` 元素。例如：\n\n```html\n<html>\n<head>\n\
    \  <title>field upload</title>\n</head>\n<body>\n  <form>\n    <label for=\"course\"\
    >course:</label>\n    <select name=\"course\" id=\"course\">\n      <option value=\"\
    web engineering\">web engineering</option>\n      <option value=\"calculus\">calculus</option>\n\
    \      <option value=\"data science\">data science</option>\n    </select>\n \
    \ </form>\n</body>\n</html>\n```\n\n输出：![image_rsrc9FP.jpg](img/image_rsrc9FP.jpeg)\n\
    \n# 选择框 (Select box)\n\nselect 元素允许在表单排列多个选项。例如：\n\n```html\n<html>\n<head>\n\
    \  <title>course</title>\n</head>\n<body>\n  <form>\n    <select name=\"course\"\
    >\n      <option value=\"math\">math</option>\n      <option value=\"physics\"\
    >physics</option>\n    </select>\n  </form>\n</body>\n</html>\n```\n\n输出：![image_rsrc9FR.jpg](img/image_rsrc9FR.jpeg)\n\
    \n# 设计 (Designing)\n\nHTML 的背景颜色默认为白色。要更改背景颜色，可以使用以下标签：\n\n```html\n<table bgcolor=\"\
    green\">\n<table bgcolor=\"#f1f1f1\">\n```\n\n# 字体 (Fonts)\n\n字体是内容可读性的重要部分。可以使用包含在\
    \ `<font>` 标签中的字体大小、颜色。设置字体大小的标签为：\n\n```html\n<font size=\"14\"></font>\n```\n\
    \n更改字体的属性为：\n\n```html\n<font face=\"times new roman\" size=\"14\"></font>\n```\n\
    \n# 字体颜色 (Font color)\n\n要更改字体颜色，使用以下标签和属性：\n\n```html\n<font color=\"blue\">this\
    \ text</font>\n```\n\n输出：此文本是蓝色的\n\n"
