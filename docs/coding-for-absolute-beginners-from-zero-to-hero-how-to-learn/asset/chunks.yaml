  trans: "\n\n```python\n>>> f = open(\"sample.txt\", 'r')\n>>> f.read(4)\n'This'\n\
    >>> f.read(4)\n'D eis'\n>>> f.read()\n'My first file\\nthis file\\ncontains four\
    \ lines\\n'\n>>> f.read()\n```\n\n### 打开文件\n要使用 `open()` 函数打开文件，可以使用以下语法：\n\n\
    ```python\nf = open(\"samplefile.txt\", \"r\")\nprint(f.read())\n```\n\n对于读取特定行，我们可以实现\
    \ `readline()` 函数：\n\n```python\nf = open(\"samplefile.txt\", \"r\")\nprint(f.readline())\n\
    ```\n\n### 写入现有文件\n以下 Python 编程语法将打开示例文件并追加内容：\n\n```python\nf = open(\"samplefile.txt\"\
    , \"a\")\nf.write(\"updated your content\")\nf.close()\n```\n\n# 添加后重新打开并读取文件：\n\
    \n```python\nf = open(\"samplefile.txt\", \"r\")\nprint(f.read())\n```\n\n###\
    \ 创建文件\n要创建一个新文件，将使用 `open()` 方法，它可以带有创建、追加或写入参数。在 Python 中创建文件的语法如下：\n\n```python\n\
    f = open(\"newfile.txt\", \"w\")\n```\n\n### 删除文件\n要删除现有文件，应使用 `os.remove()` 函数并采用以下语法：\n\
    \n```python\nimport os\nos.remove(\"samplefile.txt\")\n```\n\n检查文件是否存在的语法：\n\n\
    ```python\nimport os\nif os.path.exists(\"samplefile.txt\"):\n    os.remove(\"\
    samplefile.txt\")\nelse:\n    print(\"the file does not exist\")\n```\n\n## Advanced\
    \ Python\n\n### 异常处理\n编程语言中处理异常的三方法是 `try`、`except` 和 `finally` 块，用于处理程序执行过程中发生的错误。\n\
    \n#### Try\n要通过 `try` 块产生异常，可以以下语法：\n\n```python\ntry:\n    print(x)\nexcept:\n\
    \    print(\"and exception occurred\")\n```\n\n如果没有抛出错误，示例代码如下：\n\n```python\n\
    try:\n    print(\"python\")\nexcept:\n    print(\"and exception occurred\")\n\
    else:\n    print(\"no exception occurred\")\n```\n\n#### Finally\n在异常处理中，即使 `try`\
    \ 块已经抛出异常，`finally` 块也会执行。例如：\n\n```python\ntry:\n    print(\"python\")\nexcept:\n\
    \    print(\"and exception occurred\")\nfinally:\n    print(\"try exception finished\"\
    )\n```\n\n### 自定义异常\n虽然编程语言中有内置异常可以在发生出错时强制执行处理，但开发者也创建了自定义异常以满足他们的需求。新异常是通过 `class`\
    \ 创建的。\n\n### 学习 Python 的提示\nPython 编程语言适用于对人工智能、机器学习、机器人学和开发感兴趣的程序员。学习编程本身是强制性的，你需要学习基础\
    \ Python 语法。学习方法、途径和语法将使初学者能够开始编码并开发任何类型的应用程序。对于初学者来说，进行小型练习非常有益。它们能培养解决问题的能力并利用他们的编程概念。我写写了一本关于\
    \ Python 的电子书。[Python 初学者入门](https://www.amazon.com/dp/B08DBXX7) [初学者的 Python](https://www.amazon.com/dp/B08DBXX7)\
    \ [Python](https://www.amazon.com/dp/B08DBXX7) [Python](https://www.amazon.com/dp/B08DBXX7)\
    \ [Python](https://www.amazon.com/dp/B08DBXX7) 将帮助你建立坚实的 Python 编程基础。\n\n## 第八章：HTML\n\
    \n### 介绍与概述\n超文本标记语言（HTML）是用于创建网站以显示颜色、字体、图片、媒体和图像的标准标记语言。HTML 由不同的标签组成，这些标签可以描述网页的结构并告诉浏览器在互联网上显示内容。\n\
    \n#### 什么是标签？\n标签向浏览器提供有关任何网页结构、显示和内容的指令。由于它们通过闭合括号 `<>` 定义，因此标签由属性和元素组成。元素是页面上的对象，而属性描述了该对象的细节。记住，标签有开始标签和结束标签，通过\
    \ `</tag>` 进行区分。\n\n使用标签创建的第一个 HTML 页面：\n\n```html\n<html>\n<head>\n<body>\n<h1>my\
    \ heading</h1>\n<p>my paragraph</p>\n</body>\n</html>\n```\n\n### 标签说明\n在上述编写的\
    \ HTML 文档中，`<html>` 标签封装了整个 HTML 文档，并由其他标签 `<head>`、`<body>` 和 `<p>` 组成。`<head>`\
    \ 标签代表文件的头部，`<title>` 标签用于显示文档标题。`<body>` 包含了用于创建网页的其他标签，例如标题 `<h1>` 和段落 `<p>`。\n\
    \n"
- fmt: "\nEach `html` `document` is supposed to start with a `title`, `heading` and\
    \ `paragraph` after the `<body>` tag, the next major `tag` to be used is `<h1>`\
    \ ord `heading` tag. Depending on your content requirements, `heading` tags are\
    \ defined with `<h1>` to `<h6>`. For example:\n\n### Headings:\n\n```html\n<html>\n\
    <body>\n<h1>first heading</h1>\n<h2>second heading</h2>\n<h3>third heading</h3>\n\
    <h4>fourth heading</h4>\n<h5>fifth heading</h5>\n<h6>sixth heading</h6>\n</body>\n\
    </html>\n```\n\nOutput:\n![image_rsrc9FJ.jpg](images/image_rsrc9FJ.jpeg) De\n\n\
    ### Paragraph\n\nFor adding content, we needed to include paragraphs in the `html`\
    \ `document`. For example:\n\n```html\n<html>\n<head>\n<h1>heading</h1>\n</head>\n\
    <body>\n<p>first paragraph</p>\n<p>second paragraph</p>\n</body>\n</html>\n```\n\
    \nOutput:\nHeading\nFirst paragraph\nSecond paragraph\n\nTo add a break between\
    \ each paragraph, we can used the line break tag `<br>`.\n\n### Summary tag\n\n\
    To add a summary for the paragraph, `html` syntax with `summary` tag is defined\
    \ as follows:\n\n```html\n<details>\n<summary>sampled text</summary>\n<p>development\
    \ tutorials</p>\n</details>\n```\n\n### Span\n\nThe `<span>` tag is used to color\
    \ specific part of the text. For example:\n\n```html\n<p>development <span style=\"\
    color:red\">interesting</span> learned</p>\n```\n\n### Select\n\nThe `<select>`\
    \ tag is used for selecting one option from a dropdown list. For example:\n\n\
    ```html\n<select>\n<option value=\"red\">red</option>\n<option value=\"blue\"\
    >blue</option>\n<option value=\"green\">green</option>\n<option value=\"white\"\
    >white</option>\n</select>\n```\n\n### The\n\nThe `<thead>` tag is used to create\
    \ a group header content and used along with `<tbody>` and `<footer>` elements.\
    \ For example:\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>course</th>\n\
    \      <th>max marks</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>engineering</td>\n\
    \      <td>85</td>\n    </tr>\n    <tr>\n      <td>english</td>\n      <td>90</td>\n\
    \    </tr>\n  </tbody>\n  <footer>\n    <tr>\n      <td>um</td>\n      <td>80</td>\n\
    \    </tr>\n  </footer>\n</table>\n```\n![image_src9FK.jpg](images/image_src9FK.jpeg)\n\
    \n### Formatting tags\n\nText within html document and be formatted to different\
    \ styles, fonts and sizes. Tags used to format headings, paragraphs, and tables\
    \ follows:\n\n#### Bold\n\nAny text written between `<b>` tags displayed bold\
    \ style. For example:\n\n```html\n<p><b>development</b></p>\n```\nOutput: development\n\
    \n#### Italic\n\nAny text written between `<i>` tags displayed italic style. For\
    \ example:\n\n```html\n<p><i>development</i></p>\n```\nOutput: development\n\n\
    #### Superscript/subscript\n\nTo display content in superscript, we used `<sup>`\
    \ tags and `<sub>` for subscripts. For example:\n\n```html\n<p>this text used<sup>superscript</sup></p>\n\
    ```\nOutput: this text used (superscript)\n\n#### Underline:\n\nText written between\
    \ `<u>` and `<u>` tag is underlined\n\n```html\n<p><u>sampled text</u></p>\n```\n\
    Output: sampled text\n\n#### Insert and deleted tags\n\nTo insert, `<ins>` and\
    \ `</ins>` tags used, to delete any text, we used `<del>` and `</del>` tags.\n\
    \n`<ins>inserted</ins><del>deleted</del>`\n\n### Link\n\nTo add link within the\
    \ text, we used the following tag:\n\n```html\n<p><a href=\"document location\"\
    >document</a></p>\n```\n\n### Marquee tag\n\n`<marquee>` can be used with different\
    \ attributes including `width`, `height`, `direction`, `behavior`, `scrollamount`,\
    \ `scrolldelay`, `loop`, `bgcolor`, `hspace`, and `vspace`. Demonstration of marquee\
    \ tag:\n\n```html\n<html>\n<head>\n<title>html marquee tag</title>\n</head>\n\
    <body>\n<marquee>sampled text</marquee>\n</body>\n</html>\n```\n\n### Container\
    \ tags\n\nIn html, the following container tags are used to format the text:\n\
    \n| Opening tag | Closing tag | Functionality |\n| :--- | :--- | :--- |\n| `<p>`\
    \ | `</p>` | Paragraph |\n| `<span>` | `</span>` | To add inline content within\
    \ a paragraph |\n| `<em>` | `</em>` | Used to give text emphasis |\n| `<ol>` |\
    \ `</ol>` | Ordered list (numbers) |\n| `<ul>` | `</ul>` | Unordered list (bullets)\
    \ |\n| `<li>` | `</li>` | List item |\n\n### Tables\n\nTables, images and frames\
    \ are used to format information in html manner. To create tables, we used the\
    \ following tag:\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>header</th>\n\
    \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>cell</td>\n    </tr>\n\
    \  </tbody>\n</table>\n```\n\n### Images\n\nImages are essential part of any website.\
    \ Images used to help inserted images in html. For inserting image:\n\n```html\n\
    <img src=\"image_url\" />\n<img src=\"desktop/image1.png\" alt=\"sampled text\"\
    \ />\n```\n\nTo set specific height and width of image, we used:\n\n```html\n\
    <img src=\"desktop/image1.png\" alt=\"sampled text\" width=\"100\" height=\"100\"\
    \ />\n```\n\n### Videos\n\nTo add videos in html page, we used the following tag:\n\
    \n```html\n<video>\n  <source src=\"samplevideo.mp4\" type=\"video/mp4\">\n</video>\n\
    ```\n\n### Alignment and border\n\nThere are three positions to align images on\
    \ a webpage known as center, right, and left. For this, we used the `align` attribute.\
    \ For example:\n\n```html\n<img src=\"desktop/image1.png\" alt=\"sampled text\"\
    \ align=\"center\"/>\n```\n"
