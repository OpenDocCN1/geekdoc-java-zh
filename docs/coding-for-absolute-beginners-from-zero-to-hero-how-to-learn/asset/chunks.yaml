  trans: "\n\n```c\nint main() {\n    printf(\"%d\", a);\n    return 0;\n}\n```\n\n\
    # 头文件\n\n编写程序的第一部分是选择头文件。通常，头文件的扩展名为 `.h`，并且包含函数声明。要包含一个头文件，我们使用 `#include` 指令，后面紧跟头文件名称，语法如下：\n\
    \n```c\n#include <string.h> own\n```\n\n每个头文件的示例：\n\n| 头文件 | 定义 |\n| :--- | :---\
    \ |\n| Stdio.h | 用于定义输入输出函数 |\n| String.h | 用于字符串处理 |\n| Stddef.h | 定义有用的类型和宏\
    \ |\n| Stdlib.h | 定义内存分配 |\n| Stdint.h | 用于定义整数类型 |\n| Math.h | 用于执行数学函数 |\n\n\
    # 方法和变量声明\n\n编写程序的后续部分是定义每个方法并声明变量。`main` 方法的声明语法如下：\n\n```c\nInt main()\n{\n\
    \    // 变量声明的语法为：\n\n    Int main()\n    {\n\n        Int z;\n    }\n}\n```\n\n\
    程序体：\n\n```c\nInt main()\n{\n    int ez;\n    printf(\"%d\", ez);\n    return\
    \ 0;\n}\n```\n\n要终止程序，我们可以使用 `return` 语句：`return 0`。\n\n# 关键字\n\n关键字是任何编程语言的强制性部分，也被称为保留字。虽然高级编程语言有许多关键字，但\
    \ C 语言只允许使用 32 个关键字，如下：\n\n| Double | Long | Int | Switch |\n| :--- | :--- | :---\
    \ | :--- |\n| Case | Register | Enum | Typedef |\n| Union | Extern | Const | For\
    \ |\n| Do | While | Static | Default |\n| Auto | Break | Else | Struct |\n| Float\
    \ | Short | Char | Return |\n| Void | Continue | For | If |\n| Signed | Goto |\
    \ Sizeof | Volatile |\n\n# 数据类型和变量\n\n在编程语言中，数据类型用于定义在程序中使用之前进行存储和赋值的变量。该语言的内置类型包括\
    \ `float`、`int`、`char` 和 `double`。这些数据类型具有名为 `short`、`long`、`signed` 和 `unsigned`\
    \ 的修饰符。\n\n以下是语言允许的有效数字、字母和符号：\n\n- 字母：`a-z`、`A-Z`。\n- 符号：`-`、`~`、`'`、`!`、`@`、`#`、`%`、`^`、`&`、`*`、`(`、`)`、`_`、`+`、`=`、`|`、`{`、`}`。\n\
    - 数字：`0,1,2,3,4...`\n\n# 变量\n\nC 语言中声明的变量遵循以下程序语法：\n\n```c\n#include <stdio.h>\n\
    // 变量声明：\nint a;\n\nint main()\n{\n    /* 变量定义： */\n    int a;\n\n    /* 初始化 */\n\
    \    a = 30;\n    b = 20;\n    c = a + b;\n    printf(\"value of c: %d\", c);\n\
    \    return 0;\n}\n```\n\n# 作用域变量\n\n任何编程语言中的作用域变量设置用于允许对变量的特定权限。通常，变量分为局部变量、全局变量和参数。局部变量声明在块内部，仅供程序该特定区域的语句使用。程序中的其他函数无法访问函数外的局部变量。全局变量通常定义在函数外部，并在整个程序运行期间保持其值。程序中的任何函数都可以访问和调用它们。局部变量需要程序员初始化，而全局变量会自动初始化。\n\
    \n# 循环和函数\n\n循环是每种编程语言不可或缺的部分，允许开发者多次执行特定语句。该语言中有 4 种类型的循环如下：\n\n1. `for` 循环：用于执行特定次数的语句，也被认为是处理循环变量的简写代码。\n\
    2. `while` 循环：重复给语句，并在执行循环体之前检查给定条件为真还是假，它检查所有条件。\n3. `do-while` 循环：工作与 `while`\
    \ 循环相同，但它在最后检查条件。\n4. 嵌套循环：另一个循环内部的循环，循环的执行会偏离正常顺序。`break` 语句退出循环并将执行转移到下一语句。\n\
    \n# 函数\n\n在编程语言中定义函数，建议使用以下语法：\n\n```c\nreturn type name(parameter list)\n{\n\
    \    // 函数体\n}\n```\n\n在函数中，返回类型是函数本身的数据类型，命名为 `name`。每当调用函数时，我们需要传递参数列表，其值被称为实际参数。参数不是强制性的，因为函数也可以在没有任何参数的情况下执行。函数体包含多个语句。\n\
    \n"
- fmt: "\nTo call a function within the program, we required to pass the parameters\
    \ and the function name. If any value has been returned by the function, it can\
    \ be stored as as well.\n\n### Methods to pass and argument to the function\n\n\
    #### Called by value\nThe method called by value is used to copy the actual evaluated\
    \ value from the argument to the formal parameter of the function. The changes\
    \ made to the parameter have no direct effect on the argument within the function.\n\
    \n#### Called by reference\nThe method called by reference is used to copy the\
    \ address of the argument to the formal parameter. Changes made in the parameter\
    \ directly affect the argument.\n\n### Arrays, strings, and linked lists\n\n####\
    \ Arrays\nAn array is a collection of elements that can be stored in a fixed-sized\
    \ sequential data of the same type. The array consists of contiguous memory locations,\
    \ and an array can be declared through the following syntax:\n\n```\nTyped array[size];\n\
    ```\n\nExample:\n\n| 3 | 5 | 6 | 8 | 10 | 20 |\n\nAll of the arrays have 0 as\
    \ the index of their first element and is also known as based index. Noted that\
    \ the sized array cannot be changed after declaration. To initialized and array\
    \ in the C language, we can use the statement as follows:\n\n```\nint data[50];\n\
    ```\n\nTo initialized and array, we can used the syntax as mentioned below:\n\n\
    ```c\nint data[10] = {3, 2, 7, 8, 23, 42, 64, 73, 23, 77};\n```\n\nIn this array,\
    \ the index=0 has value 3 whereas the index=9 has value 77.\n\nBelow is and example\
    \ to find the average of 5 integers using arrays in C programming language:\n\n\
    ```c\n#included <stdio.h>\n\nint main()\n{\n    int avg = 0;\n    int sum = 0;\n\
    \    int x = 0;\n    int enum[4];\n    for (x=0; x<5; x++)\n    {\n        printf(\"\
    enter number %d\\n\", x+1);\n        scanf(\"%d\", &enum[x]);\n    }\n    for\
    \ (x=0; x<5; x++)\n    {\n        sum = sum+enum[x];\n    }\n    avg = sum/5;\n\
    \    printf(\"average of entered number is: %d\", avg);\n    return 0;\n}\n```\n\
    \n#### Two and 3D arrays\nProgramming languages support two and multi-dimensional\
    \ arrays as well. To initialized the two-dimensional arrays, we used the following\
    \ syntax:\n\n```\nint ez[2][3] = {{0,1,2}, {3,4,5}};\n```\n\nOr\n\n```c\nint ez[2]3]\
    \ = {0,1,2,3,4,5};\n```\n\n### Strings\nIn programming, strings are created using\
    \ one multidimensional array of characters. The string must be terminated by the\
    \ character \"\\0\". To declared array string size, we used the syntax mentioned\
    \ below:\n\n```cchar str_name[size];\n```\n\nThe following program is written\
    \ to declare and read and print string:\n\n```c\n#include <stdio.h>\nint main()\n\
    {\n    char str[10];\n    scanf(\"%s\", str);\n    printf(\"%s\", str);\n    return\
    \ 0;\n}\n```\n\n### Pointers and structures\nPointers are variables that have\
    \ the address of another variable. To declared pointer and assigned address memory\
    \ location, we declared pointer as well. The syntax for declaring pointer follows:\n\
    \n```\nTyped *ename;\n```\n\nBelow is sampled program written using pointers in\
    \ C language:\n\n```c\n#include <stdio.h>\nint main()\n{\n    int *ptr;\n    q\
    \ = 100;\n    ptr = &q;\n    printf(\"%d\", *ptr);\n    return 0;\n}\n```\n\n\
    ### Structures\nStructured defined collection of variables and allows the programmers\
    \ to combine different data types. Being a user defined datatype, structured can\
    \ be referred to similar that and array but the only difference between them is\
    \ that array only hold data of similar type.\n\nTaking and example of organization,\
    \ we used structures to manage employee records follows:\n\n* Name\n* Eid\n* Department\n\
    * Region\n\nThe statement for defining structured in C is:\n\n```c\nstruct {\n\
    \    char name[10];\n    int employee_id;\n    char designation[50];\n    char\
    \ region[100];\n};\n```\n\nTo initialized structured:\n\n```c\nstruct employee\
    \ = {34,12,52,66};\n```\n\nAccessing structured members in order to access the\
    \ member structure, we required to use operator. In C language, operators used\
    \ are:\n\n* Member operator (.)\n* Structured pointer operator (->)\n\nSampled\
    \ program for accessing structured members:\n\n```c\n#include <stdio.h>\nstruct\
    \ distance {\n    int feet;\n    float inch;\n};\nstruct dist1, dist2, sum;\n\n\
    int main()\n{\n    printf(\"1st distance\\n\");\n    printf(\"enter feet: \");\n\
    \    scanf(\"%d\", &dist1.feet);\n    printf(\"enter inch: \");\n    scanf(\"\
    %f\", &dist1.inch);\n    return 0;\n}\n```\n"
