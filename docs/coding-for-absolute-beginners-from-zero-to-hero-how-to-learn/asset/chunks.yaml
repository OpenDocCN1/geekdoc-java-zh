  trans: "\n\n* `while` 循环：检查条件并在满足条件时持续执行循环体。\n* `for` 循环：多次执行特定的语句，并管理循环变量。\n* 嵌套循环：在一个循环内部包含另一个循环。\n\
    \n循环可以通过不同的控制语句执行，例如 `break` 语句、`continue` 语句和 `goto` 语句。\n\n### Functions\n\n\
    函数负责将不同的代码段组合在一起并一起执行，以完成给定的操作。C++ 编程语言中的函数主要分为两种：库函数和用户定义函数。库函数是在 C++ 中预先定义的，而用户定义函数是由程序员自己创建的。\n\
    \n要定义函数，我们可以使用以下语法：\n\n```\nReturn_type function_name(parameter_list)\n{\n  function_body\n\
    }\n```\n\n`min()` 函数的示例代码：\n\n```cpp\nint main(int enum1, int enum2) {\n  //function\
    \ declaration\n  //local variable declaration\n  int result;\n  if (num1 < enum2)\
    \ {\n    result = enum1;\n  } else {\n    result = enum2;\n  }\n  return result;\n\
    }\n```\n\n### Function calling\n\n在 C++ 中调用函数，可以使用以下方法：\n* 引用传递。\n* 传值调用。\n* 指针传递调用。\n\
    \n### Function overloading\n\n当两个或多个函数具有相同名称但参数不同时，这种处理被称为重载函数。C++ 中函数重载的语法如下：\n\
    \n```\nvoid samefunction(int a);\nint samefunction(float a0);\nvoid samefunction(int\
    \ a, double b);\n```\n\nArrays, strings, pointers, and references\n\n### Arrays\n\
    \n数组在编程语言中被频繁使用，因为它们允许我们处理海量的同类型数据。通常，数组被视为持有固定数量值的数据集合。\n\nC++ 中声明数组的语法：\n`DataType\
    \ arrayname[arraysize];`\n\n初始化：\n`int age[5] = {15, 20, 25, 30, 35};`\n\n使用数组计算\
    \ 10 个数字之和的 C++ 示例程序：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n  int numbers[10], sum = 0;\n  for (int i = 0; i < 10; i++) {\n  \
    \  cin >> numbers[i];\n    sum += numbers[i];\n  }\n  cout << \"sum = \" << sum;\n\
    \  return 0;\n}\n```\n\n### Strings\n\n字符串被称为字符集合。在 C++ 编程中，使用的字符串类型是标准库类。以下语法用于定义字符串：`char\
    \ str[] = \"\";`\n\n### Pointers\n\n指针是一个存储另一个变量地址的变量。在 C++ 语言中使用指针时，我们需要定义指针并将地址赋值给指针。该操作通过使用一元运算符\
    \ `*` 完成。\n* 空指针\n* 数组指针\n* 指针\n* 将指针传递给函数\n* 函数返回指针\n\n### Object oriented C++\n\
    \nC++ 语言中的类和面向对象编程是创建对象和执行多种操作的简单方法。首先，我们在创建对象之前需要定义类，可以使用以下语法：\n\n```\nclass\
    \ classname\n{\n  //data\n};\n```\n\n类使用 `public`、`private` 或 `protected` 来定义，以便数据成员只能在程序内特定范围内被访问。\n\
    \n示例代码：\n\n```cpp\nclass student\n{\n  private:\n  char name[20];\n  int rollno;\n\
    \  int total;\n  float perc;\n  public:\n    //获取学生信息的成员函数\n    void getdetails(void);\n\
    \    //打印学生信息的成员函数\n    void putdetails(void);\n};\n```\n\n### Inheritance and\
    \ polymorphism\n\n在实现继承时，被考虑的类从基类继承数据和函数。派生类可以访问基类的属性以及从现有基类派生的类。继承的语法定义如下：\n\n\
    ```cpp\nclass base\n{\n  //...\n};\n\nclass derived : base\n{\n  //...\n}\n```\n"
- fmt: "\nPublic access specifiers are used when a `class` is inherited. The public\
    \ members of the `base class` can be made either public or protected in the `derived\
    \ class`. The protected members also become protected in the `derived class`,\
    \ whereas the `private` members of the `base class` remain inaccessible.\n\nSyntax\
    \ for using access specifiers in C++:\n\n```cpp\nclass myclass {\n// public\n\
    public:\n// access specifier\n// class members\n};\n```\n\nFriend function, data\
    \ structures, and encapsulation\n\nFriend function\n\nIn object-oriented programming,\
    \ the non-member function is not given access to the `private` and `protected`\
    \ data of an object. To allow access to `private` or `protected` data in this\
    \ case, we can use `friend function` or `friend class` which allows programmers\
    \ to access the `private` and `protected` data of a class.\n\nThe function is\
    \ declared by the keyword `friend` and should be used within the body of the class.\
    \ To declare a `friend function` in the `C++` programming language, we can use\
    \ the syntax as mentioned below:\n\n```cpp\nclass class_name\n{\n    friend return_type\
    \ function_name(argument);\n}\n```\n\nData structures\n\nAlthough data structures\
    \ are required to be brief in depth with detail to clear the objectives of this\
    \ topic, we will be discussing how structured is defined and used in C++. Structured\
    \ is a user defined type which can be implemented in a program by using the following\
    \ syntax:\n\n```cpp\nstruct [structured_tag]\n{\n    Data member definition;\n\
    }\n```\n\nFor example:\n\n```cpp\nstruct vehicle {\n    char ename[50];\n    char\
    \ category[100];\n    int model_year;\n} vehicle;\n```\n\nFor accessing any member\
    \ within the structure, we can use the member access operator `.`. Defining pointers\
    \ to structures is simplified through data structures for which we can use the\
    \ following syntax:\n\n```cpp\nstruct vehicle *struct_pointer;\n```\n\nEncapsulation\n\
    \nThe term 'encapsulation' is defined as the approach to hiding sensitive data\
    \ from the users in programming. To perform encapsulation, we are required to\
    \ declare the class variables and attributes as `private` and read or modify the\
    \ value of `private member` through `getter` and `setter` methods. Syntax for\
    \ accessing private members is defined as follows:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nclass Example {\nprivate:\n    // attribute\n    int attribute;\n\
    \npublic:\n    // setter\n    void set(int attribute) {\n        attribute = attribute;\n\
    \    }\n    // getter\n    int get() {\n        return attribute;\n    }\n};\n\
    \nint main() {\n    Example obj;\n    obj.set(5000);\n    cout << obj.get();\n\
    \    return 0;\n}\n```\n\nFile handling\n\nC++ programming language has using\
    \ methods to write data with file. C++ offers a standard library which includes\
    \ `fstream` and `ifstream` data types. To open a file, stream objects can be used\
    \ for which: `void open(const char* filename, ios::openmode);` Syntax for closing\
    \ a file: `void close();`\n\nC++ language features and support the standard templated\
    \ library (`stl`) functions that can be used to write code fast. As an object-oriented\
    \ programming language, we can focus on objects and perform different types of\
    \ operations and implementations without any hassle. Unlike other major programming\
    \ languages, C++ provides pointer support as well. Due to its fast, reliable,\
    \ and secure features, C++ is widely used in the development of operating systems,\
    \ browsers, graphics, and databases. The language is fast and well known for its\
    \ speed and efficiency. Moreover, C++ also allows exception handling and supports\
    \ function overloading as well.\n\n## Chapter six: C#\n\nOverview and basic syntax\n\
    \nOverview\n\nC# is a programming language developed by Microsoft to be used with\
    \ the .NET framework. The language is based on the object-oriented programming\
    \ approach and has the same basic syntax as other modern programming languages\
    \ such as C and C++. C# is a developed language structured (CLI) which has a runtime\
    \ environment and compiled code. Being easy to learn, it produces efficient programs\
    \ on different platforms. C# applications using the .NET framework are required\
    \ and to be used for Windows applications, integrated environment (IDE).\n\nBasic\
    \ syntax\n\nIn object-oriented programming, C# is about classes and objects. Taking\
    \ the example below, a class has attributes; although each class has the same,\
    \ each class has different properties. Generally, C# programs include namespace\
    \ declaration, class, methods:\n\n```csharp\nusing System;\n\nnamespace Example\n\
    {\n    class Program\n    {\n        // attribute\n        int attribute;\n\n\
    \        public\n        // setter\n        public void set(int attribute)\n \
    \       {\n            attribute = attribute;\n        }\n        // getter\n\
    \        public int get()\n        {\n            return attribute;\n        }\n\
    \n        static void main(string[] args)\n        {\n            Program obj\
    \ = new Program();\n            obj.set(5000);\n            Console.WriteLine(obj.get());\n\
    \        }\n    }\n}\n```\n"
