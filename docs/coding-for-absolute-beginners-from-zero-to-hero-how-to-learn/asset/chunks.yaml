    ## Dropdowns


    We can also create dropdown menus through CSS by being the same HTML elements,
    a dropdown consists of an unordered list and nested lists. Lists are used to create
    the dropdown-structure. For example:


    ```html

    <html>

    <head>

    <title>dropdown css</title>

    </head>

    <body>

    <nav>

    <ul>

    <li class="lev-1">

    <a href="">list

    <ul>

    <li><a href="">paged1</a></li>

    <li><a href="">paged2</a></li>

    <li><a href="">paged3</a></li>

    <li><a href="">paged4</a></li>

    </ul>

    </li>

    </ul>

    </nav>

    </body>

    </html>

    ```

    ![image_rsrc9FZ.jpg](images/image_rsrc9FZ.jpeg)


    ## Layers and visibility


    ### Layers


    Through CSS, we can create multiple layers of various divs by implementing the
    z-index property. For example:


    ```html

    <html>

    <head>

    </head>

    <body>

    <div style="background-color:blue; width:300px; height:100px; position:relative;
    top:1px; left:80px; z-index:2"></div>

    <div style="background-color:red; width:300px; height:100px; position:relative;
    top:-60px; left:35px; z-index:1"></div>

    <div style="background-color:black; width:300px; height:100px; position:relative;
    top:-20px; left:120px; z-index:3"></div>

    </body>

    </html>

    ```

    Output: ![image_rsrcG0.jpg](images/image_rsrcG0.jpeg)


    ### Visibility


    The visibility property allows us to hide elements from view and retain their
    space. Visibility property has defined values including visible, hidden and collapse.
    Syntax for implementing property in paragraph through CSS:


    <p>visible.</p>

    <p style="visibility:hidden;">should not be visible.</p>

    ```


    ## Layout and animations


    The CSS layout techniques are a great way to take elements contained in page and
    represent them different layouts. This technique is generally used to change the
    position of elements or container modules for layout included normal flow, flexbox,
    grid, floats, positioning, enabled layout, and multiplied column layout. Remember
    that all the methods of achieving page layout conducted through display property
    allow elements to be styled from one to another for which we can implement multiple
    properties as well. For using CSS animations, we are required to specify some
    keyframes through the keyframes rule. For example:


    ```css

    @keyframes sample {

    From {background-color:blue;}

    To {background-color:brown;}

    }

    /* the element to apply the animation to */

    div {

    Width:100px;

    Height:100px;

    Background-color:blue;

    Animation-name:sample;

    Animation-duration:4s;

    }

    ```


    ### How to effectively use CSS


    There are several other CSS custom properties and elements that can be implemented
    to improve the graphics, display, and attractiveness of a web page. It is critical
    to learn and implement these properties correctly. While writing CSS, you should
    avoid using inline styles and use external stylesheets. Checking the latest browsers
    such as Chrome, Firefox, and Safari will help you ensure proper display and formatting.


    ## Chapter 10: programming essentials


    ### Selecting the programming language


    As we have thoroughly discussed all the major programming languages and their
    syntax in detail, beginners can choose the language which seems easiest to learn
    and implement.

