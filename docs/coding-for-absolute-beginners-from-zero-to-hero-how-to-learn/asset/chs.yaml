- "# 零基础学者编程指南：从零到大师：如何学习 Python、Java、SQL、C、C++、C#、HTML 和 CSS\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n## 引言\n《零基础编程教程》是为学习了最佳编程方法、技术和方法的学生提供的一份完整且真实的指南。软件行业每天都在更新最新的编码语言和工具，这使得采用新技能和技术成为在竞争市场中生存的必然。阅读一直是学生和学习者至关重要的资源，因为他们可以通过实施最新的技术和编程方法来提高自己的表现和产出。\n\
  \n本电子书是一个成功的编程手册，涵盖了所有主要的编程语言、语法和最佳实践，适用于初学者和专业人士。在进入编程世界之前，有几个重要因素需要考虑，以培养敏锐的问题解决和分析能力。因此，本电子书针对初级程序员，并针对你可能关于\
  \ java、sql、c++、c#、python 和 html 的几乎问题提供了解决方案和答案。我一直强调基础技能的掌握。本电子书不会让你一夜成为程序员，但它将为你的编程奠定基础。阅读本电子书后，基础编程将提高你对任何编程语言的熟悉程度。\n\
  \n## 第一章：什么是编程？\n通常，编程是指计算机用于完成任务的指令。这被称为编码。在深入讨论之前，你必须意识到编程是如何工作的以及计算机是如何处理指令的。当能够遵循正确的方法编写程序时，为任何语言实现函数、运算符和语法将变得简单。此外，编程是一种通过二进制语言与计算机通信的方式，程序员需要理解包括语法在内的层级和低级语言。\n\
  \n为了用计算机解决问题，用户需要可以通过执行程序的指令来表示问题的解决方案。由于程序是解决问题的指令集合，必须添加适当的语句和功能以实现预期结果。例如，如果你被赋予了开发一个相两个整数（数字）程序的任务，那么执行加法操作的语句被称为程序。相加整数的算法将通过特定计算机语言（如\
  \ c++、c、c# 和 java）中的语句表示。如果程序无法正常执行，可能是你的算法或语法存在问题，因为如果有任何输入错误或语法错误，编译器或编辑器将无法执行程序。\n\
  \n通过实践和编写代码来学习编程比学习冗长的方法论和复杂技术更好。尽管在开始时看起来像是一个有趣的活动，但如果你不遵循正确的方法，它可能会变得耗时且令人沮丧。此外，本电子书将让初学者更容易选择最合适的编程语言，并轻松地进入计算机编程的世界。\n\
  \n使用计算机编程解决问题\n\n\n\n\n\n从本质上说，计算机程序通过遵循以下一组指令来解决特定问题。人们可以通过多种技术和方法来编写程序。为了解决问题，你需要确定代码流并逐步满足需求，以实现预期的输出。\n\
  \n在某些情况下，由于语法不当或流程顺序错误，你的计算机程序可能在苦思冥几小时后仍然无法运行，这需要你关注按顺序的指令和计算机编程语言的要求。\n\n以制作一张木桌子为例，你需要写下如下的指令：\n\
  \n1. 获取制作桌子所需的最合适的木材。\n2. 准备过程中将要使用的必备工具和设备。\n3. 组合木材并制作你的桌子。\n4. 对最终产品进行抛光，使其看起来更有吸引力。\n\
  \n在向计算机发出此类指令时，你需要变得更加具体和精确，因为计算机无法自主执行操作。由于程序的设计初衷是为了被遵循的，因此你的计算机程序应该始终遵循增量方法以实现预期的结果。\n\
  \n关于计算机的自然语言的话题，它们似乎无法理解人类语言，因此我们需要通过另一种名为二进制代码的语言与系统进行通信。二进制代码由一系列的 1 和 0 组成，是计算机的自然通信语言。为了帮助计算机理解人类语言，我们使用了翻译器和编辑器来编写程序。翻译器具有将源代码转换为机器语言的能力。\n\
  \n翻译器有多种类型，统称为解释器、编译器和汇编器。解释器通常用于解释逐行处理的语言，以运行最终程序。此外，解释器还会列出任何语法错误或失误，以便程序员清除错误并执行程序。\n\
  \n在编译器的帮助下，源代码通过编译过程转换为二进制文件，然后执行执行以交付输出。如果源代码存在错误或失误，编译器将翻译并执行所有行。此外，计算机程序（软件）被设计用于不同类别的桌面和移动应用程序。\n\
  \n### 编程基础\n\n每个计算机程序都是过程、流程和算法的组合，构成了源代码。这种软件的表示形式被称为实现输出的一系列动作，这些动作按特定顺序执行过程。驱动任何程序动力的算法也是解决特定问题的有序步骤集。\n\
  \n有不同的高级语言和低级语言可以用于编写程序。如今，程序和软件通常使用流行语言制作，包括 C、C++、Java、Python、HTML、PHP、Ruby 和\
  \ Perl。这些语言被用于生产计算机程序，应用于医疗、工程、通信、家用和娱乐等各个领域。此外，计算机程序还用于创建图形、应用程序和桌面应用。\n\n元素\n\n\
  通常，计算机语言是多种元素的组合，允许程序员实现预期的输出。这些元素包括基础语法、编程环境、数据类型、关键字、变量、决策、基本运算符和函数。此外，为了在程序中执行某些操作，你还需要应用其他操作并使用循环、字符串、字符、文件\
  \ I/O 和数组等元素。\n\n五种不同的编程基本元素认为是任何程序的构建块。这些元素是输入、输出、算术、条件和循环。从第一个元素开始，输入是指将命令和数据输入计算机的过程，而输出元素具有交付结果的功能。如果有任何计算或操作，则使用算术元素结合条件语句来测试条件是真是假。\n\
  \n### 环境\n\n为了运行和执行程序，你必须为你使用的语言安装并设置所需的工具和环境。此外，如果初学者发现自己安装和配置编程环境困难，也可以使用文本编辑器来创建计算机程序。要将程序执行为二进制格式，必须使用编译器，因为如果以文本格式提供，计算机无法直接理解程序。\n\
  \n\n\n\n此外，代码转换为二进制格式是由编译器完成的，程序员借此运行并执行程序。包括 C、C++、C# 和 Java 在内的编程语言需要编译成二进制格式，而\
  \ PHP、Perl 和 Python 等语言也可以直接执行。\n\n## 基础语法\n\n为了让初学者更容易上手，我们将从基础开始，用 C++ 编写一个“hello\
  \ world”程序。下面编写的示例程序将帮助你理解并开始编写你的第一个程序。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main() {\n    cout << \"hello world!\";\n    return 0;\n}\n```\n\n该\
  \ hello world 程序的输出如下：\n\nhello world!\n\n每个在 C++ 中编写的程序都以 `#include <iostream>`\
  \ 和 `main()` 开始（也称为 `main` 函数）。然后程序根据需求继续包含函数、字符、循环、字符串或数组。在上述编写的程序中，`main()` 被用作一个函数，而\
  \ `cout` 是用于打印“hello world!” 的标准输出流。最后，编写了 `return 0;` 作为程序的退出状态，这对于程序的执行也是必要的。\n\
  \n如果你无法执行该程序，可能存在某些编译器未处理的语法错误或输入错误，导致程序停止编译。漏掉单个逗号、分号或句点等微小的输入错误是最可能的原因。因此，如果你没有正确遵循编程语言定义的语法，在这种情况下你的程序可能无法编译或执行。\n\
  \n## 数据类型\n\n数据类型是各种编程语言的重要部分，用于创建计算机应用程序时。它对程序中编写的每个对象或变量进行分类；数据类型告诉编译器如何使用提供的数据来执行某些操作。通常，常用的数据类型包括整数、实数、布尔、字符、字母字符串和浮点数。\n\
  \n数据类型的简要详情如下：\n\n*   Date（日期）：01/04/2015\n*   Integer（整数）：1,52,13424\n*   Boolean（布尔）：true/false\n\
  *   String（字符串）：ab, aabb\n*   Void（空）：无数据\n*   Long（长整）：5325433253\n*   Floating-point\
  \ number（浮点数）：5.2341\n*   Short（短型）：0\n\n## 语法\n\n如前所述，程序被定义为执行某些操作以交付特定输出的元素和属性集合。通过\
  \ C++ 编程语言，让我们简要概述该语言语法的工作原理。\n\n1. `class`（类）：定义类并拥有其成员函数。例如，考虑 `school` 类，它将拥有老师、学生、员工等。\n\
  2. `object`（对象）：类的实例化，具有其状态，例如，汽车有不同的颜色、型号、规格。\n3. `methods`（方法）：方法指的是类内部不同动作的执行和操作。\n\
  \n编程变量、关键字、操作符和判断是程序的组成部分，它们提供了存储值所需的内存位置，以便保存的值将创建变量并分配名称、存储值以及从变量中检索值。\n\n为了开始声明变量，我们编写了以下程序：\n\
  \n```cpp\n#include <iostream.h>\nint main() {\n    int a;\n}\n```\n\n上述编写的程序创建由\
  \ `int` 关键字指定的名为 \"a\" 的变量。这意味着该变量只能存储整数值，不允许再次定义 \"a\" 来在变量中存储另一个值。要在变量中存储值，只需在变量声明后输入你想要替换\
  \ \"a\" 的数字即可。\n\n## 关键字\n\n每种编程语言都有用于各种用途的不同关键字。虽然每种语言都提供一套完整的保留关键字，但在使用关键字时需要遵循通用规则。与\
  \ `float`、`int`、`long` 和 `string` 类似，在编程语言中常用的其他关键字如下：\n\n*   Else\n*   Switch\n\
  *   Goto\n*   Static\n*   Case\n*   Break\n*   Enum\n*   For\n*   If\n*   Union\n\
  *   Double\n*   Private\n\n## 操作符\n\n操作符是任何编程语言的关键，用于执行某些操作或逻辑计算。它们通常用于数学计算，我们可以使用程序中的各种表达式求解复杂的方程。\n\
  \n编程语言中通常有两种类型的操作符：\n\n1. 算术操作符（Arithmetic operators）：用于进行数学和算术操作的操作符。例如：`+`、`-`、`/`、`--`、`++`、`*`。\n\
  \   * 二元操作符（Binary operators）：与其他操作数工作的的操作符，如 `+`、`-`、`/`、`*`。\n   * 一元操作符（Unary\
  \ operators）：用于单个操作数的操作符。例如：`++`、`--`。\n\n\n\n\n### 2. 关系运算符\n\n关系运算符是最常用的运算符，用于判断其中一个操作数是否等于另一个操作数。例如：`==`、`<=`、`>=`。\n\
  \n下面是详细说明基本运算符及其在程序中功能的表格：\n\n| 运算符 | 功能 |\n| :--- | :--- |\n| + | 两个操作数的相加 |\n\
  | - | 两个操作数的相减 |\n| / | 除法 |\n| * | 乘法 |\n| == | 检查两个操作数是否相等 |\n| >= | 检查左操作数的求值是否大于或等于右操作数\
  \ |\n| <= | 检查左操作数的求值是否小于等于右操作数 |\n\n逻辑运算符也是所有编程语言不可或缺的一部分。它们用于在各种场景下做出特定的决策。这些运算符——`and`、`or`\
  \ 和 `not` 也用于证明真假语句。\n\n## 决策\n\n决策是一个程序员必须根据给定的条件选择一个选项的过程。你需要测试条件是真还是假，并表示正确的输出。\n\
  \n对于不同的编程语言，决策语句简述如下：\n\n*   `if` 语句\n*   `else` 语句\n*   Switch\n*   `else if` 语句\n\
  *   条件运算符\n\n## 编程字符、数组和字符串\n\n在编程语言中，char 是一种用于存储字符和字母的类型。它们还负责存储值，并在程序中调用该字符时传递输出。你只允许在单引号内存储单个数字或字母表字符，例如\
  \ `&`、`,`、`*` 或 `+`。\n\n定义字符的示例代码如下：\n\n```\nchar ch1 = 'a';\n```\n\n#### 数组\n\n\
  数组是一种数据结构，能够顺序存储相同类型的顺序编号元素，并且通常具有固定的大小。它由连续的内存位置组成，也被存储在相同名称下的元素集。如果你正在编写一个按顺序存储\
  \ 10 个整数的程序，创建一个长度为 10 的数组将最佳解决方案。固定数量数组的声明方式如下：\n\n```c\nint data[10];\n```\n\n\
  数组有两种类型：\n1. 一维数组\n2. 多维数组\n\n### 访问数组\n\n在声明之后，你可以轻松通过索引访问元素。数组的索引从 0 开始，你必须使用索引-1\
  \ 来访问最后一个元素。初始化数组的方法如下：\n\n```c\nint arr[5] = {1, 2, 3, 4, 5};\n```\n\n数组允许程序员存储单个变量，而无需特地地定义每一个变量。与其他类型类似，数组使用\
  \ `[]` 括号声明，一旦数组声明，你就可以赋值。\n\n#### 声明\n\n为了声明数组，你必须记住数组的大小必须是大于 0 的整数，数组声明如下：\n\n\
  `Typed arraynamed[size];`\n\n#### 初始化\n\n要初始化数组，你使用下面的语句：\n\n```c\nint arr[5] =\
  \ {23, 45, 53, 64, 73}\n```\n\n### 字符串\n\nString 是编程语言中用于表示字符数组的数据类型。要声明和初始化字符串，你需要遵循相同的结构化数组。每种编程语言编写字符串都有不同的技术和方法，但每个情况的功能是相同的。每个字符串还可以包含短语中的空格，例如“id\
  \ have waiting since 5 pm.”\n\n字符串的示例如下：\n\n```c\nchar ec[] = \"abcdef\";\n```\n\
  \n## 函数\n\n## 函数\n\nAd 函数是一个已知的代码块，在程序中执行特定任务。编程语言中有两种类型的函数，称为标准库函数和自定义函数。标准库函数负责处理如\
  \ i/o 处理、计算等主要任务，而用户定义的函数则用于执行特定任务，以为程序提供更好的模块化。\n\n在编程中定义函数，你需要声明返回类型、名称、参数列表和函数体。\n\
  \n例如：\n\n```cpp\n#include <iostream.h>\n\nvoid functionname() {}\n\nint main() {\n\
  \    functionname();\n}\n```\n\n### 文件输入/输出 (I/O)\n\n通过文件输入输出模式支持存储和管理如图像、文档、纯文本和\
  \ Excel 表格的文件。通过文件输入，使用方法是将任何数据写入文件，而文件输出方法则用于显示来自文件的结果。通常，文件可以用不同的模式打开，如只读、只写和读写模式。\n\
  \n\n\n\n开发环境是一套共同用于运行程序的编程工具和流程。根据你编写程序时所使用的语言，你可以选择最合适的环境，并按照提供的说明完成你的项目。因为编程是我们实现不同解决方案和输出的方式，我们可以通过编程工具和环境以多种方式表达我们的想法。\n\
  \n此外，编译器以步步为进的方式执行算法，并执行其他活动，如决策选择、顺序处理和迭代。\n\n## 集成开发环境\n\n集成开发环境是指将工具和流程连接起来，为编程环境提供便捷界面的软件。集成开发环境（IDE）也被称为应用程序，它还有助于应用程序开发，并为开发者提供基于图形用户界面（GUI）的工作方法。现代\
  \ IDE 还可以用于生成各种结构化图表、流程图，并提供一种模块化的编程方法。\n\n为了选择一个 IDE，你还可以概述你的语言需求和编程风格。这可以让你更轻松地完成复杂的应用程序并获得更好的结果。\n\
  \n## 工具与技术\n\n有数以千计的软件开发工具、IDE 和技术可以创建完美的应用程序、程序和软件。我们列出并简要介绍了一些最有效、易用且先进的工具，供程序员开发任何类型的\
  \ Web、桌面和移动应用程序。\n\n以下是一些针对初级编程者的最佳工具：\n\n### Netbeans\nNetbeans 是一个开源的集成开发环境，可以作为开发桌面、Web\
  \ 和移动应用程序的工具。该工具允许轻松且高效的项目管理，允许开发者编写无 bug 代码，并提供智能代码编辑功能。此外，该 IDE 最适用于 PHP、C++ 和\
  \ C 编程语言。\n\n### Cloud9\n提到在线软件开发环境，Cloud9 无疑是值得考虑的最优秀工具之一。支持的语言包括 PHP、C、C++、Python、Perl、Node.js\
  \ 和 JavaScript。开发者可以选择广泛的默认运行器，在提供的建议下更快地执行和编写应用程序代码。\n\n### Visual Studio\nVisual\
  \ Studio 是由微软设计和开发的顶级集成开发环境。由于支持终端平台，开发者现在可以毫无顾虑地构建、保护和管理组件。此外，自动化部署允许你在提高质量的同时，利用支持的集中式版本控制。\n\
  \n## 技术\n\n学习编程语言和技术是采用最新编程方法和技术的最佳方式。从 JavaScript、Python、Java 和 C++ 等主流技术开始，让你对计算机有更深入的理解。此外，每种技术都有自己的视角和方法论。对于开源开发者来说，Java\
  \ 被认为是理解虚拟机（JVM）范式的最佳语言；而让开发者从 C++ 开始实践编程则让他们接触到每个低层系统和方法论。\n\n## 方法论\n\n编程方法论是分析复杂问题并规划软件开发以实现最佳解决方案的过程。软件开发被称为模块化编程，分类如下：\n\
  \n### 1. 需求收集\n作为软件开发周期的第一个阶段，它由专家和专业人士执行，他们可以轻松对项目成果和所讨论的技术方法进行可行性研究，确保项目在不出现任何问题的情况下完成。\n\
  \n### 2. 需求工程\n下一步是收集相关数据并定义完成项目所需的需求。通常，我们会创建一个软件需求说明（SRS）文档，其中包含了所有的设计和开发数据。系统分析师必须清楚客户的需求，并向开发者提供详细的简报，以便他们能够据此编写代码。通常，客户在记录的他们能够清晰地定义他们的需求并提供通用的指南。\n\
  \n### 3. 设计\n在完成需求工程后，下一步是设计软件需求说明（SRS）文档中指定的架构。在此时，你还被概述设计模块化、时间限制和产品规格。\n\n###\
  \ 4. 开发\n这是开发者开始遵循项目经理的指令和指南开展项目的阶段。对于每个特定项目，会在广泛研究和开发后选择编程语言，以完全满足客户的实际需求和功能。\n\
  \n### 5. 测试\n\n\n\n\n\n此阶段涉及通过各种测试用例概述客户需求对软件进行检查和检查，检查产品是否存在错误、缺陷以及需要改进之处，以确保每个需求都得到完全满足并可运行。\n\
  \n### 1. 部署\n\n部署是流程的最后一个阶段。由于产品现在通过了设计、开发和测试程序，已准备交付给客户。根据业务策略，产品也可以根据客户提供的指令在市场上进行发布。\n\
  \n#### 前端技术\n\n前端开发通常指通过实现 Web 应用程序的设计、结构和动画来开发用户界面。前端开发的核心技术包括 `html`、`css` 和 `javascript`，而专业开发人员可能还会使用\
  \ `ajax`、`amp` 和 `angular` 等最新技术。\n\n超文本标记语言 (`html`）和级联样式表 (`css`）是创建网站的基础构建模块，也用于增强网页的响应能力。`html`、`javascript`\
  \ 和 `css` 是前端开发的三大主要技术。\n\n##### 文档编辑器\n\n为了创建文档、演示文、图表、图形和动画，有多种文档编辑工具可用。从最流行的工具开始，你可以安装\
  \ Microsoft Office 并顺利地编辑任何类型的文档。该软件包包括 Microsoft Word、Microsoft Excel、Microsoft\
  \ PowerPoint、Outlook、OneNote 以及其他访问和其他模块。\n\n此外，Google Docs 是另一个实用的文档编辑工具，可以在线访问、更新和创建文档。该工具允许你创建表格、文档、幻灯片和表单，你可以从广泛的模板中进行选择。\n\
  \n## 第二章：Java\n\n### 概述和基础语法\n\nJava 是一种由 Sun Microsystems 在 1995 年发布的高级编程语言。使用\
  \ Java 技术构建的无数网站和应用程序使其可靠、易用，并与其他编程语言相比具有优势。作为面向对象的语言，开发者可以更快地编写代码、编译和执行程序。此外，使用\
  \ Java 开发的应用适用于包括 Windows 和 Unix 在内的不同配置环境。由于 Java 具有绝对的平台无关性，它被编译为特定平台的机器码，然后通过虚拟机\
  \ (`jvm`) 进行解释。此外，Java 实现了高性能，并很好地适用于分布式互联网环境。\n\n转向基础语法，Java 编程通常基于对象、类、方法、变量、修饰符、构造函数和正则表达式。为了更好地理解简单的\
  \ Java，你可以了解以下每个方面的简要细节：\n\n| 关键字 | 功能 |\n| :--- | :--- |\n| Class | 用于声明一个类 |\n\
  | Void | 返回类型 |\n| Public | 访问修饰符，使函数可见 |\n| Static | 用于在静态方法中创建对象 |\n| Main() |\
  \ 主方法是程序的起点 |\n| System.out.println() | 将语句打印到控制台 |\n\n在开始编程之前，请记住 Java 是区分大小写的，你需要在声明类名时首字母大写。方法名应以小写字母开头，程序文件名应与类名完全一致，以避免执行程序时出现任何问题。\n\
  \nJava 编程语言中的概念包括类、对象、多态、继承、抽象、封装、实例方法和方法传递。你的第一个 Java 程序可能看起来如下：\n\n```\nclass\
  \ helloworld {\n    public static void main(String[] args) {\n        System.out.println(\"\
  your first Java program!\");\n    }\n}\n```\n\n### Java 标识符和修饰符\n\nJava 标识符应该以字母开始。Java\
  \ 标识符区分大小写，你需要在声明类名时首字母大写。修饰符用于修改变量的行为。例如，`char`、`price`、`place`。\n\nJava 语言中的修饰符分为访问修饰符是非访问修饰符。\n\
  \n### 类和对象\n\n对象是类的实例。类代表了为对象的属性和行为。对象是从类中创建的。\n\n\n\n\n\n## 创建名为 \"newobj\" 的对象：\n\
  \n```java\npublic class newclass {\n\n    int a = 1;\n\n    public static void main(String[]\
  \ args) {\n        myclass newobj = new newclass();\n        System.out.println(newobj.xd);\n\
  \    }\n}\n```\n\n创建一个对象需要声明、实例化和初始化。声明是在某处声明一个带有名称和对象类型的变量的过程，而实例化是使用 `new` 关键字来创建对象。随后通过调用构造函数继续程序，以便对创建的\
  \ `new` 对象进行初始化。\n\n### 基本数据类型和变量\n\n在 Java 程序中，数据存储在变量中，程序首先声明变量，将数据读取到变量中，然后执行提供的操作。一旦完成处理，变量将再次写入新位置。提供的变量是用于存储值的预留内存位置，内存由操作系统分配。\n\
  \n## 数据类型\n\nJava 编程语言中有两种不同的数据类型，称为基本数据类型和对象数据类型。基本数据类型被分为 8 类：`byte`、`short`、`int`、`long`、`float`、`double`、`boolean`\
  \ 和 `char`。对象数据类型使用类的构造函数创建，并且也负责访问对象。每个可用引用变量的默认值被设置为 `null`，并且也可以用于指向已声明类型的对象。\n\
  \n## 变量\n\nJava 编程语言中使用了三种类型的变量：\n\n1. 局部变量\n2. 实例变量\n3. 类/静态变量\n\n### 局部变量\n\n\
  局部变量通常声明在构造函数和方法中。由于它们是随构造函数创建的，因此不能配合局部变量使用访问修饰符。局部变量没有默认值。\n\n### 实例变量\n\n实例变量声明在类内部，并在创建对象时创建。它们应该持有构造函数或方法引用的实例变量的值。\n\
  \n## 运算符与决策\n\n编程语言中提供的基本运算符说明如下：\n\n* 算术运算符：用于在程序内执行数学计算和评估的算术运算符。包括加、减、乘、除、模以及递增递减函数。\n\
  * 一元运算符：后置 `++` 和前置 `++` 表达式。\n* 逻辑运算符：`&&` 表示假，`||` 表示真，`!` 表示真。\n* 位运算符：执行按位操作。\n\
  * 赋值：`=`、`+=`、`|=`、`^=`\n\n## 控制语句\n\n控制语句类似于 C++ 等其他编程语言。`ifelse:` 语句中提到的条件用于检查给定条件为真为假。编程语言中有不同类型的\
  \ if ，称为 `if` 语句、`if-else` 语句、`if-else-if` 阶和嵌套 `if` 语句。\n\n这是一个演示 if 语句的简单程序：\n\
  \n```java\npublic class marks {\n    public static void main(String[] args) {\n\
  \        int marks=50;\n        if (marks<50){\n            System.out.println(\"\
  your marks lessthand50\");\n        }\n    }\n}\n```\n\n上述程序的输出为：`your marks lessthand50`。\n\
  \n### If-else\n\nif-else 语句用于测试条件，如果结果为真，则执行 `if` 块；如果为假，则执行 `else` 语句。\n\n### Switch\n\
  \nswitch 语句用于从多个条件中执行单个语句。该语句可以处理包括 `short`、`int`、`long`、`byte`、`string` 和 `long`\
  \ 在内的数据类型。\n\nswitch 语句的语法如下：\n\n* Switch(expression){\n* Case value1: `break;`\n\
  * Case value2: `break;`\n* Default: \n* }\n\n#### 循环\n\n编程语言中通使用了三种循环：\n\n* For\
  \ 循环\n* While 循环\n* Do-while 循环\n\n#### For 循环\n\nfor 循环用于执行程序的迭代部分。如果迭代次数固定，使用\
  \ for 循环。\n\n#### While 循环\n\nwhile 循环具有重复一组语句的特性，以测试给定条件是否成立。如果迭代次数固定，请使用 while\
  \ 循环。\n\n### Do-while 循环\n\ndo-while 循环用于多次迭代程序的部分。如果迭代次数固定，它至少执行一次。\n\n有特定的循环控制语句可以将执行改为普通序列。Java\
  \ 语言中的循环控制语句包括：\n\n* `break`：终止 switch 或循环并开始下一次迭代。\n* `continue`：允许程序跳过当前循环体的剩余部分。\n\
  \n\n\n\n\n决策结构包含一个或多个在给定场景下需要测试的条件。如果条件为真，则可以执行下一条语句；如果给定的条件为假，程序将终止。下面的图正确地展示了决策过程的实际工作方式：\n\
  \n### 字符、字符串、数组和正则表达式\n\nJava 编程语言使用了 `Character` 包装类，并提供了多个静态方法来操作字符。要创建一个 `Character`\
  \ 对象，您需要遵循以下语法：\n\n```\nCharacter ch = new Character('a');\n```\n\n如果您向方法传递任何基本类型\
  \ `char`，编译器将自动创建一个 `Character` 对象，编译器将使用语言中的各种方法将 `char` 转换为 `Character`。\n\n正如我们之前讨论过的`strings`\
  \ 的重要性和功能，Java 平台也提供了 `String` 类的支持。程序员可以通过多种方式处理字符串。在 Java 语言中创建`string` 的示例代码如下：\n\
  \n```java\npublic class NewString {\n\n    public static void main(String args[])\
  \ {\n        char[] studentArray = {'s', 't', 'u', 'd', 'e', 'n', 't'};\n      \
  \  String studentString = new String(studentArray);\n        System.out.println(studentString);\n\
  \    }\n\n}\n```\n\n该程序的输出为：student。\n\n此外，我们还可以使用 Java 编程语言中简单的连接方法来拼接字符串，如下：\n\
  \n```java\nString1.concat(string2);\n```\n\n在 Java 中创建`string` 对象，程序员可以选择字面量关键字方法。\n\
  \n#### 数组\n\n数组是每种编程语言的重要部分，因为它们允许程序员处理并将存储存储变量中。它们被用于存储大量数据，您也可以将数组视为同一类别变量的集合。要声明数组，可以遵循下面摘要的简单语法：\n\
  \n```\ndatatype[] arrayRefVar;\n```\n\n在 Java 中创建数组非常简单，您可以使用以下语法：\n\n```java\n\
  arrayRefVar = new datatype[size];\n```\n\n该语句将创建一个指定大小并引用的数组。通常，使用循环或 for 循环来处理数组元素。用于排序、搜索和填充数组的静态方法：\n\
  \n* `public static int binarySearch(Object a, Object key)`\n* `public static void\
  \ fill(int[] a, int val)`\n* `public static boolean equals(long[] a, long[] b)`\n\
  * `public static void sort(Object a)`\n\n### 正则表达式\n\n正则表达式用于定义模式，并用于搜索、编辑和处理文本。Java\
  \ 定义了 `java.util.regex` 包，其中包含 `Pattern` 类、`Matcher` 类和 `PatternException` 对象。`Pattern`\
  \ 类要求开发者从 `compile()` 方法开始并返回一个 `Pattern` 对象，它不提供构造函数。对于 `Matcher` 类，对象针对标准输入字符串顺序执行查找和比较操作，通过\
  \ `matcher()` 方法获取对象。`PatternException` 用于指示正则表达式模式中的错误或异常。\n\n### 文件和 I/O\n\nJava\
  \ 编程语言拥有负责输入和输出操作的内置包。被称为 `java.io` 的流支持处理数据的多种操作和功能。Java 中有通用的流类型，被称为 `InputStream`\
  \ 和 `OutputStream`。`InputStream` 用于从文件中读取数据。\n\nJava 语言具有各种 I/O 数据处理流，包括以下：\n\n\
  * 字节流\n* 字符流\n* 标准流\n* 文件输入流\n* 文件输出流\n\n### 面向对象的 Java\n\n面向对象编程是一种使用类和对象的方法。通过使用继承、多态、封装和抽象等多个概念，程序员可以开发应用程序。\n\
  \n## 继承\n\nJava 语言中的继承允许类从另一个类继承特征。被继承的类是超类，被继承的类是子类。要在 Java 中使用继承，请遵循下面提到的语法：\n\
  \n```java\nclass derivedClass extends baseClass {\n    // methods\n}\n```\n\n\n\n\
  抽象类在声明时带有 `abstract` 关键字，并且它可能不包含抽象方法。如果一个类拥有抽象方法，它就不能被实例化，程序员必须继承另一个类来实现该抽象方法。\n\
  \n封装\n\n封装是 Java 编程中将数据和方法封装在一起的过程。通常，一个类的变量对另一个类是隐藏的，并且只能通过其所属类中使用的方法进行访问。封装的优势在于，类可以被设置为只读或只写，并且对存储的数据具有完全的控制权。\n\
  \n递归\n\n递归是指程序中方法调用其自身的技术。`recurse()` 方法从 `main` 方法被调用，也可以在同一个 `recurse()` 方法内部被调用。这个过程会持续持续直到满足给定的条件；如果不满足，则会发生无限递归。\n\
  \n以下是 Java 中递归的一个简单实现：\n\n```java\nclass Sample {\n    static void printfund(int\
  \ test) {\n        if (test < 1) {\n            return;\n        } else {\n    \
  \        System.out.printf(\"%dd\", test);\n            // statement 2\n       \
  \     printfund(test - 1);\n            System.out.printf(\"%dd\", test);\n    \
  \    }\n    }\n\n    public static void main(String[] args) {\n        int test\
  \ = 3;\n        printfund(test);\n    }\n}\n```\n\n递归的优势\n\n在某些复杂的程序中，编写递归代码可以带来多种益处。每个递归提供了一种简化且简洁的代码编写方式，开发者可以轻松地执行各种类型的操作。\n\
  \n抽象类和抽象方法\n\n抽象类\n\n在 Java 编程中，抽象类是类无法初始化并使用 `abstract` 关键字声明的类。记住，创建抽象类的对象将产生编译错误。以下是一个演示了继承和抽象类的\
  \ Java 程序：\n\n```java\nclass Abstract {\n    abstract void display();\n}\n\nclass\
  \ Sample extends Abstract {\n    public void display() {\n        System.out.println(\"\
  id\");\n    }\n\n    public static void main(String[] args) {\n        Abstract\
  \ obj = new Sample();\n        obj.display();\n    }\n}\n```\n\n抽象方法\n\n在 Java 中创建抽象方法需要使用\
  \ `abstract` 关键字。语法如下：\n\n```\nabstract void move();\n```\n\n## 第三章：数据库\n\n什么是数据库？\n\
  \n数据库是一个可以被访问、管理和更新的数据集合。在简要讨论数据库之前，理解数据的实际含义以及如何处理数据是非常关重要的。数据通常定义为记录和事实的集合，我们可以对这些内容进行计算和推理。为了保护、保存、交付和组织数据，人类创建了数据库，而管理整个过程的系统被称为数据库管理系统\
  \ (dbms)。\n\n数据库管理系统 (dbms) 概念\n\n数据库管理系统由多个程序组成，允许用户访问数据库并通过不同的过程处理数据。每个程序都设计用于控制对数据库的访问，ms\
  \ 中引入了各种操作和功能，使其更加高效、安全和可靠。\n\n有 4 种不同类型的 dbms：\n\n关系型数据库\n\n这类 dbms 以表的形式定义数据库关系。\n\
  \n面向对象的关系型数据库允许存储带有属性的对象作为数据。\n\n网络型数据库\n\n网络型数据库通常具有多对多的关系结构。\n\n层次型\n\n层次型数据库遵循父子关系来存储数据，其结构类似于使用节点作为字段的结构。\n\
  \n数据库环境架构\n\n数据库环境现在是一系列负责处理、管理和数据的组件集合。数据库通常存储在计算机、硬件和外围设备中，并使用 SQL Server 等 DBMS\
  \ 工具。\n\n数据库 DBMS 的架构通常分为三大类：集中式、去中心化和层次式。去中心化系统也可以设计为由并行架构访问。\n\n\n\n分布式数据库将其数据存储在各个站点，这些站点通过通信链路相互连接。这种数据库进一步划分为同构和异构两类。对于同构分布式数据库系统，硬件、操作系统和应用程序都是连接的；而对于异构分布式数据库系统，每个位置和连接系统可以是不同的。\n\
  \n## 云数据库\n\n云数据库的设计和构建旨在将数据存储在私有云、公有云或混合云中，为用户提供更好的扩展性和更大的存储容量，并从高可用性中获益。它是业务应用程序的最佳选择。\n\
  \n## NoSQL \n\nNoSQL 数据库最适用于大型分布式数据，并通过关系型数据库进行方便的管理。此外，对于关系型数据库无法轻松解决的大数据性能问题，它们非常有效。\n\
  \n## 对象数据库\n\n对象数据库由关系型数据库支持，并且基于对象而非操作。\n\n## 终端用户数据库\n\n终端用户数据库是专门为终端用户设计和创建的共享数据库。每个数据库都包含整个数据库的摘要，终端用户无疑无需担心在任何数据库级别执行的操作。\n\
  \n## 数据库语法、数据类型和操作符\n\n标准查询语言（`sql`）用于在数据库内存储、操作和检索数据。`sql` 允许管理员执行管理数据库所需的多种操作。该语言允许你仅通过编写简单的查询来执行查询、检索数据、插入记录、更新记录、删除记录、创建新数据库、创建新表并在数据库中设置权限。\n\
  \n`sql` 有不同的版本，所有版本都支持 select、delete、insert 和 update 等主要功能。\n\n## 结构化查询语言 (sql)\n\
  \n`sql` 是用于关系型数据库系统的语言，如 `mysql`、`sybase`、`oracle` 和 `server`。作为一种标准的数据库语言，`sql`允许用户描述数据、访问数据并操作关系型数据库管理系统。此外，用户还可以通过结构化查询语言创建、查看和删除数据库。\n\
  \n在此过程中的不同组件包括优化引擎、`sql` 查询引擎、经典查询引擎和查询分发器，用于在关系型数据库管理系统中执行特定操作，我们使用了以下命令：\n\n|\
  \ Command | Description |\n| :--- | :--- |\n| Create | 用于创建新表或数据库。 |\n| Read | 用于读取和添加存储在表中的数据。\
  \ |\n| Update | 更新表以修改记录。 |\n| Delete | 从表中删除任何记录。 |\n| Insert | 向表中插入新记录。 |\n|\
  \ Select | 从表中选择特定记录。 |\n| Alter | 对对象进行更改。 |\n| Drop | 从数据库中删除整个表。 |\n\n使用示例表 `students`\
  \ 的不同操作如下：\n\n| eid | Student | City | Subject | Marks | Percentage |\n| :--- |\
  \ :--- | :--- | :--- | :--- | :--- |\n| 1 | William | New York | Mathematics | 85\
  \ | 60% |\n| 2 | James | California | English | 79 | 58% |\n\n从 `students` 获取记录的语句语法如下：\n\
  \n```sql\nSelect * from students;\n```\n\n不同查询解释如下：\n\n| Query | Syntax |\n| :---\
  \ | :--- |\n| Insert | Insert into table_name(column1,column2...) Values(value1,value2...)\
  \ |\n| Update | Updated table_name set column1=value1,column2=value2... Where |\n\
  | Delete | Deleted from table_name where; |\n| Order by | Select column1..from table_name\
  \ Order by column1 asc/desc; |\n| Min() | Select min(column_name) From table_name\
  \ where; |\n| Max() | Select max(column_name) From table_name where; |\n| Where\
  \ | Select column1..From table_name where; |\n\n## SQL 连接\n\n以通过 `sql` 查询连接的带有表的关系型数据库为例。图表清楚地显示了表如何连接在一起以共享数据：我们将在下面的示例表\
  \ `patients` 上实现各种连接操作：\n\n表 e1:\n\n| Patientid | Caseno | Date |\n| :--- | :---\
  \ | :--- |\n| 43221 | 1 | 9-2-2011 |\n| 82357 | 3 | 8-12-2015 |\n\n表 e2:\n\n| Caseno\
  \ | Patientname | City |\n| :--- | :--- | :--- |\n| 1 | Andrew | Chicago |\n| 3\
  \ | John | La |\n\n为了连接这两个表，我们写了如下的 `sql` 连接语句：\n\n```sql\nSelect p.patientid, p.caseno,\
  \ p.date\nFrom patients p\nInner Join patients p ON p.caseno = p.patientid;\n```\n\
  \n有四种不同的 `sql` 连接查询，被称为：\n\n* 内连接 (Inner join)\n* 左外连接 (Left outer join)\n* 右外连接\
  \ (Right outer join)\n* 全外连接 (Full outer join)\n\n### 内连接\n\n内连接从表中选择满足连接条件的整条记录。在\
  \ `sql` 中创建内连接的语法定义如下：\n\n```sql\nSelect column_name\nFrom table1\nInner Join table2\
  \ On table1.column_name = table2.column_name;\n```\n\n### 左外连接\n\n左连接选择表 1 的整个记录，结合满足连接条件的表\
  \ 2 记录。在 `sql` 中创建左连接的语法定义如下：\n\n```sql\nSelect column_name\nFrom table1\nLeft Join\
  \ table2 On table1.column_name = table2.column_name;\n```\n\n### 右外连接\n\n\n\n\n\
  右连接（right join）从 table2 中选择所有记录，并满足连接条件的 table1 中的匹配记录。在 SQL 中创建右连接的语法如下：\n\n```sql\n\
  Select column_named\nFrom table1\nRight join table2\nOn table1.column_named = table2.colmn_name;\n\
  ```\n\n全外连接（full outer join）从 table1 和 table2 中选择所有记录，即使不满足连接条件。在 SQL 中创建全外连接的语法如下：\n\
  \n```sql\nSelect column_named\nFrom table1\nFull outer join table2\nOn table1.column_named\
  \ = table2.colmn_named\nWhere condition;\n```\n\n并集运算符（Union operator）\n\n为了合并两个或多个\
  \ `select` 语句的结果，使用了 `union` 运算符，其中每个列必须具有相似的数据类型。此外，两个表 select 语句中的列应该保持相同的顺序。在\
  \ SQL 中实现 `union` 运算符的语法如下：\n\n```sql\nSelect column_named from table1\nUnion\n\
  Select column_named from table2;\n```\n\n分组（Group by）\n\nSQL 的 `group by` 语句可以用于从数据库表中执行列表或编号。在\
  \ SQL 中使用 `group by` 语句的语法如下：\n\n```sql\nSelect column_named\nFrom table_named\n\
  Where condition\nGroup by column_named\nOrder by column_named;\n```\n\n排序（Order\
  \ by）\n\nSQL 中的 `order by` 语句用于按升序或降序排序数据。实现 `order by` 子句的语法如下：\n\n```sql\nSelect\
  \ column_list\nFrom table_named\nWhere condition\nOrder by column1, column2 [asc|desc];\n\
  ```\n\n高级 SQL（Advanced SQL）\n\n还有其他一些关键操作和子句可以在数据库内执行复杂操作。以下是高级 SQL 一些关键特的详细说明：\n\
  \n索引（Indexes）\n\nSQL 索引被数据库搜索引擎用于优化处理的数据处理。它们被视为特殊的查找表，索引有助于加速子句和选择查询。可以使用创建索引语句结合唯一约束（unique\
  \ constraint）来防止重复输入。\n\n使用已创建索引的语法：\n\n```sql\nCreated index index_named on table_named;\n\
  ```\n\n删除索引的语法：\n\n```sql\nDrop index index_name;\n```\n\n截断表（Truncated table）\n\
  \n`truncate table` 命令是 SQL 实现的用于从现有表中删除已完成的数据。基本语法：\n\n```sql\nTruncate table table_name;\n\
  ```\n\n主键和外键（Primary and foreign key）\n\nSQL 中的主键约束用于唯一标识表中的每条记录。主键应始终包含唯一值且不能有空值。此外，多个列中只能添加一个主键。例如，为了在创建的\
  \ \"students\" 表上定义主键，我们以下语句：\n\n```sql\nCreated students (\nid int primary,\nfirstnamed\
  \ int,\nlastnamed int\nid));\n```\n\n外键（Foreign key）\n\nSQL 中的外键约束用于将表连接到主键。在创建的\
  \ \"student\" 表上实现外键约束的语法：\n\n```sql\nCreated student (\nstudentid int,\nmarks int,\n\
  foreign key (studentid) references students(id));\n```\n\n约束和有用资源（Constraints and\
  \ useful resources）\n\n约束是实现在表列上的特定规则。通常，常见的约束包括默认约束（default constraint）、唯一约束（unique\
  \ constraint）、主键、外键、检查约束（check constraint）和索引。此外，完整性约束也用于为关系型数据库呈现的数据提供更好的一致性和准确性。通常，主键和唯一约束是引用完整性（ri）的一部分。为了提高\
  \ SQL 数据库的性能，有几个可以轻松实现的因素。在编写列名时，建议使用 select 语句而不是通配符 **。例如：\n\n```\nSelect * from\
  \ students\n```\n\n此外，设置 `count` 语句将减少 SQL 服务器更新插入、删除或更新操作行所需的时间\n\n## 第四章：C（Chapter\
  \ four: C）\n\nC 语言于 1972 年在贝尔实验室开发。通常，编程语言分为两大类：高级语言和低级语言，但 C 被视为中间语言。这种语言的目的是提供对内存的低级访问，并为\
  \ PHP 和 Java 等其他主要语言提供了语法。\n\n介绍和简单程序（Introduction and simple programs）\n\n作为一种结构化语言，程序员可以通过实现不同的方法和编程技术创建分区代码块并创建业务应用程序。此外，我们编写了新函数并在库中重复使用它们。\n\
  \n从 C 编程开始\n\n对于初学者来说，编写 C 程序简单又容易。从基础编程语法开始，我们开发了如下应用程序：\n\n```c\n#include <stdio.h>\n\
  \nint main()\n\n{\n    return 0;\n}\n```\n\n\n\n\n\n```c\nint main() {\n    printf(\"\
  %d\", a);\n    return 0;\n}\n```\n\n## 头文件\n\n编写程序的第一部分是选择头文件。通常，头文件的扩展名为 `.h`，并且包含函数声明。要包含一个头文件，我们使用\
  \ `#include` 指令，后面紧跟头文件名称，语法如下：\n\n```c\n#include <string.h> own\n```\n\n每个头文件的示例：\n\
  \n| 头文件 | 定义 |\n| :--- | :--- |\n| Stdio.h | 用于定义输入输出函数 |\n| String.h | 用于字符串处理\
  \ |\n| Stddef.h | 定义有用的类型和宏 |\n| Stdlib.h | 定义内存分配 |\n| Stdint.h | 用于定义整数类型 |\n\
  | Math.h | 用于执行数学函数 |\n\n## 方法和变量声明\n\n编写程序的后续部分是定义每个方法并声明变量。`main` 方法的声明语法如下：\n\
  \n```c\nInt main()\n{\n    // 变量声明的语法为：\n\n    Int main()\n    {\n\n        Int\
  \ z;\n    }\n}\n```\n\n程序体：\n\n```c\nInt main()\n{\n    int ez;\n    printf(\"%d\"\
  , ez);\n    return 0;\n}\n```\n\n要终止程序，我们可以使用 `return` 语句：`return 0`。\n\n## 关键字\n\
  \n关键字是任何编程语言的强制性部分，也被称为保留字。虽然高级编程语言有许多关键字，但 C 语言只允许使用 32 个关键字，如下：\n\n| Double |\
  \ Long | Int | Switch |\n| :--- | :--- | :--- | :--- |\n| Case | Register | Enum\
  \ | Typedef |\n| Union | Extern | Const | For |\n| Do | While | Static | Default\
  \ |\n| Auto | Break | Else | Struct |\n| Float | Short | Char | Return |\n| Void\
  \ | Continue | For | If |\n| Signed | Goto | Sizeof | Volatile |\n\n## 数据类型和变量\n\
  \n在编程语言中，数据类型用于定义在程序中使用之前进行存储和赋值的变量。该语言的内置类型包括 `float`、`int`、`char` 和 `double`。这些数据类型具有名为\
  \ `short`、`long`、`signed` 和 `unsigned` 的修饰符。\n\n以下是语言允许的有效数字、字母和符号：\n\n- 字母：`a-z`、`A-Z`。\n\
  - 符号：`-`、`~`、`'`、`!`、`@`、`#`、`%`、`^`、`&`、`*`、`(`、`)`、`_`、`+`、`=`、`|`、`{`、`}`。\n\
  - 数字：`0,1,2,3,4...`\n\n## 变量\n\nC 语言中声明的变量遵循以下程序语法：\n\n```c\n#include <stdio.h>\n\
  // 变量声明：\nint a;\n\nint main()\n{\n    /* 变量定义： */\n    int a;\n\n    /* 初始化 */\n\
  \    a = 30;\n    b = 20;\n    c = a + b;\n    printf(\"value of c: %d\", c);\n\
  \    return 0;\n}\n```\n\n### 作用域变量\n\n任何编程语言中的作用域变量设置用于允许对变量的特定权限。通常，变量分为局部变量、全局变量和参数。局部变量声明在块内部，仅供程序该特定区域的语句使用。程序中的其他函数无法访问函数外的局部变量。全局变量通常定义在函数外部，并在整个程序运行期间保持其值。程序中的任何函数都可以访问和调用它们。局部变量需要程序员初始化，而全局变量会自动初始化。\n\
  \n## 循环和函数\n\n循环是每种编程语言不可或缺的部分，允许开发者多次执行特定语句。该语言中有 4 种类型的循环如下：\n\n1. `for` 循环：用于执行特定次数的语句，也被认为是处理循环变量的简写代码。\n\
  2. `while` 循环：重复给语句，并在执行循环体之前检查给定条件为真还是假，它检查所有条件。\n3. `do-while` 循环：工作与 `while`\
  \ 循环相同，但它在最后检查条件。\n4. 嵌套循环：另一个循环内部的循环，循环的执行会偏离正常顺序。`break` 语句退出循环并将执行转移到下一语句。\n\n\
  ## 函数\n\n在编程语言中定义函数，建议使用以下语法：\n\n```c\nreturn type name(parameter list)\n{\n   \
  \ // 函数体\n}\n```\n\n在函数中，返回类型是函数本身的数据类型，命名为 `name`。每当调用函数时，我们需要传递参数列表，其值被称为实际参数。参数不是强制性的，因为函数也可以在没有任何参数的情况下执行。函数体包含多个语句。\n\
  \n\n\n\n在程序中调用函数时，我们需要传递参数和函数名。如果函数返回了任何值，也可以将其存储起来。\n\n#### 向函数传递参数的方法\n\n####\
  \ 按值传递（Called by value）\n按值传递的方法用于将参数的实际求值结果复制到函数的形式参数中。对参数的修改不会对函数内部的参数产生直接影响。\n\
  \n#### 按引用传递（Called by reference）\n按引用传递的方法用于将参数的地址复制到形式参数中。对参数的修改会直接影响参数。\n\n###\
  \ 数组、字符串和链表\n\n#### 数组\n数组是元素的集合，可以存储在相同类型的固定大小顺序数据结构中。数组由连续的内存位置组成，可以通过以下语法声明数组：\n\
  \n```\nTyped array[size];\n```\n\n示例：\n\n| 3 | 5 | 6 | 8 | 10 | 20 |\n\n所有数组的第一个元素的索引均为\
  \ 0，这称为基于基的索引（based index）。注意，固定大小的数组在声明后无法更改。在 C 语言中初始化数组，可以使用如下语句：\n\n```\nint\
  \ data[50];\n```\n\n要初始化数组，可以使用下面提到的语法：\n\n```c\nint data[10] = {3, 2, 7, 8, 23,\
  \ 42, 64, 73, 23, 77};\n```\n\n在此数组中，索引=0 的值为 3，而索引=9 的值为 77。\n\n下面是一个使用 C 语言编程中的数组计算\
  \ 5 个整数平均值的示例程序：\n\n```c\n#included <stdio.h>\n\nint main()\n{\n    int avg = 0;\n\
  \    int sum = 0;\n    int x = 0;\n    int enum[4];\n    for (x=0; x<5; x++)\n \
  \   {\n        printf(\"enter number %d\\n\", x+1);\n        scanf(\"%d\", &enum[x]);\n\
  \    }\n    for (x=0; x<5; x++)\n    {\n        sum = sum+enum[x];\n    }\n    avg\
  \ = sum/5;\n    printf(\"average of entered number is: %d\", avg);\n    return 0;\n\
  }\n```\n\n#### 二维和三维数组\n编程语言也支持二维和多维数组。初始化二维数组，我们使用以下语法：\n\n```\nint ez[2][3] =\
  \ {{0,1,2}, {3,4,5}};\n```\n\n或者\n\n```c\nint ez[2][3] = {0,1,2,3,4,5};\n```\n\n\
  ### 字符串\n在编程中，字符串使用一个多维字符数组创建。字符串必须以字符 \"\\0\" 终止。声明字符串数组的大小，我们使用下面提到的语法：\n\n```cchar\
  \ str_name[size];\n```\n\n以下程序用于声明、读取和打印字符串：\n\n```c\n#include <stdio.h>\nint main()\n\
  {\n    char str[10];\n    scanf(\"%s\", str);\n    printf(\"%s\", str);\n    return\
  \ 0;\n}\n```\n\n### 指针和结构体\n指针是存储另一个变量地址的变量。为了声明指针并分配内存地址，我们也声明指针。声明指针的语法如下：\n\n\
  ```\nTyped *ename;\n```\n\n下面是一个使用 C 语言指针编写的示例程序：\n\n```c\n#include <stdio.h>\n\
  int main()\n{\n    int *ptr;\n    q = 100;\n    ptr = &q;\n    printf(\"%d\", *ptr);\n\
  \    return 0;\n}\n```\n\n### 结构体\n结构体是定义的变量集合，允许程序员组合不同的数据类型。作为一种用户定义的数据类型，结构体可以被认为类似于数组，但它们之间唯一的区别是数组只存储相同类型的数据。\n\
  \n以组织管理为例，我们使用结构体来管理员工记录：\n\n* 姓名 (Name)\n* 员工 ID (Eid)\n* 部门 (Department)\n* 区域\
  \ (Region)\n\n在 C 语言中定义结构体的语句是：\n\n```c\nstruct {\n    char name[10];\n    int employee_id;\n\
  \    char designation[50];\n    char region[100];\n};\n```\n\n初始化结构体：\n\n```c\n\
  struct employee = {34,12,52,66};\n```\n\n为了访问结构体成员，我们需要使用运算符。在 C 语言中使用的运算符有：\n\n\
  * 成员运算符 (.)\n* 结构体指针运算符 (->)\n\n访问结构体成员的示例程序：\n\n```c\n#include <stdio.h>\nstruct\
  \ distance {\n    int feet;\n    float inch;\n};\nstruct dist1, dist2, sum;\n\n\
  int main()\n{\n    printf(\"1st distance\\n\");\n    printf(\"enter feet: \");\n\
  \    scanf(\"%d\", &dist1.feet);\n    printf(\"enter inch: \");\n    scanf(\"%f\"\
  , &dist1.inch);\n    return 0;\n}\n```\n\n\n\n\n```c\nprintf(\"2nd distance:\\n%d\\\
  n\", d);\nprintf(\"entered feet:%d\\n\", d);\nscanf(\"%d\", &dist2.feet);\nprintf(\"\
  entered inch:%d\\n\", d);\nscanf(\"%f\", &dist2.inch);\nsum.feet = dist1.feet +\
  \ dist2.feet;\nsum.inch = dist1.inch + dist2.inch;\nwhile (sum.inch >= 12) \n{\n\
  \    sum.feet++;\n    sum.inch = sum.inch - 12;\n}\nprintf(\"sum of distances =\
  \ %d feet-%.1f inch\\n\", sum.feet, sum.inch);\nreturn 0;\n}\n```\n\nOutput:\n\n\
  ![output:image_rsrc9F9.jpg](img/image_rsrc9F9.jpeg)\n\n## 向结构体传递指针\n\n我们也可以在 C 语言编程中定义结构体指针，其方法与定义另一个变量相同。为了访问指针的成员，可以考虑以下语法：\n\
  \n`Struct_pointer->title;`\n\n## C 语言文件\n\n编程要求开发者使用最有效的方法来处理不同的需求和场景。在 C 语言中执行文件处理操作，可以使用以下操作：\n\
  \n* `printf(f)`\n* `scanf()`\n* `read()`\n* `write()`\n* `seek()`\n\n通常情况下，程序终止时所有数据都会丢失，因此我们需要创建一个包含所有数据的特定文件。这还可以节省时间，并允许程序员通过输入少量命令从文件中访问数据，并通过语言运算符将数据从一台计算机传输到另一台计算机。\n\
  \n常见的两种类型是文本文件和二进制文件。文本文件是 `.txt` 文件，可以使用记事本创建，维护和更新记录所需的精力最小。二进制文件以 0 和 1 的二进制形式存储数据。此外，与文本文件相比，二进制文件可以存储更多的数据。\n\
  \n在 C 语言中，我们可以通过下表提到的简单命令创建新文件、打开现有文件、读取和向文件写入信息以及关闭文件：\n\n| 操作 | 语法 |\n| :--- |\
  \ :--- |\n| 打开文件 | `Ptr = fopen(\"fileopen\",\"mode\")` |\n| 关闭文件 | `Fclose(fptr);`\
  \ |\n| 写入二进制文件 | `Fwrite(address_data,size_data,numbers_data,pointer_to_file);`\
  \ |\n| 读取二进制文件 | `Fread(address_data,size_data,numbers_data,pointer_to_file);` |\n\
  | 写入文本文件 | `File *fptr; Fptr = fopen(\"address\",\"w\");` |\n| 读取文本文件 | `File *fptr;\
  \ Fptr = fopen(\"address\",\"r\");` |\n| 文件寻求 | `seek(file, offset, int)` |\n\n\
  让初学者编程更轻松的必备提示：建议他们在代码部分使用 `/* */` 注释写入信息，这还可以提高程序的功能。此外，始终使用 `int`、`char` 和 `float`\
  \ 等变量将使执行不同的计算变得更简单。C 语言由于指针、关键字和运算符的存在而速度很快，高效编写将确保初学者不会遇到问题。\n\n## 第五章：C++\n\n\
  C++ 是一门免费的中间级编程语言，由 Bjarne Stroustrup 于 1979 年开发。作为编程语言的增强版本，C++ 现在已成为最常用且最适合初学者的语言，涵盖了不同的编程风格，并且允许编译器在执行程序前勾勒错误。此外，使用\
  \ C++ 进行面向对象的编程可以方便地解决复杂问题并扩展标准库的使用。C++ 是世界上最流行的编程语言，广泛应用于图形界面、操作系统和嵌入式系统。\n\n##\
  \ 基础语法\n\nC++ 编程语言的基础语法与 C 相同。程序员必须遵循一组预定义的规则来正确执行程序。这是我们开始学习 C++ 时写的第一个程序：\n\n\
  ```cpp\n#include<iostream>\nusing namespace std;\n\nint main()\n{\n    cout << \"\
  my first program in C++\";\n    return 0;\n}\n```\n\n程序输出：my first program in C++.\n\
  \n![output:image_rsrc9FB.jpg](img/image_rsrc9F.jpeg)\n\n![output:image_rsrc9FC.jpg](img/image_rsrc9FC.jpeg)\n\
  \n程序的详情如下：\n\n```cpp\n#include<iostream> // 该语句包含预定义的输入输出函数，并通知编译器包含 iostream 文件。\n\
  using namespace std; // 一个用于存储程序内函数、变量和操作的语句，其中 std 被视为命名空间名称。\nint main() // 这是程序执行开始的主函数。int\
  \ 返回类型指示编译器返回我们所包含的整数值。\ncout << \"my first program in C++\"; // cout 是属于 iostream\
  \ 文件的对象，用于显示内容。\nreturn 0; // 该语句从主函数返回值 0 并结束。\n```\n\n\n\n\n\nC++ 编程语言中存在不同类型的变量。每个变量都通过特定的关键字定义，必须使用该关键字来创建变量、指定类型并按照下面的语法进行赋值：\n\
  \n```\nTyped variable = value;\n```\n\n变量类型：\n\n* `Int` 用于存储整数和全数。例如，`1`、`45`、`6346`。\n\
  * `Char` 用于存储单个字符。例如，`'a'` 或 `'z'`。\n* `Double` 用于存储浮点数。例如，`50.2`、`100.2342`。\n\
  * `Bool` 用于存储具有两种状态的值：`true` 或 `false`。\n* `String` 用于存储文本。例如 \"c++ programming\
  \ language\"。\n\n要声明变量并给其赋值，我们可以遵循下面提到的语法：\n\n```\nInt newnum;\nnewnum = 50;\ncout\
  \ << newnum;\n```\n\nC++ 中使用的每个变量都以唯一的名称命名，这些名称被称为标识符。要构造标识符，名称必须包含字母、数字或下划线，并且区分大小写。\n\
  \n## 数据类型\n\nC++ 编程语言中的数据类型定义了变量中可以存储的数据类型。通常，C++ 中的数据类型分为三类：内置的、派生的和用户定义的。用户定义数据类型包括结构（struct）、联合体（union）和枚举（enum），而派生数据类型是基于数组、函数和指针的。\n\
  \nC++ 内置数据类型：\n\n* `Int`\n* `Char`\n* `Float`\n* `Double`\n* `Bool`\n\n用户定义数据类型：\n\
  \n* `Union`\n* `Enum`\n* `Struct`\n\n派生数据类型：\n\n* `Function`\n* `Array`\n* `Pointer`\n\
  \n### 修饰符类型和存储类\n\nC++ 编程语言中的修饰符与 `char`、`double` 和 `int` 数据类型一起，根据类型顺序更改含义以满足某些编程条件。这些修饰符包括\
  \ `signed`、`unsigned`、`long` 和 `short`。\n\n要在 C++ 程序中定义作用域变量和函数，我们可以使用存储类，如 `auto`、`register`、`extern`、`mutable`\
  \ 和 `static`。`auto` 存储类是所有局部变量的默认类型，而 `static` 类允许编译器在变量超出作用域时仍然保留它们。`extern` 类引用使用的全局变量以及更多的函数或修改的常量成员函数。\n\
  \n### 控制\n\nC++ 语言中的控制是指运行期间指令、函数和语句求值和执行的顺序。语句从上到下顺序执行，直到逻辑完全满足。根据语句，C++ 提供了特定的控制语句：\n\
  \n1. `if else`\n2. `for loop`\n3. `while loop`\n4. `break` & `continue`\n5. `switch\
  \ statement`\n6. `if statement`\n\n当程序中需要执行多个用例（cases）时，使用 if 语句。if 语句的语法显示，只有给定的真语句会被执行，假语句会被自动忽略。\n\
  \n```\nIf(condition){\n  statement;\n}\n```\n\nif 语句的流程图：\n\n```cpp\n#include <iostream>\n\
  Using namespace std;\nint main(){\n  int marks = 80;\n  if(marks < 100){\n    cout\
  \ << \"marks less than 100\";\n  }\n  if(marks > 100){\n    cout << \"marks greater\
  \ than 100\";\n  }\n  return 0;\n}\n```\n\n### 嵌套 if 语句\n\n在 C++ 中，语句中的语句被称为嵌套 if\
  \ 语句。例如：\n\n```cpp\nIf(condition_1){\n  Statement1;\n  If(condition_2){\n    Statement2;\n\
  \  }\n}\n```\n\nif else 语句：\n\n```cpp\nIf(condition_1){\n  Statement;\n}else if(condition_2){\n\
  \  Statement;\n}\n```\n\n### Switch case\n\nC++ 编程中的 switch 语句用于需要对多个用例执行操作的场景。switch\
  \ 语句的语法如下：\n\n```\n#include <iostream>\nusing namespace std;\nint main(){\n  int\
  \ num = 10;\n  while(num > 5){\n    switch(num){\n      case 1:\n        cout <<\
  \ \"case 1\";\n        break;\n      case 2:\n        cout << \"case 2\";\n    \
  \    break;\n      case 3:\n        cout << \"case 3\";\n        break;\n      default:\n\
  \        cout << \"default\";\n    }\n  }\n  return 0;\n}\n```\n\n### Goto 语句\n\n\
  C++ 中的 goto 语句改变程序的执行流，并将控制转移到另一个标记语句。goto 语句的语法：\n\n```\ngoto label;\n```\n\n####\
  \ 循环\n\nC++ 中的循环语句用于重复执行一段代码块，直到满足条件为止。C++ 中的循环类型：\n\n1. `for` 循环\n2. `while` 循环\n\
  3. `do-while` 循环\n\n\n\n\n\n* `while` 循环：检查条件并在满足条件时持续执行循环体。\n* `for` 循环：多次执行特定的语句，并管理循环变量。\n\
  * 嵌套循环：在一个循环内部包含另一个循环。\n\n循环可以通过不同的控制语句执行，例如 `break` 语句、`continue` 语句和 `goto` 语句。\n\
  \n### Functions\n\n函数负责将不同的代码段组合在一起并一起执行，以完成给定的操作。C++ 编程语言中的函数主要分为两种：库函数和用户定义函数。库函数是在\
  \ C++ 中预先定义的，而用户定义函数是由程序员自己创建的。\n\n要定义函数，我们可以使用以下语法：\n\n```\nReturn_type function_name(parameter_list)\n\
  {\n  function_body\n}\n```\n\n`min()` 函数的示例代码：\n\n```cpp\nint main(int enum1, int\
  \ enum2) {\n  //function declaration\n  //local variable declaration\n  int result;\n\
  \  if (num1 < enum2) {\n    result = enum1;\n  } else {\n    result = enum2;\n \
  \ }\n  return result;\n}\n```\n\n### Function calling\n\n在 C++ 中调用函数，可以使用以下方法：\n\
  * 引用传递。\n* 传值调用。\n* 指针传递调用。\n\n### Function overloading\n\n当两个或多个函数具有相同名称但参数不同时，这种处理被称为重载函数。C++\
  \ 中函数重载的语法如下：\n\n```\nvoid samefunction(int a);\nint samefunction(float a0);\nvoid\
  \ samefunction(int a, double b);\n```\n\nArrays, strings, pointers, and references\n\
  \n### Arrays\n\n数组在编程语言中被频繁使用，因为它们允许我们处理海量的同类型数据。通常，数组被视为持有固定数量值的数据集合。\n\nC++ 中声明数组的语法：\n\
  `DataType arrayname[arraysize];`\n\n初始化：\n`int age[5] = {15, 20, 25, 30, 35};`\n\
  \n使用数组计算 10 个数字之和的 C++ 示例程序：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
  int main() {\n  int numbers[10], sum = 0;\n  for (int i = 0; i < 10; i++) {\n  \
  \  cin >> numbers[i];\n    sum += numbers[i];\n  }\n  cout << \"sum = \" << sum;\n\
  \  return 0;\n}\n```\n\n### Strings\n\n字符串被称为字符集合。在 C++ 编程中，使用的字符串类型是标准库类。以下语法用于定义字符串：`char\
  \ str[] = \"\";`\n\n### Pointers\n\n指针是一个存储另一个变量地址的变量。在 C++ 语言中使用指针时，我们需要定义指针并将地址赋值给指针。该操作通过使用一元运算符\
  \ `*` 完成。\n* 空指针\n* 数组指针\n* 指针\n* 将指针传递给函数\n* 函数返回指针\n\n### Object oriented C++\n\
  \nC++ 语言中的类和面向对象编程是创建对象和执行多种操作的简单方法。首先，我们在创建对象之前需要定义类，可以使用以下语法：\n\n```\nclass classname\n\
  {\n  //data\n};\n```\n\n类使用 `public`、`private` 或 `protected` 来定义，以便数据成员只能在程序内特定范围内被访问。\n\
  \n示例代码：\n\n```cpp\nclass student\n{\n  private:\n  char name[20];\n  int rollno;\n\
  \  int total;\n  float perc;\n  public:\n    //获取学生信息的成员函数\n    void getdetails(void);\n\
  \    //打印学生信息的成员函数\n    void putdetails(void);\n};\n```\n\n### Inheritance and polymorphism\n\
  \n在实现继承时，被考虑的类从基类继承数据和函数。派生类可以访问基类的属性以及从现有基类派生的类。继承的语法定义如下：\n\n```cpp\nclass base\n\
  {\n  //...\n};\n\nclass derived : base\n{\n  //...\n}\n```\n\n\n\n\n当 `class` 被继承时，会使用公共访问修饰符。`base\
  \ class` 的公共成员在 `derived class` 中可以被设置为公共或受保护的。受保护成员在 `derived class` 中也会变为受保护的，而\
  \ `base class` 的 `private` 成员仍然保持无法访问。\n\n在 C++ 中使用访问修饰符的语法：\n\n```cpp\nclass myclass\
  \ {\n// public\npublic:\n// access specifier\n// class members\n};\n```\n\n友元函数、数据结构与封装\n\
  \n友元函数\n\n在面向对象编程中，非成员函数没有权限访问对象的 `private` 和 `protected` 数据。为了在这种情况下允许访问 `private`\
  \ 或 `protected` 数据，我们可以使用 `friend function` 或 `friend class`，这允许程序员访问类的 `private`\
  \ 和 `protected` 数据。\n\n该函数通过关键字 `friend` 声明，并应该在类体内部使用。在 `C++` 编程语言中声明 `friend function`，我们可以使用下所示的语法：\n\
  \n```cpp\nclass class_name\n{\n    friend return_type function_name(argument);\n\
  }\n```\n\n数据结构\n\n虽然数据结构需要简明深入并带有细节以明确本主题的主题，但我们将讨论在 C++ 中如何定义和使用结构体（Structured）。结构体是一种用户定义的类型，可以通过以下语法在程序中实现：\n\
  \n```cpp\nstruct [structured_tag]\n{\n    Data member definition;\n}\n```\n\n例如：\n\
  \n```cpp\nstruct vehicle {\n    char ename[50];\n    char category[100];\n    int\
  \ model_year;\n} vehicle;\n```\n\n要访问结构中的任何成员，我们可以使用成员访问运算符 `.`。指向结构体的指针通过数据结构得到了简化，我们可以使用以下语法：\n\
  \n```cpp\nstruct vehicle *struct_pointer;\n```\n\n封装\n\n“封装”（encapsulation）一术语定义为编程中向用户隐藏敏感数据的方法。为了执行封装，我们需要将类变量和属性声明为\
  \ `private`，并通过 `getter` 和 `setter` 方法读取或修改 `private member` 的值。访问私成员的语法定义如下：\n\n\
  ```cpp\n#include <iostream>\nusing namespace std;\n\nclass Example {\nprivate:\n\
  \    // attribute\n    int attribute;\n\npublic:\n    // setter\n    void set(int\
  \ attribute) {\n        attribute = attribute;\n    }\n    // getter\n    int get()\
  \ {\n        return attribute;\n    }\n};\n\nint main() {\n    Example obj;\n  \
  \  obj.set(5000);\n    cout << obj.get();\n    return 0;\n}\n```\n\n文件处理\n\nC++\
  \ 编程语言具有使用文件写入数据的方法。C++ 提供了一个标准库，其中包含了 `fstream` 和 `ifstream` 数据类型。要打开文件，可以使用流对象，例如：`void\
  \ open(const char* filename, ios::openmode);`。关闭文件的语法：`void close();`\n\nC++ 语言特性并支持标准模板库\
  \ (`stl`) 函数，这些函数可以用于快速编写代码。作为一种面向对象的编程语言，我们可以专注于对象并执行不同类型的操作和实现，而无需任何麻烦。与其他主要的编程语言不同，C++\
  \ 还提供了指针支持。由于其快速、可靠和安全的特性，C++ 被广泛应用于操作系统、浏览器、图形和数据库的开发。该语言速度快，并以其速度和效率而闻名。此外，C++\
  \ 还允许异常处理并支持函数重载。\n\n## 第六章：C#\n\n概述与基础语法\n\n概述\n\nC# 是由微软开发的一种编程语言，用于 .NET 框架。该语言基于面向对象的编程方法，并与\
  \ C 和 C++ 等其他现代编程语言具有相同的语法。C# 是一种开发的语言结构 (CLI)，具有运行时环境和编译代码。C# 易于学习，可以在不同平台上生成高效的程序。使用\
  \ .NET 框架的 C# 程序适用于 Windows 应用程序、集成开发环境 (IDE)。\n\n基础语法\n\n在面向对象编程中，C# 关于类和对象。以下面的示例为例，类具有属性；虽然每个类都有相同的，但每个类都有不同的属性。通常，C#\
  \ 程序包含命名空间声明、类、方法：\n\n```csharp\nusing System;\n\nnamespace Example\n{\n    class\
  \ Program\n    {\n        // attribute\n        int attribute;\n\n        public\n\
  \        // setter\n        public void set(int attribute)\n        {\n        \
  \    attribute = attribute;\n        }\n        // getter\n        public int get()\n\
  \        {\n            return attribute;\n        }\n\n        static void main(string[]\
  \ args)\n        {\n            Program obj = new Program();\n            obj.set(5000);\n\
  \            Console.WriteLine(obj.get());\n        }\n    }\n}\n```\n\n\n\n\n\n\
  - 使用 `system`：用于包含程序所需的 `system` 命名空间。\n- 命名空间声明：程序中 `data` 和 `classes` 的集合。\n-\
  \ 类声明：包含程序中所使用的数据和方法的 `class`。\n- 静态 `void main()`：关键字 `static` 表示此方法可以在不实例化类的情况下被访问。\n\
  - `Console.WriteLine()`：用于定义系统命名空间的方法。\n- `Console.ReadKey()`：让计算机等待下一个命令，并防止屏幕直接关闭。\n\
  \n### 数据类型与变量\n\n数据类型是任何编程语言不可或缺的组成，它们指定了语言支持的类型化数据。在 C# 中，数据类型是预定义的，分为三大类：值类型（evaluated\
  \ data types）、引用类型（referenced data types）和对象类型（object types）。\n\n#### 1. 值数据类型\n\
  \n值类型变量派生自 `System.Value` 类，包含字母和数字形式的数据。下表显示了 C# 编程语言中使用的类型：\n\n| 数据类型 | 表示法 |\
  \ 默认值 | 范围 |\n| :--- | :--- | :--- | :--- |\n| Byte | 8 位无符号整数 | 0 | 0 到 255 |\n\
  | Decimal | 128 位精确小数值 | 0.0m | (-7.9e 10²⁸ 到 7.9e 10²⁸) / 10⁰ 到 28 |\n| Bool |\
  \ 布尔值 | False | True/false |\n| Float | 32 位单浮点类型 | 0.0m | -3.4e 10³⁸ 到 +3.4e 10³⁸\
  \ |\n| Double | | 0.0d | (+/-)5.0e 10^-324 到 (+/-)1.7e 10³⁰⁸ |\n| Char | 16 位 unicode\
  \ 字符 | ‘`\\0`’ | U+0000 到 U+ffff |\n| Int | 32 位有符号整数类型 | 0 | -22,147,483,648 到\
  \ 2,147,483,647 |\n| Short | 16 位有符号整数类型 | 0 | -32,768 到 32,667 |\n| Long | 64 位有符号整数类型\
  \ | 0l | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n\n#### 2. 引用数据类型\n\
  \n引用类型存储的是变量的引用而不是实际数据。通过使用多个变量，引用类型可以指向内存位置，当内存位置被一个变量改变时，其他变量的值也会自动改变。\n\n####\
  \ 3. 对象类型\n\n对象类型被认为是 C# 中使用的所有数据类型。此外，对象类型和引用类型也包括自定义类型。\n\n#### 4. 指针类型\n\n指针包含变量的内存地址，语法为：`Type*\
  \ identifier;`\n\n### 运算符\n\nC# 使用运算符的方式与其他编程语言相同，例如 `++`、内置的算术、关系、位运算、逻辑运算符和赋值运算符。\n\
  \n### 函数与方法\n\n在 C# 编程语言中，函数允许程序员封装代码的特定部分，并从代码的其他部分复用。这避免了从多个处访问函数并执行所需操作。C# 中的函数使用以下语法声明：\n\
