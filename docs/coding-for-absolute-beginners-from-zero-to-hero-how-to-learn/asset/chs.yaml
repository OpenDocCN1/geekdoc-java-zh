  \  print(x)\n```\n输出：\n```\napple\nbanana\ncherry\n```\n\n## 函数\n\n什么是函数？函数是用于执行特定任务和操作的组织代码。虽然编程语言提供了内置函数，但开发者也可以创建自己的函数。定义函数的语法如下：\n\
