  \    def inner():\n        nonlocal a\n        a = 'new'\n```\n\n## 模块\n\n模块化编程是将程序的不同组件或部分组织成系统的方法，使得代码更容易理解和实现。这种方法绑定了数据并允许程序员使用引用。在\
