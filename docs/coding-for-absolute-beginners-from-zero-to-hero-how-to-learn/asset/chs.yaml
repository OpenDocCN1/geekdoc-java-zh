  \ `}`\n27. `}`\n\n## 继承与多态 (Inheritance and Polymorphism)\n\n继承是面向对象编程语言的重要部分，允许程序员使用需要相同功能的不同类。继承工作在父类和子类的方法中。父类被视为基类，子类继承其父类的所有功能。\n\
