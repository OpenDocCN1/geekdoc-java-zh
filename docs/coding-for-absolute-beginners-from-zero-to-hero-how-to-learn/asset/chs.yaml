  \n#### 循环\n循环被称为一系列指令，允许程序员通过实现某些条件来执行特定任务。在 Python 编程中，可以使用给定的控制结构来执行多个语句或一组指令。\n\
  \nPython 中的循环类型：\n\n#### While 循环\nwhile 循环用于程序内重复执行某个语句。\n\n```python\n#!/usr/bin/python\n\
