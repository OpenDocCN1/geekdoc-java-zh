  ### 异常处理\n编程语言中处理异常的三方法是 `try`、`except` 和 `finally` 块，用于处理程序执行过程中发生的错误。\n\n####\
  \ Try\n要通过 `try` 块产生异常，可以以下语法：\n\n```python\ntry:\n    print(x)\nexcept:\n    print(\"\
  and exception occurred\")\n```\n\n如果没有抛出错误，示例代码如下：\n\n```python\ntry:\n    print(\"\
  python\")\nexcept:\n    print(\"and exception occurred\")\nelse:\n    print(\"no\
  \ exception occurred\")\n```\n\n#### Finally\n在异常处理中，即使 `try` 块已经抛出异常，`finally`\
  \ 块也会执行。例如：\n\n```python\ntry:\n    print(\"python\")\nexcept:\n    print(\"and\
  \ exception occurred\")\nfinally:\n    print(\"try exception finished\")\n```\n\n\
  ### 自定义异常\n虽然编程语言中有内置异常可以在发生出错时强制执行处理，但开发者也创建了自定义异常以满足他们的需求。新异常是通过 `class` 创建的。\n\
  \n### 学习 Python 的提示\nPython 编程语言适用于对人工智能、机器学习、机器人学和开发感兴趣的程序员。学习编程本身是强制性的，你需要学习基础\
  \ Python 语法。学习方法、途径和语法将使初学者能够开始编码并开发任何类型的应用程序。对于初学者来说，进行小型练习非常有益。它们能培养解决问题的能力并利用他们的编程概念。我写写了一本关于\
  \ Python 的电子书。[Python 初学者入门](https://www.amazon.com/dp/B08DBXX7) [初学者的 Python](https://www.amazon.com/dp/B08DBXX7)\
  \ [Python](https://www.amazon.com/dp/B08DBXX7) [Python](https://www.amazon.com/dp/B08DBXX7)\
  \ [Python](https://www.amazon.com/dp/B08DBXX7) 将帮助你建立坚实的 Python 编程基础。\n\n## 第八章：HTML\n\
  \n### 介绍与概述\n超文本标记语言（HTML）是用于创建网站以显示颜色、字体、图片、媒体和图像的标准标记语言。HTML 由不同的标签组成，这些标签可以描述网页的结构并告诉浏览器在互联网上显示内容。\n\
  \n#### 什么是标签？\n标签向浏览器提供有关任何网页结构、显示和内容的指令。由于它们通过闭合括号 `<>` 定义，因此标签由属性和元素组成。元素是页面上的对象，而属性描述了该对象的细节。记住，标签有开始标签和结束标签，通过\
  \ `</tag>` 进行区分。\n\n使用标签创建的第一个 HTML 页面：\n\n```html\n<html>\n<head>\n<body>\n<h1>my\
  \ heading</h1>\n<p>my paragraph</p>\n</body>\n</html>\n```\n\n### 标签说明\n在上述编写的 HTML\
  \ 文档中，`<html>` 标签封装了整个 HTML 文档，并由其他标签 `<head>`、`<body>` 和 `<p>` 组成。`<head>` 标签代表文件的头部，`<title>`\
  \ 标签用于显示文档标题。`<body>` 包含了用于创建网页的其他标签，例如标题 `<h1>` 和段落 `<p>`。\n\n\n\n\n\n每个 `html`\
  \ `document` 都应该在 `<body>` 标签之后以 `title`、`heading` 和 `paragraph` 开始，下一个要使用的主要 `tag`\
  \ 是 `<h1>` 或 `heading` 标签。根据你的内容需求，`heading` 标签通过 `<h1>` 到 `<h6>` 来定义。例如：\n\n###\
  \ 标题 (Headings):\n\n```html\n<html>\n<body>\n<h1>第一级标题</h1>\n<h2>二级标题</h2>\n<h3>第三级标题</h3>\n\
  <h4>第四级标题</h4>\n<h5>第五级标题</h5>\n<h6>第六级标题</h6>\n</body>\n</html>\n```\n\n输出：\n![image_rsrc9FJ.jpg](img/image_rsrc9FJ.jpeg)\
  \ De\n\n### 段落 (Paragraph)\n\n为了添加内容，我们需要在 `html` `document` 中包含段落。例如：\n\n```html\n\
  <html>\n<head>\n<h1>标题</h1>\n</head>\n<body>\n<p>第一个段落</p>\n<p>第二个段落</p>\n</body>\n\
  </html>\n```\n\n输出：\n标题\n第一个段落\n第二个段落\n\n为了在每个段落之间添加换行符，可以使用换行标签 `<br>`。\n\n###\
  \ 摘要标签 (Summary tag)\n\n为了给段落添加摘要，带有 `summary` 标签的 html 语法定义如下：\n\n```html\n<details>\n\
  <summary>示例文本</summary>\n<p>开发教程</p>\n</details>\n```\n\n### 范围 (Span)\n\n`<span>`\
  \ 标签用于为文本的特定部分着色。例如：\n\n```html\n<p>开发 <span style=\"color:red\">有趣的</span>学习</p>\n\
  ```\n\n### 选择 (Select)\n\n`<select>` 标签用于从下拉列表中选择一个选项。例如：\n\n```html\n<select>\n\
  <option value=\"red\">红色</option>\n<option value=\"blue\">蓝色</option>\n<option value=\"\
  green\">绿色</option>\n<option value=\"white\">白色</option>\n</select>\n```\n\n###\
  \ 表头 (The)\n\n`<thead>` 标签用于创建组头部内容，并与 `<tbody>` 和 `<footer>` 元素一起使用。例如：\n\n```html\n\
  <table>\n  <thead>\n    <tr>\n      <th>课程</th>\n      <th>最高分</th>\n    </tr>\n\
  \  </thead>\n  <tbody>\n    <tr>\n      <td>工程</td>\n      <td>85</td>\n    </tr>\n\
  \    <tr>\n      <td>英语</td>\n      <td>90</td>\n    </tr>\n  </tbody>\n  <footer>\n\
  \    <tr>\n      <td>um</td>\n      <td>80</td>\n    </tr>\n  </footer>\n</table>\n\
  ```\n![image_src9FK.jpg](img/image_src9FK.jpeg)\n\n### 格式标签 (Formatting tags)\n\n\
  html 文档中的文本可以格式化为不同的样式、字体和大小。用于格式化标题、段落和表格的标签如下：\n\n#### 粗体 (Bold)\n\n写在 `<b>` 标签之间的任何文本将以粗体样式显示。例如：\n\
  \n```html\n<p><b>开发</b></p>\n```\n输出：开发\n\n#### 斜体 (Italic)\n\n写在 `<i>` 标签之间的任何文本将以斜体显示。例如：\n\
  \n```html\n<p><i>开发</i></p>\n```\n输出：开发\n\n#### 上标/下标 (Superscript/subscript)\n\n\
  为了以上标形式显示内容，我们使用 `<sup>` 标签，使用 `<sub>` 用于下标。例如：\n\n```html\n<p>这段文本使用了<sup>上标</sup></p>\n\
  ```\n输出：这段文本使用了 (上标)\n\n#### 下划线 (Underline):\n\n写在 `<u>` 和 `</u>` 标签之间的文本将带有下划线\n\
  \n```html\n<p><u>示例文本</u></p>\n```\n输出：示例文本\n\n#### 插入和删除标签 (Insert and deleted\
  \ tags)\n\n为了插入，使用了 `<ins>` 和 `</ins>` 标签；为了删除任何文本，我们使用了 `<del>` 和 `</del>` 标签。\n\
  \n`<ins>插入</ins><del>删除</del>`\n\n### 链接 (Link)\n\n为了在文本中添加链接，我们使用的标签：\n\n```html\n\
  <p><a href=\"document location\">文档</a></p>\n```\n\n### 跑灯标签 (Marquee tag)\n\n`<marquee>`\
  \ 可以配合不同的属性使用，包括 `width`、`height`、`direction`、`behavior`、`scrollamount`、`scrolldelay`、`loop`、`bgcolor`、`hspace`\
  \ 和 `vspace`。marquee 标签的演示：\n\n```html\n<html>\n<head>\n<title>html marquee 标签</title>\n\
  </head>\n<body>\n<marquee>示例文本</marquee>\n</body>\n</html>\n```\n\n### 容器标签 (Container\
  \ tags)\n\n在 html 中，使用以下容器标签来格式化文本：\n\n| 开始标签 | 结束标签 | 功能 |\n| :--- | :--- | :---\
  \ |\n| `<p>` | `</p>` | 段落 |\n| `<span>` | `</span>` | 在段落内添加内联内容 |\n| `<em>` |\
  \ `</em>` | 用于强调文本强调 |\n| `<ol>` | `</ol>` | 有序列表（数字） |\n| `<ul>` | `</ul>` | 无序列表（符号）\
  \ |\n| `<li>` | `</li>` | 列表项 |\n\n### 表格 (Tables)\n\n表格、图像和框架用于以 html 方式格式化信息。为了创建表格，我们使用了以下标签：\n\
  \n```html\n<table>\n  <thead>\n    <tr>\n      <th>头部</th>\n    </tr>\n  </thead>\n\
  \  <tbody>\n    <tr>\n      <td>单元格</td>\n    </tr>\n  </tbody>\n</table>\n```\n\
  \n### 图像 (Images)\n\n图像是任何网站的重要部分。图像用于在 html 中插入图像。插入图像：\n\n```html\n<img src=\"\
  image_url\" />\n<img src=\"desktop/image1.png\" alt=\"示例文本\" />\n```\n\n为了设置图像特定的高度和宽度，我们使用了：\n\
  \n```html\n<img src=\"desktop/image1.png\" alt=\"示例文本\" width=\"100\" height=\"\
  100\" />\n```\n\n### 视频 (Videos)\n\n为了在 html 页面添加视频，我们使用了以下标签：\n\n```html\n<video>\n\
  \  <source src=\"samplevideo.mp4\" type=\"video/mp4\">\n</video>\n```\n\n### 对齐和边框\
  \ (Alignment and border)\n\n网页上有三种对齐图像的位置：居中、右和左。为此，我们使用了 `align` 属性。例如：\n\n```html\n\
  <img src=\"desktop/image1.png\" alt=\"示例文本\" align=\"center\"/>\n```\n\n\n\n\n\n\
  创建图像边框的属性是 `border`。例如：\n\n<img src=\"desktop/images/image1.png\" alt=\"sampled\
  \ image\" border=\"4\"/>\n\n## 框架 (Frames)\n\nHTML 超文本语言框架用于在浏览器窗口中创建多个区域，以便每个区域都可以加载唯一的\
  \ HTML 文档。在页面中使用框架时，应该使用 `<frameset>` 标签代替 `<body>` 标签，可以使用特定的行（rows）和列（columns）属性进行定义。\n\
  \n创建框架的 HTML 标签示例：\n\n```html\n<html>\n<head>\n  <title>html frames</title>\n</head>\n\
  <frameset rows=\"10%,80%,10%\">\n  <framed name=\"top\" src=\"/html/top_frame.htm\"\
  />\n  <framed name=\"main\" src=\"/html/main_frame.htm\"/>\n  <framed name=\"bottom\"\
  \ src=\"/html/bottom_frame.htm\"/>\n  <noframes>\n    <body>your browser does not\
  \ support frames.</body>\n  </noframes>\n</frameset>\n</html>\n```\n\n## 内联框架 (Iframe)\n\
  \n为了创建一个嵌套的浏览上下文，可以使用 `<<iframe>>` 标签将新的 HTML 文档添加到现有的文档中。要创建一个 iframe，可以结合 `<<iframe>>`\
  \ 标签实现以下语法：\n\n```html\n<iframe src=\"https://www.samplewebsite.com\"></iframe>\n\
  ```\n\n基础 HTML 标签完整表格：\n\n| <a> | <abbr> | <acronym> | <address> | <applet> |\n\
  | <area> | <article> | <aside> | <audio> | <b> |\n| <base> | <basefont> | <bdi>\
  \ | <bdo> | <big> |\n| <blockquote> | <body> | <br> | <button> | <canvas> |\n| <caption>\
  \ | <center> | <cite> | <code> | <col> |\n| <colgroup> | <data> | <datalist> | <dd>\
  \ | |\n| <del> | | | | | |\n| <details> | <dfn> | <dialog> | <dir> | <div> |\n|\
  \ <dl> | <dt> | <em> | <embed> | <fieldset> |\n| <figcaption> | <figure> | <font>\
  \ | <footer> | <form> |\n| <frame> | <frameset> | <h1>-<h6> | <head> | <header>\
  \ |\n| <hr> | <html> | <i> | <iframe> | <img> |\n| <input> | <ins> | <kbd> | <label>\
  \ | <legend> |\n| <li> | <link> | <main> | <map> | <mark> |\n| <meta> | <meter>\
  \ | <nav> | <noframes> | <noscript> |\n| <object> | <ol> | <optgroup> | <option>\
  \ | <output> |\n| <p> | <param> | <picture> | <pre> | <progress> |\n| <q> | <rp>\
  \ | <rt> | <ruby> | <s> |\n| <samp> | <script> | <section> | <select> | <small>\
  \ |\n| <source> | <span> | | <strong> | <style> |\n| <sub> | <summary> | <sup> |\
  \ <svg> | <table> |\n| <tbody> | <td> | <template> | <textarea> | <tfoot> |\n| <th>\
  \ | <thead> | <time> | <title> | <tr> |\n| <track> | <tt> | <u> | <ul> | <var> |\n\
  | <video> | <wbr> | | |\n\n## 表单 (Forms)\n\nHTML 表单在用户编辑时具有交互性。表单通过此类字段、按钮、选择框和可点击控件创建。通过表单收集的数据将发送到服务器进行处理。创建表单的语法\
  \ `action` 和 `method` 描述数据发送的位置：\n\n```html\n<form action=\"url\" method=\"get|post\"\
  >\n  input, buttons, etc.\n</form>\n```\n\n从用户获取输入的表单：\n\n```html\n<html>\n<head>\n\
  \  <title>my first form</title>\n</head>\n<body>\n  <form>\n    <label for=\"course\"\
  >course:</label>\n    <input type=\"text\" name=\"course\">\n    <br>\n    course:\
  \ <input type=\"text\" name=\"last\">\n  </form>\n</body>\n</html>\n```\n\n输出：![image_rsrc9FM.jpg](img/image_rsrc9FM.jpeg)\n\
  \n## 文本字段 (Text fields)\n\nHTML 中的文本字段允许用户向表单输入文本。创建文本字段的标准语法定义如下：\n\n```html\n\
  <input type=\"text\">\n<input type=\"text\">\n```\n\n## 按钮控件 (Button controls)\n\
  \n在表单中有多种提交数据的方法。你可以通过以下 HTML 标签添加可点击按钮：\n\n```html\n<input type=\"submit\" name=\"\
  submit\">\n<input type=\"reset\" name=\"reset\">\n<input type=\"button\" name=\"\
  button\">\n```\n\n输出：![image_rsrc9FN.jpg](img/image_rsrc9FN.jpeg)\n\n## 选择框 (Select\
  \ box)\n\n要在 HTML 表单中创建下拉列表，使用 `<select>` 和 `<option>` 元素。例如：\n\n```html\n<html>\n\
  <head>\n  <title>field upload</title>\n</head>\n<body>\n  <form>\n    <label for=\"\
  course\">course:</label>\n    <select name=\"course\" id=\"course\">\n      <option\
  \ value=\"web engineering\">web engineering</option>\n      <option value=\"calculus\"\
  >calculus</option>\n      <option value=\"data science\">data science</option>\n\
  \    </select>\n  </form>\n</body>\n</html>\n```\n\n输出：![image_rsrc9FP.jpg](img/image_rsrc9FP.jpeg)\n\
  \n## 选择框 (Select box)\n\nselect 元素允许在表单排列多个选项。例如：\n\n```html\n<html>\n<head>\n \
  \ <title>course</title>\n</head>\n<body>\n  <form>\n    <select name=\"course\"\
  >\n      <option value=\"math\">math</option>\n      <option value=\"physics\">physics</option>\n\
  \    </select>\n  </form>\n</body>\n</html>\n```\n\n输出：![image_rsrc9FR.jpg](img/image_rsrc9FR.jpeg)\n\
  \n## 设计 (Designing)\n\nHTML 的背景颜色默认为白色。要更改背景颜色，可以使用以下标签：\n\n```html\n<table bgcolor=\"\
  green\">\n<table bgcolor=\"#f1f1f1\">\n```\n\n## 字体 (Fonts)\n\n字体是内容可读性的重要部分。可以使用包含在\
  \ `<font>` 标签中的字体大小、颜色。设置字体大小的标签为：\n\n```html\n<font size=\"14\"></font>\n```\n\n\
  更改字体的属性为：\n\n```html\n<font face=\"times new roman\" size=\"14\"></font>\n```\n\n\
  ## 字体颜色 (Font color)\n\n要更改字体颜色，使用以下标签和属性：\n\n```html\n<font color=\"blue\">this\
  \ text</font>\n```\n\n输出：此文本是蓝色的\n\n\n\n\n\n## 标记文本\n\n写在 `<mark>` 和 `</mark>` 元素之间的文本将以黄色标记显示。\n\
  \n例如：\n\n`<p>this text is marked as <mark>yellow</mark></p>`\n\n输出：this text is\
  \ marked as yellow.\n\n## 元数据标签 (Meta tags)\n\n在 HTML 中，元标签可以用于为网页添加元数据。元标签的属性包括\
  \ `name`、`content`、`scheme` 和 `http-equiv`。我们可以使用 `<meta>` 标签为文档提供简短描述，这还可以提高你网页的搜索引擎索引。\n\
  \n例如：\n\n```html\n<html>\n\n<head>\n\n<title>meta tags example</title>\n\n`<meta\
  \ name=\"keywords\" content=\"html, meta tags, metadata\"/>`\n\n`<meta name=\"description\"\
  \ content=\"meta tags.\"/>`\n\n`<meta name=\"revised\" content=\"3/7/2019\"/>`\n\
  \n`<meta http-equiv=\"cookie\" content=\"userid=abc; expires=monday, 08-sep-19 23:59:59\
  \ gmt;\"/>`\n\n</head>\n\n<body>\n\n`<p>welcomed to html</p>`\n\n</body>\n\n</html>\n\
  ```\n\n## 注释\n\n若要在 HTML 代码中放置注释，应遵循以下语法：\n\n```html\n<html>\n\n<head><!-- document\
  \ header starts --><!--\n\n<title>document title</title>\n\n</head><!-- document\
  \ header ends --><!--\n\n<body>\n\n`<p>document content goes here.....</p>\n\n</body>\n\
  \n</html>\n```\n\n## HTML 样式表\n\n为了进一步对 HTML 文档进行进一步设计，层叠样式表 (CSS) 被应用于每个网站。它们提供了一种简单、有效且易于维护的替代方案，用于为每个网站指定某些属性。我们将在下一章中详细讨论\
  \ CSS。\n\n## 布局与响应式\n\nHTML 包含了各种类型的语义化元素，用于定义网页的不同部分。这些元素包括 `header`、`container`、`section`、`article`、`aside`、`details`\
  \ 和 `footer`。虽然 CSS 是设计网页布局的最佳方法，但也可以通过这些 HTML 元素完成该过程。\n\n响应式网页设计是通过使用 HTML 和 CSS\
  \ 创建的。该过程会自动调整网站的大小和布局，使其在桌面电脑、智能手机和平板等所有设备上看起来都非常合适。关于响应式的更多细节，学习 Bootstrap 将提供极大的优势。\n\
  \nHTML 模板是开发网站的一种快速方便的方法。使用模板允许开发者修改和添加所需的功能。使用 HTML 模板最大的优势是它们最适合那些不能设计吸引人的网站的人。\n\
  \n## 使用 HTML 的提示\n\n即使在我们讨论了 HTML 的所有标签、属性和功能之后，还有其他重要方面可以让你的网站高效高效。在使用起始标签时，务必在编写元素和属性之前编写对应的结束标签。例如，`<p>`\
  \ 将确保你的 HTML 页面在所有浏览器上正常工作，并尝试通过 CSS 为页面设置样式。\n\n在发布到互联网之前，运行 HTML 验证器。此活动将提前发现任何错误或缺失的标签，以免你的网站在发布后无法运行。此外，请注意图像或视频的格式，因为它们在上传到互联网时有时会被破坏。在图像标签中指定宽度和高度可以帮助你解决这个问题。\n\
  \n虽然表格是页面上布局内容的一种简单方法，但你应该关注 CSS 规则并通过 CSS 构建页面内容。这不仅将更好的方式格式化你的网站，你还可以从 CSS 定位和提高网站的响应式中受益。\n\
  \n## 第九章：CSS\n\n### 什么是 CSS？\n\nCSS 代表“层叠样式表”（cascading stylesheet），负责控制文档的样式、设计和外观。它允许你使用\
  \ CSS 来设置网站的外观，这增加了文档的灵活性。通过使用 CSS，你可以在不更改 HTML 元素的情况下更改颜色、字体布局。学习 CSS 和 Bootstrap\
  \ 将提供极大的优势。\n\n\n\n\n\n内部 CSS 在单个文档中实现，以赋予其独特的样式。请记住，它必须嵌入在 `head>` 部分内。\n\n###\
  \ 内部 CSS 语法\n\n实现内部 CSS 的语法如下：\n\n```html\n<head>\n  <title>internal css</title>\n\
  \  <style>\n    selector {\n      property:value;\n    }\n  </style>\n</head>\n\
  ```\n\n## 外部 CSS\n\n外部 CSS 有一个独立的文件，其中仅包含样式属性以及属性。外部 CSS 文件需要使用 `link` 标签与 HTML\
  \ 文档链接。\n\n### 外部 CSS 示例：\n\n```css\nbody {\n  background-color:green;\n}\n\n.main\
  \ {\n  Text-align:center;\n}\n\n.gfg {\n  color:#009900;\n  font-size:50px;\n  font-weight:bold;\n\
  }\n```\n\n## 基础语法和在 HTML 中的引入\n\nCSS 由若干样式规则组成，这些规则由浏览器解释并应用于网页。通常，样式规则由三个关键元素组成：选择器（selector）、属性（property）和值（value）。\n\
  \n选择器和经过 CSS 样式的 HTML 标签可以应用，例如 `<h1>`，其中属性（如 color）赋值给 HTML 标签。值被分配给属性。创建 CSS 样式规则的基础语法定义如下：\n\
  \n```css\nselector{property:value}\n```\n\n通常使用内联和外部 CSS 方法将样式与 HTML 文档关联，其中 `<style>`\
  \ 元素位于 `<head>` 和 `</head>` 标签之间。在 HTML 文档中包含 CSS 的语法定义如下：\n\n```html\n<html>\n\
  \  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" media=\"all\">\n    <style>\n\
  \      body {\n        background-color:grey;\n      }\n      h1 {\n        color:white;\n\
  \        margin-left:40px;\n      }\n    </style>\n  </head>\n  <body>\n    <h1>Sample\
  \ heading</h1>\n    <p>Sample paragraph</p>\n  </body>\n</html>\n```\n\n![image_rsrc9FU.jpg](img/image_rsrc9FU.jpeg)\n\
  \n## 导入 CSS 文件\n\n要导入外部样式表，可以实现以下规则：\n\n```html\n<head>\n  @import url(\"url\");\n\
  </head>\n```\n\n### 颜色和背景\n\n在 CSS 中，颜色可以通过名称或不同类型的值定义。要指定颜色代码，可以使用的格式详述如下：\n\n\
  | 名称 | 语法 |\n| :--- | :--- |\n| 关键字 | Green, blue, etc. |\n| Hex 代码 | #rrggbb |\n\
  | Rgb% | Rgb(r%, g%, b%) |\n| Rgb 绝对值 | Rgb(r, g, b) |\n| 短 Hex 代码 | #rgb |\n\n\
  例如，我们使用以下语法：\n\n```css\nh1{color:green}\n```\n\n### 背景\n\n可以定义的背景属性包括背景颜色，使用以下 CSS\
  \ 语法：\n\n```css\nbody {\n  background-color;\n}\n\nbody {\n  background-image:url(\"\
  image.gif\");\n}\n\nbody {\n  background-image:url(\"gradient_image.gif\");\n}\n\
  \nbody {\n  background-image:url(\"image.jpg\");\n  background-repeat:no-repeat;\n\
  }\n\nbody {\n  background-image:url(\"image.jpg\");\n  background-position:center;\n\
  }\n```\n\n## 格式和边框设计\n\nBorder 属性可以定义唯一的颜色和宽度，用于创建点、实线、虚线、凹槽、双线、内嵌、偏移、隐藏、脊形和无边框。创建边框样式的语法：\n\
  \n```css\n.dotted{border-style:dotted}\n.solid{border-style:solid}\n.dashed{border-style:dashed}\n\
  .grooved{border-style:groove}\n.double{border-style:double}\n.inset{border-style:inset}\n\
  .offset{border-style:offset}\n.hidden{border-style:hidden}\n.ridged{border-style:ridged}\n\
  .none{border-style:none}\n```\n\n### 高和宽\n\n在 CSS 中使用了 height 和 width 属性。Margin\
  \ 属性用于设置每个侧不同的外边距。Margin 属性有不同的值，如长度、宽度和 margin，由浏览器计算。\n\n语法：\n\n```css\nbody {\n\
  \  margin:size;\n}\n```\n\n### 内边距 (Padding)\n\nCSS padding 用于定义元素周围创建的边框。在 HTML\
  \ 网站上设置单个侧（如上、右、下、左）内边距的其他不同方法。Padding 有长度和宽度值，并实现以下 CSS 语法：\n\n```css\nbody {\n\
  \  Padding:size;\n}\n```\n\n### 字体和文本\n\nCSS 中的 font 属性用于指定其他字体属性并设置字体内容。样式中包含的不同字体属性包括族（family）、字重（weight）、变体（variant）、字重（weight）和大小（size）。\n\
  \n\n\n\n\n![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\n## 文本\n\n现在可以通过 css 属性将文本转换为不同的颜色、样式和缩进。这些属性包括：\n\
  \n*   文本颜色：更改文本的颜色。\n*   文本对齐：指定文本的水平或垂直对齐方式。\n*   文本装饰：轮勒文本的装饰样式。\n*   文本转换：控制文本的大小写。\n\
  *   文本缩进：指定第一行的缩进。\n*   字间距：增加或减少单词（或字母）之间的间距。\n*   行高：指定行高。\n*   文本方向：设置书方向。\n\
  *   单词间距：设置单词之间的空间。\n*   文本投影：在文本上添加阴影效果。\n\n## css 文本属性的语法：\n\n### 文本颜色\n```css\n\
  Body {\n  color: red;\n}\n```\n\n#### 文本对齐\n```css\nH1 {\n  Text-align: center;\n\
  }\n\nH2 {\n  Text-align: left;\n}\n\nH3 {\n  Text-align: right;\n}\n```\n\n### 文本装饰\n\
  ```css\nH1 {\n  Text-decoration:overline/underline/line-through;\n}\n```\n\n###\
  \ 文本转换\n```css\nP.uppercased {\n  Text-transform: uppercase;\n}\n\nP.lowercased\
  \ {\n  Text-transform: lowercase;\n}\n\nP.capitalized {\n  Text-transform: capitalize;\n\
  }\n```\n\n### 文本缩进\n```css\nP {\n  text-indent: 100px;\n}\n```\n\n### 字间距\n```css\n\
  H1 {\n  Letter-spacing: 3px;\n}\n\nH2 {\n  Letter-spacing: -3px;\n}\n```\n\n###\
  \ 行高\n```css\nP.small {\n  Line-height: 0.6;\n}\n\nP.big {\n  Line-height: 1.6;\n\
  }\n```\n\n### 文本方向\n```css\nP {\n  Direction: rtl;\n}\n```\n\n### 文本投影\n```css\n\
  H1 {\n  text-shadow: 4px 3px green;\n}\n```\n\n### 单词间距\n```css\nH1 {\n  Word-spacing:\
  \ 10px;\n}\n\nH2 {\n  Word-spacing: -5px;\n}\n```\n\n## 链接、表格和页边距\n\n### 链接\n这里有通过\
  \ css 实现超链接的不同 css 属性。这些属性包括：`:link`, `:visited`, `:hover` 和 `:active`。实现 `link`\
  \ 属性的 css 语法定义如下：\n\n```html\n<style type=\"text/css\">\nA:link {color: #000000}\n\
  A:visited {color: #006600}\nA:hover {color: #ffcc00}\nA:active {color: #ff00cc}\n\
  </style>\n```\n\n### 表格\n这里用于转换和设计 html 表格的不同 css 属性。\n\n*   框合并\n*   框间距\n*   标题位置\n\
  *   空单元格\n*   表格布局\n\n使用 css 创建简单表格的语法：\n\n```html\n<html>\n<body>\n<table class=\"\
  table\" border=\"1\">\n  <tr>\n    <th>first name</th>\n    <th>last name</th>\n\
  \    <th>marks</th>\n  </tr>\n  <tr>\n    <td>john</td>\n    <td>harry</td>\n  \
  \  <td>40</td>\n  </tr>\n</table>\n</body>\n</html>\n```\n\n#### 输出：\n![image_rsrc9FW.jpg](img/image_rsrc9FW.jpeg)\n\
  \n#### 框合并\n```html\n<head>\n  <style type=\"text/css\">\n  table.one {border-collapse:collapse;}\n\
  \  table.two {border-collapse:separate;}\n  td.ad {\n    border-style:dotted;\n\
  \    Border-width:3px;\n    Border-color:#000000;\n    padding:10px;\n  }\n  td.bd\
  \ {\n    Border-style:solid;\n    Border-width:3px;\n    Border-color:#333333;\n\
  \    Padding:10px;\n  }\n  </style>\n</head>\n```\n\n#### 框间距\n```html\n<head>\n\
  \  <style type=\"text/css\">\n  table.one {border-collapse:collapse;}\n  table.two\
  \ {border-collapse:separate;}\n  td.ad {\n    border-style:dotted;\n    Border-width:3px;\n\
  \    Border-color:#000000;\n    padding:10px;\n  }\n  td.bd {\n    Border-style:solid;\n\
  \    Border-width:3px;\n    Border-color:#333333;\n    Padding:10px;\n  }\n  </style>\n\
  </head>\n```\n*(注：提供的文本包含输出的重复/乱码块；我已根据内容的逻辑清理了结构）\n\n#### 输出：\n![image_rsrc9FX.jpg](img/image_rsrc9FX.jpeg)\n\
  \n#### 文本对齐\n```css\n.top {vertical-align: top}\n.bottom {vertical-align: bottom}\n\
  .left {vertical-align: left}\n.right {vertical-align: right}\n```\n\n#### 空\n```css\n\
  .empty {\n  width: 350px;\n  border-collapse: separated;\n  empty-cells: hidden;\n\
  }\n.empty {\n  padding: 5px;\n  border-style: solid;\n  border-width: 1px;\n  border-color:#999999;\n\
  }\n```\n\n#### 表格布局\n```css\ntable.auto {\n  table-layout: auto;\n}\ntable.fixed\
  \ {\n  table-layout: fixed;\n}\n```\n\n#### 页边距\n```css\n.link {\n  margin: 10px;\n\
  \  border: 1px solid black;\n}\n```\n\n#### 列表、图标和下拉菜单\n这里有不同类型的列表：有序列表和无序列表。有序列表使用数字或字母标记列表项，而无序列表通常使用项目符号标记。这些列表通过\
  \ circle, decimal, lower-roman, upper-roman, decimal-zeros, lower-alpha, upper-alpha\
  \ 和 square 等值来创建。\n\n\n\n\n\n\n# CSS 有序列表与无序列表\n\n无序列表\n* 一个\n* 两个\n* 三\n* 一个\n\
  * 两个\n* 三\n\n有序列表\nA. 一个\nB. 两个\nC. 三\n1. 一个\n2. 两个\n3. 三\n\n## 图标\n\n通过使用 HTML\
  \ 中的图标库，我们也可以通过 CSS 添加不同类型的图标。例如 Bootstrap Awesome 和 Google 图标。\n\n### Font Awesome\
  \ 语法：\n```html\n<link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n```\n\n### Bootstrap 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
  >\n```\n\n### Google 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
  >\n```\n\n### 示例：\n\n```html\n<!DOCTYPE>\n<html>\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n</head>\n<body>\n<h1>css icons</h1>\n<i class=\"fa fa-cloud\" style=\"font-size:32px;\"\
  ></i>\n<i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n<i class=\"fa fa-file\"\
  \ style=\"font-size:32px;\"></i>\n<i class=\"fa fa-car\" style=\"font-size:32px;\"\
  ></i>\n</body>\n</html>\n```\n\n\n\n\n\n# 零基础编程指南\n\n在开发 Web、插件、桌面应用、订单以及移动应用程序时，Java\
  \ 语言被认为被广泛使用，因为它提供了完善的支持和功能。HTML、CSS 和 PHP 是 Web 和网站开发的核心语言，初学者可以轻松学习。作为一名读者，或以程序员的身份阅读时**不应将自己局限于只读一种语言**，而应该尝试学习最新的技术和实现方法。\n\
  \n## 多种计算机编程语言\n\n存在多种计算机编程语言，它们用于解决特定的问题。为了让事情变得简单，学者可以观察如何提高技能，并选择最适合且易于实现的编程语言。编程取决于其他几个因素，如应用程序的可用性、安全性、兼容性和响应时间。\n\
  \n## 高效编程贴士\n\n虽然编写易于理解的代码并满足程序需求是计算机编程的主要部分，但也有一些本质的技巧和方法可以提高程序员的效率。从最关键的点开始考虑，程序员应该避免向函数传递长参数列表，并尽量尝试使用\
  \ `int`、指针或避免使用函数类型。此外，不要将字符转换为另一种数据类型，因为硬编码变量可能位于帧的任何位置。\n\n此外，绝不能用小函数初始化全局变量，并尽量减少对浮点数进行数学运算。这将减少执行时间并消耗更少的内存。当代码达到数千行时，全局变量和循环会使程序员难以处理应用程序，导致微小的变化就会产生巨大的问题。\n\
  \n在方法或函数内部编写 `switch` 分支、语句、循环和 `try-catch` 是一种理想的方法。记住，方法也应该写在类和函数定义内部。此外，通过使用合适的结构来组织应用程序是一个很好的方法，也能提高代码标准。\n\
  \n最后但同样重要的是，还应该考虑版本控制软件，以提高应用程序性能并交付更新。虽然并不是所有程序员都使用，但此类工具让初学者更容易学习和使用。在编写代码时，避免深度嵌套和限制长度会使代码难以阅读。\n\
  \n## 强化基础技能\n\n要成为一名优秀的程序员，学习所有基础知识是强制。了解基础算法和数据结构是提高问题解决能力的极方法。此外，编写测试是另一种提升思维和编码技能的有效方法。编写代码后，进行深度审查并发现任何错误或改进空间是非常有意义的，要使用正确的命名规范并无障碍地替换变量。记住，为应用程序创建特定的文件夹对于轻松维护和调试具有巨大好处。学习编程基础是培养强大的开发和分析能力的关键方面。此外，尝试通过解决编程练习和编写简单代码来实现你的编码技能。这不仅会提高你的编程技能，你还能开发出高效有效的新解决方案。花时间学习编程基础也更容易适应最新的技术并学习新的编程方法。通过学习和实现新的方法、函数和方案，可以让编程变得有趣。\n\
  \n## 结论\n\n《零基础编程指南》的设计和编写旨在为初学者提供宝贵的知识、信息和原则。本电子书涵盖了主流编程语言，并为实施给概念和发现提供了正确的指南。\n\
  \n编写计算机代码要求开发者遵循预定义的语法和流程。根据语言的不同，代码的长度可能会因为可用工具和技术的有所不同。计算机编程包含多个任务，包括编写代码、测试、实现系统、方法和调试。\n\
  \n"
