  \ 27。\nviii)错误。这等同于 ![Image](img/chapter12-08.png)。\n\n### 练习题 12.1-2 在 Java 中编写数学表达式\n\
  \n编写一个 Java 程序，计算以下数学表达式：\n\n![Image](img/chapter12-09.png)\n\n### 答案\n\n首先，你必须区分数据输入和输出结果。显然，输出结果被赋值给\
