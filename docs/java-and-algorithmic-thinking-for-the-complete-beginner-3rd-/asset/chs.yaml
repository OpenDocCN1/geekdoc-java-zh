  \ |   |  |\n\n## 第 6 章\n## 输入与输出的处理\n\n### 6.1 如何向用户屏幕输出消息和结果？\n\n流程图使用斜平行四边形和保留字“Write”（写入）来向用户屏幕显示消息或最终结果。\n\
  \n.![Image](img/chapter06-01.png)\n\n其中 `arg1`、`arg2` 和 `arg3` 可以是变量、表达式、常量值或用双引号括的字母数字值。\n\
  \n你刚刚看到的平行四边形等同于以下流程图片段。\n\n.![Image](img/chapter06-02.png)\n\n在 Java 中，你可以使用 `System.out.print`\
  \ 语句来实现相同的结果。它的通用形式是：\n\n```\nSystem.out.print(arg1 + arg2 + arg3 + … );\n```\n\n\
  或者等价的语句序列\n\n```\nSystem.out.print(arg1);System.out.print(arg2);System.out.print(arg3);…\n\
  ```\n\n以下代码片段：\n\n```\na = 5;b = 6;c = a + b;System.out.print(\"The sum of 5 and\
  \ 6 is \" + c);\n```\n\n显示了图 6–1 所示的消息。\n\n.![Image](img/chapter06-03.png)\n\n图\
  \ 6–1 在屏幕上显示的字符串和整数\n\n![](img/remember.jpg)在 Java 中，如果你想在屏幕上显示一个字符串，该字符串必须用双引号括起来。\n\
  \n![](img/notice.jpg)在最后一个 Java 代码片段中，注意第一个字符串末尾的空格字符，紧跟在单词“is”之后。如果你删除它，数字 11 将离最后一个单词靠得太近，屏幕上的输出将是\n\
  \nThe sum of 5 and 6 is11\n\n数学表达式的结果也可以直接在 `System.out.print` 语句中计算。以下代码片段显示的消息与图\
  \ 6–1 完全相同。\n\n```\na = 5;b = 6;System.out.print(\"The sum of 5 and 6 is \" + (a\
  \ + b));\n```\n\n![](img/remember.jpg)注意，Java 要求所有语句必须以分号结束。\n\n### 6.2 如何输出特殊字符？\n\
  \n仔细看下例示例：\n\n```\npublic static void main(String[] args) throws Exception {System.out.print(\"\
  Hello\");System.out.print(\"Hallo\");System.out.print(\"Salut\");}\n```\n\n尽管你可能认为这三条消息是一个接一个显示，但实际的输出结果如图\
  \ 6–2 所示。\n\n.![Image](img/chapter06-04.png)\n\n图 6–2 输出结果显示在一行\n\n为了输出“换行”，你必须在每个单词之后放置特殊字符序列\
  \ `\\n`。\n\n```\npublic static void main(String[] args) throws Exception {System.out.print(\"\
  Hello\\n\");System.out.print(\"Hallo\\n\");System.out.print(\"Salut\\n\");}\n```\n\
  \n或者如下所示使用 Java 语句 `System.out.println`\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {System.out.println(\"Hello\");System.out.println(\"Hallo\"\
  );System.out.println(\"Salut\");}\n```\n\n![](img/notice.jpg)注意是 `println` 而不是 `print`。`System.out.println()`\
  \ 语句在输出末尾添加一个“换行”。\n\n输出结果现在出现在图 6–3。\n\n.![Image](img/chapter06-05.png)\n\n图 6–3\
