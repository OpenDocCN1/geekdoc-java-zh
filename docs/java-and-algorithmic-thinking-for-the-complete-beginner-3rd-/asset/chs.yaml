  ### 练习 34.5-7 检查一个值是否存在于所有列\n\n编写一个 Java 程序，让用户向一个 20×30 的数组输入数值。在输入所有数值后，程序让用户输入一个值。如果该值在数组的每一列中至少出现一次，则显示一条消息。\n\
  \n#### 解决方案\n\n此练习可以使用线性搜索和计数器 `count` 来解决。Java 程序遍历第一列；如果找到了用户提供的值，程序随后停止搜索第一列，`count`\
  \ 加 1。然后，程序遍历第二列；如果再次找到了用户提供的值，程序停止搜索第二列，`count` 再次加 1。这个过程一直持续到检查完所有列。过程结束后，如果\
  \ `count` 等于列的总数，说明用户提供的值在数组的每一列中都至少存在一次。\n\n让我们使用“从内层到外层”的方法。以下代码片段搜索数组的第一列（列索引为\
  \ 0），如果找到了用户提供的值，执行流退出循环且 `count` 加 1。\n\n```java\nfound = false;\nfor (i = 0; i\
  \ <= ROWS - 1; i++) {\n    if (haystack[i][j] == needle) {\n        found = true;\n\
  \        break;\n    }\n}\nif (found) {\n    count++;\n}\n```\n\n现在你可以将此代码嵌套在一个遍历所有列的循环中：\n\
  \n```java\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n    for (i\
  \ = 0; i <= ROWS - 1; i++) {\n        if (haystack[i][j] == needle) {\n        \
  \    found = true;\n            break;\n        }\n    }\n    if (found) {\n   \
  \     count++;\n    }\n}\n```\n\n你几乎准备好了——但要注意一个小细节！如果内层循环没有在某一列找到用户提供的值，外层循环必须停止迭代。因为该用户提供的值在至少某一列中不存在，继续下去是没意义的。因此，更好的方法是在外层循环中使用\
  \ `break` 语句，如下代码所示：\n\n```java\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found\
