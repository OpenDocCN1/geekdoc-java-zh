  , true);\n    for (i = 1; i <= 10; i++) {\n        fout.write(\"Line \" + i + \"\
  \\n\");\n    }\n    fout.close();\n}\n```\n\n### 40.5 文件指针\n\n如前所述，文件指针与数组的索引非常相似。它们都用于指定读取信息的位置或写入新信息的位置。然而，文件指针和数组索引之间的主要区别在于，在每次执行读取或写入操作时，前者会自动移动。\n\
  \n假设一个文件已经包含了消息“HELLO JOHN\\nHI ALL!”。如果你打开这个特定的文件进行读取，文件指针将自动放置在文件的开头，如下所示。\n\n\
  ![Image](img/chapter40-01.png)\n\n如果你现在执行读取操作（如下一节所述），读取将从文件指针指示的位置开始，指针将自动向末尾移动，移动的位移等于你读取的字符数。下面是你从文件中读取一行后，文件指针将所在的位置。\n\
  \n![Image](img/chapter40-02.png)\n\n![](img/notice.jpg)后续的读取操作将从单词“HI”开始的位置开始。\n\
  \n相反，如果你以追加模式打开文件，文件指针将自动定位在文件的末尾，如此处所示：\n\n![Image](img/chapter40-03.png)\n\n如果你随后执行写入操作，写入将从文件指针指示的位置开始，指针将自动向末尾移动，移动的位移等于你在文件中写入的字符数。\n\
  \n![Image](img/chapter40-04.png)\n\n### 40.6 从文件中读取内容\n\n假设文件 `f_data40.6.txt` 包含以下文本：\n\
  \n15.3 15 Round the number down\n22.6 23 Round the number up\n55.5 56 Round the\
  \ number up again\n\n#### 读取到当前行末尾\n\n要从文件的当前位置读取到当前行的末尾的所有字符并将它们赋值给变量 `var_name_str`，你可以使用通用形式给出的语句：\n\
  \n`var_name_str = descriptor.nextLine()`\n\n其中\n\n* `descriptor` 是用于打开文件的文件对象的名称。\n\
  * `var_name_str` 可以是任何 `String` 类型的变量。\n\n接下来的程序将文件 `f_data40.6.txt` 的三行赋值给变量 `s1`、`s2`\
  \ 和 `s3`。\n\n![](img/my_exercise_header.png)\n\n**Project_40.6a**\n\n```java\nstatic\
  \ final String PATH = \"c:/temp/\";\npublic static void main(String[] args) throws\
  \ Exception {\n    String s1, s2, s3;\n    Scanner fin = new Scanner(Paths.get(PATH\
  \ + \"f_data40.6.txt\"));\n    s1 = fin.nextLine();\n    s2 = fin.nextLine();\n\
  \    s3 = fin.nextLine();\n    fin.close();\n    System.out.println(s1);  //它显示:\
  \ 15.3 15 Round the number down\n    System.out.println(s2);  //它显示: 22.6 23 Round\
  \ the number up\n    System.out.println(s3);  //它显示: 55.5 56 Round the number up\
  \ again\n}\n```\n\n#### 读取一个值\n\n要从文件的当前位置读取到第一个空格字符或当前行的末尾（以先到者为准）并赋值给变量，你可以使用通用形式给出的以下语句之一：\n\
  \n`var_name_int = descriptor.nextInt();`\n`var_name_dbl = descriptor.nextDouble();`\n\
  \n其中\n\n* `descriptor` 是用于打开文件的文件对象。\n* `var_name_int` 可以是任何 `int` 类型的变量。\n* `var_name_dbl`\
  \ 可以是任何 `double` 类型的变量。\n\n以下程序将文件 `f_data40.6.txt` 的前两个值赋值给变量 `d1` 和 `i1`。\n\n\
  ![](img/my_exercise_header.png)\n\n**Project_40.6b**\n\n```java\nstatic final String\
  \ PATH = \"c:/temp/\";\npublic static void main(String[] args) throws Exception\
  \ {\n    int i1, i2;\n    double d1, d2;\n    String s1, s2;\n    Scanner fin =\
  \ new Scanner(Paths.get(PATH + \"f_data40.6.txt\"));\n    d1 = fin.nextDouble();\n\
  \    i1 = fin.nextInt();\n    s1 = fin.nextLine();\n    d2 = fin.nextDouble();\n\
  \    i2 = fin.nextInt();\n    s2 = fin.nextLine();\n    fin.close();\n    System.out.println(d1);\
  \ //它显示: 15.3\n    System.out.println(i1); //它显示: 15\n    System.out.println(s1);\
  \ //它显示: Round the number down\n    System.out.println(d2); //它显示: 22.6\n    System.out.println(i2);\
  \ //它显示: 23\n    System.out.println(s2); //它显示: Round the number up\n}\n```\n\n\
  ![](img/notice.jpg)在美国，小数点分隔符是点（`.`）。在许多国家，小数点分隔符是逗号（`,`）。例如，如果你在欧洲并尝试执行此代码，将会发生错误。要解决这个问题，将文件\
  \ `f_data40.6.txt` 中的 `15.3`、`22.6` 和 `55.5` 修改为 `15,3`、`22,6` 和 `55,5`。\n\n###\
  \ 40.7 遍历文件内容\n\n你可以使用 `while` 循环遍历文件。\n\n假设文件 `f_to_be_or_to_be.txt` 包含以下文本：\n\n\
  生存还是死亡，这是一个问题：\n忍受命运的弓箭之苦，还是拿起武器反抗苦海，并终结它们？死亡：入睡；\n\n以下示例显示文件的所有行，每次迭代一次。\n\n![](img/my_exercise_header.png)\n\
  \n**Project_40.7a**\n\n```java\nstatic final String PATH = \"c:/temp/\";\npublic\
  \ static void main(String[] args) throws Exception {\n    String line;\n    Scanner\
  \ fin = new Scanner(Paths.get(PATH + \"f_to_be_or_to_be.txt\"));\n    while (fin.hasNextLine())\
  \ {\n        line = fin.nextLine();\n        System.out.println(line);\n    }\n\
  \    fin.close();\n}\n```\n\n![](img/notice.jpg)当当前位置位于文件末尾时，`hasNextLine()` 方法返回\
  \ `false`。\n\n假设文件 `f_data40.7.txt` 包含以下值：\n\n15 19\n22 28\n55 50\n\n以下示例显示文件的全部六个值，每次迭代一次。\n\
  \n![](img/my_exercise_header.png)\n\n**Project_40.7b**\n\n```java\nstatic final\
  \ String PATH = \"c:/temp/\";\npublic static void main(String[] args) throws Exception\
  \ {\n    int x;\n    Scanner fin = new Scanner(Paths.get(PATH + \"f_data40.7.txt\"\
  ));\n    while (fin.hasNextInt()) {\n        //读取实数（浮点数）时使用 hasNextDouble() 方法！\n\
  \        x = fin.nextInt();\n        System.out.println(x);\n    }\n    fin.close();\n\
  }\n```\n\n![](img/notice.jpg)当当前位置位于文件末尾时，`hasNextInt()` 和 `hasNextDouble()` 方法返回\
  \ `false`。\n\n### 40.8 复习习题：判断对错\n\n对以下每个陈述判断正确或错误。\n\n\n\n\n\n1) 当你关闭电脑时，文件的内容将会丢失。\n\
