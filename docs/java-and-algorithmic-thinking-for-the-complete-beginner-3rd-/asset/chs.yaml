  \n## 第 16 章：单分支决策结构\n\n### 16.1 单分支决策结构\n\n这是简单的决策控制结构。它仅在“真”路径上包含语句或语句块，如下方的流程图所示。\n\
  \n如果 `Boolean_Expression` 求值为真，则执行该结构的语句或语句块；否则，跳过这些语句。\n\nJava 语句的通用形式为：\n\n```\n\
  if (Boolean_Expression) {语句或语句块}\n```\n\n注意语句或语句块额外缩进了 2 个空格。\n\n在下一个示例中，只有当用户输入小于\
  \ 18 的值时，才会显示消息“未成年！”当用户输入大于或等于 18 的值时，什么都不显示。\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int age;\n    System.out.print(\"Enter your age:\
  \ \");\n    age = Integer.parseInt(cin.nextLine());\n    if (age < 18) {\n     \
  \   System.out.println(\"You are underage!\");\n    }\n}\n```\n\n注意 `System.out.println()`\
  \ 语句缩进了 2 + 2 = 4 个空格。\n\n\n\n\n\n在下一个示例中，信息“你未成年！”和“你还需要再等几年”这些消息只有当用户输入一个小于 18\
  \ 的值时才会显示。与之前相同，当用户输入一个大于或等于 18 的值时，不会显示任何消息。\n\n![](img/my_exercise_header.png)\
  \ **Project_16.1b**\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int age;\n    System.out.print(\"Enter your age: \");\n    age = Integer.parseInt(cin.nextLine());\n\
  \    if (age < 18) {\n        System.out.println(\"You are underage!\");\n     \
  \   System.out.println(\"You have to wait for a few more years.\");\n    }\n}\n\
  ```\n\n![](img/notice.jpg) 所有出现在 `if` 语句内部的语句应该向右缩进相同数量的空格。在上一个示例中，两个 `System.out.println()`\
  \ 语句都缩进了 2 个空格。\n\n![](img/notice.jpg) 为了节省纸张，本书每个缩进级别使用 2 个空格。然而，Java 官方网站建议每个缩进级别使用\
  \ 4 个空格。\n\n![](img/notice.jpg) 为了缩进文本光标，与其输入空格字符，你可以按一次“Tab ![Image](img/key_tab.png)”键！\n\
  \n![](img/notice.jpg) 为了缩进现有的语句或语句块，请选择它并按“Tab ![Image](img/key_tab.png)”键！\n\n\
  ![](img/notice.jpg) 为了取消一个语句或语句块的缩进，请选择它并按“Shift ↑ + Tab ![Image](img/key_tab.png)”组合键！\n\
  \n在下一个示例中，信息“你你是众神之王！”只有当用户输入名字“Zeus”时才会显示。然而，无论用户输入什么名字，消息“你住在奥林匹斯山”总是会律的。\n\n\
  ![](img/my_exercise_header.png) **Project_16.1c**\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String name;\n    System.out.print(\"Enter the name\
  \ of an Olympian: \");\n    name = cin.nextLine();\n    if (name.equals(\"Zeus\"\
  ) == true) {\n        System.out.println(\"You are the King of the Gods!\");\n \
  \   }\n    System.out.println(\"You live on Mount Olympus.\");\n}\n```\n\n![](img/notice.jpg)\
  \ 注意，最后一个 `System.out.println()` 语句不属于单分支决策结构的语句块。\n\n![](img/notice.jpg) 初学者程序员在编写\
  \ Java 程序时犯的一个非常常见的错误是将值赋值运算符与“等于”运算符混淆。他们经常会写出 `if (name.equals(\"Zeus\") = true)`\
  \ 的错误，而他们实际上想表达的是 `if (name.equals(\"Zeus\") == true)`。\n\n当只有一条单一语句包含在 `if` 语句中时，你可以省略大括号\
  \ `{ }`。因此，`if` 语句可以写如下：\n\n`if (Boolean_Expression) One_Single_Statement;`\n\n\
  或者你甚至可以将整个决策结构写在一行中，如下：\n\n`if (Boolean_Expression) One_Single_Statement;`\n\n只有当\
  \ `if` 语句中包含多条语句时，才需要大括号。如果没有大括号，Java 假设只有紧后的下一个语句是决策控制结构的一部分。\n\n然而，为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使\
  \ `if` 语句只包含一条单一语句。在以下两个示例中，`System.out.print(x)` 语句都不是 `if` 语句的一部分。\n\n```java\n\
  if (x == y)x++;\nSystem.out.print(x);\nif (x == y) {x++;}\nSystem.out.print(x);\n\
  ```\n\n#### Exercise 16.1-1 追踪表与单分支决策结构\n\n设计相应的流程图并创建一个追踪表，以确定下一个 Java 程序在两种不同执行情况下每一步中变量的值。\n\
  \n两次执行的输入值为：(i) 10，以及 (ii) 51。\n\n![](img/my_exercise_header.png) **Project_16.1-1**\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int a, y;\n\
