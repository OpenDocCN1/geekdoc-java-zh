  \ | 132.0 | 40.0 |\n| 6 | `.println(y)` | 显示: 40.0 | | | | |\n\n#### 练习题 17.1-3\
  \ 谁最大？\n\n设计一个流程图并编写相应的 Java 程序，让用户输入两个数字 `A` 和 `B`，然后确定并显示这两个数中的较大者。\n\n##### 答案\n\
  \n此练习可以使用双分支决策结构或单分支决策结构来解决。因此，让我们两种都用用吧！\n\n###### 第一种方法——使用双分支决策结构\n\n这种方法测试数字\
  \ `B` 的值是否大于数字 `A`。如果是，则数字 `B` 是最大的；否则，数字 `A` 是最大的。使用这种方法解决此练习的相应流程图所示。\n\n![Image](img/chapter17-03.png)\n\
  \nJava 程序如下。\n\n![](img/my_exercise_header.png) Project_17.1-3\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    double a, b, maximum;\n\
  \    a = Double.parseDouble(cin.nextLine());\n    b = Double.parseDouble(cin.nextLine());\n\
  \    if (b > a) {\n        maximum = b;\n    } else {\n        maximum = a;\n  \
  \  }\n    System.out.println(\"Greatest value: \" + maximum);\n}\n```\n\n![](img/notice.jpg)\
  \ 注意，此练习正尝试确定最大值，而不是该值实际上赋值给了哪个变量（是变量 `A` 还是变量 `B`）。\n\n###### 第二种方法——使用单分支决策结构\n\
  \n如下流程图所示，这种方法最初假设数字 `A` 可能是最大值（这就是为什么将变量 `a` 的值赋值给变量 `maximum`）。然而，如果证明数字 `B` 大于数字\
  \ `A`，则更新最大值；变量 `maximum` 被赋予一个新值——变量 `b` 的值。因此，无论数字 `A` 和 `B` 的值是多少，变量 `maximum`\
  \ 最后将始终包含最大值！\n\n![Image](img/chapter17-04.png)\n\nJava 程序所示。\n\n![](img/my_exercise_header.png)\
  \ Project_17.1-3b\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double a, b, maximum;\n    a = Double.parseDouble(cin.nextLine());\n  \
  \  b = Double.parseDouble(cin.nextLine());\n    maximum = a;\n    if (b > a) {\n\
  \        maximum = b;\n    }\n    System.out.println(\"Greatest value: \" + maximum);\n\
  }\n```\n\n#### 练习题 17.1-4 寻找奇偶数\n\n设计一个流程图并编写相应的 Java 程序，提示用户输入一个正整数，然后显示一条消息指示该数是否为偶数；如果不是，则必须显示“Odd”。\n\
  \n##### 答案\n\n接下来你可以找到各种奇偶数：\n\n* ► 奇数：1, 3, 5, 7, 9, 11, …\n* ► 偶数：0, 2, 4, 6,\
  \ 8, 10, 12, ….\n\n![](img/notice.jpg) 注意零被视为偶数。\n\n在此练习中，你需要找到一种方法来判断一个数字是奇数还是偶数。你需要找到所有偶数之间、或所有奇数之间的一个共同属性。实际上，确实存在这样一个属性！所有的偶数都能被\
  \ `2` 完全整除。因此，当操作 `x MOD 2` 的结果等于 `0` 时，`x` 是偶数；否则，`x` 是奇数。\n\n流程图所示。\n\n![Image](img/chapter17-05.png)\n\
  \nJava 程序如下。\n\n![](img/my_exercise_header.png) Project_17.1-4\n```java\npublic\
