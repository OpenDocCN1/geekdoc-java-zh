  \ 阶梯电价与用电量\n\n电力公司根据下表向订阅者收取用电费（家庭账户每月费率）。假设传输服务和分配费用等额外费用已包含在内。\n\n| 千瓦时 (kWh)\
  \ | 每 kWh USD |\n| --- | --- |\n| kWh ≤ 500 | $0.10 |\n| 501 ≤ kWh ≤ 2000 | $0.25\
  \ |\n| 2001 ≤ kWh ≤ 4500 | $0.40 |\n| 4501 ≤ kWh | $0.60 |\n\n编写 Java 程序提示用户输入总\
  \ kWh 数，然后计算并显示支付总金额。请注意，费率是阶梯式的。\n\n#### 解决方案\n\n阶梯费率的意思是，当客户消耗 2200 kWh 时，并不是所有的千瓦时都按\
  \ $0.40 收费。前 500 kWh 按 $0.10 计费，接 1500 kWh 按 $0.25 计费，只有最后 200 kWh 按 $0.40 计费。因此，客户必须支付\
  \ $500 \\times $0.10 + 1500 \\times $0.25 + 200 \\times $0.40 = $505。\n\n同样的逻辑，当客户消耗例如\
  \ 4800 kWh 时，支付总金额的计算如下：前 500 kWh 按 $0.10 计费，接 1500 kWh 按 $0.25 计费，接 2500 kWh 按\
  \ $0.40 计费，只有最后 300 kWh 按 $0.60 计费。因此，客户必须支付 $500 \\times $0.10 + 1500 \\times $0.25\
  \ + 2500 \\times $0.40 + 300 \\times $0.60 = $1605。\n\n下图可以帮助你完全理解当费率为阶梯式时如何计算支付总金额。\n\
  \n![Image](img/chapter23-22.png)\n\nJava 程序所示。\n\n![](img/my_exercise_header.png)\
  \ Project_23.4-5\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int kwh;\n    double t;\n    System.out.print(\"Enter number of Kilowatt-hours\
  \ consumed: \");\n    kwh = Integer.parseInt(cin.nextLine());\n    if (kwh <= 500)\
  \ {\n        t = kwh * 0.10;\n    } else if (kwh <= 2000) {\n        t = 500 * 0.10\
  \ + (kwh - 500) * 0.25;\n    } else if (kwh <= 4500) {\n        t = 500 * 0.10 +\
  \ 1500 * 0.25 + (kwh - 2000) * 0.40;\n    } else {\n        t = 500 * 0.10 + 1500\
  \ * 0.25 + 2500 * 0.40 + (kwh - 4500) * 0.60;\n    }\n    System.out.println(\"\
  Total amount to pay: \" + t);\n}\n```\n\n### 练习 23.4-6 阶梯费率与短信服务\n\n手机公司每月向客户收取\
