  \    System.out.println(h1.day);\n        System.out.println(h1.events[0]);\n  \
  \      System.out.println(h1.events[1]);\n        System.out.println(h2.day);\n\
  \        System.out.println(h2.events[0]);\n        System.out.println(h2.events[1]);\n\
  \    }\n}\n```\n\n### 39.5 Getter 和 Setter 方法\n\n字段是直接声明在类中的变量。然而，面向对象编程的原则规定类的数据应该是隐藏的且防篡改的。通过不暴露字段，你可以隐藏类的内部实现。字段应该对类私有，并通过\
  \ `get` 和 `set` 方法访问。\n\n通常情况下，程序员应该只对具有私有或保护访问权限的数据使用字段。在 Java 中，你可以相应使用特殊关键字 `private`\
  \ 或 `protected` 将字段（或方法）设置为私有。\n\n让我们通过示例尝试理解这些新内容。假设你编写了以下类将华氏温度转换为相应的摄氏度。\n\n\
  ```java\nclass FahrenheitToCelsius {\n    public double temperature;\n    //定义构造方法\n\
  \    public FahrenheitToCelsius(double value) {\n        this.temperature = value;\
  \   //字段被初始化\n    }\n    //此方法获取温度\n    public double getTemperature() {\n     \
  \   return 5.0 / 9.0 * (this.temperature - 32.0);\n    }\n}\n```\n这个类几乎完美，但有一个主要的缺点。它没有考虑到温度不能低于\
  \ −459.67 华氏度（−273.15 摄氏度）。这个温度被称为绝对零度。因此，使用你的类且对物理学一无所知的初级程序员，可能会向构造方法传递 −500 华氏度的值，如下面的代码片段所示\n\
  \n```java\nFahrenheitToCelsius x = new FahrenheitToCelsius(-500);\nSystem.out.println(x.getTemperature());\n\
  ```\n\n\n\n尽管程序可以完美运行并显示 −295.55 摄氏度的值，但遗憾的是，这个温度在整个宇宙中是不存在的！因此，该类的稍微不同版本可能会部分解决这个问题。\n\
  \n![](img/my_exercise_header.png) 项目 39.5b\n\n```java\nclass FahrenheitToCelsius\
  \ {\n    public double temperature;\n    //定义构造函数\n    public FahrenheitToCelsius(double\
  \ value) throws Exception {\n        this.setTemperature(value);   //使用方法设置字段 temperature\
  \ 的值\n    }\n\n    //这个方法获取温度\n    public double getTemperature() {\n        return\
  \ 5.0 / 9.0 * (this.temperature - 32.0);\n    }\n\n    //这个方法设置温度\n    public void\
  \ setTemperature(double value) throws Exception {\n        if (value >= -459.67)\
  \ {\n            this.temperature = value;\n        } else {\n            throw\
  \ new Exception(\"没有低于 -459.67 的温度\");\n        }\n    }\n}\n\npublic class App\
  \ {\n    public static void main(String[] args) throws Exception {\n        FahrenheitToCelsius\
  \ x = new FahrenheitToCelsius(-500);  //创建对象 x\n        System.out.println(x.getTemperature());\n\
  \    }\n}\n```\n\n![](img/notice.jpg)`throw` 语句强制程序抛出异常（运行时错误），导致执行流停止。\n\n这次，使用了一个名为\
  \ `setTemperature()` 的方法来设置字段 `temperature` 的值。这种方法更好，但并不完美，因为程序员必须小心，并始终记住在每次想要更改字段\
  \ `temperature` 的值时使用这个方法。问题是，字段 `temperature` 的值仍然可以使用其名称直接更改，如下代码片段所示。\n\n```java\n\
  FahrenheitToCelsius x = new FahrenheitToCelsius(-50);  //创建对象 x\nSystem.out.println(x.getTemperature());\n\
  x.setTemperature(-65);      //这是可以的！\nSystem.out.println(x.getTemperature());\n\
  x.temperature = -500;       //遗憾的是，这仍然被允许！\nSystem.out.println(x.getTemperature());\n\
  ```\n\n如果将字段 `temperature` 声明为 `private`，就可以完全解决这个问题！当字段被声明为 `private` 时，调用者（此处为对象\
  \ `x`）无法直接访问该字段，如下面的 Java 程序所示。\n\n![](img/my_exercise_header.png) 项目 39.5c\n\n\
  ```java\nclass FahrenheitToCelsius {\n    private double _temperature;  //将字段 temperature\
  \ 声明为私\n    //定义构造函数\n    public FahrenheitToCelsius(double value) throws Exception\
  \ {\n        this.setTemperature(value);   //调用 setter\n    }\n\n    //这个方法获取温度\n\
  \    public double getTemperature() {\n        return 5.0 / 9.0 * (this._temperature\
  \ - 32.0);\n    }\n\n    //这个方法设置温度\n    public void setTemperature(double value)\
  \ throws Exception {\n        if (value >= -459.67) {\n            this._temperature\
  \ = value;\n        } else {\n            throw new Exception(\"没有低于 -459.67 的温度\"\
  );\n        }\n    }\n}\n\npublic class App {\n    public static void main(String[]\
  \ args) throws Exception {\n        FahrenheitToCelsius x = new FahrenheitToCelsius(-50);\
  \  //创建对象 x. 这调用了\n        // //构造函数，\n        // //反过来，调用了 setter。\n        System.out.println(x.getTemperature());\
  \  //这调用了 getter。\n        x.setTemperature(-65);                   //这调用了 setter。\n\
  \        System.out.println(x.getTemperature());  //这调用了 getter。\n        x._temperature\
  \ = -50;                    //这是不允许的！\n        System.out.println(x._temperature);\
  \      //这也不允许！\n    }\n}\n```\n\n![](img/notice.jpg)许多程序员倾向于在私有字段前加上下划线（_`）。\n\n\
  #### 练习 39.5-1 罗马数字\n\n罗马数字如下所示。\n\n| 数字 | 罗马数字 |\n| --- | --- |\n| 1 | I |\n| 2\
  \ | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n执行以下操作：\n\nii)编写一个名为 `Romans` 的类，包含：\n\
  a)一个名为 `_number` 的私有整数字段。\nb)两个分别名为 `getNumber` 和 `setNumber` 的 getter 和 setter\
  \ 方法。它们将用于以整数格式获取和设置字段 `_number` 的值。当数字无法被识别时，setter 方法必须抛出错误。\nc)两个分别名为 `getRoman`\
  \ 和 `setRoman` 的 getter 和 setter 方法。它们将用于以罗马数字格式获取和设置字段 `_number` 的值。当罗马数字无法被识别时，setter\
  \ 方法必须抛出错误。\niii)使用上述类编写一个 Java 程序，显示对应于值 3 的罗马数字，以及对应于罗马数字“V”的数字。\n\n### Solution\n\
  \n整数格式字段 `_number` 的 getter 和 setter 方法非常简单，没有什么特殊的需要解释的。然而，罗马数字格式字段 `_number` 的\
  \ getter 和 setter 方法需要一些解释。\n\n罗马数字格式字段 `_number` 的 getter 方法可以写如下：\n\n```java\n\
  //定义 getter\npublic String getRoman() {\n    String retValue = \"\";\n    if (this._number\
  \ == 1)\n        retValue = \"I\";\n    else if (this._number == 2)\n        retValue\
  \ = \"II\";\n    else if (this._number == 3)\n        retValue = \"III\";\n    else\
  \ if (this._number == 4)\n        retValue = \"IV\";\n    else if (this._number\
  \ == 5)\n        retValue = \"V\";\n    return retValue;\n}\n```\n\n然而，由于你现在已经了解了许多\
  \ HashMap，你可以使用更好的方法，如下代码片段所示：\n\n```java\n//定义 getter\npublic String getRoman()\
  \ {\n    HashMap<Integer, String> number2roman = new HashMap<>(\n        Map.of(1,\
  \ \"I\", 2, \"II\", 3, \"III\", 4, \"IV\", 5, \"V\")\n    );\n    return number2roman.get(this._number);\n\
  }\n```\n\n相应的，setter 方法如下：\n\n```java\n//定义 setter\npublic void setRoman(String\
  \ key) throws Exception {\n    HashMap<String, Integer> roman2number = new HashMap<>(\n\
  \        Map.of(\"I\", 1, \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5)\n    );\n\
  \    if (roman2number.containsKey(key)) {\n        this._number = roman2number.get(key);\n\
  \    } else {\n        throw new Exception(\"罗马数字未识别\");\n    }\n}\n```\n\n![](img/notice.jpg)Java\
  \ 内置方法 `containsKey(key)` 在 hashmap 包含指定的 `key_name` 时返回 true。\n\n![](img/notice.jpg)语句\
  \ `if (roman2number.containsKey(key))` 等于语句 `if (roman2number.containsKey(key) ==\
  \ true)`。\n\n最终的 Java 程序如下：\n\n![](img/my_exercise_header.png) 项目 39.5-1\n\n```java\n\
  class Romans {\n    private int _number;\n    //定义 getter\n    public int getNumber()\
  \ {\n        return this._number;\n    }\n    //定义 setter\n    public void setNumber(int\
  \ value) throws Exception {\n        if (value >= 1 && value <= 5) {\n         \
  \   this._number = value;\n        } else {\n            throw new Exception(\"\
  数字未识别\");\n        }\n    }\n    //定义 getter\n    public String getRoman() {\n \
  \       HashMap<Integer, String> number2roman = new HashMap<>(\n            Map.of(1,\
  \ \"I\", 2, \"II\", 3, \"III\", 4, \"IV\", 5, \"V\")\n        );\n        return\
  \ number2roman.get(this._number);\n    }\n    //定义 setter\n    public void setRoman(String\
  \ key) throws Exception {\n        HashMap<String, Integer> roman2number = new HashMap<>(\n\
  \            Map.of(\"I\", 1, \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5)\n    \
  \    );\n        if (roman2number.containsKey(key)) {\n            this._number\
  \ = roman2number.get(key);\n        } else {\n            throw new Exception(\"\
  罗马数字未识别\");\n        }\n    }\n}\n\npublic class App {\n    public static void main(String[]\
  \ args) throws Exception {\n        Romans x = new Romans();\n        x.setNumber(3);\n\
  \        System.out.println(x.getNumber());  //显示: 3\n        System.out.println(x.getRoman());\
  \   //显示: III\n        x.setRoman(\"V\");\n        System.out.println(x.getNumber());\
  \  //显示: 5\n        System.out.println(x.getRoman());   //显示: V\n    }\n}\n```\n\
  \n### 39.6 方法可以调用同一类中的另一个方法吗？\n\n\n\n\n\n在第 37.2 节中，你已经学习了子程序可以调用另一个子程序。显然，类方法也是如此——方法可以调用同一类中的另一个方法！毕竟，方法终其底无非是子程序！因此，如果你想让一个方法调用同一类的另一个方法，你应该在想要调用的方法前面使用关键字\
  \ `this`（使用点符号表示法），如下例所示。\n\n![](img/my_exercise_header.png) 练习 _39.6\n```java\n\
  class JustAClass {\n    public void foo1() {\n        System.out.println(\"foo1\
  \ was called\");\n        this.foo2(); //使用点符号表示法调用 foo2()\n    }\n\n    public\
  \ void foo2() {\n        System.out.println(\"foo2 was called\");\n    }\n}\n\n\
  public class App {\n    public static void main(String[] args) throws Exception\
  \ {\n        JustAClass x = new JustAClass();\n        x.foo1(); //调用 foo1()，它反过来会调用\
  \ foo2()\n    }\n}\n```\n\n#### 练习 39.6-1 数学计算\n\n完成以下操作：\n\ni) 写一个名为 `DoingMath`\
  \ 的类，包含：\na) 一个名为 `square` 的 private void 方法，通过其形式参数列表接收一个数字，然后计算其平方并显示消息“XX 的平方是\
  \ YY”，其中 `XX` 和 `YY` 必须替换为实际值。\nb) 一个名为 `squareRoot` 的 private void 方法，通过其形式参数列表接收一个数字，然后计算其平方根并显示消息“XX\
  \ 的平方根是 YY”，其中 `XX` 和 `YY` 必须替换为实际值。但是如果数字小于零，方法必须显示错误信息。\nc) 一个名为 `displayResults`\
  \ 的 public void 方法，通过其形式参数列表接收一个数字，然后调用 `square()` 和 `squareRoot()` 方法显示结果。\nii)\
  \ 使用上述类编写一个 Java 程序，提示用户输入一个数字。该程序必须显示该数字的平方和平方根。\n\n##### 答案\n\n这个练习非常简单。`square()`、`squareRoot()`\
  \ 和 `displayResults()` 方法必须在它们的形式参数列表中包含一个形式参数，以便接收传递的值。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ Project_39.6-1\n```java\nclass DoingMath {\n    private void square(double x)\
  \ { //参数 x 接收传递的值\n        System.out.println(\"The square of \" + x + \" is \"\
  \ + (x * x));\n    }\n\n    private void squareRoot(double x) { //参数 x 接收传递的值\n\
  \        if (x < 0) {\n            System.out.println(\"Cannot calculate square\
  \ root\");\n        } else {\n            System.out.println(\"Square root of \"\
  \ + x + \" is \" + Math.sqrt(x));\n        }\n    }\n\n    public void displayResults(double\
  \ x) { //参数 x 接收传递的值\n        this.square(x);\n        this.squareRoot(x);\n   \
  \ }\n}\n\npublic class App {\n    static Scanner cin = new Scanner(System.in);\n\
  \    public static void main(String[] args) throws Exception {\n        double b;\n\
  \        DoingMath dm = new DoingMath();\n        System.out.print(\"Enter a number:\
  \ \");\n        b = Double.parseDouble(cin.nextLine());\n        dm.displayResults(b);\n\
  \    }\n}\n```\n\n### 39.7 类继承\n\n类继承是面向对象编程（OOP）的核心概念之一。它允许你使用另一个类作为基类来编写类。当一个类基于另一个类时，程序员会说“它继承了另一个类”。被继承的类称为父类、基类或超类。执行继承的类称为子类、派生类或子类。\n\
  \n子类会自动继承父类的所有的方法和字段。然而，最棒的部分是你可以为子类添加额外的特征（方法或字段）。因此，当你需要编写几个具有许多共同特征但并非完全相同的类时，你就需要使用继承。要实现这一点，你的操作如下：首先，你写一个包含所有共同特征的父类。接下来，你写从父类继承所有这些共同特征的子类。最后，你为每个子类添加特有的额外且独特的特征。就像人类一样，正是这些额外且独特的特征使子类与其父类区分开来，对吧？\n\
  \n假设你想写一个程序来跟踪学校里的老师和学生。他们有一些共同特征，如姓名和年龄，但他们也有特定的特征，例如老师的工资和学生的最终成绩，这些特征是不共有的。在这里，你可以写一个名为\
  \ `SchoolMember` 的父类，包含老师和学生共同的所有特征。然后，你可以写两个名为 `Teacher` 和 `Student` 的子类，分别用于老师和学生。两个子类都可以继承\
  \ `SchoolMember` 类，但必须分别在子类 `Teacher` 和 `Student` 中添加名为 `salary` 和 `finalGrade`\
  \ 的额外字段。\n\n父类 `SchoolMember` 如下所示：\n\n```java\nclass SchoolMember {\n    public\
  \ String name;\n    public int age;\n    //定义构造函数\n    public SchoolMember(String\
  \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
  }\n```\n\n如果你想让一个类继承 `SchoolMember`，它必须定义如下：\n\n```java\nclass Name extends SchoolMember\
  \ {\n    //该类的额外字段\n    //定义构造函数\n    public Name(String name, int age) {\n    \
  \    super(name, age);\n    }\n}\n```\n其中 `Name` 是子类。因此，`Teacher` 类可以定义如下：\n\n```java\n\
  class Teacher extends SchoolMember {\n    public double salary; //该类的额外字段\n    //定义构造函数\n\
  \    public Teacher(String name, int age, double salary) {\n        super(name,\
  \ age); //调用父类的构造函数\n        this.salary = salary;\n        System.out.println(\"\
  A teacher was initialized\");\n    }\n    //该类的额外方法\n    public void displayValues()\
