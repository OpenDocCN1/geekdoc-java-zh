  \ args) throws Exception {double total, x;int i;total = 0;i = 1;while (i <= 4) {\n\
  > x = Double.parseDouble(cin.nextLine());\n> total = total + x;\n> i++;\n}System.out.println(total);}\n\
  ```\n\n现在使用 `for` 语句重写它变得非常简单，并在每次数据输入前显示提示消息。\n\n![](img/my_exercise_header.png)\
