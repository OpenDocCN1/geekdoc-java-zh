  \    hoursWorked = Integer.parseInt(cin.nextLine());\n    if (hoursWorked <= 40)\
  \ {\n        grossPay = payRate * hoursWorked;\n    } else {\n        grossPay =\
  \ payRate * 40 + 1.5 * (hoursWorked - 40);\n    }\n    System.out.println(\"Gross\
  \ Pay: \" + grossPay);\n}\n```\n\n### 17.2 复习题：判断题\n\n对以下每个语句判断对或错。\n\n1. 双分支结构中的语句会被执行的。\n\
