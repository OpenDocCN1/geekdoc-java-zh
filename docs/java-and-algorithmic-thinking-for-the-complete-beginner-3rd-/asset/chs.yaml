  \n### 27.1 什么是嵌套循环？\n\n嵌套循环是在循环内部的循环，也就是说外循环中的内循环。\n\n外层循环控制内循环完整迭代的次数。这意味着外层循环的第一次迭代触发内循环开始迭代直到完成。然后，外层循环的第二次迭代再次触发内循环开始迭代直到完成。这个过程不断重复，直到外层循环执行完所有的迭代。\n\
  \n以以下 Java 程序为例。\n\n```java\nProject_27.1\npublic static void main(String[] args)\
  \ throws Exception {\n    int i, j;\n    for (i = 1; i <= 2; i++) {\n        for\
  \ (j = 1; j <= 3; j++) {\n            System.out.println(i + \"  \" + j);\n    \
  \    }\n    }\n}\n```\n\n在这个程序中，由变量 `i` 控制的外层循环决定了内循环执行的完整迭代次数。具体来说，当变量 `i` 为 1\
  \ 时，内循环执行三次迭代（`j = 1`、`j = 2` 和 `j = 3`）。在完成内循环后，外层循环需要再执行一次迭代（对于 `i = 2`）。结果，内循环重启，再次执行三次新的迭代（`j\
  \ = 1`、`j = 2` 和 `j = 3`）。\n\n上一个示例与下面的示例相似。\n\n```java\ni = 1; // 外层循环给变量 i 赋值为\
  \ 1\nfor (j = 1; j <= 3; j++) { // 内循环执行三次迭代\n    System.out.println(i + \"  \"\
  \ + j);\n}\ni = 2; // 外层循环给变量 i 赋值为 2\nfor (j = 1; j <= 3; j++) { // 内循环重新开始并执行三次新的迭代\n\
  \    System.out.println(i + \"  \" + j);\n}\n```\n\n输出结果如下。\n\n只要不违反语法规则，你可以根据需要嵌套任意数量的循环控制结构。然而，出于实际考虑，当你进入四层或五层嵌套时，整个结构变得非常复杂且难以理解。但是，经验表明，作为程序员，你一生中最大的嵌套深度可能是三层或四层。内、外层循环不需要是相同的类型。例如，一个\
  \ `for` 语句可以嵌套 `while` 语句，反之亦然。\n\n#### 练习 27.1 统计“Hello Zeus”显示的总次数。\n\n```java\n\
  Project_27.1\npublic static void main(String[] args) throws Exception {\n    int\
  \ i, j;\n    for (i = 0; i <= 2; i++) {\n        for (j = 0; j <= 3; j++) {\n  \
  \          System.out.println(\"Hello Zeus\");\n        }\n    }\n}\n```\n\n解：变量\
  \ `i` 和 `j` 的出现顺序如下：\n\n- `i = 0` 时，内循环执行四次（`j = 0`、`j = 1`、`j = 2` 和 `j = 3`），显示“Hello\
  \ Zeus”。\n- `i = 1` 时，内循环执行四次（`j = 0`、`j = 1`、`j = 2` 和 `j = 3`），显示“Hello Zeus”。\n\
  - `i = 2` 时，内循环执行四次（`j = 0`、`j = 1`、`j = 2` 和 `j = 3`），显示“Hello Zeus”。\n\n因此，总共显示了\
  \ $3 \\times 4 = 12$ 次。外层循环控制内循环的完整次数。\n\n#### 练习 27.1-2 确定代码片段结束时变量 `a` 的值。\n\n\
  ```java\nint a, i, j;\na = 1;\ni = 5;\nwhile (i < 7) {\n    for (j = 1; j <= 3;\
  \ j++) {\n        a = a * j + i;\n    }\n    i++;\n}\n```\n\n解：轨迹表所示。\n\n| 步骤 |\
  \ 语句 | 注释 | a | i | j |\n| --- | --- | --- | --- | --- | --- |\n| 1 | a = 1 | |\
  \ 1 | ? | ? |\n| 2 | i = 5 | | 1 | 5 | ? |\n| 3 | i < 7 | 结果为 true | 1 | 5 | ? |\n\
  | 4 | j = 1 | | 1 | 5 | 1 |\n| 5 | j <= 3 | 结果为 true | 1 | 5 | 1 |\n| 6 | a = a\
  \ * j + i | $1 \\times 1 + 5 = 6$ | 6 | 5 | 1 |\n| 7 | j++ | | 6 | 5 | 2 |\n| 8\
  \ | j <= 3 | 结果为 true | 6 | 5 | 2 |\n| 9 | a = a * j + i | $6 \\times 2 + 5 = 17$\
  \ | 17 | 5 | 2 |\n| 10 | j++ | | 17 | 5 | 3 |\n| 11 | j <= 3 | 结果为 true | 17 | 5\
  \ | 3 |\n| 12 | a = a * j + i | $17 \\times 3 + 5 = 56$ | 56 | 5 | 3 |\n| 13 | j++\
  \ | | 56 | 5 | 4 |\n| 14 | j <= 3 | 结果为 false | 56 | 5 | 4 |\n| 15 | i++ | | 56\
  \ | 6 | 4 |\n| 16 | i < 7 | 结果为 true | 56 | 6 | 4 |\n| 17 | j = 1 | | 56 | 6 | 1\
  \ |\n| 18 | j <= 3 | 结果为 true | 56 | 6 | 1 |\n| 19 | a = a * j + i | $56 \\times\
  \ 1 + 6 = 62$ | 62 | 6 | 1 |\n| 20 | j++ | | 62 | 6 | 2 |\n| 21 | j <= 3 | 结果为 true\
  \ | 62 | 6 | 2 |\n| 22 | a = a * j + i | $62 \\times 2 + 6 = 130$ | 130 | 6 | 2\
  \ |\n| 23 | j++ | | 130 | 6 | 3 |\n| 24 | j <= 3 | 结果为 true | 130 | 6 | 3 |\n| 25\
  \ | a = a * j + i | $130 \\times 3 + 6 = 396$ | 396 | 6 | 3 |\n| 26 | j++ | | 396\
  \ | 6 | 4 |\n| 27 | j <= 3 | 结果为 false | 396 | 6 | 4 |\n| 28 | i++ | | 396 | 7 |\
  \ 4 |\n| 29 | i < 7 | 结果为 false | 396 | 7 | 4 |\n\n变量 `a` 的值为 396。\n\n\n\n\n程序结束时，变量\
  \ `a` 包含值 93。\n\n### 27.2 适用于嵌套循环的规则\n\n除了适用于 for 循环的四条规则（见第 26.2 节）外，在编写嵌套循环程序时，你必须遵循两条额外的规则，因为它们可以避免产生意外的副作用。\n\
  \n► **规则 1**：内层循环必须完全在外层循环内部开始并结束，这意味着循环之间不能重叠。\n► **规则 2**：外层循环和内层（嵌套）循环不能使用同一个计数变量。\n\
  \n#### 练习 27.2-1 违反第一规则\n\n设计一个违反嵌套循环第一规则的流程图片段，该规则规定：“内层循环必须完全在外层循环内部开始并结束”。\n\n\
  #### 解答案\n\n以下流程图片段违反了嵌套循环的第一规则。\n\n![Image](img/chapter27-02.png)\n\n如果你尝试跟踪执行流，你会发现它顺利地执行了\
  \ 5 × 10 = 50 次迭代。没有人能看出这个流程图是错误的。事实上，它在技术上是正确的。然而，问题在于它的可读性。极难辨别这个流程图想要实现什么。此外，这种结构不符合你已经学过的任何熟悉的循环控制结构，因此无法直接将其转换为\
  \ Java 程序。请尽量避免这种嵌套循环！\n\n#### 练习 27.2-2 违反第二规则\n\n找到消息“Hello”显示的次数。\n\n```java\n\
  for (i = 1; i <= 3; i++) {\n    for (i = 5; i >= 1; i--) {\n        System.out.println(\"\
  Hello\");\n    }\n}\n```\n\n#### 解答案\n\n一眼看去，人们会认为“Hello”单词显示了 3 × 5 = 15 次。然而，仔细观察会发现情况并不如表面看起来。这个程序违反了嵌套循环的第二规则，该规则规定：“外层循环和内层（嵌套）循环不能使用同一个计数变量”。让我们设计对应的流程图。\n\
  \n![Image](img/chapter27-03.png)\n\n如果你尝试跟踪此流程图片段的执行流，你会发现当内层循环完成所有五次迭代时，变量 `i`\
  \ 包含值 0。然后，变量 `i` 增加 1，外层循环再次重复。这个过程可以永远持续，因为变量 `i` 永远无法超过外层循环布尔表达式所需的数值 3。因此，消息“Hello”被显示无限次。\n\
  \n### 27.3 复习题：判断对\n\n对对每个陈述选择对或错。\n\n1) 嵌套循环是外层循环内部的内层循环。\n2) 中测试循环结构可以嵌套在预测试循环结构中。\n\
