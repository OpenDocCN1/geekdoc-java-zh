  \ `/\\b`\n   b) `||)`\n   c) 以上都是逻辑运算符。\n   d) 以上均不是逻辑运算符。\n3. 如果变量 `x` 包含值 5，语句\
  \ `y = x % 2 == 1` 给变量 `y` 赋值了什么值？\n   a) true\n   b) false\n   c) 1\n   d) 以上都不是\n\
  4. 如果变量 `x` 包含值 5，语句 `y = x % 2 == 0 || (int)(x / 2.0) == 2` 给变量 `y` 赋值了什么值？\n \
  \  a) true\n   b) false\n   c) 以上都不是\n5. 实验室的温度必须在 50 到 80 华氏度之间。以下哪个布尔表达式测试了这一条件？\n\
  \   a) `t >= 50 || t <= 80`\n   b) `50 >= t && t >= 80`\n   c) `t >= 50 && t <=\
  \ 80`\n   d) `t > 50 || t < 80`\n   e) 以上都不是\n6. 下列哪个与布尔表达式 `t == 3 || t > 30` 等价？\n\
  \   a) `t == 3 && !(t <= 30)`\n   b) `t == 3 && !(t < 30)`\n   c) `!(t != 3) ||\
  \ !(t < 30)`\n   d) `!(t != 3 && t <= 30)`\n   e) 以上都不是\n\n### 15.11 复习练习\n\n完成以下练习。\n\
