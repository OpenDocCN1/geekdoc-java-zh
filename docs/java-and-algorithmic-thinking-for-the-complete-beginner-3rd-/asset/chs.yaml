  Nothing found in row \" + i);\n    }\n}\n```\n\n### 练习 34.5-4 线性搜索算法 – 在包含唯一值的一维数组中进行搜索\n\
  \n编写一个代码段，对一维数组执行搜索，以找到用户提供的值。假设该数组包含数值，且数组中的每个值都是唯一的。请使用线性搜索算法。\n\n### 解决方案\n\n\
  这种情况与之前的几个非常不同。由于数组中的每个值都是唯一的，当找到用户提供的值时，没有必要无谓迭代到数组末尾，从而浪费 CPU 时间。实际上有三种方法！让我们分析一下它们吧！\n\
  \n#### 第一种方法 – 使用 `break` 语句\n\n在这种方法中，当找到用户提供的值时，使用 `break` 语句跳出 `for` 循环。解决方案如下：\n\
  \n```java\nSystem.out.print(\"Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\n\
  found = false;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle)\
  \ {\n        System.out.println(needle + \" found at position: \" + i);\n      \
  \  found = true;\n        break;\n    }\n}\nif (!found) {\n    System.out.println(\"\
  Nothing found!\");\n}\n```\n\n或者你也可以用稍微不同的方式实现同样的功能。\n\n```java\nSystem.out.print(\"\
  Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\nindexPosition\
  \ = -1;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (haystack[i] == needle) {\n\
  \        indexPosition = i;\n        break;\n    }\n}\nif (indexPosition == -1)\
  \ {\n    System.out.println(\"Nothing found!\");\n} else {\n    System.out.println(needle\
  \ + \" found at position: \" + indexPosition);\n}\n```\n\n#### 第二种方法 – 使用标志位（flag）\n\
  \n`break` 语句并不是在所有计算机语言中都存在；由于本书的意图是教你“算法思维”（而仅仅是 Java 支持的特殊语句），让我们看看另一种方法。\n\n\
  在下一个代码段中，当在数组 `haystack` 中找到用户提供的值时，变量 `found` 会强制执行流立即退出循环。\n\n```java\nSystem.out.print(\"\
  Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\nfound\
  \ = false;\ni = 0;\nwhile (i <= ELEMENTS - 1 && !found) {\n    if (haystack[i] ==\
  \ needle) {\n        found = true;\n        indexPosition = i;\n    }\n    i++;\n\
  }\nif (!found) {\n    System.out.println(\"Nothing found!\");\n} else {\n    System.out.println(needle\
  \ + \" found at position: \" + indexPosition);\n}\n```\n\n#### 第三种方法 – 仅使用预测试循环结构\n\
  \n这种方法可能是这三种中效率最高的。`while` 循环遍历数组，将每个元素与 `needle` 进行比较。只要满足两个条件，循环就会继续：变量 `i`（代表索引）在数组\
  \ `haystack` 的有效范围内，且数组中当前索引的值不等于 `needle`。如果两个条件都为真，变量 `i` 加 1 以移动到下一个元素。此过程一直持续，直到找到匹配项或到达数组末尾。\n\
  \n```java\nSystem.out.print(\"Enter a value to search: \");\nneedle = Double.parseDouble(cin.nextLine());\n\
  i = 0;\nwhile (i < ELEMENTS - 1 && haystack[i] != needle) {\n    i++;\n}\nif (haystack[i]\
  \ != needle) {\n    System.out.println(\"Nothing found!\");\n} else {\n    System.out.println(needle\
  \ + \" found at position: \");\n```\n\n### 练习 34.5-5 搜索社会安全号码\n\n在美国，社会安全号码（SSN）是用于识别美国公民的九位身份号码。编写一个\
