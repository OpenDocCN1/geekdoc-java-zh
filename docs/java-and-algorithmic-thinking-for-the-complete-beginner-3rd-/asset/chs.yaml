  \ 编写一个 Java 程序，提示用户输入两个数字，分别代表当前月份和日期，然后计算并显示距离年底结束的天数。假设每月有 30 天。\n\n## 第 11 章：数字处理\n\
  \n### 11.1 引言\n\n与每种高级编程语言一样，Java 提供了许多现成的可用子程序（称为方法），你可以随地、随地使用它们。\n\n![](img/notice.jpg)\
  \ “子程序”仅仅是一组封装成单个单元的语句。每个子程序都有一个描述性的名称并执行特定的任务。\n\n为了更好地理解 Java 的方法，让我们以计算正数平方根的\
  \ Heron 迭代公式为例。\n\n.![Image](img/chapter11-01.png)\n\n其中：\n- `y` 是你想要找到平方根的数字\n\
  - `x[n]` 是 `y` 的平方根的第 n 次迭代值\n\n你现在可能感到有些沮丧。你可能认为应该写一个程序来通过 Heron 公式计算一个数字的平方根，但事实并非如此！目前还没有人用这种方法来计算平方根。幸运的是，Java\
  \ 包含一个为此的方法。\n\n### 11.2 有用的数学方法（子程序）\n\n#### 绝对值\n`Math.abs(number)`\n该方法返回 `number`\
  \ 的绝对值。\n\n```java\npublic static void main(String[] args) {\n    int a, b;\n  \
  \  a = -5;\n    System.out.println(Math.abs(a)); // 输出 5\n    b = 5.2;\n    System.out.println(Math.abs(b));\
  \ // 输出 5.2\n}\n```\n\n#### 圆周率\n`Math.PI`\n包含 π 的值。注意 `Math.PI` 是一个常量，而不是方法。这就是为什么不需要括号。\n\
  \n```java\npublic static void main(String[] args) {\n    System.out.println(Math.PI);\
  \ // 输出 3.141592653589793\n}\n```\n\n#### 正弦\n`Math.sin(number)`\n该方法返回 `number`\
  \ 的正弦值。`number` 以弧度为单位。你可以乘以 `Math.PI / 180` 将角度转换为弧度。\n\n```java\npublic static\
  \ void main(String[] args) {\n    double a, b;\n    a = Math.sin(3 * Math.PI / 2);\
  \ // 输出 -1.0\n    b = Math.sin(270 * Math.PI / 180); // 输出 -1.0\n    System.out.println(a\
  \ + \" \" + b);\n}\n```\n\n#### 余弦\n`Math.cos(number)`\n该方法返回 `number` 的余弦值。`number`\
  \ 以弧度为单位。你可以乘以 `Math.PI / 180` 将角度转换为弧度。\n\n```java\npublic static void main(String[]\
  \ args) {\n    double a, b;\n    a = Math.cos(2 * Math.PI); // 输出 1.0\n    b = Math.cos(360\
  \ * Math.PI / 180); // 输出 1.0\n    System.out.println(a + \" \" + b);\n}\n```\n\n\
  \n\n\n\n### `Math.tan(number)`\n\n此方法返回 `number` 的正切值。`number` 的值必须以弧度表示。你可以乘以 `Math.PI\
  \ / 180` 将角度转换为弧度。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    double a;\n\
  \    a = Math.tan(10 * Math.PI / 180);  //10 度的正切值\n    System.out.println(a); \
  \            //显示: 0.17632698070846498\n}\n```\n\n### 字符串转整数\n\n`Integer.parseInt(value)`\n\
  \n此方法将整数的字符串表示转换为其数值等值。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    String s1\
  \ = \"5\";\n    String s2 = \"3\";\n    int k;\n    k = Integer.parseInt(s1);\n\
  \    System.out.println(k);                        //显示: 5\n    System.out.println(Integer.parseInt(s2));\
  \     //显示: 3\n    System.out.println(s1 + s2);                  //显示: 53\n    System.out.println(Integer.parseInt(s1)\
  \ + Integer.parseInt(s2)); //显示: 8\n}\n```\n\n### 字符串转实数\n\n`Double.parseDouble(value)`\n\
  \n此方法将实数的字符串表示转换为其数值等值。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    String s1\
  \ = \"6.5\";\n    String s2 = \"3.4\";\n    double x;\n    x = Double.parseDouble(s1);\n\
  \    System.out.println(x);                         //显示: 6.5\n    System.out.println(Double.parseDouble(s2));\
  \     //显示: 3.4\n    System.out.println(s1 + s2);                  //显示: 6.5.4\n\
  \    System.out.println(Double.parseDouble(s1) + Double.parseDouble(s2)); //显示:\
  \ 9.9\n}\n```\n\n### 整数值（类型转换）\n\n`(int)number`\n\n这返回 `number` 的整数部分。如果 `number`\
  \ 包含小数部分，该部分在转换过程中会丢失。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    double a\
  \ = 5.4;\n    System.out.println((int)a);          //显示: 5\n    System.out.println((int)34);\
  \         //显示: 34\n    System.out.println((int)34.9);       //显示: 34\n    System.out.println((int)-34.999);\
  \    //显示: -34\n}\n```\n\n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型的变量转换为另一种类型的方法。注意\
  \ `(int)` 并不是一个方法。它只是 Java 中将实数转换为整数的一种方式。同样注意，如果实数包含小数部分，该部分在转换过程中会丢失。\n\n### 实数值（类型转换）\n\
  \n`(double)number`\n\n这将该数字作为实数返回。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int a = 5;\n    System.out.println((double)a);      //显示: 5.0\n    System.out.println((double)34);\
  \     //显示: 34.0\n    System.out.println((double)-34);    //显示: -34.0\n    System.out.println(a\
  \ / 2);           //显示: 2\n    System.out.println((double)a / 2);         //显示:\
  \ 2.5\n    System.out.println((double)a / 2);         //显示: 2.5\n    System.out.println(a\
  \ / (double)2);         //显示: 2.5\n    System.out.println((double)a / (double)2);\
  \ //显示: 2.5\n    System.out.println(a / 2.0);               //显示: 2.5\n}\n```\n\n\
  ![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型的变量转换为另一种类型的方法。注意 `(double)` 不是一个方法。它只是 Java\
  \ 中将整数转换为实数（浮点）的一种方式。\n\n![](img/notice.jpg)在 Java 中，两个整数相除的结果始终是一个整数。因此在上例的表达式\
  \ `a / 2` 中，`a` 和 `2` 都是整数，结果也是整数。如果你希望结果为 `double` 类型，除法操作数中至少有一个是 `double`。\n\n\
  ### 幂\n\n`Math.pow(number, exp)`\n\n此方法返回 `number` 升 `exp` 次方的的结果。\n\n#### 示例\n\n\
  ![](img/my_exercise_header.png) Project_11.2\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    double a, b, c;\n    a = 2;\n    b = 3;\n    c =\
  \ Math.pow(a, b);\n    System.out.println(c); //显示: 8.0\n}\n```\n\n![](img/notice.jpg)`Math.pow(number,\
  \ exp)` 用于计算 `number` 的 `exp` 次方。\n\n### 随机数\n\n`Math.random()`\n\n此方法返回一个 0.0 到\
  \ 1.0 之间的随机 `double` 值。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    System.out.println(Math.random());\
  \ //显示: 随机数\n}\n```\n\n![](img/notice.jpg)`Math.random()` 返回一个 0.0 到 1.0 之间的随机 `double`\
  \ 值。\n\n### 随机整数\n\n`(int)(Math.random() * max) + min`\n\n此方法生成一个从 `min` 到 `max`\
  \ 之间的随机整数。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n```java\n\
  public static void main(String[] args) throws Exception {\n    int min = 5;\n  \
  \  int max = 10;\n    int random = (int)(Math.random() * (max - min)) + min;\n \
  \   System.out.println(random); //显示: 5 到 10 之间的随机整数\n}\n```\n\n![](img/notice.jpg)`(int)(Math.random()\
  \ * max) + min` 用于生成一个从 `min` 到 `max` 之间的随机整数。\n\n### 四舍五入\n\n`Math.round(number)`\n\
  \n此方法返回最接近 `number` 的整数。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    double a\
  \ = 5.5;\n    System.out.println(Math.round(a)); //显示: 6\n    double b = 5.4;\n\
  \    System.out.println(Math.round(b)); //显示: 5\n}\n```\n\n![](img/notice.jpg)`Math.round(number)`\
  \ 返回最接近 `number` 的整数。\n\n### 指定精度四舍五入\n\n`Math.round(number * Math.pow(10, precision))\
  \ / Math.pow(10, precision)`\n\n此方法根据指定的精度 `precision` 四舍五入 `number`。\n\n#### 示例\n\
  \n![](img/my_exercise_header.png) Project_11.2\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    double a = 3.14159;\n    int precision = 2;\n  \
  \  System.out.println(Math.round(a * Math.pow(10, precision)) / Math.pow(10, precision));\
  \ //显示: 3.14\n}\n```\n\n![](img/notice.jpg)`Math.round(number * Math.pow(10, precision))\
  \ / Math.pow(10, precision)` 用于根据指定的精度 `precision` 四舍五入 `number`。\n\n### 平方根\n\n\
  `Math.sqrt(number)`\n\n此方法返回 `number` 的平方根，`number` 可以是正值或零。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double x, y;\n    System.out.println(Math.sqrt(9));         //显示: 3.0\n\
  \    System.out.println(Math.sqrt(2));         //显示: 1.4142135623730951\n    x =\
  \ Math.sqrt(8);\n    System.out.println(x);                    //显示: 2.8284271247461903\n\
  \    y = Math.round(Math.sqrt(8));             //显示: 3\n}\n```\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ Project_11.2-1\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double d, x1, x2, xTemp, y1, y2, yTemp;\n    System.out.println(\"Enter\
  \ coordinates for point A:\");\n    x1 = Double.parseDouble(cin.nextLine());\n \
