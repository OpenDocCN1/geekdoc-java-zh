  \    maximum = n3;\n    maxI = 3;\n}\n...\nif (n6 > maximum) {\n    maximum = n6;\n\
  \    maxI = 6;\n}\n// 显示哪个数字在数组中出现频率最高\nSystem.out.println(maxI);\n```\n\n但现在你已经读到了这本书的最后，当然可以做一些更有创意的事情。与其将\
  \ `searchAndCount()` 方法的每个结果赋值给单独的变量 `n1`、`n2`、`n3`、`n4`、`n5` 和 `n6`，你可以将这些结果赋值给名为\
  \ `n` 的数组的 0, 1, 2, 3, 4 和 5 位置，如下所示。\n\n```java\nint[] n = new int[6];\nfor (i\
  \ = 0; i <= 5; i++) {\n    n[i] = searchAndCount(i + 1, a);\n}\n```\n\n之后，你可以使用在\
  \ 第 34.3 节 中学到的知识找到数组 `n` 的最大值。\n\n完整的解决方案所示。\n\n![](img/my_exercise_header.png)\
  \ Project_38.2-5\n\n```java\nstatic final int ELEMENTS = 100;\nstatic int dice()\
  \ {\n    return 1 + (int)(Math.random() * 5);\n}\nstatic int searchAndCount(int\
  \ x, int[] a) {\n    int count = 0;\n    int i;\n    for (i = 0; i <= ELEMENTS -\
  \ 1; i++) {\n        if (a[i] == x) {\n            count++;\n        }\n    }\n\
  \    return count;\n}\npublic static void main(String[] args) throws Exception {\n\
  \    int i, maximum, maxI;\n    // 创建 1 到 6 之间的随机整数数组 a\n    int[] a = new int[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = dice();\n    }\n    //\
  \ 创建数组 n 并显示六个数字每个在数组 a 中出现的次数\n    int[] n = new int[6];\n    for (i = 0; i <=\
  \ 5; i++) {\n        n[i] = searchAndCount(i + 1, a);\n        System.out.println(\"\
  Value \" + (i + 1) + \" appears \" + n[i] + \" times\");\n    }\n    // 找到数组 n 的最大值\n\
  \    maximum = n[0];\n    maxI = 0;\n    for (i = 1; i <= 5; i++) {\n        if\
  \ (n[i] > maximum) {\n            maximum = n[i];\n            maxI = i;\n     \
  \   }\n    }\n    // 显示哪个数字在数组中出现频率最高\n    System.out.println(\"Value \" + (maxI\
  \ + 1) + \" appears \" + maximum + \" times\");\n}\n```\n\n### 38.3 复习题\n\n完成以下习题。\n\
