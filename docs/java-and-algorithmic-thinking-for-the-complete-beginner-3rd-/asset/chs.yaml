  nSofia\\tMary\");\n```\n\n### 6.3 如何提示用户输入数据？\n\n你还记得创建算法或计算机程序涉及的三个主要阶段吗？第一阶段是“数据输入”阶段，在该阶段，计算机允许用户输入数据如数字、姓名、地址或出生。\n\
