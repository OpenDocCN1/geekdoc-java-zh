  \n## 第 18 章 多分支决策结构\n\n### 18.1 多分支决策结构\n\n多分支决策结构用于扩展选项的数量，如下图所示。\n\n当执行多分支决策结构时，首先求值\
  \ `Boolean_Expression_1`。如果结果为真，则执行紧随其后的语句或代码块；然后跳过结构的其余部分，继续执行该结构之后可能存在的任何语句。然而，如果\
  \ `Boolean_Expression_1` 为假，执行流将求值 `Boolean_Expression_2`。如果结果为真，则执行紧随其后的语句或代码块并跳过结构的其余部分。此过程持续，直到有一个布尔表达式为真或直到没有更多布尔表达式。\n\
  \n当之前所有的布尔表达式都不为真时，执行最后一个语句或代码块 `N + 1`。此外，这个最后的语句或代码块 `N + 1` 是可选的，可以省略。它取决于你要解决的算法。\n\
  \nJava 语句的通用形式为\n\n```java\nif (Boolean_Expression_1) {语句或代码块 1}\nelse if (Boolean_Expression_2)\
  \ {语句或代码块 2}\nelse if (Boolean_Expression_3) {语句或代码块 3}...else if (Boolean_Expression_N)\
  \ {语句或代码块 N}\nelse {语句或代码块 N + 1}\n```\n\n\n\n\n\n![](img/notice.jpg)最后一条语句或最后一组语句\
  \ `N + 1` 是可选的，可以省略（你也需要省略 `else` 关键字）。\n\n这里显示了一个简单的示例。\n\n![](img/my_exercise_header.png)\
  \ 项目 _18.1\n```java\npublic static void main(String[] args) throws Exception {\n\
  \    String name;\n    System.out.print(\"What is your name? \");\n    name = cin.nextLine();\n\
  \    if (name.equals(\"John\") == true) {\n        System.out.println(\"You are\
  \ my cousin!\");\n    } else if (name.equals(\"Aphrodite\") == true) {\n       \
  \ System.out.println(\"You are my sister!\");\n    } else if (name.equals(\"Loukia\"\
  ) == true) {\n        System.out.println(\"You are my mom!\");\n    } else {\n \
  \       System.out.println(\"Sorry, I don't know you.\");\n    }\n}\n```\n\n####\
