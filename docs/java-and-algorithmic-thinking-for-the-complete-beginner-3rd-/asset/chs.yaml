  \n## 第 22 章\n\n选择控制结构的技巧与窍门\n\n### 22.1 引言\n\n本章专门向你介绍一些可以帮助写出“更好”代码的实用技巧和窍门。在设计自己的算法甚至是自己的\
  \ Java 程序时，你应该始终记住这些技巧。\n\n这些技巧和窍门可以帮助你提高代码的可读性，并帮助代码变得更短甚至运行更快。当然，没有一种单一完美的方法，因为在某些情况下使用某个特定技巧可能有帮助，但在另一些情况下，同样的技巧可能会产生恰恰相反的结果。大多数时候，代码优化取决于编程经验。\n\
  \n![](img/remember.jpg) 较小的算法并不总是解决给定问题的最佳方案。为了解决某个特定问题，你可能会写一个非常短的算法，遗憾的是它会被消耗大量的\
  \ CPU 时间。另一方面，你可能用另一种算法解决同一个问题，尽管它看起来更长，但计算结果要快得多。\n\n### 22.2 选择选择控制结构\n\n下图可以帮助你根据所检查的变量数量，判断哪种选择控制结构是给定问题的更好选择。\n\
  \n![Image](img/chapter22-01.png)\n\n![](img/notice.jpg) 此图推荐最佳选项，而非唯一选项。例如，当一个变量有超过两种情况时，使用嵌套选择控制结构并不是错误。不过，所建议的多重备选择结构和所建议的分支选择结构会更加方便。\n\
  \n### 22.3 精简选择控制结构\n\n仔细观察下面给出的通用形式的流程图片段。\n\n![Image](img/chapter22-02.png)\n\n\
  如你所见，在双分支选择结构的两条路径中，开头存在两个相同的语句或语句块，结尾也存在两个相同的语句或语句块。这意味着无论 `Boolean_Expression`\
  \ 的结果如何，这些语句都会执行。因此，你可以简单地将它们移动到外面，并（分别）放在双分支选择结构的正之前和之后，如此等效结构所示。\n\n![Image](img/chapter22-03.png)\n\
  \n![](img/notice.jpg) 同样的技巧可以适用于任何选择控制结构，只要所有路径中都存在相同的语句或语句块。\n\n![](img/notice.jpg)\
  \ 在某些情况下，无法应用此技巧。例如，如果一个语句（或语句块）影响了该结构的布尔表达式，你不能将其移动到选择控制结构的正之前。\n\n你仍然感到困惑吗？接下来，你将看到一些可以帮助你更好地理解的练习。\n\
  \n#### 练习 22.3-1 “收缩”算法\n\n使用更少的语句重新设计以下流程图。\n\n![Image](img/chapter22-04.png)\n\
  \n##### 答案\n\n如你所见，语句 `y ← a * 2` 存在于双分支选择结构的两个路径中。这意味着，无论布尔表达式的结果如何，该语句都会执行。因此，你可以简单地将该语句移动到外面并放在双分支选择结构的正之前，如下。\n\
  \n![Image](img/chapter22-05.png)\n\n#### 练习 22.3-2 “收缩”Java 程序\n\n使用更少的语句重写以下 Java\
  \ 程序。\n\n```java\npublic static void main(String[] args) throws Exception {\n  \
  \  int a, y;\n    a = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n    \
  \    y = a * 4;\n        System.out.println(y);\n    } else {\n        y = a * 3;\n\
  \        System.out.println(y);\n    }\n}\n```\n\n##### 答案\n\n如你所见，语句 `System.out.println(y)`\
  \ 存在于双分支选择结构的两个路径中。这意味着无论布尔表达式的结果如何，该语句都会执行。因此，你可以简单地将它移动到外面并放在双分支选择结构的正之后，如下：\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int a,\
  \ y;\n    a = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n        y = a\
  \ * 4;\n    } else {\n        y = a * 3;\n    }\n    System.out.println(y);\n}\n\
  ```\n\n#### 练习 22.3-3 “收缩”算法\n\n使用更少的语句重新设计以下流程图，然后编写 Java 程序。\n\n![Image](img/chapter22-06.png)\n\
  \n##### 答案\n\n如果你尝试将写入语句移动到多重选择结构之外，得到的流程图显然与初始的并不等效。\n\n![Image](img/chapter22-07.png)\n\
  \n这是因为右侧的路径在初始流程图中并没有包含写入语句。\n\n![](img/remember.jpg) 如果一个语句不在所有路径中，你就无法将其移动到选择结构之外。\n\
