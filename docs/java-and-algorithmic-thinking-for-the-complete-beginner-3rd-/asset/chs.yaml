  \          if (firstNm[n].compareTo(firstNm[n - 1]) < 0) {\n                   \
  \ tempStr = firstNm[n];\n                    firstNm[n] = firstNm[n - 1];\n    \
  \                firstNm[n - 1] = tempStr;\n                }\n            }\n \
  \       }\n    }\n    //Display arrays lastNm and firstNm\n    for (i = 0; i <=\
  \ PEOPLE - 1; i++) {\n        System.out.println(lastNm[i] + \"\\t\" + firstNm[i]);\n\
  \    }\n}\n```\n\n#### 练习 34.4-5 二维数组排序\n\n编写代码片段，使二维数组的每一列按升序排序。假设该数组包含数值。\n\n\
  解法\n\n二维数组的一个例如所示。\n\n![Image](img/chapter34-17.png)\n\n由于该数组有七列，冒泡排序算法需要执行七次，每列执行一次。因此，整个冒泡排序算法应该嵌套在一个循环七次的\
  \ for 循环中。\n\n但让我们按照正确的顺序来。使用“从内层到外层”的方法，下一个代码片段对二维数组 `a` 的第一列（列索引 0）进行排序。假设变量 `j`\
  \ 包含值 0。\n\n```java\nfor (m = 1; m <= ROWS - 1; m++) {\n    for (n = ROWS - 1; n\
  \ >= m; n--) {\n        if (a[n][j] < a[n - 1][j]) {\n            temp = a[n][j];\n\
  \            a[n][j] = a[n - 1][j];\n            a[n - 1][j] = temp;\n        }\n\
  \    }\n}\n```\n\n现在，为了对所有列进行排序，你可以将此代码片段嵌套在一个遍历所有列的 for 循环中，如下：\n\n```java\nfor\
  \ (j = 0; j < COLUMNS; j++) {\n    for (m = 1; m <= ROWS - 1; m++) {\n        for\
  \ (n = ROWS - 1; n >= m; n--) {\n            if (a[n][j] < a[n - 1][j]) {\n    \
  \            temp = a[n][j];\n                a[n][j] = a[n - 1][j];\n         \
  \       a[n - 1][j] = temp;\n            }\n        }\n    }\n}\n```\n\n这并不难，对吧？\n\
  \n#### 练习 34.4-6 改进冒泡排序 – 一维数组排序\n\n编写代码片段，使二维数组的每一列按升序排序。（等等，原文说）解决此练习，当位置 `n`\
  \ 处的姓氏比位置 `n − 1` 处的姓氏“小”时，算法会交换对应的内容。但是，如果这些位置上的姓氏相同，算法则必须验证对应的名字是否按正确顺序排列。如果不是，则需要在数组\
  \ `firstNm` 中进行交换。调整后的冒泡排序算法如代码片段所示。\n\n```java\nfor (m = 1; m <= PEOPLE - 1; m++)\
  \ {\n    for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n].compareTo(lastNm[n\
  \ - 1]) < 0) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n\
  \ - 1];\n            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n\
  \            firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n\
  \        }\n        else if (lastNm[n].equals(lastNm[n - 1])) { //如果姓氏相同\n     \
  \       if (firstNm[n].compareTo(firstNm[n - 1]) < 0) { //检查对应的名字\n            \
  \    tempStr = firstNm[n]; //如果不在正确顺序，则进行交换\n                firstNm[n] = firstNm[n\
  \ - 1];\n                firstNm[n - 1] = tempStr;\n            }\n        }\n \
  \   }\n}\n```\n\n解法\n\n二维数组的一个例如所示。\n\n![Image](img/chapter34-17.png)\n\n由于该数组有七列，冒泡排序算法需要执行七次，每列执行一次。因此，整个冒泡排序算法应该在一个在一个七次的\
  \ for 循环中。\n\n但让我们按照正确的顺序来。使用“从内层到外层”的方法，下一个代码片段对二维数组 `a` 的第一列（列索引 0）进行排序。假设变量 `j`\
  \ 包含值 0。\n\n```java\nfor (m = 1; m <= ROWS - 1; m++) {\n    for (n = ROWS - 1; n\
  \ >= m; n--) {\n        if (a[n][j] < a[n - 1][j]) {\n            temp = a[n][j];\n\
  \            a[n][j] = a[n - 1][j];\n            a[n - 1][j] = temp;\n        }\n\
  \    }\n}\n```\n\n现在，为了对所有列进行排序，你可以将此代码片段嵌套在一个遍历所有列的 for 循环中，如下：\n\n```java\nfor\
  \ (j = 0; j < COLUMNS; j++) {\n    for (m = 1; m <= ROWS - 1; m++) {\n        for\
  \ (n = ROWS - 1; n >= m; n--) {\n            if (a[n][j] < a[n - 1][j]) {\n    \
  \            temp = a[n][j];\n                a[n][j] = a[n - 1][j];\n         \
  \       a[n - 1][j] = temp;\n            }\n        }\n    }\n}\n```\n\n\n\n该算法找到数组中最小（或最大，取决于排序顺序）的元素，并将其内容与位置\
  \ 0 处交换。然后对数组的剩余部分重复此过程；找到下一个最小（或最大）元素并将其放入下一个位置，直到所有元素都经过检查。\n\n例如，让我们尝试按升序对对以下数组。\n\
  \n![Image](img/chapter34-20.png)\n\n最低值是数值 `4`，位于位置 `4`。根据选择排序算法，该元素的内容与位置 `0` 处的元素交换。数组\
  \ A 变为\n\n![Image](img/chapter34-21.png)\n\n数组剩余部分（索引位置 1 到 5）中的最低值是数值 `9`，位于位置\
  \ `5`。该元素的内容与位置 `1` 处的元素交换。数组 A 变为\n\n![Image](img/chapter34-22.png)\n\n数组剩余部分（索引位置\
  \ 2 到 5）中的最低值是数值 `18`，位于位置 `4`。该元素的内容与位置 `2` 处的元素交换。数组 A 变为\n\n![Image](img/chapter34-23.png)\n\
  \n按照同样的方法，下一个最低值是数值 `19`，位于位置 `5`。数组 A 变为\n\n![Image](img/chapter34-24.png)\n\n\
  下一个最低值是数值 `36`，位于位置 `5`。该元素的内容与位置 `4` 处的元素交换，数组 A 最终按升序排序完成！\n\n![Image](img/chapter34-25.png)\n\
  \n现在让我们编写相应的 Java 程序。使用“从内层到外层”的方法是为了帮助你理解整个过程。下一个代码片段找到最小元素，然后将其内容与位置 0 处的内容交换。请注意，这是内层（嵌套）循环结构。假设变量\
  \ `m` 的值为 `0`。\n\n```java\nminimum = a[m];\nindexOfMin = m;\nfor (n = m; n <= ELEMENTS\
  \ - 1; n++) {\n    if (a[n] < minimum) {\n        minimum = a[n];\n        indexOfMin\
  \ = n;\n    }\n}\n// 找到最小值！现在，交换值。\ntemp = a[m];\na[m] = a[indexOfMin];\nindexOfMin\
  \ = temp;\n```\n\n现在，为了对数组的所有元素重复此过程，你可以将此代码片段嵌套在一个遍历所有元素的 `for` 循环中。按升序排序数组的最终选择排序算法如下：\n\
  \n```java\nfor (m = 0; m <= ELEMENTS - 1; m++) {\n    minimum = a[m];\n    indexOfMin\
  \ = m;\n    for (n = m; n <= ELEMENTS - 1; n++) {\n        if (a[n] < minimum) {\n\
  \            minimum = a[n];\n            indexOfMin = n;\n        }\n    }\n  \
  \  temp = a[m];\n    a[m] = a[indexOfMin];\n    indexOfMin = temp;\n}\n```\n\n如果你想按降序排序数组，你只需要搜索\
  \ `maximum` 而不是 `minimum`。就像冒泡排序算法一样，为了用选择排序算法对字母数字进行排序，你只需将布尔表达式 `a[n] < minimum`\
  \ 替换为 `a[n].compareTo(minimum) < 0`。\n\n### 练习 34.4-8 在保持与第二个数组关系的同时对一维数组进行排序\n\n\
  编写一个 Java 程序，提示用户输入一年内每月消耗的 kWh 总数。然后显示 kWh 消耗最高的三个月份，以及相应的 kWh 数量（降序排列）。使用选择排序算法。\n\
  \n#### 答案\n\n在本次练习中，你需要以下一维数组。\n\n![Image](img/chapter34-26.png)\n\n当选择排序算法对数组 `kwh`\
  \ 的元素进行排序时，与数组 `months` 元素的一一对应关系必须保持。这意味着每当 `kwh` 数组的两个元素交换内容时，`months` 数组对应的元素也必须交换内容。\n\
  \n然而，考虑到你只需要 kWh 消耗最高的三个月份，选择排序算法应该对前三个元素进行排序。Java 程序如下：\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int i, m, indexOfMax, n;\n  \
