  21) 5 × 5 数组是一个方数组。\n22) 在 N × N 数组的主对角线上，所有元素的行索引等于它们的列索引。\n23) 在数学中，方矩阵的反对对角线是从左上角到右下角的元素的集合。\n\
  24) N × N 数组反对对角线的任意元素都满足方程 `i + j = N − 1`，其中变量 `i` 和 `j` 分别对应行索引和列索引。\n25) 下面的代码片段计算\
