  \n### 练习 30.1-5 按用户指定的迭代\n\n编写一个 Java 程序，提示用户输入两个数字，然后计算并显示第一个数的第二个数的幂。程序必须按照用户指定的次数进行迭代。在每次计算结束时，程序必须提示用户是否希望再次计算。如果答案是“yes”，程序必须重复；否则必须结束。让你的程序接受所有可能形式的答案，如“yes”、“YES”、“Yes”甚至“YeS”。\n\
