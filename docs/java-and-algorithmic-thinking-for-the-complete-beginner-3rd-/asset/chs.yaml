  \ 中需要移动 10 个位置。\n\n![Image](img/chapter34-02.png)\n\n为了将数组 `a` 的值赋给数组 `newArr`，你可以使用下面的代码片段。\n\
  \n```java\nfor (i = 0; i <= a.length - 1; i++) {\n    newArr[i] = a[i];\n}\n```\n\
  \n然而，将数组 `b` 的值赋给数组 `newArr`，你的代码片段应该略有不同，如下：\n\n```java\nfor (i = 0; i <= b.length\
  \ - 1; i++) {\n    newArr[a.length + i] = b[i];\n}\n```\n\n最终的 Java 程序如下。\n\n![](img/my_exercise_header.png)\
  \ Project_34.1-3\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int i;\n    //Create arrays a and b\n    int[] a = {5, 10, 9, 6, 7, -6,\
  \ 13, 12, 11, 2};\n    int[] b = {-11, 25, 4, 45, 67, 87, 34, 23, 33, 55, 13, 15,\
  \ -4, -2, -22};\n    //Create array newArr\n    int[] newArr = new int[a.length\
  \ + b.length];\n    for (i = 0; i <= a.length - 1; i++) {\n        newArr[i] = a[i];\n\
  \    }\n    for (i = 0; i <= b.length - 1; i++) {\n        newArr[a.length + i]\
  \ = b[i];\n    }\n    //Display array newArr\n    for (i = 0; i <= newArr.length\
  \ - 1; i++) {\n        System.out.print(newArr[i] + \"\\t\");\n    }\n}\n```\n\n\
