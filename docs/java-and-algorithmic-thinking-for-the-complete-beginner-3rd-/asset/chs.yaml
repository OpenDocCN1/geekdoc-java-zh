  a) 完全避免拼写错误。\nb) 避免除法和乘法。\nc) 以上都是。\nd) 以上都不是。\n\n4) 下列哪个整数？\na) 5.0\nb) −5\nc)\
  \ “5”\nd) 以上都不是整数。\n\n5) 布尔变量可以持有值\na) 一个。\nb) “true”。\nc) true。\nd) 以上都不是。\n\n\
  6) 在 Java 中，字符可以\na) 被包含在单引号中。\nb) 被包含在双引号中。\nc) 以上都是。\n\n7) 下列哪个不是有效的变量？\na) city_name\n\
  b) cityName\nc) cityname\nd) city-name\n\n8) 你可以使用关键字 `static final` 定义常量。一旦定义了常量，\n\
  a) 它无法更改。\nb) 可以再次使用 `static final` 更改。\nc) 以上都不对。\n\n### 5.10 复习练习\n\n完成以下练习。\n\
