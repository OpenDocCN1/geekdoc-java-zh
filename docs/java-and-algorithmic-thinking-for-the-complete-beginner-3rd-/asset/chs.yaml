  12) 一般而言，`void` 函数可以调用任何函数。\n13) 一般而言，函数可以调用任何 `void` 函数。\n14) 在语句中，方法只能被调用一次。\n\
  15) `void` 方法可以通过其形式参数列表返回一个值。\n16) 子程序可以被另一个子程序或 `main` 代码调用。\n17) 重载是 Java 中的一项功能，允许你拥有两个或多个具有相同名称的参数。\n\
  18) 只要形式参数列表中的参数数量相等，你就可以执行重载。\n19) 重载是 Java 中的一项功能，只要它们的形式参数列表完全相同，你就可以拥有两个或多个不同名称的方法。\n\
  20) 变量的作用域指的是该变量的影响范围。\n21) 如果全局变量的值在子程序内部被更改，此更改也会反映在子程序外部。\n22) 你可以有两个同名的全局作用域变量。\n\
  23) 递归是一种子程序调用它自身的编程技术。\n24) 递归算法必须有一个基准情况。\n25) 使用递归解决问题并不总是最佳选择。\n\n### 37.10\
