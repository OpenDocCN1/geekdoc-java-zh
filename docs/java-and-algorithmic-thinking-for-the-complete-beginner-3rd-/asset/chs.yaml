  \ barks\");\n            break;\n        case \"Cat\":\n            System.out.println(\"\
  It meows\");\n            break;\n        case \"Guinea pig\":\n            System.out.println(\"\
  It squeaks\");\n            break;\n        case \"Parrots\":\n            System.out.println(\"\
  It screeches!\");\n            break;\n    }\n}\n```\n\n### 22.8 为什么代码缩进如此重要？\n\n\
  当你阅读这本书时，你可能会疑惑为什么在 Java 语句前面会出现空格字符，以及为什么这些语句没有像下面的示例那样写在段落的最左侧边缘。\n\n```java\n\
  public static void main(String[] args) throws Exception {\n    int x, y;\n    System.out.print(\"\
  Enter a number: \");\n    x = Integer.parseInt(cin.nextLine());\n    System.out.print(\"\
  Enter a second number: \");\n    y = Integer.parseInt(cin.nextLine());\n    if (x\
  \ > 5) {\n        System.out.println(\"Variable x is greater than 5\");\n    } else\
  \ {\n        x = x + y;\n        System.out.println(\"Hello Zeus!\");\n        if\
  \ (x == 3) {\n            System.out.println(\"Variable x contains a value of 3\"\
  );\n        } else {\n            x = x - y;\n            System.out.println(\"\
  Hello Olympians!\");\n            if (x + y == 24) {\n                System.out.println(\"\
  The sum of x + y is equal to 24\");\n            } else {\n                System.out.println(\"\
  Nothing of the above\");\n            }\n        }\n    }\n}\n```\n\n答案显而易见！没有缩进的代码很难阅读。这种代码会让人混淆\
  \ `else` 属于谁。\n\n代码缩进可以定义为一种组织源代码的方式。缩进通过使用空格或制表符格式化代码以提高可读性。良好的缩进非常有，即使需要花费精力，从长远来看它可以节省大量时间。遗憾的是，它有时会被忽视，问题会在之后出现。遵循特定的编程风格有助于你避免语法和逻辑错误，也有助于程序员轻松学习和理解代码。\n\
  \n代码缩进就像作者安排书籍文本的方式。他们不是写长句子，而是将文本分成章节和段落。这种做法不会改变文本含义，但使其更容易阅读。\n\n![](img/.jpg)\
  \ 所有出现在大括号 `{}` 内的语句都应该缩进。例如，通过对双分支决策结构内部的语句进行缩进，你可以在视觉上将它们区分。结果是任何人都能一眼看出布尔表达式为真时执行哪些语句，以及布尔表达式为假时执行哪些语句。\n\
  \n### 22.9 复习题：判断题\n\n对以下每个陈述选择对或错。\n\n1) 较小的算法总是解决给定问题的最佳方案。\n2) 你可以将一个语句移动到双分支决策结构的外部并在之前，只要该语句在决策结构的两个路径中都存在。\n\
  3) 你始终可以使用逻辑运算符代替嵌套的决策结构来增加可读性。\n4) 两个单分支决策结构可以合并为一个单分支决策结构，仅当它们相邻且评估的布尔表达式等价时。\n\
  5) 从双分支决策结构转换为两个单分支决策结构总是可能的。\n6) 两个单分支决策结构可以替换为一个双分支决策结构，仅当它们相邻且仅当评估相同的布尔表达式时。\n\
  7) 包含决策结构且未进行代码缩进的 Java 程序无法被计算机执行。\n\n### 22.10 复习题：多选择题\n\n为以下每个陈述选择正确答案。\n\n\n\
