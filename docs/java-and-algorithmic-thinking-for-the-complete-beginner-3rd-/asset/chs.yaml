  \n#### 练习 30.5-7 海伦公式平方根\n\n编写一个 Java 程序，提示用户输入一个非负值，然后使用海伦公式计算其平方根，如下。\n\n######\
  \ ![Image](img/chapter11-01.png)\n\nwhere\n\n\n\n\n\n`y` 是你想要寻找平方根的；`x[n]` 是 `y`\
  \ 的平方根的第 `n` 次迭代值。\n\n此外，使用循环控制结构，程序必须验证数据输入，并在用户输入任何负值时显示错误信息。\n\n## 解决方案\n\n几乎可以肯定，你现在可能正有些困惑并挠头。别被这些数学内容吓到！你可以尝试通过下面的流程图来理解海伦公式（Heron's\
  \ formula）！\n\n![Image](img/chapter30-03.png)\n\n还是很困惑？让我们来看一个例子。让我们尝试寻找 25 的平方根：\n\
  \n► 设定一个猜测。假设 `8` 为你的第一个猜测。 \n► `8` 的平方是 `64`。 \n► 由于 `64` 与 `25` 并不“足够接近”，通过计算表达式来设定新的猜测。\n\
  \n![Image](img/chapter30-04.png)\n\n► `5.56` 的平方约为 `30.91`。 \n► 由于 `30.91` 与 `25`\
  \ 并不“足够接近”，通过计算表达式来设定新的猜测。\n\n![Image](img/chapter30-05.png)\n\n► `5.02` 的平方是 `25.2`。\
  \ \n► 如果你认为 `25.2` 与 `25` “足够接近”，你就可以停止整个过程并得出结论：25 的近似平方根是 `5.02`。\n\n![](img/notice.jpg)\
  \ 显然，如果需要更高的精度，你可以继续该过程，直到找到一个被认为更接近 25 平方根的值。\n\n现在，让我们看看对应的 Java 程序。\n\n![](img/my_exercise_header.png)\n\
  \n```java\nProject_30.5-7\nstatic final double ACCURACY = 0.0000000000001;\npublic\
  \ static void main(String[] args) throws Exception {\n    double y, guess;\n   \
  \ System.out.print(\"输入一个非负数: \");\n    y = Double.parseDouble(cin.nextLine());\n\
  \    while (y < 0) {\n        System.out.print(\"无效值。请输入一个非负数: \");\n        y =\
  \ Double.parseDouble(cin.nextLine());\n    }\n    // 在 1 和用户提供的值之间产生一个随机初始猜测\n \
  \   guess = 1 + (Math.random() * y);\n    while (Math.abs(guess * guess - y) > ACCURACY)\
  \ { // 是否“足够接近”？\n        guess = (guess + y / guess) / 2; // 不是，创建一个新的“猜测”！\n \
  \   }\n    System.out.println(guess);\n}\n```\n\n![](img/notice.jpg) 注意检查“是否足够接近”的方式。当差值\
  \ `|guess² - y|` 的绝对值小于 `0.0000000000001`（其中 `y` 是用户提供的值）时，执行流将退出循环。\n\n### 练习 30.5-8\
  \ 计算 π\n\n编写一个 Java 程序，使用 Madhava–Leibniz 级数计算 `π`，精度为 `0.00001`。\n\n![Image](img/chapter30-06.png)\n\
  \n## 解决方案\n\nMadhava–Leibniz 级数可以求解 `π`，变为：\n\n![Image](img/chapter30-07.png)\n\n\
  分数越多，精度就越高！因此，为了计算这个公式，程序需要进行多次迭代，以便尽可能使用多的分数。但当然，它不能无限迭代！当当前计算的 `π` 值与上一次迭代计算的值“足够接近”时，循环实际上必须停止迭代，这意味着它们差值的绝对值已经变得非常小。常量\
  \ `ACCURACY` 定义了这种差值必须有多小。Java 程序所示：\n\n```java\nmy_exercise_header.png\n Project_30.5-8\n\
  static final double ACCURACY = 0.00001;\npublic static void main(String[] args)\
  \ throws Exception {\n    double pi, piPrevious;\n    int sign, denom;\n    pi =\
  \ 0;\n    sign = 1; // 这是第一个分数的符号\n    denom = 1; // 这是第一个分的分母\n    do {\n     \
  \   piPrevious = pi; // 保留上一次的 pi\n        pi += sign * 4 / (double)denom; // 通过增加分数（项）计算新的\
  \ pi\n        sign = -sign; // 为下一个分数准备符号\n        denom += 2; // 为下一个分数准备分母\n \
  \   } while (Math.abs(pi - piPrevious) > ACCURACY); // 是否“足够接近”？\n    System.out.println(\"\
  Pi ~= \" + pi);\n}\n```\n\n![](img/notice.jpg) 注意变量 `sign` 在每次迭代中在 `-1` 和 `+1` 值之间切换的方式。\n\
  \n如果你减小常量 `ACCURACY` 的值，`π` 将计算得精确。取决于你计算机的速度，你可以相当快地计算出 `π` 的前五位。然而，计算 `π` 的每个后续数字所需的时间会呈指数级增长。在现代计算机上使用这种方法计算\
  \ 40 位 `π` 可能需要多年时间！\n\n### 练习 30.5-9 用分数近似实数\n\n编写一个 Java 程序，提示用户输入一个介于 `0` 和 `100`\
  \ 之间的实数，然后尝试找到更好地近似它的分数，其中 `N` 是 `0` 到 `100` 之间的整数，`M` 是 `1` 到 `100` 之间的整数。使用循环控制结构，程序还必须验证数据输入，允许用户只输入\
  \ `0` 到 `100` 之间的值。不需要显示任何错误信息。\n\n## 解决方案\n\n解决方案很简单。你只需要需要遍历变量 `n` 和 `m` 的所有可能组合，并检查哪一个更好地近似用户提供的实数。\n\
  \n要遍历变量 `n` 和 `m` 的所有可能组合，你可以使用嵌套循环控制结构，即两个嵌套在另一个内部的 `for`循环，如下：\n\n```java\nfor\
  \ (n = 0; n <= 100; n++) {\n    for (m = 1; m <= 100; m++) {\n        // ...\n \
  \   }\n}\n```\n\n![](img/notice.jpg) 迭代总次数为 `101 × 100 = 10100`。这是一个相当大的数字，但对于现代计算机来说，这小一桩！\n\
  \n![](img/notice.jpg) 变量 `m` 代表分数的分母，分母不能为零。这就是为什么它从 `1` 开始，而不是从 `0` 开始。\n\n以下标准：\n\
  \n![Image](img/chapter30-09.png)\n\n可以评估近似有多“好”。\n\n困惑吗？让我们尝试用分数近似值 `0.333`，遍历 `N`\
  \ 和 `M` 的所有可能组合。\n\n► 对于 `N = 1`, `M = 1`，标准等于 ![Image](img/chapter30-10.png) =\
  \ `0.6670`\n► 对于 `N = 1`, `M = 2`，标准等于 ![Image](img/chapter30-11.png) = `0.1670`\n\
  ► 对于 `N = 1`, `M = 3`，标准等于 ![Image](img/chapter30-12.png) = `0.0003`\n► 对于 `N =\
  \ 1`, `M = 4`，标准等于 ![Image](img/chapter30-13.png) = `0.0830`\n► …\n► 对于 `N = 100`,\
  \ `M = 99`，标准等于 ![Image](img/chapter30-14.png) = `0.6771`\n► 对于 `N = 100`, `M =\
  \ 100`，标准等于 ![Image](img/chapter30-15.png) = `0.6670`\n\n显而易见，`0.0003` 是所有可能结果中的最小值。因此，组合\
  \ `N = 1` 和 `M = 3`（对应分数 `1/3`）被认为是值 `0.333` 的最佳近似。\n\n现在是 Java 程序：\n\n```java\n\
  my_exercise_header.png\n Project_30.5-9\npublic static void main(String[] args)\
  \ throws Exception {\n    double x, y, minimum;\n    int bestN, bestM, n, m;\n \
  \   do {\n        System.out.print(\"输入一个 0 到 100 之间的实数: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \    } while (x < 0 || x > 100);\n    bestN = 1;\n    bestM = 1;\n    minimum =\
  \ 100;\n    for (n = 0; n <= 100; n++) {\n        for (m = 1; m <= 100; m++) {\n\
  \            y = Math.abs(n /(double)m - x);\n            if (y < minimum) {\n \
  \               minimum = y;\n                bestN = n;\n                bestM\
  \ = m;\n            }\n        }\n    }\n    System.out.println(\"分数是: \" + bestN\
  \ + \" / \" + bestM);\n}\n```\n\n![](img/notice.jpg) 注意变量 `m` 转换为 `double` 类型会欺骗\
  \ Java 并执行普通除（返回实数的除）。如果你省略 `(double)` 转换运算符，由于被除数除数都是 `int`，Java 将执行整数除并产生错误结果。\n\
  \n### 30.6 循环控制结构的通用性质练习\n\n#### 练习 30.6-1 华氏度转开尔文度，从 0 到 100\n\n编写一个 Java 程序，显示从\
