  Indeterminate form\");\n    }\n}\n```\n\n### 23.4 连续值的练习\n\n正如你所所看到的，在很多问题中，变量的值或表达式的结果决定了必须执行的语句或块。在后面的练习中，你将学习如何测试一个值或表达式的结果是否属于特定范围（一系列连续范围）。\n\
  \n假设你想显示在不同温度下女性可能穿着的衣服。\n\n| 室外（华氏度） | 女性可能穿着的衣服 |\n| --- | --- |\n| 温度 < 45 |\
  \ 毛衣、外套、牛仔裤、鞋 |\n| 45 ≤ 温度 < 65 | 毛衣、牛仔裤 |\n| 65 ≤ 温度 < 75 | 短裤、T 恤、背心、运动鞋 |\n|\
  \ 75 ≤ 温度 | 短裤、T 恤、背心、裙子、凉鞋 |\n\n从表面上看，单分支选择结构似乎是逻辑选择。虽然没有错误，但更深入的分析表明，每个条件是相互依赖的，这意味着当其中一个条件为真时，其他的就不应该被评估。你需要从一组可能性中仅选择一个。\n\
  \n要解决这种类型的练习，你可以使用多重分支选择结构或嵌套决策控制结构。然而，前者是最佳选择，因为它更方便且增加了可读性，正如接下来的代码片段所示。\n\n```java\n\
