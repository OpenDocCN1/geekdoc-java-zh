  \n\n\n\n变量是内存中存储数值的良好方法，但它们有一个局限性——它们一次时刻只能存储一个值。然而，在许多情况下，程序需要在内存中保留大量数据，此时变量并不是最佳选择。\n\
  \n例如，考虑以下练习题：\n\n编写一个 Java 程序，让用户输入三个数字。然后按升序排列显示这些数字。\n\n考虑以下代码片段。它允许用户输入三个数字。\n\
  \n```java\nfor (i = 0; i <= 2; i++) {number = Double.parseDouble(cin.nextLine());}\n\
  ```\n\n当循环最终完成迭代时，变量 `number` 只包含最后提供的那个数字。遗憾的是，之前的两个数字都丢失了！使用这段代码片段，几乎无法按升序排列显示这些数字。\n\
  \n一种可能的解决方案是使用三个独立的变量，如下所示。\n\n```java\nnum1 = Double.parseDouble(cin.nextLine());num2\
  \ = Double.parseDouble(cin.nextLine());num3 = Double.parseDouble(cin.nextLine());if\
  \ (num1 <= num2 && num2 <= num3)System.out.println(num1 + \"  \" + num2 + \"  \"\
  \ + num3);else if (num1 <= num3 && num3 <= num2)System.out.println(num1 + \"  \"\
  \ + num3 + \"  \" + num2);else if (num2 <= num1 && num1 <= num3)System.out.println(num2\
  \ + \"  \" + num1 + \"  \" + num3);else if (num2 <= num3 && num3 <= num1)System.out.println(num2\
  \ + \"  \" + num3 + \"  \" + num1);else if (num3 <= num1 && num1 <= num2)System.out.println(num3\
  \ + \"  \" + num1 + \"  \" + num2);elseSystem.out.println(num3 + \"  \" + num2 +\
  \ \"  \" + num1);\n```\n\n这不是一个完美的解决方案，但它有效！然而，如果这个练习题的描述要求用户输入 1,000 个数字而不是 3 个呢？考虑一下！你能为所有这些数字编写一个类似的\
  \ Java 程序吗？显然不能！幸运的是，有数据结构！\n\n![](img/notice.jpg)在计算机科学中，数据结构是数据的集合，通过组织这些数据，你可以用最有效的方式对其进行操作。\n\
  \nJava 中有几种数据结构，如数组、链表、栈、队列、二叉树、堆、哈希表、哈希 Map 和字符串。是的，你听没错！由于字符串是字母数字字符的集合，因此被认为是一种数据结构。\n\
  \n除了字符串（你已经学习了足够的内容），数组和 HashMap 是 Java 中最常用的数据结构。接下来的章节将对它们进行分析。\n\n### 31.2 什么是数组？\n\
  \n数组是一种数据结构类型，可以在一个公共名称下存储多个值。它可以被看作元素的集合，其中每个元素都被分配了一个唯一的数字，称为索引位置（index position），或简称为索引（index）。数组是可变的，这意味着一旦创建了数组，其元素的值就可以更改。\n\
  \n![](img/notice.jpg)计算机科学中的数组类似于数学中使用的矩阵。数学矩阵是数字或其他数学对象的集合，按行和列排列。\n\n数组分为一维数组多维数组。多维数组可以是二维、三维、四维等等。\n\
  \n#### 一维数组\n\n以下示例展示了一个存储六个学生成绩的一维数组。该数组的名称为 `grades`。为了方便起见，相应的索引写在每个元素上方。在 Java\
  \ 中，默认索引编号始终从零开始。\n\n![Image](img/chapter31-01.png)\n\n![](img/remember.jpg)由于索引编号从零开始，数组最后一个元素的索引比数组元素的总数少\
  \ 1。在 `grades` 数组中，最后一个元素的索引是 5，而元素总数为 6。\n\n你可以将数组想象成六个独立的变量——`grades0`、`grades1`、`grades2`、……\
  \ `grades5`——每个变量都持有一个学生的成绩。然而，数组的优势在于它可以在一个公共名称下持有多个值。\n\n#### 二维数组\n\n通常情况下，多维数组对于处理多组数据非常有用。例如，假设你想存储加利福尼亚州四月前四周的每日最高气温。一种方法是四个四个维数组，每周一个。此外，每个数组将有七个元素，对应每周的每一天，如下。\n\
  \n![Image](img/chapter31-02.png)\n\n然而，这种方法有点笨拙，因为你必须分别处理每个数组。更好的方法是使用一个具有四行（每周一行）和七列（每周一天列）的二维数组，如下。\n\
  \n![Image](img/chapter31-03.png)\n\n#### 三维数组\n\n下一个示例显示了一个三维数组，存储 2013 年和 2014\
  \ 年加利福尼亚州四月前四周的每日最高气温。\n\n![Image](img/chapter31-04.png)\n\n![](img/notice.jpg)注意，四维、五维甚至百维数组也是存在的。然而，经验表明，作为一个程序员，你生活中需要的最大数组维度可能二维或三维。\n\
  \n#### 练习 31.2-1 设计\n\n设计一个可以存储八个人年龄的数组，然后向数组添加一些值。\n\n解答设计一个存储八个人年龄的数组，然后向其添加一些值。这对于元素\
  \ 0 到 7 很容易。\n\n![Image](img/chapter31-05.png)\n\n#### 练习 31.2-2 设计\n\n设计存储七个人姓名和年龄的必要数组，然后向其添加一些值。\n\
  \n解答可以使用两个数组来实现。第一个人是 John Thompson，他 17 岁。下一个人是 Ava Miller，她 25 岁。\n\n![Image](img/chapter31-06.png)\n\
  \n#### 练习 31.2-3 设计\n\n设计存储十个人姓名以及他们在一月、二月和三月的平均体重（磅）的必要数组。然后向数组添加一些值。\n\n解答在这个练习中，你需要一个用于姓名的一维数组和一个用于体重的二维数组，它们的元素之间有一一对应关系。\n\
  \n![Image](img/chapter31-07.png)\n\n### 31.3 在 Java 中创建一维数组\n\nJava 有许多方法创建数组并向其添加元素。取决于给定的问题，由你决定使用哪种。\n\
  \n让我们尝试常用方法创建以下数组。\n\n![Image](img/chapter31-08.png)\n\n#### 第一种方法\n\n要创建数组并直接为其元素赋值，你可以使用下一个\
  \ Java 语句，通用形式如下：\n\n`type[] array_name = { value0, value1, value2, … , valueM };`\n\
  \n其中\n\n- `type` 可以是 `int`、`double`、`String` 等。\n- `array_name` 是数组的名称。\n- `value0`、`value1`、`value2`、……\
  \ `valueM` 是数组元素的值。\n\n对于这种方法，你可以使用以下语句创建 `ages` 数组：\n\n```java\nint[] ages = {12,\
  \ 25, 9, 11};\n```\n\n![](img/notice.jpg)索引会自动设置。值 12 分给索引位置 0 的元素，值 25 分给索引位置 1\
  \ 的元素，以此类推。索引编号始终从零开始。\n\n\n\n![](img/notice.jpg)在 第 5.4 节 中，你学习了为变量命名时必须遵循的规则。为数组命名也遵循完全相同的规则！\n\
  \n## 第二种方法\n\n在 Java 中，你可以使用以下通用语句创建一个大小为 `size` 的空元素数组：\n\n```java\ntype[] array_name\
  \ = new type[size];\n```\n\n其中 `size` 可以是任何正整数值，甚至可以是一个包含任何正整数值的变量。\n\n下一条语句创建一个包含\
  \ 4 个空元素的 `ages` 数组：\n\n```java\nint[] ages = new int[4];\n```\n\n![](img/notice.jpg)语句\
  \ `int[] ages = new int[4]` 在主内存（RAM）中预留了四个位置。\n\n要给数组元素赋值，你可以使用以下通用语句：\n\n```java\n\
  array_name[index] = value;\n```\n\n其中 `index` 是该元素在数组中的索引位置。\n\n接下来的代码段创建了 array\
  \ 了 `ages` 数组（在主内存中预留了四个位置），然后给它的元素赋值：\n\n```java\nint[] ages = new int[4];\nages[0]\
  \ = 12;\nages[1] = 25;\nages[2] = 9;\nages[3] = 11;\n```\n\n![](img/notice.jpg)数组\
  \ `ages` 的大小为 4。\n\n当然，除了使用常量值作为 `index` 外，你也可以使用变量或表达式，如下：\n\n```java\nint k;\n\
  int[] ages = new int[4];\nk = 0;\nages[k] = 12;\nages[k + 1] = 25;\nages[k + 2]\
  \ = 9;\nages[k + 3] = 11;\n```\n\n### 31.4 如何从一维数组中获取值\n\n从数组中获取值只需指向特定元素。一维数组的每个元素都可以使用\
  \ `index` 唯一标识。接下来的代码段创建了一个数组并在屏幕上显示“A+”（不带双引号）：\n\n```java\nString[] grades = {\"\
  B+\", \"A+\", \"A\", \"C-\"};\nSystem.out.println(grades[1]);\n```\n\n当然，除了使用常量值作为\
  \ `index` 外，你也可以使用变量或表达式。接下来的示例创建了一个数组并在屏幕上显示“Aphrodite and Hera”（不带双引号）：\n\n```java\n\
  String[] gods = {\"Zeus\", \"Ares\", \"Hera\", \"Aphrodite\", \"Hermes\"};\nk =\
  \ 2;\nSystem.out.println(gods[k + 1] + \" and \" + gods[k]);\n```\n\n#### 练习 31.4-1\
  \ 创建追踪表\n\n为下面的代码段创建追踪表：\n\n```java\nint x;\nint[] a = new int[4];\na[3] = 9;\n\
  x = 0;\na[x] = a[3] + 4;\na[x + 1] = a[x] * 3;\nx++;\na[x + 2] = a[x - 1];\na[2]\
  \ = a[1] + 5;\na[3] = a[3] + 1;\n```\n\n##### 答案\n\n不要忘记你可以像操作变量一样操作数组的每个元素。因此，当你为使用数组的\
  \ Java 程序创建追踪表时，可以为每个元素设置一列如下：\n\n| 步骤 | 语句 | 注释 | x | a[0] | a[1] | a[2] | a[3]\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | `int[] a =\
  \ new int[4]` | 创建了一个没有值的数组 `a` | ? | ? | ? | ? | ? |\n| 2 | `a[3] = 9` | | ? |\
  \ ? | ? | ? | 9 |\n| 3 | `x = 0` | | 0 | ? | ? | ? | 9 |\n| 4 | `a[x] = a[3] + 4`\
  \ | | 0 | 13 | ? | ? | 9 |\n| 5 | `a[x + 1] = a[x] * 3` | | 0 | 13 | 39 | ? | 9\
  \ |\n| 6 | `x++` | | 1 | 13 | 39 | ? | 9 |\n| 7 | `a[x + 2] = a[x - 1]` | | 1 |\
  \ 13 | 39 | ? | 13 |\n| 8 | `a[2] = a[1] + 5` | | 1 | 13 | 39 | 44 | 13 |\n| 9 |\
  \ `a[3] = a[3] + 1` | | 1 | 13 | 39 | 44 | 14 |\n\n#### 练习 31.4-2 使用不存在的索引\n\n以下\
  \ Java 程序没有满足算法的哪些属性？\n\n```java\npublic static void main(String[] args) throws\
  \ Exception {\n    String[] grades = {\"B+\", \"A+\", \"A\", \"C-\"};\n    System.out.println(grades[100]);\n\
  }\n```\n\n##### 答案\n\n该 Java 程序没有满足算法的**确定性**（Definiteness），因为它尝试访问一个不存在的索引，导致抛出异常。\n\
  \n### 31.5 如何修改数组的值\n\n要给数组元素赋值，你可以使用以下通用语句：\n\n```java\narray_name[index] = value;\n\
  ```\n\n其中 `index` 是该元素在数组中的索引位置。\n\n接下来的代码段创建了 `ages` 数组（在主内存中预留了四个位置），然后给它的元素赋值：\n\
  \n```java\nint[] ages = new int[4];\nages[0] = 12;\nages[1] = 25;\nages[2] = 9;\n\
  ages[3] = 11;\n```\n\n### 31.6 如何遍历一维数组\n\n从数组中获取值只需指向特定元素。一维数组的每个元素都可以使用 `index`\
  \ 唯一标识。接下来的代码段创建了一个数组并在屏幕上显示“A+”（不带双引号）：\n\n```java\nString[] grades = {\"B+\",\
  \ \"A+\", \"A\", \"C-\"};\nSystem.out.println(grades[1]);\n```\n\n当然，除了使用常量值作为 `index`\
  \ 外，你也可以使用变量或表达式。接下来的示例创建了一个数组并在屏幕上显示“Aphrodite and Hera”（不带双引号）：\n\n```java\nString[]\
  \ gods = {\"Zeus\", \"Ares\", \"Hera\", \"Aphrodite\", \"Hermes\"};\nk = 2;\nSystem.out.println(gods[k\
  \ + 1] + \" and \" + gods[k]);\n```\n\n### 31.7 如何从一维数组中获取值\n\n*注：原文部分存在大量重复和标题混乱，此处已根据逻辑进行了整合和翻译。*\n\
  \n要遍历数组有两种主要方法可以考虑：\n\n#### 第一种方法：使用 for 循环\n\n这种方法使用索引遍历数组。下面的示例展示了如何使用这种方法：\n\n\
  ```java\nint i;\nint[] gods = {\"Zeus\", \"Ares\", \"Hera\", \"Aphrodite\", \"Hermes\"\
  };\nfor (i = 0; i < 5; i++) {\n    System.out.println(gods[i]);\n}\n```\n\n####\
  \ 第二种方法：使用 foreach 循环\n\n除了 `for` 循环，还有另一种循环：`foreach` 循环。有时可以使用（甚至必须）使用它。`foreach`\
  \ 循环的通用形式为：\n\n```java\nfor (type element : sequence) {\n    // 语句或语句块\n}\n```\n\
  \n其中：\n- `element` 必须是 `type` 变量。它必须与 `sequence` 中元素的类型匹配。\n- `sequence` 必须是可迭代的数据结构，例如数组。\n\
  \n下面的代码显示了 `grades` 的所有元素：\n\n```java\nString[] grades = {\"B+\", \"A+\", \"A\"\
  , \"C-\"};\nfor (String grade : grades) {\n    System.out.println(grade);\n}\n```\n\
  \n**重要注意**：请记住 `foreach` 循环不能用于修改数组元素的值。例如，如果你想让数组 `numbers` 中的所有元素翻倍，你不能这样做：\n\n\
  ```java\nint[] numbers = {5, 10, 3, 2};\nfor (int number : numbers) {\n    number\
  \ = number * 2;\n}\n```\n\n#### 练习 31.6-1 求和\n\n编写一个 Java 程序，创建一个包含以下值的数组：\n\n56,\
  \ 12, 33, 8, 3, 2, 98\n\n\n\n然后计算并显示它们的和。\n\n## 解决方案\n\n你学习了两种遍历数组元素的方法。让我们都使用这两种方法并观察差异。\n\
  \n### 第一种方法\n\n解决方案如下。\n\n![](img/my_exercise_header.png) Project_31.6-1a\n```java\n\
  public static void main(String[] args) throws Exception {\n    int i, total;\n \
  \   int[] values = {56, 12, 33, 8, 3, 2, 98};\n    total = 0;\n    for (i = 0; i\
  \ <= 6; i++) {\n        total += values[i];  //这等于 total = total + values[i]\n \
  \   }\n    System.out.println(total);\n}\n```\n\n### 第二种方法\n\n解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ Project_31.6-1b\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int total;\n    int[] values = {56, 12, 33, 8, 3, 2, 98};\n    total =\
  \ 0;\n    for (int value : values) {\n        total += value;\n    }\n    System.out.println(total);\n\
  }\n```\n\n### 31.7 如何将用户输入的值添加到一维数组中\n\n这里没有新内容。与其从键盘读取一个值并将其赋值给变量，不如直接将该值赋值给特定的数组元素。接下来的代码段提示用户输入四个名字，并将它们赋值给数组\
  \ `names` 中索引位置为 0, 1, 2 和 3 的元素。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {\n    String[] names = new String[4];  //在主内存（RAM）中预留 4 个位置\n\
  \    System.out.print(\"Enter name No 1: \");\n    names[0] = cin.nextLine();\n\
  \    System.out.print(\"Enter name No 2: \");\n    names[1] = cin.nextLine();\n\
  \    System.out.print(\"Enter name No 3: \");\n    names[2] = cin.nextLine();\n\
  \    System.out.print(\"Enter name No 4: \");\n    names[3] = cin.nextLine();\n\
  \    …\n```\n\n使用 for 循环，这段代码段可以等价地写为：\n\n```java\nstatic final int ELEMENTS = 4;\n\
  public static void main(String[] args) throws Exception {\n    int i;\n    String[]\
  \ names = new String[ELEMENTS];  //在主内存（RAM）中预留 4 个位置\n    for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n        System.out.print(\"Enter name No \" + (i + 1) + \": \");\n\
  \        names[i] = cin.nextLine();\n    }\n    …\n```\n\n![](img/notice.jpg)处理数组大小的好策略是使用常量。\n\
  \n#### 练习 31.7-1 反序显示单词\n\n编写一个 Java 程序，让用户输入 20 个单词。程序必须按照与提供顺序的完全相反的顺序显示这些单词。\n\
  \n##### 解决方案\n\n数组非常适合这类问题。以下是一个适当的解决方案。\n\n![](img/my_exercise_header.png) Project_31.7-1\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    String[] words = new String[20];\n    for (i = 0; i <= 19; i++) {\n       \
  \ words[i] = cin.nextLine();\n    }\n    for (i = 19; i >= 0; i--) {\n        System.out.println(words[i]);\n\
  \    }\n}\n```\n\n![](img/remember.jpg)由于索引编号从零开始，最后一个数组元素的索引比数组中元素的总数少 1。\n\n![](img/notice.jpg)有时练习的措辞可能没有提到使用数据结构。然而，这并不意味着你不能使用它。当你发现有必要时，请使用数据结构（数组、哈希表等）。\n\
  \n#### 练习 31.7-2 反序显示正数\n\n编写一个 Java 程序，让用户向数组输入 100 个数字。然后，它只按照与提供顺序的完全相反的顺序显示正数。\n\
  \n##### 解决方案\n\n在这次练习中，程序必须接受用户输入的所有值并将它们存储在数组中。然而，在负责显示数组元素的 for 循环中，必须使用嵌套决策控制结构来检查并只显示正值。解决方案如下。\n\
  \n![](img/my_exercise_header.png) Project_31.7-2\n```java\nstatic final int ELEMENTS\
  \ = 100;\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    double[] values = new double[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1;\
  \ i++) {\n        values[i] = Double.parseDouble(cin.nextLine());\n    }\n    for\
  \ (i = ELEMENTS - 1; i >= 0; i--) {\n        if (values[i] > 0) {\n            System.out.println(values[i]);\n\
  \        }\n    }\n}\n```\n\n#### 练习 31.7-3 计算平均值\n\n编写一个 Java 程序，提示用户向数组输入 20 个数字。只有当它们的平均值小于\
  \ 10 时，才显示消息。\n\n##### 解决方案\n\n为了找到用户提供的数字的平均值，程序必须首先找到它们的和，然后将该和除以 20。一旦找到平均值，程序必须检查是否显示相应的消息。\n\
  \n![](img/my_exercise_header.png) Project_31.7-3a\n```java\nstatic final int ELEMENTS\
  \ = 20;\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    double total, average;\n    double[] values = new double[ELEMENTS];\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        System.out.print(\"Enter a value: \"\
  );\n        values[i] = Double.parseDouble(cin.nextLine());\n    }\n    //在 total\
  \ 中累加值\n    total = 0;\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        total\
  \ += values[i];\n    }\n    average = total / ELEMENTS;\n    if (average < 10) {\n\
  \        System.out.println(\"Average value is less than 10\");\n    }\n}\n```\n\
  \n如果你在想这个练习是否可以使用一个 for 循环来解决，答案是“可以的”。接下来是另一种替代解决方案。\n\n![](img/my_exercise_header.png)\
  \ Project_31.7-3b\n```java\nstatic final int ELEMENTS = 20;\npublic static void\
  \ main(String[] args) throws Exception {\n    int i;\n    double total, average;\n\
