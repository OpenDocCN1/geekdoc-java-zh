  \ 程序可以遵循之前的步骤，在这种情况下，它必须遍历行而不是列。\n\n### 练习 34.5-8 二分查找算法——在排序的一维数组中搜索\n\n编写一个代码片段，在排序的一维数组上执行搜索以找到给定值。使用二分查找算法。\n\
  \n#### 解决方案\n\n二分查找算法被认为非常快，可以用于大规模数据。但它的主要缺点是数据需要经过排序。\n\n二分查找算法的核心思想是首先检查数组中间的元素。如果它不匹配你正在寻找的“大海捞针”，算法将确定目标是比中间元素小还是大。换句话说，如果你寻找的“针”小于中间元素的值，意味着“针”可能在数组的前半部分；否则，它可能在数组的后半部分。这个过程持续持续，通过检查剩余半部分的中间元素来缩小搜索范围，直到找到“针”或所检查的数组部分减少到单个元素。\n\
  \n\n\n\n使用了三个变量。初始时，变量 `left` 包含值 `0`（这是第一个元素的索引），变量 `right` 包含值 `13`（这是最后一个元素的索引），变量\
  \ `middle` 包含值 `6`（这约为中间元素的索引）。\n\n![Image](img/chapter34-39.png)\n\n你正在寻找的“针”（值\
  \ `44`）大于中间的数值 `39`，因此你正在寻找的元素可能在数组的后半部分。因此，变量 `left` 更新为指向索引位置 `7`，变量 `middle`\
  \ 更新为 `left`（新值）和 `right` 之间的中间点，如下所示。\n\n![Image](img/chapter34-40.png)\n\n现在，你正在寻找的“针”（值\
  \ `44`）小于中间的数值 `57`，因此你正在寻找的元素可能在所检查数组的前半部分。因此，现在更新变量 `right` 指向索引位置 `9`，变量 `middle`\
  \ 更新为指向 `left` 和 `right`（新值）之间的中间点，如下所示。\n\n![Image](img/chapter34-41.png)\n\n你完成了！在索引位置\
  \ `8` 处找到了“针”，整个过程可以停止！\n\n![](img/remember.jpg)每次失败的比较都会让剩余检查的元素数量减少一半！\n\n![](img/notice.jpg)索引变量\
  \ `left` 和 `right` 每次分别指向所检查数组部分的开头和末尾。\n\n现在，让我们看看对应的代码片段。\n\n```\nleft = 0;right\
  \ = ELEMENTS - 1;found = false;while (left <= right && !found) {\n  middle = (int)((left\
  \ + right) / 2);  //这是一个除以 2 的操作\n  if (needle < haystack[middle]) {   //如果针在所检查数组的前半部分\n\
  \    right = middle - 1;              //更新右侧索引\n  }else if (needle > haystack[middle])\
  \ {  //如果是在后半部分，\n    left = middle + 1;                   //更新左侧索引\n  }else {\n\
  \    found = true;\n  }\n}\nif (!found) {System.out.println(\"Nothing found!\");}else\
  \ {System.out.println(needle + \" found at position: \" + middle);}\n```\n\n![](img/notice.jpg)二分查找算法非常高效，因为它每次迭代都大幅减少了搜索空间，使其对于排序数组非常有效。在示例数组上使用该算法，只需三次迭代即可找到值\
  \ `44`。相比之下，线性搜索算法对于相同的数据需要九次迭代！\n\n![](img/notice.jpg)如果数组包含多个相同的值，二分查找算法只能找到其中一个出现。\n\
