  }System.out.println(total);}\n```\n\n![](img/notice.jpg)注意循环控制结构内部缺少 `i++` 语句。在\
  \ `for` 语句中，计数器（此处为变量 `i`）在每次循环迭代结束时自动更新（此处为增加）。\n\n### 练习 26.1-5 求从 0 到 N 的平方根\n\
