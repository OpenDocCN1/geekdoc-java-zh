  \ 的内置方法一样被调用。\n\n### 36.7 void 方法是如何执行的？\n\n当主代码调用 void 方法时，会执行以下步骤：\n\n► 主代码中语句的执行被中断。\n\
  ► 实际参数列表中存在的变量值或表达式的结果被传递（赋值）给形式参数列表中的对应参数（变量），并且执行流跳转到编写 void 方法的地方。\n► 执行 void\
  \ 方法的语句。\n► 当执行流到达 void 方法的末尾时，执行流将从调用 void 方法之前的地方继续执行。\n\n在下一个 Java 程序中，void 方法\
  \ `minimum()` 通过其形式参数列表接受三个参数（数值）并显示最低值。\n\n![](img/my_exercise_header.png) 项目 _36.7\n\
  ```java\nstatic void minimum(double val1, double val2, double val3) {\n    double\
  \ minim;\n    minim = val1;\n    if (val2 < minim) {\n        minim = val2;\n  \
  \  }\n    if (val3 < minim) {\n        minim = val3;\n    }\n    System.out.println(minim);\n\
  }\npublic static void main(String[] args) throws Exception {\n    double a, b, c;\n\
  \    a = Double.parseDouble(cin.nextLine());\n    b = Double.parseDouble(cin.nextLine());\n\
  \    c = Double.parseDouble(cin.nextLine());\n    minimum(a, b, c);\n    System.out.println(\"\
  The end\");\n}\n```\n\n当 Java 程序开始运行时，执行执行的第一条语句是 `a = Double.parseDouble(cin.nextLine())`（这被认为是程序的第一个语句）。假设用户输入了值\
  \ 9, 6 和 8。\n\n| Step | 主代码的语句 | `a` | `b` | `c` |\n| --- | --- | --- | --- | ---\
  \ |\n| 1 | `a = Double.parseD…` | 9.0 | ? | ? |\n| 2 | `b = Double.parseD…` | 9.0\
  \ | 6.0 | ? |\n| 3 | `c = Double.parseD…` | 9.0 | 6.0 | 8.0 |\n| 4 | `minimum(a,\
  \ b, c)` | | | |\n\n当调用 void 方法 `minimum()` 时，主代码语句的执行被中断，变量 `a`、`b` 和 `c` 的值被传递给相应的形式参数\
  \ `val1`、`val2` 和 `val3`。\n\n| Step | void 方法的语句 | `val1` | `val2` | `val3` | `minim`\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `minim = val1` | 9.0 | 6.0 | 8.0\
