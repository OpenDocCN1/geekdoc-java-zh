  What is your name?\");\n    displayLine(18);\n}\n```\n\n由于 void 方法 `displayLine()`\
  \ 没有返回值，因此下一行代码是错误的。你不能将 void 方法赋值给变量，因为没有任何返回的值！\n\n```\ny = display_line(12);\n\
  ```\n\n此外，你不能在语句中调用它。下一行代码也是错误的。\n\n```java\nSystem.out.println(\"Hello there!\\\
  n\" + display_line(12));\n```\n\n### 36.5 形式参数与实形参数\n\n每个方法（或 void 方法）都包含一个名为形式参数列表（formal\
  \ argument list）的参数列表。如所述，此列表中的参数是可选的；形式参数列表可以不包含参数、一个参数或多个参数。\n\n当调用一个子程序（方法或 void\
  \ 方法）时，可以将一个参数列表传递给该子程序。这个列表被称为实形参数列表（actual argument list）。\n\n在接下来的示例中，形式参数（变量）`n1`\
  \ 和 `n2` 构成形式参数列表，而实形参数（变量）`x` 和 `y` 以及实形参数（表达式）`x + y` 和 `y / 2` 构成实形参数列表。\n\n\
  ![](img/my_exercise_header.png) Project_36.5\n\n```java\n// Define the method multiply().\n\
  // The two arguments n1 and n2 are called formal arguments.\nstatic double multiply(\
  \ double n1, double n2 ) {\n    double result;\n    result = n1 * n2;\n    return\
  \ result;\n}\n\n// Main code starts here\npublic static void main(String[] args)\
  \ throws Exception {\n    double x, y, w;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    y = Double.parseDouble(cin.nextLine());\n    // Call the method multiply().\n\
  \    // The two arguments x and y are called actual arguments.\n    w = multiply(\
  \ x, y );\n    System.out.println(w);\n    // Call the method multiply().\n    //\
  \ The two arguments x + y and y / 2 are called actual arguments.\n    System.out.println(multiply(\
  \ x + 2, y / 2 ));\n}\n```\n\n![](img/notice.jpg) 注意，形式参数和实形参数之间存在一一对应的关系。在第一次调用中，实形参数\
  \ `x` 的值被传递给形式参数 `n1`，实形参数 `y` 的值被传递给形式参数 `n2`。在第二次调用中，实形参数（表达式的结果）`x + 2` 的值被传递给形式参数\
  \ `n1`，实形参数（表达式的结果）`y / 2` 的值被传递给形式参数 `n2`。\n\n### 36.6 方法是如何执行的？\n\n当主代码调用一个方法时，会执行以下步骤：\n\
  \n- 中断主代码语句的执行。\n- 将实形参数列表中存在的变量值或表达式结果传递（赋值）给形式参数列表中的对应参数（变量），并将执行流转移到方法定义所在的位置。\n\
  - 执行方法的语句。\n- 当执行流到达 `return` 语句时，一个值将从方法返回到主代码，执行流从调用方法之前的位置继续。\n\n在接下来的 Java 程序中，方法\
  \ `maximum()` 接受两个参数（数值）并返回这两个值中的较大者。\n\n![](img/my_exercise_header.png) Project_36.6\n\
  \n```java\nstatic double maximum(double val1, double val2) {\n    double m;\n  \
  \  m = val1;\n    if (val2 > m) {\n        m = val2;\n    }\n    return m;\n}\n\n\
  // Main code starts here\npublic static void main(String[] args) throws Exception\
  \ {\n    double a, b, result;\n    a = Double.parseDouble(cin.nextLine());\n   \
  \ b = Double.parseDouble(cin.nextLine());\n    result = maximum(a, b);\n    System.out.println(result);\n\
  }\n```\n\n当 Java 程序开始时，执行的语句是 `a = Double.parseDouble(cin.nextLine())`。下面是一个追踪表，显示了执行流、`a`\
  \ 和 `b` 如何传递给方法，以及方法如何返回结果。假设用户输入 `3` 和 `8`。\n\n| Step | Statement | Main Code |\
  \ Method maximum() |\n| --- | --- | --- | --- |\n| | a | b | result | val1 | val2\
  \ | m |\n| 1 | `a = Double.parseD…` | 3.0 | ? | ? | | |\n| 2 | `b = Double.parseD…`\
  \ | 3.0 | 8.0 | ? | ? | | |\n| 3 | `result = maximum(a, b)` | 3.0 | | 3.0 | 8.0\
  \ |\n| 4 | `m = val1` | | | 3.0 |\n| 5 | `if (val2 > m)` | | | 3.0 |\n| 6 | `m =\
  \ val2` | | | 8.0 |\n| 7 | `return m` | | | 8.0 |\n| 8 | `System.out.println(result)`\
