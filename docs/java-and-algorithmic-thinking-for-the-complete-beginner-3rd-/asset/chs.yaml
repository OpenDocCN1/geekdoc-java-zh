  \n### 28.3 将流程图转换为 Java 程序\n\n这种转换并不总是容易的。流程图并没有遵循特定的规则，因此在转换为 Java 程序之前可能需要进行修改。以下是此类案例。\n\
  \n![Image](img/chapter27-02.png)\n\n流程图中的循环控制结构并没有你已经学过的结构，例如前测试、后测试、中测试甚至是 for\
  \ 循环结构。你需要通过添加额外的语句或删除现有的语句来修改流程图。以下是一些练习，在某些练习中，初始流程图确实需要修改。\n\n#### 练习 28.3-1\
  \ 编写 Java 程序\n\n编写与以下代码片段对应的 Java 代码。\n\n![Image](img/chapter28-06.png)\n\n#####\
  \ 答案\n\n这是一个简单的。你唯一需要克服的障碍是真值路径不在正确的位置。你需要真值路径来进行迭代。正如你所知，可以交换这两个路径，但你还需要否定布尔表达式。因此，对应的代码片段变为：\n\
  \n```java\ni = 0;\nwhile (i <= 90) {System.out.println(i);i = i + 2;}System.out.println(\"\
  The End\");\n```\n\n使用 for 循环，此代码片段可以等价地写为：\n\n```java\nfor (i = 0; i <= 90; i +=\
  \ 2) {System.out.println(i);}System.out.println(\"The End\");\n```\n\n#### 练习 28.3-2\
  \ 编写 Java 程序\n\n编写与以下流程图对应的 Java 程序。\n\n![Image](img/chapter28-07.png)\n\n#####\
  \ 答案 \n\n此流程图包含一个嵌套了双分支选择结构的后测试循环结构。Java 程序如下：\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {int i;i = 1;do {\n> if (i < 45) {\n> > System.out.println(i);\n\
  > }\n> else {\n> > System.out.println(-i);\n> }\n> i++;\n} while (i < 90);System.out.println(\"\
  The End\");}\n```\n\n#### 练习 28.3-3 编写 Java 程序\n\n编写与以下流程图对应的 Java 程序。\n\n![Image](img/chapter28-08.png)\n\
  \n##### 答案\n\n哎呀！一团糟！这里有很多菱形！但要注意，并不是所有的菱形都是选择控制结构。事实上，其中有两个是循环控制结构，而只有一个代表选择控制结构！你能认出后者吗？\n\
  \n\n\n到目前为止，你应该对循环控制结构非常熟悉了。如你所知，在循环控制结构中，菱形（菱形框）的出口之一总是朝向上的。因此，从初始流程图中提取出的以下流程图片段显然是你正在寻找的决策控制结构。\n\
