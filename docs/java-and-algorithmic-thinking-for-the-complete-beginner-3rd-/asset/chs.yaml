  \ 注意，你不能使用变量 `temp` 来交换 `names` 数组的内容；这是因为 `temp` 被声明为 `double`，而 `names` 包含字符串。因此，你需要一个声明为\
  \ `String` 的第二个变量 (`tempStr`)\n\n### 练习 34.4-4 姓名排序\n\n编写一个 Java 程序，提示用户输入 100 个人的姓和名。程序必须按姓的字母顺序显示姓名。在两个或多人具有相同姓的情况下，他们的名也应该按字母顺序显示。\n\
  \n#### Solution\n\n你已经知道如何在保持与第二个数组元素一一对应的情况下对数组排序。现在，你必须处理第一个数组中两个姓相同的情况。根据练习描述，第二个数组中的名也必须进行排序。例如，下数组\
  \ `lastNm` 包含 100 个人的姓。它是按字母排序的，并且包含了三次“Parker”。\n\n![Image](img/chapter34-16.png)\n\
  \n为了方便起见，这里再次提供了冒泡排序的基本版本。请注意，此算法保持了 `lastNm` 和 `firstNm` 数组元素之间的一一对应关系。\n\n```java\n\
  for (m = 1; m <= PEOPLE - 1; m++) {\n    for (n = PEOPLE - 1; n >= m; n--) {\n \
  \       if (lastNm[n].compareTo(lastNm[n - 1]) < 0) {\n            tempStr = lastNm[n];\n\
  \            lastNm[n] = lastNm[n - 1];\n            lastNm[n - 1] = tempStr;\n\
  \            tempStr = firstNm[n];\n            firstNm[n] = firstNm[n - 1];\n \
  \           firstNm[n - 1] = tempStr;\n        }\n    }\n}\n```\n\n\n\n然而，为了解决此练习，必须对该冒泡排序算法进行相应的调整。根据这个基础冒泡排序算法，当位置\
  \ `n` 处的姓氏比位置 `n − 1` 处的姓氏“小”时，算法会交换对应的内容。但是，如果这些位置上的姓氏相同，算法则必须验证对应的名字是否按正确顺序排列。如果不是，则需要在数组\
  \ `firstNm` 中进行交换。调整后的冒泡排序算法如代码片段所示。\n\n```java\nfor (m = 1; m <= PEOPLE - 1; m++)\
  \ {\n    for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n].compareTo(lastNm[n\
  \ - 1]) < 0) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n\
  \ - 1];\n            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n\
  \            firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n\
