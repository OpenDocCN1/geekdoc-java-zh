  \ 20 个字符的。\n\n提示：尝试使用三个嵌套的 for 循环来显示这些单词。\n\n## 第 33 章：数据结构的技巧与窍门\n\n### 33.1 引言\n\
  \n由于数组的处理使用了与你在前面章节中学到的相同的顺序、判断和循环控制结构，因此这里没有必要重复所有这些信息。然而，你将在本章中发现，如何逐个处理二维数组的每一行或每一列，如何解决需要使用多个数组的问题，如何从一维数组创建二维数组（反之亦然），以及\
  \ Java 支持的一些实用的数组方法。\n\n### 33.2 逐个处理每一行\n\n逐个处理每一行意味着每一行都被单独处理，并且每行的结果（可以是总和、平均值等）可以被单独用于后续处理。\n\
  \n假设你有如下所示 4 × 5 数组。\n\n![Image](img/chapter33-01.png)\n\n让我们尝试逐个找到每行的总和。以下两种方法都会遍历行。\n\
  \n#### 第一种方法——创建一个辅助数组\n\n在这种方法中，程序逐个处理每一行，并创建一个辅助数组，其中每个元素存储一行的总和。这种方法赋予了你极大的灵活性，因为你可以在程序的后续部分使用这个新数组进行进一步处理。辅助数组\
  \ `total` 如下所示。\n\n![Image](img/chapter33-02.png)\n\n现在，让我们编写相应的代码片段。为了更容易理解该过程，使用了“从内层到外层”的方法。以下代码片段计算第一行（索引为\
  \ 0）的和，并将结果存储在辅助数组 `total` 位置为 0 的元素中。假设变量 `i` 的值为 0。\n\n```\ns = 0;for (j = 0;\
  \ j <= COLUMNS - 1; j++) {s += b[i][j];}total[i] = s;\n```\n\n该代码片段可以等价地写为：\n\n\
  ```\ntotal[i] = 0;for (j = 0; j <= COLUMNS - 1; j++) {total[i] += b[i][j];}\n```\n\
  \n现在，将此代码片段嵌套在一个遍历所有行的 for 循环中，结果如下。\n\n```\nfor (i = 0; i <= ROWS - 1; i++) {total[i]\
  \ = 0;for (j = 0; j <= COLUMNS - 1; j++) {\n\n> total[i] += b[i][j];\n\n}}\n```\n\
  \n#### 第二种方法——直接找到它并处理它。\n\n这种方法不使用辅助数组；它只计算并直接处理总和。代码片段如下。\n\n```\nfor (i = 0;\
  \ i <= ROWS - 1; i++) {total = 0;for (j = 0; j <= COLUMNS - 1; j++) {\n\n> total\
  \ += b[i][j];\n\n}process total;}\n```\n\n`process total` 是什么意思？这取决于给定的问题。它可能只是显示总和，也可能计算并显示每一行的平均值，也可能使用总和来计算更复杂的数学表达式。\n\
  \n例如，下面的示例计算并显示了数组 `b` 每一行的平均值。\n\n```\nfor (i = 0; i <= ROWS - 1; i++) {total =\
  \ 0;for (j = 0; j <= COLUMNS - 1; j++) {\n\n> total += b[i][j];\n\n}average = total\
  \ / COLUMNS;System.out.println(average);}\n```\n\n#### 练习 33.2-1 寻找平均值\n\n有 20 名学生，每一个人都收到了\
  \ 10 节课的成绩。编写一个 Java 程序，提示用户输入每个学生所有课程的成绩，然后为每个学生计算并显示所有大于 89 的平均值。\n\n##### 解决方案\n\
  \n由于你已经学习了逐个处理每一行的两种方法，让我们把它们都用上。\n\n###### 第一种方法——创建一个辅助数组\n\n在这种方法中，程序逐个处理每一行，并创建一个辅助数组，其中每个元素存储一行的平均值。两个所需的数组所示。\n\
  \n![Image](img/chapter33-03.png)\n\n在创建数组 `average` 之后，程序可以找到并显示所有大于 89 的平均值。Java\
  \ 程序如下。\n\n![](img/my_exercise_header.png) 项目 33.2-1\n```\nstatic final int STUDENTS\
  \ = 20;\nstatic final int LESSONS = 10;\npublic static void main(String[] args)\
  \ throws Exception {\n    int i, j;\n    int[][] grades = new int[STUDENTS][LESSONS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n\n        > System.out.println(\"For\
  \ student No. \" + (i + 1) + \"...\");\n        > for (j = 0; j <= LESSONS - 1;\
  \ j++) {\n            > > System.out.print(\"enter grade for lesson No. \" + (j\
  \ + 1) + \": \");\n            > > grades[i][j] = Integer.parseInt(cin.nextLine());\n\
  \        }\n    }\n    //创建数组. 遍历行\n    double[] average = new double[STUDENTS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n        average[i] = 0;\n        for\
  \ (j = 0; j <= LESSONS - 1; j++) {\n            > average[i] += grades[i][j];\n\
  \        }\n        average[i] /= LESSONS;\n    }\n    //显示大于 89 的值\n    for (i\
  \ = 0; i <= STUDENTS - 1; i++) {\n        if (average[i] > 89) {\n            >\
  \ System.out.println(average[i]);\n        }\n    }\n}\n```\n\n###### 第二种方法——直接找到它并处理它\n\
  \n这种方法不使用辅助数组；它只计算并直接显示大于 89 的值。Java 程序如下。\n\n```\nstatic final int STUDENTS = 20;\n\
  static final int LESSONS = 10;\npublic static void main(String[] args) throws Exception\
  \ {\n    int i, j;\n    double average;\n    int[][] grades = new int[STUDENTS][LESSONS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n        System.out.println(\"For student\
  \ No. \" + (i + 1) + \"...\");\n        for (j = 0; j <= LESSONS - 1; j++) {\n \
  \           System.out.print(\"enter grade for lesson No. \" + (j + 1) + \": \"\
  );\n            grades[i][j] = Integer.parseInt(cin.nextLine());\n        }\n  \
  \      average = 0;\n        for (j = 0; j <= LESSONS - 1; j++) {\n            average\
  \ += grades[i][j];\n        }\n        average /= LESSONS;\n        if (average\
  \ > 89) {\n            System.out.println(average);\n        }\n    }\n}\n```\n\n\
  \n\n因此，下面的代码段计算并显示了每一列的平均值。\n\n```java\nfor (j = 0; j <= COLUMNS - 1; j++) {\n \
  \   total = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total += b[i][j];\n\
  \    }\n    System.out.println(total / ROWS);\n}\n```\n\n### 练习 33.3-1 寻找平均值\n\n\
  有 10 名学生，每位学生都收到了五门课程的成绩。编写一个 Java 程序，提示用户输入每位学生所有课程的成绩，然后计算并显示每门课程所有大于 89 的平均值。\n\
  \n#### 解决方案\n\n由于你已经学习了两种逐个处理每一列的方法，让我们把两种方法都用上吧。\n\n#### 第一种方法 – 创建辅助数组\n\n在这种方法中，程序逐个处理每一列，并创建一个辅助数组，数组中的每个元素存储一列的平均值。所需的两个数组如所示。\n\
  \n![Image](img/chapter33-06.png)\n\n在创建了平均值数组后，程序可以找到并显示所有大于 89 的平均值。Java 程序如下。\n\
  \n![](img/my_exercise_header.png) Project_33.3-1\n```java\nstatic final int STUDENTS\
  \ = 10;\nstatic final int LESSONS = 5;\npublic static void main(String[] args) throws\
