  \    }\n    weight = total / 30000;\n    System.out.println(total + \"  \" + weight);\n\
  }\n```\n\n如果你好奇这些数字有多大，这里是答案：棋盘上会有 18,446,744,073,709,551,615 粒米；也就是说，有 614,891,469,123,651.8\
  \ 磅！\n\n## 练习 30.6-3 是一项调查\n\n一家民意调查公司询问了 1000 名公民他们早上是否吃早餐。编写一个 Java 程序，提示公民输入性别（M\
