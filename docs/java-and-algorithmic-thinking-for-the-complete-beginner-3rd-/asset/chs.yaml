  \ enclosed in double quotes is a string, even the numbers: \";b = \"3, 54, 731\"\
  ;System.out.println(a + b);System.out.println(\"You can even mix letters, symbols\
  \ and digits like this: \");System.out.println(\"3 + 4 equals 7\");\n```\n\n许多程序都会处理以字符串（文本）形式出现的数据。字符串无处不在——从文字处理器到网络浏览器，再到短信程序。本教程中的许多练习实际上都大量使用了字符串。尽管\
  \ Java 支持许多用于字符串的有用方法，但本章仅涵盖了满足本书目的必要的方法。然而，如果你需要更多信息，可以访问以下地址之一：\n\n- [`tinyurl.com/3575wcb8`](https://tinyurl.com/3575wcb8)\n\
  - [`docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html#method.summary`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.html#method.summary)\n\
  \n![Image](img/chapter14-01.png)\n\n![](img/notice.jpg)Java 字符串方法（子程序）可以在需要处理字符串时使用，例如从字符串中提取某些字符、移除开头可能存在的空格，或将其所有字符转换为大写。\n\
  \n![](img/remember.jpg)方法无非是解决小问题的微型子程序。\n\n### 14.2 字符在字符串中的位置\n\n让我们在下面的示例中使用文本“Hello\
  \ World”。该字符串包含 11 个字符（包括两个单词之间的空格字符）。Java 在对计数时假设第一个字符位于位置 0，第二个位于位置 1，依此类推。这里显示了每个字符的位置。\n\
  \n![Image](img/chapter14-02.png)\n\n![](img/remember.jpg)空格和任何其他字符一样也是字符。仅仅因为没有人能看到它，并不意味着它不存在！\n\
  \n## 14.3 有用的字符串方法（子程序）及更多\n\n### 修剪 (Trimming)\n\n修剪是从字符串的开头或结尾移除空白字符的过程。\n\n在修剪过程中被移除的一些空白字符包括：\n\
  \n- 普通空格\n- 制表符 (tab)\n- 换行符 (line feed)\n- 回车\n\n例如，你可以修剪用户误操作在字符串结尾或开头输入的任何空格。\n\
  \n你可以用于修剪字符串的方法是：\n\n`subject.trim()`\n\n该方法返回 `subject` 的一个副本，其中 `subject` 字符串开头和结尾的所有空白字符都已从移除。\n\
  \n#### 示例\n\n![](img/my_exercise_header.png) Project_14.3a\n```java\npublic static\
  \ void main(String[] args) throws Exception {String a, b;a = \" Hello\";b = a.trim();System.out.println(b\
  \ + \" Poseidon!\"); //It displays: Hello Poseidon!System.out.println(a + \" Poseidon!\"\
  ); //It displays:   Hello      Poseidon!}\n```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被改变。如果你确实需要更改它的内容，可以使用语句\
  \ `a = a.trim();`。\n\n### 字符串替换 (String replacement)\n\n`subject.replace(search,\
  \ replace)`\n\n该方法在 `subject` 中搜索并返回其副本，其中所有出现 `search` 字符串的地方都被替换为 `replace` 字符串。\n\
  \n#### 示例\n\n![](img/my_exercise_header.png) Project_14.3b\n```java\npublic static\
  \ void main(String[] args) throws Exception {String a, b;a = \"I am newbie in C++.\
  \ C++ rocks!\";b = a.replace(\"C++\", \"Java\");System.out.println(b);    //It displays:\
  \ I am newbie in Java. Java rocksSystem.out.println(a);    //It displays: I am newbie\
  \ in C++. C++ rocks}\n```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有被改变。如果你确实需要更改它的内容，可以使用语句\
  \ `a = a.replace(\"C++\", \"Java\");`。\n\n#### 统计字符数 (Counting the number of characters)\n\
  \n`subject.length()`\n\n该方法返回 `subject` 的长度，换句话说，就是 `subject` 包含的字符数量。\n\n#### 示例\n\
  \n![](img/my_exercise_header.png) Project_14.3c\n```java\npublic static void main(String[]\
  \ args) throws Exception {String a;int k;a = \"Hello Olympians!\";System.out.println(a.length());\
  \                      //It displays: 16k = a.length();System.out.println(k);  \
  \                                                            //It displays: 16System.out.println(\"\
  I am newbie in Java\".length());  //It displays: 19\n```\n\n### 查找字符串位置 (Finding\
  \ string position)\n\n`subject.indexOf(search)`\n\n该方法返回 `search` 在 `subject` 中首次出现的数字位置，如果未找到\
  \ `search` 则返回 -1。\n\n#### 示例\n\n![](img/my_exercise_header.png) Project_14.3d\n\
  ```java\npublic static void main(String[] args) throws Exception {String a;int i;a\
  \ = \"I am newbie in C++. C++ rocks!\";i = a.indexOf(\"newbie\");System.out.println(i);\
  \    //It displays: 5System.out.println(a.indexOf(\"Java\")); //It displays: 15System.out.println(a.indexOf(\"\
  C++\")); //It displays: -1\n```\n\n### 转换为小写 (Converting to lowercase)\n\n`subject.toLowerCase()`\n\
  \n该方法返回 `subject` 的副本，其中字符串中的所有字母都转换为小写。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_14.3e\n```java\npublic static void main(String[] args) throws Exception\
  \ {String a, b;a = \"My NaMe is JohN\";b = a.toLowerCase();System.out.println(b);\
  \    //It displays: my name is johnSystem.out.println(a);    //It displays: My NaMe\
  \ is JohN}\n```\n\n### 转换为大写 (Converting to uppercase)\n\n`subject.toUpperCase()`\n\
  \n该方法返回 `subject` 的副本，其中字符串中的所有字母都转换为大写。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_14.3f\n```java\npublic static void main(String[] args) throws Exception\
  \ {String a, b;a = \"My NaMe is JohN\";b = a.toUpperCase();System.out.println(b);\
  \    //It displays: MY NAME IS JOHNSystem.out.println(a);    //It displays: My NaMe\
  \ is JohN}\n```\n\n### 从字符串中检索单个字符 (Retrieving an individual character from a string)\n\
  \n`subject.charAt(index)`\n\n该方法返回位于 `subject` 指定 `index` 处的字符。\n\n#### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_14.3g\n```java\npublic static void main(String[] args) throws Exception\
  \ {String a;a = \"Hello World\";System.out.println(a.charAt(0));    //It displays\
  \ the first letter: HSystem.out.println(a.charAt(6));    //It displays: WSystem.out.println(a.charAt(10));\
  \    //It displays: d}\n```\n\n### 获取字符串部分 (Getting part of a string)\n\n`subject.substring(beginIndex\
  \ [, endIndex])`\n\n该方法返回 `subject` 的部分。具体而言，它返回从位置 `beginIndex` 开始到但不包含 `endIndex`\
  \ 位置的子字符串。`endIndex` 参数是可选的。如果省略，则返回从位置 `beginIndex` 开始到 `subject` 结束的子字符串。\n\n\n\
  \n\n\n![](img/my_exercise_header.png) Project_14.3\n```java\npublic static void\
  \ main(String[] args) throws Exception {\n    String a;\n    a = \"Hello Athena\"\
  ;\n    System.out.println(a.substring(6, 9));  //显示为: Ath\n    System.out.println(a.substring(7));\
  \     //显示为: thena\n}\n```\n\n## 比较字符串\n\n`subject.compareTo(string)`\n\n当 `subject`\
  \ 在字典序上等于 `string` 时，该方法返回值 `0`；如果 `subject` 在字典序上小于 `string`，则返回一个小于于 `0` 的值；如果\
  \ `subject` 在字典序上大于 `string`，则返回一个大于 `0` 的值。\n\n“字典序”（lexicographically）一词意味着字母“A”被认为“小于”字母“B”，“字母“B”被认为“小于”字母“C”，依此类推。当然，如果两个字符串的首字母相同，Java\
  \ 将继续比较它们的第二个字母，可能还会比较第三个字母（如果有必要）。例如，单词“backspace”被认为“小于”单词“backwards”，因为第五个字母“s”“小于”第五个字母“w”。\n\
  \n检查两个字符串是否相另一种方便方法是：\n\n`subject.equals(string)`\n\n该方法检查 `subject` 在字典序上是否等于 `string`，并相应返回\
  \ `true` 或 `false`。\n\n### 示例\n\n![](img/my_exercise_header.png) Project_14.3i\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    String a\
  \ = \"backspace\";\n    String b = \"backwards\";\n    String c = \"Backspace\"\
  ;\n    String d = \"winter\";\n    String e = \"winter\";\n    System.out.println(a.compareTo(b));\
  \    //显示: -4\n    System.out.println(a.compareTo(c));    //显示: 32\n    System.out.println(a.compareTo(d));\
  \    //显示: -21\n    System.out.println(d.compareTo(e));    //显示: 0\n    System.out.println(a.equals(d));\
  \       //显示: false\n    System.out.println(a.equals(c));       //显示: false\n  \
  \  System.out.println(d.equals(e));       //显示: true\n}\n```\n\n![](img/notice.jpg)注意字母“b”和“B”被认为是两个不同的字母。\n\
  \n![](img/notice.jpg)在英语字典中组织单词的语境下考虑“字典序”一词。\n\n## 将数字或字符转换为字符串\n\n`String.valueOf(subject)`\n\
  \n该方法返回 `subject` 的字符串版本，换句话说，它将数字（实点数或整数）或字符转换为字符串。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_14.3j\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    String a;\n    char b;\n    int c, d;\n    b = 'W';\n    a = String.valueOf(b);\
  \   //将字母 W 赋值给字符串变量 a\n    System.out.println(a);   //显示: W\n    c = 12;\n    d\
  \ = 34;\n    System.out.println(c + d); //显示: 46\n    System.out.println(String.valueOf(c)\
  \ + String.valueOf(d)); //显示: 1234\n}\n```\n\n在 Java 中，如果只是以一个字符串开始序列（即使是空字符串），也可以实现相同的结果，如下面的示例所示。\n\
  \n![](img/my_exercise_header.png) Project_14.3k\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String a;\n    char b;\n    int c, d;\n    b = 'W';\n\
  \    a = \"\" + b;   //将字母 W 赋值给字符串变量 a\n    System.out.println(a);   //显示: W\n\
  \    c = 12;\n    d = 34;\n    System.out.println(c + d); //显示: 46\n    System.out.println(\"\
  \" + c + d); //显示: 1234\n    System.out.println(\"Result - \" + c + d); //显示: Result\
  \ - 1234\n}\n```\n\n#### 练习 14.3-1 反向显示字符串\n\n编写一个 Java 程序，提示用户输入任何包含四个字母的字符串，然后反向显示其内容。例如，如果输入的字符串是“Zeus”，程序必须显示“sueZ”。\n\
  \n##### 解决方案\n\n假设用户的输入赋值给变量 `s`。你可以使用 `s.charAt(3)` 获取第四个字符，使用 `s.charAt(2)` 获取第三个字符，依此类推。\n\
  \nJava 程序所示此处。使用拼接运算符（`+`）来重新组合最终的反转后的字符串。\n\n![](img/my_exercise_header.png) Project_14.3-1\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    String s,\
  \ sReversed;\n    System.out.print(\"Enter a word with four letters: \");\n    s\
  \ = cin.nextLine();\n    sReversed = \"\" + s.charAt(3) + s.charAt(2) + s.charAt(1)\
  \ + s.charAt(0);\n    System.out.println(sReversed);\n}\n```\n\n![](img/notice.jpg)在\
  \ Java 中，有时需要以字符串开始序列（即使是空字符串）来强制编译器执行拼接，而不是加法。\n\n#### 练习 14.3-2 交换姓名顺序\n\n编写一个\
  \ Java 程序，提示用户输入全名，然后交换姓和名的顺序。\n\n##### 解决方案\n\n这个练习与你学过的不一样。让我们通过示例尝试理解它。\n\n![](img/my_exercise_header.png)\
  \ Project_14.3-2\n\n在视觉上区分名和姓的字符是空格。这里的问题是这个字符并不总是位于位置 3。有人有一个短名（如“Tom”），其他人有一个较长的名字（如“Robert”）。因此，你需要能够找到空格位置的方法。\n\
  \n`indexOf()` 方法就是你要找的！如果你用它查找字符串“Tom Smith”中空格的位置，它返回值 `3`。如果你用它查找另一个字符串“Angelina\
  \ Brown”中空格的位置，它返回值 `8`。\n\n![](img/notice.jpg)值 3 不仅仅是空格字符所在的位置。它也代表单词“Tom”包含的字符数！对于字符串“Angelina\
  \ Brown”，返回的值 8 也是如此。\n\n该算法的 Java 程序所示此处。\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String fullName, name1, name2;\n    int spacePos;\n\
  \    System.out.print(\"Enter your full name: \");\n    fullName = cin.nextLine();\n\
  \    //找到空格的位置。这也是名包含的字符数\n    spacePos = fullName.indexOf(\" \");\n    //从位置 0\
  \ 开始获取 spacePos 个字符\n    name1 = fullName.substring(0, spacePos);\n    //从位置 spacePos\
  \ + 1 开始获取剩余字符\n    name2 = fullName.substring(spacePos + 1);\n    fullName = name2\
  \ + \" \" + name1;\n    System.out.println(fullName);\n}\n```\n\n![](img/remember.jpg)方法\
  \ `subject.substring(beginIndex, endIndex)` 返回 `subject` 的部分。具体而言，它返回从 `beginIndex`\
  \ 位置开始但不包含 `endIndex` 位置的子字符串。\n\n![](img/notice.jpg)注意该程序无法适用于西班牙名字“Maria Teresa\
  \ García Ramírez de Arroyo”。原因显而易见\n\n#### 练习 14.3-3 创建登录 ID\n\n编写一个 Java 程序，提示用户输入姓氏，然后用姓氏的前四个字母（小写）和一个三位随机整数创建一个登录\
  \ ID。\n\n##### 解决方案\n\n要创建随机整数，可以使用 `Math.random()` 方法。由于你需要一个三位的随机整数，范围必须在 100\
  \ 到 999 之间。\n\n\n\n\n\n![](img/my_exercise_header.png) Project_14.3-3\n\n```java\n\
  public static void main(String[] args) throws Exception {\n    int randomInt;\n\
  \    String lastName, loginID;\n    System.out.print(\"Enter last name: \");\n \
  \   lastName = cin.nextLine();\n    //Get random integer between 100 and 999\n \
  \   randomInt = 100 + (int)(Math.random() * 900);\n    loginID = lastName.substring(0,\
  \ 4).toLowerCase() + randomInt;\n    System.out.println(loginID);\n}\n```\n\n![](img/notice.jpg)注意\
  \ `substring(0, 4)` 方法返回从位置 0 开始到但不包含位置 4 的子字符串。\n\n![](img/notice.jpg)注意 `substring()`\
  \ 方法是如何链式调用 `toLowerCase()` 方法的。第一个方法的的结果被用作第二个方法的的操作对象。这是大多数程序员倾向于遵循的编写风格，因为可以帮助节省大量的代码行。当然，你可以根据意愿链任意任意数量的方法，但如果你链式调用太多方法，没有人能读懂你的代码。\n\
  \n#### 练习 14.3-4 创建随机单词\n\n编写一个 Java 程序，显示一个由三个字母组成的随机单词。\n\n##### 答案\n\n要创建一个随机单词，你需要一个包含英语字母表中所有\
  \ 26 个字母的字符串。然后你可以使用 `Math.random()` 方法在位置 0 到 25 之间选择一个随机字母。\n\n该算法的 Java 程序所示。\n\
  \n![](img/my_exercise_header.png) Project_14.3-4a\n\n```java\npublic static void\
  \ main(String[] args) throws Exception {\n    String alphabet, randomWord;\n   \
  \ alphabet = \"abcdefghijklmnopqrstuvwxyz\";\n    randomWord = \"\" + alphabet.charAt((int)(Math.random()\
  \ * 26)) +\n                 alphabet.charAt((int)(Math.random() * 26)) +\n    \
  \             alphabet.charAt((int)(Math.random() * 26));\n    System.out.println(randomWord);\n\
  }\n```\n\n![](img/remember.jpg)你可以将一个子程序嵌套另一个程序内部。注意 `random()` 方法是如何嵌套在 `charAt()`\
  \ 方法中的。内部（嵌套）方法的的结果被用作外部方法的参数。\n\n![](img/notice.jpg)注意 `Math.random()` 方法被调用了三次，每次它都可能返回不同的随机数。\n\
  \n![](img/remember.jpg)在 Java 中，有时通过以字符串（即使是空字符串）开始序列，来强制编译器进行拼接而不是普通的相加。\n\n你也可以使用\
  \ `length()` 方法来获取字符串 `alphabet` 的长度，如下所示。\n\n![](img/my_exercise_header.png) Project_14.3-4b\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    String\
  \ alphabet, randomWord;\n    alphabet = \"abcdefghijklmnopqrstuvwxyz\";\n    randomWord\
  \ = \"\" + alphabet.charAt((int)(Math.random() * alphabet.length())) +\n       \
  \          alphabet.charAt((int)(Math.random() * alphabet.length())) +\n       \
  \          alphabet.charAt((int)(Math.random() * alphabet.length()));\n    System.out.println(randomWord);\n\
  }\n```\n\n#### 练习 14.3-5 求各位数字之和\n\n编写一个 Java 程序，提示用户输入一个三位整数，然后计算其各位数字之和。在不使用整数取模（`%`）运算符的情况下解决此练习。\n\
  \n##### 答案\n\n现在你可能奇怪为什么这个练习被放在这一章中，这一章主要关注字符串处理。你可能会认为你已经知道如何将一个三位整数拆分成三个数字，并将每个数字赋值给单独的变量，就像你在第\
  \ 13 章中使用除法（`/`）和整数取模（`%`）运算符学习的那样。那么，为什么要在这里讨论这个练习呢？\n\n原因是 Java 是一种非常强大的语言，你可以利用它的魔力以完全不同的方式来解决这个练习。主要思想是将用户提供的整数转换为\
  \ `String` 类型，并将每个数字（每个字符）赋值给单独变量。\n\n![](img/my_exercise_header.png) Project_14.3-5\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int number,\
  \ total;\n    String sNumber, digit1, digit2, digit3;\n    System.out.print(\"Enter\
  \ an three-digit integer: \");\n    number = Integer.parseInt(cin.nextLine());\n\
  \    sNumber = \"\" + number;  //将数字转换为字符串\n    digit1 = \"\" + sNumber.charAt(0);\
  \  //将位置 0 的字符转换为字符串\n    digit2 = \"\" + sNumber.charAt(1);  //将位置 1 的字符转换为字符串\n\
  \    digit3 = \"\" + sNumber.charAt(2);  //将位置 2 的字符转换为字符串\n    total = Integer.parseInt(digit1)\
  \ + Integer.parseInt(digit2) + Integer.parseInt(digit3);\n    System.out.println(total);\n\
  }\n```\n\n![](img/notice.jpg)由于变量 `digit1`、`digit2` 和 `digit3` 的类型为 `String`，你需要在变量\
  \ `total` 中找到它们的和之前，使用 `parseInt()` 方法将它们转换为整数。\n\n### 14.4 复习题：对错\n\n对以下每个语句选择对或错。\n\
  \n1) 字符串是你可以使用键盘输入的任何内容。\n2) 字符串必须包含在括号内。\n3) 短语“Hi there!”包含 8 个字符。\n4) 在短语“Hi\
  \ there!”中，字母“t”位于位置 3。\n5) 语句 `y = a.charAt(1)` 将变量 `a` 中包含的字符串的第二个字符赋值给 y。\n6)\
  \ 以下代码满足该属性：`a = \"Hello\"; y = a.charAt(5);`\n7) 修剪（Trimming）是从字符串开头或结尾移除空格的过程\n\
  8) 语句 `y = (\"Hello Aphrodite\").trim()` 将值“Hello”赋值给变量 `y`。\n9) 语句 `System.out.println(\"\
  Hi there!\".replace(\"Hi\", \"Hello\"))` 显示消息“Hello there!”.\n10) 语句 `index = (\"\
  Hi there\").indexOf(\"the\")` 将值 4 赋值给变量 `index`。\n11) 语句 `System.out.println(\"\
