  \n### 36.3 不返回值的子程序\n\n在计算机科学中，不返回值的子程序被称为过程、子过程、子程序、void 函数等。在 Java 中，通常使用的术语是\
  \ void 方法。\n\nJava void 方法的通用形式为：\n\n```java\nstatic void name([type1 arg1, type2\
  \ arg2, type3 arg3, …]) {\n    局部变量声明部分\n    一条语句或语句块\n}\n```\n\n其中：\n\n- `name`\
  \ 是方法的名称。\n- `arg1`, `arg2`, `arg3`, …` 是参数（变量、数组等）的列表，用于将值从调用者传递到方法。参数的数量可以根据需要而定。\n\
  - `type1`, `type2`, `type3`, …` 是每个参数的数据类型。每个参数都必须有一个数据类型。\n\n![](img/notice.jpg)注意参数是可选的；也就是说，方法可以不包含参数。\n\
  \n例如，下一个 void 方法通过参数 `num1` 和 `num2` 接收两个数字，然后计算它们的和并最后显示结果。\n\n```java\nstatic\
  \ void displaySum(double num1, double num2) {\n    double result;\n    result =\
  \ num1 + num2;\n    System.out.println(result);\n}\n```\n\n### 36.4 如何调用 void 方法\n\
  \n\n\n\n你可以通过直接编写方法名称来调用 void 方法（空方法）。下一个示例定义了 void 方法 `displayLine()`，主代码在每次需要显示水平线时调用该\
  \ void 方法。\n\n![](img/my_exercise_header.png) Project_36.4a\n\n```java\n// Define\
  \ the void method\nstatic void displayLine() {\n    System.out.println(\"---------------------\"\
  );\n}\n\npublic static void main(String[] args) throws Exception {\n    System.out.println(\"\
  Hello there!\");\n    displayLine();\n    System.out.println(\"How do you do?\"\
  );\n    displayLine();\n    System.out.println(\"What is your name?\");\n    displayLine();\n\
  }\n```\n\n等待，我看到提供的文本包含很多合并的代码和文本。让我根据你的规则对整个提供的代码块进行适当的格式化。\n\n你可以向 void 方法传递（发送）值，只要\
  \ void 方法的括号内至少存在一个参数。在接下来的示例中，void 方法 `displayLine()` 被调用了三次，但每次通过可变长度传递了不同的值，导致打印出三行长度不同的线。\n\
