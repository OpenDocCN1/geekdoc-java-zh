  \n[[RETURN]](#chapter30.html_Link_To_Endnote_21)\n\n### [22] 布鲁克·泰勒（1685-1731）是一位英国数学家，因泰勒级数和对有限差理论的贡献而闻名。\n\
  \n[[RETURN]](#chapter30.html_Link_To_Endnote_22)\n\n### [23] 塞缪尔·芬林利·布里西·摩斯（1791-1872）是一位美国画家和发明家。摩斯对单线电报系统的发明做出了贡献，他是摩斯密码的共同开发者。\n\
  \n[[RETURN]](#chapter31.html_Link_To_Endnote_23)\n\n### [24] 在希腊神话中，泰坦神和泰坦女神是乌拉诺斯和盖亚的孩子。他们是统治传奇黄金时代（奥林匹斯神之前的时代）的巨人神。男泰坦包括科俄斯、俄刻俄斯、克里俄斯、克洛诺斯、亥珀吕和伊珀图，而女泰坦女神包括泰提斯、墨涅莫绪涅、忒弥斯、忒亚、瑞亚和菲比。在一场被称为泰坦战争的战斗中，为了决定由哪代神来统治宇宙，奥林匹斯神战胜了泰坦神！\n\
