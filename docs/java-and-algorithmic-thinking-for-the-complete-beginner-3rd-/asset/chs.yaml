  \            }\n        }\n        System.out.println(minimum + \"  \" + maximum);\n\
  \    }\n}\n```\n\n\n\n\n\n排序算法是计算机科学中的一个重要课题。排序算法是一种将数组元素按特定顺序排列的算法。有很多排序算法，每种算法都有特定的优缺点。\n\
  \n大多数排序算法通过比较数组中的元素来工作。它们通常根据效率和内存需求来评估。\n\n排序算法有很多，其中：\n\n- 冒泡排序算法\n- 改进的冒泡排序算法\n\
  - 选择排序算法\n- 插入排序算法\n- 堆排序算法\n- 合并排序\n- 快速排序算法\n\n就效率而言，冒泡排序被认为是效率最低的，而列表中随后的每个算法都比前一个性能更好。快速排序被认为是最好、最快的排序算法之一，特别是对于大规模数据操作。\n\
  \n排序算法不仅可以用于按升序或降序显示数据，还可以帮助从一组给定的值中找到最小值和最大值。例如，在一个升序排列的数组中，最小值位于第一个索引，最大值位于最后一个索引。虽然仅仅为了寻找极值值而对数组进行排序是非常低效的，但如果程序因为其他原因对数组进行了排序，而你随后需要最小值或最大值，你就知道可以在哪里找到它们了！\n\
  \n另一个你可能需要排序算法的场景是，当你想要找到并显示数组中的三个最大（或最小）数字时，例如。在这种情况下，你可以将数组降序排序，然后只显示位于索引位置 0、1\
  \ 和 2 的前三个元素。\n\n如你所知，Java 包含了用于数组排序的 `Arrays.sort()` 方法。然而，在某些情况下，有必要实现自定义排序算法，特别是当你需要在排序数组的同时保持其与第二个数组元素的一一对应关系时。\n\
  \n### 练习 34.4-1 冒泡排序算法 – 对数值一维数组进行排序\n\n编写一个 Java 程序，让用户向数组输入 20 个数值，然后使用冒泡排序算法将它们按升序排序。\n\
  \n### 答案\n\n冒泡排序算法可能是效率最低的排序算法之一，但它被广泛用于教学。核心思想（当要求升序排序数组时）是重复将数组中最小的元素移动到索引最低的位置。工作原理如下：算法遍历数组元素，比较每对相邻元素，然后交换它们的内容（如果顺序错误）。这个过程将重复多次，直到数组完成排序。\n\
  \n例如，让我们尝试按升序对以下数组进行排序。\n\n![Image](img/chapter34-08.png)\n\n最低值是 5。根据冒泡排序算法，这个值必须逐渐“浮”或“升”到位置\
  \ 0，就像可乐杯中的气泡上升一样。当值 5 被移动到位置 0 后，下一个较值是 8。现在，值 8 必须“浮”到位置 1。接下来是值 12，它必须“浮”到位置\
  \ 2，依此类推。这个过程不断重复，直到所有元素都被放在正确的位置。\n\n但如何使用算法完成这种“冒泡”过程呢？让我们详细查看整个过程。对于之前包含六元素的数组\
  \ `A`，必须执行五轮遍历。\n\n#### 第一轮\n\n#### 第 1 次比较\n初始比较索引 4 和 5 的元素。由于值 12 小于值 49，这两个元素交换内容。\n\
  \n#### 第 2 次比较\n比较索引 3 和 4 的元素。由于值 12 不小于值 5，因此不进行交换。\n\n#### 第 3 次比较\n比较索引 2 和\
  \ 3 的元素。由于值 5 小于值 8，这两个元素交换内容。\n\n#### 第 4 次比较\n比较索引 1 和 2 的元素。由于值 5 小于值 25，这两个元素交换内容。\n\
  \n#### 第 5 次比较\n比较索引 0 和 1 的元素。由于值 5 小于值 17，这两个元素交换内容。\n\n![Image](img/chapter34-09.png)\n\
  \n第一轮已完成，但正如你所看到的，数组尚未排序。唯一能保证被放在正确位置的值是 5。然而，由于后续还有更多轮，值 5 无需参与随后的比较。在接接的一轮中，将减少一次比较——即四次比较。\n\
  \n#### 第二轮\n\n#### 第 1 次比较\n比较索引 4 和 5 的元素。由于值 49 不小于值 12，因此不进行交换。\n\n#### 第 2 次比较\n\
  比较索引 3 和 4 的元素。由于值 12 不小于值 8，因此不进行交换。\n\n#### 第 3 次比较\n比较索引 2 和 3 的元素。由于值 8 小于值\
  \ 25，这两个元素交换内容。\n\n#### 第 4 次比较\n比较索引 1 和 2 的元素。由于值 8 不小于值 17，这两个元素交换内容。\n\n![Image](img/chapter34-10.png)\n\
  \n第二轮已完成，值 8 保证被放在正确的位置。然而，由于后续还有更多轮，值 8（当然还有值 5）无需参与随后的比较。在接接的一轮中，将减少一次比较——即三次比较。\n\
  \n#### 第三轮\n\n在这一轮中，执行了三次比较（但只有两次交换），如下所示。\n\n![Image](img/chapter34-11.png)\n\n\
  第三轮已完成，值 12 保证被放在正确的位置。与之前一样，由于后续还有更多轮，值 12（当然还有值 5 和 8）无需参与随后的比较。在接接的一轮中，将减少一次比较——即两次比较。\n\
  \n#### 第四轮\n\n在这一轮中，执行了两次比较（没有交换），如下所示。\n\n![Image](img/chapter34-12.png)\n\n第四轮已完成，值\
  \ 17 保证被放在正确的位置。与之前一样，由于后面还有最后一轮，值 17（当然还有值 5、8 和 12）无需参与随后的比较。在最后的一轮中，将减少一次比较——即一次比较。\n\
  \n#### 第五轮\n\n在最后的一轮中，只执行了一次比较。由于值 49 不小于值 25，不进行交换。\n\n![Image](img/chapter34-13.png)\n\
  \n第五轮已完成，最后两个值（25 和 49）现在保证处于正确的位置。冒泡排序算法已完成，数组已按升序排序！\n\n现在你需要一个 Java 程序来完成之前的整个过程。让我们使用“从内层到外”的方法。仅执行第一轮的代码片段所示。注意这是内层（嵌套）循环控制结构。假设变量\
  \ `m` 包含值 1。\n\n```java\nfor (n = ELEMENTS - 1; n >= m; n--) {\n    if (a[n] < a[n\
  \ - 1]) {\n        temp = a[n];\n        a[n] = a[n - 1];\n        a[n - 1] = temp;\n\
  \    }\n}\n```\n\n![](img/notice.jpg) 在第一轮中，变量 `m` 必须包含值 1。这确保了在最后迭代中，比较的元素是索引位置\
  \ 1 和 0 的元素。\n\n![](img/remember.jpg) 交换两个元素使用了你已经学过的方法！请回想那杯橙汁和柠檬汁。如果这让你没有印象，你需要刷新记忆并重新阅读\
  \ 练习 8.1-3。\n\n\n\n\n只需重新执行之前的代码片段，即可进行第二次遍历。然而，变量 `m` 需要包含值 `2`。这将确保索引位置为 0 的元素不会被再次比较。同样，对于第三次遍历，由于相同的原因，可以重新执行之前的代码片段，但变量\
  \ `m` 需要包含值 `3`。\n\n因此，之前的代码片段需要执行五次（每次执行一次），并且每次变量 `m` 必须增加 `1`。使用冒泡排序算法排序数组 `a`\
  \ 的最终代码片段如下。\n\n```java\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n    for (n = ELEMENTS\
  \ - 1; n >= m; n--) {\n        if (a[n] < a[n - 1]) {\n            temp = a[n];\n\
  \            a[n] = a[n - 1];\n            a[n - 1] = temp;\n        }\n    }\n\
  }\n```\n\n![](img/remember.jpg) 对于 `N` 个元素，算法需要执行 `N - 1` 趟遍历。例如，如果数组 `a` 包含 20\
  \ 个元素，则 `(m = 1; m <= ELEMENTS - 1; m++)` 语句将执行 19 趟遍历。\n\n完整的 Java 程序如下。\n\n![](img/my_exercise_header.png)\
