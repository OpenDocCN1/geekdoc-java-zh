  \ 第 17 章\n\n双分支决策结构 (The Dual-Alternative Decision Structure)\n\n### 17.1 双分支决策结构\n\
  \n与单分支决策结构不同，这种决策控制结构在两条路径上都包含一个语句或语句块。\n\n![Image](img/chapter17-01.png)\n\n如果\
  \ `Boolean_Expression` 求值为为真（true），则执行语句或语句块 1；否则，执行语句或语句块 2。\n\nJava 中的通用形式为：\n\
  \n```\nif (Boolean_Expression) {语句 1}else {语句 2}\n```\n\n在下一个示例中，当用户输入大于或等于 18 时，显示“You\
  \ are an adult”；否则显示“You are underage”。\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int age;\n    System.out.print(\"Enter your age:\
  \ \");\n    age = Integer.parseInt(cin.nextLine());\n    if (age >= 18) {\n    \
  \    System.out.println(\"You are an adult\");\n    }else {\n        System.out.println(\"\
  You are underage\");\n    }\n}\n```\n\n与单分支结构类似，语句可以不在大括号 `{}` 内，如下所示：\n\n```java\n\
  if (Boolean_Expression)语句 1;else 语句 2;\n```\n\n#### 练习 17.1 寻找输出\n\n对于以下流程图，确定三种执行情况下的输出消息。\n\
  \n![Image](img/chapter17-02.png)\n\n 答案：\n\ni) 用户输入 3 时，`Boolean_Expression` 求值为真。执行右路径并显示“Positive”。\n\
  \nii) 用户输入 −3 时，`Boolean_Expression` 求值为假。执行左路径并显示“Negative”。\n\niii) 你能预测输入 0 时会发生什么吗？在这种情况下，`Boolean_Expression`\
  \ 求值为假，执行左路径并显示“Negative”。\n\n![Image](img/notice.jpg) 这种算法目前的形式对于所有输入。虽然它正确识别了正数和负数，但忽略了\
  \ 0 的情况。在书后的练习 20.1-2，你将学习如何根据用户值大于、小于还是等于零来显示三种消息。\n\n![Image](img/remember.jpg)\
  \ 决策符号有一个入口和两个出口！你无法拥有第三出口。\n\n#### 练习 17.1-2 追踪表与双分支决策结构\n\n创建一个追踪表，以确定以下程序在两种不同执行下的每一步变量值。\n\
