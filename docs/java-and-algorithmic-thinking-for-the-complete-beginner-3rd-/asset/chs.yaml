  \ 0; i <= k - 1; i++) {\n    System.out.print(b[i] + \"\\t\");\n}\n```\n\n### 34.2\
  \ 使用数组进行数据验证\n\n正如你在第 30.3 节中学习过的，有三种方法可以用于验证数据输入。你的方法取决于你是否希望显示错误消息，以及你希望为每种输入错误显示不同的错误消息，还是对任何类型的错误显示一个通用的错误消息。让我们看看如何将这三种方法调整并应用于数组。\n\
  \n#### 第一种方法——不带错误消息的输入输入验证\n\n在第 30.3 节中，你学习了如何在不显示任何错误消息的情况下验证用户输入的单个值。为了方便起见，这里再次给出通用形式的代码片段。\n\
  \n```java\ndo {\n    System.out.print(\"提示消息\");\n    input_data = cin.nextLine();\n\
  } while (input_data test 1 fails || input_data test 2 fails || …);\n```\n\n你还记得它是如何运行的吗？如果用户输入有效值，执行流将直接进入程序的下一个部分。然而，如果他们输入无效值，主要目标是反复提示他们，直到他们最终提供有效值为止。\n\
  \n在向数组输入数据时，你可以使用相同的原理。如果你使用 `for` 循环遍历数组的所有元素，代码片段如下：\n\n```java\nfor (i = 0; i\
  \ <= ELEMENTS - 1; i++) {\n    do {\n        System.out.print(\"提示消息\");\n     \
  \   input_data = cin.nextLine();\n    } while (input_data test 1 fails || input_data\
  \ test 2 fails || …);\n    input_array[i] = input_data;\n}\n```\n\n如你所示，当执行流退出嵌套的后测试循环结构时，变量\
  \ `input_data` 肯定包含一个有效值，该值随后被赋予数组 `input_array` 的一个元素。然而，可以使用更简单的方法实现过程，无需使用额外的变量\
  \ `input_data`，如下：\n\n```java\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    do {\n\
  \        System.out.print(\"提示消息\");\n        input_array[i] = cin.nextLine();\n\
  \    } while (input_array[i] test 1 fails || input_array[i] test 2 fails || … );\n\
  }\n```\n\n#### 第二种方法——带有通用错误消息的数据验证\n\n与之前一样，下一个代码片段取自第 30.3 节并调整为数组操作。它验证数据输入并显示一个通用错误消息（即对任何类型的输入错误显示相同的错误消息）。\n\
  \n```java\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    System.out.print(\"提示消息\"\
  );\n    input_array[i] = cin.nextLine();\n    while (input_array[i] test 1 fails\
  \ || input_array[i] test 2 fails || … ) {\n        System.out.println(\"错误消息\");\n\
  \        System.out.print(\"提示消息\");\n        input_array[i] = cin.nextLine();\n\
  \    }\n}\n```\n\n#### 第三种方法——带有不同错误消息的数据验证\n\n再次，下一个代码片段取自第 30.3 节并调整为数组操作。它验证数据输入并为每种输入错误显示不同的错误消息。\n\
  \n```java\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    do {\n        System.out.print(\"\
  提示消息\");\n        input_array[i] = cin.nextLine();\n        failure = false;\n \
  \       if (input_array[i] test 1 fails) {\n            System.out.println(\"错误消息\
  \ 1\");\n            failure = true;\n        } else if (input_array[i] test 2 fails)\
  \ {\n            System.out.println(\"错误消息 2\");\n            failure = true;\n\
  \        } else if (…\n            …\n        }\n    } while (failure);\n}\n```\n\
  \n#### 练习 34.2-1 倒序显示奇数\n\n编写一个 Java 程序，提示用户向数组输入 20 个正数奇整数，然后按照它们提供的顺序的完全反序显示它们。该程序必须验证数据输入，防止用户输入非正值、浮点数或偶数。请通过三个版本解决此练习题：\n\
  \na) 在不显示任何错误消息的情况下验证数据输入。\nb) 验证数据输入并显示通用错误消息。\nc) 验证数据输入并为每种输入错误显示不同的错误消息。\n\n\
  ##### 解决方案\n\n这里将介绍你在第 34.2 节中学习的三种验证数据输入的方法。让我们先在不进行数据验证的情况下解决这个练习。\n\n```java\n\
  static final int ELEMENTS = 20;\npublic static void main(String[] args) throws Exception\
  \ {\n    int i, x;\n    int[] odds = new int[ELEMENTS];\n    for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n        System.out.print(\"提示消息\");\n        input_data = cin.nextLine();\n\
  \        input_array[i] = input_data;\n    }\n    // 倒序显示\n    for (i = ELEMENTS\
  \ - 1; i >= 0; i--) {\n        System.out.print(odds[i] + \"\\t\");\n    }\n}\n\
  ```\n\n###### 不带错误消息的验证\n\n为了在不显示任何错误消息的情况下验证数据输入，请使用第 30.3 节中的第一种方法。将标记的部分替换为以下代码片段：\n\
  \n```java\ndo {\n    System.out.print(\"提示消息\");\n    input_data = cin.nextLine();\n\
  } while (input_data test 1 fails || input_data test 2 fails || …);\n```\n\n这里变量\
  \ `x` 必须是 `double` 类型。最终程序变为：\n\n```java\nstatic final int ELEMENTS = 20;\npublic\
  \ static void main(String[] args) throws Exception {\n    int i;\n    int[] odds\
