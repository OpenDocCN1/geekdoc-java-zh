  \n# 第七部分：子程序\n\n## 第 35 章：子程序简介\n\n### 35.1 到底什么是子程序？\n\n在计算机科学中，子程序是一个封装成单元的语句块，用于执行特定任务。当需要执行该特定任务时，程序可以多次调用子程序。\n\
  \n在 Java 中，内置方法是此类子程序的一个示例。以著名的 `Math.abs()` 方法为例。它由一个在“abs”名称下封装成单元的语句块组成，并执行一个特定任务——返回一个数字的绝对值。\n\
  \n![](img/notice.jpg)如果你在想 `Math.abs()` 方法内部可能存在什么样的语句，这里有一个可能的语句块。\n\n```java\n\
  if (number < 0) return number * (-1);\nelse return number;\n```\n\n通常来说，子程序分为两类：函数（functions）和过程（procedures）。函数和过程的区别在于函数返回一个结果，而过程不返回。然而，在某些计算机语言中，这种区别可能并不明显。在某些语言中，函数也可以像过程一样运行且不返回结果；而在另一些语言中，过程可以返回一个甚至多个结果。\n\
  \n![](img/notice.jpg)根据所使用的计算机语言，“函数”和“过程”的术语可能不同。例如，在 Visual Basic 中，它们被称为“functions”和“subprocedures（子过程）”，在\
  \ FORTRAN 中是“functions”和“subroutines（子例）”，而在 Java 中，通常首选术语是“methods（方法）”和“void methods（空方法）”。\n\
  \n### 35.2 什么是过程化编程？\n\n假设你被分配了一个解决你所在地区药物滥用问题的项目。一种可能的方法（可能证明非常困难甚至是不可能的）是尝试自己解决这个问题！\n\
  \n然而，更好的方法是将大问题细分为更小的子问题，如预防、治疗和康复，每个子问题都可以进一步细分为更小的子问题，如图 35–1 所示。\n\n![Image](img/chapter35-01.png)\n\
  \n图 35–1 问题可以被细分为更小的问题\n\n作为该项目的负责人，你可以租一栋建筑并在其中建立三个部门：预防部门及其所有子部门；治疗部门及其所有子部门，以及康复部门及其所有子部门。最后，你聘佣各个领域的专家，让他们为你工作！\n\
  \n过程化编程正是这样做。它将一个初始问题细分为子问题，每个子问题再进一步细分为更小的子问题。最后，为每个子问题编写一个小的子程序，由主程序（如同主管）调用它们来完成不同的部分。\n\
  \n过程化编程有几个优势：\n\n- 它允许程序人员在需要时复用相同的代码，而无需重写或复制。\n- 它相对容易实现。\n- 它帮助程序人员更容易跟踪执行流，简化了调试过程。\n\
  \n![](img/notice.jpg)一个非常大的程序如果全部在一起，调试和维护可能会非常困难。由于这个原因，通常将其划分为更小的子程序，每个程序执行一个清晰的过程。\n\
  \n### 35.3 什么是模块化编程？\n\n在模块化编程中，相同功能的子程序被组合成独立的模块，每个模块可以有自己的数据集。因此，一个程序可以由多个部分组成，每个部分（模块）可以包含一个或多个较小的部分（子程序）。\n\
  \n![](img/notice.jpg)`Math` 模块就是一个示例。它包含了相同功能的子程序（与数学相关），如 `abs()`、`sqrt()`、`sin()`、`cos()`、`tan()`\
  \ 等。\n\n如果你在之前的药物问题示例中使用模块化编程，你可以拥有三栋独立的建筑——一栋用于预防部门及其所有子部门，第二栋用于治疗部门及其所有子部门，第三栋用于康复部门及其所有子部门（如图\
  \ 35–2 所示）。这三栋建筑可以被视为模块化编程中的三个不同模块，每个模块都包含相同功能的子程序。\n\n![Image](img/chapter35-02.png)\n\
  \n图 35–2 相同功能的子程序可以被组合成独立的模块。\n\n### 35.4 复习题：判断对错\n\n判断以下陈述的对或错。\n\n\n\n\n\n1.\
  \ 子程序（subprogram）是一个被封装成单元的用于执行特定任务的语句块。\n2. 通常情况下，子程序有两种类型：函数（functions）和过程（procedures）。\n\
  3. 通常来说，函数和过程的区别在于过程会返回一个结果，而函数不返回。\n4. Java 仅支持过程。\n5. 过程化编程将初始问题细分为更小的子问题。\n6.\
  \ 过程化编程的优点是能够重用相同的代码，而不需要重写或复制它。\n7. 过程化编程帮助程序员更容易地遵循执行流。\n8. 模块化编程可以提高程序开发速度。\n\
  9. 在模块化编程中，具有共同功能的子程序被组合到独立的模块中。\n10. 在模块化编程中，每个模块可以有自己的数据集。\n11. 模块化编程使用的结构与结构化编程不同。\n\
  12. 一个程序可以由多个模块组成。\n\n# 第 36 章：用户定义的子程序\n\n### 36.1 返回值的子程序\n\n在许多计算机语言中，返回值的子程序被称为函数。Java\
  \ 将它们称为方法（methods），并且方法分为两类。有内置方法，例如 `Math.abs()`、`Math.sqrt()`，以及用户定义方法，即你可以亲自编写并在自己的程序中使用的方法。\n\
  \n返回值的 Java 方法的通用形式如下所示。\n\n```java\nstatic return_type name([type1 arg1, type2\
  \ arg2, type3 arg3, …]) {\n    局部变量声明部分\n    一条语句或语句块\n    return value;\n}\n```\n\
  \n其中：\n\n- `return_type` 是方法返回的值值的数据类型。\n- `name` 是方法的名称。\n- `arg1`, `arg2`, `arg3`,\
  \ …` 是参数（变量、数组等）的列表，用于将值从调用者传递给方法。参数的数量可以根据需要而定。\n- `type1`, `type2`, `type3`, …`\
  \ 是每个参数的数据类型。每个参数都必须有一个数据类型。\n- `value` 是返回给调用者的值。它可以是一个常量、变量、表达式，甚至是一个数据结构。它的数据类型必须与方法的\
  \ `return_type` 匹配。\n\n![](img/notice.jpg)注意参数是可选的；也就是说，方法可以不包含参数。\n\n![](img/notice.jpg)在第\
  \ 5.4 节 中你学习了变量命名时必须遵循的规则。为子程序命名遵循完全相同的规则！\n\n方法名可以比作一个盒子（见图 36–1），它包含一条语句或一个语句块。它接受参数\
  \ `arg1`, `arg2`, `arg3`, …,` 作为输入值，并返回 `value` 作为输出值。\n\n![Image](img/chapter36-01.png)\n\
  \n图 36–1 方法可以被比作一个盒子\n\n例如，下一个方法通过参数 `num1` 和 `num2` 接收两个数字，然后计算它们的和并返回结果。\n\n```java\n\
  static double getSum(double num1, double num2) {\n    double result;\n    result\
  \ = num1 + num2;\n    return result;\n}\n```\n\n当然，这也可以写成：\n\n```java\nstatic double\
  \ getSum(double num1, double num2) {\n    return num1 + num2;\n}\n```\n\n### 36.2\
  \ 如何调用方法\n\n每次调用方法都是如下：你写下方法名，后面跟上参数列表（如果需要），要么是在一个将方法的返回值赋值给变量的语句中，要么直接在表达式中。\n\
  \n让我们来看一些例子。接下来的方法通过参数 `num` 接收一个数值，并返回该值三三方的结果。\n\n```java\nstatic double cube(double\
