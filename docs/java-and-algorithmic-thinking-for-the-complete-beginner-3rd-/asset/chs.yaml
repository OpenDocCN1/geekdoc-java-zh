  \ 99 种情况的多分支选择结构。尝试寻找一种更高效、更聪明的方法！\n\n## 第 32 章：二维数组\n\n### 32.1 在 Java 中创建二维数组\n\
  \n二维数组是一种可以存储按行和列组织的值的数据结构。它允许你高效地表示和操作表格数据。例如，一个可以存储三个学生四门课程成绩的数组如下。\n\n![Image](img/chapter32-01.png)\n\
  \n二维数组有行和列。在这个特定的示例中，`grades` 有 3 行 4 列。\n\n与某些其他编程语言不同，Java 并不直接支持二维数组。Java 主要只支持一维数组，但你可以使用一种技巧来绕过这一点并创建多维数组：你可以创建一个数组的数组！将\
  \ `grades` 数组想象成包含三个元素的单列数组（每个元素对应一个学生），每个元素都包含一个包含四个元素的全新数组（每个元素对应一门课程），如下。\n\n\
  ![Image](img/chapter32-02.png)\n\n在 Java 中，二维数组是数组的数组，三维数组是数组的数组，以此类推。\n\n#### 第一种方法\n\
  \n要创建一个二维数组并初始化其元素，有许多方法。与一维数组一样，你可以直接使用以下语句来创建 `grades` 数组：\n\n```java\nint[][]\
  \ grades = {\n    {90, 80, 70, 60},\n    {85, 75, 65, 55},\n    {80, 70, 60, 50}\n\
  };\n```\n\n这也可以写成：\n\n```java\nint[][] grades = { {90, 80, 70, 60}, {85, 75, 65,\
  \ 55}, {80, 70, 60, 50} };\n```\n\n索引会自动设置的。第一个值 90 被赋值给行 0、列 0，第二个值 80 被赋值给行 0、列\
  \ 1，以此类推。\n\n#### 第二种方法\n\n你可以使用以下语句在 Java 中创建一个带有空元素的二维数组：\n\n```java\ntype[][]\
  \ array_name = new type[number_rows][number_columns];\n```\n\n其中 `number_rows` 和\
  \ `number_columns` 可以是任何正整数。\n\n然后，你可以使用以下语句为数组元素赋值值：\n\n```java\narray_name[row_index][column_index]\
  \ = value;\n```\n\n其中 `row_index` 和 `column_index` 分别是数组元素的行索引和列索引位置。\n\n以下代码片段创建一个包含\
  \ 3 行 4 列的 12 个空元素的 `grades` 数组，然后为其元素赋值：\n\n```java\nString[][] grades = new String[3][4];\n\
  grades[0][0] = \"B+\";grades[0][1] = \"A+\";grades[0][2] = \"A\";grades[0][3] =\
  \ \"C-\";\ngrades[1][0] = \"B\";grades[1][1] = \"A\";grades[1][2] = \"C\";grades[1][3]\
  \ = \"A+\";\ngrades[2][0] = \"B\";grades[2][1] = \"B\";grades[2][2] = \"B-\";grades[2][3]\
  \ = \"B+\";\n```\n\n### 32.2 如何从二维数组获取值\n\n二维数组由行和列组成。下面的示例展示了一个具有三行 4 列的二维数组。\n\
  \n![Image](img/chapter32-03.png)\n\n二维数组中的每个元素都可以使用一对索引来唯一标识：一个行索引和一个列索引，如下所示。\n\
  \n\n\n\n\n`array_name[row_index][column_index]`\n\n以下代码段创建了一个具有三行四列的二维数组 `grades`，然后显示了其中的一些元素。\n\
  \n```java\nString[][] grades = {{\"B+\", \"A+\", \"A\", \"C-\"},{\"B\", \"A\", \"\
  C\", \"D\"},{\"B\", \"B\", \"B-\", \"B+\"}};\nSystem.out.println(grades[1][2]);\
  \    //它显示: C\nSystem.out.println(grades[2][2]);    //它显示: B-\nSystem.out.println(grades[0][0]);\
  \    //它显示: B+\n```\n\n### 练习 32.2-1 创建追踪表\n\n为下一个代码段创建追踪表。\n\n```java\nint[][]\
  \ a = {{0, 0},{0, 0},{0, 0}};a[1][0] = 9;a[0][1] = 1;a[0][0] = a[0][1] + 6;x = 2;a[x][1]\
  \ = a[0][0] + 4;a[x - 1][1] = a[0][1] * 3;a[x][0] = a[x - 1][1] - 3;\n```\n\n####\
  \ 答案\n\n此代码段使用 3 × 2 数组，即具有 3 行 2 列的数组。追踪表如下。\n\n| 步骤 | 语句 | 注释 | x | a |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 1 | `int[][] a = {{0, 0}, {0, 0}, {0, 0}}` |\
  \ 创建了一个全零值的数组 `a`。 | ? | [0, 0]<br>[0, 0]<br>[0, 0] |\n| 2 | `a[1][0] = 9` | | ?\
  \ | [0, 0]<br>[9, 0]<br>[0, 0] |\n| 3 | `a[0][1] = 1` | | ? | [0, 1]<br>[9, 0]<br>[0,\
  \ 0] |\n| 4 | `a[0][0] = a[0][1] + 6` | | ? | [7, 1]<br>[9, 0]<br>[0, 0] |\n| 5\
  \ | `x = 2` | | 2 | [7, 1]<br>[9, 0]<br>[0, 0] |\n| 6 | `a[x][1] = a[0][0] + 4`\
  \ | | 2 | [7, 1]<br>[9, 0]<br>[0, 11] |\n| 7 | `a[x - 1][1] = a[0][1] * 3` | | 2\
  \ | [7, 1]<br>[9, 3]<br>[0, 11] |\n| 8 | `a[x][0] = a[x - 1][1] - 3` | | 2 | [7,\
  \ 1]<br>[9, 3]<br>[0, 11] |\n\n### 32.3 如何遍历二维数组\n\n由于二维数组由行和列组成，程序可以按行遍历，也可以按列遍历。\n\
  \n#### 按行遍历\n\n按遍历意味着首先处理第 0 行，接着处理第 1 行，然后是第 2 行，依此类推。接下来是一个 3 × 4 数组的示例。箭头显示了执行行遍历时遵循的“路径”，换句话，它们显示了处理元素的顺序。\n\
  \n![Image](img/chapter32-04.png)\n\n![](img/remember.jpg) 3 × 4 数组是一个具有 3 行 4 列的二维数组。在\
  \ `Y × X` 表示法中，第一个数字 (`Y`）始终代表总行数，第二个数字 (`X`）始终代表总列数。\n\n按行遍历时，数组元素的处理方式如下：\n\n\
  - 第 0 行的元素按以下顺序处理：`a[0][0]` -> `a[0][1]` -> `a[0][2]` -> `a[0][3]`\n- 第 1 行的元素按以下顺序处理：`a[1][0]`\
  \ -> `a[1][1]` -> `a[1][2]` -> `a[1][3]`\n- 第 2 行的元素按以下顺序处理：`a[2][0]` -> `a[2][1]`\
  \ -> `a[2][2]` -> `a[2][3]`\n\n##### 第一种方法\n\n使用 Java 语句，尝试通过行遍历处理 3 × 4 数组（3 行\
  \ × 4 列）的所有元素。\n\n```java\ni = 0; // 变量 i 指向第 0 行\nfor (j = 0; j <= 3; j++) { //\
  \ 循环控制结构处理第 0 行的所有元素\n    process[i][j];\n}\ni = 1; // 变量 i 指向第 1 行\nfor (j = 0;\
  \ j <= 3; j++) { // 循环控制结构处理第 1 行的所有元素\n    process[i][j];\n}\ni = 2; // 变量 i 指向第\
  \ 2 行\nfor (j = 0; j <= 3; j++) { // 循环控制结构处理第 2 行的所有元素\n    process[i][j];\n}\n\
  ```\n\n当然，可以使用嵌套循环结构来实现相同的的结果：\n\n```java\nfor (i = 0; i <= 2; i++) {\n    for (j\
  \ = 0; j <= 3; j++) {\n        process[i][j];\n    }\n}\n```\n\n让我们看一些例子。以下代码段允许用户向数组\
  \ `b` 输入 10 个值：\n\n```java\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9;\
  \ j++) {\n        b[i][j] = cin.nextLine();\n    }\n}\n```\n\n以下代码段将数组 `b` 的所有值减\
  \ 1：\n\n```java\nfor (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n  \
  \      b[i][j]--; // 等于 b[i][j] - 1\n    }\n}\n```\n\n以下代码段显示数组 `b` 的所有元素：\n\n```java\n\
  for (i = 0; i <= 9; i++) {\n    for (j = 0; j <= 9; j++) {\n        System.out.print(b[i][j]\
  \ + \"\\t\");\n    }\n    System.out.println();\n}\n```\n![](img/notice.jpg) `System.out.println()`\
  \ 语句用于在行之间换行。\n\n##### 第二种方法\n\n另一种非常简单的方法，但不如第一种灵活。如下所示，某些情况下无法使用。以下是通用形式的代码：\n\
  \n```java\nfor (type[] row : array_name) {\n    for (type element : row) {\n   \
  \     process element;\n    }\n}\n```\n\n其中 `process` 是任何每次迭代处理数组一个元素的 Java 语句或块。以下\
  \ Java 程序每次迭代显示数组 `b` 的一个元素：\n\n```java\nfor (String[] row : b) {\n    for (String\
  \ element : row) {\n        System.out.print(element + \"\\t\");\n    }\n    System.out.println();\n\
  }\n```\n\n但记住，这种方法不能修改数组元素的值。例如，如果你想让数组 `numbers` 中所有元素翻倍，不能这样做：\n\n```java\nint[][]\
  \ numbers = {{5, 10, 3, 2},{2, 4, 1, 6}};\nfor (int[] x : numbers) {\n    for (int\
  \ number : x) {\n        number = number * 2;\n    }\n}\n```\n\n#### 按列遍历\n\n按列意味着首先处理第\
  \ 0 列，接着处理第 1 列，然后是第 2 列，依此类推。接下来是一个 3 × 4 数组的示例。箭头显示了元素的处理顺序。\n\n![Image](img/chapter32-05.png)\n\
  \n按列遍历时，元素的处理方式如下：\n\n- 第 0 列的元素按以下顺序处理：`a[0][0]` -> `a[1][0]` -> `a[2][0]`\n- 第\
  \ 1 列的元素按以下顺序处理：`a[0][1]` -> `a[1][1]` -> `a[2][1]`\n- 第 2 列的元素按以下顺序处理：`a[0][2]`\
  \ -> `a[1][2]` -> `a[2][2]`\n- 第 3 列的元素按以下顺序处理：`a[0][3]` -> `a[1][3]` -> `a[2][3]`\n\
  \n使用 Java 语句，尝试通过列遍历处理 3 × 4 数组（3 行 × 4 列）的所有元素。\n\n```java\nj = 0; // 变量 j 指向第\
  \ 0 列\nfor (i = 0; i <= 2; i++) { // 循环控制结构处理第 0 列的所有元素\n    process[i][j];\n}\n\
  j = 1; // 变量 j 指向第 1 列\nfor (i = 0; i <= 2; i++) { // 循环控制结构处理第 1 列的所有元素\n    process[i][j];\n\
  }\nj = 2; // 变量 j 指向第 2 列\nfor (i = 0; i <= 2; i++) { // 循环控制结构处理第 2 列的所有元素\n  \
  \  process[i][j];\n}\nj = 3; // 变量 j 指向第 3 列\nfor (i = 0; i <= 2; i++) { // 循环控制结构处理第\
  \ 3 列的所有元素\n    process[i][j];\n}\n```\n\n当然，可以使用所示的嵌套循环结构来实现相同的结果：\n\n```java\n\
  for (j = 0; j <= 3; j++) {\n    for (i = 0; i <= 2; i++) {\n        process[i][j];\n\
  \    }\n}\n```\n\n如你所见，这段代码段与按行遍历的代码仅有一点不同：两个 `for` 循环交换了位置。但要小心。永远不要在 `process\
  \ a[i][j]` 语句中交换两个索引变量 `i` 和 `j` 的位置。考虑以下代码段，例如。它尝试对 3 × 4 数组（3 行 4 列）进行列遍历，但它不满足确定性。你能发现为什么吗？\n\
  \n```java\nfor (j = 0; j <= 3; j++) {\n    for (i = 0; i <= 2; i++) {\n        process\
  \ a[j][i];\n    }\n}\n```\n\n\n\n\n当变量 `j` 等于 `3` 时，问题出现了。语句 `a[j][i]` 尝试处理行索引为\
  \ 3（这是第四行）的元素，而显然，它并不存在！仍然困惑吗？别担心！在 `3 × 4` 数组中不存在索引为 3 的行！由于行索引从 `0` 开始，实际上只存在行\
  \ `0`、`1` 和 `2`！\n\n### 32.4 如何向二维数组添加用户输入的值\n\n就像一维数组一样，与其从键盘读取一个值并赋值给变量，不如直接将该值赋值给特定的数组元素。以下代码段创建了二维数组\
  \ `names`，提示用户输入六个值，并将这些值赋值给数组的元素。\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String[][] names = new String[3][2];\n    System.out.print(\"\
  Name for row 0, column 0: \");\n    names[0][0] = cin.nextLine();\n    System.out.print(\"\
  Name for row 0, column 1: \");\n    names[0][1] = cin.nextLine();\n    System.out.print(\"\
  Name for row 1, column 0: \");\n    names[1][0] = cin.nextLine();\n    System.out.print(\"\
  Name for row 1, column 1: \");\n    names[1][1] = cin.nextLine();\n    System.out.print(\"\
  Name for row 2, column 0: \");\n    names[2][0] = cin.nextLine();\n    System.out.print(\"\
  Name for row 2, column 1: \");\n    names[2][1] = cin.nextLine();\n}\n```\n\n使用嵌套\
  \ for 循环，该代码段可以等价地写为：\n\n```java\nstatic final int ROWS = 3;\nstatic final int COLUMNS\
  \ = 2;\npublic static void main(String[] args) throws Exception {\n    int i, j;\n\
  \    String[][] names = new String[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS -\
  \ 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            System.out.print(\"\
  Name for row \" + i + \", column \" + j + \": \");\n            names[i][j] = cin.nextLine();\n\
  \        }\n    }\n}\n```\n\n#### 练习 32.4-1 仅显示实数\n\n编写一个 Java 程序，提示用户在 `5 × 7`\
  \ 数组中输入数值，然后显示包含实数的元素索引。\n\n解决方案\n\n遍历行是最常用的方法，让我们用它吧。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ Project_32.4-1\n```java\nstatic final int ROWS = 5;\nstatic final int COLUMNS\
  \ = 7;\npublic static void main(String[] args) throws Exception {\n    int i, j;\n\
  \    double[][] a = new double[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS - 1; i++)\
  \ {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            System.out.print(\"\
  Enter a value for element \" + i + \", \" + j + \": \");\n            a[i][j] =\
  \ Double.parseDouble(cin.nextLine());\n        }\n    }\n    for (i = 0; i <= ROWS\
  \ - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            if (a[i][j]\
  \ != (int)(a[i][j])) { // 检查是否为实数（浮点）\n                System.out.println(\"A real\
  \ found at position: \" + i + \", \" + j);\n            }\n        }\n    }\n```\n\
  \n#### 练习 32.4-2 仅显示奇数列\n\n编写一个 Java 程序，提示用户在 `5 × 7` 数组中输入数值，然后显示奇数索引（即索引 `1`、`3`\
  \ 和 `5`）。\n\n解决方案\n\n接下来是 Java 程序。\n\n![](img/my_exercise_header.png) Project_32.4-2\n\
  ```java\nstatic final int ROWS = 5;\nstatic final int COLUMNS = 7;\npublic static\
  \ void main(String[] args) throws Exception {\n    int i, j;\n    double[][] a =\
  \ new double[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS - 1; i++) {\n        for\
  \ (j = 0; j <= COLUMNS - 1; j++) {\n            System.out.print(\"Enter a value\
  \ for element \" + i + \", \" + j + \": \");\n            a[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    // 遍历列\n    for (j = 1; j <= COLUMNS - 1; j += 2) { // 从\
  \ 1 开始步增 2\n        for (i = 0; i <= ROWS - 1; i++) {\n            System.out.print(a[i][j]\
  \ + \"  \");\n        }\n    }\n}\n```\n\n![](img/notice.jpg) 本书尽可能使用变量 `i` 作为行索引\
  \ `j` 作为列索引。当然，你可以使用其他变量名，例如 `row` 或 `column`，但 `i` 和 `j` 被大多数程序员广泛使用。在使用一段时间后，你的大脑会将\
  \ `i` 与行联系，将 `j` 与列联系。因此，每个在二维数组中使用这些变量名的算法或程序将更容易理解。\n\n### 32.5 变量 i 和 j 的由来\n\
  \n许多程序员认为名称 `i` 代表“索引”（index），而 `j` 的使用仅仅是因为它在 `i` 之后。可能真相于两者之间。\n\n在计算机出现很久，数学家就已经使用\
  \ `i`、`j` 和 `k` 来表示整数了。后来，在第一种高级编程语言 `FORTRAN` 中，变量 `i`、`j`、`k`、`l`、`m` 和 `n` 默认是整数。因此，第一批程序员养成了在程序中使用\
  \ `i` 和 `j` 的习惯，并成为了约定。\n\n### 32.6 方阵\n\n在数学中，行数和列数相同的矩阵称为方阵。以下是方阵的一些示例。\n\n![Image](img/chapter32-06.png)\n\
  \n![Image](img/chapter32-07.png)\n\n#### 练习 32.6-1 求主对角线元素和\n\n编写一个 Java 程序，让用户在\
  \ `10 × 10` 数组中输入数值，然后计算其主对角线元素的和。\n\n解决方案\n\n在数学中，方阵的主对角线是从左上角到右下角的元素集合。你可以使用两种不同的方法计算主对角线的和。让我们学习两种。\n\
  \n方法一——遍历所有元素\n\n在这种方法中，程序遍历行并检查行索引是否等于列索引。对于表示为 `N × N` 的方阵，行列是相等的，因此解决方案如下。\n\n\
  ![](img/my_exercise_header.png) Project_32.6-1\n```java\nstatic final int N = 10;\n\
  public static void main(String[] args) throws Exception {\n    int i, j;\n    double[][]\
  \ a = new double[N][N];\n    for (i = 0; i <= N - 1; i++) {\n        for (j = 0;\
  \ j <= N - 1; j++) {\n            a[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    // 计算和\n    total = 0;\n    for (i = 0; i <= N - 1; i++)\
  \ {\n        for (j = 0; j <= N - 1; j++) {\n            if (i == j) {\n       \
  \         total += a[i][j]; // 这相当于：total = total + a[i][j]\n            }\n   \
  \     }\n    }\n    System.out.println(\"Sum = \" + total);\n}\n```\n![](img/notice.jpg)\
  \ 注意，程序遍历行并检查行索引是否等于列索引。另一种，可以通过遍历列来实现相同的结果。\n\n![](img/notice.jpg) 在这种方法中，负责计算和的嵌套循环控制结构执行了\
  \ 10 × 10 = 100 次迭代。\n\n方法二——直接遍历主对角线\n\n在这种方法中，单一循环控制结构直接遍历主对角线。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ Project_32.6-1b\n```java\nstatic final int N = 10;\npublic static void main(String[]\
  \ args) throws Exception {\n    int i, j, k;\n    double[][] a = new double[N][N];\n\
  \    for (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n  \
  \          a[i][j] = Double.parseDouble(cin.nextLine());\n        }\n    }\n   \
  \ // 计算和\n    total = 0;\n    for (k = 0; k <= N - 1; k++) {\n        total += a[k][k];\n\
  \    }\n    System.out.println(\"Sum = \" + total);\n}\n```\n![](img/notice.jpg)\
  \ 这种方法比第一种高效得多，因为负责计算和的 for 循环执行的迭代次数仅为 10 次。\n\n#### 练习 32.6-2 求反对对角线元素和\n\n编写一个\
  \ Java 程序，让用户在 `5 × 5` 数组中输入数值，然后计算其反对对角线元素的和。\n\n\n\n\n\n# 解决方案\n\n在数学中，方矩阵的反对对角线（antidiagonal）是指从右上角到左下角的元素的集合。接下来，你可以看到一个\
  \ 5 × 5 方矩阵的示例，其反对对角线被深色背景显示。\n\n.![Image](img/chapter32-10.png)\n\nN × N 数组中反对对角线上任意元素的索引满足以下方程：\n\
  \n`i + j = N - 1`\n\n其中变量 `i` 和 `j` 分别对应行索引和列索引。\n\n如果你解出 `j`，则方程变为：\n\n`j = N -\
  \ i - 1`\n\n使用这个公式，你可以计算出反对对角线上任意元素的索引；也就是说，对于变量 `i` 的任意值，你都可以找到变量 `j` 的对应值。例如，在之前的\
  \ 5 × 5 平方数组中，当 `N` 等于 5 且 `i` 为 3 时，变量 `j` 的值为：\n\n`j = N - i - 1 ⟺ j = 5 − 3 −\
  \ 1 ⟺ j = 1`\n\n利用所有这些知识，现在我们来编写相应的 Java 程序。\n\n![](img/my_exercise_header.png)\
  \ Project_32.6\n```java\nstatic final int N = 5;\npublic static void main(String[]\
  \ args) throws Exception {\n    int i, j;\n    double total;\n    double[][] a =\
  \ new double[N][N];\n    for (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <=\
  \ N - 1; j++) {\n            a[i][j] = Double.parseDouble(cin.nextLine());\n   \
  \     }\n    }\n    //计算总和\n    total = 0;\n    for (i = 0; i <= N - 1; i++) {\n\
  \        j = N - i - 1;       //等同于：\n        total += a[i][j];    //total += a[i][N\
  \ - i - 1];\n    }\n    System.out.println(\"Sum = \" + total);\n}\n```\n\n![](img/notice.jpg)注意，负责计算反对对角线元素之和的\
  \ for 循环直接遍历了反对对角线。\n\n## 练习 32.6-3 填充数组\n\n编写一个 Java 程序，创建并显示以下数组。\n\n![Image](img/chapter32-11.png)\n\
  \n### 解决方案\n\n如你所见，主对角线上存在值 `-1`。你已经知道，方矩阵主对角线元素的共同特征是它们的行索引等于它们的列索引。现在，你还需要找到所有包含值\
  \ 10 的元素之间的一个共同特征，以及所有包含值 20 的元素之间的另外一个类似的共同特征。实际上，这些特征是存在的！任何包含值 10 的元素的行索引在任何情况下都大于其对应的列索引；同样，任何包含值\
  \ 20 的元素的行索引在任何情况下都小于其对应的列索引。\n\n因此，Java 程序如下。\n\n![](img/my_exercise_header.png)\
  \ Project_32.6-3\n```java\nstatic final int N = 5;\npublic static void main(String[]\
  \ args) throws Exception {\n    int i, j;\n    int[][] a = new int[N][N];\n    for\
  \ (i = 0; i <= N - 1; i++) {\n        for (j = 0; j <= N - 1; j++) {\n         \
  \   if (i == j) {\n                a[i][j] = -1;\n            } else if (i > j)\
  \ {\n                a[i][j] = 10;\n            } else {\n                a[i][j]\
  \ = 20;\n            }\n        }\n    }\n    for (i = 0; i <= N - 1; i++) {\n \
  \       for (j = 0; j <= N - 1; j++) {\n            System.out.print(a[i][j] + \"\
  \\t\");\n        }\n        System.out.println();\n    }\n}\n```\n\n### 32.7 复习题：判断题\n\
  \n对以下每个陈述判断对或错。\n\n1) 二维数组的所有元素必须包含不同的值。\n2) 为了引用二维数组的元素，你需要两个索引。\n3) 二维数组的两个索引必须全都是变量，或者全都是常量。\n\
  4) 一个 5 × 6 数组是一个具有五列六行的二维数组。\n5) 要引用数组 `b` 中位于第二行第三列的元素，你应该写成 `b[2][3]`。\n6) 遍历行意味着二维数组的第一行首先被处理，然后是处理第二行，依此类推。\n\
  7) 你不能使用 `i` 和 `j` 之外的变量来遍历二维数组。\n8) 下面的 Java 语句创建了一个二维数组：`int[][] names = new int[3][7];`\n\
