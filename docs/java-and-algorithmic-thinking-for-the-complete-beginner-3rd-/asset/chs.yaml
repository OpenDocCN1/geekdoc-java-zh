  \n### 练习 34.4-2 对包含字母数字的一维数组排序\n\n编写一个代码片段，使用冒泡排序算法对数组中的字母数字值进行降序排序。\n\n#### Solution\n\
  \n将此练习的描述与上一个相比，有两个不同点。首先，冒泡排序算法需要处理字母数字值，例如人的姓名或城市名；其次，它必须按降序进行排序。\n\n在 Java 中，你不能使用比较运算符（如等于\
  \ `==`、不等于 `!=`、小于 `<` 或大于 `>`）来比较字符串。正如你已经从的 第 14.3 节 中了解到的，Java 支持两个方法：`equals()`\
  \ 和 `compareTo()`，它们可以用于此目的。对于这些方法，字母“A”被认为“小于”字母“B”，“B”被认为“小于”字母“C”，依此类推。当然，如果数组中包含第一个字母相同的单词，Java\
  \ 将继续比较它们的第二个字母，可能还会比较第三个字母（如果有必要）。例如，名字“Jonathan”被认为“小于”名字“Jone”，因为第四个字母“a”“小于”第四个字母“e”。结论，如果你将布尔表达式\
  \ `a[n] < a[n - 1]` 替换为表达式 `a[n].compareTo(a[n - 1]) < 0`，冒泡排序算法就能对字母数字值进行升序排序。\n\
  \n![](img/notice.jpg) 结合英文字典中单词的组织方式考虑字母数字排序。\n\n现在，让我们看看需要修改什么以便算法能够按降序而不是升序排序。你还记得冒泡排序算法实际上是如何工作的吗？元素逐渐“泡”到索引最低的位置，就像可乐杯中的气泡上升一样。你在本练习中想要的是让较大的（而不是较小的）元素“泡”到较低索引的位置。因此，你只需要简单地反转决策控制结构中的比较运算符即可！\n\
  \n降序排序字母数字值的代码片段如下。\n\n```java\nString tempStr;\nfor (m = 1; m <= ELEMENTS - 1;\
  \ m++) {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n].compareTo(a[n\
  \ - 1]) > 0) {\n            tempStr = a[n];\n            a[n] = a[n - 1];\n    \
  \        a[n - 1] = tempStr;\n        }\n    }\n}\n```\n\n### 练习 34.4-3 在保持与第二个数组关系的同时对一维数组排序\n\
  \n编写一个 Java 程序，让用户输入 20 个平均值，然后使用冒泡排序算法对这些平均值进行升序排序。\n\n#### Solution\n\n在本练习中，你需要两个数组![Image](img/chapter34-15.png)\
