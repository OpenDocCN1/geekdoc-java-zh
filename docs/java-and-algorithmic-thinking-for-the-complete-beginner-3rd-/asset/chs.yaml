  \n在这个流程图片段中，当 `Boolean_Expression_1` 结果为真或 `Boolean_Expression_2` 结果为真时，将执行语句或语句块\
  \ `2`。因此，你可以使用 `OR`（或）逻辑操作符重新设计这个流程图片段，如图所示。\n\n![Image](img/chapter22-12.png)\n\
  \n![](img/notice.jpg)显然，这些方法也可以适用于嵌套的决策控制结构。\n\n#### 练习题 22.4-1 重写代码\n\n使用逻辑操作符重写以下\
  \ Java 程序。\n\n```java\npublic static void main(String[] args) throws Exception {\n\
  \    String today, name;\n    today = cin.nextLine();\n    name = cin.nextLine();\n\
  \    if (today.equals(\"February 16\") == true) {\n        if (name.equals(\"Loukia\"\
  ) == true) {\n            System.out.println(\"Happy Birthday!!!\");\n        }\
  \ else {\n            System.out.println(\"No match!\");\n        }\n    } else\
  \ {\n        System.out.println(\"No match!\");\n    }\n}\n```\n\n解\n\n`System.out.println(\"\
  Happy Birthday!!!\")` 语句只有在两个布尔表达式都为真时才会被执行。`System.out.println(\"No match!\")`\
  \ 语句在所有其他情况下执行。因此，你可以使用 `AND`（与，`&&`）逻辑操作符重写该 Java 程序。\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    String today, name;\n    today\
  \ = cin.nextLine();\n    name = cin.nextLine();\n    if (today.equals(\"February\
  \ 16\") == true && name.equals(\"Loukia\") == true) {\n        System.out.println(\"\
  Happy Birthday!!!\");\n    } else {\n        System.out.println(\"No match!\");\n\
  \    }\n}\n```\n\n#### 练习题 22.4-2 重写代码\n\n使用逻辑操作符重写以下 Java 程序。\n\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    int a, b, y;\n    a =\
  \ Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 10) {\n        y++;\n    } else if (b > 20) {\n       \
  \ y++;\n    } else {\n        y--;\n    }\n    System.out.println(y);\n}\n```\n\n\
  解\n\n`y++` 语句在变量 `a` 大于 10 或变量 `b` 大于 20 时执行。因此，你可以使用 `OR`（或，`||`）逻辑操作符重写该 Java\
  \ 程序。\n\n```java\npublic static void main(String[] args) throws Exception {\n  \
  \  int a, b, y;\n    a = Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 10 || b > 20) {\n        y++;\n    } else {\n        y--;\n\
  \    }\n    System.out.println(y);\n}\n```\n\n### 22.5 合并两个或多个单分支决策结构\n\n有时，你可能会设计一个包含两个或多个连续的单分支决策结构的算法，每个结构都评估相同的布尔表达式。示例如所示。\n\
  \n![Image](img/chapter22-13.png)\n\n当出现这种情况时，你可以直接将所有的单分支决策结构合并为一个结构，如下所示。\n\n![Image](img/chapter22-14.png)\n\
  \n![](img/remember.jpg)单分支决策结构需要是彼此相邻的。如果它们之间存在任何语句，除非你能将该语句移动到代码的其他地方，否则你无法合并它们。\n\
  \n#### 练习题 22.5-1 合并决策控制结构\n\n在以下 Java 程序中，合并单分支决策结构。\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int a;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    if (a > 0) {\n        System.out.println(\"Hello\");\n    }\n    if (a > 0)\
  \ {\n        System.out.println(\"Hermes\");\n    }\n}\n```\n\n解\n\n第一个和第二个决策控制结构评估完全相同的布尔表达式，因此它们可以简单地合并为一个。\n\
  \nJava 程序变为：\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int a;\n    a = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n \
  \       System.out.println(\"Hello\");\n        System.out.println(\"Hermes\");\n\
  \    }\n}\n```\n\n#### 练习题 22.5-2 合并决策控制结构\n\n在以下 Java 程序中，尽可能合并所有的单分支决策结构。\n\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int a, y,\
  \ b;\n    a = Integer.parseInt(cin.nextLine());\n    y = 0;\n    if (a > 0) {\n\
  \        y += a + 1;\n    }\n    b = Integer.parseInt(cin.nextLine());\n    if (!(a\
  \ <= 0)) {\n        System.out.println(\"Hello Hera\");\n    }\n    a++;\n    if\
  \ (a > 0) {\n        System.out.println(\"Hallo Welt\");\n    }\n}\n```\n\n解\n\n\
  仔细观察发现，第一个和第二个决策控制结构评估完全相同的布尔表达式。具体来说，对 `a > 0` 取反得到 `a <= 0`，因此 `!(a > 0)` 实际上等价于\
  \ `a <= 0`（使用 `!` 操作符时）。\n\n然而，第一个和第二个决策控制结构之间存在 `b = Integer.parseInt(cin.nextLine())`\
  \ 语句，这阻止了它们合并成一个。幸运的是，该语句可以移动到程序的开头。\n\n另一方面，第二个和第三个决策控制结构之间存在 `a++` 语句，这同样阻止了合并；因此，第三个决策控制结构无法与前两个合并（因为它依赖执行）。最终的\
  \ Java 程序所示：\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int a, y, b;\n    a = Integer.parseInt(cin.nextLine());\n    y = 0;\n \
  \   b = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n        y += a + 1;\n\
  \        System.out.println(\"Hello Hera\");\n    }\n    a++;\n    if (a > 0) {\n\
  \        System.out.println(\"Hallo Welt\");\n    }\n    System.out.println(y);\n\
  }\n```\n\n### 22.6 将两个单分支决策结构替换为双分支结构\n\n看下一个示例。\n\n```java\nif (x > 40) 执行操作 A\n\
  if (x <= 40) 执行操作 B\n```\n\n第一个决策控制结构评估变量 `x` 以测试它是否大于 40，紧接着第二个决策控制结构再次评估该变量以测试它是否小于等于\
  \ 40！\n\n这是新手程序员经常犯的“错误”。他们使用了两个单分支决策结构，尽管一个双分支决策结构就能完成相同的工作。\n\n之前的示例可以使用一个双分支决策结构重写，如下：\n\
  \n```java\nif (x > 40) 执行操作 A\nelse 执行操作 B\n```\n\n尽管这两个示例都完全正确且运行良好，但后者更好。CPU 只需要评估一个布尔表达式，从而提高了执行速度。\n\
  \n![](img/notice.jpg)两个单分支决策结构必须彼此相邻。如果它们之间存在任何语句，你就无法“合并”它们（即将它们替换为双分支决策结构），除非你能将该语句移动到代码的其他地方。\n\
  \n#### 练习题 22.6-1 “合并”决策控制结构\n\n在以下 Java 程序中，尽可能合并所有的单分支决策结构。\n\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    int a, y, b;\n    a =\
  \ Integer.parseInt(cin.nextLine());\n    y = 0;\n    if (a > 0) {\n        y +=\
  \ a;\n    }\n    b = Integer.parseInt(cin.nextLine());\n    if (!(a > 0)) {\n  \
  \      System.out.println(\"Hello Zeus\");\n    }\n    if (y > 0) {\n        System.out.println(y\
  \ + 5);\n    }\n    y += a;\n    if (y <= 0) {\n        System.out.println(y + 12);\n\
  \    }\n}\n```\n\n解\n\n仔细观察发现，第一个和第二个决策控制结构评估完全相同的布尔表达式。具体来说，对 `a > 0` 取反得到 `a <=\
  \ 0`，因此 `!(a > 0)` 实际上等价于 `a <= 0`（使用 `!` 操作符时）。\n\n然而，第一个和第二个决策控制结构之间存在 `b = Integer.parseInt(cin.nextLine())`\
  \ 语句，这阻止了它们合并成一个。幸运的是，该语句可以移动到程序的开头。\n\n另一方面，第二个和第三个决策控制结构之间存在 `a++` 语句，这同样阻止了合并；因此，第三个决策控制结构无法与前两个合并（因为它依赖执行）。最终的\
  \ Java 程序所示：\n\n（此处代码已在解题逻辑中处理）\n\n\n\n\n\n第一个决策结构评估 `a` 以测试它是否大于零，紧接着第二个决策结构再次评估\
  \ `a` 以测试它是否不大于零。尽管它们之间存在语句 `b = Integer.parseInt(cin.nextLine())`，但该语句可以移动到其他地方，因为它并不会真正影响后续的执行过程。因此，第一个和第二个决策结构可以合并！\n\
  \n另一方面，在第三和第四决策结构之间存在语句 `y += a`，这阻止了你的合并。该语句无法移动到任何地方，因为它影响后续的执行（第三和第四决策结构依赖于该语句）。因此，第三和第四决策结构不能合并！\n\
  \n最终的 Java 程序变为：\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int a, b, y;\n    a = Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 0) {\n        y += a;\n    } else {\n        System.out.println(\"\
  Hello Zeus\");\n    }\n    if (y > 0) {\n        System.out.println(y + 5);\n  \
  \  }\n    y += a;\n    if (y <= 0) {\n        System.out.println(y + 12);\n    }\n\
  }\n```\n\n### 22.7 将最可能为真的布尔表达式放在前面\n\n`if-else` 和 `case` 决策结构通常在决定执行哪个语句或代码块之前，需要检查几个表达式。在下一个决策结构中：\n\
  \n```java\nif (Boolean_Expression_1) {\n    // statement or block 1\n} else if (Boolean_Expression_2)\
  \ {\n    // statement or block 2\n} else if (Boolean_Expression_3) {\n    // statement\
  \ or block 3\n}\n```\n\n程序首先测试 `Boolean_Expression_1` 是否为真。如果不是，则测试 `Boolean_Expression_2`\
  \ 是否为真，如果不是，再测试 `Boolean_Expression_3`。然而，如果 `Boolean_Expression_1` 大情况下为假，而 `Boolean_Expression_3`\
  \ 大情况下为真呢？这意味着在测试通常为真的 `Boolean_Expression_3` 之前，浪费了时间去测试通常为假的 `Boolean_Expression_1`。\n\
  \n为了让你的程序更高效，你可以将最可能为真的布尔表达式放在开头，将最可能为假的布尔表达式放在结尾，如下：\n\n```java\nif (Boolean_Expression_3)\
  \ {\n    // statement or block 3\n} else if (Boolean_Expression_2) {\n    // statement\
  \ or block 2\n} else if (Boolean_Expression_1) {\n    // statement or block 1\n\
  }\n```\n\n![](img/.jpg) 这种改变似乎并非无关紧要，但你节省的每一分时间累积起来都能让你的程序运行更快、更高效。\n\n#### 练习 22.7-1\
  \ 重新排列布尔表达式\n\n根据研究，美国最喜欢的宠物是狗，猫位第二，荷兰猪紧随，鹦鹉最后。在下面的 Java 程序中，重新排列布尔表达式，使程序在大多数情况下运行更快、更高效。\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    String\
  \ kind;\n    System.out.print(\"What is your favorite pet? \");\n    kind = cin.nextLine();\n\
