  \n然而，这里出现的问题是，无论如何，在循环开始迭代之前，必须给变量 `maximum` 分配一个初始值。但是，这个值不能任意选择；它取决于特定的问题。因此，选择一个“几乎任意”的初始值需要仔细考虑，因为不正确的选择可能会导致不准确的结果。\n\
  \n在这次练习中，所有用户提供的值都与人的体重有关。由于不可能找到任何体重为负的人（至少在地球上是如此），你可以安全地将初始值 `-1` 赋值给变量 `maximum`，如下。\n\
