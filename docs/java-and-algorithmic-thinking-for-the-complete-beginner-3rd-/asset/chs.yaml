  \ `y` 值。\n\n.![Image](img/chapter23-05.png)\n\n解决方案：在这个练习中，至关重要的是防止用户输入值 0 或 4，因为这些值会导致分母为零。因此，程序需要考虑这些限制条件。流程图所示。\n\
