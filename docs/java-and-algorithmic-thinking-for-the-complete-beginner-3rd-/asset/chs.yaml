  \n## 本书的结构\n\n你手中的这本书遵循螺旋式课程教学法，这种方法由美国心理学家杰罗姆·布鲁纳（Jerome Bruner）于 1960 年提出。根据该方法，在教授某一学科时，基本思想会反复被回顾——每次都处于更高的层次——直到读者对该学科达到完全理解。首先，读者学习基本元素而不必担心细节。随后，会教授更多细节，并反复提及基本元素，最终存储在大脑的长记忆中。\n\
  \n根据杰罗姆·布鲁纳的观点，学习需要学生的积极参与、实验、探索和发现。本书包含了许多示例，其中大多数可以实际操作。这为读者提供了接触 Java 并能够创建他们自己的程序的机会。\n\
  \n## 谁应该买这本书？\n\n本书已针对最新 Java 版本进行了完全更新，在假设对该主题没有任何基础知识的情况下提供了编程的全面介绍。它是为渴望从零开始学习\
  \ Java 的个人设计的，为算法思维提供了坚实的基础——这是每个程序员必须掌握的基本技能。算法思维不仅仅是编写代码；它还意味着通过编码掌握解决问题的艺术。\n\
  \n此版本在保留前一版本所有流行功能的同时，引入了大量新练习，并进行了广泛修订和更新。此外，全新的章节对处理文本文件进行了实用介绍。\n\n本书结构适用于课堂教学和独立学习，每章末尾都有一组问题和练习题，旨在加强你的理解并应用所学知识。凭借约\
  \ 250 道解解题和 480 道未解练习题、500 道判断题、150 道单选题以及 200 道复习题和填字游戏（答案可在在线获取），本书对于以下人群非常理想：\n\
  \n► 追求自学的学者或中级水平程序员\n► 高生\n► 大学大一学生\n► 教育者\n► 教授\n► 任何想要使用最佳实践和技术学习或教授计算机编程的人\n\n\
  ## 本书使用的惯例\n\n以下是对书中惯例的一些说明。“概念”指的是文本某些部分的显示方式。\n\n### Java 语句\n\n本书使用了大量 Java 语言编写的示例。Java\
  \ 语句显示如下字体。\n\n```\nThis is a Java statement\n```\n\n### 正文中的关键字、变量、方法和参数\n\n\n\n\
  \n\n关键字、变量、方法（子程序）和参数有时会在段落正文中显示。当出现时，特殊文本将以与段落其他部分不同的字体显示。例如，`firstName = 5` 就是段落文本中的一个\
  \ Java 语句示例。\n\n## 斜体单词\n\n你可能会注意到，某些特殊文本也以斜体形式显示。在本书中，斜体单词表示通用类型，必须被替换为适用于你数据的具体特定名称。例如，Java\
  \ 语句的通用形式可以表示为：\n\n```\nstatic void name(type1 arg1, type2 arg2)\n```\n\n为了完成该语句，关键字\
  \ `name`、`type1`、`arg1`、`type2` 和 `arg2` 必须替换为有意义的内容。当你在程序中使用该语句时，可能会采用以下形式：\n\n\
  ```\nstatic void displayRectangle(int width, int height)\n```\n\n### 三点（…）：省略号\n\
  \n在语句的通用形式中，你可能还会注意到示例列表后面跟着三个点（`…`），它们也称为“省略号”。它们并不是语句的一部分。省略号表示你可以在列表中包含任意数量的项。例如，语句通用形式中的省略号：\n\
  \n```\ndisplayMessages(arg1, arg2, … );\n```\n\n表示该列表可能包含两个以上的参数。当你在程序中使用该语句时，你的语句可能如下所示。\n\
  \n```\ndisplayMessages(message1, \"Hello\", message2, \"Hi!\");\n```\n\n### 斜体中的方括号\n\
  \n某些语句或方法（子程序）的通用形式可能包含斜体的“方括号”`[ ]`，这表示所包含的部分是可选的。例如，该语句的通用形式：\n\n```\nsubject.substring(beginIndex\
  \ [, endIndex])\n```\n\n表示 `[, endIndex]` 部分可以省略。例如，以下两个语句可能会产生不同的结果，但它们在语法上都是正确的：\n\
  \n```\na = s.substring(3);\nb = s.substring(3, 9);\n```\n\n## 深色页头\n\n本书的大多数示例都使用这种字体显示。\n\
