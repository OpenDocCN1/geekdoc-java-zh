  \n## 排序数组\n\n`Arrays.sort(array_name)`\n\n该方法按升序排列数组 `array_name`。\n\n![](img/notice.jpg)排序是将数组中的元素按照特定顺序排列的过程。\n\
  \n### 示例\n\n![](img/my_exercise_header.png) Project_33.7b\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    int[] a = {3, 6,\
  \ 10, 2, 1, 10, 12, 4};\n    Arrays.sort(a);\n    for (i = 0; i <= a.length - 1;\
  \ i++) {\n        System.out.print(a[i] + \"  \"); //它显示为: 1  2  3  4  6  10  10\
  \  12\n    }\n    String[] b = {\"Hermes\", \"Apollo\", \"Dionysus\"};\n    Arrays.sort(b);\n\
  \    for (i = 0; i <= b.length - 1; i++) {\n        System.out.print(b[i] + \" \
  \ \"); //它显示为: Apollo  Dionysus  Hermes\n    }\n}\n```\n\n![](img/remember.jpg)为了在项目中使用\
  \ `Arrays` 类，你需要在项目开头使用 `import java.util.Arrays` 语句导入相应的库。\n\n## 检查键是否存在\n\n`struct.containsKey(key_name)`\n\
