  ii) 使用上述的子程序 `mySwap()`，编写一个名为 `mySort` 的子程序，通过其形式参数列表接受一个字符串数组，然后使用冒泡排序算法对数组进行排序。它必须能够按升序或降序排序。为了实现这一点，在形式参数列表中添加一个额外的\
  \ `Boolean` 参数。\niii) 编写一个名为 `displayArray` 的子程序，通过其形式参数列表接受一个数组并显示它。\niv) 使用上述的子程序\
  \ `mySort()` 和 `displayArray()`，编写一个 Java 程序，提示用户输入 20 个人的名字，然后显示两次：一次升序排序，另一次降序排序。\n\
  \n解决方案\n\n如下面的 Java 程序所示，`void` 方法 `mySort()` 使用了冒泡排序算法的适配版本。当将值 `true` 传递给参数 `ascending`\
  \ 时，算法按升序排序数组 `a`。当传递值 `false` 时，算法按降序排序数组 `a`。\n\n此外，`void` 方法 `mySort()` 在每两个元素的内容之间需要交换时，都会调用\
  \ `void` 方法 `mySwap()`。\n\n![](img/my_exercise_header.png) # Project_38.2-2\n```java\n\
  static final int PEOPLE = 20;\nstatic void mySwap(String[] a, int index1, int index2)\
  \ {\n    String temp;\n    temp = a[index1];\n    a[index1] = a[index2];\n    a[index2]\
  \ = temp;\n}\nstatic void mySort(String[] a, boolean ascending) {\n    int m, n;\n\
  \    for (m = 1; m <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >= m; n--)\
  \ {\n            if (ascending) {\n                if (a[n].compareTo(a[n - 1])\
  \ < 0) {\n                    mySwap(a, n, n - 1);\n                }\n        \
  \    } else {\n                if (a[n].compareTo(a[n - 1]) > 0) {\n           \
  \         mySwap(a, n, n - 1);\n                }\n            }\n        }\n  \
  \  }\n}\nstatic void displayArray(String[] a) {\n    int i;\n    for (i = 0; i <=\
  \ PEOPLE - 1; i++) {\n        System.out.println(a[i]);\n    }\n}\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    String[] names =\
  \ new String[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1; i++) {\n        System.out.print(\"\
  Enter a name: \");\n        names[i] = cin.nextLine();\n    }\n    mySort(names,\
  \ true);        //按升序排序名字\n    displayArray(names);        //并显示它们\n    mySort(names,\
  \ false);       //按降序排序名字\n    displayArray(names);        //并显示它们\n}\n```\n\n![](img/notice.jpg)\
  \ 在 Java 中，数组是通过引用传递的。这就是为什么不需要在子程序 `mySwap()` 和 `mySort()` 中包含 `return` 语句。\n\n\
