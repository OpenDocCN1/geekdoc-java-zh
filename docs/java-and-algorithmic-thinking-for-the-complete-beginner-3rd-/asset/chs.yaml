  Enter a positive integer: \");\n    x = Integer.parseInt(cin.nextLine());\n    if\
  \ (x % 2 == 0) {\n        System.out.println(\"Even\");\n    } else {\n        System.out.println(\"\
  Odd\");\n    }\n}\n```\n\n#### 练习题 17.1-5 周薪\n\n总工资取决于薪率和每周工作总小时数。然而，如果有人工作超过 40\
  \ 小时，超过 40 小时的所有小时将获得加班倍工资。设计一个流程图并编写相应的 Java 程序，让用户输入薪率和工作小时，然后计算并显示总工资。\n\n#####\
  \ 答案\n\n此练习可以使用双分支决策结构解决。当工作小时超过 40 小时时，总工资的计算方式如下：\n\n`gross pay = (pay rate) ×\
  \ 40 + 1.5 × (hours worked - 40)`\n\n解决此问题的流程图所示。\n\n![Image](img/chapter17-06.png)\n\
