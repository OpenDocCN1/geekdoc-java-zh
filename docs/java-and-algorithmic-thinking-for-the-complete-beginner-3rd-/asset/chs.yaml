  \ | 显示值 65，这当然是乘法 5 × 13 的结果 | | | |\n\n#### 练习 30.5-4 寻找约数个数\n\n编写一个 Java 程序，让用户输入一个正整数，然后显示其约数的总数。\n\
  \n### 解决方案\n\n让我们来看一些例子。\n\n- 值 12 的约数是数字 1, 2, 3, 4, 6, 12。\n- 值 15 的约数是数字 1, 3,\
  \ 5, 15。\n- 值 20 的约数是数字 1, 2, 4, 5, 10, 20。\n- 值 50 的约数是数字 1, 2, 5, 10, 25, 50。\n\
  \n如果变量 `x` 包含用户提供的整数，那么 `x` 的所有可能约数都在 1 到 `x` 之间。因此，你只需要一个 for 循环，变量 `counter` 的值从\
  \ 1 到 `x`，在每次迭代中，用一个单分支决策结构检查 `counter` 的值是否是 `x` 的约数。Java 程序如下。\n\n![](img/my_exercise_header.png)\
  \ 项目 _30.5-4\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int x, numberOfDivisors, i;\n    x = Integer.parseInt(cin.nextLine());\n\
  \    numberOfDivisors = 0;\n    for (i = 1; i <= x; i++) {\n        if (x % i ==\
  \ 0) {\n            numberOfDivisors++;\n        }\n    }\n    System.out.println(numberOfDivisors);\n\
  }\n```\n\n该程序在输入值为 20 时执行 20 次迭代。然而，如果它能执行次数的一半迭代并获得相同的结果，不是更好吗？当然是！所以，让我们让它更高效！\n\
  \n你可能知道，对于任何用户提供的整数（在变量 `x` 中）：\n\n- 值 1 始终是一个约数。\n- 用户提供的整数本身始终是一个约数。\n- 除了用户提供的整数外，在\
  \ 1 到 `x` 的范围内没有其他约数。\n\n因此，对于任何整数肯定有 2 个约数（1 和用户提供的整数本身）。程序必须从值 2 开始检查 1 到 `x`\
  \ 范围内的其他可能的约数。改进后的 Java 程序如下。\n\n![](img/my_exercise_header.png) 项目 _30.5-4b\n\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int x, numberOfDivisors,\
  \ i;\n    x = Integer.parseInt(cin.nextLine());\n    numberOfDivisors = 2;\n   \
  \ for (i = 2; i <= (int)(x / 2); i++) {\n        if (x % i == 0) {\n           \
  \ numberOfDivisors++;\n        }\n    }\n    System.out.println(numberOfDivisors);\n\
  }\n```\n\n该 Java 程序执行的迭代次数比之前的程序少一半！例如，对于输入值 20，该程序只执行 `20 - 2` 次迭代。\n\n#### 练习\
  \ 30.5-5 是质数吗？\n\n编写一个 Java 程序，提示用户输入一个大于 1 的整数，如果是质数则显示。质数是指除了 1 和本身外没有约数的大于 1\
  \ 的整数。7、11 和 13 都是此类。\n\n### 解决方案\n\n这个练习基于上一个。非常简单！如果用户提供的整数只有两个约数（1 和本身），它就是质数。Java\
  \ 程序如下。\n\n![](img/my_exercise_header.png) 项目 _30.5-5a\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int x, numberOfDivisors, i;\n\
  \    x = Integer.parseInt(cin.nextLine());\n    numberOfDivisors = 0;\n    for (i\
  \ = 1; i <= x; i++) {\n        if (x % i == 0) {\n            numberOfDivisors++;\n\
  \        }\n    }\n    if (numberOfDivisors == 2) {\n        System.out.println(\"\
  prime\");\n    }\n}\n```\n\n现在让我们让程序更高效。当发现第三个约数时，程序可以跳出循环，这意味着用户提供的整数不是质数。\n\n\
  ![](img/my_exercise_header.png) 项目 _30.5-5b\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int x, numberOfDivisors, i;\n    x = Integer.parseInt(cin.nextLine());\n\
  \    numberOfDivisors = 2;\n    for (i = 2; i <= (int)(x / 2); i++) {\n        if\
  \ (x % i == 0) {\n            numberOfDivisors++;\n            break;\n        }\n\
