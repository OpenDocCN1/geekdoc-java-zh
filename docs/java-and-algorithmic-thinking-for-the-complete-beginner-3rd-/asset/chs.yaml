  \n![](img/notice.jpg) 注意，替换的代码片段完全嵌套在这个外部 `for` 循环中。\n\n### 30.4 使用循环控制结构寻找最小值和最大值\n\
  \n在第 23.2  中，你学习了如何使用单分支决策结构找到四个值中的最小值和最大值。现在，下面的代码片段实现了相同的结果，但仅使用了一个变量 `w` 用于用户提供的值。\n\
  \n`w = Integer.parseInt(cin.nextLine());` // 用户输入第 1 个值\n`maximum = w;`\n`w = Integer.parseInt(cin.nextLine());`\
  \ // 用户输入第 2 个值\n`if (w > maximum) {maximum = w;}`\n`w = Integer.parseInt(cin.nextLine());`\
  \ // 用户输入第 3 个值\n`if (w > maximum) {maximum = w;}`\n`w = Integer.parseInt(cin.nextLine());`\
  \ // 用户输入第 4 个值\n`if (w > maximum) {maximum = w;}`\n\n除了第一对语句外，其他语句块都是相同的。因此，你可以保留其中一对，并将其封装在一个执行三次迭代的循环控制结构中，如下所示。\n\
  \n```java\nw = Integer.parseInt(cin.nextLine()); // 用户输入第 1 个值\nmaximum = w;\nfor\
