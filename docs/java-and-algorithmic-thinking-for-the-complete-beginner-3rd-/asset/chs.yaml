  \ 哪一年是闰年？\n19) 什么是回文数？\n\n# V 部分 循环结构\n\n## 第 24 章 循环结构引言\n\n### 24.1 什么是循环结构？\n\
  循环结构允许多次执行某语句或语句块，直到满足特定条件。\n\n### 24.2 从顺序控制到循环结构\n接下来的示例允许用户输入四个数字并计算它们的和。如你所见，还没有循环结构，只有顺序控制。\n\
  \n```java\ndouble x, y, z, w, total;\nx = Double.parseDouble(cin.nextLine());\n\
  y = Double.parseDouble(cin.nextLine());\nz = Double.parseDouble(cin.nextLine());\n\
  w = Double.parseDouble(cin.nextLine());\nSystem.println(total);\n```\n\n虽然这段代码很短，但考虑一个允许用户输入\
  \ 1000 个数字的类似示例。你能想象要写一千次 `Double.parseDouble(cin.nextLine())` 吗？如果只需要写一次该语句并让计算机执行一千次，那将是方便的。这就是循环结构大用武之地！\n\
  \n但在深入研究循环结构之前，先尝试解决这个谜题！在不使用循环结构的情况下，尝试使用两个变量重写之前的示例。嗯……显然你正在想：“我只能在变量 `x` 中读取一个值，然后将其赋值给变量\
  \ `total`”。你的想法是正确的，展示如下：\n\n```java\nx = Double.parseDouble(cin.nextLine()); //\
  \ 读取第一个数字\ntotal = x;\n```\n\n这等价于写成\n\n```java\ntotal = 0;\nx = Double.parseDouble(cin.nextLine());\
  \ // 读取第一个数字\ntotal = total + x;\n```\n\n现在呢？现在，你实际上可以做三件事，这些是：思考、思考，当然还有思考！\n\n\
  第一个用户提供的数字已经存储在变量 `total` 中，所以变量 `x` 现在可以自由使用了！因此，你可以重用变量 `x` 读取第二个值，它也会累加在变量 `total`\
  \ 中，如下所示：\n\n```java\ntotal = 0;\nx = Double.parseDouble(cin.nextLine()); // 读取第一个数字\n\
  total = total + x;\nx = Double.parseDouble(cin.nextLine()); // 读取第二个数字\ntotal =\
  \ total + x;\n```\n\n![](img/notice.jpg)语句 `total = total + x` 将 `x` 的值累加到 `total`\
  \ 中，这意味着它将 `x` 的值加上 `total` 之前的任何值。例如，如果变量 `total` 包含值 5，变量 `x` 包含值 3，语句 `total\
  \ = total + x` 将值 8 赋值给变量 `total`。\n\n\n\n\n\n由于第二个用户提供的数字已经累加到变量 `total` 中，变量 `x`\
  \ 可以被重用！这个过程可以一直重复，直到所有四个数字都被读取并累加到变量 `total` 中。最终的代码如下。请注意，它还没有使用任何循环控制结构！\n\n\
  ```\ntotal = 0;x = Double.parseDouble(cin.nextLine());total = total + x;x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;x = Double.parseDouble(cin.nextLine());total = total + x;x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;System.out.println(total);\n```\n\n![](img/notice.jpg)这段代码和本节开始的代码被认为是等价的。然而，它们之间的区别在于后者包含了四对完全相同的语句。\n\
  \n显然，你可以使用这个示例来读取并找到四个以上数字之和。然而，多次编写这些语句对来说非常繁琐，而且如果不小心漏掉某一对，可能会导致错误。\n\n你在这里真正需要的是保留一对语句，但使用循环控制结构来执行四次（或者如果你愿意，甚至执行\
  \ 1000 次）。你可以使用类似下面的代码片段。\n\n```\ntotal = 0;execute_these_statements_4_times {x\
  \ = Double.parseDouble(cin.nextLine());total = total + x;}System.out.println(total);\n\
  ```\n\n显然，在 Java 中并没有任何 `execute_these_statements_4_times` 语句。这仅用于演示目的，但很快你就会学到\
  \ Java 支持的所有循环控制结构的所有知识！\n\n### 24.3 复习题：判断对错\n\n对以下每个陈述选择对（true）或错（false）。\n\n\
  1) 循环控制结构是一种允许多次执行语句或语句块，直到满足指定的结构。\n2) 可以使用顺序控制结构，提示用户输入 1000 个数字，然后计算它们的和。\n3)\
  \ 下面的代码片段在变量 `total` 中累加了值 10。`total = 10;a = 0;total = total + a;`\n4) 下面的 Java\
  \ 程序满足有效性属性。`public static void main(String[] args) throws Exception {int a, total;a\
  \ = 5;total = total + a;System.out.println(total);}`\n5) 以下的两个代码片段都将值 5 赋值给变量 `total`。`a\
  \ = 5;total = a;` `total = 0;a = 5;total = total + a;`\n\n## 第 25 章\n\n前测试、中测试和后测试循环结构\n\
  \n### 25.1 前测试循环结构\n\n前测试循环结构如下流程图所示。\n\n![Image](img/chapter25-01.png)\n\n让我们看看当执行流到达前测试循环结构时会发生什么。如果\
  \ `Boolean_Expression` 求值为真，则执行该结构的语句或语句块，然后执行流返回并再次检查 `Boolean_Expression`。如果 `Boolean_Expression`\
  \ 再次求值为真，则重复该过程。当 `Boolean_Expression` 在某一点求值为假时，迭代停止，执行流退出循环。\n\n![](img/notice.jpg)决策符号（菱形或菱形框）既用于决策控制结构，也用于循环控制结构。然而，在循环控制结构中，菱形的一个出口总是指向上方。\n\
  \n![](img/notice.jpg)“前测试循环结构”之所以这样命名，是因为首先求值布尔表达式，然后才执行该结构的语句或语句块。\n\n![](img/notice.jpg)由于在进入循环之前就求了布尔表达式，前测试循环可能会执行从零次到多次迭代。\n\
  \n![](img/notice.jpg)每执行一次循环控制结构的语句或语句块时，计算机科学中的术语是“循环正在迭代”或“循环执行一次迭代”。\n\nJava\
  \ 语句的通用形式是\n\n```\nwhile (Boolean_Expression) {A statement or block of statements}\n\
  ```\n\n下面的示例显示了从 1 到 10 的数字。\n\n![](img/my_exercise_header.png) Project_25.1\n```\n\
  public static void main(String[] args) throws Exception {int i;i = 1;while (i <=\
  \ 10) {\n\n> System.out.println(i);\n\n> i++;\n\n}}\n```\n\n![](img/notice.jpg)就像决策控制结构一样，循环控制结构内部的语句应该缩进。\n\
  \n与决策控制结构类似，当只需要一个单一语句作为 `while` 语句的一部分时，允许省略大括号 `{ }`。因此，`while` 语句可以如下所示。\n\n\
  ```\nwhile (Boolean_Expression)One_Single_Statement;\n```\n\n![](img/remember.jpg)为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使\
  \ `while` 语句仅包含一个语句。\n\n#### 练习 25.1-1 设计流程图并计算迭代总数\n\n为以下代码片段设计相应的流程图。这段 Java 代码执行了多少次？\n\
  \n```\nint i;i = 4;while (i > 0) {i--;}System.out.println(\"The end\");\n```\n\n\
  解\n\n相应的流程图片段如下。\n\n.![Image](img/chapter25-02.png)\n\n接下来，跟踪表可以帮助你观察执行流。\n\n| 步骤\
  \ | 语句 | 注释 | i |  |  |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | i =\
  \ 4 |   | 4 |  |  |\n| 2 | while (i > 0) | 求值为真 | 1^(st) | iteration |  |\n| 3 |\
  \ i‑-- |   | 3 |  |  |\n| 4 | while (i > 0) | 求值为真 | 2^(nd) | iteration |  |\n|\
  \ 5 | i‑-- |   | 2 |  |  |\n| 6 | while (i > 0) | 求值为真 | 3^(rd) | iteration |  |\n\
  | 7 | i‑-- |   | 1 |  |  |\n| 8 | while (i > 0) | 求值为真 | 4^(th) | iteration |  |\n\
  | 9 | i‑-- |   | 0 |  |  |\n| 10 | while (i > 0) | 求值为假 |  |  |\n| 11 | .println(\"\
  The end\") | 显示: The end |  ||\n\n从跟踪表中可以看出，迭代次数为四。\n\n![](img/notice.jpg)前测试循环结构的语句或语句块执行\
  \ N 次时，布尔表达式求值 N+1 次。因此，要确定迭代次数，应计算语句或语句块执行的次数，而不是布尔表达式求值的次数。\n\n#### 练习 25.1-2\
  \ 计算迭代总数\n\n这段代码执行了多少次迭代？\n\n```\nint i;i = 4;while (i >= 0) {System.out.println(i);}System.out.println(\"\
  The end\");\n```\n\n解\n\n这个练习与上一个几乎相同。区别在于布尔表达式在 i = 0 时仍为真。因此，它多了一次迭代，即五次。\n\n\
  #### 练习 25.1-3 计算迭代总数\n\n这段代码执行了多少次迭代？\n\n```\nint i;i = 1;while (i != 6) {i +=\
  \ 2;}System.out.println(\"The end\");\n```\n\n解\n\n让我们创建一个跟踪表来观察执行流。\n\n| 步骤 | 语句\
  \ | 注释 | i |  |  |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 | i = 1 |  \
  \ | 1 |  |  |\n| 2 | while (i != 6) | 求值为真 | 1^(st) | iteration |  |\n| 3 | i +=\
  \ 2 |   | 3 |  |  |\n| 4 | while (i != 6) | 求值为真 | 2^(nd) | iteration |  |\n| 5\
  \ | i += 2 |   | 5 |  |  |\n| 6 | while (i != 6) | 求值为真 | 3^(rd) | iteration | \
  \ |\n| 7 | i += 2 |   | 7 |  |  |\n| 8 | while (i != 6) | 求值为真 | ... | ... |\n\n\
  从跟踪表中可以看出，由于 6 从未被赋值给变量 i，这段代码将无限迭代下去！显然，这段代码不满足有限性属性。\n\n#### 练习 25.1-4 计算迭代总数\n\
  \n这段代码执行了多少次迭代？\n\n```\nint i;i = -10;while (i > 0) {System.out.println(i);i--;}System.out.println(\"\
  The end\");\n```\n\n解\n\n初始，值 −10 被赋值给变量 i。布尔表达式直接求值为假，执行流直接跳转到 System.out.println(\"\
  The end\") 语句。因此，这段代码执行了零次迭代。\n\n#### 练习 25.1-5 寻找四个数字之和\n\n\n\n\n\n使用前测试循环结构，编写一个\
  \ Java 程序，让用户输入四个数字，然后计算并显示它们的和。\n\n## 解决方案\n\n你还记得第 24.2 节中计算四个数字和的示例吗？在最后，经过简单的处理后，提议的代码片段变为：\n\
  \n```java\ntotal = 0;execute_these_statements_4_times {x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;}System.out.println(total);\n```\n\n现在，你需要一种方法用真实的 Java 语句来“呈现” `execute_these_statements_4_times`\
  \ 语句。`while` 语句可以实现这一点，但你需要一个额外的变量来计算总迭代次数。这样，当执行了所需的迭代次数后，执行流将退出循环。\n\n以下是一个通用代码片段，它会根据\
  \ `total_number_of_iterations` 指定的次数进行迭代：\n\n```java\ni = 1;while ( i <= total_number_of_iterations\
  \ ) {A statement or block of statementsi++;}\n```\n\n其中 `total_number_of_iterations`\
  \ 可以是一个常量值，甚至是一个变量或表达式。\n\n将此代码片段与之前的结合后，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-5\n```java\npublic static void main(String[] args) throws Exception\
  \ {double total, x;int i;total = 0;i = 1;while (i <= 4) {\n\n> x = Double.parseDouble(cin.nextLine());\
  \   \n\n> total = total + x;\n\n> i++;\n\n}System.out.println(total);}\n```\n\n\
  ![](img/notice.jpg)变量 `i` 的名称并不是固定的。你可以使用任何喜欢的变量名，例如 `counter`、`count`、`k` 等。\n\n\
  ### 练习题 25.1-6：求奇数之和\n\n设计一个流程图并编写相应的 Java 程序，让用户输入 20 个整数，然后计算并显示奇数的和。\n\n## 解决方案\n\
  \n这非常简单。程序在循环内部必须做的是检查用户提供的数字是否为奇数，如果是奇数，则必须将该数字累加到变量 `total` 中；偶数则被忽略。流程图如下。它包含一个嵌套在前测试循环结构中的单分支决策结构。\n\
  \n![Image](img/chapter25-03.png)\n\n对应的 Java 程序如下所示。\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-6\n```java\npublic static void main(String[] args) throws Exception\
  \ {int total, i, x;total = 0;i = 1;while (i <= 20) {\n\n> x = Integer.parseInt(cin.nextLine());\n\
  \n> if (x % 2 != 0) {\n\n> > total += x;    //这等同于 total = total + x\n\n> }\n\n\
  > i++;\n\n}System.out.println(total);}\n```\n\n![](img/notice.jpg)只要保持它们在语法和逻辑上正确，你可以将任何决策控制结构嵌套在任何循环控制结构中。\n\
  \n### 练习题 25.1-7：求 N 个数的和\n\n编写一个 Java 程序，让用户输入 N 个数字，然后计算并显示它们的和。N 的值必须在程序开始时由用户提供。\n\
  \n## 解决方案\n\n在此练习中，总迭代次数取决于用户必须输入的值。以下是一个迭代 N 次的通用代码片段，其中 N 由用户提供。\n\n```java\n\
  n = Integer.parseInt(cin.nextLine());i = 1;while (i <= n) {A statement or block\
  \ of statementsi++;}\n```\n\n根据你目前为止所学到的，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-7\n```java\npublic static void main(String[] args) throws Exception\
  \ {int n, i;double x, total;total = 0;n = Integer.parseInt(cin.nextLine());i = 1;while\
  \ (i <= n) {\n\n> x = Double.parseDouble(cin.nextLine());\n\n> total += x;\n\n>\
  \ i++;\n\n}System.out.println(total);}\n```\n\n### 练习题 25.1-8：求未知数量数字的和\n\n编写一个\
  \ Java 程序，让用户重复输入整数值，直到输入值 -1 为止。数据输入完成后，必须显示输入数字之和。（-1 的值不能包含在最终和中）。接下来，创建一个追踪表，使用\
  \ 10、20、5 和 -1 作为输入值来检查你的程序是否正常运行。\n\n## 解决方案\n\n在此练习中，总迭代次数是未知的。如果你使用决策控制结构，你的程序看起来像下面的代码片段。\n\
  \n```java\ntotal = 0;x = Integer.parseInt(cin.nextLine());\nif (x != -1) {  //检查变量\
  \ x\n            total += x;   //并执行此语句\nx = Integer.parseInt(cin.nextLine()); \
  \ //并执行这一条\nif (x != -1) {  //检查变量 x\n\n> total += x;   //并执行此语句\n\n> x = Integer.parseInt(cin.nextLine());\
  \  //并执行这一条\n\n> if (x != -1) {  //检查变量 x\n\n> > total += x;   //并执行此语句\n\n> > x\
  \ = Integer.parseInt(cin.nextLine());  //并执行这一条\n\n> > }\n\n> > }\n\n> >\n\n}\n\
  ```\n\n现在让我们用循环结构来重写这个程序。最终程序如下所示。如果你跟踪执行流，你会发现它与之前的是等效的。\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-8\n```java\npublic static void main(String[] args) throws Exception\
  \ {double total, x;total = 0;x = Integer.parseInt(cin.nextLine());while (x != -1)\
  \ {  //检查变量 x\ntotal += x;      //并执行此语句\nx = Integer.parseInt(cin.nextLine());\
  \  //并执行这一条\n}System.out.println(total);}\n```\n\n让我们创建一个追踪表，使用 10、20、5 和 -1 作为输入值来确定该程序是否正常运行。\n\
  \n| 步骤 | 语句 | 备注 | x | total |\n| --- | --- | --- | --- | --- |\n| --- | --- | ---\
  \ | --- | --- |\n| 1 | total = 0 | | | 0 |\n| 2 | x = Integer.parseInt(cin.nextLine());\
  \ | | 10 | 0 |\n| 3 | if (x != -1) | true | 10 | 0 |\n| 4 | total += x; | | 10 |\
  \ 10\n|| 5 | x = Integer.parseInt(cin.nextLine()); | | 20 | 10 |\n| 6 | if (x !=\
  \ -1) | true | 20 | 10 |\n| 7 | total += x; | | 20 | 30 |\n| 8 | x = Integer.parseInt(cin.nextLine());\
  \ | | 5 | 30 |\n| 9 | if (x != -1) | true | 5 | 30 |\n| 10 | total += x; | | 5 |\
  \ 35 |\n| 11 | x = Integer.parseInt(cin.nextLine()); | | -1 | 35 |\n| 12 | if (x\
  \ != -1) | false | -1 | 35 |\n| 13 | .println(total) | 显示: 35 | -1 | 35 |\n\n如所示，最后变量\
  \ `total` 包含值 35，这确实是 10 + 20 + 5 的和。此外，用户提供的最终值 -1 不参与和计算。\n\n### 练习题 25.1-9：求\
  \ 20 个数字的乘积\n\n编写一个 Java 程序，让用户输入 20 个数字，然后计算并显示它们的乘积。\n\n## 解决方案\n\n如果你使用序列控制结构，它将像下面的片段。\n\
  \n```java\np = 1;x = Double.parseDouble(cin.nextLine());p = p * x;x = Double.parseDouble(cin.nextLine());p\
  \ = p * x;……x = Double.parseDouble(cin.nextLine());p = p * x;\n```\n\n![](img/notice.jpg)注意变量\
  \ `p` 初始化为 1 而不是 0。这对于语句 `p = p * x` 正常运行是必要的；否则最终乘积将为零。\n\n利用之前练习的知识，最终程序变为：\n\n\
  ![](img/my_exercise_header.png) Project_25.1-9\n```java\npublic static void main(String[]\
  \ args) throws Exception {double p, x;int i;p = 1;i = 1;while (i <= 20) {\n\n> x\
  \ = Double.parseDouble(cin.nextLine());\n\n> p = p * x;\n\n> i++;\n\n}System.out.println(p);}\n\
  ```\n\n### 25.2 后测试循环结构\n\n后测试循环结构如所示流程图所示。\n\n![Image](img/chapter25-04.png)\n\n\
  ![](img/remember.jpg)在循环控制结构中，菱形的一个出口始终有一个向上的方向。\n\n\n\n\n当执行流到达后测试循环结构时，会发生什么呢？该结构中的语句或语句块被直接执行，如果\
  \ `Boolean_Expression` 的求值为 `true`，则执行流将回到该结构语句或语句块上方的点。该语句或语句块再次执行一次，如果 `Boolean_Expression`\
  \ 再次求值为 `true`，则重复该过程。当 `Boolean_Expression` 在某一点求值为 `false` 时，迭代停止，执行流退出循环。\n\n\
  ![](img/notice.jpg)后测试循环与前测试循环的区别在于，它首先执行结构中的语句或语句块，然后才计算布尔表达式。因此，后测试循环至少执行一次迭代！\n\
  \n![](img/remember.jpg)每当循环控制结构的语句或语句块被执行一次时，计算机科学中使用的术语是“循环正在迭代（iterating）”或“循环执行了一次迭代”。\n\
  \nJava 语句的通用形式如下：\n\n```java\ndo {A statement or block of statements} while (Boolean_Expression);\n\
  ```\n\n示例显示了数字 1 到 10。\n\n![](img/my_exercise_header.png) Project_25.2\n```java\n\
  public static void main(String[] args) throws Exception {\n    int i;i = 1;\n  \
  \  do {\n        System.out.println(i);\n        i++;\n    } while (i <= 10);\n\
  }\n```\n\n![](img/notice.jpg)注意 do-while 语句的末尾有一个分号（ `;` ）字符。\n\n当 do-while 语句只需要包含一个单一语句时，你可以省略大括号\
  \ `{ }`。因此，do-while 语句可以像下面所示书写。\n\n```java\ndoOne_Single_Statement;while (Boolean_Expression);\n\
  ```\n\n![](img/notice.jpg)为了防止潜在的逻辑错误，许多程序员即使在 do-while 语句只包含一个语句时也倾向于始终使用大括号。\n\
  \n### 练习 25.2-1 设计流程图并计算总迭代次数\n\n为以下代码段设计对应的流程图。这段 Java 代码执行了多少次迭代？\n\n```java\n\
  int i;i = 3;do {i--;} while (i > 0);System.out.println(\"The end\");\n```\n\n####\
  \ 答案\n\n对应的流程图片段如下。\n\n![Image](img/chapter25-05.png)\n\n现在，让我们创建一个追踪表来观察执行流。\n\n\
