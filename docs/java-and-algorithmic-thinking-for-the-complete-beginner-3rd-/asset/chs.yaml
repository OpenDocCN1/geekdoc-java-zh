  \ be executed// System.out.println(\"Hello Ares\");`\nd) `/* This will be executed\
  \ */ System.out.println(\"Hello Aphrodite\");`\ne) 以上都不是\n\n## 5 章\n### 变量与常量\n\n\
  ### 5.1 什么是变量？\n\n在计算机科学中，变量是计算机主内存（RAM）中的一个位置，程序可以在其中存储一个值并在程序执行时更改它。\n\n将变量想象成一个透明的盒子，你可以在其中一次放入并保持一个物体。因为盒子是透明的，你也可以看到它里面装了什么。此外，如果你有两个或更多盒子，你也可以给它们命名。例如，如果你有三个或更多盒子，你可以给每个盒子起一个唯一的名称。\n\
  \n![Image](img/chapter5-01.png)\n\n命名为 `numberA`、`numberB` 和 `numberC` 的盒子分别包含 13、8\
  \ 和 4。当然，你可以查看甚至更改每个盒子包含的值。\n\n现在，假设有人让你计算前两个盒子的和并存储在最后一个中。你遵循的步骤是：\n1. 查看前两个盒子以及它们包含的值。\n\
  2. 使用你的 CPU（大脑）计算总和。\n3. 将结果（21）插入最后一个盒子。由于每个盒子只能包含一个值，值 4 实际上被替换为 21。盒子现在是这样。\n\
  \n![Image](img/chapter5-02.png)\n\n在流程图中，在变量中存储值的操作由一个向左箭头表示：\n\n![Image](img/chapter5-03.png)\n\
  \n这种操作通常表示为“将一个值或表达式的结果赋值给变量”。左箭头被称为赋值运算符。注意，这个箭头始终指向左侧；不允许使用右箭头。\n\n在真实的计算机科学中，这三个盒子实际上是主内存（RAM）中的三个独立区域，命名为\
  \ `numberA`、`numberB` 和 `numberC`。\n\n![Image](img/chapter5-04.png)\n\n当程序指示 CPU\
  \ 执行以下语句时：\n\n```\nnumberC = numberA + numberB\n```\n\n它遵循与之前示例相同的三个步骤：\n1. 数字 13\
  \ 和 8 从命名为 `numberA` 和 `numberB` 的 RAM 区域传输到 CPU。\n2. CPU 计算 `13 + 8`。\n3. 将结果 21\
  \ 从 CPU 传输到命名为 `numberC` 的 RAM 区域，替换现有的 4。\n\n在 Java 程序运行时，变量可以持有各种值，但一次只有一个值。当你为变量赋值时，该值将一直存储，直到你赋值一个新值来替换旧值。变量的内容可以变为不同的值，但它的名称始终不变，因为名称只是内存位置的标识符。\n\
  \n\n\n\n有时，你可能需要使用一个程序运行期间不能改变的值。这种值被称为**常量**。简单来说，常量可以被看是一个被锁定的变量。这意味着当程序开始运行时，一个值被分配给该常量，此后在程序运行期间，任何东西无法改变该值。例如，在财务程序中，利率可以被声明为常量。\n\
  \n常量的描述性名称还可以提高你程序的可读性，并帮助你避免某些错误。例如，假设你在程序的许多处使用了 `3.14159265` 这个值（但不是作为常量）。如果你在输入这个数字时犯了拼写错误，这将导致错误的结果。但是，如果给这个值起一个名称，名称中的任何拼写错误都会被编译器检测到，并通过错误消息通知你。\n\
  \n在流程图中，你可以用等号（`=`）来表示将常量设置为某个值的操作。\n\n![Image](img/chapter05-06.png)\n\n![](img/notice.jpg)此书使用大写字母来区分常量和变量。\n\
  \n考虑这样一个算法，允许用户输入三个不同产品的价格，然后计算并显示每个产品 20% 的增值税（已知为 `VAT`）。图 5–1 显示了在不使用常量时的这一处理过程。\n\
  \n![Image](img/chapter05-07.png)\n\n图 5–1 不使用常量计算三个产品的 20% 增值税\n\n尽管这个算法是完全正确的，但问题在于作者使用了三次\
  \ 20% 的增值税率（`20/100`）。如果这是一个真实的计算机程序，CPU 将被迫单独地计算三次除法结果（`20/100`）。\n\n![](img/notice.jpg)通常情况下，除法和乘法是消耗\
  \ CPU 时间的操作，必须尽可能避免。\n\n更好的解决方案是使用一个变量，如图 5–2 所示。这减少了除法操作的次数，也减少了拼写错误的可能性。\n\n![Image](img/chapter05-08.png)\n\
  \n图 5–2 使用变量 `vat` 计算三个产品的 20% 增值税\n\n这次，除法（`20/100`）只被计算一次，然后使用其结果来计算每个产品的增值税。但即便如此，该算法（它以后可能会变成计算机程序）并不完美；`vat`\
  \ 是一个变量，任何程序员都可能在程序的下方不小心改变它的值。\n\n理想的解决方案是将变量 `vat` 改为常量 `VAT`，如下：\n\n![Image](img/chapter05-09.png)\n\
  \n图 5–3 使用常量 `VAT` 计算三个产品的 20% 增值税\n\n![](img/notice.jpg)注意，当在流程图中声明常量时，使用的是等号（`=`）而不是左箭头。\n\
  \n这最后一个解决方案出于许多原因是最佳选择：\n\n-   包括程序员在内的任何人都无法仅仅通过在程序的任何位置无意编写诸如 `VAT ← 0.60` 的语句来改变常量\
  \ `VAT` 的值。\n-   拼写错误的可能性降到了最低。\n-   算术操作的数量保持在尽可能低。\n-   如果某天财政部长决定将增值税率从 20% 提高到\
  \ 22%，程序员只需要更改一行代码！\n\n### 5.3 存在多少类型的变量和常量？\n\n大多数计算机语言中存在许多不同类型的变量和常量。这种多样性的性是因为每个变量或常量可以持有的数据类型不同。大多数情况下，变量和常量持有以下类型的数据。\n\
  \n-   **整数**：整数值是不带任何小数部分的正或负数，如 `5`、`100`、`135`、`-25` 和 `-5123`。\n-   **实数**：实数值是包含小数部分的正或负数，如\
  \ `5.1`、`7.23`、`5.0`、`3.14` 和 `-23.78976`。实数值也被浮点数（floats）。\n-   **布尔型**：布尔变量（或常量）只能持有两个值之一：`true`\
  \ 或 `false`。\n-   **字符**：字符是一个字母数字（一个字母、数字或符号），通常用单引号括起来，如 `'a'`、`'1'` 或 `'@'`。这种命名在\
  \ Java 中被称为“驼峰命名法”（Camel Case），常量使用驼峰命名法。\n\n### 5.4 Java 变量和常量命名规则与约定\n\n-   在\
  \ Java 中，必须遵循某些规则来命名变量或常量。\n-   使用大写字母区分常量和变量。\n-   变量和常量名是区分大小写的，这意味着大小写字母之间有区别。例如，`myVAR`、`myvar`、`MYVAR`\
  \ 和 `MyVar` 是不同的名称。\n-   不允许空格字符。如果变量或常量包含多个单词，你可以使用下划线（`_`）连接单词，或者将每个单词（除第一个之外）大写。例如，变量名\
  \ `student first name` 是错误的。你可以使用 `student_first_name`，或者更好的 `studentFirstName`。\n\
  -   有效的变量或常量可以是字母或下划线。可以使用数字，但不能放在名称开头。例如，`1studentName` 写得不对。你可以使用 `studentName1`\
  \ 或 `student1Name`。\n-   变量或常量的命名通常描述其所包含数据的含义和作用。例如，存储温度值的变量可以命名为 `temperature`、`temp`\
  \ 或 `t`。\n-   不要使用 Java 的任何保留字作为变量或常量名。例如，`while` 不能作为有效的变量或常量名，因为它是 Java 的保留字。\n\
  \n![](img/notice.jpg)在 Java 中命名变量（或常量）时，应避免使用美元符号（`$`）字符。\n\n### 5.5 “声明变量”这个短语是什么意思？\n\
  \n\n\n\n声明是在主内存（RAM）中预留部分空间以存储变量内容的过程。在许多高级别计算机语言（包括 `Java`）中，程序员必须在使用变量之前编写特定的语句来在\
  \ RAM 中预留该部分空间。在大多数情况下，他们甚至需要指定变量类型，以便编译器或解释器确切知道需要预留多少空间。\n\n以下是展示如何在不同高级别计算机语言中声明变量的示例。\n\
  \n| 声明语句 | 高级计算机语言 |\n| :--- | :--- |\n| `Dim sum As Integer` | Visual Basic |\n\
  | `int sum;` | `C#`, `C`, `C++`, `Java` 等许多 |\n| `sum: Integer;` | Pascal, Delphi\
  \ |\n| `var sum;` | Javascript |\n\n### 5.6 如何在 Java 中声明变量\n\nJava 是一种强类型编程语言。这意味着每个变量都必须与特定的数据类型相关。在\
  \ Java 中有八种基本数据类型：`byte`、`short`、`int`、`long`、`float`、`double`、`boolean` 或 `char`。使用哪一个取决于具体问题！具体来说：\n\
  \n- `type byte` 可以存储 −127 到 +128 之间的整数\n- `type short` 可以存储 −32768 到 +32767 之间的整数\n\
  - `type int` 可以存储 −2³¹ 到 +2³¹ ��1 之间的整数\n- `type long` 可以存储 −2⁶³ 到 +2⁶³ ⁮1 之间的整数\n\
  - `type float` 可以存储单精度实数\n- `type double` 可以存储双精度实数\n- `type boolean` 只能存储两个可能的值：即\
  \ true 或 false\n- `type char` 可以存储单个字符或一个 0 到 +65535 之间的整数。\n\n![](img/notice.jpg)\n\
  在许多计算机语言中，还有一种名为“string”（字符串）的变量类型，它可以存储字符序列。这些字符序列（或字符串）通常被包含在双引号或单引号中，例如“Hello\
  \ Zeus”、“I am 25 years old”等。Java 也支持字符串，但请记住 Java 中的字符串不是基本数据类型。在不详述细节的情况下，Java\
  \ 中字符串的声明方式与基本数据类型相同，但 Java 内部存储和处理它们的方式完全不同。\n\n要声明变量，Java 语句的一般形式为：\n\n```\ntype\
  \ name [ = value];\n```\n\n其中\n\n- `type` 可以是 `byte`、`short`、`int`、`long`、`float`、`double`、`boolean`、`char`\
  \ 甚至是 `String`。\n- `name` 是变量名。它应该遵循驼峰命名法（Lower Camel Case）以及 5.4 节 中介绍的所有变量命名规则。\n\
  - `value` 是可选的。如果提供，可以是任何有效的初始值。\n\n接下来是 Java 中声明某些变量的示例。\n\n```java\nint number1;\n\
  boolean found;\nString firstName;\nString studentName;\n```\n\n![](img/notice.jpg)\n\
  注意，类型 `String` 的首字母“S”是大写的。\n\n以下是演示对某些变量声明并直接赋值初始值的示例\n\n```java\nint num = 5;\n\
  String name = \"Hera\";\nchar favoriteCharacter = 'w';\n```\n\n这些等同于以下内容：\n\n```java\n\
  int num;\nString name;\nchar favoriteCharacter;\nnum = 5;\nname = \"Hera\";\nfavoriteCharacter\
  \ = 'w';\n```\n\n![](img/notice.jpg)\n在 Java 中，为变量赋值是使用等号（ = ）完成的。此操作等同于流程图中的左箭头。\n\
  \n![](img/notice.jpg)\n注意，在 Java 中，你使用双引号 (\" \") 为 `String` 类型的变量赋值，但使用单引号 (' ')\
  \ 为 `char` 类型的变量赋值。\n\n最后但同样重要的是，你可以通过逗号分隔，在一行内声明多个相同类型的变量。\n\n```java\nint a, b;\n\
  double x, y, z;\nlong w = 3, u = 2;\n```\n\n### 5.7 如何在 Java 中声明常量\n\n你可以使用关键字序列\
  \ `static` 和 `final` 在 Java 中声明常量。语句的一般形式如下。\n\n```\nstatic final type NAME = value;\n\
  ```\n\n其中\n\n- `type` 可以是 `byte`、`short`、`int`、`long`、`float`、`double`、`boolean`、`char`\
  \ 甚至是 `String`。\n- `NAME` 是一个有效的常量名。它应该遵循 5.4 节 中介绍的所有常量命名规则和约定。\n- `value` 是任何有效值。\n\
  \n以下示例展示了在 Java 中声明了一些常量。\n\n```java\nstatic final double VAT = 0.22;\nstatic final\
  \ int NUMBER_OF_PLAYERS = 25;\nstatic final String COMPUTER_NAME = \"pc01\";\nstatic\
  \ final String FAVORITE_SONG = \"We are the world\";\nstatic final char FAVORITE_CHARACTER\
  \ = 'w';\n```\n\n![](img/notice.jpg)\n注意，在 Java 中，你使用双引号 (\" \") 声明 `String` 类型的常量，但使用单引号\
  \ (' ') 声明 `char` 类型的常量。\n\n![](img/remember.jpg)\n一旦定义了常量，其值在运行时无法更改。\n\n![](img/remember.jpg)\n\
  Java 要求所有语句都以分号（ ; ）结束。\n\n![](img/remember.jpg)\n虽然常量名可以包含小写字母，但建议只使用大写字母。这有助于你在视觉上将常量与变量区分开。\n\
  \n### 5.8 复习题：对/错\n\n选择以下每个陈述的对或错。\n\n1) 变量是计算机辅助存储设备中的一个位置。\n2) 对于流程图中的赋值操作符，你可以使用左箭头或右箭头。\n\
  3) 在程序执行期间，变量的内容可以改变。\n4) 在程序执行期间，常量的内容可以改变。\n5) 数值 10.0 是整数。\n6) 布尔变量只能持有两个值。\n\
  7) 包含在引号中的“10.0”是一个实数。\n8) 在计算机科学中，string 是你可以穿的东西！\n9) 变量名可以包含数字。\n10) 在程序执行期间，变量可以更改其名称。\n\
  11) 常量名不能是数字。\n12) 常量名应该是描述性的。\n13) `student` 不是一个有效的变量。\n14) `STUDENT_NAME` 是一个有效的常量名。\n\
  15) 在 Java 中，常量名可以包含大小写字母。\n16) 在 Java 中，你必须先声明变量才能使用。\n17) 在 Java 中，必须至少使用一个常量。\n\
  \n### 5.9 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n1) 变量是位于\na) 硬盘。\nb) DVD 光盘。\nc) USB 闪存。\n\
