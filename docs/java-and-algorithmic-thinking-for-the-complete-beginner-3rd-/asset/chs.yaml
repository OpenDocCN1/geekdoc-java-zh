  \n### 39.8 复习题：判断对错\n\n请判断以下每个陈述的对错。\n\n1) 在编写大型程序时，过程化编程优于面向对象编程。\n2) 面向对象编程关注对象。\n\
  3) 对象将数据和功能结合。\n4) 面向对象编程让你能够更容易维护代码，但你的代码无法被方便方便使用。\n5) 你可以在不使用类的情况下创建对象。\n6) 创建类的新实例的过程被称为“安装（installation）”。\n\
  7) 在面向对象编程中，你总是必须创建同一类的至少两个实例。\n8) 构造函数方法在实例化对象时执行。\n9) 当你创建同一类的两个实例时，该类的构造函数方法将执行两次。\n\
  10) 字段前的 `private` 关键字指定该字段可以从类外部访问。\n11) 方法前的 `public` 关键字指定该方法可以从类外部调用。\n12) 面向对象编程的原则规定，类的数据应该是隐藏的，并防止被意外修改。\n\
  13) Getter 和 setter 方法提供了一种读取、写入或计算字段值的灵活机制。\n14) Getter 和 setter 方法暴露了类的内部实现。\n\
  15) 类继承是面向对象编程（OOP）的核心概念之一。\n16) 当一个类被继承时，它被称为“派生类（derived class）”。\n17) 父类会自动继承子类的所有方法和字段。\n\
