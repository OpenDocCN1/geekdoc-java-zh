  }\n```\n\n### 练习题 12.1-3 在 Java 中编写复杂的数学表达式\n\n编写一个 Java 程序，计算以下数学表达式：\n\n![Image](img/chapter12-10.png)\n\
  \n假设用户仅为 `x`、`w` 和 `z` 输入正值。\n\n### 答案\n\n哎！现在表达式变得更复杂了！事实上，它复杂得多！让我们来看一种完全不同的方法。核心思想是将复杂的表达式分解为更小、简单的表达式，并将每个子结果赋值给临时变量。最后，你可以利用所有临时变量构建出原始表达式！这种方法如下。\n\
  \n![](img/my_exercise_header.png) Project_12.1-3\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    double denominator, nominator, temp1, temp2, temp3,\
  \ w, x, y, z;\nx = Double.parseDouble(cin.nextLine());\nw = Double.parseDouble(cin.nextLine());\n\
  z = Double.parseDouble(cin.nextLine());\ntemp1 = 3 * x * x + 5 * x + 2;\ntemp2 =\
  \ 7 * w + 1 / z;\ntemp3 = (3 + x) / 7;\nnominator = 5 * temp1 / temp2 + z;\ndenominator\
  \ = 4 * temp3;\ny = nominator / denominator;\n    System.out.println(\"The result\
  \ is: \" + y);\n}\n```\n\n你可能会说：“好吧，但我浪费了这么多变量，而且大家所知，每个变量都占用主内存的一部分。我如何用一行代码写出原始表达式并节省更多内存呢？”\n\
  \n这项工作对于高级程序员来说可能轻而易举，但对你呢？对新手程序员呢？\n\n下一个方法将帮助你编写最复杂的数学表达式而不会出现任何语法或逻辑错误！规则非常简单：“在将复杂表达式分解为更小、简单的表达式并将每个子结果赋值给临时变量后，从后往前，将每个变量替换为其赋值的表达式。但注意！当你将变量替换为赋值的表达式时，必须始终将该表达式括在括号内！”\n\
  \n困惑？别担心！操作起来更容易。让我们尝试重写之前的 Java 程序。从后往前，将变量 `nominator` 和 `denominator` 替换为它们赋值的表达式。结果是\n\
  \n![Image](img/chapter12-11.png)\n\n![](img/notice.jpg)注意额外的括号。\n\n现在你必须将变量 `temp1`、`temp2`\
  \ 和 `temp3` 替换为它们赋值的表达式，单行表达式就完成了！\n\n![Image](img/chapter12-12.png)\n\n最后看起来可能吓人，但并没有那么困难，对吧？\n\
  \nJava 程序现在可以重写为：\n\n![](img/my_exercise_header.png) Project_12.1-3b\n```java\n\
  public static void main(String[] args) throws Exception {\n    double w, x, y, z;\n\
  x = Double.parseDouble(cin.nextLine());\nw = Double.parseDouble(cin.nextLine());\n\
  z = Double.parseDouble(cin.nextLine());\n    y = (5 * (3 * x * x + 5 * x + 2) /\
  \ (7 * w + 1 / z) + z) / (4 * ((3 + x) / 7));\n    // 注意：逻辑遵循文本描述\n}\n```\n\n###\
