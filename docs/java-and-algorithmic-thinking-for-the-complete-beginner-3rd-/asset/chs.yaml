  \n# 第一部分：介绍性知识\n\n## 第 1 章：计算机如何工作\n\n### 1.1 引言\n\n在当今社会，几乎每项任务都需要使用计算机。在学校里，学生使用计算机搜索互联网并发送电子邮件。在工作中，人们使用它们制作演示文、分析数据并与客户交流。在家里，人们使用计算机玩游戏、社交网络聊天。当然，不要忘记像\
  \ iPhone 这样的智能手机。因为可以编程，它们可以执行许多任务。换句话说，计算机可以执行程序告诉它的任何工作。程序是计算机执行的一系列语句（通常称为指令或命令）。程序对于计算机是关重要的，因为没有程序，计算机就是一个什么做不了的机器。相反，程序员或软件开发者是设计、创建并经常测试程序的人。本书将向你介绍计算机编程的基础概念。\n\
  \n### 1.2 什么是硬件？\n\n硬件术语是指组成计算机的所有设备或组件。如果你打开过计算机或笔记本电脑的外壳，你可能见过它的许多组件，如处理器（`CPU`）、内存和硬盘。计算机不是一个设备，而是一个共同工作的设备系统。这里讨论了典型计算机系统的基本组件。\n\
  \n**处理器（CPU）**\n这是计算机执行程序中定义的所有任务的部分（基础算术、逻辑和输入输出操作）。\n\n**内存（RAM - 随机访问存储器）**\n\
  这是计算机存放程序（在执行期间）以及程序正在处理的数据区域。当你关闭计算机或拔掉电源插头时，存储在此类型内存中的所有程序和数据都会丢失。\n\n**内存（ROM\
  \ - 只读存储器）**\nROM 或只读存储器是一种特殊的内存，计算机只能读取（不能更改）。当计算机关闭时，存储在此类型内存中的所有程序和数据不会丢失。ROM\
  \ 通常包含制造商指令和一个被称为引导装加载程序的程序，其功能是在通电后启动计算机系统的运行。\n\n**辅助存储设备**\n这通常是硬盘或 `SSD`（固态硬盘），有时（但较少见）是\
  \ CD/DVD 驱动器。与内存（`RAM`）相比，这种类型的内存可以长时间保存数据，即使计算机没有电。然而，存储在此内存中的程序无法直接执行。它们必须被传输到速度得多的内存中；即主内存。\n\
  \n\n\n\n# 输入设备\n输入设备是指所有从外部世界收集数据并将其计算机以便进一步处理的设备。键盘、鼠标和麦克风都是输入设备。\n\n# 输出设备\n输出设备是指所有将数据输出到外部世界的设备。显示器（屏幕）和打印机都是输出设备。\n\
  \n## 1.3 什么是软件？\n计算机执行的一切都由软件控制。软件分为两类：系统软件和应用软件。\n\n- **系统软件**是控制和管理计算机基本运行的程序。例如，系统软件控制计算机的内部运行。它管理所有连接的设备，保存数据、加载数据并允许执行其他程序。系统软件的三大类型是：\n\
  \    - 操作系统。`Windows`、`Linux`、`macOS`、`Android` 和 `iOS` 都是操作系统的示例。\n    - 工具软件。这类软件通常操作系统一起安装，用于让计算机尽可能高效地运行。防病毒工具和备份工具被视为工具软件。\n\
  \    - 设备驱动程序。设备驱动程序控制连接到计算机的设备，例如鼠标或显卡。设备驱动程序是一个像翻译器的程序。它将操作系统的指令翻译成设备实际上可以理解的指令。\n\
  - **应用软件**指的是你用于日常任务的所有其他程序，如浏览器、文字处理软件、记事本、游戏等。\n\n## 1.4 计算机如何执行（运行）程序\n当你打开计算机时，主内存（`RAM`）是完全空的。计算机需要执行的第一件事是将操作系统从硬盘传输到主内存。\n\
  \n操作系统加载到主内存后，你就可以执行（运行）你喜欢的任何程序（应用软件）。这通常通过点击、双击或轻触程序对应的图标来实现。例如，假设你点击了你喜欢的文字处理器的图标。此操作命令你的计算机将文字处理程序从硬盘复制（或加载）到主内存（`RAM`），以便\
  \ `CPU` 执行它。\n\n![](img/remember.jpg)\n\n程序存储在硬盘等次级存储设备上。当你向计算机安装一个程序时，该程序会被复制到硬盘中。然后，当你执行一个程序时，程序会从硬盘复制（加载）到主内存（`RAM`），并执行该程序的副本。\n\
  \n![](img/notice.jpg)“运行”（run）和“执行”（execute）是同义词，可以相互替。\n\n## 1.5 编译器和解释器\n计算机可以执行用严格定义的计算机语言编写的程序。你不能使用英语或希腊语等自然语言编写程序，因为你的计算机无法听懂你！\n\
  \n但计算机实际上理解什么呢？计算机可以理解一种称为机器语言的特定底层语言。在机器语言中，所有的语句（或命令）都由零和组成。以下是用机器语言编写的程序示例，用于计算两个数字之和。\n\
  \n```\n0010 0001 0000 01000001 0001 0000 01010011 0001 0000 01100111 0000 0000 0001\n\
  ```\n\n感到惊讶？别担心，你不会用这种方式编写程序的。希望现在没人这样写计算机程序了。如今，所有的程序员都用高级语言编写程序，然后他们使用特殊的程序将它们翻译成机器语言。\n\
  \n![](img/notice.jpg)高级语言是一种不限于特定类型计算机的语言。\n\n程序员用于翻译的程序有两种：编译器和解释器。\n\n- **编译器**是将用高级语言编写的语句翻译成独立的机器语言程序的程序。然后你可以在任何需要的时间执行该机器语言程序。翻译完成后，除非你修改了高级语言程序，否则不需要再次运行编译器。\n\
  - **解释器**是一个同时翻译并执行用高级语言编写的语句的程序。当解释器读取高级语言程序中的每条单独语句时，它将其翻译成机器语言代码并直接执行。这个过程对程序中的每条语句都会重复。\n\
  \n## 1.6 什么是源代码？\n程序员在高级语言中编写的语句（通常称为指令或命令）被称为源代码或简单称为代码。程序员首先将源代码输入到称为代码编辑器的程序中，然后使用编译器将其翻译成机器语言程序，或者使用解释器同时进行翻译和执行。\n\
  \n![](img/notice.jpg)虽然在现在看来似乎不寻常，但使用简单的文本编辑器编写程序是完全可能的！\n\n## 1.7 复习题：判断题\n请判断以下每个陈述的对错。\n\
  \n1) 现代计算机之所以能够执行如此许多不同的任务，是因为它们具有被编程的能力。\n2) 计算机可以在没有程序的情况下运行。\n3) 硬盘是硬件的一个示例。\n\
  4) 数据可以长时间存储在主内存（`RAM`）中，即使计算机没有供电。\n5) 数据存储在主内存（`RAM`）中，但程序不是。\n6) 扬声器输出设备的示例。\n\
  7) `Windows` 和 `Linux` 是软件的示例。\n8) 设备驱动程序是硬件的示例。\n9) 媒体播放器是系统软件的示例。\n10) 当你打开计算机时，主内存（`RAM`）包含了操作系统。\n\
  11) 当你打开文字处理应用程序时，它是从次级存储设备复制到主内存（`RAM`）的。\n12) 在机器语言中，所有的语句（命令）都是零和的序列。\n13) 如今，计算机无法理解零和。\n\
  14) 如今，软件是用零和一编写的。\n15) 软件指的是计算机的物理组件。\n\n16) 编译器和解释器是软件。\n17) 编译器将源代码翻译成执行文件。\n\
  18) 解释器创建机器语言程序。\n19) 考虑到程序可能会被多次执行，在通过解释器翻译并执行一次后，解释器就不再被需要了。\n20) 源代码可以使用简单的文本编辑器编写。\n\
  21) 源代码可以在不编译或解释的情况下由计算机执行。\n22) 用机器语言编写的程序需要编译（翻译）。\n23) 编译器翻译用高级语言编写的程序。\n\n##\
  \ 1.8 复习题：单选题\n请为以下每个陈述选择正确答案。\n\n\n\n\n\n1) 以下哪一项不是计算机硬件？\n   a) 硬盘\n   b) DVD\
  \ 光盘\n   c) 声卡\n   d) 主内存 (RAM)\n\n2) 以下哪一项不是次级存储设备？\n   a) DVD 读写器设备\n   b) 固态硬盘\
  \ (SSD)\n   c) USB 闪盘\n   d) RAM\n\n3) 下面哪些操作不能由 CPU 执行？\n   a) 将数据传输到主内存 (RAM)。\n\
  \   b) 从主内存 (RAM)传输数据。\n   c) 执行算术运算。\n   d) 手术操作。\n\n4) 触摸屏是\n   a) 一个输入设备。\n \
  \  b) 一个输出设备。\n   c) 以上皆是\n\n5) 以下哪一项不是软件？\n   a) Windows\n   b) Linux\n   c) iOS\n\
  \   d) 视频游戏\n   e) 网页浏览器\n   f) 以上均为软件。\n\n6) 下述哪个陈述是正确的？\n   a) 程序存储在硬盘上。\n   b)\
  \ 程序存储在 USB 闪盘上。\n   c) 程序存储在主内存 (RAM)中。\n   d) 以上均正确。\n\n7) 下述哪个陈述是正确的？\n   a)\
  \ 程序直接从硬盘执行。\n   b) 程序直接从 DVD 光盘执行。\n   c) 程序直接从主内存 (RAM)执行。\n   d) 以上均正确。\n   e)\
  \ 以上都不正确。\n\n8) 程序员无法用以下语言编写计算机程序：\n   a) 机器语言。\n   b) 自然语言，如英语、希腊语等。\n   c) Java。\n\
  \n9) 编译器会将\n   a) 用机器语言编写的程序翻译成高级语言程序。\n   b) 用自然语言（英语、希腊语等）编写的程序翻译成机器语言程序。\n  \
  \ c) 用高级计算机语言编写的程序翻译成机器语言程序。\n   d) 以上都不是\n   e) 以上都是\n\n10) 机器语言是\n    a) 机器之间相互通信的语言。\n\
  \    b) 一种由数值指令组成、计算机直接使用的语言。\n    c) 一种使用英语单词进行操作的语言。\n\n11) 在用高级计算机语言编写的程序中，如果两个相同的语句连续出现，解释器会\n\
  \    a) 翻译第一个并执行它，然后翻译第二个并执行它。\n    b) 先翻译第一个，再翻译第二个，然后同时执行它们两个。\n    c) 仅翻译第一个（因为它们是相同的），然后执行它两次。\n\
  \n## 第 2 章\n\n## Java 与集成开发环境\n\n### 2.1 什么是 Java？\n\nJava 是一种广泛使用的通用型、高级计算机编程语言，它允许程序员创建桌面应用或移动应用程序、网页以及许多其他类型的软件。它的设计目的是让程序员实现“一次编写，随运行\
  \ (WORA)”，这意味着代码编写一次即可在任何硬件和操作系统的组合上运行，无需重新编译。\n\n### 2.2 脚本和程序之间有什么区别？\n\n从技术上来说，脚本是解释执行的，而程序是编译执行的，但这实际上并不是它们的主要区别。它们之间还有另一个更重要的区别！\n\
  \n使用 `JavaScript` 或 `VBA`（应用程序 Visual Basic）等脚本语言编写的脚本的主要目的是控制另一个应用程序。因此你可以说，在某些方面，`JavaScript`\
  \ 控制网页浏览器，而 `VBA` 控制 Microsoft® Office 应用程序（如 `MS Word` 或 `MS Excel`）。\n\n另一方面，使用\
  \ `Java`、`C++` 或 `C#`（仅举几个）等编程语言编写的程序独立于任何其他应用程序执行。程序在用户需要的任何时候作为独立程序执行，不需要托管应用程序。\n\
  \n![](img/notice.jpg)Microsoft Office 的宏是用 `VBA` 编写的脚本。它们的目的是自动化 Microsoft Office\
  \ 内的某些功能。\n\n![](img/notice.jpg)许多人认为 `JavaScript` 是 `Java` 的简化版，但实际上名称上的相似仅仅是巧合。\n\
  \n![](img/remember.jpg)脚本不能独立执行。它需要一个托管应用程序才能执行。\n\n### 2.3 为什么你应该学习 Java\n\nJava\
  \ 是所谓的“高级”计算机语言。Java 的编码风格与 `C` 语言相似。它非常易懂，并且在 `Windows`、`Android`、`Linux` 和 `Unix`\
  \ 等多个平台上效率极高。Java 是一种灵活且强大的语言，非常适合开发游戏、网络应用程序、桌面应用或移动应用。\n\nJava 无处不在！它存在于桌面电脑、笔记本电脑、数据中心、移动设备和游戏机中。超过\
  \ 90 亿部手机、大多数计算机以及超过 10 亿台设备正在运行 Java。Java 的无处可见使得它非常适合开发各种令人兴奋的应用和服务。\n\n![](img/notice.jpg)Android\
  \ 应用大多用 Java 编写！\n\n### 2.4 Java 如何工作\n\n计算机不理解英语或希腊语等自然语言，因此你需要一种像 Java 这样的计算机语言来与它们通信。Java\
  \ 是一种非常强大的高级语言。\n\n在过去，计算机语言使用解释器或编译器。而现在，许多语言同时使用编译器和解释器。Java 将语言转换为计算机可以理解的语言，这种语言被称为“字节码”。Java\
  \ 编译器将语句转换为字节码并存在 `.class` 文件中。随后，当用户执行该文件时，Java 虚拟机 (JVM)——实际上是编译器和解释器的结合——读取 `.class`\
  \ 文件并最初进行解释。在解释过程中，`JVM` 会监控频繁执行的字节码并将其翻译（编译）成机器码以便直接执行。\n\n![](img/notice.jpg)Java\
  \ 字节码是由虚拟机执行的。\n\n![](img/notice.jpg)有些语言不是使用编译器和解释器，而是使用两个编译器。例如在 `C#` 中，第一个编译器将\
  \ C# 语句翻译成一种称为通用中间语言 (`CIL`) 的中间语言。`CIL` 代码存储在磁盘上的执行文件中，通常后缀名为 `.exe`。随后，当用户执行该文件时，`.NET\
  \ Framework` 执行即时编译 (`JIT`)，将 `CIL` 代码转换为机器码。\n\n在图 2-1 中，你可以看到用 Java 编写的语句是如何编译成字节码的，以及字节码随后是如何通过\
  \ Java 虚拟机 (JVM) 执行的。\n\n.\n\n现在出现了一些合理的问题：为什么要这么麻烦？为什么 Java 和其他语言（如 `C#`）要翻译两次？为什么\
  \ Java 语句不直接翻译成低级机器码？答案在于 Java 被设计成一种平台无关的编程语言。这意味着程序编写一次，即可在任何设备上运行，只要该设备安装了相应版本的\
  \ Java 即可。在过去，程序必须为每个计算机平台重新编译，甚至重写。Java 的最大优势之一就是你只需要编写和编译一次程序！在图 2-2 中，你可以看到用\
  \ Java 编写的语句是如何编译成字节码的，以及字节码随后如何在任何安装了相应 Java 虚拟机 (JVM) 的平台上执行。\n\n\n\n\n\n![](img/notice.jpg)某些平台提供了\
  \ Java 的直接硬件支持；某些微控制器可以直接在硬件上运行 Java，而不是使用软件版本的 Java 虚拟机。许多手机使用基于 ARM 的处理器（CPU），这些处理器具有直接执行\
  \ Java 字节码的硬件支持。\n\n要编写和执行 Java 程序，你需要安装两个软件应用程序：Java 开发工具包 (`JDK`）和集成开发环境（IDE`）。`IDE`\
  \ 是编写 Java 程序所必需，而 `JDK` 是执行和调试程序所需的。\n\n## 2.5 Java 开发工具包 (JDK)\n\nJava 开发工具包 (`JDK`)\
  \ 是一个免费的开发包，用于使用 Java 编程语言开发游戏、桌面、移动或 Web 应用。`JDK` 提供了创建、编译和运行 Java 应用所需的所有内容，包括\
  \ Java 运行环境 (`JRE`）、解释器/加载器 (`Java`）、编译器 (`javac`）、归档器 (`jar`）以及 Java 开发所需的其他工具。\n\
  \n`JDK` 是 Java 开发者必不可少的工具，可以安装在 Windows、Linux 和 macOS 等平台上。\n\n## 2.6 集成开发环境\n\n\
  集成开发环境（或 `IDE`）是一种软件，包含了程序员编写和测试程序所需的所有基础工具。`IDE` 通常包含一个源代码编辑器，并集成了编译器或解释器等工具，以及调试器。`Visual\
  \ Studio Code` 就是 `IDE` 的示例，它允许程序员编写、执行和调试他们的源代码。\n\n![](img/notice.jpg)“调试器”是一种帮助程序员发现并纠正许多错误的工具。\n\
  \n## 2.7 Microsoft Visual Studio\n\nMicrosoft Visual Studio 是一个集成开发环境 (`IDE`)，它为许多编程语言（通过单独安装的扩展）提供了一套强大的工具，并让你轻松创建适用于\
  \ Android、iOS、macOS、Windows 和云端的应用程序以及网站、Web 应用和 Web 服务。\n\nVisual Studio 不仅仅是一个文本编辑器。它可以缩进行、匹配单词和括号，并高亮显示编写错误的源代码。它还提供自动代码提示\
  \ (`IntelliSense®`)，这意味着当你输入时，它会显示可能的补全列表。`IDE` 还会提供提示帮助你分析代码并发现任何潜在问题。它甚至会建议一些简单的解决方案来修复这些问题。你不仅可以使用\
  \ Visual Studio 编写程序，还可以直接从 `IDE` 执行和调试你的程序。\n\nVisual Studio 在全球范围内拥有庞大的用户社区，这就是为什么它有许多不同的版本。具体来说，在微软的下载页面你可以下载：\n\
  \n► Visual Studio（社区版、专业版或企业版），运行在 Windows 上\n► Visual Studio for Mac，运行在 macOS\
  \ 上\n► Visual Studio Code，运行在 Windows、macOS 和 Linux 上\n\n在下一章 (第 3 章) 中，你将找到相关链接，引导你在\
  \ Windows 或 Linux 上安装和配置计算机所需的内容，例如 `JDK` 和 `Visual Studio Code`。然后，在 第 9 章，你将发现关于如何使用\
  \ `Visual Studio Code` 编写、执行和调试 Java 程序的指导。这些说明可以在我的网站上找到。此外，你还将在那里发现许多技巧，这对你作为初学编程者的起非常有价值！\n\
