  \ 什么是面向对象编程？\n\n在 `Part VII` 中，你读过或甚至编写的所有程序都在使用子程序（`methods` 和 `void methods`）。这种编程风格被称为过程化编程，在大多数情况下它是没问题的！但当涉及到编写大型程序，或者在微软、Facebook\
  \ 或 Google 这样的大公司工作时，面向对象编程是必须使用的编程风格！\n\n面向对象编程通常称为 `OOP`，是一种以对象为核心的编程风格。在 `OOP`\
  \ 中，数据和功能被结合并封装在一个名为 `object`（对象）的东西内部。应用面向对象编程原则能够让你更轻松地维护代码，并编写出他人易于理解和使用的代码。\n\
  \n“OOP 侧重于对象”这句话真正是什么意思？让我们考虑一个现实世界中的例子。想象一辆车。你会描述一辆特定的车？它有特定的属性，例如品牌、型号、颜色和车牌。此外，这辆车还可以执行或曾经执行过特定的动作。例如，有人可以启动或关闭它、加速或刹车或停车。\n\
  \n在 `OOP` 中，这辆车可以表示为一个 `object`，它具有特定的属性（通常称为 `fields` 字段），并可以执行特定的动作（称为 `methods`\
  \ 方法）。\n\n显然，你现在可能在问自己：“我最初如何创建对象呢？”答案很简单！你只需要一个 `class`（类）。`class` 就像一个“橡皮印章”！在图\
  \ 39-1 中有一个印章（这就是 `class`），它有四个空字段和三个动作（`methods`）。\n\n![Image](img/chapter39-01.png)\n\
  \n图 39-1 类类似于一个“橡皮印章”\n\n使用这个印章的人可以盖出很多辆汽车（这些就是 `objects`）。在图 39-2 中，例如，一个小男孩盖出了那辆汽车，然后给它们上了色，并用每辆车的字段填充了特定的属性。\n\
  \n![Image](img/chapter39-02.png)\n\n图 39-2 你可以使用同一个橡皮印章作为模板来盖出很多辆汽车\n\n创建新对象（`class`\
  \ 的新实例）的过程被称为“实例化”（instantiation）。\n\n`class` 是一个模板，每个 `object` 都是由 `class` 创建的。每个\
  \ `class` 都应该设计为执行一个且仅一个任务！这就是为什么在大多数情况下，会使用多个 `class` 来构建整个应用程序的原因！\n\n在 `OOP`\
  \ 中，橡皮印章就是 `class`。你可以使用同一个 `class` 作为模板来创建（实例化）许多 `objects`！\n\n### 39.2 Java 中的类和对象\n\
  \n现在你已经掌握了 `classes` 和 `objects` 背后的理论概念，让我们深入到 Java 中编写一个真实的 `class` 吧！下面的代码片段创建了\
  \ `Car` 类。`class` 中有四个字段和三个方法。\n\n```java\nclass Car {\n    // 定义四个字段（属性）\n    public\
  \ String brand = \"\";\n    public String model = \"\";\n    public String color\
  \ = \"\";\n    public String licensePlate = \"\";\n    // 定义方法 turnOn()\n    public\
  \ void turnOn() {\n        System.out.println(\"The car turns on\");\n    }\n  \
  \  // 定义方法 turnOff()\n    public void turnOff() {\n        System.out.println(\"\
  The car turns off\");\n    }\n\n    // 定义方法 accelerate()\n    public void accelerate()\
  \ {\n        System.out.println(\"The car accelerates\");\n    }\n}\n```\n\n这里有一个有趣的知识：`classes`\
  \ 内部的 `Fields` 和 `methods`。`classes` 内部的 `Fields` 和 `methods` 本质上是普通的变量。`class`\
  \ 内部的 `Fields` 和 `methods` 是一个模板。`public` 关键字说明该 `field` 或 `method` 可以从 `class`\
  \ 外部访问。`class` 的名称应遵循 `Upper Case`（大驼命名法）约定。在 `Section 5.4` 中，创建 `objects`（即 `class`\
  \ 的实例）需要以下两行代码：\n\n```java\nCar car1 = new Car();\nCar car2 = new Car();\n```\n\n\
  当你创建一个新的 `object`（`class` 的新实例）时，这个过程被称为“实例化”。\n\n`object` 是 `class` 的实例。`objects`\
  \ 是 `class` 的实例。要创建 `objects`，使用点符号跟跟你想要访问的 `field` 或 `method`。一旦你创建（实例化）了 `objects`，就可以使用点符号为它们的\
  \ `fields` 赋值。这意味着你需要写出 `object` 的名称。\n\n在之前的例子中，`car1` 和 `car2` 是同一个 `class` 的两个实例。使用点符号\
  \ `car1` 和 `car2` 允许你每次引用一个实例。如果你对其中一个实例进行任何更改，都不会影响另一个实例。\n\n在 `OOP` 中，橡皮印章是 `class`。你可以使用同一个\
  \ `class` 作为模板来创建（实例化）许多 `objects`！\n\n### 39.3 构造方法和 this 关键字\n\n在 Java 中，有一种方法具有特殊角色，被称为构造方法（constructor）。每当创建一个\
  \ `class` 的实例（一个 `object`）时，`constructor` 方法都会自动执行。你想对 `object` 进行的任何初始化都可以在此方法中完成。在\
  \ Java 中，`constructor` 方法的名称与其 `class` 的名称相同。\n\n看看下面的例子。构造方法 `Person()` 会被自动调用两次，一次是在创建对象\
  \ `p1` 时，一次是在创建对象 `p2` 时，这意味着“An object was created”被显示了两次。\n\n![](img/my_exercise_header.png)\
  \ Project_39.3a\n\n```java\nclass Person {\n    // 定义构造方法\n    public Person() {\n\
  \        System.out.println(\"An object was created\");\n    }\n}\n```\n\n\n\n\n\
  ```java\nSystem.out.println(\"An object was created\");\n```\n\n```java\npublic\
  \ class App {\n    public static void main(String[] args) throws Exception {\n \
  \       Person p1 = new Person();\n        Person p2 = new Person();\n    }\n}\n\
  ```\n\n![](img/notice.jpg)注意，构造方法名称名前面没有 `void` 关键字。\n\n在 Java 的面向对象编程 (OOP) 中，有一个名为\
  \ `this` 的关键字，它用作指向当前对象的引用变量。看下面的示例。\n\n![](img/my_exercise_header.png) Project_39.3b\n\
  ```java\nclass Person {\n    public String name;\n    public int age;\n    //定义构造方法\n\
  \    public Person() {\n        System.out.println(\"An object was created\");\n\
  \    }\n    public void sayInfo() {\n        System.out.println(\"I am \" + this.name);\n\
  \        System.out.println(\"I am \" + this.age + \" years old\");\n    }\n}\n\
  public class App {\n    public static void main(String[] args) throws Exception\
  \ {\n        Person person1 = new Person();\n        //给其字段赋值\n        person1.name\
  \ = \"John\";\n        person1.age = 14;\n        person1.sayInfo();   //调用对象 person1\
  \ 的 sayInfo() 方法\n    }\n}\n```\n\n![](img/notice.jpg)注意，在方法外部（但类内部）声明字段 `name`\
  \ 和 `age` 时，你不需要使用点符号表示法写字段名。然而，从方法内部访问字段时，应该使用点符号表示法（例如 `this.name` 和 `this.age`）。\n\
  \n你现在脑海中可能正在旋转的问题是：“为什么在 `sayInfo()` 方法内部必须将这些字段 `name` 和 `age` 引用为 `this.name`\
  \ 和 `this.age`？真的必要在它们前面使用 `this` 关键字吗？”一个简单的答案是，方法内部始终存在两个同名额外局部变量（`name` 和 `age`）的可能性。因此你需要一种方法来区分这些局部变量和对象的字段。如果你感到困惑，请尝试理解以下示例。在\
  \ `MyClass` 类中有一个字段 `b`，在该类的 `myMethod()` 方法中有一个局部变量 `b`。`this` 关键字用于区分局部变量和字段。\n\
  \n![](img/my_exercise_header.png) Project_39.3c\n```java\nclass FooClass {\n   \
  \ public String b;   //这是一个字段\n    public void myMethod() {\n        String b =\
  \ \" *** \";  //这是一个局部变量\n        System.out.println(b + this.b + b);\n    }\n}\n\
  public class App {\n    public static void main(String[] args) throws Exception\
  \ {\n        MyClass x = new FooClass();    //创建对象 x\n        x.b = \"Hello!\";\
  \   //给其字段赋值\n        x.myMethod();     //它显示: *** Hello! ***\n    }\n}\n```\n\n\
  ![](img/notice.jpg)`this` 关键字可以从类的方法内部引用该类的任何成员（字段或方法）。\n\n### 39.4 向构造方法传递初始值\n\
  \n任何方法，即使是构造方法，都可以在其形式参数列表中包含形式参数。例如，在构造方法中，你可以使用参数在创建期间向对象传递一些初始值。接下来的示例创建了四个对象，每个对象代表希腊神话中的一个泰坦。\n\
  \n![](img/my_exercise_header.png) Project_39.4\n```java\nclass Titan {\n    public\
  \ String name;\n    public String gender;\n    //定义构造方法\n    public Titan(String\
  \ n, String g) {\n        this.name = n;\n        this.gender = g;\n    }\n}\npublic\
  \ class App {\n    public static void main(String[] args) throws Exception {\n \
  \       Titan titan1 = new Titan(\"Cronus\", \"male\");\n        Titan titan2 =\
  \ new Titan(\"Oceanus\", \"male\");\n        Titan titan3 = new Titan(\"Rhea\",\
  \ \"female\");\n        Titan titan4 = new Titan(\"Phoebe\", \"female\");\n    }\n\
  }\n```\n\n在 Java 中，拥有同名的一个字段和一个局部变量（甚至可以一个形式参数）是合法的。因此，`Titan` 类也可以写成：\n\n```java\n\
  class Titan {\n    public String name;\n    public String gender;\n    //定义构造方法\n\
  \    public Titan(String name, String gender) {\n        this.name = name;     //字段和参数可以具有相同的名称\n\
  \        this.gender = gender;\n    }\n}\n```\n\n变量 `name` 和 `gender` 是用于向构造方法传递值的参数，而\
  \ `this.name` 和 `this.gender` 是用于在对象内部存储值的字段。\n\n#### 练习 39.4-1 历史事件\n\n执行以下操作：\n\
