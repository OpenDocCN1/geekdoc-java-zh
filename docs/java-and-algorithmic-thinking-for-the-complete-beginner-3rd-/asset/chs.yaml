  \ j++) {\n        if (average[j] > 89) {\n            System.out.println(average[j]);\n\
  \        }\n    }\n}\n```\n\n#### 第二种方法 – 直接找到并显示即可！\n\n这种方法不使用辅助数组；它只计算并直接显示所有大于\
  \ 89 的平均值。Java 程序如下。\n\n![](img/my_exercise_header.png) Project_33.3-1b\n```java\n\
  static final int STUDENTS = 10;\nstatic final int LESSONS = 5;\npublic static void\
