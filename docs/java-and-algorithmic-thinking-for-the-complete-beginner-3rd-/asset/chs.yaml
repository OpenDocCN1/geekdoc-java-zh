  1) 多分支决策结构用于扩展备方案的数量。\n2) 多分支决策结构最多可以三个备方案。\n3) 在多分支决策结构中，一旦一个 `Boolean` 表达式求值为为\
  \ `true`，下一个 `Boolean` 表达式也会被求值。\n4) 在多分支决策结构中，最后一条语句或语句块 `N+1`（出现在 `else` 关键字下方）始终会被执行。\n\
  5) 在多分支决策结构中，当之前的 `Boolean` 表达式中至少有一个求值为为 `true` 时，最后一条语句或语句块 `N+1`（出现在 `else` 关键字下方）才会被执行。\n\
  6) 在多分支决策结构中，最后一条语句或语句块 `N+1`（以及由此延伸的 `else` 关键字）可以省略。\n7) 在以下代码段中，只有当变量 `a` 包含除\
