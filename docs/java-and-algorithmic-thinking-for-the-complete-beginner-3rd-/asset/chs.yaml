  \ + \" California\");`\n\n## 第 8 章\n\n## 追踪表 (Trace Tables)\n\n### 8.1 什么是追踪表？\n\
  \n追踪表是一种用于测试算法或计算机程序的技巧，用以检测算法或程序执行过程中出现的逻辑错误。\n\n追踪表模拟了执行流。语句逐条执行，随着赋值语句的执行，变量的值会发生变化。\n\
  \n追踪表对于教学目的很有用。它们通常由初级程序员使用，帮助他们视觉化特定算法或程序的工作原理，并协助他们检测逻辑错误。\n\n这里有一个典型的追踪表。\n\n\
  | 步骤 | 语句 | 备注 | variable1 | variable2 | variable3 |\n| --- | --- | --- | --- |\
  \ --- | --- |\n| 1 | | | | | |\n| 2 | | | | | |\n| … | | | | | |\n\n让我们来看看追踪表是如何运作的！对于以下\
  \ Java 程序，创建一个追踪表来确定每一步的变量值。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {int x, y, z;x = 10;y = 15;z = x * y;z++;println(z);}\n```\n\n\
  该程序的追踪表如下所示。备注是可选的，但它们有助于读者更好地理解发生了什么。\n\n| 步骤 | 语句 | 备注 | x | y | z |\n| --- |\
  \ --- | --- | --- | --- | --- |\n| 1 | x = 10 | 将 10 赋值给 x。 | 10 | ? | ? |\n| 2\
  \ | y = 15 | 将 15 赋值给 y。 | 10 | 15 | ? |\n| 3 | z = x * y | 将 x * y 的乘积赋值给 z。 |\
  \ 10 | 15 | 150 |\n| 4 | z++ | z 增一。 | 10 | 15 | 151 |\n| 5 | println(z) | 显示：151。\
  \ | | | |\n\n#### 练习 8.1-1 创建追踪表\n\n创建一个追踪表来确定两种执行情况下 Java 程序每一步的变量值。输入值为：(i) 0.3\
  \ 和 (ii) 4.5。\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {double a, b, c;b = Double.parseDouble(nextLine());c = 3;c = c * b;a = 10 * c;a\
  \ = a % 10;println(a);}\n```\n\n### 解答\n\ni) 对于输入值 0.3，追踪表如下：\n\n| 步骤 | 语句 | 备注\
  \ | a | b | c |\n| --- | --- | --- | --- | --- | --- |\n| 1 | b = Double.parseD\
  \ | 输入值 0.3。 | ? | 0.3 | ? |\n| 2 | c = 3 | | ? | 0.3 | 3.0 |\n| 3 | c = c * b |\
  \ | ? | 0.3 | 0.9 |\n| 4 | a = 10 * c | | 9.0 | 0.3 | 0.9 |\n| 5 | a = a % 10 |\
  \ | 9.0 | 0.3 | 0.9 |\n| 6 | println(a) | 显示：9.0。 | | | |\n\nii) 对于输入值 4.5，追踪表如下：\n\
  \n| 步骤 | 语句 | 备注 | a | b | c |\n| --- | --- | --- | --- | --- | --- |\n| 1 | b =\
  \ Double.parseD | 输入值 4.5。 | ? | 4.5 | ? |\n| 2 | c = 3 | | ? | 4.5 | 3.0 |\n| 3\
  \ | c = c * b | | ? | 4.5 | 13.5 |\n| 4 | a = 10 * c | | 135.0 | 4.5 | 13.5 |\n\
  | 5 | a = a % 10 | | 5.0 | 4.5 | 13.5 |\n| 6 | println(a) | 显示：5.0。 | | | |\n\n\
  #### 练习 8.1-2 创建追踪表\n\n执行以下程序时会显示什么结果？\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {String Ugly, Beautiful, Handsome;Ugly = \"Beautiful\"\
  ;Beautiful = \"Ugly\";Handsome = Ugly;println(\"Beautiful\");println(Ugly);println(Handsome);}\n\
  ```\n\n### 解答\n\n让我们创建一个追踪表来找到输出。\n\n| 步骤 | 语句 | 备注 | Ugly | Beautiful | Handsome\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 1 | Ugly = \"Beautiful\" | 将字符串 \"\
  Beautiful\" 赋值给变量 Ugly。 | Beautiful | ? | ? |\n| 2 | Beautiful = \"Ugly\" | 将字符串\
  \ \"Ugly\" 赋值给变量 Beautiful。 | Beautiful | Ugly | ? |\n| 3 | Handsome = Ugly | 将变量\
  \ Ugly 的值赋值给变量 Handsome。 | Beautiful | Ugly | Beautiful |\n| 4 | println(\"Beautiful\"\
  ) | 显示：Beautiful | | | |\n| 5 | println(Ugly) | 显示：Beautiful | | | |\n| 6 | println(Handsome)\
  \ | 显示：Beautiful | | | |\n\n#### 练习 8.1-3 交换变量的值\n\n编写一个 Java 程序，让用户在变量 `a` 和 `b`\
  \ 中输入两个值。在程序结束时，两个变量必须交换值。例如，如果变量 `a` 和 `b` 分别包含 5 和 7，在交换值后，变量 `a` 必须包含 7，而变量 `b`\
  \ 必须包含 5！\n\n### 解答\n\n以下代码片段虽然看起来正确，但是错误的，并且并没有真正交换 `a` 和 `b` 的值！\n\n```java\n\
  int a, b;a = Integer.parseInt(nextLine());b = Integer.parseInt(nextLine());a = b;b\
  \ = a;println(a);println(b);\n```\n\n让我们来看看！假设用户输入两个值：5 和 7。追踪表如下。\n\n| 步骤 | 语句\
  \ | 备注 | a | b |\n| --- | --- | --- | --- | --- |\n| 1 | a = Integer.parseI | 输入值\
  \ 5。 | 5 | ? |\n| 2 | b = Integer.parseI | 输入值 7。 | 5 | 7 |\n| 3 | a = b | 将变量 b\
  \ 的值赋值给 a。值 5 丢失了！ | 7 | 7 |\n| 4 | b = a | 将变量 a 的值赋值给 b。 | 7 | 7 |\n| 5 | println(a)\
  \ | 显示：7。 | | |\n| 6 | println(b) | 显示：7。 | | |\n\n哎！5 在哪儿？\n\n解决方案并没有那么简单。那么，到底如何交换值呢？考虑两个杯子：一杯橙汁（称为\
  \ `glass A`）和一杯柠檬汁（称为 `glass B`）。如果你想交换它们的内容，你只需要找到并使用一个额外的杯子（称为 `glass C`）。\n\n\
  ![Image](img/chapter08-01.png)\n\n必须遵循的步骤：\n\n1)将 `glass A`（橙汁）倒入 `glass C`。\n\n\
  ![Image](img/chapter08-02.png)\n2)将 `glass B`（柠檬汁）倒入 `glass A`。\n\n![Image](img/chapter08-03.png)\n\
  3)将 `glass C`（橙汁）倒入 `glass B`。\n\n![Image](img/chapter08-04.png)\n\n交换成功！\n\n你可以按照相同的步骤在\
  \ Java 中交换两个变量的内容。\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {int a, b, c;a = Integer.parseInt(nextLine());b = Integer.parseInt(nextLine());c\
  \ = a;   //将杯 A（橙汁）的内容倒入杯 Ca = b;   //将杯 B（柠檬汁）的内容倒入杯 Ab = c;   //将杯 C（橙汁）的内容倒入杯\
  \ Bprintln(a);println(b);}\n```\n\n![](img/remember.jpg)双斜杠（ // ）后面的文本被视为注释，永远不会被执行。\n\
  \n\n\n\n编写一个 Java 程序，允许用户输入两个整数值并存储在变量 `a` 和 `b` 中。最后，这两个变量必须交换它们的值。然后，使用输入值为 `5`\
  \ 和 `7` 的追踪表（trace table）来确认代码的正确性。\n\n## 解决方案\n\n由于变量包含数值，可以使用以下 Java 程序（作为另一种方法）。\n\
  \n```java\npublic static void main(String[] args) throws Exception {int a, b;a =\
  \ Integer.parseInt(cin.nextLine());b = Integer.parseInt(cin.nextLine());a = a +\
  \ b;b = a - b;a = a - b;System.out.println(a + \" \" + b);}\n```\n\n现在让我们使用输入值为\
  \ `5` 和 `7` 的追踪表来确认变量 `a` 和 `b` 是否正确交换了内容。\n\n| 步骤 | 语句 | 注释 | a | b |\n| --- |\
  \ --- | --- | --- | --- |\n| 1 | `a = Integer.parseI…` | 用户输入值 5 | 5 | ? |\n| 2\
  \ | `b = Integer.parseI…` | 用户输入值 7 | 5 | 7 |\n| 3 | `a = a + b` | | 12 | 7 |\n\
  | 4 | `b = a ‑ b` | | 12 | 5 |\n| 5 | `a = a ‑ b` | | 7 | 5 |\n| 6 | `.println(a\
  \ + \" \" + b)` | 显示为：7 5 | | |\n\n![](img/notice.jpg)这种方法的缺点是它不能交换字母数字型变量（字符串）的内容。\n\
  \n## 8.2 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\n1) 追踪表是一种用于测试计算机的技术。\n2) 追踪表可以帮助程序员在计算机程序中找到错误。\n\
  3) 在不先创建相应的追踪表的情况下，你无法执行计算机程序。\n4) 为了交换两个整数变量的值，你总是需要一个额外的变量。\n\n## 8.3 复习练习\n\n\
  完成以下练习。\n\n1) 创建一个追踪表，确定当输入值为 `3` 时，Java 程序在每一步中变量的值。\n```java\npublic static void\
  \ main(String[] args) throws Exception {double a, b, c, d;a = Double.parseDouble(cin.nextLine());b\
  \ = a + 10;a = b * (a - 3);c = 3 * b / 6;d = c * c;d--;System.out.println(d);}\n\
  ```\n\n2) 创建一个追踪表，确定 Java 程序在三次不同执行中每一步中变量的值。\n\n三次执行的输入值为：(i) `3`，(ii) `4` 和 (iii)\
  \ `1`。\n\n```java\npublic static void main(String[] args) throws Exception {int\
  \ a, b, c, d;a = Integer.parseInt(cin.nextLine());a = (a + 1) * (a + 1) + 6 / 3\
  \ * 2 + 20;b = a % 13;c = b % 7;d = a * b * c;System.out.println(a + \", \" + b\
  \ + \", \" + c + \", \" + d);}\n```\n\n3) 创建一个追踪表，确定 Java 程序在两次不同执行中每一步中变量的值。\n\n\
  两次执行的输入值为：(i) `8, 4`；(ii) `4, 4`。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {int a, b, c, d, e;a = Integer.parseInt(cin.nextLine());b = Integer.parseInt(cin.nextLine());c\
  \ = a + b;d = 1 + a / b * c + 2;e = c + d;c += d + e;e--;d -= c + d % c;System.out.println(c\
  \ + \", \" + d + \", \" + e);}\n```\n\n## 第 9 章\n\n## 使用 Visual Studio Code\n\n\
