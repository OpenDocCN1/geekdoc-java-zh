  ### 31.8 什么是 HashMap？\n\n在计算机科学中，哈希表（hashmap）和数组之间的主要区别在于，哈希表的元素可以使用键（key）唯一标识，而不一定非要是整数值。哈希表的每个键都与一个元素关联（如果你愿意的话，也可以称为映射）。哈希表的键类型可以是\
  \ `String`、`int`、`double` 等等。\n\n下面的示例展示了一个包含家庭成员名称的哈希表。该哈希表的名称为 `family`，对应的键写在每个元素上方。\n\
  \n![Image](img/chapter31-10.png)\n\n![](img/notice.jpg)哈希表元素的键在哈希表内部必须是唯一的。这意味着在\
  \ `family` 哈希表中，例如，你不能有两个名为 `father` 的键。\n\n![](img/notice.jpg)哈希表元素的值可以是任何类型。\n\
  \n### 31.9 在 Java 中创建 HashMap\n\n让我们尝试使用最常用的方法来创建以下哈希表。\n\n![Image](img/chapter31-11.png)\n\
  \n##### 第一种方法\n\n要创建一个哈希表并直接为其元素赋值，你可以可以使用通用形式给出的下一个 Java 语句：\n\n`HashMap<key_type,\
  \ value_type> hashmap_name = new HashMap<>(Map.of(key0, value0, key1, value1, key2,\
  \ value2, … keyM, valueM));`\n\n其中：\n\n- `key_type` 是键的类型。它可以是 `String`、`Integer`、`Double`\
  \ 等。\n- `value_type` 是元素的类型。它可以是 `String`、`Integer`、`Double` 等。\n- `hashmap_name`\
  \ 是哈希表的名称。\n- `key0`, `key1`, `key2`, … , `keyM` 是哈希表元素的键。\n- `value0`, `value1`,\
  \ `value2`, … , `valueM` 是哈希表元素的值。\n\n使用这种方法，可以使用以下语句创建哈希表 `pupil`：\n\n`HashMap<String,\
  \ String> pupil = new HashMap<>(Map.of(\"firstName\", \"Ann\", \"lastName\", \"\
  Fox\", \"age\", \"8\", \"class\", \"2nd\"));`\n\n![](img/notice.jpg)`Map.of()` 方法是在\
  \ Java 9.0 中首次引入的。它支持最多 10 个键值对。\n\n![](img/notice.jpg)在 第 5.4 节 中，你学习了为变量命名时必须遵循的规则。为哈希表命名遵循完全相同的规则！\n\
  \n![](img/notice.jpg)为了在项目中使用 `HashMap` 和 `Map` 类，你需要在项目开头使用 `import java.util.HashMap`\
  \ 和 `import java.util.Map` 语句导入相应的库。你将在 第八部分 中学习更多关于类和对象的知识。\n\n##### 第二种方法\n\n\
  在这种方法中，你可以使用通用形式给出的语句创建一个完全空的哈希表：\n\n`HashMap<key_type, value_type> hashmap_name\
  \ = new HashMap<>();`\n\n然后按照下面的通用形式给出的 Java 语句添加元素（键值对）：\n\n`hashmap_name.put(key,\
  \ value);`\n\n使用这种方法，可以使用以下代码段创建哈希表 `pupil`：\n\n```java\nHashMap<String, String>\
  \ pupil = new HashMap<>();\npupil.put(\"firstName\", \"Ann\");\npupil.put(\"lastName\"\
  , \"Fox\");\npupil.put(\"age\", \"8\");\npupil.put(\"class\", \"2nd\");\n```\n\n\
  ### 31.10 如何从 HashMap 获取值\n\n要获取特定哈希表的值，你必须指向它的键。下面的代码段创建了一个哈希表，然后使用其对应的键显示值。\n\n\
  ```java\nHashMap<String, String> olympians = new HashMap<>();\nolympi.put(\"Zeus\"\
  , \"King of the Gods\");\nolympi.put(\"Hera\", \"Goddess of Marriage\");\nolympi.put(\"\
  Ares\", \"God of War\");\nolympi.put(\"Poseidon\", \"God of the Sea\");\nolympi.put(\"\
  Demeter\", \"Goddess of Harvest\");\nolympi.put(\"Artemis\", \"Goddess of the Hunt\"\
  );\nolympi.put(\"Apollo\", \"God of Music\");\nolympi.put(\"Aphrodite\", \"Goddess\
  \ of Love\");\nolympi.put(\"Hermes\", \"Messenger of the Gods\");\nolympi.put(\"\
  Athena\", \"Goddess of Wisdom\");\nolympi.put(\"Hephaistos\", \"God of Fire\");\n\
  olympi.put(\"Dionysus\", \"God of the Wine\");\n```\n\n![](img/notice.jpg)只有使用键才能访问元素。这意味着\
  \ `olympi.get(\"Ares\")` 正确返回“God of War”，但 `olympi.get(\"daughter\")` 不行。\n\n####\
  \ 练习 31.10-1 罗马数字转数字\n\n罗马数字如下表：\n\n| Number | Numeral |\n| --- | --- |\n| 1 | I\
  \ |\n| 2 | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n编写一个 Java 程序，提示用户输入 I 到 V\
  \ 之间的罗马数字，然后显示对应的数字。假设用户输入有效值。\n\n##### 解决方案\n\n明显的解决方案是使用类似于代码片段中的判断结构：\n\n```java\n\
  if (romanNumeral == \"I\")number = 1;\nelse if (romanNumeral == \"II\")number =\
  \ 2;\nelse if (romanNumeral == \"III\")number = 3;\nelse if (romanNumeral == \"\
  IV\")number = 4;\nelse if (romanNumeral == \"V\")number = 5;\n```\n\n然而，这种方法非常长，如果你想扩展程序以处理更多数字，它会变得更加复杂。因此，掌握了哈希表的知识，你可以采用如下所示的高效方法：\n\
  \n```java\nHashMap<String, Integer> roman2number = new HashMap<>(Map.of(\"I\", 1,\
  \ \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5));\nnumber = roman2number.get(romanNumeral);\n\
  ```\n\n该练习的解决方案如下。\n\n![](img/my_exercise_header.png) Project_31.10-1\n\n```java\n\
  import java.util.Scanner;\nimport java.util.Map;\nimport java.util.HashMap;\n\n\
  public class App {\n    static Scanner cin = new Scanner(System.in);\n    public\
  \ static void main(String[] args) throws Exception {\n        String romanNumeral;\n\
  \        int number;\n        HashMap<String, Integer> roman2number = new HashMap<>(\n\
  \            Map.of(\"I\", 1, \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5)\n    \
  \    );\n        System.out.print(\"Enter a Roman numeral: \");\n        romanNumeral\
  \ = cin.nextLine();\n        number = roman2number.get(romanNumeral);\n        System.out.println(romanNumeral\
  \ + \": \" + number);\n    }\n}\n```\n\n#### 练习 31.10-2 在哈希表中使用不存在的键\n\n以下 Java\
  \ 程序中有什么错误？\n\n```java\nHashMap<String, String> family = new HashMap<>(Map.of(\"\
  father\", \"John\", \"mother\", \"Maria\", \"son\", \"George\"));\nSystem.out.println(family.get(\"\
  daughter\"));\n```\n\n##### 解决方案\n\n`get()` 方法返回了 `null`，因为哈希表中不存在 `daughter` 这个键。\n\
  \n\n\n\n\n与数组类似，这段代码不满足确定性（definiteness）属性。你绝不能引用不存在的 hashmap 元素。由于不存在键“daughter”，最后一条语句显示“null”。\n\
  \n![](img/notice.jpg)在计算机科学中，“null”意味着“无”。当一个变量或数据结构元素没有值时，它被认为是 `null`。值 `0` 与\
  \ `null` 值不同，因为 `0` 是一个实际的值。对于字符串而言，空字符串（`\"\"`）与 `null` 值也不同。空字符串是一个没有任何字符的字符串，而\
  \ `null` 字符串完全没有值！\n\n### 31.11 如何修改 HashMap 元素的值\n\n要修改现有 hashmap 元素的值，你需要使用相应的键并为该元素分配新值。接下来的示例展示了这一点。\n\
  \n```java\nHashMap<String, String> tribes = new HashMap<>(Map.of(\"Indian\", \"\
  Navajo\", \"African\", \"Zulu\"));\nSystem.out.println(tribes); //它显示: {Indian=Navajo,\
  \ African=Zulu}\n// 修改现有元素的值\ntribes.put(\"Indian\", \"Apache\");\nSystem.out.println(tribes);\
  \ //它显示: {Indian=Apache, African=Zulu}\n```\n\n#### 练习 31.11-1 给不存在的键赋值\n\n以下代码段中存在任何错误吗？\n\
  \n```java\nHashMap<Integer, String> tribes = new HashMap<>(Map.of(0, \"Navajo\"\
  , 1, \"Cherokee\", 2, \"Sioux\"));\ntribes.put(3, \"Apache\");\n```\n\n##### 答案\n\
  \n不，这次这段代码段完全没有错误。乍一看，你可能认为最后一条语句试图修改一个不存在的键的值并会报错。但对于 Java 的 hashmap 来说并非如此。由于\
  \ `tribes` 是一个 hashmap 且键“3”不存在，最后一条语句向 hashmap 中添加了一个全新的第四个元素！\n\n![](img/remember.jpg)hashmap\
  \ 的键可以是 `String`、`int`、`double` 等类型。\n\n但请记住，如果 `tribes` 实际上是一个数组，最后一条语句肯定会报错。看以下代码段：\n\
  \n```java\nString[] tribes = {\"Navajo\", \"Cherokee\", \"Sioux\"};\ntribes[3] =\
  \ \"Apache\";\n```\n\n在这个示例中，由于 `tribes` 是数组且索引 `3` 不存在，最后一条语句试图修改一个不存在的元素，显然会报错！\n\
  \n### 31.12 如何遍历 HashMap\n\n要遍历 hashmap 的元素，你可以使用 for 循环。以下是一个通用形式的代码段：\n\n```java\n\
  for (key_type key : structure_name.keySet()) {\n    process structure_name.get(key);\n\
  }\n```\n\n其中 `process` 是任何 Java 语句或语句块，用于在每次迭代中处理 hashmap `structure_name` 的一个元素。\n\
  \n以下 Java 程序显示字母 A、B、C、D 及其它们对应的摩斯密码。\n\n```java\nHashMap<String, String> morseCode\
  \ = new HashMap<>(Map.of(\"A\", \".-\", \"B\", \"-...\", \"C\", \"-.-.\", \"D\"\
  , \"-..\"));\nfor (String letter : morseCode.keySet()) {\n    System.out.println(letter\
  \ + \"  \" + morseCode.get(letter));\n}\n```\n\n下一个示例为计算机软件公司的每位员工额外发放了 2000 美元奖励！\n\
  \n```java\nHashMap<String, Double> salaries = new HashMap<>(Map.of(\n    \"Project\
  \ Manager\", 83000.0,\n    \"Software Engineer\", 81000.0,\n    \"Network Engineer\"\
  , 64000.0,\n    \"Systems Administrator\", 61000.0,\n    \"Software Developer\"\
  , 70000.0\n));\nfor (String title : salaries.keySet()) {\n    salaries.put(title,\
  \ salaries.get(title) + 2000);\n}\n```\n\n### 31.13 复习题：判断对错\n\n对以下每个陈述判断对错。\n\n\
  1) 数组是能够包含多个值的结构。\n2) 数组元素位于主内存（RAM）中。\n3) 数组只有一维和二维数组。\n4) 不存在四维数组。\n5) 数组被称为“多维”数组，是因为它可以持有不同类型的值。\n\
  6) 每个数组元素都有一个唯一的非负索引。\n7) hashmap 中可以有两个相同的键。\n8) 在数组中，索引编号默认始终从 0 开始。\n9) 数组最后一个元素的索引等于其元素的总数。\n\
  10) 可以存在两百维的数组。\n11) 下一条语句包含语法错误。`String[] studentNames = String[10];`\n12) 在 Java\
  \ 程序中，两个数组不能有相同的名称。\n13) 下一条语句在语法上是正确的。`HashMap<String, String> student = new HashMap<>(Map.of(\"\
  firstName\": \"Ann\", \"lastName\": \"Fox\", \"age\": \"8\"));`\n14) 在 Java 程序中，两个数组的元素个数不能相同。\n\
  15) 你不能使用变量作为索引。\n16) 你可以使用数学表达式作为索引。\n17) 你不能使用变量作为 hashmap 的键。\n18) 以下代码段不会报错：`String\
  \ a = \"a\"; HashMap<String, String> fruits = new HashMap<>(Map.of(\"A\", \".-\"\
  , \"B\", \"-...\", \"C\", \"-.-.\", \"D\", \"-..\")); System.out.println(fruits.get(a));`\n\
  19) 使用变量作为数组索引时，该变量必须是整数。\n20) 为了计算总和，必须使用数组。\n21) 你可以使用 `b[k]` 为数组输入值。\n22) 下一条语句创建了一个包含两个元素的一维数组。\n\
  23) 下一条语句将值 10 赋值给索引 5。`values[5] = 10;`\n24) 该代码段将“Sally”赋值给索引 2。\n25) 该语句将“Sally”赋值给索引\
  \ 2。\n26) 该代码段在屏幕上显示“Maria”。\n27) 下一条语句在语法上是正确的。\n28) 该代码段在屏幕上显示“Maria”。\n29) 该语句满足确定性属性。\n\
  30) 该语句满足确定性属性。\n\n### 31.14 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n\n\n\n\n1) 下述语句 `StringString()\
  \ lastNames = new String[4];`\na) 包含一个逻辑错误。\nb) 包含一个语法错误。\nc) 是一个正确的语句。\nd) 以上都不是。\n\
  \n2) 下述代码段\n```java\ndouble x = 5;\nvalues[x / 2] = 10;\n```\na) 不满足确定性（definiteness）。\n\
  b) 不满足有限性（finiteness）。\nc) 不满足有效性（effectiveness）。\nd) 以上都不是。\n\n3) 如果变量 `x` 包含值\
  \ `4`，下述语句 `values[x + 1] = 5;`\na) 将值 `4` 赋值给索引为 `5` 的元素。\nb) 将值 `5` 赋值给索引为 `4`\
  \ 的元素。\nc) 将值 `5` 赋值给索引为 `5` 的元素。\nd) 以上都不是。\n\n4) 下述语句 `int[] values = {5, 6, 9,\
  \ 1, 1, 1};`\na) 将值 `5` 赋值给索引为 `1` 的元素。\nb) 将值 `5` 赋值给索引为 `0` 的元素。\nc) 不满足确定性。\n\
  d) 以上都不是。\n\n5) 下述代码段\n```java\nvalues[0] = 1;\nvalues[values[0]] = 2;\nvalues[values[1]]\
  \ = 3;\nvalues[values[2]] = 4;\n```\na) 将值 `4` 赋值给索引为 `3` 的元素。\nb) 将值 `3` 赋值给索引为\
