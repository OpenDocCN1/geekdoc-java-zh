  \ 练习 4.7-1 求三个数字的平均值\n\n设计一个计算三个数字平均值的算法。每当平均值低于 10 时，必须显示消息“Fail!”。否则，如果平均值在 10\
  \ 或以上，必须显示消息“Pass!”。\n\n解答\n\n在这个问题中，必须显示两条不同的消息，但每次执行算法时只能出现一条；消息的措辞取决于平均值。这里是算法的流程图。\n\
  \n![Image](img/chapter04-08.png)\n\n![](img/notice.jpg)为了节省纸，你可以使用单个斜四边形提示用户输入所有三个数字。\n\
  \n![](img/remember.jpg)**决策符号始终有一个入口和两个出口路径！**\n\n当然，你很快就能开始创建自己的算法了。这个特定的练习非常简单，在本章中作为例外提出，仅用于演示目的。在开始创建自己的算法甚至编写\
  \ Java 程序之前，你需要学习更多知识。请耐心！几个章节后，大时刻就会降临！\n\n### 4.8 什么是“保留字”？\n\n在计算机语言中，保留字（或关键字）是具有严格预定义含义的单词——它被预留用于特殊用途，不能用于任何其他用途。例如，流程图中的\
  \ `Start`、`End`、`Read` 和 `Write` 具有预定义的含义。它们分别代表开始、结束、数据输入和结果输出。\n\n保留字存在于所有高级计算机语言中。在\
  \ Java 中，有很多保留字，如 `if`、`while`、`else` 和 `for`。然而，每种语言都有自己的保留字。例如，Java 中的保留字 `else\
  \ if` 在 Python 中写为 `elif`。\n\n### 4.9 语句 (Statement) 和命令 (Command) 有什么区别？\n\n互联网上关于语句（statement）和命令（command）之间是否存在差异有很大的讨论。有些人倾向于使用“语句”，另一些人则使用“命令”。对于初级程序员来说，没有区别；它们都是给计算机的指令！\n\
  \n### 4.10 什么是结构化编程？\n\n结构化编程是一种模块化和结构化设计的软件开发方法。大型程序被拆分成更小的模块，每个单独模块使用结构化代码，这意味着语句以特定的方式组织，以最大限地减少错误和误解。正如其名，结构化编程是在结构化编程语言中进行的，Java\
  \ 就是其中一种语言。\n\n结构化编程概念由 Corrado Böhm 和 Giuseppe Jacopini 在 1966 年正式提出。他们证明了使用序列、决策和迭代的理论计算机程序设计。\n\
  \n### 4.11 三种基本的控制结构\n\n结构化编程中有三种基本的控制结构。\n\n► **顺序控制结构**：指的是逐行执行，语句按照它们在程序中出现的顺序依次执行，而不跳过任何一个。它也被称为顺序控制结构。\n\
  ► **决策控制结构**：根据条件的真假，决策控制结构可能会跳过整个语句块的执行，或者执行一组语句而不是另一组。它也被称为选择控制结构。\n► **循环控制结构**：这是一种允许多次执行语句块的结构，直到满足指定的条件。它也被称为迭代控制结构或重复控制结构。\n\
  \n![](img/notice.jpg)**世界上每一个计算机程序都是用这三 控制结构编写的！**\n\n#### 练习 4.11-1 使用流程图理解控制结构\n\
  \n使用流程图为每种控制结构提供一个示例。\n\n解答\n\n顺序控制结构示例\n\n.![Image](img/chapter04-09.png)\n\n决策控制结构示例\n\
  \n![Image](img/chapter04-10.png)\n\n循环控制结构示例\n\n![Image](img/chapter04-11.png)\n\
  \n如果你还没有完全理解这三种控制结构的深层含义，不要担心，接下来的章节将对它们进行非常彻底的分析。耐心是一种美德。现在你只需要等待！\n\n### 4.12\
  \ 你的第一个 Java 程序\n\n\n\n\n将流程图转换为如 `Java` 等计算机语言会生成一个 Java 程序。Java 程序无异于一个包含 `Java`\
  \ 语句的文本文件。你甚至可以在你的文本编辑器应用程序中编写 `Java` 程序！但是，请记住，使用 Visual Studio Code 编写 `Java`\
  \ 程序是一个更好的解决方案，因为它包含了许多可以让你的生活变得更轻松的特性。\n\n![](img/remember.jpg)Java 源代码以默认的 `.java`\
  \ 文件扩展名保存在你的硬盘上。\n\n一个 `Java` 程序必须包含一个 `main` 方法，如下所示。\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {// Java code goes here}\n```\n\n这里是一个非常简单的算法，可以在屏幕上显示三条消息。\n\
  \n.![Image](img/chapter04-12.png)\n\n这里是同一个算法，写成 `Java` 程序后的形式。\n\n```java\npublic\
  \ static void main(String[] args) throws Exception {System.out.println(\"Hello World!\"\
  );System.out.println(\"Hallo Welt!\");System.out.println(\"The End\");}\n```\n\n\
  ![](img/notice.jpg)注意，`Java` 要求所有语句必须以分号结束。\n\n### 4.13 语法错误、逻辑错误和运行时错误之间的区别是什么？\n\
  \n在编写或执行高级语言代码时，可能会发生三种错误：语法错误、逻辑错误和运行时错误。\n\n语法错误是指某种错误，例如拼写错误的关键字、缺失的标点符号或缺失右括号。语法错误由编译器或解释器检测。如果你尝试执行一个包含语法错误的\
  \ `Java` 程序，你会在屏幕上收到错误信息，且程序不会执行。你必须修正任何错误，然后再次尝试执行程序。\n\n![](img/notice.jpg)某些\
  \ IDE（如 Visual Studio Code）会在你输入时检测到这些错误，并用红色波浪线划线错误的语句。\n\n逻辑错误是指导致程序无法按照你的预期运行的错误。对于逻辑错误，你完全不会收到任何警告。你的代码可以编译并运行，但结果不是预期的。逻辑错误很难检测。你必须彻底检查你的程序，以找出错误在哪里。例如，考虑一个\
  \ `Java` 程序，它提示用户输入三个数字，然后计算并显示它们的平均值。然而在这个程序中，程序员犯了一个拼写错误（“typo”）；他们的其中一条语句将三个数字之和除以\
  \ `5`，而不是按要求的除以 `3`。当然，这个 `Java` 程序会正常执行，没有任何错误信息，会提示用户输入三个数字并显示结果，但显然不是正确的结果！找到并修正编写错误的\
  \ `Java` 语句是程序员的责任，而不是计算机、解释器或编译器的责任！毕竟计算机并没有那么智能！\n\n![](img/notice.jpg)逻辑错误可能是运行时错误的原因！\n\
  \n![](img/notice.jpg)运行时错误是程序在程序执行期间发生的错误。运行时错误会导致程序意外终止，甚至导致系统关机。此类错误是最难检测的。在执行程序之前，没有办法确定这种错误是否会发生。尽管你可以怀疑它可能会发生！例如，内存耗尽或除以零会导致运行时错误。\n\
  \n![](img/notice.jpg)逻辑错误和运行时错误通常被称为“bug”，它们通常在软件发布前的调试过程中发现。当在软件发布给公众后发现错误时，程序员通常会发布补丁或小更新来修复这些错误。\n\
  \n### 4.14 “调试”意味着什么\n\n调试是发现并减少计算机程序中缺陷（bug）数量的过程，使其能够按预期运行。\n\n关于“调试（debugging）”一词的起源有一个神话。1940\
  \ 年，当 Grace Hopper 在哈佛大学研究 Mark II 计算机时，她的同事发现了一只卡在继电器（一种电气开关）中的昆虫（蛾）。这只昆虫阻塞了 Mark\
  \ II 计算机的正常运行。因此，当她的同事试图移除这个昆虫时，Grace Hopper 提到他们正在“调试（debugging）”系统！\n\n### 4.15\
  \ 为代码编写注释\n\n当你编写一个短小程序时，任何人都可以逐行阅读并理解它的原理。然而，长程序很难理解，有时甚至对于编写它们的人来说也是如此。\n\n注释是可以包含在程序中的额外信息，使其更容易阅读和理解。通过注释，你可以添加解释和其他信息，包括：\n\
  \n* 谁编写了程序\n* 程序创建或最后一次修改的时间\n* 程序的功能是什么\n* 程序是如何工作的\n\n![](img/notice.jpg)注释是给人类读者看的。编译器和解释器会忽略你在程序中添加的任何注释。\n\
  \n然而，你不应该过度注释。没有必要解释程序的每一行。只有当程序的某特定部分难以理解时，才添加注释。\n\n在 `Java` 中，你可以使用以下方法之一添加注释：\n\
  \n* 双斜杠 `//`\n* 斜杠–星号、星号–斜杠分隔符 `/* …… */`\n\n下面的程序演示了如何使用这两种注释类型。通常双斜杠（`//`）用于单行注释，而斜杠-星号、星号-斜杠分隔符\
  \ `/* …… */` 用于一次注释多行。\n\n```java\n/*Created By Bouras AristidesDate created: 12/25/2003Date\
  \ modified: 04/03/2008Description: 该程序在屏幕上显示一些消息*/\npublic static void main(String[]\
  \ args) throws Exception {\n    System.out.println(\"Hello Zeus!\"); //在屏幕上显示一条消息\n\
  \    //在屏幕上显示第二条消息\n    System.out.println(\"Hello Hera!\"); /*在屏幕上显示第三条消息 */ System.out.println(\"\
  Γεια\");//这是一个注释 /*结束 */ \n}\n```\n\n正如前面的程序所示，你可以在语句上方或末尾添加注释，但不能放在语句前面。看最后一条语句，它应该显示“The\
  \ End”。这句话永远不会执行，因为它被认为是注释的一部分。\n\n![](img/notice.jpg)如果你使用分隔符 `/* …… */` 在语句前面添加注释，该语句仍会被执行。在前面的示例中，希腊语消息“Γεια”尽管写在某些注释旁边，但仍然会被执行。然而，建议不要遵循这种写法，因为它会使你的代码难以阅读。\n\
  \n![](img/notice.jpg)在程序运行时，注释对用户不可见。\n\n### 4.16 用户友好型程序\n\n什么是用户友好型程序？它是用户认为是朋友而不是敌人的程序，对于新手用户来说是容易使用的。\n\
  \n如果你想编写用户友好型的程序，你必须设身处。用户希望计算机按照他们的方式、以最小的努力完成工作。隐藏的菜单、模糊的标签和指示以及误导性的错误信息都会让程序变得对用户不利！\n\
  \n最好定义用户友好设计的法律是“最小惊讶法则”：“程序应该以最令用户感到惊讶的方式运行”。这条法律通常也被称为最小惊讶原则（POLA）”。\n\n### 4.17\
  \ 复习题：判断对错\n\n对下列每个陈述判断是或否。\n\n\n\n\n\n1) 一道菜谱实际上是一种算法。\n2) 算法仅用于计算机科学。\n3) 算法可以永远运行。\n\
  4) 在算法中，你可以将某一个步骤移动到任何想要的位置。\n5) 算法必须对至少一组输入值产生正确的输出值。\n6) 计算机可以下象棋。\n7) 算法总是可以变成计算机程序。\n\
  8) 编程是创建计算机程序的过程。\n9) 计算机程序中始终涉及三方：程序员、计算机和用户。\n10) 程序员和用户有时可以是同一个人。\n11) 计算机程序可能不输出任何结果。\n\
  12) 流程图是一个计算机程序。\n13) 流程图由一组几何形状组成。\n14) 流程图是一种表示算法的方法。\n15) 为了表示算法，你可以设计不使用任何开始/结束（Start/End）符号的流程图。\n\
