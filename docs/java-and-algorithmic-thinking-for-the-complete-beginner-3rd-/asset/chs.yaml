  \ `g` 的每一行进行降序排序，但它必须注意与数组 `p` 中的元素保持一一对应关系。这意味着，每当冒泡排序算法交换数组 `g` 中两个元素的内容时，数组 `p`\
  \ 中对应的元素也必须进行交换。然而，考虑到只需要找到五位最高得分者，算法不需要执行 23 轮（共有 24 名球员），只需执行 5 轮即可。排序完成后，五位最高得分者应该出现在前五列。\n\
  \n再次使用了“从内层到外层”的方法。以下代码片段对数组 `g` 的第一行（行索引 0）进行降序排序，同时保持与数组 `p` 元素的一一对应对应关系。假设变量\
