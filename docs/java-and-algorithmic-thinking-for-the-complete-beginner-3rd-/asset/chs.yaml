  \ `palindrome` 从第二次迭代开始就被设为 `false`，但最后一个 `for` 循环仍然会继续迭代到句子的中间。所以，让我们尝试让这个程序变得更好。正如你所知道的，你可以使用\
  \ `break` 语句在循环完成所有迭代之前跳出循环。\n\n此外，由于只有四种不同的字符需要删除（空格、逗号、句号和问号），你只需要链式四个 `replace()`\
  \ 方法就可以避免第一个循环，如下面的 Java 所示所示。\n\n![](img/my_exercise_header.png) Project_30.6-4b\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int i,\
  \ middlePos, j;\n    String message, messageClean;\n    boolean palindrome;\n  \
  \  System.out.print(\"Enter a message: \");\n    message = cin.nextLine().toLowerCase();\n\
  \    // 创建一个新字符串，包含除空格、逗号、句号和问号以外的所有字符\n    messageClean = message.replace(\"  \"\
  , \"\").replace(\",\", \"\").replace(\".\", \"\").replace(\"?\", \"\");\n    j =\
  \ messageClean.length() - 1;\n    middlePos = (int)(j / 2);\n    palindrome = true;\n\
  \    for (i = 0; i <= middlePos; i++) {\n        if (messageClean.charAt(i) != messageClean.charAt(j))\
  \ {\n            palindrome = false;\n            break;\n        }\n        j--;\n\
  \    }\n    if (palindrome) {\n        System.out.println(\"The message is palindrome\"\
  );\n    }\n}\n```\n\n![](img/notice.jpg) 显而易见，一个问题有很多解决方案。找到最优取决于取决于！\n\n![](img/notice.jpg)\
