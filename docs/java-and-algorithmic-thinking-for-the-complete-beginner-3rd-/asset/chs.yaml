  \ *\n*  *\n*\n```\n\n## 第 28 章\n更多关于带循环控制结构的流程图\n\n### 28.1 引言\n\n通过对前面章节的学习，你已经熟悉了所有的循环控制结构。由于流程图是学习“算法思维”的理想方式，并能帮助你更好地理解特定的控制结构，本章将教你如何将\
  \ Java 程序转换为流程图，以及如何将流程图转换为 Java 程序。\n\n### 28.2 将 Java 程序转换为流程图\n\n要将 Java 程序转换为流程图，你需要回忆所有的循环控制结构及其对应的流程图。下面是它们它们的总结。\n\
  \n#### 前测试循环结构\n\n`while (布尔 _ 表达式) {A 语句或语句块}`\n\n![Image](img/chapter25-01.png)\n\
  \n#### 后测试循环结构\n\n`do {A 语句或语句块}while (布尔 _ 表达式);`\n\n![Image](img/chapter25-04.png)\n\
  \n#### 中测试循环结构\n\n`while (true) {A 语句或语句块 1if (布尔 _ 表达式) break;A 语句或语句块 2}`\n\n\
  ![Image](img/chapter25-07.png)\n\n#### For 循环\n\n`for (计数器 = 初始值; 计数器 OP1 终点值; 计数器\
  \ = 计数器 OP2 偏移量) {A 语句或语句块}`\n\n![Image](img/chapter26-01.png)\n\n接下来你将发现许多可以帮助你理解某些内容的练习。\n\
  \n#### 练习 28.2-1 设计流程图片段\n\n设计与以下代码片段对应的流程图。\n\n```java\nint i = 50;\nwhile (i >\
  \ 10) {if (i % 2 == 1) {\n> System.out.println(i);\n}i -= 5;}\n```\n\n##### 答案\n\
  \n此代码片段包含一个前测试循环结构，其中嵌套了一个单分支选择结构。后续对应的流程图片段包含了你目前所学的所有内容。\n\n![Image](img/chapter28-01.png)\n\
  \n#### 练习 28.2-2 设计流程图片段\n\n设计与以下代码片段对应的流程图。\n\n```java\nint i = 30;\ndo {if (i\
