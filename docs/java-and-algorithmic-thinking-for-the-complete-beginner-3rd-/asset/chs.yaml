  \ - i - 1]);}`\n27) N × N 数组中主对角线下方元素的列索引始终大于其对应的行索引。\n\n### 32.8 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\
  \n\n\n\n\n1) 下述语句 `String lastNames = String[5][4];`\na) 包含逻辑错误。\nb) 包含语法错误。\nc)\
