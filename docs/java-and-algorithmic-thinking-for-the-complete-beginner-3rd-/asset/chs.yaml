  \ 中 `for` 语句可以用许多不同的方式编写，但本书仅涉及其基本形式。因此，当使用 `for` 语句来定义循环时，其在更方便的格式下的通用形式如下。\n\n\
  ```\nfor (counter = initial_value; counter OP1 final_value; counter = counter OP2\
  \ offset) {A statement or block of statements}\n```\n\n对应的流程图所示。\n\n![Image](img/chapter26-01.png)\n\
