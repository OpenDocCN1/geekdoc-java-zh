  \ 30.3 节中第二种方法的代码片段：\n\n```java\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    System.out.print(\"\
  提示消息\");\n    input_array[i] = cin.nextLine();\n    while (input_array[i] test 1\
  \ fails || input_array[i] test 2 fails || … ) {\n        System.out.println(\"错误消息\"\
  );\n        System.out.print(\"提示消息\");\n        input_array[i] = cin.nextLine();\n\
