  \ three”。假设用户输入有效。提示：避免逐个检查数字！尝试一种更巧妙的方法！\n\n## 19 分支结构\n\n### 19.1 Case \n\n分支结构是多分支决策结构的简化版本。对于复杂的算法，它可以帮助你更快编写代码并提高可读性。分支结构用于扩展备方案。\n\
  \nJava 语句的通用形式为\n\n```java\nswitch (变量或求值的表达式) {\ncase 值-1:\n    语句或语句块 1\n    break;\n\
  case 值-2:\n    语句或语句块 2\n    break;\ncase 值-3:\n    语句或语句块 3\n    break;\n...\n\
  case-N:\n    语句或语句块 N\n    break;\ndefault:\n    语句或语句块 N +1\n}\n```\n\n最后一条语句或语句块\
  \ `N+1` 是可选的（同样需要省略 default 关键字）。为了避免意外结果，请记住在每个 case 结束时包含 break 关键字。如果你省略了它，将执行两个语句或语句块：当前省略\
  \ break 的当前，以及下一个。\n\n注意在 Java 中，`switch` 语句仅适用于某些数据类型，如 `byte`、`short`、`int`、`char`\
  \ 或 `String`。\n\n你不能总是用分支结构代替多分支决策结构。在分支结构中，求值的变量或表达式只写一次，这意味着同一个变量或表达式在所有 case\
  \ 中都被求值。而在多分支决策结构中，求值的变量或表达式在每个 case 中可以不同。\n\n这里显示了一个分支结构的示例。\n\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    String name;\n    System.out.print(\"\
  What is your name? \");\n    name = cin.nextLine();\n    switch (name) {\n     \
  \   case \"John\":\n            System.out.println(\"You are my cousin!\");\n  \
  \          break;\n        case \"Aphrodite\":\n            System.out.println(\"\
  You are my sister!\");\n            break;\n        case \"Loukia\":\n```\n\n\n\n\
  \n\n```java\nSystem.out.println(\"You are my mom!\");\nbreak;\ndefault:\nSystem.out.println(\"\
  Sorry, I don't know you.\");\n}\n```\n\n### 练习 19.1-1 星期几天\n\n编写一个 Java 程序，提示用户输入一个\
  \ 1 到 5 之间的整数，然后显示对应的工作日（周一、周二、周三、周四或周五）。如果输入的值无效，则必须显示错误信息。\n\n#### 答案\n\n下面是解决此练习的流程图。\n\
