  \ - 1; i++) {\n        digit = \"\" + xStr.charAt(i); // 获取字符串格式的“数字”\n        s\
  \ = s + Integer.parseInt(digit);\n    }\n    System.out.println(s);\n}\n```\n\n\
  ### 30.2 嵌套控制结构练习\n\n#### 练习 30.2-1 显示所有包含指定数字的三位整数\n\n编写一个 Java 程序，提示用户输入一个数字（0\
  \ 到 9），然后显示所有至少包含一次用户输入数字的三位整数。例如，对于用户输入的数字 7，数值 357、771 和 700 都是符合条件的整数。\n\n#####\
  \ 解决方案\n\n有三种不同的方法！第一种只使用了一个 `for` 循环；第二种方法使用了三个相互嵌套的 `for` 循环；最后一种方法是将所有三位整数转换为字符串。让我们来分析一下它们！\n\
  \n###### 第一种方法 —— 使用 `for` 循环和选择控制结构\n\n核心思想是使用一个 `for` 循环，变量 `counter` 的值从 100\
  \ 变到 999。在循环内部，将 `counter` 变量拆分为单个数字（`digit[3]`、`digit[2]`、`digit[1]`），并使用选择控制结构来检查是否至少有一个数字等于提供的数字。相应的\
  \ Java 程序如下。\n\n![](img/my_exercise_header.png) Project_30.2-1a\n\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    int x, i, digit3, r, digit2,\
  \ digit1;\n    System.out.print(\"Enter a digit 0 - 9: \");\n    x = Integer.parseInt(cin.nextLine());\n\
  \    for (i = 100; i <= 999; i++) {\n        digit3 = (int)(i / 100);\n        r\
  \ = i % 100;\n        digit2 = (int)(r / 10);\n        digit1 = r % 10;\n      \
  \  if (digit3 == x || digit2 == x || digit1 == x) {\n            System.out.println(i);\n\
  \        }\n    }\n}\n```\n\n###### 第二种方法 —— 使用嵌套循环控制结构和选择控制结构\n\n这里的核心思想是使用三个嵌套的\
  \ `for` 循环。在这种情况下，有三个计数器变量（`digit3`、`digit2` 和 `digit1`），每个变量对应三位整数中的一个数字。相应的 Java\
  \ 程序如下。\n\n![](img/my_exercise_header.png) Project_30.2-1b\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int x, digit3, digit2, digit1;\n\
  \    System.out.print(\"Enter a digit 0 - 9: \");\n    x = Integer.parseInt(cin.nextLine());\n\
  \    for (digit3 = 1; digit3 <= 9; digit3++) {\n        for (digit2 = 0; digit2\
  \ <= 9; digit2++) {\n            for (digit1 = 0; digit1 <= 9; digit1++) {\n   \
  \             if (digit3 == x || digit2 == x || digit1 == x) {\n               \
  \     System.out.println(digit3 * 100 + digit2 * 10 + digit1);\n               \
  \ }\n            }\n        }\n    }\n}\n```\n\n\n\n\n\n![](img/notice.jpg)这种解决方案是最效率的，因为它没有使用任何决策控制结构，而且迭代次数被保持在最低！\n\
  \n![](img/remember.jpg)如你所见，一个问题可以有多种解决方案。找到最优解取决于你自己！\n\n### 30.3 使用循环控制结构进行数据验证\n\
  \n如你所知，数据验证是限制数据输入的过程，它强制使用户只能输入有效值。你已经遇到过一种使用决策控制结构的数据验证方法。让我们回想一个示例。\n\n```java\n\
  System.out.print(\"Enter a non-negative number: \");\nx = Double.parseDouble(cin.nextLine());\n\
  if (x < 0) {\n    System.out.print(\"Error: Negative number entered!\");\n}else\
  \ {\n    System.out.println(Math.sqrt(x));\n}\n```\n\n然而，这种方法对用户可能不是最方便的。如果他们输入了无效数字，程序会显示错误信息，执行流不可避免地到达了末尾。用户必须重启程序以重新输入有效数字。\n\
  \n接下来，你将找到三种通用形式的、使用循环控制结构验证数据输入的方法。在用户输入无效值的情况下，主要目标是反复提示他们，直到他们最终提供有效值。当然，如果用户最初输入了有效值，执行流将直接进入程序的下一个部分。\n\
  \n你使用哪种方法取决于你是否希望显示错误信息，以及你是否希望显示不同的错误信息（每种输入错误显示一个），还是对任何类型的错误显示一个通用错误信息。\n\n####\
  \ 第一种方法 – 不带错误信息的数据输入验证\n\n要在不显示任何错误信息的情况下验证数据输入，可以使用以下通用形式的代码片段。\n\n```java\ndo\
  \ {\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  } while (input_data test 1 fails || input_data test 2 fails || …);\n```\n\n####\
  \ 第二种方法 – 使用通用错误信息的数据输入验证\n\n验证数据输入并显示通用错误信息（即对任何类型的输入错误显示相同的错误信息），可以使用以下通用形式的代码片段。\n\
  \n```java\nSystem.out.print(\"Prompt message\");\ninput_data = cin.nextLine();\n\
  while (input_data test 1 fails || input_data test 2 fails || … ) {\n    System.out.println(\"\
  Error message\");\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  }\n```\n\n#### 第三种方法 – 使用不同错误信息的数据输入验证\n\n验证数据输入并为每种输入错误显示不同的错误信息，可以使用以下通用形式的代码片段。\n\
  \n```java\ndo {\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  \    failure = false;\n    if (input_data test 1 fails) {\n        System.out.println(\"\
  Error message 1\");\n        failure = true;\n    }else if (input_data test 2 fails)\
  \ {\n        System.out.println(\"Error message 2\");\n        failure = true;\n\
  \    }else if (……)}\n} while (failure);\n```\n\n![](img/notice.jpg)语句 `while (failure)`\
  \ 等于语句 `while (failure == true)`。\n\n#### 练习题 30.3-1 寻找奇数和偶数\n\n编写一个 Java 程序，提示用户输入一个非负整数，然后显示一条消息指示该数是否为偶数；否则必须显示“Odd”。使用循环控制结构，程序还必须验证数据输入，允许用户仅输入非负整数。\n\
