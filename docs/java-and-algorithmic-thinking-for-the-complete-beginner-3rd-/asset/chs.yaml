  b) 在名为 `Teacher` 的类中，将字段 `salary` 修改为私有字段 `_salary`，并为其添加 getter 和 setter 方法。setter\
  \ 方法在字段设置为负值时必须抛出错误。\nc) 在名为 `Student` 的类中，将字段 `finalGrade` 修改为私有字段 `_finalGrade`，并为其添加\
  \ getter 和 setter 方法。当字段被设置为 A、B、C、D、E 或 F 以外的值时，setter 方法必须抛出错误。\n\n\n\n\n\n你到目前为止的所有程序都可以被描述为“临时的”。尽管它们读取了某些输入数据并显示了一些输出结果，但所有的值都存储在变量、数组和其他数据结构中，这些结构存在于计算机的主内存（RAM）中；因此，程序执行完成后这些值都会丢失。即使没有发生这种情况，当你关闭电脑时它们也会被丢失。然而，在许多情况下，你需要将这些值保存在更持久的存储设备中，例如机械硬盘（HDD）或固态硬盘（SSD）。\n\
  \nJava 可以读取存储在计算机文件中输入数据，也可以向相同或不同的文件写入输出结果。这种读取/写入过程被称为文件 I/O（文件输入/输出），并可以使用 Java\
  \ 的一些现成方法来实现。\n\n通常，使用的文件类型是文本文件。文本文件包含字符序列，并存储在持久性存储设备中（HDD、SSD 等）。\n\n![](img/notice.jpg)计算机编程中使用的另一种文件是“二进制文件”；然而，这种类型超出了本书的范围，将不再进行进一步分析。\n\
  \n在接下来的章节中，你将学习如何打开和关闭文本文件，如何从文本文件中读取值或向其写入值，甚至学习如何在其中搜索某个值。\n\n### 40.2 打开文件\n\n\
  `Scanner` 和 `FileWriter` 是两个可以分别用于从文本文件读取数据和向写入数据的类。`FileWriter` 类还可以用于向文本文件追加数据。\n\
  \n要使用文件进行读取，首先要执行的是打开文件。在 Java 中，这是通过以下通用形式语句实现的：\n\n```java\nScanner descriptor;\n\
  descriptor = new Scanner(Paths.get(filename));\n```\n\n或者更简洁的语句：\n\n```java\nScanner\
  \ descriptor = new Scanner(Paths.get(filename));\n```\n\n其中\n\n- `descriptor` 是文件对象的名称，用于从文件中读取。\n\
  - `filename` 是一个字符串，包含文件夹（目录）和存储在硬盘（或任何其他存储设备，如 SSD、USB 闪盘等）的文件。如果文件 `filename`\
  \ 不存在，Java 将抛出运行时错误。\n\n![](img/notice.jpg)当你打开一个文件进行读取时，文件指针将位于文件的开头（位置 0）。\n\n\
  ![](img/notice.jpg)在某种程度上，文件指针可以比作数组的索引。你将在第 40.5 节中学习更多关于文件指针的知识。\n\n相应，要使用文件进行写入，首先要执行的是使用以下通用形式语句打开文件：\n\
  \n```java\nFileWriter descriptor;\ndescriptor = new FileWriter(filename);\n```\n\
  \n或者更简洁的语句：\n\n```java\nFileWriter descriptor = new FileWriter(filename);\n```\n\
  \n如果文件 `filename` 已经存在，Java 将覆盖它；否则，Java 将创建一个新文件。\n\n同样，要使用文件进行追加，你需要使用以下通用形式语句打开文件：\n\
  \n```java\nFileWriter descriptor;\ndescriptor = new FileWriter(filename, true);\n\
  ```\n\n或者更简洁的语句：\n\n```java\nFileWriter descriptor = new FileWriter(filename, true);\n\
  ```\n\n在这种情况下，如果文件 `filename` 不存在，Java 将创建一个新文件。\n\n![](img/notice.jpg)当你打开一个文件进行追加时，文件指针将位于文件的末尾。\n\
  \n让我们看一些例子。\n\n示例 1\n\n以下语句\n\n```java\nScanner f = new Scanner(Paths.get(\"names.txt\"\
  ));\n```\n\n打开了文本文件“names.txt”进行读取。文件“names.txt”必须存在于保存可执行文件（.class）相同的文件夹（目录）中。如果文件不存在，Java\
  \ 将抛出运行时错误。\n\n示例 2\n\n该语句\n\n```java\nFileWriter fgrades = new FileWriter(\"c:/temp/grades.txt\"\
  );\n```\n\n在“c:/temp”文件夹（目录）中创建了文本文件“grades.txt”并对其进行写入。如果文件已存在，Java 将覆盖它。\n\n![](img/notice.jpg)注意，文件的路径定义使用斜杠（\
  \ / ）而不是反斜杠（ \\ ）字符。\n\n示例 3\n\n该语句\n\n```java\nFileWriter fgrades = new FileWriter(\"\
  c:/temp/students/grades.txt\", true);\n```\n\n打开文本文件“grades.txt”进行追加。该文件必须存在“c:/temp”文件夹（目录）的子文件夹（子目录）中。如果文件不存在，Java\
  \ 将创建一个新文件。\n\n![](img/notice.jpg)为了使用 `Scanner`、`Paths` 和 `FileWriter` 类，你需要导入相应的库。此外，每个使用这些类的方法或\
  \ void 方法（包括 void 方法 `main`）必须抛出异常，如接下来的示例所示。\n\n```java\nimport java.util.Scanner;\n\
  import java.nio.file.Paths;\nimport java.io.FileWriter;\n\npublic class App {\n\
  \    public static void main(String[] args) throws Exception {\n        Scanner\
  \ f = new Scanner(Paths.get(\"a_file.txt\"));\n        FileWriter fout = new FileWriter(PATH\
  \ + \"b_file.txt\");\n        // ...\n    }\n}\n```\n\n### 40.3 关闭文件\n\n在对文件完成读取、写入或追加操作后，使用\
  \ `close()` 方法关闭文件至关重要。该方法表示文件的使用已结束，让操作系统（OS）保存任何未保存的数据。`close()` 方法的通用形式如下：\n\n\
  ```java\ndescriptor.close();\n```\n\n其中 `descriptor` 是用于打开文件的对象。\n\n让我们看一些例子。\n\n\
  示例 1\n\n以下代码片段\n\n```java\nScanner fst = new Scanner(Paths.get(\"c:/temp/data.txt\"\
  ));\nfst.close();\n```\n\n打开了“c:/temp/data.txt”进行读取并关闭了它。\n\n示例 2\n\n以下代码片段\n\n\
  ```java\nFileWriter f = new FileWriter(\"temperatures.txt\", true);\nf.close();\n\
  ```\n\n打开了“temperatures.txt”进行追加并关闭了它。\n\n## 40.4 在文件中写入或追加内容\n\n要在文件中写入（甚至向其追加）字符串，可以使用\
  \ `write()` 方法。该方法的通用形式如下：\n\n```java\ndescriptor.write(str);\n```\n\n其中\n\n- `descriptor`\
  \ 是用于打开文件的对象名称。\n- `str` 是你想写入（或追加到）文件的字符串值。\n\n以下示例在“c:/temp”文件夹（目录）中创建文件“f_data40.4-i.txt”。如果文件“f_data40.4-i.txt”已经存在，Java\
  \ 将覆盖它；否则，Java 将创建一个新文件。然后，程序使用 `write()` 方法在文件中写入字符串。\n\n![](img/exercise_header.png)\n\
  \n```java\nstatic final String PATH = \"c:/temp/\";\npublic static void main(String[]\
  \ args) throws Exception {\n    FileWriter fout = new FileWriter(PATH + \"f_data40.4-i.txt\"\
  );\n    fout.write(\"Good Morning\");\n    fout.write(\"Good Evening\");\n    fout.write(\"\
  Good Night\");\n    fout.close();\n}\n```\n\n尝试执行上面的程序，然后定位并打开（使用记本程序）最近创建的 `c:/temp/f_data40.4-i.txt`\
  \ 文件。你在文件中看到的是：\n\nGood MorningGoodEveningGood Night\n\n所有字符串都写在了同一行。这是因为与你熟悉的 `println()`\
  \ 方法不同，`write()` 方法不会在字符串末尾自动添加“换行”。\n\n![](img/notice.jpg)要打开文本文件并查看内部内容，你可以使用简单的记本程序，例如\
  \ Windows 的记事本。或者，你可以免费下载并使用 Notepad++ 应用程序，地址如下：\n\n[`notepad-plus-plus.org`](https://notepad-plus-plus.org)\n\
  \n为了强制 Java 写入“换行”，你可以使用特殊字符序列 `\\n`（在第 6.2 节中介绍）。下一个示例打开之前创建的文件 `c:/temp/f_data40.4-i.txt`\
  \ 进行追加。随后，会写入一个换行以及三行文本。\n\n\n\n\n\n![](img/my_exercise_header.png)\n\n**Project_40.4b**\n\
