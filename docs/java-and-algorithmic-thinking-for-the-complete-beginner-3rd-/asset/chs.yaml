  \ 1; j++) {\n        average = 0;\n        for (i = 0; i <= STUDENTS - 1; i++) {\n\
  \            average += grades[i][j];\n        }\n        average /= STUDENTS;\n\
  \        if (average > 89) {\n            System.out.println(average);\n       \
  \ }\n    }\n}\n```\n\n### 33.4 如何在程序中使用多个数据结构\n\n到目前为止，每个示例或练习只使用了一个数组或一个哈希表。但如果一个问题要求你使用两个数组，或者一个数组和一个哈希表，或者一个数组和两个哈希表呢？接下来你将看到一些练习，它们将向你如何组合各种数据结构来应对各种独特的挑战。\n\
  \n#### 练习 33.4-1 使用三个一维数组\n\n有 20 名学生，每位学生都收到了两门课程的成绩。编写一个 Java 程序，提示用户输入每位学生在两门课程中的姓名和成绩。程序必须找到并显示所有两门课程成绩均大于\
  \ 89 的学生姓名。\n\n#### 解决方案\n\n以下是包含一些典型值的所需数组。\n\n![Image](img/chapter33-07.png)\n\
  \n如你所见，`names` 数组中的元素与 `gradesLesson1` 以及 `gradesLesson2` 数组中的元素之间存在一对应的关系。20 名学生中的第一个是\
  \ George，他在两门课程中收到了 95 分和 92 分。名字“George”存储在 `names` 数组的索引 `0` 处，在 `gradesLesson1`\
  \ 和 `gradesLesson2` 数组的相同索引处也存储了他这两门课程的成绩。下一个学生（Anna）以及她的成绩分别存储在 `names`、`gradesLesson1`\
  \ 和 `gradesLesson2` 数组的索引 `1` 处，依此类推。\n\nJava 程序如下。\n\n![](img/my_exercise_header.png)\
  \ Project_33.4-1\n```java\nstatic final int STUDENTS = 20;\npublic static void main(String[]\
  \ args) throws Exception {\n    int i;\n    String[] names = new String[STUDENTS];\n\
  \    int[] gradesLesson1 = new int[STUDENTS];\n    int[] gradesLesson2 = new int[STUDENTS];\n\
  \    for (i = 0; i <= STUDENTS - 1; i++) {\n        System.out.print(\"Enter student\
  \ name No\" + (i + 1) + \": \");\n        names[i] = cin.nextLine();\n        System.out.print(\"\
  Enter grade for lesson1: \");\n        gradesLesson1[i] = Integer.parseInt(cin.nextLine());\n\
  \        System.out.print(\"Enter grade for lesson2: \");\n        gradesLesson2[i]\
  \ = Integer.parseInt(cin.nextLine());\n    }\n    // Display the names of students\
  \ who have grades > 89 for both lessons\n    for (i = 0; i <= STUDENTS - 1; i++)\
  \ {\n        if (gradesLesson1[i] > 89 && gradesLesson2[i] > 89) {\n           \
  \ System.out.println(names[i]);\n        }\n    }\n}\n```\n\n#### 练习 33.4-2 使用一维数组配合二维数组\n\
  \n有 10 名学生，每位学生都收到了五门课程的成绩。编写一个 Java 程序，提示用户输入每位学生的姓名以及所有课程的成绩，然后计算并显示成绩大于 89 的学生姓名。\n\
  \n#### 解决方案\n\n在这个练习中，你可以像上一个练习那样做。例如，你可以使用一个一维数组存储姓名，并使用五个一维数组存储每门课程的成绩。这并不方便，但可行。显然，当成绩很多时，这不是最合适的方法。\n\
  \n最好的方法是使用一个一维数组存储姓名，并一个二维数组存储每位学生每门课程的成绩。实际上有两种方法。使用哪种完全取决于你！如果你决定在二维数组中，行代表学生，列代表课程，那么你可以使用下面的第一种方法。如果你决定行代表课程，列代表学生，那么可以使用后续的第二种方法。\n\
