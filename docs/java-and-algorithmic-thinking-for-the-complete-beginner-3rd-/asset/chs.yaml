  34) 计算三角形面积但输出错误结果的程序包含逻辑错误。\n35) 当程序不包含任何输出语句时，它包含语法错误。\n36) 程序必须始终包含注释。\n37) 如果你在程序中添加注释，计算机可以更容易地理解它。\n\
  38) 你不能在语句上方添加注释。\n39) 注释对程序的用户不可见。\n40) 如果一个程序可以被新手轻松使用，则它被称为用户友好。\n41) 缩写 POLA\
  \ 代表“最小娱乐原则”（Principle of Least Amusement）。\n\n## 4.18 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\
