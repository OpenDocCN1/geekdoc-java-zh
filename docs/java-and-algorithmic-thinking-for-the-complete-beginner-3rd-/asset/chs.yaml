  \ n++) {\n            if (kwh[n] > maximum) {\n                maximum = kwh[n];\n\
  \                indexOfMax = n;\n            }\n        }\n        // 交换 kwh 的值\n\
  \        temp = kwh[m];\n        kwh[m] = kwh[indexOfMax];\n        kwh[indexOfMax]\
  \ = temp; // 注意：此处原文逻辑有误，此处保留翻译\n        // 交换 months 的值\n        tempStr = months[m];\n\
  \        months[m] = months[indexOfMax];\n        months[indexOfMax] = tempStr;\n\
  \    }\n    for (i = 0; i <= 2; i++) {\n        System.out.println(months[i] + \"\
  : \" + kwh[i]);\n    }\n}\n```\n*(注：原文提供的代码片段在交换逻辑上存在逻辑错误，如 `indexOfMin = temp`\
  \ 等，翻译时已按原意保留。)*\n\n### 练习 34.4-9 插入排序算法 – 对一维数组进行排序\n\n编写使用插入排序算法对数组进行升序排序的代码段。假设数组包含数值。\n\
  \n插入排序算法在处理大量数据时效率较低，就像冒泡排序和选择排序算法，但在处理非常小数组时可能比它们任何一个都快。此外，在处理已经排序的数组时它表现更好。\n\n\
  #### 答案\n\n插入排序算法类似于你整理扑牌。你从桌面上面朝上拿起一张牌，将其插入到手中排好的牌的正确位置。过程如下：你从桌面上拿一张牌，将其与手中已有的牌进行比较（从右到左）。最后，桌面上没有牌了，你手中将持有所有的排序扑牌。\n\
  \n例如，让我们尝试对以下数组按升序排序。为了更好地理解这个例子，假设排序过程已经开始，数组的前三个元素已经排序。\n\n![Image](img/chapter34-27.png)\n\
  \n位置 0、1 和 2 的元素代表你手中的牌，而数组的剩余元素代表桌面上未排序的牌。\n\n位置 3 的元素（数值为 8）从数组中取出，并将其左侧所有大于 8\
  \ 的元素向右移动。数组 A 变为\n\n![Image](img/chapter34-28.png)\n\n现在释放了一个位置，将 8 插入其中。数组 A 变为\n\
  \n![Image](img/chapter34-29.png)\n\n位置 4 的元素（数值为 10）从数组中取出，并将其左侧所有大于 10 的元素向右移动。数组\
  \ A 变为\n\n![Image](img/chapter34-30.png)\n\n现在释放了一个位置，将数值 10 插入其中。数组 A 变为\n\n![Image](img/chapter34-31.png)\n\
  \n位置 5 的元素（数值为 18）从数组中取出，并将其左侧所有大于 18 的元素向右移动。数组 A 变为\n\n![Image](img/chapter34-32.png)\n\
  \n现在释放了一个位置，将 18 插入其中。数组 A 变为\n\n![Image](img/chapter34-33.png)\n\n位置 6 的元素（数值为\
  \ 9）从数组中取出，并将其左侧所有大于 9 的元素向右移动。数组 A 变为\n\n![Image](img/chapter34-34.png)\n\n最后，将数值\
  \ 9 插入到释放的位置，算法结束，数组现在已经排序完毕。\n\n\n\n\n![Image](img/chapter34-35.png)\n\n![](img/notice.jpg)算法的实际操作是逐个检查未排序的元素，并将每个元素插入到已排序元素集合中的适当位置。\n\
  \n使用插入排序算法按升序排列数组的代码片段如下：\n\n```java\nfor (m = 1; m <= ELEMENTS - 1; m++) {\n  \
  \  // 从数组中“移除”索引位置 m 处的元素并将其保存在变量 element 中\n    element = a[m];\n    // 将适当元素向右移动\n\
  \    n = m;\n    while (n > 0 && a[n - 1] > element) {\n        a[n] = a[n - 1];\
  \   // 等同于：\n        n--;               // a[n--] = a[n – 1];\n    }\n    // 将之前“移除”的元素插入索引位置\
  \ n\n    a[n] = element;\n}\n```\n\n![](img/notice.jpg)请注意，索引位置 `m` 处的元素并没有实际上从数组中移除，而是在向右移动时被覆盖了。这就是为什么在移动元素之前，需要将其值保存在变量\
  \ `element` 中。\n\n![](img/notice.jpg)如果你想降序排列数组，只需将 `while` 语句的布尔表达式更改为 `n > 0 &&\
  \ a[n − 1] < element`。\n\n![](img/remember.jpg)与之前的两种排序算法一样，为了在 Java 中排序字母数字数据，你可以简单将布尔表达式\
  \ `n > 0 && a[n - 1] > element` 替换为表达式 `n > 0 && a[n - 1].compareTo(element) > 0`。\n\
