  \ `a`、`b` 和 `c` 是已知的实数，`x` 代表待求的未知数。因为 `x` 是二次幂，该方程被分类为二次方程，也称为二次方程。\n\n方程的根是使该方程成立的\
  \ `x` 值；即等式 $ax² + bx + c$ 的左侧等于零。\n\n在本次练习中，用户必须输入系数 `a`、`b` 和 `c` 的值，程序必须找到使 $ax²\
  \ + bx + c$ 等于零的 `x` 值。\n\n这个问题根据系数 `a` 的值分为两个独立的子问题。\n\ni) 如果系数 `a` 不等于零，可以使用判别式\
  \ `D` 找到方程的根。请注意，下文提供的练习解答在 `D < 0` 时没有找到复根；这超出了本书的范围。\nii) 如果系数 `a` 等于零，方程变为线性方程\
  \ $bx + c = 0$，这在之前的练习中提供过解。\n\n所有必要的路径所示。\n\n![Image](img/chapter23-13.png) 使用此图设计流程图。\n\
