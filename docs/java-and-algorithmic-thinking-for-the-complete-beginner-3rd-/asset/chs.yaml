  ```\n\n### 练习 30.1-6 计算各位数字的和\n\n编写一个 Java 程序让用户输入一个整数并计算其各位数字之和。\n\n#### 答案\n\n\
  一旦你学会了拆分整数的位数，就可以让用户输入任何整数并计算其数字之和。为了解决这个问题，可以使用循环结构。相应的，Java 程序如下：\n\n```java\n\
  public static void main(String[] args) throws Exception {\n    int x, s;\n    s\
  \ = 0;\n    System.out.print(\"Enter an integer: \");\n    x = Integer.parseInt(cin.nextLine());\n\
  \    while (x != 0) {\n        int digit = x % 10; // 这是 x MOD 10 操作\n        s\
  \ += digit;\n        x /= 10; // 这是 x DIV 10 操作\n    }\n    System.out.println(\"\
  The sum of the digits is: \" + s);\n}\n```\n\n为了更好地理解发生了什么，为输入值 4753 创建一个追踪表。\n\n\
  | Steps | 语句 | 备注 | x | s |\n| --- | --- | --- | --- | --- |\n| 1 | `x = Integer.parseInt()`\
  \ | 用户输入 4753 | 4753 | ? |\n| 2 | `s = 0` | | 4753 | 0 |\n| 3 | `while (x != 0)`\
  \ | 结果为真 | 4753 | |\n| 4 | `digit = x % 10` | | 4753 | 3 |\n| 5 | `s += digit` |\
  \ | 4753 | 3 |\n| 6 | `x /= 10` | | 475 | 3 |\n| 7 | `while (x != 0)` | 结果为真 | 475\
  \ | |\n| 8 | `digit = x % 10` | | 475 | 5 |\n| 9 | `s += digit` | | 475 | 8 |\n\
  | 10 | `x /= 10` | | 47 | 8 |\n| 11 | `while (x != 0)` | 结果为真 | 47 | |\n| 12 | `digit\
  \ = x % 10` | | 47 | 7 |\n| 13 | `s += digit` | | 47 | 15 |\n| 14 | `x /= 10` |\
  \ | 4 | 15 |\n| 15 | `while (x != 0)` | 结果为真 | 4 | |\n| 16 | `digit = x % 10` |\
  \ | 4 | 4 |\n| 17 | `s += digit` | | 4 | 19 |\n| 18 | `x /= 10` | | 0 | 19 |\n|\
  \ 19 | `while (x != 0)` | 结果为假 | 0 | |\n\n\n\n\n| 12 | `digit = x % 10` | | 47 |\
  \ 7 | 8 |\n| 13 | `s = s + digit` | | 47 | 7 | 15 |\n| 14 | `x = (int)(x / 10)`\
  \ | | 4 | 7 | 15 |\n| 15 | `while (x != 0)` | 此判断结果为真 |\n| 16 | `digit = x % 10`\
  \ | | 4 | 4 | 15 |\n| 17 | `s = s + digit` | | 4 | 4 | 19 |\n| 18 | `x = (int)(x\
  \ / 10)` | | 0 | 4 | 19 |\n| 19 | `while (x != 0)` | 此判断结果为假 |\n| 20 | `.println(s)`\
  \ | 输出结果: 19 |\n\n![](img/remember.jpg)\n\n在 Java 中，两个整数相除的结果始终始终是一个整数。因此，在语句 `x\
  \ = (int)(x / 10)` 中，由于变量 `x` 和常量值 `10` 都是整数，`(int)` 强制转换运算符是多余的。然而，为了提高代码的可读性，保留它也是一种良好的实践。\n\
  \n## 第二种方法\n\n在这种方法中，核心思想是将用户提供的整数转换为字符串，然后使用 `for` 循环遍历所有的字符（数字）。然而，在 `for` 循环中，你需要将每个数字从\
  \ `char` 类型转换回 `int` 类型，然后累加到变量 `s` 中。相应的 Java 程序如下。\n\n![](img/my_exercise_header.png)\
