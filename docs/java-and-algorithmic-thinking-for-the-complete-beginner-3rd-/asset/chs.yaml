  \ 求正数的平均值\n\n编写一个 Java 程序，让用户输入一百数字，然后计算并显示正数的平均值。添加所有必要的检查以使程序满足确定性属性。\n\n####\
  \ 解决方案\n\n由于你知道迭代的总次数，可以使用 `for` 循环。但在循环内部，必须使用决策控制结构检查用户提供的数字是否为正；如果是，则必须将用户提供的数字累加到变量\
  \ `s` 中。变量 `count` 计算正数的数量。当执行流退出循环时，就可以计算平均值。`if`(`count != 0`)`语句是必要的，因为用户可能只输入负值（或零）。通过包含此检查，程序防止了任何除零错误，从而满足了确定性属性。\n\
  \n### 练习 26.1-11 统计元音数量\n\n编写一个 Java 程序，提示用户输入消息，然后统计并显示消息中包含的元音数量。\n\n#### 解决方案\n\
  \n接下来的 Java 程序统计英语消息中的元音。`for` 循环遍历消息中包含的所有字符。单分支决策结构在每次迭代中检查一个字符，如果是元音，则变量 `count`\
  \ 增加一。\n\n\n\n\n\n![](img/my_exercise_header.png)\n# Project_26.1-1\n\n```java\n\
  public static void main(String[] args) throws Exception {\n    String message;\n\
  \    char character;\n    String vowels = \"AEIOU\";\n    int i, count;\n    System.out.print(\"\
  Enter an English message: \");\n    message = cin.nextLine().toUpperCase();\n  \
  \  count = 0;\n    for (i = 0; i <= message.length() - 1; i++) {\n        character\
  \ = message.charAt(i);\n        if (vowels.indexOf(character) != -1) { //If character\
  \ is found in vowels\n            count++;\n        }\n    }\n    System.out.println(\"\
  Vowels: \" + count);\n}\n```\n\n![](img/remember.jpg)\n`length()` 方法返回变量 `message`\
  \ 所包含的字符数量，而 `message.charAt(i)` 方法返回字符串变量 `message` 中指定位置（由变量 `i` 指定）的字符（参见 第 14.3\
  \ 节）。\n\n![](img/remember.jpg)\n如果 `character` 在变量 `vowels` 中未找到，`indexOf()` 方法返回值\
  \ `-1`（参见 第 14.3 节）。\n\n## 26.2 适用于 for 循环的规则\n\n在编写 for 循环程序时，你必须始终遵循某些规则，因为它们可以避免产生意外的副作用。\n\
  \n- **►规则 1**：计数变量可以出现在循环内部的语句中，但其值绝不能被修改（参见随后的 练习 26.2-1）。如果 `final_value` 和 `offset`\
  \ 是变量而非常量值，规则同样适用。\n- **►规则 2**：`offset` 绝不能为零。如果将其设置为零，循环将执行无限次迭代（参见随后的 练习 26.2-2）。\n\
  - **►规则 3**：如果 `initial_value` 小于 `final_value`，则 `offset` 必须为正数。如果是负数，循环将执行零次迭代（参见随后的\
  \ 练习 26.2-3）。然而，故意违反此规则在某些情况下是有有用的。\n- **►规则 4**：如果 `initial_value` 大于 `final_value`，则\
  \ `offset` 必须为负数。如果是正数，循环将执行零次迭代（参见随后的 练习 26.2-4）。然而，故意违反此规则在某些情况下是有有用的。\n\n###\
  \ 练习 26.2-1 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```java\nfor (i = 5; i <= 10; i++) {\n\
  \    System.out.println(i);\n    i--;\n}\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第一条规则，该规则规定：计数变量可以出现在循环内部的语句中，但其值绝不能被修改。下面对应的流程图片段可以帮助更好地理解实际发生了什么。\n\
  \n.![Image](img/chapter26-05.png)\n\n如你所示，由于变量 `i` 的初始值 `5` 小于 `10`，执行流进入循环。但在循环内部，语句\
  \ `i ← i - 1` 消除了语句 `i ← i + 1`，这导致变量 `i` 不增加，它永远无法达到最终值 `final_value` `10`。因此，循环执行无限次迭代。\n\
  \n![](img/remember.jpg)\n与计数变量类似，如果 `final_value` 和 `offset` 是变量而非常量值，它们的值在循环内部绝不能被修改。\n\
  \n### 练习 26.2-2 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```java\nfor (i = 5; i <= 10; i +=\
  \ 0) {\n    System.out.println(i);\n}\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第二条规则，该规则规定：`offset`\
  \ 绝不能为零。随后的流程图片段可以帮助更好地理解实际发生了什么。\n\n.![Image](img/chapter26-06.png)\n\n如你所示，由于变量\
  \ `i` 的初始值小于 `10`，执行流进入循环。然而，语句 `i ← i + 0` 永远不会增加变量 `i`，这意味着它永远无法达到最终值 `final_value`\
  \ `10`。因此，循环执行无限次迭代。\n\n![](img/remember.jpg)\n`offset` 绝不能为零。\n\n### 练习 26.2-3\
  \ 计算总迭代次数\n\n以下代码段执行了多少次迭代？\n\n```java\nfor (i = 5; i >= 10; i--) {\n    System.out.println(i);\n\
  }\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第三条规则，该规则规定：如果 `initial_value` 小于 `final_value`，则\
  \ `offset` 必须为正数。如果是负数，循环将执行零次迭代。随后的流程图片段可以帮助更好地理解实际发生了什么。\n\n.![Image](img/chapter26-07.png)\n\
  \n![](img/remember.jpg)\n当计数器减少时，比较运算符应为 `≥`；计数器增加时应为 `≤`。\n\n当执行流到达循环控制结构时，值 `5`\
  \ 被赋值给变量 `i`。然而，布尔表达式求值为假，且执行流从未进入循环！因此，循环执行零次迭代。\n\n![](img/notice.jpg)\nfor 循环实际上是一个预测试循环结构。正因如此，它可能执行从零次到多次迭代。\n\
  \n![](img/remember.jpg)\n故意违反 for 循环的第三条规则在某些情况下是有有用的。\n\n### 练习 26.2-4 计算总迭代次数\n\
  \n以下代码段执行了多少次迭代？\n\n```java\nfor (i = 10; i <= 5; i++) {\n    System.out.println(i);\n\
  }\n```\n\n#### 答案\n\n此代码段违反了 for 循环的第四条规则，该规则规定：如果 `initial_value` 大于 `final_value`，则\
  \ `offset` 必须为负数。如果是正数，循环将执行零次迭代。随后的流程图片段可以帮助更好地理解实际发生了什么。\n\n.![Image](img/chapter26-08.png)\n\
  \n![](img/remember.jpg)\n计数器增加时，比较运算符应为 `≤`；计数器减少时应为 `≥`。\n\n当执行流到达循环控制结构时，值 `10`\
  \ 被赋值给变量 `i`。然而，布尔表达式求值为假，且执行流从未进入循环！因此，循环执行零次迭代。\n\n![](img/remember.jpg)\n故意违反\
  \ for 循环的第四条规则在某些情况下是有有用的。\n\n### 练习 26.2-5 N 个数字的和\n\n编写一个 Java 程序，提示用户输入 N 个数字，然后计算并显示它们的和。`N`\
  \ 的值必须在程序开始时由用户提供。\n\n#### 答案\n\n解决方案所示。\n\n![](img/my_exercise_header.png)\n# Project_26.2-5\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int n,\
  \ i;\n    double a, total;\n    System.out.print(\"输入的数字数量: \");\n    n = Integer.parseInt(cin.nextLine());\n\
  \    total = 0;\n    for (i = 1; i <= n; i++) {\n        System.out.print(\"输入第\
  \ \" + i + \" 个数字: \");\n        a = Double.parseDouble(cin.nextLine());\n     \
  \   total += a;//这等同于 total = total + a\n    }\n    System.out.println(\"和: \" +\
  \ total);\n}\n```\n\n![](img/notice.jpg)\n尽管违反了 for 循环的第四条规则，但在这个特定的练习中，这种情况非常有用。如果用户为变量\
  \ `n` 输入非正值，for 语句将执行零次迭代。\n\n## 26.3 复习题：判断对错\n\n判断以下每个陈述的对或错。\n\n\n\n\n\n1) 在\
  \ `for` 语句中，`counter` 的值在每次循环结束时会自动增加或递减。\n2) 当迭代次数已知时，可以使用确定性循环（definite loop）。\n\
  3) 在确定性循环中，循环的语句或语句块至少执行一次。\n4) 在 `for-loop` 中，`initial_value` 不能大于 `final_value`。\n\
