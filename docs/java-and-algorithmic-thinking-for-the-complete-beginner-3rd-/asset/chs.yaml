  \ 是一个回文。编写一个 Java 程序，让用户输入一个五位整数，并测试该数字是否为回文。此外，当用户输入浮点数或任何小于或大于五位的整数时，必须为每种输入错误显示不同的错误信息。\n\
  \n（注意这涉及数据验证！）\n\n### 解决方案\n\n实际上有两种不同的方法！第一种方法将数字拆分成五个不同的变量，而第二种方法将数字像字符串一样处理。让我们分析这两种方法！\n\
  \n第一种方法\n\n\n\n\n\n要测试用户输入的是否回文数，你需要按照第 13 章中学习的那样，将其数字拆分为五个不同的变量。然后，你可以检查第 `1st`\
  \ 位是否等于第 `5th` 位，且第 `2nd` 位是否等于第 `4th` 位。如果该结果为真，则该数字是回文。\n\n为了验证数据输入，你需要检查用户是否输入了一个五位数数字。记住，所有五位数数字都在\
  \ `10000` 到 `99999` 之间。因此，你只需要将数据输入限制在这个范围内即可。\n\n为了显示许多不同的错误信息，最佳实践是使用多分支决策结构，它首先检查所有情况的数据输入有效性，然后尝试解决所需的问题。例如，如果你需要检查各种错误，可以进行如下操作。\n\
  \n![Image](img/chapter23-23.png)\n\n最终的 Java 程序所示。\n\n![](img/my_exercise_header.png)\
  \ Project_23.5-4\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int digit1, r, digit2, digit3, digit4, digit5;\n    double x;\n    x =\
  \ Double.parseDouble(cin.nextLine());\n    if (x != (int)x) {\n        System.out.println(\"\
  You entered a float\");\n    } else if (x < 10000) {\n        System.out.println(\"\
  You entered less than five digits\");\n    } else if (x > 99999) {\n        System.out.println(\"\
  You entered more than five digits\");\n    } else {\n        //将 x 的数字拆分为 5 个不同的变量\n\
  \        digit1 = (int)(x / 10000);\n        r = (int)x % 10000;\n        digit2\
  \ = (int)(r / 1000);\n        r = r % 1000;\n        digit3 = (int)(r / 100);\n\
  \        r = r % 100;\n        digit4 = (int)(r / 10);\n        digit5 = r % 10;\n\
  \        if (digit1 == digit5 && digit2 == digit4) {\n            System.out.println(\"\
  Palindrome\");\n        } else {\n            System.out.println(\"Not Palindrome\"\
  );\n        }\n    }\n}\n```\n\n### 第二种方法\n\n这种方法将数字视为字符串。它比较第一个字符和最后一个字符，以及第二个字符和倒数第二个字符。如果它们相等，则意味着该数字是回文。Java\
  \ 程序所示。\n\n![](img/my_exercise_header.png) Project_23.5-4b\npublic static void main(String[]\
  \ args) throws Exception {\n    String xStr;\n    double x;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    if (x != (int)x) {\n        System.out.println(\"You entered a float\");\n\
  \    } else if (x < 10000) {\n        System.out.println(\"You entered less than\
  \ five digits\");\n    } else if (x > 99999) {\n        System.out.println(\"You\
  \ entered more than five digits\");\n    } else {\n        xStr = \"\" + (int)x;\n\
  \        if (xStr.charAt(0) == xStr.charAt(4) && xStr.charAt(1) == xStr.charAt(3))\
  \ {\n            System.out.println(\"Palindrome\");\n        } else {\n       \
  \     System.out.println(\"Not palindrome\");\n        }\n    }\n}\n```\n\n### 23.6\
  \ 布尔表达式参考与实用技巧\n\n本节总结了你到目前在 Java 之路上遇到的所有布尔表达式以及额外的技巧。无论你是初学者还是资深程序员，这些表达式和技巧都将成为你工具箱中的有力武器。请收藏它们，因为你不知道它们何时会有用。对于某些情况，提供了两种或更多实现方法。\n\
  \n1) 如何检查数字 `x` 是否在 `A` 和 `B` 之间 ► `x >= A && x <= B`\n2) 如何检查数字 `x` 是否不在 `A` 和\
  \ `B` 之间 ► `!(x >= A && x <= B)` ► `x < A || x > B`\n3) 如何检查 `x` 是否等于 `A`、`B` 或\
  \ `C` ► `x == A || x == B || x == C`\n4) 如何检查 `x` 既不等于 `A` 也不等于 `B` 也不等于 `C` ► `x\
  \ != A && x != B && x != C` ► `!(x == A || x == B || x == C)`\n5) 如何检查 `x` 是否为整数。注意变量\
  \ `x` 必须是 `double` 类型 ► `x == (int)x`\n6) 如何检查 `x` 是否为浮点数 ► `x != (int)x`\n7) 如何检查\
  \ `x` 是否为偶数 ► `x % 2 == 0` ► `x % 2 != 1` ► `!(x % 2 != 0)`\n8) 如何检查 `x` 是否为奇数 ►\
  \ `x % 2 == 1` ► `x % 2 != 0` ► `!(x % 2 != 1)`\n9) 如何检查 `x` 是否是 `y` 的整数倍 ► `x %\
  \ y == 0`\n10) 如何提取实数的小数部分 `x – (int)x`\n11) 如何提取实数的第一小数位 ► `(int)(x * 10)`\n12)\
  \ 如何提取实数的第二小数位 ► `(int)(x * 100)`\n13) 如何提取实数的第 `Nth` 小位数 ► `(int)(x * Math.pow(10,\
  \ N))`\n14) 如何提取整数的最后一位 ► `x % 10`\n15) 如何提取整数的倒数第二位 ► `(int)(x / 10)`\n16) 如何提取整数的倒数第\
  \ `Nth` 位 ► `(int)(x / Math.pow(10, N))`\n17) 如何检查单词/句子是否以字母 `B` 开头 ► `x.charAt(0)\
  \ == 'B'`\n18) 如何检查单词/句子是否以句号 `.` 结尾 ► `x.charAt(x.length() – 1) == '.'`\n19) 在三个数字\
  \ `x`、`y` 和 `z` 中找到中间数 ► `x + y + z - minimum - maximum`\n20) 在三个数字 `x`、`y` 和 `z`\
  \ 中找到两个最小数字的和 ► `x + y + z - maximum`\n21) 在三个数字 `x`、`y` 和 `z` 中找到两个最大数字的和 ► `x\
  \ + y + z - minimum`\n22) 在五个数字 `x`、`y`、`z`、`w` 和 `u` 中找到三个中间数字的和 ► `x + y + z +\
  \ w + u - minimum - maximum`\n23) 如何检查两个数字之间的距离是否大于 `NUMBER` ► `Math.abs(x - y)\
  \ > NUMBER`\n24) 如何检查正整数是否为三位数 ► `x >= 100 && x <= 999` ► `String.valueOf(x).length()\
  \ == 3` ► `(\"\" + x).length() == 3`\n25) 如何检查整数是否为三位数 ► `Math.abs(x) >= 100 &&\
  \ Math.abs(x) <= 999` ► `String.valueOf(Math.abs(x)).length() == 3` ► `(\"\" + Math.abs(x)).length()\
  \ == 3`\n26) 如何检查正整数是否为四位数且以 `5` 开头 ► `x >= 5000 && x <= 5999`\n27) 如何检查两个数字是否具有相同符号\
  \ ► `x > 0 && y > 0 || x < 0 && y < 0` ► `x * y > 0`\n28) 如何检查两个数字是否同为偶或奇数 ► `x\
  \ % 2 == 0 && y % 2 == 0 || x % 2 == 1 && y % 2 == 1` ► `x % 2 == y % 2`\n29) 如何检查两个条件\
  \ `BE1` 或 `BE2` 是否仅有一个为真而非全为真（异或运算） ► `BE1 && !(BE2) || BE2 && !(BE1)`\n30) 如何检查\
  \ `y` 中的年份是否为闰年 ► `y % 4 == 0 && y % 100 != 0 || y % 400 == 0`\n\n### 23.7 复习练习\n\
