  \ 在 `counter` 增加时应为 `<=`，在 `counter` 递减时为 `>=`。\n► 运算符 `OP2` 在 `counter` 增加时应为 `+`，在\
  \ `counter` 递减时为 `–`。\n\n![](img/notice.jpg)for 循环实际上是一个预测试循环结构。\n\n以下示例显示了数字 1,\
  \ 2, 3, 4 和 5。变量 `counter`（此处为 `i`）从 1 增加到 6，允许循环执行 5 次迭代。\n\n![](img/my_exercise_header.png)\
  \ Project_26.1a\n```\npublic static void main(String[] args) throws Exception {\n\
  \    int i;\n    for (i = 1; i <= 5; i = i + 1) {\n        System.out.println(i);\n\
  \    }\n}\n```\n\n![](img/notice.jpg)当 for 循环执行最后一次迭代时，它显示变量 `i` 的内容（即 5），然后变量 `i`\
  \ 增加 1（变为 6），执行流退出循环。\n\n你刚刚看到的程序的流程图如下。当执行流到达 for 循环时，初始值 1 被赋给变量 `i`，布尔表达式 `i\
  \ ≤ 5` 求值为结果为真，执行语句 `Write i` 并在屏幕上显示值 1。变量 `i` 增加 1，执行流回到菱形符号上方的点。布尔表达式再次求值为真，显示值\
  \ 2 并重复该过程。在第 5 次迭代中，显示值 5，变量 `i` 的值变为 6，布尔表达式求值为假，执行流退出循环。\n\n![Image](img/chapter26-02.png)\n\
  \n当变量 `counter` 增加（或递减） 1 时，使用复合赋值运算符甚至递增（或递减）运算符更方便。下一个示例使用递增运算符 `++` 显示从 1 到 10\
  \ 的数字。\n\n![](img/my_exercise_header.png) Project_26.1b\n```\npublic static void\
  \ main(String[] args) throws Exception {\n    int i;\n    for (i = 1; i <= 10; i++)\
  \ {\n        System.out.println(i);\n    }\n}\n```\n\n以下示例使用复合赋值运算符 `-=` 显示了从 10\
  \ 到 2 的偶数。\n\n![](img/my_exercise_header.png) Project_26.1c\n```\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    for (i = 10; i >=\
  \ 2; i -= 2) {\n        System.out.println(i);\n    }\n}\n```\n\n![](img/notice.jpg)注意，当\
  \ `counter`（此处为 `i`）递减时，比较运算符应为 `>=`，当 `counter` 增加时为 `<=`。\n\n虽然由于 for 循环 for 预测试循环循环结构，但你可以用\
  \ `while` 语句替换 `for` 语句。上一个示例使用 `while` 语句编写如下。\n\n![](img/my_exercise_header.png)\
  \ Project_26.1d\n```\npublic static void main(String[] args) throws Exception {\n\
  \    int i;\n    i = 10;\n    while (i >= 2) {\n        System.out.println(i);\n\
  \        i -= 2;\n    }\n}\n```\n\n以下示例使用变量代替常量值 `initial_value`、`final_value` 和\
  \ `offset` 显示了从 −2 到 −10 的偶数。\n\n![](img/my_exercise_header.png) Project_26.1e\n\
  ```\npublic static void main(String[] args) throws Exception {\n    int i;\n   \
  \ int x1 = -2;\n    int x2 = -10;\n    int t = -2;\n    for (i = x1; i >= x2; i\
  \ += t) {\n        System.out.println(i);\n    }\n}\n```\n\n![](img/notice.jpg)切不要在循环内部修改\
  \ `counter`（此处为 `i`）的值！同样适用于 `initial_value`（此处为 `x1`）、`final_value`（此处为 `x2`）和\
  \ `offset`（此处为 `t`）。这会让你的代码变得不可读并可能导致错误结果。尽管如此，如果你坚持的话，请改用 `while` 语句。\n\n以下示例显示了字母“H”、“e”、“l”、“l”和“o”（不带双引号）。\n\
  \n![](img/my_exercise_header.png) Project_26.1f\n```\npublic static void main(String[]\
  \ args) throws Exception {\n    int i;\n    String message = \"Hello\";\n    for\
  \ (i = 0; i <= message.length() - 1; i++) {\n        System.out.println(message.charAt(i));\n\
  \    }\n}\n```\n\n![](img/remember.jpg)`length()` 方法返回变量 `message` 的字符数量，而 `charAt(i)`\
  \ 方法返回字符串 `message` 中由变量 `i` 指定位置的字符。\n\n\n\n为了更好地理解实际发生的情况，你不需要创建追踪表，只需设计其对应的流程图片段即可。\n\
  \n![Image](img/chapter26-04.png)\n\n从这个流程图片段中你可以看到\n\ni) 对于输入值 `5`，布尔表达式的值为 `true`，执行流进入循环。变量\
  \ `i` 增加到 `6`，布尔表达式的值为 `false`，执行流退出循环。因此，循环执行了一次迭代。ii) 对于输入值 `6`，循环显然执行了两次迭代。\n\
  \n### 练习 26.1-4 求四个数的和\n\n编写一个 Java 程序，提示用户输入四个数字，然后计算并显示它们的和。\n\n#### 解决方案\n\n\
