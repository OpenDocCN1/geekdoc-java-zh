  递归是一种子程序调用自身的技术。起初看起来可能像无限循环，但显然并非如此；递归子程序必须以一种有限的方式编写。\n\n想象下面的程序帮助你理解。在这个程序中，`void`\
  \ 方法 `find_home()` 调用自己。\n\n```java\nstatic void find_home() {\n    if (you_are_home)\
  \ {\n        stop();\n    } else {\n        take_one_step();\n        find_home();\n\
  \    }\n}\n\npublic static void main(String[] args) throws Exception {\n    find_home();\n\
  }\n```\n\n现在，让我们通过一个真实的例子尝试递归。接下来的 Java 程序计算 5 的阶乘。\n\n```java\nstatic int factorial(int\
  \ value) {\n    if (value == 1) {\n        return 1;\n    } else {\n        return\
  \ value * factorial(value - 1);\n    }\n}\n\npublic static void main(String[] args)\
  \ throws Exception {\n    System.out.println(factorial(5)); // 输出: 120\n}\n```\n\
  \n你现在可能很困惑。在不使用循环控制结构的情况下，是如何计算 `1 × 2 × 3 × 4 × 5` 积的？接下来的图可能帮助你理解。它展示了当方法 `factorial(5)`\
  \ 回溯通过系列调用时执行的乘法操作。主代码调用 `factorial(5)`，它又调用 `factorial(4)`，后者又调用 `factorial(3)`，依此类推。最后一次调用（`factorial(1)`）向其调用者（`factorial(2)`）返回值\
  \ 1，随后向其调用者（`factorial(3)`）返回值 `1 × 2 = 2`，依此类推。当方法 `factorial(5)` 从顶部调用返回时，你就得到了最终答案。\n\
  \n为了避免逻辑错误，所有递归子程序必须遵守三个重要的规则：\n\n\n\n\n\n1) 它们必须调用自己。\n2) 它们必须有一个基准情况（base case），即“告诉”子程序停止递归的条件。基准情况通常是一个可以直接解决的小型问题。它是对“最简单”可能问题的解决方案。在上一个示例的\
  \ `factorial()` 方法中，基准情况是 `1` 的 `factorial`。当调用 `factorial(1)` 时，布尔表达式 `value ==\
  \ 1` 结果为真，并信号递归的结束。\n3) 它们必须改变状态并向基准情况移动。状态的改变意味着子程序修改了它的部分数据。通常，数据会以某种方式变得越来越小。在上一个示例的\
  \ `factorial()` 函数中，由于基准情况是 `1` 的 `factorial`，整个概念都依赖于向该基准情况移动的想法。\n\n总之，递归帮助你编写出更具创意、更优雅的程序，但请记住它并不总是最佳选择。递归的主要缺点是程序员很难想透其逻辑，因此调试包含递归子程序的代码非常困难。此外，递归算法可能可能不如非递归算法，因为它可能会消耗过多的\
  \ CPU 时间和/或过多的主内存（RAM）。因此，有时遵循 KISS 原则，不使用递归，而是使用循环控制结构来解决算法会更好。\n\n![](img/notice.jpg)\
  \ 对于不知道什么是 KISS 原则的人，它是“Keep It Simple, Stupid”（傻瓜，保持简单！）的缩写！它指出，大多数系统如果保持简单运行效果最好，避免任何不必要的复杂性！\n\
  \n### 37.9 复习题：判断对错\n\n对以下每个陈述选择对或错。\n\n1) 每个子程序都使用自己的内存空间来存储其变量的值。\n2) 子程序使用的变量在子程序执行期间内一直“存在”。\n\
  3) 只有在 Java 程序执行期间“存在”的变量是 `main` 代码的变量和全局变量。\n4) 子程序可以调用 `main` 代码。\n5) 如果按值传递参数且其值在子程序内部被更改，它在外部不会发生变化。\n\
  6) 实际参数的名字与相应的形式参数的名字必须相同。\n7) 实际参数的总数不能大于形式参数的总数。\n8) 表达式不能被传递给子程序。\n9) 默认情况下，Java\
