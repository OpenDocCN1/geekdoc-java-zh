  \n# 第四部分\n\n决策控制结构\n\n## 第 15 章 提出问题\n\n### 15.1 引言\n\n你到为止所学的所有都是顺序控制结构，语句按照它们在程序中出现的相同顺序执行。然而，在实际的\
  \ Java 编程中，你很少希望语句按顺序执行。很多时候，你希望在一种情况下执行一个语句块，而在另一种情况下执行完全不同的语句块。\n\n### 15.2 什么是布尔表达式？\n\
  \n假设变量 `x` 的值为 5。这意味着如果你问“`x` 大于 2 吗？”答案显然是“是”。对于计算机来说，这些问题被称为布尔表达式。例如，如果你写 `x >\
  \ 2`，这是一个布尔表达式，计算机必须检查表达式 `x > 2` 是否为真或假。\n\n![](img/notice.jpg)布尔表达式是一个产生布尔值的表达式，即为真或假。\n\
  \n![](img/notice.jpg)布尔表达式是问题，它们应该被读作“某物等于某物吗？”，答案是真或假。(notice.jpg)决策结构可以评估布尔表达式并决定执行哪部分语句。\n\
  \n### 15.3 如何编写简单表达式\n\n复杂的布尔表达式是由更简单的布尔表达式构建的，可以写成\n\n`BE1` `逻辑运算符` `BE2`\n\n其中\n\
  \n`Operand1` 和 `Operand2` 可以是值、变量或数学表达式，如表 15-1 所示。\n\n| 比较运算符 | 描述 |\n| --- | ---\
  \ |\n| == | 等于（非赋值） |\n| != | 不等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <=\
  \ | 小于等于 |\n\n这里是一些布尔表达式的例子：\n\n`x > y`。这个布尔表达式是对计算机的问题，可以读作“`x` 大于 `y` 吗？”\n`x\
  \ <= y`。这个布尔表达式也是对计算机的问题，可以读作“`x` 小于等于 `y` 吗？”\n`x != 3 * y + 4`。这个布尔表达式是对计算机的问题，可以读作“`x`\
  \ 不等于 `3 * y + 4` 吗？”\n`s.equals(\"Hello\")`。在 Java 中，为了测试两个字符串是否相等，你需要使用 `equals()`\
  \ 方法。这个问题可以读作“`s` 包含 'Hello' 吗？”\n`x == 5`。这可以读作“`x` 等于 5 吗？”新手编写 Java 程序时一个非常常见的错误是混淆了赋值运算符和相等运算符。他们经常犯\
  \ `x = 5`，而他们实际上是想表达 `x` 等于 5。\n\n#### 练习 15.3-1 填充表格\n\n根据变量 `a`、`b` 和 `c` 的值在以下表格中填写“true”或“false”。\n\
  \n| a | b | c | a == 10 | b <= a | c > 3 * a - b |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| 3 | −5 | 7 | | | |\n| 10 | 10 | 21 | | | |\n| −4 | −2 | −9 | | | |\n\
  \n解答\n\n前两个布尔表达式非常直接，不需要额外的解释。\n\n关于布尔表达式 `c > 3 * a - b`，注意 `b` 为负的情况。例如，在第一行中，`a`\
  \ 等于 3，`b` 等于 5。表达式 `3 * a - b` 的结果是 `3 * 3 (−5) = 3 * 3 + 5 = 14`。由于变量 `c` 的内容（第一行）大于\
  \ 14，因此布尔表达式 `c > 3 * a - b` 的结果为假。\n\n经过一些计算，表格变为：\n\n| a | b | c | a == 10 | b\
  \ <= a | c > 3 * a - b |\n| --- | --- | --- | --- | --- | --- |\n| 3 | −5 | 7 |\
  \ false | true | false |\n| 10 | 10 | 21 | true | true | true |\n| −4 | −2 | −9\
  \ | false | false | true |\n\n### 15.4 逻辑运算符和复杂的布尔表达式\n\n\n\n\n\n# 逻辑运算符\n\n`BE1`\
  \ 和 `BE2` 可以是任何布尔表达式。`Logical_Operator` 可以表 15-2 所示的运算符之一。\n\n| 逻辑运算符 | 描述 |\n|\
  \ --- | --- |\n| `&&` | AND（与，也称为逻辑合与） |\n| `||` | OR（或，也称为逻辑析取） |\n| `!` | NOT（非，也称为取反或逻辑补码）\
  \ |\n\n表 15-2 Java 中的逻辑运算符\n\n![](img/notice.jpg)当你将简单的布尔表达式与逻辑运算符结合使用时，整个布尔表达式就被称为一个“复杂的布尔表达式”。例如，表达式\
  \ `x == 3 && y > 5` 就是一个复杂的布尔表达式。\n\n![](img/notice.jpg)在流程图中，本书使用了通用的 `AND`、`OR`\
  \ 和 `NOT` 运算符！\n\n## AND (`&&`) 运算符\n\n当你在两个布尔表达式之间使用 AND ( `&&` ) 运算符时（`BE1 &&\
  \ BE2`），它的意思是：只有当两个（`BE1` 和 `BE2`）布尔表达式都为真时，整个复杂布尔表达式的结果才为真。\n\n你可以将这些信息组织在所谓的真值表中。真值表显示两个或多个布尔表达式在所有可能的取组合下的逻辑操作结果。这里是\
  \ AND ( `&&` ) 运算符的真值表。\n\n| BE1 (布尔表达式 1) | BE2 (布尔表达式 2) | `BE1 && BE2` |\n| ---\
  \ | --- | --- |\n| false | false | false |\n| false | true | false |\n| true | false\
  \ | false |\n| true | true | true |\n\n仍然困惑吗？你不应该困惑！这非常简单！让我们来看一个例子。复杂的布尔表达式\n\n\
  ```\nname.equals(\"John\") == true && age > 5\n```\n\n只有当变量 `name` 包含单词“John”（不带双引号）且变量\
  \ `age` 包含大于 5 的值时，该表达式才为真。两个布尔表达式都必须真。如果其中至少一个为假（例如，变量 `age` 的值为 3），那么整个复杂的布尔表达式就为假。\n\
  \n## OR (`||`) 运算符\n\n当你在两个布尔表达式之间使用 OR ( `||` ) 运算符时（`BE1 || BE2`），它的意思是：当第一个（`BE1`）或第二个（`BE2`）布尔表达式为真（至少一个）时，整个复杂布尔表达式的结果为真。\n\
  \n这里是 OR ( `||` ) 运算符的真值表。\n\n| BE1 (布尔表达式 1) | BE2 (布尔表达式 2) | `BE1 || BE2` |\n\
  | --- | --- | --- |\n| false | false | false |\n| false | true | true |\n| true\
  \ | false | true |\n| true | true | true |\n\n让我们来看一个例子。复杂的布尔表达式\n\n```\nname.equals(\"\
  John\") == true || name.equals(\"George\") == true\n```\n\n当变量 `name` 包含单词“John”或“George”（不带双引号）时，该表达式为真。至少有一个布尔表达式必须为真。如果两个布尔表达式都为假（例如，变量\
  \ `name` 包含单词“Maria”），那么整个复杂的布尔表达式就为假。\n\n## NOT (`!`) 运算符\n\n当你在布尔表达式前面使用 NOT (\
  \ `!` ) 运算符时（`!(BE)`），它的意思是：当布尔表达式 `BE` 为假时，整个复杂布尔表达式的结果为真，反之亦然。\n\n这里是 NOT ( `!`\
  \ ) 运算符的真值表。\n\n| BE (布尔表达式) | `!(BE)` |\n| --- | --- |\n| false | true |\n| true\
  \ | false |\n\n例如，复杂的布尔表达式\n\n```\n!(age > 5)\n```\n\n当变量 `age` 包含小于等于 5 的值时，该表达式为真。例如，如果变量\
  \ `age` 的值为 6，那么整个复杂的布尔表达式为假。\n\n![](img/notice.jpg)逻辑运算符 NOT ( `!` ) 反转布尔表达式的结果。在\
  \ Java 中，布尔表达式必须包含在括号内。\n\n#### 练习 15.4-1：计算复杂布尔表达式的结果\n\n当变量 `a`, `b`, `c` 和 `d`\
  \ 分别包含值 5、2、7 和 −3 时，计算以下复杂布尔表达式的结果。\n\ni) `(3 * a + b / 47 - c * b / a > 23) &&\
  \ (b != 2)`\nii) `(a * b - c / 2 + 21 * c / 3) || (a >= 5)`\n\n### 答案\n\n不要害怕！结果可以很容易找到。你只需要记住适用于\
  \ AND ( `&&` ) 和 OR ( `||` ) 运算符的规则。\n\ni) 当两个布尔表达式都为真时，AND ( `&&` ) 运算符的结果为真。如果你仔细观察，右侧布尔表达式（`b\
  \ != 2`）的结果为假。所以，你不需要浪费时间计算左侧布尔表达式的结果。最终结果肯定为假。\nii) 当至少有一个布尔表达式为真时，OR ( `||` )\
  \ 运算符的结果为真。如果你仔细观察，右侧布尔表达式（`a >= 5`）的结果实际上为真。所以，不用去计算左侧布尔表达式的结果。最终结果肯定为真。\n\n###\
  \ 15.5 将布尔表达式的结果赋值给变量\n\n由于布尔表达式返回一个值（真或假），这个值可以直接赋值给变量。例如，语句\n\n```\na = x > y;\n\
  ```\n\n当变量 `x` 大于变量 `y` 时，变量 `a` 被赋值为真。这将在屏幕上显示该值。\n\n![](img/notice.jpg)java\n\
  public static void main(String[] args) {\n    int x, y;\n    boolean a;\n    a =\
  \ x > y;\n    System.out.println(a);\n}\n\n### 15.6 逻辑运算符的优先级\n\n更复杂的表达式可能会使用多个逻辑运算符。Java\
  \ 中的逻辑运算符遵循大多数编程语言相同的规则。优先级顺序为：逻辑取反（`!`），然后是逻辑合（`&&`），最后是逻辑析取（`||`）。\n\n| 高优先级 |\
  \ 逻辑运算符 |\n| --- | --- |\n| `!` | |\n| `&&` | |\n| `||` | 低优先级 |\n\n#### 练习 15.6-1：填充真值表\n\
  \n根据 `a`, `b`, `c` 的值，在下表中填写“true”或“false”。\n\n| a | b | c | `a > 2 || c > b &&\
  \ c > 2` | `!(a > 2 || c > b && c > 2)` |\n| --- | --- | --- | --- | --- |\n| 1\
  \ | −5 | 7 | | |\n| 10 | 10 | 3 | | |\n| −4 | −2 | −9 | | |\n\n### 答案\n\n要计算复杂的布尔表达式，你可以使用图形方法。\n\
  \n当 `a = 1`, `b = −5`, `c = 7` 时，结果为真，如图所示。\n\n![Image](img/chapter15-01.png)AND\
  \ ( `&&` ) 运算符优先级更高，在 OR ( `||` ) 运算符之前执行。\n\n当 `a = 10`, `b = 10`, `c = 3` 时，结果为真，如图所示。\n\
  \n![Image](img/chapter15-02.png)\n\n当 `a = −4`, `b = −2`, `c = −9` 时，结果为假，如图所示。\n\
  \n![Image](img/chapter15-03.png)表格第五列的值可以很容易计算，因为其列标题中的布尔表达式与第四列的几乎相同。唯一的区别是表达式前面的\
  \ NOT ( `!` ) 运算符。所以，通过简单取反第四列的结果就可以计算第五列的值！\n\n#### 练习 15.6-2：将英语句子转换为布尔表达式\n\n\
  一位校长要求学生们根据自己的年龄举手。他想找到那些\n\n\n\n\n\ni) 9 到 12 岁之间。\nii) 8 岁以下且 11 岁以上。\niii) 8、10\
  \ 且 12 岁。\niv) 6 到 8 岁之间，以及 10 到 12 岁之间。\nv) 既不是 10 岁也不是 12 岁。\n\n## Solution 解答\n\
  \n为了组合所需的布尔表达式，使用了变量 `age`。\n\n### i) 句子“9 到 12 岁之间”可以用像这里所示的图形化表示。\n\n![Image](img/chapter15-04.png)\n\
  \n但要注意！在数学中，写 `9 ≤ age ≤ 12` 是合法的，但在 Java 中以下写法是不可能的：\n\n```java\n9 <= age <= 12\n\
  ```\n\n你可以做的是将表达式分成两部分，如下：\n\n```java\nage >= 9 && age <= 12\n```\n\n![](img/notice.jpg)\
  \ 为了让你确认，你可以对“感兴趣区域”（你指定的数据范围）内部外部的多个值测试此布尔表达式。例如，对于年龄值 7、8、13 和 17，表达式的结果为 false。相反，对于年龄值\
  \ 9、10、11 和 12，结果为 true。\n\n### ii) 句子“8 岁以下且 11 岁以上”可以用像这里所示的图形化表示。\n\n![Image](img/chapter15-05.png)\n\
  \n![](img/notice.jpg) 注意到你在解 (i) 中看到的两个圆消失了。这意味着值 8 和 11 不在两个感兴趣的区域内。\n\n注意“8 岁以下且\
  \ 11 岁以上”这个句子。这是一个陷阱！不要犯写成这样的错误：\n\n```java\nage < 8 && age > 11\n```\n\n地球上没有任何人可以同时小于\
  \ 8 岁又大于 11 岁！\n\n陷阱在于“and”（与）这个词上。尝试重新表述句子，将其改为“孩子们！如果你们小于 8 岁或大于 11 岁，请举手”。现在这样好多了，正确的布尔表达式变为：\n\
  \n```java\nage < 8 || age > 11\n```\n\n![](img/notice.jpg) 为了让你确认，你可以对感兴趣区域内部外部的多个值测试此表达式。例如，对于年龄值\
  \ 8、9、10 和 11，表达式的结果为 false。相反，对于年龄值 6、7、12 和 15，结果为 true。\n\n### iii) 哎！句子“8、10\
  \ 且 12 岁”中又有一个陷阱，又是用了“and”这个词！显然，接下来的布尔表达式是错误的：\n\n```java\nage == 8 && age == 10\
  \ && age == 12\n```\n\n和之前一样，没有任何学生同时是 8 岁、10 岁且 12 岁！再次，正确的布尔表达式必须使用 OR (`||`）运算符。\n\
  \n```java\nage == 8 || age == 10 || age == 12\n```\n\n![](img/notice.jpg) 为了让你确认，你可以对多个值测试此表达式。例如，对于年龄值\
  \ 7、9、11 和 13，表达式的结果为 false。对于年龄值 8、10 和 12，结果为 true。\n\n### iv) 句子“6 到 8 岁之间，以及\
  \ 10 到 12 岁之间”可以用像这里所示的图形化表示。\n\n![Image](img/chapter15-06.png)\n\n布尔表达式为：\n\n```java\n\
  age >= 6 && age <= 8 || age >= 10 && age <= 12\n```\n\n![](img/notice.jpg) 为了让你确认，对于年龄值\
  \ 5、9、13 和 16，表达式的结果为 false。对于年龄值 6、7、8、10、11 和 12，结果为 true。\n\n### v) 句子“既不是 10\
  \ 岁也不是 12 岁”的布尔表达式可以写成：\n\n```java\nage != 10 && age != 12\n```\n\n或者写成：\n\n```java\n\
  !(age == 10 || age == 12)\n```\n\n![](img/notice.jpg) 当感兴趣区域的箭头相互指向时，使用逻辑运算符 AND\
  \ (`&&` )。否则，当箭头指向相反方向时，使用 OR (`||` )。\n\n![Image](img/chapter15-07.png)\n\n## 15.7\
  \ 算术、比较和逻辑运算符的优先级是什么？\n\n在许多情况下，一个表达式可能包含不同类型的运算符，如下图所示：\n\n```java\na * b + 2 >\
  \ 21 || !(c == b / 2) && c > 13\n```\n\n在这种情况下，首先执行算术运算，接着执行比较运算，最后执行逻辑运算，如下表所示。\n\
  \n| 优先级高 ![Image](img/arrow_up.jpg) | 优先级低 |\n| :--- | :--- |\n| 算术运算符 | `*`, `/`,\
  \ `%` |\n| | `+`, `-` |\n| 比较运算符 | `<`, `<=`, `>`, `>=`, `==`, `!=` |\n| 逻辑运算符 |\
  \ `!` |\n| | `&&` |\n| | `||` |\n\n表 15-4：算术、比较和逻辑运算符的优先级\n\n## 15.8 如何反转布尔表达式\n\
  \n反转是改变布尔表达式含义的过程。有两种方法可以反转布尔表达式。\n\n### 第一种方法\n\n这种方法是最简单的。在布尔表达式前面加上 NOT (`!`)\
  \ 运算符。例如，如果原始表达式是：\n\n```java\nage <= 12\n```\n\n反转后的表达式变为：\n\n```java\n!(age <=\
  \ 12)\n```\n\n![](img/notice.jpg) 注意，必须对整个表达式加括号。如果你只反转第一部分，那是错误的。\n\n### 第二种方法\n\
  \n这种方法稍微复杂，但并不困难。根据下表反转运算符：\n\n| 原始运算符 | 反转运算符 |\n| :--- | :--- |\n| `==` | `!=`\
  \ |\n| `!=` | `==` |\n| `>` | `<=` |\n| `<` | `>=` |\n| `<=` | `>` |\n| `>=` | `<`\
  \ |\n| `&&` | `||` |\n| `||` | `&&` |\n\n注意 NOT (`!`) 运算符保持不变。例如，如果原始表达式是：\n\n```java\n\
  age > 5 || age == 3\n```\n\n反转后的表达式变为：\n\n```java\nage <= 5\n```\n\n当 AND (`&&`)\
  \ 和 OR (`||`) 运算符共同存在于复杂的表达式时，为了保持初始优先级，必须对使用 OR (`||`) 的运算符部分加括号。例如，如果原始表达式是：\n\
  \n```java\nage > 10 && age != 3\n```\n\n反转后的表达式必须是：\n\n```java\n(age < 5 || age\
  \ > 10)\n```\n\n由于你忘记加括号包裹 `age < 5 || age > 10`，将是错误的。\n\n### 练习 15.8-1 反转布尔表达式\n\
  \n使用两种方法反转以下布尔表达式：\n\ni) `b != 4`\nii) `a * 3 + 2 > 0`\niii) `!(a == 5 && b >= 7)`\n\
  iv) `a == true`\nv) `b > 7 && !(x > 4)`\nvi) `a == 4 || b != 2`\n\n#### 解答\n\n第一种方法\n\
  \ni) `!(b != 4)`\nii) `!(a * 3 + 2 > 0)`\niii) `!(!(a == 5 && b >= 7))` 或者等价的 `a\
  \ == 5 && b >= 7`\n\n![](img/notice.jpg) 两次否定相反。即两个连续的 NOT (`!`) 运算符会相互抵消。\n\niv)\
  \ `!(a == true)`\nv) `!(b > 7 && !(x > 4))`\nvi) `!(a == 4 || b != 2)`\n\n第二种方法\n\
  \ni) `b == 4`\nii) `a * 3 + 2 <= 0`\n\n![](img/notice.jpg) 注意算术运算符并不是被“否定”。永远不要将加号（+）替换为减号（−）运算符！\n\
  \niii) `!(a != 5 || b < 7)`\n\n![](img/notice.jpg) 注意， NOT (`!`) 运算符保持不变。\n\niv)\
  \ `a != true`\nv) `b <= 7 || !(x <= 4)`\nvi) `a != 4 && b == 2`\n\n## 15.9 复习题：判断对错\n\
  \n对以下每个陈述判断对或错。\n\n\n\n\n\n1. 布尔表达式是一个始终结果为两个值之一的表达式。\n2. 布尔表达式至少包含一个逻辑运算符。\n3.\
  \ 在 Java 中，表达式 `x = 5` 用于测试变量 `x` 是否等于 5。\n4. 下面的语句不是一个有效的 Java 语句：`a = b == c;`\n\
  5. 布尔表达式 `b < 5` 用于测试变量 `b` 是否小于或等于 5。\n6. AND (`&&`) 运算符也称为逻辑析取运算符。\n7. OR (`||`)\
  \ 运算符也称为逻辑并集运算符。\n8. 如果两个布尔表达式均为真，那么这两个布尔表达式的逻辑结合（AND）的结果等于它们逻辑析取（OR）的结果。\n9. 如果两个布尔表达式的值不同，那么这两个布尔表达式的逻辑析取（OR）的结果为真。\n\
  10. 表达式 `c == 3 && d > 7` 被认为是一个复杂的布尔表达式。\n11. 当两个操作数（布尔表达式）都为真时，逻辑运算符 OR (`||`)\
  \ 的结果为真。\n12. 当变量 `x` 包含除 5 以外的任何值时，布尔表达式 `!(x == 5)` 的结果为真。\n13. NOT (`!`) 运算符在逻辑运算符中优先级最高。\n\
  14. OR (`||`) 运算符在逻辑运算符中优先级最低。\n15. 在布尔表达式 `(x > y || x == 5) && x <= z` 中，AND (`&&`)\
  \ 操作在 OR (`||`) 操作之前执行。\n16. 在布尔表达式 `a * b + c > 21 || c == b / 2` 中，程序首先测试 `c`\
  \ 是否大于 21。\n17. 当老师想要找到小于 8 岁且大于 11 岁的学生时，相应的布尔表达式是 `age < 8 && age > 11`。\n18.\
  \ 对于 `x` 的任何值，布尔表达式 `x < 0 && x > 100` 始终为假。\n19. 对于 `x` 的任何值，布尔表达式 `x > 0 || x\
  \ < 100` 始终为真。\n20. 布尔表达式 `x > 5` 等价于 `!(x < 5)`。\n21. 布尔表达式 `!(x > 5 && y == 5)`\
  \ 不等于 `!(x > 5) && y == 5`。\n22. 在威廉·莎士比亚的《哈姆莱特》（第三幕第一场）中，主角说：“生存还是毁灭，这是一个问题：…………”\
  \ 如果你将此写成布尔表达式 `toBe || !toBe`，那么对于以下代码段，这个“莎士逻辑”（Shakesboolean）表达式的结果为真。\n```\n\
  toBe = 1 > 0;\nthatIsTheQuestion = toBe || !toBe;\n```\n23. 布尔表达式 `!(!(x > 5))`\
  \ 等价于 `x > 5`。\n\n### 15.10 习习题：单选题\n\n为以下每个语句选择正确答案。\n\n1. 下列哪个不是比较运算符？\n   a)\
