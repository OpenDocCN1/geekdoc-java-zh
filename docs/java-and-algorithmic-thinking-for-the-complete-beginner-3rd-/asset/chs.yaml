  \ 0。这是为了让语句 `p = p * i` 能够正常运行；否则最终的积将为零。\n\n`p = 1;i = 2;p = p * i;i += 2;p = p\
  \ * i;i += 2;p = p * i;i += 2;p = p * i;i += 2;p = p * i;i += 2;`\n\n与上一个练习（练习 26.1-6`）一样，这个顺序控制结构可以用\
  \ `for` 循环替换，如下：\n\n![](img/my_exercise_header.png) Project_26.1-7 \n```java\npublic\
  \ static void main(String[] args) throws Exception {int p, i;p = 1;for (i = 2; i\
  \ <= 10; i += 2) {\n> p = p * i;\n}System.out.println(p);}\n```\n\n### 练习 26.1-8\
