  \n### 练习 23.3-3 解线性方程 $ax + b = 0$\n\n设计一个流程图并编写相应的 Java 程序，找到并显示线性方程的根\n\n$ax +\
  \ b = 0$\n\n#### 解决方案\n\n在方程 $ax + b = 0$ 中，系数 `a` 和 `b` 是已知的实数，`x` 代表待求的未知数。因为\
  \ `x` 是一次幂，该方程被分类为一次方程，也称为线性方程。\n\n方程的根是使该方程成立的 `x` 值；即等式 $ax + b$ 的左侧等于零。\n\n在本次练习中，用户必须输入系数\
  \ `a` 和 `b` 的值，程序必须找到使 $ax + b$ 等于零的 `x` 值。\n\n方程 $ax + b = 0$ 在求解 `x` 时变为 `x =\
  \ -b / a`。根据用户输入的数据，可能会出现三种情况：\n\ni) 用户可能对系数 `a` 输入 `0`，对系数 `b` 输入非零值。在这种情况下，`x\
  \ = -b / a` 的结果未定义。正如你从数学中知道的那样，不能执行除零操作。\nii) 用户可能对系数 `a` 和 `b` 都输入 `0`。在这种情况下，`x\
  \ = -b / a` 的结果没有定义值，被称为未定式。\niii) 用户可能输入任何其他值对。\n\n这三种情况以及产生的路径在下面使用多重分支选择结构表示。\n\
  \n![Image](img/chapter23-11.png)\n\n![Image](img/chapter23-12.png)\n\nJava 程序所示。\n\
  \n![](img/my_exercise_header.png) Project_23.3-3```java\npublic static void main(String[]\
  \ args) throws Exception {\n    double a, b, x;\n    System.out.println(\"Enter\
  \ values for coefficients a and b: \");\n    a = Double.parseDouble(cin.nextLine());\n\
  \    b = Double.parseDouble(cin.nextLine());\n    if (a != 0) {\n        x = -b\
  \ / a;\n        System.out.println(x);\n    } else if (b != 0) {\n        System.out.println(\"\
  Undefined\");\n    } else {\n        System.out.println(\"Indeterminate form\");\n\
  \    }\n}\n```\n\n###### 练习 23.3-4 解二次方程 $ax² + bx + c = 0$\n\n设计一个流程图并编写相应的 Java\
