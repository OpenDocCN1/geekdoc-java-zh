  \n\n\n\n这两个子程序都可以写成方法，因为它们都返回一个值。方法 `dice()` 返回一个 1 到 6 之间的随机整数，方法 `searchAndCount()`\
  \ 返回一个数字，表示该整数在数组中出现的次数。这里给出了解决方案。\n\n![](img/my_exercise_header.png) Project_38.2-4\n\
  \n```java\nstatic final int ELEMENTS = 100;\nstatic int dice() {\n    return 1 +\
  \ (int)(Math.random() * 5);\n}\nstatic int searchAndCount(int x, int[] a) {\n  \
  \  int count = 0;\n    int i;\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n     \
  \   if (a[i] == x) {\n            count++;\n        }\n    }\n    return count;\n\
  }\npublic static void main(String[] args) throws Exception {\n    int x, i;\n  \
  \  int[] a = new int[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n   \
  \     a[i] = dice();\n    }\n    x = Integer.parseInt(cin.nextLine());\n    System.out.println(\"\
  Provided value exists in the array \" + searchAndCount(x, a) + \" times\");\n}\n\
  ```\n\n### 练习 38.2-5 骰子每个数字出现了几次？\n\n使用上一个练习中提到的 `dice()` 和 `searchAndCount()` 方法（练习\
  \ 38.2-4），编写一个 Java 程序，用 100 个随机整数（1 到 6 之间）填充数组，然后显示这六个数字每个在数组中出现的次数，以及哪个数字出现频率最高。\n\
  \n#### 解决方案\n\n如果你不使用循环控制结构来解决这个练习，可以按照以下步骤操作。\n\n```java\n// 将值 1 在数组 an1 中出现的次数赋值给\
