  \    }\n}\n```\n\n## 练习 30.6-2 棋盘上的米粒\n\n关于一个发明象棋的穷人有一个传说。印度国王对这个新游戏非常满意，提议给那个穷人他想要的任何东西。那个贫穷但聪明的男人告诉国王，他希望棋盘的第一个格有一粒米粒，第二个格有两粒，第三个格有四粒，以此类推，棋盘上\
  \ 64 个格的每一个格，米粒数量都翻倍。国王认为这是一个很谦虚的要求，于是命令仆人把米拿来。\n\n编写一个 Java 程序，计算并显示棋盘上最后共有多少粒米粒以及多少磅米。假设一磅米粒大约包含\
  \ 30,000 粒米粒。\n\n### 解决方案\n\n假设棋盘只有 2 × 2 = 4 个格，并且变量 `grains` 赋初始值 `1`（这是第 `1st`\
  \ 个格的米粒数）。一个循环三次的 for 循环可以在每次迭代中将变量 `grains` 的值翻倍，如下代码片段所示。\n\n```java\ngrains =\
  \ 1;\nfor (i = 2; i <= 4; i++) {\n    grains = 2 * grains;\n}\n```\n\n每次迭代结束时变量\
  \ `grains` 的值如下表所示。\n\n| 迭代 | grains 的值 |\n| --- | --- |\n| 1st | 2 × 1 = 2 |\n\
  | 2nd | 2 × 2 = 4 |\n| 3rd | 2 × 4 = 8 |\n\n在第 `3rd` 次迭代结束时，变量 `grains` 的值为 `8`。这个值并不是棋盘上的米粒总数，而只是第\
  \ `4th` 个格上的米粒数。如果你需要找到棋盘上的总数，可以将所有格的米粒相加，即 `1 + 2 + 4 + 8 = 15`。\n\n在现实世界中，真正的棋盘包含\
  \ 8 × 8 = 64 个格，因此你需要迭代 63 次。Java 程序如下。\n\n![](img/my_exercise_header.png) **Project_30.6-2**\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    double grains, total, weight;\n    grains = 1;\n    total = 1;\n    for (i\
