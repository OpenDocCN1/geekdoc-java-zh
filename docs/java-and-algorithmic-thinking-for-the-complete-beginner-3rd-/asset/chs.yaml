  \n## 第 30 章 循环控制结构的进阶\n\n### 30.1 循环结构的简单练习\n\n#### 练习 30.1-1 根据大小计数\n\n编写一个 Java\
  \ 程序，提示用户输入 10 对数字，然后计数并显示第一个输入的数大于第二个数的次数，以及第二个数大于第一个数的次数。\n\n解答\n\nJava 程序如下。它使用变量\
  \ `countA` 计数第一个数大于第二个数的次数，使用变量 `countB` 计数第二个数大于第一个数的次数。\n\n![](img/my_exercise_header.png)\
  \ Project_30.1-1\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int countA, countB, i, a, b;\n    countA = 0;\n    countB = 0;\n    for\
  \ (i = 1; i <= 10; i++) {\n        System.out.print(\"Enter number A: \");\n   \
  \     a = Integer.parseInt(cin.nextLine());\n        System.out.print(\"Enter number\
  \ B: \");\n        b = Integer.parseInt(cin.nextLine());\n        if (a > b) {\n\
  \            countA++;\n        } else if (b > a) {\n            countB++;\n   \
  \     }\n    }\n    System.out.println(countA + \"  \" + countB);\n}\n```\n\n某人可能会提出的合理问题是：“为什么要使用多分支控制结构？为什么不使用二选一结构？”\n\
  \n假设确实使用了如下的二选一结构：\n```java\nif (a > b) {\n    countA++;\n} else {\n    countB++;\n\
  }\n```\n\n在这个判断控制结构中，当变量 `b` 大于变量 `a` 时，变量 `countB` 会增加（这是理想的），但当变量 `b` 等于 `a` 时也会增加（这是不理想的）。改用多分支控制结构可以确保变量\
  \ `countB` 仅在 `b` 大于 `a` 时（而不是等于 `a` 时）才增加。\n\n#### 练习 30.1-2 根据位数计数\n\n编写一个 Java\
  \ 程序，提示用户输入 20 个整数，然后计数并显示一位、两位和三位整数的总数。假设用户输入的值在 1 到 999 之间。\n\n解答\n\n使用练习 18.1-2\
  \ 中的知识，Java 程序如下。\n\n![](img/my_exercise_header.png) Project_30.1-2\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    int count1, count2, count3,\
  \ i, a;\n    count1 = count2 = count3 = 0;\n    for (i = 1; i <= 20; i++) {\n  \
  \      System.out.print(\"Enter a number: \");\n        a = Integer.parseInt(cin.nextLine());\n\
  \        if (a <= 9) {\n            count1++;\n        } else if (a <= 99) {\n \
  \           count2++;\n        } else {\n            count3++;\n        }\n    }\n\
  \    System.out.println(count1 + \"  \" + count2 + \"  \" + count3);\n}\n```\n\n\
  #### 练习 30.1-3 和中能容纳多少数字\n\n编写一个 Java 程序，让用户反复输入数值，直到它们的总和超过 1000。在结束时，程序必须显示输入的数字总数。\n\
  \n解答\n\n\n\n\n在这种情况下，由于不知道确切的迭代次数，无法使用固定循环；需要使用不确定循环。让我们使用预测试循环来创建该循环。然而，为了确保程序没有逻辑错误，必须遵守第\
  \ 29.3 节中讨论的“终极（Ultimate）”规则。根据该规则，预测试循环的结构如下（通用形式）：\n\n```\nInitialize total\n\
  while (total <= 1000) {\n    A statement or block of statements\n    Update/alter\
  \ total\n}\n```\n\n由于循环的布尔表达式依赖于变量 `total`，因此该变量必须在循环开始前进行初始化，并在循环内部进行更新（修改）。具体来说，更新/修改变量\
  \ `total` 的语句必须是循环的最后一条语句。此此，Java 程序变得如下：\n\n![](img/my_exercise_header.png) Project_30.1-3\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int count;\n\
  \    double total, x;\n    count = 0;\n    total = 0; // Initialization of total\n\
  \    while (total <= 1000) { // Boolean expression dependent on total\n        x\
