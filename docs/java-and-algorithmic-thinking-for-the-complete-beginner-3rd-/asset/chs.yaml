  \ 的公共字符串数组字段。\nc)一个构造方法，通过其形式参数列表接受字段 `day` 的初始值。\nii)编写 Java 程序，为以下历史事件创建 `HistoryEvents`\
  \ 类的两个对象：\n\n**7 月 4 日**\ni)1776 年 美国独立宣言\nii)1810 年 法国\n\n**10 月 28 日**\ni)969\
  \ 年 奥丁\nii)1940 年 希腊\n\n然后显示所有可用信息。\n\n##### 解决方案\n\n解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ Project_39.4-1\n```java\nclass HistoryEvents {\n    public String day;\n    public\
  \ String[] events = new String[2];\n    //定义构造方法\n    public HistoryEvents(String\
  \ day) {\n        this.day = day;\n    }\n}\npublic class App {\n    public static\
  \ void main(String[] args) throws Exception {\n        HistoryEvents h1 = new HistoryEvents(\"\
  7 月 4 日\");\n        h1.events[0] = \"1776 年 美国独立宣言\";\n        h1.events[1] = \"\
