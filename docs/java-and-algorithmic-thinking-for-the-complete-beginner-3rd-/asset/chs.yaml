  \ an integer: \");num = Integer.parseInt(cin.nextLine());for (i = 0; i <= num; i++)\
  \ {\n> System.out.println(Math.sqrt(i));\n}}\n```\n\n### 练习 26.1-6 求 1 + 2 + 3 +\
  \ … + 100 的和\n\n编写一个 Java 程序，计算并显示以下和：\n\n$S = 1 + 2 + 3 + … + 100$\n\n#### 解决方案\n\
  \n如果你使用顺序控制结构来解决这个练习，它会类似于下面的代码片段。\n\n`s = 0;i = 1;s = s + i;i = i + 1;s = s + i;i\
  \ = i + 1;……s = s + i;i = i + 1;`\n\n让我们使用追踪表来更好地理解它。\n\n|步骤 | 语句 | 注意 | i | s |\n\
  | --- | --- | --- | --- | --- |\n| 1 | `s = 0` | 0 | ? | 0 |\n| 2 | `i = 1` | |\
  \ 1 | 0 |\n| 3 | `s = s + i` | 0 + 1 = 1 | 1 | 1 |\n| 4 | `i = i + 1` | | 2 | 1\
  \ |\n| 5 | `s = s + i` | 0 + 1 + 2 = 3 | 2 | 3 |\n| 6 | `i = i + 1` | | 3 | 3 |\n\
  | 7 | `s = s + i` | 0 +1 + 2 + 3 = 6 | 3 | 6 |\n| 8 | `i = i + 1` | | 4 | 6 |\n\
  | ... | … | | … | … |\n| ... | … | | … | … |\n| 199 | `s = s + i` | | 99 | 4950\
  \ |\n| 200 | `i = i + 1` | | 100 | 4950 |\n| 201 | `s = s + i` | 0 + 1 + 2 + 3 +\
  \ …+ 99 + 100 = 5050 | 100 | 5050 |\n| 202 | `i = i + 1` | | 101 | 5050 |\n\n现在一切都清楚了，你可以做同样的事情，这次使用一个让变量\
  \ `i` 增 1 的 `for` 循环。\n\n![](img/my_exercise_header.png) Project_26.1-6 \n```java\n\
  public static void main(String[] args) throws Exception {int s, i;s = 0;for (i =\
  \ 1; i <= 100; i++) {\n> s = s + i;\n}System.out.println(s);}\n```\n\n### 练习 26.1-7\
  \ 求 2 × 4 × 6 × 8 × 10 的积\n\n编写一个 Java 程序，计算并显示以下积：\n\n$P = 2 \\times 4 \\times\
