  子程序的技巧与技巧\n\n### 37.1 两个子程序可以使用同名的变量吗？\n\n每个子程序都使用自己的内存空间来存储变量的值。即使是主代码也有自己的内存空间！这意味着你可以在主代码中有一个名为\
  \ `test` 的变量，在子程序中使用另一个名为 `test` 的变量，在另一个子程序中使用第三个名为 `test` 的变量。注意！这三个变量是三个完全不同的变量，位于不同的内存位置，并且可以持有完全不同的值。\n\
  \n如接下来的程序所示，三个不同的内存位置上有三个名为 `test` 的变量，每一个都持有完全不同的值。下方的跟踪表可以帮助你理解实际上发生了什么。\n\n![](img/my_exercise_header.png)\n\
  \nProject_37.1\n```java\nstatic void f1() {\n    String test;\n    test = \"Testing!\"\
  ;\n    System.out.println(test);\n}\nstatic void f2(int test) {\n    System.out.println(test);\n\
  }\n//Main code starts here\npublic static void main(String[] args) throws Exception\
  \ {\n    int test;\n    test = 5;\n    System.out.println(test);\n    f1();\n  \
  \  f2(10);\n    System.out.println(test);\n}\n```\n\n跟踪表显示在此。\n\n| Step | Statement\
  \ | Notes | Main Code | void Method f1() | void Method f2() |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| test | test | test | | | |\n| 1 | test = 5 | | 5 | | |\n\
  | 2 | .println(test) | It displays: 5 | 5 | | |\n| 3 | f1() | f1() is called | |\
  \ | |\n| 4 | test = \"Testing!\" | | | Testing! | |\n| 5 | .println(test) | | |\
  \ Testing! | |\n| 6 | f2(10) | f2() is called | | | 10 |\n| 7 | .println(test) |\
  \ It displays: 10 | | 10 | |\n| 8 | .println(test) | It displays: 5 | 5 | | |\n\n\
  ![](img/notice.jpg) 注意，子程序中的变量只要子程序在执行就会“存在”。这意味着在子程序返回调用者之前，它们（包括参数列表中的）会从内存中移除。\n\
  \n### 37.2 子程序可以调用另一个子程序吗？\n\n到目前，你可能认为只有主代码可以调用子程序。然而，事实并非如此！子程序可以调用任何其他子程序，依此类推。你可以进行任何你想要的组合。例如，你可以编写一个调用\
  \ void 方法的方法，一个调用另一个方法的方法，甚至是调用 Java 的内置方法。\n\n接下来的示例展示了这种情况。主代码调用 void 方法 `displaySum()`，该方法反过来调用了方法\
  \ `add()`。\n\n![](img/my_exercise_header.png)\n\nProject_37.2\n```java\nstatic int\
  \ add(int number1, int number2) {\n    int result;\n    result = number1 + number2;\n\
  \    return result;\n}\nstatic void displaySum(int num1, int num2) {\n    System.out.println(add(num1,\
  \ num2));\n}\npublic static void main(String[] args) throws Exception {\n    int\
  \ a, b;\n    a = Integer.parseInt(System.nextLine());\n    b = Integer.parseInt(System.nextLine());\n\
  \    displaySum(a, b);\n}\n```\n\n![](img/notice.jpg) 当执行流到达 `add()` 方法的 return\
  \ 语句时，它返回到调用者，即 void 方法 `displaySum()`。然后，当执行流到达 void 方法 `displaySum()` 的结束时，它返回到调用者，即主代码。\n\
  \n![](img/notice.jpg) 注意这两个子程序的编写顺序没有限制。如果将 void 方法 `displaySum()` 写在方法 `add()`\
  \ 之前也是完全相同的。\n\n### 37.3 按值和按引用传递参数\n\n在 Java 中，变量是按值传递给子程序的。这意味着如果在子程序内部更改了参数的值，它在外部不会发生改变。请看下面的示例。\n\
  \n![](img/my_exercise_header.png)\n\nProject_37.3\n```java\nstatic void f1(int b)\
  \ {\n    b++; // This is a variable of void method f1\n    System.out.println(b);\
  \ // It displays: 11\n}\npublic static void main(String[] args) throws Exception\
  \ {\n    int a;\n    a = 10; // This is a variable of the main code\n    f1(a);\n\
  \    System.out.println(a); // It displays: 10\n}\n```\n\n\n\n\n变量 `a` 的值 `10` 通过参数\
  \ `b` 传递给 `void` 方法 `f1()`。然而，尽管变量 `b` 的内容在 `void` 方法内部被修改，但当执行流返回主代码时，该更改不会影响变量\
  \ `a` 的值。\n\n在上之前的示例中，主代码和 `void` 方法使用了两个名称不同的变量。然而，如果例如主代码和 `void` 方法使用了两个名称相同的变量，结果也将是相同的。下一个示例的操作方式完全相同，显示的结果也与上一个示例完全相同。\n\
  \n![](img/my_exercise_header.png) Project_37.3b\n```java\nstatic void f1(int a)\
  \ {\n    a++; // 这是 void 方法 f1() 的一个变量\n    System.out.println(a); // 它显示: 11\n\
  }\n\npublic static void main(String[] args) throws Exception {\n    int a;\n   \
  \ a = 10; // 这是主代码中的一个变量\n    f1(a);\n    System.out.println(a); // 它显示: 10\n}\n\
  ```\n\n将数组作为参数传递给子程序与传递简单变量一样简单。下一个示例将数组 `a` 传递给 `void` 方法 `display()`，后者显示了该数组。\n\
  \n![](img/my_exercise_header.png) Project_37.3c\n```java\nstatic final int ELEMENTS\
  \ = 10;\nstatic void display(int b[]) {\n    int i;\n    for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n        System.out.print(b[i] + \"\\t\");\n    }\n}\n\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    int[] a = new int[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = Integer.parseInt(cin.nextLine());\n\
  \    }\n    display(a);\n}\n```\n\n与变量不同，Java 中的数据结构默认是按引用传递的。这意味着如果你例如将一个数组传递给子程序，而该子程序更改了数组的一个或多个元素的值，那么这些更改也将反映在子程序之外。请看以下示例。\n\
  \n![](img/my_exercise_header.png) Project_37.3d\n```java\nstatic void f1(int[] x)\
  \ {\n    x[0]++;\n    System.out.println(x[0]); // 它显示: 6\n}\n\npublic static void\
  \ main(String[] args) throws Exception {\n    int[] y = {5, 10, 15, 20};\n    System.out.println(y[0]);\
  \ // 它显示: 5\n    f1(y);\n    System.out.println(y[0]); // 它显示: 6\n}\n```\n\n![](img/notice.jpg)将数组传递给子程序传递的是数组的引用，而不是数组的副本，这意味着\
  \ `y` 和 `x` 实际上是同一个数组的别名。主内存（RAM）中只存在数组副本。如果子程序更改了元素的值，该更改也将反映在主程序中。\n\n所以，正如你可能意识到的，按引用传递数组可以为子程序提供一种“返回”多个值的间接方法。在下一个示例中，方法\
  \ `myDivmod()` 将变量 `a` 除以变量 `b`，并找到它们的整数商和整数余数。如果一切顺利，它返回 `true`；否则，它返回 `false`。此外，通过数组结果，该方法还间接返回了计算出的商和计算出的余数。\n\
  \n![](img/my_exercise_header.png) Project_37.3e\n```java\nstatic boolean divMod(int\
  \ a, int b, int[] results) {\n    boolean returnValue = true;\n    if (b == 0) {\n\
  \        returnValue = false;\n    } else {\n        results[0] = (int)(a / b);\n\
  \        results[1] = a % b;\n    }\n    return returnValue;\n}\n\npublic static\
  \ void main(String[] args) throws Exception {\n    int val1, val2;\n    boolean\
  \ ret;\n    int[] res = new int[2];\n    val1 = Integer.parseInt(cin.nextLine());\n\
  \    val2 = Integer.parseInt(cin.nextLine());\n    ret = divMod(val1, val2, res);\n\
  \    if (ret) {\n        System.out.println(res[0] + \", \" + res[1]);\n    } else\
  \ {\n        System.out.println(\"Sorry, wrong values entered!\");\n    }\n}\n```\n\
