  \      System.out.println(y);\n    }\n}\n```\n\n### 22.4 逻辑运算符——用还是不用：这是一个问题！\n\n\
  在某些情况下，你可以使用逻辑运算符代替嵌套的选择控制结构，这可以提高可读性。看看下面给出的通用形式的流程图片段。\n\n![Image](img/chapter22-09.png)\n\
  \n如你所见，只有当两个布尔表达式都为真时，才会执行语句或语句块 1。在所有其他情况下都会执行语句或语句块 2。因此，这个流程图片段可以使用 `AND` 运算符重新设计。\n\
