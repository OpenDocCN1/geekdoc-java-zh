  \ Visual Studio Code？\n\n# 第二部分：Java 入门\n\n## 第 4 章：基础算法概念介绍\n\n### 4.1 什么是算法？\n\
  \n从技术术语来说，算法^ 是一个严格定义的、有限的、定义良好的语句序列（通常称为指令或命令），对于任何可接受的输入值（如果有输入的话），它提供了问题或特定一类问题的解决方案。换句话说，算法是解决给定问题的逐步过程程序。“有限”意味着算法必须有一个终点，不能无限运行。\n\
  \n你可以在生活中随处找到算法，而是在计算机科学中。例如，准备一杯茶的过程可以表示为一个算法。必须按照特定的顺序执行步骤。\n\n### 4.2 泡茶的算法\n\
  \n以下是泡茶的算法：\n\n1) 将茶包放入杯中。\n2) 给壶加水。\n3) 烧水。\n4) 将水倒入杯中。\n5) 加入牛奶。\n6) 加糖。\n7) 搅拌。\n\
  8) 喝茶。\n\n你可以看到，某些步骤必须按照特定顺序执行，尽管某些步骤可以重新排列。例如，你可以先加糖。请记住，算法的步骤是可以改变的，但它们必须以实现你的目标。\n\
  \n### 4.3 算法的属性\n\n在《计算机程序设计艺术》第 1 卷中，Donald E. Knuth 断言算法必须满足以下五个属性：\n\n- **输入（Input）**：算法必须有输入值。\n\
  - **输出（Output）**：算法必须产生输出。\n- **有限性（Finiteness）**：对于任何输入，算法必须终止。\n- **确定性（Definiteness）**：算法的步骤必须是明确定义的。\n\
  - **有效性（Effectiveness）**：它指的是算法能够一致且准确地产生结果。\n\n### 4.4 那么，什么是计算机程序？\n\n计算机程序本质上是用\
  \ `Java`、`Python`、`C++` 或 `C#` 等语言编写的、计算机可以理解的算法。它通过引导你完成特定的任务。\n\n### 4.5 三方参与者！\n\
  \n算法总是涉及三方：编写算法的人、执行算法的人以及使用算法的人。\n\n- 编写算法的人（程序员）编写程序。\n- 执行算法的人（计算机）运行程序。\n- 使用算法的人（用户）获得结果。\n\
  \n当你编写计算机程序时，你暂时担任“程序员”，当你使用自己的程序时，你就变成了“用户”。\n\n### 4.6 创建算法的三个阶段\n\n算法应该由三个阶段组成：数据输入、数据处理和结果输出。这个顺序是特定的不能改变。\n\
  \n考虑一个计算三个数字平均值的计算机程序。首先，程序必须提示（询问）用户输入数字（数据输入阶段）。接下来，程序必须计算数字的平均值（数据处理阶段）。最后，程序在屏幕上显示结果（结果输出阶段）。\n\
  \n让我们详细查看这些阶段：\n\n第一阶段：数据输入\n1) 提示用户输入一个数字。\n2) 提示用户输入第二个数字。\n3) 提示用户输入第三个数字。\n\n\
  第二阶段：数据处理\n4) 计算三个数字的和。\n5) 将和除以 3。\n\n第三阶段：结果输出\n6) 将结果显示在屏幕上。\n\n在某些情况下，输入阶段可能会缺失，计算机程序可能只包含两个阶段。例如，考虑一个编写来计算以下和的计算机程序：\n\
  \n```\n1 + 2 + 3 + 4 + 5\n```\n\n在这个例子中，用户不需要输入任何值，因为计算机程序确切知道该做什么。它必须计算 1 到 5 的和，然后在用户的屏幕上显示值为\
  \ 15。这里显示了两个所需的阶段（数据处理和结果输出）。\n\n第一阶段：数据输入\n无须操作\n\n第二阶段：数据处理\n1) 计算 1 + 2 + 3 +\
  \ 4 + 5 的和。\n\n第三阶段：结果输出\n2) 将结果显示在屏幕上。\n\n\n\n\n然而，如果你想让用户决定该总和的上限呢？如果你想让用户决定是求加\
  \ 1 到 5 的数字还是 1 到 20 的数字呢？在这种情况下，程序必须在开头包含一个输入阶段，让用户输入该上限。一旦用户输入了上限，计算机就可以计算结果。三个要求的阶段如下所示。\n\
  \n#### 第一阶段 – 数据输入\n1) 提示用户输入一个数字。\n\n#### 第二阶段 – 数据处理\n2) 计算总和 `1 + 2 + …`（包含用户输入的上限）。\n\
  \n#### 第三阶段 – 输出\n3) 在屏幕上显示结果。\n\n例如，如果用户输入数字 6 作为上限，计算机将计算出 `1 + 2 + 3 + 4 + 5\
  \ + 6` 的结果。\n\n### 4.7 流程图\n\n流程图展示算法的一种图形化方法，通常在纸上绘制。它是算法执行流的可视化表示。换句话说，它直观地表示了执行流如何从一条语句进行到下一条语句，直到算法算法结束。流程图使用的基本符号如表\
  \ 4-1 所示。\n\n| 流程图符号 |  |\n| --- | --- |\n| .![Image](img/chapter04-01.png) | 开始/结束：代表算法的开始或结束。开始符号有一个出口，结束符号有一个入口。\
  \ |\n| .![Image](img/chapter04-02.png) | 箭头：显示执行流。从一个符号出发并指向另一个符号的箭头表示控制权传递给箭头所指的符号。箭头始终画成向上、向下或横向的直线（绝不画成斜线）。\
  \ |\n| .![Image](img/chapter04-03.png) | 处理：代表一个过程或数学（公式）计算。处理符号有一个入口和一个出口。 |\n\
  | .![Image](img/chapter04-04.png) | 数据输入/输出：代表数据输入或结果输出。在大多数情况下，数据来自键盘，结果显示在屏幕上。数据输入/输出符号有一个入口和一个出口。\
