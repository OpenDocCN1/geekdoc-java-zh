  \ `t` 也被排序了。\n\n### 37.5 方法重载\n\n方法重载是一项允许你在形式参数列表不同的情况下，拥有多个同名方法的功能。这意味着只要满足以下条件，你就可以进行重载：\n\
  \n►每个形式参数列表中的参数数量不同；或每个形式参数列表中的参数数据类型不同；或每个形式参数列表中参数数据类型的顺序不同。\n\n为了更好地理解所有这些概念，让我们尝试每个情况一个示例来分析它们。\n\
  \n每个形式参数列表中的参数数量不同\n\n\n\n\n\n在接下来的示例中，有两个 `display()` 方法，但它们的形式参数数量不同。第一个方法通过其形式参数列表列表接收一个字符串，而第二个方法接收两个字符串。\n\
  \n![](img/my_exercise_header.png) Project_37.5\n```java\nstatic void display(String\
  \ firstName) {\n    System.out.println(\"First name: \" + firstName);\n    System.out.println(\"\
  -----------------------------\");\n}\nstatic void display(String firstName, String\
  \ lastName) {\n    System.out.println(\"First name: \" + firstName);\n    System.out.println(\"\
  Last name: \" + lastName);\n    System.out.println(\"-----------------------------\"\
  );\n}\npublic static void main(String[] args) throws Exception {\n    display(\"\
  George\", \"Washington\");  //这调用了第二个方法\n    display(\"George\");  //这调用了第一个方法\n\
  }\n```\n\n输出结果所示。\n\n![Image](img/chapter37-02.png)\n\n### 每个形式参数列表中参数数据类型的不同性\n\
  \n在接下来的示例中，有两个 `myAbs()` 方法，但它们的形式参数类型不同。第一个方法接收一个整数，而第二个方法通过其形式参数列表接收一个实数（double）。\n\
  \n![](img/my_exercise_header.png) Project_37.5b\n```java\nstatic int myAbs(int a)\
  \ {\n    if (a < 0) {\n        a *= -1;\n    }\n    System.out.print(\"An integer\
  \ passed: \");\n    return a;\n}\nstatic double myAbs(double a) {\n    if (a < 0)\
  \ {\n        a *= -1;\n    }\n    System.out.print(\"A real passed: \");\n    return\
  \ a;\n}\npublic static void main(String[] args) throws Exception {\n    System.out.println(myAbs(-5));\
  \    //这调用了第一个方法\n    System.out.println(myAbs(-5.5));  //这调用了第二个方法\n    System.out.println(myAbs(-5.0));\
  \  //这调用了第二个方法\n}\n```\n\n输出结果如下。\n\n![Image](img/chapter37-03.png)\n\n### 每个形式参数列表中参数数据类型顺序的不同\n\
  \n最后但同样重要的是，在接下来的示例中，有两个 `displayDate()` 方法，但每个形式参数列表中参数数据类型的顺序不同。第一个方法按照“字符串‒整数‒整数”的顺序接收三个参数，而第二个方法按照“整数‒字符串‒整数”的顺序接收三个参数。\n\
  \n![](img/my_exercise_header.png) Project_37.5c\n```java\nstatic void displayDate(String\
  \ month, int day, int year) {\n    System.out.println(month + \" \" + day + \",\
  \ \" + year);\n}\nstatic void displayDate(int day, String month, int year) {\n \
  \   System.out.println(day + \" \" + month + \" \" + year);\n}\npublic static void\
  \ main(String[] args) throws Exception {\n    displayDate(4, \"July\", 1776);  //这调用了第二个方法\n\
  \    displayDate(\"July\", 4, 1776);  //这调用了第一个方法\n}\n```\n\n输出结果所示。\n\n.![Image](img/chapter37-04.png)\n\
  \n### 37.6 变量的作用\n\n变量的作用是指该的影响范围。在 Java 中，变量可以具有局部或全局作用域。声明在子程序内部的变量具有局部作用域，只能在该子程序内部访问。相反，声明在子程序外部的变量具有全局作用域，可以从任何子程序内部以及主代码中访问。\n\
  \n让我们来看一些例子。下一个示例声明了一个全局变量 `test`。尽管如此，这个全局变量在 `void` 方法内部被访问并显示。\n\n![](img/my_exercise_header.png)\
  \ Project_37.6a\n```java\nstatic int test;   //声明为全局变量\nstatic void displayValue()\
  \ {\n    System.out.println(test);  //输出 10\n}\npublic static void main(String[]\
  \ args) throws Exception {\n    test = 10;   //这是一个全局变量\n    displayValue();\n \
  \   System.out.println(test);  //输出 10\n}\n```\n\n要声明全局变量，必须前加上 `static` 关键字。大多数程序员倾向于将它们放在顶部以便观察。\n\
  \n但注意！如果全局变量的值在子程序内部被修改，该更改也会反映到子程序外部。在下一个示例中，`void` 方法 `displayValue()` 增加了全局变量\
  \ `test` 的值，当执行流返回主代码时，显示 11。\n\n![](img/my_exercise_header.png) Project_37.6b\n\
  ```java\nstatic int test;   //声明为全局变量\nstatic void displayValue() {\n    test++;\n\
  \    System.out.println(test);  //输出 11\n}\npublic static void main(String[] args)\
  \ throws Exception {\n    test = 10;\n    System.out.println(test);  //输出 10\n \
  \   displayValue();\n    System.out.println(test);  //输出 11\n}\n```\n\n下一个程序声明了一个全局变量\
  \ `test`、`void` 方法 `displayValueA()` 中的局部变量 `test`，以及 `void` 方法 `displayValueB()`\
  \ 中的另一个局部变量 `test`。请记住，全局变量 `test` 与这两个局部变量是不同的！此外，`displayValueC()` 使用全局变量。\n\n\
  ![](img/my_exercise_header.png) Project_37.6c\n```java\nstatic int test;   //声明为全局变量\n\
  static void displayValueA() {\n    int test;  //局部变量\n    test = 7;\n    System.out.println(test);\
  \  //输出 7\n}\nstatic void displayValueB() {\n    int test;  //局部变量\n    test = 9;\n\
  \    System.out.println(test);  //输出 9\n}\nstatic void displayValueC() // 使用全局变量的值\n\
  \    System.out.println(test);  //输出 10\n    test++; //增加全局变量的值\n}\npublic static\
  \ void main(String[] args) throws Exception {\n    test = 10;   //这是一个全局变量\n   \
  \ System.out.println(test);  //输出 10\n    displayValueA();\n    System.out.println(test);\
  \  //输出 10\n    displayValueB();\n    System.out.println(test);  //输出 10\n    displayValueC();\n\
  \    System.out.println(test);  //输出 11\n}\n```\n\n在不同的子程序中拥有同名的变量，因为它们只被定义的子程序所识别。\n\
  \n### 37.7 将代码部分转换为子程序\n\n不将大型程序划分为较小的子程序会导致代码难以被理解或维护。假设你有一个大型程序，并希望将其划分为更小的子程序。下一个程序是说明必须遵循步骤的示例。用虚线框标记程序部分必须转换为子程序。\n\
  \n![](img/my_exercise_header.png) Project_37.7a\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int totalYes, femaleNo, i;\n    String temp1, gender,\
  \ temp2, answer;\n    totalYes = 0;\n    femaleNo = 0;\n    for (i = 1; i <= 100;\
  \ i++) {\n        do {\n            System.out.print(\"Enter gender for citizen\
  \ No \" + i + \": \");\n            temp1 = cin.nextLine();\n            gender\
  \ = temp1.toLowerCase();\n        } while (!gender.equals(\"male\") && !gender.equals(\"\
  female\") && !gender.equals(\"other\"));\n\n        do {\n            System.out.print(\"\
  Do you go jogging in the afternoon? \");\n            temp2 = cin.nextLine();\n\
  \            answer = temp2.toLowerCase();\n        } while (!answer.equals(\"yes\"\
  ) && !answer.equals(\"no\") && !answer.equals(\"sometimes\"));\n\n        if (answer.equals(\"\
  yes\")) {\n            totalYes++;\n        }\n        if (gender.equals(\"female\"\
  ) && answer.equals(\"no\")) {\n            femaleNo++;\n        }\n    }\n    System.out.println(\"\
  Total positive answers: \" + totalYes);\n    System.out.println(\"Women's negative\
  \ answers: \" + femaleNo);\n}\n```\n\n要将此程序的部分转换为子程序，你必须：\n\n► 对于每个虚线框，决定使用方法还是\
  \ `void` 方法。这取决于子程序是否会返回结果。\n► Determine 每个虚线框中存在哪些变量以及它们在对应虚线框中的作用。\n\n接下来的流程图可以帮助决定如何处理每个变量，是否必须传递给子程序和/或从子程序返回，还是它必须只是子程序内部的局部变量。\n\
  \n\n\n\n所以，通过这个流程图的帮助，让我们逐一处理每个虚线矩形！未标记虚线矩形的部分将组成主代码。\n\n### 第一部分\n\n在第一个虚线矩形中，三个变量：`i`、`temp1`\
  \ 和 `gender`。然而，并不是所有变量都必须包含替换虚线矩形的子程序的形式参数列表中。让我们来发现为什么！\n\n- **变量 `i`**:\n   \
  \ - 在虚线矩形外部进行初始化/更新；因此，它必须传递给子程序\n    - 在虚线矩形内部没有更新；因此，它不应该返回给调用者\n- **变量 `temp1`**:\n\
  \    - 在虚线矩形外部没有初始化/更新；因此，它不应该传递给子程序\n    - 在虚线矩形内部初始化，但其值在外部没有被使用；因此，它不应该返回给调用者。\n\
  \    - 根据流程图，由于变量 `temp1` 既不需要传递也不需要返回，该变量可以作为子程序内部的局部变量。\n- **变量 `gender`**:\n\
  \    - 在虚线矩形外部没有初始化/更新；因此，它不应该传递给子程序\n    - 在虚线矩形内部初始化，然后其值在外部被使用；因此，它必须返回给调用者\n\
  \n因此，由于必须向主代码返回一个值，可以使用如下所示的方法。\n\n```java\n//First part\nstatic String getGender(int\
  \ i) {\n    String gender, temp1;\n    do {\n        System.out.print(\"Enter gender\
  \ for citizen No \" + i + \": \");\n        temp1 = cin.nextLine();\n        gender\
  \ = temp1.toLowerCase();\n    } while (!gender.equals(\"male\") && !gender.equals(\"\
  female\") && !gender.equals(\"other\"));\n    return gender;\n}\n```\n\n![](img/remember.jpg)\
  \ 方法的数据类型必须与返回值的数据类型匹配。\n\n### 第二部分\n\n在第二个虚线矩形中有两个变量，`temp2` 和 `answer`，但它们并不都需要包含在替换虚线矩形的子程序的形式参数列表中。让我们来发现为什么！\n\
  \n- **变量 `temp2`**:\n    - 在虚线矩形外部没有初始化/更新；因此，它不应该传递给子程序\n    - 在虚线矩形内部初始化/更新，但其值在外部没有被使用；因此，它不应该返回给调用者。\n\
  \    - 根据流程图，由于变量 `temp2` 既不需要传递也不需要返回，该变量可以作为子程序内部的局部变量。\n- **变量 `answer`**:\n\
