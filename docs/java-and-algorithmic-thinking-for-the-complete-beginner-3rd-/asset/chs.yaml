  //Display elements backwards\nfor (i = ELEMENTS - 1; i >= 0; i--) {\n    System.out.print(odds[i]\
  \ + \"\\t\");\n}\n```\n\n### 34.3 在数组中寻找最小值和最大值\n\n这是该主题在书中第一次也是最后一次。第一次是在第 23.2\
  \ 节 中使用决策控制结构，第二次是在第 30.4 节 中使用循环控制结构。因此，没有什么可以讨论的了，除了事实：当你想要在一个已经包含某些数值的数据结构中寻找最小值或最小值时，你不需要担心变量\
  \ `minimum` 或 `maximum` 的初始值，因为你只需要将数据结构第一个元素的值赋值给它们即可！\n\n#### 练习 34.3-1 哪个深度最深？\n\
  \n编写一个 Java 程序，让用户输入 20 个湖泊的深度，然后显示最深的一个湖泊的深度。\n\n**解答**\n\n在用户在数组 `depths` 中输入\
  \ 20 个湖泊的深度后，变量 `maximum` 的初始值可以设为 `depths[0]` 的值，即数组 `depths` 的第一个元素。程序可以从索引 1\
  \ 开始搜索任何大于此值的后续值。最终解决方案非常直接，将在下文中给出，无需作进一步解释。\n\n![](img/my_exercise_header.png)\
  \ Project_34.3-1\n```java\nstatic final int LAKES = 20;\npublic static void main(String[]\
  \ args) throws Exception {\n    int i;\n    double maximum;\n    double[] depths\
  \ = new double[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n        depths[i]\
  \ = Double.parseDouble(cin.nextLine());\n    }\n    maximum = depths[0];  //初始值\n\
  \    //从此之后搜索，从索引 1 开始\n    for (i = 1; i <= LAKES - 1; i++) {\n        if (depths[i]\
  \ > maximum) {\n            maximum = depths[i];\n        }\n    }\n    System.out.println(maximum);\n\
  }\n```\n![](img/notice.jpg) 从位置 0 而不是 1 开始迭代也是没有错的，尽管程序会执行一次无用的迭代。\n\n![](img/notice.jpg)\
  \ 给变量 `maximum` 分配一个“几乎任意”的初始值也没有错，但没有理由这么做。第一个元素的值就足够了！如果你坚持的话，可以分配 0 作为初始值，因为地球上没有深度为负数的湖泊。\n\
  \n#### 练习 34.3-2 哪个湖泊最深？\n\n编写一个 Java 程序，让用户输入 20 个湖泊的名字和深度，然后显示最深的一个湖泊的名字。\n\n\
  **解答**\n\n如果你不知道如何找到最深湖泊的名字，你可能需要通过重读练习 30.4-2 来复习记忆。\n\n在这个练习中，你需要两个一维数组：一个用于存储名称，另一个用于存储湖泊的深度。解决方案如下。\n\
  \n![](img/my_exercise_header.png) Project_34.3-2\n```java\nstatic final int LAKES\
  \ = 20;\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    double maximum;\n    String mName;\n    String[] names = new String[LAKES];\n\
  \    double[] depths = new double[LAKES];\n    for (i = 0; i <= LAKES - 1; i++)\
  \ {\n        names[i] = cin.nextLine();\n        depths[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    maximum = depths[0];\n    mName = names[0];\n    for (i = 1; i <= LAKES\
  \ - 1; i++) {\n        if (depths[i] > maximum) {\n            maximum = depths[i];\n\
  \            mName = names[i];\n        }\n    }\n    System.out.println(mName);\n\
  }\n```\n\n#### 练习 34.3-3 哪个国家的哪个湖泊（其平均面积为多少）最深？\n\n编写一个 Java 程序，让用户输入 20 个湖泊的名字、深度，以及它们所属的国家和平均面积。程序必须显示关于该最深湖泊的所有可用信息。\n\
  \n**解答**\n\n让我们来看下一个六个湖泊的例子。深度以英尺为单位，平均面积以平方英里为单位。\n\n![Image](img/chapter34-05.png)\n\
  \n显然，贝加湖是深度最深的湖泊，位于索引 2。如果你按照上一个练习的方法处理这个练习（练习 34.3-2），你需要三个额外的变量，在每次发现比之前存储的深度时分别记录名称、国家和面积。然而，下面提供的解决方案使用了更高效的方法，只使用一个变量（`indexOfMax`）来跟踪这些值所在的索引。\n\
