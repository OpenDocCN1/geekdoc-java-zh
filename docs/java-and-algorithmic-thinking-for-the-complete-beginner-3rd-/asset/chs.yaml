  The end!\")` | 显示：The end! | | |\n\n#### 练习 18.1-2 统计位数\n\n编写一个 Java 程序，提示用户输入 0\
  \ 到 999 之间的整数，并统计其位数。\n\n解决方案\n\n你可能会尝试通过整数除法来解决这个问题。统计位数，这里是第一种方法：\n\n```java\n\
  public static void main(String[] args) throws Exception {\n    int x, digits;\n\
  \    System.out.print(\"Enter an integer (0 - 999): \");\n    x = Integer.parseInt(cin.nextLine());\n\
  \    if (x / 100 == 0) {\n        digits = 1;\n    } else if (x / 10 == 1) {\n \
