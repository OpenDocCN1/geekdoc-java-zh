  \n![](img/remember.jpg)\n较小的算法并不总是解决给定问题的最佳方案。为了解决特定问题，你可能会编写一个简洁的算法，遗憾的是它事实证明会消耗大量的\
  \ CPU 时间和/或占用大部分内存（RAM）。相反，你可能用另一个算法解决同一个问题，它看起来更长，但计算结果快得多和/或使用的内存少。\n\n### 29.2\
  \ 选择循环控制结构\n\n下面的图可以帮助你根据迭代次数，为每个给定问题选择最合适的循环控制结构。\n\n![Image](img/chapter29-01.png)\n\
  \n![](img/notice.jpg)\n此图推荐的是最佳选项，而非唯一选项。例如，当迭代次数已知时，使用先测试或后测试循环结构并不是错误的。尽管如此，提议的\
  \ `for-loop` 更加方便。\n\n### 29.3 “终极”规则\n\n程序员在使用先测试或后测试循环结构时，经常困扰他们的问题是：如何确定哪些语句应该写在循环控制结构的内部，哪些在外部以及顺序是什么。\n\
  \n有一个简单但强大的规则——“终极”规则！一旦你遵循了它，产生逻辑错误的可能性就会降为零！\n\n“终极”规则规定：\n\n- 参与循环布尔表达式的变量在进入循环之前必须初始化。\n\
  - 参与循环布尔表达式的变量的值必须在循环内进行更新（更改）。更具体地说，执行此更新/更改的语句必须是循环的最后语句之一。\n\n例如，如果变量 `x` 是参与循环布尔表达式的变量，先测试循环结构的形式应如下：\n\
  \n```\nInitialize x\nwhile ( Boolean_Expression(x) ) {\n    A statement or block\
  \ of statements\n    Update/alter x\n}\n```\n\n而后测试循环结构的形式如下：\n\n```\nInitialize\
  \ x\ndo {\n    A statement or block of statements\n    Update/alter x\n} while (\
  \ Boolean_Expression(x) );\n```\n\n其中\n\n- `Initialize x` 是任何为变量 `x` 分配初始值的语句。它可以是一个输入语句，如\
  \ `cin.nextLine()`，也可以是使用值赋值运算符（`=`）的赋值语句。但在后测试循环结构中，此语句有时是冗余的，可以省略，因为 `x` 的初始化可以直接在循环内部发生。\n\
  - `Boolean_Expression(x)` 可以是从简单到复杂的任何依赖变量 `x` 的布尔表达式。\n- `Update/alter x` 是任何更改\
  \ `x` 值的语句，例如另一个输入语句、使用值赋值运算符（`=`）的赋值语句，甚至是复合赋值运算符。重要的是，该语句必须位于循环布尔表达式求值之前。这意味着它应该是循环内的最后语句之一。\n\
  \n以下是使用“终极”规则的几个示例。\n\n**示例 1**\n\n```\na = Integer.parseInt(cin.nextLine());  //a\
  \ 的初始化\nwhile (a > 0) {  //依赖于 a 的布尔表达式\n    System.out.println(a);\n    a = a -\
  \ 1;  //a 的更新/更改\n}\n```\n\n**示例 2**\n\n```\na = Integer.parseInt(cin.nextLine());\
  \   //a 的初始化\nb = Integer.parseInt(cin.nextLine());   //b 的初始化\nwhile (a > b) {\
  \  //依赖于 a 和 b 的布尔表达式\n    System.out.println(a + \" \" + b);\n    a = Integer.parseInt(cin.nextLine());\
  \   //a 的更新/更改\n    b = Integer.parseInt(cin.nextLine());   //b 的更新/更改\n}\n```\n\
  \n**示例 3**\n\n```\ns = 0;  //s 的初始化\ndo {\n    y = Integer.parseInt(cin.nextLine());\n\
  \    s = s + y;  //s 的更新/更改\n} while (s < 1000);  //依赖于 s 的布尔表达式\n```\n\n**示例 4**\n\
  \n```\ny = 0;  //y 的初始化\ndo {\n    y = Integer.parseInt(cin.nextLine());  //y 的更新/更改\n\
  } while (y < 0);  //依赖于 y 的布尔表达式\n```\n\n在这个示例中，变量 `y` 在循环外的初始化是冗余的，可以省略，如下所示。\n\
  \n```\ndo {\n    y = Integer.parseInt(cin.nextLine());  //y 的初始化和更新/更改\n} while\
  \ (y < 0);  //依赖于 y 的布尔表达式\n```\n\n**示例 5**\n\n```\nodd = 0;   //odd 的初始化\neven\
  \ = 0;  //even 的初始化\nwhile (odd + even < 5) {  //依赖于 odd 和 even 的布尔表达式\n    x =\
  \ Integer.parseInt(cin.nextLine());\n    if (x % 2 == 0) {\n        even++;  //even\
  \ 的更新/更改\n    }\n}\n```\n（此处 odd 的更新/更改）\n\n现在你将意识到为什么应该遵循“终极”规则。乍看之下是正确的，让我们来看看以下代码片段：\n\
  \n```java\nint positivesCount;\ndouble x;\npositivesCount = 0;\nwhile (positivesCount\
  \ != 3) {\n    x = Double.parseDouble(cin.nextLine());\n    if (x > 0) {\n     \
  \   positivesCount++;\n    }\n}\n```\n\n这段代码看起来是正确的。让我们假设用户输入了 5, -10, -2, 4, 20。这个追踪表可以帮助你确定问题所在。\n\
  \n| Step | 语句 | Notes | positivesCount | x |\n| --- | --- | --- | --- | --- |\n\
  | 1 | `positivesCount = 0;` | | 0 | |\n| 2 | `x = Double.parseDouble(cin.nextLine());`\
  \ | | 0 | 5.0 |\n| 3 | `while (positivesCount != 3)` | 结果为真 | 0 | 5.0 |\n| 4 | `if\
  \ (x > 0)` | 结果为真 | 0 | 5.0 |\n| 5 | `positivesCount++;` | | 1 | 5.0 |\n| 6 | `x\
  \ = Double.parseDouble(cin.nextLine());` | | 1 | -10.0 |\n| 7 | `while (positivesCount\
  \ != 3)` | 结果为真 | 1 | -10.0 |\n| 8 | `if (x > 0)` | 结果为假 | 1 | -10.0 |\n| 9 | `x\
  \ = Double.parseDouble(cin.nextLine());` | | 1 | -2.0 |\n| 10 | `while (positivesCount\
  \ != 3)` | 结果为真 | 1 | -2.0 |\n| 11 | `if (x > 0)` | 结果为假 | 1 | -2.0 |\n| 12 | `x\
  \ = Double.parseDouble(cin.nextLine());` | | 1 | 4.0 |\n| 13 | `while (positivesCount\
  \ != 3)` | 结果为真 | 1 | 4.0 |\n| 14 | `if (x > 0)` | 结果为真 | 1 | 4.0 |\n| 15 | `positivesCount++;`\
  \ | | 2 | 4.0 |\n| 16 | `x = Double.parseDouble(cin.nextLine());` | | 2 | 20.0 |\n\
  | 17 | `while (positivesCount != 3)` | 结果为真 | 2 | 20.0 |\n| 18 | `if (x > 0)` |\
  \ 结果为真 | 2 | 20.0 |\n| 19 | `positivesCount++;` | | 3 | 20.0 |\n| 20 | `x = Double.parseDouble(cin.nextLine());`\
  \ | | 3 | ??? |\n\n这就是逻辑错误所在！在第 20 步，尽管用户提供的正数总数已经是三个，且你预期执行结束，但遗憾的是用户仍然被要求输入额外的数字！但是，你需要的是能让用户输入三个正数的代码片段，而不是四个，对吧？\n\
  \n\n\n\n\n这就是为什么你应该始终遵循规程！让我们来看看这段代码片段应该如何编写。\n\n由于 `while` 循环的布尔表达式依赖于变量 `positivesCount`，因此该变量必须在循环外部初始化。该变量还必须在循环内部进行更新/修改。执行此更新/修改的语句必须是循环内的最后一条语句，如下所示代码片段（通用形式）所示。\n\
  \n```\npositivesCount = 0;            // positivesCount 的初始化\nwhile (positivesCount\
  \ != 3) {  // 这依赖于 positivesCount\n    A statement or block of statements\n    if\
  \ (x > 0) {\n        positivesCount += 1; // positivesCount 的更新/修改\n    }\n}\n```\n\
  \n现在，你可以添加任何必要的语句来完成代码。你在这里需要添加的语句是让用户输入数字的语句（这必须在循环内完成）以及显示最后消息的语句（这必须在循环完成所有迭代后完成）。因此，最终的代码片段变为\n\
  \n```java\nint positivesCount;\ndouble x;\npositivesCount = 0;\nwhile (positivesCount\
  \ != 3) {\n    x = Double.parseDouble(cin.nextLine());\n    if (x > 0) {\n     \
  \   positivesCount += 1;\n    }\n}\nSystem.out.println(\"Three Positives provided!\"\
  );\n```\n\n### 29.4 跳出循环\n\n循环可能会消耗过多的 CPU 时间，因此在使用它们时必须非常小心。有时，你需要在循环完成所有迭代之前跳出或结束循环，通常是在满足特定条件时。\n\
  \n假设有一个隐藏密码，你通过某种方式知道它是三个字符长度，且只包含数字。下面的 `for` 循环执行了 900 次迭代，试图通过暴力破解找到那个隐藏密码。\n\
  \n```java\nfound = false;\nfor (i = 100; i <= 999; i++) {\n    if (i == hiddenPassword)\
  \ {\n        password = i;\n        found = true;\n    }\n}\nif (found == true)\
  \ {\n    System.out.println(\"Hidden password is: \" + password);\n}\n```\n\n![](img/notice.jpg)\
  \ 暴力破解是获取任何受密码保护的访问权限最简单的方法。攻击者尝试字母、数字和符号的组合，希望能最终猜对。\n\n现在，假设隐藏密码是 `123`。正如你所知道的，`for`\
  \ 循环按指定的次数迭代，在这种情况下，它并不关心隐藏密码是否被找到。尽管密码在第 $24$ 次迭代中就被找到了，但遗憾的是仍然继续迭代，直到变量 `i` 达到\
  \ `999` 的值，从而浪费了 CPU 时间。\n\n有人可能会认为 800 – 900 次迭代并不是什么大事，他们可能是正确的。然而，在大规模数据处理中，每一次迭代都至关重要。因此，在使用循环控制结构时要非常小心，特别是那些迭代次数过多的结构。如果隐藏密码是十位数的呢？这意味着\
  \ `for` 循环必须执行 9,000,000,000 次迭代！\n\n有两种方法可以帮助你让像之前的程序运行得更快。这两种方法的核心思想都是：在满足特定条件时跳出循环；在这种情况下，就是找到隐藏密码时。\n\
  \n#### 第一种方法——使用 `break` 语句\n\n你可以通过 `break` 语句在循环实际完成所有迭代之前跳出循环。\n\n看下面的 Java 程序。当找到隐藏密码时，执行流立即退出（跳出）`for`\
  \ 循环。\n\n```java\nfound = false;\nfor (i = 100; i <= 999; i++) {\n    if (i == hiddenPassword)\
  \ {\n        password = i;\n        found = true;\n        break;\n    }\n}\nif\
  \ (found) {\n    System.out.println(\"Hidden password is: \" + password);\n}\n```\n\
  \n![](img/notice.jpg) 语句 `if (found)` 等同于语句 `if (found == true)`。\n\n#### 第二种方法——使用标志位\n\
  \n`break` 语句并不是在所有计算机语言中都存在；由于本书的意图是教你“算法思维”（而不仅仅是 Java 支持的特殊语句），让我们来看另一种方法。\n\n\
  在下面的 Java 程序中，当找到隐藏密码时，布尔表达式 `found == false` 强制执行流退出循环。\n\n```java\nfound = false;\n\
  i = 100;\nwhile (found == false && i <= 999) {\n    if (i == hiddenPassword) {\n\
  \        password = i;\n        found = true;\n    }\n    i++;\n}\nif (found) {\n\
  \    System.out.println(\"Hidden password is: \" + password);\n}\n```\n\n![](img/notice.jpg)\
  \ 将变量 `found` 视为一个标志位。初始时，标志位未“标记”（`found = false`）。执行流进入循环，只要标志位保持关闭状态（`while found\
  \ == false ...`），就会继续迭代。当循环内发生触发标志位的事件时（给变量 `found` 赋值为 `true`），执行流退出循环。\n\n![](img/notice.jpg)\
  \ `while (found == false && i <= 999)` 可以改写为 `while (!found && i <= 999)`。\n\n###\
  \ 29.5 优化循环\n\n循环可能会消耗过多的 CPU 时间，因此在使用它们时必须非常小心。虽然有时许多次迭代是不可避免的，但总有一些方法可以让循环运行得更好。下面的代码片段计算和：\n\
  \n```\ns = 0;\ni = 1;\ndo {\n    countOfNumbers = 10000;\n    s = s + i;\n    i++;\n\
  } while (i <= countOfNumbers);\n```\n\n在使用循环时你应该始终记住（特别是那些执行次数很多的循环），要避免在循环内部放置没有任何意义的语句。在之前的例子中，`countOfNumbers\
  \ = 10000` 就是这样的语句。不幸的是，只要它位于循环内部，就会执行 10000 次。\n\n为了解决这个问题，你只需将该语句移动到循环之外，如下：\n\
  \n```\ncountOfNumbers = 10000;\ns = 0;\ni = 1;\ndo {\n    s = s + i;\n    i++;\n\
  } while (i <= countOfNumbers);\n```\n\n#### 练习 29.5-1 优化循环\n\n下面的代码片段计算了数字的平均值。尝试在循环外移动尽可能多的语句以使程序更高效。\n\
  \n```java\ns = 0;\nfor (i = 1; i <= 10000; i++) {\n    s = s + i;\n    average =\
  \ s / 10000;\n}\n```\n\n解答\n\n新手程序员在计算平均值时一个非常常见的错误是将总和除以数量的语句（这里是 `average = s\
  \ / 10000`）放在循环内部。想想！假设你想计算学校的平均成绩。你的第一步是计算你修读的所有 10 门课程的成绩和。然后，在所有成绩都求和后，再将总和除以\
  \ 10。这意味着你执行了 10 次加法而只有一次除法。\n\n![](img/notice.jpg) 计算平均值是一个两步骤的过程。\n\n因此，在循环内部计算平均值是没有意义的。你可以将此语句移动到循环之后，让循环仅用于求和如下：\n\
  \n```java\ns = 0;\nfor (i = 1; i <= 10000; i++) {\n    s = s + i;\n}\naverage =\
  \ s / 10000;\n```\n\n#### 练习 29.5-2 优化循环\n\n下一个公式\n\n![Image](img/chapter29-02.png)\n\
  \n使用以下代码片段求解，其中 `N` 由用户提供。\n\n```java\nint n, i, j, denom;\ndouble s;\nSystem.out.print(\"\
  Enter N: \");\nn = Integer.parseInt(cin.nextLine());\ns = 0;\nfor (i = 1; i <= n;\
  \ i++) {\n    denom = 0;\n    for (j = 1; j <= n; j++) {\n        denom += Math.pow(j,\
  \ j);\n    }\n    s += i / (double)denom;\n}\nSystem.out.println(s);\n```\n\n\n\n\
  \n正如你从公式中看到的，分母对于所有分数都是相同的。因此，对每个分数反复计算它是没有意义的。你只需要计算一次分母并多次使用该结果，如下：\n\n```java\n\
  int n, i, j, denom;\ndouble s;\nSystem.out.print(\"Enter N: \");\nn = Integer.parseInt(cin.nextLine());\n\
  denom = 0;\nfor (j = 1; j <= n; j++) {\n    denom += Math.pow(j, j);\n}\ns = 0;\n\
  for (i = 1; i <= n; i++) {\n    s += i / (double)denom;\n}\nSystem.out.println(s);\n\
  ```\n\n### 29.6 死循环以及如何停止它们\n\n所有的 `while` 循环内部必须包含某种最终能引导执行流退出循环的内容。但错误确实会发生！例如，下面的代码段包含一个死循环。不幸的是，程序员忘记在循环内部增加变量\
  \ `i`；因此，变量 `i` 永远无法达到 `10` 这个值。\n\n```java\ni = 1;\nwhile (i != 10) {\n    System.out.println(\"\
  Hello there!\");\n}\n```\n\n如果一个循环无法停止迭代，它被称为死循环或无限循环。\n\n程序员可能犯的另一个错误如下：\n\n```java\n\
  i = 1;\nwhile (i != 10) {\n    System.out.println(\"Hello there!\");\n    i += 2;\n\
  }\n```\n\n尽管这段代码段确实包含一个在循环内部增加变量 `i` 的语句（`i += 2`），但不幸的是，执行流永远不会退出循环，因为值 `10` 永远没有赋值给变量\
  \ `i`。\n\n死循环会永远迭代下去，停止它迭代的唯一方法是使用“魔法力量”！例如，当 Windows 操作系统中的应用程序“卡住”（可能可能是因为执行流进入了死循环），用户必须使用组合键\
  \ `ALT+CTRL+DEL` 来强制结束应用程序。\n\n在 Visual Studio Code 中，当你不小心编写并执行了死循环时，只需点击工具栏上的“停止”（Stop）图标，执行就会停止。\n\
  \n在 Visual Studio Code 中，强制结束应用程序的另一种方法是在终端（Terminal）窗口中使用组合键 `CTRL+C`。\n\n### 29.7\
  \ “从内到外”方法\n\n“从内到外”是本书提出的一个方法，帮助你从内而外地学习“算法思维”。这种方法首先处理并设计内部（嵌套）控制结构，然后随着算法（或程序）的开发，添加越来越多的控制结构，并将之前的结构嵌套其中。这种方法可以用于大型且复杂的控制结构，因为它能帮助你设计无错误的流程图，甚至是\
  \ Java 程序。本书在任何必要的地方都会使用这种方法。\n\n让我们尝试下面的例子。\n\n编写一个 Java 程序，显示所示的乘法表。\n\n根据“从内到外”方法，你从编写内部控制结构开始，当一切测试通过并运行良好后，你可以添加外部控制结构。\n\
  \n那么，让我们尝试只显示乘法表的第一行。检查这一行，你会发现，在每次乘法中，乘数始终是 1。我们将乘数考虑为值为 `1` 的变量 `i`。只显示乘法表第一行的循环控制结构如下：\n\
  \n```java\nfor (j = 1; j <= 10; j++) {\n    System.out.print(i + \"x\" + j + \"\
  =\" + i * j + \"\\t\");\n}\n```\n\n如果你执行这段代码段，结果是……\n\n特殊字符序列 `\\t` 在每次迭代后“显示”一个制表符。这确保了所有内容都对对齐。\n\
  \n内部（嵌套）循环控制结构准备就绪。你现在需要一种执行该控制结构九次的方法，但每次变量 `i` 必须包含一个从 1 到 9 的不同值。可以通过以下方式实现：\n\
  \n```java\nfor (i = 1; i <= 9; i++) {\n    // 代码段 1：显示乘法表的单行\n    System.out.println();\n\
  }\n```\n\n`System.out.println()` 语句用于“显示”行之间的换行。\n\n在将代码段 1 嵌入主代码（Main Code）后，最终的\
  \ Java 程序变为：\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int i, j;\n    for (i = 1; i <= 9; i++) {\n        for (j = 1; j <= 10;\
  \ j++) {\n            System.out.print(i + \"x\" + j + \"=\" + i * j + \"\\t\");\n\
  \        }\n        System.out.println();\n    }\n}\n```\n\n### 29.8 复习题：判断题\n\n\
  对以下每个陈述进行对/错判断。\n\n1) 当迭代次数未知时，你可以使用确定循环（definite loop）。\n2) 当迭代次数已知时，你不能使用后测试循环（post-test\
  \ loop）。\n3) 根据“终极”规则（Ultimate rule），在预测试循环中，参与循环表达式的变量初始化必须在循环内部完成。\n4) 根据“终极”规则，在预测试循环中，更新/更改参与循环表达式的变量值的语句必须是循环内的最后一个语句。\n\
  5) 根据“终极”规则，在后测试循环中，参与循环表达式的变量的初始化有时可以在循环内部完成。\n6) 根据“终极”规则，在后测试循环中，参与循环表达式的变量的更新/更改必须是循环内的第一个语句。\n\
  7) 在 Java 中，你可以使用 `exit` 语句在迭代完成之前跳出循环。\n8) 将常量值赋值给变量的语句存放在循环结构内部更好。\n9) 在下面的代码段中，至少有一个语句可以移动到\
  \ for 循环之外：\n`for (i = 1; i <= 30; i++) { a = \"Hello\"; System.out.println(a);\
  \ }`\n10) 在下面的代码段中，至少有一个语句可以移动到 while 循环之外：\n`s = 0; count = 1; while (count < 100)\
  \ { a = Integer.parseInt(cin.nextLine()); s += a; average = s / (double)count; count++;\
  \ } System.out.println(average);`\n11) 在下面的代码段中，至少有一个语句可以移动到 while 循环之外：\n`s = 0;\
  \ y = Integer.parseInt(cin.nextLine()); while (y != -99) { s = s + y; y = Integer.parseInt(cin.nextLine());\
  \ }`\n12) 下面的代码段满足有限性属性：`i = 1; while (i != 100) { System.out.println(\"Hello there!\"\
  ); i += 5; }`\n13) 当在预测试循环结构的布尔表达式不等于 ( != ) 比较运算符时，循环将永远无限迭代。\n14) 下面的代码段满足有限性属性：`i\
  \ = 0; do { System.out.println(\"Hello there!\"); i += 5; } while (i < 100);`\n\n\
  ### 29.9 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\n\n\n\n\n1) 当迭代次数未知时，你可以使用：\na) 先测试循环结构。\n\
  b) 后测试循环结构。\nc) 以上所有。\n\n2) 当迭代次数已知时，你可以使用：\na) 先测试循环结构。\nb) 后测试循环结构。\nc) `for`-循环。\n\
  d) 以上所有。\n\n3) 根据“终极规则”（Ultimate rule），在先测试循环结构中，参与循环布尔表达式的变量初始化必须在：\na) 循环内部完成。\n\
  b) 循环外部完成。\nc) 以上。\n\n4) 根据“终极规则”，在先测试循环结构中，参与循环布尔表达式的变量更新/修改必须在：\na) 循环内部完成。\n\
  b) 循环外部完成。\nc) 以上。\n\n5) 根据“终极规则”，在后测试循环结构中，参与循环布尔表达式的变量初始化可以在：\na) 循环内部完成。\nb)\
  \ 循环外部完成。\nc) 以上任意。\n\n6) 在以下代码段中：\n```\ns = 0;\nfor (i = 1; i <= 100; i++) {\n\
  \    s = s + i;\n    x = 100.0;\n    average = s / x;\n}\n```\n可以移动到 `for`-循环之外的语句数量是：\n\
  a) 0。\nb) 1。\nc) 2。\nd) 3。\n\n7) 当此比较运算符用在后测试循环结构的布尔表达式中时，循环将无限循环下去。\na) ====\n\
  b) !=\nc) 取决于情况\n\n### 29.10 复习练习题\n\n完成以下练习。\n\n1) 下列程序旨在提示用户反复输入名称，直到输入单词“STOP”（作为名称使用）。在结束时，程序必须显示输入的名称总数，以及这些名称中有多少个不是“John”。\n\
