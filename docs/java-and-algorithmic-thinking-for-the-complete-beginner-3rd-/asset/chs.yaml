  d) 以上都不是。\n\n# 第 7 章：运算符\n\n### 7.1 赋值运算符\n\nJava 中最常用的运算符是值赋值运算符 (`=`)。例如，以下 Java\
  \ 语句将值 5 赋值给变量 `x`。\n\n```java\nx = 5;\n```\n\n正如你在第 5 章 中读看到的，这等同于流程图中使用的左箭头。\n\
  \n.![Image](img/chapter07-01.png)\n\n流程图中使用的左箭头可能比 (`=`) 符号更方便、更清晰，因为它直观地展示了右侧的值或表达式的结果被赋值给左侧的变量。\n\
  \n注意的是，(`=`) 符号不等同于数学中使用的符号。在数学中，表达式 `x = 5` 读作“x 等于 5”。但在 Java 中，表达式 `x = 5` 读作“将值\
  \ 5 赋值给 x”或“将 x 设置为 5”。它们看起来一样，但作用不同！\n\n例如，在数学中，以下两行是等价的。第一行可以读作“x 等于 y 和 z 之和”，第二行读作“y\
  \ 和 z 之和等于 x”。\n\n```math\nx = y + z\ny + z = x\n```\n\n另一方面，在 Java 中，这两个语句绝对不等价。\n\
  \n```java\nx = y + z;\ny + z = x;\n```\n\n第一个语句是一个有效的 Java 语句，表示“将 y 和 z 之和赋值给 x”。然而，第二个语句是无效，因为它试图将\
  \ `x` 的值赋值给 `y + z`，这在 Java 中是不允许的！\n\n![](img/remember.jpg) 在 Java 中，(`=`) 符号左侧的变量代表内存（RAM）中的一个区域，可以在那里存储值。\n\
  \n![](img/remember.jpg) 在 Java 中，(`=`) 符号左侧的变量代表内存（RAM）中的一个区域，可以在那里存储值。\n\n表 7-1：值赋值\n\
  \n| 示例 | 描述 |\n| --- | --- |\n| `a = 9;` | 将值 9 赋值给 `a`。 |\n| `b = c;` | 将 `c` 的内容赋值给\
  \ `b`。 |\n| `d = \"Hello Zeus\";` | 将字符串 Hello Zeus 赋值给 `d`。 |\n| `d = a + b;` |\
  \ 计算 `a` 和 `b` 之和并将结果赋值给 `d`。 |\n| `b = x + 1;` | 计算 `x` 的内容和 1 之和并将结果赋值给 `b`。 |\n\
  | `x = x + 1;` | 换句话说，增加 `x` 1。 |\n\n\n\n\n如果你需要乘以两个数字或两个变量的内容，必须使用星号（`*`）符号。例如，如果你想用\
  \ `2` 乘以 `y`，你必须写 `2 * y`。\n\n![](img/notice.jpg)在数学中，跳过乘法运算符并写成 `3x` 是合法的，意思是“3\
  \ 乘以 x”。但在 Java 中，任何存在乘法操作的地方都必须始终使用星号。这是初学者程序员在 Java 中编写数学表达式时最常见的错误之一。\n\n要执行除法，你必须使用斜杠（`/`）符号。例如，如果你想将\
  \ `10` 除以 `2`，你必须写 `10 / 2`。\n\n然而，重要的是，在 Java 中，两个整数相除的结果始终是一个整数。因此，在表达式 `7 / 2`\
  \ 中，由于数字 `7` 和 `2` 都是整数，结果是 `3`（而不是人们可能错误预期的 `3.5`）。相比之下，在表达式 `7.0 / 2` 中，至少有一个数字是实数（`float`），结果确实是\
  \ `3.5`。\n\n以下三个语句是等价的。它们都输出值 `3.5`。\n\n```\nSystem.out.println(7.0 / 2);\nSystem.out.println(7\
  \ / 2.0);\nSystem.out.println(7.0 / 2.0);\n```\n\n取模运算符（`%`）返回整数除法的余数，这意味着语句\n\n\
  ```\nc = 13 % 3;\n```\n\n将变量 `c` 赋值为 `1`。\n\n取模运算符（`%`）也可以用于浮点数，但结果是实数（`float`）。例如，操作\n\
  \n```\nd = 14.4 % 3;\n```\n\n将变量 `d` 赋值为 `2.4`（而不是你可能错误预期的 `2`）。\n\n![](img/notice.jpg)请记住，流程图是用于表示算法的一种松散方法。虽然流程图中允许使用取模（`%`）运算符，但本书使用了通常接受的\
  \ `MOD` 运算符！例如，Java 语句 `y = 13 % 3` 在流程图中表示为\n\n.![Image](img/chapter07-04.png)\n\
  \n在数学中，如你已经所知，你可以使用圆括号（round brackets）以及大括号（curly brackets）和中括号（square brackets），如下表达式所示。\n\
  \n.![Image](img/chapter07-06.png)\n\n然而，在 Java 中没有大括号和中括号。你只有圆括号；因此，相同的表达式必须使用圆括号而不是大括号或中括号。\n\
  \n```\ny = 5.0 / 2.0 * (3 + 2 * (4 + 7 * (6 – 4.0 / 3.0)));\n```\n\n### 7.3 算术运算符的优先级是什么？\n\
  \n算术运算符遵循与数学相同的优先级规则，这些规则是：先执行乘法和除法，后执行加减法。\n\n| 高优先级 ![Image](img/arrow_up.jpg)\
  \ | 低优先级 | 算术运算符 |\n| --- | --- | --- |\n| `*`, `/`, `%` | | |\n| `+`, `−` | | |\n\
  \n当乘法和除法出现在同一个表达式中时，由于它们的优先级相同，它们从左到右执行（与阅读的方式相同），这意味着表达式\n\n```\ny = 6 / 3 * 2;\n\
  ```\n\n等价于 ![Image](img/chapter07-07.png)，并给变量 `y` 赋值 `4`（除法在乘法之前执行）。\n\n然而，如果你想让乘法在除法之前执行，可以使用圆括号来改变优先级。这意味着\n\
  \n```\ny = 6 / (3 * 2);\n```\n\n等价于 ![Image](img/chapter07-08.png)，并给变量 `y` 赋值 `1`（乘法在除法之前执行）。\n\
  \n![](img/notice.jpg)请记住，在 Java 中无法以 ![Image](img/chapter07-09.png) 或 ![Image](img/chapter07-10.png)\
  \ 的形式写分数。放弃吧！Visual Studio Code 或任何 IDE 中都没有方程编辑器。所有的分数必须写在单行上。例如，![Image](img/chapter07-09.png)\
  \ 必须写成 `6 / 3`，而 ![Image](img/chapter07-10.png) 必须写成 `(4 * x + 5) / 6`。\n\n操作顺序可以总结如下：\n\
  \n1) 任何圆括号内的操作首先执行。\n2) 其次，任何乘法和除法操作从左到右执行。\n3) 最后，任何加减法操作从左到右执行。\n\n所以，在下一个示例中\n\
  \n```\ny = 12 + (20 + 3) - 8 / 4 * 3;\n```\n\n操作执行如下：\n\n![Image](img/chapter07-11.png)\n\
  \n### 7.4 复合赋值运算符\n\nJava 提供了一组特殊的运算符，称为复合赋值运算符，可以帮助你更快地编写代码。这些运算符在下表中进行了详细说明。每个运算符都提供了一个示例，而“等于”列显示了不使用复合赋值运算符的对应语句。\n\
  \n| 运算符 | 描述 | 示例 | 等于 |\n| --- | --- | --- | --- |\n| `+=` | 加赋值 | `a += b;` |\
  \ `a = a + b;` |\n| `−=` | 减赋值 | `a −= b;` | `a = a − b;` |\n| `*=` | 乘赋值 | `a *=\
  \ b;` | `a = a * b;` |\n| `/=` | 除赋值 | `a /= b;` | `a = a / b;` |\n| `%=` | 取模赋值\
  \ | `a %= b;` | `a = a % b;` |\n\n\n\n正如你在“等于”列中所看到的，显然你只需使用经典的赋值运算符（`=`）即可获得相同的结果。尽管如此，选择这些新运算符不仅生产率更高，而且提高了效率。\n\
  \n让我们来看一个增加运算符的示例：\n\n```java\na = b = 5;++a;    //这等于 a = a + 1\nb++;    //这等于\
  \ b = b + 1\nSystem.out.println(a);  //它显示: 6\nSystem.out.println(b);  //它显示: 6\n\
  ```\n\n![](img/remember.jpg)双斜杠（`//`）表示后面的文本是注释；因此，它永远不会被执行。\n\n在上一个例子中，前置增和和后置增运算符将变量\
  \ `a` 和 `b` 加了 1！那么，陷阱在哪里呢？这两个运算符等价吗？答案是“是”，但仅限于这个特定的用例。在其他情况下，答案可能是“否”。这两个运算符之间存在细微的差异。\n\
  \n让我们找出这个差异！规则是：前置增/减运算符先执行增/减操作，然后交付新值。后置增/减运算符先交付旧值，然后执行增/减操作。仔细看接两个例子。\n\n```java\n\
  a = 5;b = ++a;\nSystem.out.println(a);  //它显示: 6\nSystem.out.println(b);  //它显示:\
  \ 6\n```\n\n以及\n\n```java\na = 5;b = a++;\nSystem.out.println(a);  //它显示: 6\nSystem.out.println(b);\
  \  //它显示: 5\n```\n\n在第一个例子中，变量 `a` 加了 1，然后将其新值赋值给 `b`。最后，两个变量的值都是 6。\n\n在第二个例子中，变量\
  \ `a` 的值 5 被赋值给 `b`，然后 `a` 加了 1。最后，`a` 的值为 6，但 `b` 的值为 5！\n\n为了提高程序的效率，可以直接在表达式中使用增/减运算符，如下例所示。\n\
  \n```java\na1 = a2 = 5;\nb = --a1 * 2;\nSystem.out.println(b);  //它显示: 8\nSystem.out.println(a2++);\
  \  //它显示: 5\nSystem.out.println(a2);  //它显示: 6\n```\n\n### 7.6 字符串运算符\n\n将两个独立的字符串合并成一个字符串称为拼接。你可以使用两个运算符来拼接（连接）字符串，如附表所示。\n\
  \n| 运算符 | 描述 | 示例 | 等于 |\n| --- | --- | --- | --- |\n| + | 拼接 | `a = \"Hi\" + \"\
  \ there\"` | --- |\n| += | 拼接赋值 | `a += \"Hello\"` | `a = a + \"Hello\"` |\n\n以下代码段显示“What's\
  \ up, dude?”。\n\n```java\nString a, b, c;\na = \"What's \";\nb = \"up, \";\nc =\
  \ a + b;\nc += \"dude?\";\nSystem.out.println(c);\n```\n\n#### 7.6-1 拼接姓名\n\n编写一个\
  \ Java 程序，提示用户输入他们的名和姓（分配给两个变量）。然后将它们合并成一个字符串（拼接）并显示在用户的屏幕上。\n\n解决方案\n\n这里显示了 Java\
  \ 程序。\n\n```java\npublic static void main(String[] args) throws Exception {\n  \
  \  String firstName, lastName, fullName;\n    System.out.print(\"Enter first name:\
  \ \");\n    firstName = System.nextLine();\n    System.out.print(\"Enter last name:\
  \ \");\n    lastName = System.nextLine();\n    fullName = firstName + \" \" + lastName;\n\
  \    System.out.println(fullName);\n}\n```\n\n![](img/notice.jpg)注意名和姓之间添加了额外的空格。\n\
  \n### 7.7 复习题：判断对错对对以下每个陈述判断对或错。\n\n1. 语句 `x = 5` 可以读作“变量 x 等于 5”。\n2. 赋值运算符将表达式的结果赋值给变量。\n\
  3. 字符串只能通过使用 `nextLine()` 语句赋值给变量。\n4. 语句 `5 = y` 将值 5 赋值给变量 `y`。\n5. 在赋值运算符的右侧必须始终存在算术运算符。\n\
  6. 在赋值运算符的右侧只能存在变量。\n7. 你不能在赋值运算符的两侧使用同一个变量。\n8. 语句 `a = a + 1` 将变量 `a` 减了 1。\n\
  9. 语句 `a = a + (-1)` 将变量 `a` 减了 1。\n10. 在 Java 中，`MOD` 是一个关键字。\n11. 语句 `x = 0 %\
  \ 5` 将值 5 赋值给变量 `x`。\n12. 操作 `5 % 0` 是可能的。\n13. 在算术运算符中，加法和减法的优先级最高。\n14. 当除法和乘法运算符在表达式中共存时，先执行乘法操作。\n\
