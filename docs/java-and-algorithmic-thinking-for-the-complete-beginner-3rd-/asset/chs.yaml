  \n编写一个 Java 程序，提示用户输入一个句子并统计句子中每个元元的频率。使用 hashmap 将元元作为键，将频率作为值。\n\n解决方案\n\n在编程领域，对文本数据的处理和分析至关重要。一项常见的任务是统计特定元素的频率，这可以揭示其语言特征。\n\
  \n在下面的解决方案中，程序通过创建一个 hashmap `vowelsFrequency` 来存储元元（A、E、I、O、U）的频率，并将频率设置为零。对于用户提供的句子中的每个字符，程序检查它是否为元元，如果是，则更新\
  \ hashmap 中对应的计数。\n\n![](img/my_exercise_header.png)\n```java\npublic static void\
  \ main(String[] args) throws Exception {\n    int i;\n    String letter;\n    //创建一个\
  \ hashmap 来存储每个元元的频率，初始频率为零。\n    HashMap<String, Integer> vowelsFrequency = new\
  \ HashMap<>(\n        Map.of(\"A\", 0, \"E\", 0, \"I\", 0, \"O\", 0, \"U\", 0)\n\
  \    );\n    System.out.print(\"Enter an English sentence: \");\n    String sentence\
  \ = cin.nextLine();\n    //遍历用户提供句子的字符，如果是元元，更新（增加）vowelsFrequency hashmap 中对应的计数。\n\
  \    for (i = 0; i < sentence.length(); i++) {\n        letter = (\"\" + sentence.charAt(i)).toUpperCase();\n\
  \        if (vowelsFrequency.containsKey(letter)) {\n            vowelsFrequency.put(letter,\
  \ vowelsFrequency.get(letter) + 1);\n        }\n    }\n    //显示每个元元的频率\n    for\
  \ (String vowel : vowelsFrequency.keySet()) {\n        System.out.println(vowel\
  \ + \": \" + vowelsFrequency.get(vowel));\n    }\n}\n```\n\n![](img/remember.jpg)要在项目中使用\
  \ `HashMap` 和 `Map` 类，你需要在项目开头使用 `import java.util.HashMap` 和 `import java.util.Map`\
  \ 语句导入相应的库。\n\n![](img/remember.jpg)Java 内置方法 `struct.containsKey(key_name)` 当 hashmap\
  \ `struct` 的键集合包含指定的键 `key_name` 时返回 true。\n\n![](img/notice.jpg)语句 `if (vowelsFrequency.containsKey(letter))`\
  \ 等于语句 `if (vowelsFrequency.containsKey(letter) == true).`。\n\n### 34.7 复习题：判断对错\n\
  \n对以下每个陈述选择对或错。\n\n\n\n\n\n# 排序与搜索算法\n\n1) 泡排序算法（当按升序排列数组时）的主要思想是重复地将数组中最小的元素移动到索引位置。\n\
  2) 在按升序排序的数组中，第一个元素是所有元素最大的。\n3) 使用泡排序算法时，总交换次数取决于给定的数组。\n4) 泡排序算法执行交换次数最多的情况是当你想要对一个已经按升序排序的数组进行降序排序时。\n\
  5) 在泡排序算法中，当决策控制结构测试布尔表达式 `A[n] > A[n − 1]` 时，意味着数组 `A` 的元素正在按降序排序。\n6) 在 `Java`\
  \ 中，排序算法比较字母的方式与比较数字的方式不同。\n7) 如果你想对数组 `A` 进行排序，但要保留与数组 `B` 元素的一一对应关系，你必须也重新排列数组\
  \ `B` 的元素。\n8) 泡排序算法的性能有时优于改进后的泡排序算法。\n9) 根据泡排序算法，在每次遍历中（最后一次除外），只有一个元素被保证放置在正确的位置。\n\
  10) 泡排序算法只能通过 `for-loops` 实现。\n11) 快速排序算法不能用于对二维数组的每一列进行排序。\n12) 插入排序算法可以按降序或升序排序。\n\
  13) 最快的排序算法之一是改进后的泡排序算法。\n14) 对于一个包含 `N` 个元素的一维数组，泡排序算法执行 ![Image](img/chapter34-49.png)\
  \ 次比较。\n15) 对于一个包含 `N` 个元素的一维数组，泡排序算法执行 ![Image](img/chapter34-50.png) 次遍历。\n16)\
  \ 使用改进后的泡排序算法时，如果执行了一次完整的遍历且没有发生交换，则算法知道数组已经排序，无需再继续遍历。\n17) 使用选择排序算法时，如果你希望对数组进行降序排序，则需要寻找最大值。\n\
  18) 选择排序算法在主内存有限的计算机系统上表现良好。\n19) 选择排序算法适用于大规模数据操作。\n20) 选择排序算法是一种非常复杂的算法。\n21)\
  \ 插入排序算法的性能通常优于选择排序和泡排序算法。\n22) 插入排序算法有时证明比快速排序算法更快。\n23) 快速排序算法被认为是最好且最快的排序算法之一。\n\
  24) 排序后的数组只包含互不相同的元素。\n25) 搜索算法是在数据集中搜索具有特定特征的项的算法。\n26) 顺序搜索算法只能用于包含算术值的数组。\n27)\
  \ 最常用的搜索算法之一是快速搜索算法。\n28) 一种搜索算法被称为堆算法。\n29) 线性搜索（或顺序搜索）算法的工作方式如下：它 own 检查数组的最后一个元素是否等于给定值，然后检查倒数第二个元素，依此类推，直到到达数组开头或找到给定的值。\n\
  30) 在某些情况下，线性搜索算法可以比二分搜索算法更快地找到元素。\n31) 线性搜索算法可以用于大规模数据操作。\n32) 线性搜索算法不能用于已排序数组。\n\
  33) 二分搜索算法可以用于大规模数据操作。\n34) 如果数组包含多个多个相同值，二分搜索算法只能找到给定值的首次出现项。\n35) 使用搜索算法时，如果数组包含唯一值且找到了你正在查找的元素，则无需继续检查。\n\
  36) 二分搜索算法的主要缺点是数据需要经过排序。\n37) 二分搜索算法只能用于包含算术值的数组。\n38) 如果你查找的元素在数组的最后一个位置，从数组开头开始搜索的线性搜索算法将检查数组中的所有元素。\n\
  39) 线性搜索算法可以用于二维数组。\n40) 如果你使用二分搜索算法查找的元素位于至少有三个元素的数组的第一个位置，它只需一次迭代即可被找到。\n\n##\
