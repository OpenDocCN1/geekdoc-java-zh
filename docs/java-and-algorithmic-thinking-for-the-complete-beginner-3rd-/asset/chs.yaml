  \ 练习 13.1-3 显示经过时间\n\n编写一个 Java 程序，提示用户输入一个表示秒数的整数，然后以“DD day(s) HH hour(s) MM minute(s)\
  \ and SS second(s)”的格式显示它。例如，如果用户输入数字 700005，则必须显示“8 day(s) 2 hour(s) 26 minute(s)\
  \ and 45 second(s)”。\n\n#### Solution\n\n你可能已经知道，每分钟有 60 秒，每小时有 3600 秒（60 × 60），一天有\
  \ 86400 秒（3600 × 24）。让我们尝试使用你在上一个练习中学会的第一种方法来分析数字 700005。\n\n| 天数 | 描述 |\n| :---\
  \ | :--- |\n| Days = 8 | 如果使用 `(/)` 运算符和 `(int)` 类型转换运算符将用户提供的整数除以 86400，就可以分离出整数商\
  \ `days = (int)(700005 / 86400)` |\n| 剩余秒数 = 8805 | 如果再次将用户提供的整数除以 86400，这次使用 `(%)`\
  \ 运算符获取整数余数 `r = 700005 % 86400`，就可以分离出剩余秒数 |\n| 小时 = 2 | 如果使用 `(/)` 运算符和 `(int)`\
  \ 类型转换运算符将剩余秒数除以 3600，就可以分离出整数商 `hours = (int)(8805 / 3600)` |\n| 剩余秒数 = 1605 |\
  \ 现在剩余秒数是 `r = 8805 % 3600` |\n| 分钟 = 26 | 如果使用 `(/)` 运算符和 `(int)` 类型转换运算符将剩余秒数除以\
  \ 60，就可以分离出整数商 `minutes = (int)(1605 / 60)` |\n| 秒 = 45 | 最后一个余数恰好是剩余的秒数，即 `seconds\
  \ = 1605 % 60` |\n\n该算法的 Java 程序如下。\n\n![](img/my_exercise_header.png) Project_13.1-3a\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int days,\
  \ hours, minutes, number, r, seconds;\n    System.out.print(\"Enter a period of\
  \ time in seconds: \");\n    number = Integer.parseInt(cin.nextLine());\n    days\
  \ = (int)(number / 86400); // 60 * 60 * 24 = 86400\n    r = number % 86400;\n  \
  \  hours = (int)(r / 3600);         // 60 * 60 = 3600\n    r = r % 3600;\n    minutes\
  \ = (int)(r / 60);\n    seconds = r % 60;\n    System.out.println(days + \" day(s)\
  \ \" + hours + \" hour(s) \");\n    System.out.println(minutes + \" minute(s) and\
  \ \" + seconds + \" second(s)\");\n}\n```\n\n你也可以使用上一个练习中的第二种方法解决这个练习。你只需要首先除以 60，再次除以\
  \ 60，最后除以 24，如下所示![](img/my_exercise_header.png) Project_13.1-3b\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    int days, hours, minutes,\
  \ number, r, seconds;\n    System.out.print(\"Enter a period of time in seconds:\
  \ \");\n    number = Integer.parseInt(cin.nextLine());\n    days = (int)(number\
  \ / 86400); // 60 * 60 * 24 = 86400\n    r = number % 86400;\n    hours = (int)(r\
  \ / 3600);         // 60 * 60 = 3600\n    r = r % 3600;\n    minutes = (int)(r /\
  \ 60);\n    seconds = r % 60;\n    System.out.println(days + \" day(s) \" + hours\
  \ + \" hour(s) \");\n    System.out.println(minutes + \" minute(s) and \" + seconds\
  \ + \" second(s)\");\n}\n```\n\n#### 练习 13.1-4 反转数字\n\n编写一个 Java 程序，提示用户输入一个三位整数，然后显示其反转。例如，如果用户输入数字\
