  \n### 6) 编写一个 Java 程序，提示用户输入他们的姓名。程序必须在 1 到 24 之间选择一个随机整数代表一个小时，然后它必须显示消息“小时是 HH:00”，并根据该数字显示“Good\
  \ morning NN!”、“Good Evening NN!”、“Good Afternoon NN!”或“Good Night NN!”，其中 `HH`\
  \ 是随机选择的小时，`NN` 是用户的姓名。完成两次这个练习，一次使用嵌套决策结构，另一次使用多分支决策结构。\n\n### 7) 编写一个 Java 程序，提示用户输入三角形三条边的长度，然后判断用户提供的数字是否可以作为三角形三边的边。如果长度无效，则必须显示相应的消息；否则，程序必须进一步判断三角形是否是：\n\
  \na) 等边三角形（equilateral）\n* **提示**：在等边三角形中，所有边都相等。\n\nb) 直角三角形（right）\n* **提示**：使用勾股定理。\n\
  \nc) 非特殊三角形（not special）\n* **提示**：在任何三角形中，每条边的长度都小于其他两边长度之和。\n\n### 8) 自动取款机（ATM）内部有\
  \ 10 美元、5 美元和 1 美元的钞票。编写一个 Java 程序模拟此 ATM 的工作方式。开始时，机器提示用户输入四位 PIN，然后检查 PIN 的有效性（假设“1234”为有效\
  \ PIN）。如果用户提供的 PIN 正确，程序必须提示用户输入他们想要取的金额（一个整数值），最后显示 ATM 必须发放的最少钞票数量。例如，如果用户输入金额\
  \ 36 美元，程序必须显示“3 张 10 美元钞票，1 张 5 美元钞票和 1 张 1 美元钞票”。此外，如果用户输入了错误的 PIN，机器允许他们重试两次。如果用户三次都输入了错误的\
  \ PIN，则必须显示消息“PIN locked”并结束程序。假设用户输入的金额为有效值。\n\n### 9) 编写一个 Java 程序，提示用户输入两个值，一个温度值，一个风速。如果温度高于\
  \ 75 华氏度，则该天气为炎热，否则为寒冷。如果风速超过 12 英里/小时，则该天气为大风，否则不是大风。程序必须根据用户提供的值显示一条消息。例如，如果用户输入的温度为\
  \ 60，风速为 10，程序必须显示“天气寒冷且无大风”。假设用户输入有效值。\n\n# 第 21 章 更多关于决策控制结构的流程图\n\n### 21.1 引言\n\
  \n通过学习前面的章节，你已经熟悉了所有的决策控制结构。由于流程图是学习“算法思维”并帮助你更好地理解特定控制结构的理想方式，本章专门用于教你如何将 Java\
  \ 程序转换为流程图，或将流程图转换为 Java 程序。\n\n### 21.2 将 Java 程序转换为流程图\n\n要将 Java 程序转换为其对应的流程图，你需要回顾所有的决策结构及其对应的流程图片段。它们在这里总结如下：\n\
  \n#### 单分支决策结构\n\n![Image](img/chapter16-01)\n\n#### 双分支决策结构\n\n![Image](img/chapter17-01)\n\
  \n#### 多分支决策结构\n\n![Image](img/chapter18-01)\n\n你也可以用这种流程图来表示 Java 代码！\n\n#### 练习\
  \ 21.2-1 设计流程图\n\n为以下程序设计流程图。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {\n    double x, z, w, y, a;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    z = Math.pow(x, 3);\n    w = (z - 4) * (x - 3) / 7;\n    if (z >= w && x <\
  \ z) {\n        y = 2 * x;\n        if (y > 0) { //这是一个嵌套单分支结构\n            y++;\n\
  \        }\n    } else {\n        y = 4 * x;\n        a++;\n    }\n    System.out.println(y);\n\
  }\n```\n\n在这个 Java 程序中有一个单分支结构嵌套在一个双分支结构中。其对应的流程图所示。\n\n![Image](img/chapter21-01)\n\
  \n流程图是表示算法的一种非常灵活的方法。因此，允许编写 $x³$ 或使用 Java 方法 `pow()`。随你意，任何熟悉流程图的人都能理解你想表达的意思。\n\
