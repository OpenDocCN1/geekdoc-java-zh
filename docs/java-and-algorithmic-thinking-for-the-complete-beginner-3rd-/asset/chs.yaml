  \n![](img/notice.jpg)后测试循环结构的语句或语句块都执行了 N 次，布尔表达式也计算了 N 次。因此，要确定总迭代次数，你可以计算语句或语句块执行的次数，也可以计算布尔表达式求值的次数。这两个计数是相等的！\n\
  \n### 练习 25.2-2 计算总迭代次数\n\n这段代码段执行了多少次迭代？\n\n```java\nint i;i = 3;do {System.out.println(i);i--;}\
