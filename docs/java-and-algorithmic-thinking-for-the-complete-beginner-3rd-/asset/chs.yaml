  \ / 100 == 0` 对于单位整数有效，但它对两位整数也失效了（因为它也会评估为真）。你想出的最小的两位数是多少？是 10，对吧？最大的两位数是多少？是\
  \ 99，对吧？所以，正确的解决方案如下：\n\n```java\nSystem.out.print(\"Enter an integer: \");\nx =\
  \ Integer.parseInt(cin.nextLine());\nif (x >= 10 && x <= 99) {\n    System.out.println(\"\
  A 2-digit integer entered\");\n}\n```\n\n根据以上内容，该练习的完整解决方案如下：\n\n![](img/my_exercise_header.png)\
