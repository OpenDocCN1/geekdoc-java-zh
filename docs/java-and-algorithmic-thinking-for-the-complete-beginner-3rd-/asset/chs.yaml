  > System.out.println(i + \" is a multiple of 2\");\n}i -= 2;} while (i > 0);\n```\n\
  \n##### 答案\n\n此代码片段包含一个后测试循环结构，其中嵌套了三个单分支选择结构。对应的流程图片段如下。\n\n![Image](img/chapter28-02.png)\n\
  \n#### 练习 28.2-3 设计流程图\n\n设计与以下 Java 程序对应的流程图。\n\n```java\npublic static void main(String[]\
