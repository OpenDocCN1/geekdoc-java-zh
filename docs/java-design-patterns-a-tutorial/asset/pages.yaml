    **Figure 34.2** Clicking on a document title displays the summary in the lower
    box.


    Then, just as she got these functioning and was about to leave on a trip to the
    West coast with Arthur, she obtained code from Dick that allowed her to annotate
    displayed documents using the GlassPane methods of the JFrame component. This
    is shown in Figure 34.3.


    Working under cramped conditions on the flight, she retrieved that code into the
    working program and showed it to Arthur on his arrival. He was impressed with
    the program so far. After working with Sandy for a day or so and integrating her
    server technology, he was even more pleased with their joint work. Sandy was less
    pleased because she knew they had just written a tangle of interacting classes
    that was nearly impossible to maintain or understand. When she expressed her concerns
    to Arthur, he took a familiar textbook off the shelf.


    > “Here’s a copy of Design Patterns,” he said. “I think you’ll find some good
    ideas on how to modify our program to be less confusing.”


    Sandy took the book back to her motel room and began thumbing through the catalog
    of patterns. By the next day, she had beginnings of some ideas.

    “Look,” she said, “we can look at this program as a set of data objects or a set
    of visual objects. Either way, we have to minimize the amount that each object
    needs to know about the others, so we can modify an object without changing any
    others. If we consider the applet as a set of data interaction objects, the toolbar
    buttons call on data and change display elements.'
