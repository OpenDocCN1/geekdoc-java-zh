    To write this simple chain of responsibility program, we start with an abstract
    Chain class.

    public interface Chain {

    public abstract void addChain(Chain c);

    public abstract void sendToChain(String msg);

    public abstract Chain getChain();

    }


    The addChain method adds another class to the chain of classes. The getChain method
    returns the current class to which messages are being forwarded. These two methods
    allow us to modify the chain dynamically and add additional classes in the middle
    of an existing chain. The sendToChain method forwards a message to the next object
    in the chain.

