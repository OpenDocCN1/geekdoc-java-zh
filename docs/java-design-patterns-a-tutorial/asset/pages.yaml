  md: 'The example class JawtClassList, called by JTwoClassList, is on the accompanying
    CD-ROM.


    There are also some differences between the class and the object adapter approaches,
    although they are less significant than in C++.


    +   - The class adapter

    - Won''t work when you want to adapt a class and all of its subclasses, since
    you define the class that it derives from when you create it.

    - Lets the adapter change some of the adapted class''s methods but still allows
    the others to be used unchanged.

    - The object adapter

    - Could allow subclasses to be adapted by simply passing them in as part of a
    constructor.

    - Requires that you specifically bring to the surface any of the adapted object''s
    methods that you wish to make available.


    # Two-Way Adapters


    The two-way adapter is a clever concept that allows an object to be viewed by
    different classes being either of type List or type JList. This is most easily
    carried out by a class adapter, since all of the methods of the base class are
    automatically adapted to the derived class. However, this can work only if you
    do not override any of the base class''s methods with methods that differ entirely.
    As it happens, the JawtClassList class is an ideal two-way adapter because the
    List and JList classes have no methods in common.


    Note in the UML in Figure 9.3 that JawtClassList inherits from JList and implements
    awList. Thus you can refer to the awList methods or the JList methods equally
    conveniently and treat the object as an instance either of JList or of awList.


    # Pluggable Adapters


    A pluggable adapter is an adapter that adapts dynamically to one of several classes.
    Of course, the adapter can adapt only to classes that it can recognize, and usually
    the adapter decides which class it is adapting to based on differing constructors
    or合物 methods.


    Java has another way for adapters to recognize which of several classes it must
    adapt to: reflection. You can use reflection to discover the names of public methods
    and their parameters for any class. For example, for any arbitrary object you
    can use the getClass to obtain its class and the getMethods to obtain an array
    of the method names.'
