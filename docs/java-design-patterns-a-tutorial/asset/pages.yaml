  md: '# # SECTION 2


    # ## Creational Patterns


    All of the Creational patterns deal with ways to create instances of objects.
    This is important because your program should not depend on how objects are created
    and arranged. In Java, the simplest way to create an instance of an object is
    by using the new operator:


    ```

    fred = new Fred(); //instance of Fred class

    ```


    However, doing this really amounts to hard coding, depending on how you create
    the object within your program. In many cases, the exact nature of the object
    that is created could vary with the needs of the program. Abstracting the creation
    process into a simple “creator” class can make your program more flexible and
    general. The six Creational patterns follow:


    +   - **Factory Method pattern**: returns one of several possible subclasses of
    an abstract base class, depending on the data that are provided. We will start
    with the Simple Factory pattern as an introduction to factories and then introduce
    the Factory Method pattern as well.

    - **Abstract Factory pattern**: provides an interface to create and return one
    of several families of related objects.

    - **Builder pattern**: separates the construction of a complex object from its
    representation so that several different representations can be created, depending
    on the needs of the program.

    - **Prototype pattern**: starts with an instantiated class, which copies or clones
    to make new instances. These instances can then be further tailored using their
    public methods.

    - **Singleton pattern**: is a class of which there may be no more than one instance.
    It provides a single global point of access to that instance.'
