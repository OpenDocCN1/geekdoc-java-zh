    \ four equations repeatedly for a large number of point pairs over passes through\
    \ the array that you are transforming. Because of how the graphs of these computations\
    \ are, these equations (Equations 1–4) constitute one instance of the FFT “butterfly”.\n\
    \n```\n$R_1 = R_1 + R_2 \\cos(y) - I_2 \\sin(y) \\quad (1)\\n$R_2 = R_1 - R_2\
