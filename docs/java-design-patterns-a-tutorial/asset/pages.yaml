  md: '# The Message to the Media


    In the case of the ColorFrame Observer, the sendNotify method changes the background
    color and the text string in the Frame panel. In the case of the ListFrame Observer,
    it just adds the new color to the list box. Figure 22.3 shows the final program
    running.


    ![](img/68cf94ac4e1285ea25e571564f85e824_231_0.png)


    Figure 22.3 The data control pane generates data, which are displayed simultaneously
    as a colored panel and as a list box. This is a candidate for an Observer pattern.


    # The Message to the Media


    Now, what kind of notification should a Subject send to its Observers? In this
    carefully circumscribed example, the notification message is the string representing
    the color itself. When we click on one of the radio buttons, we can get the caption
    for that button and send it to the Observers. This, course, assumes that all of
    the Observers can handle such string representation. In realistic situations,
    this might not be the case, especially if the Observers could also be used to
    observe other data objects. Here, we undertake two data conversions:


    +   1. We get the label from the radio button and send it to the Observers.


    +   2. We convert the label to an actual color in the ColorFrame Observer.


    A more complicated system might have Observers that demand specific, but different,
    kinds of data. Rather than have each Observer convert the message to the right
    data type, we use an intermediate Adapter class to perform this conversion.


    Another problem that observers might have to deal with is the case where the data
    of the central Subject can change in several ways. We could delete points from
    a list of data, edit their values, or change the scale of the data that we are
    viewing. In these cases, we must either send different change messages to the
    Observers or send a single message and then have the Observer ask which sort of
    change has occurred.'
  merge: -1
  pgno: 231
