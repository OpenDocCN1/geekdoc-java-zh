    # Catch-All Operations UsingVisitors


    In all of the previous cases, the Visitor class had a *visit* method for each
    visiting class, such as the following:


    ```

    public void visit(Employee emp) {}

    public void visit(Boss emp) {}

    ```


    However, if you start subclassing your Visitor classes and adding new classes
    that might visit, you should recognize that some *visit* methods might not be
    satisfied by the derived class. These instead "fall through" to methods in one
    of the parent classes in which that object type is recognized. This provides a
    way of specifying default Visitor behavior.


    Note that every class must *override accept(v)* with its own implementation so
    that the return *visit(this)* returns an *object* of the correct type and not
    of the superclass''s type.


    Let''s suppose that we introduce another layer of management into the company,
    discussed earlier in the chapter: Manager. Managers are subclasses of Employees,
    and now they have the privileges formerly reserved for Bosses, that is, extra
    vacation days. Bosses now have an additional reward: stock options. If we run
    the same program to compute vacation days but do not revise Visitor to look for
    Managers, it will recognize Managers as Employees and count only their regular
    vacation days and not their extra vacation days. However, the catch-all parent
    class is good to have if subclasses are added to the application from time to
    time and we want the Visitor operations to run without modification.


    There are three ways to integrate the new Manager class into the Visitor system.
    In one, we could define a *ManagerVisitor*. In the second, we could use the *BossVisitor*
    to handle both. However, there could be conditions when it is not'
