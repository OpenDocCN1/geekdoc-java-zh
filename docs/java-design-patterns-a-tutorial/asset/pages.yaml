  md: '# Other Implementation Issues


    Other composite implementation issues you might consider


    +   - Ordering of Components. In some programs, the order of the components may
    be important. If that order differs somehow from the order in which they were
    added to the parent, the parent must do additional work to return them in the
    correct order. For example, you might sort the original Vector alphabetically
    and return the Enumerator to a new sorted Vector.

    - Caching results. If you often ask for data that must be computed from a series
    of child components, as was done earlier with salaries, it might be advantageous
    to cache these computed results in the parent. However, unless the computation
    is relatively intensive and you are quite certain that the underlying data have
    not changed, doing this might not be worth the effort.


    ![](img/68cf94ac4e1285ea25e571564f85e824_119_0.png)


    # THOUGHT QUESTIONS


    +   1. A baseball team can be considered an aggregate of its individual players.
    How could you use a composite to represent individual and team performance.

    2. The produce department of a supermarket needs to track its sales performance
    by food item. Suggest how a composite might be helpful in accomplishing this.


