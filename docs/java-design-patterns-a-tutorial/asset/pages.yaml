  md: '# # CHAPTER 22


    # ## The Observer Pattern


    In this chapter we discuss how you can use the Observer pattern to present data
    in several forms at once.


    In the more sophisticated windowing world, we often want to display data in more
    than one form at the same time and have all of the displays reflect any changes
    in the data. For example, we might represent stock price changes as both a graph
    and a table or list box. Each time the price changes, we''d expect both representations
    to change at once without any action on our part.


    We expect this sort of behavior because many Windows applications, such as Excel,
    demonstrate this behavior. However, nothing inherent in Windows allows this activity,
    and, as you might know, programming directly in Windows in C or C++ is quite complicated.
    In Java, however, you can easily use the Observer pattern to cause your program
    to behave in this way.


    The Observer pattern assumes that the object containing the data is separate from
    the objects that display the data and that these objects observe changes in those
    data. This idea is illustrated in Figure 22.1.


    ![](img/68cf94ac4e1285ea25e571564f85e824_227_0.png)


    Figure 22.1 Data are displayed as a list and in some graphical mode.'
  merge: -1
  pgno: 227
- img_proc: true
  md: "When we implement the Observer pattern, we usually refer to the data as the\
    \ Subject and each of the displays as Observers. Each Observer registers its interest\
    \ in the data by calling a public method in the Subject, and each has a known\
    \ interface that the Subject calls when the data change. We could define these\
    \ interfaces as follows:\n\n```\npublic interface Observer {\n    //notify Observer\
    \ that a change has taken place\n    public void notify(String s);\n}\nublic interface\
    \ Subject {\n    //tell the Subject that you are interested in change\n    public\
    \ void registerInterest(Observer obs);\n}\n```\n\nThe advantages of defining these\
    \ abstract interfaces are that you can write any sort of class objects you want\
    \ as long as they implement these interfaces, and that you declare these objects\
    \ to be of type Subject and Observer no matter what they do.\n\n# ## Watching\
    \ Colors Change\n\nLet's write a program to illustrate how to use this powerful\
    \ concept. It shows a display frame containing three radio buttons Red, Blue,\
    \ and Green, as shown in Figure 22.2.\n\n![](img/68cf94ac4e1285ea25e571564f85e824_228_0.png)\n\
    \nFigure 22.2 a simple control panel to create red, green, or blue \"data\".\n\
    \nThis main window is the Subject, or data repository object. We create this window\
