  md: '# CHAPTER 17


    # The Command Pattern


    The Chain of Responsibility pattern forwards requests along a chain of classes,
    but the Command pattern forwards a request only to a specific object. It encloses
    the request for a specific action inside a known public interface. It lets you
    give the client the ability to make requests without knowing anything about the
    actual action that will be performed and allows you to change that action without
    affecting the program in any way.


    # Motivation


    When you build a Java user interface, you provide controls—menu items, buttons,
    check boxes, and so on—to allow the user to tell the program what to do. When
    a user selects one of these controls, the program receives an ActionEvent, which
    it must trap by implementing the ActionListener interfaces'' actionPerformedEvent.


    Suppose that we build a very simple program that allows us to select the menu
    items File | Open and File | Exit and click on a button labeled Red turns the
    background of the window red. This program is shown in Figure 17.1.


    ![](img/68cf94ac4e1285ea25e571564f85e824_173_0.png)


    **Figure 17.1** A simple program that receives actionPerformed events from the
    button and menu items.'
  merge: -1
