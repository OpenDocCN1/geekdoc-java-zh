  md: "# CHAPTER 5\n\n# The Abstract Factory Pattern\n\nThe Abstract Factory pattern\
    \ is one level of abstraction higher than the Factory Method pattern. You can\
    \ use this pattern to return one of several related classes of objects, each of\
    \ which can return several different objects on request. In other words, the Abstract\
    \ Factory is a factory object that returns one of several groups of classes. You\
    \ might even decide which class to return from that group by using a Simple Factory.\n\
    \nOne classic application of the Abstract Factory pattern is when your system\
    \ needs to support multiple look-and-feel user interfaces, such as Windows 9x,\
    \ Motif, and Macintosh. You tell the factory that you want your program to look\
    \ like Windows, and it returns a GUI factory that returns Windows-like objects.\
    \ When you request specific objects, such as buttons, check boxes, and windows,\
    \ the GUI factory returns Windows instances of these visual interface components.\n\
    \nIn Java 1.2, the pluggable look-and-feel classes accomplish this at the system\
    \ level so instances of the visual interface components are returned correctly\
    \ once the program selects the type of look and feel. In the following code, we\
    \ find the name of the current windowing system and then tell the pluggable look-and-feel\
    \ (PLAF) Abstract Factory to generate the correct objects.\n\n```\nString laf\
    \ = UIManager.getSystemLookAndClassName();\ntry {\n    UIManager.setLookAndFeel(laf);\n\
    } catch(UnsupportedLookAndFeelException ex) {\n    System.err.println(\"Unsupported\
    \ L&F: \" + laf);\n} catch(Exception ex) {\n    System.err.println(\"Error loading\
    \ \" + laf);\n}\n```"
