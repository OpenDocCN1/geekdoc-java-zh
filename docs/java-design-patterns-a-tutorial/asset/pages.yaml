  md: 'Programs on the CD-ROM


    a Composite consisting of a single item is essentially a Decorator. Once again,

    however, the intent is different.


    # Consequences of the Decorator Pattern


    The Decorator pattern provides a more flexible way to add responsibilities to
    a

    class than by using inheritance, since it can add these responsibilities to selected

    instances of the class. It also allows customizing a class without creating sub-

    classes high in the inheritance hierarchy. Design Patterns points out two disag-

    v of the Decorator pattern. One is that a Decorator and its enclosed

    component are not identical; tests for object type will fail. The second is

    that Decorators can lead to a system with lots of little objects that look alike

    to the programmer trying to maintain the code. This can be a maintenance

    headache.


    The Decorator and the Faç pattern, discussed next, evoke similar images

    in building architecture. However, in design pattern terminology, Faade is a

    way of hiding a complex system inside a simpler interface, while Decorator adds

    function by wrapping a class.


