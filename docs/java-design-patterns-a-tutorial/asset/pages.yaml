  md: '# Doubly Linked List


    The problem of replacing the Employee instance with the Boss instance means

    replacing a Vector element with a new one using the setElementAt method.


    # Doubly Linked List


    In the previous implementation, we keep a reference to each subordinate in the

    Vector in each Boss class. This means that there is no way to move down the chain
    from

    the CEO to any employee, but that there is no way to back up to identify

    an employee''s supervisor. This is easily remedied by providing a constructor
    for

    each Abstract subclass that includes a reference to the parent node.


    ```

    public Employee(Employee _parent, String _name,

    float _salary) {

    name = _name;

    salary = _salary;

    parent = _parent; //save parent node

    leaf = true;

    }

    ```


    Then you can quickly walk the tree to produce a reporting chain.


    ```

    list.add(emp.getEmployee()); //employee name

    while(emp.getParent() != null) {

    emp = emp.getParent(); //get boss

    list.add(emp.getName());

    }

    ```


    This is shown in Figure 11.4.


    ![](img/68cf94ac4e1285ea25e571564f85e824_117_0.png)


    Figure 11.4 The tree list display of the composite, with a display of the parent
    nodes on the right.'
