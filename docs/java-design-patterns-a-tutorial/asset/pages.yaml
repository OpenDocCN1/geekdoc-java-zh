  md: '# Consequences of the Mediator Pattern


    Using the Mediator pattern has the following consequences:


    +   1. The Mediator pattern keeps classes from becoming entangled when actions
    in one class need to be reflected in the state of another.


    +   2. Using a Mediator makes it easy to change a program’s behavior. For many
    kinds of changes, you can merely change or subclass the Mediator and leave the
    rest of the program unchanged.


    +   3. New controls or other classes can be added without changing anything except
    the Mediator.


    +   4. The Mediator solves the problem of each Command object’s needing to know
    too much about the objects and methods in the rest of a user interface.


    +   5. Sometimes, however, the Mediator can become a "god class," having too much
    knowledge of the rest of the program. This can make the Mediator hard to change
    and maintain. You can improve this situation by putting more of the function into
    the individual classes and into the Mediator. Each object should carry out its
    own tasks, and the Mediator should manage only the interaction between objects.


    +   6. Each Mediator is a custom-written class that has methods for each Col to
    call and knows the methods that each Colleague has available. This makes it difficult
    to reuse Mediator code in different projects. However, most Mediators are quite
    simple, and writing this is far easier than managing the complex object interaction
    in any other way.


    # Single Interface Mediators


    The Mediator pattern described here acts as a kind of Observer pattern, observing
    in each of the Colleague elements, with element having a custom interface to the
    Mediator. Another approach is to have a single interface to the Mediator and pass
    to it various objects that tell the Mediator which operations to perform.


    In this approach, we avoid registering the active components and create a single
    action method with different polymorphic arguments for each of the action elements.


    ```

    public void action(MoveButton mv){npublic void action(ClearButton clrButton){}

    public void action(KidList klst){}

    ```'
