  md: '# Building the Façade Classes


    Let''s consider how we connect to a database. We first must load the database
    driver.


    ```

    ```try{Class.forName(driver);} //load the Bridge driver```

    ```


    To connect to a database, you use an instance of the Connection class. Then, to
    find out the names of the database tables and fields, you need to get an instance
    of the DatabaseMetadata class from the Connection. Next, to issue a query, you
    compose the SQL (Structured Query Language) query string and use the Connection
    to create a Statement class. By executing the Statement, you obtain a ResultSet
    class, and to find out the names of the column rows in ResultSet, you need to
    obtain an instance of the ResultSetMetadata class. Thus juggling all of these
    classes can be quite difficult, and since most of the calls to their methods throw
    exceptions, the coding can be messy at least.


    However, by designing a Façade (Figure 13.2) consisting of a Database class and
    a Results class, we can build a much more usable system.


    ![](img/68cf94ac4e1285ea25e571564f85e824_134_0.png)'
