  md: '# Implementing the Interpreter Pattern


    The parser itself just reduces the tokens, as shown earlier. It checks for various
    pairs of tokens on the stack and reduces each pair to a single one for each of
    five different cases.


    # Implementing the Interpreter Pattern


    Writing a parser for this simple grammar as a series of if statements is certainly
    possible. For each of the six possible stack configurations, we reduce the stack
    until only a verb remains. Then, since we made the Print and Sort verb Command
    objects, we can just execute them by one as the action list is enumerated.


    The real advantage of the Interpreter pattern, however, is its flexibility. By
    making each parsing case an individual object, we can represent the parse tree
    as a series of connected objects that reduce the stack successively. Using this
    arrangement, we can easily change the parsing rules, with few changes to the program.
    We just create new objects and insert them into the parse tree.


    The participating objects in the Interpreter pattern are:


    +   - AbstractExpression: declares the abstract Interpreter operation.

    - TerminalExpression: interprets expressions containing any of the terminal tokens
    in the grammar.

    - NonTerminalExpression: interprets all of the nonterminal expressions in the
    grammar.

    - Context: contains the global information that is part of the parser, in this
    case, the token stack.

    - Client: builds the syntax tree from the previous expression types and invokes
    the Interpret operation.


    # The Syntax Tree


    We construct a simple syntax tree to carry out the parsing of the previous stack.
    We only need to look for each defined stack configuration and reduce it to an
    executable form. In fact, the best way to implement this is to use a Chain of
    Responsibility pattern, which passes the stack configuration between classes until
    one of them recognize that configuration and acts on it. You can decide whether
    a successful stack reduction should end that pass; it is perfectly possible to
    have several successive chain members work on the stack in a single pass. The
    processing ends when the stack is empty. Figure 18.3 shows a diagram of the individual
    parse chain elements.'
