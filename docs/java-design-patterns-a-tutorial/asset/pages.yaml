  md: '# 310 CHAPTER 34 Sandy and the Mediator


    Then she realized that she could insert a JLabel into another of the tabbed panes
    and use it to display titles of documents. Figure 34.2 shows the summary of the
    selected document.


    ![](img/68cf94ac4e1285ea25e571564f85e824_328_0.png)


    | | Graphic Views | Similar Docs |

    |---|---|---|

