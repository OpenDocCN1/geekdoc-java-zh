    # Design Patterns in the Action Object


    Objects that implement the Action interface deserve discussion because they exemplify
    at least two design patterns. First, each Action object must have its own actionListener
    method and can directly launch the code to respond to that action. In addition,
    even though these Action objects have two (or more) visual instantiations, they
    provide a single point that launches this code. This is an excellent example of
    the Command pattern.


    In addition, the Action object takes different visual aspects depending on whether
    it is added to a menu or to a toolbar. In fact, you could decide that the Action
    object is a Factory pattern, which produces a button or menu object depending
    on where it is added. It seems to be a Factory because the toolbar and menu add
    return instances on those objects. On the other hand, the Action object seems
    to be a single object and has different appearances depending on its environment.
    This is a description of the State pattern, according to which object seems to
    change class (or methods) depending on the object''s internal state.'
