  md: 'of the Chain of Responsibility pattern. It could also be argued that, in general,
    the class inheritance structure itself exemplifies this pattern. If a method is
    to be executed in a deeply derived class, that method is passed up the inheritance
    chain until the first parent class containing that method is found. The fact that
    further parents contain other implementations of that method does not matter.


    # Consequences of the Chain of Responsibility


    Use of the Chain of Responsibility pattern has the following consequences:


    +   1. This pattern''s primary purpose, like that of several other patterns, is
    to reduce coupling between objects. An object needs to know only how to forward
    the request to other objects.


    +   2. Each object in the chain is self-contained. It knows nothing of the others
    and needs only to decide whether it can satisfy the request. This makes writing
    each one, as well as constructing the chain, very easy.


    +   3. You can decide whether the final object in the chain handles all requests
    that it receives in some fashion or just discards them. However, for this to be
    effective you must know which object will be last in the chain.


    +   4. Finally, since Java cannot provide multiple inheritance, the basic Chain
    needs to be an interface rather than an abstract class so that the individual
    objects can inherit from another useful hierarchy (as we did here by deriving
    them all from JPanel). The disadvantage of this approach is that you must implement
    the linking, sending, and forwarding of code in each module separately (or as
    we did here, by subclassing a concrete class that implements the Chain interface).


    ![](img/68cf94ac4e1285ea25e571564f85e824_171_0.png)


