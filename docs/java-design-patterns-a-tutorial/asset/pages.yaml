    \ structure continually. In that third case, you could simply test for this in\
    \ the EmployeeVisitor class.\n\n```\npublic void visit (Employee emp) {\n    total_days\
    \ += emp.getVacDays();\n    //special test in catch-all parent class\n    if(instanceof\
    \ Manager)\n        total_days += ((Manager) emp).getBonusDays();\n}\n```\n\n\
    While this seems \"unclean\" at first compared to defining classes properly, it\
    \ can provide a method of catching special cases in classes without owing new\
    \ Visitor program hierarchies. This catch-all approach is discussed in some detail\
    \ in the book Pattern Hatching [Vlissides, 1998].\n\n# Double Dispatching\n\n\
    Discussion of the Visitor pattern is complete without mentioning that you are\
    \ really dispatching a method twice in order for the Visitor to work. The Visitor\
    \ calls the polymorphic accept method of a given object, and the accept method\
    \ calls the polymorphic visit method of the Visitor. It is this bidirectional\
    \ calling that allows you to add more operations on any class that has an accept\
    \ method, since each new visitor class can carry out whatever operations you might\
    \ think of using the data available in these classes.\n\n# Traversing a Series\
    \ of Classes\n\nIn order to visit a series of classes, the calling program that\
    \ passes the instances to the Visitor must know about all of the existing instances\
    \ of classes to be visited and keep them in a simple structure such as an array\
    \ or Vector. Another possibility would be to create an Enumeration of these classes\
    \ and pass it to the Visitor. Finally, the Visitor itself could keep the list\
    \ of objects that it is to visit. In the earlier example program, we used an array\
    \ of objects, but any of the other methods would work equally well.\n\n# Consequences\
    \ of the Visitor Pattern\n\nThe Visitor pattern is useful when you want to encapsulate\
    \ fetching data from a number of instances of several classes. Design Patterns\
    \ suggest that the Visitor can provide additional functionality to a class without\
    \ changing it. However, it's preferable to say that a Visitor can add functionality\
    \ to a collection of classes and encapsulate the methods that it uses."
