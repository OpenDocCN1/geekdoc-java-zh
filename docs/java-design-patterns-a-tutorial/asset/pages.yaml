    # Consequences of the Interpreter Pattern


    Use of the Interpreter pattern has the following consequences:


    +   1. Whenever you introduce an interpreter into a program, you need to provide
    a simple way for the program user to enter commands in that language. This can
    be done via the Macro record button previously, or it can be done via an editable
    text field like the one in the previous program.


    +   2. Introducing a language and its accompanying grammar requires extensive
    error checking for misspelled terms or misplaced grammatical elements. This can
    easily consume a great deal of programming effort unless some template code is
    available for implementing this checking. Further, effective methods for notifying
    the users of these errors are not easy to design and implement.


    In the Interpreter example in this chapter, the only error handling is that keywords
    that are not recognized are not converted to ParseObjects and pushed onto the
    stack. Thus nothing will happen because the resulting sequence probably cannot
    be parsed successfully. If it can, the item represented by the misspelled keyword
    will not be included.


    +   3. You can also consider generating a language automatically from an interface
    or radio or command buttons and list boxes. While it might seem that having such
    an interface obviates the necessity for a language, the same'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'requirements of sequence and computation still apply. When you must have a
    way to specify the order of sequential operations, a language is a good way to
    do so, even if that language is generated from the user interface.


    +   4. The Interpreter pattern has the advantage that you can extend or revise
    the grammar fairly easily once you have built the general parsing and reduction
    tools. You can also easily add new verbs or variables once the foundation is constructed.


    +   5. In the simple parsing scheme, shown in the previous Parser class, there
    are only six cases to consider and they are shown as a series of simple if statements.
    If you have many more than that, Design Patterns suggests that you create a class
    for each. This makes language extension easier, but it has the disadvantage of
    proliferating lots of little classes.


    +   6. Finally, as the grammar''s syntax becomes more complex, you run the risk
    of creating a hard to maintain program.


    While interpreters are not commonly used for solving general programming problems,
    the Iterator pattern discussed in the next chapter is one of the most common ones
    you will be using.


