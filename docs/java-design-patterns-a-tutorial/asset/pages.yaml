    \ principle of the Simple Factory pattern. You create an abstraction that decides\
    \ which several possible classes to return and returns one. Then you call the\
    \ methods of that class without ever knowing which subclass you are actually using.\
    \ This approach keeps the issues of data dependence separated from the classes'\
    \ useful methods.\n\n# Factory Patterns in Math Computation\n\nMost people who\
    \ use Factory patterns tend to think of them as tools for simplifying programming\
