  md: "# Sample Code\n\n+   * Use different line-breaking strategies to display text\
    \ data.\n* Plot the same data in different formats: line graph, bar chart, or\
    \ pie chart.\n\nIn each case, the client program could tell a driver module (Context)\
    \ which of these strategies to use and then ask it to carry out the operation.\n\
    The idea behind Strategy is to encapsulate the various strategies in a single\
    \ module and provide a simple interface to allow choice between them. Each strategy\
    \ must have the same programming interface, but they do not need to be members\
    \ of the same class hierarchy. However, they do have to implement the same programming\
    \ interface.\n\nLet's consider a simplified graphing program that can present\
    \ data as a line graph or a bar chart. We start with an abstract PlotStrategy\
