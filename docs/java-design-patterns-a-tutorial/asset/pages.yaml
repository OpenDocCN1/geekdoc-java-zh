    on the request from either of the two Command buttons.


    # # Consequences of the Strategy Pattern


    The Strategy pattern allows you to select one of several algorithms dynamically.
    These algorithms may be related in an inheritance hierarchy, or they may be unrelated
    as long as they implement a common interface. Since the Context switches between
    strategies at your request, you have more flexibility than if you simply call
    the desired derived class. This approach also avoids the sort of condition statements
    that can make code hard to read and maintain.


    However, Strategies don''t hide everything. The client code is usually aware that
    there are a number of alternative strategies, and it has some criteria for choosing
    from among them. This shifts an algorithmic decision to the client programmer
    or the user.'
