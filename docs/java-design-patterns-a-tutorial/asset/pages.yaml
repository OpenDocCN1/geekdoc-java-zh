    \ examine the details of drawing the garden in the code on the CD-ROM.\n\n# #\
    \ Adding Classes\n\nOne of the great strengths of the Abstract Factory pattern\
    \ is that you can add new subclasses very easily. For example, if you need a GrassGarden\
    \ or a WildflowerGarden, you can subclass Garden and produce these classes. The\
    \ only real change you'd need to make in any existing code is to add some way\
    \ to choose these new kinds of gardens.\n\n# # Consequences of the Abstract Factory\
    \ Pattern\n\nOne of the main purposes of the Abstract Factory is that it isolates\
    \ the concrete classes that are generated. The actual names of these classes are\
    \ hidden in the factory and need not be known at the client level.\n\nBecause\
    \ of the isolation of classes, you can change or interchange the product class\
    \ families freely. Further, since you generate only one kind of class, this system\
    \ keeps you from inadvertently using classes from different families of products.\
    \ However, adding new class families takes some effort because you must define\
    \ new, unambiguous conditions that cause such a new family of classes to be returned.\n\
    \nWhile all of the classes that the Abstract Factory pattern generates have the\
    \ same base, nothing prevents subclasses from having methods that differ from\
    \ the methods of other classes. For example, a BonsaiGarden class might have a\
    \ Height or WateringFrequency that is not present in other classes. This creates\
    \ the same problem as in any subclasses. That is, you don't know whether you can\
    \ call a class method unless you know whether the subclass is one allows those\
    \ methods. This problem has the two solutions as does any similar case. Either\
    \ you can define all of the methods in the base class, even if they don't always\
    \ have an actual function. Or, if you can't change the base class, you can derive\
    \ a new base class that contains all of the methods that you need and subclass\
    \ that for all of your garden types."
