  md: "Just as the ListModel class for JList objects, the TableModel class holds and\
    \ manipulates the data and notifies the JTable whenever it changes. Thus the JTable\
    \ is an Observer pattern, operating on the TableModel data.\n\n# Cell Renderers\n\
    \nEach cell in a table is rendered by a cell renderer. The default renderer is\
    \ a JLabel, which is used for all of the data in several columns. Thus these cell\
    \ renderers can be thought of as Flyweight pattern implementations. The JTable\
    \ chooses the renderer according to the object's type, as previously discussed.\
    \ However, you can easily change to a different renderer, such as one that uses\
    \ another color, or to another visual interface.\n\nCell renderers are registered\
    \ by type of data,\ntable.setDefaultRenderer(String.class, new ourRenderer());\n\
    \nand each renderer is passed the object, selected mode, row, and column using\
    \ the only required public method.\n\n```\npublic Component getTableCellRendererComponent(JTable\
    \ jt,\nObject value, boolean isSelected,\nboolean hasFocus, int row, int column)\n\
    ```\n\nOne common way to extend a cell renderer is to extend the JLabel type,\
    \ catch each rendering request within the renderer, and return a properly configured\
    \ JLabel object, usually the renderer itself. The renderer displays cell (1, 1)\
    \ in boldface and the remaining cells in black type:\n\n```\npublic class ourRenderer\
    \ extends JLabel\nimplements TableCellRenderer {\n    Font bold, plain;\n    public\
    \ ourRenderer() {\n        super();\n        setOpaque(true);\n        setBackground(Color.white);\n\
    \        bold = new Font(\"SansSerif\", Font.BOLD, 12);\n        plain = new Font(\"\
    SansSerif\", Font.PLAIN, 12);\n        setFont(plain);\n    }\n```\n\n```\npublic\
    \ Component getTableCellRendererComponent(JTable jt,\n    Object value, boolean\
    \ isSelected,\n    boolean hasFocus, int row, int column) {\n    setText((String)value);\n\
    \    if (row == 1 && column == 1) {\n        setFont(bold);\n        setsetForeground(Color.red);\n\
    \    } else {\n        setFont(plain);\n    }\n```"
