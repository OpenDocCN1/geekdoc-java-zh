  md: '# CHAPTER 7


    # The Builder Pattern


    In this chapter we''ll consider how to use the Builder pattern to construct objects
    from components. We have already seen that the Factory Pattern returns one of
    several different subclasses, depending on the data passed in arguments to the
    creation methods. But suppose we don''t want just a computing algorithm, rather
    a whole different user interface, depending on the data we need to display. A
    typical example might be your e-mail address book. You probably have both people
    and groups of people in your address book, and you expect the display for the
    address book to change so that the People see places for first and last names,
    company name, e-mail address, and phone number.


    On the other hand, if you were displaying a group address page, you''d like to
    see the name of the group, its purpose, and a list of its members and e-mail addresses.
    You click on a person''s name and get one display and click on a group''s name
    and get the other display. Let''s assume that all e-mail addresses are kept in
