  md: '# Computing Salaries


    Now, if the company is successful, each of these company members receives a salary,
    and we could at any time ask for the cost of the control span of an employee to
    the company. We define this control span cost as the salary of that person as
    well as the combined salaries of all his or her subordinates. Here is an ideal
    example for a composite:


    +   * The cost of an individual employee is that employee’s salary (and benefits).

    * The cost of an employee who heads a department is that employee’s salary plus
    the salaries of all employees that the employee controls.


    We would like a single interface that will produce the salary totals correctly,
    whether or not the employee has subordinates.


    ```

    public float getSalaries();

    ```


    At this point, we realize that the idea of all Composites having the same standard
    method names in their interfaces is probably naive. And, in fact, we’d prefer
    that the public methods be related to the kind of class that we are actually developing.
    So rather than have generic methods such as getValue, we will use-get Salaries.


    # The Employee Classes


    We could imagine representing the company as a Composite made up of nodes: managers
    and employees. We could use a single class to represent all employees, but since
    each level might have different properties, defining at least two classes might
    be more useful: Employees and Bosses. Employees are leaf nodes and cannot have
    employees under them; Bosses are nodes that have Employee nodes under them.


    We’ll start with the AbstractEmployee class and derive our concrete employee classes
    from it.


    ```

    public abstract class AbstractEmployee {

    protected String name;

    protected long salary;

    protected Employee parent = null;

    protected boolean leaf = true;

    ```


    ```

    public abstract long getSalary();

    public abstract String getName();

    public abstract boolean add(Employee e)

    throws NoSuchElementException;

    ```'
