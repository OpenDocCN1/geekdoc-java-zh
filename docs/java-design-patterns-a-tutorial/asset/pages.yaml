  md: '# CHAPTER 21


    # The Memento Pattern


    In this chapter, we discuss how to use the Memento pattern to save data about
    an object so that you can restore it later. For example, you might like to save
    the color, size, pattern or shape of objects in a draught or painting program.
    Ideally, you can save and restore this state without making each object take care
    of this task and without violating encapsulation. This is the purpose of the Memento
    pattern.


    # Motivation


    Objects normally shouldn''t expose much of their internal state using public methods,
    but you still want to be able to save the entire state of an object because you
    might need to restore it later. In some cases, you could obtain enough information
    from the public interfaces (such as the drawing positions of graphical objects)
    to save and restore that data. In other cases, the color, shading, angle, and
    connection relationships to other graphical objects need to be saved, and yet
    this information is not readily available. This saving and restoration of data
    is common in systems that need to support Undo commands.


    If all of the data that describe an object is available in public variables, saving
    in some external store is not difficult. However, making this data makes the entire
    system vulnerable to change by external program code, when you usually expect
    data inside an object to be private and encapsulated from the outside world.


    The Memento pattern attempts to solve this problem by having privileged access
    to the state of the object that you want to save. Other objects have only a more
    restricted access to the object, thus preserving their encapsulation. This pattern
    defines the following three roles for objects:'
