    # Adding Pictures in List Boxes


    The JList is flexible in another way. You can write your own cell rendering code
    to display anything you want in a line of a list box. You can include images,
    graphs, or dancing babies if you want. All you need to create is a cell rendering
    class that implements the ListCellRenderer interface. This interface has only
    one method—getCellRendererComponent—and is easy to write. By extending the JLabel
    class, which itself allows for images as well as text, we can display names and
    images alongside each name. We assume that each Person object now contains the
    image to display.


    ```

    public class cellRenderer extends JLabel implementsnListCellRenderer {

    ```


    ```

    public Component getCellRendererComponent(JList list,

    Object value, int index, boolean isSelected,

    boolean hasFocus) {

    Person p = (Person)value; //get the person

    setText(p.getName()); //display name

    setIcon(p.getIcon()); //and image

    if(isSelected)

    setBackground(Color.lightGray);

    else

    setBackground(Color.white);

    return this;

    }

    ```


    We also connect this cell renderer class to the JList with the method call:


    ```

    nList.setCellRenderer(new cellRenderer());

    ```


    The resulting display is shown in Figure 31.6.'
