  md: '# Decorating Borders in Java


    One problem with this particular implementation of Decorators is that it is not
    easy to expand the size of the component being decorated because you add the component
    to a container and allow it to fill the container. If you attempt to draw lines
    outside the area of this component, they are clipped by the graphics procedure
    and not drawn at all.


    The JFC provides its own series of Border objects that are a kind of decorator.
    As with a Decorator pattern, you can add a new Border object to any Component.
    There is also a way to add several borders. However, unlike the Decorator pattern,
    the Borders are not JComponents, and you do not have the flexibility to intercept
    and change specific events. In fact, it is more an example of the Strategy pattern
    than a Decorator.


    The JFC defines several standard Border classes, given in the following table:


    | Class | Description |

    |---|---|

    | BevelBorder(n) | Simple two-line border; can be LOWERED or RAISED. |

    | CompoundBorder(inner, outer) | Allows you to add two borders. |

    | EmptyBorder(top, left, bottom, right) | Provides a blank border width specified
    on each side. |

    | EtchedBorder | Creates an etched border. |

    | LineBorder(width, color) | Creates a simple line border. |

    | MatteBorder | Creates a matte border of a solid color or a tiled icon. |

    | SoftBeveledBorder | Creates a beveled border with rounded corners. |

    | TitledBorder | Creates a border containing a title. Used to surround and label
    a JPanel. |


    These borders are simple to use in conjunction with the setSnackbar method of
    each Component. Figure 12.4 shows a normal JButton with a 2-pixel solid-line border,
    combined with a 4-pixel EmptyBorder and an EtchedBorder.'
