  md: '# Implementation


    Saving the state of an object without making all of its variables publicly avail-able
    is tricky and can be done with varying degrees of success in various languages.
    Design Patterns suggests using the C++ friend construction to achieve this access.
    Smalltalk Companion notes that it is not directly possible in Smalltalk. In Java,
    this privileged access is possible using a little-known and seldom-used protection
    mode. Variables within a Java class can be


    +   - private

    - protected,

    - public, or

    - [package protected] (which is the default if none is declared).


    Java does not allow you to declare variables as package protected, but a variable
    with no protection declaration is treated as having that level of visibil-ity.
    Other classes can access public variables, and derived classes can pro-fected
    variables. However, another class in the same package can access protected or
    private-protected variables. It is this last feature of Java that you can use
    to build Memento objects.


    For example, suppose that we have classes A and B declared in the same method.


    ```

    public class A {

    int x, y;

    public X () {

    x = 5;

    }

    //----------------

    //initialize x

    class B {

    public B() {

    A a = new A(); //create an instance of A

    System.out.println(a.x); //has access to variables in A

    }

    ```


    Class A contains a private-protected x. In class B in the same module, we create
    an instance of A, which automatically initializes x to 5. Class B has direct access
    to the variable x in class A and can print it out without compilation or an execution
    error. It is exactly this feature that we will use to create a Memento.


    +   1. Originator: the object whose state you want to save.

    2. Memento: another object that saves the state of the Originator.

    3. Caretaker: manages the timing of the saving of the state, saves the Memento,
    and if needed, uses the Memento to restore the state of the Originator.'
