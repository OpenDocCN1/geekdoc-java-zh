  md: '+   - Facade pattern: groups a complex set of objects and provides a new, simpler
    interface to access those objects.

    - Flyweight pattern: provides a way to limit the proliferation of small, similar
    instances by moving some of the class data outside of the class and passing them
    in during various execution methods.

    - Proxy pattern: provides a simple placeholder object for more complex object
    that is in some way time-consuming or expensive to instantiate.'
