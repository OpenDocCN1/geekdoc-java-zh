  md: '# CHAPTER 10


    # The Bridge Pattern


    At first sight, the Bridge pattern looks much like the Adapter pattern in that
    a class is used to convert one kind of interface to another. However, the Adapter
    pattern is intended to make one or more classes look the same as that of a particular
    class. By contrast, the Bridge pattern is designed to separate a class''s interface
    from its implementation so that you can vary or replace the implementation without
    changing the client code.

    The participants in the Bridge pattern are


    +   - the Abstraction, which defines the class''s interface,

    - the Refined Abstraction, which extends and implements that interface,

    - the Implementor, which defines the interface for the implementation classes,
    and

    - the ConcreteImplementors, which are the implementation classes.


    Suppose you have a program that displays a list of products in a window. The simplest
    interface for that display is a JList box. But a significant number of products
    have been sold, you might want to display the products in a table along with their
    sales figures.

    Since we have just discussed the adapter pattern, think immediately of the class-based
    adapter, where we adapt the fairly elaborate interface of the JList to our simpler
    needs in this display. In simple programs, this will work fine, but as we will
    see, there are limits to that approach.

    Further, let''s suppose we need to produce two kinds of displays from our product
    data, a customer view that is just the list of products we''ve mentioned and an
    executive view that also shows the number of units shipped. We display the product
    list in an ordinary JList box and the executive view in a JTable display. These
    two displays are the implementations of the display classes, as shown in Figure
    10.1.'
