  md: '# SECTION 3


    # Structural Patterns


    A structural pattern describes how classes and objects can be combined to form
    larger structures. Class and object patterns differ in that a class pattern describes
    how inheritance can be used to provide more useful program interfaces. An object
    pattern describes how objects can be composed into larger structures using object
    composition or by including objects within other objects.


    +   * Adapter pattern: can be used to make one class interface match another for
    easier programming.


    We''ll also look at a number of other structural patterns where we combine objects
    to provide new functionality.


    +   * Composite pattern: creates an object (a composition of objects), each of
    which may be a simple or a composite object.

    * Proxy pattern: creates a simple object that takes the place of a more complex
    object which may be invoked, such as when the program runs in a networked environment.

    * Flyweight pattern: for sharing objects, where each instance does not contain
    its own state, but stores it externally. This approach allows efficient sharing
    of objects to save space when there are many instances, but only a few different
    types.

    * Facade pattern: used to make a single class represent an entire subsystem.

    * Bridge pattern: separates an object''s interface from its implementation so
    you can vary them separately.

    * Decorator pattern: lets you add responsibilities to objects dynamically.


    You''ll see that there is some overlap among these patterns and even some overlap
    with the Behavioral patterns in the next section. We''ll summarize these similarities
    after we have described all of the patterns.'
