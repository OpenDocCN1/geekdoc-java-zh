  md: '# CHAPTER 34


    # Sandy and the Mediator


    Sandy and Arthur work at different branches of a large company several sand miles
    apart. Sandy began writing a program to learn how to use the Swing classes and
    eventually integrated the program into her work assignment. She started by using
    a JTabbedPane component and a JTree component. Then she added the Swing JToolBar
    component, as well as several toolbar buttons to control the program commands.


    As she began to experiment with displaying various kinds of data, she realized
    that she could use a JTextField to enter a search query and the JTree to display
    a list of suggested query refinement terms, as shown in Figure 34.1.


    ![](img/68cf94ac4e1285ea25e571564f85e824_327_0.png)


    309'
