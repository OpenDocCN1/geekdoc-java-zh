  md: '# # CHAPTER 27


    # ## The JFC, or Swing


    The Java Foundation Classes (JFC, or Swing) are a complete set of lightweight
    user interface components that enhance, extend, and, to a large degree, replace
    the AWT components such as buttons, panels, list boxes and check boxes. In addition
    to the buttons, lists, tables, and trees in the JFC, you will also find a pluggable
    look and feel that allows the components to take on the appearance of several
    popular windowing systems. The JFC actually uses a few common design patterns
    that we used for most of the examples in this book. Thus in this section, we review
    how to use the JFC and point out a number of patterns it encompasses. If you haven''t
    used these powerful classes yet, this is a simple introduction. If you have, read
    through this chapter to see how many patterns you can discover in them.


    We should note at the outset that this package was called “Swing” during development,
    and it was intended that it be referred to as “JFC” upon release. However, the
    nickname has stuck, and this has led to the Java programmer’s explanation, “It’s
    spelled JFC, but it’s pronounced Swing.”


    # ### Installing and Using Swing


    All programs that are to use Swing must import


    ```

    import javax.swing.*;

    ```


    and might require one or more of the following, depending on the components used:'
