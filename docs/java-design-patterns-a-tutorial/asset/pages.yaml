    \ class SwimData, which has all abstract methods except for the deepClone method\
    \ which we just described.\n\n```\n//abstract class defining interface and deepClone\
    \ routine\npublic abstract class SwimData\nimplements Cloneable , Serializable\
    \ {\n    public abstract int size();\n    public abstract Swimmer getSwimmer(int\
    \ i);\n    public abstract String getName(int i);\n    public abstract void sort();\n\
    \    public abstract void setName(boolean f);\n```\n\n![](img/68cf94ac4e1285ea25e571564f85e824_79_0.png)"
