  md: "# CHAPTER 25\n\n# # The Template Pattern\n\nIn this chapter, we take up the\
    \ Template pattern—a very simple pattern that you will discover you use all of\
    \ the time. Whenever you write a parent class and leave one or more of the methods\
    \ to be implemented by derived classes, you are in essence using the Template\
    \ pattern. This pattern formalizes the idea of defining an algorithm in a class,\
    \ while leaving some of the details to be implemented in subclasses. In other\
    \ words, if your base class is an abstract class, as often happens in these design\
    \ patterns, you are using a simple form of the Template pattern. We note that\
    \ Design Patterns refers to this as the Template Method Pattern, but we shorten\
    \ the name in this chapter for convenience.\n\n# ## Motivation\n\nTemplates are\
    \ so fundamental, you have probably used them dozens of times without even thinking\
    \ about it. The idea behind the Template pattern is that some parts of the algorithm\
    \ are well defined and can be implemented in the base class, while other parts\
    \ have several implementations and are best left to derived classes. Another main\
    \ idea is recognizing that there are some basic parts of a class that can be factored\
    \ out and put in a base class that they do not need to be repeated in several\
    \ subclasses.\n\nFor example, in developing the PlotPanel used in the Strategy\
    \ pattern examples, we discovered that in plotting both line graphs and bars charts\
    \ we needed similar code to scale the x- and y-pixel positions.\n\n```\npublic\
    \ class PlotPanel extends JPanel {\n    private float xfactor, yfactor;\n    private\
    \ int xmin, ymin, xmax, ymax;\n    private float minX, maxX, minY, maxY;\n```"
