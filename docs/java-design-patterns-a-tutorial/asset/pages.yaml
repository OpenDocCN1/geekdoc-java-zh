    # Providing a Global Point of Access to a Singleton Pattern


    Since a Singleton pattern is used to provide a single point of access to a class,
    your program design must provide a way to reference the Singleton throughout the
    program, even though Java has no global variables.


    One solution is to create Singletons at the beginning of the program and pass
    them as arguments to the master classes that might need to use them.


    ```

    pr1 = new Spooler();

    Customers cost = new Customers(pr1);

    ```


    The disadvantage is that you might not need all of the Singletons that you create
    for a given program execution. A more elaborate solution is to create a registry
    of all the program''s classes and make the registry generally available. Each
    time a Singleton is instantiated, it notes in the registry. Any part of the program
    can ask for the instance of any Singleton using an identifying string and get
    back that instance variable.


    The disadvantage of the registry approach is that type checking might be reduced,
    since the table of Singletons keeps all of the Singletons as objects, for example
    in a Hashtable object. And, of course, the registry itself is probably a Singleton
    and must be passed to all parts of the program using the constructor of various
    set functions.


    Probably the most common way to provide a global point of access is by using static
    methods of a class. The class name is always available, and the static methods
    can be called only from the class and not from its instances, so there is never
    more than one such instance no matter how many places in your program'
