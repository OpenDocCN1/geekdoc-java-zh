  md: '# CHAPTER 16


    # Chain of Responsibility Pattern


    The Chain of Responsibility pattern allows a number of classes to attempt to handle
    a request, without any of them knowing about the capabilities of the other classes.
    It provides a loose coupling between these classes; the only common link is one
    of the classes can handle them. The request is passed between them. The request
    is passed along until one of the classes can handle it.


    One example of such a pattern is a Help system like the one shown in Figure 16.1.
    Here, every screen region of an application invites you to help, but in some window
    background areas, more generic help is the only suitable result.


    ![](img/68cf94ac4e1285ea25e571564f85e824_159_0.png)


    **Figure 16.1** A simple application where different screen areas provide different
    help messages.


    When you select an area for help, that visual control forwards its ID or name
    to the chain. Suppose that you selected the New button. If the first module can
    handle the New button, it displays the help message; otherwise, it forwards the
    request to the next module. Eventually, the message is forwarded to an All buttons
    class that can display a general message about how buttons work. If no general
    button help is available, the message is forwarded to the general help'
  merge: -1
