  md: '# 258


    # CHAPTER 26 The Visitor Pattern


    The Visitor is not magic, and cannot obtain private data from classes; it is limited
    to the data available from public methods. This might force you to provide public
    methods that you would otherwise provide. However, the Visitor can obtain data
    from a disparate collection of unrelated classes and utilize it to present the
    results of a global calculation to the user program.


    It is easy to add new operations to a program using Visitors, since the Visitor
    contains the code instead of each of the individual classes. Further, Visitors
    can gather relations into a single class rather than forcing you to change or
    derive classes to add these operations. This can make the program simpler to write
    and maintain.


    Visitors are less helpful during a program''s growth stage. This is because each
    time you add new classes to be visited, you must add an abstract visit to the
    Visitor class and an implementation for that class to each concrete Visitor you''ve
    written. Visitors can be powerful additions when the program reaches the point
    where many new classes are added.


    They also be used very effectively in Composite systems. For example, the boss-employee
    system just illustrated could well be a Composite like the one used in Chapter
    11, The Composite Pattern.


    ![](img/68cf94ac4e1285ea25e571564f85e824_276_0.png)


