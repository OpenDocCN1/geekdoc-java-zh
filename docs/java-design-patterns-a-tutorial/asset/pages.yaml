  md: '# CHAPTER 20


    # The Mediator Pattern


    When a program consists of a number of isolated classes, the logic and computation
    is divided among these classes. However, as more of these isolated classes are
    developed in the program, communication between them becomes more complex. The
    more that each class needs to know about the methods of another class, the more
    tangled the class structure can become, thereby making the program harder to read
    and harder to maintain. Further, it can become difficult to change the program,
    since any change might affect code in several other classes. The Mediator pattern
    addresses this problem by promoting looser coupling between these classes. It
    accomplishes this by being the only class that has detailed knowledge of the methods
    of other classes. Classes inform the Mediator when changes occur, and the Mediator
    passes them on to any other classes that need to be informed.


    # An Example System


    Consider a program with several buttons, two list boxes, and a text entry field
    for selecting a few names from a list, as shown in Figure 20.1.'
