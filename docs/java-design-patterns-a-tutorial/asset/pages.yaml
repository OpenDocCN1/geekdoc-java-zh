    # Consequences of the Bridge Pattern


    Using the Bridge pattern has the following consequences:


    +   - The Bridge pattern is intended to keep the interface to your client program
    constant while allowing you to change the actual kind of class that you display
    or use. This can help you to avoid recompiling a complicated set of user interface
    modules and require only that you re the bridge itself and the actual display
    class.


    +   - You can extend the implementation class and the Bridge class separately
    and usually without having much interaction with each other.


    +   - You can hide implementation details from the client program much more easily.'
