    +   1. The toolbar buttons

    2. The toolbars

    3. The query field

    4. The tabbed panel

    5. The document display panel


    And they all communicate with the data server! It''s still a tangle!”

    “Let’s think about those design patterns I’ve been reading about. It’s easy to
    see that the toolbar buttons should communicate using the Command pattern so that
    we can use that long statement in the *actionPerformed* method. In fact, we could
    make the two JToolBars the ActionListeners for the buttons that they contain.”

    “But,” said Arthur, “I don’t see how that helps us keep these objects untangled.
    Every button needs to call methods in different objects. The Search button alone
    has to communicate with the text field, and the lists in the JTabbedPane. The
    Clear button has to clear everything! Then every Command object would be calling
    methods in three or five other objects. That’s no good. Maybe we could insert
    some object that could manage this more sensibly.”

    “Let’s see,” Sandy said. “That sounds kind of familiar. You know, that Mediator
    pattern does just that. It says here that it'
