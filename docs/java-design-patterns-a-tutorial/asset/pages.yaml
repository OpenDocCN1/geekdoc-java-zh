  md: '# Consequences of the Composite Pattern


    The Composite pattern allows you to define a class of hierarchy of simple objects
    and more-complex composite objects so that they appear to be the same to the client
    program. Because of this simplicity, the client can be much simpler, since nodes
    and leaves are handled in the same way.


    The Composite pattern also makes it easy for you to add new kinds of properties
    to your collection, as long as they support a similar programming interface. On
    the other hand, this has the disadvantage of making your system overly general.
    You might find it harder to restrict certain classes, where this would normally
    be desirable.


    # A Simple Composite


    The intent of the Composite pattern is to allow you to construct a tree of related
    classes, even though some have different properties than others and some are leaves
    that do not have children. However, for very simple cases you can use a single
    class that exhibits both parent and leaf behavior. In the SimpleComposite example,
    we create an Employee class that always contains the Vector employees. This Vector
    of employees will be empty or populated, and this determines the nature of the
    values that are returned from the `getChild` and `remove` methods. In this simple
    case, you do not throw exceptions, and you always allow leaf nodes to be promoted
    to child nodes. In other words, you always allow the execution of the `add` method.


    While you might not regard this automatic promotion as a disadvantage, in a system
    with a very large number of leaves, keeping a Vector initialized and unused in
    each leaf node is wasteful. When there are relatively few leaf nodes, this is
    not a serious problem.


    # Composites in Java


    In Java, you will note that the `DefaultMutableTreeNode` class we use to populate
    the `JL` list is, in fact, just such a simple composite pattern. You will find
    that the Composite describes the hierarchy of `JFrame`, `JPanel`, and `JOptionPane`
    in any user interface program. `JFrames`, `Jtoolbars`, and `JPanels` are all containers,
    and each may contain any number of other containers.


    Any container may contain components such as `JButtons`, `JComboBox`, and `JTextPanel`,
    each of which is a leaf node that cannot have further children. They may also
    contain `JLists` and `JTables` that can be treated as leaf nodes or that may contain
    further graphical components. You can walk down the Composite tree using the `getComponent`
    method and up the Composite tree using the `getParent` method.'
