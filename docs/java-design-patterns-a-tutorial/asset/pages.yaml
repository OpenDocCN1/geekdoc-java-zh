    # # SECTION I

    # What Are Design Patterns?


    In this first section of the book, we outline what design patterns actually are
    and give a few simple examples. You''ll see that much of the discussion about
    patterns is really a discussion about various classes and how they communicate.


    Then we show you how to use UML diagrams to represent the relationships between
    classes in your programs and how they can quickly reveal the patterns in these
    programs.'
  merge: -1
