    \n**Figure 31.4** Sorted list using the Comparable interface to sort on last names.\n\
    \n# Getting Database Keys\n\nOne disadvantage of a sorted list is that clicking\
    \ on the nth element does not correspond to selecting the nth element, since the\
    \ sorted elements can be in an order that differs from the order in which they\
    \ were added to the list. Thus if you want to get a database key corresponding\
    \ to a particular list element (here, a person) in order to display detailed information\
    \ about that person, you must keep the database key inside the Person object.\
    \ This is analogous to, but considerably more flexible than the Visual Basic approach\
    \ whereby you can keep only one key value for each list element. Here, you could\
    \ keep several items in the Person object if that is desirable. In Figure 31.5,\
    \ we double-click on one person’s name and pop up a window containing his or her\
    \ phone number."
