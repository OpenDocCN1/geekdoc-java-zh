  md: "# A GardenMaker Factory\n\nLet's consider a simple example where you might\
    \ want to use the Abstract factory in your application.\n\nSuppose you are writing\
    \ a program to plan the layout of gardens. This could be annual gardens, vegetable\
    \ gardens, or perennial gardens. No matter the type of garden, we want to ask\
    \ the same questions:\n\n+   1. What are good center plants?\n2. What are good\
    \ border plants?\n3. What plants do well in partial shade?\n\n... and probably\
    \ many other plant questions that we'll omit in this simple example.\n\nWe want\
    \ a base Garden class that can answer these questions.\n\n```\npublic abstract\
    \ class Garden {\n    public abstract Plant getCenter();\n    public abstract\
    \ Plant getBorder();\n    public abstract Plant getShade();\n}\n```\n\nIn this\
    \ case, the Plant object just contains and returns the plant name.\n\n```\npublic\
    \ class Plant {\n    String name;\n    public Plant(String pname) {\n        name\
    \ = pname; //save name\n    }\n    public String getName() {\n        return name;\n\
    \    }\n}\n```\n\nIn Design Patterns terms, the abstract Garden class is the Abstract\
    \ Factory. It defines the methods of a concrete class that can return one of several\
    \ classes, in this case each one for center, border, and shade-loving plants.\
    \ The Abstract Factory could also return more-specific garden information, such\
    \ as soil pH and recommended moisture content.\n\nIn a real system, for each type\
    \ of garden we would probably consult an elaborate database of plant information.\
    \ In this example, we'd return one kind of plant from each category. So, for example,\
    \ for the vegetable garden we write the following:\n\n```\npublic class VeggieGarden\
    \ extends Garden {\n    public Plant getShade() {\n        return new Plant(\"\
    Broccoli\");\n    }\n```"
