  md: 'However, this sort of structure seems to imply that each button, or its handler,
    knows where to enter the chain. This can complicate the design in some cases and
    may preclude the need for the chain at all.


    Another way of handling a tree-like structure is to have a single-entry point
    that branches to the specific button, menu, or other widget type and "unbranches"
    as described previously to more general cases. There is little reason for that
    complexity. We could instead align the classes into a single chain, starting at
    the bottom, and proceed left to right and up a row at a time until the entire
    system has been traversed, as shown in Figure 16.9.


    ![](img/68cf94ac4e1285ea25e571564f85e824_170_0.png)


    Figure 16.9 The same Chain of Responsibility implemented as a linear chain.


    # Kinds of Requests


    The request or message passed along the Chain of Responsibility may be a great
    deal more complicated than just the string we conveniently used in this example.
    It could include various data types or a complete object with a number of methods.
    Since various classes along the chain may use different properties of such a request
    object, you might end up designing an abstract Request type and any number of
    derived classes with additional methods.


    # Examples in Java


    As noted, while we were discussing help systems, any sequence of contained components
    such as JComponent/Panel/Frame causes a cascade of events to be sent upward to
    the surrounding components. This is a clear implementation'
