  md: '# The MVC Architecture as an Observer


    As noted in Section 5, the JList, JTable, and JTree objects operate as Observers
    of a data model. In fact, all of the visual components derived from JComponent
    can have this division of labor between the data and the visual representation.
    In JFC parlance, this is called the MVC architecture (Model-View-Controller),
    whereby the data are represented by the Model and by the visual component. The
    Controller is the communication between the Model and View objects and may be
    a separate class or may be inherent in either the Model or the View. This is the
    case for the JFC components, which are all examples of the Observer pattern.


    # The Observer Interface and Observable Class


    Java has an Observer interface built into the java.util package that has one method:


    ```

    public void update(Observable o, Object arg)

    ```


    This method is intended to be called whenever the observed object changes. The
    second argument can be used to describe the nature of the change.

    Unfortunately, Observable is implemented as a class rather than an interface,
    so you can use it only when your base class is not already determined. However,
    since this is rarely the case in GUI applications, the Observable class is seldom
    used. On the other hand, you could easily use this Observer interface instead
    of the simpler one developed in this chapter.


    # Consequences of the Observer Pattern


    The Observer pattern promotes abstract coupling to Subjects. A Subject doesn''t
    know the details of any of its Observers. This has the potential disadvantage
    of successive or repeated updates to the Observers when there is a series of incremental
    changes to the data. If the cost of these updates is high, introducing some sort
    of change management might be necessary so that the Observers are not too soon
    notified or too often.


    When one client changes the underlying data, you need to decide which object will
    initiate the notification of the change to the other Observers. If the Subject
    notifies all of the Observers when it is changed, each client is not responsible
    for remembering to initiate the notification. However, this can result in a number
    of small successive updates being triggered. If the clients tell the Subject when
    to notify the other clients, this cascading notification can be avoided;'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'however, the clients are left with the responsibility to tell the Subject when
    to send the notifications. If one client “forgets,” the program simply won''t
    work properly.


    Finally, you can specify the kind of notification to send by defining a number
    of update methods for the Observers to receive, depending on the type or scope
    of change. In some cases, the clients will thus able to ignore some of these notifications.


    # THOUGHT QUESTIONS


    +   1. Rewrite the Watch2Windows program in this chapter to use the java.util.Observer
    interface.


    +   2. Write a program using the Observable class and Observable interface.


