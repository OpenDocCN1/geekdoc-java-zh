    \ ports of a computer. Each supported platform has a different implementation\
    \ of this package, since it must include native code to handle the actual system\
    \ hardware.\n\nSerial ports are a good example of a resource that should be represented\
    \ by a Singleton, since only one program at a time can access a serial port, and\
    \ even within a program only one module or group of modules should be communicating\
    \ over the port.\n\nActually, two Singletons are possible here: one that manages\
    \ the collection of ports and lets out one instance of each port and one that\
    \ manages the port objects themselves, which must each refer to a single port.\n\
    \nIn the javax.comm package, the CommPortIdentifier class has a static method\
    \ for returning an enumeration of all ports in the system:\n\n```\npublic static\
    \ Enumeration getPortIdentifiers()\n```\n\nThis enumeration contains a CommPortIdentifier\
    \ object for each element in the system. This package handles both parallel and\
    \ serial ports, so you also need to filter the returned objects to allow only\
    \ the serial ports.\n\n```\n// enumeration of ports--static method\nportEnum =\
    \ CommPortIdentifier.getPortIdentifiers();\n\nwhile (portEnum.hasMoreElements())\
    \ {\n  portId = (CommPortIdentifier) portEnum.nextElement();\n  if (portId.getPortType()\
    \ == CommPortIdentifier.PORT_SERIAL)\n    ports.add(portId.getName()); //add to\
    \ list\n}\n```\n\nThe getPortIdentifiers method is static, so it provides the\
    \ single global point of access required by the Singleton definition. Furthermore,\
    \ since it is a static method, multiple instances are not allowed. You can call\
    \ this method only from the class and not from its instances. Each CommPortIdentifier\
