  md: "# State Transitions\n\nThe transition between states can be specified internally\
    \ or externally. In the previous example, the Mediator tells the StateManager\
    \ when to switch between states. However, it is also possible that each state\
    \ can decide automatically what each successor state will be. For example, when\
    \ a rectangle or circle drawing object is created, the program could automatically\
    \ switch back to the arrow State.\n\n# Mediators and the God Class\n\nOne real\
    \ problem with programs that have this many objects interacting is that too much\
    \ knowledge of the system is placed into the Mediator. This makes it a \"god class.\"\
    \ In the previous example, the Mediator communicates with the six buttons, the\
    \ drawing list, and the StateManager. We can write this program another way that\
    \ the button Command communicates with the StateManager, while the Mediator deals\
    \ only with the buttons and the drawing list. Each button creates an instance\
    \ of the required state and sends it to the StateManager. For example, when we\
    \ select the Circle button, for the code executes:\n\n```\npublic void Execute()\
    \ {\n    stateMgr.setState(new CircleState(med)); //new State\n    med.startCircle();\
    \ //toggle buttons\n}\n```\n\n# Consequences of the State Pattern\n\nUsing the\
    \ State pattern has the following consequences:\n\n+   1. The State pattern creates\
    \ a subclass of a basic State object for each state an application may have and\
    \ switches between them as the application changes state.\n\n+   2. You don't\
    \ need to have a long set of conditional if or switch statements associated with\
    \ the various states because each state is encapsulated in a class.\n\n+   3.\
    \ No variable specifies which state a program is in, so this approach reduces\
    \ errors caused by programmers who forget to test this state variable.\n\n+  \
    \ 4. You could share State objects between separate parts of an application, such\
    \ as separate windows, as long as none of the State objects have specific instance\
    \ variables. In this example, only the FillState class has an instance"
