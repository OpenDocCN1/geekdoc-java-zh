    # Consequences of the Builder Pattern


    Using a Builder pattern has the following consequences:


    +   * A Builder pattern lets you vary the internal representation of the product
    that it builds. It also hides the details of how the product is assembled.

    * Each specific Builder is independent of any others and the rest of the program.
    This improves modularity and makes the addition of other Builders relatively simple.'
