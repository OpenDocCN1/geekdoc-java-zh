  md: '# CHAPTER 9


    # The Adapter Pattern


    The Adapter pattern converts the programming interface of one class into that
    of another. You use adapters whenever you want unrelated classes to work together
    in a single program. The concept of an adapter is thus pretty simple: You write
    a class that has the desired interface and then make it communicate with the class
    that has a different interface. There are two ways to do this: by inheritance
    and by object composition. In the first, you derive a new class from the nonforming
    one and add the methods that you need to make the new class class match the desired
    interface. In the second, you include the original class inside the new one and
    create the methods to translate within the new class. These two approaches, termed
    class adapters and object adapters, are both easily to implement in Java.


    # Moving Data between Lists


    Let''s consider a simple Java program that allows you to enter names into a list
    and then select some of those names to be transferred to another list. The initial
    list in the example consists of a class roster, and the second list consists of
    members who will be doing advanced.


