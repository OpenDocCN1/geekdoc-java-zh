  md: '# CHAPTER 4


    # The Factory Method


    We have just seen a couple of examples of the simplest of Factories. The factory
    concept recurs throughout OO programming, and we find examples embedded in Java
    itself (such as the SocketFactory class) and in other design patterns (such as
    the Builder pattern, discussed in Chapter 7). In these cases, a single class acts
    as a traffic cop and decides which subclass of a single hierarchy will be instantiated.


    The Factory Method pattern is a clever but subtle extension of this idea, where
    no single class makes the decision as to which subclass to instantiate. Instead,
    the subclass defers the decision to each subclass. This pattern does not actually
    have a decision point where one subclass is directly selected over another subclass.
    Instead, a program written using this pattern defines an abstract class that creates
    objects but lets each subclass decide which object to create.


    We can draw a pretty simple example from the way that swimmers are seeded into
    lanes in a swim meet. When swimmers compete in multiple heats in a given event,
    they are sorted to compete from slowest in the early heats to fastest in the last
    heat and arranged within a heat with the fastest swimmers in the center lanes.
    This is called straight seeding.


    Now, when swimmers swim in championships, they frequently swim the event twice.
    During preliminaries, everyone competes and the top 12 or 16 swimmers return to
    compete against each other at finals. In order to make the preliminaries more
    equitable, the top heats are circled, so that the fastest swimmers are in the
    center lane in the fastest three heats, the second fastest swimmers are in the
    lanes next to center lane in the top three heats, and so on.


    How do we build some objects to implement this seeding scheme and illustrate the
    Factory Method pattern? First, we design an abstract Event class.'
