  md: '# CHAPTER 15


    # # The Proxy Pattern


    The Proxy pattern is used to represent with a simpler object an object that is
    complex or time-consuming to create. If creating an object is expensive in time
    or computer resources, a Proxy allows you to postpone this creation until you
    need the actual object. A Proxy usually has the same methods as the full object
    it represents. Once that full object is loaded, the Proxy passes on the method
    calls to the full object.


    There are several cases where a Proxy can be useful:


    +   1. If an object, such as a large image, takes a long time to load


    +   2. If the object is on a remote machine and loading it over the network might
    be slow, especially during peak network load periods


    +   3. If the object has limited access rights. The Proxy can then validate the
    access permissions for that user.


    Proxies can also be used to distinguish between requesting an instance of an object
    and the actual need to access it. For example, program initialization might set
    up a number of objects, all of which might not be used right away. In that case,
    the Proxy can load the real object only when it is needed.


    Consider a program that needs to load and display a large image. When the program
    starts, some indication that an image is to be displayed so that the screen is
    set out correctly; the actual image display can be postponed until the image is
    completely loaded. This is particularly important in programs such as word processors
    and Web browsers that lay out text around the images before the images are available.


    An image proxy can note the image and begin loading in the background, while drawing
    a simple rectangle or other symbol to represent the image''s'
