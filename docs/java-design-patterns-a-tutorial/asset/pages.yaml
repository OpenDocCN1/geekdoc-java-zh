  md: "```\npublic void accept(Visitor v) {\n    v.visit(this);\n}\n```\n\nIn this\
    \ way, the Visitor object receives a reference to each instance, one by one, and\
    \ then can call its public methods to obtain data, perform calculations, generate\
    \ reports, or only draw the object on the screen. Of course, if the class does\
    \ not have an accept method, you can subclass it and add one.\n\n# # When to Use\
    \ the Visitor Pattern\n\nYou should consider using a Visitor pattern when you\
    \ want to perform an operation on the data contained in a number of objects that\
    \ have different interfaces. Visitors are also valuable if you must perform a\
    \ number of unrelated operations on these classes. Visitors are a useful way to\
    \ add function to class libraries or frameworks for which you do not have the\
    \ source or cannot change the source for other technical (or political) reasons.\
    \ In these later cases, you simply subclass the classes of the framework and add\
    \ the accept method to each subclass.\n\nVisitors are a good choice, however,\
