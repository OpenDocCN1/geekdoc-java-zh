  md: 'have OO capabilities support inheritance. A class that inherits from a parent
    class has access to all the methods of that parent class. It also has access to
    all of its nonprivate variables. However, by starting your inheritance hierarchy
    with a complete, working class, you might be unduly restricting yourself, as well
    as carrying along specific method implementation baggage. Instead, Design Patterns
    suggest that you always


    Program to an interface and not to an implementation.


    Putting this more succinctly, you should define the top of any class hierarchy
    with an abstract class or an interface, which implements no methods but simply
    defines the methods that the class will support. Then, in all of your derived
    classes you will have more freedom to implement these methods to suit your purposes.


    The major concept that you recognize is object composition. This is simply the
    construction of objects that contain other objects, is encapsulation of several
    objects inside another one. While many OO programmers use inheritance to solve
    every problem, as you begin to write more elaborate programs, the merits of object
    composition become apparent. Your new object has the interface that is best for
    what you want to accomplish without having all of the methods of the parent classes.
    Thus the second major precept suggested by Design Patterns is


    Favor object composition over inheritance.


    At this first seems contrary to the customs of OO programming, but you will see
    any number of cases among the design patterns where we find inclusion of one or
    more objects inside another is the preferred method.


    # The Java Foundation Classes


    The Java Foundation Classes, which were introduced after Java 1.1 and incorporated
