    field and then click on Insert to move the names into the left-hand list box.
    Then, to move a name to the right-hand list box, you click on and then click on
    Add. To remove a name from the right-hand list box, click on it and then on Remove.
    This moves the name back to the left-hand list.


    This is a very simple program to write in Java 1.2. It consists of a GUI creation
    constructor and an actionListener routine for the three buttons. A Command, or
    even a simple set of statements, can then call the following actions on the two
    lists:'
