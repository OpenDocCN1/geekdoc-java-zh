  md: '# CHAPTER 35


    # Herb’s Text Processing Tangle


    Herb was trying to rationalize a series of programs that processed text. Each
    of several programs operated on a stream of text and marked it in various ways:
    names, phrases, places, organizations, and so on. the programs made assumptions
    that other programs had already operated on the text stream. This made it difficult
    to add to or change any of the programs in any significant way.


    He went to Sandy, who had just finished using Patterns in her project with Arthur.
    “Is you’re now an expert on design patterns,” Herb said. “Is there a pattern or
    two in that list that can help me?”


    > “There might be,” Sandy said. “But you should recognize that they aren’t magic
    bullets, and you don’t find them everywhere. They’re reusable soft-methodologies,
    but let’s look; one might apply here.”


    After Herb described his problem, Sandy thumbed Design Patterns for a moment.
    “It looks to me that this series of programs could be described as a Chain of
    Responsibility pattern,” said, “but you need to revise or subclass them that they
    all have the same interface. You can send your text data down the chain and the
    chain members more easily.”


    > “That’s easy enough,” Herb said, “but what about the problem that some of these
    modules do some processing and others don’t? This object recognizes some HTML
    tags so it can find new paragraphs, but others don’t. Wouldn’t it be better if
    this wasn’t scrambled into classes?”


    > “It would be,” Sandy agreed. “Early in the chain why don’t you create a new
    object that parses out the HTML and just sends the rearranged text to the remaining
    modules? You won’t have to change the later modules because they will no longer
    see any HTML. This is still a Chain of Responsibility but with one more class
    in the chain.”'
