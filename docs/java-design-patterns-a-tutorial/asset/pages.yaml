  md: '# CHAPTER 3


    # # The Factory Pattern


    One type of pattern that we see again and again in OO programs is the Simple Factory
    pattern. A Simple Factory pattern returns an instance of several possible classes
    depending on the data provided to it. Usually all classes that it returns have
    a common parent class and common methods, but each performs a task differently
    and is optimized for different kinds of data. This Simple Factory serves as an
    introduction to the somewhat more subtle Factory Method GoF pattern we will discuss
    shortly. It is, in fact, a special subset of that pattern.


    # # How a Factory Works


