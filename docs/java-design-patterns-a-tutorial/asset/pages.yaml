  md: '# Sharable Objects


    The Smalltalk Companion points out that sharable objects are much like Flyers,
    although their purpose differs somewhat. When you have a very large object that
    contains a lot of complex data, such as tables or bitmaps, you want to minimize
    the number of instances of that object. In such cases, you return one instance
    to every part of the program that asks for it and avoid creating others


    A problem with such sharable objects occurs when one part of a program wants to
    change some data in a shared object. You then must decide whether to change the
    object for all users, prevent any change, or create a new instance with the changed
    data. If you change the object for every instance, you have to notify the users
    that the object has changed.


    Sharable objects are also useful when you are referring to large data systems
    outside of Java, such as databases. The Database class we developed previously
    in the Facade pattern could be a candidate for a sharable object. We might not
    want a number of separate connections to the database from different program modules,
    preferring instead that only one be instantiated. However, if several modules
    in different threads decide to make queries simultaneously, the Database class
    might have to queue the queries or spawn extra connections.


    # Copy-on-Write Objects


    The Flyweight pattern uses just a few object instances to represent many different
    objects in a program. All of them normally have the base properties as intrinsic
    data, as well as a few properties that represent extrinsic data that vary with
    each manifestation of the class instance. These instances eventually take on new
    intrinsic properties (such as shape or folder tab position) and require a specific
    instance of the class to represent them. Rather than creating these in advance
    special subclasses, you can copy the class and change its intrinsic properties
    when the program indicates that a new, separate instance is required. The class
    thus copies itself when the change becomes inevitable, changing those intrinsic
    properties in the new class. This process is called copy-on-write. It can be built
    into Flyweights as well as a number of other classes, such as the Proxy pattern
    discussed in the next chapter.'
