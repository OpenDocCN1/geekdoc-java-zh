    # Ideas behind Swing


    The Swing components are called lightweight because they don''t rely on native
    user-interface components. They are, in fact, 100 percent pure Java. Thus a SwingJButton
    does not rely on a Windows button or a Motif button or Macintosh button to implement
    its functionality. The components also use fewer classes to achieve this interface
    than the heavier-weight AWT classes. In addition, Swing has many more user-interface
    components than the AWT, including image buttons, hover buttons, tooltips, tables,
    trees, splitter panes, and customizable dialog boxes.


    Because Swing components create their look and feel completely within the Swing
    hierarchy, you can have a pluggable look and feel to emulate Windows, Motif, Macintosh,
    or the native Swing.


    Swing components also use an architecture derived from the MVC design pattern
    discussed in Chapter 1. Recall that the MVC pattern keeps the data in a Model
    class, displays the data in a view class, and varies the data and view using a
    Controller class. We''ll see that this is exactly how the JList and JTable handle
    their data.


    # The Swing Class Hierarchy


    All Swing components inherit from the JComponent class. JComponent is much like
    the AWT''s Component class in its position in the hierarchy; however, it provides
    the pluggable look and feel. It provides


    +   - keystroke handling that works with nested components,

    - border property that defines both the border and the component''s inserts,

    - tooltips that pop up when the mouse hovers over components,

    - automatic scrolling of any component when placed in a scroller container.


    Because of this interaction with the user interface environment, Swing''s Component
    is actually more like the AWT''s Canvas class than its Component class.'
