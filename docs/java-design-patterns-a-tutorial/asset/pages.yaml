- img_proc: true
  md: '# CHAPTER I


    # Introduction


    Sitting at your desk in front of your workstation, you stare into space, trying
    to figure out how to write a new program feature. You know intuitively what must
    be done and what objects come into play, but you have this underlying feeling
    that there is a more elegant and general way to write this program.


    In fact, you probably don''t write any code until you build a picture in your
    mind of what code does and how the pieces of code interact. The more that you
    can picture this "organic whole" or gestalt, the more likely you are to feel comfortable
    with what you have developed the best solution to the problem. If you don''t grasp
    this right away, you might stare out of the window for a long time, even though
    the basic solution to the problem is quite obvious.


    In one sense, you feel that the more elegant solution will be more reusable and
    more maintainable. However, even if you are likely to be the only programmer,
    you feel measured once you have designed a solution that is relatively clean and
    doesnt expose too many internal inelegances.


    One of the main reasons that computer researchers began to recognize design patterns
    was to satisfy this need for good, simple, and reusable solutions. The term design
    patterns sounds a bit formal to the uninitiated and can be somewhat off-putting
    when you first encounter it. But, in fact, a design pattern is just a convenient
    way of reusing object-oriented (OO) code between projects and between programmers.
    The idea behind design patterns is: to catalog interactions between objects that
    programmers have found useful.


    A common pattern cited in early literature on programming frameworks is Model-View-Controller
    (MVC) for Smalltalk [Krasner and Pope, 1988], which divides the user interface
    problem into three parts (see Figure 1.1):'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# CHAPTER I Introduction


    +   * Data Model, which contains the computational parts of the program

    * View, which presents the user interface

    * Controller, which interacts between the user and the view


    ![](img/68cf94ac4e1285ea25e571564f85e824_22_0.png)


    **Figure 1.1** The Model-View-Controller framework.


    Each aspect of the problem is a separate object, and each has its own rules for
    managing its data. Communication between the user, the graphical user interface
    (GUI), and the data should be carefully controlled; this separation of functions
    accomplishes that very nicely. Three objects talking to each other using this
    restrained set of connections is an example of a powerful design pattern.


    In other words, a design pattern describes how objects communicate without becoming
    entangled in each other''s data models and methods. Keeping this separation has
    always been an objective of good OO programming. If you have been trying to keep
    objects minds their own business, you are probably already using some of the common
    design patterns. It is interesting that the MVC pattern is used through Java 1.2
    as part of the JFC, also known as Swing components.


    More formal recognition of design patterns began in the early 1990s when Erich
    Gamma [1993] described patterns incorporated in the GUI framework, ET++. Program
    began to meet and discuss these ideas. The culmination of these discussions and
    a number of technical meetings was the publication of the seminal book, Design
    Patterns—Elements of Reusable Software, by Gamma, Helm, Johnson, and Vlissides
    [1995]. This book, commonly called the Gang of Four, or GoF, book became an all-time
    bestseller and has a powerful impact on those seeking to understand how to use
    design patterns. It describes 23 common, generally useful patterns and comments
    on how and when you apply them. We will refer to this groundbreaking book as Design
    Patterns, throughout this book.


    Since the publication of Design Patterns, several other useful books have been
    published. One closely related book is The Design Patterns Smalltalk Companion
    [Alpert, Brown, and Woolf, 1998], which covers the same'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Defining Design Patterns


    23 patterns from the Smalltalk point of view. In this book, we refer to it as

    the Smalltalk Companion.


    # Defining Design Patterns


    We all talk about the way that we do things in our everyday work, hobbies, and

    home life and recognize repeating patterns all the time.


    +   * Sticky buns are like dinner rolls, but I add brown sugar and nut filling

    to them.

    * Her garden is like mine, except that in mine I use as.

    * This end table is constructed like that, but in this one, the doors

    replace drawers.


    We see the same thing in programming when we tell a colleague how we accom-

    plish a tricky bit of programming so that the colleague doesn''t have to recreate

    from scratch. We simply recognize effective ways for objects to communicate

    while maintaining their own separate existences.


    Some useful definitions of design patterns have emerged as the literature in

    this field has expanded.


    +   * "Design patterns are recurring solutions to design problems you see

    over and over." [Smalltalk Companion]

    * "Design patterns constitute a set of rules describing how to accom-\pl certain
    tasks in the realm of software development." [Pree,

    1994]

    * "Design patterns focuses more on recurring of architectural

    designs, while frameworks focus on detailed design . . .

    and implementation." [Coplien and Schmidt, 1995]

    * "A pattern addresses a recurring design problem that arises in

    s situations and presents a solution to it." [Buschmann and Meunier, al., 1996]

    * "Patterns identify and specify abstractions that are above the level of

    s classes and instances, or of components." [Gamma, Helm,

    Johnson, and Vlissides, 1993]


    But while it is helpful to draw analogies to architecture, cabinetmaking, and

    logic, design patterns are not just about the design of objects; they are also

    about interaction between objects. One possible view of some of these patterns

    is to consider them as communication patterns.


    Some other patterns deal not just with object communication, but also with

    strategies for object inheritance and containment. It is the design of simple,
    but

    ellegant methods of interaction that makes many design patterns so important.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Design patterns can exist at many levels, from very low-level specific solutions
    to broadly generalized system issues. There are now hundreds of patterns in the
    literature. They have been discussed in articles and at conferences at all levels
    of granularity. Some are examples that apply widely. A few writers have described
    pattern behavior to apply to a single problem [Kurata, 1998].


    Thus you don''t just write a design off the top of your head. Rather, most patterns
    are discovered. The process of learning these patterns is called pattern mining
    and is worthy of a book of its own.


    The 23 design patterns included in Design Patterns had all several known applications
    and were on a middle level of generality, where they could easily cross application
    areas and encompass several objects. The authors divided these patterns into three
    types:


    +   - Creational patterns: create objects rather than your having to instantiate
    objects directly. Your program gains more flexibility in deciding which objects
    need to be created for a given case.


    +   - Structural patterns: help you compose groups of objects into larger structures,
    such as complex user interfaces and accounting data.


    +   - Behavioral patterns: help you define the communication between objects in
    your system and how the flow is controlled in a complex program.


    We''ll be looking at Java versions of these patterns in the chapters that follow.
    This book takes a somewhat different approach than Design Patterns and the Smalltalk
    Companion; we provide at least one complete, visual Java program for each of the
    23 patterns. This way you can not only examine the code snippets provided, but
    run, edit, and modify the complete working programs on the accompanying CD-ROM.
    You''ll find a list of all the programs on the CD-ROM at the end of each pattern
    description.


    # The Learning Process


    We have found that learning design patterns is a multiple step process:


    +   1. Acceptance


    +   2. Recognition


    +   3. Internalization


    First, you accept the premise that design patterns are important in your work.
    Then, you recognize that you need to read about design patterns in order to know
    when to use them. Finally, you internalize the patterns in sufficient detail that
    you know which might help you solve a given design problem.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Notes on Object-Oriented Approaches


    For some lucky people, design patterns are obvious tools, and they will grasp
    their essential utility just by reading summaries of the patterns. For many of
    the rest of us, there is a slow induction period after we''ve read about a pattern
    followed by the proverbial "Aha!” when we see how we can apply them in our work.
    This book helps to take you to that final stage of internalization by providing
    code, working programs that you can try out for yourself.


    The examples in Design Patterns are brief and in C++, or in some cases, Smalltalk.
    If you are working in another language, it is helpful to have the pattern examples
    in your language of choice. This book attempts to fill that need for Java programmers.


    A set of Java examples takes on a form that is a little different than in C++,
    because Java is more strict in its application of OO precepts—you can''t have
    global variables, data structures or pointers. In addition, we''ll see that Java
    interfaces and abstract classes are a major contributor to how we implement design
    patterns in Java.


    # Studying Design Patterns


    There are alternate ways to become familiar with these patterns. In each approach,
    you should read this book and the parent Design Patterns book in one order or
    the other. We also strongly urge you to read the Smalltalk Companion for completeness,
    since it provides an alternate description of each pattern. Finally, there are
    number of Web sites on learning and discussing design patterns.


    # Notes on Object-Oriented Approaches


    The fundamental reason for using design patterns is to keep classes separated
    and prevent them from knowing too much about one another. Equally important, these
    patterns help you to avoid reinventing the wheel and allow you to describe your
    programming approach succinctly in terms that other programmers can easily understand.


    Recently, we obtained from a colleague some code that had been written by a very
    capable student. However, in order to use it in our project, we had to reorganize
    the objects to use the Java Foundation Classes (JFCs). We offered the revised
    code back to our colleague and were able to summarize our changes simply by noting
    that we had converted the buttons to Command patterns and had implemented a Mediator
    pattern to process their actions. This is exactly the sort of communication using
    design patterns promotes.


    OO programmers use a number of strategies to achieve the separation of classes,
    among them encapsulation and inheritance. Nearly all languages that'
