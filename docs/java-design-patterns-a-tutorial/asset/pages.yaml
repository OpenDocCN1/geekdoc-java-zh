  md: 'One interesting and challenging aspect of the design patterns discussed in
    this book is that once you start looking at a pattern, you discover that it is
    represented far more widely than you first assumed. In some cases, the application
    and implementation are obvious; in other cases, the implementation is more subtle.
    In these cases, you step back, tilt your head, squint, and realize that from that
    angle it looks like a pattern where you hadn''t noticed one before. Again, being
    able to label the code as exemplifying a pattern makes it easier for you to remember
