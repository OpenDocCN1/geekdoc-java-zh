  md: '# Interactions between Controls


    The interactions between the visual controls are pretty complex, even in this
    simple example. Each visual object needs to know about two or more others. This
    can lead to quite a tangled relationship diagram, as shown in Figure 20.3.


    ![](img/68cf94ac4e1285ea25e571564f85e824_211_0.png)


    Figure 20.3 A tangled web of interactions between classes in the simple visual
    interface presented in Figures 20.1 and 20.2.


    The Mediator pattern simplifies this system by being the only class that is aware
    of the other classes in the system. Each control that the Mediator communicates
    with is called a Colleague. Each Colleague informs the Mediator when it has received
    a user event, and the Mediator decides which other classes should be informed
    of this event. This simpler interaction scheme is illustrated in Figure 20.4.


    ![](img/68cf94ac4e1285ea25e571564f85e824_211_1.png)


    Figure 20.4 A Mediator class simplifies the interactions between classes.'
