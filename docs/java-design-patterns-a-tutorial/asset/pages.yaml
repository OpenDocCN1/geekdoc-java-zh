  md: '# CHAPTER 18


    # The Interpreter Pattern


    Some programs benefit from having a language to describe operations that they
    can perform. The Interpreter pattern generally deals with defining a grammar for
    that language and using that grammar to interpret statements of that language.


    # Motivation


    When a program presents a number of different but somewhat similar cases that
    it can deal with, it can be advantageous to use a simple language to describe
    these cases and then have the program interpret that language. Such cases can
    be as simple as the Macro language recording facilities that various office suite
    provide or as complex as Visual Basic for Applications (VBA). VBA is not included
    in Microsoft Office products but can also be embedded in any of third-party products.


    One problem is to recognize when a language can be helpful. The Macro language
    recorder records menu and keystroke operations for later playback and just barely
    qualifies as a language; it might not actually have a written form or grammar.
    Languages such as VBA, by contrast, are quite complex but are far beyond the capabilities
    of the individual application developer. Further, embedding commercial languages
    such as VBA, Java, or SmallTalk usually requires substantial licensing fees—this
    makes them less attractive to all but the largest developers.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Applicability


    As the Smalltalk Companion notes, recognizing cases in which an Interpreter can
    be helpful for much of the problem, and programmers without formal language/compiler
    training often overlook this approach. There aren''t many such cases, but there
    are three in which languages apply:


    +   - When you need a command interpreter to parse user commands: The user can
    type queries of various kinds and obtain a variety of answers.


    +   - When the program must parse an algebraic string: This case is fairly obvious.
    The program is asked to carry out its operations on a computer in which the user
    enters an equation of some sort. This often occurs in mathematical-graphics programs,
    where the program renders a curve or surface based on any equation it can evaluate.
    Programs such as Mathematica and graph drawing packages as Origin work in this
    way.


    +   - When the program must produce varying kinds of output: This case is less
    obvious but far more useful. Consider a program that can display columns of data
    in any order and sort them in various ways. These programs are often called Report
    Generators. The underlying data might be stored in a relational database, but
    the user interface to the report program is usually much simpler than the SQL
    that the database uses. In fact, some cases the simple report language might be
    interpreted by the report program and translated into SQL.


    # Simple Report Example


    Let''s consider a report generator that can operate on five columns of data in
    a table and return reports on these data. Suppose that we have the results from
    a swimming competition:


    | | | | |

    |---|---|---||

    | Amanda McCarthy | 12 WCA | 29.28 |

    | Jamie Falco | 12 HHNS | 29.80 |

    | Meaghan O''Donnell | 12 EDST | 30.00 |

    | Greer Gibbs | 12 CDEV | 30.04 |

    | Rhiannon Jeffrey | 11 YYW | 30.04 |

    | Sophie Connolly | 12 WAC | 30.05 |

    | Dana Helyer | 12 ARAC | 30.18 |


    The five column names are fname, Iname, age, club, and time. If we consider the
    complete race results of 51 swimmers, we might want to sort these results by club,
    by last name, or by age. We could produce several useful reports from'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'these data in which the order of the columns changes as well as the sorting,
    so a language is one useful way to handle these reports.

    We''ll define a very simple nonrecursive grammar of the sort


    Print lname fname club time Sortby Thenby time


    For the purposes of this example, we define the three verbs given in the grammar
    as


    +   Print

    Sortby

    Thenby


    and the five column names as


    ```

    fname

    name

    age

    club

    time

    ```


    For convenience, we assume that the language is case-insensitive and that grammar
    is punctuation-free, amounting in brief to


    > Print var[var] [sortby [thenby var]]


    Finally, the grammar contains only one main verb, and while each statement is
    a declaration, it has no assignment statement or computational ability.


    # Interpreting the Language


    Interpreting the language takes place in three steps:


    +   1. Parse the language symbols into tokens.

    2. Reduce the tokens into actions.

    3. Execute the actions.


    We parse the language into tokens by scanning each statement with a StringTokenizer
    and then substituting a number for each word. Usually parsers push each parsed
    token onto a stack—we will use that technique here. We implement that Stack class
    using a Vector, which contains push, pop, top, and nextTop methods to examine
    and manipulate the stack contents.'
  merge: -1
  pgno: 189
- img_proc: true
  md: "After the language is parsed, the stack could look as shown in the following\
    \ table:\n\n| Type | Token |\n| --- | --- |\n| Var | Time |\n| Verb | Thenby |\n\
    | Var | Club |\n| Verb | Sortby |\n| Var | Time |\n| Var | Club |\n| Var | Frname\
    \ |\n| Var | Lname |\n| Verb | Print |\n\nTop of stack\n\nHowever, we quickly\
    \ realize that the verb Thenby has no real meaning other than clarification. We'd\
    \ more likely parse the tokens and skip Thenby-together. The initial stack then\
    \ looks like this:\n\nTime\nClub\nSortby\nTime\nClub\nFrname\nLname\nPrint\n\n\
    # Objects Used in Parsing\n\nActually, we do not push just a numeric token onto\
    \ the stack, but rather a ParseObject that has both a type and a value property.\n\
    \n```\npublic class ParseObject {\n    public static final int VERB=1000, VAR\
    \ = 1010,\n    MULTVAR = 1020;\n```"
