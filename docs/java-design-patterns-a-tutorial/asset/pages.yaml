  md: '# CHAPTER 36


    # Mary’s Dilemma


    Herb finished his Chain of Responsibility development and made the framework available
    for the rest of his project group. One of his first users was Mary, who suddenly
    discovered that she had a number of additional requirements that Herb’s chain
    did not fulfill. She wanted to be able to produce summaries of each deocument.


    "For example," she told Sandy, "I need to keep sentence numbers and word of every
    term that we find in a document. Herb has that information, but he doesn''t store
    it anywhere."


    "Why don’t subclass Herb’s classes and store the data in whichever class you need?”
    asked Sandy.


    "I don’t know what I’ll need until I finish developing the algorithms, and I don’t
    want to take a chance that I mess up Herb’s part so that he can’t fix it if we
    need to make basic changes," Mary explained.


    "Let me see," said Sandy, reaching for the Design Patterns. "I think there is
    a pattern that suits your situation. Yes, here it is: the Visitor."


    "Sounds like Dürrenmatt," said Mary, ever the German scholar. "What does it do?"


    "The idea is very simple," said Sandy. "You write a class that visits the target
    class and retrieve information from it."


    "And how do I visit a class that I didn’t write?” Mary asked.


    "That’s the situation that the Visitor is for," said Sandy. "You subclass the
    classes that you’re going to visit and use an accept method in them. Then the
    Visitor calls each and returns a reference to the Visitor so that you can operate
    on all the public methods and package-protected data in the class. You get what
    you want, and the original classes are unchanged."


    "That’s great!" said Mary. "Itrs auditing the classes without paying tuition.
    That’s the pattern for me."'
