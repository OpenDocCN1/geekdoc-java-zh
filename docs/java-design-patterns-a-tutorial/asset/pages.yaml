    # Comparison with Related Patterns


    Both the Adapter and the Proxy patterns constitute a thin layer around an object.
    whereas the Proxy provides the same interface for the object but interposes itself
    where it can postpone object processing or data transmission error.


    A Decorator also has the same interface as the object that it surrounds, but its
    purpose is to add additional (sometimes visual) function to the original object.
    A Proxy, by contrast, controls access to the contained class.


    # THOUGHT QUESTION


    +   1. You have designed a Java server that connects to a database. If several
    clients connect to your server at once, how could Proxies be of help?


    # Programs on the CD-ROM


    | Program | Description |

    | \Proxy\ProxyDisplay.java | Displays a Proxy for the image for one second and
    then loads the image. |


    # Summary of Structural Patterns


    Following is a summary of the Structural patterns:


    +   * Adapter pattern: changes the interface of one class to that of another.

    * Bridge pattern: separates a class''s interface from its implementation so that
    you can vary or replace the implementation without changing the client code.

    * Composite pattern: a collection of objects, any one of which may be a Composite
    or a leaf object.

    * Decorator pattern: a class that surrounds a given class, adds capabilities to
    it, and passes all of the unchanged methods to the underlying class.'
