  md: '# CHAPTER 8


    # # The Prototype Pattern


    With the Prototype pattern, you can specify the general class needed in a program
    but defer specifying the exact class until execution time. It is similar to the
    Builder pattern in that some class decides what components or details make up
    the final class. However, it differs in that the target classes are constructed
    by cloning one or more prototype classes and then changing or filling in the details
    of the cloned class to behave as desired.


    Prototypes can be used whenever you need classes that differ only in the type
    of processing that they offer, for example, parsing strings that represent numbers
    in different radices. In this sense, the Prototype is nearly the same as the Exemplar
    pattern described by Coplien [1992].


    Let''s consider the case in which you need to make a number of queries to an extensive
    database to construct an answer. Once you have this answer as a table or ResultSet,
    you might want to manipulate it to produce other answers without having to issue
    additional queries.


    For example, consider a database of a large number of swimmers in a league or
    statewide organization. Each swimmer swims several strokes and distances throughout
    the season. The best times for swimmers are tabulated by age group. Within a single
    four-month season, many swimmers will have birthdays and therefore move into new
    age groups. Thus the query to determine which swimmers did the best in their age
    groups season depends on the date of each meet and on each swimmer''s birthday.
    The computational cost of assembling this table of times is therefore fairly high.


    Once you have a class containing this table, sorted by sex, you might want to
    examine this information sorted by time or actual age rather than by age group.
    Recomputing this data isn''t sensible, and you don''t want to destroy the original
    data order, so some sort of copy of the data object is desirable.'
