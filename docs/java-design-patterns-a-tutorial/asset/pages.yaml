    # Consequences of the Iterator Pattern


    Use of Iterator pattern has the following consequences:


    +   1. **Data modification:** The most significant question resulting from the
    use of iterators concerns iterating through data while it is changed. If your
    code is wide ranging and occasionally moves to the next element, an element might
    be added or deleted from the underlying collection while you are moving through
    it. It is also possible that another thread could change the collection. There
    are no simple solutions to this problem. You can make an Enumeration thread safe
    by declaring the loop to synchronized, but if you want to move through a loop
    using an Enumeration and delete items, you must be careful of the consequences.
    Deleting or adding an element might mean that a particular element is skipped
    or accessed twice, depending on the storage mechanism that you are using. Privilege
    access: Enumeration classes might need to have some of privileged access to the
    underlying data structures of the original container class that they can move
    through the data. If the data are stored in a Vector or Hashtable, accomplishing
    this is fairly easy. But if it is some other collection contained in a class,
    you will probably have to make the Iterator a derived class of the containment
    class and access the data directly. The friend class solution available in C++
    does not apply in Java. External versus internal Iterators: *Design Patterns*
    describes two types of Iterators: external and internal. Thus far, we have described
    only external iterators. Internal Iterators are methods that move through the
    collection directly, without any specific requests from the user. External Iterators
    are less common in Java, but methods that normalize a collection of data values
    to lie between 0 and 1 or convert all of the strings to a particular case possible.
    In general, external Iterators give you more control because the calling program
    accesses each element directly and can decide whether to perform an operation
    on it.'
