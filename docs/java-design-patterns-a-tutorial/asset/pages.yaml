  md: '# CHAPTER 7 The Builder Pattern


    a base display object, but rather different user interfaces made up of different
    combinations of display objects. The Builder pattern assembles a number of objects,
    as display widgets, in various ways depending on the data. Furthermore, since
    Java is one of the few languages with which you can cleanly separate the data
    from the display methods into simple objects, Java is the ideal language to implement
    the Builder pattern.


    # An Investment Tracker


    Let''s consider a somewhat simpler case in which it would be useful to have a
    class build our GUI for us. Suppose that we want to write a program to track the
    performance of our investments, for example, stocks, bonds, and mutual funds.
    We want to display a list of our holdings in each category that we can select
    one or more of the investments and plot their comparative performances.


    Even though we can''t predict in advance how many kind of investment we might
    own at any given time, we want a display that is easy to use for either a larger
    number of funds (such as stocks) or a small number of funds (such as mutual funds).
    In each case, we want some choice display that we can select one or more funds
    to plot. if there are three or fewer funds, we will use a set of check boxes.
    We want our Builder class to generate an interface that depends on the number
    of items to be displayed and have the same methods for returning the results.


    Our displays are shown in Figure 7.2. The first display, Figure 7.2(a), contains
    a large number of stocks, and the second, Figure 7.2(b), a small number of bonds.


    ![](img/68cf94ac4e1285ea25e571564f85e824_68_0.png)


    Figure 7.2 (a) Display of stocks showing the list interface and (b) display of
    bonds showing the check box interface.'
