  md: "# The Command Pattern\n\nNow, while it is advantageous to encapsulate the action\
    \ in a Command object, binding that object into the element that causes the action\
    \ (such as the the menu item or button) is not exactly what the Command pattern\
    \ is about. Instead, the Command object should be separate from the invoking client\
    \ so that we can vary the invoking program and the details of the command action\
    \ separately. Rather than having the command be part of the menu or button, we\
    \ make the Menu and Button classes containers for a Command object that exists\
    \ separately. We thus make UI elements that implement a CommandHolder interface.\n\
    \n```\npublic interface CommandHolder {\n    public void setCommand(Command cmd);\n\
    \    public Command getCommand();\n}\n```\n\nThis interface indicates that there\
    \ is a method to put a Command object into the invoking object and a method to\
    \ fetch that Command object and call its Execute method.\n\nThen we create the\
    \ cmdMenu class, which implements this interface.\n\n```\npublic class cmdMenu\
    \ extends JMenuItem\n    implements CommandHolder {\n    protected Menu CommandCommand;\
    \ //internal copies\n    protected JFrame frame;\n\n    public cmdMenu(String\
    \ name, JFrame frm) {\n        super(name);\n        frame = frm; //containing\
    \ frame\n    }\n    public void setCommand(Command cmd) {\n        menuCommand\
    \ = cmd; //save the command\n    }\n    public Command getCommand() {\n      \
    \  return menuCommand; //return the command\n    }\n}\n```\n\nThis actually simplifies\
    \ our program—we don't have to create a separate menu class for each action that\
    \ we want to carry out. We just create instances of the menu and pass them the\
    \ different Command objects.\n\n```\nmnuOpen = new cmdMenu(\"Open...\", this);\n\
    mnuFile.add(mnuOpen);\nmnuOpen.setCommand(new fileCommand(this));\n```"
