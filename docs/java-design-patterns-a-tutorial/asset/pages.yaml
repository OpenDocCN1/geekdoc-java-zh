  md: '# CHAPTER 23


    # The State Pattern


    The State pattern allows you to have an object represent the state of your application
    and to switch application states by switching objects. For example, you can have
    an enclosing class switch between a number of related contained classes and pass
    method calls on to the current contained class. Design Patterns suggests that
    the State pattern switches between internal classes in such a way that the enclosing
    object appears to change its class. In Java, this is, at least, a bit of an exaggeration,
    but the actual purpose to which it are put can change significantly.


    Many programmers have had the experience of creating a class that performs slightly
    different computations or displays different information based on the arguments
    passed into the class. This often leads to some sort of switch or if-else statement
    inside of the class that determines which behavior to carry out. This is inelegance
    that the State pattern seeks to replace.


    # Sample Code


    Let''s consider the case of a drawing program similar to the one we developed
    for the Memento class in Chapter 21. This program has toolbar buttons for Select,
    Rectangle, Fill, Circle, and Clear, as shown in Figure 23.1.'
