  md: '# CHAPTER 16 Chain of Responsibility Pattern


    module that tells you how the system works. If that doesn''t exist, the message
    lost, and no information is displayed. This is illustrated in Figure 16.2.


    ![](img/68cf94ac4e1285ea25e571564f85e824_160_0.png)


    Figure 16.2 A simple Chain of Responsibility pattern.


    There are two significant points we can observe from this example:


    +   1. The chain is organized from most specific to most general.

    2. There is no guarantee that the request will produce a response in all cases.


    We will see later that the Observer pattern defines how multiple classes can be
    notified of a change.


    # Applicability


    The Chain of Responsibility is a good example of a pattern that helps to keep
    the knowledge of what each object in a program can do. That is, it reduces the
    coupling between objects so that they can act independently. This also applies
    to the object that constitutes the main program and contains instances of the
    other objects. You will find this pattern helpful when


    +   * Several objects have similar methods that could be appropriate for the action
    that the program is requesting. However, it is more appropriate for the objects
    to decide which one is to carry out the action than it is for you to build this
    decision into the coding code.

    * One of the objects might be most suitable, but you don''t want to build in a
    series of if-else or switch statements to select a particular object.

    * There might be new objects that you want to add to the list of processing options
    while the program is executing.

    * Sometimes more than one object will have to act on a request, and you don''t
    want to build knowledge of these interactions into the calling program.'
