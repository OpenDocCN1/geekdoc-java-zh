  md: '# CHAPTER 29


    # Radio Buttons and Toolbars


    Swing provides separate implementations of both the JRadioButton and the JCheckBox.
    A check box has two states, and within a group of check boxes, any number can
    be selected or deselected. Radio buttons should be grouped into a ButtonGroup
    object so that only one radio button of a group can be selected at a time.


    # Radio Buttons


    Both radio buttons and check boxes can be instantiated with an image as well as
    a title, and both can have rollover icons. The JCheckBox component is derived
    from the simpler JToggleButton object. JToggleButton is a button that can be switched
    between two states by clicking but which stays in its new state (up or down) like
    a two-state check box does. Further, the JToggleButton can take on the exclusive
    aspects of a radio button by adding it to a ButtonGroup.



    ```

    // create radio buttons in the right panel

    RadioButton Rep, Dem, Flat;

    right.add(Rep) = new JRadioButton("Republicat");

    right.add(Dem) = new JRadioButton("Demmic");

    right.add(Flat) = new JRadioButton("Flat Earth");

    ButtonGroup bgroup = new ButtonGroup();

    bgroup.add(Rep); //add to a button group

    bgroup.add(Dem);

    bgroup.add(Flat);

    ```


    If you neglect to add the radio buttons to a ButtonGroup, you can have several
    of them turned on at once. It is the ButtonGroup that assures that one'
  merge: -1
  pgno: 287
- img_proc: true
  md: "button at a time can be turned on. The ButtonGroup object enforces this only-\n\
    one-one protocol by keeping track of the state of all of the radio buttons in\
    \ the\ngroup. This is an example of the Mediator pattern discussed in Chapter\
    \ 20.\n\n# The JToolBar\n\nThe JToolBar is a container for buttons of the type\
    \ you see in many pro-\ng. Normally, the JDK documentation recommends that you\
    \ add the [Tool-\nBar as the only component on one side of a BorderLayout (typically\
    \ the North\nside) and that you not add components to the other three sides. The\
    \ buttons you\nadd to the toolbar are small JButtons with picture icons and without\
    \ text. The\nJToolBar class has two important methods: add and addSeparator.\n\
    \n```\nJToolBar toolbar = new JToolBar();\nJButton Open = new JButton(\"open.gif\\\
    ntoolbar.add(Open);\ntoolbar.addSeparator();\n```\n\nBy default the JButton has\
    \ a rectangular shape. To make the usual square-\\looking buttons, you need to\
    \ use square icons and set sets of the button\nto zero. On most toolbars, the\
    \ icons are 25 x 25 pixels. Following is a ToolBar-\nton class that handles both\
    \ the insets and the size:\n\n```\npublic class ToolButton extends JButton {\n\
    \  public ToolButton(Icon img) {\n    super(img);\n    setMargin(new Insets(0,0,0,0));\n\
    \    setSize(25,25);\n  }\n}\n```\n\n}\n\nYou can detach the JToolBar from its\
    \ anchored position along the top\nside of the program and attach it to another\
    \ side, or you can leave it floating.\nThis allows some user customization of\
    \ the running program but otherwise is\nterribly useful. It is also not particularly\
    \ well implemented and can be-\nfusing to the user. Thus we recommend that you\
    \ use the setFloatable(false)\nmethod to turn this off.\n\n# ToggleButton\n\n\
    The Toggle class is actually the parent class for check boxes and radio\nbuttons.\
    \ It is a two-state button that will stay in an up or down position when\nclicked,\
    \ and you can use it like a check box. When toggle buttons look\nrather strange\
    \ on most screens, they look very reasonable as part of toolbars.\nYou can use\
    \ individual toggle buttons to indicate the state of actions that the"
