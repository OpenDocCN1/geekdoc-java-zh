  md: '# CHAPTER 28


    # Writing a Simple JFC Program


    Getting started using the Swing classes is pretty simple. Application windows
    inherit from JFrame, and applets inherit from JApplet. The only difference between
    Frame and JFrame is that you cannot add components or set the layout container
    in which you can add pane directly for JFrame. Instead, you must use the getContentPane
    method to obtain the container in which you can add components and vary the layout.


    ```

    getContentPane().setLayout(new BorderLayout());

    JButton b = new JButton("Hi");

    getContentPane().add(b); //add a button to the layout

    ```


    This is sometimes a bit tedious to type each time, so we recommend retrieving
    the JPanel from the content pane and adding all the components to that panel.


    ```

    JPanel jp = getContentPane() //get the JPanel

    JButton b = new JButton("Hi");

    jp.add(b); //add components to it

    ```


    Panels are containers much like the AWT Panel object, except that they automatically
    double-buffered and repaint more quickly and smoothly.


    # Setting the Look and Feel


    If you do not select a look and feel, Swing programs will start up in their own
    default native look and feel rather than that of Windows, Motif, or the Mac. If
    you don''t want the default look and feel, you must specifically set the look
    and feel in each program, using a method like that following:'
