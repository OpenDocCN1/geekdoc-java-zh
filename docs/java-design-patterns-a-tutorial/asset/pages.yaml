  md: "# CHAPTER 19\n\n# The Iterator Pattern\n\nThe Iterator pattern is one of the\
    \ simplest and most frequently used of the design patterns. It allows you to move\
    \ through a list or collection of data using a standard interface without having\
    \ to know the details of that data's internal representations. You can also define\
    \ special iterators that perform some special processing and return only specified\
    \ elements of the data collection.\n\n# Motivation\n\nThe Iterator pattern is\
    \ useful because it provides a defined way to move through a set of data elements\
    \ without exposing what is taking place inside the class. It is an interface;\
    \ thus you can implement it in any way that is convenient for the data that you\
    \ are returning. Design Patterns suggests that a suitable interface for an iterator\
    \ might be the following:\n\n```\npublic interface Iterator {\n    public Object\
    \ First();\n    public Object Next();\n    public boolean isDone();\n    public\
    \ Object CurrentItem();\n}\n```\n\nUsing this interface, you can move to the top\
    \ of the list, move through the list, find out if there are more elements, and\
    \ find the current list item. It is easy to implement and has certain advantages.\
    \ However, the Iterator of choice in Java is the following:\n\n```\npublic interface\
    \ Enumeration {\n    public boolean hasMoreElements();\n    public Object nextElement();\n\
    }\n```"
  merge: -1
