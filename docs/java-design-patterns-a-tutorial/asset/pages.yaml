  md: '# PREFACE


    This is a practical book that tells you how to write Java programs using some
    of the most common design patterns. It is structured as a series of short chapters,
    each describing a design pattern and giving one or more complete, working, visual
    example programs that use that pattern. Each chapter also includes Unified Modeling
    Language (UML) diagrams illustrating how the classes interact.


    This book is not a "companion" book to the well-known Design Patterns text [Gamma,
    1995] by the "Gang of Four." Rather, it is a tutorial for people who want to learn
    what design patterns are about and how to use them in their work. You need not
    have read Design Patterns to gain from reading this book, but when you are done
    here you might want to read or reread that book to gain additional insights.


    In this book, you will learn that design patterns are a common way to organize
    objects in your programs to make those patterns easier to write and modify. You''ll
    also see that by familiarizing yourself with these design patterns, you will gain
    a valuable vocabulary for discussing how your patterns are constructed.


    People can appreciate design patterns in different ways—from the highly theoretical
    to the intensely practical—and when they finally see the great power of these
    patterns, they experience an "Aha!" moment. Usually this moment means you suddenly
    had an internal picture of how that pattern can help you in your work.


    In this book, we try to help you form that conceptual idea, or gestalt, by describing
    the pattern in as many ways as possible. The book is organized into six sections:


    +   - An introductory description

    - A description of patterns grouped into three sections: Creational, Structural,
    and Behavioral'
  merge: -1
  pgno: 15
- img_proc: true
  md: '+   • A description of the Java Foundation Classes (JFC) showing the patterns
    they illustrate


    +   • A set of case studies where patterns have been helpful


    For each pattern, we start with a brief verbal description and then build example
    programs that you can run and examine so as to make the pattern as concrete as
    possible. All of the programs and their variations are on the CD-ROM that accompanies
    this book. In that way, you can run them, change them, and see how the variations
    that create work.


    All of the programs are based on Java 1.2, and most use the JFC. If you haven''t
    taken the time to learn how to use these classes, there is a tutorial covering
    the basics in Section 5 where we also discuss some of the patterns that you illustrate.


    Since each of the examples consists of a number of Java files for the classes
    we use in that example, we also provide a Visual SlickEdit project for each example
    and place each example in a separate subdirectory to prevent any confusion.


    As you leaf through the book, you''ll see shots of the programs we developed to
    illustrate the design patterns; these provide another way to reinforce your learning
    of these patterns. You''ll also see UML diagrams of the programs that illustrate
    the interactions between classes in yet another way. UML diagrams are just simple
    box and arrow illustrations of classes and their inheritance structure, with the
    arrows pointing to parent classes and dotted arrows pointing to interfaces. If
    you are unfamiliar with UML, we provide a simple introduction in the first chapter.


    Finally, since we used VISION to create the UML diagrams in each chapter, we provide
    the original VISION diagram files for each pattern as well, so you can use the
    demo version of JVISION included on the CD to play with. We also include the free
    Linux version of JVISION.


    When you finish this book, you''ll be comfortable with the basics of design patterns
    and will be able to start them in your day to day programming working.


    James W. Cooper

    Wilton, CT

    Nantucket, MA

    November, 1999'
  merge: -1
