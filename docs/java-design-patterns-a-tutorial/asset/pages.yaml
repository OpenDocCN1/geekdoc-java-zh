  md: '# # SECTION 4

    ## Behavioral Patterns


    Behavioral patterns are those patterns that are most specifically concerned with
    communication between objects. This chapter covers the following patterns:


    +   - Chain of Responsibility pattern: allows decoupling between objects by passing
    a request from one object to the next in a chain until the request is recognized.

    - Command pattern: utilizes simple objects to represent the execution of software
    commands and allows you to support logging and undoable operations.

    - Interpreter pattern: provides a definition of how to include language elements
    in a program.

    - Iterator pattern: formalizes the way we move through a list of data within a
    class.

    - Mediator pattern: defines how communication between objects can be simplified
    by using a separate object to keep all objects from having to know about each
    other.

    - Observer pattern: defines how multiple objects can be notified of a change.

    - State pattern: allows an object to modify its behavior when its internal state
    changes.

    - Strategy pattern: encapsulates an algorithm inside of class.

    - Template Method pattern: provides an abstract definition of an algorithm.

    - Visitor pattern: adds polymorphic functions to a class noninvasively.'
