  md: '# 314


    # CHAPTER 35 Herb''s Text Processing Tangle


    “Well, this is a great theory,” Herb agreed, “but now I have to write my own HTML
    parser. Thanks a lot.”


    “Actually,” Sandy pointed out, “you only have to check for a few items and skip
    over and eliminate the result. For example, you need to add a blank line wherever
    you find a <p> tag. The same applies to list tags and header tags. There isn''t
    too much more to that. You might want to pull out the document titles as you go
    along, but that''s all about.”


    “And how do I go about this? It still seems like a lot of work,” Herb protested.


    “I''d use the Interpreter pattern,” Sandy answered. “Its advantage is every item
    that you need to interpret is handled in a separate class, and none of them is
    very complicated.”


    “And I''ll bet I can guess how you connect these little Interpreter objects,”
    Herb replied. “Another Chain of Responsibility. This really simplifies my work.”
    Then his face fell. “I just remembered. Some of the documents are going to be
    in XML. for a loop.”


    “Not really,” Sandy pointed out. “You could use the Strategy pattern to select
    an HTML or XML parser as the first step in the chain. That''s not hard at all,
    and there are lots of Java-based XML parsers available.”


    “Terrific!” said Herb. “I hope the rest of the project is as easy as this is turning
    out to be.”


    “Here,” Sandy said, “why don’t you borrow my copy of Design Tangle until the copy
    you’re going to order comes in.”'
