  md: '# CHAPTER 26


    # The Visitor Pattern


    The Visitor pattern turns the tables on our OO model and creates an external class
    to act on data in other classes. This is useful when you have a polymorphic operation
    that cannot reside in the class hierarchy for some reason. For example, the operation
    wasn''t considered when the hierarchy was designed or because it would clutter
    the interface of the classes unnecessarily.


    While at first it seem "unclean" to put operations that should be inside of a
    class in another class instead, there are good reasons for doing this. Suppose
    that each of a number of drawing object classes has similar code for drawing itself.
    The drawing methods might differ, but they probably all use underlying utility
    functions that you might have to duplicate in each class. Further, a set of closely
    related functions is scattered throughout a number of different classes, as shown
    in Figure 26.1.


    # Motivation


    ![](img/68cf94ac4e1285ea25e571564f85e824_267_0.png)


    Figure 26.1 A DrawObject and three of its subclasses.


    249'
