  md: "# Cloning in Java\n\nYou can make a copy of any Java object using the clone\
    \ method.\n(Object)obj.clone();\nThe clone method always returns an object declared\
    \ to have a return type of Object. Thus you must cast it to the actual type of\
    \ the object that you are cloning. Three other significant restrictions apply\
    \ to this method:\n\n+   1. It is a protected method and can be called only from\
    \ within the same class or a subclass.\n2. You can clone objects that are declared\
    \ to implement the Cloneable interface. All arrays are considered to implement\
    \ the Cloneable interface.\n3. Any whose class is Object does not implement Cloneable\
    \ and throws the CloneNotSupported Exception.\n\nSince the clone method is protected,\
    \ it suggests packaging the public, visible clone method inside of the class,\
    \ where it can access that protected method.\npublic abstract class SwimData implements\
    \ Cloneable {\npublic Object cloneMe() throws CloneNotSupportedException {\n \
    \ return super.clone();\n}\n\nYou can also create special cloning procedures that\
    \ change the data or processing methods in the cloned class, based on arguments\
    \ that you pass to the clone method. In this case, method names such as make are\
    \ probably more descriptive and suitable.\n\n# Using the Prototype\n\nNow let's\
    \ write a simple program that reads data from a database and then clones the resulting\
    \ object. In our example program, SwimInfo, we just read these data from a file,\
    \ but the original data were derived from a large database as we mentioned previously.\n\
    \nThen we create a class Swim that holds one swimmer's name, age, sex, club, and\
    \ time.\n\n```\npublic class Swimmer {\n  String name;     //name of swimmer\n\
    \  int age;         //age of swimmer\n  String club;     //name of club\n  float\
    \ time;      //result of time\n  boolean female;  //sex\n```"
