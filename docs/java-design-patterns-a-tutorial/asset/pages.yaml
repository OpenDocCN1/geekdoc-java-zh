  md: '# 312


    # CHAPTER 34 Sandy and the Mediator


    +   * defines how a set of objects interact,

    * keeps the coupling between objects loose, and

    * allows us to change object interfaces without having to change every-thing else.


    That’s what we need. Let’s look at the interactions now.

    They drew them on the board together.


    “See,” said Sandy, “the Mediator gets the commands from all of the buttons. It
    decides which objects need to know about them. Then, if we change the classes,
    we have to change only the Mediator.”


    “But what about the server?” asked Arthur. “The search engine takes some time
    to return all of the information. How can we refresh the display later without
    hanging the system?”


    “That sounds like an Observer pattern to me,” said Sandy. “We spin off the search
    request in a different thread and notify the Observer when the result comes back.
    Then the Observer can tell the Mediator that it is time to change the display
    objects. That’s pretty good. We’ve gotten most of the tangles out of this rat’s
    nest.”


    “And, you know,” said Arthur, “we can simplify the code that loads display list
    box using an Adapter pattern. And not that, the ListModel already is implementing
    the AbstractList. Isn’t that an example of the Template pattern? Patterns aren’t
    so hard. This is going to make this project much easier.”


    To read more about Sandy’s project, review the papers by Cooper and Byrd [1997,
    1998] and Neff and Cooper [1999] in the bibliography.'
