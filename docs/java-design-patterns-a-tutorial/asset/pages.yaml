  md: '# CHAPTER 24


    # The Strategy Pattern


    The Strategy pattern is much like the State pattern in outline but a little different
    in intent. The Strategy pattern consists of a number of related algorithms encapsulated
    in a driver class called Context. Your client program can select one of these
    algorithms, or in some cases Context might select the best one for you. The intent
    is to make these algorithms interchangeable and provide a way to choose the most
    appropriate one. The State and Strategy differ in that the user generally chooses
    which of several strategies to apply, and only one strategy at a time is likely
    to be instantiated and active within the Context class. By contrast, all of the
    different states could possibly be active at once, and switching between them
    might occur often. In addition, Strategy encapsulates several algorithms that
    do more or less the same thing, while State encapsulates related classes that
    each do somewhat different. Finally, the concept of transition between different
    states is completely missing in the Strategy pattern.


    # Motivation


    A program that requires a particular service or function and has several ways
    of carrying out that function is a candidate for the Strategy pattern. Programs
    choose between these algorithms based on computational efficiency or user choice.
    There may be any number of strategies, more can be added, and any can be changed
    at any time.


    Often, you want to do the same thing in different ways, such as the following,
    mentioned in Smalltalk Companion:


    +   * Save files in different formats.

    * Compress files using different algorithms.

    * Capture video data using different compression schemes.'
  merge: -1
