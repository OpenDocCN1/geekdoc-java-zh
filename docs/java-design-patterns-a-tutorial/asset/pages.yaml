    5. Mouse drag


    The three buttons can be constructed as Command objects, and the mouse click and
    drag can be treated similarly. Because we have a number of visual objects that
    control the display of screen objects, this suggests an opportunity to use the
    Memento pattern, and that is the way this program is constructed.


    We''ll create a Caretaker class to manage the Undo action list, it can keep a
    list or the $n$ operations so that they can be undone. The Memento maintains the
    list of drawing objects and communicates with the Caretaker object. In fact, because
    a program could contain any number of actions to save and undo, a Mediator is
    virtually required so that there is a single place to send these commands to the
    Undo list in the Caretaker.


    In this program, we save and undo only two actions: creating rectangles and changing
    the positions of rectangles. Let''s start with the visRectangle class, which actually
    draws each instance of the rectangles.'
