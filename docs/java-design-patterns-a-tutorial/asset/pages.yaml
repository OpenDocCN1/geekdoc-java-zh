  md: '# CHAPTER 13


    # The Façade Pattern


    In this chapter, we take up the Façade pattern. This pattern is used to wrap a
    set of complex classes into a simpler enclosing interface.


    Frequently, as your programs evolve and develop, they grow in complexity. In fact,
    for all the excitement about the benefits of design patterns, these patterns sometimes
    generate so many classes that it is difficult to understand the program''s flow.
    Furthermore, there may be a number of complicated subsystems, each of which has
    its complex interface.


    The Façade pattern allows you to simplify this complexity by providing a simplified
    interface to to subsystems. This simplification in some cases reduce the flexibility
    of the underlying classes, but usually it provides all of the function needed
    for all but the most sophisticated users. These latter users can, of course, still
    access the underlying classes and methods.


    Fortunately, we don''t have to write a complex system to provide an example of
    where a Façade can be useful. Java provides a set of classes that connect to databases
    using an interface called JDBC. You can connect to any database for which the
    manufacturer has provided a JDBC connection class—almost every database on the
    market. Some databases have direct connections using JDBC, and a few allow connection
    to an ODBC driver using the JDBC-ODBC bridge class.


    These database classes, in the java.sql package, provide an excellent example
    of a set of quite low-level classes that interact in a convoluted manner, as shown
    in Figure 13.1.'
