  md: "# Enumerations in Java\n\nNot having a method to move to the top of a list\
    \ might seem restrictive at first. However, it is not a serious problem in Java\
    \ because you customarily obtain a new instance of the Enumeration each time you\
    \ want to move through a list. Disadvantages of the Java Enumeration over similar\
    \ constructs in C++ and Smalltalk are the strong typing of the Java language,\
    \ as well as its lack of templates. This prevents the hasElements method from\
    \ returning an object of the actual type of the data in the collection without\
    \ an annoying requirement to cast the returned Object type to the actual type.\
    \ Thus, while the Iterator or Enumeration interface is intended to be polymorphic,\
    \ this is not directly possible in Java.\n\nThe Enumeration type is built into\
    \ the Vector and Hashtable classes. Rather than these classes implementing the\
    \ two methods of Enumeration directly, both contain an elements method that returns\
    \ an Enumeration of class's data.\n\n```\npublic Enumeration elements();\n```\n\
    \nThis elements method is really a kind of Factory method that produces instances\
    \ of an Enumeration class.\n\nThen you move through the list using the following\
    \ simple code:\n\n```\nEnumeration e = vector.elements();\nwhile (e.hasMoreElements())\
    \ {\n  String name = (String)e.nextElement();\n  System.out.println(name);\n}\n\
    ```\n\nIn addition, the Hashtable also has the keys method, which returns an Enumeration\
    \ of the keys to each element in the table:\n\n```\npublic Enumeration keys();\n\
    ```\n\nThis is the preferred style for implementing Enumerations in Java and has\
    \ the advantage that you can have any number of simultaneous active enumerations\
    \ of the same data.\n\n# Sample Code\n\nLet us reuse the list of swimmers, clubs,\
    \ and times we described for the interpreter in Chapter 18 and add some enumeration\
    \ capabilities to the KidData class. This class is essentially a collection of\
    \ Kid objects, each with a name, club, and time stored in a Vector."
