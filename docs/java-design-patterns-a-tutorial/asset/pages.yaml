    # Java Beans as Bridges


    The Java Beans programming model is an ideal example of a Bridge pattern implementation.
    A Java Bean is a reusable software component that can be manipulated visually
    in a Builder tool. All of the JFC components are written as Beans, which they
    support a query interface (using the Introspector class) that enable builder programs
    to enumerate their properties and display them for easy modification. Figure 10.4
    shows a screen from Symantic Visual Café, showing a panel with a text field and
    a check box. The builder panel to the right shows how you can modify the properties
    of either of those components by using a simple visual interface.'
