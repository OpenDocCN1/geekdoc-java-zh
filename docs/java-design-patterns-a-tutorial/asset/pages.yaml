    sequence of methods, some implemented in the base class and some imple-\mented
    in the derived class. This Template method defines a general algo-

    rith, although the details might not be worked out completely in the you

    class.


    +   3. Template classes often have some abstract methods that you might override

    de the derived classes. They might also have some classes with a simple

    placeholder implementation that you are free to override where appropri-

    tate. If these placeholder classes are called from another method in the base

    class, then these overridable methods are called Hook methods.


