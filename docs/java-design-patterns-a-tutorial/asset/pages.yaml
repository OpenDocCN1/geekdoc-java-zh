    This produces the table displayed in Figure 32.1.

    This table has all cells editable and displays all of the cells using the toString
    method of each object. Like the JList interface, this interface to JTable creates
    a data model object under the covers. To produce a more flexible display, you
    need to create that data model yourself.

    You can create a table model by extending the AbstractTableModel class. All of
    the methods have default values and operations, except the following three, which
    you must provide:


    ```

    public int getRowCount();

    public int getColumnCount();

    public Object getValueAt(int row, int col);

    ```


    However, you can gain a good deal control by overriding couple of other methods.
    For example, you can use the method

    public boolean isCellEditable(int row, int col)

    to protect some cells from being edited. To allow editing of some cells, you must
    override the implementation for the method

    public void setValueAt(Object obj, int row, int col)


    Further, by adding a method that returns the data class of each object to be displayed,
    you can use some default cell-formatting behavior. The JTable''s default cell
    renderer displays the following:


    +   * Numbers as right-aligned labels

    * Imageicons as centered labels'
