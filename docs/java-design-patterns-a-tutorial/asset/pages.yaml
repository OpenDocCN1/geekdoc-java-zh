    # # When to Use a Factory Method


    You should consider using a Factory method under the following circumstances:


    +   * A class cannot anticipate which kind of objects that it creates.

    * A class uses its subclasses to specify which objects it creates.

    * You want to localize the knowledge of which class gets created.


    There are several variations on the Factory pattern.


    +   1. The base class is abstract, and the pattern must return a complete working
    class.

    2. The base class contains default methods and is subclassed only when the default
    methods are insufficient.

    3. Parameters are passed to the factory telling it which of several class types
    to return. In this case, the classes may share the same method names, but each
    may do something quite different.


    ![](img/68cf94ac4e1285ea25e571564f85e824_49_0.png)


