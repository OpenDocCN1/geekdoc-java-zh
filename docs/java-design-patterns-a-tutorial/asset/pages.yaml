  md: '# Discussion


    A flyweight is a sharable instance of a class. At first glance, each class might
    appear to be a Singleton. In fact, a small number of instances might exist, such
    as one for every character or one for every icon type. The number of instances
    that are allocated must be decided as the class instances are needed; usually
    a FlyweightFactory class does this. This factory usually is a Singleton, since
    it needs to keep track of whether a particular instance has been generated. It
    returns either a new instance or reference to one that it has already generated.


    To decide if some part of your program is a candidate for Flyweights, consider
    whether it is possible to remove some data from the class and make it extrinsic.
    If this makes it possible to reduce the greatly number of different class instances
    that your program needs to maintain, then Flyweights will help.


    # Example Code


    Suppose that we want to draw a smaller folder icon with a name under it for each
    person in an organization. If the organization is large, there could be many such
    icons; however, they are actually all the same graphical image. Even if we have
    two icons, one for “is Selected” and one for “not Selected,” the number of different
    icons is small. In such a system, having an icon object for each person—with its
    own coordinates, name, and selected state—is a waste of resources. Figure 14.2
    shows two such icons.


