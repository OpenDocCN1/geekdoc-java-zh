  md: '# CHAPTER 12


    # The Decorator Pattern


    The Decorator pattern provides us with a way to modify the behavior of individual
    objects without having to create a new derived class. Suppose we have a program
    that uses eight objects, but three of them need an additional feature. You could
    create a derived class for each of these objects, and in many cases this would
    be a perfectly acceptable solution. However, if each of these three objects requires
    different features, you would have to create three derived classes. For, if one
    of the classes has features of both of the other classes, you begin to create
    complexity that is both confusing and unnecessary.


    For example, suppose we wanted to draw a special border around some of the buttons
    in a toolbar. If we created a new derived class all of the buttons in this new
    class would always have this same new border, when this might not be our intent.


    Instead, we create a Decorator that decorates the buttons. We derive any number
    of specific Decorators from the main Decorator class, which performs a specific
    kind of decoration. In order to decorate a button, the Decorator would have to
    be an object derived from the visual environment so that it can receive paint
    method calls and forward calls to other useful graphics methods to the object
    that it is decorating. This is another case in which object containment is favored
    over object inheritance. The Decorator is a graphical object, but it contains
    the object that it is decorating. It might intercept some graphical method calls
    and perform some additional computation, and then it might pass them on to the
    underlying object that it is decorating.


