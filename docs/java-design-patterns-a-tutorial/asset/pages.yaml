  md: "# Cloning Using Serialization\n\nit could return different groups of swimmers\
    \ who swam different strokes and distances. It could also manage list boxes (of\
    \ several types) are returned and to display them, including tables, multicolumn\
    \ lists, and graphical displays. It is important that subclass is returned does\
    \ not require casting to a new class in order to be used in the program. In other\
    \ words, the methods of the parent abstract or base class should be sufficient,\
    \ and the client should never need to know which actual subclass it is dealing\
    \ with.\n\n# Cloning Using Serialization\n\nHere is a clever trick, which some\
    \ have called a \"hack,\" for cloning using the serializable interface. A class\
    \ is said to be serializable if you can write it out as a stream of bytes and\
    \ then read those bytes back to reconstruct the class. This is how Java remote\
    \ method invocation (RMI) and Java Beans are implemented.\n\nHowever, if we declare\
    \ both the Swimmer and SwimData classes as Serializable,\n\n```\npublic SwimData\n\
    \    implements Cloneable, Serializable\n\nclass Swimmer implements Serializable\n\
    ```\n\nwe can write the bytes to an output stream and reread them to create a\
    \ data copy of that instance of a class.\n\n```\npublic Object deepClone() {\n\
    \    ByteArrayOutputStream b = new ByteArrayOutputStream();\n    ObjectOutputStream\
    \ out = new ObjectOutputStream(b);\n    out.writeObject(this);\n    ByteArrayInputStream\
    \ bin = new\n        ByteArrayInputStream(b.toByteArray());\n    ObjectInputStream\
    \ oi = new ObjectInputStream(bin);\n    return (oi.readObject());\n}\n} catch\
    \ (Exception e) {\n    System.out.println(\"exception\":+e.getMessage());\n  \
    \  return null;\n}\n}\n```\n\nThis deepClone method allows you to copy an instance\
    \ of a class of any complexity and have data be completely independent between\
    \ the two copies, as long as all of the classes that class contains can be declared\
    \ serializable."
