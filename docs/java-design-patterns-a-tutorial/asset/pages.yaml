  md: '# Template Method Patterns in Java


    # Kinds of Methods in a Template Class


    As set out in Design Patterns, the Template pattern has four kinds of methods
    that you can use of in derived classes:


    +   Complete methods that carry out some basic function that all of the sub-classes
    want to use, such as calcx and calcy in the previous example. These are called
    Concrete methods.


    +   Methods that are not filled in at all and must be implemented in derived classes.
    In Java, you would declare these as abstract methods, and that is they are referred
    to in the pattern description.


    +   Methods that contain a default implementation of some operations which may
    be overridden in derived classes. These are called Hook methods. Of course, this
    is somewhat arbitrary in Java you can override any public or protected method
    in the derived class. But Hook methods are intended to be overridden, whereas
    Concrete methods are not.


    +   Finally, a Template class may contain methods that call any combination of
    abstract, hook, and concrete methods. These methods are not intended to be overridden
    but describe an algorithm without actually implementing its details. Design Patterns
    refers to these as Template methods.


    # Template Method Patterns in Java


    Java abounds with Template patterns. A large number of classes start out with
    an abstract class with only a few methods filled in and have subclasses where
    these methods are implemented.


    # AbstractTableModel


    The TableModel interface defines all of the required methods for the data class
    for handling data for a JTable display. The AbstractTableModel provides default
    implementations for all three of these methods. When you create the data class,
    you must provide implementations for getRowCount(), getColumnCount(), and getValueAt(int
    row, int column).


    # AbstractBorder


    The Border interface defines the methods for a border to surround any JComponent.
    The AbstractBorder class provides default implementations of all of these'
