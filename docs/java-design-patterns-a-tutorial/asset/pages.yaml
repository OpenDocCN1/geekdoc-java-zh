  md: '# CHAPTER II


    # The Composite Pattern


    Programmers often develop systems in which a component may be an individual object
    or may represent a collection of objects. The Composite pattern is designed to
    accommodate both cases. You can use it to build part-whole hierarchies or to construct
    data representations of trees. In summary, a composite is a collection of objects,
    any one of which may be either a composite or a primitive object. In tree nomenclature,
    some objects may be nodes with additional branches and leaves, and some may be
    leaves.


    A problem that develops is the dichotomy between having a single, simple interface
    to access all of the objects in a composite and the ability to distinguish between
    nodes and leaves. Nodes have children and can have children added to them, while
    leaves do not at the moment have children and in some implementations may be prevented
    from having children added to them.


    Some authors have suggested creating a separate interface for nodes and leaves,
    where a leaf could have the following methods:


    ```

    public String getName();

    public String getValue();

    ```


    A node could have the following methods:


    ```

    public Enumeration elements();

    public Node getChild(String nodeName);

    public void add(Object obj);

    public void remove(Object obj);

    ```


    This then leaves us with the programming problem of deciding which elements will
    be when we construct the composite. However, Design Patterns suggests that each
    element should have the same interface, whether it is a composite or a primitive
    element. This is easier to accomplish, but we are left'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 92 CHAPTER II The Composite Pattern


    with the question of what the getChild operation should accomplish when the object
    is actually a leaf.


    Java makes this quite easy for us, since every node or leaf can return an Enumeration
    of the contents of the Vector where the children are stored. If there are no children,
    the hasMoreElements method returns false once. Thus if we obtain the Enumeration
    from each element, we can quickly determine whether it has any children by checking
    the hasMoreElements method.


    Just as difficult is the issue of adding or removing leaves from elements of the
    composite. A nonleaf node can have child leaves added to it, but a leaf node cannot.
    However, we would like all of the components in the composite to have the same
    interface. Attempts to add children to a leaf node must not be allowed, and we
    can design the leaf node class to throw an exception if the program attempts to
    add to such a node.


    # An Implementation of a Composite


    Let’s consider a small company that was started by one person who got the business
    going. He was, of course, the CEO, although he might have been busy to think about
    it first. Then he hired a couple of people to handle the marketing and manufacturing.
    Soon each of them hired some assistants to help with advertising, shopping, and
    so on, and they became the company’s first two vice-presidents. As the company’s
    success continued, the firm grew until it had the organizational chart that we
    see in Figure 11.1.


    ![](img/68cf94ac4e1285ea25e571564f85e824_110_0.png)


    Figure 11.1 A typical organizational chart.'
