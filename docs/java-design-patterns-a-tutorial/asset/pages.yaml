    # Summary of Creational Patterns


    Following is a summary of the Creational patterns:


    +   * Factory pattern: used to choose and return an instance of a class from a
    number of similar classes based on data you provide to the factory.

    * Abstract Factory pattern: returns one of several groups of classes. In some
    cases, it actually returns a Factory pattern for that group of classes.

    * Builder pattern: assembles a number of objects to make a new object, based on
    the data with which it is presented. Often the choice of which the objects are
    assembled is achieved using a Factory pattern.

    * Prototype pattern: copies or clones an existing class rather than creating a
    new instance, when creating new instances is more expensive.

    * Singleton pattern: ensures that there is one and only one instance of an object
    and that it is possible to obtain global access to that one instance.'
