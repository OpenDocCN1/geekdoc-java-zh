  md: "# Switching between States\n\nNow that we have defined how each state behaves\
    \ when mouse events are sent to it, we need to decide how the StateManager switches\
    \ between states. We set the currentState variable to the state that is indicated\
    \ by the selected button.\n\n```\npublic class StateManager {\n    private State\
    \ currentState;\n    private RectState rState;\n    private ArrowState aState;\n\
    \    private CircleState cState;\n    private FillState fState;\n}\n\npublic StateManager(Mediator\
    \ med) {\n    rState = new RectState(med);\n    cState = new CircleState(med);\n\
    \    aState = new ArrowState(med);\n    fState = new FillState(med);\n    currentState\
    \ = aState;\n}\n// methods are called when the toolbar buttons\npublic void setRect(State\
    \ currentState) {currentState = rState;}\npublic void setCircle(State currentState)\
    \ {currentState = cState;}\npublic void setFill(State currentState) {currentState\
    \ = fState;}\npublic void setArrow(State currentState) {currentState = aState};\n\
    ```\n\nNow in this version of the StateManager, we create an instance of state\
    \ during the constructor and copy the correct one into the state variable when\
    \ the set methods are called. We could also create these states on demand. This\
    \ might be advisable if a large number of states exists, each of which consumes\
    \ a fair number of resources.\n\nThe remainder of the StateManager code calls\
    \ the methods of whichever state object is current. This is the critical piece\
    \ of code; there is no conditional testing. Instead, the correct state is already\
    \ in place, and its methods are ready to be called.\n\n```\npublic void mouseDown(int\
    \ x, int y) {\n    currentState.mouseDown(x, y);\n}\npublic void mouseUp(int x,\
    \ int y) {\n    currentState.mouseUp(x, y);\n}\npublic void mouseDrag(int x, int\
    \ y) {\n    currentState.mouseDrag(x, y);\n}\npublic void select(Drawing d, Color\
    \ c) {\n    currentState.select(d, c);\n}\n```"
