  md: '# # CHAPTER 30


    # ## Menus and Actions


    The JMenu Bar and JMenu classes in work almost the same as those in the AWT. However,
    the JMenuItem class adds constructors that allow you to include an image alongside
    the menu text. To create a menu, you create a bar, top-level menus, and then add
    menu items to each top-level menu.


    The JMenuItem object also generates an ActionEvent, then menu clicks cause these
    events to be generated. With buttons, you simply add Action-Listeners to each
    of them.


    ```

    Open.addActionListener(this); //for example

    Exit.addActionListener(this);

    ```


    # ## Action Objects


    Menus and toolbars are really two ways of representing the same thing: a single
    click interface to initiate some program function. Swing also provides an Action
    interface that encompasses both.


    ```

    public void putValue(String key, Object value);

    public Object getValue(String key);

    public void actionPerformed(ActionEvent e);

    ```'
