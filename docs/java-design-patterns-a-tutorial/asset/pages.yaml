  md: '# 110  CHAPTER 12 The Decorator Pattern


    The class FilterInputStream itself simply overrides all methods of InputStream
    with versions that pass all requests to the underlying input stream. Subclasses
    of FilterInputStream may further override some of these methods as well as provide
    additional methods and fields.


    The FilterInputStream class is thus a Decorator that can be wrapped around any
    input stream class. It is essentially an abstract class that doesn''t do any processing
    but provides a layer on which the relevant methods have duplicated. It normally
    forwards these method calls to the enclosed parent stream.


    The interesting classes derived from FilterInputStream include those in the following
    table:


    | Class | Description |

    |---|---|n| BufferedInputStream | Adds buffering to the stream so that every call
    does not cause I/O to occur. |

    | CheckedInputStream | Maintains a checksum of bytes as they are read. |

    | DataInputStream | Reads primitive types (Long, Boolean, Float, and so on) from
    the input stream. |

    | DigestInputStream | Computes a MessageDigest of any input stream. |

    | InflateInputStream | Implements methods or uncompressing data. |

    | PushbackInputStream | Provides a buffer from which data can be "unread," if
    parsing you discover that you need to back up. |


    These Decorators can be nested, so a pushback, buffered input stream is quite
    possible.


    As an example, consider a program to filter an e-mail stream to make it more readable.
    The user of an e-mail program types quickly and perhaps all in one case. The sentences
    can be made more readable if the first word of each sentence is capitalized. We
    accomplish this by interposing a Filterclass, derived from FilterInputStream to
    read the data and transform it to mixed case. In Figure 12.5, we show a simple
    display, illustrating the original text on the left and the filtered text on the
    right.'
