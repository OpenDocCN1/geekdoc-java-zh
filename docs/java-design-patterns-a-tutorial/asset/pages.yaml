  md: '# CHAPTER 14


    # # The Flyweight Pattern


    In this chapter we take up the Flyweight pattern, which is used to avoid the overhead
    of large numbers of very similar classes.


    Sometimes, you need to generate a very large number of small class instances to
    represent data. You can greatly reduce the number of different classes that you
    need to instantiate if you can determine that the instances are fundamentally
    the same, except for a few parameters. If you can move those variables outside
    of the class instance and pass them in as part of a method call, you greatly reduce
    the number of separate instances by sharing them.


    The Flyweight pattern provides an approach for handling such classes. It refers
    to the instance''s *intrinsic* data that make the instance unique and the *extrinsic*
    data that are passed in as arguments. The Flyweight is appropriate for small,
    finely grained classes such as those for individual characters or icons on the
    screen. For example, you might draw a series of icons on the screen in a window,
    with each icon representing a person or data file as a folder, as shown in Figure
    14.1.


    In this case, it doesn''t make sense for each folder to have an individual instance
    that remembers the person''s name and the icon''s screen position. Typically,
    an icon is one of a few similar images, and the position where it is drawn is
    calculated dynamically based on the window''s size.


    In another example in Patterns, each chapter in a Document is represented as a
    single instance of a character class, but the positions where the characters are
    drawn on the screen are kept as external data so that only one instance of each
    character is needed, rather than one appearance of that character.'
