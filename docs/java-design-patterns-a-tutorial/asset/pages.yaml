  md: '# CHAPTER 26 The Visitor Pattern


    ![](img/68cf94ac4e1285ea25e571564f85e824_268_0.png)


    **Figure 26.2** A visitor class that visits each of three triangle classes.


    Instead, you can write a Visitor class that contains all of the related draw methods
    and have it visit each object in succession (Figure 26.2).


    Most people who first read about this pattern typically ask, "What does visiting
    mean?" An outside class can gain access to another class in one way: by calling
    its public methods. In the Visitor''s case, visiting each case means that you
    call a method already installed for this purpose, *accept*. The *accept* method
    has one argument: the instance of the visitor. It then calls the method of the
    Visitor, passing itself as an argument, as shown in Figure 26.3.


    ![](img/68cf94ac4e1285ea25e571564f85e824_268_1.png)


    **Figure 26.3** How the visit and accept methods interact.


    Put in simple code terms, every object that you want to visit must have the following
    method:'
