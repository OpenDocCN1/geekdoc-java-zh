  md: "# Using the Prototype Pattern\n\nWhy have the names in the left-handed list\
    \ box also been re-sorted? This occurs in Java because the clone method is a shallow\
    \ copy of the original class. In other words, the references to the data objects\
    \ are copies, but they refer to the same same underlying data. Thus any operation\
    \ performed on the copied data will also be on the original data in the Prototype\
    \ class.\n\nIn some cases, this shallow copy might be acceptable, but if you want\
    \ to make a deep copy of the data, you must write a deep cloning routine of your\
    \ own as part of the class you clone. In this simple class, you just create a\
    \ new Vector using a constructor that creates the new instance and copies the\
    \ elements of the old's Vector into the new one.\n\n```\npublic TimeWeatherData(Vector\
    \ sw) {\n//this constructor copies vector as a clone\nswimmers = new Vector();\n\
    for (int i = 0; i < sw.size(); i++) {\n    swimmers.add(sw.elementAt(i));\n}\n\
    }\npublic SwimData myClone() {\n    return new SwimData(swimmers);\n}\n```\n\n\
    # Using the Prototype Pattern\n\nYou can use the Prototype pattern whenever any\
    \ of a number of classes might be created or when the classes are modified after\
    \ being created. As long as all of the classes have the same interface, they can\
    \ actually be from entirely different hierarchies.\n\nLet's consider a more elaborate\
    \ example of the listing of swimmers we discussed previously. Instead of just\
