  md: "# Building Command Objects\n\n```\npublic interface Command {\n    public void\
    \ Execute();\n}\n```\n\nWe use this interface to reduce the actionPerformed method\
    \ to the following:\n\n```\npublic void actionPerformed(ActionEvent e) {\n   \
    \ Command cmd = (Command)e.getSource();\n    cmd.Execute();\n}\n```\n\nThen we\
    \ can provide the Execute method for each object that carries out the desired\
    \ action, keeping the knowledge of what to do inside the object it belongs, instead\
    \ of having another part of the program make these decisions.\n\nOne important\
    \ purpose of the Command pattern is to keep the program and user interface objects\
    \ completely separate from the actions they initiate. In other words, these program\
    \ objects should be completely separate from each other and should not have to\
    \ know how other objects work. The user interface receives a command and tells\
    \ a Command object to carry out every duties it has been instructed to do. The\
    \ GUI does not and should not need to know what tasks will be executed. This decouples\
    \ the UI class from the execution of specific commands, thereby making it possible\
    \ to modify or completely change the action code without changing the classes\
    \ that use the user interface.\n\nYou can also use the Command object to tell\
    \ the program when the resources are available rather than immediately. In such\
    \ cases, we are queuing commands to be executed later. Finally, you can use Command\
    \ objects to remember operations so that you can support Undo requests.\n\n# Building\
