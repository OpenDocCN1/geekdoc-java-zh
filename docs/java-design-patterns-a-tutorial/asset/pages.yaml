  md: '# Consequences of the Prototype Pattern


    Using the Prototype pattern,


    +   1. You can add and remove classes at runtime by cloning them as needed.


    +   2. You can revise the internal data representation of a class at runtime based
    on program conditions.


    +   3. You can also specify new objects at runtime without creating a proliferation
    of classes and inheritance structures.


    One difficulty in implementing the Prototype pattern in Java is that if the classes
    already exist, you might not be able to change them to add the required clone
    or deepClone methods. Using the deepClone method can be particularly difficult
    if all of the class objects contained in a class cannot be declared easily. In
    addition, classes that have circular references to other classes cannot be cloned.


    Similar to Singletons, discussed in Chapter 6, you can create a registry of Prototype
    classes that can be cloned and ask the registry for a list of possible prototypes.
    You might be able to clone an existing class rather than a prototype must itself
    be instantiated (perhaps at some expense) in order for you to use a Prototype
    registry. Note, however, every class that you might use as a prototype registry
    This can be a performance drawback.


    Finally, the idea of having Prototype classes to imply that you have sufficient
    access to the data or methods in these classes to change them after cloning. This
    might require adding data access methods to these prototype classes so that you
    can modify the data once you have cloned the class.


    # THOUGHT QUESTION


    +   1. An entertaining banner program shows a slogan starting at different places
    on the screen at different times and in different fonts and sizes. Design the
    program using a Prototype pattern.


    ![](img/68cf94ac4e1285ea25e571564f85e824_84_0.png)'
