    `// rez: Vector(9, 10, 10, 11, 10, 11, 11, 12)`


    As shown in the comment, the result of this `for` expression is a `Vector` that
    contains the list of integers shown. (`Vector` is a specific type of sequence
    (`Seq`) that is immutable, and generally has very good performance in many different
    situations.)


    ## Guards


    *Guards* are basically `if` conditions that you add to the first part of `for`
    loops and expressions, and they look like this:


    `val newValues =`


    `    for`


    `        i <- 1 to 5`


    `        j <- 6 to 10`


    `        if i > 3`


    `        if j < 7`


    `    yield`


    `        i + j`


    `// newValues: Vector(10, 11)`


    As shown, you can add as many generators and guards as you need for your algorithm.


    > As I mention in my other books, the benefit of Scalaâ€™s `for` syntax is that
    it separates your generators and guards (in the first section) from your business
    logic (which comes in the second section, after the `do` and `yield` keywords).


    # 35\. JIT: Code Blocks (Closures)


    Before we get into the next TDL lesson, I need to cover a Scala language feature
    I refer to as *code blocks*, or *blocks of code*. Iâ€™ve seen in other languages
    that this feature can be called a *closure* (but I think there are multiple definitions
    of that term).


    In short, you create a block of code in Scala using curly braces, like this:


    `val a = {`


    `    // a block of code`


    `    println("hi mom")`


    `    42`


    `}`


    The result of a code block is its final value. In this example that value is the
    integer `42`, so if you want to explicitly delare `a`â€™s type, itâ€™s an `Int`:


    `val a: Int = {        // <== explicitly set the type`


    `    // a block of code`


    `    println("hi mom")`


    `    42`


    `}`


    Notice that any legal Scala code can be inside that code block, such as the side
    effect of printing to STDOUT. But from Scalaâ€™s perspective, its return type
    is `Int`.


    You can demonstrate this for yourself in the Scala REPL by passing a code block
    to its `:type` command:


    `scala> :type { println("hi"); 42 }`


    `Int`


    `scala> :type { println("hi"); "dude" }`


    `String`


    Again, notice that the *type* of the code block is that last value returned by
    it. And if that last value is something that yields `Unit`, thatâ€™s the blockâ€™s
    type:


    `scala> :type { val a = 73; println("hi") }`


    `Unit`


    As we get ready for the next lesson, being aware of code blocks in Scala is one
    thing youâ€™ll need to know.


    # 36\. JIT: Recursion


    The other programming technique youâ€™ll have to have some awareness of before
    the next lesson is *recursion*. Recursion can be really fun, and itâ€™s an important
    FP technique, so I spend over 50 pages explaining it in [Functional Programming,
    Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book).


    ## Writing a recursive function


    In short, a recursive function is a function that calls itself. To demonstrate
    this, letâ€™s create a recursive function that â€œcounts downâ€ to `0`. The idea
    is that you give it some integer, and it prints down to `0`, as shown in the REPL:


    `scala> countdown(3)`


    `3`


    `2`


    `1`


    Right away you can see that this function takes an `Int` parameter:


    `def countdown(i: Int)`


    You can also see that it prints its result, and doesnâ€™t return anything, so
    its return type is `Unit` (which is like `void` in Java and other languages):


    `def countdown(i: Int): Unit =`


    Normally I implement most recursive functions using `match` expressions, but to
    keep this familiar for OOP developers, Iâ€™ll use an `if`/`then` expression here.


    The first thing I usually do when I write a recursive function is to specify its
    *end* or *stop* condition. In this case, I know that I want the recursion to stop
    when the `Int` parameter is `0`, so I write that condition first:


    `def countdown(i: Int): Unit =`


    `    if i == 0 then`


    `        // STOP HERE`


    At this point I know two things: (a) I want the recursive calls to stop here,
    and (b) the function needs to return `Unit`. Therefore, I return the `Unit` *value*
    â€” `()` â€” here:


    `def countdown(i: Int): Unit =`


    `    if i == 0 then`


    `        ()`


    The symbol `()` is the one and only instance of the `Unit` type, and as youâ€™ll
    see, this is how the recursive calls stop: they hit this `if` condition, `()`
    is yielded, and the recursive calls unroll.


    Now that I have the stop condition I want, I write the rest of the algorithm,
    i.e., the portion of the code that calls itself. Here I know from the functionâ€™s
    output that I want to do two things: (a) print the current value of `i`, and (b)
    make the recursive call.


    An important part of the second step is that I reduce the value of `i` by `1`
    when making the call. If I fail to do this, the recursion will continue forever,
    so this is another key:


    `def countdown(i: Int): Unit =`


    `    if i == 0 then`


    `        ()`


    `    else`


    `        println(i)`


    `        countdown(i - 1)   // the recursive call`


    I donâ€™t want to make light of it, but basically thatâ€™s all there is to recursion.
    Please verify that code in the REPL, and make sure youâ€™re comfortable with it.


    ## An example with a match expression


    A fun recursive algorithm to write is a â€œsumâ€ algorithm for a `List[Int]`.
    A key here is to know that a Scala `List` is implemented just like a *Lisp* list,
    as a series of *cons* cells that end with a `Nil` value:


    `1 :: 2 :: 3 :: Nil`


    I believe this is the type of linked-list youâ€™re taught in college, so Iâ€™m
    going to assume that youâ€™ve at least seen or heard of this before, but the key
    is that ending `Nil` value.


    Getting into the algorithm, we know that we want to write a sum function:


    `def sum`


    It takes a `List[Int]` parameter:


    `def sum(list: List[Int])`


    and it returns a sum of the ints:


    `def sum(list: List[Int]): Int`


    I also stated that I want to implement this with a `match` expression:


    `def sum(list: List[Int]): Int = list match`


    Again, I like to write the *stop* condition first, and the stop condition when
    you work on a `List` is always the `Nil` value:


    `def sum(list: List[Int]): Int = list match`


    `    case Nil =>`


    ### Identity value


    One reason Iâ€™m sharing this example is that it also helps to know a mathematical
    concept called an *identity value (or element)*. In short, when youâ€™re working
    with (a) a set of integers and (b) a sum algorithm, the identity element is the
    value `0`. This means that when you sum a list of integers, the value `0` adds
    nothing to that sum.


    Similarly, the value `1` is the identity value for (a) a list of integers along
    with (b) a *product* algorithm: when you multiply an integer by `1`, it doesnâ€™t
    modify the value. This is a key concept to know when working with recursion.


