    ready, run the blueprint now.â€ The Cats Effect and ZIO libraries have a similar
    incantation, and historically that incantation has been a function named something
    like `runUnsafe`. This means that when youâ€™re ready to run your entire application
    â€” or in this example, just this `for` expression â€” you run it like this:


    `runUnsafe(result)`


    The actual function names vary, but the word â€œunsafeâ€ is an FP way of saying,
    â€œHang on everyone, weâ€™re going to execute the blueprint now, including all
    those unsafe side effects.â€ *Until now* everything was all equations and blueprints,
    and nothing happened, but *now* itâ€™s action time.


    And now, to wrap up this lesson, I want to add two notes.


    ## Note 1: Future is not like this


    First, itâ€™s important to be clear that the Scala `Future` *does not* work like
    this. For example, if the earlier `input` value was written like this:


    `val input: Future[String] = Future(doSomeSideEffect())`


    the `doSomeSideEffect` function will be run immediately. This is how `Future`
    works, it runs immediately.


    From an FP standpoint, this is bad; itâ€™s a design flaw. The flaw is that `Future`
    combines the blueprint and its action in the same step. As FPers, we need to be
    able to layout the blueprint without it starting to run while weâ€™re still working.
