    此外，我专门为那些具有面向对象编程（OOP）背景的人编写了这本书。我教了多年 `Java` 和 `OOP` 课程，并且仍然为 iPhone 和 Android
    应用编写大部分 OOP 代码的代码（分别使用 `Flutter/Dart` 和 `Kotlin`），因此我非常熟悉 `OOP`，以及 `OOP` 开发者学习
    FP 需要了解的知识。


    在接触过 `Java`、`Kotlin`、`Swift`、`Python`、`C++`、`Dart` 和 `Ruby` 后，我相信这本书对于使用这些语言并对学习
    FP 感的开发者非常有帮助。


    我在 250 页以内实现了这一目标，重点关注如何利用上述五个主要概念编写几个小型应用程序，并在编写过程中不断解释这些概念。


    > 这是一本特意编写的、关于 FP 的小书，希望读起来易轻松。如果你更倾向于读一本关于 FP 的大而详尽的书，我写过畅销且高评价的[简化函数式编程](https://alvinalexander.com/scala/functional-programming-simplified-book)，它超过
    720 页。虽然它长得多，但那本书的优点在于它通过 100 多个短小课程涵盖了大量的背景信息和细节。（明确一下，那本书的*纸质版*有 720 多页，但 PDF
    和 Kindle 电子版超过 1000 页。）


    # 2. 关于我


    对于那些不认识我的人，我叫 Alvin Alexander，以下我的 `Java`、`OOP`、`Kotlin`、`Scala` 和 `FP` 背景：


    *   过去，我向 `GE`、`UPS`、`Papa Johns` 等许多客户教授过 `C`、`Java` 和 `OOP` 课程

    *   我创立了一家小型软件咨询公司并发展到 20 名员工，我们主要为客户编写 `Java/OOP` 代码

    *   我写过两个版本的[Scala 食谱](https://amzn.to/3du1pMR)，最近的是 2021 年 9 月发布的第 2 版（每本 700
    多页）

    *   我写过畅销且高评价的书籍[简化函数式编程](https://alvinalexander.com/scala/functional-programming-simplified-book)（同样
    700 多页）

    *   我写过一本名为《Hello, Scala》的书，它成为了 Scala 官方网站“Scala 之书”的基础

    *   随后，我为 Scala 官方网站合写了[Scala 3 教程](https://docs.scala-lang.org/scala3/book/introduction.html)

    *   2022 年，我发布了一本名为[快速学习 Scala 3!](https://amzn.to/3L4YwR4) 的书

    *   我用 `Java` 和 `Kotlin` 写过 Android 应用，并用 `Flutter` 和 `Dart` 写过跨平台的 iOS/Android
    应用

    *   我的关于编程的网站 [alvinalexander.com](https://alvinalexander.com) 每年接收数百万页面访问


    我提到其中一些书的页数是因为对我来说，这是一本短书。我特意让它尽可能简洁，同时用简单、口语化的风格来编写，就像我正坐在你身边工作，或者在教室里指导你一样。


    # 3. 欢迎！


    欢迎！对我来说，这是一本非常不同的书。我的*最初计划*是创建一个小册子，标题将定为《用类型思考》或《用纯函数解决问题》。这个想法是展示你如何使用这些编程技术写出非常稳健、易读且易于维护的代码：


    *   纯函数

    *   不可变变量（*代数*变量）

    *   不可变数据类型（如 `String` 和 `List`）

    *   表达式导向编程 (EOP)

    *   函数式错误处理


    但当我开始编写大纲和示例时，我意识到这些代码与编写纯*函数式编程*（FP）代码是多么接近。从那时起，我从写小册转变为尝试写一本尽可能小的书，将 `OOP`
    开发者带到使用 `Scala` FP 库的边缘。


    所以，尽管这是一本很小的书，但我希望通过带你走到 FP 道路的很远，能提供巨大的价值。我的希望当你读完这本书后，可以直接去查看 `ZIO` 和 `Cats
    Effect` 的文档并想：“噢，我知道他们在做什么，以及为什么要这么做。”


    ## 这本书是给谁的


    我为 `OOP` 开发者写了这本书，但它实际上适用于任何以下情况的人：


    *   对上述列出的编程概念感兴趣

    *   刚开始接触这些概念

    *   已经接触了一点 FP 但发现它极其混乱、令人困惑

    *   其他方面对改进代码感兴趣


    请注意，书中的代码示例是使用 *Scala 3* 编写的，但我没有使用任何“Scala 魔法技巧”。正如你很快会看到的，代码是用简单的风格编写的。


    ## 我假设你了解


    出于这本书的目的，我假设你了解一点 `Scala`，但从实际来说，`Scala` 的基础非常直观，我认为如果你熟悉 `Java`、`Kotlin`、`Python`、`Swift`、`Dart`、`C++`
    或其他语言，你会做得很好。正如我提到的，我没有在书使用任何花哨的 `Scala` 技术。

