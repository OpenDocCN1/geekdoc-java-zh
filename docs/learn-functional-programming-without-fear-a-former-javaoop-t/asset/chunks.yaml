  raw: 'Furthermore, Iâ€™ve written the book especially for people with a background
    in object-oriented programming (OOP). I taught Java and OOP courses for many years,
    and still write mostly-OOP code for iPhone and Android apps (using Flutter/Dart
    and Kotlin, respectively), so Iâ€™m very familiar with OOP, and what OOP developers
    need to know to learn FP.


    Having worked with Java, Kotlin, Swift, Python, C++, Dart, and Ruby, I believe
    this book will be helpful to developers who use those languages, and are interested
    in learning FP.


    I accomplish this goal in under 250 pages by focusing on how to write a few small
    applications with the five main concepts just mentioned, explaining those concepts
    as we go along.


    > This is intentionally a small, hopefully easy-to-read book about FP. If youâ€™d
    rather read a large, detailed book on FP, I wrote the best-selling and highly-rated
    [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book),
    which is over 720 pages long. While itâ€™s much longer, the benefit of that book
    is that it *does* cover a lot of background information and fine details, in the
    form of over 100 short lessons. (To be clear, the *Print* version of that book
    is 720+ pages long, but the PDF and Kindle electronic versions are over 1,000
    pages long.)


    # 2\. About Me


    For those who donâ€™t know me, my name is Alvin Alexander, and this is my Java,
    OOP, Kotlin, Scala, and FP background:


    *   Back in the day I taught C, Java, and OOP courses to clients like GE, UPS,
    Papa Johns, and many others


    *   I founded a little software consulting firm that we grew to 20 employees,
    and we primarily wrote Java/OOP code for our clients


    *   I wrote two editions of the [Scala Cookbook](https://amzn.to/3du1pMR), most
    recently the 2nd Edition, which was released in September, 2021 (700+ pages each)


    *   I wrote the best-selling and highly-rated book, [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book)
    (also 700+ pages)


    *   I wrote a book named â€œHello, Scala,â€ which became the basis for the â€œScala
    Bookâ€ on the official Scala website


    *   I then co-wrote the [Scala 3 Book](https://docs.scala-lang.org/scala3/book/introduction.html)
    for the official Scala website


    *   In 2022 I released a book named [Learn Scala 3 The Fast Way!](https://amzn.to/3L4YwR4)


    *   Iâ€™ve written Android apps with Java and Kotlin, and cross-platform iOS/Android
    apps with Flutter and Dart


    *   My website about programming, [alvinalexander.com](https://alvinalexander.com),
    receives millions of page-views every year


    I mention the page counts for some of those books because for me, this is a short
    book. I intentionally made it as concise as possible, while also writing it in
    a simple, conversational style, as if I was working right next to you, or mentoring
    you in a classroom.


    # 3\. Welcome!


    Welcome! This is a really different book for me. My *initial plan* was to create
    a small booklet that I was going to title â€œThinking with Typesâ€ or â€œSolving
    Problems with Pure Functions.â€ The idea was to show how you can write really
    solid, readable, maintable code using these programming techniques:


    *   Pure functions


    *   Immutable variables (*algebraic* variables)


    *   Immutable data types (such as `String` and `List`)


    *   Expression-oriented programming (EOP)


    *   Functional error-handling


    But then as I started working on the outline and examples, I realized how close
    this code is to writing pure *functional programming* (FP) code. At that point
    I switched from writing a booklet to trying to write the smallest possible book
    I can that takes OOP developers to the precipice of using Scalaâ€™s FP libraries.


    So even though this is a relatively small book, I hope it delivers a tremendous
    amount of value by taking you so far down the road to FP. My hope is that when
    you finish this book, youâ€™ll be able to go right to the ZIO and Cats Effect
    documentation and think, â€œOh, I know *what* theyâ€™re doing, and *why* theyâ€™re
    doing it.â€


    ## Who this book is for


    I wrote this book for OOP developers, but itâ€™s really for anyone who:


    *   Is interested in the programming concepts listed above


    *   Is just starting to work with those concepts


    *   Has gotten into FP a little, and finds it hopelessly confusing


    *   Is otherwise interested in improving their code


    Note that the code examples in this book are written using *Scala 3*, but I donâ€™t
    use any â€œScala magic tricks.â€ The code is written in a simple style, as youâ€™ll
    soon see.


    ## What I assume you know


    For the purposes of this book I assume that you know a little bit about Scala,
    but as a practical matter, the basics of Scala are very straightforward, and I
    think youâ€™ll do pretty well if you know another language like Java, Kotlin,
    Python, Swift, Dart, C++, or other languages. As I mentioned, I donâ€™t use any
    fancy Scala techniques in this book.


    If you donâ€™t know the basics of Scala:


    *   This book includes a *Scala 3 cheat sheet* in the Appendix.


    *   My book, [Learn Scala 3 The Fast Way! (Book 1: The Adventure Begins)](https://amzn.to/3L4YwR4),
    gets you up and running fast.


    *   I wrote most of the [Scala 3 Book](https://docs.scala-lang.org/scala3/book/introduction.html)
    on the official Scala website, and hopefully itâ€™s a terrific, free resource.


    I also wrote the initial versions of these free resources on the official Scala
    website:


    *   [Scala for Java Developers](https://docs.scala-lang.org/scala3/book/scala-for-java-devs.html)


    *   [Scala for Python Developers](https://docs.scala-lang.org/scala3/book/scala-for-python-devs.html)


    *   [Scala for JavaScript Developers](https://docs.scala-lang.org/scala3/book/scala-for-javascript-devs.html)


    ## A word of caution


    One thing Iâ€™ve learned about FP is that when you write *small applications*,
    the techniques can seem like overkill, and you might be tempted to dismiss it.


    BUT, when you write *large applications* on teams with other developers, youâ€™ll
    be extremely grateful for those same techniques.


    ## A few terms


    Before we get into the book, here are a few technical terms that Iâ€™ll use from
    time to time:


    *   I often refer to *pure functions*, and thereâ€™s a chapter on those.


    *   I use the term *Expression-Oriented Programming*, or EOP. This just means
    that weâ€™ll be programming with *expressions* rather than *statements*. Thereâ€™s
    also a chapter on EOP.


    *   *Immutable variables* sounds like an oxymoron, but this just means â€œvariables
    in the algebraic sense.â€ Thereâ€™s a chapter on these.


    *   *Java/OOP* refers to programming in an OOP style with Java.


    *   *Scala/OOP* refers to programming in an OOP style with Scala.


    *   *Scala/EOP* refers to programming in an EOP style with Scala.


    *   *Scala/FP* refers to programming in an FP style with Scala.


    ## Source code and bug reports


    If you find any bugs/issues in this book, please report them as an issue at this
    bookâ€™s Github repository:


    *   [github.com/alvinj/LearnFunctionalProgrammingBook](https://github.com/alvinj/LearnFunctionalProgrammingBook)


    Youâ€™ll find the bookâ€™s source code examples in that repository as well.


    All reports are welcome!


    # 4\. Contents and Outline


    Here are a few notes about this bookâ€™s table of contents and its outline.


    ## Table of contents


    First, I want to mention that a bookâ€™s *table of contents* is important to me.
    When Iâ€™m reading a tech book, thatâ€™s often where I look to find things quickly,
    and as a result I use some naming standards for the chapters in this book:


    *   **JIT**: A chapter that starts with *JIT* means that this is a â€œjust in
    timeâ€ chapter. That means Iâ€™m introducing a tidbit of knowledge that is important
    for your understanding of a chapter that follows.


    *   **FEH**: I also use the unusual (non-standard) acronym *FEH* to refer to the
    term, â€œfunctional error-handling.â€'
