  trans: "\nScala 允许你像这样创建更具意义的类型名称，在这种情况下，任何现在看到这段代码的人都能立刻读出这是一个按值排序的 `Map`。这非常酷。\n\
    \n而且，你还可以更进一步，让该函数的签名看起来像像这样：\n\n`MapSortedByValueDesc[Word, Count]`\n\n哇，这简直酷极了。有了这些新名称，任何路人走过时都能准确地看出这个\
    \ `Map` 发生了什么。而这一切都可以用 Scala 实现。\n\n正如我在[Scala 烹食指南（第 2 版）](https://amzn.to/3du1pMR)中讨论的那样，这种命名过程用于领域驱动设计（Domain-Driven\
    \ Design），它让你的类型更具意义。\n\n这也引出了一个有趣的问题：如果你进入别人的代码库，对于这个特定问题，你更愿意看到以下哪种选项，为什么：\n\
    \n*   `Map[String, Int]`\n*   `VectorMap[String, Int]`\n*   `MapSortedByValueDesc[String,\
    \ Int]`\n*   `MapSortedByValueDesc[Word, Count]`\n\n答案完全取决于你，但是，我鼓励你对此形成自己的观点。你也可以把它展示给同事开发者看，问问他们更愿意看到哪种，以及为什么。\n\
    \n## 全部完成！\n\n到此为止，我们已经完成了。嗯，至少我们完成了解决此问题所需的纯函数的草拟。我们现在要做的就是为这些函数的体编写算法。\n\n到目前为止，是思考函数签名的时间。现在是思考如何实现这些算法了。\n\
    \n我会说把这部分留给“读者的练习”，但你可以在这本书的 Github 仓库中找到这些函数的实现。\n\n# 14. 还有件事：代数代换\n\n在我们继续这个单词计数计数示例之前，我需要添加一个非常重要的点：由于我编写\
    \ `wc` 时只使用了纯函数和不可变值，你和编译器都可以自由地简化这段代码。\n\n这意味着在上一节结束时，我有这样一个函数：\n\n```scala\n\
    def wc(document: String): VectorMap[String, Int] =\n    val stringWithoutNewlines\
    \ =\n        replaceNewlinesWithBlanks(document)\n    val stringWithoutFormatting\
    \ =\n        stripFormattingCharacters(stringWithoutNewlines)\n    val stringWithSingleBlanks\
    \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords\
    \ =\n        convertStringToListOfWords(stringWithSingleBlanks)\n    val lcListOfWords\
    \ =\n        lowerCaseAllWords(listOfWords)\n    val initialMap =\n        convertWordListToWordCount(lcListOfWords)\n\
    \    val sortedMap =\n        sortMapByHighestValue(initialMap)\n    sortedMap\n\
    ```\n\n但由于 `initialMap`（在函数末尾）完全等于 `convertWordListToWordCount(lcListOfWords)`\
    \ —— 并且永远如此，因为值是不可变的且函数是纯的 —— 你可以将倒数第二行的 `initialMap` 替换为等等的函数调用，如下：\n\n```scala\n\
    def wc(document: String): VectorMap[String, Int] =\n    val stringWithoutNewlines\
    \ =\n        replaceNewlinesWithBlanks(document)\n    val stringWithoutFormatting\
    \ =\n        stripFormattingCharacters(stringWithoutNewlines)\n    val stringWithSingleBlanks\
    \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords\
    \ =\n        convertStringToListOfWords(stringWithSingleBlanks)\n    val lcListOfWords\
    \ =\n        lowerCaseAllWords(listOfWords)\n    // ELIMINATED 'initialMap'\n\
    \    val sortedMap =\n        sortMapByHighestValue(convertWordListToWordCount(lcListOfWords))\n\
    \    sortedMap\n```\n\n同样的理由，`lcListOfWords` 完全等于：\n\n`lowerCaseAllWords(listOfWords)`\
    \ 所以我可以消除这个中间变量：\n\n```scala\ndef wc(document: String): VectorMap[String, Int]\
    \ =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
    \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
    \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
    \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
    \    // ELIMINATED 'lcListOfWords'\n    val sortedMap =\n        sortMapByHighestValue(\n\
    \            convertWordListToWordCount(lowerCaseAllWords(listOfWords))\n    \
    \    )\n    sortedMap\n```\n\n接下来，`listOfWords` 完全等于 `convertStringToListOfWords(stringWithSingleBlanks)`\
    \ 并且永远如此，所以我可以移除 `listOfWords` 作为中间变量：\n\n```scala\ndef wc(document: String):\
    \ VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
    \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
    \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
    \    // ELIMINATED 'listOfWords'\n    val sortedMap =\n        sortMapByHighestValue(\n\
    \            convertWordListToWordCount(\n                lowerCaseAllWords(\n\
    \                    convertStringToListOfWords(stringWithSingleBlanks)\n    \
    \            )\n            )\n        )\n    sortedMap\n```\n\n同样的情况适用于 `stringWithBlanks`，它是\
    \ `squeezeBlankSpaces(stringWithoutFormatting)` 所以再次简化代码：\n\n```scala\ndef wc(document:\
    \ String): VectorMap[String, Int] =\n    val stringWithoutNewlines =\n       \
    \ replaceNewlinesWithBlanks(document)\n    val stringWithoutFormatting =\n   \
    \     stripFormattingCharacters(stringWithoutNewlines)\n    // ELIMINATED 'stringWithBlanks'\n\
    \    val sortedMap =\n        sortMapByHighestValue(\n            convertWordListToWordCount(\n\
    \                lowerCaseAllWords(\n                    convertStringToListOfWords(\n\
    \                        squeezeBlankSpaces(stringWithoutFormatting)\n       \
    \             )\n                )\n            )\n        )\n    sortedMap\n\
    ```\n\n然后对 `stringWithoutFormatting` 执行同样的操作：\n\n```scala\ndef wc(document: String):\
    \ VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
    \    // ELIMINATED 'stringWithoutFormatting'\n    val sortedMap =\n        sortMapByHighestValue(\n\
    \            convertWordListToWordCount(\n                lowerCaseAllWords(\n\
    \                    convertStringToListOfWords(\n                        squeezeBlankSpaces(\n\
    \                            stripFormattingCharacters(stringWithoutNewlines)\n\
    \                        )\n                    )\n                )\n       \
    \     )\n        )\n    sortedMap\n```\n\n对于 `stringWithoutNewlines`：\n\n```scala\n\
    def wc(document: String): VectorMap[String, Int] =\n    // ELIMINATED 'stringWithoutNewlines'\n\
    \    val sortedMap =\n        sortMapByHighestValue(\n            convertWordListToWordCount(\n\
    \                lowerCaseAllWords(\n                    convertStringToListOfWords(\n\
    \                        squeezeBlankSpaces(\n                            stripFormattingCharacters(\n\
    \                                replaceNewlinesWithBlanks(document)\n       \
    \                     )\n                        )\n                    )\n  \
    \              )\n            )\n        )\n    sortedMap\n```\n\n如果你愿意，你还可以消除\
    \ `sortedMap`：\n\n```scala\ndef wc(document: String): VectorMap[String, Int] =\n\
    \    // ELIMINATED 'sortedMap'\n    sortMapByHighestValue(\n        convertWordListToWordCount(\n\
    \            lowerCaseAllWords(\n                convertStringToListOfWords(\n\
    \                    squeezeBlankSpaces(\n                        stripFormattingCharacters(\n\
    \                             replaceNewlinesWithBlanks(document)\n          \
    \                  )\n                        )\n                    )\n     \
    \           )\n            )\n        )\n    )\n```\n"
- fmt: "\nWe call this process *algebraic substitution*, and it works because:\n\n\
    *   The functions are pure\n*   The variables are immutable\n*   The data structures\
    \ are immutable\n\nWhen code is written like this, both you and the compiler are\
    \ perfectly free to write it in any of these ways, and you’re always guaranteed\
    \ to get the same result.\n\n> KEY: But if you use mutable variables, mutable\
    \ data types, and impure methods, the same cannot be said.\n\n## Technical goo:\
    \ \"Referential Transparency\"\n\nIf you like algebra, you’ll like referential\
    \ transparency. We say that an expression is *referentially transparent* (RT)\
    \ if it can be replaced by its resulting value without changing the behavior of\
    \ the program. This must be true regardless of where the expression is used in\
    \ the program. So this is basically a way of saying, \"Algebraic substitution\
    \ can be done here.\"\n\nWhat I did in the previous example is actually the opposite\
    \ of that — I replaced the intermediate variables with their expressions — but\
    \ that’s the cool part: all of those intermediate variables and their pure function\
    \ calls are 100% equivalent.\n\nFinally, notice that I’m not doing any \"fancy\
    \ FP\" stuff in this code. I’m just writing EOP code with immutable variables,\
    \ immutable data types, and pure functions.\n\n# 15. A Quick Look at Parallel\
    \ Programming\n\nA first reason that algebraic substitution is important is because,\
    \ as I mentioned, code written like this is easier to write, read, and test. That’s\
    \ a simple sentence to write, but in practice, this is an enormous gain that makes\
    \ your life simpler. (I could write several chapters about this alone.)\n\nA second\
    \ reason it’s important is because you can use algebraic substitution to write\
    \ your code in any of the ways I just showed. The second approach I showed, where\
    \ your code looks like this:\n\n```\ndoE(\n  doD(\n    doC(\n      doB(\n    \
    \    doA(someData)\n      )\n    )\n  )\n)\n```\n\ncan also be formatted to look\
    \ like this:\n\n```\ndoE(doD(doC(doB(doA(someData)))))\n```\n\nWith either approach,\
    \ this is interesting because it’s like writing Lisp code, and you read it from\
    \ the inside-out. (In small doses I like this style.)\n\nBut there’s an even more\
    \ important point about EOP and algebraic substitution:\n\n> When your expressions\
    \ (equations) don’t have to be evaluated in a specific order, the compiler is\
    \ completely free to evaluate them in parallel, and then join them into one result\
    \ some time later. I only worked with Haskell for a few weeks, but I’ve read that\
    \ this is how the Haskell compiler works, and it can do that because Haskell code\
    \ is guaranteed to be FP code.\n\n## Enabling parallel programming\n\nTo demonstrate\
    \ what I mean, here’s an example, where again you can assume that all functions\
    \ are pure, and the variables and data types are immutable:\n\n```\nval a = f1(x)\n\
    val b = f2(y)\nval c = f3(z)\nval d = f(a, b, c)\n```\n\nBecause the first three\
    \ expressions have no dependencies on each other, a smart compiler is perfectly\
    \ free to run those functions on different threads (or, more recently, *fibers*).\
    \ So if they each take 20 seconds to run, you don’t have to wait 60 seconds for\
    \ them to run in serial; they can be run in parallel, and you get the final result\
    \ in 20 seconds.\n\nVisually, that means that rather than having this slow serial\
    \ code:\n\n```\n// code runs in serial, 20 seconds each, 60 seconds total\nval\
    \ a = f1(x)                                            \n<<<<<<<             \
    \                                     \n  >>> val b = f2(y)                  \
    \                   \n<<<<<<<                                                \
    \  \n      >>> val c = f3(z)                                 \n<<<<<<<       \
    \                                           \n        >>> val d = f(a, b, c)\n\
    ```\n\nyou can have this high-performance code that runs in parallel:\n\n```\n\
    // code runs in parallel, 20 seconds total\nval a = f1(x)                    \
    \        \n<<<<<<<                                                  \nval b =\
    \ f2(y)                            \n<<<<<<<                                 \
    \                 \nval c = f3(z)                            \n<<<<<<<       \
    \                                           \nval d = f(a, b, c)             \
    \          \n``` \n\nWhen you want high-performance code — and who doesn’t — this\
    \ is a huge win. And all you have to do to achieve these gains are to use:\n\n\
    *   Immutable variables\n*   Immutable data structures\n*   Pure functions\n*\
    \   Expressions (and not statements)\n\n## This doesn’t work with mutable things\n\
    \nIt’s important to be clear that a compiler can’t do this for you when you use\
    \ mutable variables, mutable data structures, and impure functions.\n\nPerhaps\
    \ the simplest way to demonstrate this is to imagine that you have these three\
    \ lines of code that consist of two statements and a function with a side effect:\n\
    \n```\nprintln(\"What’s your name?\")               // statement\nval name = readLine()\
    \                      // side effect\nprintln(s\"You said your name\")\n```\n\
    \nAs another example, assume that you have three functions `g1`, `g2`, and `g3`,\
    \ and they each modify shared state. If `g1` writes a variable that `g2` reads,\
    \ and `g2` writes a variable that `g3` reads, those operations really need to\
    \ happen in that order.\n\nBut if `g1`, `g2`, and `g3` are run in parallel — well,\
    \ there’s no guarantee about the order in which things will happen. We say the\
    \ result you get from this situation is *indeterminate*.\n\nOne time I was working\
    \ with a client, and they had a problem where they’d occasionally have inconsistent\
    \ customer data. They might have a user’s name and street address correct, but\
    \ somehow the city, state, or zip code wouldn’t match up with the name and street\
    \ address.\n\nThis can’t happen with immutable variables, immutable data structures,\
    \ and pure functions.\n\n## Reasoning about code\n\nYou’ll sometimes hear FPers\
    \ say that they like to \"reason about their code.\" Of course we do that in OOP\
    \ as well, but when FPers say this, it means that we’re looking at lines of code\
    \ like algebra, and we’re making sure they can be joined the way we want them\
    \ to.\n\nIf they can be run in parallel, cool, that’s awesome. But if they can’t,\
    \ you’ll see that we *ensure* that they’re run in serial, typically with a `for`\
    \ expression:\n\n```\nval result =\n  for\n    a <- g1(x)\n    b <- g2(y)\n  \
    \  c <- g3(z)\n    yield\n      // some use of a, b, and c here\n      g4(a, b,\
    \ c)\n```\n\nThat’s a bit of a contrived example, but I demonstrate real uses\
    \ of this technique later in this book.\n\n# 16. Recap: Java/OOP vs Pure Functions\n\
    \nWhen I began this section of the book, I showed that these were the two most\
    \ complicated type declarations I found in over 150,000 lines of production Java\
    \ code:\n\n```java\nSortedMap<String, Integer> wordCountMap = new TreeMap();\n\
    public Class<?> getColumnClass(int columnIndex) {\n```\n"
