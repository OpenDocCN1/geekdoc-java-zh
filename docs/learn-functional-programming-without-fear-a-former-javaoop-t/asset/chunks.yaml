    \ 相关的函数，我更倾向于使用它而不是 `Option`，因为我们在需要时可以看到异常——我将首先将这个新的顶层函数重名为 `wcFromFile`：\n\n\
    ```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]]\n```\n\
    \n正如你可以想象的，你在这个函数内部做的第一件事就是调用一个读取文件的函数。到目前为止我知道我会给该函数传递文件名，它是一个 `String`：\n\n\
    ```scala\ndef readFile(filename: String)\n```\n\n你还知道另外两点：\n\n*   我刚刚提到我倾向于在 I/O\
    \ 函数中使用 `Try`，所以这个函数应该返回 `Try`\n*   该函数需要返回它从该文件名读取的文档，而该文档是一个 `String`\n\n这两点使我们能够完成函数的类型签名：\n\
    \n```scala\ndef readFile(filename: String): Try[String]\n```\n\n现在我们已经知道了 `readFile`\
    \ 的样子，我们将它作为第一行添加到我们新的 `wcFromFile` 函数中：\n\n```scala\ndef wcFromFile(filename:\
    \ String): Try[VectorMap[String, Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n\
    \  ...\n```\n\n### 冗长的解决方案\n\n现在 `maybeDocument` 要么包含 (a) 文档的 `String` 版本，要么包含\
    \ (b) 一个异常。处理 `maybeDocument` 的冗长方法是我之前在 `makeInt` 错误处理课程中使用的方法，使用 `match` 表达式：\n\
    \n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n\
    \  val maybeDocument: Try[String] = readFile(filename)\n  maybeDocument match\n\
    \    case Success(docAsString) => Success(wc(docAsString))   // [1]\n    case\
    \ Failure(e)           => Failure(e)                // [2]\n```\n\n正如注释 1 所示，在\
    \ `Success` case，我将文档 (`docAsString`) 传递给旧的 `wc` 函数。如果你回头看那个函数，你会发现它的类型签名是 `VectorMap[String,\
    \ Int]`。正如你现在所知，这意味着 `wc` 不可能失败。因为 `wcFromFile` 需要返回一个 `Try` 类型，我将这个 map 封装在 `Success`\
    \ 类型中。\n\n然后在 `Failure` case 中（注释 2），我返回一个新的 `Failure` 实例，其中包含尝试读取文件时发生的异常。\n\n\
    虽然这个解决方案有效，但它的问题在于我是从 `readFile` 获取了一个 `Try`，然后我将其解包为 `Success` 或 `Failure`，然后在\
    \ `match` 表达式中将其重新封装回这些类型。我可以做得更好。\n\n### 更简洁的解决方案\n\n更简洁的解决方案是使用 `Success` 和\
    \ `Failure` 类型可用的 `map` 方法。`map` 的工作方式是，如果它作用于：\n\n*   `Failure`，它返回异常\n*   `Success`，`map`\
    \ 允许你以任何想要的方式对成功值进行操作\n\n所以，函数体的第一步仍然保持不变：\n\n```scala\ndef wcFromFile(filename:\
    \ String): Try[VectorMap[String, Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n\
    \  ...\n```\n\n之后，我用在 `maybeDocument`（这是一个 `Try`）上的 `map` 方法调用替换 `match` 表达式。在\
    \ `map` 内部，我将文档传递给 `wc` 函数：\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
    \ Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n  maybeDocument.map(doc\
    \ => wc(doc))\n```\n\n该表达式的结果类型为 `Try[VectorMap[String, Int]]`，这与我们函数的返回类型匹配。\n\
    \n如果你倾向不使用中间变量，可以更简洁地编写此解决方案，如下：\n\n```scala\ndef wcFromFile(filename: String):\
    \ Try[VectorMap[String, Int]] =\n  readFile(filename).map(doc => wc(doc))\n```\n\
    \n或者这个，使用 Scala 匿名函数中的下划线快捷：\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
    \ Int]] =\n  readFile(filename).map(wc(_))\n```\n\n无论你喜欢哪种方法，这里的关键是 `Success`\
    \ 和 `Failure` 都实现了 `map` 方法。\n\n同样，如果我们只关注 `Try` 解决方案——对于 I/O 相关的函数，我更倾向于使用它而不是\
    \ `Option`，因为我们在需要时可以看到异常——我将首先将这个新的顶层函数重名为 `wcFromFile`：\n\n```scala\ndef wcFromFile(filename:\
    \ String): Try[VectorMap[String, Int]]\n```\n\n正如你可以想象的，你在这个函数内部做的第一件事就是调用一个读取文件的函数。到目前为止我知道我会给该函数传递文件名，它是一个\
    \ `String`：\n\n```scala\ndef readFile(filename: String)\n```\n\n你还知道另外两点：\n\n\
    *   我刚刚提到我倾向于在 I/O 函数中使用 `Try`，所以这个函数应该返回 `Try`\n*   该函数需要返回它从该文件名读取的文档，而该文档是一个\
    \ `String`\n\n这两点使我们能够完成函数的类型签名：\n\n```scala\ndef readFile(filename: String):\
    \ Try[String]\n```\n\n现在我们已经知道了 `readFile` 的样子，我们将它作为第一行添加到我们新的 `wcFromFile` 函数中：\n\
    \n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n\
    \  val maybeDocument: Try[String] = readFile(filename)\n  ...\n```\n\n### Either\
    \ 解决方案\n\n由于 `Either` 也是 I/O 函数的一个很好的解决方案，让我们看看它是如何工作的。首先，它的签名如下：\n\n```scala\n\
    def readFile(filename: String): Either[Throwable, String]\n```\n\n接下来，它的顶层函数如下：\n\
    \n```scala\ndef wcFromFile(filename: String): Either[VectorMap[String, Int]]\n\
    ```\n\n最后，它的体如下：\n\n```scala\ndef wcFromFile(filename: String): Either[VectorMap[String,\
    \ Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n  maybeDocument.map(doc\
    \ => wc(doc))\n```\n\n### 最后一点点\n\n我之前展示过这个，所以我简单提一下：\n\n```scala\ndef wcFromFile(filename:\
    \ String): Try[VectorMap[String, Int]]\n```\n\n```scala\ndef readFile(filename:\
    \ String): Try[String]\n```\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
    \ Int]]\n```\n\n```scala\ndef wcFromFile(filename: String): Either[VectorMap[String,\
    \ Int]]\n```\n"
- fmt: "\nGiven that background, this is what a small interaction with TDL looks like,\
    \ where I add two tasks with the `a` command and then delete the first one with\
    \ the `d` command:\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo: a wake up`\n\
    \n`1. wake up`\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo: a brush teeth`\n\
    \n`1. wake up`\n`2. brush teeth`\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n\
    `Yo: a make coffee`\n\n`1. wake up`\n`2. brush teeth`\n\n`(Commands: a \"task\"\
    , d 1, v, q, h)`\n\n`Yo: d 1`\n\n`1. brush teeth`\n\nSo that’s how the app works.\n\
    \n## Rules for writing the app\n\nTo write the TDL app, I’ll use the same rules\
    \ I followed so far in this book. It will use:\n\n* Immutable variables\n* Immutable\
    \ data structures\n* Pure functions\n* Expression-oriented programming\n* Functional\
    \ error-handling\n\nI’ll also add this rule:\n\n* Any function that interacts\
    \ with the outside world must return a `Try` value\n\nI used this technique when\
    \ reading the document from the file in the Word Count example, but now this is\
    \ a hard rule.\n\n## A flat-file database\n\nI initially started to create this\
    \ app using a SQL database and a Scala database library. However, once I dug into\
    \ Scala database libraries, I saw that they almost all jump right into FP concepts.\
    \ And because we’re still building our way up to those concepts, I decided not\
    \ to use that approach.\n\nInstead, this application will use a “flat-file database.”\
    \ This isn’t a real database, it’s just a file. For the TDL app it will contain\
    \ a list of “To Do” items on separate lines, like this:\n\n```\nWake up\nMake\
    \ the coffee\nBrush my teeth\nTake a shower\n```\n\nHowever, if you’re ever interested\
    \ in more advanced uses of a flat-file database, a common approach is to separate\
    \ fields in the file with a field delimiter, such as a symbol. When you do that,\
    \ your rows will look like this:\n\n```\n|Alvin|Alexander|Talkeetna\n|Fred|Flintstone|Bedrock\n\
    |Mary|Bailey|Bedford Falls\n```\n\nSo we’ll write this database code in the following\
    \ chapters, and the benefit of this is that you’ll use `Try` at the boundaries\
    \ of an application to communicate with the outside world, and how that works\
    \ with the rest of your code.\n\n# 26 TDL: The Database Class\n\nWhen I think\
    \ about how TDL’s `main` method starts, I think that one of the first things it\
    \ needs to do is create an instance of a `Database` class:\n\n```\n@main\ndef\
    \ ToDoList =\n    val db = Database(\"./ToDoList.dat\")\n    ...\n```\n\nIn that\
    \ code I pass `Database` the name of the file it should use as its flat-file database.\
    \ Right away, this tells me that I need a `Database` class that takes a filename\
    \ input parameter:\n\n```scala\nclass Database(val dbFilename: String):\n    //\
    \ methods go here ...\nend Database\n```\n\nAs you’ll see in the following lessons,\
    \ we’ll then define these functions inside that class, to mimic the way SQL functions\
    \ typically work:\n\n* `insert`\n* `delete`\n* `selectAll`\n\n> NOTE: Writing\
    \ this code is the same as writing OOP code, where you have a class that takes\
    \ a constructor parameter (`dbFilename`), and then the methods in that class use\
    \ that parameter. The only difference is that I won’t mutate that parameter, so,\
    \ as shown, I define it as a `val` parameter.\n\n## About the ‘Try’ rule\n\nRecall\
    \ my rule that any function that reaches out to the outside world must return\
    \ the `Try` error-handling type. This is overkill for a flat-file database, but\
    \ it helps if you recall that real database code typically accesses another server\
    \ (or cluster) that may or may not be running when you call it. This is also just\
    \ like calling a REST API that may or may not be running, across a network that\
    \ may or not be available.\n\nIn these situations, robust code must return an\
    \ error-handling type like `Try` or `Either`, and for our purposes, I’ll use `Try`.\n\
    \n## How this affects Database\n\nGiven this rule, I sketch the `Database` class\
    \ to have methods with these type signatures:\n\n```scala\nclass Database(dbFilename:\
    \ String):\n    def insert(record: String): Try[Unit] = ???\n    def selectAll():\
    \ Try[Seq[String]] = ???\n    def delete(indexToDelete: Int): Try[Int] = ???\n\
    end Database\n```\n\nI’ll explain that code in the following chapters, but briefly:\n\
    \n* `insert` returns `Try[Unit]`, and its `Success` and `Failure` results tell\
    \ us if it worked\n* `selectAll` returns `Try[Seq[String]]`, which is a list of\
    \ strings inside a `Try`.\n* `delete` returns `Try[Int]`, and its `Int` value\
    \ indicates the number of deleted.\n\nIn all cases, if the server is down, we\
    \ get back `Failure`. If the server is up, we get back `Success`.\n\n## Methods\
    \ vs functions\n\nAs a final note:\n\n* When you define inside a class, I refer\
    \ to methods.\n* Anywhere else, I refer to functions.\n\n# 27 TDL: The Database\
    \ Class\n\nAs a quick reminder, in the following lessons we’ll create a looks\
    \ like this:\n\n```scala\nclass Database(dbFilename: String):\n    def insert\
    \ = ???\n    def selectAll = ???\n    def delete = ???\nend Database\n```\n\n\
    ## insert\n\nThe first `Database` function we’ll need is an `insert` function.\
    \ Because this is a flat-file database, this function will append a single record\
    \ to the database. Therefore, I know it takes a string as input, and I start to\
    \ sketch the `insert` function like this:\n\n```scala\ndef insert(record: String)\n\
    ```\n\nNext — because I’ve been through this process — I know I want this function\
    \ to use `writeToFile` to do the actual-writing. I know this because `delete`\
    \ and `update` functions I’ll write in the following lessons will require me to\
    \ read the entire file and then re-write it. So `writeToFile` will need to be\
    \ able to (a) append to a file and (b) completely overwrite it.\n\nTherefore,\
    \ let’s forget the `insert` function for a moment and first work on the `writeToFile`\
    \ function.\n\n## writeToFile\n\n`writeToFile` will be another function inside\
    \ the `Database` class, and because nobody of `Database` will need to access it,\
    \ I start by making it private:\n\n```scala\nprivate def writeToFile\n```\n\n\
    Next, because I know that `delete` and `update` will require me to completely\
    \ re-write the file, I define it to accept a list of strings, which in the most\
    \ generic sense in Scala is a `Seq[String]`:\n\n```scala\nprivate def writeToFile(lines:\
    \ Seq[String])\n```\n\nI also know that I want to set a boolean `append` flag\
    \ when calling this function. This lets me declare that I want to overwrite the\
    \ file, or append to it:\n\n```scala\nprivate def writeToFile(lines: Seq[String],\
    \ append: Boolean)\n```\n\nNow the final thing to think about is its return type.\
    \ As I mentioned in our rules, any function that communicates with the outside\
    \ world must return a `Try` value, so that gives me this:\n\n```scala\nprivate\
    \ def writeToFile(lines: Seq[String], append: Boolean): Try[\n```\n\nAnd now the\
    \ only question is, “What should the success value be inside `Try`?”\n"
