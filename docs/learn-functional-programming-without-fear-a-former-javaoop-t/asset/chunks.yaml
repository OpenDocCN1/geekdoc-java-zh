    `\n\n`    // create a method to determine the pizza cost based on its attributes:`\n\
    \n`    def cost: Double = ???`\n\n`    // create a method to determine the pizza\
    \ price based on its attributes:`\n\n`    def price: Double = ???`\n\n`end Pizza`\n\
    \nIn that example, we use `???` as the method body until weâ€™re ready to implement\
    \ it.\n\n### DM: Enums\n\nScala 3 has enums, or enumerations:\n\n`enum Suit:`\n\
    \n`    case Clubs, Diamonds, Hearts, Spades`\n\n`// some time later ...`\n\n`import\
    \ Suit.*`\n\n`def printEnum(suit: Suit) = suit match`\n\n`    case Clubs    =>\
    \ println(\"clubs\")`\n\n`    case Diamonds => println(\"diamonds\")`\n\n`    case\
    \ Hearts   => println(\"hearts\")`\n\n`    case Spades   => println(\"spades\"\
    )`\n\n### DM: Traits\n\nTraits can used like Java interfaces, and can also be\
    \ used like Ruby mixins.\n\n`trait Animal:`\n\n`    def speak(): Unit`\n\n`trait\
    \ HasTail:`\n\n`    def wagTail(): Unit`\n\n`class Dog extends Animal, HasTail:`\n\
    \n`    def speak(): Unit = println(\"Woof\")`\n\n`    def wagTail(): Unit = println(\"\
    âŽžâŽœâŽ›  âŽžâŽœâŽ›\")`\n\n`val d = Dog()`\n\n### DM: Objects\n\nObjects are\
    \ used to create singletons. Functions in objects are like `static` methods in\
    \ Java.\n\n`object StringUtils:`\n\n`    def truncate(s: String, length: Int):\
    \ String =`\n\n`        s.take(length)`\n\n`    def lettersAndNumbersOnly_?(s:\
    \ String): Boolean =`\n\n`        s.matches(\"[a-zA-Z0-9]+\")`\n\n`    def lettersOnly_?(s:\
    \ String): Boolean =`\n\n`        s.matches(\"[a-zA-Z]+\")`\n\n`    def containsWhitespace(s:\
    \ String): Boolean =`\n\n`        s.matches(\".*\\\\s.*\")`\n\n`end StringUtils`\n\
    \n### DM: Case classes\n\n*Case classes* start with the `case` keyword, and are\
    \ intended for FP:\n\n`case class Person(name: String, relation: String)`\n\n\
    `val christina = Person(\"Christina\", \"niece\")`\n\n`christina.name        \
    \    // \"Christina\"`\n\n`christina.name = \"Fred\"   // error: reassignment\
    \ to val`\n\n`val aleka = christina.copy(name = \"Aleka\")`\n\n`aleka.name    \
    \            // \"Aleka\"`\n\n`christina == aleka        // false`\n\n### DM:\
    \ Union types\n\nScala 3 has *union* types, which let your code be even more dynamic.\
    \ This function takes an `Int` *or* a `String` as an input parameter:\n\n`// Perl\
    \ version of \"true\"`\n\n`def isTrueInPerl(a: Int | String): Boolean = a match`\n\
    \n`    case 0 | \"0\" | \"\" => false`\n\n`    case _ => true`\n\nThis one returns\
    \ a union type as a function result:\n\n`def aFunction(): Int | String =`\n\n\
    `    val x = scala.util.Random.nextInt(100)`\n\n`    if (x < 50) then x else s\"\
    string: $x\"`\n\nFor more information, see [my blog post](https://alvinalexander.com/scala/scala-3-union-types-cookbook-simulate-dynamic-typing/).\n\
    \n## Collections Classes\n\nSome common collections classes:\n\n`val xs = List(1,\
    \ 2, 3)           // a simple linked-list`\n\n`val xs = Vector(1, 2, 3)      \
    \   // a high-performance, immutable sequence`\n\n`val xs = ArrayBuffer(1, 2,\
    \ 3)    // a high-performance, mutable sequence`\n\n`val states = Map(`\n\n`  \
    \  \"AK\" -> \"Alaska\",`\n\n`    \"AL\" -> \"Alabama\"`\n\n`)`\n\n`val s = Set(1,\
    \ 2, 1, 3)    // s: Set(1, 2, 3)  (duplicates are dropped)`\n\n## Collections\
    \ Methods\n\nScala sequence classes have *many* methods with functional methods\
    \ that take anonymous functions (lambdas) to solve problems. Hereâ€™s the `List`\
    \ class and some of its methods:\n\n`val a = List(10, 20, 30, 40, 10)      //\
    \ List(10, 20, 30, 40, 10)`"
