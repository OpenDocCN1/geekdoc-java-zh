    \ for this particular problem, and why:\n\n* `Map[String, Int]`\n* `VectorMap[String,\
    \ Int]`\n* `MapSortedByValueDesc[String, Int]`\n* `MapSortedByValueDesc[Word,\
    \ Count]`\n\nThe answer is entirely up to you, BUT, I encourage you to form an\
