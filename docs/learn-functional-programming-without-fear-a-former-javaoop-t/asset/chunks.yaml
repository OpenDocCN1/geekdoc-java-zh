- fmt: "\n*   `TDL`: A chapter that starts with `TDL` means that the chapter is related\
    \ to the `To-Do List` application.\n\n## Outline\n\nNext, if you want to know\
    \ what you’re about to get into in the rest of this book, read the following outline,\
    \ which is something of a map of the following territory.\n\nConversely, if you\
    \ DON’T want to know what we’re about to get into and you prefer it to be a surprise,\
    \ please skip the rest of this chapter.\n\nThe outline goes a little like this:\n\
    \n*   I start by looking at how little I used to use data types in `Java/OOP`\n\
    *   Then I look at how much I *do* use them in `Scala/OOP` and `Scala/EOP`\n\n\
    After that I show:\n\n*   Using data types isn’t a bad thing, and in fact, it’s\
    \ a very good thing\n*   The importance of immutable things (variables and data\
    \ structures)\n*   The importance of pure functions: specifically that you can\
    \ trust them, because they cannot lie\n*   That the concepts of immutable things\
    \ and pure functions naturally lead to EOP\n\nThen I show how to write a `Word\
    \ Count` application with these concepts. As we go through that application we’ll\
    \ discover a few other things.\n\nAfter that, I do a little recap of `Java/OOP`\
    \ code compared to the `Scala/EOP` code you saw in the `Word Count` example.\n\
    \nAfter this we jump into the next important topic, functional error-handling:\n\
    \n*   I explain the reasoning behind functional error-handling\n*   We look at\
    \ Scala’s three `error-handling data types`: `Option`, `Try`, and `Either`\n*\
    \   I show how to implement the `Word Count` application using `Try`\n*   Then\
    \ we build a larger `To-Do List` application, using all of these concepts\n* \
    \  This application uses a simulated database, so you see the techniques you’ll\
    \ use when accessing a remote database or `REST API`\n\nAnd at the end I show\
    \ just *how close you are* to using FP libraries like `ZIO` and `Cats Effect`.\n\
    \nAnd now, if you’re ready, let’s get started!\n\n# 5. A Look at Java/OOP Code\
    \ and Data Types\n\nBack in my `Java` programming days I rarely used generic data\
    \ types, and in fact, I rarely thought about data types much at all. To demonstrate\
    \ why, I’ll go back to one of my common examples, writing a point-of-sales application\
    \ for a pizza store.\n\nTwo points before we move on:\n\n*   A `generic` type\
    \ in `Java` and `Scala` is typically a character like `T` or `A` that’s used in\
    \ a method declaration. You use a generic type to say, “The exact type used here\
    \ will be filled in later.” For instance, a `List[A]` in `Scala` may later be\
    \ a `List[Int]`, `List[String]`, etc. I write more about generic types as this\
    \ book goes on.\n*   In these examples, please note that my `Java` code may not\
    \ be 100% correct. I haven’t put this code in an IDE or tried to compile it. Because\
    \ I assume that you know `Java` or other `OOP` languages, my intent is to just\
    \ quickly demonstrate the `Java/OOP` approach I used for many years.\n\n## Modeling\
    \ a pizza store application\n\n### Some enums\n\nTo start modeling a point-of-sales\
    \ application for a pizza store, I’ll first need my enumerations:\n\n```\nenum\
    \ Topping {\n  Cheese,\n  Pepperoni,\n  BlackOlives\n}\n```\n\n```\nenum CrustSize\
    \ {\n  Small,\n  Medium,\n  Large\n}\n```\n\n```\nenum CrustType {\n  Regular,\n\
    \  Thin,\n  Thick\n}\n```\n\n### A pizza class\n\nGiven those, let’s create a\
    \ `Pizza` class. But before doing that, let’s list the attributes and behaviors\
    \ of an OOP pizza. The attributes are basically what I listed with those enums:\n\
    \n*   Crust size\n*   Crust type\n*   Types of toppings\n\nThe behaviors correspond\
    \ to those:\n\n*   Add topping\n*   Remove topping\n*   Set crust size\n*   Set\
    \ crust type\n\nIf I also kept price-related information, a pizza could also calculate\
    \ its own price, but since the toppings and crust attributes don’t carry price\
    \ with them, that’s pretty much all of the behaviors of this `Pizza`.\n\nHaving\
    \ gone through this exercise several times, I know that I want all of the food-related\
    \ items in a pizza — breadsticks, soda, etc. — to extend a base `Product` class:\n\
    \n```\npublic interface Product {}\n```\n\nIn the real world, a `Product` will\
    \ have attributes like cost, and potentially a sales price, but for the purposes\
    \ of this exercise I’ll leave it as marker interface.\n\nGiven this `Product`\
    \ — the attributes and behaviors of my `Pizza` — the initial code for `Java/OOP`\
    \ class looks like this:\n\n```\npublic class Pizza implements Product {\n  private\
    \ List<Topping> toppings = new ArrayList<>();\n  private CrustSize crustSize;\n\
    \  private CrustType crustType;\n\n  public Pizza(CrustSize crustSize, CrustType\
    \ crustType) {\n    this.crustSize = crustSize;\n    this.crustType = crustType;\n\
    \  }\n}\n```\n\nThat `Pizza` class will then include the following series of getter\
    \ and setter methods, with these type signatures:\n\n```\npublic CrustSize getCrustSize()\n\
    public CrustType getCrustType()\npublic List<Topping> getToppings()\npublic void\
    \ setCrustSize(CrustSize crustSize)\npublic void setCrustType(CrustType crustType)\n\
    public void setToppings(List<Topping> toppings)\n```\n\n> The term *type signature*\
    \ refers to a function’s (a) input parameters and (b) return type.\n\n### Discussion\n\
    \nThe thing to notice here is that this is all simple code. The getters don’t\
    \ take any input parameters and they return basic data types, and the setters\
    \ all return `void`. I wrote `Java` code like this for more than 12 years.\n\n\
    In fact, if I wrote more code, such as for an `Order` class, you’d see that the\
    \ pattern is the same, all very simple code:\n\n```\npublic class Order {\n  private\
    \ List<Product> lineItems = new ArrayList<>();\n  public Order() {}\n  public\
    \ void addItem(Product p)\n  public void removeItem(Product p)\n  public List<Product>\
    \ getItems()\n  public String getPrintableReceipt()\n  public BigDecimal getTotalPrice()\n\
    }\n```\n\nThe closest I get to using generic types in that code are these types:\n\
    \n*   `List<Topping>`\n*   `List<Product>`\n\n# 6. Java/OOP Summary\n\nSo that\
    \ was a quick look at a little `Java/OOP` code that I used to use when teaching\
    \ `Java` courses. Of course I didn’t show much; just enough to get the basic idea\
    \ across.\n\n## Summary, Part 1\n\nTo summarize what you saw in that code:\n\n\
    *   My `Java/OOP` code was simple, with no generic types\n*   A lot of methods\
    \ return `void`\n*   A lot of methods have no input parameters\n*   I *always*\
    \ use mutable data structures\n*   *Mutable* data structures are structures like\
    \ the Java `ArrayList`, which can be resized, and whose elements can be updated.\
    \ We say that a structure like this can be *mutated*, which just means “changed.”\n\
    \n## Summary, Part 2\n\nThere are a few other things to say about that code, and\
    \ bear in mind, I’m only talking about my own code.\n\n**POINT 1:** I didn’t realize\
    \ it when I was writing `Java/OOP` code, but all of those methods that return\
    \ `void` and take no input parameters tend to warp your brain. You can’t tell\
    \ what the methods do by looking at their type signatures, so you either (a) trust\
    \ that the methods are well-named, or (b) you have to look at their source code\
    \ to see what they do.\n\nAs an example of what I mean, *I trusted my own code*\
    \ because I knew that all of my getters and setters were just boilerplate code.\
    \ But one time when I was debugging a problem with a junior developer, I found\
    \ that he wrote a setter method like this:\n\n```\npublic void setFoo(Foo newFoo)\
    \ {\n  openTheGarageDoor();\n  walkTheDog();\n  buyGroceries();\n  solveWorldPeace();\n\
    \  this.foo = newFoo + 1;\n}\n```\n\nIt wasn’t quite that exhaustive, but there\
    \ was a *lot* going on in there. And bear in mind, all of that happened inside\
    \ a “simple setter method” with this type signature:\n\n```\npublic void setFoo(Foo\
    \ newFoo)\n```\n\nThe lessons I took away from that were:\n\n*   This developer\
    \ needed some more training\n*   I couldn’t trust method type signatures, I had\
    \ to look at their code\n"
  raw: '*   **TDL**: A chapter that starts with *TDL* means that the chapter is related
    to the *To-Do List* application.


    ## Outline


    Next, if you want to know what youâ€™re about to get into in the rest of this
    book, read the following outline, which is something of a map of the following
    territory.


    Conversely, if you DONâ€™T want to know what weâ€™re about to get into and you
    prefer it to be a surprise, please skip the rest of this chapter.


    The outline goes a little like this:


    *   I start by looking at how little I used to use data types in Java/OOP


    *   Then I look at how much I *do* use them in Scala/OOP and Scala/EOP


    After that I show:


    *   Using data types isnâ€™t a bad thing, and in fact, itâ€™s a very good thing


    *   The importance of immutable things (variables and data structures)


    *   The importance of pure functions: specifically that you can trust them, because
    they cannot lie


    *   That the concepts of immutable things and pure functions naturally lead to
    EOP


    Then I show how to write a *Word Count* application with these concepts. As we
    go through that application weâ€™ll discover a few other things.


    After that, I do a little recap of Java/OOP code compared to the Scala/EOP code
    you saw in the Word Count example.


    After this we jump into the next important topic, functional error-handling:


    *   I explain the reasoning behind functional error-handling


    *   We look at Scalaâ€™s three *error-handling data types*: `Option`, `Try`, and
    `Either`


    *   I show how to implement the Word Count application using `Try`


    *   Then we build a larger *To-Do List* application, using all of these concepts


    *   This application uses a simulated database, so you see the techniques youâ€™ll
    use when accessing a remote database or REST API


    And at the end I show just *how close you are* to using FP libraries like ZIO
    and Cats Effect.


    And now, if youâ€™re ready, letâ€™s get started!


    # 5\. A Look at Java/OOP Code and Data Types


    Back in my Java programming days I rarely used generic data types, and in fact,
    I rarely thought about data types much at all. To demonstrate why, Iâ€™ll go back
    to one of my common examples, writing a point-of-sales application for a pizza
    store.


    Two points before we move on:


    *   A *generic* type in Java and Scala is typically a character like `T` or `A`
    thatâ€™s used in a method declaration. You use a generic type to say, â€œThe exact
    type used here will be filled in later.â€ For instance, a `List[A]` in Scala may
    later be a `List[Int]`, `List[String]`, etc. I write more about generic types
    as this book goes on.


    *   In these examples, please note that my Java code may not be 100% correct.
    I havenâ€™t put this code in an IDE or tried to compile it. Because I assume that
    you know Java or other OOP languages, my intent is to just quickly demonstrate
    the Java/OOP approach I used for many years.


    ## Modeling a pizza store application


    ### Some enums


    To start modeling a point-of-sales application for a pizza store, Iâ€™ll first
    need my usual enumerations:


    `enum Topping {`


    `    Cheese,`


    `    Pepperoni,`


    `    BlackOlives`


    `}`


    `enum CrustSize {`


    `    Small,`


    `    Medium,`


    `    Large`


    `}`


    `enum CrustType {`


    `    Regular,`


    `    Thin,`


    `    Thick`


    `}`


    ### A pizza class


    Given those, letâ€™s create a `Pizza` class. But before doing that, letâ€™s list
    the attributes and behaviors of an OOP pizza. The attributes are basically what
    I listed with those enums:


    *   Crust size


    *   Crust type


    *   Types of toppings


    The behaviors correspond to those attributes:


    *   Add topping


    *   Remove topping


    *   Set crust size


    *   Set crust type


    If I also kept price-related information, a pizza could also calculate its own
    price, but since the toppings and crust attributes donâ€™t carry price information
    with them, thatâ€™s pretty much all of the behaviors of this `Pizza`.


    Having gone through this exercise several times before, I know that I want all
    of the food-related items in a pizza store â€” pizza, breadsticks, soda, etc.
    â€” to extend a base `Product` class:


    `public interface Product {}`


    In the real world, a `Product` will have attributes like cost, and potentially
    a sales price, but for the purposes of this exercise Iâ€™ll just leave it as a
    marker interface like that.


    Given this `Product` â€” and the attributes and behaviors of my `Pizza` â€” the
    initial code for a Java/OOP `Pizza` class looks like this:


    `public class Pizza implements Product {`


    `    private List<Topping> toppings = new ArrayList<>();`


    `    private CrustSize crustSize;`


    `    private CrustType crustType;`


    `    public Pizza(CrustSize crustSize, CrustType crustType) {`


    `        this.crustSize = crustSize;`


    `        this.crustType = crustType;`


    `    }`


    `}`


    That `Pizza` class will then include the following series of getter and setter
    methods, with these type signatures:


    `public CrustSize getCrustSize()`


    `public CrustType getCrustType()`


    `public List<Topping> getToppings()`


    `public void setCrustSize(CrustSize crustSize)`


    `public void setCrustType(CrustType crustType)`


    `public void setToppings(List<Topping> toppings)`


    > The term *type signature* refers to a functionâ€™s (a) input parameters and
    (b) return type.


    ### Discussion


    The thing to notice here is that this is all simple code. The getters donâ€™t
    take any input parameters and they return basic data types, and the setters all
    return `void`. I wrote Java code like this for more than 12 years.


    In fact, if I wrote more code, such as for an `Order` class, youâ€™d see that
    the pattern is the same, all very simple code:


    `public class Order {`


    `    private List<Product> lineItems = new ArrayList<>();`


    `    public Order() {}`


    `    public void addItem(Product p)`


    `    public void removeItem(Product p)`


    `    public List<Product> getItems()`


    `    public String getPrintableReceipt()`


    `    public BigDecimal getTotalPrice()`


    `}`


    The closest I get to using generic types in that code are these types:


    `List<Topping>`


    `List<Product>`


    # 6\. Java/OOP Summary


    So that was a quick look at a little Java/OOP code that I used to use when teaching
    Java courses. Of course I didnâ€™t show much; just enough to get the basic idea
    across.


    ## Summary, Part 1


    To summarize what you saw in that code:


    *   My Java/OOP code was simple, with no generic types


    *   A lot of methods return `void`


    *   A lot of methods have no input parameters


    *   I *always* use mutable data structures


    *Mutable* data structures are structures like the Java `ArrayList`, which can
    be resized, and whose elements can be updated. We say that a structure like this
    can be *mutated*, which just means â€œchanged.â€


    ## Summary, Part 2


    There are a few other things to say about that code, and bear in mind, Iâ€™m only
    talking about my own code.


    **POINT 1:** I didnâ€™t realize it when I was writing Java/OOP code, but all of
    those methods that return `void` and take no input parameters tend to warp your
    brain. You canâ€™t tell what the methods do by looking at their type signatures,
    so you either (a) trust that the methods are well-named, or (b) you have to look
    at their source code to see what they do.


    As an example of what I mean, *I trusted my own code* because I knew that all
    of my getters and setters were just boilerplate code. But one time when I was
    debugging a problem with a junior developer, I found that he wrote a setter method
    like this:


    `public void setFoo(Foo newFoo) {`


    `    openTheGarageDoor();`


    `    walkTheDog();`


    `    buyGroceries();`


    `    solveWorldPeace();`


    `    this.foo = newFoo + 1;`


    `}`


    It wasnâ€™t quite that exhaustive, but there was a *lot* going on in there. And
    bear in mind, all of that happened inside a â€œsimple setter methodâ€ with this
    type signature:


    `public void setFoo(Foo newFoo)`


    The lessons I took away from that were:


    *   This developer needed some more training


    *   I couldnâ€™t trust method type signatures, I had to look at their code'
