    * 它们可以在 `for` 表达式中组合\n* 它们比这些错误处理类型多**许多**特性\n\n在上一节和本节中，我涵盖了前两个要点，在下一节中，我们将开始观察\
    \ `ZIO` 和 Cats Effect 库中工业级 `IO` 类型的一些特性。\n\n# 53. ZIO 和 IO 的力量\n\n就像 [Cats Effect\
    \ `IO` 类型](https://typelevel.org/cats-effect/docs/2.x/datatypes/io) 一样，`ZIO` 类型是一个极其增强的\
    \ `IO` 数据类型。正如提到的，在[函数式编程：简化版](https://alvinalexander.com/scala/functional-programming-simplified-book)\
    \ 中，我展示了如何用不到一页的代码编写一个*简单*的 `IO` 类型，但工业级 `IO` 类型的创建花费了*多年*时间。\n\n所以，在快速的 JIT 笔记之后，让我们开始编写一些\
    \ Scala/FP [ZIO](https://zio.dev) 代码。\n\n## JIT: Scala 2 应用\n\n在进入 ZIO 之前，我们需要一个快速的\
    \ JIT 课程，它的内容如下：创建一个 *Scala 2* 应用程序的方法如下：\n\n```scala\nobject Hello extends App\
    \ {\n    println(\"Hello\")\n}\n```\n\n在这段代码中，`App` 是由 Scala 2 SDK 提供的类型，如所示，你通过一个\
    \ `object` 扩展它来创建一个应用程序。在 Scala 3 中，我在书中展示的 `main` 方法取代了这种 Scala 2 的方法。（还有启动 Scala\
    \ 2 应用程序的其他方法，但对本节并不重要。）\n\n## ZIO 应用程序\n\n我提到这一点是因为 ZIO 采用了类似的方法，你可以这样创建 ZIO\
    \ 应用程序：\n\n```scala\nimport zio.{ZIOAppDefault, Console}\n\nobject Zio101 extends\
    \ ZIOAppDefault:\n    def run = Console.printLine(\"Hello, World!\")\n```\n\n\
    你所只需要导入必要的 ZIO 类型，然后创建一个扩展了 ZIO 的 `ZIOAppDefault` 类型的 `object`。该类型被描述为 [ZIO runtime](https://zio.dev/reference/core/runtime)，它评估你程序的其余部分。快速回顾，只需：\n\
    \n* 创建一个扩展 `ZIOAppDefault` 的 `object`\n* 在该 `object` 内部定义 `run` 方法来启动你的应用程序\n\
    * 然后程序的其余部分将作为 ZIO 应用程序被评估，你所有的方程/蓝图开始执行\n\n如果你深入研究 `ZIOAppDefault` 的源码，我怀疑你在那里某处会发现一个名为\
    \ `runUnsafe` 的函数。\n\n## ZIO + Scala CLI 101\n\n在代码中，我 ZIO 的 `Console` 类型创建了最简单的\
    \ ZIO “Hello, world”应用程序。为了进一步，将此代码保存为名为 `Hello1.scala` 的文件，创建一个完整的 Scala 3 +\
    \ ZIO + Scala CLI 应用程序：\n\n```scala\n//> using scala \"3\"\n//> using lib \"dev.zio::zio::2.0.2\"\
    \n// 像这样运行我：\n//     scala-cli Hello1.scala\n//     scala-cli Hello1.scala --watch\n\
    \nimport zio.{ZIOAppDefault, Console}\n\nobject Zio101 extends ZIOAppDefault:\n\
    \    def run = Console.printLine(\"Hello, World!\")\n```\n\n如注释所示，你在操作系统的命令行中使用\
    \ `scala-cli` 这样运行它：\n\n```bash\n$ scala-cli Hello1.scala\n```\n\n如果你以前没有用过 ZIO\
    \ —— 恭喜！你刚刚运行了第一个 Scala/FP ZIO 应用程序，如果你想想这本书从哪里开始，那是一项了不起成就。\n\n## ZIO + Scala\
    \ CLI 102\n\n下一个逻辑步骤是演示如何向你的应用程序添加一个 ZIO 变量：\n\n```scala\nimport zio.{ZIOAppDefault,\
    \ ZIO, Console}\nimport java.io.IOException\n\nobject Zio102 extends ZIOAppDefault:\n\
    \    val hello: ZIO[Any, IOException, Unit] =\n        Console.printLine(\"Hello,\
    \ World!\")\n    val run = hello\n```\n\n此应用程序中的第一个区别是我将 `hello` 创建为 `ZIO` 变量的实例：\n\
    \n```scala\nval hello: ZIO[Any, IOException, Unit] =\n```\n\n正如我之前提到的，思考 `ZIO`\
    \ 类型的思维模型是它是工作流的描述，你可以将其视为一个函数，给定一个 `R` 就可以产生 `A` 或 `E`：\n\n```scala\nf(r: R):\
    \ Either[E, A]\n```\n\n在在那段代码中：\n\n* `R` 代表传入的环境\n* `E` 是错误类型\n* `A` 是成功类型\n"
- fmt: "\nAlso because of the assumption that the code can throw an exception, I wrap\
    \ the `readLine` code in `ZIO.attempt`. `attempt` is a ZIO factory method that\
    \ you use when you literally attempt to do something that may fail. Because we’re\
    \ imagining that `readLine` can fail, we use `attempt` here.\n\nAs you’ll see\
    \ shortly, in other situations, where a block of code can’t really fail, we’ll\
    \ wrap that code with `ZIO.succeed` instead of `ZIO.attempt`. (As I mentioned,\
    \ ZIO has many different factory methods for all sorts of situations.)\n\nWith\
    \ this step of knowledge, our next little, complete ZIO application looks like\
    \ this:\n\n```scala\nimport zio.*\nimport scala.io.StdIn\n\nobject Zio103 extends\
    \ ZIOAppDefault:\n  // new: wrap procedural code that can fail with `attempt`\n\
    \  val username: ZIO[Any, Throwable, String] =\n      ZIO.attempt(StdIn.readLine(\"\
    What’s your name? \"))\n  val run = username\n```\n\nIf you run that code with\
    \ Scala CLI, you’ll see that we can now prompt a user for input. Now we just need\
    \ to use their input.\n\n## ZIO 104: ZIO.attempt, ZIO.succeed\n\nIf we assume\
    \ that we have the user’s name, we now need a way to functionally print that name.\
    \ Again we imagine that the ZIO `Console` type doesn’t exist, so we need to handle\
    \ this ourselves. For this I’ll go back to the way of writing functions that I\
    \ used in most of this book: a step-by-step function-sketching process.\n\nFirst,\
    \ we know that we eventually want to use the Scala `println` function to print\
    \ some text. You may not have any way of knowing this yet, but because I’ve done\
    \ this before, I know that I want to create a ZIO-based printing function that\
    \ starts like this:\n\n```scala\ndef printName(name: String): ZIO[???] =\n  //\
    \ some use of println here\n```\n\nThis is a function that takes a `String` input\
    \ parameter, returns some sort of `ZIO` type, and uses `println` in its body.\n\
    \nNext, because I already mentioned `ZIO.succeed`, I’ll jump inside the function’s\
    \ body to show how to wrap `println` with it:\n\n```scala\ndef printName(name:\
    \ String): ZIO[???] =\n  ZIO.succeed(println(s\"Hello, $name\"))\n```\n\nAs mentioned,\
    \ whenever a block of code can’t fail, just wrap it in `ZIO.succeed`.\n\nTo me,\
    \ the only way `println` can fail is if something is really wrong with a computer,\
    \ so it meets this definition. More importantly, its function signature doesn’t\
    \ state that it can throw exceptions.\n\nNow all we have to do is fill in the\
    \ `ZIO` type the function returns. To do that, we know these things:\n\n- The\
    \ function doesn’t require any sort of special environment, like a database, so\
    \ its type is `Any`.\n- We’re saying that the function body cannot fail — `println`\
    \ throws no exceptions — so its error type parameter is `Nothing`. With ZIO, any\
    \ time a function body can’t fail, you use this Scala type.\n- Because `println`\
    \ prints to STDOUT, it has the `Unit` return type, and because that’s the final\
    \ value of the function, it becomes the function’s “success” value, and is used\
    \ as the third `ZIO` parameter.\n\nGiven that thought process, here’s the complete\
    \ function:\n\n```scala\ndef printName(name: String): ZIO[Any, Nothing, Unit]\
    \ =\n  ZIO.succeed(println(s\"Hello, $name\"))\n```\n\nSo now we have ways to\
    \ prompt a user for input, read their input, and print their input. Now we just\
    \ need a way to call those functions in sequence.\n\n### Hello, flatMap\n\nExcluding\
    \ the necessary `import` statements, I’ll jump to the complete solution for this\
    \ problem:\n\n```scala\nobject Zio104 extends ZIOAppDefault:\n  val username:\
    \ ZIO[Any, Throwable, String] =\n      ZIO.attempt(StdIn.readLine(\"What’s your\
    \ name? \"))\n  def printName(name: String): ZIO[Any, Nothing, Unit] =\n     \
    \ ZIO.succeed(println(s\"Hello, $name\"))\n  val run = username.flatMap { name\
    \ =>\n      printName(name)\n  }\n```\n\nThe new code in this solution is this:\n\
    \n```scala\nval run = username.flatMap { name =>\n    printName(name)\n}\n```\n\
    \nHere are the keys to this code:\n\n- `run` is the usual `ZIOAppDefault` code.\
    \ It says, “Run the code on the right side of `=` as ZIO application.”\n- `flatMap`\
    \ is the new, interesting piece. In ZIO, `flatMap` is THE mechanism that is used\
    \ to run functional effects.\n- A key to that statement is that `ZIO`s are described\
    \ as “prints for concurrent workflows.” You can take that to mean that any `ZIO`\
    \ effect — such as `username` and `printName` — can potentially run concurrently.\n\
    - Therefore, `flatMap` is a way to ensure that in a concurrent environment, one\
    \ effect is run first, and then its output is given to the next effect, which\
    \ is run. We say the two effects are run in sequence, and this is sequential composition.\n\
    - In this example, the use of `flatMap` means, “Run `username`, and when it finishes,\
    \ pass its result as the variable `name` to the `printName` function, and then\
    \ run that.”\n- A cool thing is that this statement is true whether the functions\
    \ are implemented to run in serial or in parallel. You can almost think of that\
    \ as runtime detail that you don’t have to concern yourself with; you use `flatMap`.\n\
    \nNow when you run `Z104` with Scala CLI and your name happens to be `Alvin`,\
    \ the interaction looks like:\n\n```\n$ scala-cli Zio104\nWhat’s your name? Alvin\n\
    Hello, Alvin\n```\n\nCongratulations, again — you’re now sequentially composing!\n\
    \n## ZIO 105: From flatMap to for-expressions\n\nWhen you only have one or two\
    \ effects that need to be run sequence, you can use `flatMap` as shown. However,\
    \ when you need to run more effects in sequence, that sort of code can get hard\
    \ to read:\n\n```scala\neffect1.flatMap { var1 =>\n  // use var1 in somewhere\n\
    \  effect2.flatMap { var2 =>\n    // use var2 and/or var1 in somewhere\n    effect3.flatMap\
    \ { var3 =>\n      // use var1, var2, and var3 as needed\n    }\n  }\n}\n```\n\
    \nFrankly, nobody wants to read code like that. Fortunately this is where the\
    \ Scala `for` expression comes in: the `for` expression is quite literally syntactic\
    \ sugar for that code. This means that this `for` expression is the equivalent\
    \ of that `flatMap` code:\n\n```scala\nfor\n  var1 <- effect1\n  var2 <- effect2(var1)\n\
    \  var3 <- effect3(var2)\nyield ()\n```\n\nMore accurately, if I had taken the\
    \ time to write this `for` expression correctly — and if you dug into the Scala\
