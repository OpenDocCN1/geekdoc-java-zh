    \ we have this list of words, we can later convert it to a `Map` of word counts.\n\
    \n> `Seq`, `List`, and `Vector` are all immutable lists (sequences) that are suited\
    \ for slightly different purposes, but as long as we’re working with a relatively\
    \ small document, any of them will work.\n\nTherefore, this function takes a `String`\
    \ as input and returns a `Seq[String]`, so its signature looks like this:\n\n\
    ```scala\ndef convertStringToListOfWords(s: String): Seq[String]\n```\n\nand when\
    \ I add it to `wc`, its body now looks like this:\n\n```scala\ndef wc(document:\
    \ String): VectorMap[String, Int] =\n    val stringWithoutNewlines =\n       \
    \ replaceNewlinesWithBlanks(document)\n    val stringWithoutFormatting =\n   \
    \     stripFormattingCharacters(stringWithoutNewlines)\n    val stringWithSingleBlanks\
    \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords\
    \ =\n        convertStringToListOfWords(stringWithSingleBlanks)\n    ...\n```\n\
    \n## Convert words to the same case\n\nNow that we have a list of words, we need\
    \ to do one more thing: Either (a) convert them all to the same case — lowercase\
    \ or uppercase — or (b) perform a case-insensitive comparison of them later on\
    \ when we count the words. We need to do this to make sure we count words like\
    \ “Do” and “do” as the same word.\n\nBeing lazy, I’ll change all the words to\
    \ lowercase now. And because we’re now working with a `Seq[String]` — our list\
    \ of words — I’ll sketch this function to take a `Seq[String]` as input, and also\
    \ return a `Seq[String]`:\n\n```scala\ndef lowerCaseAllWords(listOfWords: Seq[String]):\
    \ Seq[String]\n```\n\nWith this addition, our `wc` function looks like this:\n\
    \n```scala\ndef wc(document: String): VectorMap[String, Int] =\n    val stringWithoutNewlines\
