    # Appendix F. A Quick Look at Variance and Bounds


    In this lesson I take *a very quick look* at two other generics concepts, *variance*
    and *bounds*.


    ## Variance


    In the previous lesson about using generic types with class constructor parameters,
    I showed this class:


    `class Pair[A, B](val a: A, val b: B):`


    `    def getKey: A = a`


    `    def getValue: B = b`


    Because thatâ€™s the complete class, and both `A` and `B` are only ever used in
    *out* positions â€” meaning that their values only come out of methods, and are
    never updated by values coming into methods â€” it would have been more correct
    to declare the two type parameters with `+` symbols, like this:


    `class Pair[+A, +B](val a: A, val b: B):`


    `    def getKey: A = a`


    `    def getValue: B = b`


    The `+` symbol tells the compiler that you only intend to use these parameters
    in the *out* position inside your class, so if you ever try to accept them as
    a method parameter, your code wonâ€™t compile. Itâ€™s your way of saying to the
    compiler that these variables are immutable and read-only.


    Declaring a generic parameter with the `+` symbol also has other benefits, and
    I detail those in my blog post, [Generic type parameters and variance explained](https://alvinalexander.com/scala/scala-3-variance-explained-generic-type-parameters/).
    In that post I write about the difference between parameters declared as `A`,
    `+A`, and `-A`.


    > NOTE: Iâ€™m intentionally keeping this short, because I donâ€™t get into variance
    in this book.


    ## Bounds


    The second thing youâ€™ll want to know is what I write about in my blog post,
    [How to define a generic method parameter that must extend a base type (bounds)](https://alvinalexander.com/scala/how-define-method-generic-parameter-must-extend-base-type).
    In that post I first show this function:


    `def getName[A <: RequiredBaseType](a: A) = ???`


    `            ---------------------`


    In this example, the underlined code means, â€œThe parameter `a` has the generic
    type `A` *and* `A` must be a subtype of `RequiredBaseType`.â€


    As a more concrete example later in the post, I create a small type hierarchy,
    followed by this function:


    `def getName[A <: AnimalWithLegs](a: A): String = a.name`


    I donâ€™t show the hierarchy here, but as you can imagine, people and dogs have
    legs, so these function calls are allowed, and compile properly:


    `getName(Person("Fred", 20))`


    `getName(Dog("Rover"))`


    But because a snake does not have legs, this attempt to call the function will
    not compile:


    `getName(Snake("Noodles"))   // error`


    Iâ€™m also trying to keep this example short, but as a tad bit more information:


    *   In my blog post example, `Person` and `Dog` both extend an `AnimalWithLegs`
    trait, but `Snake` does not.


    *   The `<:` is used to create something thatâ€™s called an *upper bound* in Scala.


    Please see that blog post for more details about how â€œboundsâ€ work.


    # Appendix G. File I/O with â€˜Usingâ€™


    In the lessons in this book that deal with reading and writing files, I violated
    my programming rules and used `var` fields and `null` values, because I thought
    that would make those functions more readable to Java, Kotlin, and other OOP developers.
    In this lesson Iâ€™ll show the preferred way to handle this situation in Scala.


    ## scala.util.Using


    I donâ€™t remember the exact timeline, but historically there were several efforts
    outside of the Scala SDK to create control structures that would automatically
    close resources for developers. David Pollak wrote about one approach in *Beginning
    Scala*, and I document how that works in my blog post, [The `using` control structure
    from Beginning Scala](https://alvinalexander.com/scala/using-control-structure-beginning-scala-david-pollak/).


    Then at some point in Scalaâ€™s history â€” after I wrote the first *Scala Cookbook*
    â€” a type named [`Using`](https://www.scala-lang.org/api/current/scala/util/Using$.html)
    was included in the `scala.util` package. Like these previous efforts, the purpose
    of this type is to automatically close any resources that you use, such as when
    you open file handles to perform I/O, and want to be sure that those file handles
    are always closed properly.


    The `Using` type *guarantees* that those resources will be properly closed by
    making sure the resource is closed inside the `finally` section of a `try`/`catch`/`finally`
    block in its code. (For example, the `using` control structure I wrote about makes
    sure that a `close` method is called on the given resource inside `finally`.)


    ## Example


    To demonstrate how `Using` works, this code shows how to re-write the `readFile`
    function I used earlier in this book to work with Scalaâ€™s `Using` type:


    `import scala.io.Source`


    `import scala.util.{Try, Using}`


    `def readFile(filename: String): Try[String] =`


    `    Using(io.Source.fromFile(filename)) { bufferedSource =>`


    `        bufferedSource`


    `            .getLines`


    `            // need to add the "\n" character back in`


    `            .map(line => s"$line\n")`


    `            .mkString`


    `    }`


    Hereâ€™s how that code works:


    *   `io.Source.fromFile` is a method that takes a `String` parameter that represents
    a filename, and returns a `scala.io.BufferedSource` (which is a subclass of `io.Source`).


    *   That value is passed into a `Using` instance.


    *   That creates a `BufferedSource` instance, which is then given the name `bufferedSource`
    as itâ€™s passed into the block of code that follows (inside the curly braces).


    *   The `bufferedSource` instance is used to read all lines from the file with
    `getLines`.


    *   The `map` method call adds a newline character to each line.


    *   `mkString` converts those lines to a single `String`.


    *   `Using` closes the `bufferedSource`, and returns that `String`, wrapped inside
    a `Try`.


    A few more notes may help to digest that:


    *   `BufferedSource` is like a `BufferedReader` in Java. Itâ€™s used to read text
    files.


    *   `BufferedSource` is a subclass of `Source`, which has a `close` method.


    *   I expect that youâ€™re probably familiar with `map` methods from other languages
    like Java and Kotlin, but in short, `map` is used with the function you supply
    to transform values, such as transforming all of the elements in a list.


    So, in summary, this shows how to read a file without using `var` fields or `null`
    values. Additionally, [the `Using` documentation](https://www.scala-lang.org/api/current/scala/util/Using$.html)
    shows a few other ways it can be used.


