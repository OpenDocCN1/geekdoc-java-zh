    \    val sortedMap =\n        sortMapByValue(initialMap)\n    sortedMap\n```\n\
    \n## Is that code to read?\n\nNow that we have a list of words, we need to do\
    \ one more thing: Either (a) convert them all to the same case — lowercase or\
    \ uppercase — or (b) perform a case-insensitive comparison of them later on when\
