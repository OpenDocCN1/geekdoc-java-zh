    \n// StockInstance is a class that takes these parameters:\nval stockInstance\
    \ = StockInstance(symbol, date, price, volume, high, low)\n```\n\nEven though\
    \ that example uses two impure functions to communicate with the outside world,\
    \ it gives you can idea of what EOP code looks like. (In regard to the `getUrlContent`\
    \ function, I’ll show a better way to write it in the following chapters.)\n\n\
    ## EOP benefits\n\nBecause expressions always return a result and generally donâ’t\
    \ have side effects, there are several benefits to EOP:\n\n- The code is easier\
    \ to write, read, and test. Inputs go into a pure function, a result is returned,\
    \ itâ€™s assigned to an immutable variable, and there are no side effects.\n-\
    \ Combined with Scala’s syntax, EOP results in concise, expressive code.\n- Although\
    \ it’s only been hinted at in these examples, expressions can often be executed\
    \ in any order. This subtle feature lets you execute expressions in parallel,\
    \ which is a huge bonus when you’re trying to take advantage of multicore CPUs.\n\
    \nIf you’re interested in more details, I write about all of these benefits in\
    \ [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book)\
    \ (and ~40% of that book is free).\n\n## On to the code!\n\nGiven this background,\
    \ it’s time to start writing some code that demonstrates the benefits of pure\
    \ functions, immutable things, and EOP!\n\n# 13. Example #1: Solving Problems\
    \ with Pure Functions and EOP\n\nWriting Scala code like this gets to be so much\
    \ like algebra that you can imagine walking in on Albert Einstein writing at a\
    \ chalkboard, and following his equations one at a time until he joins them all\
    \ together at the end.\n\nTo demonstrate this, let’s walk through the process\
    \ of writing a “word occurrence” algorithm using only pure functions, immutable\
    \ variables, immutable data structures, and EOP. I think you’ll see that we can\
    \ simply talk about this as we sketch out a series of pure function signatures\
    \ — just like writing algebra on a chalkboard.\n\n> This example was inspired\
    \ by a Haskell book. I’d like to give it credit, but I haven’t been able to remember\
    \ which book I saw it in.\n\n## Source code\n\nIf you want to work with this example’s\
    \ source code, you can find it here in the book’s Github repository, under the\
    \ `WordCount` folder:\n\n- [github.com/alvinj/LearnFunctionalProgrammingBook](https://github.com/alvinj/LearnFunctionalProgrammingBook)\n\
    \n## Problem statement\n\nThe first thing to do in any problem-solving effort\
    \ is to write a clear problem statement:\n\n> Given a document that’s represented\
    \ as a single Scala `String`, count the number of occurrences of each word in\
    \ that document.\n\nIn addition to that statement, weârere also shown that the\
    \ output of the algorithm should look like this, with the words in the first column\
    \ and the number of occurrences in the second column:\n\n`the    543`\n`an   \
    \  210`\n`or     99`\n`(more words here ...)`\n\nOkay, that seems good enough\
    \ for now. So, how do we start?\n\n## Getting started\n\nThe first thing we can\
    \ say is that we’re going to write a pure function that works like a “word occurrences”\
    \ or “word count” function. I don’t want to keep writing the word “occurrences,”\
    \ so to keep this simple I’ll refer to it as a word count function, which I’ll\
    \ name `wc`:\n\n```scala\ndef wc\n```\n\nNext, I know from the problem statement\
    \ that it will take the document as a `String` input parameter:\n\n```scala\n\
    def wc(document: String)\n```\n\nNow if I look at the sample output, that sure\
    \ looks like a `Map` to me. More specifically, a map where the key is a string,\
    \ and the value is an integer:\n\n`Map[String, Int]`\n\nFor instance, in Scala,\
    \ that sample data looks like this `Map`:\n\n```scala\nMap(\n  \"the\" -> 543,\n\
    \  \"an\" -> 210,\n  \"or\" -> 99\n)\n```\n\nAlso note that the output is printed\
    \ in sorted order, so we’ll want to return a `VectorMap` to indicate to others\
    \ that thereâ’s something unique about this map:\n\n`VectorMap[String, Int]`\n\
    \nA `VectorMap` is a specific type of immutable `Map` that lets us return the\
    \ map values in a sorted order.\n\nKnowing this, we can finish the sketch of our\
    \ main function signature like this:\n\n```scala\ndef wc(document: String): VectorMap[String,\
    \ Int]\n```\n\nSo there we have it, that’s the signature for our main function.\
    \ Now all we have to do is sketch out some more pure functions that this function\
    \ will call.\n\n## The next steps\n\nThere are several ways we *could* proceed\
    \ next, but because the requirement is that we just turn a `String` into a `Map`,\
    \ there’s no need to deal with that `String` as paragraphs and sentences. Instead,\
    \ we can work with it as is.\n\n## Get rid of newline characters\n\nThe first\
    \ thing I’ll do is strip all newline characters from the `String`. What I’m thinking\
    \ is that I can replace all newline characters with blank spaces, and then in\
    \ a few moments I’ll reduce all occurrences of blank spaces down to single spaces.\n\
    \nWhen you think of how “get rid of newline characters” function to work, you\
    \ can imagine it takes the existing `String` as input, so I start with:\n\n```scala\n\
    def replaceNewlines(s)\n```\n\nNext, I know that I want to return a `String` with\
    \ all the newline characters replaced, so I add `String` as the function type:\n\
    \n```scala\ndef replaceNewlines(s: String): String\n```\n\nSo that’s a sketch\
    \ of that function. At this point I feel comfortable that this is the first step\
    \ of my `wc` function, so I add it to `wc`:\n\n```scala\ndef wc(document: String):\
    \ VectorMap[String, Int] =\n  val stringWithoutNewlines = replaceNewlines(document)\n\
    ```\n\nNote that I’ll be wrapping expressions inside `wc` because (a) I’m intentionally\
    \ using long, meaningful function names, and (b) it’s hard to print wide lines.\n\
    \n## Remove formatting characters\n\nThe next thing I need to do is to remove\
    \ all formatting characters from the string — things like periods, exclamation\
    \ points, question marks, semi-colons, colons, and em dashes. So again, this is\
    \ going to be a function that takes a `String` as input and returns a `String`,\
    \ so I sketch this:\n\n```scala\ndef stripFormattingCharacters(s: String): String\n\
    ```\n\nI really don’t want you thinking about algorithms at the moment — just\
    \ function signatures. But if you find yourself thinking about algorithms, this\
    \ function can delete all of those formatting characters or replace them with\
    \ blank spaces; either approach will work.\n\nWhen I add this function to `wc`’s\
    \ body, it now looks like:\n\n```scala\ndef wc(document: String): VectorMap[String,\
    \ Int] =\n  val stringWithoutNewlines = replaceNewlines(document)\n  val stringWithoutFormatting\
    \ = stripFormattingCharacters(stringWithoutNewlines)\n```\n\n## Eliminate multiple\
    \ blank spaces\n\nAt this point I can’t think of any other changes I want to make\
    \ to the initial string. We’re still working with a `String`, and all of its words\
    \ should be separated by one or more blank spaces, so this is a good time to create\
    \ a function to convert multiple blank spaces into a single blank space. Once\
    \ again we have a `String` coming in and a `String` going out, so I sketch this\
    \ function like this:\n\n```scala\ndef squeezeBlankSpaces(s: String): String\n\
    ```\n\nThen I add that function call to `wc` to get this:\n\n```scala\ndef wc(document:\
    \ String): VectorMap[String, Int] =\n  val stringWithoutNewlines = replaceNewlines(document)\n\
    \  val stringWithoutFormatting = stripFormattingCharacters(stringWithoutNewlines)\n\
    ```\n"
