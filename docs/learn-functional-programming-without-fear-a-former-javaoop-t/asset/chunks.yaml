  trans: "\n尝试将 `x` 重新赋值为新值会产生“Reassignment”（重赋值）错误。因此，我们在书中创建变量的方式：作为代数变量，并使用 `val`\
    \ 关键字。\n\n> 注意：在 Scala/OOP 中，你*可以*使用 `var` 关键字创建可变变量，但本书不会使用这些变量。\n\n## 不变数据结构\n\
    \n本书也只使用*不可变数据结构*，例如 `String`、`List` 和 `Seq` 类，以及默认的 `Map` 类（也是不可变的）。当你使用不可变数据结构时，无法修改它。\n\
    \n> 提示：Java 开发者知道 Java 的 `String` 是不可变的。因此只需将所有其他数据类型想象为与 `String` 工作方式相同：你永远不会修改\
    \ `String`；而是调用它的方法创建一个新的 `String`。这些就像 Java 9 中引入的不可变集合类，例如在 Java 9+ 中使用 `List.of()`。\n\
    \n由于你不能改变 `List`、`Seq` 和 `Map` 等 Scala 集合类，一旦你创建了这样一个序列：\n\n```scala\nval xs =\
    \ Seq(1, 2, 3)\n```\n\n从它创建一个新 `Seq` 的唯一方法是将其结果重新赋值给新变量：\n\n```scala\n// 创建一个序列：\n\
    val a = Seq(1, 2, 3)\n\n// 基于初始序列创建新序列：\nval b = a ++ Seq(4, 5)     // b: List(1,\
    \ 2, 3, 4, 5)\nval c = b.filter(_ > 2)    // c: List(3, 4, 5)\n```\n\n如果这看起来很有局限性——不要担心！FPers（函数式程序员）每天都这样写代码。不可变性是一个核心概念，它让你的代码更容易维护，并且对于并行编程是安全的。\n\
    \n# 10. JIT: 纯函数\n\n我们需要涵盖的下一个 JIT 背景信息碎片是纯函数的定义。一个*纯函数*是指这样的函数：\n\n*   其来自外部世界的唯一参数是其函数签名中定义的输入参数。（我将输入参数列表称为函数的*正门*。）\n\
    *   不修改这些输入参数。\n*   不修改可能通过*侧门*访问的其它“隐藏”变量，例如类中的可变变量或任何其他全局变量。\n*   不与外部世界通信。它完全没有任何\
    \ I/O：没有文件访问、没有互联网访问、没有数据库访问、没有量子纠缠，什么都没有。\n*   给定相同的输入时，总是返回相同的输出。例如，`sum(2,\
    \ 2)` 始终是 `4`。\n*   对所有可能的输入值返回输出。\n*   不抛出异常。\n\n由于最后两个属性，FPers 说一个函数是*全的*（total），意味着它总是返回一个值。\n\
    \n纯函数的示例包括：\n\n*   获取字符串的长度或校验和\n*   计算整数列表 (`List[Int]`) 的和\n*   许多数学函数\n\n关于纯函数需要注意的一点是它们*总是*有输入参数，并且永远不返回\
    \ `Unit`：\n\n```scala\ndef stringLength(s: String): Int\n                  ---------\
    \   ---\n                     Input     Return\n                  Parameters \
    \ Type\n\n// 更多纯函数签名：\ndef sum(xs: List[Int]): Int\ndef add(a: Int, b: Int): Int\n\
    def cos(x: Double): Double\n```\n\n## 纯函数的签名告诉你它做了什么\n\n由于 Scala 中的纯函数签名始终包含 (a)\
    \ 输入参数的*数据类型*和 (b) 函数结果，你通常只需通过查看其类型签名就能猜出函数的作用，即使函数名没有意义。例如，你认为这个函数是做什么的：\n\n\
    ```scala\ndef f(s: String): Int = ???\n```\n\n因为函数接收一个 `String` 输入参数并返回一个 `Int`\
    \ —— 也因为你可以 100% 确定它是一个*纯函数* —— 该函数只能做几件事：\n\n*   计算字符串的长度\n*   计算字符串的某种校验和或哈希值\n\
    \n即使不知道函数的名称，你也可以从其类型签名很好地了解它可能做什么。这很酷。\n\n事实上，这*非常*酷。这是纯函数的伟大之处之一：当函数是纯的时，你只需看一眼它们的类型签名就能对它们的作用有一个很好的感觉。\n\
    \n对我来说，一旦我看到这一点，我开始希望所有函数都能以某种方式变成纯函数。\n\n### 它不能“String 转 Int”\n\n回到那个例子，当我勾勒它的函数签名时，我想了一会儿，函数可能做的另一件事是将\
    \ `String` 转换为 `Int` ... 但那是错的。因为尝试将 `String` 转换为 `Int` 的过程：\n\n```scala\ndef\
    \ f(s: String): Option[Int]\ndef f(s: String): Try[Int]\ndef f(s: String): Either[Throwable,\
    \ Int]\n```\n\n正如你将在接下来的内容中所看到的，每当你看到 `Option`、`Try` 或 `Either`，就意味着可能会出错。\n"
- fmt: "\n> As youâ€™ll see in this book, glueing pure functions together is also\
    \ just like algebra. (For more information on what I mean by glueing functions\
    \ together, see the term *composition* in this book’s Glossary.)\n\nOne other\
    \ thing: I also found that I like *reading* the signatures of pure functions that\
    \ *other people write*. Unlike OOP-style methods that can return `void` and/or\
    \ take no input parameters — which makes their type signatures meaningless — when\
    \ I look at the type signature of a pure function, I can tell at a glance what’s\
    \ going on.\n\n## Another pop quiz\n\nHereâ’s another little quiz: Knowing that\
    \ this function is pure, what can it possible do:\n\n```scala\ndef f(list: List[Int]):\
    \ Int = ???\n```\n\nIf you’re new to Scala, this code defines a function that\
    \ takes a list of integers as input, and returns an integer as its result:\n\n\
    * `def f` tells you that it’s a function named `f`.\n* It takes an input parameter\
    \ that I have named `list`, and its type is `List[Int]`, meaning that it is a\
    \ sequence (list) of integers.\n* The function returns an integer (`Int`).\n\n\
    I encourage you to write down everything you think that pure function can possibly\
    \ do.\n\nAs a second question, here’s the same function signature, but with a\
    \ generic type. Again, what can it possibly do:\n\n```scala\ndef g[A](list: List[A]):\
    \ A = ???\n```\n\nIf you’re not familiar with generic types, this just means that\
    \ this function can take a list of integers (`List[Int]`), a list of strings (`List[String]`),\
    \ a list of people (`List[Person]`), etc. The data type inside the `List` doesn’t\
    \ matter to the algorithm; the algorithm must only concern itself with the fact\
    \ that it’s given a list.\n\nThe `A` as the return type means that the function\
    \ returns a single element that is the same data type that’s contained inside\
    \ the list. So if the function receives a (`List[Int]`) as input, it must return\
    \ an `Int`; and if it gets a (`List[Person]`), it must return a `Person`, etc.\n\
    \nAgain, I encourage you to write down everything you think this function can\
    \ possibly do.\n\n## Key points\n\nAs a summary, there are several key points\
    \ from these last two chapters:\n\n* Pure functions reduce your cognitive load.\
    \ When you’re writing them, all you have to think about is their input, output,\
    \ and algorithm.\n* You can trust pure functions, they cannot lie. Their signatures\
    \ tell you exactly what they can (and cannot) do.\n\nAlso — I’ll repeat this many\
    \ times in this book — but writing code using pure functions (and immutable things)\
    \ feels just like writing algebra. You start by writing a few pure functions like\
    \ this:\n\n```scala\ndef add(i: Int, j: Int): Int\ndef multiply(i: Int, j: Int):\
    \ Int\n```\n\nand then you glue them together like this:\n\n```scala\nval x =\
    \ add(1, 1)\nval y = multiply(x, 2)\n```\n\nor this:\n\n```scala\nval z = multiply(add(1,\
    \ 1), 2)\n```\n\nOr, if you like architecture and engineering, this style of programming\
    \ is just like creating a blueprint. You’re connecting pipes and wires together,\
    \ and because pure functions can’t throw exceptions, all these pipes and beams\
    \ “just connect” to each other. (You don’t have to worry about functions throwing\
    \ exceptions and blowing up your design.)\n\n# 12. JIT: Expression-Oriented Programming\
    \ (EOP)\n\nBefore we start writing some code, we need to look at one more JIT\
    \ topic: *Expression-Oriented Programming*, or EOP. And to understand EOP, we\
    \ need to be clear about the differences between expressions and statements in\
    \ programming.\n\n## Statements vs expressions\n\nIn programming, a *statement*\
    \ is a block of code that does not return a result, and is used solely for its\
    \ side effect. For instance, both of these lines of code are statements because\
    \ they don’t return a result:\n\n```scala\nprintln(a)\nif a == b then println(a)\n\
    ```\n\nLines of code like those are used solely for their side effects, and in\
    \ those examples, their side effect is printing to STDOUT.\n\nConversely, a *pure\
    \ expression* is a block of code that DOES return a result, and has no side effects.\
    \ A terrific thing about Scala is that every line of code can be an expression.\
    \ That’s because all of these Scala constructs return a result:\n\n* `if`/`then`/`else`\n\
    * `match` expressions\n* `for` expressions\n* Even `try`/`catch`/`finally` returns\
    \ a value\n\nTo explain this, let’s look at how to use the `if`/`then`/`else`\
    \ construct as an expression.\n\n### Aside: A quick clarification\n\nFor the purists\
    \ out there, it’s more accurate to say that this code doesn’t return a *useful*\
    \ result:\n\n```scala\nif a == b then println(a)\n```\n\nIt does return something\
    \ — a type called `Unit` — which is like `void` in other languages. But in cases\
    \ like this we generally don’t care about its return value.\n\n> As I mentioned\
    \ previously, the `Unit` *type* has only one *value* (or instance) in Scala, and\
    \ that value is represented by the `()` symbol. Therefore, this type is not meaningful\
    \ or informative, and we use it as a function’s return type when we have no interest\
    \ in that return.\n\n## Using `if/then/else` as an expression\n\nAs mentioned,\
    \ `if`, `match`, `for`, and `try` can all be used as expressions. In regards to\
    \ `if`, this means that `if`/`then`/`else` yields a result:\n\n```scala\nval c\
    \ = if a < b then a else b\n```\n\nThat code can be read as: `a` is less than\
    \ `b`, assign `a` to `c`. If not, assign `b` to `c`.\n\n## Other constructs\n\n\
    Okay, let’s look at how other constructs can be used as expressions. This example\
    \ shows how `match` yields a value:\n\n```scala\nval evenOdd = i match\n  case\
    \ 1 | 3 | 5 | 7 => \"odd\"\n  case 2 | 4 | 6 | 10 => \"even\"\n```\n\nHere’s a\
    \ `for` expression:\n\n```scala\nval result = for i <- 10 if i > 5 yield i\n```\n\
    \nIf you’re not familiar with that syntax, `result` will hold this value: `Vector(6,\
    \ 7, 8, 9)`\n\n> `Vector` is a specific type of `Seq` — that has high-performance\
    \ characteristics, and is commonly used in Scala.\n\nWhen you first start with\
    \ Scala you may prefer to explicitly declare `result`’s type, like this:\n\n```scala\n\
    val result: Seq[Int] = for i <- 10 if i > 5 yield i\n```\n\nLastly, even `try`/`catch`/`finally`\
    \ blocks are used to write expressions:\n\n```scala\ndef makeInt(s: String): Int\
    \ =\n  try\n    s.toInt\n  catch\n    case e: Exception => 0\n  finally\n    //\
    \ do whatever you need to do\n```\n\nNote that this is NOT a recommended way to\
    \ write this function — returning `0` when you get an exception is wrong, and\
    \ I show better ways to write it shortly — but this does show that `try`/`catch`/`finally`\
    \ yields a value. You can use this `makeInt` function like this:\n\n```scala\n\
    makeInt(\"11\") // 11\nmakeInt(\"eleven\") // 0\n```\n\n## What EOP code looks\
    \ like\n\nAs I show in the [Scala Cookbook](https://amzn.to/3du1pMR), when you\
    \ write code using EOP, your code becomes easy to write, easy to read, and easy\
    \ to test. It’s just a series of expressions that use immutable variables, immutable\
    \ data structures, and pure functions:\n\n```scala\n// a series of expressions\n\
    val symbol = \"AAPL\"\nval url = buildUrl(symbol)\nval html = getUrlContent(url)\
    \ // an impure function\nval price = getPrice(html)\nval volume = getVolume(html)\n\
    val high = getHigh(html)\n```\n"
