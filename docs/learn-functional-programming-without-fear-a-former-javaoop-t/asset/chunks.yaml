    \ H. “Call By-Name” Parameters (and Multiple Parameter Groups)\n\nIf you’re interested\
    \ in how `IO` data types work — or if you’re like me a few years ago and wonder,\
    \ “How can that possibly work?! ” — one of the keys is that they take “Call By-Name”\
    \ (CBN) input parameters. To me that’s an unusual term, so let’s look at what\
    \ it means before we look at three examples.\n\n## Call By-Value\n\nTo understand\
    \ CBN parameters, it helps to first know that by default, function input parameters\
    \ are “Call By-Value” (CBV) parameters. The book, *Programming Scala* (co-written\
    \ by Martin Odersky), makes this statement about “by-value” parameters:\n\n> “Typically,\
    \ parameters to functions are by-value parameters; that is, the value of the parameter\
    \ is determined before it is passed to the function.”\n\nSo if you pass in a variable\
    \ named `x` and it has the value `42`, the `42` is what’s passed in.\n\n## Call\
    \ By-Name\n\nConversely, “by-name” parameters are quite different than by-value\
    \ parameters. Rob Norris makes the observation that you can think about the two\
    \ types of parameters like this:\n\n*   A *by-value* parameter is like receiving\
    \ a `val` field; its body is evaluated once, right before the parameter is bound\
    \ to the function.\n*   A *by-name* parameter is like receiving a `def` method;\
    \ its body is evaluated later, whenever it’s used inside the function.\n\nHe then\
    \ says that those statements “aren’t 100% accurate,” but I believe they are decent\
    \ analogies to start with. The important part of that second statement is that\
    \ a by-name parameter is like a `def` function, in that nothing happens with that\
    \ parameter until you reference it inside your function. And if that parameter\
    \ is inside an `if`/`else` expression or `match` expression, and its code branch\
    \ is never reached, that CBN parameter will never be executed.\n\nThe book, *Scala\
    \ Puzzlers*, confirms this when it states that by-name parameters are “evaluated\
    \ only when they are referenced inside the function.”\n\n## Better names for by-name\
