  trans: "\n第一个关键点是每个 `for` 循环都从一个生成器（generator）开始。`generator` 是数据源，例如列表或流。最简单的生成器如下：\n\
    \n```scala\nfor i <- 1 to 3 do println(i)    // 第 1 个示例\nval xs = List(1, 2, 3)\
    \           // 第 2 个示例\nfor x <- xs do println(x)\n```\n\n这些是 `for` 循环。它们被称为循环（loops）而不是表达式（expressions），因为它们是为了某些副作用（在本例中是打印）而对这些值进行循环操作。\n\
    \n相反，`for`/`yield` 组合被称为表达式（expressions），因为它们会 `yield`（产生）一个值，而你通常会将该值赋值给变量：\n\
    \n```scala\nval xs = List(1, 2, 3)\nval ys = for x <- xs yield x * 2\n```\n\n\
    你经常使用 `for`/`yield` 表达式来写一个函数：\n\n```scala\ndef double(xs: List[Int]): List[Int]\
    \ =\n     for x <- xs yield x * 2\n```\n\n当你刚接触这种语法时，这种风格可能更易读：\n\n```scala\n\
    def double(xs: List[Int]): List[Int] =\n     for\n          x <- xs\n     yield\n\
    \          x * 2\n```\n\n## 多个生成器\n\n`for` 循环和表达式可以根据你的算法需要任意数量的生成器：\n\n```scala\n\
    val rez =\n     for\n          i <- 1 to 2\n          j <- 3 to 4\n          k\
    \ <- 5 to 6\n     yield\n          i + j + k\n// rez: Vector(9, 10, 10, 11, 10,\
    \ 11, 11, 12)\n```\n\n如注释所示，这个 `for` 表达式的结果是一个包含所示整数列表的 `Vector`。（`Vector` 是一种特定类型的序列（`Seq`），它是它是不可变的，并且在许多不同情况下通常具有非常性能。）\n\
    \n## 守卫（Guards）\n\n`Guards` 基本上是你添加到 `for` 循环和表达式第一部分的 `if` 条件，它们看起来如下：\n\n```scala\n\
    val newValues =\n     for\n          i <- 1 to 5\n          j <- 6 to 10\n   \
    \       if i > 3\n          if j < 7\n     yield\n          i + j\n// newValues:\
    \ Vector(10, 11)\n```\n\n如所示，你可以根据算法需要添加任意数量的生成器和守卫。\n\n> 正如我在其他书书中提到的，Scala 的\
    \ `for` 语法的好处在于它将你的生成器和守卫（在第一部分）与你的业务逻辑（在第二部分，在 `do` 和 `yield` 关键字之后）隔离开来。\n\n\
    # 35. JIT: 代码块（闭包）\n\n在进入下一个 TDL 课程之前，我需要介绍一个 Scala 语言特性，我称之为 `code blocks`（代码块）或\
    \ `blocks of code`（代码段）。我在其他语言中见过这种特征可以被称为 `closure`（闭包，但我认为该术语有多种定义）。\n\n简而言之，你在\
    \ Scala 中使用大括号创建一个代码块，如下：\n\n```scala\nval a = {\n     // 一块代码\n     println(\"\
    hi mom\")\n     42\n}\n```\n\n代码块的结果是它的最终值。在这个示例中，该值是整数 `42`，所以如果你想显式声明 `a` 的类型，它是\
    \ `Int`：\n\n```scala\nval a: Int = {        // <== 显式设置类型\n     // 一块代码\n    \
    \ println(\"hi mom\")\n     42\n}\n```\n\n注意，任何合法的 Scala 代码都可以放在该代码块中，例如打印到 STDOUT\
    \ 的副作用。但从 Scala 的角度来看，它的返回类型是 `Int`。\n\n你可以在 Scala REPL 中通过将代码块传递给 `:type` 命令来亲自演示这一点：\n\
    \n```scala\nscala> :type { println(\"hi\"); 42 }\nInt\nscala> :type { println(\"\
    hi\"); \"dude\" }\nString\n```\n\n再次注意，代码块的 `type` 是它返回的最后一个值。而且如果这个最后一个值是产生 `Unit`\
    \ 的东西，那么这就是该块的类型：\n\n```scala\nscala> :type { val a = 7; println(\"hi\") }\nUnit\n\
    ```\n\n在我们准备下一节课时，意识到代码块是你需要的一点。\n\n# 36. JIT: 递归\n\n在下一节课之前，你必须具备意识的另一种编程技术是\
    \ `recursion`（递归）。递归非常有趣，而且是一项重要的 FP 技术，因此我在 [Functional Programming Simplified](https://alvinalander.com/functional-programming-simplified)\
    \ 中花了 50 多页来解释它。\n\n## 编写递归函数\n\n简而言之，递归函数是调用自身的函数。为了演示这一点，让我们创建一个“计数到” `0` 的递归函数。想法是给它一个整数，它会一直打印到\
    \ `0`，如 REPL 所示：\n\n```scala\nscala> countdown(3)\n3\n2\n1\n```\n\n你立刻可以看到这个函数接受一个\
    \ `Int` 参数：\n\n```scala\ndef countdown(i: Int)\n```\n\n你还可以看到它打印了结果，而不返回任何内容，所以它的返回类型是\
    \ `Unit`（类似于 `void`）：\n\n```scala\ndef countdown(i: Int): Unit =\n  if (i <= 0)\n\
    \    ()\n  else {\n    println(i)\n    countdown(i - 1)\n  }\n```\n"
- fmt: "\nGetting back to the `sum` function, the identity element for a sum algorithm\
    \ tells me that the stop condition for the recursion is to yield the value `0`:\n\
    \n```scala\ndef sum(list: List[Int]): Int = list match\n    case Nil => 0\n```\n\
    \nNext, I need to add the recursive call. The way you do this with `match` expressions\
    \ looks like this:\n\n```scala\ndef sum(list: List[Int]): Int = list match\n \
    \   case Nil =>\n        0\n    case head :: tail =>\n        head + sum(tail)\n\
    ```\n\nHere’s how that works:\n\n- On the left side of the `case`, I break `list`\
    \ into two elements, `head` and `tail`.\n- Notice that those are separated by\
    \ the `::` symbol.\n- When working with a `List`, that means `head` is a variable\
    \ that contains a single element (an `Int`), and `tail` is a variable that contains\
    \ the rest of the list (an `List[Int]`).\n- After that, this last line of code\
    \ can be read as, “Add the `head` element to the sum of all remaining elements”:\n\
    \n```scala\nhead + sum(tail)\n```\n\nNow if you paste that function into the REPL\
    \ with a sample `List[Int]`, you’ll see a result like this:\n\n```scala\nscala>\
    \ sum(List(1,2,3))\nval res0: Int = 6\n```\n\n## Tail recursion\n\nAs you get\
    \ into recursion, you’ll also want to learn about tail recursion, and if you’re\
    \ programming on the JVM, you’ll want to make sure you know about stacks and frames.\
    \ I cover all of this in more than 50 pages of recursion content in my book, [Functional\
    \ Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book).\n\
    \n# 37. TDL UI: Handling User Input\n\nNow that you’ve seen that background on\
    \ code blocks and recursion, it’s time to write a loop where we (a) prompt the\
    \ user for their input, (b) read that input, (c) process it, and then prompt them\
    \ again.\n\nAs you saw in the `delete` function I wrote in the database code,\
    \ I used a `for` expression to work with `Try` values. If it’s been a while since\
    \ you looked at that code, I recommend looking back at it now to see how it worked,\
    \ because we’re about to do something similar.\n\n## Looping; input\n\nRight now\
    \ we have almost everything we need to prompt a user and read their input. We\
    \ don’t have a way to process their input, but we can fake that for the time being.\
    \ What I really want to do right now is focus on how to create a loop so we can\
    \ stay in this cycle as long as the user wants:\n\n1. Prompt the user for input\n\
    2. Read their input\n3. Handle that input (presumable by calling our database\
    \ functions)\n4. Go back to Step 1\n\nBecause both `promptUser` and `readInput`\
    \ both return `Try` values, the way we do this in Scala is to perform that loop\
    \ with a `for` expression. So far, our main method starts like this:\n\n```scala\n\
    @main\ndef ToDoList =\n    val datafile = \"./ToDoList.dat\"\n    val db = Database(datafile)\n\
    \    val processor = InputProcessor(db)\n```\n\nSo after this, I’ll define a method\
    \ here that I’ll name `mainLoop`:\n\n```scala\ndef mainLoop(): Try[Unit] = for\n\
    ```\n\nFrom past experience I know that `mainLoop` will not require any input\
    \ parameters, and it will also return `Unit` wrapped in a `Try`. I’ll explain\
    \ this more shortly, but let’s push on for the moment.\n\n## Prompting for input\n\
    \nSo now our mindset is that we’re writing our main loop. Therefore, the first\
    \ thing we want to do is prompt the user for their input, so I add this line:\n\
    \n```scala\ndef mainLoop(): Try[Unit] = for\n    _ <- promptUser()\n```\n\nI showed\
    \ this syntax earlier, so I’ll just say that this can be read as, “Prompt the\
    \ user for their input. Because `promptUser` returns a `Unit` value inside a `Try`,\
    \ I don’t care about that value, so ignore it.” We use the `_` character on the\
    \ left side of the `<-` operator to say, “I don’t care about this value.”\n\n\
    ## Reading the input\n\nThe next thing we want to do in the loop is to read the\
    \ user’s input, so I add that in:\n\n```scala\ndef mainLoop(): Try[Unit] = for\n\
    \    _ <- promptUser()\n    input <- readInput()\n```\n\nThis binds the user’s\
    \ input to the variable I named `input`. Whatever they type in before they press\
    \ the [Enter] key is going to be a `String` that’s assigned to the `input` variable.\n\
    \n## Handling the input\n\nNext, our application needs to process the user’s input.\
    \ As I showed in the introduction to this To-Do List example, a user types this\
    \ to add a new task with the value `\"Wake up\"`:\n\n```text\na Wake up\n```\n\
    \nand they type this to delete the first task:\n\n```text\nd 1\n```\n\nand so\
    \ on; they use the other commands we allow.\n\nSo now we need some sort of processor\
    \ or handler to process these strings that we receive. For now I’m not going to\
    \ implement this processor; I’ll just create a “do nothing” function that has\
    \ the correct signature.\n\nAs usual, I start by sketching the signature of the\
    \ desired function. I’ll call this function `handleUserInput`, and I know it’s\
    \ going to take a string input parameter:\n\n```scala\ndef handleUserInput(input:\
    \ String)\n```\n\nAt this point — to complete the function signature — you have\
    \ to think forward a little bit: `handleUserInput` is going to receive the user\
    \ input as a string, it’s going to attempt to process it, and then interact with\
    \ our database. Because our database functions all return `Try`, this function\
    \ should also return `Try`, so I add that:\n\n```scala\ndef handleUserInput(input:\
    \ String): Try\n```\n\nWait, let's re-examine the source text's logic for `handleUserInput`.\
    \ The source text has some fragmented lines for the signature. I will consolidate\
    \ them into a clean structure as requested.\n\n```scala\ndef handleUserInput(input:\
    \ String): Try[Unit]\n    // ... implementation\n```\n\nActually, looking at the\
    \ source text: \n`def handleUserInput(input: String): Try`\n`\nUnit`\n\nLet's\
    \ format the signature properly:\n\n```scala\ndef handleUserInput(input: String):\
    \ Try[Unit]\n    // todo:\n    println(\"handleUserInput\")\n```\n\n## Back to\
    \ the main\n\nAt this point we could add that function to `mainLoop`, like this:\n\
    \n```scala\ndef mainLoop(): Try[Unit] = for\n    _ <- promptUser()\n    input\
    \ <- readInput()\n    _ <- {\n        handleUserInput(input)\n        mainLoop()\n\
    \    }\nyield ()\n```\n\n## The problem\n\nHowever, the problem we have is that\
    \ if we call `main` right now, it won’t really loop; it only runs once. It prompts\
    \ the user, reads their input, processes it, and then quits. We still need some\
    \ way for our loop to, well, loop.\n\nWhen you’re working with immutable variables,\
    \ the solution to this problem is almost the same: recursion. Inside our `for`\
    \ expression we just need to call `main`, so it invokes itself again. I’ll format\
    \ that code so it looks like this:\n\n```scala\ndef mainLoop(): Try[Unit] = for\n\
    \    _ <- promptUser()\n    input <- readInput()\n    _ <- {\n        handleUserInput(input)\n\
    \        mainLoop()\n    }\nyield ()\n```\n\nYou can format it in different ways,\
    \ but the important thing is that this code:\n\n```scala\n_ <- {\n    handleUserInput(input)\n\
    \    mainLoop()\n}\n```\n\nis what we need.\n"
