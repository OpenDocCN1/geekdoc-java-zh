  trans: "\n\n基于上述背景，这里与 TDL 的简单交互如下：我使用 `a` 命令添加了两个任务，然后使用 `d` 命令删除了第一个：\n\n`(Commands:\
    \ a \"task\", d 1, v, q, h)`\n\n`Yo: a wake up`\n\n`1. wake up`\n\n`(Commands:\
    \ a \"task\", d 1, v, q, h)`\n\n`Yo: a brush teeth`\n\n`1. wake up`\n`2. brush\
    \ teeth`\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo: a make coffee`\n\n\
    `1. wake up`\n`2. brush teeth`\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo:\
    \ d 1`\n\n`1. brush teeth`\n\n这就是该应用的工作方式。\n\n## 编写编写的规则\n\n为了编写 TDL 应用，我将使用到本书为止为止遵循的相同规则。它将使用：\n\
    \n* 不变变量\n* 不可变数据结构\n* 纯函数\n* 表达式导向编程\n* 函数式错误处理\n\n我还会添加这条规则：\n\n* 任何与外部世界交互的函数必须返回一个\
    \ `Try` 值\n\n我在“字数计数”示例从文件中读取文档时用过这种技术，但现在这是一条硬性规定。\n\n## 扁文件数据库\n\n我最初开始使用 SQL\
    \ 数据库和 Scala 数据库库来创建此应用。然而，当我深入研究 Scala 数据库库时，我发现它们几乎都直接进入了函数式编程（FP）概念。由于我们仍在逐步构建这些概念，我决定不使用那种方法。\n\
    \n相反，此应用程序将使用“扁文件数据库”。这并不是一个真正的数据库，只是一个文件。对于 TDL 应用，它将包含一个分行的“待办”事项列表，如下：\n\n\
    ```\nWake up\nMake the coffee\nBrush my teeth\nTake a shower\n```\n\n然而，如果你对扁文件数据库的高级用法感兴趣，一种常见的方法是使用字段分隔符（如符号）来分隔文件中的字段。当你这样做时，你的行看起来像这样：\n\
    \n```\n|Alvin|Alexander|Talkeetna\n|Fred|Flintstone|Bedrock\n|Mary|Bailey|Bedford\
    \ Falls\n```\n\n因此，我们将在接下来的章节中编写此数据库代码，这样做的好处是，你将在应用程序边界使用 `Try` 与外部世界通信，并了解它是如何与代码的其他部分协作的。\n\
    \n# 26 TDL：Database 类\n\n当我思考 TDL 的 `main` 方法如何启动时，我认为它首先需要执行的操作是创建一个 `Database`\
    \ 类的实例：\n\n```\n@main\ndef ToDoList =\n    val db = Database(\"./ToDoList.dat\"\
    )\n    ...\n```\n\n在代码代码中，我向 `Database` 传递了它应该作为扁文件数据库的文件名。这立即告诉我，我需要一个接受文件名输入参数的\
    \ `Database` 类：\n\n```scala\nclass Database(val dbFilename: String):\n    // 方法在此\
    \ ...\nend Database\n```\n\n正如你将在后续课程中看到的，我们将在类内部定义这些函数，以模拟 SQL 函数的工作方式：\n\n*\
    \ `insert`\n* `delete`\n* `selectAll`\n\n> 注意：编写这段代码与编写 OOP 代码相同，即你有一个接收构造函数参数（`dbFilename`）的类，然后该类中的方法使用该参数。唯一的区别是我不会修改该参数，因此，如所示，我定义它为\
    \ `val` 参数。\n\n## 关于 ‘Try’ 规则\n\n回想我的规则：任何连接到外部世界的函数必须返回 `Try` 错误处理类型。对于扁文件数据库来说这有些过度设计了，但如果你能记住真实的数据库代码通常会访问另一个服务器（或集群），该服务器在你调用时可能运行也可能不运行，这就有帮助。这就像跨越可能可用也不可用的网络调用\
    \ REST API 一样。\n\n在这些情况下，健壮的代码必须返回像 `Try` 或 `Either` 的错误处理类型，对于我们的目的，我将使用 `Try`。\n\
    \n## 这如何影响 Database\n\n根据这条规则，我勾勒了 `Database` 类，具有以下类型签名的方法：\n\n```scala\nclass\
    \ Database(dbFilename: String):\n    def insert(record: String): Try[Unit] = ???\n\
    \    def selectAll(): Try[Seq[String]] = ???\n    def delete(indexToDelete: Int):\
    \ Try[Int] = ???\nend Database\n```\n\n我将在后续章节中解释这些代码，简而言之：\n\n* `insert` 返回 `Try[Unit]`，其\
    \ `Success` 和 `Failure` 结果告诉我们它是否执行成功\n* `selectAll` 返回 `Try[Seq[String]]`，它是\
    \ `Try` 内部的字符串列表。\n* `delete` 返回 `Try[Int]`，其 `Int` 值表示删除的数量。\n\n在所有情况下，如果服务器宕机，我们会得到\
    \ `Failure`。如果服务器正常，我们会得到 `Success`。\n\n## 方法 vs 函数\n\n最后的说明：\n\n* 当你在类内部定义时，我称之为方法（methods）。\n\
    * 在任何其他地方，我称之为函数（functions）。\n\n# 27 TDL：Database 类\n\n快速提醒一下，在接的课程中，我们将创建一个这样的结构：\n\
    \n```scala\nclass Database(dbFilename: String):\n    def insert = ???\n    def\
    \ selectAll = ???\n    def delete = ???\nend Database\n```\n\n## insert\n\n我们需要第一个\
    \ `Database` 函数是 `insert` 函数。因为这是一个扁文件数据库，该函数将向数据库添加一条记录。因此，我知道它接受一个字符串作为输入，并开始这样勾勒\
    \ `insert` 函数：\n\n```scala\ndef insert(record: String)\n```\n\n接下来 —— 因为我已经经历了这个过程\
    \ —— 我知道我想让这个函数使用 `writeToFile` 来执行写入。我知道是因为我在后续课程中编写的 `delete` 和 `update` 函数要求我读取整个文件然后重写。所以\
    \ `writeToFile` 需要能够 (a) 追加文件和 (b) 完全覆盖文件。\n\n因此，让我们暂时忘记 `insert` 函数，先处理 `writeToFile`\
    \ 函数。\n\n## writeToFile\n\n`writeToFile` 将是 `Database` 类内部的另一个函数，由于 `Database`\
    \ 外部不需要访问它，我首先将其设私有：\n\n```scala\nprivate def writeToFile\n```\n\n接下来，因为我知道 `delete`\
    \ 和 `update` 要求我完全重写文件，我定义它接受一个字符串列表，在 Scala 中最泛义的形式是 `Seq[String]`：\n\n```scala\n\
    private def writeToFile(lines: Seq[String])\n```\n\n我还知道在调用此函数时想设置一个布尔 `append`\
    \ 标志。这让我声明我是要覆盖文件还是追加文件：\n\n```scala\nprivate def writeToFile(lines: Seq[String],\
    \ append: Boolean)\n```\n\n现在最后需要考虑的是它的返回类型。正如我在规则中提到的，任何与外部世界通信的函数必须返回一个 `Try`\
    \ 值，所以这得到了：\n\n```scala\nprivate def writeToFile(lines: Seq[String], append: Boolean):\
    \ Try[\n```\n\n现在唯一的问题是，“`Try` 内部的成功值应该是什么？”\n\n"
- fmt: "\nSince I don’t need any data back when writing a file — I just need a `Success`\
    \ or `Failure` to know if it worked or now — this type can be `Unit`. (As mentioned\
    \ before, this means that I’m not interested in the return type.) So I complete\
    \ the function signature like this:\n\n```scala\nprivate def writeToFile(lines:\
    \ Seq[String], append: Boolean): Try[Unit] =\n```\n\n### Implementing writeToFile\n\
    \nNext, I’m going to do something controversial and violate two of my rules: I’m\
    \ going to use a `var` field and a `null` value. However, I’m `only` doing this\
    \ because:\n\n*   I suspect that many people reading this book are familiar with\
    \ languages like Java and Kotlin, and therefore writing to files with Java classes\
    \ and methods.\n*   The more-correct solution requires a little more Scala knowledge\
    \ that I don’t want to get into yet. (I share this correct solution in the `Using`\
    \ lesson in the Appendix.)\n\nTherefore, because this is Java/OOP code that uses\
    \ the `java.io.*` classes, I write the body of the function as shown here, with\
    \ comments describing the important parts:\n\n```scala\nimport java.io.*\nimport\
    \ scala.util.{Try, Success, Failure}\n\n/**\n * Notice that `dbFilename` comes\
    \ in through a side door.\n */\nprivate def writeToFile(lines: Seq[String], append:\
    \ Boolean): Try[Unit] =\n  // i create this variable before the 'try' block because\
    \ i need to\n  // access it in the 'finally' block:\n  var bw: BufferedWriter\
    \ = null\n  try\n      // this is basically standard Java code that you use to\n\
    \      // create a BufferedWriter:\n      bw = BufferedWriter(FileWriter(File(dbFilename),\
    \ append))\n      // here i loop over every String in 'lines', and write each\n\
    \      // String (one at a time) to the file. each String is\n      // followed\
    \ by a newline character:\n      for line <- lines do bw.write(s\"$line\\n\")\n\
    \      // if the previous code does not throw an exception, flow\n      // comes\
    \ here, and we will return this Success:\n      Success(true)\n  catch\n     \
    \ // if the previous code DOES throw an exception, control\n      // comes here\
    \ and we will return a Failure:\n      case e: Throwable => Failure(e)\n  finally\n\
    \      // the 'finally' block always executes, so this is where\n      // we release/close\
    \ resources we opened. note that you need\n      // to check if 'bw' is null,\
    \ because the previous code\n      // may explode before 'bw' is bound to the\
    \ BufferedWriter:\n      if bw != null then bw.close\n```\n\nI added a lot of\
    \ comments in there to explain that code works. So you can read that function\
    \ more easily, here it again without those comments:\n\n```scala\nprivate def\
    \ writeToFile(lines: Seq[String], append: Boolean): Try[Unit] =\n  var bw: BufferedWriter\
    \ = null\n  try\n      bw = BufferedWriter(FileWriter(File(dbFilename), append))\n\
    \      for line <- lines do bw.write(s\"$line\\n\")\n      Success(true)\n  catch\n\
    \      case e: Throwable => Failure(e)\n  finally\n      if bw != null then bw.close\n\
    ```\n\nAgain, this is a very Java/OOP solution to this problem, and if you’d like\
    \ to see the Scala solution, see the `Using` lesson in the Appendix.\n\n### Getting\
    \ back to the insert function\n\nNow that I have the `writeToFile` function, all\
    \ I have to do is finish the `insert` function. I already sketched this portion\
    \ of it:\n\n```scala\ndef insert(record: String)\n```\n\nand now that I want to\
    \ call `writeToFile`, I know that `insert`’s body should look like this:\n\n```scala\n\
    def insert(record: String) ...\n  writeToFile(List(record), true)\n```\n\nIn that\
    \ code, I wrap the `String` that’s received in a `List`, because `writeToFile`\
    \ expects to receive a `Seq[String]`. And because I know that `writeToFile` returns\
    \ a `Try[Unit]`, and I also want to return a `Try` from `insert`, I use that as\
    \ this function’s return type as well:\n\n```scala\ndef insert(record: String):\
    \ Try[Unit] =\n  writeToFile(List(record), true)\n```\n\nThat completes the `insert`\
    \ function.\n\n# 28. TDL: The selectAll Database Function\n\nNext, the `selectAll`\
    \ function is basically a “read a text file” function, so it’s going to work a\
    \ lot like the `insert` function, except we’ll be reading instead of writing.\
    \ Because the code is similar to the last lesson, I’ll move through it a little\
    \ more quickly.\n\nFirst, we know that we want a `selectAll` function, and it\
    \ needs to return a `Try`:\n\n```scala\ndef selectAll(): Try\n```\n\nBecause the\
    \ function returns all rows from the file, this means the success value is a `Seq[String]`:\n\
    \n```scala\ndef selectAll(): Try[Seq[String]]\n```\n\nIn the last lesson I created\
    \ a `writeToFile` function, but in this lesson that won’t be necessary, so I’ll\
    \ add the file-reading code directly to `selectAll`. Conceptually this code is\
    \ identical to the previous lesson, except that we’re reading instead of writing:\n\
    \n```scala\n/**\n * Notice that `dbFilename` comes in through a side door.\n */\n\
    def selectAll(): Try[Seq[String]] =\n  var bufferedSource: scala.io.BufferedSource\
    \ = null\n  try\n      bufferedSource = Source.fromFile(dbFilename)\n      val\
    \ lines = for line <- bufferedSource.getLines yield line\n      Success(lines.toList)\n\
    \  catch\n      case t: Throwable => Failure(t)\n  finally\n      if bufferedSource\
    \ != null then bufferedSource.close\n```\n\n> Again, I wrote this code in a Java/OOP\
    \ style, and you can see the “Using” lesson in the Appendix.\n\nI tested this\
    \ function, and in the `Success` case it returns a value like:\n\n`Success(List(\"\
    a\", \"b\", \"c\", \"d\"))`\n\nand in the `Failure` case it returns:\n\n`Failure(java.io.FileNotFoundException:\
    \ No such file or directory)`\n\nSo now we have `insert` and `selectAll` functions.\
    \ I could start working on the UI now, but for the sake of completeness, let’s\
    \ write a `delete` function before we switch to the UI.\n\n# 29. TDL: The delete\
    \ Function\n\nWhen you think about it, a `delete` function should either take\
    \ (a) a string that represents the To- Item the user wants to delete, or (b) an\
    \ index (row number) that should be deleted. Either approach is okay, but after\
    \ I worked with the UI a bit, I decided to go with the index-based approach, so\
    \ I’ll share that.\n\n### delete\n\nSo far we know that we want a `delete` function\
    \ that takes an index, so we have:\n\n```scala\ndef delete(indexToDelete: Int)\n\
    ```\n\nWe also know that because it accesses the outside world, it should return\
    \ a `Try`, so I add that:\n\n```scala\ndef delete(indexToDelete: Int): Try\n```\n\
    \nAnd finally, because SQL `delete` queries return a count of the rows that are\
    \ deleted, I’ll do the same thing, returning that count inside the `Try`:\n\n\
    ```scala\ndef delete(indexToDelete: Int): Try[Int] =\n```\n\nTechnically I’m only\
    \ allowing the user to delete one task a time, so this information isn’t terribly\
    \ useful. But, if you want to change the app to let the user delete multiple tasks\
    \ at once, that value will be more useful.\n\n### Writing the function body\n\n\
    Having written functions like before, I know that the function body should work\
    \ something like this:\n\n*   Read the entire flat-file database into a list of\
    \ strings\n*   Remove the matching string from that list (using the index value)\n\
    *   Write the remaining list back to the file (overwriting the file, rather than\
    \ appending to it)\n\nThere are a few ways to do this, but one approach is to\
    \ use a `for` expression. Because I haven’t shown those much yet, I’ll use that\
    \ approach here. In this case I’m going to share the complete solution, and then\
    \ describe how it works:\n\n```scala\ndef delete(indexToDelete: Int): Try[Int]\
    \ =\n  val maybeNumRowsDeleted = for\n      rows <- selectAll()\n```\n"
