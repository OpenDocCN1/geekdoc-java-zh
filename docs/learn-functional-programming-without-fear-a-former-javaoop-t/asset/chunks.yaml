    `        println("\n(Commands: a \"task\", d 1, u 1, h, q, v)")`


    `        print("Yo: ")`


    `    }`


    `end IOHelper        `


    ## Back to main


    Now I can go back to my `ToDoList.scala` file and put this code in it:


    `import IOHelper.*`


    `@main def ToDoList() =`


    `    val db = Database("./ToDoList.dat")`


    `    promptUser()`


    At this point Iâ€™m ignoring the fact that `promptUser` returns a `Try`, but Iâ€™ll
    get back to that shortly. Before doing that, letâ€™s write a function to read
    the userâ€™s input.


    # 31\. TDL UI: Read Input


    To read input from a user, we use the `readLine` function thatâ€™s in the `scala.io.StdIn`
    data type. Again â€” imagining that weâ€™re reading input in a REST service â€”
    we know that we want to return a `Try`:


    `def readInput(): Try`


    Because `readLine` returns a `String`, the function returns a `Try[String]`, and
    the complete function looks like this:


    `def readInput(): Try[String] = Try {`


    `    StdIn.readLine()`


    `}`


    Now I add this function to the `IOHelper` object:


    `import scala.io.StdIn`


    `import scala.util.{Try, Success, Failure}`


    `object IOHelper:`


    `    def promptUser(): Try[Unit] = Try {`


    `        println("\n(Commands: a \"task\", d 1, u 1, h, q, v)")`


    `        print("Yo: ")`


    `    }`


    `    def readInput(): Try[String] = Try {`


    `        StdIn.readLine()`


    `    }`


    `end IOHelper`


    At this point, if all I was going to do was prompt the user one time and then
    read their input, I could add `readInput` to my main method, like this:


    `import IOHelper.*`


    `@main def ToDoList() =`


    `    val db = Database("./ToDoList.dat")`


    `    promptUser()`


    `    val input: Try[String] = readInput()`


    After that I would handle the `input` value, most likely in a `match` expression.


    *However*, this is not what I want. What I really want is to keep prompting the
    user inside some sort of loop. But first, letâ€™s write one more I/O function
    while weâ€™re in this neighborhood.


    # 32\. TDL UI: Show Help


    The other function I want to write while weâ€™re in this neighborhood is a â€œhelpâ€
    function. Itâ€™s similar to `promptUser` in that it just prints to STDOUT, so
    I follow that same recipe:


    *   Itâ€™s a function that returns `Try[Unit]`


    *   I create the function using `Try`â€™s constructor (putting the `println` inside
    `Try{...}`.)


    Hereâ€™s the new `showHelp` function, inside the `IOHelper` object:


    `import scala.io.StdIn`


    `import scala.util.{Try, Success, Failure}`


    `object IOHelper:`


    `    def promptUser(): Try[Unit] = Try {`


    `        println("\n(Commands: a \"task\", d 1, u 1, h, q, v)")`


    `        print("Yo: ")`


    `    }`


    `    def readInput(): Try[String] = Try {`


    `        StdIn.readLine()`


    `    }`


    `    def showHelp(): Try[Unit] = Try {`


    `        val text = """`


    `        |  Possible commands`


    `        |  -----------------`


    `        |  a <task>         - add a to-do item`


    `        |  h                - show this help text`


    `        |  d [task number]  - delete a task by its number`


    `        |  v                - view the list of tasks`


    `        |  q                - quit`


    `        """.stripMargin.trim`


    `        println(text)`


    `    }`


    `end IOHelper`


    ## Multiline strings


    Whatâ€™s new in this function is that it uses a multiline `String`. You create
    a multiline string in Scala using triple-quotes, as shown. The use of triple-quotes,
    the character at the beginning of each line, and then the `stripMargin` and `trim`
    method calls on the string turns a string like this:


    `val s = """`


    `    |Alvin Alexander`


    `    |123 Main Street`


    `    |Talkeetna, AK 9967`


    `""".stripMargin.trim`


    into a left-aligned string that prints like this:


    `Alvin Alexander`


    `123 Main Street`


    `Talkeetna, AK 9967`


    For more information on multiline strings, see my blog post, [How to create multiline
    strings in Scala](https://alvinalexander.com/scala/how-to-create-multiline-strings-heredoc-in-scala-cookbook/)


    # 33\. JIT: Using Option and Try in for-Expressions


    Before we get into the next TDL lesson, I need to make sure youâ€™re familiar
    with how the `Option`, `Try`, and `Either` error-handling types work in `for`
    expressions.


    ## Option


    When you have a function like this that returns an `Option`:


    `import scala.util.control.Exception.allCatch`


    `def makeInt(s: String): Option[Int] =`


    `    allCatch.opt(s.toInt)`


    You can use that function in a `for` expression to yield a result:


    `val rez: Option[Int] =`


    `    for`


    `        a <- makeInt("1")`


    `        b <- makeInt("2")`


    `        c <- makeInt("3")`


    `    yield`


    `        a + b + c`


    `// rez == Some(6)`


    To make this simpler, letâ€™s get rid of `makeInt` and replace it with just `Some`
    values:


    `val rez: Option[Int] =`


    `    for`


    `        a <- Some(1)`


    `        b <- Some(2)`


    `        c <- Some(3)`


    `    yield`


    `        a + b + c`


    As shown in that code, I declare that `rez` has the type `Option[Int]`. When you
    use one or more `Option` values in a `for`/`yield` expression, the resulting value
    will also be an `Option`, as indicated there. So thatâ€™s the first important
    thing to know:


    > When a `for` expression works with `Option` values and yields a result, that
    result is also an `Option`.


    A second key to know is that *inside* the `for` expression and `yield` area, the
    values `a`, `b`, and `c` have the â€œsuccessâ€ type thatâ€™s inside the `Option`.
    Restating this second key point:


    > Inside the `for` and `yield` areas, the values `a`, `b`, and `c` have the data
    type thatâ€™s inside the `Option`. In those two areas you work with the â€œsuccessâ€
    type thatâ€™s *contained* within the `Option`.


    ## Try works the same way


    And then a third important thing to know is that `Try` works the same as `Option`:


    `import scala.util.{Try, Success, Failure}`


    `val rez: Try[Int] =`


    `    for`


    `        a <- Success(1)`


    `        b <- Success(2)`


    `        c <- Success(3)`


    `    yield`


    `        a + b + c`


    `// rez == Success(6)`


    In this `for` expression the same two keys apply:


    *   When a `for` expression works with `Try` values and yields a result, the result
    is a `Try`.


    *   Inside the `for` and `yield` areas, the values `a`, `b`, and `c` have the
    â€œsuccessâ€ data type thatâ€™s inside the `Try`. (In those two areas you work
    with that success type.)


    (For *many* more details, see my book, [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book).)


    # 34\. JIT: for Loops, Generators, and Guards


    If youâ€™re not familar with Scala, youâ€™ll need to know about `for` loops, generators,
    and guards before we work on the next aspect of the TDL app.


    ## Generators'
