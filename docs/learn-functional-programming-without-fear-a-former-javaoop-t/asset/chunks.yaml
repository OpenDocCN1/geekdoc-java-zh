  trans: "\n\n相反，正如你在字数计数（Word Count）示例中所看到的，当我使用纯函数在 Scala 中规划该应用时，我已经在处理此类数据类型了：\n\
    \n`Seq[String]`\n\n`VectorMap[String, Int]   // or: MapSortedByValueDesc[Word,\
    \ Count]`\n\n这暗示了在 Scala 中，我们对*类型（types）*的使用比开发者在 Java/OOP 中习惯的使用要得多。\n\n作为一个乐于帮助想要学习更多\
    \ Scala 程序员的人，承认这与 Java/OOP 是一个不同的世界至关重要。在 Java 世界中，除非你是一个库开发者，否则你通常只会处理这类类型；但在\
    \ Scala 世界中，所有层级的开发者都会使用它们。因此，我认为承认这种差异很重要。\n\n尽管如此，我想问问：你觉得字数计数示例难理解吗？我怀疑——也希望——它并不难。正如你所看到的，我只是勾勒了一系列纯函数及其类型签名。\n\
    \n## 益处\n\n这种只使用纯函数、不可变变量和不可变数据结构的方法有很多益处。首先，这里是你已经看到的一些内容：\n\n* 你编写纯函数。\n* 编写纯函数几乎是到了极致简单。你不需要担心整个应用程序的状态，你只需要考虑的是\
    \ (a) 输入了什么，以及 (b) 输出了什么。由于这些属性，你可以像我刚才那样勾勒出解决方案。只需将解决方案勾勒成系列纯函数，然后填充函数体即可。\n\
    * 你可以信任纯函数的类型签名，它们不会撒谎。它们的签名告诉你是正在发生什么。\n* 正因如此，你可以信任其他开发者编写的纯函数。\n* 到目前为止我简要提到了这一点，但如果你查看一个纯函数的签名并看到\
    \ `Option`、`Try` 或 `Either` 作为返回类型，你会立刻：“这里可能会出问题。（很快会进行详细介绍。）”\n\n除了这些益处之外：\n\
    \n* 纯函数不仅更容易写，而且更容易读。只需查看纯函数的类型签名，你就能对该函数可能做什么有一个很深刻的认识。\n* 你将开始把解决问题看作代数，或者像建筑师或工程师一样创建蓝图。\n\
    * 正如你在字数计数示例中看到的，问题的最终解决方案只是组合你的纯函数，就像代数方程一样。\n* 遵循所有这些逻辑，*测试*纯函数也变得更容易。你所做的只是设置前门输入的内容，以及你期望从后门输出的内容。你不需要担心应用程序其他地方（侧门）的可变状态。\n\
    \n## 下一步\n\n在我们完全离开字数计数示例之前，让我们为它添加一个现实场景：你的老板来找你并请求更改。\n\n# 17. 对 wc 程序的更改\n\n\
    所以更改是，你的老板来找你说：“嗯，呃，是的，关于那个字数计数应用我搞错了。你不会得到一个代表文档的 `String`，你将得到一个你需要读取的文件名称的\
    \ `String`，它包含了文档。”\n\n这不是一个巨大的变化，但它确实引发了一些有趣的问题；如果出现以下情况该怎么办：\n\n* 文件不存在？\n*\
    \ 文件不可读？\n\n在 Java/OOP 中——甚至是 Scala/OOP 中——你可能会抛出异常，然后让代码的调用者来处理它们。但在 Scala/EOP\
    \ 和 Scala/FP 中，我们不做这些事情。我们不抛出异常，因为那些会短路我们的代数方程或破坏我们的蓝图。\n\n相反，我们使用一种不同的技术，被称为*函数式错误处理（functional\
    \ error handling）*和*错误处理数据类型*。我们接下来将查看它们。\n\n# 18. 函数式错误处理 (FEH)\n\n在 Scala 中，处理潜在错误的正确解决方案是使用\
    \ Scala 的*错误处理数据类型*。简而言之，这意味着一个可能失败的函数应该返回 `Option`、`Try` 或 `Either` 类型之一：\n\n\
    `def wc(f: File): Option[?]`\n\n`def wc(f: File): Try[?]`\n\n`def wc(f: File):\
    \ Either[?]`\n\n基本思想是返回一个错误处理数据类型，以考虑到该函数可能发生错误的情况。\n\n## 这些类型是包装器\n\n错误处理类型基本上是*包装器（wrappers）*，在它们的包装内部包含了两种可能性之一：\n\
    \n* 函数执行成功，你可以访问它的成功值\n* 函数执行失败，你可以访问它的错误值\n\n所以这就像是你从函数那里拿回容器：\n\n```\n┏━━━━━━━━━━━━━━━━━━━━┓\n\
    \      Option\n   Success OR Failure\n┗━━━━━━━━━━━━━━━━━━━━┛\n```\n如所示，当你从函数那里获得容器时，它将包含一个成功值或两者两者兼具。这种方法的一个非常棒的一点是，与异常不同，它们不会短路你的代码：你只是在处理另一个数据类型。你将此结果视为值，并像代数一样继续你的代码。`Option`、`Try`\
    \ 和 `Either` 错误处理类型的方法略有不同，但这是它们的本质。\n\n让我们看看它们是如何工作的\n\n暂时用 OOP 思考，这些中的每一个都是父类型，每个类型有两个子类型。对于这三个值，这些是父类型及其子类型：\n\
    \n* `Option`、`Some` 和 `None`\n* `Try`、`Success` 和 `Failure`\n* `Either`、`Right`\
    \ 和 `Left`\n\n它们的类层次结构是基础 OOP，看起来如下：\n\n```\n┏━━━━┳┓\n  Option\n  Some\nNone\n\
    ┗━━━━┻┛\n```\n```\n┏━━━━┳┓\n  Try\n  Success\nFailure\n┗━━━━┻┛\n```\n```\n┏━━━━┳┓\n\
    \  Either\n  Right\nLeft\n┗━━━━┻┛\n```\n\n# 19. FEH: Option\n\n我喜欢的第一个函数式错误处理类型是\
    \ `Option`，以及它的伴侣 `Some` 和 `None`。我这样做是因为 (a) 它类似于 Java 的 `Optional` 类型，并且 (b)\
    \ 它比 `Try` 和 `Either` 更基础一点。\n\n## 在事情可能出错的世界里……\n\n"
- fmt: "\nGetting back to our Word Count application, our boss just came to us and\
    \ told us we’re not getting a `String` that represents the document, we’re getting\
    \ a `String` that is the name of the file that contains the document.\n\nAs any\
    \ experienced developer knows, when you write certain functions, things can go\
    \ wrong. This is especially true when you start working with File I/O, Network\
    \ I/O, and Database I/O. In this world, files can be unreadable, networks can\
    \ be down, servers can be down, etc., and these things must be accounted for.\n\
    \nWhen you write these functions in other programming languages you might throw\
    \ exceptions or return null values, but in Scala we don’t do those things. As\
    \ mentioned, we use *error-handling data types*.\n\n> As I wrote [in this blog\
    \ post many years ago](https://alvinalexander.com/scala/best-practice-eliminate-null-values-from-code-scala-idioms/),\
    \ Tony Hoare, the inventor of the `null` reference — way back in 1965 — refers\
    \ to the creation of the `null` value as his “billion dollar mistake.”\n\n## A\
    \ simpler problem: Converting a String to an Int\n\nI’m going to put off the Word\
    \ Count application just a little while longer, and instead I want to work on\
    \ a slightly easier problem. I’ll show how to *safely* convert a `String` to an\
    \ `Int`. This is a relatively simple problem, so we can focus on our error-handling\
    \ types rather than missing files or servers that are down. (We’ll deal with those\
    \ later in the book.)\n\nSo the problem with converting a `String` to an `Int`\
    \ is that sometimes it works, and sometimes it doesn’t. And when it doesn’t, the\
    \ process throws an exception. The Scala REPL shows how this process succeeds\
    \ and how it fails:\n\n```\nscala> \"1\".toInt\nval res0: Int = 1\n\nscala> \"\
    one\".toInt\njava.lang.NumberFormatException: For input string: \"one\"\n```\n\
    \nIn the first example the string properly represents an integer — `\"1\"` — so\
    \ the conversion process works. But when the string can’t be converted to an integer\
    \ in the second example, the process blows up with a `NumberFormatException`.\n\
    \nCode blowing up is bad. You can’t write algebra when your equations can explode.\n\
    \n## A first attempt\n\nIf we *didn’t* have error-handling types, we might first\
    \ try to write a `makeInt` function like this:\n\n```scala\ndef makeInt(s: String):\
    \ Int =\n    try\n        s.toInt\n    catch\n        case e: NumberFormatException\
    \ => 0\n```\n\nThat function always returns an `Int`, but the problem is that\
    \ it isn’t accurate in all instances. For example, all of these function calls\
    \ will return `0`, which is incorrect:\n\n```\nmakeInt(\"0\")\nmakeInt(\"\")\n\
    makeInt(\"one\")\n```\n\nIn the first example the value returned is correct, but\
    \ in the second and third examples, `0` is not the correct answer. So, what is\
    \ the correct solution?\n\n## The correct solution\n\nThis is where Scala’s error-handling\
    \ data types come in. Instead of the function returning an `Int`, the correct\
    \ approach is for it to return a data type that *encapsulates* the possibility\
    \ of success or failure. As mentioned, I want to first work with the `Option`\
    \ type, and its sub-types, `Some` and `None`.\n\nThe general solution is to (a)\
    \ define your function to return an `Option` that wraps the type that your function\
    \ yields when it succeeds — `Int`, in this case. And then in the body of the function,\
    \ you return (b) a `Some` for the *success* case, and (c) a `None` for the *failure*\
    \ case:\n\n```scala\ndef makeInt(s: String): Option[Int] =\n    try\n        Some(s.toInt)\n\
    \    catch\n        case e: NumberFormatException => None\n```\n\nAs shown, the\
    \ `Some` wraps the data type that you were able to calculate successfully, and\
    \ in the error case you return a `None`. (The `None` type doesn’t contain anything,\
    \ it’s just an indicator to callers of your function that something went wrong.)\n\
    \nWhen you call the function, you’ll see the `Some` and `None` types as its return\
    \ value:\n\n```scala\n// success cases\nmakeInt(\"1\")      // Some(1)\nmakeInt(\"\
    2\")      // Some(2)\n\n// failure cases\nmakeInt(\"\")       // None\nmakeInt(\"\
    one\")    // None\n```\n\nA key to this solution is that `Option` is the base\
    \ type, and `Some` and `None` are its sub-types:\n\n```\n  Option\n  / \\\nSome\
    \ None\n```\n\nSo you declare that the function returns the parent type: `Option`,\
    \ or specifically an `Option[Int]` in this case. Then body of the function returns\
    \ its sub-types: `Some` for the success case, and `None` for failure. When you\
    \ write the function, that’s all you have to do.\n\n## Using the function\n\n\
    Now that `makeInt` is written like this, the flip side of the coin is, “As a caller\
    \ of this function, how I handle this type?”\n\n### pattern matching\n\nOne of\
    \ the most common ways to handle an `Option` is with *pattern matching* in a `match`\
    \ expression:\n\n```scala\nmakeInt(s) match\n    case Some(i) => println(s\"Conversion\
    \ worked! i = $i\")\n    case None    => println(\"The conversion failed.\")\n\
    ```\n\nAs shown, the `match` expression lets you handle the two possible cases,\
    \ `Some` and `None`. When you work with the `Some` you extract the `Int` out of\
    \ it, and when you work with the `None`, it’s just an indicator that something\
    \ failed.\n\n### for expressions\n\nA second common way the function is used is\
    \ inside a `for` expression, especially when you have multiple calls to your function.\
    \ This code shows the result when three strings can be converted to integers:\n\
    \n```scala\nval maybeSum: Option[Int] =\n    for\n        i <- makeInt(\"1\")\n\
    \        j <- makeInt(\"2\")\n        k <- makeInt(\"3\")\n    yield\n       \
    \ i + j + k\n// result: maybeSum == Some(6)\n```\n\nSome developers like to use\
    \ the word “maybe” when receiving an error-handling type, because value “may be”\
    \ a success type, or not. So I thought I’d show that term here. The important\
    \ part is that when the `for` expression finishes, `maybeSum` has the value `Some(6)`.\n\
    \nNext, this *exact same code* shows what happens when one or more string values\
    \ cannot be converted to integers:\n\n```scala\nval maybeSum: Option[Int] =\n\
    \    for\n        i <- makeInt(\"1\")\n        j <- makeInt(\"Hi mom!\")\n   \
    \     k <- makeInt(\"3\")\n    yield\n        i + j + k\n// result: maybeSum ==\
    \ None\n```\n\nAs shown, in this situation, `maybeSum` is a `None` rather than\
    \ a `Some`. However, notice that you don’t care at this point if something failed,\
    \ you just write the code as shown, and it handles both the success and failure\
    \ cases.\n\nThen, whenever you want to work with `maybeSum`’s value, you can work\
    \ with in a `match` expression:\n\n```scala\nmaybeSum match\n    case Some(i)\
    \ => println(s\"Conversion worked! i = $i\")\n    case None    => println(\"The\
    \ conversion failed.\")\n```\n\nAt some point in history, someone referred to\
    \ the `Some` case as the *Happy Path*, because it’s the success case. And that\
    \ would make the `None` case the *Unhappy Path*, because it’s the failure case.\n\
    \nBut the keys here are:\n\n*   Your code is still algebra because you’re dealing\
    \ with values, and not exceptions. (There is no short-circuiting or explosions.)\n\
    *   Your code doesn’t get all uglified and hard to read with a bunch of `try`/catch`\
    \ blocks.\n\n## Pure functions cannot lie\n\nBefore we move on, it’s worth repeating\
    \ this about the signatures of pure functions: *they cannot lie*.\n\nAs you saw\
    \ in this example, the `makeInt` function screams loud and clear, “I’ll give you\
    \ an `Int` if everything goes well, but be warned that something can wrong here”:\n\
    \n```scala\ndef makeInt(s: String): Option[Int] = ???\n```\n\nWhenever you see\
    \ `Option` as the return type of a pure function, you know that something can\
    \ go wrong inside that function.\n"
