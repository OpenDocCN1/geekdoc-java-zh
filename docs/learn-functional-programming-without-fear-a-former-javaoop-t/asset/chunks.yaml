  trans: "\n\n这意味着 `readLine` 不是引用透明的，我们无法对它使用代数代换。在函数式编程（FP）世界中，这是*糟糕的*，因为我们希望将代码写成代数形式。\n\
    \n那么，我们可以做什么呢？\n\n这就是 Haskell 社区发明 `IO` 类型的地方。\n\n# IO 来救场\n\n你使用 `IO` 类型的方式类似于\
    \ `Try`，在最基础的情况下，看起来像下面这两个示例：\n\n```scala\nval input: IO[String] = IO(io.StdIn.readLine())\n\
    ```\n\n```scala\ndef printLater(s: String): IO[Unit] = IO {\n  println(s)\n}\n\
    ```\n\n这里的关键在于 `IO` 像是一个封装，而且是一个*惰性*封装：传递给 `IO` 的代码不会*现在*执行，它将在*以后某个时候*执行。即使在第一种情况下也是如此，因为我将\
    \ `input` 定义为一个 `val` 字段。\n\n> 因为 `IO` 是惰性的，我们仍然是将代码写成一份蓝图。*现在*我们描述我们想要的，然后在*以后*某个时候这段代码才会被实际运行。\n\
    \n与其把 `IO` 想成一个封装，你不如把它想成一个盒子——也是一个小时间机器。现在它什么都不包含，它就像一个贴着标签的盒子，描述了*以后某个时候里面会有什么*。你可以想象盒子上有一个标签，写着：“以后某个时候，这个盒子将包含\
    \ (a) 一个 `String` 或 (b) 一个错误。”\n\n> 提示：`IO` 就像从亚马逊获得的一张收据，显示“你的包裹将送达”，以后某个时候它要么\
    \ (a) 顺利送达（`Either` 的*愉快*情况），要么 (b) 损坏（`Either` 的*不愉快*情况）。（它也可能丢失，但不符合我的比喻。）\n\
    \n但现在，作为一个数学家或架构师，你只需要把它认为是一个 `IO`：\n\n```\n+------+\n|  IO  |\n+------+\n```\n\
    \n如果你熟悉 Scala 的 `Future`，它与 `Future` ，但有一个很大的区别：`Future` 会立即开始运行，而 `IO` 是惰性的，所以现在什么都不会发生。\n\
    \n## 惰性\n\n我们说这样的代码是*惰性的*，或者说是*惰性求值的*。Haskell 以其一切都采用惰性求值的语言而闻名。你可以编写任何想要的 Haskell\
    \ 代码，但除非你发出“*现在*运行代码”的魔法咒语，否则什么都不会发生。\n\n相反，我以前用 Java 编写的所有代码都是*严格的*，或者说是*严格求值的*。例如，当你这样写\
    \ Java 代码时，它会立即运行：\n\n```java\nString input = getInput();\n```\n\n坦率地说，我这样写 Java\
    \ 代码写了近十五，甚至不知道还有其他编写代码的方法。\n\n### 惰性有助于 RT\n\n惰性为我们所做的是，它让我们继续将代码看作代数或蓝图。我们知道我们正在处理一个特定类型的\
    \ `IO` —— 例如 `IO[String]` —— 然后我们很愉快地继续创建我们的蓝图，因为现在什么都不会发生。\n\n例如，我们还可以使用我们的惰性\
    \ `IO` 值编写 `for` 表达式，同样地，现在什么都没有发生：\n\n```scala\nval result = for\n  input <-\
    \ readInputLater()\n  _     <- printLater(input)\nyield\n  ()\n```\n\n正如我提到的，Haskell\
    \ 有一个魔法咒语可以让你说：“好的，我准备好了，现在运行蓝图。”Cats Effect 和 ZIO 库也有类似的咒语，在历史上，这个咒语是一个命名类似于\
    \ `runUnsafe` 的函数。这意味着当你准备好运行整个应用程序——或者在这个示例中，只是这个 `for` 表达式时——你这样运行它：\n\n```scala\n\
    runUnsafe(result)\n```\n\n实际的函数名各不相同，但“unsafe”一词是 FP 中用来表示：“等一下大家，我们现在要执行蓝图了，包括所有不安全的副作用。”*在此之前*，一切都是等式和蓝图，没有任何发生，但*现在*是行动时刻了。\n\
    \n现在，为了结束这节课程，我想添加两个笔记。\n\n# 笔记 1：Future 不是这样的\n\n首先，重要的一点是要明确，Scala 的 `Future`\
    \ *并不是*这样工作的。例如，如果早的 `input` 值是这样写的：\n\n```scala\nval input: Future[String] =\
    \ Future(doSomeSideEffect())\n```\n\n那么 `doSomeSideEffect` 函数将立即运行。这就是 `Future`\
    \ 的工作方式，它立即运行。\n\n从 FP 的角度来看，这是糟糕的；这是一个设计缺陷。缺陷在于 `Future` 在同一个步骤中将蓝图和动作结合在了一起。作为\
    \ FP 开发者，我们能够在我们工作时布局蓝图，而不会让它开始运行。作为一个数学家/架构师，我们能够将“什么”与“何时”分开，将描述与执行分开：`Future`\
    \ 的动作应该只在以后某个时候才被触发。\n\n# 笔记 2：Call-name\n\n"
- fmt: "\nTherefore, `IO` types have been created as a way to deal with I/O and other\
    \ side effects. They have all the benefits of `Try` and `Either`, but:\n\n* Theyâ€™re\
    \ lazy, so we keep the algebraic substitution model\n* They can be combined in\
    \ `for` expressions\n* They have MANY more features than these error-handling\
    \ types\n\nIn the previous lesson and this lesson I covered the first two bullet\
    \ points, and in the next lesson weâ€™ll start looking at some of the features\
    \ that industrial-strength `IO` types have in the `ZIO` and Cats Effect Effect\
    \ libraries.\n\n# 53. ZIO and the Power of IOs\n\nLike the [Cats Effect `IO` type](https://typelevel.org/cats-effect/docs/2.x/datatypes/io),\
    \ the `ZIO` type is an incredibly souped-up `IO` data type. As mentioned, in [Functional\
    \ Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book),\
    \ I show how to write a *simple* `IO` type in less than a page of source code,\
    \ but industrial-strength `IO` types have taken *years* to create.\n\nSo, after\
    \ a quick JIT note, let’s start writing some Scala/FP [ZIO](https://zio.dev) code.\n\
    \n## JIT: Scala 2 applications\n\nBefore we get into ZIO, we need one quick JIT\
    \ lesson, and it goes like this: One way to create a *Scala 2* application looks\
    \ like this:\n\n```scala\nobject Hello extends App {\n    println(\"Hello\")\n\
    }\n```\n\nIn this code, `App` is a type thatâ€™s provided by the Scala 2 SDK,\
    \ and you extend it with an `object`, as shown, to create an application. In Scala\
    \ 3, the `main` method approach I show in this book replaces this Scala 2 approach.\
    \ (Thereâ€™s another way to start Scala 2 applications, but that isn’t important\
    \ for this lesson.)\n\n## ZIO applications\n\nI mention that because ZIO takes\
