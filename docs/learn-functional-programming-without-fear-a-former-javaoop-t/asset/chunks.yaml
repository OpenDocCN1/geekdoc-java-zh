    *   `def f` tells you that itâ€™s a function named `f`.


    *   It takes an input parameter that I have named `list`, and its type is `List[Int]`,
    meaning that it is a sequence (list) of integers.


    *   The function returns an integer (`Int`).


    I encourage you to write down everything you think that pure function can possibly
    do.


    As a second question, hereâ€™s the same function signature, but with a generic
    type. Again, what can it possibly do:


    `def g[A](list: List[A]): A = ???`


    If youâ€™re not familiar with generic types, this just means that this function
    can take a list of integers (`List[Int]`), a list of strings (`List[String]`),
    a list of people (`List[Person]`), etc. The data type inside the `List` doesnâ€™t
    matter to the algorithm; the algorithm must only concern itself with the fact
    that itâ€™s given a list.


    The `A` as the return type means that the function returns a single element that
    is the same data type thatâ€™s contained inside the list. So if the function receives
    a (`List[Int]`) as input, it must return an `Int`; and if it gets a (`List[Person]`),
    it must return a `Person`, etc.


    Again, I encourage you to write down everything you think this function can possibly
    do.


    ## Key points


    As a summary, there are several key points from these last two chapters:


    *   Pure functions reduce your cognitive load. When youâ€™re writing them, all
    you have to think about is their input, output, and algorithm.


    *   You can trust pure functions, they cannot lie. Their signatures tell you exactly
    what they can (and cannot) do.


    Also â€” Iâ€™ll repeat this many times in this book â€” but writing code using
    pure functions (and immutable things) feels just like writing algebra. You start
    by writing a few pure functions like this:


    `def add(i: Int, j: Int): Int`


    `def multiply(i: Int, j: Int): Int`


    and then you glue them together like this:


    `val x = add(1, 1)`


    `val y = multiply(x, 2)`


    or this:


    `val z = multiply(add(1, 1), 2)`


    Or, if you like architecture and engineering, this style of programming is just
    like creating a blueprint. Youâ€™re connecting pipes and wires together, and because
    pure functions canâ€™t throw exceptions, all these pipes and beams â€œjust connectâ€
    to each other. (You donâ€™t have to worry about functions throwing exceptions
    and blowing up your design.)


    # 12\. JIT: Expression-Oriented Programming (EOP)


    Before we start writing some code, we need to look at one more JIT topic: *Expression-Oriented
    Programming*, or EOP. And to understand EOP, we need to be clear about the differences
    between expressions and statements in programming.


    ## Statements vs expressions


    In programming, a *statement* is a block of code that does not return a result,
    and is used solely for its side effect. For instance, both of these lines of code
    are statements because they donâ€™t return a result:


    `println(a)`


    `if a == b then println(a)`


    Lines of code like those are used solely for their side effects, and in those
    examples, their side effect is printing to STDOUT.


    Conversely, a *pure expression* is a block of code that DOES return a result,
    and has no side effects. A terrific thing about Scala is that every line of code
    can be an expression. Thatâ€™s because all of these Scala constructs return a
    result:


    *   `if`/`then`/`else`


    *   `match` expressions


    *   `for` expressions


    *   Even `try`/`catch`/`finally` returns a value


    To explain this, letâ€™s look at how to use the `if`/`then`/`else` construct as
    an expression.


    ### Aside: A quick clarification


    For the purists out there, itâ€™s more accurate to say that this code doesnâ€™t
    return a *useful* result:


    `if a == b then println(a)`


    It does return something â€” a type called `Unit` â€” which is like `void` in
    other languages. But in cases like this we generally donâ€™t care about its return
    value.


    > As I mentioned previously, the `Unit` *type* has only one *value* (or instance)
    in Scala, and that value is represented by the `()` symbol. Therefore, this type
    is not meaningful or informative, and we use it as a functionâ€™s return type
    when we have no interest in that return type.


    ## Using â€˜ifâ€™ as an expression


    As mentioned, `if`, `match`, `for`, and `try` can all be used as expressions.
    In regards to `if`, this means that `if`/`then`/`else` yields a result:


    `val c = if a < b then a else b`


    That code can be read as, â€œIf `a` is less than `b`, assign the value of `a`
    to `c`. If not, assign the value of `b` to `c`.â€ Because `if`/`then`/`else` is
    an expression that returns a value, itâ€™s also commonly used as the body of a
    function:


    `def min(a: Int, b: Int): Int =`


    `    if a < b then a else b`


    That code defines a function named `min` that returns the minimum value of the
    two integer parameters that are passed into it, `a` and `b`.


    ## Other constructs as expressions


    Okay, while Iâ€™m in the neighborhood, letâ€™s look at how Scalaâ€™s other constructs
    can be used as expressions. This example shows how a `match` expression yields
    a value:


    `val evenOrOdd: String = i match`


    `    case 1 | 3 | 5 | 7 | 9  => "odd"`


    `    case 2 | 4 | 6 | 8 | 10 => "even"`


    Hereâ€™s a `for` expression that yields a value:


    `val result =`


    `    for`


    `        i <- 1 to 10`


    `        if i > 5`


    `    yield`


    `        i`


    If youâ€™re not familiar with that syntax, when that `for` expression is run,
    `result` will hold this value:


    `Vector(6, 7, 8, 9, 10)`


    > `Vector` is a specific type of Scala sequence â€” child of `Seq` â€” that has
    high-performance characteristics, and is commonly used in Scala.


    When you first start with Scala you may prefer to explicitly declare `result`â€™s
    data type, like this:


    `val result: Seq[Int] =    // explicitly declare resultâ€™s type`


    `    for`


    `        i <- 1 to 10`


    `        if i > 5`


    `    yield`


    `        i`


    Notice that I added the type `Seq[Int]` after the `result` variable. Scala can
    usually figure those types out *implicitly*, but if you think the code is easier
    to read with the data type shown *explicitly*, by all means, add it.


    Lastly, even `try`/`catch`/`finally` blocks are used to write expressions:


    `def makeInt(s: String): Int =`


    `    try`


    `        s.toInt`


    `    catch`


    `        case e: Exception => 0`


    `    finally`


    `        // do whatever you need to do here`


    Note that this is NOT a recommended way to write this function â€” returning `0`
    when you get an exception is wrong, and I show better ways to write it shortly
    â€” but this does show that `try`/`catch`/`finally` yields a value. You can use
    this `makeInt` function like this:


    `makeInt("11")       // 11`


    `makeInt("eleven")   // 0`


    ## What EOP code looks like


    As I show in the [Scala Cookbook](https://amzn.to/3du1pMR), when you write code
    using EOP, your code becomes easy to write, easy to read, and easy to test. Itâ€™s
    just a series of expressions that use immutable variables, immutable data structures,
    and pure functions:


    `// a series of expressions`


    `val symbol = "AAPL"`


    `val url    = buildUrl(symbol)`


    `val html   = getUrlContent(url)    // an impure function`


    `val price  = getPrice(html)`


    `val volume = getVolume(html)`


    `val high   = getHigh(html)`'
