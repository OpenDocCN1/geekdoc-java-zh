- fmt: "\nNow that I showed the *preferred* solution, you can also solve this problem\
    \ without `var`s or `null`s like this:\n\n```scala\nimport scala.util.Try\n\n\
    def readFile(filename: String): Try[String] = Try {\n    val source = scala.io.Source.fromFile(filename)\n\
    \    try\n        source.getLines.map(line => s\"$line\\n\").mkString\n    finally\n\
    \        source.close()\n}\n```\n\nThis code is almost identical to the `Using`\
    \ solution, but it relies on you calling the `close` method manually in the `finally`\
    \ section. (I could have shown this solution earlier in the book, but I was trying\
    \ to use constructs that are comfortable to Java and Kotlin developers.)\n\n#\
    \ Appendix H. “Call By-Name” Parameters (and Multiple Parameter Groups)\n\nIf\
    \ you’re interested in how `IO` data types work — or if you’re like me a few years\
    \ ago and wonder, “How can that possibly work?! — one of the keys is that they\
    \ take “Call By-Name” (CBN) input parameters. To me that’s an unusual term, so\
    \ let’s look at what it means before we look at three examples.\n\n## Call By-Value\n\
    \nTo understand CBN parameters, it helps to first know that by default, function\
    \ input parameters are “Call By-Value” (CBV) parameters. The book, *Programming\
    \ Scala* (co-written by Martin Odersky), makes this statement about “by-value”\
    \ parameters:\n\n> “Typically, parameters to functions are by-value parameters;\
    \ that is, the value of the parameter is determined before it is passed to the\
    \ function.”\n\nSo if you pass in a variable named `x` and it has the value `42`,\
    \ the `42` is what’s passed in.\n\n## Call By-Name\n\nConversely, “by-name” parameters\
    \ are quite different than by-value parameters. Rob Norris makes the observation\
    \ that you can think about the two types of parameters like this:\n\n*   A *by-value*\
    \ parameter is like receiving a `val` field; its body is evaluated once, right\
    \ before the parameter is bound to the function.\n*   A *by-name* parameter is\
    \ like receiving a `def` method; its body is evaluated later, whenever it’s used\
    \ inside the function.\n\nHe then says that those statements “aren’t 100% accurate,”\
    \ but I believe they are decent analogies to start with. The important part of\
    \ that second statement is that a by-name parameter is like a `def` function,\
    \ in that nothing happens with that parameter until you reference it inside your\
    \ function. And if that parameter is inside an `if`/`else` expression or `match`\
    \ expression, and its code branch is never reached, that CBN parameter will never\
    \ be executed.\n\nThe book, *Scala Puzzlers*, confirms this when it states that\
    \ by-name parameters are “evaluated only when they are referenced inside the function.”\n\
    \n## Better names for by-name parameters?\n\nAccording to Wikipedia, these terms\
    \ date back to a language named ALGOL 60 (yes, the year 1960). I don’t mean any\
    \ respect to that language, but for me, the term “by-name” isn’t very helpful\
    \ (though I’m sure it had a solid meaning back then).\n\nThese days I find that\
    \ the following terms are more accurate and meaningful:\n\n*   Evaluate on access\n\
    *   Evaluate on use\n*   Evaluate when accessed\n*   Evaluate when referenced\n\
    \nWith any of those phrases you can replace “Evaluate” with words like “Execute”\
    \ or “Run,” if you prefer.\n\nBut, because I can’t go back in time and change\
    \ this term, I’ll continue to use the acronym CBN in this lesson.\n\n## Example\
    \ 1\n\nPerhaps the simplest-possible example of a CBN parameter is this:\n\n```scala\n\
    def exec(blockOfCode: => Unit): Unit =\n    blockOfCode\n```\n\nIn this example,\
    \ `blockOfCode` is a CBN parameter. Notice that the difference between a “normal”\
    \ CBV input parameter and a CBN parameter is the use of the `=>` transformation\
    \ symbol in the parameter’s definition:\n\n```scala\ndef f(param: Int) ...   \
    \   // CBV parameter\ndef f(param: => Int) ...   // CBN parameter\n          \
    \    --\n```\n\nBecause `=>` always means *transform* in Scala, you get the idea\
    \ that `param` is *something* that is transformed into an `Int` in this example.\n\
    \nNow, going back to the `exec` function:\n\n```scala\ndef exec(blockOfCode: =>\
    \ Unit): Unit =\n    blockOfCode\n```\n\nwe say that it’s a function that executes\
    \ the block of code that’s passed into it. The only thing that’s important about\
