    `    else if a == b then`


    `        0`


    `    else`


    `        1`


    `    end if   // this is optional`


    ### for loops


    `for` *loops* are used for side effects, such as printing:


    `// single line:`


    `for i <- ints do println(i)`


    `// multiline:`


    `for`


    `    i <- ints`


    `    if i > 2`


    `do`


    `    println(i)`


    `// optionally close the expression with ''end for'':`


    `for`


    `    i <- ints`


    `    if i > 2`


    `do`


    `    println(i)`


    `end for`


    ### for expressions (for/yield)


    `for` *expressions* are true expressions that yield values:


    `// create a sample list:`


    `val ints = List.range(1, 10)`


    `// write for/yield like this:`


    `val tenX = for i <- ints yield i * 10`


    `// or this:`


    `val tenX = for`


    `    i <- ints`


    `    if i > 5`


    `yield`


    `    i * 10`


    `// or this:`


    `val tenX =`


    `    for`


    `        i <- ints`


    `        if i > 5`


    `    yield`


    `        i * 10`


    ### match expression


    Scala is famous for being a pattern-matching language. As its name implies, `match`
    is an expression that yields a value:


    `val month = i match`


    `    case 1  => "January"`


    `    case 2  => "February"`'
