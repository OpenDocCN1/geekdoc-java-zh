  trans: "\n回到 `sum` 函数，求和算法的单位元（identity element）告诉我递归的停止条件是返回值 `0`：\n\n```scala\n\
    def sum(list: List[Int]): Int = list match\n    case Nil => 0\n```\n\n接下来，我需要添加递归调用。使用\
    \ `match` 表达式实现此操作如下：\n\n```scala\ndef sum(list: List[Int]): Int = list match\n\
    \    case Nil =>\n        0\n    case head :: tail =>\n        head + sum(tail)\n\
    ```\n\n这是它的工作原理：\n\n- 在 `case` 的左侧，我将 `list` 拆分为两个元素：`head`（头部）和 `tail`（尾部）。\n\
    - 注意它们是通过 `::` 符号分隔的。\n- 在处理 `List` 时，这意味着 `head` 是一个包含单个元素（`Int`）的变量，而 `tail`\
    \ 是一个包含列表剩余部分的变量（`List[Int]`）。\n- 此之后，最后这一行代码可以读为：“将 `head` 元素与所有剩余元素的和相”：\n\n\
    ```scala\nhead + sum(tail)\n```\n\n现在，如果你将该函数连同示例 `List[Int]` 粘贴到 REPL 中，你会看到如下结果：\n\
    \n```scala\nscala> sum(List(1,2,3))\nval res0: Int = 6\n```\n\n## 尾递归\n\n当你接触递归时，你也会想学习尾递归（tail\
    \ recursion），如果你在 JVM 上编程，你将确保自己熟悉栈（stacks）和栈帧（frames）。我在我的书中超过 50 页的递归内容涵盖了所有这些内容，函数式编程简化版](https://alvinalexander.com/scala/functional-programming-simplified-book）。\n\
    \n# 37. TDL UI：处理用户输入\n\n现在你已经了解了代码块和递归的背景知识，是时候编写一个循环了，我们在循环中：(a) 提示用户输入，b) 读取该输入，c)\
    \ 处理它，然后再次提示他们。\n\n正如你在我在数据库代码中写的 `delete` 函数中看到的，我使用了 `for` 表达式来处理 `Try` 值。如果你离上次看那段代码有一段时间了，我建议你现在回去看看它是如何运行的，因为我们正要进行类似的操作。\n\
    \n## 循环；输入\n\n现在我们几乎拥有了提示用户并读取其输入所需的所有内容。我们还没有处理其输入的方法，但目前可以对其进行模拟处理。我现在真正想做的是专注于如何创建一个循环，以便我们可以根据用户的意愿留在这个循环中：\n\
    \n1. 提示用户输入\n2. 读取他们的输入\n3. 处理该输入（假设通过调用我们的数据库函数）\n4. 回到步骤 1\n\n由于 `promptUser`\
    \ 和 `readInput` 都返回 `Try` 值，我们在 Scala 中的做法是使用 `for` 表达式执行该循环。到目前为止，我们的主方法开头如下：\n\
    \n```scala\n@main\ndef ToDoList =\n    val datafile = \"./ToDoList.dat\"\n   \
    \ val db = Database(datafile)\n    val processor = InputProcessor(db)\n```\n\n\
    之后，我将在这里定义一个命名为 `mainLoop` 的方法：\n\n```scala\ndef mainLoop(): Try[Unit] = for\n\
    ```\n\n根据过去的经验，我知道 `mainLoop` 不需要任何输入参数，它还将返回一个封装在 `Try` 中的 `Unit`。我稍后会详细解释这一点，但我们现在继续。\n\
    \n## 提示输入\n\n现在我们的心态是正在编写主循环。因此，我们想做的第一件事是提示用户输入，所以我添加了这一行：\n\n```scala\ndef mainLoop():\
    \ Try[Unit] = for\n    _ <- promptUser()\n```\n\n我之前展示过这种语法，所以我只需说这可以读作：“提示用户输入。因为\
    \ `promptUser` 返回的是 `Try` 内部的 `Unit` 值，我不在乎那个值，所以忽略它。”我们在 `<-` 操作符的左侧使用字符 `_`\
    \ 来表示“我不在乎这个值”。\n\n## 读取输入\n\n我们在循环中想做的下一件事是读取用户的输入，所以我把它加进去：\n\n```scala\ndef\
    \ mainLoop(): Try[Unit] = for\n    _ <- promptUser()\n    input <- readInput()\n\
    ```\n\n这会将用户的输入绑定到我命名为 `input` 的变量上。他们在按下 [Enter] 键之前输入的任何内容都将是一个赋值给 `input` 变量的\
    \ `String`。\n\n## 处理输入\n\n接下来，应用程序需要处理用户的输入。正如我在这个待办事项示例的引言中所示，用户输入以下内容来添加一个值为\
    \ `\"Wake up\"` 的新任务：\n\n```text\na Wake up\n```\n\n他们输入以下内容来删除第一个任务：\n\n```text\n\
    d 1\n```\n\n以此此类推；他们使用我们允许的其他命令。\n\n所以现在我们需要某种处理器或处理程序来处理收到的这些字符串。目前我不会实现这个处理器；我只会创建一个具有正确签名的“什么都不做”的函数。\n\
    \n如往常，我开始草拟目标函数的签名。我将此函数命名为 `handleUserInput`，它将接收一个字符串输入：\n\n```scala\ndef handleUserInput(input:\
    \ String)\n```\n\n在此处——为了完成函数签名——你需要稍微思考一下：`handleUserInput` 将接收字符串输入，尝试处理它，并与我们的数据库交互。由于我们的数据库函数都返回\
    \ `Try`，此函数也应该返回 `Try`，所以我加上了：\n\n```scala\ndef handleUserInput(input: String):\
    \ Try\n```\n\n等等，让我们重新检查原文中 `handleUserInput` 的逻辑。原文的签名是碎片化的。我将按照要求将其整合为清晰的结构。\n\
    \n```scala\ndef handleUserInput(input: String): Try[Unit]\n    // ... 实现\n```\n\
    \n实际上，看原文：\n`def handleUserInput(input: String): Try`\n`Unit`\n\n让我们正确格式化签名：\n\
    \n```scala\ndef handleUserInput(input: String): Try[Unit]\n    // todo:\n    println(\"\
    handleUserInput\")\n```\n\n## 回到主函数\n\n现在我们将该函数添加到 `mainLoop` 中，如下：\n\n```scala\n\
    def mainLoop(): Try[Unit] = for\n    _ <- promptUser()\n    input <- readInput()\n\
    \    _ <- {\n        handleUserInput(input)\n        mainLoop()\n    }\nyield\
    \ ()\n```\n\n## 问题\n\n然而，我们现在的问题是，如果现在调用 `main`，它并不会真正循环；它运行一次。它提示用户、读取输入、处理，然后退出。我们仍然需要让循环循环的方法。\n\
    \n当你处理不可变变量时，解决这个问题的方法几乎相同：递归。在我们的 `for` 表达式中，我们只需要调用 `main`，让它再次自调用。我将格式化该代码使其看起来像这样：\n\
    \n```scala\ndef mainLoop(): Try[Unit] = for\n    _ <- promptUser()\n    input\
    \ <- readInput()\n    _ <- {\n        handleUserInput(input)\n        mainLoop()\n\
    \    }\nyield ()\n```\n\n你可以用不同的方式格式化它，但重要的是这段代码：\n\n```scala\n_ <- {\n    handleUserInput(input)\n\
    \    mainLoop()\n}\n```\n\n正是我们需要的。\n\n"
- fmt: "\ncan be read as, \"Everything inside the curly braces is one block of code.\
    \ Inside that block, first handle the user’s input. Then, when that function returns,\
    \ call `mainLoop` again.\"\n\nSo now `mainLoop` is called again, and it starts\
    \ a `for` expression, and it’s first step is to prompt the user again for their\
    \ input.\n\nAnd this is a key thing to know:\n\n> When you’re working with immutable\
    \ variables and need to perform a loop, you use recursion instead.\n\nIn other\
    \ \"looping\" situations you can use Scala’s collections methods instead of recursion,\
    \ but for a situation like this, recursion is the answer.\n\n## The complete 'main'\
    \ code\n\nNow we can look at the complete main method. The only thing new that\
    \ I add to it here is an initial call to `mainLoop` to get things running. I note\
    \ this with a comment near the bottom of this code.\n\n```scala\n@main\n\ndef\
    \ ToDoList =\n    val db = Database(\"./ToDoList.dat\")\n    val processor = InputProcessor(db)\n\
    \    def mainLoop(): Try[Unit] =\n        for\n            _     <- promptUser()\n\
    \            input <- readInput()\n            _     <- {\n                  \
    \      handleUserInput(input)\n                        mainLoop()\n          \
    \          }\n     yield\n        ()\n    // this starts the application running:\n\
    \    mainLoop()\nend ToDoList\n```\n\nNotice that I define `mainLoop` inside the\
    \ `ToDoList` function, which is our application’s \"main method.\" It’s not necessary\
    \ to define `mainLoop` inside `ToDoList`, but I do it just to show you another\
    \ thing you can do with Scala.\n\nThe way this code works is:\n\n* Scala sees\
    \ `@main` before the `ToDoList` method, and recognizes it as a main method\n*\
    \ A main method is the entry point to the application, so this function starts\
    \ running\n* The first couple of lines are read\n* The `mainLoop` function definition\
    \ is read\n* The `mainLoop` function is run as the last line of `ToDoList`, and\
    \ this starts the process of prompting the user and reading their input\n\nAnd\
    \ now that we have a loop, we can go back to work on processing the user’s input.\n\
    \n# 38. An InputProcessor Class\n\nBecause \"input processing\" can be thought\
    \ of as one thing — one concept — I’ll create an `InputProcessor` class to handle\
    \ all input processing:\n\n```scala\nclass InputProcessor\n```\n\nAlso, because\
    \ I know that this code is going to need my database functions, I’ll add that\
    \ as a constructor parameter:\n\n```scala\nclass InputProcessor(db: Database)\n\
    ```\n\nAnd because I know that the database functions return the `Try` error-handling\
    \ data type, I add that `import` statement to my code:\n\n```scala\nimport scala.util.{Try,\
    \ Success, Failure}\n\nclass InputProcessor(db: Database)\n```\n\n## Handling\
    \ user input\n\nSo what we need now is a `handleUserInput` function. I created\
    \ that dummy one earlier that just has a `println` statement, but now I’ll show\
    \ what it really needs to do, as I put it inside the `InputProcessor` class:\n\
    \n```scala\nclass InputProcessor(db: Database):\n    def handleUserInput(input:\
    \ String): Try[Unit] = input match\n        case \"q\" =>\n            ???\n \
    \       case \"h\" =>\n            ???\n        case \"v\" | \"l\" =>\n      \
    \      ???\n        case add if add.startsWith(\"a \") =>\n            ???\n \
    \       case del if del.startsWith(\"d \") =>\n            ???\n        case _\
    \ =>\n            ???\n    end handleUserInput\n    // more code ...\nend InputProcessor\n\
    ```\n\nAs shown, my plan is to handle the processing of the different commands\
    \ the user can enter with a `match` expression. Inside that expression, each `case`\
    \ handles a different command the user can enter (NOTE: there are other ways to\
    \ handle this, but I’m trying to keep the code simple.).\n\nSo now the next task\
    \ is to implement the code for each of those cases (Or `match` expressions are\
    \ used in Scala to implement pattern matching.)\n\n> One thing to make here is\
    \ that the `InputProcessor` class has the `db` constructor parameter — which is\
    \ an instance of `Database` class — all of these functions have access to that\
    \ `db` parameter. Furthermore, that instance is completely initialized in the\
    \ main method before it’s passed into this class.\n\n# 39. TDL UI: Implementing\
    \ handleUserInput\n\nNow that we know we want a `handleUserInput` function, let’s\
    \ start working on it. As usual I begin with a sketch of the function’s signature,\
    \ which we know from the lesson:\n\n`def handleUserInput(input: String): Try[Unit]`\n\
    \nWhat this function needs to do is to branch off into different directions based\
    \ on the user input. As I showed in the introduction to To-Do List, is written\
    \ to accept these commands:\n\n* `q`, to quit\n* `a`, to add a new item\n* `d`,\
    \ to delete an item\n* `h`, to show help\n* `v` or `l` (lowercase `L`), to list\
    \ items\n\nIn other languages you might handle this with an `if`/then`/else` structure,\
    \ and in Scala you can do that, but there’s also a different way: a `match` expression.\
    \ `match` expressions let you perform pattern matching on a given value, and the\
    \ way it works when you use `match` as the body of a function is that you start\
    \ like this: `def handleUserInput(input: String): Try[Unit] = input match`\n\n\
    This is a way of saying, \"We’re about to perform some pattern matching on the\
    \ `input` variable.\"\n\nWhat you do then is start writing the `cases` that you\
    \ want to match. For our function we know what strings we want to match against,\
    \ so I sketch those cases like this:\n\n```scala\ndef handleUserInput(input: String):\
    \ Try[Unit] = input match\n    case \"q\" =>\n        ???\n    case \"h\" =>\n\
    \        ???\n    case \"v\" | \"l\" =>\n        ???\n    case add if add.startsWith(\"\
    a \") =>\n        ???\n    case del if del.startsWith(\"d \") =>\n        ???\n\
    \    case _ =>\n        ???\n```\n\nBelieve it or not, that’s actually the complete\
    \ function body, except that we now need to fill in those `???` areas.\n\n## Explaining\
    \ the cases\n\nHere’s a brief discussion of each `case`. These first two cases\
    \ are the simplest, and they can be read as, \"When you see this exact string,\
    \ do the thing on the right side of the `=>` symbol\":\n\n```scala\ncase \"q\"\
    \ =>\ncase \"h\" =>\n```\n\nSo if `input` is a `\"q\"`, do the first thing, but\
    \ if it’s an `\"h\"`, do the second thing.\n\n> Just as in other programming languages,\
    \ strings like `\"q\"` and `\"h\"` are called string literals.\n\nThe third case\
    \ is similar to the first two, except this one can be read as, \"If `input` is\
    \ a `\"v\"` or an `\"l\", do the thing on the right side of the `=>` symbol\"\
    :\n\n```scala\ncase \"v\" | \"l\" =>\n```\n\nWith this syntax you can string together\
    \ as many alternatives as you want, so if you also want to accept an `\"s\"` (for\
    \ \"show\"), write this:\n\n```scala\ncase \"v\" | \"l\" | \"s\" =>\n```\n\nIn\
    \ the next pattern, things get more interesting:\n\n`case add if add.startsWith(\"\
    a \") =>`\n\nThis isn’t a perfect use-case for this syntax, but for now you can\
    \ read it as, \"Create a variable named `add` from the variable `input`, and if\
    \ the string `add` starts with the letter `a` followed by a blank space, do the\
    \ thing on the right side of the `=>` symbol.\" And then you use the variable\
    \ `add` on the right side of the expression.\n\nWhere this syntax really shines\
    \ is when you create an expression that makes `add` different from `input`. I\
    \ don’t have a need to do that here, but I wanted to show this as another technique\
    \ for Scala tool belt.\n\n```scala\ncase del if del.startsWith(\"d \") =>\n```\n\
    \nThe final `case` looks like this, and it means \"match everything else\":\n\n\
    ```scala\ncase _ =>\n```\n\nSo if `input` doesn’t match any of the previous cases,\
    \ control comes to this `case`, and whatever is on the right side of this `=>`\
    \ symbol is what gets executed. It’s a \"catch all\" `case`, and in our code,\
    \ when the user types anything other than the allowed commands, control comes\
    \ here.\n"
