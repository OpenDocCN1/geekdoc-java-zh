    you can think of `IO` as being like `Try` or `Either`: itâ€™s a type you want
    to use when you communicate with the outside world, or run any other side effect.
    So wherever I have function signatures like this in this book:


    `def readFile(f: String): Try[String]`


    `def writeFile(s: String): Try[Unit]`


    conceptually, you can replace those `Try` types with the `IO` type:


    `def readFile(f: String): IO[String]`


    `def writeFile(s: String): IO[Unit]`


