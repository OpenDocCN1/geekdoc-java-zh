    Frankly, I wrote Java code like this for almost fifteen years, and didnâ€™t even
    know there was another way to write code.


    ### Laziness helps with RT


    What laziness does for us is that it lets us keep thinking of our code as algebra
    or a blueprint. We know that weâ€™re working with an `IO` of a specific type â€”
    such as an `IO[String]` â€” and then we merrily keep creating our blueprint, because
