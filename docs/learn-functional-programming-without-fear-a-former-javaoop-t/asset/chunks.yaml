  trans: "\n\n那么第三个参数组是调用者在两个测试条件都为 `true` 时想要运行的代码块。在我的情况下，我要求它返回 `Unit`，以保持简单：\n\
    \n```scala\ndef doubleIf(test1: => Boolean)(test2: => Boolean)(codeBlock: => Unit)\n\
    ```\n\n最后，函数体部分表示：“如果两个测试条件都为 `true`，则运行该代码块”：\n\n```scala\n// 为了适应书籍的页宽，将 test1\
    \ 和 test2 缩写为 t1 和 t2\ndef doubleIf(t1: => Boolean)(t2: => Boolean)(codeBlock:\
    \ => Unit): Unit =\n    if t1 && t2 then codeBlock\n```\n\n现在，如果你将以下代码放入 REPL\
    \ 中运行，你会看到打印出了“Discount!”文本的文本：\n\n```scala\nval age = 20\nval numAccidents =\
    \ 0\ndoubleIf(age > 18)(numAccidents == 0) {\n    println(\"Discount!\")\n}\n\
    ```\n\n但如果这两个条件都不为 `true`，你会发现“Discount!”*没有*被打印。\n\n正如我希望这个例子所展示的，CBN（按需计算）结合多个参数组赋予了你创建自己的控制结构的能力，并最终创建你自己的\
    \ DSL（领域特定语言）。\n\n## 关键点\n\n快速回顾一下，这些是关于 CBN 的一些关键点：\n\n- 你使用 `=>` 符号来定义它们\n-\
    \ 你必须指定它们的返回类型\n- 在你在函数中调用它们之前，它们不会执行\n- 可以在函数的任何地方调用它们\n- 可以在函数中被多次调用\n- 与多个参数组结合，它们允许我们编写自己的控制结构和\
    \ DSL\n\n# 附录 I. 术语表\n\n本术语表包含了书中术语的“简单”描述，以及你在 FP（函数式编程）世界中会听到的其他术语。（我说的“简单”是指不过太技术化或太数学化。）\n\
    \n**代数替换，替换模型 (algebraic substitution, substitution model)**\n意味着你可以用结果结果替换函数调用，就像写代数一样。\n\
    \n**匿名函数，lambda (anonymous functions, lambda)**\n在 Scala 中，匿名函数（或 `lambda`）是一个*没有绑定到变量的*函数定义。这些通常是传递到其他函数的小代码块，例如在调用\
    \ `map` 或 `filter` 时。\n\n**组合，组合，组合器 (compose, composition, combinator)**\n在 FP\
    \ 中，我们说通过将纯函数和表达式等代码组合来*组合*解决方案。其中的关键是，为了让我们能够组合它们，一个函数的输出必须与另一个函数的输入匹配。你可以将其比比类似于编写一个\
    \ Unix 命令流水线，例如 `ps aux grep root wc -l`。\n\n**确定性的 (deterministic)**\n与引用透明性非常相似（如果不是的话），如果一个函数对于给定的输入总是产生相同的输出，该函数就是确定性的。\n\
    \n**副作用，有副作用的 (effect, effectful)**\n（见下文。）\n\n**面向表达式的编程 (expression-oriented\
    \ programming, EOP)**\n一种使用*表达式*而不是*语句*的编程技术，其中*表达式*是一个返回结果的代码块，且没有副作用。\n\n**自由变量\
    \ (free variable)**\n自由变量就是我所说的、通过“侧门”进入函数的变量。它不是在函数签名（正门）中声明的正式函数输入参数。\n\n**泛子\
    \ (functor)**\n我没有在书中讨论泛子，但 *Scala 中的泛子*基本上就是一个正确实现了 `map` 方法的类。（这远不止于此，但从实践角度来看，这是一个关键方面。）\n\
    \n**高阶函数 (higher-order function)**\n一种 (a) 接收一个函数作为输入参数，或 (b) 返回一个函数作为结果的函数。\n\
    \n**幂等的，幂等性 (idempotent, idempotence)**\n与*确定性*和*引用透明性*术语类似，如果一个函数对于给定的输入执行多次的结果与对相同输入执行一次的结果相同，则称该函数是幂等的。\n\
    \n**单元 (monad)**\n*Scala 中的单元*基本上就是一个实现了 `map` 和 `flatMap` 方法的类，而且，在正确实现的情况下，这两个方法让你允许你在\
    \ `for` 表达式的一系列步骤中使用该类的实例。（再次，这还有更多。）`List`、`Vector`、`Option`、`Try` 和 `Either`\
    \ 都是单元。*在任何 FP 语言中*，单元保证让你能够顺序地组合副作用，例如通过 `flatMap` 和 `for` 表达式。（更多信息见下文。）\n\n\
    **纯函数 (pure function)**\n（见下文。）\n\n**引用透明性 (referential transparency)**\n如果一个表达式可以替换为它的结果值而不改变程序的行为，则该表达式是引用透明的。\n\
    \n## Effect, effectful（副作用，有副作用的）\n\n我不认为 *effect*（副作用）和 *effectful* 这两个术语有标准的定义。有些人认为，如果一个函数有副作用（例如处理\
    \ I/O），它是有副作用的。\n\n在我的博客文章 [函数编程中的“effect”和“effectful”意味着什么？](https://alvinalexander.com/scala/what-effects-effectful-mean-in-functional-programming/)\
    \ 中，我写了一些不同的内容，这是从书籍 [函数式响应领域建模](https://amzn.to/2uYGevc) 中学到的。基于那本书，在我的博客文章中以及你在书中看到的，我做出了以下陈述：\n\
    \n- `Option` 建模了*可选性*（某些结果是可选的）副作用\n- `Try` 和 `Either` 建模了*失败*副作用\n- `Future`\
    \ 建模了*延迟*副作用\n\n另一个例子是，如果 `IO` 类型只处理 I/O，我们可以说它“建模了副作用。”然而，如前所述，IO 类型的力量远不止于此。）\n\
    \n从这些例子我们可以说副作用是*类型处理的*：当你看到 `Option` 作为函数类型时，你立即认为结果是可选的；当你看到 `Try` 时，你知道可能会出错；以此此类推。\n\
    \n除了这些之外，在各种 ZIO 文档和课程中强调的一点是，副作用是一个可以产生副作用的*蓝图*，正因为它只是蓝图，所以什么都不会立即发生。\n\n同样，Cats\
    \ Effect 文档](https://typelevel.org/cats-effect/docs/concepts) 规定：“副作用是在评估发生时将采取的动作（或动作）的描述。”\n\
    \n在 Scala 之前，我的背景是工程师、Unix 管理员，然后 Java 程序员。所以当我开始学习 Scala 时，我不知道的是 `Future` 类型并不符合这种描述，因为你一旦调用它的构造函数，它就会运行；它没有将描述与执行分离。因此\
    \ (a) `Future` 是一个不是副作用的良好例子，而 (b) FP 人员创建了其他类型（如 `IO` 和 `ZIO`）来替代 `Future`。\n\
    \nCats Effect 和 ZIO 处理的常见副作用有：\n\n- 并发\n- 错误处理\n- 资源安全（处理 I/O 时关闭资源）\n- 流式\n-\
    \ 追踪/故障排除\n\n> 现在是时候明确一下*类型*是像 `Int` 或 `Option` 这样的，而*值*是像 `1` 或 `Some(\"foo\"\
    )` 这样的。\n\n## Monads（示例）\n\n我之前讨论过单元，并在那里提到 `Option` 是一个单元。在 Scala 中，单元基本上是一个正确实现了\
    \ `map` 和 `flatMap` 方法的类型，以便用于 `for` 表达式。对于 `Option`，这特别意味着我们可以在 `for` 表达式中顺序组合副作用，这些副作用是为了为建模可选性概念而创建的。\n\
    \n"
- fmt: "\nTo demonstrate what I mean, here’s an example of using multiple `Option`\
    \ values in sequence inside a `for` expression. First, here are three functions\
    \ that return `Option` values that contain different types (`Int`, `Double`, and\
    \ `String`):\n\n```scala\ndef fInt(): Option[Int] = Some(1)\ndef fDouble(): Option[Double]\
    \ = Some(1.1)\ndef fString(): Option[String] = Some(\"alvin\")\n```\n\nNext, this\
    \ code shows how you execute those operations in sequence in a `for` expression:\n\
    \n```scala\nval x = for\n    a <- fInt()\n    b <- fDouble()\n    c <- fString()\n\
    yield\n    (a, b, c)   // a tuple with three elements\n```\n\nIf you run that\
    \ code in the REPL, you’ll see that `x` has this type and value:\n\n```text\n\
    x: Option[(Int, Double, String)] = Some((1,1.1,alvin))\n   -----------------------------\
    \   -------------------\n             x’s type                    x’s value\n\
    ```\n\nAs I show in the Monad lesson, you *could* write that code using a sequence\
    \ of `flatMap` calls, but `for` expressions are typically easier for humans to\
    \ read. But for the purpose of this glossary, my key points are (a) `Option` is\
    \ a monad, because it is written to have `map` and `flatMap` methods that make\
    \ is usable in `for` expressions, and (b) therefore, we can combine a series of\
    \ `Option` values inside `for` expressions.\n\nIf you’d like to experiment with\
    \ this example, you can also simplify it like this:\n\n```scala\nval x = for\n\
    \    a <- Some(1)\n    b <- Some(1.1)\n    c <- Some(\"alvin\")\nyield\n    (a,\
    \ b, c)\n```\n\n## Pure functions\n\nYou’ll find a surprising number of different\
    \ definitions of pure functions on the internet, but to me, a *pure function*\
    \ is a function:\n\n- Whose only parameters from the outside world are the input\
    \ parameters that are defined in its function signature. (I refer to the list\
    \ of input parameters as a function’s *front door*.)\n- That does not modify those\
    \ input parameters.\n- That does not modify other “hidden” variables that might\
    \ be accessed through side doors (*free* variables), such as mutable variables\
    \ in its class or any other global variables.\n- That does not communicate with\
    \ the outside world. It has no I/O whatsoever: no file access, no internet access,\
    \ no database access, no quantum entanglement, nothing.\n- That always returns\
    \ the same output when its given the same input. For example, `sum(2, 2)` is always\
    \ `4`.\n- That returns output for all possible input values.\n- That does not\
    \ throw exceptions.\n\nBecause of those last two attributes, FPers say that a\
    \ function is *total*, meaning that it always returns a value. FPers also use\
    \ terms like referential transparency, deterministic, and idempotent to describe\
    \ pure functions.\n\n![](images/00003.jpg)\n"
