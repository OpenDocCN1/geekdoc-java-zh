  trans: "\n回到我们的字数计数应用程序，我们的老板刚刚过来告诉我们，我们得到的不是一个代表文档的 `String`，而是一个包含该文档的文件名的 `String`。\n\
    \n任何有经验的开发者都知道，当你编写某些函数时，可能会出错。当你开始处理文件 I/O、网络 I/O 和数据库 I/O 时情况尤其如此。在这个世界里，文件可能是不可读的，网络可能会中断，服务器可能会宕机等，这些情况必须在考虑范围内。\n\
    \n在其他编程语言中编写这些函数时，你可能会抛出异常或返回空值，但在 Scala 中我们不做这些事情。如所述，我们使用*错误处理数据类型*。\n\n> 正如我多年前[在这篇博客文章](https://alvinalexander.com/scala/best-practice-eliminate-null-values-from-code-scala-idioms/)中所写的那，`null`\
    \ 引用的发明者 Tony Hoare 在追溯到 1965 年将 `null` 值的创建称为他的“十亿美元错误”。\n\n## 一个更简单的问题：将 String\
    \ 转换为 Int\n\n我会把字数计数应用程序再推迟一会儿，相反我想处理一个稍微简单一点的问题。我将展示如何*安全地*将一个 `String` 转换为 `Int`。这是一个相对简单的问题，所以我们可以专注于我们的错误处理类型，而不是丢失的文件或宕机的服务器。（我们会在书的后部分处理这些问题。）\n\
    \n所以，将 `String` 转换为 `Int` 的问题在于，它有时成功，有时却失败。当它失败时，过程会抛出一个异常。Scala REPL 展示了该过程如何成功以及如何失败：\n\
    \n```\nscala> \"1\".toInt\nval res0: Int = 1\n\nscala> \"one\".toInt\njava.lang.NumberFormatException:\
    \ For input string: \"one\"\n```\n\n在第一个示例中，字符串正确地表示了一个整数—— `\"1\"`——所以转换过程成功了。但在第二个示例中，当字符串无法转换为整数时，过程因\
    \ `NumberFormatException` 而崩溃了。\n\n代码崩溃是很糟糕的。当你的方程可能会爆炸时，你无法编写代数算式。\n\n## 第一次尝试\n\
    \n如果我们*没有*错误处理类型，我们可能会首先尝试写如下这样的 `makeInt` 函数：\n\n```scala\ndef makeInt(s: String):\
    \ Int =\n    try\n        s.toInt\n    catch\n        case e: NumberFormatException\
    \ => 0\n```\n\n该函数始终返回一个 `Int`，但问题是它在所有实例中都不是准确的。例如，所有这些函数调用都会返回 `0`，这是不正确的：\n\
    \n```\nmakeInt(\"0\")\nmakeInt(\"\")\nmakeInt(\"one\")\n```\n\n在第一个示例中，返回的值是正确的，但在第二个和第三个示例中，`0`\
    \ 不是答案。那么，正确的解决方案是什么？\n\n## 正确的解决方案\n\n这就是 Scala 的错误处理数据类型大显身场的地方。与其返回一个 `Int`，正确的方法是让它返回一个*封装*了成功或失败可能的数据类型。如，我想先处理\
    \ `Option` 类型以及它的子类型 `Some` 和 `None`。\n\n通用的解决方案是：(a) 定义你的函数返回一个 `Option`，该类型包装了你的函数在成功时产出的类型——在本例中是\
    \ `Int`。然后在函数体中，你 (b) 对于*成功*情况返回一个 `Some`，并在 (c) 对于*失败*情况返回一个 `None`：\n\n```scala\n\
    def makeInt(s: String): Option[Int] =\n    try\n        Some(s.toInt)\n    catch\n\
    \        case e: NumberFormatException => None\n```\n\n如所示，`Some` 包装了你能够成功计算的数据类型，而在错误情况下，你返回一个\
    \ `None`。（`None` 类型不包含任何内容，它只是向你函数的调用者指示出了某些问题。）\n\n当你调用该函数时，你将看到 `Some` 和 `None`\
    \ 类型作为它的返回值：\n\n```scala\n// 成功案例\nmakeInt(\"1\")      // Some(1)\nmakeInt(\"\
    2\")      // Some(2)\n\n// 失败案例\nmakeInt(\"\")       // None\nmakeInt(\"one\"\
    )    // None\n```\n\n该解决方案的关键是 `Option` 是基础类型，而 `Some` 和 `None` 是它的子类型：\n\n```\n\
    \  Option\n  / \\\nSome None\n```\n\n所以你声明该函数返回父类型：`Option`，或者在本例中具体为 `Option[Int]`。然后函数体返回其子类型：成功情况返回\
    \ `Some`，失败情况返回 `None`。当你写这个函数时，这就是你需要做的所有。\n\n## 使用该函数\n\n现在 `makeInt` 写成了这样，硬币的另一面问题是：“作为此函数的调用者，我该如何处理这种类型？”\n\
    \n### 模式匹配\n\n处理 `Option` 的常见方法之一是在 `match` 表达式中使用*模式匹配*：\n\n```scala\nmakeInt(s)\
    \ match\n    case Some(i) => println(s\"转换成功！i = $i\")\n    case None    => println(\"\
    转换失败.\")\n```\n\n如所示，`match` 表达式允许你处理两种可能的情况，`Some` 和 `None`。当你处理 `Some` 时，你可以从从中提取出\
    \ `Int`，而当你处理 `None` 时，它只是一个指示，说明出了某些问题。\n\n### for 表达式\n\n使用该函数的另一种常用方法是把它放在\
    \ `for` 表达式中，特别是当你有多个函数调用时。这段代码展示了当字符串可以转换为整数的结果：\n\n```scala\nval maybeSum: Option[Int]\
    \ =\n    for\n        i <- makeInt(\"1\")\n        j <- makeInt(\"2\")\n     \
    \   k <- makeInt(\"3\")\n    yield\n        i + j + k\n// 结果：maybeSum == Some(6)\n\
    ```\n\n有些开发者喜欢在接收错误处理类型时使用“maybe”（可能）这个词，因为值“可能”是一个成功类型，也可能不是。接下，这段*完全相同的代码*展示了当一个或多个字符串无法转换为整数时的情况：\n\
    \n```scala\nval maybeSum: Option[Int] =\n    for\n        i <- makeInt(\"1\")\n\
    \        j <- makeInt(\"Hi!\")\n        k <- makeInt(\"3\")\n    yield\n     \
    \   i + j + k\n// 结果：maybeSum == None\n```\n\n如所示，在这种情况下，`maybeSum` 是 `None` 而不是\
    \ `Some`。然而，注意在这一点上你并不关心是否失败了，你只需要像所示那样编写代码，它处理了成功和失败两种情况。\n\n## 纯函数不能撒谎\n\n在继续之前，关于纯函数的签名，值得再次这一点：*它们不能撒谎*。\n\
    \n正如你在这个示例中所看到的，`makeInt` 函数清晰地大喊着：“如果一切顺利，我会给你一个 `Int`，但请注意这里可能会出问题”：\n\n```scala\n\
    def makeInt(s: String): Option[Int] = ???\n```\n\n每当你看到 `Option` 作为纯函数的返回类型时，你就知道该函数内部可能会出问题。\n\
    \n"
- fmt: "\n## makeInt can be more concise\n\nFor those who know Scala, I want to note\
    \ that yes, `makeInt` can be written more concisely. But for the purpose of these\
    \ lessons, I’m using this longer form. (I’ll show the shorter form later.)\n\n\
    # 20. FEH: Try\n\nNow that you’ve seen how `Option` works, let’s look at `Try`\
    \ as an alternative to `Option`.\n\n`Try` is almost the same as `Option`, but\
    \ it lets you return a more meaningful error value. This helps the function caller\
    \ understand what went wrong inside the function.\n\nJust as `Option` has two\
    \ sub-types, `Try` has two sub-types — `Success` and `Failure` — and the two sets\
    \ of data types compare like this:\n\n`Option <=> Try`\n`Some <=> Success`\n`None\
    \ <=> Failure`\n\nSo basically anywhere you used `Option` before, you can also\
    \ use `Try`. And where you used `Some` you now use `Success`, and instead of `None`\
    \ you use `Failure`.\n\nBut the big difference is that when things go wrong, `Failure`\
    \ contains an exception — the exception that occured inside the function. This\
    \ is your function’s way to tell callers exactly what went wrong inside the function.\
    \ Because of this, `Try` is generally more useful than `Option` when working with\
    \ I/O functions.\n\nLet’s see what this looks like.\n\n## Try/Success/Failure\n\
    \nHere’s a new version of `makeInt` that uses `Try` instead of `Option`:\n\n```scala\n\
    // you must first import these types:\nimport scala.util.{Try, Success, Failure}\n\
    \ndef makeInt(s: String): Try[Int] =\n    try\n        Success(s.toInt)\n    catch\n\
    \        case e: NumberFormatException => Failure(e)\n```\n\nNow when you call\
    \ `makeInt`, you’ll see these results in the success and failure cases:\n\n```scala\n\
    // success case\nmakeInt(\"1\")      // Success(1)\n// failure case\nmakeInt(\"\
    one\")    // Failure(java.lang.NumberFormatException:\n                      \
    \                For input string: \"one\")\n```\n\nAs shown:\n\n- You get a `Success`\
    \ back when the conversion works. `Success` is a wrapper that contains the `Int`.\n\
