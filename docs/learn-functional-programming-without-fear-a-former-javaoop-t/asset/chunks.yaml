    As shown, my plan is to handle the processing of the different commands the user
    can enter with a `match` expression. Inside that expression, each `case` handles
    a different command the user can enter.


    (NOTE: There are other ways to handle this, but Iâ€™m trying to keep the code
    simple.)


    So now the next task is to implement the code for each of those cases. (Or *patterns*,
    because `match` expressions are used in Scala to implement *pattern matching*.)


    > One thing to make clear here is that because the `InputProcessor` class has
    the `db` constructor parameter â€” which is an instance of my `Database` class
    â€” all of these functions will have access to that `db` parameter. Furthermore,
    that instance is completely initialized in the main method before itâ€™s passed
    into this class.


    # 39\. TDL UI: Implementing handleUserInput


    Now that we know that we want a `handleUserInput` function, letâ€™s start working
    on it. As usual I begin with a sketch of the functionâ€™s signature, which we
    know from the last lesson:


    `def handleUserInput(input: String): Try[Unit]`


    What this function needs to do is to branch off into different directions based
    on the user input. As I showed in the introduction to the To-Do List app, it is
    written to accept these commands:


    *   `q`, to quit


    *   `a`, to add a new item


    *   `d`, to delete an item


    *   `h`, to show help


    *   `v` or `l` (lowercase `L`), to list items


    In other languages you might handle this situation with an `if`/`then`/`else`
    structure, and in Scala you *can* do that, but thereâ€™s also a different way:
    a `match` expression.


    `match` expressions let you perform *pattern matching* on a given value, and the
    way it works when you use `match` as the body of a function is that you start
    like this:


    `def handleUserInput(input: String): Try[Unit] = input match`


    `                                                -----------`


    This is a way of saying, â€œWeâ€™re about to perform some pattern matching on
    the `input` variable.â€


    What you do then is start writing the *cases* that you want to match. For our
    function we know what strings we want to match against, so I sketch those cases
    like this:


    `def handleUserInput(input: String): Try[Unit] = input match`


    `    case "q" =>`


    `        ???`


    `    case "h" =>`


    `        ???`


    `    case "v" | "l" =>`


    `        ???`


    `    case add if add.startsWith("a ") =>`


    `        ???`


    `    case del if del.startsWith("d ") =>`


    `        ???`


    `    case _ =>`


    `        ???`


    Believe it or not, thatâ€™s actually the complete function body, except that we
    now need to fill in those `???` areas.


    ## Explaining the cases


    Hereâ€™s a brief discussion of each `case`. These first two cases are the simplest,
    and they can be read as, â€œWhen you see this exact string, do the thing on the
    right side of the `=>` symbolâ€:


    `case "q" =>`


    `case "h" =>`


    So if `input` is a `"q"`, do the first thing, but if itâ€™s an `"h"`, do the second
    thing.


    > Just as in other programming languages, strings like `"q"` and `"h"` are called
    string literals.


    The third case is similar to the first two, except this one can be read as, â€œIf
    `input` is a `"v"` *or* an `"l"`, do the thing on the right side of the `=>` symbolâ€:


    `case "v" | "l" =>`


    With this syntax you can string together as many alternatives as you want, so
    if you also want to accept an `"s"` (for â€œshowâ€), write this:


    `case "v" | "l" | "s" =>`


    In the next pattern, things get more interesting:


    `case add if add.startsWith("a ") =>`


    This isnâ€™t a perfect use-case for this syntax, but for now you can read it as,
    â€œCreate a variable named `add` from the variable `input`, and if the string
    `add` starts with the letter `a` followed by a blank space, do the thing on the
    right side of the `=>` symbol.â€ And then you use the variable `add` on the right
    side of the expression.


    Where this syntax really shines is when you create an expression that makes `add`
    different from `input`. I donâ€™t have a need to do that here, but I wanted to
    show this as another technique for Scala tool belt.


    And then I use the same technique for the next `case` as well:


    `case del if del.startsWith("d ") =>`


    The final `case` looks like this, and it means â€œmatch everything elseâ€:


    `case _ =>`


    So if `input` doesnâ€™t match any of the previous cases, control comes to this
    `case`, and whatever is on the right side of this `=>` symbol is what gets executed.
    Itâ€™s a â€œcatch allâ€ `case`, and in our code, when they user types anything
    other than the allowed commands, control comes here.'
