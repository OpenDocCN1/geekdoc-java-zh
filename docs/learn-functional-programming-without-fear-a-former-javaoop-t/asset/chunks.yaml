    And this code shows what the Unhappy Path looks like when one or more strings
    *canâ€™t* be converted to integers:


    `val maybeSum: Either[Exception, Int] =`


    `    for`


    `        i <- makeInt("1")`


    `        j <- makeInt("Hi mom!")`


    `        k <- makeInt("3")`


    `    yield`


    `        i + j + k`


    `// result:`


    `maybeSum == Left(java.lang.NumberFormatException: For input string: "Hi mom!")`


    Here, `maybeSum` is a `Left`, and it contains that `NumberFormatException`.


    And just like `Option` and `Try`, whether you get a `Right` or `Left` back from
    the `for` expression, you can handle its result in a `match` expression:


    `maybeSum match`


    `    case Right(i) => println(s"Success: i = $i")`


    `    case Left(e)  => println(s"Failed: msg = ${e.getMessage}")`


    Notice that when you use `Either`, both `Right` and `Left` are containers that
    contain the success value and error value, respectively.


    ## Reading an Either signature


    In the second version of the `makeInt` function, the return value `Either[Exception,
    Int]` can read as, â€œIf the computation succeeds, Iâ€™ll get an `Int` back thatâ€™s
    wrapped in the `Right`. If it fails, Iâ€™ll get the exception in the `Left`.â€
    The declaration of the two possible return types makes `Either` more flexible
    than the `Option` and `Try` types.


    ## Two technical points


    There are at least two interesting technical points to know about the [`Either`
    data type](https://www.scala-lang.org/api/current/scala/util/Either.html).


    First, as that Scaladoc page notes, `Either` represents a value that is one of
    two possible types, and this is technically known as a *disjoint union*.


    Second, `Either` is *right-biased*. The Scaladoc states, â€œthis means that `Right`
    is assumed to be the default case to operate on.â€ When you use `Either` in `match`
    and `for` expressions as I showed, this doesnâ€™t matter. But when you want to
    work directly with `maybeSum`, such as calling a `map` method on it, thatâ€™s
    where this is important.


    The key is that when you call `map` on `maybeSum` and it is a `Left`, `map` returns
    the `Left` value unchanged, as shown in the REPL:


    `// when maybeSum is a Left:`


    `scala> maybeSum.map(_ * 10)`


    `val res0: Either[Exception, Int] =`


    `    Left(java.lang.NumberFormatException: For input string: "Hi mom!")`


    Conversely, when `maybeSum` is a `Right`, `map` and other methods work as desired:


    `// when maybeSum is a Right:`


    `scala> maybeSum.map(_ * 10)`


    `val res1: Either[Exception, Int] = Right(60)`


    ## Pure functions cannot lie


    Once again Iâ€™ll reiterate this point about the type signatures of pure functions:
    *they cannot lie*. As shown here, the `makeInt` function screams loud and clear,
    â€œIâ€™ll give you an `Int` in the `Right` position if everything goes well, but
    if something goes wrong, youâ€™ll get an `Exception` in the `Left`â€:


    `def makeInt(s: String): Either[Exception, Int]`


    `                        ----------------------`


    Summary: Whenever you see `Either`, `Try`, or `Option` as the return type of a
    function, you know that something can go wrong inside that function.


    # 22\. FEH: allCatch


    Before we leave these error-handling lessons and get back to the change request
    for our `wc` application, I want to show how you can write those `makeInt` functions
    more concisely.


    ## More concise makeInt functions


    You can make most of the `makeInt` functions I showed previously more concise
    by using a Scala type named `allCatch`. Cutting to the chase, its solutions to
    make `makeInt` much shorter look like this:


    `import scala.util.{Try, Success, Failure}`


    `// the allCatch type is here:`


    `import scala.util.control.Exception.allCatch`


    `// Option`


    `def makeInt(s: String): Option[Int] =`


    `    allCatch.opt(s.toInt)`


    `// Either`


    `def makeInt(s: String): Either[Throwable, Int] =`


    `    allCatch.either(s.toInt)`


    `// Try (Version 1: the approach shown earlier (preferred))`


    `def makeInt(s: String): Try[Int] =`


    `    Try(s.toInt)`


    `// Try (Version 2)`


    `def makeInt(s: String): Try[Int] =`


    `    allCatch.withTry(s.toInt)`


    As shown in the second `import` statement, `allCatch` is defined in the `Exception`
    object of the `scala.util.control` package, so you need to first import it, and
    then you can use it as shown.


    The key with `allCatch` is that it does the work that the `try`/`catch` expression
    did in my previous examples: it returns the success value when the conversion
    succeeds (the happy path), and it catches exceptions when things go wrong and
    returns the desired error value (in the unhappy path).


    ## More information


    The [`scala.util.control.Exception` Scaladoc page](https://www.scala-lang.org/api/current/scala/util/control/Exception$.html)
    has more information and examples of `allCatch` and other related solutions, such
    as how to handle logging when using shortcuts like this. Please see that page
    for more information on those techniques.


    # 23\. FEH: Implementing wc with Try


    Okay, given that background on how we handle possible errors in Scala, letâ€™s
    get back to our Word Count application. We left off at the point where our boss
    said to us, â€œUm, yeah, that `wc` function needs to handle a string that represents
    *the filename* that contains the document, not the *document* itself.â€


    ## The incorrect solution


    To quickly re-state what I just wrote about functional error handling, recall
    that this is the incorrect solution, we *do not* write code like this in Scala/EOP:


    `@throws Exception`


    `def wc(filename: String) ...`


    Exceptions short-circuit algebraic equations and blow up blueprints, so we donâ€™t
    do that.


    ## Working with a file


    Having read the previous error-handling lessons, your algebraic-oriented brain
    should now be thinking that we need to change our previous function signature:


    `def wc(document: String): VectorMap[String, Int]`


    to something like this:


    `def wc(filename: String): Option[?]`


    `def wc(filename: String): Try[?]`


    `def wc(filename: String): Either[?, ?]`


    The basic idea is that files may not exist, or they may not be readable, so we
    use the error-handling types to account for those possibilities.


    If we focus on just `Try` for a moment:


    `def wc(filename: String): Try[?]`


    an excellent question at this point is, â€œWhat goes inside that `Try` declaration?â€


    ### Tryâ€™s type


    As we saw in the previous lessons, the type that goes inside `Try[]` is the *success
    case* data type. In this case â€” because the original `wc` function returns a
    `VectorMap[String, Int]` when it succeeds â€” our new functionâ€™s return type
    should look like this:


    `def wc(filename: String): Try[VectorMap[String, Int]]`


    To make that a little easier to see, hereâ€™s the success type, underlined:


    `def wc(filename: String): Try[ VectorMap[String, Int] ]`


    `                               ----------------------`


    ### Option and Either


    To be thorough with our error-handling options, `Option` is declared the same
    way:


    `def wc(filename: String): Option[ VectorMap[String, Int] ]`


    `                                  ----------------------`


    And as you know, with `Either` you declare both the failure and success types.
    The failure type can be anything, but itâ€™s usually an exception or a string,
    so its signature will typically be one of these:


    `def wc(filename: String): Either[ Throwable, VectorMap[String, Int] ]`


    `def wc(filename: String): Either[ String,    VectorMap[String, Int] ]`


    I put extra spaces around those brackets to make things more obvious, but you
    usually donâ€™t do that, so our new function that reads a document from a given
    filename will have signatures look like these:


    `def wc(filename: String): Try[VectorMap[String, Int]]`


    `def wc(filename: String): Option[VectorMap[String, Int]]`


    `def wc(filename: String): Either[Throwable, VectorMap[String, Int]]`


    `def wc(filename: String): Either[String, VectorMap[String, Int]]`


