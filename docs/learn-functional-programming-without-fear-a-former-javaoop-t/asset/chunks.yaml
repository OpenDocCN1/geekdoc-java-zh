    compose, composition, combinator


    In FP we say that we *compose* solutions by combining code like pure functions
    and expressions together. A key in this is that in order for us to be able to
    compose them, the output of one function must match the input to another function.
    You can think of this as being like writing a pipeline of Unix commands, such
    as `ps aux grep root wc -l`.


    deterministic


    Very similar to referential transparency (if not the same), a function is deterministic
    if it always produces the same output for a given input.


    effect, effectful


    (See below.)


    expression-oriented programming (EOP)


    A technique of programming with *expressions* rather than *statements*, where
    an *expression* is a block of code that returns a result, and has no side effects.


