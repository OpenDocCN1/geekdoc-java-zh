    > NOTE: Writing this code is the same as writing OOP code, where you have a class
    that takes a constructor parameter (`dbFilename`), and then the methods in that
    class use that parameter. The only difference is that I wonâ€™t mutate that parameter,
    so, as shown, I define it as a `val` parameter.


    ## About the â€˜Tryâ€™ rule


    Recall my rule that any function that reaches out to the outside world must return
    the `Try` error-handling type. This is overkill for a flat-file database, but
    it helps if you recall that real database code typically accesses another server
    (or cluster) that may or may not be running when you call it. This is also just
    like calling a REST API that may or may not be running, across a network that
    may or may not be available.


    In these situations, robust code *must* return an error-handling type like `Try`
    or `Either`, and for our purposes, Iâ€™ll use `Try`.


    ## How this affects Database


    Given this rule, I sketch the `Database` class to have methods with these type
    signatures:


    `class Database(dbFilename: String):`


    `    def insert(record: String): Try[Unit] = ???`


    `    def selectAll(): Try[Seq[String]] = ???`


    `    def delete(indexToDelete: Int): Try[Int] = ???`


    `end Database`


    Iâ€™ll explain that code in the following chapters, but briefly:


    *   `insert` returns `Try[Unit]`, and its `Success` and `Failure` results tell
    us if it worked


    *   `selectAll` returns `Try[Seq[String]]`, which is a list of strings inside
    a `Try`.


    *   `delete` returns `Try[Int]`, and its `Int` value indicates the number of rows
    deleted.


    In all of those cases, if our â€œdatabase serverâ€ is down, the `Try` we get back
    will be a `Failure`, but if the server is up and running, we should get back a
    `Success`.


    ## Methods vs functions


    As a final note, this is my personal standard about using the names â€œmethodsâ€
    and â€œfunctionsâ€ when talking about Scala code:


    *   When you define these inside a *class*, I refer to them as *methods*.


    *   Anywhere else, I refer to them as *functions*.


    This isnâ€™t a standard Scala naming convention, itâ€™s my own personal convention.
    It always feels weird to talk about *functional programming* while constantly
    using the term *method*, so thatâ€™s how I came up with this personal standard.
    Therefore, from here on out, Iâ€™ll refer to â€œmethods in the `Database` class.â€


    # 27\. TDL: The insert Database Function


    As a quick reminder, in the following lessons where weâ€™ll create database-related
    code, all of these functions will be placed inside a `Database` class that looks
    like this:


    `class Database(dbFilename: String):`


    `    // def insert = ???`


    `    // def selectAll = ???`


    `    // def delete = ???`


    `end Database`


    ## insert


    The first `Database` function weâ€™ll need is an `insert` function. Because this
    is just a flat-file database, this function will *append* a single new record
    to the database file. Therefore, I know that it takes a string as input, and I
    start to sketch the `insert` function like this:


    `def insert(record: String)`


    Next â€” and mostly because Iâ€™ve been through this process before â€” I know
    that I want this function to use another `writeToFile` function to do the actual
    file-writing. I know this because the `delete` and `update` functions Iâ€™ll write
    in the following lessons will require me to read in the entire file and then re-write
    it completely. So `writeToFile` will need to be able to both (a) append to a file
    and (b) completely overwrite the file (and I donâ€™t want to have a boolean `append`
    parameter in the `insert` function).


    Therefore, letâ€™s forget about the `insert` function for a moment and first work
    on the `writeToFile` function.


    ## writeToFile


    `writeToFile` will be another function inside the `Database` class, and because
    nobody outside of `Database` will need to access it, I start by making it private:


    `private def writeToFile`


    Next, because I know that `delete` and `update` will require me to completely
    re-write the file, I define it to accept a list of strings, which in the most
    generic sense in Scala is a `Seq[String]`:


    `private def writeToFile(lines: Seq[String])`


    `                        ------------------`


    I also know that I want to set a boolean `append` flag when calling this function.
    This lets me declare that I want to overwrite the file, or append to it:


    `private def writeToFile(lines: Seq[String], append: Boolean):`


    `                                            ---------------`


    Now the final thing to think about is its return type. As I mentioned in our rules,
    any function that communicates with the outside world *must* return a `Try` value,
    so that gives me this:


    `private def writeToFile(lines: Seq[String], append: Boolean): Try[`


    `                                                              ----`


    And now the only question is, â€œWhat should the success value be inside `Try`?â€'
