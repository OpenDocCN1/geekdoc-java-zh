    for *concrete* data types that will later be supplied in the position where the
    generic type is declared.


    This is one of those situations where it’s easiest if you just jump right into
    the pool, so I’ll start with this example:


    ```scala

    class Box[A](val item: A)

    ```


    That’s probably the simplest possible class you can create that has a generic
    constructor parameter. It defines a class named `Box` with a single constructor
    parameter named `item`, which has the generic type `A`. Notice that Scala requires
    you to declare generic types in brackets before the list of constructor parameters:


    ```scala

    class Box[A](val item: A)

    ```


    Then, in the parameter list, this is how you say that when an instance of `Box`
    is created, `item` can be any type:


    ```scala

    class Box[A](val item: A)

    ```


    Because `A` is a generic type, when an instance of `Box` is created, `item` can
    be any type:


    ```scala

    class Box[A](val item: A)

    ```


