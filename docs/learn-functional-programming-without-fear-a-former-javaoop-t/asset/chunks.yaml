    \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords\
    \ =\n        convertStringToListOfWords(stringWithSingleBlanks)\n    val lcListOfWords\
    \ =\n        lowerCaseAllWords(listOfWords)\n    ...\n```\n\n## Discussion\n\n\
    Now that we have a list of words, we’re almost home. The next step is to create\
    \ a function that converts the list of words into a `Map`, where that `Map` contains\
    \ each unique word as the key, and the count of occurrences of that word as its\
    \ value.\n\nWe don’t have to think about that algorithm yet, we just need to sketch\
    \ the function signature. We know that it should take a `Seq[String]` as input,\
    \ and return a `Map[String, Int]`, so its signature looks like this:\n\n```scala\n\
    def convertWordListToWordCount(listOfWords: Seq[String]): Map[String, Int]\n```\n\
    \nand now `wc` looks like this:\n\n```scala\ndef wc(document: String): VectorMap[String,\
    \ Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
    \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
    \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
    \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
    \    val lcListOfWords =\n        lowerCaseAllWords(listOfWords)\n    val initialMap\
    \ =\n        convertWordListToWordCount(lcListOfWords)\n    ...\n```\n\n## Two\
    \ notes\n\nTwo notes come to mind after writing this section.\n\n### 1) Being\
    \ a mathematician or architect\n\nThe first note is to reiterate what I’ve already\
    \ stated: that FPers like to think of this style of programming as math, or perhaps\
    \ as creating a blueprint. So rather than being a programmer, you’re like a mathematician\
    \ or architect, working on equations or the blueprint. Because of this, you’ll\
    \ also hear FPers say things like “reasoning about the code,” because they look\
    \ at function signatures like these and how they glue together.\n\nAs you’ll see\
    \ throughout this book, when your functions are pure and your values are immutable,\
    \ you can do this.\n\n### 2) You can do much more with Scala types\n\nA second\
    \ thing I need to mention is that with the Scala type system, you can do some\
