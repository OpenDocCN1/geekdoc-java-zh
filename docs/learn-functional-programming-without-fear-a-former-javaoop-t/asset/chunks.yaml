    # Appendix D. Classes That Use Generic Types


    As with other programming languages, a *generic parameter* in Scala is a placeholder
    for *concrete* data types that will later be supplied in the position where the
    generic type is declared.


    This is one of those situations where itâ€™s easiest if you just jump right into
    the pool, so Iâ€™ll start with this example:


    `class Box[A](val item: A)`


    Thatâ€™s probably the simplest possible class you can create that has a generic
    constructor parameter. It defines a class named `Box` with a single constructor
    parameter named `item`, which has the generic type `A`. Notice that Scala requires
    you to declare generic types in brackets before the list of constructor parameters:


    `class Box[A](val item: A)`


    `         ---`


    Then, in the parameter list, this is how you say that when an instance of `Box`
    is created, `item` can be any type:


    `class Box[A](val item: A)`


    `                       -`


    Because `A` represents a generic type, when you create a `Box` instance, the actual
    type can be an `Int`, `String`, `Boolean`, whatever. With this declaration, youâ€™re
    saying that the type can be anything, basically the actual type used isnâ€™t important
    to you (or your algorithm).


    Now you can create `Box` instances with any legal Scala type:


    `val a = Box(1)       // Int`


    `a.item   // 1`


    `val b = Box("yo")    // String`


    `b.item   // "yo"`


    `val c = Box(true)    // Boolean`


    `c.item   // true`


    A few key points:


    *   `A` is a generic type parameter


    *   In Java, the standard is that generic types begin with the letter `T`, but
    in Scala we begin them with the letter `A` (but this is just a convention)


    *   As I mention in the next lesson, an implication of using a generic parameter
    is that the algorithms inside your class must not care about the actual type (`Int`,
    `String`, whatever) that is later used when `Box` instances are created.


    Youâ€™ll also see symbols like `+`, `-`, and `<:` used with generic parameters.
    For a few details on those, see the â€œA Quick Look at Variance and Boundsâ€ lesson
    that follows.


    ## Multiple generic parameters


    When you need to define a class that has multiple constructor parameters with
    generic types, define it like this:


    `class Pair[A, B](val a: A, val b: B):`


    `    def getKey: A = a`


    `    def getValue: B = b`


    Notice how the generic types `A` and `B` are (1) declared in the brackets, (2)
    used with the constructor parameters, and (3) used with the two methods in the
    class.


    Now you can use `Pair` like this:


    `val a = Pair(1, "one")`


    `a.getKey      // 1 (an Int)`


    `a.getValue    // "one" (a String)`


    Furthermore, because both variables are declared to have generic types, you can
    use *any* type in the two positions:


    `Pair(1, 2)       // A and B are both Int`


    `Pair(1, "1")     // A is Int, B is String`


    `Pair("1", 2.2)   // A is String, B is Double`


    Notice in the first example that when you use two types like `A` and `B`, youâ€™re
    saying, â€œThese two types *can* be different, but they donâ€™t have to be; they
    can both be `Int`, for example.â€


    In the `Pair` class I intentionally use the method names `getKey` and `getValue`
    because this is a port of [this Java example](http://docs.oracle.com/javase/tutorial/java/generics/types.html),
    except that I created mine as a `class` rather than their Java `interface`:


    `public interface Pair<K, V> {`


    `    public K getKey();`


    `    public V getValue();`


    `}`


    When youâ€™re working with a `Map` or any other type that has a key and value,
    the standard is also to use `K` and `V` instead of `A` and `B`, so this code is
    preferred over my first example:


    `class Pair[K, V](val key: K, val value: V):`


    `    def getKey: K = key`


    `    def getValue: V = value`


