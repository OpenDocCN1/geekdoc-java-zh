    This binds the userâ€™s input to the variable I named `input`. Whatever they type
    in before they press the [Enter] key is going to be a `String` thatâ€™s assigned
    to the `input` variable.


    ## Handling the input


    Next, our application needs to process the userâ€™s input. As I showed in the
    introduction to this To-Do List example, a user types this to add a new task with
    the value `"Wake up"`:


    `a Wake up`


    and they type this to delete the first task:


    `d 1`


    and so on; they use the other commands we allow.


    So now we need some sort of processor or handler to process these strings that
    we receive. For now Iâ€™m not going to implement this processor; Iâ€™ll just create
    a â€œdo nothingâ€ function that has the correct signature.


    As usual, I start by sketching the signature of the desired function. Iâ€™ll call
    this function `handleUserInput`, and I know itâ€™s going to take a string input
    parameter:


    `def handleUserInput(input: String)`


    At this point â€” to complete the function signature â€” you have to think forward
    a little bit: `handleUserInput` is going to receive the user input as a string,
    itâ€™s going to attempt to process it, and then interact with our database. Because
    our database functions all return `Try`, this function should also return `Try`,
    so I add that:


    `def handleUserInput(input: String): Try`


    `                                    ---`


    Next, because this function will always result in printing some output to STDOUT,
    it will have no return value, or at least no return value that we are interested
    in. Whenever this is the case, we declare that the function returns `Unit`, a
    `Unit` wrapped in a `Try`:


    `def handleUserInput(input: String): Try[Unit]`


    `                                    ---------`


    And now â€” because I donâ€™t want to process that user input yet â€” Iâ€™ll just
    implement this function with a `println` statement:


    `def handleUserInput(input: String): Try[Unit] =`


    `    // todo: implement this function`


    `    println("handleUserInput called")`


    ## Back to the main loop


    At this point we *could* add that function call to our `mainLoop` function, like
    this:


    `def mainLoop(): Try[Unit] = for`


    `    _     <- promptUser()`


    `    input <- readInput()`


    `    _     <- handleUserInput(input)`


    `    // hmm, still need to do something here ...`


    `yield ()`


    Note that here I do a few things. First, `handleUserInput` doesnâ€™t return anything
    interesting, so I use the `_` on the left side of the `<-` symbol.


    Second, I added a `yield ()` to the end of the `for` expression. The `()` characters
    represent the one and only `Unit` value in Scala. Put another way, any time you
    need to return a `Unit` *value* from a function, you return `()`. (That is, `()`
    is an instance of `Unit`, its one and only instance.)


    So, `yield ()` means that this `for` expression returns `Unit`. But, because the
    expression works with `Try` values, that `Unit` value is wrapped in a `Try`. Thatâ€™s
    why the function declaration begins like this:


    `def mainLoop(): Try[Unit] = for ...`


    ## The problem


    However, the problem we have is that if we call `mainLoop` right now, it wonâ€™t
    really loop; it only runs once. It prompts the user, reads their input, processes
    it, and then quits. We still need some way for our loop to, well, loop.


    When youâ€™re working with immutable variables, the solution to this problem is
    almost always the same: recursion. Inside our `for` expression we just need to
    call `mainLoop`, so it invokes itself again. Iâ€™ll format that code so it looks
    like this:


    `def mainLoop(): Try[Unit] = for`


    `    _     <- promptUser()`


    `    input <- readInput()`


    `    _     <- {`


    `                handleUserInput(input);`


    `                mainLoop()`


    `             }`


    `yield ()`


    You can format it in different ways, but the important thing is that this code:


    `_     <- {`


    `            handleUserInput(input)`


    `            mainLoop()`


    `         }`'
