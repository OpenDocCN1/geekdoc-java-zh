    *when*, the description from the execution: `Future`â€™s action should only be
    triggered some time later, specifically when `runUnsafe` is invoked.


    ## Note 2: Call by-name parameters


    If youâ€™re wondering how `IO` can be lazy, and youâ€™re not familiar with how
    *call by-name* parameters work in Scala, please see the *Call By-Name* lesson
    in the Appendix. It explains how this works.


    # 52\. JIT: IO, Option, Try, Either, and for-Expressions


    A second important thing to know at this point is that you CANNOT mix types like
    `Option`, `Try`, and `Either` in `for` expressions (not easily, anyway).


    To demonstrate this, imagine that your code base has two functions like this,
    one that returns an `Option` and another that returns a `Try`:


    `import scala.util.{Try, Success, Failure}`


    `import scala.util.control.Exception.allCatch`


    `import io.StdIn`


    `def makeInt(s: String): Option[Int] =`


    `    allCatch.opt(s.toInt)`


    `def makeDouble(s: String): Try[Double] =`


    `    Try(s.toDouble)`


    and then you find yourself in a situation where you want to prompt a user to enter
    an `Int` and then a `Double`:


    `print("Enter an Int: ")`


    `val intAsString = StdIn.readLine()`


    `print("Enter a Double: ")`


    `val doubleAsString = StdIn.readLine()`


    `val maybeInt: Option[Int] = makeInt(intAsString)`


    `val maybeDouble: Try[Double] = makeDouble(doubleAsString)`


    So far, so good. But now, letâ€™s say that you want to use them in sequence in
    a `for` expression, to add them together:


    `for`


    `    i <- maybeInt`


    `    d <- makeDouble`


    `yield`


    `    i + d`


    Sadly, this code wonâ€™t compile. The types `Opt[Int]` and `Try[Double]` just
    wonâ€™t mix.


    There are ways to get around this in a small example like this, but in the more-complex
    real world, this is a huge problem.


    > I explain *why* these donâ€™t mix in [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book).


    ## The solution


    The solution is to use an `IO` data type whenever you communicate with the outside
    world. When you do that, you can use as many `IO` values in a `for` expression
    as you want. `IO`s are built to handle all sorts of side effects, and they will
    all work happily together when you sequentially compose them in `for` expressions.
    (Life is good with `IO`.)


    Now Iâ€™ll add an oversimplification here: This is where you need to choose a
    library like ZIO *OR* Cats Effect. There are ways to get their `IO` types to work
    together, but in general you want to choose one OR the other.


    As a personal statement, Iâ€™m just a teacher and a writer, so I donâ€™t want
    to get into suggesting *which* library you should use. Thatâ€™s beyond the scope
    of this book, and you can search for terms like â€œZIO vs Cats Effectâ€ to find
    the pros and cons of each library.


    > That being said, Iâ€™ll only demonstrate ZIO in this book, because I want to
    avoid the confusion of switching back and forth between the two.


    ## Key point


    Getting back to this lesson, the key point is that types like `Option`, `Try`,
    and `Either` donâ€™t mix well: itâ€™s hard to combine their results in `for` expressions,
    as well as other places.


    As shown in this book, the goal of these types is to handle errors in a functional
    way, and we generally use them when dealing with side effects, such as communicating
    with the outside world. But when you canâ€™t later combine them â€” what FPers
    call *composing* values, or *composition* â€” this is a big problem.'
