    `    maybeDocument match`


    `        case Success(docAsString) => Success(wc(docAsString))   // [1]`


    `        case Failure(e)           => Failure(e)                 // [2]`


    As shown in Note 1, in the `Success` case I pass the document (`docAsString`)
    to the old `wc` function. If you look back at that function, youâ€™ll see that
    it has the type signature `VectorMap[String, Int]`. As you now know, this means
    that `wc` cannot fail. Because `wcFromFile` needs to return a `Try` type, I wrap
    this map in the `Success` type.


    And then in the `Failure` case (Note 2), I return a new `Failure` instance that
    contains the exception that occurred when trying to read the file.


    While this solution works, a problem with it is that Iâ€™m getting a `Try` from
    `readFile`, and then I unpack it into a `Success` or `Failure`, and then I re-pack
    it back into those types in the `match` expression. I can do better.


    ### A more concise solution


    The more concise solution is to use the `map` method thatâ€™s available on the
    `Success` and `Failure` types. The way `map` works is that if itâ€™s called on:


    *   `Failure`, it returns the exception


    *   `Success`, `map` lets you operate on the success value however you want to


    So again, the first step of the function body stays the same:


    `def wcFromFile(filename: String): Try[VectorMap[String, Int]] =`


    `    val maybeDocument: Try[String] = readFile(filename)`


    `    ...`


    After that, I replace the `match` expression with a `map` method call on `maybeDocument`,
    which is a `Try`. Inside `map` I pass the document to the `wc` function:


    `def wcFromFile(filename: String): Try[VectorMap[String, Int]] =`


    `    val maybeDocument: Try[String] = readFile(filename)`


    `    maybeDocument.map(doc => wc(doc))`


    The result of that expression has the type `Try[VectorMap[String, Int]]`, which
    matches our functionâ€™s return type.


    If you prefer not using intermediate variables, you can write this solution more
    concisely, like this:


    `def wcFromFile(filename: String): Try[VectorMap[String, Int]] =`


    `    readFile(filename).map(doc => wc(doc))`


    or this, using Scalaâ€™s underscore shortcut in the anonymous function:


    `def wcFromFile(filename: String): Try[VectorMap[String, Int]] =`


    `    readFile(filename).map(wc(_))`


    Whichever approach you prefer, the key here is that both `Success` and `Failure`
    implement the `map` method, and with `Success`, `map` operates on the success
    value â€” so it works with the `wc` call â€” and with `Failure`, `map` just returns
    the exception it holds.


    ### The Either solution


    Because `Either` is also a good solution for I/O functions, letâ€™s see how it
    works. First, its file-reading function signature looks like this:


    `def readFile(filename: String): Either[Throwable, String]`


    Next, its top-level function looks like this:


    `def wcFromFile(filename: String): Either[Throwable, VectorMap[String, Int]]`


    And finally, the short version of its function body looks like this:


    `def wcFromFile(filename: String): Either[Throwable, VectorMap[String, Int]] =`


    `    readFile(filename).map(wc(_))`


    Because of its flexibility, `Either` is a bit more verbose, but this signature:


    `Either[Throwable, VectorMap[String, Int]]`


    means that if something goes wrong, youâ€™ll get an exception:


    `Either[Throwable, VectorMap[String, Int]]`


    `       ---------`


    but if all goes well, youâ€™ll get the sorted map that weâ€™re really after:


    `Either[Throwable, VectorMap[String, Int]]`


    `                  ---------------------`


    ## One last point about types


    I showed this before, so Iâ€™ll just briefly touch on this again here. These function
    signatures:


    `def wcFromFile(filename: String): Try[VectorMap[String, Int]]`


    `def wcFromFile(filename: String): Either[Throwable, VectorMap[String, Int]]`


    are probably easier to read if we use Scala 3â€™s opaque types to create more
    meaningful type names like these:


    `def wcFromFile(filename: String):`


    `    Try[MapSortedByValueDesc[Word, Count]]`


    `def wcFromFile(filename: String):`


    `    Either[Throwable, MapSortedByValueDesc[Word, Count]]`


    And lastly, if you really want to have some fun â€” and make your code easier
    to read â€” you can create *type aliases* like these:


    `def wc(filename: String): WordCountMapTry`


    `def wc(filename: String): WordCountMapEither`


    With type aliases and opaque types, solutions like these are limited only by what
    you think is best, and easiest to read and maintain.


    # 24\. Recap, and Whatâ€™s Next


    As a very quick recap, so far in this book youâ€™ve seen:


    *   Immutable variables


    *   Immutable data structures


    *   Pure functions


    *   How to solve problems just by sketching pure function signatures


    *   Expression-oriented programming


    *   Algebraic substitution


    *   Functional error-handling


    Next, weâ€™ll build another complete example that uses all of these concepts.
    This time â€” to show more of the details â€” Iâ€™ll show more Scala code as we
    go through the process.


    # 25\. Example #2: To-Do List (TDL)


    In most of the remaining lessons of this book weâ€™re going to build a *To-Do
    List* (TDL) application that you can run at your operating system command line.
    The purpose of this is to show more of the nitty-gritty details involved in writing
    a Scala/EOP application, including how to compile and run it using a tool named
    [Scala-CLI](https://scala-cli.virtuslab.org/).


    ## How the app works


    TDL is a command-line application that you run with `scala-cli`. To run it, clone
    this bookâ€™s Github repository, move into the `ToDoList` directory, and issue
    this command:


    `$ scala-cli run .`


    Or, if you prefer, use this shorter command:


    `$ scala-cli .`


    Both of those mean, â€œCompile the code in this directory, find a `main` method,
    and run it.â€


    > When there are multiple `main` methods you have to add an additional option
    there, but with one `main` method, this command works.


    When the app starts running, you can type the letter `h` to see help. That help
    output shows that the app accepts these single-letter commands:


    `COMMAND           DESCRIPTION`


    `-------           -----------`


    `a [task]          add a to-do item`


    `d [task number]   delete a task by its number`


    `v                 view the list of tasks`


    `q                 quit`


    `h                 show this help text`'
