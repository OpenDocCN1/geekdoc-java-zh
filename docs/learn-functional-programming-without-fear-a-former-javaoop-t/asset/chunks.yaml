  trans: "\n\n```scala\n// 更多月份 ...\ncase 11 => \"November\"\ncase 12 => \"December\"\
    \ncase _  => \"Invalid month\"  // 默认值，匹配所有\n\n// 用于副作用：\ni match\n  case 1 |\
    \ 3 | 5 | 7 | 9  => println(\"odd\")\n  case 2 | 4 | 6 | 8 | 10 => println(\"\
    even\")\n\n// 用 'match' 写的函数：\ndef isTrueInPerl(a: Matchable): Boolean = a match\n\
    \  case false | 0 | \"\" => false\n  case _ => true\n```\n\n注意：还有*许多*其他使用 `match`\
    \ 表达式的方法。\n\n### try/catch/finally\n\nScala 的 `try`/`catch`/`finally` 表达式与 Java\
    \ 类似，但它们也是返回值的表达式：\n\n```scala\ndef readTextFile(filename: String): Option[List[String]]\
    \ =\n  try\n      Some(Source.fromFile(filename).getLines.toList)\n  catch\n \
    \   case e: Exception => None\n  finally\n      // 在此处关闭任何资源\n```\n\n## Functions\n\
    \nScala 函数和方法通过 `def` 关键字创建。它们可以写在一行，也可以写成任意行数：\n\n```scala\ndef sum(a: Int, b:\
    \ Int): Int = a + b\n\ndef max(a: Int, b: Int): Int =\n  // 在此处写下你需要的行数\n  if\
    \ a > b then a else b\n```\n\n### 默认参数值\n\n函数参数可以有默认值：\n\n```scala\ndef getUrlData(\n\
    \    url: String,\n    connectionTimeout: Int = 5_000,\n    readTimeout: Int =\
    \ 5_000\n): String =\n  println(s\"cTimeout = $connectionTimeout, rTimeout = $readTimeout\"\
    )\n  // 你的真实代码在这里\n  \"Here’s the data!\"\n\ngetUrlData(\"https...\")        \
    \           // cTimeout = 5000, rTimeout = 5000\ngetUrlData(\"https...\", 2_500)\
    \            // cTimeout = 2500, rTimeout = 5000\ngetUrlData(\"https...\", 10_000,\
    \ 10_000)   // cTimeout = 10000, rTimeout = 10000\n```\n\n### 接受函数参数的函数\n\n三步过程。\n\
    \n[1] 定义接受其他函数作为输入参数的函数：\n\n```scala\n// callback 是一个“函数输入参数” (FIP):\ndef sayHello(callback:\
    \ () => Unit): Unit =\n  callback()\n\n// 这定义了一个 FIP，它 (a) 没有输入参数且\n// (b) 无返回值（Unit\
    \ 类似于 void）：\ndef sayHello(callback: () => Unit): Unit =\n                   \
    \       ----------\n```\n\n[2] 定义其他函数：\n\n```scala\ndef helloAl(): Unit =\n  println(\"\
    Hello, Al\")\n\ndef holaLorenzo(): Unit =\n  println(\"Hola, Lorenzo\")\n```\n\
    \n[3] 将这些传递给 `sayHello`：\n\n```scala\nsayHello(helloAl)        // 打印 \"Hello,\
    \ Al\"\nsayHello(holaLorenzo)    // 打印 \"Hola, Lorenzo\"\n```\n\n（关于这如何工作的更多细节，请参阅\
    \ [函数式编程简明教程](https://alvinalexander.com/scala/functional-programming-simplified-book)。）\n\
    \n## Functional error handling\n\nScala 有函数式错误处理和错误处理数据类型的概念。\n\n- 函数*不应该*抛出异常\n\
    - *应该*返回函数式错误处理类型：\n    - `Option`\n    - `Try`\n    - `Either`\n\n这在书中的许多地方都有体现，例如\
    \ `makeInt` 函数：\n\n```scala\ndef makeInt(s: String): Option[Int] =\n  try\n  \
    \    Some(s.toInt)\n  catch\n    case e: Exception => None\n```\n\n## Domain Modeling\
    \ (MD)\n\n当以 OOP 风格编程时，你将使用这些构造：\n- Traits（特征 trait）\n- Enums（枚举）\n- Classes（类）\n\
    \n示例：\n\n```scala\nclass Person(val name: String, age: Int)\n\nclass Person(val\
    \ name: String, age: Int)\n  override def toString = s\"$name is $age old\"\n\
    ```\n\n当以 FP 风格编程时，你将使用这些构造：\n- Traits（特征 trait）\n- Enums（枚举）\n- Case classes（样例类）\n\
    \n### DM: Classes\n\nOOP 风格的类拥有通过 `var` 创建的参数，因此它们可以被改变（变异）：\n\n```scala\n// 单行：\n\
    class Person(var firstName: String, var lastName: String)\n\n// 当它变长时：\nclass\
    \ Person(\n  var firstName: String,\n  var lastName: String\n)\n```\n\n创建一个新实例，然后访问并变异它的参数/字段：\n\
    \n```scala\nval p = Person(\"Reginald\", \"Dwight\")\n// 访问字段：\nprintln(p.firstName)\
    \  // \"Reginald\"\nprintln(p.lastName)  // \"Dwight\"\n\n// 变异它们：\np.firstName\
    \ = \"Elton\"\np.lastName = \"John\"\n\n// 打印新值：\nprintln(p.firstName)  // \"\
    Elton\"\nprintln(p.lastName)  // \"John\"\n```\n\n带有一些枚举的类：\n\n```scala\nenum\
