    \ with the `val` keyword.\n\n> NOTE: In Scala/OOP you *can* create mutable variables\
    \ using the `var` keyword, but this book will not use those.\n\n## Immutable data\
    \ structures\n\nThis book also uses only *immutable data structures*, such as\
    \ the `String`, `List`, and `Seq` classes, and the default `Map` class, which\
    \ is also immutable. When you use an immutable data structure, you cannot modify\
    \ it.\n\n> TIP: Java developers know that the Java `String` is immutable. So just\
    \ think of all these other data types as working the same way as `String`: you\
    \ never modify a `String`; instead, you call its methods to create a new `String`.\
    \ These are like the immutable collections classes that were introduced in Java\
    \ 9, such as using `List.of()` in Java 9+.\n\nBecause you canâ€™t mutate Scala\
    \ collections classes like `List`, `Seq`, and `Map`, once you create a sequence\
    \ like this:\n\n`val xs = Seq(1, 2, 3)`\n\nthe only way to create a new `Seq`\
    \ from it is to reassign its result to a new variable:\n\n`// create a sequence:`\n\
    \n`val a = Seq(1, 2, 3)`\n\n`// create new sequences based on that initial sequence:`\n\
    \n`val b = a ++ Seq(4, 5)     // b: List(1, 2, 3, 4, 5)`\n\n`val c = b.filter(_\
    \ > 2)    // c: List(3, 4, 5)`\n\nIf this seems limiting â€” fear not! â€” FPers\
    \ write code like this every day. Immutability is a key concept that makes your\
    \ code easier to maintain, and safe for parallel programming.\n\n# 10\\. JIT:\
    \ Pure Functions\n\nThe next JIT nugget of background information we need to cover\
    \ is the definition of a pure function. A *pure function* is a function:\n\n*\
    \   Whose only parameters from the outside world are the input parameters that\
    \ are defined in its function signature. (I refer to the list of input parameters\
    \ as a functionâ€™s *front door*.)\n\n*   That does not modify those input parameters.\n\
    \n*   That does not modify other â€œhiddenâ€ variables that might be accessed\
    \ through *side doors*, such as mutable variables in its class or any other global\
    \ variables.\n\n*   That does not communicate with the outside world. It has no\
    \ I/O whatsoever: no file access, no internet access, no database access, no quantum\
    \ entanglement, nothing.\n\n*   That always returns the same output when its given\
    \ the same input. For example, `sum(2, 2)` is always `4`.\n\n*   That returns\
    \ output for all possible input values.\n\n*   That does not throw exceptions.\n\
    \nBecause of those last two attributes, FPers say that a function is *total*,\
    \ meaning that it always returns a value.\n\nExamples of pure functions include:\n\
    \n*   Getting the length or checksum of a string\n\n*   Calculating the sum of\
    \ a list of integers (`List[Int]`)\n\n*   Many mathematical functions\n\nOne thing\
    \ to notice about pure functions is that they *always* have input parameters,\
    \ and they never return `Unit`:\n\n`def stringLength(s: String): Int`\n\n`    \
    \             ---------   ---`\n\n`                   Input     Return`\n\n`  \
    \               Parameters  Type`\n\n`// more pure function signatures:`\n\n`def\
    \ sum(xs: List[Int]): Int`\n\n`def add(a: Int, b: Int): Int`\n\n`def cos(x: Double):\
    \ Double`\n\n## A pure functionâ€™s signature tells you what it does\n\nBecause\
    \ pure function signatures in Scala always include the *data types* of (a) the\
    \ input parameters, and (b) the function result, you can often guess what a function\
    \ does just by looking at its type signature, even if the function name is meaningless.\
    \ For example, what do you think this function does:\n\n`def f(s: String): Int\
    \ = ???`\n\nBecause the function takes a `String` input parameter and returns\
    \ an `Int` â€” and also because you can be 100% sure that itâ€™s a *pure function*\
    \ â€” the function can only do a few things:\n\n*   Calculate the length of the\
    \ string\n\n*   Calculate some sort of checksum or hash of the string\n\nEven\
    \ without knowing the name of the function, you can get a good idea from its type\
    \ signature what it can possibly do. Thatâ€™s cool.\n\nIn fact, thatâ€™s *very*\
    \ cool. This is one of the great things about pure functions: when functions are\
    \ pure, you can just glance at their type signatures, and have a great feel for\
    \ what they do.\n\nIn my case, once I saw this, I started to wish that all functions\
    \ could somehow be pure.\n\n### It cannot be â€œString to Intâ€\n\nGoing back\
    \ to that example, as I sketched its function signature, I thought for a moment\
    \ that another thing the function could do is convert the `String` to an `Int`\
    \ â€¦ but thatâ€™s wrong. Because the process of attempting to convert a `String`\
    \ to an `Int` can potentially fail, a pure function that does that MUST have one\
    \ of these signatures in Scala:\n\n`def f(s: String): Option[Int] = ???`\n\n`def\
    \ f(s: String): Try[Int] = ???`\n\n`def f(s: String): Either[Throwable, Int] =\
    \ ???`\n\nAs youâ€™ll see in the following chapters, because attempting to convert\
    \ a `String` to an `Int` can result in an error â€” such as trying to convert\
    \ the string `\"Hi mom\"` â€” we need to return an *error-handling type* like\
    \ `Option`, `Try`, or `Either` when writing this as a pure function. These types\
    \ tell readers of our pure function, â€œsomething can go wrong here.â€ (I explain\
    \ this in *much* more in the following chapters.)\n\n# 11\\. JIT: I Love Pure\
    \ Functions, They Cannot Lie\n\nI initially thought that pure functions were â€œnice,â€\
    \ but when I really started using them I thought, wow, this is important: input\
    \ goes in front door, and output comes out the back door, as shown in this first\
    \ image:\n\n![image](images/00001.jpg)\n\nVery importantly, there are no side\
    \ doors for *side effects* (bad things) to sneak in and out:\n\n![image](images/00002.jpg)\n\
    \n## Pure functions do not lie\n\nMy overwhelming thought was, â€œWhoa, I can\
    \ look ONLY at the signature of a pure function to know what it does.â€ No more\
    \ digging into the source code of impure methods; just look at the function signature.\n\
    \nThis hit me so hard that I immediately wanted to write an `impure` annotation\
    \ to mark all those old methods I had written as being impure:\n\n`@impure`\n\n\
    `def randomInt(): Int = scala.util.Random.nextInt`\n\nI knew this wasnâ€™t a proper\
    \ solution â€” because I had no way to enforce the annotation â€” but I REALLY\
    \ wanted a way to tell the *pure* from the *impure* just by looking at function\
    \ signatures.\n\n> As youâ€™ll come to see in the remainder of this book, you\
    \ can easily tell that this particular function is impure because it takes no\
    \ input parameters. Any time you see a function with no input parameters, itâ€™s\
    \ a clear sign that a side effect is happening inside that function.\n\n## Pure\
    \ functions reduce your cognitive load\n\nNot to gush too much, but I LOVE writing\
    \ pure functions: they make things MUCH easier on my brain.\n\nWhat I mean is\
    \ that when I write a pure function, I donâ€™t have to think about the rest of\
    \ the application. When I write a pure function, my *entire universe* â€” the\
    \ only things I need to think about â€” are:\n\n*   What input parameters do I\
    \ need?\n\n*   What is my pure functionâ€™s return type?\n\n*   What is its algorithm?\n\
    \nLiterally, the only thing in my mind when Iâ€™m writing a pure function looks\
    \ like this:\n\n `                            +------------+`\n\n`(p1: Type1,\
    \ p2: Type2)  =>  |  function  |  =>  result: ResultType`\n\n`----------------------\
    \      +------------+      -------------------`\n\n`   Input Parameters      \
    \                       The Function Result`\n\nThereâ€™s no need to worry about\
    \ mutating the variables Iâ€™m given, or variables in the class or available globally.\
    \ I just think about (a) what comes in, (b) what goes out, and (c) the functionâ€™s\
    \ algorithm.\n\nOnce I realized this, even the *imposter syndrome* in me thought,\
    \ â€œYou know, I donâ€™t know if I can think about an entire application today.\
    \ But I can certainly write one pure function. And then I can write another. And\
    \ another. And then eventually I can glue them together to solve bigger problems.â€"
