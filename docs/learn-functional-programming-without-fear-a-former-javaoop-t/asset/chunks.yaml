  raw: 'Therefore, `IO` types have been created as a way to deal with I/O and other
    side effects. They have all the benefits of `Try` and `Either`, but:


    *   Theyâ€™re lazy, so we keep the algebraic substitution model


    *   They can be combined in `for` expressions


    *   They have MANY more features than these error-handling types


    In the previous lesson and this lesson I covered the first two bullet points,
    and in the next lesson weâ€™ll start looking at some of the features that industrial-strength
    `IO` types have in the ZIO and Cats Effect libraries.


    # 53\. ZIO and the Power of IOs


    Like the [Cats Effect `IO` type](https://typelevel.org/cats-effect/docs/2.x/datatypes/io),
    the `ZIO` type is an incredibly souped-up `IO` data type. As mentioned, in [Functional
    Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book),
    I show how to write a *simple* `IO` type in less than a page of source code, but
    industrial-strength `IO` types have taken *years* to create.


    So, after a quick JIT note, letâ€™s start writing some Scala/FP [ZIO](https://zio.dev)
    code.


    ## JIT: Scala 2 applications


    Before we get into ZIO, we need one quick JIT lesson, and it goes like this: One
    way to create a *Scala 2* application looks like this:


    `object Hello extends App {`


    `    println("Hello")`


    `}`


    In this code, `App` is a type thatâ€™s provided by the Scala 2 SDK, and you extend
    it with an `object`, as shown, to create an application. In Scala 3, the *`main`
    method* approach I show in this book replaces this Scala 2 approach. (Thereâ€™s
    another way to start Scala 2 applications, but that isnâ€™t important for this
    lesson.)


    ## ZIO applications


    I mention that because ZIO takes a similar approach, and you create ZIO applications
    like this:


    `import zio.{ZIOAppDefault, Console}`


    `object Zio101 extends ZIOAppDefault:`


    `    def run = Console.printLine("Hello, World!")`


    All you have to do is import the ZIO types that are necessary, and then create
    an `object` that extends ZIOâ€™s `ZIOAppDefault` type. This type is described
    as [the ZIO runtime](https://zio.dev/reference/core/runtime), and it evaluates
    the rest of your application. As a quick recap, just:


    *   Create an `object` that extends `ZIOAppDefault`


    *   Define a `run` method inside that `object` to start your application running


    *   And then the rest of your application is evaluated as a ZIO application, and
    all your equations/blueprints start executing


    If you dig into the `ZIOAppDefault` source code, I suspect that somewhere in there
    youâ€™ll find a function named something like `runUnsafe`.


    ## ZIO + Scala CLI 101


    In that code I created the simplest-possible ZIO â€œHello, worldâ€ application,
    using ZIOâ€™s `Console` type. To take this a step further, save this code in a
    file named `Hello1.scala` to create a complete Scala 3 + ZIO + Scala CLI application:


    `//> using scala "3"`


    `//> using lib "dev.zio::zio::2.0.2"`


    `// run me like this:`


    `//     scala-cli Hello1.scala`


    `//     scala-cli Hello1.scala --watch`


    `import zio.{ZIOAppDefault, Console}`


    `object Zio101 extends ZIOAppDefault:`


    `    def run = Console.printLine("Hello, World!")`


    As shown in the comments, you run it like this at your operating system command
    line with `scala-cli`:


    `$ scala-cli Hello1.scala`


    If you havenâ€™t used ZIO before â€” congratulations! You just ran your first
    Scala/FP ZIO application, and if you think about where this book first started,
    thatâ€™s quite an accomplishment.


    ## ZIO + Scala CLI 102


    A next logical step is to demonstrate how to add a ZIO variable to your application:


    `import zio.{ZIOAppDefault, ZIO, Console}`


    `import java.io.IOException`


    `object Zio102 extends ZIOAppDefault:`


    `    val hello: ZIO[Any, IOException, Unit] =`


    `        Console.printLine("Hello, World!")`


    `    val run = hello`


    The first difference in this application is that I create `hello` as an instance
    of a `ZIO` variable:


    `val hello: ZIO[Any, IOException, Unit] =`


    As I mentioned before, the mental model for thinking of the `ZIO` type is that
    itâ€™s a description of a workflow, and you can think of it as a function, that
    given an `R` can produce either an `A` or an `E`:


    `f(r: R): Either[E, A]`


    and in that code:


    *   `R` stands for the *environment* that is passed in


    *   `E` is like the `Either` error-handling type


    *   `A` is like the `Either` success data type that you really want (i.e., the
    â€œhappy pathâ€ or â€œhappy resultâ€)


    Therefore, you can read this variable and data type:


    `val hello: ZIO[Any, IOException, Unit] =`


    like this:


    *   `R` is the Scala type `Any`, which is the ZIO way of saying that the environment
    doesnâ€™t matter


    *   `E` is an `IOException`, meaning that the code on the right side of the `=`
    symbol can throw that exception


    *   `A` is `Unit`, because weâ€™re printing output to STDOUT, so the return type
    isnâ€™t important


    Once again, if you can read that, youâ€™ll do just fine with ZIO: itâ€™s just
    like writing line after line of algebra, or blueprint code.


    > NOTE: In the real world, you donâ€™t have to always show each variableâ€™s data
    type.


    A second difference in this example is that I replaced `def run` with `val run`:


    `val run = hello`


    `-------`


    I suppose this is one of those Scala â€œmagic tricksâ€ I was going to avoid, but
    let me explain it, because itâ€™s not that bad.


    You can do this in Scala because `run` is *probably* defined something like this
    somewhere in the `ZIOAppDefault` code:


    `trait SomeZioTrait:`


    `    def run: ZIO[A, B, C]`


    Of course itâ€™s more complicated than that, but you can think of it that way.
    The key is that when `run` is defined like this inside a Scala `trait`, it can
    be read like this:


    *   Thereâ€™s a `trait` named `SomeZioTrait`, and a Scala `trait` is like an interface
    in Java 8+, so it can be used to define both abstract and concrete methods.


    *   `run` is defined as an *abstract*, somewhat vague thing that takes no input
    parameters, and has the type `ZIO[A, B, C]`.


    *   As I describe in the [Scala Cookbook](https://amzn.to/3du1pMR) and [Functional
    Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book),
    the magic trick is that when you define `run` as an abstract thing like this,
    it can later be implemented by extending classes as a `def` function OR as a `val`
    field. This gives people who extend your trait power in how they want to implement
    `run`.


    The summary of those bullet points is that as a designer, you define a field in
    a `trait` as an abstract `def` with no input parameters. This lets programmers
    who later extend your trait implement that field as a `def` or as a `val`, and
    the key is that this is more flexible for them.


    Getting back to our current application, if you run `Zio102`, youâ€™ll see that
    it works just like `Zio101`.


    ## ZIO 103: ZIO.attempt


    Given that background, letâ€™s take another step. Rather than using ZIOâ€™s built-in
    `Console` type, letâ€™s imagine that it doesnâ€™t exist, so instead, weâ€™ll need
    to wrap the Scala `io.StdIn.readLine` function with â€¦ well â€¦ something.


    This is where you begin to see ZIOâ€™s power and flexibility. ZIO has built-in
    factory methods for just these needs. In this case, if you imagine that the `readLine`
    function can throw an exception, you define a variable as follows to (a) prompt
    a user for their name, and (b) read their name in:


    `val username: ZIO[Any, Throwable, String] =`


    `    ZIO.attempt(StdIn.readLine("Whatâ€™s your name? "))`


    A few keys about this code:


    *   `readLine` is used to both (a) prompt the user for their name and (b) return
    whatever they type.


    *   Because I said to *imagine* that the code can throw an exception, the second
    parameter in `ZIO[Any, Throwable, String]` is a `Throwable` (and it could also
    be `Exception` or `IOException`).


    *   Recall that this second parameter is ZIOâ€™s `E` parameter, and itâ€™s similar
    to `Either`â€™s error parameter.'
