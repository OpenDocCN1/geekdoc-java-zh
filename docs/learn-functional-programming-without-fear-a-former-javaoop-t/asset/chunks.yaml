    \  A]\n       ^      ^\n       Left  Right\n```\n\n这些泛型类型被命名为 `R`、`E` 和 `A` 有非常特定的原因：\n\
    \n*   `R` 代表传入的环境（environment）。基本上如果你的代码需要某种环境（如数据库、输入/输出甚至时钟），你将代码所需的依赖项作为 `R`\
    \ 参数传入。（将此参数命名为 `D`，代表 dependencies，可能会有帮助。）\n*   `E` 是常用的 `Either` 错误处理类型，即 `Left`\
    \ 位置的类型。在之前的课程中见过 `Either` 后，你已经知道这意味着什么了。（像通常一样，把它想象成“不愉快”的结果。）\n*   同样，`A` 是你真正想要的成功数据类型，即\
    \ `Right` 位置的类型。\n\n这种灵活性对于我们接下来的学习方向非常重要。\n\n# 50 什么是 IO？\n\n快回到今天，关于 `IO` 有三件需要知道的事情：\n\
    \n1.  它们创建是为了以纯粹的方式处理副作用。\n2.  我还没有提到的一点是，你可以使用任意数量的 `IO`，就像我们使用 `Try` 或其他副作用类型一样。\n\
    3.  为了辅助第 2 点，`IO` 类型类似于 `Try` 和 `Either`，但是加强版的。它们比那些类型强大得多，拥有大量的内置功能。\n\n##\
    \ 简短历史\n\n作为一段简短的历史，在早期，一些聪明人正试图弄清楚 I/O。长话短说，他们发明了一个叫做 `IO` 的概念。\n\n从概念上说，你可以把\
    \ `IO` 类型看作是一个接受泛型 `R` 数据类型并返回一个 `Either` 的函数。这是一种过度简化，但并没有过头：\n\n```scala\ndef\
    \ ZIO(r: R): Either[E, A]\n```\n\n# 51 IO 与代数代换\n\n关于 `IO` 类型（如 `ZIO`）的第一要点是——它们让你能够继续使用引用透明（RT）和代数代换（AS）的概念来理解你的代码。\n\
    \n## 引用透明是好的\n\n为了演示这一点，这里有一个名为 `stringLength` 的新函数：\n\n```scala\ndef stringLength(s:\
    \ String): Int = s.length\n```\n\n技术上 Scala 的 `String` 类型已经有了 `length` 方法，但现在忽略这一点，`stringLength`\
    \ 的重点在于它是一个纯函数。因此，在接下来的例子中，`fooLength` 和 `stringLength(\"foo\")` 将永远永远地具有完全相同的值（整数\
    \ `3`）：\n\n```scala\nval fooLength = stringLength(\"foo\")\n```\n\n现在现在你可以在代码的任何地方使用\
    \ `fooLength`、`stringLength(\"foo\")` 和值 `3`，它们将永远永远地具有相同的值并代表相同的含义。\n\n现在，与之对比的是像\
    \ `io.StdIn.readLine()` 这样的不纯方法：因为人们可以在命令行输入无限的内容，`io.StdIn.readLine()` 的返回值几乎总是不同的。\n"
- fmt: "\nThis means that `readLine` is NOT referentially transparent, and we cannot\
    \ use algebraic substitution with it. In the FP world this is *bad*, because we\
    \ want to write our code as algebra.\n\nSo, what can we do?\n\nThis is where the\
    \ Haskell people invented the `IO` type.\n\n# IO to the rescue\n\nThe way you\
    \ use an `IO` type is similar to `Try`, looking something like these two examples\
    \ in the most basic case:\n\n```scala\nval input: IO[String] = IO(io.StdIn.readLine())\n\
    ```\n\n```scala\ndef printLater(s: String): IO[Unit] = IO {\n  println(s)\n}\n\
    ```\n\nA key here is that `IO` is like a wrapper, and a *lazy* wrapper at that:\
    \ the code that you pass into `IO` isn’t executed *now*, it will be executed *some\
    \ time later*. This is even true in the first case, where I define `input` as\
    \ a `val` field.\n\n> Because `IO` is lazy, we’re still writing code as a blueprint.\
    \ *Right now* we describe what we want, and then some time *later* that code is\
    \ actually run.\n\nInstead of thinking of `IO` as a wrapper, you can think of\
    \ it as a box — and a bit of a time machine as well. Right now it doesn’t contain\
    \ anything, it’s just like a box with a label on it that describes *what will\
    \ be in it* some time later. You can imagine a label being on the box that says,\
    \ “Some time later this box will contain either (a) a `String` or (b) an error.”\n\
    \n> TIP: An `IO` is like getting a receipt from Amazon that “your package will\
    \ be delivered,” and some time later it will either (a) be delivered just fine\
    \ (the `Either` *happy* case), or (b) be damaged (`Either`’s *unhappy* case).\
    \ (It may also get lost, but that doesn’t fit with my analogy.)\n\nBut right now,\
    \ as mathematician or architect, you just think of it as an `IO`:\n\n```\n+------+\n\
    |  IO  |\n+------+\n```\n\nIf you’re familiar with a Scala `Future`, it’s similar\
    \ to a `Future`, with one big difference: a `Future` begins running immediately,\
    \ but `IO` is lazy, so nothing happens right now.\n\n## Laziness\n\nWe say that\
    \ code like this is *lazy*, or *lazily evaluated*. Haskell is famous for being\
    \ a language where everything is evaluated lazily. You can write all the Haskell\
    \ code you want, but nothing will happen until you issue the magic incantation\
    \ that says, “Run the code *now*.”\n\nConversely, all of the code I used to write\
    \ in Java was *strict*, or *strictly evaluated*. For example, when you write Java\
    \ code like this, it runs right now:\n\n```java\nString input = getInput();\n\
    ```\n\nFrankly, I wrote Java code like this for almost fifteen years, and didn’t\
    \ even know there was another way to write code.\n\n### Laziness helps with RT\n\
    \nWhat laziness does for us is that it lets us to keep thinking of our code as\
    \ algebra or a blueprint. We know that we’re working with an `IO` of a specific\
    \ type — such as an `IO[String]` — and then we merrily keep creating our blueprint,\
    \ because nothing happens now.\n\nFor instance, we can also write a `for` expression\
    \ using our lazy `IO` values, and again, nothing happens yet:\n\n```scala\nval\
    \ result = for\n  input <- readInputLater()\n  _     <- printLater(input)\nyield\n\
    \  ()\n```\n\nAs I mentioned, Haskell has a magic incantation that lets you say,\
    \ “Okay, I’m ready, run the blueprint now.” The Cats Effect and ZIO libraries\
    \ have a similar incantation, and historically that incantation has been a function\
    \ named something like `runUnsafe`. This means that when you’re ready to run your\
    \ entire application — or in this example, just this `for` expression — you run\
    \ it like this:\n\n```scala\nrunUnsafe(result)\n```\n\nThe actual function names\
    \ vary, but the word “unsafe” is an FP way of saying, “Hang on everyone, we’re\
    \ going to execute the blueprint now, including all those unsafe side effects.”\
    \ *Until now* everything was all equations and blueprints, and nothing happened,\
    \ but *now* it’s action time.\n\nAnd now, to wrap up this lesson, I want to add\
    \ two notes.\n\n# Note 1: Future is not like this\n\nFirst, it’s important to\
    \ be clear that the Scala `Future` *does not* work like this. For example, if\
    \ the earlier `input` value was written like this:\n\n```scala\nval input: Future[String]\
    \ = Future(doSomeSideEffect())\n```\n\nthe `doSomeSideEffect` function will be\
    \ run immediately. This is how `Future` works, it runs immediately.\n\nFrom an\
    \ FP standpoint, this is bad; it’s a design flaw. The flaw is that `Future` combines\
    \ the blueprint and its action in the same step. As FPers, we need to be able\
    \ to layout the blueprint without it starting to run while we’re still working.\
    \ As a mathematician/architect, we need to be able to separate the *what* from\
    \ the *when*, the description from the execution: `Future`’s action should only\
    \ be triggered some time later.\n\n# Note 2: Call-name\n"
