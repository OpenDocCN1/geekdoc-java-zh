  trans: "\n\n如果你将此书的 Github 仓库克隆到了本地计算机，要运行应用程序，只需要进入该仓库的 `ToDoList` 目录并运行此命令：\n\n\
    ```\n$ scala-cli .\n```\n\n这是 Scala CLI 的表达方式，意思是：“在本目录的源文件中查找 `main method`（主方法）。然后编译所有必要的代码，并运行该主方法。”\n\
    \n当你运行该命令时，你应该会看到应用如所示地提示你：\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo:\
    \ _`\n\n现在你可以测试它的命令，并根据需要修改代码。\n\n# 47. TDL: 经验总结\n\n在经历了编写字数计数（Word Count）应用程序以及待办事项（To-Do\
    \ List）应用程序之后，让我们回顾一下你看到的内容。\n\n在我开始时，我说这些是我们的编程的规则，我们只使用：\n\n*   不可变变量 (Immutable\
    \ variables)\n*   不可变数据结构 (Immutable data structures)\n*   纯函数 (Pure functions)\n\
    *   面向表达式的编程 (Expression-oriented programming)\n*   错误处理数据类型 (Error-handling data\
    \ types)\n*   每当我们访问外部世界时使用 `Try`\n\n由于这个示例只访问了一个扁文件数据库（由我们实现的），我也要求你发挥想象力，想象我们正在访问远程数据库或远程\
    \ REST 服务，这两者都可能在任何时候无法访问。\n\n> 我出于当时给出的理由违反了其中几条规则，即我想确保我编写了 Scala 初学者可以理解的代码。但如果你想看到正确的\
    \ Scala 解决方案，请参阅附录中的“Using”章节。\n\n但除了这些违反之处，我严格地遵守了这些规则，你也看到了应用程序是如何组合在一起的。\n\n\
    ## 总结时间\n\n此时，我的主要想法是，当这本书开始时，你可能还不习惯使用数据类型，但现在我们已经写了两个小型应用程序，你可能已经熟悉得多了。所以现在是一个很好的提问：你是否觉得所展示的所有技术都有好处？如果是的话，这些好处具体是什么？\n\
    \n## 好处\n\n对我来说，我演示的好处是：\n\n*   你知道你可以信任纯函数；它们的类型签名不会撒谎。\n*   当我查看函数签名并看到返回类型为\
    \ `Option`、`Try` 或 `Either` 时，我立刻就会想：“这个函数中可能会出问题”。\n*   当我看到一个函数签名 (a) 没有输入参数或\
    \ (b) 具有 `Unit` 返回类型时，我知道它正在执行某种副作用。\n*   即使我不知道函数的名称，当我查看它的签名时，我也可以对它可能做什么有一个很好的了解。\n\
    \n此外：\n\n*   阅读 EOP（面向表达式的编程）可以像代码一样简单：你将纯函数的结果绑定到一个代数变量上。代码易于编写、读取和测试。\n*   编写这样的代码就像在写代数，或者创建一个蓝图。\n\
    *   将表达式组合在一起就像组合代数方程。\n\n我从经验中知道的但在这里没有展示的其他事情：\n\n*   我知道不可变变量和不可变数据结构在并行和并发编程中是安全的。\n\
    *   我知道纯函数比执行副作用的方法更容易测试。\n\n关于测试的这一点，不纯函数可能会执行以下任何一种操作：\n\n*   读取输入，且不警告调用者。\n\
    *   写入输出，且不警告调用者。\n*   修改给定的参数。\n*   修改类内部的变量或全局参数。\n*   通过后门访问其他变量。\n\n正因为这些原因，在测试环境中设置它们的状态要困难得多：很难确切知道它们可能还会访问其他什么。\n\
    \n相反，对于纯函数——你知道它访问的唯一变量都是通过正门进来的，而且它没有副作用——你就知道设置它的测试环境将容易得多。\n\n## 关键点\n\n现在，这一切的一个关键点是，如果你一直跟着我——如果我展示的所有内容都很有道理——那么你\
    \ `真的, 真的接近函数式编程了`（functional programming）。可能比你想象的要近得多。\n\n我们只需要再走几步，我们将在下一步完成。\n\
    \n# 48. TDL: 使用 Either 代替 Try\n\n你学习路径的下一步是，我们现在把 TDL 应用中所有的 `Try` 实例替换为 `Either`\
    \ 实例。\n\n实际上，我不认为值得做*所有*这些替换。相反，我要做的仅仅是在 `Database` 类中替换它们，然后我想你可以想象如何在应用程序的其他部分使用这些内容。\n\
    \n所以，让我们开始吧，记住以下所有函数都在 `Database` 类内部：\n\n```\nclass Database(dbFilename: String):\n\
    \     // 所有函数都在这里\nend Database\n```\n\n## insert 函数\n\n我们写的第一个函数是 `insert` 函数，它目前看起来是这样的：\n\
    \n```scala\ndef insert(record: String): Try[Unit] =\n     writeToFile(List(record),\
    \ true)\n```\n\n所以我们的第一个任务是将那个 `Try` 替换为 `Either`。我们从更新 `insert` 的函数签名开始：\n\n\
    ```scala\ndef insert(record: String): Either[Throwable, Boolean] =\n     writeToFile(List(record),\
    \ true)\n```\n\n复习一下，记住 `Either` 返回一个 `Left` 或 `Right`，而 `Left` 持有错误，所以我写了 `insert`\
    \ 的返回类型：\n\n```scala\ndef insert(record: String): Either[Throwable, Boolean] =\n\
    ```\n*   `Either[Throwable, Boolean]`\n*   `Left`\n*   `Right`\n\n## writeToFile\n\
    \n`writeToFile` 函数目前看起来是这样的：\n\n```scala\nprivate def writeToFile(lines: Seq[String],\
    \ append: Boolean): Try[Unit]\n```\n\n并且我们知道它应该看起来这样：\n\n```scala\nprivate def\
    \ writeToFile(lines: Seq[String], append: Boolean): Either[Throwable, Boolean]\
    \ =\n  var bw: BufferedWriter = null\n  try\n    bw = BufferedWriter(File(dbFilename),\
    \ append)\n    for line <- lines do bw.write(s\"$line\\n\")\n    Right(true)\n\
    \  catch\n    case e: Throwable => Left(e)\n  finally\n    if bw != null then\
    \ bw.close\n```\n\n## selectAll\n\n同样，`selectAll` 的签名目前是这样的：\n\n我们再次将 `Try` 替换为\
    \ `Either`：\n\n```scala\ndef selectAll(): Either[Throwable, Seq[String]] =\n \
    \ var bufferedSource: scala.io.BufferedSource = null\n  try\n    bufferedSource\
    \ = Source.fromFile(dbFilename)\n    val lines = for line <- bufferedSource.getLines\
    \ yield line\n    Right(lines.toList())\n  catch\n    case t: Throwable => Left(t)\n\
    \  finally\n    if bufferedSource != null then bufferedSource.close\n```\n\n这里观察到的一点是，`selectAll`\
    \ 的签名有点复杂，因为它的 `Right` 参数是一个字符串列表，但现在我怀疑你可能已经习惯了这些类型（以及它们的价值）。以下是这些类型的拆解：\n\n\
    ```\nEither[Throwable, Seq[String]]\n ---------  -----------\n    ^          \
    \  ^\n  Possible     Success\n  Error        Value\n  In           In\n  Left\
    \         Right\n```\n\n如果你能读懂这个，你的表现很好。\n\n## delete\n\n最后，`delete` 函数目前返回这个\
    \ `Try`：\n\n```scala\ndef delete(indexToDelete: Int): Try[Int] = ...\n```\n\n"
- fmt: "\nand we want to replace it with this `Either`:\n\n```scala\ndef delete(indexToDelete:\
    \ Int): Either[Throwable, Int] = ...\n                                 ----------------------\n\
    ```\n\nFor the purpose of converting `delete` so it returns an `Either`, a simple\
    \ solution is to convert `maybeNumRowsDeleted` — which is currently a `Try` —\
    \ to an `Either`. You do that by calling `toEither` on `maybeNumRowsDeleted` at\
    \ the end of the function:\n\n```scala\ndef delete(indexToDelete: Int): Either[Throwable,\
    \ Int] =\n  val maybeNumRowsDeleted = for\n      rows           <- selectAll()\n\
    \      newRows        =  CollectionUtils\n                                   \
    \  .removeElementByIndex(rows, indexToDelete)\n      numRowsDeleted =  rows.size\
    \ - newRows.size\n      _              <- writeToFile(newRows, false)\n  yield\n\
    \      numRowsDeleted\n  maybeNumRowsDeleted.toEither   // <== THE CHANGE\n```\n\
    \nFortunately `Try` types have this `toEither` method, which makes the conversion\
    \ simple.\n\n# Keys\n\nSo there you have it, we rewrote the database functions\
    \ to use `Either` instead of `Try`. Because `Either` requires that you declare\
    \ both types the function can return, its signatures are a little longer to read,\
    \ but they’re also very explicit, and more flexible in how they work.\n\nAs a\
    \ reminder of what that last point means, in all of the database functions I declared\
    \ the `Left` type as an `Throwable`, but they could have returned a `String`,\
    \ an `enum`, or any other data type that makes the most sense for the current\
    \ problem.\n\nAnd this flexibility is very important for where we’re going next.\n\
    \n# 49 How Either Relates to ZIO\n\nAs I mentioned, if all of this continues to\
    \ make sense, you’re so close to FP right now, you can almost taste it. The truth\
    \ is this: if you can handle `Either`, you can handle FP.\n\n## A look at ZIO\n\
    \nIf you haven’t heard of it before, [ZIO](https://zio.dev) is one of the two\
    \ main FP libraries in the Scala community (along with the other, named [Cats\
    \ Effect](https://typelevel.org/cats-effect)). These two libraries power some\
    \ of the busiest websites on the internet, including Disney Streaming, Caesars,\
    \ and many other sites and applications here in 2022.\n\nWhat I mean when I say\
    \ “you’re so close to FP that you can taste it” is that if you look at the [ZIO\
    \ Overview document](https://zio.dev/overview) in November, 2022 — and pretty\
    \ much every other “introduction to ZIO” article on the internet — you’ll see\
    \ that all the authors start with a description like this:\n\n> Conceptually,\
    \ you can think of the `ZIO` type as being a function that takes a generic `R`\
    \ data type, and returns an `Either`.\n\nThat sentence means that conceptually\
    \ you can sketch a `ZIO` function signature to look like this:\n\n```scala\ndef\
    \ ZIO(r: R): Either[E, A]\n```\n\nWhile that code isn’t really how `ZIO` works,\
    \ the basic idea is that you can think of:\n\n*   The `ZIO` type as taking a generic\
    \ `R` type as an input parameter.\n*   It returns an `Either`.\n*   Inside the\
    \ `Either`, you see that it has two generic types in the `Left` and `Right` positions:\n\
    \n```text\nEither[E,     A]\n       ^      ^\n       Left  Right\n```\n\nThese\
    \ generic types are given the names `R`, `E`, and `A` for very specific reasons:\n\
    \n*   `R` stands for the environment that is passed in. Basically if your code\
    \ requires some sort of environment, like a database, input/output, or even a\
    \ clock, you pass in the dependencies your code needs as the `R` parameter. (It\
    \ may help to think of this parameter being named `D`, for dependencies.)\n* \
    \  `E` is the usual `Either` error-handling type, i.e., the type in the `Left`\
    \ position. Having seen `Either` in the previous lessons, you already know what\
    \ this means. (As usual, think of it as the “unhappy” result.)\n*   Similarly,\
    \ `A` is the success data type that you really want, i.e., the type in the `Right`\
    \ position.\n\nThis flexibility is very important for where we’re going next.\n\
    \n# 50 What is IO?\n\nFast-forward to today, there are three important things\
    \ to know about `IO`:\n\n1.  They were created to handle side-effects in a pure\
    \ way. \n2.  One thing I haven’t mentioned yet is that you can use as many `IO`s\
    \ as you need, just like we’ve used `Try` or other side-effect types. own3.  To\
    \ help with Item 2, `IO` types are like `Try` and `Either`, but on steroids. They\
    \ are much more powerful than those types, with tons of built-in features.\n\n\
    ## A bit of history\n\nAs a wee bit of history, back in the early days, some smart\
    \ people were trying to figure out I/O. Long story short, they invented a concept\
    \ called `IO`.\n\nConceptually, you can think of the `IO` type as being a function\
    \ that takes a generic `R` data type, and returns an `Either`. This is an oversimplification,\
    \ but not too much:\n\n```scala\ndef ZIO(r: R): Either[E, A]\n```\n\n# 51 IO and\
    \ Algebraic Substitution\n\nThe first key about `IO` types — such as `ZIO` — is\
    \ that they let you continue to reason about your code using the concepts of referential\
    \ (RT) and algebraic substitution (AS).\n\n## Referential transparency is good\n\
    \nTo demonstrate this, here’s a new function named `stringLength`:\n\n```scala\n\
    def stringLength(s: String): Int = s.length\n```\n\nTechnically the Scala `String`\
    \ type already has that `length` method, but ignoring that for now, the important\
    \ part of `stringLength` is that it’s a pure function. Therefore, in this next\
    \ example, `fooLength` and `stringLength(\"foo\")` will always and forever have\
    \ the exact same value (the integer `3`):\n\n```scala\nval fooLength = stringLength(\"\
    foo\")\n```\n\nSo now anywhere in your code you can use `fooLength`, `stringLength(\"\
    foo\")`, and the value `3`, and they will always and forever have the same value\
    \ and mean the same thing.\n\nNow contrast that with an impure method like `io.StdIn.readLine()`:\
    \ because people can type an infinite number of things at the command line, the\
    \ return value of `io.StdIn.readLine()` will almost always be different.\n"
