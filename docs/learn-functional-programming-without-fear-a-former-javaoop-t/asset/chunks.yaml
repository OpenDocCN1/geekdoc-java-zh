    # 54\. Bonus: The Mindset of an FPer


    Oops, wait, Iâ€™m still writing. :)


    I started this book by saying that it has an audacious goal: to demonstrate to
    OOP developers the benefits of:


    1.  Immutable variables (algebraic variables)


    2.  Immutable data structures


    3.  Pure functions


    4.  Expression-oriented programming


    5.  Functional error handling


    As I went along in creating the examples, you also saw the additional benefits
    of declaring *data types*: that they make the signatures of pure functions incredibly
    meaningful.


    After we finished the *To-Do List* example and switched some of that code from
    using `Try` to using `Either`, I then showed how this gets you ready to use the
    â€œIOâ€ types in the ZIO and Cats Effect libraries.


    ## The mindset of an FPer


    As you dig into ZIO and Cats Effect, remember a few things:


    *   The *biggest* thing is that FPers think of ourselves as mathematicians or
    architects, writing algebraic code or creating blueprints.


    *   Terms like *equations* and *blueprints* imply that the *description* of our
    code is separate from the *execution* of the code. (As I mentioned, FPers donâ€™t
    like `Future` because it begins running immediately.)


    *   Writing FP code is all about immutable variables, immutable data structures,
    pure functions, with data types and functional error handling that tells readers
    exactly whatâ€™s going on â€” all of which youâ€™ve seen in this book.


    *   *Side effects* mess up our equations and blueprints, so we donâ€™t allow them.
    Instead we handle them with types like `Option`, `Try`, and `Either` â€” and when
    we really get into FP we use the more industrial-strength `IO` and `ZIO` types.


    *   I mentioned that you canâ€™t mix types like `Option`, `Try`, and `Either`
    inside `for` expressions, so thatâ€™s one reason a type like `ZIO` has so many
    capabilities: whatever your `ZIO`s do individually, you can combine them all together,
    as desired.


    These are the ways that FPers think about their code. If you understand the reasoning
    and desires behind this mindset, you can understand FP.


    # 55\. Bonus: The M Word


    Were you expecting to see *monads* in this book? If so, you wonâ€™t be disappointed.
    :)


    Almost all of the data types I showed in this book are monads. This includes `Option`,
    `Try`, `Either`, `List`, `Seq`, `Vector`, `IO`, and `ZIO`: theyâ€™re all monads,
    or what we call *monadic data types*.


    I wonâ€™t get into mathematical theory here, but *in Scala*, a monad is primarily
    a data type that properly implements `map` and `flatMap` methods so that it can
    be used in `for` expressions. Thereâ€™s a little more to it than that, but from
    an implementation standpoint, thatâ€™s the big thing. As Iâ€™ve shown, you can
    use `flatMap` to run a few effects in sequence, and `for` expressions to run many
    effects in sequence.


    > And as I show in [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book),
    `for` expressions are syntactic sugar that compile down to a series of `flatMap`
    calls followed by a single `map` call.


    ## Sequential composition


    The key about monads in any language is that they allow you to guarantee that
    effects will occur in order (i.e., sequentially). For example, Haskell is a *lazy*
    (or *lazily evaluated*) programming language, and part of what that means is that
    whenever the Haskell compiler sees that it can run expressions in parallel, it
    might just do that.


