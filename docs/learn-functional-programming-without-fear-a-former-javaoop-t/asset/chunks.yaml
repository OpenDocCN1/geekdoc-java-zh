    \    \"an\" -> 210\n)\n```\n\nand we want it to look like this:\n\n```scala\n\
    Map(\n    \"the\" -> 543,\n    \"an\" -> 210,\n    \"or\" -> 99\n)\n```\n\nSo\
    \ we need a function that takes a `Map[String, Int]` as input, and also returns\
