    # 告别恐惧学习函数式编程


    一位前 Java/OOP 老师将通过一本小书，带你进入 Scala FP 库的大门。Alvin Alexander。


    # 目录


    * 版权所有

    * 本书的目标

    * 关于我

    * 欢迎！

    * 内容与大纲

    * 初探 Java/OOP 代码与数据类型

    * Java/OOP 总结

    * Java/OOP 代码真的那么简单？统计学视角

    * 我的学习 Scala 之路

    * JIT: 不变实体

    * JIT: 纯函数

    * JIT: 我爱纯函数，它们不会撒谎

    * JIT: 表达式导向编程 (EOP)

    * 示例 #1：使用纯函数和 EOP 解决问题

    * 还有一点：代数替换

    * 快速了解并行编程

    * 回顾：Java/OOP 对比纯函数

    * 对 wc 程序的修改

    * 函数式错误处理 (FEH)](#

    * TDL: 数据库类


    所有权利保留。未经作者书面许可，切勿复制本书的任何部分。


    本书仅供教学目的使用。尽管作者已尽力编写本书，但作者对内容的准确性或完整性不作任何形式的陈或担保，不承担任何形式的责任，并特别声明不提供任何关于销性或特定用途适用性的暗示性担保。对于因本文包含的信息或程序直接或间接导致（或声称导致）的任何损失、偶然或后果损害，作者对任何个人或实体均不承担责任。使用此类信息的风险由您自担。


    版本 1.0，于 2022 年 11 月 5 日发布。


    购买书籍并反馈问题：[alvinalander.com/scala/learn-functional-programming-book](https://alvinalander.com/scala/learn-functional-programming-book)


    ## 其他书籍


    Alvin Alexander 的其他书籍：


    * [Scala Cookbook](https://amzn.to/3du1pMR) (700+ 页)

    * 畅销且高分的书籍：[Functional Programming, Simplified](https://alvinalander.com/scala/functional-programming-simplified-book)
    (同样 700+ 页)

    * 我的新作：[Learn Scala 3 The Fast Way!](https://amzn.to/3L4YwR4)


    ## 感谢


    我想感谢每一位让 Scala 成为如此优秀的编程语言的人。编写关于它的内容是一件很有趣的事。


    我还要感谢 Sriram Natarajan，他在本书的早期版本中自愿写了三页精彩的评论。


    我还要感谢我的妻子，因为至少没有她的支持，这本书绝对是不可能实现的。


    最后，我应该感谢所有让我保持脚踏实地的朋友和家人。如果不是因为你们，我可能还在阿拉斯加的山脉里冥想呢。:)


    # 1. 本书的目标


    本书有一个雄心勃勃的目标：尽可能简单地演示以下内容的用处：


    *   不变变量（代数变量）

    *   不变数据结构

    *   纯函数

    *   表达式导向编程

    *   函数式错误处理


    本书的前提是，一旦你熟悉了这些概念，你就会发现自己正在编写函数式编程 (FP) 代码。在书末，我通过展示几个使用 `ZIO` 的示例来演示这一点，`ZIO`
    是 Scala 两个主要的 FP 库之一（另一个是 `Cats Effect`）。


    更明确地说：本书让你准备好开始 `ZIO` 和 `Cats Effect`。当你读完这本书后，你应该能够查看它们的文档并想：“啊，我知道他们在做什么，以及为什么要这样做。”


    ## 面向 OOP 开发者：Java、Kotlin、Python 等


