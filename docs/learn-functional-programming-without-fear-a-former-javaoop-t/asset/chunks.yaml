    # Appendix B. The Scala REPL


    With most programming languages having REPL environments â€” Javaâ€™s `jshell`,
    Kotlinâ€™s playground, Pythonâ€™s shell, etc. â€” Iâ€™ll just quickly cover the
    Scala REPL.


    The acronym *REPL* stands for â€œread/evaluate/print/loop,â€ and the Scala REPL
    is an interactive tool that lets you experiment with Scala code. I refer to it
    as a *playground* or *laboratory*, because itâ€™s a place where you can run experiments
    on Scala code to make sure it works like you expect it to.


    Start the REPL at the command line with Scala CLI like this:


    `$ scala-cli repl`


    Or, if you have the [Scala 3 SDK](https://www.scala-lang.org/download) installed
    on your system, start it like this:


    `$ scala`


    In either case you should see something like this:


    `Welcome to Scala 3.1.1`


    `Type in expressions for evaluation. Or try :help.`


    `scala> _`


    Now you can start experimenting with Scala code:


    `scala> val x = 1`


    `x: Int = 1`


    `scala> val y = 2`


    `y: Int = 2`


    `scala> x + y`


    `res0: Int = 3`


    As shown in those examples:


    *   You generally create new variables in Scala with the `val` keyword (but can
    also use `var` for mutable variables).


    *   `x` and `y` are the names of two variables that I created.


    *   After you press the `[Enter]` key, the REPL output shows the result of your
    expression, including any variable names, their data type (such as `Int`), and
    value.


    *   If you donâ€™t assign a variable name, as in the third example, the REPL creates
    its own variable, beginning with the name `res0`, then `res1`, etc. You can then
    use these variable names just as though you had created them yourself:


    `scala> res0 * 3`


    `res1: Int = 9`


    The REPL is a great place to experiment, and most Scala developers have a REPL
    session running every day.


    Besides variables, you can enter any legal Scala code:


    `scala> def add(i: Int, j: Int): Int = i + j`


    `def add(i: Int, j: Int): Int`


    `scala> add(2, 2)`


    `val res2: Int = 4`


    ## A few tips


    *   The REPL has tab completion. (Ex: type `"hi".` and then `[Tab]`).


    *   Quit a REPL session with `:quit` or `[Control][d]`.


    *   Thereâ€™s a more powerful Scala REPL named *Ammonite*. Start it like this:


    `$ scala-cli repl --amm`


    There are other alternatives:


    *   [Scastie](https://scastie.scala-lang.org) is a website that works like the
    REPL, or a worksheet


    *   VS Code and IntelliJ IDEA both have worksheets


