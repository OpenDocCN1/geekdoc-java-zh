    *   Lets you easily include third-party libraries in apps and scripts, such as
    using `HTTP`, `JSON`, and `HTML` libraries for working on the internet, along
    with testing libraries (so you can include tests in your code)

    *   Lets you export your project configuration details to build tools like `Sbt`
    or `Mill`, once it feels too large for Scala CLI.


    At the time of this writing there is also an effort to make Scala CLI the official
    Scala command (`scala`). I don’t know if that will come to complete fruition,
    but if it does, you’ll be in great shape.


    Because I use `Scala CLI` in this book, I want to share a little “cheat sheet”
    of how to use its basic features here.


    > NOTE: At the time of this writing, Scala CLI is at version 0.1.12, so be aware
    that some of the following features may change over time.


    ## Compiling and running applications


    If you have an application with an `@main` method named `hello` in a file named
    `Hello.scala`, and you want to run that application, this is how you run it:


    `$ scala-cli Hello.scala`


    That command both *compiles* and *runs* your application in one step. If instead
    you want to do those in separate steps, do this:


    `$ scala-cli compile Hello.scala`


    `$ scala-cli run hello`


    You can also *continuously compile* your code with the `--watch` parameter:


    `$ scala-cli compile Hello.scala --watch`


    ## Compiling and running scripts


    Scala CLI currently makes a distinction between Scala *applications*, which are
    in `.scala` files, and Scala *scripts*, which are in files that end with the `.sc`
    extension. A main difference between the two is that a script doesn’t have to
    have an `@main` method; it can just consist of a series of statements and expressions.


    To demonstrate how to run a script, here’s a script named `MyScript.sc` that consists
    of just one line:


    `args.foreach(println)`


    In a Scala CLI script, the `args` variable is implicitly made available to you,
    so you can access command-line arguments. This is how you run that script:


    `$ scala-cli MyScript.sc -- hello world`


    `hello`


    `world`


    Notice that the `--` characters are required before your command-line arguments.


    ## ‘using’ directives


    One of the great things about Scala CLI is its concept of “‘using` directives.”
    These directives give you a way to control how your code will be run, including
    specifying what Scala version is used, and what third-party libraries your application
    uses.


    You add these directives with this special syntax, which must be put in your script
    or application before any other Scala code:


    `//> using scala "3"`


    With this directive at the top of your file, when you run your application with
    `scala-cli`, it sees this line and then interprets the rest of your code using
    the latest version of *Scala 3* (such as Scala 3.1.1, for example).


    In addition to specifying which Scala version should be used, you can also specify
    the dependencies your application requires. For example, I use these two directives
    at the beginning of some HTTP `GET` and `POST` scripts I share in my book, [Learn
    Scala 3 The Fast Way](https://amzn.to/3L4YwR4):


    `//> using scala "3"`


    `//> using lib "com.softwaremill.sttp.client3::core::3.7.2"`


    `// the rest of the Scala code follows ...`


    There are many more things you can do with `using` directives. See the [Scala
    CLI website](https://scala-cli.virtuslab.org/) for more details.


    ## Even more


    On top of these basics there’s *much* more that Scala CLI can do for you. In addition
    to what I’ve shown, you can:


    *   Create self-enclosed scripts

    *   Include multiple dependencies

    *   Declare specific Scala versions to use (such as 2.12.15 or 3.1.1)

    *   Run tests

    *   Create small projects

    *   Integrate with your IDE

    *   Package your applications

    *   More!


    For all those details, see the [Scala CLI website](https://scala-cli.virtuslab.org).


    # Appendix D. Classes That Use Generic Types


    As with other programming languages, a *generic parameter* in Scala is a placeholder
    for *concrete* data types that will later be supplied in the position where the
    generic type is declared.


    This is one of those situations where it’s easiest if you just jump right into
    the pool, so I’ll start with this example:


    `class Box[A](val item: A)`


    That’s probably the simplest possible class you can create that has a generic
    constructor parameter. It defines a class named `Box` with a single constructor
    parameter named `item`, which has the generic type `A`. Notice that Scala requires
    you to declare generic types in brackets before the list of constructor parameters:


    `class Box[A](val item: A)`

    `---`


    Then, in the parameter list, this is how you say that when an instance of `Box`
    is created, `item` can be any type:


    `class Box[A](val item: A)`

