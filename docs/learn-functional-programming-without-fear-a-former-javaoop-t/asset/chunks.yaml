  trans: "\n可以理解为：“大括号内的所有内容都是一个代码块。在该块内部，首先处理用户的输入。然后，当函数返回时，再次调用 `mainLoop`。”\n\n\
    现在 `mainLoop` 再次被调用，它启动了一个 `for` 表达式，它的第一步是再次提示用户输入。\n\n而且这是一个需要知道的关键点：\n\n> 当你处理不可变变量并需要执行循环时，你应该使用递归来代替。\n\
    \n在其他“循环”场景下，你可以使用 Scala 的集合方法来代替递归，但对于像这种情况，递归是答案。\n\n## 完整的 'main' 代码\n\n现在我们可以查看完整的\
    \ `main` 方法。我在这里添加的唯一新内容是对 `mainLoop` 的初始调用，以让程序运行起来。我在代码底部附近用注释说明了这一点。\n\n```scala\n\
    @main\n\ndef ToDoList =\n    val db = Database(\"./ToDoList.dat\")\n    val processor\
    \ = InputProcessor(db)\n    def mainLoop(): Try[Unit] =\n        for\n       \
    \     _     <- promptUser()\n            input <- readInput()\n            _ \
    \    <- {\n                        handleUserInput(input)\n                  \
    \      mainLoop()\n                    }\n     yield\n        ()\n    // 这启动程序的运行：\n\
    \    mainLoop()\nend ToDoList\n```\n\n注意，我在 `ToDoList` 函数内部定义了 `mainLoop`，这是我们应用程序的“主方法”。并没有必要在\
    \ `ToDoList` 内部定义 `mainLoop`，但我这样做是为了向你展示你可以用 Scala 编写的其他操作。\n\n这段代码的工作原理是：\n\n\
    * Scala 在 `ToDoList` 方法之前看到了 `@main`，并将其识别为主方法\n* 主方法是应用程序的入口点，因此该函数开始运行\n* 前几行被读取\n\
    * `mainLoop` 函数的定义被读取\n* `mainLoop` 函数作为 `ToDoList` 的最后一行执行，这启动了提示用户并读取其输入的进程\n\
    \n现在我们已经有了循环，可以回去继续处理用户的输入工作了。\n\n# 38. InputProcessor 类\n\n由于“输入处理”可以被视为一个整体——一个概念——我将创建一个\
    \ `InputProcessor` 类来处理所有的输入处理：\n\n```scala\nclass InputProcessor\n```\n\n此外，因为我知道这段代码将需要我的数据库函数，我会将其作为一个构造参数添加：\n\
    \n```scala\nclass InputProcessor(db: Database)\n```\n\n并且因为我知道数据库函数返回 `Try` 错误处理数据类型，我在代码中添加了该\
    \ `import` 语句：\n\n```scala\nimport scala.util.{Try, Success, Failure}\n\nclass\
    \ InputProcessor(db: Database)\n```\n\n## 处理用户输入\n\n现在我们需要一个 `handleUserInput`\
    \ 函数。我之前创建了一个只包含 `println` 语句的占位函数，但现在我将展示它真正需要做什么，我把它放在了 `InputProcessor` 类中：\n\
    \n```scala\nclass InputProcessor(db: Database):\n    def handleUserInput(input:\
    \ String): Try[Unit] = input match\n        case \"q\" =>\n            ???\n \
    \       case \"h\" =>\n            ???\n        case \"v\" | \"l\" =>\n      \
    \      ???\n        case add if add.startsWith(\"a \") =>\n            ???\n \
    \       case del if del.startsWith(\"d \") =>\n            ???\n        case _\
    \ =>\n            ???\n    end handleUserInput\n    // hơn 代码 ...\nend InputProcessor\n\
    ```\n\n如所示，我的计划是使用 `match` 表达式来处理用户可以输入的不同命令。在在该表达式内部，每个 `case` 处理用户可以输入的不同命令（注意：还有其他处理这种情况的方法，但我试图保持代码简单）。\n\
    \n所以现在接下来的任务是实现这些 `case` 的每一个代码（或者 Scala 中使用 `match` 表达式来实现模式匹配。）\n\n> 这里需要注意的一点是，`InputProcessor`\
    \ 类拥有 `db` 构造参数——它是 `Database` 类的实例——所有这些函数都可以访问该 `db` 参数。此外，该实例在传递到此类之前，已经在主方法中完全初始化了。\n\
    \n# 39. TDL UI：实现 handleUserInput\n\n既然我们知道需要一个 `handleUserInput` 函数，让我们开始编写它吧。按照惯例，我从函数签的的草图开始，我们在课程中已经知道了：\n\
    \n`def handleUserInput(input: String): Try[Unit]`\n\n这个函数需要根据用户输入分支到不同的方向。正如我在\
    \ To-Do List 介绍中所示，它被编写为接受这些命令：\n\n* `q`，退出\n* `a`，添加新项目\n* `d`，删除项目\n* `h`，显示帮助\n\
    * `v` 或 `l`（小写 `L`），列出项目\n\n在其他语言中你可能会用 `if`/then`/else` 结构来处理这些，在 Scala 中你可以这样做，但也有另一种方法：`match`\
    \ 表达式。`match` 表达式允许你对给定值进行模式匹配，当 `match` 作为函数体时，它的工作方式是像这样开头：`def handleUserInput(input:\
    \ String): Try[Unit] = input match`\n\n这相当于说：“我们正准备对 `input` 变量执行一些模式匹配。”\n\n\
    然后你要的是开始编写想要匹配的 `cases`。对于我们的函数，我们知道想要匹配哪些字符串，所以我像这样草拟了这些 cases：\n\n```scala\n\
    def handleUserInput(input: String): Try[Unit] = input match\n    case \"q\" =>\n\
    \        ???\n    case \"h\" =>\n        ???\n    case \"v\" | \"l\" =>\n    \
    \    ???\n    case add if add.startsWith(\"a \") =>\n        ???\n    case del\
    \ if del.startsWith(\"d \") =>\n        ???\n    case _ =>\n        ???\n```\n\
    \n信不信，这实际上就是完整的函数体，只是我们现在需要填充那些 `???` 区域。\n\n## 解释 cases\n\n这里是对每个 `case` 的简要讨论。前两个\
    \ `case` 最简单的，它们可以理解为：“当你看到这个完全相同的字符串时，执行 `=>` 符号右侧的操作：\n\n```scala\ncase \"q\"\
    \ =>\ncase \"h\" =>\n```\n\n所以如果 `input` 是 `\"q\"`，则执行第一件事，但如果它是 `\"h\"`，则执行第二件事。\n\
    \n> 就像其他编程语言一样，像 `\"q\"` 和 `\"h\"` 这样的字符串被称为字符串字面量。\n\n第三个 `case` 与前两个类似，但可以理解为：“如果\
    \ `input` 是 `\"v\"` 或 `\"l\"`，执行 `=>` 符号右侧的操作：\n\n```scala\ncase \"v\" | \"l\"\
    \ =>\n```\n\n使用这种语法连接任意数量的选项，所以如果你也想接受 `\"s\"`（代表 show），就写：\n\n```scala\ncase\
    \ \"v\" | \"l\" | \"s\" =>\n```\n\n在下一个模式中，情况变得有趣起来：\n\n`case add if add.startsWith(\"\
    a \") =>`\n\n这并不是这种语法的完美用例，但目前你可以将其理解为：“从变量 `input` 创建一个变量 `add`，如果字符串 `add` 以字母\
    \ `a` 后接空格开头，执行 `=>` 符号右侧的操作。”然后你在表达式的右侧使用变量 `add`。\n\n这种语法真正大放异彩的地方在于你创建一个与 `input`不同的\
    \ `add` 时。虽然我们在这里不需要这样做，但我想将其作为 Scala 工具箱技巧技巧展示。\n\n```scala\ncase del if del.startsWith(\"\
    d \") =>\n```\n\n最后一个 `case` 看起来像这样，意思是“匹配所有其他”：\n\n```scala\ncase _ =>\n```\n\
    \n所以如果 `input` 不匹配之前的任何 `case`，控制就会来到这个 `case`，`=>` 符号右侧的任何内容都将被执行。这是一个“全捕” `case`，在我们的代码中，当用户输入允许命令之外的任何内容时，控制就会来到这里。\n\
    \n"
- fmt: "\nIn Scala, the `=>` used to be called the \"rocket\" symbol by some people,\
    \ though that never really caught on. But as I describe it in my other books,\
    \ it’s really a *transformer* symbol. Whenever you see it, it means that the thing\
    \ on the left is being transformed into the thing on the right, so in `match`\
    \ expressions we match the cases on the left, and transform them into the values\
    \ on the right of the `=>`.\n\n## Remember EOP\n\nIt’s also important to remember\
    \ that every line of code in Scala is an expression. So with `match` expressions,\
    \ those values on the right side of each `=>` are the values that are returned\
    \ from the expression.\n\nIn this function, because I already declared that the\
    \ function returns `Try[Unit]`:\n\n```scala\ndef handleUserInput(input: String):\
    \ Try[Unit]\n                                     ---------\n```\n\nthis means\
    \ that my expectation is that every expression on the right side of those `=>`\
    \ symbols will return `Try[Unit]`. We’ll see how that works as we implement each\
    \ of those cases in the following lessons.\n\n# 40. TDL UI: Handling “Quit”\n\n\
    The first thing to do in `handleUserInput` is to handle the “quit” case. Basically\
    \ all we have to do is call `System.exit(0)` when we see that the user has typed\
    \ the letter `\"q\"`. However, because `handleUserInput` returns `Try[Unit]`,\
    \ we need to wrap that call in a `Try`, like this:\n\n```scala\ndef handleUserInput(input:\
    \ String): Try[Unit] = input match\n    case \"q\" =>\n        Try(System.exit(0))\
    \     // <== THE NEW CODE\n    // more cases here ...\n```\n\nBecause `System.exit`\
    \ returns `Unit`, this works as desired.\n\n## A Scala REPL tip\n\nNote that you\
    \ can use the Scala REPL’s `:type` command to verify that `System.exit` returns\
    \ `Unit`:\n\n```scala\nscala> :type System.exit(0)\nUnit\n```\n\nSo that’s all\
    \ we have to do for the “Quit” use case.\n\n# 41. TDL UI: Handling “Help”\n\n\
    Another relatively simple `case` we can knock out is the “Help” use case. This\
    \ is when the user types the letter `\"h\"` to see our help text.\n\nBecause we\
    \ implemented the `showHelp` function in the `IOHelper` object earlier, and because\
    \ that function returns `Try[Unit]`, all we have to do is call it in our second\
    \ `case` statement:\n\n```scala\ndef handleUserInput(input: String): Try[Unit]\
    \ = input match\n    case \"q\" =>\n        Try(System.exit(0))\n    case \"h\"\
    \ =>\n        IOHelper.showHelp()     // <== THE NEW CODE\n```\n\nThat function\
    \ prints our “help text” to STDOUT using `println` statements — and because that\
    \ function follows our rule that any time we reach into the outside world, we\
    \ return `Try` — that function “just works” here.\n\n# 42. TDL UI: Handling “View”\n\
    \nNext up, the “View” use case is a little more complicated than the first two.\
    \ Basically this code needs to attempt to read the database and then take one\
    \ of two possible actions from there:\n\n*   In the success case, it prints the\
    \ list of to-do items\n*   In the failure case, it prints an error message about\
    \ the database being inaccessible\n\nThis is straightforward to do because we\
    \ already wrote the `selectAll` database method previously, and it returns a `Try`\
    \ value, so we just need to handle its `Success` and `Failure` cases in a `match`\
    \ expression.\n\nHere’s the code that does what I just described, with a few comments\
    \ to make those steps clear:\n\n```scala\ndef handleView(): Try[Unit] = Try {\n\
    \    // attempt to read all the tasks from the database.\n    // this function\
    \ returns a list of strings, wrapped inside\n    // a Try:\n    val res: Try[Seq[String]]\
    \ = db.selectAll()\n    // handle the Success and Failure cases:\n    res match\n\
    \        case Success(tasks) =>\n            // in the Success case we get a list\
    \ of tasks (strings),\n            // so print those out in a nice format:\n \
    \           printTasks(tasks)\n        case Failure(t) =>\n            // in the\
    \ Failure case, where we can’t access the database,\n            // print the\
    \ exception (a Throwable) we get from selectAll:\n            System.err.println(t)\n\
    }\nprivate def printTasks(tasks: Seq[String]): Unit =\n    for\n        (task,\
    \ count) <- tasks.zip(Stream from 1)\n    do\n        println(s\"${count}. $task\"\
    )\n```\n\nHere’s a shorter version of `handleView`, without the comments:\n\n\
    ```scala\ndef handleView(): Try[Unit] = Try {\n    val res: Try[Seq[String]] =\
    \ db.selectAll()\n    res match\n        case Success(tasks) =>\n            for\n\
    \                (task, count) <- tasks.zip(Stream from 1)\n            do\n \
    \               println(s\"${count}. $task\")\n        case Failure(t) =>\n  \
    \          System.err.println(t)\n}\n```\n\nNote that the cases of the `match`\
    \ expression print to STDOUT and STDERR, so they both have return type `Unit`.\
    \ And because the entire function body is wrapped in a `Try` constructor:\n\n\
    ```scala\ndef handleView(): Try[Unit] = Try { // body here }\n```\n\nthis means\
    \ that both cases of this function correctly result in returning the `Try[Unit]`\
    \ type.\n\nAgain, if any of this seems like overkill, remember to imagine that\
    \ we’re accessing a remote database or REST service, and in the real world, those\
    \ things may be down.\n\n# 43. TDL UI: Handling “Add”\n\nNext up, the “Add” use\
    \ case is a little bit more complicated. Going back to our UI, we know that when\
    \ a user wants to add a new task, they type things like this with the `a` command:\n\
    \n`a wake up`\n`a brush teeth`\n`a take a long shower`\n\nSo the first thing we\
    \ need to do is to separate that *add* command — the letter `a` — from the rest\
    \ of the string. Thanks to the power of Scala’s collections methods, we do this\
    \ with the `drop` method that’s available on all strings:\n\n*   `\"a wake up\"\
    .drop(2)` // \"wake up\"\n*   `\"a brush teeth\".drop(2)` // \"brush teeth\"\n\
    *   `\"a take a long shower\".drop(2)` // \"take a long shower\"\n\nThe `drop`\
    \ method is available because a `String` is also a list, specifically a `Seq[Char]`.\n\
    \nThis approach seems to work well, giving us a string that we can pass to another\
    \ function, so that function can add the string to our database. So, looking only\
    \ at the “add” case, I write this:\n\n```scala\ncase add if add.startsWith(\"\
    a \") =>\n    handleAdd(add.drop(2))\n```\n\n## handleAdd\n\nSo now I need to\
    \ write a `handleAdd` function, and I know three things about it already:\n\n\
    *   It’s going to take a `String` as input\n*   It needs to add/insert that task\
    \ into our database\n*   Because it’s going to access the database, it needs to\
    \ return a `Try`\n\nTherefore, I can start to sketch its signature like this:\n\
    \n```scala\ndef handleAdd(task: String): Try\n```\n\nAnd because I wrote the database\
    \ code earlier, I know that `handleAdd` just needs to have a reference to the\
    \ database object so it can perform the insert. Recall that this function is inside\
    \ the `InputProcessor` class, which I defined to take a `Database` reference,\
    \ like this:\n\n```scala\nclass InputProcessor(db: Database)\n```\n\nSo now `handleAdd`\
    \ has access to this `db` reference.\n\nThis is one situation where it’s acceptable\
    \ for a function to have a *side door*: when that function is declared inside\
    \ a class that has a reference like this. (However, if you don’t like this, there\
    \ are other ways to write this code to make sure a `Database` reference is passed\
    \ in through the function’s front door (i.e., its input parameter list)).\n\n\
    Getting back to the `handleAdd` function, I know that (a) I want to call the `insert`\
    \ function on the `db` reference, and (b) it returns a `Try[Unit]`. So now I write\
    \ `handleAdd` like this:\n\n```scala\ndef handleAdd(taskName: String): Try[Unit]\
    \ =\n    db.insert(taskName)\n```\n\nAt this point, this `case` code in the `match`\
    \ expression inside the `handleUserInput` function could be the end of the `case`:\n\
    \n```scala\ncase add if add.startsWith(\"a \") =>\n    handleAdd(add.drop(2))\n\
    ```\n"
