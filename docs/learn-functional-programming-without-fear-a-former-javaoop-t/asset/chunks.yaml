    )\n    promptUser()\n```\n\n此时，我忽略了 `promptUser` 返回 `Try` 的事实，但我很快会回到这个问题。在此之前，让我们写一个函数来读取用户的输入。\n\
    \n# 31. TDL UI: 读取输入\n\n要从用户处读取输入，我们使用 `scala.io.StdIn` 数据类型中的 `readLine` 函数。同样——假设我们正在\
    \ REST 服务中读取输入——我们知道想要返回一个 `Try`：\n\n```scala\ndef readInput(): Try\n```\n\n因为\
    \ `readLine` 返回一个 `String`，所以函数返回 `Try[String]`，完整的函数看起来如下：\n\n```scala\ndef readInput():\
