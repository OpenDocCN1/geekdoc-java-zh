  trans: "\n在 Scala 中，`=>` 曾被一些人称为“火箭”符号，尽管这种称法并没有真正流行。但正如我在我的其他书中描述的那样，它实际上是一个*转换器*（transformer）符号。每当你看到它时，它意味着左侧的内容正在被转换为右侧的内容，因此在\
    \ `match` 表达式中，我们匹配左侧的分支（cases），并将它们转换为 `=>` 右侧的值。\n\n## 记住 EOP（表达式结束）\n\n同样重要的一点是，Scala\
    \ 中的每一行代码都是一个表达式。因此，对于 `match` 表达式，每个 `=>` 右侧的值就是该表达式返回的值。\n\n在这个函数中，由于我之前已经声明了该函数返回\
    \ `Try[Unit]`：\n\n```scala\ndef handleUserInput(input: String): Try[Unit]\n  \
    \                                   ---------\n```\n\n这意味着我的预期是这些 `=>` 符号右侧的每一个表达式都会返回\
    \ `Try[Unit]`。我们将在接下来的课程中通过实现每个用例，来看看它是如何运作的。\n\n# 40. TDL UI：处理“退出 (Quit)”\n\n\
    在 `handleUserInput` 中要做的第一件事是处理“退出”分支。基本上，我们要做的就是在看到用户输入了字母 `\"q\"` 时，调用 `System.exit(0)`。然而，由于\
    \ `handleUserInput` 返回的是 `Try[Unit]`，我们需要将该调用封装在 `Try` 中，如下所示：\n\n```scala\ndef\
    \ handleUserInput(input: String): Try[Unit] = input match\n    case \"q\" =>\n\
    \        Try(System.exit(0))     // <== 新代码\n    // 这里还有更多分支 ...\n```\n\n由于 `System.exit`\
    \ 返回的是 `Unit`，所以这种运行符合预期。\n\n## 一个 Scala REPL 小贴士\n\n注意，你可以使用 Scala REPL 的 `:type`\
    \ 命令来验证 `System.exit` 返回的是 `Unit`：\n\n```scala\nscala> :type System.exit(0)\n\
    Unit\n```\n\n这就是我们在“退出”用例需要做的所有工作。\n\n# 41. TDL UI：处理“帮助 (Help)”\n\n我们可以完成的另一个相对简单的\
    \ `case` 分支是“帮助”用例。当用户输入字母 `\"h\"` 来查看我们的帮助文本时。\n\n由于我们之前在 `IOHelper` 对象中实现了 `showHelp`\
    \ 函数，而且该函数返回 `Try[Unit]`，我们所做的就是在在第二个 `case` 语句中调用它：\n\n```scala\ndef handleUserInput(input:\
    \ String): Try[Unit] = input match\n    case \"q\" =>\n        Try(System.exit(0))\n\
    \    case \"h\" =>\n        IOHelper.showHelp()     // <== 新代码\n```\n\n该函数使用 `println`\
    \ 语句将我们的“帮助文本”打印到标准输出（STDOUT）——而且由于该函数遵循我们的规则，即每当我们访问外部世界时，都会返回 `Try`——所以该函数在这里“能够正常工作”。\n\
    \n# 42. TDL UI：处理“视图 (View)”\n\n接下来，“视图”用例比前两个稍微复杂一点。基本上，这段代码需要尝试读取数据库，然后从那里采取两种可能的操作之一：\n\
    \n*   在成功的情况下，它会打印待办事项列表\n*   在失败的情况下，它会打印一条关于数据库无法访问的错误信息\n\n这很容易就能实现，因为我们之前已经写了\
    \ `selectAll` 数据库方法，并且它返回一个 `Try` 值，所以我们只需要在 `match` 表达式中处理它的 `Success` 和 `Failure`\
    \ 分支即可。\n\n下面是实现我刚才描述的代码，带有一些注释以使这些步骤清晰：\n\n```scala\ndef handleView(): Try[Unit]\
    \ = Try {\n    // 尝试从数据库读取所有任务。\n    // 此函数返回一个字符串列表，封装在 Try\n    // 内部：\n   \
    \ val res: Try[Seq[String]] = db.selectAll()\n    // 处理 Success 和 Failure 分支：\n\
    \    res match\n        case Success(tasks) =>\n            // 在 Success 分支中，我们得到了一个任务列表（字符串），\n\
    \            // 所以以良好的格式打印它们：\n            printTasks(tasks)\n        case Failure(t)\
    \ =>\n            // 在 Failure 分支中（即无法访问数据库时），\n            // 打印从 selectAll 获取的异常（Throwable）：\n\
    \            System.err.println(t)\n}\nprivate def printTasks(tasks: Seq[String]):\
    \ Unit =\n    for\n        (task, count) <- tasks.zip(Stream from 1)\n    do\n\
    \        println(s\"${count}. $task\")\n```\n\n这是一个不带注释的 `handleView` 简短版本：\n\n\
    ```scala\ndef handleView(): Try[Unit] = Try {\n    val res: Try[Seq[String]] =\
    \ db.selectAll()\n    res match\n        case Success(tasks) =>\n            for\n\
    \                (task, count) <- tasks.zip(Stream from 1)\n            do\n \
    \               println(s\"${count}. $task\")\n        case Failure(t) =>\n  \
    \          System.err.println(t)\n}\n```\n\n注意，`match` 表达式的分支打印到标准输出（STDOUT）和标准错误（STDERR），因此它们的返回类型都是\
    \ `Unit`。由于整个函数体都被封装在一个 `Try` 构造函数中：\n\n```scala\ndef handleView(): Try[Unit]\
    \ = Try { // 函数体在此 }\n```\n\n这意味着该函数的两个分支都能正确导致返回 `Try[Unit]` 类型。\n\n再次，如果任何操作出现问题，请想象我们正在访问远程数据库或服务，在现实世界中这些是可能的。\n\
    \n# 43. TDL UI：处理“添加 (Add)”\n\n接下来，“添加”用例比之前的稍微复杂一点。回到 UI，我们知道当用户想要添加新任务时，他们会输入如下内容来触发\
    \ `add` 命令：\n\n`a wake up`\n`a brush teeth`\n`a take long shower`\n\n我们要第一件事是将这个*添加*命令与字符串的其余部分分离。得益于\
    \ Scala 的集合方法，我们可以使用 `drop` 方法来实现这一点：\n\n*   `\"a wake up\".drop(2)` // \"wake\
    \ up\"\n*   `\"a brush teeth\".drop(2)` // \"brush teeth\"\n*   `\"a take long\
    \ shower\".drop(2)` // \"take long shower\"\n\n`drop` 方法是因为 `String` 也是一个列表，具体来说是\
    \ `Seq[Char]`。\n\n这种方法看起来良好，可以将字符串传递给另一个函数，以便该函数将字符串添加到我们的数据库。所以，只看“添加”分支，我这样写：\n\
    \n```scala\ncase add if add.startsWith(\"a \") =>\n    handleAdd(add.drop(2))\n\
    ```\n\n## handleAdd\n\n现在我们需要编写 `handleAdd` 函数，我已经知道了关于它的三点信息：\n\n*   它将接收一个 `String`\
    \ 作为输入\n*   它需要将该任务插入我们的数据库\n*   因为它将访问数据库，所以它需要返回 `Try`\n\n因此，我可以开始勾勒它的签名：\n\n\
    ```scala\ndef handleAdd(task: String): Try\n```\n\n由于我之前已经写了数据库代码，我知道 `handleAdd`\
    \ 只需要一个数据库对象的引用即可执行插入。记住这个函数是在 `InputProcessor` 类内部，该类被定义为接收一个 `Database` 引用，如下：\n\
    \n```scala\nclass InputProcessor(db: Database)\n```\n\n现在 `handleAdd` 可以访问这个 `db`\
    \ 引用。\n\n在这种情况下，函数拥有*侧门*是可以接受的：即该函数声明在一个此类引用的类内部。（但是，如果你不喜欢，还有其他编写此代码的方法来确保 `Database`\
    \ 引用是通过函数的正门（即其输入参数列表）传入的）。\n\n回到 `handleAdd` 函数，我知道 (a) 我想要调用 `db` 引用的 `insert`\
    \ 函数，(b) 它返回 `Try[Unit]`。现在我们这样写 `handleAdd`：\n\n```scala\ndef handleAdd(taskName:\
    \ String): Try[Unit] =\n    db.insert(taskName)\n```\n\n此时，`handleUserInput` 函数中\
    \ `match` 表达式的这个分支代码可以作为该分支的结束：\n\n```scala\ncase add if add.startsWith(\"a \"\
    ) =>\n    handleAdd(add.drop(2))\n```\n"
- fmt: "\nHowever, because I know from testing the application that I want to see\
    \ what my tasks look like after I issue my `add` command, I know that I also need\
    \ to run the `view` function now. Therefore, I add it after `handleAdd`:\n\n```scala\n\
    case add if add.startsWith(\"a \") =>\n    handleAdd(add.drop(2))\n    handleView()\n\
    ```\n\nAnd because `handleView` returns `Try[Unit]`, the return type of this `case`\
    \ matches the return type of `handleUserInput`. So now `handleUserInput` has these\
    \ cases in its `match` expression:\n\n```scala\ndef handleUserInput(input: String):\
    \ Try[Unit] = input match\n    case \"q\" =>\n        Try(System.exit(0))\n  \
    \  case \"h\" =>\n        IOHelper.showHelp()\n    case \"v\" | \"l\" =>\n   \
    \     handleView()\n    case add if add.startsWith(\"a \") =>    // <== THE NEW\
    \ CODE\n        handleAdd(add.drop(2))\n        handleView()\n    // more cases\
    \ here ...\n```\n\n# 44. TDL UI: Handling “Delete”\n\nThe “Delete” use case is\
    \ very similar to the “Add” case, but instead of having a string after the `a`\
    \ command, there will be an integer after the `d` command. To be clear, delete\
    \ commands look like this:\n\n```text\nd 1\nd 3\n```\n\nThose commands mean, “Delete\
    \ the first task” and “Delete the third task,” respectively.\n\n## Handling the\
    \ input\n\nJust like the last lesson, the first thing we need to do is to separate\
    \ the delete command — the letter `d` — from the rest of the string. Again we\
    \ do this with the `drop` method:\n\n```scala\n\"d 1\".drop(2)    // \"1\"\n\"\
    d 3\".drop(2)    // \"3\"\n```\n\nand then we use this approach to pass that string\
    \ to a `handleDelete` function:\n\n```scala\ncase del if del.startsWith(\"d \"\
    ) =>\n    handleDelete(del.drop(2))\n```\n\n## handleDelete\n\nNow I need to write\
    \ a `handleDelete` function, and I already know three things about:\n\n- It’s\
    \ going to take a `String` as input\n- It needs to attempt to delete that task\
    \ from the database, using the task-id that the user sees\n- Because it’s going\
    \ to access the database, it probably needs to return a `Try`\n\nTherefore, I\
    \ can start to sketch its signature like this:\n\n```scala\ndef handleAdd(taskIdString:\
    \ String): Try\n```\n\nBecause this function takes a string that represents the\
    \ task-id that the user sees — such as `\"1\"` or `\"3\"` — the function’s algorithm\
    \ should be:\n\n- Attempt to convert the given string to an integer.\n- If that\
    \ fails, the function should short-circuit at that time.\n- If the conversion\
    \ works, subtract `1` from that value to get the real index. This is because Scala\
    \ lists are 0-based, just like arrays and lists in other programming languages.\
    \ (What I mean by this is that the user sees the first task as number `1`, so\
    \ they type that. And that `1` corresponds to index `0` of a sequence.)\n- This\
    \ function should return the number of rows that are deleted. Because I’m only\
    \ letting users delete one task, this should always be `1`.\n- As usual, because\
    \ we’re accessing the outside world, the function should return a `Try` that wraps\
    \ that integer.\n\nHere’s the implementation of that algorithm, with a few comments\
    \ added:\n\n```scala\ndef handleDelete(taskIdString: String): Try[Int] = Try {\n\
    \    // convert the input String to an Int. this attempt will throw\n    // an\
    \ exception if this fails, so the code will short-circuit\n    // here, and a\
    \ Failure will be returned, wrapped around the\n    // exception:\n    val taskId\
    \ = taskIdString.toInt\n    // the task-id we show starts with 1, so subtract\
    \ 1 here,\n    // because sequences are 0-based:\n    val maybeCount = db.delete(taskId\
    \ - 1)\n    maybeCount.get\n}\n```\n\nAnd to make it easier to read, here’s that\
    \ function again without all those comments:\n\n```scala\ndef handleDelete(taskIdString:\
    \ String): Try[Int] = Try {\n    val taskId: Int = taskIdString.toInt\n    val\
    \ maybeCount = db.delete(taskId - 1)\n    maybeCount.get\n}\n```\n\nI almost never\
    \ call the `get` method on a `Try` value, but I do it for two reasons:\n\n- `handleDelete`\
    \ function is wrapped in a `Try`, so it will return a `Failure` if `get` throws\
    \ an exception. And if it throws an exception, that means something went inside\
    \ `delete`.\n- I believe the code is relatively easy to read for someone who’s\
    \ new to Scala\n\nAs usual, you can shorten that function, if desired:\n\n```scala\n\
    def handleDelete(taskIdString: String): Try[Int] = Try {\n    val taskId: Int\
    \ = taskIdString.toInt\n    db.delete(taskId - 1).get\n}\n```\n\n## Back to handleUserInput\n\
    \nAnd with `handleDelete` now working, its `case` *could* be finished here:\n\n\
    ```scala\ncase del if del.startsWith(\"d \") =>\n    handleDelete(del.drop(2))\n\
    ```\n\nBut again, I know that I want to see my list of to- items after a delete\
    \ command, so I add the `handleView` call here:\n\n```scala\ncase del if del.startsWith(\"\
    d \") =>\n    handleDelete(del.drop(2))\n    handleView()\n```\n\nAnd because\
    \ `handleView` returns `Try[Unit]`, the return type of this `case` matches the\
    \ return type of `handleUserInput`. Now `handleUserInput`’s `match` expression\
    \ has these cases:\n\n```scala\ndef handleUserInput(input: String): Try[Unit]\
    \ = input match\n    case \"q\" =>\n        Try(System.exit(0))\n    case \"h\"\
    \ =>\n        IOHelper.showHelp()\n    case \"v\" | \"l\" =>\n        handleView()\n\
    \    case add if add.startsWith(\"a \") =>\n        handleAdd(add.drop(2))\n \
    \       handleView()\n    case del if del.startsWith(\"d \") => // <== THE NEW\
    \ CODE\n        handleDelete(del.drop(2))\n        handleView()\n    // more cases\
    \ here ...\n```\n\nNow we just have one more `case` to handle.\n\n# 45. TDL UI:\
    \ Handling the Catch-All Case\n\nLastly, we just need to handle the “Catch-All”\
    \ case. This is the case where the user types in something other than the previous\
    \ commands that we handle in our `match` expression.\n\nThere are at least two\
    \ ways to handle unknown commands:\n\n- Show an error message\n- Show our help\
    \ text\n\nI’ll take the first option, showing an error message.\n\n## Handling\
    \ the case\n\nFirst, I add a new `handleUnknown` function to this default, catch-all\
    \ `case`:\n\n```scala\ncase _ =>\n    handleUnknown()\n```\n\nBecause I don’t\
    \ care what the user typed, I wrote a `handleUnknown` function there, and pass\
    \ no parameters to it. But if you want to be nicer than this, you can give this\
    \ case a name — a variable name, actually — and then access that variable on the\
    \ right side of the `=>` symbol:\n\n```scala\ncase whateverTheyTyped =>\n    handleUnknown(whateverTheyTyped)\n\
    ```\n\nHowever, I’m just going to ignore whatever they typed and show an error\
    \ message.\n\n## handleUnknown\n\nWe know that `handleUnknown` has no input parameters,\
    \ so I start to sketch its signature like this:\n\n```scala\ndef handleUnknown()\n\
    ```\n\nNext, because this function just prints an error message, I also know that\
    \ it returns a `Try[Unit]`:\n\n```scala\ndef handleUnknown(): Try[Unit]\n```\n\
    \nNow all I just need to implement the function body. Again, it’s easiest to wrap\
    \ the body inside a `Try` constructor, and because I’m printing an error message\
    \ I use `System.err.println` instead of just `println`:\n\n```scala\ndef handleUnknown():\
    \ Try[Unit] = Try {\n    System.err.println(\"Dude, I don’t know what that means.\"\
    )\n}\n```\n\nSo that’s the `handleUnknown` function. I can leave it as-is inside\
    \ its `case`:\n\n```scala\ncase _ =>\n    handleUnknown()\n```\n\nOr I can also\
    \ call `handleView` after it, if that feels like the right thing to do:\n\n```scala\n\
    case _ =>\n    handleUnknown()\n    handleView()\n```\n\nNow that all these cases\
    \ and the functions they call are implemented, the `handleUserInput` function\
    \ is complete:\n\n```scala\ndef handleUserInput(input: String): Try[Unit] = input\
    \ match\n    case \"q\" =>\n        Try(System.exit(0))\n    case \"h\" =>\n \
    \       IOHelper.showHelp()\n    case \"v\" | \"l\" =>\n        handleView()\n\
    \    case add if add.startsWith(\"a \") =>\n        handleAdd(add.drop(2))\n \
    \       handleView()\n    case del if del.startsWith(\"d \") =>\n        handleDelete(del.drop(2))\n\
