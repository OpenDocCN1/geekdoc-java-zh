    anyone who looks at this code now knows that this is a `Map` thatâ€™s sorted by
    value. Thatâ€™s pretty cool.


    *And then* you can also take this a step further and make that function signature
    look like this:


    `MapSortedByValueDesc[Word, Count]`


    Whoa, thatâ€™s *extremely* cool. With these new names, anyone who walks in off
    the street can tell exactly whatâ€™s going on with that `Map`. And this can all
    be done with Scala.


    As I discuss in the [Scala Cookbook (2nd Edition)](https://amzn.to/3du1pMR), this
    sort of naming process is used in *Domain-Driven Design*, and it makes your types
    more meaningful.


    This also makes for an interesting question: If you walked into someoneâ€™s code
    base, which of these options would you rather see for this particular problem,
    and why:


    *   `Map[String, Int]`


    *   `VectorMap[String, Int]`


    *   `MapSortedByValueDesc[String, Int]`


    *   `MapSortedByValueDesc[Word, Count]`


    The answer is entirely up to you, BUT, I encourage you to form an opinion about
    it. You can also show it to some fellow developers and ask them what theyâ€™d
    rather see, and why.


    ## All done!


    At this point weâ€™re done. Well, at least weâ€™re done sketching out the pure
    functions we need to solve this problem. All we have to do now is to write the
    algorithms for the bodies of those functions.


    *Up until now* was the time to think about function signatures. *Now* is the time
    to think about how to implement those algorithms.


    Iâ€™d say that Iâ€™ll leave that as â€œan exercise for the reader,â€ but you can
    find those functions implemented in this bookâ€™s Github repository.


