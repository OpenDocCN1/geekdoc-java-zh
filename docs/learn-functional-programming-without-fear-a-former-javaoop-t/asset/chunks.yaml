    ## From String to Seq[String]


    Now our `String` should be free of punctuation characters, with each word separated
    by a single blank space. So the next step is to transform it into a list of words,
    which in Scala can be represented as a `Seq[String]`, `List[String]`, or `Vector[String]`.
    Once we have this list of words, we can later convert it to a `Map` of word counts.


    > `Seq`, `List`, and `Vector` are all immutable lists (sequences) that are suited
    for slightly different purposes, but as long as weâ€™re working with a relatively
    small document, any of them will work.


    Therefore, this function takes a `String` as input and returns a `Seq[String]`,
    so its signature looks like this:


    `def convertStringToListOfWords(s: String): Seq[String]`


    and when I add it to `wc`, its body now looks like this:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    val stringWithoutFormatting =`


    `        stripFormattingCharacters(stringWithoutNewlines)`


    `    val stringWithSingleBlanks =`


    `        squeezeBlankSpaces(stringWithoutFormatting)`


    `    val listOfWords =`


    `        convertStringToListOfWords(stringWithSingleBlanks)`


    `    ...`


    ## Convert words to the same case


    Now that we have a list of words, we need to do one more thing: Either (a) convert
    them all to the same case â€” lowercase or uppercase â€” or (b) perform a case-insensitive
    comparison of them later on when we count the words. We need to do this to make
    sure we count words like â€œDoâ€ and â€œdoâ€ as the same word.


    Being lazy, Iâ€™ll change all the words to lowercase now. And because weâ€™re
    now working with a `Seq[String]` â€” our list of words â€” Iâ€™ll sketch this
    function to take a `Seq[String]` as input, and also return a `Seq[String]`:


    `def lowerCaseAllWords(listOfWords: Seq[String]): Seq[String]`


    With this addition, our `wc` function looks like this:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    val stringWithoutFormatting =`


    `        stripFormattingCharacters(stringWithoutNewlines)`


    `    val stringWithSingleBlanks =`


    `        squeezeBlankSpaces(stringWithoutFormatting)`


