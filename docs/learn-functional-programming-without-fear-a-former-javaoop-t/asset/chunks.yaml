    accesses come in through the front door, and it has no side effects â€” you know
    that setting up its test environment will be much easier.


    ## Key point


    And now a key point of all of this is that if youâ€™re still with me â€” if everything
    Iâ€™ve shown makes sense â€” you are *really, really close to functional programming*.
    Probably much closer than youâ€™re thinking.


