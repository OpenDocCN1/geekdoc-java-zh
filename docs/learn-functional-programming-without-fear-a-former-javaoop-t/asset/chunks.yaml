  trans: "\n\n*   `TDL`: 以 `TDL` 开头的章节意味着该章节与 `To-Do List`（待办列表）应用程序有关。\n\n## 大纲\n\
    \n接下来，如果你想知道这本书其余部分将要涉及的内容，请阅读以下大纲，它就像是后续内容的一份地图。\n\n相反，如果你**不想**知道我们将进入什么领域，并且更倾向于保持惊喜，请跳过本章的剩余部分。\n\
    \n大纲的内容如下：\n\n*   我首先回顾了自己过去在 `Java/OOP` 中很少使用数据类型\n*   然后我对比了我在 `Scala/OOP` 和\
    \ `Scala/EOP` 中**确实**使用了多少数据类型\n\n之后，我将展示：\n\n*   使用数据类型并不是坏事，事实上，这是一件非常好的事情\n\
    *   不可变对象（变量和数据结构）的重要性\n*   纯函数的重要性：特别是你可以信任它们，因为它们绝不会撒谎\n*   不可变对象和纯函数的概念自然地引向了\
    \ EOP\n\n然后我将展示如何使用这些概念编写一个 `Word Count`（字数统计）应用程序。在编写该程序的过程中，我们将发现其他一些事情。\n\n\
    之后，我会对 `Java/OOP` 代码与你在 `Word Count` 示例中看到的 `Scala/EOP` 代码进行简单回顾。\n\n随后，我们将进入下一个重要主题：函数式错误处理：\n\
    \n*   我将解释函数式错误处理背后的原理\n*   我们将查看 Scala 的三种`错误处理数据类型`：`Option`、`Try` 和 `Either`\n\
    *   我将展示如何使用 `Try` 实现 `Word Count` 应用程序\n*   然后我们将使用所有概念构建一个更大的 `To-Do List`（待办列表）应用程序\n\
    *   该应用程序使用了模拟数据库，因此你可以看到在访问远程数据库或 `REST API` 时将使用的技术\n\n最后，我将向你展示使用如 `ZIO` 和\
    \ `Cats Effect` 等 FP 库**离你有多近**。\n\n现在，如果你准备好了，让我们开始吧！\n\n# 5. 回顾 Java/OOP 代码与数据类型\n\
    \n在我的 `Java` 编程时代，我很少使用泛型数据类型，事实上，我几乎不考虑过数据类型。为了说明这一点，我将回到我常用的示例之一：为披萨店编写一个收银点应用程序。\n\
    \n在继续之前，有两点：\n\n*   `Java` 和 `Scala` 中的 `generic`（泛型）类型通常是方法声明中使用的字符，如 `T` 或 `A`。你使用泛型类型表示：“在这里使用的具体类型稍后填充。”例如，`Scala`\
    \ 中的 `List[A]` 之后可以是 `List[Int]`、`List[String]` 等。随着书籍的深入，我将编写更多关于泛型的内容。\n*  \
    \ 在这些示例中，请注意我的 `Java` 代码可能并非 100% 正确。我没有将这些代码放入 IDE 中或尝试编译它们。因为我假设你熟悉 `Java` 或其他的\
    \ `OOP` 语言，我的意图只是快速演示我多年多年的 `Java/OOP` 方法。\n\n## 建模披萨店应用程序\n\n### 一些枚举\n\n为了开始为披萨店建模收银点应用程序，我首先需要我的枚举：\n\
    \n```\nenum Topping {\n  Cheese,\n  Pepperoni,\n  BlackOlives\n}\n```\n\n```\n\
    enum CrustSize {\n  Small,\n  Medium,\n  Large\n}\n```\n\n```\nenum CrustType\
    \ {\n  Regular,\n  Thin,\n  Thick\n}\n```\n\n### 披萨类\n\n基于这些，让我们创建一个 `Pizza` 类。但在此之前，让我们列出\
    \ OOP 披萨的属性和行为。属性基本上是我用那些枚举列出的内容：\n\n*   饼底尺寸\n*   饼底类型\n*   配料类型\n\n行为对应于这些：\n\
    \n*   添加配料\n*   移除配料\n*   设置饼底尺寸\n*   设置饼底类型\n\n如果我也保留价格相关的信息，披萨还可以计算自己的价格，但由于配料和饼底属性并不带有价格，这基本上就是这个\
    \ `Pizza` 的所有行为了。\n\n在经过几次练习后，我知道我想让披萨中所有与食物相关的项目——面包棒、汽水等——都继承自一个基础 `Product`\
    \ 类：\n\n```\npublic interface Product {}\n```\n\n在现实世界中，`Product` 将具有成本等属性，可能还有销售价格，但为了本次练习，我将将其留为标记接口（marker\
    \ interface）。\n\n鉴于这个 `Product` —— 以及我 `Pizza` 的属性和行为，`Java/OOP` 类的初始代码如下：\n\n\
    ```\npublic class Pizza implements Product {\n  private List<Topping> toppings\
    \ = new ArrayList<>();\n  private CrustSize crustSize;\n  private CrustType crustType;\n\
    \n  public Pizza(CrustSize crustSize, CrustType crustType) {\n    this.crustSize\
    \ = crustSize;\n    this.crustType = crustType;\n  }\n}\n```\n\n该 `Pizza` 类将包含以下一系列\
    \ getter 和 setter 方法，其类型签名如下：\n\n```\npublic CrustSize getCrustSize()\npublic\
    \ CrustType getCrustType()\npublic List<Topping> getToppings()\npublic void setCrustSize(CrustSize\
    \ crustSize)\npublic void setCrustType(CrustType crustType)\npublic void setToppings(List<Topping>\
    \ toppings)\n```\n\n> *type signature*（类型签名）一词指的是函数的 (a) 输入参数和 (b) 返回类型。\n\n###\
    \ 讨论\n\n这里需要注意的是，这些都是简单的代码。getter 不接受任何输入参数并返回基本数据类型，而 setter 都返回 `void`。我写这样的\
    \ `Java` 代码超过了 12 年。\n\n事实上，如果我写更多代码（例如一个 `Order` 类），你会发现这种模式是相同的，都是非常简单的代码：\n\
    \n```\npublic class Order {\n  private List<Product> lineItems = new ArrayList<>();\n\
    \  public Order() {}\n  public void addItem(Product p)\n  public void removeItem(Product\
    \ p)\n  public List<Product> getItems()\n  public String getPrintableReceipt()\n\
    \  public BigDecimal getTotalPrice()\n}\n```\n\n在那段代码中，我最接近使用泛型类型的就是这些类型：\n\n\
    *   `List<Topping>`\n*   `List<Product>`\n\n# 6. Java/OOP 总结\n\n所以，这快速回顾了我在教 `Java`\
    \ 课程时使用的 `Java/OOP` 代码。当然，我展示的并不多，仅足以传达基本思想。\n\n## 总结第一部分\n\n总结一下你看到的代码：\n\n*\
    \   我的 `Java/OOP` 代码没有泛型类型\n*   许多方法返回 `void`\n*   许多方法没有输入参数\n*   我**总是**使用可变数据结构\n\
    *   可变数据结构是像 `ArrayList` 这样可以调整大小且其元素可以更新的结构。我们说这种结构可以被*变异*（mutate），意思就是“改变”。\n\
    \n## 总结第二部分\n\n关于这段代码还有一些事情可以说明，请记住，我只是在讨论自己的代码。\n\n**要点 1**：我在编写 `Java/OOP` 代码时并没有意识到，但所有那些返回\
    \ `void` 且不接受输入参数的方法都会扭曲你的大脑。你无法通过类型签名判断方法的作用，所以你要么 (a) 信任方法命名良好，要么 (b) 你必须查看源代码来看它们在做什么。\n\
    \n为了说明我的意思，**我曾信任自己的代码**，因为我知道所有的 getter 和 setter 都只是样板代码。但有一次当我与一名新手开发者调试问题时，发现他写了这样的\
    \ setter 方法：\n\n```\npublic void setFoo(Foo newFoo) {\n  openTheGarageDoor();\n\
    \  walkTheDog();\n  buyGroceries();\n  solveWorldPeace();\n  this.foo = newFoo\
    \ + 1;\n}\n```\n\n它并没有那么详尽，但里面确实**有很多**操作。请记住，这一切都发生在一个具有这种类型签名的“简单 setter 方法”之中：\n\
    \n```\npublic void setFoo(Foo newFoo)\n```\n\n我从中吸取的教训是：\n\n*   该开发者需要更多的培训\n\
    *   我不能信任方法类型签名，我必须查看代码\n\n"
- fmt: "\n**POINT 2:** A second point that I don’t show in my pizza example is that\
    \ many `Java` methods can throw exceptions, and when they can, you have to think\
    \ about (a) handling the \"success\" case, and (b) handling the \"failure\" case,\
    \ which for me meant wrapping the method call with `try`/`catch`.\n\nThis gets\
    \ to be ridiculously hard on the brain, so I got to the point that — using the\
    \ Model/View/Controller (MVC) paradigm — I only handled exceptions with my top-level\
    \ controllers. I logged exceptions at the point they occurred, but then just let\
    \ them bubble up to my controllers, and handled them there.\n\nAt that time I\
    \ didn’t know anything about functional programming, and I couldn’t think of a\
    \ better way to deal with potential errors — invalid data, servers being down,\
    \ etc. — so that’s how I dealt with exceptions.\n\nFor more details on my MVC\
    \ approach, see my blog posts:\n\n*   [A terrific MVC diagram](https://alvinalexander.com/uml/uml-model-view-controller-mvc-diagram/)\n\
    *   [Model/View/Controller definitions and examples](https://alvinalexander.com/uml/model-view-controller-mvc-definitions-examples/)\n\
    *   [A Java Model View Controller example](https://alvinalexander.com/ooa-ood/java-model-view-controller-mvc-example-1/)\n\
    \n# 7. Is Java/OOP Code That Simple? A Statistical Look\n\nAs I write this book,\
    \ I haven’t actually written `Java` code in quite some time now, and knowing that\
    \ my memory isn’t always accurate, I wondered, “Was my code really that simple?€\n\
    \nTo verify everything I just shared with you, I searched three old `Java` codebases\
    \ — all projects that were in production in their day. I just did a simple search\
    \ for the `<.*>` pattern — to find any data types like `<String>`, `<String, Integer>`,\
    \ etc. — and found these percentages of occurrences within `*.java` files in those\
    \ three projects:\n\n```\nUSAGE %    LINES FOUND    TOTAL NUMBER OF LINES\n-------\
    \    -----------    ---------------------\n  0.2         118                74,200\n\
    \  1.4         686                49,189\n  1.2         313                27,083\n\
    ```\n\nSo out of about 150,000 lines of `Java/OOP` code, there are 1,117 lines\
    \ with a `<.*>` pattern, for a total percentage of 0.74%. (Note that those line-count\
    \ numbers include blanks lines and comment lines, so the actual percentages are\
    \ higher.)\n\nI then manually looked through all of those `<.*>` lines of output,\
    \ and found that these were the two most difficult lines to read:\n\n```\nSortedMap<String,\
    \ Integer> wordCountMap = new TreeMap();\npublic Class<?> getColumnClass(int columnIndex)\
    \ {\n```\n\n## Coming soon…\n\nSo, without any further comment at this point,\
    \ that’s a look at using data types in some `Java/OOP` code.\n\nIn just a few\
    \ chapters we’ll start looking at some `Scala` code — specifically how to solve\
    \ problems with `Scala` and pure functions. But before we get to that, I need\
    \ to introduce a wee bit of background material that will help that approach make\
    \ sense.\n\n# 8. My Path to Learning Scala\n\nBefore we jump into some `Scala`\
    \ code, it’s important to mention how I learned `Scala`. My timeline looked like\
    \ this:\n\nI had taught `Java` and `OOP` classes for several years. I owned a\
    \ small consulting company, and we wrote `Java/OOP` code for most of our clients,\
    \ and provided training and mentoring services to them as well.\n\nOut of personal\
    \ curiosity, I started learning a little `Python`, and even more `Ruby`. I liked\
    \ `Ruby` (and `Ruby on Rails`), and then really loved `JRuby`, which let me use\
    \ `Java` libraries while writing `Ruby` code.\n\nThen a friend showed me the [Learn\
    \ You a Haskell for Great Good!](http://amzn.to/1POaUCv) book, but after the basic\
    \ intro stuff in that book, I had no idea what the author was talking about. Things\
    \ like [typeclasses](https://docs.scala-lang.org/scala3/book/types-type-classes.html)\
    \ totally eluded me, and I gave up on FP as anything other than a curiosity.\n\
    \nIn late 2010 I had sold my company and was wandering around Alaska, and discovered\
    \ `Scala`. Not knowing any better, I started using it as a “better Java€, meaning\
    \ that I wrote `OOP` code with `Scala` (i.e., `Scala/OOP`).\n\nI also spent a\
    \ lot of time trying to use the `Java` collections classes in `Scala`, which was\
    \ a horrible waste of time. Not because you can’t use them — you can — but if\
    \ you do that, you’re not embracing the style and best practices that `Scala`\
    \ brings to the table.\n\n> It’s like the time a friend started working with `Java`,\
    \ and having a background in Visual Basic, he tried to write VB code in `Java`.\
    \ You do something that because you’re comfortable with VB, but you’re not embracing\
    \ Java; you’re just writing VB code with Java’s language constructs.\n\nAs time\
    \ went on I found the book, [Programming in Scala](https://amzn.to/3eqkTzi), and\
    \ learned about Martin Odersky’s idea of `Scala` being a fusion of OOP and FP.\
    \ (I also learned that Mr. Odersky was considered the “father of the Java generics\
    \ compiler.€)\n\nAs I tried to implement the concepts in that book, I started\
    \ mixing pure functions into my `OOP` code. I saw that pure functions were GREAT\
    \ because (a) output depended only on input, and (b) there were no side effects.\
    \ They were easy to write, read, and test.\n\nI also learned that error-handling\
    \ data types like `Option`, `Try`, and `Either` were terrific alternatives to\
    \ throwing exceptions. I no longer had to think about exceptions short-circuiting.\n\
    \nAs time went on I found the book, [Programming in Scala](https://amzn.to/3eqkTzi),\
    \ and learned about Martin Odersky’s idea of `Scala` being a fusion of OOP and\
