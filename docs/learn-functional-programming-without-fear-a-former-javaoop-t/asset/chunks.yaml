  trans: "\n\n你真的需要确保你的“提示用户”代码发生在“读取其输入”代码之前：\n\n```\nval input = readInput()\n```\n\
    \n为了使其具有意义，这些操作必须按顺序发生，一个接一个执行。在 Haskell 中，你使用它的 `do` 结构来确保表达式按顺序运行；而在 Scala 中，你同样在\
    \ `for` 表达式中对它们进行顺序化，如下所示：\n\n```\nfor\n  _     <- promptUser()\n  input = readInput()\n\
    \  // 这里有更多代码 ...\n```\n\n如果你记得 `ZIO` 类型是一个“描述并发工作流的蓝图”，你应该想：“如果 `promptUser`\
    \ 和 `readInput` 同时运行，我需要使用 `for` 表达式或 `flatMap` 来确保这两个函数按照正确的顺序被调用。”\n\n正因如此，有些人将单子\
    \ ad（monads）称为“函数式编程中的分号”。它们让我们以保证的顺序运行副作用，因此即使我们的函数旨在并行运行，`flatMap` 和 `for` 表达式也能保证它们是有顺序执行的，就像过程化代码一样。\n\
    \n# Scala 中的 Monad\n\n但再次强调，Scala 的关键在于这些单子数据类型在类内部正确地实现了 `map` 和 `flatMap` 方法，这正是让它们能够在\
    \ `for` 表达式使用的原因。我在在这两个资源中详细阐述了这一点：\n\n*   我的博客文章，[如何编写一个可以在 for 表达式使用的 Scala\
    \ 类](https://alvinalexander.com/scala/fp-book/how-to-write-class-used-in-for-expression/)\n\
    *   我的畅销 FP 书籍，[函数式编程，简化版](https://alvinalexander.com/scala/functional-programming-simplified-book)\n\
    \n# 范畴论\n\n对于对 monad（单子）、monoid（半群）、functor（函子）等具有特殊名称的 FP 术语背后理论感兴趣的人，你想要深入研究的内容是范畴论（这也是“Cats\
    \ Effect”名称的来源）。\n\n你可以在以下位置找到名为《程序员范畴论》（Category Theory for Programmers）的书的免费版：\n\
    \n*   [一个 Github 仓库](https://github.com/hmemcpy/milewski-ctfp-pdf)\n*   [一系列在线博客文章](https://bartoszmilewski.com/2014/10/28/category-theory-for-programmers-the-preface/)\n\
    \n正如我在这书中展示的，你不需要理解范畴论来理解 FP，但当你想知道像“map”这样的名称源自何处，范畴论正是你寻找的。\n\n# 附录 A. Scala\
    \ 3 快速查表\n\n假设你不熟悉 [Scala 3](https://scala-lang.org/)，这里有一份涵盖其许多主要特快速查表。不过，如果你想看到更多关于\
    \ Scala 3 的细节，请参：\n\n*   免费的在线 [Scala 3 教程](https://docs.scala-lang.org/scala3/book/introduction.html)\n\
    *   我的书籍，快速学习 Scala 3！](https://alvinalexander.gumroad.com/l/learn-scala3-fast)\n\
    *   [Scala 食谱（第二版）](https://amzn.to/3du1pMR)\n\n## 核心概念\n\n这些是关于 Scala 3 编程语言的主要点或核心概念：\n\
    \n*   它是一种高级编程语言（类似于 Java、Kotlin 等）\n*   它是富有表现力的，具有简洁、易读的语法（类似于 Kotlin）\n*  \
    \ 一个区别性特征是它促进了 OOP 和 FP 的融合\n*   它是静态类型的，但感觉是动态的\n*   它有一套复杂的类型推断系统，因此你很少需要显式声明变量类型\n\
    *   函数是一的一等公民值，就像字符串、整数和其他类型一样\n*   偏于使用不可变数据结构，但也提供可变数据结构\n*   Scala 2 非常一致，而\
    \ Scala 3 的一致性高得惊人\n*   它与其他 JVM 库（Java、Kotlin 等）无缝衔接\n\n更多信息：\n\n*   随着几年前 Scala.js\
    \ 的创建，Scala 可以用作 JavaScript 的替代品\n*   随着 Scala Native（以及 GraalVM）的创建，你可以创建二进制可执行文件\n\
    *   新的 [Scala CLI](https://scala-cli.virtuslab.org) 工具让快速上手 Scala 变得简单\n*   Scala\
    \ 3 的偏好是使用显著缩进作为默认，但如果你喜欢，也可以使用大括号\n\n从个人角度来看，我预计在十年内几乎每种流行的编程语言都会支持显著缩进。在我看来，它让你的代码变得更整洁、更容易阅读。\n\
    \n## OOP 支持\n\nScala 是一个完整的 OOP 语言，完全支持：\n\n*   类 (Classes)\n*   特质 (Traits /\
    \ 接口)\n*   继承\n*   多态\n*   Scala 中的每个值都是类的实例\n\n## FP 支持\n\nScala 是一个完整的 FP 语言，完全支持：\n\
    \n*   作为值的函数\n*   高阶函数\n*   Lambda 表达式\n*   一切都是返回值的表达式\n*   不可变（代数）变量\n*   不可变集合（数据结构），带有数十种内置函数式方法\n\
    \n## Hello world\n\n最基本的 Scala 3 \"Hello, world\" 示例：\n\n```\n@main def hello\
    \ = println(\"Hello, world\")\n```\n\n同样的内容，但使用了一个变量：\n\n```\n@main def hello\
    \ =\n  val w = \"world\"\n  println(s\"Hello, w\")\n```\n"
- fmt: "\n```scala\n// more months here ...\ncase 11 => \"November\"\ncase 12 => \"\
    December\"\ncase _  => \"Invalid month\"  // the default, catch-all\n\n// used\
    \ for a side effect:\ni match\n  case 1 | 3 | 5 | 7 | 9  => println(\"odd\")\n\
    \  case 2 | 4 | 6 | 8 | 10 => println(\"even\")\n\n// a function written with\
    \ 'match':\ndef isTrueInPerl(a: Matchable): Boolean = a match\n  case false |\
    \ 0 | \"\" => false\n  case _ => true\n```\n\nNote: There are *many* more ways\
    \ to use `match` expressions.\n\n### try/catch/finally\n\nScala’s `try`/`catch`/`finally`\
    \ expressions are similar to Java, but are also expressions that return a value:\n\
    \n```scala\ndef readTextFile(filename: String): Option[List[String]] =\n  try\n\
    \      Some(Source.fromFile(filename).getLines.toList)\n  catch\n    case e: Exception\
    \ => None\n  finally\n      // close any resources here\n```\n\n## Functions\n\
    \nScala functions and methods are created with the `def` keyword. They can be\
    \ written on one line, or as many lines as needed:\n\n```scala\ndef sum(a: Int,\
    \ b: Int): Int = a + b\n\ndef max(a: Int, b: Int): Int =\n  // as many lines as\
    \ you need here\n  if a > b then a else b\n```\n\n### Default parameter values\n\
    \nFunction parameters can have default values:\n\n```scala\ndef getUrlData(\n\
    \    url: String,\n    connectionTimeout: Int = 5_000,\n    readTimeout: Int =\
    \ 5_000\n): String =\n  println(s\"cTimeout = $connectionTimeout, rTimeout = $readTimeout\"\
    )\n  // your real code would be here\n  \"Here’s the data!\"\n\ngetUrlData(\"\
    https...\")                   // cTimeout = 5000, rTimeout = 5000\ngetUrlData(\"\
    https...\", 2_500)            // cTimeout = 2500, rTimeout = 5000\ngetUrlData(\"\
    https...\", 10_000, 10_000)   // cTimeout = 10000, rTimeout = 10000\n```\n\n###\
    \ A function that takes a function parameter\n\nA three-step process.\n\n[1] Define\
    \ function that takes other functions as input parameters:\n\n```scala\n// callback\
    \ is a \"function input parameter\" (FIP):\ndef sayHello(callback: () => Unit):\
    \ Unit =\n  callback()\n\n// this defines a FIP that (a) takes no input parameters\
    \ and\n// (b) returns nothing (Unit is like void):\ndef sayHello(callback: ()\
    \ => Unit): Unit =\n                          ----------\n```\n\n[2] Define other\
    \ functions:\n\n```scala\ndef helloAl(): Unit =\n  println(\"Hello, Al\")\n\n\
    def holaLorenzo(): Unit =\n  println(\"Hola, Lorenzo\")\n```\n\n[3] Pass those\
    \ to `sayHello`:\n\n```scala\nsayHello(helloAl)        // prints \"Hello, Al\"\
    \nsayHello(holaLorenzo)    // prints \"Hola, Lorenzo\"\n```\n\n(See [Functional\
    \ Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book)\
    \ for many more details on how this works.)\n\n## Functional error handling\n\n\
    Scala has the concepts of functional error handling and error-handling data types.\n\
    \n- Functions *should not* throw exceptions\n- They *should* return functional\
    \ error-handling types:\n    - `Option`\n    - `Try`\n    - `Either`\n\nThis is\
    \ demonstrated in many places in the book, such as the `makeInt` function:\n\n\
    ```scala\ndef makeInt(s: String): Option[Int] =\n  try\n      Some(s.toInt)\n\
    \  catch\n    case e: Exception => None\n```\n\n## Domain Modeling (MD)\n\nWhen\
    \ programming in an OOP style, you’ll use these constructs:\n- Traits\n- Enums\n\
    - Classes\n\nExamples:\n\n```scala\nclass Person(val name: String, age: Int)\n\
    \nclass Person(val name: String, age: Int)\n  override def toString = s\"$name\
    \ is $age old\"\n```\n\nWhen programming in an FP style, you’ll use these constructs:\n\
    - Traits\n- Enums\n- Case classes\n\n### DM: Classes\n\nAn OOP-style class has\
    \ parameters that are created with `var`, so they can be changed (mutated):\n\n\
    ```scala\n// one-liner:\nclass Person(var firstName: String, var lastName: String)\n\
    \n// when it gets longer:\nclass Person(\n  var firstName: String,\n  var lastName:\
    \ String\n)\n```\n\nCreate a new instance, then access and mutate its parameters/fields:\n\
    \n```scala\nval p = Person(\"Reginald\", \"Dwight\")\n// access the fields:\n\
    println(p.firstName)  // \"Reginald\"\nprintln(p.lastName)  // \"Dwight\"\n\n\
    // mutate them:\np.firstName = \"Elton\"\np.lastName = \"John\"\n\n// print the\
    \ new values:\nprintln(p.firstName)  // \"Elton\"\nprintln(p.lastName)  // \"\
    John\"\n```\n\nA class with some enums as well:\n\n```scala\nenum CrustSize:\n\
    \  case Small, Medium, Large\n\nenum CrustType:\n  case Thin, Thick, Regular\n\
    \nenum Topping:\n  case Cheese, Pepperoni, Olives\n\nclass Pizza (\n  var crustSize:\
    \ CrustSize,\n  var crustType: CrustType,\n  toppings: ArrayBuffer[Topping]\n\
    ):\n  override def toString = s\"$crustSize $crustType with $toppings\"\n  //\
    \ create a method to determine the pizza cost based on its attributes:\n  def\
    \ cost: Double = ???\n  // create a method to determine the pizza price based\
    \ on its attributes:\n  def price: Double = ???\n```\n\nIn that example, we use\
    \ `???` as the method body until we’re ready to implement it.\n\n### DM: Enums\n\
    \nScala 3 has enums, or enumerations:\n\n```scala\nenum Suit:\n  case Clubs, Diamonds,\
    \ Hearts, Spades\n\n// some time later ...\nimport Suit.*\n\ndef printEnum(suit:\
    \ Suit) = suit match\n  case Clubs   => println(\"clubs\")\n  case Diamonds =>\
    \ println(\"diamonds\")\n  case Hearts  => println(\"hearts\")\n  case Spades\
    \  => println(\"spades\")\n```\n\n### DM: Traits\n\nTraits can used like Java\
    \ interfaces, and can also be used like Ruby mixins.\n\n```scala\ntrait Animal:\n\
    \  def speak(): Unit\n\ntrait HasTail:\n  def wagTail(): Unit\n\nclass Dog extends\
    \ Animal, HasTail:\n  def speak(): Unit = println(\"Woof\")\n  def wagTail():\
    \ Unit = println(\"Wag wag!\")\n\nval d = Dog()\n```\n\n### DM: Objects\n\nObjects\
    \ are used to create singletons. Functions in objects are like `static` methods\
    \ in Java.\n\n```scala\nobject StringUtils:\n  def truncate(s: String, length:\
    \ Int): String =\n    s.take(length)\n  def lettersAndNumbersOnly_?(s: String):\
    \ Boolean =\n    s.matches(\"[a-zA-Z0-9]+\")\n  def lettersOnly_?(s: String):\
    \ Boolean =\n    s.matches(\"[a-zA-Z]+\")\n  def containsWhitespace(s: String):\
    \ Boolean =\n    s.matches(\".*\\\\s.*\")\n```\n\n### DM: Case classes\n\nCase\
    \ classes start with the `case` keyword, and are intended for FP:\n\n```scala\n\
    case class Person(name: String, relation: String)\n\nval christina = Person(\"\
    Christina\", \"niece\")\nchristina.name            // \"Christina\"\nchristina.name\
    \ = \"Fred\"   // error: reassignment to val\n\nval aleka = christina.copy(name\
    \ = \"Aleka\")\naleka.name                // \"Aleka\"\nchristina == aleka   \
    \     // false\n```\n\n### DM: Union types\n\nScala 3 has union types, which let\
    \ your code be even more dynamic. This function takes an `Int` or a `String` as\
    \ an input parameter:\n\n```scala\n// Perl version of \"true\"\ndef isTrueInPerl(a:\
    \ Int | String): Boolean = a match\n  case 0 | \"0\" | \"\" => false\n  case _\
    \ => true\n```\n\nThis one returns a union type as a result:\n\n```scala\ndef\
    \ aFunction(): Int | String =\n  val x = scala.util.Random.nextInt(100)\n  if\
    \ (x < 50) then x else s\"string: $x\"\n```\n\nFor more information, see [my blog\
    \ post](https://alvinalexander.com/scala/scala-3-union-types-cookbook-simulate-dynamic-typing/).\n\
    \n## Collections Classes\n\nSome common classes:\n\n```scala\nval xs = List(1,\
    \ 2, 3)      // a simple linked-list\nval xs = Vector(1, 2, 3)    // a high-performance,\
    \ immutable sequence\nval xs = ArrayBuffer(1, 2, 3) // a high-performance, mutable\
    \ sequence\n\nval states = Map(\n  \"AK\" -> \"Alaska\",\n  \"AL\" -> \"Alabama\"\
    \n)\n\nval s = Set(1, 2, 1, 3)    // s: Set(1, 2, 3) (duplicates are dropped)\n\
    ```\n\n## Collections Methods\n\nScala sequence classes have *many* methods with\
    \ functional methods that take anonymous functions (lambdas) to solve problems.\
    \ Here’s the `List` class and some of its methods:\n\n```scala\nval a = List(10,\
    \ 20, 30, 40, 10) // List(10, 20, 30, 40, 10)\n```\n"
