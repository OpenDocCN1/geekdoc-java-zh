    many Java methods can throw exceptions, and when they can, you have to think about
    (a) handling the â€œsuccessâ€ case, and (b) handling the â€œfailureâ€ case, which
    for me meant wrapping the method call with `try`/`catch`.


    This gets to be ridiculously hard on the brain, so I got to the point that â€”
    using the Model/View/Controller (MVC) paradigm â€” I only handled exceptions with
    my top-level controllers. I logged exceptions at the point they occurred, but
    then just let them bubble up to my controllers, and handled them there.


    At that time I didnâ€™t know anything about functional programming, and I couldnâ€™t
    think of a better way to deal with potential errors â€” invalid data, servers
