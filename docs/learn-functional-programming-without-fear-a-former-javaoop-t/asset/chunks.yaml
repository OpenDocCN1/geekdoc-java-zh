    So out of about 150,000 lines of Java/OOP code, there are 1,117 lines with a `<.*>`
    pattern, for a total percentage of 0.74%. (Note that those line-count numbers
    include blanks lines and comment lines, so the actual percentages are higher.)


    I then manually looked through all of those `<.*>` lines of output, and found
    that these were the two most difficult lines to read:


    `SortedMap<String, Integer> wordCountMap = new TreeMap();`


    `public Class<?> getColumnClass(int columnIndex) {`


    ## Coming soon â€¦


    So, without any further comment at this point, thatâ€™s a look at using data types
    in some Java/OOP code.


    In just a few chapters weâ€™ll start looking at some Scala code â€” specifically
    how to solve problems with Scala and pure functions. But before we get to that,
    I need to introduce a wee bit of background material that will help that approach
    make sense.


    # 8\. My Path to Learning Scala


    Before we jump into some Scala code, itâ€™s important to mention how I learned
    Scala. My timeline looked like this:


    I had taught Java and OOP classes for several years. I owned a small consulting
    company, and we wrote Java/OOP code for most of our clients, and provided training
    and mentoring services to them as well.


    Out of personal curiosity, I started learning a little Python, and even more Ruby.
    I liked Ruby (and Ruby on Rails), and then really loved JRuby, which let me use
    Java libraries while writing Ruby code.


    Then a friend showed me the [Learn You a Haskell for Great Good!](http://amzn.to/1POaUCv)
    book, but after the basic intro stuff in that book, I had no idea what the author
    was talking about. Things like [typeclasses](https://docs.scala-lang.org/scala3/book/types-type-classes.html)
    totally eluded me, and I gave up on FP as anything other than a curiosity.


    In late 2010 I had sold my company and was wandering around Alaska, and discovered
    Scala. Not knowing any better, I started using it as a â€œbetter Javaâ€, meaning
    that I wrote OOP code with Scala (i.e., Scala/OOP).


    I also spent a lot of time trying to use the Java collections classes in Scala,
    which was a *horrible* waste of time. Not because you canâ€™t use them â€” you
    can â€” but if you do that, youâ€™re not embracing the style and best practices
    that Scala brings to the table.


    > Itâ€™s like the time a friend started working with Java, and having a background
    in Visual Basic, he tried to write VB code in Java. You do something that because
    youâ€™re *comfortable* with VB, but youâ€™re not embracing Java; youâ€™re just
    writing VB code with Javaâ€™s language constructs.


    As time went on I found the book, [Programming in Scala](https://amzn.to/3eqkTzi),
    and learned about Martin Oderskyâ€™s idea of Scala being a *fusion of OOP and
    FP*. (I also learned that Mr. Odersky was considered the â€œfather of the Java
    generics compiler.â€)


    As I tried to implement the concepts in that book, I started mixing pure functions
    into my OOP code. I saw that pure functions were GREAT because (a) output depended
    only on input, and (b) there were no side effects. They were easy to write, read,
    and test.


    I also learned that *error-handling data types* like `Option`, `Try`, and `Either`
    were terrific alternatives to throwing exceptions. I no longer had to think about
    exceptions short-circuiting my code when an error occurred.


    As Iâ€™ll discuss shortly, because I knew exactly what was going into a function
    and coming out of a function, I began to trust the *type signatures* of functions
    again: I didnâ€™t have to read every functionâ€™s code to see what it *really*
    did, including code from complete strangers.


    I realized that Mr. Odersky and the Scala people were onto something, and that
    FP probably wasnâ€™t a fad. I tried to learn more about it.


    And as I dug into it even more, I found that *nobody* I had ever seen who switched
    to FP switched back to OOP.


    No one.


    ## How that fits in with this book


    The conclusion to this little story is that I fell in love with Scala, and contacted
    the people at Oâ€™Reilly Media, and ended up writing the 1st and 2nd Editions
    of the [Scala Cookbook](https://amzn.to/3du1pMR).


    I mention all of this so that you can get an idea of my experience, or at least
    my experience prior to writing [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book):
    I didnâ€™t learn FP in college; I learned it by reading books, writing code, and
    asking questions.


    But more importantly, the last portions of my learning path had to do with immutable
    variables, immutable data structures (like `String` and `List`), pure functions,
    EOP, and functional error-handling, and those concepts are the basis of *this*
    book.


    # 9\. JIT: Immutable Things


    As a first â€œJust In Timeâ€ lesson, the first important concept I need to cover
    is what I call â€œimmutable thingsâ€:


    *   Immutable variables (immutable *algebraic* variables)


    *   Immutable data structures


    ## Immutable variables (algebraic variables)


    The term *immutable variable* sounds like a contradiction, but it just means that
    weâ€™ll be creating variables in the *algebraic* sense. For instance, in algebra
    you write an equation like this:


    `x = a + b + c`


    In that equation itâ€™s assumed that all of those variables are immutable â€”
    they canâ€™t be changed. That is, you would NOT write algebra like this:


    `x = a + b + c`


    `a = 42    // error`


    `x = 11    // error`


    As shown, those last two lines are errors: variables in algebra are never reassigned.
    The Scala equivalent of this is that you create algebraic variables using the
    `val` keyword:


    `val x = a + b + c`


    When you create a variable using `val`, itâ€™s like `final` in Java; it can never
    be reassigned. You can see this in the Scala REPL:


    `scala> val x = 1`


    `val x: Int = 1`


    `scala> x = 2`


    `-- [E052] Type Error: --`


    `1 |x = 2`


    `  |^^^^^`


