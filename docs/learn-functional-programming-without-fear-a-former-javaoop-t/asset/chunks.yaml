    `    val lcListOfWords =`


    `        lowerCaseAllWords(listOfWords)`


    `    ...`


    ## From a Seq[String] to a Map


    Now that we have a list of words, weâ€™re almost home. The next step is to create
    a function that converts the list of words into a `Map`, where that `Map` contains
    each unique word as the key, and the count of occurrences of that word as its
    value.


    We donâ€™t have to think about that algorithm yet, we just need to sketch the
    function signature. We know that it should take a `Seq[String]` as input, and
    return a `Map[String, Int]`, so its signature looks like this:


    `def convertWordListToWordCount(listOfWords: Seq[String]): Map[String, Int]`


    and now `wc` looks like this:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    val stringWithoutFormatting =`


    `        stripFormattingCharacters(stringWithoutNewlines)`


    `    val stringWithSingleBlanks =`


    `        squeezeBlankSpaces(stringWithoutFormatting)`


    `    val listOfWords =`


    `        convertStringToListOfWords(stringWithSingleBlanks)`


    `    val lcListOfWords =`


    `        lowerCaseAllWords(listOfWords)`


    `    val initialMap =`


    `        convertWordListToWordCount(lcListOfWords)`


    `    ...`


    ## Sort the Map


    As our last step, now we just need to sort that `Map` by its values, in descending
    order. For example, the `Map` may look like this right now:


    `Map(`


    `    "or" -> 99,`


    `    "the" -> 543,`


    `    "an" -> 210`


    `)`


    and we want it to look like this:


    `Map(`


    `    "the" -> 543,`


    `    "an" -> 210,`


    `    "or" -> 99`


    `)`


    So we need a function that takes a `Map[String, Int]` as input, and also returns
    a `Map[String, Int]`, BUT, the returned map needs to be sorted. Scalaâ€™s `VectorMap`
    can be used for just this purpose, so I sketch this function:


    `def sortMapByHighestValue(map: Map[String, Int]): VectorMap[String, Int]`


    and then I add it to `wc`:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    val stringWithoutFormatting =`


    `        stripFormattingCharacters(stringWithoutNewlines)`


    `    val stringWithSingleBlanks =`


    `        squeezeBlankSpaces(stringWithoutFormatting)`


    `    val listOfWords =`


    `        convertStringToListOfWords(stringWithSingleBlanks)`


    `    val lcListOfWords =`


    `        lowerCaseAllWords(listOfWords)`


    `    val initialMap =`


    `        convertWordListToWordCount(lcListOfWords)`


    `    val sortedMap =`


    `        sortMapByHighestValue(initialMap)`


    `    sortedMap`


    Note that in this case I add the `sortedMap` variable to the end of the function,
    because thatâ€™s the value that our function yields.


    > NOTE: In functional programming, FPers donâ€™t say â€œreturnâ€; we say that
    a function *yields a result*, or that it *evaluates to a result*. Again, weâ€™re
    writing algebra here, and thatâ€™s what algebraic equations do.


    ## Is that code hard to read?


    Great questions at this point are:


    *   Is that code hard to read?


    *   Is it hard to reason about?


    In both cases I suspect that youâ€™ll say that this code is actually about as
    simple as it gets. Because the functions are pure and the variables and data types
    are immutable, the code ends up being written in an EOP style, which I find to
    be as simple as possible.


    > I donâ€™t like to use the word â€œsimpleâ€ in programming books, because everyoneâ€™s
    background is different. So thatâ€™s why I say, â€œas simple as possible.â€ Frankly,
    the code reminds me of writing BASIC code with pure functions when I was in high
    school.


    ## Discussion


    So this is pretty cool. Assuming that I thought of everything, we almost completely
    solved this problem by (a) sketching out a series of pure function signatures,
    and then (b) combining those signatures like a series of algebraic equations.
    All thatâ€™s left to do is write the code inside those function bodies.


    One thing thatâ€™s worth mentioning is that as you go through this process, it
    can help to jot down a sample of the input you expect a function to receive, as
    well as the output itâ€™s expected to return. Thatâ€™s why I showed the `String`
    and `Map` data in a few steps there, to make sure that my logic was sound.


    ## Two notes


    Tow notes come to mind after writing this section of the book.


    ### 1) Being a mathematician or architect


    The first note is to reiterare what Iâ€™ve already stated: that FPers like to
    think of this style of programming as math, or perhaps as creating a blueprint.
    So rather than being a programmer, youâ€™re like a mathematician or architect,
    working on equations or the blueprint. Because of this, youâ€™ll also hear FPers
    say things like â€œreasoning about the code,â€ because they look at function signatures
    like these and how they glue together.


    As youâ€™ll see throughout this book, when your functions are pure and your values
    are immutable, you can do this.


    ### 2) You can do much more with Scala types


    A second thing I need to mention is that with the Scala type system, you can do
    some things to make your code even more readable. For instance, in my code I return
    a `VectorMap` from a function, but if you think about that signature, it could
    be more meaningful, right?


    What I mean is that I wrote this:


    `VectorMap[String, Int]`


    but with Scalaâ€™s type system I can write that return type like this instead:


    `MapSortedByValueDesc[String, Int]`'
