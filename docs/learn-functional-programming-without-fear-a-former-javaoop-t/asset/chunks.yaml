    and because that function returns `Try[Unit]`, all we have to do is call it in
    our second `case` statement:


    `def handleUserInput(input: String): Try[Unit] = input match`


    `    case "q" =>`


    `        Try(System.exit(0))`


    `    case "h" =>`


    `        IOHelper.showHelp()     // <== THE NEW CODE`


    That function prints our â€œhelp textâ€ to STDOUT using `println` statements â€”
    and because that function follows our rule that any time we reach into the outside
    world, we return `Try` â€” that function â€œjust worksâ€ here.


    # 42\. TDL UI: Handling â€œViewâ€


    Next up, the â€œViewâ€ use case is a little more complicated than the first two.
    Basically this code needs to attempt to read the database and then take one of
    two possible actions from there:


    *   In the success case, it prints the list of to-do items


    *   In the failure case, it prints an error message about the database being inaccessible


    This is straightforward to do because we already wrote the `selectAll` database
    method previously, and it returns a `Try` value, so we just need to handle its
    `Success` and `Failure` cases in a `match` expression.


    Hereâ€™s the code that does what I just described, with a few comments to make
    those steps clear:


    `def handleView(): Try[Unit] = Try {`


    `    // attempt to read all the tasks from the database.`


    `    // this function returns a list of strings, wrapped inside`


    `    // a Try:`


    `    val res: Try[Seq[String]] = db.selectAll()`


    `    // handle the Success and Failure cases:`


    `    res match`


    `        case Success(tasks) =>`


    `            // in the Success case we get a list of tasks (strings),`


    `            // so print those out in a nice format:`


    `            printTasks(tasks)`


    `        case Failure(t) =>`


    `            // in the Failure case, where we canâ€™t access the database,`


    `            // print the exception (a Throwable) we get from selectAll:`


    `            System.err.println(t)`


    `}`


    `private def printTasks(tasks: Seq[String]): Unit =`


    `    for`


    `        (task, count) <- tasks.zip(Stream from 1)`


    `    do`


    `        println(s"${count}. $task")`


    Hereâ€™s a shorter version of `handleView`, without the comments:


    `def handleView(): Try[Unit] = Try {`


    `    val res: Try[Seq[String]] = db.selectAll()`


    `    res match`


    `        case Success(tasks) =>`


    `            for`


    `                (task, count) <- tasks.zip(Stream from 1)`


    `            do`


    `                println(s"${count}. $task")`


    `        case Failure(t) =>`


    `            System.err.println(t)`


    `}`


    Note that the cases of the `match` expression print to STDOUT and STDERR, so they
    both have the return type `Unit`. And because the entire function body is wrapped
    in a `Try` constructor call:


    `def handleView(): Try[Unit] = Try { // body here ... }`


    `                              ------------------------`


    this means that both cases of this function correctly result in returning the
    `Try[Unit]` type.


    > Again, if any of this seems like overkill, remember to imagine that weâ€™re
    accessing a remote database or REST service, and in the real world, those things
    may be down.


    # 43\. TDL UI: Handling â€œAddâ€


    Next up, the â€œAddâ€ use case is a little bit more complicated. Going back to
    our UI, we know that when a user wants to add a new task, they type things like
    this with the `a` command:


    `a wake up`


    `a brush teeth`


    `a take a long hot shower`


    So the first thing we need to do is to separate that *add* command â€” the letter
    `a` â€” from the rest of the string. Thanks to the power of Scalaâ€™s collections
    methods, we do this with the `drop` method thatâ€™s available on all strings:


    `"a wake up".drop(2)                   // "wake up"`


    `"a brush teeth".drop(2)               // "brush teeth"`


    `"a take a long hot shower".drop(2)    // "take a long hot shower"`


    > The `drop` method is available because a `String` is also a list, specifically
    a `Seq[Char]`.


    This approach seems to work well, giving us a string that we can pass to another
    function, so that function can add the string to our database. So, looking only
    at the â€œaddâ€ case, I write this:


    `case add if add.startsWith("a ") =>`


    `    handleAdd(add.drop(2))`


    ## handleAdd


    So now I need to write a `handleAdd` function, and I know three things about it
    already:


    *   Itâ€™s going to take a `String` as input


    *   It needs to add/insert that task into our database


    *   Because itâ€™s going to access the database, it needs to return a `Try`


    Therefore, I can start to sketch its signature like this:


    `def handleAdd(task: String): Try`


    And because I wrote the database code earlier, I know that `handleAdd` just needs
    to have a reference to the database object so it can perform the insert. Recall
    that this function is inside the `InputProcessor` class, which I defined to take
    a `Database` reference, like this:


    `class InputProcessor(db: Database)`


    So now `handleAdd` has access to this `db` reference.


    > This is one situation where itâ€™s acceptable for a function to have a *side
    door*: when that function is declared inside a class that has a reference like
    this. (However, if you donâ€™t like this, there are other ways to write this code
    to make sure a `Database` reference is passed in through the functionâ€™s front
    door (i.e., its input parameter list)).


    Getting back to the `handleAdd` function, I know that (a) I want to call the `insert`
    function on the `db` reference, and (b) it returns a `Try[Unit]`. So now I write
    `handleAdd` like this:


    `def handleAdd(taskName: String): Try[Unit] =`


    `    db.insert(taskName)`


    At this point, this `case` code in the `match` expression inside the `handleUserInput`
    function could be the end of the `case`:


    `case add if add.startsWith("a ") =>`


    `    handleAdd(add.drop(2))`'
