- fmt: "\nThe first key is that every `for` loop begins with a generator. A `generator`\
    \ is a source of data, such as a list or stream. The simplest possible generators\
    \ look like this:\n\n```scala\nfor i <- 1 to 3 do println(i)    // 1st example\n\
    val xs = List(1, 2, 3)           // 2nd example\nfor x <- xs do println(x)\n```\n\
    \nThose are `for` `loops`. They’re called loops — and not expressions — because\
    \ they loop over those values for some side effect, which is printing in this\
    \ case.\n\nConversely, `for`/`yield` combinations are called `expressions` because\
    \ they `yield` a value, and you typically assign that value to a variable:\n\n\
    ```scala\nval xs = List(1, 2, 3)\nval ys = for x <- xs yield x * 2\n```\n\nYou\
    \ often use a `for`/`yield` expression to write a function:\n\n```scala\ndef double(xs:\
    \ List[Int]): List[Int] =\n     for x <- xs yield x * 2\n```\n\nWhen you’re new\
    \ to this syntax, this style may be easier to read:\n\n```scala\ndef double(xs:\
    \ List[Int]): List[Int] =\n     for\n          x <- xs\n     yield\n         \
    \ x * 2\n```\n\n## Multiple generators\n\n`for` loops and expressions can have\
    \ as many generators as you need for your algorithm:\n\n```scala\nval rez =\n\
    \     for\n          i <- 1 to 2\n          j <- 3 to 4\n          k <- 5 to 6\n\
    \     yield\n          i + j + k\n// rez: Vector(9, 10, 10, 11, 10, 11, 11, 12)\n\
    ```\n\nAs shown in the comment, the result of this `for` expression is a `Vector`\
    \ that contains the list of integers shown. (`Vector` is a specific type of sequence\
    \ (`Seq`) that is immutable, and generally has very good performance in many different\
    \ situations.)\n\n## Guards\n\n`Guards` are basically `if` conditions that you\
    \ add to the first part of `for` loops and expressions, and they look like this:\n\
    \n```scala\nval newValues =\n     for\n          i <- 1 to 5\n          j <- 6\
    \ to 10\n          if i > 3\n          if j < 7\n     yield\n          i + j\n\
    // newValues: Vector(10, 11)\n```\n\nAs shown, you can add as many generators\
    \ and guards as you need for your algorithm.\n\n> As I mention in my other books,\
    \ the benefit of Scala’s `for` syntax is that it separates your generators and\
    \ guards (in the first section) from your business logic (which comes in the second\
    \ section, after the `do` and `yield` keywords).\n\n# 35. JIT: Code Blocks (Closures)\n\
    \nBefore we get into the next TDL lesson, I need to cover a Scala language feature\
    \ I refer to as `code blocks`, or `blocks of code`. I’ve seen in other languages\
    \ that this feature can be called a `closure` (but I think there are multiple\
    \ definitions of that term).\n\nIn short, you create a block of code in Scala\
    \ using curly braces, like this:\n\n```scala\nval a = {\n     // a block of code\n\
    \     println(\"hi mom\")\n     42\n}\n```\n\nThe result of a code block is its\
    \ final value. In this example that value is the integer `42`, so if you want\
    \ to explicitly declare `a`’s type, it’s an `Int`:\n\n```scala\nval a: Int = {\
    \        // <== explicitly set the type\n     // a block of code\n     println(\"\
    hi mom\")\n     42\n}\n```\n\nNotice that any legal Scala code can be inside that\
    \ code block, such as the side effect of printing to STDOUT. But from Scala’s\
    \ perspective, its return type is `Int`.\n\nYou can demonstrate this for yourself\
    \ in the Scala REPL by passing a code block to its `:type` command:\n\n```scala\n\
    scala> :type { println(\"hi\"); 42 }\nInt\nscala> :type { println(\"hi\"); \"\
    dude\" }\nString\n```\n\nAgain, notice that the `type` of the code block is that\
    \ last value returned by it. And if that last value is something that yields `Unit`,\
    \ that’s the block’s type:\n\n```scala\nscala> :type { val a = 7; println(\"hi\"\
    ) }\nUnit\n```\n\nAs we get ready for the next lesson, being aware of code blocks\
    \ is one thing you’ll need.\n\n# 36. JIT: Recursion\n\nThe other programming technique\
    \ you’ll have to have some awareness of before the next lesson is `recursion`.\
    \ Recursion can be really fun, and it’s an important FP technique, so I spend\
    \ over 50 pages explaining it in [Functional Programming Simplified](https://alvinalander.com/functional-programming-simplified).\n\
    \n## Writing a recursive function\n\nIn short, a recursive function is a function\
    \ that calls itself. To demonstrate this, let’s create a recursive function that\
    \ \"counts down\" to `0`. The idea is that you give it some integer, and it prints\
    \ down to `0`, as shown in the REPL:\n\n```scala\nscala> countdown(3)\n3\n2\n\
    1\n```\n\nRight away you can see that this function takes an `Int` parameter:\n\
    \n```scala\ndef countdown(i: Int)\n```\n\nYou can also see that it prints its\
    \ result, and doesn’t return anything, so its return type is `Unit` (which is\
    \ like `void` in Java and other languages):\n\n```scala\ndef countdown(i: Int):\
    \ Unit =\n```\n\nNormally I implement most recursive functions using `match` expressions,\
    \ but to keep this familiar for OOP developers, I’ll use an `if`/`then` expression.\n\
    \nThe first thing I usually do when I write a recursive function is to specify\
    \ its `end` or `stop` condition. In this case, I know that I want the recursion\
    \ to stop when the `Int` parameter is `0`, so I write that condition first:\n\n\
    ```scala\ndef countdown(i: Int): Unit =\n  if i == 0 then\n```\n\nAt this point\
    \ I know two things: (a) I want the recursive calls to stop here, and (b) the\
    \ function needs to return `Unit`. Therefore, I return the `Unit` value — `()`\
    \ — here:\n\n```scala\ndef countdown(i: Int): Unit =\n  if i == 0 then\n    ()\n\
    ```\n\nThe symbol `()` is the one and only instance of the `Unit` type, and as\
    \ you’ll see, this is how the recursive calls stop: they hit this `if` condition,\
    \ `()` is yielded, and the recursive calls unroll.\n\nNow that I have the stop\
    \ condition I want, I write the rest of the algorithm, i.e., the portion of the\
    \ code that calls itself. Here I know from the function’s output that I want to\
    \ do two things: (a) print the current value of `i`, and (b) make the recursive\
    \ call.\n\nAn important part of the second step is that I reduce the value of\
    \ `i` by `1` when making the call. If I fail to do this, the recursion will continue\
    \ forever, so this is another key:\n\n```scala\ndef countdown(i: Int): Unit =\n\
    \  if i == 0 then\n    ()\n  else\n    println(i)\n    countdown(i - 1) // the\
    \ recursive call\n```\n\nI don’t want to make light of it, but basically that’s\
    \ all there is to recursion. Please verify that code in the REPL, and make sure\
    \ you’re comfortable with it.\n\n## An example with a match expression\n\nA fun\
    \ recursive algorithm to write is a \"sum\" algorithm for a `List[Int]`. A key\
    \ here is to know that a Scala `List` is implemented just like a `Lisp` list,\
    \ as a series of `cons` cells that end with a `Nil` value:\n\n```scala\n1 :: 2\
    \ :: 3 :: Nil\n```\n\nI believe this is the type of linked-list you’re taught\
    \ in college, so I’m going to assume that you’ve at least seen or heard of this\
    \ before, but the key is that ending `Nil` value.\n\nGetting into the algorithm,\
    \ we know that we want to write a sum function:\n\n```scala\ndef sum\n```\n\n\
    It takes a `List[Int]` parameter:\n\n```scala\ndef sum(list: List[Int])\n```\n\
    \nand it returns a sum of the ints:\n\n```scala\ndef sum(list: List[Int]): Int\n\
    ```\n\nI also stated that I want to implement this with a `match` expression:\n\
    \n```scala\ndef sum(list: List[Int]): Int = list match\n```\n\nAgain, I like to\
    \ write the `stop` condition first, and the stop condition when you work on a\
    \ `List` is always the `Nil` value:\n\n```scala\ndef sum(list: List[Int]): Int\
    \ = list match\n  case Nil =>\n```\n\n### Identity value\n\nOne reason I’m sharing\
    \ this example is that it also helps to know a mathematical concept called an\
    \ `identity value (or element)`. In short, when you’re working with (a) a set\
    \ of integers and (b) a sum algorithm, the identity element is the value `0`.\
    \ This means that when you sum a list of integers, the value `0` adds nothing\
    \ to that sum.\n\nSimilarly, the value `1` is the identity value for (a) a list\
    \ of integers along with (b) a `product` algorithm: when you multiply an integer\
    \ by `1`, it doesn’t modify the value. This is a key concept to know when working\
    \ with recursion.\n\n### Back to sum\n"
