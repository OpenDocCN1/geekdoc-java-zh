    \ =\n        stripFormattingCharacters(stringWithoutNewlines)\n    val stringWithSingleBlanks\
    \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords\
    \ =\n        convertStringToListOfWords(stringWithSingleBlanks)\n    val lcListOfWords\
    \ =\n        lowerCaseAllWords(listOfWords)\n    ...\n```\n\n## From a Seq[String]\
