- fmt: '

    Furthermore, I’ve written the book especially for people with a background in
    object-oriented programming (OOP). I taught `Java` and `OOP` courses for many
    years, and still write mostly-OOP code for iPhone and Android apps (using `Flutter/Dart`
    and `Kotlin`, respectively), so I’m very familiar with `OOP`, and what `OOP` developers
    need to know to learn FP.


    Having worked with `Java`, `Kotlin`, `Swift`, `Python`, `C++`, `Dart`, and `Ruby`,
    I believe this book will be helpful to developers who use those languages, and
    are interested in learning FP.


    I accomplish this goal in under 250 pages by focusing on how to write a few small
    applications with the five main concepts just mentioned, explaining those concepts
    as we go along.


    > This is intentionally a small, hopefully easy-to-read book about FP. If you’d
    rather read a large, detailed book on FP, I wrote the best-selling and highly-rated
    [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book),
    which is over 720 pages long. While it’s much longer, the benefit of that book
    is that it does cover a lot of background information and fine details, in the
    form of over 100 short lessons. (To be clear, the *Print* version of that book
    is 720+ pages long, but the PDF and Kindle electronic versions are over 1,000
    pages long.)


    # 2. About Me


    For those who don’t know me, my name is Alvin Alexander, and this is my `Java`,
    `OOP`, `Kotlin`, `Scala`, and `FP` background:


    *   Back in the day I taught `C`, `Java`, and `OOP` courses to clients like `GE`,
    `UPS`, `Papa Johns`, and many others

    *   I founded a little software consulting firm that we grew to 20 employees,
    and we primarily wrote `Java/OOP` code for our clients

    *   I wrote two editions of the [Scala Cookbook](https://amzn.to/3du1pMR), most
    recently the 2nd Edition, which was released in September, 2021 (700+ pages each)

    *   I wrote the best-selling and highly-rated book, [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book)
    (also 700+ pages)

    *   I wrote a book named “Hello, Scala,” which became the basis for the “Scala
    Book” on the official Scala website

    *   I then co-wrote the [Scala 3 Book](https://docs.scala-lang.org/scala3/book/introduction.html)
    for the official Scala website

    *   In 2022 I released a book named [Learn Scala 3 The Fast Way!](https://amzn.to/3L4YwR4)

    *   I’ve written Android apps with `Java` and `Kotlin`, and cross-platform iOS/Android
    apps with `Flutter` and `Dart`

    *   My website about programming, [alvinalexander.com](https://alvinalexander.com),
    receives millions of page-views every year


    I mention the page counts for some of those books because for me, this is a short
    book. I intentionally made it as concise as possible, while also writing it in
    a simple, conversational style, as if I was working right next to you, or mentoring
    you in a classroom.


    # 3. Welcome!


    Welcome! This is a really different book for me. My *initial plan* was to create
    a small booklet that I was going to title “Thinking with Types” or “Solving Problems
    with Pure Functions.” The idea was to show how you can write really solid, readable,
    maintable code using these programming techniques:


    *   Pure functions

    *   Immutable variables (*algebraic* variables)

    *   Immutable data types (such as `String` and `List`)

    *   Expression-oriented programming (EOP)

    *   Functional error-handling


    But then as I started working on the outline and examples, I realized how close
    this code is to writing pure *functional programming* (FP) code. At that point
    I switched from writing a booklet to trying to write the smallest possible book
    I can that takes `OOP` developers to the precipice of using `Scala`’s FP libraries.


    So even though this is a relatively small book, I hope it delivers a tremendous
    amount of value by taking you so far down the road to FP. My hope is that when
    you finish this book, you’ll be able to go right to the `ZIO` and `Cats Effect`
    documentation and think, “Oh, I know what they’re doing, and why they’re doing
    it.”


    ## Who this book is for


    I wrote this book for `OOP` developers, but it’s really for anyone who:


    *   Is interested in the programming concepts listed above

    *   Is just starting to work with those concepts

    *   Has gotten into FP a little, and finds it hopelessly confusing

    *   Is otherwise interested in improving their code


    Note that the code examples in this book are written using *Scala 3*, but I don’t
    use any “Scala magic tricks.” The code is written in a simple style, as you’ll
    you’ll soon see.


    ## What I assume you know


    For the purposes of this book I assume that you know a little bit about `Scala`,
    but as a practical matter, the basics of `Scala` are very straightforward, and
    I think you’ll do pretty well if you know another language like `Java`, `Kotlin`,
    `Python`, `Swift`, `Dart`, `C++`, or other languages. As I mentioned, I don’t
    use any fancy `Scala` techniques in this book.


    If the purposes of this book I assume that you know a little bit about `Scala`,
    but as a practical matter, the basics of `Scala` are very straightforward, and
    I think you’ll do pretty well if you know another language like `Java`, `Kotlin`,
