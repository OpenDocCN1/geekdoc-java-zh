    ## Pure functions


    Youâ€™ll find a surprising number of different definitions of pure functions on
    the internet, but to me, a *pure function* is a function:


    *   Whose only parameters from the outside world are the input parameters that
    are defined in its function signature. (I refer to the list of input parameters
    as a functionâ€™s *front door*.)


    *   That does not modify those input parameters.


    *   That does not modify other â€œhiddenâ€ variables that might be accessed through
    side doors (*free* variables), such as mutable variables in its class or any other
