    In my blog post, [What do â€œeffectâ€ and â€œeffectfulâ€ mean in functional programming?](https://alvinalexander.com/scala/what-effects-effectful-mean-in-functional-programming/),
    I wrote something different, which I learned from the book, [Functional and Reactive
    Domain Modeling](https://amzn.to/2uYGevc). Based on that book, in my blog post
