    \ is to create a function that converts the list of words into a `Map`, where\
    \ that `Map` contains each unique word as the key, and the count of occurrences\
    \ of that word as its value.\n\nWe don’t have to think about that algorithm yet,\
    \ we just need to sketch the function signature. We know that it should take a\
    \ `Seq[String]` as input, and return a `Map[String, Int]`, so its signature looks\
    \ like this:\n\n```scala\ndef convertWordListToWordCount(listOfWords: Seq[String]):\
    \ Map[String, Int]\n```\n\nand now `wc` looks like this:\n\n```scala\ndef wc(document:\
