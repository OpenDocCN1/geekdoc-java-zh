  trans: "\n我们将这一过程称为*代数代换*（algebraic substitution），它之所以有效是因为：\n\n*   函数是纯的\n*   变量是不可变的\n\
    *   数据结构是不可变的\n\n当代码像这样编写时，你和编译器都可以自由地以这些方式中的任何一种来编写，而且你始终能得到相同的结果。\n\n> 关键：但如果你使用可变变量、可变数据类型和不纯方法，情况就不如此了。\n\
    \n## 技术细节：“引用透明性”\n\n如果你喜欢代数，你也会喜欢引用透明性。我们说一个表达式是*引用透明的*（referentially transparent,\
    \ RT），如果它可以被替换为它的结果而不改变程序的行为。无论该表达式位于程序的哪个位置，这一点都必须成立。所以这基本上是用来表达：“在这里可以进行代数代换。”\n\
    \n我在上一个示例中所做的实际上恰恰相反——我用表达式替换了中间变量——但这正是酷酷的地方：所有这些中间变量及其纯函数调用都是 100% 等价的。\n\n\
    最后，请注意我并没有在代码中编写任何“花哨的 FP（函数式编程）”操作。我只是在使用不可变变量、不可变数据类型和纯函数编写 EOP（面向表达式编程）代码。\n\
    \n# 15. 并行编程概览\n\n代数代换重要的第一个原因是，正如我提到的，这样编写的代码更容易编写、读取和测试。这句话写起来很简单，但在实践中，这是一个巨大的收益，能让你的生活变得更简单。（单单这一点我就可以写好几章。）\n\
    \n另一个重要原因是，你可以使用代数代换，按照我刚才展示的任何方式来编写代码。我展示的第二种方法，即你的代码看起来像这样：\n\n```\ndoE(\n \
    \ doD(\n    doC(\n      doB(\n        doA(someData)\n      )\n    )\n  )\n)\n\
    ```\n\n也可以格式化为这样：\n\n```\ndoE(doD(doC(doB(doA(someData)))))\n```\n\n无论哪种方法，这都很趣，因为这就像在写\
    \ Lisp 代码，你从内向外读取它。（少量量的情况下，我喜欢这种风格。）\n\n但关于 EOP 和代数代换，还有一个更重要的点：\n\n> 当你的表达式（方程）不需要按照特定顺序求值时，编译器可以完全自由地并行求值它们，然后在之后的某个时候将它们合并为一个结果。我只用过几周\
    \ Haskell，但我读过 Haskell 编译器的工作原理就是这样，它能够这样做是因为 Haskell 代码被保证是 FP 代码。\n\n## 开启并行编程\n\
    \n为了演示我的意思，这里有一个示例，你仍然可以假设所有函数都是纯的，且变量和数据类型是不可变的：\n\n```\nval a = f1(x)\nval b\
    \ = f2(y)\nval c = f3(z)\nval d = f(a, b, c)\n```\n\n因为前三个表达式之间没有依赖关系，智能编译器可以完全自由地在不同的线程（或者是最近的*纤/fibers*）上运行这些函数。所以，如果每个函数的运行需要\
    \ 20 秒，你不需要等待它们串行运行 60 秒；它们可以并行运行，你在 20 秒内就能获得最终结果。\n\n从视觉上看，这意味着与其拥有这种缓慢的串行代码：\n\
    \n```\n// 代码串行运行，每个 20 秒，总共 60 秒\nval a = f1(x)                              \
    \              \n<<<<<<<                                                  \n \
    \ >>> val b = f2(y)                                     \n<<<<<<<            \
    \                                      \n      >>> val c = f3(z)             \
    \                    \n<<<<<<<                                               \
    \   \n        >>> val d = f(a, b, c)\n```\n\n你可以拥有这种并行运行的高性能代码：\n\n```\n// 代码并行运行，总共\
    \ 20 秒\nval a = f1(x)                            \n<<<<<<<                   \
    \                               \nval b = f2(y)                            \n\
    <<<<<<<                                                  \nval c = f3(z)     \
    \                       \n<<<<<<<                                            \
    \      \nval d = f(a, b, c)                       \n``` \n\n当你需要高性能代码时——而且谁不想要呢——这是一个巨大的胜利。为了获得这些收益，你只需要使用：\n\
    \n*   不可变变量\n*   不可变数据结构\n*   纯函数\n*   表达式（而不是语句）\n\n## 这对可变对象无效\n\n必须明确一点是，当你使用可变变量、可变数据结构和不纯函数时，编译器无法为你做这些。\n\
    \n也许演示这一点最简单的方法是假设你有以下三行代码，它们由两个语句和一个带有副作用的函数组成：\n\n```\nprintln(\"What’s your\
    \ name?\")               // 语句\nval name = readLine()                      //Effects\n\
    println(s\"You said your name\")\n```\n\n另一个例子是，假设你有三个函数 `g1`、`g2` 和 `g3`，它们各都会修改共享状态。如果\
    \ `g1` 写入一个 `g2` 读取的变量，而 `g2` 写入一个 `g3` 读取的变量，这些操作确实需要按照那个顺序发生。\n\n但如果 `g1`、`g2`\
    \ 和 `g3` 是并行运行的——那么，事情发生的顺序就没有保证了。我们说从这种情况下得到的结果是*不确定的*（indeterminate）。\n\n有一次我在为一个客户工作，他们遇到了一个问题，偶尔会出现客户数据不一致的情况。他们的用户名和街道地址可能是正确的，但城市、州或邮政编码与用户名和地址不匹配。\n\
    \n在不可变变量、不可变数据结构和纯函数的情况下，这种情况不会发生。\n\n## 代码推理\n\n你有时会听到 FP 程序员说他们喜欢“推理他们的代码”。当然，在\
    \ OOP 中我们也这样做，但当 FP 程序员说这句话时，意味着我们像观察代数一样观察代码，并确保它们能够按照我们想要合并。\n\n如果它们可以并行运行，很好，那太棒了。但如果它们不能，你会看到我们*确保*它们按串行运行，通常使用\
    \ `for` 表达式：\n\n```\nval result =\n  for\n    a <- g1(x)\n    b <- g2(y)\n   \
    \ c <- g3(z)\n    yield\n      // 这里是对 a, b, 和 c 的使用\n      g4(a, b, c)\n```\n\
    \n这是一个有些为了意的例子，但我将在本书的后部分演示这种技术的实际用途。\n\n# 16. 总结：Java/OOP vs 纯函数\n\n当我开始这本书的这个章节时，我展示了在超过\
    \ 15 万行的生产级 Java 代码中的最复杂的两个类型声明：\n\n```java\nSortedMap<String, Integer> wordCountMap\
    \ = new TreeMap();\npublic Class<?> getColumnClass(int columnIndex) {\n```\n"
- fmt: "\nConversely, as you saw in the Word Count example, as I sketched out that\
    \ application in Scala using pure functions, I’m already working with data types\
    \ like these:\n\n`Seq[String]`\n\n`VectorMap[String, Int]   // or: MapSortedByValueDesc[Word,\
    \ Count]`\n\nThis is a hint that in Scala we use *types* a lot more than developers\
    \ are used to using in Java/OOP.\n\nAs someone who’s interested in helping programmers\
    \ who want to learn more about Scala, it’s important to acknowledge that this\
    \ is a different world than Java/OOP. In the Java world you generally only work\
    \ with types like this if you’re a library developer, but in the Scala world,\
    \ developers at all levels work with them. So I think it’s important to acknowledge\
    \ this difference.\n\nThat being said, I’ll ask: Did you find the Word Count example\
    \ hard to follow? I suspect — and hope — it wasn’t hard to follow. As you saw,\
    \ I just sketched out a series of pure functions and their type signatures.\n\n\
    ## Benefits\n\nThere are a lot of benefits to this approach of working with only\
    \ pure functions, immutable variables, and immutable data structures. First, here’s\
    \ some of what you’ve already seen:\n\n* You write pure functions.\n* Writing\
    \ pure functions is about as easy as it gets. You don’t have to worry about the\
    \ state of the entire application, all you have to think about is (a) what comes\
    \ in, and (b) what goes out. own* Because of those attributes, you can sketch\
    \ solutions just like I did. Just sketch out the solution as a series of pure\
    \ functions, and then fill in the function bodies.\n* You can trust the type signatures\
    \ of pure functions, they cannot lie. Their signatures tell you what’s going on.\n\
    * Because of that, you can trust pure functions that other developers write.\n\
    * I’ve only briefly touched on this so far, but if you look at a pure function’s\
    \ signature and see `Option`, `Try`, or `Either` as the return type, you immediately\
    \ know, “Something can go wrong here. (More on this soon.)”\n\nBeyond those benefits:\n\
    \n* Not only are pure functions easier to write, they’re easier to read. Just\
    \ look at a pure function’s type signature and you’ll get a strong idea of what\
    \ that function can possibly do.\n* You’ll start to see solving problems as being\
    \ like algebra, or creating a blueprint as an architect or engineer.\n* As you\
    \ also saw with the Word Count example, the final solution to the problem is just\
    \ a matter of combining your pure functions, like algebraic equations.\n* Following\
    \ all of this logic, *testing* pure functions is also easier. All you have to\
    \ do is set up what’s going in the front door, and what you expect to come out\
    \ the back door. You don’t have to worry about mutable state anywhere else in\
    \ the application (side doors).\n\n## Next\n\nBefore we move completely on from\
    \ the Word Count example, let’s add a real-world scenario to it: your boss comes\
    \ to you and requests a change.\n\n# 17. A Change To The wc Application\n\nSo\
    \ the change is that your boss comes to you and says, “Um, err, yeah, I was wrong\
    \ about that Word Count application. You won’t be getting a `String` that represents\
    \ the document, you’ll be getting a `String` that is the name of the file you\
    \ need to read, and it contains the document.”\n\nThis isn’t a huge change, but\
    \ it does bring up some interesting concerns; what should you do if:\n\n* The\
    \ file doesn’t exist?\n* The file isn’t readable?\n\nIn Java/OOP — and even Scala/OOP\
    \ — you might throw exceptions and then let the callers of your code deal with\
    \ those. But in Scala/EOP and Scala/FP we don’t do those things. We don’t throw\
    \ exceptions because those would short-circuit our algebraic equations or blow\
    \ up our blueprints.\n\nInstead, we use a different technique known as *functional\
    \ error handling* and *error-handling data types*. We’ll look at those next.\n\
    \n# 18. Functional Error Handling (FEH)\n\nIn Scala, the correct solution to handling\
    \ potential errors is to use Scala’s *error-handling data types*. In short, this\
    \ means that a function that can fail should return one of the `Option`, `Try`,\
    \ or `Either` types:\n\n`def wc(f: File): Option[?]`\n\n`def wc(f: File): Try[?]`\n\
    \n`def wc(f: File): Either[?]`\n\nThe basic idea is that you return an error-handling\
    \ data type to account for the possibility that an error may occur in this function.\n\
    \n## These types are wrappers\n\nError-handling types are basically *wrappers*,\
    \ and inside their wrapper they contain one of two possibilities:\n\n* The function\
    \ succeeded, and you can access its success value\n* The function failed, and\
    \ you can access its error value\n\nSo it’s like you’re getting a container back\
    \ from a function:\n\n```\n┏━━━━━━━━━━━━━━━━━━━━┓\n      Option\n   Success OR\
    \ Failure\n┗━━━━━━━━━━━━━━━━━━━━┛\n```\nAs shown, when you get the container back\
    \ from function, it will contain either a Success Value or not both. A great thing\
    \ about this approach is that unlike exceptions, they don’t short-circuit your\
    \ code: you’re just working with another data type. You treat this result as a\
    \ value, and you continue your code as algebra. The `Option`, `Try`, and `Either`\
    \ error-handling types take slightly different approaches, but that’s the essence\
    \ of them.\n\nSo let’s see how they work\n\nThinking in OOP for a moment, each\
    \ of these are parent types, and each have two sub-types. For these three values,\
    \ these are the parent types and their sub-types:\n\n* `Option`, `Some`, and `None`\n\
    * `Try`, `Success`, and `Failure`\n* `Either`, `Right`, and `Left`\n\nTheir class\
    \ hierarchies are basic OOP, and look like this:\n\n```\n┏━━━━┳┓\n  Option\n \
    \ Some\nNone\n┗━━━━┻┛\n```\n```\n┏━━━━┳┓\n  Try\n  Success\nFailure\n┗━━━━┻┛\n\
    ```\n```\n┏━━━━┳┓\n  Either\n  Right\nLeft\n┗━━━━┻┛\n```\n\n# 19. FEH: Option\n\
    \nThe first functional error-handling type I like to look at is `Option`, and\
    \ its companions, `Some` and `None`. I do this because (a) its similar to Java’s\
    \ `Optional` type, and (b) it’s a little more basic than `Try` and `Either`.\n\
    \n## In a world where things can go wrong …\n"
  raw: "Conversely, as you saw in the Word Count example, as I sketched out that application\
    \ in Scala using pure functions, Iâ€™m already working with data types like these:\n\
    \n`Seq[String]`\n\n`VectorMap[String, Int]   // or: MapSortedByValueDesc[Word,\
    \ Count]`\n\nThis is a hint that in Scala we use *types* a lot more than developers\
    \ are used to using in Java/OOP.\n\nAs someone whoâ€™s interested in helping programmers\
    \ who want to learn more about Scala, itâ€™s important to acknowledge that this\
    \ is a different world than Java/OOP. In the Java world you generally only work\
    \ with types like this if youâ€™re a library developer, but in the Scala world,\
    \ developers at all levels work with them. So I think itâ€™s important to acknowledge\
    \ this difference.\n\nThat being said, Iâ€™ll ask: Did you find the Word Count\
    \ example hard to follow? I suspect â€” and hope â€” it wasnâ€™t hard to follow.\
    \ As you saw, I just sketched out a series of pure functions and their type signatures.\n\
    \n## Benefits\n\nThere are a lot of benefits to this approach of working with\
    \ only pure functions, immutable variables, and immutable data structures. First,\
    \ hereâ€™s some of what youâ€™ve already seen:\n\n*   You write pure functions.\n\
    \n*   Writing pure functions is about as easy as it gets. You donâ€™t have to\
    \ worry about the state of the entire application, all you have to think about\
    \ is (a) what comes in, and (b) what goes out.\n\n*   Because of those attributes,\
    \ you can sketch solutions just like I did. Just sketch out the solution as a\
    \ series of pure functions, and then fill in the function bodies.\n\n*   You can\
    \ trust the type signatures of pure functions, they cannot lie. Their signatures\
    \ tell you whatâ€™s going on.\n\n*   Because of that, you can trust pure functions\
    \ that other developers write.\n\n*   Iâ€™ve only briefly touched on this so far,\
    \ but if you look at a pure functionâ€™s signature and see `Option`, `Try`, or\
    \ `Either` as the return type, you immediately know, â€œSomething can go wrong\
    \ here.â€ (More on this soon.)\n\nBeyond those benefits:\n\n*   Not only are pure\
    \ functions easier to write, theyâ€™re easier to read. Just look at a pure functionâ€™s\
    \ type signature and youâ€™ll get a strong idea of what that function can possibly\
    \ do.\n\n*   Youâ€™ll start to see solving problems as being like algebra, or\
    \ creating a blueprint as an architect or engineer.\n\n*   As you also saw with\
    \ the Word Count example, the final solution to the problem is just a matter of\
    \ combining your pure functions, like algebraic equations.\n\n*   Following all\
    \ of this logic, *testing* pure functions is also easier. All you have to do is\
    \ set up whatâ€™s going in the front door, and what you expect to come out the\
    \ back door. You donâ€™t have to worry about mutable state anywhere else in the\
    \ application (side doors).\n\n## Next\n\nBefore we move completely on from the\
    \ Word Count example, letâ€™s add a real-world scenario to it: your boss comes\
    \ to you and requests a change.\n\n# 17\\. A Change To The wc Application\n\n\
    So the change is that your boss comes to you and says, â€œUm, err, yeah, I was\
    \ wrong about that Word Count application. You wonâ€™t be getting a `String` that\
    \ represents the *document*, youâ€™ll be getting a `String` that is the *name\
    \ of the file* you need to read, and it contains the document.â€\n\nThis isnâ€™t\
    \ a huge change, but it does bring up some interesting concerns; what should you\
    \ do if:\n\n*   The file doesnâ€™t exist?\n\n*   The file isnâ€™t readable?\n\n\
    In Java/OOP â€” and even Scala/OOP â€” you might throw exceptions and then let\
    \ the callers of your code deal with those. But in Scala/EOP and Scala/FP we donâ€™t\
    \ do those things. We donâ€™t throw exceptions because those would short-circuit\
    \ our algebraic equations or blow up our blueprints.\n\nInstead, we use a different\
    \ technique known as *functional error handling* and *error-handling data types*.\
    \ Weâ€™ll look at those next.\n\n# 18\\. Functional Error Handling (FEH)\n\nIn\
    \ Scala, the correct solution to handling potential errors is to use Scalaâ€™s\
    \ *error-handling data types*. In short, this means that a function that can fail\
    \ should return one of the `Option`, `Try`, or `Either` types:\n\n`def wc(f: File):\
    \ Option[?]`\n\n`def wc(f: File): Try[?]`\n\n`def wc(f: File): Either[?]`\n\n\
    The basic idea is that you return an error-handling data type to account for the\
    \ *possibility that an error may occur in this function*.\n\n## These types are\
    \ wrappers\n\nError-handling types are basically *wrappers*, and inside their\
    \ wrapper they contain one of two possibilities:\n\n*   The function succeeded,\
    \ and you can access its *success value*\n\n*   The function failed, and you can\
    \ access its *error value*\n\nSo itâ€™s like youâ€™re getting a container back\
    \ from a function:\n\n`â”Œâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”`\n\
    \n`â”‚                                       â”‚`\n\n`â”‚   Success Value  OR\
    \  Failure Value    â”‚`\n\n`â”‚                  --                   â”‚`\n\n\
    `â””â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”˜`\n\
    \nAs shown, when you get the container back from the function, it will contain\
    \ either a Success Value *or* a Failure Value â€” but not both.\n\nA great thing\
    \ about this approach is that unlike exceptions, they donâ€™t short-circuit your\
    \ code: youâ€™re just working with another data type. You treat this result as\
    \ a *value*, and you continue writing your code as algebra. Youâ€™ll see what\
    \ this means shortly.\n\nThe `Option`, `Try`, and `Either` error-handling data\
    \ types take slightly different approaches, but thatâ€™s the essence of them.\n\
    \nSo letâ€™s see how they work.\n\n## The three error-handling types\n\nAs mentioned,\
    \ Scalaâ€™s three error-handling types are named `Option`, `Try`, and `Either`.\
    \ Thinking in OOP for a moment, each of these are parent data types, and they\
    \ each have two sub-types.\n\nFor these three values, these are the parent types\
    \ and their two sub-types:\n\n*   `Option`, `Some`, and `None`\n\n*   `Try`, `Success`,\
    \ and `Failure`\n\n*   `Either`, `Right`, and `Left`\n\nTheir class hierarchies\
    \ are basic OOP, and look like this:\n\n `      â”Œâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”`\n\
    \n`      â”‚  Option  â”‚`\n\n`      â””â”€â”€â”€â”€â”¬â”€â”€â”€â”€â”€â”˜`\n\n\
    `           â”‚          `\n\n`     â”Œâ”€â”€â”€â”€â”€â”´â”€â”€â”€â”€â”€â”€â”\
    \    `\n\n`     â”‚            â”‚    `\n\n`â”Œâ”€â”€â”€â”€â”´â”€â”€â”€â”   â”Œâ”€â”€â”€â”€â”´â”€â”€â”€â”`\n\
    \n`â”‚  Some  â”‚   â”‚  None  â”‚`\n\n`â””â”€â”€â”€â”€â”€â”€â”€â”€â”˜   â””â”€â”€â”€â”€â”€â”€â”€â”€â”˜`\n\
    \nthis:\n\n `        â”Œâ”€â”€â”€â”€â”€â”`\n\n`        â”‚ Try â”‚`\n\n`      \
    \  â””â”€â”€â”¬â”€â”€â”˜`\n\n`           â”‚            `\n\n`     â”Œâ”€â”€â”€â”€â”€â”´â”€â”€â”€â”€â”€â”€â”\
    \    `\n\n`     â”‚            â”‚    `\n\n`â”Œâ”€â”€â”€â”€â”´â”€â”€â”€â”€â”  â”Œâ”€â”€â”€â”€â”´â”€â”€â”€â”€â”`\n\
    \n`â”‚ Success â”‚  â”‚ Failure â”‚`\n\n`â””â”€â”€â”€â”€â”€â”€â”€â”€â”€â”˜  â””â”€â”€â”€â”€â”€â”€â”€â”€â”€â”˜`\n\
    \nand this:\n\n `       â”Œâ”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”`\n\n`       â”‚  Either\
    \  â”‚`\n\n`       â””â”€â”€â”€â”€â”¬â”€â”€â”€â”€â”€â”˜`\n\n`            â”‚  \
    \          `\n\n`     â”Œâ”€â”€â”€â”€â”€â”€â”´â”€â”€â”€â”€â”€â”€â”    `\n\n`  \
    \   â”‚             â”‚    `\n\n`â”Œâ”€â”€â”€â”€â”´â”€â”€â”€â”    â”Œâ”€â”€â”€â”€â”´â”€â”€â”€â”€â”`\n\
    \n`â”‚  Left  â”‚    â”‚  Right  â”‚`\n\n`â””â”€â”€â”€â”€â”€â”€â”€â”€â”˜    â””â”€â”€â”€â”€â”€â”€â”€â”€â”€â”˜`\n\
    \nIf your background is Java, you can think of `Option`, `Try`, and `Either` as\
    \ being interfaces, and their sub-types are implementations of their interface.\n\
    \nIn the following lessons weâ€™ll look at what this means, and how these types\
    \ work.\n\n# 19\\. FEH: Option\n\nThe first functional error-handling type I like\
    \ to look at is `Option`, and its companions, `Some` and `None`. I do this because\
    \ (a) its similar to Javaâ€™s `Optional` type, and (b) itâ€™s a little more basic\
    \ than `Try` and `Either`.\n\n## In a world where things can go wrong â€¦"
