    \ 数据类型的工作原理感兴趣——或者你像几年前的我一样好奇：“这怎么可能行得通！”——关键之一是它们采用了“按名调用”（Call By-Name, CBN）输入参数。对我来说，这是一个不常见的术语，所以在看三个例子之前，让我们先来看看它的含义。\n\
    \n## 按值调用（Call By-Value）\n\n要理解 CBN 参数，首先要知道默认情况下，函数输入参数是“按值调用”（Call By-Value,\
    \ CBV）参数。《Programming Scala》这本书（由 Martin Odersky 合著）对“按值”参数有如下陈述：\n\n> “通常，函数的参数是按值的参数；也就是说，参数的值在传递给函数之前就已经确定了。”\n\
    \n所以，如果你传递一个名为 `x` 的变量且其值为 `42`，那么传递进去的就是 `42`。\n\n## 按名调用（Call By-Name）\n\n相反，“按名”参数与按值参数非常不同。Rob\
    \ Norris 观察到，你可以这样理解这两种类型的参数：\n\n*   一个*按值*参数就像接收一个 `val` 字段；它的主体体在参数绑定到函数之前会被求值一次。\n\
    *   一个*按名*参数就像接收一个 `def` 方法；它的主体会在稍后被求值，取决于在函数内部何时被使用。\n\n他接着说这些陈述“并非 100% 准确”，但我认为它们是很好的类比。第二个陈述的重要部分是，按名参数就像一个\
    \ `def` 函数，在你在函数内部引用它之前，该参数不会发生任何操作。如果该参数位于 `if`/`else` 表达式或 `match` 表达式中，且代码分支从未被到达，那么这个\
    \ CBN 参数将永远不会被执行。\n\n《Scala Puzzlers》这本书证实了这一点，它提到按名参数“仅在函数内部被引用时才被求值”。\n\n##\
    \ 按名参数更好的名字？\n\n根据维基百科，这些术语可以追溯到一种名为 ALGOL 60 的语言（是的，1960 年）。我并不是针对那种语言，但对我来说，“按名”这个词并没有帮助（尽管我确定它在当时有明确的含义）。\n\
    \n如今发现以下术语更准确且更有意义：\n\n*   访问时求值（Evaluate on access）\n*   使用时求值（Evaluate on use）\n\
    *   被访问时求值（Evaluate when accessed）\n*   引用时求值（Evaluate when referenced）\n\n如果你愿意，可以将这些短语中的“求值”（Evaluate）替换为“执行”（Execute）或“运行”（Run）。\n\
    \n但是，因为我无法回到过去改变这个术语，我将在本节中继续使用缩写 CBN。\n\n## 示例 1\n\n最简单的 CBN 参数示例可能是：\n\n```scala\n\
    def exec(blockOfCode: => Unit): Unit =\n    blockOfCode\n```\n\n在这个例子中，`blockOfCode`\
    \ 是一个 CBN 参数。注意，“普通”CBV 输入参数与 CBN 参数之间的区别在于在参数定义中使用了 `=>` 转换符号：\n\n```scala\n\
    def f(param: Int) ...      // CBV 参数\ndef f(param: => Int) ...   // CBN 参数\n \
    \             --\n```\n\n因为 `=>` 在 Scala 中始终意味着*转换*（transform），你可以理解在这个例子中，`param`\
    \ 是*某种*被转换为 `Int` 的东西。\n\n现在，回到 `exec` 函数：\n\n```scala\ndef exec(blockOfCode:\
    \ => Unit): Unit =\n    blockOfCode\n```\n\n我们说它是一个执行传入代码块的函数。关于 `blockOfCode`\
    \ CBN 参数唯一的一点是它的返回类型是 `Unit`：\n\n```scala\ndef exec(blockOfCode: => Unit): Unit\
    \ =\n    blockOfCode\n```\n"
- fmt: "\nThen the third parameter group is the block of code the caller wants to\
    \ run if the two test conditions are `true`. In my case I’ll require that this\
    \ returns `Unit`, to keep things simple:\n\n```scala\ndef doubleIf(test1: => Boolean)(test2:\
    \ => Boolean)(codeBlock: => Unit)\n```\n\nAnd finally, the body of the function\
    \ says, \"If both test conditions are `true`, run the block of code\":\n\n```scala\n\
    // test1 and test2 are shortened to t1 and t2 to fit the book’s page width\ndef\
    \ doubleIf(t1: => Boolean)(t2: => Boolean)(codeBlock: => Unit): Unit =\n    if\
    \ t1 && t2 then codeBlock\n```\n\nNow if you put this following code in the REPL,\
    \ you’ll see that the \"Discount!\" text is printed:\n\n```scala\nval age = 20\n\
    val numAccidents = 0\ndoubleIf(age > 18)(numAccidents == 0) {\n    println(\"\
    Discount!\")\n}\n```\n\nBut if both of those conditions are not `true`, you’ll\
    \ see that \"Discount!\" is *not* printed.\n\nAs I hope this example shows, CBNs\
    \ combined with multiple parameter groups give you the power to create your own\
    \ control structures, and eventually your own DSLs.\n\n## Key points\n\nAs a quick\
    \ recap, these are some key points about CBNs:\n\n- You define them with the `=>`\
    \ symbol\n- You must specify their return type\n- They’re not executed until you\
    \ call them in your function\n- They can be called anywhere in your function\n\
    - They can be multiple times in your function\n- Combined with multiple parameter\
    \ groups, they let us write our own control structures and DSLs\n\n# Appendix\
    \ I. Glossary\n\nThis glossary includes \"simple\" descriptions of the terms used\
    \ in this book, and a few other terms you’ll hear in the FP world. (By *simple*\
    \ I mean not too technical, or mathematical.)\n\n**algebraic substitution, substitution\
    \ model**\nMeans that you can substitute function calls with their results, just\
    \ like you’re writing algebra.\n\n**anonymous functions, lambda**\nIn Scala, an\
    \ anonymous function (or `lambda`) is the definition of a function *that isn’t\
    \ bound to a variable*. These are often little blocks of code that you pass into\
    \ other functions, such as when calling `map` or `filter`.\n\n**compose, composition,\
    \ combinator**\nIn FP we say that we *compose* solutions by combining code like\
    \ pure functions and expressions together. A key in this is that in order for\
    \ us to be able to compose them, the output of one function must match the input\
    \ to another function. You can think of this as being like writing a pipeline\
    \ of Unix commands, such as `ps aux grep root wc -l`.\n\n**deterministic**\nVery\
    \ similar to referential transparency (if not the same), a function is deterministic\
    \ if it always produces the same output for a given input.\n\n**effect, effectful**\n\
    (See below.)\n\n**expression-oriented programming (EOP)**\nA technique of programming\
    \ with *expressions* rather than *statements*, where an *expression* is a block\
    \ of code that returns a result, and has no side effects.\n\n**free variable**\n\
    A free variable is what I call a variable that comes into a function through a\
    \ side door. It’s not a formal function input parameter that’s declared in the\
    \ function’s signature (the front door).\n\n**functor**\nI don’t discuss functors\
    \ in this book, but a functor *in Scala* is basically just a class that properly\
    \ implements a `map` method. (There’s more to it than that, but from a practical\
    \ standpoint, that’s a key aspect.)\n\n**higher-order function**\nA function that\
    \ either (a) takes a function as an input parameter, or (b) returns a function\
    \ as its result.\n\n**idempotent, idempotence**\nSimilar to the terms *deterministic*\
    \ and *referential transparency*, it’s said that a function is idempotent if the\
    \ result of executing it multiple times for a given input is the same as executing\
    \ it only once for the same input.\n\n**monad**\n*A monad in Scala* is basically\
    \ just a class that implements a `map` and a `flatMap` method, AND, properly implemented,\
    \ these two methods let you use instances of your class in a series of steps in\
    \ a `for` expression. (Again, there’s bit more to it than that.) Classes like\
    \ `List`, `Vector`, `Option`, `Try`, and `Either` are all monads. *In any FP language*,\
    \ a monad guarantees lets you sequentially compose effects, such as with `flatMap`\
    \ and in `for` expressions. (See below for a bit more.)\n\n**pure function**\n\
    (See below.)\n\n**referential transparency**\nAn expression is referentially transparent\
    \ if it can be replaced by its resulting value without changing the behavior of\
    \ the program.\n\n## Effect, effectful\n\nI don’t believe there’s a standard definition\
    \ of the terms *effect* and *effectful*. Some people say that a function is effectful\
    \ if it has a side effect, such as dealing with I/O.\n\nIn my blog post, [What\
    \ do \"effect\" and \"effectful\" mean in functional programming?](https://alvinalexander.com/scala/what-effects-effectful-mean-in-functional-programming/),\
    \ I wrote something different, which I learned from the book, [Functional and\
    \ Reactive Domain Modeling](https://amzn.to/2uYGevc). Based on that book, in my\
    \ blog post — and also from what you’ve seen in this book — I make the following\
    \ statements:\n\n- `Option` models the effect of *optionality* (of some result\
    \ being optional)\n- `Try` and `Either` model the effect of *failure* (they manage\
    \ exceptions as effects)\n- `Future` models *latency* as an effect\n\nAnother\
    \ example is that if an `IO` type worked *only* with input/output, we could say\
    \ that it “models I/O as an effect.” (However, as mentioned, modern `IO` types\
    \ have much more power than this.)\n\nFrom these examples we can say that an effect\
    \ is *what the data type handles*: When you see `Option` as a function’s return\
    \ type you immediately think the result is optional; when you see `Try`, you know\
    \ that an error can happen; and so on. (Basically these types speak to you; they\
    \ tell you what type of effect is happening inside a function.)\n\nHowever, in\
    \ addition to this, one thing that’s stressed in various ZIO documents and courses\
    \ is that an effect is a *blueprint* of statements that can produce a side effect,\
    \ and because it’s just a blueprint, nothing happens right away.\n\nSimilarly,\
    \ the [Cats Effect documentation](https://typelevel.org/cats-effect/docs/concepts)\
    \ states, \"An effect is a description of an action (or actions) that will be\
    \ taken when evaluation happens.\"\n\nBefore Scala, my background was as an engineer,\
    \ Unix admin, and then Java programmer. So when I started with Scala, one thing\
    \ I didn’t know is that `Future` type does NOT fit this description, because as\
    \ soon you call its constructor, it begins running; it doesn’t separate description\
    \ from execution. Because of this, (a) `Future` is a good example of a type that\
    \ is *not* an effect, and (b) FPers have created other types (like `IO` and `ZIO`)\
    \ to use instead of `Future`.\n\nCommon effects that are handled by Cats Effect\
    \ and ZIO are:\n\n- Concurrency\n- Error handling\n- Resource safety (closing\
    \ resources, such as when working with I/O)\n- Streaming\n- Tracing/troubleshooting\n\
    \n> This is a good time to be clear that a *type* is something like `Int` or `Option`,\
    \ and a *value* is something like `1` or `Some(\"foo\")`.\n\n## Monads (example)\n\
    \nI wrote about monads earlier, and I mention there that `Option` is a monad.\
    \ In Scala, a monad is essentially a type that properly implements `map` and `flatMap`\
    \ methods so it can be used in `for` expressions. With `Option`, this specifically\
    \ means that we can sequence effects in `for` expressions, where those effects\
    \ are created to model the concept of optionality.\n"
