    function, Iâ€™ll show a better way to write it in the following chapters.)


    ## EOP benefits


    Because expressions always return a result and generally donâ€™t have side effects,
    there are several benefits to EOP:


    *   The code is *easier to write, read, and test*. Inputs go into a pure function,
    a result is returned, itâ€™s assigned to an immutable variable, and there are
    no side effects.


    *   Combined with Scalaâ€™s syntax, EOP results in concise, *expressive* code.


    *   Although itâ€™s only been hinted at in these examples, expressions can often
    be executed in any order. This subtle feature lets you execute expressions in
    parallel, which is a huge bonus when youâ€™re trying to take advantage of multicore
    CPUs.


    If youâ€™re interested in more details, I write about all of these benefits in
    [Functional Programming, Simplified](https://alvinalexander.com/scala/functional-programming-simplified-book)
    (and ~40% of that book is free).


    ## On to the code!


    Given this background, itâ€™s time to start writing some code that demonstrates
    the benefits of pure functions, immutable things, and EOP!


    # 13\. Example #1: Solving Problems with Pure Functions and EOP


    Writing Scala code like this gets to be so much like algebra that you can imagine
    walking in on Albert Einstein writing at a chalkboard, and following his equations
    one at a time until he joins them all together at the end.


    To demonstrate this, letâ€™s walk through the process of writing a â€œword occurrenceâ€
    algorithm using only pure functions, immutable variables, immutable data structures,
    and EOP. I think youâ€™ll see that we can simply talk about this as we sketch
    out a series of pure function signatures â€” just like writing algebra on a chalkboard.


    > This example was inspired by a Haskell book. Iâ€™d like to give it credit, but
    I havenâ€™t been able to remember which book I saw it in.


    ## Source code


    If you want to work with this exampleâ€™s source code, you can find it here in
    the bookâ€™s Github repository, under the `WordCount` folder:


    *   [github.com/alvinj/LearnFunctionalProgrammingBook](https://github.com/alvinj/LearnFunctionalProgrammingBook)


    ## Problem statement


    The first thing to do in any problem-solving effort is to write a clear problem
    statement:


    > Given a document thatâ€™s represented as a single Scala `String`, count the
    number of occurrences of each word in that document.


    In addition to that statement, weâ€™re also shown that the output of the algorithm
    should look like this, with the words in the first column and the number of occurrences
    in the second column:


    `the    543`


    `an     210`


    `or     99`


    `(more words here ...)`


    Okay, that seems good enough for now. So, how do we start?


    ## Getting started


    The first thing we can say is that weâ€™re going to write a pure function that
    works like a â€œword occurrencesâ€ or â€œword countâ€ function. I donâ€™t want
    to keep writing the word â€œoccurrences,â€ so to keep this simple Iâ€™ll refer
    to it as a *word count* function, which Iâ€™ll name `wc`:


    `def wc`


    Next, I know from the problem statement that it will take the document as a `String`
    input parameter:


    `def wc(document: String)`


    Now if I look at the sample output, that sure looks like a `Map` to me. More specifically,
    a map where the key is a string, and the value is an integer:


    `Map[String, Int]`


    For instance, in Scala, that sample data looks like this `Map`:


    `Map(`


    `    "the" -> 543,`


    `    "an" -> 210,`


    `    "or" -> 99`


    `)`


    Also note that the output is printed in sorted order, so weâ€™ll want to return
    a `VectorMap` to indicate to others that thereâ€™s something unique about this
    map:


    `VectorMap[String, Int]`


    A `VectorMap` is a specific type of immutable `Map` that lets us return the map
    values in a sorted order.


    Knowing this, we can finish the sketch of our main function signature like this:


    `def wc(document: String): VectorMap[String, Int]`


    So there we have it, thatâ€™s the signature for our main function. Now all we
    have to do is sketch out some more pure functions that this function will call.


    ## The next steps


    There are several ways we *could* proceed next, but because the requirement is
    that we just turn a `String` into a `Map`, thereâ€™s no need to deal with that
    `String` as paragraphs and sentences. Instead, we can work with it as is, adjusting
    it slightly for our needs.


    ## Get rid of the newline characters


    The first thing Iâ€™ll do is strip all the newline characters from the `String`.
    What Iâ€™m thinking is that I can replace all those newline characters with blank
    spaces, and then in a few moments Iâ€™ll reduce all occurrences of multiple blank
    spaces down to single blank spaces.


    When you think of how this â€œget rid of all newline charactersâ€ function needs
    to work, you can imagine that it takes the existing `String` as its input parameter,
    so I start with this:


    `def replaceNewlinesWithBlanks(s: String)`


    Next, I know that I want to return a `String` with all of the newline characters
    replaced with blanks, so I can add `String` as the functionâ€™s return type:


    `def replaceNewlinesWithBlanks(s: String): String`


    So thatâ€™s a sketch of that function signature. At this point I feel comfortable
    that this is the first step of my `wc` function, so I add it to `wc`â€™s body:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    // more code to come ...`


    > Note that Iâ€™ll be wrapping my expressions inside `wc` as shown because (a)
    Iâ€™m intentionally using long, meaningful function names, and (b) itâ€™s hard
    to print wide lines in a book.


    ## Remove formatting characters


    The next thing I need to do is to remove all formatting characters from the string
    â€” things like periods, exclamation points, question marks, semi-colons, colons,
    and em dashes. So again, this is going to be a function that takes a `String`
    as input and returns a `String`, so I sketch this:


    `def stripFormattingCharacters(s: String): String`


    I really donâ€™t want you thinking about algorithms at the moment â€” just function
    signatures. But if you find yourself thinking about algorithms, this function
    can either delete all of those formatting characters or replace them with blank
    spaces; either approach will work.


    When I add this function to `wc`â€™s body, it now looks like this:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    val stringWithoutFormatting =`


    `        stripFormattingCharacters(stringWithoutNewlines)`


    ## Eliminate multiple blank spaces


    At this point I canâ€™t think of any other changes I want to make to the initial
    string. You can imagine that we started with a multiline string that looks like
    this:


    `Foo barâ€™s baz?`


    `Buzzle; buzzy. Burf!`


    and at this point that string should look like this:


    `Foo barâ€™s baz  Buzzle buzzy Burf`


    Weâ€™re still working with a `String`, and all of its words should be separated
    by one or more blank spaces, so this is a good time to create a function to convert
    multiple blank spaces into a single blank space. Once again we have a `String`
    coming in and a `String` going out, so I sketch this function like this:


    `def squeezeBlankSpaces(s: String): String`


    Then I add that function call to `wc` to get this:


    `def wc(document: String): VectorMap[String, Int] =`


    `    val stringWithoutNewlines =`


    `        replaceNewlinesWithBlanks(document)`


    `    val stringWithoutFormatting =`


    `        stripFormattingCharacters(stringWithoutNewlines)`'
