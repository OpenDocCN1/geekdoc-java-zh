    # 7\. Is Java/OOP Code That Simple? A Statistical Look


    As I write this book, I havenâ€™t actually written Java code in quite some time
    now, and knowing that my memory isnâ€™t always accurate, I wondered, â€œWas my
    code really that simple?â€


    To verify everything I just shared with you, I searched three old Java codebases
    â€” all projects that were in production in their day. I just did a simple search
    for the `<.*>` pattern â€” to find any data types like `<String>`, `<String, Integer>`,
    etc. â€” and found these percentages of occurrences within `*.java` files in those
    three projects:


    `USAGE %    LINES FOUND    TOTAL NUMBER OF LINES`


    `-------    -----------    ---------------------`


    `  0.2         118                74,200`


