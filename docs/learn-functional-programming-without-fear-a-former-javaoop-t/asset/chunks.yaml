  trans: "\n\n**观点 2：** 我在披萨例子中没有展示的第二点是，许多 `Java` 方法可能会抛出异常，当它们可能发生时，你必须考虑 (a) 处理“成功”情况，以及\
    \ (b) 处理“失败”情况，对我而言，这意味着要用 `try`/`catch` 包装起来方法调用。\n\n这让大脑变得异常痛苦，以至于我发展到了这种程度——使用模型/视图/控制器（MVC）范式——我只在顶层控制器中处理异常。我在异常发生的地方记录异常，但直接让它们向上冒泡到我的控制器中，并在那里进行处理。\n\
    \n那时我对函数式编程一无所知，也想不出更好的方法来处理潜在错误——无效数据、服务器宕机等——所以我就是这样处理异常的。\n\n关于我的 MVC 方法的更多细节，请参阅我的博客文章：\n\
    \n*   [一张完美的 MVC 图表](https://alvinalexander.com/uml/uml-model-view-controller-mvc-diagram/)\n\
    *   [模型/视图/控制器定义与示例](https://alvinalexander.com/uml/model-view-controller-mvc-definitions-examples/)\n\
    *   [一个 Java 模型视图控制器示例](https://alvinalexander.com/ooa-ood/java-model-view-controller-mvc-example-1/)\n\
    \n# 7. Java/OOP 代码真的那么简单吗？统计学视角\n\n当我写这本书时，我已经很长时间没有写过 `Java` 代码了，我知道我的记忆并不总是准确，我在想：“我的代码真的那么简单吗？”\n\
    \n为了验证我刚刚向你分享的一切，我搜索了三个旧的 `Java` 代码库——它们都是当时生产环境的项目。我只是简单地搜索了 `<.*>` 模式——为了寻找任何\
    \ `<String>`、`<String, Integer>` 等数据类型——并发现了这三个项目的 `*.java` 文件中这些出现的百分比：\n\n```\n\
    USAGE %    LINES FOUND    TOTAL NUMBER OF LINES\n-------    -----------    ---------------------\n\
    \  0.2         118                74,200\n  1.4         686                49,189\n\
    \  1.2         313                27,083\n```\n\n因此，在约 150,000 行 `Java/OOP` 代码中，有\
    \ 1,117 行包含 `<.*>` 模式，总百分比为 0.74。（注意，这些行数包含了空行和注释行，因此实际百分比会更高。）\n\n然后我手动查看了所有这些\
    \ `<.*>` 输出行，发现这几行是最难读的：\n\n```\nSortedMap<String, Integer> wordCountMap = new\
    \ TreeMap();\npublic Class<?> getColumnClass(int columnIndex) {\n```\n\n## 即将到来……\n\
    \n所以，目前我在此不再做更多评论，这就是对某些 `Java/OOP` 代码中使用数据类型的回顾。\n\n在接下来的几章节中，我们将开始查看一些 `Scala`\
    \ 代码——特别是如何使用 `Scala` 和纯函数来解决问题。但在那，我需要介绍一点背景材料，以帮助这种方法听起来更合理。\n\n# 8. 我学习 Scala\
    \ 的路径\n\n在跳入 `Scala` 代码之前，提到我是如何学习 `Scala` 的很重要。我的时间线如下：\n\n我曾教过几年的 `Java` 和 `OOP`\
    \ 课程。我拥有一家小型咨询公司，我们为大多数客户编写 `Java/OOP` 代码，并为他们提供培训和指导服务。\n\n出于个人好奇，我开始学习了一点 `Python`，甚至是更多的\
    \ `Ruby`。我喜欢 `Ruby`（以及 Ruby on Rails），然后非常喜欢 `JRuby`，它让我在编写 `Ruby` 代码时可以使用 `Java`\
    \ 库。\n\n然后一个朋友给我展示了[Learn You a Haskell for Great Good!](http://amzn.to/1POaUCv)\
    \ 这本书，但在读完书中的基础介绍部分后，我完全不知道作者在说什么。像[类型类](https://docs.scala-lang.org/scala3/book/types-type-classes.html)\
    \ 这样的概念完全难倒我，我放弃了将函数式编程（FP）仅仅视为一种好奇。\n\n2010 年底，我卖掉了公司，在阿拉斯加州闲荡时发现了 `Scala`。由于并不了解它，我开始把它当作一种“更好的\
    \ Java”，这意味着我用 `Scala` 编写 `OOP` 代码（即 `Scala/OOP`）。\n\n我还花了很多时间尝试在 `Scala` 中使用\
    \ `Java` 集合类，这简直是极大的时间浪费。不是因为你不能使用它们——你可以使用——但如果你那样做，你就没有拥抱 `Scala` 带来的风格和最佳实践。\n\
    \n> 这就像一个朋友开始学习 `Java`，由于他有 Visual Basic 的背景，他试图在 `Java` 中写 VB 代码。你做某件事是因为你对 VB\
    \ 熟悉，但你并没有拥抱 Java；你只是在用 Java 的语言结构写 VB 代码。\n\n随着时间的推移，我找到了《[Programming in Scala](https://amzn.to/3eqkTzi)》这本书，并学习了\
    \ Martin Odersky 关于 `Scala` 是 OOP 和 FP 融合的观点。（我也了解到 Odersky 先生被认为是“Java 泛型编译器的之父”。）\n\
    \n当我尝试实现那本书中的概念时，我开始将纯函数混合到我的 `OOP` 代码中。我发现纯函数是极棒的，因为 (a) 输出仅取决于输入，(b) 没有副作用。它们易于编写、阅读和测试。\n\
    \n我了解到像 `Option`、`Try` 和 `Either` 等处理错误的数据类型是抛出异常的极佳替代方案。我不再需要考虑异常的短路问题。\n\n#\
    \ 9. JIT: 不变项\n\n作为第一课“即时”（Just In Time）课程，我需要涵盖的首要概念是我所谓的“不变项”：\n\n*   不可变变量（不可变的代数变量）\n\
    *   不可变数据结构\n\n## 不变变量（代数变量）\n\n*不可变变量*这个词听起来像是个矛盾，但它仅仅意味着我们将以*代数*意义创建变量。例如，在代数中，你写这样一个方程：\n\
    \n`x = a + b + c`\n\n在该方程中，假设所有变量都是不可变的——它们不能被改变。也就是说，你**不会**这样写代数：\n\n```\nx\
    \ = a + b + c\na = 42 // 错误\nx = 11 // 错误\n```\n\n所示，最后两行是错误：代数中的变量永远不会重新赋值。Scala\
    \ 对应的等方法是使用 `val` 关键字创建代数变量：\n\n`val x = a + b + c`\n\n当你使用 `val` 创建变量时，它就像 Java\
    \ 中的 `final`；它永远无法被重新赋值。你可以在 Scala REPL 中看到这一点：\n\n```\nscala> val x = 1\nval\
    \ x: Int = 1\nscala> x = 2\n-- [E052] Type Error: --\n1 |x = 2\n  |^^^^^\n  Reassignment\
    \ to val x\n```\n\n"
- fmt: "\nAttempting to reassign `x` to a new value generates that “Reassignment”\
    \ error. So that’s how we’ll create variables in this book: as algebraic variables,\
    \ with the `val` keyword.\n\n> NOTE: In Scala/OOP you *can* create mutable variables\
    \ using the `var` keyword, but this book will not use those.\n\n## Immutable data\
    \ structures\n\nThis book also uses only *immutable data structures*, such as\
    \ the `String`, `List`, and `Seq` classes, and the default `Map` class, which\
    \ is also immutable. When you use an immutable data structure, you cannot modify\
    \ it.\n\n> TIP: Java developers know that the Java `String` is immutable. So just\
    \ think of all these other data types as working the same way as `String`: you\
    \ never modify a `String`; instead, you call its methods to create a new `String`.\
    \ These are like the immutable collections classes that were introduced in Java\
    \ 9, such as using `List.of()` in Java 9+.\n\nBecause you can’t mutate Scala collections\
    \ classes like `List`, `Seq`, and `Map`, once you create a sequence like this:\n\
    \n```scala\nval xs = Seq(1, 2, 3)\n```\n\nthe only way to create a new `Seq` from\
    \ it is to reassign its result to a new variable:\n\n```scala\n// create a sequence:\n\
    val a = Seq(1, 2, 3)\n\n// create new sequences based on that initial sequence:\n\
    val b = a ++ Seq(4, 5)     // b: List(1, 2, 3, 4, 5)\nval c = b.filter(_ > 2)\
    \    // c: List(3, 4, 5)\n```\n\nIf this seems limiting — fear not! — FPers write\
    \ code like this every day. Immutability is a key concept that makes your code\
    \ easier to maintain, and safe for parallel programming.\n\n# 10. JIT: Pure Functions\n\
    \nThe next JIT nugget of background information we need to cover is the definition\
    \ of a pure function. A *pure function* is a function:\n\n*   Whose only parameters\
    \ from the outside world are the input parameters that are defined in its function\
    \ signature. (I refer to the list of input parameters as a function’s *front door*.)\n\
    *   That does not modify those input parameters.\n*   That does not modify other\
    \ “hidden” variables that might be accessed through *side doors*, such as mutable\
    \ variables in its class or any other global variables.\n*   That does not communicate\
    \ with the outside world. It has no I/O whatsoever: no file access, no internet\
    \ access, no database access, no quantum entanglement, nothing.\n*   That always\
    \ returns the same output when its given the same input. For example, `sum(2,\
    \ 2)` is always `4`.\n*   That returns output for all possible input values.\n\
    *   That does not throw exceptions.\n\nBecause of these last two attributes, FPers\
    \ say that a function is *total*, meaning that it always returns a value.\n\n\
    Examples of pure functions include:\n\n*   Getting the length or checksum of a\
    \ string\n*   Calculating the sum of a list of integers (`List[Int]`)\n*   Many\
    \ mathematical functions\n\nOne thing to notice about pure functions is that they\
    \ *always* have input parameters, and they never return `Unit`:\n\n```scala\n\
    def stringLength(s: String): Int\n                  ---------   ---\n        \
    \             Input     Return\n                  Parameters  Type\n\n// more\
    \ pure function signatures:\ndef sum(xs: List[Int]): Int\ndef add(a: Int, b: Int):\
    \ Int\ndef cos(x: Double): Double\n```\n\n## A pure function’s signature tells\
    \ you what it does\n\nBecause pure function signatures in Scala always include\
    \ the *data types* of (a) the input parameters, and (b) the function result, you\
    \ can often guess what a function does just by looking at its type signature,\
    \ even if the function name is meaningless. For example, what do you think this\
    \ function does:\n\n```scala\ndef f(s: String): Int = ???\n```\n\nBecause the\
    \ function takes a `String` input parameter and returns an `Int` — and also because\
    \ you can be 100% sure that it’s a *pure function* — the function can only do\
    \ a few things:\n\n*   Calculate the length of the string\n*   Calculate some\
    \ sort of checksum or hash of the string\n\nEven without knowing the name of the\
    \ function, you can get a good idea from its type signature what it can possibly\
    \ do. That’s cool.\n\nIn fact, that’s *very* cool. This is one of the great things\
    \ about pure functions: when functions are pure, you can just glance at their\
    \ type signatures, and have a great feel for what they do.\n\nIn my case, once\
    \ I saw this, I started to wish that all functions could somehow be pure.\n\n\
    ### It cannot be “String to Int”\n\nGoing back to that example, as I sketched\
    \ its function signature, I thought for a moment that another thing the function\
    \ could do is convert the `String` to an `Int` ... but that’s wrong. Because the\
    \ process of attempting to convert a `String` to an `Int`\n\n```scala\ndef f(s:\
    \ String): Option[Int]\ndef f(s: String): Try[Int]\ndef f(s: String): Either[Throwable,\
    \ Int]\n```\n\nas you’ll see in the remainder of the book, any time you see `Option`,\
    \ `Try`, or `Either` it means something can go wrong.\n"
