    \ `getUrlContent` 函数，我将在接下来的章节中展示一种更好的写法。）\n\n## EOP 的益处\n\n由于表达式（expressions）总是返回一个结果且通常没有副作用，因此\
    \ EOP 有几个益处：\n\n- 代码更容易编写、读取和测试。输入进入一个纯函数，返回一个结果，将其赋值给一个不可变变量，并且没有副作用。\n- 结合 Scala\
    \ 的语法，EOP 能够产生简洁且富有表现力的代码。\n- 尽管在这些示例中仅提到这一点，但表达式通常可以按任何顺序执行。这个微妙的特性允许你并行执行表达式，这在你尝试利用多核\
    \ CPU 的优势时是一个巨大的奖励。\n\n如果你对更多细节感兴趣，我在 [函数式编程，简明版](https://alvinalexander.com/scala/functional-programming-simplified-book)\
