    \        handleView()\n    case del if del.startsWith(\"d \") =>\n        handleDelete(del.drop(2))\n\
    \        handleView()\n```\n\n# 45. TDL UI: 处理默认情况（Catch-All）\n\n最后，我们只需要处理“默认情况”情况。这是由于\
    \ `a` 命令后面不再是字符串，而 `d` 命令后面将是一个整数。为了清晰起见，删除命令看起来如下：\n\n```text\nd 1\nd 3\n```\n\
    \n这些命令分别意味着“删除第一个任务”和“删除第三个任务”。\n\n## 处理输入\n\n就像上一节课一样，我们需要做的第一件事是将删除命令——字母 `d`——与字符串的其他部分分离。我们再次使用\
    \ `drop` 方法来实现这一点：\n\n```scala\n\"d 1\".drop(2)    // \"1\"\n\"d 3\".drop(2) \
    \   // \"3\"\n```\n\n然后我们使用这种方法将该字符串传递给 `handleDelete` 函数：\n\n```scala\ncase del\
    \ if del.startsWith(\"d \") =>\n    handleDelete(del.drop(2))\n```\n\n## handleDelete\n\
    \n现在我需要写一个 `handleDelete` 函数，我已经知道了关于它的三点：\n\n- 它将接受一个 `String` 作为输入\n- 它需要根据用户看到的任务\
    \ ID 尝试从数据库中删除该任务\n- 因为它要访问数据库，它可能需要返回一个 `Try`\n\n因此，我可以开始这样勾画它的函数签名：\n\n```scala\n\
    def handleAdd(taskIdString: String): Try\n```\n\n由于此函数接受一个代表用户看到的任务 ID 的字符串——例如\
    \ `\"1\"` 或 `\"3\"`——所以函数的算法应该是：\n\n- 尝试将给定的字符串转换为整数。\n- 如果失败，函数此时应该进行短路处理。\n\
    - 如果转换成功，从该值减去 `1` 以得到真实的索引。这是因为 Scala 列表是从 0 开始索引的，就像其他编程语言中的数组和列表一样。（我的意思是用户看到的第一个任务是数字\
    \ `1`，所以他们输入那个数字。而这个 `1` 对应于序列的索引 `0`。）\n- 此函数应该返回删除的行数。因为我只允许用户删除一个任务，这应该始终是\
    \ `1`。\n- 像常一样，由于我们要访问外部世界，函数应该返回一个封装该整数的 `Try`。\n\n这是该算法的实现，并添加了一些注释：\n\n```scala\n\
    def handleDelete(taskIdString: String): Try[Int] = Try {\n    // 将输入的 String 转换为\
    \ Int。如果此尝试失败，\n    // 将抛出异常，因此代码将在此处短路，\n    // 并返回一个包装了异常的 Failure：\n    val\
    \ taskId = taskIdString.toInt\n    // 我们显示的任务-id 从 1 开始，\n    // 所以这里在此处减去 1，\n\
    \    // 因为序列是从 0 开始索引的：\n    val maybeCount = db.delete(taskId - 1)\n    maybeCount.get\n\
    }\n```\n\n为了更易读，这里是去掉了所有注释的同一个函数：\n\n```scala\ndef handleDelete(taskIdString:\
    \ String): Try[Int] = Try {\n    val taskId: Int = taskIdString.toInt\n    val\
    \ maybeCount = db.delete(taskId - 1)\n    maybeCount.get\n}\n```\n\n我几乎从不在 `Try`\
    \ 值上调用 `get` 方法，但我这样做有两个原因：\n\n- `handleDelete` 函数被封装在 `Try` 中，所以如果 `get` 抛出异常，它将返回一个\
    \ `Failure`。如果它抛出异常，那意味着 `delete` 内部发生了某些情况。\n- 我相信对于 Scala 的初学者来说，这段代码相对易读\n\n\
    如既往，如果需要，你可以缩短该函数：\n\n```scala\ndef handleDelete(taskIdString: String): Try[Int]\
    \ = Try {\n    val taskId: Int = taskIdString.toInt\n    db.delete(taskId - 1).get\n\
    }\n```\n\n## 返回 handleUserInput\n\n现在 `handleDelete` 可以工作了，它的 `case` *可以* 在此结束：\n\
    \n```scala\ncase del if del.startsWith(\"d \") =>\n    handleDelete(del.drop(2))\n\
    ```\n\n但再次，我知道我想在删除命令后看到我的待办事项列表，所以我在这里添加了 `handleView` 调用：\n\n```scala\ncase\
    \ del if del.startsWith(\"d \") =>\n    handleDelete(del.drop(2))\n    handleView()\n\
    ```\n\n由于 `handleView` 返回 `Unit`，所以这个 `case` 的返回类型与 `handleUserInput` 的返回类型匹配。现在\
    \ `handleUserInput` 的 `match` 表达式中包含了这些情况：\n\n```scala\ndef handleUserInput(input:\
    \ String): Try[Unit] = input match\n    case \"q\" =>\n        Try(System.exit(0))\n\
    \    case \"h\" =>\n        IOHelper.showHelp()\n    case \"v\" | \"l\" =>\n \
    \       handleView()\n    case add if add.startsWith(\"a \") =>\n        handleAdd(add.drop(2))\n\
    \        handleView()\n    case del if del.startsWith(\"d \") =>\n        handleDelete(del.drop(2))\n\
    \        handleView()\n```\n"
- fmt: "\nIf you cloned this book’s Github repository to your local computer, to run\
    \ the app you just need to move into the `ToDoList` directory of that repo and\
    \ run this command:\n\n```\n$ scala-cli .\n```\n\nThat’s the Scala CLI way of\
    \ saying, “Look for a `main method` in the source code files in this directory.\
    \ Then compile all the necessary code, and run that main method.”\n\nWhen you\
    \ run that command, you should see the app prompt you like this:\n\n`(Commands:\
    \ a \"task\", d 1, v, q, h)`\n\n`Yo: _`\n\nNow you can test its commands, and\
    \ modify the code as desired.\n\n# 47. TDL: Lessons Learned\n\nHaving gone through\
    \ the process of writing the Word Count application and then the To-Do List app,\
    \ let’s recap what you’ve seen.\n\nWhen I started, I said that these were our\
    \ rules for programming, that we’d only use:\n\n* Immutable variables\n* Immutable\
    \ data structures\n* Pure functions\n* Expression-oriented programming\n* Error-handling\
    \ data types\n* `Try` any time we accessed the outside world\n\nBecause this example\
    \ only accesses a flat-file database (that we implemented), I also asked you to\
    \ use your imagination to think that we were either accessing a remote database\
    \ or remote REST service, both of which could be inaccessible at any time.\n\n\
    > I violated a couple of those rules for the reasons I gave at that time, i.e.,\
    \ that I wanted to make sure that I wrote code that Scala beginners could understand.\
    \ But if you want to see the correct Scala solution, see the “Using” lesson in\
    \ the Appendix.\n\nBut other than those violations, I followed the rules to a\
    \ tee, and you saw how the application came together.\n\n## Check-in time\n\n\
    At this time my main thought is that when this book started, you probably weren’t\
    \ used to using data types very much, but now that we’ve written two small applications,\
    \ you’re probably much more used to them. So this is a good time to ask, do you\
    \ feel that there are benefits to all of the techniques shown, and if so, what\
    \ they are?\n\n## Benefits\n\nTo me, the benefits I demonstrated are:\n\n* You\
    \ know that you can trust pure functions; their type signatures cannot lie.\n\
    * When I look at a function signature and see `Option`, `Try`, or `Either` as\
    \ its return type, I instantly think, “Something can go wrong in this function”.\n\
    * When I see a function signature that (a) takes no input parameters or (b) has\
    \ the `Unit` return type, I know that it’s performing some sort of side effect.\n\
    * Even if I don’t know the name of a function, when I look at its signature, I\
    \ can get a good idea of what it can possibly do.\n\nFurthermore:\n\n* Reading\
    \ EOP can be as simple as code gets: you bind the result of a pure function to\
    \ an algebraic variable. The code is easy to write, read, and test.\n* Writing\
    \ code like this is like writing algebra, or creating a blueprint.\n* Combining\
    \ expressions together is just like combining algebraic equations.\n\nOther things\
    \ I know from experience that I haven’t shown here:\n\n* I know that immutable\
    \ variables and immutable data structures are safe to use in parallel and concurrent\
    \ programming.\n* I know that pure functions are easier to test than methods that\
    \ perform side effects.\n\nIn regard to that point about testing, an impure function\
    \ may do any of these things:\n\n* Read input, without warning callers.\n* Write\
    \ output, without warning callers.\n* Mutate the parameters they are given.\n\
    * Mutate variables inside their class, or global parameters.\n* Access other variables\
    \ through side doors.\n\nBecause of those, it’s much harder to set up their state\
    \ in a testing environment: it’s hard to know exactly what else they might be\
    \ accessing.\n\nConversely, with a pure function — where you know that the only\
    \ variables it accesses come in through the front door, and it has no side effects\
    \ — you know that setting up its test environment will be much easier.\n\n## Key\
    \ point\n\nAnd now a key point of all of this is that if you’re still with me\
    \ — if everything I’ve shown makes sense — you are `really, really close to functional\
    \ programming`. Probably much closer than you’re thinking.\n\nWe just need to\
    \ take a few more steps, which we’ll do next.\n\n# 48. TDL: Using Either Instead\
    \ of Try\n\nThe next step on your learning path is that we’ll now replace all\
    \ of the `Try` instances in the TDL app with `Either` instances.\n\nActually,\
    \ I don’t think it’s worth doing *all* of that. Instead, all I’m going to do is\
    \ to replace them in the `Database` class, and then I think you can imagine how\
    \ to use those in the rest of the application.\n\nSo, let’s get started, recalling\
    \ that all of the following functions are inside the `Database` class:\n\n```\n\
    class Database(dbFilename: String):\n     // all functions are in here\nend Database\n\
    ```\n\n## The insert function\n\nThe first function we wrote was the `insert`\
    \ function, and it currently looks like this:\n\n```scala\ndef insert(record:\
    \ String): Try[Unit] =\n     writeToFile(List(record), true)\n```\n\nSo our first\
    \ task is to replace that `Try` with an `Either`. So we start by updating `insert`’s\
    \ function signature:\n\n```scala\ndef insert(record: String): Either[Throwable,\
    \ Boolean] =\n     writeToFile(List(record), true)\n```\n\nAs a refresher, recall\
    \ that `Either` returns a `Left` or a `Right`, and the `Left` holds the error,\
    \ so I write `insert`’s return type:\n\n```scala\ndef insert(record: String):\
    \ Either[Throwable, Boolean] =\n```\n*   `Either[Throwable, Boolean]`\n*   `Left`\n\
    *   `Right`\n\n## writeToFile\n\nThe `writeToFile` function currently looks like\
    \ this:\n\n```scala\nprivate def writeToFile(lines: Seq[String], append: Boolean):\
    \ Try[Unit]\n```\n\nAnd we know we want it to look like this:\n\n```scala\nprivate\
    \ def writeToFile(lines: Seq[String], append: Boolean): Either[Throwable, Boolean]\
    \ =\n  var bw: BufferedWriter = null\n  try\n    bw = BufferedWriter(File(dbFilename),\
    \ append)\n    for line <- lines do bw.write(s\"$line\\n\")\n    Right(true)\n\
    \  catch\n    case e: Throwable => Left(e)\n  finally\n    if bw != null then\
    \ bw.close\n```\n\n## selectAll\n\nSimilarly, `selectAll`’s signature currently\
    \ looks like this:\n\nAnd we again replace `Try` with `Either`:\n\n```scala\n\
    def selectAll(): Either[Throwable, Seq[String]] =\n  var bufferedSource: scala.io.BufferedSource\
    \ = null\n  try\n    bufferedSource = Source.fromFile(dbFilename)\n    val lines\
    \ = for line <- bufferedSource.getLines yield line\n    Right(lines.toList())\n\
    \  catch\n    case t: Throwable => Left(t)\n  finally\n    if bufferedSource !=\
    \ null then bufferedSource.close\n```\n\nOne thing to observe here is that `selectAll`’s\
    \ signature is a bit complicated, because it has a list of strings as the `Right`\
    \ parameter, but by now I suspect that you may be getting used to these types\
    \ (and the value of them). Here’s a breakdown of those types:\n\n```\nEither[Throwable,\
    \ Seq[String]]\n ---------  -----------\n    ^            ^\n  Possible     Success\n\
    \  Error        Value\n  In           In\n  Left         Right\n```\n\nIf you\
    \ can read that, you’re doing just fine.\n\n## delete\n\nLastly, the `delete`\
    \ function currently returns this `Try`:\n\n```scala\ndef delete(indexToDelete:\
    \ Int): Try[Int] = ...\n```\n"
