    \ I/O 函数。\n\n# 32. TDL UI: 显示帮助\n\n我们在这个区域附近时我想写的另一个函数是“帮助”函数。它与 `promptUser`\
    \ 类似，因为它只是打印到标准输出（STDOUT），所以我遵循相同的配方：\n\n- 它是一个返回 `Try[Unit]` 的函数\n- 我使用 `Try`\
    \ 的构造函数创建函数（将 `println` 放入 `Try{...}` 中。）\n\n以下是 `IOHelper` 对象中新的 `showHelp` 函数：\n\
    \n```scala\nimport scala.io.StdIn\nimport scala.util.{Try, Success, Failure}\n\
    \nobject IOHelper:\n  def promptUser(): Try[Unit] = Try {\n      println(\"\\\
    n(Commands: a \\\"task\\\", d 1, u 1, h, q, v)\")\n      print(\"Yo: \")\n  }\n\
    \  def readInput(): Try[String] = Try {\n      StdIn.readLine()\n  }\n  def showHelp():\
