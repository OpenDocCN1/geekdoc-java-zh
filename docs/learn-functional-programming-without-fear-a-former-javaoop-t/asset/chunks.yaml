    \n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]]\n```\n\
    \nAs you can imagine, the first thing you’ll do inside this function is to call\
    \ a file-reading function. So far I know that I’ll give that function the filename,\
    \ which is a `String`:\n\n```scala\ndef readFile(filename: String)\n```\n\nAnd\
    \ you also know two other things:\n\n*   I just mentioned that I prefer to use\
    \ `Try` for I/O functions, so this function should return `Try`\n*   The function\
    \ needs to return the document that it reads from that filename, and that document\
    \ is a `String`\n\nThose two items let us complete the function’s type signature:\n\
    \n```scala\ndef readFile(filename: String): Try[String]\n```\n\nNow that we know\
    \ what `readFile` looks like, we add it as the first line to our new `wcFromFile`\
    \ function:\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
    \ Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n  ...\n```\n\
    \n### A verbose solution\n\nSo now `maybeDocument` either contains (a) a `String`\
    \ version of the document, or (b) an exception. A verbose way to handle `maybeDocument`\
    \ is the approach I showed earlier in the `makeInt` error-handling lessons, using\
    \ a `match` expression:\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
    \ Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n  maybeDocument\
    \ match\n    case Success(docAsString) => Success(wc(docAsString))   // [1]\n\
    \    case Failure(e)           => Failure(e)                // [2]\n```\n\nAs\
    \ shown in Note 1, in the `Success` case I pass the document (`docAsString`) to\
    \ the old `wc` function. If you look back at that function, you’ll see that it\
    \ has the type signature `VectorMap[String, Int]`. As you now know, this means\
    \ that `wc` cannot fail. Because `wcFromFile` needs to return a `Try` type, I\
    \ wrap this map in the `Success` type.\n\nAnd then in the `Failure` case (Note\
    \ 2), I return a new `Failure` instance that contains the exception that occurred\
    \ when trying to read the file.\n\nWhile this solution works, a problem with it\
    \ is that I’m getting a `Try` from `readFile`, and then I unpack it into a `Success`\
    \ or `Failure`, and then I re-pack it back into those types in the `match` expression.\
    \ I can do better.\n\n### A more concise solution\n\nThe more concise solution\
    \ is to use the `map` method that’s available on the `Success` and `Failure` types.\
    \ The way `map` works is that if it’s called on:\n\n*   `Failure`, it returns\
    \ the exception\n*   `Success`, `map` lets you operate on the success value however\
    \ you want\n\nSo again, the first step of the function body stays the same:\n\n\
    ```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n  val\
    \ maybeDocument: Try[String] = readFile(filename)\n  ...\n```\n\nAfter that, I\
    \ replace the `match` expression with a `map` method call on `maybeDocument`,\
    \ which is a `Try`. Inside `map` I pass the document to the `wc` function:\n\n\
    ```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n  val\
    \ maybeDocument: Try[String] = readFile(filename)\n  maybeDocument.map(doc =>\
    \ wc(doc))\n```\n\nThe result of that expression has the type `Try[VectorMap[String,\
