  trans: "\n\n> 正如你将在书中看到的，将纯函数组合在一起也就像代数一样。（关于我所说的“组合函数”的更多信息，请参阅本书术语表中的 *composition*（组合）一词。）\n\
    \n另一件事：我发现我喜欢*阅读**别人编写*的纯函数签名。与 OOP 风格的方法（它们可以返回 `void` 且/或不接受输入参数——这使得它们的类型签名毫无意义）不同，当我查看一个纯函数的类型签名时，我可以一眼看出在发生什么。\n\
    \n## 另一个小测验\n\n这里有另一个小测验：已知这个函数是纯的，它可能可以做什么：\n\n```scala\ndef f(list: List[Int]):\
    \ Int = ???\n```\n\n如果你是 Scala 的初学者，这段代码定义了一个接收整数列表作为输入并返回一个整数作为结果的函数：\n\n* `def\
    \ f` 告诉你这是一个名为 `f` 的函数。\n* 它接受一个我命名为 `list` 的输入参数，其类型为 `List[Int]`，意味着它是一个整数的序列（列表）。\n\
    * 该函数返回一个整数（`Int`）。\n\n我鼓励你写下你认为这个纯函数可能做的一切。\n\n作为第二个问题，这里是相同的函数签名，但使用了泛型。同样，它可能可以做什么：\n\
    \n```scala\ndef gA: A = ???\n```\n\n如果你不熟悉泛型，这这意味着该函数可以接收整数列表（`List[Int]`）、字符串列表（`List[String]`）、人员列表（`List[Person]`）等。`List`\
    \ 内部的数据类型对算法并不重要；算法只需要关注它被给了一个列表这一事实。\n\n`A` 作为返回类型意味着函数返回一个单个元素，该元素的类型与列表中包含的数据类型相同。因此，如果函数接收一个\
    \ (`List[Int]`）作为输入，它必须返回一个 `Int`；如果它得到一个 (`List[Person]`)，它必须返回一个 `Person`，依此类推。\n\
    \n再次，我鼓励你写下你认为这个函数可能做的一切。\n\n## 关键点\n\n总结一下，最后这两章中有有几个关键点：\n\n* 纯函数减少了你的认知负载。当你编写它们时，你只需要考虑它们的输入、输出和算法。\n\
    * 你可以信任纯函数，它们不会撒谎。它们的签名准确地告诉了它们可以（以及不能）做什么。\n\n另外——我会在书中反复提到这一点——但使用纯函数（以及不可变对象）编写代码感觉就像写代数一样。你从编写几个这样的纯函数开始：\n\
    \n```scala\ndef add(i: Int, j: Int): Int\ndef multiply(i: Int, j: Int): Int\n\
    ```\n\n然后你像这样将它们组合在一起：\n\n```scala\nval x = add(1, 1)\nval y = multiply(x, 2)\n\
    ```\n\n或者这样：\n\n```scala\nval z = multiply(add(1, 1), 2)\n```\n\n或者，如果你喜欢架构和工程，这种编程风格就像创建蓝图。你正在将管道和线路连接在一起，因为纯函数不会抛出异常，所有这些管道和梁“只需连接”在一起。（你不需要担心函数抛出异常并破坏你的设计。）\n\
    \n# 12. JIT: 表达式导向编程 (EOP)\n\n在我们开始编写代码之前，我们需要看另一个一个 JIT 主题：*表达式导向编程*（Expression-Oriented\
    \ Programming），或 EOP。为了理解 EOP，我们需要明确编程中表达式（expressions）和语句（statements）之间的区别。\n\
    \n## 语句 vs 表达式\n\n在编程中，*语句*（statement）是一个不返回结果的代码块，仅用于它的副作用效应。例如，以下两行代码都是语句，因为它们不返回结果：\n\
    \n```scala\nprintln(a)\nif a == b then println(a)\n```\n\n像这样的代码行仅用于副作用，在这些示例中，它们的副作用是打印到标准输出（STDOUT）。\n\
    \n相反，*纯表达式*（pure expression）是一个会返回结果的代码块，且没有副作用。Scala 的非常棒的一点是，每一行代码都可以是一个表达式。这是因为所有这些\
    \ Scala 结构都会返回结果：\n\n* `if`/`then`/`else`\n* `match` 表达式\n* `for` 表达式\n* 甚至 `try`/`catch`/`finally`\
    \ 也会返回值\n\n为了解释这一点，让我们看看如何将 `if`/`then`/`else` 结构当作表达式。\n\n### 补充：快速说明\n\n对于纯主义者来说，更准确的说法是这段代码没有返回一个*有用*的结果：\n\
    \n```scala\nif a == b then println(a)\n```\n\n它确实返回了某些东西——名为 `Unit` 的类型，类似于其他语言中的\
    \ `void`。但在这种情况下，我们通常不在乎它的返回值。\n\n> 正如我之前提到的，`Unit` *类型*在 Scala 中只有一个*值*（或实例），该值由符号\
    \ `()` 表示。因此，这种类型没有意义或无法提供信息，当我们对该返回结果不感兴趣时，我们将其用作函数的返回类型。\n\n## 将 `if/then/else`\
    \ 作为表达式\n\n如所述，`if`、`match`、`for` 和 `try` 都可以作为表达式使用。对于 `if`，这意味着 `if`/`then`/`else`\
    \ 会产生结果：\n\n```scala\nval c = if a < b then a else b\n```\n\n这段代码可以读作：如果 `a` 小于\
    \ `b`，将 `a` 赋值给 `c`；否则，赋值 `b`。\n\n## 其他结构\n\n好了，让我们看看其他结构如何作为表达式使用。这个示例展示了 `match`\
    \ 如何产生值：\n\n```scala\nval evenOdd = i match\n  case 1 | 3 | 5 | 7 => \"odd\"\n\
    \  case 2 | 4 | 6 | 10 => \"even\"\n```\n\n这是一个 `for` 表达式：\n\n```scala\nval result\
    \ = for i <- 10 if i > 5 yield i\n```\n\n如果你不熟悉该语法，`result` 将包含这个值：`Vector(6,\
    \ 7, 8, 9)`\n\n> `Vector` 是 `Seq` 的特定类型——具有高性能特性，并在 Scala 中常用。\n\n当你刚开始 Scala\
    \ 时，可能倾向于显式声明 `result` 的类型，如下：\n\n```scala\nval result: Seq[Int] = for i <- 10\
    \ if i > 5 yield i\n```\n\n最后，甚至 `try`/`catch`/`finally` 块也被用于编写表达式：\n\n```scala\n\
    def makeInt(s: String): Int =\n  try\n    s.toInt\n  catch\n    case e: Exception\
    \ => 0\n  finally\n    // 执行你需要的操作\n```\n\n注意，这不是编写此函数的推荐方法——在获取异常时返回 `0` 是错误的，我稍后会展示更好的写法——但这确实展示了\
    \ `try`/`catch`/`finally` 会产生值。你可以这样使用这个 `makeInt` 函数：\n\n```scala\nmakeInt(\"\
    11\") // 11\nmakeInt(\"eleven\") // 0\n```\n\n## EOP 代码看起来像什么样\n\n正如我在 [Scala\
    \ Cookbook](https://amzn.to/3du1pMR) 中所示，当你使用 EOP 编写代码时，你的代码变得易写、易读且易测试。它是一系列使用不可变变量、不可变数据结构和纯函数的表达式：\n\
    \n```scala\n// 一系列表达式\nval symbol = \"AAPL\"\nval url = buildUrl(symbol)\nval\
    \ html = getUrlContent(url) // 一个不纯函数\nval price = getPrice(html)\nval volume\
    \ = getVolume(html)\nval high = getHigh(html)\n```\n\n"
