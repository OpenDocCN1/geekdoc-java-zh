  \ data structures)\n*   纯函数 (Pure functions)\n*   面向表达式的编程 (Expression-oriented\
  \ programming)\n*   错误处理数据类型 (Error-handling data types)\n*   每当我们访问外部世界时使用 `Try`\n\
  \n由于这个示例只访问了一个扁文件数据库（由我们实现的），我也要求你发挥想象力，想象我们正在访问远程数据库或远程 REST 服务，这两者都可能在任何时候无法访问。\n\
