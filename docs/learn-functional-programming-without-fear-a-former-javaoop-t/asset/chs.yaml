- "# 无畏学习函数式编程：前 Java/OOP 老师带你领略 Scala FP 库实战\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\
  \n\n\n\n购买书籍并反馈问题：[alvinalander.com/scala/learn-functional-programming-book](https://alvinalander.com/scala/learn-functional-programming-book)\n\
  \n## 其他书籍\n\nAlvin Alexander 的其他书籍：\n\n* [Scala Cookbook](https://amzn.to/3du1pMR)\
  \ (700+ 页)\n* 畅销且高分的书籍：[Functional Programming, Simplified](https://alvinalander.com/scala/functional-programming-simplified-book)\
  \ (同样 700+ 页)\n* 我的新作：[Learn Scala 3 The Fast Way!](https://amzn.to/3L4YwR4)\n\n\
  ## 感谢\n\n我想感谢每一位让 Scala 成为如此优秀的编程语言的人。编写关于它的内容是一件很有趣的事。\n\n我还要感谢 Sriram Natarajan，他在本书的早期版本中自愿写了三页精彩的评论。\n\
  \n我还要感谢我的妻子，因为至少没有她的支持，这本书绝对是不可能实现的。\n\n最后，我应该感谢所有让我保持脚踏实地的朋友和家人。如果不是因为你们，我可能还在阿拉斯加的山脉里冥想呢。:)\n\
  \n# 1. 本书的目标\n\n本书有一个雄心勃勃的目标：尽可能简单地演示以下内容的用处：\n\n*   不变变量（代数变量）\n*   不变数据结构\n* \
  \  纯函数\n*   表达式导向编程\n*   函数式错误处理\n\n本书的前提是，一旦你熟悉了这些概念，你就会发现自己正在编写函数式编程 (FP) 代码。在书末，我通过展示几个使用\
  \ `ZIO` 的示例来演示这一点，`ZIO` 是 Scala 两个主要的 FP 库之一（另一个是 `Cats Effect`）。\n\n更明确地说：本书让你准备好开始\
  \ `ZIO` 和 `Cats Effect`。当你读完这本书后，你应该能够查看它们的文档并想：“啊，我知道他们在做什么，以及为什么要这样做。”\n\n## 面向\
  \ OOP 开发者：Java、Kotlin、Python 等\n\n\n\n\n此外，我专门为那些具有面向对象编程（OOP）背景的人编写了这本书。我教了多年 `Java`\
  \ 和 `OOP` 课程，并且仍然为 iPhone 和 Android 应用编写大部分 OOP 代码的代码（分别使用 `Flutter/Dart` 和 `Kotlin`），因此我非常熟悉\
  \ `OOP`，以及 `OOP` 开发者学习 FP 需要了解的知识。\n\n在接触过 `Java`、`Kotlin`、`Swift`、`Python`、`C++`、`Dart`\
  \ 和 `Ruby` 后，我相信这本书对于使用这些语言并对学习 FP 感的开发者非常有帮助。\n\n我在 250 页以内实现了这一目标，重点关注如何利用上述五个主要概念编写几个小型应用程序，并在编写过程中不断解释这些概念。\n\
  \n> 这是一本特意编写的、关于 FP 的小书，希望读起来易轻松。如果你更倾向于读一本关于 FP 的大而详尽的书，我写过畅销且高评价的[简化函数式编程](https://alvinalexander.com/scala/functional-programming-simplified-book)，它超过\
  \ 720 页。虽然它长得多，但那本书的优点在于它通过 100 多个短小课程涵盖了大量的背景信息和细节。（明确一下，那本书的*纸质版*有 720 多页，但 PDF\
  \ 和 Kindle 电子版超过 1000 页。）\n\n# 2. 关于我\n\n对于那些不认识我的人，我叫 Alvin Alexander，以下我的 `Java`、`OOP`、`Kotlin`、`Scala`\
  \ 和 `FP` 背景：\n\n*   过去，我向 `GE`、`UPS`、`Papa Johns` 等许多客户教授过 `C`、`Java` 和 `OOP` 课程\n\
  *   我创立了一家小型软件咨询公司并发展到 20 名员工，我们主要为客户编写 `Java/OOP` 代码\n*   我写过两个版本的[Scala 食谱](https://amzn.to/3du1pMR)，最近的是\
  \ 2021 年 9 月发布的第 2 版（每本 700 多页）\n*   我写过畅销且高评价的书籍[简化函数式编程](https://alvinalexander.com/scala/functional-programming-simplified-book)（同样\
  \ 700 多页）\n*   我写过一本名为《Hello, Scala》的书，它成为了 Scala 官方网站“Scala 之书”的基础\n*   随后，我为 Scala\
  \ 官方网站合写了[Scala 3 教程](https://docs.scala-lang.org/scala3/book/introduction.html)\n\
  *   2022 年，我发布了一本名为[快速学习 Scala 3!](https://amzn.to/3L4YwR4) 的书\n*   我用 `Java` 和\
  \ `Kotlin` 写过 Android 应用，并用 `Flutter` 和 `Dart` 写过跨平台的 iOS/Android 应用\n*   我的关于编程的网站\
  \ [alvinalexander.com](https://alvinalexander.com) 每年接收数百万页面访问\n\n我提到其中一些书的页数是因为对我来说，这是一本短书。我特意让它尽可能简洁，同时用简单、口语化的风格来编写，就像我正坐在你身边工作，或者在教室里指导你一样。\n\
  \n# 3. 欢迎！\n\n欢迎！对我来说，这是一本非常不同的书。我的*最初计划*是创建一个小册子，标题将定为《用类型思考》或《用纯函数解决问题》。这个想法是展示你如何使用这些编程技术写出非常稳健、易读且易于维护的代码：\n\
  \n*   纯函数\n*   不可变变量（*代数*变量）\n*   不可变数据类型（如 `String` 和 `List`）\n*   表达式导向编程 (EOP)\n\
  *   函数式错误处理\n\n但当我开始编写大纲和示例时，我意识到这些代码与编写纯*函数式编程*（FP）代码是多么接近。从那时起，我从写小册转变为尝试写一本尽可能小的书，将\
  \ `OOP` 开发者带到使用 `Scala` FP 库的边缘。\n\n所以，尽管这是一本很小的书，但我希望通过带你走到 FP 道路的很远，能提供巨大的价值。我的希望当你读完这本书后，可以直接去查看\
  \ `ZIO` 和 `Cats Effect` 的文档并想：“噢，我知道他们在做什么，以及为什么要这么做。”\n\n## 这本书是给谁的\n\n我为 `OOP`\
  \ 开发者写了这本书，但它实际上适用于任何以下情况的人：\n\n*   对上述列出的编程概念感兴趣\n*   刚开始接触这些概念\n*   已经接触了一点 FP\
  \ 但发现它极其混乱、令人困惑\n*   其他方面对改进代码感兴趣\n\n请注意，书中的代码示例是使用 *Scala 3* 编写的，但我没有使用任何“Scala\
  \ 魔法技巧”。正如你很快会看到的，代码是用简单的风格编写的。\n\n## 我假设你了解\n\n出于这本书的目的，我假设你了解一点 `Scala`，但从实际来说，`Scala`\
  \ 的基础非常直观，我认为如果你熟悉 `Java`、`Kotlin`、`Python`、`Swift`、`Dart`、`C++` 或其他语言，你会做得很好。正如我提到的，我没有在书使用任何花哨的\
  \ `Scala` 技术。\n\n\n\n\n*   `TDL`: 以 `TDL` 开头的章节意味着该章节与 `To-Do List`（待办列表）应用程序有关。\n\
  \n## 大纲\n\n接下来，如果你想知道这本书其余部分将要涉及的内容，请阅读以下大纲，它就像是后续内容的一份地图。\n\n相反，如果你**不想**知道我们将进入什么领域，并且更倾向于保持惊喜，请跳过本章的剩余部分。\n\
  \n大纲的内容如下：\n\n*   我首先回顾了自己过去在 `Java/OOP` 中很少使用数据类型\n*   然后我对比了我在 `Scala/OOP` 和 `Scala/EOP`\
  \ 中**确实**使用了多少数据类型\n\n之后，我将展示：\n\n*   使用数据类型并不是坏事，事实上，这是一件非常好的事情\n*   不可变对象（变量和数据结构）的重要性\n\
  *   纯函数的重要性：特别是你可以信任它们，因为它们绝不会撒谎\n*   不可变对象和纯函数的概念自然地引向了 EOP\n\n然后我将展示如何使用这些概念编写一个\
  \ `Word Count`（字数统计）应用程序。在编写该程序的过程中，我们将发现其他一些事情。\n\n之后，我会对 `Java/OOP` 代码与你在 `Word\
  \ Count` 示例中看到的 `Scala/EOP` 代码进行简单回顾。\n\n随后，我们将进入下一个重要主题：函数式错误处理：\n\n*   我将解释函数式错误处理背后的原理\n\
  *   我们将查看 Scala 的三种`错误处理数据类型`：`Option`、`Try` 和 `Either`\n*   我将展示如何使用 `Try` 实现 `Word\
  \ Count` 应用程序\n*   然后我们将使用所有概念构建一个更大的 `To-Do List`（待办列表）应用程序\n*   该应用程序使用了模拟数据库，因此你可以看到在访问远程数据库或\
  \ `REST API` 时将使用的技术\n\n最后，我将向你展示使用如 `ZIO` 和 `Cats Effect` 等 FP 库**离你有多近**。\n\n\
  现在，如果你准备好了，让我们开始吧！\n\n# 5. 回顾 Java/OOP 代码与数据类型\n\n在我的 `Java` 编程时代，我很少使用泛型数据类型，事实上，我几乎不考虑过数据类型。为了说明这一点，我将回到我常用的示例之一：为披萨店编写一个收银点应用程序。\n\
  \n在继续之前，有两点：\n\n*   `Java` 和 `Scala` 中的 `generic`（泛型）类型通常是方法声明中使用的字符，如 `T` 或 `A`。你使用泛型类型表示：“在这里使用的具体类型稍后填充。”例如，`Scala`\
  \ 中的 `List[A]` 之后可以是 `List[Int]`、`List[String]` 等。随着书籍的深入，我将编写更多关于泛型的内容。\n*   在这些示例中，请注意我的\
  \ `Java` 代码可能并非 100% 正确。我没有将这些代码放入 IDE 中或尝试编译它们。因为我假设你熟悉 `Java` 或其他的 `OOP` 语言，我的意图只是快速演示我多年多年的\
  \ `Java/OOP` 方法。\n\n## 建模披萨店应用程序\n\n### 一些枚举\n\n为了开始为披萨店建模收银点应用程序，我首先需要我的枚举：\n\n\
  ```\nenum Topping {\n  Cheese,\n  Pepperoni,\n  BlackOlives\n}\n```\n\n```\nenum\
  \ CrustSize {\n  Small,\n  Medium,\n  Large\n}\n```\n\n```\nenum CrustType {\n \
  \ Regular,\n  Thin,\n  Thick\n}\n```\n\n### 披萨类\n\n基于这些，让我们创建一个 `Pizza` 类。但在此之前，让我们列出\
  \ OOP 披萨的属性和行为。属性基本上是我用那些枚举列出的内容：\n\n*   饼底尺寸\n*   饼底类型\n*   配料类型\n\n行为对应于这些：\n\n\
  *   添加配料\n*   移除配料\n*   设置饼底尺寸\n*   设置饼底类型\n\n如果我也保留价格相关的信息，披萨还可以计算自己的价格，但由于配料和饼底属性并不带有价格，这基本上就是这个\
  \ `Pizza` 的所有行为了。\n\n在经过几次练习后，我知道我想让披萨中所有与食物相关的项目——面包棒、汽水等——都继承自一个基础 `Product` 类：\n\
  \n```\npublic interface Product {}\n```\n\n在现实世界中，`Product` 将具有成本等属性，可能还有销售价格，但为了本次练习，我将将其留为标记接口（marker\
  \ interface）。\n\n鉴于这个 `Product` —— 以及我 `Pizza` 的属性和行为，`Java/OOP` 类的初始代码如下：\n\n```\n\
  public class Pizza implements Product {\n  private List<Topping> toppings = new\
  \ ArrayList<>();\n  private CrustSize crustSize;\n  private CrustType crustType;\n\
  \n  public Pizza(CrustSize crustSize, CrustType crustType) {\n    this.crustSize\
  \ = crustSize;\n    this.crustType = crustType;\n  }\n}\n```\n\n该 `Pizza` 类将包含以下一系列\
  \ getter 和 setter 方法，其类型签名如下：\n\n```\npublic CrustSize getCrustSize()\npublic CrustType\
  \ getCrustType()\npublic List<Topping> getToppings()\npublic void setCrustSize(CrustSize\
  \ crustSize)\npublic void setCrustType(CrustType crustType)\npublic void setToppings(List<Topping>\
  \ toppings)\n```\n\n> *type signature*（类型签名）一词指的是函数的 (a) 输入参数和 (b) 返回类型。\n\n## 讨论\n\
  \n这里需要注意的是，这些都是简单的代码。getter 不接受任何输入参数并返回基本数据类型，而 setter 都返回 `void`。我写这样的 `Java`\
  \ 代码超过了 12 年。\n\n事实上，如果我写更多代码（例如一个 `Order` 类），你会发现这种模式是相同的，都是非常简单的代码：\n\n```\npublic\
  \ class Order {\n  private List<Product> lineItems = new ArrayList<>();\n  public\
  \ Order() {}\n  public void addItem(Product p)\n  public void removeItem(Product\
  \ p)\n  public List<Product> getItems()\n  public String getPrintableReceipt()\n\
  \  public BigDecimal getTotalPrice()\n}\n```\n\n在那段代码中，我最接近使用泛型类型的就是这些类型：\n\n* \
  \  `List<Topping>`\n*   `List<Product>`\n\n# 6. Java/OOP 总结\n\n所以，这快速回顾了我在教 `Java`\
  \ 课程时使用的 `Java/OOP` 代码。当然，我展示的并不多，仅足以传达基本思想。\n\n## 总结第一部分\n\n总结一下你看到的代码：\n\n*  \
  \ 我的 `Java/OOP` 代码没有泛型类型\n*   许多方法返回 `void`\n*   许多方法没有输入参数\n*   我**总是**使用可变数据结构\n\
  *   可变数据结构是像 `ArrayList` 这样可以调整大小且其元素可以更新的结构。我们说这种结构可以被*变异*（mutate），意思就是“改变”。\n\n\
  ## 总结第二部分\n\n关于这段代码还有一些事情可以说明，请记住，我只是在讨论自己的代码。\n\n**要点 1**：我在编写 `Java/OOP` 代码时并没有意识到，但所有那些返回\
  \ `void` 且不接受输入参数的方法都会扭曲你的大脑。你无法通过类型签名判断方法的作用，所以你要么 (a) 信任方法命名良好，要么 (b) 你必须查看源代码来看它们在做什么。\n\
  \n为了说明我的意思，**我曾信任自己的代码**，因为我知道所有的 getter 和 setter 都只是样板代码。但有一次当我与一名新手开发者调试问题时，发现他写了这样的\
  \ setter 方法：\n\n```\npublic void setFoo(Foo newFoo) {\n  openTheGarageDoor();\n\
  \  walkTheDog();\n  buyGroceries();\n  solveWorldPeace();\n  this.foo = newFoo +\
  \ 1;\n}\n```\n\n它并没有那么详尽，但里面确实**有很多**操作。请记住，这一切都发生在一个具有这种类型签名的“简单 setter 方法”之中：\n\
  \n```\npublic void setFoo(Foo newFoo)\n```\n\n我从中吸取的教训是：\n\n*   该开发者需要更多的培训\n* \
  \  我不能信任方法类型签名，我必须查看代码\n\n\n\n\n\n**观点 2：** 我在披萨例子中没有展示的第二点是，许多 `Java` 方法可能会抛出异常，当它们可能发生时，你必须考虑\
  \ (a) 处理“成功”情况，以及 (b) 处理“失败”情况，对我而言，这意味着要用 `try`/`catch` 包装起来方法调用。\n\n这让大脑变得异常痛苦，以至于我发展到了这种程度——使用模型/视图/控制器（MVC）范式——我只在顶层控制器中处理异常。我在异常发生的地方记录异常，但直接让它们向上冒泡到我的控制器中，并在那里进行处理。\n\
  \n那时我对函数式编程一无所知，也想不出更好的方法来处理潜在错误——无效数据、服务器宕机等——所以我就是这样处理异常的。\n\n关于我的 MVC 方法的更多细节，请参阅我的博客文章：\n\
  \n*   [一张完美的 MVC 图表](https://alvinalexander.com/uml/uml-model-view-controller-mvc-diagram/)\n\
  *   [模型/视图/控制器定义与示例](https://alvinalexander.com/uml/model-view-controller-mvc-definitions-examples/)\n\
  *   [一个 Java 模型视图控制器示例](https://alvinalexander.com/ooa-ood/java-model-view-controller-mvc-example-1/)\n\
  \n# 7. Java/OOP 代码真的那么简单吗？统计学视角\n\n当我写这本书时，我已经很长时间没有写过 `Java` 代码了，我知道我的记忆并不总是准确，我在想：“我的代码真的那么简单吗？”\n\
  \n为了验证我刚刚向你分享的一切，我搜索了三个旧的 `Java` 代码库——它们都是当时生产环境的项目。我只是简单地搜索了 `<.*>` 模式——为了寻找任何\
  \ `<String>`、`<String, Integer>` 等数据类型——并发现了这三个项目的 `*.java` 文件中这些出现的百分比：\n\n```\n\
  USAGE %    LINES FOUND    TOTAL NUMBER OF LINES\n-------    -----------    ---------------------\n\
  \  0.2         118                74,200\n  1.4         686                49,189\n\
  \  1.2         313                27,083\n```\n\n因此，在约 150,000 行 `Java/OOP` 代码中，有\
  \ 1,117 行包含 `<.*>` 模式，总百分比为 0.74。（注意，这些行数包含了空行和注释行，因此实际百分比会更高。）\n\n然后我手动查看了所有这些\
  \ `<.*>` 输出行，发现这几行是最难读的：\n\n```\nSortedMap<String, Integer> wordCountMap = new TreeMap();\n\
  public Class<?> getColumnClass(int columnIndex) {\n```\n\n## 即将到来……\n\n所以，目前我在此不再做更多评论，这就是对某些\
  \ `Java/OOP` 代码中使用数据类型的回顾。\n\n在接下来的几章节中，我们将开始查看一些 `Scala` 代码——特别是如何使用 `Scala` 和纯函数来解决问题。但在那，我需要介绍一点背景材料，以帮助这种方法听起来更合理。\n\
  \n# 8. 我学习 Scala 的路径\n\n在跳入 `Scala` 代码之前，提到我是如何学习 `Scala` 的很重要。我的时间线如下：\n\n我曾教过几年的\
  \ `Java` 和 `OOP` 课程。我拥有一家小型咨询公司，我们为大多数客户编写 `Java/OOP` 代码，并为他们提供培训和指导服务。\n\n出于个人好奇，我开始学习了一点\
  \ `Python`，甚至是更多的 `Ruby`。我喜欢 `Ruby`（以及 Ruby on Rails），然后非常喜欢 `JRuby`，它让我在编写 `Ruby`\
  \ 代码时可以使用 `Java` 库。\n\n然后一个朋友给我展示了[Learn You a Haskell for Great Good!](http://amzn.to/1POaUCv)\
  \ 这本书，但在读完书中的基础介绍部分后，我完全不知道作者在说什么。像[类型类](https://docs.scala-lang.org/scala3/book/types-type-classes.html)\
  \ 这样的概念完全难倒我，我放弃了将函数式编程（FP）仅仅视为一种好奇。\n\n2010 年底，我卖掉了公司，在阿拉斯加州闲荡时发现了 `Scala`。由于并不了解它，我开始把它当作一种“更好的\
  \ Java”，这意味着我用 `Scala` 编写 `OOP` 代码（即 `Scala/OOP`）。\n\n我还花了很多时间尝试在 `Scala` 中使用 `Java`\
  \ 集合类，这简直是极大的时间浪费。不是因为你不能使用它们——你可以使用——但如果你那样做，你就没有拥抱 `Scala` 带来的风格和最佳实践。\n\n> 这就像一个朋友开始学习\
  \ `Java`，由于他有 Visual Basic 的背景，他试图在 `Java` 中写 VB 代码。你做某件事是因为你对 VB 熟悉，但你并没有拥抱 Java；你只是在用\
  \ Java 的语言结构写 VB 代码。\n\n随着时间的推移，我找到了《[Programming in Scala](https://amzn.to/3eqkTzi)》这本书，并学习了\
  \ Martin Odersky 关于 `Scala` 是 OOP 和 FP 融合的观点。（我也了解到 Odersky 先生被认为是“Java 泛型编译器的之父”。）\n\
  \n当我尝试实现那本书中的概念时，我开始将纯函数混合到我的 `OOP` 代码中。我发现纯函数是极棒的，因为 (a) 输出仅取决于输入，(b) 没有副作用。它们易于编写、阅读和测试。\n\
  \n我了解到像 `Option`、`Try` 和 `Either` 等处理错误的数据类型是抛出异常的极佳替代方案。我不再需要考虑异常的短路问题。\n\n# 9.\
  \ JIT: 不变项\n\n作为第一课“即时”（Just In Time）课程，我需要涵盖的首要概念是我所谓的“不变项”：\n\n*   不可变变量（不可变的代数变量）\n\
  *   不可变数据结构\n\n## 不变变量（代数变量）\n\n*不可变变量*这个词听起来像是个矛盾，但它仅仅意味着我们将以*代数*意义创建变量。例如，在代数中，你写这样一个方程：\n\
  \n`x = a + b + c`\n\n在该方程中，假设所有变量都是不可变的——它们不能被改变。也就是说，你**不会**这样写代数：\n\n```\nx =\
  \ a + b + c\na = 42 // 错误\nx = 11 // 错误\n```\n\n所示，最后两行是错误：代数中的变量永远不会重新赋值。Scala\
  \ 对应的等方法是使用 `val` 关键字创建代数变量：\n\n`val x = a + b + c`\n\n当你使用 `val` 创建变量时，它就像 Java\
  \ 中的 `final`；它永远无法被重新赋值。你可以在 Scala REPL 中看到这一点：\n\n```\nscala> val x = 1\nval x:\
  \ Int = 1\nscala> x = 2\n-- [E052] Type Error: --\n1 |x = 2\n  |^^^^^\n  Reassignment\
  \ to val x\n```\n\n\n\n\n尝试将 `x` 重新赋值为新值会产生“Reassignment”（重赋值）错误。因此，我们在书中创建变量的方式：作为代数变量，并使用\
  \ `val` 关键字。\n\n> 注意：在 Scala/OOP 中，你*可以*使用 `var` 关键字创建可变变量，但本书不会使用这些变量。\n\n## 不变数据结构\n\
  \n本书也只使用*不可变数据结构*，例如 `String`、`List` 和 `Seq` 类，以及默认的 `Map` 类（也是不可变的）。当你使用不可变数据结构时，无法修改它。\n\
  \n> 提示：Java 开发者知道 Java 的 `String` 是不可变的。因此只需将所有其他数据类型想象为与 `String` 工作方式相同：你永远不会修改\
  \ `String`；而是调用它的方法创建一个新的 `String`。这些就像 Java 9 中引入的不可变集合类，例如在 Java 9+ 中使用 `List.of()`。\n\
  \n由于你不能改变 `List`、`Seq` 和 `Map` 等 Scala 集合类，一旦你创建了这样一个序列：\n\n```scala\nval xs = Seq(1,\
  \ 2, 3)\n```\n\n从它创建一个新 `Seq` 的唯一方法是将其结果重新赋值给新变量：\n\n```scala\n// 创建一个序列：\nval a\
  \ = Seq(1, 2, 3)\n\n// 基于初始序列创建新序列：\nval b = a ++ Seq(4, 5)     // b: List(1, 2,\
  \ 3, 4, 5)\nval c = b.filter(_ > 2)    // c: List(3, 4, 5)\n```\n\n如果这看起来很有局限性——不要担心！FPers（函数式程序员）每天都这样写代码。不可变性是一个核心概念，它让你的代码更容易维护，并且对于并行编程是安全的。\n\
  \n# 10. JIT: 纯函数\n\n我们需要涵盖的下一个 JIT 背景信息碎片是纯函数的定义。一个*纯函数*是指这样的函数：\n\n*   其来自外部世界的唯一参数是其函数签名中定义的输入参数。（我将输入参数列表称为函数的*正门*。）\n\
  *   不修改这些输入参数。\n*   不修改可能通过*侧门*访问的其它“隐藏”变量，例如类中的可变变量或任何其他全局变量。\n*   不与外部世界通信。它完全没有任何\
  \ I/O：没有文件访问、没有互联网访问、没有数据库访问、没有量子纠缠，什么都没有。\n*   给定相同的输入时，总是返回相同的输出。例如，`sum(2, 2)`\
  \ 始终是 `4`。\n*   对所有可能的输入值返回输出。\n*   不抛出异常。\n\n由于最后两个属性，FPers 说一个函数是*全的*（total），意味着它总是返回一个值。\n\
  \n纯函数的示例包括：\n\n*   获取字符串的长度或校验和\n*   计算整数列表 (`List[Int]`) 的和\n*   许多数学函数\n\n关于纯函数需要注意的一点是它们*总是*有输入参数，并且永远不返回\
  \ `Unit`：\n\n```scala\ndef stringLength(s: String): Int\n                  ---------\
  \   ---\n                     Input     Return\n                  Parameters  Type\n\
  \n// 更多纯函数签名：\ndef sum(xs: List[Int]): Int\ndef add(a: Int, b: Int): Int\ndef cos(x:\
  \ Double): Double\n```\n\n## 纯函数的签名告诉你它做了什么\n\n由于 Scala 中的纯函数签名始终包含 (a) 输入参数的*数据类型*和\
  \ (b) 函数结果，你通常只需通过查看其类型签名就能猜出函数的作用，即使函数名没有意义。例如，你认为这个函数是做什么的：\n\n```scala\ndef f(s:\
  \ String): Int = ???\n```\n\n因为函数接收一个 `String` 输入参数并返回一个 `Int` —— 也因为你可以 100% 确定它是一个*纯函数*\
  \ —— 该函数只能做几件事：\n\n*   计算字符串的长度\n*   计算字符串的某种校验和或哈希值\n\n即使不知道函数的名称，你也可以从其类型签名很好地了解它可能做什么。这很酷。\n\
  \n事实上，这*非常*酷。这是纯函数的伟大之处之一：当函数是纯的时，你只需看一眼它们的类型签名就能对它们的作用有一个很好的感觉。\n\n对我来说，一旦我看到这一点，我开始希望所有函数都能以某种方式变成纯函数。\n\
  \n### 它不能“String 转 Int”\n\n回到那个例子，当我勾勒它的函数签名时，我想了一会儿，函数可能做的另一件事是将 `String` 转换为 `Int`\
  \ ... 但那是错的。因为尝试将 `String` 转换为 `Int` 的过程：\n\n```scala\ndef f(s: String): Option[Int]\n\
  def f(s: String): Try[Int]\ndef f(s: String): Either[Throwable, Int]\n```\n\n正如你将在接下来的内容中所看到的，每当你看到\
  \ `Option`、`Try` 或 `Either`，就意味着可能会出错。\n\n\n\n\n> 正如你将在书中看到的，将纯函数组合在一起也就像代数一样。（关于我所说的“组合函数”的更多信息，请参阅本书术语表中的\
  \ *composition*（组合）一词。）\n\n另一件事：我发现我喜欢*阅读**别人编写*的纯函数签名。与 OOP 风格的方法（它们可以返回 `void`\
  \ 且/或不接受输入参数——这使得它们的类型签名毫无意义）不同，当我查看一个纯函数的类型签名时，我可以一眼看出在发生什么。\n\n## 另一个小测验\n\n这里有另一个小测验：已知这个函数是纯的，它可能可以做什么：\n\
  \n```scala\ndef f(list: List[Int]): Int = ???\n```\n\n如果你是 Scala 的初学者，这段代码定义了一个接收整数列表作为输入并返回一个整数作为结果的函数：\n\
  \n* `def f` 告诉你这是一个名为 `f` 的函数。\n* 它接受一个我命名为 `list` 的输入参数，其类型为 `List[Int]`，意味着它是一个整数的序列（列表）。\n\
  * 该函数返回一个整数（`Int`）。\n\n我鼓励你写下你认为这个纯函数可能做的一切。\n\n作为第二个问题，这里是相同的函数签名，但使用了泛型。同样，它可能可以做什么：\n\
  \n```scala\ndef gA: A = ???\n```\n\n如果你不熟悉泛型，这这意味着该函数可以接收整数列表（`List[Int]`）、字符串列表（`List[String]`）、人员列表（`List[Person]`）等。`List`\
  \ 内部的数据类型对算法并不重要；算法只需要关注它被给了一个列表这一事实。\n\n`A` 作为返回类型意味着函数返回一个单个元素，该元素的类型与列表中包含的数据类型相同。因此，如果函数接收一个\
  \ (`List[Int]`）作为输入，它必须返回一个 `Int`；如果它得到一个 (`List[Person]`)，它必须返回一个 `Person`，依此类推。\n\
  \n再次，我鼓励你写下你认为这个函数可能做的一切。\n\n## 关键点\n\n总结一下，最后这两章中有有几个关键点：\n\n* 纯函数减少了你的认知负载。当你编写它们时，你只需要考虑它们的输入、输出和算法。\n\
  * 你可以信任纯函数，它们不会撒谎。它们的签名准确地告诉了它们可以（以及不能）做什么。\n\n另外——我会在书中反复提到这一点——但使用纯函数（以及不可变对象）编写代码感觉就像写代数一样。你从编写几个这样的纯函数开始：\n\
  \n```scala\ndef add(i: Int, j: Int): Int\ndef multiply(i: Int, j: Int): Int\n```\n\
  \n然后你像这样将它们组合在一起：\n\n```scala\nval x = add(1, 1)\nval y = multiply(x, 2)\n```\n\n\
  或者这样：\n\n```scala\nval z = multiply(add(1, 1), 2)\n```\n\n或者，如果你喜欢架构和工程，这种编程风格就像创建蓝图。你正在将管道和线路连接在一起，因为纯函数不会抛出异常，所有这些管道和梁“只需连接”在一起。（你不需要担心函数抛出异常并破坏你的设计。）\n\
  \n# 12. JIT: 表达式导向编程 (EOP)\n\n在我们开始编写代码之前，我们需要看另一个一个 JIT 主题：*表达式导向编程*（Expression-Oriented\
  \ Programming），或 EOP。为了理解 EOP，我们需要明确编程中表达式（expressions）和语句（statements）之间的区别。\n\n\
  ## 语句 vs 表达式\n\n在编程中，*语句*（statement）是一个不返回结果的代码块，仅用于它的副作用效应。例如，以下两行代码都是语句，因为它们不返回结果：\n\
  \n```scala\nprintln(a)\nif a == b then println(a)\n```\n\n像这样的代码行仅用于副作用，在这些示例中，它们的副作用是打印到标准输出（STDOUT）。\n\
  \n相反，*纯表达式*（pure expression）是一个会返回结果的代码块，且没有副作用。Scala 的非常棒的一点是，每一行代码都可以是一个表达式。这是因为所有这些\
  \ Scala 结构都会返回结果：\n\n* `if`/`then`/`else`\n* `match` 表达式\n* `for` 表达式\n* 甚至 `try`/`catch`/`finally`\
  \ 也会返回值\n\n为了解释这一点，让我们看看如何将 `if`/`then`/`else` 结构当作表达式。\n\n### 补充：快速说明\n\n对于纯主义者来说，更准确的说法是这段代码没有返回一个*有用*的结果：\n\
  \n```scala\nif a == b then println(a)\n```\n\n它确实返回了某些东西——名为 `Unit` 的类型，类似于其他语言中的\
  \ `void`。但在这种情况下，我们通常不在乎它的返回值。\n\n> 正如我之前提到的，`Unit` *类型*在 Scala 中只有一个*值*（或实例），该值由符号\
  \ `()` 表示。因此，这种类型没有意义或无法提供信息，当我们对该返回结果不感兴趣时，我们将其用作函数的返回类型。\n\n## 将 `if/then/else`\
  \ 作为表达式\n\n如所述，`if`、`match`、`for` 和 `try` 都可以作为表达式使用。对于 `if`，这意味着 `if`/`then`/`else`\
  \ 会产生结果：\n\n```scala\nval c = if a < b then a else b\n```\n\n这段代码可以读作：如果 `a` 小于\
  \ `b`，将 `a` 赋值给 `c`；否则，赋值 `b`。\n\n## 其他结构\n\n好了，让我们看看其他结构如何作为表达式使用。这个示例展示了 `match`\
  \ 如何产生值：\n\n```scala\nval evenOdd = i match\n  case 1 | 3 | 5 | 7 => \"odd\"\n \
  \ case 2 | 4 | 6 | 10 => \"even\"\n```\n\n这是一个 `for` 表达式：\n\n```scala\nval result\
  \ = for i <- 10 if i > 5 yield i\n```\n\n如果你不熟悉该语法，`result` 将包含这个值：`Vector(6, 7,\
  \ 8, 9)`\n\n> `Vector` 是 `Seq` 的特定类型——具有高性能特性，并在 Scala 中常用。\n\n当你刚开始 Scala 时，可能倾向于显式声明\
  \ `result` 的类型，如下：\n\n```scala\nval result: Seq[Int] = for i <- 10 if i > 5 yield\
  \ i\n```\n\n最后，甚至 `try`/`catch`/`finally` 块也被用于编写表达式：\n\n```scala\ndef makeInt(s:\
  \ String): Int =\n  try\n    s.toInt\n  catch\n    case e: Exception => 0\n  finally\n\
  \    // 执行你需要的操作\n```\n\n注意，这不是编写此函数的推荐方法——在获取异常时返回 `0` 是错误的，我稍后会展示更好的写法——但这确实展示了\
  \ `try`/`catch`/`finally` 会产生值。你可以这样使用这个 `makeInt` 函数：\n\n```scala\nmakeInt(\"11\"\
  ) // 11\nmakeInt(\"eleven\") // 0\n```\n\n## EOP 代码看起来像什么样\n\n正如我在 [Scala Cookbook](https://amzn.to/3du1pMR)\
  \ 中所示，当你使用 EOP 编写代码时，你的代码变得易写、易读且易测试。它是一系列使用不可变变量、不可变数据结构和纯函数的表达式：\n\n```scala\n\
  // 一系列表达式\nval symbol = \"AAPL\"\nval url = buildUrl(symbol)\nval html = getUrlContent(url)\
  \ // 一个不纯函数\nval price = getPrice(html)\nval volume = getVolume(html)\nval high\
  \ = getHigh(html)\n```\n\n\n\n\n\n```scala\nval low = getLow(html)\nval date = getDate()\
  \ // 一个不纯函数\n\n// StockInstance 是接收这些参数的类：\nval stockInstance = StockInstance(symbol,\
  \ date, price, volume, high, low)\n```\n\n尽管这个示例使用了两个不纯函数与外部世界通信，但它让你对 EOP（表达式式编程）代码的样子有了初步了解。（关于\
  \ `getUrlContent` 函数，我将在接下来的章节中展示一种更好的写法。）\n\n## EOP 的益处\n\n由于表达式（expressions）总是返回一个结果且通常没有副作用，因此\
  \ EOP 有几个益处：\n\n- 代码更容易编写、读取和测试。输入进入一个纯函数，返回一个结果，将其赋值给一个不可变变量，并且没有副作用。\n- 结合 Scala\
  \ 的语法，EOP 能够产生简洁且富有表现力的代码。\n- 尽管在这些示例中仅提到这一点，但表达式通常可以按任何顺序执行。这个微妙的特性允许你并行执行表达式，这在你尝试利用多核\
  \ CPU 的优势时是一个巨大的奖励。\n\n如果你对更多细节感兴趣，我在 [函数式编程，简明版](https://alvinalexander.com/scala/functional-programming-simplified-book)\
  \ 中写了所有这些益处（该书约 40% 是免费的）。\n\n## 开始编码！\n\n有了这些背景，是时候开始编写演示纯函数、不可变对象和 EOP 优势的代码了！\n\
  \n# 13. 示例 #1：使用纯函数和 EOP 解决问题\n\n这样的 Scala 代码变得非常像代数，你完全可以想象阿尔伯特·爱因斯坦正在黑板上写，逐个跟随他的方程，直到他最后将它们全部整合在一起。\n\
  \n为了演示这一点，让我们通过仅使用纯函数、不可变变量、不可变数据结构和 EOP 来编写一个“单词出现次数”算法。我认为你会发现，我们可以简单地通过勾勒一系列纯函数签名来讨论这个问题——就像在黑板上写代数一样。\n\
  \n> 这个示例的灵感来自一本 Haskell 的书籍。我想给它荣誉，但我不记得是在哪本书里看到的了。\n\n## 源代码\n\n如果你想处理这个示例的源代码，可以在这本书的\
  \ Github 仓库中找到它，位于 `WordCount` 文件夹下：\n\n- [github.com/alvinj/LearnFunctionalProgrammingBook](https://github.com/alvinj/LearnFunctionalProgrammingBook)\n\
  \n## 问题描述\n\n任何解决问题工作的第一步都是写一个清晰的问题描述：\n\n> 给定一个用单个 Scala `String` 表示的文档，统计该文档中每个单词出现的次数。\n\
  \n除了该陈述外，我们还展示了算法的输出应该如下，第一列是单词，第二列是出现次数：\n\n`the    543`\n`an     210`\n`or   \
  \  99`\n`(这里有更多单词 ...)`\n\n好了，目前这看起来足够了。那么，我们如何开始呢？\n\n## 入门\n\n首先可以说，我们将编写一个功能像“单词出现次数”或“单词计数”的的纯函数。我不想一直写“出现次数”这个词，所以为了保持简单，我将其称为单词计数函数，并将其命名为\
  \ `wc`：\n\n```scala\ndef wc\n```\n\n接下来，我根据问题描述知道它将接受文档作为 `String` 输入参数：\n\n```scala\n\
  def wc(document: String)\n```\n\n现在，如果我查看示例输出，对我来说那看起来确实是一个 `Map`。更具体地说，一个键为字符串、值为整数的的\
  \ map：\n\n`Map[String, Int]`\n\n例如，在 Scala 中，该示例数据看起来像这个 `Map`：\n\n```scala\nMap(\n\
  \  \"the\" -> 543,\n  \"an\" -> 210,\n  \"or\" -> 99\n)\n```\n\n另外注意输出是按排序打印的，因此我们希望返回一个\
  \ `VectorMap`，告诉其他人这个 map 有特殊之处：\n\n`VectorMap[String, Int]`\n\n`VectorMap` 是一种特定的不可变\
  \ `Map` 类型，允许我们按排序顺序返回 map 的值。\n\n知道此后，我们可以这样完成主函数签名的勾勒：\n\n```scala\ndef wc(document:\
  \ String): VectorMap[String, Int]\n```\n\n好了，这就是我们主函数的签名。现在我们要唯一做的就是勾勒出该函数将要调用的其他纯函数。\n\
  \n## 下一步工作\n\n我们接下来有几种*可以*继续的方法，但由于要求只是将一个 `String` 转换为 `Map`，因此不需要将该 `String` 视为段落和句子来处理。相反，我们可以按原样处理它。\n\
  \n## 移除换行符\n\n我将做的第一件事是从 `String` 中删除所有的换行符。我的想法是可以将所有换行符替换为空格，然后在几刻后，将所有连续的空格减少为单个空格。\n\
  \n当你考虑“移除换行符”函数如何工作时，你可以想象它接收现有的 `String` 作为输入，所以我从这里开始：\n\n```scala\ndef replaceNewlines(s)\n\
  ```\n\n接下来，我知道我想返回一个替换了所有换行符的 `String`，所以我添加 `String` 类型：\n\n```scala\ndef replaceNewlines(s:\
  \ String): String\n```\n\n这就是该函数的勾勒。此时，我觉得这是我 `wc` 函数的第一步，所以我将其添加：\n\n```scala\n\
  def wc(document: String): VectorMap[String, Int] =\n  val stringWithoutNewlines\
  \ = replaceNewlines(document)\n```\n\n注意我会在 `wc` 中包装表达式，是因为 (a) 我刻意使用了长且有意义的函数名，以及\
  \ (b) 很难打印。\n\n## 移除格式字符\n\n我接下来需要做的事情是从字符串中移除所有的格式字符——例如句号、感叹号、问号、分号、冒号和破折号。因此再次，这将是一个接收\
  \ `String` 输入并返回 `String` 的函数，所以我勾勒如下：\n\n```scala\ndef stripFormattingCharacters(s:\
  \ String): String\n```\n\n目前我真的不想让你考虑算法——只需考虑签名。但如果你发现自己在考虑算法，这个函数可以删除所有格式字符或将它们替换为空格；任何方法都可行。\n\
  \n当我将这个函数添加到 `wc` 的体中，它现在看起来是：\n\n```scala\ndef wc(document: String): VectorMap[String,\
  \ Int] =\n  val stringWithoutNewlines = replaceNewlines(document)\n  val stringWithoutFormatting\
  \ = stripFormattingCharacters(stringWithoutNewlines)\n```\n\n## 消除多个空格\n\n此时我想不起对初始字符串进行任何其他更改。我们仍然在处理\
  \ `String`，并且所有的单词应该由一个或多个空格分隔，因此这是创建一个将多个空格转换为单个空格函数的好时机。再次，我们有一个 `String` 输入和一个一个\
  \ `String` 输出，所以我这样勾勒这个函数：\n\n```scala\ndef squeezeBlankSpaces(s: String): String\n\
  ```\n\n然后将该函数调用添加到 `wc` 中以得到：\n\n```scala\ndef wc(document: String): VectorMap[String,\
  \ Int] =\n  val stringWithoutNewlines = replaceNewlines(document)\n  val stringWithoutFormatting\
  \ = stripFormattingCharacters(stringWithoutNewlines)\n```\n\n\n\n\n```scala\nval\
  \ stringWithSingleBlanks =\n    squeezeBlankSpaces(stringWithoutFormatting)\n  \
  \  ...\n```\n\n## 从字符串到 Seq[String]\n\n现在，我们的 `String` 应该不再包含标点符号了，每个单词之间用一个空格隔开。因此，下一步是将其转换为单词列表，在\
  \ Scala 中，这可以被表示为 `Seq[String]`、`List[String]` 或 `Vector[String]`。一旦我们得到了这个单词列表，稍后就可以将其转换为单词计数的\
  \ `Map`。\n\n> `Seq`、`List` 和 `Vector` 都是不可变列表（序列），它们适用于略有不同的用途，但只要我们处理的是一份相对较小的文档，它们中的任何一个一个都可以胜任。\n\
  \n因此，该函数接受一个 `String` 作为输入并返回一个 `Seq[String]`，所以它的签名看起来如下：\n\n```scala\ndef convertStringToListOfWords(s:\
  \ String): Seq[String]\n```\n\n当我把它添加到 `wc` 中，它的函数体现在看起来是这样的：\n\n```scala\ndef wc(document:\
  \ String): VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    ...\n```\n\n## 将单词转换为相同大小写\n\n现在我们已经有了单词列表，还需要再做一件事：要么 (a) 将它们全部转换为相同大小写——小写或大写——或者\
  \ (b) 在稍后统计单词时对它们进行不区分大小写的比较。我们需要这样做是为了确保我们把“Do”和“do”视为同一个单词。\n\n为了偷懒，我打算现在就将所有单词转换为小写。由于我们现在处理的是\
  \ `Seq[String]` ——即我们的单词列表——我将勾勒这个函数，让它接受 `Seq[String]` 作为输入，并返回一个 `Seq[String]`：\n\
  \n```scala\ndef lowerCaseAllWords(listOfWords: Seq[String]): Seq[String]\n```\n\n\
  加上这个函数后，我们的 `wc` 函数看起来如下：\n\n```scala\ndef wc(document: String): VectorMap[String,\
  \ Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    val lcListOfWords =\n        lowerCaseAllWords(listOfWords)\n    ...\n```\n\
  \n## 从 Seq[String] 到 Map\n\n现在我们已经有了单词列表，我们快要大功了。下一步是创建一个函数，将单词列表转换为 `Map`，其中该 `Map`\
  \ 包含每个唯一的单词作为键，并将该单词出现的次数作为值。\n\n我们现在不需要考虑那个算法，只需要勾勒出函数签名。我们知道它应该接受 `Seq[String]`\
  \ 作为输入，并返回一个 `Map[String, Int]`，所以它的签名看起来如下：\n\n```scala\ndef convertWordListToWordCount(listOfWords:\
  \ Seq[String]): Map[String, Int]\n```\n\n现在 `wc` 看起来如下：\n\n```scala\ndef wc(document:\
  \ String): VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    val lcListOfWords =\n        lowerCaseAllWords(listOfWords)\n    val initialMap\
  \ =\n        convertWordListToWordCount(lcListOfWords)\n    ...\n```\n\n## 排序 Map\n\
  \n作为最后一步，我们现在只需要按值对该 `Map` 进行降序排序。例如，`Map` 现在可能像这样：\n\n```scala\nMap(\n    \"or\"\
  \ -> 99,\n    \"the\" -> 543,\n    \"an\" -> 210\n)\n```\n\n而我们希望它看起来像这样：\n\n```scala\n\
  Map(\n    \"the\" -> 543,\n    \"an\" -> 210,\n    \"or\" -> 99\n)\n```\n\n因此，我们需要一个接受\
  \ `Map[String, Int]` 作为输入并返回 `Map[String, Int]` 的函数，但是，返回的 map 需要是排序过的。Scala 的 `VectorMap`\
  \ 可以用于此，所以我勾勒了这个函数：\n\n```scala\ndef sortMapByValue(map: Map[String, Int]): Map[String,\
  \ Int]\n```\n\n然后我把它添加到 `wc` 中：\n\n```scala\ndef wc(document: String): VectorMap[String,\
  \ Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    val lcListOfWords =\n        lowerCaseAllWords(listOfWords)\n    val initialMap\
  \ =\n        convertWordListToWordCount(lcListOfWords)\n    val sortedMap =\n  \
  \      sortMapByValue(initialMap)\n    sortedMap\n```\n\n## 代码可读吗？\n\n现在我们已经有了单词列表，我们还需要再做一件事：要么\
  \ (a) 将它们全部转换为相同大小写——小写或大写——或者 (b) 在稍后统计单词时对它们进行不区分大小写的比较。我们需要这样做是为了确保我们把“Do”和“do”视为同一个单词。\n\
  \n为了偷懒，我打算现在就将所有单词转换为小写。由于我们现在处理的是 `Seq[String]` ——即我们的单词列表——我将勾勒这个函数，让它接受 `Seq[String]`\
  \ 作为输入，并返回一个 `Seq[String]`：\n\n```scala\ndef lowerCaseAllWords(listOfWords: Seq[String]):\
  \ Seq[String]\n```\n\n加上这个函数后，我们的 `wc` 函数看起来如下：\n\n```scala\ndef wc(document: String):\
  \ VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    val lcListOfWords =\n        lowerCaseAllWords(listOfWords)\n    ...\n```\n\
  \n## 讨论\n\n现在我们已经有了单词列表，我们快要大功了。下一步是创建一个函数，将单词列表转换为 `Map`，其中该 `Map` 包含每个唯一的单词作为键，并将该单词出现的次数作为值。\n\
  \n我们现在不需要考虑那个算法，只需要勾勒出函数签名。我们知道它应该接受 `Seq[String]` 作为输入，并返回一个 `Map[String, Int]`，所以它的签名看起来如下：\n\
  \n```scala\ndef convertWordListToWordCount(listOfWords: Seq[String]): Map[String,\
  \ Int]\n```\n\n现在 `wc` 看起来如下：\n\n```scala\ndef wc(document: String): VectorMap[String,\
  \ Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    val lcListOfWords =\n        lowerCaseAllWords(listOfWords)\n    val initialMap\
  \ =\n        convertWordListToWordCount(lcListOfWords)\n    val sortedMap =\n  \
  \      sortMapByValue(initialMap)\n    ```\n\n## 两点说明\n\n在写完这一节后，我想到了两点。\n\n###\
  \ 1) 成为数学家或建筑师\n\n第一个说明是重申我已经过的：FP 喜欢将这种编程风格看作数学，或者说是创建蓝图。因此，与其说是一个程序员，你更像是一个数学家或建筑师，在处理方程或蓝图。正如此，你也会听到\
  \ FP 说诸如“推理代码”，因为他们查看这些函数签名以及它们是如何组合的。\n\n正如你在整本书中所看到的，当你的函数是纯的且你的值是不可变的时，你可以这样做。\n\
  \n### 2) 使用 Scala 类型可以做更多\n\n我需要提到的第二点是，通过 Scala 类型系统，你可以做一些操作让代码更易读。例如，在我的代码中，我从函数返回一个\
  \ `VectorMap`，但如果你考虑那个签名，它可以更有意义，不是吗？\n\n我的意思是我写了：\n\n```scala\nVectorMap[String,\
  \ Int]\n```\n\n但通过 Scala 的类型系统，我可以这样写那个返回类型：\n\n```scala\nMapSortedByValueDesc[String,\
  \ Int]\n```\n\n\n\n\nScala 允许你像这样创建更具意义的类型名称，在这种情况下，任何现在看到这段代码的人都能立刻读出这是一个按值排序的\
  \ `Map`。这非常酷。\n\n而且，你还可以更进一步，让该函数的签名看起来像像这样：\n\n`MapSortedByValueDesc[Word, Count]`\n\
  \n哇，这简直酷极了。有了这些新名称，任何路人走过时都能准确地看出这个 `Map` 发生了什么。而这一切都可以用 Scala 实现。\n\n正如我在[Scala\
  \ 烹食指南（第 2 版）](https://amzn.to/3du1pMR)中讨论的那样，这种命名过程用于领域驱动设计（Domain-Driven Design），它让你的类型更具意义。\n\
  \n这也引出了一个有趣的问题：如果你进入别人的代码库，对于这个特定问题，你更愿意看到以下哪种选项，为什么：\n\n*   `Map[String, Int]`\n\
  *   `VectorMap[String, Int]`\n*   `MapSortedByValueDesc[String, Int]`\n*   `MapSortedByValueDesc[Word,\
  \ Count]`\n\n答案完全取决于你，但是，我鼓励你对此形成自己的观点。你也可以把它展示给同事开发者看，问问他们更愿意看到哪种，以及为什么。\n\n##\
  \ 全部完成！\n\n到此为止，我们已经完成了。嗯，至少我们完成了解决此问题所需的纯函数的草拟。我们现在要做的就是为这些函数的体编写算法。\n\n到目前为止，是思考函数签名的时间。现在是思考如何实现这些算法了。\n\
  \n我会说把这部分留给“读者的练习”，但你可以在这本书的 Github 仓库中找到这些函数的实现。\n\n# 14. 还有件事：代数代换\n\n在我们继续这个单词计数计数示例之前，我需要添加一个非常重要的点：由于我编写\
  \ `wc` 时只使用了纯函数和不可变值，你和编译器都可以自由地简化这段代码。\n\n这意味着在上一节结束时，我有这样一个函数：\n\n```scala\ndef\
  \ wc(document: String): VectorMap[String, Int] =\n    val stringWithoutNewlines\
  \ =\n        replaceNewlinesWithBlanks(document)\n    val stringWithoutFormatting\
  \ =\n        stripFormattingCharacters(stringWithoutNewlines)\n    val stringWithSingleBlanks\
  \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords =\n\
  \        convertStringToListOfWords(stringWithSingleBlanks)\n    val lcListOfWords\
  \ =\n        lowerCaseAllWords(listOfWords)\n    val initialMap =\n        convertWordListToWordCount(lcListOfWords)\n\
  \    val sortedMap =\n        sortMapByHighestValue(initialMap)\n    sortedMap\n\
  ```\n\n但由于 `initialMap`（在函数末尾）完全等于 `convertWordListToWordCount(lcListOfWords)` ——\
  \ 并且永远如此，因为值是不可变的且函数是纯的 —— 你可以将倒数第二行的 `initialMap` 替换为等等的函数调用，如下：\n\n```scala\n\
  def wc(document: String): VectorMap[String, Int] =\n    val stringWithoutNewlines\
  \ =\n        replaceNewlinesWithBlanks(document)\n    val stringWithoutFormatting\
  \ =\n        stripFormattingCharacters(stringWithoutNewlines)\n    val stringWithSingleBlanks\
  \ =\n        squeezeBlankSpaces(stringWithoutFormatting)\n    val listOfWords =\n\
  \        convertStringToListOfWords(stringWithSingleBlanks)\n    val lcListOfWords\
  \ =\n        lowerCaseAllWords(listOfWords)\n    // ELIMINATED 'initialMap'\n  \
  \  val sortedMap =\n        sortMapByHighestValue(convertWordListToWordCount(lcListOfWords))\n\
  \    sortedMap\n```\n\n同样的理由，`lcListOfWords` 完全等于：\n\n`lowerCaseAllWords(listOfWords)`\
  \ 所以我可以消除这个中间变量：\n\n```scala\ndef wc(document: String): VectorMap[String, Int] =\n\
  \    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    val listOfWords =\n        convertStringToListOfWords(stringWithSingleBlanks)\n\
  \    // ELIMINATED 'lcListOfWords'\n    val sortedMap =\n        sortMapByHighestValue(\n\
  \            convertWordListToWordCount(lowerCaseAllWords(listOfWords))\n      \
  \  )\n    sortedMap\n```\n\n接下来，`listOfWords` 完全等于 `convertStringToListOfWords(stringWithSingleBlanks)`\
  \ 并且永远如此，所以我可以移除 `listOfWords` 作为中间变量：\n\n```scala\ndef wc(document: String): VectorMap[String,\
  \ Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    val stringWithSingleBlanks =\n        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \    // ELIMINATED 'listOfWords'\n    val sortedMap =\n        sortMapByHighestValue(\n\
  \            convertWordListToWordCount(\n                lowerCaseAllWords(\n \
  \                   convertStringToListOfWords(stringWithSingleBlanks)\n       \
  \         )\n            )\n        )\n    sortedMap\n```\n\n同样的情况适用于 `stringWithBlanks`，它是\
  \ `squeezeBlankSpaces(stringWithoutFormatting)` 所以再次简化代码：\n\n```scala\ndef wc(document:\
  \ String): VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    val stringWithoutFormatting =\n        stripFormattingCharacters(stringWithoutNewlines)\n\
  \    // ELIMINATED 'stringWithBlanks'\n    val sortedMap =\n        sortMapByHighestValue(\n\
  \            convertWordListToWordCount(\n                lowerCaseAllWords(\n \
  \                   convertStringToListOfWords(\n                        squeezeBlankSpaces(stringWithoutFormatting)\n\
  \                    )\n                )\n            )\n        )\n    sortedMap\n\
  ```\n\n然后对 `stringWithoutFormatting` 执行同样的操作：\n\n```scala\ndef wc(document: String):\
  \ VectorMap[String, Int] =\n    val stringWithoutNewlines =\n        replaceNewlinesWithBlanks(document)\n\
  \    // ELIMINATED 'stringWithoutFormatting'\n    val sortedMap =\n        sortMapByHighestValue(\n\
  \            convertWordListToWordCount(\n                lowerCaseAllWords(\n \
  \                   convertStringToListOfWords(\n                        squeezeBlankSpaces(\n\
  \                            stripFormattingCharacters(stringWithoutNewlines)\n\
  \                        )\n                    )\n                )\n         \
  \   )\n        )\n    sortedMap\n```\n\n对于 `stringWithoutNewlines`：\n\n```scala\n\
  def wc(document: String): VectorMap[String, Int] =\n    // ELIMINATED 'stringWithoutNewlines'\n\
  \    val sortedMap =\n        sortMapByHighestValue(\n            convertWordListToWordCount(\n\
  \                lowerCaseAllWords(\n                    convertStringToListOfWords(\n\
  \                        squeezeBlankSpaces(\n                            stripFormattingCharacters(\n\
  \                                replaceNewlinesWithBlanks(document)\n         \
  \                   )\n                        )\n                    )\n      \
  \          )\n            )\n        )\n    sortedMap\n```\n\n如果你愿意，你还可以消除 `sortedMap`：\n\
  \n```scala\ndef wc(document: String): VectorMap[String, Int] =\n    // ELIMINATED\
  \ 'sortedMap'\n    sortMapByHighestValue(\n        convertWordListToWordCount(\n\
  \            lowerCaseAllWords(\n                convertStringToListOfWords(\n \
  \                   squeezeBlankSpaces(\n                        stripFormattingCharacters(\n\
  \                             replaceNewlinesWithBlanks(document)\n            \
  \                )\n                        )\n                    )\n         \
  \       )\n            )\n        )\n    )\n```\n\n\n\n我们将这一过程称为*代数代换*（algebraic\
  \ substitution），它之所以有效是因为：\n\n*   函数是纯的\n*   变量是不可变的\n*   数据结构是不可变的\n\n当代码像这样编写时，你和编译器都可以自由地以这些方式中的任何一种来编写，而且你始终能得到相同的结果。\n\
  \n> 关键：但如果你使用可变变量、可变数据类型和不纯方法，情况就不如此了。\n\n## 技术细节：“引用透明性”\n\n如果你喜欢代数，你也会喜欢引用透明性。我们说一个表达式是*引用透明的*（referentially\
  \ transparent, RT），如果它可以被替换为它的结果而不改变程序的行为。无论该表达式位于程序的哪个位置，这一点都必须成立。所以这基本上是用来表达：“在这里可以进行代数代换。”\n\
  \n我在上一个示例中所做的实际上恰恰相反——我用表达式替换了中间变量——但这正是酷酷的地方：所有这些中间变量及其纯函数调用都是 100% 等价的。\n\n最后，请注意我并没有在代码中编写任何“花哨的\
  \ FP（函数式编程）”操作。我只是在使用不可变变量、不可变数据类型和纯函数编写 EOP（面向表达式编程）代码。\n\n# 15. 并行编程概览\n\n代数代换重要的第一个原因是，正如我提到的，这样编写的代码更容易编写、读取和测试。这句话写起来很简单，但在实践中，这是一个巨大的收益，能让你的生活变得更简单。（单单这一点我就可以写好几章。）\n\
  \n另一个重要原因是，你可以使用代数代换，按照我刚才展示的任何方式来编写代码。我展示的第二种方法，即你的代码看起来像这样：\n\n```\ndoE(\n  doD(\n\
  \    doC(\n      doB(\n        doA(someData)\n      )\n    )\n  )\n)\n```\n\n也可以格式化为这样：\n\
  \n```\ndoE(doD(doC(doB(doA(someData)))))\n```\n\n无论哪种方法，这都很趣，因为这就像在写 Lisp 代码，你从内向外读取它。（少量量的情况下，我喜欢这种风格。）\n\
  \n但关于 EOP 和代数代换，还有一个更重要的点：\n\n> 当你的表达式（方程）不需要按照特定顺序求值时，编译器可以完全自由地并行求值它们，然后在之后的某个时候将它们合并为一个结果。我只用过几周\
  \ Haskell，但我读过 Haskell 编译器的工作原理就是这样，它能够这样做是因为 Haskell 代码被保证是 FP 代码。\n\n## 开启并行编程\n\
  \n为了演示我的意思，这里有一个示例，你仍然可以假设所有函数都是纯的，且变量和数据类型是不可变的：\n\n```\nval a = f1(x)\nval b =\
  \ f2(y)\nval c = f3(z)\nval d = f(a, b, c)\n```\n\n因为前三个表达式之间没有依赖关系，智能编译器可以完全自由地在不同的线程（或者是最近的*纤/fibers*）上运行这些函数。所以，如果每个函数的运行需要\
  \ 20 秒，你不需要等待它们串行运行 60 秒；它们可以并行运行，你在 20 秒内就能获得最终结果。\n\n从视觉上看，这意味着与其拥有这种缓慢的串行代码：\n\
  \n```\n// 代码串行运行，每个 20 秒，总共 60 秒\nval a = f1(x)                                \
  \            \n<<<<<<<                                                  \n  >>>\
  \ val b = f2(y)                                     \n<<<<<<<                  \
  \                                \n      >>> val c = f3(z)                     \
  \            \n<<<<<<<                                                  \n     \
  \   >>> val d = f(a, b, c)\n```\n\n你可以拥有这种并行运行的高性能代码：\n\n```\n// 代码并行运行，总共 20 秒\n\
  val a = f1(x)                            \n<<<<<<<                             \
  \                     \nval b = f2(y)                            \n<<<<<<<     \
  \                                             \nval c = f3(z)                  \
  \          \n<<<<<<<                                                  \nval d =\
  \ f(a, b, c)                       \n``` \n\n当你需要高性能代码时——而且谁不想要呢——这是一个巨大的胜利。为了获得这些收益，你只需要使用：\n\
  \n*   不可变变量\n*   不可变数据结构\n*   纯函数\n*   表达式（而不是语句）\n\n## 这对可变对象无效\n\n必须明确一点是，当你使用可变变量、可变数据结构和不纯函数时，编译器无法为你做这些。\n\
  \n也许演示这一点最简单的方法是假设你有以下三行代码，它们由两个语句和一个带有副作用的函数组成：\n\n```\nprintln(\"What’s your name?\"\
  )               // 语句\nval name = readLine()                      //Effects\nprintln(s\"\
  You said your name\")\n```\n\n另一个例子是，假设你有三个函数 `g1`、`g2` 和 `g3`，它们各都会修改共享状态。如果 `g1`\
  \ 写入一个 `g2` 读取的变量，而 `g2` 写入一个 `g3` 读取的变量，这些操作确实需要按照那个顺序发生。\n\n但如果 `g1`、`g2` 和 `g3`\
  \ 是并行运行的——那么，事情发生的顺序就没有保证了。我们说从这种情况下得到的结果是*不确定的*（indeterminate）。\n\n有一次我在为一个客户工作，他们遇到了一个问题，偶尔会出现客户数据不一致的情况。他们的用户名和街道地址可能是正确的，但城市、州或邮政编码与用户名和地址不匹配。\n\
  \n在不可变变量、不可变数据结构和纯函数的情况下，这种情况不会发生。\n\n## 代码推理\n\n你有时会听到 FP 程序员说他们喜欢“推理他们的代码”。当然，在\
  \ OOP 中我们也这样做，但当 FP 程序员说这句话时，意味着我们像观察代数一样观察代码，并确保它们能够按照我们想要合并。\n\n如果它们可以并行运行，很好，那太棒了。但如果它们不能，你会看到我们*确保*它们按串行运行，通常使用\
  \ `for` 表达式：\n\n```\nval result =\n  for\n    a <- g1(x)\n    b <- g2(y)\n    c\
  \ <- g3(z)\n    yield\n      // 这里是对 a, b, 和 c 的使用\n      g4(a, b, c)\n```\n\n这是一个有些为了意的例子，但我将在本书的后部分演示这种技术的实际用途。\n\
  \n# 16. 总结：Java/OOP vs 纯函数\n\n当我开始这本书的这个章节时，我展示了在超过 15 万行的生产级 Java 代码中的最复杂的两个类型声明：\n\
  \n```java\nSortedMap<String, Integer> wordCountMap = new TreeMap();\npublic Class<?>\
  \ getColumnClass(int columnIndex) {\n```\n\n\n\n\n相反，正如你在字数计数（Word Count）示例中所看到的，当我使用纯函数在\
  \ Scala 中规划该应用时，我已经在处理此类数据类型了：\n\n`Seq[String]`\n\n`VectorMap[String, Int]   //\
  \ or: MapSortedByValueDesc[Word, Count]`\n\n这暗示了在 Scala 中，我们对*类型（types）*的使用比开发者在\
  \ Java/OOP 中习惯的使用要得多。\n\n作为一个乐于帮助想要学习更多 Scala 程序员的人，承认这与 Java/OOP 是一个不同的世界至关重要。在\
  \ Java 世界中，除非你是一个库开发者，否则你通常只会处理这类类型；但在 Scala 世界中，所有层级的开发者都会使用它们。因此，我认为承认这种差异很重要。\n\
  \n尽管如此，我想问问：你觉得字数计数示例难理解吗？我怀疑——也希望——它并不难。正如你所看到的，我只是勾勒了一系列纯函数及其类型签名。\n\n## 益处\n\n\
  这种只使用纯函数、不可变变量和不可变数据结构的方法有很多益处。首先，这里是你已经看到的一些内容：\n\n* 你编写纯函数。\n* 编写纯函数几乎是到了极致简单。你不需要担心整个应用程序的状态，你只需要考虑的是\
  \ (a) 输入了什么，以及 (b) 输出了什么。由于这些属性，你可以像我刚才那样勾勒出解决方案。只需将解决方案勾勒成系列纯函数，然后填充函数体即可。\n* 你可以信任纯函数的类型签名，它们不会撒谎。它们的签名告诉你是正在发生什么。\n\
  * 正因如此，你可以信任其他开发者编写的纯函数。\n* 到目前为止我简要提到了这一点，但如果你查看一个纯函数的签名并看到 `Option`、`Try` 或 `Either`\
  \ 作为返回类型，你会立刻：“这里可能会出问题。（很快会进行详细介绍。）”\n\n除了这些益处之外：\n\n* 纯函数不仅更容易写，而且更容易读。只需查看纯函数的类型签名，你就能对该函数可能做什么有一个很深刻的认识。\n\
  * 你将开始把解决问题看作代数，或者像建筑师或工程师一样创建蓝图。\n* 正如你在字数计数示例中看到的，问题的最终解决方案只是组合你的纯函数，就像代数方程一样。\n\
  * 遵循所有这些逻辑，*测试*纯函数也变得更容易。你所做的只是设置前门输入的内容，以及你期望从后门输出的内容。你不需要担心应用程序其他地方（侧门）的可变状态。\n\
  \n## 下一步\n\n在我们完全离开字数计数示例之前，让我们为它添加一个现实场景：你的老板来找你并请求更改。\n\n# 17. 对 wc 程序的更改\n\n\
  所以更改是，你的老板来找你说：“嗯，呃，是的，关于那个字数计数应用我搞错了。你不会得到一个代表文档的 `String`，你将得到一个你需要读取的文件名称的 `String`，它包含了文档。”\n\
  \n这不是一个巨大的变化，但它确实引发了一些有趣的问题；如果出现以下情况该怎么办：\n\n* 文件不存在？\n* 文件不可读？\n\n在 Java/OOP 中——甚至是\
  \ Scala/OOP 中——你可能会抛出异常，然后让代码的调用者来处理它们。但在 Scala/EOP 和 Scala/FP 中，我们不做这些事情。我们不抛出异常，因为那些会短路我们的代数方程或破坏我们的蓝图。\n\
  \n相反，我们使用一种不同的技术，被称为*函数式错误处理（functional error handling）*和*错误处理数据类型*。我们接下来将查看它们。\n\
  \n# 18. 函数式错误处理 (FEH)\n\n在 Scala 中，处理潜在错误的正确解决方案是使用 Scala 的*错误处理数据类型*。简而言之，这意味着一个可能失败的函数应该返回\
  \ `Option`、`Try` 或 `Either` 类型之一：\n\n`def wc(f: File): Option[?]`\n\n`def wc(f:\
  \ File): Try[?]`\n\n`def wc(f: File): Either[?]`\n\n基本思想是返回一个错误处理数据类型，以考虑到该函数可能发生错误的情况。\n\
  \n## 这些类型是包装器\n\n错误处理类型基本上是*包装器（wrappers）*，在它们的包装内部包含了两种可能性之一：\n\n* 函数执行成功，你可以访问它的成功值\n\
  * 函数执行失败，你可以访问它的错误值\n\n所以这就像是你从函数那里拿回容器：\n\n```\n┏━━━━━━━━━━━━━━━━━━━━┓\n      Option\n\
  \   Success OR Failure\n┗━━━━━━━━━━━━━━━━━━━━┛\n```\n如所示，当你从函数那里获得容器时，它将包含一个成功值或两者两者兼具。这种方法的一个非常棒的一点是，与异常不同，它们不会短路你的代码：你只是在处理另一个数据类型。你将此结果视为值，并像代数一样继续你的代码。`Option`、`Try`\
  \ 和 `Either` 错误处理类型的方法略有不同，但这是它们的本质。\n\n让我们看看它们是如何工作的\n\n暂时用 OOP 思考，这些中的每一个都是父类型，每个类型有两个子类型。对于这三个值，这些是父类型及其子类型：\n\
  \n* `Option`、`Some` 和 `None`\n* `Try`、`Success` 和 `Failure`\n* `Either`、`Right`\
  \ 和 `Left`\n\n它们的类层次结构是基础 OOP，看起来如下：\n\n```\n┏━━━━┳┓\n  Option\n  Some\nNone\n┗━━━━┻┛\n\
  ```\n```\n┏━━━━┳┓\n  Try\n  Success\nFailure\n┗━━━━┻┛\n```\n```\n┏━━━━┳┓\n  Either\n\
  \  Right\nLeft\n┗━━━━┻┛\n```\n\n# 19. FEH: Option\n\n我喜欢的第一个函数式错误处理类型是 `Option`，以及它的伴侣\
  \ `Some` 和 `None`。我这样做是因为 (a) 它类似于 Java 的 `Optional` 类型，并且 (b) 它比 `Try` 和 `Either`\
  \ 更基础一点。\n\n## 在事情可能出错的世界里……\n\n\n\n\n回到我们的字数计数应用程序，我们的老板刚刚过来告诉我们，我们得到的不是一个代表文档的\
  \ `String`，而是一个包含该文档的文件名的 `String`。\n\n任何有经验的开发者都知道，当你编写某些函数时，可能会出错。当你开始处理文件 I/O、网络\
  \ I/O 和数据库 I/O 时情况尤其如此。在这个世界里，文件可能是不可读的，网络可能会中断，服务器可能会宕机等，这些情况必须在考虑范围内。\n\n在其他编程语言中编写这些函数时，你可能会抛出异常或返回空值，但在\
  \ Scala 中我们不做这些事情。如所述，我们使用*错误处理数据类型*。\n\n> 正如我多年前[在这篇博客文章](https://alvinalexander.com/scala/best-practice-eliminate-null-values-from-code-scala-idioms/)中所写的那，`null`\
  \ 引用的发明者 Tony Hoare 在追溯到 1965 年将 `null` 值的创建称为他的“十亿美元错误”。\n\n## 一个更简单的问题：将 String\
  \ 转换为 Int\n\n我会把字数计数应用程序再推迟一会儿，相反我想处理一个稍微简单一点的问题。我将展示如何*安全地*将一个 `String` 转换为 `Int`。这是一个相对简单的问题，所以我们可以专注于我们的错误处理类型，而不是丢失的文件或宕机的服务器。（我们会在书的后部分处理这些问题。）\n\
  \n所以，将 `String` 转换为 `Int` 的问题在于，它有时成功，有时却失败。当它失败时，过程会抛出一个异常。Scala REPL 展示了该过程如何成功以及如何失败：\n\
  \n```\nscala> \"1\".toInt\nval res0: Int = 1\n\nscala> \"one\".toInt\njava.lang.NumberFormatException:\
  \ For input string: \"one\"\n```\n\n在第一个示例中，字符串正确地表示了一个整数—— `\"1\"`——所以转换过程成功了。但在第二个示例中，当字符串无法转换为整数时，过程因\
  \ `NumberFormatException` 而崩溃了。\n\n代码崩溃是很糟糕的。当你的方程可能会爆炸时，你无法编写代数算式。\n\n## 第一次尝试\n\
  \n如果我们*没有*错误处理类型，我们可能会首先尝试写如下这样的 `makeInt` 函数：\n\n```scala\ndef makeInt(s: String):\
  \ Int =\n    try\n        s.toInt\n    catch\n        case e: NumberFormatException\
  \ => 0\n```\n\n该函数始终返回一个 `Int`，但问题是它在所有实例中都不是准确的。例如，所有这些函数调用都会返回 `0`，这是不正确的：\n\n\
  ```\nmakeInt(\"0\")\nmakeInt(\"\")\nmakeInt(\"one\")\n```\n\n在第一个示例中，返回的值是正确的，但在第二个和第三个示例中，`0`\
  \ 不是答案。那么，正确的解决方案是什么？\n\n## 正确的解决方案\n\n这就是 Scala 的错误处理数据类型大显身场的地方。与其返回一个 `Int`，正确的方法是让它返回一个*封装*了成功或失败可能的数据类型。如，我想先处理\
  \ `Option` 类型以及它的子类型 `Some` 和 `None`。\n\n通用的解决方案是：(a) 定义你的函数返回一个 `Option`，该类型包装了你的函数在成功时产出的类型——在本例中是\
  \ `Int`。然后在函数体中，你 (b) 对于*成功*情况返回一个 `Some`，并在 (c) 对于*失败*情况返回一个 `None`：\n\n```scala\n\
  def makeInt(s: String): Option[Int] =\n    try\n        Some(s.toInt)\n    catch\n\
  \        case e: NumberFormatException => None\n```\n\n如所示，`Some` 包装了你能够成功计算的数据类型，而在错误情况下，你返回一个\
  \ `None`。（`None` 类型不包含任何内容，它只是向你函数的调用者指示出了某些问题。）\n\n当你调用该函数时，你将看到 `Some` 和 `None`\
  \ 类型作为它的返回值：\n\n```scala\n// 成功案例\nmakeInt(\"1\")      // Some(1)\nmakeInt(\"2\"\
  )      // Some(2)\n\n// 失败案例\nmakeInt(\"\")       // None\nmakeInt(\"one\")    //\
  \ None\n```\n\n该解决方案的关键是 `Option` 是基础类型，而 `Some` 和 `None` 是它的子类型：\n\n```\n  Option\n\
  \  / \\\nSome None\n```\n\n所以你声明该函数返回父类型：`Option`，或者在本例中具体为 `Option[Int]`。然后函数体返回其子类型：成功情况返回\
  \ `Some`，失败情况返回 `None`。当你写这个函数时，这就是你需要做的所有。\n\n## 使用该函数\n\n现在 `makeInt` 写成了这样，硬币的另一面问题是：“作为此函数的调用者，我该如何处理这种类型？”\n\
  \n### 模式匹配\n\n处理 `Option` 的常见方法之一是在 `match` 表达式中使用*模式匹配*：\n\n```scala\nmakeInt(s)\
  \ match\n    case Some(i) => println(s\"转换成功！i = $i\")\n    case None    => println(\"\
  转换失败.\")\n```\n\n如所示，`match` 表达式允许你处理两种可能的情况，`Some` 和 `None`。当你处理 `Some` 时，你可以从从中提取出\
  \ `Int`，而当你处理 `None` 时，它只是一个指示，说明出了某些问题。\n\n### for 表达式\n\n使用该函数的另一种常用方法是把它放在 `for`\
  \ 表达式中，特别是当你有多个函数调用时。这段代码展示了当字符串可以转换为整数的结果：\n\n```scala\nval maybeSum: Option[Int]\
  \ =\n    for\n        i <- makeInt(\"1\")\n        j <- makeInt(\"2\")\n       \
  \ k <- makeInt(\"3\")\n    yield\n        i + j + k\n// 结果：maybeSum == Some(6)\n\
  ```\n\n有些开发者喜欢在接收错误处理类型时使用“maybe”（可能）这个词，因为值“可能”是一个成功类型，也可能不是。接下，这段*完全相同的代码*展示了当一个或多个字符串无法转换为整数时的情况：\n\
  \n```scala\nval maybeSum: Option[Int] =\n    for\n        i <- makeInt(\"1\")\n\
  \        j <- makeInt(\"Hi!\")\n        k <- makeInt(\"3\")\n    yield\n       \
  \ i + j + k\n// 结果：maybeSum == None\n```\n\n如所示，在这种情况下，`maybeSum` 是 `None` 而不是 `Some`。然而，注意在这一点上你并不关心是否失败了，你只需要像所示那样编写代码，它处理了成功和失败两种情况。\n\
  \n## 纯函数不能撒谎\n\n在继续之前，关于纯函数的签名，值得再次这一点：*它们不能撒谎*。\n\n正如你在这个示例中所看到的，`makeInt` 函数清晰地大喊着：“如果一切顺利，我会给你一个\
  \ `Int`，但请注意这里可能会出问题”：\n\n```scala\ndef makeInt(s: String): Option[Int] = ???\n\
  ```\n\n每当你看到 `Option` 作为纯函数的返回类型时，你就知道该函数内部可能会出问题。\n\n\n\n\n\n## makeInt 可以更简洁\n\
  \n对于熟悉 Scala 的人来说，我想指出，是的，`makeInt` 可以写得更简洁。但为了这些课程的目的，我使用了这种较长的形式。（我稍后会展示更短的形式。）\n\
  \n# 20. FEH: 尝试 (Try)\n\n现在你已经知道了 `Option` 是如何工作的，让我们来看看 `Try` 作为 `Option` 的替代方案。\n\
  \n`Try` 几乎和 `Option` 一一样，但它允许你返回更有意义的错误值。这有助于函数调用者理解函数内部发生了什么错误。\n\n就像 `Option`\
  \ 有两个子类型一样，`Try` 也有两个子类型 —— `Success` 和 `Failure` —— 这两种数据类型的比较关系如下：\n\n`Option\
  \ <=> Try`\n`Some <=> Success`\n`None <=> Failure`\n\n所以基本上，你以前使用 `Option` 的地方现在都可以使用\
  \ `Try`。在以前使用 `Some` 的地方你现在使用 `Success`，而用 `Failure` 代替 `None`。\n\n但大区别的区别在于，当发生错误时，`Failure`\
  \ 包含一个异常 —— 在函数内部发生的异常。这是你的函数告诉调用者函数内部到底发生了什么错误的方法。正因如此，在处理 I/O 函数时，`Try` 通常比 `Option`\
  \ 更有用。\n\n让我们来看看它是什么样的。\n\n## Try/Success/Failure\n\n这是一个 `makeInt` 的新版本，它使用 `Try`\
  \ 而不是 `Option`：\n\n```scala\n// 你必须先导入这些类型：\nimport scala.util.{Try, Success, Failure}\n\
  \ndef makeInt(s: String): Try[Int] =\n    try\n        Success(s.toInt)\n    catch\n\
  \        case e: NumberFormatException => Failure(e)\n```\n\n现在当你调用 `makeInt` 时，你会在成功和失败的情况下看到这些结果：\n\
  \n```scala\n// 成功情况\nmakeInt(\"1\")      // Success(1)\n// 失败情况\nmakeInt(\"one\"\
  )    // Failure(java.lang.NumberFormatException:\n                             \
  \         For input string: \"one\")\n```\n\n所示：\n\n- 当转换成功时，你会得到一个 `Success`。`Success`\
  \ 是包含 `Int` 的包装器。\n- 当过程失败时，你会得到一个 `Failure`。`Failure` 包含了异常消息。\n\n作为函数的消费者，`Failure`\
  \ 情况现在变得有趣得多了，因为它告诉了我函数内部发生了什么错误。\n\n## 处理结果\n\n与 `Option` 一样，你使用 `match` 表达式和 `for`\
  \ 表达式来处理 `Try`。\n\n### 模式匹配 (pattern matching)\n\n这是 `Try` 使用 `match` 表达式的形式：\n\n\
  ```scala\nmakeInt(aString) match\n    case Success(i) => println(s\"Success: i =\
  \ $i\")\n    case Failure(e) => println(s\"Failed: msg = ${e.getMessage}\")\n```\n\
  \n### for 表达式 (for expressions)\n\n这是 `Try` 在 `for` 表达式中使用多个*可以*转换为整数的字符串时的形式：\n\
  \n```scala\nval maybeSum: Try[Int] =\n    for\n        i <- makeInt(\"1\")\n   \
  \     j <- makeInt(\"2\")\n        k <- makeInt(\"3\")\n    yield\n        i + j\
  \ + k\n// 结果：  maybeSum == Success(6)\n```\n\n而当它们*不能*转换时，看起来是这样的：\n\n```scala\n\
  val maybeSum: Try[Int] =\n    for\n        i <- makeInt(\"1\")\n        j <- makeInt(\"\
  Hi mom!\")\n        k <- makeInt(\"3\")\n    yield\n        i + j + k\n// 结果：\n\
  maybeSum == Failure(java.lang.NumberFormatException:\n                     For input\
  \ string: \"Hi mom!\")\n```\n\n再次强调——就像 `Option` 一样——无论你从 `for` 表达式得到 `Success`\
  \ 还是 `Failure`，你都在 `match` 表达式中处理它的结果：\n\n```scala\nmaybeSum match\n    case Success(i)\
  \ => println(s\"Success: i = $i\")\n    case Failure(e) => println(s\"Failed: msg\
  \ = ${e.getMessage}\")\n```\n\n所示，`Try` 和 `Option` 的用法是相同的。\n\n## 该内容的更短版本\n\n我稍后会展示如何用\
  \ `Option`、`Try` 和 `Either` 写出更多版本的 `makeInt`，但 `Try` 有点独特之处，你可以简单地将抛出异常的算法传递给 `Try`\
  \ 的构造函数：\n\n```scala\nimport scala.util.{Try, Success, Failure}\ndef makeInt(s:\
  \ String): Try[Int] = Try(s.toInt)\n```\n\n因为 `Try` 返回你的代码可能抛出的异常，它的创建者意识到没有理由让你在函数体中写一个\
  \ `try/catch` 表达式。你只需要将抛出异常的代码封装在 `Try` 内部，如果抛出了该异常，它会为你捕获它并返回一个 `Failure`。\n\n\
  同样，如果你的抛出异常的算法需要多行代码，只需像这样写，在代码块周围使用大括号：\n\n```scala\nimport scala.util.{Try, Success,\
  \ Failure}\ndef makeInt(s: String): Try[Int] = Try {\n    // 某些复杂的算法\n    s.toInt\n\
  }\n```\n\n最后，如果你熟悉 Scala，你会知道我展示的可能是 (a) `Try` 的构造函数，也可能是 (b) `apply` 方法。\n\n纯函数不能撒谎\
  \ (Pure functions)\n\n在继续之前，我所展示的 `Try` 的工作方式与 `Option` 是一样的。\n\n```scala\ndef makeInt(s:\
  \ String): Try[Int] =\n    try\n        Success(s.toInt)\n    catch\n        case\
  \ e: NumberFormatException => Failure(e)\n```\n\n所示，`Try` 和 `Option` 的用法是相同的。\n\n\
  # 21. FEH: Either\n\nScala 内置的最后一个错误处理类型是 `Either`。就像 `Option` 和 `Try` 一样，`Either`\
  \ 有两个子类型 —— `Left` 和 `Right` —— 这两组数据类型的比较如下：\n\n`Option <=> Either`\n`Some <=>\
  \ Right`\n`None <=> Left`\n\n所以基本上，你以前使用 `Option` 的地方现在都可以使用 `Either`。在以前使用 `Some`\
  \ 的地方你现在使用 `Right`，而用 `Left` 代替 `None`。\n\n但大区别在于，当发生错误时，`Left` 包含一个错误值。这有助于函数调用者理解函数内部发生了什么错误。正因如此，在处理\
  \ I/O 函数时，`Either` 通常比 `Option` 更有用。\n\n让我们来看看它是什么样的。\n\n## 使用 makeInt\n\n这是一个 `makeInt`\
  \ 的新版本，它使用 `Either` 而不是 `Option`：\n\n```scala\n// 你必须先导入这些类型：\nimport scala.util.{Try,\
  \ Success, Failure}\n\ndef makeInt(s: String): Either[String, Int] =\n    try\n\
  \        Right(s.toInt)\n    catch\n        case e: NumberFormatException => Left(e.getMessage)\n\
  ```\n\n现在当你调用 `makeInt` 时，你会在成功和失败的情况下看到这些结果：\n\n```scala\n// 成功情况\nmakeInt(\"1\"\
  )  // Right(1)\n// 失败情况\nmakeInt(\"one\") // Left(For input string: \"one\")\n```\n\
  \n所示：\n\n- 当转换成功时，你会得到一个 `Right`。`Right` 是包含 `Int` 的包装器。\n- 当过程失败时，你会得到一个 `Left`。`Left`\
  \ 包含了错误消息。\n\n作为函数的消费者，`Left` 情况现在变得有趣得多了，因为它告诉了我函数内部发生了什么错误。\n\n## 处理结果\n\n与 `Option`\
  \ 一样，你使用 `match` 表达式和 `for` 表达式来处理 `Either`。\n\n### 模式匹配 (pattern matching)\n\n\
  这是 `Either` 使用 `match` 表达式的形式：\n\n```scala\nmakeInt(aString) match\n    case Right(i)\
  \ => println(s\"Success: i = $i\")\n    case Left(e) => println(s\"Failed: msg =\
  \ $e\")\n```\n\n### for 表达式 (for expressions)\n\n这是 `Either` 在 `for` 表达式中使用多个*可以*转换为整数的字符串时的形式：\n\
  \n```scala\nval maybeSum: Either[String, Int] =\n    for\n        i <- makeInt(\"\
  1\")\n        j <- makeInt(\"2\")\n        k <- makeInt(\"3\")\n    yield\n    \
  \    i + j + k\n// 结果：  maybeSum == Right(6)\n```\n\n而当它们*不能*转换时，看起来是这样的：\n\n```scala\n\
  val maybeSum: Either[String, Int] =\n    for\n        i <- makeInt(\"1\")\n    \
  \    j <- makeInt(\"Hi mom!\")\n        k <- makeInt(\"3\")\n    yield\n       \
  \ i + j + k\n// 结果：\nmaybeSum == Left(For input string: \"Hi mom!\")\n```\n\n再次强调——就像\
  \ `Option` 一样——无论你从 `for` 表达式得到 `Right` 还是 `Left`，你都在 `match` 表达式中处理它的结果：\n\n```scala\n\
  maybeSum match\n    case Right(i) => println(s\"Success: i = $i\")\n    case Left(e)\
  \ => println(s\"Failed: msg = $e\")\n```\n\n所示，`Either` 和 `Option` 的用法是相同的。\n\n\
  ## 该内容的更短版本\n\n我稍后会展示如何用 `Option`、`Try` 和 `Either` 写出更多版本的 `makeInt`，但 `Try` 有点独特之处，你可以简单地将抛出异常的算法传递给\
  \ `Try` 的构造函数：\n\n```scala\nimport scala.util.{Try, Success, Failure}\ndef makeInt(s:\
  \ String): Try[Int] = Try(s.toInt)\n```\n\n因为 `Try` 返回你的代码可能抛出的异常，它的创建者意识到没有理由让你在函数体中写一个\
  \ `try/catch` 表达式。你只需要将抛出异常的代码封装在 `Try` 内部，如果抛出了该异常，它会为你捕获它并返回一个 `Failure`。\n\n\
  同样，如果你的抛出异常的算法需要多行代码，只需像这样写，在代码块周围使用大括号：\n\n```scala\nimport scala.util.{Try, Success,\
  \ Failure}\ndef makeInt(s: String): Try[Int] = Try {\n    // 某些复杂的算法\n    s.toInt\n\
  }\n```\n\n最后，如果你熟悉 Scala，你会知道我展示的可能是 (a) `Try` 的构造函数，也可能是 (b) `apply` 方法。\n\n纯函数不能撒谎\
  \ (Pure functions)\n\n在继续之前，我所展示的 `Try` 的工作方式与 `Option` 是一样的。\n\n```scala\ndef makeInt(s:\
  \ String): Try[Int] =\n    try\n        Success(s.toInt)\n    catch\n        case\
  \ e: NumberFormatException => Failure(e)\n```\n\n\n\n\n如注释所示，在这种情况下，`maybeSum` 的值为\
  \ `Right(6)`。这段代码展示了当一个或多个字符串无法转换为整数时，“异常路径”（Unhappy Path）是什么样的：\n\n```scala\nval\
  \ maybeSum: Either[Exception, Int] =\n    for\n        i <- makeInt(\"1\")\n   \
  \     j <- makeInt(\"Hi mom!\")\n        k <- makeInt(\"3\")\n    yield\n      \
  \  i + j + k\n// result:\nmaybeSum == Left(java.lang.NumberFormatException: For\
  \ input string: \"Hi mom!\")\n```\n\n在这里，`maybeSum` 是一个 `Left`，它包含了 `NumberFormatException`。\n\
  \n就像 `Option` 和 `Try` 一样，无论 `for` 表达式返回 `Right` 还是 `Left`，你都可以在 `match` 表达式中处理它的结果：\n\
  \n```scala\nmaybeSum match\n    case Right(i) => println(s\"Success: i = $i\")\n\
  \    case Left(e)  => println(s\"Failed: msg = ${e.getMessage}\")\n```\n\n注意，当你使用\
  \ `Either` 时，`Right` 和 `Left` 都是容器，分别包含成功值和错误值。\n\n### 读取 Either 签名\n\n在 `makeInt`\
  \ 函数的第二个版本中，返回值 `Either[Exception, Int]` 可以读为：“如果计算成功，我将得到一个封装在 `Right` 中的 `Int`；如果失败，我将会在\
  \ `Left` 中得到异常。” 两种可能返回类型的声明使得 `Either` 比 `Option` 和 `Try` 类型更灵活。\n\n### 两个技术要点\n\
  \n关于 [`Either` 数据类型](https://www.scala-lang.org/api/current/scala/util/Either.html)，至少有两个值得了解的技术要点。\n\
  \n首先，正如该 Scaladoc 页面所提到的，`Either` 代表两种可能类型之一的值，这在技术上被称为“不相交联合”（disjoint union）。\n\
  \n其次，`Either` 是**右偏置**的。Scaladoc 指出：“这意味着 `Right` 被假设为默认的操作情况。”当你像我展示的那样在 `match`\
  \ 和 `for` 表达式中使用 `Either` 时，这并不重要。但当你想要直接处理 `maybeSum` 时（例如对它调用 `map` 方法），这一点就很重要了。\n\
  \n关键在于，当你对 `maybeSum` 调用 `map` 且它是 `Left` 时，`map` 将返回原始不变的 `Left` 值，如 REPL 所示：\n\
  \n```scala\n// when maybeSum is a Left:\nscala> maybeSum.map(_ * 10)\nval res0:\
  \ Either[Exception, Int] =\n    Left(java.lang.NumberFormatException: For input\
  \ string: \"Hi mom!\")\n```\n\n相反，当 `maybeSum` 是 `Right` 时，`map` 和其他方法会按预期工作：\n\n\
  ```scala\n// when maybeSum is a Right:\nscala> maybeSum.map(_ * 10)\nval res1: Either[Exception,\
  \ Int] = Right(60)\n```\n\n### 纯函数不会撒谎\n\n我再次重申关于纯函数类型签名的这一点：它们不会撒谎。在这里所示，`makeInt`\
  \ 函数清晰地大喊道：“如果一切顺利，我将在 `Right` 位置给你一个 `Int`，但如果出错了问题，你将在 `Left` 中得到一个 `Exception`”：\n\
  \n```scala\ndef makeInt(s: String): Either[Exception, Int]\n                   \
  \  ----------------------\n```\n\n总结：每当你看到 `Either`、`Try` 或 `Option` 作为函数的返回值时，你就知道该函数内部可能会出错。\n\
  \n# 22. FEH: allCatch\n\n在我们离开这些错误处理课程并回到我们 `wc` 程序的变更请求之前，我想展示你如何更简洁地编写那些 `makeInt`\
  \ 函数。\n\n### 更简洁的 makeInt 函数\n\n你可以使用一个名为 `allCatch` 的 Scala 类型使我之前展示的大多数 `makeInt`\
  \ 函数更加简洁。直奔主题地，让 `makeInt` 短很多的解决方案如下：\n\n```scala\nimport scala.util.{Try, Success,\
  \ Failure}\n// allCatch 类型定义在这里:\nimport scala.util.control.Exception.allCatch\n\
  \n// Option\ndef makeInt(s: String): Option[Int] =\n    allCatch.opt(s.toInt)\n\n\
  // Either\ndef makeInt(s: String): Either[Throwable, Int] =\n    allCatch.either(s.toInt)\n\
  \n// Try (Version 1: 之前显示的方法（推荐）)\ndef makeInt(s: String): Try[Int] =\n    allCatch.withTry(s.toInt)\n\
  \n// Try (Version 2)\ndef makeInt(s: String): Try[Int] =\n    allCatch(s.toInt)\n\
  ```\n\n如 `import` 语句所示，`allCatch` 定义在 `scala.util.control` 包中。\n\n\n\n现在让我们来看这个新文件读取函数的体部。\n\
  \n### Try 解决方案\n\n同样，如果我们只关注 `Try` 解决方案——对于 I/O 相关的函数，我更倾向于使用它而不是 `Option`，因为我们在需要时可以看到异常——我将首先将这个新的顶层函数重名为\
  \ `wcFromFile`：\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
  \ Int]]\n```\n\n正如你可以想象的，你在这个函数内部做的第一件事就是调用一个读取文件的函数。到目前为止我知道我会给该函数传递文件名，它是一个 `String`：\n\
  \n```scala\ndef readFile(filename: String)\n```\n\n你还知道另外两点：\n\n*   我刚刚提到我倾向于在 I/O\
  \ 函数中使用 `Try`，所以这个函数应该返回 `Try`\n*   该函数需要返回它从该文件名读取的文档，而该文档是一个 `String`\n\n这两点使我们能够完成函数的类型签名：\n\
  \n```scala\ndef readFile(filename: String): Try[String]\n```\n\n现在我们已经知道了 `readFile`\
  \ 的样子，我们将它作为第一行添加到我们新的 `wcFromFile` 函数中：\n\n```scala\ndef wcFromFile(filename: String):\
  \ Try[VectorMap[String, Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n\
  \  ...\n```\n\n### 冗长的解决方案\n\n现在 `maybeDocument` 要么包含 (a) 文档的 `String` 版本，要么包含 (b)\
  \ 一个异常。处理 `maybeDocument` 的冗长方法是我之前在 `makeInt` 错误处理课程中使用的方法，使用 `match` 表达式：\n\n\
  ```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n  val\
  \ maybeDocument: Try[String] = readFile(filename)\n  maybeDocument match\n    case\
  \ Success(docAsString) => Success(wc(docAsString))   // [1]\n    case Failure(e)\
  \           => Failure(e)                // [2]\n```\n\n正如注释 1 所示，在 `Success` case，我将文档\
  \ (`docAsString`) 传递给旧的 `wc` 函数。如果你回头看那个函数，你会发现它的类型签名是 `VectorMap[String, Int]`。正如你现在所知，这意味着\
  \ `wc` 不可能失败。因为 `wcFromFile` 需要返回一个 `Try` 类型，我将这个 map 封装在 `Success` 类型中。\n\n然后在\
  \ `Failure` case 中（注释 2），我返回一个新的 `Failure` 实例，其中包含尝试读取文件时发生的异常。\n\n虽然这个解决方案有效，但它的问题在于我是从\
  \ `readFile` 获取了一个 `Try`，然后我将其解包为 `Success` 或 `Failure`，然后在 `match` 表达式中将其重新封装回这些类型。我可以做得更好。\n\
  \n### 更简洁的解决方案\n\n更简洁的解决方案是使用 `Success` 和 `Failure` 类型可用的 `map` 方法。`map` 的工作方式是，如果它作用于：\n\
  \n*   `Failure`，它返回异常\n*   `Success`，`map` 允许你以任何想要的方式对成功值进行操作\n\n所以，函数体的第一步仍然保持不变：\n\
  \n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n  val\
  \ maybeDocument: Try[String] = readFile(filename)\n  ...\n```\n\n之后，我用在 `maybeDocument`（这是一个\
  \ `Try`）上的 `map` 方法调用替换 `match` 表达式。在 `map` 内部，我将文档传递给 `wc` 函数：\n\n```scala\ndef\
  \ wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n  val maybeDocument:\
  \ Try[String] = readFile(filename)\n  maybeDocument.map(doc => wc(doc))\n```\n\n\
  该表达式的结果类型为 `Try[VectorMap[String, Int]]`，这与我们函数的返回类型匹配。\n\n如果你倾向不使用中间变量，可以更简洁地编写此解决方案，如下：\n\
  \n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]] =\n  readFile(filename).map(doc\
  \ => wc(doc))\n```\n\n或者这个，使用 Scala 匿名函数中的下划线快捷：\n\n```scala\ndef wcFromFile(filename:\
  \ String): Try[VectorMap[String, Int]] =\n  readFile(filename).map(wc(_))\n```\n\
  \n无论你喜欢哪种方法，这里的关键是 `Success` 和 `Failure` 都实现了 `map` 方法。\n\n同样，如果我们只关注 `Try` 解决方案——对于\
  \ I/O 相关的函数，我更倾向于使用它而不是 `Option`，因为我们在需要时可以看到异常——我将首先将这个新的顶层函数重名为 `wcFromFile`：\n\
  \n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String, Int]]\n```\n\
  \n正如你可以想象的，你在这个函数内部做的第一件事就是调用一个读取文件的函数。到目前为止我知道我会给该函数传递文件名，它是一个 `String`：\n\n```scala\n\
  def readFile(filename: String)\n```\n\n你还知道另外两点：\n\n*   我刚刚提到我倾向于在 I/O 函数中使用 `Try`，所以这个函数应该返回\
  \ `Try`\n*   该函数需要返回它从该文件名读取的文档，而该文档是一个 `String`\n\n这两点使我们能够完成函数的类型签名：\n\n```scala\n\
  def readFile(filename: String): Try[String]\n```\n\n现在我们已经知道了 `readFile` 的样子，我们将它作为第一行添加到我们新的\
  \ `wcFromFile` 函数中：\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
  \ Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n  ...\n```\n\n\
  ### Either 解决方案\n\n由于 `Either` 也是 I/O 函数的一个很好的解决方案，让我们看看它是如何工作的。首先，它的签名如下：\n\n```scala\n\
  def readFile(filename: String): Either[Throwable, String]\n```\n\n接下来，它的顶层函数如下：\n\
  \n```scala\ndef wcFromFile(filename: String): Either[VectorMap[String, Int]]\n```\n\
  \n最后，它的体如下：\n\n```scala\ndef wcFromFile(filename: String): Either[VectorMap[String,\
  \ Int]] =\n  val maybeDocument: Try[String] = readFile(filename)\n  maybeDocument.map(doc\
  \ => wc(doc))\n```\n\n### 最后一点点\n\n我之前展示过这个，所以我简单提一下：\n\n```scala\ndef wcFromFile(filename:\
  \ String): Try[VectorMap[String, Int]]\n```\n\n```scala\ndef readFile(filename:\
  \ String): Try[String]\n```\n\n```scala\ndef wcFromFile(filename: String): Try[VectorMap[String,\
  \ Int]]\n```\n\n```scala\ndef wcFromFile(filename: String): Either[VectorMap[String,\
  \ Int]]\n```\n\n\n\n\n基于上述背景，这里与 TDL 的简单交互如下：我使用 `a` 命令添加了两个任务，然后使用 `d` 命令删除了第一个：\n\
  \n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo: a wake up`\n\n`1. wake up`\n\n\
  `(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo: a brush teeth`\n\n`1. wake up`\n\
  `2. brush teeth`\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo: a make coffee`\n\
  \n`1. wake up`\n`2. brush teeth`\n\n`(Commands: a \"task\", d 1, v, q, h)`\n\n`Yo:\
  \ d 1`\n\n`1. brush teeth`\n\n这就是该应用的工作方式。\n\n## 编写编写的规则\n\n为了编写 TDL 应用，我将使用到本书为止为止遵循的相同规则。它将使用：\n\
  \n* 不变变量\n* 不可变数据结构\n* 纯函数\n* 表达式导向编程\n* 函数式错误处理\n\n我还会添加这条规则：\n\n* 任何与外部世界交互的函数必须返回一个\
  \ `Try` 值\n\n我在“字数计数”示例从文件中读取文档时用过这种技术，但现在这是一条硬性规定。\n\n## 扁文件数据库\n\n我最初开始使用 SQL\
  \ 数据库和 Scala 数据库库来创建此应用。然而，当我深入研究 Scala 数据库库时，我发现它们几乎都直接进入了函数式编程（FP）概念。由于我们仍在逐步构建这些概念，我决定不使用那种方法。\n\
  \n相反，此应用程序将使用“扁文件数据库”。这并不是一个真正的数据库，只是一个文件。对于 TDL 应用，它将包含一个分行的“待办”事项列表，如下：\n\n```\n\
  Wake up\nMake the coffee\nBrush my teeth\nTake a shower\n```\n\n然而，如果你对扁文件数据库的高级用法感兴趣，一种常见的方法是使用字段分隔符（如符号）来分隔文件中的字段。当你这样做时，你的行看起来像这样：\n\
  \n```\n|Alvin|Alexander|Talkeetna\n|Fred|Flintstone|Bedrock\n|Mary|Bailey|Bedford\
  \ Falls\n```\n\n因此，我们将在接下来的章节中编写此数据库代码，这样做的好处是，你将在应用程序边界使用 `Try` 与外部世界通信，并了解它是如何与代码的其他部分协作的。\n\
  \n# 26 TDL：Database 类\n\n当我思考 TDL 的 `main` 方法如何启动时，我认为它首先需要执行的操作是创建一个 `Database`\
  \ 类的实例：\n\n```\n@main\ndef ToDoList =\n    val db = Database(\"./ToDoList.dat\"\
  )\n    ...\n```\n\n在代码代码中，我向 `Database` 传递了它应该作为扁文件数据库的文件名。这立即告诉我，我需要一个接受文件名输入参数的\
  \ `Database` 类：\n\n```scala\nclass Database(val dbFilename: String):\n    // 方法在此\
  \ ...\nend Database\n```\n\n正如你将在后续课程中看到的，我们将在类内部定义这些函数，以模拟 SQL 函数的工作方式：\n\n* `insert`\n\
  * `delete`\n* `selectAll`\n\n> 注意：编写这段代码与编写 OOP 代码相同，即你有一个接收构造函数参数（`dbFilename`）的类，然后该类中的方法使用该参数。唯一的区别是我不会修改该参数，因此，如所示，我定义它为\
  \ `val` 参数。\n\n## 关于 ‘Try’ 规则\n\n回想我的规则：任何连接到外部世界的函数必须返回 `Try` 错误处理类型。对于扁文件数据库来说这有些过度设计了，但如果你能记住真实的数据库代码通常会访问另一个服务器（或集群），该服务器在你调用时可能运行也可能不运行，这就有帮助。这就像跨越可能可用也不可用的网络调用\
  \ REST API 一样。\n\n在这些情况下，健壮的代码必须返回像 `Try` 或 `Either` 的错误处理类型，对于我们的目的，我将使用 `Try`。\n\
  \n## 这如何影响 Database\n\n根据这条规则，我勾勒了 `Database` 类，具有以下类型签名的方法：\n\n```scala\nclass\
  \ Database(dbFilename: String):\n    def insert(record: String): Try[Unit] = ???\n\
  \    def selectAll(): Try[Seq[String]] = ???\n    def delete(indexToDelete: Int):\
  \ Try[Int] = ???\nend Database\n```\n\n我将在后续章节中解释这些代码，简而言之：\n\n* `insert` 返回 `Try[Unit]`，其\
  \ `Success` 和 `Failure` 结果告诉我们它是否执行成功\n* `selectAll` 返回 `Try[Seq[String]]`，它是 `Try`\
  \ 内部的字符串列表。\n* `delete` 返回 `Try[Int]`，其 `Int` 值表示删除的数量。\n\n在所有情况下，如果服务器宕机，我们会得到\
  \ `Failure`。如果服务器正常，我们会得到 `Success`。\n\n## 方法 vs 函数\n\n最后的说明：\n\n* 当你在类内部定义时，我称之为方法（methods）。\n\
  * 在任何其他地方，我称之为函数（functions）。\n\n# 27 TDL：Database 类\n\n快速提醒一下，在接的课程中，我们将创建一个这样的结构：\n\
  \n```scala\nclass Database(dbFilename: String):\n    def insert = ???\n    def selectAll\
  \ = ???\n    def delete = ???\nend Database\n```\n\n## insert\n\n我们需要第一个 `Database`\
  \ 函数是 `insert` 函数。因为这是一个扁文件数据库，该函数将向数据库添加一条记录。因此，我知道它接受一个字符串作为输入，并开始这样勾勒 `insert`\
  \ 函数：\n\n```scala\ndef insert(record: String)\n```\n\n接下来 —— 因为我已经经历了这个过程 —— 我知道我想让这个函数使用\
  \ `writeToFile` 来执行写入。我知道是因为我在后续课程中编写的 `delete` 和 `update` 函数要求我读取整个文件然后重写。所以 `writeToFile`\
  \ 需要能够 (a) 追加文件和 (b) 完全覆盖文件。\n\n因此，让我们暂时忘记 `insert` 函数，先处理 `writeToFile` 函数。\n\n\
  ## writeToFile\n\n`writeToFile` 将是 `Database` 类内部的另一个函数，由于 `Database` 外部不需要访问它，我首先将其设私有：\n\
  \n```scala\nprivate def writeToFile\n```\n\n接下来，因为我知道 `delete` 和 `update` 要求我完全重写文件，我定义它接受一个字符串列表，在\
  \ Scala 中最泛义的形式是 `Seq[String]`：\n\n```scala\nprivate def writeToFile(lines: Seq[String])\n\
  ```\n\n我还知道在调用此函数时想设置一个布尔 `append` 标志。这让我声明我是要覆盖文件还是追加文件：\n\n```scala\nprivate def\
  \ writeToFile(lines: Seq[String], append: Boolean)\n```\n\n现在最后需要考虑的是它的返回类型。正如我在规则中提到的，任何与外部世界通信的函数必须返回一个\
  \ `Try` 值，所以这得到了：\n\n```scala\nprivate def writeToFile(lines: Seq[String], append:\
  \ Boolean): Try[\n```\n\n现在唯一的问题是，“`Try` 内部的成功值应该是什么？”\n\n\n\n\n由于我在写文件时不需要返回任何数据——我只需要一个\
  \ `Success`（成功）或 `Failure`（失败）来判断操作是否成功——所以这个类型可以是 `Unit`。（如前所述，这意味着我不在乎返回类型。）因此，我这样完成函数签名：\n\
  \n```scala\nprivate def writeToFile(lines: Seq[String], append: Boolean): Try[Unit]\
  \ =\n```\n\n### 实现 writeToFile\n\n接下来，我将要做一些有争议的事情，并违反了我的两个规则：我将使用一个 `var` 字段和 `null`\
  \ 值。然而，我**仅**这样做是因为：\n\n*   我怀疑正在读这本书的许多人对 Java 和 Kotlin 等语言很熟悉，因此他们会使用 Java 的类和方法来写入文件。\n\
  *   更正确的解决方案需要额外的一些 Scala 知识，而我还不想深入介绍这部分。（我会在附录的 `Using` 课程中分享这个更正确的解决方案。）\n\n\
  因此，由于这是使用 `java.io.*` 类的 Java/OOP 代码，我像这里所示编写了函数体，并用注释描述了重要部分：\n\n```scala\nimport\
  \ java.io.*\nimport scala.util.{Try, Success, Failure}\n\n/**\n * 注意 `dbFilename`\
  \ 是通过侧门传入的。\n */\nprivate def writeToFile(lines: Seq[String], append: Boolean):\
  \ Try[Unit] =\n  // 我在 'try' 块之前创建这个变量，是因为我需要在\n  // 'finally' 块中访问它：\n  var bw:\
  \ BufferedWriter = null\n  try\n      // 这基本上是用于创建 BufferedWriter \n      // 的标准\
  \ Java 代码：\n      bw = BufferedWriter(FileWriter(File(dbFilename), append))\n  \
  \    // 在这里我遍历 'lines' 中的每一个 String，并将每个\n      // String（一次一个）写入文件。每个 String\n\
  \      // 后面都紧跟着一个换行符：\n      for line <- lines do bw.write(s\"$line\\n\")\n   \
  \   // 如果之前的代码没有抛出异常，流\n      // 将来到这里，我们将返回这个 Success：\n      Success(true)\n \
  \ catch\n      // 如果之前的代码确实抛出了异常，控制\n      // 将来到这里，我们将返回一个 Failure：\n      case\
  \ e: Throwable => Failure(e)\n  finally\n      // 'finally' 块总是执行，所以这里是\n      //\
  \ 释放/关闭我们打开的地方。注意你需要\n      // 检查 'bw' 是否为 null，因为之前的代码\n      // 可能在 'bw' 绑定到 BufferedWriter\
  \ 之前就崩溃了：\n      if bw != null then bw.close\n```\n\n我在里面添加了很多注释来解释这些代码是如何工作的。这样你就可以更轻松地阅读该函数了，这里是不带那些注释的重复版本：\n\
  \n```scala\nprivate def writeToFile(lines: Seq[String], append: Boolean): Try[Unit]\
  \ =\n  var bw: BufferedWriter = null\n  try\n      bw = BufferedWriter(FileWriter(File(dbFilename),\
  \ append))\n      for line <- lines do bw.write(s\"$line\\n\")\n      Success(true)\n\
  \  catch\n      case e: Throwable => Failure(e)\n  finally\n      if bw != null\
  \ then bw.close\n```\n\n再次，这是一个解决该问题的非常 Java/OOP 的解决方案，如果你想看 Scala 的解决方案，请参阅附录中的\
  \ `Using` 课程。\n\n### 回到 insert 函数\n\n现在我有了 `writeToFile` 函数，我需要做的就是完成 `insert` 函数。我已经勾勒了这部分的草稿：\n\
  \n```scala\ndef insert(record: String)\n```\n\n现在我想调用 `writeToFile`，我知道 `insert`\
  \ 的函数体应该像这样：\n\n```scala\ndef insert(record: String) ...\n  writeToFile(List(record),\
  \ true)\n```\n\n在该代码中，我将接收到的 `String` 包装在 `List` 中，因为 `writeToFile` 期望接收一个 `Seq[String]`。因为我知道\
  \ `writeToFile` 返回一个 `Try[Unit]`，而且我也想让 `insert` 返回一个 `Try`，所以我也将它作为该函数的返回类型：\n\n\
  ```scala\ndef insert(record: String): Try[Unit] =\n  writeToFile(List(record), true)\n\
  ```\n\n这就完成了 `insert` 函数。\n\n# 28. TDL：selectAll 数据库函数\n\n接下来，`selectAll` 函数基本上是一个“读取文本文件”函数，所以它的工作方式与\
  \ `insert` 函数非常相似，只是我们将读取而不是写入。由于代码与上一节相似，我会快一点过这里。\n\n首先，我们知道我们需要一个 `selectAll`\
  \ 函数，它需要返回一个 `Try`：\n\n```scala\ndef selectAll(): Try\n```\n\n因为该函数返回文件中的所有行，这意味着成功值是一个\
  \ `Seq[String]`：\n\n```scala\ndef selectAll(): Try[Seq[String]]\n```\n\n在上一节中我创建了一个\
  \ `writeToFile` 函数，但在这一节中这没有必要，所以我将把读取文件的代码直接添加到 `selectAll` 中。从概念上讲，这段代码与上一节相同，只是我们是在读取而不是写入：\n\
  \n```scala\n/**\n * 注意 `dbFilename` 是通过侧门传入的。\n */\ndef selectAll(): Try[Seq[String]]\
  \ =\n  var bufferedSource: scala.io.BufferedSource = null\n  try\n      bufferedSource\
  \ = Source.fromFile(dbFilename)\n      val lines = for line <- bufferedSource.getLines\
  \ yield line\n      Success(lines.toList)\n  catch\n      case t: Throwable => Failure(t)\n\
  \  finally\n      if bufferedSource != null then bufferedSource.close\n```\n\n>\
  \ 再次，这段代码是用 OOP 编写的，你可以查看附录中的“Using”课程。\n\n我测试了这个函数，在 `Success` 情况下它返回如下：\n\n`Success(List(\"\
  a\", \"b\", \"c\", \"d\"))`\n\n在 `Failure` 情况下它返回：\n\n`Failure(java.io.FileNotFoundException:\
  \ No such file or directory)`\n\n现在我们有了 `insert` 和 `selectAll` 函数。我可以开始处理 UI 了，但为了完整，我们在切换到\
  \ UI 之前写一个 `delete` 函数。\n\n# 29. TDL：delete 函数\n\n当你思考时，`delete` 函数应该接收 (a) 用户想要删除的任务字符串，或者\
  \ (b) 一个应该被删除的索引（行号）。两种方法都可以，但在处理了一段时间 UI 后，我决定采用索引的方法，所以我分享这种。\n\n## delete\n\n\
  到为止我们知道我们需要一个接收索引的 `delete` 函数，所以我们：\n\n```scala\ndef delete(indexToDelete: Int)\n\
  ```\n\n我们也知道因为它访问了外部世界，它应该返回一个 `Try`，所以我加上它：\n\n```scala\ndef delete(indexToDelete:\
  \ Int): Try\n```\n\n最后，因为 SQL `delete` 查询返回被删除的行数，我们将同样这样做，在 `Try` 中返回该计数：\n\n```scala\n\
  def delete(indexToDelete: Int): Try[Int] =\n```\n\n技术上我们只允许用户一次删除一个任务，所以这个信息并不特别有用。但是，如果你想更改应用程序让用户一次删除多个任务，这个值将会变得有用。\n\
  \n### 编写函数体\n\n在写了之前的函数后，我知道函数体应该像这样工作：\n\n*   将整个纯文本数据库读取到字符串列表中\n*   从该列表中删除匹配的字符串（使用索引值）\n\
  *   将剩余列表写回文件（覆盖文件而不是追加）\n\n有几种方法可以实现这一点，但一种方法是使用 `for` 表达式。因为我还没有怎么展示过它们，所以我在这里使用这种方法。在这种情况下，我将分享完整的解决方案，然后描述它是如何工作的：\n\
  \n```scala\ndef delete(indexToDelete: Int): Try[Int] =\n  val maybeNumRowsDeleted\
  \ = for\n      rows <- selectAll()\n```\n\n\n\n\n```\nnewRows = CollectionUtils.removeElementByIndex(rows,\
  \ indexToDelete)\nnumRowsDeleted = rows.size - newRows.size\n_ <- writeToFile(newRows,\
  \ false)\nyield\nnumRowsDeleted\nmaybeNumRowsDeleted\n```\n\n如果你以前没见过这种代码 —— 担心！我会向你解释它的工作原理。\n\
  \n暂时不考虑函数签名，代码从将一个 `for` 表达式的结果赋值给变量开始：\n\n```scala\nval maybeNumRowsDeleted = for\n\
  ```\n\n我知道这个 `for` 表达式返回的是 `Try[Int]` 类型，所以我也可以在这里显式地声明它：\n\n```scala\nval maybeNumRowsDeleted:\
  \ Try[Int] = for\n                          --------\n```\n\n不过，在接下来的示例中我将省略它。\n\
  \n### 作为一个 for 表达式的主体\n\n正如在 `for` 表达式的课程中提到的，`for` 表达式总是以*生成器*（generator）开始，在我们的案例中，`selectAll`\
  \ 函数充当了该生成器：\n\n```scala\nval maybeNumRowsDeleted = for\n  // 从生成器开始：\n  rows  \
  \         <- selectAll()\n```\n\n回想 `selectAll` 返回一个 `Try[Seq[String]]`，所以此时会发生两种情况之一：\n\
  \n*   该 `Try` 是 `Failure`，那么 `for` 表达式在这里停止，`maybeNumRowsDeleted` 将拥有该 `Failure`\
  \ 值。\n*   `Try` 是 `Success`，那么变量 `rows` 就是一个 `Seq[String]`。\n\n对于 `Failure` 情况，我们无能为力，它已经为我们处理好了，所以我们假设接收到了\
  \ `Success` 并继续编写代码，沿着顺利路径（happy path）继续下去。\n\n我接下来想做的是根据索引值删除该 `Seq[String]` 中的元素。（回想一下，这个函数会将索引传给我们。）所以现在我在\
  \ `for` 表达式内部做的是从 `rows` 中移除该元素。这个过程产生了一个新的 `Seq[String]`，我将其命名为 `newRows`：\n\n\
  ```scala\nval maybeNumRowsDeleted = for\n  rows           <- selectAll()\n  // 使用其索引值删除所选的行：\n\
  \  newRows        = CollectionUtils.removeElementByIndex(rows, indexToDelete)\n\
  ```\n\n如果我的需求不同，我*可以*直接将 `newRows` 写回数据库文件，然后就结束了。但我的需求是需要返回被删除的行数。简单的方法是从 `rows`\
  \ 的大小减去 `newRows` 的大小。理论上 —— 因为这个函数只接受一个索引值，`newRows` 应该总是少一行 —— 但如果该索引出现问题，结果可能是\
  \ `0` 而不是 `1`。\n\n回到 `for` 表达式，我添加了一个表达式来计算实际删除的行数：\n\n```scala\nval maybeNumRowsDeleted\
  \ = for\n  rows           <- selectAll()\n  newRows        = CollectionUtils.removeElementByIndex(rows,\
  \ indexToDelete)\n  // 计算删除的行数：\n  numRowsDeleted = rows.size - newRows.size\n```\n\
  \n最后，我可以将 `newRows` 写入数据库文件。记住 `writeToFile` 返回一个 `Try`，因此在实际代码中，你需要注意这个结果。但对于这个\
  \ `for` 表达式来说，我认为展示如果你*不在乎 for 表达式内部表达式的返回值*时该做什么会更有趣，所以我写了这些：\n\n```scala\n  _\
  \              <- writeToFile(newRows, false)\n```\n\n该表达式左侧的下划线字符是 Scala 的写法，表示在\
  \ `for` 表达式内部，“我不在乎这个结果，所以你可以直接丢弃它。”同样，在现实世界中，你会对那个 `Try` 更感兴趣，但我想展示这种技术。\n\n当我添加这些内容后，`for`\
  \ 表达式现在看起来像这样：\n\n```scala\nval maybeNumRowsDeleted = for\n  rows           <- selectAll()\n\
  \  newRows        = CollectionUtils.removeElementByIndex(rows, indexToDelete)\n\
  \  numRowsDeleted = rows.size - newRows.size\n  // 忽略结果：\n  _              <- writeToFile(newRows,\
  \ false)\n```\n\n最后，因为我们的 `delete` 函数需要返回被删除的行数，我们从 `for` 表达式中*yield* 该值，并绑定到变量\
  \ `maybeNumRowsDeleted`：\n\n```scala\nval maybeNumRowsDeleted = for\n  rows    \
  \       <- selectAll()\n  newRows        = CollectionUtils.removeElementByIndex(rows,\
  \ indexToDelete)\n  numRowsDeleted = rows.size - newRows.size\n  _             \
  \ <- writeToFile(newRows, false)\n  // yield 行数计数：\n  yield\n  numRowsDeleted\n\
  ```\n\n注意，如果你愿意，你也可以这样显式地声明 `maybeNumRowsDeleted` 的类型：\n\n```scala\nval maybeNumRowsDeleted:\
  \ Try[Int] = for ...\n                          --------\n```\n\n我发现现代 IDE 会为你显示该类型，所以这在代码中不是必须的。但当你从书中阅读这段代码时，看到该类型可能会更有帮助。\n\
  \n在此之后 —— 在 `delete` 函数的最后一行 —— 我返回这个计数：`maybeNumRowsDeleted`\n\n从技术上讲，不需要 `maybeNumRowsDeleted`\
  \ 变量。如果你想*不使用*它，可以直接返回 `for` 表达式的结果，如下：\n\n```scala\ndef delete(indexToDelete: Int):\
  \ Try[Int] =\n  for\n    rows           <- selectAll()\n    newRows        = CollectionUtils.removeElementByIndex(rows,\
  \ indexToDelete)\n    numRowsDeleted = rows.size - newRows.size\n    _         \
  \     <- writeToFile(newRows, false)\n  yield\n  numRowsDeleted\n```\n\n这就是 `delete`\
  \ 函数。\n\n### Note\n\n如果你想看 `removeByIndex` 函数是如何实现的，请参见 `CollectionUtils` 对象中的“泛型”章节。\n\
  \n# 30. TDL UI: 提示用户\n\n现在我已经展示了程序的*内部* —— 即读取和写入数据库文件的函数 —— 我将切换视角，查看函数的*外部*：即与用户交互的\
  \ UI 代码。\n\n在代码中，我们将继续遵循任何与外部世界交互的函数必须返回 `Try` 的规则。对于数据库代码，这种方法很有帮助，这里也是如此：你可以想象我们正在编写\
  \ REST API 并从远程源获取输入。\n\n> 注意：我曾想创建一个 REST 示例，但这引入了许多与我们主要目标无关的内容。所以我使用了下面的“命令行\
  \ UI”方法，以便在处理返回 `Try` 值的函数时保持简单。\n\n## 我们的 main 函数\n\n正如我之前提到的，TDL 的 `main` 方法如下：\n\
  \n```scala\n@main\ndef ToDoList() =\n```\n\n并将该代码保存为 `ToDoList.scala` 文件。之后，我添加对\
  \ `Database` 类的调用：\n\n```scala\n@main\ndef ToDoList() =\n  val db = Database(\"\
  ./ToDoList.dat\")\n```\n\n现在应用程序需要的下一件事是提示用户输入。所以我们需要一个 `promptUser` 函数。\n\n###\
  \ promptUser\n\n由于 `promptUser` 扩展到了外部世界，它需要返回一个 `Try`。但由于向 STDOUT 打印几个字符串实际上不会失败（除非你的电脑出了严重问题），我不会使用\
  \ `try`/`catch`/`finally` 结构。\n\n相反，我将使用之前展示过的 `Try` 快捷方法，你只需将代码块传递给 `Try` 的构造函数即可。包含必要的\
  \ `import` 语句，该代码如下：\n\n```scala\nimport scala.io.StdIn\nimport scala.util.{Try,\
  \ Success, Failure}\n\ndef promptUser(): Try[Unit] = Try {\n```\n\n\n\n\n```scala\n\
  println(\"\\n(Commands: a \\\"task\\\", d 1, u 1, h, q, v)\")\nprint(\"Yo: \")\n\
  }\n```\n\n在上述代码中：\n\n- `promptUser` 函数需要所示的两个 `import`语句\n- `promptUser` 不需要任何输入参数\n\
  - 根据规则，它需要返回一个 `Try`\n- 因为它实际上不会失败，我声明它在 `Try` 内部返回 `Unit`\n- 开头的 `Try {...` 代码告诉我们，后续的代码将将传递给\
  \ `Try` 的构造函数\n- 在该代码块中，我通过 `println` 调用来提示用户，随后是一个 `print` 调用\n- 我在第二行使用 `print`\
  \ 是因为它不会在字符串后添加换行符；这样用户的提示符就会和字符串保持在同一行\n\n## 组织代码\n\n这就是提示用户输入所需的所有内容。然而，由于我知道我还需要其他几个与\
  \ I/O（输入/输出）相关的函数，我想将这些代码从我的主文件中提取出来。由于这些函数都与 I/O 有关，让我们创建一个名为 `IOHelper.scala`\
  \ 的新文件。然后我们在其中创建一个 `IOHelper` 对象，该对象将包含我的函数：\n\n```scala\nimport scala.io.StdIn\n\
  import scala.util.{Try, Success, Failure}\n\nobject IOHelper:\n  def promptUser():\
  \ Try[Unit] = Try {\n      println(\"\\n(Commands: a \\\"task\\\", d 1, u 1, h,\
  \ q, v)\")\n      print(\"Yo: \")\n  }\nend IOHelper\n```\n\n## 返回主程序\n\n现在我可以回到\
  \ `ToDoList.scala` 文件并将这段代码放入其中：\n\n```scala\nimport IOHelper.*\n@main def ToDoList()\
  \ =\n    val db = Database(\"./ToDoList.dat\")\n    promptUser()\n```\n\n此时，我忽略了\
  \ `promptUser` 返回 `Try` 的事实，但我很快会回到这个问题。在此之前，让我们写一个函数来读取用户的输入。\n\n# 31. TDL UI:\
  \ 读取输入\n\n要从用户处读取输入，我们使用 `scala.io.StdIn` 数据类型中的 `readLine` 函数。同样——假设我们正在 REST 服务中读取输入——我们知道想要返回一个\
  \ `Try`：\n\n```scala\ndef readInput(): Try\n```\n\n因为 `readLine` 返回一个 `String`，所以函数返回\
  \ `Try[String]`，完整的函数看起来如下：\n\n```scala\ndef readInput(): Try[String] = Try {\n\
  \    StdIn.readLine()\n}\n```\n\n现在我将此函数添加到 `IOHelper` 对象中：\n\n```scala\nimport\
  \ scala.io.StdIn\nimport scala.util.{Try, Success, Failure}\n\nobject IOHelper:\n\
  \  def promptUser(): Try[Unit] = Try {\n      println(\"\\n(Commands: a \\\"task\\\
  \", d 1, u 1, h, q, v)\")\n      print(\"Yo: \")\n  }\n  def readInput(): Try[String]\
  \ = Try {\n      StdIn.readLine()\n  }\nend IOHelper\n```\n\n此时，如果我只是想提示用户一次然后读取他们的输入，我可以将\
  \ `readInput` 添加到我的主方法中，所示：\n\n```scala\nimport IOHelper.*\n@main def ToDoList()\
  \ =\n    val db = Database(\"./ToDoList.dat\")\n    promptUser()\n    val input:\
  \ Try[String] = readInput()\n```\n\n之后，我会处理 `input` 值，最可能是在 `match` 表达式中处理。\n\n\
  *然而*，这并不是我想要的。我真正想要在某种循环内部不断提示用户。但首先，在我们还在这个区域附近时，让我们再写一个 I/O 函数。\n\n# 32. TDL UI:\
  \ 显示帮助\n\n我们在这个区域附近时我想写的另一个函数是“帮助”函数。它与 `promptUser` 类似，因为它只是打印到标准输出（STDOUT），所以我遵循相同的配方：\n\
  \n- 它是一个返回 `Try[Unit]` 的函数\n- 我使用 `Try` 的构造函数创建函数（将 `println` 放入 `Try{...}` 中。）\n\
  \n以下是 `IOHelper` 对象中新的 `showHelp` 函数：\n\n```scala\nimport scala.io.StdIn\nimport\
  \ scala.util.{Try, Success, Failure}\n\nobject IOHelper:\n  def promptUser(): Try[Unit]\
  \ = Try {\n      println(\"\\n(Commands: a \\\"task\\\", d 1, u 1, h, q, v)\")\n\
  \      print(\"Yo: \")\n  }\n  def readInput(): Try[String] = Try {\n      StdIn.readLine()\n\
  \  }\n  def showHelp(): Try[Unit] = Try {\n      val text = \"\"\"\n|Possible commands\n\
  |----------------\n|a <task>   - add a-do item\n|h         - show this text\n|d\
  \ [task number] - delete a task by its number\n|v         - view the list of tasks\n\
  |q         - quit\n\"\"\".stripMargin.trim\n      println(text)\n  }\nend IOHelper\n\
  ```\n\n## 多行字符串\n\n此函数中的新变化是它使用了多行 `String`。使用三引号创建多行字符串，所示：\n\n```\n|Possible commands\n\
  |----------------\n|a <task>   - add a-do item\n|h         - show this text\n|d\
  \ [task number] - delete a task by its number\n|v         - view the list of tasks\n\
  |q         - quit\n```\n\n通过 `stripMargin` 和 `trim` 将它变成：\n\n```\nPossible commands\n\
  ----------------\na <task>   - add a-do item\nh         - show this text\nd [task\
  \ number] - delete a task by its number\nv         - view the list of tasks\nq \
  \        - quit\n```\n\n\n\n\n第一个关键点是每个 `for` 循环都从一个生成器（generator）开始。`generator`\
  \ 是数据源，例如列表或流。最简单的生成器如下：\n\n```scala\nfor i <- 1 to 3 do println(i)    // 第 1 个示例\n\
  val xs = List(1, 2, 3)           // 第 2 个示例\nfor x <- xs do println(x)\n```\n\n\
  这些是 `for` 循环。它们被称为循环（loops）而不是表达式（expressions），因为它们是为了某些副作用（在本例中是打印）而对这些值进行循环操作。\n\
  \n相反，`for`/`yield` 组合被称为表达式（expressions），因为它们会 `yield`（产生）一个值，而你通常会将该值赋值给变量：\n\n\
  ```scala\nval xs = List(1, 2, 3)\nval ys = for x <- xs yield x * 2\n```\n\n你经常使用\
  \ `for`/`yield` 表达式来写一个函数：\n\n```scala\ndef double(xs: List[Int]): List[Int] =\n\
  \     for x <- xs yield x * 2\n```\n\n当你刚接触这种语法时，这种风格可能更易读：\n\n```scala\ndef double(xs:\
  \ List[Int]): List[Int] =\n     for\n          x <- xs\n     yield\n          x\
  \ * 2\n```\n\n## 多个生成器\n\n`for` 循环和表达式可以根据你的算法需要任意数量的生成器：\n\n```scala\nval rez =\n\
  \     for\n          i <- 1 to 2\n          j <- 3 to 4\n          k <- 5 to 6\n\
  \     yield\n          i + j + k\n// rez: Vector(9, 10, 10, 11, 10, 11, 11, 12)\n\
  ```\n\n如注释所示，这个 `for` 表达式的结果是一个包含所示整数列表的 `Vector`。（`Vector` 是一种特定类型的序列（`Seq`），它是它是不可变的，并且在许多不同情况下通常具有非常性能。）\n\
  \n## 守卫（Guards）\n\n`Guards` 基本上是你添加到 `for` 循环和表达式第一部分的 `if` 条件，它们看起来如下：\n\n```scala\n\
  val newValues =\n     for\n          i <- 1 to 5\n          j <- 6 to 10\n     \
  \     if i > 3\n          if j < 7\n     yield\n          i + j\n// newValues: Vector(10,\
  \ 11)\n```\n\n如所示，你可以根据算法需要添加任意数量的生成器和守卫。\n\n> 正如我在其他书书中提到的，Scala 的 `for` 语法的好处在于它将你的生成器和守卫（在第一部分）与你的业务逻辑（在第二部分，在\
  \ `do` 和 `yield` 关键字之后）隔离开来。\n\n# 35. JIT: 代码块（闭包）\n\n在进入下一个 TDL 课程之前，我需要介绍一个 Scala\
  \ 语言特性，我称之为 `code blocks`（代码块）或 `blocks of code`（代码段）。我在其他语言中见过这种特征可以被称为 `closure`（闭包，但我认为该术语有多种定义）。\n\
  \n简而言之，你在 Scala 中使用大括号创建一个代码块，如下：\n\n```scala\nval a = {\n     // 一块代码\n     println(\"\
  hi mom\")\n     42\n}\n```\n\n代码块的结果是它的最终值。在这个示例中，该值是整数 `42`，所以如果你想显式声明 `a` 的类型，它是\
  \ `Int`：\n\n```scala\nval a: Int = {        // <== 显式设置类型\n     // 一块代码\n     println(\"\
  hi mom\")\n     42\n}\n```\n\n注意，任何合法的 Scala 代码都可以放在该代码块中，例如打印到 STDOUT 的副作用。但从 Scala\
  \ 的角度来看，它的返回类型是 `Int`。\n\n你可以在 Scala REPL 中通过将代码块传递给 `:type` 命令来亲自演示这一点：\n\n```scala\n\
  scala> :type { println(\"hi\"); 42 }\nInt\nscala> :type { println(\"hi\"); \"dude\"\
  \ }\nString\n```\n\n再次注意，代码块的 `type` 是它返回的最后一个值。而且如果这个最后一个值是产生 `Unit` 的东西，那么这就是该块的类型：\n\
  \n```scala\nscala> :type { val a = 7; println(\"hi\") }\nUnit\n```\n\n在我们准备下一节课时，意识到代码块是你需要的一点。\n\
  \n# 36. JIT: 递归\n\n在下一节课之前，你必须具备意识的另一种编程技术是 `recursion`（递归）。递归非常有趣，而且是一项重要的 FP 技术，因此我在\
  \ [Functional Programming Simplified](https://alvinalander.com/functional-programming-simplified)\
  \ 中花了 50 多页来解释它。\n\n## 编写递归函数\n\n简而言之，递归函数是调用自身的函数。为了演示这一点，让我们创建一个“计数到” `0` 的递归函数。想法是给它一个整数，它会一直打印到\
  \ `0`，如 REPL 所示：\n\n```scala\nscala> countdown(3)\n3\n2\n1\n```\n\n你立刻可以看到这个函数接受一个\
  \ `Int` 参数：\n\n```scala\ndef countdown(i: Int)\n```\n\n你还可以看到它打印了结果，而不返回任何内容，所以它的返回类型是\
  \ `Unit`（类似于 `void`）：\n\n```scala\ndef countdown(i: Int): Unit =\n  if (i <= 0)\n\
  \    ()\n  else {\n    println(i)\n    countdown(i - 1)\n  }\n```\n\n\n\n回到 `sum`\
  \ 函数，求和算法的单位元（identity element）告诉我递归的停止条件是返回值 `0`：\n\n```scala\ndef sum(list: List[Int]):\
  \ Int = list match\n    case Nil => 0\n```\n\n接下来，我需要添加递归调用。使用 `match` 表达式实现此操作如下：\n\
  \n```scala\ndef sum(list: List[Int]): Int = list match\n    case Nil =>\n      \
  \  0\n    case head :: tail =>\n        head + sum(tail)\n```\n\n这是它的工作原理：\n\n-\
  \ 在 `case` 的左侧，我将 `list` 拆分为两个元素：`head`（头部）和 `tail`（尾部）。\n- 注意它们是通过 `::` 符号分隔的。\n\
  - 在处理 `List` 时，这意味着 `head` 是一个包含单个元素（`Int`）的变量，而 `tail` 是一个包含列表剩余部分的变量（`List[Int]`）。\n\
  - 此之后，最后这一行代码可以读为：“将 `head` 元素与所有剩余元素的和相”：\n\n```scala\nhead + sum(tail)\n```\n\n\
  现在，如果你将该函数连同示例 `List[Int]` 粘贴到 REPL 中，你会看到如下结果：\n\n```scala\nscala> sum(List(1,2,3))\n\
  val res0: Int = 6\n```\n\n## 尾递归\n\n当你接触递归时，你也会想学习尾递归（tail recursion），如果你在 JVM 上编程，你将确保自己熟悉栈（stacks）和栈帧（frames）。我在我的书中超过\
  \ 50 页的递归内容涵盖了所有这些内容，函数式编程简化版](https://alvinalexander.com/scala/functional-programming-simplified-book）。\n\
  \n# 37. TDL UI：处理用户输入\n\n现在你已经了解了代码块和递归的背景知识，是时候编写一个循环了，我们在循环中：(a) 提示用户输入，b) 读取该输入，c)\
  \ 处理它，然后再次提示他们。\n\n正如你在我在数据库代码中写的 `delete` 函数中看到的，我使用了 `for` 表达式来处理 `Try` 值。如果你离上次看那段代码有一段时间了，我建议你现在回去看看它是如何运行的，因为我们正要进行类似的操作。\n\
  \n## 循环；输入\n\n现在我们几乎拥有了提示用户并读取其输入所需的所有内容。我们还没有处理其输入的方法，但目前可以对其进行模拟处理。我现在真正想做的是专注于如何创建一个循环，以便我们可以根据用户的意愿留在这个循环中：\n\
  \n1. 提示用户输入\n2. 读取他们的输入\n3. 处理该输入（假设通过调用我们的数据库函数）\n4. 回到步骤 1\n\n由于 `promptUser`\
  \ 和 `readInput` 都返回 `Try` 值，我们在 Scala 中的做法是使用 `for` 表达式执行该循环。到目前为止，我们的主方法开头如下：\n\
  \n```scala\n@main\ndef ToDoList =\n    val datafile = \"./ToDoList.dat\"\n    val\
  \ db = Database(datafile)\n    val processor = InputProcessor(db)\n```\n\n之后，我将在这里定义一个命名为\
  \ `mainLoop` 的方法：\n\n```scala\ndef mainLoop(): Try[Unit] = for\n```\n\n根据过去的经验，我知道\
  \ `mainLoop` 不需要任何输入参数，它还将返回一个封装在 `Try` 中的 `Unit`。我稍后会详细解释这一点，但我们现在继续。\n\n## 提示输入\n\
  \n现在我们的心态是正在编写主循环。因此，我们想做的第一件事是提示用户输入，所以我添加了这一行：\n\n```scala\ndef mainLoop(): Try[Unit]\
  \ = for\n    _ <- promptUser()\n```\n\n我之前展示过这种语法，所以我只需说这可以读作：“提示用户输入。因为 `promptUser`\
  \ 返回的是 `Try` 内部的 `Unit` 值，我不在乎那个值，所以忽略它。”我们在 `<-` 操作符的左侧使用字符 `_` 来表示“我不在乎这个值”。\n\
  \n## 读取输入\n\n我们在循环中想做的下一件事是读取用户的输入，所以我把它加进去：\n\n```scala\ndef mainLoop(): Try[Unit]\
  \ = for\n    _ <- promptUser()\n    input <- readInput()\n```\n\n这会将用户的输入绑定到我命名为\
  \ `input` 的变量上。他们在按下 [Enter] 键之前输入的任何内容都将是一个赋值给 `input` 变量的 `String`。\n\n## 处理输入\n\
  \n接下来，应用程序需要处理用户的输入。正如我在这个待办事项示例的引言中所示，用户输入以下内容来添加一个值为 `\"Wake up\"` 的新任务：\n\n```text\n\
  a Wake up\n```\n\n他们输入以下内容来删除第一个任务：\n\n```text\nd 1\n```\n\n以此此类推；他们使用我们允许的其他命令。\n\
  \n所以现在我们需要某种处理器或处理程序来处理收到的这些字符串。目前我不会实现这个处理器；我只会创建一个具有正确签名的“什么都不做”的函数。\n\n如往常，我开始草拟目标函数的签名。我将此函数命名为\
  \ `handleUserInput`，它将接收一个字符串输入：\n\n```scala\ndef handleUserInput(input: String)\n\
  ```\n\n在此处——为了完成函数签名——你需要稍微思考一下：`handleUserInput` 将接收字符串输入，尝试处理它，并与我们的数据库交互。由于我们的数据库函数都返回\
  \ `Try`，此函数也应该返回 `Try`，所以我加上了：\n\n```scala\ndef handleUserInput(input: String):\
  \ Try\n```\n\n等等，让我们重新检查原文中 `handleUserInput` 的逻辑。原文的签名是碎片化的。我将按照要求将其整合为清晰的结构。\n\
  \n```scala\ndef handleUserInput(input: String): Try[Unit]\n    // ... 实现\n```\n\n\
  实际上，看原文：\n`def handleUserInput(input: String): Try`\n`Unit`\n\n让我们正确格式化签名：\n\n```scala\n\
  def handleUserInput(input: String): Try[Unit]\n    // todo:\n    println(\"handleUserInput\"\
  )\n```\n\n## 回到主函数\n\n现在我们将该函数添加到 `mainLoop` 中，如下：\n\n```scala\ndef mainLoop():\
  \ Try[Unit] = for\n    _ <- promptUser()\n    input <- readInput()\n    _ <- {\n\
  \        handleUserInput(input)\n        mainLoop()\n    }\nyield ()\n```\n\n##\
  \ 问题\n\n然而，我们现在的问题是，如果现在调用 `main`，它并不会真正循环；它运行一次。它提示用户、读取输入、处理，然后退出。我们仍然需要让循环循环的方法。\n\
  \n当你处理不可变变量时，解决这个问题的方法几乎相同：递归。在我们的 `for` 表达式中，我们只需要调用 `main`，让它再次自调用。我将格式化该代码使其看起来像这样：\n\
  \n```scala\ndef mainLoop(): Try[Unit] = for\n    _ <- promptUser()\n    input <-\
  \ readInput()\n    _ <- {\n        handleUserInput(input)\n        mainLoop()\n\
  \    }\nyield ()\n```\n\n你可以用不同的方式格式化它，但重要的是这段代码：\n\n```scala\n_ <- {\n    handleUserInput(input)\n\
  \    mainLoop()\n}\n```\n\n正是我们需要的。\n\n\n\n\n可以理解为：“大括号内的所有内容都是一个代码块。在该块内部，首先处理用户的输入。然后，当函数返回时，再次调用\
  \ `mainLoop`。”\n\n现在 `mainLoop` 再次被调用，它启动了一个 `for` 表达式，它的第一步是再次提示用户输入。\n\n而且这是一个需要知道的关键点：\n\
  \n> 当你处理不可变变量并需要执行循环时，你应该使用递归来代替。\n\n在其他“循环”场景下，你可以使用 Scala 的集合方法来代替递归，但对于像这种情况，递归是答案。\n\
  \n## 完整的 'main' 代码\n\n现在我们可以查看完整的 `main` 方法。我在这里添加的唯一新内容是对 `mainLoop` 的初始调用，以让程序运行起来。我在代码底部附近用注释说明了这一点。\n\
  \n```scala\n@main\n\ndef ToDoList =\n    val db = Database(\"./ToDoList.dat\")\n\
  \    val processor = InputProcessor(db)\n    def mainLoop(): Try[Unit] =\n     \
  \   for\n            _     <- promptUser()\n            input <- readInput()\n \
  \           _     <- {\n                        handleUserInput(input)\n       \
  \                 mainLoop()\n                    }\n     yield\n        ()\n  \
  \  // 这启动程序的运行：\n    mainLoop()\nend ToDoList\n```\n\n注意，我在 `ToDoList` 函数内部定义了 `mainLoop`，这是我们应用程序的“主方法”。并没有必要在\
  \ `ToDoList` 内部定义 `mainLoop`，但我这样做是为了向你展示你可以用 Scala 编写的其他操作。\n\n这段代码的工作原理是：\n\n\
  * Scala 在 `ToDoList` 方法之前看到了 `@main`，并将其识别为主方法\n* 主方法是应用程序的入口点，因此该函数开始运行\n* 前几行被读取\n\
  * `mainLoop` 函数的定义被读取\n* `mainLoop` 函数作为 `ToDoList` 的最后一行执行，这启动了提示用户并读取其输入的进程\n\n\
  现在我们已经有了循环，可以回去继续处理用户的输入工作了。\n\n# 38. InputProcessor 类\n\n由于“输入处理”可以被视为一个整体——一个概念——我将创建一个\
  \ `InputProcessor` 类来处理所有的输入处理：\n\n```scala\nclass InputProcessor\n```\n\n此外，因为我知道这段代码将需要我的数据库函数，我会将其作为一个构造参数添加：\n\
  \n```scala\nclass InputProcessor(db: Database)\n```\n\n并且因为我知道数据库函数返回 `Try` 错误处理数据类型，我在代码中添加了该\
  \ `import` 语句：\n\n```scala\nimport scala.util.{Try, Success, Failure}\n\nclass InputProcessor(db:\
  \ Database)\n```\n\n## 处理用户输入\n\n现在我们需要一个 `handleUserInput` 函数。我之前创建了一个只包含 `println`\
  \ 语句的占位函数，但现在我将展示它真正需要做什么，我把它放在了 `InputProcessor` 类中：\n\n```scala\nclass InputProcessor(db:\
  \ Database):\n    def handleUserInput(input: String): Try[Unit] = input match\n\
  \        case \"q\" =>\n            ???\n        case \"h\" =>\n            ???\n\
  \        case \"v\" | \"l\" =>\n            ???\n        case add if add.startsWith(\"\
  a \") =>\n            ???\n        case del if del.startsWith(\"d \") =>\n     \
  \       ???\n        case _ =>\n            ???\n    end handleUserInput\n    //\
  \ hơn 代码 ...\nend InputProcessor\n```\n\n如所示，我的计划是使用 `match` 表达式来处理用户可以输入的不同命令。在在该表达式内部，每个\
  \ `case` 处理用户可以输入的不同命令（注意：还有其他处理这种情况的方法，但我试图保持代码简单）。\n\n所以现在接下来的任务是实现这些 `case` 的每一个代码（或者\
  \ Scala 中使用 `match` 表达式来实现模式匹配。）\n\n> 这里需要注意的一点是，`InputProcessor` 类拥有 `db` 构造参数——它是\
  \ `Database` 类的实例——所有这些函数都可以访问该 `db` 参数。此外，该实例在传递到此类之前，已经在主方法中完全初始化了。\n\n# 39. TDL\
  \ UI：实现 handleUserInput\n\n既然我们知道需要一个 `handleUserInput` 函数，让我们开始编写它吧。按照惯例，我从函数签的的草图开始，我们在课程中已经知道了：\n\
  \n`def handleUserInput(input: String): Try[Unit]`\n\n这个函数需要根据用户输入分支到不同的方向。正如我在 To-Do\
  \ List 介绍中所示，它被编写为接受这些命令：\n\n* `q`，退出\n* `a`，添加新项目\n* `d`，删除项目\n* `h`，显示帮助\n* `v`\
  \ 或 `l`（小写 `L`），列出项目\n\n在其他语言中你可能会用 `if`/then`/else` 结构来处理这些，在 Scala 中你可以这样做，但也有另一种方法：`match`\
  \ 表达式。`match` 表达式允许你对给定值进行模式匹配，当 `match` 作为函数体时，它的工作方式是像这样开头：`def handleUserInput(input:\
  \ String): Try[Unit] = input match`\n\n这相当于说：“我们正准备对 `input` 变量执行一些模式匹配。”\n\n然后你要的是开始编写想要匹配的\
  \ `cases`。对于我们的函数，我们知道想要匹配哪些字符串，所以我像这样草拟了这些 cases：\n\n```scala\ndef handleUserInput(input:\
  \ String): Try[Unit] = input match\n    case \"q\" =>\n        ???\n    case \"\
  h\" =>\n        ???\n    case \"v\" | \"l\" =>\n        ???\n    case add if add.startsWith(\"\
  a \") =>\n        ???\n    case del if del.startsWith(\"d \") =>\n        ???\n\
  \    case _ =>\n        ???\n```\n\n信不信，这实际上就是完整的函数体，只是我们现在需要填充那些 `???` 区域。\n\n\
  ## 解释 cases\n\n这里是对每个 `case` 的简要讨论。前两个 `case` 最简单的，它们可以理解为：“当你看到这个完全相同的字符串时，执行 `=>`\
  \ 符号右侧的操作：\n\n```scala\ncase \"q\" =>\ncase \"h\" =>\n```\n\n所以如果 `input` 是 `\"\
  q\"`，则执行第一件事，但如果它是 `\"h\"`，则执行第二件事。\n\n> 就像其他编程语言一样，像 `\"q\"` 和 `\"h\"` 这样的字符串被称为字符串字面量。\n\
  \n第三个 `case` 与前两个类似，但可以理解为：“如果 `input` 是 `\"v\"` 或 `\"l\"`，执行 `=>` 符号右侧的操作：\n\n\
  ```scala\ncase \"v\" | \"l\" =>\n```\n\n使用这种语法连接任意数量的选项，所以如果你也想接受 `\"s\"`（代表 show），就写：\n\
  \n```scala\ncase \"v\" | \"l\" | \"s\" =>\n```\n\n在下一个模式中，情况变得有趣起来：\n\n`case add\
  \ if add.startsWith(\"a \") =>`\n\n这并不是这种语法的完美用例，但目前你可以将其理解为：“从变量 `input` 创建一个变量\
  \ `add`，如果字符串 `add` 以字母 `a` 后接空格开头，执行 `=>` 符号右侧的操作。”然后你在表达式的右侧使用变量 `add`。\n\n这种语法真正大放异彩的地方在于你创建一个与\
  \ `input`不同的 `add` 时。虽然我们在这里不需要这样做，但我想将其作为 Scala 工具箱技巧技巧展示。\n\n```scala\ncase del\
  \ if del.startsWith(\"d \") =>\n```\n\n最后一个 `case` 看起来像这样，意思是“匹配所有其他”：\n\n```scala\n\
  case _ =>\n```\n\n所以如果 `input` 不匹配之前的任何 `case`，控制就会来到这个 `case`，`=>` 符号右侧的任何内容都将被执行。这是一个“全捕”\
  \ `case`，在我们的代码中，当用户输入允许命令之外的任何内容时，控制就会来到这里。\n\n\n\n\n在 Scala 中，`=>` 曾被一些人称为“火箭”符号，尽管这种称法并没有真正流行。但正如我在我的其他书中描述的那样，它实际上是一个*转换器*（transformer）符号。每当你看到它时，它意味着左侧的内容正在被转换为右侧的内容，因此在\
  \ `match` 表达式中，我们匹配左侧的分支（cases），并将它们转换为 `=>` 右侧的值。\n\n## 记住 EOP（表达式结束）\n\n同样重要的一点是，Scala\
  \ 中的每一行代码都是一个表达式。因此，对于 `match` 表达式，每个 `=>` 右侧的值就是该表达式返回的值。\n\n在这个函数中，由于我之前已经声明了该函数返回\
  \ `Try[Unit]`：\n\n```scala\ndef handleUserInput(input: String): Try[Unit]\n    \
  \                                 ---------\n```\n\n这意味着我的预期是这些 `=>` 符号右侧的每一个表达式都会返回\
  \ `Try[Unit]`。我们将在接下来的课程中通过实现每个用例，来看看它是如何运作的。\n\n# 40. TDL UI：处理“退出 (Quit)”\n\n\
  在 `handleUserInput` 中要做的第一件事是处理“退出”分支。基本上，我们要做的就是在看到用户输入了字母 `\"q\"` 时，调用 `System.exit(0)`。然而，由于\
  \ `handleUserInput` 返回的是 `Try[Unit]`，我们需要将该调用封装在 `Try` 中，如下所示：\n\n```scala\ndef\
  \ handleUserInput(input: String): Try[Unit] = input match\n    case \"q\" =>\n \
  \       Try(System.exit(0))     // <== 新代码\n    // 这里还有更多分支 ...\n```\n\n由于 `System.exit`\
  \ 返回的是 `Unit`，所以这种运行符合预期。\n\n## 一个 Scala REPL 小贴士\n\n注意，你可以使用 Scala REPL 的 `:type`\
  \ 命令来验证 `System.exit` 返回的是 `Unit`：\n\n```scala\nscala> :type System.exit(0)\nUnit\n\
  ```\n\n这就是我们在“退出”用例需要做的所有工作。\n\n# 41. TDL UI：处理“帮助 (Help)”\n\n我们可以完成的另一个相对简单的 `case`\
  \ 分支是“帮助”用例。当用户输入字母 `\"h\"` 来查看我们的帮助文本时。\n\n由于我们之前在 `IOHelper` 对象中实现了 `showHelp`\
  \ 函数，而且该函数返回 `Try[Unit]`，我们所做的就是在在第二个 `case` 语句中调用它：\n\n```scala\ndef handleUserInput(input:\
  \ String): Try[Unit] = input match\n    case \"q\" =>\n        Try(System.exit(0))\n\
  \    case \"h\" =>\n        IOHelper.showHelp()     // <== 新代码\n```\n\n该函数使用 `println`\
  \ 语句将我们的“帮助文本”打印到标准输出（STDOUT）——而且由于该函数遵循我们的规则，即每当我们访问外部世界时，都会返回 `Try`——所以该函数在这里“能够正常工作”。\n\
  \n# 42. TDL UI：处理“视图 (View)”\n\n接下来，“视图”用例比前两个稍微复杂一点。基本上，这段代码需要尝试读取数据库，然后从那里采取两种可能的操作之一：\n\
  \n*   在成功的情况下，它会打印待办事项列表\n*   在失败的情况下，它会打印一条关于数据库无法访问的错误信息\n\n这很容易就能实现，因为我们之前已经写了\
  \ `selectAll` 数据库方法，并且它返回一个 `Try` 值，所以我们只需要在 `match` 表达式中处理它的 `Success` 和 `Failure`\
  \ 分支即可。\n\n下面是实现我刚才描述的代码，带有一些注释以使这些步骤清晰：\n\n```scala\ndef handleView(): Try[Unit]\
  \ = Try {\n    // 尝试从数据库读取所有任务。\n    // 此函数返回一个字符串列表，封装在 Try\n    // 内部：\n    val\
  \ res: Try[Seq[String]] = db.selectAll()\n    // 处理 Success 和 Failure 分支：\n    res\
  \ match\n        case Success(tasks) =>\n            // 在 Success 分支中，我们得到了一个任务列表（字符串），\n\
  \            // 所以以良好的格式打印它们：\n            printTasks(tasks)\n        case Failure(t)\
  \ =>\n            // 在 Failure 分支中（即无法访问数据库时），\n            // 打印从 selectAll 获取的异常（Throwable）：\n\
  \            System.err.println(t)\n}\nprivate def printTasks(tasks: Seq[String]):\
  \ Unit =\n    for\n        (task, count) <- tasks.zip(Stream from 1)\n    do\n \
  \       println(s\"${count}. $task\")\n```\n\n这是一个不带注释的 `handleView` 简短版本：\n\n```scala\n\
  def handleView(): Try[Unit] = Try {\n    val res: Try[Seq[String]] = db.selectAll()\n\
  \    res match\n        case Success(tasks) =>\n            for\n              \
  \  (task, count) <- tasks.zip(Stream from 1)\n            do\n                println(s\"\
  ${count}. $task\")\n        case Failure(t) =>\n            System.err.println(t)\n\
  }\n```\n\n注意，`match` 表达式的分支打印到标准输出（STDOUT）和标准错误（STDERR），因此它们的返回类型都是 `Unit`。由于整个函数体都被封装在一个\
  \ `Try` 构造函数中：\n\n```scala\ndef handleView(): Try[Unit] = Try { // 函数体在此 }\n```\n\
  \n这意味着该函数的两个分支都能正确导致返回 `Try[Unit]` 类型。\n\n再次，如果任何操作出现问题，请想象我们正在访问远程数据库或服务，在现实世界中这些是可能的。\n\
  \n# 43. TDL UI：处理“添加 (Add)”\n\n接下来，“添加”用例比之前的稍微复杂一点。回到 UI，我们知道当用户想要添加新任务时，他们会输入如下内容来触发\
  \ `add` 命令：\n\n`a wake up`\n`a brush teeth`\n`a take long shower`\n\n我们要第一件事是将这个*添加*命令与字符串的其余部分分离。得益于\
  \ Scala 的集合方法，我们可以使用 `drop` 方法来实现这一点：\n\n*   `\"a wake up\".drop(2)` // \"wake up\"\
  \n*   `\"a brush teeth\".drop(2)` // \"brush teeth\"\n*   `\"a take long shower\"\
  .drop(2)` // \"take long shower\"\n\n`drop` 方法是因为 `String` 也是一个列表，具体来说是 `Seq[Char]`。\n\
  \n这种方法看起来良好，可以将字符串传递给另一个函数，以便该函数将字符串添加到我们的数据库。所以，只看“添加”分支，我这样写：\n\n```scala\ncase\
  \ add if add.startsWith(\"a \") =>\n    handleAdd(add.drop(2))\n```\n\n## handleAdd\n\
  \n现在我们需要编写 `handleAdd` 函数，我已经知道了关于它的三点信息：\n\n*   它将接收一个 `String` 作为输入\n*   它需要将该任务插入我们的数据库\n\
  *   因为它将访问数据库，所以它需要返回 `Try`\n\n因此，我可以开始勾勒它的签名：\n\n```scala\ndef handleAdd(task:\
  \ String): Try\n```\n\n由于我之前已经写了数据库代码，我知道 `handleAdd` 只需要一个数据库对象的引用即可执行插入。记住这个函数是在\
  \ `InputProcessor` 类内部，该类被定义为接收一个 `Database` 引用，如下：\n\n```scala\nclass InputProcessor(db:\
  \ Database)\n```\n\n现在 `handleAdd` 可以访问这个 `db` 引用。\n\n在这种情况下，函数拥有*侧门*是可以接受的：即该函数声明在一个此类引用的类内部。（但是，如果你不喜欢，还有其他编写此代码的方法来确保\
  \ `Database` 引用是通过函数的正门（即其输入参数列表）传入的）。\n\n回到 `handleAdd` 函数，我知道 (a) 我想要调用 `db` 引用的\
  \ `insert` 函数，(b) 它返回 `Try[Unit]`。现在我们这样写 `handleAdd`：\n\n```scala\ndef handleAdd(taskName:\
  \ String): Try[Unit] =\n    db.insert(taskName)\n```\n\n此时，`handleUserInput` 函数中\
  \ `match` 表达式的这个分支代码可以作为该分支的结束：\n\n```scala\ncase add if add.startsWith(\"a \")\
  \ =>\n    handleAdd(add.drop(2))\n```\n\n\n\n然而，因为我通过测试应用程序知道，我想在发出 `add` 命令后看到我的任务长什么样，所以我知道现在也需要运行\
  \ `view` 函数。因此，我在 `handleAdd` 之后添加了它：\n\n```scala\ncase add if add.startsWith(\"\
  a \") =>\n    handleAdd(add.drop(2))\n    handleView()\n```\n\n由于 `handleView` 返回\
  \ `Try[Unit]`，所以这个 `case` 的返回类型与 `handleUserInput` 的返回类型匹配。现在 `handleUserInput`\
  \ 的 `match` 表达式中包含了这些情况：\n\n```scala\ndef handleUserInput(input: String): Try[Unit]\
  \ = input match\n    case \"q\" =>\n        Try(System.exit(0))\n    case \"h\"\
  \ =>\n        IOHelper.showHelp()\n    case \"v\" | \"l\" =>\n        handleView()\n\
  \    case add if add.startsWith(\"a \") =>    // <== 新代码\n        handleAdd(add.drop(2))\n\
  \        handleView()\n    // 更多情况 ...\n```\n\n# 44. TDL UI: 处理“删除”操作\n\n“删除”用例与“添加”情况非常相似，但\
  \ `a` 命令后面不再是字符串，而 `d` 命令后面将是一个整数。为了清晰起见，删除命令看起来如下：\n\n```text\nd 1\nd 3\n```\n\n\
  这些命令分别意味着“删除第一个任务”和“删除第三个任务”。\n\n## 处理输入\n\n就像上一节课一样，我们需要做的第一件事是将删除命令——字母 `d`——与字符串的其他部分分离。我们再次使用\
  \ `drop` 方法来实现这一点：\n\n```scala\n\"d 1\".drop(2)    // \"1\"\n\"d 3\".drop(2)   \
  \ // \"3\"\n```\n\n然后我们使用这种方法将该字符串传递给 `handleDelete` 函数：\n\n```scala\ncase del if\
  \ del.startsWith(\"d \") =>\n    handleDelete(del.drop(2))\n```\n\n## handleDelete\n\
  \n现在我需要写一个 `handleDelete` 函数，我已经知道了关于它的三点：\n\n- 它将接受一个 `String` 作为输入\n- 它需要根据用户看到的任务\
  \ ID 尝试从数据库中删除该任务\n- 因为它要访问数据库，它可能需要返回一个 `Try`\n\n因此，我可以开始这样勾画它的函数签名：\n\n```scala\n\
  def handleAdd(taskIdString: String): Try\n```\n\n由于此函数接受一个代表用户看到的任务 ID 的字符串——例如\
  \ `\"1\"` 或 `\"3\"`——所以函数的算法应该是：\n\n- 尝试将给定的字符串转换为整数。\n- 如果失败，函数此时应该进行短路处理。\n- 如果转换成功，从该值减去\
  \ `1` 以得到真实的索引。这是因为 Scala 列表是从 0 开始索引的，就像其他编程语言中的数组和列表一样。（我的意思是用户看到的第一个任务是数字 `1`，所以他们输入那个数字。而这个\
