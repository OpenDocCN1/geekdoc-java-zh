  \n但除了这些违反之处，我严格地遵守了这些规则，你也看到了应用程序是如何组合在一起的。\n\n## 总结时间\n\n此时，我的主要想法是，当这本书开始时，你可能还不习惯使用数据类型，但现在我们已经写了两个小型应用程序，你可能已经熟悉得多了。所以现在是一个很好的提问：你是否觉得所展示的所有技术都有好处？如果是的话，这些好处具体是什么？\n\
  \n## 好处\n\n对我来说，我演示的好处是：\n\n*   你知道你可以信任纯函数；它们的类型签名不会撒谎。\n*   当我查看函数签名并看到返回类型为 `Option`、`Try`\
  \ 或 `Either` 时，我立刻就会想：“这个函数中可能会出问题”。\n*   当我看到一个函数签名 (a) 没有输入参数或 (b) 具有 `Unit` 返回类型时，我知道它正在执行某种副作用。\n\
  *   即使我不知道函数的名称，当我查看它的签名时，我也可以对它可能做什么有一个很好的了解。\n\n此外：\n\n*   阅读 EOP（面向表达式的编程）可以像代码一样简单：你将纯函数的结果绑定到一个代数变量上。代码易于编写、读取和测试。\n\
  *   编写这样的代码就像在写代数，或者创建一个蓝图。\n*   将表达式组合在一起就像组合代数方程。\n\n我从经验中知道的但在这里没有展示的其他事情：\n\n\
  *   我知道不可变变量和不可变数据结构在并行和并发编程中是安全的。\n*   我知道纯函数比执行副作用的方法更容易测试。\n\n关于测试的这一点，不纯函数可能会执行以下任何一种操作：\n\
  \n*   读取输入，且不警告调用者。\n*   写入输出，且不警告调用者。\n*   修改给定的参数。\n*   修改类内部的变量或全局参数。\n*   通过后门访问其他变量。\n\
  \n正因为这些原因，在测试环境中设置它们的状态要困难得多：很难确切知道它们可能还会访问其他什么。\n\n相反，对于纯函数——你知道它访问的唯一变量都是通过正门进来的，而且它没有副作用——你就知道设置它的测试环境将容易得多。\n\
  \n## 关键点\n\n现在，这一切的一个关键点是，如果你一直跟着我——如果我展示的所有内容都很有道理——那么你 `真的, 真的接近函数式编程了`（functional\
  \ programming）。可能比你想象的要近得多。\n\n我们只需要再走几步，我们将在下一步完成。\n\n# 48. TDL: 使用 Either 代替 Try\n\
  \n你学习路径的下一步是，我们现在把 TDL 应用中所有的 `Try` 实例替换为 `Either` 实例。\n\n实际上，我不认为值得做*所有*这些替换。相反，我要做的仅仅是在\
  \ `Database` 类中替换它们，然后我想你可以想象如何在应用程序的其他部分使用这些内容。\n\n所以，让我们开始吧，记住以下所有函数都在 `Database`\
  \ 类内部：\n\n```\nclass Database(dbFilename: String):\n     // 所有函数都在这里\nend Database\n\
  ```\n\n## insert 函数\n\n我们写的第一个函数是 `insert` 函数，它目前看起来是这样的：\n\n```scala\ndef insert(record:\
  \ String): Try[Unit] =\n     writeToFile(List(record), true)\n```\n\n所以我们的第一个任务是将那个\
  \ `Try` 替换为 `Either`。我们从更新 `insert` 的函数签名开始：\n\n```scala\ndef insert(record: String):\
  \ Either[Throwable, Boolean] =\n     writeToFile(List(record), true)\n```\n\n复习一下，记住\
  \ `Either` 返回一个 `Left` 或 `Right`，而 `Left` 持有错误，所以我写了 `insert` 的返回类型：\n\n```scala\n\
  def insert(record: String): Either[Throwable, Boolean] =\n```\n*   `Either[Throwable,\
  \ Boolean]`\n*   `Left`\n*   `Right`\n\n## writeToFile\n\n`writeToFile` 函数目前看起来是这样的：\n\
  \n```scala\nprivate def writeToFile(lines: Seq[String], append: Boolean): Try[Unit]\n\
  ```\n\n并且我们知道它应该看起来这样：\n\n```scala\nprivate def writeToFile(lines: Seq[String],\
  \ append: Boolean): Either[Throwable, Boolean] =\n  var bw: BufferedWriter = null\n\
  \  try\n    bw = BufferedWriter(File(dbFilename), append)\n    for line <- lines\
  \ do bw.write(s\"$line\\n\")\n    Right(true)\n  catch\n    case e: Throwable =>\
  \ Left(e)\n  finally\n    if bw != null then bw.close\n```\n\n## selectAll\n\n同样，`selectAll`\
  \ 的签名目前是这样的：\n\n我们再次将 `Try` 替换为 `Either`：\n\n```scala\ndef selectAll(): Either[Throwable,\
  \ Seq[String]] =\n  var bufferedSource: scala.io.BufferedSource = null\n  try\n\
  \    bufferedSource = Source.fromFile(dbFilename)\n    val lines = for line <- bufferedSource.getLines\
  \ yield line\n    Right(lines.toList())\n  catch\n    case t: Throwable => Left(t)\n\
  \  finally\n    if bufferedSource != null then bufferedSource.close\n```\n\n这里观察到的一点是，`selectAll`\
  \ 的签名有点复杂，因为它的 `Right` 参数是一个字符串列表，但现在我怀疑你可能已经习惯了这些类型（以及它们的价值）。以下是这些类型的拆解：\n\n```\n\
  Either[Throwable, Seq[String]]\n ---------  -----------\n    ^            ^\n  Possible\
  \     Success\n  Error        Value\n  In           In\n  Left         Right\n```\n\
  \n如果你能读懂这个，你的表现很好。\n\n## delete\n\n最后，`delete` 函数目前返回这个 `Try`：\n\n```scala\ndef\
  \ delete(indexToDelete: Int): Try[Int] = ...\n```\n\n\n\n\n并且我们将其替换为这个 `Either`：\n\
  \n```scala\ndef delete(indexToDelete: Int): Either[Throwable, Int] = ...\n     \
  \                            ----------------------\n```\n\n为了将 `delete` 转换为返回一个\
  \ `Either`，一个简单的解决方案是将 `maybeNumRowsDeleted`（它目前是一个 `Try`）转换为 `Either`。你只需要在函数的末尾对\
  \ `maybeNumRowsDeleted` 调用 `toEither` 即可实现：\n\n```scala\ndef delete(indexToDelete:\
  \ Int): Either[Throwable, Int] =\n  val maybeNumRowsDeleted = for\n      rows  \
  \         <- selectAll()\n      newRows        =  CollectionUtils\n            \
  \                         .removeElementByIndex(rows, indexToDelete)\n      numRowsDeleted\
  \ =  rows.size - newRows.size\n      _              <- writeToFile(newRows, false)\n\
  \  yield\n      numRowsDeleted\n  maybeNumRowsDeleted.toEither   // <== 修改处\n```\n\
  \n幸运的是，`Try` 类型拥有这个 `toEither` 方法，这使得转换变得简单。\n\n## 关键点\n\n所以就是这样，我们重写了数据库函数，使用 `Either`\
  \ 代替 `Try`。因为 `Either` 要求你声明函数可能返回的两种类型，它们的签名读起来稍微长一点，但它们非常显式，而且工作方式也更加灵活。\n\n为了提醒一下最后一点的含义，在我声明的所有数据库函数中，我将\
  \ `Left` 类型定义为 `Throwable`，但它们也可以返回 `String`、枚举（enum）或任何对当前问题最有意义的数据类型。\n\n而这种灵活性对于我们接下来的学习方向非常重要。\n\
  \n# 49 Either 如何与 ZIO 关联\n\n正如我提到的，如果这一切仍然让你觉得很有道理，那么你现在距离函数式编程（FP）已经非常近了，几乎可以感受到它的味道了。事实是：如果你能处理\
  \ `Either`，你就能处理 FP。\n\n## 展望 ZIO\n\n如果你以前没听说过它，[ZIO](https://zio.dev) 是 Scala 社区中两个主要的\
  \ FP 库之一（另一个名为 [Cats Effect](https://typelevel.org/cats-effect)).这两个库驱动了互联网上一些最繁忙的网站，包括\
  \ 2022 年的 Disney Streaming、Caesars 以及这里的许多其他网站和应用程序。\n\n我说“你离 FP 近到几乎可以感受到它的味道”是指，如果你查看\
  \ 2022 年 11 月的 [ZIO 概述文档](https://zio.dev/overview) —— 以及互联网上几乎所有其他的“ZIO 介绍”文章，你会发现所有作者都从这样的描述开始：\n\
  \n> 从概念上说，你可以把 `ZIO` 类型看作是一个接受泛型 `R` 数据类型并返回 `Either` 的函数。\n\n这句话意味着从概念上讲，你可以勾勒出这样的\
  \ `ZIO` 函数签名：\n\n```scala\ndef ZIO(r: R): Either[E, A]\n```\n\n虽然这段代码并不是 `ZIO` 实际的工作方式，但基本思想是你可以这样理解：\n\
  \n*   `ZIO` 类型接受一个泛型 `R` 类型作为输入参数。\n*   它返回一个 `Either`。\n*   在 `Either` 内部，你会看到它在\
  \ `Left` 和 `Right` 位置有两个泛型类型：\n\n```text\nEither[E,     A]\n       ^      ^\n  \
  \     Left  Right\n```\n\n这些泛型类型被命名为 `R`、`E` 和 `A` 有非常特定的原因：\n\n*   `R` 代表传入的环境（environment）。基本上如果你的代码需要某种环境（如数据库、输入/输出甚至时钟），你将代码所需的依赖项作为\
  \ `R` 参数传入。（将此参数命名为 `D`，代表 dependencies，可能会有帮助。）\n*   `E` 是常用的 `Either` 错误处理类型，即\
  \ `Left` 位置的类型。在之前的课程中见过 `Either` 后，你已经知道这意味着什么了。（像通常一样，把它想象成“不愉快”的结果。）\n*   同样，`A`\
  \ 是你真正想要的成功数据类型，即 `Right` 位置的类型。\n\n这种灵活性对于我们接下来的学习方向非常重要。\n\n# 50 什么是 IO？\n\n快回到今天，关于\
  \ `IO` 有三件需要知道的事情：\n\n1.  它们创建是为了以纯粹的方式处理副作用。\n2.  我还没有提到的一点是，你可以使用任意数量的 `IO`，就像我们使用\
  \ `Try` 或其他副作用类型一样。\n3.  为了辅助第 2 点，`IO` 类型类似于 `Try` 和 `Either`，但是加强版的。它们比那些类型强大得多，拥有大量的内置功能。\n\
  \n## 简短历史\n\n作为一段简短的历史，在早期，一些聪明人正试图弄清楚 I/O。长话短说，他们发明了一个叫做 `IO` 的概念。\n\n从概念上说，你可以把\
  \ `IO` 类型看作是一个接受泛型 `R` 数据类型并返回一个 `Either` 的函数。这是一种过度简化，但并没有过头：\n\n```scala\ndef\
  \ ZIO(r: R): Either[E, A]\n```\n\n# 51 IO 与代数代换\n\n关于 `IO` 类型（如 `ZIO`）的第一要点是——它们让你能够继续使用引用透明（RT）和代数代换（AS）的概念来理解你的代码。\n\
  \n## 引用透明是好的\n\n为了演示这一点，这里有一个名为 `stringLength` 的新函数：\n\n```scala\ndef stringLength(s:\
  \ String): Int = s.length\n```\n\n技术上 Scala 的 `String` 类型已经有了 `length` 方法，但现在忽略这一点，`stringLength`\
  \ 的重点在于它是一个纯函数。因此，在接下来的例子中，`fooLength` 和 `stringLength(\"foo\")` 将永远永远地具有完全相同的值（整数\
  \ `3`）：\n\n```scala\nval fooLength = stringLength(\"foo\")\n```\n\n现在现在你可以在代码的任何地方使用\
  \ `fooLength`、`stringLength(\"foo\")` 和值 `3`，它们将永远永远地具有相同的值并代表相同的含义。\n\n现在，与之对比的是像\
  \ `io.StdIn.readLine()` 这样的不纯方法：因为人们可以在命令行输入无限的内容，`io.StdIn.readLine()` 的返回值几乎总是不同的。\n\
  \n\n\n\n这意味着 `readLine` 不是引用透明的，我们无法对它使用代数代换。在函数式编程（FP）世界中，这是*糟糕的*，因为我们希望将代码写成代数形式。\n\
  \n那么，我们可以做什么呢？\n\n这就是 Haskell 社区发明 `IO` 类型的地方。\n\n# IO 来救场\n\n你使用 `IO` 类型的方式类似于\
  \ `Try`，在最基础的情况下，看起来像下面这两个示例：\n\n```scala\nval input: IO[String] = IO(io.StdIn.readLine())\n\
  ```\n\n```scala\ndef printLater(s: String): IO[Unit] = IO {\n  println(s)\n}\n```\n\
  \n这里的关键在于 `IO` 像是一个封装，而且是一个*惰性*封装：传递给 `IO` 的代码不会*现在*执行，它将在*以后某个时候*执行。即使在第一种情况下也是如此，因为我将\
  \ `input` 定义为一个 `val` 字段。\n\n> 因为 `IO` 是惰性的，我们仍然是将代码写成一份蓝图。*现在*我们描述我们想要的，然后在*以后*某个时候这段代码才会被实际运行。\n\
  \n与其把 `IO` 想成一个封装，你不如把它想成一个盒子——也是一个小时间机器。现在它什么都不包含，它就像一个贴着标签的盒子，描述了*以后某个时候里面会有什么*。你可以想象盒子上有一个标签，写着：“以后某个时候，这个盒子将包含\
  \ (a) 一个 `String` 或 (b) 一个错误。”\n\n> 提示：`IO` 就像从亚马逊获得的一张收据，显示“你的包裹将送达”，以后某个时候它要么\
  \ (a) 顺利送达（`Either` 的*愉快*情况），要么 (b) 损坏（`Either` 的*不愉快*情况）。（它也可能丢失，但不符合我的比喻。）\n\n\
  但现在，作为一个数学家或架构师，你只需要把它认为是一个 `IO`：\n\n```\n+------+\n|  IO  |\n+------+\n```\n\n\
  如果你熟悉 Scala 的 `Future`，它与 `Future` ，但有一个很大的区别：`Future` 会立即开始运行，而 `IO` 是惰性的，所以现在什么都不会发生。\n\
  \n## 惰性\n\n我们说这样的代码是*惰性的*，或者说是*惰性求值的*。Haskell 以其一切都采用惰性求值的语言而闻名。你可以编写任何想要的 Haskell\
  \ 代码，但除非你发出“*现在*运行代码”的魔法咒语，否则什么都不会发生。\n\n相反，我以前用 Java 编写的所有代码都是*严格的*，或者说是*严格求值的*。例如，当你这样写\
  \ Java 代码时，它会立即运行：\n\n```java\nString input = getInput();\n```\n\n坦率地说，我这样写 Java\
  \ 代码写了近十五，甚至不知道还有其他编写代码的方法。\n\n### 惰性有助于 RT\n\n惰性为我们所做的是，它让我们继续将代码看作代数或蓝图。我们知道我们正在处理一个特定类型的\
  \ `IO` —— 例如 `IO[String]` —— 然后我们很愉快地继续创建我们的蓝图，因为现在什么都不会发生。\n\n例如，我们还可以使用我们的惰性 `IO`\
  \ 值编写 `for` 表达式，同样地，现在什么都没有发生：\n\n```scala\nval result = for\n  input <- readInputLater()\n\
  \  _     <- printLater(input)\nyield\n  ()\n```\n\n正如我提到的，Haskell 有一个魔法咒语可以让你说：“好的，我准备好了，现在运行蓝图。”Cats\
  \ Effect 和 ZIO 库也有类似的咒语，在历史上，这个咒语是一个命名类似于 `runUnsafe` 的函数。这意味着当你准备好运行整个应用程序——或者在这个示例中，只是这个\
  \ `for` 表达式时——你这样运行它：\n\n```scala\nrunUnsafe(result)\n```\n\n实际的函数名各不相同，但“unsafe”一词是\
  \ FP 中用来表示：“等一下大家，我们现在要执行蓝图了，包括所有不安全的副作用。”*在此之前*，一切都是等式和蓝图，没有任何发生，但*现在*是行动时刻了。\n\
  \n现在，为了结束这节课程，我想添加两个笔记。\n\n# 笔记 1：Future 不是这样的\n\n首先，重要的一点是要明确，Scala 的 `Future`\
  \ *并不是*这样工作的。例如，如果早的 `input` 值是这样写的：\n\n```scala\nval input: Future[String] = Future(doSomeSideEffect())\n\
  ```\n\n那么 `doSomeSideEffect` 函数将立即运行。这就是 `Future` 的工作方式，它立即运行。\n\n从 FP 的角度来看，这是糟糕的；这是一个设计缺陷。缺陷在于\
  \ `Future` 在同一个步骤中将蓝图和动作结合在了一起。作为 FP 开发者，我们能够在我们工作时布局蓝图，而不会让它开始运行。作为一个数学家/架构师，我们能够将“什么”与“何时”分开，将描述与执行分开：`Future`\
  \ 的动作应该只在以后某个时候才被触发。\n\n# 笔记 2：Call-name\n\n\n\n\n因此，`IO` 类型被创建为一种处理 I/O 和其他副作用的方法。它们具有\
  \ `Try` 和 `Either` 的所有优点，但：\n\n* 它们是惰惰的，因此我们保留了代数替换模型\n* 它们可以在 `for` 表达式中组合\n* 它们比这些错误处理类型多**许多**特性\n\
  \n在上一节和本节中，我涵盖了前两个要点，在下一节中，我们将开始观察 `ZIO` 和 Cats Effect 库中工业级 `IO` 类型的一些特性。\n\n#\
  \ 53. ZIO 和 IO 的力量\n\n就像 [Cats Effect `IO` 类型](https://typelevel.org/cats-effect/docs/2.x/datatypes/io)\
  \ 一样，`ZIO` 类型是一个极其增强的 `IO` 数据类型。正如提到的，在[函数式编程：简化版](https://alvinalexander.com/scala/functional-programming-simplified-book)\
  \ 中，我展示了如何用不到一页的代码编写一个*简单*的 `IO` 类型，但工业级 `IO` 类型的创建花费了*多年*时间。\n\n所以，在快速的 JIT 笔记之后，让我们开始编写一些\
  \ Scala/FP [ZIO](https://zio.dev) 代码。\n\n## JIT: Scala 2 应用\n\n在进入 ZIO 之前，我们需要一个快速的\
  \ JIT 课程，它的内容如下：创建一个 *Scala 2* 应用程序的方法如下：\n\n```scala\nobject Hello extends App\
  \ {\n    println(\"Hello\")\n}\n```\n\n在这段代码中，`App` 是由 Scala 2 SDK 提供的类型，如所示，你通过一个\
  \ `object` 扩展它来创建一个应用程序。在 Scala 3 中，我在书中展示的 `main` 方法取代了这种 Scala 2 的方法。（还有启动 Scala\
  \ 2 应用程序的其他方法，但对本节并不重要。）\n\n## ZIO 应用程序\n\n我提到这一点是因为 ZIO 采用了类似的方法，你可以这样创建 ZIO 应用程序：\n\
  \n```scala\nimport zio.{ZIOAppDefault, Console}\n\nobject Zio101 extends ZIOAppDefault:\n\
  \    def run = Console.printLine(\"Hello, World!\")\n```\n\n你所只需要导入必要的 ZIO 类型，然后创建一个扩展了\
  \ ZIO 的 `ZIOAppDefault` 类型的 `object`。该类型被描述为 [ZIO runtime](https://zio.dev/reference/core/runtime)，它评估你程序的其余部分。快速回顾，只需：\n\
  \n* 创建一个扩展 `ZIOAppDefault` 的 `object`\n* 在该 `object` 内部定义 `run` 方法来启动你的应用程序\n* 然后程序的其余部分将作为\
  \ ZIO 应用程序被评估，你所有的方程/蓝图开始执行\n\n如果你深入研究 `ZIOAppDefault` 的源码，我怀疑你在那里某处会发现一个名为 `runUnsafe`\
  \ 的函数。\n\n## ZIO + Scala CLI 101\n\n在代码中，我 ZIO 的 `Console` 类型创建了最简单的 ZIO “Hello,\
  \ world”应用程序。为了进一步，将此代码保存为名为 `Hello1.scala` 的文件，创建一个完整的 Scala 3 + ZIO + Scala CLI\
  \ 应用程序：\n\n```scala\n//> using scala \"3\"\n//> using lib \"dev.zio::zio::2.0.2\"\
  \n// 像这样运行我：\n//     scala-cli Hello1.scala\n//     scala-cli Hello1.scala --watch\n\
  \nimport zio.{ZIOAppDefault, Console}\n\nobject Zio101 extends ZIOAppDefault:\n\
  \    def run = Console.printLine(\"Hello, World!\")\n```\n\n如注释所示，你在操作系统的命令行中使用\
  \ `scala-cli` 这样运行它：\n\n```bash\n$ scala-cli Hello1.scala\n```\n\n如果你以前没有用过 ZIO\
  \ —— 恭喜！你刚刚运行了第一个 Scala/FP ZIO 应用程序，如果你想想这本书从哪里开始，那是一项了不起成就。\n\n## ZIO + Scala CLI\
  \ 102\n\n下一个逻辑步骤是演示如何向你的应用程序添加一个 ZIO 变量：\n\n```scala\nimport zio.{ZIOAppDefault,\
  \ ZIO, Console}\nimport java.io.IOException\n\nobject Zio102 extends ZIOAppDefault:\n\
  \    val hello: ZIO[Any, IOException, Unit] =\n        Console.printLine(\"Hello,\
  \ World!\")\n    val run = hello\n```\n\n此应用程序中的第一个区别是我将 `hello` 创建为 `ZIO` 变量的实例：\n\
  \n```scala\nval hello: ZIO[Any, IOException, Unit] =\n```\n\n正如我之前提到的，思考 `ZIO` 类型的思维模型是它是工作流的描述，你可以将其视为一个函数，给定一个\
  \ `R` 就可以产生 `A` 或 `E`：\n\n```scala\nf(r: R): Either[E, A]\n```\n\n在在那段代码中：\n\n*\
  \ `R` 代表传入的环境\n* `E` 是错误类型\n* `A` 是成功类型\n\n\n\n同样因为假设代码可能会抛出异常，我将 `readLine` 代码封装在\
  \ `ZIO.attempt` 中。`attempt` 是一个 ZIO 工厂方法，当你真正尝试执行某个可能失败的操作时就会使用它。因为我们假设 `readLine`\
  \ 可能会失败，所以在这里我们使用了 `attempt`。\n\n正如你很快将看到的，在其他情况下，如果代码块实际上不会失败，我们将使用 `ZIO.succeed`\
  \ 而不是 `ZIO.attempt` 来封装该代码。（正如我提到的，ZIO 为各种情况提供了许多不同的工厂方法。）\n\n掌握了这一步后，我们的下一个小型 ZIO\
  \ 应用看起来如下：\n\n```scala\nimport zio.*\nimport scala.io.StdIn\n\nobject Zio103 extends\
  \ ZIOAppDefault:\n  // 新: 使用 `attempt` 封装可能失败的过程化代码\n  val username: ZIO[Any, Throwable,\
  \ String] =\n      ZIO.attempt(StdIn.readLine(\"What’s your name? \"))\n  val run\
  \ = username\n```\n\n如果你用 Scala CLI 运行这段代码，你会发现现在可以提示用户输入了。现在我们只需要使用他们的输入。\n\n##\
  \ ZIO 104: ZIO.attempt, ZIO.succeed\n\n如果我们假设已经有了用户的名字，现在我们需要一种方法以函数式的方式打印该名字。同样，我们假设\
  \ ZIO 的 `Console` 类型不存在，所以我们需要自己处理。为了这一点，我将回到书中大部分地方编写函数的方法：一种逐步步进的函数草拟过程。\n\n首先，我们知道最终想要使用\
  \ Scala 的 `println` 函数来打印某些文本。你可能还无法得知这一点，但因为我以前做过这件事，我知道我想创建一个基于 ZIO 的打印函数，它的开头如下：\n\
  \n```scala\ndef printName(name: String): ZIO[???] =\n  // 此处对 println 的使用\n```\n\
  \n这是一个接收 `String` 输入参数的函数，返回某种 `ZIO` 类型，并在体内部使用了 `println`。\n\n接下来，由于我已经提到了 `ZIO.succeed`，我将进入函数体内部，展示如何用它来封装\
  \ `println`：\n\n```scala\ndef printName(name: String): ZIO[???] =\n  ZIO.succeed(println(s\"\
  Hello, $name\"))\n```\n\n正如前面提到的，每当代码块不会失败时，只需封装在 `ZIO.succeed` 中即可。\n\n对我来说，`println`\
  \ 唯一失败的方法是计算机真的出了什么问题，所以它符合这个定义。更重要的是，它的函数签名并没有声明它会抛出异常。\n\n现在我们唯一做的就是填充函数返回的 `ZIO`\
  \ 类型。为了做到这一点，我们知道以下几点：\n\n- 函数不需要任何特殊环境（如数据库），因此它的类型是 `Any`。\n- 我们表示函数体不会失败——`println`\
  \ 不抛出任何异常——所以它的错误类型参数是 `Nothing`。在 ZIO 中，任何当函数体不会失败时，你都使用这个 Scala 类型。\n- 因为 `println`\
  \ 打印到 STDOUT，它具有 `Unit` 返回类型，并且因为这是函数的最终值，它就变成了函数的“成功”值，并用作第三个 `ZIO` 参数。\n\n基于上述思考过程，这里是完整的函数：\n\
  \n```scala\ndef printName(name: String): ZIO[Any, Nothing, Unit] =\n  ZIO.succeed(println(s\"\
  Hello, $name\"))\n```\n\n所以现在我们有了提示用户输入、读取输入以及打印输入的方法。现在我们只需要一种方法来按顺序调用这些函数。\n\n\
  ### Hello, flatMap\n\n在排除必要的 `import` 语句后，我将直接给出该问题的完整解决方案：\n\n```scala\nobject\
  \ Zio104 extends ZIOAppDefault:\n  val username: ZIO[Any, Throwable, String] =\n\
  \      ZIO.attempt(StdIn.readLine(\"What’s your name? \"))\n  def printName(name:\
  \ String): ZIO[Any, Nothing, Unit] =\n      ZIO.succeed(println(s\"Hello, $name\"\
  ))\n  val run = username.flatMap { name =>\n      printName(name)\n  }\n```\n\n\
  此解决方案中的新代码是：\n\n```scala\nval run = username.flatMap { name =>\n    printName(name)\n\
  }\n```\n\n以下是这段代码的关键点：\n\n- `run` 是通常的 `ZIOAppDefault` 代码。它表示：“运行 `=` 右侧的代码作为 ZIO\
  \ 应用。”\n- `flatMap` 是新的、有趣的部分。在 ZIO 中，`flatMap` 是用于运行函数式效果的**机制**。\n- 该语句的关键在于，`ZIO`\
  \ 被描述为“并发工作流的打印”。你可以认为任何 `ZIO` 效果——例如 `username` 和 `printName`——都可能并发运行。\n- 因此，`flatMap`\
  \ 是一种确保在并发环境中，先运行一个效果，然后将其输出传递给下一个运行的效果的方法。我们说这两个效果是按顺序运行的，这就是**顺序组合**。\n- 在示例中，使用\
  \ `flatMap` 意味着：“运行 `username`，当它完成后，将它的结果作为变量 `name` 传递给下一个运行的效果。”\n\n当你用 Scala\
  \ CLI 运行这段代码时，你会看到现在可以提示用户输入了：\n\n```\nWhat’s your name? Alice\nHello, Alice\n```\n\
  \n\n\n\n```\n             _    <- printName(name)\n          yield\n           \
  \  ()\n```\n\n当你运行这个新的 `Zio105` 应用时，你会发现它的工作方式和 `Zio104` 一一样：\n\n```\n$ scala-cli\
  \ Zio105.scala\nWhat’s your name? Alvin\nHello, Alvin\n```\n\n> 关于 `for` 表达式如何转换为一系列\
  \ `flatMap` 和 `map` 方法的更多细节，请参阅我的书籍[函数式编程简化版](https://alvinalexander.com/scala/functional-programming-simplified-book)。\n\
  \n# ZIO 106: ZIO 别名\n\n现在是在我将你们交给 ZIO（以及 Cats Effect）文档之前，需要演示的最后一个内容：ZIO 频繁使用 Scala\
  \ *类型别名*（这些常用的 ZIO 别名[在此记录](https://zio.dev/reference/core/zio/uio)）。\n\n### JIT：Scala\
  \ 类型别名\n\nScala *类型别名* 只是为另一种类型赋予新名称的方法，希望这个别名比原始类型更短和/或更有意义。在 Scala REPL 中，一个名为\
  \ `Money` 的类型别名的基础用法如下：\n\n```\nscala> type Money = Double\n// defined alias type\
  \ Money = Double\nscala> val oneDollar: Money = 1.00\nval oneDollar: Money = 1.0\n\
  ```\n\n当你处理金融应用时，使用类型名 `Money` 比 `Double` 更有意义，而 Scala 允许你这样做。（请记住，这是一个非常基础的示例，并没有显示真实世界应用所需的所有内容。）\n\
  \n### ZIO 中的类型别名\n\n根据 ZIO 类型别名文档，ZIO 类型别名 `UIO[A]` 是 `ZIO[Any, Nothing, A]` 的类型别名。\n\
  \n在任何情况下你都可以使用这个别名：(a) 环境不重要，(b) 错误类型不重要，唯一重要的类型是“成功类型”`A`。因此，ZIO 将此称为*非异常效果*（an\
  \ Unexceptional effect*），所以你可以替换我在 `Zio105` 中使用的这个 `ZIO` 返回类型：\n\n```\ndef printName(name:\
  \ String): ZIO[Any, Nothing, Unit] =\n                              -----------------------\n\
  ```\n\n使用别名 `UIO`：\n\n```\ndef printName(name: String): UIO[Unit] =\n          \
  \                   ---------\n```\n\n一旦你习惯了这种方法，我相信你会发现这是 [Scala 类型别名](https://alvinalexander.com/scala/scala-type-aliases-syntax-examples/)\
  \ 的极佳用法。\n\n所以现在，如果你将 `Zio105` 示例中 `printName` 签名中的 `ZIO` 返回类型替换为 `UIO` 返回类型并重新运行程序，你将看到之前完全相同的结果。（这是书籍\
  \ Github 仓库中的 `Zio106`。）\n\n现在，在我离开之前，这里是常见的 ZIO 2 类型别名：\n\n```\nALIAS         ORIGINAL/FULL\
  \ TYPE\n----------    ----------------------\nIO[E, A]      ZIO[Any, E, A]\nTask[A]\
  \       ZIO[Any, Throwable, A]\nRIO [R, A]     ZIO[R, Throwable, A]\nUIO [A]   \
  \    ZIO[Any, Nothing, A]\nURIO[R, A]    ZIO[R, Nothing, A]\n```\n\n我喜欢把类型视为运行某个任务的代码，所以\
  \ `Task` 别名是一个值得关注的项。\n\n如所示，`Task[A]` 是 `ZIO[Any, Throwable, A]` 的别名，这意味着：\n\n\
  * `Task` 对其环境没有要求 (`Any`)，\n* 它可以抛出异常 (`Throwable`)，并且\n* 如果它成功，它将返回一个类型为 `A` 的结果。\n\
  \n关于使用这些类型别名的更多信息，请参阅 [ZIO 类型别名文档](https://zio.dev/reference/core/zio/uio)。\n\n\
  # 接下来是什么？\n\n我可以很乐意写一整本书关于 ZIO 和 Cats Effect，但遗憾的是，时候该把你们交给他们的网站了：\n\n* [ZIO](https://zio.dev)\n\
  * [Cats Effect](https://typelevel.org/cats-effect)\n\n正如我在书开头提到的，这本书的原因是，\n\n\n\n\
  \n\n你真的需要确保你的“提示用户”代码发生在“读取其输入”代码之前：\n\n```\nval input = readInput()\n```\n\n为了使其具有意义，这些操作必须按顺序发生，一个接一个执行。在\
  \ Haskell 中，你使用它的 `do` 结构来确保表达式按顺序运行；而在 Scala 中，你同样在 `for` 表达式中对它们进行顺序化，如下所示：\n\n\
  ```\nfor\n  _     <- promptUser()\n  input = readInput()\n  // 这里有更多代码 ...\n```\n\
  \n如果你记得 `ZIO` 类型是一个“描述并发工作流的蓝图”，你应该想：“如果 `promptUser` 和 `readInput` 同时运行，我需要使用 `for`\
  \ 表达式或 `flatMap` 来确保这两个函数按照正确的顺序被调用。”\n\n正因如此，有些人将单子 ad（monads）称为“函数式编程中的分号”。它们让我们以保证的顺序运行副作用，因此即使我们的函数旨在并行运行，`flatMap`\
  \ 和 `for` 表达式也能保证它们是有顺序执行的，就像过程化代码一样。\n\n# Scala 中的 Monad\n\n但再次强调，Scala 的关键在于这些单子数据类型在类内部正确地实现了\
  \ `map` 和 `flatMap` 方法，这正是让它们能够在 `for` 表达式使用的原因。我在在这两个资源中详细阐述了这一点：\n\n*   我的博客文章，[如何编写一个可以在\
  \ for 表达式使用的 Scala 类](https://alvinalexander.com/scala/fp-book/how-to-write-class-used-in-for-expression/)\n\
  *   我的畅销 FP 书籍，[函数式编程，简化版](https://alvinalexander.com/scala/functional-programming-simplified-book)\n\
  \n# 范畴论\n\n对于对 monad（单子）、monoid（半群）、functor（函子）等具有特殊名称的 FP 术语背后理论感兴趣的人，你想要深入研究的内容是范畴论（这也是“Cats\
  \ Effect”名称的来源）。\n\n你可以在以下位置找到名为《程序员范畴论》（Category Theory for Programmers）的书的免费版：\n\
  \n*   [一个 Github 仓库](https://github.com/hmemcpy/milewski-ctfp-pdf)\n*   [一系列在线博客文章](https://bartoszmilewski.com/2014/10/28/category-theory-for-programmers-the-preface/)\n\
  \n正如我在这书中展示的，你不需要理解范畴论来理解 FP，但当你想知道像“map”这样的名称源自何处，范畴论正是你寻找的。\n\n# 附录 A. Scala 3\
  \ 快速查表\n\n假设你不熟悉 [Scala 3](https://scala-lang.org/)，这里有一份涵盖其许多主要特快速查表。不过，如果你想看到更多关于\
  \ Scala 3 的细节，请参：\n\n*   免费的在线 [Scala 3 教程](https://docs.scala-lang.org/scala3/book/introduction.html)\n\
  *   我的书籍，快速学习 Scala 3！](https://alvinalexander.gumroad.com/l/learn-scala3-fast)\n\
  *   [Scala 食谱（第二版）](https://amzn.to/3du1pMR)\n\n## 核心概念\n\n这些是关于 Scala 3 编程语言的主要点或核心概念：\n\
  \n*   它是一种高级编程语言（类似于 Java、Kotlin 等）\n*   它是富有表现力的，具有简洁、易读的语法（类似于 Kotlin）\n*   一个区别性特征是它促进了\
  \ OOP 和 FP 的融合\n*   它是静态类型的，但感觉是动态的\n*   它有一套复杂的类型推断系统，因此你很少需要显式声明变量类型\n*   函数是一的一等公民值，就像字符串、整数和其他类型一样\n\
  *   偏于使用不可变数据结构，但也提供可变数据结构\n*   Scala 2 非常一致，而 Scala 3 的一致性高得惊人\n*   它与其他 JVM 库（Java、Kotlin\
  \ 等）无缝衔接\n\n更多信息：\n\n*   随着几年前 Scala.js 的创建，Scala 可以用作 JavaScript 的替代品\n*   随着 Scala\
  \ Native（以及 GraalVM）的创建，你可以创建二进制可执行文件\n*   新的 [Scala CLI](https://scala-cli.virtuslab.org)\
  \ 工具让快速上手 Scala 变得简单\n*   Scala 3 的偏好是使用显著缩进作为默认，但如果你喜欢，也可以使用大括号\n\n从个人角度来看，我预计在十年内几乎每种流行的编程语言都会支持显著缩进。在我看来，它让你的代码变得更整洁、更容易阅读。\n\
  \n## OOP 支持\n\nScala 是一个完整的 OOP 语言，完全支持：\n\n*   类 (Classes)\n*   特质 (Traits / 接口)\n\
  *   继承\n*   多态\n*   Scala 中的每个值都是类的实例\n\n## FP 支持\n\nScala 是一个完整的 FP 语言，完全支持：\n\n\
  *   作为值的函数\n*   高阶函数\n*   Lambda 表达式\n*   一切都是返回值的表达式\n*   不可变（代数）变量\n*   不可变集合（数据结构），带有数十种内置函数式方法\n\
  \n## Hello world\n\n最基本的 Scala 3 \"Hello, world\" 示例：\n\n```\n@main def hello =\
  \ println(\"Hello, world\")\n```\n\n同样的内容，但使用了一个变量：\n\n```\n@main def hello =\n\
  \  val w = \"world\"\n  println(s\"Hello, w\")\n```\n\n\n\n\n```scala\n// 更多月份 ...\n\
  case 11 => \"November\"\ncase 12 => \"December\"\ncase _  => \"Invalid month\" \
  \ // 默认值，匹配所有\n\n// 用于副作用：\ni match\n  case 1 | 3 | 5 | 7 | 9  => println(\"odd\"\
  )\n  case 2 | 4 | 6 | 8 | 10 => println(\"even\")\n\n// 用 'match' 写的函数：\ndef isTrueInPerl(a:\
  \ Matchable): Boolean = a match\n  case false | 0 | \"\" => false\n  case _ => true\n\
  ```\n\n注意：还有*许多*其他使用 `match` 表达式的方法。\n\n### try/catch/finally\n\nScala 的 `try`/`catch`/`finally`\
  \ 表达式与 Java 类似，但它们也是返回值的表达式：\n\n```scala\ndef readTextFile(filename: String): Option[List[String]]\
  \ =\n  try\n      Some(Source.fromFile(filename).getLines.toList)\n  catch\n   \
  \ case e: Exception => None\n  finally\n      // 在此处关闭任何资源\n```\n\n## Functions\n\
  \nScala 函数和方法通过 `def` 关键字创建。它们可以写在一行，也可以写成任意行数：\n\n```scala\ndef sum(a: Int, b:\
  \ Int): Int = a + b\n\ndef max(a: Int, b: Int): Int =\n  // 在此处写下你需要的行数\n  if a\
  \ > b then a else b\n```\n\n### 默认参数值\n\n函数参数可以有默认值：\n\n```scala\ndef getUrlData(\n\
  \    url: String,\n    connectionTimeout: Int = 5_000,\n    readTimeout: Int = 5_000\n\
  ): String =\n  println(s\"cTimeout = $connectionTimeout, rTimeout = $readTimeout\"\
  )\n  // 你的真实代码在这里\n  \"Here’s the data!\"\n\ngetUrlData(\"https...\")          \
  \         // cTimeout = 5000, rTimeout = 5000\ngetUrlData(\"https...\", 2_500) \
  \           // cTimeout = 2500, rTimeout = 5000\ngetUrlData(\"https...\", 10_000,\
  \ 10_000)   // cTimeout = 10000, rTimeout = 10000\n```\n\n### 接受函数参数的函数\n\n三步过程。\n\
  \n[1] 定义接受其他函数作为输入参数的函数：\n\n```scala\n// callback 是一个“函数输入参数” (FIP):\ndef sayHello(callback:\
  \ () => Unit): Unit =\n  callback()\n\n// 这定义了一个 FIP，它 (a) 没有输入参数且\n// (b) 无返回值（Unit\
  \ 类似于 void）：\ndef sayHello(callback: () => Unit): Unit =\n                     \
  \     ----------\n```\n\n[2] 定义其他函数：\n\n```scala\ndef helloAl(): Unit =\n  println(\"\
  Hello, Al\")\n\ndef holaLorenzo(): Unit =\n  println(\"Hola, Lorenzo\")\n```\n\n\
  [3] 将这些传递给 `sayHello`：\n\n```scala\nsayHello(helloAl)        // 打印 \"Hello, Al\"\
  \nsayHello(holaLorenzo)    // 打印 \"Hola, Lorenzo\"\n```\n\n（关于这如何工作的更多细节，请参阅 [函数式编程简明教程](https://alvinalexander.com/scala/functional-programming-simplified-book)。）\n\
  \n## Functional error handling\n\nScala 有函数式错误处理和错误处理数据类型的概念。\n\n- 函数*不应该*抛出异常\n\
  - *应该*返回函数式错误处理类型：\n    - `Option`\n    - `Try`\n    - `Either`\n\n这在书中的许多地方都有体现，例如\
  \ `makeInt` 函数：\n\n```scala\ndef makeInt(s: String): Option[Int] =\n  try\n    \
  \  Some(s.toInt)\n  catch\n    case e: Exception => None\n```\n\n## Domain Modeling\
  \ (MD)\n\n当以 OOP 风格编程时，你将使用这些构造：\n- Traits（特征 trait）\n- Enums（枚举）\n- Classes（类）\n\
  \n示例：\n\n```scala\nclass Person(val name: String, age: Int)\n\nclass Person(val\
  \ name: String, age: Int)\n  override def toString = s\"$name is $age old\"\n```\n\
  \n当以 FP 风格编程时，你将使用这些构造：\n- Traits（特征 trait）\n- Enums（枚举）\n- Case classes（样例类）\n\n\
  ### DM: Classes\n\nOOP 风格的类拥有通过 `var` 创建的参数，因此它们可以被改变（变异）：\n\n```scala\n// 单行：\n\
  class Person(var firstName: String, var lastName: String)\n\n// 当它变长时：\nclass Person(\n\
  \  var firstName: String,\n  var lastName: String\n)\n```\n\n创建一个新实例，然后访问并变异它的参数/字段：\n\
  \n```scala\nval p = Person(\"Reginald\", \"Dwight\")\n// 访问字段：\nprintln(p.firstName)\
  \  // \"Reginald\"\nprintln(p.lastName)  // \"Dwight\"\n\n// 变异它们：\np.firstName\
  \ = \"Elton\"\np.lastName = \"John\"\n\n// 打印新值：\nprintln(p.firstName)  // \"Elton\"\
  \nprintln(p.lastName)  // \"John\"\n```\n\n带有一些枚举的类：\n\n```scala\nenum CrustSize:\n\
  \  case Small, Medium, Large\n\nenum CrustType:\n  case Thin, Thick, Regular\n\n\
  enum Topping:\n  case Cheese, Pepperoni\n```\n\n一个带有一些枚举的类：\n\n```scala\nenum CrustSize:\n\
  \  case Small, Medium, Large\n\nenum CrustType:\n  case Thin, Thick, Regular\n\n\
  enum Topping:\n  case Cheese, Pepperoni\n\nclass Pizza(\n  var toppings: List[Topping],\n\
  \  var size: CrustSize\n\n\nclass Person(\n  var firstName: String,\n  var lastName:\
  \ String\n)\n```\n\n创建一个新实例，然后访问并变异它的参数/字段：\n\n```scala\nval p = Person(\"Reginald\"\
  , \"Dwight\")\n// 访问字段：\nprintln(p.firstName)  // \"Reginald\"\nprintln(p.lastName)\
  \  // \"Dwight\"\n\n// 变异它们：\np.firstName = \"Elton\"\np.lastName = \"John\"\n\n\
  // 打印新值：\nprintln(p.firstName)  // \"Elton\"\nprintln(p.lastName)  // \"John\"\n\
  ```\n\n一个带有一些枚举的类：\n\n```scala\nenum CrustSize:\n  case Small, Medium, Large\n\n\
  enum CrustType:\n  case Thin, Thick, Regular\n\nenum Topping:\n  case Cheese, Pepperoni\n\
  \nclass Pizza(\n  var toppings: List[Topping],\n  var size: CrustSize\n\n```\n\n\
  创建一个新实例，然后访问并变异它的参数/字段：\n\n```scala\nval p = Person(\"Reginald\", \"Dwight\")\n\
  // 访问字段：\nprintln(p.firstName)  // \"Reginald\"\nprintln(p.lastName)  // \"Dwight\"\
  \n\n// 变异它们：\np.firstName = \"Elton\"\np.lastName = \"John\"\n\n// 打印新值：\nprintln(p.firstName)\
  \  // \"Elton\"\nprintln(p.lastName)  // \"John\"\n```\n\n一个带有一些枚举的类：\n\n```scala\n\
  enum CrustSize:\n  case Small, Medium, Large\n\nenum CrustType:\n  case Thin, Thick,\
  \ Regular\n\nenum Topping:\n  case Cheese, Pepperoni\n\nclass Pizza(\n  var toppings:\
  \ List[Topping],\n  var size: CrustSize\n```\n\n创建一个新实例，然后访问并变异它的参数/字段：\n\n```scala\n\
  val p = Person(\"Reginald\", \"Dwight\")\n// 访问字段：\nprintln(p.firstName)  // \"\
  Reginald\"\nprintln(p.lastName)  // \"Dwight\"\n\n// 变异它们：\np.firstName = \"Elton\"\
  \np.lastName = \"John\"\n\n// 打印新值：\nprintln(p.firstName)  // \"Elton\"\nprintln(p.lastName)\
  \  // \"John\"\n```\n\n一个带有一些枚举的类：\n\n```scala\nenum CrustSize:\n  case Small, Medium,\
  \ Large\n\nenum CrustType:\n  case Thin, Thick, Regular\n\nenum Topping:\n  case\
