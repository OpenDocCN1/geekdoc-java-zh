  \ List[Int]()                // List[Int] = List()\nval letters = ('a' to 'f').toList\
  \      // List(a, b, c, d, e, f)\nevens.contains(2)                     // true\n\
  firstTen.containsSlice(List(3,4,5))  // true\nfirstTen.count(_ % 2 == 0)       \
