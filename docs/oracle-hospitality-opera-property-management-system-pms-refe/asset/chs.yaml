  TO_CHAR (v.Arrival,'DD / MM') arrival,\nTO_CHAR (v.Departure,'DD / MM') departure,\
  \ TO_CHAR (v.Departure_time) departure_time,,CASE WHEN r.hk_status<>r.fo_status\
  \ THEN 'AND' ELSE 'N' END isdiscrepancy\nFROM OPERA.ROOM r\nINNER JOIN OPERA.ROOM_CATEGORY_TEMPLATE\
  \ c ON (r.Room_category=c.Room_category) \nLEFT JOIN (\nSELECT r.room, MIN (r.resv_status)\
  \ resv_status, min (r.arrival) arrival, max (r.departure) departure, max (r.departure_time)\
  \ departure_time\nFROM reservation_general_view r\nWHERE r.trunc_departure> =pms_p.business_date\
  \ and r.room is not null\nAND r.resv_status IN ('CHECKED IN','CHECKED OUT')\nGROUP\
  \ BY r.room\n) v ON (v.room=r.room)\nWHERE SUITE_TYPE<>'PSUEDO' \nAND to_number\
  \ (r.Floor)=4--FLOOR\nORDER BY to_number (r.Floor) ASC, to_number (r.Room) ASC\n\
  ```\n\n![](img/image00465.jpeg)\n\n从手机设备显示的查询房间状态的 Web 系统界面所示：\n\n![](img/image00466.jpeg)\
  \ ![](img/image00467.jpeg)\n\n## 差异 (Discrepancies)\n\n在 Opera 的“房间差异”（Room Discrepancy）报告中可以观察到差异：\n\
  在 PMS 模块中，进入“其他”（Miscellaneous）菜单，“报告”（Reports）子菜单，寻找“房间差异”报告并点击“确定”。\n\n![](img/image00468.jpeg)\n\
  \n系统将显示“报告参数”（Report Parameters）屏幕，在此屏幕上选择您想要查看的“房间状态”（Room Status）。\n\n![](img/image00469.jpeg)\n\
  \n在“房间状态”选择中，观察 2 种差异状态：\n\n![](img/image00470.jpeg)\n\n- **跳过/睡眠睡差异 (Skip / Sleep\
  \ Discrepant)**：基于房间状态的差异。\n- **人数差异 (Persons Discrepant)**：基于每个房间客人数量的差异。\n\n在此示例中，我们选择了“所有房间”（ALL\
  \ Rooms），它将向我们显示物业的所有差异。\n\n![](img/image00471.jpeg)\n\n请注意，如果 FO Status 字段与 HK\
  \ Status 字段不同，就会出现跳过或睡眠差异。\n\n房间状态出现差异的原因如下：\n\n- **睡眠 (Sleep)**：\n  - `FO_STATUS`\
  \ 指明 `VAC`（前台登记客人办理退房）\n  - `HK_STATUS` 指明 `OCC`（客房表示房间内有人）\n- **跳过 (Skip)**：\n\
  \  - `FO_STATUS` 指明 `OCC`（客人在未正式退房的情况下离开房间）\n  - `HK_STATUS` 指明 `VAC`（客房表示房间已空闲）\n\
  \n要解决差异，进入房间管理（Rooms Management）菜单，选择“客务”（Housekeeping）项，将显示带有可用选项的客务屏幕。我们选择“房间差异”（Rm.\
  \ Discrepancies）选项。\n\n![](img/image00472.jpeg)\n\n在“房间差异”屏幕中，你可以看到“FO Status”（前台状态）和“HK\
  \ Status”（客房状态）字段之间的状态差异，要解决此差异，两种状态必须匹配。\n\n![](img/image00473.jpeg)\n\n## Opera\
  \ PMS 中分配给交易代码的会计科目\n\n重要的是，我们在“账单”（Billing）中进行“过账”（Post）操作期间使用的“交易代码”（Transaction\
  \ Codes）与居住地国家税务管理部门要求我们提供的某些会计科目相关联。\n\n![](img/image00474.jpeg) ![](img/image00475.jpeg)\n\
  \n要显示“交易代码”与会计科目之间的对应关系或映射，它们显示在“后台接口交易代码映射”（BackOffice Interface Transaction Codes\
  \ Mapping）报告中显示。在“其他”（Miscellaneous）菜单中，进入“报告”（Reports）选项。\n\n![](img/image00476.jpeg)\n\
  \n在“报告”屏幕中，寻找报告“后台接口交易代码映射”，然后点击确定，系统将预览显示“交易代码”与会计科目之间的对应关系。\n\n![](img/image00477.jpeg)\
  \ ![](img/image00478.jpeg)\n\n如果你需要为某个交易代码分配某个账户，进入“外部”（External）菜单，“前台”（Back Office）子菜单，“配置”（Configuration）选项。\n\
  \n![](img/image00479.jpeg)\n\n在“前台”屏幕中，选择“交易代码”并点击。\n\n![](img/image00480.jpeg)\n\
  \n将显示“交易代码”屏幕，选择。\n\n![](img/image00481.jpeg)\n\n将显示分配账户的屏幕，选择相应的。\n\n![](img/image00482.jpeg)\n\
  \n## Opera PMS 中更改房间类型\n\n这将显示更改房间类型的操作。\n为了更改物业的房间类型，我们过滤出未预订且空空的房间。\n\n```sql\n\
  SELECT r.room, r.room_status, r.hk_status, c.label, c.short_description,\nCASE WHEN\
  \ NVL (v.Resv_status,'F')='CHECKED IN' THEN 'CI' WHEN NVL (v.Resv_status,'F')='CHECKED\
  \ OUT' THEN 'CO' ELSE '' END resv_status,\nTO_CHAR (v.Arrival,'DD / MM') arrival,\n\
  TO_CHAR (v.Departure,'DD / MM') departure, TO_CHAR (v.Departure_time) departure_time,,CASE\
  \ WHEN r.hk_status<>r.fo_status THEN 'AND' ELSE 'N' END isdiscrepancy\nFROM OPERA.ROOM\
  \ r\nINNER JOIN OPERA.ROOM_CATEGORY_TEMPLATE c ON (r.Room_category=c.Room_category)\
  \ \nLEFT JOIN (\nSELECT r.room, MIN (r.resv_status) resv_status, min (r.arrival)\
  \ arrival, max (r.departure) departure, max (r.departure_time) departure_time\n\
  FROM reservation_general_view r\nWHERE r.trunc_departure> =pms_p.business_date and\
  \ r.room is not null\nAND r.resv_status IN ('CHECKED IN','CHECKED OUT')\nGROUP BY\
  \ r.room\n) v ON (v.room=r.room)\nWHERE SUITE_TYPE<>'PSUEDO' \nAND to_number (r.Floor)=4--FLOOR\n\
  ORDER BY to_number (r.Floor) ASC, to_number (r.Room) ASC\n```\n\n![](img/image00483.jpeg)\n\
  \n在“工具”（Utilities）模块中，进入“工具”（Utilies）菜单，“配置”（Config）子菜单，“房间”（Rooms）项。\n\n![](img/image00484.jpeg)\n\
  \n在“房间列表”表中，我们可以验证想要更改状态的状态。\n\n![](img/image00485.jpeg)\n\n在“工具”（Utilities）中，进入“属性”（Property）菜单，“配置”（Config）子菜单。\n\
  \n![](img/image00486.jpeg)\n\n屏幕将出现。在此屏幕上选择要更改房间类型的房间号，重要的是房间只有在处于以下状态时才能更改：\n\n\
  - FO_STATUS: 空\n- ROOM_STATUS: 已检查\n\n指定房间号并选择新的房间类型。\n\n![](img/image00487.jpeg)\n\
  \n如果房间已入住或已预订，将显示相应的错误信息，从而阻止重新分配房间类型。\n\n![](img/image00488.jpeg)\n\n我们在房图（Room\
