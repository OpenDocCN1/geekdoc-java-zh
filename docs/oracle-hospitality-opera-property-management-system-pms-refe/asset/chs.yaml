  \ = rsd.company_id\norder by BUSINESS_DATE,room\n```\n\n### 按市场代码预测\n\n```sql\n\
  SELECT\n    CONSIDERED_MONTH,\n    CONSIDERED_YEAR,\n    CONSIDERED_DATE,\n    MARKET_GROUP,\n\
  \    MARKET_GROUP_DESC,\n    MARKET_CODE,\n    NO_ROOMS,\n    ROOM_REVENUE\nFROM\n\
  \    to_char(rsf.considered_date,'MONTH') CONSIDERED_MONTH,\n    to_char(rsf.considered_date,'RRRR')\
  \ CONSIDERED_YEAR,\n    mc.parent_market_code MARKET_GROUP,\n    mg.description\
  \ MARKET_GROUP_DESC,\n    rsf.market_code MARKET_CODE,\n    rsf.considered_date\
  \ CONSIDERED_DATE,\n    decode(rsf.room_category,-1,rsf.no_rooms) NO_ROOMS,\n  \
  \  rsf.net_room_revenue ROOM_REVENUE\nFROM\nrep_res_statistics_forecast rsf, markets\
  \ mc, market_groups mg\nWHERE\nyear(rsf.CONSIDERED_DATE) =2019\nAND (mc.parent_market_code\
  \ = mg.market_group AND rsf.market_code = mc.market_code)\n```\n\n### 活动搜索 - 执行人员和客人的备注\n\
  \n```sql\nSELECT a.salesrep,a.insert_date, a.act_type, a.purpose,a.acc_name, a.con_name,\
  \ a.notes,a.problem_desc\nFROM activity_search a\nWHERE a.insert_date>= sysdate-1\n\
  ORDER BY a.insert_date\n```\n\n### 取消的订单\n\n```sql\nSELECT a.nights*a.share_amount\
  \ as trevenue, a.nights,b.srep_code,a.rate_code,a.sfirst_guest_name || '|| a.guest_name\
  \ as nombres, a.trunc_arrival, a.trunc_departure,\nb.name,a.cancellation_reason_desc\n\
  FROM reservation_general_view a, name_view b\nWHERE a.resv_status='CANCELLED'\n\
  and a.booked_room_category_label<>'PM'\nand substr(a.cancellation_date,1,11)>=TO_CHAR(SYSDATE-10)\n\
  and b.name_id = decode(a.company_id,null,a.travel_agent_id,a.company_id)\nORDER\
  \ BY a.trunc_arrival\n```\n\n### 按公司的联系人\n\n```sql\nSELECT a.name as Apellidos,a.first\
  \ as Nombre,a.udfc10 ,a.udfd11 as sexo,a.title as Trato,\na.business_title as Cargo,a.email,a.name_id\
  \ as Key_con_Cia,a.company Razon_Social,a.udfc12 as Nbr_Comercial,\na.address1 as\
  \ Direccion,a.city as Distrito, a.udfc13 as Rubro, a.srep_code as Owner,a.phone_no\
  \ as Telefono,\na.mobile_phone_number as Celular,a.udfc14,a.udfc15,a.udfc16,a.udfc01\
  \ as DClub\nFROM name_view a\nWHERE a.tracecode='CON' and a.active_yn='Y' and a.country='PE'\n\
  ORDER BY a.name\n```\n\n### 在 Material Controls Micros Fidelio 中创建价值实物账\n\n```sql\n\
  create or replace PROCEDURE SP_KARDEX_FISICO_VALORADO(\nvn_kst_id IN MCDATA.KOSTST.KST_ID%TYPE,\n\
  vn_art_id IN MCDATA.ARTIKEL.ART_ID%TYPE,\nvs_tipo IN CHAR,\nvs_fec_ini IN varchar2,\n\
  vs_fec_fin IN varchar2,\nP_OUT_ID_GTT_KARDEX OUT NUMBER\n)\nIS\n-------------------------------------------------------------------------------\n\
  -- 生成价值实物账 (KARDEX) 过程\n-- 版本 : Micros Fidelio :: Materials Control v 8.6.5\n-------------------------------------------------------------------------------\n\
  CURSOR SC_ARTICULOS IS\n--采购或退货\nSELECT K.KST_ID,\nK.KST_ADRES,\nK.KST_NAME,\nI.ART_ID,\n\
  A.ART_NUMMER AS ART_COD,\nA.ART_NAME,\nunidad_code_sunat(A.VPK_NR) VPK_NR,\nVP.VPK_NAME,\n\
  A.ART_INFO,\nI.WES_TYP,\n'01' AS TIPO_OPE,\nI.WES_ID1,\nI.WES_ID2,\nL.lfs_datum\
  \ WES_DOCDATE,\nDECODE(L.LFS_STATUS,42,\n(.._NAME(L.LFS_ID),1,3)\n WHEN 'F' THEN\
  \ '01' --发票\n WHEN 'B' THEN '03' --小票\n WHEN 'LC' THEN '04' --采购结算\n WHEN 'NCP'\
  \ THEN '07' --贷记单\n WHEN 'NDP' THEN '08' --借记单\n WHEN 'GRE' THEN '09' --发货运单\n WHEN\
  \ 'TK' THEN '12' --票据\n WHEN 'RET' THEN '20' --退货\n WHEN 'GT' THEN '31' --运输单\n\
  \ WHEN 'OT' THEN '99' --其他\n WHEN 'I' THEN '16' --库存\nELSE '01'\n END),\n(CASE TRIM(SUBSTR(TRIM(L.LFS_NAME),1,3))\n\
  ```\n\n\n\n\n\n```sql\nWHEN  'F' THEN  '01'  --FACTURA\n WHEN  'B' THEN  '03'  --BOLETA\
  \ DE VENTA\n WHEN  'LC' THEN  '04'  --LIQUIDACIÓN DE COMPRA\n WHEN  'NCP'  THEN\
  \  '07'  --NOTA DE CREDITO\n WHEN  'NDP'  THEN  '08'  --NOTA DE DEBITO\n WHEN  'GRE'\
  \  THEN  '09'  --GUÍA DE REMISIÓN Remitente\n WHEN  'TK' THEN  '12'  --TICKET\n\
  \ WHEN  'RET'  THEN  '20'  --Retencion\n WHEN  'GT' THEN  '31'  --GUÍA DE REMISIÓN\
  \ Transportista\n WHEN  'OT' THEN  '99'  --Otros\n WHEN  'I' THEN  '16'  --INVEMTARIO\n\
  \ ELSE  '01'\n END))AS TIPO_DOC,\n      DECODE(L.LFS_STATUS,42,SUBSTR(MCDATA.F_FACT_NAME(L.LFS_ID),2,3),SUBSTR(L.LFS_NAME,2,3))\
  \ AS SERIE_DOC,\n      DECODE(L.LFS_STATUS,42,SUBSTR(MCDATA.F_FACT_NAME(L.LFS_ID),6,LENGTH(MCDATA.F_FACT_NAME(L.LFS_ID))),SUBSTR(L.LFS_NAME,6,LENGTH(L.LFS_NAME)))\
  \ AS NRO_DOC,\n      ROUND(I.WES_MENGE,4) AS CANT_COMPRA,\n      ROUND(I.WES_ESP,4)\
  \ AS COST_UNI_COMPRA,\n      ROUND(I.WES_MENGE * I.WES_ESP,4) AS COST_TOT_COMPRA,\n\
  \ 0.00  AS CANT_VENTA,\n 0.00  AS COST_UNI_VENTA,\n 0.00  AS COST_TOT_VENTA,\n \
  \     I.WES_VKP,\n      L.LFS_STATUS,\n      (SELECT NVL(COUNT(1),0)\nFROM MCDATA.LIEFERPOS\
  \ T\n WHERE T.LFP_MENGE <  0  AND T.LFP_STATUS <>  64\n AND T.LFS_ID = L.LFS_ID)\
