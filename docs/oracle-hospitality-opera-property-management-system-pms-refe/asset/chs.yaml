- "# Oracle Hospitality OPERA 酒店管理系统 (PMS) 参考手册 - 酒店软件培训支持与 Java JEE AWS Amazon云开发精通：参考手册手册\n\
  \n\n\n![](img/cover00493.jpeg)\n\n\n# 从 Opera PMS 中开具凭证、发票和票据\n\n为了开具票据（Ballot），我们必须验证客户个人资料中的\
  \ `Tax Type`（税务类型）字段为 `TICKET`。\n\n进入菜单 `Front Desk`（前台）选项 `In House Guests`（住客），列出所有入住酒店的客户。\n\
  \n![](img/image00344.jpeg)\n\n在`In House Guest`界面上，选择想要验证其个人资料 `Tax Type` 的客户，并选择单选按钮\
  \ `Profile`（资料）。\n\n![](img/image00345.jpeg)\n\n`Individual Profile`（个人资料）界面显示最重要的客户数据。在此界面上，选择`More\
  \ Fields`（更多字段）按钮。\n\n![](img/image00346.jpeg)\n\n在`More Fields`界面上，确保 `Tax Type`\
  \ 字段已标记为 `TICKET` 选项，并选择 `OK` 按钮。\n\n![](img/image00347.jpeg)\n\n返回`Individual Profile`界面后，选择`Save`（保存）按钮以保存所做的更改，然后点击\
  \ `Ok` 和 `Close` 按钮。\n\n通过这种方式我们确保客户的 `Tax Type` 为 `TICKET`，这将允许我们生成付款类型为 `Ticket`\
  \ 的收据。\n\n进入菜单 `Cashiering`（收银）选项 `Billing`（账单），显示可以为任何住宿、消费或服务概念生成付款证明的住客客户。\n\n\
  在此之前，将显示`Login`（登录）界面以请求 `ATM` 访问凭据。\n\n![](img/image00348.jpeg)\n\n在`In House Guest\
  \ Search`（住客搜索）界面上，筛选`Due Outs`（待结账）记录，这些记录是尚未离开的客户、正在入住并消费酒店提供的服务的客户，必须为他们生成付款收据（在这种情况下为票据）。\n\
  \n选择`Due Outs`选项并点击`Search`按钮。\n\n![](img/image00349.jpeg)\n\n在`House Guest Search`（住客搜索）界面上，选择您想要生成付款单的客户记录，然后点击`Select`按钮。将显示`Billing`界面。\n\
  \n![](img/image00350.jpeg)\n\n在`Billing`界面上显示客户的账户详情。需要指出，在此界面上最多可以有 8 个窗口（Windows），这些窗口允许我们对客户账户分类并为每个窗口生成收据。\n\
  \n让我们观察窗口 `(02)`有一个尚未支付的`140.80 USD`账户，窗口 `(03)`有一个通过`VISA`付款方式支付的`32.00 USD`账户。\n\
  \n选择窗口 `(02)`并点击`Check Out`（结）按钮，将显示`Payment`界面。\n\n![](img/image00351.jpeg)\n\n\
  在`Payment`界面上，选择`Payment Code`（付款代码）为`Cash Dollars`，`Currency`（货币）选项为`USD`，在`Amount`字段中输入金额`140.80`，在`Reference`字段输入账户描述，然后点击`Post`（过账）按钮，付款将加载到系统中并关闭账户。\n\
  \n![](img/image00352.jpeg)\n\n在下一个弹窗界面中指示`No`，以便将收据发送到您所在国家的数字税务文件开具程序（或中央税务管理局的电子发票）。\n\
  \n![](img/image00353.jpeg) ![](img/image00354.jpeg)\n\n这种将收据发送到您所在国家的数字税务文件开具程序（或中央税务管理局的电子发票）的过程允许我们生成付款类型为\
  \ `Ticket` 的收据。\n\n\n\n\n\n例如，如果某类别的客房在入住率超过 10% 之前以折扣出售，一旦超过此入住百分比，折扣将取消，剩余的 90%\
  \ 将按无折扣价格出售。\n\n我们希望此限制适用于 `05/01/2019` 到 `05/31/2019` 之间的入住，我们希望控制 3 月和 4 月期间的限制，即从\
  \ `03/01/2019` 到 `04/30/2019`。\n\n在 Opera 中，我们进入配置模块。\n\n![](img/image00371.jpeg)\n\
  \n然后我们选择 `Rate Strategy`（房价策略）选项。\n\n![](img/image00372.jpeg)\n\n在 `Rate Strategy`\
  \ 屏幕上，我们将根据建立的条件定义房价策略。\n\n您应该始终定义两个策略记录：房价策略及其对应的对应策略。换句话说，房价是针对入住率高于 10% 的预订定义的，而针对入住率低于\
  \ 10% 的预订定义房价策略注册。\n\n针对特定定价代码 `CRESP` 的房价策略。\n\n![](img/image00373.jpeg)\n\n适用于\
  \ `2019 年 5 月 1 日` 到 `2019 年 5 月 31 日` 之间的入住或到达\n\n![](img/image00374.jpeg)\n\n\
  这些订单在 `3 月 1 日` 到 `4 月 30 日` 之间进行销售或预订，我们还要定义其对应的限制策略\n\n![](img/image00375.jpeg)\n\
  \n因此，在 `Rate` 屏幕上，`Strategy` 对每个房价限制必须有 2 条记录。\n\n![](img/image00376.jpeg)\n\n然后我们在预订时测试定义的房价策略。\n\
  \n# Opera PMS 中通过贷单制作贷记（Credit Notes）\n\n我们将通过 `CREDIT BILL`（贷单）制作贷记，进入 `Cashiering`（收银）菜单，`Cashier\
  \ Functions`（收银功能）选项。将显示 `Cashier Functions` 表单。\n\n![](img/image00377.jpeg)\n\n\
  ![](img/image00378.jpeg)\n\n选择 `Folio History`（账单历史）选项，将显示 `Folio History` 表单。\n\
  \n![](img/image00379.jpeg)\n\n- 请注意，只有针对提前一天开出的凭证可以通过 `CREDIT BILL` 开具贷记，否则 Opera\
  \ 将禁用 `Credit Bill` 选项按钮；例如，截至今天 `3 月 12 日`，仅允许开具贷记。针对 `3 月 11 日`之前开出的凭证通过贷单制作贷记。\n\
  \n- 另一个需要考虑的因素是，贷记的发行必须与付款收据的系列类别对应，也就是说，如果系列类别为 `F010`，则贷记必须使用 `F010` 系列；如果系列类别是\
  \ `B011`，则贷记必须相应地使用 `B011` 系列。如果没有发生这种关联，将存在中央税务机关拒绝开具贷记的风险。\n\n- 为了实现这种关联，在开具贷记时，必须更改\
  \ `Client's Profile`（客户资料）中的 `Tax Type`（税类型）字段。\n\n例如，为客户 `Liu, Fang` 的发票凭证开具贷记时\n\
  \n![](img/image00380.jpeg)\n\n进入 `Reservations Menu`（预订菜单）`Profiles`（资料）选项，在 `Profile\
  \ Search` 屏幕上找到并选择 `Client Profile`（客户资料）。\n\n![](img/image00381.jpeg)\n\n点击 `Edit`（编辑）按钮显示带有客户数据的\
  \ `Individual Profile`（个人资料）表单，\n\n![](img/image00382.jpeg)\n\n选择 `More Fields`（更多字段）按钮查看\
  \ `Tax Type` 选项\n\n![](img/image00383.jpeg)\n\n为了正确生成发票贷记，将 `Profile` 的 `Tax Type`\
  \ 从 `Client`（客户）更改为 `INVOICE`（发票）很重要。\n\n![](img/image00384.jpeg)\n\n更改 `Tax Type`\
  \ 字段后，我们从 `Folio History` 屏幕生成发票的 `Credit Bill`。\n\n![](img/image00385.jpeg)\n\n\
  系统会要求输入收银员的凭据，你\n\n![](img/image00386.jpeg)\n\n必须指定 `Marked Code`（标记代码）和 `Source\
  \ Code`（来源）值，然后点击 `Post`（过账）按钮。\n\n![](img/image00387.jpeg)\n\n我们过账金额相同但为负值的贷记。\n\
  \n![](img/image00388.jpeg)\n\n请注意，执行 `CREDIT BILL` 必须使用与制作预订时相同的市场代码（market code）和来源（source）。\n\
  \n![](img/image00389.jpeg) ![](img/image00390.jpeg)\n\n# Opera PMS 中的房价策略配置与演示\n\
  \n本指南配置了定价策略并演示了限制的应用。\n\n## 1. 用户资料 (USER PROFILES)\n\n考虑以下前台和预订资料的权限：\n\n### 前台资料\n\
  对于用户必须遵守房价策略限制的资料。这适用于收银员或前台接待人员。\n\n您不能拥有以下权限：\n- `RESERVATIONS \\ OVERRIDE RATECODE`\n\
  - `BLOCKS \\ OVERRIDE BLOCK RATE RESTRICTIONS`\n\n您必须拥有以下权限：\n- `RESERVATION \\\
  \ RATE CODE CHANGE`\n\n### 预订资料\n对于用户可以授权打破价格策略限制的资料。这适用于主管人员。\n\n您必须拥有以下权限：\n-\
  \ `RESERVATION \\ OVERRIDE RATECODE`\n- `BLOCKS \\ OVERRIDE BLOCK RATE RESTRICTIONS`\n\
  \n## 2. 系统参数 (SYSTEM PARAMETERS)\n\n必须在 `System Settings` 屏幕中指定以下参数：\n\n| 参数 | 值\
  \ |\n| :--- | :--- |\n| `RATES \\ SET CATEGORY` | `Y` |\n| `RATES \\ SET RATE CODE`\
  \ | `Y` |\n\n## 3. 房价策略定义\n\n为了配置房价策略，进入 `Configuration` 主菜单，将显示 `Configuration`\
  \ 屏幕。进入 `Rate Management` 菜单，`Rate Strategy` 选项，将显示 `Rate Strategy` 屏幕。\n\n![](img/image00391.jpeg)\n\
  \n点击 `New`（新建）按钮。定义入住率小于 10%的直接房价策略为 `OPEN`。\n\n![](img/image00392.jpeg)\n\n同时也定义入住率大于\
  \ 10%的反向房价策略为 `CLOSED`。\n\n![](img/image00393.jpeg)\n\n`Restriction Dates` 字段中的日期对应于预订的日期。\n\
  \n## 4. 入住水平与预测处理器 (OCCUPANCY LEVEL AND FORECAST PROCESSOR)\n\n房价策略的正确执行根据入住水平决定是否应用价格限制。这种入住水平要求从预订房库存中扣除（Deduct）。\n\
  \n为了激活库存扣除，确保预测处理器正在运行很重要。\n\n![](img/image00394.jpeg)\n\n要激活它，进入 `Utilities` 主菜单，将显示\
  \ `Utilities` 屏幕。在此屏幕上，进入 `Processors` 菜单，`Forecast Processor` 子菜单，将显示 `Forecast\
  \ Processor Status` 屏幕。\n\n![](img/image00395.jpeg)\n\n在 `Forecast Processor Status`\
  \ 屏幕上，运行进程应显示为 `Running`，否则点击 `Start`（启动）按钮。\n\n![](img/image00396.jpeg)\n\n## 5.\
  \ 房价代码配置 (RATE CODE CONFIGURATION)\n\n我们需要验证房价配置，进入 `Rate Management` 菜单，`Rate Classifications`\
  \ 菜单选项，`Rate Codes` 选项。选择涉及房价策略的 `Rate Code` 并点击 `Edit`（编辑）按钮。\n\n![](img/image00397.jpeg)\n\
  \n在 `Rate Header` 表单中，确保 `Room Types` 字段具有我们建立房价策略的房型类型 `ST`，同时验证 `Begin Sell Date`\
  \ 和 `End Sell Date` 日期范围符合房价策略的执行日期和控制日期。\n\n![](img/image00398.jpeg)\n\n在 `Rate\
  \ Detail` 表单中，选择与房价策略考虑的 `Room Types` `ST` 对应的记录，确保 `Start Date` 和 `End Date` 日期范围与定义的执行日期和控制日期一致。\n\
  \n\n\n\n\n## 6. 预订类型的配置\n\n我们必须验证`Reservation Types`预订类型，并考虑那些会从房间物理房存中扣除的预订类型，也就是说这些预订一旦确认将无法取消。\n\
  \n这非常重要，因为`Rate Strategy`价格策略）只计算预订并从房间库存中扣除的房间，以验证入住率。\n\n![](img/image00403.jpeg)\n\
  \n在`Reservation Type”（预订类型）屏幕中，我们必须至少有一个记录作为`Deduct`扣减）预订类型。\n\n![](img/image00404.jpeg)\
  \ ![](img/image00405.jpeg)\n\n## 7. 进行预订\n\n在对初步参数配置进行充分验证后，进入`Reservations”（预订）选项菜单，选择`New\
  \ Reservation”（新建预订）选项按钮。\n\n在`Profile Search”（资料搜索）屏幕中，我们搜索特定的客户。\n\n![](img/image00406.jpeg)\n\
  \n在`Reservation”（预订）屏幕上，`Arrival”（到达）字段中的日期必须在价格策略的执行范围内，选择价格策略中定义的`Room Type`房型）和`Rate\
  \ Code`房价代码）。\n\n**重要**你必须在`Res Type`字段中选择带有`Deduct`扣减）的预订类型。\n\n![](img/image00407.jpeg)\n\
  \n只要限制规则未达到直接定价策略的限制（`<10% occupancy OPEN`），即可按天进行预订。\n\n![](img/image00408.jpeg)\n\
  \n一旦在入住屏幕（`Shift + F1`）上对 5 月 2 日进行了预订，我们观察到有 1 间房间被预订并从库存中扣除（`Deduct`）。\n\n![](img/image00409.jpeg)\n\
  \n我们使用收银员资料进行预订，房间数量恰以覆盖 10%的入住率（定价策略的限制）。\n\n![](img/image00410.jpeg) ![](img/image00411.jpeg)\n\
  \n在下一次预订意向中，将显示`Rate Query Details`房价查询详情）屏幕，价格处于`Close`关闭）状态，这确认了定价策略限制了价格分配。\n\
  \n![](img/image00412.jpeg) ![](img/image00413.jpeg)\n\n如果你想继续分配，将显示价格分配权限请求屏幕。此授权由`Supervisor`（主管）用户提供。\n\
  \n![](img/image00414.jpeg)\n\n## 8. 与价格策略相关的报告\n\n如果你想查看定价策略的行为，请使用以下报告：\n\n| 报告名称\
  \ | .rep 文件 |\n| :--- | :--- |\n| 限制详情 (Restrictions Detail) | `raterest.rep` |\n\
  | 预订房价检查 (Reservation Rate Check) | `res_rate_check.rep` |\n| 按房价代码生成的预订 (Reservations\
  \ made On by Ratecode) | `paris_reservationsmadeonbyratecode.rep` |\n\n# 使用 Opera\
  \ PMS 和 Oracle Reports Developer 创建报告\n\n在 Opera 中创建自定义报告，你必须首先创建一个 SQL 语句以从 Opera\
  \ 的 Oracle 数据库中获取报告数据，然后在`Oracle Reports Developer`工具中设计报告，最后在 Opera 可用的报告列表中分配一个选项。\n\
  \n使用正确版本的`Oracle Reports Developer` 非常重要，通常该工具由 Opera PMS 商安装。\n\n| Opera | Oracle\
  \ Reports Developer |\n| :--- | :--- |\n| v 5.0 | v 10.1.2.0 |\n| v 5.5 | v 11.1.2.2.0\
  \ |\n\n在本博客中，我们将创建一个列出常住客户列表的报告。\n\n我们执行从 Opera Oracle 数据库中提取数据的 SQL 语句。\n\n```sql\n\
  SELECT a.room, trim (initcap (a.guest_first_name)) || ' '|| trim (initcap (a.sname))\
  \ As Name,\ntrim (a.company_name) ||' '|| a.travel_agent_name As Company,\na.resv_status,\
  \ a.arrival, a.departure\nFROM reservation_general_view\nWHERE (a.resv_status ='\
  \ CHECKED IN 'OR a.resv_status =' DUE OUT ')\nORDER BY a.room\n```\n\n我们将使用视图`reservation_general_view`，该视图包含必要的查询来提取所有客户在不同状态下的预订数据：\n\
  - CHECKED IN（已入住）\n- PROSPECT（意向）\n- CANCELLED（已取消）\n- NO SHOW（未到）\n- CHECKED OUT（已退房）\n\
  - RESERVED（已预订）\n\n我们在开发环境`Oracle SQL Developer`中执行此查询，以验证查询正常工作。\n\n![](img/image00415.jpeg)\n\
  \n我们执行设计程序`Oracle Reports Developer`。\n\n![](img/image00416.jpeg)\n\n将显示生成器（Builder）\n\
  \n![](img/image00417.jpeg)\n\n我们将生成器连接数据库，为此我们选择`File`菜单选项`Connect ...`。\n\n![](img/image00418.jpeg)\n\
  \n将显示数据库的连接向导，你必须输入`User`（用户名）、`Password`（密码）和 Oracle 数据库的实例名称，然后点击单选按钮`Connect`连接到数据库。\n\
  \n![](img/image00419.jpeg)\n\n选择`File`菜单，`New` / `Report…`菜单选项，将显示`New Report`向导。选择`Use\
  \ the Report Wizard`选项并点击`OK`按钮。\n\n![](img/image00420.jpeg)\n\n将显示向导`Report Wizard!`，点击`OK`按钮。\n\
  \n![](img/image00421.jpeg)\n\n\n\n\n\n为了访问 Opera 数据字典，你必须能够通过 Oracle SQL Developer\
  \ 或另一个 Oracle 开发环境访问 Oracle 数据库。\n\n使用以下 SQL 语句来提取 Opera 数据字典：\n\n```sql\nselect\
  \ cc.table_name, tc.column_name, tc.nullable, tc.data_type ||\ncase\nwhen tc.data_type\
  \ = 'NUMBER' and tc.data_precision is not null\nthen '(' || tc.data_precision ||\
  \ ',' || tc.data_scale || ')'\nwhen tc.data_type like '% CHAR%'\nthen '(' || tc.data_length\
  \ || ')'\nelse null\nend type\n, cc.comments\nfrom user_col_comments cc\njoin user_tab_columns\
  \ tc\non (cc.column_name = tc.column_name and cc.table_name = tc.table_name)\norder\
  \ by cc. table_name ASC, tc.column_name ASC\n```\n\n对于那些无法访问 Opera Oracle 数据库的用户，我遗留了\
  \ Excel 格式的数据字典，以及字段描述的英语说明及其对应的西班牙语翻译。\n\n由于 Opera 拥有超过 4800 张表，本博客将描述维护和开发过程中最重要的表和字段。\n\
  \n[Opera PMS 数据字典 - Oracle](https://docs.google.com/spreadsheets/d/19lfAxMjt29iqhjeux8wn6DuMa9-cgiTC/export?format=xlsx)\n\
  \n# Opera PMS 每日付款报表的设计与创建\n\n我们将创建一个报告，显示每天的付款列表，以及来自各种支付形式（现金、卡片等）的付款情况。此类报告允许我们查看并验证每个交易日内\
  \ ATM 收取的费用。\n\n报表将显示以下列：\n- 交易日期\n- 交易代码\n- 交易代码描述\n- 预订\n- 房号\n- 宾客姓名\n- 凭证号\n\
  - 美元总计费金额\n- 货币代码\n- 收银员\n\n```sql\nSELECT TO_CHAR (fi.TRX_DATE,'DD / MM / RR')\
  \ TRX_FECHA, --Date of Transaction\n  fi.TRX_CODE TRX_CODE, -Transaction Code\n\
  \  UPPER(trc.DESCRIPTION) TRX_DESCRIPTION, - Transaction Code Description\n  fi.RESV_NAME_ID\
  \ NR_RESERVA, --Reservation Number\n  fi.ROOM NR_HAB, --NVL Room\n  Number (n.SNAME||','||n.SFIRST,'\
  \ ''), GUEST--Guest Name\n  fi.fiscal_bill_no NR_DOCUMENTO, - Voucher Number\n \
  \ DECODE (fi.bill_no,NULL,0, decode (fi.trx_no, fol.bill_payment_trx_no, fol.total_gross,0))\
  \ BILLED_USD, --Total Billed in Dollars\n  fi.CURRENCY CURRENCY, --RPAD Currency\n\
  \  Code (UPPER (au.APP_USER),5) USER --User\nFROM \n  FINANCIAL_TRANSACTIONS fi\n\
  \ INNER  JOIN FOLIO_TAX fol ON (fol.BILL_NO = fi.BILL_NO AND fol.NAME_ID = fi.NAME_ID)\n\
  \ INNER  JOIN  NAME n ON (n.NAME_ID = fi.NAME_ID)\n INNER  JOIN TRX$_CODES trc ON\
  \ (trc.TRX_CODE = fi.TRX_CODE)\n INNER  JOIN APPLICATION$_USER au ON (au.APP_USER_ID\
  \ = fi.INSERT_USER)\nWHERE\n--- TO_CHAR (fol.BUSINESS_DATE, 'DD / MM / RRRR') =\
  \ '11 / 03/2019 '\nfol.BUSINESS_DATE =  : P_BUSDATE\nAND fi.BILL_NO IS  NOT  NULL\n\
  AND (fi.TRX_CODE BETWEEN  9000  AND  9999)\nAND fi.DISPLAY_YN ='Y'\nAND fi.RECPT_TYPE\
  \ ! =  'CUX'\nAND fi.PACKAGE_CREDIT IS  NULL\nAND fi.PACKAGE_DEBIT IS  NULL\nAND\
  \ fi.PRICE_PER_UNIT <>  0\nORDER  BY\nTRX_FECHA, NR_DOCUMENTO, TRX_CODE, TRX_FECHA;\n\
  ```\n\n为了制作此报表，将使用与财务交易、客户账单或其他相关的表：\n- `FINANCIAL_TRANSACTIONS`：此表存储所有与收银服务相关的交易、每个预订的交易（宾客账、定金账、应收账账和套餐账）。\n\
  - `FOLIO_TAX`：此表存储按发票汇总的收入信息。\n- `NAME`：此表存储宾客、公司、旅行社、来源和小组的配置信息。\n- `TRX $ _CODES`：此表存储系统所有的交易代码，这些交易是在过账（POST）时选择的概念。\n\
  - `APPLICATION $ _USER`：此表存储操作系统的所有用户信息。\n\n我们在“Oracle SQL Developer”开发环境中执行查询来验证\
  \ SQL 语句。\n\n![](img/image00447.jpeg)\n\n我们运行报表设计程序“Oracle Reports Builder”，并使用“Report\
  \ Wizard”（报表向导）创建一个新报表。\n\n在“Report Style”（报表样式）屏幕上，我们指定报表标题并选择“Group Left”（左分组）格式，这种格式允许我们在报表中创建分组。\n\
  \n![](img/image00448.jpeg)\n\n在报表向导的“Data Source Definition”（数据源定义）屏幕上，将显示创建 `P_BUSDATE`\
  \ 报表参数的确认。该参数将允许我们从中进行选择。\n\n\n\n\n预测是指使用如历史数据等不同的变量，对产品或服务的未来需求进行估计和分析。\n\n酒店预测的基础的主要变量之一是对物业在先前期间的统计数据的分析，通过这些数据，我们可以预测未来的收入，并做出适当的业务决策以纠正偏差，从而实现收入最大化和成本最小化。\n\
  \n明确预测工具的重要性，特别是在线的、实时且通过手机直接从 `Opera PMS` 查询数据的预测工具，这对于物业的高效管理来说将是一个非常实用的工具。\n\n\
  需要考虑的是，在线预测工具必须包含以下数据，其描述保留自原始 `Opera` 文档：\n\n- **日期 (Date)**：统计数据适用的日期。\n- **总入住率\
  \ (Total Occupancy)**：总占用房间数（非扣减、扣减、个人和团体）。\n- **入住房间数 (Arrival Rooms)**：在此日期入住的客房。对于入住，组合房间计为\
  \ 1 个，而不是组成组合房间的物理房间数量。\n- **赠房数 (Comp Rooms)**：免费房间（关联到订单且房型代码标记为“免费”的房间）。\n- **员工用房\
  \ (House Use)**：员工用房（关联到订单且房型代码标记为“员工用房”的房间）。\n- **个人扣减房 (Individual Deduct)**：订单类型标记为“扣减库存”的个人预订。\n\
  - **非扣减个人房 (Non-Deduct Individual)**：订单类型未标记为“扣减库存”的个人预订。\n- **团体扣减房 (Deduct Group)**：订单类型标记为“扣减库存”的团体预订。\n\
  - **非扣减团体房 (Non-Deduct Group)**：订单类型未标记为“扣减库存”的团体预订。\n- **入住率 (Occupancy%)**：(`（总占用房间数\
  \ / 物业总房间数） x 100`）。\n- **房收入 (Room Revenue)**：与此日期相关的扣减、非扣减、个人和团体预订的住宿交易代码总收入。\n\
  - **平均房价 (Average Rate)**：总房收入 / 占用房间数。\n- **退房房间数 (Departure Rooms)**：在此日期退房的客房。对于退房，组合房间计为\
  \ 1 个，而不是组成组合房间的物理房间数量。\n- **当日入住房间数 (Day Use Rooms)**：该日的当日入住房间。\n- **未入住房间数 (No\
  \ Show Rooms)**：该日的未入住房间数。\n\n为此，为 `Oracle` 构建了以下 `SQL Query`，用于获取本月收入（`HISTORY`）相对于预计年收入（`FORECAST`）的预测。\n\
  \n![](img/image00463.jpeg)\n\n该 `Query` 将成为构建手机在线预测工具的基础。\n\n```sql\nSELECT rec_type\
  \ rec_type,\nDECODE (rec_type,'A_STAT', f_message ('REP_HISTORY','History'), f_message\
  \ ('REP_FORECAST','Forecast')) rec_type_desc,\nTO_CHAR (considered_date,'DD / MM\
  \ / RRRR') considered_date,\nSUM (no_rooms * count_resv_01) no_rooms,\nSUM (ind_deduct_rooms\
  \ * count_resv_01) ind_deduct_rooms,\nSUM (ind_non_deduct_rooms * count_resv_01)\
  \ ind_non_deduct_rooms,\nSUM (grp_deduct_rooms * count_resv_01) grp_deduct_rooms,\n\
  SUM (grp_non_deduct_rooms * count_resv_01) grp_non_deduct_rooms,\nSUM (no_persons\
  \ * count_resv_01) no_persons,\nSUM ( arrival_rooms * count_resv_01) arrival_rooms,\n\
  SUM (departure_rooms * count_resv_01) departure_rooms,\nSUM (complimentary_rooms\
  \ * count_resv_01) complimentary_rooms,\nSUM (house_use_rooms * count_resv_01) house_use_rooms,\n\
  SUM (day_use_rooms * count_resv_01) day_use_rooms,\nSUM (no_show_rooms * count_resv_01)\
  \ no_show_rooms,\nSUM (revenue * count_revenue_01) revenue,\nSUM (DECODE (group_yn,'N',\
  \ DECODE (deduct_yn,'Y', revenue,0),0) * count_revenue_01) ind_deduct_revenue,\n\
  SUM (DECODE (group_yn,'N', DECODE (deduct_yn,'N', revenue,0),0) * count_revenue_01)\
  \ ind_non_deduct_revenue,\nSUM (DECODE (group_yn,'Y', DECODE (deduct_yn,'Y', revenue,0),0)\
  \ * count_revenue_01) grp_deduct_revenue,\nSUM (DECODE (group_yn,'Y', DECODE (deduct_yn,'N',\
  \ revenue,0),0) * count_revenue_01) grp_non_deduct_revenue,\nSUM (owner_rooms *\
  \ count_resv_01) owner_rooms,\nSUM (ff_rooms * count_resv_01) ff_rooms\nFROM (\n\
  SELECT SUBSTR (rsf.Rec_type,1,6) rec_type,\nrsf.considered_date considered_date,\n\
  DECODE (rsf.owner_rental_flag,'H',0, rsf.no_rooms) no_rooms,\nDECODE (rsf.owner_rental_flag,'H',0,\
  \ rsf.group_yn,'N', DECODE (deduct_yn,'Y', rsf.no_rooms,0)) ind_deduct_rooms,\n\
  DECODE (rsf.owner_rental_flag,'H',0, rsf.group_yn,'N', DECODE (deduct_yn,'N', rsf.no_rooms,0))\
  \ ind_non_deduct_rooms,\nDECODE (rsf.owner_rental_flag,'H',0, rsf.group_yn,'Y',\
  \ DECODE (deduct_yn,'Y', rsf.no_rooms,0)) grp_deduct_rooms,\nDECODE (rsf.owner_rental_flag,'H',0,\
  \ rsf.group_yn,'Y', DECODE (deduct_yn,'N', rsf.no_rooms,0)) grp_non_deduct_rooms,\n\
  rsf.no_persons no_persons,\nrsf.arrival_rooms arrival_rooms,\nrsf.departure_rooms\
  \ departure_rooms,\nrsf.complimentary_rooms complimentary_rooms,\nrsf.house_use_rooms\
  \ house_use_rooms,\nrsf.day_use_rooms day_use_rooms,\nrsf.no_show_rooms no_show_rooms,\n\
  rsf.revenue revenue,\nDECODE (rsf.group_yn,'N', DECODE (rsf.deduct_yn,'Y', rsf.revenue,0),0)\
  \ ind_deduct_revenue,\nDECODE (rsf.group_yn,'N', DECODE (rsf.deduct_yn,'N', rsf.revenue,0),0)\
  \ ind_non_deduct_revenue,\nDECODE (rsf.group_yn,'Y', DECODE (rsf.deduct_yn,'Y',\
  \ rsf.revenue,0),0) grp_deduct_revenue,\nDECODE (rsf.group_yn,'Y', DECODE (rsf.deduct_yn,'N',\
  \ rsf.revenue,0),0) grp_non_deduct_revenue,\nrsf.owner_rooms owner_rooms,\nrsf.ff_rooms\
  \ ff_rooms\nFROM rep_res_stati_hld rsf\nwhere rsf.considered_date between TO_DATE\
  \ (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') and TO_DATE (TO_CHAR (LAST_DAY\
  \ (to_char (ADD_MONTHS (SYSDATE, 11),'YYYYMM')),'YYYYMM'),'DDMMRRRR'),'DDMMRRRR')\n\
  and rsf.deduct_yn='Y'\nUNION ALL\nSELECT (CASE WHEN (TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR')\
  \ + ns.N - 1) < pms_p.business_date THEN 'A_STAT' ELSE 'B_FORE' END) rec_type,\n\
  (TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') + ns.N - 1) considered_date,\n\
  0 no_rooms,\n0 ind_deduct_rooms,\n0 ind_non_deduct_rooms,\n0 grp_deduct_rooms,\n\
  0 grp_non_deduct_rooms,\n0 no_persons,\n0 arrival_rooms,\n0 departure_rooms,\n0\
  \ complimentary_rooms,\n0 house_use_rooms,\n0 day_use_rooms,\nCASE WHEN (TO_DATE\
  \ (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') + ns.N - 1) < pms_p.business_date\
  \ THEN 0 ELSE TO_NUMBER (NULL) END no_show_rooms,\n0 revenue,\n0 count_resv_01\n\
  )\n```\n\n\n\n\n\n```sql\n 0 count_revenue_01,\n 0 owner_rooms,\n 0 ff_rooms,\n\
  \ 'N' deduct_yn,\n 'N' group_yn\n FROM number_scale ns\n WHERE ns.n <= TO_DATE (TO_CHAR\
  \ (LAST_DAY (to_date (to_char (ADD_MONTHS (SYSDATE, 11),'YYYYMM'),'YYYYMM')),'DDMMRRRR'),'DDMMRRRR')\
  \ - TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') +  1\n)\n group by rec_type,\n\
  \ considered_date ORDER BY rec_type,\n TO_DATE (considered_date,'DD / MM / RRRR')\n\
  ```\n\n# Opera PMS 中交易明细表报告的创建\n\n需要告诉你，就像我们在房务（HouseKeeping）中通过智能手机显示房间状态一样，你可以基于资产平衡表（Trial\
  \ Balance）开发分析报告，以实现在线损益表。\n\n此报告显示了过账客人的所有交易详情以及这些交易的分类。\n\n由于平衡表的术语如果直接翻译成西班牙语会扭曲其含义，我将在博客中保留英文定义。\n\
  \n资产平衡表（Trial Balance）报告包含了所有已过账的交易，然后对五个分类账（客人账、应收账、定金账、套票账和酒店间来账）中的每一个业务进行细分。资产平衡表可帮助确保您的物业账户平衡且状态良好。\n\
  \n## 可用于对账的其他报告摘要\n\n| 报告标题 | .REP 文件名 | 附加信息 |\n| :--- | :--- | :--- |\n| 按类型账龄摘要\
  \ | araging | 可以针对特定日期运行。 |\n| 详细账龄报告 | aragingdet | 可以针对特定日期运行。 |\n| 应收账 (AR Ledger)\
  \ | arledger | 持续更新 |\n| 定金活动报告 | deposit_activity | 可以针对特定日期运行，但如果用于对账，应按活动日期运行。\
  \ |\n| NA 定金账 (NA Deposit Ledger) | deposit_ledger | 持续更新。 |\n| 财务支付与收入过账 | findeptcodes\
  \ | 可以针对特定日期运行，但如果用于对账，应始终按净收入运行。 |\n| 按收银员和交易代码分类日志 | finjrnlbytrans | 可以针对特定日期运行，但如果用于对账，应始终按净收入运行。\
  \ |\n| 生成的财务交易日志 | finjrnlbytrans2 | 可以针对特定日期运行，但如果用于对账，应始终按净收入运行。 |\n| 套票过账 | finpkgposting\
  \ | 捕获当前业务日期的数据，如果用于对账，必须附在夜审报告组中。 |\n| 客人资产平衡表 (Guest Trial Balance) | gl_trial_balance\
  \ | 可以针对特定日期运行。 |\n| 经理报告 | manager_report | 可以针对特定日期运行。 |\n| 入/离店转转定金 | nadeptransci\
  \ | 捕获当前业务日期的数据，如果用于对账到资产平衡表，必须与夜审一同运行。 |\n| 套票账明细 | napkgledger | 捕获当前业务日期的数据，如果用于对账到资产平衡表，必须与夜审一同运行。\
  \ |\n| 资产平衡表 (Trial Balance) | trial_balance | 可以针对特定日期运行。 |\n\n资产平衡表明细具有以下结构：\n\
  \n![](img/image00464.jpeg)\n\n- **Room**: 预订的房间号。\n- **Guest Name**: 客人姓名。\n- **Arragement\
  \ Desc**: 交易分类名称。\n- **Trx Code**: 交易代码。\n- **Trx No**: 交易序列号。\n- **Description**:\
  \ 交易描述。\n- **Old Balance (Opening Balance)**: 报告运行当日客人账户的总余额。\n- **Credits**: 客人已向账户支付的总金额（贷方）。\n\
  - **Debits**: 记入客人账户的总金额（借方）。\n- **Transferred Credits**: 任何转入客人账户并被视为贷方的金额。\n-\
  \ **Transferred Debits**: 结果转账而记入客人账户的任何金额。\n- **New Balance (Closing Balance)**:\
  \ 账户的结余额。此列通过以下公式计算：`Opening Balance + Debits + Transfer Debit - Credits - Transfer\
  \ Credits`。\n\n## Oracle 的 SQL 查询：\n\n```sql\nSELECT t.room, t.guest_name, t.arrangement_desc,\n\
  t.trx_code, t.trx_no,\nt.description,\nt.old_balance, t.credit, t.debit, t.transfer_credit,\
  \ t.transfer_debit, t.new_balance\nFROM(\n SELECT\n        fs.trx_no,\n        ar.arrangement_desc,\n\
  \        fs.resv_name_id,\n        fs.name_id,\n        fs.resort,\n        rv.room,\n\
  \        rv.guest_name,\n        co.trx_code,\n        co.description,\n       \
  \ - 在 from_date 之前的 GL 过账\n        DECODE (abs (trunc (to_date (to_char (to_char\
  \ (pms_p.business_date)))) - trunc (fs.trx_date)), 0, -1,\n        NVL (fs.Guest_account_debit,0))\
  \ - (NVL (fs.Guest_account_credit,0))) old_balance,\n        - 在 from_date 过账的 GL\
  \ 贷方\n        DECODE (fs.from_res_id,NULL, decode (pms_p.business_date - trunc (fs.trx_date)),\
  \ 0, n1 (fs.Guest_account_credit,0), 0) credit,\n        - from__date 账账 GL  方\n\
  \                DE (fs.____,,,, ( (_______ - (._.trx_0, ,,fs.fs.__credit,bit),\
  \ 0) debit,\n        - 在 from_date 过账的其他订单贷方\n        DECODE (fs.from_res_id,NULL,0\
  \ (pms_p.business_date - trunc (fs.trx_date)), 0, n, (fs.Guest_account_credit,0),\
  \ 0)) transfer_credit,\n        - 在 from_date 过账的其他订单借方\n        DECODE (fs.from_res_id,NULL,\
  \ decode (pms_p.business_date - trunc (fs.trx_date)), 0, nvl (fs.Guest_account_debit,0),\
  \ 0)) transfer_debit,\n         在 from_date 之前的 GL 过账\n        DECODE (pms_p.business_date\
  \ - trunc (fs.trx_date)), -1,0,\n        NVL (fs.Guest_account_debit,0) - NVL (fs.Guest_account_credit,0))\
  \ new_balance\nFROM financial_transactions_view fs\ninner join rep_reservation_all_view\
  \ rv on (fs.resv_name_id = rv.resv_name_id)\ninner join trx$_codes co on (co.trx_code=fs.trx_code)\n\
  inner join trx$_code_arrangementar on (ar.arrangement_id=co.arrange)\nwhere fs.resv_name_id\
  \ IN\n    - 今日过账的客人订单\nSELECT resv_name_id\nFROM financial_transactions ftx\nWHERE\
  \ ftx.resort = : RESORT\nAND ftx.trx_date = pms_p.business_date\nAND ftx.resv_name_id\
  \ IS NOT Null\nUNION ALL\n- 今日（应该）入住的订单\nSELECT resv_name_id\nFROM reservation_daily_elements\
  \ rde,\nreservation_element_name rdn\nWHERE rde.resort = : RESORT\nAND rde.reservation_date\
  \ = pms_p.business_date\nAND rdn.resort = rde.resort\nAND rdn.reservation_date =\
  \ rde.reservation_date\nAND rdn.resv_daily_el_seq = rde.resv_daily_el_seq\n)\nAND\
  \ fs.trx_date <= pms_p.business_date\nAND (fs.Guest_account_credit IS NOT Null OR\
  \ fs.guest_account_debit IS NOT NULL)\nand fs.resv_name_id=3142559 and rv.room='0206'\n\
  ) t\nORDER BY t.room, t.arrangement_desc, t.trx_code, t.trx_no\n```\n\n[/content]\
