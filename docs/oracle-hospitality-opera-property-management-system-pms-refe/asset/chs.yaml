  \ a, name_view b\nWHERE a.room_category_label<>'PM'\nand a.resv_status<>'CANCELLED'\n\
  and a.share_amount > 0.00\n```\n\n### 每房间产出\n```sql\nSELECT a.room_revenue, a.share_amount,\
