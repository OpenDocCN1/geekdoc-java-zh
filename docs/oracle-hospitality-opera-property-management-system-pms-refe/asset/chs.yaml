  \ 已入住\nVAC: 空闲\n\n使用以下查询显示特定楼房间的当前状态：\n\n```sql\nSELECT r.room, r.room_status, r.hk_status,\
  \ c.label, c.short_description,\nCASE WHEN NVL (v.Resv_status,'F')='CHECKED IN'\
