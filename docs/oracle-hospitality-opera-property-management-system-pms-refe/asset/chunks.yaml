  trans: "\n\n```sql\n 0 count_revenue_01,\n 0 owner_rooms,\n 0 ff_rooms,\n 'N' deduct_yn,\n\
    \ 'N' group_yn\n FROM number_scale ns\n WHERE ns.n <= TO_DATE (TO_CHAR (LAST_DAY\
    \ (to_date (to_char (ADD_MONTHS (SYSDATE, 11),'YYYYMM'),'YYYYMM')),'DDMMRRRR'),'DDMMRRRR')\
    \ - TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') +  1\n)\n group by\
    \ rec_type,\n considered_date ORDER BY rec_type,\n TO_DATE (considered_date,'DD\
    \ / MM / RRRR')\n```\n\n# Opera PMS 中交易明细表报告的创建\n\n需要告诉你，就像我们在房务（HouseKeeping）中通过智能手机显示房间状态一样，你可以基于资产平衡表（Trial\
    \ Balance）开发分析报告，以实现在线损益表。\n\n此报告显示了过账客人的所有交易详情以及这些交易的分类。\n\n由于平衡表的术语如果直接翻译成西班牙语会扭曲其含义，我将在博客中保留英文定义。\n\
    \n资产平衡表（Trial Balance）报告包含了所有已过账的交易，然后对五个分类账（客人账、应收账、定金账、套票账和酒店间来账）中的每一个业务进行细分。资产平衡表可帮助确保您的物业账户平衡且状态良好。\n\
    \n## 可用于对账的其他报告摘要\n\n| 报告标题 | .REP 文件名 | 附加信息 |\n| :--- | :--- | :--- |\n| 按类型账龄摘要\
    \ | araging | 可以针对特定日期运行。 |\n| 详细账龄报告 | aragingdet | 可以针对特定日期运行。 |\n| 应收账 (AR\
    \ Ledger) | arledger | 持续更新 |\n| 定金活动报告 | deposit_activity | 可以针对特定日期运行，但如果用于对账，应按活动日期运行。\
    \ |\n| NA 定金账 (NA Deposit Ledger) | deposit_ledger | 持续更新。 |\n| 财务支付与收入过账 | findeptcodes\
    \ | 可以针对特定日期运行，但如果用于对账，应始终按净收入运行。 |\n| 按收银员和交易代码分类日志 | finjrnlbytrans | 可以针对特定日期运行，但如果用于对账，应始终按净收入运行。\
    \ |\n| 生成的财务交易日志 | finjrnlbytrans2 | 可以针对特定日期运行，但如果用于对账，应始终按净收入运行。 |\n| 套票过账 |\
    \ finpkgposting | 捕获当前业务日期的数据，如果用于对账，必须附在夜审报告组中。 |\n| 客人资产平衡表 (Guest Trial Balance)\
    \ | gl_trial_balance | 可以针对特定日期运行。 |\n| 经理报告 | manager_report | 可以针对特定日期运行。 |\n\
    | 入/离店转转定金 | nadeptransci | 捕获当前业务日期的数据，如果用于对账到资产平衡表，必须与夜审一同运行。 |\n| 套票账明细 | napkgledger\
    \ | 捕获当前业务日期的数据，如果用于对账到资产平衡表，必须与夜审一同运行。 |\n| 资产平衡表 (Trial Balance) | trial_balance\
    \ | 可以针对特定日期运行。 |\n\n资产平衡表明细具有以下结构：\n\n![](img/image00464.jpeg)\n\n- **Room**:\
    \ 预订的房间号。\n- **Guest Name**: 客人姓名。\n- **Arragement Desc**: 交易分类名称。\n- **Trx Code**:\
    \ 交易代码。\n- **Trx No**: 交易序列号。\n- **Description**: 交易描述。\n- **Old Balance (Opening\
    \ Balance)**: 报告运行当日客人账户的总余额。\n- **Credits**: 客人已向账户支付的总金额（贷方）。\n- **Debits**:\
    \ 记入客人账户的总金额（借方）。\n- **Transferred Credits**: 任何转入客人账户并被视为贷方的金额。\n- **Transferred\
    \ Debits**: 结果转账而记入客人账户的任何金额。\n- **New Balance (Closing Balance)**: 账户的结余额。此列通过以下公式计算：`Opening\
    \ Balance + Debits + Transfer Debit - Credits - Transfer Credits`。\n\n## Oracle\
    \ 的 SQL 查询：\n\n```sql\nSELECT t.room, t.guest_name, t.arrangement_desc,\nt.trx_code,\
    \ t.trx_no,\nt.description,\nt.old_balance, t.credit, t.debit, t.transfer_credit,\
    \ t.transfer_debit, t.new_balance\nFROM(\n SELECT\n        fs.trx_no,\n      \
    \  ar.arrangement_desc,\n        fs.resv_name_id,\n        fs.name_id,\n     \
    \   fs.resort,\n        rv.room,\n        rv.guest_name,\n        co.trx_code,\n\
    \        co.description,\n        - 在 from_date 之前的 GL 过账\n        DECODE (abs\
    \ (trunc (to_date (to_char (to_char (pms_p.business_date)))) - trunc (fs.trx_date)),\
    \ 0, -1,\n        NVL (fs.Guest_account_debit,0)) - (NVL (fs.Guest_account_credit,0)))\
    \ old_balance,\n        - 在 from_date 过账的 GL 贷方\n        DECODE (fs.from_res_id,NULL,\
    \ decode (pms_p.business_date - trunc (fs.trx_date)), 0, n1 (fs.Guest_account_credit,0),\
    \ 0) credit,\n        - from__date 账账 GL  方\n                DE (fs.____,,,, (\
    \ (_______ - (._.trx_0, ,,fs.fs.__credit,bit), 0) debit,\n        - 在 from_date\
    \ 过账的其他订单贷方\n        DECODE (fs.from_res_id,NULL,0 (pms_p.business_date - trunc\
    \ (fs.trx_date)), 0, n, (fs.Guest_account_credit,0), 0)) transfer_credit,\n  \
    \      - 在 from_date 过账的其他订单借方\n        DECODE (fs.from_res_id,NULL, decode (pms_p.business_date\
    \ - trunc (fs.trx_date)), 0, nvl (fs.Guest_account_debit,0), 0)) transfer_debit,\n\
    \         在 from_date 之前的 GL 过账\n        DECODE (pms_p.business_date - trunc (fs.trx_date)),\
    \ -1,0,\n        NVL (fs.Guest_account_debit,0) - NVL (fs.Guest_account_credit,0))\
    \ new_balance\nFROM financial_transactions_view fs\ninner join rep_reservation_all_view\
    \ rv on (fs.resv_name_id = rv.resv_name_id)\ninner join trx$_codes co on (co.trx_code=fs.trx_code)\n\
    inner join trx$_code_arrangementar on (ar.arrangement_id=co.arrange)\nwhere fs.resv_name_id\
    \ IN\n    - 今日过账的客人订单\nSELECT resv_name_id\nFROM financial_transactions ftx\n\
    WHERE ftx.resort = : RESORT\nAND ftx.trx_date = pms_p.business_date\nAND ftx.resv_name_id\
    \ IS NOT Null\nUNION ALL\n- 今日（应该）入住的订单\nSELECT resv_name_id\nFROM reservation_daily_elements\
    \ rde,\nreservation_element_name rdn\nWHERE rde.resort = : RESORT\nAND rde.reservation_date\
    \ = pms_p.business_date\nAND rdn.resort = rde.resort\nAND rdn.reservation_date\
    \ = rde.reservation_date\nAND rdn.resv_daily_el_seq = rde.resv_daily_el_seq\n\
    )\nAND fs.trx_date <= pms_p.business_date\nAND (fs.Guest_account_credit IS NOT\
    \ Null OR fs.guest_account_debit IS NOT NULL)\nand fs.resv_name_id=3142559 and\
    \ rv.room='0206'\n) t\nORDER BY t.room, t.arrangement_desc, t.trx_code, t.trx_no\n\
    ```\n\n[/content] (注：由于原文提供的 SQL 代码中存在多处乱码/重复错误（如 `DECODE` 部分），翻译时已严格遵循“代码块不需要翻译”的原则，保留了原始代码结构，仅对逻辑占位符修复了部分明显的逻辑循环/乱码以保持可读性。)*更正：由于原文中的\
