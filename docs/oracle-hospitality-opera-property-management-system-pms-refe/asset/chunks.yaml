  trans: "\n\n```sql\nln_cost_tota := 0.00;\n\nln_art_id := VC_ARTICULO.ART_ID;\n\n\
    -- Inventario Inicial del Artículo.\n\nSELECT MAX(I.INV_ID) INTO ln_inv_id\nFROM\
    \ MCDATA.INVENTUR I,\n     MCDATA.INVPOSART IA\nWHERE I.INV_ID = IA.INV_ID\nAND\
    \ I.KST_ID = vn_kst_id\nAND IA.ART_ID = ln_art_id\nAND I.INV_DATUM < TO_DATE(vs_fec_ini,\
    \ 'DD/MM/YYYY');\n\nIF ln_inv_id > 0 THEN\n    SELECT IA.INP_IST,IA.INP_ESP into\
    \ ln_cant_tota,ln_cost_uni_tota\n    FROM MCDATA.INVENTUR I, MCDATA.INVPOSART\
    \ IA\n    WHERE I.INV_ID = IA.INV_ID\n    AND I.INV_ID = ln_inv_id\n    AND I.KST_ID\
    \ = vn_kst_id\n    AND IA.ART_ID = ln_art_id\n    AND I.INV_STATUS = 8 -- CERRADO\n\
    \    AND I.INV_TYP <> 22; -- DIFERENTE A AJUSTE DE INVENTARIO\n\n    ln_cant_tota:=NVL(ln_cant_tota,0);\n\
    \    ln_cost_tota:=ln_cant_tota*ln_cost_uni_tota;\n    ln_inv_ist:=ln_cant_tota;\n\
    \    ln_inv_esp:=ln_cost_uni_tota;\n    ln_total:=ln_cost_tota;\n\n    INSERT\
    \ INTO MCDATA.GTT_KARDEX_VALORIZADO\n    (KST_ID,\n     KST_ADRESSE,\n     KST_NAME,\n\
    \     FEC_INI_PER,\n     FEC_FIN_PER,\n     ART_ID,\n     WES_TYP,\n     ART_COD,\n\
    \     ART_NAME,\n     ART_INFO,\n     VPK_NR,\n     VPK_NAME,\n     TIPO_OPE,\n\
    \     LFS_STATUS,\n     LFP_STATUS,\n     WES_ID1,\n     WES_ID2,\n     WES_DOCDATE,\n\
    \     TIPO_DOC,\n     SERIE_DOC,\n     NRO_DOC,\n     CNT_COM,\n     CST_UNI_COM,\n\
    \     CST_TOT_COM,\n     CNT_VTA,\n     CST_UNI_VTA,\n     CST_TOT_VTA,\n    \
    \ CNT_SLD_FIN,\n     CST_UNI_SLD_FIN,\n     CST_TOT_SLD_FIN,\n     ID_GTT_KARDEX,\n\
    \     ID_GTT_KARDEX_VALORIZADO)\n    VALUES\n    (VC_ARTICULO.KST_ID,\n     VC_ARTICULO.KST_ADRESSE,\n\
    \     VC_ARTICULO.KST_NAME,\n     TO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n     TO_DATE(vs_fec_fin,\
    \ 'DD/MM/YYYY'),\n     VC_ARTICULO.ART_ID,\n     0,\n     VC_ARTICULO.ART_COD,\n\
    \     VC_ARTICULO.ART_NAME,\n     VC_ARTICULO.ART_INFO,\n     TRIM(VC_ARTICULO.VPK_NR),\n\
    \     VC_ARTICULO.VPK_NAME,\n     '16',\n     0,\n     0,\n     null,\n     0,\n\
    \     TO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n     '',\n     '',\n     'INV INICIAL',\n\
    \     NULL,\n     NULL,\n     NULL,\n     NULL,\n     NULL,\n     NULL,\n    \
    \ ln_inv_ist,\n     ln_inv_esp,\n     ln_total,\n     V_ID_GTT_KARDEX,\n     ID_GTT_KARDEX_VALORIZADO_SEQ.next);\n\
    \    COMMIT;\n\n    --Actualizamos Saldo\n    ln_cant_tota := ln_inv_ist;\n  \
    \  ln_cost_tota := ln_cost_tota;\n    ln_cant_tota := ln_cant_tota + ROUND(NVL(VC_ARTICULO.ANT_COMPRA,0),4)\
    \ + ROUND(NVL(VC_ARTICULO.ANT_VENTA,0),4);\n    ln_cant_tota:=NVL(ln_cant_tota,0);\n\
    \    IF VC_ARTICULO.ANT_COMPRA>0 THEN\n        cost_uni_tota := ROUND(VC_ARTICULO.COST_UNI_COMPRA,4);\n\
    \    ELSE\n        IF VC_ARTICULO.ANT_VENTA>0 THEN\n            cost_uni_tota\
    \ := ROUND(VC_ARTICULO.COST_UNI_VENTA,4);\n        ELSE\n            cost_uni_tota\
    \ := CASE WHEN VC_ARTICULO.COST_UNI_VENTA>0 THEN ROUND(VC_ARTICULO.COST_UNI_VENTA,4)\
    \ ELSE ROUND(VC_ARTICULO.COST_UNI_COMPRA,4) END;\n        END IF;\n    END IF;\n\
    \    ln_cost_tota := ln_cost_tota*ln_cant_tota;\n\n    --Tipo Operacion\n    IF\
    \ VC_ARTICULO.WES_TYP = 10 THEN\n        IF VC_ARTICULO.LFP_STATUS = 0 THEN\n\
    \            tipo_ope := '2'; -- COMPRA\n        ELSE\n            tipo_ope :=\
    \ '5'; -- DEVOLUC\n        END IF;\n    ELSE\n        tipo_ope := VC_ARTICULO.TIPO_OPE;\n\
    \    END IF;\n\n    INSERT INTO MCDATA.GTT_KARDEX_VALORIZADO\n    (KST_ID,\n \
    \    KST_ADRESSE,\n     KST_NAME,\n     FEC_INI_PER,\n     FEC_FIN_PER,\n    \
    \ ART_ID,\n     WES_TYP,\n     ART_COD,\n     ART_NAME,\n     ART_INFO,\n    \
    \ VPK_NR,\n     VPK_NAME,\n     TIPO_OPE,\n     LFS_STATUS,\n     LFP_STATUS,\n\
    \     WES_ID1,\n     WES_ID2,\n     WES_DOCDATE,\n     TIPO_DOC,\n     SERIE_DOC,\n\
    \     NRO_DOC,\n     CNT_COM,\n     CST_UNI_COM,\n     CST_TOT_COM,\n     CNT_VTA,\n\
    \     CST_UNI_VTA,\n     CST_TOT_VTA,\n     CNT_SLD_FIN,\n     CST_UNI_SLD_FIN,\n\
    \     CST_TOT_SLD_FIN,\n     ID_GTT_KARDEX,\n     ID_GTT_KARDEX_VALORIZADO)\n\
    \    VALUES\n    (VC_ARTICULO.KST_ID,\n     VC_ARTICULO.KST_ADRESSE,\n     VC_ARTICULO.KST_NAME,\n\
    \     TO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n     TO_DATE(vs_fec_fin, 'DD/MM/YYYY'),\n\
    \     VC_ARTICULO.ART_ID,\n     0,\n     VC_ARTICULO.ART_COD,\n     VC_ARTICULO.ART_NAME,\n\
    \     VC_ARTICULO.ART_INFO,\n     TRIM(VC_ARTICULO.VPK_NR),\n     VC_ARTICULO.VPK_NAME,\n\
    \     '16',\n     0,\n     0,\n     null,\n     0,\n     TO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n\
    \     '',\n     '',\n     'INV INICIAL',\n     NULL,\n     NULL,\n     NULL,\n\
    \     NULL,\n     NULL,\n     NULL,\n     ln_inv_ist,\n     ln_inv_esp,\n    \
    \ ln_total,\n     V_ID_GTT_KARDEX,\n     ID_GTT_KARDEX_VALORIZADO_SEQ.next);\n\
    \    COMMIT;\n"
