    # Credit Notes through Credit Bill in Opera PMS


    We will make credit notes through `CREDIT BILL`, enter the `Cashiering` menu,
    `Cashier Functions` option The `Cashier Functions` form will be displayed


    ![](Images/image00377.jpeg)


    ![](Images/image00378.jpeg)


    Select the `Folio History` option the `Flio History` form will be displayed


    ![](Images/image00379.jpeg)


    - Consider that only Credit Notes can be issued through `CREDIT BILL` to vouchers
    that have been issued one day in advance, otherwise Opera disables the `Credit
    Bill` option button, for example, as of today, `March 12`, only credit notes are
    allowed to be issued. credit through Credit Bill of vouchers issued until `March
    11`.


    - Another consideration to take into account is that the issuance of credit notes
    must correspond to the series category of the payment receipt, that is, if the
    series category is `F010`, credit notes must be issued with the `F010` series.
    if the series category is `B011`, credit notes must be issued with the `B011`
    series in that correlation. If this correlation does not occur, there is a risk
    that the central tax administration will reject the credit note issued.


    - For this correlation to occur, it is very important that when issuing credit
    notes, the `Tax Type` field of the `Client''s Profile` must be changed.


    For example, for the issuance of credit notes for the invoice voucher of the client
    `Liu, Fang`


    ![](Images/image00380.jpeg)


    Enter the `Reservations Menu` `Profiles` option, in the `Profile Search` screen
    find and select `Client Profile`.


    ![](Images/image00381.jpeg)


    Click on the `Edit` option button to display the `Individual Profile` form with
    the customer''s data,


    ![](Images/image00382.jpeg)


    Select the `More Fields` option button to view the `Tax Type` options


    ![](Images/image00383.jpeg)


    To properly generate the invoice credit note it is important to change the `Tax
    Type` of the `Profile` from the `Client` to `INVOICE`.


    ![](Images/image00384.jpeg)


    After changing the `Tax Type` field, we proceed to generate the `Credit Bill`
    of the invoice from the `Folio History` screen.


    ![](Images/image00385.jpeg)


    We will be asked for the credentials of the cashier, you


    ![](Images/image00386.jpeg)


    must indicate the `Marked Code` and `Source Code` values ​​and then click on the
    `Post` option button.


    ![](Images/image00387.jpeg)


    We post the credit note for the same value but negative.


    ![](Images/image00388.jpeg)


    Consider that to carry out the `CREDIT BILL`, you must use the same market code
    and the same source that you used to make the reservation.


