    # Closing of Day Process or Audit with Opera PMS


    The closing of day allows updating the business date (Business Date) to the current
    operation date, in addition the closing process is very important for the generation
    of hotel management reports.


    Enter the "End of Day" option menu and select the "Night Audit" menu.


    ![](Images/image00356.jpeg)


    The "End of Day Login" form will be displayed and select the "Business Date" that
    we want to close.


    ![](Images/image00357.jpeg)


    The "End of Day Routine" screen will be displayed, which will validate the conclusion
    of the processes that allow the proper closing of the day.


    ![](Images/image00358.jpeg)


    Click the OK button and then click the Start button.


    Opera shows you the pending arrivals or reservations for Check In not yet registered,
    which must be registered, this also alerts us about the status of pending arrivals.


    ![](Images/image00359.jpeg)


    To continue with the closing of the day, it is important to check in all arrivals
    on the date that is closing in order to continue with the process.


    After assigning the Room and Rate, click on the Check In option button.


    If the Check In is successful, the registration must leave the check-in pending
    list. Continue with this process until the check in pending registration tray
    is left without records.


    During the validation of the pending Check Out records, the "Guests At Home" screen
    is displayed, for which the corresponding Check Out must be generated before continuing
    with the closing process.


    ![](Images/image00360.jpeg)


    Before proceeding with the Check out, it is important to configure the printtasks
    necessary for printing the CheckOut.


    ![](Images/image00361.jpeg)


    Log in with the supervisor role, select the Configuration option, in the Configuration
    screen, select the Workstation menu option.


    ![](Images/image00362.jpeg)


    Select the WorkStatons corresponding to the current work pc, which is usually
    highlighted in blue.


    ![](Images/image00363.jpeg)


    Click on the Print Tasks option button to display the Print Task screen.


    ![](Images/image00364.jpeg)


    Within this screen, click the New button.


    ![](Images/image00365.jpeg)


    If the Printer Task is not displayed on the screen, it must be registered on the
    Printers screen, select the option menu Printers, the screen will be displayed,
    and click on New


    ![](Images/image00366.jpeg)


    Create the required print task, then in the WorkStation add the necessary PrintTask.


    ![](Images/image00367.jpeg)


    Opera will begin to close the day and complete all pending operations for a proper
    close.


    ![](Images/image00368.jpeg)


    The closing process also prints the pending reports of the day''s operations.


    ![](Images/image00369.jpeg)


    At the end of the closing process for the day, the printing of the final report
    is requested.


    ![](Images/image00370.jpeg)


    # Configuration of Rate Strategy in Opera PMS


    The rate strategy allows us to control the price restrictions (discounts and surcharges)
    that we wish to apply to room reservations according to the occupancy or availability
    of the hotel rooms.'
