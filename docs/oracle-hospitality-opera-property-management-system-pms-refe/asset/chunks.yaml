  trans: "\n\n```sql\nSELECT ROOM_STATUS_ID, ROOM_STATUS_CODE, ROOM_STATUS_DESC FROM\
    \ OPERA.ROOM_STATUS_CODES_ALL\n```\n\n| ROOM_STATUS_ID | ROOM_STATUS_CODE | ROOM_STATUS_DESC\
    \ |\n| :--- | :--- | :--- |\n| 1 | CL | 已清洁 |\n| 2 | DI | 脏 |\n| 3 | IP | 已检查\
    \ |\n| 4 | OS | 维修中 |\n| 5 | OO | 故障 |\n\n```sql\nSELECT DISTINCT HK_STATUS FROM\
    \ OPERA.ROOM\n```\n\nOCC: 已入住\nVAC: 空闲\n\n```sql\nSELECT DISTINCT HK_STATUS FROM\
    \ OPERA.ROOM\n```\n\nOCC: 已入住\nVAC: 空闲\n\n使用以下查询显示特定楼房间的当前状态：\n\n```sql\nSELECT\
    \ r.room, r.room_status, r.hk_status, c.label, c.short_description,\nCASE WHEN\
    \ NVL (v.Resv_status,'F')='CHECKED IN' THEN 'CI' WHEN NVL (v.Resv_status,'F')='CHECKED\
    \ OUT' THEN 'CO' ELSE '' END resv_status,\nTO_CHAR (v.Arrival,'DD / MM') arrival,\n\
    TO_CHAR (v.Departure,'DD / MM') departure, TO_CHAR (v.Departure_time) departure_time,,CASE\
    \ WHEN r.hk_status<>r.fo_status THEN 'AND' ELSE 'N' END isdiscrepancy\nFROM OPERA.ROOM\
    \ r\nINNER JOIN OPERA.ROOM_CATEGORY_TEMPLATE c ON (r.Room_category=c.Room_category)\
    \ \nLEFT JOIN (\nSELECT r.room, MIN (r.resv_status) resv_status, min (r.arrival)\
    \ arrival, max (r.departure) departure, max (r.departure_time) departure_time\n\
    FROM reservation_general_view r\nWHERE r.trunc_departure> =pms_p.business_date\
    \ and r.room is not null\nAND r.resv_status IN ('CHECKED IN','CHECKED OUT')\n\
    GROUP BY r.room\n) v ON (v.room=r.room)\nWHERE SUITE_TYPE<>'PSUEDO' \nAND to_number\
    \ (r.Floor)=4--FLOOR\nORDER BY to_number (r.Floor) ASC, to_number (r.Room) ASC\n\
    ```\n\n![](img/image00465.jpeg)\n\n从手机设备显示的查询房间状态的 Web 系统界面所示：\n\n![](img/image00466.jpeg)\
    \ ![](img/image00467.jpeg)\n\n## 差异 (Discrepancies)\n\n在 Opera 的“房间差异”（Room Discrepancy）报告中可以观察到差异：\n\
    在 PMS 模块中，进入“其他”（Miscellaneous）菜单，“报告”（Reports）子菜单，寻找“房间差异”报告并点击“确定”。\n\n![](img/image00468.jpeg)\n\
    \n系统将显示“报告参数”（Report Parameters）屏幕，在此屏幕上选择您想要查看的“房间状态”（Room Status）。\n\n![](img/image00469.jpeg)\n\
    \n在“房间状态”选择中，观察 2 种差异状态：\n\n![](img/image00470.jpeg)\n\n- **跳过/睡眠睡差异 (Skip / Sleep\
    \ Discrepant)**：基于房间状态的差异。\n- **人数差异 (Persons Discrepant)**：基于每个房间客人数量的差异。\n\n\
    在此示例中，我们选择了“所有房间”（ALL Rooms），它将向我们显示物业的所有差异。\n\n![](img/image00471.jpeg)\n\n请注意，如果\
    \ FO Status 字段与 HK Status 字段不同，就会出现跳过或睡眠差异。\n\n房间状态出现差异的原因如下：\n\n- **睡眠 (Sleep)**：\n\
    \  - `FO_STATUS` 指明 `VAC`（前台登记客人办理退房）\n  - `HK_STATUS` 指明 `OCC`（客房表示房间内有人）\n-\
    \ **跳过 (Skip)**：\n  - `FO_STATUS` 指明 `OCC`（客人在未正式退房的情况下离开房间）\n  - `HK_STATUS`\
    \ 指明 `VAC`（客房表示房间已空闲）\n\n要解决差异，进入房间管理（Rooms Management）菜单，选择“客务”（Housekeeping）项，将显示带有可用选项的客务屏幕。我们选择“房间差异”（Rm.\
    \ Discrepancies）选项。\n\n![](img/image00472.jpeg)\n\n在“房间差异”屏幕中，你可以看到“FO Status”（前台状态）和“HK\
    \ Status”（客房状态）字段之间的状态差异，要解决此差异，两种状态必须匹配。\n\n![](img/image00473.jpeg)\n\n## Opera\
    \ PMS 中分配给交易代码的会计科目\n\n重要的是，我们在“账单”（Billing）中进行“过账”（Post）操作期间使用的“交易代码”（Transaction\
    \ Codes）与居住地国家税务管理部门要求我们提供的某些会计科目相关联。\n\n![](img/image00474.jpeg) ![](img/image00475.jpeg)\n\
    \n要显示“交易代码”与会计科目之间的对应关系或映射，它们显示在“后台接口交易代码映射”（BackOffice Interface Transaction\
    \ Codes Mapping）报告中显示。在“其他”（Miscellaneous）菜单中，进入“报告”（Reports）选项。\n\n![](img/image00476.jpeg)\n\
    \n在“报告”屏幕中，寻找报告“后台接口交易代码映射”，然后点击确定，系统将预览显示“交易代码”与会计科目之间的对应关系。\n\n![](img/image00477.jpeg)\
    \ ![](img/image00478.jpeg)\n\n如果你需要为某个交易代码分配某个账户，进入“外部”（External）菜单，“前台”（Back\
    \ Office）子菜单，“配置”（Configuration）选项。\n\n![](img/image00479.jpeg)\n\n在“前台”屏幕中，选择“交易代码”并点击。\n\
    \n![](img/image00480.jpeg)\n\n将显示“交易代码”屏幕，选择。\n\n![](img/image00481.jpeg)\n\n\
    将显示分配账户的屏幕，选择相应的。\n\n![](img/image00482.jpeg)\n\n## Opera PMS 中更改房间类型\n\n这将显示更改房间类型的操作。\n\
    为了更改物业的房间类型，我们过滤出未预订且空空的房间。\n\n```sql\nSELECT r.room, r.room_status, r.hk_status,\
    \ c.label, c.short_description,\nCASE WHEN NVL (v.Resv_status,'F')='CHECKED IN'\
    \ THEN 'CI' WHEN NVL (v.Resv_status,'F')='CHECKED OUT' THEN 'CO' ELSE '' END resv_status,\n\
    TO_CHAR (v.Arrival,'DD / MM') arrival,\nTO_CHAR (v.Departure,'DD / MM') departure,\
    \ TO_CHAR (v.Departure_time) departure_time,,CASE WHEN r.hk_status<>r.fo_status\
    \ THEN 'AND' ELSE 'N' END isdiscrepancy\nFROM OPERA.ROOM r\nINNER JOIN OPERA.ROOM_CATEGORY_TEMPLATE\
    \ c ON (r.Room_category=c.Room_category) \nLEFT JOIN (\nSELECT r.room, MIN (r.resv_status)\
    \ resv_status, min (r.arrival) arrival, max (r.departure) departure, max (r.departure_time)\
    \ departure_time\nFROM reservation_general_view r\nWHERE r.trunc_departure> =pms_p.business_date\
    \ and r.room is not null\nAND r.resv_status IN ('CHECKED IN','CHECKED OUT')\n\
    GROUP BY r.room\n) v ON (v.room=r.room)\nWHERE SUITE_TYPE<>'PSUEDO' \nAND to_number\
    \ (r.Floor)=4--FLOOR\nORDER BY to_number (r.Floor) ASC, to_number (r.Room) ASC\n\
    ```\n\n![](img/image00483.jpeg)\n\n在“工具”（Utilities）模块中，进入“工具”（Utilies）菜单，“配置”（Config）子菜单，“房间”（Rooms）项。\n\
    \n![](img/image00484.jpeg)\n\n在“房间列表”表中，我们可以验证想要更改状态的状态。\n\n![](img/image00485.jpeg)\n\
    \n在“工具”（Utilities）中，进入“属性”（Property）菜单，“配置”（Config）子菜单。\n\n![](img/image00486.jpeg)\n\
    \n屏幕将出现。在此屏幕上选择要更改房间类型的房间号，重要的是房间只有在处于以下状态时才能更改：\n\n- FO_STATUS: 空\n- ROOM_STATUS:\
    \ 已检查\n\n指定房间号并选择新的房间类型。\n\n![](img/image00487.jpeg)\n\n如果房间已入住或已预订，将显示相应的错误信息，从而阻止重新分配房间类型。\n\
    \n![](img/image00488.jpeg)\n\n我们在房图（Room Plan）中查看预订情况，要显示房图按 `Ctrl + F3` 键，如果将鼠标悬停在图标上，可以看到摘要。\n\
    \n![](img/image00489.jpeg)\n\n等待房间释放。\n为了继续示例，我们通过房图找到未预订且空空的房间，在我们的案例中是房间 1018。\n\
    \n![](img/image00490.jpeg)\n\n点击“是”按钮。房间类型的更改将完成。\n\n![](img/image00491.jpeg)\
    \ ![](img/image00492.jpeg)\n\n## Opera 管理中有用的 Oracle 查询\n\n### 按活动产量 (Production\
    \ byevent)\n```sql\nSELECT a.room, a.resv_name_id, a.passerby_name, a.trx_code,\
    \ a.trx_date, a.guest_account_debit\nFROM financial_transactions_view to\nWHERE\
    \ to_char (a.trx_date,'RRRR') = 2019\nand a.guest_account_debit <> 0.00\nand a.trx_code\
    \ IN (2580,2503)\n```\n\n### 锁定房间 (Habitaciones blocked)\n```sql\nSELECT distinct\
    \ a.room, a.description, b.begin_date, b.end_date,\nb.repair_remarks, b.reason_code,\
    \ a.room_status, b.completed_date\nFROM room a, room_repairs b\nWHERE substr (a.room_status,1,1)='O'\n\
    and a.room=b.room\nand b.end_date> =TO_CHAR (pms_p.business_date)\nand b.begin_date<=TO_CHAR\
    \ (pms_p.business_date)\nand b.completed_date is NULL\n```\n\n"
- fmt: "\n```sql\nORDER BY room, BEGIN_DATE\n```\n\n### Habitaciones reserved\n\n\
    ```sql\nSELECT distinct a.share_id, a.room, a.room_category_label, a.company_name,\
    \ a.sguest_name, a.guest_country_desc,\n      a.trunc_arrival, a.trunc_departure,\
    \ a.currency_code, a.share_amount,\n      a.market_desc, a.confirmation_no, a.market_code,\
    \ a.effective_rate_amount, a.fixed_charge\nFROM reservation_general_view to\n\
    WHERE substr (a.ARRIVAL,1,11)=TO_CHAR (SYSDATE)\nand (A.RESV_STATUS='RESERVED'OR\
    \ A.RESV_STATUS='PROSPECT')\nand a.share_amount<>0.00\n```\n\n### Income by company\
    \ and market\n```sql\nSELECT distinct a.share_id, a.room, a.room_category_label,\
    \ a.company_name, a.sguest_name, a.guest_country_desc,\n      a.trunc_arrival,\
    \ a.trunc_departure, a.currency_code, a.share_amount,\n      a.market_desc, a.confirmation_no,\
    \ a.market_code, a.effective_rate_amount, a.fixed_charge\nFROM reservation_general_view_hld\
    \ to\nWHERE a.resv_status='CHECKED IN'\nand a.share_amount>0.00\nUNION ALL\nSELECT\
    \ distinct a.share_id, a.room, a.room_category_label, a.company_name, a.sguest_name,\
    \ a.guest_country_desc,\n      a.trunc_arrival, a.trunc_departure, a.currency_code,\
    \ a.share_amount,\n      a.market_desc, a.confirmation_no, a.market_code, a.effective_rate_amount,\
    \ a.fixed_charge\nFROM reservation_general_view_hld to\nWHERE a.resv_status='CHECKED\
    \ IN'\nand substr (a.market_code,1,2)='80' and a.financially_responsible_yn is\
    \ null\n```\n\n### Rooms per day\n```sql\nSELECT a.considered_date, sum (a.no_rooms),\
    \ sum (a.arrival_rooms), sum (a.departure_rooms), sum (a.complimentary_rooms),\n\
    \      sum (a.net_room_revenue)\nFROM rep_res_statistics_forecast to\nWHERE (a.CONSIDERED_DATE\
    \ BETWEEN TO_CHAR (SYSDATE-TO_CHAR (sysdate-1,'DD')) and TO_CHAR (SYSDATE+366))\
    \ and a.ROOM_CATEGORY<>'-1'\nAND ((a.Deduct_yn='N' AND a.market_code='50A') or\
    \ a.deduct_yn='Y')\nGROUP BY a.CONSIDERED_DATE\n```\n\n### Forecast by Marked\
    \ Code Monthly\n```sql\nSELECT\n    CONSIDERED_MONTH,\n    CONSIDERED_YEAR,\n\
    \    MARKET_GROUP,\n    MARKET_GROUP_DESC,\n    SUM (no_rooms) NO_ROOMS,\n   \
    \ SUM (room_revenue) ROOM_REVENUE,\n    market_code\nFROM(\n    SELECT\n     \
    \   CONSIDERED_MONTH,\n        CONSIDERED_YEAR,\n        CONSIDERED_DATE,\n  \
    \      MARKET_GROUP,\n        MARKET_GROUP_DESC,\n        MARKET_CODE,\n     \
    \   SUM (no_rooms) NO_ROOMS,\n        SUM (room_revenue) ROOM_REVENUE\n    FROM(\n\
    \        SELECT\n            to_char (rsf.Considered_date,'MONTH') CONSIDERED_MONTH,\n\
    \            to_char (rsf.Considered_date,'RRRR') CONSIDERED_YEAR,\n         \
    \   mc.parent_market_code MARKET_GROUP,\n            mg.description MARKET_GROUP_DESC,\n\
    \            rsf.market_code MARKET_CODE,\n            rsf.considered_date CONSIDERED_DATE,\n\
    \            decode (rsf.room_category,-1,0, rsf.no_rooms) NO_ROOMS,\n       \
    \     rsf.net_room_revenue ROOM_REVENUE\n        FROM\n            rep_res_statistics_forecast\
    \ rsf, markets mc, market_groups mg\n        WHERE\n            rsf.CONSIDER_DATE\
    \ BETWEEN TO_CHAR (SYSDATE -TO_CHAR (date-1,'DD')) and TO_CHAR (SYSDATE+135)\n\
    \            AND (mc.Parent_market_code = mg.Market_group AND rsf.Market_code\
    \ = mc.Market_code)\n            AND rsf.deduct_yn='Y'\n        GROUP BY\n   \
    \         CONSIDERED_MONTH,\n            CONSIDERED_YEAR,\n            CONSIDERED_DATE,\n\
    \            MARKET_GROUP,\n            MARKET_GROUP_DESC,\n            MARKET_CODE\n\
    \        ORDER BY\n            CONSIDERED_MONTH,\n            CONSIDERED_YEAR,\n\
    \            CONSIDERED_DATE,\n            MARKET_GROUP,\n            MARKET_GROUP_DESC,\n\
    \            MARKET_CODE\n    )\n    GROUP BY\n        CONSIDERED_MONTH, CONSIDERED_YEAR,\
    \ MARKET_GROUP, MARKET_GROUP_DESC, market_code\n    ORDER BY\n        CONSIDERED_MONTH,\
    \ CONSIDERED_YEAR, MARKET_GROUP, market_code\n)\n```\n\n### Bookings per day\n\
    ```sql\nSELECT a.business_date_created as F_Reserva, a.trunc_arrival as Arrival,\
    \ a.trunc_departure as Output, a.nights,\n      a.room_category_label as Room,\
    \ a.share_amount as rate, a.rate_code, a.guarantee_code,\n      a.sfirst_guest_name\
    \ as names, a.guest_name as name, a.company_name, a.travel_agent_name,\n     \
    \ b.srep_code as Executive, a.share_amount\nFROM reservation_general_view a, name_view\
    \ b\nWHERE a.room_category_label<>'PM'\nand a.resv_status<>'CANCELLED'\nand a.share_amount\
    \ > 0.00\nand b.name_id (+)= decode (a.company_id,null, a.travel_agent_id, a.company_id)\n\
    and a.business_date_created =TO_CHAR (business_date)\nORDER BY a.trunc_arrival\n\
    ```\n\n### Production by sales executive\n```sql\nSELECT a.room_revenue, a.share_amount,\
    \ b.srep_code, a.rate_code,\n      a.sfirst_guest_name || '' || a.guest_name as\
    \ names,\n      a.trunc_arrival, a.trunc_departure, a.company_name, a.origin_of_booking,\
    \ a.guarantee_code\nFROM reservation_general_view a, name_view b\nWHERE a.guarantee_code\
    \ not in ('G01', 'G02')\nand a.resv_status<>'CANCELLED'\nand a.share_amount >\
    \ 0.00\nand b.name_id = decode (a.company_id,null, a.travel_agent_id, a.company_id)\n\
    and (a.trunc_departure >= TO_CHAR (SYSDATE))\nUNION ALL\nSELECT a.available_revenue,\
    \ a.avg_rate, a.owner_code, a.rate_code,\n      'BLK' || a.description,\n    \
    \  a.begin_date, a.end_date, a.acc_name, a.source, a.guarantee_code\nFROM sc_busblock_info\n\
    WHERE a.status<>'C'\nand a.available_rooms>0\nand a.avg_rate >0\nand a.guarantee_code\
    \ not in ('G01', 'G02')\n```\n\n### Production per room\n```sql\nSELECT 'F' HF,\
    \ to_char (a.Trunc_arrival,'DD') DD, to_char (a.Trunc_arrival,'MM') MM, to_char\
    \ (a.Trunc_arrival,'YYYY') YY,\n      a.nights Nights, a.room_category CRoom,\
    \ a.share_amount Rate, b.srep_code Owner,\n      a.trunc_arrival Arrival, a.trunc_departure\
    \ Departure, a.company_name Company\nFROM reservation_general_view a, name_view\
    \ b\nWHERE a.resv_status<>'CANCELLED'\nand a.share_amount > 0.00\nand b.name_id\
    \ = decode (a.company_id,null, a.travel_agent_id, a.company_id)\nand (a.trunc_departure\
    \ >= TO_CHAR (SYSDATE))\nUNION ALL\nSELECT 'F' HF, to_char (a.Trunc_arrival,'DD')\
    \ DD, to_char (a.Trunc_arrival,'MM') MM, to_char (a.Trunc_arrival,'YYYY') YY,\n\
    \      a.nights Nights, a.room_category CRoom, a.share_amount Rate, b.srep_code\
    \ Owner,\n      a.trunc_arrival Arrival, a.trunc_departure Departure, a.company_name\
    \ Company\nFROM reservation_general_view a, name_view b\nWHERE a.resv_status<>'CANCELLED'\n\
    and a.share_amount > 0.00\nand b.name_id = decode (a.company_id,null, a.travel_agent_id,\
    \ a.company_id)\nand (a.trunc_departure >= TO_CHAR (SYSDATE))\nUNION ALL\nSELECT\
    \ 'F' HF, to_char (a.Trunc_arrival,'DD') DD, to_char (a.Trunc_arrival,'MM') MM,\
    \ to_char (a.Trunc_arrival,'YYYY') YY,\n      a.nights Nights, a.room_category\
    \ CRoom, a.share_amount Rate, b.srep_code Owner,\n      a.trunc_arrival Arrival,\
    \ a.trunc_departure Departure, a.company_name Company\nFROM reservation_general_view\
    \ a, name_view b\nWHERE a.resv_status<>'CANCELLED'\nand a.share_amount > 0.00\n\
    and b.name_id = decode (a.company_id,null, a.travel_agent_id, a.company_id)\n\
    and (a.trunc_departure >= TO_CHAR (SYSDATE))\nUNION ALL\nSELECT 'F' HF, to_char\
