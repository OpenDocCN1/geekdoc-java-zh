    \n            ln_cost_tota:=ln_cant_tota*ln_cost_uni_tota;\n\n            ln_inv_ist:=ln_cant_tota;\n\
    \n            ln_inv_esp:=ln_cost_uni_tota;\n\n            ln_total:=ln_cost_tota;\n\
    \n INSERT  INTO MCDATA.GTT_KARDEX_VALORIZADO\n\n                  (KST_ID,\n\n\
                       KST_ADRESSE,\n\n                   KST_NAME,\n\n                  \
    \ FEC_INI_PER,\n\n                   FEC_FIN_PER,\n\n                   ART_ID,\n\
    \n                   WES_TYP,\n\n                   ART_COD,\n\n                  \
    \ ART_NAME,\n\n                   ART_INFO,\n\n               VPK_NR,\n\n              \
    \ VPK_NAME,\n\n               TIPO_OPE,\n\n               LFS_STATUS,\n\n              \
    \ LFP_STATUS,\n\n               WES_ID1,\n\n               WES_ID2,\n\n                   \
    \ WES_DOCDATE,\n\n                    TIPO_DOC,\n\n                    SERIE_DOC,\n\
    \n                    NRO_DOC,\n\n                    CNT_COM,\n\n              \
    \ CST_UNI_COM,\n\n               CST_TOT_COM,\n\n               CNT_VTA,\n\n              \
    \ CST_UNI_VTA,\n\n               CST_TOT_VTA,\n\n                   CNT_SLD_FIN,\n\
    \n                   CST_UNI_SLD_FIN,\n\n                   CST_TOT_SLD_FIN,\n\
    \n                   ID_GTT_KARDEX,\n\n                   ID_GTT_KARDEX_VALORIZADO)\n\
    \n VALUES\n\n                  (VC_ARTICULO.KST_ID,\n\n                   VC_ARTICULO.KST_ADRESSE,\n\
    \n                   VC_ARTICULO.KST_NAME,\n\nTO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n\
    \nTO_DATE(vs_fec_fin, 'DD/MM/YYYY'),\n\n                   VC_ARTICULO.ART_ID,\n\
    \n 0,\n\n                   VC_ARTICULO.ART_COD,\n\n                   VC_ARTICULO.ART_NAME,\n\
    \n                   VC_ARTICULO.ART_INFO,\n\n TRIM(VC_ARTICULO.VPK_NR),\n\n              \
    \ VC_ARTICULO.VPK_NAME,\n\n '16',\n\n 0,\n\n 0,\n\n null,\n\n 0,\n\nTO_DATE(vs_fec_ini,\
    \ 'DD/MM/YYYY'),\n\n '',\n\n '',\n\n 'INV INICIAL',\n\n NULL,\n\n NULL,\n\n NULL,\n\
    \n NULL,\n\n NULL,\n\n NULL,\n\n                   ln_inv_ist,\n\n                  \
    \ ln_inv_esp,\n\n                   ln_total,\n\n                   V_ID_GTT_KARDEX,\n\
    \n                   ID_GTT_KARDEX_VALORIZADO_SEQ.nextval);\n\n COMMIT;\n\n --Actualizamos\
    \ Saldo\n\nln_cant_tota := ln_inv_ist;\n\nln_cost_tota := ln_cost_tota;\n\n END\
    \  IF;\n\n END  IF;\n\n        ln_cant_tota:= ln_cant_tota + ROUND(NVL(VC_ARTICULO.CANT_COMPRA,0),4)\
    \ + ROUND(NVL(VC_ARTICULO.CANT_VENTA,0),4);\n\n        ln_cant_tota:=NVL(ln_cant_tota,0);\n\
    \n IF (VC_ARTICULO.CANT_COMPRA>0) THEN\n\nln_cost_uni_tota := ROUND(VC_ARTICULO.COST_UNI_COMPRA,4);\n\
    \n ELSE\n\n IF (VC_ARTICULO.CANT_VENTA>0) THEN\n\nln_cost_uni_tota := ROUND(VC_ARTICULO.COST_UNI_VENTA,4);\n\
    \n ELSE\n\nln_cost_uni_tota :=  CASE  WHEN VC_ARTICULO.COST_UNI_VENTA>0  THEN\
    \ ROUND(VC_ARTICULO.COST_UNI_VENTA,4) ELSE ROUND(VC_ARTICULO.COST_UNI_COMPRA,4)\
    \ END;\n\n END  IF;\n\n END  IF;\n\nln_cost_tota := ln_cost_uni_tota*ln_cant_tota;\n\
    \n --Tipo Operacion\n\n IF VC_ARTICULO.WES_TYP =  10  THEN\n\n IF VC_ARTICULO.LFP_STATUS\
    \ =  0  THEN\n\nls_tipo_ope :=  '02'; -- COMPRA\n\n ELSE\n\nls_tipo_ope :=  '05';\
    \ -- DEVOLUCION\n\n END  IF;\n\n ELSE\n\nls_tipo_ope := VC_ARTICULO.TIPO_OPE;\n\
    \n END  IF;\n\n INSERT  INTO MCDATA.GTT_KARDEX_VALORIZADO\n\n              (KST_ID,\n\
    \n               KST_ADRESSE,\n\n               KST_NAME,\n\n               FEC_INI_PER,\n\
    \n               FEC_FIN_PER,\n\n               ART_ID,\n\n               WES_TYP,\n\
    \n               ART_COD,\n\n               ART_NAME,\n\n               ART_INFO,\n\
    \n           VPK_NR,\n\n           VPK_NAME,\n\n           TIPO_OPE,\n\n          \
    \ LFS_STATUS,\n\n           LFP_STATUS,\n\n           WES_ID1,\n\n           WES_ID2,\n\
    \n           WES_DOCDATE,\n\n           TIPO_DOC,\n\n           SERIE_DOC,\n\n\
               NRO_DOC,\n\n           CNT_COM,\n\n           CST_UNI_COM,\n\n          \
    \ CST_TOT_COM,\n\n           CNT_VTA,\n\n           CST_UNI_VTA,\n\n          \
    \ CST_TOT_VTA,\n\n           CNT_SLD_FIN,\n\n           CST_UNI_SLD_FIN,\n\n          \
    \ CST_TOT_SLD_FIN,\n\n           ID_GTT_KARDEX,\n\n           ID_GTT_KARDEX_VALORIZADO)\n\
    \n VALUES\n\n              (VC_ARTICULO.KST_ID,\n\n               VC_ARTICULO.KST_ADRESSE,\n\
    \n               VC_ARTICULO.KST_NAME,\n\nTO_DATE(vs_fec_ini, 'DD/MM/RRRR'),\n\
    \nTO_DATE(vs_fec_fin, 'DD/MM/RRRR'),\n\n               VC_ARTICULO.ART_ID,\n\n\
                   VC_ARTICULO.WES_TYP,\n\n               VC_ARTICULO.ART_COD,\n\n\
                   VC_ARTICULO.ART_NAME,\n\n               VC_ARTICULO.ART_INFO,\n\
    \n TRIM(VC_ARTICULO.VPK_NR),\n\n           VC_ARTICULO.VPK_NAME,\n\n          \
    \ ls_tipo_ope,\n\n           VC_ARTICULO.LFS_STATUS,\n\n           VC_ARTICULO.LFP_STATUS,\n\
    \n           VC_ARTICULO.WES_ID1,\n\n           VC_ARTICULO.WES_ID2,\n\n          \
    \ VC_ARTICULO.WES_DOCDATE,\n\n           VC_ARTICULO.TIPO_DOC,\n\n           VC_ARTICULO.SERIE_DOC,\n\
    \n           VC_ARTICULO.NRO_DOC,\n\n           VC_ARTICULO.CANT_COMPRA,\n\n          \
    \ VC_ARTICULO.COST_UNI_COMPRA,\n\n           VC_ARTICULO.COST_TOT_COMPRA,\n\n\
               VC_ARTICULO.CANT_VENTA*(-1),\n\n           VC_ARTICULO.COST_UNI_VENTA,\n\
    \n           VC_ARTICULO.COST_TOT_VENTA*(-1),\n\n           ln_cant_tota,\n\n\
               ln_cost_uni_tota,\n\n           ln_cost_tota,\n\n           V_ID_GTT_KARDEX,\n\
    \n           ID_GTT_KARDEX_VALORIZADO_SEQ.nextval);\n\n COMMIT;\n\n END  LOOP;\n\
    \n select sum(LAST_CNT_SLD_FIN),sum(LAST_CST_TOT_SLD_FIN) INTO V_SUM_LAST_CNT_SLD_FIN,\
    \ V_SUM_LAST_CST_TOT_SLD_FIN from (\n\n SELECT ART_ID,max(LAST_CNT_SLD_FIN) LAST_CNT_SLD_FIN,max(LAST_CST_TOT_SLD_FIN)\
    \ LAST_CST_TOT_SLD_FIN FROM (\n\n SELECT ART_ID,\n\nLAST_VALUE(CNT_SLD_FIN) OVER\
    \ (PARTITION  BY ART_ID ORDER  BY ID_GTT_KARDEX_VALORIZADO ASC  ROWS  BETWEEN\
    \  UNBOUNDED  PRECEDING  AND  UNBOUNDED  FOLLOWING) AS LAST_CNT_SLD_FIN,\n\nLAST_VALUE(CST_TOT_SLD_FIN)\
    \ OVER (PARTITION  BY ART_ID ORDER  BY ID_GTT_KARDEX_VALORIZADO ASC  ROWS  BETWEEN\
    \  UNBOUNDED  PRECEDING  AND  UNBOUNDED  FOLLOWING) AS LAST_CST_TOT_SLD_FIN\n\n\
    \ FROM MCDATA.GTT_KARDEX_VALORIZADO\n\n WHERE id_gtt_kardex=V_ID_GTT_KARDEX\n\n\
                )\n\n group  by ART_ID\n\n  );\n\n SELECT COUNT(1) INTO V_QUANTITY\
    \ FROM MCDATA.GTT_KARDEX_VALORIZADO WHERE ID_GTT_KARDEX=V_ID_GTT_KARDEX;\n\n INSERT\
    \  INTO MCDATA.GTT_KARDEX(ID_GTT_KARDEX,INSERT_DATE,QUANTITY_RECORDS,STATUS_REG,P_FECHA_INICIO,P_FECHA_FIN,P_ID_ESTABLECIMIENTO,SUM_LAST_CNT_SLD_FIN,SUM_LAST_CST_TOT_SLD_FIN)\n\
    \n VALUES(V_ID_GTT_KARDEX,CURRENT_TIMESTAMP,V_QUANTITY,1,vs_fec_ini,vs_fec_fin,vn_kst_id,V_SUM_LAST_CNT_SLD_FIN,V_SUM_LAST_CST_TOT_SLD_FIN);\n\
    \n COMMIT;\n\n SELECT V_ID_GTT_KARDEX INTO P_OUT_ID_GTT_KARDEX FROM DUAL;\n\n\
    EXCEPTION\n\n WHEN OTHERS THEN\n\nln_nError := SQLCODE;\n\nls_cError := SQLERRM(ln_nError);\n\
    \n      RAISE_APPLICATION_ERROR(-20001,\n\nls_mensaje || TO_CHAR(ln_nError) ||\
    \  ', '  ||\n\n                              ls_cError);\n\nEND;"
