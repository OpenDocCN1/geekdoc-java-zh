    # Issuance of vouchers, Invoices and Ballots from Opera PMS


    In order to issue a Ballot, we must verify that the client has the `Tax Type`
    field as a `TICKET` in the Client''s profile.


    enter the menu `Front Desk` option `In House Guests` to list all clients who are
    staying at the Hotel.


    ![](Images/image00344.jpeg)


    On the `In House Guest` screen, select the client for whom you want to verify
    the `Tax Type` of their profile and select the radio button `Profile`.


    ![](Images/image00345.jpeg)


    The `Individual Profile` screen shows the most important customer data. on this
    screen select the option button `More Fields`.


    ![](Images/image00346.jpeg)


    On the `More Fields` screen make sure the `Tax Type` field is marked with the
    `TICKET` option and select the `OK` option button.


    ![](Images/image00347.jpeg)


    Upon returning to the `Individual Profile` screen, select the `Save` option button
    to save the changes made, then click on the `Ok` and `Close` button.


    With this we make sure that the client has the `Tax Type` as `TICKET`, which will
    allow us to generate the receipt of payment type `Ticket`.


    Enter the menu `Cashiering` option `Billing` to show the clients that are hosted
    for which it is possible to generate a proof of payment for any concept of stay,
    consumption or services.


    Previously, the `Login` screen will be shown to request the `ATM` access credentials.


    ![](Images/image00348.jpeg)


    On the `In House Guest Search` screen, filter the `Due Outs` records, which are
    the records of clients pending departure, clients who are staying and consume
    the services that the Hotel offers to which a payment receipt must be generated.,
    in this case a Ballot.


    Select the `Due Outs` option and click on the `Search` option button.


    ![](Images/image00349.jpeg)


    On the `House Guest Search` screen, select the customer record for which you want
    to generate the payment slip and then click on the `Select` button. The `Billing`
    screen will be displayed.


    ![](Images/image00350.jpeg)


    On the `Billing` screen the customer''s account details are displayed. It is important
    to indicate that on this screen you can have up to 8 Windows, windows that will
    allow us to classify the customer''s accounts and generate receipts for each Window.


    Let''s observe that Window `(02)` has an account of `140.80 USD` that is not yet
    paid and that Window `(03)` has an account of `32.00 USD` that is paid through
    the `VISA` payment method.


    Select Windows `(02)` and click on the option button `Check Out`, the `Payment`
    screen will be displayed.


    ![](Images/image00351.jpeg)


    In the `Payment` screen, select the option `Payment Code` to `Cash Dollars`, the
    Currency option to `USD`, in the `Amount` field indicate the amount `140.80` and
    in the `Reference` field indicate a description of the account, then click on
    the option button `Post` with this the payment is loaded into the system and the
    account is closed.


    ![](Images/image00352.jpeg)


    On the next screen Popup indicate `No`, to send the receipt to the digital tax
    document issuer program in your Country (or Electronic Invoicing of the Central
    Tax Administration)


    ![](Images/image00353.jpeg) ![](Images/image00354.jpeg)


    This process of sending the receipt to the digital tax document issuer program
    in your Country (or Electronic Invoicing of the Central Tax Administration) allows
    us to generate the receipt of payment type Ticket.

