    \ (Closing Balance). Closing balance for the account. This column is calculated\
    \ by the following formula: Opening Balance + Debits + Transfer Debit - Credits\
    \ - Transfer Credits.\n\nThe SQL query for Oracle:\n\nSELECT t.room, t.guest_name,\
    \ t.arrangement_desc,\n\nt.trx_code, t.trx_no,\n\nt.description,\n\nt.old_balance,\
    \ t.credit, t.debit, t.transfer_credit, t.transfer_debit, t.new_balance\n\nFROM(\n\
    \n SELECT\n\n        fs.trx_no,\n\n        ar.arrangement_desc,\n\n        fs.resv_name_id,\n\
