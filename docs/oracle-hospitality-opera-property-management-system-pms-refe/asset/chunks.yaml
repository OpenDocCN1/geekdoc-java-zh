    \nOn the \"Reports - Configuration\" screen, select the \"New\" option button.\n\
    \n![](Images/image00455.jpeg)\n\nOn the \"Reports - New\" screen we indicate the\
    \ name of the report, in this case \"Custom Payment Report\", in the \"Report\
    \ Group\" field select the option \"Utilities\" and leave the other options as\
    \ shown in the image.\n\n![](Images/image00456.jpeg)\n\nIn the “File Name” field\
    \ we click on the List button, the “File List” screen will be displayed, on this\
    \ screen we select the .rep file that we have created from the “Oracle Reports\
    \ Builder” in previous steps.\n\nWe select the report \"custom_reporte_pagos.rep\"\
    \ and click on the \"OK\" button to select this file.\n\n![](Images/image00457.jpeg)\n\
    \nIn the \"Reports New\" screen we select the \"Parameter\" button, the \"Parameters\"\
    \ screen will be displayed to create the \"P_BUSDATE\" parameter that the payment\
    \ report requires.\n\n![](Images/image00456.jpeg)\n\nIn the “Parameters” screen\
    \ enter the following data for the P_BUSDATE parameter and click on the “OK” button.\n\
    \n![](Images/image00458.jpeg)\n\nTo display the report asuser on the \"PMS\" screen\
    \ click the radio button \"Miscellaneous\" option \"Reports\"\n\n![](Images/image00459.jpeg)\n\
    \nin the \"Reports\" screen locate the report payments created and click the \"\
    OK\" button\n\n![](Images/image00460.jpeg)\n\nwill display the \"Report Parameters\"\
    \ screen, on this screen indicate a certain date and click on the \"Preview\"\
    \ button.\n\n![](Images/image00461.jpeg)\n\nThe payment report designed in the\
    \ \"Oracle Reports Builder\" will be displayed.\n\n![](Images/image00462.jpeg)\n\
    \n# Creation of ForeCast and History report in Opera PMS\n\nRevenue Management\
    \ is a technique that consists of selling the right product, to the right customer,\
    \ at the right time and at the right price, it is about predicting consumer behavior\
    \ in order to maximize revenue and minimize costs."
