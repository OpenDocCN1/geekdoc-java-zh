    ## Creation of reports with Opera PMS and Oracle Reports Developer


    To create custom reports in Opera, you must first create the SQL statement that
    will obtain the report data from the Oracle database of Opera, then design the
    report in the `Oracle Reports Developer` tool and at the end assign an option
    in the reports list available from Opera.


    It is very important to use the correct version of `Oracle Reports Developer`,
    usually this tool is installed by the Opera PMS provider.


    | Opera | Oracle Reports Developer |

    | :--- | :--- |

    | v 5.0 | v 10.1.2.0 |

    | v 5.5 | v 11.1.2.2.0 |


    In this blog we will make a report that lists the list of hosted clients.


    We carry out the SQL statement that extracts the data from the Oracle database
    of Opera.


    ```sql

    SELECT a.room, trim (initcap (a.guest_first_name)) || '' ''|| trim (initcap (a.sname))
    As Name,

    trim (a.company_name) ||'' ''|| a.travel_agent_name As Company,

    a.resv_status, a.arrival, a.departure

    FROM reservation_general_view

    WHERE (a.resv_status ='' CHECKED IN ''OR a.resv_status ='' DUE OUT '')

    ORDER BY a.room

    ```


    We will use the view `reservation_general_view`, this view has the necessary query
    to extract the data of all the reservations of the clients, in their different
    states:

    - CHECKED IN

    - PROSPECT

    - CANCELLED

    - NO SHOW

    - CHECKED OUT

    - RESERVED


    We execute this query in the development environment `Oracle SQL Developer` to
    validate that the query works properly.


    ![](Images/image00415.jpeg)


    We execute the design program `Oracle Reports Developer`.


    ![](Images/image00416.jpeg)


    The Builder will be shown


    ![](Images/image00417.jpeg)


    We connect the builder to the database, for this we select the `File` menu option
    `Connect ...`.


    ![](Images/image00418.jpeg)


    The connection wizard will be displayed to the database where you must put the
    `User`, `Password` and the instance name of the Oracle database. then click on
    the radio button `Connect` to connect to the database.


    ![](Images/image00419.jpeg)


    Select the `File` Menu, `New` / `Report…` menu option, the `New Report` wizard
    will be displayed. select the option `Use the Report Wizard` and click on the
    option button `OK`.


    ![](Images/image00420.jpeg)


    The wizard `Report Wizard!` will be displayed, click on the option button `Next>`.


    ![](Images/image00421.jpeg)


    Keep the option `Create both Web and Paper Layout` selected by default and click
    on the `Next>` button.


    ![](Images/image00422.jpeg)


    We place the name of the report in the `Report Group` and click on `Next`.


    ![](Images/image00423.jpeg)


    Select the option `SQL Query` and click on the option `OK`.


    ![](Images/image00424.jpeg)


    In the Data Source definition we place the `SQL Query` that allows the extraction
    of data from the Oracle database and click on `Next>`.


    ![](Images/image00425.jpeg)


    We select all the fields of the Query that will be shown and we click on `Next>`.


    ![](Images/image00426.jpeg)


    On the screen for totalizing fields, it is not necessary to totalize by a certain
    field, we click on `Next>`.


    ![](Images/image00427.jpeg)


    Select a report template and click on `Next>`.


    ![](Images/image00428.jpeg)


    Keep the option `Create both Web and Paper Layout` selected by default and click
    on the `Next>` button.


    ![](Images/image00429.jpeg)


    We place the report name and click on `Finish`.


    ![](Images/image00430.jpeg)


    Then preview the report as follows:


    ![](Images/image00431.jpeg)


    compile the report by clicking on the `Compile` menu, `All`.


    ![](Images/image00432.jpeg)


    Click on `Ok` to confirm the compilation process.


    ![](Images/image00433.jpeg)


    After compiling the report it is important to export the report file in `.rep`
    format, a format that can be used from Opera.


    ![](Images/image00434.jpeg) ![](Images/image00435.jpeg)


    The `.rep` report files must be placed in the `rtimes` folder located at the following
    address: `D:\MICROS\OPERA\production\rtimes`. We enter the Opera Configuration
    module.


    ![](Images/image00436.jpeg)


    Select the menu options `Setup`, menu option `Report Setup` option `Reports`.


    ![](Images/image00437.jpeg)


    The `Reports - Configuration` screen will be displayed, click on the `New` button.


    ![](Images/image00438.jpeg)


    On the `Reports - New` screen, place the name of the report and select a specific
    `Report Group`.


    ![](Images/image00439.jpeg)


    We click on the list selections button associated with `File Name`. in the `File
    List` screen we look for the report file `.rep`.


    ![](Images/image00440.jpeg) ![](Images/image00441.jpeg)


    We make sure that the report `custom_report_huespedes.rep` is in the `Reports
    - Configuration` screen.


    ![](Images/image00442.jpeg)


    To show the new report, we select the option button `Miscellaneous`, option `Reports`,
    the `Reports` screen will be shown.


    ![](Images/image00443.jpeg)


    In the `Reports` screen find the report `Custom Guest Report` and click on the
    `Ok` button.


    ![](Images/image00444.jpeg)


    The `Report Parameters` screen will be displayed and click on the `Preview` button.


    ![](Images/image00445.jpeg)


    The customized report will be displayed.


    ![](Images/image00446.jpeg)

