    \n 0),\n\n 0) credit,\n\n - all GL debits posted on p_from_date\n\n                 \
    \ DECODE (fs.from_resv_id,NULL, decode (pms_p.business_date - trunc (fs.trx_date),\n\
    \n 0, nvl (fs.Guest_account_debit,0),\n\n 0),\n\n 0) debit,\n\n - all GL transfer\
    \ credits from other reservations posted on p_from_date\n\n                  DECODE\
    \ (fs.from_resv_id,NULL,0,\n\n                                      decode (pms_p.business_date\
    \ - trunc (fs.trx_date),\n\n 0, nvl (fs.Guest_account_credit,0),\n\n 0)) transfer_credit,\n\
    \n - all GL transfer debits from other reservations posted on p_from_date\n\n\
                      DECODE (fs.from_resv_id,NULL,0,\n\n                                     \
    \ decode (pms_p.business_date - trunc (fs.trx_date),\n\n 0, nvl (fs.Guest_account_debit,0),\n\
    \n 0)) transfer_debit,\n\n - all GL postings posted on p_from_date or before\n\
    \n                 DECODE (abs (pms_p.business_date - trunc (fs.trx_date)),\n\n\
    \ -1,0,\n\n                          NVL (fs.Guest_account_debit,0) - NVL (fs.Guest_account_credit,0))\
    \ new_balance\n\n FROM financial_transactions_view fs\n\n inner  join rep_reservation_all_view\
    \ rv on (fs.resv_name_id = rv.resv_name_id)\n\n inner  join trx$_codes co on \
    \ (co.trx_code=fs.trx_code)\n\n inner  join trx$_code_arrangementar on  (ar.arrangement_id=co.arrange_code)\n\
    \n where fs.resv_name_id IN\n\n              (- all resv_name_ids that had a posting\
    \ today\n\n SELECT resv_name_id\n\n FROM financial_transactions ftx\n\n WHERE\
    \ ftx.resort = : RESORT\n\n AND ftx.trx_date = pms_p.business_date\n\n AND ftx.resv_name_id\
    \ IS  NOT  Null\n\n UNION  ALL\n\n - all reservations that were (supposed to be)\
    \ in-house today\n\n SELECT resv_name_id\n\n FROM reservation_daily_elements rde,\n\
    \n                      reservation_daily_element_name rdn\n\n WHERE rde.resort\
    \ =  : RESORT\n\n AND rde.reservation_date = pms_p.business_date\n\n AND rdn.resort\
    \ = rde.resort\n\n AND rdn.reservation_date = rde.reservation_date\n\n AND rdn.resv_daily_el_seq\
    \ = rde.resv_daily_el_seq\n\n UNION  ALL\n\n SELECT resv_name_id\n\n FROM reservation_name\
    \ rn\n\n WHERE rn.resort =  : RESORT\n\n AND rn.post_co_flag =  'O'\n\n     )\n\
    \n AND fs.trx_date <= pms_p.business_date\n\n AND (fs.Guest_account_credit IS\
    \  NOT  Null  OR fs.guest_account_debit IS  NOT  NULL)\n\n and fs.resv_name_id=3142559\
    \  and rv.room='0206'\n\n) t\n\nORDER  BY t.room, t.arrangement_desc, t.trx_code,\
    \ t.trx_no\n\nIt is important to tell you that just as we did in HouseKeeping\
    \ to show the status of the rooms from the smartphone, analytical reports can\
    \ be developed based on the Trial Balance to have the income status online.\n\n\
    # Room Status and Housekeeping Status in Opera PMS, Online web query from Smartphone\n\
    \nIn this blog we show the development of a responsive web system that shows the\
    \ status of the rooms of a property, this web system is very important for the\
    \ agile operation of the supervisors of rooms, supervisors constantly check the\
    \ status of the rooms online from their cell phones and avoid having to go to\
    \ a desktop PC to consult the opera report on the status of the rooms.\n\nThe\
    \ states of the rooms to consider are the following:"
