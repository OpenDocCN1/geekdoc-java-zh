- fmt: "\n```sql\nSELECT ROOM_STATUS_ID, ROOM_STATUS_CODE, ROOM_STATUS_DESC FROM OPERA.ROOM_STATUS_CODES_ALL\n\
    ```\n\n| ROOM_STATUS_ID | ROOM_STATUS_CODE | ROOM_STATUS_DESC |\n| :--- | :---\
    \ | :--- |\n| 1 | CL | Clean |\n| 2 | DI | Dirty |\n| 3 | IP | Inspected |\n|\
    \ 4 | OS | Out of Service |\n| 5 | OO | Out of Order |\n\n```sql\nSELECT DISTINCT\
    \ HK_STATUS FROM OPERA.ROOM\n```\n\nOCC: occupied\nVAC: vacant\n\n```sql\nSELECT\
    \ DISTINCT HK_STATUS FROM OPERA.ROOM\n```\n\nOCC: occupied\nVAC: vacant\n\nUse\
    \ the following Query to display the current status of the rooms of a certain\
    \ Floor:\n\n```sql\nSELECT r.room, r.room_status, r.hk_status, c.label, c.short_description,\n\
    CASE WHEN NVL (v.Resv_status,'F')='CHECKED IN' THEN 'CI' WHEN NVL (v.Resv_status,'F')='CHECKED\
    \ OUT' THEN 'CO' ELSE '' END resv_status,\nTO_CHAR (v.Arrival,'DD / MM') arrival,\n\
    TO_CHAR (v.Departure,'DD / MM') departure, TO_CHAR (v.Departure_time) departure_time,,CASE\
    \ WHEN r.hk_status<>r.fo_status THEN 'AND' ELSE 'N' END isdiscrepancy\nFROM OPERA.ROOM\
    \ r\nINNER JOIN OPERA.ROOM_CATEGORY_TEMPLATE c ON (r.Room_category=c.Room_category)\
    \ \nLEFT JOIN (\nSELECT r.room, MIN (r.resv_status) resv_status, min (r.arrival)\
    \ arrival, max (r.departure) departure, max (r.departure_time) departure_time\n\
    FROM reservation_general_view r\nWHERE r.trunc_departure> =pms_p.business_date\
    \ and r.room is not null\nAND r.resv_status IN ('CHECKED IN','CHECKED OUT')\n\
    GROUP BY r.room\n) v ON (v.room=r.room)\nWHERE SUITE_TYPE<>'PSUEDO' \nAND to_number\
    \ (r.Floor)=4--FLOOR\nORDER BY to_number (r.Floor) ASC, to_number (r.Room) ASC\n\
    ```\n\n![](Images/image00465.jpeg)\n\nThe screens of the web system that queries\
    \ the status of the rooms that are displayed from a smartphone device are shown\
    \ as follows:\n\n![](Images/image00466.jpeg) ![](Images/image00467.jpeg)\n\n##\
    \ Discrepancies\n\nDiscrepancies can be observed in Opera's “Room Discrepancy”\
    \ report:\nin the PMS module, enter the “Miscellaneous” menu, “Reports” submenu,\
    \ look for the “Room Discrepancy” report and click “OK”.\n\n![](Images/image00468.jpeg)\n\
    \nThe “Report Parameters” screen will be displayed, on this screen select the\
    \ “Room Status” you want to view.\n\n![](Images/image00469.jpeg)\n\nIn the “Room\
    \ Status” selections, observe the 2 different discrepancy states:\n\n![](Images/image00470.jpeg)\n\
    \n- **Skip / Sleep Discrepant**: Discrepancies based on room status.\n- **Persons\
    \ Discrepant**: Discrepancies based on number of guests per room.\n\nIn this example\
    \ we select the option \"ALL Rooms\", it will show us all the discrepancies of\
    \ the property.\n\n![](Images/image00471.jpeg)\n\nNote that the Skip or Sleep\
    \ discrepancies appear if the FO Status field is different from the HK Status\
    \ field.\n\nThe discrepancies in the status of the rooms occur for the following\
    \ reasons:\n\n- **Sleep**:\n  - `FO_STATUS` indicates `VAC` (front office registers\
    \ the guest check out)\n  - `HK_STATUS` indicates `OCC` (hk indicates that someone\
    \ is still in the room)\n- **Skip**:\n  - `FO_STATUS` indicates `OCC` (guest leaves\
    \ the room without checking out officially)\n  - `HK_STATUS` indicates `VAC` (HK\
    \ indicates that the room is vacant)\n\nTo resolve the discrepancies, enter the\
    \ Rooms Management menu, select the item “Housekeeping”, the Housekeeping screen\
    \ will be displayed with the options to be made. we select the option “Rm. Discrepancies\
    \ \".\n\n![](Images/image00472.jpeg)\n\nIn the \" Room Discrepancies \" screen,\
    \ you can see the discrepancy of states between the fields \"FO Status\" (Front\
    \ Office Status) and \"HK Status\" (HouseKeeping Status), to resolve the discrepancy\
    \ both states must match.\n\n![](Images/image00473.jpeg)\n\n## Accounting Accounts\
    \ assigned to Transaction Codes in Opera PMS\n\nIt is important to know that the\
    \ “Transaction Codes” that we use during the “Post” in “Billing” are associated\
    \ with certain accounting accounts that the tax administration of the country\
    \ of residence requires of us.\n\n![](Images/image00474.jpeg) ![](Images/image00475.jpeg)\n\
    \nTo show the correspondence or mapping between the “Transaction Codes” and the\
    \ Accounting Accounts, they are shown in the “BackOffice Interface Transaction\
    \ Codes Mapping” report. In the \"Miscellaneous\" menu, enter the option \"Reports\"\
    .\n\n![](Images/image00476.jpeg)\n\nIn the \"Reports\" screen, look for the report\
    \ \"BackOffice Interface Transaction Codes Mapping\" and then click OK, the report\
    \ is previewed with the correspondence between the \"Transaction Codes\" and the\
    \ Accounts Accountants\n\n![](Images/image00477.jpeg) ![](Images/image00478.jpeg)\n\
    \nIf you need to assign a certain Account to a “Transaction Code”, enter the “External”\
    \ menu, “Back Office” submenu, “Configuration” option.\n\n![](Images/image00479.jpeg)\n\
    \nIn the “Back Office” screen, select the “Transaction Codes” and click OK.\n\n\
    ![](Images/image00480.jpeg)\n\nThe \"Transaction Codes\" screen will be shown,\
    \ select Edit.\n\n![](Images/image00481.jpeg)\n\nThe screen for assigning Accounts\
    \ will be displayed, select the appropriate account and click.\n\n![](Images/image00482.jpeg)\n\
    \n## Change Room Type in Opera PMS\n\nThis will show the procedure to change the\
    \ Room Type of rooms.\nTo change the Room Type of rooms of the property, we filter\
    \ only the rooms that are not reserved and not occupied.\n\n```sql\nSELECT r.room,\
    \ r.room_status, r.hk_status, c.label, c.short_description,\nCASE WHEN NVL (v.Resv_status,'F')='CHECKED\
    \ IN' THEN 'CI' WHEN NVL (v.Resv_status,'F')='CHECKED OUT' THEN 'CO' ELSE '' END\
    \ resv_status,\nTO_CHAR (v.Arrival,'DD / MM') arrival,\nTO_CHAR (v.Departure,'DD\
    \ / MM') departure, TO_CHAR (v.Departure_time) departure_time\n,CASE WHEN r.hk_status<>r.fo_status\
    \ THEN 'AND' ELSE 'N' END isdiscrepancy\nFROM OPERA.ROOM r\nINNER JOIN OPERA.ROOM_CATEGORY_TEMPLATE\
    \ c ON (r.Room_category=c.Room_category) \nLEFT JOIN (\nSELECT r.room, MIN (r.resv_status)\
    \ resv_status, min (r.arrival) arrival, max (r.departure) departure, max (r.departure_time)\
    \ departure_time\nFROM reservation_general_view r\nWHERE r.trunc_departure> =pms_p.business_date\
    \ and r.room is not null\nAND r.resv_status IN ('CHECKED IN','CHECKED OUT')\n\
    GROUP BY r.room\n) v ON (v.room=r.room)\nWHERE SUITE_TYPE<>'PSUEDO' \nAND to_number\
    \ (r.Floor)=4--FLOOR\nORDER BY to_number (r.Floor) ASC, to_number (r.Room) ASC\n\
    ```\n\n![](Images/image00483.jpeg)\n\nIn the “Utilities” module, enter the “Utilies”\
    \ menu, “Config” submenu, “Rooms” item.\n\n![](Images/image00484.jpeg)\n\nIn the\
    \ “Room List” form, we can verify the status and characteristics of each of the\
    \ rooms that we want to change state.\n\n![](Images/image00485.jpeg)\n\nIn “Utilities”,\
    \ enter the “Property” menu, “Config” submenu, “Change Rooms” option.\n\n![](Images/image00486.jpeg)\n\
    \nThe screen appears. On this screen select the Room Number to which you want\
    \ to change the Room Type, it is important to consider that the rooms can be changed\
    \ only if they are in the following states:\n\n- `FO_STATUS`: `VAC` (Empty)\n\
    - `ROOM_STATUS`: `IP` (Inspected)\n\nWe indicate the room number and select the\
    \ new type of room to assign.\n\n![](Images/image00487.jpeg)\n\nIf the room is\
    \ occupied or reserved, the following error message will be displayed, thereby\
    \ preventing the reassignment of the room type.\n\n![](Images/image00488.jpeg)\n\
    \nWe review the reservation of the room in the Room Plan, to display the Room\
    \ Plan press the `Ctrl + F3` key, if we place the mouse pointer over the icon\
    \ you will see a summary.\n\n![](Images/image00489.jpeg)\n\nWe await the release\
    \ of the room.\nTo continue with the example we locate a room not reserved and\
    \ not occupied through the Room Plan, in our case room 1018.\n\n![](Images/image00490.jpeg)\n\
    \nWe click on the \"Yes\" button. the change of the Room Type will be made.\n\n\
    ![](Images/image00491.jpeg) ![](Images/image00492.jpeg)\n\n## Querys SQL Oracle\
    \ useful for administration in Opera PMS\n\n### Production byevent\n```sql\nSELECT\
    \ a.room, a.resv_name_id, a.passerby_name, a.trx_code, a.trx_date, a.guest_account_debit\n\
    FROM financial_transactions_view to\nWHERE to_char (a.trx_date,'RRRR') = 2019\n\
    and a.guest_account_debit <> 0.00\nand a.trx_code IN (2580,2503)\n```\n\n### Habitaciones\
    \ blocked\n```sql\nSELECT distinct a.room, a.description, b.begin_date, b.end_date,\n\
    b.repair_remarks, b.reason_code, a.room_status, b.completed_date\nFROM room a,\
    \ room_repairs b\nWHERE substr (a.room_status,1,1)='O'\nand a.room=b.room\nand\
    \ b.end_date> =TO_CHAR (pms_p.business_date)\nand b.begin_date<=TO_CHAR (pms_p.business_date)\n\
    and b.completed_date is NULL\n```\n"
