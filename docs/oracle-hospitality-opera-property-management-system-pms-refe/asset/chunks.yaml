    \ rsd, name_owner no, application$_user au, name n1, name n2\nWHERE\nno.name_id\
    \ = rsd.company_id\nand rsd.room_revenue<>0\nand no.primary_yn = 'Y'\nand au.person_name_id\
    \ = no.user_id\nand (rsd.resv_status <> 'CANCELLED' and rsd.resv_status <> 'NO\
    \ SHOW')\nand n1.name_id(+) = rsd.name_id\nand n2.name_id(+) = rsd.company_id\n\
    order by BUSINESS_DATE,room\n```\n\n### 按市场代码预测\n\n```sql\nSELECT\n    CONSIDERED_MONTH,\n\
    \    CONSIDERED_YEAR,\n    CONSIDERED_DATE,\n    MARKET_GROUP,\n    MARKET_GROUP_DESC,\n\
    \    MARKET_CODE,\n    NO_ROOMS,\n    ROOM_REVENUE\nFROM\n    to_char(rsf.considered_date,'MONTH')\
    \ CONSIDERED_MONTH,\n    to_char(rsf.considered_date,'RRRR') CONSIDERED_YEAR,\n\
    \    mc.parent_market_code MARKET_GROUP,\n    mg.description MARKET_GROUP_DESC,\n\
    \    rsf.market_code MARKET_CODE,\n    rsf.considered_date CONSIDERED_DATE,\n\
    \    decode(rsf.room_category,-1,rsf.no_rooms) NO_ROOMS,\n    rsf.net_room_revenue\
    \ ROOM_REVENUE\nFROM\nrep_res_statistics_forecast rsf, markets mc, market_groups\
    \ mg\nWHERE\nyear(rsf.CONSIDERED_DATE) =2019\nAND (mc.parent_market_code = mg.market_group\
    \ AND rsf.market_code = mc.market_code)\n```\n\n### 活动搜索 - 执行人员和客人的备注\n\n```sql\n\
    SELECT a.salesrep,a.insert_date, a.act_type, a.purpose,a.acc_name, a.con_name,\
    \ a.notes,a.problem_desc\nFROM activity_search a\nWHERE a.insert_date>= sysdate-1\n\
    ORDER BY a.insert_date\n```\n\n### 取消的订单\n\n```sql\nSELECT a.nights*a.share_amount\
    \ as trevenue, a.nights,b.srep_code,a.rate_code,a.sfirst_guest_name || '|| a.guest_name\
    \ as nombres, a.trunc_arrival, a.trunc_departure,\nb.name,a.cancellation_reason_desc\n\
    FROM reservation_general_view a, name_view b\nWHERE a.resv_status='CANCELLED'\n\
    and a.booked_room_category_label<>'PM'\nand substr(a.cancellation_date,1,11)>=TO_CHAR(SYSDATE-10)\n\
    and b.name_id = decode(a.company_id,null,a.travel_agent_id,a.company_id)\nORDER\
    \ BY a.trunc_arrival\n```\n\n### 按公司的联系人\n\n```sql\nSELECT a.name as Apellidos,a.first\
    \ as Nombre,a.udfc10 ,a.udfd11 as sexo,a.title as Trato,\na.business_title as\
    \ Cargo,a.email,a.name_id as Key_con_Cia,a.company Razon_Social,a.udfc12 as Nbr_Comercial,\n\
    a.address1 as Direccion,a.city as Distrito, a.udfc13 as Rubro, a.srep_code as\
    \ Owner,a.phone_no as Telefono,\na.mobile_phone_number as Celular,a.udfc14,a.udfc15,a.udfc16,a.udfc01\
    \ as DClub\nFROM name_view a\nWHERE a.tracecode='CON' and a.active_yn='Y' and\
    \ a.country='PE'\nORDER BY a.name\n```\n\n### 在 Material Controls Micros Fidelio\
    \ 中创建价值实物账\n\n```sql\ncreate or replace PROCEDURE SP_KARDEX_FISICO_VALORADO(\n\
