  trans: '

    预测是指使用如历史数据等不同的变量，对产品或服务的未来需求进行估计和分析。


    酒店预测的基础的主要变量之一是对物业在先前期间的统计数据的分析，通过这些数据，我们可以预测未来的收入，并做出适当的业务决策以纠正偏差，从而实现收入最大化和成本最小化。


    明确预测工具的重要性，特别是在线的、实时且通过手机直接从 `Opera PMS` 查询数据的预测工具，这对于物业的高效管理来说将是一个非常实用的工具。


    需要考虑的是，在线预测工具必须包含以下数据，其描述保留自原始 `Opera` 文档：


    - **日期 (Date)**：统计数据适用的日期。

    - **总入住率 (Total Occupancy)**：总占用房间数（非扣减、扣减、个人和团体）。

    - **入住房间数 (Arrival Rooms)**：在此日期入住的客房。对于入住，组合房间计为 1 个，而不是组成组合房间的物理房间数量。

    - **赠房数 (Comp Rooms)**：免费房间（关联到订单且房型代码标记为“免费”的房间）。

    - **员工用房 (House Use)**：员工用房（关联到订单且房型代码标记为“员工用房”的房间）。

    - **个人扣减房 (Individual Deduct)**：订单类型标记为“扣减库存”的个人预订。

    - **非扣减个人房 (Non-Deduct Individual)**：订单类型未标记为“扣减库存”的个人预订。

    - **团体扣减房 (Deduct Group)**：订单类型标记为“扣减库存”的团体预订。

    - **非扣减团体房 (Non-Deduct Group)**：订单类型未标记为“扣减库存”的团体预订。

    - **入住率 (Occupancy%)**：(`（总占用房间数 / 物业总房间数） x 100`）。

    - **房收入 (Room Revenue)**：与此日期相关的扣减、非扣减、个人和团体预订的住宿交易代码总收入。

    - **平均房价 (Average Rate)**：总房收入 / 占用房间数。

    - **退房房间数 (Departure Rooms)**：在此日期退房的客房。对于退房，组合房间计为 1 个，而不是组成组合房间的物理房间数量。

    - **当日入住房间数 (Day Use Rooms)**：该日的当日入住房间。

    - **未入住房间数 (No Show Rooms)**：该日的未入住房间数。


    为此，为 `Oracle` 构建了以下 `SQL Query`，用于获取本月收入（`HISTORY`）相对于预计年收入（`FORECAST`）的预测。


    ![](img/image00463.jpeg)


    该 `Query` 将成为构建手机在线预测工具的基础。


    ```sql

    SELECT rec_type rec_type,

    DECODE (rec_type,''A_STAT'', f_message (''REP_HISTORY'',''History''), f_message
    (''REP_FORECAST'',''Forecast'')) rec_type_desc,

    TO_CHAR (considered_date,''DD / MM / RRRR'') considered_date,

    SUM (no_rooms * count_resv_01) no_rooms,

    SUM (ind_deduct_rooms * count_resv_01) ind_deduct_rooms,

    SUM (ind_non_deduct_rooms * count_resv_01) ind_non_deduct_rooms,

    SUM (grp_deduct_rooms * count_resv_01) grp_deduct_rooms,

    SUM (grp_non_deduct_rooms * count_resv_01) grp_non_deduct_rooms,

    SUM (no_persons * count_resv_01) no_persons,

    SUM ( arrival_rooms * count_resv_01) arrival_rooms,

    SUM (departure_rooms * count_resv_01) departure_rooms,

    SUM (complimentary_rooms * count_resv_01) complimentary_rooms,

    SUM (house_use_rooms * count_resv_01) house_use_rooms,

    SUM (day_use_rooms * count_resv_01) day_use_rooms,

    SUM (no_show_rooms * count_resv_01) no_show_rooms,

    SUM (revenue * count_revenue_01) revenue,

    SUM (DECODE (group_yn,''N'', DECODE (deduct_yn,''Y'', revenue,0),0) * count_revenue_01)
    ind_deduct_revenue,

    SUM (DECODE (group_yn,''N'', DECODE (deduct_yn,''N'', revenue,0),0) * count_revenue_01)
    ind_non_deduct_revenue,

    SUM (DECODE (group_yn,''Y'', DECODE (deduct_yn,''Y'', revenue,0),0) * count_revenue_01)
    grp_deduct_revenue,

    SUM (DECODE (group_yn,''Y'', DECODE (deduct_yn,''N'', revenue,0),0) * count_revenue_01)
    grp_non_deduct_revenue,

    SUM (owner_rooms * count_resv_01) owner_rooms,

    SUM (ff_rooms * count_resv_01) ff_rooms

    FROM (

    SELECT SUBSTR (rsf.Rec_type,1,6) rec_type,

    rsf.considered_date considered_date,

    DECODE (rsf.owner_rental_flag,''H'',0, rsf.no_rooms) no_rooms,

    DECODE (rsf.owner_rental_flag,''H'',0, rsf.group_yn,''N'', DECODE (deduct_yn,''Y'',
    rsf.no_rooms,0)) ind_deduct_rooms,

    DECODE (rsf.owner_rental_flag,''H'',0, rsf.group_yn,''N'', DECODE (deduct_yn,''N'',
    rsf.no_rooms,0)) ind_non_deduct_rooms,

    DECODE (rsf.owner_rental_flag,''H'',0, rsf.group_yn,''Y'', DECODE (deduct_yn,''Y'',
    rsf.no_rooms,0)) grp_deduct_rooms,

    DECODE (rsf.owner_rental_flag,''H'',0, rsf.group_yn,''Y'', DECODE (deduct_yn,''N'',
    rsf.no_rooms,0)) grp_non_deduct_rooms,

    rsf.no_persons no_persons,

    rsf.arrival_rooms arrival_rooms,

    rsf.departure_rooms departure_rooms,

    rsf.complimentary_rooms complimentary_rooms,

    rsf.house_use_rooms house_use_rooms,

    rsf.day_use_rooms day_use_rooms,

    rsf.no_show_rooms no_show_rooms,

    rsf.revenue revenue,

    DECODE (rsf.group_yn,''N'', DECODE (rsf.deduct_yn,''Y'', rsf.revenue,0),0) ind_deduct_revenue,

    DECODE (rsf.group_yn,''N'', DECODE (rsf.deduct_yn,''N'', rsf.revenue,0),0) ind_non_deduct_revenue,

    DECODE (rsf.group_yn,''Y'', DECODE (rsf.deduct_yn,''Y'', rsf.revenue,0),0) grp_deduct_revenue,

    DECODE (rsf.group_yn,''Y'', DECODE (rsf.deduct_yn,''N'', rsf.revenue,0),0) grp_non_deduct_revenue,

    rsf.owner_rooms owner_rooms,

    rsf.ff_rooms ff_rooms

    FROM rep_res_stati_hld rsf

    where rsf.considered_date between TO_DATE ((''01''||to_char (sysdate,''MMRRRR'')),''DDMMRRRR'')
    and TO_DATE (TO_CHAR (LAST_DAY (to_char (ADD_MONTHS (SYSDATE, 11),''YYYYMM'')),''YYYYMM''),''DDMMRRRR''),''DDMMRRRR'')

    and rsf.deduct_yn=''Y''

    UNION ALL

    SELECT (CASE WHEN (TO_DATE ((''01''||to_char (sysdate,''MMRRRR'')),''DDMMRRRR'')
    + ns.N - 1) < pms_p.business_date THEN ''A_STAT'' ELSE ''B_FORE'' END) rec_type,

    (TO_DATE ((''01''||to_char (sysdate,''MMRRRR'')),''DDMMRRRR'') + ns.N - 1) considered_date,

    0 no_rooms,

    0 ind_deduct_rooms,

    0 ind_non_deduct_rooms,

    0 grp_deduct_rooms,

    0 grp_non_deduct_rooms,

    0 no_persons,

    0 arrival_rooms,

    0 departure_rooms,

    0 complimentary_rooms,

    0 house_use_rooms,

    0 day_use_rooms,

    CASE WHEN (TO_DATE ((''01''||to_char (sysdate,''MMRRRR'')),''DDMMRRRR'') + ns.N
    - 1) < pms_p.business_date THEN 0 ELSE TO_NUMBER (NULL) END no_show_rooms,

    0 revenue,

    0 count_resv_01

    )

    ```


    '
- fmt: "\n```sql\n 0 count_revenue_01,\n 0 owner_rooms,\n 0 ff_rooms,\n 'N' deduct_yn,\n\
    \ 'N' group_yn\n FROM number_scale ns\n WHERE ns.n <= TO_DATE (TO_CHAR (LAST_DAY\
    \ (to_date (to_char (ADD_MONTHS (SYSDATE, 11),'YYYYMM'),'YYYYMM')),'DDMMRRRR'),'DDMMRRRR')\
    \ - TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') +  1\n)\n group by\
    \ rec_type,\n considered_date ORDER BY rec_type,\n TO_DATE (considered_date,'DD\
    \ / MM / RRRR')\n```\n\n# Creation of Trial Balance Details By Transactions Report\
    \ in Opera PMS\n\nIt is important to tell you that just as we did in HouseKeeping\
    \ to show the status of the rooms from the smartphone, you can develop analytical\
    \ reports based on the Trial Balance to have the income statement online.\n\n\
    This report shows the details of all the transactions posted to the guest and\
    \ the classification of these transactions.\n\nBecause the terms of the Balance\
    \ cannot be directly translated into Spanish without distorting their meaning,\
    \ I will keep the definitions in English in this blog.\n\nThe Trial Balance report\
    \ includes all transactions posted, and then a breakdown of business within each\
    \ of the five Ledgers (Guest Ledger, AR Ledger, Deposit Ledger, Package Ledger,\
    \ and Inter Hotel Ledger). The Trial Balance may be used to assist in ensuring\
    \ your property's accounts are balanced and in good standing.\n\n## Summary of\
    \ others Reports That May Be Used For Balancing\n\n| Report Title | .REP Filename\
    \ | Additional Information |\n| :--- | :--- | :--- |\n| Aging Summary by Types\
    \ | araging | May be run for a specific date. |\n| Detailed Aging Report | aragingdet\
    \ | May be run for a specific date. |\n| AR Ledger | arledger | Continually updating\
    \ |\n| Deposit Activity Report | deposit_activity | May be run for a specific\
    \ date but should be run by Activity Date if used for balancing. |\n| NA Deposit\
    \ Ledger | deposit_ledger | Continually updating. |\n| Financial Payments and\
    \ Revenue Postings | findeptcodes | May be run for a specific date but should\
    \ always be run for NET revenue if used for balancing. |\n| Journal by Cashier\
    \ and Transaction Code | finjrnlbytrans | May be run for a specific date but should\
    \ always be run for NET revenue if used for balancing. |\n| Financial Transactions\
    \ with Generates | finjrnlbytrans2 | May be run for a specific date but should\
    \ always be run for NET revenue if used for balancing. |\n| Package Postings |\
    \ finpkgposting | Captures data for the current business date, must be attached\
    \ to Night Audit Report Group if used for balancing. |\n| Guest Trial Balance\
    \ | gl_trial_balance | May be run for a specific date. |\n| Manager Report | manager_report\
    \ | May be run for a specific date. |\n| Deposits Transferred at C / I | nadeptransci\
    \ | Captures data for the current business date, must be run with the Night Audit\
    \ if used for balancing to trial_balance. |\n| Package Ledger Detail | napkgledger\
    \ | Captures data for the current business date, must be run with the Night Audit\
    \ if used for balancing to trial_balance. |\n| Trial Balance | trial_balance |\
    \ May be run for a specific date. |\n\nThe Trial Balance Detail has the following\
    \ structure:\n\n![](Images/image00464.jpeg)\n\n- **Room**: Room number of the\
    \ reservation.\n- **Guest Name**: Name of the guest.\n- **Arragement Desc**: Name\
    \ of transaction classification.\n- **Trx Code**: Code Transaction.\n- **Trx No**:\
    \ Sequential Transaction number.\n- **Description**: Transaction description.\n\
    - **Old Balance (Opening Balance)**: Total balance of the guest account for the\
    \ date in which the report was ran.\n- **Credits**: Total Amount that has been\
    \ paid against the account by the guest.\n- **Debits**: Total Amount that has\
    \ been charged to the guests account.\n- **Transferred Credits**: Any amounts\
    \ that have been transferred to the guests account and that is considered a credit.\n\
    - **Transferred Debits**: Any amounts charged to the guest account as a result\
    \ of a transfer.\n- **New Balance (Closing Balance)**: Closing balance for the\
    \ account. This column is calculated by the following formula: `Opening Balance\
    \ + Debits + Transfer Debit - Credits - Transfer Credits`.\n\n## The SQL query\
    \ for Oracle:\n\n```sql\nSELECT t.room, t.guest_name, t.arrangement_desc,\nt.trx_code,\
    \ t.trx_no,\nt.description,\nt.old_balance, t.credit, t.debit, t.transfer_credit,\
    \ t.transfer_debit, t.new_balance\nFROM(\n SELECT\n        fs.trx_no,\n      \
    \  ar.arrangement_desc,\n        fs.resv_name_id,\n        fs.name_id,\n     \
    \   fs.resort,\n        rv.room,\n        rv.guest_name,\n        co.trx_code,\n\
    \        co.description,\n        - GL postings from prior to from_date\n    \
    \    DECODE (abs (trunc (to_date (to_char (to_char (pms_p.business_date)))) -\
    \ trunc (fs.trx_date)), 0, -1,\n        NVL (fs.Guest_account_debit,0)) - (NVL\
    \ (fs.Guest_account_credit,0))) old_balance,\n        - GL credits posted on from_date\n\
    \        DECODE (fs.from_res_id,NULL, decode (pms_p.business_date - trunc (fs.trx_date)),\
    \ 0, nvl (fs.Guest_account_credit,0), 0) credit,\n        - GL debits posted on\
    \ from_date\n        DECODE (fs.from_res_id,NULL, decode (pms_p.business_date\
    \ - trunc (fs.trx_date)), 0, nvl (fs.Guest_account_debit,0), 0) debit,\n     \
    \   - GL credits from other reservations posted on from_date\n        DECODE (fs.from_res_id,NULL,0,\
    \ decode (pms_p.business_date - trunc (fs.trx_date)), 0, nvl (fs.Guest_account_credit,0),\
    \ 0)) transfer_credit,\n        - GL transfer debits from other reservations posted\
    \ on from_date\n        DECODE (fs.from_res_id,NULL,0, decode (pms_p.business_date\
    \ - trunc (fs.trx_date)), 0, nvl (fs.Guest_account_debit,0), 0)) transfer_debit,\n\
    \        - GL postings posted on from_date or before\n        DECODE (abs (pms_p.business_date\
    \ - trunc (fs.trx_date)), -1,0,\n        NVL (fs.Guest_account_debit,0) - NVL\
    \ (fs.Guest_account_credit,0)) new_balance\nFROM financial_transactions_view fs\n\
    inner join rep_reservation_all_view rv on (fs.resv_name_id = rv.resv_name_id)\n\
    inner join trx$_codes co on (co.trx_code=fs.trx_code)\ninner join trx$_code_arrangementar\
    \ on (ar.arrangement_id=co.arrange_code)\nwhere fs.resv_name_id IN\n    (- all\
    \ resv_name_ids that had a posting today\nSELECT resv_name_id\nFROM financial_transactions\
    \ ftx\nWHERE ftx.resort = : RESORT\nAND ftx.trx_date = pms_p.business_date\nAND\
    \ ftx.resv_name_id IS NOT Null\nUNION ALL\n- all reservations that were (supposed\
    \ to be) in-house today\nSELECT resv_name_id\nFROM reservation_daily_elements\
    \ rde,\nreservation_element_name rdn\nWHERE rde.resort = : RESORT\nAND rde.reservation_date\
    \ = pms_p.business_date\nAND rdn.resort = rde.resort\nAND rdn.reservation_date\
    \ = rde.reservation_date\nAND rdn.resv_daily_el_seq = rde.resv_daily_el_seq\n\
    UNION ALL\nSELECT resv_name_id\nFROM reservation_name rn\nWHERE rn.resort = :\
    \ RESORT\nAND rn.post_co_flag = 'O'\n)\nAND fs.trx_date <= pms_p.business_date\n\
    AND (fs.Guest_account_credit IS NOT Null OR fs.guest_account_debit IS NOT NULL)\n\
    and fs.resv_name_id=3142559 and rv.room='0206'\n) t\nORDER BY t.room, t.arrangement_desc,\
    \ t.trx_code, t.trx_no\n```\n"
