    # Opera PMS 中的房价策略配置与演示


    本指南配置了定价策略并演示了限制的应用。


    ## 1. 用户资料 (USER PROFILES)


    考虑以下前台和预订资料的权限：


    ### 前台资料

    对于用户必须遵守房价策略限制的资料。这适用于收银员或前台接待人员。


    您不能拥有以下权限：

    - `RESERVATIONS \ OVERRIDE RATECODE`

    - `BLOCKS \ OVERRIDE BLOCK RATE RESTRICTIONS`


    您必须拥有以下权限：

    - `RESERVATION \ RATE CODE CHANGE`


    ### 预订资料

    对于用户可以授权打破价格策略限制的资料。这适用于主管人员。


    您必须拥有以下权限：

    - `RESERVATION \ OVERRIDE RATECODE`

    - `BLOCKS \ OVERRIDE BLOCK RATE RESTRICTIONS`


    ## 2. 系统参数 (SYSTEM PARAMETERS)


    必须在 `System Settings` 屏幕中指定以下参数：


    | 参数 | 值 |

    | :--- | :--- |

    | `RATES \ SET CATEGORY` | `Y` |

    | `RATES \ SET RATE CODE` | `Y` |


    ## 3. 房价策略定义


    为了配置房价策略，进入 `Configuration` 主菜单，将显示 `Configuration` 屏幕。进入 `Rate Management` 菜单，`Rate
    Strategy` 选项，将显示 `Rate Strategy` 屏幕。


    ![](img/image00391.jpeg)


    点击 `New`（新建）按钮。定义入住率小于 10%的直接房价策略为 `OPEN`。


    ![](img/image00392.jpeg)


    同时也定义入住率大于 10%的反向房价策略为 `CLOSED`。


    ![](img/image00393.jpeg)


    `Restriction Dates` 字段中的日期对应于预订的日期。


    ## 4. 入住水平与预测处理器 (OCCUPANCY LEVEL AND FORECAST PROCESSOR)


    房价策略的正确执行根据入住水平决定是否应用价格限制。这种入住水平要求从预订房库存中扣除（Deduct）。


    为了激活库存扣除，确保预测处理器正在运行很重要。


    ![](img/image00394.jpeg)


    要激活它，进入 `Utilities` 主菜单，将显示 `Utilities` 屏幕。在此屏幕上，进入 `Processors` 菜单，`Forecast
    Processor` 子菜单，将显示 `Forecast Processor Status` 屏幕。


    ![](img/image00395.jpeg)


    在 `Forecast Processor Status` 屏幕上，运行进程应显示为 `Running`，否则点击 `Start`（启动）按钮。


    ![](img/image00396.jpeg)


    ## 5. 房价代码配置 (RATE CODE CONFIGURATION)


    我们需要验证房价配置，进入 `Rate Management` 菜单，`Rate Classifications` 菜单选项，`Rate Codes` 选项。选择涉及房价策略的
    `Rate Code` 并点击 `Edit`（编辑）按钮。


    ![](img/image00397.jpeg)


    在 `Rate Header` 表单中，确保 `Room Types` 字段具有我们建立房价策略的房型类型 `ST`，同时验证 `Begin Sell Date`
    和 `End Sell Date` 日期范围符合房价策略的执行日期和控制日期。


    ![](img/image00398.jpeg)


    在 `Rate Detail` 表单中，选择与房价策略考虑的 `Room Types` `ST` 对应的记录，确保 `Start Date` 和 `End
    Date` 日期范围与定义的执行日期和控制日期一致。


