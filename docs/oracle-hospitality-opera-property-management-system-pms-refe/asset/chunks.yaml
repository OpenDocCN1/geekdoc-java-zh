- fmt: "\nIn order to access the Opera data dictionary, you must have access to the\
    \ Oracle database from Oracle SQL Developer or another development environment\
    \ for Oracle.\n\nUse the following SQL statement to extract the Opera data dictionary:\n\
    \n```sql\nselect cc.table_name, tc.column_name, tc.nullable, tc.data_type ||\n\
    case\nwhen tc.data_type = 'NUMBER' and tc.data_precision is not null\nthen '('\
    \ || tc.data_precision || ',' || tc.data_scale || ')'\nwhen tc.data_type like\
    \ '% CHAR%'\nthen '(' || tc.data_length || ')'\nelse null\nend type\n, cc.comments\n\
    from user_col_comments cc\njoin user_tab_columns tc\non (cc.column_name = tc.column_name\
    \ and cc.table_name = tc.table_name)\norder by cc. table_name ASC, tc.column_name\
    \ ASC\n```\n\nFor those who could not have access to the Oracle database of Opera\
    \ I leave the Data Dictionary in Excel format and the description of the fields\
    \ in English and their translation in Spanish.\n\nDue to the fact that Opera has\
    \ more than 4800 tables, this blog will describe the most important tables and\
    \ fields for a maintenance and development process.\n\n[Opera PMS Data Dictionary\
    \ - Oracle](https://docs.google.com/spreadsheets/d/19lfAxMjt29iqhjeux8wn6DuMa9-cgiTC/export?format=xlsx)\n\
    \n# Design and creation of report of Daily Payments from Opera PMS\n\nWe will\
    \ make a report that shows the list of payments made per day, payments from the\
    \ various forms of payment; cash, cards, etc. This type of report allows us to\
    \ view and validate the charges made by the ATMs per transaction day.\n\nThe report\
    \ will show the following columns:\n- Transaction Date\n- Transaction Code\n-\
    \ Description of the Transaction Code\n- Reservation\n- Room Number\n- Guest Name\n\
    - Voucher Number\n- Total Billed in Dollars\n- Currency Code\n- User Cashier\n\
    \n```sql\nSELECT TO_CHAR (fi.TRX_DATE,'DD / MM / RR') TRX_FECHA, --Date of Transaction\n\
    \  fi.TRX_CODE TRX_CODE, -Transaction Code\n  UPPER(trc.DESCRIPTION) TRX_DESCRIPTION,\
    \ - Transaction Code Description\n  fi.RESV_NAME_ID NR_RESERVA, --Reservation\
    \ Number\n  fi.ROOM NR_HAB, --NVL Room\n  Number (n.SNAME||','||n.SFIRST,' ''),\
    \ GUEST--Guest Name\n  fi.fiscal_bill_no NR_DOCUMENTO, - Voucher Number\n  DECODE\
    \ (fi.bill_no,NULL,0, decode (fi.trx_no, fol.bill_payment_trx_no, fol.total_gross,0))\
    \ BILLED_USD, --Total Billed in Dollars\n  fi.CURRENCY CURRENCY, --RPAD Currency\n\
    \  Code (UPPER (au.APP_USER),5) USER --User\nFROM \n  FINANCIAL_TRANSACTIONS fi\n\
    \ INNER  JOIN FOLIO_TAX fol ON (fol.BILL_NO = fi.BILL_NO AND fol.NAME_ID = fi.NAME_ID)\n\
    \ INNER  JOIN  NAME n ON (n.NAME_ID = fi.NAME_ID)\n INNER  JOIN TRX$_CODES trc\
    \ ON (trc.TRX_CODE = fi.TRX_CODE)\n INNER  JOIN APPLICATION$_USER au ON (au.APP_USER_ID\
    \ = fi.INSERT_USER)\nWHERE\n--- TO_CHAR (fol.BUSINESS_DATE, 'DD / MM / RRRR')\
    \ = '11 / 03/2019 '\nfol.BUSINESS_DATE =  : P_BUSDATE\nAND fi.BILL_NO IS  NOT\
    \  NULL\nAND (fi.TRX_CODE BETWEEN  9000  AND  9999)\nAND fi.DISPLAY_YN ='Y'\n\
    AND fi.RECPT_TYPE ! =  'CUX'\nAND fi.PACKAGE_CREDIT IS  NULL\nAND fi.PACKAGE_DEBIT\
    \ IS  NULL\nAND fi.PRICE_PER_UNIT <>  0\nORDER  BY\nTRX_FECHA, NR_DOCUMENTO, TRX_CODE,\
    \ TRX_FECHA;\n```\n\nTo make this report, the tables related to financial transactions,\
    \ customer folio and other associated tables will be used:\n- `FINANCIAL_TRANSACTIONS`:\
    \ This table stores all the transactions related to the cashier service, transactions\
    \ for each reservation (guest book, deposit book, accounts receivable book and\
    \ package book).\n- `FOLIO_TAX`: This table stores a summary of the income information\
    \ by invoice.\n- `NAME`: This table stores the profile information of guests,\
    \ companies, travel agencies, sources and groups.\n- `TRX $ _CODES`: This table\
    \ stores all the transaction codes of the system, these transactions are the concepts\
    \ that are selected at the time of POST.\n- `APPLICATION $ _USER`: This table\
    \ stores all the user information that operates the system.\n\nWe validate the\
    \ SQL statement by executing the query in the \"Oracle SQL Developer\" development\
    \ environment.\n\n![](Images/image00447.jpeg)\n\nWe execute the report design\
    \ program \"Oracle Reports Builder\" and create a new report using the \"Report\
    \ Wizard\".\n\nIn the \"Report Style\" screen we indicate the title of the report\
    \ and select the format \"Group Left\", this format will allow us to create groupings\
    \ in the report.\n\n![](Images/image00448.jpeg)\n\nIn the “Data Source Definition”\
    \ screen of the Report Wizard, the confirmation for the creation of the `P_BUSDATE`\
    \ report parameter will be presented. This parameter will allow us to select from.\n\
    \nTo make this report, the tables related to financial transactions, customer\
    \ folio and other associated tables will be used:\n- `FINANCIAL_TRANSACTIONS`:\
    \ This table stores all the transactions related to the cashier service, transactions\
    \ for each reservation (guest book, deposit book, accounts receivable book and\
    \ package book).\n- `FOLIO_TAX`: This table stores a summary of the income information\
    \ by invoice.\n- `NAME`: This table stores the profile information of guests,\
    \ companies, travel agencies, sources and groups.\n- `TRX $ _CODES`: This table\
    \ stores all the transaction codes of the system, these transactions are the concepts\
    \ that are selected at the time of POST.\n- `APPLICATION $ _USER`: This table\
    \ stores all the user information that operates the system.\n\nWe validate the\
    \ SQL statement by executing the query in the \"Oracle SQL Developer\" development\
    \ environment.\n\n![](Images/image00447.jpeg)\n\nWe execute the report design\
    \ program \"Oracle Reports Builder\" and create a new report using the \"Report\
    \ Wizard\".\n\nIn the \"Report Style\" screen we indicate the title of the report\
    \ and select the format \"Group Left\", this format will allow us to create groupings\
    \ in the report.\n\n![](Images/image00448.jpeg)\n\nIn the “Data Source Definition”\
    \ screen of the Report Wizard, the confirmation for the creation of the `P_BUSDATE`\
    \ report parameter will be presented. This parameter will allow us to select from.\n"
