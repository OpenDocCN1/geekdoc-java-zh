    # Credit Notes through Credit Bill in Opera PMS We will


    make credit notes through CREDIT BILL, enter the Cashiering menu, Cashier Functions
    option The Cashier Functions


    ![](Images/image00377.jpeg)


    form will be displayed


    ![](Images/image00378.jpeg)


    Select the Folio History option the Flio History form will be displayed


    ![](Images/image00379.jpeg)


    ** Consider that only Credit Notes can be issued through CREDIT BILL to vouchers
    that have been issued one day in advance, otherwise Opera disables the Credit
    Bill option button, for example, as of today, March 12, only credit notes are
    allowed to be issued. credit through Credit Bill of vouchers issued until March
    11.


    ** Another consideration to take into account is that the issuance of credit notes
    must correspond to the series category of the payment receipt, that is, if the
    series category is F010, credit notes must be issued with the F010 series. if
    the series category is B011, credit notes must be issued with the B011 series
    in that correlation. If this correlation does not occur, there is a risk that
    the central tax administration will reject the credit note issued.


    ** For this correlation to occur, it is very important that when issuing credit
    notes, the Tax Type field of the Client''s Profile must be changed.


