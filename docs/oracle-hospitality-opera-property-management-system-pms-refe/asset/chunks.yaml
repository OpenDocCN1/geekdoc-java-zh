  trans: "\n```sql\n      T.TAT_DATUM WES_DOCDATE,\n  '00'  AS TIPO_DOC,\n  TRIM(SUBSTR(T.TAT_NAME,1,6))\
    \ AS SERIE_DOC,\n      T.TAT_NAME AS NRO_DOC,\n 0.00  AS CANT_COMPRA,\n 0.00 \
    \ AS COST_UNI_COMPRA,\n 0.00  AS COST_TOT_COMPRA,\n      ROUND(I.WES_MENGE,4)\
    \ AS CANT_VENTA,\n      ROUND(I.WES_ESP,4) AS COST_UNI_VENTA,\n      ROUND(I.WES_MENGE\
    \ * I.WES_ESP,4) AS COST_TOT_VENTA,\n      I.WES_VKP,\n      AU.ATG_STATUS AS\
    \ LFS_STATUS,\n 0  AS LFP_STATUS\n FROM MCDATA.INVWES I,\n      MCDATA.ARTIKEL\
    \ A,\n      MCDATA.VPCKEINH VP,\n      MCDATA.KOSTST K,\n      MCDATA.TEILAUFTRAG\
    \ T,\n      MCDATA.AUFTRAG AU\nWHERE ( I.ART_ID = A.ART_ID )\n AND ( I.KST_ID\
    \ = K.KST_ID )\n AND ( A.VPK_NR = VP.VPK_ID )\n AND ( I.WES_TYP =  21 )\n AND\
    \ ( I.WES_ID1 = T.TAT_ID )\n AND ( T.ATG_ID = AU.ATG_ID )\n AND ( I.ART_ID = vn_art_id\
    \ OR vn_art_id=0 )\n AND ( K.KST_ID = vn_kst_id )\n AND ( (T.TAT_DATUM >= TO_DATE(vs_fec_ini||'00:00:00',\
    \ 'DD/MM/YYYY HH24:MI:SS'))\n AND (T.TAT_DATUM <= TO_DATE(vs_fec_fin||'23:59:59',\
    \ 'DD/MM/YYYY HH24:MI:SS')))\nUNION  ALL\n-- 库存调整\n SELECT K.KST_ID,\n       \
    \   K.KST_ADRESSE,\n          K.KST_NAME,\n          I.ART_ID,\n          A.ART_NUMMER\
    \ AS ART_COD,\n          A.ART_NAME,\n          unidad_code_sunat(A.VPK_NR) VPK_NR,\n\
    \          VP.VPK_NAME,\n          A.ART_INFO,\n          I.WES_TYP,\n '99'  AS\
    \ TIPO_OPE,\n          I.WES_ID1,\n          I.WES_ID2,\n          IV.INV_DATUM\
    \ WES_DOCDATE,\n '00'  AS TIPO_DOC,\n TRIM(SUBSTR(INV_NAME,1,7)) AS SERIE_DOC,\n\
    \          IV.INV_NAME AS NRO_DOC,\n          DECODE(SIGN(I.WES_MENGE),1,ROUND(I.WES_MENGE,4),0.00)\
    \ AS CANT_COMPRA,\n          DECODE(SIGN(WES_MENGE),1,ROUND(I.WES_ESP,4),0.00)\
    \ AS COST_UNI_COMPRA,\n          DECODE(SIGN(ROUND(I.WES_MENGE * I.WES_ESP,4)),1,ROUND(I.WES_MENGE\
    \ * I.WES_ESP,4),0.0) AS COST_TOT_COMPRA,\n          DECODE(SIGN(I.WES_MENGE),-1,ROUND(I.WES_MENGE,4),0.0)\
    \ AS CANT_VENTA,\n          DECODE(SIGN(WES_MENGE),-1,ROUND(I.WES_ESP,4),0.0)\
    \ AS COST_UNI_VENTA,\n          DECODE(SIGN(ROUND(I.WES_MENGE * I.WES_ESP,4)),-1,ROUND(I.WES_MENGE\
    \ * I.WES_ESP,4),0.0) AS COST_TOT_VENTA,\n          I.WES_VKP,\n          IV.INV_STATUS\
    \ AS LFS_STATUS,\n 0  AS LFP_STATUS\n FROM MCDATA.INVWES I,\n          MCDATA.INVENTUR\
    \ IV,\n          MCDATA.ARTIKEL A,\n          MCDATA.VPCKEINH VP,\n          MCDATA.KOSTST\
    \ K\n WHERE I.ART_ID = A.ART_ID )\n AND ( I.KST_ID = K.KST_ID )\n AND ( A.VPK_NR\
    \ = VP.VPK_ID )\n AND ( I.WES_ID1 = IV.INV_ID )\n AND ( I.WES_TYP =  50 )\n AND\
    \ ( IV.INV_TYP IN (1,22) )\n AND ( I.ART_ID = vn_art_id OR vn_art_id=0 )\n AND\
    \ ( K.KST_ID = vn_kst_id )\n AND ((IV.INV_DATUM >= TO_DATE(vs_fec_ini||'00:00:00',\
    \ 'DD/MM/YYYY HH24:MI:SS'))\n AND (IV.INV_DATUM <= TO_DATE(vs_fec_fin||'23:59:59',\
    \ 'DD/MM/YYYY HH24:MI:SS')))\n... (此处省略重复逻辑以保持简洁)\n```\n"
- fmt: "\n```sql\nln_cost_tota := 0.00;\n\nln_art_id := VC_ARTICULO.ART_ID;\n\n--\
    \ Inventario Inicial del Artículo.\n\nSELECT MAX(I.INV_ID) INTO ln_inv_id\nFROM\
    \ MCDATA.INVENTUR I,\n     MCDATA.INVPOSART IA\nWHERE I.INV_ID = IA.INV_ID\nAND\
    \ I.KST_ID = vn_kst_id\nAND IA.ART_ID = ln_art_id\nAND I.INV_DATUM < TO_DATE(vs_fec_ini,\
    \ 'DD/MM/YYYY');\n\nIF ln_inv_id > 0 THEN\n    SELECT IA.INP_IST,IA.INP_ESP into\
    \ ln_cant_tota,ln_cost_uni_tota\n    FROM MCDATA.INVENTUR I, MCDATA.INVPOSART\
    \ IA\n    WHERE I.INV_ID = IA.INV_ID\n    AND I.INV_ID = ln_inv_id\n    AND I.KST_ID\
    \ = vn_kst_id\n    AND IA.ART_ID = ln_art_id\n    AND I.INV_STATUS = 8 -- CERRADO\n\
    \    AND I.INV_TYP <> 22; -- DIFERENTE A AJUSTE DE INVENTARIO\n\n    ln_cant_tota:=NVL(ln_cant_tota,0);\n\
    \    ln_cost_tota:=ln_cant_tota*ln_cost_uni_tota;\n    ln_inv_ist:=ln_cant_tota;\n\
    \    ln_inv_esp:=ln_cost_uni_tota;\n    ln_total:=ln_cost_tota;\n\n    INSERT\
    \ INTO MCDATA.GTT_KARDEX_VALORIZADO\n    (KST_ID,\n     KST_ADRESSE,\n     KST_NAME,\n\
    \     FEC_INI_PER,\n     FEC_FIN_PER,\n     ART_ID,\n     WES_TYP,\n     ART_COD,\n\
    \     ART_NAME,\n     ART_INFO,\n     VPK_NR,\n     VPK_NAME,\n     TIPO_OPE,\n\
    \     LFS_STATUS,\n     LFP_STATUS,\n     WES_ID1,\n     WES_ID2,\n     WES_DOCDATE,\n\
    \     TIPO_DOC,\n     SERIE_DOC,\n     NRO_DOC,\n     CNT_COM,\n     CST_UNI_COM,\n\
    \     CST_TOT_COM,\n     CNT_VTA,\n     CST_UNI_VTA,\n     CST_TOT_VTA,\n    \
    \ CNT_SLD_FIN,\n     CST_UNI_SLD_FIN,\n     CST_TOT_SLD_FIN,\n     ID_GTT_KARDEX,\n\
    \     ID_GTT_KARDEX_VALORIZADO)\n    VALUES\n    (VC_ARTICULO.KST_ID,\n     VC_ARTICULO.KST_ADRESSE,\n\
    \     VC_ARTICULO.KST_NAME,\n     TO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n     TO_DATE(vs_fec_fin,\
    \ 'DD/MM/YYYY'),\n     VC_ARTICULO.ART_ID,\n     0,\n     VC_ARTICULO.ART_COD,\n\
    \     VC_ARTICULO.ART_NAME,\n     VC_ARTICULO.ART_INFO,\n     TRIM(VC_ARTICULO.VPK_NR),\n\
    \     VC_ARTICULO.VPK_NAME,\n     '16',\n     0,\n     0,\n     null,\n     0,\n\
    \     TO_DATE(vs_fec_ini, 'DD/MM/YYYY'),\n     '',\n     '',\n     'INV INICIAL',\n\
    \     NULL,\n     NULL,\n     NULL,\n     NULL,\n     NULL,\n     NULL,\n    \
    \ ln_inv_ist,\n     ln_inv_esp,\n     ln_total,\n     V_ID_GTT_KARDEX,\n     ID_GTT_KARDEX_VALORIZADO_SEQ.next);\n\
    \    COMMIT;\n\n    --Actualizamos Saldo\n    ln_cant_tota := ln_inv_ist;\n  \
    \  ln_cost_tota := ln_cost_tota;\n    ln_cant_tota := ln_cant_tota + ROUND(NVL(VC_ARTICULO.ANT_COMPRA,0),4)\
    \ + ROUND(NVL(VC_ARTICULO.ANT_VENTA,0),4);\n    ln_cant_tota:=NVL(ln_cant_tota,0);\n\
    \    IF VC_ARTICULO.ANT_COMPRA>0 THEN\n        cost_uni_tota := ROUND(VC_ARTICULO.COST_UNI_COMPRA,4);\n\
    \    ELSE\n        IF VC_ARTICULO.ANT_VENTA>0 THEN\n            cost_uni_tota\
    \ := ROUND(VC_ARTICULO.COST_UNI_VENTA,4);\n        ELSE\n            cost_uni_tota\
    \ := CASE WHEN VC_ARTICULO.COST_UNI_VENTA>0 THEN ROUND(VC_ARTICULO.COST_UNI_VENTA,4)\
    \ ELSE ROUND(VC_ARTICULO.COST_UNI_COMPRA,4) END;\n        END IF;\n    END IF;\n\
    \    ln_cost_tota := ln_cost_tota*ln_cant_tota;\n\n    --Tipo Operacion\n    IF\
    \ VC_ARTICULO.WES_TYP = 10 THEN\n        IF VC_ARTICULO.LFP_STATUS = 0 THEN\n\
    \            tipo_ope := '2'; -- COMPRA\n        ELSE\n            tipo_ope :=\
    \ '5'; -- DEVOLUC\n        END IF;\n    ELSE\n        tipo_ope := VC_ARTICULO.TIPO_OPE;\n\
    \    END IF;\n\n    INSERT INTO MCDATA.GTT_KARDEX_VALORIZADO\n    (KST_ID,\n \
    \    KST_ADRESSE,\n     KST_NAME,\n     FEC_INI_PER,\n     FEC_FIN_PER,\n    \
    \ ART_ID,\n     WES_TYP,\n     ART_COD,\n     ART_NAME,\n     ART_INFO,\n    \
    \ VPK_NR,\n     VPK_NAME,\n     TIPO_OPE,\n     LFS_STATUS,\n     LFP_STATUS,\n\
    \     WES_ID1,\n     WES_ID2,\n     WES_DOCDATE,\n     TIPO_DOC,\n     SERIE_DOC,\n\
    \     NRO_DOC,\n     CNT_COM,\n     CST_UNI_COM,\n     CST_TOT_COM,\n     CNT_VTA,\n\
    \     CST_UNI_VTA,\n     CST_TOT_VTA,\n     CNT_SLD_FIN,\n     CST_UNI_SLD_FIN,\n\
    \     CST_TOT_SLD_FIN,\n     ID_GTT_KARDEX,\n     ID_GTT_KARDEX_VALORIZADO)\n\
    \    VALUES\n    (VC_ARTICULO.KST_ID,\n     VC_ARTICULO.KST_ADRESSE,\n     VC_ARTICULO.KST_NAME,\n\
    \     TO_DATE(vs_fec_ini, 'DD/MM/RR'),\n     TO_DATE(vs_fec_fin, 'DD/MM/RR'),\n\
    \     VC_ARTICULO.ART_ID,\n     VC_ARTICULO.WES_TYP,\n     VC_ARTICULO.ART_COD,\n\
    \     VC_ARTICULO.ART_NAME,\n     VC_ARTICULO.ART_INFO,\n     TRIM(VC_ARTICULO.VPK_NR),\n\
    \     VC_ARTICULO.VPK_NAME,\n     tipo_ope,\n     VC_ARTICULO.LFS_STATUS,\n  \
    \   VC_ARTICULO.LFP_STATUS,\n     VC_ARTICULO.WES_ID1,\n     VC_ARTICULO.WES_ID2,\n\
    \     VC_ARTICULO.WES_DOCDATE,\n     VC_ARTICULO.TIPO_DOC,\n     VC_ARTICULO.SERIE_DOC,\n\
    \     VC_ARTICULO.NRO_DOC,\n     ln_cant_tota,\n     ln_cost_uni_tota,\n     ln_cost_tota,\n\
    \     ln_cant_tota,\n     ln_cost_uni_tota,\n     ln_cost_tota,\n     ln_cant_tota,\n\
    \     ln_cost_uni_tota,\n     ln_cost_tota,\n     V_ID_GTT_KARDEX,\n     ID_GTT_KARDEX_VALORIZADO_SEQ.next);\n\
    \    COMMIT;\nEND LOOP;\n\nselect sum(LAST_CNT_SLD_FIN),sum(LAST_CST_TOT_SLD_FIN)\
    \ INTO V_SUM_LAST_CNT_SLD_FIN, V_SUM_LAST_CST_TOT_SLD_FIN from (\n    SELECT ART_ID,\n\
    \           max(LAST_CNT_SLD_FIN) LAST_CNT_SLD_FIN,\n           max(LAST_CST_TOT_SLD_FIN)\
    \ LAST_CST_TOT_SLD_FIN\n    FROM (\n        SELECT ART_ID,\n               LAST_VALUE(CNT_SLD_FIN)\
    \ OVER (PARTITION BY ART_ID ORDER BY ID_GTT_KARDEX_VALORIZADO ROWS BETWEEN UNBOUNDED\
    \ PRECEDING AND UNBOUNDED FOLLOWING) AS LAST_CNT_SLD_FIN,\n               LAST_VALUE(CST_TOT_SLD_FIN)\
    \ OVER (PARTITION BY ART_ID ORDER BY ID_GTT_KARDEX_VALORIZADO ROWS BETWEEN UNBOUNDED\
    \ PRECEDING AND UNBOUNDED FOLLOWING) AS LAST_CST_TOT_SLD_FIN\n        FROM MCDATA.GTT_KARDEX_VALORIZADO\n\
    \        WHERE id_gtt_kardex=V_ID_GTT_KARDEX\n    )\n    group by ART_ID\n);\n\
    \nSELECT COUNT(1) INTO V_QUANTITY FROM MCDATA.GTT_KARDEX_VALORIZADO WHERE ID_GTT_KARDEX=V_ID_GTT_KARDEX;\n\
    \nINSERT INTO MCDATA.GTT_KARDEX(ID_GTT_KARDEX,INSERT_DATE,QUANTITY_RECORDS,STATUS_REG,P_FECHA_INICIO,P_FECHA_FIN,P_ID_ESTABLECIMIENTO,SUM_LAST_CNT_SLD_FIN,SUM_LAST_CST_TOT_SLD_FIN)\n\
    VALUES(V_ID_GTT_KARDEX,CURRENT_TIMESTAMP,V_QUANTITY,1,vs_fec_ini,vs_fec_fin,vn_kst_id,V_SUM_LAST_CNT_SLD_FIN,V_SUM_LAST_CST_TOT_SLD_FIN);\n\
    COMMIT;\n\nSELECT V_ID_GTT_KARDEX INTO P_OUT_ID_GTT_KARDEX FROM DUAL;\n\nEXCEPTION\n\
    \    WHEN OTHERS THEN\n        ln_nError := SQLCODE;\n        ls_cError := SQLERRM(ln_nError);\n\
    \        RAISE_APPLICATION_ERROR(-20001, ls_mensaje || TO_CHAR(ln_nError) || ',\
    \ ' || ls_cError);\nEND;\n```\n"
