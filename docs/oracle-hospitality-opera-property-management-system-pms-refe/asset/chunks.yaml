  trans: "\n\n```sql\nORDER BY room, BEGIN_DATE\n```\n\n### 已预订住房\n\n```sql\nSELECT\
    \ distinct a.share_id, a.room, a.room_category_label, a.company_name, a.sguest_name,\
    \ a.guest_country_desc,\n      a.trunc_arrival, a.trunc_departure, a.currency_code,\
    \ a.share_amount,\n      a.market_desc, a.confirmation_no, a.market_code, a.effective_rate_amount,\
    \ a.fixed_charge\nFROM reservation_general_view to\nWHERE substr (a.ARRIVAL,1,11)=TO_CHAR\
    \ (SYSDATE)\nand (A.RESV_STATUS='RESERVED'OR A.RESV_STATUS='PROSPECT')\nand a.share_amount<>0.00\n\
    ```\n\n### 按公司和市场收入\n```sql\nSELECT distinct a.share_id, a.room, a.room_category_label,\
    \ a.company_name, a.sguest_name, a.guest_country_desc,\n      a.trunc_arrival,\
    \ a.trunc_departure, a.currency_code, a.share_amount,\n      a.market_desc, a.confirmation_no,\
    \ a.market_code, a.effective_rate_amount, a.fixed_charge\nFROM reservation_general_view_hld\
    \ to\nWHERE a.resv_status='CHECKED IN'\nand a.share_amount>0.00\nUNION ALL\nSELECT\
    \ distinct a.share_id, a.room, a.room_category_label, a.company_name, a.sguest_name,\
    \ a.guest_country_desc,\n      a.trunc_arrival, a.trunc_departure, a.currency_code,\
    \ a.share_amount,\n      a.market_desc, a.confirmation_no, a.market_code, a.effective_rate_amount,\
    \ a.fixed_charge\nFROM reservation_general_view_hld to\nWHERE a.resv_status='CHECKED\
    \ IN'\nand substr (a.market_code,1,2)='80' and a.financially_responsible_yn is\
    \ null\n```\n\n### 每日房间数\n```sql\nSELECT a.considered_date, sum (a.no_rooms),\
    \ sum (a.arrival_rooms), sum (a.departure_rooms), sum (a.complimentary_rooms),\n\
    \      sum (a.net_room_revenue)\nFROM rep_res_statistics_forecast to\nWHERE (a.CONSIDERED_DATE\
    \ BETWEEN TO_CHAR (SYSDATE-TO_CHAR (sysdate-1,'DD')) and TO_CHAR (SYSDATE+366))\
    \ and a.ROOM_CATEGORY<>'-1'\nAND ((a.Deduct_yn='N' AND a.market_code='50A') or\
    \ a.deduct_yn='Y')\nGROUP BY a.CONSIDERED_DATE\n```\n\n### 按市场代码每月预测\n```sql\n\
    SELECT\n    CONSIDERED_MONTH,\n    CONSIDERED_YEAR,\n    MARKET_GROUP,\n    MARKET_GROUP_DESC,\n\
    \    SUM (no_rooms) NO_ROOMS,\n    SUM (room_revenue) ROOM_REVENUE,\n    market_code\n\
    FROM(\n    SELECT\n        CONSIDERED_MONTH,\n        CONSIDERED_YEAR,\n     \
    \   CONSIDERED_DATE,\n        MARKET_GROUP,\n        MARKET_GROUP_DESC,\n    \
    \    MARKET_CODE,\n        SUM (no_rooms) NO_ROOMS,\n        SUM (room_revenue)\
    \ ROOM_REVENUE\n    FROM(\n        SELECT\n            to_char (rsf.Considered_date,'MONTH')\
    \ CONSIDERED_MONTH,\n            to_char (rsf.Considered_date,'RRRR') CONSIDERED_YEAR,\n\
    \            mc.parent_market_code MARKET_GROUP,\n            mg.description MARKET_GROUP_DESC,\n\
    \            rsf.market_code MARKET_CODE,\n            rsf.considered_date CONSIDERED_DATE,\n\
    \            decode (rsf.room_category,-1,0, rsf.no_rooms) NO_ROOMS,\n       \
    \     rsf.net_room_revenue ROOM_REVENUE\n        FROM\n            rep_res_statistics_forecast\
    \ rsf, markets mc, market_groups mg\n        WHERE\n            rsf.CONSIDER_DATE\
    \ BETWEEN TO_CHAR (SYSDATE -TO_CHAR (date-1,'DD')) and TO_CHAR (SYSDATE+135)\n\
    \            AND (mc.Parent_market_code = mg.Market_group AND rsf.Market_code\
    \ = mc.Market_code)\n            AND rsf.deduct_yn='Y'\n        GROUP BY\n   \
    \         CONSIDERED_MONTH,\n            CONSIDERED_YEAR,\n            CONSIDERED_DATE,\n\
    \            MARKET_GROUP,\n            MARKET_GROUP_DESC,\n            MARKET_CODE\n\
    \        ORDER BY\n            CONSIDERED_MONTH,\n            CONSIDERED_YEAR,\n\
    \            CONSIDERED_DATE,\n            MARKET_GROUP,\n            MARKET_GROUP_DESC,\n\
    \            MARKET_CODE\n    )\n    GROUP BY\n        CONSIDERED_MONTH, CONSIDERED_YEAR,\
    \ MARKET_GROUP, MARKET_GROUP_DESC, market_code\n    ORDER BY\n        CONSIDERED_MONTH,\
    \ CONSIDERED_YEAR, MARKET_GROUP, market_code\n)\n```\n\n### 每日订量\n```sql\nSELECT\
    \ a.business_date_created as F_Reserva, a.trunc_arrival as Arrival, a.trunc_departure\
    \ as Output, a.nights,\n      a.room_category_label as Room, a.share_amount as\
    \ rate, a.rate_code, a.guarantee_code,\n      a.sfirst_guest_name as names, a.guest_name\
    \ as name, a.company_name, a.travel_agent_name,\n      b.srep_code as Executive,\
    \ a.share_amount\nFROM reservation_general_view a, name_view b\nWHERE a.room_category_label<>'PM'\n\
    and a.resv_status<>'CANCELLED'\nand a.share_amount > 0.00\nand b.name_id (+)=\
    \ decode (a.company_id,null, a.travel_agent_id, a.company_id)\nand a.business_date_created\
    \ =TO_CHAR (business_date)\nORDER BY a.trunc_arrival\n```\n\n### 按销售主管产出\n```sql\n\
    SELECT a.room_revenue, a.share_amount, b.srep_code, a.rate_code,\n      a.sfirst_guest_name\
    \ || '' || a.guest_name,\n      a.trunc_arrival, a.trunc_departure, a.company_name,\
    \ a.rate_code\nFROM reservation_general_view a, name_view b\nWHERE a.room_category_label<>'PM'\n\
    and a.resv_status<>'CANCELLED'\nand a.share_amount > 0.00\n```\n\n### 每房间产出\n\
    ```sql\nSELECT a.room_revenue, a.share_amount, b.srep_code, a.rate_code,\n   \
    \   a.sfirst_guest_name || '' || a.guest_name,\n      a.trunc_arrival, a.trunc_departure,\
    \ a.company_name, a.rate_code\n```\n\n"
