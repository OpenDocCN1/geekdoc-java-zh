  trans: "\n\n为了访问 Opera 数据字典，你必须能够通过 Oracle SQL Developer 或另一个 Oracle 开发环境访问 Oracle\
    \ 数据库。\n\n使用以下 SQL 语句来提取 Opera 数据字典：\n\n```sql\nselect cc.table_name, tc.column_name,\
    \ tc.nullable, tc.data_type ||\ncase\nwhen tc.data_type = 'NUMBER' and tc.data_precision\
    \ is not null\nthen '(' || tc.data_precision || ',' || tc.data_scale || ')'\n\
    when tc.data_type like '% CHAR%'\nthen '(' || tc.data_length || ')'\nelse null\n\
    end type\n, cc.comments\nfrom user_col_comments cc\njoin user_tab_columns tc\n\
    on (cc.column_name = tc.column_name and cc.table_name = tc.table_name)\norder\
    \ by cc. table_name ASC, tc.column_name ASC\n```\n\n对于那些无法访问 Opera Oracle 数据库的用户，我遗留了\
    \ Excel 格式的数据字典，以及字段描述的英语说明及其对应的西班牙语翻译。\n\n由于 Opera 拥有超过 4800 张表，本博客将描述维护和开发过程中最重要的表和字段。\n\
    \n[Opera PMS 数据字典 - Oracle](https://docs.google.com/spreadsheets/d/19lfAxMjt29iqhjeux8wn6DuMa9-cgiTC/export?format=xlsx)\n\
    \n# Opera PMS 每日付款报表的设计与创建\n\n我们将创建一个报告，显示每天的付款列表，以及来自各种支付形式（现金、卡片等）的付款情况。此类报告允许我们查看并验证每个交易日内\
    \ ATM 收取的费用。\n\n报表将显示以下列：\n- 交易日期\n- 交易代码\n- 交易代码描述\n- 预订\n- 房号\n- 宾客姓名\n- 凭证号\n\
    - 美元总计费金额\n- 货币代码\n- 收银员\n\n```sql\nSELECT TO_CHAR (fi.TRX_DATE,'DD / MM / RR')\
    \ TRX_FECHA, --Date of Transaction\n  fi.TRX_CODE TRX_CODE, -Transaction Code\n\
    \  UPPER(trc.DESCRIPTION) TRX_DESCRIPTION, - Transaction Code Description\n  fi.RESV_NAME_ID\
    \ NR_RESERVA, --Reservation Number\n  fi.ROOM NR_HAB, --NVL Room\n  Number (n.SNAME||','||n.SFIRST,'\
    \ ''), GUEST--Guest Name\n  fi.fiscal_bill_no NR_DOCUMENTO, - Voucher Number\n\
    \  DECODE (fi.bill_no,NULL,0, decode (fi.trx_no, fol.bill_payment_trx_no, fol.total_gross,0))\
    \ BILLED_USD, --Total Billed in Dollars\n  fi.CURRENCY CURRENCY, --RPAD Currency\n\
    \  Code (UPPER (au.APP_USER),5) USER --User\nFROM \n  FINANCIAL_TRANSACTIONS fi\n\
    \ INNER  JOIN FOLIO_TAX fol ON (fol.BILL_NO = fi.BILL_NO AND fol.NAME_ID = fi.NAME_ID)\n\
    \ INNER  JOIN  NAME n ON (n.NAME_ID = fi.NAME_ID)\n INNER  JOIN TRX$_CODES trc\
    \ ON (trc.TRX_CODE = fi.TRX_CODE)\n INNER  JOIN APPLICATION$_USER au ON (au.APP_USER_ID\
    \ = fi.INSERT_USER)\nWHERE\n--- TO_CHAR (fol.BUSINESS_DATE, 'DD / MM / RRRR')\
    \ = '11 / 03/2019 '\nfol.BUSINESS_DATE =  : P_BUSDATE\nAND fi.BILL_NO IS  NOT\
    \  NULL\nAND (fi.TRX_CODE BETWEEN  9000  AND  9999)\nAND fi.DISPLAY_YN ='Y'\n\
    AND fi.RECPT_TYPE ! =  'CUX'\nAND fi.PACKAGE_CREDIT IS  NULL\nAND fi.PACKAGE_DEBIT\
    \ IS  NULL\nAND fi.PRICE_PER_UNIT <>  0\nORDER  BY\nTRX_FECHA, NR_DOCUMENTO, TRX_CODE,\
    \ TRX_FECHA;\n```\n\n为了制作此报表，将使用与财务交易、客户账单或其他相关的表：\n- `FINANCIAL_TRANSACTIONS`：此表存储所有与收银服务相关的交易、每个预订的交易（宾客账、定金账、应收账账和套餐账）。\n\
    - `FOLIO_TAX`：此表存储按发票汇总的收入信息。\n- `NAME`：此表存储宾客、公司、旅行社、来源和小组的配置信息。\n- `TRX $ _CODES`：此表存储系统所有的交易代码，这些交易是在过账（POST）时选择的概念。\n\
    - `APPLICATION $ _USER`：此表存储操作系统的所有用户信息。\n\n我们在“Oracle SQL Developer”开发环境中执行查询来验证\
    \ SQL 语句。\n\n![](img/image00447.jpeg)\n\n我们运行报表设计程序“Oracle Reports Builder”，并使用“Report\
    \ Wizard”（报表向导）创建一个新报表。\n\n在“Report Style”（报表样式）屏幕上，我们指定报表标题并选择“Group Left”（左分组）格式，这种格式允许我们在报表中创建分组。\n\
    \n![](img/image00448.jpeg)\n\n在报表向导的“Data Source Definition”（数据源定义）屏幕上，将显示创建 `P_BUSDATE`\
    \ 报表参数的确认。该参数将允许我们从中进行选择。\n\n"
- fmt: "\nForecasting consists of estimating and analyzing future demand for a product\
    \ or service using different variables such as historical data.\n\nOne of the\
    \ main variables on which hotel forecasting is based is the analysis of statistical\
    \ data of the property in previous periods, with this we can predict future income\
    \ and make the appropriate business decisions to correct deviations in order to\
    \ maximize income and minimize costs.\n\nBeing clear about the importance of a\
    \ forecast tool, especially online, in real time and from a smartphone that queries\
    \ data directly from `Opera PMS`, it would be a very useful tool for the efficient\
    \ management of the Property.\n\nIt is important to consider that the online forecast\
    \ tool must include the following data, the descriptions of which are kept from\
    \ the original `Opera` documentation:\n\n- **Date**: Date to which the statistics\
    \ apply.\n- **Total Occupancy**: Total occupied rooms (non-deduct, deduct, individual\
    \ and group).\n- **Arrival Rooms**: Rooms with guests arriving this date. For\
    \ arrivals, component rooms count as 1 and not the number of physical rooms making\
    \ up the component room.\n- **Comp Rooms**: Complementary rooms (rooms attached\
    \ to reservations having a rate code that is flagged Complimentary).\n- **House\
    \ Use**: House use rooms (rooms attached to reservations having a rate code that\
    \ is flagged House Use).\n- **Individual Deduct**: Individual reservations having\
    \ a reservation type that is flagged Deduct from inventory.\n- **Non-Deduct Individual**:\
    \ Individual reservations having a reservation type that is not flagged Deduct\
    \ from inventory.\n- **Deduct Group**: Group reservations having a reservation\
    \ type that is flagged Deduct from inventory.\n- **Non-Deduct Group**: Group reservations\
    \ having a reservation type that is not flagged Deduct from inventory.\n- **Occupancy%**:\
    \ (`(Total Occupied Rooms / Number of Rooms in Property) x 100`).\n- **Room Revenue**:\
    \ Total revenue for this date associated with Lodging transaction codes for deduct,\
    \ non-deduct, individual, and group reservations.\n- **Average Rate**: Total Room\
    \ Revenue / Number of Occupied rooms.\n- **Departure Rooms**: Rooms due out this\
    \ date. For departures, component rooms count as 1 and not the number of physical\
    \ rooms making up the component room.\n- **Day Use Rooms**: Day Use Rooms for\
    \ the date.\n- **No Show Rooms**: No Show Rooms for the date.\n\nFor this purpose,\
    \ the following `SQL Query` is built for `Oracle` that obtains the forecast with\
    \ the income of the current month (`HISTORY`) towards the estimated annual income\
    \ (`FORECAST`).\n\n![](Images/image00463.jpeg)\n\nThis `Query` will be the basis\
    \ to start building the forecast online tool for smartphones.\n\n```sql\nSELECT\
    \ rec_type rec_type,\nDECODE (rec_type,'A_STAT', f_message ('REP_HISTORY','History'),\
    \ f_message ('REP_FORECAST','Forecast')) rec_type_desc,\nTO_CHAR (considered_date,'DD\
    \ / MM / RRRR') considered_date,\nSUM (no_rooms * count_resv_01) no_rooms,\nSUM\
    \ (ind_deduct_rooms * count_resv_01) ind_deduct_rooms,\nSUM (ind_non_deduct_rooms\
    \ * count_resv_01) ind_non_deduct_rooms,\nSUM (grp_deduct_rooms * count_resv_01)\
    \ grp_deduct_rooms,\nSUM (grp_non_deduct_rooms * count_resv_01) grp_non_deduct_rooms,\n\
    SUM (no_persons * count_resv_01) no_persons,\nSUM ( arrival_rooms * count_resv_01)\
    \ arrival_rooms,\nSUM (departure_rooms * count_resv_01) departure_rooms,\nSUM\
    \ (complimentary_rooms * count_resv_01) complimentary_rooms,\nSUM (house_use_rooms\
    \ * count_resv_01) house_use_rooms,\nSUM (day_use_rooms * count_resv_01) day_use_rooms,\n\
    SUM (no_show_rooms * count_resv_01) no_show_rooms,\nSUM (revenue * count_revenue_01)\
    \ revenue,\nSUM (DECODE (group_yn,'N', DECODE (deduct_yn,'Y', revenue,0),0) *\
    \ count_revenue_01) ind_deduct_revenue,\nSUM (DECODE (group_yn,'N', DECODE (deduct_yn,'N',\
    \ revenue,0),0) * count_revenue_01) ind_non_deduct_revenue,\nSUM (DECODE (group_yn,'Y',\
    \ DECODE (deduct_yn,'Y', revenue,0),0) * count_revenue_01) grp_deduct_revenue,\n\
    SUM (DECODE (group_yn,'Y', DECODE (deduct_yn,'N', revenue,0),0) * count_revenue_01)\
    \ grp_non_deduct_revenue,\nSUM (owner_rooms * count_resv_01) owner_rooms,\nSUM\
    \ (ff_rooms * count_resv_01) ff_rooms\nFROM (\nSELECT SUBSTR (rsf.Rec_type,1,6)\
    \ rec_type,\nrsf.considered_date considered_date,\nDECODE (rsf.owner_rental_flag,'H',0,\
    \ rsf.no_rooms) no_rooms,\nDECODE (rsf.owner_rental_flag,'H',0, rsf.group_yn,'N',\
    \ DECODE (deduct_yn,'Y', rsf.no_rooms,0)) ind_deduct_rooms,\nDECODE (rsf.owner_rental_flag,'H',0,\
    \ rsf.group_yn,'N', DECODE (deduct_yn,'N', rsf.no_rooms,0)) ind_non_deduct_rooms,\n\
    DECODE (rsf.owner_rental_flag,'H',0, rsf.group_yn,'Y', DECODE (deduct_yn,'Y',\
    \ rsf.no_rooms,0)) grp_deduct_rooms,\nDECODE (rsf.owner_rental_flag,'H',0, rsf.group_yn,'Y',\
    \ DECODE (deduct_yn,'N', rsf.no_rooms,0)) grp_non_deduct_rooms,\nDECODE (rsf.owner_rental_flag,'H',0,\
    \ rsf.no_persons) no_persons,\nDECODE (rsf.owner_rental_flag,'H',0, rsf.arrival_rooms)\
    \ arrival_rooms,\nDECODE (rsf.owner_rental_flag,'H',0, rsf.departure_rooms) departure_rooms,\n\
    DECODE (rsf.owner_rental_flag,'H',0, rsf.complimentary_rooms) complimentary_rooms,\n\
    DECODE (rsf.owner_rental_flag,'H',0, rsf.house_use_rooms) house_use_rooms,\nDECODE\
    \ (rsf.owner_rental_flag,'H',0, rsf.day_use_rooms) day_use_rooms,\nDECODE (rsf.owner_rental_flag,'H',0,\
    \ rsf.no_show_rooms) no_show_rooms,\nDECODE (rsf.owner_rental_flag,'H',0,\nCASE\
    \ 'RN'\nWHEN 'RN' THEN rsf.net_room_revenue - net room revenue\nWHEN 'RG' THEN\
    \ rsf.net_room_revenue + rsf.room_revenue_tax - net total revenue\nWHEN 'TN' THEN\
    \ rsf.total_revenue - gross room revenue\nWHEN 'TG' THEN rsf.total_revenue + rsf.total_revenue_tax\
    \ - gross total revenue\nELSE rsf.net_room_revenue\nEND) revenue, \n(CASE WHEN\
    \ SUBSTR (rsf.Room_category,1,1) <> '-' THEN 1\nWHEN SUBSTR (rsf.Rec_type,1,6)\
    \ = 'A_STAT' THEN 0\nWHEN NVL ('N','N') = 'AND' THEN 1\nELSE 0 END) count_resv_01,\n\
    (CASE WHEN SUBSTR (rsf.Room_category,1,1) <> '-' THEN 1\nWHEN SUBSTR (rsf.Rec_type,1,6)\
    \ = 'A_STAT' THEN 0\nWHEN NVL ('N','N') = 'AND' THEN 1\nELSE 0 END) count_revenue_01,\n\
    rsf.owner_rooms owner_rooms,\nrsf.ff_rooms ff_rooms,\nrsf.deduct_yn,\nrsf.group_yn\n\
    FROM rep_res_stati_hld rsf\nwhere rsf.considered_date between TO_DATE (('01'||to_char\
    \ (sysdate,'MMRRRR')),'DDMMRRRR') and TO_DATE (TO_CHAR (LAST_DAY (to_char (ADD_MONTHS\
    \ (SYSDATE, 11),'YYYYMM')),'YYYYMM'),'DDMMRRRR'),'DDMMRRRR')\nand rsf.deduct_yn='Y'\n\
    UNION ALL\nSELECT (CASE WHEN (TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR')\
    \ + ns.N - 1) < pms_p.business_date THEN 'A_STAT' ELSE 'B_FORE' END) rec_type,\n\
    (TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') + ns.N - 1) considered_date,\n\
    0 no_rooms,\n0 ind_deduct_rooms,\n0 ind_non_deduct_rooms,\n0 grp_deduct_rooms,\n\
    0 grp_non_deduct_rooms,\n0 no_persons,\n0 arrival_rooms,\n0 departure_rooms,\n\
    0 complimentary_rooms,\n0 house_use_rooms,\n0 day_use_rooms,\nCASE WHEN (TO_DATE\
    \ (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') + ns.N - 1) < pms_p.business_date\
    \ THEN 0 ELSE TO_NUMBER (NULL) END no_show_rooms,\n0 revenue,\n0 count_resv_01\n\
    ```\n"
  raw: "Forecasting consists of estimating and analyzing future demand for a product\
    \ or service using different variables such as historical data.\n\nOne of the\
    \ main variables on which hotel forecasting is based is the analysis of statistical\
    \ data of the property in previous periods, with this we can predict future income\
    \ and make the appropriate business decisions to correct deviations in order to\
    \ maximize income and minimize costs.\n\nBeing clear about the importance of a\
    \ forecast tool, especially online, in real time and from a smartphone that queries\
    \ data directly from Opera PMS, it would be a very useful tool for the efficient\
    \ management of the Property.\n\nIt is important to consider that the online forecast\
    \ tool must include the following data, the descriptions of which are kept from\
    \ the original Opera documentation:\n\nDate. Date to which the statistics apply.\n\
    \nTotal Occupancy. Total occupied rooms (non-deduct, deduct, individual and group).\n\
    \nArrival Rooms. Rooms with guests arriving this date. For arrivals, component\
    \ rooms count as 1 and not the number of physical rooms making up the component\
    \ room.\n\nComp Rooms. Complementary rooms (rooms attached to reservations having\
    \ a rate code that is flagged Complimentary).\n\nHouse Use. House use rooms (rooms\
    \ attached to reservations having a rate code that is flagged House Use).\n\n\
    Individual Deduct. Individual reservations having a reservation type that is flagged\
    \ Deduct from inventory.\n\nNon-Deduct Individual. Individual reservations having\
    \ a reservation type that is not flagged Deduct from inventory.\n\nDeduct Group.\
    \ Group reservations having a reservation type that is flagged Deduct from inventory.\n\
    \nNon-Deduct Group. Group reservations having a reservation type that is not flagged\
    \ Deduct from inventory.\n\nOccupancy%. (Total Occupied Rooms / Number of Rooms\
    \ in Property) x 100).\n\nRoom Revenue. Total revenue for this date associated\
    \ with Lodging transaction codes for deduct, non-deduct, individual, and group\
    \ reservations.\n\nAverage Rate. Total Room Revenue / Number of Occupied rooms.\n\
    \nDeparture Rooms. Rooms due out this date. For departures, component rooms count\
    \ as 1 and not the number of physical rooms making up the component room.\n\n\
    Day Use Rooms. Day Use Rooms for the date.\n\nNo Show Rooms. No Show Rooms for\
    \ the date.\n\nFor this purpose, the following SQL Query is built for Oracle that\
    \ obtains the forecast with the income of the current month (HISTORY) towards\
    \ the estimated annual income (FORECAST).\n\n![](Images/image00463.jpeg)\n\nThis\
    \ Query will be the basis to start building the forecast online tool for smartphones.\n\
    \nSELECT rec_type rec_type,\n\n       DECODE (rec_type,'A_STAT', f_message ('REP_HISTORY','History'),\
    \ f_message ('REP_FORECAST','Forecast')) rec_type_desc,\n\n       TO_CHAR (considered_date,'DD\
    \ / MM / RRRR') considered_date,\n\nSUM (no_rooms * count_resv_01) no_rooms,\n\
    \nSUM (ind_deduct_rooms * count_resv_01) ind_deduct_rooms,\n\nSUM (ind_non_deduct_rooms\
    \ * count_resv_01) ind_non_deduct_rooms,\n\nSUM (grp_deduct_rooms * count_resv_01)\
    \ grp_deduct_rooms,\n\nSUM (grp_non_deduct_rooms * count_resv_01) grp_non_deduct_rooms,\n\
    \nSUM (no_persons * count_resv_01) no_persons,\n\nSUM ( arrival_rooms * count_resv_01)\
    \ arrival_rooms,\n\nSUM (departure_rooms * count_resv_01) departure_rooms,\n\n\
    SUM (complimentary_rooms * count_resv_01) complimentary_rooms,\n\nSUM (house_use_rooms\
    \ * count_resv_01) house_use_rooms,\n\nSUM (day_use_rooms * count_resv_01) day_use_rooms,\n\
    \nSUM (no_show_rooms * count_resv_01) no_show_rooms,\n\nSUM (revenue * count_revenue_01)\
    \ revenue,\n\n       SUM (DECODE (group_yn,'N', DECODE (deduct_yn,'Y', revenue,0),0)\
    \ * count_revenue_01) ind_deduct_revenue,\n\n       SU M (DECODE (group_yn,'N',\
    \ DECODE (deduct_yn,'N', revenue,0),0) * count_revenue_01) ind_non_deduct_revenue,\n\
    \n       SUM (DECODE (group_yn,'Y', DECODE (deduct_yn,'Y', revenue,0),0) * count_revenue_01)\
    \ grp_deduct_revenue,\n\n       SUM (DECODE (group_yn,'Y', DECODE (deduct_yn,'N',\
    \ revenue,0),0) * count_revenue_01) grp_non_deduct_revenue,\n\nSUM (owner_rooms\
    \ * count_resv_01) owner_rooms,\n\nSUM ( ff_rooms * count_resv_01) ff_rooms\n\n\
    \ FROM (\n\n SELECT SUBSTR (rsf.Rec_type,1,6) rec_type,\n\n               rsf.considered_date\
    \ considered_date,\n\n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0,\
    \ rsf.no_rooms) no_rooms,\n\n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0,\
    \ DECODE (rsf.group_yn,'N', DECODE (deduct_yn,'Y', rsf.no_rooms,0),0)) ind_deduct_rooms,\n\
    \n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0, DECODE (rsf.group_yn,'N',\
    \ DECODE (deduct_yn,'N', rsf.no_rooms,0),0)) ind_non_deduct_rooms,\n\n              \
    \ DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0, DECODE (rsf.group_yn ,'Y', DECODE\
    \ (deduct_yn,'Y', rsf.No_rooms,0),0)) grp_deduct_rooms,\n\n               DECODE\
    \ (nvl (rsf.Owner_rental_flag,'H'),'O',0, DECODE (rsf.Group_yn,'Y', DECODE (deduct_yn,'N',\
    \ rsf.No_rooms,0),0)) grp_non_deduct_rooms,\n\n               DECODE (nvl (rsf.Owner_rental_flag,'H'),'O',0,\
    \ rsf.No_persons) no_persons,\n\n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0,\
    \ rsf.arrival_rooms) arrival_rooms,\n\n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0,\
    \ rsf.departure_rooms) departure_rooms,\n\n               DECODE (nvl (rsf.owner_rental_f\
    \ lag,'H'),'O',0, rsf.complimentary_rooms) complimentary_rooms,\n\n              \
    \ DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0, rsf.house_use_rooms) house_use_rooms,\n\
    \n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0, rsf.day_use_rooms)\
    \ day_use_rooms,\n\n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0,\
    \ rsf.no_show_rooms) no_show_rooms,\n\n               DECODE (nvl (rsf.owner_rental_flag,'H'),'O',0,\n\
    \n CASE  'RN'\n\n WHEN  'RN'  THEN rsf.net_room_revenue - net room revenue\n\n\
    \ WHEN  'RG'  THEN rsf.net_room_revenue + rsf.room_revenue_tax - net total revenue\n\
    \n WHEN  'TN'  THEN rsf.total_revenue - gross room revenue\n\n WHEN  'TG'  THEN\
    \ rsf.total_revenue + rsf.total_revenue_tax - gross total revenue\n\n ELSE rsf.net_room_revenue\n\
    \n END\n\n               ) revenue, \n\n               (CASE  WHEN SUBSTR (rsf.Room_category,1,1)\
    \ <>  '-'  THEN  1  - this is not a PM resv, count it\n\n WHEN SUBSTR (rsf.Rec_type,1,6)\
    \ =  'A_STAT'  THEN  0 - for statistics we never count PM reservations (rooms)\n\
    \n WHEN NVL ('N','N') =  'AND'  THEN  1 - for forecast look at parameter whether\
    \ to count PM rooms\n\n ELSE  0\n\n END ) count_resv_01,\n\n               (CASE\
    \  WHEN SUBSTR (rsf.Room_category,1,1) <>  '-'  THEN  1  - this is not a PM resv,\
    \ count the revenue\n\n WHEN SUBSTR (rsf.Rec_type,1,6) =  'A_STAT'  THEN  1 -\
    \ for statistics we count all revenue, even from PM resv\n\n WHEN NVL ('N','N')\
    \ =  'AND'  THEN  1 - for forecast look at parameter whether to count PM rooms\n\
    \n ELSE  0\n\n END ) count_revenue_01,\n\n               rsf.owner_rooms owner_rooms,\n\
    \n               rsf.ff_rooms ff_rooms,\n\n               rsf.deduct_yn,\n\n              \
    \ rsf.group_yn \n\n FROM rep_res_stati_forecast_hld rsf\n\n where rsf.considered_date\
    \ between TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR') and TO_DATE\
    \ (TO_CHAR (LAST_DAY (to_date (to_char (ADD_MONTHS (SYSDATE, 11),'YYYYMM'),'YYYYMM')),'DDMMRRRR'),'DDMMRRRR')\n\
    \n and rsf.deduct_yn='Y'\n\n - make sure that we have at least one record per\
    \ day\n\n UNION  ALL\n\n SELECT (CASE  WHEN (TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR')\
    \ + ns.N -  1) < pms_p.business_date THEN\n\n 'A_STAT'\n\n ELSE  'B_FORE'\n\n\
    \ END) rec_type,\n\n               (TO_DATE (('01'||to_char (sysdate,'MMRRRR')),'DDMMRRRR')\
    \ + ns.N -  1) considered_date,\n\n 0 no_rooms,\n\n 0 ind_deduct_rooms,\n\n 0\
    \ ind_non_deduct_rooms,\n\n 0 grp_deduct_rooms,\n\n 0 grp_non_deduct_rooms,\n\n\
    \ 0 no_persons,\n\n 0 arrival_rooms,\n\n 0 departure_rooms,\n\n 0 complimentary_rooms,\n\
    \n 0 house_use_rooms,\n\n 0 day_use_rooms,\n\n CASE  WHEN (TO_DATE (('01'||to_char\
    \ (sysdate,'MMRRRR')),'DDMMRRRR') + ns.N -  1) < pms_p.business_date THEN\n\n\
    \ 0\n\n ELSE TO_NUMBER (NULL)\n\n END no_show_rooms, - for the forecasting section\
    \ the No Show rooms should be NULL since we cannot predict how many rooms will\
    \ be no-show\n\n 0 revenue,\n\n 0 count_resv_01,"
