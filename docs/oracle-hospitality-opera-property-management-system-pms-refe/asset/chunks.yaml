    # Rate Strategy Configuration and demo in Opera PMS


    This guide configures pricing strategies and demonstrates the application of their
    restrictions.


    ## 1. USER PROFILES


    Consider the following permissions for the reception and reservation profiles:


    ### Reception Profile

    Permissions for profiles whose users must respect the restrictions of the pricing
    strategies. This is applicable for cashier or receptionist users.


    You must not have the following permissions:

    - `RESERVATIONS \ OVERRIDE RATECODE`

    - `BLOCKS \ OVERRIDE BLOCK RATE RESTRICTIONS`


    You must have the following permissions:

    - `RESERVATION \ RATE CODE CHANGE`


    ### Profile Reservations

    Permissions for the profiles whose users can authorize the breaking of price strategy
    restrictions. This is applicable for supervisory users, senior tellers, or senior
    reservation staff.


    You must have the following permissions:

    - `RESERVATION \ OVERRIDE RATECODE`

    - `BLOCKS \ OVERRIDE BLOCK RATE RESTRICTIONS`

    - `RESERVATION \ RATE CODE CHANGE`


    ## 2. SYSTEM PARAMETERS


    You must indicate the following parameters in the `Application Settings` screen
    with the values "Y".


    | Parameter | Value |

    | :--- | :--- |

    | `RATES \ SET RATE CATEGORY` | `Y` |

    | `RATES \ SET RATE CODE` | `Y` |


    ## 3. PRICE STRATEGY DEFINITION


    To configure the pricing strategies, enter the `Configuration` main menu, the
    `Configuration` screen will be displayed. enter the `Rate Management` menu, `Rate
    Strategy` option, the `Rate Strategy` screen will be displayed.


    Images/image00391.jpeg)


    Click on the `New` button. Define the direct pricing strategy (`<10%` occupancy)
    `OPEN`.


    ![](Images/image00392.jpeg)


    Also define the reverse pricing strategy (`>10%` occupancy) `CLOSED`.


    ![](Images/image00393.jpeg)


    The dates in the `Restriction Dates` field correspond to the `Arrival` dates of
    the reservation in which pricing strategies are applied. The dates in the `Control
    Dates` field correspond to the reservation is registered.


    ## 4. OCCUPANCY LEVEL AND FORECAST PROCESSOR


    The proper execution of the pricing strategy considers the level of occupancy
    to apply or not the price restrictions. This level of occupancy requires that
    the reserved rooms be deducted (`Deduct`) from the room inventory.


    To activate room inventory deductions it is important that the forecast processor
    is running.


    ![](Images/image00394.jpeg)


    To activate it, enter the main menu `Utilities`, the `Utilities` screen will be
    displayed. On this screen, enter the `Processors` menu, `Forecast Processor` submenu,
    the `Forecast Processor Status` screen will be displayed.


    ![](Images/image00395.jpeg)


    On the `Forecast Processor Status` screen, the running process should be shown
    `Running`, otherwise click on the `Start` button.


    ![](Images/image00396.jpeg)


    ## 5. RATE CODE CONFIGURATION


    We must verify the `Rate Code` configuration, enter the `Rate Management` menu,
    `Rate Classifications` menu option, `Rate Codes` option. Select the `Rate Code`
    involved in the `Rate Strategy` and click on the `Edit` button.


    ![](Images/image00397.jpeg)


    In the form `Rate Header` make sure that the field `Room Types` has the type of
    room `ST` to which we are establishing the pricing strategy, also verify that
    the date range `Begin Sell Date` and `End Sell Date` is a Date range according
    to the execution dates and control dates of the pricing strategy.


    ![](Images/image00398.jpeg)


    In the `Rate Detail` form, select the record corresponding to the `Room Types`
    `ST` considered in the pricing strategy, make sure that the `Start Date` and `End
    Date` date range is in accordance with the execution dates and the control dates
    defined in the pricing strategies.


    ![](Images/image00399.jpeg)


    We leave the records of the `Negotiated` form blank.


    ![](Images/image00400.jpeg) ![](image00401.jpeg)


    We leave the fields of the `More` form blank.


    ![](Images/image00402.jpeg)

