    \ rv.room,\n\n                  rv.guest_name,\n\n                  co.trx_code,\n\
    \n                  co.description,\n\n - all GL postings from days prior to p_from_date\n\
    \n                  DECODE (abs (trunc (to_date (to_char (to_date (to_char (pms_p.business_date)))))\
    \ - trunc (fs.trx_date)),\n\n 0,0,\n\n -1,0,\n\n                          (NVL\
    \ (fs.Guest_account_debit,0))- (NVL (fs.Guest_account_credit,0))) old_balance,\n\
    \n - all GL credits posted on p_from_date\n\n                  DECODE (fs.from_resv_id,NULL,\
