  Logging: Temp \" + temperature + \", Humidity \" + humidity + \", Pressure \" +\
  \ pressure);\n    }\n}\n\nclass AlertSystem implements Observer {\n    public void\
  \ update(float temperature, float humidity, float pressure) {\n        if (temperature\
