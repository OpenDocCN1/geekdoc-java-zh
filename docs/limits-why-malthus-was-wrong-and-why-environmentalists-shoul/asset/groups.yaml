    这种理念并非为了在时间上尽可能延长生命，也不是为了在表现上尽可能完美，而是为了在设定的范围内使其变得有用且快乐。55 这种在死亡划定的界限内行动的自由，与我们现代的自由理想——即动员所有力量征服自然并获得永生的权利——是不同的，后者实际上是非人性的。


    在《文明与不顺》中，弗洛伊德认为我们既有生命冲动，也有死亡冲动。56 饥饿、性或爱是生命本能。但我们也对婴儿阶段有一种原始的渴望，在那个阶段我们尚未意识到与环境的分离。这种死亡本能，即对自我消亡的渴望，弗洛伊德认为它被转化为一种破坏他人的攻击本能。文明限制了这种对无限制的渴望，但我们因必须限制自己的本能行为而遭受痛苦。弗洛伊德受马尔图斯的影响，57
    得出结论：我们为了控制自己而建立并内化的界限，与释放这些本能所造成的破坏一样，都是导致痛苦的重要根源。对于弗洛伊德来说，对本能的压抑滋养了我们的不满。但希腊人让我们以不同的方式看待欲望与死亡、本能与界限之间的关系，这种方式实际上预示了精神分析的演变。


    希腊人也看到了我们过度能量的潜在破坏性。与马尔图斯、弗洛伊德和现代人不同，希腊人并不认为自我限制是痛苦。他们将限制视为常态（并将痛苦视为生活的一部分）。显而易见，我们必须掌握并雕琢我们的本能；这是文明的代价。我们现代人的问题不在于我们压抑了死亡冲动，而在于由于拒绝死亡，我们只能通过暴力对死亡做出反应；我们试图通过屈从自然、将死亡转移给他人来克服它。希腊人通过接受死亡和接受他们的暴力本能，试图去掌控它们。


    事实证明，这与弗洛伊德的精神分析项目相吻合。精神分析承认我们与本能的斗争是无法解决的。我们无法成为摆脱所有痛苦的圣人，但我们可以更好地理解自己————接受我们的欲望以及压抑它们的结果——并有意识地选择我们的界限，在无恐惧的情况下释放幻想和欲望。文明有一种内在的破坏冲动，但与马尔图斯及许多人所想的不同，它是可以被控制的。只要我们能够建立机制来反思自己的需求并审慎地管理那些过度的需求，我们就能减少痛苦而非毁灭。在个人层面，这是精神分析的任务；在集体层面，卡斯托里亚迪认为，这是民主的角色。精神分析帮助我们与欲望和死亡和解以克服恐惧；活着，而不是瘫痪或变得暴力。对于希腊人来说，重点在于与破坏性欲望分离，释放欲望并雕琢欲望。


    回到我最喜欢的寓言（以防我还没有说服你们去看这部电影），1900号留在船上是因为他看到在那个无限制的城市里他可以在界限内更好地表达自己的欲望吗？还是他渴望离开去城市，但留在了充满恐惧或罪恶感的船上？他是对自己进行了灵魂拷问并选择了自己的界限，还是被他的过去所限制？这种作为向内心探索的个人自由观，与罗宾逊·克鲁索的自由完全是两个世界——后者通过疯狂的行为来填补真空，而这些活动既是破坏性的，又是毫无且自我压迫的。


    ## 重新获得界限文化


    西方社会反映并建立了许多重要的界限，尤其是自两次世界大战那不可思议的自我毁灭性以来。我们的法律和界限史与桥梁、大坝、航天器和计算机一样，也是西方进步的历史。二战后，西方国家曾一度试图通过看似不可思议的方式对富人征税，来限制不平等和私人财富的积累，并对工作时间和环境损害施加了限制。我们限制了核武器的扩散和新武器的研究；我们限制了汽车行驶的速度、我们在何地以及何时可以抽烟、我们如何污染食物或水资源，以及我们相互之间可以做哪些而不受惩罚的事。


    然而，20世纪80年代以来的复仇倾向是去监管，即消除资金流动和积累的限制，或消除环境和社会保护的限制。全球变暖带来了无界限的自我毁灭。但权势者及其许多追随者对傲慢清算的反应仍然是否认，并加倍努力消除界限的限制——从在自然保护区采矿，到挖掘额外的脏油石油或煤炭，再到周日工作和交易——这一切都是为了追求无限扩张；在寻找意义中寻找无意义。


    我们现代人比以往任何时候都需要的一种界限文化。与此同时，我们对界限的敌意可能比以往任何时候都更强。从克服你界限的成功学书籍，到“无限制”的健身计划，再到告诉我们成就无上限的歌曲和广告，《无限》（Limitless）这部由布莱德利·库珀主演的2011年惊悚片提供了一个案例。库珀扮演一个遭遇瓶颈并被女友抛弃的失败作家。这时一种新型益智药物拯救了局面。在几小时内，库珀的角色完成了他的小说，并获得了巨大的成功，这引发了更多的成功。然而，这种药物的问题在于他需要越来越多的药物来跟上节奏。没有它，他就会崩溃死亡。


    我来自比这部电影观众更老的一代，当我观看电影时，我在等待某种报应或救赎之路。但库珀并没有死掉或放弃药物，而是确保了自己的无限供应，学会了应对副作用，赢回了女友，并升为美国参议员和总统候选人。傲慢和不道德不仅没有受到惩罚，反而被歌颂了。成瘾者英雄踏着尸体获取药物，并通过成为国家最有权的人来欺骗命运。如果说埃里西冬的神话是一个界限文化的理想神话，那么这个关于无限之王的现代故事则揭示了一个痴迷于不惜代价克服界限的文明病态。这就是新一代统治者的同样病态：他们为缺乏节制感到自豪，不计代价开采煤炭和石油，并准备消除亚马逊最后的土住民。


    当然，希腊人远非完美，他们的历史也并非和平或理想。我们无法回到希腊，也不应该这样做。我们无法复制在他们那个特定地点和时代产生界限文化的条件。“我们必须走比希腊人和现代人更进一步，”以在当代条件下建立一种真正的自我限制民主。59
    我们可以为我们成功建立的他们未能建立的界限感到自豪。但今天的进步，比以往任何时候都可能意味着停止——而不是随着增长而前进。正如沃尔特·本雅明在二战爆发不久所写的，现在是时候“拉下紧急刹车”了。60


    迹头并不乐观。但坚持下去别无选择。


