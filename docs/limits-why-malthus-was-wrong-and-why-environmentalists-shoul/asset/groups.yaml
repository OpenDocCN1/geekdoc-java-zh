    那些限制自己的人，将免于落后并被那些毫无界限的人所吞噬或欺凌。界限的设定在某种程度上是一个全球性集体行动的问题：我们能否建立更高层次的国际机构来控制（例如碳排放、侵略或竞争），并让国家的低层政治设定它们自己的界限？


    鉴于目前联合国等机构的侵蚀、全球应对气候变化行动的匮乏，或者像世界贸易组织等国际机构倾向于关注如何为成员开放边境，而非如何协调实践，该问题的答案似乎并非如此。另一方面，自我限制和对过度扩张诱惑的否定在个体政治中可能是有意义的，即使在他们看来无限制的竞争对于他们的生存是必要的。保罗·维里利奥（Paul
    Virilio）提供了一个有趣的历史案例，即古希斯巴塔人，他们完善了自己的力量，但拒绝为了那些可能引发并导致自身毁灭的胜利而去战争。^23 斯巴塔人，普普鲁塔克（Plutarch）认为，“可能会将他们腐败的起点定在征服雅典，随后金银便涌入了他们之中。”^24


    ## 被剥夺者，或用科幻小说思考界限


    我发现思考界限、其建立及其越界问题的最佳方式，是通过厄苏拉·勒 Guin（Ursula Le Guin）的科幻小说《被放逐者》（The Dispossessed），25，我将用它来说明此处提到的某些问题。


    书的主角谢维（Shevek）是一位追求时间统一理论的物理学家。他的行星安拉瑞斯（Anrarres）在几代以前被逃离资本主义乌拉斯（Urras）的无政府主义者殖民，谢维是第一个跨越行星边界进行折返旅行的人。安拉瑞斯是一个界限的社会。这个行星狭小、干燥且荒芜，但那里的革命者找到了一个自由的殖民地。他们建立的文明是平等狩猎采集社会的规模化、技术更先进的版本，这种社会是勒
    Guin的女儿——伯克利第一位人类学教授阿尔弗雷德·克罗伯（Alfred Kroeber）——在成长过程中所熟悉的。安拉雷提人通过分享他们拥有的极少数资源，在我们看来看似是匮乏的环境中富足地生活。26
    不允许有人因饥饿死去而另一个人有足够的食物吃。殖民地的创始人拥有一种分享、自我限制和民主自我组织的伦理。这种伦理通过革命中半僧侣女性领袖的教导具人格化，通过教育和仪式代代相传。年轻的安拉雷提人学会了在没有警察的情况下产生欲望并管理自己。像斯巴塔人一样，他们避免与邻居发生冲突——不是通过建立一支强大的军队，而是通过拒绝拥有军队并每年向乌拉斯让出很大一部分财富来换取和平。如果乌拉斯人想要矿产，他们可以得到；安拉雷提人没有矿产也能过上简朴的生活。


    随着时间的推移，安拉瑞斯的共同规范和界限已固化为教条。没有警察的自我治理其丑陋的一面是，安拉雷提人互相监视，排斥任何被指控自私的人并限制他们的思想。创始人的伦理正在失去其原始意义，其执行也变成了一个影子官僚机构。就像斯巴塔人和许多将魔鬼关在瓶里的资本社会一样，并不是因为他们想住在界限之内，而是因为精英阶层担心扩张会扰乱内部阶级，安拉雷提人现在面临成为“没有历史的民族”的风险27——一个社会上没有太大变化的地方。


    谢维相信他革命祖先的伦理，但他作为科学家对真理的追求使他挑战那些对他已失去意义的权威和界限。在他看来，界限是用来被质疑的——那正是他祖先反抗的精神。尽管受到同胞的威胁，谢维仍坚持跨越行星的终极物理界限，前往乌拉斯寻找他的理论。他发现了一个像我们现在的资本主义社会一样物质丰富但社会极不平等且充斥穷人的社会。他的到来引发了一场新的反抗。回到安拉瑞斯后，他的旅行面临着腐蚀这颗行星的风险。


