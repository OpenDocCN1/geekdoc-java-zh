    each other and the environments with which we interact,11 This insight I develop
    here. From Berkeley’s geographers and political ecologists, too, I learned about
    the violence perpetuated in the name of limits and the power relations hidden
    behind seemingly innocent claims about nature and its limits.12


    In hindsight, ever since my work has been an effort to synthesize ecological economics
    and political ecology to develop a more nuanced approach to limits. I found what
    I was looking for in the work of a fellow Greek, Cornelius Castoriadis—beside
    reading of my mother’s that I rediscovered as an adult. Castoriadis distinguishes
    between heteronomy—limits that we attribute to God or nature and that restrict
    our freedom—and autonomy, limits that we consciously set for ourselves. That distinction
    is the kernel of this book.


    The debate about limits has political implications. The green idea that there
    should be limits to growth seems to choke on the progressive ideal of universal
    betterment. While many lean toward denial of or indifference to global warming,
    others place their bets on limitless technology and growth, the forces that have
    brought us where we are today. In a society of limits, limiting fossil fuels and
    the comforts they sustain seems impossible. My intention here is to open an intellectual
    and political space for rethinking limits.


    There is another, more personal element to my passion for the question of limits.
    I grew up in Athens after the fall of a dictatorship and the collapse of harsh
    prohibitions. My parents made a point of not importing strict rules at home. My
    first experience of school was an antauthoritarian kindergarten self-organized
    by mothers and fathers. Growing up, I was never told what to come home, but I
    did come back in time. I wasn''t told to drink, and I drank, rarely too much.
    My moderation became a matter of family and personal pride. The reader might find
    me guilty of the intellectual’s inclination to universalize a personal touch and
    turn it into a social principle. But things are not so simple. My moderation,
    like 1900’s ship, is my home and my prison. There are social limits I have bowed
    to unaware, and limits I have unwillingly put upon my shoulders as I internalized
    the expectations of my parents and my own idea of who I was supposed to be. As
    a responsible man in the middle of my life, I feel some of my self-limitations
    stifling. I want to consciously choose which limits to keep because they liberate
    me, decide which limits are part of our life in common and that I must accept,
    and determine which limits I or others have imposed on myself unjustly and from
    which I want to be free. My exploration of the notion of limits is part and parcel
    of my quest to understand my own limits.


    I dedicate this book to my father for teaching me, discreetly, how to enjoy life
    with and without limits. To the memory of my mother, Maria: her sudden death drove
    the pain of the ultimate limit. To my wife, Amalia, and my sister, Iris, for their
    love without limits. And as my references to limits reach their natural limit,
    to my mentors, friends, and colleagues: without them I would never have come up
    with the thoughts shared in this book.


