    并不是环保主义者没有从后果、自由或正义的角度为我们的限制主张提供辩护。但我们经常将自我限制与外部限制混淆一谈——可以说可以说，戈德曼（Goldman）和浪漫主义者就像马尔萨斯（某种关系）。我们经常声称，限制是由大自然决定的，无论我们是否愿意，都必须适应它们（然后我们补充说，幸运的是，在限制内生活并不糟糕；它是解放性的，对他人的伤害更小，等等）。这是一种为自主限制提供辩护的异律（heteronomous）方式。正如卡斯托里迪斯（Castoriadis）所强调的：“生态不是‘热爱自然’：它是人类对于他们偶然存在且现在正在破坏的星球而言，对自我限制的需要（这是事实）。”^29”


