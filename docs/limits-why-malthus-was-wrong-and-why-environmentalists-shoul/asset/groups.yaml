    is an old, latent wisdom about the value of limits and a yearning for moderation
    and simplicity that can be found in many spiritual and religious teachings, one
    potentially appealing to progressives and conservatives alike.35 Can environmentalists
    be the bearers of an aspirational vision of radical simplicity, rather than prophets
    or managers of the end times?


    Second, there is risk in framing climate change or other planetary crises as “environmental
    problems” that threaten a collective “us.” The idea that we are all in the same
    boat disgu the fact that there are different degrees of responsibility, and radically
    different ideas about what we should and not do. As in the case of war or terrorism,
    the construction of a supposed “us” threatened by an external enemy has time and
    again used by those in power to suspend debate—democracy—in the name of urgency
    or a presumed common interest. Environmental crises can be “de-politicizing,”
    to use some scholarly jargon here.36 The idea of limits as an external threat
    to “us” and our way of living can depoliticize by disguising the fact that we
    are not all in it equally. Instead, starting a conversation about what we want
    to limit and what we don’t—the essence of self-limitation—is what real democracy
    about; that is, debate over different visions of the kind of world we want to
    live in. Ecological considerations and consequences are important motivations
    for this conversation, but ultimately the question is about what world we want
    to construct and for whom, how not to conform with a predefined reality dictated
    by nature.


    Third, there is an inherent political danger in invoking external limits: the
    idea of limited, shrinking space easily morphs into an argument for keeping others
    out or expanding their territory. When Hitler called Malthus’s Essay, he didn’t
    think of control over how to expand and secure Lebensraum (living space) for the
    Aryan race.37 As the Marxist political economist David Harvey wrote in his critical
    response to Limits to Growth, if there is scarcity then it is not enough for everyone.38
    And if there is not enough for everyone, then someone must be in excess. This
    someone cannot be “me or you”; it will be “the Other,” the foreigner, the immigrant,
    or the poor person for whom there is no room in “our lifeboat” (the terrible metaphor
