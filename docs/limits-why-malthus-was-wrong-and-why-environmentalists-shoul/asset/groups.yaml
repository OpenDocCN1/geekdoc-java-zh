    Malthus’s mentor at Cambridge, wrote in 1790, eight years before the publication
    of Malthus’s Essay, that “the decay of population is the greatest evil that state
    can suffer and the improvement of it the objective which ought to . . . be aimed
    in preference to every other political purpose whatever.”⁴42


    Early capitalism needed to grow its workforce, and it required a Protestant ethic
    of hard work; Malthus provided a narrative that fused the supposed wishes of God
    with the wishes of factory owners. And he defended the idea that the best thing
    to do about poverty was nothing,⁴³ even while maintaining that a Christian cared
    about the poor. The masses of people in the parishes were not there because they
    had been expelled from enclosed land, but because they had too many children.


    Why Malthus was wrong had political implications that remain relevant. Those who
    claim that Malthus was wrong he did not predict our capacity for technology and
    growth reproduce the thinking justified by Malthus’s framework. It was Malthus
    who imagined a limited world in order to justify growth. He did not see limits
    to resources as an eternal limit to the satisfaction of our limitless wants. Mill
    and Keynes, Engels responded to Malthus’s concerns with the prediction that there
    would be enough for everyone in the future, when we will produce more. Concerned
    that if Malthus were right, socialism could not abolish poverty but only generalize
    it, Engels contended that “too little is produced, that is the cause of the whole
    thing.”⁴⁴ Mill’s stationary state, Marx and Engels’ development of the forces
    of production, or later Keynes’s postindustrial future—where decades of growth
    would allow his grandchildren to work a few hours each week—all share the vision
    of overcoming scarcity by increasing production, distributing the bounty that
    everyone has enough.


    But as Nicholas Xenos puts it, “by relying on economic forces to transcend them,
    Keynes, and Marx and Mill before, are waiting for Godot.”⁴⁵ The technological
    forces that will supposedly transcend scarcity increase wants along production,
    ensuring that there is not and never will be enough for everyone. To live a dignified
    life and die a dignified death, the average person today needs to mobilize resources
    unthinkable to the royals of Malthus’s era. A focus on growth'
