    England . . . to be able to settle without interruption, wherever there was a
    prospect of a greater plenty of work and a higher price for labour.” “The market
    of labour would then be free, and those obstacles removed which, as things are
    now, often for a considerable time prevent the price from rising according to
    the demand.”31 The Essay might well be the first rejection of redistribution and
    welfare in the name of the growth of free markets.


    To illustrate the impossibility of the society of equals described by Godwin in
    his Enquiry Concerning Political Justice (1793), Malthus tells a story. He invites
    his readers to imagine there is no property or inequality. But what follows is
    John Lennon utopia. With subsistence secured, Malthus argues, people will start
    having as many children as they can. Population will grow faster than food, and
    the total share available to each individual will gradually diminish. Some will
    have to live with less than their share. Those luckier in their harvest will want
    to protect their food against the unlucky. Private property will be invented by
    the lucky to protect their crop against intruders. Since there is a proper class
    and propertyless and hungry little not to sell but by their labor, it will be
    inhuman and tyrannical to prohibit the latter from working for the former. “An
    administration of property, not very different from that which prevails in civilized
    states at present, would be established,” Malthus concludes.32 Godwin’s society
    of equals “in a very short period [will] degenerate into a society constructed
    upon a plan not essentially different from that... at present; a society divided
    into a class of proprietors, and a class of labourers.”33


    Inequality is inevitable, but it is not bad, Malthus nonetheless maintains. It
    is the motor of growth. We cannot have a society with a middle class alone because:


    > in society the extreme parts could not be diminished beyond a certain degree
    without lessening that animated exertion throughout the middle parts. . . If no
    man could hope to rise or fall, in society, if industry did not bring with it
    its reward and its punishment, the middle parts would not certainly be what they
    are now.34


    ## WHY WAS MALTHUS WRONG?


    Economists tell us that Malthus was wrong because he didn’t see the train coming.
    In the words of The Economist, “Malthus was a false prophet”:


    He gave arguably accurate description of pre-industrial societies, [but] the industrial
    revolution, which had already begun in Britain, was transforming the long-term
    outlook for economic growth. Economies were starting to expand faster than their
    populations, bringing about a sustained improvement in living standards.35


    Population did not collapse, and food availability increased faster than population.
    Malthus underestimated technology, the story goes—undervalued our “intelligence,
    imagination, and wonder,” as Ronald Reagan, or his speechwriter, would put it.
    The lesson, concludes The Economist, is clear: those who today call for limits
    to fossil fuels and greenhouse gases are also false prophets. Technology will
    do the job, and there’s no need for limits.


    But as I have here, Malthus did not call for limits to population or resources,
    nor did he question the prospects for growth. His object was to prove that there
    is not enough for everyone, not that there are limits to growth. The idea of growth
    as we understand it was invented a century after Malthus. At his time, the concepts
    of welfare, production, and population were conflated. For Malthus and many of
    his contemporaries, economic growth meant population growth, and growth in agricultural
    production. Malthus was optimistic that population could grow in the long term
    without limits—with discipline, industry, and more food.


    Granted, cycles Malthus wrote about suggested that in the long term the amount
