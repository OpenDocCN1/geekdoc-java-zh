  - '[PAGE 81]


    limits of capitalism. Under socialism we would not encounter limits, that argument
    goes. This may be interpreted in two very different ways. The first is that socialism
    would be better than capitalism at setting and sharing limits—and indeed Engels
    argued that a state governed by the working class would be better positioned to
    control population than a state controlled by a capitalist class whose interest
    it is to have cheap labor. Engels combined this with a second argument, and that
    socialism can somehow develop production more rationally than capitalism, because
    capitalism is driven by an irrational pursuit of profit. Socialism, on this view,
    would supersede the late, resource, or population limits faced by capitalism because
    it would be rational and superior technologically. With this second argument,
    I have a problem.


    True, limits are relative, defined in relation to a society''s wants. The limits
    we currently encounter are related to material wants constructed under capitalism.
    A different economic system with different wants would not necessarily face the
    same limits. But if that system wanted to satisfy material wants similar to those
    of capitalism, there is no reason why it would do so without the same catastrophic
    consequences. The atmosphere is indifferent to whether a carbon-emitting factory
    is owned by workers or by capitalists.


    A further problem with the idea that socialism would face no limit is that it
    reproduces the dream of limitless growth. The need for a culture of limits holds
    independently of the organization of society. Ancient Athens or the hunter-gatherers
    were not capitalists, but they did put limits on themselves. No system, socialist
    or otherwise, can exist without limits; the question is what limits it will have,
    and how such limits will be set. Those who think they have found the secret to
    a society of eternal luxury that will know limits can only be fooling themselves.'
  - '[PAGE 82]


    # EPILOGUE: IN DEFENSE OF LIMITS


    My own relationship to piano is very different from that of 1900, but equally
    instructive of my take on limits. Five years old, I tinkered joyously with a piano
    at the house of my sister’s godmother. My mother thought I had an inclination
    and enrolled me in a conservatory. As I grew up, my period of grace as a joyous
    toddler banging out notes ended, I found myself trapped in a strict regimen of
    two evenings of piano classes every week, a Saturday 8 a.m. class on theory and
    solfège, and countless hours of practicing. I hated it; my friends were going
    out playing or football, and I had to bend down and head to the conservatory.
    I told my parents, they would have taken me out of the conservatory on the spot;
    their children were supposed to live the ways they wanted to. But I did not want
    to disappoint my piano teacher or, in hindsight, my mother or her expectations
    for me as a talented piano player (I did not turn out to be a 1900, then again,
    1900 did not have a mother and did not go to a conservatory). Inventing my own
    limits, I kept going to piano classes, grudgingly, for thirteen more years. I
    could play Mozart and Beethoven reading the piano sheets, but if you asked me
    to pick out a tune or play my favorite Springsteen song, I would have stared frozen
    at the piano keys. When university gave me the excuse to stop the classes, I did
    not look back. I vowed to touch a piano key again. I thought I was liberated of
    an undesired limit.


    Fast-forward thirty years. I am in a process of coping with the loss of my mother,
    trying to come to terms with the limits of my own life (I haven''t yet, but it''s
    worth trying) and striving to sort out my desires and chosen limits from the limits
    I developed for myself as the one my parents needed to be. I am staying at a friend’s
    house in Athens, and there stands a long black piano. Curious, I sit down, free
    from any expectation or obligation to play. I start touching the keys. Suddenly,
    strange melodies start out of my hands, tunes I never imagined I could play. Today
    I take piano classes again and write my own music. I devote hours each week to
    it, hours I can’t do other things in. But unlike'
  - '[PAGE 83]


    Robinson Crusoe, I am satisfied. These are my limits, the limits of my own making,
    within which I can express my creativity.


    The issue in this book is of course not me. The planet is warming. By 2030 we
    should cut carbon emissions in half, and by 2050, down to zero. There are few
    signs though that we are willing to do anything like the "rapid, far-reaching
    and unprecedented changes in all aspects of society" that are needed.^1. In 2015
    nations agreed in Paris to limit climate change to a temperature rise of 1.5 degrees
    Celsius, but scientists who quantified the actual pledges concluded that these
    would amount to a catastrophic degree-rise^2 or more (and this assumes the voluntary
    pledges would be kept, which seems less and less likely).


    While climate breakdown is on the horizon, a new breed of autocrats denies the
    veracity of scientists'' predictions, doubling down on economic growth, removing
    remaining limitations and administrative infrastructures, and persecuting those
    who defend the environment. Silicon Valley''s wealthiest, in turn, are preparing
    their bags for the day after they call the "event". They land in New Zealand because
    it is less exposed to climate change (never mind the earthquakes and the volcanoes).^3.
    They wonder how their bunkers and security forces will fall under social collapse.
    And they fantasize about colonizing Mars or uploading their minds to supercomputers
    to survive the impending disaster.^4 As the endgame of two centuries of limitless
    expansion nears, no one is willing to pull the emergency brake, and many are happy
    to push the accelerator instead.


    The billionaires'' vanity would be funny if it were not so tragic and if it were
    not at the expense of the rest of us. This book dissects the seeds of this predicament:
    the way we have come to think about limits and our place in the world. Ever since
    Malthus, we think of our unlimited and the world as limited. Our mission is to
    conquer the world without limit, and the imposition of limits is equated with
    suffering. There is not enough for everyone, we have come to believe, waging war
    on the world to subdue it and secure more to relieve our suffering.


    This idea of limitless expansion in a limited world is a fantasy peculiar to our
    civilization. The fantasy is a particular construction of capitalism, because
    capitalism needs expansion, and expansion needs of frontier. Limits'
  - '[PAGE 84]


    are part and parcel of limitless colonization. It is the system''s inability to
    share the abundance it produces that creates a constant impetus to move outward
    in the direction of more. Future expansion justifies current inequality, and inequality
    makes everyone work hard for expansion.


    If we agree this path has become self-destructive, then our response cannot be
    to expect a future when we will have more and share better, because that day will
    never come and the belief that it will perpetuates the current fantasy that drives
    expansion. The only response is that everyone will have enough once we limit ourselves
    and share what we already have. When only we accept that our wants are limited
    and can be satisfied we will finally enjoy an abundant world.


    My case for self-limitation is not only, and not principally, environmental. It
    is also an ethics of care, a case against colonizing other humans and nonhumans.
    It is also anthropological, resisting on the intuition that a life with limits
    does not make sense. Lim and shaping our wants and desires is what makes us human.
    The Greeks were not the only civilization that may have found, temporarily, a
    wisdom of limits. Seeing civilization as the art of limiting the unlimited can
    help us to revisit other civilizations that we have dismissed as stagnant or characterized
    as suffering from religious oppression and superstition, to ask why and how they
    limited themselves.


    Granted, the wisdom of limits is not easy. The thought of death and our own limit
    is unbearable. It is easier to shred our internal limits and react to them, like
    I did when I stopped playing piano, reflect on, reshape, and embrace them. Each
    new generation wants to transgress the limits posed by its ancestors. Institutional
    or parental limits fuel the desire for transgression. Once the genie of limitless
    expansion is out of the bottle, it is not easy to put it back in. Those who know
    limits accumulate power that allows them to dominate, violently if need be, those
    living within limits. And the enforcement of limits becomes a locus around which
    rulers consolidate power, invoking limits to keep the ruled in check. Time and
    again, the oppressed will revolt against unjust limits. Precisely for this reason,
    embracing limits is now so difficult; as in Malthus''s time, a growing number
    of us are being told that there is not enough for everyone and that we should
    learn to live within while the fat cats do not. But it is'
