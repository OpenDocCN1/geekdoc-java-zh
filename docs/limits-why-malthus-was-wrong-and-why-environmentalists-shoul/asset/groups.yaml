    Environmentalism in this vein did not accept the Malthusian assumption of limitless
    wants, but it didn''t question the desirability of prevalent wants either. The
    happy-ending scenario in Limits to Growth was one of slowing down so as to perpetually
    maintain the maximum number of people and goods, something quite similar to Malthus''s
