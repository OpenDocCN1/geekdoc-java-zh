    Of course, “the question of whether or not humanity is presently on a collision
    course with the earth is largely an empirical question. It is not that we should
    deny or affirm on the grounds of political convenience.”39 But Harvey is right
    in that the way we frame this “collision” is never politically neutral. Behind
    claims of Malthusian apocalypse in Africa, empirical research has revealed racism
    in the form of concerns with overpopulation that justify encroachment on the rights
    and bodies of poor women, and the violence against minorities legitimated in the
    name of limiting human presence in protected parks.40 Hardin’s hypothetical lifeboat
    becomes real as nations close their borders as supposed limits to their territory
    or economies, leaving refugees to drown in the Mediterranean.


    True, unlike Hardin, other neo-Malthusians as Paul Ehrlich emphasized empowerment
    and voluntary birth control and argued for free immigration or for redistribution
    and solidarity between North and South in the name of planetary limits.41 The
    world is limited, and this is a reason for sharing it, they argued, not for protecting
    our spoils. The case for sharing, I think, is much stronger if we agree that we
    want the world to be limited, rather than imagining limits come to us from the
    outside, like a storm that provokes a shipwreck, making victims of us all, one
    surviving at the expense of the other.


    Fourth, environmentalists have gotten bogged down in endless scientific arguments
    about the precise definition of ecological limits—how much carbon we can emit
    or how much can we pollute our air or waters. Determining limits is rife with
    complexities. My experience at the European Parliament taught me that industrial
    interests exploit (if not manufacture) uncertainty to avoid regulation. Biophysical
    processes are complex, and limits cannot be defined independently of a purpose.
    There is one limit on pollutants if we want to keep safe water for drinking, and
    another if we want to use it for irrigation, or for surfing, or for fishing. Defining
    limits entails choices and trade-offs between different users and groups with
    different powers. These are distributive choices, but they are often treated as
    mere scientific problems of determining objective limits.


    This scientization of the environmental question—inherent in the notion that limits
    are a property of natural systems that can be deciphered by the experts who study
    these systems—is potentially undemocratic. In this sense, the fourth of these
    problems I''m describing is closely linked to the second. Scientization produces
    a passive public that sees the solution of environmental problems as a job for
    experts. Environmental limits seem to come from the top down. Ultimately, solving
    environmental problems requires everyone''s participation⁴²—people becoming owners
    of their limits. This is not obvious when we view a limit as something objective
    that there are only a few can know or understand.


    Fifth, as I showed in the preceding chapter, the idea of scarcity is essential
    for capitalism. If something is limitless (say, the air we breathe), then no one
    can be its proprietor and trade it for profit; capitalism cannot operate under
    abundance. Environmentalists unintentionally play into resource and land enclosures.
    If something is limited, the economic logic goes, let''s delimit it, set a property
    right, and trade it so to allocate it as efficiently as possible. Economists apply
    this logic to river flows, pollution, and conservation. Seemingly innocuous rebranding
    nature as capital, ecosystems as services, and the atmosphere as a “limited sink”
    have created a commonsense way of seeing environmental problems in terms favorable
    to market solutions. The ideological work going on is evident in the fact that
    most of us take for granted and reproduce absurd ideas such as the notion that
    the atmosphere—the sky, that is—“a sink”(!), a metaphor whose only function is
    to frame the problem of pollution in the Malthusian terms of scarcity that economists
    are comfortable with.


    But the ever-growing market is actually an important driver of environmental degradation.
    In the 1980s, environmental regulation was dismantled as the dominant idiom became
    one of costs, benefits, and the monetary value of protecting nature, instead of
    limits, risks, and prudence. Nature became one among many forms of capital to
    be allocated “optimally” by markets. Nature could be sacrificed for a few more
    dollars and percentage points of the GDP, justified theoretically in terms of
    leaving more money and machines to future generations who will be able to compensate
    for nature’s lost services or insulate themselves from their impacts. By the time
    global warming became a prominent issue, economists like William Nordhaus called
    to discard all fossil fuels and talk instead of balancing the future costs of
    climate change against the economic damages from present mitigation.43 Climate
    change became a matter of discount rates.44 Twenty-five years later, enforceable
    limits to fossil fuel use are out of the question, and the planet is heating up.


    ## THE PROBLEM WITH ECOLOGICAL FOOTPRINTS AND PLANETARY BOUNDARIES


    The “ecological footprint” is a calculation of how much land it would take to
    produce the goods and services we consume and to absorb the waste and pollution
    we create. The indicator is useful because it reminds us that what we do “here”
    has impacts “there”: the environmental costs of our actions have shifted in space
    and time, and the footprint is a measure of this shift. The indicator, and especially
    the way it is communicated, has many problems. For the moment the scientific abstracts
    necessary for turn everything into the land-use equivalent. My concern is here
    with statements such as, “Humanity uses the equivalent of 1.7 Earths,.45 or, “August
    1, humanity will have used nature’s resource budget for the entire year.” No matter
    how good the intentions, framing reproduces a Malthusian vision of a limited earth.46
    We are numerous, and we consume too much. But who is “we”? And why do “we” consume
    too much? The footprint message makes for headlines, but it is apolitical, as
    it puts all in the same boat. It is empowering, as our proposed overshooting comes
    and goes every year, but the world continues to turn.


    The “planetary boundaries” framework is scientifically more sophisticated, but
    it too can reproduce the myth of a limited world.47 There are fine boundaries
    of the earth system, planetary scientists tell us, and if we transgress them we
    risk abrupt, catastrophic, nonlinear change48 (climate change is one result; there’s
    also the extinction of species and the loss of biodiversity, the ozone hole; and
    acidification of the oceans, phosphorous and nitrogen; could lead to drastic reduction
    in fish stocks). Supposedly, there is nothing about these boundaries, which are
    descriptions of the way the world is. We can release so much phosphorous before
    polluting ecosystems and so much carbon before bringing a certain rise in global
    temperature. But as I have argued, there is nothing natural in framing such facts
    as limits or “boundaries.” They are boundaries only if we want to label them as
    such (and I agree I should), but there is also no reason why we can''t continue
    living on a hotter earth or survive in a world with polluted ecosystems. Life
    would be worse for many, perhaps, but it would be life nonetheless. The boundaries,
    as Kate Raworth argues,49 are not given; they are boundaries of a collective good,
    which we should choose.50


    The act of making boundaries seem natural, inscribing them in geophysics, has
    political implications, because it makes the issue seem technical—a matter of
    geophysics and engineering rather than one of political vision. The underlying
    assumption is that we can continue living as we do, grow perpetually, as long
    as we develop better technologies to use less fossil fuels or phosphorous, staying
    within the boundaries. This is what has been called “green growth,” and it is
    no coincidence that notable advocates of planetary boundaries have come out in
    support of green growth.51 Conveniencely, the message is that we could keep doing
    what we are (at least in Sweden, the authors’ country), which we praise as a model
    of green growth and stay within planetary boundaries. Others go even further and
    argue that we should grow without limits in order to develop these green technologies.
    Limits, in our narrative, are used to make the case for no limits. Sounds familiar?
    It should, because this was the thrust of Malthus’s argument.


    There is nothing wrong when planetary scientists make diagnostic statements, as
    when the IPCC says we have a 50 percent chance of stabilizing the average global
    temperature at a 2-degree Celsius increase over that of the preindustrial period
    if we keep concentrations of carbon dioxide under 450 ppm. But economists opened
    Pandora’s box when argued that this not tell us whether we stay within 2 degrees,
    and that we should instead compare the costs and benefits of staying within 2
    degrees versus the costs of surpassing that limit and benefiting from further
    growth. William Nordhaus, who recently received the economist’s version of a Nobel
    Prize for his work on energy and climate economics, has even claimed that people
    might “come to the altered landscape of the warmer world.”52


    A warmer world might be so warm as to be definitely unlike, and there may be few
    left to it or not. Or it may be that people “like it”

