    is not the same as a limit to growth, strictly speaking. My point here is not
    to revisit arguments about who is right or wrong in this endless debate whether
    there are limits to growth, but rather to question its framing.


    Neo-Malthusian environmentalists may have arrived at the notion of a limited world
    by following a different route than Malthus (resource limits instead of limitless
    wants), but their vision of limits is as naturally inscribed in the state of the
