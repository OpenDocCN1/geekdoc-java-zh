    ## LIMITS AFTER THE END OF NATURE


    It is indeed increasingly problematic to think of civilization and nature as two
    separate entities, in which an external nature puts boundaries on human activity.
    We are as much a part of nature as any other species, and our constructs are as
    natural as those of any animal’s. Some scholars have argued that the Anthropocene,
    posited as the current geological age in which human activity is leaving its trace
    in the geological strata, marks “the end of nature,” or more precisely, since
    we have never been separated from nature, the end of the *idea* of nature as something
    external to us. Indeed, there is nothing unnatural about a city, just as there
    is nothing unnatural about ant colony. Humans are constantly creating new natures
    just as do other species.


    It is wrong to conclude from this that we are omnipotent; that if we are nature
    then we can do whatever we want to nature, or whatever we do is fine because it
    is as natural as anything else. A difference still exists between a pristine mountain
    and a shopping mall,⁴ but the difference is not a matter of naturalness; it is
    a matter of judgment. (We have a tendency to call “natural” whatever we like and
    don’t want to change. At other times, we use “natural” to describe what we do
    not like but want to “civilize.” In short, we hide our judgments behind versions
    of the idea “nature.”)


