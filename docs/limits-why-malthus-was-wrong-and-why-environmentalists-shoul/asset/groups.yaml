  - '[PAGE 25]


    economics. Neoclassical economists developed mathematically complex models of
    the behavior of homo economicus, a modern-day Robinson Crusoe who strives to get
    the most out of his limited time.


    Most economists would argue that this new economics has nothing to do with Malthus.
    Malthus, an economist will tell you, was right about his world, but that world
    faded with the arrival of the industrial revolution and of the new analytical
    economics, which made sense of a newer world.³ Malthus, the story goes, described
    a gloomy world of limits that was in its death throes, while the new world of
    industrial growth knew no limits. In the old world, nature was the limit; in the
    new world, there is no absolute limit, only uses of our time.


    That Malthus is treated as an outlier in the history of economics is strange.
    Malthus was the world’s first professor of economics, if not the first professional
    economist. The new economics as it came to be known, “owes much to Malthus’s⁴
    pamphlet: its tone as well as its scope was distinctly Malthusian. The premise
    of unlimited human wants and of a natural and universal scarcity; the insistence
    on industry and growth as responses to scarcity; the defense of inequality on
    the basis that it fosters industry; the supposed concern with a greatest good
    for the greatest number; the rejection of redistribution because it defeats its
    own purposes: these Malthusian tenets are mobilized to this day to counter welfare
    policies and modern laws for the poor.


    Malthus''s work, like that of many economists today, was ideo-logical, “proving”
    logically the political position, or belief, that a society of equals is impossible.⁵
    It rested on a simplified fable, of the fall of Eden, to shape its model. But
    more importantly, Malthus developed the core idea of the new discipline: scarcity.
    A prophet of unlimited wants, not limits, was among those who invented the idea
    of a perpetual scarcity that cannot be overcome. True, Malthus’s obsession with
    population and food made less sense as production grew and there were fewer shortages.
    Population growth slowed down, fossil fuels and expansion in the colonies made
    the world seem limitless again (at least Westerners). Yet the question Malthus
    first sought to explain away remained relevant: why is there still poverty amid
    so much wealth? If there are no limits, why do most of us still experience insuperable
    limits? When will we have enough for everyone?'
  - '[PAGE 26]


    “Never” was, and is, the answer of the dismal science. But to maintain this answer,
    economists had to adapt Malthus’s old theory to new times.


    # SCARCITY, RELATIVE AND ABSOLUTE


    Economics retained Malthus''s premise of unlimited human wants, instead of reproduction,
    an instinct people demonstrated a capacity to limit well, the science posited
    an unlimited desire to do and have, or else to produce and consume.6 Limits of
    food became limits of time, capturing the new experience of having too little
    time that urban dwellers felt.


    Lionel Robbins''s 1932 essay marks this shift from Malthusian to neoclassical
    scarcity: “Man wants both real income and leisure,” but “he has not enough of
    either fully to satisfy his of each.”7 We are “sentient creatures,” Robbins continued,


    +   with bundles of desires and aspirations, with instinctive tendencies alluring
    us in different ways to action. But the time in which these tendencies are expressed
    is limited. The external world does not offer opportunities for their complete
    achievement. Life is short. Nature is niggardy. Our fellows have other objectives.
    We can use our lives for doing different things, our materials and the services
    of others for achieving different objectives,88


    In my field of ecological economics—a very different type of economics from neoclassical
    economics, we understand the economy as a flow of energy and matter, not money—we
    distinguish Malthusian or absolute scarcity, a finite of means, say food or natural
    resources, from neoclassical or relative scarcity, a scarcity of means to satisfy
    limitless alternatives uses.9


    Malthus''s scarcity, as we have seen, did not stem from limits to food from the
    unlimited sexual drive of humans. His scarcity was not absolute. The thought and
    resource could grow without any limit. The scarcity was relative, the result of
    differing rates of population growth and food production. Malthus postulated a
    scarcity of limited food to feed unlimited numbers of children; Robbins, a scarcity
    of limited time to do the unlimited number of things we want to do. For both there
    is not enough—food or time—to do everything, and we want everything without limits.
    Our world is limited because our wants are unlimited. In this limited world, only
    scarcity knows no limits.'
  - '[PAGE 27]


    Robinson Crusoe landed on an abundant island, Robbins tells us, but he still had
    to choose whether to devote his time to planting crops or talking to his parrot.
    He couldn''t do both at once. Scarcity followed him into paradise. As Malthus
    claimed, there can never be paradise on earth.


    This story of scarcity, however, like Malthus''s, is circular or tautological.
    It begins with an assumption that what people want to do or has no limits. From
    there it derives scarcity, which justifies growth, which in turn validates people’s
    wanting and pursuing things without limit. In reality, growth is a particular
    need of capitalism—a system that requires a compounding of profits. With the invention
    of scarcity, growth was naturalized and sacralized. It was inscribed in human
    nature (growth is what people, not economists or the owners of capital, want).
    The origins of this assumption are sacred, it is God’s for Christians, like Malthus,
    or the birthright of people to pursue whatever they want, for liberal economists.
    The underlying assumption is the same: people want as much as possible. And the
    conclusion is, they should.


    Economics predicted Malthus’s story of universal and natural scarcity, justifying
    the perpetuation of limitless growth, an objective that otherwise makes no sense.
    But the underlying assumption is somewhat absurd. In a semisatirical piece in
    the economics of the afterlife, Scott Gordon comments that even if in heaven were
    infinite and we could do anything we wanted, we would still suffer from scarcity,
    because we wouldn''t be able to do more than one thing at once—we would not be
    able to play the harp and go swimming simultaneously, as he puts it. To be abundant,
    heaven would have an infinite width, not, length, of time, Gordon argues. Only
    then would we be able to do an infinite amount of things, all at the same time,
    suppressing infinity into a unique moment.¹1 Short of this infinite moment, we
    will always face scarcity. Wendell Berry, in his essay “Hell Hath No Limits” comments
    that “for those who reject heaven, heaven is everywhere, and thus is limitless.¹12


    Only from this peculiar perspective, economists takes for granted, does the strange
    idea of “opportunity cost,” a founding concept of the discipline, make sense.
    “Every act which involves time and scarce means for the achievement of one end
    involves the relinquishment of their use for'
  - '[PAGE 28]


    the achievement of another,” writes Robbins.13 In simple words, everything we
    do have a cost: the cost of not doing something instead. This makes sense if we
    assume, Robbins does, that we want to do an unlimited number of things and we
    can''t be content with doing only one thing at a time. In this limited world of
    limitless wants, there will never be a break, no paradise, not even after we die.


    # SCARCITY GETS REAL


    No one but economists themselves has ever thought that we want to do an unlimited
    number of things at every moment of our life, just as no one but Malthus has claimed
    that we want to have as many children as possible. No doubt it is in our nature
    to want many different things, and doing one thing means not doing another. But
    it is also our nature to choose or search for limit (In fact, there is no animal
    that limitlessly creates or works to produce more and more.)14 This frenetic “reality”
    of the economic model, however, is becoming more and more our lived experience,
    with time getting shorter and shorter, and the prescriptions of economic models
    shape in their image world that they describe.


    Milton Friedman famously defended the assumptions of neoclassical economics on
    the grounds that an assumption should be judged by testing its predictions, not
    by its realism.15 Not everyone is Robinson Cruose, but to model an economy, one
    has to simplify. In assuming that we behave like home economicus we produce a
    good representation of our world, then so be it, Friedman implied. Models, often,
    are not falsifiable. Take Malthus. That population cannot grow faster than food
    is true, a fact, not a prediction. That reality and our world refute an implausible
    prediction (i.e., that population could grow exponentially, to 256 billion today)
    does not make the rest of your world plausible. You are simply asserting a fact
    (an interesting one, no doubt) that if a population were to grow at its natural
    rate, its numbers today would be unthinkable, which means something must be keeping
    it in check. Likewise, the foundational neoclassical assumption that individuals
    maximize utility is supposedly confirmed by the fact that it is the foundation
    of a theory of demand and supply that explains. But no one has been able to'
- md: '

    measure utility to test whether indeed it correlates with prices. Claiming that
    utility is revealed in prices is a tautology if prices are the only way to know
    how useful we find something.


    Unrealistic as these assumptions may be, the story of scarcity resonates with
    an actual experience of scarcity, which the theory helps to justify, if not produce.
    Analytical economics appeared with the industrial revolution and capitalism. The
    notion of scarcity emerged within a context of unprecedented social mobility and
