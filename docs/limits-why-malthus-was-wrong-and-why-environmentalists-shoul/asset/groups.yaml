    （足以允许它们的替代）。这种选择是在平滑地限制增长，还是让其剧烈崩溃并自我限制。


    这种路线上的环保主义并不接受马尔图斯关于欲望无限的假设，但它也不质疑普遍欲望的合理性。《增长的边界》一书中的圆满结局之一是放慢速度，以永久维持最大数量的人口和物资，这与马尔图斯对维持最高人数的关注非常相似。减速的原因与追求一种不同、更好的生活方式几乎无关。相反，它是对外部局限的适应——即由与我们发生冲突的客观事性所施加的局限。变革的动力并非源于意愿，而是面对迫临崩溃时的生存。


    这种马尔图斯式的框架为经济学家们提供了磨刀石。来自麻省理工学院（MIT）的罗伯特·索洛（Robert Solow）在《增长的边界》出版后，通过一次激昂的演讲发起了反攻。我们能多快地提取资源，或者在有限制的情况下，从给定的资源量中提取出多少，这是一个技术问题。索洛认为，不仅资源是充足的，即使这些资源被耗尽，它们的价格也会上涨，而我们将开发出新的技术来使用更少的资源，或者转向其他尚未限制的资源（通过所谓的“替代”）。如果食物生产在马尔图斯的模型中允许了人口增长，那么技术在索洛的模型中就可以允许经济增长。


    在回复和随后的研究中，索洛将生态问题直接引入了经济学领域，考虑到马尔图斯式的框架，这是自然而然的。问题被设定为资源提取速率与技术变化之间的相对速率问题。索洛回应说，正如《增长的边界》所主张的，如果自然资源是有限的，即使是负增长——基本上，任何高于零的资源使用——最终都会耗尽这些资源并使生产终结。问题变成了如何随时间分配有限资源，以维持最大的总“人年”数。这本质上是一个代际之间稀缺资源优化配置的问题。而如何优化地分配稀缺资源正是经济学的本质。


    至关重要的一点是，罗宾斯（Robbins）之后的经济学家们发展出一种观点：稀缺的不仅是自然资源，还有资本、劳力和时间。


    从这个角度来看，如果代价是给后代留下更少的森林或更污染的海洋，以换取更多的可以用来做事情的技术资本，那么这可能是更好的。将问题设定为在（例如）使用较少或较多森林之间的选择，使之从生态限制问题转变为一个分配问题，以及一个关于为尽可能多的人口延长对欲望最高满足水平的效率问题。如果通过今天砍树，我们明天在经济上会过得更好，那就随之吧。


    在其他地方，我对于技术是否能跟上资源枯竭，或者资本是否可以替代自然发表过自己的观点。复合几何增长趋于无穷大，而且正如马尔图斯最初指出的那样，它在逻辑上必须受到抑制。它将抑制什么，或者何时清楚，尚不明确。此外，崩溃可能会伴随着从较低水平的重新增长——严格来说，经济最大规模的限制不等同于增长的限制。我在这里的观点不是重回到关于在是否存在增长限制的无休止争论中谁对谁错的问题，而是质疑它的框架。


    新马尔图斯主义环保主义者可能通过与马尔图斯不同的路线（资源限制而非无限欲望）得到了“有限世界”的概念，但他们的限制愿景自然地刻在世界状态中，复制了马尔图斯和经济学家的稀缺模型。正如马尔图斯诉诸崩溃以维持可能的最大人数一样，环保主义者在诉诸增长的限制或崩溃时，意味着我们想要尽可能长地维持可能的最大产出。在这个马尔图斯框架内，生态问题被简化为一个经济问题，即在稀缺约束下如何维持最佳产出，这反又为这些本质上是社会问题的市场解决方案开辟了道路。限制增长的号召——我认为这种号召表达了对傲慢的祖先式焦虑以及以不同方式生活并寻找意义的渴望——被简化为一场乏味的科学争论（包括赌注），关于增长如何被维持以及维持多久。


    通过采纳马尔图斯的框架，环保主义者偶然发现了他们自己关于“限制”这一理念的局限性。但事情并非必须如此。


