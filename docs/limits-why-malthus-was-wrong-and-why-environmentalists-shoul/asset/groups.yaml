    it is not, and will never be, “enough for all to have a decent share.”15 There
    are always a scarcity of food in relation to people. This, I claim, is the second—and
    unmarked—principle of Malthus''s Essay: the principle of scarcity. The principle
    of scarcity follows directly from the first principle of population: if the number
    of people is always greater than the amount of food they can produce, then there
    is a scarcity of food—scarcity now, and, everywhere. Nature’s bounty is scarce
    because our reproductive potential is limitless. Malthus conceives of a world
    that is naturally limited because the needs of our bodies are unlimited. Here
    is a conception of nature that lies at the heart of modern economics and, to an
    extent, environmentalism.


