    当然，“人类目前是否正处于与地球碰撞的轨道上在很大程度上是一个经验性问题。这并不是说我们应该基于政治便利性来否定或肯定。”39 但哈维维（Harvey）是对的，因为我们界定这种“碰撞”的方式绝不是政治中性的。在关于非洲马尔萨斯式末日的言说背后，实证研究揭示了种族主义——其表现形式为对人口过剩担忧，这种担忧为侵犯贫困女性的权利和身体提供了合理性，并以限制保护区内人类活动的名义使对少数族族的暴力变得合法化。40
    哈丁（Hardin）假设的救生筏在各国关闭边境作为对其领土或经济的限制时变成了现实，让难民淹没在地中海。


    诚然，与哈丁不同，保罗·埃尔里希（Paul Ehrlich）等其他新马尔图斯主义者强调赋权和自愿计划生育，并以地球极限的名义主张自由移民或南北方之间的再分配与团结。41
    他们认为，世界是有限的，这正是分享它的理由，而不是保护我们战利品的理由。我认为，如果我们认同我们想要世界是有极限的，而不是想象限制是从外部降加给我们的（像一场引发海船失事的风暴，让我们所有人都成为受害者，一个以牺牲另一个为代价幸存），那么分享的理由将要充分得多。


    第四，环保主义者陷入了关于生态界限精确定义的无尽科学争论中——我们能排放多少碳，或者我们的空气或水被污染到什么程度。确定界限充满了复杂性。我在欧洲议会的经历告诉我，工业利益集团利用（如果说不是制造）不确定性来规避监管。生物物理过程是复杂的，限制无法脱离目的而独立定义。如果我们想保持饮用水安全，对污染物就有一个限制；如果我们想将其用于灌溉、冲浪或捕鱼，则有另一个限制。定义界限涉及到不同具有不同权力的用户和群体之间的选择与权衡。这些是分配性选择，但它们通常被仅仅视为确定客观界限的科学问题。


    这种环境问题的“科学化”——其内在逻辑是，认为限制是自然系统的属性，可以由研究这些系统的专家破译——具有潜在的不民主性。从这个意义上说，我描述的这第四个问题与第二个问题紧密相关。科学化产生了一个被动的公众，他们认为解决环境问题是专家的工作。环境界限似乎是从上而下产生的。最终，解决环境问题需要每个人的参与⁴²——人们成为自己界限的主人。当我们把限制视为一种只有少数人能知道或理解的客观事物时，这一点就显而易见了。


    第五，正如我在前章中所展示的，稀缺性概念对于资本主义至关重要。如果某东西是无限限制的（例如我们呼吸的空气），那么没有人能成为它的主人并将其交易获利；资本主义无法在富足的情况下运作。环保主义者无意中助长了资源和土地圈圈。如果某东西是有限的，经济逻辑就是：让我们界定它，设定产权并进行交易，以便以最有效的方式进行分配。经济学家将这种逻辑应用于河流流量、污染和保护。将自然重新定义为资本、将生态系统重新定义为服务、将大气重新定义为“有限的汇”，这些看似无害的重新命名创造了一种常识性的方法，以有利于市场解决方案的角度来看环境问题。正在进行的意识形态工作是显而易见的，体现在我们大多数人理所当然地接受并复制了一些荒谬的想法，例如认为大气——即天空——是一个“汇”（!），这个比喻的功能仅仅是将污染问题框定在经济学家熟悉的马尔萨斯式稀缺性术语中。


    但不断增长的市场实际上是环境恶化的重要驱动力。在20世纪80年代，环境监管被拆解，因为主语调变成了成本、效益和保护自然的金钱价值，而不是限制、风险和谨慎。自然变成了许多资本形式之一，由市场进行“最优”配置。自然可以为了增加几美元和GDP的几个百分点而被牺牲，这在理论上的理由是为后代留下了更多钱和机器，他们将能够补偿自然损失的服务或免受其影响的影响。等到全球变暖成为一个突出问题时，威廉·诺德斯（William
    Nordhaus）等经济学家呼吁放弃所有化石燃料，转而讨论平衡气候变化的未来成本与当前缓解措施带来的经济损害43 气候变化变成了一个贴现率的问题⁴4 二五年后，对化石燃料使用的强制性限制已不再可能，而地球正在升温。


    ## 生态足迹与行星边界的问题


    “生态足迹”是一种计算，衡量为了生产我们消耗的和服务以及吸收我们产生的垃圾和污染需要多少土地。这个指标是有用的，因为它提醒我们，我们在“这里”所做的一切对“那里”都有影响：我们行为的环境成本在空间和时间上发生了偏移，而足迹是对这种偏移的衡量。这个指标，尤其是它的传播方式，存在许多问题。目前，必要的科学摘要将一切都转化为土地利用的等值物。我在这里担心的是诸类的陈述，例如，“人类使用的相当于1.7个地球，”⁴⁵，或者“8月1日，人类将耗尽一整年的自然资源预算”。无论意图多好，这种界定都复制了一个马尔萨斯式的有限地球愿景⁴⁶
    我们的人口很多，而且消耗得太多了。但“我们”是谁呢？为什么“我们”消耗得太多？足迹的信息有助于制作头条，但它是去政治化的，因为它把所有人都置于同一条船上。它是赋权的，因为我们提议的超支每年都来反复复，但世界继续运转。


    “行星边界”框架在科学上更加复杂，但它同样也可以复制有限世界的神话⁴⁷ 行星科学家告诉我们，存在地球系统的边界，如果我们越过这些边界，就会面临突如其来的、灾难性的非线性变化⁸（气候变化是结果之一；还有物种灭绝和生物多样性丧失，臭氧层；海洋酸化，磷和氮可能导致鱼类数量剧减）。据称，这些边界并没有本质，它们是对现状的描述。我们可以在释放这么多磷之前污染生态系统，在释放这么多碳之前导致全球升高。但正如我所主的，只有当我们把这些事实界定为限制或“边界”时，它们才是边界（我同意这样做），但也没有理由我们不能在更热的地球上生活或在受污染的世界生存。对许多人来说可能会变得糟糕，但仍然是生活。正如凯特·罗沃斯（Kate
    Raworth）所说的，边界⁹不是给定的；它们是集体利益的边界⁰⁰ 将边界化、刻入地球物理学的行为具有政治影响，因为它使这个问题看起来像是一个技术问题——一个地球物理和工程问题，而不是政治愿景问题。其潜在假设是，我们可以继续这样生活、持续增长，只要我们开发出更好的技术来减少化石燃料或磷的使用，保持在边界之内。这就是所谓的“绿色增长”，而行星边界的著名倡导者支持绿色增长并非偶然⁵¹
    巧的是，信息是我们可以继续像现在这样（至少在作者所在的瑞典），我们将其誉为绿色增长的模式并保持在行星边界内。其他人更进一步，主张我们应该无限制增长，以便开发这些绿色技术。在我们的叙事中，限制被用来为无限制增长提供理由。听起来熟悉吗？应该是的，因为这就是马尔萨斯论点的核心。


    行星科学家做出诊断性陈述本身并没有错误，正如当政府间气候变化委员会（IPCC）说如果我们二氧化碳浓度控制在450 ppm以下，我们就有50%的机会将全球气温稳定在工业前水平升高2摄氏度以内。但经济学家打开了潘多拉魔盒，他们认为这并不能告诉我们是否会留在2度以内，相反我们应该比较保持在2度以内的成本效益与超过这一限制并从进一步增长中获益的成本。近期因能源和气候经济学工作获得诺贝尔经济学奖的威廉·诺德斯甚至声称，人们可能会“适应更温暖世界改变的景观”。⁵²


    一个更温暖的世界可能热到变得完全不同，那里可能只剩下很少，或者完全没有。或者人们可能会“喜欢它”


