    Christian sin presupposes a well-defined dichotomy between what must and not be
    done; the Greeks were only to avoid excess and hubris.35 The manner in which pleasures
    were enjoyed was then “an ethical problem”36 and a practice that demanded reflection
    and prudence.37 No unified, coherent system was imposed on everyone in the same
    manner. Both philosophers and doctors, for example, wrote guides that recommended
    regimens of diet and exercise and offered advice on opportune times for sexual
    activity. These were disquisitions on the art of living whose routines were intended
    to avoid excess and establish measure.


    For Plato, self-mastery was an active battle to dominate one’s own desires and
    pleasures. The Greeks had an agonistic attitude towards their desires.38 The point,
    though, was not to eradicate but to be aware of desires and, most important, to
    cultivate control of any desires that were potentially violent or self-destructive.
    As Aristippus put it, “It is not abstinence from pleasures that is best, mastery
    over them without being worse.”39


    In the preceding chapter we saw how the dominant view today, a legacy of economics,
    is that wants are unlimited and cannot be questioned, only that we should produce
    as much as possible in order to satisfy them. Anything else impinges on freedom,
    the freedom to pursue our desires. The Greeks had a different view: it was self-master
    that brought freedom—freedom not as the independence of free will,40 Control did
    not mean renunciation or denial of desire, but mastery that was a necessary quality
    for leadership. In Plato’s view, the vicious ruler, like the tyrant of tragedies,
    was incapable of mastering his own passions and as a result prone to abuse his
    power and do violence to his subjects. The wise leader is first the master of
    himself, his self-rule moderating his rule over others.41


    Reading Foucault, I came to see how my own fascination with self-limitation and
    moderation was a product of my upbringing and my immersion in ancient Greek culture
    at a formative stage in life. The morals of Odyssey and the Iliad, the myths and
    the legends I read as a child, influenced my own moral structure. And these morals
    and stories distilled the imaginary of the Greeks about the world they lived in
    and the society they were creating.


    ## THE METAPHYSICS OF LIMITS


    The Greeks projected their social and personal reality onto the world and the
    universe. Seaford contends that it cannot be a coincidence that the early sixth-century
    BCE philosophy of Anaximander is where we first find the idea of a cosmos without
    anthropomorphic deities together with the idea of a unitary, all-pervasive, abstract,
    and transcendent substance, quite reminiscent of money. Anaximander hailed from
    the city of Mileus, perhaps the first fully monetized society. Philosophers, in
    other words, projected the conflict between social limit and the unlimited power
    of money onto the universe. Sixth-century BCE Pythagans privileged limits at a
    metaphysical level, arguing that the universe comes into being as a process of
    limiting the unlimited.42 from infinity and returns to infinity. For Anaximander,
    everything is subject to a limit and returns to the limitless. One and a half
    centuries later, Plato would argue that limit should control the unlimited, and
    Aristotle would denounce limitlessness as bad and champion limits.43


    I am not trying to claim that the ontology of Greeks was founded on limit while
    ours were founded on limitlessness. As I showed with Malthus, things are more
    complicated than that. Malthus''s limited world was the result of limitless waits:
    limits were invoked when it came to redistribution, but limitlessness was invoked
    when it came to expansion. But the particular relationship that the Greeks saw
    between limits and the unlimited differed from ours, and these differences be
    illuminating.


    Some pre-Socratic philosophers envisaged the world as unlimited; Anaximander said
    that the substance of everything is infinity (the apeiron), by which he meant
    the unlimited. And Heraclit regarded the cosmos as an eternal fire in constant
    transformation. Each of them imagined the existence of a cosmic principle that
    imposes limits in a sort of balancing act or canceling out of forces.44 Similarly,
    the early Pythagoreans regarded the world as composed of opposites, the most basic
    opposition being between limit and the unlimited; limit is superior to the unlimited,
    and cosmogy is the limiting of the unlimited.


    Indeed, what human culture generally does, as I argued earlier with the example
    of artworks, is to limit the unlimited. Any kind of ordering or creation (painting,
    lawmaking, or the building of a tale) entails limiting the unlimited. It''s just
    that this fact acquired special importance in the newly monetized society of the
    Greeks, where for the first time a human-created unlimited was threatening to
    destroy the polis.$^{45}$ Solon accepted the idea that there was no visible or
    easily understood limit, but as the philosophers asserted, there was something
    with universal limiting power. The Greeks projected onto the cosmos a power to
    limit, an entity they saw as real and extant. Cosmogony was the limiting of the
    unlimited by something less than the unlimited matter.


    If I may be allowed a diversion here, this aspect of Greek ontology and culture
    has features in common with the egalitarian societies of hunter-gathered societies
    by anthropologists,$^{46}$ These hunter-gatherers live in a world of limits and
    limitlessness. They see nature as unlimited, but they respond to it with limits.
    Like the Greeks, they create institutions to curb the accumulation of resources
    and power—from reprimanding successful hunters to sharing and consuming all bounty,
    without allowing themselves to accumulate.$47}$ Though I may risk overdrawing
    parallels, they also share an animistic view of the universe. In Greek myth, nature
    is humanized: gods copulate with humans, and the like. In older traditional societies,
    there is no boundary between the human and the nonhuman, a point that we have
    realized only recently in our theories about the Anthropocene and the end of nature.
    Interestingly, the Greeks, nature is humanized: gods copulate with humans, and
    the like.


    ## DEATH AND LIMITS


    Death, of course, is the ultimate limit, and it is not farfetched to think that
    the human fear of limits has to do with dying. Unlike religious societies, the
    Greeks did not have the capacity to exorcise.$48. For the Greeks, Castoriadis
    writes, “the fundamental thing is mortality—the mortals are humans: that is what
    human is.” The Greeks made sense of life and death through rituals, which were
    called *telos* (completion, or end).


    Like many people today, the Greeks did not believe in a happy afterlife. In Hades,
    the underworld of the dead, even heroes were reduced to miserable shadows.51 Hades
    represented the nothingness of death. But having accepted the ultimate limit of
    death, and thus been liberated from the desire to transgress a limit that cannot
    be transgressed, the Greeks were able to accept that it is what we are making
    our lives. We do not have to search for it in the gods or afterlife. Heroes in
    Homer know are going to die if they act in a particular way, but act what they
    do, choosing the conditions of their own death, which is paradoxically an ultimate
    act of freedom and the construction of meaning—including the meaning of their
    own death.52

