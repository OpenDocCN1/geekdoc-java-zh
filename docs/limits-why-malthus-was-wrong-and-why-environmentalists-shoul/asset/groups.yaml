    to basic goods—feed one another to day. The enclosure of the commons makes us
    depend more on wage work, while our position in the social hierarchy is signaled
    by our ability to buy goods. This is not just a matter of inflated, unreal, or
    conspicuous wants, which is no big deal if they are not met. That is, consuming
