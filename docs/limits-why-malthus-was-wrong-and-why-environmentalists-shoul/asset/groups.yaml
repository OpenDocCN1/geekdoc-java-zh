    ## 环保主义的边界


    艾玛·戈尔曼（Emma Goldman）是19世纪末到20世纪初在美国盛行的无无政府主义亚文化的雄辩的辩护者。她捍卫女性平等、自由恋爱、工人权利和免费普及教育。戈尔曼自称为“新马尔图斯主义者”，因为她主张避孕，而这在当时被错误地与马尔图斯联系在一起。但戈尔曼的生活和思想与马尔图斯是对立面。她在18岁时结婚，但两年后离开了丈夫。她因“煽动暴乱”、传播关于避孕的材料被捕，并在1917年因反对征兵运动而入狱，服刑两年后被驱逐到俄罗斯。对布尔什维克感到失望后，她在1923年离开了俄罗斯。“如果我不能跳，我就不想参与你们的革命，”这是她的格言。


    ## 浪漫主义者对马尔图斯


    戈尔曼将避孕运动描述为


    - 旨在将女性从强制怀孕的可怕枷锁和束缚中解放出来；

    - 一个要求每个孩子都能健康出生运动；一个帮助劳动从其永恒依赖中解放出来的运动；一个向世界开启一种新型母性的运动。


    对于戈尔曼来说，对避孕的斗争是“未来革命中许多核心原因之一”。人口控制也是如此，尤其是资本主义离不开军事主义，由于大众提供了在战壕中被毁的物质，资本主义必须拥有庞大的人口……在任何情况下，劳动边缘都不应减少……因此政治经济学家以及资本主义制度的所有赞助者都被削弱了


    这里的限制并非源于我们的欲望与世界冲突的自然属性。不是我们的本性，而是系统让我们无限制欲望。为了从这个系统中解放出来并避免其后果，戈尔曼建议我们必须限制滋养它的欲望。


    戈尔曼对贫困和自然的观点也与马尔图斯非常不同。贫困并非源于事性或身体的欲望，而是源于分配自然财富的社会安排。在戈尔曼看来，自然是丰富的，是快乐的源泉而非痛苦。她将她的杂志命名为大地，“人类的滋养者……自由且不受阻地接触地球⁶她在一个春晨在惊叹“生命在大地的子宫萌发”时想出了这个标题⁷


    戈尔曼和无政府主义女性呼应了浪漫主义运动的主题。作为马尔图斯的同代人，浪漫主义者是他最严厉的批评者之一⁸正如梅休（Mayhew）所说，在威廉·华兹沃斯（William
    Wordsworth）的《在廷特修道院附近的几行》（该诗与马尔图斯的《论》同年出版），“自然是慷慨而非狭隘的，并避免地向上其创造者，而不是走向痛苦和贫困。那些沉溺于自私计算的人，恰恰是创造了这样一个世界：慈善被削弱，社会纽带被破坏，城市基础设施繁荣，而贫困侵扰着乡村。”⁹在浪漫诗歌中，谦卑和对简单快乐的享受是对丰富的反应，是对克鲁索式追求优化财富的狂热追求。正如华兹沃斯关于自愿限制所写的那样：修女不抱怨她们修道院的房间；

