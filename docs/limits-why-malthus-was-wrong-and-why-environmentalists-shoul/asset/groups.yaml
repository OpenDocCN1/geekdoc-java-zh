    # POPULATION AND SCARCITY: THERE WILL NEVER BE ENOUGH


    The core of Malthus''s argument is “the principle of population,” the title of
    his Essay. Put simply, the principle is that our ability to produce children will
    always outstrip our ability to provide for their survival. Humans, Malthus argues,
    have two basic needs: food and sex. The power of reproduction is “indefinitely
    greater” than the power of production.14


    From the humans that need to eat and provide for them, Malthus concludes that
    it is not, and will never be, “enough for all to have a decent share.”15 There
    are always a scarcity of food in relation to people. This, I claim, is the second—and
    unmarked—principle of Malthus''s Essay: the principle of scarcity. The principle
    of scarcity follows directly from the first principle of population: if the number
    of people is always greater than the amount of food they can produce, then there
    is a scarcity of food—scarcity now, and, everywhere. Nature’s bounty is scarce
    because our reproductive potential is limitless. Malthus conceives of a world
    that is naturally limited because the needs of our bodies are unlimited. Here
    is a conception of nature that lies at the heart of modern economics and, to an
    extent, environmentalism.


    Poverty is a manifestation of scarcity, Malthus then explains. The poor are the
    excess for which no share is left, and they flock to the parishes for aid. Malthus
    believes that thanks to mathematical logic and unquestionable first principles
    he has proven the necessity of poverty. Poverty, Malthus argues, follows naturally
    from libido and hunger. This is a natural law. Revolutionary ambitions to eradicate
    poverty go against science.


    Nature, for Malthus, is provident and checks our numbers within the limits of
    food. Any species left to reproduce unchecked would soon fill the earth with its
    members. The fact that this hasn’t happened demonstrates that something is checking
    population numbers below their potential—predators, disease, or lack of food.
    Humans have freed themselves of predators, but their numbers are being checked
    nonetheless. Malthus calls “positive checks” those that repress an increase of
    population already underway. Hunger and famine, infanticide and premature death,
    war and disease: whatever reduces how long people live is a positive check. “Preventive
    checks,” in contrast, are those where reason intervenes to reduce the number of
    offspring in advance. But they are no better than positive checks. Those who practice
    sexual abstinence suffer too, he wrote, speaking from firsthand experience, for
    he was celibate until the age of thirty-eight, when he married. And those who
    have sex without having children are victims of a vice that degrades their morals
    and causes sexually disease. There will never be paradise on earth, Malthus concluded
    against socialists like Godwin. Population checks are inevitable and involve terrible
