    necessary, I insist, to find a way to defend collective limits, without accepting
    unjust ones.


    The role of the environmental movement in keeping alive this plea for limits has
    been vital. Environmentalism has flirted with Malthusianism and has reproduced
    Malthus''s vision of a limited world. But the environmentalism I espouse here
    is emphatically not Malthusian. It is not the environmentalism of those who revel
    in predicting disasters, telling us that the earth is shrinking, but of those
    who desire and struggle for limits. It is the environmentalism of people who do
    not want to step off the boat or escape to Mars⁵ Of people who have the wisdom
    to love and care for the planet they live in, embracing its limits and the limits
    of their own lives, not fleeing from them, leaving behind ruin. Spiritual leaders
    such as the pope are adding their voices to this call for limits; this is a reason
    for hope⁶ So are the multiple movements and peoples defending the commons or setting
    up new commons by the arduous process of negotiating and defining collective limits⁷


    Malthus was wrong. Our wants are not unlimited, and unlimited wants are not ours.
    Our ability to reason and reflect on and respond to what it is we desire is essential
    to our humanity. We liberate ourselves by controlling those instincts that would
    enslave us or threaten to destroy us. Like women and men who mature in life when,
    coming to terms with their own limits, they find their true desires, civilization
    will truly progress when we come to know and respect our limits. Now more than
    ever, to progress may mean to stop, think, and act differently. Let us use human
    intelligence, imagination, and wonder to help us find our limits, rather than
    burying our brains in bunkers.


