    衡量效用以测试它是否真的与价格相关。如果价格是了解我们认为某物有多有用的唯一途径，那么声称效用体现在价格中就是一种同义反复。


    尽管这些假设可能不切实际，但稀缺的故事与真实的匮乏体验产生了共鸣，这种理论有助于证明这种匮乏，即便它并未产生匮乏。分析经济学随着工业革命和资本主义而出现。稀缺的概念出现在一个前所未有的社会流动和财富增长的背景下。16
    宗教被重塑，封建贵族势力削弱。欲望和物质期待从习俗、阶级和宗教的限制中解放出来。新的资产阶级获得了想要想要一切的合法性，而其他人则向往过资产阶级式的生活。由消费所信号的地位取代了阶级固定的社会位置，特别是在匿名的城市中。这种个人匮乏的心理体验——没有像邻居那样富有，或者没有报纸上读到的那么多东西——是非常真实的。但这种基于比较的社会匮乏只是硬币的一面；另一面是非常真实的物质贫困体验，圈地运动剥夺了农民的财产，将他们赶进工厂，或者如果不去工厂，就去救济站或收容所。17


    这两种稀缺体验——地位不平等和对基本商品获取的不稳定性——在今天相互影响。公地圈地使我们更依赖工资劳动，而我们在社会阶层中的地位由我们购买商品的能力来信号。这不仅仅是通胀的、现实的或虚荣欲望的问题（如果这些欲望没有得到满足也没什么大不了）。也就是说，接近社会平均水平消费并不是为了炫耀，而是为了自尊，为了符合同龄人认为的体面生活的标准。对有限的地位性商品的竞争增加了这些商品的价格，并将资源从公共或或共有商品转向私有商品，侵蚀了前者，使得更多商品可以通过钱获得。这就是贫困如何在富裕中被再生产的。18


    在资本主义下，不断增加的财富无法消除贫困或稀缺体验。人们在与阶梯上位置更高的人相比时，总会体验到个人的局限；系统无限扩张的承诺维持着他们的希望：明天他们将拥有更多，更接近今天富有人的所有物。今天穷人的医疗治疗比马尔萨斯时代的贵族治疗要好得多，但我们经历着一种真实的稀缺感——我们无钱为亲人治疗可治愈的致命疾病买单，而富人可以。不平等滋生了稀缺。


    公平地共享公地可以缓解这种稀缺，因为人们将获得生存所需的最低资源，而且由于拥有相同的公地，他们与他人的比较会减少。但马尔萨斯的《人口论》以及随后的大部分经济理论在理论化稀缺体验时，其方式预示了积累和增长，拒绝了共享和平等。


    从表面上看，马尔萨斯的局限世界与现代经济学无限自由和扩张的世界似乎完全不同。正如我所论证的，马尔萨斯的世界是一个奇特的局限世界——它是一个以整体无限扩张的名义主要影响穷人的局限世界。这与今天支持紧缩政策的人所说的“我们不能生活在能力范围之外”叙述没有区别。（当他们说“我们”时，指的是“你们”。）在马尔萨斯看来，穷人不应该被帮助生活超出他们有限的食物份额。通过这种方式，我们将他们无限的驱动限制在他们的产出范围内，并努力工作生产更多。同样，对于当代经济紧缩的提倡者来说，穷人不应该通过福利获得帮助，因为他们的消费将超过他们的生产，并（消费）更多。生态学家批评新古典经济学家的“空世界”观点，没有资源限制。但悖论的是，自从马尔萨斯以来，经济学家的就是一个充实的世界，如此充实以至于永远没有穷人的空间。船可以一直变大，但它永远是满的。


    剩下的问题是：为什么经济学家要把马尔萨斯归为该学科的史前？


    我怀疑是因为马尔萨斯充当了一个完美的、关于过去与之后的靶子。马尔萨斯的粮食短缺和饥荒世界应该是资本主义富足世界的过去，一个如果我们松开油门就可以回去的过去。保罗·克鲁格曼说：“只有通过工业革命，我们终于逃离了[马尔萨斯]陷阱（如果我们确实的话——据我们所知，35世纪的历史学家将将800年至2020年左右这段视为暂时的异常）。”19
    经济学甚至有一个领域称为“统一增长理论”，专门研究从所谓的马尔萨斯陷阱到持续增长的转型。20 在这类文献中，资本主义之前的几百年人类历史中没有增长的文明被视为陷入了“马尔萨斯陷阱”，是“马尔萨斯式停滞”的受害者。


    这些术语暗示了一个不理想的状态，那些经历过它的人会想要逃离。然而，没有任何历史证据表明之前的文明认为自己陷入了停滞。例如，在普鲁塔克或昔西底德的作品的作品中，人们发现一个拥有哲学、民主和阳光（偶尔有流血）的古希腊世界。没有对停滞、早死或低寿命预期的抱怨。后这些是现代的焦虑（尽管当然，妇女和奴隶的故事与普鲁塔克或昔西底德所讲述的有所不同）。无限扩张——生命、经济等方面的扩张——似乎是资本主义的核心追求，并构成了现代西方文明的特殊想象力。从经济学的角度来看，稳态只能被理解为停滞，一种必须被克服的状态。


    我一直强调，马尔萨斯既不是先驱也不是例外，而是现代经济学的基石。经济学目前的权力解释了其持续的影响力。


    ## 马尔萨斯环境主义的局限


    现代美国环境主义诞生于20世纪60年代。亚洲或非洲饥荒的阴影演变为大国之间的核对抗，引发了对“人口爆炸”的恐惧，人口成为政治家和公众关注的核心问题。人口正以指数级增长，全球人口也在以指数级增长。23


    这些“新马尔萨斯主义者”保留了局限世界与指数增长冲突的想法。与马尔萨斯不同，加雷特·哈丁和保罗·埃里克——两个学术生态学家，他们认为人口无法长期以几何级增长，因为灾难性的检查会制约它——家喻户晓。然而，与马尔萨斯不同，他们将稀缺归因于资源和土地的性质而非人性（他们认为人性是可以改变的）。与马尔萨斯不同，新马尔萨斯主义者主张通过国家进行人口控制或强制限制。反对新马尔萨斯主义者，经济学家引用了另一个马尔萨斯的故事，即粮食产量的增长。经济学家和新马尔萨斯主义者共同玩着《论》硬币的两面：在局限的世界中无限增长。最终，经济学家赢得了胜利，因为70年代由化石燃料驱动的绿色革命以及西方和中国生育率的下降缓解了对人口的担忧。（全球人口仍在增长，但速度在放缓）。


    环境主义者想要限制增长，因为增长破坏环境。但他们最终论证，除非保护环境，否则增长将结束，这导致著名的经济学家罗伯特·索洛开玩笑说，环境主义者比他们自己认为的更支持增长。1972年，罗马俱乐部委托了一项研究，随后作为《增长的极限》（Limits
    to Growth）出版，这是由多内拉·梅多斯和麻理工学院的年轻研究人员写的开创性报告。25 报告的模拟背后继承了马尔萨斯的遗产，经济取代了人口，资源取代了那种食物。梅多斯及其合作者认为，经济增长速度不能超过资源提取速度。资源是有限的，早晚经济将会崩溃，受到其可用性的制约。然而，与马尔萨斯不同，MIT团队认为我们可以在资源的界限内限制自己，并将崩溃转变为平稳着陆，维持最高可能水平的稳定人口和消费（基本上通过转向可再生资源、回收以及以低速率使用有限资源）。


