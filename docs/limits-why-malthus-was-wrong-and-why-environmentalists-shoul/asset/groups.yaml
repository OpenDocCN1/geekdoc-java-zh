    # INTRODUCTION: WHY LIMITS?


    "Know no limits.” “All limits are self-imposed.” “You are your only limit.” “With
    hard work there are no limits.” “The only limits that exist are the ones in your
    mind.” “Don’t tell me the sky is the limit when there are footprints on the moon."


    These are few of the maxims one finds in an internet search on the word “limits.”
    Western culture is infatuated with the dream of overcoming limits. At the same
    time, we are overwhelmed by the ultimate limit, that of our own death, “punishing
    drought,” as the death of Western civilization. The New York Times tells us, has
    forced the state to reconsider when its engine of growth “has run against the
    limits of nature.”¹ “Civilization is at stake if we do not act now” and global
    warming to 1.5 degrees Celsius, warns the United Nations.²


    And why have the idea of limits to think about the limits we do? What role has
    limits played in the development of modern thought, from economics to environmentalism?
    Do societies need limits? And if we do, what kinds of limits? These are some of
    the questions entertained in this book.


    In the following pages, I aim to reclaim, refine, and define the notion of limits.
    I want to dissociate limits from what in scholarly jargon we call Malthusianism—a
    set of ideas dating back to 1798 and an essay written by the cleric-tuned economist
    Thomas Robert Malthus that has come to shape the ways we think about limits. With
    this book, I hope to make those who invoke limits consider how to do so; I also
    hope to make the critics of limits think before branding those of us for limits
    as Malthusians.


    I would like to begin with an image from the movie The Legend of 1900 by Giuseppe
    Tornatore.³ The movie’s protagonist, 1900, was named for the year he was born;
    the newborn baby had been found on New Year’s Day in a box by an engine room mechanic
    on an ocean liner. Played by Tim Roth, 1900 never leaves the boat, where he develops
    a gift for piano playing. Famous jazz pianists come to the ship to duel, and he
    beats them all. When


    a music producer asks him to record an album, 1900, who has fallen in love with
    a passenger, decides to leave the ship. In a memorable scene, he is halfway down
    the ladder and the crew is saluting goodbye. He stares at the city in front of
    him and balks. Turning around, he looks back to the top of the ladder and decides
    to remain forever aboard.


    Many years later, 1900 hides in the ship’s hold and his friend Max begs him to
    leave, as the ship will be scuttled and sunk. 1900 responds: “All that city...
    You just couldn''t see an end to it . . It wasn’t what I saw that stopped me,
    Max. It was what I didn’t see. . . . In all sprawling city, there was everything
    except an end.” Drawing an analogy to his beloved instrument, 1900 adds:


    - The keys begin, the keys. You know there are 88 of them . . . They are not infinite,
    we are infinite. On those 88 keys the music that you can be infinite . . . But
    you get me up on gangway and roll out a keyboard with millions of keys, and .
    . there’s no end to that, that keyboard is infinite. But if that keyboard is infinite
    there is no music you can play.


    Times are hard for those who want to live within limits. Airplanes have replaced
    ocean liners, and 1900 sinks together with the boat. The limit of death is the
    stuff of Greek tragedy, not Hollywood blockbusters—1900 sank in the box office
    as well. But to face global warming, we desperately need a culture of limits.⁴
    This book is an effort to go in such a direction.


    # WHY LIMITS?


    I am an environmentalist and limits are the central idea of environmentalism.
    “Limits are back⁵ planetary boundaries, secular stagnation, postgrowth, longterm⁶
    For one historian of the green movement, Andrew Dobson, “it seems like Groundhog
    day.”⁷ As in the 1970s, he claims, Malthusian environmentalists prophes that we
    are doomed; and eternal optimists, like Reagan, back in the day, respond that
    “there are no limits human intelligence, imagination, and wonder.⁸


    Born in 1972, the same year that Limits to Growth report was published, I find
    that the debate between supposed optimists and pessimists has been exhausted.
    These opposing views are two sides of the same coin. Without limits, capitalism’s
    quest for endless growth does not make sense. Malthus and other priests of capitalism
    constructed a picture whereby unlimited wants clash with a limited world. Scarcity
    and growth became an inseparable pair, with limits spurring growth. My thesis
    is that it is only when we begin to accept the world as abundant that we can contemplate
    limiting our wants and delimiting a safe space for freedom. This notion may appear
    counterintuitive, but that''s because we tend to think of limits in Malthusian
    terms. This book develops a different view of limits, one of self-limitation—the
    establishment of self-imposed and deliberately chosen limits—distinct from the
    Malthusian limits we attribute to our internal or external world, which we must
    either overcome or succumb to. Beginning with a rereading of Malthus'' 1798 Essay
    on the Principle of Population, I argue that Malthus discovered not natural limits
    but unlimited wants. Far from a prophet of doom, Malthus invoked doom so as to
    galvanize the pursuit of growth. We will see how Malthus is still with us thanks
    to modern economics, which was founded on this myth of eternal scarcity and a
    call for perpetual growth. I will explain how environmentalists got trapped in
    this Malthusian vision of a limited and scarce world and why this is problematic.
    And I will make a case for self-limitation. I will then turn to classical Greece
    as a civilization with a culture of self-limitation. There, and in the next chapter,
    where I deal with the limits of my own defense of limits, I will follow the novelist''s
    advice to write less about what I know and what interests me and what I want to
    know more.9 I will close the book, more assertively, unapologetically defending
    the desire for limits.


    In my first job, at the European Parliament, I worked on the revision of the EU
    laws that placed limits on water pollution. I witnessed firsthand the chemical
    lobby’s assault on environmental regulation fueled by economic discourse that
    denied the need for limits. Returning to graduate school, I studied ecological
    economics and learned about limits to growth.10 Working at the University of California,
    Berkeley, with economist Dick Norgaard, I came to appreciate how difficult it
    is to define ecological limits, as limits are always a function of our intentions.
    As Dick wrote, limits are not something out there but about limiting our negative
