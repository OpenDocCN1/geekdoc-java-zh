    Malthus''s world is still used. It is a limited, a world of scarcity, where unlimited
    human wants an environment that could never be on par with their unlimitedness.
    Today, “the commonly accepted basis of our economy is the supplied possibility
    of limitless growth, limitless wants, limitless wealth, limitless natural resources,
    limitless energy, and limitless debt . . All are entitled to pursue whatever they
    conceive as desirable.”47


    Malthus came up with this world of limitless expansion precisely as capitalism
    spurred the production of goods at a scale and rate never before seen. He justified
    why the riches could never be shared equally among everyone and why they will
    never be enough. The genius of his idea was that he managed to make scarcity compatible
    with growth, limits with no limits. In doing so, he managed on the one hand to
    argue that there is not enough for everyone and we have to produce more; and on
    the other, to maintain that if we produce more, there will still not be enough
    for everyone! On planet Malthus, “man cannot live in the midst of plenty.”48 A
    steady or declining population can only be the result of infinite suffering, of
    misery and vice. In Malthus’s scheme there can be nothing abundant about a steady
    state of affairs.


    Malthus therefore did not discover resource limits. He invented the unlimited—and
    not to be—subjects of modern economics, those with an instinct and a call to work
    and subdue and populate the earth. For the “homo economicus” that knows no limits,
    the world is limited by definition. These people can never have everything that
    they want. And there will never be enough for all of them. Unlike the abundant
    world'
