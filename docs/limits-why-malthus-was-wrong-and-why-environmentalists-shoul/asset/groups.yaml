    One might then have sympathy than Castoriadis did for religion, tradition, and
    the doctrines and rituals reminiscent of parents that human communities have devised
    to pass limits from one generation to the next. True, these can become heteronomous
    forces by bygone eras, as he argued; but they can also function as a repository
    of ecological wisdom and awareness of limits,19 codifying and preserving limitations.
    What is more effective for conserving a forest than declaring it sacred?


    Castoriadis recognizes that religion remains “humans of their limits” and that
    “we are not the master of the world”; it personifies and gives a name to the abyss
    of death, to something beyond them called taboo, totem, Amon-Ra, Olympian gods
    ... or Jehova.”20 He insists, that in our times we “must simultaneously mark that
    human limitation and ... that it is we who creating at our own risk (including
    in the form of religion).”21 Rather than “invent” a heteronomy to ensure the endurance
    of limits, Castoriadis thinks would constantly call limits into question; that
    is, we should not be afraid to risk hubs. By questioning limits, we can decide
    to dismantle or transgress them, and this is the price we must pay for our freedom.


    Even Castoriadis’s beloved Athenians paid this price, eventually subscribing to
    hubs. Unable to limit their imperial adventures, Athenians saw their entire seafaring
    force destroyed in the disastrous expedition to Sicily during the Peloponnesian
    War. The Athenians limited the accumulation of power within the polis but not
    their polis’s power abroad. More troubling for my argument, I confess, the imperial
    overreach of Athens may be a corollary of its democracy: internal limitations
    were sustained and subsidized by an external, ultimately self-destructive, expansion.^22


    Today the global character of capitalism presents a considerable barrier to politics
    that we want to set, and live within, their own limits. First, there is a conflict
    between political borders and borderless capitalism: set your own limits to money
    as a city, region, or country, and money will flow elsewhere, while you will be
    left sorting out the ruins than living within carefully crafted limits. Second,
    geopolitical competition among nations leads to arms or economic races, similar
    to those of the Greek times.'
