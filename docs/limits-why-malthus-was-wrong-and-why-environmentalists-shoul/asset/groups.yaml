    had little to do with aspiring to a different, better way of life. It was rather
    an adaptation to external limits, limits imposed by the nature of things with
    which ours clashed. The drive for change was not desired, but survival in the
    face of looming collapse.


    This Malthusian framing was grist for the mill of economists. Robert Solow, from
    MIT, led the charge with a fiery speech after the publication of Limits to Growth.26
    How fast can we extract resources or, given limits, how much out we extract from
    a given amount of resources is a matter of technology. Not only are there sufficient
    resources, Solow argued, but even if these were to be depleted, their prices would
    rise and we would develop new technologies that use fewer resources or recur to
    other resources that are not yet limited (through so-called substitution). If
    food production allowed population growth in Malthus''s model, technology could
    allow economic growth in Solow''s.


    In his response and subsequent research, Solow moved the ecological question squarely
    into the domain of economics, a natural fit given the Malthusian framing. The
    problem was posed as one of relative rates of resource extraction and technological
    change. If natural resources are finite, as the Limits argued then, Solow responded,
    even negative growth—basically, anything above zero use of resources—would eventually
    deplete these and bring production to an end. The question became how to allocate
    limited resources over time to sustain the maximum aggregate number of person-years.
    This is essentially a question of an optimal allocation of scarce resources between
    generations. And how to allocate scarce resources optimally is what economics
    is all about.


    Crucially, economists after Robbins had developed the idea that it was not only
    natural resources that are scarce also capital, labor, and time.


    From this perspective it might be better to leave future generations with fewer
    forests or more polluted oceans if such were the cost for passing on more technological
    capital with which to do more things. Framing the question as one between, say,
    using less or more forest the matter from ecological limits to an issue of allocation
    and one of efficiency in prolonging the highest level of satisfaction of wants
    for the maximum population possible. If by cutting trees today we will be better
    off economically tomorrow, so be it.


    Elsewhere I have given my own opinion on whether technology can keep up with resource
    depletion or whether capital can substitute for nature.27 Compound geometric growth
    tends to infinity, and as Malthus first noted, it logically must be checked. What
    will it check, or how soon is it clear. A collapse, moreover, may be followed
