    # THE IDEOLOGICAL WORK OF MALTHUS’S ESSAY


    In the decades before Malthus wrote his Essay, England experienced depopulation.40
    According to Silvia Federici, depopulation was the outcome not only of epidemics,
    wars, and disease but also of women silently asserting control over their own
    bodies and resisting men and the church.41 Low population growth placed a limit
    on early capitalism, keeping the costs of labor high. As Federici''s work documents
    countless women natalist state policies and the witch hunt unleashed part of a
    misogynist counteroffensive by the church and elites. Malthus was not alone in
    his advocacy of population growth. Prominent theologian William Paley,'
