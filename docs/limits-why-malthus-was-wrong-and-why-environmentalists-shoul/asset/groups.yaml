    # 5


    # THE LIMITS OF LIMITS


    Until now, I have been arguing for limits as part of a desire for freedom, justice,
    and sustainability. In this chapter I follow some loose threads in my argument
    that allow me to examine the limits of my own case for limits. I will be more
    declarative here than in previous chapters, and I would ask that readers treat
    my declarations as provocations rather than certainties. The sections that follow
    are tentative answers to questions that I have faced while defending my case for
    limits.


    LIMITS ON WHOM?

    I had much to say about limits that we can put upon ourselves, as did 1900. But
    I said less about the limits that one group imposes on another. Like Malthus,
    those with power single out a weaker group to limit in the name of the common
    good—be it the group, the foreigners, those of supposedly different skin color,
    or the immigrants. Such claims for limiting the Other go hand in power and control,
    if not violence, exercised by the limiters. In other cases, it is the weak and
    marginalized who draw limits to stop others from encroaching on their space; think
    of a community that prevents a multinational corporation from logging its sacred
    forest. Violence here is often committed not in the name of limits but by proponents
    of limitless expansion against those who defend limits.¹


    How can we distinguish reasonable and unreasonable claims to limits? One approach
    might be to focus on justice and power. Do claims limits come from a position
    of power or not? Limits that protect a particular interest against the common
    good are problematic. Are those who call for limits also willing to limit themselves
    in accordance with the limits they espouse?


    But different groups may have different views of what constitutes the common good
    and who is included in it, of what is just, or who is less or more powerful. Is
    an indigenous group that wants to protect a sacred grove'
  - '[PAGE 66]


    within national boundaries engaging in NIMBYism or a common-good fight? And if
    it is a common-good fight, what about the fights of those who dislike protected
    areas or rules that protect endangered species, and see themselves in confrontation
    with an all too powerful government? Furthermore, even limits “we” set on ourselves
    may still involve oppressing a minority among “us” who do not want these limits.
    There is no easy way out here; practices and discourses around limits are problematic.
    But this is not a reason for shying away from them.


    # LIMITS TO WHAT?


    Another problem with my account is that I have not specified what precise limits
    I have in mind. Liberal democracies already have laws and limits. Do I want limits
    to everything? Limits to good things like clean energy or education, too? If not,
    then limits to what?


    Indeed, I have made a general case for a culture of prudence—a culture that is
    reflexively inclined toward limit than limitlessness. One area where precaution
    is necessary is technology. We cannot cease to pursue knowledge, but we can no
    longer pretend that the limitless pursuit of technology is problematic. Ours is
    the first predominantly secular society that will have to devise institutions
    to limit the directions that knowledge without limiting knowledge itself. How
    will we be able to achieve this is hard to say, but recognizing that we have to
    is a crucial step.


    What we will also have to limit, in the vein of the ancient Greeks or egalitarian
    societies, is the limitless accumulation of money and power. Accumulation—economic
    growth—without limit, itself linked to the pursuit of power, what threatens us
    with ecological self-destruction. The Greeks had no inkling of the kind of destructive
    power of money. In Solon’s time, it is the accumulation of money in the hands
    of the few, who lend at interest to the many, that drives inequalities and civil
    division. Internal inequality in spurs external expansion (the very growth that
    Malthus advocated), and ultimately ecological breakdown.


    Many radical proposals for economic reform today can be read as attempts to limit
    the accumulation and reach of money: proposals to establish a maximum wage, to
    tax high income, wealth, and inheritances.³'
  - '[PAGE 67]


    control how much private banks can lend,4 to constrain the scope of general purpose
    money,5 to reduce working hours,6 or to limit the private money that goes to lobbying
    or political campaigns. Slowing down the growth of money, and constraining its
    domain, will slow down resource use and pollution. In addition, we may want to
    bring back enforceable limits to pollution, like carbon emissions, and to the
    extraction or use of damaging resources like fossil fuels. Limiting, or rather
    reshaping, material wants will be part and also of such change.


    Also require more profound democracy to restrict the accumulation of power: shorter
    terms and more rotation of offices, more elections by lottery (similar to jury
    selection), direct participation by all citizens. A corollary to these reforms
    is the idea of a guaranteed income or a free bundle of public services,7 because
    as the Athenians realized, effective participation requires time and economic
    freedom.


    I will end my list of proposals here,8 lest you think me mad; yet seeing such
    proposals as madness is surely an indictment of our dire position, where even
    imagining limits appears outlandish.


    # POLITICS OF SELF-LIMITATION


    Granted, given the current state of our politics, the above changes seem utopian.
    The lack of a viable path to implementation might be seen as a drawback to my
    case for limits. But the truth or ethical value of an argument does not rest on
    whether it is politically correct or viable. Political changes are a matter of
    will and contingency. We will never know if a culture of limits and its institutions
    are possible if we begin with the premise that we are not.


    Things off-limits for previous societies are today allowed in ours, and vice versa.
    We limit behaviors that are or were acceptable to other civilizations, from rape
    and domestic violence to driving excessively fast and smoking in public spaces.
    When we look back at history we see structural change, but we cannot see change
    as it happens. The Greeks did not plan a culture of limits, but they got one.
    Their culture and institutions resulted from coevolutionary changes—cosmological,
    philosophical, ethical, political, and technical—in the context of a material
    substratum (the invention of money). If our substratum is an unraveling'
  - '[PAGE 68]


    ecology and climatic breakdown, we should expect new ways of understanding to
    emerge and coevolve with new practices. Incipient philosophies of “limitarianism,”9
    or Pope Francis’s *Laudato si*, a strong spiritual plea for limits,10 are evidence
    that something might befoot in the realm of ideas. Coevolution in the direction
    of self-limitation would involve political battles and the institutionalization
    of new limits, new philosophical and scientific concepts, new artistic and cultural
    forms, new ways of thinking, being, and desiring, and new rituals of coming together.
    But who would push for this?


    There may be a sizable number of people who see the wisdom of simple living.11
    A common sense of limits and sufficiency is widespread; it is found in religious
    and spiritual teachings, even if it is marginalized in today’s prevalent way of
    life.12 Partly this is because living within limits collides with the imperative
    of the current system to expand. Legal interventions, for example have curtailed
    people’s ability to limit the number of hours they work, and advertising makes
    sure that people do not limit how much they consume.13 Those who downshift social
    marginalization and being moved about those who accumulate limitless power in
    a society where money rules. As these reasons suggest, self-limitation cannot
    be a project of individual or small-group change; it must have a universal, political
    ambition to change the structures that prevent people from living within limits.


    A project of self-limitation would be impossible without the working class and
    all who live within limits that are not of their own choosing. But for those who
    suffer every day under the limits of the existing system and are on the receiving
    side of patronizing Malthusian or austerity discourses, it is hard to mobilize
    the name of limits, much less understand why others in better circumstances may
    opt to live within limits. As Emma Goldman saw, to escape its entrapment, the
    working class must master those that fuel the system of exploitation, not insist
    that they should be satisfied. Limiting oneself so as be liberated from oppression
    is different from accepting limits. How, or whether, Greens and others who advocate
    limits can create coalitions in the working class (that are not coalitions for
    continued, greener growth) can be answered not in the'
