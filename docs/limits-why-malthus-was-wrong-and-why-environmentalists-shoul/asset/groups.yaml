    ## THE DISPROSESSED, OR USING SCIENCE FICTION TO THINK ABOUT LIMITS


    The best way I have found to ponder questions of limits, their institution, and
    their transgression is through Ursula Le Guin''s science novel The Dispossessed,25,
    which I will use to illustrate some issues touched here.


    The book’s protagonist, Shevek, is a physicist in pursuit of a unified theory
    of time. His planet, Anrarres, was colonized generations ago by anarchists who
    fled capitalist Urras, and Shevek is the first to cross the planets'' border in
    order to undertake a reverse trip. Anrarres is a society of limits. The planet
    is small, dry, and barren, but revolutionaries there to find a colony of freedom.
    The civilization they constructed is a scaled-up, technologically more advanced
    version of the egalitarian hunter-gatherer societies that Le Guin, daughter of
    the first professor of anthropology at Berkeley, Alfred Kroeber, was familiar
    with growing up. The Anarresti lived abundantly amid what to us would seem scarcity,
    by sharing the little that they had.26 No one was allowed to die of hunger while
    another had enough to eat. The founders of the colony had an ethos of sharing,
    self-limitation, and democratic self-organization. This ethos, personified in
    the teachings of the semisimymical female leader of the revolution, was passed
    from generation to generation through education and rituals. Young Anarretti learned
    to want and govern themselves without police. And like the Spartans, they kept
    themselves out of trouble with neighbors—not by developing a strong army but by
    refusing to have an army and conceding to Urras a substantial share of their wealth
    each year, in exchange for their peace. If the Urrati wanted the minerals, they
    could have them; the Anarretti could live modestly without them.


    Over time, shared norms and limits in Anresres had ossified into doctrine. The
    ugly side of self-governing without police was that the Anarretti kept a constant
    watch over each other, ostracizing anyone accused of selfishness and limiting
    their thought. The ethos of the founders was losing its original meaning and its
    enforcement became a shadow bureaucracy. Like the Spartans and many capitalist
    societies that kept the genie in the bottle, not because they wanted to live within
    limits but because elites were afraid that expansion could upset internal hierarchy,
    the Anarretti now risked becoming “a people without a history”27—a place where
    nothing much changes socially.


    Shevek believes in the ethos of his revolutionary ancestors, but his scientist''s
    quest for truth makes him challenge authority and limits that no longer make sense
    to him. Limits, in his view, are there to be questioned—that the spirit of his
    ancestors'' revolt. Despite the threats of his compatriots, Shevek insists on
    crossing the ultimate physical limit of the planet and traveling to Urras in search
    of his theory. He finds a society that like our capitalist present is materially
    rich but socially unequal and full of poor people. His arrival fuels a new revolt.
    Back in Anres his travel risks corrupting the planet''s libertarian ethic by bringing
    it into contact with a capitalist world of opulence for a few or, worse, triggering
    an authoritarian closure led by the new bureaucrats and a regression into an authoritarian
    society of imposed limits.


    Is Shevek traveling an example of hubris? Is it the equivalent of the Athenian
    expedition to Sicily or the Spartans’ war with Athens—the crossing of the limit
    from which there is no return? Le Guin’s book is about the consequences of hubris,
    but about the irresolvable drama of limits and their transgression. Inconclusive,
    the novel does not tell what happens to Anhares; it ends just before Shevek lands
    back home. I understand Le Guin to be suggesting that a project of autonomy inevitably
    involves the risky process of renewing an initial commitment. If a commitment
    to limits survives a temporary transgression, then it is worth it. Anything else
    would be a closing off, a regression to the heteronomy that, for example, the
    founders of Anhares rebelled against.


    With the passing of time and the need for stability, autonomy inevitably tilts
    towards heteronomy. Rather than viewing autonomy and heteronomy as polar opposites,
    one the good and the other bad, we might need to think in terms of a synthesis—not
    of an in-between state but rather of processes that sustain a creative tension,
    a contradiction.


    ## ADVENTURE AND LIMITS


    When I was nine years old I had a bicycle. I lived in Maroussi, a suburb of the
    outskirts of Athens’s center, an old rural town engulfed by the expanding metropolis.
    Parents back then were not scared as they are now, and my friends and I would
    roam free around the neighborhood, take our bicycles, and wander. One day my friends
    Dimitris and Michalis and I biked faster and further out from the neighborhood.
    Exhilarated by the new places we saw, we biked faster and faster. It seemed like
    a hazy dream. A few hours later we stopped. It was getting dark and we did not
    know where we were. We asked people for directions they laughed: we were miles
    away from home. We started biking back, lost in the streets of Athens’s periphery.
    We arrived home after midnight and found our parents on the brink of collapse,
    scared to the bones, relieved we were.


    Adventure begins when limits are crossed. In Le Guin’s novel it is the limit,
    literally the crossing of the physical limit, that signals Shevek’s adventure.
    Like Odysseus, Shevek completes his adventure with a return to home. If I have
    one reservation about 1900, it is that he says no to adventure. Why not go out
    for a few crazy nights in the city and come back to the ship later? I do not mean
    the facile critique that limits stifle fun, or that they are for those who enjoy
    hair shirts and sacrifice. 1900, from what we know, and until his psychoanalyst
    to tell us otherwise, did not think he was making a sacrifice; he thought to protect
    his freedom. Fun for him, even adventure, was associated with being inside the
    ship, not outside. But why, unlike Shevek, does 1900 refuse to transgress and
    risk his commitment? Does his refusal suggest he wasn''t in control of his own
    fears?


    Temporary transgression of a fixed frontier is not the same as capitalism’s imaginary
    of the permanent transgression of a constantly frontier. An adventure that is
    constant is no adventure. Odysseus needs Ithaca; his adventure would be pointless
    if he had to fight Cyclops and Sirens for the rest of his life. It is the temporary
    transgression in “limit experiences”—at the limit, experiences that presuppose
    the presence of a limit—that brings joy. Dionysian outbursts and feasts sense
    your normal life is sober.²⁸ The dream of a constant Dionysian delirium, a hidden
    desire that fuels our civilization, is not only self-destructive; it is not fun.


    ## ANTHROPOLOGY OF LIMITS


    Moderation then “is wisdom or balance, but deeply set in passion and contradiction.”⁹
    The Italian sociologist Franco Cassano, following Albert Camus, finds within an
    anthropology of limits in subjects from the global and European “South” who refuse
    a logic of calculation and benefit, embracing and surviving contradiction.³⁰ Moderation,
    Camus argued, is not the golden mean but by the ability to live with contradiction.


    The archetype of self-limitation is not a miser who counts how much he has spent
    and saved, a Mediterranean woman or man who, having liberated desire and embracing
    contradiction, leads a sober life punctuated by wasteful outbursts.³¹ Nikos Kazantzakis’s
    fictional hero Alexis Zorba, widely known as “Zorba the Greek,” comes to mind
    here as an unlikely model of moderation with his excessive outbursts of laughter
