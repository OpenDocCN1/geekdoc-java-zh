    I imagine it like this.

    Bob stood up and walked out of the office. “Young man,” his father sighed, “our
    conversation is not over.”


    “I am not young anymore,” Bob thought, as he sat later at his desk bending into
    his books and notes. Thirty-two years old, unmarried, living on the salary of
    a clergyman, Thomas Robert Malthus humiliated—living under his father’s roof,
    having to listen to the same wild ideas he grew up with. It was fine that Father
    liked Rousseau. Now, however, with the revolution knocking on their door in Ireland,
    how could he defend this joke, Godwin, who would turn England into France? France,
    which nine years after the revolution had “lapsed some thousand years—debased
    by such a fermentation of disgusting passions, of father, cruelty, malice, revenge,
    ambition, madness and folly, as would have disgraced the most savage nation in
    the most barbarous age.¹ Come to my parish, Father, to see “the greater number
    of starving miserable human beings than on any equal portion of ground through
    the habitable globe.³ Poor souls with their countless children! They don’t need
    charity, revolution, or Godwin’s utopias. They need to work.


    Bob took up his pen and began to write. “The following Essay owes its origin to
    a conversation with a friend.”


    # REREADING MALTHUS


    Published in 1798, An Essay on the Principle of Population, as It Affects the
    Future Improvement of Society with Remarks on the Speculations of Mr. Godwin,
    M. Condorcet, and Other Writers were an instant success. It brought wealth, fame,
    and a house of his own to its author, Thomas Robert Malthus. And it settled “the
    parameters of modern social discussion, bringing into one frame of reference .
    . . population, economics, resources and politics.”³


    Malthus wrote the Essay as a rebuttal of revolutionary aspirations, today he is
    mostly remembered as a prophet of doom, someone who in the words of the editors
    of The Economist predicted “a tragic trajectory” whereby the growth of human populations
    is bound to exceed the limited growth of food supply, resulting in suffering,
    hunger, and death.4 Malthus supposedly prophesied overpopulation—that is, that
    our population will grow to a number that cannot be sustained by the land—and
    resource limits and shortages, of food especially. Malthus, the story goes, was
    a pessim who predicted limits to growth at the precise moment when technology
    began to grow without limits. The adjective “Malthusian” is reserved for those
    who believe natural resources are limited and thus put a limit on growth and on
    our numbers.


    But not everyone agrees with this reading of Malthus and his Essay. Frank Elwood
    is an anthropologist who has studied Malthus in depth. He notes that “while there
    are self-styled neo-Malthusians and anti-Malthusians in the popular literature
    of the day, the debate tends to focus on the modern ecological situation rather
    than Malthus’s theory”5 (indeed, The Economist’s editorial was about global warming).
    Read the original Essay on its own terms, Elwood forgets the forget of the Malthusians
    and their critics. You will then find not “a dour writer, unremitting in the pessimism
    . . . [actually someone] quite lively, and generally upbeat regarding the future
    of human societies . . . [with a] healthy respect for the powers of technology.”6


    I came after Malthus while reading about the limits-to-growth debate. As did everyone,
    I came to think of him as someone concerned about overpopulation and resource
    limits. Reading the Essay again, however, and leaving behind what I thought I
    knew, I noticed that, paradoxically, Malthus equated happiness with population
    growth. “The happiness of a country,” Malthus writes, “depends upon the degree
    in which the yearly increase of food approaches to the yearly increase of an unrestricted
    population.”7 A happy nation for Malthus is one where population grows—the closer
    the growth is, the better. Countries with fast population are therefore not doing
    wrong, nor are they doomed. Malthus applauds European countries because, with
    their “industry,” they have managed to be more populous.8 And he does not want
    to see limits stopped either. He explicitly condemns “artificial and unnatural
    modes of checking population . . . for their tendency to remove a necessary stimulus
    to industry.”9

