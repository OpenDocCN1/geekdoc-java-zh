    # ECONOMICS: SCARCITY WITHOUT LIMITS


    Robinson Crusoe looked on his estate with pleasure. Years ago, the sea had washed
    him ashore on this island, and thank God he now lacked for nothing. Like a good
    Englishman, he had his own house with a fence, plenty of fruit to pick, iron tools
    for hunting or growing barley and rice, grapes for wine, goats for milk, a parrot
    to entertain him, and as of late, “Friday,” his servant-companion (who reminded
    him of the slaves of Africa he had lost in the shipwreck—might his estate in Brazil
    still make a return without them?).


    Is he, Robinson, content? Is it time to take it easy?

    No! Life is short, and the day has twenty-four hours. Should he listen to the
    parrot, or read the Bible? Plough the field, or teach Friday English and the Gospel?
    Make more spears in the cannibals come again? He can do so much in a single day.
    Maybe next month, after he finishes up with these spears and after Friday utters
    a bloody sentence in English, maybe then he will have some time to take a break.


