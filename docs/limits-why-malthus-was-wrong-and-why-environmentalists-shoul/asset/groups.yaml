    # POPULATION AND SCARCITY: THERE WILL NEVER BE ENOUGH


    The core of Malthus''s argument is “the principle of population,” the title of
    his Essay. Put simply, the principle is that our ability to produce children will
    always outstrip our ability to provide for their survival. Humans, Malthus argues,
    have two basic needs: food and sex. The power of reproduction is “indefinitely
    greater” than the power of production.14


