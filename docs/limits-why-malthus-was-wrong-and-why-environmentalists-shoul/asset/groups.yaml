    control, a physical necessity whose empires we are all slaves,” as William Hazlitt,
    a notable Romantic, wrote in a rebuttal of Malthus’s essay.¹11 Birth control was
    not a calculative practice for living within one’s means but a way to enjoy free
    love.


    Malthus’s frame is so ingrained in our minds that it seems paradoxical that we
    would limit ourselves if nature were bountiful. Shouldn''t we see that nature
    is scarce so as to conserve it? No, the Romantics, because nature is scarce only
    if there are excessive wants. The innate response to scarcity is relentless conquest
    and subjugation. Nature becomes abundant when we enjoy what it has to offer, limiting
    our wants. The Romantics captured this intuitively and poetically.


    But this is not only a matter of poetry. There is an anthropological kernel here.
    Anthropologists who have recently studied hunter-gatherer groups have found among
    them similar ethics of living within limits while believing in abundance. Living
    in the 1990s and 2000s with the Yaka in Northern Congo, ethnographer Lewis observed
    how the Yaka conceived of the forest as abundant. Common among many hunter-gatherers,
    is part and parcel of an ethic of obligatory, nonreciprocal sharing, what the
    Yaka call ekila—for Lewis, “a theory for maintaining abundance.¹² Ekila teaches
    that by sharing properly, resources will be experienced as abundance.¹¹³ Sharing
    the bounty, the Yaka limit accumulation of wealth and power, Lewis explains. The
    forest remains abundant, for the assumption that it is abundant comes with institutions
    and social relations that do not spur conquest and depletion. Western loggers
    and conservationists, instead, arrive in Northern Congo conceiving of the forest
    as a scarce resource. Lewis reports, with control of precious trees; conservationists,
    of rare animals. Both see the Yaka as scarcity is the ideological bedrock of both
    these activities, and a driving force in the enclosure, industrialization, and
    capitalization of the forest.¹⁴ As Wendell Berry puts it, “the life of this world
    is small to those who think it is, and the desire to enlarge it makes smaller,
    and can reduce finally to nothing.¹⁵


    I’m not claiming there’s an intellectual continuity from the Romantics to Emma
    Goldman to hunter-gatherers and the Green Party today (as the Yaka would be happy
    to hear). Some Romantics advocated population growth because of their religious
    beliefs; others spoke favorably of colonialism; environmentalists'' views on limits
    are mixed, too, as we saw. I point here to a *germ* of a non-Malthusian notion
    of limits is, also presenting in Greek and Roman philosophy as well as in non-Western
    traditions and ways of living.¹16 This yearning for limits is at the heart of
    radical environmentalism. Rachel Carson''s *Silent Spring*,¹⁷ for example, the
    book that launched modern environmentalism, was not about a scarce nature running
    out of space to absorb chemicals. Carson wanted us to place a limit on polluting
    a nature full of life. Her calling the use of pesticides was not a sacrifice from
    her perspective (and not only because there are organic alternatives); rather,
    limiting a damaging kind of production was the path to a better future of bird
    songs.


    The difference between *Silent Spring* and *Limits to Growth* is subtle but important.
    *Limits to Growth* also pointed to a looming disaster and called for a change
    of course. But *Limits* did not claim that growth, like pesticide use, has terrible
    consequences; rather, it predicted that growth will come to an end, and *this*
    would be a terrible consequence. (Donella Meadows and others did, push the Limits
    argument in their own work in a direction very similar to that of *Silent Spring*,
    calling for an end of growth and a change of politics and values. This is in fact
    closer to the take on limits I defend below.)


    # SELF-LIMITATION


    Cornelius Castoriadis''s notion of self-limitation is useful here.¹⁸ As I mentioned
    in the Introduction, a crucial distinction Castoriadis made is between heteronomy
    and autonomy. *Nomos*, the law, written and unwritten defines the limits necessary
    for a society to function. People make laws themselves but most societies attribute
    them “to a source outside of society, an imaginary, sacred source that makes them
    unquestionable.”¹⁹ The Ten Commandments is a case in point.


    In heteronomous societies, limits are attributed to an external authority that
    cannot be questioned. An autonomous society, in contrast, “is one whose attitude
    toward its own institutions is lucid, reflective and free, one that is not subservient
    to those institutions.”²⁰ Self-limitation²¹ is autonomy and includes the constraining
    of political excesses (for example, the protection of minority rights), social
    behaviors (crime), and the actions of the collective in relation to the external
    world and the environment.²²


    Castoriadis traces the idea of autonomy to classical Athenian democracy; it''s
    an idea he sees as revived by the Enlightenment but left incomplete. Western democracies
    increasingly regress to sources of truth that cannot be questioned, science, technology,
    or the free market. Democracy and capitalism appeared together in the seventeenth
    century, and capitalism''s mission is the unlimited expansion of rational mastery,
    manifest in unlimited and incontestable economic growth. Democracy is at odds
    with capitalism, because capitalism''s imperative to expand cannot be questioned:
    “One no longer asks whether there are needing satisfaction but whether some scientific
    or technical exploit or other is feasible. If it is, it will be achieved, and
    the corresponding ‘need’ will be fabricated.²³


    Capitalism’s “pseudo-mastery” of nature can never be fulfilled, Castoriadis argues,
    pointing to the unintended consequences of technology. We thought we were mastering
    nature with fossil fuels, but climate change is the reckoning. This mastery is
    also “pseudo-rational” because its source is not rational. It stems from a theological
    duty to subdue nature (which evokes what we saw with Malthus). All societies,
    not only capitalism, rest on ad hoc imaginaries. Like religious societies, consumer
    civilization has revealed the “humiliating” idea that the only goal in life is
    to produce and consume.²⁴ Radical environmentalism keeps this democratic spirit
    alive, Castoriadis insists, because it is the only contemporary movement that
    questions what democracy are all about. Other movements question the distribution
    but not the content of.


    This is a defense of self-imposed limits (autonomy), not limits that we imagine
    are forced upon by nature or the way society (heteronomy). The case for self-limitation
    rests on the negative consequences, or the risks of not limiting ourselves; and
    on the freedom of setting limits to our own powers and intentions, limits without
    which freedom loses its meaning. Recall the story of 1900. When 1900 refuses to
    leave the ship, he says no to the infinite city before it. It is not the risks
    of the outside world that 1900 fears, but he explains with his metaphor of the
    piano, the infinity of the external world, which disables his freedom. If a keyboard
    is infinite, there is no music you can play. Wordsworth, there, linked freedom
    to voluntary limitation:


    > In the truth of prison, which we deem

    > ourselves, no prison is for those

    > Who have felt the weight of too much liberty.²⁵


    Artistic freedom is indeed the child of limitation. Limiting is the most important
    skill a poet can master. The canvas delimits the field of a painter.²⁶ Consumer
    society, in contrast, overwhelms us with a potentially limitless range of options.
    Rather than liberating, limitless possibility can be debilitating and a constant
    source of frustration.²⁷ Simplifying choice by setting our own limits and by choosing
    “not to,” like 1900, can then be liberating. On a more mundane note, there’s the
    example of “Freedom,” an online app that you can use to block yourself from your
    e-mail or the websites you regularly visit, so as to dedicate yourself to writing.
    In our productivity-obsessed era, freedom is not the ability to do more, but the
    power to limit our self-destructive pursuit.


    Beyond consequences and freedom lies a third reason for self-limitation, one that
    is not captured by Castoriadis, Goldman, or the parable of 1900. This is justice,
    or care for the Other, since limitless expansion inevitably colonizes and assimilates
    the lifeworld of others, human and nonhuman alike. As the Spanish philosopher
    Jorge Riemann writes, “Only self-limitation makes possible alterity, leaves space
    for the other.”²⁸ We should live simply so that others can simply live, as Gandhi
    allegedly said.


    # THE PROBLEM WITH ENVIRONMENTAL LIMITS

