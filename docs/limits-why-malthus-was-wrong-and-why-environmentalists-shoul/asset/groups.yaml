    控制并不意味着放弃或否定欲望，而是作为领导力必经特质的主宰能力。在柏拉图看来，邪恶的统治者就像悲剧中的暴君一样，无法主自己的情感，结果倾向于滥用权力并对臣民施暴。智者领导者首先是自自己的主宰，他的自我节律中和了他对别人的统治。41


    通过阅读福柯，我开始意识到我自己对自我限制和节制的痴迷，是我成长背景以及在生命成长期阶段对古希腊文化沉浸的产物。奥奥德赛史》和《伊利亚德》中的道德，以及我童时读过的神话和传说，影响了我自己的道德结构。而这些道德和故事提炼了希腊人对他们生活的世界以及他们正在创造的社会的想象。


    ## 限制的形而上学


    希腊人将社会和个人现实投射到世界和宇宙中。西福德（Seaford）主张，公元前六世纪初阿纳西曼德的哲学中，我们首次发现了没有拟人化神灵的宇宙概念，以及一种统一的、无处不在的、抽象且超越的物质概念（非常让人联想到货币），这绝非巧合。阿纳西曼德来自米利图斯城（Mileus），那可能是第一个完全货币化的社会。换句话说，哲学家将社会限制与金钱无限权力之间的冲突投射到了宇宙上。公元前六世纪的毕达哥拉斯学派在形而上学层面推崇限制，认为宇宙的产生是一个限制无限的过程。42
    从无限中产生，又回归于无限。对于阿纳西曼德来说，万物都受限于限制并回到无限。一个半世纪后，柏拉图会认为限制应该控制无限，而亚里士多德则会谴责无限是糟糕的，并拥护限制。43


    我并不是想声称希腊人的本体论是建立在限制之上，而我们的是建立在无限之上。正如我通过马尔斯（Malthus）展示的那样，情况要复杂得多。马尔斯有限的世界是无限欲望的结果：当涉及到重新分配时，会引入限制；当涉及到扩张时，则诉诸无限。但希腊人看到的限制与无限之间的特定关系与我们不同，这些差异是具有启发意义的。


    一些前苏格拉底哲学家设想世界是无限的；阿纳西曼德说万物的本质是无限（*apeiron*），他指的是那种不受限制的事物。赫拉克利特则将宇宙视为在不断转化中的永恒之火。他们中的每一个人都想象了一种宇宙原则的存在，这种原则通过某种平衡行动或力量的抵消来施加限制。44
    同样，早期的毕达哥拉斯学派认为世界由对立面组成，最基础的对立是限制与无限；限制优于无限，而宇宙的生成就是对无限的限制。


    事实上，人类文化通常所做的（正如我之前用艺术品例子论证的那样）就是限制无限。任何形式的秩序或创造（绘画、立法或故事的构建）都意味着对无限的限制。只是这一事实在希腊新货币化的社会中获得了特殊的重要性，在那里，第一次由人类创造的无限正威胁要摧毁城邦（polis）。$^{45}$
    梭伦接受了不存在可见或易懂的限制这一观点，但正如哲学家所断言的，存在某种具有普遍限制力量。希腊人将一种限制的力量投射到宇宙，他们认为这是一个真实且存在的实体。宇宙的生成是某种比无限更小的物质对无限的限制。


    如果允许我在此稍作离题，希腊本体论和文化的这一方面与人类学家描述的狩猎采集社会的平等社会具有共同特征。$^{46}$ 这些狩猎采集者生活在限制与无限的世界中。他们将自然视为无限的，但他们用限制来回应。像希腊人一样，他们建立制度来遏制资源和力的积累——从责备成功的猎人到分享并消费所有收获，而不允许自己积累。$^{47}$
    尽管我可能存在过度类比的风险，他们也对宇宙拥有泛灵论观点。在希腊神话中，自然是人性化的：神灵与人类交配，等等。在更老的传统社会中，人类与非人类之间没有界限，这一点我们最近在关于人类世纪和自然终结的理论中才意识到。有趣的是，希腊人，自然是人性化的：神灵与人类交配，等等。


    ## 死亡与限制


    死亡，当然是终极的限制，认为人类对限制的恐惧与死亡有关并不荒唐。与宗教社会不同，希腊人并不具备驱邪的能力。$^{48}$ 对于希腊人，卡斯托里亚迪斯（Castoriadis）写道：“根本性的是凡性——凡人者即人类：这就是人类的本质。”希腊人通过仪式来理解生与，这些仪式被称为
    *telos*（完成或终结）。


    像今天的许多人一样，希腊人并不相信幸福的后世。在冥界（死者的世界），即使是英雄也被沦为凄惨的影子。51 冥界代表了死亡的虚无。但接受了死亡这一终极限制并从无法逾越的限制中解放出来，希腊人能够接受生命是由我们自己创造的。我们不需要在神灵或后世中寻找它。荷马史诗中的英雄知道如果采取某种行动就会死亡，但他们仍采取了想做的行动，选择了他们自己的死亡条件，这悖论地，是自由的终极行为和意义的构建——包括他们自身死亡的意义。52

