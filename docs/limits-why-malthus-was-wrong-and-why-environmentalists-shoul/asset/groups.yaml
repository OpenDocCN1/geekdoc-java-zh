    # LIMITS, SHARING, AND EQUALITY


    Malthusian limits go hand in hand with inequality: Malthus told the poor that
    there is not enough for everyone. Self-limitation, in contrast, rests on equality.
    If we decide to limit the pie, then the case for sharing it equally is stronger.
    By the same token, equality is necessary if people are to accept limits. As Seafood
    notes, “People will not give up their annual holiday overseas when the sky is
    full of private jets. ...Self-limitation... will be generally acceptable only
    when there are limits on everybody (as has occurred in wartime), when the currently
    absurd becomes a reality.”14


    Malthus’s limits explained enclosures; self-limitation instead justifies sharing
    the commons. Sharing, as we know from egalitarian societies, precludes the accumulation
    of power and the competition for position that drives expansion. If surplus is
    shared and expended instead of accumulated, then there is less expansion. Limits,
    that are, an outcome—intended or not—of sharing. Malthus claimed that there is
    not enough for everyone to have a decent share. The self-limitation thesis is
    that there will be enough for everyone *only* when we limit ourselves to our fair
    share. Without limits, there will never be enough. And without sharing, there
    will always be those who have less and feel they do not have enough.


    Self-limitation for sharing a limited resource is the essence of the theory and
    forms of organization called “the commons.” Against neo-Malthusians like Garrett
    Hardin who argued that commons will free-ride without the expense of others, scholars
    studying actual commons have shown how users come together to devise collective
    systems that limit their use of a common resource, given the consequences of not
    doing so.15


    # LIMITS AND FREEDOM


    Do limits intrude on freedom? Liberalism holds that an individual should be free
    to do anything provided it does not cause harm to others. But an individual who
    rides free in a commons harms the freedom of others. In'
  - '[PAGE 70]


    complex globalized societies that run on fossil fuels, almost everything we do
    harms sooner or later (think of carbon emissions) as we free-ride in the global
    commons.


    A “limitarianian” as opposed to a liberal or libertarian approach begins with
    a principle of prudence and moderation. I have argued that this does not go against
    personal freedom, which is not the freedom to whatever you want but freedom from
    want. Freedom in a limitarian sense is not the unobstructed pursuit of desires,
    the conscious reflection on, mastery, and liberation of them.


    Who is to tell, us though, that our desires are wrong and that we should limit
    them? To this standard concern of liberalism our answer should always be no one.
    Not, however, in the sense that we should not be limited, but that it is we who
    should judge and limit ourselves.


    Any project in common, including a state, involves rules and self-limitations.¹⁶
    Participants must internalize rules or the costs of enforcement make it impossible
    to govern. The subjects governed must also govern themselves. Freedom cannot mean
    the liberation of the self from internal and external constraints, because without
    such limits a society cannot function. In a functional society, members must see
    as legitimate the limits that society demands of them. But as Freud noted, such
    limits often reside in the unconscious, a constant source of frustration and bad
    behavior. Law and prohibition fuel desire. My hypothesis is that the more we come
    to reflect on the law and accept its logic as our own, the less likely we will
    be to desire to transgress it. But transgressing it also we must, occasionally
    at least, unless the law is to ossify into oppression (more than this below).


    # WHEN AUTONOMY BECOMES HETERONOMY


    If a government is our collective representation, charged with the enforcement
    of limits, then the distinction between technocratic, heteronomous limits and
    autonomous self-limitation is less clear.¹⁷ That a government may separate itself
    from its people and to impose limits that favor a privileged class does not mean
    that administrative limits are heteronomous. If government is government of the
    people, then'
  - '[PAGE 71]


    administrative limits are limits of the people. Not only does democracy need limits;
    limits also need democracy.


    Indeed, self-limitation requires institutions at higher levels to secure the endurance
    of agreed limits. People organize—from families and clans to towns, regions, nations,
    and international organizations. It is a matter of scale. Limitations at one level
    are often enforced by an authority with the power to sanction those who defy the
    limits down the chain. Users of a forest commons, for example, will reach agreements
    as how to limit their logging and establish an authority or mechanism at the group
    level to ensure everyone respects these limits. Likewise, to combat climate change,
    nations agree at the international level on limits to their carbon emissions.


    Scaling up limits controls free-riding and absolves individuals from having to
    be ever vigilant of their conduct. I don''t want to wonder constantly whether
    I should consume this or that; I want government to tell me what we have agreed
    not to consume. But when limits come to us higher up, they appear heteronomous,
    imposed by the higher-level authority. It seems as if it is the United Nations
    forces us to reduce carbon emissions or the European Union that keeps us from
    smoking or eating sugar.


    We are also faced with limits as a result of the commitments of our predecessors.
    Each new generation should have the opportunity to question and appropriate preexisting
    limits, lest they appear arbitrary. But each new generation also has a propensity
    to shred the limits of its forebears, and if it does so, then no limits will be
    durable. If every ten years we discuss which forests we should protect, we will
    soon find ourselves without any forest at all.


    Good parents set boundaries within which their children can act freely. Without
    limits, children find themselves in an infinite world where their freedom turns
    into fear.¹⁹ But all children inevitably react and question the limits set by
    their parents, to which the children may seem arbitrary. Child development is
    a process in which children find and appropriate their limits, and the external,
    heteronomous authority of the parent is an essential ingredient in this process.'
