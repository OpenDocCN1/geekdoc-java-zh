    Our irrational taboo against suicide comes then as no surprise, whereas in the
    ancient world suicide could be honorable. Or consider the standard Hollywood plot
    in which the hero faces a series of threats to life, only to overcome them and
    live happily ever after. Incapable of finding meaning, once the gods are gone
    there is no meaning, our culture has displaced the search for meaning into a struggle
    for life against death as a meaning unto itself.


    Growth for growth''s sake is another manifestation of this psychosocial drive.
    Western societies consider high life expectancy to be the ultimate indicator of
    social wellbeing, and we use it to justify growth. We are supposed to take care
    of ourselves in order to live as many years as possible. But why? We do not really
    why. Living, for us, is the meaning of life, and we aim to extend it indefinitely.
    The Greeks reprimanded “those who in order to keep from losing their hold on life,
    tried their utmost to delay the term that had been appointed by nature.54 The
    idea “was not to extend life as far as possible in time nor as possible in performance,
    but rather to make it useful and happy within the limits that had been set for
    it.”55 This freedom to act within the limits marked by death is different from
    our modern ideal of freedom as the right to mobilize all forces to subdue nature
    and become immortal, which is to say inhuman.


    In Civilization and Its Discontents, Freud argued that we have a drive for life
    and a drive for death.56 Hunger, sex, or love are life instincts. But we also
    have a primordial longing for an infantile stage when we had not yet realized
    our separation from the environment. This death instinct, a desire for our own
    dissolution, Freud suggested, gets displaced as an aggressive instinct to destroy
    others. Civilization limits this longing for limitlessness, but we suffer from
    having to limit our instinctive behavior. Influenced as he was by Malthus,57 Freud
    concluded that the limits we have instituted and interiorized to control ourselves
    are as significant a cause of suffering as the destruction that the unleashing
    of these instincts would cause. For Freud, the suppression of our instincts feeds
    our discontent. But the Greeks let us see the relationship between desire and
    death, between instinct and limit in a different way, one that actually anticipated
    the evolution of psychoanalysis.


    The Greeks too saw the potential destructiveness of our excess energy. Unlike
    Malthus, Freud, and the moderns, the Greeks did not think of self-limitation as
    suffering. They saw limitation as normal (and suffering as a part of life). It
    is obvious that we have to master and craft our instincts; this is the price of
    civilization. The problem with us moderns is not that we have suppressed the death
    instinct, but that in refusing death we are only able to react to death through
    violence; we attempt to overcome it by subordinating nature by shifting death
    onto others. Accepting death and accepting their violent instincts, Greeks tried
    to master them.


    As it turns out, this dovetails with the project of Freudian psychoanalysis. Psychoanalysis
    accepts that our struggle with instincts cannot be resolved. We cannot become
    saints relieved from all suffering, but we can understand ourselves better—accept
    our desires and the results of repressing them—and choose our limits consciously,
    liberating fantasy and desires without fear. Civilization has a built-in destructive
    drive, but in contrast to Malthus and many others thought, it can be controlled.
    We have less suffering instead of destruction, to the extent that we can institute
    mechanisms that help us reflect on our wants and prudently manage those that are
    excessive. At the level of the individual, this is the mission of psychoanalysis;
    at the level of the collective, Castoriadis argued, this is the role of democracy.
    Psychoanalysis helps us come to terms with desire and death to overcome fear;
    live rather than be paralyzed or turn violent. As for the Greeks, the point was
    to separate from destructive desire, to release desire and to craft it.


    To return to my favorite allegory (just in case I have not convinced you to see
    the movie), did 1900 stay in the ship because he saw he could better express his
    desires within its limits in the limitless city? Or did he desire to leave for
    the city but remained in the ship of fear or guilt? Did he engage in soul-searching
    and choose his own limits, or was he limited by his past? Such a view of personal
    freedom, as a search within one’s self, is a world apart from the freedom of Robinson
    Crusoe and his frantic actions to fill a void through activities at once destructive
    as well as meaningless and self-oppressive.


    ## RECLAIMING A CULTURE OF LIMITS


    Western societies have reflected and instituted important limits, especially since
    the unthinkable self-destructiveness of the two world wars. Our history of laws
    and limits is as much the history of Western progress as bridges, dams, spacecraft,
    and computers. After the Second World War, Western countries strove for a time
    to limit inequality and the accumulation of private wealth by taxing the wealthy
    in ways that would seem unthinkable, and they imposed limits on working hours
    and environmental damage. We have limited the spread of nuclear weapons and the
    research on new ones; we have limited how fast drive cars, where and when we can
    smoke tobacco, how we poison our food or pollute our water, and what we can do
    to one another without impunity.


    The revanchist tendency in the 1980s onward, however, is one of deregulation,
    with the removal of limits money flows and accumulation, or of environmental and
    social protections. Global warming brings the self-destructiveness of having no
    limits. But the reaction by those in power and many of their followers to the
    reckoning of hubris is denial and a doubling down on the effort to deregulate
    limits remain—from mining in nature reserves, to digging extra-dirty oil or coal,
    to working and trading on Sundays—all in the pursuit of limitless expansion; senselessness
    in search of sense.


    We modernos have never needed a culture of limits as much as we do. At the same
    time, we may have never so hostile to limits as we are. From self-help books on
    overcome your limits, to “no limits” exercise routines, to songs and advertisements
    telling us there is no limit to what we can achieve, Limitless, the 2011 science
    thriller starring Bradley Cooper, offers a case in point. Cooper plays a failed
    author who suffers from writer’s block and has been abandoned by his girlfriend.
    Enter a new nootropic drug to save the day. In a few hours, Cooper’s character
    completes his novel which is an instant success that leads to more success. The
    catch, though, with the drug is that he needs more and more of it to keep up.
    Without it, he will collapse and die.


    I hail from an older generation than this movie''s audience, and as I watched,
    I waited for some kind of nemesis or a road to salvation. But instead of dying
    or giving up the drug, Cooper secures his own unlimited supply, learns to weather
    the side effects, gets his girlfriend back, and rises to become a US senator and
    prospective president. Not only do hubris and immorality go unpunished; they are
    glorified. The addict-hero walks over corpses to get his dose and cheats it by
    becoming the most powerful man in the country. If the myth of Erysichthon was
    an ideal myth for a culture of limits, this modern story of a limitless king reveals
    the pathology of a civilization obsessed with overcoming limits at any cost. It
    is the same pathology of the new breed of rulers who take pride in their lack
    of moderation, who want to extract coal and oil at any cost, and are ready to
    eliminate the last indigenous people in the Amazon.


    The Greeks of course were far from perfect, and their history was hardly peaceful
    or ideal one. We can''t return to the Greeks, nor should we. And we can''t reproduce
    the conditions that led to a culture of limits in their particular place and time.
    “We must go further than the Greeks and the Moderns” to establish a genuine democracy
    of self-limitation under contemporary conditions.59 We can take pride in the limits
    that we have managed to institute that they did not. But progress today, more
    than ever, may mean stopping—not moving ahead with growth.60 As Walter Benjamin
    wrote, shortly before the Second World War, it is time “to pull the emergency
    brake.”


    The omens are not favorable. But there is no alternative but to insist.

