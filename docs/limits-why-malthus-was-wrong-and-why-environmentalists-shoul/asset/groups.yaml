    由于反对避孕和娱乐性性，马尔萨斯既穿上了神职的法袍，也戴上了经济学家的帽子。他拒绝避孕，因为这会消除地球人口增长动力所需的勤奋动力。而上帝希望我们工作并繁衍地球。


    马尔萨斯的逻辑论证建立在一个神学前提之上：以几何倍数繁衍地球是我们的本性和上帝的要求，而将我们的数量限制在这一水平以下是不自然的，并因此是不虔诚的。该模型的结论包含在其假设之中：世界是有限的，无法共享，因为上帝命令了扩张。我们无法在不受痛苦的情况下限制自己，但痛苦是神圣旨意的一部分。上帝希望我们受苦，因为如果没有减轻痛苦的动力，我们就不会努力去繁衍地球。


    我得出结论，马尔萨斯是错误的，因为他低估了技术和增长，但他并没有这样做。马尔萨斯是错误的，是因为他没有看到我们可以限制自己的数量。但他认为这样做是不自然、不道德且痛苦的。马尔萨斯是错误的，是因为他不愿考虑“我们可以限制人口并过得幸福”的想法——即我们可以享受性、快乐和生活，在拥有数十个孩子的同时既不不道德也不自然。马尔萨斯无法想象一个未来：女性可以拥有自由的性关系而不生育，不成为性隶，不保持隐秘，且没有人因此遭受痛苦。至关重要的一是，他不想看到这一点，因为如果他看到了，他就不得不承认，这可能足够每个人分得一份体面的份额。


    ## 马尔萨斯论文的意识形态工作


    在马尔萨斯写下《人口论》之前的几十年里，英国经历了人口减少。根据西尔维亚·费德里奇（Silvia Federici）的观点，人口的减少不仅是瘟疫、战争和疾病的结果，也是女性无声地主张对其身体的控制权并抵抗男性和教会的结果。人口低增长限制了早期资本主义，使劳动力成本保持在高位。正如费德里奇的工作所记录的，，无数女性生育主义的国家政策以及女巫猎，引发了教会和精英阶层部分厌女主义的反击。马尔萨斯在倡导人口增长方面并非孤单。著名神学家、马尔萨斯在剑桥大学的导师威廉·帕利（William
    Paley）在1790年（即马尔萨斯《人口论》出版八年前）写道：“人口的衰败是国家所能遭受的最大恶，而改善人口是应当……优先于任何其他政治目的所追求的目标。”⁴²


    早期资本主义需要扩张其劳动力队伍，这需要一种努力工作的新教伦理；马尔萨斯提供了一种叙事，将所谓的上帝的意愿与工厂主的意愿融合在一起。他捍卫了这样一种观点：解决贫困最好的办法就是什么都不做⁴³，尽管他仍然坚持基督徒关心穷人。教区的大多数之所以聚集在那里，并不是他们被从圈地中赶出去，而是因为他们孩子太多。


    马尔萨斯错误的错误具有仍然具有现实意义的政治影响。那些声称马尔萨斯错误是因为他没有预见到我们对技术和增长的能力的人，实际上是在复制那种被马尔萨斯框架所正当化的思维。是马尔萨斯想象了一个有限的世界来证明增长的性。他没有将资源的限制看作是对我们无限欲望的永恒限制。米尔、凯恩斯、恩格斯对马尔萨斯的担忧做出了回应，预测未来当我们生产更多时，将会有足够的资源。恩格斯担心，如果马尔萨斯是对的，社会主义无法消除贫困而只能使其普遍化，他主张“生产得太少，这这一切的根源。”⁴⁴
    米尔的停滞状态、马克思和恩格斯对生产力的发展，或者后来凯恩斯的后工业未来——数十年的增长将允许他的孙辈每周只工作几个小时——都共享一个愿景，即通过增加生产来克服稀缺，分配丰收让每个人都有足够的资源。


    但正如尼古拉斯·塞诺斯（Nicholas Xenos）所说，“通过依靠经济力量来超越局限，凯恩斯以及之前的马克思和米尔，是在等待戈多。”⁴⁵ 那些所谓的将超越稀缺的技术力量随着生产的增加而增加欲望，确保了永远不会为每个人提供充足的资源。为了过上尊严的生活并尊严地死去，今天的普通人需要动员马尔萨斯时代皇室成员无法想象的资源。对增长的关注是稀缺的神话，是一个为主导机构提供合法性的宏大叙事，这些机构将自己定位为唯一面对稀缺的人。对这些机构的批评是可能的，“但只能基于一个永远在未来的时间点，由于社会需求的功能，因此这种批评奇怪地最终导致了对稀缺机构的认可，同时提出了一个不同的未来，因为这些机构无法让未来成为可能。”⁶
    马克思和恩格斯、米尔和凯恩斯不能被放在同一个篮子里。但他们（无意中地）对马尔萨斯术语的接受，可能在解释这些不同的知识分子和政治流派之间的共识方面起很大作用，尽管这一切都是建立在限制之上的。


    马尔萨斯的世界仍在被使用。它是一个有限的、一个稀缺的世界，人类无限的欲望处于一个永远无法与其其无限性相匹配的环境中。今天，“我们经济被普遍接受的基础是供应了无限增长、无限欲望、无限财富、无限自然资源、无限能源和无限债务的可能…………所有人都有权追求他们构想中理想的任何东西。”⁴7


    马尔萨斯提出这个无限扩张的世界，正是因为资本主义刺激了以前所未有的规模和速度的商品生产。他辩护了了为什么财富永远无法在所有人之间平等分享，以及为什么它们永远是不够的。他想法的天才之处在于，他成功地让稀缺与增长兼容，让限制与限制兼容。通过这样做，他一方面成功地认为对每个人来说都是不够的，另一方面坚持如果我们生产更多，仍然是不够的。马尔萨斯并没有发现资源限制。对于没有限制的“经济人”来说，世界在定义上就是有限的。与浪漫主义者想象并惊叹的丰富世界不同，马尔萨斯发明的世界是吝啬的。


    ## 经济学：没有限制的稀缺


    鲁宾逊·克鲁索愉快地看着他的庄园。年前，大海将他冲上这个岛，感谢上帝，他现在无一无求。像一个优秀的英国人一样，他有自己带围栏的房子、足够的采摘的水果、狩猎或种植大麦和米的铁工具、酿葡萄酒的葡萄、产奶的羊、一只陪伴他的鹦鹉，以及最近的“星期”，他的仆人伙伴（这让他想起了他在船难中失去非洲奴隶——他在巴西的庄园没有他们还能有回报吗？）。


    鲁宾逊，你满意吗？是时候放松一下了吗？

    不！生命是短暂的，一天有二十四小时。他应该听鹦鹉的，还是读《圣经》？耕地，还是教星期五英语和福音？如果食人族再来，要再多做一些矛吗？他一天之内可以做很多事情了。也许下个月，等他做完这些矛之后，等星期五说出一句流利的英语之后，也许他就有时间休息一下了。


    ## 现代经济学的寓言


    这一稀缺假设背后的想法是我们想要无限的东西，但时间是的。稀缺是我们节约的原因。而经济学是节约的科学。那个对他有用的东西进行最大化的孤立的人，成为了后来被称为新古典经济学的基石。


