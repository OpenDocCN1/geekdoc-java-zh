    我们与环境的关系比静态边界概念所暗示的更具共同进化性。⁵考虑金·斯坦丹利·罗宾森的小说《纽约2140》，这是一部关于边界被跨越、海洋被淹没之后生活的描写。曼哈顿市中心被淹没，每隔一段时间，穷人就会挤进坍塌的建筑中。纽约依然是一座梦想之城：男女相爱；他们对新的威尼斯景观感到惊叹；居住在被淹没建筑中的穷人发展出新的艺术形式；将废弃的摩大楼变成社区住房项目。随着海平的稳定，资本家们通过投机绅士化和潮间住房市场，押注新的金融计划。风暴扰了某些投资者的计划，而另一些人则通过反向交易获利。2140年的贫困和不平等比现在更严重，社会冲突四起。这是一个人们既糟糕又美丽的未来，而且对于不同的人、在不同的时刻，它既是糟糕的也是美丽的。罗宾森的小说提醒我们，历史可能不会变得更好，但绝不会停止。


