    # 引言：为什么需要极限？


    “没有极限。”“所有极限都是人为设定的。”“你是唯一的极限。”“只要努力，没有极限。”世界上唯一的极限就是你脑海中的极限。“当月球上都有脚印时，不要告诉我天空才是极限。”


    这些是在互联网上搜索“极限”一词时会发现的几条格言。西方文化痴迷于克服极限的梦想。与此同时，我们被终极极限所困扰，即我们自身的死亡，以及作为西方文明终结的“旱灾惩罚”。《纽约时报》告诉我们，当国家的增长引擎“撞上自然的极限”时，已迫使国家重新考虑。¹
    联合国警告说，“如果我们现在不采取行动，文明将面临危险”，且全球变暖要控制在1.5摄氏度以内。²


    我们为什么会有关于极限的思想，去思考我们所面对的极限？从经济学到环境主义，极限在现代思想的发展中扮演了什么角色？社会需要极限吗？如果需要，需要什么样的极限？这些都是书中探讨的一些问题。


    在接下来的页面中，我的目标是重新找回、精炼并定义“极限”这一概念。我想将“极限”与学术术语中所谓的“马尔萨斯主义”区分开——这是一套追溯到1798年的思想，由具有神职背景的经济学家托马斯·罗伯特·马尔萨斯写的一篇论文，这些思想塑造了我们思考极限的方式。通过这本书，我希望让那些诉诸极限的人思考如何这样做；我也希望让对极限的批评者在将我们这些主张极限的人贴上马尔萨斯主义者的标签之前先思索。


    我想从朱塞佩·托纳托雷执导的电影《1900的传奇》中的一个画面开始。³ 电影的主角1900以他的出生年份命名；这个新生婴儿是在元旦节被一艘轮轮的机舱技师在一个箱子里发现的。由蒂姆·罗斯饰演的1900从未离开过那艘船，他在那里展现了钢琴天赋。著名的爵士钢琴家来到船上进行决斗，他击败了所有人。当


    一位音乐制作人邀请他录制专辑时，爱上了一名乘客的1900决定离开船。在一个令人难忘的场景中，他走下梯子的一半，船员正向他致敬告别。他盯着眼前的城市，犹豫了。转过身，看向梯子顶，决定永远留在船上。


    多年以后，1900躲在船的货舱里，他的朋友马克斯恳求他离开，因为船将被凿沉沉没。1900回答道：“那座城市……你根本无法看到它的尽头……马克斯，停下我的不是我看到的，是我没看到的……在整座蔓延的城市里，一切皆有，唯独没有结尾。”通过对他心爱的乐器作类比，1900补充道：


    - 琴键开始了，琴键。你知道有88个……它们不是无限的，而我们是无限的。在那88个琴键上，你可以弹出的音乐可以是无限的……但如果你把我带上上甲板，推开一个有数百万个键的键盘，……那里没有尽头，那个键盘是无限的。但如果那个键盘是无限的，你就无法弹奏任何音乐。


    对于那些想要生活在极限之内的人来说，时代是艰难的。飞机取代了轮船，1900随船一起沉没了。死亡的极限是希腊悲剧的题材，而非好莱坞大片——1900在票房上也沉没了。但面对全球变暖，我们迫切需要一种极限文化。这本书是尝试朝这一方向努力。


    # 为什么需要极限？


    我是一个环境主义者，极限是环境主义的核心思想。极限是行星边界、世俗、长期⁶对于一位绿色运动历史学家安德鲁·多布森来说，“这就像陷入了循环。”⁷ 在世纪70年代，马尔萨斯式的环境主义者预言我们注定毁灭；而永恒的乐观者则像里根那样回应，人类的智慧、想象力和奇迹没有极限。⁸
    我出生于1972年，也就是《增长极限》报告发表的那年，我发现乐观者与悲观者之间的争论已经精疲力竭。这些对立的观点是同一枚硬币的两面。没有极限，资本对无限增长的追求毫无意义。马尔萨斯和其他资本的教士们构建了一个无限需求与有限世界冲突的画面。稀缺与增长变得不可分割，而极限刺激了增长。我的论点是，只有当我们接受世界是丰富的时，我们才能考虑限制需求并划定一个安全空间。这个观点可能违背直觉，但是因为我们倾向于从马尔萨斯的角度考虑极限。这本书发展了一种不同的极限观点，即自我限制——建立自我设定和有意选择的极限——与我们归因于内在或外部世界的马尔萨斯极限有所不同。从重新阅读马尔萨斯1798年的《人口论》开始，我认为马尔萨斯发现的不是自然极限，而是无限的需求。马尔萨斯并非毁灭的预言者，他引用毁灭是为了激发对增长的追求。我们将看到，由于现代经济学，马尔萨斯依然存在，建立在永恒稀缺的神话和对持续增长的呼吁之上。我将解释环境主义者如何陷入这种马尔萨斯式的有限且稀缺的世界观，以及为什么这是有问题的。并将为自我限制辩护。随后我将转向古典希腊，作为一个拥有自我限制文化的文明。在那里，以及在下一章中，当我处理自己捍卫极限的局限时，我将遵循小说家的建议，少写写我了解的、感兴趣的，多写写我想了解更多的内容。⁹
    我将结束这本书，更加坚定、毫无歉意地捍卫对极限的渴望。


    在我的第一份工作中，在欧洲议会，我参与了修订限制水污染的欧盟法律。我亲眼目睹了化学游说集团对环境监管的攻击，这种攻击受到否认极限需求的经济话语驱动。回到研究生阶段，我学习了生态经济学并了解了增长极限。¹⁰
    在加州大学伯克利分校与经济学家迪克·诺加合作时，我意识到定义生态极限是多么困难，因为极限总是取决于我们的意图。


