    “控制，是一种物理上的必然，我们所有人都是它的奴隶，”著名的浪漫主义者威廉·哈兹利特（William Hazlitt）在对马尔萨斯论文的反驳中写道.¹¹ 节律并非为了量力而行的某种计算实践，而是一种享受自由爱的方式。


    马尔萨斯的框架根深蒂固在我们脑中，以至于如果自然是慷慨的我们却限制自己，这似乎是矛盾的。难道我们应该看到自然是稀缺的从而保护它吗？不，浪漫主义者认为，只有在欲望过度时，自然才是稀缺的。对稀缺的本能反应是无情的征服和征服。当我们享受自然提供的一切并限制自己的欲望时，自然就会变得丰饶。浪漫主义者直觉且诗意地捕捉到了这一点。


    但这不仅仅是一个诗意的问题。这里有一个人类学的内核。近期研究猎人采集者群体的人类学家发现，在这些群体中存在着在局限内生活同时相信丰足的相似伦理。在 20 世纪
    90 年代和 21 年代与刚果北部的雅卡人（Yaka）一起生活时，民族学家刘易斯（Lewis）观察到雅卡人是如何构想森林是丰饶的。在许多猎人采集者中常见的是一种义务性的、非互惠的分享伦理的内在组成部分，雅卡人称之为
    *ekila*——对于刘易斯来说，“这是一个维持丰饶的理论.¹² *ekila* 教会人们通过适当的分享，资源将被体验为丰饶.¹¹³ 刘易斯解释，通过分享馈赠，雅卡人限制了财富和权力的积累。森林保持着丰饶，因为对其丰饶的假设伴随着不会助长征服和枯竭的制度和社会关系。相反，西方的伐木者和环保主义来到刚果北部时，将森林构想为稀缺资源。刘易斯报告说，是对比珍稀树木的控制；环保主义则是对稀有动物的控制。双方都认为雅卡人视为稀缺的，因为稀缺是这两项活动的意识形态基石，也是森林圈地、工业化和资本化的驱动力.¹⁴
    正如温德·贝里（Wendell Berry）所说，“对于那些认为这个世界很小的人来说，这个世界的生活是很小的，而扩大它的欲望会让它变得更小，并最终可能化为乌有.¹⁵


    我并不是声称从浪漫主义者到艾玛·戈尔德（Emma Goldman），再到猎人采集者以及如今的绿党之间存在某种知识上的连续性（尽管雅卡人听了会很高兴）。一些浪漫主义者因为宗教信仰支持人口增长；另一些对殖民主义赞誉有加；正如我们所见，环保主义者对局限的观点也十分复杂。我在这里指出的是，一种非马尔萨斯式局限观念的*萌芽*，这种观念也出现在希腊和罗马哲学中，以及非西方传统和生活方式中.¹⁶
    这种对局限的渴望是激进环境主义的核心。例如，瑞切尔·卡森（Rachel Carson）的《寂静的春天》⁷，这本开启现代环境主义的书，并不是关于一个稀缺的、没有足够空间吸收化学物质的自然。卡森是希望我们对一个充满生命的自然施加限制。从她的角度来看，她反对使用农药并不是一种牺牲（不仅是因为有有机替代品）；相反，限制一种破坏性的生产是通往鸟鸣之美好未来的道路。


    《寂静的春天》与《增长的极限》之间的区别虽微妙但重要。《增长的极限》也指向了即将降临的灾难，并要求改变方向。但《极限》并没有声称增长像使用农药一样具有可怕的后果；相反，它预测增长将结束，而*这*将是一个可怕的后果。（多内拉·梅多斯
    Donella Meadows 等人在自己的作品中确实以一种与《寂静的春天》非常相似的方向推了“极限”论点，呼吁结束增长并改变政治和价值观。这实际上更接近我在下文中捍卫的局限观。）


    # 自我限制


    科内利乌斯·卡斯托里迪斯（Cornelius Castoriadis）的自我限制概念在这里很有用¹⁸ 如我在引言中提到的，卡斯托里迪斯做的一个关键区分是异律性（heteronomy）与自主性（autonomy）。*Nomos*，即法律，无论是成文还是不成文的，都定义了社会运行所需的限制。人们自己制定法律，但大多数社会将法律归因于“社会之外的来源，一个想象的、神圣的来源，使其变得不可置疑。”¹⁹
    十诫就是一个典型的例子。


    在异律社会中，限制被归因于一个不可质疑的外部权威。相比之下，一个自主社会“一个对其自身制度的态度是清醒、反思且自由的、不隶属于这些制度的。”²⁰ 自我限制²¹是自主，并包含了对政治过度（例如对少数权利的保护）、社会行为（犯罪）以及集体相对于外部世界和环境的行动的约束²²
    卡斯托里迪斯将自主的理念追溯到古典雅典民主；他认为这一理念被启蒙运动复兴了，但留不完整。西方民主日益退化到不可质疑的真理来源：科学、技术或自由市场。民主与资本主义在
    17 世纪共同出现，资本主义的任务是理性主宰的无限扩张，表现为无限且不可争辩的经济增长。民主与资本主义相矛盾，因为资本主义扩张的指令是不可质疑的：“人们不再询问是否有需求需要满足，而是询问某些科学或技术开发是否可行。如果可行，它就会实现，相应的‘需求’将会被伪造出来。²³


    卡斯托里迪斯认为，资本主义对自然的“伪主宰”永远无法实现，他指出了技术的意外后果。我们认为我们通过化石燃料主宰自然，但气候变化就是清算。这种主宰也是“伪理性的”的因为其来源并非理性的。它源于征服自然的神学使命（这唤起了我们在马尔萨斯身上看到的）。所有的社会，而不只是资本主义，都建立在临时的想象之上。正如宗教社会一样，消费文明也揭示了这种令人羞辱的观点：生活的唯一目标是生产和消费²⁴
    激进环境主义保持了这种民主精神，卡斯托里迪斯坚持，因为它是唯一质疑民主本质的当代运动。其他运动质疑的是分配而非内容。


    这是对自加限制（自主）的辩护，而非想象自然或社会强加的限制（异律）。自我限制的论点基于不限制自身的负面后果或风险；基于对自身力量和意图设定限制，没有限制的自由将失去意义。


    > 在我们认为的监狱真理中，

    > 对于那些感受到

    > 过度自由重量的人来说，那里没有监狱。⁵


    艺术自由确实是限制的产物。限制是诗人可以掌握的最重要技能。画布界定了画家的领域。⁶ 相比之下，消费社会用潜在无限的选择范围让我们压力不堪。与其说是解放，无限的可能性可能会让人精疲力竭并成为不断的挫败之源。⁷
    通过设定自己的限制并像 1900 那样选择“不”，来简化选择，就可以是解放性的。在更平凡的方面，还有像“Freedom”这样的在线应用程序，你可以用它屏蔽自己的电子邮件或经常访问的网站，以便专注于写作。在我们这个痴迷生产力的时代，自由不是做更多的能力，而是限制我们自我毁灭式追求的力量。

