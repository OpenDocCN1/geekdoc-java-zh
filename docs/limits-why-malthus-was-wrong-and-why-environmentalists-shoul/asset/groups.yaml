    英国……能够在不受干扰的情况下安顿下来，只要那里有更多工作机会和更高劳动力报酬的前景。“劳动力市场届将是自由的，那些由于目前的情况，往往在相当长内阻碍价格根据需求上涨的障碍也将随之消除。”
    31 这篇论文可能是第一次以自由市场增长之名，对再分配和福利制度的拒绝。


    为了说明戈德温在《政治正义之探究》（1793年）中描述的平等社会是不可能的，马尔萨斯讲述了一个故事。他邀请读者想象一个没有财产或不平等的社会。但随之而来的却是约翰·列侬式的乌托邦。马尔萨斯认为，在生存得到保障后，人们将开始尽可能多生孩子。人口的增长速度将超过食物的增长，每个个人享有的总份额将逐渐减少。有些人将不得不在低于其份额的情况下生活。收获时运气好的人将想要保护自己的食物免受倒霉之人的侵害。幸运者将发明了私有财产，以保护他们的作物免受入侵者的侵害。由于存在一个拥有财产的阶层以及一群无产且饥饿、只能通过劳动为生的小人物，因此禁止后者为前者工作将是不人道且暴政的。马尔萨斯总结道：“将建立一套财产管理制度，这与目前文明国家盛行的制度并没有太大。”32
    戈德温的平等社会“在很短的时间内将退化为一个与目前计划本质上没有区别的社会；一个被分为所有者阶级和劳动者阶级的社会。”33


    马尔萨斯仍然认为，不平等不可避免的，但并不是坏事。它是增长的动力。我们无法拥有一个只有中产阶级的社会，因为：


    > 在社会中，极端部分如果不减少到某种程度，就无法削弱整个中间部分那种活跃的努力……如果一个人都不再希望在社会中上升或跌落，如果勤奋没有带来相应的报酬和惩罚，那么中间部分绝不会是现在的样子。34


    ## 为什么马尔萨斯错了？


    经济学家告诉我们，马尔萨斯是错的，因为他没有预见到列车的到来。正如《经济学人》所说，“马尔萨斯是一个虚假的预言者”：


    他对前工业社会的描述或许是准确的，但已经在英国开始的工业革命正在改变经济增长的长期前景。经济的扩张速度开始超过人口的增长速度，带来了生活水平的持续提高。35


    人口并没有崩溃，食物供应的增长速度比人口增长快。据说法，马尔萨斯低估了技术——正如罗纳德·里根或他的撰稿人所说，他低估了我们的“智慧、想象力和好奇心”。《经济学人》得出的结论是显而易见的：今天那些限制化石燃料和温室气体的人同样也是虚假的预言者。技术会解决问题的，不需要限制。


    但正如我在这里提到的，马尔萨斯并没有要求对人口或资源的限制，他也没有质疑增长的前景。他的目标是证明资源对所有人来说都是足够的，而不是增长是有极限的。我们理解的增长这一概念是在马尔萨斯之后一个世纪才发明的。在他时代，福利、生产和人口的概念是混为一谈的。对于马尔萨斯他的许多同时人来说，经济增长意味着人口增长和农业生产的增长。马尔萨斯乐观地认为，人口长期来看可以无限制增长——只要有纪律、勤奋和更多的食物。


    诚然，马尔萨斯提到的周期表明，从长期来看，人均可用食物量是稳定的：如果生产了更多食物，人口就可以赶上。但这并不是一个可怕的预言。马尔萨斯并不是这样呈现它的；一个不断增长、吃饱的人口是一个国家能负担的最好状况……引用亚当·斯密的话，他预见到国家还可以增加制造业和其他财富。


    那么，我们如何理解马尔萨斯著名的断言“人口不受限制时按等差数列增长”？（几何增长是 1, 2, 4, 8, 16, 32, 64, 128 . .；等差增长是
    1, 2, 3, 4, 5, 6 . . ）这难道不是对人口爆炸和饥饿的预言吗？

