  - '[PAGE 85]


    necessary, I insist, to find a way to defend collective limits, without accepting
    unjust ones.


    The role of the environmental movement in keeping alive this plea for limits has
    been vital. Environmentalism has has flirted with Malthusianism and has reproduced
    Malthus''s vision of a limited world. But the environmentalism I espouse here
    is emphatically not Malthusian. It is not the environmentalism of those revel
    in predicting disasters, telling us that the earth is shrinking, but of those
    who desire and struggle for limits. It is the environmentalism of people who do
    not want to step off the boat or escape to Mars⁵ Of people who have the wisdom
    to love and care for the planet they live in, embracing its limits and the limits
    of their own lives, not fleeing from them, leaving behind ruin. Spiritual leaders
    such as the pope are adding their voices to this call for limits is a reason for
    hope⁶ So are the multiple movements and peoples defending the commons or setting
    up new commons by the arduous process of negotiating and defining collective limits⁷


    Malthus was wrong. Our wants are not unlimited, and unlimited wants are not our.
    Our ability to reason and reflect on and respond to what it is we desire is essential
    to our humanity. We liberate ourselves by controlling those instincts that would
    enslave us or threaten to destroy us. Like women and men who mature in life when,
    coming to terms with their own limits, they find their true desires, civilization
    will truly progressed when we come to know and respect our limits. Now more than
    ever, to progress may mean to stop, think, and act differently. Let us use human
    intelligence, imagination, and wonder to help us find our limits, rather than
    burying our brains in bunkers.'
  - '[PAGE 86]


    # ACKNOWLEDGMENTS


    Emily-Jane Cohen, my editor at Stanford University Press, embraced this project
    from the very beginning and helped me bring it to a conclusion. Her careful editing
    polished my text and made it much more readable than it would otherwise be. Amy
    Thomas edited in depth the first draft of the book and helped me improve not only
    my English but also the content. Gareth Dale and Jason Hickel commented on previous
    drafts, and Richard Seaford helped me write the chapter on Greece. My ideas on
    limits have benefited from numerous conversations over the years with Giacomo
    D''Alisa. Antonio Verdasca-Cardoso helped me think about my own limits and my
    relationship with limits. I conceived the project while in London, during a coaching
    session with Amalia Cardenas. Aaron Vansintjan helped me write the book proposal.
    In London I was hosted by Rosaleen Duffy at SOAS, University of London, and got
    useful feedback during my Leverhulme lectures at SOAS, the Open University, and
    the University of Cambridge, and later at the University of California, Berkeley,
    at the Energy and Resources Group Colloquium. The book was completed under an
    ICREA professorship at ICTA, the Institute of Environmental Science and Technology
    at the Autonomous University of Barcelona—benefiting from support from the Spanish
    Ministry of Economy and Competitiveness (MINECO) under the “María de Maeztu” Unit
    of Excellence (MDM-2015-0552) and the COSMOS (CSO2017–88212-R) grant.'
