  md: '# INTRODUCTION: WHY LIMITS?


    "Know no limits.” “All limits are self-imposed.” “You are your only limit.” “With
    hard work there are no limits.” “The only limits that exist are the ones in your
    mind.” “Don’t tell me the sky is the limit when there are footprints on the moon."


    These are few of the maxims one finds in an internet search on the word “limits.”
    Western culture is infatuated with the dream of overcoming limits. At the same
    time, we are overwhelmed by the ultimate limit, that of our own death, “punishing
    drought,” as the death of Western civilization. The New York Times tells us, has
    forced the state to reconsider when its engine of growth “has run against the
    limits of nature.”¹ Civilization is at stake if we do not act now” and global
    warming to 1.5 degrees Celsius, warns the United Nations.²


    And why have the idea of limits to think about the limits we do? What role has
    limits played in the development of modern thought, from economics to environmentalism?
    Do societies need limits? And if we do, what kinds of limits? These are some of
    the questions entertained in this book.


    In the following pages, I aim to reclaim, refine, and define the notion of limits.
    I want to dissociate limits from what in scholarly jargon we call Malthusianism—a
    set of ideas dating back to 1798 and an essay written by the cleric-tuned economist
    Thomas Robert Malthus that has come to shape the ways we think about limits. With
    this book, I hope to make those who invoke limits consider how to do so; I also
    hope to make the critics of limits think before branding those of us for limits
    as Malthusians.


    I would like to begin with an image from the movie The Legend of 1900 by Giuseppe
    Tornatore.³ The movie’s protagonist, 1900, was named for the year he was born;
    the newborn baby had been found on New Year’s Day in a box by an engine room mechanic
    on an ocean liner. Played by Tim Roth, 1900 never leaves the boat, where he develops
    a gift for piano playing. Famous jazz pianists come to the ship to duel, and he
    beats them all. When'
