    This book is an effort to go in such a direction.


    # WHY LIMITS?


    I am an environmentalist and limits are the central idea of environmentalism.
    “Limits are back⁵ planetary boundaries, secular stagnation, postgrowth, longterm⁶
    For one historian of the green movement, Andrew Dobson, “it seems like Groundhog
    day.”⁷ As in the 1970s, he claims, Malthusian environmentalists prophes that we
    are doomed; and eternal optimists, like Ronald Reagan, back in the day, respond
    that “there are no limits to growth because there are no limits of human intelligence,
    imagination, and wonder.⁸


    Born in 1972, the same year that the Limits to Growth report was published, I
    find that the debate between supposed optimists and pessimists has been exhausted.
    These opposing views are two sides of the same coin. Without limits, capitalism’s
    quest for endless growth does not make sense. Malthus and other early priests
