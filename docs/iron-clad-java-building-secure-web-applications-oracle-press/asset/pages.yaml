  md: '50 Iron-Clad Java: Building Secure Web Applications


    # # Multi-Factor Authentication


    Take a few deep breaths, center yourself, put down the book, and repeat after
    me: The era of password as a sole authentication credential is dead. The most
    fundamental feature you can support for a secure authentication mechanism is multi-factor
    authentication. Multi-factor, or multi-step, authentication involves requiring
    two or more factors at login time (as well as during re-authentication). That
    includes something the user knows (such as a password) in addition to something
    the user has (such as a multi-factor token or mobile application) or something
    the user is (such as a retinal scan or a fingerprint).


    It is fairly straightforward to implement multi-factor authentication. Almost
    every major web application already supports it or is moving in that direction.
    Multi-factor authentication reduces the impact of password theft, mitigates bruteforce
    attacks without the need for account lockout, and in general protects the front
    door of your web application in a way that is much stronger than username and
    password alone.


    # # Seed Storage


    First of all, who is storing a copy of your multi-factor token generator seeds?
    These seeds are used to keep the multi-factor token value in sync between the
    token and the server. If stolen, the seeds are used to generate valid multi-factor
    token values. In March 2011, RSA was breached by a hacker who stole the multi-factor
    token seeds from their SecurID product. Three months later RSA admitted it was
    breached and that information used in the breach was used to hack Lockheed Martin
    and that it would be replacing SecurID tokens for nearly all of its customers.
    Consider solutions where third-party vendors do not control your authentication
    or multi-factor seeds!


    # # Where Do You Send the Token?


    After a user identifies himself during login, and the user''s password is checked
    and proves valid (something the user knows), you next send a token or other secure
    message (the second factor) out of band. The user needs to verify that she is
    actually in possession of the configured device or channel (something the user
    has) in order to complete the login process.


    29 www.wired.com/2011/06/rsa-replaces-securid-tokens'
