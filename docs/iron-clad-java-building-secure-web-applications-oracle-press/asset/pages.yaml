  md: '# Chapter 6: Protecting Sensitive Data 175


    A cryptographic pseudorandom number generator (CPRNG) minimizes this issue by
    algorithmically generating data that appears to be random. The algorithms are
    typically seeded with an initial value, and if the same seed is fed into a CPRNG,
    the same sequence of random data is generated. To provide more randomness, seeds
    are often pulled from the system''s actual random data, and then the CPRNG is
    reseeded frequently as it runs. This supplies a reliable pool of pseudorandom
    data while minimizing the likelihood of blocking.


    Java provides a class called SecureRandom that promises to deliver an unpredictable
    sequence of random numbers whenever you need them. Unfortunately, using SecureRandom
    correctly can be a bit tricky. The underlying implementation of SecureRandom depends
    on the platform. It functions differently on Windows, Linux, and OS X. Rather
    than exploring the details of how the class functions on each platform, we will
    instead focus on providing some general guidance that should apply to most platforms.


    Instead of just creating a default SecureRandom object, we will specify exactly
    which algorithm we want the CPRNG to use.


    ```

    byte b[] = new byte[16];

    SecureRandom sr = SecureRandom.getInstance("SHA1PRNG", "SUN");

    sr.nextBytes(b);

    ```


    Here we have specified SHA1PRNG as the CPRNG, which is included with the SUN cryptographic
    provider. It is important to call nextBytes() immediately after getting the SecureRandom
    object. This helps ensure that you seed the algorithm with a quality source of
    randomness as provided by the native platform. However, depending on the platform,
    this could block, so you might want to execute it in a new thread or otherwise
    handle code defensively.


    Once you have a SecureRandom object, you can use it as a source for many random
    number requests. However, you should periodically refresh the randomness in the
    generator.


    ```

    byte[] reseed = sr.generateSeed(20);

    sr.setSeed(reseed);

    ```


    The generateSeed() method invokes the platform''s native seed generation mechanism
    to return an array of bytes. These bytes can


    More accurately the method uses the seed generation algorithm used by the object
    to seed it.'
