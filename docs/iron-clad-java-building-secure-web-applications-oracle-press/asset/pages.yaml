- img_proc: true
  md: 'of these events happen on an irregular basis but are extremely sensitive in
    nature. Zano also suggests logging, monitoring and alerting on successful or failed
    logins, and especially logins outside of a user''s normal geolocation and time
    zone. Logging and monitoring these basic activities alone can give your incident
    response team warnings when application falls outside the statistical norm.


    Traditional network-based intrusion detection systems (IDS) typically focus on
    attacks below the HTTP layer and don''t provide context within the application
    environment. However, adding meaningful intrusion detection logic with your application
    (that is, logging events that are received inside of your application framework)
    yields significant visibility into attack activity that traditional tools cannot
    see.


    # Detecting Obvious Attack Traffic


    It''s not possible to detect all automated attacks, but a very minimal rule set
    can help detect malicious activity. In "Effective Approaches to Web Application
    Security,"10 Zane Lackey discusses simple techniques for detecting XSS by searching
    for user input containing common XSS attack patterns, such as alert(), document.write(),
    escape(), String.fromCharCode or the image tag with an invalid source attribute
    such as <img src=>. The presentation also notes that even the simplest of SQL
    injection detection efforts, such as looking for UNION ALL, detects a shockingly
    high percentage of SQL injection attempts.


    In addition, it''s often possible to detect easily malicious tools themselves.
    For example, tools such as SQLMap, Havij, Acunetix, and others readily identify
    these with unique User Agent strings. These tools also often corrupt HTTP headers
    in ways that normal application traffic does not,, as modifying static cookie
    values. By looking for anomalies such as this, it''s often possible to detect
    malicious traffic and block it with a minimum of false positive results.


