    # How Does CSRF Work?


    Let us consider the example of a form that a website administrator might use

    to grant a user access to reset cookies.


    +   - The attacker creates a malicious website.

    - The attacker hosts the malicious website.

    - The victim visits the malicious website.

    - The malicious website sends a hidden request to the target website.


    Since the victim''s browser has the session cookies they are automatically included
    in the request, the target website will treat the request as coming from the victim.


    When this form is submitted to give user "Alice" access to execute, it will

    produce an HTTP request like the following:


    ```

    POST /reset-password HTTP/1.1

    Host: target-website.com

    Cookie: session_id=12345abc


    user=Alice&new_password=hackedpassword

    ```


    If user "Larry" wanted to gain execute access for himself, he would

    tply change the value of the user_id parameter to 1 and resubmit

    the request. The only problem is that the server checks the password code. The

    JSESSIONID identifies the valid administrator session which is

    required in order to grant access to other accounts. It is long, random and

    diff to guess by normal means. This is where Cross-Site Request Forgery

    comes in. If Larry were to construct a form that submits the same parameters'
