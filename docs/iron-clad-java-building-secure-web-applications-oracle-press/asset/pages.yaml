  md: '# 20 Iron-Clad Java: Building Secure Web Applications


    # Basic Input Validation Considerations:

    Length of Input


    One often overlooked area of input validation is to validate the minimum and maximum
    length of user input. Validating the length of user input is a simple task either
    through string APIs or via regular expressions. If you forgot this step, users
    can send incredibly large amounts of user input into your application and cause
    harm. The Django framework experienced a major denial-of-service vulnerability
    because it did not validate the length of user input for passwords. What can you
    expect from a project that uses an inferior language named after a snake? We''re
    coffee people here!


    # Validating Numerical Input


    One of the beautiful aspects of the Java language is the various numerical classes.
    Validating raw user input that should be a numeric class is a rather simple endeavor.
    All numeric classes contain a static parse function that takes string input and
    converts it to a formal numeric class. For example:


    ```

    Integer.parseInt(String rawInput) throws NumberFormatException

    ```


    will take a string and convert it to an instance of Integer and throw a NumberFormatException
    if the input is not an integer. These classes are perfect for numerical input
    validation. As soon as possible, get your users'' string numerical input into
    a formal Java numeric class!


