  md: '# Chapter 2: Authentication and Session Management 51


    Email is one potential avenue for token verification. Email verification typically
    takes the form of a link that the user must click, or a one-time code that the
    user must enter into the website in order to log in. Unfortunately, most email
    is not encrypted and should not be considered a safe mechanism for data transfer.
    Email is the worst method for multi-factor authentication.


    SMS is another option for token verification. Be sure to verify the account owner''s
    phone number depending on it for SMS verification as part of multi-factor authentication.
    SMS has the benefit of ensuring that your users are actually in possession of
    their mobile device in order to log in. There are also mobile applications, like
    the one used by Twitter, that can be set to receive push notifications when the
    user attempts to log in. The user can approve or deny the login request directly
    within the phone application without having to juggle numerical codes.


    Of course, if someone''s phone is lost or stolen, an attacker will have access
    to the authentication tokens. If a user''s phone is stolen, will their first thought
    be to access their multi-factor accounts? Probably not, but at least this method
    requires attackers to perform extra steps and specifically target your victims
    instead of shotgun.


    Other mobile applications attempt to do away with the requirement to send and
    receive notifications from the server. These applications use an algorithm to
    generate a stream of tokens based on a timestamp and a pre-agreed seed that is
    set up at configuration time. They allow for multi-factor token generation where
    no data needs to be sent over the network from the server to the user.


    The most secure multi-factor mechanism is a dedicated hardware token. The hardware
    token uses the same approach of generating a token on the fly based on a seed
    and a timestamp according to some algorithm. These tokens often require the user
    to enter a code to activate the token, which provides an additional piece of information
    that an attacker must know in order to log in. Unfortunately, users often balk
    at carrying extra devices and these types of dedicated hardware tokens are usually
    used for the most secure of applications.


