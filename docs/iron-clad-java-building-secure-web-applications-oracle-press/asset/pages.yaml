    to your browser that is otherwise impossible to do via normal browser use. For
    example, what possible values can a user submit from a radio button group?


    ```

    <input type=''radio'' value=''yes'' name=''yesorno'' checked=''checked''/>

    <input type=''radio'' value=''no'' name=''yesorno''/>

    ```


    A normal user of your website would be able to submit yes or no as the possible
    radio button value. There is absolutely no way for one of your users operating
    a standard browser in a non-malicious way to submit a radio button with another
    value. If you received anything else, that would indicate that an attacker is
    using an intercepting proxy tool such as OWASP ZAP, Burp Proxy, Paros Proxy, WebScarab,
    Tamper Data,¹¹ or a similar tool, as we discussed in Chapter 1. These tools allow
    an attacker to modify any aspect of the HTTP request, request parameters that
    are normally immutable or have a limited list of selection choices in the browser.
    When processing form request server proxy, any time an immutable field is “violated”
    with an intercepting proxy, you know that you are no longer facing one of your
    happy users who is trying to buy a nice lamp.¹² This violation occurs only when
    you are under attack. It is prudent to lock this user''s account or take some
    other action that is appropriate for your tolerance of risk.


    # Access Control Violations Visited


    An access control violation can either normal day-to-day behavior of your application,
    or it be a sign that someone is elevating their privileges in some way. In UI
    code, programmers often make access control checks to see if a link or resource
    can be shown to the user. For example:


    ```

    <%= JSP %>

    <% if (user.hasAccess("admin_menu")) { %>\n<a href="/admin/menu.jsp">ADMIN MENU</a>

    <% } %>

    ```


