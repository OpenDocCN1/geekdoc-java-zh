    Again, the point of this is to provide a mechanism where your CSRF token can be
    computed and verified on-the-fly without having to save it server-side. An HMAC
    hash is not easily reversible so there is little risk of exposing the session
    ID, and the CSRF token cannot be forged as long as the key is kept private on
    the server.


    > NOTE

    The double-submit cookie defense can be undermined by cookie forcing attacks.¹¹¹.
    The use of Strict Transport Security is critical to battle cookie forcing attacks.
    We discuss Strict Transport Security in detail 6.


    # Defending Against CSRF with the Challenge/Response Pattern


    The best way to ensure that a user actually intends to perform an action is to
    force the user to enter a value known only to him or her, as a password, or a
    PIN, in order to complete an action. Because an attacker won''t know his victim''s
    password, he will not be able to include information in the hidden form or link
    and CSRF is prevented. Presumably, if an attacker already knows his victim''s
    password, he has no need to bother with trying to create a hidden form, getting
    the user to log in to the victim site, and trying to lure the user to the page
    containing the CSRF attack.


    Requesting that a user reenter their password and/or credentials is the recommended
    method to prevent or initiating very sensitive actions such as changing a user''s
    password or large money transfer. It also has the additional benefit of preventing
    an attacker from executing these actions should they compromise the user''s session
    in some other manner (such as by XSS, or simply sitting down at an unlocked workstation).


    Another way to ensure that a user actually wants to execute an action is to use
    a CAPTCHA.¹² Although CAPTCHA can help defeat some automation,


    ¹¹http://michael-coates.blogspot.jp/2010/01/cookie-forcing-trust-your-cookies-no.html


    ¹² Completely Automated Public Turing to tell Computers and Humans Apart, http:////en.wikipedia.org/wiki/CAPTCHA'
