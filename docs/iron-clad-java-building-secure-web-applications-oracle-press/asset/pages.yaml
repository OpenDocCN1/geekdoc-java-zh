  md: '# 176 Iron-Clad Java: Building Secure Web Applications


    then be used to reseed SecureRandom. Note that reseeding through the setSeed()
    method augments the existing seed; it does not replace the existing seed. This
    ensures that the amount of randomness is not decreased when reseeding. Never call
    setSeed() before nextBytes() as this will cause SecureRandom to bypass the internal
    seeding mechanism in favor of whatever was passed with setSeed(), which will most
    likely reduce your randomness.


    These guidelines should help you create secure random numbers when you need them.¹
    The good news is that Oracle has improved the situation considerably in Java 8.
    The SecureRandomStrong() method, now provides the cryptographically strongest
    random number generator offered by the platform. The update also provides new
    native algorithms to tap into the host''s random number generator and it fixes
    an issue with specifying which native source you would like to use. You can read
    more about these changes in the Java 8 release notes.


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_195_0.png)


    TIP

    Java 8 has a variety of new features to help make your cryptographic work more
    secure. These include:


    +   - **Enhanced revocation certificate checking** The PKIXRevocationChecker class
    can now be used to look up revocation status of certificates of interest.

    - **SSL/TLS Server Name Indication extension** Indication (SNI) extension has
    been added to TLS for supporting virtual hosting. This improvement is useful in
    a situation in which a single host supports multiple HTTPS web applications on
    a single IP address.

    - **Cryptographic algorithm improvements** Additional improvements include improvements
    to high entropy random generation, support for AEAD JSSE CipherSuites, expansion
    of the PKCS 11 provider to include the 64-bit, overhauled JKS-JCEKS-PKCS12 keystore,
    and restricted use of Certs with RSA keys smaller than 1024 bits.


    ¹Cital has published interesting research on SecureRandom. See https://www.cigital.com/justice-league-blog/tag/securerandom/.'
