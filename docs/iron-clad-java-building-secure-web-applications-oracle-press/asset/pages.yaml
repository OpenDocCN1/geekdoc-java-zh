  md: '# 12 Iron-Clad Java: Building Secure Web Applications


    JSON, or a binary file such as an image or document. A typical HTTP response will
    look similar to the following:


    ```

    HTTP/1.1 200 OK

    Date: Thu, 01 May 2014 04:00:32 GMT

    Server: Apache

    Content-Type: text/html;charset=UTF-8

    Set-Cookie: JSESSIONID=3701355FAA6576DC3FD8C2E97E340E4;

    Path=/; Secure=HttpOnly

    Vary: Accept-Encoding

    Strict-Transport-Security: max-age=31536000

    Keep-Alive: timeout=5, max=100

    Connection: Keep-Alive

    <!DOCTYPE html>

    <html lang="en-US">

    <head>

    ... lots more HTML ...

    </body>

    </html>

    ```


    The first line of the preceding response indicates the request was successful
    (200 OK). The response also includes headers that indicate how the browser should
    handle the response (Content-Type, Strict-Security, and so on). The Set-Cookie
    header tells to send a JSESSIONID cookie containing a unique sequence of numbers
    and letters with each following request. This will allow the server to maintain
    a session and personalize content for the user. Finally, the body of the response
    contains the actual HTML page that will be rendered by the browser.


    # H/S Response Headers


    In recent years, a variety of security-centric HTTP response headers have become
    standardized across the majority of browsers. These “browser standard” response
    headers are often easy ways to add security to your web application.


    # Cache-Control HTTP Response Header


    One of the older HTTP security response headers is the Cache-control HTTP response
    header. This response header is a directive to tell the browser not to cache sensitive
    data.


    ```

    Cache-control: no-cache, no-store, must-revalidate

    Expires: -1

    ```'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 1: Web Application Security Basics 13


    No-cache says that the browser should validate the data with every request. No-store
    says that no part of the request or response should be stored at all the first
    place. Must-revalidate says that under no circumstances should stale content be
    served by the browser.


    The Expires header tells the browser when the content should expire and thus be
    requested again from the server. A negative value or a value in the distant past
    should always force content to immediately expire.


    Note that these headers are extremely useful for improving the performance of
    your website by caching static content such as images and stylesheets on users''
    browsers for long periods of time. This will lessen bandwidth consumption and
    make the server more resistant to denial-of-service attacks. Care must be taken
    to ensure that such static content is cached, but any sensitive or user-specific
    data is never stored.


    # Strict Transport Security HTTPS Response Header


    The Strict-Transport-Security response header (HSTS response header) is a simple
    way to force your browser to always use the HTTPS protocol for a certain amount
    of time. This header must be delivered over an HTTPS connection for it to take
    effect. The following response header, when delivered over HTTPS, will force supported
    browsers to use HTTPS for the next 3153600 seconds when contacting that site,
    including all subdomains:


    ```

    Strict-Transport-Security: max-age=31536000

    ```


    HSTS was deemed a standard by the IETF (RFC 6797) in late 2012. Browser support
    is mixed. Firefox and Chrome have supported HSTS headers since version 4 of both
    browsers, Internet Explorer does not support HSTS as of March 2014 but plans to
    support it in the future when IE 12 is published.


    # X-Frame-Options HTTP Response Header


    Clickjacking is a form of attack that tricks a user into thinking he is clicking
    on one location when he is really clicking on another location that could cause
    harm. One of the main defenses used to stop clickjacking is the X-Frame-Options
    response header. We discuss this risk in detail in Chapter 5.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 14 Iron-Clad Java: Building Secure Web Applications


    # X-XSS-Protection Response Header


    Internet Explorer 8 and above support the X-XSS-Protection header to stop some
    forms of cross-site scripting. This is enabled by default for most IE security
    configuration settings, but can be forcibly disabled with the X-XSS-Protection:
    0 response header. This filter can also be forcibly enabled in "block" mode with
    the header X-XSS-Protection: 1; mode=block. While this filter is far from perfect
    (it is only supported by IE and only stops some forms of XSS), enabling it as
    a good defense-in-depth mechanism is prudent. We discuss XSS defense, in depth,
    in Chapter 4.

    While this list of response headers is not all-inclusive, these are some of the
    most important response headers that developers need to master in order to build
    a secure web application.


    # ## Anti-Patterns and Weaknesses


