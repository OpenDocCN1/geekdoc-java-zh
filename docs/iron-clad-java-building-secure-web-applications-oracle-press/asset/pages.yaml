    # # Password Storage and Handling Scale


    So what do you do when you need to handle the password verification and concurrent
    login process for a large number of users? You can certainly throw a lot of hardware
    at the problem and call it a day. But what if you want to have secure password
    storage, and be able to handle a large number of concurrent logins with efficient
    use of hardware? That is where a Keyed-Hash Authentication Code (HMAC) comes in.
    When properly implemented, HMACs can accomplish secure password storage at a massive
    scale (big banks, and so on) already have a good key management infrastructure
    in place. The strength of an HMAC is governed by the strength of the underlying
    hash functions, the size of the key, and the ability to keep the key secret. HMACs
    are essentially as fast as a hashing algorithm and will not be reversible if the
    key is managed properly. However, if the key is stolen or lost, the whole system
    is broken (because the password cracking problem is reduced to a simple hash function).
    When building a password storage system, KDFs like PBKDF2 and script are a good
    first choice. However, we have seen large companies that use script for their
    password storage system consume a significant percentage of their server resources
    just for password processing during peak load! So by moving to an HMAC solution,
    and possibly even making custom hardware for their servers, you are able to radically
    save some money on hardware utilization while still providing a secure password
    storage system. Yeah, crazy.


    A system that uses HMAC is a lot more difficult to engineer for secure password
    storage. You need to isolate the processing of the password to truly protect the
    key. The ideal system is a web service that takes a plain-text string and spits
    out the HMAC hash without ever exposing the key to your application code. This
    HMAC web service should be isolated on separate hardware so that even if your
    database, file system, and web server are all compromised, your password storage
    mechanism is not compromised. Even if your entire database is compromised, at
    least the other websites where user uses his or her password are not also compromised.


    22 www.techweeurope.co.uk/news/hardware-password-innovation-141263'
