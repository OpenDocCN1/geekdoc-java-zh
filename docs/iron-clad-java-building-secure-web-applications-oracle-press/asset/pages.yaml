  md: '# Reflected XSS


    Reflected XSS occurs when an attacker tampers with HTTP requests to submit malicious
    JavaScript code. Upon receipt of the request, the website immediately renders
    the modified content, including the malware script without encoding, back to the
    victim''s web browser. The most likely vectors for malicious code are request
    parameters, but headers, cookies, and REST-style URL parameters are also common
    vectors. Once attackers find a vulnerability, they compose a malicious script
    and lure their victim to call the vulnerable URL by sending a phishing email,
    embedding the malicious request in a website, or something similar. Once the victim
    opens the URL with the attack payload, the JavaScript attack is triggered in the
    victim''s browser. Figure 4-3 illustrates the reflected XSS workflow.


    +   1. Attacker builds a link that includes malicious JavaScript and sends it
    to victim.

    2. Victim clicks on the malicious link sent by attacker.

    3. Server processes the link and returns a page rendered with attacker-supplied
    code.

    4. Attacker-supplied code executes on the victim''s browser.


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_104_0.png)


    FIGURE 4-3. Reflected XSS'
