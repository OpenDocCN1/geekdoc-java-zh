    # Secure Cookie Properties for Session Management


    Since HTTP cookies are the primary way that most web applications save and transport
    the session identifier between the browser and your server, it is important to
    protect them as much as possible. There are two session cookie properties that
    are critical to good web application security. These are the Secure cookie flag
    and the HttpOnly cookie flag. Secure cookies will only be transmitted by the browser
    via an HTTPS connection. Combine Secure cookies with HTTPS and Strict Transport
    Security and it becomes impossible to leak session cookies over a plain-text transport.
    The HttpOnly flag prevents JavaScript from accessing cookie data, but still allows
    the browser to automatically attach cookies to requests that are made to the appropriate
    domain and path. HttpOnly cookies are one very important way to minimize session
    theft over cross-site scripting, but you still need a comprehensive cross-site
    scripting defense strategy, as we discuss in Chapter 4.


    Luckily, most Java Servlet and JEE containers set the Secure and HttpOnly cookie
    settings by default after session creation. Be to verify that this is the case
    with your application server by monitoring the traffic with an intercepting proxy
    such as Burp Suite. You should see the Secure and HttpOnly flags (bold) in the
    Set-Cookie response headers when the application sets a cookie:


    ```

    HTTP/1.1 200 OK

    Set-Cookie: JSESSIONID=9352CB44544E0C89BC83; Path=/;

    Secure; HttpOnly

    ```'
