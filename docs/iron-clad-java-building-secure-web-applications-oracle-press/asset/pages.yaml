  md: '# 142 Iron-Clad Java: Building Secure Web Applications


    How straightforward? Simply import the javax.net.ssl.* package, define the host
    and port, and create a socket:


    ```

    SocketFactory sf = SSLSocketFactory.getDefault();

    Socket socket = sf.createSocket(host, port);

    ```


    Now you have a secure communications channel that can be used like any other Java
    socket connected to a server.


    Creating a secure server socket is equally straightforward:


    ```

    ServerSocketFactory ssf = SSLServerSocketFactory.getDefault();

    Socket socket = ssf.createSocket(port);

    ```


    In both cases, host is a string that contains the hostname and port is an integer
    that represents the port over which the connection should be established. For
    instance, the standard port for HTTPS is 443.

    While this is easy enough, it isn''t the whole story. In security, there are always
    details to keep in mind, and these details, if misconfigured, can reduce the security
    of an otherwise rock-solid security system.


    # Protocol Versions


    Because SSL and TLS have a long history, you want to make sure that you are using
    only the latest secure protocols. You can control what protocols the socket will
    use. The following fragment enables just TLS versions 1.1 and 1.2 on the socket:


    ```

    String[] p = {"TLSv1.1", "TLSv1.2"};

    socket.setEnabledProtocols(p);

    ```


    These two protocols are the current state of the art at the time of writing and
    are the ones you should use if you can. However, not all systems support these
    two protocols. You will likely encounter systems that support version 1.0 of TLS
    and various versions of SSL. Try to stay away from SSL, and instead use one of
    the TLS versions—preferably the most modern version that is supported by your
    systems.


    # Cipher Suites


    The security of the socket depends on two things: keeping the keys secure and
    using appropriately strong encryption. We''ll cover key security later, so in
    this section we discuss encryption algorithms.'
