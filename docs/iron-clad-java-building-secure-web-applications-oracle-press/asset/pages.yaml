  md: '# Chapter 6: Protecting Sensitive Data 167


    The ciphertext is encoded in a way that a reference to the correct key in the
    keyset is included. This feature allows you to simply point the code to the right
    keys. You don''t have to track which key was used in that keyset; Keyczar takes
    care of that for you. The ciphertext is also signed with the HMAC signing key
    that we mentioned earlier. Keyczar uses this key to verify the signature before
    decrypting. If the signature doesn''t match, you know that the ciphertext has
    changed since it was produced and the decryption halts.


    Keyczar also takes care of other behind-the-scenes encryption details as defining
    the mode, generating and storing initialization vectors, and taking care of any
    needed padding. A description of these details is beyond the scope of this book,
    but Keyczar, true to its mission, manages these low-level details—that are frequently
    configured insecurely.


