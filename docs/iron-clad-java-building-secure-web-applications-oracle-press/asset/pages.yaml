  md: '# 68 Iron-Clad Java: Building Secure Web Applications


    designed correctly. In addition, it will make auditing your server access logs
    for security events much easier.


    # Positive Pattern 2: Build a Centralized Access Control Engine/Decision Maker


    While the policy enforcement layer applies the access control checks, the Policy
    Decision Point does the actual work to verify if the subject has the right access
    to conduct the action being requested. Again, this should be a centralized service
    as opposed to checks scattered throughout your code base.


    # Positive Pattern 3: Server-Side Trusted Data Should Drive Access Control Decisions


    Very little data needed for an access control decision should come from the request.
    The user/subject identity information should be server-side in a trusted session.
    The subject''s metadata should all be retrieved server-side. The policy rules
    and other Policy Information Points should come from a trusted server-side resource.
    The only data elements that should come from the request (and can therefore be
    tampered with) should be the object''s identity and the feature being requested.
    Retrieving role data from the request is bad practice practice because an attacker
    could easily make himself an admin or other privileged role!


    # Positive Pattern 4: Group Subjects, Objects, Actions, and Other Metadata


    In order to make administration more manageable, grouping is fundamental to good
    access control. At the very least, subjects and users can be grouped so policy
    rules only need be applied to the group instead of each individual member separately.
    For some kinds of access control design, actions and features that can be administered
    together are also good candidates for grouping. For example, a car management
    program may have features as viewCar, diagnoseCar, and updateCar. All of these
    features can be rolled into one "feature group" of "carManagement" to make it
    easier to apply several features to one subject or subject-group. Grouping also
    makes it easier to audit policy for your user base because you don''t have to
    worry about individual users have a certain permission—you will know based on
    the group or groups they are assigned to.'
