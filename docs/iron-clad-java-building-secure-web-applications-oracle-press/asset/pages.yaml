    # Password Policy


    Traditional wisdom on password policy is often out of date. We see many policies
    that enforce at least one uppercase letter, one lowercase letter, a number, and
    a non-alphanumeric character. How many corporate security policies would allow
    "Password1!" to be an acceptable password? It is ten characters and it contains
    all the special characters, but is it secure? No! Way! In fact, "Password" is
    one of the most commonly used passwords in business, with "Password1!" not far
    behind in the "worst password" category. Although it''s still important to enforce
    special types of characters in passwords, it is just as important—if not more
    so—to ensure that your users are not using passwords that contain dictionary words
    and to ensure that they are not using commonly used passwords, even ones that
    would pass traditional password policy. Even better, do not depend on passwords
    at all because the era of passwords as a single authentication factor is dead.
    It''s time to shift all of our systems to multi-factor authentication.


