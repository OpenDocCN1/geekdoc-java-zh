  md: '# Chapter 2: Authentication and Session Management 33


    # Attacks Against Authentication


    This section will explore various ways that attackers will harm your login or
    session management mechanisms by achieving access without the proper credentials
    or permission. We will also explore various ways to defend against these common
    authentication layer attacks. Let''s dig in!


    # Session Hijacking


    One of the most significant risks to your authentication layer is the risk of
    session hijacking. When an attacker can guess or steal your session ID, when the
    attacker can force a victim to leaves him or herself logged in to an account on
    a public computer, the threat of session hijacking surfaces.


    The ways in which hackers compromise your session are many. As discussed in Chapter
    4, session hijacking via cookie theft can occur through cross-site scripting with
    attacks such as the following:


    ```

    <script>

    img var = new Image();

