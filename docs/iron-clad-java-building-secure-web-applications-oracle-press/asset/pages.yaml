  md: '# Chapter 5: Cross-Site Request Forgery Defense and Clickjacking 133


    for each request. In these cases, verifying the CSRF token at a central enforcement
    point is an acceptable practice. Limiting requests to only the appropriate HTTP
    verb is good practice and reduces the attack surface but is not absolutely necessary
    to build a secure web application.


    # XSS Defense and CSRF Protection


    Any XSS vulnerability can be used to circumvent your CSRF defense. XSS can be
    used to scrape tokens from pages and replay them. XSS can be used to pop up a
    fake re-authentication challenge. XSS can access cookies that do not have the
    HTTPOnly flag. XSS can be used to simulate any request. Therefore, we normally
    prioritize XSS vulnerabilities as more dangerous than CSRF vulnerabilities. Again,
    XSS can be used to circumvent any CSRF defense and therefore XSS defense is a
    critical first step to a complete CSRF defense.


    # Clickjacking


    Clickjacking,¹⁴ otherwise known as a “User Interface Redress attack,” is a form
    of attack that tricks a user into clicking on one location when they are really
    clicking on another location that could cause harm. This attack, similar to CSRF,
    is often launched from a site other than the site being attacked.


    Clickjacking attacks are conducted by


    +   - Loading a vulnerable website in a third-party site via an iframe or similar
    construct

    - Concealing the presence of the vulnerable website by either making it transparent
    or covering it with other opaque layers

    - Tricking the user into thinking she is clicking in some area of the third-party
    website, when the user is in reality clicking in some area of the vulnerable website


    > ¹⁴The term “clickjacking” was created by Jeremiah Grossman and Robert Hansen
    in 2008: www.securityfocus.com/news/11535/'
