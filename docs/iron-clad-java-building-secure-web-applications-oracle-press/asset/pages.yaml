  md: '# 166 Iron-Clad Java: Building Secure Web Applications


    If there is already a primary key in a keyset, the promote command will also demote
    it to active when promoting another key to primary. However, there is nothing
    to keep you from demoting your only primary key to active status, leaving you
    with no primary key and thus a keyset that cannot encrypt or sign data. It is
    a good safety check to inspect your keyset''s meta after manipulating keys to
    ensure that the keys are in the states you expect.


    The promote and demote commands cover most of the key management capabilities
    in Keyczar. However, you can also remove inactive keys from the keyset when they
    are no longer used. The revoke command makes this possible, but it only works
    when applied to a key that is already inactive. If key version 1 is inactive,
    then this will remove it:


    ```

    $ KeyczarTool revoke --location=/keyczar/keys/demo --version=1

    ```


    Use with care once you revoke a key, it is gone. If you have data still encrypted
    with that key, the data is effectively lost because there is no way to decrypt
    it without the key.


    The key versions are numbered in increasing order. A new key version is one higher
    than the current highest key version. Keyczar does not keep track of previous
    versions or their numbers. Normally this won''t present any sort of problem, but
    should you revoke the current highest key version, then that version number will
    be used again. Similarly, if you revoke all the keys, the next key you add to
    the keystore will be given version 1. This is just something to keep in mind as
    you work with the keys.


    # Encryption and Decryption


    Encrypting and decrypting data with Keyczar is straightforward. Using the keyset
    you created earlier, you can encrypt data with the following code:


    ```

    String path = "/keyczar/keys/demo";

    Crypter crypter = new Crypter(path);

    String ciphertext = crypter.encrypt("data");

    ```


    Then you can decrypt that data later using very similar code. The key thing to
    keep in mind is that the path must point to the same keyset.


    ```

    String path = "/keyczar/keys/demo";

    Crypter crypter = new Crypter(path);

    String plaintext = crypter.decrypt(ciphertext);

    ```'
