  md: '# Remediation Checklist


    To prevent SQL injection, use the following techniques:


    +   - Use query parameterization for all queries and all variables (most important).

    - When query parameterization is not possible, employ whitelist input validation.

    - Limit database connection access (Principle of Least Privilege).

    - Manually escape all inputs (last resort).


    # Summary


    As you see, injection is one of the most dangerous risks that your applications
    must contend with. Any time you are building a string-based command that includes
    untrusted input, injection is possible. When considering the various types of
    injection, SQL injection is perhaps the most common and dangerous. The varied
    techniques of input validation, query parameterization, limiting database permissions,
    and, as a last resort, escaping individual variables will lead you toward building
    injection-resistant applications.'
