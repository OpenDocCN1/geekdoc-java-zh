  md: '# Chapter 6: Protecting Sensitive Data 161


    of algorithms. As you will see soon, Keyczar includes one algorithm just for encryption,
    a couple of algorithms for signing, and one that can be used for both. These algorithms
    fall into two types: symmetric and asymmetric.


    # Symmetric and Asymmetric Cryptography


    Symmetric cryptography is the usual kind of cryptography that we hear of most
    often. It is used for encryption rather than signing. A secret key is used to
    “scramble” information in a way that is virtually impossible to unscramble without
    the secret key. This type of cryptography is called symmetric because the same
    key is used for both encrypting and decrypting the data. That key must remain
    secret for the system to remain secure. This secrecy requirements are why symmetric
    cryptography is also known as secret key cryptography.


    Asymmetric cryptography, also known as public key cryptography, is essential to
    signing. Public key cryptography uses two different keys. One, the private key,
    is kept secret and known only to the sender. It is used to sign the data. The
    other key can be public and can be known by anyone—hence the name, public key
    cryptography. This public key is used to validate the signature. There is no way
    to derive the private key from the public key—at least the math and computing
    power is not yet available to do.


    In some asymmetric algorithms, the public key can also be used for encryption.
    Data encrypted with the public key can only be decrypted by the private key. These
    algorithms can be used for both encryption and signing. Not every asymmetric algorithm
    has this property. Many let you verify the signature of the data and provide no
    way to actually recover the signed data.


    Now that we''ve covered the basics of the different types of cryptography supported
    by Keyczar, let''s take a look at the system itself. Note that we''re using version
    09.71g (release 09.6.13).


    # Keysets


    Keyczar''s approach to key management relies on the idea of keysets. A keyset
    is a group of keys for a specific algorithm and purpose that are managed together
    as a whole. Your application might use several keysets: one for writing credit
    card information to a database, another for sending encrypted parameters to a
    client, and another for signing requests to access a secure API across the network.'
