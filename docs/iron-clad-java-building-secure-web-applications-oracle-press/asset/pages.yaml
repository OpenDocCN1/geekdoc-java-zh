  md: '# 138 Iron-Clad Java: Building Secure Web Applications


    credit card numbers. Social Security numbers. Passwords. Secret recipes for sugar
    water. Eventually your application will need to handle sensitive information.
    Whether you are writing the data to a file, storing it in a database, or sending
    it across the network, your code needs to keep the information secure. In this
    chapter, we cover techniques to keep data safe from prying eyes.


    Before digging into those techniques, let''s first set the stage by reviewing
    the threats that you need to block. Most people immediately think about the danger
    of an eavesdropper harvesting confidential data as it passes over a network. To
    be sure, that is a real threat, and the widespread adoption of the “cloud” means
    that more applications than ever need to protect against this threat. We need
    a way to send information across the network without worrying about eavesdroppers.


    Another type of network-based threat is the attacker who isn''t interested in
    the data you''re sending; she just wants to pretend to be you. These impersonators
    might be able to send messages that look like they came from your application.


    For instance, let''s say you are building a web application to open a vault door
    (it seems crazy, but someone somewhere is probably doing this). In order to open
    the vault door, you send a specially crafted XML message that says: open sesame.
    You might protect the message so that the attacker can''t determine how to say
    “open sesame”, but if the attacker can watch you send the protected message, then
    the attacker might be able to record that message and play it back. The attacker
    doesn''t know what the message is or how it works. She just knows that if she
    sends the same message she watched the vault opens. We want to prevent this kind
    of impersonation.


    The next common threat that most developers think about is that attackers cracking
    password files. While we''ll leave the network and system level protection of
    password files to network administrators (we''re sure there''s a book or two on
    the subject), application developers can ensure that the password file is not
    going to easily reveal its secrets in the case it is actually accessed by attackers.
    Password protection is covered elsewhere in this book.


    Finally, applications that store valuable information are prime targets for attackers
    attempting to extract that information. This threat might manifest itself in attacks
    that steal whole files or databases, or the attacker might attempt something more
    surgical and try to extract just the targeted information using SQL injection
    or other exploits.'
