  md: '# Chapter 6: Protecting Sensitive Data 147


    A common case for custom hostname verifiers is to accommodate development environments.
    Certificates on development machines may not match exactly, and rather than spend
    the time fixing the certificates, many developers will simply use their own hostname
    verifiers as workarounds. Just make sure that your development code doesn''t run
    in production.


    If you need HTTPS-style hostname validation in a low-secure socket connection,
    as opposed to an HTTPS connection, you can use the SSLParameters class, as shown
    here:


    ```

    SSLParameters sslParams = new SSLParameters();

    sslParams.setEndpointIdentificationAlgorithm("HTTPS\nsocket.setSSLParameters(sslParams);

    ```


    The socket in the preceding code will now verify the server''s hostname using
    the rules for verifying hostnames in an HTTPS connection.


    Let''s take a quick look at the subtleties in checking a certificate''s expiration
    date, as mentioned earlier. As you would expect, if a certificate is part of a
    certificate chain and the certificate will throw an exception before establishing
    the connection and transmitting data. However, if the client explicitly trusts
    the server, the socket will connect and encrypt traffic even if the certificate
    has expired. In this case, "explicitly" means that the server''s validity has
    been added to the client''s truststore and the certificate''s validity is not
    verified using a certificate chain. In this case, you will need to check a certificate''s
    expiration date yourself using the checkValidity() method of the X509Certificate
    class. We show an example of that in the next section on trust managers. To be
    clear though, this is an edge case and is not needed when you are relying on validation
    via a CA''s signature.


    # Trust Managers


    The natural place for implementing the checks described is during the handshake,
    the portion of the TLS protocol where the connection is built and trust is established.
    The JSSE uses trust managers to determine if the code should trust the other side
    of the connection.


    > 6 A better approach, however, would be to create custom keystore for your development
    environment. Keystores are covered shortly in the "Certificate and Key Management"
    section.


    > 7 Truststores hold public key certificates in Java and are discussed in more
    detail later in the chapter.'
