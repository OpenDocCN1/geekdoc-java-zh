  md: '# Chapter 10: Secure Software Development Lifecycle 249


    The relationship between project managers and engineering staff is often tenuous.
    However, project managers play a crucial role in ensuring budgets, time commitments,
    promised features, and necessary security engineering are achieved. When push
    comes to shove and commitments are looming, project managers often have the unfortunate
    role of deciding what gets cut. Often, PMs will decide to cut things that are
    less noticeable to management and customers. For example, cutting a major feature
    would be visible to all, but not polishing a certain feature might sneak through
    the cracks. And security vulnerabilities, especially nonfunctional (non-visible
    quality-centric) requirements, are something that can easily be pushed back in
    the schedule without management or users noticing. The problem is that your adversaries
    will notice. Or that big client or company that wants to acquire your IP will
    insist on your software passing a security review before signing on the dotted
    line. This is why it is so crucial to budget time and resources for security activities,
    both before and during the development process. A good project manager will make
    sure that this often "invisible" need is clearly accounted for in a visible way
    before the team.


    # Role: Developer


    While managers are managing and architects are architecting, someone needs to
    do the actual work of writing and maintaining the actual code. A great software
    developer is perhaps the most important individual when it comes to building secure
    software. When times are tough and budgets are lean, the best developers are the
    last to go. When emergencies happen and fixes are quickly needed in software,
    your best developers are the first ones you call. Developers, like any beautiful
    and delicate flower, need care, feeding, and occasional sunlight² A talented developer
    who is uneducated about security, however, can be a disaster. They can rock out
    new code and features very rapidly, but will also introduce many vulnerabilities
    in the process! That is why it is critical that you buy several copies of this
    book and give one to each of the developers on your team. At the very least, ensure
    your developers already have the secure coding knowledge they need early on a
    project''s lifecycle. We recommend that developers should at least be trained
    on the secure coding techniques that are relevant for their project and technology
    stack, and on how to use the tools and methods that


    > ² "mushroom" would be a more apt description.'
  merge: -1
