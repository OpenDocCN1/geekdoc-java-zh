    # # HTTP Security Considerations


    It’s important to have a fundamental understanding of the HTTP protocol in order
    to build a secure web application. HTTP, or Hypertext Transfer Protocol, is a
    simple, stateless, and response protocol that drives the vast majority of web
    traffic.


    # # HTTPSPS


    HTTPS, or Hypertext Transfer Secure Protocol, provides a variety of different
    encryption services to protect user data transport, such as protecting data while
    it’s traveling over a wired or wireless network. HTTPS allows for confidentiality
    (to protect your data from being seen), integrity (to protect your data from being
    changed) and (to ensure that the domain you are visiting is really the real version
    of that domain), among other benefits.'
