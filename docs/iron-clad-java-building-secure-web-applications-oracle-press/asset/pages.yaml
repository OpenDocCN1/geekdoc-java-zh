  md: '# Chapter 9: Logging, Error Handling, and Intrusion Detection 223


    # What to Log


    First of all, what should developers log? If you log too much on a highly hit
    web application, disks will fill and performance may be impacted. Even worse,
    this will make it more difficult to find the truly meaningful data in the event
    of a breach. You need to log with meaning.


    Many developers will already recognize the need to log the timestamp, a criticality
    level (warning, error, fatal, and so on), what feature is being requested, and
    what state the application is. For auditing and accountability purposes, you also
    need to log the username, IP address, and some way to tie all log entries from
    a particular session together (unless your application is ever hit by one person
    at a time—in which case, why are we even having this conversation?). Additionally,
    a transaction ID or activity ID would be helpful (for example, ADD_USER, ASSIGN_PERMISSION,
    READ_FILE, and so on). This provides additional granularity over the session alone
    and is useful to correlate a user''s activity with site features within a particular
    session.


    Some log entries are from an anonymous (not logged-in) user, who needs to be clearly
    noted in the log. Other log entries are from authenticated user behavior, and
    you need to tie log entries from the same user session together. The session ID
    would seem like it is ready made for this purpose, but as we already discussed
    in Chapter 2, you need to treat your session IDs with the utmost of care. We recommend
    logging a cryptographic hash of the session ID, rather than the session ID itself.
    A hash can be computed quickly, but cannot be reversed to find the actual session
    ID, and the hash value will be the same for every entry in the same session.


    > TIP

    Do not log the user''s session ID because this could leak critical authentication
    data to insiders! Instead, log a hash of the session ID so you can reference multiple
    log entries to the same session without exposing the session ID itself.


    # Security-Related Log Events


    Operational environments may use multiple log files for different types of events.
    However, it is sometimes easier to follow what happened if all of your log events
    are in the same log file. If your application will use a single log file, you
    need a way to clearly delineate which events are security'
