  md: '# Proven Methods for Building Secure Java-Based Web Applications


    Develop, deploy, and maintain secure Java applications using the expert techniques
    and open source libraries described in this Oracle Press guide. Iron-Clad Java
    presents the processes required to build robust and secure applications from the
    start and explains how to eliminate existing security bugs. Best practices for
    authentication, access control, data protection, attack prevention, error handling,
    and much more are included. Using the practical advice and real-world examples
    provided in this authoritative resource, you''ll gain valuable secure software
    engineering skills.


    +   - Establish secure authentication and session management processes

    - Implement a robust access control design for multi-tenant web applications

    - Defend against cross-site scripting, cross-site request forgery, and clickjacking

    - Protect sensitive data while it is stored or in transit\- Prevent SQL injection
    and other injection attacks

    - Ensure safe file I/O and upload

    - Use effective logging, error handling, and intrusion detection methods

    - Follow a comprehensive secure software development lifecycle


    Code examples in the book are available for download at www.OraclePressBooks.com.


    For a complete list of Oracle Press titles, visit www.OraclePressBooks.com.


    Learn more. Do more.

    MHPROFESSIONAL.COM


    Follow us on Twitter @OraclePress


    AVAILABLE AS AN EBOOK


    Programming/Java'
