  md: '# Cross-Site Building Secure Applications


    CSRF is a type of attack which prevents the browser from making unauthorized requests
    on the server, often without user knowledge. This vulnerability allows session
    reading because it later takes advantage of the implicit trust-based model between
    domains. To prevent this, several methods include:


    Referer headers, as well as other defenses such as the submit cookie defense;
    while the synchronized token pattern is also commonly used, relying based on a
    variety of options is discussed later in the chapter. But first, let''s achieve
    a deep understanding of what CSRF is and why it is so dangerous to the security
    of your web applications. Cross-site request forgery occurs when evil actors trigger
    actions in the same time as an example of the most common CSRF attack scenario:


    +   1. The user is currently logged into a website that is vulnerable to CSRF.

    2. The user visits a malicious site, which is another website in the same way.
    This site hosts a CSRF attack against the vulnerable website.

    3. The CSRF attack code, from the site, tricks the browser into making requests
    against the vulnerable site in step 1 without the user knowing. Because the user
    navigates to another site and does not log out, the malicious requests are executed
    with the same permissions as if the user was browsing the site itself.


    Although this scenario is the most common CSRF attack sequence, it is not the
    only one. CSRF attacks can be initiated on the vulnerable website via email, or
    on a third-party website. Cross-site request forgery can be used to force a victim
    to trigger any other action. Actual CSRF attacks are often initiated by the features
    in the vulnerable website, namely CSRF attack-gaining access, account turning,
    or creating CSRF entries via a web admin console or traversing pages with user
    privileges.'
