  md: '# 180 Iron-Clad Java: Building Secure Web Applications


    Make no mistake: Many web and web service applications are simply glorified database
    applications. Programmers interface their web applications to databases via structured
    query languages such as SQL, OQL, and HQL. Improperly structured queries are a
    leading cause of exploitation in online applications and are infamously known
    as SQL injection!


    # What Is SQL Injection?


    SQL injection occurs when untrusted data such as user data from application web
    pages are added to database queries, materially changing the structure and producing
    behaviors inconsistent with application design or purpose. Clever attackers exploit
    SQL injection vulnerabilities to steal sensitive information, bypass authentication
    or gain elevated privileges, add or delete rows in the database, deny services,
    and in extreme cases, gain direct operating system access, using the database
    as a launch point for sophisticated attacks against internal systems.


    SQL injection is by far the most dangerous vulnerability impacting online applications
    today. When you read that hackers have stolen 450,000 user accounts or 130 million
    credit card numbers have been exposed it is very likely that the application was
    attacked using SQL injection. Fortunately, there are many tools and techniques
    you can leverage to protect your applications. These software tools generally
    fall into two categories: dynamic analysis and static analysis. Dynamic analysis
    tools work by scanning applications at runtime to test for SQL injection by rapidly
    testing a large number of known attack patterns and looking for variations in
    the server''s response, which indicates the presence of vulnerability. Once a
    vulnerability is confirmed, these tools can automate query construction to facilitate
    easy review of database structure or modify data. Static analysis tools fulfill
    the same purpose but instead test program code. Static analysis tools are beneficial
    because code can be reviewed or analyzed as it is developed. Any vulnerability
    discovered earlier can be remediated in the development process, reducing overall
    costs of the project. Dynamic analysis tools are beneficial when enough work has
    been completed so the application can execute. The best practice is to combine
    both techniques as you include security testing into your development processes.'
