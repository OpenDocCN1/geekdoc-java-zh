  md: '# Chapter 10: Secure Software Development Lifecycle 255


    as “ensure that not all database queries are parameterized with bound variables”
    can have a powerful positive effect. Less clear requirements such as “make sure
    access control is implemented” often leave developers scratching their heads,
    or moving down a path that is not what you intended in the first place.


    Technical requirements are often broken down into two or more major categories:
    functional and nonfunctional requirements. Functional requirements are visible
    requirements that can often be tested by a standard QA professional. From a security
    point of view, these visible requirements may look like: “Ensure that users provide
    their current password during the change password process” or “Ensure that the
    forgot password workflow follows these X steps” or “Make that only users with
    administrative entitlements are allowed to visit the main admin page.” The benefit
    of this functional security requirement detail is that these requirements can
    be used not only to manage developers, but also to build a detailed security testing
    plan that can leverage QA staff.


    Nonfunctional requirements are a different matter. These are the hidden “quality-centric”
    requirements that do not translate easily in a testing plan for QA staff. A good
    example of a nonfunctional requirement that most developers have already heard
    is “make it fast.” Over time, performance requirements have matured from vague
    allusions to speed, to maximum page rendering times, transactional throughput,
    and total concurrent users, and sophisticated tools have been developed to ensure
    that these goals are met.


    Nonfunctional requirements are built for developers, such as “Make sure that all
    queries are parameterized” or “Make sure that passwords are stored salted PBKDF2-SHA256
    with 2048-bit keys and at least 150,000 iterations.” It’s often not realistic
    to ask QA to verify these requirements. Often, you need a security professional
    to accurately verify it so a proper balance in detail is required. We want to
    ensure that the developer accomplishes the right security goal without forcing
    them down a path that may not be appropriate for the specific problem they are
    facing. However, nonfunctional security requirements should at least force a conversation
    between developers and security architects about what security controls are needed,
    and sometimes this is all you need to move developers in the direction of secure
    software. Once developers understand what security controls are required and why
    they are important, most are more intelligent and diligent enough to see it through.


    A good source resource to help you start down the path of nonfunctional (and other)
    security requirements is the OWASP Secure Coding Quick Reference Guide and the
    OWASP Application Security Verification'
