    # Manual Penetration Testing


    Tools are great, but they are useless without a knowledgeable person to wield
    them. Everything we do as developers involves custom development, so why should
    you trust a cookie cutter to protect your app? This is where professional security
    testers (a.k.a. penetration testers or, simply, pentesters) come into play.

    Pentes excel at doing deep investigations of issues, investigating business workflows,
    and verifying the issues discovered by other tools. Pentesters can also chain
    a variety of flaws together to craft a complete exploit. A complete exploit can
    help explain the severity of an issue to management in better terms than route
    output from a tool. A manager might hear SQL injection and get a glazed look in
    his eyes, but if he hears "SQL injection helped me infiltrate your database to
    discover password hashes... allowing me to log in with an administrator account,
    and then transfer money to third parties," that will really get his attention.

    Pentesters have their drawbacks, too. Good penetration testers are rare, expensive,
    and they don''t scale very well. In an environment using a rapid development cycle
    or "extreme coding," it can be difficult for a sole pentester to keep up. A combination
    of DAST, SAST, and knowledgeable pentesters is often best solution for the best
    use of scarce resources.


