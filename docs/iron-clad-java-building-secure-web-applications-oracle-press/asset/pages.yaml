  md: '# 244 Iron-Clad Java: Building Secure Web Applications


    This chapter is primarily intended to help you stop a software insecurity disaster
    before it happens. A secure software development lifecycle (SSDLC) includes a
    wide range of security processes and activities through the design, development,
    and live execution of your software. None of this is easy or scientific and although
    many organizations use similar processes to build secure software, the intricacies
    and culture of most organizations are very different, even among organizations
    that claim to use the same software building process. While process is often one
    of the “softer” topics in secure coding, it is also one of the most important—especially
    for large organizations.


    The more mature your team becomes at implementing a secure software development
    process, the earlier security bugs in your software can be addressed. Addressing
    vulnerabilities earlier in the lifecycle saves money and brings down the overall
    cost to build a secure product. It is also critical to ensure that “fixed” security
    bugs are not reintroduced by rolling back code or because of a new programmer
    who is less skilled at secure development should lead to fewer security incidents
    in your live software. Even when and if you do get breached, a mature SDLC includes
    good incident response and has prepared software and other processes to make handling
    and managing a hacking incident well-thought-out process.


    # Averting Disaster Before It Starts


    What is more expensive? Investing in software security and the construction of
    secure software from the start? Or is it more expensive to pay for the recovery
    from a hacking event and the retrofit needed to prevent future attacks? It really
    can go either way. Are you feeling lucky, punk? In one camp, we have the cry of
    “Let’s get back to real engineering and be more careful about the security properties
    we’re building in to our software.” This camp thinks it is much more costly to
    recover from an exploit than to do the right thing in the first place. In the
    other camp, we have the cry of “Move fast and we can worry about security later
    or just pay for cybersecurity insurance or just wait until we get hacked and pay
    for it.” Really, it could go either way. Before making that decision, you have
    to make a clear inventory of your site and assess the overall risk faced by your
    application. In order to do this you must consider your assets, the possible motivations
    of an attacker, and the potential outcomes of a security breach.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Assets


    Assets are things that are accessible through your website and might be of some
    value to an attacker. The types of assets your website handles will help you in
    understanding the motivations of a theoretical attacker. The following list is
    a sample of assets that an attacker might want:


    +   - Money

    - Credit card numbers

    - Trade secrets

    - Personally identifiable information (PII)

    - Passwords or encryption keys

    - Access to back-end systems


    In addition to these assets, as the Internet of Things advances, you will need
    to consider actual physical devices that your web application can access. We have
    already seen presentations from security researchers on remotely hacking in to
    webams and toys. The list of connected devices is growing to include cars, industrial
    equipment, and many other things we interact with on a daily basis.


    # Motivations


    If your website has valuable assets or moves money, you will almost certainly
    be facing highly motivated and highly skilled attackers, and you had better invest
    in security. Likewise, we are seeing state sponsored hackers after industrial
    and trade secrets. Why would a hacker want to attack your site? Consider the following
    possibilities:


    +   - Money!

    - Information

    - To impersonate or stalk your users

    - Shame you before the world (hacktivism)

    - Personal/organizational vendetta (such as Anonymous vs. HBGary)'
  merge: -1
  pgno: 264
- img_proc: true
  md: '246 Iron-Clad Java: Building Secure Web Applications


    +   - LULZ (such as Anonymous vs. Scientology)


    +   - Just to prove they can


    # Outcomes


    What happens if you get hacked? If all you are doing is providing a forum for
    people to post cute groundhog pictures, then maybe it doesn''t matter so much.
    But what happens when you have the biggest groundhog site on the Web and a security
    incident costs you thousands of dollars per day in lost advertising? The following
    are some outcomes of a hack:


    +   - Money stolen


    +   - Downtime causes lost revenue


    +   - Trade secrets lost


    +   - Regulatory fines/penalties


    +   - Lose the trust of your users


    Beyond more money, there is another factor to consider—consumer confidence. Once
    you lose the trust of your users it is very difficult to win it back. Simply fixing
    the issues and increasing your security budget is not enough. Money cannot buy
    back lost confidence overnight. Long after the software is remediated, concerns
    and questions can linger in the minds of users for years. The currency of consumer
    confidence is long and steadfast dedication to your security goals. It is better
    never to lose it and the cost to restore it is astronomical.


    > TIP


    When you get hacked, the “cost” from the event might not be monetary. Lost trust
    or lost morale can cause significant harm to your organization and is often hard
    to quantify. Estimating the true risks to your applications can be difficult.
    However, if you can quantify it to any extent, it can help you make a business
    case for more security resources. The fact is that almost nobody says security
    is not important at all, but just how much to apply, and where and when to apply
    it, can be difficult to know.'
  merge: -1
