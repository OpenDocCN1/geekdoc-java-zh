  md: '# Dangerous Characters in Input


    Any type of string-based command interpreter can be injected upon. LDAP, operating
    systems, file I/O HTML, XML or JSON parsers, database queries, and more can be
    injected when untrusted data is mixed with untrusted data. It is unfortunately
    very common for developers to leave forms of injection that do not have good APIs
    to help defend against. In these situations, the developer must understand the
    specifications of the software she plans to use and escape untrusted input for
    any characters reserved by the specification. So, for example, characters such
    as *, <, >, / are all considered "code" and not "user data" when interpreted by
    the LDAP parser. Proper escaping and input validation is essential to ensure the
    system does not get untrusted user data confused with reserved characters.


    For command injection, proper defense depends upon the operating system. However,
    characters such as CRLF, CR, LF, null, ;; and so on can cause harm in the context
    of command injection, previously discussed.


    Another example is the Java null byte injection vulnerability. Java had a nasty
    bug for a while that enabled the user to pass in a <null> byte to terminate a
    string, which produced interesting results. The following null byte attack is
    used to bypass protection that limits user input to HTML files by checking that
    the file extension matches "html". However, the null byte injection attack that
    follows allows the attacker to steal other sensitive data.


    +   * Imagine you are a web application and you are receiving this

    * input from your web server, ouch. If you check the file name

    * ends in .html you might make the assumption it''s an html

    * document being accessed. Instead, this will dump the

    * /etc/passwd file!


    ```

    String txt = Start.readFile("/etc/passwd\0.html");

    ```


    This vulnerability has been fixed for some time, and of course you keep your JVMs
    updated for all of your Java applications, right?


    > 6Java Null Byte Injections, December 2007, Arshan Dabirsiaghinhttp://i8jesus.com/?p=9'
