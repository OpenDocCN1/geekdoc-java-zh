    those threats: Can data be read by unauthorized people? Can you tell if someone
    tampers with the data? Can you verify who really sent the data? Will you know
    if someone copies and sends the data again? The tools we described in this chapter
    provide great defenses against a variety of security challenges, but they need
    to be used carefully with thought given to the threats.


    # Signing and Verifying


    Creating and verifying signatures with Keyczar is just a matter of a few lines
    of code. Before we dig into that code, let''s first quickly create a signing keyset
    as all of the previous keysets we looked at were for encryption and decryption.
    Remember that you cannot use the RSA keyset created earlier even though RSA is
    an algorithm that can be used for both encryption and signing. The RSA keyset
    was created with a purpose of crypt and Keyczar will only allow it to be used
    for encryption and decryption. You need to create a keyset specifically for signing.


    Use the same create command you used earlier, but specify sign as the purpose:


    ```

    $ KeyczarTool create --location=/keyczar/keys/dsa \

