    # HTTP/S POST Request


    The HTTP POST request is a more secure way to transport sensitive data.

    The following POST has three properties that allow for the secure transport of
    sensitive data: The POST request is an HTTP request, the HTTPS verb is POST, and
    the sensitive data is in the body instead of the URL.


    ```

    POST https://www.codemagi.com/user/login HTTP/1.1

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.9; rv:29.0)

    Gecko/2010101 Firefox/29.0

    Accept: text/html,application/xml,q=0.9,**

    Accept-Language: en-US,en:q=0.5

    Referer: http://www.codemagi.com/

    Cookie: SESSIONID=39189CF2C3D7C95AE82B1E808F8F

    utma=13951103.202831970.139818959.139818959.139818959;

    tmb=13951103.2.10.139818959.__utmc=13951103

    utz=13951103.139818959.1.utmccr=(direct) |utmccn=(direct)

    Connection: keep-alive

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 59

    Host: www.codemagi.com

    ```


    ```

    action=login&start_in=&username=August&password=FluffyBunny

    ```


    By putting the parameters in the body of the request instead of the URL, the submitted
    data is not leaked in the browser history list, referer headers, or server access
    logs.


    > TIPnSubmit sensitive data only over HTTP POST in the POST body!


    # HTTP/S Response


    When an HTTP server receives a request, it will return an HTTP response, which
    includes the HTTP version and response code, headers, and the response body. The
    response body is typically HTML, but it can also be XML,


