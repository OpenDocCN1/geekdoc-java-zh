  md: '# 224 Iron-Clad Java: Building Secure Web Applications


    related and which constitute normal operation. The following types of security-related
    events should always be logged.


    > TIP

    Consider prioritizing or highlighting log entries of actions conducted by highly
    privileged users, as admin or super user accounts.


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_243_0.png)


    +   - Successful logins

    - Failed logins

    - Logouts

    - Password or security question changes

    - Profile changes, such as a change of email address

    - Password reset attempts

    - New user registration

    - User-de-registration

    - Authorization failures

    - Changes to access levels, such as granting admin or superuser

    - Operational activities, such as backups (for example, exporting my Twitter feed)

    - Any system administration activity

    - Significant input validation failures

    - Any other sensitive operation...


    # What Not to Log


    According to item 8.10 in OWASP ASVS Error Handling and Logging Requirements (https://code.google.com/p/owasp-asvs/wiki/Verification_V8):


    Verify that the application does not log application-specific sensitive data that
    could assist an attacker, user''s session ids and personal or sensitive information.'
