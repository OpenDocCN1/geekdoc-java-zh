  md: '# Chapter 5: Cross-Site Request Forgery Defense and Clickjacking 127


    is best for your application. Sometimes the framework solution is acceptable,

    sometimes it is best to build that defense yourself.


    Apache Tomcat provides a CSRF prevention filter available for Java web

    applications hosted on any version of Tomcat after and including Tomcat 6.10

    This filter implements the synchronizer token pattern for GET or POST

    requests. The CSRF Prevention filter protects URLs and POST requests via

    standard filter mapping. The filter is configurable, with several settings.

    The randomClass setting will let you change the number generator,

    which defaults to java.security.SecureRandom. This random number generator

    will be used to create the CSRF token. The entryPoint setting is

    for URLs that do not need CSRF protection. When setting up your filter,

    y will likely force an entry section of your website to enforce CSRF tokens,

    but you will need an entry page, such as a home page of some kind where

    tokens are not being verified. There is also a setting, nonceCacheSize,

    is is used to select how many tokens will be cached (for back button and

    multi-tab support). Each URL protected will have a different token and several

    page requests opened in several tabs will each have different collections

    tokens that will need to be cached. The filter defaults to five cached tokens,

    ab a higher number is often preferred to ensure proper multi-tab support.


    The Tomcat CSRF filter will automatically add a token to any URL in the

    response that is both covered by the filter and encoded via a call to Http

    rvletResponse#encodeURL(String) or HttpServletResponse#encodeURL(String) as you
    can see in the URL that follows. If the URLs

    send to your user are not encoded via these encoding functions then the

    token will not be added, they will still be enforced server-side and things

    will start breaking. After encoding, your URLs will look like the following:


    ```

    http://server/page?org.apache.catalina.filters.CSRF_

    NONCE=31ACB2CA09

    ```


    This variable name does indeed expose implementation details about the

    fact that Tomcat 6 or higher is in use and Tomcat''s default CSRF filter is

    use. There is no simple way to change this variable name other than changing

    Tomcat code.'
