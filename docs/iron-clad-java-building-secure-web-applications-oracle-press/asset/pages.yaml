  md: '# Chapter 5: Cross-Site Request Forgery Defense and Clickjacking 131


    in general we see CAPTCHA not as a defensive barrier, but a cost barrier for attackers.
    However, the usability of secure CAPTCHAs is atrocious at best and we highly recommend
    avoiding them whenever possible. Re-authentication is, by far, a more usable and
    more secure challenge-response mechanism.


    # HTTP Request Referer Header Verification


    Every modern browser sends an HTTP referer header as part of each HTTP request.
    The HTTP referer contains the URL of the page that the request came from. Another
    way of saying this is that the HTTP referer hosted the link that was clicked.
    This is a simple part of the HTTP standard and will look like the following as
    a header in each request:


    ```

    Referer: http://www.site.com/

    ```


    Why can''t you use the HTTP referer to protect against CSRF? You could check the
    referer to make sure the request came from the site you expected instead of a
    third-party site. Is this a good idea? No, it''s not. Remember our First Rule
    of Web Security: Don''t trust anything from the request (or don''t trust anything
    from the browser!) If anything coming from the browser can be spoofed or modified
    by an attacker, then the referer header is not sufficient to defend against CSRF.
    Specifically, some companies strip out the referer from all requests that leave
    their env-ons to prevent data leakage. Some web security tools and browser add-ons
    modify referer headers. Even if the referer came from your site, the request may
    still be forged, as is the case of a stored CSRF vulnerability, where the attack
    is hosted on your site, instead of a malicious third-party site.


    However, although you cannot depend on the HTTP referer header to verify if a
    request came from the right browser and user, you can use the HTTP referer to
    indicate if the request may be fraudulent. It is a subtle point. Although HTTP
    referer header verification cannot be used as defensive security control, it can
    be used for intrusion detection.


    If the HTTP referer header contains the right referring URL or is blank, then
    the request has the potential of being legitimate. However, if the referer header
    is from a third party, and you were expecting the request to originate from your
    site, then you know for sure the request was fraudulent.'
