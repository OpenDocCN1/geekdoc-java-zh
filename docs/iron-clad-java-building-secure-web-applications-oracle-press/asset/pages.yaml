  md: '# 254 Iron-Clad Java: Building Secure Web Applications


    PCI-DSS is the payment card industry data security standard. If you are processing,
    storing, or using credit cards in your software, this standard applies to you.
    For more information, see https://www.pcisecuritystandards.org/security_standards/.
    This standard defines which parts of the credit card information can be stored,
    and how those parts need to be encrypted when stored or transferred over a network.


    HIPAA stands for the Health Insurance Portability and Accountability Act of 1996.
    HIPAA forces health care providers (and companies managing health care information
    of their workers) to ensure that privacy requirements are met. If a breach of
    health care data occurs, HIPAA defines rules for notifying patients whose data
    have been compromised. The notification requirements provide a strong incentive
    for upper management to plan for security in advance, rather than suffer a potentially
    embarrassing disclosure if an incident occurs.


    The Graham-Leach-Bliley Act is a massive financial reconstruction law that allowed
    large financial institutions to conduct various financial activities under one
    roof. It is all well and good for the bankers, but the part of the act that we
    security professionals care about is that companies that offer consumer-centric
    financial services have publicly disclose their information-sharing practices
    and steps to protect consumer data.


    The European Union is considering various regulations in Europe to ensure the
    privacy of its citizens. These potential regulations are some of the strongest
    ever to be proposed. The new regulations, if passed, will provide for a fine of
    up to 250,000 EUR, or up to 0.5 percent of a company''s annual worldwide turnover,
    to anyone who does not protect personal data. Wince. Now that is going to get
    an executive''s attention!


    # Technical Security Requirements for Developers


    At the end of, or in sync with, design processes, it''s time to tell the developers
    just what need to be coded. Developers need to be aware of high-level business
    requirements—and often this is where most companies stop. However, prescriptive
    technical security requirements can be a powerful force to corral developers into
    caring about security. Clear requirements,


