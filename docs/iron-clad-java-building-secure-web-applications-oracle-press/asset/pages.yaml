  md: '# 210 Iron-Clad: Building Secure Web Applications


    # Verifying File Contents


    Another important step is to verify that the contents of a file actually match
    the stated file type. For example, you can verify that an uploaded file with the
    extension .jpg is actually a valid image by the technique of image rewriting.
    In image rewriting, you process uploaded image files through a library such as
    ImageMagick. ImageMagick includes functions to resize, edit or convert images
    in a variety of ways. When it attempts to load an image, ImageMagick will often
    fail the loading operation if the file is not a proper format. If successfully
    deloads the untrusted file without error, the file contents are likely a valid
    image. To be certain, use ImageMagick to modify the image in some way (such as
    scaling it down by 1 pixel), and save it in a new file. Discard the original uploaded
    file and only persist the image that was processed by ImageMagick. If an image
    ends up loaded, modified, and then resaved by ImageMagick, it is likely to be
    a safe image file. ImageMagick can also be used for other functions on your site,
    such as scaling to thumbnails or reading/writing EXIF data to anonymize the image
    or add a copyright notice.


    CAUTION


    Be careful of calling ImageMagick or another OS level image manipulation library
    with OS commands that include user-driven untrusted filenames. When untrusted
    data drives operating system commands, it could lead to command injection, as
    discussed in Chapter 7.


