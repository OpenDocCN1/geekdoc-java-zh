  md: '# 8 Iron-Clad Java: Building Secure Web Applications


    Not all HTTPS created equal. Cipher suites are negotiated between browser and
    server to determine the cryptographic strength of the session transport. The negotiation
    process ensures that different types and versions of web browsers and web servers
    collaborate over unsecured networks securely. This means that the cryptographic
    strength of an HTTPS connection can vary widely between different HTTPS servers.
    Most browsers will display a lock icon or some other indication that HTTPS is
    in use, but ultimately the negotiated cipher suite results are not obvious to
    users when browsing websites. We discuss HTTPS in Chapter 6, “Protecting Sensitive
    Data.”


    # HTTP/S GET Request


    The HTTP request consists of several basic components. These include the HTTP
    verb, the resource requested, the version of HTTP, the headers, and parameters.


    ```

    GET http://www.oracle.com/index.html?locale=US&lang=en HTTP/1.1


    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.9; rv:29.0)

    Gecko/20100101 Firefox/29.0

    Accept: text/html+xml,application/xml,q=0.9,*/*;

    Accept-Language: en-US,en;q=0.5

    Connection: keep-alive

    Host: www.oracle.com

    ```


    In the preceding example, the HTTP verb is “GET”, the resource being requested
    is “http://www.oracle.com/index.html,” and the version is “HTTP/1.1”. The HTTP
    request headers include User-Agent, Accept, Accept-Language, Connection, and Host.
    In a GET request, the parameters are appended to the URL after a question mark.
    The parameters in this request are locale, with the value US, and with the value
    en.


    The User-Agent HTTP request header identifies the type of client making the request.
    It can be a desktop browser, a mobile browser, a web crawling bot, or a mobile
    application. In the preceding case, the User-Agent identifies itself as Mozilla/5.0
    (Macintosh; Intel Mac OS X 10.9; rv:29.0) Gecko/20100101 Firefox/29.0, which is
    Firefox 29 on my OS X machine. Because this header comes from the browser and
    is not typically typed by a user, can you trust it? Of course not. An attacker'
