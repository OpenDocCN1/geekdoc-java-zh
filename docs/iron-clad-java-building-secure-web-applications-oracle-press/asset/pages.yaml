  md: "62 Iron-Clad Java: Building Secure Web Applications\n\n# Access Control Anti-Patterns\
    \ and Design Flaws\n\nThere are many ways that an access control mechanism can\
    \ go south.\n\n# Anti-Pattern 1: Avoiding Access Control Features\n\nThe first\
    \ design flaw of access control design is not using it. On several occasions we\
    \ have reviewed an application for which all users had complete access. When asked\
    \ about the access control mechanism, the answer in this situation is often \"\
    we'll slip in on later.\" FAIL. Access control is central to your application's\
    \ defense-in-depth strategy and the implementation needs to be carefully considered\
    \ throughout the entire software development lifecycle.\n\n# Anti-Pattern 2: Using\
    \ Request Data to Make Access Control Policy Decisions\n\nAnother common flaw\
    \ is access control that depends solely on client-side data to determine a user's\
    \ role or entitlement. It is trivial for an attacker to modify request data using\
    \ an intercepting proxy or similar tool. Attackers can will modify any of the\
    \ HTTP Request so that a cookie with ROLE=USER can easily be modified to ROLE=ADMIN.\
    \ Or how about this snippet of a form where the user's role is driven by a hidden\
