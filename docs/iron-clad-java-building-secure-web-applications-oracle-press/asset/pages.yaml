    ```


    Consider international applications that need to support multiple languages. Input
    validation becomes very complex and many defenders revert to using the java regular
    expression [ ] for input validation, which allows all printable characters. Similarly,
    when your application allows "open comments fields," such as user comments that
    can be submitted after a new article, a wide range of characters need to be accepted.
    For Twitter, you can submit almost any character in a tweet, including <, >, #,
    '', " and other "dangerous" characters that may be used to conduct an XSS attack!


