  md: '# Introduction


    Today''s web applications are under attack. This book helps you understand the
    most common threats against web applications today. You''ll also learn a wide
    variety of defense techniques to help you Java web applications that prevent these
    attacks from being successful. The following sections describe what you''ll find
    in the book.


    # Chapter 1: Web Application Security Basics


    In this chapter, you learn about the inner workings of the HTTP protocol, learn
    the basics of using intercepting proxies to tamper with requests, and review a
    variety of HTTP security response headers.


    # Chapter 2: Authentication and Session Management


    You explore the security controls needed to build a complete secure login mechanism.
    You learn techniques to stop attacks such as brute force, username harvesting,
    and session theft. We also review proper methods to safely store passwords.


    # Chapter 3: Access Control


    In this chapter, you learn about access control design patterns such as role-based
    and activity-based access control. You''ll also review a wide range of best practices
    that any access control mechanism should take into account.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 4: Cross-Site Scripting Defense


    In this chapter, you learn about cross-site scripting and how to use contextual
    output encoding when building user interface code. You also learn about HTML sanitization
    techniques, safe use of JSON, and proper JavaScript usage for security.


    # Chapter 5: Cross-Site Request Forgery Defense and Clickjacking


    You learn about the synchronizer token pattern and other techniques to help you
    protect sensitive transactions. You also learn “framebusting” techniques to reduce
    the chance of clickjacking attacks.


    # Chapter 6: Protecting Sensitive Data


    You learn about configuring and using TLS. You also learn about strict transport
    security, certificate pinning, and how to use the Google Keyzar library.


    # Chapter 7: SQL Injection and Other Injection Attacks


