  md: '# 160 Iron-clad Java: Building Secure Web Applications


    understand that the security of any cryptographic solutions depends entirely on
    keeping certain keys secure.


    In order to provide a simple API and key management utility that is hard to misuse,
    Keyczar sacrifices some flexibility. For instance, only a handful of algorithms
    are available, only a few specific modes and padding combinations are implemented,
    and the output format is predefined. These limitations may seem overly restrictive,
    but they are not different than the sort of restrictions that you find in TLS.
    While TLS is a good general purpose secure communication protocol, it is not optimal
    for every use. We sacrifice flexibility in order to rely on a solid, tested system.
    Keyczar aims to make the same kind of trade-offs: a limited set of tools that
    are tested and will get the job done in most situations.


    Before we get into the specifics of using Keyczar, we''ll first review the distinction
    between encryption and signing—the two basic cryptographic functions that Keyczar
    supports. While the public key infrastructure and certificate management concepts
    discussed in the previous section relied heavily on signing, we skimmed over the
    details. Now it''s time to dig into those details.


    # Encryption and Signing


    A digital signature is applied to data as a way to validate the source of the
    data. The sender sends the data and the receiver validates the signature. If the
    signature passes validation, then the receiver can be confident that the sender
    actually sent the data. A valid signature also tells the receiver one important
    bit of information: No one altered the data after it left the sender. If someone
    had changed the data, however slightly, the signature would fail the validation
    check.


    The important thing to keep in mind is that signing data does not necessarily
    make the data secret—other people may still be to read signed data. Signing allows
    a receiver to validate that you sent the data. Encryption, on the other hand,
    is used to keep other people from reading the data. Encryption makes the data
    secret. If you come across encrypted data, you won''t know what the data actually
    is. If you come across signed data, you may know what the data is, but you can
    definitely determine who sent it.


    Cryptographic algorithms that are good for encryption are not necessarily good
    for signing, and algorithms that are good for signing are not necessarily good
    for encryption. The different security goals lead to different types'
