  md: 'Chapter 9: Logging, Error Handling, and Intrusion Detection 239


    # OWASP AppSensor


    The OWASP AppSensor project is an open-source framework for real-time attack detection
    and response. That means your application can actually detect intruders and protect
    itself! AppSensor performs a similar function to a network layer intrusion detection
    system, but operates at the application layer. AppSensor has three primary components:


    +   - Detection points

    - Analysis engine (and policy configuration)

    - Response execution


    Conceptually, the detection and response components live primarily within a custom
    application, while the analysis component is wholly provided by the AppSensor
    framework itself (though the policy must be configured). As a developer, the typical
    workflow is:


    +   1. **Instrument your application** Your application will make API calls (which
    are converted to JSON/REST or XML/SOAP calls by the framework) to notify AppSensor
    when a user performs a questionable or known-bad activity (for example, invalid
    login, XSS attempt, circumventing client-side validation). In AppSensor parlance,
    these calls are referred to as "detection points." AppSensor provides a large
    list of detection points to get you going with ideas.

    2. **Configure the policy** AppSensor analysis engine component uses an XML-based
    policy configured by the developer that specifies thresholds (X suspicious events
    in Y timeframe) for determining when a series of events constitutes an "attack,"
    thereby triggering a "response." The types of responses are also configured in
    the policy.

    3. **Handle responses** AppSensor provides several response handlers out-of-the-box
    (to increase logging, log out the user, disable the user, notify an administrator,
    and so on), and developers can also design


    > ¹ https://www.owasp.org/index.php/OWASP_AppSensor_Project; Thanks to John Melton,
    the project leader and active coder for the OWASP AppSensor project, for providing
    this excellent overview of AppSensor on very short notice.'
  merge: -1
  pgno: 258
