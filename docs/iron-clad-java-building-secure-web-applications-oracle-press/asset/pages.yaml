  md: '# Chapter 6: Protecting Sensitive Data 139


    The last two threats are similar in that the attacker wants passwords or other
    data that is stored. We treat them differently because in practice the nature
    of the data is different. Passwords are generally secured in a way that cannot
    be reversed: Once a password''s protection is in place, you cannot undo it to
    discover what the password actually is. You can, however, determine if a submitted
    password matches the stored password.


    Protection of other kinds of data, though, needs to be reversible. For instance,
    when you protect a credit card number, you will most likely need to remove the
    protection later to actually use the credit card to process a purchase. This difference
    results in different kinds of threats, which in turn, require different kinds
    of security. In this chapter, we focus on the reversible kind of protection.


    Now that we''ve gone over those threats, let''s consider various ways to mitigate
    them. It''s important to always keep in mind the threats you are defending against.
    A perfectly good security mechanism might be wholly inadequate against certain
    types of threats. Model the threats your application will face before investing
    much in designing the security controls. In security, details matters.


    One last thing to keep in mind before we move on: Cryptographic functionality
    in Java can vary from one platform to another and behave differently based on
    what cryptographic protocols and providers are installed on the local system.
    Some of this variation is due to the native capabilities of the underlying operating
    systems; some of it is due to governmental export restrictions; and some of it
    is deliberate flexibility built in to the design of the Java Cryptography Architecture
    (JCA) and the Java Cryptography Extension (JCE). In this book, we''ll mostly focus
    on the default functionality provided by Oracle. However, you should spend some
    time inspecting other Java cryptographic providers to see what they offer. Two
    common third-party providers are the IAAK and the Bouncy Castle cryptographic
    packages.


