  md: '# Chapter 10: Secure Software Development Lifecycle 263


    While it’s easy to throw WAFs over the bus and drive over them a few times, there
    are situations in which a web application firewall can be a powerful ally. Suppose
    you depend on a COTS (Commercial Off Shelf) web application site and do not have
    control of the code. Sometimes your only choice is to decommission that application
    or use a carefully configured WAF rule when a security vulnerability is found.
    Sometimes your developers have other priorities and are not able to fix vulnerabilities
    for some time. Even the most agile development organization can''t triage, design,
    code, test, and deploy a solution fast enough. In such cases, WAFs are a great
    tool to lock bugs down quickly and "buy you" until your developers can fix the
    underlying bugs. WAFs are not perfect security and often have problems. But sometimes
    WAFs are all you need if you want to keep doing business. Just remember that a
    WAF should never be a permanent solution.


    One of the oldest open source WAFs is the Apache Foundation’s ModSecurity, the
    open source web application firewall.¹⁸ While this project is part of the Apache
    Foundation, the OWASP foundation manages the core ruleset. Please visit the OWASP
    ModSecurity core rule set⁹ (managed by Ryan Barnett) for more information.


