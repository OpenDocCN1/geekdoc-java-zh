  md: "# 232 Iron-Cl Java: Building Secure Web Applications\n\nOne way to prevent\
    \ stack traces from displaying in a user's browser is to handle uncaught exceptions\
    \ via configuration in web.xml. The following web.xml configuration will ensure\
    \ that any user who triggers an uncaught exception will be forwarded to a \"clean\"\
    \ error page instead of being graced with stack trace data.\n\n```\n<error-page>\n\
    <exception-type>java.lang.Throwable</exception-type>\n<location>/WEB-INF/error.jsp</location>\n\
    </error-page>\n```\n\nThe same request now results in a static error page that\
    \ does not reveal sensitive information about the application (see Figure 9-2).\\\
    It is often helpful to provide a unique reference number for the error. Including\
    \ a reference number provides engineers with an index to the exact error in the\
    \ logs while not revealing too much information to the application user. This\
    \ helps errors get resolved faster and with less effort, that benefits everyone.\n\
    \nIn addition to using generic error pages when Java exceptions occur, it is also\
    \ prudent to define custom error pages for HTTP error codes to prevent the server's\
    \ default pages (which often reveal server version numbers) from displaying (see\
    \ Figure 9-3).\n define custom HTTP error pages, add the following to your web.xml\
    \ configuration file:\n\n```\n<error-page>\n<error-code>404</error-code>\n<location>/WEB-INF/error.jsp</location>\n\
    </error-page>\n```\n\n![](img/dcaa0b2cb71117317d964da03e19ebbf_251_0.png)\n\n\
    FIGURE 9-2. A generic error page that does not display sensitive information"
