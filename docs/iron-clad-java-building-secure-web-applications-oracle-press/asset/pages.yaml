    A brute force attack against a password store occurs when an attacker walks through
    a list of every possible password, creates the ciphertext for each potential password,
    and compares the ciphertext to the passwords stored in your database. Although
    this seems like an inefficient attack,¹ attackers now have access to both specialized
    password cracking algorithms and high-performance GPU password cracking rigs that
    can attempt billions of password attempts per second against your password storage
    mechanism.¹⁴ Attackers also have large lists of known passwords, which are often
    the first ones they try because people tend to reuse the same passwords on multiple
    sites.


    > TIP

    A great way for an attacker to try a brute force attack against your password
    store is to simply try many password combinations against your own site''s login
    process! This has the side benefit (to the attacker) of using your own hardware!
    Make sure to set a maximum number of incorrect tries before you lock the account.
    Multi-factor authentication is also a good defense that keeps brute force attacks
    at bay.


    A dictionary attack against password storage occurs when:


    +   - An attacker has stolen your password ciphertext.

    - The attacker understands your password storage algorithm.

    - The attacker attempts to discover passwords by using a large list of commonly
    used password and dictionary words, generating the ciphertext for that password,
    and then comparing it with your stored ciphertext. Once the attacker finds a match,
    they have discovered a password!


