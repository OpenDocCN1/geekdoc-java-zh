  md: '# Chapter 7: SQL Injection and Other Injection Attacks 193


    # Reducing the Impact of SQL Injection


    There are several configuration measures that can be taken to reduce the impact
    of SQL injection. If your application built entirely with parameterized queries,
    your risk of SQL injection is removed. However, a multilayered defense strategy
    is crucial when it comes to the construction of secure applications. The defenses
    described in the sections that will ensure that even if SQL injection somehow
    slips through your review processes, the damage done to your organization will
    be contained.


    # Database Permissions


    Imagine a Java-based web application that is backed by a database-driven content
    management system. The data within this web application may be public data that
    is not considered sensitive to the business. An SQL injection vulnerability in
    such an application may be deemed to be low impact. Indeed, security is often
    overlooked for such sites.


    However, sometimes it is difficult for IT operations staff to understand all the
    database permissions and requirements for every application. To reduce operational
    impacts of a permission failure they sometimes take shortcuts such as using the
    database Administrator account as the application''s account. Because the Administrator
    account has privilege to the entire database, the application is not likely to
    encounter surprise problems with permissions at runtime. The problem with such
    shortcuts is that Administrative accounts may have access to database schemas
    of other applications than the marketing web application. Unfortunately, providing
    an account with too much privilege is not typically discovered during function
    quality testing. However, in such a scenario, attackers could use an SQL injection
    vulnerability to extract data from different database schemas and different applications.
    In some cases, an attacker can use SQL injection to open an operating system command
    shell and execute operating system commands on the database server!


    The solution is to configure your database connection pool or standard database
    user to follow the POLP or POLA principle: principle of least privilege or principle
    of least authority. Applying the principle to the previous example, operations
    staff should have confirmed the proper access requirements with the developers
    and created a new database user with the least access possible to still achieve
    the desired functionality of the


    > http://www.red-database-security.com/whitepaper/oracle_sql_injection_web.html'
