  md: '# 250 Iron-Clad Java: Building Secure Web Applications


    were painstakingly specified by your security architects. We have seen some companies
    that only give their developers this type of training after a breach or after
    security vulnerabilities are discovered. This is unfortunately far too late in
    the game. By the time a breach is actually discovered, training is scheduled and
    executed, and the bug is fixed, an attacker could be running roughsh through your
    application for weeks! The perfect time to train your developers about software
    security is at the beginning of the project—before the coding phase has begun.


    # Role: QA Tester


    Most QA professionals are very well suited to verify the functional requirements
    of software. These are often the least technical members of your team because
    even non-techies can be effective QA professionals. At first glance, a QA tester
    needs to be able to use and master your web application so it can be thoroughly
    tested for bugs. Admittedly, there are several levels of QA staff. Advanced QA
    staff leverage a variety of automation to assist in their task. The best QA staff
    are the developers themselves, writing unit tests and other automation, and are
    fully integrated into the development staff.


    Some software methodologies, such as DevOps, skip QA altogether and roll that
    into development activities such as unit testing. One big mistake that many companies
    make is to believe that a standard QA professional can be turned into a penetration
    tester or security professional overnight. While QA professionals are often the
    least technical members of your team, security professionals and penetration testers
    need to be some of the most technically advanced members of your team. It is not
    simple (sometimes not even possible) to magically turn your QA staff into professional
    security testers.


    # Professional Security Tester


    A penetration tester is a professional "good guy" hacker who ethically hacks your
    website and informs you of any vulnerabilities early in order to give you a chance
    to fix them before they "go live" and are exploited. This is one of the oldest
    information security professions and the need for these professionals has seen
    a huge upscale over the last several years. Pentesters have the ability to dive
    deep into your website and discover vulnerabilities that automated tests are often
    not able to find, such as business logic (custom business processes) or sometimes
    ever access control vulnerabilities.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Chapter 10: Secure Software Development Lifecycle 251


    These individuals are not inexpensive and are in high demand. Many pentesters
    work for small consulting firms and avoid working for large companies or firms.
    This is a challenge because the need for professional testing is far beyond the
    supply of experts in this field, and many new professionals are entering the security
    testing field without the right expertise. Perhaps the best way to create penetration
    testers is to start with experienced software developers and retrain them in the
    art and science of penetration testing. The insight gained from knowing how to
    build websites really helps when attempting to exploit them.


    How do you know if the pentester you hired is thorough enough, skilled, and professional
    enough to be the right tester for your team? You hire an outside security firm
    and cross-check results against your in-house team. If you had a health issue
    you would not dream of treating yourself and self-prescribing. At the very least
    you would seek a second opinion before consenting to expensive and potentially
    dangerous surgery. Why should security be any different? An outside firm can (and)
    review your security program and occasionally test your applications for holes
    your team might have missed. More eyeballs are better to ensure the most comprehensive
    results are produced. Using an outside firm also helps mitigate threats from malicious
    actors inside your company.


    An important point to remember is that a security report with no negative results
    does not mean that your application has zero vulnerabilities. No penetration test
    can ever certify that. Even if some vulnerabilities are reported, chances are
