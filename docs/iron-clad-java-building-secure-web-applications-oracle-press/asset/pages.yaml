  md: '# 82 Iron-Clad Java: Building Secure Web Applications


    Cross-site scripting, or "XSS," is a form of attack executed by including untrusted
    data, as malicious JavaScript code, into the victim''s web browser. Simply put,
    XSS is attacker-driven code running within client browsers or other JavaScript
    engines. XSS attacks are perpetrated by inserting malicious JavaScript or JavaScript
    fragments into a host website where it''s later executed in victims'' web browsers
    when the host site is visited.


    XSS is one of the most common vulnerabilities found across the Web. In our personal
    experience, 80–90 percent of websites subjected to intensive penetration testing
    exhibiting at least one instance of XSS. XSS vulnerabilities can be exploited
    to devastating effect by an attacker to capture session cookies and CSRF tokens
    (Chapter 5), modify page contents, change the location where form submissions
    are sent, or read the browser''s autocomplete history. With JavaScript''s emergence
    as a fullyfledged web language, almost anything is possible. Exploits have been
    demonstrated using JavaScript for reconnaissance of private networks, and to identify
    vulnerable hardware and update firmware with malware. XSS issues from an unanticipated
    user''s browser. Also, given that XSS is executed within the victim''s web browser,
    the attacker''s code executes at the user''s privilege level.


    Assuming user privileges is possible because many web application sessions expire
    infrequently and victims often navigate to other sites of interest when done as
    opposed to logging off.


    Curtailing XSS risks is difficult in complex modern websites. Developers need
    to use a multilayered strategy, specific to the type of website they are building,
    to truly reduce risk. To make matters worse, mobile platforms, video game consoles,
    printers, and many other classes of devices render HTML and JavaScript, making
    XSS dangerous even in non-browser-based environments.


    We are also going to cover risks related to content spoofing. Unwanted content
    that is rendered on the web browser and affects the structure or content of a
    web page can be harmful to the security of your website.


    Let''s break it down and see how to defeat this complex but tamable risk.


    > Phil Purviance and Josh Brashars, Blended Threats and JavaScript (BlackHat USA,
    2011, San Francisco, CA), http://media.blackhat.com/bh-us-12/Briefings/Purviance/BH_US_12_Purviance_Blended_Threats_Slides.pdf.'
