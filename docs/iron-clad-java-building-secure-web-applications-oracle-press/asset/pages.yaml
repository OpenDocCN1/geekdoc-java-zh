  md: '# Iron-Clad Java: Building Secure Web Applications


    Authentication is the front gate of any secure web application. Authentication
    is used to establish the identity of your users, and without it, other functions
    of the site, such as authorization, cannot operate. The topic of authentication
    includes the login process, session management, password storage, identity federation,
    and several other subtopics. This chapter explores what you as a developer need
    to focus on when building a secure authentication process. We will provide several
    secure coding techniques around building a login mechanism, leveraging source
    authentication mechanisms, session management lifecycle, storing and managing
    passwords, as well as other techniques needed to provide a secure authentication
    mechanism for your website. Let''s get started!


    # Registration of New Users


    For consumer-centric websites, your users'' first interaction with your authentication
    process will be when they register an account with your website. Your registration
    workflow should, at the very minimum, request the username, email address, and
    password for the user. A display name may also be required. The user''s email
    address should be verified before the account is fully enabled. Financial websites
    may require additional information like savings account number or credit card
    verification workflows. If you support multi-factor authentication, a user''s
    phone number (for SMS multi-factor) or some other setup process for a multi-factor
    mobile or native application


    # Who Should Build Authentication for Your Project?


    Authentication is an incredibly important security layer in your application.
    It is critical that you do not “reinvent the wheel” every time you build a new
    website. Especially for large enterprises, we hope that your most senior architects
    build the authentication layer and then reuse it on other projects. Even better,
    we hope that large organizations provide a well-secured and well-maintained authentication
    service that all company websites (not just Java-based) can utilize. If you find
    yourself building an authentication layer in your application, there better be
    a good reason to do so! Make sure you are not reinventing the wheel; make sure
    you are not rewriting a layer that already exists within your organization.'
