  md: '# 144 Iron-Clad Java: Building Secure Web Applications


    +   - Stick to bulk ciphers with key sizes of 128 bits or larger (note that 3DES
    provides no more than 112 bits of security).


    +   - Try to avoid suites using RC4, DES, and 3DES.


    +   - Prefer ECDHE and DHE for key agreement. While they are slower (and DHE is
    slower than ECDHE), they provide stronger protection even if the private keys
    are later compromised, a property known as forward secrecy.


    Which suites meet these guidelines? You might use one of these:


    ```

    TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA

    TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA

    ```


    # Forward Secrecy


    Forward secrecy protects your past communications if the server''s private keys
    are compromised. Without forward secrecy, an attacker gains access to a server''s
    private key can decrypt communications by applying the server''s private key to
    stored traffic that the attacker recorded in the past. With forward secrecy, the
    attacker would not be able to use the private key to impersonate the server, but
    the attacker would not be able to decrypt recorded communication traffic.


    Stealing private keys is not as difficult as you might think. Trusted system administrators
    typically have access to the keys, a warrant can compel administrators to hand
    over the keys, and security vulnerabilities can leave the keys exposed. For instance,
    the OpenSSL Heartbleed vulnerability, publicized in April 2014, enable remote
    attackers to steal a server''s private keys by sending messages that abused the
    heartbeat extension.


    Systems that had implemented forward secrecy were not exposed to as much risk
    by the Heartbleed vulnerability (not to diminish the severity of Heartbleed) because
    their past communications were still secure. Google enabled forward secrecy in
    many of its sites in 2011. Twitter did do so in 2013. We can''t stress it enough:
    Protect your communications by selecting cipher suites that support forward secrecy
    (ECDHE or DHE).'
