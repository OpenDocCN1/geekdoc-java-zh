  md: "# 236 Iron-Clad Java: Building Secure Web Applications\n\nA failure here is\
    \ no big deal; the code just does not show the link if the user does not have\
    \ the right access to see that link. Sometimes, an access control failure is impossible\
    \ by normal application use and behavior, and you can react to those events as\
    \ being a probable attack. For example, suppose you had a delete user feature\
    \ that was only available to admins. You would only show that button to admins:\n\
