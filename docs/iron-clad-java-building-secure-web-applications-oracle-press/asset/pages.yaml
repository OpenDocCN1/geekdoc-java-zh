    When you use the programming technique of query parameterization, it actually
    protects your application from injection. When you use the PreparedStatement class
    and similar constructs, the parameterized SQL (the portion of your query with
    your placeholder variables, not the untrusted data) is sent to the database, which
    causes the database to build a query execution plan for that query structure.
    The second part of your prepared statements, the binding of the untrusted data
    into the query, is then sent to the database in a second pass, to traverse the
    query plan and execute the query. Because the plan is “built” already, injection
    is impossible. Luckily, query parameterization in Java is one of the easier secure
    coding techniques that you need to master. Also, not only does query parameterization
    protect against SQL injection, but it also increases the performance of repeated
    queries because your query execution plan is cached in the database! This makes
    query parameterization a security control with multiple benefits beyond security.


