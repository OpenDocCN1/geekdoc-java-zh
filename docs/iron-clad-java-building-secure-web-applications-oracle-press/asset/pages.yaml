  md: '# Chapter 4: Cross-Site Scripting Defense 109


    This library ensures only that the JSON string to JavaScript object phase has
    no side effects and resolves no free variables, and cannot control how client-side
    code later interprets the resulting JavaScript object. So if client-side code
    takes a part of the parsed data that is controlled by an attacker and passes it
    back through a powerful interpreter as eval or innerHTML, then client-side code
    may suffer unintended side effects.


    The sanitize method will return the input string without allocating new buffer
    when the input is already valid JSON that satisfies the properties mentioned previously.
    Thus, if used on input that is usually well formed, with minimal memory overhead.
    The sanitize method takes O(n) time where n is the length in UTF-16 code units.


    Let''s put this all together. JSON.parse function is not safer than the JavaScript
    eval function, but is also faster because it has a simpler job. We really need
    a combination of server-side sanitization, using the proper browser-based parser,
    and for performance, we have the JSON embedding trick described previously.


    | unsanitized | sanitized |

    | --- | --- |

    | eval unsafe, reliable | safe, reliable |

    | JSON.parse safe, unreliable | safe, reliable |


    JSON.parse will fail with a syntax error on a lot of things that eval will happily
    parse, and eval will happily add massive vulnerabilities to your web client! Post-sanitization,
    JSON parsing will not harm you, and neither will it fail with a syntax error.


    # jQuery and DOM XSS


    One of the most popular JavaScript frameworks is the jQuery open source library.
    jQuery provides a powerful cross-browser platform for traversing and manipulating
    the DOM, but as such there are a variety of jQuery functions that are inherently
    vulnerable to XSS. For example, the jQuery html function replaces the entire contents
    of the element it operates on with the input passed to the method:


    ```

    $(''#myDiv'').html(''<script>alert("XSS");</</script>'');

    ```


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_128_0.png)'
