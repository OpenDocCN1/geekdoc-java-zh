    # Preventing Automated Registration


    Especially for popular and high traffic websites, attackers often use automation
    to register a large number of accounts for malicious purposes. This is often the
    only area where we recommend the use of a CAPTCHA.¹ but only after repeated automated
    attempts are detected. Ideally, we never want to force real users to resolve a
    CAPTCHA because their usability is poor, at best, when they are built in a secure
    fashion. CAPTCHAs are overall a fairly weak security control. Luckily there are
    several alternatives to CAPTCHA that accomplish the same defensive task without
    harming usability.A small time delay (i.e., connection throttling) can achieve
    the same effect of minimizing malicious automated registrations. After a user
    is created, your application should enforce a time limit of 15 minutes before
    another user can be registered from the MAC address or IP address. These and other
    techniques can significantly slow registration bots.


    One technique that may help stay off automated registration abuse is to add an
    additional form component, such as a text field, and hide it with CSS by positioning
    the component off-page or use other method to make it invisible to users. A normal
    user would never see or be able to fill this "hidden" text field with any data.


    ```

    <input type="text" name="company" value="Input Company Name" style="position:absolute;left:-1000px;">

    ```


    Registration bots will often prefill form fields because they are not aware of
    CSS, or at least easily recognize when style hides a form component. When registration
    submissions on the server, if this hidden parameter is anything other than an
    empty string, you know it is from a bot and you can safely ignore and log that
    registration submission. (Proper logging of security-related events is discussed
    in Chapter 9.)


    ¹"Completely Automated Public Turing test to tell Computers and Humans Apart,"
    http://en.wikipedia.org/wiki/CAPTCHA


    ² http://textcaptcha.com/really'
