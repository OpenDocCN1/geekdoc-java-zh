    # # Safe Error Handling


    No matter how well your web application is, sooner or later you will have to deal
    with an exception. When Java web applications error in unrecoverable ways, it
    is not uncommon to see an exception stack trace in your browser (see Figure 9-1).


    Not only the default server error message shown in Figure 9-1 reveal the fact
    that you are using Java, the libraries in use, and the exact (vulnerable) version
    of Apache Tomcat is running on, it also lets an attacker know that you quite likely
    have an SQL injection vulnerability!


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_250_0.png)


    FIGURE 9-1. An uncaught Java stack trace displaying sensitive information in the
    browser'
