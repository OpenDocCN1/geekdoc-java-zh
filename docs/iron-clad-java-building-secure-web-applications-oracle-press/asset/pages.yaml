  md: '# OWASP Cheat Sheets


    The OWASP Cheat Sheet series provides a list of concise guides written by a panel
    of application security experts.


    +   - The OWASP Password Storage Cheat Sheet discusses the proper cryptography
    when storing a user''s password for the purposes of authentication. Written by
    John Steven.

    https://www.owasp.org/index.php/Password_Storage_Cheat_Sheet


    +   - The OWASP XSS Prevention Cheat Sheet is one of the most popular resources
    at OWASP. Written by Jeff Williams. This guide helps developers stop cross-site
    scripting in their applications.

    https://www.owasp.org/index.php/XSS_Cross_Site_Scripting/Prevention_Cheat_Sheet


    +   - The OWASP Forgot Password Cheat Sheet is a guide that helps developers build
    a high-security "forgot password" feature in their web applications.

    https://www.owasp.org/index.php/Forgot_Password_Cheat_Sheet


    +   - The OWASP Session Management Cheat Sheet, written by Raul Siles, is a comprehensive
    guide that discusses the necessary security considerations when using and building
    a session management mechanism in web applications.

    https://www.owasp.org/index.php/Session_Management_Cheat_Sheet


    +   - The OWASP Authentication Cheat Sheet, written by Eoin Keary, covers the
    most important security considerations when building a login and authentication
    layer in your web application.

    https://www.owasp.org/index.php/Authentication_Cheat_Sheet


    +   - The OWASP Query Parameterization Cheat Sheet covers the most important security
    control of query parameterization, which will help you build applications that
    are resistant to SQL injection.

    https://www.owasp.org/index.php/Query_Parameterization_Cheat_Sheet'
