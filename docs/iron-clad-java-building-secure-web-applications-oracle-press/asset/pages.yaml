    # Session Fixation


    As discussed, a specialized form of session hijacking is called session fixation.
    Session fixation occurs when an attacker can trick a victim into logging into
    a site using a session ID that is known to the attacker. The attack scenario works
    like this:


    +   1. The attacker visits your website to obtain a valid session ID.

    2. The attacker creates a URL for the vulnerable website that includes this session
    identifier as an HTTP GET parameter value, for example using a URL rewriting vulnerability.

    3. The attacker tricks a victim into clicking on the URL to visit the vulnerable
    website.

    4. The vulnerable website recognizes the session ID in the URL and resumes the
    session that was started by the attacker.

    5. Once the victim logs in, the attacker is now able to compromise the victim''s
    session because the attacker knew the session ID before the victim even pressed
    the link!


    As we described, it is important to support session management through cookies
    only and to disable URL rewriting. However, URL rewriting is not the only way
    to preset a user''s session ID. Cross-site scripting can also be used


