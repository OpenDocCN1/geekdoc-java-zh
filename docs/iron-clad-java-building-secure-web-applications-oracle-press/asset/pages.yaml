  md: '# Chapter 6: Protecting Sensitive Data 149


    The X509Certificate class contains many other methods to inspect the various attributes
    of a certificate. Any of these could be used as part of a verification algorithm.


    Before creating a custom trust manager containing your own validation logic, spend
    some time understanding the relevant RFC specifications. You want to make sure
    that your code checks the right attributes for the right values. For instance,
    many implementations first check the subject name for determining the hostname,
    but that field should be used as a backup if the subject alternative names do
    not contain the hostname.


    # Certificate and Key Management


    As we said earlier, certificates and keys are the backbone of TLS. As such, it
    is crucial that they are managed carefully and securely. If your code is running
    behind a web server or web client, most likely you will not need to worry about
    certificates and keys in your code. Your system administrators will need to manage
    them with the tools provided by the web server or client, but little of that will
    be passed down to your application code.


    This section covers the Java tools for managing certificates and keys when you
    are not relying on front-end systems to do it for you. This will also help you
    understand what your system administrators have to manage, in some cases, especially
    on development machines, you may be the system administrator.


    Java provides three components that are important in certificate and key management:
    keystores, truststores, and the keytool. A keystore holds the private keys and
    certificates that are used as credentials. For instance, a TLS server sends information
    in a keystore to clients so that the clients can verify the server. The keystore
    should be kept secure and access must be tightly controlled.


    A truststore holds the public certificates that your application will use to determine
    trust. The truststore is used to validate the credentials supplied from a keystore.
    For instance, when a TLS server gives a certificate chain, the client will look
    to see that the chain is ultimately signed with a certificate in the client''s
    truststore. If it is, then the client will accept the chain. A truststore can
    be made public, as it should only contain public keys.


    The keytool is a command-line program that allows you to work with keystores and
    truststores. In most cases you will use the keytool to configure keystores on
    servers and truststores on clients—although sometimes'
