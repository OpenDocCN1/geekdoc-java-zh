    # Test That Security Controls Have Been Properly Implemented


    Testing software for security can be an expensive and difficult process, especially
    late in the software development lifecycle. It is prudent to use a combination
    of static code analysis (SAST), dynamic analysis against a running application
    (DAST), penetration testers to evaluate business logic and business-specific vulnerabilities
    (pentesting), and manual deep-dive code review. These techniques can be both expensive
    and time-consuming. It is prudent to use these testing methodologies based on
    the severity of threats, and the importance and value of the software to your
    company. Be sure to budget for these activities early on both cost and time!


    # SAST—Static Application Security Testing


    SAST, or Static Application Security Testing tools, are automated security analysis
    products that review your source code or byte code looking for security bugs.
    These security tests are run against “static” source code or byte code, as opposed
    to testing against a live running application. The benefit of these tools is that
    they can be run in an automated fashion on a regular basis, they often find vulnerabilities
    that live testers have limited visibility into, and reveal the errors directly
    in code so it is efficient for developers to find the bug in order to fix it.
    These tools are considered “whitebox testing” tools because they review applications
    from “the inside out.”


    For example, you could include static analysis in your nightly CI processes. Any
    defects could be automatically posted to your bug tracking system and


