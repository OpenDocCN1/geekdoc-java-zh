  md: '# Chapter 4: Cross-Site Scripting Defense 99


    Encode.forHTML encodes all the characters that forHtmlAttribute and htmlForContent
    do, and thus it is safe to use in either attribute or content contexts. It is
    not safe to use in an unquoted attribute. For the truly paranoid, the "unquoted
    attribute" context can be used everywhere else because it encodes pretty much
    everything.


    The following are the most straightforward recommendations that we can give for
    this encoding family:


    +   - Always quote your HTML attributes.


    +   - Use Encode.forHTML for all HTML markup.


