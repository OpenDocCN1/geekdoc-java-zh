  md: '# 128 Iron-Clad Java: Building Secure Web Applications


    Since the Tomcat CSRF filter only adds tokens to URLs but all requests can be
    configured to require a CSRF token, how does it protect POST form requests? With
    <form src=""> URL also needs to be encoded via HttpServletResponse#encodeRedirectURL(String)
    or HttpServletResponse#encodeURL(String)! Unlike other CSRF token injection mechanisms,
    Tomcat''s CSRF filter adds the token to the form action URL, not as a hidden variable.


    Because each request is protected by a unique CSRF token with this mechanism,
    the server needs to cache multiple valid tokens when the user opens several pages
    of the application in different tabs. As described previously, five tokens are
    cached by default and this can be changed via the nonceCacheSize parameter. If
    the nonceCacheSize is exceeded (in more than the configured number of tokens is
    exceeded), Tomcat''s CSR Prevention Filter can cause things to break when many
    tabs are opened. For example, a user could open a second tab, make nonceCacheSize
    plus one mouse clicks, and now submitting the original tab will fail. Make sure
    to set this variable high enough!


    If you want to provide CSRF coverage to your entire Tomcat web-hosted application,
    and you are already using the proper format of URL encoding for your application,
    then you can get CSRF protection very easily by enabling the Tomcat CSRF Protection
    Filter. If you are not using this URL encoding mechanism and need a large number
    of URLs to not be protected by this filter, then a custom solution might be more
    appropriate.


    # Stateless CSRF Defense


    Security is not something you can consider in a vacuum. Sometimes sites have a
    large number of users that saving another string in the session is something you
    want to avoid. Some applications forbid the JEE session for performance or load
    balancing reasons, making it challenging to safely save a randomly generated Anti-CSRF
    token. Also, stateless web services are common because they promise to enable
    more concurrent usage with reduced server resources.


    One of the more common stateless CSRF defense patterns is the bastard child of
    the synchronizer token pattern, the double-submit cookie pattern. We prefer the
    synchronizer token defense described previously previously, but there are some
    cases where the double-submit cookie pattern (or other stateless CSRF patterns)
    actually makes a lot of sense. However, in such situations, you'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Chapter 5: Cross-Site Request Forgery Defense and Clickjacking 129


    still need to build your CSRF token so it is fully random (best), or a hash of
    the session ID (not as good). You never want to use the raw session ID for CSRF
    defense in order to avoid exposing it in any way.


    The double-cookie submit CSRF defense works as follows:


    +   1. The user logs in to the website (or some client logs in to a web service).


    +   2. After successful authentication, the server sends the client a cookie containing
    a large random value and then discards it server-side. This random value is not
    saved on the server, hence the stateless nature of this defense.


    +   3. The client is now responsible for saving and sending this random value
    in both the request (as a hidden form field or other request parameter) and in
    a cookie. The cookie should be at least HttpOnly because JavaScript code should
    never need to access this value.


    +   4. The server verifies that the cookie value and request parameter are the
    same with each request.


    How does this work? If the user is logged in to this stateless website service,
    a forged request will always include the cookie. However, the attacker should
    have no way to access or otherwise modify the cookie value, so he cannot add it
    as a request parameter on a form. Without a request parameter matching the cookie
    value, the request will be rejected by the server.


    Another stateless CSRF pattern described earlier, but to use the standard synchronizer
    token pattern is use the value of the token off the session ID in a safe way instead
    of using a random value. Because the token will be generated from the session
    ID, and the session ID is already being saved server-side, the correct CSRF token
    value can be regenerated on-the-fly for each request without needing to save the
    token value server-side. So although the server itself may not be stateless, at
    least the CSRF defense mechanism would be.


    The best way to generate a hard-to-guess value from the session ID is to use HMAC,
