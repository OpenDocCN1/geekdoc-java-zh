  md: '# OWASP JAVA Encoder at a Glance


    The following describes how the OWASP Java Encoder works under the hood.


    +   - The encoders encode only the characters that need encoding and nothing else.

    - The encoders remove invalid characters from the text. For example, some characters
    are not valid anywhere in XML (and thus XHTML). If the characters are included,
    the XML parser/browser rejects the document/page as invalid.

    - Encodings are chosen to be cross-compatible as possible.


    HTML The following encoding functions are used to safely place untrusted data
    into different locations of an HTML document.


    ```

    Encode.forHTML(String) **parent

    Encode.forHtmlAttribute(String)

    Encode.forHtmlContent(String)

    Encode.forHtmlUnquotedAttribute(String)

    ```


    # OWASP JAVA Encoder Performance


    +   - The various encoder functions avoid allocations when possible using two
    strategies: (a) If a string doesn''t need encoding, it returns the string unchanged
    without allocating another string; and (b) they use pre-allocated buffers. This
    saves the associated overhead of the allocation and the subsequent garbage collection.

    - The encoders encode valid characters to their shortest possible equivalent,
    to the extent reasonable. For example, the double quote could be encoded as &quot;
    or &#39;—the encoder chooses the latter because it saves a byte.'
