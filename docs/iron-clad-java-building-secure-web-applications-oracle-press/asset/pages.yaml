  md: "# Chapter 2: Authentication and Session Management 29\n\n# Login Workflow Step\
    \ 4: Start the User’s Authenticated Session\n\nBecause HTTP is a stateless protocol,\
    \ you have no way of knowing who the user is between requests without extra effort.\
    \ Fortunately, you have a tasty way of adding state to HTTP—cookies! As soon as\
    \ a user logs in to your website, you first want to invalidate the anonymous session\
    \ and create a new authenticated session. This is done to stop session fixation,\
    \ which occurs when an attacker uses a known anonymous session ID to access a\
    \ user’s personal data after they login. The session is maintained by HTTP cookies\
    \ that are delivered from the server and saved in your browser. To make your job\
    \ easier, most Java frameworks will automatically create session cookies for you\
    \ simply because your code has created a new session:\n\n```\nHttpSession mySession\
    \ = request.getSession(true);\n```\n\nYou should ensure your website does not\
    \ support URL rewriting, or modifying URLs to add the session identifier to the\
    \ URL directly, something that most Java frameworks support by default for legacy\
    \ purposes. If you have ever seen a URL like this, you know that URL rewriting\
    \ is in use:\n\n```\nhttps://www.mysite.com/myAccount.jsp?sessionid=902B45163DCCFAE90748DBB358CC7502\n\
    ```\n\nURL rewriting is a feature of some servers that occurs when subjects’ browsers\
    \ do not support cookies or cookies have been disabled. URL rewriting is a security\
    \ vulnerability because it places your session ID at risk of exposure in browser\
    \ history, web server and proxy logs, and referrer headers. You want to avoid\
    \ placing any sensitive data in the URL, especially session identifiers. Rather\
    \ than degrade this less secure option, your website should instead inform that\
    \ user that cookies are necessary for website operation. To ensure that your web\
    \ application does not support session rewriting, you can force the session to\
    \ only support cookies via the following simple addition to your web.xml configuration\
    \ file:\n\n```\n<session-config>\n  <tracking-mode>COOKIE</tracking-mode>\n</session-config>\n\
    ```"
