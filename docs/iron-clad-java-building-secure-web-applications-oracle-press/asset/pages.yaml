    # Attacks on Access Control


    The most common form of attack against a web application''s access control mechanism
    is called privilege escalation. This is when a (normally authenticated) attacker
    is able to manipulate input in a way that allows him to access features or data
    he should not be able to access. For example, in Vertical Privilege Escalation
    an attacker may register for a standard user account and, via malicious input
    manipulation or other techniques, may access administration functionality. This
    often takes the form of simply browsing to a known (guessed) administration URL.
    Tools exist that can rapidly cycle through long lists of names or random URL paths,
    looking for responses that differ from the standard "404 Not Found" page. This
    is why "security by obscurity" is not a valid access control strategy.


    Another attack on access control is a Horizontal Privilege Escalation attack.
    In Horizontal Privilege Escalation, two users may have the same level of permissions
    but an attacker may leverage one account to maliciously access another user''s
    private data. This could occur by manipulating the from and account numbers in
    a bank transfer request:


    ```

    POST /accounts/transfer HTTP/1.1

    Host: www.vulnerable.com

    Cookie: JSESSIONID=3C7DD859EEBEC05D4FA04BC64EC565

    Content-Length: 1073

    amamount=10006&from=10153&to=31328

    ```


    Other attacks on access control include the abuse of business logic or abuse of
    workflow. For example, a normal workflow at an eCommerce website would include
    steps such as adding an item to a cart, setting the shipping address for delivery,
    setting the payment address, entering payment information, successfully processing
    the payment, and then completing the checkout. Attackers may attempt to abuse
    this workflow by skipping the payment steps.'
