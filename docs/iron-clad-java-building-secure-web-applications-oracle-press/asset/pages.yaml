  md: '# Chapter 4: Cross-Site Scripting Defense 91


    Consider the following example. The following page includes vulnerable JavaScript
    that takes values from the URL and then adds them to the DOM (Document Object
    Model) of the HTML page:


    ```

    <script type="text/Javascript">

    //get values from the URL

    var message = window.location.hash

    //write the value to the DOM

    document.errorDiv.innerHTML = message

    </script>

    ```


    <div id="errorDiv"></div>


    When a user hits the page with a URL that contains a script to be added to the
    DOM and executed in the browser: http://vulnerable.com/domxss.jsp<script>alert(''xss'')</script>.


    In the preceding example, the value of window.location.hash is never actually
    transmitted to the server, so the entire attack can be executed without ever alerting
    the administrators of the server!


    The hash-based XSS attack payload is the classic defense of DOM XSS proposed by
    Amit Klein in 2005. In Amit''s "Effective defense" section, he describes the difference
    between defending against "reflected" and "stored" XSS versus against DOM XSS.
    Amit''s "DOM XSS Defense" section states that "Data validation at the client side
    (in JavaScript)" or "Alternative server side logic" is the right approach. This
    was a great definition in 2005 but needs a little refining today.


    We would like to update the definition of DOM-based XSS in terms of how programmers
    must defend against it. As will see shortly, that reflected and stored XSS are
    primarily fixed in server-side code. DOM XSS must be fixed in client-side code,
    by doing client-side validation in JavaScript, escaping untrusted input in JavaScript
    and using safe JavaScript and JavaScript library APIs.


    With this new definition in mind, a large number of new DOM XSS sources are possible
    beyond just the document hash, including the following:


    +   - document.url

    - document.cookie

    - window.location.search

    - history.replaceState


    2 Amit Klein, DOM XSS of the Third Kind, www.webappsec.com/projects/articles/071105.shtml'
