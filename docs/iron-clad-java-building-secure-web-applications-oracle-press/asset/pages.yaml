    # Salt


    Regardless of which algorithm you choose for password storage, be sure to add
    a unique per-use salt to your user''s password before protecting it. Because PBKDF2
    and script produce predictable output, if two users have the same password, their
    password ciphertext will be the same. For example, the SHA-256²³ hash of "password1"
    will always be:


    ```

    0b14d501a594442a01c6859541bcb3e8164d183d32937b8518354

    42f9d5c9ae

    ```


    If your password is ever compromised and an attacker is able to reverse one of
    the hashes, the hacker could simply look for other entries that have the same
    value and be able to compromise many accounts for the "price":


    Adding a random salt to your hash ensures that no two password hashes are the
    same, even if they use the same starting value. The following SHA-256 hashes all
    used the same starting value of "password1," but this time with a random salt
    applied:


    ```

    83cad32be82c26f19b3ea8a7dc7c43dd301b047db40ec90b33cc

    dff270d084

    148aa6f263b2b30d28feca57f4c4a060051a5620e8c1c080306

    33899d52ae1

    f82550cc571ca4613e93a708cb6426c01fc4c18ebe967a8c759062

    c2fa6f301a

    ```


    This radically increases the size of the rainbow table that an attacker would
    need to store all precomputed hashes of all possible passwords. Adding a 32-character
    random salt would mean that instead of one entry, an attacker would need 6²³ or
    2.27e⁵² entries, just for "password1!"


    Whenever a user creates or changes his random value, the salt. Then, add the salt
    to the password before you protect it with PBKDF2, script, or your specialized
    HMAC setup. Be sure to store the salt along with your hashed password in the database
    so that you can use the salt again on subsequent authentication attempts. Without
    the stored value of the salt, you will never be able to recompute the correct
    hash to check if a password user entered is correct!


    > ²³ This is an example. Never use SHA-256 for password storage; use PBKDF2 or
    script!


    > ⁴ Assuming all uppercase and lowercase, plus digits.'
