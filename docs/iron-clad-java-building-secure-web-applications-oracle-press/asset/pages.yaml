  md: '# Attack 1: Upload of Dangerous Content


    Any time you allow your users to upload files into your system, you open yourself
    to attack. You have to assume that sooner or later some type of dangerous file
    will get uploaded to your server, either because of a malicious attacker, or a
    virus, or other malware on a legitimate user''s system. The following are some
    types of dangerous files that could be uploaded:


    +   - Viruses and other malware that could infect your users.

    - HTML files containing XSS or CSR attacks.

    - Executable code, such as a JSP file or WAR file.

    - Even a PHP or ASP file could be dangerous in environments where multiple technologies
    are in use.


    # Validating File Extensions


    Your first step should be to perform whitelist-based input validation to ensure
    that only certain file extensions are allowed. Once you have determined the file
    extension, you can then take additional actions to either accept, reject, or validate
    the file contents, as shown in Table 8-1. Files with .htm or .html extensions
    will likely be automatically rendered by your browser when you try to download
    them. Any JavaScript contained in these files will run in the same domain as the
    site itself, completely circumventing the browser''s Same Origin Policy, giving
    an attacker a perfect vector for stored XSS. Likewise, CSS in these files can
    override your site''s styles and be a means for defacement of your site. Extensions
    such as .jsp, .jsp, or .war indicate that the server will attempt to execute directly.
    These should be explicitly banned, and any attempt to upload one should result
    in an alert logged for auditing by your security department.


    If some reason you absolutely have to support dangerous file types as .jsp or
    .war (for example, if you are creating a developer portal) they should be stored
    on a completely separate domain and served by a separate web server that is not
    a Java app server. For example, if your main web application runs on Tomcat at
    www.mycompany.com, your file uploads could be stored and served from a plain Apache
    server at www.mycompanyfiles.net.'
