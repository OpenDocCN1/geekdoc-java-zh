  md: '# 54 Iron-Java: Building Secure Web Applications


    OAuth 1.0 was based on cryptographic roots but was vulnerable to session fixation
    and other issues.30 OAuth 2.0 is currently in wide use and is used by many major
    consumer websites, such as Facebook, Twitter, and Google+. OAuth is also making
    headway in the enterprise for mobile authentication because of its ease-of-use.


    Although OAuth is named Open Authorization (Access Control), it is still primarily
    an authentication standard. In many implementations, OAuth does allow users to
    grant permissions to apps to do things such as access data and friend lists, and
    post to social networks on your behalf. In this way, it is like the reverse of
    a traditional authorization scheme, as we discuss in the next chapter, because
    it enforces permissions for apps, instead of enforcing permissions for users.


    For information on the OAuth 2.0 standard, visit http://tools.ietf.org/html/rfc6749.


    # Additional Reading


    One of our favorite resources on session management is the “Session Management
    Cheat Sheet” from the OWASP Foundation, written by Raul Siles.31 This is a good
    place to start before building a complex session management mechanism from scratch.
    Another cheat sheet in this series is the “Authentication Cheat Sheet,” written
    by Eoin Keary.32 The Apache Shiro framework also provides a fairly elaborate and
    configurable authentication mechanism.33


    # Summary


    Authentication layer security is complex and requires precise design. Ensure that
    all authentication and subsequent authenticated requests are done over a secure
    transport. Secure the session correctly with proper cookie settings and timeouts.
    Force users to re-authenticate at critical application boundaries. Use PBKDF2,
    bcrypt, or HMACs for password storage. Build secure forgot-password and change-password
    features. These are the essential security considerations for authentication and
    session management. You can see the secure front!


