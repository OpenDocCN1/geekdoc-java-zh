  md: '# Summary


    These mechanisms are all excellent ways to detect attackers, stop certain forms
    of automation, and leave a clear trail of evidence to investigate security incidents.
    But if these techniques are your only defenses to secure your web applications,
    then your application''s security will quickly be like (as the old saying goes)
    wearing a fur coat and no knickers. Designing a secure application is building
    a complete suit of armor, with helmet, gauntlets, and all of the other accoutrements
    that go with it. Logging, intrusion detection, and anti-automation techniques
    can give you incredible visibility into attacker behavior when implemented correctly,
    but they are just one piece of the complex secure software puzzle.'
