    # Input Validation Anti-Patterns:

    Blacklist Validation Only


    Blacklist or negative validation defines what an attack looks like and blocks
    it. This is an interesting and sometimes effective form of intrusion detection,
    but it is not a strong defense. Blacklist validation may stop some very well-known
    attacks to your application, but it is not a control that will stop all attacks.
    There is a huge incentive and relatively little risk for hackers to try new things.
    The threat landscape will be constantly evolving and there are essentially an
    infinite number of possible attack patterns to block. There are many types of
    "filter evasion techniques" such as encoding your attacks or submitting input
    that might contain an attack (like the SQL injection email address '' -@manico.net).
    Commercial "fuzzers" exist that can constantly bombard your applications with
    tiny variations of inputs until a weakness is found. These alone can make maintaining
    a blacklist daunting chore, at best. In Chapter 9, we will discuss means of using
