- img_proc: true
  md: '# 110 Iron-Clad Java: Building Secure Web Applications


    This will result in the input JavaScript being appended to the DOM, and the script
    will execute:


    ```

    <div id="myDiv"><script>alert("XSS");</</script></div>

    ```


    Fortunately, in many cases jQuery provides similar methods that are not vulnerable.
    For example, replacing html with text will cause the input to be treated as text
    and the unsafe characters will be replaced with their corresponding HTML entities:


    ```

    $(''#myDiv'').text(''<script>alert("XSS");</</script>'');

    //outputs <div id="myDiv\&lt;script&gt;alert("XSS");</div>

    &lt;/script&gt;</div>

    ```


    The following are a few examples of jQuery constructs that are vulnerable to cross-site
    scripting. Great care must be used to develop jQuery-based applications that are
    immune to XSS.


    ```

    $(''#myDiv'').before(''<script>alert("XSS");</</script>'');

    $(''#myDiv'').after(''<script>alert("XSS");</</script>'');

    $(''#myDiv'').append(''<script>alert("XSS");</</script>'');

    $(''#myDiv'').prepend(''<script>alert("XSS");</</script>'');

    $(''<script>alert("XSS");</</script>'');

    ```


    # jQuery Encoder


    One possible solution for preventing DOM-based XSS issues when using jQuery is
    the jQuery encoder, provided by Chrisisbeef.¹¹ jqencoder is a jQuery plugin-in
    whose goal is to provide developers with a means to provide contextual output
    encoding on untrusted data, directly within jQuery. It provides methods similar
    to those that we have already discussed in other libraries, which should make
    it easy for a developer to apply the same level of XSS protection in her JavaScript
    as well as in her Java code.


    > ¹¹ https://github.com/chrisbeef/jquery-encoder'
