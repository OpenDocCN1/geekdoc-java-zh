  md: "# Chapter 3: Access Control 65\n\n# Anti-Pattern 6: Fail Open\n\nYet another\
    \ common problem with access control mechanisms is the “fail open” flaw. When\
    \ reviewing a web application's access control, a regular quality analysis (Q/A)\
    \ process might verify that standard web application user behavior limits access\
    \ properly. However, certain scenarios outside of the application's normal operation\
    \ may cause program errors that cause the access control mechanism to fail. For\
    \ example, consider the processing of a request parameter in Java. In normal use,\
    \ `getParameter()` will return either an empty string or the data that was submitted.\
    \ But what if the attacker uses an intercepting proxy and fully removes the parameter\
    \ from the request? The `getParameter()` method then returns NULL, nothing the\
    \ programmer may have prepared for. The returning `NullPointerException` may cause\
    \ a failure that grants access. This may seem unlikely but does indeed happen\
    \ on occasion.\n\nFail Open Access Control Example When processing form input\
    \ from the request, there are three basic possibilities:\n\n+   - The parameter\
    \ could have been left empty, which results in an empty string.\n\n+   - The parameter\
    \ may have data entered, which would return a string containing the submitted\
    \ data.\n\n+   - An attacker may use an intercepting proxy to remove the entire\
    \ parameter, which results in the value being null. This could cause a `NullPointerException`,\
    \ which, if not handled correctly, could circumvent some access control checks.\
    \ Because `NullPointerException` is a subclass of `RuntimeException`, it will\
    \ not be flagged as a potential issue by the compiler. Thus, developers might\
    \ not even consider this possibility until it is too late.\n\nImagine the following\
    \ code where the developer never ever considered the possibility that the debug\
    \ parameter might be null. Q/A would have missed this as well if they were only\
    \ testing the “normal” operation of the site!\n\n```\nboolean hasAdmin = false;\n\
    try {\n    // lets say this is true.\n    if (executingAdminCommand ( ))\n```"
