  md: 'plan in place to deal with a negative security event should such a situation
    arise. Incident response plans will be different for every organization, but you
    can start answering the following questions:


    +   * What do I do if a vulnerability is discovered on my live website?

    * What do I do if I discover that I''m actively being hacked?

    * Do I have backups in case of data loss?

    * Do I have a failover plan in the case of a denial of service?

    * Am I logging enough information to reconstruct how a breach happened, by whom,
    and what was accessed?

    * What do I do if I discover that the public (from Pastebin) knows that I was
    recently hacked?

    * What am I legally required to disclose to my users?


    These are the questions that every incident response team must prepare for. Incident
    response is a huge topic, and could probably be the subject of an entire book
    in of itself. For the purposes of this book, incident response teams and developers
    really intersect in the realm of logging and intrusion detection. We recommend
    that you review Chapter 9 for more information about logging. During actual operation
    of your site, be sure to review your log files with written correctly and backed
    up, and that you have an appropriate level of information being logged. Also,
    you should know your log rotation policy and specify an appropriate duration for
    log retention. In the wake of an event, it is critical to evaluate what worked
    and didn''t, and then adjust your process accordingly. In the post mortem, you
    want to make sure that you not only fix the one thing that went wrong, but also
    fix the entire *class* of problems. So if you found that you were vulnerable to
    XSS for example, do an application inventory assessment and make sure that you
    are using proper output encoding in all locations throughout your site. If necessary,
    you may need to revisit your security controls and make adjustments.'
