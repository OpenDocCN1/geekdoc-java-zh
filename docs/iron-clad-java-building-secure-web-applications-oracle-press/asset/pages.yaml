    # Forgot Password Workflow


    If you are encouraging your users not to reuse passwords, and you enforce a strong
    password policy, sooner or later you are going to deal with users forgetting those
    long complex passwords. The most common way that consumer-centric websites support
    the “forgot password” workflow is through a password reset form that asks for
    a username and then sends an email with a one-time link to the email address on
    file for the account. If you are a user of online banking, try to reset your password.
    You will note that most financial institutions do not trust the security of email
    as a fundamental part of password workflow. They have a good reason for this:
    Email was not designed with privacy or security in mind.


    If possible, do not support the forgot password workflow as part of your website.
    Force your enterprise to call in or use some other well-vette manual process.
    This alone will deter more attackers. While this is ideal, it does not scale well.
    If you have an automated forgot password process, consider the following example
    from the banking industry:


    +   1. Establish the user''s identity with requests for two or more pieces of
    information such as the user''s Social Security number26 and account number. Start
    a session for this process and ensure that the rest of the process comes from
    the same session.

    2. Once you have successfully established the identity of that user, as an optional
    step, consider asking the user a security question27 that users set up during
    registration. Some banks use this; some do not.


    25 https://www.owasp.org/index.php/Password_Storage_Cheat_Sheet

    26 The Social Security number may not be good general advice for everyone (outside
    of banking) because it requires some handling precautions: www.pearalto.org/clientuploads/Legal/Statutes/SSNPrivacyAct.pdf

    27 Good security questions must be memorable, consistent, nearly universal, and
    safe. For on choosing good security questions go here: https://www.owasp.org/index.php/Choosing_and_Using_Security_Questions_Cheat_Sheet.'
