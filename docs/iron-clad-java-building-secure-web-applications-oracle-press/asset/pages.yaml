  md: '# 202 Iron-Clad Java: Building Secure Web Applications


    File input and output (I/O) refers to the process of reading, writing, or otherwise
    managing files during operation of your web application. All file I/O requires
    special security handling precautions for safe use. In this chapter, we describe
    various techniques you can apply to your own applications to reduce the risk of
    exploitation.


    # Anti-Patterns and Design Flaws


    Handling files in your application can open up to a number of vulnerabilities
    that are not encountered when displaying data from other sources. Following are
    several design flaws that should be avoided in order to securely handle files.


    # Design Flaw 1: File Path Injection


    In this section, we discuss the classic security design of file path injection,
    otherwise known as path traversal. The goal of a path traversal attack is to gain
    access to resources that should otherwise not be accessible. The classic definition
    involves reading resources that are outside of the web application folder, but
    as we will demonstrate, it can actually be equally dangerous to read or write
    files inside or outside of the web application folder.


