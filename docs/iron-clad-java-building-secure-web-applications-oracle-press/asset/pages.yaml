    # XML and JSON-Based Injection


    Frequently, XML/JSON parsing occurs at multiple tiers within a web or web service
    application. A variety of technologies may consume or deliver XML/JSON. And it
    is possible that both delivered and received XML/JSON in part may contain untrusted
    data. This can lead to server-side XML injection, or browser-based cross-site
    scripting from untrusted JSON.


    XML/JSON needs to be sanitized or parsed with safe parsers in a variety of locations
    within a web application:


    +   - When the browser is parsing untrusted JSON, a safe parser should be used
    in JavaScript, such as JSON.parse.

    - When web services receive untrusted XML, an XML schema should be applied to
    ensure proper XML structure. The XML Schema Definition (XSD) allows you to specify
    a very granular definition of what elements, attributes, and data types can be
    contained within an XML document.

    - When untrusted XML/JSON is submitted to a user or other service (untrusted XML/JSON
    leaves a web service in some way), that output needs to be in the the proper format.
    Validation, encoding, and outbound sanitization are necessary.

    - When XML query language (XPath, XQuery) requests are intermixed with untrusted
    data, query parameterization or encoding is necessary.


    The same moral of secure coding holds true. Any time you are assembling some kind
    of text-based command (OS, SQL, XML, and so on) that is mixed with user or untrusted
    data, a similar special defense is needed to avoid injection or similar attacks.


