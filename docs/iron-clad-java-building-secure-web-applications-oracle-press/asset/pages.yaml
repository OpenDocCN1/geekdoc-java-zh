    # Login Workflow Step 2: Starting HTTPS and Encryption in Transit


    As we discuss in Chapter 6, HTTPS provides the benefits of confidentiality (a
    spy cannot see your data), integrity (a spy cannot modify your data), and authenticity
    (by the power vested in the certificate authority system, browsers can verify
    if a user is visiting the right site for that domain). With that in mind, it is
    safe to deliver the login form (the “login landing page”) over HTTP, as long as
    you securely submit the password over HTTPS? The answer is no. It is critical
    that you deliver login forms over HTTPS. Why? Many sites deliver forms over HTTP
    but protect the password over HTTPS, but this is a very bad practice. Consider
    this basic login form:


    ```

    <form method="post" action="Loginprocessing.do">

    <input type="text" name="username">

    <input type="password" name="password">

    <input type="submit" name="commit" value="Login">

    </form>

    ```


    What is the harm if an adversary can see this data in transit? Absolutely none!
    All of this information is publicly available and an attacker could simply load
    the form in his own browser and inspect it to his heart''s content. HTTPS is more
    than just confidentiality; it also provides integrity. However, consider the harm
    attackers could do if they can modify your login form. What harm is significant!
    An attacker could insert a keylogger, cause HTTP POST to submit your password
    to a hacker-controlled website, or inject JavaScript to exfiltrate the password
    to another hacker-controlled website when you click Submit. Any sensitive form
    should be delivered over HTTPS, especially the login form.


    You also need to maintain HTTPS for all content any time a user is logged in your
    web application. HTTPS will protect the session identifier and other sensitive
    data in transit. HTTPS also enforces integrity. It will prevent the attacker from
    modifying your web pages because content cannot be


