  md: "custom response handlers if needed for a particular application. There are\
    \ two ways to receive responses: The application can either poll the analysis\
    \ engine for responses or receive updates via WebSockets. This provides architectural\
    \ flexibility necessary in many environments.\n\nLet's consider an example application\
    \ to show how AppSensor works. The application feature we are considering is \"\
    view account record.\" This application has a security control in place to prevent\
    \ unauthorized access, but we additionally want to see if the user is trying brute-force\
    \ access and respond accordingly:\n\n```\n@Path(\"/accounts\")\npublic class AccountViewHandler\
    \ {\n\n    @Inject\n    AppSensorClient ids;\n\n    @GET\n    @Path(\"/view\"\
    )\n    public Account findAccount(@RequestParam(\"id\") String id)\n        throws\
    \ UnauthorizedException {\n        User user = UserContext.getCurrentUser();\n\
    \        if (!user.isAuthorized(Data.Account, id)) {\n            //user is not\
    \ authorized\n\n            //alert AppSensor\n            Event event = new Event(\n\
    \                new User(user.getUsername()),\n                DetectionPoints.BRUTE_FORCE_ACCOUNT);\n\
    \            ids.addEvent(event);\n\n            //standard error handling\n \
    \           throw new UnauthorizedException(\n                \"Not authorized\
    \ to access this account.\");\n        }\n\n        Account account = accountDao.find(id);\n\
    \        return account;\n    }\n```"
