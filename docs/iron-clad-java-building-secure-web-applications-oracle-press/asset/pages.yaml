  md: '# Chapter 3: Access Control 59


    systems—for example, content editor, content creator, content publisher, system
    administrator, and so on. Roles are different from groups in that ascribe functions
    that in many cases may be performed by many individuals across different groups
    or areas of an organization. Roles may also be inherited from other roles. For,
    if a user has the ability to modify an object, that user must also have implicit
    read access.


    +   **Access control rules, or entitlements** An access control rule or entitlement
    is a logical decision or series of decisions that need to be made in order to
    determine if a subject is allowed to access some activity, feature, or data. Depending
    on the type of access control, these rules can define access to certain features
    or objects or combinations of.


    +   **Access control policy** An access control policy is the total collection
    of access control rules that make up your software.


    +   **Policy Information Point (PIP)** This is a general term that describes any
    attribute-source-potentially needed to make an access control decision/user data;
    object data; environmental data, such as time or location; and so on.


    +   **Action** An action is some kind of system feature, such as read article,
    modify article, create new article, execute batch process, schedule backup, or
    edit user.


    +   **Policy Enforcement Point (PEP)** This is the area in application code where
    the access control check is made. This code needs to properly handle both an accepted
    and a rejected decision.


    +   **Policy Decision Point (PDP)** This is the access control engine that takes
    all the attribute inputs and applicable access control policy for a specific request,
    and evaluates them to make access control decisions. While a PEP is an area of
    code where an access control check is made, the PDP is the engine that does the
    work behind the scenes of an access control check.


    +   **Policy Administration Point (PAP)** This is the administrative entry into
    the access control system that lets privileged staff create new policy and apply
    it to subjects and groups.'
