    \ do not share a common suite, the connection will fail with a Received fatal\
    \ alert: handshake failure exception before any application data is transmitted.\
    \ The code needed to specify the cipher suites is simple enough:\n\n```\nString[]\
    \ ciphers = {\n  \"TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA\",\n  \"TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA\"\
    \n};\nsocket.setEnabledCipherSuites(ciphers);\n```\n\nNow your socket will use\
    \ only one of those two cipher suites. If you control both endpoints, then you\
    \ can ensure the necessary cipher suites are supported on both sides, but if you\
    \ control only one side of the communication, then research and test extensively.\
    \ At the time of this writing, many servers lack full support of ECDHE. Google\
    \ supported the second suite, but not the connection to Google would fail if the\
    \ code only enabled TLS_ECDHE_WITH_AES_128_CBC_SHA.\n\n# Certificate Verification\n\
    \nRecall that impersonation is one of the threats that you want to block. Two\
    \ key techniques to block impersonation are verifying that the server's hostname\
    \ matches the hostname noted in the certificate, and verifying that the certificate\
    \ has not expired. By default, secure sockets in Oracle's JSSE will verify the\
    \ expiration date but not the hostname. This is because hostname verification\
    \ varies depending on the protocol built on top of TLS while expiration date checking\
    \ is the same across all protocols. We'll look at a subtlety in expiration date\
    \ checking in a moment, after we first look at hostname verification.\n\nWhile\
    \ the low-level secure sockets do not verify the hostname, the HTTPS support in\
    \ JSSE does. To accomplish this, the classes that implement HTTPS include a HostnameVerifier,\
    \ which verifies that the hostname in the certificate matches the name of the\
    \ host to which you are connecting. If they do not match, the connection will\
    \ terminate."
