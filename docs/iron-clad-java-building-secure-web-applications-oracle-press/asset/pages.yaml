  md: '# Security in the Software Development Lifecycle


    Now that you have built your team, it is important to consider security at every
    stage of the software development lifecycle. At each stage, consider how you can
    make best use of the resources at your disposal.


    # Business Requirements


    What does the business want out of the software you are tasked to build? Even
    “agile” teams need to start with some kind of business requirements. A good place
    to start in the construction of secure software is to capture the needs of the
    business. There are several critical aspects to a secure SDLC that are best handled
    at this stage. These include setting realistic expectations about how much time
    and budget are allocated for security activities. If your company does not already
    have resources such as developer training, static and dynamic analysis, and penetration
    testers, now is the time to plan for those.


    Access control and authentication requirements should be determined at this stage.
    The questions your architects would be asking: Is this a multi-tenant system?
    Do we have existing authentication services we need to integrate with? Do we need
    to support federation with other partners? Although it''s often preferable to
    handle technical security requirements at a later phase, capturing business requirements
    that affect authentication and authorization is critical at this stage because
    changing either of these mechanisms “late in the game” can be incredibly expensive.


    # Standards/Compliance


    Some of the most visible security drivers for upper management are the various
    compliance standards such as PCI-DSS (credit card management), HIPAA (health care
    information management), Gramm–Leach–Bliley (financial information management),
    and various international privacy laws, especially in Europe. While these various
    standards are often criticized by security professionals as not being technically
    accurate or complete (and rightfully so), they are incredibly powerful business
    drivers for security that have painful financial consequences if not followed.'
