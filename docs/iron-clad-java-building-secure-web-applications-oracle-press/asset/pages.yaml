  md: '# 78 Iron-Clad Java: Building Secure Web Applications


    XACML is an incredibly complex but comprehensive and feature-rich access control
    policy modeling. Implementing ABAC is beyond the scope of this book and is only
    needed for the most complex access control requirements. For more information,
    we encourage you to read the NIST publications on the subject at http://csrc.nist.gov/projects/abac.


    # RBAC vs. ABAC


    RBAC is all about roles while ABAC is all about attributes. In RBAC, roles also
    represent access control policy. In ABAC, roles are just attributes of users and
    contain all of the benefits of RBAC as a subset of ABAC’s benefits.

    The following table shows a few of the trade-offs between pure RBAC and ABAC implementations.


    | | Role-Based Access Control | Attribute-Based Access Control |

    |---|---||

    | Adoption | Widely adopted, well understood pattern. | New mechanism, but many
    systems already have ABAC-like features. |

    | Functionality | Not able to accommodate real time, environmental, or contextual
    access control decisions. | Highly flexible contextual, environmentally aware,
    and real time-capable access control system. |

    | Implement | Basic features of RBAC are built into most frameworks and are easy
    to implement. Complex context-specific access control features need to be custom
    coded. | Will require significant custom code and custom policy storage. Commercial
    and open source tools for ABAC still emerging. |

    | Maintain | Requires pushing of new code to change policy in most frameworks.
    | Highly flexible nature of ABAC allows for complex and custom policy to be created
    without major system changes. |

    | Administration | Very little administration needed. | Difficult to administer
    and provision. |'
