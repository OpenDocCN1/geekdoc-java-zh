    \ If the certificate at your.url.com does not match the your hostname, this connection\
    \ will terminate before any data is sent.\n\n```\nString hostURL = \"https://your.url.com\"\
    ;\nURL url = new URL(hostURL);\nHttpsURLConnection ctn;\nctn = (HttpsURLConnection)url.openConnection();\n\
    ```\n\nThe hostname connection is complicated and a bit fussy. As a result, it\
