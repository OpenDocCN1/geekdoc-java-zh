  md: '# 132 Iron-Clad Java: Building Secure Web Applications


    # HTTP Verbs


    GET and HEAD as “retrieval HTTP verbs only” may have been the intention of Internet
    architects when the HTTP standard was first created, but it''s certainly not the
    truth anymore. It''s really up to the site designer if GET only performs retrieval
    type actions. Of course, there are some practical differences in GET vs. POST
    data content length limits. Regardless, it''s important to protect any sensitive
    transactions with proper CSRF defenses.


    # POST vs. GET


    The HTTP protocol suggests that only POST methods should change state and that
    other methods should not change the state of the web server in any: “In particular,
    the convention has been established that the GET and HEAD methods SHOULD NOT have
    the significance of taking an action other than retrieval.”¹³ In then, only POST
    requests should be dangerous and only POST requests should need CSRF protection.
    However, some application frameworks choose to add CSRF protection to all URLs
    and to all form submission/POST requests. This is an acceptable practice, but
    it often often break bookmarking because a CSRF token bookmarked today should
    be completely invalid tomorrow.


    One way to reduce the attack surface of a potential CSRF attack is to enforce
    the POST HTTP server-side when a POST request is expected. More specifically,
    when a POST is expected, you should reject any HTTP GET request or any other request
    with an HTTP verb other than POST! In many apps, both GET and POST requests are
    accepted unnecessarily when only a POST should be accepted. Enforcing POST or
    any other HTTP verb server-side is not even remotely a complete CSRF defense.
    As demonstrated, POSTs can be forged as easily as GETs. But limiting your HTTP
    verb to POST does at least reduce the attack surface.


    It is also important to note that some Java web frameworks make it extremely difficult
    to limit which HTTP verb (POST or GET) is appropriate


    > ¹³ www.w3.org/Protocols/rfc2616/rfc2616-sec9.html'
