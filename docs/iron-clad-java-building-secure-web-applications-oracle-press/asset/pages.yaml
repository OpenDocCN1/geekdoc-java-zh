  md: "# 188 Iron-Clad Java: Building Secure Web Applications\n\nThe count of users\
    \ in the database is not that interesting in itself, but it does provide an attacker\
    \ with a simple indicator for finding other interesting or useful data. Sending\
    \ an attack string like the following:\n\n```\n'''''' OR CASE WHEN SUBSTR(password,\
    \ 1, 1) = 'a' AND ROWNUM = 1 --\n```\n\nwould cause the query executed to become:\n\
    \n```\nSELECT (*)\nFROM users\nWHERE lastname= 'xxxx'\nOR CASE WHEN SUBSTR(password,\
    \ 1, 1) = 'a' AND ROWNUM = 1 --\n```\n\nIt is not likely that there is a lastname\
    \ 'xxxx' in the database so that part of the WHERE clause will evaluate to FALSE.\
    \ But if the first character of the first user's (hopefully hashed) password is\
    \ a, this statement will return 1. If it returns 0, then the attacker knows the\
    \ first character is not a. By rapidly iterating through the alphabet at each\
    \ position in the password column, an automated tool like SQLMap² can retrieve\
    \ the contents of an entire database, one character at a time!\n\nThe solution\
    \ for the previously described stored procedure so that it is immune to SQL injection\
    \ is straightforward. The developer simply needs to replace the concatenated SQL\
    \ statement with the version of query parameterization that is available in the\
    \ database's own stored procedure language (highlighted in **bold**):\n\n```\n\
    CREATE FUNCTION user_count_last_name (\n  input_last_name IN VARCHAR2\n)\nRETURN\
    \ INT AS\n  total_users int;\n  final_query varchar2(32767) :=\n  'SELECT COUNT(*)\
    \ FROM users WHERE lastname= :input';\nBEGIN\n  EXECUTE IMMEDIATE final_query\
    \ INTO total_users USING input_last_name;\n  RETURN total_users;\nEND;\n```\n\n\
    As you can see, building injection-resistant stored procedures is not challenging.\
    \ In fact, it’s one of the easiest secure coding techniques to master.\n\n> ³\
