  md: '# Iron-Clad Java: Building Secure Web Applications


    ### What Do CSRF and Clickjacking Have in Common?

    CSRF and clickjacking both abuse the user''s trust in a site other than the one
    being attacked. These attacks are often hosted on third-party sites with the intention
    of exploiting a vulnerability on a different site that the user might not even
    be viewing. Cross-site scripting, on the other hand, truses the user''s trust
    in the site they are actually viewing at the time of the attack.


    # # How to Combat Clickjacking


    To prevent clickjacking, you must prevent your site from being displayed in a
    frame by another site. This can be achieved by either preventing your site from
    being framed, or breaking out of framing sites (framebusting).


    # ## Stop Your Site from Being Framed with Framebusting


    The most straightforward defense against clickjacking is to prevent your website
    from being loaded in a frame in the first place. This is easily achieved by sending
    an X-Frame-Options HTTP response header. This header instructs compliant browsers
    that the site is unwilling to be framed by third-party sites. There are three
    main X-Frame-Options choices:


    +   - X-Frame-Options: DENY This option blocks any site from the web page you
    are trying to protect.


    +   - X-Frame-Options: SAMEORIGIN This option blocks any site from framing the
    web page you are trying to protect, except for sites of the same domain name and
    port.


    +   - X-Frame-Options: ALLOW-FROM affiliates.com This option allows only the domain
    listed after the ALLOW-FROM directive and blocks all others. If you want your
    site to be frameable by multiple other sites, you must send the X-Frame-Options:
    ALLOW-FROM header multiple times.'
