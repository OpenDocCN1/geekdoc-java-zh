  md: '# Chapter 3: Access Control


    # Positive Pattern 5: Be Able to Change a User''s Entitlement in Real Time


    The moment your system changes the access control policy rules for a specific
    user (i.e., the user''s entitlements) those changes should take place immediately.
    We have encountered numerous systems where the access control policy is loaded
    for a subject when he or logs in, and not refreshed until the user logs off and
    back again. It is easy for an attacker who has captured a valid user''s session
    to set up a script to ping a site every few minutes, keeping session, and thus
    that level of access, alive indefinitely.


    It is critical for high-security systems to make access control policy changes
    take effect immediately. As a compromise between performance and security, we
    have built several systems where the access control policy is cached at login
    time and is refreshed every few minutes, based on performance and security needs.
    In such systems, it is also prudent to clear the loaded access control policy
    from the cache as soon as a change is made. This will force the policy to be reloaded
    on the next user request.


    # Positive Pattern 6: Access Control Policy Expressiveness


    An access control policy needs to be able to model the required functionality
    desired by the application. An access control mechanism with a great deal of expressiveness
    can model a wide variety of access control policies and handle input from a wide
    variety of sources when implementing those policies.


