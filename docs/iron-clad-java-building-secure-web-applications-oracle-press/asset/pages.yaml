  md: '# 56 Iron-lad Java: Building Secure Web Applications


    Access control, or authorization, is the process of limiting users to access only
    the functionality and data that they are specifically permitted to use. The Principle
    of Least Privilege, or POLP, defines the essence of what a good access control
    mechanism should deliver. Every program and every privileged user of the system
    should operate using the least amount of privilege necessary to complete the job.


    The Principle of Least Privilege applies not just to access control within your
    application, but as we discuss elsewhere in this book, it should also be applied
    to every other facet of your application architecture as part of a strong defense-in-depth
    strategy.


    Even in a simple web application, access control appears at many layers: within
    the application itself, as part of the web server software, the JEE container,
    the operating system it is installed on, the database, and several layers that
    each have their own flavor of access control. This chapter focuses on application-specific
    access control that you as a developer need to build within your Java web applications.
    We are not describing the access control mechanism needed for an operating system,
    a router, or other network appliance. Each of these requires a form of access
    control that is quite different in implementation and design compared to a web
    application or service. We will discuss the various theories behind access control
    and ultimately our goal in this chapter is to provide you with a path toward building
    a modern access control system that is appropriate for your application.


    Unlike other risks, such as SQL injection or clickjacking, there is no simple
    answer to the question “What kind of access control should I design for my application?”
    This is actually a problem for the developer. When there are many different schemes
    for implementing access control, and seemingly every framework has its own implementation,
    making the right choice is often difficult. Sometimes, developers just use the
    built-in access control mechanism that comes with their application framework,
    only to find out that the built-in access control APIs are inadequate for their
    needs. Or even worse, developers do not even think about access control until
    late in the project, if at all. Some may say, Damn the torpedoes make everyone
    an admin! But do not give in to the dark side. Because access control is so design
    heavy and becomes integral to the security nervous system in your software, it
    is important to carefully consider access control from the very earliest stages
    of your project.'
