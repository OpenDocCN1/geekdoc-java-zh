    # Password Storage: Verify but Not Recover


    How should you store your passwords? Let''s start with a few requirements. Essentially,
    you want to be able to verify, incredibly quickly, if a user''s password is correct.
    However, even if attackers should somehow steal your database or credential data,
    you do not want to be able to read the passwords, within any reasonable amount
    of time, even when supercomputing capabilities are available. The best password
    storage strategies use password-based key derivation functions that store the
    password into a form that is unrecognizable from the original. This prevents even
    website administrators from knowing their users'' passwords! There are also working
    groups of cryptographers researching and building next-generation password hashing
    algorithms.¹¹¹


    The best (and possibly only) threat model created on password storage is from
    John Steven.¹¹² We challenge the application security community that disagrees
    with John''s assertions to publish a competing threat model, or to critique his
    work in some scientific and publishable way. Plenty have disregarded these recommendations
    without providing any sort of scientific evidence as to why.


    That aside, the whole purpose of strong password storage is to prevent attackers
    from discovering your users'' passwords even when your database/ or password ciphertext
    is stolen. Once your password data is stolen, attackers will attempt to discover
    your users'' passwords "offline": using dictionary attacks, brute force attacks,
    and rainbow table attacks (i.e., precomputed databases of hashes).


