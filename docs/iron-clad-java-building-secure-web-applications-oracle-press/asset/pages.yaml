  md: '# 216 Iron-Java: Building Secure Web Applications


    It is important to set not only a maximum file size, but also the maximum size
    of an entire request. Consider what would happen if an adversary determined that
    your maximum file size was 1MB, but then proceeded to send you several concurrent
    requests, each with thousands of 1MB minus byte files. Your application would
    parse each file in the request, rapidly filling up RAM or disk space and possibly
    crashing your server even before the entire request finishes parsing.


    # Processing Zip, Rar, and Other Archive Formats


    While building an image upload years ago, the client often needed to upload several
    dozen images for a specific topic at the same time. This was long before today''s
    ubiquitous drag-and-drop file upload systems became available. Instead, the client
    wanted the ability to upload a zip file full of images. Early versions of our
    website would accept a zip file, recursively loop through each folder in the archive,
    unzip the contents into a directory, and verify each image for file size and other
    security considerations. This was a big mistake.


    A zip bomb is a malicious zip or other archive file format that is of a small
    size compressed but is of a giant size uncompressed. A famous zip bomb is 42.zip.
    It is only 42 kilobytes in size but unzips to over 4 petabytes if all files and
    folders are uncompressed! Attempting to unzip such a file would rapidly consume
    all available disk space (or worse, RAM) on your server, leaving you with a denial
    of service.


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_235_0.png)


    > TIP

    Ensure that the uncompressed size of an archive file is not larger than the quota
    available for the user, before doing the actual uncompress action.


    Most zip or other archive APIs allow you to inspect the total uncompressed size
    before conducting the actual uncompress action. In java.util.zip.ZipFile, this
    is accomplished by iterating through each ZipEntry and adding the results of the
    getSize() method:


    ```

    ZipFile zipFile = new ZipFile("testzip.zip");

    long totalUncompressedSize = 0;

    Enumeration<? extends ZipEntry> e = zipFile.entries();

    ```


