  md: '# 174 Iron-Clad Java: Building Secure Web Applications


    is authorized to encrypt, return the encrypted data. Decryption would work similarly.
    One benefit of this scheme is that the crypto service could allow some applications
    to just encrypt data and a different set could decrypt. For instance, front-end
    order taking systems might be able to request encryption services, but only the
    back-end order processing systems could actually request the decryption of the
    data. Keyczar, with its built-in key management features, could make a great foundation
    for this sort of crypto service.


    Another option in this vein is to split encryption from key management. In this
    scenario, encryption and decryption could happen on the application server, but
    the keys are actually stored elsewhere. When the application needs keys, it sends
    a request to the key server. If the key server validates the requester, then it
    sends the keys to the application. The application would never write the keys
    to the disk, but instead keep them in memory. Keyczar''s reader framework, which
    we used for the key encrypting key functionality, could be extended to make this
    happen fairly transparently.


    Building these sorts of systems is beyond the scope of this book, but if you are
    working in an environment that depends heavily on encryption, implementing either
    a crypto service or a key server will make managing the keys much easier. Key
    management will be centralized to a single system rather than spread across several
    different applications. It can also make security audits a bit easier because
    key storage is only in one place.


    # Secure Random Numbers


    Our last topic in this chapter is brief, but important. Often, when dealing with
    cryptographic and other security operations, you''ll need access to a system that
    generates random numbers. Generating an unpredictable sequence of numbers is not
    trivial, and in this section we look at how to do this in Java.


    Many computer systems have a facility for gathering random data from events that
    occur within the hardware or depend on some other nondeterministic processes.
    This pool of randomness is generally high quality, but it is limited. Once the
    pool is used, it won''t be refreshed again until more of the necessary hardware-related
    events occur. If your code depended on this source of randomness, you would need
    to prepare for the possibility of your code blocking while it waits for additional
    randomness, or entropy as it is called, to be accumulated.'
