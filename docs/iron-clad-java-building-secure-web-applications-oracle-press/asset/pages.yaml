    # # Summary


    This chapter covered a variety of mechanisms to protect sensitive data as it moves
    across a network or is stored on a machine or media. For protecting data in transit,
    we examined how Java supports TLS and SSL through the Java Secure Sockets Extension
    (JSSE) and looked at the key elements of using that library securely, demonstrated
    how to set the desired cipher suites and verify certificates using custom trust
    managers, and provided detailed techniques for managing the certificates used
    by TLS and SSL. Finally, the section wrapped up with coverage of certificate pinning,
    a relatively new technique for validating certificates.


    In the section on securing data at rest, we went detail into using Keycaesar,
    a toolkit that simplifies the correct implementation of cryptographic operations
    and key management processes. After discussing the differences between encryption
    and signing, the two types of operations that Keycaesar supports, the section
    explored the details of keysets—which Keycaesar uses to store its keys. We then
    presented examples showing how to encrypt and decrypt using AES and RSA, and how
    to sign and verify using DSA. The section wrapped up by describing key management
    techniques in Keycaesar, which range from encrypting the keys to a discussion
    of key servers and crypto service providers.


    The chapter concluded with a discussion of Java''s capabilities for generating
    cryptographic random numbers and how those capabilities depend on the underlying
    operating system. We covered sources of randomness, the correct order in which
    to invoke operations on a SecureRandom object, and how to refresh SecureRandom
    periodically with new random data. You should now have a solid understanding of
    how to keep your data secure from the threats discussed at the beginning of this
    chapter: eavesdropping on network traffic, impersonation, and theft of stored
    data.'
