  md: '# Chapter 1: Web Application Security 3


    application. You could think of untrusted data as raw input from your users. That
    is a good start, but that definition is unfortunately incomplete. Any data that
    enters your web application from an outside source, be it input typed by users,
    uploaded files, third-party cloud services, even databases and other applications
    within your own organization, should be treated as untrusted.


    To understand the potential evil power of untrusted data, let''s first talk about
    the idea of an intercepting web proxy, a rather basic and fundamental tool that
    hackers will use as they attempt to exploit your web application. You will see,
    even if your users do not type in themselves should still be considered "unrusted
    data."


    Let''s start looking at an important network setting common to all browsers—your
    proxy setting. In Firefox, for example, security testers (and hackers) will start
    by changing their network proxy setting to proxy all requests through some port
    on localhost (see Figure 1-1).


    Once this setting is applied, the browser will stop working because a proxy server
    is expected at that address (see Figure 1-2!). This is proper behavior until an
    inappropriate proxy server is launched locally.


    Once you launch an intercepting proxy (such as Burp Suite, OWASP ZAP, OWASP WebScarab,
    and the Firefox plug-in Tamper Data), your browser once starts surfing the Web.
    However, your traffic is now being recorded by the proxy (see Figure 1-3).


    Once the proxy is in place, individual requests can be intercepted and modified.
    Not only can attackers modify fields that contain user-entered input, they can
    also add, modify, or delete headers, cookies, the HTTP verb (GET, POST, and so
    on), and any other aspect of the HTTP request (see Figure 1-4). This leads us
    to the most fundamental rule of secure coding:


    > CAUTION

    Untrusted data can be any part of the HTTP request! Do not trust any aspect of
    an HTTP or HTTPS request! Attackers can and modify any aspect of the request in
    order to exploit your web application.


    A useful plug-in for Firefox, IE, and Chrome is FoxyProxy. It allows you to set
    up multiple proxies and route requests through different proxies based on the
    URL. This is helpful so that you are using only your intercepting proxy for the
    site you actually want to test, and not proxying all of your web traffic.'
  merge: -1
