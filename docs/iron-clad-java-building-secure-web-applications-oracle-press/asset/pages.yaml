  md: '# Team Roles for Security


    Building secure software, especially complex software for a large organization,
    is a team sport. Many individuals need to collaborate effectively (often under
    great duress) in order to efficiently and accurately produce secure software.
    The main roles to consider are discussed in the sections that follow.


    # Role: Security and Software Architect


    One of the most difficult roles in a software team is the role of the security
    and software architect. Not only does this individual need to be incredibly astute
    in his her understanding of the complications of building software, but he she
    also needs to be up-to-speed on software threats as well as critical defense patterns.
    This individual also needs to be able to communicate effectively with “the business”
    to ensure that proper business requirements can be translated into a working piece
    of software. The knowledge that this role needs is so significant, most large
    companies have architecture “cils” or some other mechanism where more than one
    person serves this role. Hit any job bank with a search for “software architect”
    and you will see requirements that include:


    +   - Deep mastery of modern web technologies before they are invented


    +   - Active engineer with experience building highly scalable web, service, and
    mobile applications that have zero bugs


    +   - Ability to build, communicate, and measure complex architectural designs
    while everyone else on your team has different ideas and throws stones at your
    ideas


    +   - Team leadership qualities that support a software engineering culture that
    will find and retain skilled talent, even when you really can’t pay anyone anything
    close to the value of their skill set


    +   - A passion for creating, building, and deploying extremely complex software
    even when management throws unrealistic and arbitrary deadlines at you


    +   - Actively coding 20–40 hours a week while still doing other aspects of your
    job that are more visible to upper management'
