    # App Layer Intrusion Detection


    This section reviews a variety of techniques that will give you visibility into
    your applications when under attack. We will also discuss techniques to block
    scanners and “dumb” automated attacks to help you separate the security event
    from the chaff.


    # Monitoring and Intrusion Detection


    If someone is attempting to conduct offensive operations against your web application,
    you want to know as soon as possible. Monitoring logs for anomalous events can
    often help detect hacker activity as it happens. For his presentation, entitled
    “Attack-Driven Defense.”" Zane Lackey analyzed real-world traffic to discover
    techniques to detect anomalous events and warn of attacks in progress. For example,
    using the Gmail Admin Audit API, Zane suggested logging and monitoring all changes
    to multi-factor settings for any user, creation of new admin accounts, promotion
    of any account privileges to admin, creation of mail forwarding filters, and more.
    Many


    > ©www.slideshare.net/zanelacky/attackdriven-defense'
