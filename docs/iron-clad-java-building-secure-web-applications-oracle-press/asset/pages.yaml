  md: "# Chapter 9: Logging, Error Handling, and Intrusion Detection 241\n\nNote that\
    \ the application already had an authorization check in place. In addition, the\
    \ code was modified to alert AppSensor of the user performing the event and the\
    \ event type. The following example configuration uses AppSensor built-in response\
    \ actions in order to respond to the event:\n\n```\n<detection-point>\n  <id>BRUTE_FORCE_ACCOUNT</id>\n\
    \  <threshold>\n    <count>3</count>\n    <interval unit=\"minutes\">5</interval>\n\
    \  </threshold>\n  <responses>\n    <response>\n      <action>log</action>\n \
    \   </response>\n    <response>\n      <action>disableUser</action>\n    </response>\n\
    \    <response>\n      <action>disableComponentForSpecificUser</action>\n    \
    \  <interval unit=\"minutes\">10</interval>\n    </response>\n  </responses>\n\
    </detection-point>\n```\n\nIn this policy, if the user attempts three events of\
    \ this type (the <count> element) in a five-minute span (<interval>), the first\
    \ <response> will be taken and additional logging will be performed. If the user\
    \ attempts six events (multiples of 3), the account will be disabled. If the user\
    \ attempts nine in five minutes, the user's access to that component will be disabled\
    \ for ten minutes. The policy is entirely configurable and custom response actions\
    \ can be used.\nThe AppSensor framework allows your application to benefit from\
    \ generic attack detection and response, meaning you don't have to build it. The\
    \ framework is highly extensible and can be tailored to suit your application's\
    \ and organization's needs. In addition to the detection and response features\
    \ of the framework, there is also a reporting component that allows you to visualize\
    \ the data, as well as APIs allowing you to access the data and visualize it however\
    \ you like."
