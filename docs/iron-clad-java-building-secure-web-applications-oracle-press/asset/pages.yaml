  md: '# 102 Iron-Clad Java: Building Secure Web Applications


    # HTML Validation and Sanitization


    In some situations, you want to allow your users to submit some limited HTML to
    your website. For example, consider blog posts with bold or underlined lines,
    developer forums that use the <pre> tag to indicate a code sample, or a personal
    profile that a user can customize with images and links. In these cases, output
    encoding will not work because the HTML tags you want to allow will be converted
    to &gt; and &lt; and the browser will interpret them as content rather than markup.
    In these cases, the only solution is to sanitize the HTML so that only a limited
    subset of HTML is allowed, but scripts and dangerous attributes such as mouseOver
    are eliminated.


    OWASP HTML Sanitizer

    The OWASP Java HTML Sanitizer Project is a fast and easy-to-configure HTML Sanitizer
    that lets you include HTML authored by third parties in your web application while
    protecting against XSS. This code was written with security best practices in
    mind, has an extensive test suite, and has undergone adversarial security review.
    To use the OWASP HTML Sanitizer, first instantiate a policy, and then use that
    policy to sanitize the input HTML:


    ```

    // use one of the pre-configured policies

    PolicyFactory policy =

    Sanitizers.FORMATTING.and(Sanitizers.LINKS);

    safeHTML = policy.sanitize(untrustedHTML);

    ```


    It is also possible to configure your own policies to allow only a very restrictive
    subset of HTML tags and attributes:


    ```

    // configure a policy to allow only HTML links, with only

    // the href attribute, and https URLs, and include the

    // /rel="nofollow" annotation

    PolicyFactory policy = new HtmlPolicyBuilder()

    .allowElements("a")

    .allowUrlProtocols("https")

    .allowAttributes("href").onElements("a")

    .requireRelNofollowOnLinks()

    .build();

    safeHTML = policy.sanitize(untrustedHTML);

    ```


    > 7 https://www.owasp.org/index.php/OWASP_java_HTML_Sanitizer_Project'
