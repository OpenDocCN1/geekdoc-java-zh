    # Input Validation


    We covered input validation in depth in Chapter 1, but it''s important to discuss
    it in the context of XSS defense. Good input validation should be the first line
    of defense for every web application. However, input validation is not sufficient
    to stop all XSS without using context-specific output encoding. For example, if
    your application strips all <script> tags, an attacker can submit <scr<script>ipt>
    to get around the first round of sanitization.


    Blacklist-based input validation never works to stop XSS. If you blacklist the
    string <script>, an attacker will try to submit an image tag with the same payload:


    ```

