    # Attack 3: Quota Overload DoS


    When allowing users to upload files, setting a per-user upload quota is necessary
    to ensure proper management of your storage. If no limit is imposed, a malicious
    user could upload many terabytes of files and consume all storage on your device,
    resulting in a denial of service. There are several things to consider when building
    a quota policy. First, set a maximum total storage quota for each user. Second,
    limit the size of any single file to prevent an attacker from abusing file verification
    mechanisms by passing in files that will consume an inordinate amount of RAM or
    processor cycles to validate. Finally, limit the total number of files a user
    can upload to avoid slowing down the filesystem on your server (and how many database
    rows they can create).


    The Apache Commons FileUpload library has a built-in mechanism for limiting the
    size of uploaded files, but by default it does not set a limit. We highly recommend
    that you configure a limit any time you do file upload operation:


    ```

    // Create a factory for disk-based file items

    DiskFileFactory factory = new DiskFileFactory();


    // Set the maximum memory that will be used prior to

    // writing an uploaded file to disk

    factory.setSizeThreshold(yourMaxMemorySize);


    // Create a new file upload handler

    ServletFileUpload upload = new ServletFileUpload(factory);


    // Set overall file size constraint

    upload.setFileSizeMax(yourMaxFileSize);


    // Set overall request size constraint

    upload.setSizeMax(yourMaxRequestSize);

    ```'
