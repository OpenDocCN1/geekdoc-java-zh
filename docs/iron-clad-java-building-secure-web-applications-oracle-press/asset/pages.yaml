  md: 'more effective because the script will execute with the same permissions as
    the logged-in user.


    +   1. Attacker submits malicious script to the server.

    2. Server stores the attack string in the database in some way.

    3. Victim views a page that contains the malicious script.

    4. Attacker-supplied code executes on the user''s browser.


    Stored cross-site scripting is the perfect example of why input validation alone
    is not a sufficient defense. The content may be fully scrubbed by the server before
    it is submitted and stored, or by an insider such as a disgruntled DBA, or an
    outsider that manages to gain access to the database by other means, may be able
    to tamper with the stored data.


    Stored cross-site scripting is much more dangerous than reflected. Stored XSS
    does not require the victim to take any attacker-initiated action other than use
    of your website. A user may be merely browsing the affected website in a normal
    fashion and stumble upon the stored script, which executes the malicious XSS payload.
    Even so, stored cross-site scripting does give website administrators an opportunity
    to perform some forensic analysis on the attack, and possibly determine when it
    was executed and by whom. The data is stored in the database and hopefully includes
    other metadata such as a timestamp, IP address, and the ID of the user who created
    the content. In a reflected XSS attack, the only record of the attack might be
    in a server access log, where the victim clicks on the malicious link sent by
    the attacker. In this case, the attack would appear to come from the victim, and
    there is no trace of the actual attacker.


    # DOM-Based XSS


    DOM-based XSS is best understood by how it must be treated from a defense point
    of view. While reflected and stored XSS must be defended via encoding when building
    UI code server-side, DOM XSS is almost exclusively managed by adding defenses
    into custom JavaScript code, or by simply using safe JavaScript APIs in custom
    JavaScript code.'
