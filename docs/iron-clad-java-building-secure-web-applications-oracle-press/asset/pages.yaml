  md: '# Chapter 9: Logging, Error Handling, and Intrusion Detection 225


    You also need to be careful about the types of information you do not want to
    log. As part of debugging an application, developers frequently log sensitive
    data, a practice that allows (at least) insiders to steal large amounts of sensitive
    data with just the theft of a few text files. A good data protection strategy
    must also take care not to output any sensitive data to log files, comments, and
    error messages. Any one of these code artifacts could expose critical data to
    an attacker.


    We have worked with frameworks that included convenience methods for developers
    to log entire requests during debugging. But consider what can happen when these
    methods are not removed before deploying to productions? Sensitive information
    such as passwords, credit card numbers, Social Security numbers, and so may not
    be sent directly to log files, in plain text, circumventing all of the encryption
    and sensitive data handling protection you worked hard to employ.


    On September 18, 2012, Radu Dragusin discovered a log file on a public FTP server
    that contained the usernames of over 100,000 IEEE online users. This public log
    file contained password information of IEEE online users from Google, Apple, Microsoft,
    Oracle, IBM, major universities, and similar companies. Analysis of the data can
    be found at www.ieeeelog.com.


    > **TIP**nDon''t forget to remove your HTML code comments before you live. This
    very often leaks sensitive information such as developer contact information,
    system passwords, and other sensitive technical information.


    # Logging Frameworks for Security


    The Java ecosystem has a plethora of logging frameworks to choose from. There
    is the core Java logging API, the Apache Commons Logging component,¹ the Apache
    log4j project², and the Simple Logging Facade for Java (SLF4J)³ Unfortunately,
    few of these projects provide an API that lets a developer flag a log entry as
    a security log entry out-of-the-box.


    ¹http://commons.apache.org/proper/commons-logging/


    ²http://logging.apache.org/log4j/2.x/


    ³www.slf4j.org/'
