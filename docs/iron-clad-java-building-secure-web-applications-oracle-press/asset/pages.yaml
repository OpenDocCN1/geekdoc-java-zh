  md: '# Iron-Clad Java: Building Secure Web Applications


    > > TIP

    > Chances are that if you have an issue with one application, you may have the
    same problem with others in your company. The first thing your adversaries will
    try is the same exploit on another application. At the organization level, you
    need to ensure that you have the right security controls in place, make sure that
    project managers understand that fixing the issue is a priority, and make sure
    that your developers have the appropriate training and resources to fix this issue
    throughout the organization.


    # Web Application Firewall (WAF)


    WAFs are for wimps. —Jim Routh


    Web application firewalls (WAFs) are essentially “layer seven” (the application
    layer) firewalls that inspect HTTP traffic and attempt to block attacks based
    on clearly defined rules.


    WAFs have a very controversial history. Operations folks love application firewalls
    because they give them the power to seemingly “secure” applications without depending
    on software developers to actually fix their code. However, attackers are also
    fond of applications that depend overmuch on “default configured” web application
    firewalls because they are often easy to circumvent. WAFs can be detected using
    tools such as waf00f by Sandro Gauci.¹¹⁷ Once detected, an attacker can employ
    a variety of WAF evasion techniques. During an audit twenty years ago, I was attempting
    to break through a WAF that was blocking my SQL injection attack, “1 or 1=1”.
    I only had to replace that with “1 or 2+1=1” to evade this rather simple firewall
    rule.


    The essence of the quote from Jim Routh at the start of this section is essential.
    If WAFs are the only defensive layer protecting your software, then you are not
    only a “wimp,” you are also likely already compromised. Another way of expressing
    this idea is that you should emphasize fixing your code whenever possible, rather
    than attempting to firewall those vulnerabilities away.


    ¹⁷ https://code.google.com/p/waffit/source/browse/trunk/waf00f.py'
