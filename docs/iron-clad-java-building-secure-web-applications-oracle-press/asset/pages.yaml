  md: '# Chapter 2: Authentication and Session Management 53


    OAuth is a protocol that allows users of your web application to authenticate
    against other services without exposing any credentials to the application itself.
    For example, consider a web application that “tweets” on behalf of its users.
    OAuth allows your web application to authenticate users directly on Twitter. Subsequently,
    your application is authenticated to the service and can perform any actions that
    the user authorized (such as tweet, read tweets, and so on). In this way, your
    application can now employ user accounts on another site, without requiring to
    store any credentials or sensitive information at all.


    # Other Authentication Security Considerations

    Here are a few additional steps to consider when building your authentication
    layer.


    +   1. Attacks on SSL/TLS often target cookie values and therefore session identifiers.
    Consider frequent rotation of session identifiers when building custom session
    handling mechanisms or after re-authentication. The less time a particular session
    is valid, the less time an attacker has to make use of it.


    +   2. Provide your users with a prominent way to view their most recent logins
    with login time, logout time, IP address, and hopefully location. If users can
    see this information, they can help you spot a breach.


    +   3. Notify your users via email when a password is changed, when multiple login
    failures occur, when their user profile or permissions change, or when other major
    changes occur to their authentication workflows.


    +   4. In the user’s profile, show all active sessions or federated relationships
    with other services and provide a way to shut down certain sessions or relationships,
    especially if you support OAuth, “remember me,” or any long-lived authentication
    sessions.


    +   5. Provide a capability to block logins from certain geographic regions.


    +   6. Provide a capability to block logins during certain times.


    +   7. Build a well-vetted centralized authentication service and/or library that
    many projects can leverage securely.'
