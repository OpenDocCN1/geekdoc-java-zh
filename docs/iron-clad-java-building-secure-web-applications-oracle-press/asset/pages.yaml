    # Input Validation


    Adversaries often gain a foothold into software applications by sending cleverly
    constructed inputs to negatively influence a program’s behaviors. Input that is
    inconsistent with expected functionality and design will often cause the application
    to act in unexpected ways. Garbage, in pure exploitation gold. This section discusses
    one of the most fundamental secure coding techniques: input validation. Input
    validation is one of the "first lines of defense" when in any web application.


    Adversaries hack your web applications by adding attack strings to legal input
    fields, cookies, and other parts of the HTTP request. Very often this is done
    via modifications that still leave the HTTP request as a legal request: The HTTP
    protocol itself is not made invalid by these attacks. Input validation is a programming
    technique that limits what a web application will legally accept. Proper input
    validation defines what data is allowed and'
