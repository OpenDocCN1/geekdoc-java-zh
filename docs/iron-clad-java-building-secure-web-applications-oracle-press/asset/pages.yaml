  md: '# Chapter 6: Protecting Sensitive Data 143


    TLS uses different algorithms at various stages of creating and managing a secure
    socket. These combinations of algorithms are referred to as cipher suites and
    they are legion. Here''s a sample:


    ```

    TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384

    TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384

    TLS_RSA_WITH_AES_256_CBC_SHA256

    TLS_ECDH_ECDSA_WITH_AES_256_CBC_SHA384

    TLS_ECDH_RSA_WITH_AES_256_CBC_SHA384

    TLS_DHE_RSA_WITH_AES_256_CBC_SHA256

    TLS_DHE_DSS_WITH_AES_256_CBC_SHA256

    TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA

    TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA

    TLS_RSA_WITH_AES_256_CBC_SHA

    TLS_ECDH_ECDSA_WITH_AES_256_CBC_SHA

    TLS_ECDH_RSA_WITH_AES_256_CBC_SHA

    TLS_DHE_RSA_WITH_AES_256_CBC_SHA

    TLS_DHE_DSS_WITH_AES_256_CBC_SHA256

    TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA

    ```


    The first part identifies these as TLS, as opposed to SSL, cipher suites. This
    is followed by the key exchange and authentication algorithms. On the other side
    of the "WITH" is the specification for the bulk encryption cipher, its key size
    and mode, and the message authentication algorithm. This pattern can vary, but
    it''s enough to give you an idea of how to read the cipher suite names. It''s
    not easy to give a quick recommendation as to what you should use. The JSSE defaults
    are good, so if you must customize your cipher suites, remember that the world
    of cryptography changes quickly, and you''ll need to stay abreast of new attacks
    and algorithms and appropriately adjust your supported suites. General rules are:


    +   - Don''t use suites that list ANON for authentication. They don''t provide
    authentication.

    - Don''t use suites that contain NULL.

    - Avoid use of suites that contain EXPORT.


    > 4In this book we talk about SSL and TLS in Java, but for an excellent deep dive
    into the protocols and their usage and configuration (such as the list presented
    here), check out https://www.ssslabs.com by Ivan Ristic.'
