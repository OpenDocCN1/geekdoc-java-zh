  md: '# 106 Iron-Clad: Building Secure Web Applications


    NOTE

    You never want to think of security in a vacuum.

    You must make these design decisions considering functionality, performance, and
    security as well as many other factors. One of the failures of many security professionals
    is that they prioritize security without considering other factors such as business
    goals or usability. By the same token, we are writing this book many developers
    do not understand how to secure the application they build.


    ![](img/dcaa0b2cb71117317d964da03e19ebbf_125_0.png)


    The simple technique of embedding JSON data within the HTML page delivered from
    the server, and then to have JavaScript on the client side parse the data, provides
    multiple performance and design benefits.¹⁰ This method enables you to cache a
    large amount of the display logic on the client, and it offloads a lot of the
    rendering workload to the millions of client browsers hitting a site, rather than
    on the heavily trafficked server.


    First, embed the actual JSON data safely in a type="application/json" script tag
    with HTML entity encoding. This step "stores" the untrusted potentially dangerous
    JSON in a safe way.


    ```

    <script id="init_data" type="application/json">

    <%- html_escape(data.to_json) %>

    </script>

    ```


    In the next step, extract the encoded JSON from the script, decode it, and safely
    parse it into a JavaScript object.


    ```

    //get the JSON from the HTML page

    var dataElement = document.getElementById(''init_data'');

    // unescape and parse the JSON

    var jsonText = dataElement.textContent || dataElement.innerText

    var initData = JSON.parse(unescape(jsonText));

    ```


    This pattern provides the separation of structure and data, offloads the processing
    of client HTML assembly to the browser, and stores and parses JSON safely!


    > ¹⁰ https://www.owasp.org/index.php/XSS_%28Cross_Site_Scripting%29_Prevention_Cheat_Sheet#HTML_entity_encoding.
    Thank you to Neil Matatall for this contribution.'
