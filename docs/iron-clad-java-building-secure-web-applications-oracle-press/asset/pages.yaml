    # Login Workflow Step 7: Idle Timeout


    Because a user''s session ID is a highly sensitive piece of data that can be used
    to compromise a victim''s account if stolen, you want to ensure that the "life"
    of the session ID is limited as much as possible. If the user is inactive for
    a certain amount of time, you should invalidate session on the server and force
    the user to log in again with the user''s next request.


    Java EE has a default session timeout mechanism supported by most Java frameworks.
    In web.xml, the simple directive will force sessions of inactive users to invalidate
    server-side once users are inactive for 20 minutes.


    ```

    <session-config>

    <session-timeout>20</session-timeout>

    </session-config>

    ```


    Many modern AJAX-centric web applications, however, contain pages with auto-refreshing
    mechanisms. These pages may auto-update every few seconds, meaning that the server
    will never see the user as "idle," and thus sessions could continue indefinitely.
    If possible, consider stopping the auto-refresh mechanism via JavaScript when
    the application is not the currently active browser tab. You should also be able
    to detect via JavaScript on the client when the user is inactive for a certain
    amount of time, even when the auto-refresh is active. Once this client-side timeout
    is reached, the JavaScript should execute a GET request to a page on the server
    that will invalidate the session and return the user to the login screen. Note
    that you still want to support server-side idle timeout, but this type of client-side
    idle timeout can significantly improve a site''s security posture, especially
    for users who leave their browsers for long periods of time.


