  md: '# About the Authors


    Jim Manico (Hawaii) is an author and educator of developer security awareness
    trainings. He is a frequent speaker on secure software practices and is a member
    of the JavaOne Rock Star Wall of Fame. Jim is also a Global Board Member for the
    OWASP Foundation, where he helps drive the strategic vision for the organization.
    He manages and participates in several OWASP projects, including the OWASP Cheat
    Sheet series and several secure coding projects. For more information, see www.linkedin.com/in/jmanico.


    August Detlefsen (California) is a Senior Application Security Consultant with
    more than eighteen years'' experience in software development, enterprise application
    architecture, and information security. August works with major clients in financial
    services, health care, mobile, eCommerce, and technology to help secure web properties
    from potential threats. His company''s consulting services include source code
    and infrastructure reviews, penetration testing, threat modeling, gap analysis,
    software security control architecture, and training. August is a graduate of
    Dartmouth College and an active member of OWASP. He has contributed to several
    OWASP projects, which provide web developers with APIs for building robust applications.
    August enjoys developing tools to assist penetration testers, including Burp Suite
    extensions to test specific frameworks such as Amazon Web Services and Google
    Toolkit. He manages the site http://canouxssthis.com to test and compare various
    anti-XSS technologies. August also developed the CodeMagi Jackacking Defense,
    which is the current gold standard for jackacking prevention.


    # About the Technical Editor


    Milton Smith (California) leads the strategic security program for Java platform
    products as Senior Principal Security PM at Oracle. Milton is responsible for
    defining the security vision for Java and managing working relationships with
    security organizations, researchers, and the industry at large. Prior to Oracle,
    Milton led security for Yahoo''s User Data Analytics (UDA) property. For more
    information, see https://www.linkedin.com/in/spoofzu or www.securitycurmudgeon.com.'
