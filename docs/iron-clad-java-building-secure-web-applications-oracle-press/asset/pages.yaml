  md: '# 52 Iron-lad Java: Building Secure Web Applications


    Imagine that your website gains significant popularity. For example, you may have
    built a website that offers a new and clever way for people to buy specialized
    lamps and other lighting products. Now suppose website reaches popularity of epic
    proportions. Now suppose a major company wants your website to give many thousands
    of their employees specialized access in order to purchase co-branded lamps for
    promotional purposes. This access may include very proprietary information (who
    are you selling lamps to?) that only company members should access.


    Normally, your business partner would need to create and manage the accounts and
    passwords for these thousands of employees on your website. Every time a new employee
    is hired a new account would need to be created on your website. Every time an
    employee leaves the company account would need to be removed. For a company with
    thousands of employees this quickly becomes an administrative nightmare.


    What if instead of your partner having to create and manage thousands of user
    accounts on your website, they could manage those accounts on their own systems?
    Suppose you had an arrangement with your partner (leveraging Single Sign On Technology)
    that a user only needed to log in to your partner''s authentication provider and,
    based on a prearranged "handshake," that user would automatically be authenticated
    to your awesome new lamp website because of your partner''s assertion that the
    user is legitimate? This is the heart of SAML and identity federation provide.


    Unfortunately, SAML is neither simple nor true standard. Each website or service
    you wish to integrate will have subtle differences in how it needs to be implemented.
    Good partners will provide detailed requirements regarding how their SAML service
    works. This is an important technology that you will be confronted with in a variety
    of federation and Single Sign On services.


    # OAuth Basics


    Open Authorization (OAuth) is a protocol that allows your web application to authenticate
    against other services on behalf of your users. This protocol allows your web
    application to authenticate to the OAuth service on behalf of your users without
    requiring to store any credentials. If necessary, your web application can authenticate
    to another service without your users even being logged in to your application.
    For example, if you would like your website to "tweet" on behalf of your users,
    without ever needing to know (and your users'') passwords or other sensitive information,
    OAuth is the protocol to accomplish this feat.'
