  md: "# 238 Iron-Clad Java: Building Secure Web Applications\n\nThe point of form\
    \ polymorphism is to randomize the names of the input parameters with each request\
    \ in order to trip up automated scanners. Each time a polymorphic login form is\
    \ requested, the server will reply with random names for the form fields:\n\n\
    ```\n<form action=\"/loginServlet\">\n  <input id=\"anZrr3K6GO\" name=\"mLvQnupJJ\"\
    >\n  <input id=\"YQQgG8bPfn\" name=\"4amna9LJhb\">\n  <input type=\"submit\">\n\
    </form>\n```\n\nThis will stop repeated attempts against the same parameter name\
    \ set. Of course, automated attack scripts can be modified to circumvent this\
    \ defense by first requesting a copy of the login form and then parsing the randomized\
    \ parameter names before each login attempt. However, even a polymorphism aware\
    \ attack script will be drastically slowed by the requirement to reload the page\
    \ each time. Most forms of attack automation will not be able to circumvent this\
    \ defense unless specialized code is written to understand this form of real-time\
    \ polymorphism.\n\n# Honey Token Form Component\n\nAnother technique that may\
    \ help stave off automated attacks is to use a honeytoken. The goal is to trick\
    \ scripts into filling form fields that normal humans would not be able to see\
    \ or populate in any way. In your server-side code, you should always leave an\
    \ empty string or nothing at all for this component, depending on how you build\
    \ this lure. This is similar to the goal of a CAPTCHA that the annoying usability\
    \ that users must endure when faced with CAPTCHAs.\n\nFor example, you could add\
    \ an additional form component, such as a text field, to your sensitive forms\
    \ and hide it with CSS by positioning the component off-page. The goal is to make\
    \ this component invisible to users, but still make it \"fillable\" by bots who\
    \ scrape the HTML from your page and auto-fill all form fields with spam and similar.\
    \ Automated registration bots will attempt to fill these \"invisible\" form fields\
    \ because they are often not aware of CSS, or at least cannot recognize when styles\
    \ hide a form component. Server-side, when processing submissions, if this hidden\
    \ parameter has a non-null value, you know it is a bot and you can safely safely\
    \ (and quietly) reject that registration submission."
