    # Virus and Malware Detection


    One of the more challenging aspects of a file upload mechanism is ensuring that
    the contents of the file are not malicious. Simple antivirus checking on an uploaded
    file is a good first step.


    There is no single perfect antivirus or anti-malware solution, and various antivirus
    products are better at finding certain classes of malware than others. It is prudent
    to use multiple products when verifying if an uploaded file is malicious. This
    is especially true if you are serving user-uploaded files to other users. You
    would not want to be malware to your whole user base because of one bad user!


    We recommend that when files are uploaded, they are immediately placed into a
    quarantine directory where they are checked for malware. Once the antivirus check
    succeeds, only then should you make the file available for your other users to
    download.'
