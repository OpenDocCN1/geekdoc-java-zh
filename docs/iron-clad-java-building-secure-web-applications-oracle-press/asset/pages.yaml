    # # ABAC Attribute-Based Access Control


    ABAC, or attribute-based access control, is a formal, highly flexible access control
    framework that allows access control decisions to be based on attributes of users
    (subjects), objects, environmental conditions, and access control rules.


    The most widespread use of ABAC is the eXtensible Access Control Markup Language
    (XACML). XACML can handle modeling of not only ABAC design, but also RBAC, which
    is essentially just a subset of ABAC anyhow.


    Gunnar Peterson states, "It seems to me that the value of XACML and ABAC is really
    in the use cases that they enable. Its outward focused, and unlocks value through
    new kinds of service."


    Following are the discrete steps in ABAC access control processing:


    +   1. The Policy Enforcement Point (PEP) receives an access request from some
    user (subject).

    2. The PEP ensures that the user is authenticated.

    3. The PEP constructs the XACML request, including the action requested, the object
    user is operating on, and the environmental values if applicable.

    4. The PEP sends the request to the Policy Decision Point (PDP).

    5. The PDP receives the request and necessary information, looks up the appropriate
    access control rules, and makes the access control decision.

    6. Depending on the access control result, the PDP service constructs a XACML
    context response and returns it to the PEP with status, and obligations if any.

    7. The PEP takes actions according to the response.


    > ^7 http://raindrop.typepad.com/1_raindrop/2013/06/security-140-conversation-with-gerry-gebel-on-xacml-and-abac.html'
