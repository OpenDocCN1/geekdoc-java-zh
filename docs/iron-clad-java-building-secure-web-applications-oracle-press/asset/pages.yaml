    \ type=\"hidden\" name=\"role\" value=\"user\">\n  <input type=\"hidden\" name=\"\
    userid\" value=\"132\">\n  <input type=\"text\" name=\"title\" value=\"My Comment\
    \ Title\">\n  <input type=\"text\" name=\"body\" value=\"My Snarky Comment\">\n\
    \  <input type=\"submit\" name=\"submit\" value=\"Submit Comments\">\n</form>\n\
    ```\n\nIn this case, changing the role parameter to admin will defeat the application's\
