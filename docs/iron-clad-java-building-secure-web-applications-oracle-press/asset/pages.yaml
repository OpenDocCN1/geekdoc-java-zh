  md: '# 222 Iron-Clad Java: Building Secure Web Applications


    What rolls down stairs alone or in pairs, and over your neighbor’s dog?

    What''s great for a snack, and fits on your back? It''s log, log, LOG!

    It''s log, it''s log, it''s big, it''s heavy, it''s wood.

    It''s log, it''s log, it''s better than bad, it''s good.


    —The Ren and Stimpy


    # Logging Basics


    Logging is the heart of all accountability in software. We use logging to help
    test our application in development and we log in production so we can audit application
    runtime behavior. Logging is also critical for security forensics so we can understand
    what happened after the fact when bad things go down. The MITRE corporation manages
    the Common Weakness Enumeration (CWE), a community-developed dictionary of software
    weaknesses. The common software weakness listing for Insufficient Logging is CWE-778
    (http://cwe.mitre.org/data/definitions/778.html):


    When security-critical events are not logged properly, such as a failed login
    attempt, this can make malicious behavior more difficult to detect and may hinder
    forensic analysis after an attack succeeds.


    This is fairly clear. When a security breach occurs, one of the first things you
    will want to do is pull your logs and investigate what happened. The mission of
    logging in secure software is to make it as easy as possible for investigators
    to answer these questions:


    +   - What happened?

    - Who did it?

    - When did it happen?

    - How was our security circumvented?

    - What data was viewed or modified?

    - How can we prevent this from happening again?'
  merge: -1
