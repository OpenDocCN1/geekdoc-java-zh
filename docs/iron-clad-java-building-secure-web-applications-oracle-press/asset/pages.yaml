    # Login Workflow Step 3: Processing and Verifying Credentials


    At this point, we assume that your user is already registered as a user in your
    web application and has entry in your database or identity service, such as an
    LDAP server. At the very least, the subject''s username and password ciphertext
    should be stored in your identity persistence mechanism. Password storage is a
    complex topic, which we discuss shortly.


    In the previous step, the user submitted their username and credentials over a
    login form via HTTPS. The username is first looked up in the database to ensure
    it. If it doesn''t, you give the user a generic failure message such as "username/password
    combination invalid." You next hash the submitted password using the same algorithm
    and salt you initially chose to store the password.^5 If the user''s password
    ciphertext matches the ciphertext that is stored in your database (hopefully the
    multi-factor value they entered is also valid), then the user has logged in successfully
    and you can start their session.


    ^4 https://www.ssllabs.com/ssltest/


    ^5 In very secure environments, you should always run the password protection
    algorithm against the submitted password, even if the user is not valid. This
    will help prevent username harvesting by measuring the time difference in responses
    between entering a correct username, which protects the password, and an incorrect
    one, which doesn''t. This extra time spent will also slow down automated attacks.'
