    # Identity and Access Control


    Before we go any further, let''s clarify some terms. Authorization and authentication
    are two separate but related parts of your security paradigm. Authentication is
    the process of verifying a user''s identity. Authorization, or access control,
    is the process of determining what resources an authenticated user is able to
    access. For access control to function properly, you must first have a securely
    authenticated user, as shown in Figure 3-1. For more information about authentication,
    see Chapter 2.


    An important first step is to define the core elements of what makes up an access
    control mechanism. Access control is the security layer in software that limits
    users to accessing only authorized functionality and data. Let''s break down this
    definition. Access control is.


    +   - ...a layer of defense: Access control is a core control in all software.

    - ...that limits: By default users get no access.

    - ...users: Users must already be authenticated.

    - ...to accessing only authorized functionality and data: Users are defined by
    roles or are given a list of entitlements or capabilities that allow them to access
    certain data or functionality.


