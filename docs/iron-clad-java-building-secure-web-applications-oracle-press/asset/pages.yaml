  md: '# Chapter 6: Protecting Sensitive Data 159


    # # Securing Data at Rest


    We turn now to protecting stored data from the threats discussed earlier. Recall
    that your security mechanism for data at rest needs to be reversible. That is,
    you need the capability to wrap the data in protection when you store it, and
    you need the ability to reverse or unwrap the protection later so that you can
    use the data. Encryption is the tool of choice for this job.


    Unfortunately, we don''t have a widely accepted standard, such as TLS, that defines
    how to use specific algorithms for encrypting data at rest, so developers must
    implement encryption on their own. However, a secure encryption system is very
    complex and fraught with myriad design options that can fatally damage a secure
    system if the wrong options are selected. The history of SSL/TLS is a great example:
    Many people with deep expertise in cryptography designed these protocols and still
    weaknesses crept in requiring many protocol upgrades over the years.


    On the positive side, several vendors and open-source projects are beginning to
    implement systems to make encryption easier and less prone to mistakes. In this
    section, we focus on Keyczar, which was originally developed by the Google Security
    Team and is now an open-source project hosted at Google. Of course, we cover the
    Keyczar implementation in this book, but other implementations exist as well.
    Both Python and C++ versions are available from the Keyczar home page.


    Keyczar is a toolkit that allows you to easily encrypt and sign data, and—even
    more importantly—Keyczar provides basic key management functionality. The encryption
    and signing services are primarily accessed through a set of easy-to-use APIs.
    Key management functionality is provided through a command-line program called
    KeyczarTool. All of this is built on top of Java''s native cryptographic architecture.


    It is easy to underestimate the importance of KeyczarTool and the functions it
    provides. Key management is a critical component of a secure encryption system,
    but it is frequently overlooked by developers in the rush to get data encrypted.
    A common saying in cryptography is that cryptography turns the problem of protecting
    a lot of information—data—into the problem of protecting a little information:
    the keys. We''ll look more closely at the key management functionality later,
    but now it is important to


    > See http://keyczar.org and https://code.google.com/p/keyczar.'
