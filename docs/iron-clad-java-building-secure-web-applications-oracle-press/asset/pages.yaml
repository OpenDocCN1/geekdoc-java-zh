    first Java-based open source SAST tools is the famous FindBugs open source project
    by Bill Pugh. FindBugs integrates with most Java IDEs as well as several automated
    build systems, such as Jenkins. This is an excellent and inexpensive way to starting
    using static analysis in a regular and continuous way.


    When evaluating a commercial SAST tool to determine what is best for your company
    and application, consider the Static Analysis Technologies Evaluation Criteria
    from the Web Application Security Consortium.


    # DAST–Dynamic Application Security Testing


    Dynamic Application Security Testing (DAST) tools are essentially “scanners” that
    attempt a variety of attacks against a live running web application looking for
    vulnerabilities. These tools, like SAST tools, are automated scanners that often
    report a large number of false positives that need to be reviewed by a security
    professional. DAST tools are often called “black box testing” because they test
    from “outside in” without knowledge of the inner working of your software. This
    is often considered to be the “hacker’s perspective” when testing your application.


    One of the greatest ways to make a developer “not care about security” is to give
    him laden with security bugs, which after close inspection, are not really bugs
    at all (in other words false positives). While these tools can be tuned to report
    fewer false positives, doing so will also reduce the number of actual security
    findings. If you fire a scanner at your application “untuned,” the false positives
    are often high. If you tune the tool in the other direction, you may miss critical
    bugs. Not to mention that


