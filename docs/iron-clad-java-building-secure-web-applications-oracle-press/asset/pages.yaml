  md: '# Chapter 4: Cross-Site Scripting Defense 107


    But what about server-side JSON handling? One important Java library for handling
    JSON server-side in a secure fashion is the OWASP JSON Sanitizer Project.


    # OWASP JSON Sanitizer


    Given JSON-like content, the OWASP JSON Sanitizer converts it to valid JSON.


    This can be attached at either end of a data pipeline to help satisfy Postel''s
    principle: *Be conservative in what you do, be liberal in what you accept from
    others.*


    Applied to JSON-like content from others, it will produce well-formed JSON that
    should satisfy any parser you use. Applied to your output before you send, it
    will coerce mistakes in encoding and make it easier to embed your JSON in HTML
    and XML.


    This section was written by Mike Samuel and is used in this book verbatim with
    his permission. We would like to thank Mike Samuel for his many open source Java
    and JavaScript contributions to application security, including Caja, HTML/JSON
    Sanitizer, and more.


    Many applications have large amounts of content that uses ad hoc methods to generate
    JSON outputs. Frequently, these outputs pass through a small amount of framework
    code before being sent over the network. The ad hoc outputs are standards-compliant
    and safe to pass to (overly) powerful deserializers such as JavaScript''s `eval()`
    operator.


    Applications also often have service APIs that receive JSON from a variety of
    sources. When this JSON is created using ad hoc methods, this library can massage
    it into a form that is easy to parse. By hooking this library into the code that
    sends and receives requests and responses, this library can help software architects
    ensure system-security and well-formedness guarantees.


    The sanitizer takes JSON-like content and interprets it as JavaScript''s `eval()`.
    Specifically, it deals with these nonstandard constructs.


    +   ''...'' Single quoted strings are converted to JSON strings.


    +   \xAB Hex escapes are converted to JSON Unicode escapes.


    +   \012 Octal escapes are converted to JSON Unicode escapes.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 108 Iron-Clad Java: Building Secure Web Applications


    0xAB Hex integer literals are converted to JSON decimal numbers.


    012 Octal integer literals are converted to JSON decimal numbers.


    +5 Decimal numbers are coerced to JSON''s stricter format.


    [,,2] Elisions in arrays are filled with null.


    [1,2,3,] Trailing commas are removed.


    {foo":"bar"} Unquoted property names are quoted.


    //comments JavaScript script line and block comments are removed.


    (...) Grouping parentheses are removed.


    The sanitizer fixes missing punctuation, end quotes, and mismatched missing close
    brackets. If an input contains only whitespace, then the valid JSON string null
    is substituted.


    The output is well-formed JSON as defined by RFC 4627. The output satisfies four
    additional properties:


    +   * The output will not contain the substring (case-insensitive) </script so
    it can be embedded inside an HTML script element without further encoding.


    +   * The output will not contain the substring ]] > so it can be embedded inside
    an XML CDATA section without further encoding.


    +   * The output is a valid JavaScript expression, so it can be parsed by JavaScript''s
    eval built-in (after being wrapped in parentheses) or JSON.parse. Specifically,
    the output will not contain any string literals with embedded JavaScript newlines
    (U+2028 paragraph separator).


    +   * The output contains only valid Unicode scalar values (no isolated UTF-16
    surrogates) that are allowed in XML unescaped.


    Because the output is well-formed JSON, passing it to eval will have no side effects
    and no free variables, so it is neither a code-injection vector nor a vector for
    exfiltration of secrets.'
