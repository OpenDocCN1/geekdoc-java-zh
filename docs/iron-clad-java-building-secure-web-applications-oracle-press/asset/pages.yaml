    known as TLS, and the current version of TLS is 1.2. Despite the name change,
    most people continue to use SSL to refer to both SSL and TLS.


    > NOTE

    The HTTP Strict Transport Security (HSTS) standard is a well-supported HTTPS Header
    that will force a browser to always use HTTPS for a certain length of time! Simply
    deliver the following as an HTTP response header to ensure that supported browsers
    can only make HTTPS connections to your site for max-age number of seconds!


    ```

    Strict-Transport-Security: max-age=31536000 includesSubDomains

    ```


    The Chromium project will even allow you to preload HSTS headers so that users
    of Chrome, Aviator, and other Chromium-based projects automatically get the benefit
    of Strict Transport Security on the first hit to your site. Email agl@ chromium.org
    to get your site added to Chrome''s Strict Transport Security default list.


    The backbone of these protocols is provided by a public key infrastructure that
    allows you to trust servers that you''ve never worked with before. This is accomplished
    by a system of certificate authorities (CAs), such as Symantec/ VeriSign and Comodo,
    which sign cryptographic certificates that are placed on servers. When a TLS client
    connects to a server, the server sends the certificate to the client. If the client
    trusts the CA that signed the certificate, then the client may trust the server
    after verifying that the authority actually did the certificate. This verification
    step is made possible by the public key cryptography on which TLS is based. Once
    this trust is established, a secure communication channel is created.


    Certificate chains are used to provide better scalability and control of certificates.
    A certificate chain uses two types of certificate authorities: root CAs that trust
    and intermediate CAs that have certificates signed by the root CA. If the certificate
    that is used by a TLS server is signed by an


