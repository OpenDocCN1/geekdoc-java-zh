    # Contextual Access Control


    The web applications that we as developers are being tasked to build are only
    getting more complex over time. With that increased complexity, better access
    control design is required. So when you look at a simple two-role-1990s web application
    in comparison to a modern multitant portal-based web application, the question
    of “What is access control?” changes significantly.


    In today''s complex applications, authorization decisions need access to multiple
    data sources. Authorization decisions need data from the environment (geolocation,
    time, and so on), they need additional information about the subject, they need
    information about the functionality the user wants to execute, they need information
    about the data the user is accessing or updating, and they need the actual policy
    rule or rules for the current request. There is actually a lot of context needed
    in order to make a complex access control decision in modern web software.


    # Permission-Based Access Control

    and Apache Shiro


    Permission-based access control is a term defined from the Apache Shiro project
    that addresses how programmers add access control checks (Policy Enforcement Points)
    in application code. “Permission” is admittedly an overloaded term and can stand
    for many things. In this context “permission” means what the Policy Enforcement
    Point looks like in code.


    Permission-based access control involves defining action-based access control
    checks (as opposed to checks that verify policy, like a role check). When this
    pattern is used in your application, you no longer have to modify code when your
    access control policy changes, regardless of how the back-end access control check
    is implemented!


    When your Policy Enforcement Points are permission-based, the back-end access
    control decisions, the Policy Decision Points, can be implemented with RBAC, ABAC,
    or something different. Permission-based access control addresses only how enforcement
    points are coded in applications, which is a very important concept when it comes
    to managing the access control policy of a complex application.'
