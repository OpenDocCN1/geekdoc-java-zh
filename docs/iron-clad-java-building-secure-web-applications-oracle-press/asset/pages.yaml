  md: "# Chapter 9: Logging, Error Handling, and Intrusion Detection 237\n\ntickets\
    \ that are in high demand (such as your local Justin Bieber¹⁴ concert), or scripting\
    \ a purchase to make sure you are the first to win the right to purchase the next\
    \ woot! bag of crap.¹⁵ Let's discuss a few techniques to ensure that only real\
    \ humans are conducting sensitive operations against your web application!\n\n\
    Most of these anti-automation techniques are not perfect security. Although this\
    \ category of defenses does not include deep security controls, a few simple anti-automation\
    \ techniques will at least allow you to filter out some threats easily so you\
    \ can reduce the “noise” entering your application. This will hopefully free up\
    \ your operations or incident response team to better handle the savvy categories\
    \ of attacks.\n\n# CSRF Tokens Revisited\n\nThe most fundamental anti-automation\
    \ defense is Cross Site Request Forgery Tokens. We discussed this in detail in\
    \ Chapter 5, CSRF tokens not only stop the threat of forgeries, but also make\
    \ it difficult for attackers to conduct attacks against your application. Unless\
    \ an attack script can log in to your application and maintain session state with\
    \ each request, Cross Site Request Forgery tokens are enough to stop stateless\
    \ automation from making successful requests to your site.\n\n# Form Polymorphism\n\
    \nAnother form of anti-automation is a programming technique called polymorphism.\
    \ As discussed in Chapter 2, some brute-force scripts will often try to submit\
    \ hundreds or thousands of login requests in a very short time in an attempt to\
    \ compromise user accounts. These scripts are able to operate very quickly by\
    \ submitting the same request parameters over and over with different values.\
    \ For example, your login form likely has a username and password field¹⁶ and\
    \ looks similar to the following:\n\n```\n<form action=\"/loginServlet\">\n  <input\
    \ id=\"username\" name=\"username\">\n  <input id=\"password\" name=\"password\"\
    >\n  <input type=\"submit\">\n</form>\n```\n\n¹⁴www.forbes.com/sites/zackalleygreenburg/2012/06/04/justin-bieber-sells-out-all-u-s-tour-dates-in-an-hour/\n\
    \n¹⁵www.woot.com/offers/bag-of-crap\n\n¹⁶We hope it does not have a Remember Me\
    \ field, as discussed in Chapter 2."
