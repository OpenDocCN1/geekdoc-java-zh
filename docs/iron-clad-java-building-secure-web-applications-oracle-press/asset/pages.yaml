  md: '# Chapter 4: Cross-Site Scripting Defense 111


    Content Security Policy—Remove Inline Events

    It is critically important to avoid writing any inline JavaScript events in HTML
    and the use of the on(click|mouseover|etc) event attributes and the javascript
    : protocol in links. Inline JavaScript events are at the very least "bad design"
    and difficult to maintain. However, there are also tangible security benefits
    to this practice. When all of your JavaScript is properly externalized into separate
    JS files, your application becomes a candidate for Content Security Policy, an
    emerging Anti-XSS standard (and more). Content Security Policy is being developed
    by the W3C as a web standard.¹² Consider the project Headlines,¹³ a great J2EE
    filter for helping set the appropriate security headers, including CSP, for a
    web app.


    ¹²www.w3.org/TR/CSP11/

    ¹³https://github.com/sourceclear/headlines


    # XSS Defense Summary


    +   - Use input validation on all data, but be warned that some input validation
    will not secure input from XSS (such as HTML input or "conversation" input that
    contains full sentences, as in an article comment or social media or chat)

    - When building a user interface with JSP or similar UI technology, use contextual
    escaping to ensure any JavaScript is converted to safe display-only data.

    - Use a formal HTML sanitizer to validate untrusted HTML (such as TinyMCE)

    - Use secure JavaScript design. Only put data into safe JavaScript APIs and parse
    JSON safely with JSON.parse.

    - Consider technologies such as Content Security Policy.'
