  md: '# Chapter 6: Protecting Sensitive Data


    intermediate CA, then the server will provide both certificates to the client:

    the server certificate and the intermediate CA certificate.


    The client will then verify the chain. First it verifies that the server certificate

    is signed by the intermediate CA; then it verifies the intermediate CA''s

    certificate is signed by a root CA that the client trusts. If the chain is unbroken,

    then the client will trust the server. A chain can consist of certificates from

    several intermediate CAs. In that case, the server will provide the entire chain,

    and the client will need to verify the entire chain.


    The client maintains a list of root certificates from CAs that it trusts.

    Practically speaking, these root certificates are distributed with browsers,

    SDKs, and other applications. Java comes with a set of trusted certificates

    stored in the file $JAVA_HOME/lib/security/cacerts. We look at how to

    read that file later in the chapter.


    As you can see, TLS is a complicated protocol. The specification, defined

    in RFC 5246, is 104 pages long and refers to other RFCs. Most of the time

    y will not need to worry about the details of TLS. If you are writing code

    that runs behind a web server, then you will rely on the web server to handle

    all of the connection details. In that case, most of this section will be

    directly relevant. However, you will still need to configure the certificates

    used by the web server and that topic is covered by the "Certificate and Key

    Management" section.


    The same considerations apply if you are writing code that runs behind a

    web client that already handles the connection to a web server. You will need
    to

    configure the certificates but not worry about relying too much on your web server
    or

    client front end.


    However, be careful how many of these don''t provide the security

    checks that you expect.³ If you depend on a front end, test it with all sorts

    of misconfigured certificates to see how it responds. Let''s hope that your front
    end

    terminates the connection connection with bad certificates, but research

    has shown that many implementations can carry on anyway and are therefore

    vulnerable to a variety of attacks that TLS/SSL should prevent if used correctly.


    With that out of the way, let''s move on to TLS and SSL. Java makes it very

    ease to use these protocols. The Java Secure Sockets Extension (JSSE) consists

    of several packages that make dealing with SSL and TLS fairly straightforward.


    > ³ "The Most Dangerous Code in the World: Validating SSL Certificates in Non-Browser

    Software" (www.cs.utexas.edu/~shmat/shmat_ccs12.pdf) for a sobering analysis of
    how many

    systems have broken TLS/SSL implementations.'
