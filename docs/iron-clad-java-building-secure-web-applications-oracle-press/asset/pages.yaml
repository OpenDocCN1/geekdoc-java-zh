    )) {\ndeleteUser();\n} else {\n    // sound the alarm, only an attacker would\
    \ be here\n}\n```\n\n# Defending Against Automated Attacks\n\nSome of your attackers\
    \ are incredibly savvy and skilled threat agents with deep offensive security\
    \ skill and capability. Other \"attacks\" you may witness against your web application\
    \ are simply \"dumb robots\" or turnkey security scanners that someone decided\
    \ to aim at your application, \"point and shoot\" style, without configuration\
    \ or expertise. Bad robot!\n\nThe Web Application Security Consortium (WASC) considers\
    \ it a vulnerability when your web application is vulnerable to these turnkey,\
    \ automated attacks.¹³ Other forms of automated attacks are a bit more intelligent\
    \ and target public features such as brute-force attacks against your login or\
    \ registration page, attacks to automatically purchase entertainment\n\n> ¹³Insufficient\
    \ Anti-Automation\" (WASC Threat Threat Classification #21); http://projects.webappsec.org/page/13246938/insufficient%20Anti-automation"
