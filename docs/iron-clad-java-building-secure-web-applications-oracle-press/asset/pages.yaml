  md: '# Chapter 1: Web Application Security Basics 17


    rejects the rest. After passing validation, data can then be processed by your
    web application''s business logic layer. This is one of several important layers
    of defense needed in a secure web application.


    One of the primary technical artifacts that we use for input validation is a regular
    expression. Regular expressions consist of commands that contain sequences of
    metacharacters. These commands are used in string matching operations and are
