    Every Java developer develops on third-party libraries to build their application.
    But to what extent can we trust these libraries? Jeff Williams and Arshan Dabisrisiaghi
    from Aspect Security released a report, The Unfortunate Reality of Insecure Libraries,
    in March 2012,13 Their research analyzed over 113 million downloads of the 31
    most popular open source Java frameworks and libraries available from the central
    repository. The report concluded that:


    +   * typically use 30 or more libraries.

    * 88 percent of code in today''s applications comes from libraries and frameworks.

    * 26 percent had known vulnerabilities.

    * Most vulnerabilities are undiscovered.


    It''s amazing how much Java code we depend on "trusted" without any analysis!
    There is a prevailing view that open source code is better or more secure because
    more people are looking at it. We often assume that the "community" have already
    taken care of any issues, just by virtue of many people working on it, but this
    is not always the case. As we have already discussed, many developers are great
    at adding features, but lack training in secure development. Don''t allow any
