    # Brute Force Attacks, Account Lockout, and Multi-Factor Revisited


    Once an attacker knows a valid username, they can attempt a brute force attack.
    A brute force attack occurs when an attacker attempts many passwords in high volume
    against a victim''s account, attempting to discover their authentication credentials
    through trial and error. Old school force tools like Brutus make brute force attacks
    simple. As the name implies, this is not a savvy or intelligent attack.


    There are many ways to counter brute force attacks. The most common defense is
    account lockout. Account lockout is a defense by which, after an attacker attempts
    to incorrectly log in to an account certain number of times, the account will
    be disabled temporarily preventing anyone from logging in to the account. Account
    lockout schemes are often triggered after just a few failures. As you force your
    users to create more and more complex passwords, forgetting a password or entering
    it incorrectly will only be more'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Chapter 2: Authentication and Session Management 49


    common. Setting your account lockout to ten failures will trigger the defense
    against automated attacks quickly but will still provide users with significant
    leeway to enter their password correctly. If your account lockout triggered too
    quickly, your website would certainly be secure but with greatly hampered usability.
    The key words here are preventing anyone. Need to find a balance. If an attacker
    has knowledge of various usernames in your system, account lockout can be used
    to conduct a denial of service attack against your web application, effectively
    stopping any user from logging in to their account.


    Another form of account lockout is a reverse brute force attack occurs when an
    attacker attempts a commonly used password once against many different accounts
    in your system. The benefit of this attack is that it will not trigger account
    lockout against any one account. Disallowing commonly used passwords, even that
    fit your normal password policy, is a good mitigation to this attack.


    In general, we recommend keeping away from account lockout if your user has enabled,
    or if you force, multi-factor authentication, which we discuss shortly.


    # Remember Me Feature


    Software developers are often tasked with supporting the “remember me” login feature.
    This feature is essentially a wrecking ball to all that is good and just within
    an authentication layer. In order to support the “remember me” feature, you essentially
    need to keep the user logged in for days, weeks, or months, something that is
    in direct opposition to everything we have discussed about properly limiting an
    authenticated session. Also, “remember me” features are often subject to a replay
    attack. They often require that you store a credential or a session identifier
    in a cookie with no expiration. Even if credentials stored in a cookie are protected
    with the best crypto on the planet, an attacker who steals your cookies can replay
    that encrypted cookie in his own browser, use your server for decryption, and
    compromise the account. If the business forces you to support a “remember me”
    feature, consider just remembering the username and prefill it on the login screen.
    Avoid implementing remember me that stores the users’ credentials or forces you
    to maintain an authentication token or authenticated session that is active for
    a long period of time.'
