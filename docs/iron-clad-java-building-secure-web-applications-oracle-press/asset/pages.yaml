  md: '# Access Control Cheatsheet


    +   1. Avoid assigning permissions on a per-user basis. Group activities and users.

    2. Perform consistent authorization checking routines on all application pages.
    A J2EE filter is ideal for access control.

    3. Implement role-based access control for single-company, simple web applications.

    4. Consider creating your enforcement points with permission-based calls when
    access control design or data contextual access control design is needed.

    5. Consider attribute-based access control and XACML for the most complex and
    contextual access control needs.

    6. Log all failed access authorization requests to a secure location for review
    by administrators. This provides awesome intrusion detection, as we discuss in
    Chapter 9.


    # Summary


    In summary, role-based access control is an easy-to-understand access control
    pattern for simple, single-company web applications. Either permission-based access
    control (Apache Shiro) or Spring''s ACL mechanism seems a better choice for web
    applications that require tenancy or data-specific access control checks, but
    some customization will be needed for your application or environment. And finally,
    more advanced enterprise web applications that require access control policy based
    on environmental conditions, user data, object data, and other factors may require
    attribute-based access control, XACML, and the emerging tools in this space, but
    the complexity to build such access control is steep.'
