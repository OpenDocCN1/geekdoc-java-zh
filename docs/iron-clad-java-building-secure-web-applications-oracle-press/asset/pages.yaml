    However, SAST tools, like any tool, have limitations. SAST tools traditionally
    create a large number of false positives (they often report security bugs that
    are not truly exploitable) and have little visibility into business logic (business-specific)
    vulnerabilities. SAST tools also have a history of tracking a very long time to
    scan large code bases. Many emerging vendors are attempting to fix these issues,
