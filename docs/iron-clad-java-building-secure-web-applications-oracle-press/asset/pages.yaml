  md: '# 64 Iron-Clad Java: Building Secure Web Applications


    The critical design flaw here, as well as one of the most prominent features in
    many software frameworks, is the merging of access control policy and application
    code. This “hard coding” of access control policy leads to a variety of challenges.


    When you “hard code policy” in your application code like this, you need to push
    a new version of your software any time your access control policy changes. It
    also makes it very difficult to ensure that such a similar check has to be made.
    Maybe you changed the policy at the check that decides whether to display the
    “Delete Company” button, but did you also remember to change the policy on the
    actual action that deletes that from the database?


    This anti-pattern makes often essential tasks such as co-branding and customization
    nearly impossible, or at least expensive, as multiple branches or forks of your
    application need to be maintained simultaneously.


    When auditing web software for security, you often find hundreds, if not thousands,
    of hard-coded role checks in application code at all layers of software. When
    security professionals are attempting to audit the access control policy of complex
    software, they often have to pore through millions of lines of code if that is
    hard-coded. This makes it very difficult to prove that the software has adequate
    authorization controls in place. This also makes the code less safe because it
    will be more difficult to match the supposed access control policy to the reality
    of how the software operates. This is a problem for any complex access control
    system where policy is hard-coded and is not just a critique on role-based access
    control.


    # Anti-Pattern 5: Adding Access Control Manually to Every Endpoint


    Another common access control anti-pattern is an application that requires access
    control logic to be manually added to every endpoint in your application. This
    is similar to the problem of hard-coded policy in that access control policy needs
    to be manually added to the application in some way.


    Another problem with hard coding your policy is the challenge of auditing the
    security of your application. When a security auditor reviews your code for security
    and asks about your access control mechanism, is your answer, “Yeah, my policy
    is in the code, just read those 7 million LOC and there is your policy.” If so,
    FAIL. No one likes auditing complex access control policy sprinkled across thousands
    of lines of code except for hourly consultants—don''t rush them.'
