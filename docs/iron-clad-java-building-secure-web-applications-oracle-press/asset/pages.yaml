  md: '# 226 Iron-Java: Building Secure Web Applications


    We have seen some discussion of adding security-specific logging levels to log4j⁴,
    but adding a new log level for security may not be the right way to include logging
    in security. It is a matter of debate. Another alternative would be to create
    a new logger instance just for your security messages. This makes it a little
    easier to separate security log messages from diagnostic log messages. For auditing
    or non-repudiation this is certainly the case. However, maintaining a separate
    log file just for security events removes security messages from the context of
    other events happening on the system. Not having this context could actually make
    it harder for an investigator to piece together what happened after a breach.


    # ESAPI Logging


    One of earlier attempts at security-centric logging is the OWASP ESAPI project
    for Java⁵ ESAPI is a security library that includes specific and granular APIs
    for security-centric logging. Although this project is not necessarily production
    quality, it still provides a good example of the type of requirements that senior
    security professionals seek in logging software.


    The goal of ESAPI logging is simple: Provide an API that allows developers to
    easily make a log entry that includes a timestamp from a reliable source, severity
    level of the event, an indication that this is a security-relevant event (if mixed
    with other logs), the identity of the user that caused the event (if there is
    a user associated with the event), the source IP address of the request associated
    with the event, whether the event succeeded or failed, and a description of the
    event.


    In particular, ESAPI provides the logging type as part of the core logging implementation
    with six different categories:


    +   - SECURITY_SUCCESS


    +   - SECURITY_FAILURE


    +   - SECURITY_AUDIT


    > ⁴https://www.owasp.org/index.php/How_to_add_a_security_log_level_in_log4


    > ⁵We do not feel this project is production quality as of March 2014: http://off-the-wall-security.blogspot.com/2014/03/esapi-no-longer-owasp-flagship-project.html.


    > ⁶OWASP ASVS item 8.6, https://code.google.com/p/owasp-asvs/wiki/Verification_V8'
