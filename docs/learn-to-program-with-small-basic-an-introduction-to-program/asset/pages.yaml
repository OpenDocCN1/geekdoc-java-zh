- pgno: 14
  md: '# INTRODUCING SMALL BASIC


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_14_0.png)


    Bill Gates once had a goal to get a computer into every home. Now, nearly every
    desk has a personal computer—so just about anyone can learn to code, too. In this
    book, you''ll learn to program with a language called Microsoft Small Basic.


    We''ll start this chapter by explaining some general computing concepts and Small
    Basic itself. Then we''ll show you how to set up everything you need to use Small
    Basic, and top it off with writing your first program!


    # What''s a Computer?


    A computer is an electronic device that processes data according to a set of instructions—it''s
    that magical device in your pocket, or on your desk or lap. Computers can perform
    calculations (like your math teacher), compare'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    numbers (like in fantasy football), and they can store, retrieve, and process
    data at high levels of speed and accuracy (like parents remembering a curfew).


    A computer''s hardware is everything you can touch on your computer—inside the
    gates of every computer are hundreds of interconnected electronic pieces. If you
    want to imagine data inside your computer, picture a massive wall with hundreds
    of stores and tens of thousands of shoppers moving clockwork between the stores.


    But without something more, all that hardware couldn do anything useful. Every
    computer requires programs to tell it what to do—we call these instructions software.
    The people who can write software are called programmers—and you''re about to
    become one day.


    # # What''s a Computer Program?


    A computer program is a set of instructions given to a computer to per form a
    task (like a list of homework from your teacher). Your web browser, your video
    games, word processors—are all computer programs.


    A program tells the computer what data to read (like numbers or text), where to
    read the data (from a user, file, or the Internet), how to process this data (it
    might search, or calculate the data), what kind of information to produce (like
    paragraphs, reports, or graphs), where to store the produced output (like a disk,
    network, or database), and how to display the results (like through a monitor,
    printer, or plotter). Whoa! That''s a lot!


    A computer program specifies every detail along the way! Computers communicate
    in machine language, which is a bunch of 1s and 0s. (Can you imagine talking 1s
    and 0s to your friends?) A long time ago, the first programs ever written were
    actually entered into the com-puter by flipping switches on the computer''s front
    panel (on for 1, off for 0). Would you want to flip all switches day? Imagine
    the errors!


    Luckily, computer scientists invented programming languages, which are far easier
    to use machine language. Small Basic is the programming language you''ll learn
    in this book!


    # # What Is Small Basic?


    Small Basic is a programming language that Microsoft created for anyone wants
    to learn programming. You can write all kinds of applications with Small Basic,
    including games, simulations, animations, and more.


    How did the computer come about? It started with a programmer at Microsoft named
    Vijay Raji. Vijay had just read David Br''s article, "Why Johnny Cant Code."¹¹
    which describes how valuable it is to learn and teach coding in BASIC. In his
    article, Brill challenged Microsoft to make a new


    +   1. http://www.salom.com/2006/09/14/basic_2/


    Chapter 1'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    BASIC language that would help kids learn to code, and Raji accepted that challenge.
    Although BASIC was crucial to Microsoft''s success in the 1970s, 1980s, and 1990s,
    there wasn''t a great programming language suited for beginners in 2007.


    So Vijage wondered if he could create a smaller version of BASIC using only the
    simplest parts of the original language. On October 23, 2008, he released Microsoft
    Small Basic v0.1, the first version of Small Basic.


    # The Vision of Small Basic


    Small Basic''s four goals will help make your learning experience as awesome:


    +   * **It''s Simple.** It''s a simple programming language with a helpful code
    Editor and a Help Area to make coding easy.

    * **It''s Fun.** Small Basic lets you create games and other programs right away.
    It also lets you command a turtle to make art, and it''s fun to use!

    * **It''s Social.** With Small Basic, you can publish your game to the Web on
    the Microsoft gallery, show it to your friends, and embed it in your blog or website.
    Your friends can import your program and collaborate with you to make it better.

    * **It''s Gradual.** Once you learn the fundamentals of programming with Small
    Basic, just click Graduate (see Figure 1-2) to export your code into the free
    Visual Studio Community and start a new adventure with Visual Basic .NET, a programming
    language that''s used by millions of professional programmers and an important
    next step in your learning journey.


    We''ll cover everything you need to get started with Small Basic in this book!


    # The Basics of Small Basic


    The three main parts of Small Basic are the language, the supporting library,
    and the programming environment, which is the interface you''ll use to write your
    own program. Let''s explore each element now.


    # The Small Basic Language


    To form a valid sentence in English, you need to follow its grammatical rules.
    In the same way, to write a valid Small Basic program, you must follow the grammatical
    rules of Small Basic, which are called syntax rules. Syntax includes punctuation,
    spelling, statement ordering, and so on. When you break these rules, Small Basic
    detects all the syntax errors in your program and reports them to you so you can
    fix them.


    Introducing Small Basic 3'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# The Small Basic Library


    The Small Basic library contains hundreds of methods that you can use in your
    programs to perform different tasks. For example, you can use these methods when
    you tell the computer to display an image on the screen, draw a circle, download
    a file from the Internet, or even compute the square root of 275,625.


    # The Small Basic Development Environment


    Small Basic comes with an integrated development environment (IDE), which is the
    application you use to write your programs. The IDE contains a Editor (in which
    you will type your program) and a Toolbar. The Toolbar has buttons that let you
    save and run your program, open a program so you can modify it, share your program
    on the Web, graduate your program to Visual Basic, and much more.


    # Installing Small Basic


    The first step in your learning journey is to install Small Basic on your computer.
    Open your web browser, go to Microsoft''s Small Basic website at http://www.smallbasic.com/,
    and click the Download button in the upper-right corner. When you''ll go to the
    Download page to pick your operating system and language. When you start the download,
    a dialog appears asking for your permission to install the SmallBasic.msi file.
    Click the Run or Open to start the setup wizard.


    When the wizard starts, click Next on the first page, accept the License Agreement,
    click Next again for the default setup, and click Install. (If a User Access Control
    dialog pops up and asks for your permission to install the program, click Yes.)
    Finish when the installation is done. If you need these steps in detail, check
    out Appendix A.


    # The Small Basic IDE


    The installation is complete, you''re ready to start the Small Basic IDE. To start
    Small Basic, open the Windows Start menu, and enter type Small Basic to search
    for it (and click to open it) All Programs Basic > Microsoft Basic. When you run
    the program for the first time, you''ll see something like Figure 1-1 (type Prog
    in the Editor to see the IntelliSense menu).


    The IDE contains four parts. You can open and work with multiple editors at the
    same time, but only one Editor is active at once. Right-click the Editor to see
    a pop-up menu with options like Cut, Copy, and Find. The menu also has a Format
    Program option that indents the lines in your program to make it easier to read.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_18_0.png)


    Figure 1-1: The Small Basic IDE


    The Toolbar contains buttons that let you edit and run your program, and the Help
    Area provides instant information about the code you type into the Editor. The
    Surface is an open area where you can move and organize your Editor windows for
    each Small Basic program. You will use the Toolbar a lot, let''s explore it in
    detail.


    # Opening and Saving Your Work


    In the Toolbar''s File group, click New (CTRL-N) to start programming from scratch,
    or click Open (CTRL-O) to pick up where you left off in writing a program. Save
    (CTRL-S) often so you don''t lose your work, and click Save As to save your program
    in a new file.


    # Sharing Your Work and Importing Games


    Let''s say your friend just published a new game to the Small Basic website, and
    you want to check it out. In the Web group, click Import to enter the Import ID
    (which you get from your friend) and download your friend''s code. Then you can
    make the game even cooler with your modifications.


    Let''s try opening a game that has already made. Click Import, and then enter
    the code TETRIS. You''ll see the code someone wrote to re-create the same game,
    and you can see how it was made. To play the game now, click Run.


    Later, when you''re ready to share your own programs, you can click Publish, and
    Small Basic will publish your program to the Web so your friends can play your
    game or app online. You can also share your program in the Small Basic forum to
    get direct help from the community. Small Basic even gives you the option to embed
    your code snippet so you can add the project to your website.


    Introducing Small Basic 5'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    # When you click **Publish,** you''ll see a dialog like the one in Figure 1-2.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_19_0.png)


    Figure 1-2: The Publish to Web dialog


    When you Publish your code, in addition to getting the Import ID and the web page
    URL, you can also click **Add More Details** to enter a title, description, and
    category (like *game, sample exercise, example, math, fun, or miscellaneous*)
    for your program.


    # **Copy and Paste; Undo and Redo**


    In Small Basic, you can edit your code like you''re editing any kind of text.
    From the Clipboard group, click **Cut** (CTRL-X) to remove a piece of code from
    one place in the Editor to paste it somewhere else. To avoid repeating code, click
    **Copy** (CTRL-C). To select all your code, press CTRL-A, and then cut or copy
    it.


    After you cut or copy, click **Paste** (CTRL-V) to paste the contents into the
    Editor. If you make a mistake, no worries! click **Undo** (CTRL-Z). If you click
    **Undo** too many times, click **Redo** (CTRL-Y) to reverse the change. You can
    also look for a bit of code in a large file. To open the Find window and search
    for your text, just press F3, press CTRL-F, or right-click in the Editor and click
    **Find** in the context menu.


    # **Running Your Program and Graduating**


    When you finish a program, click **Run** (F5) in the Program group to *compile*;
    the compiler checks if there are any errors, and if not, builds your program.
    When you''ve mastered Small Basic, just click **Graduate** to export your code
    into the Visual Basic in Visual Studio Community and go on to learn your next
    language.


    # **Writing and Running Your First Program**


    Now that you know your way around the IDE, let''s write a Small Basic program.
    First, create a new folder on your computer called *Small Basic*; this is where
    you''ll save all the programs you create throughout this book.'
  merge: -1
  img_proc: true
