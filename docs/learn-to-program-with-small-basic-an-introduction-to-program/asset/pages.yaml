    To try out this concept, you''ll play against the computer in Pepper Dare, an
    exciting game of chance. When the game starts, the player has handled 10 mighty
    cards face down. One of those has a jalapeno pepper on; the rest are blank. The
    player picks a card and hopes for a blank one. If the player picks the card with
    the jalapeno, the player has to eat a hot pepper and the computer wins! If the
    player doesn''t get the pepper the computer takes a turn. The game ends when either
    the player or computer eats the pepper and runs for a drink of water. Enter the
    main program in Listing 10-4 to Small Basic. You''ll add the subroutines in a
    moment.


    ```

    1 PepperDare.sb

    2 player = 1 for player, 2 for computer

    3 pepper = Math.RandomNumber(10) '' Which card has the pepper

    5 Again:

    6 Pick() '' Updates the two variables: card and name

    7 If (card = pepper) Then

    8 TextBox.Write("Hot tomate, it''s a pepper!")

    9 TextBox.WriteLine(name + " wins!")

    10 TextBox.WriteLine("")

    11 Else

    12 TextBox.Write("The card is blank.")

    13 TextBox.WriteLine("You put it back and shuffle the deck.")

    14 TextBox.WriteLine("")

    15 player = 3 - player '' Switches the player

    16 Goto Again

    17 Endif

    ```


    Listing 10-4: Setting up Pepper Dare the player variable to 1 to give you the
    first


    The game starts by setting the player variable to 1 to give you the first turn
    (line 2). It randomly picks 1 of the 10 cards to be the card that has the jalapeno
    pepper (line 3). It then starts a loop (lines 5–17) to take turns. In each round,
    the game picks one card at random for the player (or the computer) calling the
    Pick() subroutine (line 6). If the picked card has a pepper on (line 7), the game
    displays the name (line 9). Otherwise, it displays "The card is blank. You put
    it back in and shuffle the deck." (lines 12–13) to indicate that the player (or
    the computer) picked a blank card. The game then switches to the next player (line
    15) and goes back to a new round (line 16). This is how the statement on line
    12 works: if player is 1 (you, the user), then 3 – 1 is 2 (switching to the computer’s
    turn), and if player is 2 (the computer), then 3 – 2 is 1 (switching back to the
    user’s turn).


    Next, you''ll add the Pick() subroutine in Listing 10-5 to the bottom of your
