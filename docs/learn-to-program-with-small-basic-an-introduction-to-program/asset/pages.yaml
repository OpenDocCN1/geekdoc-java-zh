    This code uses the Array object''s IsArray() method. If the variable is an array,
    this method returns True; otherwise, it returns False. This method shows that
    the two variables(age and score are arrays, but the name variable isn''t an array.
    The IsArray() method can help you be sure that the variables in your programs
    are arrays.


    # How Big is an Array?


    The Array object can also tell you how many elements are stored in your arrays.
    Run the program in Listing 16-5:


    ```

    1 GetItemCount.sb

    2 name = "Bart"

    3 age["Homer"] = 18

    4 age["Marge"] = 17

    5 score[1] = 90

    6 ans1 = Array.GetItemCount(name)    Returns: 0

    7 ans2 = Array.GetItemCount(age)      Returns: 2

    8 ans3 = Array.GetItemCount(score)    Returns: 1

    9 Window.WriteLine(ans1 + ", " + ans2 + ", " + ans3)

    ```


    Listing 16-5: Demonstrating the GetItemCount() method


    The GetItemCount() method returns the number of items in the specified array.
    Note how GetItemCount(name) isn''t an array. The other two calls return the number
    of elements in each array. GetItemCount() to keep track of how many items you''re
    storing in an array. You might use this method in a game that allows the player
    to store items in an inventory and you want to check how many items they have
    picked up.


    # Does It Have a Particular Index?


    You can also use the Array object to find out one of your arrays contains a certain
    index. To see how, run the program in Listing 16-6:


    ```

    1 ContainsIndex.sb

    2 age["Homer"] = 18

    3 age["Marge"] = 17

    4 score[1] = 90

    5 ans1 = Array.ContainsIndex(age, 1)    Returns False

    6 ans2 = Array.ContainsIndex(age, "homer") Returns True

    7 ans3 = Array.ContainsIndex(age, "Lissa")  Returns False

    8 Window.WriteLine(ans1 + ", " + ans2 + ", " + ans3)

    9

    10 ans1 = Array.ContainsIndex(score, "1")    Returns True

    11 ans2 = Array.ContainsIndex(score, 1)     Returns True

    12 ans3 = Array.ContainsIndex(score, 2)     Returns False

    13 Window.WriteLine(ans1 + ", " + ans2 + ", " + ans3)

    ```


    Listing 16-6: Demonstrating the ContainsIndex() method


    Storing Data with Associative Arrays 233'
