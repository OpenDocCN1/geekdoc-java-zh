    In most programming languages, working with files is an advanced topic, but Small
    Basic makes file handling super simple. In this chapter, you''ll discover the
    File object and learn how to use it to make working with files a breeze!


    # # The Case for Files


    In your programs, you''ve used variables and arrays to store data. But data stored
    in variables and arrays is temporary: all data is lost when the program ends or
    when you turn off your computer. When you run your program again, it won''t remember
    the input you entered the last time. If you want to permanently store the data
    created in a program, you need to save that data in a file. Data stored in files
    is called persistent data because it''s retained even after you turn off your
    computer. They''re as persistent as a squirrel caching acorns.


    Files provide a convenient way to handle large amounts of data. If your program
    requires lots of data (like the names of your friends), you can ask a user to
    input data each time she runs the program. Most likely, she''ll get annoyed and
    stop using the program. If a program can read its input data from a file, a user
    won''t need to enter data by hand and might well customize the application by
    changing the file. For example, if you write a spelling game that reads its input
    from a file, the user can set short words for an easy game and long words for
    a more difficult game!


    Getting data from a file is called reading the file, and the files are generally
    called input files. Similarly, sending data to a file is called writing to the
    file, and the files writes to (or creates) are called output files. Storing data
    to (and reading from) files on disk is called file access. Working with files
    is called file I/O, which is short for input/output.


    Before we start working with files in programs, let''s look at filenames and how
    files are saved on your computer.


    # Naming Files


    When you create a new file, you give it a name. You can call it Fred or DontOpenMe
    but it''s usually best to name it more specifically, such as myFriends.txt or
    myLoveStory.txt.


    The Windows operating system is case insensitive and doesn''t see any difference
    between uppercase and lowercase letters in filenames; so myFile, Myfile, and MYFILE
    would all refer to the same file. Windows supports filenames with two parts that
    are separated by a period, such as myFile.dat. The part following the period (dat
    in this example) is called the file extension. The file extension usually indicates
    the contents of the file. Table 19-1


    292 Chapter 19'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    contains some of the most common file extensions and their meanings. File extensions
    are usually added automatically by the programs you use. For example, the Small
    Basic IDE adds a .sb extension to source code files.


    # Table 19-1: Common File Extensions


    | Extension | Meaning |

    | --- | --- |

    | .dat | General data file |

    | .exe | Executable file; used for Small Basic applications |

    | .gif | Graphical Interface Format; used for most website images |

    | .html | Hypertext Markup Language website; used for files for web pages |

    | .jpg | An image encoded with the JPEG standard; used for photos from a camera
    |

    | .mp3 | Music encoded in MPEG layer 3 audio format |

    | .pdf | Portable Document Format for reading; used for an eBook |

    | .txt | General text file; used for notes you might write in Notepad |


    You''ll be working with text and .txt files in this chapter.


    # File Organization


    Imagine dozens of books organized in a cabinet with several shelves. Each shelf
    has a label (such as Science, Math, Novels, Dr. Seuss, and so on) and is filled
    with books together. Each shelf serves as a container that groups related together.
    Similarly, files on a computer are stored in containers called directories (or
    folders). A directory contains files and other directories (called subdirectories)
    as well. A subdirectory is a directory within a directory.


    The file system is the part of the operating system that is responsible for organizing
    files and directories on a computer and providing ways to manage them. When you
    call a file-related method from your Small Basic program (to create, delete, read,
    or write to a file), the operating system handles all the low-level details for
    you, so you don''t have to worry whether the actual files are stored on a hard
    drive, flash memory, CD, DVD, and so on. The Small Basic library talks to the
    operating system to access files on various media, as illustrated in Figure 19-1.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_302_0.png)


    Figure 19-1: How the file system lets you access files on different media


    The file system has a tree structure, like the one shown in Figure 19-2. The top
    of the tree is called the root directory (the drive letter D: in this


