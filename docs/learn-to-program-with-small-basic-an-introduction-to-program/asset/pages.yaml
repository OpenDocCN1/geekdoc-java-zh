  md: '# #9 USING DECISIONS TO MAKE GAMES


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_124_0.png)


    Sometimes decisions are complicated. Let''s say a boy and a girl want to see a
    movie. She wants to see an action movie, but he wants to see a comedy. She''s
    willing to see a comedy if it has action, if it has good reviews, and if it stars
    an actress with good taste in clothes. But the movie has to start before 10 PM
    and must be within a 10-mile radius of the restaurant where the couple is having
    dinner. Imagine what the code would look like to make a decision like that!


    In this chapter, we''ll continue the topic of decision-making and looking at some
    statements. We''ll first introduce the If/elseIf statement and show how it makes
    writing nested If statements easier. Then, you''ll explore the logical operators
    And and Or, which let you do even more with your If'
