    In programming, loops are used in different ways. One important use of loops is
    called an accumulator loop, which accumulates (or adds up) a value during each
    iteration of the loop. Accumulator loops are commonly used to keep count of values
    in programs.


    Let''s say you need to find the sum of all integers from 1 to 10: 1 + 2 + 3 .
    . . + 10. What will the program in Listing 13-2 do?


    ```

    1 '' Sum.sb

    2 sum = 0

    3 For N = 1 To 10

    4 sum = sum + N '' Adds the new value of N to the sum

    5 EndFor

    6 TextWindow.WriteLine("sum = " + sum)

    ```


    Listing 13-2: Using a For loop to add numbers


