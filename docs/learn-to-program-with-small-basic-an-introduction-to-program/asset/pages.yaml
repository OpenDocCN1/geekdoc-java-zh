    # Programming Errors


    Just because a program runs doesn''t mean it''s correct. All programmers make
    errors at some point, especially when they write long programs. Don''t worry!
    You''ll make fewer errors the more you practice. Three main types of errors in
    programming are syntax errors, logic errors, and runtime errors; we''ll teach
    you how to find and fix them.


    # Syntax Errors


    Errors pop up whenever a program breaks one of the language''s syntax rules. Examples
    of syntax errors include the following:


    +   * Missing punctuation, such as in TextWindow.WriteLine("Hello", which includes
    a string without an ending quote

    * Extra punctuation at the end of a statement

    * Misspelled keywords, such as while instead of while

    * Arithmetic operators used incorrectly, such as 5 ** 2

    * Mismatched parentheses in arithmetic expressions, such as 5 * (6 - (3 + 2))


    > Keyword is a special word that tells Small Basic to do something, like to repeat
    a statement. We''ll explain each one in later chapters.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_37_0.png)


