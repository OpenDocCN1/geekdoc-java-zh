  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    Try changing the value in karenbears and running the program again to see what
    happens. Neat, huh? Changing the value of karenbears will also change the value
    of lindabears. Variables can make your programming life so much easier!


    Let''s check out other important concepts you need to know when you want to use
    your own variables.


    # Assigning Expressions to Variables


    Arithmetic expressions are combinations of variables, operators, and arithmetic
    operations. They can be constant numbers (such as 3, 6, 8, or -10), arithmetic
    expressions (such as 3 + 6 / 10), or algebraic expressions (karenbears / 2). Evaluating
    an arithmetic expression in Small Basic is just like evaluating an expression
    in math. For example, the expression 4 * 3 + 6 / 2 is evaluated as (4 × 3) + 6
    / 2 = 12 + 3 = 15. You can also use parentheses in expressions to decide the order
    of operations.


    You can set variables to the result of an arithmetic expression using an assignment
    statement. Your program grabs the value to the right of the equal sign and assigns
    that to the variable on the left of the equal sign. You already did this in Listing
    4-1; let''s build on that knowledge and write more variables set to arithmetic
    expressions!


    barbies = 5 Barbies

    ponies = barbies + 7 You have 7 more My Little Ponies

    donate = (barbies * ponies) / 10 Total toys you need to donate


    When you run this program, the variables barbies, ponies, and donate are 5, 12,
    and 6, respectively. Time to donate 6 toys!


    You need to set the variable on the left of an assignment operator, as you''ve
    seen in every assignment example so far. This''s statement is incorrect:


    ```

    5 = barbies This is backwards, like the Twilight Zone

    ```


    Try running it to see if you get an error!


    # Passing Variables to Methods


    A method''s arguments can be constants, variables, or even expressions. For example,
    the argument to WriteLine() in the following statement is an expression:


    ```

    TextWindow.WriteLine((3 * x + y) / (x - y))

    ```


    If x = 7 and y = 5, this statement displays 13 on the screen. See if you can figure
    out how to write and use this code. Remember to set x and y first!


    Using Variables 45'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    # # Changing the Value of a Variable


    When you create a variable in your program, you assign it an initial value using
    the assignment operator. You can also use the assignment operator to change the
    value of an existing variable, which wipes out the old value, like this:


    ```

    ferrets = 5

    ferrets = 15

    TextWindow.WriteLine("There are " + ferrets + " ferrets in my bed!")

    ```


    The first line in this example creates a new variable ferrets and assigns 5 to
    it, but the second line changes its value to 15. The WriteLine statement would
    output 15 ferrets in my bed!


    Behind the scenes, the variable points to a storage area in the computer''s memory.
    When you write ferrets = 15, you tell Small Basic to go into the memory reserved
    for ferrets and replace the 5 with a 15. When you display the value of ferrets,
    you grab whatever is stored in the space at that moment.


    You can also add to a variable to change its value. Imagine a game in which the
    player has to shoot airplanes. When the player shoots an airplane, want to increase
    their score (stored in a variable named score) by five points. How would you update
    the score variable? Here is one way:


    ```

    score = 10          Assumes the player already has 10 points

    temp = score + 5   temp = 10 + 5 (= 15)

    score = temp       Now the player has 15 points

    ```


    The second line uses a temporary variable named temp to store the result of adding
    five to the current value of score. The value of temp is then assigned to score.


    But you can do this faster in one statement:


    ```

    score = score + 5

    ```


    You see how the same variable, score, is on both sides of the assignment? This
    statement adds 5 to the current value of the variable score and stores the result
    back into the same variable. The old value of 10 is replaced by the new value,
    15. See Figure 4-1.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_59_0.png)


    Figure 4-1: Illustrating the statement score = score + 5


    46 Chapter 4'
