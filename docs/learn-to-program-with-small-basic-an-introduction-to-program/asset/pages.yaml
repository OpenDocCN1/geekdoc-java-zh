    This code snippet shows you some examples:


    ```

    Math.Abs(-2)   = 2

    Math.Abs(-3.5) = 3.5

    Math.Abs(4)    = 4

    ```


    The Abs() method takes in a number (positive or negative) and returns that number''s
    distance from 0, or its absolute value. This return value is always a positive
    number.(In other words, Abs() removes the minus sign.)


    For example, let''s say of your game gives a secret number(10), the guess doesn''t
    have to be. Instead, your game accepts any guess between 8 and 12. To check if
    the user''s guess is okay, you can test the absolute difference between the user''s
    guess (saved in the guess variable) and 10; that is Abs(guess - 10). You''ll learn
    how to perform this check using the If statement in the next chapter.


    Now let''s find the minimum or maximum of two numbers. The Min() method returns
    the lower of two numbers, and the Max() method returns the higher number:


    ```

    Math.Min(5, 10)    = 5

    Math.Min(-3.5, -5.5) = -5.5

    Math.Max(3, 8)      = 8

    Math.Min(-2.5, -4.7) = -2.5

    ```


    You can use these methods to limit the number your user can input to your program.
    For example, if your program expects a number that''s less than 100, you can write
    this:


    ```

    ans = TextWindow.ReadNumber()

    ans = Math.Min(ans, 100)

    TextWindow.WriteLine(ans)

    ```


    Try it out! Run this code two times. The first time, enter a number less than
    100, and the second time enter a number greater than 100. Can you modify the code
    so the entered number can go below 0?


    If you want to find the minimum of three numbers? For example, let''s say you
    find the lowest score out of three math quizzes you took last. One way is to write
    this:


    ```

    minScore = Math.Min(Math.Min(score1, score2), score3)

    ```


    The inner Min() finds the minimum of score1 and score2 variables. That result
    and score3 are passed to the outer Min() method to determine which is lower: the
    first minimum (of score1 and score2) or score3. The final result is saved in the
    minScore variable.


