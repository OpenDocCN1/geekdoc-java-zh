    # Step 3: Add a Bit of Chance


    Next, you need to add some luck to the game. Each time we load the game, we want
    Good Knight to get a different number of arrows, a random distance away from the
    dragon, and a different shield strength. To do this, add the `newGame()` subroutine
    in lines 10–9 to your program:


    ```

    1 SubGame

    2 dist = 9 + Math.RandomNumber(10) '' 10 to 19

    3 arrows = Math.Floor(0.4 * dist) '' 4 to 8

    4 shield = Math.Floor(0.4 * dist) '' 4 to 8

    5 moveStep = 280 / dist '' Knight''s move in pixels

    6 EndSub

    ```


    > Listing 10:9: Setting up a new game


    In line 2, you add 9 to a random number between 1 and 10, which sets the distance,
    between 10 and 19. This is the number of steps Knight has to get to Draggy. Next,
    you set the number of arrows as 40 percent of the distance (line 3). The farther
    the knight is from the dragon, the more arrows he''ll have. In line 4, you set
    the strength of the knight''s shield—again, as a fraction of his distance.


    Let''s think about the moveStep a little bit. The width of the background image
    480 pixels. The width of the dragon is 100 pixels, and the width of the knight
    is 100 pixels. When we place the dragon and the knight on the background, the
    distance from the dragon''s right edge to the knight''s left edge is 280 pixels
    (see Figure 10-6 again). So every time Good Knight moves forward, we''ll move
    his image to the left by (280 / dist) pixels.


    TIP You can change the fraction in lines 3 and 4 from 0.4 to a different value
    to make the game easier or harder. After you complete the game, try changing the
    fraction and play the game a couple of times!


