    # Let''s Get Logical


    Sometimes you might want to check multiple conditions to see whether to run a
    statement. For example, you might adopt a dog only if the dog is big, is potty
    trained, and has three heads. One way to test multiple conditions is to nest If/Else
    like you have been in previous chapters. Another way is to use logical operators
    (also called Boolean operators). With logical operators, you can write test conditions
    that combine two or more logical expressions. Let''s see how.


    Do you remember something like x < 10 when you learned about inequalities in your
    elementary math class? This expression describes a number, x, that is greater
    than 5 and less than 10. Figure 9-2 shows how to write this expression in Small
    Basic.


    This is a compound condition that makes up of two logical expressions, x > 5 and
    x < 10, that you combine using the logical operator And. In order for this compound
    condition to be true, both of the expressions must be true.


    Small Basic supports two logical operators: And and Or. Figure 9-3 describes how
    they work.


