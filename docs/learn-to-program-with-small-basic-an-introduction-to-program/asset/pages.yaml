- pgno: 240
  md: '# 16


    # STORING DATA WITH ASSOCIATIVE ARRAYS


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_240_0.png)


    On social websites like Facebook and LinkedIn, people enter information into text
    boxes, such as their name, relationship status, and even regular updates to their
    friends (like, "Oh noes!! I just stepped on a bug, and I think I got poisoning!").
    Programs that need to search or filter this data may use associative arrays to
    store the various parts of the text.


    In addition to the indexed arrays used in Chapter 15, Small Basic supports other
    types of arrays that can simplify many programming tasks. In this chapter, you''ll
    start by learning about associative arrays. Then you''ll learn about the Array
    object, use it to create some fun applications, and even turn your computer into
    a poet!'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Associative Arrays


    In the previous chapter, you learned how to use an integer index to access an
    array''s elements. In Small Basic, an array''s index can also be a string. Arrays
    indexed by strings are called associative arrays, maps, or dictionaries. In this
    book, we''ll call them associative arrays. Just like an indexed array, an associative
    array can store values of any type. You can use an associative array to create
    an association between a set of keys (string indices) and a set of values, which
    is called a map of key-value pairs.


    The following code shows a example of an associative array in action. It lists
    some examples keyed by their two-letter abbreviations:


    ```

    state["CA"] = "California"

    state["MI"] = "Michigan"

    state["OH"] = "Ohio"

    ... and so on

    ```


    To display the name of a state, simply use its corresponding key and the proper
    syntax. For example, to print Michigan, you can write this statement:


    ```

    TextWindow.WriteLine(state["MI"])

    ```


    By writing the name of the array followed by the key enclosed in square brackets,
    you can access the corresponding item. An associative array works like a lookup
    table that maps keys to values; if you know the key, you can find its value very
    quickly.


    To learn how use associative arrays, let''s write a program that keeps track of
    the ages of your friends by name. Enter the program in Listing 16-1:


    Listing 16-1: Using associative arrays


    Lines 2–5 create an associative array named age with four elements in it. You
    can add more if you''d like, or you can change the array to store the ages of
    your own friends. Line 6 asks you to enter a friend''s name, and line 7 reads
    it into the name variable. In line 9, age[name] looks up the age of that friend.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Let''s look at some sample runs of this program:


    Enter the name of your friend: Ernie

    Ernie is [16] years old.


    Enter the name of your friend: ernie

    ernie is [16] years old.


    Note that the key is case insensitive; it doesn''t matter if you enter age["Ernie"],
    age["ernie"], or age["ERNIE"]. If the array contains a key Ernie, regardless of
    its case, Small Basic returns the value for that key.


    Let''s say you forget which friends'' names you stored in the array, and you try
    to access the age of someone you forgot to:


    Enter the name of your friend: Grover

    Grover is [] years old.


    If the array doesn''t contain a certain key, Small Basic returns an empty string,
    which is why["Grover"] is empty.


    # ASSOCIATIVE ARRAYS VS. THE IF/ELSE LADDER


    In programming, there are usually lots of ways to approach a particular problem.
    Here''s another way to write the program like the one in Listing 16-1:


    ```

    TextWindow.Write("Enter the name of your friend: ")

    name = TextWindow.Read()

    If (name = "Bert") Then

    age = 17

    ElseIf (name = "Ernie") Then

    age = 16

    ElseIf (name = "Zoe") Then

    age = 16

    ElseIf (name = "Elmo") Then

    age = 17

    Else

    age = ""

    EndIf

    TextWindow.WriteLine(name + " is [" + age + "] years old.")

    ```


    Although this program seems similar to the one in Listing 16-1, the two have one
    important difference: here, string comparison is case sensitive. If you enter
    ernie (with a lowercase e), the program displays the following output:


    ernie is [] years old.'
