    But matrices aren''t only about numbers. You can use them to make some fun, colorful
    applications too. In the next example, you will create a colorful grid and animate
    it.


    # Animated Squares


    In this example, you''ll write a program that creates a 4''8 grid of randomly
    colored squares and then animates these squares to fly up to the upper-left corner
    of the GraphicsWindow, as shown in Figure 17-4.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_258_0.png)


    Figure 17-4: Illustrating the output of the AnimatedSquares.sb program


    The complete application is shown in Listing 17-2.


    ```

    1 AnimatedSquares.sb

    2 Creates a 4x8 grid of randomly colored squares

    3 For r = 1 To 4 *'' rows

    4 For c = 1 To 8 *'' columns

    5 cls = GraphicsWindow.GetRandomColor()

    6 GraphicsWindow.BrushColor = cls

    7 box[r][c] = Shapes.AddRectangle(20, 20) * Adds a square

    8 Shapes.Move(box[r][c], c * 20, r * 20) * Positions it

    9 EndFor

    10 EndFor

    11 Animates the squares to the upper left corner of the window

    12 For r = 1 To 4

    13 For c = 1 To 8

    14 Shapes.Animate(box[r][c], 0, 1000)

    15 Program.Delay(400) * A small delay (msec)

    16 EndFor

    17 EndFor

    ```


    Listing 17-2: Using a matrix to store shape IDs (lines 3–10).


    The program uses a nested For loop to create the squares (lines 3–10). The outer
    loop (which creates the rows) runs four times, and the inner loop (which creates
    the columns) runs eight times (lines 3–4) for a total of 32 iterations (4''8).
    In each pass of the inner loop, the square''s color is set by changing the BrushColor
    property (lines 5–6). We save its identifier in box[r][c] (line 7), and then move
    the square to its position on the square grid (see Figure 17-4). Let''s take a
    closer look at lines 7–8.


