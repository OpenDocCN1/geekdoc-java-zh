    Similarly, many computer programs (especially games) use event-driven programming,
    they listen and respond to events raised by the operating system (see Figure 11-1).
    Think of an event as a signal that reacts

    in response to an action, like moving or clicking the mouse, clicking a but-ton,
    typing on the keyboard, having a timer expire, and so on.


    You might not realize it, but Small Basic knows a lot of information about the
    user''s interaction with your program. Some objects in the Small Basic library
    can see these events and when they happen. Programmers say that an object raised
    an event. You can write some exciting applications and by handling these events
    (like a super explosion farming game). These games typically wait for the player
    to move the mouse or press the space keys, and then they take action.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_163_0.png)


    Figure 11-1: The event-driven programming model


    In Figure 11-1, the events are at the top. When a user triggers an action (like
    pressing a key), the Small Basic library knows about it. If you want to know when
    an event happens, you can ask Small Basic to inform you when an event occurs so
    you can write programs that react to certain events.


    The Small Basic library has three objects that handle events (see Figure 11-2):
    GraphicsWindow, Timer, and Controls. You''ll study the events of GraphicsWindow
    and Timer objects in this chapter, and you''ll tackle the events of the Controls
    object in the next chapter.


