    # More on Code Points


    The Unicode code points for lowercase letters are consecutive integers from 97
    (a) to 122 (z). Similarly, the code points for uppercase letters range from 65
    (A) to 90 (Z). The code point for lowercase a is greater than the code point for
    uppercase A, and the difference between the code point for a and A (97 - 65 =
    32) is the same as the difference between the code point for b and B (98 - 66
    = 32), and so on. When given the code point for a lowercase letter, we''ll represent
    it as ch, the code point for its corresponding uppercase is 65 + (ch - 97). Here''s
    the formula:


    ```

    code for uppercase ch = code(for lowercase ch - code(a))

    ```


    Now that each character in a string is identified by a code point number, you
    can perform many useful operations on strings. The following examples show what
    you can do.


    # Printing a Quotation Mark


    Let''s say you want to display the string "Bazinga" with the double quotes included
    in the output. If you write Textwindow.WriteLine("Bazinga") Small Basic displays
    Bazinga without the quotation marks because the quotation identifies the start
    and end of a string. If you write Textwindow.WriteLine("Bazinga"), Small Basic
    flags this as a syntax error. How do you display the quotation marks? By using
    the code point, you can append the quotation mark to the string, as shown in the
    following code snippet:


    ```

    QUO = Text.GetCharacter(34) '' Gets the double quotation mark

    Textwindow.WriteLine(QUO + "Bazinga" + QUO) '' Output: "Bazinga"

    ```


    The first statement gets the quotation mark character from its Unicode code point
    (34) and assigns it to the variable QUO. The second statement inserts the string
    "Bazinga" between two QUO characters to output the desired result.


    # Creating a Multiline String


    You can create a multiline string by embedding the line feed character (code point
    10) into a string. Enter the following code snippet for example:


    ```

    LF = Text.GetCharacter(10) '' Code for line feed

    Textwindow.WriteLine("Line1" + LF + "Line2") '' Displays two lines

    ```


    When you run this code, the two strings, "Line1" and "Line2", are displayed on
    two lines. The result is identical to what you get when you use the following
    statements:


    +   1 Textwindow.WriteLine("Line1")

    2 Textwindow.WriteLine("Line2")


