    # Round()


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_100_0.png)


    | Math.Round(3.4) = 3 |

    | Math.Round(3.6) = 4 |

    | Math.Round(-3.4) = -3 |

    | Math.Round(-3.6) = -4 |


    Round() behaves mostly how you''d expect it to when rounding a number. Above 0.5,
    it''ll round up; below 0.5, it''ll round down.


    # Floor()


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_100_1.png)


    | Math.Floor(3.4) = 3 |

    | Math.Floor(3.6) = 3 |

    | Math.Floor(-3.4) = -4 |

    | Math.Floor(-3.6) = -4 |


    Floor() always rounds down, throwing away any partial fraction of a whole. Look
    at what happens with negative values!


    # Ceiling()


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_100_2.png)


    | Math.Ceiling(3.4) = 4 |

    | Math.Ceiling(3.6) = 4 |

    | Math.Ceiling(-3.4) = -3 |

    | Math.Ceiling(-3.6) = -3 |


    Ceiling() always rounds up.


    Figure 7-1: The rounding methods with example arguments and return values


    # Traditional Rounding


    Be careful when you use the Round() method if the fraction part of the number
    is exactly 0.5. In case, the Round() methods to the nearest even integer (this
    is called banker''s rounding). For example, 0.5 and -0.5 are rounded to 0, 1.5
    and 2.5 are rounded to 2.0, and -1.5 and -2.5 are rounded to -2. This is different
    from what you learned in algebra, where 0.5 always rounds up to 1! Even though
    it''s not what you''re used to, banker''s rounding is very common and is regularly
    used by bankers, who gives it it


    But how we make Small Basic round the numbers you learn in school (where the 0.5
    fraction is always rounded up?) We''ll do some fancy footprint using the Floor()
    method instead of the Round() method, like this:


    ```

    Math.Floor(x + 0.5)

    ```


    Using this, x represents whatever value you want to round. So if x is 0.6, then
    x + 0.5 = 1.1, and Floor(1.1) = 1. Cool! That''s exactly how you expect it to
    work.


    But let''s say x is 2.5. If we used Math.Round(2.5), we would get 2, which isn''t
    the result you want if you wanted use traditional rounding. We want to round up
    and get 3. Using our fancy trick, you''d get x + 0.5 = 3.0, and Floor(3.0) = 3.
    Now that''s more like it! This gets the values you expect if you wanted to round
    a decimal number whose last digit is 5.


