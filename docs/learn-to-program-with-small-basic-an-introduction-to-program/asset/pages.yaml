    # ## If/ElSelf Ladder


    It''s all over the news! Franko, the alien monster, has escaped from custody.
    Frankly, you have your laser gun when you spot him attacking people in your neighborhood.
    You aim and shoot. Run the program in 9-1 to see what happens next!


    ```

    1 AlienAttack.sb

    2 TextWindow.Write("A saving alien monster approaches.")

    3 TextWindow.WriteLine("Press any key to shoot...")

    4 TextWindow.PauseWithoutMessage()

    5

    6 damage = Math.RandomNumber(5) '' Randomly picks an outcome

    7 If (damage = 1) Then

    8 TextWindow.Write("Wow You got him.")

    9 TextWindow.WriteLine("Now you can watch SpongeBob!")

    10 ElseIf(damage = 2) Then

    11 TextWindow.WriteLine("You injured him.")

    12 TextWindow.WriteLine("He wants a Band-aid.")

    13 Else(damage = 3) Then

    14 TextWindow.Write("Weak shot. Run for your life!")

    15 TextWindow.WriteLine("Now dance! You''ll confuse him.")

    16 Else

    17 TextWindow.Write("You missed! He got you.")

    18 TextWindow.WriteLine("You should stick to video games.")

    19 EndIf

    ```


    Listing 9-1: Climbing the If/ElSelf ladder The program picks a random number between
    1 and 5 (line 6) and then checks that number to decide the alien''s fate. Lines
    7–19 are called the If/ElSelf ladder, which is commonly used to build a chain
    of statements. Its general form is illustrated in Figure 9-1.


    Starting from the first statement, the program runs through each condition. As
    it finds a true, it runs the statement(s) associated with that condition and moves
    down to the statement after the EndIf, skipping the rest of the ladder. If none
    of the conditions are true, the program runs the statements inside the Else clause
    at the end of the ladder, and then the program


    That''s why the final Else statement often called the default case. If you don''t
    include the final Else in the ladder and all the conditions are false, the If/ElSelf
    ladder does nothing, and the program continues after the EndIf.


