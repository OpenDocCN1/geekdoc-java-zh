  md: '# 14

    CREATING CONDITIONAL

    WHILE LOOPS


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_208_0.png)


    In Chapter 13, we showed you how to use the For loop to repeat code a certain
    number of times. For loops are ideal to use when you know exactly how many times
    you want to repeat code. While is another Small Basic keyword that lets you create
    loops. It’s useful when you don''t know how many times you want to repeat a loop
    in advance, because While loops keep running code as long as a condition is true.


    A While loop condition is similar to how your parents keep telling you to clean
    your room until it’s spotless or how you keep eating Thanksgiving turkey until
    you’re stuffed! When the loop’s condition becomes false, the loop ends, and the
    program moves on.'
