    The Goto statement is an unconditional jump (or unconditional transfer) statement,
    the program jumps unconditionally (without asking any questions) to the location
    given by the Goto''s label. The If/Then statement, on the other hand, is a conditional
    transfer statement, because the program changes its flow only when a certain condition
    is met.


    Most programmers suggest that you avoid using Goto statements because spaghetti
    code—code that is so tangled and complex that no one can follow it! But sometimes
    a Goto statement can be very useful, and it''s helpful to know when it comes in
    handy.


    One common use of Goto is to check the data entered by a user to make it''s correct,
    as shown in Listing 8-7:


    ```

    1 ValidateWithGoto.sb

    2 TryAgain

    3 TextWindow.Write("Enter a positive number: ")

    4 num = TextWindow.Read()

    5 If (num <= 0) Then

    6 Goto TryAgain

    7 End

    8 TextWindow.Write("You entered: " + num)

    ```


    Listing 8-7. Using Goto to check the user''s input


    This code asks the user to enter a positive number (line 3) and reads the input
    into the num variable (line 4). If the user''s input number isn''t positive (line
    5), the Goto statement sends the program back to the TryAgain label and asks the
