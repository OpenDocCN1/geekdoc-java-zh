    40, and so on. So you need a formula to map the star''s x-coordinates, X0 = [-11,
    -10, -9, ...], to their-corresponding horizontal positions, xPos = [20, 40, 60,
    ..., 240], in the graphics window. To do this, you add 12 to X0 to get [1, 2,
    3, ..., 12] and multiply the result by 2. Test it out! When X0 = -10, (-11 + 12)
    × 20 = 20. When X0 = -10, (-10 + 12) × 20 = 40, and so on. This is exactly what
    you need.


    Mapping for the y-coordinate works the same way. If the star''s y-coordinate is
    8, you need to draw it at vertical position 20 in the graphics window. If the
    star''s y-coordinate is 7, you need to draw it at vertical position 40, and so
    on. So you need a formula to map the star''s y-coordinates, Y0 = [8, 7, 6, ...],
    to their vertical positions, yPos = [20, 40, 60, ..., 180], in the graphics window.
    You do this by subtracting Y0 from 9 and multiplying the result by 2. Let''s test
    it out! When Y0 = 7, (9 - 7) × 20 = 40, and so on, which is exactly what you need.


    You still have one minor detail to consider. Let''s say the star''s (X0, Y0) coordinates
    are (-10, 2), as shown in Figure 9-9. You may map pixels and find that you need
