    On line 7, the Add() method takes the width and height of the desired rectangle
    and returns an identifier of the created shape. In this example, we pass 20 for
    both arguments to create a square and save the returned identifier in box[r][c].

    To move the square, we call the Move() method of the Shapes object. This method
    takes three arguments: the identifier of the shape we want to move and the x-
    and y-coordinates of position we''re moving to. In each row we have their x positions
    (left edge) at 1x20, 2x20, 3x20, and so on. The squares in each column have their
    y positions (top edge) at 1x20, 2x20, 3x20, and so on. This is why we use c20
    and r*20 in the call to Move().

    At the end of this code block, the box matrix contains 32 unique identifiers for
    the 32 squares created by the Shape object.

    The program then animates the squares (lines 13–18). It uses a nested loop to
    access the rows and the columns of box. During each iteration, we ask the Shapes
    object to animate one square (line 15) and pause for a short time (line 16). The
    Animate() method takes four arguments: the identifier of the shape we want to
    animate, the x- and y-coordinates of the destination, and the animation duration
    in milliseconds. We ask the Shapes object to move each square to point (0,0) in
    one second (1000 milliseconds).


    # TRY IT OUT 17-2


    Change the program in Listing 17-2 to animate the squares by columns instead of
    rows. If you''re feeling artistic, try to move the squares to create a pattern
    in the Graphicswindow.


