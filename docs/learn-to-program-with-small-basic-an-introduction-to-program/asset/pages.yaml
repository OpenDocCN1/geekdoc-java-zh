- pgno: 56
  md: '# 4 USING VARIABLES


    Have you ever wanted to be a doctor, astronaut, firefighter, animator, mayor,
    botanist, or ninja? What if you could be all of them but just one at a time? A
    variable can be anything in your programs, like a string or a number, but it can
    only be one thing at a time. For example, a number-guessing game might ask the
    player to type their name (a string) and then greet the player using the name
    they entered. Next, the program might ask them to type their first guess for the
    game (a number) and then check to see if they guessed correctly.


    For the game to work, it must remember, or store, the data entered by the player.
    It might also need to track how many rounds it took the player to guess the secret
    number. You can do all this using variables!


    In this chapter, you''ll learn how to define variables and use them to store text
    or numbers. You''ll then use variables in programs that solve practical problems.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# What’s a Variable?


    A variable is used to store values, numbers or text. You can use similarly to
    how you might use a treasure chest to store values if you were a pirate. Think
    of a variable as a box. You can put different things inside your box to use later
    on. You can change the value of your variable, just like you can put something
    new inside your box, like your gum collection. Variables are called variables
    because their content can vary.


    To create a variable in Small Basic, use an assignment statement like this:


    ```

    treasureChest = "My booty!"

    ```


    This statement creates the variable treasureChest and assigns it the string "My
    booty!" The equal sign is an assignment operator. Assigning information to a variable
    for the first time is called initializing the variable.


    Now let’s explore how to use variables in your programs. Anch


    # The Basics of Using Variables


    Karen has 12 bears. Her sister, Linda, has as many. How many bears does Linda
    have? Could you do the math in your head or with a calculator, but let’s follow
    List 4-1 to do this problem the Small Basic way!


    | Variables.sb | Karen has 12 bears |

    | karenBears = 12 | |

    | lindaBears = karenBears / 2 | Linda has as many bears as Karen |

    |5 TextWindow.Write("Karen''s " + karenBears + " bears aren''t as ") | |

    |6 TextWindow.WriteLine("fancy as Linda''s " + lindaBears + " bears!") | |


    Listing 4-1: Demonstrating variables


    The statement karenBears = 12 at line 2 creates a variable karenBears and assigns
    the value 12 to it. Line 3 divides karenBears by 2 and stores the result in a
    new variable lindaBears. When line 3 runs, Linda holds the value 12 / 2, which
    is 6.


    Line 5 outputs the string "Karen''s " and then the plus sign concatenates the
    value of karenBears, which is 12, after the string. Then it concatenates bears
    aren''t as " after the line 12. (For a refresher on concatenation, refer to "Joining
    Strings" on page 18.) Similarly, line 6 outputs the string "fancy as Linda''s
    " and adds bears! and then the value stored in the variable lindaBears.


    Now, let’s run the program to see the result. You should see this:


    Karen''s 12 bears aren''t as fancy as Linda''s 6 bears!'
  merge: -1
