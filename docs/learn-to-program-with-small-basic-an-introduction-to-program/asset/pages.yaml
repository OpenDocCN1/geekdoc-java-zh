- pgno: 243
  md: '# Putting Associative Arrays to Use


    Now that you understand the basics of associative arrays, let''s examine a couple
    of programs that show how you to use them.


    # Days in French


    The first example translates the days of the week from English to French. This
    program prompts you to enter the name of a day in English and outputs that name
    in French. Enter the code in Listing 16-2:


    ```

    1 FrenchDays.sb

    2 day["Sunday"] = "Dimanche"

    3 day["Monday"] = "Lundi"

    4 day["Tuesday"] = "Mardi"

    5 day["Wednesday"] = "Mercredi"

    6 day["Thursday"] = "Jeudi"

    7 day["Friday"] = "Vendredi"

    8 day["Saturday"] = "Samedi"

    9

    10 TextWindow.Write("Enter the name of a day: ")

    11 name = TextWindow.Read()

    12 TextWindow.WriteLine(name + " in French is " + day[name])

    ```


    Listing 16-2: An English-to-French translator


    The array stores the French names for the days of the week (lines 2–8). Each key
    in the array is the day''s name in English. The program prompts you to enter the
    name of a day in English (line 10) and stores the user''s input in the variable
    name (line 11). The program looks up the French name using the user''s input as
    a key, using the syntax day[name], and displays it (line 12). Here''s the output
    from a sample run:


    Enter the name of a day: Monday

    Monday in French is Lundi


    Do you know any other languages? Change the program to help your friends learn
    how to say the days of the week in a new language. Feeling sneaky? You could even
    make up your own secret language!'
