    # To use any of the Math object methods, you''ll write a statement like this:


    ```

    ans = Math.SquareRoot(16)

    ```


    In this example, you call the SquareRoot() method and pass 16 to it (to find the
    square root of). The output, or result of a method, is called the return value.
    In this statement, the method''s return value is assigned to the ans variable.
    In this chapter, you''ll learn about the Math object''s methods and how to put
    them to work.


    # Exponent Methods


    The Math has four methods related to exponents, but we''ll cover SquareRoot()
    and Power() in this book.


    # SquareRoot() and Good Old Pythagoras


    In this first example, we''ll find the length of the longest side, or hypotenuse,
    of a right triangle. If you call the lengths of the two sides s1 and s2, the Pythagorean
    Theorem tells you the length of the hypotenuse is the square root of the sum of
    each side squared. Here''s the equation:


    √s1² + s2²


    We put this formula in the program in Listing 7-1 so you don''t have to think
    about it much. Given the two sides of a right triangle, the following program
    using the Pythagorean Theorem to calculate the length of the hypotenuse:


    ```

    1 SquareRootDemo.sb

    2 Window.Write("Enter the length of side 1: ")

    3 s1 = Window.Read(Number())

    4

    5 Window.Write("Enter the length of side 2: ")

    6 s2 = Window.Read(Number())

    7

    8 hypot = Math.SquareRoot(s1 * s1 + s2 * s2)

    9 Window.WriteLine("Hypotenuse = " + hypot)

    ```


    Listing 7-1: Finding the length of the first side


    This program prompts the user to enter the length of the first side (line 2) and
    saves the input in s1 (line 3). It then asks for the second input and saves it
    in s2 (line 6). Then it computes the length of the hypotenuse (line 8) and displays
    the result (line 9). On line 8, notice how the square of s1 (and s2) was computed
    by multiplying s1 (and s2) by itself.


    84 Chapter 7'
