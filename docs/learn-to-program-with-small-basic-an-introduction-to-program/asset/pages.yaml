    Now that you''ve defined your problem, let''s design a step-by-step solution,
    which is called an algorithm. First, let''s break down each part of the problem
    (input, processing, and output) into detailed steps.


    Get in the habit of writing an outline of the program that puts each step in order.
    This is called pseudocode because it''s not a real program, but it explains what
    the code should do. Looking at your pseudocode gives you a clear idea of the real
    code you''ll need to write for each step. For complex problems, pseudocode expresses
    your thought process in simple terms that you can then translate into real code.
