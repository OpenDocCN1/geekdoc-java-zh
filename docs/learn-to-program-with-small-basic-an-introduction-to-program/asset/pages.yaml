    # The Remainder Method


    You can get the remainder from any division operation using the Remainder() method.
    For example, Math.Remainder(10, 3) returns 1 because 10 ÷ 3 = 3 with a remainder
    of 1.

    You can use the Remainder() method to test whether one integer (whole number)
    can be divided evenly by another, smaller integer. A remainder of 0 means the
    larger number is divisible by the smaller number (such as 9 is divided by 3).
    Knowing if there''s a remainder has all sorts of interesting uses. For example,
    if you want to check whether a number is even or odd, you can examine the remainder
    of that number divided by 2: if the remainder is 0, it is even; otherwise, it''s
    odd.

    to see the Remainder() method in action, let''s write a program that finds the
    number of dollars, quarters, dimes, nickels, and pennies in a given amount of
    money. To find the most efficient quantity of dollars and coins, you''ll need
    to start with the largest denomination (dollars) and work your way down to the
    smallest one (pennies). Listing 7-3 shows the complete program. Read through the
    program, and see if you can figure out what the output is when the input is 25.36.


    ```

    1 Money.sb

    2 TextWindow.Write("Enter an amount of money (such as 25.36): ")

    3 total = TextWindow.ReadLine() '' In dollars and cents

    4 cents = Math.Floor(total * 100) '' Total cents = 2536

    5 dollars = Math.Floor(cents / 100) '' Number of dollars = 25

    6 cents = Math.Remainder(cents, 100) '' Remaining cents = 36

    7 quarters = Math.Floor(cents / 25) '' Number of quarters = 1

    8 cents = Math.Remainder(cents, 25) '' Remaining cents = 11

    9 dimes = Math.Floor(cents / 10) '' Number of dimes = 1

    10 cents = Math.Remainder(cents, 10) '' Remaining cents = 1

    11 nickels = Math.Remainder(cents, 5) '' Number of nickels = 0

    12 pennies = Math.Remainder(cents, 5) '' Number of pennies = 1

    13 TextWindow.Write("$ " + total + ",")

    14 TextWindow.Write("$ " + dollars + ",")

    15 TextWindow.Write(\(quarters + " Q,") ")

    16 TextWindow.Write(\(dimes + " D,") ")

    17 TextWindow.Write(\(nickels + " N,") ")

    18 TextWindow.Write(\(pennies + " P.") ")

    19 TextWindow.WriteLine("")

    ```


    Listing 7-3: Finding dollar and coin denominations


