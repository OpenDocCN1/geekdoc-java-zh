  md: '# Getting Started with Indexed Arrays


    Let''s say you want to write a program that takes four scores from a user and
    then displays them with their average value. Based on what you''ve learned so
    far, you might write a program like the one in Listing 15-1:


    ```

    1 Average.sb

    2 TextWindow.Write("Enter 4 scores. <Enter> after each score.")

    3 TextWindow.WriteLine(TextWindow.ReadNumber()) // Reads the 1st score

    4 s1 = TextWindow.ReadNumber() // Reads the 2nd score

    5 s2 = TextWindow.ReadNumber() // Reads the 3rd score

    6 s3 = TextWindow.ReadNumber() // Reads the 4th score

    7 s4 = TextWindow.ReadNumber() // Reads the 4th score

    8 avg = (s1 + s2 + s3 + s4) / 4 // Calculates the average

    9 TextWindow.Write("Number: " + s1 + " " + s2 + " " + s3 + " " + s4 + " ")

    10 TextWindow.WriteLine(TextWindow.ReadNumber())

    11 TextWindow.WriteLine("Average: " + avg)

    ```


    Listing 15-1: Storing scores in variables


    This program prompts you to enter four scores (2–3). It reads these scores and
    saves them in the four variables s1, s2, s3, and s4 (lines 4–7). Then it computes
    the average (line 8), displays the four numbers on a single line (lines 9–10),
    and displays the computed average (line 11).


    Imagine you want to input 100 scores instead of 4. Defining 100 variables and
    copying almost the same statement 100 times would take a long time. Well, Small
    Basic''s arrays store a collection of values. Using an array, you don''t have
    to create each variable separately. You can put all the values into one array
    variable. For example, you can read 10 scores each and store them in one array
    using this loop:


    ```

    For N = 1 To 10

    score[N] = TextWindow.ReadNumber()

    EndFor

    TextWindow.WriteLine(score)

    ```


    Instead of 10 variables, s1, s2, and so on to, you create one array called score.
    To refer to each piece of data in the array, use the syntax score[N], where N
    is a variable that will take on the values 1 through 100. Writing score[N] is
    like writing score[1], score[2], ..., score[10], and the for loop increments N.


    Run this code. After you enter 10 different numbers, Small Basic displays the
    score array, and you can see all 10 values stored in (it''ll show you a better
    way to display an array later in this chapter).


    One way to think of an array is as a collection of variables that share the same
    name. For example, the average rainfall in the 10 largest US cities could be saved
    in rainlevel[1] through rainlevel[10], and the daily sales for the 100 McDonalds
    in your area could be saved in sales[1] through sales[100]. Think of all the Happy
    Meals!'
