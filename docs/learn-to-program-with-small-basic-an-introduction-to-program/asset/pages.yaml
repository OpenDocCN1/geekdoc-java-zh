    # Initializing Arrays


    You can access indexed arrays using an integer index. The power of indexed arrays
    is that you can access their elements using a loop. In this section, we''ll show
    you how to initialize indexed arrays, display them, and perform some common operations
    on them, such as finding their maximum element, their sum, their average, and
    so on.


    Let''s say you want to create an array that holds four scores (not the Abe Lincoln
    type). Here''s the common way to do this:


    ```

    score[1] = 80

    score[2] = 85

    score[3] = 90

    score[4] = 95

    ```


    You can also use a string initializer to set the four values in just one line
    like:


    ```

