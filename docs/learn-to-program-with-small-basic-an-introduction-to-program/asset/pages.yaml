    treasure or if you fall in the water where the hungry sharks are waiting! Don''t
    think of Jaws while you''re playing this game! (Sorry, that probably didn''t help.)


    Because you have the treasure map in your hands, you should be able to guess your
    location. For example, let''s say you''re in a forest and when you clicked the
    S button to go south, the game tells you you''re next to a volcano. Looking at
    the map, you can figure out that the treasure is just two blocks east.


    The following sections will guide you step by step to show you how to put this
