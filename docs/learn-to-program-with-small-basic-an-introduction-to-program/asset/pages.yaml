  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    Then click the New button to open a new Editor window, and follow these steps:


    +   Type the program in Listing 1-1 into the Editor. You''ll need to type it exactly
    as you see it.


    '' Greetings.sb

    TextWindow.WriteLine("Greetings, Planet!")


    Listing 1-1: Your first program


    When you type in a listing to try out, don''t type the line numbers at the left!
    These numbers are just for reference; they make the code easier to read. You''ll
    see them in your Editor, too; but they aren''t part of your code.


    +   Click the Save button on the Toolbar (or press CTRL-S), browse to the Small
    Basic folder you made, and save your program as Greetings.sb.


    +   Run on the Toolbar. If you didn''t make any typing mistakes, you''ll see an
    output window like the one in Figure 1-3.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_20_0.png)


    Figure 1-3: the output of the Greetings.sb program


    When you run this program, your window will have a black background; that is the
    default background color for the text window. The images in this book were created
    with a white background to make it easier for you to read them.


    Even though it''s short, this is a complete Small Basic program! But what does
    each piece of the program do? Let''s dissect it.


    # Objects and Methods


    The window in Figure 1-4 is the text window, and it can only display text. You
    told Small Basic to bring up the text window using TextWindow, one of many objects
    in the Small Basic library. You can think of an object as a little toolbox for
    a specific job, such as doing math problems, defining words, or drawing pictures.


    Objects in Small Basic can perform predefined tasks, called methods. Methods are
    like the tools in your object toolbox. To get methods to do something, you have
    to give them one or more values to act on. Each value is called an argument.'
  merge: -1
