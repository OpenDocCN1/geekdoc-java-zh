    # File Management


    In addition to the methods that let you perform I/O, the File object also provides
    a couple of methods related to file and directory management. Using these methods,
    you can copy and delete files, create and delete directories, and list files and
    directories from your program.


    # Copying and Deleting Files


    You can use the CopyFile() method to create a copy of an existing file. The method
    takes the path names of the source file and the destination file as arguments.
    If the operation is successful, the method returns "SUCCESS". Otherwise, it returns
    "FAILED", the method


    If the destination path points to a location that doesn''t exist, the method attempts
    to create it automatically. For example, look at the following code:


    ```

    srcPath = "C:\Temp\Test1.txt"          # Path of the source file

    dstPath = "C:\Temp\Temp2\Test1.txt" # Path of the destination file

    File.CopyFile(srcPath, dstPath);

    ```


    If the folders Temp, Temp1 don''t exist, CopyFile() attempts to create all the
    directories in the destination path, beginning with the root. When you run this
    code, you will have two copies of the Test1.txt file: the original source file
    and the duplicate file under C:\Temp\Temp2.


    If the destination path points to an existing file, the CopyFile() method will
    be useful because you might overwrite your own files!


    If you want to delete a file, use the DeleteFile() method. This method takes one
    argument: the path name of the file you want to delete. If the operation is successful,
    the method returns "SUCCESS". Otherwise, it returns "FAILED".'
