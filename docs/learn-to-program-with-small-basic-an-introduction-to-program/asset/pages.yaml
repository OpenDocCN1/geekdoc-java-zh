    # Taking Strings Apart: Substrings


    Just as you can join strings to create larger ones, you can also separate strings
    into smaller strings, which are called substrings. A substring is just a portion
    of a larger string. The Text object has six methods that let you work with substrings.
    Let''s look at these methods.


    # The IsSubText() Method


    You can use IsSubText() to find out one string is part of another. This method
    takes two arguments: the string you want to search through and the substring you
    want to search for. It returns True or False depending on whether or not the substring
    is in the source string. Here are some examples:


    ```

    myString = "The quick brown fox"

    res = Text.IsSubText(myString, "brown") res = "True"

    res = Text.IsSubText(myString, "BROWN") res = "False"

    res = Text.IsSubText(myString, "dog") res = "False"

    ```


    As the example shows, IsSubText() is case sensitive when searching for substrings.
    This is why searching for "BROWN" in the third statement returns "False".


    # The EndsWith() Method


    Use EndsWith() to find out if a string ends with a given substring. Here are some
    examples:


    ```

    myString = "The quick brown fox"

    res = Text.EndsWith(myString, "fox") res = "True"

    res = Text.EndsWith(myString, "x") res = "True"

    res = Text.EndsWith(myString, "FOX") res = "False"

    res = Text.EndsWith(myString, "dog") res = "False"

    ```


    Again, the string''s case matters: the search for "FOX" returns "False".


    # The StartsWith() Method


    Use StartsWith() to find out if a string starts with a given substring. Here are
    some examples:


    ```

    myString = "The quick brown fox"

    res = Text.StartsWith(myString, "The") res = "True"

    res = Text.StartsWith(myString, "T") res = "True"

    res = Text.StartsWith(myString, "the") res = "False"

    ```


    Similarly, the search for "the" in the fourth statement returns "False".


