    # Using Spaces for Readability


    Add tabs and spaces to make your expressions more readable. For example, look
    at these two expressions:


    ```

    x=y+10*(x-3)-z

    x = y + 10 * (x - 3) - z

    ```


    They''re the same as Small Basic, but the spaces in the second line make it easier
    for humans (and other nonrobots) to read.


    # TRY IT OUT 4-1


    The following program finds the average of the weekly hours you spend on work
    for two classes. First, identify all the variables in this program. What does
    this program display when you run it? Try out!


    ```

    mathHours = 8

    scienceHours = 6

    avHours = (mathHours + scienceHours) / 2

    TextWindow.write("I spend " + mathHours)

    TextWindow.write(" hours a week on homework and " + scienceHours)

    TextWindow.WriteLine("hours a week on science homework.")

    TextWindow.write("The average of " + mathHours + " and " + ")")

    TextWindow.WriteLine(scienceHours + " is " + avgHours + ".")

    ```


    Now swap in the actual weekly hours you spend on two classes. How do you spend
    on homework? Show the results to your parents—it might be a good primer before
    you discuss your report card!


    # Rules for Naming Variables


    The names you give to variables are called identifiers. Variable names can include
    letters (lowercase and uppercase), digits (0 to 9), and underscore characters
    (_). You can name variables anything, as long as you follow a few rules:


    +   1 The name must start with a letter or underscore. It can''t start with a
    number.

    2 Don''t use any of Small Basic''s keywords, like If, Else, Then, And, or While.
    These keywords have special meanings, and they can''t be used for anything else.
    You''ll learn more about them later in this book.


    Using Variables 47'
