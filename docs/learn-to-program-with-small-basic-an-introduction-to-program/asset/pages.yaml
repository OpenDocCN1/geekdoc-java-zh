  md: '# Step 1: The Design Phase


    In this program, a user enters their first and name in the text boxes and then
    clicks the Show Message button. If their first name is Alpaca and their last name
    is Bag, the program shows a message like this (in the multiline text box):


    Hello there, Alpaca Bag!


    Start Small Basic and enter the following two lines:


    ```

    GraphicsWindow.DrawText(20, 20, "First name:") '' Label

    fnText = Controls.AddTextBox(100, 20) '' First name box

    ```


    The first statement draws the text First name: at position (20, 20). In the second
    segment, the controls object creates a text box with its upper-left corner at
    (10, 20). The box''s identifier is saved in the variable fnText (first-name text
    box). You''ll need this identifier when you want to know what the user entered
    in this text box.


    Click Run, and you''ll see the First name: label and a text box placed to its
    right. The size of the text box is about 160×20 (the default size).\Next, add
    the following two lines to create the Last name: label and associated text box.


    ```

    GraphicsWindow.DrawText(20, 60, "last name:") '' Label

    lnText = Controls.AddTextBox(100, 60) '' Last name box

    ```


    Here, the box''s identifier is saved in lnText (last-name text box). Click Run
    again, and you will see the first and last name text boxes perfectly aligned in
    the graphics window.

    Now you''ll create the Show Message button by calling the Controls object''s AddButton()
    method:


    ```

    showBtn = Controls.AddButton("Show Message", 280, 20) '' Button

    ```


    The first argument of AddButton is the button''s caption, "Show Message". The
    second and the third arguments tell the Controls object where the upper-left corner
    of the button should be. The button''s identifier is saved in showBtn. Run to
    see what you''ve created. By default, the button''s width will be as wide as its
    label. Try lengthening or shortening the button, and run the program to see what
    happens.

    Next, you need to add the GUI element—the box that shows the output message. Because
    you can get the user with a long message if you want to, let''s use a multiline
    text box. The multiline text box has horizontal and vertical scroll bars that
    appear automatically if needed, like Harry Potter''s Room of Requirement. To create
    AddMultilineTextBox()


    ```

    msgText = Controls.MultilineTextBox(100, 100) '' Message text box

    ```'
