  md: '# 13


    # REPEATING FOR LOOPS


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_194_0.png)


    Have you ever noticed that no matter how times you take out the trash, clean dirty
    dishes, and do laundry, you always have to do it again? What if you only had to
    do each task once, and then you created a robot version of yourself to do it every
    time after that?


    In the Small Basic universe, automating repetitive tasks is a breeze. You only
    have to write code for a repetitive task once, and then you can use a loop to
    repeat that task as many times as you need.


    Small Basic uses two types of loop statements: For loops and While loops. In this
    chapter, you''ll learn about For loops, explore nested For in depth, and create
    some programs that take advantage of your computer''s passion for repetition.
    You''ll learn how to use For loops in a wide range of practical applications.
    Let''s get loopy!'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# The For Loop


    Let''s say you want to make a program that displays the multiplication table for
    nine: 1 x 9, 2 x 9, 3 x 9, through 10 x 9. Your first attempt might look like
    this:


    ```

    TextWindow.WriteLine("1 x 9 = " + (1 * 9))\nTextWindow.WriteLine("2 x 9 = " +
    (2 * 9))\nTextWindow.WriteLine("3 x 9 = " + (3 * 9))\nTextWindow.WriteLine("4
    x 9 = " + (3 * 9))\nTextWindow.WriteLine("5 x 9 = " + (3 * 9))\nTextWindow.WriteLine("6
    x 9 = " + (3 * 9))\nTextWindow.WriteLine("7 x 9 = " + (3 * 9))\nTextWindow.WriteLine("8
    x 9 = " + (3 * 9))\nTextWindow.WriteLine("9 x 9 = " + (3 * 9))\nTextWindow.WriteLine("10
    x 9 = " + (3 * 9))

    ```


    Phew! Look at that wall-of-code! Although Small Basic lets you easily copy and
    paste pasted statements, this program repeats a lot of code. If you want to display
    the multiplication table up to 100 or 1000? Clearly, this isn''t the best way
    to write your program. Here''s a version of this program that uses a For loop
    to get the result:


    ```

    For N = 1 To 10\nTextWindow.WriteLine(N + " x N = " + (N * N))\nFor

    ```


    Run this program and check what happens. Wasn''t that easier than writing out
    every line? Now you''ve seen the power of loops!\nThe loop runs the same statement
    with a different value of N each time. First, the code sets the value of N to
    1, which is the value we want to start creating the multiplication table from.
    Next, it runs all the statements between the For and EndFor keywords. In this
    case, it runs the WriteLine() method, replacing N with its current value. This
    is called an iteration of the loop.\nThen it sets N to 2. The value of N is compared
    with the ending value (or terminal value) of the loop, which is 10 in this. If
    N is less than 10, the statements in the body of the For loop run again, completing
    another iteration of the loop. Note that the For loop automatically increases
    N by 1 during each iteration.


    process continues, using N = 3,

    then N = 4, all the way to N = 10.

    After the program runs the tenth iteration, it moves to the statement after the
    EndFor keyword (if there is one), and the loop is complete.

    Now you''ve seen a basic For loop in action, look at the syntax in Figure 13-1.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_195_0.png)'
