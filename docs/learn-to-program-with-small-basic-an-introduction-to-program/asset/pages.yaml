    Subroutines are basic building blocks for creating large programs (see Figure
    10-1). In this chapter, you''ll delve into the wild world of subroutines, learn
    how to move data in and out of them, and use them to build large programs and
    fun games!


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_143_0.png)


    Figure 10-1: How subroutines are like the building blocks of larger programs


    # # Why Use Subroutines?


    Let''s say you run a construction company. Your job is to coordinate the work
    among your contractors and build houses. As a manager, you don''t have to know
    all the nitty-gritty details of building a home: the plumber handles the plumbing,
    the roofer shingles the roof, and the electrician runs all the wires. As the boss,
    your job is to call the contractors at the right times and tell them to start
    their work. Each contractor knows their job and is always ready to work when you
    receive your call.


    That''s very similar to how subroutines work! Each subroutine has its own name,
    like the plumber is Mario. Each subroutine does something different, just like
    the plumber and the roofer differ jobs, but all are needed to build the house.
    As the programmer, you''re the manager, and your job is to solve problems as you
    build your program. You call your contractors (that is, your subroutines) and
    let them know when you need them to. Start writing your program by typing statements
    in the editor. When you need to perform a job that subroutine handles, you just
    call that subroutine and wait. When the subroutine completes its task, you move
    on the next step in your program.


    There''s nothing new about this call-and-wait strategy; you''ve been doing since
    Chapter 1. When you call an object''s method, you''re actually giving the work
    to that object in the Small Basic library. Subroutines are like methods, but you
    have to write all the statements in them. Subroutines help organize your thinking
    process and make it easier to fix errors.


    # # Writing Subroutines


    Let''s use a example to learn how to write a subroutine: in his travels, Gulliver
    danced with the king and queen of Lillip (the land of tiny people). During dinner,
    the king explained that he was 8.5 glum-gluffs tall. Gulliver later learned that
    1 glum-gluff is about 0.75 inches. To find out how the sizes of items in Lillip
    compare to sizes in our land, write the program in Listing-101, which converts
    glum-gluffs to inches:


    +   1 GlumGluff.sb

    2 TextWindow.Write("How many glum-gluffs?")'
