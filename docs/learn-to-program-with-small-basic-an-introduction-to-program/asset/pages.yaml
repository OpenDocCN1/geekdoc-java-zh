    To move the star to a random position, you''ll first need to translate the (X0,
    Y0) grid units (where your user sees them on the grid image) into (xPos, yPos)
    pixel units (with Small Basic needs). Let''s do that.


    If the star''s x-coordinate is -11, you will need to draw the star at horizontal
