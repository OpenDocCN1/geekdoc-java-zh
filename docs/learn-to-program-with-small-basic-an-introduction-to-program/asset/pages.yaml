    6 GraphicsWindow.TextInput = OnTextInput

    7

    8 Sub OnTextInput

    9 Sound.PlayClick() '' Plays a typewriter sound effect

    10 If (GraphicsWindow.LastKey = "Return") Then

    11 x = 0                        '' Moves to next line

    ```


