  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    Today, most programs use a graphical interface, or GUI (pronounced "gooey", but
    dont worry (it''s not sticky). GUIs can have menus, buttons, text boxes, and more.


    One example is the Calculator shown in Figure 12-1. When a user clicks one of
    the number buttons in the program, what number appears in the box at the top of
    the window. And when the user clicks the = button, the program computes the result
    of the math operation and displays it.


    In this chapter, you''ll learn about the Controls object, which lets you create
    graphical interfaces for your programs and games.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_179_0.png)


    # Design a User Interface: The Controls


    Let''s start with a simple program that lets users enter their first and last
    name, and then the program greets them by name with a friendly message. Figure
    12-2 shows FirstGUIApp.sb, the GUI you''ll create. The gridlines and coordinates
    in the figure aren''t part of the output, but they''re included to illustrate
    the x- and y-coordinates of the interface''s different components.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_179_1.png)


    Figure 12-2: The FirstGUIApp.sb program''s user interface


