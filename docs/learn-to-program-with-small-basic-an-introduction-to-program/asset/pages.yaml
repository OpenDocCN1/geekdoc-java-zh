- pgno: 110
  md: '# MAKING DECISIONS WITH

    IF STATEMENTS


    Which shirt should I wear? What should I have for dinner? Where should I go? Should
    I wear my pants so low that my underwear shows? You ask yourself questions like
    these and answer them every day. Just as you make decisions, your programs can
    too! Of course, they won''t do this on their own. Your programs only make the
    comparisons you want to make, and then they run some statements or skip them.
    In this chapter, you''ll write programs that can make decisions.


    The programs you''ve written so far followed a simple path where the statements
    execute from top to bottom. But sometimes you might need to run some statements
    if a condition''s true or other statements if a condition''s false. This is similar
    to how you make decisions in your life. For example, you might say, "If there''s
    snow, then I''ll go skiing" or "If I finish my work before 4:00 P.M., I''ll go
    to the movies; otherwise, I''ll just go to Steve''s house." In both cases, the
    action you take depends on a *condition.*


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Majid and
    Ed Price

    Small Basic uses a few different ways to control which statements run in a program:
    selection statements (If, If/Else, If/ElseIf), jump statements (Goto), and iteration
    or loop statements (For and While). In this chapter and the next, we''ll explain
    selection and jump statements, and we will explain loops in Chapters 13 and 14.
    In this chapter, you''ll learn about relational operators, Boolean expressions,
    and how you can use If/Else statements to write some interesting programs.


    # # The If Statement


    Suppose your mom calls and tells you, "On your way home, stop at Captain Snarf''s
    Pizza. If it''s open, get a large pizza." Her instructions don''t say what to
    do if the place is closed; you won''t just go empty-handed. Listing 8-1 represents
    this in code:


    ```

    '' SnarfPizza.sb

    2 TextWindow.WriteLine(\Is Snarf''s Pizza open?")

    3 TextWindow.Write("Enter 1 (for open) or 2 (for closed): ")

    4 status = TextWindow.ReadNumber()

    5

    6 If (status = 1) Then

    7 TextWindow.WriteLine("You bought a delicious pizza!")

    8 Endif

    9 TextWindow.WriteLine("time to go home!")

    ```


    Listing 8-1: Using If and Endif keywords


    Run this program and enter 1 in response to the prompt (to indicate that Snarf''s
    is open). Because the condition on line 6 is true, the program prints the message
    on line 7, which is "You bought a pizza!" The statement on line 9 (which comes
    after the Endif keyword) runs whether you buy a pizza or not. Run this code again,
    but this time 2 in response to the prompt. What happens?

    The statement on line 6 is an If statement. The statement of the statement after
    the If keyword (status = 1) is the condition. The program checks to see whether
    the condition''s true. In this case, it checks Captain Snarf''s Pizza is open.
    Between the Then and the Endif keywords is the action—what the program does. The
    program does the action if the condition''s true. Programmers usually use the
    term code block to refer to the statements between the If and the Endif keywords
    (6–8).


    > Small Basic doesn''t require you to place parentheses around conditional expressions,
    meaning you can write the statement on line 6 like this: If status = 1 Then. But
    parentheses make the statement easier to read, so we''ll use them in this book.


    98 Chapter 8'
