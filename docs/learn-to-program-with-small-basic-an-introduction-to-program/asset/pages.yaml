  md: '# # GROUPING DATA IN\NONE-DIMENSIONAL ARRAYS


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_220_0.png)


    So far you''ve worked with variables to store single pieces of information, and
    you''ve created some pretty awesome programs. But you can create even more amazing
    programs by storing lots of information in a single variable! In Small Basic,
    you do that by using an array.


    An array is a built-in data type in that lets you work with groups of data. For
    example, you wouldn''t build a separate closet for every pair of shoes (unless
    you''re a giant who loves shoe shopping); you''d put them all in one closet. Arrays
    let you store many pieces of data together to make it easier to work with all
    at once.


    Small Basic has two types of arrays: indexed arrays and associative arrays. The
    pieces of data in an indexed array are referenced using an integer index, such
    as score[1], name[3], and so on. The elements of an associative array are referenced
    using a string index, such as price["apple"] or address["John"]. This chapter
    explores indexed arrays. We''ll cover associative arrays, also called hashes or
    maps, in the next chapter.'
