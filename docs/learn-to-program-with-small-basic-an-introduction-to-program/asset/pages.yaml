  md: '# GraphicsWindow Events


    Let''s start by exploring the events in GraphicsWindow. When a user interacts
    with your application, the graphics window knows when keys are pressed, which
    keys are pressed, and if the user clicks or moves the mouse. The graphics window
    knows about these events, it doesn''t automatically do anything when these events
    happen. You need to tell you when these events happen so you can use them. Next,
    you''ll learn how to use the information Small Basic knows about the user to create
    interesting, interactive applications.


    # Create Patterns with the MouseDown Event


    Let''s make a simple application that draws a randomly colored circle every time
    the user clicks the graphics window. Enter the code in Listing 11-1:


    ```

    Circles.sb

    GraphicsWindow.MouseDown = OnMouseDown

    Sub OnMouseDown

    GraphicsWindow.PenColor = GraphicsWindow.GetRandomColor()

    XO = GraphicsWindow.MouseX - 10

    YO = GraphicsWindow.MouseY - 10

    GraphicsWindow.DrawEllipse(XO, YO, 20, 20)

    EndSub

    ```


    Listing 11-1: Drawing circles with a click of the mouse


    Run the program. A sample output is shown in Figure 11-3. When you click inside
    the graphics window, you draw a circle with a random color. Make a fun pattern,
    show it to someone else, and try to convince them that Pablo Picasso painted it!


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_164_0.png)


    Figure 11-3: Sample output of the Circles.sb program


