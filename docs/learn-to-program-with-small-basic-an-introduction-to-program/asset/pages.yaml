    working with very long arrays.


    # Does It Have a Particular Value?


    The Array object also offers a method that checks whether array contains a certain
    value. Run the program in Listing 16-7 to discover how the ContainsValue() method
    works:


    ```

    1 ContainsValue.sb

    2 age["Homer"] = 18

    3 age["Marge"] = 17

    4 score = 90

    5 ans1 = Array.ContainsValue(age, 18)   Returns True

    6 ans2 = Array.ContainsValue(age, 20)   Returns False

    7 ans3 = Array.ContainsValue(score, 90)   Returns True

    8 Window.WriteLine(ans1 + " , " + ans2 + " , " + ans3)

    ```


    Listing 16-7: Demonstrating the ContainsValue() method


    The ContainsValue() method returns True or False depending on whether the value
    exists in the array.


    > Unlike the ContainsIndex() method, the ContainsValue() method is case sensitive.
    So it is best to be consistent with your casing!


    # Give Me All the Indices


    Another useful method of the Array object is GetAllIndices(). This method returns
