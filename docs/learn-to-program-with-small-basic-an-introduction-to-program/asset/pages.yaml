    Arrays can help you organize your data in a way that makes the data much easier
    to change and use. The name of an array follows the same rules and guidelines
    you use for naming variables.


    # # Array Basics


    Each piece of information in an array is called an *element*. To access an element
    in an array, you use this syntax:


    ```

    array[index]

    ```


    The *array* variable is the array''s name, and *index* is an identifier, either
    a number or a string, that identifies an element in the array (see Figure 15-1).
    This syntax is known as an *indexed variable*, or a subscribed variable. The index,
    which is placed between square brackets, uniquely identifies one element in the
    array.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_222_0.png)


    Figure 15-1: Graphical representation of a one-dimensional array


    You can treat an indexed variable just like a regular variable by using the proper
    syntax. For example, the following statements initialize and display the first
    three elements of the score array in Figure 15-1:


    ```

    score[1] = 80

    score[2] = 85

    score[3] = 90

    Text.WriteLine(score[1] + " " + score[2] + " " " + score[3]);

    ```


    If you run this code, you''ll see this output:


    ```

    80, 85, 90

    ```


    If you wanted to change the first score, you could write this statement:


    ```

    score[1] = score[1] + 5

    ```


