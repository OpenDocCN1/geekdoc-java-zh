  md: "# Relational Operators\n\nThe condition (status = 1) in Listing 8-1 tests whether\
    \ the variable status is equal to 1. We call the sign here a relational operator\
    \ (or a comparison operator) because it tests the relationship between two values\
    \ (or expressions). Small Basic supports five other relational operators that\
    \ you can use in conditions. Table 8-1 shows these relational operators.\n\n#\
    \ Table 8-1: Relational Operators in Small Basic\n\n| Operator | Meaning | Symbol\
    \ used in algebra |\n| --- | --- | --- |\n| = | Equal to | = |\n| < | Less than\
    \ | < |\n| <= | Less than or equal to | <= |\n| > | Greater than | > |\n| >= |\
    \ Greater than or equal to | ≥ |\n| <> | Not equal to | ≠ |\n\nLet's look at a\
    \ couple of examples to see how these operators work. A cute princess wants a\
    \ handsome prince. She hires you to write an application form that potential husbands\
    \ will fill out. One of your requirements is that the prince must be at least\
    \ 21 years old. How would you check this condition in your program?\nWell, that\
    \ is, You can write something like this:\n\n```\nTextWindow.Write(\"How old are\
    \ you ?\")\nage = TextWindow.ReadNumber()\n```\n\n```\nIf (age < 21) Then\n  \
    \  TextWindow.WriteLine(\"Sorry! You're not old enough!\")\nEndIf\n```\n\n> The\
    \ If condition checks if age is less than 21. If it is, the applicant isn't enough,\
    \ and his dream to marry the princess is over. Nice try, little prince! Another\
    \ way to check the applicant's age is like this:\n\n```\nIf (age >= 21) Then\n\
    \    TextWindow.WriteLine(\"So far so good. You may have a chance!\")\nEndIf\n\
    ```\n\nThe If condition checks if age is greater than or equal to 21. If it's\
    \ true, the applicant passes this condition and still has a chance to marry the\
    \ princess.\nBut if the princess also requested that the applicant be exactly\
    \ 6-feet tall? Don't ask why! You can write something like this:\n\n```\nTextWindow.Write(\"\
    What is your height (in feet)?\")nheight = TextWindow.ReadNumber()\n```"
