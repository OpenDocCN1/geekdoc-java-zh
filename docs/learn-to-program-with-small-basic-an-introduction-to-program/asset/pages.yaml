    # # Introducing Yourself to Your Computer


    A program can also accept user input in the form of text, strings. Let''s imagine
    we want to greet the player with their name. We''ll store the player''s name in
    a variable called userName but use a new TextBox method called Read(). Running
    the following program, and enter name when you see the cursor:


    ```

    userName = TextBox.Read()

    TextBox.Write("Hello " + userName + ".")

    TextBox.WriteLine("It''s really nice to meet you.")

    ```


    The first statement accepts the user entered in the window and stores that text
    in userName. The program then greets the user with their name.

    So what''s the difference between Read() and ReadNumber()? Read() works exactly
    like ReadNumber(): both show a flashing cursor and wait for the user to input
    and press ENTER. In fact, you can use Read() to get numbers from a user. But ReadNumber()
    will accept only a number from a user, so we recommend you use it when you need
    the user to enter a number.


    # # Writing Prompts for Input


    A flashing cursor doesn''t tell your user what kind of data to input (like a number,
    a name, an address, or favorite type of monkey). Unless your program is written
    for a magician or a mind reader like Professor X, you should provide some instructions
    before you allow your program to accept input from Read() or ReadNumber(). To
    do this, you''ll display a prompt, which is a message that tells the user what
    kind of data to enter.

    From List 6-1, replace line 2 with these two lines:


    ```

    TextBox.Write("Please enter a radius, then press <Enter>")

    radius = TextBox.ReadNumber()

    ```


    First we call Write() and pass a message to display. In this program, the message
    you pass a prompt telling the user to enter a value for the radius and then press
    ENTER. You end the prompt the user''s waiting for keyboard input. You don''t need
    the colon, but it''s clearer to tell your user. ) Use Write() instead of WriteLine()
    to keep the cursor on the same line as the prompt. After you call Write(), you
    call ReadNumber() to accept the number input by the user and store it in the variable
    radius.


    After adding these two statements, run your program to see something like Figure
    6-2.


