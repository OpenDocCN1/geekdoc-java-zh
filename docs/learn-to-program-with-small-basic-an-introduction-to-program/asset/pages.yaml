- pgno: 170
  md: '# Useful Tips


    Before moving on, we''ll give you some tips for dealing with events and event
    handlers.


    You can handle multiple events using the same subroutine. For example, look at
    these statements:


    ```

    GraphicsWindow.MouseDown = OnMouseEvent

    GraphicsWindow.MouseMove = OnMouseEvent

    ```


    These statements cause the MouseDown and MouseMove events to call the OnMouseEvent
    subroutine. This feature can come in handy for complex games that use many events,
    so keep this feature in mind.


    You can change the event-handler subroutine after you register it. For example,
    let''s say you registered the OnMouseDown subroutine to handle the MouseDown event
    using this statement:


    ```

    GraphicsWindow.MouseDown = OnMouseDown

    ```


    If you later decide to stop responding to the MouseDown event (for example, because
    the game is over), you can write this statement:


    ```

    GraphicsWindow.MouseDown = DoNothing

    ```


    DoNothing is the new handler for the MouseDown event. If you don''t write any
    statements in your DoNothing subroutine, your programs won''t do anything in response
    to the MouseDown event.


    A MouseDown event is usually followed by a MouseUp event, but doesn''t count on
    that MouseUp event happening. If you click the left mouse button in the graphics
    window and move the cursor outside the graphics window before you release the
    button, your application receives only aDown event notification. This is important
    to remember if you write an application that needs to pair the two events (such
    as if you click to grab a ball and release to throw it).


    In the next section, you''ll put into practice what you''ve learned so far by
    creating a complete game. You''ll also learn about the Timer object and its event.
    Get ready for an exciting adventure in computer gaming!


    # Make a Gold Rush Game


    Let''s create a simple game in which a player uses the arrow keys to move a turtle
    to collect as many bags of gold as possible (see Figure 11-8). The bag of gold
    appears at random locations on the grid. If the player doesn''t grab the bag in
    2 seconds, it moves elsewhere. Let''s see how fast you can get the turtle to move!'
