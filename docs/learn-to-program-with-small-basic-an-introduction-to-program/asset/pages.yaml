    # The Array Object


    The Array object in the Small Basic library can help you find important information
    about the arrays in your programs. In this section, we''ll explore this object
    in detail and look at some examples on how to use it. To explore the Array object,
    let''s start by typing the following code:


    ```

    name = "Bart"

    age["Homer"] = 18

    marge["Marge"] = 17

    score[1] = 90

    '' An ordinary variable

    '' An associative array with two elements

    '' An indexed array with one element

    ```


    This code defines an ordinary variable called name, an associative array that
    has two elements, and an indexed array called score that has one element. You''ll
    use these arrays in the examples that follow. What can the Array object tell you?
    Let''s find out!


    # Is It an Array?


    Do you think Small Basic knows that name is an ordinary variable and that score
    are arrays? Run the program in Listing 16-4 to find out:


    ```

    1 IsArray.sb

    2 name = "Bart"

    3 age["Homer"] = 18

    4 age["Marge"] = 17

    5 score[1] = 90

    6 ans1 = Array.IsArray(name) '' Returns False

    7 ans2 = Array.IsArray(age) '' Returns True

    8 ans3 = Array.IsArray(score) '' Returns True

    9 TextWindow.WriteLine(ans1 + ", " + ans2 + ", " + ans3)

    ```


    Listing 16-4: Demonstrating the IsArray() method


    232 Chapter 16'
