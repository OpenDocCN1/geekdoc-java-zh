  md: '# 18


    # ADVANCED TEXT MAGIC


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_276_0.png)


    Although pictures of blue skies and green fields are prettier to look at than
    a screen full of words, many useful programs, as Facebook, Twitter, and Words
    with Friends, work with text. That''s why Small Basic provides the Text object
    for working with text. In this chapter, you''ll learn how to use the Text object
    to find the length of a string, extract a small portion of a string, and perform
    many other advanced string-processing tasks. You''ll also write your own string
    processing subroutines and apply what you learn to create some interesting applications,
    like a pig latin translator and a world scramble game!


    # The Text Object


    You''ve been working with strings throughout this book. To recap, a string is
    a sequence of characters that is enclosed between double quotes, such as "stringY
    stringGy stringring stString." These characters can include letters'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    (both uppercase and lowercase), digits (0 to 9), and other symbols on your keyboard
    (as +, -, &, @, and so on). You can use strings in programs to store names, addresses,
    phone numbers, book titles, names of Star Trek episodes, and more. The Text object
    contains many useful methods for working with strings.


    Figure 18-1 shows the complete list of the Text object''s methods. We have divided
    these methods into four groups that we''ll discuss in the following sections.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_277_0.png)


    # Appending Strings and Getting Their Length


    Combining strings and finding their length is a common task in programming. Let''s
    look at how the Text object can help you out.


    # Appending Strings


    The Append() method can join (or append) two strings together, as shown in the
    following example:


    ```

    str = Text.Append("He-", "Man")

    TextWindow.WriteLine(str) Displays: He-Man

    ```


    268 Chapter 18'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    Earlier in the book you learned how to join strings using the sign +. The Append()
    method is useful when you want to add text that the sign treats as numbers, as
    in the following example:


    ```

    res = Text.Append("1", "s")   Output: 15 (1 followed by 5)

    TextWindow.WriteLine("1" + "s")   Output: 6

    ```


    The first statement appends the two strings to the result in the variable res
    (short for result). The output of the second statement shows that the string "s"
    was appended to the string "1", resulting in a new string "15". The third statement
    shows that you can''t do concatenation using the + sign. The + operator interprets
    its operands as numbers (1 and 5) and adds these numbers together, which is why
    the third statement displays 6.


    Using Append() is the only way to concatenate strings in Small Basic.


    # Getting the Length of a String


    The number of characters in a string makes its length. To find the length of a
    string, you can use GetLength() method, as in the following example:


    ```

    res = Text.GetLength("")      res = 0 (empty string)

    res = Text.GetLength("Careless Bears")   res = 14 (the space counts!)

    res = Text.GetLength("1023")           res = 4

    res = Text.GetLength(-101.5)         res = 6

    ```


    GetLength() treats its argument as a string and returns the number of characters
    in that string. Line 1 shows that the string "Careless Bears" has zero length.
    Line 2 shows that the length of the string "Careless Bears" is 14, because it
    contains fourteen characters (spaces are characters too). Line 3 calls GetLength()
    using the number (1023) as argument. GetLength() treats this number as a string
    ("1023") and returns 4 as the length of this string. A similar process happens
    in line 4 for the number -101.5, where GetLength() returns 6 (four digits, the
    minus sign, and the dot).


