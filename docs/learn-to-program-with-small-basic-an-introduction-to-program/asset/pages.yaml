  md: '# THE ONBUTTONCLICKED SUBROUTINE


    You can also write the OnButtonClicked subroutine like this:


    ```

    Sub OnButtonClicked

    btnID = Controls.LastClickedButton

    GraphicsWindow.PenColor = Controls.GetButtonCaption(btnID)

    EndSub

    ```


    Instead of hardcoding the color of the clicked button, you get the color from
    the clicked button''s caption using the GetButtonCaption() method.


    # Exploring Circuits with Code


    In this section, you''ll create a program that demonstrates an electrical series
    circuit. (Your skills are shocking!) The circuit includes a battery, three resistors,
    and a switch connected in series. A user can change the battery''s voltage and
    the values of the three resistors by entering their values in the text boxes.
    When the user enters a new value in any of the text boxes, the Controls object
    raises the TextTyped event. In response to this event, the program automatically
    calculates (and displays) the current that flows through the circuit and the voltages
    across each of the three resistors (see Figure 12-4).


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_184_0.png)


    Figure 12-4: A program that shows the operation of a series circuit


    Here are the equations that describe the science behind the program:


    **Total resistance R_tot = R1 + R2 + R3**


    **Current through the circuit I = V ÷ R_tot**, where V is the battery voltage


    **Voltage across R1 V1 = I × R1**'
