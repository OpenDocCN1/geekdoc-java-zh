    To access a file from a Small Basic program, you need to specify the file''s path.
    How to learn, look at the executable file *Test.exe* in Figure 19-2. When you
    run this, the running program knows its current directory (which is D:\Book\Chapter01\Examples
    in this case). If you want to access a data file (like *Test1.dat* or *Test2.dat*),
    you need to specify the absolute path of that data file. The absolute path lists
    the sequence of folders, starting from the root, that the program needs to navigate
    to the file. In Figure 19-2, the absolute path for *Test1.dat* is D:\Book\Chapter01\Examples\Test1.dat,
    and the absolute path for *Test2.dat* is D:\Book\Chapter01\Examples\Data\Test2.dat.


    If you write a program that only will use, you can save the data files needed
    by this program you like and access these files using absolute hardcoded paths
    in your program. For example, you can write:


    ```

    str = File.ReadContents("D:\Book\Chapter01\Examples\Test1.dat")

    ```


    But if you give this program to try, it (will most likely) fail unless your friend
    has the same file as you. A better solution is to include the desired (path) in
    your program at run time like this:


    ```

    path = Program.Directory

    str = File.ReadContents(path + "\ +Test1.dat")

    ```


    Now the program will add *Test1.dat* to the end of its current directory, which
    means it will look for *Test1.dat* in the folder as the program lives. Then your
    friend only needs to place *Test.exe* and *Test1.dat* in the same folder; the
    absolute path will no longer matter. You can just zip your program''s absolute
    folder (right-click the folder, click **Send to**, and click **Compressed (zipped)**
    folder) and send that ZIP file to your friend. Your friend can save the files
    contained in the ZIP file in C:\, D:\, C:\Temp, or any other folder of his choice,
    and your program will work as you designed.


