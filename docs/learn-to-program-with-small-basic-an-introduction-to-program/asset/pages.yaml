    Using CopyFile() and DeleteFile(), you can create your own subroutines for moving
    and renaming files. To move a file to a new location, copy the file to the new
    location and then delete the original file. To rename a file, make a copy of the
    file, give it a new name, and delete the original file.


    # Creating and Deleting Directories


    You can easily create or delete a directory. The CreateDirectory() method takes
    a single argument: the path name of the directory you want to create. If directories
    do not exist, the method attempts to create all the directories in the path, beginning
    with the root. If the operation is successful, it returns "SUCCESS". Otherwise,
    it returns "FAILED". Here''s an example:


    ```

    File.CreateDirectory("C:\Temp\Temp1\Temp2")

    ```


    If the directories C:\Temp, C:\Temp\Temp1, and C:\Temp\Temp1\Temp2 do not exist,
    CreateDirectory() creates them. If the path already exists, the function does
    nothing and returns "SUCCESS".


    The DeleteDirectory() method also takes a single argument: the path name of the
    directory you want to delete. All files and folders are deleted. If the operation
    is successful, the method returns "SUCCESS". Otherwise, it returns "FAILED". Figure
    19-5 shows an example of DeleteDirectory().


