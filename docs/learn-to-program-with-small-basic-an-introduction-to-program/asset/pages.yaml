    # Checking for Errors


    Similar to when you work with user input, you can''t control what the user saves
    in a file that your program reads. Sometimes the data in a file might be incorrect
    due to human error. Many things can go wrong (as you''ll see in an example), and
    your programs need to be ready to handle these errors.


    Fortunatelyately, Small Basic is always prepared! When you call WriteContents(),
    the method returns "SUCCESS" or "FAILED" automatically based on whether or not
    the operation was successful. A well-written program checks the returned string
    and takes action in case of failure. Update Listing 19-2 to check the return value
    of WriteContents(). Replace the statement on line 17 with the following code in
    Listing 19-3:


    ```

    1 result = File.WriteContents(outFile, strOut) ''

    2 If (result = "SUCCESS") Then

    3 Window.WriteLine("Output saved to: " + outputFile)

    4 Else

    5 Window.WriteLine("Failed to write to: " + outputFile)

    6 Window.WriteLine(File.LastError)

    7 Endif

    ```


    Listing 19-3: Checking the return value of WriteContents()


    First, we save the return of WriteContents() in a variable result (line 16), and
    then check the method''s return value (line 17), we inform the user that the output
    has been saved successfully (line 18). If the operation fails (line 19), we tell
    the user that the program failed to write to the output file (line 20), and then
    we display the reason for the failure using the File object''s LastError property
    (line 21). This property is automatically updated by WriteContents() if writing
    to to files.


    After writing the code to handle the failure case, we need to test the code by
    making it fail on purpose. Here are several possible errors that can cause WriteContents()
    to fail:


    +   1. The path of the output file doesn''t exist.

    2. The output file is already open in another program.

    3. There''s not enough space to save the file.


    Let''s experiment with the first possibility to see what happens.


