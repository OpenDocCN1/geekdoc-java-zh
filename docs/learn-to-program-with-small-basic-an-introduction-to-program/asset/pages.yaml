    # Object Properties


    Small basic objects can have properties (or attributes) that you can change. If
    you change these properties, the object''s methods may give you different outcomes
    when you call them.


    For example, let''s imagine a new object named Frog that contains two methods,
    Jump() and Eat(), and one property called EnergyLevel. When you call the Jump()
    method, Frog jumps, but each jump causes its EnergyLevel to go down. You can call
    the Eat() method to restore its energy. If you keep ordering Frog to jump without
    feeding it, Frog runs out of energy and can''t jump anymore. The outcome of calling
    the Jump() method depends on the current value of the EnergyLevel property. The
    property changes the state of the Frog object (whether it can jump or not). Calling
    Jump() at one state (when EnergyLevel is high) gives a different output than calling
    Jump() at a different state (when EnergyLevel is low). Poor hungry frog!


