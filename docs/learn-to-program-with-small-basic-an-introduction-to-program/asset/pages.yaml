  md: '# 12


    # BUILDING GRAPHICAL

    USER INTERFACES


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_178_0.png)


    Every device has a set of interfaces. For example, an interface could be the buttons
    on a microwave or in an elevator, the knobs on a dishwasher, or even the soda
    pop dispenser at your favorite burger joint. Computer programs have interfaces
    as well. Back in the day, programs only had text menus, but now we use different
    ways to interact with computers, such as the icons on your desktop.


    Although you''ve written some very useful programs in this book, don''t look like
    the programs you''re used to, such as a word processor, a paint program, a web
    browser, video games, and so on.'
