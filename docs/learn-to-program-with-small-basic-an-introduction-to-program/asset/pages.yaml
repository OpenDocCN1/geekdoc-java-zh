    first condition, sees score >= 80 is true, and sets the grade to B. In this code,
    grade never gets to A, no matter how high the value of score is. Nobody gets an
    A! When the program finds a true condition in this If/ElseIf ladder, it skips
    all the other statements and goes directly to Endif.


    To avoid this problem, make sure the conditions in the If/ElseIf ladder are in
    the correct order. You''ll probably never want to check a middle value first.
    Also, be sure to run your program few times to test the values and catch any problems
    before your users do.


