    # Complex If Conditions


    Like arithmetic operators, relational operators also need two operands, on each
    side. These operands can be simple, using variables and constants, or they can
    be complicated expressions. For example, if you want to check that you have enough
    money to buy two large pizzas and a $55 tip, enter this:


    ```

    If (myMoney >= (2 * pizzaPrice + 5)) Then

    ```


    Small Basic first finds the value of 2 * pizzaPrice + 5 (using the current value
    of pizzaPrice). It then compares the result with the current value of myMoney
    to see whether the If condition is true or false.


