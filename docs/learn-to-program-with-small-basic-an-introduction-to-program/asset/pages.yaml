    # Infinite Loops


    If a loop condition doesn''t become false, the loop runs forever, creating an
    infinite loop. Sometimes this can cause a problem, but infinite loops are useful,
    such as when you want to make a game run forever.

    But do you create an infinite loop in Small Basic? There are a few ways to do
    this, but here is a common shortcut that many Small Basic programmers use:


    ```

    While ("True"

    Text.WriteLine("Loop forever")

    EndWhile

    ```


    In this code, the loop''s condition is always true; the loop never stops, and
    it prints Loop forever! To see this in action, you''ll program a simple game that
    quizzes kids on their addition skills. The complete code is in Listing 14-3. Run
    this program to see how it works:


    +   1 AddTutor.sb

    2 num1 = math.GetRandomNumber(10) Sets num1 to a random number

