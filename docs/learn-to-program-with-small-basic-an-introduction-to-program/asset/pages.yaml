- pgno: 27
  md: '# The Parts of a Program


    Let''s explore the different parts of a program by looking at a simple example.

    Listing 2-1 shows a program similar to the Greetings.sb you wrote in

    Chapter 1. Type this program into the Small Basic Editor, and then click the

    Run on the Toolbar (or press F5 on your keyboard) to run it.


    ```

    1 '' Welcome.sb

    2 Text.WriteLine("Welcome to Small Basic."

    ```


    Listing 2-1: Writing a welcome message


    The two lines you just typed are the source code of your Welcome.sb

    When you run this code, you''ll see an output window that looks like

    Figure 2-1. (Note that the window''s title shows where we saved the file, so

    cours could be different.)


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_27_0.png)


    Figure 2-1: The output window for Welcome.sb


    Your console window will look slightly different from this one, since the window

    a black background by default. For the rest of the book, we''ll show the output
    as text,

    except when it''s necessary to see the window.


    Small Basic automatically adds the text Press any key to continue...

    the window to give you a chance to view the output (there is no any key on

    your keyboard, don''t look for it). Otherwise, the screen will flash your

    output and disappear.


    # Comments and Statements


    The line that starts with a single quote ('') is called a comment. You can add

    comments to explain what your program does, and Small Basic just ignores

    them. The comment on line 1 is the name of the file that contains your

    source code.


    You should get into the habit of commenting your code, because you''ll often head

    to the forums or to friends for help, and they''ll need to understand what your
    code is

    trying to do. Or you might need to share part of your code for others to use in
    their

    programs.


    The Small Basic Editor shows all comments in green so you can easily

    them apart lines of actual code, which are called statements. Comments

    make programs easier to read, and you can add them anywhere! But'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    careful not to use many comments, or you might make your code even harder to read!
    It''s a good practice to write comments at the beginning of your code to describe
    your program or to explain tricky parts. If you add a blank line that separates
    the comments from the code, Small Basic also ignores it, so add many empty lines
    as you need to make your program easy to read! Line 2 in Welcome.sb is your program''s
    first statement, and that''s where the program begins executing. (Don''t worry:
    nobody dies!)


    Figure 2-2 shows the parts of our statement. Let''s break it down and see what
    each part does!


    ```

    dot notation

    object | method argument

    TextBox.WriteLine("Welcome to Small Basic")

    ```


    Figure 2-2: The statement in Welcome.sb


    Textbox is an object built into Small Basic that sends output to your screen.
    WriteLine() is a method of the Textbox object. method displays the data passed
    to it on the output window. When you type Textbox.WriteLine(), you tell the Textbox
    object to execute its WriteLine() method. This is known as dot notation because
    of the dot between the object and the method. Dot notation is used to access an
    object''s methods and follows this format: ObjectName.MethodName(Arguments). In
    this example, "Welcome to Small Basic." is an argument to the WriteLine() method.
    It tells the method exactly what you want to write.


    # Characters and Strings


    Letters, numbers, punctuation marks (dot, colon, semicolon; and so on), and other
    symbols are called characters. A sequence of these characters surrounded by double
    quotes is called a string. The quotation marks show where the string starts and
    ends.


    In our Welcome.sb program, the text that reads Welcome to Small Basic is a string.


    # Arguments and Methods


    You pass arguments to a method inside its parentheses. An argument can be a string,
    or some other value. The WriteLine() method accepts only one argument, and in
    your Welcome.sb program you pass it the string "Welcome to Small Basic." as its
    argument.


    Click the WriteLine() method in the Editor, and check Small Basic''s Help Area
    (Figure 2-3). It''ll show you what kind of data to pass to that method.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Learn to Program with Small Basic (Early Access), © 2016 Majed Marji and Ed
