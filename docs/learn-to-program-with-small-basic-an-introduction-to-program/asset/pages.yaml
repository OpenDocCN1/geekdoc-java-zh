- pgno: 22
  md: '# Helping Hands: IntelliSense and Syntax Coloring


    If you''re following along and typing in Small Basic, you''ve seen how it analyzes
    you, even before you finish the word. Small Basic offers a list of suggestions
    that could help you complete what you''re typing. You can scroll through this
    list by pressing the up and down arrows on your keyboard. Press ENTER or double-click
    your selection to insert the highlighted text to your code. This technology is
    called intelligent sense or IntelliSense for short. Use it to speed up your typing
    time and reduce your syntax errors.


    You can make IntelliSense transparent by just holding down the CTRL key to see
    your code underneath it.


    You might have also noticed that the Small Basic Editor used different colors
    for some words in the program. This feature is called syntax coloring. Keywords,
    which are reserved words with special meanings to Small Basic, are shown in blue-purple.
    Strings, which are sequences of characters enclosed in quotes, are orange, and
    so are numbers. Method names are dark red, object names are blue-green, and so
    on. Syntax coloring helps you distinguish the different parts of the code and
    makes your program easier to read. You''ll learn more about these parts of code
    later in the book.


    # TRY IT OUT 1-1


    Type the following program into the Editor, and run it to see what happens. The
    output of the program is shown in Figure 1-5.


    ```

    GraphicsWindow.DrawEllipse(20, 20, 100, 100)

    GraphicsWindow.DrawRectangle(140, 20, 100, 100)

    GraphicsWindow.FillEllipse(260, 20, 200, 100)

    ```


    The numbers illustrate how Small Basic followed your code.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_22_0.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Drawing with Small Basic


    The TextWindow object we used earlier works well for applications that don''t
    have a graphical user interface (GUI), which is a user interface that contains
    buttons, edit boxes, and images, like Microsoft Word or Angry Birds (or Angry
    Words). For example, you can use TextWindow to write applications that perform
    math problems or process data, the input and output use only characters (like
    text). This is called a text-based user interface. If you want to create an application
    with a GUI (pronounced gooey, like a candy bar), with buttons and images, you
    can use the Small Basic library''s GraphicsWindow object. Using Graphicswindow,
    you can create applications that show graphs, images, and more for your users
    to interact with.

    Let''s try it out!


    Type the program in Listing 1-2 into the Editor, and then click Run in the Toolbar.


    ```

    1 Graphics.sb

    2 GraphicsWindow.DrawText(100, 50, "Greetings, Planet!")

    ```


    Listing 1-2: Your first graphical program

    This program uses the DrawText() method of the Graphicswindow object to display
    a message. The first two arguments tell Small Basic the horizontal (x) and vertical
    (y) positions of the output message, starting in the upper-left corner of the
    window. The third argument tells Small Basic what text to display. The output
    program is shown in Figure 1-4.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_23_0.png)


    Figure 1-4: The output of Listing 1-2


    As you can see, the message is displayed at the position (100, 50).

    The GraphicsWindow object contains many other methods that let you create GUI
    applications; explore a few of them in Try It Out! 1-1.'
  merge: -1
  img_proc: true
