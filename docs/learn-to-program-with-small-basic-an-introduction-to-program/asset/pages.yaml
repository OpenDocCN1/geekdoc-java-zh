    # WriteLine, WriteContents, and InsertLine


    The ReadContents() and WriteContents() methods let you read and write the entire
    contents of a file at once. Sometimes this is just what you need. But in other
    situations, reading or writing one line at a time might be better.


    The File object provides the ReadLine() method for reading a single line of text
    from a file. A line of text consists of a string of characters that ends with
    a carriage return and line feed. ReadLine() reads all of that line up to (but
    not including) the carriage return character. The method takes two arguments:
    the path of the file and the line number of the text to be. The first line of
    a file is line number 1, the second line is 2, and so on. If the file contains
    the specified line number, the method returns the text at that line. Otherwise,
    it returns an empty string.


    The File object also provides the WriteLine() method for outputting a line of
    text to a file. This method takes three arguments: the path of the file, the line
    number to write to, and the text to write. Keep the following information in mind
    when you''re using this method:


    +   1. If the file does not exist, WriteLine() creates it.

    2. If the file contains the specified line number, WriteLine() overwrites that
    line.

    3. If the specified line number is larger than the number of lines in the file,
    the specified text is appended to the end of the file. For example, if the file
    contains three lines, and you ask WriteLine() to write new text at 100, the specified
    text is written at line 4.

    4. WriteLine() automatically writes a carriage return and line feed at the end
    of the passed text. This means you don''t have to append these characters to your
    strings manually.


    +   5. If the operation is successful, WriteLine() returns "SUCCESS"; otherwise,
    it returns "FAILED".


    In addition to ReadLine() and WriteLine(), the File object provides the InsertLine()
    method to insert a line into a file, at a specified line number. With the ReadLine()
    method, this method takes three arguments: the path of the file, the line number
    where you want the text to be inserted, and the text you want to insert. InsertLine()
    won''t overwrite any existing content at the specified line. If the operation
    is successful, InsertLine() returns "SUCCESS";


