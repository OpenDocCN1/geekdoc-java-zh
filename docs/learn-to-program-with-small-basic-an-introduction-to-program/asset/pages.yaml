    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_267_0.png)


    Figure 17-8: The user interface for the Treasure Map game


    You can move north, east, south, or west, one block at a time. But because the
    compass is old, it might lead you into the wrong direction. For example, if you
    go north or south, there’s a 20 percent chance that you’ll also move one block
