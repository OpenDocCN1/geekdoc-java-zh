    # # EMPOWERING PROGRAMS

    WITH MATH


    If mathematics bores or scares you, that''s okay. You''ll soon realize how easy
    Small Basic makes it for you to write programs that do math for you (and even
    do your math homework for you). Many programs use simple operations like addition,
    subtraction, multiplication, and division. For these types of problems, you just
    need the four basic math operators (+, -, *, /). The asterisk (*) represents multiplication,
    and the slash (/) represents division.


    Other programs use some of the math functions that you have learned in algebra
    (like square root, absolute value, and trigonometric functions). Small Basic''s
    Math object provides these functions and many others.


    If you don''t know what a square root or a trigonometric function is, don''t panic;
    you still can write programs using these functions. And it''s okay to skip some
    of the examples in this chapter, too.'
