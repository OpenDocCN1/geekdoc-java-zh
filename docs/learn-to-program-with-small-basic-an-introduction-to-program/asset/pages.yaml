  md: '# Trigonometric Methods


    Trigonometric functions are those mischievous enemies of high school students
    (sine, cosine, tangent, and so on). We won''t explain what these are, but if you
    have no idea what a trigonometric function is or you''ve never heard the word
    trigonometry, don''t worry. Just skip ahead to Chapter 8. Otherwise, let''s jump
    right in with an example.


    Imagine that androids from the future have traveled back to our time to destroy
    humanity, you''re the only person who can stop their attack. You''ll need to use
    your cannon to destroy their weapons warehouse, as shown in Figure 7-3.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_106_0.png)


    Figure 7-3: Destroying the androids'' warehouse


    Your cannon fires with an initial speed, v, of 160 feet per second. The warehouse
    is 500 feet away. All you have to do is figure out the launch angle 0 (the Greek
    letter theta). The program in Listing 7-4 prompts you to enter the desired angle,
    and then computes the missile range d (in feet) according to the formula shown
    in the figure.


    You need to run the program several times (using different launch angles) to find
    the best angle for your goal.


    ```

    1 AndroidAttack.sb

    2 v = 160 Initial speed = feet/sec

    34Window.WriteLine("Shoot the cannon 500 feet to destroy the warehouse!")

    5 TextBox.Write("Enter launch angle in degrees: ")

    6 angle = TextBox.ReadNumber() '' Angle in radians

    7 theta = Math.GetRadians(angle)

    8 d = (v * v) * Math.Sin(2 * theta) / 32

    10 d = Math.Round(d) Rounds to the nearest integer

