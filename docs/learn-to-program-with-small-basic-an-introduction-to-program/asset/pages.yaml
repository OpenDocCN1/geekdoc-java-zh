  md: "# Nested Loops\n\nThe statements in the body of a For loop can be any Small\
    \ Basic statement, including another For loop. Nesting is when you put one For\
    \ loop inside another loop (no birds are involved). Using nested loops allows\
    \ you to create iterations in two or more dimensions. This technique is important,\
    \ and you can use it to solve a wide range of programming problems.\n\nTo understand\
    \ the idea of nested loops, we will examine a program that causes your computer\
    \ to 'jump' four times and 'clap' three times after each jump. Because the program\
    \ needs to count two things (jumps and claps), it uses two loops, as shown in\
    \ Listing 13-7. The counter for the outer loop, j, uses the values 1 to 4. The\
    \ counter for the inner loop, c, uses the values 1 to 3.\n\n```\nNestedLoops.sb\n\
    For j = 1 To 4\n  ' The counter\n  Window.Write(\"jump \" + j + \": \")\n  For\
    \ c = 1 To 3\n    ' The counter\n    Window.Write(\"clap \" + c + \": \")\n  End\n\
    \  Window.WriteLine(\"\")\nEnd\n```\n\nListing 13-7: Nesting For loops\n\nIn the\
    \ first iteration of the outer loop (where j = 1), the inner loop repeats three\
    \ times (for the three values of c); each time, it writes the word followed by\
    \ a space, the current value of c, and another space (line 5). When you nest For\
    \ loops like this, the inner loop goes through all its iterations for each iteration\
    \ of the outer loop. The first iteration of the outer loop makes the program display\
    \ Jump 1: Clap 1 Clap 2 Clap 3. When the inner loop ends, the program outputs\
    \ an empty line (line 7) to move the cursor to the beginning of the next line,\
    \ and the second iteration of the outer loop starts with j = 2. The inner loop\
    \ runs for c = 1, 2, and 3. This causes the program to display Jump 2: Clap 1\
    \ Clap 2 Clap 3. This continues, so the program displays: Jump 3: Clap 1 Clap\
    \ 2 Clap 3 and then Jump 4: Clap 1 Clap 2 Clap 3. The program ends. Perhaps your\
    \ computer wants to be a cheerleader!\n\nFigure 15-6 helps explain how the program\
    \ works.\nThe output should look like this:\n\n```\nJump 1: Clap 1 Clap 2 Clap\
    \ 3\nJump 2: Clap 1 Clap 2 Clap 3\nJump 3: Clap 1 Clap 2 Clap 3\nJump 4: Clap\
    \ 1 Clap 2 Clap 3\n```\n\nNow let's look at other problems where nested For loops\
    \ come in handy!"
  merge: -1
