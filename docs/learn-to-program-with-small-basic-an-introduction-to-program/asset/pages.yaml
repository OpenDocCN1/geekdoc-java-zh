    # Listing 5-7: Making the loop draw a square using a For loop


    The For loop runs Turtle.Move(60) and Turtle.TurnRight() four times. You use a
    For loop when you know how many times you want to repeat some code. In this example,
    your program starts the loop, then goes back to the start of the loop to run it
    again. It runs four times and exits the loop. Try it out!


    In this short program, you are using three new Small Basic keywords: For, To,
    and EndFor.


    The keywords (For, To, and EndFor) don''t have to be capitalized as you see them
    in Listing 5-7, and the statements in the For loop don''t have to be indented,
    but the default formats. The Editor edits the statements inside the For loop as
    you type to make your code easier to read.


    Figure 5-10 shows what''s going on.


    This is the loop''s counter. You can call it anything you want. In this chapter,
    this will always be 1.


    This is how many times you want to repeat.


    Put the statement(s) you want to-repeat between the For and EndFor keywords.


    ```

    For I = To 4

    Turtle.Move(60)

    Turtle.TurnRight()

    ```


    EndFor


    Figure 5-10: The parts of the For loop


    To repeat lines of code, you put the statement(s) you want to repeat between the
    For and EndFor keywords. If you want to repeat these four statements, write this:


    ```

    For I = 1 To 4

    ```


    The variable I is the counter. It keeps track of how many times the loop runs
    and how many times it has left to go. Each time your program runs the loop, it
    adds one to the counter.


    Remember the For loop the next time you get in trouble at school! If your teacher
    catches you chewing gum and asks you to write I won''t chew gum in class 100 times,
    Small Basic is there to rescue you! Write this instead:


    ```

    For I = 1 To 100

    TextWindow.WriteLine("I won''t chew gum in class again.")

    EndFor

    ```


