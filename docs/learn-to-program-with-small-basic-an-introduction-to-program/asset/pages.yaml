  md: '# Absolute Motion


    Absolute motion, you tell your turtle to go to a point on the graphics window.
    No matter where the turtle is, it moves to the exact point you choose.


    One way to move the turtle to a particular point on the graphics window is to
    change its X and Y properties. To see how, run the program shown in Listing 5-1:


    ```

    1 SetTurtle.sb

    2 Turtle.Show()

    3 Program.Delay(1000)

    4 Turtle.X = 100

    5 Turtle.Y = 140

    ```


    Listing 5-1: Setting the turtle''s position


    The Show() method (line 2) causes the turtle to appear near the center of the
    graphics window (320, 240). The Delay() method on line 3 makes the program sleep
    for 100 milliseconds (which is 1 second), so you can see the turtle''s initial
    position. Line 4 sets the turtle''s X position to 100, and line 5 sets the turtle''s
    Y position to 140. After running lines 4 and 5, the turtle will appear at (100,
    140) on the graphics window, as illustrated in Figure 5-3. Note that the turtle
    moved to the new location without leaving any trace; it''s like the turtle picked
    up and placed at (100, 140).


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_70_0.png)


    Figure 5-3: Moving the turtle without leaving a trace


    Another way to move the turtle to an absolute position on the graphics window
    is to use the MoveTo() method. This method takes the x- and y-coordinates of the
    desired position as arguments. Run the program in Listing 5-2 to see what this
    method does.'
