    5 Text.WriteLine("What is " + num1 + " + " + num2 + " ? ")

    6 ans = Text.ReadNumber() User enters an answer

    7 If (ans = correctAns) Then Checks if the answer is correct

    8 Text.WriteLine("This is correct.")

    9 Else Gives the correct answer

    10 Text.WriteLine("Sorry. The answer is " + correctAns)

    11 End If

    12 EndWhile


