    # Logic Errors


    Sometimes, you might make a mistake in your program''s logic. These *logic errors*
    cause your programs to produce the wrong results. For example, if you accidentally
    used a minus sign instead of a plus, you''ve made a logic error. Your program
    runs normally, but the output is incorrect!


    Logic errors are *bugs*, and *debugging* is the process we use for finding and
    fixing these bugs. For short programs, you might be able to locate the bugs by
    hand tracing, which means you read the program by line and write down the output
    you expect for each step. Another common technique is to insert additional `WriteLine()`
    statements to print the output at different parts of the program. This helps you
    narrow down the lines where the program might have gone wrong.


    # Runtime Errors


    Runtime errors happen after you run your program, when it experiences a problem
    that''s not solved in code. For example, your user may enter bad numbers that
    can cause your program to stop working, or crash. You''ll discover these errors
    yourself when you start tinkering with Small Basic.


