    # Character Coding with Unicode


    All computer data (including text) are stored as binary sequences of 0s and 1s.
    The letter A for example is 01000001. The mapping between a character and its
    binary representation is called encoding.


    Unicode is a universal scheme that lets you encode more than a million characters
    from many languages. Each character is assigned a unique number (a code point).
    For example, the code point for character A is 65, and the code point for the
    dollar sign $ is 36. The GetCharCode() method returns a character’s code point.
    But the GetCharacter() method returns the opposite: when you give it a character’s
    code point, it returns the corresponding character.


    Enter and run the program in Listing 18-3:


    ```

    '' CharCode.sb

    str = "Abcd12"

    For N = 1 to Text.GetLength(str)

    ch = Text.SubText(str, N, 1)      Gets the Nth character

    code = Text.GetCharCode(ch)      Gets its code-point

    TextWindow.WriteLine(ch + ": " + code ) Displays ch and its code-point

    EndFor

    ```


    > Listing 18-3: Demonstrating the GetCharCode() method


    Line 2 defines a string that contains six characters. Line 3 starts for a loop
    that accesses each of these characters; GetLength() sets the upper limit of the
    loop. Each iteration of the loop reads one character from the string and saves
