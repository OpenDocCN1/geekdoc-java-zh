    # Rounding Methods


    Sometimes you''ll need to round numbers in your programs. if your program finds
    the average number of children per household in your neighborhood, you don''t
    want your program to display 2.25 (two and a quarter per house). That wouldn''t
    make any sense!


    The Math object gives you three methods to round or chop numbers: Round(), Floor(),
    and Ceiling(). See Figure 7-1 for a quick overview of what each method does to
    a number.


    Round(x) returns the whole number (or integer) nearest to x. Floor(x) returns
    the integer that is less than or equal to x, and Ceiling(x) returns the integer''s
    greater than or equal to x. Experiment with each of these methods to see what
    results you get.


    Let''s use this rounding knowledge to fix the output of our calculator. Add the
    following statement after line 11 in Listing 7-2:


    ```

    A = Math.Round(A)

