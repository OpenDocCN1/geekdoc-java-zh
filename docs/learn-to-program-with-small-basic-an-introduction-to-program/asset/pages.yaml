  md: '# SOLVING PROBLEMS WITH

    SUBROUTINES


    The programs you''ve written so far are short and easy to understand. But as you
    start dealing with more complex problems, you''ll need to write longer programs.
    Understanding long programs can be a challenge, because you''ll need to keep track
    of many different parts of the program. In this chapter, you''ll learn how to
    organize your programs into smaller pieces.


    An approach known as structured programming started in the mid-1960s to simplify
    the process of writing, understanding, and maintaining computer programs. Instead
    of writing a single, large program, you divide your program into smaller pieces.
    Each piece solves one part of the overall task, and subroutines implement these
    smaller pieces as part of a long program.'
