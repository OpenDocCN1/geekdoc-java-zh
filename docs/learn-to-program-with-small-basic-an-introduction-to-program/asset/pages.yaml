    Listing 16-9: Setting up the GUI


    The program starts by initializing the graphics window (lines 1–7), drawing the
    background image (lines 9–10), and creating the New button (line 11). Next, it
    calls the CreateLists() subroutine to initialize the five indexed arrays (line
    13). Then the program uses the Array object to get the number of items in each
    array and saves these values in lines 15–19. This way, you can append more elements
    to the end of these arrays without affecting the rest of the program. For example,
    if you wanted to add a 3rd adjective, you could add "73-calligraphous; within
    the quotes of the adjectives array line in the CreateLists() subroutine. Because
    line 16 in Listing 16-9 gets the count of the elements in the array, the new elements
    you add are automatically counted and randomly selected for the poem, just like
    the other elements.


    Finally, the program registers a handler for the ButtonClicked event (line 21)
    and calls the handler subroutine to display the first poem (line 22).


