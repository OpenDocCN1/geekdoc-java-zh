    TRY IT OUT 14-1

    How much would woodchuck chuck if a woodchuck could chuck? Open the Woodchuck.sb
    file from this chapter''s folder, and run it to answer the age-old question. Then
    figure out some ways to improve the program.


    # Validate Your Inputs


    When you write a program that reads data from a user, you should always check
    the input before continuing with your program. This is called validation. In this
    section, we''ll show you how to use loops to ensure that your user enters the
    correct input to your program.


    Let''s say you need the user to enter a number between 1 and 5 (including 1 or
    5). If they enter a number less than 1 or greater than 5, you need to prompt them
    to re-enter a number. Listing 14-2 shows you how to use a While loop to achieve
    this:


    ```

    1 Input.sb

    2 num = -1 Invalid value (to a pass through the loop)

    3

    4 While ((num < 1) Or (num > 5))

    5 TextWindow.Write("Enter the number between 1 and 5:")

    6 num = TextWindow.ReadNumber()

    7 EndWhile

    8 TextWindow.WriteLine("You entered: " + num)

    ```


    Listing 14-2 Using a While loop to check the input number


    Line 2 sets the variable num (which will hold the number entered by the user)
    to -1. This makes the condition of the While loop (line 4) true, so the loop''s
    body runs at least once. This loop will run without it, but we''re building a
    good habit! The program prompts the user for a number and assigns their input
    to the num variable (lines 5–6). The loop runs again. If num is less than 1 or
    greater than 5 (the user entered an invalid number), the loop''s body runs again,
    prompting the user to re-enter the number. If num is between 1 and 5, the loop
    ends, and the program moves to line 8 to display the number.


    TIP Make sure initialize any variable before you use it in a While loop''s test
    condition. If you don''t, your program might skip over the loop entirely!


    Now you know how to verify user input using a While loop.'
