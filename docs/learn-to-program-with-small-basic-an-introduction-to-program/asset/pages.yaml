    Listing 11-10: Checking whether the turtle gets the same as the, the turtle


    If the player''s x- and y-positions are the same as the, the turtle

    grabs the bag (line 2). Happy turtle! If the lucky turtle gets the bag of gold,

    increase the score (line 3), show it (line 4), and use the Sound object to

    play a short clip (line 5) for a voice audio effect.


    We also need to set the timer back to 2 seconds for the new round.

