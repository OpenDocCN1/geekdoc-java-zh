- pgno: 66
  md: '# TwoKinds of Data


    Programs use all different types of data: applications that do calculations use
    numbers, but others might use text.


    You don''t need to tell Small Basic what type of data you''re going to store in
    a variable. This is a beginner-friendly way of programming.


    # Global Variables


    Variables in Small Basic are global in scope. This means you can define a variable
    and access it from anywhere in your program. This feature is helpful because it
    lets you define variables just when you need them (instead of putting all variables
    at the top of your program). But you have to be careful! Small Basic reads your
    variables in order, so it is possible to create logic errors. Try the program
    in Listing 4-3.


    ```

    1 LogicError.sb

    2 y = x / 10

    3 TextWindow.WriteLine("y = " + y)

    ```


    Listing 4-3: logic error with global variables


    If you''re reading this code closely, you''ve already noticed that, in line 2,
    we''re using the variable x before we''ve assigned it any particular value. When
    we run this code, we get the following output:


    ```

    y = 0

    ```


    Does that answer surprise you?

    Here''s what''s happening. When the Small Basic compiler reads this, it makes
    a list of all the variables you defined in the program. The initial values for
    these variables are left empty, like empty boxes. long as the expressions in the
    program use variable names from that list, the compiler is happy and the program
    will run successfully.


    When the program runs the expression x / 10 in line 2, it interprets x as a number
    because division only makes sense for numbers. That''s why it fills the empty
    box for x with 0. Then it assigns the result of the division (which is 0) to y.
    The variable x is changed to 20 in line 3, but it''s too late! You get the wrong
    output.'
