- pgno: 86
  md: '# 6

    GETTING USER INPUT


    To perform useful tasks or give you useful information, some programs need input
    from you. For example, in Microsoft Word you type your text, click buttons to
    make it look good, and enter a filename to save it. In a web browser, you click
    links or enter a URL or search term to find a web page. In drawing programs, you
    draw with the mouse by clicking and dragging. When you use a program and give
    it information that helps it to do its job, the information is called user input.


    Programs need a way to ask users for input, process that input, and respond correctly.
    Programs that do this are interactive. In this chapter, you''ll make your programs
    interactive by giving them the capability to accept and react to user input, which
    will be in the form of strings and numbers.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Talking to the Computer


    Until now, all the information your programs needed was in the source code. For
    example, look at the program in Listing 6-1:


    ```

    1 CircleArea.sb

    2 radius = 5

    3 area = 3.1416 * radius * radius

    4 TextWindow.WriteLine("Area = " + area)

    ```


    Listing 6-1: Finding the area of a circle


    This program uses a fixed value of 5 for the radius in line 2. This is also hard-coded
    data. Hard-coded data is part of the program. If you want to change that, you
    must change the source code. For example, to find the area of a circle using a
    different radius, you open the file, change the radius value in your code, save
    the file, and run the new code. It''s a pain to do this every time you want to
    change the value of a variable. And if you give this code to someone who doesn''t
    know how to program, it won''t be very useful.


    # Your Number, Please?


    Clearly, it''d be best if you could calculate the area of any circle without changing
    the source code. So let''s explore how to read values directly by input. We want
    our program to ask the user to enter a value for the radius and then use that
    value in the calculation. To do this, use the TextWindow method ReadNumber().
    Add a line to the program in Listing 6-1 to replace the hard-coded radius on line
    2 with user input. Note how we''re assigning the value to radius:


    ```

    radius = Textwindow.ReadNumber()

    ```


    When this statement runs, a flashing cursor appears in the text window, as shown
    in Figure 6-1. The cursor is the program''s way of saying, "It''s your turn to
    type. Don''t make me come out there!"


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_87_0.png)


    Figure 6-1: Running a ReadNumber() statement


    When the user types a number and presses ENTER, the input is stored for the rest
    of the program to use. Whatever number the user entered is now stored in the radius
    variable.'
