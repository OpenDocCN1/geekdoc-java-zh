    But how would Small Basic find the result of an expression like this:6 * 2 + 3?
    This means multiply 6 times and add 3, which equals 15, or multiply 6 times the
    sum of 2 and 3, which equals 30? When an arithmetic expression contains different
    operators, Small Basic completes the expression using the same *priority* used
    in algebra, as shown in Figure 2-9.


    | ( ) | Parentheses come first, then |

    |---|---|

    | * | multiplication and division are performed in order of occurrence (from left
    to right), then |

    | + | addition and subtraction are performed in order of occurrence (from left
    to right).


    **Figure 2-9:** Order of operations in Small Basic


    So, for 6 * 2 + 3 with no parentheses, Small Basic would multiply 6 times 2 and
    then add 3, for a result of 15.

    In ordinary math, each parenthesis in a Small Basic program must have a matching
    parenthesis. For example, the expression (6 + 4) is valid, but (6 + (8 - 2)) isn''t
    valid because it has an extra parenthesis.

    To make sure you get the results you want, use parentheses. This helps you avoid
    mistakes and makes your code easier to understand. For example, enter the following:


    ```

    TextWindow.WriteLine((3.5 + 6.5) - (5 - 2.5))

    ```


    If you placed your parentheses correctly, you should get 7.5.


