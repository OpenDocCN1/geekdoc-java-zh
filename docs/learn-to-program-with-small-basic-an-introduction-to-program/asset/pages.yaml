  md: '# Drawing Shapes


    You can draw lots of cool pictures using lines, but that can be super slow. You
    can simplify your code by drawing geometric shapes with built-in methods, which
    saves you a lot of time!


    # Triangles


    Use the DrawTriangle() and FillTriangle() methods to draw triangles:


    ```

    GraphicsWindow.DrawTriangle(x1, y1, x2, y2, x3)

    GraphicsWindow.FillTriangle(x1, y1, x2, y2, x3)

    ```


    These methods take the x- and y-coordinates of the three corners of the triangle.

    The DrawTriangle() method draws the triangle''s outline, and the FillTriangle()
    method fills the inside of the triangle with whatever you set the BrushColor property
    to.


    > For the complete list of colors you can use in your Small Basic programs, please
    check http://tiny.cc/hexcolors.


    For example, to draw a triangle with blue, use these two statements:


    ```

    GraphicsWindow.BrushColor = "Blue"

    GraphicsWindow.FillTriangle(100, 10, 40, 50, 100, 50)

    ```


    If you want to set the border, first FillTriangle() to fill the triangle''s interior
    with the desired color, and then DrawTriangle()


    ```

    GraphicsWindow.BrushColor = "Blue"

    GraphicsWindow.FillTriangle(100, 10, 40, 50, 100, 50)

    GraphicsWindow.DrawTriangle(100, 10, 40, 50, 100, 50)

    ```


    Experiment with these methods to draw all kinds of triangles. Check your understanding
    with Try Out 3-1.


    # Rectangles and Squares


    Using the DrawRectangle() and FillRectangle() methods, you can draw rectangles
    or squares of different sizes.


    ```

    GraphicsWindow.DrawRectangle(x, y, width, height)

    GraphicsWindow.FillRectangle(x, y, width, height)

    ```


    In both methods, the first two arguments (x and y) are the coordinates of the
    upper-left corner of the rectangle. The third argument sets the width, and the
    fourth argument sets the height. Use the same number for the third and fourth
    arguments to draw a square.'
