  img_proc: true
- pgno: 61
  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    +   3. Variable names in Small Basic are case insensitive; side, SIDE, and SIDE
    are the same variable.


    Based on these rules, MyAddress, totalScore, player1, sum, room_temperature, and
    x123 are all valid names.


    In addition to the rules we mentioned, these conventions are good programming
    practices, and you should follow them, too. Let''s look at these additional conventions.


    # Say What You Mean


    Although you can name a variable anything, we recommend you choose a name that
    explains what the variable is for. For example, using a named address to store
    a person''s address makes more sense than using a variable named xy123 or TacoTruck.


    # Find the Right Length


    Avoid single-letter names like m, j, x, and w, unless their meanings are very
    clear, or you will make your program harder to read and understand. Don''t use
    names that are so long they put your friends to sleep, either!


    Choose short, meaningful names instead. For example, use name or president instead
    of the_name_of_the_president.


    # Stick with Your Style


    It''s currently popular to name variables by starting with a lowercase letter
    and capitalizing the first letter of each additional word, like sideLength, firstName,
    roomTemp, variablesAreAwesome, and scobobyDoo. This naming style is called camel
    case because it has a hump in the middle. But don''t worry—camel-cased variables
    won''t spoil!


    This book uses camel case, but if you prefer a different style, that''s okay.
    Just use one naming convention and stick to it! Although Small Basic is insensitive
    when it comes to variable names, you should be consistent about casing when you
    name your variables. If you name a variable firstName, the IntelliSense auto-complete
    feature will help you. Let''s see how.


    # Let IntelliSense Work for You


    When you create a variable in your program, the name of variable is added to the
    IntelliSense drop-down menu. When you want to reuse a variable (or check its case),
    just type the first few letters and look for it in IntelliSense, shown in Figure
    4-2. Small Basic finishes your variable just like a best friend who finishes your
    . . . sandwiches!


