    # # Divide and Conquer: Create a Dragon Game


    The previous example showed you how subroutines add structure and clarity to your
    programs. You break your program into smaller pieces and tackle them one at a
    time. Although every problem is different and there''s no one size fits all solution,
    we recommend a few ways to think through any problem.


    First, spend some time to fully understand the problem. You wouldn''t dive into
    a pool without looking at it first, right?! (What if it was filled with puddles?)
    When you have a good idea of the problem you need to solve, plan a general solution.
    Divide it into major tasks. As the solution decide what tasks are. There''s no
    right or wrong answer; with practice you''ll get better at making these choices.
    But if you start with the general solution and break it down into smaller tasks,
    the logic of your program will be in good shape.


    To show this problem-solving strategy, let''s drag the dragon shown in Figure
    10-6.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_151_0.png)


    Figure 10-6: The dragon game''s user interface


    In this game, you control the knight, and it''s your job to slay the dragon. On
    the screen you can see variables we''ll display to keep score and when the player
    makes a choice of three actions to play.


