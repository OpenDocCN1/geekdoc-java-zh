    # Make a Typewriter using the TextInput Event


    The TextInput event is very similar to the KeyDown event, but it''s raised only
    when the user presses a text-related key on the keyboard. This includes letters
    (A–Z), digits (0–9), special characters (!@#$%^), and other keys, like ENTER,
    the spacebar, TAB, and BACKSPACE. When the TextInput event is raised, the last
    character pressed on the keyboard is saved in the GraphicsWindow.LastKey property.

    Let''s see how this works. The code in Listing 11-3 to simulate a typewriter.
    We know that typewriters are old school, but it could be; we would be simulating
    an abacus!


