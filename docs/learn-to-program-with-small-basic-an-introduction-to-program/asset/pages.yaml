    # Appending to the File


    The WriteContents() method overwrites an existing file, but the AppendContents()
    method opens the specified file and adds data to the end of a file without erasing
    its original contents.


    Similar to WriteContents(), AppendContents() takes two arguments: the path name
    of the output file and the string you want to append to the end of the file. If
    the operation is successful, the method returns "SUCCESS"; other-wise, it returns
    "FAILED". If the file you pass to AppendContents() doesn''t exist, it''s created
    for you, and the string is written to it. If the file already exists, the string
    is appended to its end.


    To see AppendContents() method in use, let''s say you need to maintain a log file
    that records actions, errors, and other events in your program. To keep the program
    simple, let''s just record the times when your program is executed. Every time
    your program runs, you add a record to a log file that includes the date and time.
    The complete program is in Listing 19-5:


    ```

    1 AppendContents.sb

    2 outFile = Program.Directory + "/log.txt"

    3

    4 strlog = Clock.WeekDay + " " + Clock.Date + " \ " + Clock.Time

    5 result = File.AppendContents(outFile, strlog)

    6 If (result = "FAILED") Then

    7 TextWindow.Window.WriteLine("Failed to write to: " + outFile)

    8 TextWindow.Window.WriteLine(File.LastError)

    9 EndIf

    10

    11 TextWindow.Window.WriteLine("Thank you for using this program. And for deodorant.")

    ```


    > Listing 19-5: Demonstrating the AppendContents() method


    When you run this program, it creates a log string that contains the current day
    of the week, date, and time (line 4), and appends this to the end of a log file
    named Log.txt that''s in the program''s directory (line 5). When writing to the
    file fails, the program displays an error message explaining the cause of the
    failure (lines 7–8). The program displays a message (line 11) and ends.


