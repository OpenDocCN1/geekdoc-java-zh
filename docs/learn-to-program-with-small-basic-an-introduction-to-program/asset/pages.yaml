    figure). The root directory has a number of files and other directories under
    it. Each of these directories might contain other files and subdirectories.


    You can locate any file by following a path from the root directory down the tree
    until you reach that. The sequence of directories you follow makes up the pathname
    for the file. For example, to find the file in Figure 19-2, you would look in
    the root directory D;, then in *Book*, and then in *Chapter03* to locate the file.
    If you write the path with a back slash (\) to separate each directory, the pathname
