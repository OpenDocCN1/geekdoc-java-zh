    # # Subroutine Input and Output


    You can think of a subroutine as a small program that provides a service to the
    main program. When the main program needs that service, it preres the inputs that
    the subroutine needs and then calls the subroutine to start its job. The subroutine
    runs, saves its output(s) in some variables, and returns to the main program.
    When the main program continues, it looks at any new information from the subroutine
    and then uses that data to decide what to do next.


    Small Basic doesn''t let you pass arguments to parentheses (like you do with an
    object''s method, as the DrawLine method of Graphics). And it doesn''t define
    subroutines that directly return a value (like the Math.Round() method does).
    So you need to use variables to pass data between the main program and your subroutines.
    Let''s see how that works.


