    # Nesting Subroutines


    If your chore is to clean the house, you might get help by making a deal with
    your sister to clean the windows and asking your dog to clean the floor under
    the table. Similarly, a subroutine might call other subroutines to help it do
    part of a larger job. In Figure 10-5, the program calls a subroutine, SubA(),
    which then calls another subroutine, SubC(). Subroutines called from other subroutines
    are nested subroutines.


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_148_1.png)


    If your program contains many subroutines, you can place these subroutines at
    the end of your program in any order you like. For example, it doesn''t matter
    if you put the code for SubH() before or after SubB(). What matters is the order
    in which you call subroutines, not where you place them in your code!'
