  md: 'Learn to Program with Small Basic (Early Access), © 2016 by Majed Marji and
    Ed Price


    In this chapter, you''ll learn how to write While loops and use them to verify
    user input and make games. While loops are a powerful programming concept; once
    you master them, you''ll be able to make all kinds of cool applications.


    # # When to Use While Loops


    Let''s say you want to make a number-guessing game that selects a random number
    between 1 and 100 and prompts a player to guess it. If the player''s guess is
    wrong, the game tells them whether their guess was higher or lower than the secret
