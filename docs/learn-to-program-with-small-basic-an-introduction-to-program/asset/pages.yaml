    # If/Else Statement


    Your mom calls you back again and gives you more instructions. "One more thing!
    If Captain Snarf''s is closed, please stop by LongLine Grocery and get a frozen
    pizza." Now you can use If/Else statements in Small Basic to help you!


    The If/Else statement (also) lets you take one action when the condition''s true
    and another action when the condition''s false. Figure 8-2 illustrates the structure
    of this statement.


    If the condition is true, Small Basic runs the block (between the If and Else
    keywords). If the statement is false, Small Basic runs the Else block (between
    the Else and Endif keywords). Small Basic runs the statements in only one of the
    two blocks (either the If or the Else block).


    You can write your mom''s new instructions as shown in Listing 8-3:


    ![](img/4f18c322037ed1f8f46837dd6e5e99d0_116_0.png)


