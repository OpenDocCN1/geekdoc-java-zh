    and all of the methods are implicitly `public`, so there’s no need to include
    the `static` and `public` modifiers.


    **Note!**


    A top-level `interface` cannot be private. Also, all methods of an `interface`
    are intuitively `public`, so don’t include any methods you think should be `private`
    or `protected`.


