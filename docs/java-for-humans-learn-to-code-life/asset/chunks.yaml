    **Why Datatypes are Important and Useful**


    Datatypes give our data the power of predictability. If you have a dog, you know
    for a fact that it can bark, so it would be okay to ask it to do just that. If
    you have an apple, you know for a fact it is okay to eat it because that’s what
    apples are for. But what if someone wrapped an apple in a dog suit and gave it
    to you without you knowing? You would try to make that dog bark, but nothing would
    happen. You would try to take it for a walk and it wouldn’t move. This is the
    same idea with datatypes in Java.


    You can’t count with a String because strings represent characters that make concepts
    like words and stories like the one you are reading now. On the other hand, you
    can count with integers. However, if you try to make a word with an integer, nobody
    would understand it because integers only represent numbers.


    We can use this same logic towards data in Java. If you store your data in variables
    of appropriate datatypes, you will be able to safely use them as you wish later
    because you know exactly what type of data they are. Let’s see how we can use
    datatypes in Java to store our bank account information more efficiently.


    **A Better Way to Store Our Bank Account Information**


    Remember that variables are useful for storing information for later use and manipulation.
    We want it to be easy to get only the information we need, use it as we want,
    and move on. Given that, we do not want to store all of our information in a single
    variable. Let’s see how we can make this better.


    So we have nine pieces of information about our account that we have to store
    in variables. It helps if we first understand what types of data we are trying
    to store:


    identifier is a numberbalance is a number with a decimal point (floating point
    number)pass code is a numberactive is a true or false valueowner’s name is a character
    stringowner’s address is a character stringowner’s birth year is a numberowner’s
    birth month is a character stringowner’s birthday is a number


    **Learning to Read and Write**


    16


    Now that we know what types of data we need to store, let’s see how Java can help
    us. Java has primitive data types for us to use to store our information. We can
    store numbers as int variables,floating point numbers as double, and true or false
    values asboolean.


    If we wanted to store a single character in a variable, we could use the char
    primitive type. Along with those primitive types, Java also allows us to store
    character strings in String variables. There are four more primitive data types
    provided by Java, but they are not necessary for beginners.


    **Store Each Piece of Data in its Own Variable**


    Let’s make nine individual variables to store our bank account’s nine individual
    data points:


    int id = 1234567828;


    double balance = 1301.41;


    int passCode = 9889;


    boolean isActive = true;


    String ownerName = "Lincoln W Daniel";


    String ownerAddress = "325 JavaPlace, UnitedJavas 19081";


    int ownerBirthYear = 1993;


    String ownerBirthMonth = "May";


    int ownerBirthDay = 26;


    System.out.println("Our bank account''s balance: " + balance);


    ***Output***


    *Our account''s balance: $1301.41*'
