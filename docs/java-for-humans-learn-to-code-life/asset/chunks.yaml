    我们的 `GameGUI` 目前设计了三个 `textAreas` 用于显示游戏信息和游戏中正在进行的战斗，一个 `TextField` 用于捕获用户输入，一个
    `ListView` 用于显示游戏中所有角色的排名，一个 `Button` 用于启动游戏，以及另外两个用于游戏游戏的按钮。设置所有这些内容会稍微复杂一些，但当你阅读代码中的文档时，你将能够理解每一个部分。


    ## JavaFX 应用程序


    我们的应用程序运行 JavaFX 组件构建 GUI，并使用 JavaFX 提供的一个非常好的抽象 `Application` 类，以便轻松地启动和运行应用程序程序。我们的
    `GUIGameApplication` 类继承了 JavaFX `Application` 类，并位于我们项目的根节点。它唯一的职责是持有程序的 `main`
    方法。它的 `main` 方法有一个简单的任务：调用 `Application` 类中的 `launch()` 实例方法。当该方法被调用时，它将调用 `Application`
    类中的抽象 `start()` 实例方法来启动我们的应用程序。我们的 `GUIGameApplication` 必须实现这个 `start()` 方法，这使我们能够访问应用的
    `primaryStage` 字段。我们必须将 `primaryStage` 引用传递给我们的 `Game`，它将提供我们的 `GameGUI` 类的实例来显示用于我们游戏的
    JavaFX GUI。


    ## 完成工作


    就这样，我们完成了。你已经学习了许多关于 Java 的知识。事实上，你已经知道了开始构建自己的 Java 应用程序所需的所有知识。记住，最好的学习方法就是通过实践，并在过程中享受乐趣。你接下来的步骤是玩玩我们的游戏，查看本章支持代码中的每个类，阅读文档，然后尝试重新编写整个项目。在那之后，尝试构建你自己的游戏，或者在我们已经拥有的基础上进行添加。你正走在通成功的道路上。在下一章中，我们将看看一些更多有趣的项目，以继续应用你新学到的
    Java 编程知识。


    ## 结论


    到此，你已经学习了开发自己的项目所需的所有 Java 知识。这里有一份你可以开始的项目列表，以便在你新的 Java 知识基础上进行构建：


    ### 人性 Java


    107


    ## 趣味项目


    ### 控制台应用程序：简单


    学习指南应用程序，用于巩固你对书中学习的 Java 概念的理解。这将要求你处理循环、对象、方法和 `HashMap`。一个简单的计算器应用程序，通过进行一些数学运算来加强你对运算符和用户输入输出的知识。


    ### GUI 应用程序：中等


    聊天机器人应用程序。维护一个机器人可以回答你的短语数组，每你在控制台输入内容时，就显示一个。你可以使用一些字符串处理和解析，根据你对机器人说的话决定机器人回复你什么。创建一个
    JavaFX GUI，包含一个 `TextArea` 来显示你与机器人的对话，一个 `TextField` 供你输入消息，以及一个发送消息给机器人的按钮。创建一个你今天必须完成的任务待办列表。你可以拥有与聊天机器人应用程序相同的
    GUI，但多一个允许你删除任务的按钮。


    ### Android 应用程序：中等


    Android 应用程序使用 Java 编写代码。你了解 Java，所以你就了解大部分的 Android。你可以用它做任何事情。想一想要构建什么，也许是上面的想法之一，然后在网上找到教程来学习如何开发
    Android 应用程序。一个有趣的入门应用程序是允许用户给朋友发短信，因为不需要很多代码。像 Java 一样，Android 完成了大部分的繁重工作。


    你甚至可以找到一个教程来学习如何构建像 Snapchat 和 Instagram 等流行应用程序的克隆版本。这些内容都遥不可及，因为它们主要由你在这里学到的概念组成。你唯一不知道的是如何与数据库服务器交互。你可以在过程中学习它。


    ## 赚钱


    一旦你积累了几个项目，就可以开始申请工作了。你可以成为软件工程师、设计师、测试员或文档专家。根据 Glassdoor 2016 年的数据，美国软件工程师的全国平均薪资为
    90,374 美元。这是全职工程师的，但即使在许多科技和金融公司，实习生的的月薪也超过了 7,000 美元。


    如果你不兴趣为别人工作，你也来对地方了。硅谷充斥着像你这样的人，他们不怕梦想，并会尽一切努力实现梦想。你可以启动下一个像 Facebook、LinkedIn
    和 Airbnb 那样的流行社交网络。当你拥有 Java 知识时，可能性是无限的。


    ## 应用知识


    108


    ## 结语：开始的结束


    你正带着你的编程知识通向崭且令人兴奋的时代。现在你已经了 Java，学习更多语言将变得更容易，这些语言可以让你使用每天使用的计算机做更多更有趣的事情。


    *作为人类，我们对自己负有责任，不仅要消费世界的进步，还要创造出更多创新来扩展人类的能力。*


    我迫不及待想看到你用你的 Java 知识做什么了。我很想听到你的反馈，知道你是如何应用新知识的。


    最后，我想留给你关于我们为什么要编程的提醒和更新：


    *我们编程是为了捕获和操纵信息（数据），以为世界产生新的信息供消费。*


    **人性 Java**


