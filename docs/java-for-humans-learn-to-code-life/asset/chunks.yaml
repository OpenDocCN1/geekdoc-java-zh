    int apple = 1;

    int orange = 2;

    boolean appleEqualsOrange = apple == orange;

    boolean appleEqualsApple = apple == apple;

    boolean appleDoesNotEqualOrange = apple != orange;

    System.out.println("Apple does not equal orange: " + appleDoesNotEqualOrange);

    ```


    **Output**

    *Apple does not equal orange: true*


    Here, the first boolean variable, `appleEqualsOrange`, will be set equal to false
    because the comparison made by the equality operator is false — an apple represented
    by the number one (1), does not equal an orange, which is represented by the number
    two (2). However, the last two booleans will be set equal to truebecause the comparisons
    made by the equality operators in the last two lines are evaluated to true; an
    apple (1) is equal to another apple, and an apple (1) is definitely not equal
    to an orange (2).


    ## Relational Operators


    Like in math, we can use relational operators to compare, or gauge the relation
    between two data points in Java. We can check if one data point is greater than
    or less than another by using the `>` or `<` operators respectively:


    ```

    int one = 1;

    int two = 2;

    boolean twoIsGreaterThanOne = two > one;

    boolean oneIsLessThanTwo = one < two;

    ```


    Both of those boolean variables will be set to true when the code is executed
    because the comparisons made by the relational operators are true. Further, we
    can check if a data point is greater than or equal to another as well as if a
    data point is less than or equal to another by use of the `>=` and `<=` operators
    respectively:


    ```

    int three = 3;

    int twenty = 20;

    boolean threeIsLessThanOrEqualToTwenty = three <= twenty;

    boolean twentyIsGreaterThanorEqualToThree = twenty >= three;

    boolean oneIsLessThanOrEqualToOne = 1 <= 1;

    boolean twoIsLessThanOrEqualToOne = 2 <= 1;

    System.out.println("Two is less than or equal to one: " + twoIsLessThanOrEqualToOne);

    ```


    **Output**

    *Two is less than or equal to one: false*


    The first three boolean variables will be set equal to true because the comparisons
    made by the relational operators are true. However, the last one will be false
    because we all know two is not less than nor equal to one. In later chapters,
    we will learn how to use our equality and relational operators to make decisions
    and control the flow of our code.


    ## Combining Operators


    We can combine operators to make more powerful operators, too. With combined operators,
    we can clean up and optimize our code. We can increase or decrease the value of
    a variable by doing the following:


    ```

    int count = 0;

    /*Combining Additive Operators & the Assignment Operator*/

    count++; //count now equals (0 + 1) = 1

    count += 6; //count now equals (1 + 6) = 7

    count--; //count now equals (7 - 1) = 6

    count -= 2; //count now equals (6 - 2) = 4

    /*Coming Multiplicative Operators with the Assignment Operator*/

    count *= 5; //count now equals (4 * 5) = 20;

    count /= 10; //count now equals (20 / 10) = 2;

    ```


    ### Learning to Read and Write


    The `++` operator says, “I see your current numerical value and raise it by one,”
    while the `--` operator decreases the current value of a variable holding a number
    by one. The `+=` operator adds the number on its right to the value of the variable
    on its left and saves the sum in the variable; the `-=` `*=` and `/=` operators
    work similarly.


    ### Others


    There are a few others that are useful, but they require more explanation than
    is within the scope of this chapter. In later chapters, you will learn how to
    logically check conditions of data by combining relational and equality operators
    with logical operators in order to make decisions with control flow statements
    (decision-making statements and looping statements). These are powerful tools
    that allow our code to do some things sometimes and other things other times.


