    is that we enjoy sharing. We like to share knowledge, code, talent, and anything
    necessary to advance technological innovation in our world.


    I’m a strong believer in learning by doing. Try to build some things and do some
    Google queries to fix whatever you break. One of the best ways to learn how to
    code is to dive in and build something from the ground up. Use the resources available
    to you to facilitate and expedite your learning process. When you get stuck, stand
    on the shoulders of the giants who came before you to get yourself back on the
    road to success. In this chapter, we will take a look at how you can take advantage
    of your resources to teach yourself how to code beyond what any book or tutorial
    can teach you.


    As humans, we are limited to only accumulating and maintaining a limited amount
    of knowledge. It is important to realize that the world’s knowledge is infinitely
    large and that extends to our knowledge of programming languages and techniques.
    For that reason, the ability to learn is far greater than possessing all of human
    knowledge at any given moment in time without being able to learn more as it expands.


    As you learn and go through your career as a software developer, you’ll have to
    continue learning. I’ve worked with incredibly smart people from my college professors
    to my leaders at companies like `IBM` and they all share two things in common:
    they’ve had decades of programming experience and they still Google when they
    get stuck. Further, they are constantly learning new skills and concepts.

