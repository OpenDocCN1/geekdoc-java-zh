  trans: "\n\n# 学习构建\n\n## 子类与继承\n\n拥有一个父类（superclass）意味着扩展或继承一个类。因此，成为一个子类意味着扩展一个类。`Java`\
    \ 中的每个类都只能有一个直接父类，并从那里继承一些字段和方法。然而，一个拥有父类的类也可以被继承，从而形成继承链；这被称为类层次结构（class hierarchy）。\n\
    \n类从其父类继承所有未声明为私有（private）的字段和方法。这在子类、其父类以及类的使用者之间创建了一个契约。有了这个契约，用户可以预期父类的行为出现在其子类中。然而，契约是单向的。子类中声明的字段和方法除非在父类中也声明，否则在父类中是不可用的。\n\
    \n在 Java 中扩展一个类非常简单。你只需要选择一个要扩展的类，并在类声明的末尾、左大括号之前编写 `extends` 关键字，并在后面跟上要扩展的类名：\n\
    \n```java\npublic class Human {\n    //添加字段和方法\n}\n\npublic class Archer extends\
    \ Human {\n    // 继承其父类 Human 的字段和方法\n    // 为此类添加更多字段和方法\n}\n```\n\n在那个代码段中，我们有一个\
    \ `Human` 类，它在理论上拥有字段和方法。我们还有一个 `Archer` 类，它在理论上也有自己的字段和方法，并扩展了我们的 `Human` 类以继承它的字段和方法。让我们为我们的\
    \ `Human` 类添加一些字段和方法，看看 `Archer` 如何能够继承它们：\n\n```java\npublic class Human {\n\
    \    protected String name;\n    protected double health = 100.0;\n    protected\
    \ long experience = 0;\n    protected int attackPower = 1;\n\n    public Human(String\
    \ name) {\n        this.name = name;\n        gainExperience(1);\n    }\n\n  \
    \  public long gainExperience(long experience) {\n        this.experience += experience;\n\
    \        return experience;\n    }\n\n    public long addAttackPower(long attackPower)\
    \ {\n        this.attackPower += attackPower;\n        return attackPower;\n \
    \   }\n\n    public double heal(double additionalHealth) {\n        health +=\
    \ additionalHealth;\n        return health;\n    }\n\n    public void attack(Human\
    \ opponent) {\n        opponent.decreaseHealth(attackPower);\n    }\n\n    private\
    \ void decreaseHealth(int attackPower) {\n        health -= attackPower;\n   \
    \ }\n\n    public void jump() {\n        System.out.println(\"Jumped up\");\n\
    \    }\n}\n```\n\n现在，我们 `Human` 类每个子类的实例都能够攻击其他 `Human` 实例、被攻击、治疗、跳跃、获得经验并增加它们的攻击力。注意我说我们人类类每个子类的实例都能够攻击其他\
    \ `Human` 实例。我之所以这样做是因为每个类的实例也是该类父类的实例。\n\n我们 `Human` 类的 `attack()` 实例方法接受一个 `Human`\
    \ 作为参数并消耗它的健康值。这非常棒，因为我们只需要写一个攻击方法，就可以适用于我们 `Human` 类的所有实例，无论该实例是 `Archer`、`Monk`、`Wizard`\
    \ 或任何其他扩展了我们 `Human`类的类。这就是多态（polymorphism）在发挥作用，我们稍后会学习更多。简单来说，多态的想法是我们可以将许多不同的类归为一类，例如说所有的手弓手、僧侣和魔法师都是人类。它们都通过了多个一个“是”（is-a）的测试。如果没有继承，我们必须为可能接触到的每个类编写不同的攻击方法。那太糟糕了。\n\
    \n## 方法重写（Method Overriding）\n\n所有扩展我们 `Human` 类将共享相同的攻击方法。这意味着我们 `Human` 类的每个子类的攻击方式与我们\
    \ `Human` 类的其他子类相同。这并不是一个好的设计，因为用户期望 `Warrior`（战士）用剑攻击，而 `Archer`（手弓手）用弓和箭攻击。Java\
    \ 中的方法重写允许我们实现这样的设计。\n\n如果有必要，子类可以重写其父类的方法来实现它自己的行为。方法重写允许子类决定如何通过继承契约来实现用户预期的行为。在我们的游戏中，用户会期望所有类都能攻击其他类，但他们也期望每个类都以独特的方式进行攻击。因此，我们\
    \ `Human` 类的每个子类都应该重写 `attack()` 实例方法来实现它们自己的攻击行为。这在 Java 中非常简单。要重写父类的方法，我们只需要在子类中的方法上方添加\
    \ `@Override` 注解：\n\n```java\npublic class FireArcher extends Archer {\n    int\
    \ firePower = 1;\n    ...\n    @Override\n    public void attack(Human opponent)\
    \ {\n        System.out.println(\"Attacking \" + opponent.getName() + \" with\
    \ fire arrows!\");\n        opponent.decreaseHealth(attackPower + firePower);\n\
    \    }\n}\n\npublic class Warrior extends Human {\n    ...\n    @Override\n  \
    \  public void attack(Human opponent) {\n        System.out.println(\"Attacking\
    \ \" + opponent.getName() + \" with my sword!\");\n        super.attack(opponent);\n\
    \    }\n}\n\npublic class Monk extends Human {...}\n```\n\n**注意！**\n\n注意 `FireArcher`\
    \ 类扩展了 `Archer` 类，而 `Archer` 类扩展了 `Human` 类。这是一个从底部到部的类层次结构示例：\n`FireArcher` →\
    \ `Archer` → `Human`\n\n在那个代码段中，我们有 `FireArcher`、`Warrior` 和 `Monk` 类。三个类都扩展了\
