    ![](img/cover.jpeg)


    # 人性化 Java (Java for Humans)

    学习编程人生

    让我们开启通往新生活的之旅，去开发改变世界的软件。


    ## 献辞

    *本书献给我的父母，感谢他们一直激励我不断突破、付出更多。*


    *同时也献给我的第一位计算机科学教授，他教了我 Java 编程的基础。James Early 博士自从我们在那门入门计算机科学课程相识以来，一直是我非常出色的教授和导师。我永远感激他，培养了我对编程的热情，并帮助我建立了对软件开发行业的热爱。*


    *我以现在的状态写下这本书——通过将 Java 和编程概念与人类体验联系起来——因为我从 Early 博士那里学到，教初者的最好方法就是学会说他们的语言。*


    ## 人性化 Java

    学习编程人生

    ModernNerd

    用更符合人性、更易共鸣的方式教授编程。


