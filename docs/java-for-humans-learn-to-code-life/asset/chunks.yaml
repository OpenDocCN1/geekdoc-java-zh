    **Method Access Modifiers**


    A public method can be accessed from anywhere in our program, butprivate methods
    can only be accessed from within the class it belongs to. A protected method can
    be accessed from any class within the same package as the class the method belongs
    to. Those access modifiers work the same on both instance and static methods of
    a class. Intuitively, a method can only be accessed from the parts of a program
    where the method’s class can be accessed.


    **Java for Humans**


    45


    **Method Return Types**


    A method must specify a return type in its signature. A return type tells the
    compiler what datatype will be returned by the method. If the method will not
    return anything, we can specify void as the return type. Void means that the method
    will do what it has to do and return nothing to the caller. Otherwise, we must
    specify a datatype to be returned. We can return Java primitives, datatypes provided
    by Java, including a String, and custom datatypes, such as classes we create.
    Further, we can return data structures like arrays, LinkedLists, and HashMaps.
    We will learn more about data structures soon, but for now, know that they are
    simply datatypes that hold a set of data of the same type.


    **Method Parameters**'
