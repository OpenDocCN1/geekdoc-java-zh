    # Chapter 3

    ## Learning to Classify Data


    ### Classes and Objects


    In your life, you’ve learned about many types of animals, people, buildings, sports,
    schools, and so on. In English class, we refer to these “people, places, or things”
    as nouns. In `Java`, we can refer to them as objects — you can think about objects
    in `Java` as you do about nouns in English.


    Java programs revolve around objects like English sentences revolve around nouns.
    You can describe a noun with adjectives and you can describe an object with fields,
    otherwise known as attributes or instance variables. Nouns perform actions with
    verbs just as objects perform actions with functions, or methods.


    ## Why Classes Are Important & Useful


    Java is the most widely used object-oriented programming(OOP) language in 2016.
    OOP is a programming model based on the concept of “objects” which are simply
    data structures that have fields, or attributes, that hold information (data)
    about themselves and methods they can perform. The attributes of an object are
    variables that hold information, or data, about the object while its methods are
    ways the object can manipulate its data to create new data. This is important
    because we can use this idea of structured data to write clean, flexible, and
    maintainable code.


    While everything in Java is not an object, most things revolve around objects
    in Java like the contents of an English sentence revolve around the noun(s) of
    the sentence. For this reason, it is important for us to know how to create objects
    and make use of them. This is where classes come in.

