    instance fields, implement shared methods, and declare the abstract methods that
    all subclasses must implement.


    **Note!**


    From bottom to top, the hierarchy of concrete classes, abstract classes, and interface
    goes like so:


    concrete class → abstract class → interface.


    If a class extends a superclass — concrete or abstract — that implements an interface,
    you can declare the necessary methods from the interface in the superclass. Doing
    this will fulfill the subclass’s duty to abide by the contract between it and
    the interface because your subclass will inherit the necessary methods of the
    contract from its superclass. Alternatively, the class can implement the interface
    methods on its own.


