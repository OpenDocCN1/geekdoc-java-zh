    \n### 继承入门\n\n在本章的早些时候，我说过 `out` 既是一个 `OutputStream` 也是一个 `PrintStream` 实例。我的意思是\
    \ `out` 是 `PrintStream` 的实例，它从其父类 `OutputStream` 继承了字段和方法。我们很快就会学习更多关于继承和类扩展的知识，但现在只需要知道\
    \ `PrintStream` 是 `OutputStream` 即可。如果你在那个点遇到了一些困难，不要担心，我们很快就会提到它。\n\n面向人类的 Java\n\
    \n73\n\n### 第 5 章\n\n### 学习构建\n\n### 类继承\n\n继承是编程中所有强大的概念之一。没有它，编写某些事情将非常困难。继承之所以强大，是因为它允许我们重用类的代码。在\
    \ Java 中，一个类可以继承另一个类。这允许子类重用父类定义的公有字段和方法。在 `Conquer` 中，你可以是 `Archer`、`Monk`、`Ninja`、`Warrior`\
    \ 或 `Taoist`。继承之所以很酷，是因为它允许你成为任何东西，并且在同一时间又是相同的。这难道不很棒吗？让我解释一下。\n\n在 `Conquer`\
    \ 中，你可以是 `Archer`、`Monk`、`Ninja`、`Warrior` 或 `Taoist`。虽然没有 `Human` 类，但显然，上述所有类都是具有独特超能力的人。\n\
    \n`Archer` 可以飞行并射箭，`Ninja` 可以快速奔跑并攻击，`Warrior` 可以挥舞剑盾，而 `Taoist` 可以执行魔法并治愈他人。虽然这些类看起来不同，但它们比你想象的要相似。每个类都扩展了\
    \ `Human` 的能力。`Human` 可以跳跃、攻击和自愈。此外，每个人类都有名字、生命值、攻击力和经验。这些加起来有两个属性和五个函数。这基本上就是创建像\
    \ `Conquer` 游戏所需的所有内容。\n\n"
- fmt: "\n# Learning to Build\n\n## Subclassing & Inheritance\n\nTo have a superclass\
    \ is to extend, or inherit from, a class. Thus, to be a subclass is to extend\
    \ a class. Every class in `Java` can have only one direct superclass from which\
    \ it inherits some of its fields and methods. However, a class that has a superclass\
    \ can also be inherited from as to create a chain of inheritance; this is known\
    \ as class hierarchy.\n\nFrom its superclass, a class inherits all fields and\
    \ methods that are not declared as private. This creates a contract between the\
    \ subclass, its superclass, and the user of the classes. With the contract, the\
    \ user can expect the behavior of the superclass to be present in its subclasses.\
    \ However, the contract only goes one way. Fields and methods declared in a subclass\
    \ are not available in the superclass unless they are declared there, too.\n\n\
    Extending a class is easy in Java. All you have to do is choose a class to extend\
    \ and write the keyword `extends` followed by the name of the class to extend\
    \ at the end of your class declaration but before the opening closing brace:\n\
    \n```java\npublic class Human {\n    //add fields and methods\n}\n\npublic class\
    \ Archer extends Human {\n    //inherits fields and methods of its Human superclass\n\
    \    //add more fields and methods for this class\n}\n```\n\nIn that code snippet,\
    \ we have a `Human` class which, in theory, has fields and methods. We also have\
    \ a `Archer` class which, also in theory, has its own fields and methods and extends\
    \ our `Human` class to inherit its fields and methods. Let’s add some fields and\
    \ methods to our `Human` class to see how the `Archer` can inherit them:\n\n```java\n\
    public class Human {\n    protected String name;\n    protected double health\
    \ = 100.0;\n    protected long experience = 0;\n    protected int attackPower\
    \ = 1;\n\n    public Human(String name) {\n        this.name = name;\n       \
    \ gainExperience(1);\n    }\n\n    public long gainExperience(long experience)\
    \ {\n        this.experience += experience;\n        return experience;\n    }\n\
    \n    public long addAttackPower(long attackPower) {\n        this.attackPower\
    \ += attackPower;\n        return attackPower;\n    }\n\n    public double heal(double\
    \ additionalHealth) {\n        health += additionalHealth;\n        return health;\n\
    \    }\n\n    public void attack(Human opponent) {\n        opponent.decreaseHealth(attackPower);\n\
    \    }\n\n    private void decreaseHealth(int attackPower) {\n        health -=\
    \ attackPower;\n    }\n\n    public void jump() {\n        System.out.println(\"\
    Jumped up\");\n    }\n}\n```\n\nNow, instances of every subclass of our `Human`\
    \ class will be able to attack other `Human` instances, be attacked, heal, jump,\
    \ gain experience, and increase their attack power. Notice that I said that instances\
    \ of every subclass of our human class will be able to attack other `Human` instances.\
    \ I say this because every instance of a class is also an instance of the class’s\
    \ superclass.\n\nThe `attack()` instance method of our `Human` class takes a `Human``\
    \ as a parameter and drains its health. This is great because we only need to\
    \ write one attack method that will work on all instances of our `Human` class\
    \ regardless of the instance being an `Archer`, `Monk`, `Wizard`, or any other\
    \ class that extends our `Human` class. This is polymorphism at work and we will\
    \ learn more about it later. Simply put, polymorphism is the idea that we can\
    \ group many different classes together as being one class, such as saying all\
    \ archers, monks, and wizards are also humans. They all pass more than one is-a\
    \ test. Without inheritance, we would have to write a different attack method\
    \ for each class we may come in contact with. That would be awful.\n\n## Method\
    \ Overriding\n\nAll classes that extend our `Human` class will share the same\
    \ attack method. That means that every subclass of our `Human` class will attack\
    \ the same way as the other subclasses of our `Human` class. This wouldn’t be\
    \ such a good design because a user is expecting a `Warrior` to attack with a\
    \ sword and an `Archer` to attack with a bow and arrow. Method overriding in Java\
    \ allows us to accomplish such a design.\n\nA subclass can override the methods\
    \ of its superclass to implement its own behavior if it is necessary. Method overriding\
    \ allows a subclass to decide how to implement behavior expected by the user through\
    \ the inheritance contract. In our game, a user will expect that all classes can\
    \ attack other classes, but they also expect that each class attacks in a unique\
    \ way. Therefore, each subclass of our `Human` class should override the `attack()`\
    \ instance method to implement its own attack behavior. This is easy in Java.\
    \ All we have to do to override a method from a superclass is to add the `@Override`\
    \ annotation above the method in the subclass:\n\n```java\npublic class FireArcher\
    \ extends Archer {\n    int firePower = 1;\n    ...\n    @Override\n    public\
    \ void attack(Human opponent) {\n        System.out.println(\"Attacking \" + opponent.getName()\
    \ + \" with fire arrows!\");\n        opponent.decreaseHealth(attackPower + firePower);\n\
    \    }\n}\n\npublic class Warrior extends Human {\n    ...\n    @Override\n  \
    \  public void attack(Human opponent) {\n        System.out.println(\"Attacking\
    \ \" + opponent.getName() + \" with my sword!\");\n        super.attack(opponent);\n\
    \    }\n}\n\npublic class Monk extends Human {...}\n```\n\n**Note!**\n\nNotice\
    \ that the `FireArcher` class extends the `Archer` class which extends the `Human`\
    \ class. This is an example of a class hierarchy from bottom to top:\n`FireArcher`\
    \ → `Archer` → `Human`.\n\nIn that code snippet, we have a `FireArcher`, `Warrior`,\
    \ and `Monk` class. All three classes extend the `Human` class and inherit its\
    \ fields and methods, but only the `FireArcher` and the `Warrior` class override\
    \ the `attack()` instance method of the `Human` class. The `Monk` class doesn’t\
    \ do anything special when it attacks, so it is fine with the basic `Human` `attack()`\
    \ method.\n\nWhen we override methods of the superclass, we can choose to invoke\
    \ the superclass’s implementation of that method by accessing the super class\
    \ through the `super` keyword provided by Java and calling the method on it at\
    \ any point in the method. We do this at the end of the overridden `attack()`\
    \ method in the `Warrior` class but not in the `FireArcher` class because a `FireArcher`\
    \ deals damage to opponents differently than most other classes; with its fire,\
    \ a `FireArcher` deals additional damage to an opponent’s health.\n\nFinally,\
    \ because an instance of a class is also an instance of its superclass, a subclass\
    \ must implement at least one of the constructor methods that are declared in\
    \ its superclass and/or invoke the implementation of one of its superclass’s constructors\
    \ by accessing the super class through the `super` keyword:\n\n```java\npublic\
    \ class Archer extends Human {\n    private int numArrows = 0;\n    //1\\. this\
    \ constructor works\n    public Archer(String name) {\n        super(name);\n\
    \        findArrows();\n    }\n\n    //2\\. this constructor works\n    public\
    \ Archer(String name, int startingArrows) {\n        this.name = name;\n     \
    \   numArrows = startingArrows;\n    }\n\n    private void findArrows() {\n  \
    \      System.out.println(\"Looking for arrows\");\n    }\n}\n```\n\nWe must call\
    \ the superclass’s constructor at the start in of the subclass’s constructor in\
    \ at least one of the subclass’s constructors. In the second constructor, we don’t\
    \ have to call the superclass’s constructor because it is called in the first\
    \ constructor. There are many other rules surrounding the constructors of a superclass\
    \ and its subclasses, but this is enough to get you started. Try to see how you\
    \ can break the contract and you will quickly learn the other rules. Finally,\
    \ notice that we accessed and set the `name`instance field in the `Archer` class’s\
    \ second constructor although it is not declared directly in the `Archer` class.\
    \ This is only possible because that field, as we learned earlier, is inherited\
    \ from the `Human` superclass.\n\nWe can now create instances of all our classes\
    \ — `Human`, `Archer`, `Warrior`, and `FireArcher` — and expect them to share\
    \ methods and fields while behaving distinctively:\n\n```java\npublic class Main\
    \ {\n    public static void main(String[] args){\n        Human human = new Human(\"\
    Lisa\");\n        Human archer = new Archer(\"Samuel\");\n        FireArcher fireArcher\
    \ = new FireArcher(\"Emmanuel\");\n    }\n}\n```\n"
