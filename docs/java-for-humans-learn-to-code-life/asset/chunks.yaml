    \nif(messageLength <= 140) {\n    // 发送消息\n}\n```\n\n### 获取字符串中字符的索引\n\n如果你想知道某个字符在字符串中首次出现的的索引，可以使用\
    \ `String` 实例上的 `indexOf()` 实例方法。记住 Java 和其他编程语言中的索引是从零开始的，我们可以尝试获取包含整个字母表的字符串中字母“D”的索引：\n\
