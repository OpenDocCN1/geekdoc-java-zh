  trans: "\nJava 中的类（class）仅仅是创建具有相似属性和行为对象的模板。Java 类可以被视为一个模板，定义了从该类构建的对象可以展现的属性和行为。基于此，我们可以说对象仅仅是类的实例（instance）。从一个类中，我们可以创建或构建许多实例，每个实例都拥有该类其他实例所拥有的属性和功能。因此，人是\
    \ `Human` 类的实例，在本书出版时，世界上有 70 亿个 `Human` 类的实例。\n\n## 从类创建对象\n\n在 Java 中创建一个类非常简单。每个类都有三个关键部分，但只有一个是总是必须的。类可以拥有字段（fields，或属性）、方法（methods）或行为（behaviors），并且必须至少有一个构造函数（constructor）。\n\
    \n### 人类学 Java\n31\n\n我们可以像这样创建一个定义了人类属性和行为的类：\n\n```java\npublic class Human\
    \ {\n\n//TODO: 添加属性\n//TODO: 添加构造函数\n//TODO: 添加方法\n}\n```\n\n在这里，我们创建了一个名为 `Human`\
    \ 的简单类。第一行开头的 `public` 关键字意味着该类可以从程序的任何地方访问，且类名使用了“大驼峰命名法”（upper camel case）。在左括号（`{`）和右括号（`}`）之间，我们必须定义从该类构建的任何对象或实例可以拥有的属性以及它可以执行的方法。现在，在我们从该类创建对象之前，我们需要完成它的定义。\n\
    \n## 类字段：实例变量\n\n字段是存储数据的变量，用于描述类以及从该类构建的任何对象的属性。人类会拥有的字段包括姓名、年龄和身高。我们通过在类顶部声明字段来向类添加字段，如下：\n\
    \n```java\npublic class Human {\n\nString name;\nint age;\nint height;\n\n...\n\
    }\n```\n\n这些字段将持有我们 `Human` 类每个实例的信息，但它们目前还没有这些信息，因为类仅仅是一个模板。我们需要创建一个构造函数，允许任何调用它的人传递关于他们正在构建的\
    \ `Human` 类实例的必要信息。在构建类实例时，我们将给定的信息（值）赋值给实例的实例变量。\n\n## 类构造函数\n\n类必须有一个构造函数，它每次被调用时都用于从类创建一个新对象。从类创建的每个对象都称为该类的实例。构造函数仅仅是一个方法，可以从程序的不同部分调用，以创建定义类的实例。\n\
    \n虽然我们还没有介绍方法，但了解方法具有返回类型是有好处的，返回类型告诉调用者调用方法后预期返回什么数据类型。然而，某些方法完全不返回任何内容。我们将在“方法”部分学习更多关于返回类型。\n\
    \n### 学习分类数据\n32\n\n构造函数没有显式的返回类型，因为它是一个工厂方法（factory method），这意味着它创建类的新实例并将新实例返回给调用者。类的构造函数的名称必须与类名相同，并且区分大小写。最后，构造函数可以接受调用者的信息作为参数，这些参数将赋值给正在创建的实例的实例字段。我们可以为我们的\
    \ `Human` 类创建一个构造函数，要求调用者提供新 `Human` 实例的姓名、年龄和身高，如下：\n\n```java\npublic class\
    \ Human {\n\n...\n\n//此类的构造函数\npublic Human(String name,int age, int height){\n\
    \n//使用提供的姓名设置此对象的姓名\nthis.name = name;\n\n//使用提供的年龄设置此对象的年龄\nthis.age = age;\n\
    \n//使用提供的身高设置此对象的身高\nthis.height = height;\n\n}\n}\n```\n\n构造函数可以被比作接生你新对象的医生，医生所要求的仅仅是让你填写出生证明来描述你的新对象。构造函数的参数表示，如果任何人想创建我们\
    \ `Human` 类的实例，他们必须为新的 `Human` 实例提供姓名、年龄和身高作为参数，并将将使用这些信息来初始化新实例的实例变量——`name`、`age`\
    \ 和 `height` 字段。像任何其他方法一样，我们可以在构造函数中处理数据，而不仅仅是为新对象的字段赋值赋值，但保持构造函数尽可能短是一个良好的习惯。一旦构造函数完成新对象的创建，它就会将其返回给调用者以便保存到变量中以后使用：\n\
    \n```java\npublic static main(String[] args) {\n    Human newHuman = new Human(\"\
    Lincoln\", 22, 5);\n}\n```\n\n`this` 关键字告诉编译器我们正在引用该类的当前实例：如果我们想引用这个新 `Human`\
    \ 对象的姓名字段，我们会说 `this.name`，这样编译器就不会将其与作为参数传递给构造方法方法的 `name` 参数混淆了。\n\n### 人类学\
    \ Java\n33\n\n## 实例方法\n\n记住，句子中的名词通过动词执行动作，而 Java 程序中的对象通过使用它们的方法执行动作。类定义了从该类构建的任何对象都可以执行的方法。这些方法被称为实例方法（instance\
    \ methods），因为它们只能由类的实例执行。我们都是 `Human` 类的实例，所以我们共享功能，或方法。我们会说话、跑步、跳跃、睡觉、行走、挥手、工作，等等。所有这些动作都是由我们人类生物学和解剖学——即我们的类——预定义的。左括号和右括号定义了一个范围：左括号开始范围，右括号结束范围。类和方法等都有范围，类范围是最高级别的范围。虽然我们可以在类范围内启动方法范围，但我们不能在方法范围内启动方法范围。\n\
    \n我们可以通过在类的左括号和右括号（即范围）之间声明来为类添加方法。让我们为 Human 类添加一些方法，让我们的 Human 对象更具功能性：\n\n\
    ```java\npublic class Human {\n\n...\n\n//每个 Human 实例都可以说话\npublic void speak(){\n\
    \    System.out.println(\"Hi! I am \" + name + \".\");\n}\n\n//设置 Human 对象的年龄\n\
    public void setName(String newName) {\n    this.name = newName;\n}\n\n//返回 Human\
    \ 对象的年龄\npublic int getAge() {return age;}\n}\n```\n\n我们将在后面的章节中详细详细介绍方法，所以现在不需要完全理解这些细节。现在重要的是方法允许对象执行操作。\n"
- fmt: "\nThink of the world like a program. There are seven billion instances of\
    \ the `Human` class, perhaps ten billion instances of the `AppleTree` class, five\
    \ billion of the `Car` class, and so on for every object found in nature. There\
    \ are some `Human` instances that execute medical functions to keep everyone healthy,\
    \ some conduct law functions to keep us safe, and some education functions to\
    \ advance our knowledge. Further, we create instances of the `AppleTree` class\
    \ to provide us apples to eat and apple juice to drink, and we need instances\
    \ of the `Car` class to get us where we need to go.\n\nIf we make an instance\
    \ of a `Car`, we can choose its color and customize its speed. If we make an instance\
    \ of a `Human`, we get to give it a name, and a unique identification number,\
    \ and if we make an instance of a `AppleTree`, we get to choose what color the\
    \ apples will be. Without instances of these classes, we couldn’t use them to\
    \ their full potential and customize them as we like. Usually, we want to be able\
    \ to create objects from our classes to use them in our programs, but sometimes\
    \ we only need our classes to hold information and perform functions universal\
    \ to the class itself. In these cases, we don’t need instances of the class to\
    \ hold the information or run the functions. Such information can be held in static\
    \ class fields and the functions can be static class methods.\n\n## Why Static\
    \ Fields & Methods Are Important & Useful\n\nThe `static` keyword in `Java` can\
    \ be applied to both fields and methods of a class. A field or method of a class\
    \ that is `static` can be accessed without an instance of the class. Think of\
    \ a situation where you want to store information that is the same for everyone\
    \ and functions that behave the same way for everyone. A great example, again,\
    \ is the `Human` class.\n\nA lot of functionalities we, as instances of the `Human`\
    \ class, perform are functionalities universal to us all. We all speak, laugh,\
    \ cry, eat, and walk one step at a time. Because these functions are universal\
    \ and not specific to any individual, they can be static methods. Further, our\
    \ governments keep universal information about all of us in order to keep records\
    \ for the future. They may record information about how many instances of humans\
    \ exists in the world at any given time, how many are African, North American,\
    \ Russian, European, Australian, Asian, and so forth. Other universal information\
    \ may include how many of us are right handed or left handed, how many of us are\
    \ male or female, and how many of us have a college degree. Such data points are\
    \ universal and not specific to any one instance of the `Human` class, so we can\
    \ store them in static fields.\n\n## Java for Humans\n35\n\n### Static Fields\n\
    \nBecause static fields can be accessed without an instance of the class, they\
    \ are good means of storing information that is universal to a class, such as\
    \ a count of how many instances of the class have been created. To make a static\
    \ field, you simply place the `static` keyword before the declaration of a class’s\
    \ member variable, or field:\n\n```java\npublic class Human {\n    public static\
    \ int numHumans = 7;\n    ...\n}\n```\n\nOnce that static field exists, you can\
    \ access it from outside or inside of the class without an instance of the class.\
    \ When accessing it, you can simply get or change its value as you wish. The `public`\
    \ modifier means that it can be accessed from anywhere in your program that the\
    \ class can be accessed from. We will learn more about access modifiers soon.\
    \ Whenever we make a new instance of the `Human` class, we could have the `numHumans`\
    \ static field increased by one so that our whole program knows there’s a new\
    \ human in town to work with. Because the `Human` class is public and so is the\
    \ static field, any part of our program can access that static field by doing\
    \ the following:\n\n```java\nint numHumansInWorld = Human.numHumans;\n```\n\n\
    The way we accessed the field from the class is called dot notation, and we will\
    \ learn more about this in the `Dot Notation` section.\n\n### Static Methods\n\
    \nClasses have three main types of methods: the factory (constructor) method,\
    \ instance methods, and static methods. A static method of a class can be called\
    \ without an instance of that class. As a result, static methods don’t have any\
    \ access to instance variables, or instance fields, because instance variables\
    \ store information about an instance of a class. Likewise, static methods do\
    \ not have access to the `this` keyword in `Java` because `this` refers to the\
    \ current instance of a class, which is not present in the scope of a static method.\
    \ Further, instance methods of a class cannot be called from static methods of\
    \ that class because there is no instance of the class present in a static method.\
    \ However, if an instance of the class is passed to the static method, that instance\
    \ is free as usual to perform its instance methods in the scope of the static\
    \ method.\n\nRemember that we use static methods for functionality that is universal\
    \ to a class. Static methods do not care about instances of the class or their\
    \ state. If we have an instance of our `Human` class, we can call a method to\
    \ make it change its name or speak its name. However, if we only want to use our\
    \ `Human` class to run some calculations to determine the DNA of a human or to\
    \ check how many humans currently exist in the world, we can make static methods\
    \ to do that. Let’s try the latter:\n\n## Learning to Classify Data\n36\n\n```java\n\
    public class Human {\n    private static int numHumans = 0;\n\n    public Human(String\
    \ name){\n        this.name = name;\n        numHumans++;\n    }\n\n    public\
    \ static int getNumHumans(){\n        return numHumans;\n    }\n    ...\n}\n```\n\
    \nIf we want to access the static `numHumans` field of the `Human` class from\
    \ outside of the `Human` class this time, we must call the `getNumHumans()` method\
    \ because we made the static field private by using the `private` access modifier,\
    \ which means the field can only be accessed from within the class its a member\
    \ of, or belongs to. This is usually a wise design pattern to ensure that your\
    \ fields are only used how we want; the `numHumans` field in our `Human` class\
    \ can only be changed from within the class and accessed through the `getNumHumans()`\
    \ static method. We can call the static method from outside or inside the class\
    \ because it is public, and it will return to us the value of the static field\
    \ holding the number of Human instances that exist in our program:\n\n```java\n\
    int numHumansInWorld = Human.getNumHumans();\n```\n\nThat will return the value\
    \ of the static `numHumans` field in the `Human` class and store it in the local\
    \ `numHumansInWorld` variable for later use.\n\nFinally, instances of a class\
    \ can call the public static methods of that class from anywhere in the program,\
    \ but an instance of a class can only call its private static methods, like any\
    \ other private method, from within the class. If we have a static method that\
    \ simply serves to increment the static `numHumans` field in our `Human` class\
    \ by one and return the new value each time it is called, it’d be best to have\
    \ that declared as a private method so that it can only be called within the `Human`\
    \ class either by instances of the `Human` class or from other static methods:\n\
    \n## Java for Humans\n37\n\n```java\npublic class Human {\n    private static\
    \ int numHumans = 0;\n    private String name = name;\n    ...\n\n    public Human(String\
    \ name){\n        this.name = name;\n        incrementNumHumansAndPrint();\n \
    \   }\n\n    private static int incrementNumHumans(){\n        return numHumans\
    \ = numHumans + 1;\n    }\n\n    private static void incrementNumHumansAndPrint(){\n\
    \        System.out.println(\"There are now \" + incrementNumHumans()\n      \
    \  + \" Human instances in society.\");\n    }\n\n    ...\n}\n```\n"
