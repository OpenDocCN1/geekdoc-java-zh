    **Generating Random Numbers**


    As a kid, you may have played many games to fill your day with some fun and excitement.
    In some cases, the most exciting games may have been the ones that employed some
    bit of randomness and unpredictability. Board games like monopoly use a dice to
    create randomness in the outcome of the game. The series of random numbers you
    roll determine how successful you are in the game. Computer games, on the other
    hand, don’t have access to a physical dice, so there must be another way for them
    to create randomness. For that reason, Java and other programming languages have
    random number generators we can use to create randomness in our programs.'
