    **输出**


    `Our account''s new balance: $1901.91`


    在向账户余额中添加 `$600.50` 后，余额从 `$1301.41` 变为 `$1901.91`，并体现在我们的 `balancevariable` 中。随着我们学习更多奇妙的
    Java 概念，我们将看到账户余额大幅增加。学会如何增加账户余额绝对是非常值得的。


    # 注释


    如果你拥有世界上最好的记忆力，你可能会记住你所做的每件事、为什么这么做、怎么做以及何时做。你甚至可以在在他人附近时向他们讲述你的经历。如果是这样，你就非常幸运了。然而，当你不在他们身边怎么办？你和其他人将如何记住为了让某行代码运行而所做的努力，以及它本应该做什么的呢？交给计算机吧。


    ## 为什么注释重要且有用


    计算机最擅长记住你给它的信息，并在你不在时将这些信息与他人分享。Java 的设计者为了高效编程，充分利用了这一原则。Java 允许你在代码中编写注释，以帮助你和你的团队记住代码的功能。对于人们可能难以理解的每一段代码，注释都非常有用。注释最棒的部分是它们不会被编译器编译。换句话说，注释不会影响代码的执行。它们就像思想气泡。


    作为程序员，你的目标是编写清洁、有效且易于人类理解的代码。注释将帮助你更轻松地完成易于理解的代码编写。随着你编程水平的提高，并开始构建具有复杂算法的大型项目，你会想要大量使用注释以便以后记住代码的功能，并能够轻松、有效地向他人解释。这是极佳的编码风格。让我们看看有哪些种的注释可以供我们在代码中使用。


    ### 单行注释


    单行注释（如上面所示）允许你在编写代码时快速编写注释来解释代码片段。这些注释非常适合用于解释你的 `variables` 及其 `declarations`。


    ```java

    // 这是一个很酷的单行注释

    ```


    ### 学习读写注释


    单行注释必须以双斜杠 `//` 开头，且只能跨越一行代码。让我们参考“数据类型”章节中的银行账户示例，看看我们如何为变量使用单行注释：


    ```java

    //这是账户的唯一标识符

    int id = 1234567828;


    //这是账户的余额

    double balance = 1301.41;


    //这是访问账户的密码

    int passCode = 9889;

    ```


    ### 多行注释


    当没有太多需要解释的内容时，单行注释非常适合注释较小部分代码。然而，当你编写较大的代码时，最好使用多行注释。多行注释允许你通过以 `/*` 开始并以 `*/`
    结束来编写跨越多行的注释。


    ```java

    /*这是一个更酷的注释。

    它可以跨越多行*/

    ```


    想象你正在编写一个代表 ATM 的程序，你想让用户只要不输入“EXIT”就可以一直使用 ATM，你希望在代码中清晰地解释你打算如何实现。这样做需要多行内容，但它也能让你传达所有的想法：


    ```java

    // 使用 Scanner 从键盘获取用户输入

    Scanner scanner = new Scanner(System.in);


    // 用于存储用户输入的 String 变量

    String input = "";


    /*

    只要用户不想退出，

    让他们继续在我们的 ATM 上进行交易。

    */

    while(!input.equalsIgnoreCase("EXIT")){

    //让用户在我们的 ATM 上进行交易

    //然后询问用户接下来想做什么。

    System.out.println("Enter EXIT to exit or another action");

    //从 scanner 获取用户的输入

    input = scanner.nextLine();

    }

    System.out.println("Thanks for using our ATM!");

    ```


    注意我们如何使用多行注释来解释执行了大量工作的 `while` 循环。这将帮助我们以及阅读我们代码的人更好地理解正在发生什么。


    如果你因为 `while` 循环和 `Scanner` 还不理解这段代码片段中的内容，不要担心。我们很快会介绍这些概念。现在，先尝试运行这些代码看看它是如何工作的。


    # 命名规范


    还记得你上一年级时必须写第一个句子吗？老师说你的句子必须包含主语和谓语。在此之前，她确保教每个人什么是主语，什么是谓语，以便以后能信心地使用它们。到那时，她能够告诉你如何构建句子：“所有的句子必须以大写字母开头，并以标点符号结束。”她继续解释你可以写的不同类型的句子以及各自的标点：“陈述句以句号结束，疑问句以问号结束。有时，当我们说话时很兴奋，所以我们可以使用感叹号来表示我们有多兴奋！”她教你英语的规范，以便你能够与同学、父母以及世界上其他地方有效地交流你的思想，并让每个懂英语的人都能理解。


    ##


    ## Java 命名规范


    ### 变量命名


    哪些是允许的？Java 中的变量是区分大小写的，并且可以是无限长度的字母和数字。然而，变量名必须以字母、下划字符 `_` 或美元符号 `$` 开头。


    ```java

    String author = "Lincoln W Daniel";

    String bookTitle = "Java for Humans";

    int yearBookPublished = 2016;

    ```


    规范是什么？虽然你可以以下划线或美元符号开头，但 Java 变量命名的规范是始终以小写字母开头。为了帮助你的代码自文档化，你应该使用完整的单词来命名变量，而不是单个字母；例如，命名为
    `day`、`month` 和 `year` 的变量比它们的缩写 `d`、`m` 和 `y` 更直观、易读。


