    teach you all of the concepts listed in the table of contents. Some of the more
    noteworthy ones include how to create a class, using encapsulation, using methods
    and variables, datatypes and data structures, interfaces, and the great polymorphism.
    You will also learn best practices, design patterns, tips and tricks for programming
    in Java.


    Not only will you learn the above topics, I will teach you how to learn far beyond
    what any book can ever teach you. You will learn how to use Google & StackOverflow
    to learn more when


    **Preface**


    10


    you''re stuck. I will teach you how to learn through doing research, building
    things, breaking things, and fixing things as you go. Some call this the act of
    building a plane while you are in midair, but I call it the process of learning
    by doing. It is one of the most effective ways of learning how to do anything,
    especially programming.


    **The Overlying Projects**


    I believe in having fun while learning. Towards the end of the book, you will
    use all of the wonderful skills and super powers you develop to build and play
    a little fighting game in Java.


    **[ModernNerd Video Series](https://www.youtube.com/channel/UC_zTAq-3TIfGqvoB_U6Peyg)**


    Because some people may learn better by hearing the explanation rather than reading
    it, I am publishing a video series on Java for Humans on my Youtube channel, ModernNerd.
    I will publish those videos as time permits, so please [subscribe to the channel](https://www.youtube.com/channel/UC_zTAq-3TIfGqvoB_U6Peyg)
    to receive updates as I post new videos.


    **Java for Humans**


    11


    **Chapter 1**


    **Introduction**


    **About Java**


    Put simply, Java, named after coffee, runs the world. There are more than three
    billion devices running Java today, according to [Oracle](http://oracle.com/).
    This is only possible because Java is a portable language thanks to the Java Virtual
    Machine (JVM). The JVM allows Java developers to write code and compile it on
    one platform and run it on many other platforms unlike other languages. This has
    allowed Java to become a powerhouse in the programming world. Google caught on
    to this and swiftly made Java the language that runs your Android phone. Java
    is in everything and you''ve been using it since you were surfing the web in the
    good ole America Online dial up internet days.


    Java for Humans will help you learn how to build the cool tools you use everyday.
    With knowledge of programming in Java, you can start building Android applications
    and games for phones, televisions, and tablets. Furthermore, not only will you
    be able to build with Java, you will be better prepared to learn more programming
    languages to increase the range of applications you can build from car to drone
    software.


    If you need more motivation to learn Java, read the *Applying Knowledge* chapter
    to learn more about what you can do with Java, how much you stand to gain from
    being a Java programmer, and how Java for Humans can get you started on the path
    to a promising career in Java software development.


    **How to Read This Book**


    After this chapter, we will embark on a journey together. You will learn many
    new concepts that will help you become a talented Java programmer. Before we begin,
    this section covers some things we should settle to ensure our journey is smooth,
    peaceful, and stress free.


    **Integrated Development Environment (IDE)**


    This book will make use of Java 8, version 1.8.0_51, and you need a program to
    run the supporting code/programs. To learn Java, you will need to do a good deal
    of Googling, so let’s start now. Search Google or Youtube for how to install and
    use the NetBeans IDE along with Java 1.8 from Oracle. I would explain how to do
    it, but my explanation may not work for everyone because there are many different
    operating systems the readers of this book may be using. A great starting point
    is to visit the official website for Java resources: you can download both NetBeans
    and the most recent Java version from [this link](http://www.oracle.com/technetwork/articles/javase/jdk-netbeans-jsp-142931.html).


    **Introduction**


    12


    **Supporting Code**


    A great way to read this book is to also have the supporting source code for each
    chapter opened in your IDE. There will be increasingly large amounts of code in
    the remaining chapters of this book, but much of it will be omitted from the text
    to keep the chapters short. If a chapter appears long, it is likely that a considerable
    amount of it is code, not plain text, so hang in there.


    Each chapter’s supporting source code can be found in its own namesake package
    under the source (src) folder. Download [the full project here on GitHub](http://javaforhumans.com/code)
    but remember to type out all of the code yourself in order to effectively learn
    the Java language. From the root folder, navigate to “src” and then choose the
    chapter you want to view.


    **Side Notes**


    We will cover many concepts throughout this book. While I will take my time to
    explain each concept clearly and in ways you can relate to, there may be times
    when I need to explain other concepts with more jargon or deeper explanation to
    help you better understand. In those cases, you will see the following formatted
    text:


    ***Note!***


    This is a side note which explains an aside. An aside is used to indicate that
    one is shifting from one topic or tone of discussion to another.


    You do not have to read side notes, but it would be in your best interest to do
    whatever it takes to fully understand the concepts discussed in this book. If
    you do that, you will be well on your way to being a well equipped Java programmer.


    **Inline Code**


    There will be inline code in this book that you should refer to while reading.
    They look this this:


    String bookTitle = "Java for Humans";


    If we want to print something out to the console for the user to see, we will
    do something like this:


    System.out.println(bookTitle);


    ***Output***


    *Java for Humans*


    **Java for Humans**


    13


    **Chapter 2**


    **Learning to Read and Write**


    **Variables**


    There are some concepts in Java, or any programming language for that matter,
    that you cannot go without understanding and using. Variables are one of those
    concepts, but don’t worry because it’s also one of the simplest concepts in Java.
    By the end of this chapter, you’ll understand all you need to know about variables
    to start storing all of life’s information for later use.


    **Why Variables are Important and Useful**


    Before we start on Java and its variables, we first need to assert why we program:


    *We program to capture and manipulate information (data)*


    *to produce new information for users to consume.*'
