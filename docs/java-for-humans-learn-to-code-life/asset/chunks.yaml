    \ `incrementNumHumansAndPrint()` 来完成，打印出程序中存在的 `Human` 实例的新数量。注意，`incrementNumHumansAndPrint()`\
    \ 方法调用了私有静态方法 `incrementNumHumans()` 来执行将人类数量加一的工作。这些函数现在看起来可能微不足道且偷懒，但我们很快就会看到为什么这样分离工作是明智的。\n\
    \n```java\npublic static main(String[] args) {\n  //创建一个新的 Human 实例\n  Human newHuman1\
    \ = new Human(\"Lincoln W Daniel\");\n\n  //创建另一个 Human 实例\n  Human newHuman2\
    \ = new Human(\"ModernNerd\");\n}\n```\n\n**输出**\n\n社会现在有 1 个 Human 实例。\n社会现在有\
    \ 2 个 Human 实例。\n\n# 学习数据分类\n38\n\n# 控制流语句：决策\n\n决策，决策，还是决策…… 决策是你婴儿时期无法控制的概念。然而，随着你逐渐长大，世界期望你开始为自己做决定。在学校里，你每天都必须做一个决定：坐在教室的前排还是后排；如果你坐在后排，就有不注意听的风险；如果你坐在前面，你更有机会获得优异的成绩。下雨时，你必须决定是否使用雨伞；如果你用了雨伞，你就能保持干燥；如果你不带伞，你就会淋湿并难过。\n\
    \n## 为什么决策很重要且有用\n\n在 Java 中，你的代码通常按照从上到下的顺序顺序执行。第一行会在第二行之前执行，第三行会在第二行之后执行，第四行会在第五行之前执行，但肯定在第三行之后执行。这在你编写简单程序时很棒，但当你的程序需要执行更多操作时，你的代码就必须采用控制流语句，允许你的程序在某些时候做某些事情，在合适的时候做其他事情。控制流语句的一种形式是决策语句，它允许我们告诉程序如果条件为真则执行任务\
    \ A，如果为假则执行任务 B：如果下雨了，就用雨伞；否则，把它留在衣子里。\n\n## 决策语句\n\n### If-Then 语句\n\n如果这是真的，那么就做那个。\n\
    \n如果满足某个条件，就执行某些事情。从你记忆中起你就一直在这么做。如果你饿了，你就吃东西。如果你累了，你就睡觉。如果你的银行账户空了，你就努力工作赚更多的钱。如果你得了好成绩，你就通过了门课程。如果你在《大富翁》中经过了“起点”，就收集\
    \ 200 美元。这就是 if-then 语句（也称为 if 语句）的工作原理：\n\n```java\n//之前的代码运行\n// 检查一个条件\nif(condition)\
    \ {\n  // 主体\n  // 执行某些事情：在这里运行更多代码\n}\n// 其他代码运行\n```\n\n条件可以是一个数学表达式、变量或方法，但无论它是什么，它必须返回或评估为\
    \ `true` 或 `false` 的 `boolean`（布尔）值。如果条件评估为 `true`，我们称该条件被满足。在那个代码段中，运行了一些代码，然后我们使用\
    \ if 语句来评估一个条件。如果条件满足（评估为 `true`），我们可以在 `if` 语句的主体内部执行某些事情。\n\n对于 人类的 Java\n39\n\
    \n让我们尝试模拟《大富翁》游戏中的一个回合：\n\n```java\nPlayer player1 = new Player(\"Lucy\");\n//\
    \ 第一个玩家掷骰\nint movePositions = player1.rollDice();\n// 玩家在游戏盘上移动棋子\nplayer1.moveForward(movePositions);\n\
    \nif(player1.passedGo()) {\n  player1.collect200Dollars();\n}\n// 下一个玩家掷骰\nmovePositions\
    \ = player2.rollDice();\n//...\n```\n\n注意，`player` 类的实例方法 `rollDice()` 总是返回 12\
    \ 的完美点数，而它的 `moveForward()` 实例方法根据我们提供的数字增加实例在盘上的位置。最后，它的 `passedGo()` 实例方法如果玩家在盘上的位置大于\
    \ 11 则返回 `true`，否则返回 `false`。在“生成随机数”章节中，我们将学习如何让 `rollDice()` 方法随机化。\n\n在那个代码段中，大富翁游戏的当前玩家掷骰子查看他能移动多远，并据此在盘上向前移动棋子。如果玩家经过了“起点”，他就收集\
    \ 200 美元。在这一切之后，下一个玩家掷骰子，这个过程不断重复直到游戏结束。\n\n### If-Then-Else 语句\n\nif-then-else\
    \ 语句比简单的 if-then 语句稍微强大，因为它们允许我们在条件满足时执行某些事情，而在其他执行其他事情。你可以这样理解：\n\n*如果这是真的，那么就做那个。否则，做其他事情。*\n\
    \n假设我们想探索亚马逊雨林。在计划阶段，我们检查天气预报，看看我们去那天是否会下雨。只有当我们到达那里时会下雨，我们才把伞装进包里。如果不下雨，我们应该把伞放回衣子里，因为我们不需要它。我们可以像这样用\
    \ if-then-else 语句模拟我们的计划：\n\n# 学习分类\n40\n\n```java\nboolean itWillRain = true;\n\
    // 检查是否下雨\nif (itWillRain) {\n  // 为旅行准备\n  System.out.println(\"带上伞。\");\n} else\
    \ {\n  // 把伞放回衣子里\n  System.out.println(\"把伞放回衣子里。\");\n}\n```\n\n如果条件满足，if 语句的主体将运行，否则\
    \ else 语句的主体将运行。因此，如果 `itWillRain` 评估为 `true`，我们将伞带上；否则，如果 `itWillRain` 评估为 `false`，我们将把它留在衣子里。\n\
    \n## 嵌套决策\n\nJava 允许你嵌套 if 语句来做出多个决策。让我们回顾之前的雨例子。如果外面下雨，我们就用雨伞。然而，只有在下雨且我们在户外时才想用雨伞。如果在室内，就不使用雨伞。我们可以通过使用\
    \ if 语句编写这一点。\n\n下面的代码段演示了我们如何使用嵌套 if 语句来做决策。首先，我们检查是否下雨：如果不下雨，就这样，不用雨伞。如果下雨，我们使用另一个\
    \ if 语句来检查我们是否在户外。如果在户外，我们就使用雨伞，否则，不使用雨伞：\n\n对于 人类的 Java\n41\n\n```java\n/*此代码段中使用的变量已省略。\n\
    请查看本章的支持代码获取运行的代码*/\n// 做第一个决策：检查是否下雨\nif (itsRaining) {\n  /* 做第二个决策\n  因为确实在下雨\
    \ */\n  // 检查是否在户外\n  if (weAreOutside) {\n    /* 使用雨伞\n    因为确实在户外 */\n    useUmbrella\
    \ = true;\n  } else {\n    /* 否则，不用雨伞\n    因为我们不在户外 */\n    useUmbrella = false;\n\
    \  }\n} else {\n  /* 否则，不用雨伞\n  因为没有下雨 */\n  useUmbrella = false;\n}\n```\n\n\
    我们也可以在 else 语句的主体中放置 if 语句，以便在初始条件失败后做出更多决策。例如，如果下雨且我们不在户外，我们可以检查我们很快是否会出去，从而决定是把伞收起来还是留在身边以备我们准备好进入雨中。\n\
    \n### If-Then-Else If-Then-Else 语句\n\n我不可能发明了那个连字符语句名称，但请原谅它的复杂。尽管它看起来很丑，但它允许我们在行内做出多个决策。你可以这样理解：\n\
    \n*如果这个条件不成立，就检查其他条件，直到有一个为真，然后执行某些事情。*\n"
- fmt: "\nThink of `else` as the default choice that is executed if none of the conditions\
    \ before it are satisfied. When you get home from school, you try to find an activity\
    \ to do. In this order, you check if you have homework, if not, you check if you\
    \ have chores, if not, you check if your friends are free to play, and if not\
    \ that, your default option is to watch the television if you have one. We can\
    \ do this inline decision making in code, too:\n\n## Learning to Classify Data\n\
    \n```java\n/*some of the variables used in this snippet have been omitted.\nPlease\
