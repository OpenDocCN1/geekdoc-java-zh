  trans: "\n请记住，方法之所以强大，是因为它们可以操作我们类或类实例中的可用数据，但有时我们需要它们完成更多任务。有时，它们需要来自类或类实例外部的某些数据来完成工作。一个很好的例子是当你在体育课上，老师要求你跳跃。有些人会盲目地开始跳跃，但明智的做法是问老师他想让你跳多高以及跳多久。下一次当老师调用（invoke,\
    \ or calls）你的跳跃（jump）方法时，他将知道必须为你提供一个跳跃的高度和持续跳跃的时间。很快，我们将使用同样的主意来教我们的新宠物狗如何跳跃。\n\
    \n我们可以为方法提供任意数量的参数，当有人调用我们的某一个方法时，他们必须将我们要求的所有参数作为参数传递进来。我们的方法可以在方法体中使用这些参数作为变量。通常情况下，通过检查参数是否为\
    \ `null` 来确保提供给方法的参数不为空（即非空值）是明智的，因为用户可能会误用我们的方法。\n\n`null` 对象是不包含任何数据的对象，因此它没有类型。这种对象无法被使用。因此，如果我们尝试对\
    \ `null` 对象调用方法，我们的程序就会崩溃。我们可以在方法体中使用 `if` 语句，通过不等于运算符 `!=` 将参数与 `null` 进行比较，在使用之前检查是否为\
    \ `null`。好消息是原生类型（primitives）不能为 `null`，因为它们有默认值。然而，请记住字符串（string）是 Java 提供的 `String`\
