    \ = new Human(\"Lincoln W Daniel\");\n\n  //creates another Human instance\n \
    \ Human newHuman2 = new Human(\"ModernNerd\");\n}\n```\n\n**Output**\n\nThere\
    \ are now 1 Human instances in society.\nThere are now 2 Human instances in society.\n\
    \n# Learning to Classify Data\n38\n\n# Control Flow Statements: Decisions\n\n\
    Decisions, decisions, decisions … Decisions are the concepts you had no control\
    \ over as a baby. As you grew older, however, the world expected you to start\
    \ making decisions for yourself. In school, you had to make a decision everyday\
    \ to sit in the front or in the back of the room; if you sat in the back, you\
    \ ran the risk of being less attentive, and if you sat in the front, you had a\
    \ better chance of getting the excellent grade. When it’s raining, you have to\
    \ make a decision to use an umbrella or not; if you use the umbrella, you stay\
    \ dry, and if you don’t use the umbrella you get wet and sad.\n\n## Why Decisions\
    \ are Important & Useful\n\nIn Java, your code is generally executed from top\
    \ to bottom in order. Line one will be executed before line two, line three after\
    \ line two, and line four before line five but definitely after line three. This\
    \ is great when you are writing simple programs, but when it’s time for your programs\
    \ to do more, your code will have to employ control flow statements to allow your\
    \ program to do some things sometimes and other things when the time is write.\
    \ One form of control flow statements are decision-making statements which allow\
    \ us to tell our program to do Task Aif a condition is true or Task B if it is\
    \ not true: If it is raining, use the umbrella, otherwise, leave it in the closet.\n\
    \n## Decision-Making Statements\n\n### If-Then Statements\n\nIf this is true,\
    \ then do that.\n\nIf a certain condition is satisfied, then do something. You’ve\
    \ been doing this for as long as you can remember. If you are hungry, you eat.\
    \ If you are tired, you sleep. If your bank account is empty, you work hard to\
    \ get more money. If you get a good grade, you pass the class. If you pass “Go”\
    \ in Monopoly, collect 200 dollars. This is how the if-then statement, otherwise\
    \ known as if statement, works:\n\n```java\n//previous code runs\n//check a condition\n\
    if(condition) {\n  //body\n  //do something: run more code here\n}\n//other code\
    \ runs\n```\n\nThe condition could be a mathematical expression, a variable, or\
    \ a method, but regardless of what it is, it must return, or evaluate to, a `boolean`\
    \ value of `true` or `false`. If it the condition evaluates to `true`, we say\
    \ that the condition is satisfied.In that code snippet, some code runs, then we\
    \ use a if statement to evaluate a condition. If the condition is satisfied, evaluates\
    \ to true, we can do something inside the body of the `if` statement.\n\n### Java\
    \ for Humans\n39\n\nLet’s try to model a turn in the game of Monopoly:\n\n```java\n\
    Player player1 = new Player(\"Lucy\");\n//the first player rolls the dice\nint\
    \ movePositions = player1.rollDice();\n//player moves piece on game's board\n\
    player1.moveForward(movePositions);\n\nif(player1.passedGo()) {\n  player1.collect200Dollars();\n\
    }\n//next player rolls dice\nmovePositions = player2.rollDice();\n//...\n```\n\
    \nNote that the `rollDice()` instance method of the `player` class always returns\
    \ a perfect roll of 12 and its `moveForwad()` instance method increases the instance’s\
    \ position on the board by the number we provide it. Finally, its `passedGo()`\
    \ instance method returns `true` if the player’s position on the board is greater\
    \ than 11 and `false`otherwise. In the Generating Random Numbers chapter, we will\
    \ learn how we can randomize the `rollDice()` method.\n\nIn that code snippet,\
    \ the current player of the Monopoly board game rolls the dice to see how far\
    \ he can move and moves his piece forward on the board accordingly. If the player\
    \ passed “Go” he collects 200 dollars. After all of that, the next player gets\
    \ to roll the dice, and the process repeats until the game ends.\n\n### If-Then-Else\
    \ Statements\n\nIf-then-else statements are a little more powerful than simple\
    \ if-thenstatements because they let us do things if a condition is satisfied\
    \ and other things otherwise. You can think of it like so:\n\n*if this is true,\
    \ then do that. Otherwise, do something else.*\n\nLet’s say we want to explore\
    \ the Amazon rainforest. In planning, we check the weather forecast to see if\
    \ it will be raining on the day we go. We only want to pack our umbrella in our\
    \ bag if it will rain when we get there. If it’s not going to rain, we should\
    \ put our umbrella back in our closet because we won’t need it. We can model our\
    \ plans with if-then-else statements like so:\n\n# Learning to Classify Data\n\
    40\n\n```java\nboolean itWillRain = true;\n//check if it will rain\nif (itWillRain)\
    \ {\n  //pack the umbrella for the trip\n  System.out.println(\"Adding our umbrella\
    \ to the bag.\");\n} else {\n  //put the umbrella back in the closet\n  System.out.println(\"\
    Putting umbrella back in the closet.\");\n}\n```\n\nIf the condition is satisfied,\
    \ the body of the if statement will run, and the body of the else statement will\
    \ run otherwise. Thus, if `itWillRain` evaluates to `true`, we add our umbrella\
    \ to the bag — otherwise, if `itWillRain` evaluates to `false`, we put it back\
    \ in the closet.\n\n## Nesting Decisions\n\nJava allows you to nest if statements\
    \ to make multiple decisions. Let’s take our rain example from earlier. If it\
    \ is raining outside we want to use the umbrella. However, we only want to use\
    \ the umbrella if it is raining and we are outside. We don’t want to use the umbrella\
    \ if we are inside. We can write this in code by using if statements.\n\nThe following\
    \ code snippet demonstrates how we use nested if statements to make decisions.\
    \ First, we check if it’s raining: if it’s not raining, that’s it, don’t use the\
    \ umbrella. If it is raining, we use another if statement to check if we are outside.\
    \ If we are outside, we want to use the umbrella, otherwise, don’t use the umbrella:\n\
    \n### Java for Humans\n41\n\n```java\n/*some of the variables used in this snippet\
    \ have been omitted.\nPlease see the supporting code for this chapter for working\
    \ code*/\n//make the first decision: check if its raining\nif (itsRaining) {\n\
    \  /*make the second decision\n  because it's true that it's raining*/\n  //check\
    \ if we are outside\n  if (weAreOutside) {\n    /*use the umbrella\n    because\
    \ it's true that we are outside*/\n    useUmbrella = true;\n  } else {\n    /*otherwise,\
    \ don’t use the umbrella\n    because we are not outside*/\n    useUmbrella =\
    \ false;\n  }\n} else {\n  /*otherwise, don’t use the umbrella\n  because it is\
    \ not raining*/\n  useUmbrella = false;\n}\n```\n\nWe could also put if statements\
    \ in the body of the else statements if we wanted to make more decisions after\
    \ our initial conditions failed. For instance, if it is raining and we are not\
    \ outside, we could check if we will be going outside soon before we decide to\
    \ put the umbrella away or keep it nearby for when we are ready to step outside\
    \ into the rain.\n\n### If-Then-Else If-Then-Else Statements\n\nI may or may not\
    \ coined that hyphenated statement name, but excuse me for its complexity. Although\
    \ it appears ugly, it allows us to make multiple decisions inline. You can think\
    \ of it like so:\n\n*If this condition is not true, check the others until one\
    \ is true, then do something.*\n"
