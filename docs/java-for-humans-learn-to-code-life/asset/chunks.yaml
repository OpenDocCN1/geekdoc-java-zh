  trans: "\n\n在那个代码段中，我们创建了一个名为 `friends` 的数组，用于存储最多五个 `String` 值——即我们朋友的名字。现在我们已经有了这个数组实例，可以通过访问数组的索引来访问数组的每个元素。因为\
    \ Java 中的索引是从零开始的，所以数组中的第一个元素存储在索引零 (`0`) 处，最后一个元素存储在数组长度减一的索引处。因此，如果我们想访问第一位朋友，就会访问索引\
    \ `0`。\n\n在初始化时，数组中的所有元素都会初始化为零值：对象数组为 `null`，基本数字类型为 `0`，布尔类型为 `false`。在尝试取出它们之前，让我们先把朋友加入数组：\n\
    \n```\nfriends[0] = \"Imani\";\nfriends[1] = \"Andres\";\nfriends[2] = \"Keith\"\
    ;\nfriends[3] = \"Sasha\";\nfriends[4] = \"Tabitha\";\n```\n\n现在我们已经将五个朋友添加到了\
    \ `friends` 数组中，让我们访问第一个和最后一个并打印它们：\n\n```\nString firstFriend = friends[0];\n\
    System.out.println(\"First friend is \" + firstFriend);\nSystem.out.println(\"\
    Last friend is \" + friends[friends.length - 1]);\n```\n\n***输出***\n*First friend\
    \ is Imani*\n*Last friend is Tabitha*\n\n注意，我们能够通过简单的数学计算访问 `friends` 数组中的最后一个元素。我们使用了数组的\
    \ `length` 属性来获取数组中的元素总数，并从该数字上减一得到最后一个元素的索引。这是访问最后一个元素的动态方法，但我们也可以同样地输入 `friends[4]`\
    \ 来访问五个朋友数组中的第五个（也是最后一个）元素。在不幸丢失某位朋友的情况下，我们应该将数组中对应于所丢失朋友的元素值置零。如果我们丢失了第一位朋友，且第二位朋友改了名字，我们可以这样在数组中反映这些更新：\n\
    \n```\nfriends[0] = null;\nfriends[1] = \"Alejandro\";\nSystem.out.println(\"\
    First friend is now \" + friends[0]);\nSystem.out.println(\"Second friend changed\
    \ name to \" + friends[1]);\n```\n\n***输出***\n*First friend is now null*\n*Second\
    \ friend changed name to Alejandro*\n\n现在我们的第一位朋友等于 `null`，而第二位朋友 Andres 改了名字为\
    \ Alejandro。让我们再创建一个数组来存储所有朋友对应的电话号码整数：\n\n```\nint[] friendsPhoneNumbers = new\
    \ int[friends.length];\nfriendsPhoneNumbers[0] = 555_8000;\nfriendsPhoneNumbers[1]\
    \ = 5554448;\nfriendsPhoneNumbers[2] = 555_4311;\nfriendsPhoneNumbers[3] = 555_7898;\n\
    friendsPhoneNumbers[4] = 555_6710;\n```\n\n我们的 `friendsPhoneNumbers` 数组使用 `friends`\
    \ 数组的 `length` 属性值初始化，以确保它们的元素数量相同。\n\n***注意！***\n注意某些电话号码包含下划线。在长数字中使用下划线就像在纸上使用逗号一样，它们更容易阅读。你可以在数字之间添加下划线，但不能开头或结尾。\n\
    \n我们可以使用以数组长度结束的 `for` 循环来遍历我们的朋友数组，从而打印出每个朋友的名字：\n\n**Java for Humans**\n\n```\n\
    for(int index = 0; index < friends.length; index++) {\n    System.out.printf(\"\
    Friend %d: %s\\n\", index, friends[index]);\n}\n```\n\n***输出***\n*Friend 0: null*\n\
    *Friend 1: Alejandro*\n*Friend 2: Keith*\n*Friend 3: Sasha*\n*Friend 4: Tabitha*\n\
    \n我们可以更进一步，在打印每个朋友名字的同时，从 `friendsPhoneNumbers` 数组中打印他们的电话号码。然而，只有当朋友的名字不等于 (`!=`)\
    \ `null` 时，我们才打印他们的电话号码：\n\n```\nfor(int index = 0; index < friends.length; index++)\
    \ {\n    String friend = friends[index];\n    if(friend != null) {\n        System.out.printf(\"\
    Friend %d: %s's phone number is %d\\n\", index, friend, friendsPhoneNumbers[index]);\n\
    \    } else {\n        System.out.println(\"#Alert: No friend at index \" + index);\n\
    \    }\n}\n```\n\n***输出***\n*#Alert: No friend at index 0*\n*Index 1: Alejandro's\
    \ phone number is 5554448*\n*Index 2: Keith's phone number is 5554311*\n*Index\
    \ 3: Sasha's phone number is 5557898*\n*Index 4: Tabitha's phone number is 5556710*\n\
    \n注意，我们没有在两个数组都没有打印索引为 `0` 的元素，因为我们之前丢失了第一位朋友；`friends` 数组中索引为 `0` 的元素现在是 `null`，所以\
    \ `friendsPhoneNumbers` 数组中索引 `0` 对应的电话号码对我们已经没有意义了。为了让电话簿更直观，我们可以另一件事是将我们的两个数组合并为一个。新数组将持有\
    \ `Friend` 对象，而不是 `String` 和 `int` 值。\n\n"
- fmt: "\nOur phone book from the `Arrays` chapter could only hold a fixed number\
    \ of our friends’ contact information because it was made with an array. We bounded\
    \ our phone book by implementing it as an array because it makes sense: your phone\
    \ only has a limited amount of storage space, so we can only store a limited amount\
    \ of contacts. Arrays are best when you know how many elements you will be collecting,\
    \ but there are other situations where it doesn’t make sense to bound the capacity\
    \ of our collection. For those situations, dynamically expanding lists are best.\n\
    \n# Why Lists are Important & Useful\n\nUnlike arrays, lists in `Java` can expand\
    \ without bounds. You may use a list to accumulate and collect things you don’t\
    \ know the bounds of, such as the people you meet in your life time, the places\
    \ you’ve been, the skills you learn, the movies you want to watch. If you’ve ever\
    \ heard of a “Bucket List”, it is the best application of a list: toss everything\
    \ you want to do into the bucket and mark them as done as you accomplish them.\n\
    \nThe `List` class is an interface from which we can implement any kind of list\
    \ subclass we’d like. `Java` provides us two popular implementations of the `List`\
    \ interface — `LinkedList` and `ArrayList` — but we will focus on the `LinkedList`\
    \ in this chapter because you already know much of how an `ArrayList` works; an\
    \ `ArrayList` is simply an array with convenient instance methods and a dynamically\
    \ expanding capacity.\n\n# LinkedLists\n\nA `LinkedList` is a special type of\
    \ data structure that allows us to link elements together in a line without bounds.\
    \ Elements of a `LinkedList` are referred to as nodes and each node has a pointer-field\
    \ pointing to its left neighbor and another pointing to its right neighbor.\n\n\
    A node has a minimum of three instance fields: its two pointers which are `int`\
    \ values, and its `datafield` which holds the actual data. The datatype of a `LinkedList`,\
    \ or any data structure for that matter, is the datatype of its elements and all\
    \ elements must be of the same type.\n\nThere are only six functions you need\
    \ to know to get started working with the `LinkedList` class. `LinkedLists` have\
    \ a `size()` instance method that returns the number of nodes in the list. You\
    \ can add elements to a `LinkedList` by passing the object as an argument to the\
    \ list’s `add()` instance method. If you want to check if an object is already\
    \ in the list before you try to add it again, you can call the `contains()` instance\
    \ method and provide it the object to check as an argument.\n\nWhen you want to\
    \ access an element of a list, you must provide its position in the list as an\
    \ argument to the list’s `get()` instance method. A reference to the object stored\
    \ in the node at that position in the list will be returned. If you want to remove\
    \ an element from the list, simply pass its position as an argument to the list’s\
    \ `remove()` instance method. Finally, you can remove all elements from the list\
    \ by calling the `clear()` method.\n\nWhen we initialize our `LinkedList`, we\
    \ must specify the type of data that can be stored in our `LinkedList`. To do\
    \ that, we place the type’s class name between a set of opening and closing arrows\
    \ `<>`. Let’s see how we can use a `LinkedList` instance to make our bucket list\
    \ of things we want to do this year:\n\n**Java for Humans**\n93\n\n```java\npublic\
    \ class Thing {\n    ...\n    @Override\n    public String toString() {\n    \
    \    if(done) { return name + \" is done.\";}\n        else { return name + \"\
    \ is not done\";}\n    }\n}\n\nLinkedList<Thing> bucketList = new LinkedList<Thing>();\n\
    ```\n\nOur `Thing` class has only two instance fields: a `String name` and a `boolean\
    \ done`. We can get the name of a `Thing` instance by calling the `getName()`\
    \ instance method and we can mark a `Thing` as done by calling the `markDone()`\
    \ instance method. We can check if a `Thing` is done by calling its `isDone()`\
    \ instance method. Finally, our `Thing` class overrides the `toString()` instance\
    \ method of its implicit superclass, `Object`. Let’s add some things to do to\
    \ our bucket list:\n\n```java\nbucketList.add(new Thing(\"Bungee Jump\"));\nThing\
    \ learnJava = new Thing(\"Learn Java\");\nbucketList.add(learnJava);\nbucketList.add(new\
    \ Thing(\"Build an Android Application\"));\nbucketList.add(new Thing(\"Travel\
    \ to the Bermuda Triangle\"));\n```\n\nWe want to go bungee jumping, learn Java,\
    \ build an Android application, and travel to the Bermuda Triangle. We are currently\
    \ learning `Java`, so we can’t mark it as done just yet. Say we complete bungee\
    \ jumping, we can mark the “Bungee Jump” Thing as done by calling the `get()`\
    \ method on our `bucketList` object to get it and call its own `markDone()` instance\
    \ method on it. Because “Bungee Jump” is the first element in the list, its position\
    \ is zero (0):\n\n```java\nThing bungeeJump = bucketList.get(0);\nbungeeJump.markDone();\n\
    ```\n\nTo get the first or last element of the list, we could also call its `getFirst()`\
    \ or `getLast()` instance methods respectively. Let’s traverse our bucket list\
    \ and print out everything we have to do:\n\n**Learning to Organize**\n94\n\n\
    ```java\nfor(int position = 0; position < bucketList.size(); position++){\n  \
    \  Thing thingToDo = bucketList.get(position);\n    System.out.println(\"Thing\
    \ at position \" + position + \": \" + thingToDo);\n}\n```\n\n***Output***\n*Thing\
    \ at position 0: Bungee Jump is done.*\n*Thing at position 1: Learn Java is not\
    \ done*\n*Thing at position 2: Build an Android Application is not done*\n*Thing\
    \ at position 3: Travel to the Bermuda Triangle is not done*\n\nFrom that code\
    \ snippet, we can see that we are looping over, traversing our bucket list by\
    \ using the increasing position value to retrieve elements from the list by their\
    \ position in the list. The first element, “Bungee Jump”, is rightfully the only\
    \ `Thing` in the list that we’ve traveled to the Bermuda Triangle, so we’ll mark\
    \ that as done too.\n\n```java\nbucketList.getLast().markDone();\nfor(int position\
    \ = 0; position < bucketList.size(); position++){\n    Thing thingToDo = bucketList.get(position);\n\
    \    if(thingToDo.isDone()) {\n        bucketList.remove(thingToDo);\n    }\n\
    }\nSystem.out.println(\"Things left to do: \" + bucketList.size());\n```\n\n***Output***\n\
    *Things left to do: 2*\n\nNow we only have two things left in our list. Given\
    \ that we have read all the way through `Java for Humans` and developed an Android\
    \ application, that would mean we can mark those two things as done on our list.\
    \ Given that we only have two things left, instead of removing them one at a time,\
    \ we can simply empty our bucket list by clearing our `LinkedList`:\n\n```java\n\
    bucketList.clear();\nSystem.out.println(\"Things left to do: \" + bucketList.size());\n\
    ```\n\n***Output***\n*Things left to do: 0*\n\n**Java for Humans**\n95\n\nNow\
    \ our bucket list is empty. However, we lied about having learned Java, so let’s\
    \ add that back to our bucket list and make sure it was added by checking if the\
    \ list contains it:\n\n```java\nSystem.out.println(bucketList.contains(learnJava));\n\
    bucketList.add(learnJava);\nSystem.out.println(bucketList.contains(learnJava));\n\
    System.out.println(bucketList.contains(new Thing(\"Learn Java\")));\n```\n\n***Output***\n\
    *false*\n*true*\n*false*\n\n***Note!***\n\nThe `contains` method returns true\
    \ if the provided object is a reference to an object in the list. Although the\
    \ two `Thing` instances with a name value of “Learn Java” appear to be the same,\
    \ they are not because they don’t reference one another. This is something you\
    \ should do some more research on because its beyond the scope of this book.\n\
    \nOne final method you should be aware of is the `isEmpty()` instance method.\
    \ It returns true if the list has no elements in it.\n\nThat’s it. We have used\
    \ all of the essential instance methods of a `LinkedList` and those methods are\
    \ all in other implementations of the `List` interface. Try to expand your bucket\
    \ list here by adding more Java concepts you want to learn to the list.\n\n**HashMaps**\n"
