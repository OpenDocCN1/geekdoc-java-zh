    int //return type\nadd //name\n(int num1, int num2) //parameters\n{ //start body,\
    \ scope\n//body: write fun code here\n} //end body, scope\n```\n\n## Method Access\
    \ Modifiers\n\nA `public` method can be accessed from anywhere in our program,\
    \ but `private` methods can only be accessed from within the class it belongs\
