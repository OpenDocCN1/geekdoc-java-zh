    int numHumansInWorld = Human.numHumans;


    The way we accessed the field from the class is called dot notation, and we will
    learn more about this in the *Dot Notation* section.


    **Static Methods**


    Classes have three main types of methods: the factory (constructor) method, instance
    methods, and static methods. A static method of a class can be called without
    an instance of that class. As a result, static methods don’t have any access to
    instance variables, or instance fields, because instance variables store information
    about an instance of a class. Likewise, static methods do not have access to the
    this keyword in Java because this refers to the current instance of a class, which
    is not present in the scope of a static method. Further, instance methods of a
    class cannot be called from static methods of that class because there is no instance
    of the class present in a static method. However, if an instance of the class
    is passed to the static method, that instance is free as usual to perform its
    instance methods in the scope of the static method.


    Remember that we use static methods for functionality that is universal to a class.
    Static methods do not care about instances of the class or their state. If we
    have an instance of our Human class, we can call a method to make it change its
    name or speak its name. However, if we only want to use our Human class to run
    some calculations to determine the DNA of a human or to check how many humans
    currently exist in the world, we can make static methods to do that. Let’s try
    the latter:


    **Learning to Classify Data**


    36


    public class Human {


    private static int numHumans = 0;


    public Human(String name){


    this.name = name;


    numHumans++;


    }


    public static int getNumHumans(){


    return numHumans;


    }


    ...


    }


    If we want to access the static numHumans field of the Human class from outside
    of the Human class this time, we must call the getNumHumans() method because we
    made the static field private by using the private access modifier, which means
    the field can only be accessed from within the class its a member of, or belongs
    to. This is usually a wise design pattern to ensure that your fields are only
    being used how we want; the numHumans field in our Human class can only be changed
    from within the class and accessed through the getNumHumans() static method. We
    can call the static method from outside or inside the Human class because it is
    public, and it will return to us the value of the static field holding the number
    of Human instances that exist in our program:


    int numHumansInWorld = Human.getNumHumans();


    That will return the value of the static numHumans field in the Human class and
    store it in the localnumHumansInWorld variable for later use.


    Finally, instances of a class can call the public static methods of that class
    from anywhere in the program, but an instance of a class can only call its private
    static methods, like any other private method, from within the class. If we have
    a static method that simply serves to increment the static numHumans field in
    our Human class by one and return the new value each time it is called, it’d be
    best to have that declared as a private method so that it can only be called within
    the Human class either by instances of the Human class or from other static methods:


    **Java for Humans**


    37


    public class Human {


    private static int numHumans = 0;


    private String name = name;


    ...


    public Human(String name){


    this.name = name;


    incrementNumHumansAndPrint();


    }


    private static int incrementNumHumans(){


    return numHumans = numHumans + 1;


    }


    private static void incrementNumHumansAndPrint(){


    System.out.println("There are now " + incrementNumHumans()


    + " Human instances in society.");


    }


    ...


    }'
