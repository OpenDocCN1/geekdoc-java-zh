    # 抽象类与接口


    在“类继承”章节中，我们学习了如何在类、父类和用户之间建立约定。通过创建共享同一个父类的子类，我们可以在它们共享字段和方法，从而减少代码量，为用户创建一个可预测的接口，并使用`多态`。在本章中，我们将学习如何通过抽象类和接口来改进我们的约定。


    ## 为什么抽象类和接口重要且有用


    普通类定义了字段，实现了功能完整的方法，并且可以被实例化；这种类被称为具体类（concrete class）。这是你在编程生涯中编写和使用的绝大多数类。抽象类和接口不能实例化，但它们也定义了字段和方法——尽管它们可能没有实现方法。它们最适合在类、其子类以及子类的用户之间建立约定。


    Java for Humans

    79


    ## 抽象类


    抽象类与普通类非常相似，它可以拥有字段和方法。它的特殊之处在于其方法可能也可能没有方法体。这意味着抽象类既可以拥有声明为抽象的方法签名，也可以像往常一样拥有完整的方法。


    抽象方法是没有方法体的方法，它要求所属该抽象类的子类来实现其方法体。当你希望所有子类都拥有某个方法，但又想让不同的子类按照它们想要的方式来实现该方法时，这非常有用。此外，抽象类的子类必须实现所有的抽象方法。


    以“类继承”章节中`Human` 类的`attack()`实例方法为例。我们希望`Human` 类的每个子类都拥有攻击另一个`Human`对手的方法，但我们预计每个子类都有不同的攻击方式。我们应该将`attack()`方法设为抽象的，而不是在`Human`类以及每个子类中实现它。这样，我们就不会忘记在每个子类中实现它，并且通过不在父类中编写预期的无用代码来保持代码的整洁。`Human`类有两个方法我们应该设为抽象的，但为了这样做，我们必须将`Human`类变为抽象类。要做到这一点，我们只需要在类签名的`class`
    之前添加`abstract` 关键字即可。


    ```java

    public abstract class Human {


    //添加字段、方法和抽象方法


    }

    ```


    对于我们期望在所有子类中行为完全相同的方法，我们可以像往常一样完整地写出它们。像 getter 和 setter 这样的方法就符合这一点。此外，我们仍然可以在抽象类中拥有我们的共享字段。让我们看看从“类继承”章节升级后的新`Human`类：


    ```java

    public abstract class Human {


    protected String name;


    ...


    public Human(String name) {...}


    public abstract void attack(Human human);


    public abstract void defend();


    public abstract void jump();


    public abstract double heal();


    public String getName() {...}

    ```


    ### 学习构建

    80


    ```java

    public double getHealth(){...}


    public long getExperience(){...}


    public void setAttackPower(int attackPower) {...}


    public long gainExperience(long experience){...}


    public double heal(double additionalHealth) {...}


    public double decreaseHealth(int opponentAttackPower) {...}


    }

    ```


    在上述代码片段中，你可以看到我们有了`Human`类，并且它的`attack()`、`defend()`、`jump()`和`heal()`实例方法是抽象的。这是因为它们都是应该是实现它们的每个类特有的函数；道士实例——魔法角色——的治疗方式与战士（Warrior）实例不相同，因此它们应该以不同的方式实现`heal()`方法。你之前已经见过该类的其他部分，所以这些部分被省略了。


    **注意！**


    此时需要注意的是，静态方法不能是抽象的，因为从最简单来说，“抽象”意味着方法没有实现任何功能，而“静态”意味着即使没有类的实例，方法或字段中也绝对有可用。因此，拥有静态抽象方法将导致逻辑上的矛盾，这是
    Java 不允许的。


    ## 接口


    接口与我们目前见过的任何内容都有些不同。Java 接口更像抽象类而不是普通类。接口只能包含方法签名和静态 final 字段。接口仅仅是接口与实现它的类之间的一种约定。就像抽象类一样，实现接口的类必须实现其方法体以提供功能。


    接口最适合创建一个约定，确保所有实现它的的类都通过遵守约定而表现相似。这将允许用户安全地预期程序的某些部分行为相似，就像你预期格斗游戏中的所有角色行为相似一样。在我们“类继承”章节中的“征服（Conquer）”游戏中，我们预计所有角色都能够攻击其他角色、防御攻击、跳跃和自愈等功能。这些功能是所有角色都可以执行的功能，而不只是`Human`实例：


    ```java

    public interface Character {


    Random randomGenerator = new Random();


    String getName();


    double getHealth();


    long getExperience();


    int getAttackPower();

    ```


    ### Java for Humans

    81


    ```java

    void setAttackPower(int attackPower);


    void defend();


    void jump();


    int heal();


    void attack(Character opponent);


    double decreaseHealth(int opponentAttackPower);


    long gainExperience(long experience);


    }

    ```


    在`Character`接口中，`numCharactersInGame`字段是隐式`static`的，所有方法都是隐式`public`的，因此不需要包含`static`和`public`修饰符。


    **注意！**


    顶层接口不能是`private`的。此外，接口的所有方法在直觉上都是`public`的，所以不要包含任何你认为应该是`private`或`protected`的方法。


    假设我们允许我们的`Human`角色拥有`Pet`角色作为伙伴，我们预计`Pet`实例可以执行攻击、防御、跳跃和治疗等操作，但不是其他`Human`实例特有的操作。此外，我们可能有许多不同类型的宠物；用户可能想要狗、猫或鸟作为宠物。为此，我们将拥有`Dog`类、`Cat`类和`Bird`类。这些类中的每一个都会扩展`Pet`类，该类将定义共享的实例字段、实现共享的方法，并声明所有子类必须实现的抽象方法。


    **注意！**


    从底部顶部，具体类、抽象类和接口的层次结构如下：


    具体类 → 抽象类 → 接口。


    如果一个类扩展了实现了接口的父类（具体的或抽象的），你可以在父类中声明接口中的必要方法。这样做将履行子类遵守它与接口之间约定的职责，因为子类将从其父类继承约定的必要方法。或者，该类也可以自己实现接口方法。


