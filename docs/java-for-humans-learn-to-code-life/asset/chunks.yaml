  trans: "\n\n将 `else` 视为一种默认选择，当它之前的所有条件都不满足时，就会执行它。当你从学校回到家时，你会尝试找一件可以做的事情。按照这个顺序：你检查是否有作业，如果没有，你检查是否有家务，如果没有，你检查朋友是否有空一起玩，如果还是没有，你的默认选项就是看电视（如果你有电视的话）。我们也可以在代码中进行这种内联决策：\n\
    \n## 学习数据分类\n\n```java\n/*此代码片段中使用的变量已被省略。\n请参阅本章的辅助代码以获取运行代码*/\nString activityToDo\
    \ = \"nothing yet\";\n\nif(haveHomework) {\n    activityToDo = \"do homework\"\
    ;\n} else if (haveChores) {\n    activityToDo = \"wash dishes.\";\n} else if(friendsAreFreeToPlay)\
    \ {\n    activityToDo = \"go play with friends.\";\n} else {\n    if(haveTV) {\n\
    \        activityToDo = \"watch favorite TV show.\";\n    } else {\n        activityToDo\
    \ = \"do nothing\";\n    }\n}\n```\n\n## 其他\n\n在 Java 中进行决策我们还有另一种值得注意的选择。[switch\
    \ 语句](http://docs.oracle.com/javase/tutorial/java/nutsandbolts/switch.html) 非常强大，可以用于有许多备选择且每个选择都导致不同代码执行路径的特殊情况。在某些方面，switch\
    \ 语句是我所称的 `if-then-else if-then-else` 语句的优化版本。它更像是一个匹配语句，而不是决策语句。你应该对此进行更多研究，因为随着你经验的增加，它在更大的项目中会非常有用。\n\
    \n## 方法\n\n从“类和对象”章节中，你已经学习了 Java 中的方法用于为我们的类及其实例提供功能。在本章中，我们将深入研究方法，学习如何创建它们、如何访问它们，以及为什么它们对\
    \ Java 编程如此重要。有很多东西要学，这将是书中较大的章节之一，所以请慢慢、冷静地学习。\n\n## 为什么方法重要且有用\n\n记住，在 Java\
    \ 中，一切都围绕对象展开。对象对于 Java 程序就像名词之于英语句子。如果对象如此重要，如果我们能做的只是在它们中存储信息，那它们将非常无趣。类的字段对于存储类实例的信息是非常棒的，但它们本身并没有什么乐趣。它们不能执行任何酷炫的技巧。它们只是坐在那里占据我们程序中的空间。\n\
    \n## 面向人类 Java\n\n想象家里带回了一只新狗并给它命名，记住它的颜色、年龄和高度，但却无法对它做任何事情。如果是这样，你对新狗的兴奋不会持续多久。你会希望它能够真正执行一些酷炫的技巧，而不是仅仅呆在那里占据你客厅的空间。这就是为什么\
    \ Java 和其他编程语言决定引入“方法”的概念。\n\n通过方法，我们不仅可以操作字段中的数据，还可以操作提供给我们的其他数据，以便为用户创建新的信息进行消费。方法虽然非常强大，但非常易于使用。我们可以为类提供虚拟无限数量的方法供其实例执行。\n\
    \n## main 方法\n\n正如你所学到的静态方法一样，某些方法甚至不需要通过其类的实例来调用。自从我们在“Hello World”章节中运行第一个程序以来，我们一直在使用这些静态方法中的之一了。在我们运行程序的类中，我们在它的\
    \ `main` 方法中编写了代码。程序主类的 `main` 方法是静态的，计算机通过调用它来运行我们的程序。从那里开始，我们的其余代码将从上到下顺序执行。我们可以为主类命名为任何名称，但必须将主方法命名为\
    \ `main`。只有你的主类需要拥有 `main` 方法来运行程序，但它必须存在于程序中的至少一个类中：\n\n```java\npublic class\
    \ Main {\n    /**\n    * 你的代码将按顺序执行，\n    * 从这里开始，从上到下。\n    * @param args 计算机在调用此方法时为你提供的参数。\n\
    \    */\n    public static void main(String[] args){\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n## 方法语法\n\n记住，方法的命名方式与我们命名变量相同，但它们需要更多信息才能工作。当我们创建一个方法时，我们必须在方法的签名（signature）中提供五个主要的信息点（大多数情况下只有四个）。重要的是要记住，没有两个方法可以具有相同的签名，但两个方法可以有相同的名称，尽管这通常不是一个好主意。\n\
    \n在签名之后，我们在一对单层大括号之间创建方法体。方法的签名和方法体构成了方法的作用域（scope）。作用域简单地定义了其中声明的变量的生命周期。每个左大括号开始一个新的作用域，每个右大括号结束上上一个开启的作用域：\n\
    \n`{scope 1 {scope 2 {scope 3}} {scope 4 {scope 5 {scope 6}}}}`\n\n在作用域中声明的变量在作用域结束之前有效且可访问。因此，在作用域一中声明的变量可以从作用域一内的所有作用域访问，但作用域三中声明的变量对作用域二可用，而作用域六中声明的变量对作用域五和四可用，如上所示。在\
    \ Java 中，虽然你可以在类中放置尽可能多的方法，但在方法内部嵌套方法是不允许的。\n\n## 方法签名\n\n首先我们需要提供访问修饰符来告诉编译器从哪里可以访问方法。接下来，我们需要说明它是静态的；默认情况下方法不是静态的，所以我们可以省略该关键字。之后，我们需要告诉编译器方法返回什么类型的数据（数据类型），大多数情况下这是一个类类型或原始类型，其他时候我们可以返回数据结构。然后，我们需要为方法命名一个驼峰命名法，这通常是唯一的——你稍后会学习何时不唯一。最后，我们需要声明在调用方法时必须提供的参数列表。当我们提供了所有这些信息后，就可以用左大括号开始方法体，用右大括号结束：\n\
    \n```java\npublic // 访问修饰符\nstatic // 说明方法是静态的\nint // 返回类型\nadd // 名称\n(int num1,\
    \ int num2) // 参数\n{ // 开始体，作用域\n//体：编写有趣的代码\n} // 结束体，作用域\n```\n\n## 方法访问修饰符\n\
    \n`public` 方法可以在程序的任何地方访问，但 `private` 方法只能在所属的类内部访问。`protected` 方法可以在方法所属类的相同包内的任何类中访问。访问修饰符在实例方法和静态方法上的作用是相同的。直观上，方法只能从可以访问该方法类的部分访问。\n\
    \n## 方法返回类型\n\n方法必须在签名中指定返回类型。返回类型告诉编译器方法将返回什么类型。如果方法不返回任何内容，我们可以指定 `void` 为返回类型。`void`\
    \ 方法将执行它必须做的事情但不向调用者返回任何内容。否则，我们必须指定返回的数据类型。我们可以返回 Java 原始类型、Java 提供的数据类型（包括 `String`）以及自定义数据类型（例如我们创建的类）。此外，我们可以返回数据结构，如数组、`LinkedList`\
    \ 和 `HashMap`。我们很快就会学习更多关于数据结构的知识，但只需知道它们是持有一组相同类型数据的数据类型即可。\n\n## 方法参数\n\n"
