- fmt: "\nThat data can be how much money is in your bank account or the pass code\
    \ to access it. It could be how many classes you have this week and each course\
    \ could have more data that says what its title is, who the teacher is, and what\
    \ its about. That data could even be a picture on Instagram, how many times its\
    \ been double-tapped, and who owns the picture. Or, a more fun example is data\
    \ about the release angle of your Angry Bird and where it’ll land on the tower\
    \ to knock it down. All of that data has to be stored somewhere in order to be\
    \ manipulated and displayed to you, the user. That’s exactly what variables are\
    \ used for. We can store a single data point, or value, in a variable for later\
    \ use. Let’s use the example of the bank account to understand why variables are\
    \ important and what they are useful for.\n\n## Using Variables to Store Bank\
    \ Account Data\n\nSuppose we are making a new bank account. We need to store some\
    \ information about the account and its owner for later use. The account will\
    \ have a unique identification number, a balance, a status of whether or not it’s\
    \ active, and a pass code (pin number). Further, the account will have information\
    \ about the owner: the owner’s name, address and birthday. All in all, our bank\
    \ account will have the following variables:\n\n`identifier`\n`balance`\n`pass\
    \ code`\n`active`\n\n## Learning to Read and Write\n\n14\n\n`owner's name`\n`owner's\
    \ address`\n`owner's birth year`\n`owner's birth month`\n`owner's birthday`\n\n\
    Now, from earlier, you know that we are able to store all of that information\
    \ in a single variable to use it later. To do this in Java, we can use a `[String](http://docs.oracle.com/javase/7/docs/api/java/lang/String.html)`\
    \ which allows us to store, or represent, character strings. Making a string in\
    \ Java is simple. A string is an instance of Java’s `String` class which is provided\
    \ to us.\n\n## Single String Variable to Store Our Account Information\n\nLet’s\
    \ make a `String` variable to hold our above bank account information to see how\
    \ we can create and use variables:\n\n```java\nString bankAccount = \"identifier:\
    \ 1234567828;\nbalance: 1301.78; passcode: 9889; active: true;\nowner's name:\
    \ Lincoln Daniel;\nowner's address: 325 JavaPlace, UnitedJavas 19081;\nowner's\
    \ birthday: May 26, 1993\";\n\nSystem.out.println(\"Our bank account: \" + bankAccount);\n\
    ```\n\nNow we have our whole bank account stored in that single variable which\
    \ is a `String`. Notice that to create a variable, we say what type of variable\
    \ it is, a `String` in this case, then give it a name, `bankAccount`, and finally\
    \ use the equals operator (`=`) to set it equal to something. In this case, something\
    \ is all of our bank account information. Finally, no two variables can have the\
    \ same name and we’ll learn why later.\n\nIn that code block, we have a single\
    \ `String` variable called `bankAccount` that holds all of the information about\
    \ our bank account. If we later want to check our bank account, we will print\
    \ it to the system and see that our account’s identifier is 1234567828, balance\
    \ is 1301.78 dollars, passcode is 9889, its true that it’s active, the owner’s\
    \ name is Lincoln Daniel, the owner’s address is 325 JavaPlace, UnitedJavas, 19081,\
    \ and and the owner’s birthday is May 26, 1993.\n\nBut what if we leave the bank\
    \ and come back and just want to know what our balance is? That single variable\
    \ won’t be able to give us our account balance alone. Instead, it’ll give us all\
    \ the information about our bank account. That is bad for many reasons. Imagine\
    \ going to the ATM and having all of that information about you and your bank\
    \ account displayed on the screen for the guy behind you to peek at. That would\
    \ not be safe.\n\nIn the *Datatypes* section, we will learn about datatypes in\
    \ Java and how we can use them to store each individual data point about our bank\
    \ account in seperate variables so that we can later manipulate and use each one\
    \ individually.\n\n## Java for Humans\n\n15\n\n## Datatypes\n\nJava datatypes\
    \ have a simple purpose and that is to store different types of data in appropriate\
    \ variables for efficiency in later use. Look at it in the case of a dog and an\
    \ apple. Your dog is an animal and your apple is a fruit. You wouldn’t try to\
    \ do the same things with your dog that you would with your apple, would you?\
    \ Not sure? Try to make your apple bark. Another fortune of datatypes is predictability.\n\
    \n## Why Datatypes are Important and Useful\n\nDatatypes give our data the power\
    \ of predictability. If you have a dog, you know for a fact that it can bark,\
    \ so it would be okay to ask it to do just that. If you have an apple, you know\
    \ for a fact it is okay to eat it because that’s what apples are for. But what\
    \ if someone wrapped an apple in a dog suit and gave it to you without you knowing?\
    \ You would try to make that dog bark, but nothing would happen. You would try\
    \ to take it for a walk and it wouldn’t move. This is the same idea with datatypes\
    \ in Java.\n\nYou can’t count with a `String` because strings represent characters\
    \ that make concepts like words and stories like the one you are reading now.\
    \ On the other hand, you can count with integers. However, if you try to make\
    \ a word with an integer, nobody would understand.\n\nWe can use this logic towards\
    \ data in Java. If you store your data in appropriate datatypes, you will be able\
    \ to safely use them you wish later because you know exactly what type of data\
    \ they are. \n\n## A Better Way to Store Our Bank Account Information\n\nRemember\
    \ that variables are useful for storing information for later use and manipulation.\
    \ We want it to be easy to get only the information we need, use it as we want,\
    \ and move on. Given that, we do not want to store all of our information in a\
    \ single variable. It helps if we first understand what types of data we are trying\
    \ to store:\n\n`identifier` is a number\n`balance` is a number with a decimal\
    \ point (floating point number)\n`pass code` is a number\n`active` is a true or\
    \ false value\n`owner’s name` is a character string\n`owner’s address` is a character\
    \ string\n`owner’s birth year` is a number\n`owner’s birth month` is a character\
    \ string\n`owner’s birthday` is a number\n\n## Learning to Read and Write\n\n\
    16\n\nNow that we know what types of data we need to store, let’s see how Java\
    \ can help us. Java has primitive data types for us to use to store our information.\
    \ We can store numbers as `int` variables,floating point numbers as `double`,\
    \ and true or false values as `boolean`.\n\nIf we wanted to store a single character\
    \ in a variable, we could use the `char` primitive type. Along with those primitive\
    \ types, Java also allows us to store character strings in `String` variables.\
    \ There are four more primitive data types provided by Java, but they are not\
    \ necessary for beginners.\n\n## Store Each Piece of Data in its Own Variable\n\
    \nLet’s make nine individual variables to store our bank account’s nine individual\
    \ data points:\n\n```java\nint id = 1234567828;\ndouble balance = 1301.41;\nint\
    \ passCode = 9889;\nboolean isActive = true;\nString ownerName = \"Lincoln W Daniel\"\
    ;\nString ownerAddress = \"325 JavaPlace, UnitedJavas 19081\";\nint ownerBirthYear\
    \ = 1993;\nString ownerBirthMonth = \"May\";\nint ownerBirthDay = 26;\n\nSystem.out.println(\"\
    Our bank account's balance: \" + balance);\n```\n\n***Output***\n\n*Our account's\
    \ balance: $1301.41*\n"
