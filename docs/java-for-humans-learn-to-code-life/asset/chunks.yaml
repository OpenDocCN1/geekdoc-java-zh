    \ `Human` 所有者，以及一个 `final` 的唯一 `id` —— 设置后无法更改。我们的 `CoolDog` 类还有一个 `static` 字段，用于跟踪程序中实例化了多少只酷狗。最后，所有酷狗都会叫叫、翻滚和跳跃。我们还有一个\
    \ `Human` 类，我们将它来定义 `CoolDog` 类中的一个字段，但该代码只能在本章的支持代码中找到。\n\n### 学习分类数据\n\n```java\n\
    public class CoolDog {\n\n  ...\n\n  public CoolDog(String name, int age, int\
