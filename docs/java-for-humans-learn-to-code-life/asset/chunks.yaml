    **Why Encapsulation is Important & Useful**


    Encapsulation is the reason you don’t have to calculate your own change when you
    go to a vending machine. You slip in your cash and out comes correct change. Behind
    the scenes, the machine is keeping track of how much money it has available, how
    much each item costs, and how much money you give it. It also has functions to
    dispense the right item if you provide it enough money as well as a function to
    calculate how much change to give you. This allows you to simply walk up, give
    it a dollar, select an item, get the item and your change, and go enjoy life without
    worrying about the complex calculations going on behind the scenes. This is why
    encapsulation is so great in programming.


    In Java, we can use encapsulation to hide the hard work from the user of our program,
    or teammates who use our code, while providing them access to the functionality
    they need. Let’s model our vending machine situation in code to get a closer look
    of how awesome encapsulation is:


    /*some methods have been omitted in this code snippet*/


    public class VendingMachine {


    private double cookieCost;


    private double gumCost;


    private double changeFromLastPurchase = 0;


    public VendingMachine (double cookieCost, double gumCost) {


    this.cookieCost = cookieCost;


    this.gumCost = gumCost;


    }


    public double getCookieCost(){ return cookieCost; }


    public double getGumCost(){ return gumCost; }


    public void buyItem(String whichItem, double payment){


    resetLastPurchaseChange();


    if(itemExists(whichItem)) {


    if(paymentIsEnough(whichItem, payment)) {


    dispenseItem(whichItem);


    calculateChange(whichItem, payment);


    } else { alertUser(whichItem, payment); }


    }


    }


