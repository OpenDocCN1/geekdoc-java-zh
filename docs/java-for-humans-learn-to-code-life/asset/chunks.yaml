    public double getChange() {


    return changeFromLastPurchase;


    }


    private boolean paymentIsEnough(String whichItem, double payment) {


    if(whichItem.equals("cookie")) {


    return payment >= cookieCost;


    } else if (whichItem.equals("gum")) {


    return payment >= gumCost;


    } else { return false; }


    }


    private void dispenseItem(String whichItem) {


    System.out.println("Here''s your " + whichItem);


    }


    ...


    }


    Now, there’s a good deal of code there, so let’s break it down.


    **Access Modifiers**


    Encapsulation in Java would not be as effective as it is today without access
    modifiers. Access modifiers allow us to decide how parts of our classes can be
    accessed by other classes in other parts of our program. If we want a field or
    method to be accessible from anywhere, by any class, we can mark it as public.
    By default fields, method, and classes are public to all other classes in their
    package. If we only want a field or method in our class to be accessed from within
    our class, we can mark them private.Finally, if we want to explicitly constrain
    the access of a field or method to subclasses of their class or other classes
    the same package, we can mark them as protected. Nonetheless, as a beginner, your
    focus is on public andprivate until you begin building larger programs.


    In Java, by default fields, method, and classes are package-private, which means
    they cannot be accessed from outside of their package. That is only the case when
    we do not specify an access modifier. In this book, we only focus on public, private,
    and protected but it would be good to know this and research it more.


    Classes can also be marked with access modifiers. At the top-level, scope one,
    a class can only be *public* or *pack-private*. An inner class, however, can be
    marked the same way as fields and methods, but that, too, is beyond the scope
    of this book. For our purposes, all of our classes will be marked as public.


    **Java for Humans**


    51


    **Encapsulation & Our Vending Machine**


    Before we analyze our vending machine class, it’s important that you know there
    are a few methods missing from the snippet above. You can view the full class
    and the accompanying executable program in the supporting code section.


    If we start at the top of our vending machine class, you’ll see that all three
    of its fields, cookieCost, gumCost, and changeFromLastPurchase, are private. This
    ensures that no outsiders can change their values because the owner of the machine
    wouldn’t want customers changing the prices of the items in the machine and choosing
    how much change customers get.


    When creating an instance of the VendingMachine class, the owner must provide
    the cost of the items as arguments to the constructor. The only public methods
    are the constructor for the owner to construct a new instance of the vending machine,
    and the three functions users of the machine would care to use: getting the price
    of items, buying items, and getting their change.


    When a customer walks up to an instance of our VendingMachine class, they can
    only call the three public methods because the rest, including the omitted ones,
    are private. The customer can ask to see how much a cookie or a gum is, and if
    they are satisfied with the prices our machine returns, they can invoke the machine’s
    buyItem() method to try to buy an item. Behind the scenes, our buyItem() method
    will call our other methods which are private to do the work.


    public class StoreProgram {


    public static void main(String[] args) {


    System.out.println("Starting Store Program");


    System.out.println("Owner creates vending machine.");


    VendingMachine vendingMachine = new VendingMachine(0.75,


    0.50);


    System.out.println("Customer starts using machine.");


    double costOfCookie = vendingMachine.getCookieCost();


    System.out.println("Wow cookies cost " + costOfCookie);


    System.out.println("and gum costs " + costOfGum);


    System.out.println("I''m going to buy a cookie!");


    vendingMachine.buyItem("cookie", 1.00);


    double change = vendingMachine.getChange();


    System.out.println("\nGot my change of " + change + "


    cents");


    }


    }


    **Learning to Classify Data**


    52


    The buyItem() method will have to call our private itemExists() instance method
    to check if the item the user wants to buy actually exists in our machine. Next,
    if the item exists, the machine will call its privatepaymentIsEnough() instance
    method to check if the user paid enough money for the item. If the user paid enough
    for the item, the machine will call its private dispenseItem() instance method
    to give the user the item he/she just bought. Finally, the machine will call its
    privatecalculateChange() instance method for the purchase and store the result
    in the changeFromLastPurchase instance field. Finally, the user can call the machine’s
    public getChange() instance method to get his/her change from the last purchase.
    That’s it.


    We have built a vending machine interface for our users to use with ease by employing
    encapsulation. You will want to make extensive use of encapsulation as you grow
    in your programming knowledge. It will make your code clearer and safer for you
    and teammates and easier for users.


    Well there it is! You are past the stage of not knowing how to code now. You are
    on to the stage of becoming a better programmer. Soon, you’ll learn about looping,
    data structures for storing sets of data for later use, and how to get user input,
    which you’ve already seen in action.


