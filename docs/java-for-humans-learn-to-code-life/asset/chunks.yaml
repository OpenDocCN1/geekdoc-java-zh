    \ `Human` 实例的 `petDog` 字段，并让 `CoolDog` 跳跃十英寸五秒。我们可以将返回的 `CoolDog` 实例保存到变量中并对其调用：\n\
    \n```java\nCoolDog petDog = person.getDog();\npetDog.jump(10, 5);\n```\n\n有时，实现同样功能更有效的方法可能是使用链式调用。当\
    \ `person` 返回它的 `CoolDog` 实例时，我们可以立即让它跳转而无需保存：\n\n```java\nperson.getDog().jump(10,\
    \ 10);\n```\n\n这种使用链式调用的方法减少了代码编写并节省了内存空间。\n\n## 访问修饰符与封装\n\n作为人类，我们利用公司、父母、老师、朋友和政府提供的工具。大多数时候，我们并不关心这些工具在后台是如何工作的；我们只关心它们在我们调用它们时能够工作并完成任务。\n\
    \n当你去自动售卖机处用美元钞购买饼干时，你并不一定关心机器如何知道你给的是一张有效的美元而不是一张打印纸，但你确实期望它接受你的美元作为支付方式并吐出饼干。如果饼干只卖\
    \ 0.75 美元，你期望机器还会退给你一个季度币，而你并不关心它是如何做到的。你不了解机器里有多少钱，也不了解它是如何计算决定退还你多少钱的。如此，我们可以说它的所有功能都被封装了。英语字典对“封装”的定义是：“将某物包在在胶囊内或像胶囊一样。”\n\
    \n在计算机科学中，我们将封装定义为：“为（某部分软件或硬件）提供接口，以允许或简化用户的访问。”\n\n**面向人类的 Java**\n\n"
