  trans: "\nJava 字符串非常强大。虽然 `String` 看起来仅仅是字符序列的简单表示，但它是 Java 中存储信息和数据的最佳方式之一。由于字符串对于编程至关重要，Java\
    \ 的创建者决定专门用整个类来处理它们，并为该类提供了实用的方法，使数据操作变得更加简单。在本章中，我们将学习如何使用 `String` 类的一些实例方法来比较字符串、在字符串中搜索单个字符或子字符串、提取子字符串等。你并不需要读完整个章节，但了解这些函数可供你使用是非常重要的。\n\
    \n### 为什么字符串操作既重要又有用\n\n在程序中，你经常会遇到可以存储为 `String` 的数据。当你将数据存储为 `String` 实例时，你就可以使用\
    \ `String` 类的实例方法来对这些数据进行处理。这种功能允许你对已拥有的数据进行更多的操作。\n\n### 比较字符串\n\n你在程序中运行很多次的操作之一就是比较两个\
    \ `String` 实例。如果你有一个 Facebook 账号，在尝试登录时，系统会要求输入用户名和密码。在后台，Facebook 会将你提供的用户名和密码与它们存储在数据库中对应账号的用户名和密码进行比较。如果比较成功，你就可以登录；如果失败，你必须重试。\n\
    \n`String` 类提供了方便的比较实例方法供我们比较两个实例。我们可以使用 `equals()` 来比较两个区分大小写的字符串，或者使用 `equalsIgnoreCase()`\
    \ 在不考虑大小写的情况下进行比较。这两个方法都返回一个布尔值——如果比较成功则返回 `true`，否则返回 `false`。让我们在 Java 中模拟一个社交网络登录登录过程：\n\
    \n```java\nString usernameInDatabase = \"modernNerd\";\nString passwordInDatabase\
    \ = \"mN123Java\";\nString providedUsername = \"modernnerd\";\nString providedPassword\
    \ = \"mN123Java\";\n\nif(providedUsername.equalsIgnoreCase(usernameInDatabase)){\n\
    \    // 用户名比较成功\n    // 检查提供的密码\n    // 这将失败\n    //if(\"mn123java\".equals(passwordInDatabase)){}\n\
    \    // 这将通过\n    if(providedPassword.equals(passwordInDatabase)){\n        System.out.println(\"\
    Success! You are logged in.\");\n    } else {\n        System.out.println(\"Wrong\
    \ password. Try again.\");\n    }\n} else {\n    // 用户提供的用户名错误\n    System.out.println(\"\
    Wrong username. Try again.\");\n}\n```\n\n如果用户提供的用户名 `providedUsername` 与数据库中的用户名\
    \ `usernameInDatabase` 匹配（忽略大小写），我们想要检查用户提供的密码 `providedPassword` 与数据库中的密码 `passwordInDatabase`\
    \ 是否大小写匹配。如果所有字符串比较都通过，我们就可以允许用户登录。\n\n### 统计字符串中的字符\n\n某些社交网络应用（如 Twitter）允许用户发布长度限制的消息。它们将用户输入的消息捕获为\
