    would be a logical contradiction which Java does not allow.


    ## Interfaces


    An interface is a bit different than anything we’ve seen thus far. A Java interface
    is more like an abstract class than a regular class. An interface can only contain
    method signatures and static final fields. An interface is merely a contract between
    the interface and classes that implement it. Like with abstract classes, classes
    that implement an interface must implement its methods’ bodies to provide functionality.


    Interfaces are best for creating a contract that will ensure that all classes
    that implement it behave similarly by abiding by the contract. This will allow
    users to safely expect parts of your program to behave similarly much like you
    would expect all characters in a fighting game to behave similarly. In our Conquer
    game from the Class Inheritance chapter, we expect all characters to be able to
    attack other characters, defend themselves from attacks, jump, and heal themselves
    among other functions. These functions are functions all characters can perform,
    not only Human instances:


    ```java

    public interface Character {


    Random randomGenerator = new Random();


    String getName();


    double getHealth();


    long getExperience();


    int getAttackPower();

    ```


