    \n# 多态\n\n在之前对“类继承”和“抽象类与接口”章节中对多态的简短回顾中，我们领略了多态的强大之处。在这两个章节中，我们学到任何能够通过多个“is-a（是一个）”测试的对象，即任何属于超过一种类型的对象，都被认为是多态的。如此，我们可以将多态定义为对象承担\
    \ hơn 一种形式的能力。\n\n## 为什么多态重要且有用？\n\n多态是面向对象编程中最重要的概念之一。它允许我们说 Java 中的所有类型既是其所属类的类型，也是\
    \ `Object` 类的类型；我们已经了解到，由于 Java 的类层级结构，Java 中的所有对象都是 `Object` 类的实例。\n\n## 一个功能适用于所有\n\
