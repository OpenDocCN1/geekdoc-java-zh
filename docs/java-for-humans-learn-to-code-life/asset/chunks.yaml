    \ methods, don’t even need to be called by an instance of their class. We’ve been\
    \ working with one of those static methods since the first program we ran in the\
    \ “Hello World” chapter. In the class that we ran the program from, we wrote our\
    \ code in its `main` method. The `main` method of your program’s main class is\
    \ static and the computer calls it to run our program. From there, the rest of\
    \ our code runs in order from top to bottom. We can call the main class anything\
    \ we want, but we must call the main method `main`. Only your main class needs\
    \ to have the `main` method to run your program, but it must be present in at\
    \ least one class in your program:\n\n```java\npublic class Main {\n    /**\n\
    \    * Your code is executed in order,\n    * top to bottom, starting from here.\n\
    \    * @param args arguments the computer\n    * provides to this method when\
    \ it calls it.\n    */\n    public static void main(String[] args){\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n## Method Syntax\n\nRemember that methods\
    \ are named the same way we name variables, but they require a bit more information\
    \ to make them work. When we make a method, we must provide five, most of the\
    \ time its only four, main points of information in the signature of our method.\
    \ It is important to remember that no two methods can have the same signature,\
    \ but two methods can have the same name although this is usually not a good idea.\n\
    \nAfter the signature, we create the body of our method between a single set of\
    \ opening and closing curly brackets. The signature of our method and its body\
    \ are the scope of our method. The scope simply defines the lifetime of variables\
    \ declared in it. Every opening curly bracket starts a new scope and every closing\
    \ curly bracket ends the last open scope:\n\n`{scope 1 {scope 2 {scope 3}} {scope\
    \ 4 {scope 5 {scope 6}}}}`\n\nVariables declared in a scope live, are accessible,\
    \ until that scope ends. Thus, a variable declared in scope one is accessible\
    \ from all of the scopes within scope one, but a variable declared in scope three\
    \ is only available to scope two, and a variable declared in scope six is only\
    \ available to scope five and four as illustrated above. In Java, while you can\
    \ put as many methods as you desire in a class, it is not legal to embed a method\
    \ inside another method.\n\n## Method Signature\n\nFirst, we need to provide an\
