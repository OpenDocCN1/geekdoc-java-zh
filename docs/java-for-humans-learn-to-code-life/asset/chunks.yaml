    \ new instance of it, the constructor will set the name of our instance with whatever\
    \ we provide it and finish by calling the private and static `incrementNumHumansAndPrint()`\
    \ method of the `Human` class to print the new number of `Human` instances that\
    \ exist in our program. Notice the the `incrementNumHumansAndPrint()` method calls\
    \ on the private and static `incrementNumHumans()` method to do the work of increasing\
    \ the number of humans by one. These functions may appear trivial and lazy now,\
    \ but we’ll soon see why its smart to separate work like this.\n\n```java\npublic\
