- fmt: "\nIn that code snippet, we created an array called `friends` to hold a maximum\
    \ of five `String` values — the names of our friends. Now that we have our array\
    \ instance, we can access each element of the array by accessing its index in\
    \ the array. Because indices in Java are zero-based, the first element in an array\
    \ is stored at index zero (`0`) and the last element is at index of one less than\
    \ the length of the array. Therefore, if we want to access our first friend, we\
    \ would access index `0`.\n\nAt initialization, all elements in in the array are\
    \ initialized to a zero value: `null` for arrays of objects, `0` for primitive\
    \ number types, and `false` for boolean types. Let’s add our friends to the array\
    \ before we try to get them out:\n\n```\nfriends[0] = \"Imani\";\nfriends[1] =\
    \ \"Andres\";\nfriends[2] = \"Keith\";\nfriends[3] = \"Sasha\";\nfriends[4] =\
    \ \"Tabitha\";\n```\n\nNow that we have added our five friends to our `friends`\
    \ array, let’s access the first and last one and print them out:\n\n```\nString\
    \ firstFriend = friends[0];\nSystem.out.println(\"First friend is \" + firstFriend);\n\
    System.out.println(\"Last friend is \" + friends[friends.length - 1]);\n```\n\n\
    ***Output***\n*First friend is Imani*\n*Last friend is Tabitha*\n\nNotice that\
    \ we were able to access the last element in our `friends` array by doing a little\
    \ math. We used the `length` property of the array to get the total number of\
    \ elements in it array and subtracted one from that number to get the index of\
    \ the last element. That is the dynamic way of accessing the last element, but\
    \ we could have just as easily typed `friends[4]` to access the fifth (last) element\
    \ in our array of five friends. In the unfortunate event that we lose a friend,\
    \ we should zero out the value of the element in our array that corresponds to\
    \ our lost friend. If we lose our first friend and our second friend changes her\
    \ name, we can reflect those updates in our array like so:\n\n```\nfriends[0]\
    \ = null;\nfriends[1] = \"Alejandro\";\nSystem.out.println(\"First friend is now\
    \ \" + friends[0]);\nSystem.out.println(\"Second friend changed name to \" + friends[1]);\n\
    ```\n\n***Output***\n*First friend is now null*\n*Second friend changed name to\
    \ Alejandro*\n\nNow our first friend equals `null` and our second friend, Andres,\
    \ changed his name to Alejandro. Let’s make another array to hold the corresponding\
    \ phone numbers of all our friends as integers:\n\n```\nint[] friendsPhoneNumbers\
    \ = new int[friends.length];\nfriendsPhoneNumbers[0] = 555_8000;\nfriendsPhoneNumbers[1]\
    \ = 5554448;\nfriendsPhoneNumbers[2] = 555_4311;\nfriendsPhoneNumbers[3] = 555_7898;\n\
    friendsPhoneNumbers[4] = 555_6710;\n```\n\nOur `friendsPhoneNumbers` array is\
    \ initialized with the value of the `length` property of our `friends` array to\
    \ ensure they both have the same number of elements.\n\n***Note!***\nNotice that\
    \ some of the phone numbers have underscores in them. Using underscores in long\
    \ numbers, like commas on paper, make them easier to read. You can add underscores\
    \ between numbers, not at the start nor end.\n\nWe can loop over, or traverse,\
    \ our array of friends to print out the name of each of our friends by using a\
    \ `for` loop terminated by the length of our array:\n\n**Java for Humans**\n\n\
    ```\nfor(int index = 0; index < friends.length; index++) {\n    System.out.printf(\"\
