    \ as the class the method belongs to. Those access modifiers work the same on\
    \ both instance and static methods. Intuitively, a method can only be accessed\
    \ from the parts of a program where the method’s class can be accessed.\n\n##\
    \ Method Return Types\n\nA method must specify a return type in its signature.\
    \ A return type tells the compiler what datatype will be returned by the method.\
    \ If the method will not return anything, we can specify `void` as the return\
    \ type. `void` means that the method will do what it has to do and return nothing\
    \ to the caller. Otherwise, we must specify a datatype to be returned. We can\
    \ return Java primitives, datatypes provided by Java, including a `String`, and\
    \ custom datatypes, such as classes we create. Further, we can return data structures\
    \ like arrays, `LinkedLists`, and `HashMaps`. We will learn more about data structures\
    \ soon, but for now, know that they are simply datatypes that hold a set of data\
    \ of the same type.\n\n## Method Parameters\n"
