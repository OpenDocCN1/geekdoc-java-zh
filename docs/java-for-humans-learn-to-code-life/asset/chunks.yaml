    Christina\");\nWarrior human4 = new Warrior(\"Tyrone\");\nTaoist human5 = new\
    \ Taoist(\"Jerome\");\n```\n\n我们是 `currentUser` `Human` 实例，它也是一个 `Archer` 实例。注意\
    \ `human3` 就像我们的角色：它的类型是 `Human`，但被实例化为 `FireArcher`。再次，这就是多态之美。让我们来看看 `Human`\
    \ 类：\n\n```java\npublic abstract class Human implements Character {\n    private\
    \ LinkedList<Human> friendsList = new LinkedList<>();\n\n    ...\n\n    public\
    \ LinkedList<Human> getFriends() {\n        return friendsList;\n    }\n\n   \
    \ ...\n}\n```\n\n它有一个 `LinkedList` —— `friendsList`，接受 `Human` 实例作为元素。我们将用它来持有我们的朋友列表。让我们获取它并存在局部变量中，并将其他角色添加到其中，因为它们是我们的朋友：\n\
    \n```java\n/*将当前用户的朋友列表引用存储在局部变量中*/\nLinkedList<Human> currentUserFriendsList\
    \ = currentUser.getFriendsList();\n```\n\n## 面向人类的 Java\n\n```java\n//将其他用户添加到当前用户的朋友列表\n\
    currentUserFriendsList.add(human2);\ncurrentUserFriendsList.add(human3);\ncurrentUserFriendsList.add(human4);\n\
    currentUserFriendsList.add(human5);\n\nSystem.out.printf(\"Current user has %d\
    \ friends.\", currentUser.getFriendsList().size());\n```\n\n**输出**\n*Current user\
    \ has 4 friends.*\n\n现在我们的列表中有四个朋友。记得我们列表中的每个元素都存储为 `Human` 实例，所以如果我们想从列表中检索一个朋友，它返回的将是\
    \ `Human` 类型。让我们检索 `human2`，“Tom”，它也是一个 `Archer`：\n\n```java\nHuman ourFriendTomTheHuman\
    \ = currentUserFriendsList.get(0);\n\nif(ourFriendTomTheHuman instanceof Archer)\
    \ {\n    System.out.println(\"\\nOur friend Tom is an instance of \" + \"the Archer\
    \ clas.s\");\n    Archer ourFriendTomTheArcher = (Archer) ourFriendTomTheHuman;\n\
    \    System.out.println(\"Tom can find more arrows for battle.\");\n    ourFriendTomTheArcher.findArrows();\n\
    } else {\n    System.out.println(\"\\nOur friend Tom is NOT an instance of \"\
    \ + \"the Archer class\");\n    //ourFriendTom.findArrows(); doesn't work\n}\n\
    ```\n*(注：由于原文文本在结尾处存在排版混乱，上述翻译已根据逻辑进行了对齐处理)*"
