    在这里，第一个布尔变量 `appleEqualsOrange` 将被设置为 `false`，因为相等运算符进行的比较为 `false` —— 由数字一 (1)
    表示的苹果等于由数字二 (2) 表示的橙子。然而，最后两个布尔变量将被设置为 `true`，因为最后两行中相等运算符进行的比较结果为 `true`；苹果 (1)
    等于另一个苹果 (1)，而苹果 (1) 显然不等于橙子 (2)。


    ## 关系运算符


    与数学一样，我们可以在 Java 中使用关系运算符来比较或衡量两个数据点之间的关系。我们可以分别使用 `>` 或 `<` 运算符检查一个数据点是否大于或小于另一个数据点：


    ```

    int one = 1;

    int two = 2;

    boolean twoIsGreaterThanOne = two > one;

    boolean oneIsLessThanTwo = one < two;

    ```


    当代码执行时，这两个布尔变量都将被设置为 `true`，因为关系运算符进行的比较为 `true`。此外，我们还可以分别使用 `>=` 和 `<=` 运算符检查一个数据点是否大于等于另一个数据点，以及一个数据点是否小于或等于另一个数据点：


    ```

    int three = 3;

    int twenty = 20;

    boolean threeIsLessThanOrEqualToTwenty = three <= twenty;

    boolean twentyIsGreaterThanorEqualToThree = twenty >= three;

    boolean oneIsLessThanOrEqualToOne = 1 <= 1;

    boolean twoIsLessThanOrEqualToOne = 2 <= 1;

    System.out.println("Two is less than or equal to one: " + twoIsLessThanOrEqualToOne);

    ```


    **Output**

    *Two is less than or equal to one: false*


    前三个布尔变量将被设置为 `true`，因为关系运算符进行的比较为 `true`。然而，最后一个是 `false`，因为我们都知道二不小于也不等于一。在随后的章节中，我们将学习如何使用相等运算符和关系运算符来做出决策并控制代码流。


    ## 组合运算符


    我们还可以组合运算符创建更强大的运算符。通过组合运算符，我们可以清理并优化代码。我们可以通过以下方式增加或减少变量的值：


    ```

    int count = 0;

    /*组合加法运算符与赋值运算符*/

    count++; //count 现在等于 (0 + 1) = 1

    count += 6; //count 现在等于 (1 + 6) = 7

    count--; //count 现在等于 (7 - 1) = 6

    count -= 2; //count 现在等于 (6 - 2) = 4

    /*乘法运算符与赋值运算符结合*/

    count *= 5; //count 现在等于 (4 * 5) = 20;

    count /= 10; //count 现在等于 (20 / 10) = 2;

    ```


    ### 学习读写


    `++` 运算符的意思是：“我看到了你当前的数值并将其增加一”，而 `--` 运算符则将持有数字的变量当前值减一。`+=` 运算符将右侧的数字加上左侧变量的值，并将和保存在变量中；`-=`
    `*=` 和 `/=` 运算符的工作原理类似。


    ### 其他


    还有一些有用的运算符，但它们需要的解释超出了本章的范围。在后面的章节中，你将学习如何通过将关系运算符、相等运算符与逻辑运算符结合，逻辑地检查数据条件，以便使用控制语句（判断语句和循环语句）做出决策。这些是强大的工具，允许我们的代码有时执行某些事情，有时又执行其他事情。


    ## 通过 Google 学习


    计算机科学、软件开发和工程行业的魅力在于，我们享受分享。我们喜欢分享知识、代码、人才以及任何推进我们世界技术创新所需的资源。


    我坚信在做中学学习。尝试构建一些东西，并进行 Google 查询来修复你弄坏的任何东西。学习编程的最佳方法之一就是投入其中从零开始构建东西。利用你可以获得的资源来促进并加速你的学习过程。当你遇到瓶颈时，站在前人的肩膀上，让你重回成功的道路。在本章中，我们将看看如何利用你的资源来自学编程，超越任何书籍或教程能教给你的水平。


    作为人类，我们只能积累和维护有限的知识。意识到世界的知识是无限巨大的，而且这延伸到了我们对编程语言和技术的认知上，这是非常重要的。因此，学习的能力远大于在任何特定时刻拥有人类所有知识却无法在知识扩张时学习更多。


    随着你学习并度过软件开发人员的生涯，你必须继续学习。我曾与极其聪明的人共事，从我的大学教授到我在 `IBM` 等公司的领导，他们有两个共同点：他们拥有数十年的编程经验，并且在遇到困难时仍然会使用
    Google。此外，他们不断学习新的技能和概念。


