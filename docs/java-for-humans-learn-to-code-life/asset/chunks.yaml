    由于 Tom 在被添加到我们的 `Human` 对象列表 `LinkedList` 之前已经被实例化为 `Archer`，因此他仍然可以访问抽象的 `Human`
    方法，这些方法已经由 `Archer` 类实现，并在 Tom 实例化时变得可用。尽管如此，如果我们执行 `ourFriendTomTheHumanattack
    human3`, “Christina”，他仍然会用箭箭攻击。这里唯一的问题是，由于 `ourFriendTomTheHuman` 在用完所有箭矢后将无法找到箭，他的
    `attack()` 方法在那时将变得毫无用。这就是为什么我们需要将他强制转换回 `Archer`。


    到这里，我你已经理解了为什么多态对于面向对象编程是如此特殊。在未来的 Java 编程职业生涯中，请务必运用多态。查看支持性的源码并尝试修改它们以进行更多练习。


    # 学习组织


    ## 第 7 章：应用知识


    ## 使用 GUI 构建战斗游戏


    恭喜你走到了这里。真的，你完成了一项伟大的成就。衡量你进步了程度的最终测试是让你用 Java 构建你的第一个图形化用户界面游戏。我已经为你开发了整个游戏，在本章中，我将介绍每个类的目的。有了这些知识，你将能够从零开始重建整个项目。


    如果你还记得我们在“抽象类与接口”章节中讨论的游戏，你会很高兴地知道我们在游戏中使用了那时创建的角色类。我们将模拟 MMORPG 游戏《征服》（Conquer）。在《征服》中，每个角色都有名字、一组特殊技能、一个宠物、生命值、攻击力、防御力以及说话能力。此外，每个用户都可以选择他们想扮演的角色类型。然而，只有两种角色类型，用户只能选择成为人类（Human）角色。人类角色可以拥有一个宠物角色。每个角色进行战斗直到产生胜者。我们的游戏将模拟这一切。


    由于我们使用了多态、模型-视图-控制器（MVC）编程模式以及接口，该应用程序非常容易导航。我非常详细地记录了该项目的源码，几乎对每一行代码都进行了注释，并为每个方法、类和接口提供了
    Javadocs。尽管如此，我在本章中不会花很多时间来解释项目代码库的复杂细节。


    本章支持代码的包名为 `buildingAGame`。在我们从高层面概述时，请将其打开以理解正在发生什么。让我们看看游戏的十四个类和一个接口，并遍历每个类，看看我们是如何应用在书中积累的所有知识的。


    ### 角色 (Characters)


    游戏最重要的部分是角色，因为没有他们就不会有很多动作。游戏中的每个玩家都是一个角色，所以我们有一个 `Character` 接口。任何意图创建可在我们游戏中运行的角色模板的类必须实现我们的
    `Character` 接口。为了让该实现变得简单，我们有一个 `AbstractCharacter` 类，它实现了 `Character` 接口中最通用的方法。


    任何意图创建可在我们游戏中运行的角色模板的类都必须扩展 `AbstractCharacter` 类。`AbstractCharacter` 类实现了 `Character`
    接口中除两个以外的所有方法。这意味着任何继承我们 `AbstractCharacter` 类的类只需要实现 `Character` 接口中的 `attack()`
    和 `train()` 实例方法。我们留下了这两个方法给子类来实现，因为从直觉上来说，不同类型的攻击和训练的方式是不同的：箭手（Archer）用箭攻击，战士（Warrior）用剑攻击，而道士（Taoist）用魔法攻击。虽然每个角色的防御力不同，但它们防御的方式相同——也许是通过举起武器挡住袭来的攻击。此外，有两种基础类型的角色，并且它们截然不同。由于如此，我们还有两个扩展
    `AbstractCharacter` 类的抽象类。


    对于我们的人类角色（即用户可以选择成为的类型），我们有一个 `abstract Human` 类，所有意图创建人类角色模板的类都必须扩展它。`Human`
    类是直接扩展 `AbstractCharacter` 类的类之一。人类角色可以拥有宠物和人类朋友。除此之外，人类角色与其他任何角色都非常相似。因此，`Human`
    类特有的唯一字段是用于存放实例宠物的 `Pet` 实例字段，以及一个用于实例累积朋友的 `Human` 对象 `final` `LinkedList`。朋友列表是
    `final` 的，因为我们希望我们的 `Human` 实例始终有一个朋友列表；它永远不会被设置为 `null` 或意外替换。`Human` 类的两个不同功能与设置和获取朋友以及宠物有关。`Archer`、`FireArcher`、`Warrior`
    和 `Taoist` 是扩展 `Human` 类的具体类。同样重要的是，`FireArcher` 是一种扩展 `Archer` 类的特殊箭手类型。它唯一的区别在于额外的
    `firePower` 实例字段，这增加了它的攻击力。


    `abstract Pet` 类是另一个直接扩展 `AbstractCharacter` 的类。所有意图创建宠物角色模板的类都必须扩展以成为我们游戏中有效的游戏角色。`Pet`
    类唯一的不同字段是用于存储实例所有者的 `Human` 实例字段。它唯一的不同方法是它的 `cry()` 实例方法，这是所有宠物发出特殊声音的接口；`Dog`
    可以通过 `cry()` 吠叫，`Lion` 可以通过 `cry()` 吼。目前 `Dog` 和 `Lion` 具体类是唯一扩展 `Pet` 类的类。


    ### 游戏 (Game)


    游戏非常简单。用户选择参与战斗的最大次数。每当用户点击“下次战斗”（Next Battle）时，随机攻击者和随机防御者之间开始战斗。攻击者试图对防御者造成伤害，只有当防御者的防御力小于攻击者的攻击力时才会成功。赢得战斗的人获得经验。为了通过动作获得经验，角色必须调用
    `gainExperience()` 实例方法并提供他们完成的动作字符串作为参数。该动作将用作键从 `AbstractCharacter` 类的静态 `actionExperiences`
    `HashMap` 中获取相应的经验值。这样，所有角色完成相同动作时都会获得相同的经验。


    最后幸存者是游戏的获胜者。游戏有一个 `String` 数组，存储每场游戏胜者的历史。用户每次启动我们的应用程序最多只能玩一百场游戏，因为我们的历史数组长度固定为一百。这仅仅是为了演示数组的使用，如果你允许用户尽可能多地玩你的游戏，可以将其更改为
    `LinkedList`。最后，游戏有一个每次应用程序启动时都要设置 GUI。


    #### GameGUI


    GUI 允许 `Game` 实例向用户显示游戏状态及其玩家的实时信息；我们的 `GameGUI` 类被 `Game` 类用于实现该目的。如前所述，每个 `Game`
    实例必须有一个我们 `GameGUI` 类的实例才能运行。GameGUI 利用 `JavaFX`，它允许开发人员创建比以往任何时候都要桌面、移动和 Web
    应用程序，并在视图中向用户显示关联的 `Game` 实例的信息。

    '
- fmt: '

    Our `GameGUI` is currently designed with three `textAreas` for displaying information
    about the game and ongoing battles in the game, one `TextField` for capturing
    user input, one `ListView` for displaying the standings of all the characters
    in the game, a `Button` to stat the game, and two more buttons to advance through
    the game. Setting all of that up is a bit more involved, but you’ll be able to
    understand each part as you read the documentation in the code.


    ## JavaFX Application


    Our application runs on JavaFX components for its GUI and a nice abstract `Application`
    class provided by JavaFX for easily launching and starting a application program.
    Our `GUIGameApplication` class extends the JavaFX Application` class and is at
    the root of our project. Its only duty is to hold the `main` method of our program.
    Its `main` method has a simple duty of calling the `launch()` instance method
    from the `Application` class. When that method is called, it will call the abstract
    `start()` instance method from the `Application` class to start our application.
    Our `GUIGameApplication` must implement that `start()`method which gives us access
    to the `primaryStage` field of the application. We must provide the `primaryStage`
    reference to our `Game`, which will provide its instance of our `GameGUI` class
    to display the JavaFX GUI for our game.


    ## Finishing Up


    And just like that, we are finished. You have learned so much about Java. In fact,
    you know everything you need to know to start building your own Java applications.
    Remember that the best way to learn is by doing and having fun while doing so.
    Your next steps are to play around with our game, take a look at each class in
    the supporting code for this chapter, read the documentation, and then try to
    write the entire project again. After that, try to build your own game or add
    to what we already have here. You are on your way. In the next chapter, we will
    take a look at some more fun projects we can take on to continue applying your
    new knowledge of Java programming.


    ## Conclusion


    At this point, you’ve learned everything you need to know about Java to get started
    on developing your own projects. Here’s a list of projects you can start with
    to build upon your new knowledge of Java:


    ### Java for Humans


    107


    ## Fun Projects


    ### Console Applications: Easy


    Study guide application to solidify your understanding of the Java concepts you’ve
    learned in this book. This will require you work with loops, objects, methods,
    and a `HashMap`. A simple calculator application to do some math to work on your
    knowledge of operators and user input and output.


    ### GUI Applications: Moderate


    A chat bot application. Keep an array of phrases the robot can say back to you
    and have one displayed whenever you enter something in the console. You can use
    some string manipulation and parsing to decide what the robot says back to you
    depending on what you say to it. Create a JavaFX GUI with one `TextArea` to show
    your conversation with the robot, one `TextField` for you to input a message,
    and a button to send the message to the robot. Create a to-do list of tasks you
    have to complete today. You can have the same GUI as the chat bot application
    but with an extra button that lets you delete a task.


    ### Android Applications: Moderate


    Android applications use Java for their code. You know Java, so you know most
    of Android. You can do anything with this one. Think of something to build, may
    be one of the ideas from above, and find a tutorial online to learn how to develop
    Android applications. A fun starting application is one that allows a user to
    text a friend because it doesn’t require much code. Like Java, Android does most
    of the heavy lifting.


    You could even find a tutorial to learn how to build a clone of popular applications
    like Snap Chat and Instagram. None of these are far out of your reach because
    they consist mostly of the concepts you’ve learned here. The only thing you don’t
    know yet is how to interact with a database server. You can learn that as you
    go.


    ## Making Money


    Once you have a couple projects under your belt, you can start applying for jobs.
    You can be a software engineer, designer, tester, or documentation specialist.
    The United State’s national average for software engineer salaries is $90,374
    according Glassdoor in 2016. That’s for full time engineers, but even interns
    make more than $7,000 per month at many technology and financial companies.


    If you are not interested in working for someone, you’ve also come to the right
    place. Silicon Valley is flowing with people like you who aren’t afraid to dream
    and do whatever it takes to see their dreams through. You could start the next
    popular social networking application like Facebook, LinkedIn, and Airbnb. The
    possibilities are endless when you have knowledge of Java.


    ## Applying Knowledge


    108


    ## Final Words: The End of the Beginning


    You are on your way to new and exciting times with your programming knowledge.
    Now that you know Java, it will also be easier to learn more languages that allow
    you to do even more fun things with the computers you use everyday.


    *As humans, we owe it to ourselves to not only consume the advancements of our
    world, but to produce more innovation that extend the capabilities of humankind.*


    I can’t wait to see what you do with your knowledge of Java. I would love to hear
    from you to know how you are applying your new knowledge.


    Finally, I’d like to leave you with a reminder and update of why we program:


    *We program to capture and manipulate information (data) to produce new information
    for the world to consume.*


    **Java for Humans**

