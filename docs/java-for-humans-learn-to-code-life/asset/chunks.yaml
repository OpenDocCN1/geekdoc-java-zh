    最后，如果你认为自己是 Java 专家或具备中等水平的程序员，《Java for Humans》将帮助你强化那些可能遗忘的 Java 基础知识。此外，作为经验丰富的程序员，我们总是在相互学习学习。《Java
    for Humans》将为你提供灵感，教你如何向那些可能是初学者或需要温习的人传授你的手艺。


    这本书不适合谁？任何认为自己固执、排斥新思维方式的人，如果是这样，那么这本书就不适合你。如果你不属于“这本书适合谁读”中的任何一类，那么这本书目前可能还不适合你。不过，请尽管与我一起开启这段旅程。


    ## 学习目标


    通过将编程/编码与你的人类经历联系起来，《Java for Humans》将教你目录中列出的所有概念。一些特别值得关注的包括如何创建一个 `class`、使用封装、使用
    `methods` 和 `variables`、数据类型和数据结构、`interfaces`（接口）以及极其强大的多态性。你还将学习 Java 编程的最佳实践、设计模式、技巧和窍门。


    你不仅将学习上述主题，我还会教你如何学习到超越任何书籍所能教的程度。你将学习如何在卡壳时使用 `Google` 和 `StackOverflow` 来获取更多知识。


    ## 前言


    我将教你如何通过研究、构建东西、破坏东西以及在过程中修复它们来学习。有些人把这种行为称为在半空中造飞机，但我称之为“在做中学”的过程。这是学习任何技能（尤其是编程）最有效的方法之一。


    ## 核心项目


    我相信在学习过程中要有乐趣。在书的最后，你将利用开发的所有奇妙技能和超能力，用 Java 制作并玩一个小战斗游戏。


    ## [ModernNerd 视频系列](https://www.youtube.com/channel/UC_zTAq-3TIfGqvoB_U6Peyg)


    由于有些人可能通过听解释比通过阅读学得更好，因此我在我的 YouTube 频道 ModernNerd 上发布了一个关于《Java for Humans》的视频系列。我将根据时间情况发布这些视频，因此请[订阅该频道](https://www.youtube.com/channel/UC_zTAq-3TIfGqvoB_U6Peyg)以便在我发布新视频时接收更新。


    ## Java for Humans


    ## 第 1 章：引言


    ### 关于 Java


    简单来说，Java 以咖啡命名，它运行着世界。根据 [Oracle](http://oracle.com/) 的数据，今天有超过三亿设备正在运行 Java。这之所以可能，是因为益于
    Java 虚拟机 (`JVM`)，Java 是一种可移植的语言。与其他语言不同，`JVM` 允许 Java 开发者在一个平台上编写并编译代码，然后在许多其他平台上运行。这让
    Java 成为编程界的一股力量。Google 意识到了这一点，并迅速让 Java 成为运行你 Android 手机的语言。Java 无处不在，从你还在过去旧的美国在线（AOL）拨号上网时代起，你就在使用它了。


    《Java for Humans》将帮助你学习如何构建你每天使用的酷工具。有了 Java 编程知识，你就可以开始为手机、电视和平板电脑构建 Android
    应用程序和游戏。此外，你不仅能用 Java 进行构建，还能更好地准备去学习更多编程语言，以扩展你能够构建的应用范围——从汽车到无人机软件。


    如果你需要更多动力来学习 Java，请阅读*应用知识*章节，了解更多关于用 Java 能做什么、作为 Java 程序员你可以获得什么，以及《Java for
    Humans》如何帮助你开启通往前景广阔的 Java 软件开发职业之路。


    ### 如何阅读本书


    在本章之后，我们将共同开启旅程。你将学习许多帮助你成为才华 Java 程序员的新概念。在我们开始之前，本节将涵盖一些我们需要解决的事宜，以确保我们的旅程顺利、和平且无压力。


    ### 集成开发环境 (IDE)


    本书将使用 Java 8，版本 `1.8.0_51`，你需要一个程序来运行支持的代码/程序。为了学习 Java，你将需要大量的 Google 搜索，所以让我们现在开始吧。在
    Google 或 YouTube 上搜索如何安装和使用 Oracle 的 `NetBeans IDE` 以及 Java `1.8`。我本可以解释如何操作，但我的解释可能对所有人都不适用，因为这本书的读者可能在使用许多不同的操作系统。一个极好的起点是访问
    Java 资源的官方网站：你可以从[此链接](http://www.oracle.com/technetwork/articles/javase/jdk-netbeans-jsp-142931.html)
    下载 `NetBeans` 和最新版本的 Java。


    ### 辅助代码


    阅读本书的一种极佳方法是在你的 IDE 中同时打开每一章对应的辅助源码。在本书剩下的章节中代码量会越来越增加，但为了保持章节简短，书中会省略很大一部分代码。如果某个章节看起来很长，很可能是因为很大一部分是代码而非纯文本，所以请坚持。


    每一章的辅助源码可以在源 (`src`) 文件夹下与其同名的包中找到。请[在 GitHub 此处下载完整项目](http://javaforhumans.com/code)，但请记住自己手打所有代码，以便有效地学习
    Java 语言。从根目录导航到 `src`，然后选择你想查看的章节。


    ### 旁注


    我们将在全书中涵盖许多概念。虽然我会花时间用易于理解的方式清晰解释每个概念，但在某些情况下，我可能需要使用专业术语或更深层的解释来描述其他概念以帮助你更好地理解。在这种情况下，你会看到如下格式的文本：


    > 注意！这是一个解释旁题的旁注。旁注用于表示讨论从一个话题或语气切换到另一个。你并不非要读旁注，但为了完全理解书中讨论的概念，尽一切努力对你将有利。


    ### 内联代码


    书中会有一些内联代码，你在阅读时应该参考。它们看起来像这样：


    ```java

    String bookTitle = "Java for Humans";

    ```


    如果我们想向控制台打印某些内容让用户看到，我们可以这样做：


    ```java

    System.out.println(bookTitle);

    ```


    ## 第 2 章：学习读写


    ### 变量


    在 Java（或任何编程语言）中，有些概念是你无法不理解和使用的。变量就是其中之一，但别担心，它也是 Java 中最简单的概念之一。在本章结束时，你将掌握变量所需的所有知识，以便以后存储生活中的所有信息。


    ### 为什么变量重要且有用


    在开始学习 Java 变量之前，我们首先需要明确我们编程的原因：


    *我们编程是为了捕捉和处理信息（数据）*


    *以此产生供用户消费的新信息。*

