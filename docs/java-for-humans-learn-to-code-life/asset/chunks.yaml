  trans: "\n数组（Arrays）允许你在一个数据结构中收集固定数量的元素，而 `Lists` 也可以这样做，但没有边界限制。它们唯一无法做到的就是存储对象并通过特定的唯一键（key）检索它们。这正是\
    \ `HashMap` 大显身手的地方。如果我们想创建一个包含所有英语单词及其含义的字典，我们最好的选择就是使用 `HashMap`。\n\n### 为什么\
    \ HashMap 非常重要且有用\n\nJava 中的 Map（映射）是强大的工具，而 `HashMap` 也许是其中最强大的工具之一。`HashMap`\
    \ 类是 `Map` 接口的实现，它吸收了 `List` 接口的优秀思想，并结合了数组的威力，为我们提供了一个在一个地方收集键值对的工具。`HashMap`\
    \ 的元素以对的形式存储，并且它确保了没有两个对具有相同的键，从而维护了每个元素的唯一属性。\n\n### 学习组织\n\nJava 为我们提供的 `HashMap`\
    \ 类允许我们收集相同类型的值，并使用唯一键将其存储起来。在后台，`HashMap` 使用数组来存储其元素。然而，我们并不关心它在后台是如何工作的，因为所有的复杂工作都被封装了。`HashMap`\
    \ 类为我们提供了方法：向映射中放入一个对、通过键替换某个对的值、通过键删除一个对、检查键是否存在，以及像处理列表一样清除映射。\n\n键（key）可以是任何数据类型，但重要的是要记住\
    \ `String` 键是区分大小大小的。为了确保 `HashMap` 中的所有键都是唯一的，映射在后台有一个 `hash()` 方法，对所有添加到它的键进行哈希处理。当你调用\
    \ `put()` 实例方法时，你提供的键会被哈希处理为一个唯一的哈希字符串值，而当你调用 `get()` 或 `containsKey()` 实例方法时，你提供的键将以相同的方式进行哈希处理。生成的哈希值被用于在映射中找到具有匹配哈希值的键对。如果找到了该对，如果你调用\
    \ `get()`，将返回该对；如果你调用 `containsKey()`，将返回布尔值 `true`；如果你调用 `put()`，则其值将更新为新值。让我们尝试为一些我们喜爱的\
    \ Java 术语创建一个字典，以便我们以后学习：\n\n```java\nHashMap dictionary = new HashMap();\n\n\
    dictionary.put(\"Variable\", \"用于存储单个值 \" + \"供以后备用.\");\n\ndictionary.put(\"\
    String\", \"用于表示字符 \" + \"字符串的类.\");\n\ndictionary.put(\"double\", \"用于表示 \" +\
    \ \"浮点数的原始数据类型.\");\n\ndictionary.put(\"Double\", \"用于将 double 包装在带有方便方法的 \" +\
    \ \"对象中的类.\");\n\ndictionary.put(0, \"数字零。数组中的第一个索引 \" + \"以及列表中的第一个位置.\");\n\n\
    dictionary.put(\"zero\", 0);\n\nSystem.out.println(\"Elements in map: \" + dictionary.size());\n\
    ```\n\n**Output**\n```\nElements in map: 6\n```\n\n我们向字典 `HashMap` 实例中添加了六个对——五个\
    \ `String` 键和一个整数键。让我们通过键打印出一些对的值：\n\n```java\nSystem.out.println(\"double: \"\
    \ + dictionary.get(\"double\"));\n\nObject meaningOfDouble = dictionary.get(\"\
    Double\");\n\nObject meaningOf0 = dictionary.get(0);\n```\n\n### 面向人本的 Java\n\n\
    ```java\nSystem.out.println(\"Double: \" + meaningOfDouble);\n\nSystem.out.println(\"\
    0: \" + meaningOf0);\n\nSystem.out.println(\"zero: \" + dictionary.get(\"zero\"\
    ));\n```\n\n**Output**\n```\ndouble: A primitive datatype for representing floating\
    \ point numbers.\nDouble: A class for wrapping a double in an Object with convenient\
    \ methods.\n0: The number zero. The first index in arrays and the first position\
    \ in lists.\nzero: 0\n```\n\n注意，当我们检索字典元素的值时，它们是作为 `Object` 类的实例被返回的。这是因为如果我们不指定键和值可以是什么类型的数据，Java\
    \ 会将 `Object` 设为 `HashMap` 键和值的类型，因为每个类都是 `Object` 类的子类；`Integer`、`Double`、`Long`\
    \ 以及其他包装类是由 Java 提供的，用于将原始类型包装在对象中，因为原始类型不是对象。这就是为什么我们能够同时拥有 `String` 和 `int`\
    \ 键和值。这有时是可以接受的，但我们通常应该精确指定想要在数据结构中存储什么类型的数据，以避免由歧义引起的意外情况。要指定映射的类型，我们采取在 `LinkedLists`\
    \ 章节中初始化 `LinkedList` 实例时所做的相同操作：在一对尖括号 `<>` 内部放置类型的类名。我们可以让 `HashMap` 实例接受 `String`\
    \ 键和 `Integer` 值，但对我们的字典来说没有意义。让我们重新制作字典，使其只接受 `String` 键和 `String` 值：\n\n```java\n\
    HashMap<String, String> stringDictionary = new HashMap<>();\n\nstringDictionary.put(\"\
    Class\", \"创建对象的模板.\");\n\nstringDictionary.put(\"Object\", \"类的实例.\");\n```\n\
    \n我们现在有了一个存储 `String` 键和 `String` 值对的字典，它包含了 Java “类”（Class）和“对象”（Object）的定义。“类”的定义似乎有点没用，让我们更新一下它：\n\
    \n```java\nstringDictionary.replace(\"Class\", \"一个定义了 \" + \"从它构建的对象 + \" 可以展示的属性和行为的模板.\"\
    );\n```\n\n我们没有再次调用 `put()` 方法来更改映射中“Class”键的值，而是调用了 `replace()` 实例方法。调用 `replace()`\
    \ 可以确保如果键在映射中不存在，则该对不会被添加到映射中。\n\n### 学习组织\n\n```java\nif(stringDictionary.containsKey(\"\
    Class\")) {\n    stringDictionary.replace(\"Class\", \"A better definition.\"\
    );\n} else {\n    stringDictionary.put(\"Class\", \"A descriptive definition\"\
    );\n}\n\nString meaningOfClass = stringDictionary.get(\"Class\");\n\nSystem.out.println(\"\
    Class: \" + meaningOfClass);\n```\n\n**Output**\n```\nClass: A better definition.\n\
    ```\n\n在那个代码段中，如果键已存在于映射中，我们就替换该对的值，否则我们通过 `containsKey()` 检查并将该对添加到映射中。如果我们想从映射中删除一个对，不需要先确保它存在。我们只需要要求映射删除与作为\
    \ `remove()` 方法参数提供的键匹配的对即可。如果键在映射中，对应的值将被移除并返回；否则，将无移除和返回：\n\n```java\nString\
    \ valueOfRemovedPair = stringDictionary.remove(\"Class\");\n\nSystem.out.println(\"\
    Value of removed 'Class': \" + valueOfRemovedPair);\n```\n\n**Output**\n```\n\
    Value of removed pair with key 'Class': A better definition.\n```\n\n剩下的工作就是清除我们的字典并重新开始。如果我们不再需要\
    \ HashMap 中的对，可以通过调用 `clear()` 方法一次性删除所有对：\n\n```java\nstringDictionary.clear();\n\
    \nSystem.out.println(\"Pairs in our string dictionary: \" + stringDictionary.size());\n\
    ```\n\n**Output**\n```\nPairs in our string dictionary: 0\n```\n\n我们的 *stringDictionary*\
    \ HashMap 现在是空的，你可以自由向它添加新的对，并用它复习你目前为止学的所有 Java 知识。\n\n"
- fmt: "\nYou could make a study guide by adding each concept to the `HashMap` along\
    \ with its meaning, iterate over the map’s keys with a `for loop` or Java’s handy\
    \ iterator method which you can learn about by doing some research on Google,\
    \ and try to guess the corresponding value of each key before you print it to\
    \ the console. I’ll get you started in the supporting code.\n\n# Polymorphism\n\
    \nIn our short look at polymorphism at work in both the Class Inheritance and\
    \ Abstract Classes & Interfaces chapters, we got a glimpse at how powerful polymorphism\
    \ is. In both chapters, we learned that any object that can pass more than one\
    \ is-a test, that is any object that is of more than one type, is considered polymorphic.\
    \ With that said, we can define polymorphism as the ability of an object to take\
    \ on more than one form.\n\n## Why is Polymorphism Important & Useful\n\nPolymorphism\
    \ is one of the most important concepts in object oriented programming. It is\
    \ what allows us to say that all types in Java are the type of its class as well\
    \ as the type of the `Object` class; we’ve learned that all objects in Java are\
    \ instances of the `Object` class because of Java’s class hierarchy.\n\n## One\
    \ Functionality for All\n\nWe learned in the Class Inheritance chapter that If\
    \ we can say an instance of a class can be of more than one type, we can build\
    \ functionality for one class that works for any class that extends it. We created\
    \ a `Human` class that our `Warrior`, `Archer`, and `FireArcher` all inherited\
    \ from. That allowed us to create methods that accepted them all as parameters\
    \ because we could group them all as being `Human`. That is polymorphism at work.\n\
    \n## One Collection for All\n\nRemember in the three Data Structures chapters\
    \ that with any data structure, collection, we can only store elements of the\
    \ same type: each element of a `String` array must be of type `String` and each\
    \ element in a `Human LinkedList` must be of type `Human`. In the `HashMaps` chapter,\
    \ we saw that if we don’t explicitly specify the type of our keys and values,\
    \ Java implicitly sets the map to store keys of type `Object` and values also\
    \ of type `Object` because every class in Java extends the `Object` class provided\
    \ by Java. This is only legal because of polymorphism. Let’s revisit our Conquer\
    \ game example from earlier to see how we can collect all our friends in the game\
    \ in a single list.\n\n**Note!**\n\nThe classes of the different characters in\
    \ the game will be omitted from this chapter, so make sure to open the supporting\
    \ source code.\n\nRemember that we have a `Character` interface that every character\
    \ class implements, an abstract `Human` class that all human character class extends,\
    \ and an abstract `Pet` class that all pet classes extend. We will focus on the\
    \ `Human` class and its subclasses because while a user can have a pet, a user\
    \ who plays our game can only be a human character.\n\n## Learning to Organize\n\
    \nLet’s create a `Human` instance for ourselves, `currentUser`, and a couple `Human`\
    \ instances to represent other users:\n\n```java\n//the Human character representing\
    \ the current user\nHuman currentUser = new Archer(\"ModernNerd\");\n\n//other\
    \ Human characters playing the game\nArcher human2 = new Archer(\"Tom\");\nHuman\
    \ human3 = new FireArcher(\"Christina\");\nWarrior human4 = new Warrior(\"Tyrone\"\
    );\nTaoist human5 = new Taoist(\"Jerome\");\n```\n\nWe are the `currentUser` `Human`\
    \ instance which is also an `Archer` instance. Notice that `human3` is like our\
    \ character: its of type `Human` but is instantiated as a `FireArcher`. Again,\
    \ that’s the beauty of polymorphism. Let’s take a look at the `Human` class:\n\
    \n```java\npublic abstract class Human implements Character {\n    private LinkedList<Human>\
    \ friendsList = new LinkedList<>();\n\n    ...\n\n    public LinkedList<Human>\
    \ getFriends() {\n        return friendsList;\n    }\n\n    ...\n}\n```\n\nIt\
    \ has a `LinkedList`, `friendsList`, that accepts `Human` instances as elements.\
    \ We will use this to hold our list of friends. Let’s get it and store a reference\
    \ to it in a local variable and add the other characters to it because they are\
    \ our friends:\n\n```java\n/*store a reference to current user's\nfriend list\
    \ in a local variable*/\nLinkedList<Human> currentUserFriendsList = currentUser.getFriendsList();\n\
    ```\n\n## Java for Humans\n\n```java\n//add other user's to current user's friend\
