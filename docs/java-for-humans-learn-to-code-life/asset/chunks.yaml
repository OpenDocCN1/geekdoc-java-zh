    \ if-then-else` statement. It is more of a matching statement than a decision-making\
    \ statement. This is something you should research more because it can be handy\
    \ in bigger projects as you become more experienced.\n\n## Methods\n\nFrom the\
    \ Classes and Objects chapter, you’ve learned that methods are used in Java to\
    \ provide functionality to our classes and their instances. In this chapter, we\
