  trans: "\n在初始化表达式中声明的变量的作用域从声明开始到 for 循环的结束——直到 for 循环代码块的右大括号 `}`。该变量在循环生命周期内会被终止表达式和递增表达式使用。它也可以在\
    \ for 循环体中使用，正如我们打印范围内的当前数字所做的那样。如果循环范围外不需要该变量，最好在初始化表达式中声明它。否则，我们可以在 for 循环之前声明变量，并在初始化表达式中初始化它，如下：\n\
    \n```java\nint count;\n\nfor(count = 4; count < 10; count++) {\n    System.out.print(count\
    \ + \" | \");\n}\n\nSystem.out.print(\"The next number would be \" + count + \"\
    .\");\n```\n\n**输出**\n4 | 5 | 6 | 7 | 8 | 9 |\nThe next number would be 10.\n\n\
    在这里，我们在循环中打印了从四到九的数字，并最后打印了如果我们没有在九时停止循环，下一个要打印的数字。如果我们没有在 for 循环之前声明 `count`\
    \ 变量，我们就无法像这里那样在 for 循环范围之外使用它。\n\n**学习操作数据**\n58\n\n**注意！**\n尽管我们把初始化变量命名为“count”，但你通常会看到它被习惯性命名为“i”、“j”或“k”。\n\
    \n**终止者：终止表达式**\nfor 循环将持续运行，直到终止表达式求值为 `false`。终止表达式在循环的每次迭代之前求值，它必须返回一个布尔值来决定是否继续循环。如果返回的布尔值为\
    \ `true`，我们将再次运行 for 循环体。在我们的案例中，因为我们要打印从四到九的数字，所以我们希望循环在打印九之后终止。它正是这样做的。\n\n\
    **递增器：递增表达式**\n这是我要造新词的时刻：递增表达式就是 for 循环的递增器。递增表达式在循环的每次迭代后执行，通过使用 `++` 运算符增加我们在初始化表达式中初始变量的值。这使得终止表达式知道循环运行了多少次。在我们的案例中，初始化变量\
    \ `count` 从 0 开始并被打印，然后递增器将其加 1，循环的下一次迭代运行打印新值 `count — 1 —`，并持续到打印出 9。最后，递增器将\
    \ `count` 的值增加到 10，但终止者说：“不，不，不，10 不小于 10，所以我们在这里结束了。”\n\n我们的示例可能看起来微不足道，但 `for`\
    \ 循环是一个非常有用的工具，可以轻松且动态地多次执行代码块，而无需多次编写相同的代码。在数组的章节中，你将看到如何使用 for 循环遍历数组的索引，以逐个访问每个元素并对其进行操作。\n\
    \n**while 循环**\n`while` 语句通常被称为 while 循环，因为当给定条件（或一组条件）为 `true` 时，它会不断循环并执行一段代码语句。它比\
    \ for 循环设置起来更简单，因为它只需要一个表达式（即终止表达式）在每次迭代之前进行求值：\n\n```java\nwhile (conditionIsTrue)\
    \ {\n    //做一些事情\n}\n```\n\n**人人话 Java**\n59\n\nwhile 循环的一个简单应用是打印从零到九的所有数字。它看起来和我们用\
    \ for 循环做的非常相似：\n\n```java\nint number = 0;\n\nwhile(number < 10) {\n    System.out.println(\"\
    Current number = \" + number);\n    //增加数字以移动到下一个\n    number++;\n}\n```\n\n**输出**\n\
    Current number = 0\nCurrent number = 1\nCurrent number = 2\nCurrent number = 3\n\
    Current number = 4\nCurrent number = 5\nCurrent number = 6\nCurrent number = 7\n\
    Current number = 8\nCurrent number = 9\n\n再次，这可能看起来微不足道，但想象一下你用循环能做的事情。循环可以用来保持电视机开启，直到你按下“关闭”按钮。想想你的微波炉；它就像定时器一样，很可能使用循环来继续加热你的食物，直到你设定的时间结束。如果你玩电子游戏，你可能会发现游戏一直运行，直到你关闭游戏主机或电脑。这就是\
    \ while 循环在作用：\n\n```java\nwhile(offButtonNotPushed && userStillEngaged) {\n \
    \   //保持游戏开启让用户继续游玩\n}\n```\n\n这是一个 while 循环的快速示例，它在每次迭代循环体之前都会求值多个条件。只要用户没有按下关闭按钮且用户参与游戏中，该\
    \ while 循环就会持续运行。\n\n**注意！**\n`&&` 运算符通过结合两个布尔表达式来执行逻辑与（And）操作，且仅当两个表达式都求值为 `true`\
    \ 时才返回 `true`。\n\n**break 语句**\n循环很棒，但有时我们希望在它们自动结束之前结束它们。如果我们有一个遍历某个代码块的循环，它将继续执行，直到特定条件变为\
    \ `false`。\n\n**学习操作数据**\n60\n\n结束循环的另一种方法是在迭代过程中当另一个条件变为 `true` 且我们不再希望继续循环时，跳出循环。\n\
    \n假设你想继续吃饼干直到肚子饱了。如果在迭代期间另一个条件变为了 `true` 且我们不再想继续循环，那么就跳出循环。\n\n我们可以通过如下 while\
    \ 模拟模拟：\n\n```java\nint numCookiesEaten = 0;\nint cookiesNeededFull = 10;\nint\
    \ numCookiesLeftJar = 8;\nRandom randomCookiesGenerator = new Random();\nint numCookiesToEatTime;\n\
    int numCompletedIterations = 0;\n\nwhile(numCookiesEaten < cookiesNeededFull)\
    \ {\n    numCookiesToEatTime = randomCookiesGenerator.nextInt(numCookiesLeftJar)\
    \ + 1;\n    /*确保我们没有尝试吃比罐子中更多的饼干*/\n    if(numCookiesToEatTime > numCookiesLeftJar)\
    \ {\n        numCookiesToEatTime = numCookiesLeftJar;\n    }\n    System.out.println(\"\
    < Eating \" + numCookiesToEatTime + \" cookies this time.\");\n    numCookiesEaten\
    \ += numCookiesToEatTime;\n    numCookiesLeftJar -= numCookiesToEatTime;\n\n \
    \   if(numCookiesLeftJar < 1) {\n        System.out.println(\"\\n 没有饼干可以吃了 :(\"\
    \n        break;\n    } else {\n        System.out.println(\"> \" + numCookiesLeftJar\
    \ + \" cookies left in jar\");\n    }\n    //增加循环次数\n    numCompletedIterations++;\n\
    }\nSystem.out.println(\"执行了 \" + numCompletedIterations + \" 次迭代.\");\n```\n\n\
    **输出**\n< Eating 4 cookies this time.\n*> 4 cookies left in jar\n< Eating 2 cookies\
    \ this time.\n*> 2 cookies left in jar\n< Eating 2 cookies this time.\n\n没有饼干可以吃了\
    \ :(\n执行了 2 次迭代.\n\n在这里，你可以看到我们需要吃十块饼干才能饱，但罐子里只有八块饼干可以吃。在循环的每次迭代中，我们从罐子里吃掉随机数量的饼干。在每次迭代结束时，我们将\
    \ `numCompletedIterations` int 变量的值加一。在某些时刻，在我们吃饱之前肯定会光光饼干。这时，我们使用 `break` 关键字跳出循环。\n\
    \n注意在调用 `break` 之后，我们打印了通过 while 循环的完整迭代次数。它显示我们只完成了两次迭代，因为在第三次迭代中，我们在增加 numCompletedIterations\
    \ 第三次值之前就跳出了循环。\n\n尝试支持的代码，并寻找在 while 和 for 循环中使用 `break` 语句的其他方法。\n\n**人人话 Java**\n\
    61\n\n**学习操作数据**\n62\n\n**字符串操作**\n\n"
- fmt: "\nJava Strings are powerful. While a String seems simple as a mere representation\
    \ of character strings, they are one of the best ways to store information, data\
    \ in Java. Because character strings are so vital to programming, the creators\
    \ of Java decided to dedicate an entire class to them and give that class useful\
    \ methods to make data manipulation easier. In this chapter, we will learn how\
    \ to use some of the instance methods of the `String` class to compare strings,\
    \ search a string for individual characters or substrings, extract substrings,\
    \ and more. It is not necessary that you read this whole chapter, but it is important\
    \ that you know these functions are available to you.\n\n### Why String Manipulation\
    \ is Important & Useful\n\nOften times in your programs, you will be presented\
    \ with data which you can store as a `String`. When you have the data stored as\
    \ a `String` instance, you can use the instance methods of the `String` class\
    \ to manipulate the data. This functionality allows you to do more things with\
    \ the data you have.\n\n### Comparing Strings\n\nA operation you will run many\
    \ times in your programs is a operation to compare two `String` instances to one\
    \ another. If you have a Facebook account, you will be asked for your username\
    \ and password when you try to log in. Behind the scenes, Facebook will compare\
    \ the username and password you provide to the username and password they have\
    \ stored in their database for your account. If the comparisons are successful,\
    \ you can log in, but if they fail, you will have to try again.\n\nThe `String`\
    \ class has convenient comparison instance methods for us to compare two instances.\
    \ We can use `equals()` to compare two strings case sensitively or `equalsIgnoreCase()`\
    \ to compare without considering the case of the strings. Both of these methods\
    \ return a boolean — `true` if the comparisons succeed and `falseotherwise`. Let’s\
    \ emulate a social network login process in Java:\n\n```java\nString usernameInDatabase\
    \ = \"modernNerd\";\nString passwordInDatabase = \"mN123Java\";\nString providedUsername\
    \ = \"modernnerd\";\nString providedPassword = \"mN123Java\";\n\nif(providedUsername.equalsIgnoreCase(usernameInDatabase)){\n\
    \    //successful username comparison\n    //check the provided password\n   \
    \ //this will fail\n    //if(\"mn123java\".equals(passwordInDatabase)){}\n   \
    \ //this will pass\n    if(providedPassword.equals(passwordInDatabase)){\n   \
    \     System.out.println(\"Success! You are logged in.\");\n    } else {\n   \
    \     System.out.println(\"Wrong password. Try again.\");\n    }\n} else {\n \
    \   //user provided wrong username\n    System.out.println(\"Wrong username. Try\
    \ again.\");\n}\n```\n\nIf the username provided by the user, `providedUsername`,\
    \ matches the username in the database, `usernameInDatabase`, regardless of case,\
    \ we want to check if the password provided by the user, `providedPassword`, matches\
    \ the password in the database, `passwordInDatabase`, with regards to the case.\
    \ If all of the string comparisons pass, we can let the user log in.\n\n### Counting\
    \ Characters in a String\n\nSome social networking applications, such as Twitter,\
    \ allow users to post messages with a maximum length. They capture the message\
    \ the user enters as a `String`, count the length of the message, and use its\
    \ length to decide whether or not let the user post the message. We can do that\
    \ with the `length()` instance method:\n\n```java\nString message = \"Hello, world!\
    \ My name is Lincoln\";\nint messageLength = message.length();\n\nif(messageLength\
    \ <= 140) {\n    //send the message\n}\n```\n\n### Getting Index of a Character\
    \ in a String\n\nIf you want to know the index of the first occurrence of a character\
    \ in a string, you can use the `indexOf()` instance method on a `String` instance.\
    \ Remembering that indices in Java and other programming languages start at zero,\
    \ we can try to get the index of the letter “D” in a string containing the entire\
    \ alphabet:\n\n```java\nString alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\";\nint\
    \ indexOfLetterD = alphabet.indexOf(\"D\");\nSystem.out.println(\"Index of letter\
    \ 'D' is \" + indexOfLetterD);\n```\n**Output:**\n`Index of letter 'D' is 3`\n\
    \nAlthough “D” is the fourth letter in the English alphabet, it is at the third\
    \ index in the `String` instance, and that’s exactly what is returned by `indexOf()`.\n\
    \n### Getting Index of a Substring in a String\n\nOther times, you may not only\
    \ want to know the index of a single character. Instead, you may want to know\
    \ the index of the first occurrence of an entire substring of a `String` instance.\
    \ Say you want to get the start of the ending characters of the alphabet. The\
    \ `indexOf()` instance method will return where the substring begins as the index\
    \ of the first character in the substring:\n\n```java\nString alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
    ;\nint beginningOfTheEnd = alphabet.indexOf(\"XYZ\");\nSystem.out.println(\"Value\
    \ of beginningOfTheEnd: \" + beginningOfTheEnd);\n```\n**Output:**\n`Value of\
    \ beginningOfTheEnd: 22`\n\nThe letter “X” is the 24th letter in the alphabet,\
    \ but it’s at the 23rd index in the `String` instance. The substring “XYZ” of\
    \ the alphabet `String` instance starts with “X”, so that substring begins at\
    \ the 23rd index; that is what `indexOf()` returns here.\n\n### Extracting a Substring\
    \ From a String\n\nThere may be some times when we only want a part of a string.\
    \ In such cases, we want to extract a substring from a string. One of those cases\
    \ may be when we have a long string but we only want the second half of it. We\
    \ can use the `substring()` instance method on our `String` instance to get the\
    \ first half of it by passing in one argument which will tell the method at which\
    \ index of the string to start extracting our substring. Another way to think\
    \ of the method’s argument is that it tells the `substring()` method how many\
    \ characters, from the left, it should skip. Given that, we can get the second\
    \ half of our alphabet string by providing half its length as the argument of\
    \ the `substring()` method:\n\n```java\nString secondHalfOfAlphabet = alphabet.substring(13);\n\
    System.out.println(secondHalfOfAlphabet);\n```\n**Output:**\n`NOPQRSTUVWXYZ`\n\
    \nWhile that works, there is a more dynamic approach to the above that allows\
    \ our code to adapt to a change in the length of the alphabet in the case its\
    \ length changes from 26 to something else, say 20. In such a case, 13 would no\
    \ longer be half the length of the alphabet, so we should prepare for that by\
    \ doing the following:\n\n```java\nString secondHalfOfAlphabet = alphabet.substring(alphabet.length()\
    \ / 2);\nSystem.out.println(secondHalfOfAlphabet);\n```\n**Output:**\n`NOPQRSTUVWXYZ`\n\
    \nNow imagine your friend asks you for your street address and city, but you only\
    \ have the entire string of your house address which contains the street address,\
    \ city, state, zip code, and country. You may not want to send her your entire\
    \ address because she only cares about your street address and city. In this case,\
    \ you would need to manipulate the `String` containing your full address to get\
    \ only the part containing your street address and city and store it in a new\
    \ variable to send to her.\n\nKnowing that the street address and the city come\
    \ before the comma in your full address, you can use the `substring()` method\
    \ along with the `indexOf()` method to get that part of the string containing\
    \ your street address:\n\n```java\nString fullAddress = \"123 JavaStreet JavaCity,\
    \ JavaState 19081 United States\";\nString streetAddressAndCity = fullAddress.substring(0,\
    \ fullAddress.indexOf(\",\"));\n```\n\nThe first argument of the `substring()`\
    \ method tells the method where to begin extracting the substring while the second\
    \ tells it where to end the substring. Together, the arguments declare the range\
    \ of the substring we want the method to return. The range is inclusive of the\
    \ first argument and exclusive of the second; in our street address and city example,\
    \ the substring will begin at index zero (0) of `fullAddress` and end right before\
    \ the index of the comma. Here’s the result of our operation:\n\n```java\nSystem.out.println(streetAddressAndCity);\n\
    ```\n**Output:**\n`123 JavaStreet JavaCity`\n"
