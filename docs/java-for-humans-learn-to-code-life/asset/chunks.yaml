    # Abstract Classes and Interfaces


    In the `Class Inheritance` section, we learned about forming a contract between
    classes, superclasses, and users. By creating subclasses that share a superclass,
    we can share fields and methods between them to decrease the amount of code we
    write, create a predictable interface for users, and employ `polymorphism`. In
    this chapter, we will learn how to make our contracts better through abstract
    classes and interfaces.


    ## Why Abstract Classes & Interface are Important & Useful


    A regular class defines the fields, implements fully functioning methods and can
    be instantiated; such a class is referred to as a concrete class. That is the
    vast majority of classes you will write and use in your programming career. Abstract
    classes and interfaces cannot be instantiated, but they, too, define fields and
    methods — although they may not implement methods. They are best for forming a
    contract between a class, its subclasses, and users of its subclasses.


    ### Java for Humans

    79


    ## Abstract Class


    An abstract class is much like a regular class in that it can have fields and
    methods. What makes it special is its methods may or may not have bodies. That
    means an abstract class can have method signatures that are declared as abstract
    as well as full methods as usual.


    An abstract method is a method that has no body and requires subclasses of the
    abstract class its in to implement its body. This is useful when you have a method
    that you want all subclasses to have but you want to leave it up to the different
    subclasses to implement the method how they want. Further, a subclass of an abstract
    class must implement all of its abstract methods.


    Take the Human class’s `attack()` instance method from the Class Inheritance chapter
    for example. We want every subclass of the Human class to have a method of attacking
    another Human opponent, but we expect each subclass to have a different way of
    attacking. We should make our `attack()` method abstract instead of implementing
    it in the Human class as well as every subclass. That way, we won’t be able to
    forget to implement it in every subclass and we will keep our code clean by not
    writing expectantly useless code in our superclass. There are a couple of methods
    of the Human class that we should make abstract, but in order to do that, we must
    make the Human class an abstract class. To do that, we simply add the `abstract`
    keyword to the class’s signature before the class keyword.


    ```java

    public abstract class Human {


    //add fields, methods, and abstract methods


    }

    ```


    For methods that we expect to behave exactly the same across all our subclasses,
    we can write them out in full as usual. Methods such as getters and setters fit
    this bill. Further, we can still have our shared fields in our abstract class.
    Let’s take a look at our new Human class as an upgrade from the `Class Inheritance`
    section:


    ```java

    public abstract class Human {


    protected String name;


    ...


    public Human(String name) {...}


    public abstract void attack(Human human);


    public abstract void defend();


    public abstract void jump();


    public abstract double heal();


    public String getName() {...}

    ```


