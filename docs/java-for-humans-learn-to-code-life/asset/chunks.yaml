    \ = alphabet.indexOf(\"XYZ\");\nSystem.out.println(\"Value of beginningOfTheEnd:\
    \ \" + beginningOfTheEnd);\n```\n**输出：**\n`Value of beginningOfTheEnd: 22`\n\n\
    字母“X”是字母表中的第 24 个字母，但在 `String` 实例中的索引是 23。字母表 `String` 实例的子字符串“XYZ”以“X”开头，因此该子字符串从索引\
    \ 23 开始；这就是 `indexOf()` 在此处返回的值。\n\n### 从字符串中提取子字符串\n\n在某些情况下，我们可能只需要字符串的一部分。在这种情况下，我们想要从字符串中提取一个子字符串。其中一种情况可能是我们有一个长字符串，但只需要它的后半部分。我们可以使用\
