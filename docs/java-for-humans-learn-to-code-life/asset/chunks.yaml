    这些数据可以是你银行账户里的金额，也可以是你访问账户的密码。它可能是你这周有几门课，而每门课程可能包含更多数据，说明它的标题是什么、老师是谁以及内容是什么。这些数据甚至可以是
    Instagram 上的一张照片、被双击的次数，以及照片的所有者。或者，一个更有趣的例子是关于你发射《愤怒的小鸟》的发射角度，以及它将落在塔的哪个位置将其撞倒。所有这些数据都必须存储在某处，以便处理它们并展示给用户——你。这正是变量的用途。我们可以在变量中存储单个数据点（或值）以备后用。让我们用银行账户的例子来理解为什么变量很重要以及它们有什么用。


    ## 使用变量存储银行账户数据


    假设我们正在创建一个新的银行账户。我们需要存储一些关于账户及其所有者的信息以备后用。该账户将有一个唯一的识别码、一个余额、一个是否激活的状态以及一个密码（PIN
    码）。此外，账户还会有关于所有者的信息：所有者的姓名、地址和生日。总而言之，我们的银行账户将拥有以下变量：


    `identifier`

    `balance`

    `pass code`

    `active`


    ## 学习读写


    14


    `owner''s name`

    `owner''s address`

    `owner''s birth year`

    `owner''s birth month`

    `owner''s birthday`


    现在，从前面的内容中你知道我们能够将所有这些信息存储在一个变量中以便稍后使用。在 Java 中实现这一点，我们可以使用 `[String](http://docs.oracle.com/javase/7/docs/api/java/lang/String.html)`，它允许我们存储或表示字符字符串。在
    Java 中创建一个字符串非常简单。字符串是 Java 提供的 `String` 类的的一个实例。


    ## 使用单个字符串变量存储我们的账户信息


    让我们创建一个 `String` 变量来存放上述的银行账户信息，看看我们如何创建和使用变量：


    ```java

    String bankAccount = "identifier: 1234567828;

    balance: 1301.78; passcode: 9889; active: true;

    owner''s name: Lincoln Daniel;

    owner''s address: 325 JavaPlace, UnitedJavas 19081;

    owner''s birthday: May 26, 1993";


    System.out.println("Our bank account: " + bankAccount);

    ```


    现在我们把整个银行账户存储在了那个名为 `String` 的单个变量中。注意，要创建一个变量，我们先说明它是什么种类型的变量（在这种情况下是 `String`），然后给它起名字
    `bankAccount`，最后使用赋值运算符（`=`）将它设为某个值。在这种情况下，这个值就是我们所有的银行账户信息。最后，两个变量不能有相同的名称，我们稍后会学习原因。


    在代码块中，我们有一个名为 `bankAccount` 的单个 `String` 变量，它包含了我们银行账户的所有信息。如果我们以后想检查银行账户，我们将将其打印到系统中，并看到账户的识别码是
    1234567828，余额是 1301.78 美，密码是 9889，它是激活状态（true），所有者姓名是 Lincoln Daniel，所有者地址是 325
    JavaPlace, UnitedJavas, 19081，所有者生日是 1993 年 5 月 26 日。


    但如果我们离开银行再回来，只想知道余额是多少怎么办？那个单个变量将无法单独给我们提供账户余额。相反，它会给我们提供关于银行账户的所有信息。这在很多方面都是糟糕的。想象一下，去
    ATM 机时，所有关于你和你的银行账户的信息都显示在屏幕上，让你后面的人可以窥视。那是不安全的。


    在*Datatypes*（数据类型）章节中，我们将学习 Java 中的数据类型以及我们如何使用它们将关于银行账户的每个独立数据点存储在单独的变量中，这样我们以后就可以单独处理和使用每一个。


    ## 人类化的 Java


    15


    ## 数据类型


    Java 数据类型有一个简单的目的，那就是将不同类型的数据存储在适当的变量中，以提高后后使用的效率。以狗和苹果的例子来说。你的狗是一种动物，而你的苹果是一个水果。你不会尝试对狗做你对苹果会做的事情，对吧？不确定？试着让你的苹果叫叫。数据类型的另一个特性是可预测性。


    ## 为什么数据类型重要且有用


    数据类型赋予了我们数据可预测的力量。如果你有一只狗，你确切知道它会叫，所以让它做这件事是没问题的。如果你有一个苹果，你确切知道它是可以吃的，因为这就是苹果的用途。但如果有人给苹果套上一件狗的衣服并在在你不知情的情况下交给你呢？你会试着让那只狗叫叫，但什么都不会发生。你会尝试带它去散步，但它不会动。Java
    中的数据类型也是这一个原理。


    你不能用 `String` 来计数，因为字符串代表了构成概念的字符，如单词和像你现在阅读的这样的故事。另一方面，你可以用整数进行计数。然而，如果你尝试用整数创建一个单词，没人会看得懂。


    我们可以将这种逻辑应用于 Java 的数据。如果你将数据存储在适当的数据类型中，你就可以安全地使用它们，因为你确切知道它们是什么类型的数据。


    ## 存储我们账户信息的更好方法


    记住变量对于存储信息以备后用和处理是有用的。我们希望能够获取我们需要的信息，按我们想要的方式使用。鉴于，我们不想将所有信息存储在一个变量中。这有助于我们理解我们尝试存储的数据类型：


    `identifier` 是数字

    `balance` 是带小数点的数字（浮点数）

    `pass code` 是数字

    `active` 是真或假值

    `owner’s name` 是字符字符串

    `owner’s address` 是字符字符串

    `owner’s birth year` 是数字

    `owner’s birth month` 是字符字符串

    `owner’s birthday` 是数字


    ## 学习读写


    16


    现在我们已经知道了需要存储的数据类型，让我们看看 Java 如何帮助我们。Java 提供了原始数据类型供我们存储信息。我们可以将数字存储为 `int` 变量，浮点数存储为
    `double`，真或假值存储为 `boolean`。


    如果我们想在变量中存储单个字符，可以使用 `char` 原始类型。除了这些原始类型之外，Java 还允许我们在 `String` 变量中存储字符字符串。Java
    还提供了四个原始数据类型，但对初学者来说并不是必要的。


    ## 将每个数据存储在自己的变量中


    让我们创建九个独立的变量来存储我们账户的九个独立数据点：


    ```java

    int id = 1234567828;

    double balance = 1301.41;

    int passCode = 9889;

    boolean isActive = true;

    String ownerName = "Lincoln W Daniel";

    String ownerAddress = "325 JavaPlace, UnitedJavas 19081";

    int ownerBirthYear = 1993;

    String ownerBirthMonth = "May";

    int ownerBirthDay = 26;


    System.out.println("Our bank account''s balance: " + balance);

    ```


    ***Output***


    *Our account''s balance: $1301.41*

