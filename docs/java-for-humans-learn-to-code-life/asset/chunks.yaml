- fmt: "\nA class in Java is simply a template for creating objects with similar attributes\
    \ and behavior. A Java class can be thought of as a template that defines the\
    \ attributes and behavior that objects constructed from it can exhibit. With that,\
    \ we can say an object is merely an instance of a class. From a single class,\
    \ we can create, or construct, many instances and each instance has the attributes\
    \ and functionalities that every other instance of the has. Thus, a human is an\
    \ instance of the `Human` class, and at the time of publication of this book,\
    \ there are seven billion instances of the `Human` class in the world.\n\n## Making\
    \ Objects From Classes\n\nMaking a class in Java is easy. There are three key\
    \ parts of every class but only one is always necessary. A class can have fields,\
    \ or attributes, methods, or behaviors, and must have at least one constructor.\n\
    \n### Java for Humans\n31\n\nWe can create a class that defines the attributes\
    \ and behavior of humans like this:\n\n```java\npublic class Human {\n\n//TODO:\
    \ add attributes\n//TODO: add constructor\n//TODO: add methods\n}\n```\n\nThere,\
    \ we created a simple class called `Human`. The `public` keyword at the start\
    \ of the first line means the class can be accessed from anywhere in your program\
    \ and the name of the class is in `upper camel case`. Between the opening curly\
    \ brace (`{`) and the closing curly brace (`}`), we have to define attributes\
    \ any object, or instance, constructed from this class can have and methods it\
    \ can perform. Now, before we can create objects from this class, we will need\
    \ to finish defining it.\n\n## Class Fields: Instance Variables\n\nFields are\
    \ variables which hold data that describe the attributes of the class and any\
    \ object constructed from it. Fields that a human would have are its name, age,\
    \ and height. We add fields to a class by declaring them at the top of the class\
    \ like this:\n\n```java\npublic class Human {\n\nString name;\nint age;\nint height;\n\
    \n...\n}\n```\n\nThese fields will hold information about every instance of our\
    \ `Human` class, but they do not yet have the information because the class is\
    \ simply a template. We need to create a constructor which will allow anybody\
    \ who calls it to pass in the necessary information about the instance of the\
    \ `Human` class they are constructing. At the time of constructing an instance\
    \ of the class, we will assign the given information, values to the instance variables\
    \ of the instance.\n\n## Class Constructor\n\nA class must have a constructor\
    \ which is used to create a new object from the class each time it is called.\
    \ Every object created from a class is referred to as an instance of that class.\
    \ A constructor is simply a method that can be called from different parts of\
    \ your program to create instances of a defined class.\n\nAlthough we have not\
    \ covered methods, yet, it is good to know that methods have return types that\
    \ tell the caller what datatype to expect back as a result of calling the method.\
    \ However, some methods don’t return anything at all. We will learn more about\
    \ return types in the Methods section.\n\n### Learning to Classify Data\n32\n\n\
    The constructor has no explicit return type because it’s a factory method, which\
    \ means it creates a new instance of the class and returns the new instance to\
    \ the caller. The constructor of a class must have the same name as the class\
    \ and is case sensitive. Finally, the constructor can accept information from\
    \ the caller as parameters that will be assigned to the instance fields of the\
    \ instance being created. We can create a constructor for our `Human` class that\
    \ asks the caller to provide the name, age, and the height of the new `Human`\
    \ instance like so:\n\n```java\npublic class Human {\n\n...\n\n//the constructor\
    \ of this class\npublic Human(String name,int age, int height){\n\n//set this\
    \ object's name with the provided name\nthis.name = name;\n\n//set this object's\
    \ age with the provided age\nthis.age = age;\n\n//set this object's height with\
    \ the provided height\nthis.height = height;\n\n}\n}\n```\n\nThe constructor can\
    \ be thought of as the doctor who gives birth to your new object and all the doctor\
    \ asks is that you fill out the birth certificate to describe your new object.\
    \ The constructor’s parameters says that if anybody wants to create an instance\
    \ of our `Human` class, they must provide a name, age, and height for the new\
    \ `Human` instance as arguments and it will use that information to initialize\
    \ the new instance’s instance variables — the `name`, `age`, and `height` fields.\
    \ Like any other method, we can manipulate data in the constructor aside from\
    \ assigning the values of our new object’s fields, but it’s good practice to keep\
    \ the constructor as short as possible. Once the constructor is done creating\
    \ the new object, it returns it to the caller to be saved to a variable for later\
    \ use:\n\n```java\npublic static main(String[] args) {\n    Human newHuman = new\
    \ Human(\"Lincoln\", 22, 5);\n}\n```\n\nThe keyword `this` tells the compiler\
    \ that we are referring to the current instance of the class: if we want to refer\
    \ to the name field of this new `Human` object, we say `this.name` so the compiler\
    \ doesn’t confuse it with the `name` parameter that is provided as an argument\
    \ to the constructor method.\n\n### Java for Humans\n33\n\n## Instance Methods\n\
    \nRemember that nouns perform actions with verbs in sentences and objects in Java\
    \ programs perform actions by use of their methods. A class defines methods any\
    \ object constructed from the class can perform. These methods are referred to\
    \ as instance methods because they can only be performed by an instance of the\
    \ class. We are all instances of the `Human` class, so we share functionality,\
    \ or methods. We speak, run, jump, sleep, walk, wave, work, and so much more.\
    \ All of these actions are predefined by our human biology and anatomy— our class.\n\
    \nThe opening and closing curly braces define a scope: the opening starts the\
    \ scope and the closing ends it. Classes and methods, among others, have scope,\
    \ and the class scope is the highest level scope in a class. While we can start\
    \ new method scopes in the class, we cannot start new method scopes in a method\
    \ scope.\n\nWe can add methods to our classes in Java by declaring them between\
    \ the opening and closing curly braces, or scope, of the class. Let’s add a few\
    \ methods to our Human class to make our Human objects more functional:\n\n```java\n\
    public class Human {\n\n...\n\n//every instance of a Human can speak\npublic void\
    \ speak(){\n    System.out.println(\"Hi! I am \" + name + \".\");\n}\n\n//set\
    \ the age of the Human object\npublic void setName(String newName) {\n    this.name\
    \ = newName;\n}\n\n//return the age of the Human object\npublic int getAge() {return\
    \ age;}\n}\n```\n\nWe will look at methods in more detail in future chapters so\
    \ don’t worry about fully understanding the details yet. All that matters now\
    \ is that methods allow objects to do things. What we did was, first, add a method\
    \ that will allow instances of our Human class to speak and introduce themselves.\
    \ The second method allows our Human objects to change their name when they want.\
    \ This is often referred to as a setter method because it sets one of an object’s\
    \ instance variables to a new value and returns nothing — void. The last method\
    \ allows others to read the age field of a Human instance. This kind of method\
    \ is referred to as a getter method because it gets and returns one of an object’s\
    \ instance variables.\n\n### Static Fields and Methods\n\nWe’ve learned that we\
    \ can create classes to create objects from. Furthermore, an object, or instance\
    \ of a class, can have instance variables to hold information about itself and\
    \ methods to manipulate and create more information for users. While not all concepts\
    \ in Java are objects, most programs in Java revolve around objects.\n\nWe can\
    \ put a good deal of functionality in our classes to organize our code and make\
    \ remembering what our code does easier. When we have our classes created, we\
    \ can make objects from them to store information and execute functions we need\
    \ them to. It’s much like society.\n"
  raw: 'A class in Java is simply a template for creating objects with similar attributes
    and behavior. A Java class can be thought of as a template that defines the attributes
    and behavior that objects constructed from it can exhibit. With that, we can say
    an object is merely an instance of a class. From a single class, we can create,
    or construct, many instances and each instance has the attributes and functionalities
    that every other instance of the has. Thus, a human is an instance of the Human
    class, and at the time of publication of this book, there are seven billion instances
    of the Human class in the world.


    **Making Objects From Classes**


    Making a class in Java is easy. There are three key parts of every class but only
    one is always necessary. A class can have fields, or attributes, methods, or behaviors,
    and must have at least one


    **Java for Humans**


    31


    constructor. We can create a class that defines the attributes and behavior of
    humans like this:


    public class Human {


    //TODO: add attributes


    //TODO: add constructor


    //TODO: add methods


    }


    There, we created a simple class called Human. The *public*keyword at the start
    of the first line means the class can be accessed from anywhere in your program
    and the name of the class is in *upper camel case*. Between the opening curly
    brace (**{**) and the closing curly brace (**}**), we have to define attributes
    any object, or instance, constructed from this class can have and methods it can
    perform. Now, before we can create objects from this class, we will need to finish
    defining it.


    **Class Fields: Instance Variables**


    Fields are variables which hold data that describe the attributes of the class
    and any object constructed from it. Fields that a human would have are its name,
    age, and height. We add fields to a class by declaring them at the top of the
    class like this:


    public class Human {


    String name;


    int age;


    int height;


    ...


    }


    These fields will hold information about every instance of our Human class, but
    they do not yet have the information because the class is simply a template. We
    need to create a constructor which will allow anybody who calls it to pass in
    the necessary information about the instance of the Human class they are constructing.
    At the time of constructing an instance of the class, we will assign the given
    information, values to the instance variables of the instance.


    **Class Constructor**


    A class must have a constructor which is used to create a new object from the
    class each time it is called. Every object created from a class is referred to
    as an instance of that class. A constructor is simply a method that can be called
    from different parts of your program to create instances of a defined class.


    Although we have not covered methods, yet, it is good to know that methods have
    return types that tell the caller what datatype to expect back as a result of
    calling the method. However, some methods don’t return anything at all. We will
    learn more about return types in the Methods


    **Learning to Classify Data**


    32


    section.


    The constructor has no explicit return type because it’s a factory method, which
    means it creates a new instance of the class and returns the new instance to the
    caller. The constructor of a class must have the same name as the class and is
    case sensitive. Finally, the constructor can accept information from the caller
    as parameters that will be assigned to the instance fields of the instance being
    created. We can create a constructor for our Human class that asks the caller
    to provide the name, age, and the height of the new Human instance like so:


    public class Human {


    ...


    //the constructor of this class


    public Human(String name,int age, int height){


    //set this object''s name with the provided name


    this.name = name;


    //set this object''s age with the provided age


    this.age = age;


    //set this object''s height with the provided height


    this.height = height;


    }


    }


    The constructor can be thought of as the doctor who gives birth to your new object
    and all the doctor asks is that you fill out the birth certificate to describe
    your new object. The constructor’s parameters says that if anybody wants to create
    an instance of our Human class, they must provide a name, age, and height for
    the new Human instance as arguments and it will use that information to initialize
    the new instance’s instance variables — thename, age, and height fields. Like
    any other method, we can manipulate data in the constructor aside from assigning
    the values of our new object’s fields, but it’s good practice to keep the constructor
    as short as possible. Once the constructor is done creating the new object, it
    returns it to the caller to be saved to a variable for later use:


    public static main(String[] args) {


    Human newHuman = new Human("Lincoln", 22, 5);


    }


    The keyword *this* tells the compiler that we are referring to the current instance
    of the class: if we want to refer to the name field of this new Human object,
    we say this.nameso the compiler doesn’t confuse it with the nameparameter that
    is provided as an argument to the constructor method.


    **Java for Humans**


    33


    **Instance Methods**


    Remember that nouns perform actions with verbs in sentences and objects in Java
    programs perform actions by use of their methods. A class defines methods any
    object constructed from the class can perform. These methods are referred to as
    instance methods because they can only be performed by an instance of the class.
    We are all instances of the Human class, so we share functionality, or methods.
    We speak, run, jump, sleep, walk, wave, work, and so much more. All of these actions
    are predefined by our human biology and anatomy— our class.


    The opening and closing curly braces define a scope: the opening starts the scope
    and the closing ends it. Classes and methods, among others, have scope, and the
    class scope is the highest level scope in a class. While we can start new method
    scopes in the class scope, we cannot start new method scopes in a method’s scope.


    We can add methods to our classes in Java by declaring them between the opening
    and closing curly braces, or scope, of the class. Let’s add a few methods to our
    Human class to make our Human objects more functional:


    public class Human {


    ...


    //every instance of a Human can speak


    public void speak(){


    System.out.println("Hi! I am " + name + ".");


    }


    //set the age of the Human object


    public void setName(String newName) {


    this.name = newName;


    }


    //return the age of the Human object


    public int getAge() {return age;}


    }


    We will look at methods in more detail in future chapters so don’t worry about
    fully understanding the details yet. All that matters right now is that methods
    allow objects to do things. What we did was, first, add a method that will allow
    instances of our Human class to speak and introduce themselves. The second method
    allows our Human objects to change their name when they want. This is often referred
    to as a setter method because it sets one of an object’s instance variables to
    a new value and returns nothing — void. The last method allows others to read
    the age field of a Human instance. This kind of method is referred to as a getter
    method because it gets and returns one of an object’s instance variables.


    **Learning to Classify Data**


    34


    **Static Fields and Methods**


    We’ve learned that we can create classes to create objects from. Furthermore,
    an object, or instance of a class, can have instance variables to hold information
    about itself and methods to manipulate and create more information for users.
    While not all concepts in Java are objects, most programs in Java revolve around
    objects.


    We can put a good deal of functionality in our classes to organize our code and
    make remembering what our code does easier. When we have our classes created,
    we can make objects from them to store information and execute functions we need
    them to. It’s much like society.'
