    该查询将为你返回一组更好的结果供你学习。尽管如此，如果你花费了一整天时间写代码，结果却进行了二十次 Google 查询会怎样？输入所有这些单词所花费的时间比实际需要的要长得多。在编程中，简洁往往是成功的关键，在
    Google 搜索中也是如此：


    `Google: make String variable Java`


    # 学习读与写


    尽可能使用最少的单词，并忘记问号。Google 足够聪明，知道你想要的是关于 `Java` 编程语言中 `String` 变量的结果。现在，让我们来看看返回的结果。


    ## 代码结果


    从本质上说，Google 是一家软件公司。他们构建了我们今天使用的许多代码库，因此他们理解我们希望尽可能获得代码搜索结果是合逻辑的。除了 Google 可能对优质代码结果存在偏见外，如今编程的人如此之多，你会遇到的很多问题可能已经被回答了很多次，并在
    `StackOverflow` 等论坛上进行了深度讨论。话如此，让我们消化一下你将收到的结果类型，以及在特定情况下哪些是最好的。


    在 `Java` 的情况下，官方文档来自 [Oracle.com](http://docs.oracle.com/javase/8/docs/api/)。Oracle
    维护着 `Java` 语言，并对错有最终决定权。虽然这些人在对错方面拥有最终决定权，但他们并没有很好的方法向初学者展示。它的组织得很好，但作为一个初学者，你可能会被它的布局感到有些畏，因为它包含的术语比你习惯的要多。尽管如此，如果你想为你的
    `Java` 问题获得确定答案，Oracle 的 Java 文档是你的最佳选择。对于任何其他语言也是如此：官方文档将为你提供最准确的答案。如果你追求准确性，请使用此搜索结果。如果你关心的是理解性，像
    `StackOverflow` 这样的论坛将非常有帮助。


    [StackOverflow.com](http://StackOverflow.com) 是软件开发相关讨论最受欢迎的论坛。在这里，用户可以提问并收到来自其他用户的回答。回答问题的人可能已经遇到过他们所回答的问题的问题，并在问题所在的领域拥有经验。管理员维护论坛以确保人们提出的问题是相关的，并获得最佳答案。用户对其他用户提供的答案进行投票，最佳答案由提问的用户选择。可以说，你作为一个初学者，会提出的问题至少有百分之八十已经在
    `StackOverflow` 上被回答了。Google 知到这一点并乐意为你的查询提供 `StackOverflow` 结果。有时，最受欢迎或“被接受”的答案可能对你来说并不是最好的，因此请务必查看其他答案，并选择最能回答你问题的那个。这是在学习编程语言时找到大多数问题答案的良好第一步。


    [YouTube.com](http://youtube.com) 上的 Vloglogger 是另一个卓越的知识来源。如果你足够勇敢让自己上节目让世界观看，那么在编程方面，你很有可能知道自己在谈什么。如果你想听某人解释你问题的答案，并直观地为你展示如何解决任何问题，这是一个非常好的去处。YouTube
    恰好是第二大搜索引擎，因为 Google 拥有 YouTube，你可以像在 `Google.com` 上一样在里面搜索你的问题。判断一个视频是否值得观看的好方法是：在观看之前扫描评论，查看点赞与踩的比例，然后按此顺序检查观看次数。


    有人说 YouTube 博主杀死了博客主。这种观点可以待争议，但无论如何，博客主在代码方面仍然蓬勃发展。博客通常提供你需要的代码，随后是对源代码每个部分的详细解释，因此你问题的答案通常可以从博客文章中获得。然而，务必检查该文章可能收到的其他读者的任何反馈，并以此来判断博客内容是否值得一读。有时，其他人会对博客文章表示赞赏，而有时，人们会挑战博客中提供信息的有效性。这让你作为学习者的工作变得更容易，因为你可以利用此来确保在不花费太多时间阅读的情况下获得最好的答案。


    总而言，请记住，与大众认知相反，没有人是从零开始构建任何东西的，也没有人是自造。我们都需要帮助才能达到想去的地方。共同努力，我们所做的一切都能推动社会的进步。从构建东西开始，并在遇到困难时继续提出正确的问题。


    在接下来的章节中，你将学习构建自己的 `Java` 所需的所有内容。务必使用在本节中中学的知识来研究你需要的更多解释的概念。最后，始终编码。始终构建。始终学习。始终教学。始终寻找更好的方法。你可能是那个引领我们走向下一次技术革命的人。我们开始吧！


    # 学习读与写


    # 第 3 章

    ## 学习分类数据


    # 类与对象


    在你的生活中，你学习过许多类型的动物、人、建筑、运动、学校等。在英语课上，我们将这些“人、地方或事物”称为名词。在 `Java` 中，我们可以将它们称为对象——你可以像考虑英语中的名词一样去考虑
    `Java` 中的对象。


    Java 程序围绕围绕对象展开，就像英语句子围绕名词展开一样。你可以用形容词描述名词，也可以用字段（也称为属性或实例变量）描述对象。名词通过动词执行动作，就像对象通过函数或方法执行动作一样。


    ## 为什么类很重要且有用


    Java 是 2016 年使用最广泛的面向对象编程(OOP) 语言。OOP 是一种基于“对象”概念的编程模型，对象仅仅是具有字段或属性的数据结构，这些字段存储了关于自身的信息（数据）以及它们可以执行的方法。对象的属性是存储关于对象信息或数据的变量，而其方法是对象操纵其数据以创建新数据的方式。这很重要，因为我们可以使用这种结构化数据思想来编写清洁、灵活且可维护的代码。


    虽然 Java 中并不是所有内容都是对象，但 Java 中的大多数事情都围绕对象展开，就像英语句子的内容围绕句子的名词展开一样。出于这个原因，对我们来说，知道如何创建并利用它们是非常重要的。这就是类登场的地方。


