    ## 前言

    ```java

    String author = "Lincoln D";

    String bookTitle = "Java for Humans";


    System.out.printf("Hello, World! My name is %s, author of %s.", author, bookTitle);

    ```


    ## 关于作者

    Lincoln 并不是博士，也不是天生具有数学天赋。然而，在一年多多的软件工程、编程、编码或任何你可能熟悉的术语实践中，Lincoln 成功地获得了 AirBnB、Pandora、Box
    和 LinkedIn 等公司的面试。此外，[https://medium.com/p/5d0e1cf98bf)他曾收到了来自知名公司的实习机会，包括 NASA
    JPL、IBM Watson 和 Medium 公司等。Lincoln 是通过实战并在年轻的职业生涯中达到这一步的。尽管如此，Lincoln 认为，那些能够让初学者用他们能理解的语言进行学习的书籍具有巨大的价值。


    在教学方面，Lincoln 是这样看的：你教别人的技能越多，你自己对该技能就掌握得越好。作为一名导师和助教，Lincoln 通过将概念与人类体验联系起来来帮助学生理解。在《人性化
    Java》中，Lincoln 采用了同样的方法帮助初学者学习编程，学生们表示他的教学方法更有趣，也有效得多。


    ## 动力

    我写这本书是为了教任何对计算机科学、软件工程和编程/编码有一点兴趣的人，如何通过学习 Java 来开始——这是当今最广泛使用和部署的编程语言。然而，《人性化
    Java》与其他编程书籍并不一样。我的意图是将编程与人类体验联系起来，让初学者更容易学习。


    ## 读者群体

    这本书是写给谁读的？对于今天从未听说过 Java 的初学者，本书将通过引导你逐步了解核心组件，开启你构建第一个 Java 应用程序的道路。


    对于那些尝试过但觉得编程生活对他们来说太冷、太不符合习惯，或者简单太无聊而无法继续学习的人，这本书将在这里慢慢吸引你进入深层学习。《人性化 Java》将帮助你把编程与生活经验联系起来，让你不再感到迷茫。你现有的知识将通过更清晰、更详细的解释得到加强。


