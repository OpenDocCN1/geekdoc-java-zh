    **How to Google**


    Often, when you have a question, you simply visit Google and type it in the same
    way it popped up in your mind:


    *Google: How do I take over the world?*


    That query may return some good results, but the results will vary largely. If
    you want to make sure you get the answer you want or get close enough, you need
    to provide Google a bit more information. May be instead of the previous wording
    of your query, you can try this:


    *Google: How do I build a bank?*


    You wanted to know how to take over the world, but Google doesn’t know how you
    want to do that. If you’ve observed the world enough, you may notice that banks
    have a great stronghold on the world. With that prior knowledge, you’d be better
    off asking Google how to build a bank. Let’s try another query.


    **Code Queries**


    Sometimes, you forget something when you are coding. Sometimes you don’t know
    how to code something. Let’s say you wanted to learn more about how to make variables.
    You could ask Google the following query:


    *Google: how do I make variables?*


    Again, Google would return many results, but the large majority may not be what
    you are looking for. This is because Google doesn’t know you intended to learn
    about Java variables, not variables in other programming languages. A better query
    may be one that tells Google that you want results about Java along with the type
    of variable you want to make:


    *Google: how do I make String variables in Java?*'
