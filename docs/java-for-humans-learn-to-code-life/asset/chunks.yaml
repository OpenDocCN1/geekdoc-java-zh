  trans: "\n\n将世界想象成一个程序。有 70 亿个 `Human` 类实例，可能有 100 亿个 `AppleTree` 类实例、50 亿个 `Car`\
    \ 类实例，自然界的每一个对象也是如此。有些 `Human` 实例执行医疗功能以保持每个人健康，有些执行法律功能以确保我们的安全，还有一些执行教育功能以增加我们的知识。此外，我们创建\
    \ `AppleTree` 类实例来提供我们吃的苹果和可以喝的苹果汁，我们需要 `Car` 类实例来带我们去我们需要去的地方。\n\n如果我们创建一个 `Car`\
    \ 实例，我们可以选择它的颜色并自定义它的速度。如果我们创建一个 `Human` 实例，我们就可以给它命名并分配一个唯一的识别号；如果我们创建一个 `AppleTree`\
    \ 实例，我们就可以选择苹果的颜色。没有这些类的实例，我们就无法充分发挥它们的潜力，也无法按照自己的意愿对其进行定制。通常，我们希望能够从类中创建对象以便在程序中使用它们，但有时我们只需要类来存储信息并执行该类本身通用的函数。在这种情况下，我们不需要类的实例来存储信息或运行函数。此类信息可以存储在静态类字段中，而函数可以作为静态类方法。\n\
    \n## 为什么静态字段和方法重要且有用\n\n`Java` 中的 `static` 关键字可以同时应用于类的字段和方法。类的 `static` 字段或方法可以在没有类实例的情况下访问。想象一种情况：你想存储对所有人都相同的信息，以及对所有人行为相同的函数。再次举一个很好的例子是\
    \ `Human` 类。\n\n作为 `Human` 类实例，我们执行许多功能对我们所有人都是通用的。我们都会说话、笑、哭、进，并一步步走路。因为这些功能是通用的，而不是特定于个人的，所以它们可以是静态方法。此外，我们的政府保留了关于我们所有的通用信息，以便为未来保留记录。他们可能会记录在任何给定时间内存在多少人类实例，有多少是非人、北美人、俄罗斯人、欧洲人、澳大利亚人、亚洲人等。其他通用信息可能包括我们有多少人是右手或左手，有多少人是男性或女性，有多少大学学位。这些数据点是通用的，不特定的某个\
    \ `Human` 类类的实例，因此我们可以将其存储在静态字段中。\n\n## 人类 Java\n35\n\n### 静态字段\n\n由于静态字段可以在没有类实例的情况下访问，它们是存储类通用信息的良好手段，例如创建了多少个该类的实例的计数。要创建一个静态字段，你只需在类成员变量（或字段）的声明之前放置\
    \ `static` 关键字：\n\n```java\npublic class Human {\n    public static int numHumans\
    \ = 7;\n    ...\n}\n```\n\n一旦该静态字段存在，你就可以从类的外部或内部访问它，无需类的实例。在访问它时，你可以根据意愿地获取或更改它的值。`public`\
    \ 修饰符意味着它可以从程序中任何可以访问该类的地方被访问。我们很快就会学习更多关于访问修饰符的知识。每当我们创建一个 `Human` 类的新实例时，我们可以让\
    \ `numHumans` 静态字段增加 1，这样我们的整个程序就知道城里有一个新人类要工作了。由于 `Human` 类是公共的，静态字段也是公共的，我们程序的任何部分都可以通过以下方式访问该静态字段：\n\
    \n```java\nint numHumansInWorld = Human.numHumans;\n```\n\n我们从类访问字段的方式被称为**点符号表示**（dot\
    \ notation），我们将在 `Dot Notation` 章节中学习更多相关内容。\n\n### 静态方法\n\n类有三种类型的方法：工厂（构造函数）方法、实例方法和静态方法。类的静态方法可以在没有该类实例的情况下调用。因此，静态方法无法访问实例变量或实例字段，因为实例变量存储的是关于类实例的信息。同样，静态方法在\
    \ `Java` 中无法访问 `this` 关键字，因为 `this` 指向类的当前实例，而该实例在静态方法的作用范围内不存在。此外，类的实例方法不能从该类的静态方法调用，因为静态方法中不存在该类的实例。然而，如果将类的实例传递给静态方法，该实例可以像往常一样在静态方法的作用范围内自由执行它的实例方法。\n\
    \n记住，我们使用静态方法处理类通用的功能。静态方法不关心类的实例或其状态。如果我们有一个 `Human` 类的实例，我们可以调用一个方法让它更改名字或说出它的名字。然而，如果我们只想使用我们的\
    \ `Human` 类来运行一些计算以确定人类的 DNA，或者检查目前世界上存在多少人类，我们可以创建静态方法来完成这些工作。让我们尝试后一种：\n\n##\
    \ 学习数据分类\n36\n\n```java\npublic class Human {\n    private static int numHumans\
    \ = 0;\n\n    public Human(String name){\n        this.name = name;\n        numHumans++;\n\
    \    }\n\n    public static int getNumHumans(){\n        return numHumans;\n \
    \   }\n    ...\n}\n```\n\n如果我们想从 `Human` 类外部访问静态的 `numHumans` 字段，这次我们必须调用 `getNumHumans()`\
    \ 方法，因为我们通过 `private` 修饰符将静态字段设为私有，这意味着该字段只能在其所属或所属的类内部被访问。这通常是一种明智的设计模式，以确保字段按照我们想要的方式使用；`Human`\
    \ 类中的 `numHumans` 字段只能在类内部更改，并通过 `getNumHumans()` 方法访问。我们可以从类的外部或内部调用该静态方法，因为它是公共的，它将返回我们程序中存在的人类实例的值：\n\
    \n```java\nint numHumansInWorld = Human.getNumHumans();\n```\n\n这将返回 `Human` 类中静态字段\
    \ `numHumans` 的值，并将其存储在局部变量 `numHumansInWorld` 中供以后。\n\n最后，类的实例可以在程序的任何地方调用该类的公共静态方法，但类的实例只能像其他私有方法一样，在类内部调用其私有静态方法。如果我们有一个静态方法仅用于将\
    \ `Human` 类中的静态 `numHumans` 字段增加 1 并在每次调用时返回新值，最好将其声明为私有方法，这样它就可以在 `Human` 类内部通过\
    \ `Human` 实例或其他静态方法进行调用：\n\n## 人类 Java\n37\n\n```java\npublic class Human {\n\
    \    private static int numHumans = 0;\n    private String name = name;\n    ...\n\
    \n    public Human(String name){\n        this.name = name;\n        incrementNumHumansAndPrint();\n\
    \    }\n\n    private static int incrementNumHumans(){\n        return numHumans\
    \ = numHumans + 1;\n    }\n\n    private static void incrementNumHumansAndPrint(){\n\
    \        System.out.println(\"现在社会上有 \" + incrementNumHumans()\n        + \" 个人类实例。\"\
    );\n    }\n\n    ...\n}\n```\n\n"
