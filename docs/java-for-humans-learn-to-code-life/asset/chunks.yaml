    \ = alphabet.indexOf(\"D\");\nSystem.out.println(\"Index of letter 'D' is \" +\
    \ indexOfLetterD);\n```\n**输出：**\n`Index of letter 'D' is 3`\n\n虽然“D”是英语字母表中的第四个字母，但在\
