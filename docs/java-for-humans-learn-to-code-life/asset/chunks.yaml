    There will be times when you have a word in a case other than what you need it
    in, so it’s nice to know that you can convert it to either all uppercase or all
    lowercase characters when stored in a `String` instance by using its `toLowerCase()`
    and `toUpperCase()` instance methods. A good use of such functionality would be
    to ensure consistency of the data you store in a database. Making sure all of
    the data you get from a user is lowercase before you store it in your database
    will make your database easier to search through later. This is also good for
    the users who do not want to worry about the case of the information they provide
    to your program. You can let the user enter information in any case they want
    and convert it to the necessary case behind the scenes for your program:


    ```

    String name = "Lincoln Daniel";

    String lowercaseName = name.toLowerCase();

    String uppercaseName = name.toUpperCase();

    System.out.println("Lowercase name: " + lowercaseName);

    System.out.println("Uppercase name: " + uppercaseName);

    ```


    **Output**

    Lowercase name: lincoln daniel

    Uppercase name: LINCOLN DANIEL


    **Note!**

    Bonus: Figure out how to capitalize the string; only make the first letter in
    a String uppercase. You may need to use the `substring()` instance method.


    ### String Replacement

    Another useful tool provided to us in the `String` class is a method to replace
    a substring in a string with another string. If you want to change your last name,
    you can call the `replace()` instance method on the string storing your full name.
    The `replace()` method takes two arguments — the substring you want to replace
    and the string to replace it with — and finds all occurrences of the first argument
    and replace them with the replacement. Finally, it will return the new `String`
    instance to you with the replacement. Let’s change my first name:


    ```

    String newName = name.replace("Lincoln", "Modern");

    System.out.println(newName);

    ```


    **Output**

    Modern Daniel


    ### Java for Humans

    67

    My name is now “Modern Daniel”. Let’s finish by changing my last name to “Nerd”:


    ```

    String newName2 = newName.replace("Daniel", "Nerd");

    System.out.println(newName2);

    System.out.println(name);

    ```


    **Output**

    Modern Nerd

    Lincoln Daniel


    Now my name is “Modern Nerd” and that new string is saved in the `newName2` `String`
    variable. However, if you want to access my original name, you can still do so
    because we did not change the value of our `name` variable. The `name` variable
    still holds my original name because the `replace()`method copies the string it
    is called on and returns the copy after modifying it. The original string is never
    modified because `String` instances are immutable. Immutable data cannot be mutated,
    or changed. Note that the `name` variable is mutable because it’s a variable,
    but the `String` instance it holds is the data that is immutable. Therefore, if
    we wanted to overwrite our original name in the `name` variable, we could do the
    follow:


    ```

    name = newName2;

    System.out.println(name);

    ```


    **Output**

    Modern Nerd


    ### Splitting a String into Tokens

    If you’ve ever written an essay for homework, you have likely been instructed
    to make sure your essay consists of exactly a certain amount of words. As you
    write it, you constantly check the amount of words you’ve written to check how
    far you are from completing the essay. Many word document editors have a tool
    to help you count the amount of words you’ve written so you don’t have to sit
    there and count your words on your own. Until now, how the editor does the word
    counting may have been a mystery to you. Let’s see how easy it is to split a `String`
    instance and count the amount of words in it by making use of the `split()` instance
    method.


    If you want to know how many words are in an string holding an essay, knowing
    that words are usually separated by a single empty space, you can provide an empty
    string with a length of one — a space — to the `split()` method in order to get
    all the tokens in the string as an array and count the number of tokens, elements
    in the array. Let’s try it out:


    ```

    String essay = "The ModernNerd coded everyday to build something great.";

    ```


    #### Learning to Manipulate Data

    68

    ```

    String[] allWordsInEssay = essay.split(" ");

    int numWordsInEssay = allWordsInEssay.length;

    System.out.println("Word Count: " + numWordsInEssay);

    ```


    **Output**

    Word Count: 8


    The `split()` method takes a delimiter as its single argument. The delimiter tells
    the method how to split the string up into tokens. Tokens are simply the parts,
    substrings, of the string as delimited by the provided delimiter. You can provide
    any string as your delimiter, and the method will return an array holding all
    of the tokens it could create from your string and your delimiter. If it doesn’t
    find your delimiter in your string, it will only return one token, the original
    string, in the resultant array.


    **Note!**

    We will learn more about Java arrays soon, but know that they simply store a collection
    of data of the same datatype and every array has a handy `length` field that holds
    an integer representing the amount of elements in the array.


    There are more methods provided to us in the `String` class for the purposes of
    manipulating strings, but the ones we have learned in this chapter are all you
    need to get started.


    ### Input and Output (I/O)

    Remember that we program to capture and manipulate information, or data, to create
    new data for users to consume. Software programs would not be interesting without
    being able to capture information, accept input from the user and produce new
    information — create output for the user to consume.


    As a kid, you likely played games that asked for your name and used that information
    to tailor your experience to you. To tailor the gaming experience to you, games
    usually refer to your name and use your age to determine which parts of the game
    would be most appropriate to show you. In some cases, games may not let you play
    if you provide an age that is too young. This is all an example of gathering user
    input and using it to create output. In this chapter, we will learn how Java allows
    us to easily gather input and produce output.


