  trans: "\n我们在 `Arrays` 章节中的电话簿只能存储固定数量的朋友联系信息，因为它是用数组创建的。我们通过将其实现为数组来限制电话簿的容量，因为这很合理：你的手机存储空间有限，所以我们只能存储有限数量的联系人。当你知道要收集多少个元素时，数组是最佳选择，但在其他情况下，限制集合的容量是没有意义的。对于这些情况，动态扩展的列表是最好的。\n\
    \n# 为什么列表（Lists）很重要且有用\n\n与数组不同，`Java` 中的列表可以无限制地扩展。你可能使用列表来累积和收集你不知道边界的事物，例如你一生中遇到的人、去过的地方、学习的技能、想看的电影。如果你听过“愿望清单（Bucket\
    \ List）”，它是列表最佳应用：将所有你想做的事情都丢进桶里，并在完成每一项时将其标记为已完成。\n\n`List` 类是一个接口，我们可以通过它实现任何种的列表子类。`Java`\
    \ 为我们提供了 `List` 接口的两种流行实现——`LinkedList` 和 `ArrayList` ——但我们在本章中重点关注 `LinkedList`，因为你已经非常了解\
    \ `ArrayList` 的工作原理；`ArrayList` 仅仅是一个带有方便的实例方法和动态扩展容量的数组。\n\n# LinkedList（链表列表）\n\
    \n`LinkedList` 是一种特殊的数据结构，允许我们无限制地将元素连接成一条线。`LinkedList` 的元素被称为节点（nodes），每个节点都有一个指向其左邻居的指针字段和另一个指向其右邻居的指针。\n\
    \n一个节点至少有三个实例字段：两个 `int` 值的指针，以及一个存储实际数据的 `datafield`（数据字段）。`LinkedList`（或任何数据结构）的数据类型是其元素的数据类型，且所有元素必须是同一种类型。\n\
    \n要开始使用 `LinkedList` 类，你只需要知道六个函数。`LinkedList` 有一个 `size()` 实例方法，返回列表中的节点数量。你可以通过将对象作为列表的\
    \ `add()` 实例方法的参数向 `LinkedList` 中添加元素。如果你想在尝试再次添加之前检查该对象是否已经在列表中，可以调用 `contains()`\
    \ 实例方法并提供要检查的对象作为参数。\n\n当你想要访问列表中的某个元素时，必须将该元素在列表中的位置作为参数传递给列表的 `get()` 实例方法。系统将返回列表中该位置节点所存储对象的引用。如果你想从列表中删除一个元素，只需将它的位置作为参数传递给列表的\
    \ `remove()` 实例方法。最后，你可以通过调用 `clear()` 方法从列表中删除所有元素。\n\n当我们初始化 `LinkedList` 时，必须指定可以存储在\
    \ `LinkedList` 中的数据类型。为了做到这一点，我们将类型的类名放在一组左尖和右尖箭头 `<>` 之间。让我们看看如何使用 `LinkedList`\
    \ 实例来创建我们今年想做的事物愿望清单：\n\n**Java for Humans**\n93\n\n```java\npublic class Thing\
    \ {\n    ...\n    @Override\n    public String toString() {\n        if(done)\
    \ { return name + \" is done.\";}\n        else { return name + \" is not done\"\
    ;}\n    }\n}\n\nLinkedList<Thing> bucketList = new LinkedList<Thing>();\n```\n\
    \n我们的 `Thing` 类只有两个实例字段：一个 `String name` 和一个 `boolean done`。我们可以通过调用 `getName()`\
    \ 实例方法获取 `Thing` 实例的名称，通过调用 `markDone()` 实例方法将 `Thing` 标记为已完成。我们可以通过调用 `isDone()`\
    \ 实例方法来检查 `Thing` 是否已完成。最后，我们的 `Thing` 类重写了其隐式父类 `Object` 的 `toString()` 实例方法。为我们的愿望清单添加一些要做的事：\n\
    \n```java\nbucketList.add(new Thing(\"Bungee Jump\"));\nThing learnJava = new\
