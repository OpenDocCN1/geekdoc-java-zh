    Now we have our bank account and all of it’s data is stored in variables with
    their appropriate datatypes. Given our new setup, we can manipulate parts of our
    account more easily without having to deal with parts we don’t want to. The bank
    teller can find our account by looking up it’s id, which is `123456782`, and ask
    us to verify the `ownerBirthday` on the account to make sure we are the owner
    of the account before telling us our balance. Later we can go to the ATM use our
    `passCode` to view our account’s balance. We can even change our balance by adding
    money to it or taking money out.


    We can do all of these individual data manipulations because we have our data
    separated in appropriately typed variables. It’s pay day, so let’s update our
    account balance:


    ```java

    balance = balance + 600.50;

    System.out.println("Our account''s new balance: $" + balance);

    ```


    **Output**


    `Our account''s new balance: $1901.91`


    After adding `$600.50` to our account’s balance, it went from `$1301.41` to `$1901.91`
    and is represented in our `balancevariable`. As we learn more awesome Java concepts,
    we’ll see our account balance increase considerably. It definitely pays to know
    how to increase your account balance.


    # Comments


    If you have the best memory in the world, you might be able to remember everything
    you do, why you do it, how you do it, and when you do it. You may even be able
    to tell people about your experiences when you are near them. If that is the case,
    you are very much fortunate. However, what about when you’re not nearby? How will
    you and others remember what you did to get a line of code to work and what it’s
    supposed to do? Queue the computer.


    ## Why Comments are Important and Useful


    Computers are the best at remembering information you give it and sharing that
    information with others when you’re not around. The folks who designed Java put
    this principle to good use for the sake of efficient programming. Java allows
    you to make comments in your code to help you and your team remember what your
    code does. It is very useful for every bit of code that people may have a hard
    time understanding. The best part of comments is that they will not be compiled
    by the compiler. In other words, comments don’t affect the execution of your code.
    They are like thought bubbles.


    Your goal as a programmer is to write clean, effective, and human understandable
    code. Comments will help you more easily accomplish writing human understandable
    code. As you get better at coding and begin building large projects with complex
    algorithms, you will want to make extensive use of comments to later remember
    what your code does and be able to easily and effectively explain it to others.
    This is great coding style. Let’s see what kind of comments are available for
    us to employ in our code.


    ### Single Line Comments


    Single line comments, like the one above, allow you to write quick comments to
    explain bits of code as you go. These comments are great for explaining your `variables`
    and their `declarations`.


    ```java

    //This is a cool single line comment

    ```


    ### Learning to Read and Write


    Single line comments must start with double forward slashes `//` and can only
    span a line of code. Let’s refer to our bank account example from the Datatypes
    chapter to see how we can make use of single line comments for variables:


    ```java

    //this is the account''s unique identifier

    int id = 1234567828;


    //this is the account''s balance

    double balance = 1301.41;


    //this is the pass code to access the account

    int passCode = 9889;

    ```


    ### Multi-line Comments


    Single line comments are great for commenting little bits of code when there’s
    not much to explain. However, when you write larger code, it’s best to use multi-line
    comments. Multi-line comments allow you to write long comments that can span for
    multiple lines by starting with `/*` and ending with `*/`.


    ```java

    /*This is an even cooler comment.

    It can span multiple lines*/

    ```


    Imagine you are writing a program to represent an ATM and you want to let the
    user use the ATM as long as they don’t type “EXIT”, you’d want to clearly explain
    how you intend to do that in your code. Doing so will require multiple lines,
    but it will also allow you to get all of your thoughts across:


    ```java

    //Scanner to get user input from keyboard

    Scanner scanner = new Scanner(System.in);


    //String variable to hold the user input

    String input = "";


    /*

    While the user does not want to exit,

    let them continue making transactions

    on our ATM.

    */

    while(!input.equalsIgnoreCase("EXIT")){

    //let the user make transaction on our ATM

    //then ask the user what they want to do next.

    System.out.println("Enter EXIT to exit or another action");

    //get user''s input from scanner

    input = scanner.nextLine();

    }

    System.out.println("Thanks for using our ATM!");

    ```


    Notice how we used multiple lines to explain our `while`-loop which does a lot
    of work. This will help us and others who read our code better understand what
    is happening.


    Don’t worry if you don’t yet understand what’s going on in that code snippet due
    to the `while` loop and `Scanner`. We’ll go over those concepts soon. For now,
    play around with the supporting code to see how it works.


    # Naming Conventions


    Remember when you were in the first grade and you had to write your first sentence?
    The teacher said your sentences must include a subject and a verb. Earlier, she
    made sure to teach everyone what a subject is and what a verb is so that later
    could use it with confidence. At this point, she was able to tell you how to structure
    your sentences: “All sentences must start with a capital letter and end with a
    punctuation.” She continued to explain the different types of sentences you can
    write along with each one’s punctuation: “Statements end with a period and questions
    end with a mark. Sometimes, we get excited when we say things, so we can use an
    exclamation point to show how excited we are!” She taught you the conventions
    of English so that you could effectively communicate your thoughts with your classmates,
    parents, and the rest of the world in a way everyone who understands English can
    comprehend.


    ##


    ## Java Naming Conventions


    ### Variable Naming


    What’s allowed? Variables in Java are case sensitive and can be of unlimited sequence
    of letters and numbers. However, variable names must start with a letter, underscore
    character `_`, or a dollar sign `$`.


    ```java

    String author = "Lincoln W Daniel";

    String bookTitle = "Java for Humans";

    int yearBookPublished = 2016;

    ```


    What''s the convention? While you can start with a underscore or dollar sign,
    the convention for naming variables in Java is to always start with a lowercase
    letter. To help make your code self-documenting, you should use full words to
    name a variable instead of single letter; variables named `day`, `month`, and
    `year`, for example, are more intuitive and readable than their abbreviated versions
    `d`, `m`, and `y` respectively.

