    public class OuterClass {\n    ...\n}\n\nclass AdditionalClass {\n    ...\n}\n\
    ```\n\n`AdditionalClass` 只能在同一个包中被访问。\n\n# 匿名类\n\n在 Java 中，类的定义和实例化可以合并为一步。通过这样做，类就不需要拥有名称。这些类被称为匿名类。匿名类可以在可以使用引用的上下文中定义并实例化，它是现有类的嵌套类。\n\
    \n匿名类最用于子类化并向上转换为“适配器类（Adapter Class）”或接口。\n\n# 访问修饰符\n\n你现在一定已经注意到了书中类声明开头位置的\
    \ `public`、`protected` 和 `private` 单词。这些关键字在 Java 语言语法中被称为访问修饰符，可以定义为...\n\n>\
    \ .. 帮助设置类、其成员变量和方法的可见性和可访问性的关键字。\n\n下表显示了适用于类、嵌套类、成员变量和变量的访问修饰符：\n\n| 类 | 嵌套类\
    \ | 方法 | 成员变量 | 接口 | 接口方法签名 |\n| --- | --- | --- | --- | --- | --- |\n| public\
    \ | 处处可见 | 与其类相同 | 与其类相同 | 与其类相同 | 处处可见 |\n| protected | 不适用 | 其类及其子类 | 其类及其子类\
    \ | 其类及其子类 | 不适用, 不适用 |\n| package (默认) | 仅从同包内 | 仅从同包内 | 仅从同包内 | 仅从同包内 | 不适用，默认是\
    \ public |\n| private | 不适用 | 仅从其类内 | 仅从其类内 | 仅从其类内 | 不适用, 不适用 |\n\n![](img/4e89b81da69e356cec19bc7ce6e739a0_99_0.png)\n\
    \n# 思考点\n\n注意，接口的可见性默认是 `public`。你不需要指定其访问修饰符，它将默认为 `public`。为了清晰起见，加上 `public`\
    \ 关键字被认为是一个做法。\n\n同样，接口中定义的所有成员变量一旦被继承到类中，默认都将变为 `static final`。\n\n如果一个类具有 `public`\
    \ 可见性，则该类可以被程序的任何地方引用。如果一个类具有包级可见性，则该类只能在定义它的包中被引用。如果一个类具有 `private` 可见性（这只有在类被定义嵌套在另一个类中时才会发生），则该类只能在外部类中访问。\n\
    \n如果变量定义在 `public` 类中并具有 `public` 可见性，则可以通过定义的类在应用程序的任何地方引用该变量。如果变量具有包级可见性，则只能可以通过定义的类在同一个包内引用该变量。如果变量具有\
    \ `private` 可见性，则只能在定义的类中被引用。\n\n# 方法定义\n\n方法是对象上的某种操作。我们需要名称、返回类型和参数。当我们定义一个方法时，需要指定它的可见性、返回类型和名称。例如：\n\
    \n```java\nclass MyClass {\n    public int methodName(int a, int b) {\n      \
    \  return a + b;\n    }\n}\n```\n\n返回类型不是签名的一部分。为什么呢？原因是方法可以在不赋值其返回值的情况下被调用。这一特性源自\
