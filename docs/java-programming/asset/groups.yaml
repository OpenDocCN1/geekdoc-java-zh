    ## JIT 即时编译编译器简介


    1.3 版本，该语言本身自 JDK 1.0 以来一直保持稳定；JDK 附带的类库变得越来越，并在某些部分发生了变化。与 Java 编程语言紧密相关的扩展和架构包括：J2EE,
    J2ME, JNDI, JSML, JDBC, JAIN, JDBCK, Jini, Jy, Jiro, JXTA, JavaSpaces, JMI。


    1.5（代号为 Tiger）于 2004 年 9 月发布。


    # 主要变化包括：


    - 泛型 (Generics) 为集合提供编译时类型安全，并消除了强制转换的繁琐。

    - 自动装箱/拆箱 (Autoboxing/unboxing) - 消除了基本类型（如 int）与包装类型（如 Integer）之间手动转换的繁琐。

    - 增强 for 循环 (Enhanced for) - 缩短在 Collections 中使用的 for 循环。

    - 静态导入 (Static imports) - 允许你导入类的所有静态部分。

    - 元数据 (Metadata) - 通过允许工具从源代码的注解生成代码，来避免编写样板代码。这导致了“声明式”编程风格，程序员只需说明应该做什么，工具就会生成执行该操作的代码。

    - JVM 改进 (JVM Improvements) - 大部分运行时库现在作为内存镜像映射到内存中，而不是从一系列类文件中加载。运行时库的大部分现在多个
    JVM 实例之间共享。


    # Java 平台


    较新版本的 Java，即版本 6.0 和 7.0 正在开发中，分别以代号 Mustang 和 Dolphin 闻名。


    Java 平台是 Sun Microsystems 提供的一种计算环境（或平台），它可以运行使用 Java 编程语言和一套开发工具开发的应用程序。在这种情况下，该平台不是特定的硬件或操作系统，而是一个称为虚拟机的执行引擎，以及一组提供通用功能的标准库。


    该平台的正规名称是 Java 2 平台（尽管去掉了“2”），它包含了标准版 JSE（现为 Java SE）、企业版 JEE（现为 Java EE）和微版 JME（现为
    Java ME）。Java 2 平台的当前版本也可以被指定为版本 1.5 或 5（两者均指同一个版本）。关于构成 Java 2 平台的众多技术的良好概述，可以在
    JDK 文档页面找到。


    # Java 技术


    Java 平台由广泛的技术组成，每种技术都提供了整体开发或运行时环境的不同部分。例如，最终用户通常与 Java 虚拟机和类库集交互。此外，Java 应用程序有许多部署方式，包括嵌入到网页中。最后，为该平台创建应用程序的开发者使用一套称为
    Java 开发包（JDK）的开发工具。


    # Java 运行时环境


    针对 Java 平台的程序需要在其主机上存在两个组件：一个 Java 虚拟机和一个一组提供其依赖的任何服务的类库。Sun 的 JVM 分发及其标准类的实现被称为
    Java 运行时环境（JRE）。


    # Java 虚拟机


    Java 平台的核心是通用“虚拟”处理器的概念，用于执行 Java 字节码程序。无论程序在什么硬件或操作系统下运行，字节码都是相同的。Java 平台提供了一个称为
    Java虚拟机（JVM）的解释器，它在运行时将 Java 字节码翻译成原生处理器指令。这使得同一个应用程序可以在任何带有可用虚拟机的平台上运行。


    从 JRE 版本 1.2 开始，Sun 的 JVM 实现中还包含了一个即时编译器。

    它不是一次解释一条字节码指令，而是在程序加载到虚拟机时，将程序的字节码转换为可执行的原生机器码，从而在每次加载新字节码时以微小延迟为代价，使其执行速度快得多。

    这允许 JIT 编译器针对特定的主机平台和硬件，甚至可能优化输出代码。


    # 语言


    Java 一词本身通常指的是为 Java 平台设计的 Java 编程语言。编程语言通常不在“平台”一词的范范围内。然而，Sun 不鼓励在平台上使用任何其他语言，并将
    Java 编程语言列为 Java 2 平台的核心部分。这些包括：


    - Groovy

    - Scala

    - GJ（泛型 Java），自 Sun 的 1.5 版本起已并入 Java。

    - NetREXX


    另一种选择是使用更具接口的方法，如 Jyphon。


    # 类似平台


    Java 的成功及其“一次编写，随运行”的概念也导致了其他类似的努力。其中最注意的是微软 .NET 平台，它借用了 Java 的许多概念和创新；事实上，它是对类
    Java 语言 Visual J#（以前称为 J++）的实现。


    后来微软停止并撤回了对 J# 的支持，并了一种名为 C# 的新语言。C# 与 J# 和 Java 非常相似，但与它们不兼容。Java 和 C# 之间的差异可以阅读
    w:Comparison of C Sharp and Java。


    | Java 编程 | | 索引 |

    |---|---|---||

    | | 概述 | 入门 | 基础 | 类与对象 |

    | 集合 | 异常 | 并发编程 | 反射 |


    '
