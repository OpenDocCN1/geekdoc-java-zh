  mdcn: "\n\n- 抛出了一个异常并找到了匹配的 catch 块。在这种情况下，将执行以下内容：\n  - try 块中直到异常发生处之前的代码\n  -\
    \ 匹配的 catch 块中的代码\n  - **finally** 块中的代码\n  - try-catch 块之后的代码\n- 抛出了一个异常但不存在匹配的\
