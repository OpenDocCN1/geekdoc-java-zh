    # # Statements


    In Java programming, instructions are referred to as *statements*. A clear indicator
    that a line of code is a statement is its termination with an ending semicolon
    (;). For instance, consider the following statement.


    ```

    int i = 9; // a single statement

    ```


    If one were to write multiple statements, it is recommended that each statement
    be entered on a separate line and should end with a semicolon ().


    ```

    int a = 10; // a statement

    int b = 20; // another statement

    int result = a + b; // yet another statement

    ```


    However, there is no problem writing the code this way.


    ```

    int a = 10; int b = 20; int result = a + b;

    ```


    The former code gathers appeal in the developer circles. Writing statements as
    in the second example only makes your code look more complex and incomprehensible.


    The C Yahoo describes how well and why we should indent our code. That also applies
    to Java code. For details see C Programming/Structure and style.


    Java is an Object Oriented language, and such it is built on the structural programming
    paradigm, where code consists of:


    +   - Sequences

    - Branches

    - Loops(Iterations)


    # # Program Control Flow


    When multiple statements are encountered in a program, they are evaluated in the
    order that they occur. The execution of flow would begin at the top most statement
    and proceed downwards till the last statement is encountered. Such flow is entirely
    straight-forward and requires loads of lines of code to encounter trivial tasks.
    Modern language address this problem with a programming construct called *branching*,
    described in detail in a later section.'
