    \n## 抛出和捕获异常\n\n### 异常 (Exception)\n\n异常是 Java 处理错误的方式。当发生意外情况时，可以抛出一个以异常对象为参数的异常对象。这意味着正常的程序控制流停止，并开始搜索\
    \ catch 块（异常块）。如果在当前方法中没有找到，搜索将继续到调用者方法级别，直到未找到为止，异常将由 JVM 处理，Java 程序终止。\n\n当找到“匹配”的\
    \ catch 块时，该块将被执行，异常对象将作为参数传递给该块。然后，在 catch 块之后继续执行程序的正常运行。参见 Java 异常处理语法。\n\n\
    ### 异常对象 (Exception Object)\n\n它是从错误中作为参数被“抛出”并传递给 catch 块的对象。异常对象封装了关于错误位置及其性质的信息。所有异常对象必须继承自\
    \ `java.lang.Throwable`。参见 UML 中的主要异常类。\n\n## 处理异常\n\n让我们查看以下代码：\n\n```java\n\
    public void methodA() throws SomeException {\n  //methodBody\n}\npublic void methodB()\
    \ throws CustomException {\n  //methodBody\n}\npublic void methodC() {\n  methodB();\n\
    \  methodA();\n}\n```\n\n在示例代码中，`methodB` 是无效的。因为 `methodA` 和 `methodB` 传递了（或抛出了）异常，`methodC`\
    \ 必须准备好处理它们。这可以通过两种方式处理：try-catch 块（它会在方法内部处理异常）和 throws 子句（它会将抛出传递给调用者处理）。上面的示例将导致编译错误，因为\
    \ Java 对异常处理非常严格。因此，程序员被迫在某处处理任何可能的错误情况。\n\n方法对异常可以做两件事：通过 `throws` 声明请求调用方法处理它；或者通过\
    \ `try-catch` 块在方法内部处理异常。\n\n要构造 throws 声明，使用所有的 `throws ExceptionName`（可以使用逗号添加额外的异常）。要构造\
    \ try-catch 块，使用以下语法：\n\n```java\ntry {\n  // 可能会导致异常的代码\n} catch (TheException\
    \ e) {\n  // 处理异常\n}\nfinally {\n  // 可选的。无论是否抛出异常都会执行\n}\n```\n\n原始代码可以通过多种方式修改以正确工作。例如如下：\n\
    \n```java\npublic void methodC() throws CustomException, SomeException {\n  try\
    \ {\n    methodB();\n  } catch (AnotherException e) {\n    // 处理它\n  }\n  methodA();\n\
    }\n```\n\n来自 `methodB` 的 `AnotherException` 将在本地处理，而 `CustomException` 和 `SomeException`\
    \ 将抛出给调用者处理。\n\n## 应用程序异常 (Application Exceptions)\n\n应用程序类应该继承 `java.lang.Exception`\
    \ 类。某些 JDK 类也抛出继承自 `java.lang.Exception` 的异常对象。如果继承了任何这些异常对象，它必须被异常处理点或 catch\
    \ 块捕获。如果异常对象继承自 `java.lang.Exception` 且不是 `java.lang.RuntimeException` 或其继承类，编译器将强制要求必须有一个与抛出的异常相关联的\
    \ catch 块。然而，`java.lang.RuntimeException` 或其继承类可以被应用程序捕获，但编译器并不强制执行此操作。\n\n让我们看看\
    \ catch 块捕获“被抛出”异常的判定标准。\n\ncatch 块当且仅当满足以下情况下会“捕获”被抛出的异常：\n\n- 抛出的异常对象与 catch\
    \ 块中指定的异常对象相同\n- 抛出的异常对象是 catch 块中指定的异常对象的子类型\n\n```java\ntry {\n  throw new Exception(\"\
    This will be caught below\");\n} catch (Exception e) {\n  // “被抛出”的对象与 catch 块中指定的相同\n\
    }\ntry {\n  throw new NullPointerException(\"This will be caught below\");\n}\
    \ catch (Exception e) {\n  // NullPointerException 是 Exception 类的子类-\n}\n```\n\
    \n一个 try 块可以有多个 catch 块。catch 块按顺序一个接一个地评估。如果某个 catch 块捕获了异常，其他块将不再被评估。\n\n示例：\n\
    \n```java\ntry {\n  throw new NullPointerException(\"This will be caught below\"\
    );\n} catch (Exception e) {\n  // 上面的 NullPointerException 将在这里被捕获-\n} catch (NullPointerException\
    \ e) { // --- 此代码执行 - 编译错误\n// ---\n```\n\n因为 `NullPointerException` 是 `Exception`\
    \ 类的子类。所有的 `NullPointerException` 都会被第一个 catch 块捕获。\n\n相反，上面的代码应该重写为：\n\n```java\n\
    try {\n  throw new NullPointerException(\"This will be caught below\");\n} catch\
    \ (NullPointerException e) {\n  // 上面的 NullPointerException 将在这里被捕获\n} catch (Exception\
    \ e) {\n  // 其他异常将在这里被捕获\n}\n```\n\n## 运行时异常 (Runtime Exceptions)\n\n`java.lang.RuntimeException`\
    \ 类继承自 `java.lang.Exception`。它是一个特殊的类，因为编译器并不强制捕获它或子类。运行时异常通常由数据错误引起，如溢出……运行时异常与业务无关。\n\
    \n## 空指针异常 (NullPointerException)\n\n`NullPointerException` 是 `RuntimeException`。在\
    \ Java 中，当应用程序尝试使用对象引用时，会分配一个特殊的空。这些包括：\n\n- 调用空对象的实例方法\n- 访问或修改空对象的字段\n- 获取空数组的长度\n\
    - 访问或修改作为数组的空槽位\n- 抛出空（如果它是 `Throwable`）\n\n应用程序应该抛出该类的实例来表示对象的非法使用。\n\n```java\n\
    Object obj = null;\n...\nobj.toString(); // --- 这将抛出 NullPointerException\n---\n\
    ```\n\n上面的代码显示了 Java 的陷阱以及常见的错误来源。没有创建对象且编译器无法检测到。`NullPointerException` 是 Java\
    \ 中抛出的最常见的异常之一。\n\n为什么我们需要使用空？\n\n我们需要是因为很多时候在创建对象本身之前，我们需要创建一个对象引用。对象引用在没有值的情况下无法存在，所以我们将空值赋值给：\n\
    \n```java\npublic Customer getCustomer() {\n  Customer customer = null;\n  try\
    \ {\n    customer = createCustomer();\n  } catch ( Exception e) {\n    ...\n \
    \   return customer;\n  }\n}\n```\n\n在上面的代码中，我们想在 try 块内部创建 Customer，但又想将对象引用返回给调用者，因此由于\
    \ Java 的作用域规则，我们需要在 try 块之外创建对象引用。\n\n## 主要异常类\n\njava.lang.Throwable\nThrowable\
    \ 类是 Java 语言中所有错误和异常的父类。只有该类或其子类的实例对象可以被 Java 虚拟机抛出或由 Java 语句抛出。Throwable 包含了创建时线程的执行栈快照。它还可以包含一个消息字符串，提供有关错误的更多信息。最后，它还可以包含一个原因（cause）：导致该\
    \ throwable 被抛出的另一个 throwable。原因机制是在 1.4 版本中引入的。它也被链式异常机制，因为原因本身又有原因，依此类推，导致一个异常的“链”，每个异常都由另一个引起。\n\
    \njava.lang.Error\nError 表示严重的问题，一个合理的"
