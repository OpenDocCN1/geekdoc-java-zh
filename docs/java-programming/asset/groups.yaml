    # Primitive Types


    # Primitive Types


    The Java primitive types contain pure values, no operations. It is basically data
    types similar what other non-object-oriented languages have.


    Arrays can be defined using Java primitive types, but because they are not objects,
    they can not be put in a collection.


    For this reason object wrappers are defined in ''java.lang.*'' package for all
    the primitive types.


    | Size (bits) | Example | Minimum Value | Maximum Value | Wrapper Objects |

    |---|---|---|---|-|

    | char | 16 | char c = ''A''; | Unicode 0 | Unicode 2¹⁶-1 | Character |

    | short | 16 | short s = 65; | -2¹⁵ | 2¹⁵-1 | Short |

    | int | 32 | int i = 65; | -2³¹ | 2³¹-1 | Integer |

    | long | 64 | long l = 65; | -2⁶³ | 2⁶³-1 | Long |

    | float | 32 | float f = 65f; | | | Float |

    | double | 64 | double d = 65.55d; | | | Double |

    | byte | 8 | byte b = 65; | -128 | 127 | Byte |

    | boolean | 1 | boolean b = true; | | | Boolean |'
