  - "[PAGE 69]\n\n+   * Access Modifiers\n\n**protected** is a Java keyword.\n\nIt\
    \ is an access modifier, it is used before a method, to indicate that the method\
    \ can be accessed\nonly by the class subclasses.\n\nSyntax:\n\n```\nprotected\
    \ void method();\n\n* Access Modifiers\n```\n\n**public** is a Java keyword that\
    \ declares a member's access as public. Public members are\nvisible to all classes.\
    \ This means that any class can access a **public** field or method.\nFurther,\
    \ other classes can modify **public** fields unless the field is declared **final**.\n\
    \nA best practice is to use **private** access and reserve **public** access to\
    \ only the set of\nmethods and **final** fields that define the class 'public'\
    \ constants. This helps with encapsulation\nand hiding information, it allows\
    \ you to change the implementation of a class without\nafecting the consumers\
    \ who use only the **public** API of the class.\n\nBelow is an example of an immutable\
    \ **public** class named **Length** which maintains **private**\nfields named\
    \ units and provides a **public** constructor and two **public**naccessor methods.\n\
    \n```\npackage org.yahoos.java;\npublic class Length {\nprivate double magnitude;\n\
    private String units;\npublic Length(double magnitude, String units) {\n    if\
    \ (units == null || units.trim().length() == 0)\n        throw new IllegalArgumentException(\"\
    non-null, non-empty units\\nrequired\");\n    this.magnitude = magnitude;\n  \
    \  this.units = units;\n}\npublic double getMagnitude() {\n    return magnitude;\n\
    }\npublic String getUnits() {\n    return units;\n}\n}\n```\n\n**return** is a\
    \ Java keyword."
