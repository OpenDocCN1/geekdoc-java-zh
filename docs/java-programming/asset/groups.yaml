    \     }\n    }\n}\n```\n\n如所示，内部类拥有访问外部实例变量的权限，即使是 `private`。这与 C++ 中的嵌套类非常不同，C++\
    \ 中的嵌套仅仅是一种名称隐藏机制。\n\n创建的内部对象拥有外部对象的引用。嵌套对象只能通过“外部”对象来创建。见下文。\n\n```java\npublic\
