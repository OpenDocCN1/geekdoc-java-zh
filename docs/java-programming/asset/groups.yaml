    \ 为 Windows、Linux 和 Solaris 提供了 JDK。\n\n你有许多环境可以用来开发你的 Java 程序。你可以选择在文本编辑器中编写程序，然后使用命令行进行编译，或者你可以使用集成开发环境\
    \ (IDE)。像 NetBeans 和 Eclipse 这样的 IDE 提供了许多有用功能，如语法错误检查、代码补全、自动编译和调试，你可能会发现这些功能非常有用，特别是当你第一次尝试编程时。\n\
    \n# Java 编译器\n\nJDK 包含了一组构建 Java 程序所必需的工具。JDK 中最著名的工具是 Java 编译器，也称为 javac。\n\n\
    javac 将 Java 源文件编译成可执行的 Java 类文件。源文件是带有 .java 扩展名的文件。你可以使用文本编辑器（如记事本）或 IDE 创建此类文件。然后\
    \ javac 将这些文件编译为可加载和执行的类文件，使用 .class 扩展名。例如，如果你创建了一个 Java 类 org/yahoos/util/PrintDate.java\n\
    \n```java\npackage org.yahoos.util;\nimport java.util.Date;\npublic class PrintDate\
    \ {\n    public void main(String[] args) {\n        System.out.println(new Date());\n\
    \    }\n}\n```\n\n你可以通过在 shell 中输入以下命令来编译它：\n\n你通常会在包含所有源文件的根目录工作目录的 shell 中调用它。Java\
    \ 的包语句 `package org.yahoos.util` 对应于目录结构 `org/yahoos/util`，详见 Java 包。\n\njavac\
    \ 会会在源文件所在目录中创建 PrintDate.class。如果有语法错误，javac 将错误信息打印到 shell 中。PrintDate.class\
    \ 文件包含了在 Java 运行时安装的任何硬件上运行的代码。如果 PrintDate.class 文件是在 Windows 操作系统中创建的，你可以将此文件复制到\
