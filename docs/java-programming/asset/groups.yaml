    # Collection Classes


    Collections are a group of object bound together by a common characteristic. Java
    has various built-in classes to support the collection of objects, either of the
    same type or general. The most basic construct to work with is the array of which
    you will come to know of in a section later in this chapter.


    # Introduction to Collections


    The most basic collection interface is called Collection. This interface gives
    the user a generic usage of a collection.


    ```

    import java.util.Collection;      // Interface

    import java.util.ArrayList;      // Implementation

    import java.util.HashSet;         // Implementation


    Collection coll1 = new ArrayList();

    Collection coll2 = new HashSet();

    ...

    Use coll1 && coll2 >

    ```


    In the above there are two collections. The usage of the collections are the same,
    the implementations are different. If the existing collection implementations
    do not meet your needs, you can write your version of the implementation. Your
    version of the implementation just needs to implement the same java.util.Collection
    interface, then you can switch between your implementation and the code that is
    using the collection does not need to be changed.


    ```

    import java.util.Collection;

    import com.yourcomp.util.YourCollectionImpl;


    Collection coll1 = new YourCollectionImpl();

    Collection coll2 = new YourCollectionImpl();

    ...

    Use coll1 && coll2 >

    ```


    The JDK collection implementations are quite good and powerful, so it is unlikely
    that you will need to write your own.


    All collections contain the object references. Because of if the object is changed
    after it was put in the collection, the object that is ''in'' the collection also
    ''changes''. The object is not really in the collection, only the object reference
    is. It is not guaranteed that the objects ''inside'' the collections won''t change.
    This is an issue if you put an actively used object in the collection. In that
    case when you are adding an object that could change any time you need to make
    a copy or clone of the object. A new object will be created and will be put in
    the collection.'
