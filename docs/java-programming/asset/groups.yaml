    \ 中的第二个 'f'。这被称为 `beginIndex`。从 `beginIndex` 到字符串末尾的所有字符将被复制到新的子字符串中。\n\n第二种方法涉及用户定义的\
    \ `startIndex` 和 `endIndex`。例如：\n\n```java\nString str = \"supporting\";\nString\
    \ substr = str.substring(3,7);\n```\n\n`substr` 返回的字符串将是 'port'。请注意，`endIndex`是不包含的。这意味着最后一个字符的索引是\
