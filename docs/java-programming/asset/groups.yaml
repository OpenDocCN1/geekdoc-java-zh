    # 监控与管理工具 / 故障排除工具


    在 Java 1.5 中，JDK 除了增加了一套故障排除工具外，还增加了一套监控和管理工具。


    监控和管理工具用于监控虚拟机和执行环境。它们允许在 Java 程序执行期间监控内存使用情况。


    故障排除工具提供了对虚拟机某些方面较为深层的洞察。（有趣的是，Java 调试器并未被归类为故障排除工具。）


    目前所有的监控、管理故障排除工具都标记为“实验性”（这不影响 jdb）。它们可能会在未来的 JDK 中消失。


    # Jar 工具


    Jar 是 Java archive（Java 归档）的缩写。这是一个用于创建 Java 归档或 jar文件的工具（扩展名为 .jar）。Java 归档是编译后的
    Java 类以及运行时所需的其他资源（如文本文件、配置文件、图像）的集合。在内部，jar 文件实际上是一个 .zip 文件。


    # jdb 工具


    Jdb 是 Java debugger（Java 调试器）的缩写。Java 调试器是一个命令行控制，为 Java 程序提供调试环境。虽然你可以使用这个命令行控制，但
    IDE 通常提供更容易使用的调试环境。


    # Javadoc 工具


    随着程序变得庞大且复杂，程序员需要方法来跟踪更改，并在代码演化的每一步更好地理解代码。几十年来，程序员一直使用一种称为“注释”的特殊编程结构——这些注释是源码中帮助为代码段声明用户定义的区域。但注释往往变得冗长且难以理解，更不用说在拥有数百行代码的应用程序中难以阅读。


    Java 为用户提供了一种通过特殊的注释系统和 javadoc 工具轻松发布代码文档的方法。javadoc 工具可以生成有关一组用户创建的 Java 类应用程序编程接口（API）的文档。javadoc
    从 .java 源文件读取源码，并生成更易阅读且无需理解代码本身即可的 HTML 文档。


    # javap 工具


    如果说 Javadoc 提供 Java 类 API 和文档的详细视图，那么 javap 工具则打印有关类中成员（构造函数、方法和变量）的信息。换句话说，它列出了类的
    API 以及类编译后的指令。javap 是 Java 字节码的反汇编器。


    | Java 编程 | 索引 |

    |---|---|

    | 入门 | 基础 | 类与对象 |

    | 集合 | 异常 | 反射 |

    | Applets | JavaBeans | 库 |


    # 安装


    #检查 Java


    Java 开发包 (JDK) 是构建 Java 程序所需的。Java 运行时环境 (JRE) 是执行 Java 程序所需的。对于我们的目的，你必须使用 JDK。首先，检查系统是否已安装了
    JDK。为此，请打开终端窗口或命令行窗口并执行


    ```

