    \n- short shr = 65;\n\n### - Primitive Types\n\nstatic is a keyword that states\
    \ that all instances of a given class are the same to share the variable/method.\
    \ This is used for a constant variable or a method that is the same for every\
    \ instance of a class, as the methods in the Math class. The main method of a\
    \ class is labelled static.\n\nNo object needs to be created to use static variables\
    \ or call static methods. Just put the class name before the static variable or\
    \ method to use them.\n\nStatic methods can not call non-static methods. The `this`\
    \ current object reference is also not available in static methods.\n\nSyntax:\n\
    \n```\npublic static variableName;\nor\nstatic public variableName;\nand for methods\
    \ :\n```\n\n```\npublic static void methodName()\n{\n    ...\n}\nor\nstatic public\
    \ void methodName()\n{\n    ...\n}\n```\n\nTo access them :\nClassName.variableName\
    \ = 10;\n\n```\nClassName.methodName();\n```\n\nFor Example:\n\n```java\npublic\
    \ static final double pi = 3.14159;\npublic static void main(String[] args)\n\
    {\n    ...\n}\n```\n\n**strictfp** is a java keyword, since Java 1.2.\n\nIt makes\
    \ sure that floating point calculations results are precisely the same regardless\
    \ of the underlying operating system and hardware platform, even if more precision\
    \ could be obtained. This is compatible with the earlier version of Java 1.1.\
    \ If you need that use it. \n\nSyntax:\n\n```\npublic strictfp class MyClass\n\
    {\n    ...\n}\nor\nstrictfp public class MyClass\n{\n    ...\n}\npublic strictfp\
    \ void method()\n{\n    ...\n}\n\nstrictfp public void method()\n{\n    ...\n\
    }\n```\n\nsuper is a keyword.\n\nUsed inside a sub-class method definition to\
    \ call a method defined in the super class. Private methods of the super-class\
    \ cannot be called. Only public and protected methods can be called by the super\
    \ keyword.\n\nSyntax:\n\n```\nsuper.<method-name>();\n```\n\nFor Example:\n\n\
    ```java\npublic class SuperClass {\n    public void printHello() {\n        System.out.println(\"\
    Hello from SuperClass\");\n        return;\n    }\n}\n\npublic class SubClass\
    \ {\n    @Override \n    public void printHello() {\n        super.printHello();\n\
    \        System.out.println(\"Hello from SubClass\");\n        return;\n    }\n\
    \n    public static void main(String[] args) {\n        SubClass obj = new SubClass();\n\
    \        obj.printHello();\n    }\n}\n```\n\nRunning the above program:\n\n```\n\
    Java SubClass\n```\n\nThe output:\n\n```\n\"Hello from SuperClass\"\n\"Hello from\
    \ SubClass\"\n```\n\n- * Keywords/extends\n\nswitch is a Java keyword. It is a\
    \ branching operation, based on a number. The 'number' must be either char, byte,\
    \ short, or int primitive type.\n\nSyntax:\n\n```\nswitch ( <integer-var> ) {\n\
    \    case <label>: <statements>;\n    case <label>: <statements>;\n    case <label>:\
    \ <statements>;\n    default: <statements>;\n}\n```\n\nWhen the <integer-var>\
    \ value match one of the <label>, then: The statements after the matched label\
    \ will be executed including the following label's statements, until the end of\
    \ the switch block, or until a break keyword is reached.\n\nFor Example:\n\n```java\n\
    int var = 3;\nswitch ( var ) {\n    case 1: System.out.println(\"Case: 1\");\n\
    \        System.out.println(\"Execute until break\");\n        break;\n    case\
    \ 2: System.out.println(\"Case: 2\");\n        System.out.println(\"Execute until\
    \ break\");\n        break;\n    case 3: System.out.println(\"Case: 3\");\n  \
    \      System.out.println(\"Execute until break\");\n        break;\n    case\
    \ 4: System.out.println(\"Case: 4\");\n        System.out.println(\"Execute until\
    \ break\");\n        break;\n    default: System.out.println(\"Case: default\"\
    );\n        System.out.println(\"Execute until break\");\n        break;\n}\n\
    ```\n\nThe output from the above code is:\n\nCase: 3\nExecute until break\n\n\
    The same code can be written with if-else blocks:\n\n```java\nint var = 3;\nif\
    \ (var == 1) {\n    System.out.println(\"Case: 1\");\n    System.out.println(\"\
    Execute until break\");\n} else if (var == 2) {\n    System.out.println(\"Case:\
    \ 2\");\n    System.out.println(\"Execute until break\");\n} else if (var == 3)\
    \ {\n    System.out.println(\"Case: 3\");\n    System.out.println(\"Execute until\
    \ break\");\n} else if (var == 4) {\n    System.out.println(\"Case: 4\");\n  \
    \  System.out.println(\"Execute until break\");\n} else { // This is the default\n\
    \    System.out.println(\"Case: default\");\n    System.out.println(\"Execute\
    \ until break\");\n}\n```\n\n- * Keywords/if\n\nsynchronized is a keyword. It\
    \ is a branching operation, based on a condition. The condition must be a boolean\
    \ primitive type.\n\nSyntax:\n\n```\nif (condition) {\n    <statements>;\n} else\
    \ if (condition) {\n    <statements>;\n} else {\n    <statements>;\n}\n```\n\n\
    When the condition is true, the statements inside the if block are executed. If\
    \ the condition is false, the program moves to the else if or else block.\n\n\
    Example:\n\n```java\nint x = 5;\nif (x > 3) {\n    System.out.println(\"x is greater\
    \ than 3\");\n} else if (x > 0) {\n    System.out.println(\"x is greater than\
    \ 0\");\n} else {\n    System.out.println(\"x is not greater than 0\");\n}\n```\n\
    \n- * Keywords/synchronized\n\nsynchronized is a Java keyword. It is used to ensure\
    \ that only one thread can execute a block of code or a method at a time. This\
