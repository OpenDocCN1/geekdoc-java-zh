    \ of Customer.\n\n```java\npublic class Customer implements Cloneable\n{\n   \
    \ public Object clone() throws CloneNotSupportedException {\n        Object obj\
    \ = super.clone();\n        return obj;\n    }\n}\n```\n\nIn this example we used\
    \ cloning for speed up creation.\n\nOther use of cloning could be to take a snapshot\
    \ of an object that can change in time. Lets say we want to store Customer objects\
