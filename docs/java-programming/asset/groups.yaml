- md: "\n| Applets | JavaBeans | Libraries |\n\n# Java Programming Environment\n\n\
    To compile Java programs, you will need to download and install the Java Development\
    \ Kit (JDK). This is available from Sun's website. Other hardware and operating\
    \ system vendors also supply Java Development Kits for their platforms, although\
    \ they may change the name of the kit. Sun produces JDKs for Windows, Linux, and\
    \ Solaris.\n\nThere are numerous environments you can use to develop your Java\
    \ programs. You can choose to write your programs in a text editor and then compile\
    \ them using the command line, or you can use an integrated development environment\
    \ (IDE). IDEs like NetBeans and Eclipse provide many useful functions such as\
    \ syntax error checking, code completion, automatic compilation and debugging,\
    \ which you may find useful, especially if this is your first foray into programming.\n\
    \n# The Java Compiler\n\nThe JDK consists of a set of tools necessary to construct\
    \ Java programs. The most notable tool in the JDK is the Java compiler, also known\
    \ as javac.\n\njavac compiles Java source files into executable Java class files.\
    \ Source files are files with a .java file extension. You can create such files\
    \ with a text editor, like Notepad, or an IDE. javac then compiles these files\
    \ into loadable and executable class files, using the .class extension. For example,\
    \ if you create a Java class org/yahoos/util/PrintDate.java\n\n```java\npackage\
    \ org.yahoos.util;\nimport java.util.Date;\npublic class PrintDate {\n    public\
    \ void main(String[] args) {\n        System.out.println(new Date());\n    }\n\
    }\n```\n\nyou can compile it by entering the following command in a shell:\n\n\
    You would normally invoke this in a shell where working directory is the root\
    \ directory containing all of your source files resides. The Java package statement,\
    \ package org.yahoos.util, corresponds to the directory structure org/yahoos/util\
    \ until see Java packages.\n\njavac will create the PrintDate.class in the same\
    \ directory where the source file is located. If there are syntax errors, javac\
    \ will print to the shell. The PrintDate.class file contains the code that will\
    \ run under whatever hardware the Java runtime is installed. If the PrintDate.class\
    \ file was created in Windows operating system, you can copy this file to unix\
    \ and it will be executed fine.\n\nUsually there is more than one class created\
    \ and those files are packaged to a application_name.jar file to distribute to\
    \ run in any hardware.\n\nIDEs manage this process automatically. For example,\
    \ Eclipse contains its own Java compiler and does not use javac directly. It automatically\
    \ compiles the Java source files when you save them. The use of IDE's as Eclipse\
    \ are beyond the scope of this module, however, so consider the IDE's tutorials\
    \ and help to see how they provide a Java programming environment.\n\n# The bytecode\n\
    \nIt is clear from the above paragraph that the Java compiler source text files\
    \ with the extension .javac into executable code confined into a class file with\
    \ the .class extension. Such code is called Bytecode.\n\nIn many languages prior\
    \ to Java, the source code would generally compile into the machine-code for the\
    \ particular machine the program was compiled. Therefore, if a program was compiled\
    \ on an X86 machine, it would run only on an X86 machine and no other. Java, on\
    \ the other hand, produces a bytecode - an intermediate binary form of code that\
    \ is a portable representation of a Java class. Any Java Virtual Machine on any\
    \ hardware/operating system platform can then execute this bytecode. There are\
    \ some restrictions to this portability: For example, a Java ME system cannot\
    \ execute all programs compiled for the Java SE environment because Java ME is\
    \ pared down to small devices. But in general, a Java SE program can run unmodified\
    \ on any Java SE machine.\n\n# The JIT compiler\n\nBeing compiled halfway through,\
    \ it is the job of the Java Virtual Machine to compile the rest of the program\
    \ to native code at the time of its execution making Java follow the \"Write Once,\
    \ Run Anywhere\" (WORA) policy. The compiler used to compile bytecode into machine-code\
    \ at runtime is the Just-In-Time or JIT compiler. Once a piece of code is compiled\
    \ by the JVM to execution code, the code is used and re-used again and again,\
    \ to speed up execution.\n\n# The Java Runtime Environment\n\nThe Java Runtime\
    \ Environment, or JRE, is responsible for the execution of Java programs. The\
    \ Sun JDK also includes the JRE. The JRE however can be installed and without\
    \ installing the JDK which is useful if you wish to execute Java programs but\
