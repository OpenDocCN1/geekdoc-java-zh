    ## 执行


    Java 代码有多种执行方式。复杂的 Java 应用程序通常使用第三方 API 或服务。在本节中，我们列出了 Java 代码被打包和/或执行的最常用方式。


    ## JSE 代码执行


    Java 语言第一版出现在客户端/服务器时代。当时开发了具有丰富 GUI 界面面的胖客户端。Java 第一版 JSE（Java 标准版）具备以下功能：


    - GUI 能力（AWT, Swing）

    - 网络计算能力（RMI）

    - 多任务能力（线程）


    通过以下 Java 代码执行是可能的：


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_33_0.png)


    图 1：独立执行

    独立 Java 应用程序

    （图 1）独立应用程序指的是用户界面和业务模块都运行在同一台计算机上的 Java 程序。应用程序可能使用也不使用数据库来持久化数据。用户界面可以是 AWT
    或 Swing。


    应用程序将从类的 `main()` 方法开始启动。当 `main()` 方法退出，或者应用程序向 JVM 抛出异常时，应用程序停止。类由 JVM 根据需要加载到内存并进行编译，可以来自文件系统，也可以来自
    *.jar 文件。


    ## Java ‘jar’ 类库


    工具类、框架类和/或第三方类通常打包并分发在 Java *.jar 文件中。这些 *.jar 文件需要被放入使用这些类的 Java 程序的 CLASSPATH
    中。


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_34_0.png)


    图 2：Applet 执行


    ## Java Applet


    （图 2）Java Applets 是在 HTML 页面中通过 `<APPLET>` 标签引用的 Java 代码。Java 代码从服务器下载并在客户端浏览器的
    JVM 中运行。Java 内置支持在浏览器窗口中渲染 applet。


    在本书时（2006 年），Applets 并没有实现它的承诺。复杂的 GUI 客户端被发现很难开发，主要是因为下载时间、浏览器 JVM 之间的兼容性以及返回服务器的通信需求。Applet
    现在仍然被使用，如果被使用，它们被作为小型图形动画使用。微软造成了致命打击，首先是从 Internet Explorer 中撤销对 Java 的支持，其次是在
    Internet Explorer 的默认配置中排除了 Java JRE。


    关于 applet 的更多信息可以在本书的 Applet 章节找到。Google 也有关于 Applet 的文章。


    ## 客户端服务器应用程序


    客户端服务器应用程序由前端和后端组成，运行在独立的计算机上。这种设计理念是业务逻辑位于后端部分，供所有客户端复用。这里的挑战是实现前端用户界面代码与后端业务逻辑代码的分离。


    前端与后端之间的通信可以通过方式实现：


    - 一种方法是在两层之间定义通信协议。后端部分将监听传入的请求。根据协议它解释请求并以数据形式返回结果。

    - 另一种方法是使用 Java 远程方法调用（RMI）。通过使用 RMI，可以创建并供客户端使用的对象。在这种情况下，Java 对象跨网络传输。


    ## Web 应用程序


    对于需要大量客户端安装的应用程序，客户端-服务器模型行不通。维护和升级成百上千个客户端会导致问题。创建 Web-服务器模型是解决方案。客户端是浏览器，服务器托管应用程序。


    业务逻辑在服务器上，而呈现层发送到浏览器。这就是客户端-服务器架构。客户端处理用户界面和交互，而服务器处理业务逻辑和数据处理。这种分离有利于扩展和便于维护。


    客户端与服务器之间的通信通常通过 HTTP 完成。客户端向服务器发送请求，服务器返回响应。这些响应通常包含 HTML、JSON 或其他类型的数据，客户端随后对这些数据进行渲染。


