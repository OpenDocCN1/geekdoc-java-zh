    \n# 在类内部嵌套类\n\n当类在另一个类内部创建时，嵌套类的访问修饰符可以是 `public`（公共）、`private`（私有）或 `package`（包级默认）。\n\
    \n```java\npublic class OuterClass {\n    private String outerInstanceVar;\n \
