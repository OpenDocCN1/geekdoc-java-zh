    means a call to that method, such as intValue(args[0]), is an expression of int.
    This helps explain why the method cannot call


    ```

    new Distance(args[0], args[0], args[0], args[0]) // this is an error

    ```


    Since the type of args array is String, and our constructor''s parameters must
    be int, such a call would result in an error because Java cannot automatically
    convert values of type String into values.


    Java''s primitive types are boolean, byte, char, short, int, long, float and double,
    each of which are also Java language keywords.


    # Array Types


    Java supports arrays, which are aggregate types which have a fixed element type
    (which can be any Java type) and an integral size. This program uses only one
    array, String[] args. This indicates that args has an array type and the element
    type is String. The Java VM constructs and initializes the array that is passed
    to the main method. See arrays for more details on how to create arrays and access
    their size.


    The elements of arrays are accessed with integer indices. The first element of
    an array is always element 0. This program accesses the first four elements of
    the args array explicitly with the indices 0, 1, 2, and 3. (This program does
    not perform any input validation, such as verifying that the user passed at least
    four arguments to the program. We will fix that later.)


    # void


    void is not a type in Java; it represents the absence of a type. Methods that
    do not return values are declared as void methods.


    This class defines two void methods:


