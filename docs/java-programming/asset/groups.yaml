    ![](img/4e89b81da69e356cec19bc7ce6e739a0_152_0.png)


    java.util.TreeSet<E>


    Elements are sorted, not synchronized, `null` not allowed


    java.util.HashSet<E>


    Not synchronized, the `null` elements


    java.util.CopyOnWriteArraySet<E>


    Thread safe, a fresh copy is created during modification operation, add, update,
    delete expensive.


    java.util.EnumSet<E> extends Enum<E>>


    All of the elements in an enum set must come from a single enum type that is specified,
    explicitly or implicitly, when the set are represented internally as bit vectors.


    java.util.LinkedHashSet<E>


    Same as HashSet, plus defines the iteration order, which is the order in which
    elements were inserted into the set.


    Set can not have duplicates. You may wonder how duplicates are detected when we
    are adding an object to the `Set`. We have to see if that object exists in the
    Set or not. It is not enough to check the object references, the objects values
    to be checked as well.


    To that, fortunately, each java object has the `boolean equal(Object obj)`; method
    available inherited from `Object`. You need to override it. This method will be
    called by the Set implementation to compare the two objects to see if they are
    equal or not.


    There is a problem, though. What if I put two different type of objects to the
    `Set`? I put an Apple and an Orange. They cannot be compared. Calling the `equal()`
    method would cause a `ClassCastException`. There are two solutions to this:'
  - "[PAGE 153]\n\nSolution one : Override the int hashCode() method and return the\
    \ same values for the same type of objects and return different values for different\
    \ type of objects. The equals() method is used to compare objects only with the\
    \ same value of hasCode. Before an object is added, the Set implementation needs\
    \ to.\n\n+   - find all objects in the Set that has the same hashCode as the candidate\
    \ object hashCode\n- and for those, call the equals() methods passing in the candidate\
    \ object if any of them return true, the object is not added to the Set.\n\nSolution\
    \ two : Create a super class for the Apple and Orange, lets call it Fruit class.\
    \ Put Fruits in the Set. You need to do the following:\n\n+   - Do not override\
    \ the equals() and hashCode() methods in the Apple and Orange classes\n- Create\
    \ appleEquals() method in the Apple class, and create orangeEquals() in the Orange\
    \ class\n- Override the hashCode() method in the Fruit class and return the value,\
    \ so the equals() is called by the Set implementation\n- Override the equals()\
    \ method in the Fruit class for something like this.\n\n```\npublic boolean equals(Object\
    \ obj) {\n    boolean ret = false;\n    if (this instanceof Apple && obj instanceof\
    \ Apple) {\n        ret = this.appleEquals(obj);\n    }\n    else if (this instanceof\
    \ Orange && obj instanceof Orange) {\n        ret = this.orangeEquals(obj);\n\
    \    }\n    else {\n        // -- Can not compare Orange to Apple --\n       \
    \ ret = false;\n    }\n    return ret;\n}\n```\n\nNote:\n\n+   - only those objects\
    \ are compared that they have the same hashCode.\n- you are responsible to override\
    \ the equals() and hashCode() methods, the default won't work\n- only override\
    \ the hashCode() method, if you want to eliminate value duplicates.\n- do not\
    \ override the hashCode() method, if you know that the values of your objects\
    \ are different, or if you only want to prevent adding the exactly same object."
- md: '

    - that the hashCode() may be used in other collection implementations, like in
    a HashTable to find an object fast. Overriding the default hashCode() method may
    cause performance issues there.

    - the default hashCodes are unique for each object created, if you decide not
    to override the hashCode() method, there is no point overriding the equal() method,
    it won''t be called.


    # SortedSet


    The SortedSet interface extends the Set Interface. All elements in the SortedSet
    must implement the Comparable Interface, further all elements must be mutually
    comparable.


    Note that the ordering maintained by a sorted set must be consistent with equals
    if the sorted set is to correctly implement the Set interface. This is because
    the Set interface is defined in terms of the equals operation, but a sorted set
    performs all element comparisons using its compareTo(or compare) method, so two
    elements that are deemed equal by this method are, from the standpoint of the
    sorted set, equal.


    The SortedSet interface has additional methods to the sorted nature of the ''Set''.
    Those are:


    - E first(); -- returns the first element

    - E last(); -- returns the last element

    - SortedSet headSet(E toElement); -- returns from the first, to the exclusive
    toElement

    - SortedSet tailSet(E fromElement); -- returns from the inclusive fromElement
    to the end

    - SortedSet subSet(E fromElement, E toElement); -- returns elements range from
    fromElement, inclusive, to toElement, exclusive. (If fromElement and toElement
    are equal, the returned sorted set is empty.)


