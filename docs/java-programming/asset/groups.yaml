    \ receiving from a remote source\n\nWhen an object is sent through a network,\
    \ the object needs to be recreated at the receiving host.\n\n## Object Serialization\n\
    \nThe term Object Serialization refers to the act of converting the object to\
    \ a byte stream. The byte stream can be stored on the file system, or can be sent\
    \ through a network.\n\nAt the later time the object can be re-created from that\
    \ of streams. The only requirement is that the same class must be available at\
    \ both times, when the object is serialized and also when the object is re-created.\
    \ If that happens in different servers, the same version of the class must be\
    \ available, otherwise the object won't be able to be re-created. That same class\
    \ must be available on all servers. Same class must be able to be re-created.\
    \ This is a maintenance problem to those applications where java serialization\
    \ is used to persist object or sent the object through the network.\n\nWhen a\
    \ class is modified, there could be a problem re-creating those objects that were\
    \ serialized using an earlier version of the class.\n\nJava has built in support\
    \ for serialization.\n\n## Interfaces\n\nJava does not allow you to create a subclass\
    \ from two classes. There is no multiple inheritance. The major benefit of that\
    \ is that all java objects can have a common ancestor. That called Object. All\
