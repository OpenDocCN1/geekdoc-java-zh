    \ the browser\n\nThe HTML output represents both the presentation logic and the\
    \ result of the business computations. This represents a huge problem, and there\
    \ is no real application relying on servlets to handle the presentation part of\
    \ the responsibility. There are two main solutions to this:"
  - '[PAGE 36]


    +   - Use a template (Store the presentation part in an HTML file, marking the
    areas that need to be replaced after business logic computations).

    - Use JSP (See next section)


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_36_0.png)


    Figure 4: JSP Execution


    # Java Server Pages (JSP) code


    (4) JSP is an HTML file with embedded Java code. The first time the JSP is accessed,
    the JSP is converted to a Java Servlet. This servlet outputs HTML which has inside
    result of the business logic computation. There are special JSP tags that help
    to add dynamic data to the HTML. Also JSP technology allows to create custom tags.


    Using the JSP technology correctly, business logic computations should not be
    in the embedded Java part of JSP. JSP should be used to render the presentation
    of the static and dynamic data. Depending on the complexity of the data, 100%
    separation is not easy to achieve. Using custom tags, however may help to get
    close to 100%. This is advocated in MVO architecture(see below).


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_36_1.png)


    Figure 5: EJB Execution


    # EJB code


    (5) In 1990s, with the client server computing, a trend started, that is to move
    away from Mainframe computing. That resulted many small separate application in
    a Company/Enterprise. Many times the same data were used in different applications.
    A new philosophy "Enterprise Computing" was created to address these issues. The
    idea is to create components that can be reused throughout the Enterprise. The
    Enterprise Java Beans (EJBs) were supposed to address this.


    An EJB is an application component that runs in an EJB container. The client access
    the EJB modules through the container, never directly. The container manage the
    life cycle of the EJB modules, and handles all the issues from network/enterprise
    computing. Some of those are security/access control, object pooling, transaction
    management, . . .'
