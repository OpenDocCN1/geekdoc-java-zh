  mdcn: "\n\n## 比较两个字符串：比较字符串并没有表面看起来那么简单。我们不能仅仅使用简单的等等语句，例如：\n\n```java\nif(myString\
    \ == \"Hello World!\") {\n    System.out.println(\"Match Found\");\n}\n```\n\n\
    相反，我们必须使用 java.String 类本身内置的方法，即 `compareTo()` 方法，我们可以在任何使用 String 类型的地方访问该方法。让我们来看一个例子：\n\
    \n```java\nString myString = \"Hello World!\";\nif(myString.compareTo(\"Hello\
    \ World!\") == 0) {\n    System.out.println(\"Match Found\");\n}\n```\n\n这段代码片段正在比较字符串变量\
    \ `myString` 和 \"Hello World\"。如果两个字符串完全匹配，`compareTo` 方法将返回 \"0\"，即两个字符串之间没有差异，并且语句体将执行。然而，如果\
    \ `myString` 有任何微小差别，我们将根据具体差异得到一个高于 0 或低于 0 的值。如果此字符串对象在字典顺序上大于参数字符串，则结果为负整数；如果此字符串对象在字典顺序上小于参数字符串，则结果为正整数。请参阅\
    \ Java API 了解更多详情。\n\n也可以使用 `equals()` 方法进行比较。\n\n```java\nString myString = \"\
