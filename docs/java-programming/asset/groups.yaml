    \ package for all the primitive types.\n\n| Size (bits) | Example | Minimum Value\
    \ | Maximum Value | Wrapper Objects |\n|---|---|---|---|---|---|\n| char | 16\
    \ | char c = 'A'; | Unicode 0 | Unicode 2¹⁶-1 | Character |\n| short | 16 | short\
    \ s = 65; | -2¹⁵ | 2¹⁵-1 | Short |\n| int | 32 | int i = 65; | -2³¹ | 2³¹-1 |\
