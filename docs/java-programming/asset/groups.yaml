    The List has the following implementations:


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_155_0.png)


    java.util.Vector<E>

    Synchronized, in multiple thread access, otherwise use ArrayList


    java.util.Stack<E>

    It extends class Vector with five operations that allow a vector to be treated
    as a stack. It represents a last-in-first-out (LIFO) stack of objects.


    java.util.ArrayList<E>

