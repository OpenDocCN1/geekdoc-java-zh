  - "[PAGE 16]\n\n# Java Programming Environment\n\nTo compile Java programs, you\
    \ will need to download and install the Java Development Kit (JDK). This is available\
    \ from Sun's website. Other hardware and operating system vendors also supply\
    \ Java Development Kits for their platforms, although they may change the name\
    \ of the kit. Sun produces JDKs for Windows, Linux, and Solaris.\n\nThere are\
    \ numerous environments you can use to develop your Java programs. You can choose\
    \ to write your programs in a text editor and then compile them using the command\
    \ line, or you can use an integrated development environment (IDE). IDEs like\
    \ NetBeans and Eclipse provide many useful functions such as syntax error checking,\
    \ code completion, automatic compilation and debugging, which you may find useful,\
    \ especially if this is your first foray into programming.\n\n# The Java Compiler\n\
    \nThe JDK consists of a set of tools necessary to construct Java programs. The\
    \ most notable tool in the JDK is the Java compiler, also known as javac.\n\n\
    javac compiles Java source files into executable Java class files. Source files\
    \ are files with a .java file extension. You can create such files with a text\
    \ editor, like Notepad, or an IDE. javac then compiles these files into loadable\
    \ and executable class files, using the .class extension. For example, if you\
    \ create a Java class org/yahoos/util/PrintDate.java\n\n```\npackage org.yahoos.util;\n\
    import java.util.Date;\npublic class PrintDate {\n    public void main(String[]\
    \ args) {\n        System.out.println(new Date());\n    }\n}\n```\n\nyou can compile\
    \ it by entering the following command in a shell:\n\nYou would normally invoke\
    \ this in a shell where working directory is the root directory containing all\
    \ of your source files resides. The Java package statement, package org.yahoos.util,\
    \ corresponds to the directory structure org/yahoos/util until see Java packages.\n\
    \njavac will create the PrintDate.class in the same directory where the source\
    \ file is located. If there are syntax errors, javac will print to the shell.\
    \ The PrintDate.class file contains the code that will run under whatever hardware\
    \ the Java runtime is installed. If the PrintDate.class file was created in Windows\
    \ operating system, you can copy this file to unix and it will be executed fine."
