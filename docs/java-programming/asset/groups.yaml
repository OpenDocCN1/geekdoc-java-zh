    The character types like **char**, and **byte** are used in file input output
    operations.


    Representing literal character strings, however, the *String* object is defined,
    in the `java.lang.*` package. The `java.lang.String` is not a primitive type,
    rather it is a special object built into the Java language. For further info:
    see *String*.


    # Data Conversion (Casting)


    Data conversion (casting) can happen between two primitive types. There are two
    kinds:


    +   * Implicit : casting operation is not required; no data precision is lost
    due to the conversion

    * Explicit : casting operation required; data precision may be lost due to the
    conversion


    Example for implicit casting:


    ```

    ```int i = 65;

    long l = i; // int is converted to long, casting is not needed```

    ```


    Example for explicit casting:


    ```

    ```long l = 6566661;

    int i = (int)l; // long is converted to int, casting is not needed```

    ```


    The following table shows the conversions between primitive types, it shows the
    casting for operation explicit conversions:


    | from char | from short | from int | from long | from float | from double | from
    byte | from boolean |

    | to char | - | (char) | (char) | (char) | (char) | (char) | | N/A |'
