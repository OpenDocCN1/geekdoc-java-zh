  - "[PAGE 61]\n\nfinal is a keyword.\n\nIt has more one meaning depending on whether\
    \ it used for a class, a method, or for a variable.\n\n+   - It is denoting a\
    \ variable that is to be constant. This is similar to const in other languages.\
    \ A variable declared with the final keyword cannot be modified by the program\
    \ after initialization. This is useful for universal constants, such as pi, or\
    \ other values that the programmer would like to keep constant throughout the\
    \ code.\n- It marks a method final, meaning that subclasses cannot override this\
    \ method. The compiler checks and gives an error if you try to override the method.\n\
    - It marks a class final, meaning that the class cannot be subclassed.\n\nFor\
    \ Example\n\n```\nfinal double PI = 3.1415926;\nfinal public void method() {\n\
    \    ...\n}\n\nfinal public void class MyClass {\n    ...\n}\n```\n\nNote that\
    \ final is always placed before the variable type.\n\n# Access Modifiers\n\nfinally\
    \ is a keyword.\n\nIt is an optional part of a try block. The code inside the\
    \ finally block will always be executed, even if there is an exception in the\
    \ try block.\n\nThree things can happen in a try block:\n\n+   - No exception\
    \ is thrown. In such case, the following are executed:\n  - code in the try block\n\
