    An other useful application could be to ''split'' the String text based on the
    ''new line'' character, so you could process the text line by line.


    # # Creating Substrings


    It may also be useful to create substrings, or strings using the order of letters
    from an existing string. This can be done in two methods.


    The first method involves creating a substring out of the characters of a string
    from a given index to the end.


    For example:


    ```

    String str = "coffee";

    String substr = str.substring(3);

    ```


    In this example, substr would return ''fee''. As previously discussed, the index
    of the first character in a string is 0. By counting from there, it is apparent
    that the character in index 3 is the second ''f'' in ''coffee''. This is known
    as the beginIndex. All characters from the beginIndex until the end of the string
    will copied into the new substring.


    The second method involves a user-defined startIndex and endIndex. For example:


    ```

    String str = "supporting";

    String substr = str.substring(3,7);

    ```


    The string returned by substr would be ''port''. Please note that the endIndex
    is not inclusive. This means the last character will be of index endIndex-1. In
    this example, every character from index 3 to 6, was copied into the substring.


    Note: "Substring" is considered to be one word. Why the method name does not seem
    to follow the common syntax of Java. It is easy to mistake the method substr()
    for subString() (which does not exist and would return with a syntax error on
    compilation). Just remember that this style only applies to methods or other elements
    that are made up of more than one word.'
