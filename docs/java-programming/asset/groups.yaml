    \ 可以匹配任何内容。Any-Type 也可以通过 `<? extends Object>` 来表示。Any-Type 包含了接口，而不仅仅是类。\n\n\
    现在我们可以定义一个元素类型匹配任何内容的集合。下文所示：\n\n```\nCollection<?> collUnk;\n```\n\n请注意，我们不能向此集合中添加任何内容。我们只能从中取出类型为\
    \ *Object* 的元素。那么，如果我们无法向所代表的集合中添加任何内容，这个变量的用途是什么？当你想要生成一个接受任何集合的泛型方法时，这种新方法的用途就会显而易见。\n\
    \n```java\npublic static void printElements(Collection<?> anyColl) {\n  Iterator<Object>\
    \ iter = coll.iterator();\n  while (iter.hasNext()) {\n    System.out.print( iter.next()\
    \ );\n  }\n}\n```\n\n针对特定类型类的通配符\n\n> \"?? extends ClassName\" 指定了可以使用的类类型的限制。\n\
    \n例如，要创建一个可能只包含 \"Serializable\"（可序列化）对象的集合，请指定：\n\n```java\nCollection<? extends\
    \ Serializable> serColl = new ArrayList<String>();\n```\n\n上述代码是有效的，因为 **String**\
    \ 类是可序列化的。使用不可序列化的类会导致编译错误。\n\n以下集合只能包含继承自 Animal 类的对象。\n\n```java\nclass Dog\
    \ extends Animal\n{\n}\n```\n\n```java\n// --- 创建“Animal 集合”变量 ---\nCollection<?\
    \ extends Animal> animalColl = new ArrayList<Dog>(){\n```\n\n## 类定义\n\n## 基础\n\
    \nJava 中的每个类都可以由以下元素组成：\n\n- **字段 (fields)**：字段持有每个对象特有的数据。例如，一个员工可能有一个 ID 号。（它有时也被称为成员变量）\n\
    - **成员方法 (member methods)**：成员方法对对象执行操作。例如，一个员工可能有一个方法来发放工资单或访问其姓名。\n- **静态字段\
    \ (static fields)**：静态字段对于同类的任何对象都是通用的。例如，Employee 类中的一个静态字段可以跟踪最后发放的 ID。\n- **静态方法\
    \ (static methods)**：静态方法是不影响特定对象的方法。\n- **其他类 (other classes)**：有时，如果一个类在类外部没有用处或不应该在类外部访问，那么将其包含在另一个类内部是有用的。\n\
    - **构造方法 (Constructors)**：用于生成新对象的特殊方法。\n- **泛型类型 (Parameterized types)**：自 1.5\
    \ 版本以来，“泛型类型”可以在定义定义分配给类。它们将在类实例化时被替换为类实例化时指定的类型。这是由编译器完成的。它类似于 C 语言中的宏 #define，其中预处理器会评估这些宏。\n\
    \n```java\npublic class Employee // 这定义了 Employee 类。\n{\n    // public 修饰符表示\n\
    \    // 它可以被任何其他类访问\n    private static int nextID; // 定义将存储的数据\n    private String\
    \ name; // 属于每个 Employee。\n\n    public Employee(String name) // 构造方法\n    {\n\
    \        name = name;\n        nextID = nextID; // 自动分配 ID\n        nextID++;\
    \ // 增加 ID 计数\n    }\n\n    public String getName()\n    {\n        return name;\n\
    \    }\n\n    public int getID()\n    {\n        return nextID;\n    }\n\n   \
    \ public static int getNextID()\n    {\n        return nextID;\n    }\n}\n}\n\
    ```\n\n```java\nSystem.out.println(Employee.getNextID());\nEmployee a = new Employee(\"\
    John Doe\");\nEmployee b = new Employee(\"Jane Smith\");\nEmployee c = new Employee(\"\
    Sally Brown\");\nSystem.out.println(Employee.getNextID());\nSystem.out.println(a.getID()\
    \ + \" \" + a.getName());\nSystem.out.println(b.getID() + \" \" + b.getName());\n\
    System.out.println(c.getID() + \" \" + c.getName());\n```\n\n将产生此输出：\n\n- 0: John\
    \ Doe\n- 1: Jane Smith\n- 2: Sally Brown\n\n## 通用概念\n\n## 抽象\n\nJava 中的每个类都可以由以下元素组成。实体由世界定义。\n\
    \n```java\nclass Animal\n{\n    public Animal()\n    {\n    }\n}\n```\n\n| Java\
    \ | 索引 |\n| :--- | :--- |\n| 概述 | 基础 |\n| 入门 | 类 |\n| 集合 | 编程 |\n| 异常 | 反射 |\n\
    | JavaBeans | 并发 |\n\n## 创建对象\n\n## 简介\n\nJava 中的每个类都可以由以下元素组成。实体由世界定义。\n\n```java\n\
    class Animal\n{\n    public Animal()\n    {\n    }\n}\n```\n\nJava 中的每个类都可以由以下元素组成。实体由世界定义。\n\
    \n```java\nclass Animal\n{\n    public Animal()\n    {\n    }\n}\n```\n\nJava\
    \ 中的每个类都可以由以下元素组成。实体由世界定义。\n\n```java\nclass Animal\n{\n    public Animal()\n\
    \    {\n    }\n}\n```\n\nJava 中的每个类都可以由以下元素组成。实体由世界定义。\n\n```java\nclass Animal\n\
    {\n    public Animal()\n    {\n    }\n}\n```\n\nJava 中的每个类都可以由以下元素组成。实体由世界定义。\n\
    \n```java\nclass Animal\n{\n    public Animal()\n    {\n    }\n}\n```\n\nJava\
    \ 中的每个类都可以由以下元素组成。实体由世界定义。\n\n```java\nclass Animal\n{\n    public Animal()\n\
    \    {\n    }\n}\n```\n\n## 使用 new 关键字创建对象\n\n以下 Java 代码：\n\n```java\n// 第一次创建\
    \ MyObject\nEmployee a = new Employee(\"John Doe\");\n```\n\n以下代码：\n\nJava 中的每个类都可以由以下元素组成。实体由世界定义。\n\
    \n```java\nclass Animal\n{\n    public Animal()\n    {\n}\n```\n\n## 通过克隆创建对象\n\
    \n克隆并不是自动可用的。不过有一些帮助，所有的 Java 对象都继承了受保护的 `clone()` 方法。该方法会分配内存并按位复制对象的状态。\n\n\
    你可能会问为什么我们需要这个 clone 方法。难道我不能创建一个构造方法并传入同一个对象，然后通过变量进行复制吗？让我们来看看：\n\n```java\n\
    public class MyObject {\n    private memberVar;\n    ...\n    MyObject(MyObject\
    \ obj) {\n        this.memberVar = obj.getMemberVar();\n    }\n    ...\n}\n```\n\
    \n上述代码存在两个问题：\n\n- 第一，私有变量无法直接赋值。为了做到这一点，你需要 setter 和 getter 方法，这需要额外的代码。\n- 第二，更重要的是性能问题。`clone()`\
    \ 方法通过一次操作复制整个对象的内存。这比使用 new 关键字要快得多。\n\n使用 new 关键字创建对象是有开销的，因此如果你需要创建许多相同类型的对象，先创建一个并从它克隆新对象，性能会更好。下文所示了一个使用克隆返回新对象的工厂方法。\n\
    \n```java\nHashTable _cacheTemplate = new HashTable;\n...\n/** 为了性能考虑而克隆 Customer\
    \ 对象 */\npublic Customer createCustomerObject() {\n}\n```\n\n"
