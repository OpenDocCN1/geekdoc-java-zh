    \n## 条件分支语句\n\n条件分支通过 `if...else` 和 `switch` 语句来实现。只有当特定条件的求值为真（true）时，才会发生条件分支。\n\
    \n## 条件语句\n\n条件语句也称为 `if` 语句，它们允许程序执行一个测试，然后根据测试结果采取行动。\n\n`if` 语句的形式如下：\n\n```\n\
    if (condition) {\n  // 如果条件为真，在此处执行语句\nelse {\n  // 如果条件为假，在此处执行语句\n}\n```\n\n\
    条件是一个布尔表达式，为真也可以为假。执行的操作将取决于条件的值。\n\n示例：\n\n```\nif (i > 0) {\n  System.out.println(\"\
    Value stored in i is greater than zero\")\n}\nelse {\n  System.out.println(\"\
    Value stored is not greater than zero\")\n}\n```\n\n使用 `else if` 语句可以使 `if` 语句变得更加复杂\n\
    \n```\nif (condition 1) {\n  // 如果 condition 1 为真，在此处执行语句\n}\nelse if (condition\
    \ 2) {\n// 如果 condition 1 为假且 condition 2 为真，在此处执行语句\n}\nelse {\n    // 如果 condition\
    \ 1 和 condition 2 均为假，在此处执行语句\n}\n```\n\n示例：\n\n```\nif (i > 0) {\n    System.out.println(\"\
    Value stored in i is greater than zero\");\n} else if (i < 0) {\n    System.out.println(\"\
    Value stored in i is less than zero\");\n} else {\n    System.out.println(\"Value\
    \ stored in i is equal to zero\");\n}\n```\n\n如果条件后只有一个要执行的语句（如上面的示例所示），可以省略大括号，但\
    \ Sun 的 Java 代码规范（Java Code Conventions）明确规定应始终使用大括号。\n\n`if` 语句不涉及循环，因此一旦条件被求值，程序将继续执行语句后的下一条指令。\n\
    \n## if...else 语句\n\n`if ...else` 语句用于根据布尔条件的结果有条件地执行两个语句块中的其中一个。\n\n示例：\n\n```\n\
    if (list == null) {\n    // 如果条件为真，执行此块的语句\n} else {\n    // 如果条件为假，执行此块的语句\n\
    }\n```\n\nSun 的 Java 代码规范明确规定应始终使用大括号。\n\n`if` 语句有两种形式：\n\n```\nif (boolean-condition)\n\
    statement;\n```\n\n以及\n\n\n\n```\nif (boolean-condition)\n    statement;\nelse\n\
    \    statement;\n```\n\n如果你需要在 `boolean-condition` 为真或为假时执行不同的语句，请使用第二种形式。如果你只想在条件为真时执行\
    \ `statement`，且不想在条件为假时不执行备选语句，请使用第一种形式。\n\n以下示例调用了两个 `int` 方法 `f()` 和 `f()`，存储结果，然后使用\
    \ `if` 语句测试 `x` 是否小于 `y`，如果是，则通过语句体交换值。最终结果是 `x` 始终包含较大的结果，`y` 始终包含较小的结果。\n\n\
    ```\nint x = f();\nint y = f();\nif (x < y) {\n    int t = x;\n    x = y;\n  \
    \  y = t;\n}\n```\n\n`if...else` 语句还允许另一个语句 `else if`。该语句用于为条件提供另一个 `if` 语句，只有当其他条件为假时才能执行它。例如：\n\
    \n```\nif (x == 2)\n    x = 4;\nelse if (x == 3)\n    x = 6;\nelse\n    x = -1;\n\
    ```\n\n在这种情况下，`else` 语句非常用，因为其中一个条件为真，另一个将不会执行。例如，如果第一个条件 `if (x == 2)` 中包含的语句改为\
    \ `x = 3;`，第二个条件 `else if` 仍然不会执行。然而，在条件语句中处理基本类型时，使用 `switch` 语句比使用多个 `if` 语句更理想。\n\
    \n## switch 语句\n\n`switch` 条件语句基本上是编写多个 `if...else` 语句的简写版本。`switch` 语句的语法如下：\n\
    \n```\nswitch(<variable>) {\n  case <result>: <statements>; break;\n  case <result>:\
    \ <statements>; break;\n  default: <statements>; break;\n}\n```\n\n这意味着如果变量包含\
    \ `case` 结果之一，则将执行该 `case` 之后直到 `break` 之前的语句。如果其他情况都不真，则执行 `default` 情况。注意：可以通过\
    \ `switch` 语句分析的类型只有 `char`、`byte`、`short` 或 `int` 基本类型。这意味着 `String` 变量无法通过 `switch`\
    \ 语句进行分析。\n\n```\nint n = 2, x;\nswitch(n) {\n  case 1: x = 2; break;\n  case\
    \ 2: x = 4; break;\n  case 3: x = 6; break;\n  case 4: x = 8; break;\n}\nreturn\
    \ x;\n```\n\n在此示例中，由于 `n` 等于 2，将执行该语句\n\n## 迭代语句\n\n迭代语句用于遍历一个块。Java 提供了四种循环语句：\n\
    \n- `while` 循环\n- `do...while` 循环\n- `for` 循环\n- `foreach` 循环\n\n## while 循环\n\
    \n`while` 循环在条件为真时迭代代码块。该循环的语法为：\n\n```\nwhile(condition) {\n  statement;\n}\n\
    ```\n\n这里条件是一个求值为真或假的布尔表达式。只要条件为真，循环就会反复迭代。一旦条件求值为假，循环退出到下一个语句。\n\n## do-while\
    \ 循环\n\n`do-while` 循环功能上与 `while` 循环相似，但在语句之后求值条件\n\n```\ndo {\n  statement;\n\
    } while (condition);\n```\n\n## for 循环\n\n`for` 循环是一种设计用于方便遍历序列的特殊循环，示例：\n\n```\n\
    for(int i = 0; i < 100; i++) {\n  System.out.println(i + \"\\t\" + i * i);\n}\n\
    ```\n\n编译并运行上面的语句，程序将打印 0 到 99 的数字及其平方：\n\n| 0 | 0 |\n| 1 | 1 |\n| 2 | 4 |\n|\
    \ 3 | 9 |\n| ... | ... |\n| 99 | 9801 |\n\n相同的语句使用 `while` 循环：\n\n```\nint i =\
    \ 0;\nwhile (i < 100) {\n  System.out.println(i + \"\\t\" + i * i);\n  i++;\n\
    }\n```\n\n## foreach 循环\n\n`foreach` 语句允许遍历集合中的所有项，依次检查每个项并保留其类型。`foreach` 语句的语法为：\n\
    \n```\nfor(type item : collection) statement;\n```\n\n例如，我们将取一个表示一周的 String 数组并遍历集合，逐一检查项。\n\
    \n```\nString[] days = {\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\",\
    \ \"Friday\", \"Saturday\", \"Sunday\"};\nfor(String day : days) {\n    System.out.println(day);\n\
    }\n```\n\n此程序的输出将为：\n\n```\nMonday\nTuesday\nWednesday\nThursday\nFriday\nSaturday\n\
    Sunday\n```\n\n注意，当集合中的最后一个项在语句块中检查完毕，循环会自动退出。\n\n## continue 和 break 语句\n\n有时，你希望在不执行循环内剩余语句的情况下重新迭代循环。`continue`\
    \ 语句导致循环重新迭代并从循环内部顶层语句重新开始。\n\n在可以迭代循环的地方，也有在需要时退出循环的能力。在任何时刻，如果你想退出循环并结束循环内的后续工作，应该使用\
    \ `break` 语句。\n\n此外，`continue` 和 `break` 语句可以像下面配合标签使用：\n\n"
