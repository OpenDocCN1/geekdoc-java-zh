    \ So before adding the object, we clone them, so if the original object changes\
    \ from that point forward, the object won't. Also lets say the Customer object\
    \ has a reference to an Activity object that contains the customer activities.\
    \ We are now facing a problem, it is not enough to clone the Customer object,\
