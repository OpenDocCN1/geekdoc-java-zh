  - '[PAGE 11]


    +   * Introduction of the JIT-Just in compilers


    1.3, The language as such has been stable since JDK 1.0; the class libraries that
    come with the JDK got larger and have changed in some parts. Extensions and architectures
    closely tied to the Java programming language include: J2EE, J2ME, JNDI, JSML,
    JDBC, JAIN, JDBCK, Jini,jytry Jiro, JXTA, JavaSpaces, JMI.


    1.5 (codename Tiger) was released in september 2004.


    # Major changes includes:


    +   * Generics - Provides compile-time type safety for collections :and eliminates
    the drudgery of casting.

    * Autoboxing/unboxing - Eliminates the drudgery of manual conversion between primitive
    types (such as int) and wrapper types (such as Integer).

    * Enhanced for - Shorten the for loop with Collections use.

    * Static imports - Lets you import all the static part of a class.

    * Metadata - Lets you avoid boilerplate code, by enabling tools to generate it
    from annotations the source code. This leads to a “declarative” programming style
    where the programmer says what should be done and tools emit the code to do it.

    * JVM Improvements - Most of the run time library is now mapped into memory as
    a memory image, as opposed to being loaded from a series of class files. Large
    portion of the runtime libraries will now be shared among multiple JVM instances.


    (from)'
