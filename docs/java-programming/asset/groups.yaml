- md: "\n```\nInside main method. Invoking aMethod\nInside aMethod\nback in main method\n\
    ```\n\nThe program flow begins in the main method. Just as aMethod is invoked,\
    \ the flow travels to the called method. At this very point, the flow branches\
    \ to the other method. Once the method is completed, the flow is returned to the\
    \ point it left off and resumes at the next statement after the call to the method.\n\
    \n## Conditional Branching Statements\n\nConditional branching is attained with\
    \ the help of the if...else and switch statements. A conditional branch occurs\
    \ only if a certain condition evaluates to true.\n\n## Conditional Statements\n\
    \nAlso referred to as if statements, these allow a program to perform a test and\
    \ then take action based on the result of that test.\n\nThe form of the if statement:\n\
    \n```\nif (condition) {\n  do statements here if condition is true\nelse {\n \
    \ do statements here if condition is false\n}\n```\n\nThe condition is a boolean\
    \ expression which can be either true or false. The actions performed will depend\
    \ on the value of the condition.\n\nExample:\n\n```\nif (i > 0) {\n  System.out.println(\"\
    Value stored in i is greater than zero\")\n}\nelse {\n  System.out.println(\"\
    Value stored is not greater than zero\")\n}\n```\n\nIf statements can also be\
    \ made more complex using the else if statement\n\n```\nif (condition 1) {\n \
    \ do statements here if condition 1 is true\n}\nelse if (condition 2) {\ndo statements\
    \ here if condition 1 is false and condition 2 is true\n}\nelse {\n    do statements\
    \ here if neither condition 1 nor condition 2 is true\n}\n```\n\nExample:\n\n\
    ```\nif (i > 0) {\n    System.out.println(\"Value stored in i is greater than\
    \ zero\");\n} else if (i < 0) {\n    System.out.println(\"Value stored in i is\
    \ less than zero\");\n} else {\n    System.out.println(\"Value stored in i is\
    \ equal to zero\");\n}\n```\n\nIf there is only one statement to be executed after\
