    \ {\n    // this block of statements executes if the condition is true\n} else\
    \ {\n    // this block of statements executes if the condition is false\n}\n```\n\
    \nSun’s Java Code Conventions explicitly state that the braces should always be\
    \ used.\n\nAn if statement has two forms:\n\n```\nif (boolean-condition)\nstatement;\n\
    ```\n\nand\n\n```\nif (boolean-condition)\n    statement;\nelse\n    statement;\n\
    ```\n\nUse the second form if you have different statements to execute if the\
