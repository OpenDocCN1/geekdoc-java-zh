    ## Scope


    Variables only exist within the structure in which they are defined. For example,
    if a variable [is] created within a method, it cannot be accessed outside the
    method. In addition, a different method can create a variable of the same name
    which will will not conflict with the other variable.


    ## Generics


    Generics were added to the Java language syntax in version 1.5. This means that
    code using Generics will not compile with Java 1.4 and less.


    Java was long criticized for the need to explicitly type-cast an element when
    it was taken out of a “container/collection” class. There was no way to enforce
    that a “collection” class contains only one type of object. This is now possible
    since Java 1.5.


    In the first couple of years of Java evolution, Java did not have a real competitor.
    This has changed by the appearance of Microsoft C#. With Generics, Java is better
    suited to compete against C#. Similar constructs to Java Generics exist in other
    languages, see w:Generic programming for more information.


    ## What are Generics?


    I don’t know why they named this feature Generics. A better name would be type
    parameter argument. Because, it is basically that, to pass a Type as a parameter
    to a class at creation time.


    When an object is created, parameters can be passed to the created object, through
    the constructor. Now with Generics, we can also pass in Types. The type-holders
    will be replaced with the specified type, before the object is created.


    Type parameter arguments can be set:


    for a class


    - * When an object is created from that class the type-parameter-argument will
    be replaced with the actual Type.


    ```java

    public class Person<T>

    {

    ```


    ```java

    private Person<T> person;

    ```


    ```java

    // --- Create an Employee person ---

    Person<Employee> emplPerson = new Person<Employee>();


    // -- Create a Customer person ---

    Person<Customer> custPerson = new Person<Customer>();

    ```


    for a method

    Just like class declarations, method declarations can be generic—that is, parameterized
    by one or more parameters.


    ```java

    static public <T> assign(Person<T> person, T obj)

    person.setPerson(obj);

    ```


    use of "T" is optional

    Use of a parameter type is optional. If that is not specified T will be substituted
    with the Java Object class, and there will be no Generic Rule checks.


    # Introduction


    Java is a "strongly" typed language. That''s why it is so easy to use. Many potential
    problems can be caught by the compiler. One area where Java was criticized was
    regarding the "Container/Collection" objects. Container objects are objects that
    contain other objects. Before Generics were introduced there was no way to ensure
    that a container object contains only one type of objects. When an object was
    added to a container, it was automatically cast to Java Object. When it was taken
    out an explicit cast was needed. Normally an explicit cast is checked by the compiler.


    ```java

    String s = "This is a String";

    Integer integer = (Integer) s; // --- Compilation Error

    ```


    But in the case of container classes, the compiler was not able to catch an invalid
    type casting.


    ```java

    1 Collection collString = new ArrayList();

    2 collString.add("This is a String");

    3 Integer integer = (Integer) collString.get(0); // --- No Compilation Error;
    Runtime

    CastException

    ```


    Just looking at line 3, we do not know what type of objects collString contains.
    If that contains Integers then the code is fine.


    The above code using Generic:


    ```java

    Collection<String> collString = new ArrayList<String>();

    collString.add("This is a String");

    ...

    Integer Integer = (Integer) collString.get(0); // --- Compilation Error

    ```


    collString is a container object, that can only contain String objects, nothing
    else so when we get out an element it can be cast only to class that normally
    a String can be cast.


    With Generics, java strict type checking can be extended to container objects.
    With Generic container classes, gives an impression that a new type is created,
    with each different type parameter. Before Generics:


    ```java

    Collection collCustomer = new ArrayList();

    collCustomer.add(new Customer());

    ...

    Collection collObject = collCustomer; // --- No problem, both collObject and collCustomer
    have the same type

    ```


    With generics:


    ```java

    Collection<Customer> collCustomer = new ArrayList<Customer>();

    collCustomer.add(new Customer());

    ...

    Collection<Object> collObject = collCustomer; // --- Compilation Error

    ```


    Both collObject and collCustomer have the same type, BUT it is against the Generic
    rule, that is collCustomer can contain only Customer objects, and collObject can
    contain only Object object. So there is an additional check to the normal type
    checking, the type of the parameter has to be matched too.


