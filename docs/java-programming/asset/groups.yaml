- md: "\napplication should not try to catch. Most such errors are abnormal conditions.\n\
    \njava.lang.Exception\nThe class Exception and its subclasses are a form of Throwable\
    \ that indicates conditions that a reasonable application might want to catch.\
    \ Also this is the class that a programmer may want to extend when adding business\
    \ exceptions.\n\njava.lang.RuntimeException\nRuntimeException is the superclass\
    \ of exceptions that can be thrown during the normal operation of the Java Virtual\
    \ Machine. A method is not required to declare in its throws clause any subclasses\
    \ of RuntimeException that be thrown during the execution of the method but not\
    \ caught.\n\njava.lang.NullPointerException\nThrown when an application attempts\
    \ to use null in a case where an object is required.\n\n| Java Programming | |\
    \ Index |\n|---|---|---|\n| Overview | Getting Started | |\n| Fundamentals | |\
    \ Classes and Objects | |\n\n- Collections\n- Exceptions\n- Concurrent Programming\n\
    - Reflection\n- Applets\n- JavaBeans\n- Libraries\n\nThis page describes some\
    \ techniques for preventing NullPointerException. It does not describe general\
    \ techniques for how you should program Java. It is of some use, that to make\
    \ you aware of null values, and you need to be more careful about generating them\
    \ yourself. Note that this list is not complete - there are no rules for preventing\
    \ NullPointerException entirely in Java, because the standard libraries have to\
    \ be trusted during the used, and they can cause NullPointerExceptions. Also,\
    \ it is possible to observe an uninitialised final field in Java, so you can't\
    \ treat a final field as completely trusted during the object's creation. A good\
    \ approach is to learn how to deal with NullPointerExceptions first, and become\
    \ competent with that. These suggestions will help you to cause less NullPointerExceptions,\
    \ but they don't replace the need to know about NullPointerExceptions.\n\n## Minimize\
    \ the use the keyword 'null' in assignment statements\n\nThis means not doing\
    \ things like:\n\n```java\nString s=null;\nwhile (something) {\n  if (something2)\
    \ {\n    s=\"yep\";\n    if (!s=null) {\n      something3(s);\n    }\n  }\n}\n\
    ```\n\nYou can replace this with:\n\n```java\nboolean done=false;\nwhile (!done\
    \ && something) {\n  if (something2) {\n    done=true;\n    something3(\"yep\"\
    );\n  }\n}\n```\n\nYou might also consider replacing null with \"\" in the first\
    \ example, but default values bring bugs caused by default values being left in\
    \ place. A NullPointerException is actually better, as it allows the runtime to\
    \ tell you about the bug, rather than just continue with a default value.\n\n\
    ## Minimize the use of the new Type[int] syntax for creating arrays of objects\n\
    \nAn array created using new Object[10] has 10 null pointers. That's 10 more than\
    \ we want, so use collections instead, or explicitly fill the array at initialisation\
    \ with:\n\n```java\nObject[] objects=(\"blah\",5,new File(\"/usr/bin\");\n```\n\
    \nor:\n\n```java\nObject[] objects;\nobjects=new Object[](\"blah\"\n```\n\n##\
    \ Check all references obtained from ‘untrusted’ methods\n\nMany methods that\
    \ can return a reference return a null reference. Make sure you check these. For\
    \ example:\n\n```java\nFile file=new File(\"/etc\");\nFile[] files=file.listFiles();\n\
    if (files==null)\n{\n  tstuff\n}\n```\n\nFile.listFiles() can return null if \"\
    /etc\" is not a directory.\n\nYou can decide to trust some methods not to return\
    \ null, if you like, but that's an assumption you're making. Some methods that\
    \ don't specify that they might return null, actually do, instead of throwing\
    \ an exception.\n"
  mdcn: "\n\n应用程序不应尝试捕获。大多数此类错误都是异常情况。\n\njava.lang.Exception\n`Exception` 类及其子类是\
    \ `Throwable` 的一种形式，表示合理的应用程序可能想要捕获的情况。此外，当程序员在添加业务异常时，可能想要扩展此类。\n\njava.lang.RuntimeException\n\
    `RuntimeException` 是 Java 虚拟机在正常运行期间可能抛出的异常的父类。方法不需要在其 `throws` 子句中声明任何在方法执行期间抛出但未被捕获的\
    \ `RuntimeException` 子类。\n\njava.lang.NullPointerException\n当应用程序尝试在需要对象的情况下使用\
    \ `null` 时抛出此异常。\n\n| Java 编程 | | 索引 |\n|---|---|---|\n| 概述 | 入门指南 | |\n| 基础 |\
    \ | 类与对象 |\n\n- 集合 (Collections)\n- 异常 (Exceptions)\n- 并发编程 (Concurrent Programming)\n\
    - 反射 (Reflection)\n- 小程序 (Applets)\n- JavaBeans\n- 库 (Libraries)\n\n本页描述了一些防止\
    \ `NullPointerException` 的技术。它并没有描述关于你应该如何编写 Java 程序的通用技术。它的作用在于让你意识到 `null` 值的存在，并且你自己在生成这些值时需要更加小心。注意，此列表并不完整——在\
    \ Java 中没有完全防止 `NullPointerException` 的规则，因为在在使用过程中必须信任标准库，而它们可能会导致 `NullPointerException`。此外，在\
    \ Java 中可以观察到未初始化的 `final` 字段，因此你不能在对象创建期间将 `final` 字段视为完全可信。一种很好的方法是先学习如何处理 `NullPointerException`，并熟练掌握它。这些建议将帮助你减少\
    \ `NullPointerException` 的发生，但它们不能替代对 `NullPointerException` 的了解。\n\n## 在赋值语句中尽量减少关键字\
    \ 'null'的使用\n\n这意味着不要执行如下操作：\n\n```java\nString s=null;\nwhile (something) {\n\
    \  if (something2) {\n    s=\"yep\";\n    if (!s=null) {\n      something3(s);\n\
    \    }\n  }\n}\n```\n\n你可以将其替换为：\n\n```java\nboolean done=false;\nwhile (!done\
    \ && something) {\n  if (something2) {\n    done=true;\n    something3(\"yep\"\
    );\n  }\n}\n```\n\n你也可以考虑在第一个示例中将 `null` 替换为 `\"\"`，但默认值会由于默认值遗留而带来 bug。`NullPointerException`\
    \ 实际上更好，因为它允许运行时告诉你 bug 信息，而不是仅仅使用默认值继续执行。\n\n## 尽量减少使用 new Type[int] 语法创建对象数组\n\
    \n使用 `new Object[10]` 创建的数组有 10 个 `null` 指针。这比我们想要的多了 10 个，因此请使用集合，或者在初始化时显式地填充数组：\n\
    \n```java\nObject[] objects=(\"blah\",5,new File(\"/usr/bin\");\n```\n\n或者：\n\n\
    ```java\nObject[] objects;\nobjects=new Object[](\"blah\"\n```\n\n## 检查从“不可信”方法获取的所有引用\n\
    \n许多可以返回引用的方法会返回空引用。确保你检查了这些引用。例如：\n\n```java\nFile file=new File(\"/etc\");\n\
    File[] files=file.listFiles();\nif (files==null)\n{\n  tstuff\n}\n```\n\n如果 \"\
    /etc\" 不是目录，`File.listFiles()` 可能会返回 `null`。\n\n如果你愿意，可以信任某些方法不会返回 `null`，但这是你做出的一种假设。某些没有指定可能返回\
    \ `null` 的方法实际上确实返回了它，而不是抛出异常。\n\n"
