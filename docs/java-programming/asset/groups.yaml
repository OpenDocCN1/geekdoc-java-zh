    \ |\n| Overview | Getting Started | Fundamentals | Classes and Objects |\n| Collections\
    \ | Exceptions | Concurrent Programming | Reflection |\n| Applets | JavaBeans\
    \ | Libraries |\n\n# Compilation\n\nWe have already discussed compilation basics.\
    \ Here's a recap of the concepts we've seen earlier and some additional details.\
    \ \n\n## Compiling to bytecode\n\nIn Java, programs are not compiled into executable\
    \ files; they are compiled into Bytecode (as discussed earlier), which the JVM\
    \ executes at runtime. Java source code is compiled into bytecode when we use\
    \ the javac compiler. The bytecode is saved on the disk with the extension .class.\
    \ When the program is to be run, the bytecode is converted by the Just-In-Time\
    \ (JIT) compiler. The result is machine code which is fed to the memory and is\
    \ executed.\n\nSo Java has two step compilation:\n\n- Step one to create byte-code\n\
    - Step two to create machine level code\n\nThe Java classes/Byte Codes are compiled\
    \ into machine code and loaded into memory by the JVM when needed the first time.\
    \ This is different from other languages like C/C++ where the whole program had\
    \ to be compiled to machine code and linked to create an executable, before the\
    \ program could start.\n\nJIT compilers compile byte-code once and the compiled\
    \ machine code are re-used again and again, to speed up executions. A better name\
    \ for JIT would be \"Compile only once\" compilers, COO, or \"Just-one-time\"\
    \ compilers, JOT. Early Java compilers compiled the byte-code to machine code\
    \ each time it was used, that was slow. It is still faster than an \"interpreter-language\"\
    , where code is compiled from high level language, not from byte-code each time\
    \ it was used.\n\n# Automatic Compilation of Dependent Classes\n\nIn Java, if\
    \ you have used any reference to any other object, the class for that object will\
    \ be automatically compiled, if it was not compiled already. These automatic compilations\
    \ are nested, and this continues until all classes are compiled that are needed\
    \ to run the program. So it is enough to compile only the high level class, all\
    \ the dependent classes will be automatically compiled.\n\n```\njavac ... MainClass.java\n\
    ```\n\nYou can't rely on this feature if your program is using reflection to create\
    \ objects, you are compiling for servlets or for a \"jar\" package. In these cases\
    \ you should list these classes for explicit compilation.\n\n```\njavac ... MainClass.java,\
    \ ServletOne.java, ...\n```\n\nThe best way is to use a build tool to build your\
    \ application. The build tool would check all the needed dependencies and compile\
    \ only the needed class for the build. The Ant tool is the best and the most popular\
    \ build tool currently available. Using Ant you would build your application from\
    \ the command line by typing:\n\n```\nant build.xml\n```\n\nThe xml file contains\
    \ all the information needed to build the application.\n\nThe most popular way\
    \ to build applications is using an IDE. IDE stands for Integrated Development\
    \ Environment. Some of them are listed below.\n\n# Packages and Subdirectories\n\
    \nEach java level class belongs to a package (covered in the chapter about Packages).\
    \ This may be declared in a package statement at the beginning of the file; if\
    \ that is missing, the class belongs to the unnamed package.\n\nFor compilation,\
    \ the file must be in the right directory structure. A file containing a class\
    \ in the unnamed package must be in the current-root directory; if the class belongs\
    \ to a package, it must be in a directory with the same name as the package.\n\
    \nThe convention is that package names and directory names corresponding to the\
    \ package consist of only lower case letters.\n\n# Examples\n\n## Top level package\n\
    \nA class with this package declaration\n\n```\npackage example;\n```\n\nhas to\
    \ be in a directory named\n\n## Subpackages\n\nA class with this package declaration\n\
    \n```\npackage org.yahoos.en;\n```\n\nhas to be in a directory named\n\n```\n\
    en\n```\n\nwhich has to be a sub-directory of\n\n```\nyahoos\n```\n\nwhich in\
    \ turn has to be a sub-directory of\n\n```\norg\n```\n\nresulting in\n\n```\n\
    org/yahoos/en/\n```\n\n## Filename Case\n\nThe Java source file name must be the\
    \ same as the public class name that the file contains. There can be only one\
    \ public class defined per file. The Java class name is case sensitive, as is\
    \ the source file name.\n\nThe naming convention for the class name is for it\
    \ to start with a capital letter.\n\n# Compiler Options\n\nDebugging and Symbolic\
    \ Information\n\n# Additional Tools\n\n## IDEs\n\nThis section contains a little\
    \ about the different IDEs available and their strengths and weaknesses.\n\n##\
    \ JBuilder\n\nJBuilder is an IDE with proprietary source code, sold by Borland.\
    \ One of the advantages is integration with together, a modelling tool.\n\n##\
    \ JCreator\n\nThere's info at: http://www.apcomputerscience.com/ide/jcreator/index.htm\n\
    \n## Eclipse\n\nEclipse is a free IDE, plus a developer framework that can be\
    \ extended for a particular development need. IBM was behind this free software\
    \ development and it replaced IBM Visual Age tool. The idea was to create a standard\
    \ look and feel that can be extended. The extensibility distinguishes Eclipse\
    \ from any other IDE tools. Eclipse also meant to compete with Microsoft Visual\
    \ Studio tools. The goal for Eclipse is twofold:\n\n- Give a standard IDE for\
    \ developing code\n- Give a starting point and same look and feel for all\n\n\
    Eclipse features:\n\n- Standard window management (perspectives, views, explorers)\n\
    - Immediate error checking (error indications)\n- Help window\n- Automatic build\
    \ (changed source code)\n- Built-in debugger\n- Source code generation (getters\
    \ and setters)\n- Searches (for implementation)\n- Code refactoring (global reference\
    \ update)\n- Plug-in based architecture (able to build tools that integrate seamlessly\
    \ with the environment and other tools)\n\n## NetBeans\n\nNetBeans IDE is a free,\
    \ open-source Integrated Development Environment for software developers. The\
    \ IDE runs on many platforms including Windows, Linux, Solaris and MacOS. It is\
    \ easy to install and use out of the box. The NetBeans IDE provides developers\
    \ with all the tools they need to create professional cross-platform desktop,\
    \ enterprise, web and mobile applications.\n\n## BlueJ\n\nBlueJ is an IDE that\
    \ includes templates and will compile and run the applications for you. BlueJ\
    \ is often used by classes because it is not necessary to set classpaths. BlueJ\
    \ has own sets of libraries and you can add any one under preferences. Sets the\
    \ classpath for all compilations that come out of it to include those you have\
    \ added and the BlueJ libraries.\n\nBlueJ offers an interesting GUI for creation\
    \ of packages and programs. Classes are represented as boxes with arrows between\
    \ them to represent inheritance/implementation or if one is constructed in another.\
    \ BlueJ adds all classes (the project) into the classpath at compile time.\n\n\
    Blue Homesite\n\n## Kawa\n\nKawa was developed by Tek-Tools. It is basically a\
    \ Java editor, It does not include wizards and GUI tools, best suited to experienced\
    \ Java programmers in small and midsized development teams.\n\n## Ant\n\nAnt is\
    \ a build management tool designed to replace MAKE as the tool for automated builds\
    \ of large Java applications. Like Java, and unlike MAKE, Ant is designed to be\
    \ platform independent.\n\nBuilding a Java application requires certain tasks\
    \ to be performed. These tasks may include not only to compile the code, but also\
    \ to copy code, to package the code to Jar, to create EJBs, to run automated tests,\
    \ to ftp the code to remote site, and so on. For some tasks a condition can be\
    \ assigned, for example a compile only changed code, or do the task if that was\
    \ not already done.\n"
