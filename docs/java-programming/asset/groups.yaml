  mdcn: "\nEJB 面临着与其他任何重用代码相同的问题。EJB 需要具有足够的通用性才能被重用。它们的更改和维护可能会影响现有客户端。很多时候，EJB 在并不真正需要的情况下被过度使用。一个\
    \ EJB 应该被设计成企业中一个独立的应用程序，实现一个功能。\n\n![](img/4e89b81da69e356cec19bc7ce6e739a0_37_0.png)\n\
    \n图 6：MVC 执行\n\n组合 J2EE 组件创建 MVC 架构\n这引导我们进入（图 6）所示的三层/分层。\n\n在现代 Web 应用中，由于大量的静态数据和精美的图形，数据如何呈现给用户变得非常重要，通常需要图形设计师的帮助。\n\
    \n为了帮助程序员和图形设计师共同工作，数据与呈现方式之间的分离至关重要。\n\n- 视图（用户界面逻辑）包含了构建呈现层所需的逻辑。这可以通过 JSP 技术处理。\n\
    - Servlet 充当控制器，包含了处理用户事件和选择恰当响应所需的逻辑。\n- 业务逻辑（模型）实际上实现了交互的目标。这可能是对数据库的查询或更新。这可以通过\
    \ EJB 技术处理。\n\n## JINI\n\n在 Sun J2EE 对网络计算的下一步有了愿景之后，出现了 JINI。其核心思想是：在网络环境中会有许多独立的服务和消费者。JINI\
    \ 允许这些服务/消费者以稳健的方式相互进行动态交互。JINI 的基本特征是：\n\n- 服务上线或离线时不需要用户干预。（相比之下，EJB 的客户端程序必须知道部署\
    \ EJB 的服务器和端口号。在 JINI 中，客户端应该在网络中查找并发现该服务。）\n- 当服务（服务的消费者）出现或离开时，通过自适应来实现自愈。（服务需要定期续租，以标明它们仍然可用。）\n\
    - JINI 服务的消费者不需要预先了解服务的实现。实现代码是动态下载并运行在消费者的 JVM 上的，无需配置和用户干预。（例如，根据当前正在使用的服务，终端用户可能会看到略有不同的界面。这些用户界面代码的实现将由所使用的服务提供。）\n\
    \n一个简易的 JINI 网络环境由以下部分组成：\n\n- 一个或多个服务\n- 保存注册服务列表查找服务\n- 一个或多个消费者\n\n在本文写作时（2006年），JINI\
    \ 尚未广泛使用。有两个可能的原因。一是 JINI 的理解和设置有点复杂。另一个原因是由于微软退出了 Java，这导致行业转向使用专有解决方案。\n\n##\
    \ 第一个 Java 程序\n\n### Hello World\n\n通常，当你开始学习任何语言的编程时，都会从传统的 Hello World 示例开始。如此，让我们开始构建你的第一个\
    \ Java 程序吧。你猜对了，就是 Hello World！在开始此练习之前，确保你知道如何编译和运行 Java 程序。\n\n打开你的 IDE 并输入以下文本。特别注意大小写，因为\
    \ Java 对大小写敏感。\n\n```\npublic class HelloWorld {\n  public static void main(String[]\
    \ args) {\n    System.out.println(\"Hello, world!\");\n  }\n}\n```\n\n将其保存为 HelloWorld.java。再次，确保文件名与名称的大小写一致。编译并运行它：\n\
    \n```\njavac HelloWorld.java\njava HelloWorld\n```\n\n你的电脑应该显示：\n\n```\nHello,\
    \ world!\n```\n\n## 逐行分析\n\n类的第一行：\n\n```\npublic class HelloWorld\n```\n\n声明了一个名为\
    \ HelloWorld 的 Java 类。该类被声明为 public - 它对任何其他类可用。下一行：\n\n```\npublic static void\
    \ main(String[] args) {\n```\n\n开始了一个名为 main 的 Java 方法。main 方法是 Java 开始执行程序的地方。args\
    \ 是一个方法参数，将包含运行程序时使用的命令行参数。该方法必须同时是 public 和 static 的，程序才能正确运行。关于 public 和 static\
    \ 等修饰符的更多信息，请参阅访问修饰符。\n\n```\nSystem.out.println(\"Hello, world!\");\n```\n\n\
    该语句将文本 Hello, world! 发送到控制台（带有一个换行符）。最后两个大括号标记了 main 方法的结束和类的结束。\n\n## 修改程序\n\n\
    现在，我们将修改此程序，以便在存在命令行参数时，打印出第一个命令行参数（如果有的话），并打印问候语。例如，如果你通过如下方式调用程序：\n\n```\njava\
    \ HelloWorld yaaho\n```\n\n它将打印：\n\n```\nHello, yahoos!\n```\n\n回到你的程序，并将其修改为读取：\n\
    \n```java\npublic class HelloWorld {\n    public static void main(String[] args)\
    \ {\n        String who;\n        if (args.length > 0) {\n            who = args[0];\n\
    \        } else {\n            who = \"World\";\n        }\n        System.out.println(\"\
    Hello, \" + who + \"!\");\n    }\n}\n```\n\n再次运行它。它应该显示：\n\n```\nHello, yahoos!\n\
    ```\n\n或者，如果你没有传递命令行参数，它将仅打印：\n\n```\nHello, World!\n```\n\n## 常见问题\n\n如果程序没有按照你的预期运行，请检查以下常见错误。\n\
    \n- 你确定所有单词拼写正确且大小写与所示完全一致吗？\n- 分号和括号是否在合适的位置？\n- 你是否漏掉了引号？\n\n## 下一步\n\n现在你已经看到了\
    \ Java 中经典的 Hello, World 程序，让我们进入一个更真实的示例，该示例突出了 Java 的面向对象特性。访问[理解 Java 程序]，该章节介绍了\
    \ Java 语言特性，以及对基础 Java 程序语法和结构的更完整的解释。\n\n| Java 编程 | | 索引 |\n|---|---|---|---|\n\
    | 概述 | 入门 | 基础 | 类与对象 |\n| 集合 | 异常 | 并发编程 | 反射 |\n| Applets | JavaBeans | 库 |\
    \ |\n\n## 理解 Java 程序\n\n本文介绍了一个可以从控制台运行的微型 Java 程序。它计算了平面上两点之间的距离。你现在不需要理解程序的结构；我们很快就会涉及到这一点。此外，由于该程序旨在作为一个简单的介绍，它还有一些改进空间，将在模块的稍后部分进行。\n\
    \n### 距离类、源码与使用\n\n该类是 Distance，所以请使用你最喜欢的编辑器首先创建一个名为 Distance.java 的文件，然后复制下面的源码：\n\
    \n```java\npublic class Distance {\n    private java.awt.Point point0, point1;\n\
    \    public Distance(int x0, int y0, int x1, int y1) {\n        point0 = new java.awt.Point(x0,\
    \ y0);\n        point1 = new java.awt.Point(x1, y1);\n    }\n\n    public void\
    \ printDistance() {\n        System.out.println(\"Distance between \" + point0\
    \ + \" and \" + point1 + \" is \" + point0.distance(point1));\n    }\n\n    public\
    \ static void main(String[] args) {\n        Distance dist = new Distance(intValue(args[0]),\
    \ intValue(args[1]), intValue(args[2]), intValue(args[3]));\n        dist.printDistance();\n\
    \    }\n\n    private static int intValue(String data) {\n        return Integer.parseInt(data);\n\
    \    }\n}\n```\n\n## 详细程序结构与概述\n\n正如所承诺，我们现在将对这个 Java 程序进行详细描述。我们将讨论程序的语法和结构以及该结构的含义。\n\
    \n## Java 语法介绍\n\nJava 类的语法是使用 Unicode 因子编写类时的字符和符号及其结构。关于 Java 语法元素的更充分的处理可以参阅语法。我们仅提供足够的语法描述来理解上述程序。\n\
    \nJava 程序由标记序列组成。有不同类型的标记。例如，有像 class 和 public 这样的单词标记，代表关键字 - 具有特殊的"
