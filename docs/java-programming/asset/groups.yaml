  - "[PAGE 62]\n\n+   - An exception is thrown and a matching catch block found. In\
    \ such a case, the following are executed:\n  - code in the try block until where\
    \ the exception occured\n  - code in the matched catch block\n  - code in the\
    \ **finally** block\n  - code after the try-catch block\n- An exception is thrown\
    \ and no matching catch block exists. In such a case, the following are executed:\n\
    \  - code in the try block until where the exception occured\n  - code in the\
    \ **finally** block\n\nNote: in that third and final case, **NO CODE** after the\
    \ try-catch block is executed.\n\nFor Example:\n\n```\npublic void method() throws\
    \ NoMatchedException {\n  try {\n    throw new Exception_1(1);\n  } catch (Exception_1\
    \ e) {\n    // --- Handle the Exception_1 here-\n  } catch (Exception_2 e) {\n\
    \    // --- Handle the Exception_2 here-\n  } finally {\n    // --- This will\
    \ always be executed no matter what-\n    // --- Code after the try-catch block\n\
    \  }\n}\n```\n\nNote: if there is an exception that happens before the try-catch\
    \ block, the **finally** block is not executed.\n\n+   - Keywords/try\n- Keywords/catch\n\
