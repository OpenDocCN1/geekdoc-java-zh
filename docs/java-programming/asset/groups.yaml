    # Creating Objects


    # Introduction


    All the objects in java programs are created on heap memory (with the exception
    of primitive types). An object is created based on its class. You can consider
    a class as a blueprint, template, or a description how to create an object. When
    an object is created, memory is allocated to hold the object properties. An object
    reference pointing to that memory location also created. To use the object in
    the future, object reference has to be stored as a local variable or as no member
    variable.


    The Java Virtual Machine (JVM), keeps track of the usage of object references.
    If there are no more reference to the object, the object cannot be used any and
    becomes garbage. After the heap memory will be full of unused objects. The JVM
    collects garbage objects and frees the memory they allocated, so the memory can
    be reused again when a new object is created. See below a simple example:


    ```

    ```java

    // Create an object --

    MyObject obj = new MyObject();


    // Use the object --

    obj.printMyValues();

    ```

    ```


    The obj contains the object reference pointing to an object created from the MyObject
    class. The obj object reference is in scope inside the [ ]. After the ] object
    becomes garbage. Object references can be passed in methods, object references
    can be retrieved from methods.


    # Creating object with the new keyword


    99% of new objects are created using the new keyword.


    ```

    ```java

    // Create an ''MyObject'' for the first time the application started-

    MyObject obj = new MyObject();

    ```

    ```


    When an object from the MyObject class is created for the first time. The JVM
    searches the file system for the definition of the class. The CLASPATH environment
    variable contains locations where Java classes are stored. The JVM is looking
    for the ''MyObject.class'' file. Depending on which package the class belongs
    to, the package name will be translated to a directory path.'
  - "[PAGE 134]\n\nWhen the 'MyObject.class' file is found, the JVM's class loader\
    \ loads the class in memory. The JVM stores the code in memory, allocates memory\
    \ for the static variables, and executes any static initialize block. Memory is\
    \ not allocated for the object member variables at this point, memory will be\
    \ allocated for them when an instance of the class, an object, is created.\n\n\
    There is no limit on how many objects from the same class can be created. Code\
    \ and static variables are stored only once, no matter how many objects are created.\
    \ Memory is allocated for the object member variables when the object is created.\
    \ Thus, the size of an object is determined not by its object's size by the memory\
    \ it needs for its member variables to be stored.\n\n# Creating object by cloning\
    \ an object\n\nCloning is not automatically available to classes. There is some\
    \ help though, as all Java objects inherit the protected Object clone() method.\
    \ This method would allocate the memory and do the bit by copying of the object's\
    \ states.\n\nYou may ask why we need this clone method. Couldn't I create a constructor\
    \ and just passing in the same object, and do the copying by variable? Lets see:\n\
    \n```\npublic class MyObject {\n    private memberVar;\n    ...\n    MyObject(MyObject\
    \ obj) {\n        this.memberVar = obj.getMemberVar;\n    }\n...\n}\n```\n\nThere\
    \ are two problems with the above code:\n\n+   - firstly, the private variables\
    \ cannot be assigned directly. To do that you need setters and getters, which\
    \ requires extra code.\n- secondly, and more importantly, performance. The clone()\
    \ method copies the whole object's memory in one operation. This is much faster\
    \ than using the new keyword.\n\nObject creation with the new keyword is expensive,\
