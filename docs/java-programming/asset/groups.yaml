    如果你从 Sun 网站下载 Java，你也可以安装 NetBeans IDE + JDK 5.0 Update 6 绑定包。


    # 安装验证


    当你完成上述 JDK 下载和安装说明后，请重复执行


    ```

    javac -version

    ```


    命令以验证你的路径是否获取了正确的 JDK 版本。


    | Java 编程 | 索引 | |

    | --- | --- | |

    | 概述 | 入门 | 基础 | 类与对象 |

    | 集合 | 异常 | 并发编程 反射 |

    | Applets | JavaBeans | 库 | |


    # 编译


    我们已经讨论过编译的基本知识。这里是对我们之前看到的概念的总结以及一些额外的细节。


    ## 编译为字节码


    在 Java 中，程序并不是被编译成可执行文件；它们被编译成字节码（如之前所述），由 JVM 在运行时执行字节码。当我们使用 `javac` 编译器时，Java
    源代码会被编译成字节码。字节码以 `.class` 扩展名保存在磁盘上。当运行程序时，字节码将由即时编译器（JIT）转换。结果是机器码，它被输入内存并执行。


    因此，Java 有两步编译：


    - 第一步：创建字节码

    - 第二步：创建机器级代码


    Java 类/字节码会被编译成机器码，并在第一次需要时由 JVM 加载到内存中。这与 C/C++ 等语言不同，在这些语言中，整个程序必须先编译成机器码并链接成一个可执行文件，程序才能启动。


    JIT 编译器编译一次字节码，编译后的机器码会被反复使用以加快执行速度。JIT 更好的名称应该是“仅编译一次”编译器，COO，或“仅一次”编译器，JOT。早期的
    Java 编译器每次使用时都会将字节码编译成机器码，那速度很慢。但它仍然比“解释型语言”快，解释型语言每次使用时都是从高级语言编译代码，而不是从字节码编译。


    # 依赖类的自动编译


    在 Java 中，如果你使用了任何其他对象的引用，如果该对象的类尚未编译，它将被自动编译。这些自动编译是嵌套的，并且会持续进行直到运行程序所需的所有类都被编译。因此，只需编译高层类就足够了，所有的依赖类都将自动编译。


    ```

    javac ... MainClass.java

    ```


    如果你的程序使用反射来创建对象，或者你正在为 servlets 或 "jar" 包编译，就不能依赖此特性。在这些情况下，你应该列出这些类进行显式编译。


    ```

    javac ... MainClass.java, ServletOne.java, ...

    ```


    最好的方法是使用构建工具来构建你的应用程序。构建工具会检查所有所需的依赖项，并仅为构建编译所需的类。Ant 是目前可用最好且流行的构建工具。使用 Ant，你可以通过输入以下命令从命令行构建应用程序：


    ```

    ant build.xml

    ```


    xml 文件包含了构建应用程序所需的所有信息。


    构建应用程序最流行的方法是使用 IDE。IDE 代表集成开发环境。下面列出了其中一些。


    # 包与子目录


    每个 Java 级别的类都属于一个包（在关于“包”的章节中介绍）。这可以在文件开头的 `package` 语句中声明；如果缺少该语句，类类属于未命名包。


    对于编译，文件必须位于正确的目录结构中。包含未命名包类的文件必须位于当前根目录下；如果类属于某个包，则它必须位于与包名同名的目录中。


    惯例是包名和对应包的目录名仅由小写字母组成。


    # 示例


    ## 顶层包


    具有此包声明的类


    ```

    package example;

    ```


    必须位于名为


    目录


    ## 子包


    具有此包声明的类


    ```

    package org.yahoos.en;

    ```


    必须位于名为


    ```

    en

    ```

    目录中，该目录必须是


    ```

    yahoos

    ``` 的子目录，而该目录又是


    ```

    org

    ``` 的子目录，结果为


    ```

    org/yahoos/en/

    ```


    ## 文件名大小写


    Java 源文件名必须与该文件包含的 public 类名相同。每个文件只能定义一个 public 类。Java 类名对大小写敏感，源文件名也是如此。


    类名的命名惯例是以大写字母开头。


    # 编译器选项


    调试与符号信息


    # 附加工具


    ## IDEs


    本节简要介绍了一些不同的 IDE 及其优缺点。


    ## JBuilder


    JBuilder 是一个拥有私有源代码的 IDE，由 Borland 销售。它的优势之一是与建模工具 together 集成。


    ## JCreator


    信息见：http://www.apcomputerscience.com/ide/jcreator/index.htm


    ## Eclipse


    Eclipse 是一个免费的 IDE，也是一个可以根据特定开发需求扩展的开发者框架，IBM 是该免费软件的开发者，它取代了 Age 工具。扩展性使它区别于其他
    IDE。Eclipse 旨在与 Visual Studio 工具竞争。其目标有两个：


    - 为开发提供标准的 IDE

    Eclipse 特性：


    - 标准窗口管理（视角、视图、资源管理器）

    - 实时错误检查（错误提示）

    - 帮助窗口

    - 自动构建（更改源码）

    - 内置调试器

    - 代码生成（getter 和 setter）

    - 搜索（实现）

    - 代码重构（全局引用）

    - 基于插件的架构（能够与环境和其他工具集成）


    ## NetBeans


    NetBeans IDE 是一个面向软件开发者的开源集成开发环境。该 IDE 运行在 Windows、Linux、Solaris 和 MacOS 等多个平台上。它易于安装和使用。IDE
    为开发者提供了创建跨平台桌面、企业、Web 和移动应用程序所需的所有工具。


    ## BlueJ


    BlueJ 是一个包含模板的 IDE，并为你编译和运行应用程序。BlueJ 经常被类使用，因为它不需要设置类路径。BlueJ 有自己的库集，你可以在偏好设置中添加任何一个。它会为其产生的所有编译设置类路径，包括你添加的和
    BlueJ 的库。


    BlueJ 提供了一个有趣的图形化界面，用于创建包和程序。类用框表示，类之间的箭头表示继承/实现，或者一个类在另一个类中构造。在编译时时，BlueJ 会将所有类（整个项目）添加到类路径中。


    Blue Homesite


    ## Kawa


    Kawa 由 Tek-Tools 开发。它基本上是一个 Java 编辑器，不包含向导和 GUI 工具，最适合中小型开发团队经验丰富的 Java 程序员。


    ## Ant


    Ant 是一种构建管理工具，旨在取代 MAKE 作为大型 Java 应用程序自动化构建的工具。与 Java 类似，Ant 设计为平台无关。


    构建 Java 应用程序需要执行某些任务。这些任务不仅包括编译代码，还包括复制代码、将代码打包 包、创建 EJB、运行自动化测试、将代码 FTP 到远程站点等。对于某些任务可以分配条件，例如仅编译更改的代码，或者如果尚未完成则执行该任务。

    '
