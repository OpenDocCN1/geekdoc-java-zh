    # Download a JDK


    If a JDK is not already on your system, you should download one. For Solaris,
    Windows operating systems (Windows XP, Windows Server 2000, Windows Server 2003),
    you can download the JDK from Sun. For Linux running on x86 architecture, you
    can download an RPM (RedHat Package Manager) or a self-extracting .bin binary
    (such as jdk-1_5_06-linux-i586.bin for Pentium compatible machines) to get Java
    SE release 5. (The file name changes as new versions are released).


    On Windows, you can download jdk-1_5_06-windows-i586-exe.


    # Install the JDK


    When you execute the installer, it will install the JDK files. Note: you will
    need administrator access to install the JDK. You can choose an installation location,
    such as c:\java5 on Windows or /var/local/java/5.0 on Linux. This location is
    called the JAVA_HOME and it is customary but not necessary to define an environment
    variable which refers to that location.


    You may also have to modify your path so that it includes the <bin> subdirectory
    of JAVA_HOME. You should put the JAVA_HOME/bin directory before other directories
    where Java is installed. The above installations may put the JRE, java (or java.exe)
    in system binary, but may not put all of the JDK executables in your path.


    You may need to restart your command shell in order to pick up environment variables
    for JAVA_HOME and PATH.


    # Install an IDE


    You may optionally choose to install an IDE. There are many free and commercial
    IDEs available. For example, the Eclipse IDE found at http://www.eclipse.org includes
    many of the tools needed to build Java programs (such as a Java compiler, debugger,
    Javadoc, etc.) and you do not need to install a JDK if you opt to use Eclipse.
    However, Eclipse does require you to install a JRE - Eclipse is a Java program
    that runs within the JRE. The JDK download sites mentioned above include JRE downloads,
    and installation instructions are similar.


    Another Popular IDE for Windows is Borland’s JBuilder from http://www.borland.com


    And a Free IDE is JCreator LE from XINOX Software found at http://www.jcreator.com


    However, even if you choose to use Eclipse, it is recommended that you download
    and install the JDK. This will allow you to use scripts to build and test your
    Java software outside the IDE environment.

