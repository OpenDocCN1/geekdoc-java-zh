    You use whitespace such as spaces, tabs, newlines, to separate tokens. For example,
    whitespace is required between keywords and identifiers: publicstatic is a single
    identifier with twelve characters, not two Java keywords.


    # Comments


    Comments are not part of the executing code. Comments are used to document the
    code.


    # Unicode


    Java source files consist of Unicode text files written in UTF-16 encoding. Most
    Java program text consists of ASCII characters, and Unicode escape sequences may
    be used to express any Unicode character when needed.


    Example II (which is the Greek Capital Letter Pi) is a valid Java identifier.
    It may also be represented in Java as the Unicode escape sequence Π. Thus, the
    following is a valid, but not very readable, declaration and assignment:


    ```

    double \u03A0 = Math.PI;

    ```


    The following demonstrate the use of Unicode escape sequences in other Java syntax:


    ```

    // Declare Strings pi and quote which contain \u03A0 and \u0027

    respectively:

    String pi = "\u03A0";

    String quote = "\u0027";

    ```


    # Keywords


    Keywords are special tokens in the language which have reserved use in the language.
    Keywords may not be used as identifiers in Java - you cannot declare a free field
    whose name is a keyword, for instance.


    Examples of keywords are the primitive types, int and boolean; the control flow
    statements for and if; access modifiers as public, and special words which mark
    the declaration and definition of Java classes, packages, and interfaces: class,
    package, interface.


