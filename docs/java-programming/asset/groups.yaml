    application should not try to catch. Most such errors are abnormal conditions.

    java.lang.Exception

    The class Exception and its subclasses are a form of Throwable that indicates
    conditions that a reasonable application might want to catch. Also this is the
    class that a programmer may want to extend when adding business exceptions.

    java.lang.RuntimeException

    RuntimeException is the superclass of exceptions that can be thrown during the
    normal operation of the Java Virtual Machine. A method is not required to declare
    in its throws clause any subclasses of RuntimeException that be thrown during
    the execution of the method but not caught.

    java.lang.NullPointerException

    Thrown when an application attempts to use null in a case where an object is required.


