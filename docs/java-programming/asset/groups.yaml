    \ is the same case as the name. Compile and run it:\n\n```\njavac HelloWorld.java\n\
    java HelloWorld\n```\n\nYour computer should display\n\n```\nHello, world!\n```\n\
    \n## Line-by-line Analysis\n\nThe first line of the class,\n\n```\npublic class\
    \ HelloWorld\n```\n\ndeclares a Java class named HelloWorld. This class is declared\
