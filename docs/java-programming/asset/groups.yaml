    \ object references, those have been to clone, as seen below\n- Change the Customer\
    \ class clone() method as follows:\n\n```java\npublic class Customer implements\
    \ Cloneable\n{\n    Activity _activity;\n    ...\n    public Customer clone()\
    \ throws CloneNotSupportedException {\n        Customer clonedCustomer = (Customer)\
    \ super.clone();\n        // Clone the object referenced objects ---\n       \
    \ if ( _activity != null) {\n            clonedCustomer.setActivity((Activity)\
    \ _activity.clone());\n        }\n        return clonedCustomer;\n    }\n}\n```\n\
    \nWhen only mutable objects needs to be cloned. Object like String that cant change,\
