    ## JIT 编译器


    标准的 JIT 编译器是按需运行。当一个方法被反复调用时，JIT 编译器会分析字节码并产生高效的机器码，这种机器码的运行速度非常快。JIT 编译器足够智能，能够识别代码是否已经编译，因此随着应用程序的运行，编译仅在需要时发生。随着
    Java 应用程序的运行，它们往往变得越来越，因为 JIT 可以对代码进行运行时分析和优化，以适应执行环境。不经常运行的方法或代码块接收的优化较少；经常运行的（所谓的热点）接收更多的分析和优化。


