    # Destroying Objects


    Unlike in many other object-oriented programming langauges, Java performs automatic
    garbage collection - any unferenced objects are automatically erased from memory
    - and prohibits the user from manually destroying objects.


    # finalize()


    When an object is garbage-collected, the programmer may want to manually perform
    cleanup, such as closing any open input/output streams. To accomplish this, the
    finalize() method is used. Note that finalize() should never be manually called,
    except to call a super class'' finalize method from a derived class'' finalize
    method. Also, we cannot rely on when the finalize() method will be called. If
    the java application exits before the object is garbage-collected, the finalize()
    method may never be called.


    ```

    protected void finalize() throws Throwable {

    try {

    dooCleanup(); // Perform some cleanup. If it fails for some reason, it is ignored.

    } finally {

    super.finalize();//Call finalize on the parent object

    }

    }

    ```


    # Overloading Methods and Constructors


    If two methods of a class (whether both declared in the class, or both inherited
    by a class, or one declared and one inherited) have the same name but different
    signatures, then the method name is said to be overloaded. This causes no difficulty
    and never of itself results in a compile-time error. There is no required relationship
    between the return types or between the throws clauses of two methods with the
    same name but different signatures.


    Methods are overridden on a signature-by-signature basis.


    If, for example, a class declares two public methods with the same name, and a
    subclass overrides one of them, the subclass still inherits the other method.
    In this respect, the Java programming language differs from C++.


    When a method is invoked, the number of actual arguments and the compile-time
    types of the arguments are used, at compile time, to determine the signature of
    the method that will be invoked . If the method to be invoked is an instance method,
    the actual method to be invoked will be determined at run time, using dynamic
    method lookup.


