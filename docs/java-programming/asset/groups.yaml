  - "[PAGE 162]\n\n# Throwing and Catching Exceptions\n\nException\n\nExceptions are\
    \ Java's way of error handling. When an unexpected condition occurs, an exception\
    \ can be thrown with an Exception Object as a parameter. It means that the normal\
    \ program control flow stops and the search for a catch block begins. If that\
    \ is not found at the current method the search continues to the caller method\
    \ level, until none is found the exception will be handled by the JVM, the java\
    \ program terminates.\n\nWhen a catch \"matching\" block is found, that block\
    \ will be executed, the Exception Object is passed to the block as a parameter.\
    \ Then normal program execution continues after the catch block. See Java exception\
    \ handling syntax\n\nException Object\n\nThat is the object that is \"thrown\"\
    \ as a parameter from the error, and passed to the catch block. Exception Object\
    \ encapsulates the information about the error's location and its nature. All\
    \ Exception Objects must be inherited from the java.lang.Throwable. See the main\
    \ Exception Classes in UML\n\n# Handling exceptions\n\nLet's examine the following\
    \ code:\n\n```\npublic void methodA() throws SomeException {\n  //methodBody\n\
    }\npublic void methodB() throws CustomException{\n  //methodBody\n}\npublic void\
    \ methodC() {\n  methodB();\n  methodA();\n}\n```\n\nIn the sample code, methodB\
    \ is invalid. Because methodA and methodB pass (or throw) exceptions, methodC\
    \ must be prepared to handle them. This can be handled in two ways: a try-catch\
    \ block, which will handle the exception within the method and a throws clause\
    \ which would turn the throw to the caller to handle. The above example will cause\
    \ a compilation error, as Java is very strict about exception handling. So the\
    \ programmer forced to handle any possible error condition at some point.\n\n\
    A method can do two things with an exception. Ask the calling method to handle\
    \ it by the throws declaration. Or handle the exception inside the method by the\
    \ try-catch block."
