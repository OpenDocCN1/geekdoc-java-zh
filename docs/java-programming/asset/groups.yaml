    ## Execution


    There are various ways Java code can be executed. A complex Java application is
    usually using third party APIs or services. In this section we list the most popular
    way a piece of Java code may be packed together and/or executed.


    ## JSE code execution


    Java language first edition came out in the client-server era. Thick clients were
    developed with rich GUI interfaces. Java first edition, JSE(Java Standard Edition)
    had/has the following in its belt:


    - GUI capabilities (AWT, Swing)

    - Network computing capabilities (RMI)

    - Multi-tasking capabilities (Threads)


    With the following Java code executions are possible:


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_33_0.png)


    Figure 1: Stand alone execution

    Stand alone Java application

    (Figure 1) Stand alone application refers to a Java program where both the user
    interface and business modules are running on the same computer. The application
    may or not use a database to persist data. The user interface could be AWT or
    Swing.


    The application would start with a main() method of a Class. The application stops
    when the main() method exits, or if an exception is thrown from the application
    to the JVM. Classes are loaded to memory and compiled as needed, either from the
    file system or a *.jar file, by the JVM.


    ## Java ‘jar’ class libraries


    Utility classes, framework classes, and/or third party classes are usually packaged
    and distributed in Java *.jar files. These *.jar files need to be put in the CLASSPATH
    of the java program from which these classes are going to be used.


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_34_0.png)


    Figure 2: Applet Execution


    ## Java Applet


    (Figure 2) Java Applets are Java code referenced from HTML pages, by the `<APPLET>`
    tag. The Java code is downloaded from a server and running in the client browser
    JVM. Java has built-in support to render applets in the browser window.


    Applets did not fulfil its promise at this writing (year 2006). Sophisticated
    GUI clients were found hard to develop mostly because of download time, incompatibilities
    between browser''s JVM, and its communication requirements back to server. Applets
    are really used today and if they are used, they are used as small separate graphic-like
    animations. The main and final blow was made by Microsoft, first by withdrawing
    its Java support from its Internet Explorer, and second by excluding the Java
    JRE from Internet Explorer''s default configuration.


    More information can be found about applets in the Applet Chapter, in this book.
    Also google has an article about Applets.


    ## Client Server applications


    The client server applications consist of a front-end, and a back-end part, both
    running on a separate computer. The idea is that the business logic would be on
    the back-end part of the program, which would be reused by all clients. Here the
    challenge is to achieve a separation between front-end user interface code, and
    the back-end business logic code.


    The communication between the front-end and the back-end can be achieved by two
    ways.


    - One way is to define a communication protocol between the two tiers. The back-end
    part would listen for an incoming request. Based on the protocol it interprets
    the request and sends back the result in data form.

    - The other way is to use Java Remote Invocation(RMI). With the use of RMI, a
    remote object can be created and used by the client. In this Java objects are
    transmitted across the network.


    ## Web Applications


    For applications needed by lots of client installations, the client-server model
    did not work. Maintaining and upgrading the hundreds or thousands of clients caused
    a problem. It was the solution to create a web-server model. The client is the
    browser, and the server hosts the application.


    The business logic is on the server, and the presentation layer is sent to the
    browser. This is the client-server architecture. The client-side handles the user
    interface and interaction, while the server-side handles the business logic and
    data processing. This separation allows for scalability and easier maintenance.


    The communication between the client and the server is usually done via HTTP.
    The client sends requests to the server, and the server responds with data. These
    responses often contain HTML, JSON, or other types of data that the client then
    renders for the user.

