    \ to the user become very important and usually needs the help of a graphic artist.\n\
    \nTo help programmers and graphic artists to work together, the separation between\
    \ data and how it is become crucial.\n\n- The view (User Interface Logic) contains\
    \ the logic that is necessary to construct the presentation. This could be handled\
    \ by JSP technology.\n- The servlet acts as the controller and contains the logic\
    \ that is necessary to process user events and to select an appropriate response.\n\
    - The business logic (model) actually accomplishes the goal of the interaction.\
    \ This might be a query or an update to a database. This could be handled by EJB\
    \ technology.\n\n## JINI\n\nAfter J2EE Sun has a vision about the next step of\
    \ network computing. That is JINI. The main idea is that in a network environment,\
    \ there would be many independent services and consumers. JINI would allow these\
    \ services/consumers to interact dynamically with each other in a robust way.\
    \ The basic features of JINI are:\n\n- No user intervention is needed when services\
    \ are brought on or offline. (In contrast to EJBs where the client program has\
    \ to know the server and port number where the EJB is deployed. In JINI the client\
    \ is supposed to find, discover the service in the network.)\n- Self-healing by\
    \ adapting when services(consumers of services) come and go. (Services need to\
    \ periodically renew a lease to indicate that they are still available.)\n- Consumers\
    \ of JINI services do not need prior knowledge of the service’s implementation.\
