    # 安全工具


    JDK 自带了许多与 Java 安全功能相关的工具。在使用这些工具之前，首先需要学习特定的安全机制。


    这些工具包括：


    - keytool：管理密钥和证书

    - jsignigner：生成和验证 JAR（Java 归档）的数字签名

    - policytool：编辑策略文件

    - kinit：获取 Kerberos v5 票据

    - klist：管理 Kerberos 凭据缓存和密钥表

    - ktab：管理密钥表中的条目


    # native2ascii 工具


    native2ascii 是一个重要但被低估的工具，用于编写属性文件（包含配置数据的文件）或资源包（包含文本语言翻译的资源包）。


    此类文件仅包含 ASCII 和 Latin-1 字符，但国际化程序员需要全范围字符集。只有当非 ASCII 和非 Latin-1 字符转换为 Unicode
    序列（uXXXX 表示法）时，使用这些字符的文本才能出现在属性文件和资源包中。


    使用此类序列的任务由 native2ascii 处理。你可以使用适当的字符编码编写国际文本，然后使用 native2ascii 生成嵌入 Unicode 序列的必要
    ASCII 文本。尽管名称如此，native2ascii 也可以从 ASCII 转换为原生格式（native），因此它对于将现有的属性文件或资源包转换回其他编码也很有用。


    native2ascii 在集成到构建系统中以实现自动化转换时最具意义。


