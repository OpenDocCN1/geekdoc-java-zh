- md: "\n## Compare two strings: Comparing strings is not as easy as it may first\
    \ seem. We cannot just use a simple equality statement such as:\n\n```java\nif(myString\
    \ == \"Hello World!\") {\n    System.out.println(\"Match Found\");\n}\n```\n\n\
    We must instead use a method built into java.String class itself, the compareTo()\
    \ method, which can be accessed wherever we use a String datatype. Lets take a\
    \ look at an example:\n\n```java\nString myString = \"Hello World!\";\nif(myString.compareTo(\"\
    Hello World!\") == 0) {\n    System.out.println(\"Match Found\");\n}\n```\n\n\
    This snippet of code is comparing the String variable myString to \"Hello World\"\
    . If the two strings exactly match the compareTo method will return \"0\", i.e.\
    \ that there is no variance between the two strings, and the statement body will\
    \ run. However if myString was to be different, in the slightest manner we get\
    \ a value above or below 0 depending on the exact difference. The result is a\
    \ negative integer if this String object lexicographically follows the argument\
    \ string. The result is a positive integer if this String object lexicographically\
    \ follows the argument string. Take a look at the Java API for more details.\n\
    \nTo compare for the equals() method can also be used.\n\n```java\nString myString\
    \ = \"Hello World!\";\nif(myString.equals(\"Hello World!\")) == true {\n    System.out.println(\"\
    Match Found\");\n}\n```\n\n## Splitting a String object based on a token\n\nSometimes\
    \ it is useful to split a string into separate strings, based on a 'regular expression'.\
    \ The String class has a split() method, since Java 1.4, that will return a String\
    \ array.\n\n> See the following example:\nString person = \"John:Brows:100 Yonge\
    \ Street, Toronto: (416)777-9999\";\n\nAn other useful application could be to\
    \ 'split' the String text based on the 'new line' character, so you could process\
    \ the text line by line.\n\n## Creating Substrings\n\nIt may also be useful to\
    \ create substrings, or strings using the order of letters from an existing string.\
    \ This can be done in two methods.\n\nThe first method involves creating a substring\
    \ out of the characters of a string from a given index to the end.\n\nFor example:\n\
    \n```java\nString str = \"coffee\";\nString substr = str.substring(3);\n```\n\n\
    In this example, substr would return 'fee'. As previously discussed, the index\
    \ of the first character in a string is 0. By counting from there, it is apparent\
    \ that the character in index 3 is the second 'f' in 'coffee'. This is known as\
    \ the beginIndex. All characters from the beginIndex until the end of the string\
    \ will be copied into the new substring.\n\nThe second method involves a user-defined\
    \ startIndex and endIndex. For example:\n\n```java\nString str = \"supporting\"\
    ;\nString substr = str.substring(3,7);\n```\n\nThe string returned by substr would\
    \ be 'port'. Please note that the endIndex is not inclusive. This means the last\
    \ character will be of index endIndex-1. In this example, every character from\
    \ index 3 to 6, was copied into the substring.\n\nNote: \"Substring\" is considered\
    \ to be one word. Why the method name does not seem to follow the common syntax\
    \ of Java. It is easy to mistake the method substr() for subString() (which does\
    \ not exist and would return with a syntax error on compilation). Just remember\
    \ that this style only applies to methods or other elements that are made up of\
    \ more than one word.\n\n## Modifying String cases\n\nThe String Class also allows\
    \ for the modification of cases. The two methods that make this possible are toLowerCase()\
    \ and toUpperCase(). These methods are useful, for example, in the typical programming\
    \ classroom assignment of evaluating whether or not a string is a palindrome.\n\
    \n```java\nString a = \"YAHOOS\";\nString b = \"google\";\n```\n\nIn this example,\
    \ a.toLowerCase() would return a result of \"yahoos\", and b.toUpperCase() would\
    \ return \"GOOGLE\".\n\n## Arrays\n\n### Intro to Arrays\n\nAn array is similar\
    \ to a data table, keyed by number. In Java an array is an object like all other\
    \ objects. Look at the following program:\n\n```java\nimport java.io.*;\npublic\
    \ class ArrayExample {\n    static BufferedReader kRead = new BufferedReader(new\
