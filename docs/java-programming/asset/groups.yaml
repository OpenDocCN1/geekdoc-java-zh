    # java.lang.String


    # java.lang.String


    String is a special class built into the Java language defined in the java.lang.*
    package.


    The String class represents character strings. String literals in Java programs,
    such as "abc", are implemented as instances of this class. Strings are constant;
    their values cannot be changed after they are created.


    For Example:


    ```

    String str = "This is string literal";

    ```


    On the right hands a String object is created representing the string literal
    and its object reference is assigned to the str variable.


    The Java language provides special support for the string concatenation operator
    ( + ), and for conversion of other objects to strings. For example:


    ```

    String str = "First part" + " second part";

    // -- is the same as:

    String str = "First part second part";

    ```


    Integers will also be converted to String after the ( + ) operator:


    ```

    String str = "Age=" + 25;

    ```


    Each object has the String toString() inherited from the Object class. So it can
    be overrid to convert the object to String.


    The String class provides a nice set of methods for string manipulation. Since
    String objects are immutable (constants), all methods return a new String object.
    For example:


    ```

    name = name.trim();

    ```


    The trim() method returns a copy of the string with leading and trailing whitespace
    removed. Note that the following would do nothing useful:'
