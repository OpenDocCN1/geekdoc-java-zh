    # SortedSet


    The SortedSet interface extends the Set Interface. All elements in the SortedSet
    must implement the Comparable Interface, further all elements must be mutually
    comparable.


    Note that the ordering maintained by a sorted set must be consistent with equals
    if the sorted set is to correctly implement the Set interface. This is because
    the Set interface is defined in terms of the equals operation, but a sorted set
    performs all element comparisons using its compareTo(or compare) method, so two
    elements that are deemed equal by this method are, from the standpoint of the
    sorted set, equal.


    The SortedSet interface has additional methods to the sorted nature of the ''Set''.
    Those are:


    +   - E first(); -- returns the first element

    - E last(); -- returns the last element

    - SortedSet headSet(E toElement); -- returns from the first, to the exclusive
    toElement

    - SortedSet tailSet(E fromElement); -- returns from the inclusive fromElement
    to the end

    - SortedSet subSet(E fromElement, E toElement); -- returns elements range from
    fromElement, inclusive, to toElement, exclusive. (If fromElement and toElement
    are equal, the returned sorted set is empty.)


