  md: '# Modifying String cases


    The String Class also allows for the modification of cases. The two methods that
    make this possible are toLowerCase() and toUpperCase(). These methods are useful,
    for example, in the typical programming classroom assignment of evaluating whether
    or not a string is a palindrome.


    ```

    String a = "YAHOOS";

    String b = "google";

    ```


    In this example, a.toLowerCase() would return a result of "yahoos", and b.toUpperCase()
    would return "GOOGLE".'
