  md: '# Other JDK tools


    Apart from the tools specified above in detail, the JDK has matured over the years
    and has included in itself several other tools. Where some of these tools are
    no longer used, others offer a far greater deal of capability to the Java Development
    Kit. Below is a list of some of the tools available for the JDK.


    # The apt tool


    In Java 1.5 (alias Java 5.0) Sun added a mechanism called *annotations*. Annotations
    allow to add meta-data to Java source code, and even provide mechanisms to carry
    that meta-data forth into compiled files.


    Also starting with Java 1.5 added the *apt* tool to the JDK, *apt works* on Java
    source code. It is an *annotation processing* tool which digs through source code
    and executes actions if it finds known annotations. The most common task is to
    generate some particular source code.


    The actions *apt* performs when finding annotations in the source code are not
    hard-coded into *apt*. Instead, one has to code particular annotation handlers
    (in Java). These handlers are called *annotation processors*.


    The most difficult thing with *apt* is that Sun decided to use a whole set of
    new terminology, *apt* can simply be as a source code preprocessor framework,
    and *annotation processors* are typically just code generators.


    # The appletviewer tool


    Java applets require a particular environment to execute. Typically, this environment
    is provided by a browser with a descendant Java plug-in, and a web server serving
    the applet. However, during development and testing of an applet it might be more
    convenient to start an applet without the need to fiddle with a browser and a
    web server. In such a case Sun''s *appletviewer* from the JDK can be used to run
    an applet.


    # The javah tool


    A Java class can call *native*, or non-Java, code that has been prepared to be
    called from Java. The details and procedures are specified in the JNI (*Java Native
    Interface*). Commonly, native code is written in C (or C++). The JDK tool *javah*
    helps to write the necessary C code, by generating C header files and C stub code.


    # The extcheck tool'
