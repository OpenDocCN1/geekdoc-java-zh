  md: '# The Java Platform


    The newer versions of Java, i.e., version 6.0 and 7.0 are being developed and
    are known by their code-names Mustang and Dolphin respectively.


    The Java platform is the name for a computing environment, or platform, from Sun
    Microsystems which can run applications developed using the Java programming language
    and set of development tools. In this case, the platform is not a specific hardware
    or operating system, but rather an execution engine called a virtual machine,
    and a set of standard libraries which provide common functionality.


    The platform is properly called the Java 2 Platform (although the “2” is dropped),
    and includes a Standard Edition or JSE (now Java SE), an Enterprise Edition or
    JEE (now Java EE), and a Micro Edition or JME (now Java ME). The current version
    of the Java 2 platform is alternatively specified as version 1.5 or 5 (both refer
    to the same version). A good overview of the myriad of technologies that make
    up the Java 2 Platform can be found on the JDK Documentation Page.


    # Java technologies


    The Java platform consists of a wide array of technologies, each of which provides
    a distinct portion of the overall development or runtime environment. For example,
    end-users typically interface with the Java virtual machine and the set of class
    libraries. In addition, there are numerous ways for Java applications to be deployed,
    including being embedded into a web page. Lastly, developers who are creating
    applications for the platform use a set of development tools called the Java Development
    Kit.


    # Java Runtime Environment


    A program targeting the Java platform needs two components to be present on its
    host: a Java virtual machine, and a set of class libraries providing any services
    on which it depends. Sun’s distribution of the JVM and their implementation of
    the standard classes is known as the Java Runtime Environment (JRE).


    # Java Virtual Machine


    The heart of the Java platform is the concept of a common “virtual” processor
    that executes Java bytecode programs. This bytecode is the same no matter hardware
    or operating system the program is running under. The Java platform provides an
    interpreter called the Java virtual machine (JVM), which translates the Java bytecode
    into native processor instructions at run-time. This permits the same application
    to be run on any platform that has a virtual machine available.'
