  md: '# Minimize the use of the new Type[int] syntax for creating arrays of objects


    An array created using new Object[10] has 10 null pointers. That''s 10 more than
    we want, so use collections instead, or explicitly fill the array at initialisation
    with:


    ```

    Object[] objects=("blah",5,new File("/usr/bin");

    ```


    or:


    ```

    Object[] objects;

    objects=new Object[]("blah"

    ```


    # Check all references obtained from ‘untrusted’ methods


    Many methods that can return a reference return a null reference. Make sure you
    check these. For example:


    ```

    File file=new File("/etc");

    File[] files=file.listFiles();

    if (files==null)

    {

    tstuff

    }

    ```


    File.listFiles() can return null if "/etc" is not a directory.


    You can decide to trust some methods not to return null, if you like, but that''s
    an assumption you''re making. Some methods that don''t specify that they might
    return null, actually do, instead of throwing an exception.'
