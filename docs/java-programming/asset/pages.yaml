  md: '# Access Modifiers


    # Access modifiers


    You surely have noticed by now, the words public, protected and private at the
    beginning of class declarations used in this book. These keywords are called the
    access modifiers in the Java language syntax, and can be defined as...


    > .. keywords that help set the visibility and accessibility of a class, its member
    variables, and methods.


    The following table shows Access Modifiers are appropriate for classes, nested
    classes, member variables, and methods:


    | Class | Nested class | Method | Member variable | Interface | Interface method
    signature |

    | --- | --- | --- | --- | --- | --- |

    | public | visible from anywhere | same as its class | same as its class | same
    as its class | visible from anywhere | visible from anywhere |

    | protected | N/A | its class and its subclass | its class and its subclass |
    its class and its subclass | N/A | N/A |

    | package (default) | only from its package | only from its package | only from
    its package | only from its package | only from its package | N/A, default is
    public |

    | private | N/A | only from its class | only from its class | only from its class
    | N/A | N/A |


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_99_0.png)


    # Points to ponder


    Note that Interface visibility is public by default. You do not need to specify
    the access modifier it will default to public. For clarity it is considered a
    good practise to put the public keyword.'
