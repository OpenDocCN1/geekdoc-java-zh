    # Monitoring and Management Tools / Toubleshooting Tools


    With Java 1.5 a set of monitoring and management tools have been added to the
    JDK, in addition to a set of troubleshooting tools.


    The monitoring and management tools are intended for monitoring and managing the
    virtual machine and the execution environment. They allow, for example, monitoring
    memory usage during the execution of a Java program.


    The troubleshooting tools provide rather esoteric insight into aspects of the
    virtual machine. (Interestingly, the Java debugger is not categorized as a troubleshooting
    tool.)


    All the monitoring and management troubleshooting tools are currently marked as
    "experimental" (which does not affect jdb). They might disappear in future JDKs.


    # The Jar tool


    Jar is short for Java archive. It is a tool for creating Java archives or jar
    files - a file with .jar as the extension. A Java archive is a collection of compiled
    Java classes and other resources which those may require (such as text files,
    configuration files, images) at runtime. Internally, a jar file is really a .zip
    file.


    # The jdb tool


    Jdb is short for Java debugger. The Java debugger is a command-line console that
    provides a debugging environment for Java programs. Although you can use this
    command line console, IDE''s normally easier to use debugging environments.


    # The Javadoc tool


    As programs grow large and complex, programmers need ways to track changes and
    to understand the code better at each step of its evolution. For decades, programmer
    have employing the use of special programming constructs called comments - regions
    that help declare user definitions for a code snippet within the source code.
    But comments are prone to verbose'
