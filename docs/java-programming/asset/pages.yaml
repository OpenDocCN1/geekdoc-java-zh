  md: '# Syntax


    Java derives much of its syntax from the C programming language: basic assignment
    statement syntax, expressions, control flow statements and blocks, etc. will be
    very familiar to C programmers.


    # Unicode


    Java source code are built by Unicode characters.


    # Tokens


    Java programs consist of a sequence of different kinds of tokens. For example,
    there are word tokens such as `class` and `public` which are `keywords`.


    # Keywords


    Those are special words with reserved meaning in Java. Those words can not be
    used by the programmers to name identifiers.


    # Identifiers


    Other words (non keywords) are identifiers. Identifiers have many different uses
    in Java but primarily they are used as names, class names, method names, and variable
    names...


    literals


    Java also has tokens to represent numbers, such as `1` and `3`; these are known
    as `literals`.


    String literals, such as `"http://en.yahoos.org/Java_Programming"`, consist of
    zero or more characters embedded in double quotes.


    # Operators


    And `operators` such as `+` and `=` are used to express basic computation such
    as addition or String concatenation or assignment.


    # Blocks


    There are also left and right braces ({` and `}`) which enclose `blocks`. The
    body of a class is one such block.


    # Statements


    A Block contains one or more Java statement(s), separated by semicolons. A statement
    is the smallest building block of Java.


    # Separators


    Some tokens are punctuation, such as periods `.`, commas `,`, and semicolons `;`.


    whitespace'
