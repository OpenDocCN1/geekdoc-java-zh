  md: 'In Java programming, classes are used to define objects and entities that hold
    particular data. To execute a Java program, a special class is required to assist
    in loading the program into the computer''s memory. Such a class contains a method
    with the following signature.


    ```

    public static void main(String[] args) {...}

    ```


    The class is said to have a main entry point defined and is usually called a Java
    program. The method described above as the main entry point is uniquely nicknamed
    the main method. Java classes without main methods are simply classes, although
    they may be part of a program.


    # Executing a command-line Java program


    If a class you compile with javac has a main entry point, you can execute the
    class by specifying the class name as an argument to the java program.


    This will run the main method in the Printdate class in the org.yahoo.util package.
    (Packages provide a convenient way to verify namespaces and organization of Java
    classes. We will use org.yahoos.util as a package name in this module. More on
    packages.)


    Your program will begin execution in the shell window. Inputs and outputs will
    be gathered from your shell window. On a Windows platform, you can use a DOS command
    window as the command shell program for the execution of Java programs. The JRE
    is normally called java because the java program is the most widely used java
    to execute programs.


    # Executing a Graphical User Interface Java program


    Rather than executing the console, the Java program would be executed in a separate
    Windows native process. This is typically done for Java applications that create
    their own graphical user interface (GUI) windows. The above-mentioned org.yahoo.util.Printdate
    program, which prints output to the output stream, is not appropriate for use
    with java as there is no console output. Instead, org.yahoo.util.View would be
    a program that creates its own windows to display the data.


    With java, IDE''s also manage the execution of Java programs in slightly different
    ways. They may provide shortcuts for running programs and windows for capturing
    the output.


    On UNIX/Linux this does not matter. If the program is launched graphically (by
    file association in a file manager) a console is not shown. GUI programs will
    have the titlebars following the look and feel of your desktop (KDE, GNOME, Fluxbox,
    XFCE) theme.'
