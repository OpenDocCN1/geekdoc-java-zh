  md: '# Installation


    # Check if Java is already installed


    The Java Development Kit (JDK) is necessary to build Java programs. The Java Runtime
    Environment (JRE) is necessary to execute Java programs. For our purposes, you
    must use a JDK. First, check to see if a JDK is already installed on your system.
    To do so, first open a terminal window or a command window and execute


    ```

    javac -version

    ```


    command. If the JDK is installed and on your executable path, you should see some
    output which tells you the version that is running. The output will vary depending
    on which version is installed and which vendor provided the Java installation.


    Here is the output on a RedHat Fedora Core 4 installation:


    ```

    $ java -version

    Eclipse Java Compiler 0.548, pre-3.1.0 milestone-6, Copyright IBM Corp 2000, 2005.
    All rights reserved.

    ```


    You may have other versions of Java installed; this command will only show the
    first in your PATH.


    If you get an error, such as


    ```

    javac: command not found

    ```


    then the JDK may not be installed or it may not be in your path. You can use your
    system''s file search utilities to see if there is a javac or javac.exe executable.
    If it is, and it is a recent enough (Java 1.4.2 or Java 1.5, for example), you
    should put the bin directory that contains javac in your system path. The Java
    runtime, java, is often in the same bin directory.


    If the installed version is older (i.e. it is Java 1.3.1 or Java 1.4.2 and you
    wish to use the more recent Java 5 release), you should proceed below with downloading
    and installing a JDK.


    # Download a Java Development Kit


    If a JDK is not already on your system, you should download one. For Sun’s Solaris
    operating systems, Microsoft Windows operating systems (Windows XP, Windows Server
    2000, Windows Server 2003, etc.), you can download the JDK from Sun. ForLinux,
    you can download the JDK'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'from Sun or install the free JDK available. For other operating systems, the
    system vendor probably has a download of the JDK (sometimes called a Software
    Development Kit or SDK), or you may have to download a product that includes the
    JDK. Be sure to select a JDK that matches not only your operating system but your
    hardware system.


    For example for Linux running on the x86 architecture, you can download an RPM
    (RedHat Package Manager) or a self-extracting .bin binary (such as jdk-1_5_0_06-linux-i586.bin
    for Pentium compatible machines) to get Java SE release 5. (The file name changes
    as new versions of Java are released).


    On Windows, you can download jdk-1_5_0_06-windows-i586-p.exe.


    # Install the JDK


    When you execute the installer, it will install the JDK files. Note: you will
    need administrator access to install the JDK. You can choose an installation location,
    such as c:\java\jdk5 on Windows or /var/local/java/5.0 on Linux or the default.
    This location is called the JAVA_HOME and it is customary but not necessary to
    define an environment variable which refers to that location.


    You may also have to modify your path so that it includes the <bin> subdirectory
    of your JAVA_HOME. You should put the JAVA_HOME/bin directory before other directories
    where Java is installed. The above installations may put the JRE, java (or java.exe)
    in system binary, but may not put all of the JDK executables in your path.


    You may need to restart your command shell in order to pick up environment variables
    for JAVA_HOME and PATH.


    # Install an IDE


    You may optionally choose to install an IDE. There are many free and commercial
    IDE’s available. For example, the Eclipse IDE found at http://www.eclipse.org
    includes many of the tools needed to build Java programs (such as a Java compiler,
    debugger, Javadoc, etc.) and you do not need to install a JDK if you opt to use
    Eclipse. However, Eclipse does require you to install a JRE - Eclipse is a Java
    program that runs within the JRE. The JDK download sites mentioned above include
    JRE downloads, and installation instructions are similar.


    Another Popular IDE for Windows is Borland’s JBuilder from http://www.borland.com


    And a Free IDE is JCreator LE from XINOX Software found at http://www.jcreator.com


    However, even if you choose to use Eclipse, it is recommended that you download
    and install the JDK. This will allow you to use scripts to build and test your
    Java software outside the IDE environment.'
