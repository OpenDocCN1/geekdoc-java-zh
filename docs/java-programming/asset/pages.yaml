  md: '# Execution


    There are various ways Java code can be executed. A complex Java application are
    usually using third party APIs or services. In this section we list the most popular
    way a piece of Java code may be packed together and/or executed.


    # JSE code execution


    Java language first edition came out in the client-server era. Thick clients were
    developed with reach GUI interfaces. Java first edition,JSE(Java Standard Edition)
    had/has the following in its belt:


    +   * GUI capabilities (AWT, Swing)

    * Network computing capabilities (RMI)

    * Multi-tasking capabilities (Threads)


    With the following Java code executions are possible:


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_33_0.png)


    Figure 1: Stand alone execution

    Stand alone Java application

    (Figure 1) Stand alone application refers to a Java program where both the user
    interface and business modules are running on the same computer. The application
    may or not use a database to persist data. The user interface could be AWT or
    Swing.


    The application would start with a main() method of a Class. The application stops
    when the main() method exits, or if an exception is thrown from the application
    to the JVM. Classes are loaded to memory and compiled as needed, either from the
    file system or a *.jar file, by the JVM.


    # Java ‘jar’ class libraries


    Utility classes, framework classes, and/or third party classes are usually packaged
    and distributed in Java *.jar files. These *.jar files need to be put in the CLASSPATH
    of the java program from which these classes are going to be used.'
