  md: 'The primitive type int represents a signed 32 bit integer value. The allowed
    data values for int are the integers between -2147483648 to 2147483647 inclusive.


    The set of operations that may be performed on int values includes integer arithmetic
    such as +, *, /, comparison operations (==, !=, <, >, >=), assignments (=, ++,
    --, +=, -=), bit-wise operations such as logical, or, logical, negation (&, ^,
    |), shift operations (<<, >>, >>>), conversions to other numeric types and promotion
    to other types.


    For example, to declare a private integer field named length, one would use the
    declaration


    ```

    private int length;

    ```


    # Example: String


    You use class and interface definition in Java to define new types. Class and
    interface types are associated with object references sometimes referred to as
    Reference types. An object reference has two main attributes:


    +   - Its type associated with a class or an interface

    - A java object reference, that is created by instantiating a class


    The String class is one example. String values are a sequence of 0 or more Unicode
    characters. The null reference is another valid value for a String expression.


    The operations on a String reference variable are those available for all reference
    types, such as comparison operations ==, != and assignment =


    The allowed operations on String object, however are the set of methods in the
    java.lang.String class, which includes length(), toString(), toLowerCase(), toUpperCase(),
    compareTo(String anotherString) and more...


    In addition, String objects also inherit the set of operations from the base class
    that String extends from, which is java.lang.Object. These operations include
    methods such as equals(), hashCode(), wait(), notifyAll(), and getClass().


    ```

    private String name = "Marry Brown";

    ```


    In the above example the name object reference''s attributes are:


    +   - Type: String'
