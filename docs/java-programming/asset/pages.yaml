    # # The JIT compiler


    The standard JIT compiler runs on demand. When a method is called repeatedly,
    the JIT compiler analyzes the bytecode and produces highly efficient machine code,
    which runs very fast. The JIT compiler is smart enough to recognize the code has
    already been compiled, so as the application runs, compilation happens only as
    needed. As Java applications run, they tend to become faster and faster, because
    the JIT can perform runtime profiling and optimization to the code to meet the
    execution environment. Methods or code blocks which do not run often receive less
    optimization; those which run often (so called hotspots) receive more profiling
    and optimization.


