  md: 'The Java package has one more interesting characteristics; the package name
    corresponds where the actual file is stored on the file system. And that is actually
    how the compiler and the class loader find the Java files on the file system.
    For example, the class `com.yourcompany.yourapplication.yourmodule.YourClass`,
    is stored on the file system in the corresponding directory : com/yourcompany/yourapplication/yourmodule/YourClass.
    Because of this package names should be lower case, since in some operating systems
    the directory names are not case sensitive.'
