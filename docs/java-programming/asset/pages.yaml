  md: 'Usually there is more than one class created and those files are packaged to
    a application_name.jar file to distribute to run in any hardware.


    IDEs manage this process automatically. For example, Eclipse contains its own
    Java compiler and does not use javac directly. It automatically compiles the Java
    source files when you save them. The use of IDE''s as Eclipse are beyond the scope
    of this module, however, so consider the IDE''s tutorials and help to see how
    they provide a Java programming environment.


    # The bytecode


    It is clear from the above paragraph that the Java compiler source text files
    with the extension .javac into executable code confined into a class file with
    the .class extension. Such code is called Bytecode.


    In many languages prior to Java, the source code would generally compile into
    the machine-code for the particular machine the program was compiled. Therefore,
    if a program was compiled on an X86 machine, it would run only on an X86 machine
    and no other. Java, on the other hand, produces a bytecode - an intermediate binary
    form of code that is a portable representation of a Java class. Any Java Virtual
    Machine on any hardware/operating system platform can then execute this bytecode.
    There are some restrictions to this portability: For example, a Java ME system
    cannot execute all programs compiled for the Java SE environment because Java
    ME is pared down to small devices. But in general, a Java SE program can run unmodified
    on any Java SE machine.


    # The JIT compiler


    Being compiled halfway through, it is the job of the Java Virtual Machine to compile
    the rest of the program to native code at the time of its execution making Java
    follow the "Write Once, Run Anywhere" (WORA) policy. The compiler used to compile
    bytecode into machine-code at runtime is the Just-In-Time or JIT compiler. Once
    a piece of code is compiled by the JVM to execution code, the code is used and
    re-used again and again, to speed up execution.


    # The Java Runtime Environment


    The Java Runtime Environment, or JRE, is responsible for the execution of Java
    programs. The Sun JDK also includes the JRE. The JRE however can be installed
    and without installing the JDK which is useful if you wish to execute Java programs
    but not build them. The JRE helps load Java programs into the memory and executes
    them.


    # Main entry point'
