  md: "+   - Collections\n- Exceptions\n- Concurrent Programming\n- Reflection\n-\
    \ Applets\n- JavaBeans\n- Libraries\n\nThis page describes some techniques for\
    \ preventing NullPointerException. It does not describe general techniques for\
    \ how you should program Java. It is of some use, that to make you aware of null\
    \ values, and you need to be more careful about generating them yourself. Note\
    \ that this list is not complete - there are no rules for preventing NullPointerException\
    \ entirely in Java, because the standard libraries have to be trusted during the\
    \ used, and they can cause NullPointerExceptions. Also, it is possible to observe\
    \ an uninitialised final field in Java, so you can't treat a final field as completely\
    \ trusted during the object's creation. A good approach is to learn how to deal\
    \ with NullPointerExceptions first, and become competent with that. These suggestions\
    \ will help you to cause less NullPointerExceptions, but they don't replace the\
    \ need to know about NullPointerExceptions.\n\n# ## Minimize the use the keyword\
    \ 'null' in assignment statements\n\nThis means not doing things like:\n\n```\n\
    String s=null;\nwhile (something) {\n  if (something2) {\n    s=\"yep\";\n   \
    \ if (!s=null) {\n      something3(s);\n    }\n  }\n}\n```\n\nYou can replace\
    \ this with:\n\n```\nboolean done=false;\nwhile (!done && something) {\n  if (something2)\
    \ {\n    done=true;\n    something3(\"yep\");\n  }\n}\n```\n\nYou might also consider\
    \ replacing null with \"\"\" in the first example, but default values bring bugs\
    \ caused by default values being left in place. A NullPointerException is actually\
    \ better, as it allows the runtime to tell you about the bug, rather than just\
    \ continue with a default value."
