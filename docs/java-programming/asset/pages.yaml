    Addition to the java.util.Collection interface, the Java JDK has the java.util.Map
    interface, as well. defines key mappings. Implementations of the Map interface
    do not contain collections of objects, rather they collections of key->value mappings.


    ```

    import java.util.Map;

    import java.util.HashTable;

    Map map = new HashTable();

    map.put( key, value );

    ```


    All collections need to have the same operations. to the collection Those are:


    +   - Adding(s) to the collection

    - Removing(s) from the collection

    - Obtaining the number of elements in the collection

    - Listing the contents of collection, (Iterating through the collection)


    Before selecting a particular collection implementation, ask the following question:


    +   - Can my collection contain the same elements, i.e. are duplicates allowed?

    - Can my collection contain the null element?

    - Should the collection maintain the order of the elements? Is the order important
    in any way?

    - How do you want to access an element, index, key or just with an iterator?

    - Does the collection need to be synchronized?

    - From a performance perspective, which one needs to be faster, updates or reads?

    - From a usage perspective, which operation will be more frequent, updates or
    reads?


    Once you know your needs, you can select an exissing implementation. But first
    decide if you need a ''Collection'', or a ''Map''.


