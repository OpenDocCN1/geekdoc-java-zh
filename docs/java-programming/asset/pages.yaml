    # Similar Platforms


    The success of Java and its once once, run any concept has also led to other similar
    efforts. The most notable of these is the Microsoft .NET platform, which borrows
    many of the concepts and innovations of Java; in fact, it is an implementation
    of a Java-like language called Visual J# (formerly known as J++). It is Java-like
    in that J# is not the Java language. Instead, J# contains non-standard extensions
    of the language.


    Later Microsoft stopped, withdrew its J# support, and created a new language called
    C#. C# is very similar to J# and Java, but not compatible with them. The differences
    between Java and C# can be read at w:Comparison of C Sharp and Java.


