  md: 'A copy constructor is generally not seen in the Java language, but it''s important
    to understand what it is. As the name implies, a copy constructor creates a new
    instance to be a duplicate of an already existing one. In Java, this is usually
    accomplished by creating the instance with the default constructor, and then using
    the assignment operator to equivocate it. This is not possible in all languages
    though, so just keep the terminology under your belt.


    # Type


    When an object is created, a reference to the object is also created. The object
    can not be accessed directly in Java, only through this object reference. This
    object reference has a Type assigned to it. We need this Type when passing the
    object reference to a method as a parameter. Java does strong Type checking.


    Type is basically a list of features/operations, that can be performed through
    object reference. The object reference Basically is a contract that guarantees
    that those operations will be at run time.


    When a car is created, it comes with a list of features/operations listed in the
    user manual that guarantees those will be when the car is used.


    When you create an object from a class by default its Type is the same as its
    class. It means that all the features/operations the class define are there and
    available, and can be used. See below:


    ```

    new ClassName().operations();

    ```


    You can assign this to a variable having the same Type as the class:


    ```

    ClassName objRefVariable = new ClassName();

    ObjRefVariable.operations();

    ```


    You can assign the created object reference to the super class, or to an interface
    the class implements:


    ```

    SuperClass objectRef = new ClassName(); // features/operations list are defined
    by the

    SuperClass class


    Interface inter = new ClassName(); // features/operations list are defined by
    the

    interface

    ```


    In the car analogy, the created car may have different Type of drivers. We create
    separate user manuals for them, Average user manual, Power user manual, Child
    user manual, or Handicapped user manaul. Each type of user manual describes only
    those feathers/operations appropriate for'
