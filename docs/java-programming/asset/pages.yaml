  md: '# Packages


    # Java Package / Name Space


    Usually a Java application is built by many developers and it is common that third
    party modules/classes are integrated . The end product can easily contain hundreds
    of classes. Class name collision is likely to happen. To avoid this a Java class
    can be put in a "name space". This "name space" in Java is called the package.


    The Java package needs to be unique to avoid name collisions. For reason Vendors
    usually use their domain in reverse order. It is guaranteed to be unique. For
    example a company called ''Your Company Inc.'', would use a package name something
    like this: com.yourcompany.yourapplicationname.YourClass.


    To put a class in a package, the package keyword is used at the top of each class
    file. For Example,


    ```

    package com.yourcompany.yourapplication.module;

    ```


    When we want to refer a Java class that is defined outside of the package, "name
    space", then we have to specify which package,name space that class at. So we
    could refer that class like this: com.yourcompany.yourapplication,module.YourClass
    . To avoid to type in the package name each time we want to refer to an outside
    class, we can declare which package the class by using the import Java keyword
    at the top of the file. For Example,


    ```

    import com.yourcompany.yourapplication.module.YourClass;

    ```


    Then we can refer to that class by just using the class name : YourClass.


    In rare cases it can happen that you need to refer to two classes having the same
    name in different packages. In those cases you not use the import keyword for
    both classes. One of them needs to be referenced by typing in the whole package
    name. For Example,


    ```

    package com.mycompany.myapplication.module;

    ...

    import com.yourcompany.yourapplication.youmodule.SameClassName;

    ...

    sameClassName yourObjectRef = new SameClassName();

    com.hercompany.herapplication.hermodule.SameClassName herObjectRef = new

    com.hercompany.herapplication.hermodule.SameClassName();

    ```'
