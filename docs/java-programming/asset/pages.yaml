    * Static imports - Lets you import all the static part of a class.

    * Metadata - Lets you avoid boilerplate code, by enabling tools to generate it
    from annotations the source code. This leads to a “declarative” programming style
    where the programmer says what should be done and tools emit the code to do it.

    * JVM Improvements - Most of the run time library is now mapped into memory as
    a memory image, as opposed to being loaded from a series of class files. Large
    portion of the runtime libraries will now be shared among multiple JVM instances.


