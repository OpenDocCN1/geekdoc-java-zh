  md: '# History


    The Java programming language was created by James Gosling and other engineers
    at Sun Microsystems. It was developed in 1991, as part of the Green Project, and
    officially announced on May 23, 1995, at SunWorld; Java was initially designed
    as a replacement for C++ (although the feature set is more similar to Objective
    C) and known as Oak (in honour of a tree outside Gosling''s office); however,
    Oak was previously copyrighted. More on the history of Java can be found in the
    article about the Java platform, which includes the language, the Java virtual
    machine, and the Java API. Java is owned by Sun Microsystems; the term Java is
    a trademark of Sun Microsystems.


    # Versions


    ![](img/4e89b81da69e356cec19bc7ce6e739a0_10_0.png)


    The revisions and version of Java over the years.


    +   * JDK 1.0, 1996: Solaris, Windows, Mac OS Classic, Linux

    * JDK 1.1, 1997: Solaris, Windows, Mac OS Classic, Linux

    * JDK 1.2 (also known as Java 2), 1998: Solaris, Windows, Linux, ?

    * JDK 1.3, 2000: Solaris, Windows, Mac OS X, Linux

    * JDK 1.4, 2002: Solaris, Windows, Mac OS X, Linux

    * JDK 5.0, 2004 (formerly called 1.5)


    # 1.0 Initial Release


    Java was initially released as the Java Development Kit 1.0 (JDK 1.0). This included
    the Java runtime (the virtual machine and the class libraries), and the development
    tools (e.g., the javac compiler). Later, Sun also provided a runtime-only package,
    called the Java Runtime Environment (JRE). The first name stuck, so usually people
    refer to a particular version of Java by its JDK version (e.g., JDK 1.0).


    # 1.2 Java Platform


    The JDKs of version 1.2 and later versions are often called Java 2 as well. For
    example, the official name of JDK 1.4 is The Java™ 2 Platform, Standard Edition
    1.4.


    Major changes include:


    +   * Rewrite the event handling (Add Event Listeners)

    * Change Thread synchronizations'
