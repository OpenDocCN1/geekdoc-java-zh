  md: "# Compilation\n\nWe have already discussed compilation basics . Here's a recap\
    \ of the concepts we've seen earlier and some additional details. \n\n# Compiling\
    \ to bytecode\n\nIn Java, programs are not compiled into executable files; they\
    \ are compiled into Bytecode (as discussed earlier), which the JVM executes at\
    \ runtime. Java source code is compiled into bytecode when we use the javac compiler.\
    \ The bytecode saved on the disk with the extension .class. When the program is\
    \ to be run, the bytecode is converted, converted by the Just-In-Time(JIT) compiler.\
    \ The result is machine code which is fed to the memory and is executed.\n\nSo\
    \ Java has two step compilation:\n\n+   * Step one to create byte-code\n* Step\
    \ two to create machine level code\n\nThe Java classes/Byte Codes are compiled\
    \ into machine code and loaded into memory by the JVM when needed the first time.\
    \ This is different from other languages like C/C++ where the whole program had\
    \ to be compiled to machine code and linked to create an executable, before the\
    \ program could start.\n\nJIT compilers compile byte-code once and the compiled\
    \ machine code are re-used again and again, to speed up executions. A better name\
    \ for JIT would be \"Compile only once\" compilers, COO, or \"Just-one-time\"\
    \ compilers, JOT. Early Java compilers compiled the byte-code to machine code\
    \ each time it was used, that was slow. It still faster than an \"interpreter-language\"\
    , where code is compiled from high level language, not from byte-code each time\
    \ it was used.\n\n# Automatic Compilation of Dependent Classes\n\nIn Java, if\
    \ you have used any reference to any other object, the class for that object will\
    \ be automatically compiled, if it was not compiled already. These automatic compilations\
    \ are nested, and this continues until all classes are compiled that are needed\
    \ to run the program. So it is enough to compile only the high level class, all\
    \ the dependent classes will be automatically compiled.\n\n```\njavac ... MainClass.java\n\
    ```"
  merge: -1
