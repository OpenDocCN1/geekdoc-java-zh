  md: '# Types


    Types in Java define the allowed data values and the operations that may be performed
    on those values. Each expression, field, method parameter, local variable, and
    method return values, have an associated type. The syntax template for a field
    declaration in Java is


    ```

    [Modifiers] TypeFieldName [''=''] Expression];

    ```


    Method, method parameter, and local variables have similar syntax: optional modifiers,
    a required type, and the name of the value being declared.


    In java, there are two different kind of Types, those are:


    +   * Primitive Type

    * Object Reference Type


    # About Types


    Java is strongly typed in all expressions and declarations have types (either
    declared or inferred) the language only allows programs that adhere to the type
    constraints. You cannot write a statement or expression in Java which directly
    invokes an operation on a value that is not allowed by that value''s type, nor
    can you perform assignments that violate the type system: you cannot assign a
    String value to an integer type variable. This helps achieve a high level of type
    safety in Java. Some type errors can still occur at runtime because Java supports
    a cast operation which is a way of changing the type of one expression to another.
    Java performs runtime checking when doing casts, so an incorrect type cast will
    cause a runtime exception rather than silently allowing data corruption.


    Java ia also known as a hybrid language. While supporting object oriented (OO)
    programming, Java is not a pure OO language like Smalltalk or Ruby. Instead, Java
    offers object types and primitive types. Primitive types are used for boolean,
    character, and numeric values and operations. This allows relative good performance
    when manipulating numeric data, and at the expense of flexibility. For example,
    you cannot subclass the primitive types and add new operations to them.


    # Examples of Types


    Below are two examples of Java types and a brief description of the allowed values
    and operations for these types. Additional details on each are available in other
    modules.


    Example: int'
