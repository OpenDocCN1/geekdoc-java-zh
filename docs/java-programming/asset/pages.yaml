  md: '# # Classes, Objects and Types


    # ## Objects and Classes


    An **object** is composed of **members** and **methods**. The members, also called
    *data members*, *characteristics*, *attributes*, or *properties*, describe the
    object. The methods generally describe the actions associated with a particular
    object. Think of an object as a noun, its members as adjectives describing that
    noun, and its methods as the verbs that can be performed by or on them.


    For example, a sports car is an object. Some of its members might be its height,
    weight, acceleration and speed. An object''s members just hold data about that
    object. Some of the methods of the sports car could "drive", "park", "race", etc.
    The methods really don''t mean much unless associated with the sports car, and
    the same goes for the members.


    The blueprint that lets build our sports car is called a class. A class tells
    us how fast our sports car goes, or what color it is, but it tells us that sports
    car will have a member representing speed and color, and that they will be, a
    number and (or hex code), respectively. The class also lays out the methods for
    us, telling us how to park and drive, but these methods can''t take any action
    with the blueprint - they need an object to have an effect.


    # ## Instantiation and Constructors


    In order to get from class to object, we "build" our object by **instantiation**.
    Instantiation simply means to create an **instance** of class. Instance and object
    are very similar terms and are sometimes interchangeable, but remember that an
    instance refers to a specific object, which was created from a class.


    This instantiation is brought about by one of the class''s methods, called a **constructor**.
    As its name implies, a constructor builds the object based on the blueprint. Behind
    the scenes, this means that computer memory is being allocated for the instance,
    and values are being assigned to the data members.


    There are three constructor types: default, non-default, and copy.


    **A default constructor** will build the most basic instance. Generally, this
    means assigning all the members like null, zero, or an empty string. Nothing would
    stop you however, from your default sports car color from being red, but this
    is generally bad programming style. Another programmer would be confused if your
    basic car comes out instead of gray, colorless.


    **A non-default constructor** is designed to create an object instance with prescribed
    values for most, if not all, of the object''s members. The car is red, goes from
    0-60 in 12 seconds, tops out at 190mph, etc.'
