  md: '# Multidimensional Arrays


    This example begins by creating an Array object, VarArray. However, this example
    does something different from what you''ve seen in the past. There''s a parameterized
    entry for ArrayList, <Integer>. Java developers create something called generic
    class that you won''t see demonstrated in this book, but which you''ll encounter
    as you work with Java. Generic class acts as a template for specific object types.
    You can use the same code to create classes that work only with an Integer or
    a String. This is an advanced topic, but for now, you need to know that for the
    parameter, <Integer> takes the ArrayList and creates a type-specific ArrayList
    that accepts only integer values. Using strong typing (a programming technique
    where the compiler checks the type of each variable that goes into the ArrayList)
    will reduce the amount of errors in your application because the compiler is better
    aware of the intent of your code. In addition, strong typing reduces the amount
    of code you have to write.


    This example relies on the user to provide input values in a specific range using
    the Input argument. These values are collected for display in String, Output.
    A Scanner, GetNumber, provides the means for obtaining user input.


    The while loop continues to collect input from the user until the user provides
    a value less than 0 — an incorrect input, in which case it appears in a try. The
    input and associated GetNumber.nextInt() catches any potential problems from the
    input using catch structure to avoid any. This example shows one method of recovering
    from an input error that makes it possible for the loop to continue running.


    When an application requires that the user provide certain values, it must perform
    range checking. In this case, the try...catch structure already excluding that
    isn''t right, so the range check looks for numbers between 1 and 10. When the
    user inputs a value outside that range, the code displays an error message and
    then lets the user try again. Note that the range check is written allows the
    user to input the value of -1 required to end the application (the line that says
    if (Input < 0).


    # LINGO


    > A generic class is one that provides a single implementation for any sort of
    object you want to work with. You tell Java the specific kind of object you want
    to use in an instance by providing a parameter within brackets <> after the type
    declaration. For example, ArrayList alone creates a raw object that can accept
    any input, while ArrayList<Integer> creates an object that will accept only Integer
    values. There are situations when you use a raw type, such as when the ArrayList
    needs to accept all objects of types, and situations when the parameterized, such
    as the ArrayList<Integer> needs to accept only Integer objects.'
