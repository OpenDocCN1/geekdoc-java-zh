    # Performing Math Tasks with Arithmetic Operators


    Most applications rely on math operations to perform part of their work, even
    when the user is unaware of much math. As this book progresses, you''ll use math
    to perform tasks such as keeping track of the application status. Just how this
    happens is unimportant for now, but it is important to know that you use math
    relatively uncommon when working with applications. Here''s a rundown on common
    math operators used in this book:


    +   * Performs multiplication of the values within two variables.

    / Divides the value within the variable on the right side of the operator by the
    value on the variable on the left side of the operator. The remainder is discarded
    when working with integer types.

    / Divides the value within the variable on the right side of the operator by the
    value on the variable on the left side of the operator. However, in this case,
    the result is the remainder, rather than the quotient.

    + Performs addition of the values within two variables.

    - Subtracts the value of the variable on the right side of the operator from the
    value of the variable on the left side of the operator.


    The following sections describe how to perform common math tasks using the math
    operators. These sections are only an introduction to the topic. You''ll see math
    operators used in the majority of the examples in this book.


    # Performing simple math tasks


