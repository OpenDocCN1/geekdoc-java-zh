  md: '# Summing Up


    Java Community Process (JCP): A group dedicated to making Java a better language.
    Members of this group help improve standardization, discuss language additions,
    and work on fixes for language errors (bugs).


    Java Development Kit (JDK): A special kind of SDK used specifically to write and
    test Java applications.


    Java Runtime Engine (JRE): The special piece of software used to run Java applications.


    object-oriented programming (OOP): A form of programming that makes development
    simpler by packing data and code together in a way that makes it easier to access
    and manage. OOP relies on the use of objects that correspond to real world entities.
    As with real world objects, OOP relies on properties to describe the object, methods
    to interact with the object, and events to let the object communicate with the
    outside world.


    package: A container used to combine a number of classes into an easily accessible
    whole. A package wraps the classes so that you can find them with greater ease.


    platform: A combination of hardware and operating software that creates a specific
    environment in which to run Java applications.


    Software Development Kit (SDK): A combination of tools and software used to provide
    an application development environment.


    variable: A kind of box used to hold information in an application.'
