    The for loop makes it possible to specify precisely how many times to perform
    a task, as shown on page........187


    # 2. Can the application stop performing tasks in the loop when some expectation
    isn''t met?


    Using the break statement makes it possible to stop performing a task when conditions
    aren''t right, as described on page........189


    # 3. Is it possible to continue processing a for loop after Interrupting a single
    loop?


    The continue statement makes it possible to ignore just one loop (a single value)
    and then continue processing the next task, as described on page........191


    # 4. What happens if I don''t know how many times to perform a task in advance?


    Using a while loop controls how many times a task is performed using an expression
    instead of a precise count, as demonstrated on page........197


    # 5. An expression could be false, which means the code in a while loop would
    never execute. How do I ensure a task is performed at least once?


    Using a do . . . while loop ensures that a task is performed at least once, but
    after the first loop, the expression controls whether the loop is repeated, as
    shown on page........199


    # 6. How is it possible to perform tasks on an unknown number of elements and
    ensure each element is processed?


