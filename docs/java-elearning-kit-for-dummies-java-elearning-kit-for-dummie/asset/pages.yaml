    \n+   - Missing braces: Anytime you want a Java feature to multiply multiple lines\
    \ of code, you must enclose the entire block within curly braces {}. In most cases,\
    \ the compiler will catch this for you. For example, if you try to end a class\
    \ without the closing curly brace, the compiler will generate an error. This is\
    \ one error because the compiler may not show you the precise location of the\
    \ brace is missing — it simply knows that one is missing. This sort of error can\
    \ also create runtime errors. For example, when an statement is supposed to apply\
    \ to multiple lines of code, but you leave out the curly brace, the statement\
    \ only affects the next line of code, and the application works incorrectly.\n\
    \n+   - Forgetting the class or object name as part of a method call: You always\
    \ include the class or object associated with a method before making the method\
    \ call. For example, Character.toUpperCase() and System.out.print() are correct,\
    \ but simply calling toUpperCase() or print() is incorrect.\n\n+   - Omitting\
    \ the break clause from switch statements: It's easy to forget to add the break\
    \ clauses to a switch statement. In addition, the compiler won't catch this error.\
    \ As a consequence of leaving the break clause, your application will continue\
    \ to execute the code in a switch statement until it encounters a break clause\
    \ or the switch statement is complete."
