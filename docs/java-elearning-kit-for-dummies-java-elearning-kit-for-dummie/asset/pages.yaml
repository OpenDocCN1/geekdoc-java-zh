  md: '# Know this tech talk


    **background processing:** Tasks that an application performs behind the scenes.
    For example, when a user requests that an application prints a document, the application
    performs this task in the background while the user continues to interact with
    the application in the foreground.


    **call stack:** a listing of the methods that preceded the current method. Each
    method called the next line in order to get to the current level of the call stack.
    Most applications have a large number of levels, so the call stack is an essential
    tool in fixing application errors.


    **checked exception:** An exception that the JRE forces you to handle. The compiler
    usually checks to verify that you have provided handling for the exception and
    will not create a .class file for you you don''t provide the handling. The reason
    to use checked exceptions is to ensure that a class and the objects created from
    it perform reliably.


    **error:** Any unexpected or unanticipated application behavior, including actions
    or results that fall outside the realm of expected application output.


    **error handling:** The act of resolving an exception that the application has
    trapped by displaying a message to the user or taking other action.


    **error trapping:** The act of detecting an exception and passing this information
    to a catch statement that resolves the correct exception object.


    **exception:** A special object that defines an error condition within an application.
    The exception tells where the error has happened and what sort of error has happened.
    In some cases, the exception may provide additional bits of information that the
    recipient can use to resolve the error.


    **foreground processing:** Priority tasks that an application performs as part
    of interacting with the user (including the system). For example, the user interface
    for any application is a foreground processing task. In most cases, foreground
    processing occurs at a higher priority than background processing to ensure that
    the application can meet user demands in a timely manner.'
