  md: '# Summing Up


    +   - The JCP provides input on how Java should continue to change as a language.


    +   - You can use any text editor to write Java applications, but using an IDE
    provides some significant advantages in the form of color coding, help, and convenience.


    +   - Installing either the JDK or the JRE will let you run Java applications
    on your machine.


    +   - To obtain the best functionality, the version of Java supported by your
    JRE must match the version of Java supported by the JDK used to write the application.


    +   - When manually creating applications for Java, especially on Windows systems,
    you must ensure that your system has a path configured to find the Java executable
    files.


    +   - An IDE will normally locate and configure the Java executable path automatically
    for you.


    +   - Classes contain both methods and other classes.


    +   - The javac command compiles your application from the source code you provide.


    +   - The java command runs an application in a command window, whereas the jav
    command runs an application without a command window.


    +   - Java supports both single-line and multiline comments, both of which document
    your application so you can remember what it does later.


    +   - The Java API is so huge that you can''t memorize it, but you can memorize
    the parts you use most often.


    +   - When you use the Java API, you normally access a class hierarchy, such as
    java.lang.String.


    +   - Import an entire package when you need to use more than one class from it.


    +   - Local help has the advantages of being more reliable and faster than remote
