  md: "# Observing scope within a block\n\nDevelopers often experience problems figuring\
    \ out why an application is misbehaving when encountering a block access problem.\
    \ The basic guideline is that any variable you create in a block is defined only\
    \ within that block. For example, when you look at the following code, you see\
    \ a typical block access scenario.\n\n```\n// Create a variable inside a block.\n\
    for (int i = 0; i < 10; i++)\n```\n\n```\n// Display the value of that variable.\n\
    System.out.println(\"The value of i is: \" + i);\n```\n\n```\n// Access outside\
    \ the block doesn't work.\nSystem.out.println(\"The value of i is: \" + i);\n\
    ```\n\nThe example displays the value of i within the for loop (a type of block)\
    \ without problem. However, trying to access i outside the block is impossible\
    \ because the variable isn't defined. The compiler will catch this error.\n\n\
    Another problem occurs when a variable is defined in the application and also\
    \ within a block. Because this situation is likely to create problems, newer versions\
    \ of Java won't allow the sort of code shown here:\n\n```\npublic static void\
    \ main(String[] args) {\n    // Define a variable.\n    int i = 0;\n\n    // Create\
    \ a variable inside a block.\n    for (int i = 0; i < 10; i++) {\n\n        //\
    \ Display the value of that variable.\n        System.out.println(\"The value\
    \ of i is: \" + i);\n\n    }\n    // Access outside the block doesn't work.\n\
    \    System.out.println(\"The value of i is: \" + i);\n}\n```\n\nThe compiler\
    \ won't always prevent you from shooting yourself in the foot. In many situations,\
    \ the developer does something with the variable and doesn't understand the consequences.\
    \ For example, the following code is perfectly legal in Java:\n\n```\npublic static\
    \ void main(String[] args) {\n    // Define a variable.\n    int i = 0;\n```"
