  md: '# Chapter 9


    +   * Package: The container used to hold a number of classes. When with a simple
    directory structure, as the examples in this book do, the package is a directory
    that holds a number of .class files.


    +   * Class: A class usually resides in a single .java file that you compile into
    a .class file. It contains a single class declaration.


    +   * Method: An element resides in the class or as part of a method. The method
    acts as a container to hold the element.


    +   * Block: An element can reside within a code block, such as a for loop.


    Scope partially depends on the location used to declare an element. For example,
    a variable that is defined within a block (such as a for loop) is visible only
    within that block. When you try to use the variable outside of the block, Java
    displays an exception. Table 9-1 describes the various levels of scope within
    the Java environment.


    | Table 9-1 Java Scoping Rules |

    | Visibility | private | (default) | protected | public |

    | Accessible from the class | X | X | X | X |

    | Accessible from the package | | X | X | X |

    | Accessible from any child class | | | X | X |

    | Accessible anywhere | | | | X |


    Table 9-1 shows how the default scope fits into the scheme of things. For example,
    if you declare a method by using the default scope, you can use it as long as
    it resides in the same package. In addition, if you create a class that inherits
    from the class containing the method, the subclass can use the method as long
    as it resides in the same package. However, if the subclass exists outside the
    current package, it can''t use the method. In short, the default scope is a little
    more restrictive than the protected scope but less restrictive than the private
    scope.


    In the following, you create a parent class that has methods with a private, default,
    protected, and public scope. You create a child class that attempts to access
    these methods. In a different folder, you create another child class that attempts
    to access these methods as well (so you can see the difference between default
    and private scoping). Finally, you add an application to test everything.'
