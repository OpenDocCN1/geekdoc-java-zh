  md: 'Just as about everyone makes lists. You create a grocery list before going
    to the store and create lists of tasks you must perform at work. Lists are a natural
    way of keeping track of data of various sorts. Java provides lists in the form
    of arrays. The easiest way to think of arrays is as electronic lists that help
    you manage the data in your application.


    Not every list has one dimension. For example, you might end up creating a table
    that not only tells what to do, but when and where to do it. Tables are two-dimensional
    — they are composed of rows and columns. People naturally create tables when they
    need to track data that''s too complex for a simple list. Likewise, Java provides
    you with access to two-dimensional arrays that work much like tables.


    > LINGO

    Array is a kind of electronic list. It''s a grouping of individual data values
    — normally of the same type — that you treat as a single entity. You use an array
    as a sort of container for managing a list of data.


    Sometimes you need even than two dimensions. For example, when you decide to manage
    stock in a warehouse, you use a three-dimensional list to do it — height, width,
    and depth. Woodworkers commonly use three-dimensional lists, to do. In facts,
    humans use multi-dimensional lists all the time without really thinking about
    it. Java can meet your needs in this regard well.


    > LINGO

    A stack is a special type of array that forces you to remove the last item you
    added to the first list. This is a Last, First Out Out (LIFO) structure that acts
    much like a stack of pancakes, where you take the topmost pancake from the stack
    first when you''re having breakfast.


    Arrays could meet every list needing. However, some forms of special lists are
    so common that Java provides special objects for them. For example, when you''re
    making pancakes, you often create a stack of them. When you finish the stack,
    you take the last item you put on it and then move toward the first item. Likewise,
    we are all familiar with lines queues at the bank and shopping center, where the
    first person in line is also the first person to leave. Java provides an assortment
    of special list types that are really offshoots of the array but provide special
    loop for managing the list with greater ease: stack, queue, and deque (double-ended
    queue).


    > LINGO

    A queue is a special type of array that forces you to remove the first item you
    added to the first list. This is a First, First Out (FIFO) structure that acts
    much like a line at the bank. The first person in line is the first person served.'
