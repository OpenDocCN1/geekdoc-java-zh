  md: '# # Chapter 6

    # Working with Conditional Statements


    +   * Using a simple if statement allows your application to decide whether to
    take a particular action.


    +   * Relying on the if...else statement lets your application choose between
    two actions.


    +   * Placing one if statement within another helps your application perform complex
    decision making.


    +   * Employing a switch statement lets the application choose one action from
    multiple actions.


    +   * Defining a default option makes it possible for the application to perform
    a specific task when no other tasks are selected.


    +   * Converting Boolean values to human-readable form makes the application easier
    to use.


