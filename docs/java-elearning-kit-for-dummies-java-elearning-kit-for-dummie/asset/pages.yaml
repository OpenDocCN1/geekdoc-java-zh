    # Working with Lambda Expressions


    Many things could be said about lambda expressions — all of them are confusing.
    The easiest way to think about lambda expressions is as a concise form of anonymous
    class. You use lambda expressions when an anonymous class would have a single
    functional interface that has only one method.


    > A lambda expression provides a shortened version of an anonymous class that
    has one functional interface and one method. Lambda expressions make it possible
    to perform tasks extremely fast and with little code. The terseness that lambda
    expressions provide makes it easier to focus on the purpose of the code rather
    than the coding structure.


    Lambda expressions rely on a shorthand method for defining what they perform that
    lends elegance to your application code. You use the arrow operator (--) to define
    the two parts of a lambda expression. The left side defines any arguments input
    to the method in the interface, while the right side contains the interface implementation
    as defined by that method. The following example makes things lot clearer for
    you as you work through your first lambda expression.'
