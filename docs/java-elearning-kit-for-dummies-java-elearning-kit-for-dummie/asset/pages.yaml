    # Using the continue statement


    So far, you''ve seen a version of the loop that performs a specific number of
    loops and another version that stops at a specific point using a break statement.
    A third version of the loop performs a specific number of loops, but skips some
    of the loops when conditions do not warrant performing the task. For example,
    the data that you need to process might not be of the right type or might be missing
    completely. This third form relies on the continue statement. The continue statement
    tells the loop to go immediately to the next loop, rather than complete the current
    loop.


    The best way to understand the difference between the break and continue statements
    is to contrast the output they provide. In the following exercise, you create
    an application that works almost precisely the same as the


    > EXTRA INFO

    Because the examples in this chapter look at the break and continue statements
    separately, does that mean you can''t combine them in a single loop. The break
    and continue statements can appear anywhere whenever you need them. For example,
    you could choose to process a for loop and then continue in the next loop if things
    aren''t working as expected. If an error occurs in the same loop, you could choose
    to use a break statement to end it. A for loop can also contain multiple instances
    of both the break and continue statements.'
