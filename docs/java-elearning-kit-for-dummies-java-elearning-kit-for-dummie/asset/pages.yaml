  md: '# Chapter 10


    The following sections describe a special sort of collection called a Map. The
    Map is an incredibly useful sort of storage container that makes many tasks easier.


    Before you go any further though, always remember that every time you add functionality
    to a class, it causes an increase in class size. In addition, the class grow more
    slowly and can become harder to understand. If an array will serve the purpose
    in your application, use an array. Only use a Map when you need the specialized
    functionality that an array provides.


    ![](img/e352a1505e4e30ed140c4898f6139f17_337_0.png)


    # Defining the Map


    The Map, like basic container classes in Java, is actually an interface. A Map
    describes a class that provides a key and value pair for storing information.
    The key gives the data a unique name. No two entries can have the same key, which
    makes it possible to search for the key and always return a unique value. Any
    number of keys can have the same associated value.


    As with any interface, you must create an implementation before you use it. The
    Map is so incredibly useful that Java has a host of Implementing classes associated
    with it. Here is the list of classes you use to create a Map (again, you don''t
    need to worry about the specifics of these classes for now — you''ll begin to
    understand these differences as you create more Java applications):


    +   - AbstractMap

    - Attributes

    - AuthProvider

    - ConcurrentHashMap

    - ConcurrentSkipListMap

    - EnumMap

    - HashMap

    - Hashtable

    - IdentityHashMap

    - LinkedHashMap

    - PrinterStateReasons

    - Properties'
