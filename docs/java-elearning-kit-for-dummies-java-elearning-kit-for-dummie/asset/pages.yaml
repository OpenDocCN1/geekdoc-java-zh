  md: "# Chapter 8\n\nYou'll encounter other types of semantic errors as the book\
    \ progresses. For now, these are the most common problems you should look for\
    \ in your code. Semantic errors tend to be harder to find than syntactical errors\
    \ but not nearly hard as logical errors.\n\n# Logical\n\nLogical errors can be\
    \ extremely difficult to find because they don't reflect any sort of coding problem\
    \ or an error in the use of Java language elements. The code runs perfectly as\
    \ written — it just isn't performing the task that you expected it to. As a result,\
    \ logical errors can be the hardest to find. You need to spend time going through\
    \ your code looking for a reason for the error. Here's a list of common logical\
    \ errors that developers encounter:\n\n+   Using incorrect operator precedence:\
    \ The order in which Java interprets operators is important. Applications often\
    \ produce the wrong result because the developer didn't include parentheses in\
    \ the correct places. For example the following example produces outputs of 11,\
    \ 13, 9, and 8 from the four variables, all due to the location (or lack of) the\
    \ parentheses.\n\n```\npublic class OperatorError {\n    public static void main(String[]\
    \ args) {\n        // Create some variables.\n        int MyVar1 = 5 + 4 * 3 /\
    \ 2;\n        int MyVar2 = (5 + 4) * 3 / 2;\n        int MyVar3 = (5 + 4) * (3\
    \ / 2);\n        int MyVar4 = (5 + (4 * 3)) / 2;\n\n        // Output the result.\n\
    \        System.out.println(\"MyVar1: \" + MyVar1 +\n                        \
    \   \\\"MyVar2: \" + MyVar2 +\n                           \\\"MyVar3: \" + MyVar3\
    \ +\n                           \\\"MyVar4: \" + MyVar4);\n    }\n}\n```\n\n+\
    \   Defining the wrong count: Possibly the most common logical error is counting\
    \ things incorrectly. People are used to starting counts with 1, and computers\
    \ often start counts with 0. So, it's not uncommon to find that applications are\
    \ precisely one off in performing a task, whether that task is running a loop\
    \ or working with a collection of items.\n\n+   Assuming a condition is true when\
    \ it isn't: Developers will often look at the statement used to define a condition\
    \ and assume that the statement"
  merge: -1
