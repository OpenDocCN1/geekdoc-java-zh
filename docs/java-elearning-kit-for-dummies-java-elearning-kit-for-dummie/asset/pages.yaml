  md: '# Performing the Mac installation


    Files needed: The Java installation program you downloaded


    After you download the version of the JDK for your system, extract the file on
    your hard drive, preferably to the /System/Library/Java/java-8 folder. To use
    Java from an IDE, all you need to do is find the IDE where to find the files.
    If you want to use Java for running applications normally, you must create a path
    to it using the instructions in the "Creating a path on the Mac" section, later
    in this chapter.


    # Accessing the Java executables


    # EXTRA INFO


    The location of the Java executable files on your system The folder containing
    these files provides access to all the tools you require to use Java. When you
    install Java, the setup program will tell you where files will be stored. The
    following sections tell you the default location for storing the Java 8 files
    and provide some tips on accessing them.


    One of the advantages of using an IDE that you don''t normally need to worry about
    the location of the Java executable files. Install the JDK first and then install
    the IDE. The IDE setup program will automatically locate the JDK files for you
    and configure the IDE to use or these files when you need help, or compile, debug,
    or run an application.


    # Creating a path in Windows


    If you''re not using an IDE in Windows, you''ll always have to create a path to
    the Java executable files. Because Windows doesn''t normally offer any Java support
    out of the box. The files you will normally appear in one of two locations, unless
    you store them somewhere else.


    +   - The Program Files\Java\jdk1.8.0\bin folder is the standard storage location.
    (If you install a newer version of the JDK, you may find it stored in a slightly
    different folder. For example, if you install version 1.8.0, you might see the
    JDK stored in the \Program Files\Java\jdk1.8.0\bin folder).


    +   - When you install the 32-bit version of Java on a 64-bit version of Windows,
    the standard storage location is \Program Files (x86)\Java\jdk1.8.0\bin.'
