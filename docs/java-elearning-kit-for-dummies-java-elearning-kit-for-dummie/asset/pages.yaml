    # Know this tech talk


    +   **data conversion:** A method of converting data between unlike types, such
    as String and int. When performing data conversion, Java must actually change
    the representation of the data so that it fits into the new type.


    +   **locale:** The characteristics of application output that define a particular
    language. For example, some languages use a period for the decimal marker, while
    others use a comma. Formatting data with locale in mind makes it easier for people
    who speak other languages to use it.


    +   **parse:** The act of breaking up a string into pieces called tokens, normally
    at spaces, and then analyzing each token for specific information. For example,
    "Java is a great language" has five tokens, "Java", "is", "a", "great", and "language".


    +   **substring:** A string of characters taken from the beginning, middle, or
    end of a string and used as a separate entity in an application.


    +   **token:** A single identifiable piece of information within a string. Generally,
    the sentence is separated by spaces into tokens, so the sentence "Sunny days are
    nice!" has four tokens in it, "Sunny", "days", "are", and "nice".'
