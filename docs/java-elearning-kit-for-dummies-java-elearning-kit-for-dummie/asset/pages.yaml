  md: "# Chapter 10\n\n# Creating new' annotations\n\nThe set of predefined annotations\
    \ that come with Java are relatively limited in use. To create really useful annotations,\
    \ you have to design them yourself or get them as part of a third-party package.\
    \ Creating a new annotation is a three-step process:\n\n+   1. Add the appropriate\
    \ import statement:\nimport java.lang.annotation.*;\n2. Define an interface that\
    \ describes the annotation to the compiler:\n// Create an annotation description.\n\
    @Documented\n@interface AuthorData\n{\n  String Name();\n  String Date();\n  double\
    \ Version() default 1.0;\n}\n\nIn this case, the annotation will appear in the\
    \ documentation created by Javadoc because it includes the @Documented annotation.\
    \ Every annotation description starts with the @interface keyword followed by\
    \ the name of the annotation type, which is AuthorData in this case.\n\nWithin\
    \ the curly braces, you see the fields used to define the annotation data. This\
    \ example includes Name, Date, and Version. The default keyword provides a value\
    \ for a particular field. This means the field will use the value if it isn't\
    \ defined as part of the annotation in the application.\n\n+   3. Use the annotation\
    \ in the application:\n@AuthorData(\nName = \"John Smythe\",\nDate = \"04/01/2014\"\
    \n)\n\nThe annotation appears before the element it affects, as a class declaration.\
    \ You must define each field that doesn't have a default value. Optionally, you\
    \ also define fields that do have a default value. In this case, the name of the\
    \ author is John Smythe, and the code was last updated on 04/01/2014."
