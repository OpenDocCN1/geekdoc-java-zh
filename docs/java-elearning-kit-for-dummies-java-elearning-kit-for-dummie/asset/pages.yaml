  md: '# Understanding the Structure of Classes


    **Return type (required):** Every method has a return type. The return type defines
    the information that the method returns to the caller after it has completed its
    work. When you don''t have anything to return to the caller, you set the return
    type as void. For example, the `main()` method has a return type of void because
    it doesn''t return anything to the caller.


    ![](img/e352a1505e4e30ed140c4898f6139f17_264_0.png)


    A method can have only one return type, even if that return type is a complex
    type that can contain multiple values.


    **Method name (required):** Every method must have a name. Otherwise, here are
    some additional considerations for the method name:


    +   - The method name must begin with a letter — any letter will do.

    - You can begin a method name with a number or special character.

    - Numbers can appear anywhere else in the method name.


    The only special character you can use is the underscore (_). For example, a method
    name can''t include an ampersand (&).


    **Argument list (optional):** the method requires information from the caller
    to perform a task, you can supply one or more arguments (or **parameters** as
    some people call them) in a list contained within parentheses. There are some
    additional considerations for arguments:


    +   - The argument includes the type followed by the argument name. For example,
    if you want to supply an int value called myInt, type myInt`.

    - Argument names and types follow the same constraints as any other variable.

    - You must separate arguments with commas. For example, if the myMethod(int) method
    requires an int called myInt and a float called MyFloat, the argument list would
    be myMethod(int myInt, float MyFloat).

    - If there are no arguments, the method name must be followed by a pair of empty
    parentheses.


    Using camelcase is the standard convention for creating methods and variables,
    but the Java compiler doesn''t enforce this convention. *Camelcase* is when you
    begin each word in a method or variable with a capital letter, except for the
    first. The first word is always lowercase. For example, if you create a method
    named `checkForDoubles()`, the convention is to start the first word as lowercase,
    but to show `CheckDoubles` with initial capitalization. Some developers, prefer
    *pascal*, where every word of a method or variable is capitalized. In this case,
    `CheckDoubles()` would have every word capitalized. Using pascal for methods and
    variables helps you differentiate them from methods and variables that are any
    part of the Java Application Interface (API). No matter which case you use, it
    will work consistently. Remember that Java treats `checkForDoubles()` as a different
    method from `CheckDoubles()`.'
