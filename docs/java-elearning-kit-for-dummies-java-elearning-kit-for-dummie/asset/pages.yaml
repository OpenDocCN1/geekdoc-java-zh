    # LINGO


    +   Lots of people talk about platforms, but most of them don''t explain what
    the term means. It can mean different things to different people. When you see
    the platform in this book, it means a combination of hardware and an associated
    operating system. It''s not enough to rely to the operating system alone. For
    example, some versions of Windows work across multiple kinds of hardware (everything
    from PCs to tablets and phones). The combination of hardware and operating system
    denotes a platform.


    ![](img/e352a1505e4e30ed140c4898f6139f17_23_0.png)


    An essential fact to remember about Java is that you get lots of help using this
    language—you''re never left to your own devices with Java, because help is always
    available. You don''t need to know any of special handshake or rely on certain
    people to discover how Java works. This chapter provides you with basic information
    about getting help with Java. You''ll also find more on getting help as the book
    progresses.


    # Considering Why You Use Java


    Java, like all programming languages, has both positive and negative features.
    It''s important to know why you''re learning Java before you do anything else
    because a good reason to do something is a motivator. The following sections describe
    some of the benefits of using Java as a programming language.


    # Using a popular language


    Literally hundreds (perhaps thousands) of computer languages are available today.
    Some of these languages are definitely more popular than others. Precisely which
    language is most depends on who you ask. For example, many people treat the judgment
    of TIOBE—an organization that tracks programming language popularity (amongst
    other things)—when when it comes to language popularity (http://www.tiebe.com/content/paperinfo/tpci/index.html).
    The TIOBE information is a little stark. If you prefer some commentary with your
    statistics, try a site such as Udemy/'
