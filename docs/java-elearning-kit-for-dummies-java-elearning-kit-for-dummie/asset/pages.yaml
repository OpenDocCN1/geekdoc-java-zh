  md: '# Displaying Date and Time


    The example begins by creating a Calendar object, MyCal. It uses a new System.out
    method, format(), to produce formatted information. The format ( ) works by using
    special codes as placeholders in the string. You then supply a variable to fill
    each of those placeholders. Table 4-2 describes each of these format codes.


    | Table 4-2 Example format() Method Formatting Codes |

    | Code | Description |

    | --- | --- |

    | %B | A locale-specific month name. The month will always appear as a complete
    name, such as January. |

    | %tb | A locale-specific abbreviated month name, such as Jan for January. |

    | %tm | A two-digit representation of the current month, where January is equal
    to 01. |

    | %td | A two-digit day of the month without leading zeros. So, the first day
    of the month will appear as 1. |

    | %te | A two-digit day of the month with leading zeros as needed. So, the first
    day of the month will appear as 01. |

    | %ty | A two-digit year. |

    | %Y | A four-digit year. |

    | %A | A locale-specific day of the week name. The day of the week will always
    appear as a complete name, such as Sunday. |

    | %ta | A locale-specific abbreviated day of the week name, such as Sun for Sunday.
    |

    | %D | A shortcut method of outputting the date in %tm%td%ty format. |

    | %tk | The hour using 24-hour clock without leading zeros. So the first hour
    will appear as 1. |

    | %H | The hour using 24-hour clock with leading zeros as needed. So the first
    hour will appear as 01. |

    | %tl | The hour using 12-hour clock without leading zeros. So the first hour
    will appear as 1. |

    | %I | The hour using 12-hour clock with leading zeros as needed. So the first
    hour will appear as 01. |

    | %tM | The minutes with leading zeros as needed. So the first minute of the hour
    will appear as 01. |

    | %tS | The seconds with leading zeros as needed. So the first second of the minute
    will appear as 01. |

    | %tL | The milliseconds with leading zeros as needed. So the first millisecond
    within the second will appear as 001. |'
