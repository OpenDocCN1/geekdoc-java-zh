    An array is simply a list of anything—any primitive or object type. In most cases,
    an array is a list of like items. For example, if you create an int array, then
    all the items in that are int values. The following sections describe how to create,
    initialize, iterate (examine each value), and otherwise manipulate arrays.


    > LINGO

    A collection is a list of complex items that you manage in the same way that you
    would a database. Java provides the Map object for this purpose. The list is structured
    in a concrete fashion—you can reorder it as needed and process it in a more comprehensive
    way than other Java types.


