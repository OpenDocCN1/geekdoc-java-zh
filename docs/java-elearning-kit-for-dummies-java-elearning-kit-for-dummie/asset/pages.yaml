  md: '# Chapter 1


    (or Java API), a collection of code samples that lets you write Java applications
    with greater ease by reducing the amount of code you need to write. Code makes
    your application do something, but in order to understand the code, you need to
    add comments as a means of documentation. Adding comments to your code makes it
