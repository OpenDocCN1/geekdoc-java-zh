  md: '# Changing Primitive Types into Objects


    An object has intelligence that helps you perform tasks. Some objects have more
    intelligence than others do, but all objects have some level of functionality
    that you won''t find when working with a primitive type. So, when it comes to
    choosing between the two, you''re really deciding whether you need the smaller
    size and faster speed of primitive types or the greater flexibility of objects.
    Each primitive type has an object version, as described in the sections.


    # Automatic boxing and unboxing


    It''s important to understand that a primitive is a pure value, whereas an object
    is a value plus code used to work with that. The act of placing a value into an
    object is called boxing. The object acts as a box that holds the value and lets
    you perform tasks with it. When you need to access the value, you unbox it from
    the box. This is called unboxing. Java automatically boxes and unboxes variables
    for you needed; you don''t really have to think about it. However, it''s important
    to know that boxing and unboxing.


    # LINGO


    > Boxing a primitive type places its value inside an object. Unboxing removes
    a value from the object and places it in a primitive type. You box a value to
    gain access to the functionality that the object can provide and unbox a value
    to examine it.


    # Byte versus byte


    # LINGO


    The Byte object contains a byte primitive type. It also provides access to a number
    of interesting methods for working with byte values. Along with these methods,
    the Byte class provides a number of static methods. (A static method is a method
    that you can use without creating an instance of the class.) Many classes provide
    access to static methods that you use to work with the class in some way. It''s
    important to differentiate between the class (the set of instructions used to
    build an object) and the object (an instance of the constructed class).


    > A static method allows you to perform a task with a class, such as discovering
    the minimum value that the class supports. Static methods are part of the class
    and you can access them at any time without creating an instance of the class.
    In fact, some static methods are used to create objects.


    In this exercise, you work with both static and object methods to interact with
    the Byte type.'
