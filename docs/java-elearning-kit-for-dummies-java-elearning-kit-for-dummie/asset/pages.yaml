  md: '# Working with the Primitive Types


    | Type Name | Number of Bits | Range of Values |

    |---|---|--|

    | float | 32 | 1.4012984632481707-46 to 3.40282346638528860-38 (positive or negative)
    |

    | double | 64 | 4.9406564548126544-324 to 1.79769313486231570-308 (positive or
    negative) |

    | boolean | | true or false |

    | char | 16 | Any single 16-bit character including common letters such as A,
    the numbers 0 through 9, and common symbols such as |


    Table 2-1 demonstrates something important. As the number of bits consumed by
    a variable, the range of values it can contain also increases. The type tells
    how to interpret the memory used by the variable. The same memory can hold one
    int, four short, or eight byte variables. Only the types tell the application
    how to look at that memory.


    > Use smaller variables to improve application memory usage and speed. Larger
    variables allow your application to process greater values. It is important to
    choose the correct variable size for a specific use to ensure your application
    works as fast and efficiently as possible.


    Now that you have an overview of the primitive types, it''s time to look at them
    in detail. The following sections demonstrate how each of the primitive types
    work.


    # byte


    The byte type consumes eight bits — one byte of the computer''s memory. Each bit
    can be either 1 or 0. The combination of 1s and 0s determines the value of the
    byte. A byte-sized variable can hold any value between -128 and 127 or 256 different
    values (including 0).


    In the following exercise, you create an application that interacts with a variable
    of type byte.


    > A is a single memory location containing either a 0 or a 1. A byte consists
    of eight bits. The most significant bit determines whether a byte is positive
    or negative. So, a binary value (a group of bits) with a value of 10000001 has
    a decimal value of -127, while a binary value of 00000001 has a decimal value
    of 1. When the leftmost bit is a 1, the value is negative.'
