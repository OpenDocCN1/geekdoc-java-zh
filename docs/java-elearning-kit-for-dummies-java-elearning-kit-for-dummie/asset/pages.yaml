  md: 'Repeat after me, "Java is an amazing language!" Now say it again for good measure.
    There are many times in the real world when you repeat something. Likewise, applications
    have a need to repeat tasks. Doing them once isn''t enough. This chapter helps
    you understand how to perform the same task multiple times.


    # Performing Tasks a Set Number of Times


    It''s possible to perform every repetitive loop using a for loop, but doing so
    would mean writing your code in odd ways. Even, so the for loop is the workhorse
    of the repetitive structure because it''s easy to create, easy to debug, and easy
    to understand. The essence of a for loop is that the application performs a series
    of tasks a specific number of times.


    > LINGO

    A repetitive loop consists of a special structure that tracks when to begin and
    end a series of repetitive tasks, and the tasks the for repeats a series of tasks
    and a specific number of times and a while loop continues to repeat a series of
    tasks until a specific condition is met. The for-loop is special in that it works
    with each element in an enumeration, array, or collection.


    # Using the standard for loop


    It''s important to understand how a for loop is put together before you create
    your first one. The for loop begins with the word "for" followed by parentheses
    containing the three items, separated by semicolons (:).


    +   A counter variable and the code used to initialize it, such as Current = 1.

    A condition that will end the loop after a specific count, such as Current <=
    5.

    A method for updating the counter variable so that the for loop can keep track
    of the current count, such as Current++.


    > LINGO

    A structure starts with a statement that specifies the purpose of the structure,
    such as a repetitive loop. The structure body starts with an opening curly brace
    { and ends with a closing brace } or more lines of code that perform one or more
    tasks to perform between the braces, in the body of the structure. Structures
    are used for a number of purposes throughout the book.'
