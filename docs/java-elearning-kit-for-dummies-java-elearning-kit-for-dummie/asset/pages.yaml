  md: '# Chapter 1


    # Creating multiline comments


    Multiline comments can start anywhere on a line, but they normally appear at the
    beginning of the line. The comment continues over multiple lines until the compiler
    reaches an End of Comment symbol. Multiline comments always begin with /* and
    end with /. In the following exercise, you add a multiline comment to the GetStarted
    application.


    Files needed: GetStarted.java


