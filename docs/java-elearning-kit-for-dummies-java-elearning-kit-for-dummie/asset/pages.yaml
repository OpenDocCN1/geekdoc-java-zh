    # Performing One of Two Tasks with If. ..Else


    The basic if statement could be used for every task. However, writing code just
    using the basic if statement can become boring and even introduce errors (bugs)
    into your application. Look again at the example in the “Using a Simple If” section
    of the chapter, and you see that it has two statements in it. The if...else statement
    makes it possible to perform precisely the same task using just one structure.
    The ...else statement says that if the condition is true, the application should
    perform one of tasks, but if the condition is false, it should perform a completely
    different set of tasks.


    # LINGO


    > A bug is an error in the code that you write. Errors make your application behave
    in ways that you didn''t anticipate. Anyone using your application will get results
    from the results you wanted to provide them. Bugs cause all sorts of problems.
    For example, a bug in the wrong place could cause your application to stop working
    or give a virus writer opportunity to invade your application. Simplifying your
    application by using the appropriate statements is one way to decrease bugs.'
