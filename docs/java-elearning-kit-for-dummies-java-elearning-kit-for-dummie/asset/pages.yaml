    # float


    Up to this point, all of the variable types have supported a specific number of
    bytes that directly correlate to a numeric range. None of these types have supported
    only the integer portion of the number. They have supported with a larger numeric
    range. A float includes both an integer and a decimal portion. The float is 32-bits
    long. Precisely how the float supports numbers with a decimal portion is unimportant
    for purposes of understanding Java, only the fact that it does so is important.
    A float can support numbers between -1.401298463248317e-38 to 3.402823463852886e+38
    (positive or negative).


    > LINGO

    Floating point numbers are those that contain both an integer and a decimal portion,
    such as 1.25. In this case, 1 is the integer portion and .25 is the decimal portion.
    A computer uses an entirely different set of circuits to work with floating point
    numbers, and the procedure for working with them is entirely different as well.
    Some people call floating point numbers real numbers. Strictly speaking, these
    are incorrect because floating point numbers on a computer only approximate real
    numbers (the numbers as they actually are in the real world).'
