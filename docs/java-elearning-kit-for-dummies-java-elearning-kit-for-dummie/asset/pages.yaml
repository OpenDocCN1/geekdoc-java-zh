- img_proc: true
  md: "is true (false) without verifying the logic of the statement. The use of an\
    \ or statement when you really meant to use an and statement can also cause problems.\
    \ The logic employed to make decisions causes many developers, even when experienced\
    \ developers, a lot of problems. Always verify your assumptions for conditional\
    \ statements.\n\n+   Relying on floating point numbers for precision work: You\
    \ can't assume that floating point numbers will deliver a specific number. This\
    \ means you can check a floating point number for equality to any specific value\
    \ — you must use a range of values to perform the check. Floating point numbers\
    \ are always an approximation in Java.\n\n+   Relying on integer values to measure\
    \ values: Integers are great for counting items because they are precise. However,\
    \ many integer operations create imprecise results. This is especially true for\
    \ division, the remainder is always left off. (The number is rounded down.) Using\
    \ floating point values or the BigDecimal object type you need to measure and\
    \ precision is important.\n\n+   Misplacing a semicolon: It's possible to create\
    \ Java code that compiles and runs perfectly despite a semicolon in the wrong\
    \ place. Here's an example:\n\n```\npublic class LoopError {\n    public static\
    \ void main(String[] args) {\n        // Declare the variable.\n        int Count;\n\
    \n        // Create the loop.\n        for (Count=1; Count<=10; Count++) {\n\n\
    \        // Output the result.\n        System.out.println(\"Count is \" + Count);\n\
    \    }\n}\n```\n\nNotice that the semicolon appears immediately after the for\
    \ statement, rather than after the code block as it should. Instead of printing\
    \ individual values of Count, this example prints a single sentence that says\
    \ Count is 11.\n\nThere are more ways to create logical errors that anyone can\
    \ imagine. You'll see a number of additional examples as the book progresses."
