    # Know this tech talk


    +   - **bug**: An error in the application code that causes your application to
    behave in a way that you didn''t anticipate.

    - **conditional statement**: A programming construct that consists of a condition
    (expression) and a task. When the condition is true, the application performs
    the task.

    - **expression**: A mathematical description of the condition that you want the
    application to check. An expression normally includes a logical operator and always
    provides a Boolean output.

    - **nesting**: The act of combining multiple levels of statement into a single
    super statement. The application executes upper levels of the statement first
    and then drills down into lower levels. Use nesting to make complex decisions
    where one decision affects others.'
