  md: '# Working with Java Annotations


    You''ve seen comments used in most of the examples in the book. The compiler ignores
    comments, so when you create a comment you can write anything that will be helpful
    later in figuring out what the application can do. Comments document your code.
    However, there is another kind of documentationthe annotation. An annotation is
    a kind of documentation that the compiler also understands. When the compiler
    sees annotation in your code, it knows that it needs to do something special with
    the code that follows. Annotations are helpful in documenting your code in a functional
    way that the compiler can help you enforce whatever documentation you provide.


    > LINGO

    An annotation is a kind of documentation for your application code that the compiler
    can understand. Unlike a comment, the compiler can act on an annotation to help
    others work with your code more efficiently.


    # Understanding annotations


    The kinds and content of annotations, like comments, are limited only by your
    imagination. Java provides some predefined annotations, but you can also create
    annotations that describe program elements in any way you want. The idea is that
    you describe how an annotation should work, and the compiler takes care of the
    rest.


    ![](img/e352a1505e4e30ed140c4898f6139f17_341_0.png)


    # Using predefined annotations


    A predefined annotation is one that exists as part of Java. You find these annotations
    in the java.lang.annotation package. To use them, you add import java.lang.annotation.*;
    to the beginning of your application. The following list provides an overview
    of the predefined annotations:


    +   @Deprecated: Sometimes an element—a class, method, field, or other programming
    feature—is superseded by a newer element or is no longer needed. When you mark
    the element as deprecated @Deprecated so that developers know they need to update
    their code and stop using that element. Adding the @Deprecated annotation outputs
    the deprecated status of the element in the documentation generated by Javadoc
    (a utility that is used to create documentation automatically based on the content
    of your code files).'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Working with Java Annotations


    +   - Documented: Any time you mark an element as documented, the Javadoc utility
    outputs it to the documentation file it creates based on the source file content.


    +   - FunctionalInterface: Specifies that the interface is a functional interface
    used for anonymous classes and lambda expressions, as described in Chapter 9.


    +   - Inherited: Classes inherit characteristics from a parent class. By default,
    this doesn''t include the class''s annotations. Using the @Inherited annotation
    tells Java to apply the class annotations to the subclass as well.


    +   - Override: Specifies that a child class is overriding a super-(parent class)
    element. If this annotation is present and the subclass lacks an element of the
    same name, the compiler outputs an error so that you know something is wrong with
    the override.


    +   - Repeatable: Most annotations are applied only to a particular element. However,
    in some cases you may need to apply the annotation more than once. This annotation
    tells Java that it''s acceptable to apply the annotation to a particular element
    more than once.


    +   - Retention: An annotation can only affect the source code and compiler; the
    source code, compiler, and JVM. This annotation defines what effect another annotation
    should have. For example, you may need only a documentation-specific annotation
    to affect the source code and compiler.


    +   - SafeVarargs: It''s possible to perform operations that aren''t safe on the
    arguments passed to a method or constructor. This annotation says that the code
    doesn''t do anything and therefore doesn''t require all the usual checks. Reducing
    the number of checks makes the application run fast.


    +   - SuppressWarnings: The Java compiler outputs wealth of warnings to signal
    potential problems. For example, if you try to use a deprecated method in your
    code, the compiler outputs a warning message about it. This annotation tells the
    compiler not to output warnings for the affected element.


    +   - Target: When you create your annotations, it can be helpful to tell the
    compiler that these annotations should affect only a specific element type. For
    example, if you create an author block that is meant to appear only at the package
    level, then you can limit the annotation to just that element type by using the
    @Target annotation.'
