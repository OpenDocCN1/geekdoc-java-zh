  md: '# Reading XML Data from Files


    The ProcessElements() method begins by displaying the current level. It then adds
    a number of tabs to indent the information at higher levels to a greater degree.
    The method displays the element name and then displays the value contained within
    it. If any notice uses the getNode() method to obtain the type of the current
    node and compare it against a known node type, which is Node. TEXT_NODE for an
    element value.


    At this point, the code must ask whether there are any child nodes to process.
    For example, the <Root> element will have child nodes, the <Fruit> element doesn''t.
    When there are child nodes, the code creates a List object, ChildNodes, to access
    them. It then processes each node in turn. When the node type is Node. ELEMENT_NODE,
    the method converts the type to Child, essentially into an Element, and uses ChildElement
    to recursively call ProcessElements(). Notice that performing this recursive call
    increases the Level value.


    # LINGO


    You use recursion to break down into simple pieces in Java. A recursive method
    keeps breaking down the task until a simple task is left. It then uses the result
    of that task to make higher tasks easier to manage and perform. Recursive routines
    are an elegant way to handle situations where you don''t know how complex the
    task will be at the outset. For example, there isn''t any way to know how many
    elements an XML file will contain, so using recursion provides one method for
    dealing with complexity.


    ![](img/e352a1505e4e30ed140c4898f6139f17_408_0.png)


    Any time you use recursion, you must provide a method for the recursive routine
    to stop. In this case, recursion continues only as long as there are nodes of
    type Node.ELEMENT to process. When the code runs out of these nodes to process,
    the application automatically stops calling the ProcessElements() method recursively.
    If you don''t provide an escape mechanism, the code will continue to run infinitely,
    and causing a system crash.


