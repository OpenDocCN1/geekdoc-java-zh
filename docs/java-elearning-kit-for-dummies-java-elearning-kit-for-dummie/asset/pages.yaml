  md: '# Know this tech talk


    boxing: The act of placing a value into an object for the purpose of manipulating
    the value with the help of the object''s features.


    casting: The act of converting one type into another type.


    concatenation: The act of adding two strings together to create a single string.
    For String1 contains Hello (note the space after the word Hello) and String2 contains
    World, concatenating the two strings produce Hello World.


    data: A series of 1s and 0s assigned to a specific location in memory.


    escape character: A single special control character used to modify the output
    of an application. For example, the /n escape character adds an additional line
    between two lines of output.


    escape sequence: Two or more escape characters used to modify the appearance of
    information on screen. For example, the /t/t escape sequence would add two tabs
    to the output, which would control the position of text on screen.


    floating point number: An approximation of a real number, which has both an integer
    and a decimal portion, such as 5.1.


    information: Data that has been assigned a type in order to give meaning and make
    it possible to interpret what the data means.


    object: A class used to hold a specific kind of data that has methods, properties,
    and events. An object can have special behaviors that it let interact with the
    data in unique ways.


    overflow: An overflow occurs when an application attempts to create a value larger
    than the type is designed to hold. Java gets rid of the extra information and
    keeps just the bits that the type can successfully hold. Unfortunately, Java does
    not display an error message when this happens, so your application flawlessly
    continues to run in the error place. Use the BigInteger data type to prevent errors
    from occurring when performing math.


    real number: A number that has both an integer and a decimal portion, such as
    5.1. Some developers also call real numbers floating point numbers, but this isn''t
    precisely true. A floating point number is merely an approximation of a real number.


    scope: The visibility of a variable or method to other parts of an application.


    unboxing: The act of removing a value from an object and placing it into the corresponding
    primitive type.'
