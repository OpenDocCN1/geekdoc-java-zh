  md: '# Chapter 1


    # Creating applications for multiple platforms


    At one time, writing an application for Windows running on a PC answered the needs
    of most businesses. Organizations simply dont require many platforms to complete
    required tasks. Most organizations today, however, have to support a number of
    platforms. People want to access the same data using their PC, tablet, and smartphone,
    for example. An application has to be versatile to work well on all three pieces
    of hardware (as a minimum). Because tablet and smartphone operating systems vary
    considerably, an application must also work well across a number of operating
    systems and present the user with essentially the same interface to reduce support
    costs. Java makes it possible to support all requirements.


    # Defining other reasons to use Java


    When you start talking with people about Java, you will find many reasons to make
    your next programming language. Many developers would argue that Java is a good
    choice because it is free or, that it is easy to leverage skills acquired from
    mastering other languages, such as JavaScript and C/C++. These reasons make sense
    to you as a developer on your current skill set and the requirements of your next
    application. Java has a lot to offer, and you should at least consider the following
    reasons to adapt it:


    +   ✔ Java provides a large, standardized library of functions that make it possible
    to write robust applications without relying on any third-party products.


    +   ✔ The people who created Java are constantly trying to simplify its syntax
    (language structure) to make it easier to learn.


    +   ✔ Relying on Object-Oriented Programming (OOP) techniques makes Java more
    robust and less susceptible to problems than other languages because OOP technologies
    have a great track record in that. (See the discussion at http://www.reetopassays.com/content/paper-outlining-various-concepts-found-object-oriented-programming-oop
    for details.)


    +   ✔ All memory-related tasks are handled for you, so all you have to worry about
    writing your code.


    +   ✔ The huge help facility means that you won''t be left out in the cold trying
    to figure something out.


    +   ✔ Great performance on a wide variety of platforms.'
