    You want to change the menu to include additional System.out.

    println("Letter. Color"); entries. Make sure each entry has a nunique letter associated
    with it.


    +   3. Make the new menu entries functional by modifying the switch statement
    to accommodate them.


    Each new color requires three lines of code similar to the code shown here:


    ```

    case ''A'';

    System.out.println("Your favorite color is Yellow!");

    break;

    ```'
