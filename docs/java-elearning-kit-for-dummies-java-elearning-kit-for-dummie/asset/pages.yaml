    # Using the New Date and Time API


    In the past, Java lacked a good way to work with date and time values. There were
    two attempts to address the problem using the Date class first and then the Calendar
    class, but they proved clunky. Java 8 fixes this problem by creating an entire
    API devoted to date and time with special classes for each. The following sections
    describe the date and time API from an over-perspective.


    # Viewing the date and time API


    Java developers have been asking for better date and time functionality for a
    long time. Working with the older Date and Calendar classes was difficult, and
    you couldn''t easily do things such as compare two time values. The new date and
    time API is immense, but it contains most of the features that developers have
    requested.'
