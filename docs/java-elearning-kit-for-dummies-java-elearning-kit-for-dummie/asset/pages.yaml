    # Creating an event listener interface


    When a class generates an event, there must be something to listen and react to
    the event. when the event listener waits for an event to happen and then passes
    this information out to other classes by calling methods that have registered
    themselves with the event listener.


    Unfortunately, you don''t know how everything is going to work until someone actually
    creates a class definition that carries the event. Your event needs a listener,
    but you don''t know how to put it together. In short, you realize there has to
    be an Interface between the event and an event listener, but you don''t know how
    to implement that interface. A special sort of class, called an interface, lets
    you tell Java that something is needed, but you don''t know precisely what.


    > LINGO

