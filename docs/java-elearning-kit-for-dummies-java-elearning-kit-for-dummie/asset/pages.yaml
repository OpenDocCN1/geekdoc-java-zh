    # Summing Up


    Here are the key points you learned about this chapter:


    +   - Reading an XML file from disk provides data to your application.

    - Your application must parse an XML file in order to convert it to text

    to an actual document.

    - The process for creating an XML document begins with a factory that cre-

    ates an XML document builder, which is used to build the XML document.

    - To create an XML document, you must build it out of component objects

    such as Element and Text.

