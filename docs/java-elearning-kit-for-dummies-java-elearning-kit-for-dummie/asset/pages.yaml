    # Repeating Tasks Using Loops


    +   - Creating for loops allows an application to perform a task a specific number
    of times.


    +   - Creating while loops allows an application to perform a task until it has
    been completed.


    +   - Creating-each loops allows an application to perform tasks with collections
    of objects until every object in the collection has been used.


