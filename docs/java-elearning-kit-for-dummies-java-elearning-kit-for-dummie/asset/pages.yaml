  md: "# Understanding Error Sources\n\n+   Using an operator that doesn't apply:\
    \ In some situations, you might try to use an operator that doesn't apply to the\
    \ variable or variables in question. For example, you can't use the increment\
    \ operator (++) with a boolean variable. Newer versions of Java have become adept\
    \ at finding this error, but you can still encounter difficulty figuring out precisely\
    \ why an error occurs when you use the wrong operator in some cases. For example,\
    \ Obj1 == Obj2 doesn't compare the two objects — the equality works only for numeric\
    \ types.\n\n+   Using incompatible types: This type of error can be tricky because\
    \ the compiler will flag some errors and not others. For example, if you try to\
    \ assign a float to an int variable, the compiler displays an error message. On\
    \ the other hand, if you assign an int to a float variable, the compiler performs\
    \ an automatic type conversion to the int to make it a float. The problem with\
    \ this second scenario is that it can silently introduce errors in your code,\
    \ especially if you really meant to use a float.\n\n+   Losing precision during\
    \ a conversion: Sometimes you can apply casting incorrectly. casting a float to\
    \ an int works fine, but at the loss of the decimal portion of the number. This\
    \ loss of precision can affect the output of your application in unexpected ways\
    \ and cause the output to reflect a value other than the one you expected. The\
    \ compiler finds this sort of error because you have specifically applied a cast\
    \ to the variable and the compiler expects that you know what you're doing.\n\n\
    +   Performing an impossible cast: It's possible to convert between different\
    \ types in Java. However, no matter much you'd like to convert a boolean value\
    \ into an int, Java won't let you do it. The concept of the cast is syntactically\
    \ correct, but you're applying it incorrectly, making it a semantic error that\
    \ the compiler catches.\n\n+   Applying scope incorrectly: Any variable you declare\
    \ inside a method has the same scope — visibility to other parts of the application,\
    \ in other words — as the method. Consequently, you can't declare a private static\
    \ variable inside a method. Instead, you should define the variable globally like\
    \ this:\n\n```\npublic class PrivateVar\n{\n    // This declaration works.\n \
    \   private static int PrivateInt = 3;\n    public static void main(String[] args)\n\
    \    {\n        // This declaration doesn't work.\n        private static int\
    \ PrivateInt = 3;\n    }\n}\n```"
