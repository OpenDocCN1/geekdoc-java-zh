  md: '# Choosing an IDE for Java


    # Creating a path on the Mac


    The Mac OS X Leopard setup includes several versions of Java as part of the base
    installation. So, you do have Java available, but you may not have the right version
    available. To use Java 8 as your default version of Java, you must open Terminal
    (by choosing the Applications:Utilities:Terminal command) and export a path to
    Java 8 by typing the following command:


    ```

    export JAVA_HOME=/System/Library/Java/java-8

    ```


    After you the path, you need to verify that you have the right version of Java
    selected. Test your installation by typing the following command in Terminal:


    ```

    $java -version

    ```


    You see the version number of Java that you have selected.


    # GO ONLINE


    Windows users have Notepad, and it works fine for creating Java applications.
    If you really want something more fancy, try Notepad++ [http://notepad-plus-plus.org].
    Linux developers will likely want something familiar than plain to use. You can
    find a number of plain editors at http://www.TUTORIALS/yolinux.com/LinuxEditors.html.
    Mac users may want to install Plain Text for Mac, found at http://download.cnet.com/Plain-Text-Editor/3000-2079-4-1013406.html.
    Check out the article at http://www.blorge.com/2009/07/14/software-free-plain-text-editors-for-mac-a-description-of-other-editors-that-will-work-on-mac.
    If you are working with multiple programming languages, you might want to try
    an editor that caters to them, such as PilotEdit [http://pilotEdit.com], free
    editor that supports a host of programming languages.


    # Choosing an IDE for Java


    An IDE is simply special kind of text editor. It provides a wealth of features
    that can make your coding experience easier. You can easily use any text editor.
    For example, a Windows user could rely on Notepad to get the job done, whereas
    Linux users have vi and Mac users have TextEdit. The following sections discuss
    the use of an IDE for your projects. However, this book doesn''t assume you''re
    using any particular IDE and you won''t have to worry about matching your output
    to the output of any particular IDE.


    # Working with a text editor


    You can use any editor that produces pure text to create Java applications. The
    most important consideration when working with a text editor is that it produces
    pure text—without any formatting information whatsoever. Bare-bones text editors
    (such as Notepad on Windows or vi on Linux) are great for producing the required
    pure text, but text editors that are just slightly complicated (such as Wordpad
    for Windows and TextEdit


    ![](img/e352a1505e4e30ed140c4898f6139f17_34_0.png)'
