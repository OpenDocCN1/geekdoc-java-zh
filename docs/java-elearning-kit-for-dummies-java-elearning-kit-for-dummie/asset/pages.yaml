  md: '# Working with substrings


    Substrings are parts of a string. You choose a section of string at the beginning,
    middle, or end of a string and use it as a separate entity. Developers use substrings
    for all sorts of tasks. For example, many sorting routines are based on substrings,
    as are many search techniques. The following example shows a simple use of substrings.


    Files needed: Substrings.java


    +   1. Open the editor or IDE that you''ve chosen to use for this book.


    +   2. Type the following code into the editor screen.


    > A substring is any set of contiguous characters found in a larger string. An
    application can take a set of contiguous characters out of the beginning, middle,
    or end of a string and use it as a substring. The characters in a substring are
    always contiguous - you can''t take a character here and call it a substring.
    For example, in the string "Hello World", one potential substring is the word
    Hello.'
