- img_proc: true
  md: '# Summing Up 335


    the container will hold. For example, ArrayList<Integer> declares a specific object
    that will hold only Integer values. By declaring a specific type, the container
    can perform type-checking and raise an exception when the application tries to
    place the wrong type within the container object. The advantages are the developer
    obtains additional error-checking, there''s less code to write, and the code typically
    runs faster because the variable type is known during compile type. However, these
    advantages come at a loss of flexibility, so sometimes the right choice is to
    use a raw type in the parameterized type.


    **queue:** A method of creating an array-like structure where items are removed
    in the order they are added. This is a First In, First Out (FIFO) structure. When
    visualizing a queue, think of a line at the bank or grocery store where people
    enter the queue and wait until it''s their turn to receive service.


    **raw type:** A data type that creates container objects that can hold objects
    of any type. For example, both the Type class and the ArrayList are container
    types that you can use as a raw type to hold objects of any sort.


    **stack:** A method of creating an array-like structure where the last item added
    is the first item removed from the list. This is a Last In, First Out (LIFO) structure.
    When visualizing a stack, think of a stack of pancakes, where the last pancake
    added is the first one you eat.'
