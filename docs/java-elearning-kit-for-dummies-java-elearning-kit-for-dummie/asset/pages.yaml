  md: 'Il of the applications in this book to date rely on computer memory to perform
    tasks. Computer memory is a kind of temporary storage. When you turn the computer
    off, the memory is gone.


    However, another sort of memory exists — files on disk. These files are more permanent
    in nature. If you don''t specifically delete a file (or the system deletes it
    for you), the file continues to exist on disk (with the exception of some major
    calamity such as a disk crash). The permanent memory provided by files lets applications
    pick up where they left off computer sessions. Files also hold the data you want
    to work with in some way.


    This chapter helps you discover the techniques used to locate, read, and write
    files on the hard drive. By knowing these techniques, you can move forward in
    learning how to locate, read, and write files from other data sources, such as
    the network. Working with files is a first step into entering a new world of data
    that this book hasn''t previously discussed.


    # # Interacting with the File System


    It doesn''t matter whether you''re using a Macintosh, Linux, or Windows computer
    — every operating system has some sort of file system associated with it. Yes,
    differences between file systems exist, but even so, the basic concepts are the
    same. A file is stored in a specific location on the drive, and if you know that
    location, you can read and write the file.


    LINGO

    nA file is a storage container for data. Files can use a number of methods to
    hold and organize the data. Some of these organizational methods are easily readable
    by humans (such as text files), but others aren''t (such as graphics files).'
  merge: -1
