    This example adds on to the ExtractCharacter example. In order to provide formatted
    output, you need to know which thousands separator character to use. Early in
    the code, the application uses the DecimalFormat object, DFS, to store the thousands
    in the char variable. Thousands, by calling getSeparator().


    The code used to format a string with separators appears near the end of the code.
    It begins by creating an int variable Compare that holds a comparison value. This
    variable tells Java when to place a character in the output string. Notice that
    this is one of the times when you use the modulus operator (%). Suppose that the
    user types four characters as numbers, which would make the output of Input.length()
    - 4 subtract 1 from that value, and the value is now 3. When you divide that by
    3, the remainder is 0, which is what''s stored in Compare.


    Formatting a string this means working backward through the string. Formatting
    simply works that way. You count three numbers from the right and add a comma
    before you start the next series of three numbers, working right to left as you
    go. It helps to think about how you perform this technique. In this case, the
    for loop begins at the right end of the string and progresses toward the left
    end, as you perform the task.


    Every time the for loop processes another character, it must make a decision about
    inserting a thousands separator. If the code is already looking at the right end
    of the string, there isn''t any reason to add a thousands separator, which is
    what the (Index != Input.length() - 1) part of the if statement is about.


    Figuring out you''re at the third character from the right is a little harder.
    Index starts at the length of the string minus 1. So, when you have a string with
    four characters, Index starts with a value of 3. Dividing 3 by 3 leaves a remainder
