  md: "# Chapter 13\n\n# GO ONLINE\n\nJava follows all the standards-based rules regarding\
    \ XML. In addition, it implements these standards in the same way across all platforms\
    \ Java supports. Consequently, when you write an application on your PC, the same\
    \ code works in the same way on a Macintosh or a Linux system. It's this ability\
    \ to move data anywhere and maintain the data context and makes XML such a great\
    \ choice for data storage.\n\nThis book doesn't offer a tutorial on XML — it assumes\
