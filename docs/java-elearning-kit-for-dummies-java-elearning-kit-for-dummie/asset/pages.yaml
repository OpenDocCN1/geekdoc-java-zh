    # Performing a combined assignment


    A combined assignment complicates the process by first performing a special operation
    on a value and only then performing a simple assignment. As a result, the content
    of the variable is updated in a specific way. The following list shows the common
    combined assignment operators.


    +   *= Performs multiplication of the value within the variable by the number
    supplied to the right of the operator. The result is assigned to the variable.

    /= Performs division of the value within the variable by the number supplied to
    the right of the operator. The result is assigned to the variable. When used with
    an integer type, the remainder is discarded.

    += Performs addition of the value within the variable with the number supplied
    to the right of the operator. The result is assigned to the variable.

    -= Performs subtraction of the number supplied to the right of the operator from
    the number within the variable. The result is assigned to the variable.

    %= Performs division of the value within the variable by the number supplied to
    the right of the operator. The remainder is assigned to the variable. This operator
    is used only with integer type variables.


    Each of these operators performs a math operation followed by an assignment. In
    the following exercise, you use a simple assignment to place a value in a primitive
    type. The application then performs a number of combined assignments and places
    the result of each assignment onscreen.


    > LINGO

    The % operator has a special name of modulus.'
