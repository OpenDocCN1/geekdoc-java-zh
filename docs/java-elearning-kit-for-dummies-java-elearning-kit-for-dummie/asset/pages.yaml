    # Understanding negation, bitwise Not, and Boolean Not


    There are two types of unary operations that you should view together so that
    you don''t misunderstand them later on. Negation is the act of setting a value
    to its negative version—the value of 2 becomes -2. Some math-related tasks require
    that you negate a value in order to use it. In some cases, people confuse negation
    with subtraction, but subtraction is a binary operation and negation is a unary
    operation.


    > LINGO


    > Negation is the act of setting a value to its negative equivalent. A value of
    2 becomes -2.


    Contrast negation with the bitwise Not operation, which implement you by using
    the operator. The Not operation reverses the bits in a value. The act of all the
    0s becomes 1 and versa. The Not operation is often used in Boolean-related tasks.
    It helps an application consider the logic of a task.


    > LINGO


    To make things even more confusing, there''s a second Not operation called a Boolean
    Not operation that works on Boolean values. This operation relies on the ! operator.
    The bitwise operator (--) won''t work on Boolean values and the logical operator
    (!) won''t work on values other than Boolean.


    > The term bitwise means to perform a single bit at a time, rather than using
    the entire value. So, bitwise Not operation looks at each individually—any 1 becomes
    0, and versa. Consequently, when you have a value of which in binary is 0000101,
    it becomes a negative six, which in binary is 1111010. Notice how the bits are
    precisely reversed in value.'
