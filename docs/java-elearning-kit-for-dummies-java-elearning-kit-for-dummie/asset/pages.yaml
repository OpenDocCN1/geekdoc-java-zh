  md: "# Working with the Primitive Types\n\n![](img/e352a1505e4e30ed140c4898f6139f17_80_0.png)\n\
    \nA type enforces not only a certain type of output, such as true or false for\
    \ a boolean value, but also a certain type of input. You've seen that this holds\
    \ true for numbers and now boolean values as well. It's essential to choose the\
    \ correct variable type when you write an application.\n\n# char\n\nOf all the\
    \ data types, the char is the one that your computer understands least. As far\
    \ as the computer is concerned, a char is simply a 16-bit number that can contain\
    \ any of 65,536 values. Java turns this number into a specific character. For\
    \ example, the number 65 equates to the letter A. It's important to realize, though,\
    \ that Java assigns the letter A to 65—the computer sees just the number.\n\n\
    In the following exercise you create an application that interacts with a variable\
    \ type of char.\n\nFiles needed: ShowChar.java an IDE that you've chosen to use\
