  md: '# Summing Up


    The Priority column of Table 5-2 is probably the most important because it defines
    the strict order in which Java interprets the symbols displayed in the Operators
    column. An operator in the table always takes precedence over an operator that''s
    lower in the table.


    The Associativity column is also important. In most cases, Java interprets symbols
    from left to right, which means that the symbols have left associativity. However,
    in a few cases, the operator works from right to left. For example, when using
    the = operator, Java interprets the information to the right of the operator first,
    and it then assigns the result to the operand on the left of the operator. So
    the flow is from left to right, which makes the = operator right


    # LINGO


    > Associativity is a math term that defines how elements in a binary operation
    interact. In most cases, Java uses left associativity. It begins from the left
    side of a group of operators and works towards the right side. For example, if
    you use 1 + 2 + 3 as an equation, Java adds 1 and 2 first, then adds 3 to the
    result of the first operation. You can control associativity by using parentheses.
    The article at http://math.about.com/od/prealgebra/a/associative.htm provides
    more information on this topic.


    ![](img/e352a1505e4e30ed140c4898f6139f17_174_0.png)


    # Summing Up


    Here are the key points you learned about this chapter:


    +   - Most applications use simple assignments to initialize variables.

    - You must initialize a variable before you can modify it using a combined assignment
    operator.

    - Combined assignment operators perform an operation on the variable by using
    a value to the right of the operator as input, and then they store the result
    in the variable.

    - When performing math-related tasks, you must consider the order in which the
    values appear and the operations performed on them.

    - Incrementing and decrementing are often used to keep track of the count of summing.

    - Negation produces the negative value of a number, while a bitwise Not produces
    the reversal of the bits within the number.

    - A Boolean Not turns a true value into a false value, and vice versa.

    - Use the new operator to create as many instances of an object as required by
    an application.'
