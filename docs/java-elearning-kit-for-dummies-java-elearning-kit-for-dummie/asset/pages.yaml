    # # Summing Up


    Here are the key points you learned in this chapter:


    +   - Syntactical (syntax) errors normally result from writing Java code incorrectly.


    +   - Semantic errors normally result when you write the Java code correctly apply
    Java programming concepts incorrectly.


    +   - Logical errors normally result when the Java code is both written and applied
    correctly, but the implementation of the task is incorrect.


    +   - Syntactical errors are the easiest to fix, semantic errors come next, and
    logical errors are the hardest to fix.


    +   - Trapping an error means detecting an exception object and doing something
    with it.


    +   - Handling an error means resolving the exception by displaying a message
    to the user or relying on other means.


    +   - All applications should include the appropriate error handling code.


    +   - When providing complete error handling, always handle the most specific
    errors first, and then move on to less specific errors.'
