  md: "# Know this tech talk\n\n**constructor**: A special method used to build an\
    \ object from a class description. The constructor contains special code used\
    \ to perform tasks such as initializing global variables. Every class has a default\
    \ constructor, even if the code used to create the class doesn't contain one.\n\
    \n**escape character**: A single special control character used to modify the\
    \ output of an application. For example, the `\n` escape character adds an additional\
    \ line between two lines of output.\n\n**escape sequence**: Two or more escape\
    \ characters used to modify the appearance of information on screen. For example,\
    \ the `\t` escape sequence would add two tabs to the output, which would control\
    \ the postion of text on screen.\n\n**formatter**: A special type of class used\
    \ exclusively for formatting output so it looks nice.\n\n**locale**: The characteristics\
    \ of application output that define a particular language. For example, some languages\
    \ use a period for the decimal marker, while others use a comma. Formatting data\
    \ with locale in mind makes it easier for people who speak other languages to\
    \ use it."
