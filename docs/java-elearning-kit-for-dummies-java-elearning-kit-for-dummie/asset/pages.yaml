  md: 'An object is different from a primitive type in that an object is actually
    a class, just like the many classes you''ve been creating throughout this book.
    An object has methods, properties, and events associated with it. Objects can
    also contain a wealth of variable types that you can''t create using the primitive
    types described in the "Working with the Primitive Types" section of Chapter 2.
    The number of object types you can create is limited only by need and imagination.
    Objects can also contain complex data and special behaviors.


    Every application you create has at least one variable—the args variable—which
    is provided as an argument to main(). This chapter tells how to use args to perform
    useful tasks in an application. Using args to change application behavior is called
    processing command line arguments because the changes are made as part of what
    the user types after the application name at the command line.


    It''s also possible to tell Java to make some variables accessible by everyone
    and to hide variables from view. The visibility of a variable is its scope. A
    public variable is visible to everyone, while a private variable is hidden from
    view.(Scope applies to methods, which can be hid from view as well.)This chapter
    teaches you how to give variables the right level of visibility.


    You want to store data in a primitive type most of the time to gain the speed
    and memory savings that primitive types provide. However, at some point you might
    need to convert primitive type to an object in order to more


    > LINGO

    Every Java class produces an object, even the classes you''ve created throughout
    this book. An object has methods that define how the object interacts with data.
    For example, an Add() method might define how an object can add information to
    existing data. In addition to methods, objects have properties and events. A property
    is a characteristic of the data the object contains. For example, an object that
    represents a character could have a color property. An event is a way of the object
    to listen to outside events and react to them. For example, a pushbutton in window
    could have a click event that occurs when the user presses the pushbutton using
    the keyboard or mouse. You''ve already used object methods, such as System.out.print()
    in the applications created earlier in the book.'
