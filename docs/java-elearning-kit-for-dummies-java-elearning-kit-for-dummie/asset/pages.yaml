  md: 'ou probably realize by now that you''ve been creating classes in every chapter
    of this book. It''s impossible to create a Java application without creating a
    class. In fact, you created an example in the


    Required error handling” section of Chapter 8, where you accessed the features
    of a simple class from another Java class. However, the ways in which you''ve
    used classes so far have been relatively simplistic — Java is capable of considerably
    more complexity, which is the point of this chapter.


    Classes have a specific structure. As the blueprints used to create buildings
    have certain features and follow predefined formats, so do the classes you create.
    Otherwise, the JRE could never interpret your design and use the class to construct
    objects within an application.


    As of designing a class, you must also understand how to show and hide data and
    code elements in your class, which means that this must provide some additional
    information about scope. Using scope correctly makes your class more secure because
    you can hide data from prying eyes. A properly scoped variable also makes the
    class more reliable by making it less likely that someone will be able to fill
    the variable with incorrect data. Another good reason to employ scope is to make
    your class easier to use by hiding details that other developers don''t need to
    see in order to use the class.


    Java has had anonymous classes (usually shortened to anonymous classes) to create
    had classes where a formal class description is unnecessary or overkill. For example,
    you might use an anonymous class to change the standard behavior of a formal class
    in just one instance. Using an anonymous class makes your code cleaner, shorter,
    and easier to understand. It also helps optimize the code in many cases so conceivably
    runs. Java 8 includes a new feature lambda expressions that make the code even
    shorter. A lambda expression is a special kind of anonymous class that contains
    just one functional interface and one method, so you can describe what to do with
    a bare minimum of code. The result is that anyone viewing your code will be able
    to focus on what the code does rather than the structure around the code.'
