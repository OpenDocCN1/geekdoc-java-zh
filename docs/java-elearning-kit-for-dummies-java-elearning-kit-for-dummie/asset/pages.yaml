  md: '# Using Escape Sequences


    When you can use some standard text, but you want to format it in a special way,
    you can use something called an escape character in order to tell Java to perform
    the formatting. (Here, an escape character means a character that "escapes" from
    the standard character presentation to do something special, as moving the cursor
    to the next line.) When you place a place of escape characters together, you get
    an escape sequence. Escape sequences aren''t unique to Java — many other programming
    languages use them. In addition, escape sequences have been around for a long
    time. Even mainframes use escape sequences. So, escape sequences are found on
    pretty much every platform and they''re standardized across languages for the
    most part.


    An escape character always begins with a backslash (\), followed by a special
    letter, such as n for creating a new line. Table 4-1 shows the escape characters
    that Java supports.


    | Table 4-1 Java Escape Characters |

    | Character | Purpose | Description |

    | \n | New line | Moves the cursor to the next line. Depending on the platform,
    it may not move the cursor to the beginning of the next line. |

    | \t | Tab | Moves the cursor to the next position. Tabs lets you precisely align
    output so that it appears as you''ve used a table to hold the pieces of information.
    |

    | \b | Backspace | Moves the character back one space without erasing that character
    on space. When correctly, and on the right platform, you can create overstrikes
    that combine two characters to produce special effects. |

    | \f | Form feed | Ejects the current sheet of paper in a printer and starts with
    the next sheet. |

    | \" | Double quote | Produces a double quote without ending a quoted element
    in your code. This escape character is helpful when creating String objects that
    include a double quote. |'
  merge: -1
