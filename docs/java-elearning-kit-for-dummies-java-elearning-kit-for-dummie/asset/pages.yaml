  md: '# About the Author


    **John Mueller** is a freelance author and technical editor. He has writing in
    his blood, having produced 93 books and over 300 articles to date. The topics
    range from networking to artificial intelligence and from database management
    to heads-down programming. Some of his current books include a Windows command-line
    reference, books on VBA and Visio 2007, a C# design and development manual, and
    an IronPython programmer''s guide. His technical editing skills have helped over
    63 authors refine the content of their manuscripts. John has provided technical
    editing services to both Data Advisor and Coast magazines. He has also contributed
    articles to magazines such as Software Quality Connection, DevSource, InformIT,
    SQL Server Professional, Visual C++ Developer, Hard Core Visual Basic, asp.netPRO,
    Software Test and Performance, and Visual Basic Developer. Be sure to read John''s
    blog at http://blog.johnmuellerbooks.com.'
