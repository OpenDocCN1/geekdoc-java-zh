  md: '# Summing Up


    Here are the key points you learned in this chapter:


    +   - A conditional statement consists of a condition and a task. When the condition
    is true, the application performs the task.


    +   - The conditional portion of a conditional statement is also called an expression.


    +   - Every conditional task could be performed by a simple if-statement, but
    using other conditional statement forms makes your application less prone to errors
    and also reduces the amount of typing you perform.


    +   - The else statement lets your application choose between two courses of action
    depending on whether the expression you provide is true or false.


    +   - Use the switch statement to allow the user to choose from a list of items.


    +   - Rely on the default clause to provide a default action for your application
    when the user doesn''t provide useful input.


    # Try-it-yourself lab


    For more practice with the features covered in this chapter, try the following
    exercise on your own:


    +   1. Open the UseMenu03 application.


