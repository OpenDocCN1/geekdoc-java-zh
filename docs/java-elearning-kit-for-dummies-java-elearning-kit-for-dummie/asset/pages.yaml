  md: '# Obtaining and Installing the Java 8 JDK


    +   3. (Optional) Click Change to select a location to store the Java files.


    Normally, it''s best to use the default installation location unless you have
    a special reason for storing the files somewhere else. Using the default location
    makes it easier for tools, such as an IDE, to find the files later.


    # 4. Click Next.


    The setup performs the installation. After the JDK installation is complete, see
    a secondary setup dialog box appear for the JRE installation.


    +   5. (Optional) Click Change to select a location for the JRE installation.


    In most cases, using the default installation location works fine.


    +   6. Click Next.


    After the JRE installation starts. After the JRE installation is complete, the
    secondary setup dialog box disappears, and you return to the initial setup dialog
    box.


    +   7. Click Close.


    The setup is complete, and the setup wizard disappears.


    # Performing the Linux installation


    Files needed: The Java installation program you have downloaded


    The precise steps you use to install Java on Linux depend on your Linux distribution.
    Installing Java by using the downloadable files means acting as the root user.
    Some versions of Linux (such as Fedora, Red Hat, and openSE) enable the root user,
    but others (such as Ubuntu and Debian) don''t. No matter which version of Linux
    you own, you generally have access to the super-user do (sudo) command. With this
    in mind, the easiest way to get Java on Linux is to execute the following command:


    ```

    sudo apt-get install oracle-java8-installer

    ```'
