  md: '# Interacting with the File System


    # GO ONLINE


    File systems vary among the operating systems. In addition, learning absolutely
    everything about a file system could require an entire book. Most applications
    you write using Java can rely on an absolute path or the current path. However,
    you''ll want to know as much as possible about the file system.


    Macintosh have a variety of sources at their disposal. For hardcore technical
    information, you can rely on the Apple documentation on sites, such as http://support.apple.com/TA27115.
    If you just want to know how paths work, check out the easy tutorial at http://www.westwind.com/reference/OS-X/paths.html.
    You can also find an interesting comparison of Macintosh and Windows paths at
    http://www.zephyr.com/technote/filepath.


    The Macintosh and Linux operating systems are both based on UNIX principles. It
    won''t surprise you to discover that once you know the Macintosh file system works,
    you also have considerable knowledge about the Linux file system. You can find
    a good description of the Linux file system and how it contrasts with Windows
    at http://www.frees.com/node/36. A more technical description of the Linux file
    system appears at http://tldp.org/LDP/Linux-Filesystem-Hierarchy.html.


    There are many misconceptions about the Windows file system. The one of importance
    for this book is that you must use the backpack when working with Windows paths.
    It turns out that the forward slash just as well in most cases (with some exceptions)
    because Windows, the Macintosh and Linux file systems have some basis in UNIX.
    Part of the problem with Windows is that it has had many file systems over the
    years, including File Allocation Table (FAT); New Technology File System (NTFS),
    which is covered at http://technet.microsoft.com/library/cc76145.aspx; and now,
    in Windows 8, the Resilient File System (ReFS), explained at http://blogs.msdn.com/b/bs/archive/2012/01/16/building-the-next-generation-file-system-for-windows-refs.aspx.
    All these file systems work essentially the same way as the command line, where
    you''ll be working with applications in this particular chapter. You can find
    a good resource for Windows developers at http://www.westga.edu/its/index_5327.php.


