    # Know this tech talk


    +   **attribute**: An indicator of the configuration or status of a file or directory
    on disk. One attribute describes whether the entry is a file or directory. Other
    attributes describe whether the entry is readable, writable, or hidden. There
    are also statistics associated with the entries, such as the date of last modification
    and the size of a file.


    +   **directory**: A container used to store other files or directories on disk.
    Directories help organize the disk content and make it easier to find.


    +   **file**: A permanent storage container on disk for data. A file can contain
    both textual and binary data.


    +   **path**: A string that can start with a volume letter, a list of entries,
    and sometimes ending with a filename that describes the location of a directory
    or file on disk. Paths can take a number of forms. An absolute path starts at
    the root directory of the disk and moves down through the directory hierarchy
    toward the directory or file in question. Relative paths describe the location
    of a file or directory in relation to the current location on disk.


    +   **stream**: A connection between an application and a data source used to
    transfer data to or from the application. Streams normally flow in one direction:
    either input or output. If you want to read data from a data source, you use an
    input stream. On the other hand, if you want to write data to a data source, you
    use an output stream.'
