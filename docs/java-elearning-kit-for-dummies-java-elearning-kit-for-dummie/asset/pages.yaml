  md: '# Introduction


    f you''ve been thinking about taking a class online (it''s all the rage these
    days), but you''re concerned about getting lost in the electronic fray, worry
    no longer. Java eLearning Kit Dummies is here to help you, providing you with
    an integrated learning experience that includes not only the book you hold in
    your hands but also an online version of the course at http://learn.dummies.com.
    Consider this introduction your primer.


    # About This Kit


    Each piece of this Kit works in conjunction with the others, although you don''t
    need them all to gain valuable understanding of the key concepts covered. Whether
    you follow along with the book, go online to see the course, or some combination
    of the two, Java eLearning Kit For Dummies teaches you how to:


    +   * Install a copy of Java on your particular platform. (Windows, Linux, and
    Macintosh instructions are all provided)

    * Obtain an Integrated Development Environment (IDE) for your copy of Java, should
    you wish to use one.

    * Write a basic Java program.

    * Obtain help using Java to write applications for your machine.

    * Variables to store information for use in your application.

    * Create and use objects that model real-world information.

    * Employ the new date and time API for Java in your applications.

    * Perform mathematical tasks using Java.

    * Make decisions based on input that the application receives.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    +   - Decide what to do when an error occurs in your application.

    - Use lambda expressions to make your code simpler and smaller.

    - Work with collections of information.

    - Make the output of your application look nice.

    - Work with data that appears on your hard drive.

    - Interact with the XML data that appears in so many different places (both on
    your local hard drive and online).


    # How This Book Is Organized


    This book is split into the 13 chapters that are described in this section. You
    can find more information about using all the pieces of the multi-media kit in
    the "Accessing the Java eCourse" section of this introduction.


    **Chapter 1: Starting with Java:** Before you can begin doing anything with Java,
    you need a copy of Java on your system. More importantly, you need a copy of Java
    with all the current features. This chapter helps you obtain a current version
    of Java and install it on your Windows, Macintosh, or Linux system. You''ll learn
    how to obtain an Integrated Development Environment (IDE, for short) which you
    wish to use with the book. (You can use any text editor that you like.) Of course,
    when you have Java installed, you''ll want to create at least a basic program
    with it, which this chapter introduces to Java programming techniques as well.
    Java is a rich language, so it''s important to know how to help when you need
    it (even the professionals use help) — this chapter ends by showing you how.


    **Chapter 2: Using Primitive Variables:** Variables provide a kind of storage
    you use to hold information while your application works with it. This chapter
    introduces you to basic variables that Java developers call *primitives* they
    don''t require fancy to to use them.


    **Chapter 3: Using Object Variables:** Primitive variables have limitations. They''re
    simple to use, fast, and don''t require much memory, but they lack many of the
    features that developers want. This chapter introduces you to feature-rich object
    variables. The basic idea is that the same as using primitive variables — variables
    are meant to hold data, after all — object variables make it so much easier to
    perform special tasks that you''ll wonder you got along without them. This chapter
    also introduces you to the new date and time API that makes working with both
    date and time significantly easier.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# How This Book Is Organized


    **Chapter 4: Formatting Variable Content:** The output from your application is
    important. Sure, you can output that in any old way, but your user may not understand
    what it means. Formatting is an essential part of writing applications. To extent,
    creating a nice output makes your applications easier on the eyes, but formatting
    also contributes to understanding what the output means.


    **Chapter 5: Working with Operators:** Many applications are used to perform math-related
    tasks. Operators provide a means of telling Java what you want to perform and
    the order in which they were performed. There are also operators that help the
    application make decisions, such as whether one is greater than another. In fact,
    you''ll use lots of operators in your application to tell Java how to view a particular
    variable, how to interact with it, or simply what to perform with one or more
    variables.


    **Chapter 6: Working with Conditional Statements:** Most applications have to
    make decisions on the data they receive. For example, if a number is higher than
    the one you expected, then you need to tell the application what to do about it.
    As you make thousands of decisions every day, the applications you write must
    make decisions to model the real world. This chapter helps you understand the
    methods that Java provides for making decisions.


    **Chapter 7: Repeating Tasks Using Loops:** Writing an application that performs
    a task only once doesn''t make much sense. The time required to write the application
    is almost always greater than the time required for you to perform the task once.
    This chapter helps you create applications that can perform tasks more than once.
    Repetition is one of the forces of computers. A computer will perform the same
    task as many times as you want precisely the same every time.


    **Chapter 8: Handling Errors:** Everyone makes mistakes. Even if a human isn''t
    involved, a program can experience an error simply due to a hardware glitch or
    as the result of another application is doing on the host system. This chapter
    emphasizes the benefits of detecting errors and then doing something about them,
    rather than letting your application crash. If you''ve ever been upset because
    an application lost your data after a seemingly needless crash, you''ll definitely
    want to read this chapter to avoid problems in your application.


    **Chapter 9: Creating and Using Classes:** You''ll seen objects used quite bit
    by bit in the book. Java relies on classes to create objects. If you haven''t
    seen the class of your dreams, Java may not provide it. Never fear! You can create
    your own classes that meet any need that you can imagine. This chapter shows how
    to create classes that you can use as objects in your applications to perform
    amazing tasks. It also demonstrates the use of lambda expressions, which is a
    new Java feature that will make your code smaller, faster, and less prone to errors.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    Chapter 10: Accessing Data Sets Using Arrays and Collections: You see collections
    of things all around you. If you have a bookshelf, then you have a collection
    of books. When you go to the closet, then you see a collection of clothing. A
    collection is an assortment of items that are placed in a single container. This
    chapter helps you understand what collections (and the related arrays) are and
    how using them can make your work better.


    Chapter 11: Performing Advanced String Manipulation: The string is the most common
    variable used in Java because a string models how humans think about information.
    Every sentence you''ve read so far in this Introduction is a string. When you
    read any other book, you read strings. Look at an advertisement with writing and
    you see strings. In short, strings are everywhere. This chapter helps you perform
    some advanced tasks using strings that you will find helpful as your applications
    become complex.


    Chapter 12: Interacting with Files: Variables represent temporary storage of data
    in an application. When the application ends, the variables are destroyed and
    the data they contain is gone. Of course, you may want to store that information
    in permanent format for later use. This chapter shows how to use files, which
    provide permanent storage for your data on the hard drive of your machine.


    Chapter 13: Manipulating XML Data: Your machine contains a wealth of types. Chapter
    12 introduces you to text files, which provide a means of storing information
    as strings. Unfortunately, basic text files don''t have any intelligence — they
    can''t communicate the data they contain means. You cannot save the context of
    the information so that it is easy to understand later. The XML makes possible
    to add intelligence to data storage so that it is possible to tell the difference
    between a name and a color later. This chapter provides a brief overview of working
    with XML in a Java application.


    # Conventions Used in This Book


    A few style conventions will help you navigate the book part of this kit efficiently:


    +   * Terms or words that I truly want to emphasize in Lingo sections.


    +   * Website addresses, or URLs, are shown like this: http://www.dummies.com.


    +   * Numbered steps that you need to follow and characters you need to type (such
    as a user ID or password) are set in bold.'
