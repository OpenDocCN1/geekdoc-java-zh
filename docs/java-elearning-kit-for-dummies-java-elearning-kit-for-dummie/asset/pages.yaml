  md: '# Summing Up


    increment: Adding a value of 1 to a variable.


    **information**: Data that has been assigned a type in order to give it meaning
    and make it possible to interpret what the data means.


    **overflow**: An overflow occurs when an application attempts to create a value
    larger than the type is designed to hold. Java gets rid of the extra information
    and keeps just the bits that the type can successfully hold. Unfortunately, Java
    doesn''t display an error message when this happens, so your application blissfully
    continues to run with the error in place. Use the `BigInteger` data type to prevent
    errors from occurring when performing integer math.


    **real number**: A number that has both an integer and a decimal portion, such
    as 5.1. Some developers also call real numbers floating point numbers, but this
    isn''t precisely true. A floating point number is merely an approximation of a
    real number.'
