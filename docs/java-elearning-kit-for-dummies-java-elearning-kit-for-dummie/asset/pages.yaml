  md: 'blog (https://www.udemy.com/blog/best-programming-language). Just about everyone
    agrees that Java is a popular language (and many organizations view Java as the
    most popular language).


    If you''re learning a first programming language and you want to ensure you the
    best chance of getting a job based on skills using the language, Java is a great
    choice. Java''s popularity also makes it a good choice because you have better
    access to a wide range of third-party tools, libraries, and add-ons. Using a popular
    language means that your chances of finding someone to help you with a problem
    are significantly better. In fact, popularity makes Java an excellent choice as
    a language when learning a third or fourth language, just because it''s used in
    so many places.


    ![](img/e352a1505e4e30ed140c4898f6139f17_24_0.png)


    However, popularity doesn''t necessarily make Java the right language for you
    to use for a particular application requirement — functionality makes Java the
    right language to use. The reason you encounter so many languages is that people
    often find something lacking in an existing language and try to create a better
    language that addresses the failure. Java cannot create a device driver for an
    operating system because Java has low-level support. This book cannot answer the
    question of whether Java will answer that question on your own. Always consider
    language features when choosing a language for a particular application need.
    If you still need help figuring out whether Java is the right language for you,
    consider looking online at sites like Java Pros and Cons (http://c2.com/cgi/wikiJavaProsAndCons).


    # Working with a standardized language


    For Java to work in all the environments that it does, it has a strong standardized
    language. Standardization means that code designed to perform a specific task
    on one platform performs that same task on every platform. Of course, each platform
    must run the same version of JRE to ensure compatibility. You knew there was going
    to be a little gotcha, didn''t you? When you think about it, this is a small gotcha
    and a reasonable requirement.


    # ONLINE


    The technologies found in Java are created, monitored, and controlled by the Java
    Community Process (JCP). The JCP ensures that you can discover what features versions
    of Java will contain. Individuals even join the JCP for free and have a voice
    in what will happen with Java. You can learn more about the JCP at http://jcp.org/en/home/index.'
