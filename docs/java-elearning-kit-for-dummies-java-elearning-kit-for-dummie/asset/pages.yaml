  md: '# Chapter 13


    **parse**: The act of reading information from a source, interpreting it, and
    creating a new object from it as output. Parsing is one way to convert information
    from one type to another. In many cases, parsers read data in text format and
    create an intelligent object from it that can use the textual information in unique
    ways.


    **recursion**: A programming technique where a method calls itself to break a
    complex task into simpler pieces. The result of the simple task is then used to
    make completing the complex task possible. A recursive method must always include
    some means of escape so that the routine will exit once the task is simple enough.


    **value**: The single text value between the start tag and end tag of an element
    that defines the content of that element. For example, when looking at `<Name>Sally</Name>`,
    the value is Sally.'
