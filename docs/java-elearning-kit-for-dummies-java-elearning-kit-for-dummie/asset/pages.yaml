  md: '# 1. Why is it necessary to understand the various kinds of error sources?


    Developers need to locate and fix errors in application code with a minimum of
    effort and in the shortest time, so being able to understand error sources (the
    cause and location of an error) makes things go faster, as explained on page 212


    # 2. Are my applications required to catch and handle every error that the system
    can generate?


    In some cases, it''s impossible for the application to handle an error, and it
    must pass the information along to the user, as explained on page 222


    # 3. Should my application handle errors in any particular order?


    Yes, you should always handle errors that provide the specific information first
    and then move on to more general errors, as described on page 225


    # 4. Is there any way to avoid certain exceptions, such as the NullPointerException?


    Java 8 makes it possible to define some kinds of data as optional using the Optional
    class, as explained on page 229


    # 5. Is my application required to handle some types of errors?


    Even though an application will execute just fine without any handling, it''s
    bad practice not to handle some types of errors, as shown on page 234


    # 6. When should my application generate error information in the form of an exception?


    An application normally generates an exception when it has encountered conditions
    that the developer couldn''t anticipate, and described on page 235


    # 7. What sort of error information should I provide as part of an exception?


    Always provide the user with the best error information that your application
    can generate, as explained on page 238


    ![](img/e352a1505e4e30ed140c4898f6139f17_223_0.png)'
