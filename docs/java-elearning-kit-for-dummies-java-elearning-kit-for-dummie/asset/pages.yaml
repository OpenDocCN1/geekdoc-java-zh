  md: '# 32


    # Chapter 1


    designed to work in the background, or they''re designed to wait on other programs
    to call them. Having the command prompt show up, and then disappear can be distracting.
    Fortunately, Java provides a way around this problem through the Java Windowless
    (JavaW) utility. Try it out now with the GetStarted application. Type javaw GetStarted
    and press Enter. You won''t see anything displayed at the command prompt, even
    though the application runs.


    # Adding Comments to Your Java Code


    One of the most important tasks you can perform when writing code is to document
    it using comments. No matter how simple, you''ll find that you forget an application
    later if you leave out comments. Even the GetStarted program includes comments.
    The following sections describe comments and tell you how to use them.


    Many developers leave out comments of their programs because they think that comments
    are too difficult to write. However, comments are in fact quite easy to write.
    Trying to figure out what code is doing six months after you''ve written it —
    that''s hard. Most experienced programmers use copious comments because you run
    into too many situations where a weekend was ruined due to the lack of comments.
    Comments provide many benefits, but these benefits are most important to the beginning
    programmer:


    +   * Comments make it easier to remember what your code performs.

