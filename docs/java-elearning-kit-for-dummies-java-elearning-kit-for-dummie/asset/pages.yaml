  md: '# Chapter 12


    Most operating systems rely on a hierarchical storage structure that relies on
    directories of files. Essentially, a directory is simply a container used to store
    files and other directories.


    The location of the directory on disk is called the path. A path normally begins
    at the upper-most point of the directory hierarchy, called the root node in operating
    systems, and works its way down. For example, a path of `C:\ would be the Temp
    directory located within the root node would have a path of `C:\Temp`.


    Some operating systems allow the use of relative paths. A path describes the location
    of a directory or file based on the current location. Using relative paths can
    be tricky and won''t be explored in this chapter.


    A final designation is the current path—the current location within the hierarchy.
    Most Java applications rely on the application directory as the current path (sometimes
    called the default path). Most of the applications in this chapter rely on the
    current location in the interest of simplicity. In addition, using the current
    location means that the applications will work equally well on Linux, Macintosh,
    and Windows systems, which is one of the goals for this book.


    The following sections describe some of the ways in which you can access directories
    and paths using Java. You''ll also discover techniques for getting more info about
    these objects in the file system, such as whether or not a file is hidden.


    # LINGO


    > directory is a storage container for both directories (called subdirectories)
    and files. The directory is associated with the operating system''s file structure.
    It''s usually hierarchical.


    # LINGO


    > path is a description of the location of a particular directory or file on the
    hard drive. An absolute path starts with the drive and works the root of the drive
    and works its way down to the specific directory or file. Most operating paths
    that define the location of a directory or file based on the current hierarchy.
    The "Accessing the Java executables" section of Chapter 1 describes paths on various
    platforms (Macintosh, Linux, Solaris, and Windows), you can see how paths differ
    under operating systems.'
  merge: -1
