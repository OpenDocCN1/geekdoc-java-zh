  md: 'his chapter discusses variables because you can''t write most applications
    without using variables. In fact, you''ve already worked with variables in the
    SayHello and SayHello2 applications described in


    Chapter 1. A variable is a sort of box that holds information as data. When you
    want to store information in Java, you create a variable to hold it. The variable
    is actually a piece of computer memory that stores the information as binary data
    for you. When your application interprets the data at a memory location gives
    it value and changes it from simply a number into information you can use.


    Variables are categorized by the kind of information they store. The computer
    sees the information only as 1s and 0s. The letter A is actually the number 65
    for the computer. As far as the computer is simply a set of numbers stored in
    specific memory locations. It''s the application that determines the sort of data
    stored in that memory location. Making data into a specific kind of information
    is called assigning a type to that. Assigning a type to a variable helps the application
    interpret its data contains.


    This chapter looks specifically at primitive types. A primitive type is one that
    consists of data only. The information contained within a variable of a primitive
    type is one of the following:


    +   - An integer number — numbers that can be written without a fractional or
    decimal component (byte, short, int, or long)

    - A floating point number, which has an integer and a decimal part (float or double)

    - A true or false value (boolean)

    - A single character (char)


    # LINGO


    > Data is numbers assigned to specific memory locations on a computer. The data
    is actually stored as sequential 1s and 0s. A computer has no understanding of
    data and doesn''t do anything with it other than store in the required memory
    location. An application can give the data a type, which defines the 1s and 0s
    as a specific kind of information. Information is an interpretation of the 1s
    and 0s. For example, the computer may see the 65 (actually, the binary form of
    1000001, which equates to 65 (decimal) stored in a specific location, but the
    application may interpret that data as the letter A.'
  merge: -1
