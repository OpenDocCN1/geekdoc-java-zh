    # Initializing an array


    Before you can use an array, you must initialize it. Initializing an array is
    a two-step process:


    +   1. Instantiate the array so that you have an array object to work with.

    2. Provide a value for each element in the array.


    The elements in an array are accessed using a unique number. The numbers begin
    at 0 and continue one less than the total number of elements. For example, if
    you have an array with ten elements, they''re numbered from 0 through 9. To access
    a particular element, use the array''s name, followed by the number enclosed in
    square brackets. The following code shows a typical array definition and initialization:


    ```

    // Define an array of integer values.

    int[] MyArray;


    // Instantiate MyArray.

    MyArray = new int[5];


    // Define the individual array values.

    MyArray[0] = 0;

    MyArray[1] = 1;

    MyArray[2] = 2;

    MyArray[3] = 3;

    MyArray[4] = 4;

    ```


    This code creates an int [] named MyArray. It initializes this array to hold five
    entries by calling new int[5]. The code then initializes each of individual array
    values by accessing the individual elements, 0 through 4.


    # Using the for-each loop with arrays


    Defining an array and filling it with data are two essential parts of working
    with arrays — the parts that you perform every time you use an array. However,
    when you have an array filled with data, you normally want to do something with
    data. In the following exercise, you define an array, fill it with data, and then
    use a for-each loop to display the values in each array element.


    > LINGO An array element is an individually accessible item in the list. Every
    element is a single item of the same type as the array. For example, when you
    define an int [] each element within the array is of type int.'
