  md: '# Chapter 10


    # # Interacting with Array-Like Structures


    Arrays are open-ended structures that you can use to store all sorts of information.
    However, developers have found that specific implementations are extremely useful.
    These array implementations perform specific tasks in applications, and developers
    use them so that Java includes specific classes to make working with them easier.
    This chapter helps you discover the four most important array-like structures
    that are actually special array implementations:


    +   * Stack: A stack works like a pile of pancakes. You cook the pancakes and
    pile them one on top of the other. Then take the pancakes to the table where you
    take the topmost pancake off the stack and give it to someone to eat. A stack
    is a First, First Out (LIFO) structure that is used to store information between
    calls to other areas of an application or for other situations where you need
    to work backward through the list of items.


    +   * Queue: A queue works like a line at a bank. People arrive and stand at the
    back of the line. They work their way through the line and when they reach the
    front, a teller calls them to address their needs. Many real-world situations
    require that an application process items in the order they''re received. A queue
    is a First, First Out (FIFO) structure.


    +   * Deque: A deque (pronounced deck) is a mixture of the stack and the queue.
    There are really times when you need to process from either end of the list depending
    on the conditions. However, a deque never lets you cheat and obtain values from
    the middle of the list.


    +   * Lists: A list is a kind of specialized array. You use it to gain the extra
    functionality to perform tasks such as combining lambda expressions with arrays.
    Using lists can make your code significantly shorter and easier to read than using
    a standard array. You can access elements anywhere within a list, just as you
    do with an array, but lists provide far greater functionality. It''s also possible
    to treat lists like a stack, queue, or deque as needed.


    # # Using stacks


    Stacks rely on some special functionality to work with the list member. In this
    example, you make it possible for users to push (add) values to the stack and
    pop (remove) values from the stack. The values are always removed in the opposite
    order in which you add them.'
