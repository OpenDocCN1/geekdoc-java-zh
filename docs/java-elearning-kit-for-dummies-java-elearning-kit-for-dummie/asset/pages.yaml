  md: '# Chapter 2


    +   Primitive data types exist as pure numbers. They have the advantage of performing
    tasks faster using less memory.


    +   The primitive data types are: byte, short, int, long, float, double, boolean,
    and char.


    +   Constants make it possible to create secure, high performance variables that
    contain the same value throughout application execution.


    # Try-it-yourself lab


    For more practice with the features covered in this chapter, try the following
    exercise on your own.


    +   1. Open the ShowByte application.


    +   2. Change this application to use the float data type, rather than the byte
    data type.


    You may want to rename the resulting application and its associated class to show
    the data in float type. For example, you could rename the application to FloatVersionOfShowByte,
    if you wanted, something shorter would probably work better.


    +   3. Perform Steps 3 through 7 in the "byte" section of the chapter.


    +   4. Note how the application behavior changes.


    One change that you''ll want to note is how the input affects the application.
    In addition, how does the output from the application appear? Different data types
    do indeed work differently, so this exercise points out to use the right type.


    # Know this tech talk


    data: A series of 1s and 0s assigned to a specific location in memory.


    decrement: Subtracting a value of 1 from a variable.


    exception: A condition that occurs when the application experiences something
    unexpected, such as incorrect user input. An exception occurs during exceptional
    conditions — that no one expected to happen. Every exception tells you the exception
    type, the incorrect condition (when known), and the place where the exception
    happened in the source file.


    floating point number: An approximation of a real number, which is a number that
    has both an integer and a decimal portion, such as 5.1.'
