  md: '# Know this tech talk


    +   - associativity: The order in which Java performs binary operations.


    +   - binary operator: An operator that requires two operands to function. The
    addition operation, as specified by the + operator, is an example of a binary
    operator.


    +   - bitwise: The act of modifying a value bit at a time, rather than acting
    on the value as a whole.


    +   - class: A blueprint written in code for creating objects. A class can include
    methods, properties, and events. The class defines specific ways to manipulate
    data in a safe manner.


    +   - grouping: The act of using parentheses to show the preferred order of completing
    tasks, rather than relying on the default order.


    +   - negation: The act of setting a value to its negative equivalent. This means
    that a positive value becomes a negative value, and a negative value becomes positive.
    A value of 2 becomes -2, and a value of -2 becomes 2.


    +   - object: An instance of a class created using the new operator.


    +   - operand: The variable or constant used with an operator to produce a result
    from an operation. For example, looking at A + B, A and B are both operands, +
    is the operator, and addition is the operation.


    +   - operator: A special symbol or symbol that performs a predefined task with
    a variable — either a primitive type or an object. In some cases, operators change
    the value, but in others they simply perform a comparison and provide the result
    output.


    +   - precedence: The order in which Java interacts with operators when an equation
    or expression contains more than one operator. Java always performs multiplication
    before it performs addition. Most of the rules of precedence are the same as used
    by mathematicians.


    +   - ternary: An operator that requires three operands to function. For example,
    the conditional operator requires three operands: the conditional expression,
    a true output, and a false output.


    +   - unary: An operator that performs an operation on a single operand. For example,
    B++ is an example of a unary operator where B is the operand and ++ is the operator
    for an increment operation.'
  merge: -1
