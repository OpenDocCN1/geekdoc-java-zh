  md: '# Distinguishing error types


    Knowing when an error occurs is important. You need to understand when to look
    for a particular problem in your application. However, it''s also important to
    understand how errors occur. The kind of error determines the strategy you use
    to find it and what you can do to fix it. Although some errors will require that
    you fix the code and update the application, some errors are fixed by retrying
    the operation or interacting with the user in some way. The following sections
    discuss the types of errors you will encounter most often.


    # Syntactical


    A syntactical error is one in which the language you use to create your code is
    incorrect. For example, if you try to create a statement that doesn''t include
    the condition in parenthesis, even when the condition is present on the same line
    as that statement, that is a syntax error. The compiler will catch most of these
    errors for you. If the syntax of your code is Incorrect, in most cases the compiler
    can''t use the code to create byte code for the JRE. Here''s a list of most common
    syntax errors:


    +   - Using capitalization: One of the most common syntax errors that new developers
    make is to capitalize keywords, rather than lowercase. Java is the proper case
    when your code is essential. This same error can occur with class names, variables,
    or any other code type you use as part of Java application. A variable named myvar
    is always more correct than MyVar.


    +   - Splitting a string over two lines: Java doesn''t care if your code appears
    on one or more lines. However, if you split a string across lines so that the
    string contains a newline character, then the compiler will object. The answer
    is to end the string on the first line with a double quote, add a plus sign to
    tell the compiler you want to concatenate (add)


    # EXTRA INFO


    Java 8 has a stronger emphasis on security, which means that you''ll see more
    Exceptions than you work with your application. Seeing an increase in security
    exceptions doesn''t mean your code is faulty or Java 8 is filled with bugs — it
    means Java 8 automatically discusses and tells you about issues that could cause
    security problems as people use your application. The SecurityException appears
    at http://download.java.net/jdk/docs/api/java/lang/Exception.html. You''ll want
    to know all the hubbub is. You can find a summary of the changes in the series
    of slides presented in the CON7932_mullan.pdf found at https://docs.oracle.com/entry/slides/javaone_session.
    These changes are further explained as part of the JDK Enhancement Project (JEP)
    entries at http://jdk.java.net/projects/8/features. The numbers found in the slides
    to those on the update site. The point is that Java 8 helps you create applications
    that are most secure and reliable.'
