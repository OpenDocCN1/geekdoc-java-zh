    # double


    The double works precisely the same as the float, but it uses 64-bits

    instead of 32-bits to hold information. The larger memory space means that

    double can hold larger numbers — a range from -1.797693134862315e308

    to1.797693134862315e308 (positive or negative). It also means that

    double can add precision to inexact floating point values. For example,

    if you want to calculate the circumference of a circle, a double that contains

    t value of pi will offer more precision than an equivalent float.'
