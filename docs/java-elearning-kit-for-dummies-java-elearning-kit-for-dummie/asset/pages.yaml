    # Defining Variable Scope


    As your applications become more complex, the need to consider scope becomes ever
    more important. The main reason is that you can inadvertently introduce a bug
    into your application by not observing scoping rules. This can result from a field
    or other member being used incorrectly by the application (such as adding an incorrect
    data value or accessing a method at the wrong time or with incorrect data). In
    addition, incorrect scoping can leave the door open for outsiders to interact
    with your application in unforeseen ways (such as a virus). The following sections
    assume that you have already read the scoping information in the “Long versus
    long” section in Chapter 3.


    # Considering default scope


    The default scope occurs when you don''t specifically assign a scope to a class
    element. Many Java developers have no idea what the default scope is for some
    elements (and using a default scope means your code isn''t documented), it isn''t
    very often. Even so, you need to know what the default scope is for various elements
    because some Java developers rely on it. However, before you understand the default
    scope, you need to consider visibility — the measure of which application elements
    can see a member. Java provides the following levels of visibility (in general
    order of encapsulation):'
