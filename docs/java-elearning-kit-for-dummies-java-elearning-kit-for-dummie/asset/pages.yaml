  md: '# Working with Common Objects


    Java provides access to new date and time classes. You can read about these classes
    in the ''Using the New Date and Time API'' section of this chapter. These classes
    will eventually replace the functionality provided by the Calendar type.


    However, you may need

    now want to know how you need to know about the Calendar type because it appears
    in a large number of existing applications. When you create new applications,
    rather than change existing applications, try to use the new date and time classes
    that your application will continue to work well into the future.


    # GO ONLINE


    Java has an even older class than calendar called Date that you can also use with
    time and date values. Date objects work similarly to Calendar objects, but with
    less functionality. Generally, you are better off using the Calendar object when
    working with date and time in existing applications. However, it''s helpful to
    know about both classes. You can read Date at http://www.oracle.com/docs/java/util/Date.html.
    The site at http://www.java-forums.org/java-tutorials/2775-java-date.html provides
    some examples you can try.


    # BigDecimal


    Creating a decimal number in Java is an approximation. I could give you a really
    long and complex explanation of what happens, but the simple answer is that the
    float and double data types are using base 2 values, which is what computer understands.
    (We rely on base 10 values).


    Some numbers simply don''t translate well between the two. To overcome this problem,
    you can tell Java to use a special class BigDecimal to represent decimal values
    in base 10, rather than base 2. The benefit of using BigDecimal is that your application
    becomes significantly more accurate when performing financial calculations or
    a trip to Mars. The down side is that BigDecimal requires more processing cycles
    (making your program slower) and more memory. Use BigDecimal when needed


    # EXTRA INFO


    The inability of Java to represent floating point numbers accurately doesn''t
    stem from some problem inherent to Java, so no amount of work you perform in Java
    will fix this problem. The problem exists in the processor in your machine—which
    every computer language has the same decimal problem. Just about every computer
    language in existence has a decimal type of some sort to handle situations where
    absolute accuracy is required and the decimal type has precisely the same benefits
    and limitations as its Java counterpart in every case. To see the actual method
    behind thisม่า, check out the article at http://en.wikipedia.org/wiki/Floating_point.
    You can find a Java-specific article about floating point numbers at http://www.ibm.com/developerworks/java/library/j-math2/index.


    ![](img/e352a1505e4e30ed140c4898f6139f17_94_0.png)'
