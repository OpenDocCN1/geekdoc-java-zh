  md: '# Understanding the Structure of Classes


    A building contractor can understand a blueprint designed by an architect because
    both of them use the same set of rules and conventions. When you create a class,
    you''re the architect. The blueprint you create must communicate your ideas to
    the computer, which plays the role of the builder. For this communication, you
    must use both the same rules and conventions. The following sections describe
    the rules and conventions for creating classes in Java by dividing the task into
    functional areas, such as writing a method.


    # LINGO


    A convention is an agreement between you and the JRE. In fact, when you read other
    documentation, it may actually view the term contract to express the idea of a
    convention. No matter what term you use, the convention expresses the responsibilities
    of each party in defining the class and building it as an object. In some cases,
    you can also view a convention as custom—the set of practices that Java developers
    created for developing classes. There isn''t a right or wrong about the conventions
    that Java uses; this set of practices is simply what Java developers created over
    time as the most efficient way of defining a class.


    # Calling methods


    You''ve worked with a number of types in the book. However, you really haven''t
    seen how methods are put together until now. A method describes an action that
    the object can perform. Even though most of the class examples to this point have
    just one method, a class can have any number of methods that it requires.


    In looking methods, note that every method can have the following parts:


    +   **Modifiers (optional):** The modifiers change how the class behaves. For
    example, if you make a class private, the method is visible only to other methods
    within the class. When you create an object from the class, the object''s user
    can''t access the private method.


    # EXTRA INFO


    You can''t call a non-static method from a static method. The non-static method
    is associated with an object—an instance of the class—while the static method
    is associated with the class itself. To access the non-static method, you must
    create an object. You can, however, access a static method from a non-static method.
    The static method always exists, even before the object is created. Therefore,
    the static method is always accessible.


    ![](img/e352a1505e4e30ed140c4898f6139f17_263_0.png)


    A method can have more than one modifier added to it. For example, you can use
    public and static together to make the method visible outside of the class itself,
    rather than as part of an object created from the class.

    The main() method found in most of the examples so far in the book is both public
    and static.'
