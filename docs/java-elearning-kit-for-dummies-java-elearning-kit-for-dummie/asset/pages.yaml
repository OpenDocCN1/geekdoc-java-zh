  md: '# 394 Chapter 13


    The example begins by creating a File object, InputFile, to access the XML file
    on disk. This file contains XML data; it doesn''t contain an XML document. The
    difference between the two is that the XML document is simply text that contains
    information in a specific format. XML document adds intelligence to that data
    so that you can tell the difference between a color and a fruit.


    ![](img/e352a1505e4e30ed140c4898f6139f17_407_0.png)


    To create an XML document, you begin by creating a Document Builder Factory —
    in this case. Think of Factory as a special object that outputs a kind of product,
    which turns out to be a DocumentBuilder named Builder. You can use Builder to
    create an XML document based on the content in MyData.xml. To do this, Builder
    must read the content of MyData and interpret it in a pro-cess parsing. The output
    of the Builder.parse() method call is an XML object, XMLDoc.


    At this point, you have access to an XML document that contains a number of elements,
    beginning with the processing instruction and the topmost element. <Root>. The
    next step is to process this information to use useful output. Calling ProcessElements()
    with the Root Element and the current document level (0) starts the process.


    The ProcessElements() method shows how to use recursion in Java. Recursion is
    a special programming technique where a method calls itself to perform work. The
    idea is to divide a complex task consisting of multiple subtasks into a really
    simple task and then use the result from that task to work upward into more complex
    parts of the task. You use recursion when you can''t be sure how many levels a
    complex task will contain.


    # LINGO


    > The act of parsing any kind of data involves reading and interpreting the data
    to create a particular kind of object output. When working with XML data, the
    act of parsing the special symbols within the text document and uses them to create
    a Document object that has intelligence about the design of the XML data. The
    result is that you can request information from the Document about the XML document
    in context. A <Color> node becomes different from a <Fruit> node.'
