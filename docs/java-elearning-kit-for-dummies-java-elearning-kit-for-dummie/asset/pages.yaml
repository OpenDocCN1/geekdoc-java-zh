    # Know this tech talk


    **anonymous inner class**: A special kind of unnamed class that contains one or
    more interfaces and one or more methods. You use an anonymous class when a formal
    class declaration is unneeded or unwanted. Because an anonymous class has no name,
    you can''t reference it outside the class in which it exists.


    **constructor**: A special type of method used to create an object from a class.
    Every class comes with at least one constructor, the default constructor.


    **event**: A special occurrence within a class that the class makes aware of.


    **event handler**: A special method that''s designed to react to events generated
    by another class.


    **event listener**: A special class that''s designed to listen for events that
    occur within another class.


    **field**: A variable that''s defined as part of a class or an object.


    **interface**: A class that defines unimplemented methods. Any class inheriting
    from an interface must provide implementations of the described methods.


    **getter**: A special method used to obtain the value of a field and make it accessible
    outside the class or object.


    **lambda expression**: An anonymous class that contains just one functional interface
    and one method. Normally, a lambda expression is designed to perform a task by
    using the shortest possible code.


    **method**: The means of telling a class or object to perform a specific task.


    **override**: To replace the implementation of a method in a parent class with
    a new implementation in a child class. Often, the parent class supplies a simple
    method that doesn''t address the requirements of the child class.'
