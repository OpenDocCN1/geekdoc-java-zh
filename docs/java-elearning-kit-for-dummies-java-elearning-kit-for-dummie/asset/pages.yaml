  md: '# Summing Up


    Here are the key points you learned about this chapter:


    +   - The for loop repeats a series of tasks a specific number of times.


    +   - Use the break statement to stop a for loop from continuing to process tasks.


    +   - Use the continue statement when you want to stop a single for loop from
    processing but want to continue with the remaining loops.


    +   - Nest two or more sets of for loops when you need to process multiple dimensions
    or create a complex processing loop series.


    +   - A while loop continues to repeat a series of tasks until a specific condition
    is met.


    +   - The do . . while statement acts much like the while statement, but it has
    the distinction of executing the tasks within its structure at least once, no
    matter what condition you might set for it.


    +   - It''s possible to repeat most of standard looping requirements using the
    for, while, or do . . while statements and your choice depends on convenience
    or personal taste.


    +   - The for-next loop is special in that it works with each element in an enumeration,
    array, or collection.


    +   - The for-each loop relies on a special kind of for loop to do its work.


    +   - You use the for-each loop to process individual elements of a collection
    of elements one element at a time.


    +   - Using an enumeration can make it easier to work with your application.


    # Try-it-yourself lab


    For more practice with the features covered in this chapter, try the following
    exercise on your own.


    +   1. Open the UsingEnumerations application.


    +   2. Create a new enumeration that contains a list of colors.


    Make sure you separate each color with a command and don''t include any spaces
    in the color names.


    +   3. Rewrite the code to display the enumeration to the user with the for-each
    loop.'
