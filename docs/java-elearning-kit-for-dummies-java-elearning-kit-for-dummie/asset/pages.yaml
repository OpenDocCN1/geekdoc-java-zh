  md: '# Chapter 5


    +   Unary operators cause the variable to interact with its own content in some
    way, such as incrementing (adding to) or decrementing (subtracting from) the variable''s
    value. In many respects, unary operators provide a shorthand that makes application
    code easier to understand and faster to write.


    +   Relational and conditional operators of some type perform a comparison of
    and provide a result that reflects that comparison. These operators make it possible
    for applications to make decisions based on the content of variables.


    # LINGO


    > Precedence defines the order in which tasks are performed on a computer. Think
    priority when you see precedence. Just as you prioritize the work you need to
    do, the computer must prioritize work it must do. The order of precedence is essentially
    the same for all computer languages, and this order is borrowed from mathematicians.
    In short, the rules you learned for performing math tasks in school are the same
    rules that the computer uses to perform tasks. As a result, you''ll likely find
    it easier to learn the order of precedence than you initially think.


    If every operator had precisely the precedence (priority), chaos would result
    because the computer wouldn''t know which task to perform first. Because computers
    are logical and well-ordered instructions, the developers of Java had to create
    an order in which operators are used when more than one of them appears in a single
    line of code. The order of precedence helps determine which task to do first,
    making it clear how the code is written. You need to understand precedence in
    order to write good code. Otherwise, you might end up with code that assumes the
    computer will be working with one operator first and only find out that the computer
    really worked with another operator.


    # Storing Data Using Assignment Operators


    You''ve already used assignment operators quite a bit in this book so far. In
    fact, almost every example has some type of assignment operator in it because
    it''s nearly impossible to write an application without one.


    # Performing a simple assignment


    The kind of assignment operator you''ll use most often is a simple assignment.
    Simple assignments rely on the equal sign (=). In this exercise, you use a simple
    assignment to place a value in a primitive type and display onscreen.'
