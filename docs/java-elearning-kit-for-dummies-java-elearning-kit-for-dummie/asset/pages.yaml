  md: '# Chapter 5


    # Creating objects


    Throughout this book, you create objects of various types. Java applications typically
    require one or more objects in order to work. In fact, the Java application itself
    is an object. Anytime you see the word class in a listing, you''re talking about
    objects. Every application in this book is a class, which means every application
    is an object.


    It''s important to realize just how objects work. When you create a class, what
    you''re creating is a blueprint. The blueprint describes how to create an object,
    but it isn''t the object. To create an instance of a class (the object), you use
    the new operator to create an instance of the requested object using the class
    you specify as a blueprint. An application can create as many instances of a class
    as required, provided there are enough resources (such as memory) to do so.


    # Casting one type to another


    The act of casting transforms one type of variable into another type. It''s important
    to realize that casting isn''t some sort of magic. As far as the computer is concerned,
    all of your data is 1s and 0s. The translation takes place, in how your application
    views the data. When making a cast between disparate types, such as casting an
    integer to a floating point type, the actual form of the data changes as well,
    but not in a way you need to worry about. (It all happens beneath the surface.)


    Casting can produce loss. For example, if you cast a floating point type to an
    integer type, you''ll lose the decimal portion of the floating point number. However,
    the integer portion will remain intact. When you cast a number in a larger container,
    such as a long, to a smaller container, you can lose the upper bits, and the actual
    value of the number can change.


    In all cases, the cast occurs when you place the new type you want to use within
    parenthesis next to the original variable. For example, (float)MyInt would cast
    an int to a float type. In the following example, you see how various kinds of
    casting work.


    Files needed: TypeCasting.java


    +   1. Open the editor or IDE that you''ve chosen to use for this book.


    +   2. Type the following code into the editor screen.


