  md: '# Chapter 11


    # Converting Data to and from Strings


    Data conversion is an essential part of Java programming. Humans understand strings
    better than they understand the abstractions of other data types Java uses. In
    addition, lets you combine disparate types such as numbers and Boolean values
    together. However, you can''t use strings to perform computations or assess the
    truth value of an expression. In short, you need some way to convert between data
    types.


    > LINGO

    Data conversion defines a method for changing data from one type to a completely
    different type. For example, using data conversion, you can change a string into
    a number. You use data conversion when working with different types, which contrasts
    with casting int and byte. You saw the first example of casting in bytes in Chapter
    3.


    The most common conversion between String and other data type is. In some cases,
    it''s simpler to manipulate numeric values as strings. However, the following
    example shows one benefit of using a String for user input and converting the
    data to an int — error handling. The following example demonstrates a technique
    for ensuring accurate numeric input from the user.


    Files needed: ConvertIntString.java


    +   1. Open the editor or IDE that you''ve chosen to use for this book.

    2. Type the following code into the editor screen.


    # EXTRA INFO


    Java 8 makes it possible to use unsigned integer and long values. Normally an
    integer ranges values between -2,147,483,648 to 2,147,483,647. Likewise, a standard
    long ranges in value from -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807.
    However, when working with unsigned values, an integer from 0 to 4,294,967,295
    and a long from 0 to 18,446,744,073,709,551,615 can. This extended positive range
    can make it possible to perform all sorts of large numbers. To make unsigned values
    work, use unsigned methods such as parseUnsignedInt() and parseUnsignedLong()
    for data conversion. Even though addition, subtraction, and multiplication work
    the same, division also requires the special divideUnsigned() and remainderUnsigned()
    methods. You can read more about the special unsigned methods at http://download.java.net/jdk8/docs/api/java/lang/Integer.html
    and http://download.java.net/jdk8/docs/api/java/Long.html.'
