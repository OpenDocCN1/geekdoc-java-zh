  md: '# Chapter 5


    # Table 5-2

    Java Operator Order of Precedence


    | Priority | Operators | Description | Associativity |

    |---|---|---|--|

    | 1 | [] | Array index used to specify which array element to access. | Left |

    | 1 | () | Method call or grouping. Grouping is especially important in that changes
    the normal rules for interacting with operators, such as performing addition before
    multiplication. | Left |

    | 1 | . | Member access used to interact with a member of an object. | Right |

    | 2 | ++ | Prefix or postfix increment. Adds a value of 1 to the variable. | Right
    |

    | 2 | -- | Prefix or postfix decrement. Removes a value of 1 from the variable.
    | Right |

    | 2 | + | Unary plus or minus. Sets the sign of the variable. The plus operator
    is never used because variables are positive by default. The minus operator negates
    the variable. | Right |

    | 2 | ~ | Unary bitwise Not operator reverses the bits in a variable. In other
    words, it makes the variable the opposite of what it was. For example, a 5 (binary
    00000101) becomes a -6 (binary 11111010). | Right |

    | 2 | ! | Unary Boolean Not operator is used in Boolean evaluations to turn true
    into false and false true. | Right |

    | 2 | (type) | Performs a cast to change the type of a variable into another type.
    | Right |

    | 2 | new | Creates a new object based on the class provided. | Right |

    | 3 | * / % | Performs the multiplication, division, and remainder math operations.
    | Left |'
