  md: '# Choosing an IDE for Java


    help, but does not offer compiling and debugging. Editors are simple and simple.
    An example of a good Java editor is JEdit (http://www.jedit.org/index.php?page=download).
    This product is free, and you can obtain Linux, Windows, and Mac versions.


    # GO ONLINE


    You can find entire sites devoted to the topic of Java editors and IDEs. One of
    the more comprehensive offerings is at http://apl.jdu.edu/hall/java/IDES.html.
    If you don''t like any of the products mentioned in this section and feel that
    you''d like something better than Notepad to write your applications, check online
    for other offers. There is an IDE or editor that will meet your needs.


    # Determining when to use a particular development environment


    It''s important to make a good choice when you decide on use tools for your application.
    A tool that works for one person may not work for someone else. Experienced developers
    usually have multiple tools at their disposal for this reason — It is not possible
    for a single tool to meet every requirement. However, you''re just starting out,
    so one of the tools described in the previous sections will work for now. When
    you start creating more or larger applications, you''ll want to consider these
    guidelines in choosing a tool.


    +   * Does the tool match complexity and size of your application? Large applications
    require a good debugger. Working with multiple programmers means the tool must
    provide support.


    +   * Are you comfortable with the tool''s user interface?


    +   * What level of support does the tool''s vendor supply? If this is a community-supported
    tool, look at the online forums to see how many people are actually providing
    support (versus those who are asking questions).


    +   * What additional tools does the product support? For example, if you''re
    working in a team environment, it''s important that your tool provide source control
    — a method of tracking changes to your code, recording who is currently making
    changes to a particular file, amongst other things.


    +   * Can you find good reviews for the tool? A good review is unbiased and discusses
    both the pros and cons of the tool. If you find yourself believing that the tool
    is too good to be true, it probably.


    +   * How much does the tool cost? Some of the best tools in the world are free,
    but often means free crippled — software whose functionality is intentionally
    limited — or lacking support. Then again, some costly tools are poorly written
    or overkill for the simple projects you''re likely to start working on at first.
    Make sure you question whether the tool will provide everything you need at a
    cost you can afford.'
