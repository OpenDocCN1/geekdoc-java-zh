    # # Throwing Errors


    It''s essential that your code makes every effort to fix a problem. However, there
    are times when your code simply doesn''t have enough information, resources, rights,
    or some other requirement to fix a problem. When this happens, your code throws
    an error using an exception object. The term exception is appropriate because
    it should be the exception to the rule, rather than the first act that the application
    performs. Even so, applications encounter errors that require exceptional measures,
    and the following sections describe how to deal with these sorts of situations.


    # # Throwing errors during exceptional conditions


    In the following exercise, you create an application that can generate multiple
    kinds of errors. Normally, you wouldn''t throw an error if a value is in the wrong
    range — you''d display a message directly to the user instead. However, this example
    demonstrates how to throw and catch an error from within a method. As you might
    expect, this application includes error handling to catch a number of errors.'
