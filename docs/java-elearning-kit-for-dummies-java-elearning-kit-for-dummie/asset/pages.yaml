  md: 'You have many different ways to store your data, but the majority of them are
    either unique to a particular platform or are implemented inconsistently across
    platforms. In the past, developers often had to use text files to transfer data
    between platforms, but text files suffer from a loss of context. The data is there,
    but what the data means is missing. eXtensible Markup Language (XML), one of the
    better innovations when it comes to data storage, was developed in order to address
    this issue. XML provides the means to describe data in a way that none of the
    context or meaning is lost. This Chapter builds on what you discovered in Chapter
    12 to provide a basic overview of XML usage in Java.


    # Understanding How XML and Java Interact


    It''s important not to become overwhelmed by XML before you get started using
    it. At its core, XML is simply a fancy sort of text file. So, when you read XML
    into your application, the underlying technology is simply reading a text file
    — just as you''ve already discovered in Chapter 12. The difference is in the way
    the text is interpreted. XML relies on tags — information between angle brackets
    (<>) — to describe the data contained within the text file. So, on top of reading
    the file into the application as text, Java must also provide a means to interpret
    the data in order to obtain the meaning that the text contains. For example, an
    entry such as <Name>John</Name> could mean that the user''s name is John.'
