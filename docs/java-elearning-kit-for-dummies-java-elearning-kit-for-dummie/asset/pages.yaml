  md: '# Chapter 10


    # Know this tech talk


    **annotation**: A method of adding documentation to application source code where
    the compiler can see and interact with the document. This is contrasted with a
    comment, which is documentation that the compiler cant see.


    **array**: The simplest type of list that Java supports. You can add, access,
    and remove array elements in order.


    **array element**: An individually accessible item within the list of items stored
    in an array. The elements are numbered from 0 through the end of the array. Each
    element is accessed using its unique number.


    **deque**: A double-ended queue — one in which you can add or remove items from
    either end of the list, but not from the middle of the list. The term is pronounced
    as `deck`.


    **generic class**: A class that relies on a template to create objects of a specific
    type using generic code that applies equally all types. The developer provides
    a parameter that specifies the kind of object the generic class should create.
    For example, `ArrayList<Integer>` takes a raw `ArrayList` that accepts any object
    and turns it into a parameterized `ArrayList` that accepts only `Integer` data.


    **immutable**: A variable that cant change its characteristics once you create.


    **jagged array**: An array in which the dimensions are not of equal length. The
    dimension sizes remain fixed after declaration, but the array lacks a precise
    number of elements per dimension. This type of array is helpful in real-world
    situations where objects have a differing number of data points.


    **lambda expression**: An anonymous class that contains just one functional interface
    and one method. Normally, a lambda expression is designed to perform a task using
    the shortest possible code.


    **lookup table**: An array that uses to hold calculated information that an application
    uses relatively often. Calculating the information once and storing it in a table
    makes the application run faster.


    **map**: An intelligent array of items that provides database-like capabilities
    for data management. A map creates an ordered collection of data that makes it
    possible to perform complex analysis with less work than an array would require.


    **parameterized type**: A data type that creates container objects that can hold
    objects of a specific type. The parameter appears within angle brackets (`<>`)
    after the type declaration and defines specifically which'
  merge: -1
