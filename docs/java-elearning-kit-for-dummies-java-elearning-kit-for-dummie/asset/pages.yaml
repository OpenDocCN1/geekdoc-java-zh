  md: '# Chapter 8


    Optional objects to avoid "exceptions" exercise of this chapter.) If that method
    had to call another method, that method would be at the third level, and so on.
    Most exceptions are made up of many levels of calls. In fact, when you see an
    exception onscreen, it actually displays a list of the methods called the current
    method in a format called the stack trace.


    Handling errors is an essential part of good programming practice. If you want
    robust applications that do not constantly crash, you need to provide good error
    handling. However, trying to handle an error when you don''t have enough information
    to handle that error is a problem. When your code attempts to fix an error at
    too low a level, it hides the error from a level that could fix it. You want to
    fix an error at the lowest possible level, but not at the expense of providing
    a repair that could actually end hiding something serious.


    > **LINGO**

    The stack call is a listing of methods and the order in which they are called
    by other methods. Knowing the stack call can help you locate the source of a potential
    error when it doesn''t happen at the current level of the application.


    When you find that a particular level of an application doesn''t have the required
    resources, information, privileges, user access, or some other item needed to
    handle an error, then you issue a throw statement with the appropriate exception.
    The previous level of the exception will receive the exception and determine whether
    it can handle it. However, if the main() method receives the exception, you must
    determine what to do with the error, or the application will crash. It is generally
    considered bad programming to simply let the application crash — you need to come
    up with some way to deal with errors that the application encounters.


    # Required error handling


    Java provides two kinds of exceptions: checked (those monitored by the JRE) and
    unchecked (those that aren''t monitored by the JRE). All the exceptions in the
    chapter so far are unchecked exceptions. You have the option of handling an unchecked
    exception. However, Java forces you to handle a checked exception. Your code won''t
    compile if you try to use a method that has a checked exception associated with
    it.


    > **LINGO**

    A checked exception is one that the JRE is told by the class definition to monitor.
    The JRE forces the user of the class to provide handling for the exception to
    ensure that the class performs reliably.


    All kinds of details are associated with checked and unchecked exceptions. An
    easy way to know whether an exception is checked is to know the parent class.
    All exceptions that are subclassed of the Error or RuntimeException are unchecked
    — every exception is checked. The best practice is'
