  md: 'Except for the simplest of applications, it''s highly unlikely that you''ll
    encounter an application that is error free. Errors in coding happen for a wide
    variety of reasons. It isn''t enough to create an application that uses the correct
    code. The application must also have the right logic and use arguments in precisely
    the correct manner. In some cases, an error actually exists outside of the application,
    so the application doesn''t even have control over whether the error occurs. The
    best application can do is to handle the error so that the application doesn''t
    crash and potentially damage the user''s data.


    There are situations where the code in a particular part of your application can''t
    handle an error. Wherever the code doesn''t have enough information or it doesn''t
    have the required rights to perform a task. In some cases, you need to interact
    with the user to allow the user to make the decision. These are just a few of
    the circumstances where your application has to signal an error. A Java application
    uses an exception to signal an error. You will see exceptions in other chapters
    in this book. This is the first chapter where you''ll discover how to throw an
    exception. Throwing an exception means to create one and send it to the caller.


    # LINGO


    A coding error represents any action that the application takes is outside of
    the anticipated behavior for that application. Errors can be dramatic, such as
    an application crash. However, errors are often more subtle, such as displaying
    incorrect output or producing an unexpected result. In some cases, errors are
    not noticed by the user at all, but they present opportunities for nefarious individuals
    to cause damage to the application, or the system that supports it.


    An exception is an alert of a condition. It describes an exception in your application
    and tells you that an error has occurred. Exceptions can happen for all sorts
    of reasons. The error might be in your code or in the application environment.
    For example, if your application tries to open a file that doesn''t exist, the
    Java Runtime Environment (JRE) will generate an exception that tells your application
    about the error.


    Throwing an exception means to create the exception object and send it to the
    part of the application called the current code. When your application throws
    an exception, it creates an object that tells others that it has encountered an
    error it can''t fix. As the term suggests, throwing an exception is something
    your code does for exceptional conditions, when no other alternative is available.'
  merge: -1
