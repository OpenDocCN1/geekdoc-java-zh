  md: "> If you read this book from end to end, then you’ll know quite a bit about\
    \ Java when you’re finished.” This is a human form of a conditional statement.\
    \ A conditional statement in an application begins with a condition and ends with\
    \ a task. You use conditional statements every day. Another example of a conditional\
    \ statement is, “Choose the item that most closely matches your age from this\
    \ list for your prize.” Programs can use that sort of conditional statement too!\
    \ The main purpose of this chapter is to show you how to write conditional statements\
    \ in a way that the computer understands; but from a logical perspective, you\
    \ already know everything to use conditional statements.\n\n# Using a Simple If\
    \ Statement\n\nThe statement is the easiest of the conditional statements to understand\
    \ and you’ll find that you use it often. An if statement consists of a condition\
    \ that looks like this:\n\n```\nif (expression)\n```\n\nwhere expression is the\
    \ condition that you want to check. The task associated with the if statement\
    \ appears within curly braces like this:\n\n```\n{\n  Tasks you want to perform\n\
    }\n```\n\nEvery if statement follows the same pattern of condition followed by\
    \ task. With this pattern in mind, in the following example you create an application\
    \ that relies on an if statement to make a decision about a number that you type.\n\
    \n| LINGO |\n| Computers rely heavily on math used to express an idea to make\
    \ certain decisions. Consequently, the part of a conditional statement is also\
    \ called an expression. An expression always equates to a value of true or false,\
    \ so it is a Boolean value. However, when you think about it, use Boolean expressions\
    \ in your daily conversation. For example, “The item costs less than $5.00, then\
    \ I’ll buy it.” The condition—item costs less than $5.00—is a Boolean expression.\
    \ |"
