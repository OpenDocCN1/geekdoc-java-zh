  md: 'Java is an amazing language. Most programming languages are designed around
    a single operating system or environment. For example, when you work with the
    Microsoft .NET Framework languages, such as C# or Visual Basic, you''re working
    with Windows unless you get a special third-party product to make these languages
    work elsewhere. Likewise, Macintosh developers commonly use Objective C to create
    their applications. Java means that you''re creating applications that appear
    in a browser, rather than applications that run within the host operating system.
    Unlike all these boundaries. You can find Java running on just about every operating
    system, and Java applications can run both within the operating system environment
    and as part of a browser presentation.


    It isn''t hard to find a copy of Java. Some operating systems come with Java installed,
    or another application will install Java for you. Even if Java isn''t installed
    on your version, a version of the language is available for most platforms. One
    of the first tasks that you perform in this chapter is to install your own copy
    of Java.


    Java receives strong support in the developer community. You can find sorts of
    tools, add-ons, and free source code. In fact, the number of choices can be overwhelming.
    This chapter starts out slowly and makes you aware of the choices you need to
    make based on how you plan to use Java to create applications.


    Programs contain standard basic parts that this chapter shows you how to construct.
    You can add to program functionality by using standardized features found in the
    Java Application Programming Interface


    # LINGO


    Java programs use the Java Development Kit (SDK) to gain access to Java features,
    such as the ability to display information on screen or work with files. To make
    the process of writing applications as easy as possible, the programmer uses an
    Integrated Development Environment (IDE) to write code. The IDE provides special
    help, such as reminding you about the Java features you can access as you type
    and finding errors in your code. After the programmer finishes writing an application,
    the source code is compiled into a .class file, and you can run it using the Java
    Runtime Environment (JRE).'
