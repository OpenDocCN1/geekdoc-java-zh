  md: '# Obtaining and Installing the Java 8 JDK


    Don''t worry about understanding all these reasons now. Some of these reasons
    are emphasized later in the book, and some of them won''t really matter unless
    you work with other languages. File these reasons away for now and think about
    them as you work through this book and building applications of your own.


    # Obtaining and Installing the Java 8 JDK


    The examples in this book rely on the Java Standard Edition (SE) Development Kit
    8, which is the latest version of Java. At least some of the examples will work
    with older versions of Java, but you''ll find that you get better results using
    Java 8. Oracle does create Java 8 in a number of other editions, but don''t worry
    about them for this book. Yes, if you have Enterprise Edition (EE) Development
    Kit 8, the examples will work fine, but you don''t require such a fancy version
    of the product to use this book. With that in mind, the following sections describe
    how to download and install the SE Development Kit 8.


    # Downloading Java 8


    To create a Java application, you must have the Java Development Kit (JDK). If
    you want others others don''t need to write application code, then they must have
    the Java Runtime Environment (JRE). The version of the JDK must match the version
    of your JDK to ensure that the application will run as expected. You can download
    a copy of the JDK for your operating system from https://jdk8.java.net. The JDK
    currently supports the following:


    +   - Windows 32-bit and 64-bit

    - MacOS OS X 64-bit

    - Linux 32-bit and 64-bit

    - Linux for the Accord RISC Machine (ARM) 32-bit processor are typically used
    in tablets and smartphones.

    - Solaris 32-bit and 64-bit (You have to install the 32-bit version first and
    then the 64-bit version.)

    - Solaris SPARC 32-bit and 64-bit (You have to install the 32-bit version first
    and then the 64-bit version.)


    Simply follow the link for the version of Java 8 that you require. If you want
    to obtain a copy of the JRE for your users, you can get it from https://jdk8.java.net
    by clicking the JRE link rather than the JDK link. You must use the JDK when working
    with a device equipped with an ARM processor. The JDK also comes with a copy of
    a JRE as a subdirectory of the installation.'
