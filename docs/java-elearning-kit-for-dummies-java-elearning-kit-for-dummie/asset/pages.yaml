  md: "# Displaying Date and Time\n\nJava applications will use two distinct methods\
    \ for working with date and time for the foreseeable future. The older method\
    \ relies on the Calendar object. A newer method, introduced with Java 8, relies\
    \ on the date and time API.\n\nEach method has its own way of presenting information\
    \ to the viewer. The older method is less flexible and requires more code, but\
    \ it's the technique you see in most Java applications today. The newer date and\
    \ time API provides significant flexibility and offers a range of useful built-in\
    \ formatting options that require little code. However, because Java 8 is so new,\
    \ you won't see this technique used often just yet. The following sections discuss\
    \ formatting for both methods.\n\n# Using the Calendar object\n\nMost people are\
    \ quite picky when it comes to display date and time because the world is a time-oriented\
    \ place. It's important to see the date and time presented precisely as expected.\
    \ The exercise in the \"int\" section of Chapter 2 exposes you to the Calendar\
    \ object that provides access to the date and time on your computer. In this exercise,\
    \ you create output that matches specific criteria.\n\nFiles needed: DisplayDateTime.java\n\
    \n+   1. Open the editor or IDE that you've chosen to use for this book.\n2. Type\
    \ the following code into the editor screen. \n\n```\n// Import the required API\
    \ classes.\nimport java.util.Calendar;\n\npublic class DisplayDateTime {\n   \
    \ public static void main(String[] args) {\n        // Get the current date and\
    \ time.\n        Calendar MyCal = Calendar.getInstance();\n\n        // Display\
    \ the date and time on separate lines.\n        System.out.format(\"%te %tB %tY\"\
    ,\n            MyCal, MyCal, MyCal);\n        System.out.format(\"\\n%t1:%tM %tY\"\
    ,\n            MyCal, MyCal, MyCal);\n    }\n}\n```"
  merge: -1
