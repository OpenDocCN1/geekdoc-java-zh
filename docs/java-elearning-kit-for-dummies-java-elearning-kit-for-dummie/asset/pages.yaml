  md: '# Changing Primitive Types into Objects


    The static methods also include several different methods of creating the object.
    This example shows how to use the valueOf() method. In this case, you can create
    the object using a string or a byte value. When working with a String, you can
    provide a radix — the base of the value. The last valueOf() method creates a Byte
    object with a value of 15, base 16 (hexadecimal). If you do not provide a radix,
    Java assumes you use base 10 (decimal) numbers.


    ![](img/e352a1505e4e30ed140c4898f6139f17_102_0.png)


    When you create a Byte using a numeric value, you must add (byte) to front of
    the number. This is called casting — the process of converting one of data type
    into another. Java assumes an int whenever you provide numeric input. Casting
    tells Java that you want to provide a byte value. Because valueOf() requires a
    byte as input, you must cast the int that Java assumes to be byte value.


    You can use objects directly in the example. Java automatically unboxes the object
    to obtain the value and display it on screen. Objects also include special-related
    methods, such as compareTo(), which lets you compare one value to another. The
    floatValue() method outputs the byte value as a float. So you can also cast between
    types using a method when call when a method is provided.


    This particular example shows how to add a blank space between lines. You can
    use system.println() or add \n in front of the text that should appear with a
    space before it. The second form, \n, is called an escape character. When you
    use more than one of these characters, it''s called an escape sequence. The "Using
    Escape Sequences" section of Chapter 4 tells you lot more about working with sequences.


    # LINGO


    Casting converts one data type to another. For example, you can change an int
    into a byte when necessary. A cast is an important Java feature because it''s
    impossible to perform a conversion. If you try anyway, the result could be data
    or incorrect output from your application. For example, if you use an int of 200
    to a byte value, the resulting byte value of -56 will be incorrect because a byte
    cannot hold a value of 200.


