  md: '# Chapter 1


    # Getting local help


    The advantage of using local help, rather than online help, is that local help
    is always available — even when your Internet connection isn''t working. A lot
    of people find that local help also provides faster access because you aren''t
    using a network connection. However, local help does have a disadvantage — it''s
    current of the moment you download it. When an update appears to the Java system,
    you won''t see it unless you download a new copy of help. Often, the help on your
    hard drive simply continues to get outdated because there isn''t any system in
    place to remind you about updates (or even tell you they''re available).


    Even with its limitations, having a local copy of help comes in handy. In the
    following exercise, you download and install local help for your Java installation.


    Files needed: None


    +   1. Open the page at https://jdk8.java.net in your browser.

    nYou see the options for working with Java.

    2. Click the JDK 8 Release link.

    You see a new page with download options for the JDK.

    3. Locate the Additional Resources section of this page. (Scroll down if necessary
    to find it).

    4. Click the Download icon next to the Java SE 8 Documentation entry.

    You see a new page with a licensing agreement.

    5. Click Accept.

    The JDK documentation download link becomes active.

    6. Click the download link.

    You browser downloads the documentation, which is in a .zip file.

    7. Open the .zip file in a directory on your local hard drive.

    You use a folder related to the Java installation on your machine. For example,
    on a Windows system, you may want to create a \Program Files\Docs folder and place
    the help file there.

    8. Open the index.html file in your browser.

    You see an introductory page with a conceptual diagram. You can choose the topic
    you want to use. For example, if you want to read about the java.lang package,
    you click the lang and until link. Figure 1-11 shows the conceptual diagram, which
    is part of a much larger page.'
