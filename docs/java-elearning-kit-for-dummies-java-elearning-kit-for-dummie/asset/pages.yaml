    # Allocating properties


    One of the issues that tends to confuse many Java developers (and some experienced
    Java developers as well), is the concept of properties in Java. Some languages
    have a formal mechanism for working with properties, but Java doesn''t provide
    this mechanism. In addition, there is some level of confusion about the terminology
    that Java uses for specific program elements are related to properties. This section
    uses a specific set of terms that reflects the terminology used by the majority
    of Java developers, but you should expect to see these other usages around online.


    A **property** is a value that you can access as part of the class or the object
    created from the class. You use properties to provide access to a global variable,
    which is also called a *field*. The “Long versus long” section in Chapter 3 contains
    the first example of a global variable in the book. The best practice is to always
    make fields `private` and then rely on special getter and setter methods to access
    them. The combination of field, getter, and setter is a property in Java. Here''s
    a typical example that uses an `int name myInt.'
