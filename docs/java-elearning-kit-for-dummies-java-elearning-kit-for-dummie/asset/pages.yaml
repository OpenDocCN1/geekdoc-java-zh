  md: '# Summing Up


    Here are the key points you learned in this chapter:


    +   - Files store data in specific locations on your hard drive.

    - Directories act as containers to hold both directories and files.

    - A path describes the location of a file or directory on disk.

    - Attributes make it possible to determine specifics about a file or directory,
    such as whether you can read or write it.

    - An absolute path begins at the root directory of the host drive and contains
    every subdirectory between it and the location of the desired directory or file.

    - A relative path begins at the current location and describes how to access the
    current directory or file from that point.

    - The single period (.) represents the current directory, while the double period
    (..) represents the parent directory.

    - Reading and writing files involves the use of streams that act as conduits between
    the hard drive and the user application.

    - Whenever you finish reading or writing to a data file, you must close it or
    the file could be damaged.

    - Temporary files are useful for creating backups of files while you are to or
    acting as a scratchpad for your application.


    # Try-it-yourself lab


    For more practice with the features covered in this chapter, try the following
    exercise on your own.


    +   1. Open the ReadData.java file supplied with the source code for this book.

    2. Save the file as Read2.java.

    3. Change the class name to ReadData2.

    4. Create a file named MyInt.txt and fill it with the numbers 1 through 5, separated
    by spaces.


    The class name must always match the filename. Otherwise, Java won''t compile
    the file for you.


    The numbers should appear as 1 2 3 4 5. The space helps Java recognize individual
    integer values.'
