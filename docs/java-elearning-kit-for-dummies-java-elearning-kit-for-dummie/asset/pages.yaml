  md: '# Chapter 1


    on the Macintosh) will allow formatting codes to the output, making the text useless
    to the compiler. (You can set up TextEdit as a plain text editor using the instructions
    at http://support.apple.com/kb/ta204006, but it''s important that you remember
    to perform the task as needed.)


    If you use a plain text editor to create your applications, you will also need
    to manually compile and execute the applications at the command line. It''s difficult
    to perform these tasks, but it does involve extra work that an IDE would normally
    perform for you. This chapter tells you how to compile the application in the
    "Opening the command prompt" section and as well as how to execute it in the "Using
    the Java command" section, so using a plain text editor or an IDE is completely
    up to you.


    # Finding an IDE


    There are many Java-specific IDEs on the market and even more editors that will
    work with Java, even if they aren''n''t specifically designed for Java. In fact,
    there are so many editors out there that could (and possibly will) make your head
    spin, and no one wants that. If you''re going to invest time and effort into learning
    how to work with an IDE, it''s best to get a Java-specific product.


    One of the fastest most feature-complete Java editors on the market is jCreator
    Pro. This IDE is written entirely in C++, a language that is valued for its performance,
    which is the reason it runs so fast. It also provides a feature set that works
    with all levels of Java development. However, this product has a few issues that
    make it unsuitable for this particular book. For one thing, it only runs on Windows.
    And it''s not free. You can download limited demo version from http://www.jcreator.com,
    but you''ll want to reserve this product for a time when you''re working with
    larger applications. You can download an older version called jCreator Standard
    for free from http://download.cnet.com/jCreator/3000-2212_4_7956957.html.


    The editor that most Java developers start with is Eclipse (http://www.eclipse.org/downloads).
    It''s a little less capable than higher IDEs like IntelliJ — it does not provide
    simplified management or version control support, example — but it runs on Linux,
    Mac, and Windows systems. Best of all, Eclipse is community supported (you get
    peer help, amongst other things) and free. I used Eclipse while writing this book,
    but you don''t have to have it. None of the screenshots reference it in any way.
    It''s entirely up to whether or not you use this IDE.


    Some developers don''t need an IDE — they prefer an editor (a simple application
    that only provides basic functionality such as code editing). An editor is a product
    that provides features such as keyword highlighting and language'
