  md: '# Chapter 3


    There are a lot of classes that you could use to interact with the date and time.
    However, you use the following classes most often:


    # GO ONLINE


    +   **Instant**: A specific point in time. The time value is defined as the number
    of nanoseconds that have passed since 1 January 1970.


    +   **LocalDate**: The date as it appears on the host system in a year, month,
    and day format. The output doesn''t include the time zone or the time value.


    The Java 8 date and time API is so large that it would be impossible to cover
    in a single chapter, much less a section of a chapter. However, you can see the
    various classes used for the date and time API at http://download.java.net/jdk/api/.


    +   **LocalDateTime**: The date and time as it appears on the host system in a
    year, month, day, hours, and seconds. The output doesn''t include the time zone.


    +   **LocalTime**: The time as it appears on the host system in a format of hours,
    minutes, and seconds. The output doesn''t include the time zone or value.


    +   **MonthDay**: A month and day without any corresponding year. You can use
    this value to represent recurring date values, such as anniversaries and birthdays.


    # EXTRA INFO


    A time zone shows the offset from Universal Time Coordinated (UTC). For example,
    Central Time in the United States has a offset of -6:00, which means it is six
    hours before the International Atomic Time (TA) that is maintained by the world
    time server. You can see the current time server time at http://www.worldtimeserver.com/current_time_in.aspx.


    +   **OffsetDateTime**: The date and time as it appears on the host system in
    a year, month, day, hours, minutes, and seconds format. The output includes a
    time zone value.


    +   **OffsetTime**: The time as it appears on the host system in a format of hours,
    minutes, and seconds. The output includes a time zone value.


    +   **Year**: A value without any other information. You could use this value
    for elements such as headings on a calendar.


    +   **YearMonth**: A year and month without any corresponding day. You can use
    this value to represent recurring monthly events where the day of the event is
    not important.


    +   **ZonedDateTime**: The date and time as it appears on the host system in a
    year, month, day, hours, minutes, and seconds format. The output includes an enumerated
    time zone value, such as America/Chicago. You can see a listing of the human-readable
    time zones at http://java.sourceforge.net/timezones.html.'
