  md: '# Summing Up


    Here are the key points you learned about this chapter:


    +   - The NumberFormat object makes it possible to create properly formatted output.


    +   - Escape characters make it possible to create nicely formatted output that
    works on just about every screen.


    +   - Not all platforms use the same character set, so make sure you know which
    character set your platform uses before working with Unicode output.


    +   - Make that you use local-specific date and time formatting when working with
    local times so that features as month names appear the right way.


    +   - The date and time API provides significantly greater flexibility than using
    the older Calendar object, but you must have Java 8 to use it.


    +   - Java Currency features will only change the formatting of the output, not
    the actual value. In other words, Java won''t take your dollar Input and convert
    it to pounds.


    # Try-it-yourself lab


    For more practice with the features covered in this chapter, try the following
    exercise on your own.


    +   1. Open the EscapeCharacters application.


    +   2. Add code to the application that reproduces the first two columns of Table
    4-1.


    It helps to think of the positioning that you''ll need to reproduce the table.
    Use table and newline characters to carefully reconstruct the table.


    +   3. Compile the application.


    +   4. Run the application.


    Check the table you''ve produced for accuracy.


    +   5. Repeat Steps 2 through 4 until your table matches the first two columns
    of Table 4-1.


    +   6. Repeat Steps 1 through 5 for Table 2-1 found in Chapter 2.


    In this case, you need to add the other types of formatting described in this
    chapter.'
