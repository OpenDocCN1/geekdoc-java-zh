  md: '# Creating a Simple Application


    Unlike programming languages, Java applications maintain a basic semblance of
    structure no matter how complex they become. For example, every Java application
    has at least one class, and there is no code outside of a class. To create an
    application, the class must have a method (a kind of code) named main(). Don''t
    worry too much about how all this works just yet — the following sections fill
    you in on details.


    # Writing the application code


    This section shows how to write a simple application. This is the simplest application
    you can write and still have the application do something. You don''t need anything
    fancy to work with this application — just an editor and your Java setup do.


    # Defining the class


    Every Java application begins with a class. In the following exercise, you create
    a class for your first Java application and discover the components that make
    up a class.


    Files needed: GetStarted.java


    +   1. Open the editor or IDE that you''ve chosen to use for this book.

    2. Type the following code into the editor screen.


    ```

    /* This is your first Java program.

    Author: John Mueller (JohnaJohnMuellerBooks.com)

    Written: 6 January 2014 */

    class GetStarted

    ```


    This is typically how you start any application, by creating a class block. This
    application also starts with a comment that describes the program, who wrote it,
    and when it was written — another typical feature. The compiler doesn''t see the
    comment — you only see the comment. Comments document your code so you can remember
    what it does later.


    # LINGO


    > Think of a class as a box that holds the data you want to work with, along with
    the code needed to manipulate the data. Computers are all about managing data.
    They move data from place to place, manipulate the data in various ways, and present
    the data that human viewers can understand. Using classes makes it possible to
    keep data and code together so that the application components are less likely
    to break and are much easier to interact with.


    # LINGO


    > A code block is any number of lines of code that appear within a starting curly
    block {} and an ending curly block {}. You use Java blocks to divide code into
    easier-to-understand chunks. You''ll see many code blocks used throughout this
    book.'
