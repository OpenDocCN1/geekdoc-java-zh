  md: '# Chapter 1


    provide this feature. However, it''s important to know how to compile this application
    at the command prompt to better understand Java works. The following sections
    describe how to open a command prompt and compile the GetStarted source code into
    an application.


    # LINGO


    To compile a Java application means to turn the human-readable words that a developer
    writes into Java byte code they understand. The JRE can, in turn, change the byte
    code into low level code that is executed. To compile an application, you must
    use a compiler—a special designed to read human-readable words and write them
    out as something useful to the computer.


    # Opening the command prompt


    The command prompt actually appears within a special window supported by your
    operating system. How you open the command prompt depends on which operating system
    you are using.


    # Working with the Linux command prompt


    Some versions of Linux open a command prompt immediately when you start them.


    If you''re using a shell that doesn''t, you can always open a command prompt separately.
    The official name for the command prompt in most versions of Linux is Terminal,
    Konsole, or something similar. When the command prompt is open, you can type commands
    to compile and run your Java application. To access your application, type cd
    Full Application Path and Enter, where Full Application Path is the path you use
    to save the source code that you created in the previous sections.


    # Working with the Mac command prompt


    The command prompt on the Mac is called a terminal. Use the Applications:Utilities:Terminal
    command looks just like an old television set). When you open Terminal, you can
    type commands to gain access to your application, compile it, and run it. To access
    your application, type cd Application Directory and Enter, where Application Directory
    is the relative path you use to save the source code to disk. The Mac saves everything
    to the /Users/Your User Name directory on the system, and the source code will
    appear in a subdirectory under this directory.


    # Working with the Windows command prompt


    The output screenshots you see in this book rely on the Windows prompt. That doesn''t
    mean your application won''t run on Linux, Solaris, or the Mac. In fact, the examples
    in this book run on any platform that Java supports. The beta readers for this
    book are testing these applications on a number of platforms (See my blog at http://johnmuellerbooks.com/2011/03/18-errors-in-writing.aspx
    for a description of beta readers). The use of Windows screenshots simplifies
    the book''s presentation and makes it less confusing.'
