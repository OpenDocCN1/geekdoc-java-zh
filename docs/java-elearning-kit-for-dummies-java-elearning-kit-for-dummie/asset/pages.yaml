  md: '# Chapter 2


    You''ll also discover constants in this chapter. Constants are a special kind
    of variable that hold the same value throughout application execution. Constants
    are useful for a number of reasons:


    +   * They use less memory

    * They improve application execution speed

    * They are more secure because no one can change them


    # Working with the Primitive Types


    It''s important to use the right type for a particular purpose. Otherwise, your
    application won''t know how to interpret the data it creates and provide the user
    with the correct output.


    Besides the way in which the application interprets the data as information, the
    main difference between these types is their size (measured in bits). Each bit
    is one little piece of memory—it can be a 1 or 0. Combining bits makes it possible
    to create larger numbers or more complex information. Table 2-1 shows the primitive
    types that Java supports.


    > EXTRA INFO

    Oracle currently plans for creating a unified type system for Java 10. This means
    that there would no longer be primitive types in Java—everything would be object.
    Just how Oracle plans to implement this isnt clear at the moment and may not even
    happen, but it''s always a good idea to keep track of changes that could occur
    to the language. For now, primitive types offer clear advantages and you should
    use them as appropriate, but keep in mind that future versions of Java may not
    support them.


    | Table 2-1 Java Primitive Types |

    | Type Name | Number of Bits | Range of Values |

    |---|---|---|n| byte | 8 | -128 to 127 |

    | short | 16 | -32,768 to 32,767 |

    | int | 32 | -2,147,483,648 to 2,147,483,647 |

    | long | 64 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |'
