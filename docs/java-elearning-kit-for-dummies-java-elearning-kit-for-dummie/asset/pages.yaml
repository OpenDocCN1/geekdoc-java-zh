  md: '# Opening Files for Reading


    Reading a file begins with the FileInputStream, Input. Think of the FileInputStream
    as a kind of conduit that transfers data from disk to your application. The FileInputStream
    requires you to provide the name of the file as a minimum. If the file is outside
    the current directory, you must also provide the complete path to that file. Notice
    that you must enclose this code within a try...catch block, just in case the file
    doesn''t exist. The application displays an informational message because there
    isn''t anything to process.


    # LINGO


    > A stream is a connection between an application and a data source of some type.
    Streams come in many different forms with a multitude of locations. This chapter
    helps you understand file streams, which are used to read data from write data
    to the disk.


    There are a number of ways to request information from the FileInputStream. Reader.
    This example shows the easiest method, using a Scanner object, you precisely the
    same technique for reading from a file as you do from the keyboard. The data file
    represents prerecorded input, so the example calls hasNextLine() to determine
    whether there''s more input to process. When there''s input to process, the code
    calls nextLine()


    ![](img/e352a1505e4e30ed140c4898f6139f17_388_0.png)


    Whenever you read or write from a file, you must always close the file when you''re
    done it. There are many potential problems that occur when you fail to close the
    file. At a minimum, the application could cause a memory leak in the underlying
    operating system, which would make the memory inaccessible to other applications
    and possibly cause system instability. In addition, failure to close the file
    could cause damage to the data file contains. Because there are situations where
    closing the file might not work, such as the user deleting the file before it
    gets closed, you must also encase the Input.close() call in a try...catch block.


