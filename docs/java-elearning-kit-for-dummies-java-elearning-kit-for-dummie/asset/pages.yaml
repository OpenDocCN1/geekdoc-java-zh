    With the ReadXML example, this example requires a relatively large number of imports
    that are listed in the order in which they''re used. The application begins with
    the same process for reading an XML file: creating a DocumentBuilderFactory, using
    the Factory to create a DocumentBuilder, and then calling on Builder to create
    a new XML document, XMLDoc. This same process occurs in just about every XML application
    you create.


    Every XML document starts with a Root Element that the code creates using createElement().
    The code appends Root to XML to begin building the XML document.


    When working with an Element — Child, in this case — that contains a value, the
    value is contained within a Text object — XMLData. The code appends XMLData to
    Child (the element contains the value) and then appends to Root (the root-element
    contains all of the top level elements). Each top-level element follows the same
    process.


    Second-level elements are appended to first-level elements. For example, Fruits
    is a first-level element. It contains two second-level Fruit elements, one with
    a value of Apple and another with a value of Pear. Notice how the code appends
    the Child to the appropriate parent.


    At some point, the code has created an XML document suitable for writing to disk
    this isn''t XML data but it''s in a format that''s more useful for working with
    the data in memory. The code creates a TransformerFactory, to create a Transformer
    object, createsResult, that transforms the XML document into XML data that the
    application can write to disk.


    The code creates a DOMSource, Source, to provide access to the information in
    XMLDoc. It also creates a File object, OutputStream, to hold the data on disk.
    To send data to OutputFile, the application must also create a StreamResult object,
