  md: '# Creating single-line comments


    A single-line comment can appear anywhere on the line. It begins with a double
    slash (/) and contains any text you want to include. The compiler ignores anything
    after the //, so the text can be anything you want. In the following exercise,
    you add a single-line comment to the GetStarted application.


    Files needed: GetStarted.java


    +   1. Open the GetStarted.java file using your favorite editor or IDE.

    2. Use the source code that you previously wrote.

    3. Use the description of the main() method earlier in the chapter to create a
    single-line comment for it.


    The comment you create contain any information you find helpful. The text in bold
    shows a suggested series of single-line comments for this method.


    ```

    // This is the first method that Java calls when it

    // starts the application. This method is public, so

    // every other class can see the method. The method is

    // static, so it isn''t used as part of an object, but

    // rather, called directly. The result is void, so this

    // only argument, args, is a list of caller.

    public static void main(String args[])

    ```


    Notice that each single-line comment begins with a //. You will discover

    more about what precisely this means as the book progresses.

    For now, this is an informational comment telling everything there is

    to know about the main() method.


    +   3. Save the file to disk.

    4. Use the steps in the "Creating the compiled .class file" section to compile
    the file.

    The javac utility compiles the file without error.

    5. Use the steps in the "Using the Java command" section to execute the file.


    Notice that the output of the application hasn''t changed due to the comment you
    provided. Compilers ignore any comments you may have added — they''re included
    in the source code only for your benefit.


    Leave the editor or IDE open for the next exercise.'
