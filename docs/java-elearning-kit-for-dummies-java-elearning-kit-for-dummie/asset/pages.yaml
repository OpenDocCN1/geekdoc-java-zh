  md: 'operators are an essential part of Java application development. They precisely
    as their name implies — they operate on the value contained within a primitive
    type or object in some way. Precisely how it operates on the value depends on
    the operator. In some cases, an operator will change the value in the variable,
    but in other cases, the operator simply uses the value to perform a specialized
    task, such as comparing two values. Java provides a wealth of operators to perform
    every task imaginable.


    The best way to understand how operators work and what they do is to group them
    into categories and then look at each category individually. That''s precisely
    how this chapter approaches the topic. Each of the following sections describes
    a different operator category and how to use the operators within that category
    to your advantage. Here''s a quick overview of the operators in this chapter:


    +   **Assignment operators** place the value you define into the variable. The
    basic assignment operator replaces the value in the variable. Combined assignment
    operators perform a math-related task and update the value in the variable. It''s
    nearly impossible to write an application without using variable assignments of
    some sort.


    +   **Arithmetic operators** perform any math task, including addition, subtraction,
    multiplication, and division. Most applications need to perform math-related tasks,
    even if the user is unaware of the math functionality. You''ll discover as the
    book progresses that math is an inescapable part of programming.


    # EXTRA INFO


    Java 8 adds one new operator that meets the traditional meaning of the term, the
    arrow operator (->). This operator is used in a special circumstance to work with
