    # Know this tech variable:


    **counter**: A special sort of variable used to track the current counting of
    something in the application. In most cases, a counter variable is a primitive
    integer because counter variables only track whole numbers and don''t require
    the extra features of an object type.


    **enumeration**: A listing of like items that you can use to make your code easier
    to read. An enumeration makes it possible to refer to something using a human-readable
    term, even though the actual value is a number.


    **iteration**: A single loop from a series of repetitive loops. A single iteration
    is one pass through the code in a repetitive loop structure.


    **nesting**: Placing one structure within another of the same type. For example,
    nesting for loops places a subordinate **for** loop within a **main** loop.


    **repetitive loop**: A method of telling your program to perform a task more than
    once. The repetitive loop consists of a structure that defines where the loop
    begins and ends, some sort of condition used to determine how to loop, and the
    series of tasks contained within the structure.


    **structure**: A programming construct that begins with a statement that specifies
    the purpose of the structure. Normally curly braces ({}) appear after the statement
    to define the statement body. One or more lines of code appear within the structure
    body to define the tasks performed by the structure.'
