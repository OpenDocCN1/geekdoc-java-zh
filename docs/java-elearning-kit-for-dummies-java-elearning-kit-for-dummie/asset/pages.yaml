  md: '# Chapter 8


    # Understanding Error Sources


    There are many sources of error in an application. You may assume that the error
    is in the code, but often it isn''t. The error could exist in a library or in
    some other code over which the application has no control. In some cases, the
    error has nothing to do with the code, but with the application environment. For
    example, the application may not have access to a resource that it requires to
    work. A file might be missing, or the network connection might be down. Users
    also cause errors by providing incorrect input.


    ![](img/e352a1505e4e30ed140c4898f6139f17_225_0.png)


    For the most part, there aren''t any errors that an application can handle in
    some way when the application code is robust and has enough information to resolve
    it. However, before an application can do anything with an error, it must have
    the information required to resolve it. One of the best tools that a developer
    has to make an application robust enough to handle any errors is to classify the
    error and why it happens. That''s the purpose of the following sections — to help
    you understand the nature of errors so that you can do a better job of fixing
    them.


    # Classifying when errors occur


    GO ONLINE




    Errors can occur at various times. However, you can broadly classify when an error
    will occur into two categories, at compile time and runtime, as described in the
    following sections.


    This chapter can''t hope to cover every possible source of errors or the resolution
    of those errors. Consider this chapter a good introduction to the most common
    problems. In fact, it may surprise you to learn that there are entire sections
    devoted to the topic of exceptions and handling! One of the better sources of
    information is the Java Exception Handling tutorial (tutorials) at http://tutorials.jenkov.com/java-exception-handling/index.html.
    You can also find interesting articles on the topic, such as those at http://onjava.com/java/2003/11/19/exceptions.html
    and at java.net/pub/a/today/2003/12/04/exceptions.html.


    # Compile time


    The compiler (javac for all the examples earlier in this book) converts your application
    code into Java byte code. During this process, it takes the human-readable code
    that you write and converts it into something that the Java Runtime Environment
    (JRE) understands. To perform this, the compiler must parse the code, which it
    reads in a manner that unambiguously determines precisely what you want the application
    to do, when you want to do it, and how you want the task accomplished. If you
    break the rules for writing unambiguous code, the compiler displays an error message.
    This message is actually a kind of exception.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Understanding Error Sources


    Compile time errors are the easiest to handle because the compiler normally tells
    you precisely what''s wrong and where the error has occurred. Even if the information
    isn''t exact, the compiler will get you to the right area of the broken code so
    that you can look for the error it contains. The point is that you don''t have
    to wait for the user to find this sort of error. To produce the compiled application,
    you must fix it.


    # LINGO


    Parsing means to read the input you provide, such as code in human-readable format,
    and turn it into something else, like a JSON byte code. An application can also
    parse user input. For example, a user could use a string that your application
    code reads into a number. So, parsing is the act of reading some type of input,
    interpreting that in a specific way, and then producing output based on the interpreted
    input. A parser generates an error when the input is incorrect. For example, if
    the input is a string containing the letter ''C'', and you expected a number,
    such as 123, the parser will generate an exception saying that the input is incorrect.


    # Runtime


    The compiler can''t find every error in your code. If the form of the code is
    correct (that is, you have made any mistakes in typing the elements that create
    the application), the compiler won''t find the error. For example, if you initialize
    a value to 5 instead of 4, the compiler can''t find the error because the compiler
    has no idea that you really meant to type 4. These sorts of mistakes create runtime
    errors — those errors that happen at some point during the application execution.


    Runtime errors can occur at all sorts of times. Some errors are more likely to
    occur at specific times. The following list provides you with some ideas about
    when runtime errors are likely to occur:


    +   * Initialization: When the application first starts — before it presents any
    sort of interface to the user or performs any work — it goes through an initialization
    phase. This is when setting a variable to the incorrect type or trying to use
    a variable before you initialize it will get noticed. Many resource-related errors
    also occur during initialization because most applications open required resources
    during this time.


    +   * Operating mode: After an application initializes, it is in operating mode.
    If it has a user, it begins interacting with the user. This is the time when user
    input matters most. You''ll also find incorrectly initialized variables at this
    time because the user (or the recipient of the application output, such as the
    system) will see that the output is incorrect.

    User requests for resources, such as a data file, also create errors during this
    time.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Chapter 8


    # EXTRA INFO


    +   Background processing errors result from the environment (such as the loss
    of a network connection) missing resources (such as a file lock), incorrectly
    initialized variables, or errors in how you told the application to perform a
    task. Some tasks are more commonly performed in the background than others. For
    example, printing a document and downloading resources from the Internet are commonly
    performed in the background while the user continues to work with the application
    in the foreground.


    +   Shutdown: When the user (including the system accounts) is no longer needed,
    the application goes through a shutdown phase. During this shutdown phase, the
    class files and other housekeeping choices ensure the application exits properly.
    The most common errors that can occur during this phase are releasing resources
    that your application has used and not saving data to disk. Of course, coding
    errors occur at any time, and this phase of operation is no exception. You could
    tell the application to close five files when only four of them are actively open.


    To ensure that everyone understands how the Java language is supposed to work,
    developers create a specification for it. This specification includes the language
    elements in a special language called Backus-Naur Form (BNF). BNF is an precise
    method of describing a language so that there is no risk of misinterpretation
    by anyone. You can see a sample of the BNF for the Java language at www.dais.au.dk/javabnf.html.
    There are other versions of this specification at http://www.java.com/docs/books/second_edition/syntax.html
    and http://bnf-for-java.sourceforge.net. Don''t worry too much about making able
    to read these specifications. Most developers never learn to interpret the BNF
    for the languages they use—that''s the domain of compiler developers.


    ![](img/e352a1505e4e30ed140c4898f6139f17_227_0.png)


    The JRE will present runtime errors if it detects them as exceptions. However,
    the JRE won''t catch every error in your application. You must also look at the
    output of your application to determine whether the output matches the expectations
    you have for a given input. Additionally, it''s important to look at the state
    of any resources you use to ensure that they''re not damaged in some way. For
    example, you need to ensure that any data you should save in a file actually ends
    up in the file when your application shuts down.'
