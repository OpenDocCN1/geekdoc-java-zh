  md: '# Chapter 1


    # # Performing the Windows installation


    Files needed: The Java installation program you downloaded


    The Windows version of Java comes as an executable file that installs much like
    any other executable file on your system. After you download the version of the
    JDK for your system, use the following steps to install it.


    +   1. Double-click the downloaded file.


    You may see a User Account Control dialog box appear. This dialog box asks whether
    you want to allow the application to make changes to your system. Click Yes to
    allow system changes. If you click No, the application exits, and Java doesn''t
    install.


    You see the Welcome page of the setup wizard.


    +   2. Click Next.


    You see the Custom Setup page of the wizard, as shown in Figure 1-1. The three
    items you must install — Development Tools, Source Code, and Public JRE — are
    already selected in the figure.


    ![](img/e352a1505e4e30ed140c4898f6139f17_27_0.png)


    Figure 1-1'
