  md: '# # Summing Up


    Here are the key points you learned in this chapter:


    +   - Converting data from one type to another means changing the actual presentation
    and storage of the data, rather than casting it as a larger form of the same type.

    - The string type provides a number of ways to find information, including looking
    at a particular part of the string, comparing two strings, and working with substrings.

    - Modifying a String involves replacing string elements, extracting characters
    from the string, and splitting the string into pieces.

    - Formatting a string makes it more presentable to the user and also makes your
    application friendlier by displaying data in a form the user understands.


