  md: '# Athens and Herculaneum: The Case of the Paathenaic Athens


    # Carol C. Mattusch


    Sculptures made during style were popular among the Romans, and the workshops
    overlooking the Bay of Athens produced works ranging from columns of the Athenian
    Tyrant-Slayers to Classical masterpieces of archaicistic statues and busts, some
    of which may have been passed off as legitimate ''old'' works. The many owners
    of villas in the region had an unlimited demand for these sculptures, and it is
    not unusual for more than one example of a popular work to survive.


    The Villa dei Papiri, overlooking just Herculaneum, is the largest Roman villa
    that has been discovered to date, and is by no means fully uncovered. Its public
    areas, which were tunneled ground surrounded by a colonnade consisting of 25+
    columns. Excavations in the area of the atrium were conducted during the 1750s,
    approximately 20,000 square meters or 65,000 square feet, including a large garden
    reconstructed in 1980, adding two additional stories below the single level drawn
    by Karl Weber in the plan he finished in 1758.


    The Villa yielded wall paintings, mosaics, about 1,000 papyrus rolls, and nearly
    ninety bronze and marble sculptures. Most of the sculptures are classical in style,
    and many of them are either reproductions of well-known Greek statue-types or
    portraits of famous heroes. The bronzes come in all sizes: statues, busts, and
    term-heads come in all, but most consist of small-size heroes and over-life sizes.


    In what appears to be the basement, a room measuring 88 square meters with a polychrome
    marble floor, eight bronze busts were unearthed in the center of the room: a melephis
    (National Museum 5633) and a short-haired ''Polykletian'' type of athlete (N.M.
    5614); three life-size portraits of Roman (N.M. 5634, 5586, 5587); and small-size
    busts of Demosthenes (N.M. 5469), Epikouros (N.M. 1110), and a Julio-Claudian
    lady, perhaps Agrippina (N.M. 6240), carved in Carrara marble. Between two columns
    outside the entrance to the room stood an over-life-size archaic statue of a riding
    Athens, carved in Pentelic marble (Gl. 1 and Cl 13). Use of the archaic style
    carries upon ancient traditions and origins. As such an archaic image could link
    to the present context, and to establish the bloodlines or the legitimacy of the
    present context. The status of the Villa dei Papiri provides a fascinating range
    of associations.

    Images of them, riding Athens became first popular during the Archaic period,
    in the city of Athens. The riding Athens in the Gigantomachy of the pediment of
    the large archaic statue on the Acropolis – the *Archaaios* – stands over her
    forward leg, leaning aggressively over the right side. She streaks out her left
    arm and falls falls over the left shoulder, backwards over her adversary. No doubt
    she she whether she was wielding a spear in her right hand, as if at the giant.
    The riding Athens on a lekythos attributed to Daouri is not unlike the one we
    conceived of a part.


