  md: '# # Panathenaic amphoras


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_9_0.png)


    Fig. 8. Detail of Panathenaic amphora. Polygyros, Archaeological Museum 8.29 (R
    100). Photo: author.


    Fig. 9. Detail of Panathenaic amphora. Polygyros, Archaeological Museum 8.29 (R
    100). Drawing: T. Mitta.


    The decoration of Panathenaic vases took about forty years to reach their canonical
    form. About 530–525 B.C. Panathenaics exhibit their standard features (1). Scholars
    have labeled Panathenaic vases drawn before 530 B.C. (2) “pre-conical”. The decoration
    on these vases displays features that did not survive, for example, inscriptions
    on side B naming the contest depicted. For instance, we have, “ἰῶλάς” and “ἐρόδὸς
    ἐνπώδῳ”$^{21}$. Mural paintings have been largely responsible for the decoration
    of Attic painting, as indicated by an ancient source: “δὲ ἔτρηπτο  δὲ ηρακο γύζειν
    τοῖν τρίπονν τρίπονν εἴα καὶ ἐπανατόνῳ, ἄθμα ἄρτῳ ἐλικν τὸ ζῆμα, δὲ ἐτέρεπτονν
    τοἷς τολις βτοί”$^{22}$. Literary sources inform us that maruls frequently carried
    titles describing the composition.


    Around 530–525 B.C. we see for the first time columns flanking Athena. They are
    usually Doric$^{23}$ with a cock on top (Fig. 1). The significance of these columns
    is somewhat problematic. On the basis of other examples, drawn mainly from Attic
    painting, temples or precincts of Athena on the Acropolis, the presence of cocks
    and lack of endowment weaken this interpretation. Do the cocks or the large size
    of the columns suggest that the letter refers to turning posts in raccoons. Scholars
    have considered the possibility that the columns, with a cock on top, might have
    been linked to athletic existence, on the Acropolis, of which were used in the
    worship of Zeus or other deity, a form of worship traced to prehistoric times$^{25}$.
    However, literary and iconographic evidence suggest another interpretation. Ancient
    literary sources tell of pillars or columns of Heracles and Dionysus, which indicates
    the boundaries of the activities of these deities$^{26}$. It should be recalled
    that columns to Prometheus is tied to Attic vase decoration on Panathenaic amphoras
    define the limits to the activity and influence of the goddess, the limits of
    the known. On Attic-figure vases, for examples, the limit of the activity figures
    shown in a similar way, with two columns flanking the protagonists of the event
    (10)$^{27}$.


