    # Petros Hemelis


    Acropolis. Consequentially, cockerels standing on columns conspicuous, tranquil,
    and by no means aggressive – in my opinion they have a significance comparable
    with the embleatic character and the symbolic power of the cockerels and pillars,⁹⁹


    Cockerels are not generally distinguished by their calmness, competitiveness and
    emphatic eroticism; one by their basic characteristics is that they announce the
    rising of sun. Odysseus, for example, who descended from Helios, had a cockerel
    embraced on his shame. The here also made a rooster to Helios in the rising (Paus.
    5.22.59).¹⁰⁰ An Attic double-sided vote relied to Helios and Men in the Lancorkonski
    region of Vienna and now in Boston includes inter, the representation of a cockerel
    and an offer under afterlife.¹⁰¹ The servers of Phaitos (322–300 B.C.) Zeus Veletans
    left in the image of Cock Cave in his wreck.¹² Not did the lion they explain by
    Beazley since it supported its interpretation), but by some subject which was
    also marked of the cockerel, but rather listed by the Tepey poet Antius (Ant.Pal.7.206).¹⁰³
    Anyte''s poem did not mind the bond of the cockerel, but rather the rising of
    the water from them before day;


    The arrival of dawn also signals the beginning of the day; the crowing of a cockerel
    and the early morning hours appears on coins of Himera, while the cockerel is
    “herald of the day (Karus hameros) on the coins of Karystos.¹⁰⁴ The competitiveness
    of Athena Proamachos was given, just like the spirit of competition in the games,
    and not require the help of cockerels for its promotion. Eri Simon noted the statue
    of the Athenians Promachos on the Acropolis under Pericles (561/0 or 528–B.C.)¹⁰⁵
    flanked by roosters with them.¹¹⁰⁶ Pausanias (8.3.78) refers to them cry of eagles,
    the symbols of Zeus, that were erected in front of an altar on Mount Lycabettus.
    In the post-Augustan period, the list of Polybius on the Acropolis included a
    trumpet whose, was to signal, the operation of the trumpet to the herald, where
    the importance of the cockerel-god goddess Athena was also situated.¹⁰⁷ The equality
    of the Polybius with cockerels (alekteros) is indeed apparent; moreover, it emerges
    from the character of a trumpet as a “public cockerel” (κονοῦ Ἀνυπο ἄκτος, Ath.
    3.9). The cockerels of the Acropolis represents a system of communication between
    mortal and god, just like which others are related to deities and shrines, while
    at the same time they functioned as instruments of divine epiphany, like doves
    and owls.¹⁰⁸ In the symbolic framework are also small cockerels standing on the
    roof of the Pelagikon of the Acropolis, as attested by the well-known Telamon
    relief from the Askklepieion of the slope of the Acropolis.¹⁰⁹


