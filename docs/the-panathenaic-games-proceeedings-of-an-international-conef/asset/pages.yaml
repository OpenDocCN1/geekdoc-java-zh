  md: '# # Replicating tradition: the first celebrations of the Greater Paathenaea


    Jenifer Neils


    The first Great Paathenaea of 566/B.C. is an intellectual challenge. As is well
    known, the most significant epigraphic evidence (*IG II* 231* [here p. 118, fig.
    1]) dates to two years after the traditional founding year of the festival and
    deals only with awards for the athletic, musical, and equestrian contests. In
    two hundred years much can change; in Athens in the summer of 2004 we saw the
    modern Olympics evolved in the century since their first occurrence in this city.
    Lacking continuity, how then can we possibly conjure up what happened on the 28th
    of Hekatombaion in the third year of the 53rd Olympian? This forces us to envision
    the polis as it emerges from relative obscurity as a leading actor on the stage
    of Greek history — in direct petition and omission of other poles. We see in which
    the major religious festival of the city''s pattern deity could reveal a great
    deal about the civic and religious nature of the Athenians at an early point in
    their history — the Greater Paathenaea reflected their democratic ideals and ambitions.


    If we are fairly certain of the foundation of 566/many, many other aspects of
    the Greater Paathenaea are disputed: the meaning of its name; its archaic form
    (Erichthios); its historic re-organizer (the archon Hippokedes); its program of
    gymnastics and equestrian events; the timing of the inclusion of contests; the
    nature of the prizes for non-athletic competitors; and the contest to which its
    predecessor (the archaic) newly founded the festival.


    The only official epigraphic description dating to this period is the *probromos
    inscription (DAA 326 and its successors (DAA 327–328)), carved on limestone stelae
    erected on the Acropolis. They were erected by the heriotes or sacred officials
    who claimed to make the demos and established the agon for the “owe-eyed men.”
    Raubitsch and many other scholars say that this inscription refers to the institution
    of the Paathenaea in 566 because of the word *proto* and the archaic letters.
    If these are the correct words and demos are correctly translated as ‘racetrack’
    and ‘conest’, then we can assume that 566 was a year of religious officials in
    charge of the festival and at the value we think.


    There is also considerable archaeological evidence for increased activity on the
    Acropolis, and scholars have found the route of new construction on this time
    depicting the Athenians. Scholars have noted of: a large doric temple (Hekatompedon
    or Old Athens temple) with sculpted limestone decorations; the construction of
    the Athena Nike was during this time (part of its buried inscriptions, DAA 329);
    and a wide path seen by nine meters by we


