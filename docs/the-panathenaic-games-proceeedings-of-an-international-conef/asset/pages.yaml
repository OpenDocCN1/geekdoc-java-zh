    as a Panathenaic amphora.³² In either case, the procession is not taking place
    at the same occasion as one on the Montreal crater.


    Another six-figure procession depicts a late fifth-century red amphora of Panathenaic
    form from the Agora (Fgs. 11–12). The vase is fragmentary, and originally there
    may have been more figures. The pose of the first figure presented on the right
    of A suggests that he may be playing the aul (Fig. 11). The first four letters
    of his name are present, which indicate that he won victory in the Pythian Games
    and for providing the rhythm for the oarsmen of Chrysophon, as Alcibiides trireme
    when he returned to Athens in 480 B.C.³Three youths follow carrying a shallow
    tray. The last is named Koprus. An olive tree stands in front of them, suggesting
    that the event takes place on the Acropolis. On the other side of the vase parts
    of three more youths (Fig. 12), the last of whom carries a Panathenaic amphora
    in a similar manner to that of the Montreal crater. Above the amphora is inscribed
