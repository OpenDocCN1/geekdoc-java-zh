  md: '# Foreword


    The papers in this volume were presented at an international conference organised
    in Athens on May 11–14, 2004. It was hosted by the University of Athens and the
    Greek Ministry of Culture and the Association of Friends of the Acropolis. The
    occasion was provided by the Olympic Games of Athens in 2004. The Olympics gave
    us the opportunity to experience the games at Athens in the exhilarating environment
    of international competition, athletic contests in the Panathenaic Stadium, prize
    witnessed by a crowd of thousands, and the atmosphere of torch races, musical
    and theatrical events, regattas in the Parthenon and celebrations on the Athenian
    Monuments.


    On the occasion of the Athens Olympics (First Acropolis) Ephorate of Prehistoric
    and Classical Antiquities refurbished the Agora Museum, conducted fresh researches
    on the Panathenaic Way and organised a display of the newly discovered frieze
    of the Parthenon in the Acropolis Museum. It issued a series of guidebooks on
    the Ephorate, and collaborated with the information and education service of the
    Committee for the Restoration of the Part on a new educational programme concerning
    the depiction of the Panathenaic procession to the Parthenon and the games at
    Athens.


    Scholars celebrated the games at Athens in their own way. The complex problems
    posed by the study of the Panathenaic Games, a Panhellic athletic event that lasted
    for nearly a millennium, demanded an interdisciplinary approach. An international
    assembly of Archaeologists, historians, ancient historians, epigraphists and classic
    scholars contributed to the discussion of this and other historical developments
    of the Panathenaic Games in general and of individual contexts in particular.
    The role of royal and other patterns in the Hellenistic and Roman periods, as
    well as the form and meaning of victory dedications and other monuments generated
    by the games were also examined. The question of the function of panathenaic prize
    amphora, introduced by the keynote speaker Michalis Tiberios, prompted a lively
    and ultimately rewarding debate that reverberates through the pages of the proceedings.


    The Panathena Games conference was held thanks to the initiative of the Association
    of Friends of the Acropolis and its president emeritus, P. Stratatos, who raised
    funds and prompted the inspiration. The publication of this volume was made possible
    through a generous grant of the Association of Friends of the Acropolis and Titan
    Group. We are grateful to the rector of the University of Athens, Georgios Babiniiotis,
    for the use of the Dr Drakopoulos archives provided to the editor, Michalis Dermitzakis,
    for his support. David Brown kindly agreed to publish this volume in his monograph.


    Bibliographical abbreviations follow the guidelines of the German Archaeological
    Institute as published in Archologischer Anweiser 112, 1997, 612–625.


    Olga Palga

    The University of Athens


    Allkestis Choremi-Spetsieri

    Acropolis Ephorate of Prehistoric and

    Classical Antiquities'
