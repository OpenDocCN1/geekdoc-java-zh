    oil awarded to the winners in the first decades of the fourth century, given that
    not all Panathenaic amphoras had the same volume. But by the calculation of the
    amount of olive oil was a matter of vital importance to the Athenian state, to
    the athletes competing at the Panathenaia and, in general, to everyone concerned
    with this matter. As IG IF 2311 mentions, for example, a prize of “30 amphoras
    of oil”, this does not mean 30 Panathenaic amphoras, but the amount of oil held
    by 30 amphoras, with “amphora” used in the sense of a fluid measure. Likewise,
    it would seem that a text attributed to Simondes, the pentathlon of the Panathenaic
    games refers to a number of Panathenaic vases, but to a particular volume of oil.
    The “60 kados of oil” that the victor is said to have won must mean “60 amphoras
    of oil”, with the word “amphora” used again as a standard measure. The words khảo
    are used as synonyms, while the word kados is also used as a measure of fluid,
    equal to that of an amphora.


    The exact definition of the volume of oil that corresponds to the volume of an
    amphora is a versed question. Many scholars believe that an amphora had the volume
    of a metrex, which is 39.312 kilos of water, that is about 36 kilos of oil. The
    completely preserved Athenian fluid measure, of a volume of most probable one,
    which we have referred to and which is dated to about 510–500 B.C. (Fig. 20),
    is of decisive importance. The capacity of this vessel has been calculated at
    35.5 kilos of water, which corresponds to weight of 32.5 kilos of oil. Scholars
    who believe that an amphora contains the volume of a metrex, is about 36 kilos
    of olive oil, are of opinion that the capacity of the Munich Panathenaic amphora
    is larger, and falls into a different category.


