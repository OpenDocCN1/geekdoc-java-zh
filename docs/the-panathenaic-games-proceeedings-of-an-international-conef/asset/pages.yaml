  md: '# 164 Athens and Herculaneum: the case of the Panathenic Athens


    all of Achaia. Piso visited Samothrace, and an inscription records a dedication
    to him as ruler and compare to Athen.¹⁵ Furthermore, he and his son, Lucius Maximus
    Pontifex (de 32 A.C.) had particular ties to Athens, and a fragmentary Acropolis
    basis records a dedication set in honor of his son.¹⁶


    Either Piso set one statue of the Panathenic Athens in Athens and ordered another
    one for his home, or he else saw one in Athens and ordered for himself as a reminder
    of his Greek journey. Both statues were carved in Pentelic marble, making one
    the finished statue was from Athens, or whether it was cast, also from marble,
    to be carved in the neck of Naples.¹⁷ Plates from the marble workshop of Athens,
    with multiple examples of the sculpture industry in there. The type of Sciarra
    Amazon, the Dorythos, the Polykleitan Heracles, Epikouros and Demosthenes were
    all in great demand, as were portraits of women dressed the so-called Small and
    Large Herculaneum types.¹⁸ For these images were executed on hand locally, marbles
    from Pentelic and Papri were all in stock, and one could resist Greek styles always
    popular, like the Dorythos, whose bust by an Athenian Apollodinos, was found in
    the Villa dei Papri. There were two of what we call “Polkleitan” heads, one in
    bronze and in the other.¹⁹


    The poor condition of the Athenian fragments makes it difficult to assess their
    quality, clearly that we do not follow the market demand and Neapolitan workmanship,
    around the Bay of Naples. What survives of the Athenian head shows crisp carving
    and fine details, evidence of better workmanship than the statue for the Villa.
    Some of the statues on the left were rough, and there are striations and visible
    chisel marks and tear. Near the waist, some of the scales on the aegis are carved
    and looked like feathers. Perhaps the only conclusion we can draw from here is
    that the buyer of the Villa dei Papri was not a particularly exacting judge of
    quality


    But the skilful carving of the statue in the Villa was never necessary to dismiss
    the work as a poor copy of an “original” in Athens, for shops around the Bay of
    Naples regularly produced sculptures of the highest quality for their sophisticated
    clientele. It might be argued that the statue in Athens is not the “original”
    either, but that the two statues were made for Roman buyers, perhaps each for
    a single Roman buyer, with close ties to Greece, and in particular to Athens.
    These two statues are better understood as the only three-dimensional examples
    of a type of Athena with powerful enigmatic reference to Athens, to the past,
    and to tradition. This is what the art collection in the Villa dei Papri is all
    about: it called Up Classical Names and Archaic traditions, with the intention
    that the owners may fix themselves firmly within that context. The statue in Athens,
    erected in public and on the Acropolis, might have well served the same purpose,
    whenever it was created, and the dedicator might have been


