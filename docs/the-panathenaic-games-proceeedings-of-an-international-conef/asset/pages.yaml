  md: '# # Torch rack and vase-painting


    Martin Bentz


    For Burkhardt Wiesbaden on 14.10.2005


    # ## I


    The torch of the modern Olympic Games was established in Berlin in 1936, where
    it was also put to the work using Nazi propaganda. Nevertheless the tradition
    is still alive and the fire is brought every four years from Olympia to the city
    where the games are held, symbolizing the ancient roots of modern games. The modern
    torch, however, as recently shown, has nothing to do with the ancient tradition.


    In ancient panhellenic games the torch was not part of the official programme
    except for the Panathenaia in Athens, as we know from the list of the fourth century
    (here p. 118, Fig. 1).³ The preserved part of the inscription lists open only
    to trials of the Athenians: the *pyrrhiche* (a kind of beauty contest that we
    do not know much about), the torch (*lampas*) and the boat race. Other inscriptions
    add the *anthipposia*, a mock cavalry battle.⁴


    While the valuable prizes, olive oil in Panathenaic amphora, were established
    in Athens to attract athletes – and in fact most of the winners were non-Athenians
    – tribal events promoted civic identity and tribal stability. This is for why
    the prizes were an ox with 100 drachmas for the torch victory banquet; awarded
    30 drachmas. The winner in the boat contest received a higher prize: three oxen
    and 200 drachmas for the victory.


    The torch race was very popular, that is why we have well-known representations
    of it so far only in part. It is the only athletic competition that was depicted
    in all its phases: preparation, start, race, arrival, ceremony and celebrations.
    Torch races were not held only at the Panathenaia but also at the Hephaisteia,
    Prometheia, Memensia and Dionysidia. The torch race in Athens was a race relay
    starting from the Academy next to the altar of Eros and/or Prometheus, and ending
    at the altar of the deity in honour it was held, where the sacred fire was symbolically
    renewed. Not all aspects of torch race iconography can be treated here; we will
    focus on the typology of the images with some marks on the personifications represented
    and the form of the vases carrying torch some remains. Eleven types of scenes
    are distinguished here.


    # ## II


    +   I. Preparation. There are images showing the preparation of the runners. A
    cup by the Jena Painter (Fig. 1) shows an athlete with a torch at the centre –
    he stands with the left arm and on the right


