    firing in the latest surviving Panathenaic amphora, Jifi Frei dates to the early
    fourth century A.D.¹120 The aim of the hole was to ensure that the amphora would
    not be used as a container, preserving its sacred character. Similar could be
    observed in the funerary containers of antiquity, where offerings and certain
    grain were "killed" thus rendered useless.¹129 If this is really the case, then
    one may assume that during the difficult times ancient religion ruled and the
