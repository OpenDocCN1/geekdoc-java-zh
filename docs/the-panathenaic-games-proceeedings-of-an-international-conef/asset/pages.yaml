    6. Finish, reaching the altar. The sixth type shows the runners reaching the altar.
    A cup in the Villa Giulia (6) carries an abbreviated scene with the runner and
    altar.¹⁸ Around the neck of a volute-krater from Spina a whole team of ten runners
    entails the winner reaching the altar, in front of which stands a priest.¹⁹ Because
    of his myrtle wreath²⁰ and the representation of the Hephaistos myth on the belly
    of the vase, must be the priest of Hephaistos and the race takes places at Hephaisteia.

    A similar scene appears on the well-known bell-krater at Harvard University.¹²
    The olive tree behind the hydria – a prize for the single victor at the Panathenaic
    race – entail the Panathenaic Games. If this is correct, the male figure by the
    altar could be the arch baseline. According to Aristotle²,³ he was responsible
    for the organization of the torch race. A hydria of the Panathenaic race is represented
    on other vases as well²⁴


