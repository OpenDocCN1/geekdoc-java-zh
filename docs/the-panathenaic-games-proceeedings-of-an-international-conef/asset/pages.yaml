    R. Loll, JA 85, 1981, 115 with 61; D. Kyle, Athletics in Ancient Athens, Memosyne
    95, 1987, 16–17; T. Rombos, The Iconography of Late Geometric II Pottery (1988)
    119–123; H. Smythe, "The Abopatenagon. A philologisch-epigraphigraphisch-archäologische
    Studie" (Diss. University of Vienna, 1991) 92–99; K. Reber, AntK 42, 1999, 126–141
    with comprehensive bibliography p. 6.


    +   2. Szethy (supra n. 1) 17–18, 21–23, in Fremden. Zeitschrift für Germanistik
