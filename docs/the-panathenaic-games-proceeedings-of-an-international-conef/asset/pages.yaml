    In contrast to the valuable but perishable oil, Panathenic amphoras were presented
    to the victors because their value was material and lasted not.51 They were dedicated
    in sanctuaries across Athens, not exclusively by the Panathenic victors; they
    were deposited in shrines or public buildings which the deceased had kept in mind,
    in homes or in private residences to ensure the owner''s prestige.52 The black-figure
    images in relation to Panathenaea that were given to victorious athletes at the
    festival of Helios, the Haliae on Rhodes, had similar value.53 The prizes in the
    Haliae were originally bronze hydras, marked by black-figure pottery. Amphoras,
    victors in the Panathenic games, did not dedicate Panathenic amphoras; they preferred
    to receive expensive metal tripods with bronze or colons on the statues of themselves
    to commemorate their victories.54


