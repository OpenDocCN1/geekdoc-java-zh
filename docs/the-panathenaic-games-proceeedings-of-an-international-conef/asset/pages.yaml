  md: '# Games at the lesser Panathenia


    The added honor of the public proclamation of a gold crown, we must remember,
    was relatively rare. When it was awarded, it went only to those who had performed
    services that were perceived as crucial to the preservation of the city against
    enemies. Of the six inscriptions mentioned above, only Agora XVI, no. 208, praises
    arbitrators from the city of Lamia in a dispute between the Athenians and the
    Boeotians gives no details in the present to let us know the historical circumstances.
    The others, even fragmentary, allow us to see something of the context. IG II
    557 is very fragmentary, but the remains in lines 3 and 4 show that the citizens
    of an unknown city are being praised for money for safeguarding the Athenians.
    Phidetos of Sphetos is honored in IG II 482 for a long career of military activity
    on behalf of his city. The others honored by IG II 45b in the year 307/6 for the
    city of Kolophon, remain a decree of the next year, IG II 470, related to their
    support of the Athenians in their war against Cassander. Polyites ofeus received
    a gold crown in the year 302 for firstly member of the Lyceum, in 226/6–5 for
    negotiating frankly on behalf of the city with Antigon II. We may suspect that
    it was far away, and even dangerous, to the King to accept a democracy that had
    been set in Athens just a few years later, in the year 229/8 the death of Demetri
    II especially when the Athenians took advantage of an unstable situation in Macedonia
    caused the governor to disband his troops whom they paid off with 15 talents.


    In addition to these for foreign peoples, the athebes and kosmetes (one a year)
    and the agothetes of the Thesia (every four years) are honored with a gold crown
    at its proclamation at the Panathenaea. These awards fit the model of those who
    had performed services crucial to the safety of the city. The kosmetes and the
    agothetes of the Thesia all played significant roles in the military training
    of Athenians.


    The occasions for these announcements were held at festivals where there were
    competition. The annual performance of the new decrees at the Dionysia was an
    important competition with prizes awarded for the performances judged at. The
    producers and writers were predominantly, not exclusively Athenian. The performances
    were all to and attended by many foreigners. Like the athletic, gymnic events,
    at the pentateric festivals we noted that public proclamations of the awards of
    gold crown were to be the occasion of these festivals, and that the announcements
    were made at contests celebrated by a year. There were not so many awards that
    the honor would have been diluted by the mind-numbering recitation of a multitude
    of such proclamations. Moreover, the context of games offered an impressive occasion
    to remind them in attendance, Athenians and foreigners, of recent recipients of
    what was the city''s highest honor, the gold crown. Such proclamation by Prytan
    of Karostos at the greater Panathenaea in the year 222/1, three or four years
    after it was initially awarded, would have reminded in attendance of his important
    actions and functions in a sense as a revival of the honor bestowed upon him.
    In short, there is no persuasive evidence to show that there were athletic competitions
    at the Panathenaea.


    To conclude, the lesser Panathenia was, it appeared, a local festival overseen
    by the heterai. It includes games contests contrasted by the Athenians, a contest
    of circular race, the day-break procession and the pyrhic or orrhe dance– the
    all-night celebration with the pyrrhic race to the Acropolis, or the offering
    of a peplos to a statue followed by the sacrifices at the Acropolis and the feast
    at the Kerikos probably lasting for just two or three days.


