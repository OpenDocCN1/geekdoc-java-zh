  md: '# The Metaxaic stadium from the Hellenistic to the Roman period


    The Lykouron stadium repaired some time in the middle of the third century B.C.,
    perhaps in 258/7. This was carried out by Herikleitos of Agthonum, presumably
    by agothetes. Herikleitos was, of course, a staunch supporter of King Antigonas.
    The repair may have well been necessitated by damage during the Macedonian War
    but also certainly went well in hand with the new sense of independence given
    by Antigon in 265/6, when he "gave the Athenians freedom". It is perhaps significant
    that at this time dateable Metaxaic prize-ahouse seem to reappear, the dates now
    secured by the name of tamiais straitiokon, rather than archenos. A fragment from
    the Akropolis bears the name of Eukleides as tamiais, of 248/7, while the inscription
    on the column from the Agora as here has been named Eukleides''s, Mion, whose
    turn it was to be in 215/7. Judith Barrringer''s recent controversial suggestion
    that the figure on the column on which been made by King Antigonas might be thought
    to be given the post of the tamiais may hold if we consider the name Dem. Usually
    set a statue of Antigon or more the stadium as a celebrating of his patron and
    his heirs.


    In the second half of the second century B.C. the Metic prize-ahouse record another
    change of official, for the name of the tamiais is now replaced by that of agothetes;
    the first recorded bears Deonias of Erchia in 266/7. It seems that this official
    played a great part in the financing of the festival and that he was chosen on
    grounds of wealth and influence.


    By Nike Metaxa-Prokopiou in 1970, more recently clarified the sequence of known
    Athenic prize-ahouse from this period. Prokopiou published an amphora with the
    name of Aikantis as agothetes, in the Philippos Hill in 1961 and connected it
    with his size a couple of unsigned fragments from the Metaxos and the Agora. Adeimonos,
    son of Adeimonos, from the name of Ikarion, was magistrate of the 147/6 and emilites
    of Delos in 140/39.25 He was probably agothetes in 146/6 or perhaps less, in 138/7.
    In the Giesen Connection Volume Tskoulidou published Ariarathes V of Cappadocia
    (163–130) as agothetes, perhaps dating from 138/7 or 14/3. In so she grouped together
    six Panhenaic amphora as one artist, who dubbed the Giesen Painter, one might
    have wished that she had chosen the more appropriate sobririquet of the Ariarathes
    Painter.


    To this sequence we can add a new fragment acquired by the British Museum in 2002
    (Fig. 4 and Colour Pl. 11).It came from the collection of Gustavaki, who recorded
