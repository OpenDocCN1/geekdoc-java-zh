  md: '# 108


    # Bettina Kratzmüller


    We move on to vase-paintings with the dokimasia - official scrutiny of cavalry
    horses in Archaic and Classical Athens. On a fragmentary cup of the Splanchnoptes
    Painter in Basel a youth in a himation holds up his hand not only to signal that
    he is speaking, but also to mark the number “three”. All details together with
    the name of the horses'' owner were written down by the katalogue on a writing
    tablet.⁵²


    Ancient athletic scenes repay study, especially those on Panathenaic prize amphorae.
    Two of them (Fig. 5)¹³ – showing Olympias personifying the ancient Olympic games
    – bring to the mind the year 2004, when the Olympic Games were held in Athens.


