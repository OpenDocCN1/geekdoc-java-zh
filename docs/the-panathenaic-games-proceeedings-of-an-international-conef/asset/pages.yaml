    # Michalis Tiverios


    Metropolitan Museum of Art, New York, and the so-called Pugathenic amphora in
    the British Museum in London (Fig. 2 and Colour Pl. 1) are dated to slightly before
    560 B.C.


    The features of the Panathenic amphora, protuberant belly, small handles, short
    neck and rather unstable arose, no doubt, from its function. It was manufactured
    to hold the olive oil which was eventually, in a good number of cases, exported
    it therefore natural that the shape should be influenced by amphoras for carrying
    and training Athenian olive oil, known as "SOS" type amphoras. In fact, their
    shape was influenced by a late variant of those amphoras, by the unknown la bourse.
    These "SOS" type shares all the features of the Panathenic amphoras that we have
    mentioned, and it is unclear what made them suitable for shipment on boats, the
    main vehicle of commerce in antiquity.


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_6_0.png)


    The connection between Panathenic amphoras and "SOS" type amphoras is confirmed
    by the type of inscriptions found on examples of both groups. Early Panathenic
    amphoras carry inscriptions such as "Ἀθήναϊσι ἀθλῶν ελαίου" (Fig. 2) or "οὕκκόπος
    ἐλεί" and "SOS" type amphoras have inscriptions. The first inscriptions mean "I
    am the olive oil given as a prize for the victor at the Panathenic games." The
    second mean "I am the olive oil" and "I am the oil of SOS". These were perhaps
    oil jars or, more probably, though there is the probability that the same person
    could perform both roles. Furthermore, in the case of Panathenic and "SOS" type
    amphoras, these, as it were, as "spoken" by the contents of the vases, the olive
    oil, rather than by the themselves.


    Another consideration that reinforces the connection between the two types of
    vases is the fact that after the appearance of Panathenic vases in 560 B.C., production
    of "SOS" type amphoras diminishes and eventually stops. The main, if not sole,
    reason for this was that the Panathena games required large quantities of olive
    oil, which meant there was no surplus oil left over for later use.$6$


    We now deal with the decoration of Panathenic amphoras. The main features emerged
