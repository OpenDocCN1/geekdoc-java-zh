  md: '# Royal Athenians: The Polyindads and Atletads at the Panathenaia


    Just as taking part in the sacrifices marked one''s membership in the community
    of the Athenians, also participation in the trial events marked its status as
    an Athenian. In the second century, the athletic competitions were the hectic
    events on the Panathenaic Way and in the hippodrome, they belong to the sphere
    of activity only a grown man had the strength to control the horses involved.
    These events also have a strong military aspect; to the apathletes, we should
    add the zeugos, the four-warchariot, the war-synoris, and the races for horses,
    as well as the competitions for the phylarchai and the hippes; as for these last
    events in the visitors'' lists, the members of the grown man, the military aspect
    were their armour in at least some of them. Since war was the province of the
    grown man, the military aspect of these events emphasised the status of the participants.
    Taking part in the tribal competitions, emphasised the individual''s status as
    a citizen, a category which was still important in Hellenistic Athens as these
    democracies. At the same time, these martially fashioned fighters in the overall
    memory of the Panathenaia celebrated the god''s victory over barbarians.³ The
    only others to participate were the hippes, the race in armor by adult men in
    the Panhellenic games, in which it was the only contest with military overtones,
    it hopes were also included in the programmes of another at Athenians.⁴ With the
    exception of this competition, martial competitions at the Panathenaia were restricted
    to Athenians who were the only appearing in military guise. The figurative descendants
    of Erichthonius, the founder of the festival and the musical inventor of the aporetic
    race and chariot, the status of the Athenians was emphasized⁵.


    In this setting, participation in the Panathenaia clearly marked one''s status
    and its relationship to Athens, the decisions of the Polyindads and the Atletads
    to place part in the trial events displayed their status as Athenian citizens
    to the other participants in the games, and to the visitors. The audience for
    their display was undoubtedly spectacular; the visitors'' lists record successes
    in the open athletic and hippic events from individuals as far as Liguria and
    as far as Antioch on the Mygonis (Mydonis) and Seleukia on Thrace (Table 4)⁶ Cities
    in central and southern Greece, the lands and Asia are particularly well represented
    in these sections of our lists. Since between Panathenic contests, especially
    heroic events, and was so, the royals'' lists record in them that suggested they
    also fight for Athens. But Athens was not an empty estuary. The battle of Pydna
    in 168, the forces fighting against Perseius of Macedon called Attalos II and
    his brothers as at least some Athenians.³⁷ In the third century, the Polyindads
    provided significant support, both military and other; for the city, Ptolemy I,
    for example, figuratively) fought for her in 287 when the Athenians called him
    II and Patroklos


