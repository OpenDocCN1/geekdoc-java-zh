  md: '# Julia L. Shear


    while Themistokles, and Konon had built temples and founded precincts.¹ These
    royal gifts identified the donors as worthy successors of these earlier Athenian
    citizens who had been active on the city''s behalf and helped to make her a place
    of culture through them. Most of these fifth- fourth century were also among the
    political leaders of Athens and many of them owed prominence to their activities
    against the city''s barbarian enemies. By aligning with them, the Pleomes and
    Attalids to reinforce their participation in the tribal contests of the Panathena
    suggested: that they would fight for Athens against (barbian) enemies and, when
    they were successful, they would adopt the city with additional monuments celebrating
    their achievements as citizens. These dynamics also have important consequences
    for the structures erected by the Pleomes and the Attalids because they were seen
    as the work of the citizens and not of foreigners imposing upon the city.¹²


    # The Pleomes, the Attalids and the City of Athens


    The Panathena provided an exceptional splendid opportunity for the Pleomes and
    Attalids and for the city of Athens because participation in this festival was
    not simply to display one''s status in the realm of Greek culture. For the Pleomes
    and Attalids, competing in the tribal heroic games enhanced their position as
    citizens of Athens, status reinforced when they were proclaimed and when the victors''
    lists were inscribed and yet they erected victory monuments. The tribal affiliations
    of the Pleomes and Attalids stressed their participation in the games and indicated
    that their monuments were not about displaying personal power. At the events of
    the Panathena, the listing of the victors served as a contrast to the individual
    names inscribed in the tribal contests, and the nature of the heroic feats further
    stressed the relational link between citizenship and the city. For the case of
    the Pleomes and Attalids, these dynamics elapsed the connections which the royals
    had with the city and suggested that they were concerned with her well-being.
    The city gave them the opportunity to display their status as Athenians, in turn,
    help help and support both political and military power.


    For the Attalids, the participation of Hellenistic royalty in the Panathena at
    Olympia stressed their importance. The constant absence of these affairs at Olympia
    points to the significance of being seen Athenians. At the same time, the royals''
    interest in the city and her most important emphasized that Athenian identity
    flourished during the second century. The city was also to display the status,
    support both political and military, which these royals, particularly the Pleomes
    and Attalids, were providing for. By offering the Pleomes and the Attalids the
    opportunity to compete in the tribal contests and so to show their Athenian status,
    the city benefited in this particular setting to warrant public resentment of
    enemies that Athens could not easily be defeated because she had such powerful
    support. The city benefited in a further way granting citizenship to these royals.
    Since no limit seemed to have been imposed the number of individuals could claim
    citizenship of more than one royal house. By honouring several different kinds,
    they made that multiple sources of political and military power were available.
    If these various reunions also were clearly displayed to present everyone. These
    honours were part of an on-going reciprocal relationship between citizenship and
    the city in the festival and more frequently in the marketplace. They marked


