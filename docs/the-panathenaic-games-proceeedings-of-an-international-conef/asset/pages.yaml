  md: '# # "Choreographic" or victory monuments of the tribal Panathenaic contests


    Hans Rupprecht Goette


    # ## Introduction


    The Athenian democracy financed a major portion of citizen services, especially
    cultural events, by means of private sponsorship provided by wealthy citizens
    designated as *choregoi*.¹ Such sponsors included the gymnasiarchs and chorego
    for several festivals and competitions. Best known are the choregic offerings
    erected after victories in dithyrambic competitions at the City Dionysia: these
    took many forms and varied over time, from small bases with the choregic inscriptions
    on their faces to architectural structures that resemble temples. They flourished
    together in wealth from the victorious contests held at the Panathenaic state.


    This paper takes another kind of choregic monument: those erected by sponsors
    of contests held at the Panathenia. As we will see, unlike their Dionysia- counterparts,
    it is much more difficult to define and locate the choregic monuments commemorating
    Panathenaic victories.


    # ## Terminology


    Part of the difficulty lies in determining exactly what constitutes a choregic
    monument. For example, trophies set up on bases are typical prizes given by the
    state to successful choregos of the dithyrambic competitions in the Dionysia.
    The accompanying inscriptions are sponsors of time. When we look at the victorious
    monuments (usually just the bases) for the Panathenia, we cannot be sure if they
    were set up by the choregos, teams or athletes. The inscriptions moreover suggest
    many varied prizes for the contests. The question arises: what would a victorious
    contest of a Panathenaic receive from the state for public display on a choregic
    monument?


    Two conditions must be met before we identify a choregic monument in commemoration
    of a Panathenaic competition: first, the contest must be limited to Athenians,
    and second, the competition must be organized by a tribe.


    # ## Literary and epigraphical sources


    Lysias'' 21 and IG II 2311 (1), both of the first century B.C., are the primary
    evidence for such contests. Boat races, there were five competitions fulfilling
    the contests just mentioned: *euandria*, *kyklos* in a diasyramic competition,
    *pyrrhic*, *lampedrom* (lamps), and *anthippia*. The vic-


    +   ¹ P. Wilson, The Athenian Institute of the Choreography (2000 pass); bibliography:
    395–420.

    ² IG II 3062–3077, 3008–3089 (supra n. 1), 22, 195–225.

    ³ RE Supplement III (1956) 861–888, s.v. Tripides (Hiemanz); P. Amandy, BCH 100,
    1976, 15–93 id.; BCH 121, 1997, 445–487;

    ⁴. R. Goette, in M. Fano Satti (ed.), *Studi di archeologia in greco Tuversari
    I* (2004) 463–476.

    ⁵ In IG II 2311 (supra n. 1), for so contests those held at the Panathenia are
    separated from those open to all: S.

    ⁶ V. Tracy, Nikephoros 4 (1996), 146–147; J. L. Shear, 242 (2003), 87–108, exp.
