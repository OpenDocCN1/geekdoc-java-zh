    athletes who are alike to give thank offerings, or they may be cerampts from a
    larger process or processes.


    In either case, the depiction on the Montreal crater remains unique, and if it
    depicts, as I have suggested, the second awards'' ceremony with which the amphorae
    were given to the Paathenic winners, it gives us our first glimpse of this event.
    This crater reminds us that even vase-painting is not particularly well-drawn,
    it can still provide us with new and stimulating evidence for events that happened
    long ago - in this case of those at the Greater Paathenic Games in classical Athens.


