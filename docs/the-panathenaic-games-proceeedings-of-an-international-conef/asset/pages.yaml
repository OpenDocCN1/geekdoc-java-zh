    in 178/7. The general pattern is one the programme for the Panathenaic Way doubled
    between 182/1 and 178/7, and by 1709, the numbers had risen to, a level at which
    they remained for the next twenty or so years. These figures suggest that the
    races on the processional route were popular, a fitting attraction to consider
    when the course between the Dipylon and the Eleusis had a hard start, beginning
    on one side and gradually ending near the northeast corner of the Agora. The potential
    for disaster must have been high, especially in the apotic contest and all the
    double-length races; the slightest misconception would have resulted in broken
    ankles, wrecked vehicles, or even worse. Nevertheless, it was exactly in these
    cases, the diaioi for the chariot to be precise, that King Polybius V competed
    and won in the hippodrome: in 1709/6 Eus II with the war-chariot Attalos II in
    the diaioi for the synoris and in 182/1, 162/1 Eumumenes II in the race for the
    long-distance horse and King Polybius VI with the war-synoris (Table). For the
    racing of such contests, the standard racing chariot could have easily handled
    the turns but not so fast; for this reason, these contests were considerably more
    attractive to the Ptolemies and Attalids than those on the Panathenaic Way.


