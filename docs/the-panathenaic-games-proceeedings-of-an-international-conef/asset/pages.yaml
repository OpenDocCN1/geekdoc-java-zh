    festival with the divine alone. Maybe they hoped to ensure the help of their patron
    goddess, that her festival would survive, now that themselves were able to do
    little in this time.


    Over the thousands years of life of the Great Panathenaia, some of the finest
    painters of the Athenian Kerameikos were responsible for the decoration of Panathenaic
    amphoras. Among these painters we remember Lyodos, Euphias and Euphronios in the
    sixth century B.C., the Kleoprates, the Berlin and the Achilles Painters of the
    fifth century B.C. The Pouraltys, the Marsyas and the Wedding Processors of the
    fourth century B.C. The excellence of these painters was certainly worthy of the
    brilliance of the great festival of Athenians. In Hellenistic and Roman times,
    when black- and red-figure died out, as evident from the latest known amphora
    of the fourth century A.D., which we have already mentioned and which was found
