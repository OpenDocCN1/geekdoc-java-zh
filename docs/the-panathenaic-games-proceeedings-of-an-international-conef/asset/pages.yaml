    The Athenian state obviously awarded the contract for the vases after a public
    competition. Pottery workshops would have presented samples of their work to the
    officials responsible for the award. Obviously the criteria were economy and quality,
    although clearly the officials would have sought some guarantee that the workshop
    would be able to execute the order required.${107}$ Pottery competitions in Athens
    are attested by the sources. In inscription of 330 B.C., inscribed on the lower
    layer of a grave monument to the potter Bachius, son of Amphisthrus, of the deme
    Kerameikos, we read, “ποποιηῖν ἀγγέος ἵδ παλέτς πάθω Λοβᾶ ἐσεαῖν.${108}$ This
    confirms the hypothesis that the Athenian state held competitions for the manufacture
    of Athenian pottery, particularly since we have found inscriptions on pottery
    vases with the name of the potter Bachius.${109}$


    That of demand on pottery is also indicated by the verb “ἀποίν”, which must clearly
    refer to the owners of the pottery works.${110}$ Moreover, from Aristotle (Ath.Pol.
    49.3) Xenophon says “ἐξξερν δὲ ποιτὰ καὶ τὰ παραρατία τῶν κρίων’ καὶ τε πὸν ποίλεί
    βοῦ, ὅν δὲ τὸ ἀκτήστριον τῶν λαγῶν ἔλεγον οὐ γάρ ἀκατηρήσειν τὴν παραρασία” leads
    to the conclusion that the state awarded the contract for manufacturing the Athenian
    pottery after a competition. The word would refer to the samples of Athenian pottery
    that were produced and displayed, or so that the Boiler, in the time of Aristotle,
    τὸ ἀκτήστριον τῶν λαγῶν could choose the most suitable work to award the contract
    of manufacturing the Athenian pottery.${111}$ The phrase that follows in the text
    of Aristotle (Ath.Pol. 49.3) “οὐκ δέν εἶσαι μετὰ τὰ περιχόμενα ἐν τοτῷ τρῆμο ἀποδοῖν,
    ὅσον μετὰ τὰ βεῖῦ” does not mean the vessels as the term implies, as Aristotle
    uses vessel to mean not but their contents, as in another (Ath.Pol. 60.3): “ἐξξερν
    δὲ γαα... δὸ δὲ τοῦ γγκῦν ἀκατήρίν καὶ τὸ ἐποδοχο ἔελον”. Another passage from
    the Constitution of the Athenians (Ath.Pol. 60.1) “...ἰ ἀποδοθεῖν δὲ το ποιμὴν
    παραρατία καὶ τὴν ἀγκυν τῶν ἀσίωνμων καὶ τοῦ γενικῶν ἀγκυν καὶ ἀ δοίμαι”. The
