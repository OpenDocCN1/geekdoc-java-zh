    Jenifer Nails


    As noted above, the keles or horse race is conspicuously absent from the first
    generation of Prize athletics. The earliest inscribed prize won was that of Panathenaic
    c. 530–520 in Nauplion, but here the race was not;⁴ the victorious horse race
    led by its owner is merely phyllobia from two other men.⁵ As Dyniketos'' vase
    in London, the emphasis is on the victor, not the contest. In the earliest extant
    Panathena prize vases to show the actual horse race are produced in the Antimeites''
    work and dated c. 520–540.⁶ An unusual and early (c. 660 B.C.) Panathenaic in
    Black with plastic heads at the base of the handles shows two horses with riders
    confronting footing.⁷ This early evidence suggests that the prize race in the
    first few decades of Panathena may have been a tripod, rather than amphoras with
    olive oil. It suggests the reverse on the Olympic prize family (648 B.C.), which
    was one of the earliest Games in 568 B.C.⁸ In the early years of the Panathena
    the memorial or olive trees of the god may not have been plentiful enough to produce
    olive oil for every event; it would have taken decades to plant trees to ensure
    a large crop for the festival.


    In the second century, Type B amphoras, especially those in the order of Ekekis,
    shows in the prize of victorious athletes and charioteers rather than riders.⁹
    Two-triopers on an amphora in the Villa Юлия follow a larger bust indicate that
    he was a victorious player;¹⁰ and one in Washington D.C. By the Painter of Berlin
    1686 is part of victory ceremony.¹¹ The victorious athlete is being crowned by
    a judge seated at the left while a trire attendant stands beside him. Finally,
    some of the Type E amphoras show the athlete receiving the Panathena prize; this
    may be the award on the reverse.¹¹² At this point does it seem that the race has
    become a victory won, place will be taken in Nike-fifth red-figure prize vase.
    Bronze tripods had originally epic captions because of their association with
    the funeral games of Patrokl and may have been an appropriate prize for the Athenians
    taking part in the prestigious *keles* at the earliest Panathena.


    The prize was clearly an important aspect of the early celebrations of the great
    Panathena, and Kyle has the importance of such awards for non-Athenians to the
    festival. This prominent display of rewards on Panathenaic and other Athenian
    vases amounts to a kind of visual rhetoric that advertises this distinctive aspect
    of the Panathena in relation to other crown events held at this time. The Panathenaic
    prize inscription (“of the prizes at Athens”) carries the message to liberate
    that the festival at Athens is both lucrative and so worth. It also advertises
    the wealth of the city and the patronage of the goddess who produced the olive
    tree.


    # Conclusion


    While the Panathena existed before 566 B.C., its main components were incorporated
    into a greater festival, which was merged and made into a pentatletic event on
    the Olympian and Pythian Games. The evidence from the earliest Panathenaic prizes
    and their demonstrations indicate the difficulty of probability from import and
    modeling these early festivals in terms of athletic and equestrian competitions,
    the presentation of a reward to the god, and also perhaps tripods in the horse
    race. The first generation of Panathenics, produced between 566 and 530, depicts
    a fairly full program on Olympia. The most distinctive feature of the Panathena
    Games were the contests, and as we have


