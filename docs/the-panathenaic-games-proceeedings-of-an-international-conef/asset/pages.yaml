  md: '# Δέσπονα Τσουκλούλου


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_116_0.png)


    του αγείου μας με τους μουσικούς του αφορές Ρ 8522

    Π10431 της Αγοράς και με τη Νίκη στην αμοφορα

    του Πασαιμάχων.¹⁵ Η γραμματική και διακοσμητική τάση είναι

    ταίνη, ενώ επανέλνει στο ενδυσμα του μουσικού του αγείου

    του ζωγράφου, αβείως για την πλαστικότητα με την οποία έχει

    αποδομή το τίτλο του χρωματική σκυρότερα το εσωτερικό

    του πτυχών που να δηλώσει βάθος. Ενδιαφέρονφέρον

    πάντός είναι και η σύγχρηση της Αθήναι στην Αγορά

    (του μελαδρόνο) πανπαναθηιακή αμοφορα Ρ 18008 στην

    Αγορά, με την υποπορρική σαφάρα συντηγηση

    ς προς το δόμηλο, όσο στο κατά μέρος του και στα όλα

    ελέγχονται τιμήματα από αυτόν τον κόσμο (εποχίδους) της

    παλής της αθητικής - οφεις: όπως μια ελλακτική

    εδώ, τιμήκου, Εικ. 5α, 5β, 11).¹⁶


    Μές όρως τον χρόνο, της Αθηνών, στην αφθηνη

    μορφή να βλέπουμε τη μορφή στην έπια του κλωνιάκα

    και στην αποσασματική του μορφή του κύρια ότου

    του αγείου, αυτοί εξέλεξη των κράνων από την Αθηνών

    Ρ 36 από τον Χείρον, που χρονολογούσε στις 98/π.Χ.¹¹⁷


    Παραξεί του των κράνων αυτού αυτοποί της στην Αγορά

    σστόρικό ρούμικό παραναθηϊκό αμοφορας.

    Συνεκτικά, συνίμως, όλα τα παραραπάντα στοιχεία,

    θα μπορούσε να χρονολογηθεί ο χρό του αγείου

    μεμεσα στο σημείο του 1ου α.Π.Χ., και επανεξιστεί η

    στία των λευικών αμοφορών και στην τρόπο

    αυτήτή αυτή.


    # Μουσικοί αγώνες και επάθλα


    Οι μουσικοί αγώνες αποτελούσαν ένα από τα της Παναθναϊών από την 6η έποδο αρχής
    της Αθηνών

    και της ευγεντικής ελληνικής εποχής, η μαρτυρίζ από τις άρσεις παραστάσεις της
    αγείου,

