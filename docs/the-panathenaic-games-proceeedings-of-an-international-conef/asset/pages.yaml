    # Julia L. Shear


    officers; the races were presumably upon all members of the cavalry.^24 By 170/69,
    the number of races had doubled and separate divisions for the hippes and for
    the phylarcharchi had been introduced. The Athenians wished to encourage participation
    from a wide range of individuals: the cavalry, Athenians wealthy enough to afford
    a team for zeug competitions but perhaps synoris events, and men owning a racing
    synoris or the four-horse chariot. This last category would have included the
    Pleiades and Atallids and if they asked the Athenians wished to encourage their
    participation in the tribal competitions; they then, introducing and increasing
    the number of races in the hippodrome would have been without objections. Adding
    more events to the contests on the Panhenaic Way would have ensured that there
    were still plenty of races for Athenians who did not wish to compete with limited
    resources in the hippodrome. From this overall pattern of development, we suggest
    that the Athenians were not only encouraging general participation in the tribal
    events also, and more specifically, the participation of the Pleiades and Atallids.


    # Participating as an Athenian


    These concerns bring us to the issue of participation and what was at stake in
    competing during the festival at the Panathenaia. As the victors'' lists make
    clear, not everyone took part in the festival the way away. While with time, talent,
    and money could compete in free events, the athletic games, and the individual
    events, members of the Athenian tribes could part in the tribal competitions.
    These distinctions in participation should be considered marked, not trivial,
    and they are especially not even in the games. Nevertheless even the ability to
    dedicate during the festival was restricted to Athenians, their colonists, and
    the allies of the city. This point is clear in the early period immediately after
    the Cheironian when commemorating Antigonus victories over the barbarians on behalf
    of the Greeks were made, not by him himself, but by the allies (the Herakletoi,
    as those of Alklepides, and the name Ashmonon); the most plausible explanation
    is that the king did not have Athenian citizenship at this time.^25 Similarly,
    no sacrificial victories were offered to the goddess by them or others of the
    Athenians,^26 by allies^27, or by the city also.^28 Consequently we see the sacrifices
    and the subsequent distribution of meat as an important event and distinguishing
    between the actual members of the sacrificial community, that is the Athenians,
    their colonists, and allies, and visitors in Athens as spectators not able to
    participate fully in all of the festival.^29 Note the close competition for the
    dedication of sacrifices; since they could not offer a dedication to them, probably
    also not able to set up a monument in their sanctuary to celebrate their victories;
    however no example survives. Their Athenian citizenship made it possible for the
    Athenians and the Pleiades to erect in the city memorials commemorating the successes
    in the games; the two pillar monuments located west of the Propylaea and at the
    northeast of the Parthenon on the Acropolis probably served as markers for such
    Panhenaic victories.^30


