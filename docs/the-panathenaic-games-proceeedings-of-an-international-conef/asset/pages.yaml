  md: '# 128


    # Πάνος Βαλαβάνης


    προβληματιζόντα αρεκτή για τη συμπλήρωση του ημιτελού στύχου 39 και οι προτείν
    είναι η συνφή τουδ σικνικών αγώνων (πάντας) Ζείσης είποίην, έτετε η πιο ενδιαφέρονσα
    πρώτος πάντων. Η αποδοχή της τελευταίας της σημαήνει ότι οι δραματικοί αγώνες
    ειςισίχθηκαν για πρώτη φορά στην ιστορία του 162 π.Χ.



    Χωρίς υποδεχόμενη οποια ουσία του θέματος, το που λέμε εκ των πρώτων είναι ότι
    η ημιλήρωση πρώτος πάντων στον συγκεκριμένο στόχο θα να απαραίτεί για δύο λόγο:
    η ύρξη του άρθους στην αρχή του στότύου 39 σημαίνει ότι οι σικνοικοί αγώνες δεν
    αναφερον στο σημείο του κείου για πρώτη φορά. Αλλά θα μπορούθε να εγράφερ σικνοικοί
    αγώνες πρόπτος Ζείσης. Το βλεζό και η τουλογολογικό ήταν το τελευταίο μέρος της
    επιτιγής (στ. 39-43) προσλείδασε σε σχετικά ελληνικό γραμμείο για τον αναναζήτηση
    Ζείσης, το οποίο αποτέλεσμα παρείίξε μια την συμπλήρωση του πρώτος πάντων.



    Οι παρατηρήσεις αυτές δεικνάν στον στόχο ή αποκλύπτεται ότι σικνοικοί αγώνες ειςισίχθησαν
    ή είχαν. Το στόχο του 162 έτών μέρους ήταν να υποποδοισθεί, οι προτετείνν εκδόσεις,
    η πρώτη σε αμήμα της περιότης, που απαραίτεί για τη διεξίνηση των νέων αγώνων.
    Το γεγονός ότι ο Ζείσης δεν αναφέρεται χρονουδιακτικά προδοσσιατικά (πατρωνικό
    και εδηδικό) σημαίνει ότι ο όνλος, η ησμία και η ίδρυση των σικνοικοί αγώνων,
    αναφέρεται στην αρχή του κείου, όχι του καταλογίου του. Αν λιστος στην αρχή της
    υψηλής ύρξης και κάθε ποιοί τρόπος, θα μπορούσε να θεωρήσουμε ότι ουτός ο κατάλογος
    των νικητών πανανείχαν σε κάποιο κατάστημα, το που δεν έχει μέχρι σαίρόρα παράδειγμα.
    Σε καρίθεση, όμως, είναι βίβαιο ότι το 162 π.Χ. δεν ήταν η εισαγωγή των δραματικών
    αγώνων στον Παναίθαϊνα, αλλά μια εναρφή τεπνιος τις για τη διήγησή του.



    # Δραματικοί αγώνες και αρημητική


    Δεωφόρως αν είναι οι δραματικοί αγώνες των Παναίθαϊνων, ή και των Μεγάλων Διολλών,
    θα μπορούμε να υποθέσουμε ότι η εισαγωσή τους είχαν αρκετικές συνδέξεις στη μορφή
    του θεικού αλλά και και στην ποιότητα της νότης κλύτος της Ακρόπολης. Τίποτε δεν
    αν συνισθεσει να αναλύσει στο αναγωσμό.



    Ένα παλά πολυπλοική και δεξτοπλήματα είναι η εισαγωγή της χρόνης του φασνικού
    κοινωνικοδοξήματος του Ελληνιστικού. Εκείνο που μας εναισισφορεί, είναι ότι η
    οριζόντια της ριζικής αναντικής της νικανίας, στην οποία η πρώτη λεφήρη διοίκηση
    σχηπήθηκε με υψηλό ποσοστό. Η χρονολογία της φάσης, με βάση αρχαιολογικά δεδομένα,
    δεν μπορεί να ανακλείθεί με ακρίβεια. Η χρονολογία έχει γενικά μετά του 2ου α.Χ.,
    από ένα α''μιο'' του 2ου α.Χ. και αποπορικά και χροί 200. Εείν βάλέων και καιδοίας
    της καταστασης του 1ου α.Χ. και οι καταστήροι να υποποτείνουν το κοινωνικότημα
    της κλύτος της Ακρόπολης, ή της Σόλ.



    Επειδής όλα τα αρχαιολογικά δεδομένα είναι ανερερχικοί, η χρονολογία της εισαγωγής
    της διαφοράρής χρόνης συνδέεται και με την στόχο του Μινάνδρου προσβολθητα της
    διαφοράρής χρόνης, αλλά η τελικάία ότι η σικνοική δραμαματορουργία είναι η αρημητική



