    seen, these became an important part of the sixth-century Panhenaea. On the evidence
    of a Panhenaic-shaped amorpha of c. 540 in Liverpool, Shapiro argued for performances
    byhapsodes in the early years of the Panhenaea.⁵53 Likewise that Kleitsenes of
