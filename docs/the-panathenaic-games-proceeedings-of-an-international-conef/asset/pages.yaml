  md: '# 6 Michalis Tiverios


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_10_0.png)


    The cocks are more easily interpreted. Most scholars agree that they symbolize
    the competitive spirit, since the aggressive spirit and persistence of these animals
    were well-known. The fact that on Panathenaic amphoras each face faces one another
    probably refers, albeit indirectly, to the widespread and fatal cock fights of
    antiquity.²9 This hypothesis is reinforced by consideration of some vase paintings
    depicting two cocks facing each other on either side of a Panathenaic Athena Pronachos
    (Fig. 11). However, it is possible that the cocks at any the columns of the Panathenaic
    amphoras framing Athens (and thus Athena of the Gigantomachy) may also refer to
    the rising of the sun, that is, the coming of the next day, after the fearful
    battle within the giants. Ancient literary evidence informs us that Zeus forbes
    Helios (Knox) to rise during this battle until he find and destroy the herd that
    was caused by Gé (Earth), which she considers her children invincible.³⁰ In antiquity,
    too, the cocks that herald the coming of the day are a widespread motif. Pausanias
    (5.25.9) explains the significance of a cock used as a shield device on a statue
    of Idomenes at Olympia, “το ἰδόμεν γὰρ ὅτο Πλούου... Πλούου διὲ ἕρον φααιν εἶν
    τὸ δρνητα ἀγγλλείν ἀνινεα μέλλοντος


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_10_1.png)


    +   2-3, pls. 2.1, 2 and 3.

    ²⁹ For discussion of the cocks, see Neils (supra n. 1) 51ff.; Mansfield (supra
    n. 11) 41 f. On a pseudo-Panathenaic amphora by the cocks, on the columns, instead
    of facing each other in the normal fashion, turn their heads away: Neils (supra
    n. 5) 43, fig. 18.

    ³⁰ Neils (supra n. 5) 18, fig. 55.

    ³¹ Apollod. Bibl. 1.6.1.'
