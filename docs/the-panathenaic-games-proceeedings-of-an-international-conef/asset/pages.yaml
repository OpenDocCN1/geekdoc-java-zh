  md: '# Λευκοί παναθηναϊκοί αφορείς και μουσικοί αγγώνες


    # Δέσπονα Τουκλίδου


    This paper deals with a white-ground Athenaic amphora depicting a cithara-player.
    The amphora is dated to the first half of the first century B.C. and presents
    a new specimen of the white-ground Panathenaics that replaced the chaised prizes
    and gold wreaths awarded to victors of musical contests according to Ath. [Ath.
    Pol.]. This replacement was thought to have taken place in the third century B.C.
    but there is no evidence of amphorae towards Panathenaic musicians even before
    the fourth century.


    Εισαγωγή

    Οι ελληνικοί παναθηναϊκοί αφορείς αποτελούν μια ξεχωριστή και ιδιαίτερα ομάδα
    σε σχέση με τα κανονικά παναθηναϊκά αφορεία, οποία γνωρίζζουμε κυρίως από τα δημοισυμενα
    αγγεία και στράκα που προέρχονταν από την ανασκαφή τους στην Αγορά της Αθήνών.
    Τα αγγεία θεωρούνται ότι προσωματοποιζόμενα της 3ου αιώνα π.Χ. και ανματοπορούν
    επί των σθλους μουσικών αγώνων των Παναθηναϊκών, καθώς και σε στοιιχείς δραματικούς
    αγώνες, με τη εισαγή των τελεαιών τωντελεαυτών στο πρόγραμμα της εορής στόμα του
    3ου αιώνα π.Χ.


    Σ'' αυτή την ευαρεία ομάδα αγώνων εκπροσσωπεύει ο αφορείς παρεουσιασμός ομάδας,
    αλλά αρκεκάλα με πολλά ενδοφορήσεις (Εκ. 1-4). Το αγγείο δεν προέρχεται από δχυστών
    δόστηων ανασκαφή, αλλά από την κατηγορία και του μούδου του περιρίου που πρόκειται
    μια κατασκήρηση δημοίτευυση στον περιορισμό του Φουλολαίου, όπου διαματογραφονται
    και ο Δούσιος Αρραποριστης της δεκαετίας του 60ου.


    Τα αγγεία χωρίζονται σε τρεις μέγεθη: το μεγάλο, με μεγάλη λαιβή και το μεγαλύτερο
    του σώμα, το μέσαίο, με μικρό σολπό στο οποίο βρίσκεται στην αρχτή η αγορά της
    βάσης, και το μεγάλο μέρος του σώματος, οι στράκα που προέρχονταν από το σώμα
    του αγγείου (Εκ. 5-αω). Ως το γενικό σώμα, οι αφορείς φαίνονται κοντόρδοντες,


    > Οι παναθηναϊκοί αφορεί με την ανασκαφή τους να παραμαήθηκε η διάγραφή του σχεχετικού
    αλικού της αγωγίας των Αθήνών. Για να δείξετε περισσότερα, Μ. Θ. Τουκλίδου, 1991,
