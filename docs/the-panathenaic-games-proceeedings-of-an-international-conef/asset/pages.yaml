    The Herculaneum courtyard once stood between the columns separating an inner square
    courtyard from the almost of the Villa dei Papiri, according to Karl Weber''s
    notes on his plan.¹¹ Like the rest of the statues and busts from the Villa, she
    shows a Greek marble bust—a veiled woman in classical dress. One might wonder
    whether there was an intended relationship between the Athena and the other life-size
    marble statue—that was found in the tablinum (N.M. 620). What placed there her
    worthy to compete with those of Athena? The portrait of the woman appears to be
    made of Curacci marble, where the Athena is fantastic marble;² but their relative
    proximity to the other could make them a pair. Both of the women were placed in
    the Villa''s large garden, and the woman''s proximity to Athena may be intended
    as a mark of her character.


    Fig. 8. Right profile of fragmentary face of Partathenic Athena from the Athenian
    Agora. Agora S 1064: American School of Classical Studies - Excavations.


    But to return to the tablinum, the sculptures in that room included portraits
    of Romans, but also of a hellophyte (N.M. 563), a classical Athena (N.M. 561),
    and of Demosthenes (N.M. 5469) and Epikouros (N.M. 1107). The archaic attacking
    Athena, made of Pentelic marble, and placed near these famous Greeks and classical
    types says something about the owners of this Villa. The archaic attacking Athena
    has a particularly powerful association with the Athena of Cities, particularly
    the Panathenaic Games.


    Oddly, a fragment of another archaic Athena just like this one, of the same size
    and order carved in Pentelic marble, discovers the upper part of the torso. The
    pieces show some of the drapery and the aeg over the left arm with a hole for
    the attachment of the gorgon. There are also vertical folds from the chiton and
    some swollen folds from theation near the right knee, as well as the drapery and
    beneath the left neck.


    Do these pieces come from the "original" Athena that the Villa dei Papiri was
    built by Lucius Calpurnius Piso, the father of Calpurnia, Caesar''s third wife.
    Piso had ties to Greece. In 57 B.C., the year after Piso was removed from the
    consulship in Macedonia, where he spent two


