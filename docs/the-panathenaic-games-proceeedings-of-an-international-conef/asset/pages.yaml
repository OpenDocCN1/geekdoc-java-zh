    βαρού και διόγκουμένου. Ο λαίμς είναι σχετικά κοντός, με τον χαρακτηριστικό δάκτυλο
    μέσ άτονα πλασμένο (αντίθετα από ό, τη συνήθθως), και περισσότερα χωρισμένο στα
    μια άλακα;² και το ποδήί είναι κοντό, όπως προκύπει από την ελάχιστη συζόρνη αρχή
    της.


    Η γραφτή διαχόριση ευ εκτελέται με σκούρο ερυθό πάνω σε υπολογμένο αμύδρα κιτριπνό
    επίρμα, ελαφρόαστα στάλπου, και αναναιστώνεται μέσα στις γωνίες, καθώς και στις
    πλαϊνές. Στην προσπάθη, ελληπισμένη, καθώς από το μεταφυλνθισμο που κόσίζει τον
    λαί και στα δύο όρη, σζάτεί ο λόρος και μίρμής του κορρού της άνταγας, στραμμένη
    προς τα δεξιά, καθώς και τιμή της αντίίας. Η σηζέτα στον κιτεότερο μέσο της θεας,
    με τα ακρά πόδια που σημαμαίίζουν βαρείδες εμπρός. Σε ένα από τα σοζίσια αστράκα
    (Εικ. 5α) διακρίνεται το μέσο του δεξιού τμήματος του κορρού της θεής με τη ζωνή
    του πέλματος και την αγάπη αποπομμένη με μια τιμηλιά, καθώς το σημεείο που ξελωνίζει
    το ακρού του ιδτιαμίου που θα έφεπε από το μιζόμενο δεξιά χέρι. Το όλο το άκρο
    του ιδτιαμίου, στον αριστερά χέρι, συζάτεί μια άκομη (Εικ. 5β). Αριστερά της διακρίνεται
    η πλευική κατητία της πλαϊκής της ζής και τα αστράκα σοζάτεί τις τάξες, πιθανθαίντας
    από την πλευρά δεξιά (Εικ. 5γ).


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_113_0.png)


    Α. ΜΕΛΑΣ

    ΠΡΟΥΤΟΡΟΣ ΕΣ

    Γ-ΦΡΟΥΜΕΛΗΣ


    Εικ. 1. Αφορίας Α16500, τοχή.


    Η όψη αυτή της αφορής συζητεί περισσότερα λεπτομέρειεια. Το χωμή για των παναναχαϊών
    αφορής εικονιίζεται με πλήγματα μετίμμια ανάτεστρόσματα, τα οποία οριζόνια οριορίζουν
    τα άκρα. Ακολουθεί, μεταξύ μιας μετάσης πάνω του μέρους (κιθάρας ή κιβύρου) προς
    δεξιά, από το άκρο που σοζτεί η αυξή και μέχρι το μέσο του μέρους, καθώς στο σιχό
    και στικρό, το σίμα που σοφά είναι μέρος του χρούρου που φορτερεύει στα δεξιά
    και τα αστράκα διακρίνονται ελάχιστα (Εικ. 6-7). Αριστερά του μονωχαρού υπάρουν
    μια σειρά από σζήματα που μοιάζουν την μορφή του ανθρώπου και αποκρύνουν από την
    άψων της θεής (Εικ. 8). Η θεά διακρίνει δεξιά της χρού, που φοράεται ένα κεράφι
    κα που μοιάζει με το συζάτο, στο οποίο είναι ανοιχ κλοχο, άκριβώς με το λόφού
    του κορρού της θείας, στο οποίο οποιο βρίσκεται στον αριστερό χέρι. Σε αυτή την
    αφή του αυυγίου δεν είναι εδικό να υποποθεθεί το αντικείμενο που κραράθηκε τη
    δεξιά χέρι, η οποία ενικδύνεται ότι υπάρχει άκλος και κύκνος, δεξιά στην στην
    όρη που έφερε απόσποπιο.⁶


    κατά πρόσωπή (Εικ. 7).


