    The throne is decorated on the sitter''s side only (Fig. 8). Here we find an amphora
    of Panathenaic shape, with a sprig of olive in the top, resting on an elaborate
    four-legged table with three wreaths. Under the table are two palm branches and
    in the background to the left arms olive tree. Elaborate volumes decorate the
    arms and two owls form the front leg. The left side is undecorated, but has a
    carefully worked frame and picked central panel so it could be set close against
    another throne.


    The matching from the other end of the archaic chairs was also seen and drawn
    by Revett (Fig. 9). Its decoration was, of course, identical. In 1805-6 Edward
    Dodwell sketched the second chair (Fig. 10), presumably because the other had
    already been removed by Hunt and Lusieri for the Hamilton Nisbets.⁵³ The Dodwell
    sketch shows the throne now much changed— the relief decoration was defaced that
    he could no longer recognise the stump of the olive tree or the foot of the Panathenaic
    amphora, leading him to draw instead a fourth wreath. This second throne seems
    to have disappeared completely.


    The iconographic scheme of these elegant thrones makes a perfect counterpoint
    to the stadium. The owls of course Athena''s; the olive-tree is here too. The
    table is of a particular four-legged type and it appears, usually referred to
    as agonistic table—on second century bronze coins of Athens which are regularly
    associated with Hadrian''s First Panathena, while particularly this table may
    be seen on coins of the 2nd century A.D., images that perhaps even have been influenced
    by the decoration of the Heroan Panathena stadium.⁵⁴ The amphora is Panathenaic
