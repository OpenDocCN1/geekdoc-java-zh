    another youth with a strigil. The scene is obviously situated in a gymnasium.
    On a cup by the Fauvel Pinter from Spina a whole team of torch racers are depicted.
    They wear their distinctive spoked crowns made of reed and are shown in conversation
    — but one sits on a rock, others test their torches, he is cleaning his body,
    another is looking at the champion of his companion.


    Handing over the torch to the starter. In a second type of images the torch is
    given to a runner, the starter of the team. The figure passing the torch is usually
    an anonymous man in a him, representing perhaps the citizens of his tribe; but
    some representations, never discussed before, have to be explained in a different
    way. On a cup in St. Petersburg (Fig. 2 and Colour Pl. 6), we see a female figure
    with a scythe in the late. Late fate we interpret as the prescription of the tribe.
    In the fifth century there is an increasing number of female personifications
    which are difficult to interpret if their name is not inscribed. As in this case
    the scythe precludes interpretation as a normal polis citizen, the most compelling
    solution. In this picture we can also recognize the characteristic form of the
    torch which is held by another made of clay or bronze with a plate-like hand guard.
