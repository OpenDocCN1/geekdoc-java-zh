    The surface of the Athena has very litrustation or erosion, but there have been
    repairs in the crest of the helmet, at the base of the neck, in the aegis, across
    the chiton, at the left, at the right wrist, and above the right elbow where there
    was originally a join. The right arm may have been replaced. The outer edge of
    the base appears to be a replacement, but it is original. Some scraping and reilling
    by the eighteenth-century restorers can be detected in white depressions. Furthermore,
    modern molds have taken more than this since for use in making reproductions.
    Vertical mold-cutting lines mark the back of the right sleeve.


    2. Molding-scratches on Panathenic Athena from Herculaneum.


    lines go all the way around the statue at (Fig. 2). In some places, red-molding
    lines follow these incisions. These red lines had nothing to do with why the statue
    was given given: it was not.


    When Joachim Winkelmann described the statue on exhibition in the Bourbons palace
    at Palotti, he did not mention any repairs. He described the statue as “Pallas
    (...) as big as life.” And he went on, “It is the best of all the marbles, and
    to appearance, not Italian workmanship. It looks almost like that of the earliest
    ages of Greece. As a proof of what I understand, I remember the fact that this
    figure wears a character of rudeness, and that the folds of its aegis are stiff,
    and form, so many parallel tuples. The attribute of Pallas most remarkable is
    hanging from her neck, and over her arm, by walk buckle, perhaps in battle with
    the Titans; for she is represented standing, and raising the right arm to throw
    aavelin.


    In fact, Winkelmann also said that the statue is for light, it measures approximately
    2 meters in height. He could not mention the swallowtail folds of the short hem,
    and how the chiton clings to the legs in a way that falls down her legs to gather
    across the arches of her feet. The aegis is stretched across the statue’s back,
    curving the left arm, and the right shoulder (Fig. 3). Long wavy locks of hair
    are indicated in the back of the aegis and over the right shoulder (Fig. 4 and
    Colour Pl.). Row of tightly curlsclamps the weapon (“javelin”) or otherwise, but
    in her right arm then she held a head slightly downwards so as not to hide her
    face.


    Considering the desires of the statue in variety of styles that Winkelmann saw
    coming from the excavations at Herculaneum, he felt the need to classify them.
    It is not surprising that he identified this as a very old statue: Athena’s torso
    is expressionless; her head is in profile; and her active pose seems to be of
    her rigid upright posture. Her face is expressive, though lips are lightly painted,
    perhaps reference to hair which are drilled locks across her forehead (Fig. 5).
    Griffins and a grimy gorgon head adorn mel her ears and a double row of beads
    around her neck (Fig. 5 and Colour Pl. 15). In contrast to the upper arm is forming,
    squinting, and sticking out her small tongue between parted lips, as if she is
    pouring (Fig. 7 and Colour Pl. 16). Today we recognize Athena as an archaic statue,
    combining features that can be assigned to both Archaic and Classical styles.
