  md: '# The iconography of the Athenian abrobates race


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_70_0.png)


    First, reading the Parthenon''s pediment as an abrobates competition helps confirm
    that the scene shown was, in fact, a *race*. The bibliography on this problem
    is vast, but in her 1984 article Judith Binder cut through most of it and demonstrated
    that the literary tradition for the contest between Athena and Poseidon clearly
    shows that the contest was about *speed*, a reading that has been recently supported
    by Andrew Stewart and Olga Palagia, among others. The pediment, then, shows a
    mythological competition in which two armies raced to the Acropolis, leap from
    their chariots on foot, then finish the race on foot, then their weapons to claim
    victory. The structural correspondence between all phases of this “original” race
    and the iconography of the abrobates is very close. Indeed, the Haimon group lekythoi
    (Fig. 4) that show Athena throwing the abrobates spear at the end-post no longer
    seem strange.


    A second point in favor of this idea is that it might explain why Nike becomes
    a chari in abrobates scenes from about 430. The development might be directly
    attributed to the influence of the Parthenon on imagery. As shown in the Appendix,
    chariots in abrobates scenes are always male. After the completion of the Parthenon
    sculptures, there is an evolution in the iconography. Nearly all preserved marbles
    of the race from 430 show Nike as the charioteer.


    One of the earliest examples of this change is a relief where Nike enters from
    Olympus in which an abrobates (or it is actually Athena?) back into her galloping
    chariot driven by Nike (Fig. 10). What makes this very important for us is that
    its iconography was influenced by monumental sculpture on the fifth century Acropolis,
    a point made by D. M. Robinson in 1933. The observe of the pots shows a Nike erecting
    a trophy, a motif taken directly, by Robinson pointed out, from the Nike temple.
    If the back


