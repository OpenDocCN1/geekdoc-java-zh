    not unknown at that time, even if there is no evidence for the Pythia or the Olympics.
    The Pelucians also performed and it is depicted already on Attic Geometric vases.⁵54


    Other evidence for the early Panhenaic festivals comes from the topography and
    monuments of the Akropolis. As Wright has written: "Between 575 and 550, the Acropolis,
    which had been for so long the sanctuary of a polianic polis, became a grandiose
    spectacle of the first, the visible expression of a city that was now the first
    in Greece, the place where the Panhenaea were increasingly celebrated and culminated
    in the fifth-century Athens."⁵55 As a sixth-century visitor made his way up the
    wide ramp, confronted the large temple of Athens, Panhenaea got a glimpse of the
    colorful draped olive-wood statue of the goddess, the immense marble decorations,
    and the numerous ceramic offerings which many were prize advisers advertising
    the games at Athens, he could not help but amazed by the revitalized city. Who,
    he wanted, was responsible for this transformation?


    While Praisenistos is often cited as the architect of the Panhenaea, his political
    career began slightly later. In 560 he was the "master and most good-looking man
    in Athens" (Herodotus 6.127). Hippokedes, the seafar, is known for making his
    days in the famous Contest of the Sukors in Sikyon. In spite of his classical
    conduct it is worth noting to what extent he was impressed by the competitions
    conducted by tyrant Klehenes a few years earlier, such that he expanded the local
    Athenian festival with athletic games — and perhaps the spectacle of one hundred
    cattle, as the tyrant had a wrestling none, out for the contestants by building
    a race track (the Contest of the Sukors) and the ‘first’ actions of hieropoi in
    Athens. Both the Contest and the Panhenaic festival are imbued with the same archaic
    spirit, taking their from epic poetry. Both, the atheletes Athletes, demonstrate
    to showcase the best and finest athletes with races and win. That that the Panhenaea
    had second and third prizes is more reminds than the remains of the games held
    at Troy, the Olympics which had only first prizes.


    Like the wedding rhythm "something old, something new, something borrowed..."
    the original Panhenaea had both traditional and novel components. As presented
    in Athens in 566/5, it was already characterized by an interest in display, self-promotion,
    and distinctiveness — aspects it would develop more fully in the centuries to
    come.


