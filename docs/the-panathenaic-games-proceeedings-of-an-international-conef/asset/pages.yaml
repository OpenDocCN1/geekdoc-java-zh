    The festive atmosphere of the Traphone scene is seen not only in the epiphany
    of the goddess Athena (Cl. 3 and Cl. 5), who stands on the roof of the panel to
    supervise the measuring and out of sacred oil, but also by the fact that men carrying
    the olive wreaths that marked as distinguished participants in a great celebration
    (Fig. 1). The youthful Athena, looking calm and feminine, wears a Corinthian helmet
    with cheek-peeks and a tall magnificent figure; in her right hand she holds a
    spear up like a scepter. Her warlike aspect is not emphasized. She has a lion
    with her chin and the aegis and anthropomorphic horn on her breast. Her name (ΑΘΗΝΑ)
    is written in front of her head, with the second A to the right of it being covered
    by the rich finish. In the presence of the Athena on the Acropolis, the Panathenaic
    oil was stored for three years until the next Panathenaia. The verb to apply this
    is ἀμεπορτω.


    The epiphany of the goddess Athena symbolises the symbolic character of the scene
    and identifies the two names Alkimos and Thallon[?] not as peasants or as Athenians,
    but more specifically a special official and his working assistant, in the service
    of the great goddess and the festival, Great Panathenaia which had a religious
    character, and was at the same time a national and popular celebration. The figure
    of the older man is capable of representing the treasures and ‘generic’ honors
    presented in Attic relief documents; the scene of the olive oil poured from the
    transport amphora into the Type B and shows clear depiction of the oil in the
    presence of Athena on the Acropolis, where Panathenaic oil was stored. The verb
    to apply is what Aristotle uses to describe the measuring of the Games: “The treasures
    keep the olive oil stored at the Panathenaia, the athletes in their turn measure
    it out and deliver to the victorious athletes; that is, to the winners of gymnastic
    and equestrian contests as a prize according to the order of process by law.”
    We exclude the possibility that Alkimos, most probably a citizen of the Euymon
    (in the region of Athens), was one of the tamiai or athletai of Athens in the
    period 428–80 B.C. and the amphora bears his commemorative name in its original
    form.


