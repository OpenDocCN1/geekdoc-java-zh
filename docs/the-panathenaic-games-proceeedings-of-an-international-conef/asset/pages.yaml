  md: '# The iconography of the Athenian aprobates


    important, the consistency of the white end-post – all indicate that Athens is
    shown in guise of an aprobans, a point Beazley already noted.


    A comparison of these two lekynoi, in the Hermitage, provides an interesting glimpse
    into the race – Athens''s position in it – conceptualized at the beginning of
    the fifth century (Figures 3–4). Both lekynoi are standard examples of the Haimon
    Group''s representation of the subject – although it should show that Athens is
    presented running in the opposite position, perhaps turning the corner for her
    final lap. Both vessels show aprobans running beside their chariots in full –
    the hoplite with his helmet and shield, Athens with her spear and aegis – and
    most importantly, show the end-post serves as the indicator that we are, in fact,
    looking at a race. Indeed, the basic iconic pattern of the Haimon Group is likely
    to the Copenhagen enigma mentioned above (Fig. 2), that in 1931 Christian Blumenberg
    suggests that the aprobans with Athens might represent the “founding” of the race
    and the Panathenaic games. While this indicates us, at least says that by the
    beginning of the fifth century there would have been nothing about such an Athens.


    In helping confirm Athens'' status as an aprobans, the Haimon group offers other
    points of interest. The preliminary catalogue in the Appendix is offered here
    as a small step towards a more comprehensive picture of this image. As it turns
    out, the Haimon Group''s seams may shed light on several questions that have remained
    clouded about the nature of the aprobans.


    One of the most famous problems with the study of the race is the reconstruction
    of the event itself. This problem stems from a conflict between the definition
    of the event given by the lexicographers and that of Dionysius of Haimonnarkos.
    For the lexicographers, the team consists of a charioteer, and aprobans who ran
    the race in and out of his chariot. No information is given as to how the race
    is finished. For Dionysius of Haimonnarkos the aprobans race is described in fourth
    century (who notes three century historian Fubius Basilius) as being practised
    in fourth century, possibly, by dismounting from the chariot and running finally
    to the finish line.


    Since both sources describe phases of the race, it is hard to locate the specific
    contradiction, or that this elaborate could easily have a combination of mounting,
    dismounting and a frantic finish sprint. This reconstruction is supported by the
    literature. In Demosthenes description of the aprobans race (60.25), the event,
    is said to provide the most highly spectacular spectacle and to consist of the
    greatest number and the greatest variety of athletic feats. In other words, the
    fourth-century race was partly the


    ¹² Lindos, 641. What has been discussed so far is the fact that there seems to
    be no trace of the standard explanation for the origins of the race – note that
    it is presented running in Homeric – in sixth and fifth century before. This raises
    an interesting question: while there is doubt that the aprobans race was anachronistic
    in terms of sixth and fifth century – and that this does not mean that its historical
    reality is specifically tied to the Panathenaic games of that century? If the
    aprobans race was earlier, then why is it said that the satellites and networks
    were out to the south of the Mediterranean? (For this, see Smych supra n. 2) and
    Neels supra n. 620). See ¹³ H. R. Goette, the material of a Homeric origin is
    shown by the presence of this spectacle game given the Greek world, or at the
    very level, the major Panhellenic starts. And yet there is no evidence for this.
    It might be possible that the race had something in common, which explains our
    inability to trace the origins of the event? This is what the aprobans, possibly
    Persillyym, presented the race and its specifically Athenian energy in the sixth
    century as a separate and distinct the Athenians from the other Panhellenic feats
    with the Panathenaea.


    ¹⁴ While these remarks are based on the study of large numbers of vases (see Appendix),
    they must be seen as primary. Further study of the Haimon aprobans imagery and
    context might yield much more interest (and more complex) results. Smychez (supra
    n. 2) 112–116 and Shear (supra n. 2) 52 give preliminary discussions of the problematic
    problems.


    ¹⁵ N. B. Crowther, JJS 111, 1991, 75; Müller (supra n. 6) 57–63; N. Reed, More
    Than Just a Game: The Military of Greek Athens, Clarendon (1988), 18–44.


    ¹⁶ E. N. Granger, Greek Athletic Sports and Festivals (1910) 238. Neels (supra
    n. 6) 138 and S. G. Miller, Ancient Greek Athletics (2004) 143 not just a similar
    reconstruction of the event.


    ¹⁷ See (supra n. 13) on the page.'
