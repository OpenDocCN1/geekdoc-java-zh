  md: '# A unique depiction of a Panthenaic victor


    John O Paisley


    In the *Archaeologischer Anweiser* 1991 Panos Valamis made the significant observation
    that there is no known depiction of a Panthenaic amphora that can be connected
    with the proclamation or honoring of a Panthenaic victor.^1 He went on later to
    suggest that very likely the prize amphora were not given to the victor at the
    same time as the other official prizes of the state (wreaths, small olive branches,
    palm branches, and taenia). In I present here, which sheds new light on this statement
    and question (Figs. 1–4 and Colour Pl. 9).


    The vessel is complete, except for a few small fragments from the foot where it
    has reached by the Musée des Beaux-Arts in 1944, and although unpublished, Ian
    McPhee attributed in 1979 to the Noostell Painter, a minor artist of the lower
    body by whom Beasley attributed four other bell-kraters.^2 The painter takes his
    name from a crater nearby, which was sold at Chelsea London. The three found on
    its reverse match well with the three on the back of Montreal (Fig. 2), and a
    comparison of other details between the two leaves no doubt that McPhee''s attribution
    is correct.^3


    One feature on the Montreal krater is the nature of the band which runs around
    the waist beneath the scene. It is best perceived as a modified leaf and tongue,
    although the tongues have more of the form of an egg than normally at these bell-kraters
    are decorated with a band-having groups of meanders that alternate with pattern
    squares.^ The laurel on the Montreal krater''s rim and the floral pattern with
    superimposed pal underneath the handle on the artist''s kraters, for example in
    Los Angeles.^ These two patterns are similar to the types found on other contemporary
    kraters.


    It is seen on the obverse, which is of great interest. In the center two youths
    stand before a white Doric column by a female figure holding an olive sprig or
    aistos that is painted in white (Colour Pl. 9). An elegant winged Nike, who flies
