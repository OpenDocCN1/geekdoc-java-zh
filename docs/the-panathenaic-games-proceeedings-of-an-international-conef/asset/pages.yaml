  md: '# 80 Martin Benitz


    oinochoai and choes are used only for the different running images, and bell-kraters
    to show the different-celebration scenes.


    The relationship between shape, function and painted image is not always immediately
    apparent. The depictions of victory celebrations on craters – chiefly on the popular
    bell-krater – must be particularly significant. These might be special commissions
    for the celebrations organized by the tribes. This suggestion is supported by
    the appearance of inscriptions naming the team or oinochoai, giving precise indications
    of cult and location.


    The other scenes are reserved for the smaller shapes (cups and oinochoai), probably
    for practical reasons. Palaestra scenes are traditionally depicted on cups, where
    the athletes can easily be seen on the outside, whereas scenes involving many
    participants and complex compositions must be deployed on larger pots.


    The observations made above, the great popularity of the torch race, the special
    commissions for celebrations and the victory memorials highlight the significance
    of this and other tribal contests in the life of the polis. While most of the
    participants and winners of the ‘normal’ gymnastic contests and hippic contests
    were foreigners, the tribal events were a source of civic pride of the Athenians.
    This aspect is underlined by Aristophanes, Frogs 1089 ff., where the merciless
    spectators laugh at a slow runner and beat him up so that he blows out thru and
    drops out quickly.


    The identity of the citizens obviously consolidated the polis structure and was
    politically welcome. As the tribes were created during the Kleisthenic reforms
    in the sixth century, many scholars believe that the torch race was established
    in the years around 500 B.C.⁴³ But there are no depictions of torch races before
    430/270 B.C.C. and all commemorative monuments set up by victorious tribes in
    the Agora and elsewhere are of later date. Therefore, I would prefer the idea
    that tribal events were introduced by Kleisthenes but only became part of the
    official Panathenaic programme in the last third of the fifth century alongside
    other new events like the militaristic hippic contests, which were founded after
    the reform of the Athenian cavalry under Pericles.⁴⁴


    ⁴³ Cf. Neils (supra n. 4) 4); M. Rauch, Nikephoros 11, 1998, 83–106.


    ⁴⁴ Bentz (supra n. 3) 82 f.'
