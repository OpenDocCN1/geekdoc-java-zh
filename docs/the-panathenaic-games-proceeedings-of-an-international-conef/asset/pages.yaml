  md: '# # “Not the vases are easy to interpret..."

    Some thoughts on Panathenic prize amphorae


    Bettina Kratzmüller


    "Not that the vases are easy to interpret...” notes Mark Gold when discussing
    athletic events painted on Greek vases.¹ This quotation can be used for the reverses
    of Panathenic prize amphorae.² The gestures of the competitors are of prime importance,
    because their interpretation affects our understanding of the performance of individual
    contexts.³


    In Attic black- and red-figure vase-paintings of all the athletes'' gestures are
    directly related to the test and the objects used for runners of the short-distance
    footage with stretched arms and dolchers with bent elbows can be distinguished
    from one another to the position of their arms.⁴ Other gestures are required for
    the event but although a needless reading of the scene. Raising a hand—with one
    or two fingers extended—is the best known example, e.g. when a defeated boxer
    or pankration inscribes his apogenein from the context.³


    Other scenes are not easy to interpret, the reverse of an unattributed Panathenic
    prize amphora in Naples (Fig. 1).⁵ Only the pankration inscribed above the scene
    allows a clear interpretation. We see five men, whose bodies take up most of the
    available space. A judge in himation, his arms raised, stands in the middle, flanked
    by pairs of athletes, each pair consisting of a standing and a crouching figure.
    The competitors were sorted by pairs of athletes, and the umpire holds little
    sticks to effect.⁶ Gestures and movements of the other figures in the scene, however,
    are not easily interpreted. Two of the athletes are crouching or kneeling. The
    crouching figure on the left is a space filler, but this does not apply to the
    kneeling figure on the right. His position is significant. Gestures are depicted
    in grey figure or as complaints, representing relief of an alert.⁷ When kneeled
    on votive reliefs of devotion, to the refined sphere.⁸


    Other figures shown could be slaves or servants, of lower status. This interpretation
    applies to the athletes on the Naples; because they are crouching a defeated boxer
    who has “settled down on the knees”⁹ as described in a scholin to Pindar—would
    have given him up if his coach had not got him.


    The crouching of the athlete left part, stretching out his arms, looking up at
    the athlete who has placed


