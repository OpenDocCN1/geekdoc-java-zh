  md: '# # Panathenaic prize amphorae from the Kerameikos:

    # some new aspects and results


    **Norbert Eschchbach**


    Since the inception of excavations at the Kerameikos in the late nineteenth century,
    fragments of Panathenaic prize amphorae have been uncovered with great regularity.¹
    More than 1,600 fragments and over 800 inventory entries are noted so far. Early
    material of the sixth and the first decades of the fifth century B.C. is very
    rare. In addition to the well known amphora PA 443 signed by Hyperides as potter
    (Eucherides potter (500–480 B.C())), only a few preserve traces of painting. In
    the second half of the fifth century the number of PA 192 from the house of theucherides
    of Panathenaic amphorae from the Kerameikos increases steadily; in the fourth
    century the material is very extensive and a relatively large number can be dated
    to the Hellenistic period.


    The excavations of U. Kriglich near the Sacred Gate, in "Building Z," have yielded
    a rich crop of fragments of this type; some inventory entries, around 400 shards,
    have been taken into account. Some of them belong to the fifth century and support
    the stratigraphic dating of the periods Z1 and Z2. By the larger number of shards
    dated to the second half of the fourth century it is connected with the periods
    Z3 and Z4 of the fourth.²


    A selection of five Panathenaic amphora the nine largest groups of shards from
    this material, with 200 fragments altogether, is presented here, because of the
    special light they throw on the three decades of the fourth century. Some of them
    have been found over the excavation area, but most from layers which could be
    dated independently from the amphora. None of the fragments between 325–310 B.C.;
    most belong to higher levels (3c, 4) whose time frame reaches the beginning of
    the third century (not later than 290 B.C.)³


    **1. PA 67 and PA 648.** 41 fragments can be accounted for both sides of the Panathenaic
    amphora (PA 647) from the below mentioned contexts (1, 3–6). Large shards of the
    part of the Athenian


