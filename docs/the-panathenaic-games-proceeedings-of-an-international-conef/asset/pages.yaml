  md: '# Panahenaic prizes and dedications


    A second dedication to the Kallias of Sidon, by Dionysimus. The preceding inscription
    (no. 10), probably an earlier monument destroyed by the Persians. The victory
    of the Kallias at Olympia is reckoned to have taken place in 472/1 B.C. (Paus.
    5.9.3 and 6.6.1).⁸¹


    Base of a dedication by Pronas, for his sisters, for the victories at the Nemean
    and the Isthmian games, as well as at the Panhenaic. It probably bears a bronze
    quadrigma.⁸²


    # Further observations


    It is evident that the Geometric-arch victors in the games dedicating prizes were
    cauldrons during the sixth and fifth centuries B.C., even in the case of Panhenaic
    victors, who did not dedicate clay Panhenaic ancestors, despite the prevailing
    view. Of special interest is that many dedications, which are not directly related
    to the Panhenaic, such as owls, sphinxes, koroi, korai, dedications of horses,
    dogs, lions, and stood on columns or colellae.⁸³ only appears on columns of Panhenaic
    ancestors (Agora P 24661).⁸⁴ The type of high pedestal and column modern seems
    to have been introduced by Athenians to artists like Ariston and Endos, the Naxian
    ships at Delphi being the most prominent example.⁸⁵


    Ludwig Reich was the first to take an interest in volume columns as part of his
    work on the Athenian Acropolis in 1841.⁸⁶ The colossal he found were the columns
    depicted on the Panhenaic ancestors on either side of Athens. Procomachos, an
    imagographic feature which led him to claim that kind of column may have housed
    sacred sanctuaries as the well-known marble owl of the Acropolis, which may have
    been out of open for a long time, since its surface is heavily weathered. Reich''s
    interpretation seems although, however, it is also possible that this owl functioned
    as temple anchor.⁸⁷ The owl, its known relation to the goddess of Athena, was,
    according to the Suda (s.v.): «ητρίς γλαύκ λέως εἰς στατου εβόλον ἐμβόλοις».⁸⁸


    What, the significance of columns is, that athena appear almost exclusively down
    to the end of the fifth century B.C.? "The columns are as symbols of the fighting
    spirit," suggested John Beasley in 1951, and to no reason to disagree with him
    he said.⁸⁹, however, that "the columns refer to Athens'' sisters, but they are
    possible that they also support the columns."⁸¹⁰ The article makes a memorial
    proposal for understanding columns, supported by all the relevant studies on the
    subject in which columns by general agreement indicate sacred ground, the constitutive
    or selective representation of sacred buildings or precincts, as pro toto. They
    constitute symbols of divinity and sacred space. They define the area of manifestation
    by the divinity and the performance of a ritual act. As the columns of the Panhenaic
    ancestors they also indicate the sanctity of the goddess on the rock


