  md: '# # Games at the lesser Panathenaia?


    Stephen V. Tracy


    We know very little about the lesser Panathenaia. By comparison, the greater or
    penteteric Panathenaic festival is reasonably well-known. Recent work by Jennifer
    Neils, Christian Habicht, Stephen Tracy and Julia Shear has contributed much to
    our understanding of the agonistic program of the festival.¹


    The complete athletic program at the lesser Panathenaia has been reconstructed
    based on the inscriptions.² The program lasted at least ten days and was held
    at different sites. The non-equestrian events took place in the stadium: equestrian
    displays of a quasi-military character featuring the Athenian cavalry and robe
    the amphorae. The racecourse in the Agora. The hippodrome was the venue for the
    thoroughbred horse races and chariot races.


    The victor lists of the Hellenistic period record the winners in the events that
    received prizes, and the equestrian events too. The festival included much else.
    Aristotle in section 60 of his treatise on the Athenian constitution gives an
    invaluable count of the duties of the *athletai*. They served for four years.
    Their main duties were to organise the great procession, the music competition,
    the gymnic competition, and to distribute the oil to the athletai. In anticipation
    of the games they arranged for the preparation of the sacred robe and the amphora.
    Aristotle adds that the prizes for the winners in music were gold and silver,
    shields for the winners in *eummonia* (‘manliness’), and crowns for the winners
    in the gymnic and equestrian events.


    The winners are listed by category: music, gymnastics Boys, youths, and men, and
    finally the equestrian competition. The major events were undoubtedly held in
    this year. IG II 2311 (here p. 118), an early-century list of prizes, records
    the prizes for the competitions of three.³ These lavish competitions probably
    came near the close of the festival and some may have occurred at the all-night
    celebration.


    What is very striking when one considers the degree to which the Athenians arranged
    the games to go as far into many parts that were for Athenians? The musical and
    gymnic competitions were to begin, but the beginning and end of the equestrian
    competition was open to Athenians or at the tribes, the cavalry display also known
    as the *anthipastia*, and the torch race. These would have appeared the most partly
    foreign, though others may have enjoyed them or at least an interest out curiosity
    or pennies. The Athenians then combined in the greater Panathenaia panhellenic
    aspirations and local pride. The cash value of the prizes they offered was considerable
    and so acted as a drawing card to bring foreign competitors who probably found
    the local character of such competitions, even a bit chaotic. After all, the four-crowning
    games, the Pythian, Neme, and Olympic games were truly panhellenic with all competitions.


