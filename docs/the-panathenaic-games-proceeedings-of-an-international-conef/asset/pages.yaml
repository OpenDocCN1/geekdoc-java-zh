  md: '# Δέσπονα Τσουκίδου


    επιγραφές, η ύρξη του όπως πως ελλείπουν τμήματα του αγείου δεν μπορεί να αποκλεισθεί.


    # Η χρονολογία του αγίου


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_114_0.png)


    Για την χρονολογία του αγίου πιο ενδιαφέροντα στοιχεία παρουσιάζται τόσο το σήμα
    όσο και η διακοσμή του, στην περιοχή του λαίου, μια μεταξύ των λαβών δακτύλων,
    οποίί χαρίζται πρωτότατα σίο αιολάκα, εξεκολουθεί παραμένουν σε μέρη σηγχους χωρίς
    χρόνος να εμπορεί την ύψωση σχεδόν (από το δρότερο σημείο μετά του 10ου αι.Χ.)⁹
    α αφορίες ή οι αφορίες προσορίζονται ρωμαϊακά.¹10 Όσο προς το σήμα είναι γενή,
    σημειώνουμε αυτά τις βάρίες σε άλλους υστερους παναναναϊκών αφορών ανάλογες;¹11
    η σπάνης ολόκληρων παναναϊϊκών αφορικών ή αφορών το σήμα μπορεί με βεβαίτητα να
    αποκαταστήσει επέτρέπε τη διάγνση μια γενικής εξέλιξης του σχήματός του.


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_114_1.png)


    Όσο προς τη διακοσμή του αγίου, στην περιοχή του λαίου τα σημαματοποιημένα φύλλα
    που υπάρχουν υποκατεθερωτών αυθεμίου του ανθρώπου στον χρόνο των παναναϊϊκών αφορίας
    του 2ου μ.Χ.¹¹12 Η παρουσία τωνλογχητών φύλλων αντί για των γλώσσων μετά την μεταπή
    στην πίσω από αυτόιο αποτελεί καναίπομο που απορρεί το αγίο παίγμαμα για τα παναναϊϊκών
    αφορίας διακοσμήματα όπως όπως είναι οι γλώσσα¹¹³ Και το δοσιομένο ύλο λέκων παναναϊϊκών
    αφορών, η συντήξη των εικονομικών μορφών από κονλάτου της Λωνδίδ αφεφορά Ρ8522
    από την Αγία, του προγράμμου 2ου αι.Χ., και στον επίσλικ παναναϊϊκά αφεφορά του
    Πααισμήρου, το μέσου του ίδιου λαίου, δείχνει την περιοχή του ζωγράφου μας ως
    «φυσιοκοπτωτική» - μέτρα μετά της αιεροσγοίας στην ελληνική περιοχή - αντίλληψη
    με την εικονογραφία του γενιών (3, 4, 9).¹¹⁴ Έτα, η απόδοση των πτευσών που δεν
    διπνυθούν είναι π.χ. η χρολογία του και διακοσμησης του. Παραστατική είναι η παραβολή
    του κοσμένου μέρους της Λιλίας του αγίου που έχουμε. Το σίμα του αγίου είναι το
    σχήμα μετά την αφεφορά Ρ8522 και μετά την αφεφορά του Πααισμήρου, όσο και του
    μουσικού


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_114_2.png)


    +   ⁸ Το χρονολογικό αντικείμενο προϋγεται απόρυθτικό άκομο που υπόκειται μελέτη
    της


