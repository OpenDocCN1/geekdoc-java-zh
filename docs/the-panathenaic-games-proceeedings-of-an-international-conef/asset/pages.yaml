  md: '# Δραματικοί αγώνες και αρχιτεκτονική στη νότια κ κλιτού της Ακρόπολεως


    # Πάνος Βαλαβάνης


    Abstract

    The new viewers’ lists published by Tracy and Habicht triggered the suggestion
    put forward in this paper that the Stoa of Eumenes II and the Hellenistic stage
    of the Theatre of Dionysus in Athens formed part of a single building project,
    initiated by the king in order to celebrate the introduction of dramatic games
    at the Panathenaia, there it must have enhanced the social use described of the
    city. Its construction in the period 178–63 B.C. The type and location of the
    Stoa are attributed to Eumenes himself, inspired by Pergamene practice. The Stoa
    was not put to the limit described by Vitruvius by the terrace of 5,000 m² spreading
    before into a monumental public space. The Hellenistic stage of the Theatre of
    Dionysus may have been due to Eumenes’ generosity because of his well-known intent
    in the god and in drama, and to his aim to associate Pergamon with Athens. The
    viewers’ lists, naming representatives of all branches of Hellenistic royalty,
    are provided as evidence of the prestige and the Athenians'' ability to exploit
    their city’s advantage, as a source of income and gifts. The Panathenaic provided
    the opportunity for peaceful encounters among highly competitive Hellenistic rulers;
    their political significance on the international scene of the second century
    B.C. is comparable to that of the Olympic Games.


    Εισαγωγή

    Η δημιουργωση από τους τάχ S. V. Tracy και Χ. Habicht με μεγάλη επιφυγή για τους
    τρεις καταλογμούς ποιών των Παναθηναϊών του 170, του 166 και του 162 π.Χ. προσφερε
    ένα νέο κεφάλλλο στην ιστορία των Παναθηναϊών κατά του ελληνικού χρόνου. Προκειται
    για την αναφορά διευξγής δραματικών αγώνων στην Παναθεναϊα, στη οποία συώτούν
    αποσασματικά της τρίτης στίλης της διήωσης αναιτή οποία αναφέρε στο 162 π.Χ.


    Απόταν παλά χρόνια, γεγονότι από τις εκχλώσεις των Παναθηναϊίων ύστερα χρόνια
    και οι δραματικοί αγώνες.² Όμως η εισαγωγή των ποιοδοχοίων στους μαϊς χρόρους,
    με αφορμή την έρενη του 1ου α.μ. που αναφέρει ότι οι αγώνες και οι τραγωδίες Παναθηναία
    άκαδα¹³


