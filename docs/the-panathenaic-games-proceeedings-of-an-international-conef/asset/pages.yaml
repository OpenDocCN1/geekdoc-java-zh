    The prizes for all these had, no doubt, money the Mediterranean. This is true
    for the olive oil: the athletes competed for the oil, not the containers.46 This
    valuable liquid had to be sold soon as possible, before it became rancid. Three
    years is the longest time that olive oil can be kept and remained ''edible''.
    Its quality and consequently its value falls below this limit.


    The musical competitions in the Panathenia, which displayed the artistic ability
    and talent of competitors, were more highly regarded than the athletic contests.47
    In singing Homerically, not only the first but also the third, received prizes
    of the highest value. In singing the kithara, the first prize was a crown of olive
    leaves worth 1000 drachmas in addition to 500 silver drachmas.48 This competition
    included a prize for the first-winner. A bull valued at the price was awarded
