  md: '# # Panathenaic Amphoras


    #  Michalis Tiverios


    Panathenaic amphoras make up one of the most characteristic and distinct groups
    of Attic pottery. They are usually about 0.60-0.65 m in height and of a maximum
    diameter of about 0.40 m. They contained the sacred olive oil, offered as prize
    to victors at the Panathenaia, the greatest festival of ancient Athens (Figs.
    1-2).¹ We have enough to say that a study of the thousand-year history of these
    vases illuminates an important part of the history of the Panathenaia. The earliest
    are dated to slightly before 560 B.C., while the latest are dated to the early
    fourth century A.D. Thus it is not too much to say that it is generally accepted
    that when the literary sources mention the re-organization of the Panathenaia
    in 566/5 B.C., what they imply is the foundation of the Great Panathenaia, with
    which Panathenaic amphoras are directly associated. It was then, with the introduction
    of athletic competitions, olive oil was instituted as a prize for the victors
    and this led to the manufacture of Panathenaic vases.³ This conclusion is supported
    by the fact that the earliest surviving amphoras, one by the potter Nikias, in
    the


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_5_0.png)


    Fig. 1-2. Panathenaic prize amphoras. London, British Museum B 134 and B 130.
    Photos after M. Benz, AntK Beih. 18 (1998) pls. 17 (right) and 1 (right).


    ¹ For the dimensions of Panathenaic amphoras, the height of which occasionally
    exceeds 0.80 m. (without their lids), see M. Benz, *Panathenaische Preamphora*,
    AntK Beih. 18 (1998) ff., 200 (Anhang 2), 202 f. (Anhang 4-6).

    ² For Archaic and Classical Panathenaic vases, see the highly detailed monograph
    by Benz (supra n. 1)

    ³ Literary sources on the foundation of the Great Panathenaia: J. L. Shear, “Polis
    and Panathenaia” (Diss. University of Pennsylvania, 2001) 505 ff. Sources dealing
    with the foundations of the Panathenaic festival: Shear, 31 ff., Shear, 962 ff.,
    and 1133 ff.,, which also collects literary and epigraphical sources on the Panathenaic
    festival.'
