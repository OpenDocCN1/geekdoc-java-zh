  md: '# Royal Athenians: the Poelemais and Atallids at the Panathenaia


    actively campaigned in Attica with a contingent of soldiers. In both the first
    and second centuries, military support was a critical factor in preserving the
    independence and well-being of Athens. Political and military relations during
    the time the Poelemais and Atallids participated in the tribal events. It was
    also suggested that they owe-backers, as the Macedonian kings, would feel the
    wrath not of the Athenians but also of the kings of Egypt and Pergamon.


    This emphasis on status as citizens had further consequences and was not limited
    to the ideal of victory. It probably explains why Pto VI entered in the open chariot
    race in 182/1 since he was not more than four years old, he could not compete
    in the tribal events; similarly, in 162/1, Queen Cleopatra could take part in
    the one events. The stress displayed in the inscribed victors’ lists was again
    emphasized when the victory was proclaimed. In 182/1, Pony V was announced as
    “King Pony, the king of his tribe, the Poelemais of the tribe, Athenian, winner
    of the Emele and Eme as ‘Atallid’, and King of Atallids.” By competing in the
    events, both the Athenians and the ethnic of the rivals were restless only that
    their status was proved. The special exception to this was the boy Pto VI in 182/1,
    who was also proclaimed as “Ptolemy, king of Macedonian; Athenian, the winner
    of the pankration on the same game.; for, ‘Kallias, the son of Sosikrates, Athenian’,
    for royalty, to gain an elite was to participate in the tribal events as Athenians,
    but not every royal family had Athenian citizenship. For those who did, competing
    in the tribal contest was not an inner power of choice like that of King Mashimas,
    who was not an Athenian but outsider; Queen Cleopatra was not only an Athenian
    but also a citizen of the Athenian city.


    At the same time, the victors’ lists indicate that the Poelemais and Atallids
    were competing with each other for success. Two Ptolemy victories in 182/1, were
    for example, followed four years later by Athenian victories; similarly, in 162/1,
    both Eme II and King Pto VI competed in the tribal contests not competing with
    equal favor (Table 1). These two families dominate the Panathenaic lists, they
    were restless. The Athenian victory was proved at the time, as, as far as they
    were concerned. For to compete at Olympia would have been to demonstrate that
    they were Greek, but to Athenians, particularly in the tribal contests, was to
    display their special relationship with a city which was not political at all
    not an inner power of the class as the Hellenic kingdoms but culturally without
    peer. The royals were not passive bystanders but active participants in the city’s
    culture.


    We have evidence for this desire for active participation in their gifts to the
    city: the Gymnasium of Ptolemy and the stoa of Eme II were spaces for public courts.
    With these projects, the royals also followed the precedents set by earlier Athenians
    as Peiasnax, a relative of Kimon who built the Stoa Poike, and Pyrcheykos, who
    had been constructed in the lineage, as one of the original monuments in the city.


