  md: '# Panathenaic prizes and dedications


    Petros Themelis


    # The prizes


    A red-figure Type B Attic amphora (Figs. 1–3; here pp. 12–14, Figs. 15–19 and
    Colour Pls. 3–5) with a scene related to the olive oil for the Panathenaia Olga
    Palagiu to my attention is the main subject of my paper. The amphora was found
    on the estate of J. Gerolanos at Trachones, in the Attic deme Euonymon. It was
    kept in the private collection of the Gerolanos family (inv. no.1034) until 1987,
    when it was removed to the Piraeus Museum, where it is now exhibited (new inv.
    no. 7341). The type was known to Sir John Beadley, c. 420–410 B.C.¹It was published
    by Joseph Fink in 1963.³ It receives brief mention and is well illustrated in
    a recent book about the Piraeus Museum sponsored by the Marina Latis Foundation⁴.


    The amphora was broken in several pieces and mended in antiquity using a number
    of leads, which were pressed on the body, the neck and the base.⁵ Part of the
    belly on the right side of the back was restored with plaster of Paris after its
    discovery by J. Gerolanos. The fact that it was repaired extensively in antiquity
    using exquisite kinds of leads indicates that it was an object of high symbolic
    value for its owner (and patron?) and, though longer in use, it must have been
    kept in his owner''s house after its repair, or as long as the owner was still
    alive.


    The scene on the front of the amphora (Fig. 1; here pp. 12, 15 and Colour Pl.
    3) is of particular importance to our discussion and consequently deserves detailed
    description


