  md: '# Athens and Herculaneum: the case of the Panathenaic Athenas


    On Panathenaic amphorae of all periods, Athena maintains her archaic character.
    She wields a spear and carries a shield extended in front of her as if she is
    on the attack, one foot out front of the other. At the same time, and in an apparent
    contradiction, she maintains an upright position. This Athena has no adversary;
    and for the vertical stance relieves the composition of the need for another.
    The Panathenaic Athena also conveys a political message: she is aggressive and
    unchallenged, and takes place of battle.


    The armed attacking Athena appears as a bronze statue in Athens and during the
    Archaic period. When striding forward, she fits the Parthenaic type. The ones
    that stand upright are likely to be the precursors of the colossal and standing
    Bronze Athena Phidias created for the Acropolis, that was financed from the spoils
    of the Persian defeat at Marathon (P 128.2). This famous image that stood on the
    Acropolis was later given the title of Promachos (Warilike), because Phidias was
    after, a moment honoring the Athenians'' victory over the Persians. She was armed
    like the other Athena, but was never described as being old-fashioned in style,
    or as striding forward. In others, Phidias'' Bronze Athena of the 450 B.C. must
    have been Classical in style, and the traditional Panathenaic Athena, who were
    engaged in dance and Archaic


    The archaic striding Athena from the Villa dei Papiri at Herculaneum is about
    2 meters tall, and she is one of more than twenty-five and thirty bronzes that
    have been recovered to that date of findery. Nearly all of them were found in
    the eighteenth-century Bourbon excavations, most of the marbles retrieved from
    this Roman collection were in excellent condition, and, if they were broken, the
    pieces were reattached, with exception of one statue''s head, which was lost (M.
