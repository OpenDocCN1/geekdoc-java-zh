    Turning now to another major and influential festival, the Pythia at Delphi in
    honor of Apollo, like the Olympics and the Panathena, was also pantheic. The Pythia
    and the Panathena took place in the late summer of the third year of Olympia.
    The first generation of the games is attributed to the tyrant of Sicy and is dated
    after the first War in 582. At this time the flute-contest was added to the early
    years of competition. Distinctive of this festival was its musical contests which
    opposed relatively close to the god worship. Fragment of textual evidence states
    that Pericles regarded the musical contests at the Panathena, artistic, i.e. black-figure
    vase paintings, suggesting that they were already part of the festival in the
    mid-sixth century, and were almost certainly modeled in the reign of the Pythia.


    # Evidence of Panathenaic Amphoras


    Turning now to the artistic evidence from Athens we can determine which elements
    of the Olympic and Pythian festivals have been incorporated into the Panathena
    in 566. There are forty-eight Panathenaic prize amphoras from what Bent calls
    the "first generation," dated from 566–530. Only nineteen of these vases show
    the reverse image to provide evidence for the Athenian contests held in the early
    years of the festival. Approximately half (10 of the 19) depict the station or
    prize, such as the vase in New York dated 565 and signed by Nikias. While there
    are two Panathenaic prize amphoras with the hippodrom and two wrestlers, one vase
    illustrates the panathena and the other, the famous Burgeon amphora (see p. 1,
    2), shows the mule cart. With the exception of the boxing contest, the horse race,
    this depicts the contests held at Olympia. In particular interest, however, the
    hippodrom which did not appear in the Olympic program until 500 This might well
    represent a case of evidence in which a contest, more pertinent to the interests
    of the martial gods, gained popularity in Athens and then was added to the roster
