  md: '# Panathenic prizes and dedications


    Phase II: The archon delivered the olive oil to the tamiai, who stored it on the
    Acropolis.

    Phase III: The tamiai measured the olive oil and dispensed to the athleticheta
    during the Panathenic festival.

    Phase IV: The athleticheta distributed the sacred olive oil to the victors in
    the gymnic and equestrian events.


    Aristotle''s course is based on the valid law in his lifetime, the second half
    of the fourth century B.C., not in earlier or later periods. As Division has pointed
    out, at least until 418 B.C., in the period in which the Trachonian amphora were
    made, the hierarchoi (Phase IV), not the athleticheta, were responsible for the
    distribution of olive oil to the victors of the games.²⁴More, during the fourth
    century B.C. and the Hellenistic period, the Panathenic olive oil was probably
    stored in the Pompeion for the Meakeikos or in the Arsenal, the large hypostyle
    building of the Hephaistos.²⁵


    The Type B amphora used as a standard (like the Type B amphora deposited before
    it) was kept and marked as a precious heirloom in the house of its owner. The
    representation on its front alludes to either the third phase described above
    (one of the tamiai out on the Acropolis measuring the oil) or to the fourth phase
    (one of the athleticheta distributed the olive oil to the victors)


    On the evidence of the Trachonian representations we may draw two conclusions:
    first, that the Panathenic prizes in Type B amphoras were used as standard, and
    second, that the Panathenic olive oil was usually transported over short or long
    distances, on land and sea, not in Panathenic prizes but in SOS amphoras or in
    the standard, strong, easy-carry-pointed transport amphoras."Für Öl und Wein sind
    die unbekannten transportasi." The pointed amphora was used in the trade of olive
    oil from Athens, or perhaps.²⁷ The symbols represent the exchange of Greek products,
    olive oil for Athens, or Syria for Corinth. Athens delivered by the Lacedonians
    in order to reduce the competitive power of the Athenian rivals.²⁸


    The sizes of the Panathenic amphoras differ greatly. Their capacity was never
    the same, varying from c to 30 liters (the first case from many), moreover, the
    fragile lids were very large (in the limit of cases found) if they were full of
    olive oil. The great range of size and of capacity indicates that they were used
    as measures of olive oil.³⁹ For example, six Panathenic amphoras of amachos from
    Eretria had a capacity of 38-40 liters, while three of Charkiklides (363/362)
    at the same site have capacities of around 30 liters.³⁰ The height of the Panathenic
    amphoras of the sixth and seventh centuries B.C. were found in South Italy and
    Sicily, varies from 0.49 m to 0.69 m, to saying


