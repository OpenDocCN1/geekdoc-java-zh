    His head is turned, his mouth open, and his left hand rests up upon his hip. The
    painter became confused because his right hand overlaps the other''s left hand,
    which at first glance appears to be an object that the youth on the left is most
    likely part of the other chlamys. This is not the only part that the victor is
    depicted, for the rest of the body column has the chlamys.


