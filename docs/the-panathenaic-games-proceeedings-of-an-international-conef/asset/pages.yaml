    (336/5 B.C.) (B 608) with the last representation of this race moving to left,
    the painter twisted the shields to uncover the muscular bodies. Thereafter the
    athletes run to right. At first they still carry their shields in profile, perhaps
    in order to exhibit their devices.²⁵ On our later amphora from the Kerameikos
    this awkward posture has been abandoned to the rendering of the bodies has become
