    Classical, the pudgy snake-free type of gorgoneid derives from the fourth century,
    and the dress is a variation on the Archaic style.


    The Herculaneum Athena is usually described as being of the Promachos type, but
    she cannot be, because statue was not archaic, whereas the Panathenaic Athena
    is. It is interesting that the Panathenaic Athena appears on coins minted by Ptolemy
    I (d. 283/2), by Pyrrhos (319–272 B.C.), by Demetrios Poliorketes (337–282 B.C.),
    and by Antigon Gonatas (320–239 B.C.), all of whom had the herms at one time with
    Athena. And portraits of at least two of these individuals have been identified
    among the herms that were found in the Villa dei Papiri.


