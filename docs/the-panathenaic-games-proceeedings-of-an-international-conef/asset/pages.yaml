  md: '# The dedications


    Unlike the Olympic victor lists, not of Paetheanic victors has survived into our
    time. This circumstance, we know the names of certain victors, the dedications
    they made or, rather, thanks to the Paetheanic dedicatory inscriptions, which
    come primarily from the Athenian Acropolis. Of interest to us are certainly not
    the names of the victors, but the type of dedications made by Paetheanic victims.
    For these dedications, very little data are preserved. Information drawn from
    Raubitsch''s Dedications from the Athenian Acropolis, which is rich in information
    and from Catherine Keeseling''s work, The Stotives of the Athenaea.


    +   1. Member of the family of the Alkmionidae, perhaps by some Iason and I of
    Megacles, it was a bronze tripod or chariot on the Acropolis ca. 550–540 B.C.,
    with another unknown dedication (perhaps Kleos or Aixolos) named (IG I 97;; 622).
    The2 took place after a victory in the pentathlon and in an ancient contest, most
    likely in the Great Panathena.

    2. Dedication for a victor in a chariot race, by some Alkmionid and his chariot
    Knop[pois], from the Poiteia.

    3. Base for a tripod (?), the dedication at Poiteia in Boeotia, by Peisistratos,
    520–514 B.C., after a victory perhaps connected with the Panathena. The dedication,
    however, was politically motivated, aiming for the dedication of the Alkmion family
    in the same century (no. 1).

    4. Dedication of an unknown victor in the foot race, perhaps by the Panathena,
    dated to the first half of the century B.C.

    5. The three dedications by Chiton and Philon, sons of Areos, perhaps refer to
    heroic victories in the Panathena of the fifth century B.C.

    6. Following his victory in the Panathena of 500 B.C., the chitairo Alkleos dedicated
    a tripod, the inscribed base of Statphis (rather than Opistillos).

    7. An inscribed base with flutes, for a tripod than a statue of Athens. Dedication
    of the chitairophis (IG I 763; 629). A second dedication by Kalon, for victory
    in the Panathena of ca. 500 B.C.

    8. Fragments of the base, shaft and column of a monument of Kallimach (IG I 781;
    639) shortly after 490 B.C. Evelyn argues that Harrison made the dedication in
    the Panathena of 490, as he had assumed, but that the monument was renewed and
    erected after his death.

    9. Kallias, son of Hippon, as lakokletes (“pit-rich”) of the Kleon clan, who was
    daedalus of Athens, dedicated a bronze statue on the Acropolis as a boy in the
    fifth-century B.C. in consequence of his athletic victory, probably in the Panathena
    of ca. 480 B.C.

    10. Fragment of a ritual base for a statue of Kallias, son of Dionysymos, as IG
    I 826; 6338–6422), who was victorious, probably of 482 B.C. It is uncertain whether
    the so-called Krit Boy is connected with him, although the dating and finpost
    do not exclude the association.

