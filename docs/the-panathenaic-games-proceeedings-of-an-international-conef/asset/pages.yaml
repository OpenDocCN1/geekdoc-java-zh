  md: 'Η ιδαιτερη αυτή σχέξης οδήγησε στην σκιπή ότι ένας βασιάς μπορούσε να έχει
    χρηματοποιήσει και την κατασκευή της ελληνικής σκηνής του θεάτρου, την περίοδο
    του κατασκευασίας και τη στοά που φέρα το όνομά της. Ένα άλλο στοιχείο που να
    ενιστεί στην απόδοση της ελληνικής σκηνής στην Ευμένη είναι ένα τόσο βαθύ δρίσκολο
    που να αντέχαν την άδημηία οικονομικού του αιναϊκού κράτους, την εποχή που δεν
    είταν ήνθρα. Εναι και γγωστό, ότι όλα στην Αθήνα του 2ου αι.χ. ήταν αποδοτικά,
    στο πλαίσιο της πολιτιστικής πόλης.¹


    Παρα το γεγονός ότι στην ελληνική σκηνή χρησιμοποιήσε β'' αρχή υλικό από την προηγούμεμένη
    λιθοχορηία, αλλά δεν είναι αρχή για να αποποιήσει την κατασκευή της ελληνικής
    σκηνής από τον Ευμενή, μόνοις για τα αφρώματα. Αναζητώντας τα πόντα που του έχει
    εξαστελεί το τουργέργου, της τεχνικής, με βασλασικά χρώματα. Ανεζητώνται πως υπάρχουν
    μια τάση για την ανακομήσει της ελληνικής σκηνής του Διονυσιακού θεάτρου στην
    ίδια περιοχή, με αποτέλεσμα την μετά την εισαγωγή των δραματικών αγώνων στα Παναθηναία.²


    # Το ιστορικό πλαίσιο


    Με βάση τα παραπάνω, μια ανάλυση των επίδράσεών μας δείχνει πως εκφορατικές σχέσεις
    με τη διάθεση που ακολλούθησε την εκτέλεση των αυτών αγώνων. Η Αθήνα, απλωμένη
    με τη βοήθεια των Μακεδόνων και των Ρωμαίων, αππό την αρχή των αγώνων του 2ου
    αι.χ. μ.χ. δεν αναφέρε τον πατωπαϊκό του αίσθημα και την πόλη που είχε επεξελιμένη
    χρήση για τους αυτούς αγώνες, αλλά η Αθήνη και η Παναθηναία. Στην αρχή πλήρρους
    στρατηγικής και οικονομικών δυναάμεων του αιναϊκού κράτους, ζίζει με τις φιλογικές
    αναγραφές, έναν καταλληλό μέσο πολιτικής πρόβληης, για υποθυμίας και αισθητικής
    αλλά σε όλους τους Έλληνες του ηρικού ρόσου της πόλης, του οποίων τα πολιτιστικά
    προγράμματα


    Φαλλίπο ήταν στην αρχή της αναφυγής, των κατακόλων των Παναθηναίων, στον σταθιακή
    διάζευση του προγράμματος, με αύξηση των δημοικών αγώνων.³⁴ Σε κατάραί αυτής της
    αναφυγής, θα έρεπε να ενανταθούν και οι δραματικοί αγώνες, με μεγάλη ιστορία στην
    Αθήνη, που είχε ξεχωρήσει πολλά τη διάρκεια της παλαιότητας. Η ενέργεια της υπηρξης
    απολύτου επιτυπής, αν κρίνοντας και το γεγονός ότι η διάρκεια της διεήγησης παρακολουθεί
    μέχρι και τους αυτοχρικούς αγώνες.²⁵


    # Ευμενμένη'' Β'' και Αθήνα


    Οι σχέσεις της Ευμενής με την Αθήνα είχαν αρχή ήδη από την που ένας ημεραίος αρχής
    και επίκτησαν με την ανάλυσή της.²⁶ Από τότε τον χρόνο της αρχής του αγώνων της
    όδος της Αθην²⁷ και επέρεξε σταθερά όλα να διατιμήσει τη βάση της, όπως οποτού
    από πολλά αιναϊκά αθηγματα που τιμον τον ή συηγεν της. Τάκτική η τάση είναι η
    παρουσία των αιναϊκών στην Αθήνα περίοδο αυτή.


    Από τον γεγονός ότι με την Αθήνα απολυκύριος κύρος από την εμπολική στα Παναθηναία,
    όπως οποίποτε ότι η βάση των ελληνικών αγώνων του βασιλείου της Αττικής Ατλάδης
    αναφέρεται στην Πέργαμο.²⁸ Με στις αναγραφές του 2ου αι.χ., αφορώ άλόγη η


    > ²⁶ Schaft ο.π. (σμμ. 108–111).

    ²⁷ Tracy — Habib, 233. Bartinger ο.π. (σμ. 7) 225.

    ²⁸ Tracy — Habib, 173. Στο ίδιο πλάσιο θα έρεπε να εξαθεί και η ίδρση της γορτής
    των Θεσείων κατά διάστημα 170–160 π.Χ. Β. Habib, 234.

    ²⁹ Tracy — Habib, 199–220, 235, 346.

    ³⁰ παρακά, σελ. 127 και σημ. 3.

    ³¹ Η τάση του 3ου αι.χ. μ.χ. είχε αρχή τη διεξήηση των Παναθηναίων στο Πέργαμο,
    και ο πατέρας της Ευμενής Ατλάδας Α'' έιχε ευγενείς και αναποικιοτήτές της πόλης.
    σελ. Habikti, Bartinger, 234. — Μ. Τίβέρος, Μακεδόνες και Παναθηναία (2000) 50–53.
    Bartinger ο.π. (σμ. 7) 221.

    ³² Λίβος 35.39:1–2.'
