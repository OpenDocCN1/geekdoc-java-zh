    belongs to the greater 323/2, a lesser Athenhenaic year.¹¹² So, there were at
    least some contests among the tribes.


    The most vexing question is whether or not there were athletic competitions for
    individuals associated with the lesser festival. Many the references to winning
    an event at the greater Athenhenaia¹³ or announcing golden crowns at the gymnic
    of the greater⁴ imply the existence of these events at the lesser. This is not
    a conclusion, but only perhaps may be the natural tendency of historical inquiry
    to indulge in fullness


    The complete absence of mention of games or officials in recorded portions of
    the shrines in 30 of IG II 73 confirms to my mind very strong argument against
    there being athletic games with the lesser Athenhenaia. These lines are all but
    fully present and the restorations in them are certain. There is no room for any
    additional officials. There is no mention of the atheletloi, who administered
    the games at the greater Athenhenaia,¹⁴ not of an agorastes. If there were games,
    there had to be officials to oversee them and surely they must have participated
    in the parade and the sacred sacrifice and feast. Moreover there are no mentions
    of the atheletloi who refer to the lesser Athenhenaia; or to the greater festival.¹⁵


    What are we to make of the provision on inscriptions in the late third century
    and continuing into the first of announcing the award of gold crowns at the new
    performances at the city Dionysia and the gymnic games of the Athenhenaia, the
    Eleusinia, and some the Pololeia (city ὀξάνᾶ ρια [εὐρχιαῶν] του Διονυσσαί δου
    ῥτε ἄναων τῶν τρποίων κπολείου Πτολε[η](ο)α(λ) αἰῶν ὀξξάνᾶ Ἰτοκᾶ ἄναων γυμνικῶν
    τρποίων)¹⁶. Since some of these texts were passed in years older than just prior
    to the greater Athenhenaia, they have been taken aside for athletic games of the
    lesser festival.


    But is that necessarily the case? It is all most noteworthy that the earliest
    proclamations of gold crowns at the Athenhenaia that survive specify the it to
    be made at the greater festival.¹⁷ In the two other examples, IG II 45b of the
    year 307/6 and 492/3, the greater Athenhenaia is not specified by the language
    of the decree, but the next greater was to be stipulated. These texts date from
    the years 307/6 to 250. It is quite likely that such announcements, when they
    were made, regularly place at the lesser Athenhenaia.


    Chronologically the text specifies that the proclamation of the award of a gold
    crown at the Athenhenaia, in Agora XVI, dates no between twenty-five years later.
    It was passed in the third year of the Epargos in honor of the philosophical philosopher
    Prytanis of Karystos. Ergochares was most probably during the year 226/5.¹⁸ The
    next festival of the greater Athenhenaia was scheduled for the first month of
    the year 222/1, that is, three or four years later, depending on what is the correct
    year for Epargos). Archonship not whether there has been a chance in phrase and
    that this proclamation was to be so long or was made at the lesser festival and
    therefore that there were gymnic games at the annual Athenhenaia?


