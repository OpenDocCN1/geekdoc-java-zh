    the altar old, white-haired and bearded man with lifted head and open mouths seems
    to proclaim the victor. On the right a member of the winning team wears the same
    crown with alternating high and low spikes, and on the left a member of a losing
    team leaves the scene. On the crown of the winner is written Antioch...; regardless
    of the ending of the inscription, the most likely explanation is that the bearded
    figure is Antiochos, eponymous hero of the Antioch tribe. The painter''s signature
    has been perceived as significant: Nikian Herkleous Anaphystos epoieten. Nikias
    does not only his name but also his patronymic. Regardless of the ending of the
    inscription, the most likely explanation is that the bearded figure – the run-ners
    on this one and all are bearded – is Antiochos. His deme, Anaphystos, belongs
    to the Antioch tribe. The painter created a vase to honour his victory.


    Other paintings of this type show the real, human and thus bearded winner of the
    race, like on a bell-crater by the Sussella Painter in Florence. The figures beside
    the winner are named by inscriptions.


