    at at the Panathenaea


    Julia L. Shear


    178/7 B.C. the double-length hororse for the four-chariot, an event limited to
    citizens, was won by Arketos, the son of Echedemes of the Pandionis, as we from
    the inscribed list of victors; the victory was presumably proclaimed in this form.¹
    Four years earlier in 182/1, however, the herald had found himself calling out
    ''King Ptolemy, the son of King Ptolemais'' of the tribe as the winner in the
    race.² Citizenship such as that ''essentially honorific'' and he further states
    ''none of these victors were particularly interested in or to exercise their rights
    to entitle the Athenian'', that is, the Athenians did not expect the recruits
    to participate as active citizens of the city. Elsewhere, Osborne links the implementation
    of such citizenship to a decree, and a piety.³ In view of recipients of these
    ''honorary'' grants, such as Ptolemy V, would have become Athenian; however, show
    that at least some ''honary Athenians'' did act on their citizenship and did so
    at the city''s most national and important festival.


    In this era, I want to look more closely at the citizens of these victors'' lists
    and ask: what was it for the Hellenistic cities to compete in the Panathenaia
    and what was it for the city of Athens? As I shall argue, for the Ptolemies and
    the Attallids, within restricted to Athenians proclaimed their status in the international
    setting of the Panathenaic Games. When the lists of victors were inscribed, their
    citizenship was listed on a public monument in the city and their status would
    have been apparent to anyone except the other preserved lists.⁴ Lists. For the
    Athenians, the participation of these men would have emphasised the importance
    of the city''s rights and one''s status as an Athenian. At the same time, by bestowing
    on these royals the right to take part in the festival at Athens, the city was
    able to reward them for their contribution to political and military aid. This
    close relationship displayed between the city and the royals further suggested
