  md: '# The iconography of the Athenian abopates race:

    ornings, meanings, transformations


    Peter Schultz


    In referring to "origins," the title of this paper is little misleading since
    it will not directly discuss what most scholars believe to be the actual, historical
    genesis of the abopates competition. I refer to this the popular notion that the
    abopates race is rooted in Homeric contexts and that the event self-consciously
    recalled as an age of legend in which warriors clashed into battle by chariots,
    leapt from their speeding vehicles and then remounted to continue the fray. If
    this was our subject, then we would begin with mid and late Geometric vase painting
    (Fig. 1) which is often seen as providing the earliest representations of the
    abopates competition. However, this does not concern us. Instead, I would like
    to discuss how the abopates race may have been invented over the course of the
    sixth and fifth centuries B.C. Examination of the contest and creation of the
    ideological tradition of the contest and its related iconography may shed new
    light on the abopates competition itself.


    Since the end of the fifth century, the abopates race was not only an anachronistic
    survival of the Homeric age but also an invention of the Athenian Herochion in
    Athens with his patron god Athena. The earliest literary source for this is pseudo-Eratosthenes,
    Katasterisma, being a master, play of Euripides, produced c. 438-410. The reference
    is worth citing in following:


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_62_0.png)


    Having up, [Eratosthenes] described [the chariot]; and being a master, he admired
    also celebrated the Panathena with honor, having a parades with a small shield
    and a triple-crested (trioplous) helmet, the raced [first]. This so-called abopates
    race comes through imitation.


