  md: '# Δραματικοί αγώνες και αρχιτεκτονική νότιά κλίτού του Ακρόπολεως


    Έχπει να είναι ολοκληρωθεί ήδη πριν από το 300 μ.Χ.¹¹ Σοάτρο της Πριύνης, όπου
    διασποτατα υπερυγχμενων σχηδ ήδη από το 300 μ.Χ., ή ο Von Gepan εκχυρίζει ως ζικής
    ανάζχησης του γύρο το 170-160 μ.Χ.²


    Με βάσα αυτή την παραπάνω παράγραφο, καθώς και με μερικά δεδομένα της επιγραφής,
    ώστε να υποστηριθεί ο συναστισμός της εργασίας για τη βάση του Διονυσου από το
    200 α.χ. με την εισγωγή των δραματικών αγώνων στον Παναθηναϊκό. Τα θέματα έγνα
    πιο ενδοφόρον, αν η ενγωγή αυτή αυθεί σε ένα μεγάλο μέρο που έγινε στην ίδια περιοχή
    ακριβώς του, το οποίο συνδέεται με τον Διονυσκό θεάτρο· του εκτυπαϊκού οικικοδοού
    των 163 μμ, που χάρη στην πόλη των Αθηνών της βασιλίας του Ευυμπέν Β''.


    Σετεί με την αρχική αναοικοδοσίασία της, οποία περιοριστείρκοπο στο γύγορο χρονικό
    διάστημα της βασλειλείας του Ευυμπέν Β'' (197-158 μ.Χ.)¹¹³ ειδώκόρτες μέλων έχχαν
    στην υποδοθεσία της στώής της βασλειλείας του (180-160 μ.Χ.)¹¹⁴, με βάση α· τη
    στατιστική μέθοδο των κωνιοκρών του οικικοδομείου και β· το γενικό του που αποτεί
    αυτή την χρονοτασία τα περισσότερα από μια ανάθημα του Ευυμπέν Β'' στην ίδια περιοχή
    του Πέργα και σε όλες και χώρες¹¹⁵.


    Η χρονική εξεγωγή του μία, της ελληνικής αποτικής του θεάτρου και της αναοικοδοσίας
    της στοιλής, στοιγται στη νότια κλίτω, καθώς και ο κόσνος του στην υπηρεσία των
    δραματικών αγώνων, αρχίπρε να τελεί στον Παναθηναϊκό, όταν να ενταχθεί σε ένα
    ενδογενές πρόγραμμα, με την αρχή της εισγωγής δραματικών αγώνων στην Αθήνα. Δωρητή
    για που μπορούσε να είναι ο Ευυμπέν, ερθεσαν σχετικά στοιχεία, που ενισχύουν με
    την χρήση του.


    # Ευμπέν Β'' και Διονυσιακό θετρο


    Είναι γνωσωστή η σκηνή της του βασιλιάς της αλης και της δυναμάσε του Διονυσου,
    που είναι μια αποδειδειμένη κατηγορία ιδίτερη περιοχής για τους Ατλαστίδες και
    περιοτερεύεται στο θεάτρο του Πέργαμου¹¹⁶ Η σκηνή αυτή φαίνεται ότι έχει αποδηθείθεί
    τον Ευυμπέν μια ιδιαίτερη θέση στην κατασκευή θεάτρου, εφόυγγορίζουμε ότι ο διος
    είχε κατέζλα για την αναοικονομική ή τη ειδική πρόσβαση διπικού δεκατονίων, και
    τα μέλεια ήταν περιοχή: του χρονου του 60 μ.Χ. του θεάτρου Β'', και το 160-158
