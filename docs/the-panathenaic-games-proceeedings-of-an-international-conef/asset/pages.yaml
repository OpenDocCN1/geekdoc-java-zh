    This base is unfortunately heavily damaged, more than half of it is lost. So we
    do not know if there was a relief on the opposite side of the pyrrhichai. One
    could imagine a scene of the boy''s chorus of Dionysia, a similar motif on the
    left block of the Atarbos base – but this to remain hypothetical. At any rate,
    in addition to the sculptor''s signature, the layout of the inscription – the
    choreic inscription for the victory at the Dionysia - without a relief supports
    that this is the face of the base. We have to conclude that the pyrrhichai are
    depicted on the left side and that their victory was not the principal reason
    for the dedication of this monument, which is instead a memorial to a victory
    at Dionysia.


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_128_0.png)


    Fig. 8. Epigraphic Monument 8707-8711: fragment of the right side of the Glaukon
    monument (IG II 3079, corona III) commemorating a victory in the anthesteria.


    There is another example of such a combination, i.e. a choreic monument for a
    dithyrambic victory at the Dionysia commemorates other liturgies on: the Glaukon
    monument of 280/79 B.C. (Fig. 8). Two fragments found in the Dionysos theater
    can be reassembled to form a roughly square building. The architecture in front
    bears the choreic inscription, and the two sides beside, added to an ivy wreath
    in relief, six olive wreaths with other liturgies or offered by Glaukon.


    One of them, Panathenaia ta megal. We can imagine the bronze trire given by the
    choregos running the roof of the marble naisk – this was the main purpose of the
    Glaukon monument: a dedication victory in a dithyrambic competition at the City
    Dionysia. We can see that this monument also commemorated other liturgies by the
    same person, and this provides a good parallel to the base in the National Museum
    with the relief of pyrrhichatai on its left side.


    # Conclusion


    This brief survey of memorials to the tribal events of the Panathenaia has demonstrated
    the difficulties in determining which are true choreic monuments, i.e. set up
    by wealthy members of the tribes, who funded the trials. Those that happen to
    be choreic dedications were set up shortly after a victory at the Dionysia, not
    the Panathenaia. This confirms the observation that the monuments erected in honor
    of Panathenic victories were usually not as elaborate as the monuments dedicated
    by the chorego of dithyramic


