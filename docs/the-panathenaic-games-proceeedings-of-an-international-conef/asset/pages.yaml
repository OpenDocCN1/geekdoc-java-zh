  md: '# The iconography of the Athenian approbates race


    ![](img/2fe0861a8561b48db2f4e8eb33cb0de5_64_0.png)


    Fig. 2. Black figure oinochoe of Painter of Oxford 224, showing Athens as approbates.
    Copenhagen, National Museum Chr. VIII.340. After 520 B.C. S. d''Ayala Valva, AntK
    39, 1996, fig. 1.2.


    How far back this particular etiology can be traced is difficult to say, Julia
    Shear has recently suggested that the “original” model for the race, as laid down
    by Aristotle and Erichthions, should date to the Peisitratid reorganization of
    the games in 566/5 B.C. This makes perfect sense, especially since catalogue nos.
    1-5 in the Appendix show that our first certain representations of the approates
    race correspond closely with the Peisistraid period in Athens.


    The notion of Peisistratid re-invention of the approates race also works nicely
    when viewed alongside the well-known story of Peisistratos'' second to seize power.
    During the course of this coup, Peisistratos took on the role of a charioteer
    and driver, at least according to Aristotle [Ath.Pol. 14.4] and Kleidemos [FHG
    323 f15], and in armored and armed powerful “Athena” up to the Acropolis. The
    idea of Peisistratos playing the part of the Erichthions would have accorded perfectly
    with his own dynamic claims. The construction of this sort of mythology was thoroughly
    practised by sixth century tyrants throughout the Greek world. Peisistratos''
    famous appropriation and importation of the cult of Melaniope in sixth century
    Sikonon (Sichydos, 5.67-68), and the construction of Agis of his line in fourth
    and fifth century Athens (Plutarch, Life of Agis, 9.1.10) by Peisistratos'' well-known
    mannification of the Hipparchic episodes (pseudo-Plato, Hipparchos 22b) are the
    only examples of particular legends constructed and/or manufactured political
    circumstances by sixth century tyrants. The “re-invention” of the approbates under
    Peisistratos fits nicely into this class of Attic origin/proaganic myths.


    Whatever the precise date of this, the iconic tradition of Athens as approbates
    continued into the fifth century. A series of black figure lekythoi, assigned
    by Beazley to the Haimon Group, shows Athens running beside a racing chariot.
    The regular use of motifs particular to the Haimon Group in scenes — the specific
    position of the runner, the armor and spears of the approbates, and most


