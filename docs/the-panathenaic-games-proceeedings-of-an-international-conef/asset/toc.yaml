- - '###'
  - 柱子的意义是什么，雅典娜几乎一直出现到公元前五世纪末？“柱子是战斗精神的象征，”约翰·毕斯利（John Beasley）在1951年提议道，并表示没有理由反对他的观点。⁸⁹
    然而，他说，“柱子指代雅典的姐妹，但可能它们也支撑着这些柱子。”¹⁰ 文章提出了一种理解柱子的纪念性建议，并得到了该主题所有相关研究的支持。在这些研究中，普遍认为柱子表示神圣之地、神圣建筑或区域的构成性或选择性代表，作为一个整体。它们构成了神性和神圣空间的象征。它们定义了神灵显现的区域和仪式行为。正如泛雅祖神像的柱子一样，它们也指示了女神在岩石上的神圣。
