  trans: "\n在 TDD 重构（refactor）阶段，我们将此书中的原则应用到代码中。我们会查看生产代码*以及*测试代码。我们进行一次微型代码审查（Code\
    \ Review）并寻找改进点：\n\n* 所有的命名都体现了意图吗？\n* 我们可以消除重复代码（`DRY` 不要重复自己）吗？\n* 我们可以用更简单的语法替换复杂的语法吗？\n\
    * 我们可以拆分某些内容来添加具有解释性的变量或方法吗？\n\n如果我们发现了任何改进点——或者我们的结对伙伴或小组同事发现了——我们现在就进行修改。\n\n\
    在每个“红-绿-重构”（Red - Green - Refactor）循环结束时，我们拥拥有良好的 OOP 设计、被证明可以运行且质量正确的代码。\n\n\
    在我们案例中，我们才刚刚开始。在白纸上很难搞坏代码，所以我们没什么需要做什么的。\n\n## 第二次测试：添加项目带给我们正确的总额\n\n是时候添加我们的第一个“正式”功能了——在\
    \ TDD 中，这意味着编写另一个测试。\n\n我们保留所有已经编写过的测试。通过这样做，我们构建了一整套回归测试。“回归”是指我们在添加功能 `#2` 时，不小心破坏了功能\
    \ `#1`。通过保持所有测试通过，我们证明了我们没有发生那种情况。\n\n在开发过程中——而且肯定是在提交（commit）之前——我们都会运行所有测试并确保它们全部通过。\n\
    \n当然，这对软件质量是巨大的提升。这看起来可能非常显而易见。但只有当你知道如何做时，事情才是显而易见的。我提到这一点是因为一次训练营课程，有一个学生最后只剩了一个测试，在每次新迭代中都删除了其他测试！\n\
    \n总之。新的测试：\n\n```\n 1 class BillCalculatorTest {\n 2     @Test\n 3     public\
    \ void correctTotalForOneItem() {\n 4         // Arrange\n 5         var calculator\
    \ = new BillCalculator();\n 6 \n 7         // Act\n 8         calculator.add(12.95);\n\
    \ 9         float total = calculator.getTotal();\n10 \n11         // Assert\n\
    \ 12         assertThat(total).isEqualTo(12.95);\n13     }\n14 }\n```\n\n## 设计第二个功能\n\
    \n我们继续按照之前的 安排（Arrange）、执行（Act）、断言（Assert）节奏进行。\n\n我们现在正在做更多的设计决策。我们开始影响代码的形状了。我做了两个决策，其中至少有一个是成疑的：将增加总额的行为命名为\
    \ `add`，以及使用 `float` 来表示价格。公平地说，那是在上一步完成的。\n\n使用 `float` 是那个成疑的。在学生练习和书中微小的练习之外（咳），`Floats`\
    \ 和钱并不合拍。它们对货币来说有两个问题：舍入误差和货币类型。\n\n`Floats` 缺乏精度。它们通常使用 `IEEE-754` 标准来存储具有特定二进制位的尾数和指数。结果是某些分数值——比如三分之一——无法被精确表示。这导致在相加时产生舍入误差。对于计算账单来说并不好。\n\
    \n原始的 `float` 也不具备涉及货币的知识。对于银行中常见的混合货币，这使得它们变得毫无用处。\n\n创建一个 `Money` 类可以解决这两个问题。但毕竟这只是关于\
    \ TDD 的示例，而不是银行银务。让我们继续进行吧，假装我们谁都没说过那些话。试着别看起来心虚。\n\n让我们用那个测试驱动出一个合理的实现：\n\n```\n\
    \ 1 class BillCalculator {\n 2     private float total ;\n 3 \n 4     public void\
    \ add(float itemPrice) {\n 5         total = itemPrice;  // 1. 我们需要谈谈这个...\n 6\
    \     }\n 7 \n 8     public float getTotal() {\n 9         return total;\n10 \
    \    }\n11 }\n```\n\n测试通过了。砰！大家击掌。\n\n有什么需要重构的吗？没什么特别，但我决定重构 > 将类重名为 `Bill`。\n\
    \n现在我们已经有了行为方法 `add()`，这似乎比 `BillCalculator` 更有意义。这不是一个计算器。这是一份餐厅账单，我们正在对它进行操作。这是看待问题的另一种方式。随着你的面向对象设计的展开以及你对问题的进一步了解，获得这种见解是很常见的。这就是为什么敏捷、迭代开发与\
    \ OOP 配合得非常好的原因。\n\n我们将使用 IDE 工具将 `BillCalculator` 重命名为 `Bill`，并勾选同步重命名测试。我还将重构\
    \ > 重命名测试中的本地变量 `calculator` 为 `bill`。\n\n## TDD 步骤 - 太多还是太少\n\n让我们看看 (1) 中的设计决策。它揭示了\
    \ TDD 中的一种张力。\n\n我在上面执行了严格的 TDD 以展示如何操作。我通过编写脑中最简单的代码来让测试通过。正常的做法是在重构步骤中清理我们不喜欢的内容。\n\
    \n但这是不同的。这关乎在每一步中完成多少进度。\n\n(1) 中的实现*将*价格赋值给总额。它覆盖了现有的总额，而不是将其累加。\n\n这意味着零情况会通过，单个项目情况也会通过。添加第二个项目将失败。\n\
    \n严格的 TDD *始终*在每一步都只做最少的工作。这被称为 `YAGNI` 原则。\n"
- fmt: "\nMy advice is to drop noise words from the start of the phrase. It’s a test\
    \ case, so we don’t need to say things like `shouldCalculateTotalAsZero`, `returnsTotalAsZero`\
    \ nor `checkThatTotalIsZero`.\n\nWe definitely *do not* need to write clunky test\
    \ names like:\n\n```\n1   @Test\n2   public void BillTest_calculateTotal_isZero()\
    \ {\n3      // JUST SAY NO!!!!!\n4   }\n```\n\n### Why?\n\nFor me, this goes back\
    \ to the whole idea of methods being little abstractions that make our code less\
    \ complicated.\n\nWe’re not describing *how* the test is built. We are not even\
    \ describing *how* the method we’re testing is implemented. We are describing\
    \ *what* we want the method we are testing to actually do.\n\nWe should use concise,\
    \ outcome-driven test names. A reader should be able to skim read what the test\
    \ expects the production code to do. This improves readability. It simplifies\
    \ refactoring the production code internals later.\n\nBeing agile means that we\
    \ can change our mind about the secrets our objects hide from callers. We reflect\
    \ this same thinking in our test names.\n\n## TDD and OOP - A natural fit\n\n\
    TDD is a natural fit for OOP. OOP is all about designing an object from the outside-in.\
    \ TDD is a process that scaffolds that.\n\nWe’ve seen two rhythms that guide us:\n\
    \n*   Arrange, Act, Assert\n*   Red, Green, Refactor\n\nWe’ve looked at how `YAGNI`\
    \ (and its corner-cutting cousin `YAYA`) help us prevent over-complicating code.\
    \ We’ve seen how we can change our mind about the code, taking the trouble to\
    \ improve it as we go. We’ve also seen how TDD helps us grow out a ‘right-sized’\
    \ design, one test at a time.\n\nThese ideas are at the heart of Extreme Programming\
    \ (XP). This ‘shifts left’ (i.e. reveals earlier) any problems with logic, design,\
    \ and code clarity.\n\n## FIRST Tests are usable tests\n\nWe like our acronyms\
    \ in software development, so we’ve come up with yet another to help us design\
    \ unit tests: FIRST.\n\nEach unit test should be:\n\n*   **Fast**: It should run\
    \ quickly (milliseconds)\n*   **Independent**: each test can run alone. Each test\
    \ does not need any other tests to have run first, nor any hardware setup\n* \
    \  **Repeatable**: Every time the test runs it gives the same result. The opposite\
    \ is the *flaky* test\n*   **Self-checking**: The test automatically checks the\
    \ output. If you need a human to do it, it isn’t a FIRST test\n*   **Timely**:\
    \ Each test takes about the same time to write as the code it is testing\n\nThe\
    \ earlier code examples are all FIRST tests.\n\nKeeping tests FIRST is hugely\
    \ important. It is the key to having useful tests that help you develop code.\
    \ Break FIRST, and you get the kinds of tests that only a manager could love.\n\
    \n## Real-world TDD\n\nBefore moving on, it’s worth sharing some experience with\
    \ TDD in real projects. As you would expect, everything is not quite as rosy as\
    \ I’ve just painted it.\n\n### The Good\n\nI’m a big fan of TDD. It really speeds\
    \ up development time (yes, really). The development cycle is way quicker than\
    \ spinning up three services, a Dockerised database, Node plus a React UI and\
    \ then clicking through five screens to test that your Bill can add up two items.\n\
    \nThe regression testing you get on each code change is worth actual money, in\
    \ terms of decreased spend on bug fixing and customer reputation.\n\nTDD gives\
    \ me a lot of confidence in my work. It lets me split things up into small chunks\
    \ that my limited brainpower can cope with. I used to write hundreds of lines\
    \ at a time before running code. I have literally zero clue how I did that now.\n\
    \n### The Bad\n\nSome teams dislike TDD and refuse to use it.\n\nTDD only works\
    \ with clean designs that are split up to allow the tests access to the code.\
    \ Legacy code often cannot use TDD. You cannot get the access you need in the\
    \ giant ball of spaghetti that passes for code.\n\nI’ve had somebody jealous of\
    \ my use of TDD, who made life hard for me in a team. They seemed to feel it somehow\
    \ showed them to be inferior and that this was something I intended. It’s best\
    \ to get everyone on the same page.\n\nTDD doesn’t work at all when you *cannot*\
    \ decide upfront what a method should do. Whilst that sounds obvious, a lot of\
    \ real-world development is experimental.\n\nYou’re tinkering around trying to\
    \ figure out what code might work. You might be wiring up libraries you don’t\
    \ understand for a feature that isn’t fully specified.\n\nThe solution here is\
    \ to do a *spike*. Forget tests: Hack. Make notes on the things that worked and\
    \ the rough shape of the code that did it. Revert the spike then use TDD to follow\
    \ your notes and engineer it properly.\n\n### The Ugly\n\nTDD can create a truly\
    \ colossal mess in the wrong hands. Think of toddler-with-Sharpie kinds of mess.\n\
    \nThe problem is that TDD does not - and cannot - design your code for you. Which\
    \ is why I put it after OOP ideas in this book. It just can’t.\n\nInstead, TDD\
    \ gives you *design feedback*. Here are the three classic test code smells:\n\n\
    *   Messy Arrange Step: Your object is over coupled to other objects. Split it.\n\
    *   Messy Act Step: Your object usage pattern is too complex: Simplify it.\n*\
    \   Messy Assert Step: The results are hard to use. Rethink it.\n\nWhat often\
    \ happens is that these test smells get ignored. Time pressure, lack of leadership,\
    \ or perhaps lack of knowledge.\n\n## Polymorphism - The Jewel in the OOP Crown\n\
    \nBy far, the most useful tool in Object Oriented Programming is polymorphism.\
    \ It is the key to everything that follows.\n\nIt is all about making objects\
    \ that can be swapped.\n\nPolymorphism gives us a nice alternative to conditional\
    \ logic. It allows us to split up program in really interesting ways. We can test\
    \ code in isolation, decouple code from external systems and reduce if / switch\
    \ statements.\n\nThere are a couple of ways of using this technique in Java code.\
    \ Let’s look into the clearest approach with Interfaces.\n\n### Classic example:\
    \ Shape.draw()\n\nThe classic example is `Shape.draw()`. It is simple and gets\
    \ the point across well.\n\nThis example is about having several classes that\
    \ each know how to draw a single shape. Circle knows how to draw a circle. Square\
    \ draws a square. We want a piece of code that can draw every kind of these shapes,\
    \ yet allows us to easily add more kinds in future.\n\n### The Shape Interface\n\
    \nWe start with a pure interface. This interface defines the behaviours all objects\
    \ that implement it must support. This is the part that gives us polymorphism.\n\
    \nIt is a promise to all calling code that any object that implements `Shape`\
    \ has a method `draw()` that we can call.\n\n```\n1 interface Shape { \n2   void\
    \ draw(); \n3 } \n```\n\nWhat I really like about this is that it expresses *design\
    \ intent*.\n\nI’m telling readers of my code that all `Shape` objects know how\
    \ to draw themselves when asked. That is the only thing the calling code has to\
    \ know: it can call `draw()`\n\nTo make this useful, we need to create some concrete\
    \ classes that hide the details of how to draw their specific shape.\n\nTo simplify\
    \ this example, `draw()` will write a text description of the shape to the console.\
    \ A more complete example passes in a `Display` object to `draw()`, which gives\
    \ us access to graphics operations. We’ll see that later in the book.\n\nFor now,\
    \ let’s focus on the basics of exploring polymorphism and making `draw()` do different\
    \ things in different objects.\n"
