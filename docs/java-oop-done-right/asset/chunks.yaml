    \ with OOP.\n\nWe’ll use the IDE tools to rename BillCalculator to Bill and check\
    \ the box to rename the test in lock-step. I’ll Refactor > Rename the local variable\
    \ ‘calculator’ in the test to ‘bill’ as well.\n\n## TDD Steps - Too much? Too\
    \ little?\n\nLet’s look at the design decision at (1). It reveals a tension in\
    \ TDD.\n\nI did strict TDD above, to show how it’s done. I made the test pass\
    \ by writing the simplest code that came to mind to do it. The normal trick is\
    \ to then tidy up anything we don’t like in the refactor step.\n\nBut this is\
    \ something different. It’s about how much progress to do in one step.\n\nThe\
    \ implementation at (1) *assigns* the price to the total. It overwrites the existing\
    \ total, rather than adding it up.\n\nThis means that the zero case will pass,\
    \ and a single item case will pass. Adding a second item will fail.\n\nStrict\
    \ TDD *always* does the bare minimum at each step. This is called the ‘YAGNI’\
    \ principle.\n\n## YAGNI - You Ain’t Gonna Need It\n\nYAGNI stands for ‘you ain’t\
    \ gonna need it’.\n\nIt was a response to the 1990s heyday of throwing in every\
    \ conceivable Design Pattern, whether it was needed or not. Making things ‘flexible,\
    \ configurable, extensible’ was the order of the day. Yet all you really needed\
    \ was a simple app that did the job.\n\nOnce designs became littered with ‘AbstractCalculationEngineBase’\
    \ and ‘BillSplitStrategyEqualPartitioningSingleCurrency’ and ‘ItemFactoryFactory’,\
    \ we realised things had gone too far.\n\nAnd so YAGNI was born. The solution\
    \ to all complexity is to ask if it is needed and just not bother with it if it\
    \ isn’t. If you aren’t going to need it yet, don’t write it.\n\n## YAYA - Yes,\
    \ You Are\n\n…which is great, until you look ahead to the next feature. Often,\
    \ you realise that yes, you ARE gonna need it.\n\nYou might not find the acronym\
    \ YAYA in any other books. Largely because I just made it up.\n\nBut just like\
    \ we have the Yin and the Yang, we have the Yagni and the Yaya. Two opposing forces\
    \ in development. Do we keep things bare minimum all the way, just to avoid over-complicating\
    \ things? Or, given we know what’s coming next, is *this* over-complicating things?\n\
    \nYou have to decide on a case by case basis.\n\nBut one thing is for sure. Our\
    \ next test is going to flush out that assignment to total and replace it with\
    \ an addition:\n\n```\n 1 class BillTest { \n 2     @Test\n 3     public void\
    \ correctTotalForTwoItems() {\n 4         // Arrange\n 5         var bill = new\
    \ Bill();\n 6 \n 7         // Act\n 8         bill.add(12.95);\n 9         bill.add(2.05)\n\
    10         float total = bill.getTotal();\n11 \n12         // Assert\n13     \
    \    assertThat(total).isEqualTo(12.95 + 2.05)\n14     }\n15 }\n```\n\nand we\
    \ make the single-character change to our production code to make it pass:\n\n\
    ```\n 1 class Bill {\n 2     private float total ;\n 3 \n 4     public void add(float\
    \ itemPrice) {\n 5         total += itemPrice;  \n 6     }\n 7 \n 8     public\
    \ float getTotal() {\n 9         return total;\n10     }\n11 }\n```\n\nYou can\
    \ see where the assignment has been changed to addition.\n\nI’ll leave it to you\
    \ to decide if we could have done that in one step instead of two. Or if it even\
    \ really matters.\n\n## Optimise for Clarity with well-named tests\n\nEach test\
    \ needs a name. We already know that names are important.\n\nHow do we ‘Optimise\
    \ for Clarity’ for the name of a test?\n\nFor me, the answer is the same as for\
    \ methods. Name each test according to the outcome of calling that method. Once\
    \ the test has successfully run, what will we have learned about the method we’re\
    \ testing?\n\nWe’ve already seen an example in our Bill calculation test. The\
    \ first test creates a bill with no items, then confirms that the total amount\
    \ is zero. A good name is then:\n\n```\n1 class BillTest {\n2   @Test\n3   public\
    \ void totalAmountIsZero() {\n4      // Arrange, Act, Assert goes here \n5   }\n\
    6 }\n```"
