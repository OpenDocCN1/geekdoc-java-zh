  trans: "\n乍看之下，这没什么特别的。我们看到了三个部分：获取输入、转换、显示。\n\n但注意 `new` 关键字。这是一个问题。\n\n正因为这个 `new`，该方法对如何读取键盘以及如何显示输出产生了`直接依赖`。\n\
    \n它还调用了 `System.out.println()` 进行输出，这存在同样的问题。我们被紧密地绑定到了一个全局方法上。但让我们先只考虑输入部分。\n\
    \n### 为什么 ‘new’ 是一个大问题？\n\n`new` 关键字本身并不是问题。问题在于*它在代码中的位置*。\n\n这种依赖关系是硬编码的。它们无法被更改。\n\
    \n如果我们想要一种不同的输入方式，我们就必须进入这个方法并修改代码。我们需要删除与 `Scanner` 相关的两行代码，并将它们替换为其他内容。\n\n\
    对于一个四行的方法来说，这听起来并不糟糕。但作为一种设计原则，这恰恰是我们不想要的。我们不希望互无关的代码区域必须发生改变。\n\n这样想：我们这个小函数的主要目的是什么？是将某些内容转换为大写。是的，它需要从某地方获取一些输入来实现这一点。但函数完全不需要知道那些输入是如何获取的。\n\
    \n这正是 TDD 真正迫使我们在早期做出良好决策的地方。\n\n我们如何为我们的函数编写单元测试呢？剧透一下：我们写不了。\n\n我们不得不承认失败。我们没有让测试在这一层进行键盘输入。我们被锁定在了使用\
    \ `Scanner` 对象上。\n\n但让我们重新表述这个问题而不要放弃：我们*如何能*编写单元测试？我们需要更改什么？\n\n### 反转输入依赖\n\n\
    我们需要某种方法，让这段代码可以获取输入，而无需知道它是如何实现的。\n\n我们以前见过怎么做。我们的多态 `Shape.draw()` 知道如何请求对象执行某事，而不需要知道怎么做。\n\
    \n让我们在这里使用相同的技术。\n\n我们将引入一个名为 `Input` 的接口，我们可以要求它提供一些文本：\n\n```\n1 interface Input\
    \ {\n2     String fetch();\n3 }\n```\n\n这是一个抽象。它说：“你可以向我索要输入字符串，但它从哪里来由我来决定”。\n\
    \n它替换了示例代码中与 scanner 相关的两行代码。\n\n```\n1 public void showInputInUpperCase() {\n\
    2     String inputText = input.fetch();\n3 \n4     // Convert\n5     String upperCaseText\
    \ = inputText.toUpperCase();\n6 \n7     // Display\n8     System.out.println(upperCaseText);\n\
    9 }\n```\n\n我还删除了注释。没有注释，接口本身也已经足够清楚了。\n\n就目前而言，代码无法通过编译。\n\n我们需要再做两个更改：\n\n*\
    \ 创建该接口的实现类\n* 添加一个参数或字段 `input` - 这样我们的方法就可以使用接口\n\n### 创建一个具体的 KeyboardInput\
    \ 类\n\n我们可以轻松地创建该接口的第一个实现：\n\n```\n1 class KeyboardInput implements Input {\n\
    2     @Override\n3     public String fetch() {\n4           Scanner scanner =\
    \ new Scanner(System.in);\n5           String inputText = scanner.nextLine();\n\
    6           \n7           return inputText;\n8     }\n9 }\n```\n\n我们将 `Scanner`\
    \ 代码复制粘贴到一个实现该接口的新类中。它被称为 `KeyboardInput`，因为这个类被允许确切知道输入来自哪里。\n\n这个类就是所谓的“反反依赖”。\n\
    \n旧方法在方法内部通过 `new` 创建了 `Scanner`。它依赖于 `Scanner`。\n\n新方法的代码只依赖于接口。新的 `KeyboardInput`\
    \ 类封装了 `Scanner` 并且依赖于接口。这就是反转的部分。\n\n我们将依赖关系从“方法依赖 Scanner” 为了“包含 Scanner 的类依赖接口”。\n\
    \n这种依赖关系与之前恰好相反。它被反转了。\n\n这种思维过程被称为 `DIP` 依赖倒置原则。\n\n### 依赖注入 - 使用我们的反转依赖\n\n\
    我们原始的方法需要一种方法来使用这个反转依赖。\n\n最常见的方法将其注入到构造函数中：\n\n```\n 1 class TextConversion {\n\
    \ 2     private Input input ;\n 3     \n 4     // 这是我们注入依赖的地方\n 5     public TextConversion(final\
    \ Input input) {\n 6         this.input = input;\n 7     }\n 8     \n 9     public\
    \ void showInputInUpperCase() {\n10         String inputText = input.fetch();\n\
    11     \n12         // Convert\n13         String upperCaseText = inputText.toUpperCase();\n\
    14     \n15         // Display\n16         System.out.println(upperCaseText);\n\
    17     }\n18 }\n```\n\n并且我们会构建一个小型应用程序来连接并运行它：\n\n```\n1 public class TextUtility\
    \ {\n2     public static void main(String[] commandLineArgs) {\n3         Input\
    \ input = new KeyboardInput();\n4         \n5         new TextConversion(input).showInputInUpperCase();\n\
    6     }\n7 }\n```\n\n运行这个程序，我们得到了原始的行为。这是一个重构练习，而不是功能变更。\n\n你能看到我们是如何将键盘输入的细节从实际的文本转换中*外部化*的吗？\n\
    \n### 可切换的输入源\n\n这是此设计最神奇的地方。这种设计隔离了输入源的变化。\n\n如果我们决定将使用键盘改为数据库，我们不需要更改 `TextConversion`\
    \ 类。也不会更改键盘输入。\n\n我们会编写一个实现 `Input` 接口的新具体类 `DatabaseInput`。我们在应用程序中使用它代替键盘输入：\n\
    \n```\n1 public class TextUtility {\n2     public static void main(String[] commandLineArgs)\
    \ {\n3         Input input = new KeyboardInput();\n4         \n5         new TextConversion(input).showInputInUpperCase();\n\
    6     }\n7 }\n```\n\n### 反转输出到显示\n\n与抽象输入一样，我们也可以对输出做同样的事情：\n\n创建接口：\n\n```\n\
    1 interface Output {\n2   display( String toDisplay );\n3 }\n```\n\n创建一个输出到 System\
    \ 的具体类：\n\n```\n1 class ConsoleOutput implements Output {\n2   @Override\n3  \
    \ public void display( String message ) {\n4     System.out.println( message );\n\
    5   }\n6 }\n```\n\n在构造函数中注入注入 `Input` 和 `Output` 依赖：\n\n```\n1 class TextConversion\
    \ {\n2     private Input input ;\n3     private Output output ;\n4     \n5   \
    \  public TextConversion(final Input input, final Output output){\n6         this.input\
    \ = input;\n7         this.output = output;\n8     }\n9     \n10     public void\
    \ showInputInUpperCase() {\n11         String inputText = input.fetch();\n12 \
    \        String upperCaseText = inputText.toUpperCase();\n13         output.display(upperCaseText);\n\
    14     }\n15 }\n```\n\n并在应用程序中创建这些具体类：\n\n```\n1 public class TextUtility {\n\
    2     public static void main(String[] commandLineArgs) {\n3         Input input\
    \ = new KeyboardInput();\n4         Output output = new ConsoleOutput();\n5 \n\
    6         new TextConversion(input, output).showInputInUpperCase();\n7     }\n\
    8 }\n```\n\n这允许我们切换到任何输入或显示源。我们只更改用 `new` 创建的对象。其他地方都不用动。\n\n这有助于我们的单元测试。我们可以将输入替换为我们可以控制的内容，并将输出替换为可以捕捉发送到它的任何内容。\n\
    \n我们将在‘TDD 和测试替身’章节看到它是如何工作的。\n\n### 反转 - 注入：硬币的两两面\n\n人们经常听过 DIP、SOLID 和像 Spring\
    \ 这样的 DI 框架，但从未将它们联系起来。\n\n依赖反置是一种*设计*技术。是从软件中移除硬编码耦合的思维过程。\n"
- fmt: "\nDependency Injection is the `implementation` technique. We have inverted\
    \ a dependency. Now we need some way of choosing a suitable concrete implementation\
    \ and plugging it in.\n\nDI frameworks are often useful. But don’t forget - simply\
    \ new-ing up classes and passing them into a constructor is all that DI is at\
    \ heart.\n\n## LSP Liskov Substitution Principle - Making things swappable\n\n\
    Barbara Liskov is a computing legend. LSP is the name given to an important principle\
    \ she discovered.\n\nThe principle helps us reason about a problem we have in\
    \ polymorphism.\n\nLet’s go back to our Shapes example to see what it is.\n\n\
    ### When Shapes go Bad\n\n```\n1 interface Shape {\n2     void draw();\n3 }\n\
    4 \n5 class Circle implements Shape {\n6     public void draw(){\n7         System.out.println(\"\
    I'm round\");\n8     }\n9 }\n```\n\nThis is the ‘good’ case.\n\nA `Circle` implements\
    \ the `draw()` method of interface `Shape` and can be used anywhere a `Shape`\
    \ is expected.\n\nYou’ll recall the example calling code which could mix together\
    \ `Circle`, `Square` and `Triangle` without code changes.\n\nBut can every class\
    \ that implements the interface method be swapped in? How about this one:\n\n\
    ```\n 1 class CardDealer implements Shape {\n 2     private final Deck cards ;\n\
    \ 3     \n 4     CardDealer( final Deck cards) {\n 5         this.cards = cards;\n\
    \ 6     }\n 7  \n 8     public void draw(){\n 9         Card next = cards.next();\n\
    10         System.out.println(next.asText());\n11     }\n12 }\n```\n\nThis might\
    \ be a class for a card game; Bridge or even Snap.\n\nClass `CardDealer` implements\
    \ the method `Shape.draw()` and so it is polymorphic with it.\n\nWe can add it\
    \ into our list of shapes easily enough:\n\n```\n1   List<Shape> shapes = List.of(\
    \ new Circle(), new CardDealer());\n2   shapes.forEach( Shape::draw ); \n```\n\
    \nThat will compile and run.\n\nBut will it work as expected?\n\n### Substitutability\n\
    \nIntuitively - No. Of course it won’t work as expected. `CardDealer` does not\
    \ fit in with our expectation of what `Shape.draw()` should do.\n\nThe whole setup\
    \ of `Shape.draw()` and `Circle` and so on suggests that we expect our classes\
    \ to draw geometric shapes. Not draw cards from a deck.\n\nThis was the insight\
    \ Barbara Liskov had. She went on to formalise this intuition mathematically.\
    \ It is that formalism which is known as the Liskov Substitution Principle (LSP).\n\
    \nLSP reminds us that classes implementing interfaces are only useful if they\
    \ can be substituted for that interface in all circumstances.\n\nSpecifically,\
    \ a class meeting this must:\n\n* Accept all possible inputs\n* Produce all expected\
    \ outputs for those inputs\n\nIn short, you can swap out any of the implementing\
    \ classes without causing the code to break.\n\nLiskov gave a rigorous definition\
    \ as:\n\n> if S is a subtype of T, then objects of type T in a program may be\
    \ replaced with objects of type S without altering any of the desirable properties\
    \ of that program\n\nPractically, I always end up asking that simple question:\
    \ “Are there any cases where this class would break the interface contract?”\n\
    \nLSP also applies to inheritance in general - classes and subclasses, abstract\
    \ classes and so on. It is not restricted to interfaces and implementations.\n\
    \nThe only reason I describe it in those terms is that I find interface/implementation\
    \ to be the simplest, safest usage of inheritance in OOP. It is ‘the happy path’.\n\
    \n## OCP Open/Closed Principle - adding without change\n\nThe Open/Closed Principle\
    \ describes code that can be made to behave differently without changing that\
    \ code itself.\n\nWe’ve seen this before in our Shapes example. The code that\
    \ draws Shapes can draw any shape without needing any change itself.\n\n```\n\
    \ 1 class Shapes {\n 2     private final List<Shape> shapes = new ArrayList<>();\n\
    \ 3 \n 4     public void add (Shape s) {\n 5         shapes.add(s);\n 6     }\n\
    \ 7 \n 8     public void draw() {\n 9         shapes.forEach(Shape::draw);\n10\
    \     }\n11 }\n```\n\nThis aggregate class allows you to add shapes to an inner\
    \ list then draw them.\n\nWhere OCP comes in is that you can add any LSP compatible\
    \ `Shape` implementation using the `add(shape)` method. You can then change the\
    \ behaviour of `Shapes.draw()` without changing anything inside that class. The\
    \ change of behaviour is done outside of the `Shapes` class, not inside.\n\nThis\
    \ is what is meant by Shapes is Open for extension (you make it do different things),\
    \ but closed for modification.\n\nOCP is essentially Dependency Inversion in disguise.\n\
    \n### Strategy Pattern: Externalising behaviour\n\nThere is a general-purpose\
    \ pattern for OCP.\n\nFirst described in the book Design Patterns by the ‘Gang\
    \ of Four’, the Strategy pattern is a general way of allowing behaviour to be\
    \ injected into a class.\n\nLet’s think of our `Shapes` class as being part of\
    \ a bigger graphics program, like Photoshop. We want to add a way to process each\
    \ `Shape` to our `Shapes` class. Our first algorithm could be to add a blur effect\
    \ to each shape.\n\nOne way to do this might be to add a `blur()` method to `Shapes`:\n\
    \n```\n 1 interface Shape {\n 2     void draw();\n 3     void apply(Filter f);\n\
    \ 4\n 5 \n 6 class Shapes {\n 7     private final List<Shape> shapes = new ArrayList<>();\n\
    \ 8 \n 9     public void add (Shape s) {\n10         shapes.add(s);\n11     }\n\
    12 \n13     public void draw() {\n14         shapes.forEach(Shape::draw);\n15\
    \     }\n16 \n17     public void blur() {\n18         shapes.forEach(s -> s.apply(new\
    \ BlurFilter()));\n19     }\n20 }\n```\n\nTo support this, we have also added\
    \ an `apply(Filter f)` method to `Shape` to give us a way to run the processing\
    \ on each `Shape`. `Filter` is an interface. Each different kind of graphics processing\
    \ must implement it. We pass in a concrete class of our choice, depending on what\
    \ kind of graphics processing we want. In this example, it is a `BlurFilter`,\
    \ which gives each shape a gentle Gaussian blur effect.\n\nThis works just fine.\
    \ But we have had to modify class `Shapes`.\n\nIn general, we want to avoid modifying\
    \ classes that we’ve already written. Or at least only do it for a good reason.\
    \ We don’t want to introduce bugs into code that already works. We certainly don’t\
    \ want to create giant classes with loads of methods. That’s the motivation behind\
    \ the Open/Closed Principle.\n\nAdding a feature like graphics processing to `Shapes`\
    \ is usually going to need a code change like this. Any other way of tackling\
    \ it would be a stretch.\n\nIf we only need the one method `blur()`, this isn’t\
    \ a bad way to do it.\n\nBut if we needed more kinds of processing - sharpen,\
    \ lighten, darken, posterise say - could we do better? Could we limit it to making\
    \ the one change and then injecting in those behaviours?\n\nThis is what the Strategy\
    \ pattern does well:\n\n```\n 1 class Shapes {\n 2     private final List<Shape>\
    \ shapes = new ArrayList<>();\n 3 \n 4     public void add (Shape s) {\n 5   \
    \      shapes.add(s);\n 6     }\n 7 \n 8     public void draw() {\n 9        \
    \ shapes.forEach(Shape::draw);\n10     }\n11 \n12     public void filter(Filter\
    \ filter) {\n13         shapes.forEach( s -> filter.applyTo(s) );\n14     }\n\
    15 }\n```\n\nHere, the `filter()` method injects a class implementing the `Filter`\
    \ interface into the method. It then runs it across each of the shapes.\n\n`Filter`\
    \ is a *Strategy Pattern*. It defines the strategy for how we filter a `Shape`.\
    \ It externalises behaviour.\n\nOur `Shapes.filter()` method has no knowledge\
    \ of how exactly we process each `Shape`. It takes what it is given from outside\
    \ the class and applies it to each `Shape`.\n\nIn the same way that `Shapes.draw()`\
    \ does not know how to draw any shape, `Shapes.filter()` does not know how to\
    \ filter any `Shape`. The Strategy pattern formed by our `Filter` interface pushes\
    \ that variable behaviour outside the class, leaving it open for extension but\
    \ closed for further modification.\n"
