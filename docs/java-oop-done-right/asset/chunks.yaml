    \n```\n1 public void Chat {\n2   public void sendMessage( String toUsername )\
    \ {\n3     // code ...\n4   }\n5 }\n```\n"
- fmt: "\nWe had a simple string to represent the name of a user. This was passed\
    \ into methods as above. We used this everywhere. It was one of those early design\
    \ decisions you make so you can just get moving. A `String` might not be the best\
    \ long-term decision, but anything else seemed over-engineered at the time.\n\n\
    This worked well. But we had two problems in the end.\n\nOne issue was that we\
    \ needed to change the code so that any given user was homed on a particular server.\
    \ The design later changed so that we needed both `username` and home server information\
    \ to be passed around. It was tough to change, because all we had were `Strings`,\
    \ everywhere. Search and replace just turned up thousands of `Strings`, as you\
    \ would expect. They were not always consistently named ‘username’, either.\n\n\
    The other issue was simply that a `String` based username leaves you guessing\
    \ what format the `String` should be in. What *exactly* do you pass in? ‘almellor’?\
    \ ‘al@webconf.com’? ‘1172397f’? It is impossible to know.\n\nThe answer was to\
    \ `Refactor > Change Method Signature` for each method like this. Instead of accepting\
    \ a `String`, it would accept a `User` object:\n\n```\nclass Chat {\n    public\
    \ void sendMessage( User recipient ) {\n        // code ...\n    }\n}\n```\n\n\
    This clarified the code, prevented a whole class of bugs and gave us the freedom\
    \ to add the home server information into that `User` object.\n\nAs you can see,\
    \ the whole ‘abstraction level’ has been raised again. We can now clearly see\
    \ that a `Chat` can `sendMessage` to a `User`. It’s written in plain English,\
    \ right there in the code. We see the ‘what’ more prominently than the ‘how’.\
    \ We see ‘User’ and not ‘String’.\n\n# Extract Parameter Object\n\nI love this\
    \ one. This refactoring causes some great emergent design insights. It is used\
    \ once you see a method with a parameter list that seems too long.\n\nBack to\
    \ Space Invaders for an example.\n\n```\nclass InvadersGame {\n  public void draw(\
    \ int x, int y, Image currentFrame, \n                    int deltaX, int deltaY)\
    \ {\n    // code\n  }\n}\n```\n\nHere we have a `draw()` method with a handful\
    \ of parameters. There’s nothing immediately wrong with that. But it’s making\
    \ me feel uneasy. It feels like there is some better code just waiting to emerge.\n\
    \nThe parameters look suspiciously related. An `(x, y)` coordinate pair. A `(deltaX,\
    \ deltaY)` motion vector. An `Image` with a current animation frame.\n\nHmmm.\n\
    \nThey sound like … well, they sound like the insides of an Invader. Let’s pull\
    \ them out as an `Invader` object, using `Refactor > Extract Parameter Object`:\n\
    \n```\nclass InvadersGame {\n    void draw( Invader i ) {\n        // code\n \
    \   }\n}\n\nclass Invader {\n    private int x;\n    private int y;\n    private\
    \ Image currentFrame ;\n    private int deltaX;\n    private int deltaY;\n\n \
    \   public int getX() {...}\n    public int getY() {...}\n    public Image getCurrentFrame()\
    \ {...}\n    public int getDeltaX() {...}\n    public int getDeltaY() {...}\n\
    }\n```\n\nI’ve omitted the code inside those getters, fields and constructors\
    \ for the `Invader` object. The structure is important here, not the detail.\n\
    \nWe have taken all those parameters in the original `draw()` method and put them\
    \ into a new class - called a ‘parameter object’. The existing `draw()` method\
    \ will then replace each use of the original parameters with `i.getX()`, `i.getY()`\
    \ and so on.\n\n`Invader` is not yet an OOP object with behaviours. It’s a pure\
    \ data structure.\n\nHere is where it gets interesting. If we move the code from\
    \ the original `draw()` method into a `draw()` method on the `Invader` class,\
    \ we can get rid of all those getters:\n\n```\nclass InvadersGame {\n    void\
    \ draw( Invader i ) {\n        i.draw();\n    }\n}\n\nclass Invader {\n    private\
    \ int x;\n    private int y;\n    private Image currentFrame ;\n    private int\
    \ deltaX;\n    private int deltaY;\n\n    public void draw() {\n        // code\
    \ can use x, y and so on. It's an object!\n    }\n}\n```\n\nYou can see this is\
    \ less procedural and more like the OOP we have been learning.\n\nCan you also\
    \ see that it is starting to look ‘back to front’ - and more descriptive?\n\n\
    Our old code would have called `draw()` with a load of primitive values from somewhere.\n\
    \nThis refactored code creates an `Invader` object that knows how to draw itself\
    \ and move around. This has made the `InvadersGame.draw()` method shorter, more\
    \ obviously about an `Invader` - and redundant.\n\n`Extract Parameter Object`\
    \ is such a powerful refactoring that it turns procedural designs inside out to\
    \ become Object Oriented designs. You can expect the changes to ripple out, dragging\
    \ more and more objects into play. By the end, your code will have that simplicity\
    \ of objects collaborating together, with hidden ‘secrets’ and meaningful names.\n\
    \n# Can we refactor anything into anything else?\n\nI heard a fascinating talk\
    \ on this, by local Manchester XP Surgery legend Kevin Rutherford.\n\nHis view\
    \ was ‘Not really’. I agree. Refactoring is powerful, but it has limitations.\n\
    \nRefactoring gets hindered by two things: lack (or excess) of tests and hidden\
    \ couplings.\n\nThe first one sounds surprising, but it’s true. Your tests need\
    \ to be ‘just right’, just like Goldocks’ porridge.\n\nThe second one is tricky.\
    \ You might find that you break some tests as you refactor, yet it’s not apparent\
    \ why. As you debug, you find that two areas of code need to be changed in lockstep.\
    \ There might be a string constant, for example. You refactor that in one class,\
    \ but forget to refactor it in the other.\n"
