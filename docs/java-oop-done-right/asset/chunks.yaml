  trans: "\n\n我们编写了代码，将我们的领域模型想要的内容 `adapts` 为我们现有库可以提供的内容。在此过程中，我们遵循了 SRP（单一职责原则）和\
    \ OCP（开闭原则）。\n\n适配器（Adapters）非常强大。它们是六形架构（Hexagonal Architecture）的基础——毕竟有一整层都是适配器。适配器的用途要广泛得多。\n\
    \n当我们有一个对象需要从另一个对象获取某些内容，但它们的方法并不完全匹配时，我们就可以使用 `Adapter`（适配器）。\n\nGoF 书列出了一个相关的模式称为\
    \ `Bridge`（桥接）。它在与 `Adapter` 的相似之处和不同之处有一个有趣的章节。我从未真正认为它们有不同。它们都是让一个事物与另一个并非设计为与之协作的东西工作。我倾向于用简单的方式看待问题。\n\
    \n示例：六形适配器层、转换数据格式、转换表现格式、链接不同版本的发布 API。\n\n## Command（命令模式）\n\n[GoF] 为我们提供了一个自包含的动作\n\
    \n很多时候，我们在程序中响应事件。事情发生了；用户提交了表单。计时器倒数为零。一张忠诚卡被扫描了。这些事件中的每一个都需要我们系统执行某些动作。\n\n\
    一个 `command` 对象包含了该动作的代码。它为调用代码提供了一个统一的接口，以便所有动作都可以以相同的方式被调用。这允许我们构建库和框架，我们的调用代码可以将\
    \ `Command` 对象传递给框架，以便在适当的时间运行。\n\n```\n1 interface Command {\n2     void execute();\n\
    3 }\n```\n\n`Command` 对象的类型是一个带有单一方法 `execute` 的接口。我们告诉具体类去 `execute` 它所包含的任何动作代码。\n\
    \n由于 `Commands` 擅长处理事件，一个合理的例子是看看我们的 GUI `Button` 类如果使用命令模式会变成什么样：\n\n```\n 1\
    \ class Button {\n 2     private final Command action ;\n 3 \n 4     public Button(\
    \ Command action ) {\n 5         this.action = action;\n 6     }\n 7 \n 8    \
    \ public void onClick() {\n 9         action.execute();\n10     }\n11 }\n```\n\
    \n变体包括：\n\n- 将 `Button` 传入 `execute` 方法以识别原因\n- 维护动作列表，每个动作按顺序触发\n- 在 `Command`\
    \ 接口中添加 `undo()` 方法以反转动作\n\n## Composite（组合模式）\n\n[GoF] 让许多事物看起来像一个事物\n\n`Composite`\
    \ 是一种适配器类。它将多个事物的集合适配为与单个事物相同的接口。这使得它成为一个很好的模式，你可以在其他模式之外使用它。\n\n回到我们的 `Shape.draw()`\
    \ 示例，`Composite` 模式给了我们一个非常有用的额外 `Shape`：`ShapeGroup`：\n\n```\n 1 class ShapeGroup\
    \ implements Shape {\n 2     private final List<Shape> shapes = new ArrayList<>();\n\
    \ 3 \n 4     public void add(Shape s) {\n 5         shapes.add(s);\n 6     }\n\
    \ 7 \n 8     public void draw() {\n 9         shapes.forEach( Shape::draw );\n\
    10     }\n11 }\n```\n\n该类可以用于任何预期 `Shape` 接口的地方。它可以完全替换单个 `Shape`。它允许使用 `add()`\
    \ 添加任意数量的 `Shape` 对象，然后在调用其 `draw()` 方法时绘制所有对象。\n\n`Composite` 对象这种处处可见。经典的用法是当某些无法更改的现有代码预期一个单一对象——如上面的单个\
    \ `Shape`——但你需要它与多个对象一起工作时。\n\n简单地将对象集合封装进 `Composite` 中，就可以就可以。\n\n## Facade（门面模式）\n\
    \n[GoF] 简化我们调用复杂对象组的方式\n\n`Facade`（门面）一词源于建筑学。它描述了如何用与建筑其他部分不同的材料构建一个“假正面”，以改善其外观。\n\
    \n在 OOP 中，当我们希望为调用代码提供一个简单的接口，但所需的对象又较难处理时，我们就使用 `Facade`。\n\n一个 Web 服务可能由大量复杂对象组成。一个税收计算引擎可能有很多代表税率档、额度、免税额、阈值等的对象。\n\
    \n让我们的应用程序代码创建这些每一个对象、将它们全部连接在一起并进行配置将非常困难。这会暴露许多不必要的细节。\n\n通过编写一个简单的 `Facade`\
    \ 来为我们完成所有工作，我们可以简化调用代码：\n\n```\n1 class TaxEngine {\n2     public TaxEngine(\
    \ Configuration c ) {\n3         // ... 创建对象、配置、连接的代码\n4     }\n5 \n6     public\
    \ Money calculateTaxLiability(DateRange taxPeriod) {\n7         // ... 代码\n8 \
    \    }\n9 }\n```\n\n这个 `TaxEngine` `Facade` 隐藏了用于连接和配置所需的许多对象的所有细节。它向调用者提供了一个简单的接口。\n\
    \n## Builder（构建器模式）\n\n[GoF] 让复杂对象的构建变得更容易\n\n当对象包含大量数据并作为其隐藏的秘密的一部分时，它们的构造函数会变得很大。当这些数据的部分是可选的时，调用代码往往会提供\
    \ null 和空参数。太糟了。\n\n改进此问题的方法是创建多个不同的构造函数。每个构造函数只列出非空参数，然后使用 `this()` 调用其他构造函数。在这种方法中，我们将默认值推入构造函数中。\n\
    \n这种方法虽然可行，但所需的构造函数数量会迅速失控。如果没有 IDE 的帮助，很难知道哪个参数对应哪个。`new User (\"alan\", 3, 198736543)`\
    \ 到底是什么意思？\n\n`Builder` 是为了解决此问题的模式。它提供了一系列命名方法来描述每个数据项的用途。它包含了要使用的默认值和空值。而且对于被构建的对象只需要一个完整的构造函数。\n\
    \n我们可能在 `User` 类中有三个可选字段：\n\n```\n1 class User {\n2     private final String userId;\n\
    3     private final Date dateOfBirth;\n4     private final User linkedAccount;\n\
    5 \n6     public User( String userId, Date dateOfBirth, User linkedAccount) {\n\
    7         this.userId = userId;\n8         this.dateOfBirth = dateOfBirth;\n9\
    \         this.linkedAccount = linkedAccount;\n10    }\n11 }\n```\n\n调用代码可以通过带有默认\
    \ `dateOfBirth` 和 `linkedAccount` 的方式来创建一个 `User`：\n\n此其中 `User.NOBODY` 是一个公共静态常量对象。\n\
    \n这对于三个参数来说效果良好，但它模糊了哪些是真实参数，哪些是默认值。随着参数列表的增长，情况变得更糟。\n\n`UserBuilder` 看起来像这样：\n\
    \n```\n1 class UserBuilder {\n2     private String userId = \"\";\n3     private\
    \ Date dateOfBirth = new Date();\n4     private User linkedAccount = new NullUser();\n\
    5 \n6     public User build() {\n7         return new User( userId, dateOfBirth,\
    \ linkedAccount );\n8     }\n9 \n10     public void userId( String userId ) {\n\
    11         this.userId = userId;\n12     }\n13 \n14     public void dateOfBirth(\
    \ Date dateOfBirth ) {\n15         this.dateOfBirth = dateOfBirth;\n16     }\n\
    17 \n18     public void linkedAccount( User linkedAccount ) {\n19         this.linkedAccount\
    \ = linkedAccount;\n20     }\n21 }\n```\n\n你可以看到默认值被构建在 `Builder` 中。我们可以通过提供的“setter”方法更改它们。一旦设置了所有需要的内容，我们就使用\
    \ `build()` 创建 `User` 对象。\n\n我倾向于将 `build` 方法放在顶部，仅仅出于风格考虑。我认为它是“最重要”的方法，也是帮助理解该类的方法。\n\
    \n有一个 Java 库可以自动编写这样的构建器，非常有用：\n\nProject Lombok 访问 https://projectlombok.org/features/Builder\n\
    \n## Repository（仓库模式）\n\n[DDD] 代表已存储的对象，而不说明它们如何存储\n\n另一个基础模式。我们在某种存储中拥有数据并想要处理它。但我们不希望我们的应用程序了解关于该存储技术的任何信息。我们确实希望将这些数据取出来并使用它们创建对象。\n\
    \n"
- fmt: "\n`Repository` allows us to create an abstraction of stored data, in our domain\
    \ terms. We’ve seen this earlier. We’ve used it to store `User` objects as an\
    \ example of the Adapter pattern. `Repository` focusses on the interface that\
    \ is called, rather than the adapter class implementation.\n\nTo show how useful\
    \ `Repository` is, let’s add a few common methods:\n\n```\n1 interface UserRepository\
    \ {\n2     User  findUserById( String userId );\n3     Users findUsersWhoseNameStartWith(\
    \ String startOfName );\n4     Users listAllUsers();\n5 \n6     Users execute(\
    \ Query q );\n7 }\n```\n\n`Users` is an aggregate class, containing methods relating\
    \ to multiple `User` objects.\n\nThis interface uses concepts known in our domain.\
    \ It says nothing about the storage mechanism. This makes it easy to read, easy\
    \ to stub for testing and easy to swap storage technologies.\n\nOur domain model\
    \ code can do all it needs to do using only this interface. It gives total separation\
    \ of concerns.\n\nThe methods listed above are typical:\n\n* find a single `User`\
    \ by various unique things, like a `userId`\n* find multiple users matching some\
    \ criteria\n* return everything\n\nThe final method is really interesting. It\
    \ returns all `User` objects matching a specified `Query`, passed in as a parameter\
    \ object.\n\n`Query` is itself an abstraction. It is not an SQL ‘SELECT’ query.\
    \ It is not a Mongo query. It is a group of pure Java objects that represent a\
    \ query. You would see things like:\n\n```\n1 Query q = \n2   new QueryBuilder()\n\
    3   .attributeMatches( \"name\", \"Al*\")\n4   .and()\n5   .timeAttributeBefore(\
    \ \"creationPoint\", new Time(\"2020-01-05T11.59.00Z\\\n6 ) )\n7   .build();\n\
    ```\n\nWhich would build an Abstract Syntax Tree (AST) describing a query that\
    \ matches all `Users` whose name begins with “Al” and whose `creationPoint` timestamp\
    \ was before 11:59 on Nov 5th 2020.\n\nThe `Query` object has a `translate( QueryDialect\
    \ dialect )` method on it. This gets passed a concrete object that knows how to\
    \ generate a specific query for a specific technology - like `MySqlQueryDialect`.\
    \ Often, this is done using the Visitor pattern. It is probably the canonical\
    \ example of why you would use Visitor.\n\nThis maps the generic query to be mapped\
    \ into something useful to an implementation. It also means the domain code query\
    \ above does not change when the storage technology changes.\n\nExamples: Relational\
    \ data access, NoSQL data access, REST data store clients, caches\n\n## Query\n\
    \n[PoEAA] Describes what to search for, but not how it will be done\n\nOur applications\
    \ need to be able to find objects once they are created.\n\nIn memory, once we\
    \ create an object using `new`, we receive a reference to that object. We keep\
    \ hold of that reference and use it to access the object.\n\nFor objects we stored\
    \ in the `Repository` earlier, we don’t have this reference. To find our object(s)\
    \ again, we need a `Query`. Some way of specifying ‘look for the object(s) best\
    \ matching these search terms.\n\nQueries take all forms. We’ve seen one frequently\
    \ in out `findUserById(userId)` method. Here, the search criteria “by user ID”\
    \ is baked into the method name.\n\nThat’s readable, simple and testable, But\
    \ it isn’t very flexible.\n\nOften, we need a general-purpose query system. Just\
    \ like the kind we find in an SQL statement.\n\nBut here’s the catch: we don’t\
    \ want to express it as SQL.\n\nWe’ve used a `Repository` object. We’ve used Hexagonal\
    \ Architecture so that our domain layer knows nothing about how that `Repository`\
    \ will be implemented.\n\nIf we were to pass SQL statements into our finder methods,\
    \ that defeats the whole purpose of that. We have created a *leaky abstraction*,\
    \ one where parts of one specific implementation ‘leak through’.\n\nThe solution\
    \ is to split a query into two parts:\n\n* Pure English: An abstract representation\
    \ of search criteria\n* Specific Details: A translator turns that into some specific\
    \ technology\n\nIt’s easier to understand once we realise all queries can be written\
    \ in English. “Show me all the users who joined yesterday” is an example. That’s\
    \ the role of the `Query` object pattern. The `Query` object expresses things\
    \ in pure domain terms. A translator object then converts this into whatever form\
    \ is needed.\n\n### Simple Query Object\n\nIt’s often useful to have a very simple\
    \ kind of `Query` object. It is intentionally limited in the queries it can represent,\
    \ making it simpler to write the translator object for. The trick is to make it\
    \ good enough to do the job.\n\n```\n 1 class Query {\n2     private String name\
    \ ;\n3     private Object value ;\n4 \n5     public void attributeEquals(String\
    \ name, Object value) {\n6         this.name = name ;\n7         this.value =\
    \ value ;\n8     }\n9 \n10     public void translate(Translator t) {\n11     \
    \    t.generate(name, value);\n12     }\n13 }\n14 \n15 interface Translator {\n\
    16     void generate(String name, Object value);\n17 }\n```\n\nThis bare-bones\
    \ `Query` object shows the basic split of work. We can represent just the one\
    \ query - ‘is <attribute> equal to <value>?’. We can call `translate()` passing\
    \ in some `Translator` object to generate an implementation-specific query.\n\n\
    Here is a simple `SqlTranslator` object that will create a SELECT statement for\
    \ us, then display it - just for this example. It would normally link up to a\
    \ `Database` object. This would manage a JDBC connection, run the SQL, then return\
    \ the SQL.\n\n```\n1 class SqlTranslator implements Translator {\n2     private\
    \ final String table ;\n3     private String sql ;\n4 \n5     public SqlTranslator(\
    \ String table ) {\n6         this.table = table ;\n7     }\n8 \n9     public\
    \ void generate( String name, Object value ) {\n10         // Note: this only\
    \ works for text\n11         sql = String.format(\"SELECT * FROM %s WHERE %s =\
    \ '%s'\", \n12                                 table, name, value);\n13     }\n\
    14 \n15     public void displayForDebug() {\n16         System.out.println( sql\
    \ );\n17     }\n18 }\n```\n\nWe use these classes to implement our findUserById()\
    \ method:\n\n```\n1 User findUserById( String userId ) {\n2     Query q = new\
    \ Query();\n3     q.attributeEquals( \"id\", userId );\n4 \n5     Translator sql\
    \ = new SqlTranslator();\n6     q.translate(sql);\n7 \n8     sql.displayForDebug();\n\
    9 \n10     // database code omitted\n11 }\n```\n\nYou can see how the details\
    \ of SQL are hidden in the `SqlTranslator` object. The details of what we want\
    \ to search for are hidden in the `Query` object itself.\n\nSignificantly, they\
    \ are expressed in domain terms - not SQL or database terms. We could write a\
    \ `MongoTranslator` or `FileTranslator` and make those work.\n\nYou can also see\
    \ the comment: it only works for String values.\n\nMore complete Query objects\
    \ need to convert between Java data types and whatever type the storage technology\
    \ needs.\n\nIn fact, Query objects and translators get complex, fast.\n\nThe full-fat\
    \ version builds an Abstract Syntax Tree of Criteria objects, complete with operators\
    \ such as AND, OR, LIKE, NOT, EQUALS, BETWEEN. They will convert between all data\
    \ types and use the Visitor pattern to translate the Criteria graph into the implementation\
    \ version.\n\nI have actually built one of those for a real project. It was a\
    \ system where a user could build their own queries to report on a fleet of printers\
    \ in an enterprise network. The actual implementation was intended to use a number\
    \ of backend database systems to store a snapshot of that fleet’s status.\n\n\
