  trans: "\n\n```\nUser u = findUserById(\"alan0127\");\n\nif ( u.isValid() ) {\n\
    \    u.showProfile();\n}\n```\n\n这是一个判断性决策。这比空检查（null checks）更好吗？\n\n我的观点是“有时是肯定的”。可读性的微小提升是值得的。以“以清晰性优先”作为我们的指导原则，有时这会让调用处的代码更具描述性。\n\
    \n你必须自己决定。但如果你看到别人写了这样的代码，这就是原因所在。这种独特的 `if (object.isValid()) { /* use object\
    \ */ }` 模式是“**僵尸对象**（Zombie object）”的特征。\n\n## 异常 - 快速入门\n\n在 Java 中，还有另一种完全不同的机制来报告程序出现问题。\n\
    \n异常从起初就一直存在。它们是一种替代的控制流机制。正因如此，它们相当有争议。\n\n让我们看看它们在下面的代码段中是如何使用的：\n\n```\n 1\
    \ class ExceptionsDemo {\n 2   public void demonstrateExceptions() {\n 3     try\
    \ {\n 4         System.out.println(\"This will print out 1\");\n 5         methodWhichThrowsAnException();\n\
    \ 6 \n 7         // Line below will never run ...\n 8         System.out.println(\"\
    This code will never be run 2\");\n 9     }\n10     catch( RuntimeException e\
    \ ) {\n 11       System.out.println(\"You will see this - exception caught\");\n\
    \ 12 \n 13       System.out.println(\"Exception message was: \" + e.getMessage());\n\
    \ 14     }\n 15   }\n 16 \n 17   private void methodWhichThrowsAnException() {\n\
    \ 18       System.out.println( \"This will print out 2\" );\n 19       throw new\
    \ RuntimeException(\"Used to report an error\");\n 20 \n 21       // Unreachable\
    \ code - this will never run\n 22       System.out.println(\"This code will be\
    \ be run 1\");\n 23   }\n 24 }\n```\n\n这里的核心思想是 `throw` 关键字执行时会改变执行流。它会在该点停止顺序执行代码。代码会立即退出它所在的任何方法，而不再执行该函数的后续任何行。它是一种提前返回（early\
    \ return）语句。\n\n重要的是，如果该方法本应该返回某些内容，那将不会发生。什么都没有返回。不是 null。什么都没有。\n\n`throw` 关键字设计用于与\
    \ `try` 和 `catch` 关键字配合使用，这种结构被称为 `try-catch` 块。\n\n如果某个方法在 `try` 块内部抛出异常，那么代码执行将从匹配的\
    \ `catch` 块的第一行开始恢复。\n\n`throw` 关键字有一个参数。该参数应该是一个对象实例，它要么是、要么继承自内置类 `Exception`\
    \ 或 `RuntimeException` 之一。\n\n`catch` 关键字有一个匹配的参数，用于接收 `throw` 语句中使用的对象。这是一种通过异常对象传递信息的方法，以便为\
    \ `catch` 块代码提供诊断信息。\n\n在示例中，传递到 `RuntimeException` 对象构造函数的文本将由 `catch` 块中的代码显示。\n\
    \n你可以看到异常如何允许方法简单地提前终止，并将控制权传递给 `catch` 块——称为异常处理器。\n\n异常是信号化“发生了错误。我无法继续执行该方法。原因如下”的一种强大方式。\n\
    \n但它们存在争议。\n\n在实践中，使用异常有三种方法。\n\n## 履行设计（Bertrand Meyer 风格）\n\nEiffel 语言的发明者 Bertrand\
    \ Meyer 对方法和异常有一个极佳的想法。\n\n他提出方法调用是方法内部代码与其调用代码之间的契约。我们的 `findUserById(id)` 方法声明了一个绑定契约：如果你调用该方法，你*将*收到一个有效的\
    \ `User` 对象。\n\nMeyer 将异常视为指示“该契约无法满足”的方式。如果由于任何原因无法返回 `User` 对象，你将在 `findUserById()`\
    \ 方法中抛出异常。契约被破坏了。\n\n在这一对异常的观点下，它们是随处可见的。你可以编写依赖于契约履行的调用代码：\n\n```\n 1 try {\n\
    \ 2   User u = findUserById( \"alan0127\" );\n 3 \n 4   // 如果我们到达这里，我们保证 User\
    \ u 是有效的\n 5   // 得于我们的契约\n 6   u.showProfile();\n 7 }\n 8 catch( Exception e\
    \ ) {\n 9     // 如果我们到达这里，我们知道 User 对象是无效的\n110     // 我们可以处理它\n 11 }\n```\n\n\
    从这个角度看，异常清理了调用代码。它们消除了空值传递。它们消除了条件判断。事实上，它们从设计上消除了“返回的对象可能是无效的”的想法。这是不可能的。你要么得到结果，要么得到异常。\n\
    \nJava 完全支持这一点。它甚至提供了一个额外的工具。如果异常类继承自 `Exception`，Java 编译器将强制异常要么在调用处被捕获，要么声明为向上调用栈抛出。\n\
    \n相比之下，任何继承 `RuntimeException` 的内容都没有那么严格。这实际上是如今使用异常的优方法。\n\n## 致命错误：停止世界！\n\n\
    关于异常的另一种观点是，你只将其用于需要立即停止程序的无法修复的问题。\n\n这些将是抛出且从未被捕获的 `RuntimeException`（或子类）。虚拟机随后将杀死发生未捕获异常时正在运行的线程。如果恰是主线程，程序将退出。\n\
    \n## 结合方法：可修复与不可修复\n\n第三种方法将两者结合起来。\n\n我们使用异常来表示可修复的错误。我们使用不同的异常来表示不可修复的错误。\n\n\
    经典的例子是访问不可靠系统的超时，例如当网络中断时可能会失败的 REST 服务调用：\n\n```\n 1 for (int attempts = 0; attempts\
    \ < 3; attempts++) {\n 2     try {\n 3         callUnreliableService();\n 4  \
    \       return ; // 正常路径 - 退出方法\n 5     }\n 6     catch( ServiceTemporUnavailableException\
    \ se ) {\n 7         Thread.sleep(1000); // 等待一秒\n 8     }\n 9 }\n10 \n11 throw\
    \ new ServiceUnavailableException();\n```\n\n这段代码调用了方法 `callUnreliableService()`。它可能会通过抛出\
    \ `ServiceTemporUnavailableException` 失败。这可能是临时故障。所以我们等待一下，给予恢复的机会，然后重试。\n\n如果连续三次都不，我们就承认失败并抛出\
    \ `ServiceUnavailableException`。此异常告诉调用代码遇到了问题，并应该规避它，或者终止程序。\n\n"
- fmt: "\nWe’ve touched on this earlier. If you return a null, then attempt to call\
    \ a method on that null, Java goes boom.\n\nTo be fair, Java goes a lot less boom\
    \ than C or C++ do. It is actually fairly civilised. It throws a `NullPointerException`.\n\
    \nOne approach to indicate that we cannot return a user object is simply to return\
    \ `null`. We can omit the null check and catch the exception instead:\n\n```\n\
    1 try {\n2     User u = findUserById(\"alan0127\");\n3     u.showProfile();\n\
    4 }\n5 catch( NullPointerException npe ) {\n6     // handle missing user \n7 }\n\
    ```\n\nIt’s similar in nature to the return null with a null check. You’ll see\
    \ this in the wild. I’m not sure I really like it - even though I’ve used it myself.\n\
    \n## Application Specific Exceptions\n\nOne small improvement is to define a more\
    \ descriptive exception:\n\n```\n1 class UserNotFoundException extends RuntimeException\
    \ {\n2     public UserNotFoundException( String diagnostics ) {\n3         super(diagnostics);\n\
    4     }\n5 }\n```\n\nThis allows us to indicate an error like this:\n\n```\n1\
    \ User findUserById( String userId ) {\n2     throw new UserNotFoundException(\"\
    <reason why not available>\");\n3 }\n```\n\nand the calling code becomes a little\
    \ more clear:\n\n```\n1 try {\n2     User u = findUserById(\"alan0127\");\n3 \
    \    u.showProfile();\n4 }\n5 catch( UserNotFoundException unfe ) {\n6     //\
    \ handle missing user \n7 }\n```\n\nThis is an implementation of Meyer’s Design\
    \ by Contract idea.\n\n## Error object\n\nThere’s something a bit off about exceptions\
    \ and Object Oriented Programming.\n\nOOP is all about behaviours and objects\
    \ collaborating. Exceptions are all about disturbing the control flow in a very\
    \ procedural sense. Those two things don’t really match.\n\nError objects are\
    \ very different to exceptions. They are normal objects that will be returned\
    \ out of methods. Those methods will run and complete normally.\n\nThey work by\
    \ using polymorphism and tell don’t ask. Twice, as we’ll see.\n\nLet’s go back\
    \ to our `findUserById(id)` running example. It can either return a valid `User`\
    \ or tell the calling code that there’t one.\n\nUsing OOP, we can define each\
    \ case as a separate object:\n\n```\n1 class ValidUser {\n2     private final\
    \ User ;\n3 \n4     public ValidUser(User u){\n5         this.user = u;\n6   \
    \  }\n7 }\n8 \n9 class InvalidUser {\n10     // Nothing to represent ...\n11 }\n\
    ```\n\nWhich of course sounds like a wonderful application of SRP, until we ask\
    \ “Java functions can only return two objects if there is some kind of inheritance\
    \ relationship - `extends` or `implements` - between them. That’s not the case.”\n\
    \nWe can fix that by simply making both implement an interface, of course. Let’s\
    \ make `findUserById(id)` return a `UserResult` interface:\n\n```\n1 interface\
    \ UserResult {\n2     // empty\n3     // ... we'll come back to this\n4 }\n```\n\
    \nwhich can be returned simply:\n\n```\n1 UserResult findUserById( String userId\
    \ ) {\n2     // ... code\n3 }\n```\n\nand the inside of that method can return\
    \ either of our objects, if we make them implement our interface:\n\n```\n1 class\
    \ ValidUser implements UserResult {\n2     private final User user ;\n3 \n4  \
    \   public ValidUser(User u){\n5         this.user = u;\n6     }\n7 }\n8 \n9 class\
    \ InvalidUser implements UserResult {\n10     // Nothing to represent ...\n11\
    \ }\n```\n\nWhich is all great. We’re making steady progress. But hang on - was\
    \ that an empty interface? What is that? A fair point. Currently, the only thing\
    \ we could do in the calling code is call `instanceof` to find out what concrete\
    \ class was returned. That is worse than a null check! We’ll need to do better.\
    \ Thinking back to OOP, what we really need is a common behaviour. Something that\
    \ unites both `InvalidUser` and `ValidUser`. Obviously, that’t be something like\
    \ a `getName()` method, because `InvalidUser` does not have one.\n\nThe fix for\
    \ this is to use the Tell Don’ Ask principle. We can tell our object to ‘do its\
    \ thing’. Quite literally. We add an `applyTo()` method:\n\n```\n1 interface UserResult\
    \ {\n2     void applyTo(); // ... we'll come back to this\n3 }\n```\n\n’s better.\
    \ Our calling code no longer needs to know which concrete class we returned. It\
    \ only has to call `applyTo()` then the relevant object will apply itself. Ah.\
    \ What will it apply to, exactly? We’re missing another interface:\n\n```\n1 interface\
    \ UserConsumer {\n2     void validUser( User u );\n3     void invalidUser();\n\
    4 }\n```\n\nwhich we can use in the `UserResult` interface:\n\n```\n1 interface\
    \ UserResult {\n2     void applyTo( UserConsumer consumer );\n3 }\n```\n\nWe have\
    \ to update `ValidUser` and `InvalidUser` with the new method:\n\n```\n1 class\
    \ ValidUser implements UserResult {\n2     private final User user ;\n3 \n4  \
    \   public ValidUser(User u){\n5         this.user = u;\n6     }\n7 \n8     public\
    \ void applyTo( UserConsumer uc ) {\n9         uc.validUser( user );\n10     }\n\
    11 }\n12 \n13 class InvalidUser implements UserResult {\n14 \n15     public void\
    \ applyTo( UserConsumer uc ) {\n16         uc.invalidUser();\n17 }\n18 }\n```\n\
    \nFinally, this makes sense. We tell our result objects to apply themselves, but\
    \ this time to some new consumer object we will make. This new consumer object\
    \ will have two methods `validUser`, passing the `User` object as a parameter\
    \ and `invalidUser`. In each case, the consumer object is guaranteed to either\
    \ be given a valid `User` object or that no object exists.\n\nThe idea here is\
    \ that `findUserById(id)` now returns an object. We can tell that to `applyTo()`\
    \ some other object we have created to handle results. That object knows how to\
    \ handle either a valid or an invalid object. This is a ‘push’ solution. We use\
    \ Tell Don’t Ask across two objects to resolve the valid/invalid behaviour.\n\n\
    If you think back to a null check solution, you would have two blocks of code\
    \ that ran; one for null, the other for not null. Now, we have two different methods\
    \ that get called for each case. As an example, lets create a simple object that\
    \ will print the profile of a valid `User` and write an error message to the console\
    \ for an invalid one:\n\n```\n1 class ProfileTextDisplay implements UserConsumer\
    \ {\n2     public void validUser( User user ) {\n3         user.showProfile();\n\
    4     }\n5 \n6     public void invalidUser() {\n7         System.out.println(\
    \ \"Sorry, we don't know that User.\" );\n8     } \n9 }\n```\n\nWe can create\
    \ calling code that looks like this:\n\n```\n1 ProfileTextDisplay display = new\
    \ ProfileTextDisplay();\n2 \n3 UserResult result = findUserById( \"alan0127\"\
    \ );\n4 result.applyTo(display)\n```\n\nThat’s the final result. The calling code\
    \ - at last - looks clear, simple and neat. There are no nulls, no exceptions,\
    \ no conditionals. Just objects that know how to do the right thing as part of\
    \ their secrets. The plumbing code we need is quite extensive: `UserResult`, `ValidUser`,\
    \ `InvalidUser`, `UserConsumer`. But the trade-off is that each piece is nicely\
    \ separated out. It is easy to unit test in isolation.\n\n## Optionals - Java\
    \ 8 streams approach\n\nJava 8 introduced some pure functional ideas with its\
    \ use of streams. The big idea was to combine iterating over collections and transforming\
    \ each object in that collection in one step.\n\nA typical example would be to\
    \ take a `List` of our `User` objects, find the first one with username starting\
    \ with ‘Al’ then change that name to all uppercase:\n\n```\n1 fetchDisplayNameForFirstAl(\
    \ List users ) {\n2     return users.stream()\n3         .filter( user -> user.nameStartsWith(\"\
    Al\") )\n4         .findFirst()\n5         .map( user -> user.getName().toUpperCase()\
    \ );\n6 }\n```\n"
