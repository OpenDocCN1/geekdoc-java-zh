    \ gets the point across well.\n\nThis example is about having several classes\
    \ that each know how to draw a single shape. Circle knows how to draw a circle.\
    \ Square draws a square. We want a piece of code that can draw every kind of these\
    \ shapes, yet allows us to easily add more kinds in the future.\n\n## The Shape\
    \ Interface\n\nWe start with a pure interface. This interface defines the behaviours\
    \ all objects that implement it must support. This is the part that gives us polymorphism.\n\
    \nIt is a promise to all calling code that any object that implements Shape has\
    \ a method draw() that we can call.\n\n```\n1 interface Shape { \n2   void draw();\
    \ \n3 } \n```\n\nWhat I really like about this is that it expresses *design intent*.\n\
    \nI’m telling readers of my code that all Shape objects know how to draw themselves\
    \ when asked. That is the only thing the calling code has to know: it can call\
    \ draw()\n\nTo make this useful, we need to create some concrete classes that\
    \ hide the details of how to draw their specific shape.\n\nTo simplify this example,\
    \ draw() will write a text description of the shape to the console. A more complete\
    \ example passes in a Display object to draw(), which gives us access to graphics\
    \ operations. We’ll see that later in the book.\n\nFor now, let’s focus on the\
    \ basics of exploring polymorphism and making draw() do different things in different\
    \ objects."
