    \ that is the deciding factor.\n\n# Design Patterns\n\nIt can be hard work, this\
    \ mapping behaviours to different objects. Just like it is hard re-inventing a\
    \ house from scratch, for every house on a street.\n\nBy the mid-1990s, the object\
    \ oriented world had discovered the same thing. A lot of objects had the same\
    \ kind of ‘shape’. Just like houses on a street.\n\nTo understand what a pattern\
    \ is, let’s come at this in reverse. Imagine you’ve written an object that has\
    \ three data fields:\n\n*   A name\n\n*   A timestamp\n\n*   An amount\n\nThese\
    \ are the secrets of your class. Without overthinking, what’s the first thing\
    \ that comes into your head that this represents? No cheating, now! 3, 2, 1 …\
    \ Go!\n\nI get:\n\n*   A line item on a bill: “Rioja 125ml, 8.30pm, £2.95”\n\n\
    *   A lease: “12 month rent of 15A Acacia Avenue, 1 Jan 2020, £2,150”\n\n*   A\
