  trans: "\n\n```\nclass Circle implements Shape { \n  public void draw() { \n   \
    \ System.out.println(“Look how round I am”); \n  } \n}\n```\n\n这是一个知道如何画圆的类。在这个例子中，这意味着它向控制台写入了一些文本。\n\
    \n```\nclass Square implements Shape { \n  public void draw(){ \n    System.out.println(“Four\
    \ sides all the same for me”); \n  } \n}\n```\n\n`Square` 是一个知道如何画正方形的类。\n\n#\
    \ 告知不要询问（Tell Don’t Ask）—— OOP 的关键\n\n这允许你编写代码来接收任何 `Shape` 并让它自己画出来。这就是“告知不要询问”原则的体现。回想一下我们的对象基础章节，我们讨论过不要告诉别人如何工作，我们只需要要求他们去做即可。这在代码中就是这样运作的。\n\
    \n这很魔法，我们稍后会讨论为什么。但首先，让我们看看调用代码是什么样子的：\n\n```\nvar shapes = new ArrayList<Shape>();\
    \ \n\nshapes.add( new Circle() ); \nshapes.add( new Square() ); \n\nshapes.forEach(\
    \ shape -> shape.draw() ); \n```\n\n这段代码创建了一个实现 `Shape` 的对象的列表。它向该列表添加了 `Circle`\
    \ 和 `Square` 的实例。它使用 Java 8 的 `forEach` 方法遍历列表中的每个对象，并调用它的 `draw()` 方法。\n\n由于\
    \ `draw()` 是多态的，Java 运行时会将调用路由到`实现类`中的代码。尽管调用代码看起来每次都调用同一个 `draw()` 方法，但*事实并非如此*。运行时会将其路由到它找到的任何实际类。\n\
    \n输出看起来如下：\n\n> Look how round I am\n\n> Four sides all the same for me\n\n让我们聊谈我提到的那种魔法。你会发现这里有几个非常精妙的地方：\n\
    \n*   没有 `if` 或 `switch` 语句\n*   没有 `instanceof` 语句（哎！真的不要了）\n*   循环代码不知道列表里有什么种类的形状\n\
    *   我们可以添加新形状而不影响任何其他形状\n\n不使用 `if` 或 `switch` 语句是一个巨大的胜利。另一种方法是拥有单一的 `draw()`\
    \ 方法，并在其中包含一个巨大的 `switch` 语句：\n\n```\npublic void draw() {\n    // 千万不要这样做！！！\n\
    \    \n    switch( shapeType ) {\n        case \"CIRCLE\":\n          System.out.println(“Look\
    \ how round I am”);\n          break;\n        \n        case \"SQUARE\":\n  \
    \        System.out.println(“Four sides all the same for me”);\n          break;\n\
    \        \n        default:\n          throw new IllegalArgumentException(\"Unknown\
    \ Shape type \" + shapeType)\n    }\n}\n```\n\n你可以看到随着新形状的添加，这样的代码会不断增长。代码本身是复杂的，所有的条件判断都是如此。它们在代码中拥有额外的可能执行路径。每一个都需要测试。每一个都增加了出现编码错误的可能性。\n\
    \n多态方法完全分离了这些代码部分。`Circle` 类与 `Square` 类完全没有联系。在我们“巨大的 switch 语句”情况下，情况就不成立。因此，对其中一个修改不会影响另一个。\n\
    \n另一个结果是添加新形状非常简单。\n\n```\nclass Triangle implements Shape {\n  void draw() {\n\
    \    System.out.println(\"I really like having three points\");\n  }\n}\n```\n\
    \n*draw 循环代码完全没有改变 - 但现在可以画三角形了*\n\n为了添加我们的三角形，我们只需要在对象创建代码中添加一行即可：\n\n```\nvar\
    \ shapes = new ArrayList<Shape>(); \n\nshapes.add( new Circle() ); \nshapes.add(\
    \ new Square() ); \nshapes.add( new Triangle() ); // 唯一新的一行代码\n\nshapes.forEach(\
    \ shape -> shape.draw() ); // 这里没有变化\n```\n\n这是 `开闭封闭原则`（`OCP`）的示例，我们将在 SOLID\
    \ 章节中介绍它。它是缩写词中的“O”。它很重要，因为它意味着我们可以保持代码对添加新功能开放——但对修改我们已知有效的现有代码保持关闭。\n\n# SOLID\
    \ 原则\n\n随着面向对象的程序规模越来越大，将系统拆分成许多小部分变得至关重要。\n\n但“拆分”意味着什么？到底什么是“小部分”呢？\n\n被称为 SOLID\
    \ 的五个设计原则是为了解决这些问题而提出的。它们的名字有些非常晦懂，但一旦你理解了它们解决的问题，就足够简单了。\n\n## 五大 SOLID 原则\n\n\
    让我们它们列出来，这样你就知道这个缩写词的含义了：\n\n*   `SRP` 单一责任原则 (Single Responsibility Principle)\n\
    *   `OCP` 开闭原则 (Open/Closed Principle)\n*   `LSP` 利可用夫替换原则 (Liskov Substitution\
    \ Principle)\n*   `ISP` 接口隔离原则 (Interface Segregation Principle)\n*   `DIP` 依赖倒原则\
    \ (Dependency Inversion Principle)\n\n你可以从首字母看到这个缩写。\n\n每个原则的标题都是真正意义上的术语。一旦你知道每个原则的含义，短标题就有意义了。但在那之前，它们没什么意义。\n\
    \n注意的是，这些原则的顺序是“听起来最好”的——而不是“最有用”。\n\n"
- fmt: "\nThere’s nothing remarkable about it, at first sight. We see the three sections\
    \ to fetch input, convert, display.\n\nBut notice `new` keyword. That’s a problem.\n\
    \nBecause of this new, the method has a `direct dependency` on how the keyboard\
    \ is read and how the output is displayed.\n\nIt also calls `System.out.println()`\
    \ for output, which has the same problem. We are tightly bound to a global method.\
    \ But let’s just consider input for now.\n\n### Why is ‘new’ such a problem?\n\
    \nThe `new` keyword itself is not a problem. It is *where it is in the code*.\n\
    \nDependencies like this are hard-coded. They cannot be changed.\n\nIf we wanted\
    \ a different input method, we would have to go into this method and change the\
    \ code. We would delete the two lines relating to `Scanner`, and replace them\
    \ with something else.\n\nThis doesn’t sound too bad for a four line method. But\
    \ as a design principle, it is exactly what we don’t want. We don’t want it so\
    \ that unrelated areas of code have to change.\n\nThink about it this way. What\
    \ is the main purpose of our little function? It is to change something into upper\
    \ case. Yes, it needs some input from somewhere to do that. But the function does\
    \ not need to know anything at all about how that input is obtained.\n\nThis is\
    \ where TDD really forces a good decision early.\n\nHow could we write a unit\
    \ test for our function? Spoiler: We couldn’t.\n\nWe would have to admit defeat.\
    \ We don’t have a way for the test to make keyboard input at this level. We are\
    \ locked-in to using a `Scanner` object.\n\nBut let’s re-phrase that question\
    \ and not give up: How *could* we write a unit test? What would we have to change?\n\
    \n### Inverting the input Dependency\n\nWhat we need is some way for this code\
    \ to fetch input, without knowing anything about how that is done.\n\nWe’ve seen\
    \ how to do that before. Our polymorphic `Shape.draw()` knew how to ask an object\
    \ to do something without knowing anything about how.\n\nLet’s use the same technique\
    \ here.\n\nWe’ll introduce an interface called `Input`, which we can ask to give\
    \ us some text:\n\n```\n1 interface Input {\n2     String fetch();\n3 }\n```\n\
    \nThis is an abstraction. It says ‘you can ask me for an input string, but leave\
    \ it to me to figure out where it will come from’.\n\nIt replaces the two lines\
    \ of code relating to the scanner in our example code.\n\n```\n1 public void showInputInUpperCase()\
    \ {\n2     String inputText = input.fetch();\n3 \n4     // Convert\n5     String\
    \ upperCaseText = inputText.toUpperCase();\n6 \n7     // Display\n8     System.out.println(upperCaseText);\n\
    9 }\n```\n\nI’ve also removed the comment. The interface makes it clear enough\
    \ without.\n\nAs it stands, this would not compile.\n\nWe need to make two more\
    \ changes:\n\n* Create an implementation of this interface\n* Add a parameter\
    \ or field `input` - so our method can use the interface\n\n### Making a concrete\
    \ KeyboardInput class\n\nWe can easily make our first implementation of this interface:\n\
    \n```\n1 class KeyboardInput implements Input {\n2     @Override\n3     public\
    \ String fetch() {\n4           Scanner scanner = new Scanner(System.in);\n5 \
    \          String inputText = scanner.nextLine();\n6           \n7           return\
    \ inputText;\n8     }\n9 }\n```\n\nWe’ve copied-and-pasted the `Scanner` code\
    \ into a new class that implements the interface. It is called `KeyboardInput`\
    \ because this class is allowed to know exactly where the input comes from.\n\n\
    This class is what is meant by inverting a dependency.\n\nThe old method newed\
    \ up the `Scanner` inside the method. It depended on `Scanner`.\n\nThe new method\
    \ code depends only on the interface. The new `KeyboardInput` class wraps up `Scanner`\
    \ and also depends on the interface. That’s the inversion part.\n\nWe’ve changed\
    \ the dependency from “method depends on Scanner” to “class containing Scanner\
    \ depends on interface”.\n\nThe dependency is precisely backwards to before. It\
    \ is inverted.\n\nThis thought process is known as the `DIP` Dependency Inversion\
    \ Principle.\n\n### Dependency Injection - using our inverted dependency\n\nOur\
    \ original method needs a way to use this inverted dependency.\n\nThe most typical\
    \ way is to inject it into a constructor:\n\n```\n 1 class TextConversion {\n\
    \ 2     private Input input ;\n 3     \n 4     // This is where we inject the\
    \ dependency\n 5     public TextConversion(final Input input) {\n 6         this.input\
    \ = input;\n 7     }\n 8     \n 9     public void showInputInUpperCase() {\n10\
    \         String inputText = input.fetch();\n11     \n12         // Convert\n\
    13         String upperCaseText = inputText.toUpperCase();\n14     \n15      \
    \   // Display\n16         System.out.println(upperCaseText);\n17     }\n18 }\n\
    ```\n\nand we would build a little application to wire it up and run it:\n\n```\n\
    1 public class TextUtility {\n2     public static void main(String[] commandLineArgs)\
    \ {\n3         Input input = new KeyboardInput();\n4         \n5         new TextConversion(input).showInputInUpperCase();\n\
    6     }\n7 }\n```\n\nRunning this, we get our original behaviour. This has a refactoring\
    \ exercise, not a feature change.\n\nCan you see how we have *externalised* the\
    \ details of keyboard input from the actual text conversion?\n\n### Swappable\
    \ input sources\n\nHere is the most remarkable thing about this. This design isolates\
    \ changes to the input source.\n\nIf we decided to change from using the keyboard\
    \ to a database, we would not change the `TextConversion` class. Nor would we\
    \ change the keyboard input.\n\nWe would write a new concrete class called `DatabaseInput`\
    \ that implemented the `Input` interface. We would wire that in our application\
    \ instead of the keyboard input:\n\n```\n1 public class TextUtility {\n2     public\
    \ static void main(String[] commandLineArgs) {\n3         Input input = new KeyboardInput();\n\
    4         \n5         new TextConversion(input).showInputInUpperCase();\n6   \
    \  }\n7 }\n```\n\n### Inverting the output to display\n\nIn the same way as abstracting\
    \ out the input, we can do the same thing for display output:\n\nCreate the interface:\n\
    \n```\n1 interface Output {\n2   display( String toDisplay );\n3 }\n```\n\nCreate\
    \ a concrete class to display to System out:\n\n```\n1 class ConsoleOutput implements\
    \ Output {\n2   @Override\n3   public void display( String message ) {\n4    \
    \ System.out.println( message );\n5   }\n6 }\n```\n\nInject both `Input` and `Output`\
    \ dependencies in the constructor:\n\n```\n1 class TextConversion {\n2     private\
    \ Input input ;\n3     private Output output ;\n4     \n5     public TextConversion(final\
    \ Input input, final Output output){\n6         this.input = input;\n7       \
    \  this.output = output;\n8     }\n9     \n10     public void showInputInUpperCase()\
    \ {\n11         String inputText = input.fetch();\n12         String upperCaseText\
    \ = inputText.toUpperCase();\n13         output.display(upperCaseText);\n14  \
    \   }\n15 }\n```\n\nAnd create the concrete classes in the application:\n\n```\n\
    1 public class TextUtility {\n2     public static void main(String[] commandLineArgs)\
    \ {\n3         Input input = new KeyboardInput();\n4         Output output = new\
    \ ConsoleOutput();\n5 \n6         new TextConversion(input, output).showInputInUpperCase();\n\
    7     }\n8 }\n```\n\nThat allows us to swap to any input or display source. We\
    \ only change the objects that get created with `new`. Nothing else.\n\nAnd *that*\
    \ helps us with our unit testing. We can swap the input for something we can control\
    \ and swap the output for something that captures anything sent to it.\n\nWe’ll\
    \ see how this works in the chapter on ‘TDD and Test Doubles’\n\n### Inversion\
    \ - Injection: two sides of the same coin\n\nIt’s quite common to have heard about\
    \ DIP, SOLID and DI frameworks like Spring, without ever connecting the dots.\n\
    \nDependency Inversion is the *design* technique. The thought process by which\
    \ we remove a hard-coded coupling from the software.\n"
