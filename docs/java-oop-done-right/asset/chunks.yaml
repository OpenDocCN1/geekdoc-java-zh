  trans: "\n这意味着我们需要另一个对象，它知道如何更详细地打印内容。让我们在这个对象上设计行为：\n\n```\n1 class Printer {\n\
    2     public void print( String text ) {\n3         // todo\n4     }\n5 }\n```\n\
    \n目前，假设我们只需要打印一个 `String` 值的能力。我们可以将实现留为 ‘todo’，稍后回来处理。\n\n我们现在可以给 `Item` 增加一个打印自己的方法：\n\
    \n```\n1 class Item {\n2     public void print( Printer p ) {\n3         // todo\n\
    4     }\n5 }\n```\n\n这是一种进展。\n\n我们正在向读者表达代码的高层设计和结构。我们是在告诉他们，我们有一个可以打印自己的 `Item`\
    \ 对象。为了实现这一点，它将与一个 `Printer` 对象协作。\n\n我想在这里停一下，并强调一下这里的思路。我们工作所展示的只有两个五行的类，其中每个方法都写着‘todo’。到目前为止，我不指望今年的年度薪酬审查中能获得多少奖金。\n\
    \n但这就是正确的 OOP（面向对象编程）的本质。这就是它之所以卓越的原因。我们首先作为*抽象*来设计系统的行为。抽象意味着“通用想法”或“无论你如何实现都始终为真的事”。\n\
    \n我们避免了陷入编码的细节中。相反，我们花时间表达我们的系统在做*什么*，每个大想法*在哪里*拆分，而不是*怎么*做到的。当然，“怎么做”非常重要。它只是重要性次于程序的结构。添加“怎么做”可以以后再做。\n\
    \n如果你用过低级语言编程，或者是编程的新手，你可能认出这是“反向”思维。我们习惯于直接切入细节。我过去也是这种方式处理代码的。我会带着一份详尽指令的“大购物清单”直接切入。\n\
    \n这导致了难以理解的代码。当我们阅读它时，必须通过逆向工程来理解正在操作什么。通过让我们的设计显式化，我们可以直接读出“做什么”。这回到了书的开头——我们的观点是\
    \ `clearScreen()` 比清空屏幕的二进制代码要容易理解得多。\n\n这里也一样。我们通过先设计 OOP 行为来防止那种混乱。\n\n总之，茶歇结束：回到编码中。我们的收据上只有一个\
    \ `Item`。让我们创建一个表示完整收据的聚合类：\n\n```\n1 class Receipt {\n2     public void print\
    \ () {\n3         // todo\n4     }\n5 }\n```\n\n我能想到的第一个行为是 `print()`。\n\n同样，在检查完需求后，我们会回到\
    \ `print` 的细节。但我们知道它会以某种方式与我们的 `Item` 对象协作并将它们打印出来。我们还记得之前的 `Item` 设计。它有一个接收 `Printer`\
    \ 对象的 `print()` 方法。\n\n让我们假设同一个 `Printer` 对象被用于打印整个收据。基于此，一个合理的设计决策是在 `receipt`\
    \ 的构造函数中传入一个 `Printer` 对象，并将其存储在字段中备用：\n\n```\n 1 class Receipt {\n 2     private\
    \ final Printer printer ;\n 3 \n 4     public Receipt( Printer p ) {\n 5     \
    \    this.printer = p;\n 6     }\n 7 \n 8     public void print () {\n 9     \
    \    // todo - using field 'printer'\n10     }\n11 }\n```\n\n更多的进展。我们的 `receipt`\
    \ 将能够打印自己了。\n\n但它需要东西来打印！我们将给它一个在收收据上添加项目的方法：\n\n```\n 1 class Receipt {\n 2 \
    \    private final Printer printer ;\n 3 \n 4     public Receipt( Printer p )\
    \ {\n 5         this.printer = p;\n 6     }\n 7 \n 8     public void add(String\
    \ description, Money price) {\n 9         // todo\n10     }\n11 \n12     public\
    \ void print () {\n13         // todo - using field 'printer'\n14     }\n15 }\n\
    ```\n\n又向前了一步。\n\n我在 `add()` 方法签名中做出了一个设计决策。这是基于需求的。该方法接受两个值参数——作为 `String` 的项目描述和作为\
    \ `Money` 对象的价格。我选择了这种方式而不是传入一个 `Item` 对象。也许我以后会改变主意。\n\n目前，思路是 `Item` 将保持在该类簇内部为私有，以减少调用者的耦合。耦合（Coupling）是描述不同代码段之间连接程度的技术术语。\n\
    \n我们需要一个 `Money` 类，但目前可以是空的。在这个阶段代码只需要能够编译：\n\n```\n1 class Money {\n2     //\
    \ TODO\n3 }\n```\n\n我们会在收据内部创建一个 `Item` 对象的列表，并使用 `add()` 向其添加：\n\n```\n 1 class\
    \ Receipt {\n 2     private final Printer printer ;\n 3     private final List<Item>\
    \ items = new ArrayList<>();\n 4 \n 5     public Receipt( Printer p ) {\n 6  \
    \       this.printer = p;\n 7     }\n 8 \n 9     public void add(String description,\
    \ Money price) {\n10         items.add( new Item(description, price) );\n11  \
    \   }\n12 \n13     public void print () {\n14         // todo - using field 'printer'\n\
    15     }\n16 }\n```\n\n这里是另一个设计决策。在 `Item` 类中需要一个接收 `Printer` 对象的构造函数。我们将传入 description\
    \ 和 price，从而提供 `Item` 所需的信息：\n\n```\n1 class Item {\n2     private String description;\n\
    3     private Money price;\n4 \n5     public Item( String description, Money price\
    \ ) {\n6         this.description = description;\n7         this.price = price;\n\
    8     }\n9 \n10    public void print( Printer p ) {\n11        // todo\n12   \
    \ }\n13 }\n```\n\n为了让这个值不可变，我将它们标记为 `final`：\n\n```\n1 class Item {\n2     private\
    \ final String description;\n3     private final Money price;\n4 \n5     public\
    \ Item( String description, Money price ) {\n6         this.description = description;\n\
    7         this.price = price;\n8     }\n9 \n10    public void print( Printer p\
    \ ) {\n11        // todo\n12     }\n13 }\n```\n\n标记 `final` 意味着这个值是不可变的（Immutable）。这使得并发环境（如\
    \ Web 服务器）中的系统更易推理且更安全。\n\n这种反向工作，为你的 IDE 提供它所需的所有线索。在 `Receipt` 类中输入 `new Item(description,\
    \ price)`，IDE 会提供创建 `Item` 的构造函数。\n\n我们到那里了。下一步工作是填充一些打印的细节。让我们从外部向内部开始，先坚持大图的想法：\n\
    \n```\n 1 class Receipt {\n2     private final Printer printer ;\n3     private\
    \ final List<Item> items = new ArrayList<>();\n 4 \n5     public Receipt( Printer\
    \ p ) {\n6         this.printer = p;\n7     }\n 8 \n9     public void add(String\
    \ description, Money price) {\n10         items.add( new Item(description, price)\
    \ );\n11     }\n12 \n13     public void print () {\n14         items.forEach(item\
    \ -> item.print(printer));\n15     }\n16 }\n```\n\n我们添加了一行 Java 8 Lambda 风格的代码来打印所有项目。它使用了“指令而非请求”（Tell\
    \ Don’t Ask）风格来遍历所有的 `Item` 对象并要求每个对象打印自己。我们将我们在 `Receipt` 构造函数中提供的 `Printer`\
    \ 对象传递该打印方法。\n\n这就是良好的协作设计的示例。\n\n我们没有通过 getter 和 setter 从对象中提取数据。我们甚至没有在考虑“数据”。嗯，我没有考虑。我把价格和描述看作是\
    \ `Item` 负责自己保留的“秘密知识”。当然，这有点像文字游戏；但它帮助我将 OO 设计看作由行为驱动，而非纯数据。\n\n这仍然是一个大图的想法。`Receipt`\
    \ 并不知道 `Item` 对象看起来什么样，也不知道如何处理打印。它只知道零或多个 `Item` 对象，并且它们可以被要求打印。这真的是创建代码的一种非常简单且具有描述性的方式。\n"
- fmt: "\nLet’s add the ‘how’ detail to the `Item.print()` method. “At last!”, you\
    \ might think. But don’t celebrate too long - it will pose another design challenge\
    \ for us. Let’s do the simplest thing first:\n\n```\n 1 class Item {\n 2     private\
    \ final String description;\n 3     private final Money price ;\n 4 \n 5     public\
    \ Item( String description, Money price ) {\n 6         this.description = description;\n\
    \ 7         this.price = price;\n 8     }\n 9 \n10     public void print( Printer\
    \ p ) {\n11         p.print(description);\n12         p.print(\" \");\n13    \
    \     price.print(p);\n14 \n15         p.newline();\n16     }\n17 }\n```\n\nOne\
    \ consequence is we need to add a `newline()` method to `Printer`. It should move\
    \ on to the next line, the next time any `print()` method is called.\n\nCan you\
    \ see the design decision I’m talking about?\n\nIt is ‘which object should be\
    \ responsible for knowing how to format the Item on a line?’\n\nTricky. It’s not\
    \ a difficult choice, but we have alternatives to consider.\n\nWhat I went with\
    \ above was to print the `description` as a string, `assume` that one space can\
    \ be printed to separate the price, then `delegate` responsibility for formatting\
    \ price to the `Money` object. This means we need to add a `print(Printer p)`\
    \ method to `Money`.\n\nThis method knows about the `Printer` class, and also\
    \ knows how to format a `Money` object suitable for printing.\n\nCode review/pairing\
    \ time: What do we think?\n\nI’m not sure.\n\nFor a simple system, a proof of\
    \ concept, or an example in an early chapter of a book on OOP (ahem), this is\
    \ adequate. It will work.\n\nHowever, it has a number of code smells to me:\n\n\
    * The visual formatting will look wrong\n* Why would `Money` know about `Printer`?\
    \ And `Printer`-specific formatting?\n* Why is the knowledge of formatting one\
    \ `Item` split over two classes?\n* How hard is it to read the code and know what\
    \ to expect?\n\nThe real heart of OOP collaboration design is this. So far, it’s\
    \ been all plain sailing. But concerns like this - that don’t easily map onto\
    \ any existing single object - are the ones where we have to stop and think.\n\
    \nThere are two options at this point. We can just press on. Leave it as it is\
    \ and revisit the choice later. Or we can improve the structure now.\n\nIt is\
    \ easy to over-engineer at this point, adding complicated features and structures\
    \ that we will never need and no-one else will ever be able to read. Later chapters\
    \ will cover ideas for knowing when to stop. In particular, Test Driven Development\
    \ will actively limit the amount of change we make per step. The YAGNI principle\
    \ (‘You ain’t gonna need it’) helps focus our mind.\n\nBut for now, let’s take\
    \ the opportunity to fix this - with another collaboration. As usual, behaviours\
    \ first, details later:\n\n```\n 1 class Item {\n 2     private final String description;\n\
    \ 3     private final Money price ;\n 4 \n 5     public Item( String description,\
    \ Money price ) {\n 6         this.description = description;\n 7         this.price\
    \ = price;\n 8     }\n 9 \n10     public void print( Printer p ) {\n11       \
    \  new ItemFormat(description, price).print(p);\n12     }\n13 }\n```\n\nWe’ve\
    \ introduced an object responsible for formatting an `Item` object for print.\
    \ We’ve given it all the information it needs to do that job. As ever, we’re leaving\
    \ the details until later. The first cut of the object will be a simple refactor.\
    \ We will put the insides of the previous `Item print` method into the `ItemFormat\
    \ print` method. We’ll then make those detailed decisions about who-does-what\
    \ between `description`, `Printer` and `Money` later.\n\nIt’s time to build out\
    \ a small test app for this. First, we need to make our `Printer` class do something.\
    \ We’ll add that `newline` method. We will also decide to use console output:\n\
    \n```\n1 class Printer {\n2     public void print(String text) {\n3         System.out.print(text);\n\
    4     }\n5 \n6     public void newline() {\n7         System.out.println();\n\
    8     }\n9 }\n```\n\nFill in that `Money` class to include a `print()` behaviour\
    \ plus supporting ‘secret knowledge’:\n\n```\n 1 class Money {\n 2     private\
    \ final String amount ;\n 3     private final String currency ;\n 4 \n 5     public\
    \ Money( String amount, String currency ) {\n 6         this.amount = amount;\n\
    \ 7         this.currency = currency;\n 8     }\n 9 \n10     public void print(\
    \ Printer p ) {\n11         p.print(currency);\n12         p.print(amount);\n\
    13     }\n14 }\n```\n\nA real `Money` class in Java will store the `amount` as\
    \ `BigDecimal`. This is a fixed precision, accurate way to represent decimal fractions\
    \ - pounds and pence. The `float` and `double` types are never used as they trade\
    \ size for precision. The higher the amount in a `float`, the less accurate the\
    \ value stored is. Very bad for banks.\n\nOur first stab at `ItemFormat` is from\
    \ our simple refactor:\n\n```\n 1 class ItemFormat {\n 2     private final Money\
    \ price ;\n 3     private final String description ;\n 4 \n 5     public ItemFormat(\
    \ String description, Money price ) {\n 6         this.description = description;\n\
    \ 7         this.price = price ;\n 8     }\n 9 \n10     public void print( Printer\
    \ p ) {\n11         p.print(description);\n12         p.print(\" \");\n13    \
    \     price.print(p);\n14     }\n15 }\n```\n\nAdd a demo application:\n\n```\n\
    1 class ReceiptDemo {\n2     public static void main(String[] commandArgs) {\n\
    3         new ReceiptDemo().run();\n4     }\n5 \n6     private void run() {\n\
    7         Receipt r = new Receipt( new Printer() );\n8 \n9         r.add(\"Brie\"\
    , new Money(\"1.95\", \"GBP\"));\n10         r.add(\"Tiger Bread\", new Money(\"\
    0.95\", \"GBP\"));\n11         r.add(\"Merlot\", new Money(\"7.95\", \"GBP\"));\n\
    12 \n13         r.print();\n14     }\n15 }\n```\n\nAnd spin it up to see:\n\n\
    ```\n1 Brie1.95\n2 Tiger Bread0.95\n3 Merlot7.95\n```\n\n## Review of design so\
    \ far\n\nLet’s look back at our design. We started with behaviours on our objects.\
    \ The design was driven by behaviours. These were supported inside our objects\
    \ with hidden knowledge (`price`, `description`) and hidden algorithms (`items.forEach()`\
    \ and `ItemFormat print()`).\n\nWait, I need to include the `Receipt` class:\n\
    \n```\n1 class Receipt {\n2     private final Printer printer;\n3     private\
    \ final List<Item> items = new ArrayList<>();\n4 \n5     public Receipt(Printer\
    \ printer) {\n6         this.printer = printer;\n7     }\n8 \n9     public void\
    \ add(Item item) {\n10        items.add(item);\n11    }\n12 \n13    public void\
    \ print() {\n14        for (Item item : items) {\n15            item.print(printer);\n\
    16            printer.newline();\n17        }\n18    }\n19 }\n```\n\n### Exercise:\
    \ Total Amount\n\nA new requirement comes in as an agile User Story:\n\n* As a\
    \ customer\n* I want to see the total price\n* So that I know what I need to pay\n\
    \nHow would we drive that slice through, behaviour first?\n\n*Hint:* Change the\
    \ field `Money.amount` to a `BigDecimal`. Avoid the temptation to add a `getAmount()`\
    \ method to `Money`. Think of how the `Money` object could collaborate with some\
    \ other object, responsible for keeping track of the total and printing it on\
    \ our `Printer` object.\n"
