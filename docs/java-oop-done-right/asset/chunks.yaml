- fmt: "\n![](resources/title_page.png)\n\n![Java OOP Done Right](resources/title_page.png)\n\
    \n# Java OOP Done Right\n\n### Create object oriented code you can be proud of\
    \ with modern Java\n\n#### Alan Mellor\n\nThis book is for sale at [http://leanpub.com/javaoopdoneright](http://leanpub.com/javaoopdoneright)\n\
    \nThis version was published on 2021-04-05\n\n![publisher's logo](resources/leanpub-logo.png)\n\
    \n* * * * * *\n\nThis is a [Leanpub](http://leanpub.com) book. Leanpub empowers\
    \ authors and publishers with the Lean Publishing process. [Lean Publishing](http://leanpub.com/manifesto)\
    \ is the act of publishing an in-progress ebook using lightweight tools and many\
    \ iterations to get reader feedback, pivot until you have the right book and build\
    \ traction once you do.\n\n* * * * * *\n\n© 2021 Alan Mellor. All rights reserved.\n\
    \nTo Reverend Mike Cavanagh\n\nYou’ve inspired me in more ways than you know.\n\
    \nYou once said I would make a good consultant, “but I didn’t have the stories\
    \ yet”.\n\nIt’s taken a while, but here they are.\n\n## Table of Contents\n\n\
    ## Guide\n\n1. [Begin Reading](#chap00.xhtml)\n\n# Preface\n\nWhy another book\
    \ on OOP in Java?\n\nI’ve been a writer on Quora for a few years now. I really\
    \ enjoy it. I get to interact with people from all over the world about a subject\
    \ I love - the craft of designing good software. I started learning this craft\
    \ in 1981. I haven’t finished yet.\n\nThis book came about after seeing a common\
    \ thread amongst new Java developers on Quora. Many of them thought OOP in Java\
    \ was ‘verbose’ or ‘complex’ or ‘outdated’. And that it needed ‘getters and setters’\
    \ everywhere.\n\nYet we’ve had great books on Java, as well as classics on OOP.\n\
    \nSo what changed?\n\nHere’s my theory. All the great books were written in the\
    \ 1990s - before some of our modern Java developers were even born. The reason\
    \ nobody knows the lessons in them is simple. We don’t teach them anymore.\n\n\
    This book is my distillation of those classic ideas plus a twist of experience.\
    \ Each chapter contains stuff I actually use, day to day, to get results. It’s\
    \ full of hard-won wisdom from 25 years at the code face. It’s practical. And\
    \ very simple. Bugs hide in complexity. I like to give bugs no place to hide.\n\
    \nMy hope is this book gets you past ‘getter and setter’ coding and gets you into\
    \ high gear using objects as they were intended to be used. It might be your first\
    \ insight into how OOP fits together in the real world. Java has a reputation\
    \ for being verbose. I hope this book shows you how to fix that. I want you to\
    \ take away the techniques of crafting clean, powerful, readable OOP code.\n\n\
    This book is not an introduction to Java. It should be suitable for beginners\
    \ who can write Java “Hello World” and understand the basic syntax for variables,\
    \ conditionals and classes. Examples use Java 11 syntax. Many work in Java 1.\n\
    \nAlan Mellor\n\nRock Cottage\n\nFebruary 2021\n\n# Optimise for Clarity\n\nBefore\
    \ we start, here’s the big theme of this book:\n\nProgramming is all about explaining\
    \ to another human what the computer happens to be doing at any given moment.\
    \ As a by-product, it also tells the computer what to do.\n\nThe reason this is\
    \ so important is that what the computer *actually* runs is almost incomprehensible\
    \ to anyone.\n\nAs an example, if I write this:\n\n```\n1 clearScreen();\n```\n\
    \nyou can understand that I want the computer to clear everything off the screen,\
    \ leaving it blank.\n\nThe computer can’t though. It’s as dumb as rocks. Literally.\
    \ Silicon chips are made of Silicon Dioxide - Sand.\n\nWe need to pass this code\
    \ through some kind of translator to turn this into the language of the computer.\
    \ One that looks nothing like English.\n\nOne of my old computers would need something\
    \ like this:\n\n```\n1   LD HL, 4000H  00100001 00000000 01000000\n2   LD DE,\
    \ 4001H  00010001 00000001 01000000\n3   LD BC, 6143   00000001 11111111 00010111\
    \ \n4   LD (HL), 0    00110110 00000000\n5   LDIR          11101101 10110000\n\
    ```\n\nWhere the assembly language on the left was *still* a human-readable form.\
    \ The binary on the right was what that computer ran on its Z80A microprocessor.\n\
    \nI know which one I like better.\n\nThe art of programming is making programs\
    \ clear. Readable. Easy to skim read. No tricks.\n\nIt is the difference between\
    \ having to read all that binary and work out that it meant ‘clear the screen’,\
    \ compared to reading `clearScreen()`.\n\nIn a working professional team, nobody\
    \ has the time, money, or desire to do that. Ever.\n\nThis book is all about.\n\
    \n## What is an object, anyway?\n\nThe art of programming is making programs clear.\
    \ Readable. Easy to skim read. No tricks.\n\nIt is the difference between having\
    \ to read all that binary and work out that it meant ‘clear the screen’, compared\
    \ to reading `clearScreen()`.\n\nIn a working professional team, nobody has the\
    \ time, money, or desire to do that. Ever.\n\nThis book is all about.\n\n## What’s\
    \ all this got to do with Java?\n\nAs an object oriented language, Java was designed\
    \ to reflect the real world, like in our example. It allows us to write code that\
    \ speaks about Postman and Letter and `deliver()` and so on. It allows us to write\
    \ computer code that reads like an English description of our problem. Not like\
    \ code.\n"
