  trans: "\n从图形上看，我们可以将其绘制为两个同心六边形。\n\n内部六边形是我们的领域层。这些是纯应用程序类。领域层是应用逻辑以及我们对外部系统抽象的地方\
    \ - 例如 `UserRepository` 这样的接口。\n\n外部六边形包含适配器类。它们持有与外部系统通信的细节，并实现了这些接口。\n\n我们使用六边形是因为每个外表面都可以代表一个外部系统。大多数代码涉及的外部系统不超过六个。六边形很容易画。它们是一个很好的通用图形化模板。\n\
    \n![](img/hexarch.png)\n\n# 六边形架构\n\n我们有两个简单的规则来确保设计正确：\n\n* 适配器层（Adapter Layer）实现接口并使用来自领域层（Domain\
    \ Layer）的类。它可以依赖领域层。\n* 领域层（Domain Layer）**严禁**使用来自适配器层的类。\n\n领域层对适配器层一律一无所知。它对外部系统没有任何依赖。它们在我们的领域层中根本不存在。这里没有任何对数据库、Web\
    \ 服务器或任何其他内容的引用。它只知道业务逻辑 - 即我们问题的核心。\n\n这有助于可读性和测试。\n\n适配器层是外部系统细节唯一出现的地方。这里是复杂的\
    \ SQL 语句、HTTP 调用、HTML 模板等内容的所在地。\n\n这种划分帮助我们限制在更改外部系统技术时需要修改的代码范围。\n\n想把像 `Postgres`\
    \ 这样的 SQL 数据库换成像 `Mongo` 这样的 NoSQL 数据库吗？你编写一个新的适配器类并将其注入。你的领域层保持不变。领域层的测试也保持不变。这是一个巨大的优势。\n\
    \n六边形架构依赖多态和 SOLID 原则来工作。适配器层实现的接口是完全可替换的，因为它们遵循 `LSP`。每个适配器类只做一件事，遵循 `SRP`。这样，领域层对外部系统的改变开放，而无需修改。它遵循\
    \ `OCP`。\n\n## 反转 / 注入：硬硬币的两面\n\n在非正式对话中，开发者谈论依赖注入（Dependency Injection）和依赖反转（Dependency\
    \ Inversion）时，就好像它们是同一回事一样。\n\n它们并不是。但两者密切相关。\n\n依赖**反转**（Dependency Inversion）发生在设计阶段。那是我们创建如\
    \ `UserRepository` 这样的抽象接口的时候。\n\n依赖**注入**（Dependency Injection）发生在运行阶段。那是我们将如\
    \ `PostgresUserRepository` 这样的实现传递给消费 `UserRepository` 接口的调用代码的时候。\n\n它们在六边形架构中结合在一起，构建出一个可扩展、可测试的系统。\n\
    \n# 处理错误\n\n如果一切都按计划进行，那不是很好吗？\n\n……然后你回到了房间。现实生活是混乱的。事情会出问题。\n\n软件设计也面临着大量的意外状况。\n\
    \n困惑的用户、蓄意的攻击和硬件故障都意味着今天的业务无法按常理进行。\n\n问题是“针对这些我们该怎么办？”\n\n## 三类错误\n\n虽然可以写一整本书来讨论“计算机系统中发生的故障”，但所有错误都可以归结为三种类型之一：\n\
    \n* 我们能修复的错误\n* 我们无法修复的错误\n* 我们不在乎的错误\n\n每种错误的示例包括：“用户输入了错误的数字”（重新询问）、“磁盘驱动器崩溃并丢失所有数据”（噢，运气不好）、“当温度功能关闭时温度传感器未工作”（忽略）。\n\
    \n检测错误是一回事。但随后我们必须让软件知道它的存在。我们需要一种机制来实现这一点。\n\nJava 和面向对象编程（OOP）有几种可用方法。每种方法都有自己的权衡。\n\
    \n让我们使用 `UserRepository` 的一个运行示例。`User findUserById(id)` 方法应该始终返回且仅返回一个 `User`\
    \ 对象。`User` 对象有一个方法 `showProfile()`，它显示个人资料信息 - 在状态良好的情况下。\n\n为了保持代码示例简洁，我们将孤立地显示该方法，它只返回错误情况。不要去寻找“快乐路径”（happy\
    \ path）代码，因为根本没有。\n\n我们如何告诉调用代码出问题了？\n\n## 空引用\n\n起初，有 `null`。`null` 是没有形状的。是危险的。`null`\
    \ 遍布 Java 的世界……\n\n```\n1 User findUserById( String userId ) {\n2     return null\
    \ ;\n3 }\n```\n\n我们都见过这个。自 `Java 1.0` 以来它就深植于 Java 之中。\n\n`null` 的概念是由计算机科学巨匠托尼·霍尔（Tony\
    \ Hoare）发明的他还发明了快速排序（Quicksort），这是一个好主意。与 `null` 不同。\n\n托尼将 `null` 描述为他的“十亿美元错误”。\n\
    \n从理论上讲返回 `null` 是可以的。该方法要么返回一个可用的 `User` 对象，要么返回 `null`。\n\n调用代码必须检查 `null` 返回值并决定做什么。\n\
    \n这些问题包括在代码中充斥着错误路径，所有那些需要编写和测试的额外 `if` 语句路径 - 以及忘记测试的风险。\n\n如果 `findUserById(id)`\
    \ 返回 `null`，任何进一步的访问将惨惨失败：\n\n```\n1   User u = users.findUserById( \"alan0127\"\
    \ );\n2   u.showProfile(); // 如果 u 为 null，则会因 NullPointerException 崩溃\n```\n\n\
    返回 `null` 让调用代码因为两条路径而变得复杂。这是一场等待发生的事故。你会在某个时刻忘记检查 `null`。你会的。你知道你会。我知道你会。我知道我也会！\n\
    \n接下来的所有内容都是一种相当绝的尝试，旨在通过设计消除由未处理的 `null` 引用引起的 bug。\n\n## 空对象模式\n\nBobby Woolf\
    \ 在 1998 年提出了一个合理的尝试。被称为“空对象模式”（Null Object Pattern），它利用多态性返回两个对象之一。要么返回有效的 `User`，要么返回\
    \ `NullUser` 对象：\n\n```\n1 User findUserById(String id) {\n2     return NullUser();\n\
    3 }\n```\n\n`NullUser` 完全（符合 LSP）可以替换 `User`。我们可以通过通过让 `User` 成为接口并创建 `RealUser`\
    \ 和 `NullUser` 来实现。或者，我们可以简单一点，创建一个带有 `NullUser` 子类的 `User` 类。\n\n无论哪种方式，`NullUser`\
    \ 的 `showProfile` 方法都是“无操作”：\n\n```\n1 class NullUser extends User {\n2     public\
    \ void showProfile() {\n3         // 无操作\n4     }\n5 }\n```\n\n通过消除条件分支简化了代码 -\
    \ 这是我们的大目标。这简化了 TDD 测试。这一切都加速了阅读和理解这些内容。\n\n## 僵尸对象\n\n不过 `NullUser` 有点儿糟糕：那整套子类东西。\n\
    \n我听过伙伴们抱怨：“我们只需要一个类，现在你又增加了两个三个！行了，Al - 简单点！”\n\n这是一个很有道理的。尽管你可以争辩说你*并不只需要一个类。你正在代表两个不同的想法\
    \ - 存在的 User 和不存在的 User。\n\n但和伙伴争论真的有点俗。所以，让我们都去给自己泡杯友好的热茶，再思考一下。\n\n我们还能做什么？\n\
    \n“僵尸对象”（Zombie object）之所以得名，是因为它表示 `null` 的方式就像是“行尸”：对象的外部看起来正常，但内部是坏的。\n\n我们必须修改\
    \ `User` 类来添加一个“僵尸检测”方法：\n\n```\n1 class User {\n2     boolean isValid() {...}\n\
    3 \n4     void showProfile() {...}\n5 }\n```\n\n`isValid()` 方法告诉我们对象是否有有效数据。如果\
    \ `isValid()` 返回 false，你就不能使用该对象。你每次使用该对象时都必须先检查这一点。\n"
- fmt: "\n```\nUser u = findUserById(\"alan0127\");\n\nif ( u.isValid() ) {\n    u.showProfile();\n\
    }\n```\n\nThis is a judgement call. Is this any better than null and null checks?\n\
    \nMy view is “sometimes, yes”. The minor improvement in readability can be worth\
    \ having. Using ‘Optimise for Clarity’ as our guiding principle, sometimes this\
    \ makes the calling code more descriptive.\n\nYou’ll have to decide for yourself.\
    \ But if you see code like this written by others, this is why. That distinctive\
    \ pattern of `if (object.isValid()) { /* use object */ }` is the signature of\
    \ a Zombie object.\n\n## Exceptions - a quick primer\n\nThere is another mechanism\
    \ entirely to report things have gone South in Java.\n\nExceptions have been present\
    \ since the start. They are an alternative control flow mechanism. Because of\
    \ that, they are rather controversial.\n\nLet’s see how they are used in this\
    \ code snippet:\n\n```\n 1 class ExceptionsDemo {\n 2   public void demonstrateExceptions()\
    \ {\n 3     try {\n 4         System.out.println(\"This will print out 1\");\n\
    \ 5         methodWhichThrowsAnException();\n 6 \n 7         // Line below will\
    \ never run ...\n 8         System.out.println(\"This code will never be run 2\"\
    );\n 9     }\n10     catch( RuntimeException e ) {\n 11       System.out.println(\"\
    You will see this - exception caught\");\n 12 \n 13       System.out.println(\"\
    Exception message was: \" + e.getMessage());\n 14     }\n 15   }\n 16 \n 17  \
    \ private void methodWhichThrowsAnException() {\n 18       System.out.println(\
    \ \"This will print out 2\" );\n 19       throw new RuntimeException(\"Used to\
    \ report an error\");\n 20 \n 21       // Unreachable code - this will never run\n\
    \ 22       System.out.println(\"This code will be be run 1\");\n 23   }\n 24 }\n\
    ```\n\nThe big idea here is that the keyword `throw` when it runs changes the\
    \ execution flow. It stops running code in sequence at that point. The code will\
    \ immediately exit whatever method it is in, without executing any more lines\
    \ of that function. It is a form of early return statement.\n\nSignificantly,\
    \ if the method was supposed to return something, that will not happen. Nothing\
    \ is returned. Not null. Nothing at all.\n\nThe `throw` keyword is designed to\
    \ be paired up with the `try` and `catch` keywords, in a construct called a try-catch\
    \ block.\n\nIf some method throws an exception inside a `try` block, then code\
    \ execution will resume starting at the first line of the matching `catch` block.\n\
    \nThe `throw` keyword has a parameter. This parameter should be an object instance\
    \ that either is - or extends - one of the two built-in classes `Exception` or\
    \ `RuntimeException`.\n\nThe `catch` keyword has a matching parameter that receives\
    \ the object used in the `throw` statement. It is a way of passing information\
    \ with the exception object, to give diagnostics information to the `catch` block\
    \ code.\n\nIn the example, the text passed into the `RuntimeException` object’s\
    \ constructor will be displayed by code in the `catch` block.\n\nYou can see how\
    \ exceptions allow a method to be simply terminated early and control passed to\
    \ a `catch` block - called an exception handler.\n\nExceptions are a powerful\
    \ way of signalling ‘There was an error. I could not continue executing that method.\
    \ Here’s why’.\n\nBut they are controversial.\n\nIn practice, there are three\
    \ ways of using exceptions.\n\n## Design By Contract, Bertrand Meyer style\n\n\
    Inventor of the Eiffel language Bertrand Meyer had an excellent idea about methods\
    \ and exceptions.\n\nHe proposed that a method call was a contract between the\
    \ code inside the method and its calling code. Our `findUserById(id)` method declares\
    \ a binding contract: if you call that method, you *will* receive a valid `User`\
    \ object.\n\nMeyer saw exceptions as the way to indicate ‘that contract cannot\
    \ be satisfied’. You would throw an exception in the `findUserById()` method if\
    \ for any reason a `User` object could not be returned. The contract had been\
    \ broken.\n\nIn this view of exceptions, they are commonplace. You can write calling\
    \ code that relies on the contract being met:\n\n```\n 1 try {\n 2   User u =\
    \ findUserById( \"alan0127\" );\n 3 \n 4   // if we reach here, we are guaranteed\
    \ User u is valid\n 5   // due to our contract\n 6   u.showProfile();\n 7 }\n\
    \ 8 catch( Exception e ) {\n 9     // if we reach here, we know the User object\
    \ was invalid\n110     // we can handle that\n 11 }\n```\n\nSeen in this way,\
    \ exceptions clean up calling code. They eliminate null passing. They eliminate\
    \ conditionals. Indeed they design-out the idea that a returned object might be\
    \ invalid. That is not possible. You either get your result or an exception.\n\
    \nJava fully supports this. It even provides an extra tool. If exception classes\
    \ are made to extend `Exception`, the Java compiler will enforce that the exception\
    \ is either caught at the call site, or is declared as being thrown up the call\
    \ stack.\n\nBy contrast, anything extending `RuntimeException` doesn’t have as\
    \ much scrutiny. It’s actually the preferred way, these days, of using exceptions.\n\
    \n## Fatal errors: Stop the world!\n\nAnother view on exceptions is that you only\
    \ use them for an unfixable problem that needs to stop the program immediately.\n\
    \nThese will be a `RuntimeException` (or subclass) that is thrown and never caught.\
    \ The Java Virtual Machine will then kill whatever thread was running when that\
    \ uncaught exception happened. If that happens to be the main thread, the program\
    \ exits.\n\n## Combined approach: Fixable and non-fixable\n\nA third way combines\
    \ the two.\n\nWe use exceptions to represent fixable errors. We use different\
    \ exceptions to represent non-fixable errors.\n\nThe classic example is a timeout\
    \ on an access to an unreliable system, say a REST service call that may fail\
    \ if the network is down:\n\n```\n 1 for (int attempts = 0; attempts < 3; attempts++)\
    \ {\n 2     try {\n 3         callUnreliableService();\n 4         return ; //\
    \ happy path - exit the method\n 5     }\n 6     catch( ServiceTemporUnavailableException\
    \ se ) {\n 7         Thread.sleep(1000); // wait one second\n 8     }\n 9 }\n\
    \ 10 \n11 throw new ServiceUnavailableException();\n```\n\nThis snippet calls\
    \ a method `callUnreliableService()`. That may fail by throwing `ServiceTemporUnavailableException`.\
    \ That may well be a temporary glitch. So we wait a second, to give things a chance\
    \ to recover, then try again.\n\nIf it hasn’t worked three times in a row, we\
    \ admit defeat and throw the `ServiceUnavailableException`. This exception tells\
    \ the calling code that it has a problem, and should work around it, or terminate\
    \ the program.\n"
