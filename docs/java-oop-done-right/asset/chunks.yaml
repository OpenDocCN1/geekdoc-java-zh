    \ good public interface. We do this *before* writing code inside our object. This\
    \ forces us to think about making the calling code simple. Our ‘backwards thinking’\
    \ of OOP again.\n\nThis piece of code is known as the test code. It will set up\
    \ our object, call a behavioural method on it, and then check whether that method\
    \ worked or not.\n\nThis test does two things for us:\n\n*   verifies the behaviour\
    \ is correct\n\n*   verifies the call is easy to make - a hallmark of good design\n\
    \nIf our design is hard to set up or hard to use, we’ll see that in hard to read\
    \ test code.\n\nJava projects use the wonderful JUnit test framework to help out\
    \ with this. I like to add AssertJ to help with the checking part.\n\nLet’s use\
    \ TDD to build a little calculator that can add up our restaurant bill. As you\
    \ follow along, notice the *rhythm* of TDD - write a bit of test, see a failure,\
    \ fix it with a bit of code, repeat.\n\nOur calculator class should do two things:\n\
    \n*   give us a running total of all the items we’ve added\n\n*   add another\
    \ item.\n\nWe start by writing an empty test. We want this test to prove something\
    \ that will be true of our BillCalculator class as soon as we create it. If we\
    \ create this object and don’t add any items to it, the total must be zero.\n\n\
    Let’s start to write a test for that.\n\n## First test: total starts at zero\n\
    \n```\n1 class BillCalculatorTest {\n2     @Test\n3     public void totalStartsAtZero()\
    \ {\n4         // ... todo\n5     }\n6 }\n```\n\nWe’ve got a test class and a\
    \ test harness method all named for what they do.\n\nNow we do a tiny step of\
    \ design for our object. We want to be able to access the latest running total.\
    \ For this, despite all my bleating in previous chapters, a getTotal() method\
    \ seems like the simplest, most clear design.\n\nLet’s add this design decision\
    \ to the test:\n\n```\n1 class BillCalculatorTest {\n2     @Test\n3     public\
    \ void totalStartsAtZero() {\n4         // Act\n5         float total = calculator.getTotal();\n\
    6     }\n7 }\n```\n\nThe compiler will be loudly complaining at this point, as\
    \ indeed might you if this is your first TDD session: “There isn’t any object\
    \ yet!”\n\nQuite right. Let’s fix that.\n\nUsing your IDE shortcuts, create a\
    \ new Class called BillCalculator:\n\n```\n1 class BillCalculator {\n2 }\n```\n\
    \nNow, we can fix the first of our compiler’s many complaints and create a calculator\
    \ object:\n\n```\n 1 class BillCalculatorTest {\n 2     @Test\n 3     public void\
    \ totalStartsAtZero() {\n 4         // Arrange\n 5         var calculator = new\
    \ BillCalculator();\n 6 \n 7         // Act\n 8         float total = calculator.getTotal();\n\
    \ 9     }\n10 }\n```\n\nI’m using the ‘var’ keyword from recent Java editions\
    \ (don’t ask me which one; I never was a language lawyer kind of guy). I think\
    \ this reads very clearly here.\n\nThe compiler will grudgingly accept we are\
    \ now not complete idiots and remove the red X from under ‘calculator’. It will\
    \ then move on to its next complaint. We need to add the getTotal() method.\n\n\
    Let the IDE shortcuts do this, because the IDE has all the information it needs\
    \ to get it right:\n\n```\n1 class BillCalculator {\n2     public float getTotal()\
    \ {\n3         return 0.0;\n4     }\n5 }\n```\n\nI love working backwards like\
    \ this. The IDE has enough information to do most of the grunt work *and* not\
    \ make as many typing mistakes as I do. It’s also a very fast way to work once\
    \ you get into the rhythm of it. You even look (to the clueless) like a *10x mega\
    \ ninja rock star programmer*.\n\nAnyway. The compiler will be happy, allowing\
    \ us to add our check that everything is ok. We’ll use the wonderful ‘AssertJ’^([1](#chap20.xhtml_fn-assertJ))\
    \ library to provide the ‘assertThat’ method.\n\n```\n 1 class BillCalculatorTest\
    \ {\n 2     @Test\n 3     public void totalStartsAtZero() {\n 4         // Arrange\n\
    \ 5         var calculator = new BillCalculator();\n 6 \n 7         // Act\n 8\
    \         float total = calculator.getTotal();\n 9 \n10         // Assert\n11\
    \         assertThat(total).isZero();\n12     }\n13 }\n```\n\nWe can run this\
    \ test - and it will pass! Our calculator object has passed its first and only\
    \ test. It just so happens that the only thing we are testing is that the total\
    \ is zero and the IDE generated code always returns zero.\n\n## Arrange, Act,\
    \ Assert - a rhythm inside each test\n\nNotice how writing our code by designing\
    \ behaviours first resulted in the test having three sections.\n\nWe first decided\
    \ on the behavioural method and added a call to it. This is known as the ‘act’\
    \ step - where we take action.\n\nWe also decided what that method should return.\
    \ This means we know how to test it by comparing it to an expected value. This\
    \ is the ‘assert’ step - we make an assertion about the output and confirm it\
    \ is true.\n\nAnd finally, we’re going to need an object to test! This is the\
    \ ‘arrange’ step, where we make all necessary arrangements for the test to begin.\
    \ Here, we create objects, wire up and collaborators and load initial values.\n\
    \nEvery test we write has this rhythm: Arrange, Act, Assert^([2](#chap20.xhtml_fn-aaaNote)).\n\
    \n## Red, Green, Refactor - a rhythm in between tests\n\nAfter writing our first\
    \ test, we can get on to the real meat of development. We iteratively add features\
    \ to our code one test at a time.\n\nBefore we do, TDD has one extra rhythm to\
    \ guide us: Red, Green, Refactor.\n\n**Arrange, Act, Assert** guides us *inside*\
    \ a test, helping us write clean test code and remember all the required pieces.\n\
    \n**Red, Green, Refactor** helps us discover *emergent design*. It happens in\
    \ between tests.\n\nThe rhythm goes like this.\n\nA ‘red’ test means we have written\
    \ a test which fails. This gets us running code quickly. It proves that the test\
    \ is working; it correctly reports that the code we have not yet written is not\
    \ yet working.\n\nWe follow the Arrange, Act, Assert process to get to a ‘green’\
    \ test. At this point, we have added just enough production code to make the test\
    \ pass. In one sense, the code is ‘finished’.\n\nBut it isn’t.\n\nIf we continue\
    \ working this way, I guarantee you will end up with a giant mass of unreadable\
    \ spaghetti. Quite often, the process of TDD takes the blame for this, when it\
    \ hasn’t been done right. A bit like how people whack getters and setters everywhere,\
    \ then blame OOP.\n\nIt’s because we’ve missed a step. That missing step is ‘Refactor’.\n\
    \nRefactoring is where we look at our code and improve its design - *without*\
    \ changing how it works. We change the structure, not the behaviour.\n\nThe best\
    \ book on this by far is “Refactoring: Improving the design of existing code”\
    \ by Martin Fowler [^refBook]. The first edition has Java examples and is the\
    \ one to read. I really recommend that you do."
