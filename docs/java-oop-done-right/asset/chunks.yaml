  trans: "\n我的建议是从短语的开头去掉噪音词。这是一个测试用例，所以我们不需要说诸如 `shouldCalculateTotalAsZero`、`returnsTotalAsZero`\
    \ 或 `checkThatTotalIsZero` 这样的话。\n\n我们绝对*不需要*编写像下面这样笨重的测试名称：\n\n```\n1   @Test\n\
    2   public void BillTest_calculateTotal_isZero() {\n3      // JUST SAY NO!!!!!\n\
    4   }\n```\n\n### 为什么？\n\n对我来说，这回到了方法的整个核心思想：方法是小型的抽象，让我们的代码变得不那么复杂。\n\n我们并不是在描述测试*是如何*构建的。我们甚至没有在描述我们正在测试的方法是*如何*实现的。我们描述的是我们想要正在测试的方法*做什么*。\n\
    \n我们应该使用简洁的、以结果为驱动的测试名称。读者应该能够快速读出测试期望生产代码做什么。这提高了代码的可读性，并简化了日后重构生产代码内部实现的工作。\n\
    \n敏捷意味着我们可以对对象向调用者隐藏的秘密改变想法。我们在测试名称中也反映了这种思考。\n\n## TDD 与 OOP - 天生一对\n\nTDD 与面向对象编程（OOP）天生契合。OOP\
    \ 的本质是从外向内设计对象。而 TDD 是为这一过程提供脚手架。\n\n我们看到了两种引导我们的节奏：\n\n*   准备（Arrange）、执行（Act）、断言（Assert）\n\
    *   红（Red）、绿（Green）、重构（Refactor）\n\n我们已经看了 `YAGNI`（以及它的偷径近亲 `YAYA`）如何帮助我们防止代码过度复杂。我们看到了如何对代码改变想法，花精力在过程中进行改进。我们还看到了\
    \ TDD 如何帮助我们通过一个又一个测试长出一个“尺寸合适”的设计。\n\n这些思想是极端编程（XP）的核心。这种“左移”（即更早揭示）了逻辑、设计和代码清晰度的任何问题。\n\
    \n## FIRST 测试是可用的测试\n\n我们喜欢软件开发中的缩写，所以又提出了一个缩写来帮助我们设计单元测试：FIRST。\n\n每个单元测试都应该是：\n\
    \n*   **快速 (Fast)**：它应该运行得很快（毫秒级）\n*   **独立 (Independent)**：每个测试都可以单独运行。每个测试不需要任何其他测试先运行，也不需要任何硬件设置\n\
    *   **可重复 (Repeatable)**：每次测试运行时都会给出相同的结果。它的反面是*不稳定的（flaky）*测试\n*   **自检 (Self-checking)**：测试自动检查输出。如果你需要人类来操作，它就不是一个\
    \ FIRST 测试\n*   **及时 (Timely)**：每个测试编写花费的时间与其所测试的代码花费的时间差不多\n\n早前的代码示例都是 FIRST\
    \ 测试。\n\n保持测试符合 FIRST 原关重要。它是拥有能够帮助你开发代码的有用测试的关键。违背了 FIRST，你得到的只有经理才会喜欢的测试。\n\n\
    ## 现实世界的 TDD\n\n在继续之前，分享一些在真实项目中使用 TDD 的经验是值得的。正如预期的，一切并不像我刚才描述的那么美好。\n\n### 优点\n\
    \n我是 TDD 的忠实粉丝。它确实加快了开发速度（是的，真的）。开发周期要比启动三个服务、一个 Docker 化的数据库、Node 加上一个 React\
    \ UI，然后点击五个屏幕来测试你的账单能否相加两项物品要快得多。\n\n每次代码更改时获得的回归测试在减少 Bug 修复成本和维护客户声誉方面是价值连城的。\n\
    \nTDD 给了我很多对自己工作的信心。它让我能把事情拆分成我有限的脑力可以处理的小块。我以前在运行代码之前会一次性写几百行代码。现在我完全不知道自己是怎么做到的。\n\
    \n### 缺点\n\n有些团队不喜欢 TDD 并拒绝使用它。\n\nTDD 仅适用于清晰的设计，且这种设计被拆分以允许测试访问代码。遗留代码通常无法使用\
    \ TDD。在被称为代码的巨大乱面条团中，你无法获得所需的访问权限。\n\n我曾遇到有人嫉妒我使用 TDD，他们在团队中让我的生活变得艰难。他们似乎觉得这在某种程度上显示了他们的低劣，而且这是我故意为之的。最好让大家达成共识。\n\
    \n当你*无法*预先决定一个方法应该做什么时，TDD 完全不起作用。虽然这听起来显而易见，但很多现实世界的开发都是实验性的。\n\n你正在摸索，试图弄清楚哪些代码可能有效。你可能正在为一个尚未完全规范的功能连接你并不理解的库。\n\
    \n这里的解决方案是进行一次*探针实验（spike）*。忘记测试：直接乱写（Hack）。对有效的内容以及实现这些内容的代码粗略形状做笔记。撤销探针实验，然后使用\
    \ TDD 按照你的笔记进行适当的工程实现。\n\n### 糟糕\n\nTDD 在错误的人手中会创造出真正巨大的混乱。想象一下蹒跚儿童拿着马克笔画出的那种混乱。\n\
    \n问题在于，TDD 并不会——也无法——为你设计代码。这就是为什么我在这本书中把它放在 OOP 思想之后。它就是做不到。\n\n相反，TDD 给你提供的是*设计反馈*。这里有三个经典的测试代码异味：\n\
    \n*   混乱的准备步骤（Arrange Step）：你的对象与其他对象的耦合过紧了。拆分它。\n*   混乱的执行步骤（Act Step）：你的对象使用模式太复杂了：简化它。\n\
    *   混乱的断言步骤（Assert Step）：结果难以使用。重新思考它。\n\n通常发生的情况是这些测试异味被忽视了。时间压力、缺乏领导，或者可能是缺乏知识。\n\
    \n## 多态 - OOP 皇冠上的明珠\n\n到目前为止，面向对象编程中最有效的工具是多态。它是后续所有内容的关键。\n\n它完全关于创建可以替换的对象。\n\
    \n多态为我们提供了条件逻辑的良好替代方案。它允许我们以非常有趣划分程序。我们可以隔离测试代码，与外部系统解耦并减少 if/switch 语句。\n\n在\
    \ Java 代码中使用这种技术有几种方法。让我们看看最清晰的方法。\n\n### 经典示例：Shape.draw()\n\n经典示例是 `Shape.draw()`。它简单且很好地传了观点。\n\
    \n这个示例的核心是几个类，每个类都知道如何绘制单个形状。Circle 会画圆形。Square 画正方形。我们需要一段可以绘制所有这些形状的代码，同时允许我们在未来轻松添加更多。\n\
    \n### Shape 接口\n\n我们从纯接口开始。这个接口定义了实现它的对象必须支持的行为。这就是赋予我们多态的部分。\n\n它是对所有调用代码的承诺：任何实现\
    \ Shape 的对象都有我们可以调用的 `draw()` 方法。\n\n```\n1 interface Shape { \n2   void draw();\
    \ \n3 } \n```\n\n我非常喜欢这一点表达了*设计意图*。\n\n我在告诉代码的读者，所有的 Shape 对象在被要求时都知道如何自己画。这是调用代码需要知道的唯一事情：它可以调用\
    \ `draw()`\n\n为了让这个示例变得有用，我们需要创建一些具体类，隐藏如何绘制它们特定形状的细节。\n\n为了简化这个示例，`draw()` 将形状的文本描述写入到控制台。一个更完整的示例向\
    \ `draw()` 传递一个 `Display` 对象，这让我们能够访问图形操作。我们将在书后面看到它。\n\n现在，让我们专注于探索多态的基础，并让 `draw()`\
    \ 在不同的对象中执行不同的操作。\n"
- fmt: "\n```\nclass Circle implements Shape { \n  public void draw() { \n    System.out.println(“Look\
    \ how round I am”); \n  } \n}\n```\n\nThis is a class that knows how to draw a\
    \ circle. Just for this example, that means it writes some text to the console.\n\
    \n```\nclass Square implements Shape { \n  public void draw(){ \n    System.out.println(“Four\
    \ sides all the same for me”); \n  } \n}\n```\n\n`Square` is a class that knows\
    \ how to draw a square.\n\n# Tell Don’t Ask - the key to OOP\n\nThis allows you\
    \ to write code that takes any `Shape` and asks it to draw itself. This is the\
    \ Tell Don’t Ask principle in action. Think back to our object basics chapter,\
    \ where we talked about not telling people how to do their jobs. We just ask them\
    \ to do them. This is how that works out in code.\n\nIt’s magic, and we’ll talk\
    \ about why in a minute. But first, let’s see how the calling code looks:\n\n\
    ```\nvar shapes = new ArrayList<Shape>(); \n\nshapes.add( new Circle() ); \nshapes.add(\
    \ new Square() ); \n\nshapes.forEach( shape -> shape.draw() ); \n```\n\nThis snippet\
    \ makes a list of objects that implement `Shape`. It adds instances of `Circle`\
    \ and `Square` to that list. It uses the Java 8 `forEach` method to go through\
    \ each object in the list and call the `draw()` method on it.\n\nBecause `draw()`\
    \ is polymorphic, the Java runtime routes the call to the code in the `implementing\
    \ class`. Even though the calling code appears to call the same `draw()` method\
    \ each time, *it doesn’t*. The runtime routes it down to whatever actual class\
    \ it finds.\n\nThe output looks like\n\n> Look how round I am\n\n> Four sides\
    \ all the same for me\n\nLet’s talk about that magic I mentioned. You’ll notice\
    \ a couple of brilliant things about this.\n\n*   No `if` or `switch` statements\n\
    *   No `instanceof` statements (ugh! Just, no)\n*   The loop code does not know\
    \ what kinds of shapes are in the list\n*   We can add new shapes without affecting\
    \ any others\n\nHaving no `if` or `switch` statements is a huge win. An alternative\
    \ approach is to have a single `draw()` method that has a giant `switch` statement\
    \ in:\n\n```\npublic void draw() {\n    // DO NOT DO THIS!!!\n    \n    switch(\
    \ shapeType ) {\n        case \"CIRCLE\":\n          System.out.println(“Look\
    \ how round I am”);\n          break;\n        \n        case \"SQUARE\":\n  \
    \        System.out.println(“Four sides all the same for me”);\n          break;\n\
    \        \n        default:\n          throw new IllegalArgumentException(\"Unknown\
    \ Shape type \" + shapeType)\n    }\n}\n```\n\nYou can see how code like that\
    \ grows and grows as new shapes get added. The code itself is complex, as all\
    \ conditionals are. They have extra possible execution paths through the code.\
    \ Each one needs testing. Each one increases the chance of coding mistakes.\n\n\
    The polymorphic approach completely separates those pieces of code. The `Circle`\
    \ class has no connection at all to the `Square` class. That would not be true\
    \ in our ‘giant switch statement’ case. So changes to one do not affect the other.\n\
    \nThe other result that follows is that adding a new shape is easy.\n\n```\nclass\
    \ Triangle implements Shape {\n  void draw() {\n    System.out.println(\"I really\
    \ like having three points\");\n  }\n}\n```\n\n*The draw loop code is completely\
    \ unchanged - but can now draw triangles*\n\nTo add in our triangle, we only have\
    \ to make an addition to our object creation code:\n\n```\nvar shapes = new ArrayList<Shape>();\
    \ \n\nshapes.add( new Circle() ); \nshapes.add( new Square() ); \nshapes.add(\
    \ new Triangle() ); // The only new line of code\n\nshapes.forEach( shape -> shape.draw()\
    \ ); // No change here\n```\n\nThis is an example of the `Open/Closed Principle`\
    \ (`OCP`) which we will cover in the chapter on SOLID. It is the “O” of the acronym.\
    \ It is important because it means we can keep code open for adding new features\
    \ to - but closed against changing existing code that we know works.\n\n# The\
    \ SOLID Principles\n\nAs object oriented programs grow large in size, it gets\
    \ more essential to split that system apart into little pieces.\n\nBut what does\
    \ ‘split apart’ mean? And what is a ‘little piece’, exactly?\n\nThe five design\
    \ principles known as SOLID came about as solutions to this. They have some pretty\
    \ indecipherable names but are easy enough - once you understand what problems\
    \ they solve.\n\n## The five SOLID principles\n\nLet’s just list them out, so\
    \ you know what the acronym means:\n\n*   `SRP` Single Responsibility Principle\n\
    *   `OCP` Open/Closed Principle\n*   `LSP` Liskov Substitution Principle\n*  \
    \ `ISP` Interface Segregation Principle\n*   `DIP` Dependency Inversion Principle\n\
    \nYou can see the acronym in the first letters.\n\nThe titles of each principle\
    \ are jargon in the proper sense. Once you know what each one means, the short\
    \ titles make sense. But until then, they won’t mean much.\n\nIt’s important to\
    \ note that the order of these is ‘what sounds best’ - not ‘what is most useful’.\n"
