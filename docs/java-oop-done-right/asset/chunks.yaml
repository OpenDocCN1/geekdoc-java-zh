    \nMany different kinds of objects share a similar “shape”.\n\nBy the mid-1990s,\
    \ this had been learned, but from the other way around. The behaviours of a Customer\
    \ object were seen to be more or less the same as a Member object, which were\
    \ more or less the same as a Patient object. Sure, there were specific extra behaviours\
    \ - but why the similarity? What was behind that?\n\nThinking back to our User.greet()\
    \ example, we might have a Customer class with a welcome() method. It’s a different\
    \ class name, and a different method - but the same basic idea.\n\nThis is known\
    \ as a *Design Pattern*.\n\nObjects form *patterns* at the design level. Groups\
    \ of objects jump out as having a similar behaviours in one subject area as they\
    \ do in another.\n\nA pattern gives us a jump-start on our designs. We can start\
    \ with something similar and tailor it to our needs. We’re buying an off the peg,\
    \ mass-produced object design and tweaking it, rather than cutting cloth ourselves.\n\
    \nAnd mangling our metaphors. I do apologise.\n\nThe 1990s jumped on this idea\
    \ with vigour. It gave rise to several books, papers, journals and conferences.\
    \ Some were good, some were seminal, some were rather forgettable.\n\nThe rest\
    \ of this chapter is my take on patterns. These are the ones I use professionally,\
    \ with my explanations of how I understand them.\n\nBefore we dive in, I want\
    \ to raise one important distinction about where patterns fit. It’s related to\
    \ mechanism and domain.\n\n## Mechanism and Domain\n\nAny piece of software consists\
    \ of two broad parts: Mechanism and Domain.\n\n**Mechanism** covers things which\
    \ are the details of how stuff works. Things like assignments, loops, branches\
    \ and object definitions. The insides of methods,\n\n**Domain** is the actual\
    \ subject matter area. Things like Rental Agreements, Inventory, Orders, Cancellation\
    \ Policy, User. The outside of methods and their classes.\n\nThis distinction\
    \ is important when studying design patterns because patterns exist at both levels.\
    \ They solve different problems.\n\nEarlier patterns solved mechanism issues and\
    \ came up with things like Iterators and Strategy patterns. Later attempts looked\
    \ at solving domain problems, coming up with things like ItemDescription-Item\
    \ and Order-OrderLineItem patterns.\n\nLike the rest of this book, the split is\
    \ about *how* things work versus *what* they achieve.\n\nHere are the patterns\
    \ I have found most useful. I’ll use some initials to say which book I found them\
    \ in first:\n\n*   **GoF** Design Patterns by the ‘Gang of Four’ ISBN 978-0201633610\n\
    \n*   **DDD** Domain Driven Design by Eric Evans ISBN 978-0321125217\n\n*   **Coad**\
    \ Java modeling in color, Peter Coad et. al. ISBN 978-0130115102\n\n*   **C2WIKI**\
    \ The C2 Wiki at https://wiki.c2.com/"
