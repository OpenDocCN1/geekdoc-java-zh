    \ a difficult choice, but we have alternatives to consider.\n\nWhat I went with\
    \ above was to print the description as a string, *assume* that one space can\
    \ be printed to separate the price, then *delegate* responsibility for formatting\
    \ price to the Money object. This means we need to add a print(Printer p) method\
    \ to Money.\n\nThis method knows about the Printer class, and also knows how to\
    \ format a Money object suitable for printing.\n\nCode review/pairing time: What\
    \ do we think?\n\nI’m not sure.\n\nFor a simple system, a proof of concept, or\
    \ an example in an early chapter of a book on OOP (ahem), this is adequate. It\
    \ will work.\n\nHowever, it has a number of code smells to me:\n\n*   The visual\
    \ formatting will look wrong\n\n*   Why would Money know about Printer? And Printer-specific\
    \ formatting?\n\n*   Why is the knowledge of formatting one Item split over two\
    \ classes?\n\n*   How hard is it to read the code and know what to expect?\n\n\
    The real heart of OOP collaboration design is this. So far, it’s been all plain\
    \ sailing. But concerns like this - that don’t easily map onto any existing single\
    \ object - are the ones where we have to stop and think.\n\nThere are two options\
    \ at this point. We can just press on. Leave it as it is and revisit the choice\
    \ later. Or we can improve the structure now.\n\nIt is easy to over-engineer at\
    \ this point, adding complicated features and structures that we will never need\
    \ and no-one else will ever be able to read. Later chapters will cover ideas for\
    \ knowing when to stop. In particular, Test Driven Development will actively limit\
    \ the amount of change we make per step. The YAGNI principle (‘You ain’t gonna\
    \ need it’) helps focus our mind.\n\nBut for now, let’s take the opportunity to\
    \ fix this - with another collaboration. As usual, behaviours first, details later:\n\
    \n```\n 1 class Item {\n 2     private final String description;\n 3     private\
    \ final Money price ;\n 4 \n 5     public Item( String description, Money price\
    \ ) {\n 6         this.description = description;\n 7         this.price = price;\n\
    \ 8     }\n 9 \n10     public void print( Printer p ) {\n11         new ItemFormat(description,\
    \ price).print(p);\n12     }\n13 }\n```\n\nWe’ve introduced an object responsible\
    \ for formatting an Item object for print. We’ve given it all the information\
    \ it needs to do that job. As ever, we’re leaving the details until later. The\
    \ first cut of the object will be a simple refactor. We will put the insides of\
    \ the previous Item print method into the ItemFormat print method. We’ll then\
    \ make those detailed decisions about who-does-what between description, Printer\
    \ and Money later.\n\nIt’s time to build out a small test app for this. First,\
    \ we need to make our Printer class do something. We’ll add that newline method.\
    \ We will also decide to use console output:\n\n```\n1 class Printer {\n2    \
    \ public void print(String text) {\n3         System.out.print(text);\n4     }\n\
    5 \n6     public void newline() {\n7         System.out.println();\n8     }\n\
    9 }\n```\n\nFill in that Money class to include a print() behaviour plus supporting\
    \ ‘secret knowledge’:\n\n```\n 1 class Money {\n 2     private final String amount\
    \ ;\n 3     private final String currency ;\n 4 \n 5     public Money( String\
    \ amount, String currency ) {\n 6         this.amount = amount;\n 7         this.currency\
    \ = currency;\n 8     }\n 9 \n10     public void print( Printer p ) {\n11    \
    \     p.print(currency);\n12         p.print(amount);\n13     }\n14 }\n```\n\n\
    A real Money class in Java will store the amount as BigDecimal. This is a fixed\
    \ precision, accurate way to represent decimal fractions - pounds and pence. The\
    \ float and double types are never used as they trade size for precision. The\
    \ higher the amount in a float, the less accurate the value stored is. Very bad\
    \ for banks.\n\nOur first stab at ItemFormat is from our simple refactor:\n\n\
    ```\n 1 class ItemFormat {\n 2     private final Money price ;\n 3     private\
    \ final String description ;\n 4 \n 5     public ItemFormat( String description,\
    \ Money price ) {\n 6         this.description = description ;\n 7         this.price\
    \ = price ;\n 8     }\n 9 \n10     public void print( Printer p ) {\n11      \
    \   p.print(description);\n12         p.print(\" \");\n13         price.print(p);\n\
    14     }\n15 }\n```\n\nAdd a demo application:\n\n```\n 1 class ReceiptDemo {\n\
    \ 2     public static void main( String[] commandLineArgs ) {\n 3         new\
    \ ReceiptDemo().run(); \n 4     }\n 5 \n 6     private void run() {\n 7      \
    \   Receipt r = new Receipt( new Printer() );\n 8 \n 9         // Nice cheese\
    \ and wine evening\n10         r.add(\"Brie\", new Money(\"1.95\", \"GBP\"));\n\
    11         r.add(\"Tiger Bread\", new Money(\"0.95\", \"GBP\"));\n12         r.add(\"\
    Merlot\", new Money(\"7.95\", \"GBP\"));\n13 \n14         r.print();\n15     }\n\
    16 }\n```\n\nAnd spin it up to see:\n\n```\n1 Brie GBP1.95\n2 Tiger Bread GBP0.95\n\
    3 Merlot GBP7.95\n```\n\n### Review of design so far\n\nLet’s look back on our\
    \ design.\n\nWe started with behaviours on our objects.\n\nThe design was driven\
    \ by behaviours. These were supported inside our objects with hidden knowledge\
    \ (price, description) and hidden algorithms (items.forEach() and the formatting\
    \ of ItemFormat.print() )\n\nObjects were designed to do one small part of the\
    \ job.\n\nObjects collaborated with each other to get the whole job done.\n\n\
    The IDE helped us fill out implementation details, once we had decided them.\n\
    \nDesign was done ‘backwards’. We left all details until last. We prioritised\
    \ getting the code structure right first.\n\nChanging this software will be simpler.\
    \ Splitting the job into separate objects will limit the impact of changes.\n\n\
    Object Oriented code looks different. Chains of behaviour get driven out by design.\
    \ High level abstractions - the ‘what’, not ‘how’ - are first class citizens of\
    \ our code. The details can be changed at will. Want to replace that items.forEach()\
    \ line with a for loop? Go ahead. It will make no difference to the rest of the\
    \ program.\n\nWe have planned a limited degree of resilience to change. ItemFormat\
    \ will help us change the output format whilst limiting what code needs to change.\
    \ Printer could have its insides changed to write to a real inkjet printer, say.\
    \ The rest of the code would not change.\n\nLater chapters will cover an even\
    \ better way of allowing swapping out one kind of Printer for another, without\
    \ changing the inside of Printer at all. That’s what Dependency Inversion is all\
    \ about. We shall meet it as one of the SOLID principles.\n\nBut looking back\
    \ at our code even now, we can see the power of behaviours.\n\n### Exercise: Total\
    \ Amount\n\nA new requirement comes in as an agile User Story:\n\n*   As a customer\n\
    \n*   I want to see the total price\n\n*   So that I know what I need to pay\n\
    \nHow would we drive that slice through, behaviour first?\n\n*Hint:* Change the\
    \ field Money.amount to a BigDecimal. Avoid the temptation to add a getAmount()\
    \ method to Money. Think of how the Money object could collaborate with some other\
    \ object, responsible for keeping track of the total and printing it on our Printer\
    \ object.\n\n# Test Driven Development"
