  trans: "\n一个 Web 请求已经到达，假设它是 RESTful 格式，例如 `GET /users/alan0127`。我们将编写一个 `Adapter`\
    \ 从路径参数中提取 `alan0127` 的 `userId`，然后将其存储在请求对象中：\n\n```\n1 class FindUserByIdRequest\
    \ {\n2     private final String userId ;\n3 \n4     public FindUserByIdRequest(\
    \ String userId ) {\n5         this.userId = userId;\n6     }\n7 }\n```\n\n到目前为止，我们隐藏了提取出来的\
    \ `userId`。接下来，我们需要从仓库（repository）中找到这个用户。我们之所以这样做，是因为我们现在完全处于内部六边形之中——即纯领域模型。我们的\
    \ `UserRepository` 就住在那里：\n\n```\n 1 interface UserRepository {\n 2     User findUserById(\
    \ String userId );\n 3 }\n 45 class FindUserByIdRequest {\n 6     private final\
    \ String userId ;\n 7 \n 8     public FindUserByIdRequest( String userId ) {\n\
    \ 9         this.userId = userId;\n10     }\n11 \n12     public User execute(\
    \ UserRepository users ) {\n13         return users.findUserById( userId );\n\
    14     }\n15 }\n```\n\n我们添加了 `execute()` 方法，并为其提供某种类型的 `UserRepository` 实现。它可以是单元测试的存根（stub），也可以是生产环境中类似于\
    \ `PostgresUserRepository` 的真实实现。`execute` 接收我们之前存储的 `userId`，运行 `findUserById()`\
    \ 查询并返回 `User` 对象。\n\n然后，我们的 Web 层 `Adapter` 类将获取 `User` 对象并将其格式化为 Web 响应。\n\n\
    在过去遥远的年代，这将是一个 HTML 响应。但在过去的几年里，服务器端 HTML 生成被浏览器中的 JavaScript 取代。我们可能会返回一段 JSON\
    \ 格式的数据给 `React`（或 `Angular`、或 `Vue`、或原生 JS……）应用程序，由它们来格式化以进行显示。\n\n这是一个非常直接的模式，名其实其实。它的价值在于将各种技术与业务逻辑分离开来。使用符合\
    \ Liskov 原则（LSP）的替换对象作为我们的接口，这使其变成了一个可以自由组合的系统。驱动网站的同一个领域模型可以同样轻松地驱动用 `JavaFX`\
    \ 编写的桌面 GUI，也可以驱动控制台程序。\n\n## 反面模式\n\n设计模式虽然强大，但很容易被过度使用。有几种需要避免的反面模式。\n\n###\
    \ 设计模式大汤 (Design Pattern Soup)\n\n不要创建一个“大杂烩”式的设计。\n\n每当你发现自己写了 `class StrategyFactoryFactoryBuilder`\
    \ 时，正如我的朋友 Jenny 所的那样，你需要“去角落里和自己好好谈谈”。\n\n你之所以掉进这个兔子洞可能是有原因的。但如果可能，请尝试通过重新设计来跳出来。如果这不可行，就给这个怪物重命名。回到基础：从*应用程序*的角度来看，这个怪兽给了我们什么？它为什么要在这里？\n\
    \n### 不可需要的灵活性 (Unneeded Flexibility)\n\n不要过度设计对象。\n\n你可能会为了“以备将来扩展”而添加一种模式。也许我们简单的\
    \ `User` 对象可以长出一个 `Observer`（观察者模式），允许未来的代码监听用户名的变化。\n\n我们直接把它删掉，好吗？\n\n让未来随它去吧。我们的水晶球还不够灵。我们不知道未来什么样的代码是最好的。\n\
    \n即使需求真的落地了，我们往往发现当它到来时，情况已经变了。我们最初对未来代码所作出的假设是错误的。那些代码现在变成了我们必须编写变通方案的过时垃圾。\n\
    \n只写今天的代码。让明天去照顾它自己。我们将根据需要进行重构。\n\n### 机制疯狂 (Mechanism Madness)\n\n不要过度强调某事是如何工作的。\n\
    \n我们在这里回到了基础。良好的设计强调某物能给你什么，而不是它由什么组成。\n\n不要直接复制粘贴模式，而是将它们融合其中。\n\n如果我们的 `User`\
    \ 对象*确实*需要用于名称变化的 `Observer` 模式，让我们不要叫它名字。创建一个名为 `NameChanged` 的接口，而不是 `Observer`。\n\
    \n模式本就应该是这样融合在一起使用的。否则，它们将仅仅是固定代码的库。那样它们就会失去价值。\n\n# OOP 错误 - OOP 哎！\n\n到目前为止，我们涵盖了良好使用\
    \ OOP 的方法。\n\n我们看到了许多让代码易读、易于测试且紧凑的技术。还记得如何将 `Repository`、`Cache` 和 `Decorator`\
    \ 结合起来，并获得可插式的加速提升吗？\n\n事实证明，并不是人都同意 OOP 是一件好事。\n\n在某些方面，当然他们是对的。很多事情根本就不适合 OOP。我想起简单的批处理脚本、构建脚本以及设置基础设施的\
    \ `Terraform` 脚本。我们还有“无服务器设计”（Serverless Designs），它们使用许多小函数来完成工作。OOP 在那里往往会成为障碍。\n\
    \n非 OOP 设计的另一个驱动因素是处理能力的限制。\n\n几十年来，CPU 遵循摩尔定律。计算能力每两年翻一倍。但随后遇到了物理极限。CPU 上的晶体管数量达到了能容纳的最大值。“无法改变物理定律！”《星际迷》中的\
    \ Scottie 曾如此；光刻也是如此。晶体管只能做到那么小，不能更小了。然后物理学开始反击。\n\n为了解决这个问题，CPU 创建了多核心——在同一块芯片上创建多个\
    \ CPU 设计副本。\n\n这影响了软件设计。突然，我们需要并行处理而不是顺序处理。原本在对象内部的状态在跨核心通信时变得困难。函数式编程——无状态编程——在这里是有用的。\n\
    \n然而，这些并不是让 OOP 声名扫地的原因。让它名扫地的是*错误的 OOP*。\n\n## 封装错误 - Getter 泛滥 (Getters Galore!)\n\
    \n在我糟糕设计的榜单上，第一是一个非常常见的错误：\n\n```\n1 class User {\n2     private String name ;\n\
    3 \n4     // 这写起来很痛苦 ...\n5     public String getName() {\n6         return name\
    \ ;\n7     }\n8 \n9     // 也是如此\n10     public void setName( String name ) {\n\
    11         this.name = name;\n12     }\n13 }\n14 \n15 class UserGreeter {\n16\
    \ \n17     // 我发誓精灵和小猫正在死去\n18     public void greet( User u ) {\n19         System.out.println(\
    \ u.getName() );\n20     }\n21 }\n```\n\n我们见过——到处都是 getter 和 setter！\n\n这让我感到难过。真的。\n\
    \n现在，公平地说，Java 对此有很大责任。从 1.0 版本开始，Java 就有了这种“JavaBeans”的概念，就像上面的 User 一样。你有字段，但每个字段都有\
    \ getter 和 setter。不知为何，这变成了一种行业标准，并且到处都是。\n\n这在理解了过程化编程但尚未学习 OOP 的开发者中流行起来。他们还没有学会对象暴露行为并隐藏秘密。\n\
    \n当你以这种方式思考时，每个问题看起来都是 getter 和 setter。当人们批评 OOP 没有实现其承诺时——但基于这种代码——问题所在之处显而易见：这错在他们。如果你甚至没有意识到自己的代码不是\
    \ OOP，就不要因为你的代码而埋怪 OOP！\n\n## 继承错误 (Broken Inheritance)\n\n作为 90 年代初的宠儿，继承本该是魔法的！你用继承把几个类组合在一起，砰！你的代码就完成了。\n\
    \n但并没有完成。相反，它只是一团糟。\n\n继承有几个缺陷。它们就是如今在“OOP 已死”博客文章中出现的那些。\n"
- fmt: "\nLet’s learn from the classics of that particular genre.\n\n## Bird extends\
    \ Animal\n\nI roll my eyes anytime I read `class Animal` in an example, in exactly\
    \ the same way as I do when I see a dead end in a horror movie.\n\nHere’s how\
    \ the problem unfolds. We start with an `Animal` base class with methods `eat()`\
    \ and `makeNoise()`. We add a subclass of `Dog`. Then we add a subclass of `Bird`\
    \ adding a `fly()` method. Then two subclasses of `Bird`, traditionally `Sparrow`\
    \ and `Dodo`. The `Dodo` cannot fly, so we maybe throw an exception or do nothing\
    \ in `Dodo.fly()`.\n\nThe whole mess looks like this:\n\n```\n 1 abstract class\
    \ Animal {\n 2     abstract void eat();\n 3     abstract void makeNoise();\n 4\
    \ }\n 5 \n6 class Dog extends Animal {\n 7     void eat() {\n 8         System.out.println(\"\
    Meat\");\n 9     }\n10 \n11     void makeNoise() {\n12         System.out.println(\"\
    Woof\");\n13     }\n14 }\n15 \n16 abstract class Bird extends Animal {\n17   \
    \  abstract void fly();\n18 }\n19 \n20 class Sparrow extends Bird {\n21     void\
    \ eat() {\n22         System.out.println(\"Seeds\");\n23     }\n24 \n25     void\
    \ makeNoise() {\n26         System.out.println(\"Cheep cheep\");\n27     }\n28\
    \ \n29     void fly() {\n30         System.out.println(\"Flap flap\");\n31   \
    \  }\n32 }\n33 \n34 \n35 class Dodo extends Bird {\n36     void eat() {\n37  \
    \       System.out.println(\"Nothing, extinct\");\n38     }\n39 \n40     void\
    \ makeNoise() {\n41         System.out.println(\"No sound, extinct\");\n42   \
    \  }\n43 \n44     void fly() {\n45         throw new UnsupportedOperationException(\"\
    error: cannot fly\");\n46     }\n47 }\n```\n\nThere are a couple of things wrong\
    \ with this, which the calling code would reveal quickly. Oddly enough, the “OO\
    \ is dead” examples never include unit tests or calling code, do they? Funny,\
    \ that …\n\nThe key issue is the broken contract of `Bird.fly()` when we inherit\
    \ that method in `Dodo`.\n\nA `Dodo` cannot fly, so the expected contract “make\
    \ it fly” cannot be met.\n\nThat’s a misuse of inheritance - technically a misuse\
    \ of a static type to incorrectly model a behaviour that does not exist. It fails\
    \ LSP. We know we should not use inheritance when LSP is going to be broken. It\
    \ is not a good fit.\n\nThat’s a problem, yet the bigger point is usually missed\
    \ entirely in these articles. Why does `Bird` even derive from `Animal`? They\
    \ don’t have many use cases in common.\n\nRecall how we do this right. We start\
    \ outside-in and design behaviours we want our objects to have. If we are going\
    \ to treat our objects polymorphically, then we make sure that all the objects\
    \ can respond to the same methods.\n\nHow about in this case? No way is it going\
    \ to work like that.\n\nThink about what the calling code needs for polymorphism.\
    \ It wants some `Base` classes to use. If it uses `Animal`, then `Bird` does not\
    \ exist - the calling code will never see `Bird`, just `Animal`. You cannot call\
    \ `fly()` on an `Animal`. If it uses `Bird`, then `Animal` does not *need* to\
    \ exist. `Bird` simply has three methods `eat()`, `makeNoise()` and `fly()`. You\
    \ could simply put those into a `Bird` interface, and the calling code has no\
    \ clue whether an `Animal` is involved or not.\n\nNeither `Animal` nor `Bird`\
    \ makes a good base class for this. Yet here we are, proudly showing an inheritance\
    \ tree of useless base classes, in an article saying OOP doesn’t work. Good job.\
    \ Loving your work …\n\nThe fundamental problem missed is that you cannot call\
    \ any of this in a Tell-Don’t-Ask polymorphic style. You have to know whether\
    \ you have only an `Animal`, or a `Bird`, or a `Dodo` - and then remember never\
    \ to call `fly()`.\n\nThe entire advantage of polymorphism in OOP has been missed.\n\
    \nInheritance is only useful when classes are LSP substitutable in calling code.\
    \ If that calling code has to grub about with `instanceof` to work out what class\
    \ it is dealing with, you haven’t done OOP. It’s no better than using a bunch\
    \ of if statements and a big procedure.\n\nThe usual hack is to store things as\
    \ `Animals` and use `instanceof` to work out if they are the different abstraction\
    \ of `Bird`. Ugh. No thanks.\n\nSo, how might we sort this mess out?\n\nWe simply\
    \ accept that we jumped the wrong way with this abstraction.\n\nBack to basics\
    \ time. The object behaviours that we are trying to model are `eat()`, `makeNoise()`\
    \ and `fly()`. Different kinds of `Animal` have these behaviours in different\
    \ combinations.\n\nLets start by creating interfaces for each behaviour.\n\n```\n\
    \ 1 interface Flying {\n 2     void fly();\n 3 }\n 4 \n5 interface Feedable {\n\
    \ 6     void eat();\n 7 }\n 8 \n 9 interface Audible {\n10     void makeNoise();\n\
    11 }\n```\n\nAs a first stab, we can straighten out some of our LSP failures:\n\
    \n```\n1 class Dodo implements Feedable, Audible {\n2     void eat() {...}\n3\
    \     void makeNoise() {...}\n4 }\n```\n\nWe’ve fixed the kludgy exception for\
    \ `Dodo.fly()` by not inheriting the behaviour that `Dodo` does not have in the\
    \ first place. Avoiding problems: always smart. \n\nWe can do the same thing with\
    \ `Dog` and `Sparrow`. Note that `Animal` and `Bird` simply vanish in this scheme,\
    \ because they were the wrong abstraction.\n\nThis improves our calling code somewhat.\
    \ If we pass `Dodo` to a method that wants a `Feedable` thing, it will work. It\
    \ is LSP substitutable for that. `Dodo` will never bomb out on `fly()` because\
    \ it does not have that method in the first place.\n\nHowever, our animals are\
    \ still not very polymorphic. This might be fine. It means the calling code needs\
    \ to know which interfaces it needs.\n\nHow could we make a fully polymorphic\
    \ `Animal`, that we could tell-don’t-ask to do the right thing?\n\n```\n 1 interface\
    \ Behaviour {\n 2     void do();\n 3 }\n 4 \n5 class Animal {\n 6     private\
    \ final List<Behaviour> behaviours = new ArrayList<>();\n 7 \n8     public void\
    \ add(Behaviour b) {\n 9         behaviours.add(b);\n10     }\n11 \n12     public\
    \ void behave() {\n13         behaviours.forEach(Behaviour::do);\n14     }\n15\
    \ }\n```\n\nWe move up a level of abstraction. You might recognise `Behaviour`\
    \ from the section on Design Patterns. `Behaviour` is a Command pattern. It provides\
    \ `do()` which will cause our animal to do its thing.\n\n`Animal` now represents\
    \ a single kind of animal that can have any number of behaviours. The classic\
    \ bad example tries to use it to model a fixed set of behaviours. We make up Behaviour\
    \ classes to represent our animal behaviours:\n\n```\n1 class AnimalNoise implements\
    \ Behaviour {\n2     private String noise;\n3 \n4     public AnimalNoise(String\
    \ noise) {\n5         this.noise = noise;\n6     }\n7 \n8     void do() {\n9 \
    \        System.out.println(noise);\n10     }\n11 }\n12 \n13 class Flight implements\
    \ Behaviour {\n14     void do() {\n15         System.out.println(\"flap, flap\"\
    );\n16     }\n17 }\n18 \n19 class Eating implements Behaviour {\n20     void do()\
    \ {\n21         System.out.println(\"nom nom\");\n22     }\n23 }\n```\n\nThen\
    \ we configure each Animal with the behaviours we want - using composition, not\
    \ inheritance:\n\n```\n1 Animal dodo = new Animal();\n2 dodo.add( new AnimalNoise(\"\
    Dodo noise - brrrraak!\") );\n3 dodo.add( new Eating() );\n4 \n5 Animal sparrow\
    \ = new Animal();\n6 sparrow.add( new AnimalNoise(\"cheep cheep\") );\n7 sparrow.add(\
    \ new Eating() );\n8 sparrow.add( new Flight() );\n```\n\nWe can make an aggregate\
    \ object to hold all our animals:\n\n```\n 1 class Animals {\n 2     private List<Animal>\
    \ animals = new ArrayList<>();\n 3 \n4     void add(Animal a) {\n 5         animals.add(a);\n\
    \ 6     }\n 7 \n8     void behave() {\n 9         animals.forEach(Animal::behave);\n\
    10     }\n11 }\n```\n\nWe can add all our animals and make them all do their thing:\n\
    \n```\n1 var animals = new Animals();\n2 \n3 animals.add( dodo );\n4 animals.add(\
    \ sparrow );\n5 \n6 animals.behave();\n```\n\nWe now have a set of pluggable animal\
    \ behaviours that benefit from OO polymorphism. We used objects to encapsulate\
    \ data, hide secrets and separate concerns.\n\nThe general idea here is to *prefer\
    \ composition over inheritance*.\n"
  raw: "Let’s learn from the classics of that particular genre.\n\n## Bird extends\
    \ Animal\n\nI roll my eyes anytime I read ‘class Animal’ in an example, in exactly\
    \ the same way as I do when I see a dead end in a horror movie.\n\nHere’s how\
    \ the problem unfolds. We start with an Animal base class with methods eat() and\
    \ makeNoise(). We add a subclass of Dog. Then we add a subclass of Bird adding\
    \ a fly() method. Then two subclasses of Bird, traditionally Sparrow and Dodo.\
    \ The Dodo cannot fly, so we maybe throw an exception or do nothing in Dodo.fly().\n\
    \nThe whole mess looks like this:\n\n```\n 1 abstract class Animal {\n 2     abstract\
    \ void eat();\n 3     abstract void makeNoise();\n 4 }\n 5 \n 6 class Dog extends\
    \ Animal {\n 7     void eat() {\n 8         System.out.println(\"Meat\");\n 9\
    \     }\n10 \n11     void makeNoise() {\n12         System.out.println(\"Woof\"\
    );\n13     }\n14 }\n15 \n16 abstract class Bird extends Animal {\n17     abstract\
    \ void fly();\n18 }\n19 \n20 class Sparrow extends Bird {\n21     void eat() {\n\
    22         System.out.println(\"Seeds\");\n23     }\n24 \n25     void makeNoise()\
    \ {\n26         System.out.println(\"Cheep cheep\");\n27     }\n28 \n29     void\
    \ fly() {\n30         System.out.println(\"Flap flap\");\n31     }\n32 }\n33 \n\
    34 \n35 class Dodo extends Bird {\n36     void eat() {\n37         System.out.println(\"\
    Nothing, extinct\");\n38     }\n39 \n40     void makeNoise() {\n41         System.out.println(\"\
    No sound, extinct\");\n42     }\n43 \n44     void fly() {\n45         throw new\
    \ UnsupportedOperationException(\"error: cannot fly\");\n46     }\n47 }\n```\n\
    \nThere are a couple of things wrong with this, which the calling code would reveal\
    \ quickly. Oddly enough, the “OO is dead” examples never include unit tests or\
    \ calling code, do they? Funny, that …\n\nThe key issue is the broken contract\
    \ of Bird.fly() when we inherit that method in Dodo.\n\nA Dodo cannot fly, so\
    \ the expected contract “make it fly” cannot be met.\n\nThat’s a misuse of inheritance\
    \ - technically a misuse of a static type to incorrectly model a behaviour that\
    \ does not exist. It fails LSP. We know we should not use inheritance when LSP\
    \ is going to be broken. It is not a good fit.\n\nThat’s a problem, yet the bigger\
    \ point is usually missed entirely in these articles. Why does Bird even derive\
    \ from Animal? They don’t have many use cases in common.\n\nRecall how we do this\
    \ right. We start outside-in and design behaviours we want our objects to have.\
    \ If we are going to treat our objects polymorphically, then we make sure that\
    \ all the objects can respond to the same methods.\n\nHow about in this case?\
    \ No way is it going to work like that.\n\nThink about what the calling code needs\
    \ for polymorphism. It wants some Base classes to use. If it uses Animal, then\
    \ Bird does not exist - the calling code will never see Bird, just Animal. You\
    \ cannot call fly() on an Animal. If it uses Bird, then Animal does not *need*\
    \ to exist. Bird simply has three methods eat(), makeNoise() and fly(). You could\
    \ simply put those into a Bird interface, and the calling code has no clue whether\
    \ an Animal is involved or not.\n\nNeither Animal nor Bird makes a good base class\
    \ for this. Yet here we are, proudly showing an inheritance tree of useless base\
    \ classes, in an article saying OOP doesn’t work. Good job. Loving your work …\n\
    \nThe fundamental problem missed is that you cannot call any of this in a Tell-Don’t-Ask\
    \ polymorphic style. You have to know whether you have only an Animal, or a Bird,\
    \ or a Dodo - and then remember never to call fly().\n\n*The entire advantage\
    \ of polymorphism in OOP has been missed*\n\nInheritance is only useful when classes\
    \ are LSP substitutable in calling code. If that calling code has to grub about\
    \ with instanceof to work out what class it is dealing with, you haven’t done\
    \ OOP. It’s no better than using a bunch of if statements and a big procedure.\n\
    \nThe usual hack is to store things as Animals and use instanceof to work out\
    \ if they are the different abstraction of Bird. Ugh. No thanks.\n\nSo, how might\
    \ we sort this mess out?\n\nWe simply accept that we jumped the wrong way with\
    \ this abstraction.\n\nBack to basics time. The object behaviours that we are\
    \ trying to model are eat(), makeNoise() and fly(). Different kinds of Animal\
    \ have these behaviours in different combinations.\n\nLets start by creating interfaces\
    \ for each behaviour.\n\n```\n 1 interface Flying {\n 2     void fly();\n 3 }\n\
    \ 4 \n 5 interface Feedable {\n 6     void eat();\n 7 }\n 8 \n 9 interface Audible\
    \ {\n10     void makeNoise();\n11 }\n```\n\nAs a first stab, we can straighten\
    \ out some of our LSP failures:\n\n```\n1 class Dodo implements Feedable, Audible\
    \ {\n2     void eat() {...}\n3     void makeNoise() {...}\n4 }\n```\n\nWe’ve fixed\
    \ the kludgy exception for Dodo.fly() by not inheriting the behaviour *that Dodo\
    \ does not have* in the first place. Avoiding problems: always smart.\n\nWe can\
    \ do the same thing with Dog and Sparrow. Note that Animal and Bird simply vanish\
    \ in this scheme, *because they were the wrong abstraction*.\n\nThis improves\
    \ our calling code somewhat. If we pass Dodo to a method that wants a Feedable\
    \ thing, it will work. It is LSP substitutable for that. Dodo will never bomb\
    \ out on fly() because it does not have that method in the first place.\n\nHowever,\
    \ our animals are still not very polymorphic. This might be fine. It means the\
    \ calling code needs to know which interfaces it needs.\n\nHow could we make a\
    \ fully polymorphic Animal, that we could tell-don’t-ask to do the right thing?\n\
    \n```\n 1 interface Behaviour {\n 2     void do();\n 3 }\n 4 \n 5 class Animal\
    \ {\n 6     private final List<Behaviour> behaviours = new ArrayList<>();\n 7\
    \ \n 8     public void add(Behaviour b) {\n 9         behaviours.add(b);\n10 \
    \    }\n11 \n12     public void behave() {\n13         behaviours.forEach(Behaviour::do);\n\
    14     }\n15 }\n```\n\nWe move up a level of abstraction.\n\nYou might recognise\
    \ interface Behaviour from the section on Design Patterns. Behaviour is a Command\
    \ pattern. It provides a method do() which will cause our animal to do its thing.\n\
    \nAnimal now represents a single kind of animal that can have any number of behaviours.\
    \ In a language like Java, an interface or class can only describe a *fixed* set\
    \ of behaviours. The classic bad example tries to use it to model a *dynamic*\
    \ set of behaviours and fails miserably. We’ve fixed the root cause of the problem\
    \ with our new Animal class.\n\nWe can make up Behaviour classes to represent\
    \ our animal behaviours:\n\n```\n 1 class AnimalNoise implements Behaviour {\n\
    \ 2     private String noise ;\n 3 \n 4     public AnimalNoise(String noise) {\n\
    \ 5         this.noise = noise;\n 6     }\n 7 \n 8     void do() {\n 9       \
    \  System.out.println(noise);\n10     }\n11 }\n12 \n13 class Flight implements\
    \ Behaviour {\n14     void do() {\n15         System.out.println(\"flap, flap\"\
    );\n16     }\n17 }\n18 \n19 class Eating implements Behaviour {\n20     void do()\
    \ {\n21         System.out.println(\"nom nom\");\n22     }\n23 }\n```\n\nThen\
    \ we configure each Animal with the behaviours we want - using composition, not\
    \ inheritance:\n\n```\n1 Animal dodo = new Animal();\n2 dodo.add( new AnimalNoise(\"\
    Dodo noise - brrrraaaak!\") );\n3 dodo.add( new Eating() );\n4 \n5 Animal sparrow\
    \ = new Animal();\n6 sparrow.add( new AnimalNoise(\"cheep cheep\") );\n7 sparrow.add(\
    \ new Eating() );\n8 sparrow.add( new Flight() );\n```\n\nWe can make an aggregate\
    \ object to hold all our animals:\n\n```\n 1 class Animals {\n 2     private List<Animal>\
    \ animals = new ArrayList<>();\n 3 \n 4     void add(Animal a) {\n 5         animals.add(a);\n\
    \ 6     }\n 7 \n 8     void behave() {\n 9         animals.forEach(Animal::behave);\n\
    10     }\n11 }\n```\n\nWe can add all our animals and make them all do their thing:\n\
    \n```\n1 var animals = new Animals();\n2 \n3 animals.add( dodo );\n4 animals.add(\
    \ sparrow );\n5 \n6 animals.behave();\n```\n\nWe now have a set of pluggable animal\
    \ behaviours that benefit from OO polymorphism. We have used objects to encapsulate\
    \ data, hide secrets and separate concerns.\n\nThe general idea here is to *prefer\
    \ composition over inheritance*."
