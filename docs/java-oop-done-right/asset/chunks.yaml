  trans: "\n\n## 接口隔离原则 - 诚实的接口\n\n接口隔离原则规定，调用方代码不应该被强制依赖于它并不使用的方法。这是一个很好的表述方式。\n\n\
    我将 ISP 理解为保持接口尽可能小且诚实。它的核心在于避免用只在某些情况下有意义的方法来污染接口。诀窍在于只添加那些*总是*有意义的方法。我们将“有时需要”的方法移动到其他它们“总是被需要”的地方，然后通过重新设计来利用它们。\n\
    \n### 错误反例：电视遥控器\n\n硬件团队自豪地告诉我们，他们最新的低成本数字电视产品已经就绪，可以我们往里面写代码了。我们的第一个任务是实现遥控器代码。\n\
    \n我们保持简单，写了一个暴露了所有可控制项的接口：\n\n```java\n1 interface Control {\n2     void on();\n\
    3     void off();\n4     void channelUp();\n5     void channelDown();\n6 }\n```\n\
    \n我们可以为测试遥控器适配器编写一个存根代码（stub），并创建一个驱动电视硬件的生产环境类。\n\n一切顺利。\n\n几周后，团队告诉我们他们获得了一些改进后的智能电视硬件。我们将推出两个产品：一个是低成本的入门级，另一个是我们的高端智能电视。\n\
    \n它具有数字节目录制功能，以及 YouTube 和 Netflix 网络电视功能。\n\n我们可能决定将这些额外功能添加到现有的 `Control` 接口中：\n\
    \n```java\n 1 interface Control {\n 2     // 入门级电视功能\n 3     void on();\n 4  \
    \   void off();\n 5     void channelUp();\n 6     void channelDown();\n 7    \
    \ \n 8     // 智能电视专用功能\n 9     void startRecording();\n10     void endRecording();\n\
    11     void launchYoutube();\n12     void launchNetflix();\n13 }\n```\n\n我们开始编写驱动电视硬件的类，并且希望保持相同的代码库，而不是为每个产品进行分支（fork）。\n\
    \n啊。\n\n如果我们为入门级和智能电视都保持同一个类，很快就会发现入门级产品上的智能电视方法存在问题：它们不起作用。\n\n最初的想法是在每个需要的地方添加\
    \ `if (isSmartTV)` 语句。这本身就是一种 OOP 代码异味（code smell）。我们可能应该用多态来替换它，使用两个实现 `Control`\
    \ 接口的独立类。将其命名为 `BasicControl` 和 `SmartTvControl`。\n\n这消除了 `if` 语句。具体来说，它将这些语句推到了系统的边缘，在那里我们创建这两个类中的某一个。但仍然给我们留下了一个问题：`BasicControl`\
    \ 应该如何处理所有智能电视专用的方法？\n\n通常，这些方法要么是空操作（内部没有代码），要么抛出一个 `UnsupportedOperationException`。\n\
    \n问题的根源在于我们违反了 ISP。我们强迫接口的 `BasicControl` 实现者去使用一堆对它完全没有意义的方法。\n\n### 修复我们的 ISP\
    \ 违规行为\n\n在这里，我希望可以说这很容易修复。但这类事情通常会变得非常复杂或非常凑巧（hacky）。\n\n第一个建议是简单将接口拆分为两个：\n\n\
    ```java\n 1 interface BasicFeatures {\n 2     void on();\n 3     void off();\n\
    \ 4     void channelUp();\n 5     void channelDown();\n 6 }\n 7 \n 8 interface\
    \ AdvancedFeatures {\n 9     void startRecording();\n10     void endRecording();\n\
    11     void launchYoutube();\n12     void launchNetflix();\n13 }\n```\n\n一种方法是让\
    \ `AdvancedFeatures` 继承 `BasicFeatures`。上面我选择没有这样做，因为我认为这对我们没有太大帮助。\n\n通过这种拆分，我们在技术上修复了\
    \ ISP。我们可以创建一个类（可能是两个类）来在入门级电视和智能电视上驱动 `BasicFeatures`。我们可以创建一个单独类，仅在智能电视上驱动 `AdvancedFeatures`。每个类只获得它关心的方法。\n\
    \n### 重新设计为命令对象（Command objects）\n\n在实际系统中，一个代码库被用于两个具有不同功能集的产品，仅仅修复 ISP 是不够的。\n\
    \n问题在于，我们希望向入门级电视用户暴露一组功能，并向智能电视用户暴露另一个不同的功能超集。Java 接口无法表达这种模型。\n\nJava（以及 C#\
    \ 和 C++）接口是静态绑定的。我们不能仅仅根据电视类型向其添加方法。正是这种静态绑定促使我们一开始就编写更小的接口并使用 ISP。\n\n我们的应用程序理想情况下需要一种方式建模：入门级电视有三个方法——开启、关闭、选择频道，而我们的智能电视有更多。\n\
    \n优雅地实现这一点的方法是使用名为“命令”（Command）的设计模式。\n\n```java\n1 interface Command {\n2   \
    \  void execute();\n3 }\n```\n\n你可以看到 `Command` 接口比我们之前使用的抽象高了一层。它对我们的特定应用程序一无所知。它只知道任何实现\
    \ `Command` 的对象都可以被指令 `execute()`——即运行执行该命令的代码。\n\n所以我们会看到类似这样的类：\n\n```java\n\
    \ 1 class ChannelUp implements Command {\n 2     void execute() {\n 3        \
    \ // 驱动硬件显示列表 \n 4         // 中“上”一个电视频道的代码\n 5 \n 6         // 这与我们在实现 BasicFeatures\
    \ 的\n 7         // 类中的代码是相同的 - 它只是\n 8         // 重构到了不同的代码中\n 9     }\n10 }\n\
    ```\n\n"
- fmt: "\n```java\nclass TextConversion {\n    private Input input ;\n    private\
    \ Output output ;\n    \n    public TextConversion(final Input input, final Output\
    \ output){\n        this.input = input;\n        this.output = output;\n    }\n\
    \    \n    public void showInputInUpperCase() {\n        String inputText = input.fetch();\n\
    \        String upperCaseText = inputText.toUpperCase();\n        output.display(upperCaseText);\n\
    \    }\n}\n```\n\nWe had inverted dependencies on external systems at this point.\n\
    \nThis code uses interfaces `Input` and `Output` to fetch input and display output,\
    \ respectively. It does not have any knowledge of the mechanism of how that input\
    \ is collected. It knows nothing about where the output is sent to.\n\nThis is\
    \ the secret sauce for our unit test: we can make test versions of those interfaces.\
    \ Think of them as ‘stunt doubles’ for actors in a Hollywood film.\n\nWe even\
    \ call these classes ‘Test Doubles’.\n\n## Test Doubles - Stubs and Mocks\n\n\
    The big idea is to fix the problems you have with a manual test.\n\nWe can manually\
    \ test this code by typing ‘abc123’ at the keyboard and visually observing the\
    \ output of ‘ABC123’ on the console.\n\nThis has the usual negatives of manual\
    \ testing. It is slow. We often forget to do it. It is expensive - and it delays\
    \ delivery. The solution is to automate the test somehow.\n\nBut how do we automate\
    \ keyboard input? How do we replace the human observer looking at the console?\n\
    \nThe answer that SOLID gives us is that *we don’t*.\n\nExternal systems always\
    \ mess up unit testing. We cannot assert what they are showing, usually, nor can\
    \ we alter the input at a physical keyboard.\n\nInstead, we replace the keyboard\
    \ and console completely by Test Doubles - classes that will automate the input\
    \ and analyse the output.\n\n## DIP for Unit Tests - Stubs and Mocks\n\nDependency\
    \ Inversion provides the answer to our testing problem.\n\nBecause our code does\
    \ not know anything about how input is collected or where output is delivered,\
    \ we can write test-specific classes to help out. These are our test doubles.\n\
    \nWe then inject these test doubles into our `TextConversion` code inside our\
    \ unit test.\n\nThe huge advantage here is that we are not changing the code under\
    \ test in any way. If it passes Unit Test, that code will be good to go in production.\
    \ It will be the exact same code.\n\nWe need a double for our `Input` interface\
    \ and a double for our `Output` interface. Each one is subtly different in what\
    \ it needs to do. We have some jargon terms so we can discuss these differences\
    \ clearly.\n\n*   The Input test double is a `stub`\n*   The Output test double\
    \ is a `mock`\n\nA stub is simply an implementation of one of our dependency interfaces\
    \ that *returns known data*. Because we know in advance what data will come out\
    \ of it, we can predict what effect it will have on the code under test.\n\nOne\
    \ way to do this is to create a `StubInput` class. This can implement the `Input`\
    \ interface and always return the string ‘abcde123’ from `fetch()`.\n\nAnother\
    \ approach is to use a `Mock` object. A Mock is complementary to a stub. The mock\
    \ implements the interface, and *records any interactions* with it.\n\nA `MockOutput`\
    \ class can implement `Output`. It can then capture whatever we send to the `display()`\
    \ method. We can write the test to assert against this captured data. This will\
    \ prove that our code called the output interface using the correct method and\
    \ with expected data.\n\nLet’s see this in code:\n\n```java\nclass StubInput implements\
    \ Input {\n    private final String stubValue ;\n    \n    public Input(String\
    \ stubValue) {\n        this.stubValue = stubValue ;\n    }\n    public String\
    \ fetch() {\n        return stubValue;\n    }\n}\n```\n\nThis will provide our\
    \ known data whenever we call `fetch()`.\n\nI made a design decision to pass in\
    \ the stub value I want to return, rather than go with the easy option of returning\
    \ a constant. The reason is about making the test more readable; we’ll see that\
    \ later.\n\nNow for our `MockOutput`. Its responsibility is to record any interaction\
    \ with the `display()` method:\n\n```java\nclass MockOutput implements Output\
    \ {\n    private String actual ;\n    \n    public void display( String toDisplay\
    \ ) {\n        this.actual = toDisplay ;\n    }\n    \n    public String getActual()\
    \ {\n        return actual ;\n    }\n}\n```\n\nA simple getter seems to do the\
    \ job of exposing the captured data well here. You could make the field public;\
    \ you could provide a method `boolean hasExpectedValue( String expectedValue )`\
    \ if you like. Despite my general dislike of getters in OOP, it seems the right\
    \ tool for the job here.\n\nWe can now use these test doubles to write a fully\
    \ automated unit test:\n\n```java\nclass TextConversionTest {\n    \n    @Test\n\
    \    public void displaysUpperCasedInput() {\n        // Arrange\n        var\
    \ in = new StubInput(\"abcde123\");\n        var out = new MockOutput();\n   \
    \     \n        var tc = new TextConversion( in, out );\n        \n        //\
    \ Act\n        tc.showInputInUpperCase();\n        \n        // Assert\n     \
    \   assertThat(out.getActual()).isEqualTo(\"ABCDE123\");\n    }\n}\n```\n\nThis\
    \ will provide our known data whenever we call `fetch()`.\n\nI made a design decision\
    \ to pass in the stub value I want to return, rather than go with the easy option\
    \ of returning a constant. The reason is about making the test more readable;\
    \ we’ll see that later.\n\nNow for our `MockOutput`. Its responsibility is to\
    \ record any interaction with the `display()` method:\n\n```java\nclass MockOutput\
    \ implements Output {\n    private String actual ;\n    \n    public void display(\
    \ String toDisplay ) {\n        this.actual = toDisplay ;\n    }\n    \n    public\
    \ String getActual() {\n        return actual ;\n    }\n}\n```\n\nA simple getter\
    \ seems to do the job of exposing the captured data well here. You could make\
    \ the field public; you could provide a method `boolean hasExpectedValue( String\
    \ expectedValue )` if you like. Despite my general dislike of getters in OOP,\
    \ it seems the right tool for the job here.\n\nWe can now use these test doubles\
    \ to write a fully automated unit test:\n\n```java\nclass TextConversionTest {\n\
    \    \n    @Test\n    public void displaysUpperCasedInput() {\n        // Arrange\n\
    \        var in = new StubInput(\"abcde123\");\n        var out = new MockOutput();\n\
    \        \n        var tc = new TextConversion( in, out );\n        \n       \
    \ // Act\n        tc.showInputInUpperCase();\n        \n        // Assert\n  \
    \      assertThat(out.getActual()).isEqualTo(\"ABCDE123\");\n    }\n}\n```\n\n\
    ## Mocking libraries\n\nNow that we understand Dependency Inversion allows us\
    \ to generate test doubles, we can simplify our lives.\n\nWriting a lot of test\
    \ doubles by hand is pretty tiresome, as you can see. It is boilerplate code.\n\
    \nAs you would expect, libraries can help us.\n\nThe most popular in Java is Mockito.\
    \ It is a library that allows us to generate mocks and stubs using only annotations.\n\
    \nOur unit test above would become this, using Mockito:\n\n```java\nclass TextConversionTest\
    \ {\n    @Mock\n    private Input input ;\n    \n    @Mock\n    private Output\
    \ output ;\n    \n    @Before\n    public void beforeEachTest() {\n        MockitoAnnotations.openMocks(this);\n\
    \    }\n    \n    @Test\n    public void displayUpperCasedInput() {\n        //\
    \ Arrange\n        Mockito.when(input.fetch()).thenReturn(\"abcde123\");\n   \
    \     var tc = new TextConversion(input, output);\n        \n        // Act\n\
    \        tc.showInputInUpperCase();\n        \n        // Assert\n        Mockito.verify(output).display(\"\
    ABCDE123\");\n    }\n}\n```\n\nMockito provides the `@Mock` annotation to auto-generate\
    \ test doubles. These function as both Mocks and Stubs.\n\nStub behaviour is provided\
    \ by `Mockito.when()`. The most common use is to chain that with `.thenReturn(stubValue)`.\n\
    \nMock behaviour is supported by `Mockito.verify()` which allows checking that\
    \ a method was called and with what parameters.\n\nMockito is a widely-used third-party\
    \ library. It provides a lot of tools for generating mocks and stubs. I recommend\
    \ you take a look at it.\n\n## Self-Shunt mocks and stubs\n\nOne last technique\
    \ is worth mentioning: self-shunt.\n"
