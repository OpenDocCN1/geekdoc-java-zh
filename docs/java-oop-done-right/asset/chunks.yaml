  trans: "\n\n低级数组使用的问题在于：你必须预先知道想要存储多少内容；在上面的例子中是十个。\n\n使用数组时，将它们添加到列表末尾非常笨拙。你必须跟踪你所写入的最后一个索引，然后使用\
    \ `users[currentIndex]` 语法写入下一个索引。\n\n一旦达到数组大小的限制，因为它无法增长，你必须创建一个新数组，复制所有内容，然后将“上一次写入的索引”也复制过去。\n\
    \n这看起来就像应该有一个 `object` 来为你封装所有这些工作，不是吗？\n\n当然，这正是 `ArrayList` 类所做的事情。\n\n**所以就用它吧**。不要自己写。\n\
    \n人们抱怨 Java “过于繁琐”的原因之一是，当他们看到初学者代码充斥着原始数组管理时——而这些地方本该使用集合类（collections）。\n\n\
    我们的 `Users` 类繁琐吗？*真的吗？* 我认为并不繁琐。\n\n## 使用 forEach 而不是循环\n\n看一眼我们 `Users` 类中的 `greet()`\
    \ 方法。\n\n如果你以前见过这种写法，它看起来有点奇怪。\n\n它使用了 Java 8 引入的一项新功能，称为 lambda 表达式。基本上，你可以将一个方法作为参数传递给另一个方法，这更像\
    \ JavaScript 使用高阶函数的方式。\n\n每个 `Collection` 类（如 `List`）现在支持一个名为 `forEach()` 的方法，该方法恰好接受一个方法作为参数。\n\
    \n它的功能完全如其名所示，这也是我喜欢它的原因：对于集合中的每一个元素，在其上面运行该函数。\n\n在我们的案例中，一个内部迭代器遍历了 `User` 对象列表。对于每个\
    \ `user` 对象，它都会调用该对象的 `greet()` 方法。\n\n我们通过奇特的语法 `User::greet` 实现了这一点，这被称为“方法引用”。这是\
    \ Java 8 的一种简写，意为“对每个对象使用 `User` 类中的 `greet()` 方法”。\n\n你可以使用四种不同的方法引用。它们都很有用。\n\
    \n关键点在于代码读起来有多么*直观*。“对于我们的每个用户，调用 `greet()`。”它简单、清晰且简洁。\n\n我真正喜欢的是它与在原始数组上使用基于索引的循环的对比。让我们比较一下：\n\
    \n```\n 1 // 遍历原始数组。再次说不。\n 2 User[] users = new User[10];\n 3 users[0] = new\
    \ User(\"Alan\");\n 4 users[1] = new User(\"Katy\");\n 5 users[2] = new User(\"\
    Stephanie\");\n 6 \n 7 // 请不要这样写代码。拜求了。\n 8 for (int i=0; i < 3; i++){\n 9   users[i].greet();\n\
    10 }\n```\n\n这有效吗？当然有效。但它很糟糕吗？噢，是的。\n\n这里的主要问题——对我来说——是我看到的全都是*机制*。关于如何使用某些数组索引在带有\
    \ `greet()` 方法的 `User` 对象数组上运行循环有多么痛苦，包含了大量的细节，然后我们还必须调用 `greet()`。\n\n我*没有*看到的是我原始的“业务问题”——“问候所有用户”。在聚合对象使用\
    \ `forEach()` 时，这一点是显而易见的。\n\n另一个技术问题是循环的结束条件。我为了例子临时凑合了它。你能看到 `users` 数组有十个槽位吗？但我只添加了三个用户。你能看到我如何必须在\
    \ for 循环中硬编码数字 ‘3’ 吗？\n\n再次，数组根本不是胜任这项工作的工具。*它们几乎从不是*。在集合类可以更好地完成工作的地方，请不要使用数组。\n\
    \n## 聚合方法作用于所有内容\n\n这个简单的规则有助于你将代码拆分成不同的部分。\n\n*   如果该行为作用于单个对象，就把它放在对象中\n*  \
    \ 如果该行为适用于所有对象，就把它放在聚合类中\n\n在我们的示例中，聚合类 `Users` 中的 `greet()` 方法将问候所有的 `Users`。单个类\
    \ `User` 中的 `greet()` 方法只问候该用户。\n\n### 常见主题\n\n聚合方法的常见想法有：\n\n*   `summarise()`\
    \ - 为某些公共元素创建一个摘要\n*   `broadcast()` - 向所有对象发送某些内容\n*   `submit()` - 发送一组订单\n\n\
    你还能想到多少个？\n\n# 协作\n\n对象像人一样，共同工作时效果最好。\n\n设计一组对象来解决问题是一门艺术，而不是科学。有很多原则和准则，但没有循序渐班的计划。你必须在边做边构思每个解决方案，解决各种权权衡。\n\
    \n后面的章节将详细探讨其中的一些原则。现在，让我们从基础开始。\n\n## 基础机制\n\nJava 给了我们两种基本方式让对象协同工作。我们可以将对象作为参数传递，也可以让对象作为一个字段（field）。\n\
    \n让我们在代码中看看它们，这样我们就知道它们的样子了。我们将使用两个类，`Dog` 和 `Cat`。`Dog` 想要追 `Cat`。也许不是两个宠物之间的“协作”，但让我们看看如何使用对象来实现。\n\
    \n我们将为 `Cat` 类制作一个 `chase()` 方法：\n\n```\n1 class Cat {\n2     public void chase()\
    \ {\n3         System.out.println(\"I'm off up that tree\");\n4     }\n5 }\n```\n\
    \n让 `Dog` 类访问猫对象的第一种方法将其存储在私有字段中：\n\n```\n 1 class Dog {\n 2     private final\
    \ Cat cat ;\n 3 \n 4     Dog( Cat c ) {\n 5         this.cat = c;\n 6     }\n\
    \ 7 \n 8     public void chase() {\n 9         cat.chase();\n10     }\n11 }\n\
    ```\n\n另一种方法是将 `Cat` 对象作为参数传递：\n\n```\n1 class Dog {\n2     public void chase(\
    \ Cat c ) {\n3         c.chase();\n4     }\n5 }\n```\n\n"
- fmt: "\nThis means that we need another object that does know how to print things\
    \ in a bit more detail. Let’s design the behaviours on that:\n\n```\n1 class Printer\
    \ {\n2     public void print( String text ) {\n3         // todo\n4     }\n5 }\n\
    ```\n\nFor now, let’s assume all we need is the ability to print a `String` value.\
    \ We can leave the implementation as ‘todo’ and come back to this later.\n\nWe\
    \ can give our `Item` a way to print itself now:\n\n```\n1 class Item {\n2   \
    \  public void print( Printer p ) {\n3         // todo\n4     }\n5 }\n```\n\n\
    That’s progress.\n\nWe are expressing the high level design and structure of our\
    \ code to our readers. We are telling them that we have an `Item` object that\
    \ can print itself. To do that, it will collaborate with a `Printer` object.\n\
    \nI want to stop at this point and underline the thinking here. All we have to\
    \ show for our work is two classes of five lines each, where every method says\
    \ ‘todo’. I’m not expecting much bonus at this year’s Annual Pay Review so far.\n\
    \nBut this is the nature of OOP done right. It is why it is brilliant. We are\
    \ designing the behaviours of the system first as *abstractions*. Abstraction\
    \ means ‘the general idea’ or ‘the thing that is always true, however you do it’.\n\
    \nWe avoid getting bogged down in details of coding. Instead, we spend the time\
    \ expressing *what* our system does, *where* each big idea splits apart and not\
    \ *how* it is done. The how is, of course, very important. It is just less important\
    \ than the structure of a program. Adding the ‘how’ can be done later.\n\nIf you\
    \ have programmed in a lower level language, or are newer to programming, you’ll\
    \ probably recognise this as ‘backwards’ thinking. We are used to diving in with\
    \ the details. I used to approach coding that way. I would dive right in with\
    \ a big “shopping list” of detailed instructions.\n\nThis leads to hard to understand\
    \ code. As we read it, we have to reverse engineer what is being done. By making\
    \ our design explicit, we can directly read out the ‘what’. It goes right back\
    \ to the start of the book - our idea that `clearScreen()` is a lot easier to\
    \ understand than the binary code of how a screen is cleared.\n\nSame here. We\
    \ prevent that mess by designing OOP behaviours first.\n\nAnyway, tea break over:\
    \ back to the coding. We have only one `Item` on our receipt. Let’s create an\
    \ aggregate class that represents our full receipt:\n\n```\n1 class Receipt {\n\
    2     public void print () {\n3         // todo\n4     }\n5 }\n```\n\nThe first\
    \ behaviour I can think of is `print()`.\n\nOnce again, we’ll get back to the\
    \ details of `print` after checking back with our requirements. But we know that\
    \ it will collaborate in some way with our `Item` objects to print them out. We\
    \ also recall our previous design of `Item`. It has a `print()` method that takes\
    \ a `Printer` object.\n\nLet’s assume that the same `Printer` object is used to\
    \ print out the entire receipt. On that basis, a reasonable design decision is\
    \ to pass in a `Printer` object in the constructor of `receipt` and store it in\
    \ a field for use:\n\n```\n 1 class Receipt {\n 2     private final Printer printer\
    \ ;\n 3 \n 4     public Receipt( Printer p ) {\n 5         this.printer = p;\n\
    \ 6     }\n 7 \n 8     public void print () {\n 9         // todo - using field\
    \ 'printer'\n10     }\n11 }\n```\n\nMore progress. Our `receipt` will be able\
    \ to print itself.\n\nBut it needs something to print! We’ll give it a way to\
    \ add items on our receipt:\n\n```\n 1 class Receipt {\n 2     private final Printer\
    \ printer ;\n 3 \n 4     public Receipt( Printer p ) {\n 5         this.printer\
    \ = p;\n 6     }\n 7 \n 8     public void add(String description, Money price)\
    \ {\n 9         // todo\n10     }\n11 \n12     public void print () {\n13    \
    \     // todo - using field 'printer'\n14     }\n15 }\n```\n\nAnother step forward.\n\
    \nI’ve made a design decision in the method signature of `add()`. It is based\
    \ on the requirements. The method takes two value parameters - the item description\
    \ as a `String` and its price as a `Money` object. I’ve chosen this over passing\
    \ in an `Item` object. Maybe I’ll change my mind on that later.\n\nFor now, the\
    \ thinking is that `Item` will stay private to this cluster of classes to reduce\
    \ coupling on callers. Coupling is the technical term for how connected different\
    \ pieces of code are.\n\nA `Money` class is needed, but it can be empty for now.\
    \ The code only has to compile at this stage:\n\n```\n1 class Money {\n2     //\
    \ TODO\n3 }\n```\n\nWe’ll create a list of `Item` objects inside our receipt and\
    \ add to them using `add()`:\n\n```\n 1 class Receipt {\n 2     private final\
    \ Printer printer ;\n 3     private final List<Item> items = new ArrayList<>();\n\
    \ 4 \n 5     public Receipt( Printer p ) {\n 6         this.printer = p;\n 7 \
    \    }\n 8 \n 9     public void add(String description, Money price) {\n10   \
    \      items.add( new Item(description, price) );\n11     }\n12 \n13     public\
    \ void print () {\n14         // todo - using field 'printer'\n15     }\n16 }\n\
    ```\n\nThere’s another design decision here. When we create an `Item` object,\
    \ it now needs a constructor. We’ll pass description and price into that, giving\
    \ our `Item` object knowledge of what it needs to print:\n\n```\n 1 class Item\
    \ {\n 2     private final String description;\n 3     private final Money price\
    \ ;\n 4 \n 5     public Item( String description, Money price ) {\n 6        \
    \ this.description = description;\n 7         this.price = price;\n 8     }\n\
    \ 9 \n10     public void print( Printer p ) {\n11         // todo\n12     }\n\
    13 }\n```\n\nAfter adding the constructor, I added the fields to hold the knowledge\
    \ of description and price. I marked them as `final` to make this an ‘immutable\
    \ value’ object. Immutable means the value will not change. That makes systems\
    \ easier to reason about - and safer to use in concurrent environments like web\
    \ servers.\n\nWorking backwards like this, you give your IDE like `IntelliJ` all\
    \ the clues it needs to offer to write the code.\n\nFrom typing `new Item(description,\
    \ price)` in the `Receipt` class, it will offer to create a constructor in `Item`\
    \ with correct names. From here, the IDE will offer to add correct fields in `Item`.\n\
    \nTake full advantage of that IDE help! I always do.\n\nWe’re getting there now.\
    \ The next job is to fill in some details on this printing. Let’s start outside-in,\
    \ so we stick with big picture ideas first:\n\n```\n 1 class Receipt {\n 2   \
    \  private final Printer printer ;\n 3     private final List<Item> items = new\
    \ ArrayList<>();\n 4 \n 5     public Receipt( Printer p ) {\n 6         this.printer\
    \ = p;\n 7     }\n 8 \n 9     public void add(String description, Money price)\
    \ {\n10         items.add( new Item(description, price) );\n11     }\n12 \n13\
    \     public void print () {\n14         items.forEach(item -> item.print(printer));\n\
    15     }\n16 }\n```\n\nWe’ve added a Java 8 lambda style line to print out all\
    \ items. It uses the ‘Tell Don’t Ask’ style to go through all `Item` objects and\
    \ ask each one to print itself. We pass into that print method the `Printer` object\
    \ we supplied in the constructor of `Receipt`.\n\nThis is an example of good collaboration\
    \ design.\n\nWe’re not pulling data out of objects using getters and setters.\
    \ We’re not even thinking of ‘data’. Well, I’m not. I think of price and description\
    \ as ‘secret knowledge’ that the `Item` is responsible for keeping to itself.\
    \ Sure, that’s a bit of word-play; but it helps me see OO design as being driven\
    \ by behaviours and not pure data.\n\nThis is still a big picture idea. `Receipt`\
    \ does not know anything about how `Item` objects look nor handle printing. It\
    \ only knows that there are zero or more `Item` objects and that they can be asked\
    \ to print. It’s really quite a simple, descriptive way to create code.\n\nThe\
    \ next step for me is to follow that chain of behaviour starting at `print` and\
    \ stripe that through this slice. I like to build software as a series of working\
    \ slices of code like this. At the end of each iteration, you don’t have all the\
    \ features. You don’t have complete layers of the system either. What you do have\
    \ is working software you can demonstrate to stakeholders. That’s valuable.\n"
