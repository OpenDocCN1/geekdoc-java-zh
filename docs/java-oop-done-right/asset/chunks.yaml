    \n*   An ‘inside out’, experimental approach is possible\n\n*   Simplified changes\
    \ of things like databases and web server technology\n\n## The Hexagonal Model\n\
    \nYou can see that our code now consists of two main parts. The application logic,\
    \ which is free of external systems. Then the external systems, which are free\
    \ of application logic.\n\nWe give those parts names:\n\n*   Domain Layer - application\
    \ logic, no external systems\n\n*   Adapter Layer - external systems, no application\
    \ logic"
