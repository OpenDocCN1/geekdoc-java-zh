  raw: "Repository allows us to create an abstraction of stored data, in our domain\
    \ terms. We’ve seen this earlier. We’ve used it to store User objects as an example\
    \ of the Adapter pattern. Repository focusses on the interface that is called,\
    \ rather than the adapter class implementation.\n\nTo show how useful Repository\
    \ is, let’s add a few common methods:\n\n```\n1 interface UserRepository {\n2\
    \     User  findUserById( String userId );\n3     Users findUsersWhoseNameStartWith(\
    \ String startOfName );\n4     Users listAllUsers();\n5 \n6     Users execute(\
    \ Query q );\n7 }\n```\n\nUsers is an aggregate class, containing methods relating\
    \ to multiple User objects.\n\nThis interface uses concepts known in our domain.\
    \ It says nothing about the storage mechanism. This makes it easy to read, easy\
    \ to stub for testing and easy to swap storage technologies.\n\nOur domain model\
    \ code can do all it needs to do using only this interface. It gives total separation\
    \ of concerns.\n\nThe methods listed above are typical:\n\n*   find a single User\
    \ by various unique things, like a userId\n\n*   find multiple users matching\
    \ some criteria\n\n*   return everything\n\nThe final method is really interesting.\
    \ It returns all User objects matching a specified Query, passed in as a parameter\
    \ object.\n\nQuery is itself an abstraction. It is not an SQL ‘SELECT’ query.\
    \ It is not a Mongo query. It is a group of pure Java objects that represent a\
    \ query. You would see things like:\n\n```\n1 Query q = \n2   new QueryBuilder()\n\
    3   .attributeMatches( \"name\", \"Al*\")\n4   .and()\n5   .timeAttributeBefore(\
    \ \"creationPoint\", new Time(\"2020-01-05T11.59.00Z\\\n6 \") )\n7   .build();\n\
    ```\n\nWhich would build an Abstract Syntax Tree (AST) describing a query that\
    \ matches all Users whose name begins with “Al” and whose creationPoint timestamp\
    \ was before 11:59 on Nov 5th 2020.\n\nThe Query object has a translate( QueryDialect\
    \ dialect ) method on it. This gets passed a concrete object that knows how to\
    \ generate a specific query for a specific technology - like MySqlQueryDialect.\
    \ Often, this is done using the Visitor pattern. It is probably the canonical\
    \ example of why you would use Visitor.\n\nThis maps the generic query to be mapped\
    \ into something useful to an implementation. It also means the domain code query\
    \ above does not change when the storage technology changes.\n\nExamples: Relational\
    \ data access, NoSQL data access, REST data store clients, caches\n\n## Query\n\
    \n[PoEAA] Describes what to search for, but not how it will be done\n\nOur applications\
    \ need to be able to find objects once they are created.\n\nIn memory, once we\
    \ create an object using new, we receive a reference to that object. We keep hold\
    \ of that reference and use it to access the object.\n\nFor objects we stored\
    \ in the Repository earlier, we don’t have this reference. To find our object(s)\
    \ again, we need a Query. Some way of specifying ‘look for the object(s) best\
    \ matching these search terms.\n\nQueries take all forms. We’ve seen one frequently\
    \ in out findUserById(userId) method. Here, the search criteria “by user ID” is\
    \ baked into the method name.\n\nThat’s readable, simple and testable, But it\
    \ isn’t very flexible.\n\nOften, we need a general-purpose query system. Just\
    \ like the kind we find in an SQL statement.\n\nBut here’s the catch: we don’t\
    \ want to express it as SQL.\n\nWe’ve used a Repository object. We’ve used Hexagonal\
    \ Architecture so that our domain layer knows nothing about how that Repository\
    \ will be implemented.\n\nIf we were to pass SQL statements into our finder methods,\
    \ that defeats the whole purpose of that. We have created a *leaky abstraction*,\
    \ one where parts of one specific implementation ‘leak through’.\n\nThe solution\
    \ is to split a query into two parts:\n\n*   Pure English: An abstract representation\
    \ of search criteria\n\n*   Specific Details: A translator turns that into some\
    \ specific technology\n\nIt’s easier to understand once we realise all queries\
    \ can be written in English. “Show me all the users who joined yesterday” is an\
    \ example. That’s the role of the Query object pattern. The Query object expresses\
    \ things in pure domain terms. A translator object then converts this into whatever\
    \ form is needed.\n\n### Simple Query Object\n\nIt’s often useful to have a very\
    \ simple kind of Query object. It is intentionally limited in the queries it can\
    \ represent, making it simpler to write the translator object for. The trick is\
    \ to make it good enough to do the job.\n\n```\n 1 class Query {\n 2     private\
    \ String name ;\n 3     private Object value ;\n 4 \n 5     public void attributeEquals(String\
    \ name, Object value) {\n 6         this.name = name ;\n 7         this.value\
    \ = value ;\n 8     }\n 9 \n10     public void translate(Translator t) {\n11 \
    \        t.generate(name, value);\n12     }\n13 }\n14 \n15 interface Translator\
    \ {\n16     void generate(String name, Object value);\n17 }\n```\n\nThis bare-bones\
    \ Query object shows the basic split of work. We can represent just the one query\
    \ - ‘is <attribute> equal to <value>?’. We can call translate() passing in some\
    \ Translator object to generate an implementation-specific query.\n\nHere is a\
    \ simple SqlTranslator object that will create a SELECT statement for us, then\
    \ display it - just for this example. It would normally link up to a Database\
    \ object. This would manage a JDBC connection, run the SQL, then return a User\
    \ object.\n\n```\n 1 class SqlTranslator implements Translator {\n 2     private\
    \ final String table ;\n 3     private String sql ;\n 4 \n 5     public SqlTranslator(\
    \ String table ) {\n 6         this.table = table ;\n 7     }\n 8 \n 9     public\
    \ void generate( String name, Object value ) {\n10         // Note: this only\
    \ works for text values\n11         sql = String.format(\"SELECT * FROM %s WHERE\
    \ %s = '%s'\", \n12                                 table, name, value);\n13 \
    \    }\n14 \n15     public void displayForDebug() {\n16         System.out.println(\
    \ sql );\n17     }\n18 }\n```\n\nWe use these classes to implement our findUserById()\
    \ method:\n\n```\n 1 User findUserById( String userId ) {\n 2     Query q = new\
    \ Query();\n 3     q.attributeEquals( \"id\", userId );\n 4 \n 5     Translator\
    \ sql = new SqlTranslator();\n 6     q.translate(sql);\n 7 \n 8     sql.displayForDebug();\n\
    \ 9 \n10     // real database code omitted\n11 }\n```\n\nYou can see how the details\
    \ of SQL are hidden in the SqlTranslator object. The details of what we want to\
    \ search for are hidden in the Query object itself.\n\nSignificantly, they are\
    \ expressed in domain terms - not SQL or database terms. We could write a MongoTranslator\
    \ or FileTranslator and make those work.\n\nYou can also see the comment: it only\
    \ works for String values.\n\nMore complete Query objects need to convert between\
    \ Java data types and whatever type the storage technology needs.\n\nIn fact,\
    \ Query objects and translators get complex, fast.\n\nThe full-fat version builds\
    \ an Abstract Syntax Tree of Criteria objects, complete with operators such as\
    \ AND, OR, LIKE, NOT, EQUALS, BETWEEN. They will convert between all the data\
    \ types and use the Visitor pattern to translate the Criteria graph into the implementation\
    \ version.\n\nI have actually built one of those for a real project. It was a\
    \ system where a user could build their own queries to report on a fleet of printers\
    \ in an enterprise network. The actual implementation was intended to use a number\
    \ of backend database systems to store a snapshot of that fleet’s status.\n\n\
    The best reference on complex Query objects is Patterns of Enterprise Application\
    \ Architecture by Martin Fowler [PoEAA]. Remember you can start simple and still\
    \ get the benefits for many applications.\n\n## CollectingParameter\n\n[C2WIKI]\
    \ An object that collects results\n\nHow do we use tell-don’t-ask style coding\
    \ with an aggregate object when we want to produce some kind of summary or total\
    \ result?\n\nA Collecting Parameter is an object we can pass into a method. The\
    \ same collecting parameter will be passed to a number of different objects, so\
    \ that each object can add its contribution:"
