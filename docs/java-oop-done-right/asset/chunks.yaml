    \n## Fatal errors: Stop the world!\n\nAnother view on exceptions is that you only\
    \ use them for an unfixable problem that needs to stop the program immediately.\n\
    \nThese will be a RuntimeException (or subclass) that is thrown and never caught.\
    \ The Java Virtual Machine will then kill whatever thread was running when that\
    \ uncaught exception happened. If that happens to be the main thread, the program\
    \ exits.\n\nIn this view of the world, we cannot use exceptions to represent errors\
    \ we can fix, or errors we don’t care about. We have to decide at the point where\
    \ we throw that everything is lost. Perhaps our disk failed, and we cannot retrieve\
    \ data.\n\nPerhaps the input data is corrupted, and we have no idea how to process\
    \ it. Throw the exception and get outta there.\n\nThis extreme approach is often\
    \ advocated by those who view exceptions *not* as a way of reporting abnormal\
    \ behaviour, but as a ‘giant goto statement’.\n\nBecause exceptions affect control\
    \ flow, breaking out of our neat structures and call hierarchies, they can seem\
    \ a bit hacky to some. Just like we invented if/else and while/for loops to avoid\
    \ using goto - based on the David L. Parnas’ ‘Goto considered harmful’ paper from\
    \ 1972 - then exceptions are seen as another goto that we should avoid.\n\n##\
    \ Combined approach: Fixable and non-fixable errors\n\nA third way combines the\
    \ two.\n\nWe use exceptions to represent fixable errors. We use different exceptions\
    \ to represent non-fixable errors.\n\nThe classic example is a timeout on an access\
    \ to an unreliable system, say a REST service call that may fail if the network\
    \ is down:\n\n```\n 1 for (int attempts = 0; attempts < 3; attempts++) {\n 2 \
    \    try {\n 3         callUnreliableService();\n 4         return ; // happy\
    \ path - exit the method\n 5     }\n 6     catch( ServiceTemporarilyUnavailableException\
    \ se ) {\n 7         Thread.sleep(1000); // wait one second\n 8     }\n 9 }\n\
    10 \n11 throw new ServiceUnavailableException();\n```\n\nThis snippet calls a\
    \ method ‘callUnreliableService()’. That may fail by throwing ServiceTemporarilyUnavailableException.\
    \ That may well be a temporary glitch. So we wait a second, to give things a chance\
    \ to recover, then try again.\n\nIf it hasn’t worked three times in a row, we\
    \ admit defeat and throw the ServiceUnavailableException. This exception tells\
    \ the calling code that it has a problem, and should work around it, or terminate\
    \ the program.\n\nThis whole approach is based on the idea that each software\
    \ subsystem can only really report that it is not working. But it cannot really\
    \ know if that is a problem to its calling code or not. The calling code is best\
    \ placed to know how to handle this event.\n\nOur code has handled all the exceptions\
    \ it knows how to - then delegates upwards when it has nothing left to attempt.\n\
    \n## Which approach is best?\n\nBlimey! I’m not going to get dragged into that\
    \ massive argument.\n\nBut you need to ideally pick one approach and stick to\
    \ it. Otherwise, people get very tetchy as they end up converting between approaches.\n\
    \nAnyway - now we can get back to our missing user problem.\n\n## NullPointerException"
