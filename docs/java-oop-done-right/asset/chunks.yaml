  trans: "\n\n```java\nclass TextConversion {\n    private Input input ;\n    private\
    \ Output output ;\n    \n    public TextConversion(final Input input, final Output\
    \ output){\n        this.input = input;\n        this.output = output;\n    }\n\
    \    \n    public void showInputInUpperCase() {\n        String inputText = input.fetch();\n\
    \        String upperCaseText = inputText.toUpperCase();\n        output.display(upperCaseText);\n\
    \    }\n}\n```\n\n在此时，我们已经对外部系统实现了依赖反转。\n\n这段代码使用 `Input` 和 `Output` 接口分别获取输入和显示输出。它完全不了解输入是如何收集的机制。它完全不知道输出被发送到了哪里。\n\
    \n这是我们单元测试的秘诀：我们可以为这些接口创建测试版本。将它们想象成好莱坞电影中演员的“替身”。\n\n我们甚至将这些类称为“测试替身”（Test Doubles）。\n\
    \n## 测试替身 - 桩 (Stubs) 和 模拟 (Mocks)\n\n核心思想是解决手动测试中产生的问题。\n\n我们可以通过在键盘上输入“abc123”并肉眼观察控制台上输出“ABC123”来手动测试这段代码。\n\
    \n这具有手动测试通常的缺点：速度很慢。我们经常忘记执行。它成本高昂——并且会延迟交付。解决方案是以某种方式实现测试自动化。\n\n但我们如何自动化键盘输入呢？我们如何替换掉盯着控制台的人类观察者呢？\n\
    \nSOLID 给出的答案是：*我们不需要*。\n\n外部系统总是会干扰单元测试。通常情况下，我们无法断言它们显示的内容，也无法在物理键盘上更改输入。\n\n\
    相反，我们通过测试替身来完全替换键盘和控制台——这些类将实现输入的自动化并对输出的分析。\n\n## 用于单元测试的 DIP - 桩 (Stubs) 和 模拟\
    \ (Mocks)\n\n依赖反转为我们的测试问题提供了答案。\n\n由于我们的代码不知道输入是如何收集的或输出被传递到哪里，我们可以编写特定的测试类来提供帮助。这些就是我们的测试替身。\n\
    \n然后我们在单元测试中将这些测试替身注入到 `TextConversion` 代码中。\n\n这里的巨大优势在于，我们没有以任何方式修改被测试的代码。如果它通过了单元测试，那么这段代码就可以在生产环境中使用了。它将是完全相同的代码。\n\
    \n我们需要为 `Input` 接口准备一个替身，为 `Output` 接口准备一个替身。每一个在执行的任务上都略有不同。我们有一些术语，以便能够清楚地讨论这些差异。\n\
    \n*   Input 测试替身是一个 `stub` (桩)\n*   Output 测试替身是一个 `mock` (模拟)\n\n桩（stub）只是我们其中一个依赖接口的实现，它*返回已知数据*。因为我们预先知道它会输出什么数据，所以我们可以预测它对被测试代码产生什么影响。\n\
    \n实现这一点的一种方法是创建一个 `StubInput` 类。它可以实现 `Input` 接口，并在 `fetch()` 中始终返回字符串‘abcde123’。\n\
    \n另一种方法是使用 `Mock`（模拟）对象。模拟（Mock）是桩（stub）的互补。模拟实现了接口，并*记录与它的任何交互*。\n\n`MockOutput`\
    \ 类可以实现 `Output`。然后，它可以捕获我们发送到 `display()` 方法的任何内容。我们可以编写测试对这些捕获的数据进行断言。这将证明我们的代码使用正确的方法和预期的数据调用了输出接口。\n\
    \n让我们在代码中查看：\n\n```java\nclass StubInput implements Input {\n    private final\
    \ String stubValue ;\n    \n    public Input(String stubValue) {\n        this.stubValue\
    \ = stubValue ;\n    }\n    public String fetch() {\n        return stubValue;\n\
    \    }\n}\n```\n\n每当我们调用 `fetch()` 时，它都会为我们提供已知数据。\n\n我做了一个设计决策，传递我想返回的桩值，而不是选择返回常量的简单选项。理由是为了让测试更具读性；我们稍后会看到。\n\
    \n现在来看 `MockOutput`。它的职责是记录与 `display()` 方法的任何交互：\n\n```java\nclass MockOutput\
    \ implements Output {\n    private String actual ;\n    \n    public void display(\
    \ String toDisplay ) {\n        this.actual = toDisplay ;\n    }\n    \n    public\
    \ String getActual() {\n        return actual ;\n    }\n}\n```\n\n在这里，简单的 getter\
    \ 方法似乎很好地暴露了捕获的数据。你可以将字段设为公共；如果你喜欢，也可以提供一个 `boolean hasExpectedValue( String expectedValue\
    \ )` 方法。尽管我通常不喜欢 OOP 中的 getter，但在这里似乎是处理此任务的正确工具。\n\n我们现在可以使用这些测试替身来编写一个完全自动化的单元测试：\n\
    \n```java\nclass TextConversionTest {\n    \n    @Test\n    public void displaysUpperCasedInput()\
    \ {\n        // Arrange\n        var in = new StubInput(\"abcde123\");\n     \
    \   var out = new MockOutput();\n        \n        var tc = new TextConversion(\
    \ in, out );\n        \n        // Act\n        tc.showInputInUpperCase();\n \
    \       \n        // Assert\n        assertThat(out.getActual()).isEqualTo(\"\
    ABCDE123\");\n    }\n}\n```\n\n每当我们调用 `fetch()` 时，它都会为我们提供已知数据。\n\n我做了一个设计决策，传递我想返回的桩值，而不是选择返回常量的简单选项。理由是为了让测试更具读性；我们稍后会看到。\n\
    \n现在来看 `MockOutput`。它的职责是记录与 `display()` 方法的任何交互：\n\n```java\nclass MockOutput\
    \ implements Output {\n    private String actual ;\n    \n    public void display(\
    \ String toDisplay ) {\n        this.actual = toDisplay ;\n    }\n    \n    public\
    \ String getActual() {\n        return actual ;\n    }\n}\n```\n\n简单的 getter 方法似乎很好地暴露了捕获的数据。你可以将字段设为公共；如果你喜欢，也可以提供一个\
    \ `boolean hasExpectedValue( String expectedValue )` 方法。尽管我通常不喜欢 OOP 中的 getter，但在这里似乎是处理此任务的正确工具。\n\
    \n我们现在可以使用这些测试替身来编写一个完全自动化的单元测试：\n\n```java\nclass TextConversionTest {\n    \n\
    \    @Test\n    public void displaysUpperCasedInput() {\n        // Arrange\n\
    \        var in = new StubInput(\"abcde123\");\n        var out = new MockOutput();\n\
    \        \n        var tc = new TextConversion( in, out );\n        \n       \
    \ // Act\n        tc.showInputInUpperCase();\n        \n        // Assert\n  \
    \      assertThat(out.getActual()).isEqualTo(\"ABCDE123\");\n    }\n}\n```\n\n\
    ## Mock 库\n\n既然我们理解依赖反转允许我们生成测试替身，我们可以简化生活。\n\n正如你所见，手动编写大量的测试替身相当疲惫的。这是样板代码。\n\
    \n正如你预期的，库可以帮助我们。\n\nJava 中最流行的是 Mockito。它是一个允许我们仅通过注解就生成模拟和桩的库。\n\n使用 Mockito，上面的单元测试会变成这样：\n\
    \n```java\nclass TextConversionTest {\n    @Mock\n    private Input input ;\n\
    \    \n    @Mock\n    private Output output ;\n    \n    @Before\n    public void\
    \ beforeEachTest() {\n        MockitoAnnotations.openMocks(this);\n    }\n   \
    \ \n    @Test\n    public void displayUpperCasedInput() {\n        // Arrange\n\
    \        Mockito.when(input.fetch()).thenReturn(\"abcde123\");\n        var tc\
    \ = new TextConversion(input, output);\n        \n        // Act\n        tc.showInputInUpperCase();\n\
    \        \n        // Assert\n        Mockito.verify(output).display(\"ABCDE123\"\
    );\n    }\n}\n```\n\nMockito 提供 `@Mock` 注解来自动生成测试替身。这些对象既可以是 Mock 也可以是 Stub。\n\
    \n桩（Stub）行为由 `Mockito.when()` 提供。最常见的用法是将其与 `.thenReturn(stubValue)` 链用。\n\n模拟（Mock）行为由\
    \ `Mockito.verify()` 支持，它允许检查方法是否被调用以及使用的参数是什么。\n\nMockito 是一个广泛使用的第三方库。它提供了许多生成模拟和桩的工具。我建议你查看一下。\n\
    \n## 自分 (Self-Shunt) 模拟和桩\n\n最后一种技术值得提：自分。\n\n"
- fmt: "\nThis is where we make the test class implement the interfaces itself. It\
    \ means there is no need for hand-rolled test double classes and no need for mocking\
    \ libraries. Tests run faster. We even get a little design feedback when our interfaces\
    \ get too big; the test gets annoying to write.\n\n```\n 1 class TextConversionTest\
    \ implements Input, Output {\n 2     private final Input input = this ;\n 3  \
    \   private final Output output = this;\n 4 \n 5     private String actualOutput\
    \ ;\n 6 \n 7     // Input interface stub\n 8     public String fetch() {\n 9 \
    \        return \"abcde123\";\n10     }\n11 \n12     // Output interface mock\n\
    13     public void display( String output ) {\n14         this.actualOutput =\
    \ output;\n15     }\n16 \n17     @Test\n18     public void displayUpperCasedInput()\
    \ {\n19         // Arrange\n20         var tc = new TextConversion(input, output);\n\
    21 \n22         // Act\n23         tc.showInputInUpperCase();\n24 \n25       \
    \  // Assert\n26         assertThat(actualOutput).isEqualTo( \"ABCDE123\" );\n\
    27     }\n28 }\n```\n\nThe test class acts as its own test doubles. The fields\
    \ `input` and `output` make the intent easier to understand.\n\nI worked on one\
    \ project where this style was the only one accepted. I liked it; but overall,\
    \ it’s a bit weird. I’ve not seen it used elsewhere.\n\nBut it’s a nice tool to\
    \ have in the toolbox.\n\n# Refactoring\n\nEvery technique so far has been about\
    \ structuring code for the first time.\n\nWe have worked hard to make our code\
    \ readable and simple. To help us do that, we have designed and tested from the\
    \ outside in, choosing to make what we are solving more prominent than how we\
    \ are solving it.\n\nBut what about when we haven’t got it right? What happens\
    \ when we learn a new insight into our problem? What about when we have thrown\
    \ down ‘the simplest possible code’ to make a test pass, but now we want clean\
    \ code?\n\n## What is refactoring?\n\nRefactoring is the name given to changing\
    \ the structure of our code whilst keeping its behaviour the same. Re-structuring\
    \ our code, but without breaking anything.\n\nThe name comes from factoring, which\
    \ comes from algebra. Factoring is the basic idea of splitting something up into\
    \ smaller parts. Refactoring is simply ‘doing it again’.\n\nI am always refactoring.\n\
    \nI’ll refactor as part of the TDD process, as is standard. I will write a failing\
    \ test, add the simplest production code to make it pass, then refactor.\n\nWhen\
    \ faced with new code that’s hard to understand, I’ll refactor it first. That\
    \ way, I capture any insights I get and preserve this hard-won understanding in\
    \ the code.\n\nThat’s why refactoring is useful. But how do we do it?\n\nMartin\
    \ Fowler’s book `Refactoring` is the reference on this subject. The first edition\
    \ is all Java-based and the one I recommend for Java devs. The second edition\
    \ uses JavaScript ES6 with class support for the examples. It’s okay, but not\
    \ as direct for us Java developers.\n\nHere are the refactoring steps I use all\
    \ the time - and why.\n\n## Rename Method, Rename Variable\n\n```\n 1 class User\
    \ {\n 2     private final String text ;\n 3 \n 4     public User( String name\
    \ ) {\n 5         this.text = name ;\n 6     }\n 7     \n 8     public void printout()\
    \ {\n 9         System.out.println(\"Welcome back, \" + text);\n10     }\n11 }\n\
    ```\n\nThis `User` class will print out ‘Welcome back, Alan’ after creating the\
    \ object passing in the name Alan.\n\nThe name is stored in a field called `text`.\
    \ Hmm. It is `text` - but that’s not really telling me what that field is used\
    \ for. It is being used to store the User’s name that we want to put into the\
    \ welcome message.\n\nThe fix is to use `Refactor > Rename` of that field. Call\
    \ it `name`.\n\nIn the same vein, method `printout()` isn’t very helpful in understanding\
    \ the code, either. Yes, the method will print something out. We can read that.\
    \ But that isn’t *what* it is doing, that’s *how*. We want our methods to explain\
    \ why they are there and what their outcome is.\n\nWe can use `Refactor > Rename`\
    \ on the method name to give it a descriptive name. Let’s choose `welcome()`.\
    \ This better explains what is being done.\n\n```\n 1 class User {\n 2     private\
    \ final String name ;\n 3 \n 4     public User( String name ) {\n 5         this.name\
    \ = name ;\n 6     }\n 7     \n 8     public void welcome() {\n 9         System.out.println(\"\
    Welcome back, \" + name);\n10     }\n11 }\n```\n\nThese two refactorings - changing\
    \ the name of a field or method - are the ones I use all the time. Literally.\
    \ To the point where I no longer stress out about thinking up ‘the best’ names.\
    \ I just code, come up with a first stab at a name, then come back and refactor\
    \ it when I get a better idea.\n\nI find my brain works like that. Something happens\
    \ in the background as I am working away. I’ll get a better insight a little later.\n\
    \n### Prefer IDE tools over manual changes\n\nYour IDE if it is `IntelliJ`, `Eclipse`,\
    \ `NetBeans` or `VS Code` will automate this.\n\n## Extract Method\n\nAnother\
    \ favourite that I actually use for purposes:\n\n*   Split up a method into logical\
    \ chunks\n*   Replace comments by turning them into methods\n*   Clarify how a\
    \ method works, by adding descriptive names\n\nHere’s a SpaceInvaders to give\
    \ an idea of all:\n\n```\n 1 class SpaceInvaders {\n 2     private final List<Invader>\
    \ invaders;\n 3     private final Display display ;\n 4 \n 5     // constructor\
    \ and other methods omitted\n 6 \n 7     public void update() {\n 8         //\
    \ Move invaders\n 9         for ( Invader i : invaders ) {\n10             i.updatePosition();\n\
    11         }\n12 \n13         // Draw invaders\n14         for ( Invader i : invaders\
    \ ) {\n15             i.draw( display );\n16         }\n17     }\n18 }\n```\n\n\
    My first refactor step would be to break up the method. Not because it’s too long\
    \ in this case, but so I can turn those comments into methods.\n\n```\n 1 class\
    \ SpaceInvaders {\n 2     private final List<Invader> invaders = new ArrayList<>();\n\
    \ 3     private final Display display ;\n 4 \n 5     // constructor and other\
    \ methods omitted\n 6 \n 7     public void update() {\n 8         moveInvaders();\n\
    \ 9         drawInvaders();\n10     }\n11 \n12     private void moveInvaders()\
    \ {\n13         for ( Invader i : invaders ) {\n14             i.updatePosition();\n\
    15         }\n16     }\n17 \n18     private void drawInvaders() {\n19        \
    \ for ( Invader i : invaders ) {\n20             i.draw( display );\n21      \
    \   }\n22     }\n23 }\n```\n\nThis has extracted the two for loop blocks into\
    \ private methods. The comment names were then turned into method names.\n\nDoing\
    \ this is really helpful. It makes the code more self-documenting. Best of all,\
    \ it stops comments going out of date.\n\nA comment is effectively duplication\
    \ in the code. It says in English what a block of code is doing. By turning this\
    \ block into a method, we get the chance to add a method name to explain what\
    \ that code is doing. If the code changes, you are more likely to change the method\
    \ name than to change both the method name and a comment.\n\nAs a matter of style,\
    \ as the class is called `SpaceInvaders`, I would probably shorten the names to\
    \ `move()` and `draw()`. We already know the class is all about Invaders. The\
    \ shorter names are clear because we have context from the class name.\n\n## Change\
    \ Method Signature\n\nThis is an excellent refactoring to emphas the problem domain.\n\
    \nA genuine example from a Web Conferencing startup I worked at was this:\n\n\
    ```\n1 public void Chat {\n2   public void sendMessage( String toUsername ) {\n\
    3     // code ...\n4   }\n5 }\n```\n"
