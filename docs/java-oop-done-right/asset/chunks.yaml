    the the the the the the the the the the the the the the the the the the.......................................


    ,,,,,,.




    .. an an approach to designing designing on on his GR principles. It is is a well--,,,
    of of the design advice.


    ISBN 978-032118516


    https://www.amazon.co.uk/dp/032118516

