    \ fetchDisplayNameForFirstAl( List users ) {\n2     return users.stream()\n3 \
    \        .filter( user -> user.nameStartsWith(\"Al\") )\n4         .findFirst()\n\
    5         .map( user -> user.getName().toUpperCase() );\n6 }\n```\n\nThis approach\
    \ combines pure functions into a pipeline. You’ll see that this doesn’t really\
    \ live in the world of OOP. Typically, classes are abused as pure data structures\
    \ - getters and setters, no real behaviours, no encapsulation. The external functions\
    \ add behaviour onto that raw data.\n\nAs a result, Java needed a new way to handle\
    \ errors inside these chains of functions."
