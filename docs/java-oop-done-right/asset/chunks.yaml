  trans: "\n另一个用是框架交给了你它自己的一个对象，而你需要额外的特定应用程序功能。你无法更改框架代码，因此使用 `Decorator` 对其进行封装通常会有帮助。\n\
    \n示例：`缓存`、`访问控制`、`生产环境日志`、`扩展框架`\n\n## 外部系统（代理）\n\n[GoF] 代表我们在本地对外部系统的视图\n\n外部系统对我们的应用程序来说是一个挑战。它们之间总是需要某种原始数据传输，并某种方式映射到我们的对象。由于这些系统存在于我们的内存空间之外，通信将要慢得多。它通常比本地调用方法慢\
    \ 100,000 倍。\n\n当我们引入一个本地对象来表示该外部系统时，处理这些挑战就会变得更简单。\n\n处理外部系统的最佳方法是：\n\n* 创建一个接口来表示它\n\
    * 仅使用我们的领域术语来抽象掉细节\n\n我们在“六边形架构”章节中详细介绍了这一点。这是其背后的模式。\n\n`External System` 对象非常强大，因为它将我们与该系统的细节解耦了。这为我们提供了多种可能性。我们可以使用\
    \ `stub` 进行测试。我们可以创建简单的 `Fakes` 来帮助我们的团队分工开发。我们可以用类似 `Cache`、日志或监控等工具对系统进行封装。\n\
    \n具体来说，外部系统对象代表了该系统中`我们需要的全部`。以 `Google Maps` 为例，它有很多实用的功能。但如果我们只需要获取某个点最近的城镇名称的能力，那么我们的接口将会是：\n\
    \n```\n1 interface Geography {\n2     String getNameOfTownNearestTo( float lat,\
    \ float long );\n3 }\n```\n\n当然，我们会创建一个实现此接口的 `GoogleMapsGeography` 对象，并通过 HTTP\
    \ 实际上连接 `Google Maps API`。\n\n这是一个更大的、非常有用的设计理念的一部分，被称为`消费者驱动约（consumer driven\
    \ contracts）`。\n\n该理念的核心是，所有重要的是特定客户端需要什么。你可以利用此根据实际需要——而不是“可能有用”的特性——从外向内（outside-in）地驱动出服务器所需的行为。\n\
    \n我看到的原始模式是 `[GoF]` 中的 `Proxy`。那是一种更通用的对象。它与某些其他对象具有相同的接口并取代其位置。在我的工作中，`Proxy`\
    \ 的大量使用是为了表示外部系统，因此我更倾向于像上面那样思考它。\n\n## 配置\n\n[Own] 提供了一种更改系统设置方式的方法\n\n一旦面向对象的程序开始执行有用工作，它在启动时和整个运行期间都需要各种项进行设置。\n\
    \n在启动时，它需要将其所有对象创建为类的实例。所有各种依赖项都需要注入。需要提供外部网络服务的 `URLs`。需要提供数据库的连接字符串和地址。\n\n\
    这些内容通常特定于我们运行的环境。当我们使用测试数据库和在生产环境中运行时，数据库字符串是不同的。网络服务的 URL 可能指向用 `WireMock` 构建的虚假服务器，而不是网络上的真实服务。\n\
    \n甚至对象的`种类` 也可能会改变。我们可能在文件中有一个设置，用于使用 `Oracle` 数据库或 `Microsoft SQL Server`。在每情况下可能需要创建一个不同的对象，然后将其注入到所有的调用者中。\n\
    \n我们称之为 `Configuration` 配置。它包括设置如 `URLs` 等数据值、创建特定对象以及“对象接线”——在对象之间注入依赖关系。\n\n\
    放置所有这些内容的最佳位置是一个 `Configuration` 类：\n\n```\n 1 class Configuration {\n 2     private\
    \ boolean useOracle;\n 3     private String jdbcConnectionString;\n 4     private\
    \ boolean useDarkMode;\n 5     private Date offerExpiryDate ;\n 6 \n 7     public\
    \ void load() {\n 8         // 读取配置文件或服务器的代码\n 9     }\n10 \n11     public UserRepository\
    \ userRepository() {\n 12         if ( useOracle ) {\n 13             return new\
    \ OracleUserRepository(jdbcConnectionString);\n 14         }\n 15 \n 16      \
    \   log(WARN, \"Using STUB User Repository - TEST/QA ONLY\");\n 17         return\
    \ new StubUserRepository();\n 18     }\n 19 \n 20     public UiStyleScheme styleScheme()\
    \ {\n 21         return useDarkMode? \n 22             new UiStyleDark() :\n 23\
    \             new UiStyleLight() ; \n 24     }\n 25 \n 26     public Date getOfferExpiryDate()\
    \ {\n 27         return offerEXpiryDate ;\n 28     }\n 29 }\n```\n\n这给出了基本概念。`Configuration`\
    \ 存在`某处`然后被读取。根据这些数据，为其他地方的使用创建正确类型的对象。代码的其他部分引用此 `Configuration` 对象来获取其依赖和值。\n\
    \n实际的配置数据通常存储在类似 `config.json` 的文件中，或者可能是固定位置的数据库，或者网络服务。像 `Spring Cloud` 这样的提供者使用网络广播在运行时发现配置服务器。\n\
    \n一旦读取，`Configuration` 对象上的方法就可以用于创建所需的特定对象。它们可以使用 `URLs`、超时和连接字符串等项的所需值进行初始化。\n\
    \n通常，可以在这里创建整个对象。这导致了整洁的代码。但我添加了一个 getter 来返回纯数据值。`Configuration` 类是一个通常这样做是个好主意的地方，从而产生最清晰的代码。\n\
    \n随着应用程序的增长，将其拆分为多个 `Configuration` 类是有意义的。\n\n这些与你的`六边形架构`对齐，使每个子系统都拥有自己的 `Configuration`\
    \ 对象。你最终会在领域层中有一个 `Configuration` 接口，然后编写一个特定的 `Adapter` 将其连接到源。\n\n我还展示了一种常见的想法，我们在生产环境中使用\
    \ Oracle 数据库，但在配置文件中启用测试存根。\n\n这简化了跨团队开发。QA 人员不需要数据库连接即可对 UI 更改进行探索性测试。其他开发 Oracle\
    \ 的人员可以继续他们的工作。\n\n这种特定的设计不仅关乎清洁代码，还关乎团队领导和管理。\n\n## 订单-订单项目\n\n[Coad] 为订单上的列表提供结构\n\
    \n订单出现在商业系统的各个。你会经常看到收据、发票、清单和电子商务订单。\n\n每一个都有相同的相同的模式。\n\n有一个行项目描述被订购的物品。通常，它知道某些值的组合：数量、部件代码、描述、价格、税率、位置。这些以及适当的行为进入\
    \ `OrderLineItem` 对象。\n\n由于订单通常包含多个行项目，我们将这些聚合到 `Order` 对象中，描述整个订单。它通常知道关于下单时间、交付和账单详情、相关账户。`Order`\
    \ 的典型行为是显示、付款和下单（将订单移动到履行阶段）。\n\n`Order-LineItem` 仅仅是更通用的 `Aggregate` 对象理念的一个特定用例。但它是如此常见，值得指出。\n\
    \n## 请求-服务-响应\n\n[Own] 描述了从服务获取响应的流程\n\n这在`六边形架构`设计中经常出现。它是 Web 请求的“内部六边形”领域模型——没有任何\
    \ Web 技术的引用。因此，你可以将其用于任何类型的输入和输出适配器。它代表了对系统的通用请求。\n\n为了延续我们的主题，让我们展示如何将其通过 `id`\
    \ 查找用户。\n\n"
- fmt: "\nA web request will have come in, let’s say as RESTful format as `GET /users/alan0127`.\
    \ We would write an `Adapter` to extract the `userId` of `alan0127` from the path\
    \ parameter, then store that in a request object:\n\n```\n1 class FindUserByIdRequest\
    \ {\n2     private final String userId ;\n3 \n4     public FindUserByIdRequest(\
    \ String userId ) {\n5         this.userId = userId;\n6     }\n7 }\n```\n\nSo\
    \ far, this hides away the `userId` we extracted. Next up, we need to find this\
    \ user from our repository. We can do this because we’re entirely inside the inner\
    \ hexagon now - the pure domain model. Our `UserRepository` lives there:\n\n```\n\
    \ 1 interface UserRepository {\n 2     User findUserById( String userId );\n 3\
    \ }\n 4  5 class FindUserByIdRequest {\n 6     private final String userId ;\n\
    \ 7 \n 8     public FindUserByIdRequest( String userId ) {\n 9         this.userId\
    \ = userId;\n10     }\n11 \n12     public User execute( UserRepository users )\
    \ {\n13         return users.findUserById( userId );\n14     }\n15 }\n```\n\n\
    We add the `execute()` method which is supplied a `UserRepository` implementation\
    \ of some kind. That will be a stub for unit testing and something real like `PostgresUserRepository`\
    \ for production. The `execute` takes the `userId` we stored earlier, runs the\
    \ `findUserById()` query and returns the `User` object.\n\nOur web layer `Adapter`\
    \ class will then take the `User` object and format it into a web response.\n\n\
    In the dim and distant days of old, this would be an HTML response. But the last\
    \ few years have seen server side HTML generation replaced by JavaScript in the\
    \ browser. We’ll probably return a lump of JSON formatted data to a `React` (or\
    \ `Angular`, or `Vue`, or `vanilla JS…) application that formats it for display.\n\
    \nThis is a straightforward pattern that does what it says on the tin. Its value\
    \ is that it separates out the various technologies from the business logic. Using\
    \ Liskov `LSP` substitutable objects for our interfaces makes this a mix-and-match\
    \ system. The same domain model that drives a web site can just as easily power\
    \ a desktop GUI written in `JavaFX` as it can a console app.\n\n## Anti-Patterns\n\
    \nDesign patterns are powerful, but they are easily overused. There are a couple\
    \ of anti-patterns to avoid.\n\n### Design Pattern Soup\n\nDon’t create a ‘kitchen\
    \ sink’ design.\n\nWhenever you see you have written `class StrategyFactoryFactoryBuilder`,\
    \ as my friend Jenny would say, you need to ‘Go into the corner and have a word\
    \ with yourself’.\n\nThere might be a reason you ended up down this rabbit hole.\
    \ But try to re-design your way out of it, if you can. If that’s not possible,\
    \ rename this monster. Go back to basics: in terms of *the application*, what\
    \ does this beast gives us? Why is it here?\n\n### Unneeded Flexibility\n\nDon’t\
    \ over-design objects.\n\nYou might add a pattern ‘just in case for future extension’.\
    \ Perhaps our simple `User` object could sprout an `Observer` pattern, allowing\
    \ future code to listen for changes to the user name.\n\nLet’s just take that\
    \ out, shall we?\n\nLeave the future to itself. Our crystal balls aren’t good\
    \ enough. We can’t know what code will be best in the future.\n\nEven if the requirement\
    \ lands, we often find that when it does, things have moved on. The assumptions\
    \ we made in our original guess at future code were wrong. The code is now cruft\
    \ that we have to write a workaround for.\n\nJust write the code for today. Let\
    \ tomorrow take care of itself. We will refactor as required.\n\n### Mechanism\
    \ Madness\n\nDon’t over-emphasise how something works.\n\nWe’re going back to\
    \ basics here. Good design highlights what something gives you, rather than what\
    \ it is made from.\n\nRather than copy-paste the patterns directly, blend them\
    \ in.\n\nIf our `User` object *did* need an `Observer` pattern for name changes,\
    \ let’s not call it that. Let’s create an interface called `NameChanged` rather\
    \ than `Observer`.\n\nPatterns are meant to be used blended in like this. Otherwise,\
    \ they would simply be a library of fixed code. Then they would lose their value.\n\
    \n# OOP Mistakes - OOP oops!\n\nSo far, we’ve covered ways to use OOP well.\n\n\
    We’ve seen a lot of techniques that make code readable, easy to test and compact.\
    \ Remember how easy it was to combine `Repository` with `Cache` with `Decorator`\
    \ and get a pluggable speed boost?\n\nIt turns out that not everybody agrees that\
    \ OOP is a good thing.\n\nIn part, of course, they are right. Plenty of things\
    \ just are not suited to OOP. I can think of simple batch scripts, build scripts\
    \ and `Terraform` scripts that set up infrastructure. We also have ‘Serverless\
    \ Designs’, which use many small functions to do their work. OOP often gets in\
    \ the way there.\n\nAnother driver of non-OOP designs has been processing power\
    \ limitations.\n\nFor decades, CPUs followed Moore’s Law. Computing power doubled\
    \ every two years. But then it hit a physical limit. CPUs had as many transistors\
    \ on them as could be fitted. “I cannae change the laws o’ physics!” said Scottie\
    \ in Star Trek; So it is with photolithography. A transistor can be made only\
    \ so small, but no smaller. Then physics fights back.\n\nTo get around this, CPUs\
    \ created multiple cores - multiple copies of a CPU design on the same chip.\n\
    \nThis impacted software design. Suddenly, we needed parallel processing rather\
    \ than sequential. The kinds of state that lived inside one object of OOP was\
    \ not accessible to other CPU cores. OOP became less useful as a model of communicating\
    \ state across CPU cores. Functional Programming - “stateless” programming - is\
    \ useful here.\n\nHowever, none of that was what gave OOP a bad name. What gave\
    \ it a bad name was OOP *done wrong*.\n\n## Broken Encapsulation - Getters Galore!\n\
    \nNumber 1 in my chart of badness, a very common error:\n\n```\n1 class User {\n\
    2     private String name ;\n3 \n4     // This is painful to type ...\n5     public\
    \ String getName() {\n6         return name ;\n7     }\n8 \n9     // so is this\n\
    10     public void setName( String name ) {\n11         this.name = name;\n12\
    \     }\n13 }\n14 \n15 class UserGreeter {\n16 \n17     // I swear fairies and\
    \ kittens are dying right now\n18     public void greet( User u ) {\n19      \
    \   System.out.prinltn( u.getName() );\n20     }\n21 }\n```\n\nWe’ve all seen\
    \ this - getters and setters everywhere!\n\nIt makes me sad. It really does.\n\
    \nNow, to be fair, Java has to take a lot of blame for this. Right from version\
    \ 1.0, Java had this idea of “Java Beans” which were things like User above. You\
    \ had fields, but every field had a getter and setter. Somehow, that became A\
    \ Thing (TM), and it was used everywhere.\n\nThis caught on with developers who\
    \ had understood procedural programming but hadn’t yet learned OO. They hadn’t\
    \ learned about objects exposing behaviour and hiding secrets.\n\nWhen you think\
    \ in that way, every problem looks like getters-and-setters. When people criticise\
    \ OOP for not delivering on its promises - but base it on code like this - it\
    \ is obvious where the fault lies: This one is on them. If you don’t even realise\
    \ your code is not OOP, then don’t criticise OOP for your code!\n\n## Broken Inheritance\n\
    \nThe darling of the early 1990s, inheritance was going to be magic! You whacked\
    \ a few classes together with inheritance and Boom! Your code was done.\n\nBut\
    \ it wasn’t done. Instead, it was just a mess.\n\nThere were several failings\
    \ with inheritance. They are the ones that appear in “OOP is dead” blog posts\
    \ these days.\n"
  raw: "A web request will have come in, let’s say as RESTful format as GET /users/alan0127\\\
    . We would write an Adapter to extract the userId of alan0127 from the path parameter,\
    \ then store that in a request object:\n\n```\n1 class FindUserByIdRequest {\n\
    2     private final String userId ;\n3 \n4     public FindUserByIdRequest( String\
    \ userId ) {\n5         this.userId = userId;\n6     }\n7 }\n```\n\nSo far, this\
    \ hides away the userId we extracted. Next up, we need to find this user from\
    \ our repository. We can do this because we’re entirely inside the inner hexagon\
    \ now - the pure domain model. Our UserRepository lives there:\n\n```\n 1 interface\
    \ UserRepository {\n 2     User findUserById( String userId );\n 3 }\n 4 \n 5\
    \ class FindUserByIdRequest {\n 6     private final String userId ;\n 7 \n 8 \
    \    public FindUserByIdRequest( String userId ) {\n 9         this.userId = userId;\n\
    10     }\n11 \n12     public User execute( UserRepository users ) {\n13      \
    \   return users.findUserById( userId );\n14     }\n15 }\n```\n\nWe add the execute()\
    \ method which is supplied a UserRepository implementation of some kind. That\
    \ will be a stub for unit testing and something real like PostgresUserRepository\
    \ for production. The execute takes the userId we stored earlier, runs the findUserById()\
    \ query and returns the User object.\n\nOur web layer Adapter class will then\
    \ take the User object and format it into a web response.\n\nIn the dim and distant\
    \ days of old, this would be an HTML response. But the last few years have seen\
    \ server side HTML generation replaced by JavaScript in the browser. We’ll probably\
    \ return a lump of JSON formatted data to a React (or Angular, or Vue, or vanilla\
    \ JS…) application that formats it for display.\n\nThis is a straightforward pattern\
    \ that does what it says on the tin. Its value is that it separates out the various\
    \ technologies from the business logic. Using Liskov LSP substitutable objects\
    \ for our interfaces makes this a mix-and-match system. The same domain model\
    \ that drives a web site can just as easily power a desktop GUI written in JavaFX\
    \ as it can a console app.\n\n## Anti-Patterns\n\nDesign patterns are powerful,\
    \ but they are easily overused. There are a couple of anti-patterns to avoid.\n\
    \n### Design Pattern Soup\n\nDon’t create a ‘kitchen sink’ design.\n\nWhenever\
    \ you see you have written `class StrategyFactoryFactoryBuilder`, as my friend\
    \ Jenny would say, you need to ‘Go into the corner and have a word with yourself’.\n\
    \nThere might be a reason you ended up down this rabbit hole. But try to re-design\
    \ your way out of it, if you can. If that’s not possible, rename this monster.\
    \ Go back to basics: in terms of *the application*, what does this beast gives\
    \ us? Why is it here?\n\n### Unneeded Flexibility\n\nDon’t over-design objects.\n\
    \nYou might add a pattern ‘just in case for future extension’. Perhaps our simple\
    \ User object could sprout an Observer pattern, allowing future code to listen\
    \ for changes to the user name.\n\nLet’s just take that out, shall we?\n\nLeave\
    \ the future to itself. Our crystal balls aren’t good enough. We can’t know what\
    \ code will be best in the future.\n\nEven if the requirement lands, we often\
    \ find that when it does, things have moved on. The assumptions we made in our\
    \ original guess at future code were wrong. The code is now cruft that we have\
    \ to write a workaround for.\n\nJust write the code for today. Let tomorrow take\
    \ care of itself. We will refactor as required.\n\n### Mechanism Madness\n\nDon’t\
    \ over-emphasise how something works.\n\nWe’re going back to basics here. Good\
    \ design highlights what something gives you, rather than what it is made from.\n\
    \nRather than copy-paste the patterns directly, blend them in.\n\nIf our User\
    \ object *did* need an Observer pattern for name changes, let’s not call it that.\
    \ Let’s create an interface called NameChanged rather than Observer.\n\nPatterns\
    \ are meant to be used blended in like this. Otherwise, they would simply be a\
    \ library of fixed code. Then they would lose their value.\n\n# OOP Mistakes -\
    \ OOP oops!\n\nSo far, we’ve covered ways to use OOP well.\n\nWe’ve seen a lot\
    \ of techniques that make code readable, easy to test and compact. Remember how\
    \ easy it was to combine Repository with Cache with Decorator and get a pluggable\
    \ speed boost?\n\nIt turns out that not everybody agrees that OOP is a good thing.\n\
    \nIn part, of course, they are right. Plenty of things just are not suited to\
    \ OOP. I can think of simple batch scripts, build scripts and Terraform scripts\
    \ that set up infrastructure. We also have ‘Serverless Designs’, which use many\
    \ small functions to do their work. OOP often gets in the way there.\n\nAnother\
    \ driver of non-OOP designs has been processing power limitations.\n\nFor decades,\
    \ CPUs followed Moore’s Law. Computing power doubled every two years. But then\
    \ it hit a physical limit. CPUs had as many transistors on them as could be fitted.\
    \ “I cannae change the laws o’ physics!” said Scottie in Star Trek; So it is with\
    \ photolithography. A transistor can be made only so small, but no smaller. Then\
    \ physics fights back.\n\nTo get around this, CPUs created multiple cores - multiple\
    \ copies of a CPU design on the same chip.\n\nThis impacted software design. Suddenly,\
    \ we needed parallel processing rather than sequential. The kinds of state that\
    \ lived inside one object of OOP was not accessible to other CPU cores. OOP became\
    \ less useful as a model of communicating state across CPU cores. Functional Programming\
    \ - “stateless” programming - is useful here.\n\nHowever, none of that was what\
    \ gave OOP a bad name. What gave it a bad name was OOP *done wrong*.\n\nSo, what\
    \ are the common mistakes?\n\n## Broken Encapsulation - Getters Galore!\n\nAt\
    \ Number 1 in my chart of badness, a very common error:\n\n```\n 1 class User\
    \ {\n 2     private String name ;\n 3 \n 4     // This is painful to type ...\n\
    \ 5     public String getName() {\n 6         return name ;\n 7     }\n 8 \n 9\
    \     // ... so is this\n10     public void setName( String name ) {\n11     \
    \    this.name = name;\n12     }\n13 }\n14 \n15 class UserGreeter {\n16 \n17 \
    \    // I swear fairies and kittens are dying right now\n18     public void greet(\
    \ User u ) {\n19         System.out.prinltn( u.getName() );\n20     }\n21 }\n\
    ```\n\nWe’ve all seen this - getters and setters everywhere!\n\nIt makes me sad.\
    \ It really does.\n\nNow, to be fair, Java has to take a lot of blame for this.\
    \ Right from version 1.0, Java had this idea of “Java Beans” which were things\
    \ like User above.\n\nYou had fields, but every field had a getter and setter.\
    \ Somehow, that became A Thing (TM), and it was used everywhere. Then *taught*\
    \ everywhere. Then somebody decided this was an “object” - because it is in a\
    \ class and has private data and public methods.\n\nThis caught on with developers\
    \ who had understood procedural programming but hadn’t yet learned OO. They hadn’t\
    \ learned about objects exposing behaviour and hiding secrets.\n\nWhen you think\
    \ in that way, every problem looks like getters-and-setters. Object secrets are\
    \ made un-secret. Code that should be a method on the User object now appears\
    \ in some redundant “class” UserGreeter. It’s not really a class, because it doesn’t\
    \ really have any real secret. It has stolen a secret from User.\n\nIt’s just\
    \ procedural programming, plain and simple.\n\nProcedural designs simply do not\
    \ gain the benefits of OOP. But they do have the words ‘class’ and ‘private’ in\
    \ them. To the uninformed, they look like an OO design. But they are not.\n\n\
    When people criticise OOP for not delivering on its promises - but base it on\
    \ code like this - it is obvious where the fault lies: This one is on them.\n\n\
    If you don’t even realise your code is not OOP, then don’t criticise OOP for your\
    \ code!\n\n## Broken Inheritance\n\nThe darling of the early 1990s, inheritance\
    \ was going to be magic! You whacked a few classes together with inheritance and\
    \ Boom! Your code was done.\n\nBut it wasn’t done. Instead, it was just a mess.\n\
    \nThere were several failings with inheritance. They are the ones that appear\
    \ in “OOP is dead” blog posts these days."
