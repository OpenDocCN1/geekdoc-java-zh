    I’m an idealist at heart. I genuinely enjoy building ‘elegant solutions’. Just
    the right pattern. Finessed names. Good splits of where things go.


    I don’t aim that high in practice, though. Not quite, anyway.


    Two factors frustrate perfection: deadlines and limited foresight.


    Real-world code has to ship. It has to be out being used for it to have any value.
    And that means compromises. My advice is to pick your battles wisely. Start out
    with clean code and good approaches. Maintain them. But allow yourself to introduce
    `Technical Debt`. This is the deliberate use of a ‘worse’ technique - cutting
    a corner - to get code shipped now. You should always note `Technical Debt` and
    schedule it for removal in your work tracking system.


    My view is that it’s ok to do when you understand the trade-off you are making.
    What’s not ok is to write awful code all the time and lie about it, saying that
    it is ‘Tech Debt’.


    Bad code is just that: Bad. As we’ve seen in the book, it’s not like clean code
    takes any longer to write, when you know how. `Tech Debt` is all about leverage.
    It’s like when you take out a mortgage so you can live in a house before you can
    afford the full price. `Tech Debt` like this is good.


    Bad code is like borrowing fifteen grand from the bank to blow it all on a party.
    It’s fun for the night, but pretty grim afterwards. You’re paying it all back
    with nothing to show for it.


    If deadlines force compromises on us, then our limited foresight also frustrates
    us.


    Many times, my code gets cleaned up in a later change. I wrote it as good as I
    could at the time. But since then, I have *learned* more about the subject area
    I am modelling. I know more about what the code needs to express in its domain
    model. I couldn’t have written any better earlier than this.


    I’ll always clean code up as I learn more - when it is safe to do so. By that,
    I mean ‘when it doesn’t impact anybody else’. A case in point is when you learn
    more about code that is already in use by others. Any change affects those users.
    You should not simply push changes out without letting them know and having a
    plan.


    I also like to ‘Boy Scout’ code, as it’s called. Leave code a little cleaner than
    when you got hold of it. Small, incremental improvements in clarity build up over
    time. When you’re working on a feature, it’s usually good to clean up code around
    it. It makes adding your feature easier and improves that code for the future.


    # Getting Past Stuck


    Programming is a creative craft. We have our tools and raw materials. But we must
    find our own ways to apply them.


    That requires creativity.


    I used to think creativity was exclusive to poets, playwrights and fiction writers.
    I see that’s not fully true. Anytime we have to come up with an idea of our own,
    one that we don’t just copy from elsewhere - that is creativity.


    And at times, it doesn’t happen.


    We can get burned out, depressed, stressed, sick or any of a myriad of other things
    that will just shut our creativity down. At the less dramatic end of things, we
    can just get stuck. We stare at that blank screen on the `IDE` thinking ‘How on
    earth am I going to do this?’


    As some final advice in this book, here’s what I do in these situations.


    First, accept it. Don’t panic or feel guilty or stupid. We’re just stuck. In a
    short time, we won’t be. That’s just how this works.


    Create some space. Do something else. I’ll often focus my brain on something I
    can do. Perhaps another piece of work. Perhaps I’ll write something that I know
    about. Or stare out of the window. Or read or watch a YouTube.


    Space gives your subconscious mind a chance to work in the background. Don’t ask
    me how, but many times, that’s all it takes. Literally sleeping on a problem works
    wonders.


    Other ideas that work are to ask for help. Explain the problem to somebody else
    and what you are thinking about. Many times, this activity itself gives you the
    answer. This even has a name - ‘rubber ducking’. You might as well have talked
    to a rubber duck. Hence the one on the front cover - feel free to use it! It is
    the process of organising your thoughts out loud that brings the answer.


    Experimentation is another good approach. Try a little spike. I often do this
    inside a unit test harness, just so it is easy to run. That often shows you ‘how
    a solution might feel’.


    Always be ready to simplify an idea for now if it is just too hard. Get the simple
    one working first, then add extra features later. That stops ‘analysis paralysis’,
    where you can’t start because the job is too big.


    # Further Reading


    For further reading, here are my favourite software design books


    ## Agile Software Development, Robert C Martin


    This book covers it all. A nice intro to `TDD`. Detailed explanations of `SOLID`
    and other design ideas.


    For me, the best part of this book is its large case studies. The book describes
    in detail how a number of realistic systems are designed, including a weather
    station with a `GUI`. The book takes you through the twists and turns of design
    and refactoring as you go, arriving at a good solution after the journey of discovering
    problems.


    ISBN 978-1292025940


    https://www.amazon.co.uk/gp/product/B00IZ0G6YG


    ## Growing Object Oriented Software Guided By Tests, Freeman and Pryce


    My favourite book on `TDD`. Often referred to as the ‘London School’ or the ‘London
    School’. (Wait, the text is: "Often referred to as the ‘London School’ or the
    ‘London School’" - I''ll just format the text.)


    *(Self-correction: I will just format the text as it appears in the prompt''s
    [content] tags.)*


