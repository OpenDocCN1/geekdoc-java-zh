  trans: "\n*   **PoEAA** 企业级应用架构模式 ISBN 978-0321127426\n*   **Own** 我从工作中获得或自己设计的模式\
    \ ISBN 978-1527284449\n\n## 模式：不是库，也不是框架\n\n`patterns`（模式）的这个概念非常重要。它们不是复制粘贴的代码片段。它们也无法被封装进库中。\n\
    \n下面的代码示例并不是为了逐行复制。其目的是让你理解这些代码是如何工作的，然后将这些原则应用于你自己的情况。每个模式都使用多态来实现其效果——请留意它们在哪里被使用的。这将是你开启其工作原理的关键。\n\
    \n## 策略 (Strategy)\n\n`[GoF]` 为你提供可插的 `behaviour`（行为）\n\n当你有一个需要改变行为的对象时，就会使用策略。根据配置或响应外部事件，它需要以不同的方式进行某些处理。你可以使用\
    \ `switch` 语句等条件判断来实现这一点。但你想遵守 `OCP` 并保持该对象不变。\n\n注入一个 `Strategy` 对象可以实现这一点。\n\
    \n例如，员工在达到不同目标时可以有不同的奖金方案。\n\n这是我们的策略模式接口。它允许我们做出各种实现：\n\n```\n1 interface BonusScheme\
    \ {\n2     void applyTo(Money pay);\n3 }\n```\n\n现在我们可以将其注入到我们的 `Employee` 对象中：\n\
    \n```\n 1 class Employee {\n 2   private BonusScheme bonus ;\n 3 \n 4   public\
    \ Employee(BonusScheme bonus) {\n 5       this.bonus = bonus;\n 6   }\n 7 \n 8\
    \   Money totalPay() {\n 9       Money pay = calculateBasePay();\n10 \n11    \
    \   // Use the strategy\n12       bonus.applyTo(pay);\n13 \n14       return pay;\n\
    15   }\n16 \n17   private Money calculateBasePay() {\n18       // ... code\n19\
    \   }\n20 }\n```\n\n这个 `Employee` 对象现在对其奖金方案的行为是开放的，但对修改是关闭的。我们不需要为了更改奖金方案而更改其内部。\n\
    \n让我们用两个简单的方案来演示这一点——`NoBonus` 和 `BonusTwenty`\n\n```\n 1 class NoBonus implements\
    \ BonusScheme {\n 2     void apply(Money pay) {\n 3         // No Action\n 4 \
    \    }\n 5 }\n 6 \n 7 class BonusTwenty {\n 8     void apply(Money pay) {\n 9\
    \         pay.add(new Money(\"20.00\"));\n10     }\n11 }\n```\n\n当我们创建员工对象时，注入我们想要使用的任何奖金方案具体对象。\n\
    \n真实的支付系统更加复杂，奖金方案中会有逻辑。它可能会与其他对象（例如 `Targets`）协作以查看我们是否符合条件。`BonusScheme` 对象甚至可能拥有自己的策略模式对象。\n\
    \n策略出现在任何你想要改变 `behaviour` 的地方。就像变量处理可变数据一样，策略模式处理可变行为。简单如此。\n\n策略可以是一种低级机制技术。在更高层次上，它可以表达在现实世界中具有变化行为的领域想法。经典的例子是现实世界中具有变化变化的\
    \ `Employee` 对象。\n\n## 观察者 (Observer)\n\n`[GoF]` 触发行为\n\n观察者是一种将“需要的内容”与其行为分离的技术。根据配置或响应外部事件，它需要以不同的方式进行某些处理。你可以使用\
    \ `switch` 语句等条件判断来实现这一点。但你想遵守 `OCP` 并保持该对象不变。\n\n"
- fmt: "\nWe have written code that `adapts` what our domain model wants into what\
    \ our existing libraries can provide. We have respected SRP and OCP whilst doing\
    \ this.\n\nAdapters are really powerful. They are fundamental to Hexagonal Architecture\
    \ - there is a whole layer of them, after all. Adapters see much wider use.\n\n\
    Any time we have an object that needs something from another, but their methods\
    \ don’t quite line up, we can use an `Adapter`.\n\nThe GoF book lists a related\
    \ pattern called `Bridge`. It has an interesting section on the similarities and\
    \ differences to `Adapter`. I never really saw them as being different. They both\
    \ make one thing work with another thing that wasn’t designed to work with it.\
    \ I tend to take a simple view of things.\n\nExamples: Hexagonal Adapter layer,\
    \ Converting data formats, converting presentation formats, linking different\
    \ versions of published APIs.\n\n## Command\n\n[GoF] Gives us a self-contained\
    \ action\n\nA lot of time we’re responding to events in programs. Things happen;\
    \ a user submits a form. A timer counts down to zero. A loyalty card is scanned.\
    \ Each one of these events would need some action from our system.\n\nA `command`\
    \ object contains the code for that action. It presents a uniform interface to\
    \ calling code, so that all actions can be called in the same way. This allows\
    \ us to build libraries and frameworks, where our calling code can pass `Command`\
    \ objects into the framework to be run at the right time.\n\n```\n1 interface\
    \ Command {\n2     void execute();\n3 }\n```\n\nThe basis of a `Command` object\
    \ is an interface with the single method `execute`. We tell the concrete class\
    \ to `execute` whatever action code it contains.\n\nAs `Commands` are good at\
    \ handling events, a reasonable example is to see what our GUI `Button` class\
    \ would look like with one:\n\n```\n 1 class Button {\n 2     private final Command\
    \ action ;\n 3 \n 4     public Button( Command action ) {\n 5         this.action\
    \ = action;\n 6     }\n 7 \n 8     public void onClick() {\n 9         action.execute();\n\
    10     }\n11 }\n```\n\nVariations include:\n\n- Passing the `Button` into the\
    \ `execute` method to identify the cause\n- Maintaining a list of actions, each\
    \ triggered in order\n- Adding an `undo()` method to the `Command` interface to\
    \ reverse the action\n\n## Composite\n\n[GoF] Makes many things look like one\
    \ thing\n\n`Composite` is a kind of adapter class. It adapts a collection of multiple\
    \ things into the same interface as just one thing. This makes it a nice pattern\
    \ you can use in addition to others.\n\nGoing back to our `Shape.draw()` example,\
    \ the `Composite` pattern gives us one very useful extra `Shape`: `ShapeGroup`:\n\
    \n```\n 1 class ShapeGroup implements Shape {\n 2     private final List<Shape>\
    \ shapes = new ArrayList<>();\n 3 \n 4     public void add(Shape s) {\n 5    \
    \     shapes.add(s);\n 6     }\n 7 \n 8     public void draw() {\n 9         shapes.forEach(\
    \ Shape::draw );\n10     }\n11 }\n```\n\nThis class can be used anywhere where\
    \ a `Shape` interface is expected. It is fully swappable for a single `Shape`.\
    \ It allows any number of `Shape` objects to be added using `add()` then will\
    \ draw all of them, when its `draw()` method is called.\n\n`Composite` objects\
    \ like this have uses everywhere. The classic use is when some existing code you\
    \ cannot change expects a single object - like a single `Shape` above - but you\
    \ need it to work with multiple objects.\n\nSimply wrap up a collection of objects\
    \ into a `Composite` and we’re good to go.\n\n## Facade\n\n[GoF] Simplifies how\
    \ we call a complex group of objects\n\nThe term `Facade` comes from buildings\
    \ architecture. It describes how a ‘fake front’ is built out of different materials\
    \ than the rest of the building to improve its appearance.\n\nWe use a `Facade`\
    \ in OOP when we want a simple interface to our calling code, but the objects\
    \ needed are harder to work with.\n\nA web service might be made up of a large\
    \ number of complex objects. A Tax calculation engine might have many objects\
    \ representing tax bands, allowances, exemptions, thresholds and so on.\n\nHaving\
    \ our application code create each one of these objects, wire them all together\
    \ and configure them would be quite hard. It would expose a lot of needless detail.\n\
    \nBy writing a simple `Facade` that does all this for us, we can simplify the\
    \ calling code:\n\n```\n1 class TaxEngine {\n2     public TaxEngine( Configuration\
    \ c ) {\n3         // ... Code to create objects, configure, wire up\n4     }\n\
    5 \n6     public Money calculateTaxLiability(DateRange taxPeriod) {\n7       \
    \  // ... code\n8     }\n9 }\n```\n\nThis `TaxEngine` `Facade` hides all the detail\
    \ of wiring and configuring the many objects required. It presents a simple interface\
    \ to the caller.\n\n## Builder\n\n[GoF] Makes complex objects easier to construct\n\
    \nWhen objects get data-heavy as part of the secrets they hide, they grow large\
    \ constructors. When parts of that data are optional, then the calling code often\
    \ ends up supplying null and empty parameters. Messy.\n\nOne way to improve this\
    \ is to make multiple different constructors. Each one only lists non-empty parameters,\
    \ then uses `this()` to call other constructors. We push the defaults into the\
    \ constructor in this approach.\n\nThis works, but the number of constructors\
    \ needed gets out of hand quite quickly. Without an IDE to help, it’s hard to\
    \ know which parameter is which. What does `new User (\"alan\", 3, 198736543,\
    \ \"red\")` mean, anyway?\n\n`Builder` is a pattern to help with this. It provides\
    \ a number of named methods which describe the purpose of each piece of data.\
    \ It contains the default and empty values to be used. And it only requires a\
    \ single, ‘full’ constructor for the object being built.\n\nWe might have three\
    \ optional fields in our `User` class:\n\n```\n1 class User {\n2     private final\
    \ String userId ;\n3     private final Date dateOfBirth ;\n4     private final\
    \ User linkedAccount ;\n5 \n6     public User( String userId, Date dateOfBirth,\
    \ User linkedAccount) {\n7         this.userId = userId;\n8         this.dateOfBirth\
    \ = dateOfBirth;\n9         this.linkedAccount = linkedAccount;\n10    }\n11 }\n\
    ```\n\nWe could create a `User` with default `dateOfBirth` and `linkedAccount`\
    \ by the calling code:\n\n```\n1 User u = new User(\"alan027\", new Date(), User.NOBODY\
    \ );\n```\n\nWhere `User.NOBODY` is a public static constant null object.\n\n\
    This works reasonably well for three parameters, but it does obscure which are\
    \ genuine parameters and which are defaults. As parameter lists grow, the situation\
    \ gets worse.\n\nA `UserBuilder` would look like this:\n\n```\n1 class UserBuilder\
    \ {\n2     private String userId = \"\";\n3     private Date dateOfBirth = new\
    \ Date();\n4     private User linkedAccount = new NullUser() ;\n5 \n6     public\
    \ User build() {\n7         return new User( userId, dateOfBirth, linkedAccount\
    \ );\n8     }\n9 \n10     public void userId( String userId ) {\n11         this.userId\
    \ = userId ;\n12     }\n13 \n14     public void dateOfBirth( Date dateOfBirth\
    \ ) {\n15         this.dateOfBirth = dateOfBirth;\n16     }\n17 \n18     public\
    \ void linkedAccount( User linkedAccount ) {\n19         this.linkedAccount =\
    \ linkedAccount ;\n20     }\n21 }\n```\n\nYou can see that the default values\
    \ are built into the `Builder`. We can change them with the ‘setter’ methods provided.\
    \ Once we have set all we need, we create a `User` object using `build()`.\n\n\
    I prefer to put the `build` method at the top, just as a matter of style. I think\
    \ it is the ‘most important’ method and the one that helps you understand the\
    \ class.\n\nA Java library exists to automate writing builders like this, which\
    \ is useful:\n\nProject Lombok at https://projectlombok.org/features/Builder\n\
    \n## Repository\n\n[DDD] Represents stored objects, without saying how they are\
    \ stored\n\nAnother foundational pattern. We have some data in some kind of storage\
    \ that we want to work with. But we don’t want our application to know anything\
    \ about that storage technology. We do want to get that data back out and use\
    \ it to create objects.\n"
  raw: "We have written code that *adapts* what our domain model wants into what our\
    \ existing libraries can provide. We have respected SRP and OCP whilst doing this.\n\
    \nAdapters are really powerful. They are fundamental to Hexagonal Architecture\
    \ - there is a whole layer of them, after all. Adapters see much wider use.\n\n\
    Any time we have an object that needs something from another, but their methods\
    \ don’t quite line up, we can use an Adapter.\n\nThe GoF book lists a related\
    \ pattern called *Bridge*. It has an interesting section on the similarities and\
    \ differences to Adapter. I never really saw them as being different. They both\
    \ make one thing work with another thing that wasn’t designed to work with it.\
    \ I tend to take a simple view of things.\n\nExamples: Hexagonal Adapter layer,\
    \ Converting data formats, converting presentation formats, linking different\
    \ versions of published APIs.\n\n## Command\n\n[GoF] Gives us a self-contained\
    \ action\n\nA lot of time we’re responding to events in programs. Things happen;\
    \ a user submits a form. A timer counts down to zero. A loyalty card is scanned.\
    \ Each one of these events would need some action from our system.\n\nA command\
    \ object contains the code for that action. It presents a uniform interface to\
    \ calling code, so that all actions can be called in the same way. This allows\
    \ us to build libraries and frameworks, where our calling code can pass Command\
    \ objects into the framework to be run at the right time.\n\n```\n1 interface\
    \ Command {\n2     void execute();\n3 }\n```\n\nThe basis of a Command object\
    \ is an interface with the single method execute. We tell the concrete class to\
    \ execute whatever action code it contains.\n\nAs Commands are good at handling\
    \ events, a reasonable example is to see what our GUI Button class would look\
    \ like with one:\n\n```\n 1 class Button {\n 2     private final Command action\
    \ ;\n 3 \n 4     public Button( Command action ) {\n 5         this.action = action;\n\
    \ 6     }\n 7 \n 8     public void onClick() {\n 9         action.execute();\n\
    10     }\n11 }\n```\n\nVariations include:\n\n*   Passing the Button into the\
    \ execute method to identify the cause\n\n*   Maintaining a list of actions, each\
    \ triggered in order\n\n*   Adding an ‘undo()’ method to the Command interface\
    \ to reverse the action\n\n## Composite\n\n[GoF] Makes many things look like one\
    \ thing\n\nComposite is a kind of adapter class. It adapts a collection of multiple\
    \ things into the same interface as just one thing. This makes it a nice pattern\
    \ you can use in addition to others.\n\nGoing back to our Shape.draw() example,\
    \ the Composite pattern gives us one very useful extra Shape: ShapeGroup:\n\n\
    ```\n 1 class ShapeGroup implements Shape {\n 2     private final List<Shape>\
    \ shapes = new ArrayList<>();\n 3 \n 4     public void add(Shape s) {\n 5    \
    \     shapes.add(s);\n 6     }\n 7 \n 8     public void draw() {\n 9         shapes.forEach(\
    \ Shape::draw );\n10     }\n11 }\n```\n\nThis class can be used anywhere that\
    \ a Shape interface is expected. It is fully swappable for a single Shape. It\
    \ allows any number of Shape objects to be added using add() then will draw all\
    \ of them, when its draw() method is called.\n\nComposite objects like this have\
    \ uses everywhere. The classic use is when some existing code you cannot change\
    \ expects a single object - like a single Shape above - but you need it to work\
    \ with multiple objects.\n\nSimply wrap up a collection of objects into a Composite\
    \ and we’re good to go.\n\n## Facade\n\n[GoF] Simplifies how we call a complex\
    \ group of objects\n\nThe term Facade comes from buildings architecture. It describes\
    \ how a ‘fake front’ is built out of different materials than the rest of the\
    \ building to improve its appearance.\n\nWe use a Facade in OOP when we want a\
    \ simple interface to our calling code, but the objects needed are harder to work\
    \ with.\n\nA web service might be made up of a large number of complex objects.\
    \ A Tax calculation engine might have many objects representing tax bands, allowances,\
    \ exemptions, thresholds and so on.\n\nHaving our application code create each\
    \ one of these objects, wire them all together and configure them would be quite\
    \ hard. It would expose a lot of needless detail.\n\nBy writing a simple Facade\
    \ that does all this for us, we can simplify the calling code:\n\n```\n1 class\
    \ TaxEngine {\n2     public TaxEngine( Configuration c ) {\n3         // ... Code\
    \ to create objects, configure, wire up\n4     }\n5 \n6     public Money calculateTaxLiability(DateRange\
    \ taxPeriod) {\n7         // ... code\n8     }\n9 }\n```\n\nThis TaxEngine facade\
    \ hides all the detail of wiring and configuring the many objects required. It\
    \ presents a simple interface to the caller.\n\n## Builder\n\n[GoF] Makes complex\
    \ objects easier to construct\n\nWhen objects get data-heavy as part of the secrets\
    \ they hide, they grow large constructors. When parts of that data are optional,\
    \ then the calling code often ends up supplying null and empty parameters. Messy.\n\
    \nOne way to improve this is to make multiple different constructors. Each one\
    \ only lists non-empty parameters, then uses this() to call other constructors.\
    \ We push the defaults into the constructor in this approach.\n\nThis works, but\
    \ the number of constructors needed gets out of hand quite quickly. Without an\
    \ IDE to help, it’s hard to know which parameter is which. What does `new User\
    \ (\"alan\", 3, 198736543, \"red\")` mean, anyway?\n\nBuilder is a pattern to\
    \ help with this. It provides a number of named methods which describe the purpose\
    \ of each piece of data supplied. It contains the default and empty values to\
    \ be used. And it only requires a single, ‘full’ constructor for the object being\
    \ built.\n\nWe might have three optional fields in our User class :\n\n```\n 1\
    \ class User {\n 2     private final String userId ;\n 3     private final Date\
    \ dateOfBirth ;\n 4     private final User linkedAccount ;\n 5 \n 6     public\
    \ User( String userId, Date dateOfBirth, User linkedAccount) {\n 7         this.userId\
    \ = userId;\n 8         this.dateOfBirth = dateOfBirth;\n 9         this.linkedAccount\
    \ = linkedAccount;\n10     }\n11 }\n```\n\nWe could create a User with default\
    \ dateOfBirth and linkedAccount by the calling code:\n\n```\n1 User u = new User(\
    \ \"alan0127\", new Date(), User.NOBODY );\n```\n\nWhere User.NOBODY is a public\
    \ static constant null object signifying ‘no user’.\n\nThis works reasonably well\
    \ for three parameters, but it does obscure which ones are the genuine parameters\
    \ and which are defaults. As parameter lists grow, the situation gets worse.\n\
    \nA UserBuilder would look like this:\n\n```\n 1 class UserBuilder {\n 2     private\
    \ String userId = \"\";\n 3     private Date dateOfBirth = new Date();\n 4   \
    \  private User linkedAccount = new NullUser() ;\n 5 \n 6     public User build()\
    \ {\n 7         return new User( userId, dateOfBirth, linkedAccount );\n 8   \
    \  }\n 9 \n10     public void userId( String userId ) {\n11         this.userId\
    \ = userId ;\n12     }\n13 \n14     public void dateOfBirth( Date dateOfBirth\
    \ ) {\n15         this.dateOfBirth = dateOfBirth;\n16     }\n17 \n18     public\
    \ void linkedAccount( User linkedAccount ) {\n19         this.linkedAccount =\
    \ linkedAccount ;\n20     }\n21 }\n```\n\nYou can see that the default values\
    \ are built into the Builder. We can change them with the ‘setter’ methods provided.\
    \ Once we have set all we need, we create a User object using build().\n\nI prefer\
    \ to put the build method at the top, just as a matter of style. I think it is\
    \ the ‘most important’ method and the one that helps you understand the class.\n\
    \nA Java library exists to automate writing builders like this, which is useful:\n\
    \nProject Lombok at https://projectlombok.org/features/Builder\n\n## Repository\n\
    \n[DDD] Represents stored objects, without saying how they are stored\n\nAnother\
    \ foundational pattern. We have some data in some kind of storage that we want\
    \ to work with. But we don’t want our application to know anything about that\
    \ storage technology. We do want to get that data back out and use it to create\
    \ objects."
