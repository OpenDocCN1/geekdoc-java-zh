  raw: "*   **PoEAA** Patterns of Enterprise Application Architecture ISBN 978-0321127426\n\
    \n*   **Own** Patterns I have picked up from work or devised ISBN 978-1527284449\n\
    \n## Patterns: Not libraries, not frameworks\n\nThis idea of *patterns* is important.\
    \ These are not cut-and-paste code snippets. Nor can they be baked into a library.\n\
    \nThe code examples below are not intended to be copied line for line. The idea\
    \ is to understand how that code works, then apply the principles to your own\
    \ situation. Each pattern uses polymorphism to achieve its effect - so look out\
    \ for where that is used. That will give you the key to unlocking how it works.\n\
    \n## Strategy\n\n[GoF] Gives you pluggable *behaviour*\n\nStrategy is used when\
    \ you have an object that needs a way to change its behaviour. Depending on configuration,\
    \ or in response to external events, it needs to do some processing differently.\
    \ You could do this with conditionals like switch statements. But you want to\
    \ respect OCP and keep that object unmodified.\n\nInjecting a Strategy object\
    \ enables this.\n\nAs an example, employees can have different bonus schemes as\
    \ they hit different targets.\n\nHere is our Strategy pattern interface. It will\
    \ allow us to make various implementations:\n\n```\n1 interface BonusScheme {\n\
    2     void applyTo(Money pay);\n3 }\n```\n\nWe can now inject that in our Employee\
    \ objects:\n\n```\n 1 class Employee {\n 2   private BonusScheme bonus ;\n 3 \n\
    \ 4   public Employee(BonusScheme bonus) {\n 5       this.bonus = bonus;\n 6 \
    \  }\n 7 \n 8   Money totalPay() {\n 9       Money pay = calculateBasePay();\n\
    10 \n11       // Use the strategy\n12       bonus.applyTo(pay);\n13 \n14     \
    \  return pay;\n15   }\n16 \n17   private Money calculateBasePay() {\n18     \
    \  // ... code\n19   }\n20 }\n```\n\nThis Employee object is now open for behaviour\
    \ changes in its bonus scheme. But it is closed to modification. We don’t need\
    \ to change the insides just to change a bonus scheme.\n\nLet’s demonstrate that\
    \ with two simple schemes - NoBonus and BonusTwenty\n\n```\n 1 class NoBonus implements\
    \ BonusScheme {\n 2     void apply(Money pay) {\n 3         // No Action\n 4 \
    \    }\n 5 }\n 6 \n 7 class BonusTwenty {\n 8     void apply(Money pay) {\n 9\
    \         pay.add(new Money(\"20.00\"));\n10     }\n11 }\n```\n\nWhen we create\
    \ employee objects, we inject whichever bonus scheme concrete object we want to\
    \ use.\n\nReal payment systems are more complex and would have logic in the bonus\
    \ scheme. That would collaborate with other objects, like Targets perhaps, to\
    \ see if we qualify. The BonusScheme objects might even get Strategy pattern objects\
    \ of their own.\n\nStrategy crops up everywhere you want to vary *behaviour*.\
    \ In the same way a variable handles variable data, the Strategy pattern handles\
    \ variable behaviour. It’s as simple as that.\n\nStrategy can be a low-level mechanism\
    \ technique. At a higher level, it can express domain ideas that have changing\
    \ behaviour in the real world. The classic being Employee objects that start out\
    \ as juniors but then get promoted to managers. Strategy makes for a direct model\
    \ of that.\n\nExamples: Tax Calculation, Payment schedule, Data source selection,\
    \ Graphics filters, Plugins of all kinds, Extension points, Customisations, Skins,\
    \ Complex rules.\n\n## Observer\n\n[GoF] Triggers behaviour somewhere else\n\n\
    Observer is a decoupling technique that splits apart a ‘thing that happened’ from\
    \ its response.\n\nThe classic use of Observer is in GUI toolkits. You have a\
    \ Button object that can be clicked on. The Button class should be completely\
    \ reusable, but you need some way for it to trigger your application code. We\
    \ clearly can’t put our application logic inside the reusable Button code. It\
    \ wouldn’t be reusable then.\n\nWe need a solution. We need to tell the Button\
    \ code which part of of our application code we want to run. We can do that with\
    \ the Observer pattern.\n\nWe make the Button ‘observable’, which means that we\
    \ can attach a list of observers. These ‘observers’ will contain our application\
    \ code.\n\nWhen we click the Button, this will execute a method on all the observers\
    \ that we register. We will call the interface ‘Actionable’, because that’s what\
    \ it provides:\n\n```\n 1 interface Actionable {\n 2     void doAction();\n 3\
    \ }\n 4 \n 5 class Button {\n 6     private final List<Actionable> observers =\
    \ new ArrayList<>();\n 7 \n 8     void register(Actionable a) {\n 9         observers.add(a);\n\
    10     }\n11 \n12     void onClick() {\n13         observers.forEach(Actionable::doAction);\n\
    14     }\n15 }\n```\n\nThat class is part of our GUI toolkit. It has methods not\
    \ shown here. Typically these will allow a Button to draw itself, and to receive\
    \ a click notification from the operating system.\n\nWhen a click happens, method\
    \ onClick() in Button is called. That calls the doAction method of each registered\
    \ Actionable observer.\n\nOur application code can then make classes that implement\
    \ Actionable. These classes are fully decoupled from the Button class itself.\
    \ The Button lives in the GUI toolkit and has zero knowledge of your application\
    \ code. Your application code only needs to know about Actionable and that it\
    \ can receive a call to the doAction() method. What your code needs to do in response\
    \ to the click lives there.\n\nObservers are so good at decoupling ‘what happens’\
    \ from ‘what caused it’ that they crop up everywhere. GUI toolkits, web frameworks,\
    \ message queue systems, process pipelines.\n\nThe Observer pattern is a low level\
    \ mechanism pattern in general. Obviously, that can ‘scale up’ to a domain concept\
    \ if it fits. A PayrollRun object can easily have observers of BankTransfer and\
    \ PayslipPrinter.\n\nSystems like this often end up as event driven architectures.\n\
    \nExamples: GUI frameworks, Event driven systems, Interrupt handlers, Communication\
    \ channels - TCP handlers, JMS messaging.\n\n## Adapter\n\n[Gof] Adapt an interface\
    \ for use by something else\n\nWe’ve seen this pattern in Hexagonal Architecture,\
    \ where it is a perfect fit.\n\nAdapter solves the problem where we have calling\
    \ code expecting one kind of interface, and a supplier that has another. We need\
    \ to bridge that gap somehow. The way to do it without changing existing code\
    \ is to write new code that knows how to talk to both.\n\nWe say this new code\
    \ adapts one interface to another.\n\nThe example we used earlier was an interface\
    \ to find a user:\n\n```\n1 interface UserRepository {\n2   User findUserById(\
    \ String userId );\n3 }\n```\n\nwhich is the interface the calling code expects.\n\
    \nWe can take any source of user information - a database, a web service, a test\
    \ stub - and *adapt* it into satisfying that interface.\n\nSuppose we had a small\
    \ in-house SQL database library. It has class Database that has a query method\
    \ that returns a Rows object given an SqlQuery object:\n\n```\n1 class Database\
    \ {\n2     Rows executeQuery( SqlQuery query ) {\n3         /// ... code\n4  \
    \   }\n5 }\n```\n\nWe might create an adapter class for our UserRepository like\
    \ this:\n\n```\n 1 class UserRepositoryDatabase implements UserRepository {\n\
    \ 2     private final Database db ;\n 3 \n 4     public UserRepositoryDatabase(\
    \ Database db ) {\n 5         this.db = db;\n 6     }\n 7 \n 8     User findUserById(\
    \ String userId ) {\n 9         SqlQuery userQuery = \n10           new SqlQuery(\"\
    SELECT * FROM Users WHERE id=\" + userId);\n11 \n12         Rows r = db.executeQuery(userQuery);\n\
    13         User u = new User( userId, r.getColumn(\"dateOfBirth\") );\n14 \n15\
    \         return u ;\n16     }\n17 }\n```\n\nPlease forgive the SQL Injection\
    \ vulnerability and the fact it will most likely crash if there is not exactly\
    \ one user of that userId (ahem).\n\nThe gist is that we search our database -\
    \ using SQL - for the relevant row in our Users table. We pull columns out of\
    \ that row and use them to create a User domain object. We return that object.\n\
    \nWe have not altered any of the calling code in our domain that depends on UserRepository\
    \ to know anything about the SQL database library. We have not altered any of\
    \ our in-house SQL database library to know anything about the domain and its\
    \ User class."
