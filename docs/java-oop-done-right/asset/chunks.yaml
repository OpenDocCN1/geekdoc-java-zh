  trans: "\n我们之前使用一个简单的字符串来表示用户名。这个字符串像上面那样被传递到方法中。我们在到处都使用了它。这是你在早期为了能尽快开始工作而做出的设计决策之一。使用\
    \ `String` 可能不是长期的最佳决策，但在当时，任何其他方案似乎都过度设计了。\n\n这种方法效果良好。但最终我们遇到了两个问题。\n\n一个问题是，我们需要修改代码，以便任何给定的用户都位于特定的服务器上。设计后来发生了变化，我们需要同时传递\
    \ `username` 和主服务器信息。这修改起来非常困难，因为我们到处都是 `Strings`。正如你预期的那样，搜索和替换会出来成千上万个 `Strings`。而且它们的命名并不总是统一为“username”。\n\
    \n另一个问题是，基于 `String` 的用户名让你不得不猜测 `String` 应该是什么格式。你*究竟*传递的是什么？‘almellor’？‘al@webconf.com’？还是‘1172397f’？这是不可能知的。\n\
    \n答案是对每个方法执行 `Refactor > Change Method Signature`（重构 > 修改方法签名）。它不再接受 `String`，而是接受一个\
    \ `User` 对象：\n\n```\nclass Chat {\n    public void sendMessage( User recipient\
    \ ) {\n        // code ...\n    }\n}\n```\n\n这使得代码清晰，防止了一整类错误，并让我们能够自由地将主服务器信息添加到\
    \ `User` 对象中。\n\n正如你所看到的，整个“抽象级别”再次提升了。我们现在可以清楚地看到 `Chat` 可以向 `User` 发送消息 (`sendMessage`)。它用简单的英语直接写在代码中。我们看到“做什么”比“怎么做”更显著。我们看到的是‘User’而不是‘String’。\n\
    \n# 提取参数对象 (Extract Parameter Object)\n\n我喜欢这一个。这种重构产生了一些非常出色的设计见解。当你看到一个方法的参数列表看起来太长时，就可以使用它。\n\
    \n回到以《太空侵略者》（Space Invaders）举例。\n\n```\nclass InvadersGame {\n  public void draw(\
    \ int x, int y, Image currentFrame, \n                    int deltaX, int deltaY)\
    \ {\n    // code\n  }\n}\n```\n\n这里我们有一个带有若干参数的 `draw()` 方法。这本身并没有什么问题。但它让我感到不安。感觉似乎有更好的代码正等待出现。\n\
    \n这些参数看起来有可疑的关联。一对 `(x, y)` 坐标。一个 `(deltaX, deltaY)` 运动向量。一个带有当前动画帧的 `Image`。\n\
    \n嗯。\n\n它们听起来像是……嗯，听起来像是侵略者（Invader）的内部。让我们使用 `Refactor > Extract Parameter Object`（重构\
    \ > 提取参数对象）将它们提取出来作为一个 `Invader` 对象：\n\n```\nclass InvadersGame {\n    void draw(\
    \ Invader i ) {\n        // code\n    }\n}\n\nclass Invader {\n    private int\
    \ x;\n    private int y;\n    private Image currentFrame ;\n    private int deltaX;\n\
    \    private int deltaY;\n\n    public int getX() {...}\n    public int getY()\
    \ {...}\n    public Image getCurrentFrame() {...}\n    public int getDeltaX()\
    \ {...}\n    public int getDeltaY() {...}\n}\n```\n\n我省略了 `Invader` 对象这些 getter\
    \ 方法、字段和构造函数内部的代码。在这里结构很重要，而不是细节。\n\n我们了原始 `draw()` 方法中的所有参数，并将它们放入一个新类中——被称为“参数对象”。现有的\
    \ `draw()` 方法将把对原始参数的使用替换为 `i.getX()`、`i.getY()` 等。\n\n`Invader` 还不算一个具有行为的 OOP\
    \ 对象。它是一个纯数据结构。\n\n有趣的地方在这里。如果我们将代码从原始 `draw()` 方法移动到 `Invader` 类的 `draw()` 方法中，我们就可以去掉所有那些\
    \ getter 方法：\n\n```\nclass InvadersGame {\n    void draw( Invader i ) {\n    \
    \    i.draw();\n    }\n}\n\nclass Invader {\n    private int x;\n    private int\
    \ y;\n    private Image currentFrame ;\n    private int deltaX;\n    private int\
    \ deltaY;\n\n    public void draw() {\n        // code 可以使用 x, y 等。它是一个对象！\n \
    \   }\n}\n```\n\n你可以看到，这更少是过程化的，更像我们一直在学习的 OOP。\n\n你是否也能看到它开始看起来是“反向”的了——而且更具描述性？\n\
    \n我们旧的代码会从某处传入一堆原始值调用 `draw()`。\n\n这段重构后的代码创建了一个 `Invader` 对象，它知道如何绘制自己和移动。这使得\
    \ `InvadersGame.draw()` 方法变得更短，更明显是关于 `Invader` 的——而且不再冗余。\n\n`Extract Parameter\
    \ Object` 是一种如此强大的重构，它让过程化的设计发生彻底反转，变为面向对象的设计。你可以预期变化会产生连锁，将越来越多的对象参与进来。到最后，你的代码将具有对象协同协作的简单性，带有隐藏的“秘密”和有意义的名字。\n\
    \n# 我们可以将任何东西重构为任何东西吗？\n\n我听过关于这个问题的精彩演讲，来自当地曼彻斯特 XP Surgery 的传奇人物 Kevin Rutherford。\n\
    \n他的观点是“并不真正”。我同意。重构是强大的，但它有局限性。\n\n重构受到两件事的阻：测试的缺乏（或过度）以及隐藏的耦合。第一个听起来很惊讶，但它是事实。你的测试需要“恰到好处”，就像金发姑娘的小粥一样。\n\
    \n第二个很棘手。你可能会发现在重构时破坏了某些测试，但却不知道为什么。当你调试时，你会发现两处代码区域需要同步更改。例如，可能有一个字符串常量。你在一个类中重构了它，但忘记在另一个类中重构它。\n"
- fmt: "\nIntegration tests take several pieces of code, join them up and test them\
    \ as a whole. Generally, some of these pieces will be external systems. So you\
    \ might test some business logic against a running database.\n\nEnd-to-end tests\
    \ expand on that idea. You wire up the entire system and test it just as a user\
    \ would. You drive the user interfaces and run against actual databases and real\
    \ web services. The whole thing is as ‘live-like’ as possible.\n\nContract tests\
    \ are interesting. These split a test into two directions. They are used to break\
    \ apart testing against external service.\n\nWith these, you test twice. First,\
    \ you test that your application logic can call a stub for the service correctly.\
    \ That’s what ‘testing the contract’ means - the contract between your application\
    \ and whatever it talks to.\n\nSecond, you test the contract between the code\
    \ that talks to the external service and make sure that it, in fact, does talk\
    \ correctly.\n\nThere are browser tests, which are a form of end-to-end testing,\
    \ that use a special kind of web browser. You can script mouse movements, taps\
    \ and keystrokes as if you were a real user. It enables capture of the HTML and\
    \ data sent to the browser for checking.\n\nEach level of testing gets more problematic.\
    \ An integration test is slower than a unit test, as it has to set up and control\
    \ the external system. End-to-end tests are slower still. They are somewhat harder\
    \ to write.\n\nThe worst problem is about test `repeatability`. We want tests\
    \ to either always pass when the code is right or fail when it’s not.\n\nSadly,\
    \ higher-level tests tend to be ‘flaky’. The code may be right, but something\
    \ in the external system might still cause the test to fail. It is often simple\
    \ things, like having the wrong data in a database, or a slow response.\n\nFlaky\
    \ tests can also be caused by intermittent problems. Things like network failures\
    \ and database connection limits are all problems here.\n\nBy way of example,\
    \ one particularly tricky one to diagnose was an integration test against a search\
    \ web service. The service was behind a load balancer.\n\nIn the test environment,\
    \ the load balancer was set to round-robin mode. We had two test instances of\
    \ the service. The load balancer would route requests to service 1, then the next\
    \ request to service 2. At least `it did` - until one service was switched off\
    \ without anybody telling us. Oops.\n\nAll the integration tests passed then failed,\
    \ passed then failed like clockwork.\n\nIt was purely down to the 50/50 routing\
    \ of requests from the tests to one good service and one down service.\n\nYou\
    \ can also imagine that there might be test duplication amongst these different\
    \ levels of tests.\n\nA small unit test that confirms that some kind of user option\
    \ is available might be duplicated by a check box’s browser test.\n\nAs with all\
    \ duplication, this is a problem. It makes things harder to change and harder\
    \ to understand.\n\nHaving live-like test environments to support higher-level\
    \ tests has its problems. Hosting costs go up, as we need dedicated test machines.\
    \ We may have data protection and privacy issues if our test data relates to a\
    \ real person. And the slow running speed hampers development.\n\nThe Test Pyramid\
    \ is a simple visual aid. It reminds us to use mostly fast unit tests. Back those\
    \ up with slower, flakier integration tests where we must. But not as many. Then\
    \ fewer still browser and end-to-end tests.\n\nBy minimising the amount of slow,\
    \ potentially intermittently failing tests in our system, we maximise our ability\
    \ to test. We increase velocity and ship sooner.\n\nSo if the slower tests are\
    \ less than ideal, the obvious solution is to avoid the problem and use more FIRST\
    \ unit tests.\n\nIf only it weren’t for those pesky external systems …\n\n## Removing\
    \ external systems\n\nOf course, we can’t just throw out the database and the\
    \ keyboard. Our program wouldn’t work.\n\nBut we can eliminate those details from\
    \ the bulk of our code. We already know how to do this. We can use the Dependency\
    \ Inversion Principle.\n\nLet’s look at removing a database dependency from our\
    \ `NotFaceBook` app.\n\nOur `NotFaceBook` system needs to lookup a User profile,\
    \ based on a logged in user ID. We can display a profile page based on whatever\
    \ the user stored.\n\nAt first sight, this needs database code. It must do. The\
    \ user stores their profile data in the database: name, profile selfie, and favourite\
    \ cat photo. Our code must fish it out from there.\n\nThat’s the `how` of how\
    \ we do this: the implementation details.\n\nBut `what` are we actually doing,\
    \ at a high level?\n\nWe are finding a `User` object by its user id. We can assume\
    \ that `User` object knows how to supply profile information as its secret knowledge.\n\
    \nWe can code that up:\n\n```\n1 interface UserRepository {\n2     User findUserById(\
    \ String userId );\n3 }\n```\n\n`UserRepository` is an interface that allows our\
    \ code to access the `User` and its profile information, without knowing anything\
    \ about databases.\n\nWe can write different implementations. We can just as easily\
    \ code an implementation that talks to a file as one that talks to a Postgres\
    \ database. Or MongoDB. We can even code a test stub, returning fixed, known data.\n\
    \nWe’re using the word `Repository` here as the most general way of describing\
    \ “Anything that stores, generates, and obtains `User` objects, somehow”. We’re\
    \ using it to suggest that the precise storage details are irrelevant.\n\nMaybe\
    \ it is not even stored. For example, in some games, the `userID` value could\
    \ be used to `generate` that profile information on the fly - not store it. That\
    \ is still a ‘repository’.\n\nWe can use it in calling code like this:\n\n```\n\
    \ 1 class NotFaceBook {\n 2     private final UserRepository users ;\n 3     private\
    \ final Display display ;\n 4 \n 5     public NotFaceBook( UserRepository users,\
    \ Display display ) {\n 6         this.users = users ;\n 7         this.display\
    \ = display;\n 8     }\n 9 \n10     public void showProfile() {\n 11         String\
    \ userId = \"almellor_19019\";\n 12 \n 13         User u = users.findUserById(\
    \ userId );\n 14 \n 15         u.displayProfile(display);\n 16     }\n17 }\n```\n\
    \nWe constructor dependency injection to pass in one of our concrete implementations.\n\
    \nYou can see that `UserRepository` is an `abstraction`. It is the essence of\
    \ what finding a User in a database means. `UserId` in, `User` object out.\n\n\
    This is a classic dependency inversion.\n\nOur application code - the `NotFaceBook`\
    \ class - no longer depends on details of the database. It depends only on the\
    \ abstraction.\n\nThis makes unit testing simple. We can simply create `StubUserRepository`\
    \ class that always returns a representative `User` object. The stub never goes\
    \ anywhere near a database.\n\nThis gives us all the benefits of a FIRST Unit\
    \ test. It avoids problems of database testing.\n\nDatabase testing for real is\
    \ slow and rather error-prone. You tend to get several issues:\n\n*   Your test\
    \ code accidentally connects to the real database. Oh dear. Catastrophic when\
    \ you test `deleteAllUsers()`\n\n*   The test database does not have a User for\
    \ the `UserId` you supply. The test will fail as a false negative. The code was\
    \ right, but the data was wrong.\n\n*   Testing addition of data fails the second\
    \ time. The first time, ‘User1’ does not exist and gets inserted. The second time,\
    \ the database rejects the insert: ‘User1 already exists. Primary key conflict:\
    \ UserId’\n\nBy using a simple in-memory stub, all of those problems go away.\
    \ Instead, we get:\n\n*   Most of the system under fast unit test\n\n*   A clear\
    \ domain model - the ‘what’ of the system\n\n*   An ‘inside out’, experimental\
    \ approach is possible\n\n*   Simplified changes of things like databases and\
    \ web server technology\n\n## The Hexagonal Model\n\nYou can see that our code\
    \ now consists of two main parts. The application logic, which is free of external\
    \ systems. Then the external systems, which are free of application logic.\n\n\
    We give those parts names:\n\n*   Domain Layer - application logic, no external\
    \ systems\n\n*   Adapter Layer - external systems, no application logic\n"
