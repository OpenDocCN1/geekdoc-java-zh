  trans: "\n\n我认为，理解这一切最简单的方法就是下一节中的“用户（User）”示例。但在那之前，让我们先介绍一些术语和 Java 语法。\n\n###\
    \ 类、方法、构造函数、对象、引用\n\n**对象 (Object)**：对象是方法和数据的小集合，用于表示一个单一、特定的事物：一个人、一列火车、一个单词、一个产品。\n\
    \n**类 (Class)**：在 Java 中，所有对象都属于一个 `class`。类允许创建一个或多个对象。它是每个对象公共特征的蓝图或模板。\n\n\
    **方法 (Method)**：方法用于描述对象为提供的行为。它很像是一个特定于 `class` 的函数。\n\n**New**：关键字 `new` 接收一个类名，然后创建一个特定的对象。它返回该对象的引用，我们可以存储该引用。这让我们可以在稍后的代码中使用该对象。\n\
    \n**构造函数 (Constructor)**：一个由 `new` 调用的特殊方法。它负责在对象创建时对其进行设置。我们可以在这里提供事物的初始值。\n\n\
    **字段 (Fields)**：这些是每个对象特有的变量。为了帮助我们的行为方法工作，我们可以在对象的字段中存储数据。\n\n**对象引用 (Object\
    \ reference)**：关键字 `new` 会创建一个对象，用构造函数对其设置，然后返回一个“引用”。我们可以将此引用存储在局部变量或对象字段中。然后我们可以使用引用和点操作符在该对象上调用方法。\n\
    \n**this**：在方法内部，关键字 `this` 是一个对象引用，指向“当前对象”。这和我和你说话时说“我（me）”的概念一样。我指的是我自己。\n\n\
    **private (私有的)**：一个关键字，用于标记字段或方法为仅在 `Class` 内部可用。在外部，它是不可见的。它用于标记“秘密”。\n\n**public\
    \ (公共的)**：一个关键字，用于标记方法可以在调用代码的 `Class` 外部可用。也可以用在字段，但这种情况很少见。\n\n### 简单示例：问候用户\n\
    \n为了展示我们的意思，让我们创建一个简单的对象：`User`。\n\n大多数系统都有用户。希望我们会有大量的用户——如果我们的营销策略做得得当的话。我们的工作是为他们每一个人显示一个个性化的问候。\n\
    \n第一个设计决策是将每个用户表示为一个对象。为了做到这一点，我们需要为所有用户对象的共同点编写一个“蓝图”。一个 Java `User` 类：\n\n```\n\
    \ 1 public class User {\n 2   private String name ;  // 3\\. 私有数据\n 3 \n4   public\
    \ User( String name ){. // 2\\. 构造函数\n 5     this.name = name ;\n 6   }\n 7 \n\
    \ 8   public void greet() { // 1\\. greet 方法\n 9     System.out.println( \"Hello,\
    \ \" + name );\n10   } \n11 }\n```\n\n在对其操作之前，我们需要创建一个简单的测试应用程序。我们将使用标准的 Java\
    \ 模板代码创建一个带有 `static main()` 的 `Application` 类——这是一个“魔法方法”，告诉操作系统从哪里开始我们的 Java\
    \ 程序。\n\n```\n1 public class GreetingsApplication {\n2   public static void main(\
    \ String[] commandLineArgs ) {\n3     User u1 = new User( \"Jake\" );\n4     User\
    \ u2 = new User( \"Katy\" );\n5 \n6     u1.greet();\n7     u2.greet();\n8   }\n\
    9 }\n```\n\n运行这个程序会向我们显示“Hello, Jake”和“Hello, Katy”。它是通过创建两个独立的用户对象，并要求它们问候它们所代表的用户来实现。\n\
    \n这段代码看起来可能平平无奇，但它包含了面向对象编程（OOP）最重要的基础。让我们来看看关键部分。\n\n### 方法 - 让对象动起来\n\n每个对象最重要的部分是你可以要求它做的事：即公共方法。\n\
    \n`User` 类有一个名为 `greet()` 的单一方法（见 1）。\n\n方法名告诉我们该方法执行了*什么*，而不是*如何*做的。当我们编写调用代码时，这个名称描述了该方法将为我们做什么。它还让我们免于非要关心它是如何实现的。\n\
    \n这很重要，因为让我们让我们更改方法 `greet()` 的内部实现。当我们这样做时，调用代码将不会有任何变化。\n\n我们的测试程序创建了两个用户对象，并对每个对象调用了\
    \ `greet()` 方法。注意测试程序读起来有多接近纯英语。OOP 的核心在于设计自定义对象，它们能为我们的应用程序恰恰执行正确的事情。我们可以按照用英语讨论我们正在解决的问题的方式来命名方法。\n\
    \n当我们设计对象时，我们从行为方法开始。稍后我们会添加数据和逻辑，如果这些对于让方法完成工作是必要的的话。\n\n### 秘密 - 我们对象的专业知识\n\
    \n就像示例中的人知道某些事情并拥有工具来帮助他们工作一样，对象也有自己的秘密。\n\n对象通常有两个秘密：\n\n* 数据 - 每个对象特有的\n* 算法\
    \ - 执行工作的逻辑\n\n我们的 `greet` 方法包含了这两种秘密。\n\n`greet()` 的逻辑很简单。我们使用 Java 的 `System.out.println()`\
    \ 方法向控制台写入文本。\n\n这就是*如何*——我们如何问候用户。因为它隐藏在 `greet` 方法的签名之后，我们可以自由更改这样做而不影响调用代码。这很重要。这防止了更改在系统中扩散。让代码更容易理解。\n\
    \n### 构造函数 - 让对象准备就绪\n\n由于我们为每个用户创建一个对象，我们希望确保对象在创建后就是就绪的。这避免了其他方法中常见的“未初始化数据”问题。\n\
    \n我们有一个特殊方法可以做到这一点：构造函数。\n\n构造函数的核心思想是它创建一个对象，加载数据并使其准备就绪。\n\n对于我们的 `User` 对象，私有的\
    \ `name` 字段（见 3）是在构造函数内部设置的。我们将每个具体的名称作为参数传递给构造函数。\n\n构造函数有助于保持我们数据的秘密。它们为调用代码提供了一种方法，可以在不知道任何秘密的情况下设置对象。\n\
    \n### 核心思想：调用代码非常简单\n\n现在我们理解了 `User` 类内部是如何编码的，让我们来看看 OOP 的巨大优势：公共接口。即调用代码看到的部分。\n\
    \n它非常简单。\n\n```\n1 User u = new User(\"Alan\");\n2 u.greet();\n```\n\n编写一个知道如何问候用户的程序，我们只需要并调用这两个公共部分。我们调用构造函数创建对象并使其准备就绪。然后调用\
    \ `greet()`。这真的没有比这更简单的了。\n\n"
- fmt: "\nNow, imagine how this helps us as we grow bigger programs. We might have\
    \ hundreds or thousands of classes. Maybe tens of millions of lines of code. But\
    \ with OOP, we only need to understand what our object’s public interface can\
    \ do. It insulates us from the details.\n\nThis is the key of OOP done right:\
    \ `the calling code is simple`\n\nAnd if it isn’t … we’re doing it wrong.\n\n\
    ## Object Oriented Design is Behaviour Driven Design\n\nThe key to doing OOP right\
    \ is to let behaviours drive the design.\n\nThe first question is always ‘what\
    \ does this object need to do?’. We represent that as a method, using the name\
    \ to describe the behaviour.\n\nThen, we can add supporting code inside that method\
    \ to make it work. We might add calls to private methods to break the work into\
    \ small chunks. We might need stored data as fields in the object. We would need\
    \ a constructor in that case.\n\n## Clean Code\n\nWhilst small, the code in our\
    \ previous example was also ‘clean’. Clean Code simply means code that is easy\
    \ to read, easy to work with and safe. Safe here means ‘no gotchas’ about using\
    \ the code.\n\nThis means happier days, faster development, fewer bugs. If ever\
    \ there was a secret sauce to development, then clean code is it.\n\nThere are\
    \ several techniques used here that we should always use in code.\n\n### Good\
    \ Names\n\nNames are absolutely critical in software. Let me give you an example.\
    \ What does the class below do:\n\n```\n 1 class Z2 {\n 2     private String aa;\n\
    \ 3 \n 4     Z2(String aaa) {\n 5         aa = aaa;\n 6     }\n 7 \n 8     void\
    \ q() {\n 9         System.out.println(\"Hello, \" + aa)\n10     }\n11 }\n```\n\
    \nThat’s right - it is our `User` class, with terrible names.\n\nHard to understand,\
    \ wasn’t it?\n\nDid you find yourself reading the code, “playing computers in\
    \ your head” and reverse-engineering the meaning out of it? Did you have thoughts\
    \ like “Ok, this is a `Z2` class. It has a string called `aa` which gets set,\
    \ and we can call the `q` method, which … hang on … says “Hello” … is this like\
    \ a greeting or something?”\n\nThe only text here that gave us a clue was “Hello”.\
    \ In our better named `User` class, we had the words `user`, `greet`, `name` and\
    \ `hello` which helped us understand what that class was about. We didn’t need\
    \ to understand every detail of the code.\n\nChoosing `intention revealing names`\
    \ massively speeds up your team’s ability to read your code. Not a little bit.\
    \ Massively. And it helps you - when you come back in six months to code you’ve\
    \ long forgotten about.\n\n### Method names: Tell me the outcome\n\nEffective\
    \ method names explain why I should call them - what will have happened after\
    \ that method completes. They should not explain what is inside the method. Only\
    \ what that method can do for callers.\n\nGOOD: `Users.findNewUsersSince( Date\
    \ date )`\n\nBAD: `Users.runDatabaseQueryToSortUsersByJoiningDateThenMap( Date\
    \ date )`\n\nThe method name `should be the comment` for a block of code. The\
    \ code itself explains how the method works. The method name serves as a comment\
    \ explaining what the method does if I call it.\n\nOh yes; don’t use comments\
    \ for this. Turn comments into method names.\n\n### Variable names: Tell me the\
    \ contents\n\nEffective variable names tell me what their contents are, not what\
    \ they are made of.\n\nGOOD: `String surname` // if I need a surname, I can use\
    \ this\n\nBAD: `String theString` // yes, yes, I can see that! Why is it here?\n\
    \nFollow these two rules `methods say what they do, variables say what they hold`\
    \ and straight away, most of your code will be easier to understand.\n\n## Design\
    \ methods around behaviours, not data\n\nA lot of texts suggest that the important\
    \ thing about OOP is the data that a class has. This confuses a lot of people\
    \ and leads to some brittle designs. The critical thing is ‘what behaviours should\
    \ the class have?’. Answer that before deciding what data those behaviours might\
    \ need.\n\nIn the past, I have viewed an object as being a stucture of data with\
    \ some functions wrapped around that. I have learned that designing behaviours\
    \ first, without any knowledge of how they will work internally, leads to more\
    \ stable OO designs. I recommend you do the same.\n\nDesigning around behaviours\
    \ is key to doing OOP right.\n\n## Hidden data - No getters, no setters\n\nSpeaking\
    \ of data, our `greet()` method will need some. It needs the name of the user\
    \ to do its job. So we provide a private `name` field for that purpose.\n\nBut\
    \ `only` `greet()` needs to know that. Nothing else does.\n\nThere is no access\
    \ to the name from outside the class.\n\nNo `getName()`. No `setName()`.\n\nThe\
    \ `User` class simply has no need for that. We set the name in the constructor.\
    \ We use the name as part of how `greet()` works, but it has no more importance.\
    \ It exists for that one reason only.\n\nThis is what truly encapsulated fields\
    \ look like.\n\nLater on, you might find that a getter `is appropriate`. Just\
    \ start with behaviours, start with fully encapsulated data and go from there.\n\
    \nThat way, you won’t risk other programmers from writing code in other classes\
    \ that lock us into private data.\n\n## Aggregates: More than one\n\nOur last\
    \ example followed in the footsteps of all great software by having just one `User`.\
    \ Even Facebook started from there.\n\nBut what happens when we have more than\
    \ one thing? After all, it is pretty much what computers were invented for.\n\n\
    Java provides many ways of doing this. Most of them result in hard to read, verbose\
    \ code. So, over time, I’ve gravitated to just one key. It is from Domain Driven\
    \ Design: Aggregate.\n\n## Greeting more than user\n\nContinuing our example,\
    \ let’s add more users:\n\n```\n 1 public class Users {\n 2   private final List<User>\
    \ users = new ArrayList<>();\n 3 \n 4   public void add(User u) {\n 5     users.add(u);\n\
    \ 6   }\n 7 \n 8   public void greet() {\n 9     users.forEach( User::greet );\n\
    10   }\n11 }\n```\n\nThis is an `Aggregate` class. It is called that because it\
    \ aggregates more than one `User` into a single `Users` object.\n\nThe nice thing\
    \ about it is that it follows the same principles as before:\n\n*   Behaviours\
    \ first: add a User, greet all users\n*   Hidden data - no getters, no setters\n\
    *   Intent revealing names `add()` and `greet()`. No comments required\n\nInternally,\
    \ it uses some features found in Java 8 and above, which you will be using by\
    \ now.\n\n### Type safe collections, not raw arrays\n\nThe private field uses\
    \ the well-known Collection class framework. The field itself is of `List<User>`.\
    \ I chose that to reveal my intention that I’m not bothered which exact kind of\
    \ list is used, so long as it can access them in the same order that `add()` was\
    \ called. That is reflected in the `add(User u)` method.\n\nType safety is important\
    \ in large programs. Without it, you can accidentally add something that is not\
    \ a `User` object and does not support the `greet()` method.\n\nWhat would be\
    \ the point of that? The code would crash when you ran it.\n\nJava has strong\
    \ static typing to reveal this kind of error `before` you run the program. It\
    \ is a powerful way of preventing bugs from ever entering the code.\n\nDesigning\
    \ out possible mistakes is a fundamental principle I use throughout all stages\
    \ of development. If you make something so it cannot go wrong, everything is much\
    \ easier to understand. You can literally read what it can and cannot do, rather\
    \ than being forced to guess.\n\nThere is another way that this approach is used\
    \ here.\n\nJava also provides raw arrays to store ‘more than one thing’. They\
    \ look a bit like this:\n\n```\n1 // Raw arrays in Java. Just say no\n2 User[]\
    \ users = new User[10];\n```\n\nI’ve always thought that this is just too low-level\
    \ for me. I used to program in C and assembler language, where this is your only\
    \ choice. It is `so` much better to have the collection classes available.\n"
  raw: "Now, imagine how this helps us as we grow bigger programs. We might have hundreds\
    \ or thousands of classes. Maybe tens of millions of lines of code. But with OOP,\
    \ we only need to understand what our object’s public interface can do. It insulates\
    \ us from the details.\n\nThis is the key of OOP done right: *the calling code\
    \ is simple*\n\nAnd if it isn’t … we’re doing it wrong.\n\n## Object Oriented\
    \ Design is Behaviour Driven Design\n\nThe key to doing OOP right is to let behaviours\
    \ drive the design.\n\nThe first question is always ‘what does this object need\
    \ to do?’. We represent that as a method, using the name to describe the behaviour.\n\
    \nThen, we can add supporting code inside that method to make it work. We might\
    \ add calls to private methods to break the work into small chunks. We might need\
    \ stored data as fields in the object. We would need a constructor in that case.\n\
    \n# Clean Code\n\nWhilst small, the code in our previous example was also ‘clean’.\
    \ Clean Code simply means code that is easy to read, easy to work with and safe.\
    \ Safe here means ‘no gotchas’ about using the code.\n\nThis means happier days,\
    \ faster development, fewer bugs. If ever there was a secret sauce to development,\
    \ then clean code is it.\n\nThere are several techniques used here that we should\
    \ always use in code.\n\n## Good Names\n\nNames are absolutely critical in software.\
    \ Let me give you an example. What does the class below do:\n\n```\n 1 class Z2\
    \ {\n 2     private String aa;\n 3 \n 4     Z2(String aaa) {\n 5         aa =\
    \ aaa;\n 6     }\n 7 \n 8     void q() {\n 9         System.out.println(\"Hello,\
    \ \" + aa)\n10     }\n11 }\n```\n\nThat’s right - it is our User class, with terrible\
    \ names.\n\nHard to understand, wasn’t it?\n\nDid you find yourself reading the\
    \ code, “playing computers in your head” and reverse-engineering the meaning out\
    \ of it? Did you have thoughts like “Ok, this is a Z2 class. It has a string called\
    \ aa which gets set, and we can call the q method, which … hang on … says “Hello”\
    \ … is this like a greeting or something?”\n\nThe only text here that gave us\
    \ a clue was “Hello”. In our better named User class, we had the words user, greet,\
    \ name and hello which helped us understand what that class was about. We didn’t\
    \ need to understand every detail of the code.\n\nChoosing *intention revealing\
    \ names* massively speeds up your team’s ability to read your code. Not a little\
    \ bit. Massively. And it helps you - when you come back in six months to code\
    \ you’ve long forgotten about.\n\n### Method names: Tell me the outcome\n\nEffective\
    \ method names explain why I should call them - what will have happened after\
    \ that method completes. They should not explain what is inside the method. Only\
    \ what that method can do for callers.\n\nGOOD: Users findNewUsersSince( Date\
    \ date )\n\nBAD: Users runDatabaseQueryToSortUsersByJoiningDateThenMap( Date date\
    \ )\n\nThe method name *should be the comment* for a block of code. The code itself\
    \ explains how the method works. The method name serves as a comment explaining\
    \ what the method does if I call it.\n\nOh yes; don’t use comments for this. Turn\
    \ comments into method names.\n\n### Variable names: Tell me the contents\n\n\
    Effective variable names tell me what their contents are, not what they are made\
    \ of.\n\nGOOD: String surname // if I need a surname, I can use this\n\nBAD: String\
    \ theString // yes, yes, I can see that! Why is it here?\n\nFollow these two rules\
    \ **methods say what they do, variables say what they hold** and straight away,\
    \ most of your code will be easier to understand.\n\n## Design methods around\
    \ behaviours, not data\n\nA lot of texts suggest that the important thing about\
    \ OOP is the data that a class has. This confuses a lot of people and leads to\
    \ some brittle designs. The critical thing is ‘what behaviours should the class\
    \ have?’. Answer that before deciding what data those behaviours might need.\n\
    \nIn the past, I have viewed an object as being a stucture of data with some functions\
    \ wrapped around that. I have learned that designing behaviours first, without\
    \ any knowledge of how they will work internally, leads to more stable OO designs.\
    \ I recommend you do the same.\n\nDesigning around behaviours is key to doing\
    \ OOP right.\n\n## Hidden data - No getters, no setters\n\nSpeaking of data, our\
    \ greet() method will need some. It needs the name of the user to do its job.\
    \ So we provide a private ‘name’ field for that purpose.\n\nBut *only* greet()\
    \ needs to know that. Nothing else does.\n\nThere is no access to the name from\
    \ outside the class.\n\nNo getName(). No setName().\n\nThe User class simply has\
    \ no need for that. We set the name in the constructor. We use the name as part\
    \ of how greet() works, but it has no more importance. It exists for that one\
    \ reason only.\n\nThis is what truly encapsulated fields look like.\n\nLater on,\
    \ you might find that a getter *is* appropriate. Just start with behaviours, start\
    \ with fully encapsulated data and go from there.\n\nThat way, you won’t risk\
    \ other programmers from writing code in other classes that lock us into private\
    \ data.\n\n# Aggregates: More than one\n\nOur last example followed in the footsteps\
    \ of all great software by having just one User. Even Facebook started from there.\n\
    \nBut what happens when we have more than one thing? After all, it is pretty much\
    \ what computers were invented for.\n\nJava provides many ways of doing this.\
    \ Most of them result in hard to read, verbose code. So, over time, I’ve gravitated\
    \ to just one key idea. It is from Domain Driven Design: Aggregate objects.\n\n\
    ## Greeting more than one user\n\nContinuing our example, let’s add more users\
    \ and greet them:\n\n```\n 1 public class Users {\n 2   private final List<User>\
    \ users = new ArrayList<>();\n 3 \n 4   public void add( User u ) {\n 5     users.add(u);\n\
    \ 6   }\n 7 \n 8   public void greet() {\n 9     users.forEach( User::greet );\n\
    10   }\n11 }\n```\n\nThis is an **Aggregate** class. It is called that because\
    \ it aggregates more than one User object into a single Users object.\n\nThe nice\
    \ thing about it is that it follows the same principles as before:\n\n*   Behaviours\
    \ first: add a User, greet all users\n\n*   Hidden data - no getters, no setters\n\
    \n*   Intent revealing names add() and greet(). No comments required\n\nInternally,\
    \ it uses some features found in Java 8 and above, which you will be using by\
    \ now.\n\n### Type safe collections, not raw arrays\n\nThe private field uses\
    \ the well-known Java Collection class framework. The field itself is of type\
    \ List<>. I chose that to reveal my intention that I’m not bothered which exact\
    \ kind of list is used to store the users, so long as it can access them in the\
    \ same order that add() was called.\n\nThe next design decision is to use the\
    \ generic form List<User>. This clearly states that you must store only User objects\
    \ (or subclasses of User) in that List. That is reflected in the add(User u) method.\n\
    \nType safety is important in large programs. Without it, you can accidentally\
    \ add in something that is not a User object and that does not support the greet()\
    \ method.\n\nWhat would be the point of that? The code would crash when you ran\
    \ it.\n\nJava has strong static typing to reveal this kind of error *before* you\
    \ run the program. It is a powerful way of preventing bugs from ever entering\
    \ the code.\n\nDesigning-out possible mistakes is a fundamental principle I use\
    \ throughout all stages of development. If you make something so it cannot go\
    \ wrong, everything is much easier to understand. You can literally read out what\
    \ it can and cannot do, rather than be forced to guess.\n\nThere is another way\
    \ that this approach is used here.\n\nJava also provides raw arrays to store ‘more\
    \ than one thing’. They look a bit like this:\n\n```\n1 // Raw arrays in Java.\
    \ Just say no\n2 User[] users = new User[10];\n```\n\nI’ve always thought that\
    \ this is just too low-level for me. I used to program in C and assembler language,\
    \ where this is your only choice. It is *so* much better to have the collection\
    \ classes available."
