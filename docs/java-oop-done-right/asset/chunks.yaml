    \ high gear using objects as they were intended to be used. It might be your first\
    \ insight into how OOP fits together in the real world. Java has a reputation\
    \ for being verbose. I hope this book shows you how to fix that. I want you to\
    \ take away the techniques of crafting clean, powerful, readable OOP code.\n\n\
    This book is not an introduction to Java. It should be suitable for beginners\
    \ who can write Java “Hello World” and understand the basic syntax for variables,\
    \ conditionals and classes. Examples use Java 11 syntax. Many work in Java 1.\n\
    \nAlan Mellor\n\nRock Cottage\n\nFebruary 2021\n\n# Optimise for Clarity\n\nBefore\
    \ we start, here’s the big theme of this book:\n\nProgramming is all about explaining\
    \ to another human what the computer happens to be doing at any given moment.\
    \ As a by-product, it also tells the computer what to do.\n\nThe reason this is\
    \ so important is that what the computer *actually* runs is almost incomprehensible\
    \ to anyone.\n\nAs an example, if I write this:\n\n```\n1 clearScreen();\n```\n\
    \nyou can understand that I want the computer to clear everything off the screen,\
    \ leaving it blank.\n\nThe computer can’t though. It’s as dumb as rocks. Literally.\
    \ Silicon chips are made of Silicon Dioxide - Sand.\n\nWe need to pass this code\
    \ through some kind of translator to turn this into the language of the computer.\
    \ One that looks nothing like English.\n\nOne of my old computers would need something\
    \ like this:\n\n```\n1   LD HL, 4000H  00100001 00000000 01000000\n2   LD DE,\
    \ 4001H  00010001 00000001 01000000\n3   LD BC, 6143   00000001 11111111 00010111\
    \ \n4   LD (HL), 0    00110110 00000000\n5   LDIR          11101101 10110000\n\
    ```\n\nWhere the assembly language on the left was *still* a human-readable form.\
    \ The binary on the right was what that computer ran on its Z80A microprocessor.\n\
    \nI know which one I like better.\n\nThe art of programming is making programs\
    \ clear. Readable. Easy to skim read. No tricks.\n\nIt is the difference between\
    \ having to read all that binary and work out that it meant ‘clear the screen’,\
    \ compared to reading ‘clearScreen()’.\n\nIn a working professional team, nobody\
    \ has the time, money, or desire to do that. Ever.\n\nThis book is all about helping\
    \ you create code that both you and your colleagues can understand.\n\n# What\
    \ is an object, anyway?\n\nThe best way to think about objects is as people at\
    \ work. Each one has a specific job to do. They know how to do their job. They\
    \ have all the knowledge, tools and supplies they need to do it.\n\nThink about\
    \ how a handwritten letter gets sent through the post.\n\nWe have a writer. They\
    \ choose what words go in that letter, then write them down. This letter is then\
    \ handed to a postman. The postman drives the letter to a sorting office.\n\n\
    The sorting office has inside it a big map of postcodes. On that map, each postcode\
    \ has a little pin with the another postman’s name, who is responsible for delivering\
    \ the letters.\n\nThe sorting office hands over the letter to the correct postman,\
    \ who delivers it to a reader.\n\nSo far, so dull. Just an everyday story about\
    \ an outdated way of sending mail. But it contains the two key insights into Object\
    \ Oriented Programming.\n\nNotice how the writer *asks* the postman to deliver\
    \ the letter. The writer does not tell the postman *how* to deliver the letter.\
    \ That’s not the writer’s job. The writer writes. The postman delivers. They each\
    \ do their own job without interference from the other.\n\nThe writer also doesn’t\
    \ ask the postman anything at all about how the delivery will be done. The postman\
    \ is free to do that however they see fit. They can even change how they do the\
    \ delivery later. The writer will not be affected at all.\n\nThis is the essence\
    \ of OOP. Instead of people, we have objects. Each object knows how to do its\
    \ own job.\n\nYou’ll notice that this description is quite independent of programming\
    \ languages. OOP itself is a design approach that can be done in any language\
    \ - even assembler or C.\n\nLanguages like Java are called OOP languages because\
    \ they provide direct support for writing code that reads like this.\n\n## What’s\
    \ all this got to do with Java?\n\nAs an object oriented language, Java was designed\
    \ to reflect the real world, like in our example above. It allows us to write\
    \ code that speaks about Postman and Letter and deliver() and so on. It allows\
    \ us to write computer code that reads like an English description of our problem.\
    \ Not like code.\n\nWe can write short pieces of code that can hold secrets, and\
    \ present behaviours. Those short pieces of code can be asked to do things. The\
    \ code representing what a postman knows and does can be asked to deliver a letter.\n\
    \nThe way Java does this is in two parts.\n\nFirst, it provides a ‘traditional’\
    \ computer language. It has variables, conditionals, loops and all the other good\
    \ stuff we think of as code.\n\nThen it gives us a way to package up that code\
    \ to represent real world concepts.\n\nThese packages of code and data are called\
    \ ‘objects’. Each object has a certain type - like “this object represents a postman”,\
    \ or “this one is a user”. We call these Classes in Java. All objects belong to\
    \ a class, which tells you what they represent. You can have any number of objects\
    \ of the same class. You can have any number of classes.\n\nA Class represents\
    \ an idea. It can create multiple objects. Objects can store their own data. They\
    \ provide methods, which are small chunks of code that can be called by a program.\
    \ These methods represent the behaviours we talked about. Things like ‘deliver\
    \ a letter’, or ‘check spelling’ on a word.\n\nMethods can describe absolutely\
    \ any behaviour we can think of. This is the superpower of object oriented programming.\n\
    \nConfusing? Yes. It is at first. There’s a lot to learn."
