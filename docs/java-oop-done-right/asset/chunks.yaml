    \ a powerful refactoring that it turns procedural designs inside out to become\
    \ Object Oriented designs. You can expect the changes to ripple out, dragging\
    \ more and more objects into play.\n\nBy the end, your code will have that simplicity\
    \ of objects collaborating together, with hidden ‘secrets’ and meaningful names.\n\
    \n## Can we refactor anything into anything else?\n\nI heard a fascinating talk\
    \ on this, by local Manchester XP Surgery legend Kevin Rutherford.\n\nHis view\
    \ was ‘Not really’. I agree. Refactoring is powerful, but it has limitations.\n\
    \nRefactoring gets hindered by two things: lack (or excess) of tests and hidden\
    \ couplings.\n\nThe first one sounds surprising, but it’s true. Your tests need\
    \ to be ‘just right’, just like Goldilocks’ porridge.\n\nYour tests must support\
    \ the refactoring you want to do. You need sufficient test coverage at the same\
    \ level as your calling code. If you have that, you can safely refactor knowing\
    \ that any errors will be caught.\n\nOften, that’s not the case. There might be\
    \ too few tests here. Perhaps all the testing effort went closer-in to individual\
    \ classes you now want to refactor. In that case, you will probably invalidate\
    \ the test code as you change the production code.\n\nThese classes are the ‘how’\
    \ - implementation details - of the higher level class you want to refactor. Tests\
    \ will be coupled up to those. As you change implementation details, those tests\
    \ break. That means you no longer have proper coverage of features.\n\nHidden\
    \ couplings are tricky as well.\n\nYou might find that you break some tests as\
    \ you refactor, yet it’s not apparent why. As you debug, you find that two different\
    \ areas of code need to be changed in lockstep with each other. There might be\
    \ a string constant, for example. You refactor that in one class, but forget to\
    \ refactor it in the other, then find out that the code no longer works.\n\nThose\
    \ kinds of issues are challenging - and often painful - to sort out.\n\nRefactoring\
    \ is a commonplace, recommended and excellent tool. Just be aware that it cannot\
    \ overcome all design flaws, practically speaking. Spending a little time upfront\
    \ to sketch a small piece of OO design still pays off.\n\nThe Fowler book remains\
    \ the best resource there is on this subject.\n\n# Hexagonal Architecture\n\n\
    What happens if you turn polymorphism and Dependency Inversion up to 11?\n\nYou\
    \ get Hexagonal Architecture.\n\nFirst described by Alastair Cockburn in 1993,\
    \ then called ‘ports and adapters’, it has been written about ever since. Yet\
    \ very few people I’ve worked with seem to use it.\n\nThat’s a shame. It solves\
    \ a big problem for us: external systems.\n\n## The problems of external systems\n\
    \nExternal systems exist outside our application code, outside of its operating\
    \ system process and outside of its memory space.\n\nThere are many examples.\
    \ Database, files, REST controllers, web servers, I/O hardware, printers, GUIs,\
    \ displays, keyboards are common. You can probably think of more.\n\nThese things\
    \ are a right royal pain when it comes to testing our software.\n\nThink about\
    \ keyboard input from a user.\n\nWe can easily write Java code to accept keyboard\
    \ input.\n\nBut how do we test it?\n\nA traditional TDD unit test would need its\
    \ Arrange, Act, Assert steps.\n\nHow do you arrange for keys to be physically\
    \ pressed on a keyboard by a unit test?\n\nThe simple answer is that you can’t.\n\
    \n## The Test Pyramid\n\nThe standard answer to this is called the Test Pyramid.\n\
    \nUnit tests aren’t the only game in town. There are other kinds of tests."
