  trans: "\n在上面的代码段中，如果没有`no` 名称以 Al 开头的用户，会发生什么呢？\n\n该方法按照目前的写法是无法运行的。我们需要某种方式向该函数链信号“未找到数据”。\n\
    \nJava 8 借鉴了其他函数式语言的概念，为我们引入了 `optional value`（可选值）的概念。正如其字面意思一样，这是一个可能包含也可能不包含我们想要的数据。\n\
    \n在最简单的情况下，我们可以让 `findUserById(id)` 方法返回一个可选的 `User`：\n\n```\n1 Optional<User>\
    \ findUserById( String userId ) {\n2     // ... code\n3 }\n```\n\n在方法内部，我们可以使用构造\
    \ `return Optional.of( user );` 来返回一个有效的 `User` 对象，或者使用 `return Optional.empty();`\
    \ 来表示不存在有效的 `User`。\n\n调用方的代码是有趣的地方。我们可以选择使用简单的 if 语句来处理这些情况，或者通过提供一个“lambda 函数”来对我们的有效\
    \ `User` 进行操作。\n\nif 语句类似于空值检查：\n\n```\n1 Optional<User> result = findUserById(\
    \ \"alan0127\" );\n2 \n3 if (result.isPresent()) {\n4     result.get().showProfile();\n\
    5 }\n6 else {\n7     System.out.println( \"Sorry, we could not find that user\"\
    \ );\n8 }\n```\n\n从技术上讲，这并没有比空值检查改进。但我认为它的可读性好得多。它是`刻意`的。我们可以清晰地读出这段代码完全关于一个可选值，以及在值存在时处理该值的代码。\n\
    \n但 Java 8 提供了自己消除 if 语句的方法：\n\n```\n1 findUserById(\"alan0127\")\n2     .ifPresent(\
    \ user -> user.showProfile() )\n3     .orElse( System.out.println(\"Sorry, we\
    \ could not find that user\"));\n```\n\n这是对上面 if 语句的简单重构，但使用了 `Optional` 的 `ifPresent()`\
    \ 方法。它接受一个 `lambda function reference`（lambda 函数引用）作为参数——我们传入一些代码，在值存在时执行它。链式方法\
    \ `orElse()` 同样接收一个 lambda 函数引用，在值不存在时运行。\n\n这种风格具有可读性优势——一旦我们熟悉了方法引用的语法。它也具有避免空值检查的所有通常优点。\n\
    \n随着较新的（Java 8 及以后）库采用 `Optional<>`，这种风格正变得流行。\n\n## 总结：应该使用哪种方法？\n\n我们涵盖了报告错误的几种方法。它们都是可选的。你会在实际工作中看到所有的它们。\n\
    \n最基础的——空值检查——我们无法避免。它已经深植于 Java 库和 Java 程序员之中。空值检查是客观存在的。它们会一直存在。\n\n不过，我不推荐它们。空值（Nulls）会污染调用代码，并引入未捕获的\
    \ `NullPointerException` 的可能性。这足以让整个应用程序崩溃。\n\n对于新的 Java 8 及以后的代码，`Optional<T>`\
    \ 方法可以效果良好，特别是结合了 `@NotNull` 注解时，这些注解可以通过静态分析工具进行检查。\n\n遗憾的是，`Optional` 没有被制制成自己的原生类型。如果是那样，`Optional`\
    \ 的返回将保证永远不会为 null。由于它只是一个普通的对象，你可以返回 null 而不是 `Optional`，这违背了整个初衷。我理解为什么没有引入这种对\
    \ Java 的根本性改变。但我允许对这个错失的机会抱怨一下。\n\n错误对象需要大量的管道工作（plumbing）。但调用代码是纯粹的 OOP，非常干净。一旦你习惯了它们，它们有很多优势。它们在更高级的方式中很容易使用，除了\
    \ `valid()` 和 `invalid()` 方法外，还可以添加 `error( ErrorInfo reason )` 之类的方法。\n\n异常（Exceptions）是一种相当干净的方法。批评者说它们是“美化版的\
    \ goto”。这很有道理。他们指出，在他们看来，异常应该只用于真正无法恢复的事情，即没有人料到的错误。我希望我已经向你展示了 Bertrand Meyer\
    \ 的“契约设计”（Design by Contract）展示了另一种观点。\n\n僵尸对象（Zombie objects）出奇地有用。通过将最少的管道工作与增强的可读性相结合，它们形成了一个“廉价且愉快”的错误对象。\n\
    \n在做决定时，你需要仔细考虑权衡，基于你现有的代码、现有的开发者以及对各种方法的 `feelings`（感受）。\n\n你经常会发现，“感受”部分往往是决定性因素。\n\
    \n# 设计模式 (Design Patterns)\n\n将行为映射到不同的对象可能是一项辛苦的工作。就像为街道上的每栋房子都从头开始重新发明一样困难。\n\
    \n到 20 世纪 90 年代中期，面向对象的世界发现了相同的问题。许多对象具有相同的“形状”。就像街道上的房子一样。\n\n为了理解什么是模式，让我们反过来来看这个问题。假设你写了一个具有三个数据字段的对象：\n\
    \n*   一个名称\n*   一个时间戳\n*   一个金额\n\n这些是你类中的秘密。在不过度思考的情况下，你脑海中浮出的第一个代表它的东西是什么？不准作弊！3,\
    \ 2, 1 …… 开始！\n\n我得到的是：\n\n*   账单上的项目项目：“Rioja 125ml, 晚上 8:30, £2.95”\n*   租赁合同：“15A\
    \ Acacia Avenue 的 12 个月租金，2020 年 1 月 1 日，£2,150”\n*   会员证：“Alan 的极客俱乐部，1 年，2020\
    \ 年 1 月 1 日，£2,150”\n*   折扣码：“Xbox Live，有效期至 2020 年 10 月 20 日，$79.99”\n\n还有很多例子。许多不同类型的对象具有相似的“形状”。在\
    \ 20 世纪 90 年代中期，这一点已经被发现，但是从反方向发现的。`Customer` 对象的行为被认为与 `Member` 对象基本相同。这被称为`设计模式`（Design\
    \ Pattern）。\n\n对象在设计层面形成`模式`。模式为我们的设计提供了快速启动。我们可以从现成品开始并进行剪裁，而不是自己剪布料。并且搞乱了我们的比喻。我深表歉意。\n\
    \n20 世纪 90 年代热烈地投入了这一想法。它产生了许多书籍、论文和会议。有些是好的，有些是开创性的，有些则相当令人遗忘。\n"
