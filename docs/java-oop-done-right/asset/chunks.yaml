  trans: "\n\n![](img/title_page.png)\n\n![Java OOP Done Right](img/title_page.png)\n\
    \n# Java OOP Done Right\n\n### 使用现代 Java 编写让你自豪的面向对象代码\n\n#### Alan Mellor\n\n\
    本书已在 [`leanpub.com/javaoopdoneright`](http://leanpub.com/javaoopdoneright) 出售\n\
    \n此版本发布于 2021-04-05\n\n![publisher's logo](img/leanpub-logo.png)\n\n* * * * *\
    \ *\n\n这是一本 [Leanpub](http://leanpub.com) 书籍。Leanpub 通过精益出版（Lean Publishing）流程赋予作者和出版社能力。[精益出版](http://leanpub.com/manifesto)\
    \ 是使用轻量级工具和多次迭代出版进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在成功后建立影响力。\n\n* * * * * *\n\n\
    © 2021 Alan Mellor. 版权所有。\n\n致敬 Mike Cavanagh 师：\n\n你给我的启发远超你的想象。\n\n你曾说我会成为一名优秀的顾问，“但那时我还没有故事”。\n\
    \n我花了一些时间，但故事就在这里了。\n\n## 目录\n\n## 指南\n\n1. 开始阅读\n\n# 前言\n\n为什么又要写一本关于 Java OOP\
    \ 的书？\n\n我在 Quora 上已经做了几年作家了。我非常喜欢那里。我能与世界各地的人讨论我热爱的话题——设计良好软件的艺术。我从 1981 年开始学习这门艺术。我还没有学完。\n\
    \n这本书的出现是因为我在 Quora 的新 Java 开发者之间发现了一个共同点。他们许多人认为 Java 的 OOP 是“啰嗦的”、“复杂的”或“过时的”。而且到处到处需要“getters\
    \ and setters”。\n\n然而，我们已经有很多关于 Java 的优秀书籍，以及 OOP 的经典著作。\n\n那么改变了什么？\n\n这是我的理论。所有伟大的书籍都写于\
    \ 20 世纪 90 年——那时我们一些现代 Java 开发者甚至出生。没有人记得书中教训的原因很简单：我们不再教它们了。\n\n这本书是我对那些经典思想的提炼，加上经验的转化。每一章都包含了我为了获得结果而在日常工作中使用的内容。它充满了在代码一线\
    \ 25 年换来的智慧。它是实用的。而且非常简单。Bug 隐藏在复杂性中。我喜欢让 Bug 无处遁形。\n\n我希望这本书能让你跳出“getter and\
    \ setter”式的编码，进入高效状态，按照对象的设计初衷来使用。这可能是你第一次洞察 OOP 如何在现实世界中结合。Java 有啰嗦的声声。我希望这本书能告诉你如何解决这个问题。我希望你掌握编写整洁、强大、可读\
    \ OOP 代码的技巧。\n\n这本书不是 Java 教程。它应该适合能够编写 Java“Hello World”并理解变量、条件和类基础语法的初学者。示例使用\
    \ Java 11 语法。许多在 Java 1 中即可运行。\n\nAlan Mellor\n\nRock Cottage\n\n2021 年 2 月\n\n\
    # 为清晰性而优化\n\n在我们开始之前，这是本书的核心大题：\n\n编程本质上是向另一个人类解释计算机在任何时刻究竟在做什么。作为副作用，它也告诉计算机该做什么。\n\
    \n这之所以如此重要，是因为计算机*实际*运行的内容对任何任何人来说几乎都是不可理解的。\n\n例如，如果我写下：\n\n```\n1 clearScreen();\n\
    ```\n\n你可以理解我想要计算机清空屏幕上的所有内容，留出空白。\n\n但计算机做不到。它像石头一样笨。字面上就是如此。硅片是由二氧化硅——沙子制成的。\n\
    \n我们需要通过某种翻译器将这段代码转换为计算机的语言。一种看起来完全不像英语的语言。\n\n我的一台旧电脑需要像这样的东西：\n\n```\n1   LD\
    \ HL, 4000H  00100001 00000000 01000000\n2   LD DE, 4001H  00010001 00000001 01000000\n\
    3   LD BC, 6143   00000001 11111111 00010111 \n4   LD (HL), 0    00110110 00000000\n\
    5   LDIR          11101101 10110000\n```\n\n其中左侧的汇编语言*仍然*是一种人类可读的形式。右侧的二进制是该计算机在其\
    \ Z80A 微处理器上运行的代码。\n\n我知道我更喜欢哪一个。\n\n编程的艺术在于让程序清晰。可读。易于扫读。没有花招。\n\n这就是必须阅读所有二进制并推断出其意思是“清空屏幕”，与直接阅读\
    \ `clearScreen()` 之间的区别。\n\n在一个运作良好的专业团队中，没有人有时间、金钱或欲望去这样做。永远没有。\n\n这书的全部内容。\n\
    \n## 到底什么是对象？\n\n编程的艺术在于让程序清晰。可读。易于扫读。没有花招。\n\n这就是必须阅读所有二进制并推断出其意思是“清空屏幕”，与直接阅读\
    \ `clearScreen()` 之间的区别。\n\n在一个运作良好的专业团队中，没有人有时间、金钱或欲望去这样做。永远没有。\n\n这书的全部内容。\n\
    \n## 这 Java 有什么关系？\n\n作为一种面向对象的语言，Java 的设计是为了反映现实世界，就像我们的示例中一样。它允许我们编写关于邮员、信件以及\
    \ `deliver()` 等代码。它允许我们编写计算机代码，读起来就像对我们问题的英语描述。而不是代码。\n\n"
- fmt: "\nThe easiest way to understand it all, I think, is by the ‘User’ example\
    \ in the next section. But let’s introduce some terminology and Java syntax before\
    \ we look at that.\n\n### Classes, methods, constructors, objects, references\n\
    \n**Object**: An object is a small bundles of methods and data, used to represent\
    \ a single, specific thing: a person, a train, a word, a product.\n\n**Class**:\
    \ In Java, all objects belong to a `class`. A class allows one or more objects\
    \ to be created. It is a blueprint or a template for the common features of each\
    \ object.\n\n**Method**: A method is used to describe the behaviours our object\
    \ gives us. It is rather like a function that is specific to a `class`.\n\n**New**:\
    \ Keyword `new` takes a class name, then creates a specific object. It returns\
    \ a reference to that object that we can store. This lets us use that object later\
    \ in our code.\n\n**Constructor**: A special method that `new` will call. It is\
    \ responsible for setting up the object as it is being created. We can supply\
    \ initial values of things here.\n\n**Fields**: These are variables that are unique\
    \ to each object. To help our behaviour methods do their work, we can store data\
    \ in our object in fields.\n\n**Object reference**: keyword `new` will create\
    \ an object, set it up with a constructor, then return a ‘reference’. We can store\
    \ this reference in a local variable, or in an object field. We can then call\
    \ methods on that object, using the reference and the dot operator.\n\n**this**:\
    \ Inside a method, keyword `this` is an object reference that refers to the ‘current\
    \ object’. It is the same idea as when I talk to you and say ‘me’. I am referring\
    \ to myself.\n\n**private**: A keyword to mark a field or method as being usable\
    \ only inside the `Class`. Outside, it is invisible. It is used to mark ‘secrets’.\n\
    \n**public**: A keyword to mark a method as being usable from outside the `Class`\
    \ in calling code. Can be used on fields, but that is rare.\n\n### A simple example:\
    \ Greeting users\n\nTo show what we mean, let’s make a simple object: a `User`.\n\
    \nMost systems have users. Hopefully, we’ll have loads of users - if our marketing\
    \ works right. Our job is to show a personalised greeting to every one of them.\n\
    \nThe first design decision is to represent each user as an object. And to do\
    \ that, we’ll need to code up a ‘blueprint’ for what all user objects have in\
    \ common. A Java `User` class:\n\n```\n 1 public class User {\n 2   private String\
    \ name ;  // 3\\. private data\n 3 \n 4   public User( String name ){. // 2\\\
    . constructor\n 5     this.name = name ;\n 6   }\n 7 \n 8   public void greet()\
    \ { // 1\\. greet method\n 9     System.out.println( \"Hello, \" + name );\n10\
    \   } \n11 }\n```\n\nBefore we can do anything with them, we need to create a\
    \ simple test application. We’ll use the standard bit of Java boilerplate code\
    \ to create an `Application` class with a `static main()` - That’s a ‘magic method’\
    \ that tells the operating system where to start our Java program.\n\n```\n1 public\
    \ class GreetingsApplication {\n2   public static void main( String[] commandLineArgs\
    \ ) {\n3     User u1 = new User( \"Jake\" );\n4     User u2 = new User( \"Katy\"\
    \ );\n5 \n6     u1.greet();\n7     u2.greet();\n8   }\n9 }\n```\n\nRunning this\
    \ program shows us ‘Hello, Jake’ and ‘Hello, Katy’. It does this by creating two,\
    \ separate user objects and asking them to greet the user they represent.\n\n\
    This code might look underwhelming, but it contains the most important basics\
    \ of OOP. Let’s go through the key pieces.\n\n### Methods - Making objects do\
    \ stuff\n\nThe most important part about each object is what you can ask it to\
    \ do: the public methods.\n\nClass `User` has a single method on it called `greet()`\
    \ (see 1).\n\nThe method name tells us *what* the method does, not *how*. When\
    \ we write the calling code, this name describes what this method will do for\
    \ us. It also insulates us from having to care about how this gets done.\n\nThis\
    \ is important because it lets us change the internals of method `greet()`. When\
    \ we do, there will be no change at all to the calling code.\n\nOur test app creates\
    \ two user objects and calls the `greet()` method on each of them. Notice how\
    \ close to plain English the test app reads. OOP is all about designing customised\
    \ objects that do exactly the right thing for our app. We can name methods the\
    \ same way we talk in English about the problem we’re solving.\n\nWhen we design\
    \ objects, we start with behaviour methods. We add data and logic later, if it\
    \ is needed to make those methods do their job.\n\n### Secrets - Specialist knowledge\
    \ for our objects\n\nJust like the people in our example know things and have\
    \ tools to help them work, objects have their secrets, too.\n\nObjects typically\
    \ have two secrets:\n\n* Data - which is unique to each object\n* Algorithms -\
    \ the logic of how work is done\n\nOur `greet` method has both kinds of secrets.\n\
    \nThe logic secret of `greet()` is simple. We use Java’s `System.out.println()`\
    \ library method to write text to the console.\n\nThis is the *how* - how our\
    \ method greets a user. Because it is hidden behind the `greet` method’s signature,\
    \ we are free to change how we do this without affecting the calling code. This\
    \ is important. This stops changes from ‘rippling out’ through the system. That\
    \ makes the code easier to understand.\n\n### Constructors - Getting objects ready\
    \ to use\n\nAs we create one object per user, we want to make sure that the object\
    \ is ready to use after creation. This avoids many problems of ‘uninitialised\
    \ data’ that plague other approaches.\n\nWe have a special method to do this:\
    \ the `Constructor`.\n\nThe big idea of a constructor is that it creates an object,\
    \ loads it up and makes it ready to use.\n\nFor our `User` objects, the private\
    \ `name` field (see 3) is set inside the constructor. We pass each individual\
    \ name into the constructor as a parameter.\n\nConstructors help keep our private\
    \ data secret. They provide a way for the calling code to set up an object without\
    \ knowing anything about its secrets.\n\n### The big idea: calling code is simple\n\
    \nNow we understand how the `User` class has been coded inside, let’s look at\
    \ the big win of OOP: the public interface. The part that the calling code sees.\n\
    \nIt’s really simple.\n\n```\n1 User u = new User(\"Alan\");\n2 u.greet();\n```\n\
    \nTo write a program that knows how to greet a user, all we need to know - and\
    \ call - are the two public pieces. We call the constructor to create the object\
    \ and get it ready for use. Then we call `greet()`. It really couldn’t be any\
    \ easier.\n"
  raw: "The easiest way to understand it all, I think, is by the ‘User’ example in\
    \ the next section. But let’s introduce some terminology and Java syntax before\
    \ we look at that.\n\n### Classes, methods, constructors, objects, references\n\
    \n**Object** An object is a small bundles of methods and data, used to represent\
    \ a single, specific thing: a person, a train, a word, a product.\n\n**Class**\
    \ In Java, all objects belong to a class. A class allows one or more objects to\
    \ be created. It is a blueprint or a template for the common features of each\
    \ object.\n\n**Method** A method is used to describe the behaviours our object\
    \ gives us. It is rather like a function that is specific to a class.\n\n**New**\
    \ Keyword new takes a class name, then creates a specific object. It returns a\
    \ reference to that object that we can store. This lets us use that object later\
    \ in our code.\n\n**Constructor** A special method that new will call. It is responsible\
    \ for setting up the object as it is being created. We can supply initial values\
    \ of things here.\n\n**Fields** These are variables that are unique to each object.\
    \ To help our behaviour methods do their work, we can store data in our object\
    \ in fields.\n\n**Object reference** keyword new will create an object, set it\
    \ up with a constructor, then return a ‘reference’. We can store this reference\
    \ in a local variable, or in an object field. We can then call methods on that\
    \ object, using the reference and the dot operator.\n\n**this** Inside a method,\
    \ keyword ‘this’ is an object reference that refers to the ‘current object’. It\
    \ is the same idea as when I talk to you and say ‘me’. I am referring to myself.\n\
    \n**private** A keyword to mark a field or method as being usable only inside\
    \ the Class. Outside, it is invisible. It is used to mark ‘secrets’.\n\n**public**\
    \ A keyword to mark a method as being usable from outside the Class in calling\
    \ code. Can be used on fields, but that is rare.\n\n## A simple example: Greeting\
    \ users\n\nTo show what we mean, let’s make a simple object: a User.\n\nMost systems\
    \ have users. Hopefully, we’ll have loads of users - if our marketing works right.\
    \ Our job is to show a personalised greeting to every one of them.\n\nThe first\
    \ design decision is to represent each user as an object. And to do that, we’ll\
    \ need to code up a ‘blueprint’ for what all user objects have in common. A Java\
    \ ‘User’ class:\n\n```\n 1 public class User {\n 2   private String name ;  //\
    \ 3\\. private data\n 3 \n 4   public User( String name ){. // 2\\. constructor\n\
    \ 5     this.name = name ;\n 6   }\n 7 \n 8   public void greet() { // 1\\. greet\
    \ method\n 9     System.out.println( \"Hello, \" + name );\n10   } \n11 }\n```\n\
    \nBefore we can do anything with them, we need to create a simple test application.\
    \ We’ll use the standard bit of Java boilerplate code to create an Application\
    \ class with a ‘static main()’ - That’s a ‘magic method’ that tells the operating\
    \ system where to start our Java program.\n\n```\n1 public class GreetingsApplication\
    \ {\n2   public static void main( String[] commandLineArgs ) {\n3     User u1\
    \ = new User( \"Jake\" );\n4     User u2 = new User( \"Katy\" );\n5 \n6     u1.greet();\n\
    7     u2.greet();\n8   }\n9 }\n```\n\nRunning this program shows us ‘Hello, Jake’\
    \ and ‘Hello, Katy’. It does this by creating two, separate user objects and asking\
    \ them to greet the user they represent.\n\nThis code might look underwhelming,\
    \ but it contains the most important basics of OOP. Let’s go through the key pieces.\n\
    \n### Methods - Making objects do stuff\n\nThe most important part about each\
    \ object is what you can ask it to do: the public methods.\n\nClass User has a\
    \ single method on it called ‘greet()’ (see 1).\n\nThe method name tells us *what*\
    \ the method does, not *how*. When we write the calling code, this name describes\
    \ what this method will do for us. It also insulates us from having to care about\
    \ how this gets done.\n\nThis is important because it lets us change the internals\
    \ of method greet(). When we do, there will be no change at all to the calling\
    \ code.\n\nOur test app creates two user objects and calls the greet() method\
    \ on each of them. Notice how close to plain English the test app reads. OOP is\
    \ all about designing customised objects that do exactly the right thing for our\
    \ app. We can name methods the same way we talk in English about the problem we’re\
    \ solving.\n\nWhen we design objects, we start with behaviour methods. We add\
    \ data and logic later, if it is needed to make those methods do their job.\n\n\
    ### Secrets - Specialist knowledge for our objects\n\nJust like the people in\
    \ our example know things and have tools to help them work, objects have their\
    \ secrets, too.\n\nObjects typically have two secrets:\n\n*   Data - which is\
    \ unique to each object\n\n*   Algorithms - the logic of how work is done\n\n\
    Our greet method has both kinds of secrets.\n\nThe logic secret of greet() is\
    \ simple. We use Java’s System.out.println() library method to write text to the\
    \ console.\n\nThis is the *how* - how our method greets a user. Because it is\
    \ hidden behind the greet method’s signature, we are free to change how we do\
    \ this without affecting the calling code. This is important. This stops changes\
    \ from ‘rippling out’ through the system. That makes the code easier to understand\
    \ and safer to change.\n\nThis is also why the calling code looks so simple. It\
    \ is not concerned with deep technical details. It just asks for what it needs\
    \ doing - user.greet(). It leaves it up to the object to get the work done.\n\n\
    *This is called the **Tell Don’t Ask** principle*\n\nWe tell the object what we\
    \ would like it to do for us. We don’t ask it for any of its secrets and try to\
    \ do its job ourselves in the calling code. It is a huge advantage in simplifying\
    \ our code.\n\nOur object also has the other secret - data.\n\nFor our greet()\
    \ method to work, it will need to know the user’s name.\n\nWe decided upfront\
    \ that each User object will represent one individual user in the real world.\
    \ That user has a name. So our user objects make the perfect place to store their\
    \ name. We do this in the private field called ‘name’ (see 3)\n\nHaving just one\
    \ String field can be confusing to OOP beginners. How do you store the names of\
    \ all the users without an array or something?\n\nNon-OOP code might well have\
    \ an array or dictionary to store all the names of the users. OOP code splits\
    \ this problem up a different way. As we have one object per user and only store\
    \ one name for each user, our object only needs to store one name.\n\nInstead\
    \ of one array with many names, we have *many objects* each with only one name.\
    \ It’s less to think about and a lot more obvious. Where can we find a user’s\
    \ name? In their object.\n\nThis idea of self-contained objects makes Object Oriented\
    \ programs simpler to understand.\n\n### Constructors - Getting objects ready\
    \ to use\n\nAs we create one object per user, we want to make sure that the object\
    \ is ready to use after creation. This avoids many problems of ‘uninitialised\
    \ data’ that plague other approaches.\n\nWe have a special method to do this:\
    \ the Constructor.\n\nThe big idea of a constructor is that it creates an object,\
    \ loads it up and makes it ready to use.\n\nFor our User objects, the private\
    \ ‘name’ field (see 3) is set inside the constructor. We pass each individual\
    \ name into the constructor as a parameter.\n\nConstructors help keep our private\
    \ data secret. They provide a way for the calling code to set up an object without\
    \ knowing anything about its secrets.\n\n## The big idea: calling code is simple\n\
    \nNow we understand how the User class has been coded inside, let’s look at the\
    \ big win of OOP: the public interface. The part that the calling code sees.\n\
    \nIt’s really simple.\n\n```\n1 User u = new User(\"Alan\");\n2 u.greet();\n```\n\
    \nTo write a program that knows how to greet a user, all we need to know - and\
    \ call - are the two public pieces. We call the constructor to create the object\
    \ and get it ready for use. Then we call greet(). It really couldn’t be any easier."
