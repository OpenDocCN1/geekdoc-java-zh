    \ oriented programs grow large in size, it gets more essential to split that system\
    \ apart into little pieces.\n\nBut what does ‘split apart’ mean? And what is a\
    \ ‘little piece’, exactly?\n\nThe five design principles known as SOLID came about\
    \ as solutions to this. They have some pretty indecipherable names but are easy\
    \ enough - once you understand what problems they solve.\n\n## The five SOLID\
    \ principles\n\nLet’s just list them out, so you know what the acronym means:\n\
    \n*   **SRP** Single Responsibility Principle\n\n*   **OCP** Open/Closed Principle\n\
    \n*   **LSP** Liskov Substitution Principle\n\n*   **ISP** Interface Segregation\
    \ Principle\n\n*   **DIP** Dependency Inversion Principle\n\nYou can see the acronym\
    \ in the first letters.\n\nThe titles of each principle are jargon in the proper\
    \ sense. Once you know what each one means, the short titles make sense. But until\
    \ then, they won’t mean much.\n\nIt’s important to note that the order of these\
    \ is ‘what sounds best’ - not ‘what is most useful’. So, unlike every other book\
    \ on SOLID, I’m going to explain the principles in order of usefulness - “SDLOI”.\
    \ I’ll give you that it doesn’t roll off the tongue as easily.\n\n## SRP Single\
    \ Responsibility - do one thing well\n\nCode that does many things is hard to\
    \ understand.\n\nIf we have a class that opens files, reads lines of text, does\
    \ a spelling check, blanks out passwords, then writes an HTML page - it’s a headache.\n\
    \nIt’s doing more than one thing.\n\nThe solution is to split this up into separate\
    \ classes where *each one does one thing*.\n\nThat is the SRP. Give a Class one\
    \ single responsibility.\n\nIt is both the simplest and most widely used of the\
    \ SOLID principles. Unfortunately, it is also the most difficult to pin down.\n\
    \n### What is ‘one thing’, anyway?\n\nThe problem with it is in deciding what\
    \ ‘one thing’ is.\n\nI’m writing this on a web-based Word Processor. To me, it\
    \ is ‘just one thing’ - the thing I type on.\n\nBut inside, it will have many\
    \ different moving parts: Text management, storage management, web input and output,\
    \ to name a few.\n\nIt’s hard to create any rules around this. When we look at\
    \ ‘Hexagonal Architecture’, we’ll see some things that help us figure out single\
    \ pieces, by splitting out anything concerned with an external system.\n\nFor\
    \ most of our code, though, a good rule is to look at the language we use in our\
    \ test names.\n\nDo they talk about ‘the same thing’?\n\nAs an example, look at\
    \ our test class for our Bill object from earlier, the BillTest.\n\nIt has methods\
    \ relating to adding up different total values for different items on a bill.\n\
    \nThat’s doing one thing.\n\nIf it started having tests for `createsHtmlWithUnderlinedTotal()`\
    \ or `savesTotalToDatabase()` then we can see that our Bill class has grown some\
    \ extra responsibilities.\n\nThe solution is simply to refactor those extra responsibilities\
    \ into their own classes. Go back to basics and redesign your object collaborations.\n\
    \nBut before we can do that, we’re going to have to look at our next SOLID principle:\
    \ Dependency Inversion.\n\n## DIP Dependency Inversion: Bring out the Big Picture\n\
    \nThis is the most important and most useful idea of SOLID.\n\nBy Inverting Dependencies,\
    \ you create code by assembling swappable ‘plugin’ style components.\n\nThis gets\
    \ you two big benefits:\n\n*   Changes in one component do not ripple through\
    \ to any others\n\n*   You can replace components with ones designed to help TDD\
    \ tests\n\n### What is an ‘inverted dependency’?\n\nThe easiest way to understand\
    \ this is to take some code without it, see what problems it has, then refactor\
    \ it.\n\nLet’s start with a simple method that lives in a class somewhere. Its\
    \ responsibility is to take some keyboard input, make it all upper case, then\
    \ display it on the console:\n\n```\n 1 public void showInputInUpperCase() {\n\
    \ 2 \n 3     // Fetch Keyboard Input\n 4     Scanner scanner = new Scanner(System.in);\n\
    \ 5     String inputText = scanner.nextLine();\n 6 \n 7     // Convert\n 8   \
    \  String upperCaseText = inputText.toUpperCase();\n 9 \n10     // Display\n11\
    \     System.out.println(upperCaseText);\n12 }\n```"
