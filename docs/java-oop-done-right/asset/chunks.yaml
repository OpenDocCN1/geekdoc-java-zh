    inside a unit test harness, just so it is easy to run. That often shows you ‘how
    a solution might feel’.


    Always be ready to simplify an idea for now if it is just too hard. Get the simple
    one working first, then add extra features later. That stops ‘analysis paralysis’,
    where you can’t start because the job is too big.


    # Further Reading


    For further reading, here are my favourite software design books


    ## Agile Software Development, Robert C Martin


    This book covers it all. A nice intro to TDD. Detailed explanations of SOLID and
    other design ideas.


    For me, the best part of this book is its large case studies. The book describes
    in detail how a number of realistic systems are designed, including a weather
    station with a GUI. The book takes you through the twists and turns of design
    and refactoring as you go, arriving at a good solution after the journey of discovering
    problems.


    ISBN 978-1292025940


    https://www.amazon.co.uk/gp/product/B00IZ0G6YG


    ## Growing Object Oriented Software Guided By Tests, Freeman and Pryce


    My favourite book on TDD. Often referred to as the ‘London School’ or the ‘Mockist’
    approach (but not by the authors), this book is all about designing a large chat
    messaging system, outside-in, test-first.


    It shows how you can start with basic, not particularly clean code that completely
    meets the early requirement, then use tests to drive you to better designs. But
    only if and when you need them. Covers a huge amount of ground in test-first design
    thinking and practice.


    ISBN 978-0321503626


    https://www.amazon.co.uk/dp/0321503627


    ## Refactoring, Martin Fowler


    The opening case study is absolutely wonderful. You’ll want to buy the first edition
    to get Java examples.


    It starts with some fairly average procedural code and splits it apart one step
    at a time. We end up with elegant object oriented code. This chapter alone can
    teach you a lot about how to do OOP properly.


    The rest of the book is in ‘cookbook’ style, with detailed descriptions of individual
    refactor steps you can make. Interestingly, most of them have a reverse, which
    clearly shows that there is no ‘one size fits all’ with Refactoring. You need
    different tools to take you to the code you want.


    ISBN 978-0201485677 (2nd edition with Java examples)


    https://www.amazon.co.uk/gp/product/B007WTFWJ6


    ## Design Patterns Helm, Johnson, Richards, Vlissides


    When we say ‘Design Patterns’, this was the book that started it off. It is a
    catalogue of 23 patterns, with examples of how and where they are used.


    As it has a long title and four authors with long names, you’ll hear this book
    talked about as the “Gang of Four” book (often abbreviated GoF).


    ISBN 978-0201633610


    https://www.amazon.co.uk/dp/0201633612


    ## Domain Driven Design, Eric Evans


    Designing software around the problem domain. This book provides several techniques
    for keeping the domain knowledge up front and central in your code.


    ISBN 978-0321125217


    https://www.amazon.co.uk/dp/0321125215


    ## Applying UML with Patterns, Craig Larman


    This book should get more love. It is excellent. Craig Larman shows an approach
    to designing software based on his GRASP principles. It is a really well-written
    book, full of great OOP design advice.


    ISBN 978-0131489066


    https://www.amazon.co.uk/dp/0131489062


    ## Home page for this book


    https://www.viewfromthecodeface.com/javaoopdoneright


    Pointing you to code samples, videos, extra stuff.


    ## My Blog


    My writings on software. You’ll find tutorials and stories from my experience.


    https://www.viewfromthecodeface.com


