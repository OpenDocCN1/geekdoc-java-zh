  trans: "\n\n我们已经看到面向对象编程（OOP）的核心在于让调用代码变得简单，并将细节隐藏在方法内部。我们构建一组相互协作的对象，并仅通过这些公共方法进行交互。我们已经学会了先设计行为方法，再添加任何必要的私有数据，最后才添加构造函数。我们从对象的外部向内部进行设计。\n\
    \n如果我们能找到一种方法，帮助我们记住按照这个顺序执行任务——并且在软件完全完成之前就将其`run`起来会呢？\n\n测试驱动开发（TDD）正是实现这一目标的方法。\n\
    \nTDD 帮助我们获得正确的设计。它迫使我们在编写任何内部代码之前，先思考对象方法对调用者来说应该是什么样的。\n\nTDD 证明了我们的逻辑运行符合预期。我们调用一个方法，捕获输出并将其与预期值进行比较。\n\
    \n简而言之，这简直是魔法。你绝对应该使用它。\n\nTDD 还提供了一种方法，让我们在编写出协作对象之前，就能证明我们的对象与其协作对象正常工作。但在尝试这一点之前，我们将在随后的章节中介绍“多态”。\n\
    \n让我们从基础开始。我们如何开始 TDD？它又有什么帮助？\n\n## 使用 TDD 进行从外向内的设计\n\nTDD 帮助我们设计对象的公共接口使其易于使用。\n\
    \n关键在于，使用我们认为良好的公共接口来编写调用我们对象的代码。我们是在编写对象内部代码`before` 这么做的。这迫使我们思考如何让调用代码简单。这再次体现了\
    \ OOP 的“逆向思维”。\n\n这段代码被称为测试代码。它将设置我们的对象，调用它的行为方法，然后检查该方法是否生效。\n\n这个测试为我们做了两件事：\n\
    \n* 验证行为是否正确\n* 验证调用是否易于实现 - 这是良好设计的标志\n\n如果我们的设计难以设置或难以使用，我们将在难读的测试代码中看到。\n\n\
    Java 项目使用很棒 `JUnit` 测试框架来提供帮助。我喜欢添加 `AssertJ` 来帮助完成检查。\n\n让我们用 TDD 构建一个小型计算器，用来累加餐厅账单。在跟随操作时，请注意\
    \ TDD 的`rhythm`：写一点测试，看到失败，用一点代码修复它，不断循环。\n\n我们的计算器类应该做两件事：\n\n* 为我们已添加的所有项目提供运行总计\n\
    * 添加另一个项目。\n\n我们从写一个空测试开始。我们希望这个测试能证明某些在我们一创建 `BillCalculator` 类时就会成立的事。如果我们创建了这个对象且没有向它添加任何项目，总数必须为零。\n\
    \n让我们开始为之写一个测试。\n\n### 第一个测试：总数从零开始\n\n```java\nclass BillCalculatorTest {\n \
    \   @Test\n    public void totalStartsAtZero() {\n        // ... todo\n    }\n\
    }\n```\n\n我们得到了测试类和一个测试框架方法，它们都根据其功能命名。\n\n现在我们为对象进行一步微小的设计。我们希望能够访问最新的运行总计。对于这一点，尽管我在之前的章节中一直在抱怨，但一个\
    \ `getTotal()` 方法似乎是最简单、最清晰的设计。\n\n让我们把这个设计决策加入测试中：\n\n```java\nclass BillCalculatorTest\
    \ {\n    @Test\n    public void totalStartsAtZero() {\n        // Act\n      \
    \  float total = calculator.getTotal();\n    }\n}\n```\n\n此时编译器会大声地抱怨，如果这是你第一次\
    \ TDD 会话，你可能也会这样抱怨：“还没有任何对象！”\n\n说得对。让我们修复它。\n\n使用 IDE 快捷键，创建一个名为 `BillCalculator`\
    \ 的新类：\n\n```java\nclass BillCalculator {\n}\n```\n\n现在，我们可以修复编译器的许多抱怨中的第一个，并创建一个计算器对象：\n\
    \n```java\nclass BillCalculatorTest {\n    @Test\n    public void totalStartsAtZero()\
    \ {\n        // Arrange\n        var calculator = new BillCalculator();\n\n  \
    \      // Act\n        float total = calculator.getTotal();\n    }\n}\n```\n\n\
    我使用了最近 Java 版本中的 `var` 关键字（别问我是哪个版本；我从来不是那种语言专家类型的人）。我觉得在这里读起来非常清晰。\n\n编译器将不情愿地接受我们现在不是白痴了，并移除\
    \ `calculator` 下方的红 X。它将继续处理下一个抱怨。我们需要添加 `getTotal()` 方法。\n\n让 IDE 快捷键来完成这个，因为\
    \ IDE 拥有所有所需的信息来正确完成：\n\n```java\nclass BillCalculator {\n    public float getTotal()\
    \ {\n        return 0.0;\n    }\n}\n```\n\n我喜欢这样倒着工作。IDE 拥有足够的信息来完成大部分的体力活，而且不会像我那样犯那么多输入错误。一旦进入了节奏，这是一种非常快的工作方式。你甚至（对外行人来说）像个\
    \ `10x 级忍者摇星程序员`。\n\n总之。编译器会开心的，允许我们添加对一切都完好的检查。我们将使用很棒的 `AssertJ` 库来提供 `assertThat`\
    \ 方法。\n\n```java\nclass BillCalculatorTest {\n    @Test\n    public void totalStartsAtZero()\
    \ {\n        // Arrange\n        var calculator = new BillCalculator();\n\n  \
    \      // Act\n        float total = calculator.getTotal();\n\n        // Assert\n\
    \        assertThat(total).isZero();\n    }\n}\n```\n\n我们可以运行这个测试 - 并且通过了！我们的计算器通过了它的第一个唯一测试。\n\
    \n## Arrange, Act, Assert - 测试内部的节奏\n\n注意我们编写代码如何导致测试分为三个部分。我们首先决定了行为方法并对其进行了调用。这被称为\
    \ `act` 步骤 - 采取行动。\n\n我们还决定了该方法返回什么。这意味着我们通过与预期值比较来如何测试它。这是 `assert` 步骤 - 我们对输出进行断言。\n\
    \n最后，我们需要一个对象来测试！这是 `arrange` 步骤，我们为测试开始做好所有准备。我们写的每个测试都有这个节奏：Arrange, Act, Assert。\n\
    \n## Red, Green, Refactor - 测试之间的节奏\n\n在写完第一个测试后，我们就可以进入开发的核心了。我们一个测试一个地向代码添加功能。在此之前，TDD\
    \ 有一个额外的节奏引导我们：Red, Green, Refactor。\n\n**Arrange, Act, Assert** 引导我们在测试内部，帮助我们编写良好的测试代码并记住所有部分。\n\
    \n**Red, Green, Refactor** 帮助我们发现*涌现设计*。它发生在测试之间。\n\n"
- fmt: "\nIn the TDD refactor step, we apply principles from this book to our code.\
    \ We look at our production code *and* our test code. We do a mini Code Review\
    \ and look for improvements:\n\n* Do all names reveal intent?\n* Can we eliminate\
    \ duplicated code (`DRY` Don’t Repeat Yourself)?\n* Can we replace complex syntax\
    \ with simpler syntax?\n* Can we split something out to add an explaining variable\
    \ or method?\n\nIf we find any improvements - or perhaps our pair or mob colleagues\
    \ do - we make them now.\n\nAt the end of each Red - Green - Refactor` cycle,\
    \ we have code that has good OOP design, has been proven to work and has the right\
    \ quality.\n\nIn our case, we’ve only just started. It’s hard to mess up code\
    \ on a blank slate, so there’s nothing we need to do.\n\n## Second test: Adding\
    \ an item gives us the right total\n\nTime to add our first ‘proper’ feature -\
    \ which in TDD means writing another test.\n\nWe retain all the tests we have\
    \ already written. By doing that, we build up a whole suite of regression tests.\
    \ A “regression” is where we accidentally break something in Feature `#1` when\
    \ we add Feature `#2`. By keeping all our tests passing, we prove that we have\
    \ not done that.\n\nFrequently during development - and certainly before a commit\
    \ - we run all tests and make sure they all pass.\n\nOf course, this is a massive\
    \ boost to software quality. It might also seem rather obvious. But things are\
    \ only obvious when you know how. I mention it because of one Bootcamp session,\
    \ where one student ended up with only one test, deleting all the others in each\
    \ new iteration!\n\nAnyway. The new test:\n\n```\n 1 class BillCalculatorTest\
    \ {\n 2     @Test\n 3     public void correctTotalForOneItem() {\n 4         //\
    \ Arrange\n 5         var calculator = new BillCalculator();\n 6 \n 7        \
    \ // Act\n 8         calculator.add(12.95);\n 9         float total = calculator.getTotal();\n\
    10 \n11         // Assert\n 12         assertThat(total).isEqualTo(12.95);\n13\
    \     }\n14 }\n```\n\n## Designing the second feature\n\nWe proceed with the same\
    \ Arrange, Act, Assert rhythm as before.\n\nWe’re making more design decisions\
    \ now. We are beginning to affect the shape of the code. I’ve made two decisions,\
    \ at least one of which is questionable: naming the behaviour that adds to the\
    \ total `add`, and using a `float` to represent the price. To be fair, that was\
    \ done in the previous step.\n\nUsing `float` is the questionable one. `Floats`\
    \ and money do not mix well outside of student exercises and trivial exercises\
    \ in books (ahem). They have two problems for money: rounding errors and currency\
    \ type.\n\n`Floats` lack precision. They usually use the `IEEE-754` standard to\
    \ store a mantissa and exponent with a certain number of binary bits. The upshot\
    \ of which is that certain fractions - like one third - cannot be represented\
    \ accurately. This leads to rounding errors when adding numbers. Not great for\
    \ adding up bills.\n\nA raw `float` also does not have knowledge of the currency\
    \ involved. For mixed currencies, often found in banking, this makes them useless.\n\
    \nCreating a `Money` class can fix both of these problems. But this is an example\
    \ on TDD after all, not banking. Let’s just move on and pretend neither of us\
    \ said any of that. Try to not look guilty.\n\nLet’s use that test to drive out\
    \ a reasonable implementation:\n\n```\n 1 class BillCalculator {\n 2     private\
    \ float total ;\n 3 \n 4     public void add(float itemPrice) {\n 5         total\
    \ = itemPrice;  // 1. We need to talk about this...\n 6     }\n 7 \n 8     public\
    \ float getTotal() {\n 9         return total;\n10     }\n11 }\n```\n\nThe test\
    \ passes. Boom! High fives all round.\n\nIs there anything to refactor? Nothing\
    \ really jumps out, but I’ve decided I want to Refactor > Rename the class name\
    \ to `Bill`.\n\nThat seems to make more sense than `BillCalculator` now we have\
    \ the behavioural method `add()`. This isn’t a calculator. It is a restaurant\
    \ bill, and we are doing things with it. That’s a different way of looking at\
    \ this problem. It’s common to get this kind of insight as your object oriented\
    \ design unfolds and you learn more about the problem. This is why agile, iterative\
    \ development works really well with OOP.\n\nWe’ll use the IDE tools to rename\
    \ `BillCalculator` to `Bill` and check the box to rename the test in lock-step.\
    \ I’ll Refactor > Rename the local variable `calculator` in the test to `bill`\
    \ as well.\n\n## TDD Steps - Too much? Too little?\n\nLet’s look at the design\
    \ decision at (1). It reveals a tension in TDD.\n\nI did strict TDD above, to\
    \ show how it’s done. I made the test pass by writing the simplest code that came\
    \ to mind to do it. The normal trick is to then tidy up anything we don’t like\
    \ in the refactor step.\n\nBut this is something different. It’s about how much\
    \ progress to do in one step.\n\nThe implementation at (1) *assigns* the price\
    \ to the total. It overwrites the existing total, rather than adding it up.\n\n\
    This means that the zero case will pass, and a single item case will pass. Adding\
    \ a second item will fail.\n\nStrict TDD *always* does the bare minimum at each\
    \ step. This is called the `YAGNI` principle.\n\n## YAGNI - You Ain’t Gonna Need\
    \ It\n\n`YAGNI` stands for `you ain’t gonna need it`.\n\n## YAYA - Yes, You Are\n\
    \n`YAYA` stands for `yes, you are`.\n"
