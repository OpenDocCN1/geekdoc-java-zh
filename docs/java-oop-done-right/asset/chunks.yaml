  trans: "\n我们之前已经提到过这一点。如果你返回了一个 null，然后尝试对该 null 调用方法，Java 就会崩溃（boom）。\n\n公平地说，Java\
    \ 崩溃的程度比 C 或 C++ 要小得多。它实际上相当有文明。它会抛出一个 `NullPointerException`。\n\n表示无法返回用户对象的一种简单方法是返回\
    \ `null`。我们可以省略 null 检查，转而捕获异常：\n\n```\n1 try {\n2     User u = findUserById(\"\
    alan0127\");\n3     u.showProfile();\n4 }\n5 catch( NullPointerException npe )\
    \ {\n6     // 处理缺失的用户 \n7 }\n```\n\n这在本质上与带有 null 检查的 null 返回类似。你会在项目中看到这种写法。我不确定是否真的喜欢它——尽管我自己用过它。\n\
    \n## 特定应用的异常\n\n一个小的改进是定义一个具描述性的异常：\n\n```\n1 class UserNotFoundException extends\
    \ RuntimeException {\n2     public UserNotFoundException( String diagnostics )\
    \ {\n3         super(diagnostics);\n4     }\n5 }\n```\n\n这允许我们指示出如下的错误：\n\n```\n\
    1 User findUserById( String userId ) {\n2     throw new UserNotFoundException(\"\
    <此处不可用的原因>\");\n3 }\n```\n\n并且调用代码变得稍微清晰了一些：\n\n```\n1 try {\n2     User u = findUserById(\"\
    alan0127\");\n3     u.showProfile();\n4 }\n5 catch( UserNotFoundException unfe\
    \ ) {\n6     // 处理缺失的用户 \n7 }\n```\n\n这是迈耶“契约设计”（Design by Contract）思想的实现。\n\n\
    ## 错误对象\n\n异常与面向对象编程（OOP）之间似乎有些不协调。\n\nOOP 的核心在于行为和对象的协作。而异常的核心在于以一种非常程序化的方式干扰控制流。这两者并不真正匹配。\n\
    \n错误对象与异常非常不同。它们是从方法返回的标准对象。这些方法会正常运行并完成。\n\n它们通过使用多态和“告知而非询问”（tell don’t ask）来工作。正如我们将看到的，是如此两次。\n\
    \n让我们回到我们的运行示例 `findUserById(id)`。它可以返回一个有效的 `User`，或者告诉调用代码不存在它。\n\n使用 OOP，我们可以将每种情况定义为一个独立的对象：\n\
    \n```\n1 class ValidUser {\n2     private final User ;\n3 \n4     public ValidUser(User\
    \ u){\n5         this.user = u;\n6     }\n7 }\n8 \n9 class InvalidUser {\n10 \
    \    // 无需表示的内容 ...\n11 }\n```\n\n这听起来当然是 SRP（单一职责原则）的极佳应用，直到我们问：“如果它们之间存在某种继承关系——`extends`\
    \ 或 `implements`——Java 函数才能返回两种对象。但事实并非如此。”\n\n当然，我们可以简单地让两者都实现一个接口来修复这个问题。让 `findUserById(id)`\
    \ 返回一个 `UserResult` 接口：\n\n```\n1 interface UserResult {\n2     // 空\n3     //\
    \ ... 我们会再回到这里这里\n4 }\n```\n\n它可以被简单地返回：\n\n```\n1 UserResult findUserById( String\
    \ userId ) {\n2     // ... 代码\n3 }\n```\n\n如果我们让这两个对象实现我们的接口，那么该方法内部就可以返回我们的两个对象之一：\n\
    \n```\n1 class ValidUser implements UserResult {\n2     private final User user\
    \ ;\n3 \n4     public ValidUser(User u){\n5         this.user = u;\n6     }\n\
    7 }\n8 \n9 class InvalidUser implements UserResult {\n10     // 无需表示的内容 ...\n\
    11 }\n```\n\n这一切都很棒。我们正在稳步进展。但等一下——那是空接口吗？那是什么？很有道理。目前，我们在调用代码中能做的就是调用 `instanceof`\
    \ 来找出返回的是哪个具体的类。这比 null 检查还要糟糕！我们需要做得更好。回想 OOP，我们真正需要一种共同的行为。某种能统一 `InvalidUser`\
    \ 和 `ValidUser` 的东西。显然，那应该是类似于 `getName()` 的方法，因为 `InvalidUser` 没有这个方法。\n\n修复方法是使用“告知而非询问”原则。我们可以告诉我们的对象“执行它的事情”。字面上的如此。我们添加一个\
    \ `applyTo()` 方法：\n\n```\n1 interface UserResult {\n2     void applyTo(); // ...\
    \ 我们会再回到这里\n3 }\n```\n\n这样更好。我们的调用代码不再需要我们返回了哪个具体的类。它只需要调用 `applyTo()`，然后相关的对象就会应用自己。啊。它具体要应用到什么？我们缺少另一个接口：\n\
    \n```\n1 interface UserConsumer {\n2     void validUser( User u );\n3     void\
    \ invalidUser();\n4 }\n```\n\n我们可以在 `UserResult` 接口中使用它：\n\n```\n1 interface UserResult\
    \ {\n2     void applyTo( UserConsumer consumer );\n3 }\n```\n\n我们必须用新方法更新 `ValidUser`\
    \ 和 `InvalidUser`：\n\n```\n1 class ValidUser implements UserResult {\n2     private\
    \ final User user ;\n3 \n4     public ValidUser(User u){\n5         this.user\
    \ = u;\n6     }\n7 \n8     public void applyTo( UserConsumer uc ) {\n9       \
    \  uc.validUser( user );\n10     }\n11 }\n12 \n13 class InvalidUser implements\
    \ UserResult {\n14 \n15     public applyTo( UserConsumer uc ) {\n16         uc.invalidUser();\n\
    17     }\n18 }\n```\n\n最后，这合理。我们告诉我们的结果对象应用自己，但这次是应用到我们创建的某个消费者对象上。在每种情况下，消费者对象都保证被赋予一个有效的\
    \ `User` 对象或无效的。这里的想法是 `findUserById(id)` 现在返回一个对象。我们让它 `applyTo()` 我们创建的另一个对象。该对象处理有效或无效的情况。这是一种“推”的解决方案。如果你回想\
    \ null 检查解决方案，会有两个代码块；一个处理 null，另一个处理非 null。现在，对于每种情况都有两个不同的方法。作为示例，让我们创建一个简单的对象来打印有效\
    \ `User` 的配置，并在无效时向控制台写入错误消息：\n\n```\n1 class ProfileTextDisplay implements UserConsumer\
    \ {\n2     public void validUser( User user ) {\n3         user.showProfile();\n\
    4     }\n5 \n6     public void invalidUser() {\n7         System.out.println(\
    \ \"抱歉，我们不认识那个用户。\" );\n8     }\n9 }\n```\n\n我们可以创建这样的调用代码：\n\n```\n1 ProfileTextDisplay\
    \ display = new ProfileTextDisplay();\n2 \n3 UserResult result = findUserById(\
    \ \"alan0127\" );\n4 result.applyTo(display)\n```\n\n这就是最终的结果。调用代码——终于——看起来清晰、简单且整洁。没有\
    \ null，没有异常，没有条件判断。只有知道如何作为其秘密执行正确事情的对象。我们需要胶水代码相当多：`UserResult`、`ValidUser`、`InvalidUser`、`UserConsumer`。但权衡是每个部分都得到了良好的分离。\n\
    \n## Optionalals - Java 8 流式方法\n\nJava 8 通过使用流引入了一些纯函数思想。大想法是将遍历集合和转换集合中的每个对象合并为一步。\n\
    \n一个典型的示例是获取我们的 `User` 对象列表，找到第一个用户名以“Al”开头的用户，然后将该名称转换为全大写：\n\n```\n1 fetchDisplayNameForFirstAl(\
    \ List users ) {\n2     return users.stream()\n3         .filter( user -> user.nameStartsWith(\"\
    Al\") )\n4         .findFirst()\n5         .map( user -> user.getName().toUpperCase()\
    \ );\n6 }\n```\n"
- fmt: "\nIn the snippet above, what happens when there are `no` users whose name\
    \ starts with Al?\n\nThat method simply could not work as written. There needs\
    \ to be some way to signal to that function chain that ‘the data was not found’.\n\
    \nJava 8 borrowed from other functional languages to give us the concept of an\
    \ `optional value`. Just like it says, this is a value that may, or may not, contain\
    \ the data we want.\n\nAt its simplest, we can make our `findUserById(id)` method\
    \ return an optional `User`:\n\n```\n1 Optional<User> findUserById( String userId\
    \ ) {\n2     // ... code\n3 }\n```\n\nInside the method, we can use the construct\
    \ `return Optional.of( user );` to return a valid `User` object, or `return Optional.empty();`,\
    \ to indicate that no valid `User` exists.\n\nThe calling code is where this gets\
    \ interesting. We can choose to handle these cases either with a simple if statement,\
    \ or by supplying a ‘lambda function’ to act on our valid `User`.\n\nThe if statement\
    \ resembles a null check:\n\n```\n1 Optional<User> result = findUserById( \"alan0127\"\
    \ );\n2 \n3 if (result.isPresent()) {\n4     result.get().showProfile();\n5 }\n\
    6 else {\n7     System.out.println( \"Sorry, we could not find that user\" );\n\
    8 }\n```\n\nTechnically, there is no improvement over a null check. But I do think\
    \ the readability of this is much better. It is `intentional`. We can clearly\
    \ read that this code is all about an optional value and code that handles the\
    \ value if it is present.\n\nBut Java 8 provides its own way of eliminating the\
    \ if statement:\n\n```\n1 findUserById(\"alan0127\")\n2     .ifPresent( user ->\
    \ user.showProfile() )\n3     .orElse( System.out.println(\"Sorry, we could not\
    \ find that user\"));\n```\n\nThis is a simple refactoring of the if statement\
    \ above, but using the `ifPresent()` method of `Optional`. This takes a `lambda\
    \ function reference` as an argument - we pass in some code to execute if the\
    \ value is present. The chained method `orElse()` similarly takes in a lambda\
    \ function reference to run if the value is not present.\n\nThis has a readability\
    \ advantage - once we are familiar with the syntax of method references. It also\
    \ has all the usual advantages of avoiding null checks.\n\nThis style is gaining\
    \ popularity, as newer (Java 8 and onwards) libraries adopt `Optional<>`.\n\n\
    ## Review: Which approach to use?\n\nWe’ve covered several ways of reporting errors.\
    \ They are all options. You will see all of them out in the wild.\n\nThe most\
    \ basic - the null check - we simply can’t avoid. It is too baked into both Java\
    \ libraries and Java programmers alike. Null checks are a thing. They are here\
    \ to stay.\n\nI don’t recommend them, though. Nulls clutter up calling code and\
    \ introduce the possibility of an uncaught `NullPointerException`. That’s enough\
    \ to take the entire app down.\n\nFor new Java 8 and onwards code, the `Optional<T>`\
    \ approach can work well, especially combined with `@NotNull` annotations that\
    \ can be checked via static analysis tools.\n\nIt’s a shame that `Optional` wasn’t\
    \ made into its own primitive type. In that case, an `Optional` return would be\
    \ guaranteed to never be null. As it is just a regular object, you can return\
    \ null instead of an `Optional`, defeating the whole point. I can see why such\
    \ a fundamental change to Java was not introduced. But I’m allowed to grumble\
    \ at the missed opportunity.\n\nError objects require a lot of plumbing. But the\
    \ calling code is pure OOP and very clean. They have a lot of advantages once\
    \ you get used to them. They are easy to use in more advanced ways, like adding\
    \ `error( ErrorInfo reason )` kinds of methods, in addition to `valid()` and `invalid()`\
    \ methods.\n\nExceptions are a fairly clean approach. Detractors say they are\
    \ ‘a glorified goto’. That’s fair. They point out that exceptions should - in\
    \ their view - only be used for things truly unrecoverable, errors that nobody\
    \ was expecting. I hope I’ve shown you that Bertrand Meyer’s ‘Design by Contract’\
    \ shows an alternative viewpoint.\n\nZombie objects are surprisingly useful. Combining\
    \ minimal plumbing with enhanced readability, they form a ‘cheap and cheerful’\
    \ error object.\n\nWhen deciding, you need to think through the trade-offs given\
    \ your existing code, your existing developers and the `feelings` towards the\
    \ various approaches.\n\nYou’ll often find it is the ‘feelings’ part that is the\
    \ deciding factor.\n\n# Design Patterns\n\nIt can be hard work, this mapping behaviours\
    \ to different objects. Just like it is hard re-inventing a house from scratch,\
    \ for every house on a street.\n\nBy the mid-1990s, the object oriented world\
    \ had discovered the same thing. A lot of objects had the same kind of ‘shape’.\
    \ Just like houses on a street.\n\nTo understand what a pattern is, let’s come\
    \ at this in reverse. Imagine you’ve written an object that has three data fields:\n\
    \n*   A name\n*   A timestamp\n*   An amount\n\nThese are the secrets of your\
    \ class. Without overthinking, what’s the first thing that comes into your head\
    \ that this represents? No cheating, now! 3, 2, 1 … Go!\n\nI get:\n\n*   A line\
    \ item on a bill: “Rioja 125ml, 8.30pm, £2.95”\n*   A lease: “12 month rent of\
    \ 15A Acacia Avenue, 1 Jan 2020, £2,150”\n*   A membership: “Alan’s Geek Club\
    \ 1 year, 1 Jan 2020, £2,150”\n*   A discount code: “Xbox Live, expires 20 Oct\
    \ 2020, $79.99”\n\nThere are plenty more examples. Many different kinds of objects\
    \ share similar “shape”. By the mid-1990s, this had been learned, but from the\
    \ other around. The behaviours of a `Customer` were seen to be more less the same\
    \ as a `Member` object. Sure, there were specific. This is known as a `Design\
    \ Pattern`.\n\nObjects form `patterns` at the design level. Groups of objects\
    \ jump out as having similar in one subject area as they do in another. A pattern\
    \ gives us jump-start on our designs. We can start with something off the peg\
    \ and tailor it, rather than cutting cloth ourselves. And mangling our metaphors.\
    \ I do apologise.\n\nThe 1990s jumped on this idea with vigour. It gave rise to\
    \ several books, papers, and conferences. Some were good, some seminal, some were\
    \ rather forgettable.\n"
