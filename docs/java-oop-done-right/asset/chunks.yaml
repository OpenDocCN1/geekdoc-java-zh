  trans: "\n让我们为 `Item.print()` 方法添加“如何做”的细节。“终于了！”，你可能会这样想。但别急着庆祝太——它将为我们带来另一个设计挑战。让我们先做最简单的事情：\n\
    \n```\n 1 class Item {\n 2     private final String description;\n 3     private\
    \ final Money price ;\n 4 \n 5     public Item( String description, Money price\
    \ ) {\n 6         this.description = description;\n 7         this.price = price;\n\
    \ 8     }\n 9 \n10     public void print( Printer p ) {\n11         p.print(description);\n\
    12         p.print(\" \");\n13         price.print(p);\n14 \n15         p.newline();\n\
    16     }\n17 }\n```\n\n一个结果是我们需要为 `Printer` 添加一个 `newline()` 方法。它应该在下一次调用任何 `print()`\
    \ 方法时移动到下一行。\n\n你能看到我所谈论的设计决策吗？\n\n它是：“哪个对象应该负责知道如何在一行中格式化 Item？”\n\n这很棘手。这并不是一个困难的选择，但我们有替代方案需要考虑。\n\
    \n我上面采取的方法是将 `description` 打印为字符串，*假设*可以打印一个空格来分隔价格，然后将格式化价格的责任*委托*给 `Money` 对象。这意味着我们需要为\
    \ `Money` 添加一个 `print(Printer p)` 方法。\n\n这个方法知道 `Printer` 类，并且知道如何格式化一个适合打印的 `Money`\
    \ 对象。\n\n代码审查/结对时间：我们觉得怎么样？\n\n我不确定。\n\n对于一个简单的系统、一个概念验证，或者关于面向对象编程（OOP）书籍早期章节中的示例（咳咳），这足够了。它行得通。\n\
    \n然而，对我来说，它有许多代码异味：\n\n* 视觉格式化看起来将是错误的\n* 为什么 `Money` 要知道 `Printer`？以及为什么针对 `Printer`\
    \ 的特定格式化？\n* 为什么格式化一个 `Item` 的知识被分在两个类中？\n* 阅读代码并知道预期结果有多有多难？\n\nOOP 协作设计的真正核心就在此。到目前为止，一切一风风顺。但像这样的担忧——那些无法轻易映射到任何现有单一对象上的问题——正是我们必须停下来思考的地方。\n\
    \n目前有两种选择。我们可以继续进行。保持原样，稍后重新考虑该选择。或者我们现在改进结构。\n\n在现阶段很容易过度工程，添加我们永远不需要且也没有人能读懂的复杂功能和结构。后面的章节将介绍关于何时停止的观点。特别是，测试驱动开发（TDD）将积极限制我们每一步所做的更改量。YAGNI\
    \ 原则（“你不会需要它的”）有助于我们集中注意力。\n\n但现在，让我们利用这个机会修复它——通过另一次协作。像往常一样，行为优先，细节在后：\n\n```\n\
    \ 1 class Item {\n 2     private final String description;\n 3     private final\
    \ Money price ;\n 4 \n 5     public Item( String description, Money price ) {\n\
    \ 6         this.description = description;\n 7         this.price = price;\n\
    \ 8     }\n 9 \n10     public void print( Printer p ) {\n11         new ItemFormat(description,\
    \ price).print(p);\n12     }\n13 }\n```\n\n我们引入了一个负责为打印格式化 `Item` 对象的对象。我们为它提供了执行该工作所需的所有信息。一如既往，我们将细节留到稍后。该对象的第一个版本将是简单的重构。我们将之前的\
    \ `Item print` 方法的内部内容放入 `ItemFormat print` 方法中。然后我们稍后会对关于 `description`、`Printer`\
    \ 和 `Money` 之间谁做什么做什么做出详细决策。\n\n是时候为此构建一个小型测试应用了。首先，我们需要让我们的 `Printer` 类做点什么。我们将添加那个\
    \ `newline` 方法。我们还将决定使用控制台输出：\n\n```\n1 class Printer {\n2     public void print(String\
    \ text) {\n3         System.out.print(text);\n4     }\n5 \n6     public void newline()\
    \ {\n7         System.out.println();\n8     }\n9 }\n```\n\n填充 `Money` 类以包含 `print()`\
    \ 行为以及支持的“秘密知识”：\n\n```\n 1 class Money {\n 2     private final String amount\
    \ ;\n 3     private final String currency ;\n 4 \n 5     public Money( String\
    \ amount, String currency ) {\n 6         this.amount = amount;\n 7         this.currency\
    \ = currency;\n 8     }\n 9 \n10     public void print( Printer p ) {\n11    \
    \     p.print(currency);\n12         p.print(amount);\n13     }\n14 }\n```\n\n\
    Java 中真实的 `Money` 类将 `amount` 存储为 `BigDecimal`。这是一种固定精度、准确表示小数分数的方法——英镑和分。`float`\
    \ 和 `double` 类型永远不会被使用，因为它们用空间换取精度。`float` 中的金额越高，存储的值就越不准确。这对银行非常糟糕。\n\n我们对 `ItemFormat`\
    \ 的第一次尝试来自于我们简单的重构：\n\n```\n 1 class ItemFormat {\n 2     private final Money\
    \ price ;\n 3     private final String description ;\n 4 \n 5     public ItemFormat(\
    \ String description, Money price ) {\n 6         this.description = description;\n\
    \ 7         this.price = price;\n 8     }\n 9 \n10     public void print( Printer\
    \ p ) {\n11         p.print(description);\n12         p.print(\" \");\n13    \
    \     price.print(p);\n14     }\n15 }\n```\n\n添加一个演示应用：\n\n```\n1 class ReceiptDemo\
    \ {\n2     public static void main(String[] commandArgs) {\n3         new ReceiptDemo().run();\n\
    4     }\n5 \n6     private void run() {\n7         Receipt r = new Receipt( new\
    \ Printer() );\n8 \n9         r.add(\"Brie\", new Money(\"1.95\", \"GBP\"));\n\
    10         r.add(\"Tiger Bread\", new Money(\"0.95\", \"GBP\"));\n11         r.add(\"\
    Merlot\", new Money(\"7.95\", \"GBP\"));\n12 \n13         r.print();\n14     }\n\
    15 }\n```\n\n并运行它查看：\n\n```\n1 Brie1.95\n2 Tiger Bread0.95\n3 Merlot7.95\n```\n\
    \n## 设计回顾\n\n让我们回顾一下设计。我们从对象的行为开始。设计由行为驱动。这些行为通过内部隐藏知识（`price`、`description`）和隐藏算法（`items.forEach()`\
    \ 和 `ItemFormat print()`）得到支持。\n\n等等，我需要包含 `Receipt` 类：\n\n```\n1 class Receipt\
    \ {\n2     private final Printer printer;\n3     private final List<Item> items\
    \ = new ArrayList<>();\n4 \n5     public Receipt(Printer printer) {\n6       \
    \  this.printer = printer;\n7     }\n8 \n9     public void add(Item item) {\n\
    10        items.add(item);\n11    }\n12 \n13    public void print() {\n14    \
    \    for (Item item : items) {\n15            item.print(printer);\n16       \
    \     printer.newline();\n17        }\n18    }\n19 }\n```\n\n### 练习：总金额\n\n一个新的需求以敏捷用户故事的形式出现：\n\
    \n* 作为客户\n* 我想看到总价\n* 这样我就知道需要付多少钱\n\n我们如何从行为开始驱动这一切片？\n\n*提示：* 将 `Money.amount`\
    \ 字段改为 `BigDecimal`。避免在 `Money` 中添加 `getAmount()` 方法的诱惑。思考 `Money` 对象如何与另一个对象协作，该对象负责跟踪总额并在我们的\
    \ `Printer` 对象上打印它。\n"
- fmt: "\nWe’ve seen how OOP is all about making calling code simple and hiding details\
    \ inside methods. We build up a set of objects that collaborate with each other,\
    \ using only those public methods. We’ve learned to design the behaviour methods\
    \ first, add any needed private data, then add a constructor last. We design from\
    \ the outside of an object in.\n\nWhat if we could find a way to help us remember\
    \ to do things in that order - and `run` the software, even before it’s all finished?\n\
    \nTest Driven Development (TDD) is a way of doing just that.\n\nTDD helps us get\
    \ the design right. It forces us to think about how our object methods look to\
    \ callers before writing any internal code.\n\nTDD proves that our logic works\
    \ as expected. We call a method, capture the output and compare it to an expected\
    \ value.\n\nIn short, it’s pretty much magic. And you should definitely use it.\n\
    \nTDD also provides a way to prove out that our object works correctly with its\
    \ collaborators even before we write them. But we’ll need to cover ‘polymorphism’\
    \ in a later chapter before we attempt that.\n\nLet’s start with the basics. How\
    \ do we get started with TDD? How does it help?\n\n## Outside-in design with TDD\n\
    \nTDD helps us design the public interface of our objects to be easy to use.\n\
    \nThe key is to write code that calls our object using what we think will be a\
    \ good public interface. We do this `before` writing code inside our object. This\
    \ forces us to think about making the calling code simple. Our ‘backwards thinking’\
    \ of OOP again.\n\nThis piece of code is known as the test code. It will set up\
    \ our object, call a behavioural method on it, and then check whether that method\
    \ worked or not.\n\nThis test does two things for us:\n\n* verifies the behaviour\
    \ is correct\n* verifies the call is easy to make - a hallmark of good design\n\
    \nIf our design is hard to set up or hard to use, we’ll see that in hard to read\
    \ test code.\n\nJava projects use the wonderful `JUnit` test framework to help\
    \ out with this. I like to add `AssertJ` to help with the checking part. \n\n\
    Let’s use TDD to build a little calculator that can add up our restaurant bill.\
    \ As you follow along, notice the `rhythm` of TDD - write a bit of test, see a\
    \ failure, fix it with a bit of code, repeat.\n\nOur calculator class should do\
    \ two things:\n\n* give us a running total of all the items we’ve added\n* add\
    \ another item.\n\nWe start by writing an empty test. We want this test to prove\
    \ something that will be true of our `BillCalculator` class as soon as we create\
    \ it. If we create this object and don’t add any items to it, the total must be\
    \ zero.\n\nLet’s start to write a test for that.\n\n### First test: total starts\
    \ at zero\n\n```java\nclass BillCalculatorTest {\n    @Test\n    public void totalStartsAtZero()\
    \ {\n        // ... todo\n    }\n}\n```\n\nWe’ve got a test class and a test harness\
    \ method all named for what they do.\n\nNow we do a tiny step of design for our\
    \ object. We want to be able to access the latest running total. For this, despite\
    \ all my bleating in previous chapters, a `getTotal()` method seems like the simplest,\
    \ most clear design.\n\nLet’s add this design decision to the test:\n\n```java\n\
    class BillCalculatorTest {\n    @Test\n    public void totalStartsAtZero() {\n\
    \        // Act\n        float total = calculator.getTotal();\n    }\n}\n```\n\
    \nThe compiler will be loudly complaining at this point, as indeed might you if\
    \ this is your first TDD session: “There isn’t any object yet!”\n\nQuite right.\
    \ Let’s fix that.\n\nUsing your IDE shortcuts, create a new Class called `BillCalculator`:\n\
    \n```java\nclass BillCalculator {\n}\n```\n\nNow, we can fix the first of our\
    \ compiler’s many complaints and create a calculator object:\n\n```java\nclass\
    \ BillCalculatorTest {\n    @Test\n    public void totalStartsAtZero() {\n   \
    \     // Arrange\n        var calculator = new BillCalculator();\n\n        //\
    \ Act\n        float total = calculator.getTotal();\n    }\n}\n```\n\nI’m using\
    \ the `var` keyword from recent Java editions (don’t ask me which one; I never\
    \ was a language lawyer kind of guy). I think this reads very clearly here.\n\n\
    The compiler will grudgingly accept we are now not complete idiots and remove\
    \ the red X from under `calculator`. It will then move on to its next complaint.\
    \ We need to add the `getTotal()` method.\n\nLet the IDE shortcuts do this, because\
    \ the IDE has all the information it needs to get it right:\n\n```java\nclass\
    \ BillCalculator {\n    public float getTotal() {\n        return 0.0;\n    }\n\
    }\n```\n\nI love working backwards like this. The IDE has enough information to\
    \ do most of the grunt work and not make as many typing mistakes as I do. It’s\
    \ also a very fast way to work once you get into the rhythm of it. You even look\
    \ (to the clueless) like a `10x mega ninja rock star programmer`.\n\nAnyway. The\
    \ compiler will be happy, allowing us to add our check that everything is ok.\
    \ We’ll use the wonderful `AssertJ` library to provide the `assertThat` method.\n\
    \n```java\nclass BillCalculatorTest {\n    @Test\n    public void totalStartsAtZero()\
    \ {\n        // Arrange\n        var calculator = new BillCalculator();\n\n  \
    \      // Act\n        float total = calculator.getTotal();\n\n        // Assert\n\
    \        assertThat(total).isZero();\n    }\n}\n```\n\nWe can run this test -\
    \ and it will pass! Our calculator object has passed its first and only test.\n\
    \n## Arrange, Act, Assert - a rhythm inside each test\n\nNotice how writing our\
    \ code by first resulted in the test having three sections. We first decided on\
    \ the behavioural method and added a call to it. This is known as the `act` step\
    \ - where we take action.\n\nWe also decided what that method should return. This\
    \ means we know how to test it by comparing it to an expected value. This is the\
    \ `assert` step - we make an assertion about the output.\n\nAnd finally, we’re\
    \ going to need an object to test! This is the `arrange` step, where we make all\
    \ necessary arrangements for the test to begin. Every test we write has this rhythm:\
    \ Arrange, Act, Assert.\n\n## Red, Green, Refactor - a rhythm between tests\n\n\
    After writing our first test, we can get on to the real meat of development. We\
    \ iteratively add features to our code one test at a time. Before we do, TDD has\
    \ one extra rhythm to guide us: Red, Green, Refactor.\n\n**Arrange, Act, Assert**\
    \ guides us inside inside a test, helping us write clean test code and remember\
    \ all the required pieces.\n\n**Red, Green, Refactor** helps us discover *emergent\
    \ design*. It happens between tests.\n\nThe rhythm goes like this.\n\nA `red`\
    \ test means we have written a test which fails. This gets us running code quickly.\
    \ It proves that the test is working; it correctly reports that the code we have\
    \ not yet written is not yet working.\n\nWe follow the Arrange, Act, Assert process\
    \ to get to a `green` test. At this point, we have added just enough production\
    \ code to make the test pass. In one sense, the code is finished.\n\nIf we continue\
    \ working this way, I guarantee you will end up with a giant mass of unreadable\
    \ spaghetti. Quite often, the process of TDD takes the blame for this, when it\
    \ hasn’t been done right. It’s because we’ve missed a step. That missing step\
    \ is `Refactor`.\n\nRefactoring is where we look at our code and improve its design\
    \ - without changing how it works. We change the structure, not the behaviour.\n\
    \nThe best book on this by far is “Refactoring: Improving the design of existing\
    \ code” by Martin Fowler. The first edition has Java examples and is the one to\
    \ read. I really recommend that you do.\n"
