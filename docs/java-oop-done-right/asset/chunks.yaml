  trans: "\n\n```java\nclass UserMetrics {\n    void ageLessThan25();\n    void age25To35()\n\
    \    void age35Up();\n\n    void premiumSubscriber();\n    void inactive90days();\n\
    \n    void display( Display d );\n}\n```\n\n`UserMetrics` 是一个收集参数类，可以传递给多个 `User`\
    \ 对象。`User` 对象会调用相关的 `ageXXX()` 方法来收集年龄统计数据，并将该群体中相关用户的总数加 1。它还会根据情况调用 `premiumSubscriber()`\
    \ 和 `inactive90days()`。这些都是我们决定想要更改的销售管道目标，因此我们需要对它们进行测量。\n\n我们像下面将其传递给 `Users`：\n\
    \n```java\nclass Users {\n    private final users List<User> users = new ArrayList<>();\n\
    \n    public void add( User u ) {\n        users.add( u );\n    }\n\n    public\
    \ void collect(UserMetrics metrics) {\n        users.forEach(user->user.reportMetrics(metrics));\n\
    \    }\n}\n```\n\n我们调用 `Users.collect()`，传入一个 `UserMetrics` 对象的实例，它就会被填充。之后，我们就可以显示这些指标。\n\
    \n这种技术被用于各种场合。总计、报告、摘要、物料清单、库存。这是一种非常有用的技术。它是“访问者”模式（Visitor）的简化版本。\n\n示例：管理报告、升级项目、订单、总计、通用数据处理。\n\
    \n## 项目-项描述 (Item-Item Description)\n\n[Coad] 将实体与其描述分离\n\n这种非常实用的模式在电子商务中经常出现。\n\
    \n你有一个 `Thing` —— 产品、服务、报价、电影、歌曲——任何东西都可以。`Thing` 需要一个描述才能放入目录中。\n\n`Thing` 在逻辑上与它的描述是不同的。你可以讨论要买多少份《安德罗梅达菌株》电影。你也可以讨论这部电影是谁导演的，是谁写的。这两者是两个不同的视角，因此将它们分开是有意义的。\n\
    \n```java\nclass MovieDescription {\n    void displayTitle(Display d){...}\n \
    \   void displaySynopsis(Display d){...}\n    void chargePriceToAccount(Account\
    \ a){...}\n}\n\nclass Movie {\n    private final MovieDescription description\
    \ ;\n\n    public Movie(MovieDescription description) {\n        this.description\
    \ = description;\n    }\n\n    void buy(Account a){...}\n}\n```\n\n示例：目录、媒体收藏、产品、法律格式文件、电子商务、分类广告、优惠券\n\
    \n## 瞬间-间隔 (Moment-Interval)\n\n[Coad] 捕捉从开始到结束的时间段\n\n`Moment-Interval` 代表一个由开始时间和结束时间定义的时间段。行为可以是通用的\
    \ —— 比如 `boolean isAfter(time)`、`boolean wasBefore(time)` —— 可以是特定特定的。\n\n时间范围在许多领域都非常重要。租赁协议、租赁、有效性检查、访问控制窗口都受到时间限制。`Moment-Interval`\
    \ 为我们提供了一种整洁的方式来建模它们。\n\n```java\nclass SubscriptionPeriod {\n    private final\
    \ Date start ;\n    private final Date end ;\n\n    public SubscriptionPeriod(\
    \ Date start, Date end ) {\n        this.start = start;\n        this.end = end;\n\
    \    }\n\n    public void applyTo( Subscription s, Date now ) {\n        if (\
    \ now.isAfter(start) && end.isAfter(now) ) {\n            s.subscriptionActive();\n\
    \        }\n        else {            \n            s.subscriptionExpired();\n\
    \        }\n    }\n}\n\nclass Subscription {\n    private SubscriptionPeriod period\
    \ ;\n\n    public void renew(Period p) {\n        this.period = p ;\n    }\n\n\
    \    public void provideService( Date now ) {\n        period.applyTo( this );\n\
    \    }\n\n    public void subscriptionExpired() {\n        // 过期时的操作\n    }\n\n\
    \    public void subscriptionActive() {\n        // 激活时的操作\n    }\n}\n```\n\n\
    软件即服务 (SaaS) 业务租用固定时间的访问权限。你可以使用它们的时间范围从我们收到付款的那刻开始，直到未来的某个点，通常取决于你支付的金额。\n\n\
    上面的 `Subscription` 代表一个受时间限制的服务。调用带有当前时间的 `provideService()` 方法将将其委托给 `Period`\
    \ 对象。\n\n这就是我们的 `Moment-Interval` 模式对象。\n\n它将检查当前时间是否在它的限制范围内。如果在这些限制范围内，它将回调\
    \ `Subscription` 的激活状态，触发 `subscriptionActive()` 方法。这将提供已付费的服务。\n\n如果订阅已过期，`Period`\
    \ 将回调 `subscriptionExpired()`，然后可以尝试让用户续订订阅。如果他们这样做了，`Subscription` 方法 `renew()`\
    \ 将被调用，并传入更新后的 `Period`。\n\n## 时钟 (Clock)\n\n[Own] 提供一种可以被桩（stub）的表示当前时间的方法\n\n\
    时间是一个依赖项，增加了测试的复杂度，因为它不断变化。如果你直接使用系统时，很难编写依赖于特定时间的测试。\n\n我们需要一个当前时间的抽象，允许我们在测试中对时钟进行桩。这个\
    \ `Clock` 接口如下：\n\n```java\ninterface Clock {\n    Date now();\n}\n```\n\n在生产环境中，我们使用封装了系统时的实现：\n\
    \n```java\nclass SystemClock implements Clock {\n    public Date now() {\n   \
    \     return new Date();\n    }\n}\n```\n\n对于测试，我们提供了一个桩类，允许我们控制时间：\n\n```java\n\
    class StubClock implements Clock {\n    private Date date ;\n\n    public Date\
    \ now() {\n        return date ;\n    }\n\n    public void setTo( Date d ) {\n\
    \        this.date = d;\n    }\n\n    public void oneHourLater() {\n        //\
    \ 向后移动一小时的代码\n    }\n\n    public void oneHourEarlier() {\n        // 向前移动一小时的代码\n\
    \    }\n}\n```\n\n通过将 `Clock` 注入到需要它的类中，我们可以使测试具有确定性并且更容易理解。\n\n## 规则（或策略） (Rules\
    \ or Policy)\n\n[Own] 在单处应用一组规则\n\n规则是你想要自动化的许多业务流程的一部分。诸如申请抵押、验证用户账户或检查消息是否为垃圾邮件，都有一套规则需要应用。\n\
    \n在许多情况下，这些规则散落在系统的某个地方处。\n\n为了清晰起见，将所有规则提取到一个对象中通常是有好处的。这让我们有了将规则对象视为策略模式（Strategy\
    \ pattern）的可能性。这提供了可插的规则。\n\n一个示例是使用分段税率系统从给定金额计算税费。\n\n假设 10,000 以下支付零税。在 10,000\
    \ 到 30,000 之间支付 20%。超过部分支付 40%。不要太看这些数字；我希望我作为一个开发人员比财政大臣更出色。\n\n这里是使用规则书模式（Rulebook\
    \ pattern）实现此功能的一种方法：\n\n"
- fmt: "\n```java\nclass TaxBand {\n    private final Money lowerLimit ;\n    private\
    \ final Money upperLimit ;\n    private final BigDecimal percentage ;\n\n    public\
    \ TaxBand(Money lowerLimit, \n                   Money upperLimit, \n        \
    \           BigDecimal percentage) {\n        this.lowerLimit = lowerLimit ;\n\
    \        this.upperLimit = upperLimit ;\n        this.percentage = percentage\
    \ ;\n    }\n\n    public void apply( Money amount, Money totalTax ) {\n      \
    \  if ( amount.atOrAbove(threshold) ) {\n            totalTax.add( calculateTax(amount)\
    \ );\n        }\n    }\n\n    private Money calculateTax( Money amount ) {\n \
    \       Money taxableAmount = amount.subtract( lowerLimit );\n        return taxableAmount.multiply(\
    \ percentage );\n    }\n}\n```\n\nThis is a `Rules` object. You call `apply()`\
    \ with the amount to calculate tax on and pass in a `CollectingParameter` to collect\
    \ the total tax.\n\nEach `TaxBand` object is constructed with the secrets it needs\
    \ to apply that specific rule.\n\nIn this design, `TaxBand` objects are chainable.\
    \ We could either add a method `chain(TaxBand next)` - internally forming a linked\
    \ list of `Tax Bands` - or create an `Aggregate` object called `TaxBands`. Both\
    \ read well in this case, so take your pick. I have a slight preference for the\
    \ Aggregate approach. It separates the concerns of ‘one’ and ‘many’ more fully.\n\
    \nIn many systems, rules are configurable. A rule to limit screen time might be\
    \ configured with a maximum duration. This is often done as a simple variable\
    \ set by configuration.\n\nRules objects are really useful when the `behaviour`\
    \ itself has to be configured, rather than just some threshold value.\n\nExamples:\
    \ Access Control, retention policies, business process rules.\n\n## Aggregate\n\
    \n[DDD] Represents a group of objects and the behaviours that apply to all\n\n\
    `Aggregate` objects were covered in an earlier chapter. Class `User` represents\
    \ one user. Class `Users` represents a group of them.\n\nThey wrap a collection\
    \ of single objects. Behaviours are the ones common to group operations. Methods\
    \ operate on all objects in the collection.\n\n## Cache\n\nSpeeds access to an\
    \ object that is slow or expensive to fetch\n\nMany systems end up fetching data\
    \ from somewhere else, often a database or a web service. These things live at\
    \ the other end of a network connection. That makes fetching data five or six\
    \ orders of magnitude slower than it would be if it was inside a local object.\n\
    \nWe can’t simply avoid calling that remote data. That’s where the data actually\
    \ lives, like it or not.\n\nWhat we can do is make that remote call as infrequently\
    \ as possible. We do this by keeping an up-to-date copy of it as a local object.\n\
    \n`Cache` is the name we give to this idea. A simple cache is a map of objects\
    \ most recently used:\n\n```java\ninterface UserRepository {\n    User findUserById(\
    \ String userId );\n}\n\nclass UserCache implements UserRepository {\n    private\
    \ final Map<String, User> cache = new HashMap<>();\n    private final UserRepository\
    \ repository ;\n\n    public UserCache( UserRepository r ) {\n        this.repository\
    \ = r\n    }\n\n    public User findUserById( String userId ) {\n        if (\
    \ cache.containsKey( userId ) ) {\n            return cache.get( userId );\n \
    \       }\n\n        User user = repository.findByUserId( userId );\n        cache.put(\
    \ userId, user );\n        return user;\n    }\n}\n```\n\nThis is actually a ‘buy\
    \ one get two free’ of design patterns: a `Repository`, `Decorator` and a `Cache`.\
    \ We even have some LSP thrown in. Let’s explain those one at a time to see why\
    \ they are a perfect match here.\n\nThe `Cache` part is the `HashMap` called `cache`.\n\
    \nThis is used to store users in a simple lookup table, against their `userId`.\
    \ Given a `userId`, we can check the `cache` variable to see if we already have\
    \ the relevant `User` object stored in there. The first three lines of method\
    \ `findUserById()` do that. If the `User` exists in our cache, we return that.\n\
    \nThis is the key benefit of the cache - we return straight away with a local\
    \ object. We avoid that slow round trip to the `UserRepository`.\n\nIf the `User`\
    \ is not present in the cache, that must mean we haven’t asked for that `userId`\
    \ before. So, we go off to the `UserRepository`. We fetch the `User` object, store\
    \ it into the `cache`, then return it. The next time we ask for this `userId`,\
    \ it will be returned from the cache.\n\nCaches are very commonly used to speed\
    \ up slow operations. `Repositories` and External Systems typically benefit from\
    \ a `Cache`.\n\nThat said, they are difficult to design right.\n\nOur simple example\
    \ has two serious problems:\n\n- **No updates**: We never fetch updates to a cached\
    \ `User`.\n- **No eviction**: Users are cached forever. Memory will run out.\n\
    \nThese two issues are part of `cache invalidation`, the act of marking a cached\
    \ item as no longer valid.\n\nReal caches get increasingly complex to handle this\
    \ in production.\n\nYou often see an associated `Rules` pattern object to describe\
    \ when to clear out the cache. Popular choices are Least Recently Used (LRU) which\
    \ requires a timestamp being stored alongside the cached object and the simpler\
    \ Most Recent cache, where we only make space to cache the last N items.\n\nThey\
    \ say there are four hard things in computing: Concurrency, Cache Invalidation\
    \ and off-by-one errors …As for the other two patterns, we are using `Repository`\
    \ to abstract away how we store User objects. We’ve covered this before.\n\nWe\
    \ are also using `Decorator` pattern, first mentioned in [GoF] Gang of Design\
    \ Patterns book. That’s a useful pattern worth breaking out into its own section.\
    \ Let’s do that next.\n\n## Decorator\n\n[GoF] Add features to an object in a\
    \ substitutable way\n\n`Decorator` gives us a way to add features to a class without\
    \ altering that class. It is a wrapper for that class, similar to `Adapter`. It\
    \ differs from `Adapter` because the new class can be substituted for the original\
    \ one. It is fully LSP compliant.\n\nThis means that calling code can be fed either\
    \ the original class or the decorated one and not have to change.\n\nIn the explanation\
    \ of the Cache pattern, we used a Decorator around a Repository object for this\
    \ very reason:\n\n```java\ninterface UserRepository {\n    User findUserById(\
    \ String userId );\n}\n\nclass UserCache implements UserRepository {\n    private\
    \ final UserRepository repository ;\n\n    public UserCache( UserRepository r\
    \ ) {\n        this.repository = r\n    }\n\n    public User findUserById(String\
    \ userId) {\n        // Extra functionality goes here\n\n        User user = repository.findByUserId(\
    \ userId );\n\n        // Extra functionality goes here\n        return user;\n\
    \    }\n}\n```\n\nThis is the same code example but with just the parts relating\
    \ to `Decorator` left in. The functions relating to the Cache have been removed\
    \ as they are not part of the Decorator pattern itself. That’s much simpler.\n\
    \nThe tell-tale signs of this being a `Decorator` are the constructor which takes\
    \ a `UserRepository` object, and the class which implements the `UserRepository`.\n\
    \nIt is both substitutable for a `UserRepository` and yet has access to one itself\
    \ - always a different object instance. Here, you could imagine we have `MySqlUserRepository`\
    \ as an instance to pass into `UserCache`. The end repository is itself substitutable.\n\
    \nThis object allows us to decorate our `UserRepository` to give it extra functionality.\
    \ Here, it is to work with a hash map to locally cache the User objects. Only\
    \ if we do not have them locally do we go further out to our ‘real’ `UserRepository`.\n\
    \nOther common uses for Decorator are to implement access control to the decorated\
    \ object, or logging. Logging is critical in production systems. It is the only\
    \ way you can monitor that your system is working - and diagnose what happened\
    \ when it falls over at two in the morning.\n"
  raw: "```\n 1 class TaxBand {\n 2     private final Money lowerLimit ;\n 3     private\
    \ final Money upperLimit ;\n 4     private final BigDecimal percentage ;\n 5 \n\
    \ 6     public TaxBand(Money lowerLimit, \n 7                    Money upperLimit,\
    \ \n 8                    BigDecimal percentage) {\n 9         this.lowerLimit\
    \ = lowerLimit ;\n10         this.upperLimit = upperLimit ;\n11         this.percentage\
    \ = percentage ;\n12     }\n13 \n14     public void apply( Money amount, Money\
    \ totalTax ) {\n15         if ( amount.atOrAbove(threshold) ) {\n16          \
    \   totalTax.add( calculateTax(amount) );\n17         }\n18     }\n19 \n20   \
    \  private Money calculateTax( Money amount ) {\n21         Money taxableAmount\
    \ = amount.subtract( lowerLimit );\n22         return taxableAmount.multiply(\
    \ percentage );\n23     }\n24 }\n```\n\nThis is a Rules object. You call apply()\
    \ with the amount to calculate tax on and pass in a CollectingParameter to collect\
    \ the total tax.\n\nEach TaxBand object is constructed with the secrets it needs\
    \ to apply that specific rule.\n\nIn this design, TaxBand objects are chainable.\
    \ We could either add a method chain(TaxBand next) - internally forming a linked\
    \ list of Tax Bands - or create an Aggregate object called TaxBands. Both read\
    \ well in this case, so take your pick. I have a slight preference for the Aggregate\
    \ approach. It separates the concerns of ‘one’ and ‘many’ more fully.\n\nIn many\
    \ systems, rules are configurable. A rule to limit screen time might be configured\
    \ with a maximum duration. This is often done as a simple variable set by configuration.\n\
    \nRules objects are really useful when the *behaviour* itself has to be configured,\
    \ rather than just some threshold value.\n\nExamples: Access Control, retention\
    \ policies, business process rules\n\n## Aggregate\n\n[DDD] Represents a group\
    \ of objects and the behaviours that apply to all\n\nAggregate objects were covered\
    \ in an earlier chapter. Class User represents one user. Class Users represents\
    \ a group of them.\n\nThey wrap a collection of single objects. Behaviours are\
    \ the ones common to group operations. Methods operate on all objects in the collection.\n\
    \n## Cache\n\nSpeeds access to an object that is slow or expensive to fetch\n\n\
    Many systems end up fetching data from somewhere else, often a database or a web\
    \ service. These things live at the other end of a network connection. That makes\
    \ fetching data five or six orders of magnitude slower than it would be if it\
    \ was inside a local object.\n\nWe can’t simply avoid calling that remote data.\
    \ That’s where the data actually lives, like it or not.\n\nWhat we can do is make\
    \ that remote call as infrequently as possible. We do this by keeping an up-to-date\
    \ copy of it as a local object.\n\nCache is the name we give to this idea. A simple\
    \ cache is a map of objects most recently used:\n\n```\n 1 interface UserRepository\
    \ {\n 2     User findUserById( String userId );\n 3 }\n 4 \n 5 class UserCache\
    \ implements UserRepository {\n 6     private final Map<String, User> cache =\
    \ new HashMap<>();\n 7     private final UserRepository repository ;\n 8 \n 9\
    \     public UserCache( UserRepository r ) {\n10         this.repository = r\n\
    11     }\n12 \n13     public User findUserById( String userId ) {\n14        \
    \ if ( cache.containsKey( userId ) ) {\n15             return cache.get( userId\
    \ );\n16         }\n17 \n18         User user = repository.findByUserId( userId\
    \ );\n19         cache.put( userId, user );\n20         return user;\n21     }\n\
    22 }\n```\n\nThis is actually a ‘buy one get two free’ of design patterns: a Repository,\
    \ Decorator and a Cache. We even have some LSP thrown in. Let’s explain those\
    \ one at a time to see why they are a perfect match here.\n\nThe Cache part is\
    \ the HashMap called cache.\n\nThis is used to store users in a simple lookup\
    \ table, against their userId. Given a userId, we can check the cache variable\
    \ to see if we already have the relevant User object stored in there. The first\
    \ three lines of method findUserById() do that. If the User exists in our cache,\
    \ we return that.\n\nThis is the key benefit of the cache - we return straight\
    \ away with a local object. We avoid that slow round trip to the UserRepository.\n\
    \nIf the User is not present in the cache, that must mean we haven’t asked for\
    \ that userId before. So, we go off to the UserRepository. We fetch the User object,\
    \ store it into the cache, then return it. The next time we ask for this userId,\
    \ it will be returned from the cache.\n\nCaches are very commonly used to speed\
    \ up slow operations. Repositories and External Systems typically benefit from\
    \ a Cache.\n\nThat said, they are difficult to design right.\n\nOur simple example\
    \ has two serious problems:\n\n*   **No updates** We never fetch updates to a\
    \ cached User\n\n*   **No eviction** Users are cached forever. Memory will run\
    \ out\n\nThese two issues are part of *cache invalidation*, the act of marking\
    \ a cached item as no longer valid.\n\nReal caches get increasingly complex to\
    \ handle this in production.\n\nYou often see an associated Rules pattern object\
    \ to describe when to clear out the cache. Popular choices are Least Recently\
    \ Used (LRU) which requires a timestamp being stored alongside the cached object\
    \ and the simpler Most Recent cache, where we only make space to cache the last\
    \ N items.\n\nThey say there are four hard things in computing: Concurrency, Cache\
    \ Invalidation and off-by-one errors …\n\nAs for the other two patterns, we are\
    \ using Repository to abstract away the details of how we store User objects.\
    \ We’ve covered this before.\n\nWe are also using the Decorator pattern, first\
    \ mentioned in the [GoF] Gang of Four Design Patterns book. That’s a useful pattern\
    \ worth breaking out into its own section. Let’s do that next.\n\n## Decorator\n\
    \n[GoF] Add extra features to an object in a substitutable way\n\nDecorator gives\
    \ us a way to add features to a class without altering that class. It is a wrapper\
    \ for that class, similar to an Adapter. It differs from Adapter because the new\
    \ class can be substituted for the original one it wraps. It is fully LSP compliant.\n\
    \nThis means that calling code can be fed either the original class or the decorated\
    \ one and not have to change.\n\nIn the explanation of the Cache pattern, we used\
    \ a Decorator around a Repository object for this very reason:\n\n```\n 1 interface\
    \ UserRepository {\n 2     User findUserById( String userId );\n 3 }\n 4 \n 5\
    \ class UserCache implements UserRepository {\n 6     private final UserRepository\
    \ repository ;\n 7 \n 8     public UserCache( UserRepository r ) {\n 9       \
    \  this.repository = r\n10     }\n11 \n12     public User findUserById(String\
    \ userId) {\n13         // Extra functionality goes here\n14 \n15         User\
    \ user = repository.findByUserId( userId );\n16 \n17         // Extra functionality\
    \ goes here\n18         return user;\n19     }\n20 }\n```\n\nThis is the same\
    \ code example but with just the parts relating to Decorator left in. The functions\
    \ relating to the Cache have been removed as they are not part of the Decorator\
    \ pattern itself. That’s much simpler.\n\nThe tell-tale signs of this being a\
    \ Decorator are the constructor which takes a UserRepository object, and the class\
    \ which implements the UserRepository.\n\nIt is both substitutable for a UserRepository\
    \ and yet has access to one itself - always a different object instance. Here,\
    \ you could imagine we have MySqlUserRepository as an instance to pass into UserCache.\
    \ The end repository is itself substitutable.\n\nThis object allows us to decorate\
    \ our UserRepository to give it extra functionality. Here, it is to work with\
    \ a hash map to locally cache the User objects. Only if we do not have them locally\
    \ do we go further out to our ‘real’ UserRepository.\n\nOther common uses for\
    \ Decorator are to implement access control to the decorated object, or logging.\
    \ Logging is critical in production systems. It is the only way you can monitor\
    \ that your system is working - and diagnose what happened when it falls over\
    \ at two in the morning."
