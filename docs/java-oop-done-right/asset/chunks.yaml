  trans: "\n让我们从该特定类型的经典案例中学习。\n\n## 鸟类扩展动物\n\n每当我在示例中看到 `class Animal` 时，我都会翻个白眼，就像在恐怖电影里看到死胡同一样。\n\
    \n以下是问题是如何演展开的。我们从一个拥有 `eat()` 和 `makeNoise()` 方法的 `Animal` 基类开始。我们添加一个 `Dog`\
    \ 子类。然后添加一个 `Bird` 子类，并增加一个 `fly()` 方法。接着添加两个 `Bird` 的子类，传统上 `Sparrow` 和 `Dodo`。`Dodo`\
    \ 不会飞，所以我们可能在 `Dodo.fly()` 中抛出异常或者什么都不做。\n\n这一团混乱的代码看起来是：\n\n```\n 1 abstract\
    \ class Animal {\n 2     abstract void eat();\n 3     abstract void makeNoise();\n\
    \ 4 }\n 5 \n6 class Dog extends Animal {\n 7     void eat() {\n 8         System.out.println(\"\
    Meat\");\n 9     }\n10 \n11     void makeNoise() {\n12         System.out.println(\"\
    Woof\");\n13     }\n14 }\n15 \n16 abstract class Bird extends Animal {\n17   \
    \  abstract void fly();\n18 }\n19 \n20 class Sparrow extends Bird {\n21     void\
    \ eat() {\n22         System.out.println(\"Seeds\");\n23     }\n24 \n25     void\
    \ makeNoise() {\n26         System.out.println(\"Cheep cheep\");\n27     }\n28\
    \ \n29     void fly() {\n30         System.out.println(\"Flap flap\");\n31   \
    \  }\n32 }\n33 \n34 \n35 class Dodo extends Bird {\n36     void eat() {\n37  \
    \       System.out.println(\"Nothing, extinct\");\n38     }\n39 \n40     void\
    \ makeNoise() {\n41         System.out.println(\"No sound, extinct\");\n42   \
    \  }\n43 \n44     void fly() {\n45         throw new UnsupportedOperationException(\"\
    error: cannot fly\");\n46     }\n47 }\n```\n\n这里有几个地方是错误的，调用代码很快就会暴露。奇怪的是，那些“面向对象已死”的示例从未包含过单元测试或调用代码，不是吗？真搞笑，这……\n\
    \n关键问题在于我们在 `Dodo` 中继承该方法时，破坏了 `Bird.fly()` 的合约。\n\n`Dodo` 不会飞，所以预期的合约“让它飞起来”无法满足。\n\
    \n这是对继承的误用——技术上来说是对静态类型的误用，错误地建模了不存在的行为。它违反了 LSP（里氏替换原则）。我们知道，当 LSP 将被破坏时，不应该使用继承。这并不合适。\n\
    \n这是一个问题，但这些文章通常完全忽略了更重要的一点。为什么 `Bird` 要派自 `Animal`？它们之间并没有许多共同用例。\n\n回想我们如何正确这样做。我们从外向内开始，设计我们希望对象拥有的行为。如果我们以多态的方式处理对象，就要确保所有对象都能响应相同的方法。\n\
    \n这种情况下呢？完全不可能那样行通。\n\n考虑一下调用代码对多态需要什么。它想要使用一些 `Base` 类。如果它使用 `Animal`，那么 `Bird`\
    \ 就不存在——调用代码永远看不见 `Bird`，只有 `Animal`。你不能在 `Animal` 上调用 `fly()`。如果它使用 `Bird`，那么\
    \ `Animal` 就*不需要*存在。`Bird` 只需要有三个方法 `eat()`、`makeNoise()` 和 `fly()`。你可以简单地将这些放入一个\
    \ `Bird` 接口中，调用代码并不是否涉及 `Animal`。\n\n`Animal` 或 `Bird` 都不是此场景的良好基类。然而，我们却在这里自豪地展示一个由无用基类组成的继承树，并在一篇说\
    \ OOP 不灵的文章中。干得好。我很喜欢你们的作品……\n\n被忽略的根本问题是，你无法以“告知而非提问”（Tell-Don’t-Ask）的多态风格调用这些任何内容。你必须知道你手里是一个\
    \ `Animal`、`Bird` 还是一个 `Dodo`——然后记住永远不要调用 `fly()`。\n\nOOP 中多态的整个优势都被忽视了。\n\n只有当类在调用代码中是\
    \ LSP 可替换的时，继承才有用。如果调用代码必须通过 `instanceof` 来弄清楚它正在处理的是什么类，那么你并没有做 OOP。它比用一堆 `if`\
    \ 语句和一个大过程好不到哪去。\n\n通常的做法是将事物存储为 `Animals` 并使用 `instanceof` 判断它们是否是 `Bird` 的不同抽象。呃，不用了。\n\
    \n那么，我们该如何解决这个混乱局面呢？\n\n我们只需接受我们在这种抽象上走错了路。\n\n回归基础。我们试图建模的对象行为是 `eat()`、`makeNoise()`\
    \ 和 `fly()`。不同种类的 `Animal` 以不同的组合拥有这些行为。\n\n让我们从为每个行为创建接口开始\n\n```\n 1 interface\
    \ Flying {\n 2     void fly();\n 3 }\n 4 \n5 interface Feedable {\n 6     void\
    \ eat();\n 7 }\n 8 \n9 interface Audible {\n10     void makeNoise();\n11 }\n```\n\
    \n作为第一次尝试，我们可以纠正一些 LSP 失败：\n\n```\n1 class Dodo implements Feedable, Audible {\n\
    2     void eat() {...}\n3     void makeNoise() {...}\n4 }\n```\n\n通过这种方式，我们纠正了一些\
    \ LSP 失败：\n\n```\n1 class Dodo extends Bird {\n2     void fly() {\n3         throw\
    \ new UnsupportedOperationException(\"error: cannot fly\");\n4     }\n5 }\n```\n\
    \n这种方法修复了 `Dodo` 的某些问题：\n\n```\n1 class Sparrow extends Bird {\n2     void eat()\
    \ {\n3         System.out.println(\"Seeds\");\n4     }\n5 \n6     void makeNoise()\
    \ {\n7         System.out.println(\"Cheep cheep\");\n8     }\n9 \n10     void\
    \ fly() {\n11         System.out.println(\"Flap flap\");\n12     }\n13 }\n```\n\
    \n这种方法修复了 `Sparrow` 的某些问题：\n\n```\n1 class Dog extends Animal {\n2     void eat()\
    \ {\n3         System.out.println(\"Meat\");\n4     }\n5 \n6     void makeNoise()\
    \ {\n7         System.out.println(\"Woof\");\n8     }\n9 }\n```\n\n这种方法修复了 `Dog`\
    \ 的某些问题：\n\n```\n 1 abstract class Animal {\n 2     abstract void eat();\n 3 \
    \    abstract void makeNoise();\n 4 }\n```\n\n这种方法修复了 `Animal` 的某些问题：\n\n```\n\
    \ 1 abstract class Bird extends Animal {\n 2     abstract void fly();\n 3 }\n\
    ```\n\n这种方法修复了 `Bird` 的某些问题：\n"
- fmt: "\nOur original problem was that inheritance and static types had been used\
    \ to model dynamic behaviours. That cannot work. We found the correct way to model\
    \ this. It is not how the common example does it.\n\nI think it’s time to declare\
    \ “OO is dead” articles dead.\n\nAs dead as our Dodo.\n\n## Square extends Rectangle\n\
    \nAt Number 2 in our chart of depressing classics is “Square extends Rectangle”.\n\
    \nThis problem unfolds when we do a good job of our `Shape.draw()` exercise on\
    \ polymorphism, then get a bit carried away.\n\nIt’s all going well, with an interface\
    \ `Shape` that has one method `draw()`. We knock it out of the park adding class\
    \ `Circle`, class `Triangle` and class `Rectangle`.\n\nFlush with success, we\
    \ decide to draw a `Square`.\n\nWe notice that a square is a kind of rectangle.\
    \ IS-A! Boom! We can inherit from `Rectangle` - perfect!\n\nHere is where we get\
    \ up to:\n\n```\n 1 class Graphics {\n 2     // Coordinates (0,0) top left of\
    \ screen\n 3     void line( int x1, int y1, int x2, int y2 );\n 4 }\n 5 \n 6 interface\
    \ Shape {\n 7     void draw(Graphics g);\n 8 }\n 9 \n10 class Rectangle implements\
    \ Shape {\n 11     private int xLeft;\n 12     private int yTop;\n 13     private\
    \ int width;\n 14     private int height;\n 15 \n 16     public Rectangle( int\
    \ xLeft, int yTop, int width, int height ) {\n 17         this.xLeft = xLeft;\n\
    \ 18         this.yTop = yTop;\n 19         this.width = width;\n 20         this.height\
    \ = height;\n 21     }\n 22 \n 23     void setWidth(int width) {\n 24        \
    \ this.width = width;\n 25     }\n 26 \n 27     void setHeight(int height) {\n\
    \ 28         this.height = height;\n 29     }\n 30 \n 31     void draw(Graphics\
    \ g){\n 32         g.line(xLeft, yTop, xLeft+width, yTop);\n 33         g.line(xLeft+width,\
    \ yTop, xLeft+width, yTop+height);\n 34         g.line(xLeft+width, yTop+height,\
    \ xLeft, yTop+height);\n 35         g.line(xLeft, yTop+height, xLeft, yTop);\n\
    \ 36     }\n 37 }\n 38 \n 39 class Square extends Rectangle {\n 40     void setSize(\
    \ int sideLength ) {\n 41         setWidth( sideLength );\n 42         setHeight(\
    \ sideLength );\n 43     }\n 44 }\n```\n\nHuzzah! We’re done. That `Square` class\
    \ is all you need to draw a square, provided you call `setSize()` with the length\
    \ of each side you want.\n\nThat’s the problem, though. In this case, nothing\
    \ particularly bad happens. But we have laid a trap for later. ‘Future Us’ isn’t\
    \ going to be best pleased.\n\nSuppose we needed an extra method that had a different\
    \ behaviour for a `Square` as compared to a `Rectangle`. Let’s say it was to power\
    \ a dashboard, interested in counting how many squares and rectangles we had:\n\
    \n```\n 1 interface Shape {\n 2     void draw( Graphics g );\n 3     void report(\
    \ Dashboard d );\n 4 }\n 5 \n 6 class Rectangle implements Shape {\n 7     //\
    \ ... other code as above ...\n 8 \n 9     void report( Dashboard d ) {\n10  \
    \       d.reportRectangle();\n 11     }\n 12 }\n 13 \n14 class Square extends\
    \ Rectangle {\n 15     // ... other code as above ...\n 16 \n 17     void report(\
    \ Dashboard d ) {\n 18         d.reportSquare();\n 19     }\n 20 }\n```\n\nThis\
    \ would work well - until you had a `Rectangle` object and called `setWidth(5)`\
    \ and `setHeight(5)` on it.\n\nAt this point, we have an object of type `Rectangle`.\
    \ We have set its width and height to be the same. So now, it will draw as a square.\
    \ It IS-A square, mathematically. It should report to the dashboard that it is\
    \ a Square.\n\nBut it isn’t and it won’t. It IS-NOT-A Square in Java. It is a\
    \ `Rectangle` with equal sides. In Java, *that is not the same thing*.\n\nIt boils\
    \ down to this idea that in Java, a class or interface represents a fixed type.\
    \ The kind of class of an object is set when you create it. It *cannot* change\
    \ according to data values of fields inside it.\n\nIn this example, mathematically,\
    \ a square is a rectangle. That is in no doubt. But Java classes are unable to\
    \ represent that change of type dynamically. That is not how Java was designed.\
    \ It is not the model of OOP that Java supports. Other languages may do this.\
    \ But not Java.\n\nYou have to work with what you have. Respect the limitations.\n\
    \n## Inheriting implementation\n\nThe last of our three ugly ducklings is using\
    \ inheritance just to pull in some extra code, without thought to IS-A relationships,\
    \ Liskov LSP or anything in the domain:\n\n```\n 1 class MySqlDatabase {\n 2 \
    \    void insertSql(...) {...}\n 3 \n 4     // ... other database methods ...\n\
    \ 5 }\n 6 class User extends MySqlDatabase { \n 7     private String name ;\n\
    \ 8 \n 9     void setName( String name ) {\n10         this.name = name;\n 11\
    \ \n12         insertSql(\"USER_TABLE\", \"NAME\", name);\n 13     }\n 14 }\n\
    ```\n\nContrived, but a real warning nevertheless.\n\nIn this example, our `User`\
    \ class wants to save itself to our `MySqlDatabase`. We drag in the database code\
    \ using inheritance. For sure, we save some keystrokes, as we now have available\
    \ all the database methods like `insertSql()` available to us.\n\nThe problem\
    \ with this is that a `User` is not related to a database in any way. A `User`\
    \ object is not - or at least should not - be swappable for a database in all\
    \ contexts.\n\nYes, it saves keystrokes. But it breaks our designs. Early 90s\
    \ OOP was full of this stuff in the popular press and has somewhat tarnished what\
    \ classes are really all about.\n\n## Broken Shared State\n\nThis one is a bit\
    \ of a straw man, really.\n\nObjects hide secrets. One obvious secret is a changeable\
    \ value. We call this ‘state’:\n\n```\n 1 class Counter {\n 2     private int\
    \ total;\n 3 \n 4     void oneMore() {\n 5         total++;\n 6     }\n 7 \n 8\
    \     void display(Display d) {\n 9         d.print( \"Total so far is: \");10\
    \         d.println( total );\n 11     }\n12 }\n```\n\nWe can create a new `Counter`,\
    \ call `oneMore()` as often as we like, and display the total, using some `Display`\
    \ object.\n\nThe criticism comes from concurrent systems, like multi-threaded\
    \ Java Servlets or multi-core CPUs.\n\nIf you create Counter from different threads\
    \ you get strange failures. What happens is that Thread A is partway through adding\
    \ one to the total, when Thread B comes along, takes the partial result, adds\
    \ one to that and updates total.\n\nThe value gets corrupted. That’s not the best\
    \ news to get that day.\n\nOOP critics treat this as meaning that OOP cannot be\
    \ used in concurrent systems. Or it is difficult to use. Or that Functional Programming\
    \ (FP) is the only thing that makes sense.\n\nThe truth is, there are plenty of\
    \ techniques that allow safe, simple use of objects in concurrent systems.\n\n\
    The simplest is to make objects immutable. If you do not share state between threads,\
    \ you have no problem.\n\nFor the cases where you *do* need to share that state,\
    \ in most code, that state lives in a database. A `Repository` pattern object\
    \ will access that database. The database will manage concurrent access for you.\
    \ Job done.\n\nWhere you have no database, Java provides primitives (`Thread`,\
    \ `synchronized`) and some powerful high level objects (`java.util.concurrent`\
    \ package) to simplify this. Frameworks like Akka provide `Actor` objects, which\
    \ is a way to treat each object as its own, concurrent thing.\n\nIt’s got nothing\
    \ to do with OOP really. FP avoids the problem by pushing state out to the edges\
    \ of the system. But we can do that anyway, using immutable objects, if we so\
    \ choose. Or add synchronisation. Or use the objects with built-in concurrency.\n\
    \n## Ordinary Bad Code\n\nEven with an elegant OO design, you can still snatch\
    \ defeat from the jaws of victory by messing up your methods.\n\nIn one project,\
    \ I encountered code rather like this, from an outsource provider:\n\n```\n 1\
    \ public boolean ok (Object o) {\n 2     boolean result = false ;\n 3 \n 4   \
    \  if ( o == null ) {\n 5         result = false\n 6     }\n 7     else if ( !(o\
    \ instanceof Boolean) ) {\n 8         result = false ;\n 9     }\n10     else\
    \ if ( ((Boolean)o).equals(Boolean.FALSE) ) {\n 11         result = false ;\n\
    \ 12     }\n 13     else if ( ((Boolean)o).equals(Boolean.TRUE) ) {\n 14     \
    \    result = true ;\n 15     }\n 16     else {\n 17         result = false ;\n\
    \ 18     }\n 19 \n 20     return result;\n 21 } \n```\n"
  raw: "Our original problem was that inheritance and static types had been used to\
    \ model dynamic behaviours. That cannot work. We found the correct way to model\
    \ this. It is not how the common example does it.\n\nI think it’s time to declare\
    \ “OO is dead” articles dead.\n\nAs dead as our Dodo.\n\n## Square extends Rectangle\n\
    \nAt Number 2 in our chart of depressing classics is “Square extends Rectangle”.\n\
    \nThis problem unfolds when we do a good job of our Shape.draw() exercise on polymorphism,\
    \ then get a bit carried away.\n\nIt’s all going well, with an interface Shape\
    \ that has one method draw(). We knock it out of the park adding class Circle,\
    \ class Triangle and class Rectangle.\n\nFlush with success, we decide to draw\
    \ a Square.\n\nWe notice that a square is a kind of rectangle. IS-A! Boom! We\
    \ can inherit from Rectangle - perfect!\n\nHere is where we get up to:\n\n```\n\
    \ 1 class Graphics {\n 2     // Coordinates (0,0) top left of screen\n 3     void\
    \ line( int x1, int y1, int x2, int y2 );\n 4 }\n 5 \n 6 interface Shape {\n 7\
    \     void draw(Graphics g);\n 8 }\n 9 \n10 class Rectangle implements Shape {\n\
    11     private int xLeft;\n12     private int yTop;\n13     private int width;\n\
    14     private int height;\n15 \n16     public Rectangle( int xLeft, int yTop,\
    \ int width, int height ) {\n17         this.xLeft = xLeft;\n18         this.yTop\
    \ = yTop;\n19         this.width = width;\n20         this.height = height;\n\
    21     }\n22 \n23     void setWidth(int width) {\n24         this.width = width;\n\
    25     }\n26 \n27     void setHeight(int height) {\n28         this.height = height;\n\
    29     }\n30 \n31     void draw(Graphics g){\n32         g.line(xLeft, yTop, xLeft+width,\
    \ yTop);\n33         g.line(xLeft+width, yTop, xLeft+width, yTop+height);\n34\
    \         g.line(xLeft+width, yTop+height, xLeft, yTop+height);\n35         g.line(xLeft,\
    \ yTop+height, xLeft, yTop);\n36     }\n37 }\n38 \n39 class Square extends Rectangle\
    \ {\n40     void setSize( int sideLength ) {\n41         setWidth( sideLength\
    \ );\n42         setHeight( sideLength );\n43     }\n44 }\n```\n\nHuzzah! We’re\
    \ done. That Square class is all you need to draw a square, provided you call\
    \ setSize() with the length of each side you want.\n\nThat’s the problem, though.\
    \ In this case, nothing particularly bad happens. But we have laid a trap for\
    \ later. ‘Future Us’ isn’t going to be best pleased.\n\nSuppose we needed an extra\
    \ method that had a different behaviour for a Square as compared to a Rectangle.\
    \ Let’s say it was to power a dashboard, interested in counting how many squares\
    \ and rectangles we had:\n\n```\n 1 interface Shape {\n 2     void draw( Graphics\
    \ g );\n 3     void report( Dashboard d );\n 4 }\n 5 \n 6 class Rectangle implements\
    \ Shape {\n 7     // ... other code as above ...\n 8 \n 9     void report( Dashboard\
    \ d ) {\n10         d.reportRectangle();\n11     }\n12 }\n13 \n14 class Square\
    \ extends Rectangle {\n15     // ... other code as above ...\n16 \n17     void\
    \ report( Dashboard d ) {\n18         d.reportSquare();\n19     }\n20 }\n```\n\
    \nThis would work well - until you had a Rectangle object and called setWidth(5)\
    \ and setHeight(5) on it.\n\nAt this point, we have an object of type Rectangle.\
    \ We have set its width and height to be the same. So now, it will draw as a square.\
    \ It IS-A square, mathematically. It should report to the dashboard that it is\
    \ a Square.\n\nBut it isn’t and it won’t. It IS-NOT-A Square in Java. It is a\
    \ Rectangle with equal sides. In Java, *that is not the same thing*.\n\nIt boils\
    \ down to this idea that in Java, a class or interface represents a fixed type.\
    \ The kind of class of an object is set when you create it. It *cannot* change\
    \ according to data values of fields inside it.\n\nIn this example, mathematically,\
    \ a square is a rectangle. That is in no doubt. But Java classes are unable to\
    \ represent that change of type dynamically. That is not how Java was designed.\
    \ It is not the model of OOP that Java supports. Other languages may do this.\
    \ But not Java.\n\nYou have to work with what you have. Respect the limitations.\n\
    \n## Inheriting implementation\n\nThe last of our three ugly ducklings is using\
    \ inheritance just to pull in some extra code, without thought to IS-A relationships,\
    \ Liskov LSP or anything in the domain:\n\n```\n 1 class MySqlDatabase {\n 2 \
    \    void insertSql(...) {...}\n 3 \n 4     // ... other database methods ...\n\
    \ 5 }\n 6 class User extends MySqlDatabase { \n 7     private String name ;\n\
    \ 8 \n 9     void setName( String name ) {\n10         this.name = name;\n11 \n\
    12         insertSql(\"USER_TABLE\", \"NAME\", name);\n13     }\n14 }\n```\n\n\
    Contrived, but a real warning nevertheless.\n\nIn this example, our User class\
    \ wants to save itself to our MySqlDatabase. We drag in the database code using\
    \ inheritance. For sure, we save some keystrokes, as we now have available all\
    \ the database methods like insertSql() available to us.\n\nThe problem with this\
    \ is that a User is not related to a database in any way. A User object is not\
    \ - or at least should not - be swappable for a database in all contexts.\n\n\
    Yes, it saves keystrokes. But it breaks our designs. Early 90s OOP was full of\
    \ this stuff in the popular press and has somewhat tarnished what classes are\
    \ really all about.\n\n## Broken Shared State\n\nThis one is a bit of a straw\
    \ man, really.\n\nObjects hide secrets. One obvious secret is a changeable value.\
    \ We call this ‘state’:\n\n```\n 1 class Counter {\n 2     private int total;\n\
    \ 3 \n 4     void oneMore() {\n 5         total++;\n 6     }\n 7 \n 8     void\
    \ display(Display d) {\n 9         d.print( \"Total so far is: \");\n10      \
    \   d.println( total );\n11     }\n12 }\n```\n\nWe can create a new Counter, call\
    \ oneMore() as often as we like, and display the total, using some Display object.\n\
    \nThe criticism comes from concurrent systems, like multi-threaded Java Servlets\
    \ or multi-core CPUs.\n\nIf you create one Counter, then call oneMore() *from\
    \ different threads* you get strange failures. What happens is that sometimes\
    \ Thread A is partway through adding one to the total, when Thread B comes along,\
    \ takes the partial result it finds, adds one to that and updates total.\n\nThe\
    \ value gets corrupted. That’s not the best news to get that day.\n\nOOP critics\
    \ treat this as meaning that OOP cannot be used in concurrent systems. Or it is\
    \ difficult to use. Or that Functional Programming (FP) is the only thing that\
    \ makes sense.\n\nThe truth is, there are plenty of techniques that allow safe,\
    \ simple use of objects in concurrent systems.\n\nThe simplest is to make objects\
    \ immutable. If you do not share state between threads, you have no problem.\n\
    \nFor the cases where you *do* need to share that state, in most code, that state\
    \ lives in a database. A Repository pattern object will access that database.\
    \ The database will manage concurrent access for you. Job done.\n\nWhere you have\
    \ no database, Java provides primitives (Thread, synchronized) and some powerful\
    \ high level objects (java.util.concurrent package) to simplify this. Frameworks\
    \ like Akka provide Actor objects, which is a way to treat each object as its\
    \ own, concurrent thing.\n\nIt’s got nothing to do with OOP really. FP avoids\
    \ the problem by pushing state out to the edges of the system. But we can do that\
    \ anyway, using immutable objects, if we so choose. Or add synchronisation. Or\
    \ use the objects with built-in concurrency.\n\n## Ordinary Bad Code\n\nEven with\
    \ an elegant OO design, you can still snatch defeat from the jaws of victory by\
    \ messing up your methods.\n\nIn one project, I encountered code rather like this,\
    \ from an outsource provider:\n\n```\n 1 public boolean ok (Object o) {\n 2  \
    \   boolean result = false ;\n 3 \n 4     if ( o == null ) {\n 5         result\
    \ = false\n 6     }\n 7     else if ( !(o instanceof Boolean) ) {\n 8        \
    \ result = false ;\n 9     }\n10     else if ( ((Boolean)o).equals(Boolean.FALSE)\
    \ ) {\n11         result = false ;\n12     }\n13     else if ( ((Boolean)o).equals(Boolean.TRUE)\
    \ ) {\n14         result = true ;\n15     }\n16     else {\n17         result\
    \ = false ;\n18     }\n19 \n20     return result;\n21 } \n```"
