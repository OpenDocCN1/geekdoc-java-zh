    \ 1990s - before some of our modern Java developers were even born. The reason\
    \ nobody knows the lessons in them is simple. We don’t teach them anymore.\n\n\
    This book is my distillation of those classic ideas plus a twist of experience.\
    \ Each chapter contains stuff I actually use, day to day, to get results. It’s\
    \ full of hard-won wisdom from 25 years at the code face. It’s practical. And\
    \ very simple. Bugs hide in complexity. I like to give bugs no place to hide.\n\
