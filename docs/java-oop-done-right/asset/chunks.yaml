    \ then calls showProfile() on whichever object it got.\n\nIt is safe to do this\
    \ because:\n\n*   It will always receive an object. There will be no null to check\
    \ for\n\n*   The NullUser has a method that implements correct behaviour: do nothing\n\
    \nThe NullObject pattern is very effective. It designs-out null reference bugs\
    \ by not using null. It simplifies calling code - our big goal in this book -\
    \ by eliminating a conditional branch. That simplifies TDD testing. All of that\
    \ speeds up reading and understanding this code.\n\n## Zombie object\n\nThere’s\
    \ something a bit grubby about NullUser, though: That whole subclass thing.\n\n\
    I’ve heard complaints from pairs that “We only need one class and now you’re adding\
    \ two or three! Come on, Al - keep it simple!”\n\nIt’s a fair point. Although\
    \ you can argue that you *don’t* only need one class. You are representing two\
    \ completely separate ideas - a User that exists and one that doesn’t.\n\nBut\
    \ arguing with your pair is all a bit tawdry, really. So let’s go and make a nice\
    \ hot cup of tea each, and have another think.\n\nWhat else could we do?\n\nThe\
    \ ‘Zombie object’ is so named because the way it represents null is to be ‘the\
    \ walking dead’: The outside of the object looks normal, but the insides are bad.\n\
    \nWe must modify our User class to add a ‘zombie detection’ method:\n\n```\n1\
    \ class User {\n2     boolean isValid() {...}\n3 \n4     void showProfile() {...}\n\
    5 }\n```\n\nThe new isValid() method tells us whether the object has valid data\
    \ or not. If isValid() returns false, you must not use the object. You must check\
    \ this first - every time you use the object.\n\nCalling code has the conditional\
    \ just like the null check. But it reads nicer:"
