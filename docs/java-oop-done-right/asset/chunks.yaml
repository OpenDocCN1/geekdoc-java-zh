  trans: "\n依赖注入是一种 `implementation` 技术。我们反转了依赖关系。现在，我们需要某种方法来选择合适的具体实现并将其接入。\n\n\
    DI 框架通常很有用。但不要忘记——DI 的本质仅仅是简单地 `new` 出类并将它们传递给构造函数。\n\n## LSP 里科夫替换原则 - 让事物可替换\n\
    \nBarbara Liskov（芭·里科夫）是计算领域的传奇。LSP 是她发现的一个重要原则的名称。\n\n该原则帮助我们推导多态中遇到的问题。\n\n\
    让我们回到 Shapes（形状）示例来看它具体是什么。\n\n### 当 Shapes 变得糟糕时\n\n```\n1 interface Shape {\n\
    2     void draw();\n3 } \n4 \n5 class Circle implements Shape {\n6     public\
    \ void draw(){\n7         System.out.println(\"I'm round\");\n8     }\n9 }\n```\n\
    \n这是“良好”的情况。\n\n`Circle` 实现了接口 `Shape` 的 `draw()` 方法，并可以在任何预期 `Shape` 的地方使用。\n\
    \n你可能记得那个调用代码示例，它可以在不更改代码的情况下混合使用 `Circle`、`Square` 和 `Triangle`。\n\n但每个实现接口方法的类都能被替换吗？这个类的呢：\n\
    \n```\n 1 class CardDealer implements Shape {\n 2     private final Deck cards\
    \ ;\n 3     \n 4     CardDealer( final Deck cards) {\n 5         this.cards =\
    \ cards;\n 6     }\n 7  \n 8     public void draw(){\n 9         Card next = cards.next();\n\
    10         System.out.println(next.asText());\n11     }\n12 }\n```\n\n这可能是一个牌游戏的类；桥牌甚至是\
    \ Snap。\n\n`CardDealer` 类实现了方法 `Shape.draw()`，因此它与其具有多态性。\n\n我们可以很容易地将其加入形状列表中：\n\
    \n```\n1   List<Shape> shapes = List.of( new Circle(), new CardDealer());\n2 \
    \  shapes.forEach( Shape::draw ); \n```\n\n这将会编译并运行。\n\n但它能按预期工作吗？\n\n### 可替换性\n\
    \n直觉上——不能。它显然不会按预期工作。`CardDealer` 不符合我们对 `Shape.draw()` 应该做什么的预期。\n\n`Shape.draw()`\
    \ 和 `Circle` 等的整个设置表明，我们期望类去绘制几何形状，而不是从牌牌中抽牌。\n\n这就是 Barbara Liskov 的洞察力所在。她随后在数学上对这种直觉进行了形式化处理。这种形式化就是为人知的里科夫替换原则（LSP）。\n\
    \nLSP 提醒我们，实现接口的类只有在所有情况下都能替换该接口时才是有用的。\n\n具体来说，满足此点的类必须：\n\n* 接受所有可能的输入\n* 为这些输入产生所有预期的输出\n\
    \n简而言之，你可以更换任何实现类而不会导致代码崩溃。\n\nLiskov 给出的一个严谨定义是：\n\n> 如果 S 是 T 的子类型，那么程序中类型 T\
    \ 的对象可以替换为类型 S 的对象，而不改变该程序的任何理想属性。\n\n在实践中，我总是会问这个简单的问题：“是否存在某些情况，这个类会破坏接口契约？”\n\
    \nLSP 也适用于通用的继承——类和子类、抽象类等。它不仅限于接口和实现。\n\n我之所以用这些术语描述它，唯一原因是我发现接口/实现是面向对象编程（OOP）中继承最简单、最安全的用法。它是“良性路径”。\n\
    \n## OCP 开闭原则 - 不经修改而进行扩展\n\n开闭原则描述了可以在不改变代码本身的情况下使其产生不同行为的代码。\n\n我们之前在 Shapes\
    \ 示例中见过这个。绘制形状的代码可以绘制任何形状，而无需自身进行任何更改。\n\n```\n 1 class Shapes {\n 2     private\
    \ final List<Shape> shapes = new ArrayList<>();\n 3 \n 4     public void add (Shape\
    \ s) {\n 5         shapes.add(s);\n 6     }\n 7 \n 8     public void draw() {\n\
    \ 9         shapes.forEach(Shape::draw);\n10     }\n11 }\n```\n\n这个聚合类允许你向内部列表添加形状然后绘制它们。\n\
    \nOCP 的体现可以使用 `add(shape)` 方法添加任何兼容 LSP 的 `Shape` 实现。然后你可以更改 `Shapes.draw()` 的行为而无需更改该类内部的任何内容。行为的改变是在\
    \ `Shapes` 类之外完成的，而不是内部。\n\n这就是所谓的 Shapes 对扩展**开放**（你可以让它执行不同的事情），但对修改**关闭**。\n\
    \nOCP 本质上是伪装的依赖倒置。\n\n### 策略模式：行为外部化\n\n有一个针对 OCP 的通用模式。\n\n策略模式首次在“四人帮”编写的《设计模式》一书中描述，是一种允许将行为注入到类中的通用方法。\n\
    \n让我们把 `Shapes` 类看作是更大的图形程序（如 Photoshop）的一部分。我们想为我们的 `Shapes` 类添加一种处理每个 `Shape`\
    \ 的方法。我们的第一个算法可以是为每个形状添加模糊效果。\n\n实现此点的方法可能是向 `Shapes` 添加一个 `blur()` 方法：\n\n```\n\
    \ 1 interface Shape {\n 2     void draw();\n 3     void apply(Filter f);\n 4\n\
    \ 5 \n 6 class Shapes {\n 7     private final List<Shape> shapes = new ArrayList<>();\n\
    \ 8 \n 9     public void add (Shape s) {\n10         shapes.add(s);\n11     }\n\
    12 \n13     public void draw() {\n14         shapes.forEach(Shape::draw);\n15\
    \     }\n16 \n17     public void blur() {\n18         shapes.forEach(s -> s.apply(new\
    \ BlurFilter()));\n19     }\n20 }\n```\n\n为了支持这一点，我们为 `Shape` 添加了 `apply(Filter\
    \ f)` 方法，以便在 `Shape` 上运行处理。`Filter` 是一个接口。每种不同的图形处理都必须实现它。我们根据需要传入具体的类。在例子中，它是\
    \ `BlurFilter`。\n\n这运行良好。但我们不得不修改 `Shapes` 类。\n\n通常情况下，我们希望避免修改已经编写的类。或者至少在有理由的情况下这样做。我们不希望在良好的代码中引入\
    \ Bug。我们绝不想创建包含大量方法的类。这就是开闭原则的动机。\n\n向 `Shapes` 添加像图形处理这样的功能通常需要这样的代码更改。任何其他处理方式都是牵强。的。\n\
    \n如果我们只需要一个 `blur()` 方法，这并不是一个糟糕的方法。\n\n但如果我们需要更多类型的处理——比如锐化、加亮、变暗、波化——我们能做得更好吗？我们能限制为只修改一次，然后注入这些行为吗？\n\
    \n这就是策略模式所擅长的：\n\n```\n 1 class Shapes {\n 2     private final List<Shape> shapes\
    \ = new ArrayList<>();\n 3 \n 4     public void add (Shape s) {\n 5         shapes.add(s);\n\
    \ 6     }\n 7 \n 8     public void draw() {\n 9         shapes.forEach(Shape::draw);\n\
    10     }\n 11 \n12     public void filter(Filter filter) {\n13         shapes.forEach(\
    \ s -> filter.applyTo(s) );\n14     }\n15 }\n```\n\n在这里，`filter()` 方法将实现 `Filter`\
    \ 接口的类注入到方法中。然后在每个形状上运行它。\n\n`Filter` 是一种*策略模式*。它定义了我们过滤 `Shape` 的策略。它将行为外部化。\n\
    \n我们的 `Shapes.filter()` 方法不知道我们具体如何处理每个 `Shape`。它接收从类外部提供的内容并应用到每个 `Shape`。\n\n\
    正如 `Shapes.draw()` 不知道如何绘制任何形状一样，`Shapes.filter()` 知道如何过滤任何 `Shape`。由我们的 `Filter`\
    \ 形成的策略模式将这种可变行为推到了类之外，使其对扩展开放，但对进一步修改关闭。\n\n"
- fmt: "\n## ISP Interface Segregation Principle - honest interfaces\n\nThe Interface\
    \ Segregation Principle states that calling code should not be forced to depend\
    \ on methods it does not use. It’s a good way of putting it.\n\nI think of ISP\
    \ as keeping interfaces as small and honest. It’s about avoiding polluting an\
    \ interface with methods that only sometimes make sense. The trick is to only\
    \ add methods that *always* make sense. We move the ‘sometimes needed’ methods\
    \ elsewhere to where they are always needed, then redesign to make use of them.\n\
    \n### Bad Example: TV Controls\n\nThe hardware team proudly tell us that their\
    \ latest low-cost digital TV product is ready for us to get some code into. Our\
    \ first task is to implement the remote control code.\n\nWe keep it simple and\
    \ write an interface exposing all there is to be controlled:\n\n```java\n1 interface\
    \ Control {\n2     void on();\n3     void off();\n4     void channelUp();\n5 \
    \    void channelDown();\n6 }\n```\n\nWe can stub that out for testing our remote\
    \ control adapter and create a production class that drives the TV hardware.\n\
    \nAll good.\n\nA couple of weeks later, the team tell us they have got some improved\
    \ Smart TV hardware. We will be launching two products, one low-cost, entry-level\
    \ version and our high-end Smart TV.\n\nIt features digital programme recording\
    \ as well as YouTube and Netflix internet TV.\n\nWe might decide to add the extra\
    \ features into our existing `Control` interface:\n\n```java\n 1 interface Control\
    \ {\n 2     // entry level TV features\n 3     void on();\n 4     void off();\n\
    \ 5     void channelUp();\n 6     void channelDown();\n 7     \n 8     // Smart\
    \ TV Only features\n 9     void startRecording();\n10     void endRecording();\n\
    11     void launchYoutube();\n12     void launchNetflix();\n13 }\n```\n\nWe start\
    \ coding our class to drive the TV hardware, and we want to keep the same codebase,\
    \ rather than fork it per-product.\n\nAh.\n\nIf we keep a single class for both\
    \ entry-level and Smart TVs, we soon find a problem with the Smart TV methods\
    \ on the entry-level product: they don’t work.\n\nInitial ideas are to add `if\
    \ (isSmartTV)` statements everywhere needed. That itself is an OOP code smell.\
    \ We should probably replace that with polymorphism, using two separate classes\
    \ that implement that `Control` interface. Call them `BasicControl` and `SmartTvControl`.\n\
    \nThis gets rid of the if statements. More specifically, it pushes them out to\
    \ the edge of the system where we create the appropriate one of those two classes.\
    \ But it still leaves us with a problem. What should `BasicControl` do with all\
    \ the Smart-TV only methods?\n\nTypically, these will either be no-operation (no\
    \ code in there) or throw an `UnsupportedOperationException`.\n\nThe root cause\
    \ of the problem is that we have violated ISP. We have forced the `BasicControl`\
    \ implementer of the interface into using a bunch of methods that make absolutely\
    \ no sense to it.\n\n### Fixing our ISP violation\n\nThis is where I wish I could\
    \ say it was easy to fix. But stuff like this gets pretty involved or pretty hacky.\n\
    \nThe first suggestion is to simply split the interface into two:\n\n```java\n\
    \ 1 interface BasicFeatures {\n 2     void on();\n 3     void off();\n 4     void\
    \ channelUp();\n 5     void channelDown();\n 6 }\n 7 \n 8 interface AdvancedFeatures\
    \ {\n 9     void startRecording();\n10     void endRecording();\n11     void launchYoutube();\n\
    12     void launchNetflix();\n13 }\n```\n\nOne approach would be to make `AdvancedFeatures`\
    \ extend `BasicFeatures`. Above, I’ve chosen not to, because I don’t think it\
    \ helps us much.\n\nBy doing this split, we have fixed ISP in a technical sense.\
    \ We can create a class (possibly two classes) that will drive the `BasicFeatures`\
    \ on both entry-level and Smart TVs. We can create a separate class to drive the\
    \ `AdvancedFeatures` on the Smart TV only. Each class only gets methods it cares\
    \ about.\n\n### Redesigning to Command objects\n\nIn a practical system, with\
    \ one codebase being used for two products with different feature sets, fixing\
    \ ISP isn’t enough.\n\nThe issue is that we want to expose one set of features\
    \ to an entry-level TV user and a different superset of features to a Smart TV\
    \ user. Java interfaces do not express that model.\n\nA Java (and C# and C++)\
    \ interface is statically bound. We can’t merely add methods to it based on our\
    \ TV type. It is static binding that leads us to write smaller interfaces and\
    \ use ISP in the first place.\n\nOur application ideally needs some way of modelling\
    \ that an entry-level TV has three methods - on, off, selectChannel - and our\
    \ Smart TV has more.\n\nThe way to do this elegantly is with a design pattern\
    \ known as ‘Command’.\n\n```java\n1 interface Command {\n2     void execute();\n\
    3 }\n```\n\nYou can see that a `Command` interface is a level of abstraction higher\
    \ than we were using. It knows nothing at all about our specific application.\
    \ It only knows that any objects that implement `Command` can be told to `execute()`\
    \ – to run their code that makes that command happen.\n\nSo we would see classes\
    \ like:\n\n```java\n 1 class ChannelUp implements Command {\n 2     void execute()\
    \ {\n 3         // code to drive the hardware to show whatever\n 4         //\
    \ is on the next TV channel 'up' in the list\n 5 \n 6         // This is the same\
    \ code as we would have in our\n 7         // class that implemented BasicFeatures\
    \ - it is\n 8         // just a refactor into a different code structure\n 9 \
    \    }\n10 }\n```\n\nWe would have a class that maps each command to an object.\
    \ Then we can pass our commandnumber to `execute()` and have this class do the\
    \ right thing, Tell-Don-Ask style:\n\n```java\n1 class Commands {\n2     private\
    \ final Map<Integer, Command> commandsByNumber = \n3         new HashMap<Integer,\
    \ Command>();\n4 \n5     public initialise( boolean isSmartTv ) {\n6         register(0,\
    \ new On());\n7         register(1, new Off());\n8         register(2, new ChannelUp());\n\
    9         register(3, new ChannelDown());\n10 \n11         if (isSmartTv) {\n\
    12             register(4, new StartRecording());\n13             // ... register\
    \ the others\n14         }\n15     }\n16 \n17     public void execute(int commandNumber)\
    \ {\n18         Command c = commandsByNumber.get(commandNumber);\n19 \n20    \
    \     if ( c != null ) {\n21             c.execute();\n22         }\n23     }\n\
    24 \n25     private void register( int commandNumber, final Command c) {\n26 \
    \        commandsByNumber.put(commandNumber, c);\n27     }\n28 }\n```\n\nUsing\
    \ this, we get our ‘dynamic interface’ effect. The Smart TV has more commands\
    \ available to it. We don’t have any ISP violations, because we have designed\
    \ that out. ISP is not possible here.\n\n### Pragmatics: I would choose to do\
    \ it wrong\n\nGiven all that, I would probably choose the solution that violates\
    \ ISP.\n\nWe’ve only got two products. Most probably, any unsupported commands\
    \ should have no effect. Given these factors, I would probably go with one big\
    \ interface and no-operation methods for the Smart TV features.\n\nWe’re Agile,\
    \ after all. So if we get yet another TV product out, then I might be tempted\
    \ to refactor it into Commands then.\n\n# TDD and Test Doubles\n\nNow that we’ve\
    \ covered SOLID, we can use it to improve our OO designs and our testing.\n\n\
    Let’s go back to our TextConversion example - our spectacular 1.99 App Store smash\
    \ hit that converts anything you type into upper case. Think of it as an automated\
    \ SHOUTING app for the Culture Culture.\n\nHere was the code as we left it:\n"
