  trans: "\n现在，想象一下当程序变得越来越大时，这是如何帮助我们的。我们可能会有成百上千个类，也许有数千万行代码。但通过面向对象编程（OOP），我们只需要理解对象的公共接口可以做什么。它使我们免受细节的困扰。\n\
    \n这就是正确实现 OOP 的关键：`调用代码是简单的`\n\n如果事实并非如此……说明我们做错了了。\n\n## 面向对象设计是行为驱动设计\n\n正确执行\
    \ OOP 的关键是让行为驱动设计。\n\n第一个问题始终是“这个对象需要做什么？”。我们将其表示为一个方法，并使用名称来描述该行为。\n\n然后，我们可以在该方法内部添加支持代码使其运行。我们可能会添加对私有方法的调用，将工作拆分成小块。我们可能需要将存储的数据作为对象的字段。在这种情况下，我们需要一个构造函数。\n\
    \n## 整洁代码\n\n虽然我们上一个示例中的代码很短，但它也是“整洁”的。整洁代码简单意味着代码易读、易维护且安全。这里的安全意味着使用该代码时“没有陷阱”。\n\
    \n这意味着更愉快的日子、更快的开发速度和更少的 Bug。如果开发中有什么秘诀，那么整洁代码就是它。\n\n这里使用了几种技术，我们应该在代码中始终使用它们。\n\
    \n### 良好的命名\n\n名称在软件中至关重要。让我给你举个例子。下面这个类是做什么的：\n\n```\n 1 class Z2 {\n 2     private\
    \ String aa;\n 3 \n 4     Z2(String aaa) {\n 5         aa = aaa;\n 6     }\n 7\
    \ \n 8     void q() {\n 9         System.out.println(\"Hello, \" + aa)\n10   \
    \  }\n11 }\n```\n\n没错——它是我们的 `User` 类，但命名糟糕。\n\n很难理解，不是吗？\n\n你是否发现自己在阅读代码时，“脑海中模拟计算机”并从中反向工程出含义？你是否想过这样的想法：“好的，这是一个\
    \ `Z2` 类。它有一个叫 `aa` 的字符串并被赋值，我们可以调用 `q` 方法，它……等一下……说了‘Hello’……这像是某种问候之类的吗？”\n\n\
    这里唯一给我们提供线索的文本是“Hello”。在我们命名得更好的 `User` 类中，我们有了 `user`、`greet`、`name` 和 `hello`\
    \ 这些词，这帮助我们理解了该类的作用。我们不需要理解代码的每一个细节。\n\n选择`意图清晰的命名`会极大地提高团队阅读你代码的能力。不是一点点，而是极大。而且它还能帮助你——当你六个月后回来编写你早已遗忘的代码时。\n\
    \n### 方法名：告诉我结果\n\n有效的方法名解释了为什么我应该调用它们——在方法执行完成后会发生什么。它们不应该解释方法内部的内容，而应该说明该方法能为调用者做什么。\n\
    \n好的：`Users.findNewUsersSince( Date date )`\n\n坏的：`Users.runDatabaseQueryToSortUsersByJoiningDateThenMap(\
    \ Date date )`\n\n方法名`应该是代码块的注释`。代码本身解释了方法是如何工作的。方法名的作用是注释，解释如果我调用它，方法会做什么。\n\n\
    哦对了；不要用注释来做这件事。将注释转换为方法名。\n\n### 变量名：告诉我内容\n\n有效的变量名告诉我它们的内容是什么，而不是它们是由什么构成的。\n\
    \n好的：`String surname` // 如果我需要姓氏，可以使用这个\n\n坏的：`String theString` // 是的，是的，我看得出来！它为什么要在这里？\n\
    \n遵循这两条规则：`方法说明它们做什么，变量说明它们持有什么`，立立刻你的大部分代码将变得更容易理解。\n\n## 围绕行为设计方法，而不是数据\n\n\
    很多文本建议 OOP 的重要之处在于类所拥有的数据。这困扰了很多人，并导致了一些脆弱的设计。关键点是“类应该具有哪些行为？”。在决定这些行为可能需要什么数据之前，回答这个问题。\n\
    \n在过去，我将对象视为一个数据结构，在其周围封装了一些函数。我学到首先设计行为（在不知道它们内部如何工作的情况下）可以带来更稳定的面向对象设计。我建议你也这样做。\n\
    \n围绕行为设计是正确执行 OOP 的关键。\n\n## 隐藏数据 - 无 getter，无 setter\n\n谈到数据，我们的 `greet()` 方法需要一些数据。它需要用户名来完成工作。因此，我们为此提供了一个私有的\
    \ `name` 字段。\n\n但`只有` `greet()` 需要知道这一点。其他都不。\n\n从类外部无法访问该名称。\n\n没有 `getName()`。没有\
    \ `setName()`。\n\n`User` 类根本没有需要这些。我们在构造函数中设置名称。我们使用名称作为 `greet()` 工作的一部分，但它没有其他重要性。它的存在仅是为了这一个原因。\n\
    \n这才是真正封装字段的样子。\n\n以后，你可能会发现一个 getter `是合适的`。只需从行为开始，从完全封装的数据开始并从那里进行。\n\n这样，你就不会担心其他程序员在其他类中编写代码，将我们锁定在私有数据上。\n\
    \n## 聚合：多于一个\n\n我们的上一个示例遵循了所有伟大软件的足迹，只有一个 `User`。即使 Facebook 也是从那里开始的。\n\n但当我们有多个东西时会发生什么？毕竟，这基本上就是计算机发明的目的。\n\
    \nJava 提供了许多实现此点的方法。大多数方法会导致代码难以阅读。所以，随着时间的推移，我倾向于这种方法。来自领域驱动设计：聚合。\n\n## 问候更多\n\
    \n继续我们的示例，让我们添加更多用户：\n\n```\n 1 public class Users {\n 2   private final List<User>\
    \ users = new ArrayList<>();\n 3 \n 4   public void add(User u) {\n 5     users.add(u);\n\
    \ 6   }\n 7 \n 8   public void greet() {\n 9     users.forEach( User::greet );\n\
    10   }\n11 }\n```\n\n这是一个 `Aggregate` 类。它之所以被称为这样，因为它将多个 `User` 聚合到了单个 `Users`\
    \ 对象中。\n\n这种方法的用处在于它遵循了之前的原则：\n\n*   行为优先：添加用户，问候所有用户\n*   隐藏数据 - 无 getter，无 setter\n\
    *   意图清晰的命名 `add()` 和 `greet()`\n\n内部，它使用了 Java 8 及更高版本的功能，你现在已经在在使用了。\n\n###\
    \ 类型安全的集合而非原始数组\n\n私有字段使用了著名的 Collection 类框架。字段本身是 `List<User>`。我选择它是为了表明我的意图，我不关心具体使用哪种列表，只要它按照调用\
    \ `add()` 的顺序访问即可。这体现在 `add(User u)` 方法中。\n\n类型安全在大型程序中很重要。如果没有它，你可能会意外添加一个不是\
    \ `User` 对象且不支持 `greet()` 方法的对象。\n\n这样做有什么意义？代码在运行时会崩溃。\n\nJava 具有强静态类型，可以在运行程序`之前`发现这种错误。这是防止\
    \ Bug 进入代码的一种强大方式。\n\n排除可能的错误是我在开发所有阶段始终使用的基本原则。如果你让某事无法出错，一切都会变得容易理解。你可以字面上地读取它能和不能做什么，而不是被迫猜测。\n\
    \n这里是另一种使用这种方法的方法。\n\nJava 还提供了原始数组来存储“多个东西”。它们看起来有点像这样：\n\n```\n1 // Java 中的原始数组。拒绝。\n\
    2 User[] users = new User[10];\n```\n\n我一直认为这对我来说太底层了。我以前用 C 语言和汇编语言编程，在那里这是你唯一的选择。有集合类要好得多。\n"
- fmt: "\nHere is the problem with low-level array use: You have to know in advance\
    \ how many things you want to store; ten in the example above.\n\nWith an array,\
    \ adding them to the end of the list is awkward. You have to track the last index\
    \ you wrote to, then write to the next one, using the `users[currentIndex]` syntax.\n\
    \nOnce you reach the limit of the array size, because it cannot grow, you have\
    \ to create a new array, copy over all the contents, then copy over the ‘last\
    \ written to index’.\n\nIt’s almost as if there should be an `object` to encapsulate\
    \ all of that work for you, isn’t it?\n\nAnd, of course, that’s exactly what the\
    \ `ArrayList` class does.\n\n**So use it**. Do not write your own.\n\nOne reason\
    \ people complain that Java is ‘verbose’ is when they see novice code littered\
    \ with raw array management - when the collections should have been used.\n\n\
    Is our `Users` class verbose? *Really?* I don’t think it is.\n\n## Using forEach\
    \ - not a loop\n\nLook at the `greet()` method on our `Users` class.\n\nIf you’ve\
    \ never seen that before, it looks a little strange.\n\nIt uses a feature new\
    \ to Java 8 called lambda functions. Basically, you can pass a method into another\
    \ method as a parameter, making it a bit more like how JavaScript uses higher-order\
    \ functions.\n\nEach `Collection` class like `List` now supports a method called\
    \ `forEach()` which takes exactly one method as a parameter.\n\nIt does exactly\
    \ what it says on the tin, which is why I love it: for each one of the things\
    \ in the collection, run the function on it.\n\nIn our case, an internal iterator\
    \ loops over the list of `User` objects. For each user object, it will call the\
    \ `greet()` method on that object.\n\nWe made that happen by the odd syntax `User::greet`,\
    \ called a ‘method reference’. This is a Java 8 shorthand for ‘use the `greet()`\
    \ method on the `User` class for each object’.\n\nThere are four different kinds\
    \ of method references you can use. All are useful.\n\nThe key point is how *direct*\
    \ the code reads. ‘For each of our users, call `greet()`’. It is simple, clear\
    \ and concise.\n\nWhat I really like is how this compares to using an index based\
    \ loop over a raw array. Let’s compare that:\n\n```\n 1 // Looping over raw arrays.\
    \ Just say no, again\n 2 User[] users = new User[10];\n 3 users[0] = new User(\"\
    Alan\");\n 4 users[1] = new User(\"Katy\");\n 5 users[2] = new User(\"Stephanie\"\
    );\n 6 \n 7 // Please don't code like this. Pretty please.\n 8 for (int i=0; i\
    \ < 3; i++){\n 9   users[i].greet();\n10 }\n```\n\nDoes that work? Sure. Does\
    \ it suck? Oh yes.\n\nThe main problem here - to me - is that all I can see is\
    \ *mechanism*. Loads of detail about exactly how painful it is to run a loop with\
    \ some array indices over some array of `User` objects that have a `greet()` method\
    \ on them, then we have to call `greet()`\n\nWhat I *don’t* see is my original\
    \ ‘business problem’ - ‘greet all the users’. It is clear in the aggregate object\
    \ using `forEach()`.\n\nAnother technical problem is with the loop end condition.\
    \ I fudged it for the example. Can you see how the `users` array has ten slots?\
    \ But then I only add three users. Can you see how I had to hard code the figure\
    \ ‘3’ into the for loop?\n\nAgain, arrays are just not the tool for the job. *They\
    \ almost never are*. Do not use them where a collection class will do the job\
    \ better.\n\n## Aggregate methods work on all the things\n\nThis simple rule helps\
    \ split up your code into separate pieces.\n\n*   If the behaviour is on an individual\
    \ object, put it there\n*   If the behaviour applies to all objects, put it in\
    \ the aggregate\n\nIn our example, the `greet()` method in the aggregate `Users`\
    \ will greet all the `Users`. The `greet()` method in individual class `User`\
    \ only greets that user.\n\n### Common themes\n\nSome common ideas for aggregate\
    \ methods are:\n\n*   `summarise()` - create a summary of some common element\n\
    *   `broadcast()` - send something to all objects\n*   `submit()` - send off a\
    \ collection of orders\n\nHow many more can you think of?\n\n# Collaboration\n\
    \nObjects, like people, work best when they work together.\n\nDesigning a set\
    \ of objects to solve a problem is a craft, not a science. There are many principles\
    \ and guidelines but no step-by-step plan. You have to craft each solution as\
    \ you go, working through the various trade-offs that present themselves.\n\n\
    Later chapters will explore some of these principles in detail. For now, let’s\
    \ start with the basics.\n\n## Basic Mechanics\n\nJava gives us two basic ways\
    \ to get objects to work together. We can pass an object as a parameter, or we\
    \ can have an object as a field.\n\nLet’s see them both in code, so we know what\
    \ they look like. We’ll use two classes, `Dog` and `Cat`. The `Dog` wants to chase\
    \ the `Cat`. Perhaps not ‘collaboration’ between the two pets, but let’s see how\
    \ we could do it using objects.\n\nWe’ll make class `Cat` have a `chase()` method:\n\
    \n```\n1 class Cat {\n2     public void chase() {\n3         System.out.println(\"\
    I'm off up that tree\");\n4     }\n5 }\n```\n\nThe first way to give the `Dog`\
    \ class access to a cat object is to hold it in a private field:\n\n```\n 1 class\
    \ Dog {\n 2     private final Cat cat ;\n 3 \n 4     Dog( Cat c ) {\n 5      \
    \   this.cat = c;\n 6     }\n 7 \n 8     public void chase() {\n 9         cat.chase();\n\
    10     }\n11 }\n```\n\nAnother way is to pass the `Cat` object as a parameter:\n\
    \n```\n1 class Dog {\n2     public void chase( Cat c ) {\n3         c.chase();\n\
    4     }\n5 }\n```\n"
  raw: "Here is the problem with low-level array use: You have to know in advance\
    \ how many things you want to store; ten in the example above.\n\nWith an array,\
    \ adding them to the end of the list is awkward. You have to track the last index\
    \ you wrote to, then write to the next one, using the users[currentIndex] syntax.\n\
    \nOnce you reach the limit of the array size, because it cannot grow, you have\
    \ to create a new array, copy over all the contents, then copy over the ‘last\
    \ written to index’.\n\nIt’s almost as if there should be an *object* to encapsulate\
    \ all of that work for you, isn’t it?\n\nAnd, of course, that’s exactly what the\
    \ ArrayList class does.\n\n**So use it**. Do not write your own.\n\nOne reason\
    \ people complain that Java is ‘verbose’ is when they see novice code littered\
    \ with raw array management - when the collections should have been used.\n\n\
    Is our Users class verbose? *Really?* I don’t think it is.\n\n## Using forEach\
    \ - not a loop\n\nLook at the greet() method on our Users class.\n\nIf you’ve\
    \ never seen that before, it looks a little strange.\n\nIt uses a feature new\
    \ to Java 8 called lambda functions. Basically, you can pass a method into another\
    \ method as a parameter, making it a bit more like how JavaScript uses higher-order\
    \ functions.\n\nEach Collection class like List now supports a method called forEach()\
    \ which takes exactly one method as a parameter.\n\nIt does exactly what it says\
    \ on the tin, which is why I love it: for each one of the things in the collection,\
    \ run the function on it.\n\nIn our case, an internal iterator loops over the\
    \ list of User objects. For each user object, it will call the greet() method\
    \ on that object.\n\nWe made that happen by the odd syntax ‘User::greet’, called\
    \ a ‘method reference’. This is a Java 8 shorthand for ‘use the greet() method\
    \ on the User class for each object’.\n\nThere are four different kinds of method\
    \ references you can use. All are useful.\n\nThe key point is how *direct* the\
    \ code reads. ‘For each of our users, call greet()’. It is simple, clear and concise.\n\
    \nWhat I really like is how this compares to using an index based loop over a\
    \ raw array. Let’s compare that:\n\n```\n 1 // Looping over raw arrays. Just say\
    \ no, again\n 2 User[] users = new User[10];\n 3 users[0] = new User(\"Alan\"\
    );\n 4 users[1] = new User(\"Katy\");\n 5 users[2] = new User(\"Stephanie\");\n\
    \ 6 \n 7 // Please don't code like this. Pretty please.\n 8 for (int i=0; i <\
    \ 3; i++){\n 9   users[i].greet();\n10 }\n```\n\nDoes that work? Sure. Does it\
    \ suck? Oh yes.\n\nThe main problem here - to me - is that all I can see is *mechanism*.\
    \ Loads of detail about exactly how painful it is to run a loop with some array\
    \ indices over some array of User objects that have a greet() method on them,\
    \ then we have to call greet()\n\nWhat I *don’t* see is my original ‘business\
    \ problem’ - ‘greet all the users’. It is clear in the aggregate object using\
    \ forEach().\n\nAnother technical problem is with the loop end condition. I fudged\
    \ it for the example. Can you see how the users array has ten slots? But then\
    \ I only add three users. Can you see how I had to hard code the figure ‘3’ into\
    \ the for loop?\n\nAgain, arrays are just not the tool for the job. *They almost\
    \ never are*. Do not use them where a collection class will do the job better.\n\
    \n## Aggregate methods work on all the things\n\nThis simple rule helps split\
    \ up your code into separate pieces.\n\n*   If the behaviour is on an individual\
    \ object, put it there\n\n*   If the behaviour applies to all objects, put it\
    \ in the aggregate\n\nIn our example, the greet() method in the aggregate Users\
    \ will greet all the Users. The greet() method in individual class User only greets\
    \ that user.\n\n### Common themes\n\nSome common ideas for aggregate methods are:\n\
    \n*   summarise() - create a summary of some common element\n\n*   broadcast()\
    \ - send something to all objects\n\n*   submit() - send off a collection of orders\n\
    \nHow many more can you think of?\n\n# Collaboration\n\nObjects, like people,\
    \ work best when they work together.\n\nDesigning a set of objects to solve a\
    \ problem is a craft, not a science. There are many principles and guidelines\
    \ but no step-by-step plan. You have to craft each solution as you go, working\
    \ through the various trade-offs that present themselves.\n\nLater chapters will\
    \ explore some of these principles in detail. For now, let’s start with the basics.\n\
    \n## Basic Mechanics\n\nJava gives us two basic ways to get objects to work together.\
    \ We can pass an object as a parameter, or we can have an object as a field.\n\
    \nLet’s see them both in code, so we know what they look like. We’ll use two classes,\
    \ Dog and Cat. The Dog wants to chase the Cat. Perhaps not ‘collaboration’ between\
    \ the two pets, but let’s see how we could do it using objects.\n\nWe’ll make\
    \ class Cat have a chase() method:\n\n```\n1 class Cat {\n2     public void chase()\
    \ {\n3         System.out.println(\"I'm off up that tree\");\n4     }\n5 }\n```\n\
    \nThe first way to give the Dog class access to a cat object is to hold it in\
    \ a private field:\n\n```\n 1 class Dog {\n 2     private final Cat cat ;\n 3\
    \ \n 4     Dog( final Cat c ) {\n 5         this.cat = c;\n 6     }\n 7 \n 8 \
    \    public void chase() {\n 9         cat.chase();\n10     }\n11 }\n```\n\nDog\
    \ objects then have a reference to a Cat object, which they can then use in any\
    \ of the Dog methods.\n\nAnother way is to pass the Cat object as a method parameter:\n\
    \n```\n1 class Dog {\n2     public void chase( Cat c ) {\n3         c.chase();\n\
    4     }\n5 }\n```\n\nThis allows the chase method on a Dog object to access the\
    \ Cat object.\n\nThe fact that we can call methods on the object passed in confused\
    \ me the first time I saw it. I had only ever seen primitive values like numbers\
    \ and strings passed into methods before. You just consume them. But when you\
    \ pass an object in, you can call any available method on that object.\n\nIt’s\
    \ important to note that both objects - Dog and Cat, here - have the same equal\
    \ standing. Cat is not an “output parameter”, as you might see in other languages.\
    \ It is a fully-fledged object, with ‘equal rights’ as Dog. See this method signature\
    \ as a true collaboration between equals.\n\n### How to decide: field or parameter?\n\
    \nYou will see both of these techniques used. The key to choosing one over the\
    \ other relates to the lifetime of the objects.\n\n*   If you need the same collaborator\
    \ throughout the lifetime of the using object, choose *field*\n\n*   If you need\
    \ different collaborators on each call, choose *parameter*\n\nThe idea here is\
    \ that by passing in a Cat object as a parameter, you could - if needed - pass\
    \ in a *different* Cat object on each call to Dog.chase(). Using a parameter tells\
    \ the reader of your code that this is what you wanted to allow. This is short-term\
    \ collaboration.\n\nUsing the field approach tells your readers that you are fixing\
    \ on a single Cat for that Dog object’s entire lifetime. This is a long-term collaboration.\n\
    \n## Example: Simple Point of Sale\n\nWe’ll build a couple of classes that let\
    \ us print out a till receipt from a Point of Sale terminal.\n\nWe’ll start our\
    \ code with a simple object representing one line item that we’ve bought. As before,\
    \ we’ll work in an agile, iterative manner. We’ll grow objects out from behaviours\
    \ we want them to have.\n\n```\n1 class Item {\n2     public void print() {\n\
    3         // todo\n4     }\n5 }\n```\n\nFirst things first, we’ll start with an\
    \ Item that can print itself.\n\nThat’s already making me think about the design.\
    \ What should print actually do? We’ve gone for a void/void signature for now,\
    \ as we’re exploring the solution. But it’s going to need access to something\
    \ that can print in some way - unless it can do the job without help.\n\nThe way\
    \ to decide is to have a clear vision of what we decide each object should be\
    \ doing. That’s our decision as software engineers.\n\nLater chapters covering\
    \ Test Driven Development and the SOLID principles will make this decision easier\
    \ to make. But for now, let’s decide that Item only knows *what* should be printed\
    \ on the receipt and not *how* to print it."
