    \ *where* each big idea splits apart and not *how* it is done. The how is, of\
    \ course, very important. It is just less important than the structure of a program.\
    \ Adding the ‘how’ can be done later.\n\nIf you have programmed in a lower level\
    \ language, or are newer to programming, you’ll probably recognise this as ‘backwards’\
    \ thinking. We are used to diving in with the details. I used to approach coding\
    \ that way. I would dive right in with a big “shopping list” of detailed instructions.\n\
    \nThis leads to hard to understand code. As we read it, we have to reverse engineer\
    \ what is being done. By making our design explicit, we can directly read out\
    \ the ‘what’. It goes right back to the start of the book - our idea that ‘clearScreen()’\
    \ is a lot easier to understand than the binary code of how a screen is cleared.\n\
    \nSame here. We prevent that mess by designing OOP behaviours first.\n\nAnyway,\
    \ tea break over: back to the coding. We have only one Item on our receipt. Let’s\
    \ create an aggregate class that represents our full receipt:\n\n```\n1 class\
    \ Receipt {\n2     public void print () {\n3         // todo\n4     }\n5 }\n```\n\
    \nThe first behaviour I can think of is print().\n\nOnce again, we’ll get back\
    \ to the details of print after checking back with our requirements. But we know\
    \ that it will collaborate in some way with our Item objects to print them out.\
    \ We also recall our previous design of Item. It has a print() method that takes\
    \ a Printer object.\n\nLet’s assume that the same Printer object is used to print\
    \ out the entire receipt. On that basis, a reasonable design decision is to pass\
    \ in a Printer object in the constructor of receipt and store it in a field for\
    \ use:\n\n```\n 1 class Receipt {\n 2     private final Printer printer ;\n 3\
    \ \n 4     public Receipt( Printer p ) {\n 5         this.printer = p;\n 6   \
    \  }\n 7 \n 8     public void print () {\n 9         // todo - using field 'printer'\n\
    10     }\n11 }\n```\n\nMore progress. Our receipt will be able to print itself.\n\
    \nBut it needs something to print! We’ll give it a way to add items on our receipt:\n\
    \n```\n 1 class Receipt {\n 2     private final Printer printer ;\n 3 \n 4   \
    \  public Receipt( Printer p ) {\n 5         this.printer = p;\n 6     }\n 7 \n\
    \ 8     public void add(String description, Money price) {\n 9         // todo\n\
    10     }\n11 \n12     public void print () {\n13         // todo - using field\
    \ 'printer'\n14     }\n15 }\n```\n\nAnother step forward.\n\nI’ve made a design\
    \ decision in the method signature of add(). It is based on the requirements.\
    \ The method takes two value parameters - the item description as a String and\
    \ its price as a Money object. I’ve chosen this over passing in an Item object.\
    \ Maybe I’ll change my mind on that later.\n\nFor now, the thinking is that Item\
    \ will stay private to this cluster of classes to reduce coupling on callers.\
    \ Coupling is the technical term for how connected different pieces of code are.\n\
    \nA Money class is needed, but it can be empty for now. The code only has to compile\
    \ at this stage:\n\n```\n1 class Money {\n2     // TODO\n3 }\n```\n\nWe’ll create\
    \ a list of Item objects inside our receipt and add to them using add():\n\n```\n\
    \ 1 class Receipt {\n 2     private final Printer printer ;\n 3     private final\
    \ List<Item> items = new ArrayList<>();\n 4 \n 5     public Receipt( Printer p\
    \ ) {\n 6         this.printer = p;\n 7     }\n 8 \n 9     public void add(String\
    \ description, Money price) {\n10         items.add( new Item(description, price)\
    \ );\n11     }\n12 \n13     public void print () {\n14         // todo - using\
    \ field 'printer'\n15     }\n16 }\n```\n\nThere’s another design decision here.\
    \ When we create an Item object, it now needs a constructor. We’ll pass description\
    \ and price into that, giving our Item object knowledge of what it needs to print:\n\
    \n```\n 1 class Item {\n 2     private final String description;\n 3     private\
    \ final Money price ;\n 4 \n 5     public Item( String description, Money price\
    \ ) {\n 6         this.description = description;\n 7         this.price = price;\n\
    \ 8     }\n 9 \n10     public void print( Printer p ) {\n11         // todo\n\
    12     }\n13 }\n```\n\nAfter adding the constructor, I added the fields to hold\
    \ the knowledge of description and price. I marked them as final to make this\
    \ an ‘immutable value’ object. Immutable means the value will not change. That\
    \ makes systems easier to reason about - and safer to use in concurrent environments\
    \ like web servers.\n\nWorking backwards like this, you give your IDE like IntelliJ\
    \ all the clues it needs to offer to write the code.\n\nFrom typing ‘new Item(description,\
    \ price)’ in the Receipt class, it will offer to create a constructor in Item\
    \ with the correct parameter names and types. From here, the IDE will offer to\
    \ add the correct fields with correct names and types in Item.\n\nTake full advantage\
    \ of that IDE help! I always do.\n\nWe’re getting there now. The next job is to\
    \ fill in some details on this printing. Let’s start outside-in, so we stick with\
    \ big picture ideas first:\n\n```\n 1 class Receipt {\n 2     private final Printer\
    \ printer ;\n 3     private final List<Item> items = new ArrayList<>();\n 4 \n\
    \ 5     public Receipt( Printer p ) {\n 6         this.printer = p;\n 7     }\n\
    \ 8 \n 9     public void add(String description, Money price) {\n10         items.add(\
    \ new Item(description, price) );\n11     }\n12 \n13     public void print ()\
    \ {\n14         items.forEach(item -> item.print(printer));\n15     }\n16 }\n\
    ```\n\nWe’ve added a Java 8 lambda style line to print out all items. It uses\
    \ the ‘Tell Don’t Ask’ style to go through all Item objects and ask each one to\
    \ print itself. We pass into that print method the Printer object we supplied\
    \ in the constructor of Receipt.\n\nThis is an example of good collaboration design.\n\
    \nWe’re not pulling data out of objects using getters and setters. We’re not even\
    \ thinking of ‘data’. Well, I’m not. I think of price and description as ‘secret\
    \ knowledge’ that the Item is responsible for keeping to itself. Sure, that’s\
    \ a bit of word-play; but it helps me see OO design as being driven by behaviours\
    \ and not pure data.\n\nThis is still a big picture idea. Receipt does not know\
    \ anything about how Item objects look nor handle printing. It only knows that\
    \ there are zero or more Item objects and that they can be asked to print. It’s\
    \ really quite a simple, descriptive way to create code.\n\nThe next step for\
    \ me is to follow that chain of behaviour starting at print and stripe that through\
    \ this slice. I like to build software as a series of working slices of code like\
    \ this. At the end of each iteration, you don’t have all the features. You don’t\
    \ have complete layers of the system either. What you do have is working software\
    \ you can demonstrate to stakeholders. That’s valuable."
