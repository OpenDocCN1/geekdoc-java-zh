  trans: "\n集成测试将几部分代码组合在一起，并将它们作为一个整体进行测试。通常，这些代码片段中的某些是外部系统。因此，你可能会针对运行中的数据库对某些业务逻辑进行测试。\n\
    \n端到端测试扩展了这一概念。你连接整个系统，并像用户一样对其测试。你驱动用户界面，并在实际数据库和真实的网络服务上运行。整个过程尽可能地“真实化”。\n\n\
    契约测试（Contract tests）非常有意思。它们将测试分为两个方向。它们被用于拆解针对外部服务的测试。\n\n通过这些测试，你将进行两次测试。首先，你测试你的应用程序逻辑是否可以正确地调用服务的存根（stub）。这就是“测试契约”的含义——你的应用程序与与其通信的任何对象之间的契约。\n\
    \n其次，你测试与外部服务通信的代码之间的契约，并确保它确实进行了正确的通信。\n\n还有浏览器测试，它是端到端测试的一种形式，使用特殊的网络浏览器。你可以编写脚本来模拟鼠标移动、点击和击键，就像你是一个真实的用户一样。它能够捕发送到浏览器的\
    \ HTML 和数据以便检查。\n\n每一层测试都会变得越来越棘手。集成测试比单元测试慢，因为它必须设置并控制外部系统。端到端测试更慢。它们编写起来也更困难。\n\
    \n最糟糕的问题关于测试的**重复性**（repeatability）。我们希望测试在代码正确时始终通过，在代码不正确时失败。\n\n遗憾的是，高层测试往往是“**不稳定的**”（flaky）。代码可能是正确的，但外部系统中的某些问题可能仍会导致测试失败。这通常是一些简单的问题，例如数据库中存在错误的数据，或者响应缓慢。\n\
    \n不稳定的测试也由间歇性问题引起。诸如网络故障和数据库连接限制等都是这些问题。\n\n举个例子，一个特别难诊断的问题是针对搜索网络服务的集成测试。该服务位于负载均衡器之后。\n\
    \n在测试环境中，负载均衡器被设置为轮询模式。我们有两个该服务的测试实例。负载均衡器会将请求路由到服务 1，然后将下一个请求路由到服务 2。至少`it did`\
    \ 是这样——直到一个服务在没有人告诉我们的情况下被关闭了。哎。\n\n所有的集成测试先通过后失败，先通过后失败，像时钟一样精准运行。\n\n这完全是因为从测试路由到一个正常服务和一个宕机服务的\
    \ 50/50 概率。\n\n你也可以想象，在这些不同层级的测试之间可能存在测试重复。\n\n一个确认某种用户选项可用的小型单元测试可能会被复选框的浏览器测试所重复。\n\
    \n与所有的重复一样，都是一个问题。它让更改变得更困难，理解也更困难。\n\n拥有支持高层测试的真实化测试环境也有问题。托管成本会增加，因为我们需要专门的测试机器。如果我们的测试数据涉及真实人物，可能会出现数据保护和隐私问题。而且缓慢的运行速度阻碍了开发。\n\
    \n测试金字塔是一个简单的视觉辅助。它提醒我们主要使用快速的单元测试。在需要的地方用较慢、不稳定的集成测试来支持。但数量不要那么多。然后更少的浏览器和端到端测试。\n\
    \n通过尽可能减少系统中缓慢的、可能间歇性失败的测试数量，我们最大化了我们的测试能力。我们提高了速度并更早发布。\n\n所以，如果慢的测试并不理想，显而易见的解决方案是避免这个问题并使用更多的\
    \ FIRST 单元测试。\n\n如果如果没有那些讨厌的外部系统……\n\n## 移除外部系统\n\n当然，我们不能直接丢掉数据库和键盘。我们的程序将无法工作。\n\
    \n但我们可以从大部分代码中消除这些细节。我们已经知道如何做到这一点。我们可以使用依赖倒置原则。\n\n让我们看看从我们的 `NotFaceBook` 应用中移除数据库依赖。\n\
    \n我们的 `NotFaceBook` 系统需要根据登录的用户 ID 查找用户配置。我们可以根据用户存储的任何内容显示配置页面。\n\n从表面上看，这需要数据库代码。它确实需要。用户将他们的配置数据存储在数据库中：名称、个人自拍和最喜欢的猫照片。我们的代码必须从那里提取。\n\
    \n那就是我们如何做到的“方式”（how）：实现细节。\n\n但在高层上，我们实际上在做什么（what）呢？\n\n我们正在通过用户 ID 查找一个 `User`\
    \ 对象。我们可以假设 `User` 对象知道如何将其配置信息作为内部知识提供。\n\n我们可以将其代码化：\n\n```\n1 interface UserRepository\
    \ {\n2     User findUserById( String userId );\n3 }\n```\n\n`UserRepository` 是一个接口，允许我们的代码访问\
    \ `User` 及其配置信息，而无需了解数据库的任何知识。\n\n我们可以编写不同的实现。我们可以很容易地编写一个与文件通信的实现，也可以编写一个与 Postgres\
    \ 数据库通信的实现。或者 MongoDB。我们甚至可以编写一个测试存根，返回固定的已知数据。\n\n我们在这里使用 `Repository` 一词是用最通用的方式来描述“以某种方式存储、生成和获取\
    \ `User` 对象的任何东西”。我们使用它是为了表明精确的存储细节并不重要。\n\n也许它甚至没有被存储。例如，在某些游戏中，`userID` 值可能被用来动态`生成`（generate）该配置信息而不是存储它。这仍然是一个“仓库”。\n\
    \n我们可以像这样在调用代码中使用它：\n\n```\n 1 class NotFaceBook {\n 2     private final UserRepository\
    \ users ;\n 3     private final Display display ;\n 4 \n 5     public NotFaceBook(\
    \ UserRepository users, Display display ) {\n 6         this.users = users ;\n\
    \ 7         this.display = display;\n 8     }\n 9 \n10     public void showProfile()\
    \ {\n 11         String userId = \"almellor_1901\";\n 12         \n 13       \
    \  User u = users.findUserById( userId );\n 14         \n 15         u.displayProfile(display);\n\
    \ 16     }\n17 }\n```\n\n我们通过构造函数注入其中一个具体的实现。\n\n你可以看到 `UserRepository` 是一个抽象。它是在数据库中查找用户的本质。输入\
    \ `UserId`，输出 `User` 对象。这是一个经典的依赖倒置。\n\n我们的应用程序代码——`NotFaceBook` 类不再依赖数据库细节。它只于抽象。\n\
    \n这使得单元测试变得简单。我们可以简单地创建一个 `StubUserRepository` 类，它总是返回一个代表性的 `User` 对象。存根根本不会接触数据库。\n\
    \n这带给了我们 FIRST 测试的所有优点。它避免了数据库测试的问题。\n\n真实的数据库测试很慢而且容易出错。你往往会遇到几个问题：\n\n*   你的测试代码意外连接到了真实的数据库。噢。在测试\
    \ `deleteAllUsers()` 时是灾难性的。\n\n*   测试数据库中没有你提供的 `UserId`。测试将作为假阴性失败。代码是正确的，但数据是错误的。\n\
    \n*   添加数据的测试第二次会失败。第一次，“User1”不存在并被插入。第二次，数据库拒绝插入：“User1 已存在。主键冲突：UserId”。\n\n\
    通过使用简单的内存存根，所有这些问题都消失了。相反，我们得到了：\n\n*   大部分系统处于快速单元测试之下\n\n*   清晰的领域模型——系统的“本质”\n\
    \n*   可能的“由内而外”、实验方法\n\n*   简化了数据库和 Web 服务器技术的更改\n\n## 六边形模型\n\n你可以看到我们的代码现在由两个部分组成。应用程序逻辑，没有外部系统。然后是外部系统，没有应用程序逻辑。\n\
    \n我们给这些部分命名：\n\n*   领域层 - 应用程序逻辑，没有外部系统\n\n*   适配器层 - 外部系统，没有应用程序逻辑\n"
- fmt: "\nGraphically, we can draw this as two concentric hexagons.\n\nThe inner hexagon\
    \ is our domain layer. These are pure application classes. The domain layer is\
    \ where application logic and our abstractions of external systems live - interfaces\
    \ like `UserRepository`.\n\nThe outer hexagon contains the adapter classes. They\
    \ hold the details of talking to the external systems, implementing those interfaces.\n\
    \nWe use hexagons so that each outer face can represent one external system. Mosts\
    \ code has no more than six external systems it talks to. Hexagons are easy to\
    \ draw. They make a good general-purpose graphical template.\n\n![](resources/hexarch.png)\n\
    \n# Hexagonal Architecture\n\nWe have two simple rules to get the design right:\n\
    \n* The `Adapter Layer` implements interfaces and uses classes from the `Domain\
    \ Layer`. It may depend on the domain layer.\n* The `Domain Layer` MUST NOT use\
    \ classes from the `Adapter Layer`.\n\nThe domain layer knows nothing about the\
    \ adapter layer. There are no dependencies at all on external systems. They simply\
    \ do not exist in our domain layer. There is not a single reference to a database,\
    \ web server or anything else. It knows only about business logic - the core of\
    \ our problem.\n\nThis aids readability and testing.\n\nThe adapter layer is the\
    \ only place where details of the external systems appear. This is the place for\
    \ complicated SQL statements, HTTP calls, HTML templating and the like.\n\nThis\
    \ split helps us limit what code needs to change if we change technology in an\
    \ external system.\n\nWant to change a SQL database like `Postgres` for a NoSQL\
    \ one like `Mongo`? You write a new adapter class and inject it in. Your domain\
    \ layer stays unchanged. The domain layer tests stay unchanged. This is a huge\
    \ benefit.\n\nHexagonal Architecture relies on polymorphism and the SOLID principles\
    \ to work. The `Adapter Layer` implements interfaces that are fully substitutable\
    \ because they obey `LSP`. Each adapter class does only one thing, following `SRP`.\
    \ The `Domain Layer` is then open to changes in external systems without needing\
    \ modification. It obeys `OCP`.\n\n## Inversion / Injection: Two sides of the\
    \ same coin\n\nIn casual talk, developers say about `Dependency Injection` and\
    \ `Dependency Inversion` as if they were the same.\n\nThey’re not. But the two\
    \ are closely related.\n\nDependency `Inversion` happens at design time. That’s\
    \ when we create abstract interfaces like `UserRepository`.\n\nDependency `Injection`\
    \ happens at run time. That’s when we pass implementations like `PostgresUserRepository`\
    \ to calling code consuming a `UserRepository` interface.\n\nThey combine together\
    \ in Hexagonal Architecture to make an extensible, testable system.\n\n# Handling\
    \ Errors\n\nWouldn’t it be great if everything went to plan?\n\n…And you’re back\
    \ in the room. Real life is messy. Things go wrong.\n\nSoftware designs get their\
    \ fair share of the unexpected, too.\n\nConfused users, deliberate attacks and\
    \ hardware failures are all things that mean business as usual will not be happening\
    \ today.\n\nThe question is ‘what do we do about that?’\n\n## Three kinds of errors\n\
    \nWhilst a whole book could be written about ‘stuff that goes wrong in computer\
    \ systems’, all errors boil down to one of three types:\n\n* Errors we can fix\n\
    * Errors we can’t fix\n* Errors we don’t care about\n\nExamples of each kind would\
    \ be ‘User typed wrong number’ (ask again), ‘Disk drive has crashed and lost all\
    \ data’ (oops. Bad luck), ‘Temperature sensor not working, when temperature feature\
    \ is off’ (ignore).\n\nDetecting an error is one thing. But then we must let our\
    \ software know about it. We need a mechanism to do that.\n\nJava and OOP have\
    \ several ways available. Each has its own trade-offs.\n\nLet’s use a running\
    \ example of our `UserRepository`. The `User findUserById(id)` method should always\
    \ return one and only one `User` object. The `User` object has one method `showProfile()`,\
    \ which displays profile information - on a good day.\n\nTo keep code samples\
    \ small, we’ll only show the method in isolation, and it will only return the\
    \ error case. Don’t go looking for the ‘happy path’ code, because there isn’t\
    \ any.\n\nHow can we tell calling code that something went wrong?\n\n## The null\
    \ reference\n\nIn the beginning, there was `null`. And the `null` was shapeless.\
    \ And dangerous. And the `null` filled the Java landscape …\n\n```\n1 User findUserById(\
    \ String userId ) {\n2     return null ;\n3 }\n```\n\nWe’ve all seen this. It\
    \ is baked deep into Java since `Java 1.0`.\n\nThe concept of `null` was invented\
    \ by Computer Science luminary Tony Hoare. He also invented `Quicksort`, which\
    \ was a good idea. Unlike `null`.\n\nTony described `null` as his ‘billion-dollar\
    \ mistake’.\n\nReturning `null` is ok, in theory. The method either returns a\
    \ valid `User` object if one is available or returns `null`.\n\nCalling code must\
    \ check for the `null` return and decide what to do.\n\nThe problems with this\
    \ include cluttering up the code with error paths, all those extra `if` statement\
    \ paths to write and test - and the chance of forgetting the test.\n\nIf `findUserById(id)`\
    \ returns `null`, any further access will spectacularly fail:\n\n```\n1   User\
    \ u = users.findUserById( \"alan0127\" );\n2   u.showProfile(); // BLOWS UP if\
    \ u is null with NullPointerException\n```\n\nReturning `null` complicates calling\
    \ code with two paths. It is an accident waiting to happen. You will forget to\
    \ check for `null` at some point. You will. You know you will. I know you will.\
    \ I know I have!\n\nEverything that follows is a rather desperate attempt to design-out\
    \ the bugs caused by unhandled `null` references.\n\n## Null object pattern\n\n\
    A reasonable attempt was proposed by Bobby Woolf in 1998\\. Known as the `Null\
    \ Object Pattern`, this uses polymorphism to return one of two objects. Either\
    \ the valid `User` or a `NullUser` object will be returned:\n\n```\n1 User findUserById(String\
    \ id) {\n2     return NullUser();\n3 }\n```\n\nNullUser` is fully (LSP) substitutable\
    \ for `User`. We can do this either by having `User` as an interface and creating\
    \ `RealUser` and `NullUser`. Or, we can simplify a bit and create a `User` class\
    \ with a `NullUser` subclass.\n\nEither way, `NullUser` has a ‘no action’ method\
    \ for `showProfile`:\n\n```\n1 class NullUser extends User {\n2     public void\
    \ showProfile() {\n3         // No Action\n4     }\n5 }\n```\n\nThis simplifies\
    \ code - our big goal - by eliminating a conditional branch. That simplifies TDD\
    \ testing. All of that speeds up reading and understanding this.\n\n## Zombie\
    \ object\n\nThere’s something a bit grubby about `NullUser`, though: That whole\
    \ subclass thing.\n\nI’ve heard complaints from pairs that “We only need one class\
    \ and now you’re adding two or three! Come on, Al - keep it simple!”\n\nIt’s a\
    \ fair point. Although you can argue that you *don’t* only need one class. You\
    \ are representing two separate ideas - a User that exists and one that doesn’t.\n\
    \nBut arguing with your pair is all a bit tawdry, really. So let’s go and make\
    \ a nice hot cup of tea each, and have another think.\n\nWhat else could we do?\n\
    \nThe ‘Zombie object’ is so named because the way it represents `null` is to be\
    \ ‘the walking dead’: The outside of the object looks normal, but the insides\
    \ are bad.\n\nWe must modify our `User` class to add a ‘zombie detection’ method:\n\
    \n```\n1 class User {\n2     boolean isValid() {...}\n3 \n4     void showProfile()\
    \ {...}\n5 }\n```\n\nThe `isValid()` method tells us whether the object has valid\
    \ data or not. If `isValid()` returns false, you must not use the object. You\
    \ must check this first - every time you use the object.\n"
