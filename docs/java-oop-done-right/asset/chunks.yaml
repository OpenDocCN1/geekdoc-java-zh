  trans: "\n\n```java\nclass TaxBand {\n    private final Money lowerLimit ;\n   \
    \ private final Money upperLimit ;\n    private final BigDecimal percentage ;\n\
    \n    public TaxBand(Money lowerLimit, \n                   Money upperLimit,\
    \ \n                   BigDecimal percentage) {\n        this.lowerLimit = lowerLimit\
    \ ;\n        this.upperLimit = upperLimit ;\n        this.percentage = percentage\
    \ ;\n    }\n\n    public void apply( Money amount, Money totalTax ) {\n      \
    \  if ( amount.atOrAbove(threshold) ) {\n            totalTax.add( calculateTax(amount)\
    \ );\n        }\n    }\n\n    private Money calculateTax( Money amount ) {\n \
    \       Money taxableAmount = amount.subtract( lowerLimit );\n        return taxableAmount.multiply(\
    \ percentage );\n    }\n}\n```\n\n这是一个 `Rules` 对象。你调用 `apply()` 方法传入要计算税额的金额，并传入一个\
    \ `CollectingParameter` 来收集总税额。\n\n每个 `TaxBand` 对象在构造时都包含了应用该特定规则所需的秘密（参数）。\n\n\
    在这种设计中，`TaxBand` 对象是可链的。我们可以添加一个 `chain(TaxBand next)` 方法——在内部形成 `Tax Bands` 链表——或者创建一个名为\
    \ `TaxBands` 的 `Aggregate` 对象。在这种情况下，这两种方法读起来都很自然，所以随你选择。我稍微倾向于 Aggregate 的方法，因为它更彻底地分离了“一个”和“多个”的关注点。\n\
    \n在许多系统中，规则是可配置的。一个限制屏幕时间的规则可能会配置一个最大持续时间。这通常通过配置设置一个简单变量来实现。\n\n当 `behaviour`\
    \ 本身需要配置，而不仅仅是某些阈值值时，Rules 对象变得非常有用。\n\n示例：访问控制、留存策略、业务流程规则。\n\n## Aggregate（聚合根）\n\
    \n[DDD] 代表一组对象以及适用于所有这些对象的行为\n\n`Aggregate` 对象在之前的章节中介绍过。`User` 类代表一个用户。`Users`\
    \ 类代表一组用户。\n\n它们封装了单对象集合。行为是组操作中共有的部分。方法对集合中的所有对象进行操作。\n\n## Cache（缓存）\n\n加速对缓慢或获取昂贵的对象的访问\n\
    \n许多系统最终都会从其他地方获取数据，通常是数据库或 Web 服务。这些内容位于网络连接的另一端。这使得获取数据的速度比在本地对象内部慢五六个数量级。\n\
    \n我们无法简单地避免调用这些远程数据。无论喜不喜欢，数据就住在那里。\n\n我们能做的是尽可能减少远程调用的频率。我们通过保留一个更新的本地对象副本来实现。\n\
    \n`Cache` 是我们给这种想法的名字。一个简单的缓存是最近使用的对象映射：\n\n```java\ninterface UserRepository\
    \ {\n    User findUserById( String userId );\n}\n\nclass UserCache implements\
    \ UserRepository {\n    private final Map<String, User> cache = new HashMap<>();\n\
    \    private final UserRepository repository ;\n\n    public UserCache( UserRepository\
    \ r ) {\n        this.repository = r\n    }\n\n    public User findUserById( String\
    \ userId ) {\n        if ( cache.containsKey( userId ) ) {\n            return\
    \ cache.get( userId );\n        }\n\n        User user = repository.findByUserId(\
    \ userId );\n        cache.put( userId, user );\n        return user;\n    }\n\
    }\n```\n\n这实际上是设计模式的“买一送二”：一个 `Repository`、一个 `Decorator` 和一个 `Cache`。我们甚至还引入了一些\
    \ LSP（里氏替换原则）。让我们逐一解释这些，看看为什么它们在这里是完美的结合。\n\n`Cache` 的部分是名为 `cache` 的 `HashMap`。\n\
    \n它被用于在简单的查找表中根据 `userId` 存储用户。给定一个 `userId`，我们可以检查 `cache` 变量，查看我们是否已经在其中存储了相关的\
    \ `User` 对象。`findUserById()` 方法的前三行就是这么干的。如果 `User` 存在于我们的缓存中，我们就直接返回它。\n\n这是缓存的核心优势——我们直接返回一个本地对象。我们避免了到\
    \ `UserRepository` 那次缓慢的往返。\n\n如果缓存中不存在该 `User`，那么意味着我们之前没有请求过该 `userId`。因此，我们去访问\
    \ `UserRepository`。我们获取 `User` 对象，将其存入 `cache`，然后返回。下一次我们请求该 `userId` 时，它将从缓存中返回。\n\
    \n缓存常用于加速缓慢的操作。`Repositories` 和外部系统通常都能受益于 `Cache`。\n\n尽管如此，它们很难设计得很好。\n\n我们的简单示例有两个严重的问题：\n\
    \n-   **无更新**：我们从不获取缓存 `User` 的更新。\n-   **无驱逐**：用户被永久缓存。内存将耗尽。\n\n这两个问题都是 `cache\
    \ invalidation`（缓存失效）的一部分，即标记缓存项为不再有效的的行为。\n\n在生产环境中，真实的缓存处理这些问题会变得越来越复杂。\n\n\
    你经常会看到一个关联的 `Rules` 模式对象来描述何时清除缓存。流行的选择包括最近久未使用（LRU），它要求在缓存对象旁边存储一个时间戳；以及更简单的最近缓存（Most\
    \ Recent），我们只为缓存最后 N 个项目留出空间。\n\n人们说计算领域有四件难事：并发、缓存失效和差一错误……至于另外两个模式，我们正在使用 `Repository`\
    \ 来抽象如何存储 `User` 对象。我们之前已经讨论过这个。\n\n我们还在使用 `Decorator` 模式，该模式在 [GoF] 《设计模式的 GoF》书中首次提到。这是一个非常有用的模式，值得我们单独分出一个章节。我们接下来就做这一点。\n\
    \n## Decorator（装饰器）\n\n[GoF] 以可替换的方式向对象添加功能\n\n`Decorator` 为我们提供了一种在不改变该类的情况下向类添加功能的方法。它是该类的包装器，类似于\
    \ `Adapter`。它与 `Adapter` 的区别在于新类可以替换原始类。它是完全符合 LSP 的。\n\n这意味着调用代码可以接收原始类，也可以接收被装饰的类，而无需更改。\n\
    \n在对 Cache 模式的解释中，正因为这个原因，我们在 Repository 对象周围使用了一个装饰器（Decorator）：:\n\n```java\n\
    interface UserRepository {\n    User findUserById( String userId );\n}\n\nclass\
    \ UserCache implements UserRepository {\n    private final UserRepository repository\
    \ ;\n\n    public UserCache( UserRepository r ) {\n        this.repository = r\n\
    \    }\n\n    public User findUserById(String userId) {\n        // 在这里添加额外功能\n\
    \n        User user = repository.findByUserId( userId );\n\n        // 在这里添加额外功能\n\
    \        return user;\n    }\n}\n```\n\n这是相同的代码示例，但只保留了与 `Decorator` 相关的部分。与缓存相关的函数已被移除，因为它们不属于装饰器模式本身。这简单得多。\n\
    \n判断其为 `Decorator` 的特征是：接收 `UserRepository` 对象的构造函数，以及实现 `UserRepository` 的类。\n\
    \n它既可以作为 `UserRepository` 的替代品，又可以访问自身——始终是一个不同的对象实例。在这里，你可以想象有一个 `MySqlUserRepository`\
    \ 实例传递给 `UserCache`。最终仓库本身是可替换的。\n\n这个对象允许我们装饰 `UserRepository` 并赋予其额外功能。在这里，它是通过哈希映射来本地缓存\
    \ `User` 对象。只有当我们本地没有这些对象时，才会进一步访问我们真实的 `UserRepository`。\n\n装饰器的其他常见用途是实现对被装饰对象的访问控制或日志记录。日志记录在生产系统中至关重要。它是你监控系统正常运行的唯一方式——并在系统在凌晨两点崩溃时诊断发生了什么。\n\
    \n"
- fmt: "\nAnother use is when a framework hands you one of its own objects, and you\
    \ need extra application-specific features. You cannot change the framework code,\
    \ so wrapping it with a `Decorator` can often help.\n\nExamples: `Cache`, `Access\
    \ Control`, `Production Logging`, `Extending Frameworks`\n\n## External System\
    \ (Proxy)\n\n[GoF] Represents our view of an external system locally\n\nExternal\
    \ Systems are a challenge for our applications. They always need some kind of\
    \ raw data transfer between them, somehow mapping to our objects. Because these\
    \ systems live outside our memory space, communication will be much slower. It\
    \ can often be 100,000 times slower than calling a method locally.\n\nDealing\
    \ with these challenges is simpler when we introduce a local object to represent\
    \ that external system.\n\nThe best way to deal with an external system is to:\n\
    \n* Create an interface to represent it\n* Use only our domain terms to abstract\
    \ the details away\n\nWe covered this fully in the chapter on Hexagonal Architecture.\
    \ This is the pattern behind it.\n\nAn `External System` object is powerful because\
    \ it decouples us from the details of that system. This gives us several possibilities.\
    \ We can use a `stub` for testing. We can create simple `Fakes` to help us split\
    \ up development across our team. We can wrap the system with things like a `Cache`,\
    \ or logging or monitoring.\n\nSpecifically, an external system object represents\
    \ `only what we need` of that system. `Google Maps`, as one example, has a large\
    \ number of useful features. But if all we needed was the ability to get the name\
    \ of the nearest town to a point, then our interface will be:\n\n```\n1 interface\
    \ Geography {\n2     String getNameOfTownNearestTo( float lat, float long );\n\
    3 }\n```\n\nOf course, we would create a `GoogleMapsGeography` object that implements\
    \ this interface and actually connects to `Google Maps API` over HTTP.\n\nThis\
    \ is part of a larger, very useful design idea known as `consumer driven contracts`.\n\
    \nThe idea is that all that matters is what a specific client needs. You can use\
    \ this to drive out required behaviours of servers, outside-in, based on what\
    \ is actually needed - not what ‘might be nice to have’.\n\nThe original pattern\
    \ I saw was `Proxy` in `[GoF]`. That was a more general kind of object. It had\
    \ the same interface as some other object and stood in place of it. In my work,\
    \ `Proxy`’s overwhelming use has been to represent an external system, so I prefer\
    \ to think of it as above.\n\n## Configuration\n\n[Own] Gives a way to change\
    \ how the system is set up\n\nOnce an Object Oriented program starts doing useful\
    \ work, it will need various things setting up, both at start up and throughout\
    \ its runtime.\n\nAt start up, it will need all its objects creating as instances\
    \ of classes. All the various dependencies need injecting. `URLs` of external\
    \ web services need to be provided. The connection string and address of our databases\
    \ need providing.\n\nThese kinds of things are often specific to the environment\
    \ we run in. The database string will be different when we are using the test\
    \ database as to when we run in production. The web service URL might point to\
    \ a fake server made with `WireMock`, rather than the real service on the web.\n\
    \nEven the `kinds` of object may change. We might have a setting in a file to\
    \ use either an `Oracle` database or `Microsoft SQL Server`. A different object\
    \ might need to be created in each case, then injecting into all its callers.\n\
    \nWe call this `Configuration`. It includes setting data values like `URLs`, creating\
    \ specific objects and ‘object wiring’ - inject dependencies between objects.\n\
    \nThe best place to put all this is in a `Configuration` class:\n\n```\n 1 class\
    \ Configuration {\n 2     private boolean useOracle;\n 3     private String jdbcConnectionString;\n\
    \ 4     private boolean useDarkMode;\n 5     private Date offerExpiryDate ;\n\
    \ 6 \n 7     public void load() {\n 8         // Code to read a configuration\
    \ file, or server\n 9     }\n10 \n11     public UserRepository userRepository()\
    \ {\n12         if ( useOracle ) {\n13             return new OracleUserRepository(jdbcConnectionString);\n\
    14         }\n15 \n16         log(WARN, \"Using STUB User Repository - TEST/QA\
    \ ONLY\");\n17         return new StubUserRepository();\n18     }\n19 \n20   \
    \  public UiStyleScheme styleScheme() {\n21         return useDarkMode? \n22 \
    \            new UiStyleDark() :\n23             new UiStyleLight() ; \n24   \
    \  }\n25 \n26     public Date getOfferExpiryDate() {\n27         return offerEXpiryDate\
    \ ;\n28     }\n29 }\n```\n\nGives the basic idea. `Configuration` is held `somewhere`\
    \ then read in. Based on this data, the right kinds of objects are created for\
    \ use elsewhere. The rest of the code refers to this `Configuration` object to\
    \ get its dependencies and values.\n\nThe actual configuration data is stored\
    \ typically a `config.json` kind of file, or perhaps a database at a fixed location,\
    \ or a web service. Some providers like `Spring Cloud` use network broadcasts\
    \ to discover the configuration server at run time.\n\nOnce read in, the methods\
    \ on the `Configuration` object can be used to create the specific objects needed.\
    \ They can be initialised with the required values of things like `URLs`, timeouts\
    \ and connection strings.\n\nOften, whole objects can be created here. That leads\
    \ to nice clean code. But I have added a getter to return a pure data value. `Configuration`\
    \ classes are one place where that can often be a good idea, resulting in the\
    \ clearest code.\n\nAs the application grows, it makes sense to split into multiple\
    \ `Configuration` classes.\n\nThese can align with your `Hexagonal Architecture`\
    \ so that each subsystem gets its own `Configuration` object. You will probably\
    \ end up having a `Configuration` interface in your domain layer, then writing\
    \ a specific `Adapter` for it to link it up to your source.\n\nI’ve also shown\
    \ a common idea where we normally use the Oracle database in production, but we\
    \ can enable a test stub in our configuration file.\n\nThis simplifies development\
    \ across a team. The QAs can do their exploratory testing of new UI changes without\
    \ needing a database connection. The other devs who are not working on the Oracle\
    \ Repository can get on with their work.\n\nThis particular piece of design is\
    \ as much about team leadership and management as it is about clean code.\n\n\
    ## Order-OrderLineItem\n\n[Coad] Gives structure to a list of items on an order\n\
    \nOrders crop up everywhere in commercial systems. You’ll routinely see point\
    \ sale receipts, invoices, bills of materials and e-commerce customer orders.\n\
    \nEach one has the same basic pattern.\n\nThere is a line item describing the\
    \ single thing that has been ordered. Typically, it knows about some combination\
    \ of values: quantity, part code, description, price, tax, location. This, plus\
    \ suitable behaviours, go into the `OrderLineItem` object.\n\nAs orders often\
    \ have more than one line item, we aggregate these into an `Order` object, describing\
    \ the total order. That often knows about the time it was placed, delivery and\
    \ billing details, related accounts. Typical behaviours on `Order` are display,\
    \ takePayment and place, which moves the order onto fulfilment.\n\n`Order-OrderLineItem`\
    \ is simply a specific use case for the more general `Aggregate` object idea.\
    \ But it’s so common it’s worth pointing out.\n\n## Request-Service-Response\n\
    \n[Own] Describes a flow to get a response from a service\n\nThis crops up a lot\
    \ in `Hexagonal Architecture` designs. It is the ‘inner hexagon’ domain model\
    \ of a web request - without any reference to web technologies. As such, you can\
    \ use it with any kind of input and output adapters. It represents a general request\
    \ to a system.\n\nTo carry on our running theme, let’s show how this can be used\
    \ to find a user by their `id`.\n"
  raw: "Another use is when a framework hands you one of its own objects, and you\
    \ need extra application-specific features. You cannot change the framework code,\
    \ so wrapping it with a Decorator can often help.\n\nExamples: Cache, Access Control,\
    \ Production Logging, Extending Frameworks\n\n## External System (Proxy)\n\n[GoF]\
    \ Represents our view of an external system locally\n\nExternal Systems are a\
    \ challenge for our applications. They always need some kind of raw data transfer\
    \ between them, somehow mapping to our objects. Because these systems live outside\
    \ our memory space, communication will be much slower. It can often be 100,000\
    \ times slower than calling a method locally.\n\nDealing with these challenges\
    \ is simpler when we introduce a local object to represent that external system.\n\
    \nThe best way to deal with an external system is to\n\n*   Create an interface\
    \ to represent it\n\n*   Use only our domain terms to abstract the details away\n\
    \nWe covered this fully in the chapter on Hexagonal Architecture. This is the\
    \ pattern behind it.\n\nAn External System object is powerful because it decouples\
    \ us from the details of that system. This gives us several possibilities. We\
    \ can use a stub for testing. We can create simple Fakes to help us split up development\
    \ across our team. We can wrap the system with things like a Cache, or logging\
    \ or monitoring.\n\nSpecifically, an external system object represents *only what\
    \ we need* of that system. Google Maps, as one example, has a large number of\
    \ useful features. But if all we needed was the ability to get the name of the\
    \ nearest town to a point, then our interface will be:\n\n```\n1 interface Geography\
    \ {\n2     String getNameOfTownNearestTo( float lat, float long );\n3 }\n```\n\
    \nOf course, we would create a GoogleMapsGeography object that implements this\
    \ interface and actually connects to Google Maps API over HTTP.\n\nThis is part\
    \ of a larger, very useful design idea known as *consumer driven contracts*.\n\
    \nThe idea is that all that matters is what a specific client needs. You can use\
    \ this to drive out required behaviours of servers, outside-in, based on what\
    \ is actually needed - not what ‘might be nice to have’.\n\nThe original pattern\
    \ I saw was Proxy in [GoF]. That was a more general kind of object. It had the\
    \ same interface as some other object and stood in place of it. In my work, Proxy’s\
    \ overwhelming use has been to represent an external system, so I prefer to think\
    \ of it as above.\n\n## Configuration\n\n[Own] Gives a way to change how the system\
    \ is set up\n\nOnce an Object Oriented program starts doing useful work, it will\
    \ need various things setting up, both at start up and throughout its runtime.\n\
    \nAt start up, it will need all its objects creating as instances of classes.\
    \ All the various dependencies need injecting. URLs of external web services need\
    \ to be provided. The connection string and address of our databases need providing.\n\
    \nThese kinds of things are often specific to the environment we run in. The database\
    \ string will be different when we are using the test database as to when we run\
    \ in production. The web service URL might point to a fake server made with WireMock,\
    \ rather than the real service on the web.\n\nEven the *kinds* of object may change.\
    \ We might have a setting in a file to use either an Oracle database or Microsoft\
    \ SQL Server. A different object might need to be created in each case, then injecting\
    \ into all its callers.\n\nWe call this Configuration. It includes setting data\
    \ values like URLs, creating specific objects and ‘object wiring’ - inject dependencies\
    \ between objects.\n\nThe best place to put all this is in a Configuration class:\n\
    \n```\n 1 class Configuration {\n 2     private boolean useOracle;\n 3     private\
    \ String jdbcConnectionString;\n 4     private boolean useDarkMode;\n 5     private\
    \ Date offerExpiryDate ;\n 6 \n 7     public void load() {\n 8         // Code\
    \ to read a configuration file, or server\n 9     }\n10 \n11     public UserRepository\
    \ userRepository() {\n12         if ( useOracle ) {\n13             return new\
    \ OracleUserRepository(jdbcConnectionString);\n14         }\n15 \n16         log(WARN,\
    \ \"Using STUB User Repository - TEST/QA ONLY\");\n17         return new StubUserRepository();\n\
    18     }\n19 \n20     public UiStyleScheme styleScheme() {\n21         return\
    \ useDarkMode? \n22             new UiStyleDark() :\n23             new UiStyleLight()\
    \ ; \n24     }\n25 \n26     public Date getOfferExpiryDate() {\n27         return\
    \ offerEXpiryDate ;\n28     }\n29 }\n```\n\nGives the basic idea. Configuration\
    \ is held *somewhere* then read in. Based on this data, the right kinds of objects\
    \ are created for use elsewhere. The rest of the code refers to this Configuration\
    \ object to get its dependencies and values.\n\nThe actual configuration data\
    \ is stored typically a ‘config.json’ kind of file, or perhaps a database at a\
    \ fixed location, or a web service. Some providers like Spring Cloud use network\
    \ broadcasts to discover the configuration server at run time.\n\nOnce read in,\
    \ the methods on the Configuration object can be used to create the specific objects\
    \ needed. They can be initialised with the required values of things like URLs,\
    \ timeouts and connection strings.\n\nOften, whole objects can be created here.\
    \ That leads to nice clean code. But I have added a getter to return a pure data\
    \ value. Configuration classes are one place where that can often be a good idea,\
    \ resulting in the clearest code.\n\nAs the application grows, it makes sense\
    \ to split into multiple Configuration classes.\n\nThese can align with your Hexagonal\
    \ Architecture so that each subsystem gets its own Configuration object. You will\
    \ probably end up having a Configuration interface in your domain layer, then\
    \ writing a specific Adapter for it to link it up to your actual source.\n\nI’ve\
    \ also shown a common idea where we normally use the Oracle database in production,\
    \ but we can enable a test stub in our configuration file.\n\nThis simplifies\
    \ development across a team. The QAs can do their manual exploratory testing of\
    \ new UI changes without needing a database connection. The other devs who are\
    \ not working on the Oracle Repository can get on with their work.\n\nThis particular\
    \ piece of design is as much about team leadership and management as it is about\
    \ clean code.\n\n## Order-OrderLineItem\n\n[Coad] Gives structure to a list of\
    \ items on an order\n\nOrders crop up everywhere in commercial systems. You’ll\
    \ routinely see point of sale receipts, invoices, bills of materials and e-commerce\
    \ customer orders.\n\nEach one has the same basic pattern.\n\nThere is a line\
    \ item describing the single thing that has been ordered. Typically, it knows\
    \ about some combination of values: quantity, part code, description, price, tax,\
    \ location. This, plus suitable behaviours, go into the OrderLineItem object.\n\
    \nAs orders often have more than one line item, we aggregate these into an Order\
    \ object, describing the total order. That often knows about the time it was placed,\
    \ delivery and billing details, related accounts. Typical behaviours on Order\
    \ are display, takePayment and place, which moves the order onto fulfilment.\n\
    \nOrder-OrderLineItem is simply a specific use case for the more general Aggregate\
    \ object idea. But it’s so common it’s worth pointing out.\n\nI first saw it in\
    \ the excellent [Coad] book, which lists a toolbox of common business processes\
    \ and patterns that model them.\n\nExamples: Point of Sale receipts, invoices,\
    \ bills of materials\n\n## Request-Service-Response\n\n[Own] Describes a flow\
    \ to get a response from a service\n\nThis crops up a lot in Hexagonal Architecture\
    \ designs. It is the ‘inner hexagon’ domain model of a web request - without any\
    \ reference to web technologies. As such, you can use it with any kind of input\
    \ and output adapters. It represents a general request to a system.\n\nTo carry\
    \ on our running theme, let’s show how this can be used to find a user by their\
    \ id."
