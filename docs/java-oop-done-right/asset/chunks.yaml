  trans: "\n我们最初的问题在于，使用了继承和静态类型来建模动态行为。这是行不通的。我们找到了建模这种行为的正确方法，并不是常见示例中的做法。\n\n我觉得，是时候宣布那些“OO\
    \ 已死”的文章也随之亡了。\n\n就像我们的渡鸟一样灭绝了。\n\n## 正方形继承矩形\n\n在我们忧郁经典排行榜中，第二名是“正方形继承矩形”。\n\n\
    这个问题发生在我们在多态的 `Shape.draw()` 练习中做得很好，然后就有点玩过头了。\n\n一切进展顺利，定义了一个有一个方法 `draw()`\
    \ 的接口 `Shape`。我们完美地添加了 `Circle` 类、`Triangle` 类和 `Rectangle` 类。\n\n沉浸在成功的喜悦中，我们决定画一个\
    \ `Square`。\n\n我们注意到正方形是矩形的一种。IS-A（是一个...关系）！砰！我们可以继承 `Rectangle`——完美！\n\n结果我们陷入了这种境地：\n\
    \n```\n 1 class Graphics {\n 2     // Coordinates (0,0) top left of screen\n 3\
    \     void line( int x1, int y1, int x2, int y2 );\n 4 }\n 5 \n 6 interface Shape\
    \ {\n 7     void draw(Graphics g);\n 8 }\n 9 \n10 class Rectangle implements Shape\
    \ {\n 11     private int xLeft;\n 12     private int yTop;\n 13     private int\
    \ width;\n 14     private int height;\n 15 \n 16     public Rectangle( int xLeft,\
    \ int yTop, int width, int height ) {\n 17         this.xLeft = xLeft;\n 18  \
    \       this.yTop = yTop;\n 19         this.width = width;\n 20         this.height\
    \ = height;\n 21     }\n 22 \n 23     void setWidth(int width) {\n 24        \
    \ this.width = width;\n 25     }\n 26 \n 27     void setHeight(int height) {\n\
    \ 28         this.height = height;\n 29     }\n 30 \n 31     void draw(Graphics\
    \ g){\n 32         g.line(xLeft, yTop, xLeft+width, yTop);\n 33         g.line(xLeft+width,\
    \ yTop, xLeft+width, yTop+height);\n 34         g.line(xLeft+width, yTop+height,\
    \ xLeft, yTop+height);\n 35         g.line(xLeft, yTop+height, xLeft, yTop);\n\
    \ 36     }\n 37 }\n 38 \n 39 class Square extends Rectangle {\n 40     void setSize(\
    \ int sideLength ) {\n 41         setWidth( sideLength );\n 42         setHeight(\
    \ sideLength );\n 43     }\n 44 }\n```\n\n万岁！我们完成了。画一个正方形只需要这个 `Square` 类，只要调用\
    \ `setSize()` 并传入你想要的边长即可。\n\n但问题在于，在这种情况下，并没有发生特别糟糕的事情。但我们为以后埋下了陷阱。“未来的我们”可不会高兴。\n\
    \n假设我们需要一个额外的方法，对于 `Square` 和 `Rectangle` 具有不同的行为。假设它是为了驱动一个仪表盘，该仪表盘统计我们有多少个正方形和矩形：\n\
    \n```\n 1 interface Shape {\n 2     void draw( Graphics g );\n 3     void report(\
    \ Dashboard d );\n 4 }\n 5 \n 6 class Rectangle implements Shape {\n 7     //\
    \ ... other code as above ...\n 8 \n 9     void report( Dashboard d ) {\n10  \
    \       d.reportRectangle();\n 11     }\n 12 }\n 13 \n14 class Square extends\
    \ Rectangle {\n 15     // ... other code as above ...\n 16 \n 17     void report(\
    \ Dashboard d ) {\n 18         d.reportSquare();\n 19     }\n 20 }\n```\n\n这运行良好——直到你有一个\
    \ `Rectangle` 对象并对其调用了 `setWidth(5)` 和 `setHeight(5)`。\n\n此时，我们有一个 `Rectangle`\
    \ 类型的对象。我们将宽度和高度设置为相等。所以现在，它会像正方形一样绘制。从数学上讲，它确实是一个正方形。它应该向仪表盘报告自己是一个正方形。\n\n但它不是，也不会报告。在\
    \ Java 中，它*不是*一个正方形。它是一个边相等的 `Rectangle`。在 Java 中，*并不是一回事*。\n\n这归结为这样一个观点：在 Java\
    \ 中，类或接口表示一个固定的类型。对象的类型在创建时就确定了。它*不能*根据其内部字段的值而改变。\n\n在这个例子中，从数学上讲，正方形是矩形。这毫无置疑。但\
    \ Java 类无法动态地表示这种类型的改变。这不是 Java 的设计初衷。这不是 Java 支持的 OOP 模型。其他语言可能做到。但 Java 不行。\n\
    \n你必须利用已有的条件。尊重限制。\n\n## 继承实现\n\n我们的三个丑鸭子最后一个是仅仅为了继承来引入一些额外的代码，而不考虑 IS-A 关系、Liskov\
    \ 替换（LSP）或领域中的任何内容：\n\n```\n 1 class MySqlDatabase {\n 2     void insertSql(...)\
    \ {...}\n 3 \n 4     // ... other database methods ...\n 5 }\n 6 class User extends\
    \ MySqlDatabase { \n 7     private String name ;\n 8 \n 9     void setName( String\
    \ name ) {\n10         this.name = name;\n 11 \n12         insertSql(\"USER_TABLE\"\
    , \"NAME\", name);\n 13     }\n 14 }\n```\n\n虽然很牵强，但仍然是一个真实的警告。\n\n在这个例子中，我们的\
    \ `User` 类想要将自己保存到我们的 `MySqlDatabase` 中。我们通过继承引入了数据库代码。诚然，我们节省了一些击键次数，因为我们现在可以使用所有如\
    \ `insertSql()` 这样的数据库方法。\n\n问题在于，`User` 与数据库没有任何关系。`User` 对象在所有上下文中都不——或者说不应该——是可以与数据库相互替换的。\n\
    \n是的，它节省了击键次数。但它破坏了我们的设计。90 年代初的 OOP 在媒体中充斥着这类东西，并在某种程度上损害了类的真谛。\n\n## 损坏的共享状态\n\
    \n这其实是一个稻草人。\n\n对象隐藏了秘密。一个显而见的秘密是可变的值。我们称之为“状态”：\n\n```\n1 class Counter {\n 2\
    \     private int total;\n 3\n 4     void oneMore() {\n 5         total++;\n 6\
    \     }\n 7\n 8     void display(Display d) {\n 9         d.print( \"Total so\
    \ far is \");10         d.println( total );\n11     }\n12 }\n```\n\n我们可以创建一个新的\
    \ `Counter`，随心所欲地调用 `oneMore()`，并使用 `Display` 对象显示总量。\n\n批评来自并发系统，如多线程多核 CPU。\n\
    \n如果你从不同的线程创建 Counter，就会出现故障。情况是 Thread A 正在给 total 加一，此时 Thread B 来了，获取部分结果并加一。值被损坏了。这不是好消息。\n\
    \nOOP 批评者认为这意味着 OOP 不能用于并发系统。或者很难使用。或者函数式编程（FP）才是合理的。\n\n事实是，有很多技术允许在并发系统中安全、简单地使用对象。\n\
    \n简单的方法让对象不可变。如果你不在线程之间共享状态，就没有问题。\n\n对于那些*需要*共享状态的情况，在大多数代码中，状态存储在数据库中。`Repository`\
    \ 模式对象将访问数据库。数据库将为你管理并发访问。任务完成。\n\n在没有数据库的情况下，Java 提供了原生类型（`Thread`, `synchronized`）以及一些高级对象（`java.util.concurrent`\
    \ 包）来简化这一点。像 Akka 这样的框架提供了 `Actor` 对象，将每个对象视为独立的并发实体。\n\n这与 OOP 没关系。FP 通过将状态推向系统的边缘来避免问题。但如果我们选择，我们也可以通过不可变对象这样做。或者添加同步。或者使用内置并发的对象。\n\
    \n## 普通糟糕代码\n\n即使有优雅的 OO 设计，你仍然可能因为搞乱了你的方法而反败为胜。\n\n在一个项目中，我遇到过外包商提供的这类代码：\n\n\
    ```\n 1 public boolean ok (Object o) {\n 2     boolean result = false ;\n 3 \n\
    \ 4     if ( o == null ) {\n 5         result = false\n 6     }\n 7     else if\
    \ ( !(o instanceof Boolean) ) {\n 8         result = false ;\n 9     }\n10   \
    \  else if ( ((Boolean)o).equals(Boolean.FALSE) ) {\n11         result = false\
    \ ;\n 12     }\n13     else if ( ((Boolean)o).equals(Boolean.TRUE) ) {\n14   \
    \      result = true ;\n 15     }\n16     else {\n17         result = false ;\n\
    18     }\n19 \n20     return result;\n21 } \n```\n"
- fmt: '

    If you are going to write methods like that, it really does not matter a fig how
    good your OO design is. This was a real “What *were* they thinking?” moment.


    The reality is that you can get paid to write very low-quality code. That code
    will get reviewed by peers who also get paid to write very low quality code. That
    decision will be rubber-stamped by non-technical management who do not know what
    code quality is, nor care, so long as the deadline was met.


    Hopefully, we can agree that we can do better than this.


    *We can, can’t we?*


    # Data Structures and Pure Functions


    We’ve looked at how object oriented designs are driven outside-in by behaviours
    with hidden secrets. We’ve also covered how getters and setters are the ultimate
    evil.


    Well, ok, maybe I didn’t quite put it like that. But you know what I mean.


    This chapter is about setting the balance straight.


    Sometimes, the perfect solution to a problem is a pure data structure. Yes, a
    full-on, old-skool class that has *only* getters and setters.


    Let’s look at where they add value and why.


    ## System Boundaries


    We’ve seen how we can make our application talk to external systems easily by
    using Dependency Inversion. This provides a local interface that represents our
    view of that external system.


    But we still need to *talk* to that system, over the network.


    It should be obvious^([1](#chap20.xhtml_fn-copierstory)) that we don’t actually
    *send* an object over the network. What would that even mean?


    What we have to do is “flatten it out” in a process we call *serialisation*.


    This is where we take all the private data inside that object and write it out,
    together with some extra metadata that says what the `Class` was.


    This flattened out data is pure data. It’s not an object. It can’t have methods
    when it is just ones and zeroes over a network.


    Using a pure data structure at a system boundary makes perfect sense.


    When using Hexagonal Architecture designs, we simply write an `Adapter` class
    at each end.


    These all look similar. They take the domain object, convert it into a pure data
    structure, then hand that to whatever networking library we are using. A similar
    `Adapter` will be at the receiving side, mapping the pure data structure into
    a domain object.


    Some frameworks will handle this mapping for you, leaving you to only write the
    domain object. This is helpful, sometimes. But often, there is an “annotation
    soup” that couples your domain layer directly to the external system layer.


    That coupling is worth avoiding, usually. Writing your own pure data class in
    the adapter layer is the answer. These are often callen Data Transfer Objects
    (`DTOs`) or ‘model’ objects.


    ## Fixed Data, Changing Functions


    Objects work best when we know the set of behaviours we want them to have.


    That way, we can write the public methods and add any private data we need afterwards.
    This is great when the methods are stable, but how they work might change.


    Sometimes, the problem we are solving is the other way around. The data is the
    stable thing, and any methods that work on it are liable to change.


    The classic example is a reporting system.


    We’ve just built an e-commerce system, our own mini-Amazon. We have plenty of
    sales, inventory and order history. We would like to see reports on KPIs. We start
    off with a ‘Total Sales’ report.


    The CFO loves this and gets very excited. She asks us for a new report on ‘Top
    Five Selling Product Categories by Region’.


    A little later, Marketing pipe up on Slack. ‘Can we have a report on ROI on Facebook
    Ads by Category by Time of day, please?’.


    The success of our reporting tools is becoming its own worst enemy. For every
    new report we deliver, we get asked to create two more.


    If we choose to model this as an object, it gets unwieldy pretty quickly. It sprouts
    hundreds of pretty random-looking methods and reaches out to all kinds of other
    objects that it only wants the private data from.


    We can use some patterns to help us; `CollectingParameter`, `Strategy` or even
    `Observer` can come into play. But it tends to obscure what’s going on.


    We really only care about the data for a report. The data is fixed. It comprises
    payment details, product data and categories. All of this stays the same. It is
    the behaviours - the reports themselves - that are in flux.


    The sensible approach is to create a set of pure data classes, resplendent with
    getters and setters. I might even go as far as making them have public data *fields*
    and no getters, setters nor methods at all. I think this is honest. But so we
    don’t break SonarQube (and freak out our team) we can stick to old-skool JavaBeans,
    with get/set pairs. That’s fine in this context.


    The reports can then be simple, separate classes that process these data objects,
    spitting out a report at the end.


    An approach I like sticks with an OOP domain model, and some of those domain objects
    can be asked to produce a `ReportingModel` object. This is the get/set data structure
    for use with the reporting package.


    ## Algorithms and Data Structures


    This idea - a data structure with separate algorithms - is a different way of
    approaching a problem. The difference is where the behaviour lies.


    With OOP, behaviours are primary. They are what the object is all about. Data
    is hidden inside an object. This makes changes to data and other object secrets
    easy, but adding new behaviours will cause change to calling code.


    With a data structure approach, these trade-offs are inverted. Changing the data
    layout will ripple out changes, but adding a new function will not. Data is exposed.
    Behaviours are secondary.


    Both approaches are useful, given the trade-off between what is more likely to
    change - data or behaviours.


    What’s important is to understand which one you are using and why. Then do it
    well.


    # Putting It All Together


    Well, that’s it. That’s all I use day to day for building out object oriented
    applications.


    ## No step-by-step plans


    The first thing to notice is that there are no step by step plans here. I often
    wish there were.


    Novices often want to learn the steps needed to build different kinds of software.
    They get frustrated to learn there aren’t any.


    What we have instead is a Toolbelt of Techniques.


    It’s like being a builder. You have hammers, saws and specialist tools. You have
    wood, metal and other materials. You know the principles of measuring, joining,
    load-bearing and more. It is only when you come to build a specific house that
    you work out which ones to use, in which order.


    The house gets built from thousands of smaller jobs. We cut a hole, fit a door
    frame, screw a hinge. We never “build a house” with the “build a house tool”.


    Software is just the same. You don’t “write a word processor”. You represent text,
    save it to storage, fetch it from storage, layout a paragraph, draw a font to
    a display. We create objects to do the work and get them to collaborate. Over
    time, we build out the objects we need to create the features we want.


    The trick is to approach each problem with confidence. As soon as we break down
    to a small enough problem, one or more of our tools will solve it.


    ## Getting Started


    The way I get started is by taking an Agile, iterative approach.


    Start with a simple user story - a single, small stripe of functionality that
    a user would see. That might be “Add a new Customer to our system”.


    From that, we can imagine what kinds of objects we need. A `Customer`. A `CustomerRepository`.
    Some implementation of that for storage, depending on how we have decided to store
    things. Some kind of interface to the `Customer` - possibly a Web Service REST
    API to power a JavaScript front end.


    We can begin to write tests to get small pieces of this code up and running. Refactor
    it into shape. Add pieces as “stripes” through the whole system. Consider our
    domain/external system splits. Think about making the domain ideas clear, hiding
    mechanisms.

