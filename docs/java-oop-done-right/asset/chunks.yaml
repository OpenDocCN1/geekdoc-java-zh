  trans: "\n\n`Repository`（仓库）允许我们根据我们的领域术语对存储的数据创建抽象。我们之前已经见过了。我们曾用它来存储 `User` 对象，作为适配器模式的示例。`Repository`\
    \ 关注的是被调用的接口，而不是适配器类的实现。\n\n为了展示 `Repository` 有多用，让我们来添加几个常用方法：\n\n```\n1 interface\
    \ UserRepository {\n2     User  findUserById( String userId );\n3     Users findUsersWhoseNameStartWith(\
    \ String startOfName );\n4     Users listAllUsers();\n5 \n6     Users execute(\
    \ Query q );\n7 }\n```\n\n`Users` 是一个聚合类，包含与多个 `User` 对象相关的方法。\n\n这个接口使用了我们领域中已知的概念。它对存储机制字字未提。这使得它易于阅读、易于编写测试桩（stub），并且易于切换存储技术。\n\
    \n我们的领域模型代码仅使用此接口即可完成所有所需的工作。它实现了完全的关注点分离。\n\n上述列出的方法是典型的：\n\n* 通过各种唯一标识（如 `userId`）查找单个\
    \ `User`\n* 根据某些标准查找多个用户\n* 返回所有内容\n\n最后一个方法非常有趣。它返回所有匹配指定 `Query` 的 `User` 对象，该查询作为参数对象传入的。\n\
    \n`Query` 本身就是一个抽象。它不是一个 SQL ‘SELECT’ 查询。它不是 Mongo 查询。它是一个表示查询的纯 Java 对象组。你会看到类似的内容：\n\
    \n```\n1 Query q = \n2   new QueryBuilder()\n3   .attributeMatches( \"name\",\
    \ \"Al*\")\n4   .and()\n5   .timeAttributeBefore( \"creationPoint\", new Time(\"\
    2020-01-05T11.59.00Z\\\n6 ) )\n7   .build();\n```\n\n这会构建一个抽象语法树（AST），描述一个查询，匹配所有名称以“Al”开头且\
    \ `creationPoint` 时间戳在 2020 年 11 月 5 日 11:59 之前的 `Users`。\n\n`Query` 对象上有一个 `translate(\
    \ QueryDialect dialect )` 方法。该方法会接收一个具体的对象，该对象知道如何为特定技术生成特定的查询——例如 `MySqlQueryDialect`。通常，这是通过访问者模式实现的。这可能是为什么要使用访问者模式的经典示例。\n\
    \n这会将通用查询映射为实现中实用的内容。它意味着当存储技术发生变化时，上述领域代码查询也不会发生变化。\n\n示例：关系型数据访问、NoSQL 数据访问、REST\
    \ 数据存储客户端、缓存。\n\n## Query\n\n[PoEAA] 描述要搜索什么，但不描述如何执行\n\n我们的应用程序在对象创建后需要能够找到它们。\n\
    \n在内存中，一旦我们使用 `new` 创建了对象，我们就会获得该对象的引用。我们保留该引用并使用它来访问对象。\n\n对于我们之前存储在 `Repository`\
    \ 中的对象，我们没有这个引用。为了再次找到我们的对象，我们需要一个 `Query`。某种用来指定“寻找与这些搜索术语最匹配的对象（s）”。\n\n查询有各种形式。我们在\
    \ `findUserById(userId)` 方法中经常看到其中一种。在这里，搜索标准“通过用户 ID”被编码在方法名中。\n\n这既易读又简单又易于测试，但它并不灵活。\n\
    \n通常，我们需要一个通用的查询系统。就像我们在 SQL 语句中找到的那种一样。\n\n但问题在于：我们不想将其表示为 SQL。\n\n我们使用了 `Repository`\
    \ 对象。我们使用了六边形架构（Hexagonal Architecture），使得我们的领域层完全不知道该 `Repository` 将如何实现。\n\n\
    如果我们将 SQL 语句传递到查找方法中，就违背了这种设计的初衷。我们创建了一个*泄露的抽象*，即某个特定实现的部分“泄露”出来的抽象。\n\n解决方案是将查询分为两个部分：\n\
    \n* 纯英语：搜索标准的抽象表示\n* 具体细节：翻译器将其转换为某些特定的技术实现\n\n一旦我们意识到所有查询都可以用英文编写，就变得更容易理解了。“显示我昨天加入的所有用户”这就是一个例子。这就是\
    \ `Query` 对象模式的作用。`Query` 对象用纯粹的领域术语表达内容。然后，翻译器对象会将此转换为任何所需的格式。\n\n### 简单查询对象\
    \ (Simple Query Object)\n\n拥有一种非常简单的 `Query` 对象通常是有用的。它在可以表示的查询上是有刻意限制的，这使得编写翻译器对象变得更简单。技巧在于让它足够好以完成工作。\n\
    \n```\n 1 class Query {\n2     private String name ;\n3     private Object value\
    \ ;\n4 \n5     public void attributeEquals(String name, Object value) {\n6   \
    \      this.name = name ;\n7         this.value = value ;\n8     }\n9 \n10   \
    \  public void translate(Translator t) {\n11         t.generate(name, value);\n\
    12     }\n13 }\n14 \n15 interface Translator {\n16     void generate(String name,\
    \ Object value);\n17 }\n```\n\n这个极其精陋的 `Query` 对象展示了工作的基本拆分。我们可以只表示一种查询——“<attribute>\
    \ 是否等于 <value>?”。我们可以调用 `translate()` 并传入某些 `Translator` 对象来生成与特定实现相关的查询。\n\n\
    这里是一个简单的 `SqlTranslator` 对象，它会为我们创建一个 SELECT 语句，然后显示它——仅用于示例。它通常会连接到 `Database`\
    \ 对象。\n\n```\n1 class SqlTranslator implements Translator {\n2     private final\
    \ String table ;\n3     private String sql ;\n4\n5     public SqlTranslator( String\
    \ table ) {\n6         this.table = table ;\n7     }\n8 9     public void generate(\
    \ String name, Object value ) {\n10         // Note: this only works for text\n\
    11         sql = String.format(\"SELECT * FROM %s WHERE %s = '%s'\", \n12    \
    \                         table, name, value);\n13     }\n14 \n15     public void\
    \ displayForDebug() {\n16         System.out.println( sql );\n17     }\n18 }\n\
    ```\n\n我们使用这些类来实现 `findUserById()` 方法：\n\n```\n1 User findUserById( String userId\
    \ ) {\n2     Query q = new Query();\n3     q.attributeEquals( \"id\", userId );\n\
    4 \n5     Translator sql = new SqlTranslator();\n6     q.translate(sql);\n7 \n\
    8     sql.displayForDebug();\n9 \n10     // database code\n11 }\n```\n\n你可以看到细节是如何隐藏在\
    \ `SqlTranslator` 对象中的。我们要搜索内容的细节隐藏在 `Query` 对象中。\n\n重要的是，它们是用领域术语表达的——而不是 SQL\
    \ 或数据库术语。我们可以编写 `MongoTranslator` 或 `FileTranslator` 并让它们工作。\n\n你也可以看到注释：它只对字符串值有效。\n\
    \n更完整的查询对象需要在 Java 数据类型和存储技术所需的任何类型之间转换。\n\n事实上，查询对象和翻译器会变得复杂。\n\n全功能版本构建一个 Criteria\
    \ 对象的抽象语法树，带有如 AND、OR、LIKE、NOT、EQUALS、BETWEEN 等运算符。它们将在所有数据类型之间转换并使用访问者模式将 Criteria\
    \ 图翻译为实现版本。\n\n我实际上在一个真实项目中构建过这样的东西。那是一个允许用户能够构建自己的查询来报告企业网络中打印机状态系统。实际实现打算使用多个后端数据库系统来存储该队列的状态快照。\n\
    \n## 收集参数 (CollectingParameter)\n\n[C2WIKI] 用于收集结果的对象\n\n当我们想要聚合对象产生某种摘要或总计结果时，如何使用“只说不问”（tell-don’t-ask）风格的编码？\n\
    \n收集参数是一个我们可以传递给方法的对象。同一个收集参数会被传递给多个不同的对象，以便每个对象都能贡献自己的力量：\n\n"
- fmt: "\n```java\nclass UserMetrics {\n    void ageLessThan25();\n    void age25To35()\n\
    \    void age35Up();\n\n    void premiumSubscriber();\n    void inactive90days();\n\
    \n    void display( Display d );\n}\n```\n\n`UserMetrics` is a collecting parameter\
    \ class that can be passed to multiple `User` objects. The `User` object would\
    \ call the relevant `ageXXX()` method to collect age demographics, adding one\
    \ to the relevant total number of users in that cohort. It would also call `premiumSubscriber()`\
    \ and `inactive90days()` as appropriate. These are sales pipeline targets that\
    \ we have decided we want to alter, so we need a measurement.\n\nWe would pass\
    \ it into `Users` like so:\n\n```java\nclass Users {\n    private final users\
    \ List<User> users = new ArrayList<>();\n\n    public void add( User u ) {\n \
    \       users.add( u );\n    }\n\n    public void collect(UserMetrics metrics)\
    \ {\n        users.forEach(user->user.reportMetrics(metrics));\n    }\n}\n```\n\
    \nWe would call `Users.collect()`, pass in a `UserMetrics` object instance and\
    \ it would be populated. After that, we can display those metrics.\n\nAll sorts\
    \ of uses are made of this. Totals, reports, summaries, Bills of Materials, Inventory.\
    \ It’s a very useful technique. It is a simplified version of the ‘Visitor’ pattern.\n\
    \nExamples: Management Reports, Upgrade items, Orders, Totals, general Data Processing.\n\
    \n## Item-Item Description\n\n[Coad] Keeps a Thing and its description separate\n\
    \nThis useful pattern crops up in e-commerce a lot.\n\nYou have a `Thing` - product,\
    \ service, offering, movie, song - whatever. The `Thing` needs a description so\
    \ that it can go in the catalogue.\n\nThe `Thing` is logically different than\
    \ its description. You can talk about how many copies of ‘The Andromeda Strain’\
    \ movie you have to buy. You can also talk about who directed that film and who\
    \ wrote it. The two are different views, so it makes sense to separate them out.\n\
    \n```java\nclass MovieDescription {\n    void displayTitle(Display d){...}\n \
    \   void displaySynopsis(Display d){...}\n    void chargePriceToAccount(Account\
    \ a){...}\n}\n\nclass Movie {\n    private final MovieDescription description\
    \ ;\n\n    public Movie(MovieDescription description) {\n        this.description\
    \ = description;\n    }\n\n    void buy(Account a){...}\n}\n```\n\nExamples: Catalogues,\
    \ Media Collections, Products, Legal proformas, e-commerce, Classified Ads, Discount\
    \ Vouchers\n\n## Moment-Interval\n\n[Coad] Captures a period of time, beginning\
    \ to end\n\n`Moment-Interval` represents a period of time defined by a start time\
    \ and an end time. Behaviours can either be general-purpose - like `boolean isAfter(time)`,\
    \ `boolean wasBefore(time)` - or application specific.\n\nTime ranges are important\
    \ in many domains. Rental agreements, leases, validity checks, access control\
    \ windows are all subject to time limits. `Moment-Interval` gives us a clean way\
    \ to model them.\n\n```java\nclass SubscriptionPeriod {\n    private final Date\
    \ start ;\n    private final Date end ;\n\n    public SubscriptionPeriod( Date\
    \ start, Date end ) {\n        this.start = start;\n        this.end = end;\n\
    \    }\n\n    public void applyTo( Subscription s, Date now ) {\n        if (\
    \ now.isAfter(start) && end.isAfter(now) ) {\n            s.subscriptionActive();\n\
    \        }\n        else {            \n            s.subscriptionExpired();\n\
    \        }\n    }\n}\n\nclass Subscription {\n    private SubscriptionPeriod period\
    \ ;\n\n    public void renew(Period p) {\n        this.period = p ;\n    }\n\n\
    \    public void provideService( Date now ) {\n        period.applyTo( this );\n\
    \    }\n\n    public void subscriptionExpired() {\n        // action when expired\n\
    \    }\n\n    public void subscriptionActive() {\n        // action when active\n\
    \    }\n}\n```\n\nSoftware-as-a-service (SaaS) businesses rent out access to their\
    \ offering for a fixed period of time. The period you can use them ranges from\
    \ the moment your payment is received until some point in the future, often based\
    \ on how much you pay.\n\nThe `Subscription` above would represent a time-bounded\
    \ service. Calling method `provideService()` with the current time would delegate\
    \ to the `Period` object.\n\nThis is our `Moment-Interval` pattern object.\n\n\
    This would check the time now against its limits. If it is within those limits,\
    \ it will call back on the `Subscription` active, triggering the `subscriptionActive()`\
    \ method. This would provide the paid-for service.\n\nIf the subscription has\
    \ lapsed, then `Period` will call back to `subscriptionExpired()`, which can then\
    \ attempt to get the user to renew their subscription. If they do, `Subscription`\
    \ method `renew()` would be called, with an updated `Period`.\n\n## Clock\n\n\
    [Own] Provides a way to represent current time that can be stubbed\n\nTime is\
    \ a dependency that complicates testing because it is constantly changing. If\
    \ you use the system clock directly, it is hard to write tests that depend on\
    \ a specific time.\n\nWe need an abstraction for the current time, which allows\
    \ us to stub the clock in tests. This `Clock` interface looks like this:\n\n```java\n\
    interface Clock {\n    Date now();\n}\n```\n\nIn production, we use an implementation\
    \ that wraps the system clock:\n\n```java\nclass SystemClock implements Clock\
    \ {\n    public Date now() {\n        return new Date();\n    }\n}\n```\n\nFor\
    \ testing, we provide a stub class that allows us to control the time:\n\n```java\n\
    class StubClock implements Clock {\n    private Date date ;\n\n    public Date\
    \ now() {\n        return date ;\n    }\n\n    public void setTo( Date d ) {\n\
    \        this.date = d;\n    }\n\n    public void oneHourLater() {\n        //\
    \ code to go forward one hour\n    }\n\n    public void oneHourEarlier() {\n \
    \       // code to go back one hour\n    }\n}\n```\n\nBy injecting the `Clock`\
    \ into the classes that need it, we can make our tests deterministic and much\
    \ easier to reason about.\n\n## Rules (or Policy)\n\n[Own] Captures a set of rules\
    \ to apply in a single place\n\nRules are part of much every business process\
    \ you want to automate. Things like applying for a mortgage, verifying a user\
    \ account, or checking a message for being spam will all have a ruleset to apply.\n\
    \nIn many cases, these rules get ad-hoc somewhere in the system.\n\nIt is usually\
    \ good for clarity if we pull out all the rules into a single object. This also\
    \ gives us the possibility of treating the rules object a Strategy pattern. That\
    \ gives us pluggable rules that can change.\n\nAn example is in calculating Tax\
    \ from a given amount using a banded tax rate system.\n\nSay you pay zero below\
    \ 10,000\\. Then 20% between 10,000 and 30,000. Then 40% above that. Don’t take\
    \ the numbers too seriously; I’m hoping I’m a better developer than a Chancellor\
    \ of the Exchequer.\n\nHere is one way of doing this using the Rulebook pattern:\n"
  raw: "```\n 1 class UserMetrics {\n 2     void ageLessThan25();\n 3     void age25To35()\n\
    \ 4     void age35Up();\n 5 \n 6     void premiumSubscriber();\n 7     void inactive90days();\n\
    \ 8 \n 9     void display( Display d );\n10 }\n```\n\nUserMetrics is a collecting\
    \ parameter class that can be passed to multiple User objects. The User object\
    \ would call the relevant ageXXX() method to collect age demographics, adding\
    \ one to the relevant total number of users in that cohort. It would also call\
    \ premiumSubscriber() and inactive90days() as appropriate. These are sales pipeline\
    \ targets that we have decided we want to alter, so we need a measurement.\n\n\
    We would pass it into Users like so:\n\n```\n 1 class Users {\n 2     private\
    \ final users List<User> users = new ArrayList<>();\n 3 \n 4     public void add(\
    \ User u ) {\n 5         users.add( u );\n 6     }\n 7 \n 8     public void collect(UserMetrics\
    \ metrics) {\n 9         users.forEach(user->user.reportMetrics(metrics));\n10\
    \     }\n11 }\n```\n\nWe would call Users.collect(), pass in a UserMetrics object\
    \ instance and it would be populated. After that, we can display those metrics.\n\
    \nAll sorts of uses are made of this. Totals, reports, summaries, Bills of Materials,\
    \ Inventory. It’s a very useful technique. It is a simplified version of the ‘Visitor’\
    \ pattern.\n\nExamples: Management Reports, Upgrade items, Orders, Totals, general\
    \ Data Processing.\n\n## Item-Item Description\n\n[Coad] Keeps a Thing and its\
    \ description separate\n\nThis useful pattern crops up in e-commerce a lot.\n\n\
    You have a Thing - product, service, offering, movie, song - whatever. The Thing\
    \ needs a description so that it can go in the catalogue.\n\nThe Thing is logically\
    \ different than its description. You can talk about how many copies of ‘The Andromeda\
    \ Strain’ movie you have to buy. You can also talk about who directed that film\
    \ and who wrote it. The two are different views, so it makes sense to separate\
    \ them out.\n\n```\n 1 class MovieDescription {\n 2     void displayTitle(Display\
    \ d){...}\n 3     void displaySynopsis(Display d){...}\n 4     void chargePriceToAccount(Account\
    \ a){...}\n 5 }\n 6 \n 7 class Movie {\n 8     private final MovieDescription\
    \ description ;\n 9 \n10     public Movie(MovieDescription description) {\n11\
    \         this.description = description;\n12     }\n13 \n14     void buy(Account\
    \ a){...}\n15 }\n```\n\nExamples: Catalogues, Media Collections, Products, Legal\
    \ proformas, e-commerce, Classified Ads, Discount Vouchers\n\n## Moment-Interval\n\
    \n[Coad] Captures a period of time, beginning to end\n\nMoment-Interval represents\
    \ a period of time defined by a start time and an end time. Behaviours can either\
    \ be general-purpose - like boolean isAfter(time), boolean wasBefore(time) - or\
    \ application specific.\n\nTime ranges are important in many domains. Rental agreements,\
    \ leases, validity checks, access control windows are all subject to time limits.\
    \ Moment-Interval gives us a clean way to model them.\n\n```\n 1 class SubscriptionPeriod\
    \ {\n 2     private final Date start ;\n 3     private final Date end ;\n 4 \n\
    \ 5     public SubscriptionPeriod( Date start, Date end ) {\n 6         this.start\
    \ = start;\n 7         this.end = end;\n 8     }\n 9 \n10     public void applyTo(\
    \ Subscription s, Date now ) {\n11         if ( now.isAfter(start) && end.isAfter(now)\
    \ ) {\n12             s.subscriptionActive();\n13         } \n14         else\
    \ {            \n15             s.subscriptionExpired();\n16         }\n17   \
    \  }\n18 }\n19 \n20 class Subscription {\n21     private SubscriptionPeriod period\
    \ ;\n22 \n23     public void renew(Period p) {\n24         this.period = p ;\n\
    25     }\n26 \n27     public void provideService( Date now ) {\n28         period.applyTo(\
    \ this );\n29     }\n30 \n31     public void subscriptionExpired() {\n32     \
    \    // action when expired\n33     }\n34 \n35     public void subscriptionActive()\
    \ {\n36         // action when active\n37     }\n38 }\n```\n\nSoftware-as-a-service\
    \ (SaaS) businesses rent out access to their offering for a fixed period of time.\
    \ The period you can use them ranges from the moment your payment is received\
    \ until some point in the future, often based on how much you pay.\n\nThe Subscription\
    \ above would represent a time-bounded service. Calling method provideService()\
    \ with the current time would delegate to the Period object.\n\nThis is our Moment-Interval\
    \ pattern object.\n\nThis would check the time now against its limits. If it is\
    \ within those limits, it will call back on the Subscription active, triggering\
    \ the ‘subscriptionActive()’ method. This would provide the paid-for service.\n\
    \nIf the subscription has lapsed, then Period will call back to ‘subscriptionExpired()’,\
    \ which can then attempt to get the user to renew their subscription. If they\
    \ do, Subscription method renew() would be called, with an updated Period.\n\n\
    ## Clock\n\n[Own] Provides a way to represent current time that can be stubbed\n\
    \nTime driven functions need to know the actual real-world time now. Writing this,\
    \ it is the 11 Nov 2020, 22:54:23 BST.\n\nAll usable systems provide a way to\
    \ get real-world time. Java provides the older `new Date()` syntax to access the\
    \ system clock. The Java 8 Joda-time inspired update provides newer features and\
    \ a less zany syntax.\n\nBut both systems share the same problem. If you use them\
    \ directly in your code, you are stuck with the actual time, right now, in the\
    \ real world. This makes testing either hard or impossible. Recreating a production\
    \ fault from logs captured earlier is impossible, too.\n\nIn both cases, we need\
    \ a way to force the time to a test value.\n\nThe Clock pattern is a simple abstraction\
    \ of the system clock. Using the older Date syntax for simplicity, it looks like\
    \ this:\n\n```\n1 interface Clock {\n2     Date now();\n3 }\n```\n\nThis is a\
    \ Dependency Inversion (DIP). Our code now depends on only this interface for\
    \ its source of the current time, using the now() method.\n\nFor production, we\
    \ define a SystemClock class:\n\n```\n1 class SystemClock implements Clock {\n\
    2     public Date now() {\n3         return new Date();\n4     }\n5 }\n```\n\n\
    We Dependency Inject this SystemClock class to everywhere that needs to know the\
    \ time. Often, this comes from a Config class that runs at application startup.\n\
    \nFor testing, we inject a stub class:\n\n```\n 1 class StubClock implements Clock\
    \ {\n 2     private Date date ;\n 3 \n 4     public Date now() {\n 5         return\
    \ date ;\n 6     }\n 7 \n 8     public void setTo( Date d ) {\n 9         this.date\
    \ = d;\n10     }\n11 \n12     public void oneHourLater() {\n13         // code\
    \ to go forward one hour\n14     }\n15 \n16     public void oneHourEarlier() {\n\
    17         // code to go back one hour\n18     }\n19 }\n```\n\nThis stub has features\
    \ to set to a specific time, then move to an hour later or earlier. You would\
    \ change these to your specific test requirements. The idea is that you are creating\
    \ a Domain Specific Language (DSL) about test times, to make your test code into\
    \ readable documentation.\n\nThis is one of those insanely useful patterns that\
    \ it is actually muscle memory for me.\n\n## Rules (or Policy)\n\n[Own] Captures\
    \ a set of rules to apply in a single place\n\nRules are part of pretty much every\
    \ business process you want to automate. Things like applying for a mortgage,\
    \ verifying a user account, or checking a message for being spam will all have\
    \ a ruleset to apply.\n\nIn many cases, these rules get coded ad-hoc somewhere\
    \ in the system.\n\nIt is usually good for clarity if we pull out all the rules\
    \ into a single object. This also gives us the possibility of treating the rules\
    \ object a Strategy pattern. That gives us pluggable rules that can change.\n\n\
    An example is in calculating Tax from a given amount using a banded tax rate system.\n\
    \nSay you pay zero below 10,000\\. Then 20% between 10,000 and 30,000. Then 40%\
    \ above that. Don’t take the numbers too seriously; I’m hoping I’m a better developer\
    \ than a Chancellor of the Exchequer.\n\nHere is one way of doing this using the\
    \ Rulebook pattern:"
