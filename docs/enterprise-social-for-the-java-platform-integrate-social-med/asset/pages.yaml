  md: '# Realm


    A realm manages a set of users, roles, and permissions. A user belongs to and
    logs into a realm. Realms are isolated from one another and can only manage and
    authenticate users they control. Realms usually have a direct correlation with
    a data source, for example, a database, LDAP directory, file system, or a similar
    resource.


    # Features


    Figure 5-11 shows the main concerns of Shiro as well as other supporting features.


    ![](img/3c2d905e913621002f512a08b8855a70_170_0.png)


    Figure 5-11. Shiro Features


    +   * Authentication across multiple pluggable data sources including

    * LDAP/Active Directory

    * JDBC

    * JNDI

    * Authorization based on roles or fine-grained permissions

    * Know if a user is assigned a certain role or not.

    * Know if a user is allowed to do something or not.'
