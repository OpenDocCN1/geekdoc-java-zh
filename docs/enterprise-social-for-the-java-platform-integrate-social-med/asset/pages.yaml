  md: '# Fediverse


    The Fediverse (composed of "federation" and "universe") is a "global social network,"
    allowing users of one service to communicate with users of other services using
    open protocols like ActivityPub. Notable social networks in the Fediverse are


    +   * Mastodon

    * Diaspora

    * Friendica

    * GNU social

    * Hubzilla

    * Lemmy

    * PeerTube

    * Pleroma

    * Pixelfed


    Many in the industry consider Elon Musk''s Twitter takeover and transformation
    into his "X App" a huge catalyst for open social networks and the Fediverse. A
    statistics website called The-Federation.info, operated by Jason Robinson, lists
    the total users of the Fediverse as nearly 631 million, with roughly 7 million
    of them active over the last six months. Their statistics are voluntary and said
    to be incomplete; for example, Threads/Meta and several other large commercial
    players using standards and protocols from the Fediverse do not contribute to
    those states; thus; the numbers may well be over a billion and active users probably
    in the tens of millions right now.


    Other sites like Donald Trump''s Truth Social [45] are based on open standards
    and pretty much a Mastodon rip-off, but they don''t interact with other sites
    through the Fediverse, nor contribute user stats in a transparent manner. The
    currently active users on Truth Social are said to be around half a million, compared
    to nearly two million active Mastodon users as of August 2023.'
