    # GitHub


    While GitHub/Microsoft itself has no official Java API for GitHub, there are two
    actively maintained APIs offering a domain model, besides several others that
    support it on an REST/OpenID Connect level:


    +   * GitHub API for Java

    * GitHub Java Client


    Both offer a variety of authentication methods, including a personal access token.


    # Token Generation


