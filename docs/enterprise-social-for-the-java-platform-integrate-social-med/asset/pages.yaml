    \ for the following parameters:\n    - Name – This is the name of your application\
    \ you entered before.\n    - App icon – The logo is displayed to users when they\
    \ authorize with your app.\n    - Description – Enter a short description of the\
    \ application.\n    - Tags – Up to five tags to describe the content and functionality\
    \ of your application.\n    - Application ID – The application ID to copy into\
    \ your application.\n    - Public key – The public key to copy into your application.\n\
    \    - Server count – This is an approximation of the number of servers your application\
