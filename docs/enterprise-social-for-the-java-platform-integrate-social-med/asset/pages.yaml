    # Open Liberty


    Open Liberty is an open source implementation of Eclipse MicroProfile and Jakarta
    EE from IBM. It is the foundation of the WebSphere Liberty application server.

    Open Liberty 22 and above implement the Jakarta EE 10 security specifications.


    # Social Media Login


    The Open Liberty Social Media Login feature provides a form of Single Sign-On
    (SSO) enabling users to sign into a secured website by using their existing social
    media accounts.'
