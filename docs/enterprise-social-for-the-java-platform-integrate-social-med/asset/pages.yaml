    \ I Agree.\n6. Enter the security/captcha information if required.\n7. Your Consumer\
    \ Key and Consumer Secret are displayed. Write them down in a safe place.\n8.\
    \ Click the Settings tab.\n9. In the Application Type section, set the Access\
