  md: '# CHAPTER 4 SOCIAL SECURITY


    ourselves to interact with: our bank account, our email address, our social media
    accounts, etc. Yes, you got it right, the most common something you know authentication
    methods are passwords, secret codes, paraphrases, and personal identification
    numbers (PINs).


    The something you know authentication is the most commonly used method due to
    its low cost and easy implementation. However, its easy implementation has some
    side effects, one of which is that it may not be considered strong authentication.
    Moreover, the something you know authentication alone is not enough for applications
    or systems that require high security.


    # Something You Have


    The something you have authentication method refers to something that the user
    has. Did you notice one major drawback the something you know method has? It''s
    all about our memory and its (limited) capacity; that is, passwords can easily
    be forgotten. The something you have removes that problem, as it''s all some object
    that must be with you whenever you want to authenticate yourself. Again, it''s
    all about possessing some kind of token.


    Examples of something you have authentication could be a credit card, a USB stick,
    or an OTP card. Of course, carrying an authentication object with you entails
    its risks – they may be stolen, damaged, or lost.


    # Something You Are


    The something you are authentication method addresses what the user is and mainly
    refers to biometric authentication methods. Simply put, biometrics are any metrics
    related to human features that theoretically can be used for identification or
    verification of identity. There are various biometric data types such as facial
    recognition, fingerprints, iris and retina recognition, voice recognition, vein
    recognition, DNA, and digital signatures.


    Biometrics can distinguish one person from another.


    How does biometrics compare to the other two authentication methods? It''s less
    well understood than the something you know and something you have methods, it
    can significantly contribute to the strength of authentication when used correctly
    in addition to the other two methods.'
