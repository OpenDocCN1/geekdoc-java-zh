    # Client Authentication


    # What It Is


    An authentication mechanism where the client is securely granted access to a server
    by exchanging a digital certificate.


    You may come across the term “public key certificate” instead of “digital certificate.”
    Both terms are equivalent and serve the same purpose.


    # How It Works


    First of all, it is important to stress that client authentication is a more secure
    method of authentication than either basic or form-based authentication. Its main
    advantage is that it uses HTTP over SSL (HTTPS), in which the server authenticates
    the client using the client’s public key certificate.'
