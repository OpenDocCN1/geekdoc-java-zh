- img_proc: true
  md: '# Multiple Social Media Providers


    You can configure multiple social media providers for users to choose from. The
    user receives a customizable selection form before authentication with the available
    providers included on the form. The following example includes a choice of Google,
    GitHub, Facebook, LinkedIn, and Twitter:


    ```

    <googleLogin clientId="your_app_id" clientSecret="your_app_secret" />

    <githubLogin clientId="your_app_id" clientSecret="your_app_secret" />

    <facebookLogin clientId="your_app_id" clientSecret="your_app_secret" />

    <linkedinLogin clientId="your_app_id" clientSecret="your_app_secret" />

    <twitterLogin consumerKey="your_app_id" consumerSecret="your_app_secret" />

    ```


    ```

    <!-- protected applications need to have a security constraint defined -->

    <application type="war" id="formlogin" name="formlogin" location="server1/apps/formlogin.war">

    <application-bnd>

    <security-role name="Employee">

    <special-subject type="ALL_AUTHENTICATED_USERS" />

    </security-role>

    </application-bnd>

    </application>

    ```


    # Require Users to Be Corporate Registry


    You can restrict the presentation of a social media provider to only users who
    are also in another configured registry. For example, use the mapToUserRegistry
    attribute to configure your application. The user must authenticate through Google
    and also verify as an existing user in the company LDAP registry:


    ```

    <googleLogin mapToUserRegistry="true" clientId="your app id" clientSecret="your
    app secret" />

    <ldapRegistry ...> ... </ldapRegistry>

    ```'
