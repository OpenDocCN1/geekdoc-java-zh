  md: '# Identity Stores


    In this section, you will get introduced to the concepts of identity stores and
    their importance to security. Also, you will have a brief look at a basic setup
    of an identity store in Jakarta EE, which will be extended to an in-depth analysis
    in the following chapter.


    # What Is an Identity Store?


    An identity store is a component that stores application-specific identity information
    for a set of users, with usernames, groups, roles, group memberships, permissions,
    and credentials. Occasionally, it may also be used for storing other information
    as GUIDs (caller''s globally unique identifiers) or other caller attributes.


    To simplify the aforementioned definition, you can think of an identity store
    as a security-specific DAO (Data Access Object).


    # What Is the Purpose of an Identity Store?


    The purpose of an identity store is to validate a caller''s identity by accessing
    a caller''s identity attributes. That is, an identity store provides access to
    user information and is required for authentication.


    The four most important characteristics of an identity store are as follows:


    +   - Provides access to user information

    - Required for authentication

    - Validates credentials

    - Retrieves group membership


    An identity store can provide capabilities for authentication, authorization,
    or both.


    # Identity Store and Jakarta EE


    The broader Jakarta EE ecosystem comprises several APIs to help you govern your
    web application''s authentication (Jakarta Authentication), authorization (Jakarta
    Authorization), and security standards. The Jakarta EE API specifies, among others,
    the IdentityStore interface, providing an abstraction for an identity store.


    Implementing IdentityStore enables developers to interact with identity stores
    to authenticate users (i.e., validate their credentials) and to fetch caller groups.'
