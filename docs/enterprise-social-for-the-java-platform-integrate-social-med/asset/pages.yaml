    # # Credentials


    Credentials are pieces of data that Keycloak uses to verify the identity of a
    user. Some examples are passwords, one-time passwords, digital certificates, iris
    scans, and fingerprints.


    # # Realm


    A realm allows to manage a set of users, credentials, roles, and groups. A user
    belongs to logs into a realm. Realms are isolated from one another and can only
    manage and authenticate users they control.


