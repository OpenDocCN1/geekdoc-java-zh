    \ example, your company name.\n    * Application Description – Enter a short description\
    \ of the application.\n    * Website – This is the URL to your website, for example,\
    \ http://www.mysite.com.\n    * Callback URL – Set this to http://domain/wps/wcmsocial/servlet/oAuthCB/twitter\
