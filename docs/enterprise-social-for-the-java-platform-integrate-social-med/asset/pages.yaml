  md: 'So what is the IdentityStoreHandler interface about? It defines a mechanism
    for invoking IdentityStore to validate a user credential and is considered to
    be a safer way to authenticate a user.


    A default IdentityStoreHandler implementation is supplied by the container, and
    you can write your own custom implementation.


    Identity stores usually have a one-to-one relation with a data source such as
    a relational database, LDAP directory, file system, or another similar resource.
    Hence, implementations of IdentityStore use data source-specific APIs to discover
    authorization data (roles, permissions, etc.), such as JDBC, File IO, Hibernate/JPA,
    NoSQL, or any other Data Access mechanism.


    # OAuth


    OAuth is an authorization protocol to delegate rights for an application to act
    on behalf of a user who granted their rights without giving away login credentials
    like username or password.


    It was developed by Twitter, Magnolia, and Google and registered as IETF standard
    in April 2010 under RFC 5849.


    OAuth version 2.0 is simpler to use but often criticized for having too many flavors
    and implementations. OAuth 2 was standardized again by IETF in October 2012 under
    RFC 6749 and 6750. It is not backward compatible with OAuth 1.0a.


    Some notable adopters are Facebook, Amazon, Google, Salesforce.com, or Microsoft.
    All relevant social media APIs are based on either OAuth 1.0a or 2.0.


    Figure 4-3 shows the actors of the OAuth flow, often also called the “OAuth Dance.”


    +   - Resource Owner


    +   - Client


    +   - Server'
