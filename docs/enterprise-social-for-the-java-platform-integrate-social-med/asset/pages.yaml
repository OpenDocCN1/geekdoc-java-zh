    # Figure 4-3. OAuth Parties


    To use OAuth, one has to create an application on the target service to have an
    entry point for the consumer or resource owner, allowing access tokens to be issued
    to third party clients by an authorization server, with the approval of the resource
    owner, or end user. The client then uses the access token to access the protected
    resources hosted by the resource server.


    The OAuth “Dance” has three major steps:


    +   - Creation – Creating an application in the OAuth Social Media service.

    - Initialization – The right granting phase also called the OAuth Dance. At the
    end of the dance, we obtain an access token (formed by a public and secret part)
    used in the next step.

    - Signature – Each request is signed with access token and token identifying the
    OAuth application that was granted the rights.


    Figure 4-4 shows the steps and authentication flow in detail for OAuth 1.0a.'
