    # Authentication


    Like the word “Agora,” authentication is also derived from Greek terms. Originally
    from Greek “aftentikos,” it was a derivative of the noun “authentes,” “doer, master,”
    which was formed from “autos,” “self,” and the base -hentes, “worker, doer, being.”


    As authentication, we define the process of verifying someone’s identity. In other
    words, authentication is all proving that you’re indeed the person or the system
    you claim to be. Ok, let’s make this rather professional definition a bit easier
    to understand by pulling our beloved fictitious characters: Alice and Bob. Suppose
    Alice wants to send a message to Bob. How could Bob be sure that he is indeed
    texting with Alice and not with someone who claims to be Alice? There are basically
    three different there are basically three different ways Bob could use to verify
    Alice’s identity: by something she knows, something she has, or something she
    is.


    Authenticating someone’s identity may be a result of one or more of three types
    of methods:


    +   - Something you know

    - Something you have

    - Something you are


    # Something You Know


    We classify information as something you know if we store it in our memory and
    retrieve it when needed. We can identify something you know authentication methods
    in our daily interaction by taking a look at almost any system where we have to
    authenticate'
