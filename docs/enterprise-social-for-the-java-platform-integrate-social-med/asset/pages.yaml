    # How Does It Work?


    Passkeys are based on the WebAuthn cryptographic protocols developed by the FIDO
    Alliance. Each passkey is a pair of two asymmetric cryptographic keys and only
    works for the website it it was created. The key pair is made up of a private
    key''s kept on your device, inside a password manager supporting passkeys (the
    passkey provider), and a public key, stored on the website you want to log into.


    You can think of a public key certificate as the digital equivalent of a passport.


