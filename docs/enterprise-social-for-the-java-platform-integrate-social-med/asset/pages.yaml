    # CoreMedia


    While CoreMedia does not implement the Java Portlet standard, it runs on Java
    and is commonly used for creating “Enterprise Portals.”


    # History


    CoreMedia was founded in 1996 as a spin-off from the Multidisciplinary Engineering
    Science and Technology, a bit like Sun Microsystems founded at Stanford University.
    The company has its US HQ in Arlington, Virginia, and additional offices in Washington
    DC and London.


    In 2012, CoreMedia introduced Elastic Social, an extension module with social
    interaction capabilities like content moderation, user management, etc., mimicking
    social networks, not integrating them.


    # Social Media Hub


    Unlike Elastic Social, CoreMedia Social Media Hub allows the integration of various
    social networks into CoreMedia Studio. It shows a separate tab with different
    social media feeds and messages that are to be published.


    It is considered a CoreMedia Labs Blueprint or prototype that does not expose
    a stable API, but well, the Twitter API Client Library for Java is also in constant
    beta after these years, even in version 2.x.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Installation


    +   From the CoreMedia application workspace, clone the repository https://github.com/CoreMedia/coremedia-social-hub.git
    as a submodule of the extensions folder. Make sure to use the branch name that
    matches your workspace:


    ```

    git submodule add -b 1907.1 https://github.com/CoreMedia/coremedia-social-hub
    modules/extensions/coremedia-social-hub

    ```


    +   Use the extension tool in the root folder of the project to link the modules
    to:

    mvn -f workspace-configuration/extensions com.coremedia.maven:extensions-maven-plugin:LATEST:sync
    -Denable=coremedia-social-hub


    # Configuration


    The configuration of Social Media Hub consists of different settings that that
    can be applied to global or site-specific folders.


    +   Global: /Settings/Options/Settings/Social Hub/

    Site specific: <SITE>/Options/Settings/Social Hub/


    # Global Settings


    The Settings document declares global settings for the Social Media Hub and must
    be located in the global settings folder. It defines credentials for a bity account
    that is used for link shortening, and it defines additional CAE and document type
    model information that is required when media should be extracted from content
    social media posts.


    ```

    <CMSettings folder="/Settings/Options/Settings/Social Hub"

    name="locale"><locale>

    <master/>

    <settings>

    <Struct xmlns="http://www.coremedia.com/2008/struct">

    ```'
