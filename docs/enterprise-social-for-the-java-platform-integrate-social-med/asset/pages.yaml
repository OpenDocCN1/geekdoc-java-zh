  md: '# CHAPTER 4 SOCIAL SECURITY


    Vertical scaling means adding more resources like memory, storage, or CPU cores
    to a server. This can be expensive and also reach certain limits, for example,
    the number of CPUs, memory slots, or disk storage per server.


    Horizontal scaling scales your infrastructure by adding more servers behind a
    load balancer, which is usually more efficient and cost-effective than upgrading
    each of the servers all the time. While scaling horizontally is usually more efficient,
    it leads to further problems and complexity with just one location and load balancer.


    Imagine a single server behind a load balancer and a client performing a request
    using JSESSIONID like "abc", that session can be found in the server''s memory.


    ![](img/3c2d905e913621002f512a08b8855a70_108_0.png)


    Figure 4-11. Single Server Behind a Load Balancer


    If the infrastructure needs to scale and a new server is added behind the load
    balancer this new server gets to handle the next request by a client using "abc",
    it will not recognize that JSESSIONID.


    ![](img/3c2d905e913621002f512a08b8855a70_108_1.png)


    Figure 4-12. New Server Behind LB, User Not Recognized'
