  md: '3. The client sends back a response that contains a checksum (by default, the
    MD5 checksum) of the username, password, the realm, and given nonce value, the
    requested URI, and the HTTP method. `generate_md5_key(nonce, username, realm,
    password_given_by_user).`


    4. The server takes the username, realm, and the requested URI, and it looks up
    the password for the given username. When found, it generates its own version
    of let''s say `generate_md5_key(nonce, username, realm, URI, HTTP method, password-for-this-user-in-my-db).`


    5. The server then compares the output of `generate_md5()` that it got with the
    one the client sent and


    +   a. If they match, the client sent the correct password


    +   b. If they don''t match, the password sent was wrong


