  md: '# Table 4-1. Registered JWT Claims


    | Claim Name | Description | Reference |

    |---|---|--|

    | iss | The token issuer | RFC 7519, Section 4.1.1 |

    | sub | The principal that is the subject of the JWT | RFC 7519, Section 4.1.2
    |

    | aud | The recipients of the JWT | RFC 7519, Section 4.1.3 |

    | exp | The expiration time on or after which the JWT must not be accepted for
    processing | RFC 7519, Section 4.1.4 |

    | nbf | Time before which the JWT must be accepted for processing | RFC 7519,
    Section 4.1.5 |

    | iat | Time at which the issuer generated the JWT | RFC 7519, Section 4.1.6 |

    | jti | Unique identifier for the JWT | RFC 7519, Section 4.1.7 |


    # “iss” (Issuer) Claim


    The “iss” (issuer) claim identifies the principal that issued the JWT. The processing
    of this claim is generally application specific. The “iss” value is a case-sensitive
    string containing a URI value. The use of this claim is optional. We should validate
    that the issuer is a valid URL or the JWT was sent by an expected issuer.


    # “sub” (Subject) Claim


    The “sub” (subject) claim identifies the principal that is the subject of the
    token. Claims in a JWT are statements about the subject. The “sub” value is a
    case-sensitive string containing a URI value. The use of this claim is optional.


    # “aud” (Audience) Claim


    The “aud” (audience) claim identifies the recipients of the token. Each principal
    intended to process the JWT must identify itself with a value in the audience
    claim. The principal processing the claim does not identify itself with a value
    in the “aud” claim when this claim is present, then the JWT must be rejected.
    In general, the “aud” value is'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'CHAPTER 4 SOCIAL SECURITY


    an array of case-sensitive strings, each containing a URI value. The use of this
    claim is optional.


    # “exp” (Expiration Time) Claim


    The “exp” (expiration time) claim identifies the expiration time on or after which
    the token will not be accepted for processing. The processing of the “exp” claim
    requires the current date/time must be before the expiration date/time listed
    in the “exp” claim. Its value must be a numeric timestamp. The use of this claim
    is optional.


    # “nbf” (Not Before) Claim


    The “nbf” (not before) claim identifies the time before which the JWT must not
    be accepted for processing. The processing of the “nbf” claim requires that the
    current date/time must be after or equal to the not-before date/time listed in
    the “nbf” claim. Its value must be a number containing a numeric date value. This
    claim is optional.


    # “iat” (Issued At) Claim


    The “iat” (issued at) claim identifies the time at which the token was issued.
    This claim can be used to determine the age of the JWT. Its value must be a number
    containing a numeric date value. This claim is optional.


    # “jti” (JWT ID) Claim


    The “jti” (JWT ID) claim provides a case-sensitive unique identifier for the JWT.
    The identifier value must be assigned in a manner that ensures there is a negligible
    probability that the value will be accidentally assigned to a different data object;
    if the application uses multiple issuers, collisions must be prevented among different
    issuers as well. The “jti” claim can be used to prevent the JWT from being reused.
    The use of this claim is optional.


    # Signature


    The third part of the JSON Web Token is the signature. It is the most important
    part of a JWT to validate and ensure it was not modified or tampered with and
    can be trusted. The signature is generated using the payload and a secret key;
    therefore, anyone in possession of this key can generate new tokens with valid
    signatures.


    106'
