  md: '# PicketLink


    PicketLink was an umbrella for several security-related projects in the Red Hat/JBoss
    Middleware ecosystem. While Agora was never an official JBoss project, it was
    created for its ecosystem and standards like CDI. Therefore, supporting OAuth
    and Java EE Security through the means of PicketLink seemed a logical step for
    Agoraa.


    PicketLink is an Application Security Framework for Java EE applications. It provided
    features for authenticating users, authorizing access to business methods of your
    application, managing the application''s users, groups, roles, and permissions,
    etc.


    These are the top eight Java Application Security problems solved by PicketLink:


    +   1. What''s the best way to add security to the application?


    +   2. How do I authenticate and authorize users?


    +   3. How can I control access to classes and methods?


    +   4. How do I add Identity and Access Management (IAM) to my application?


    +   5. How can I create a secure multitenancy architecture for my SaaS (Software
    as a Service) application?


    +   6. How can I enable Single Sign-On based on SAML (Security Assertion Markup
    Language) in my application?


    +   7. How do I add authentication and authorization to my REST layer and API?


    +   8. How can my application authenticate users using their Facebook, Twitter,
    or Google accounts?


    Figure 5-12 shows an overview of PicketLink, its key components, and technologies
    it supports. Some marked "Coming Soon" were still under development and did not
    come with the GA (Generally Available or "Stable") versions of PicketLink.'
