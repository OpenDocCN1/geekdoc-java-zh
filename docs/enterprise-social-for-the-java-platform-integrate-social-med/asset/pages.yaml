    # Apache Shiro


    Apache Shiro is an open source security framework that provides application developers
    intuitive, simple ways of supporting


    +   * Authentication

    * Authorization

    * Cryptography

    * Session Management


    The word "shiro" means castle in Japanese.


    # History


    Shiro was created out of developer''s needs not met by standards around that time.
    Les Hazlewood and Jeremy Haiti created a security framework named JSecurity at
    SourceForge between 2004 and 2008 because they could not find an existing Java
    security framework suitable for their needs and JAAS (we already learned about
    in Chapter 1) did not work well for them. Their effort started roughly around
    the same time as Acegi Security in 2004, also at SourceForge, which was the largest
    open source hosting community, a lot like GitHub is now. JSecurity attracted more
    commenters including Peter Ledbro, Alan Ditzel, or Tim Veil.


    In 2008, JSecurity was submitted to the Apache Software Foundation and accepted
    into its Incubator program mentored toward becoming a top-level Apache project.
    Under the ASF Incubator, JSecurity was first renamed Ki (pronounced "Key"), only
    to be soon renamed Shiro due to trademark concerns. The project grew in the Apache'
