  md: '# CHAPTER 7


    # Social Portals


    As you remember from Chapter 3, Java Portlets were an early approach to mashups;
    therefore, popular portal servers also support social media integration like social
    login, mashups, or social sharing.


    # Liferay Portal


    Liferay is a "professional open source" company providing paid support and services
    its open source portal software.


    # History


    Liferay Portal was initially created in 2000 by co-founder and CTO Brian Chan
    to provide a portal solution to NGOs like churches. The first office of Liferay
    was also in a church.


    Liferay Inc. forged partnerships with Sun, shortly before it was acquired by Oracle,
    or TIBCO, but it remained independent and privately owned until now. With open
    source in its DNA, Liferay also actively helped shape the Java Portal standards
    like JSR 362 (Portlet 3.0) or 378 (Portlet 3.0 Bridge for JavaServer Faces 2.2),
    in this case as the Spec Lead.


    # Liferay Social


    Whether you want to create your own social media experience or integrate other
    social networks, you can do both with Liferay Portal.'
