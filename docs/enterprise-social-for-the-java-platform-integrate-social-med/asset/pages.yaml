  md: '# CHAPTER 5 SECURITY FRAMEWORKS


    themselves by providing a service account token that was created within the OpenShift
    cluster in the request. The following example shows how to configure the Social
    Media Login feature to use OpenID service accounts as a Single Sign-On provider:


    ```

    <okdServiceLogin />

    ```


    The okdServiceLogin element authenticates all protected resource requests received
    by Open Liberty. The OpenShift project that the service account is in, is used
    as for the group for the service account for authorization decisions.


    # Use Active Directory As Authentication Provider


    You can configure an Open Liberty server to use Active Directory as an authentication
    provider for protected resources. The oidcLogin element configures a social login
    using the OpenID Connect protocol. With OpenID Connect, the discovery endpoint
    URL provides the information that the client needs to interact with the authentication
    provider, which in this case is Active Directory. In the following example, the
    discoveryEndpoint attribute provides the endpoint URL for Active Directory:


    ```

    <oidcLogin

    id="liberty-aad-javaeecafe" clientId="1m2a72a8-YH32-T56W-95Pq-aFNu7849172"

    clientSecret="RahWkDUCpngeKUCg14ym6extsMcXPqdUCjYN"

    discoveryEndpoint="https://login.microsoft.com/organizations/v2.0/.well-known/openid-configuration"

    signatureAlgorithm="RS256"

    userAttribute="preferred_username" />

    ```


    # Keycloak


    Keycloak [66] is an open source identity, access management, and Single Sign-On
    solution for applications and services. Users can authenticate against Keycloak
    rather than each individual application, relieving the application from dealing
    with login forms, authentication, or storing user’s identities. Keycloak also
    offers social logins, support for desktop or mobile apps, and integration into
    other solutions including LDAP, Directory, OAuth, OpenID Connect, or SAML.'
