    # Latest Trends in Authentication


    Is that all? We can only use three authentication methods to secure our systems?


    Of course not. As hackers are becoming smarter, there is a need for additional
    (and more sophisticated) authentication methods, including somewhere you are and
    something you do.


    Somewhere you are related to your location and supports two different flavors:
    geolocation security checks where the location of the user is checked against
    the configured location of their account and MAC address checks, for example,
    an employee who is trying to access the company network from a different machine
    will not be granted any access to a different MAC address.


    Whatever you do is the least popular authentication method. This kind of authentication
    is all about verifying a user by observing their actions (touches or gestures).
    An example here could be the password feature Windows 8 comes with, which allows
    you to configure touches and gestures a picture as a way to authenticate yourself.
    A more tech-savvy example of something you do to authenticate yourself is your
    smartphone''s gesture authentication, where you use your thumb to swipe a gesture
    pattern on your smartphone''s screen so you can unlock it.


    # Passkey Authentication


    Passkeys allow you to sign securely to services like social networks, without
    having to enter a password.


    Unlike security keys, passkeys have the benefit of being user-verifying. This
    means passkeys verify your identity using "something you know" or "something you
    are," like a PIN or biometric check (such as a fingerprint, iris, or facial recognition)
    or a pattern, or a QR code.


