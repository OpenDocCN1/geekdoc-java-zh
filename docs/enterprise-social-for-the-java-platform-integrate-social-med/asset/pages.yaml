    \ board for the configured profile, the board link must be provided in the adapter\
    \ configuration. The link can be copied from your Pinterest profile:\n\n```\n\
    <StructProperty Name=\"adapter\">\n<Struct>\n  <StringProperty Name=\"board\"\
    >https://www.pinterest.de/[PINTEREST_PRORFILE]/[PINTEREST_BOARD_NAME]</StringProperty>\n\
    </Struct>\n</StructProperty>\n```\n\n# Connector Configuration\n\nSince the Social\
    \ Media Hub currently does not ship a native connector for this social network,\
    \ the actual connector configuration depends on the integration with a social\
    \ media tool.\n\n# Summary\n\nIn this final chapter, we learned about Enterprise\
    \ Portal servers and their social media support, either by providing social interactions\
    \ within the portal itself or by integrating social networks, from using them\
    \ for social login to sharing content or embedding the social timelines."
