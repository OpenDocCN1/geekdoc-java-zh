  md: '# Authorization


    Authorization has three main elements:


    +   * Permission

    * Role

    * User (Subject)


    # Permissions


    Permissions are an essential aspect of security policies. They allow what can
    be done in an application. Common permissions for data elements are Create, Read,
    Update, and Delete, commonly known as CRUD.


    # Granularity


    Shiro allows very fine-grained permissions where required, in any granularity,
    for example:


    +   * Resource level - The broadest definition, for example, allowing a user to
    edit customer records or finances

    * Instance level - Permissions that are specific to a particular instance of a
    resource, not just the general type, such as allowing a user to access the customer
    records of IBM, but not Red Hat

    * Attribute level - Allowing to specify permissions for an attribute of an instance
    or resource, for example, the home address or work address of an IBM employee


    Here''s a permission example. We check if users have permission to print using
    a “Colour Printer” and those who do see a “print” button, the others don''t. This
    is an example of an instance level permission.


    ```

    Subject currentUser = SecurityUtils.getSubject();


    Permission printPermission = new PrinterPermission("ColourPrinter"

    ,"print");


    If (currentUser.isPermitted(printPermission)) {

    // show the print button?)}

    ```'
