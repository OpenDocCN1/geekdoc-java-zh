  md: "# Connect Framework\n\nThe Connection<A> interface models a connection to a\
    \ service provider like Facebook:\n\n```\npublic interface Connection<A> extends\
    \ Serializable {\n    ConnectionKey getKey();\n    String getDisplayName();\n\
    \    String getProfileUrl();\n    String getImageUrl();\n    void sync();\n  \
    \  boolean test();\n    boolean hasExpired();\n    void refresh();\n    UserProfile\
    \ fetchUserProfile();\n    void updateStatus(String message);\n    A getApi();\n\
    \    ConnectionData createData();\n}\n```\n\nEach Connection is uniquely identified\
    \ by a composite key consisting of providerId (e.g., \"facebook\" and providerUserId\
    \ (e.g., the user's Facebook ID).\nLet's assume we have a Connection<Twitter>\
    \ reference to a user \"jdoe\".\n\n+   1. Connection#getKey() returns \"twitter\"\
    ,1234567, where 1234567 is @jdoe's Twitter id that never changes.\n2. Connection#getDisplayName()\
    \ returns @jdoe.\n3. Connection#getProfileUrl() returns \"http://twitter.com/jdoe\"\
    .\n4. Connection#getImageUrl() returns \"http://a0.twimg.com/profile_images/105951287/IMG_5863_2_normal.jpg\"\
    ."
