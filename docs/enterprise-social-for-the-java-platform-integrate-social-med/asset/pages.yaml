  md: '# CHAPTER 6 SOCIAL FRAMEWORKS


    The two most active Java Business APIs for Meta are as follows:


    +   - Meta Business SDK - The official Business SDK suite by Meta

    - WhatsApp Business API SDK - A community-driven WhatsApp Business SDK for Java.
    Currently superior to the official Meta SDKs for WhatsApp using Java, because
    they do not offer a strong Java object model yet


    # Meta Business SDK


    The Meta Business SDK [36] provides access to various Meta business APIs. It is
    an evolution of the Facebook Marketing API SDK, including the Marketing API and
    other Meta APIs like Pages, Business Manager, Instagram, etc., allowing to build
    customized enterprise solutions that seamlessly integrate a range of Meta services.


    # Overview


    The Meta Business SDK consists of the following parts:


    +   - Business Manager API - Allows to manage Meta assets, permissions, and ad
    campaigns for Facebook pages and ad accounts

    - Pages API - Allows to manage a business presence and community on Facebook

    - Marketing API - Allows to manage ad products, create, edit, or delete ads, and
    analyze their performance

    - Instagram Graph API - Allows to manage an enterprise presence on Instagram


    # Where''s WhatsApp?


    While WhatsApp (Meta) Business accounts exist for enterprises, WhatsApp support
    is currently not part of the Meta Business SDK.

    The API support for Java and other languages is currently more rudimentary than
    for other Meta services through the Business SDK. It''s mostly down to REST/HTTP
    client calls from the language of choice. We''ll show a WhatsApp example for Java
    here, but a more convenient Java wrapper by the community exists in the form of
    WhatsApp Business Java API SDK.


