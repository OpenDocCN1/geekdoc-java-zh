  md: '5. Connection#sync() allows you to synchronize the state of the connection
    with @jdoe''s profile.


    6. Connection#test() returns true indicating the authorization credentials of
    the Twitter connection are valid. This assumes Twitter has not revoked the "AcmeApp"
    client application, and @jdoe has not reset his authorization credentials.


    7. Connection#hasExpired() returns false.


    8. Connection#refresh() does nothing, as long as connections to Twitter don''t
    expire.


    9. Connection#fetchUserProfile() makes a remote call to the Twitter API to @jdoe''s
    profile data and normalize it into a UserProfile model.


    10. Connection#updateStatus(String) posts a status update on @jdoe''s timeline.


    11. Connection#getApi() returns a reference giving the client application access
    to the full capabilities of Twitter''s native API.


    12. Connection#createData() returns a ConnectionData reference that could be serialized
    and used to restore the connection at a later point.


