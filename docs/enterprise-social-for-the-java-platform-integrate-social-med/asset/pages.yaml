  md: "# Twitter/X\n\nThe social network formerly known as Twitter has at least two\
    \ Java clients with an object model wrapped around the Twitter/X REST APIs.\n\n\
    # Twitter API Client\n\nIn August 2021, Twitter started its own API Client Library\
