    +   - Session Management – Use in both web and “serverless,” or any environment
    where Single Sign-On, clustered, or distributed sessions are required.


    +   - Cryptography – Secure data with cryptographic algorithms beyond the standard
    Java ciphers and hashes, yet easy to use.


    Other supporting Shiro features are as follows:


    +   - Web Support – Helps secure web applications


    +   - Caching, to ensure applications run fast and efficient


    +   - Concurrency, supporting multithreaded applications


    +   - Test Support – Helping to write unit or integration tests to check if your
    applications are secure as expected


    +   - “Run As,” allowing users to assume the identity of another user, a bit like
    the “sudo” command on Linux


    +   - “Remember Me” to remember users across sessions, allowing them to only log
    in when required, for example, if the session expired


