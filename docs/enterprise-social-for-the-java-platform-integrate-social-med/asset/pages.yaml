  md: '# History


    In 1976, shortly after Microsoft or Apple, a group of eight engineers in India
    started a company to make personal computers. After an initially proposed name
    of Microcomp (which may have caused naming problems with Microsoft) on August
    11, 1976, the company was renamed to Hindustan Computers Limited (HCL).


    The company was initially focussed on hardware, but through HCL Technologies,
    the focus more and more became software and services.


    On December 7, 2018, HCL announced an agreement under which HCL Technologies acquired
    IBM software products for $1.8 billion, including AppScan, BigFix, Connections,
    Digital Experience (Portal and Content Manager), Notes/Domino, or Unica.


    In 2022, HCL Technologies rebranded itself to HCLTech.


    # HCL DX


    HCL Portal, formerly IBM WebSphere Portal, is part of HCL Digital Experience (DX).


    Through an extension called Social Media Publisher, users of HCL DX can share
    their content with popular social networks. Out of the box the following networks
    are supported:


    +   - Facebook

    - LinkedIn

    - Twitter/X


    # Social Media Publisher


    Social Media Publisher can be used to manage social media posts for published,
    and if configured also draft content.


    It supports both manual and automatic social media posts and can manage the cycle
    of social media threads.'
