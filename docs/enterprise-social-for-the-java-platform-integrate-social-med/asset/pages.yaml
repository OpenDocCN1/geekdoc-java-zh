  md: '# CHAPTER 1 INTRODUCTION


    # Generation Z


    At the start of the 2000s, many social networks were founded, although not so
    many of them survived until today. Hot or Not (AmIHotOrNot.com) was founded in
    October 2000 by James Hong and Jim Young, two friends and fellow students at the
    University of California at Berkeley. The initial motivation for the site was
    an argument about women''s attractiveness by the founders. It was the first site
    to upload photos for others to rate and allegedly influenced the creators of Facebook
    or YouTube. In 2008, Hot or Not was sold for a rumored $20 million to the owners
    of online dating service Ashley Madison (which later became infamous for losing
    all its customer data to hackers) and in 2012 purchased by Badoo, which is now
    part of the Bumble dating app conglomerate.


    While the URL still exists, the app has been rebranded to “Chat & Date” and has
    very little in with the original site, but Hot or Not of course is the first predecessor
    to modern dating apps like Tinder.


    Friendster, founded in 2002, was originally also planned as a dating site similar
    to Hot or Not, but it became a site to connect with like-minded people and their
    common friends. It contained a profile and status updates, allowing you to share
    your mood and exchange messages.


    Until early 2004 it was the biggest and most popular social network, something
    that eventually doomed it, because it could not scale to handle user demand and
    many of them frustrated, looking for alternatives. In 2003, Google offered $30
    million to purchase Friendster, but the founders turned that down. In 2009, it
    was acquired all by an Internet company named MOL Global in Kuala Lumpur. Besides
    a mostly Asian user base, Friendster''s patents were also a vital asset, including
    one for a “system, method, and apparatus for connecting users in an online computer
    system based on their relationships within social networks.” Most of these core
    social infrastructure patents were bought by Facebook for $40 million in 2010.


    A year later Friendster became a social gaming site. On June 14, 2015, the site
    was shut down, and three years later the company was terminated.


    Also founded in 2002, LinkedIn, later sometimes considered a “Myspace for adults,”
    was the first social network to users paid a premium package. Its job market and
    subscriptions helped it to become profitable in 2006. The job market and online
    resume would become a key feature, making it a more professional social network
    compared to others.


    In 2011, LinkedIn filed an IPO. Five years later in 2016, Microsoft acquired LinkedIn
    for $26.2 billion, the second largest acquisition behind the video game producer'
