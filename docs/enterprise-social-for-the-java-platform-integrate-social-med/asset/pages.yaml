  md: '# Use Cases


    Two of the main use cases for JSON Web Token are as follows:


    +   - Authorization

    - Information Exchange


    Authorization isably the most common use case for JWT. Once the user has logged
    into a system, each subsequent request will include the JWT, allowing the user
    to access pages, services, and resources that are permitted by that token. Single
    Sign-On is a feature that widely uses JWT nowadays, especially in public APIs,
    because of its small overhead and ability to be easily used across different domains.


    Information Exchange: JSON Web Tokens are a good way of securely transmitting
    information between parties. Because JWTs can be signed – for example, using public/private
    key pairs – you can be sure the senders are who they say they are. Additionally,
    as the signature is calculated using the header and the payload, you can also
    verify that the content has not been tampered with.


    # Why Do We Need JWT?


    The HTTP protocol is stateless; therefore, a new request such as GET /order/42
