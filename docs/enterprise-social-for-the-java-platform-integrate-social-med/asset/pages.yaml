    # Future


    Social networks have always existed, since people first to communicate. Technical
    means changed over time and are likely to change even faster in the near future.
    Some services will be merged; others might become irrelevant and vanish sooner
    or later. Using vendor-neutral standards and frameworks that won''t tie you into
    the offerings of a just provider, unless you want to spend more time on rapidly
    changing APIs than actually using it for something productive, or worse, having
    to switch over another provider if proprietary API and framework offered by a
    particular vendor are no longer available. While not a social network in the sense
    of Twitter or Facebook, one of the first crypto trading bankruptcies of Mt. Go
    [7], long before the likes of FTX, BlockFi, Celsius, or Voyager, was a good example
    for such a dilemma. It used to be a market leader in this area for some time.
    Therefore, applications and ecommerce solutions offering Bitcoin through its API
    were forced to rewrite or throw those apps away.


    If a vendor-neutral abstraction is created on top of such API, then it is much
    easier to cope with problems and changes like those caused by a vendor going out
    of business, being taken over by others, or a combination of both, like it still
    keeps looming for Twitter/X since the Elon Musk takeover and subsequent rebranding.


    This is where vendor- and social service-neutral approaches like the Fediverse,
    Agoraova, Keycloak, or Jakarta EE come into play.


    # Summary


    In this chapter, we learned about the history of social media, its boom years,
    what is happening right now, and where the future direction could lead to. As
    well as how mergers and acquisitions can sometimes pose a risk for your social
    media strategies, especially if some of the new owners are double-minded and eccentric
    to put it mildly.'
