  md: '# CHAPTER 6


    # Social Frameworks


    The previous chapter dealt with security frameworks like Soteria, Keycloak, or
    Spring Security. In this chapter, we''ll take a look at social frameworks like
    Meta Business SDK, Twitter4j, Twitter API Client, Legacy frameworks like Agoraava,
    Spring Social, or Facebook4j as well as frameworks for special purposes or vertical
    social networks.


    # Meta


    Meta Platforms owns a variety of social products:


    +   * Facebook

    * Instagram

    * (Facebook) Messenger

    * WhatsApp

    * Threads

    * VR products like Horizon Worlds


    The combined user base is the largest of any social net. More than 200 million
    businesses use Facebook, and more than 7 million advertisers actively promote
    their business on Facebook/Meta.


    Enough reason, that unlike some other big social networks, Meta offers a number
    of SDKs including dedicated business SDKs and support for a large variety of programming
    languages itself.'
