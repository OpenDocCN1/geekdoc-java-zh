  md: '# CHAPTER 4 SOCIAL SECURITY


    Authentication fails because the new server has no "abc" sessions in its memory.
    There are three main workarounds to address this.


    Synchronize the sessions between servers, which can be tricky and error-prone,
    especially in a globally distributed architecture.


    Use an external database or session caching mechanism. This can be helpful but
    adds more components to the infrastructure, and especially in a distributed environment,
    this cache or DB will need its replication.


    Or accept the stateless nature of HTTP and try to find a solution that works for
    it. That''s where JSON Web Token comes to the rescue, because each token is compact
    and self-contained, so it contains all the necessary information to allow or deny
    an API request without having to perform any replication or costly lookups.


    # How Does It Work?


    Token-based authentication mechanisms allow systems to authenticate, authorize,
    and verify identities based on a security token. The following entities are involved:


    +   - Issuer – Responsible for issuing security tokens as a result of successfully
    asserting an identity (authentication). Issuers are usually related with identity
    providers.


    +   - Client – Represented by an application to which the token was issued for.
    Clients are usually related to service providers. A client may also act as an
    intermediary between a subject and a target service (delegation).


    +   - Subject – The entity to which the information in a token refers to.


    +   - Resource server – Represented by an application that is going to consume
    the token in order to check if it grants access or not to a protected resource.


    Independent of the token format or applied protocol, from a service perspective,
    token-based authentication is comprised of the following steps:


    +   1. Extract security token from the request.


    For RESTful services, this is usually achieved by obtaining the token from the
    Authorization header.


    101'
  merge: -1
  pgno: 109
- img_proc: true
  md: '+   2. Perform validation checks against the token.


    This step usually depends on the token format and security protocol in use. The
    objective is to make sure the token is valid and can be consumed by the application.
    It may involve signature, encryption, and expiration checks.


    +   3. Introspect the token and extract information about the subject.


    This step usually depends on the token format and security protocol in use. The
    objective is to obtain all the necessary information about the subject from the
    token.


    +   4. Create a security context for the subject.


    Based on the information extracted from the token, the application creates a security
    context for the subject in order to use the information wherever necessary when
    serving protected resources.


    # JWT Structure


    A JSON Web Token has three parts:


    +   - Header

    - Payload

    - Signature


    Each of these parts is separated by a “.” character.

    Therefore, every JWT looks like


    Header.Payload.Signature'
