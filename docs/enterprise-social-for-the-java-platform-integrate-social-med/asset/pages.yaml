- img_proc: true
  md: 'CHAPTER 5 SECURITY FRAMEWORKS


    # History


    Keycloak was created by Bill Burke and Stian Thorgensen in 2014. The first release
    was published in September 2014 after development had started about a year before.
    In 2016, Red Hat switched the Red Hat SSO product from being based on the PicketLink
    framework to the Keycloak upstream project, after it had already merged the PicketLink
    code into Keycloak.


    Since then, Keycloak saw almost maine release cycles and version number changes.
    At the end of June 2016 Red Hat made Keycloak the basis for its SSO product, version
    2.0.0 was released. About a year later, version 3.0.0 came out, followed by Keycloak
    4.0.0 in June 2018.


    There probably was a bit of an influence by the Java and JDK cadence every six
    months and a Long-Term Service version every two years as of 2021, not only Keycloak
    but also other projects by Red Hat like WildFly seemed version-crazy after 2019
    because Keycloak 5.0.0 was released in March 2019 with 6.0.0 only a month later.
    In November 2019, the version number jumped to 8. As of August 2021, the most
    recent Keycloak version is 15.0.2. While the pace at least on the first digit
    seems like it slowed down a bit, versions 13–15 were all released in 2021 alone,
    which makes it look like Red Hat follows a major release nearly every three to
    four months at the very least, sometimes faster with only minor slowdown in the
    second half of 2021. The release notes are sometimes one-liners, which make one
    wonder how the giant leap of version numbers was justified, but it looks like
    marketing drives it and the underlying WildFly numbers also increase even more
    than Keycloak at 25, with WildFly 22–25 all realized in 2021 as well. Starting
    with version 17.0.0, the default Keycloak distribution switched from WildFly to
    Quarkus.


    On April 10, 2023, Keycloak was accepted by CNCF as an incubating project.


    # Overview


    Keycloak’s goal is to make security simple and easy for application developers
    to secure their enterprise apps and services.'
