    # Spring Security


    Spring Security [67] is a security framework that works especially well with the
    Spring Framework or Spring Web MVC and most recently Reactive applications using
    Spring Flux as well. Spring Security is a continuation of Acegi Security, a powerful
    security framework. But the problem was a lot of cumbersome XML configuration
    to realize it. Spring embraced it into the family from version 2.0 and, since
    then, refined to its present state. Although the XML configuration is still possible,
    Spring''s new spirit of convention over configuration also influenced the same
    way we also see in Jakarta EE. It is possible to perform all security configurations
    with annotation rather than XML, although the provision is still there for backward
    compatibility and to leverage certain flexibility. Its primary goal is to handle
    authentication and authorization for requests and method invocations.


