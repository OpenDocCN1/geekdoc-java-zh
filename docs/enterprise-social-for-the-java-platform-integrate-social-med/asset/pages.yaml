  md: 'CHAPTER 3 STANDARDIZATION


    # # Seam Social


    Seam Social was part of the JBoss Seam 3 project offering social connectivity
    on top of Java EE standards like CDI [28]. Seam Social is a binding library for
    consuming information. While OAuth on top of CDI and Java EE can be considered
    a Basic API, Seam Social was the richest Higher-Order API for Agoraava, especially
    by providing CDI events for social behavior such as likes, check-ins, or updates
    to a user''s Timeline. Common API bindings in most cases dictated by a provider''s
    API definition or sometimes directly generated from it was inspired by Spring
    Social, but Seam Social was never a clone or fork, as it stands to Spring like
    underlying CDI and extensions to do Spring Framework.


    In early 2012, Seam was stopped to be merged with Apache DeltaSpike, which was
    a reason for Seam Social to move on as well ... becoming Agorava [33].


    # # JSR 357


    Between Java2011 and further conferences like Devox in Antwerp, I initiated a
    series of discussions with CDI Spec Pete Muir, Twitter4j Yusuke Yamamoto, or Seam
    Social creator Antoine Sabut-Durand to explore a possible standardization of social
    media APIs for the Java platform in the Java Community Process.


    They thought it an idea worth pursuing. Other APIs and projects like DaliCore
    were considered possibly relevant (especially providing under Java EE) due to
    the strong use of CDI and rather well-structured separation of API and implementation
    made Seam Social the best candidate for initial code base.


    The JSR was proposed by me and Antoine as co-Spec Leads, joined by companies like
    Red Hat/JBoss, Exo Platform, or Twitter (represented by Twitter4j creator Yusuke
    Yamamoto) as well as JUG Chennai, DaliCore from BeJug or Java EE 7 EG Member,
    and Oracle ACE director Markus Eisele (now working at Red Hat, like Antoin until
    2021), a healthy mix of corporate individuals and JUGs one might say.


    However, after IBM voted against the JSR, other EC members SAP followed, one JUG
    (SouJava) voted for, the other (LIC) voted against it, and the creation ended
    8 against 5, stopping the creation of JSR 357. Sadly, although with big vendors
    preferring "walled gardens" [14] over open standards, not entirely surprising,
    even interested party and EG member candidate Twitter abstained. See [26] for
    an article about the ballot.


