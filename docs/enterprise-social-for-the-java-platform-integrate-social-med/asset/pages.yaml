- img_proc: true
  md: "For example, you can configure the Social Login feature so that users can log\
    \ into your website with their Facebook or Twitter accounts instead of having\
    \ to create accounts for your website only. You can enable the Social Login for\
    \ any social media platform that uses the OAuth 2.0 or OpenID Connect 1.0 standard\
    \ for authorization.\n\nTo enable its Social Media 1.0 feature, add the following\
    \ element to your server.xml file, inside the featureManager element:\n\n```\n\
    <feature>socialLogin-1.0</feature>\n```\n\nThe Social Login feature provides a\
    \ set of built-in configuration elements for popular social media providers, in\
    \ addition to generic configuration elements. The following examples show how\
    \ to configure different scenarios in the server.xml file.\n\n# Log In with Social\
    \ Media ID\n\nIf multiple social media providers are configured, a customizable\
    \ selection form is presented. The user can sign in with a social media provider\
    \ of their choice. The following example shows how to configure your application\
    \ to request that the user logs in their Google ID. You can generate your Google\
    \ credentials on https://console.google.com.\n\nIn this example, your_app_id and\
    \ your_app_secret are the Google Client ID and Client Secret credentials for the\
    \ formlogin application.\n\n```\n<googleLogin clientId=\"your_app_id\" clientSecret=\"\
    your_app_secret\" />\n\n<!-- protected applications need to have a security constraint\
    \ defined -->\n<application type=\"war\" id=\"formlogin\" name=\"formlogin\" location=\"\
    server1/apps/formlogin.war\">\n  <application-bnd>\n    <security-role name=\"\
    Employee\">\n      <special-subject type=\"ALL_AUTHENTICATED_USERS\" />\n    </security-role>\n\
    \  </application-bnd>\n</application>\n```"
  merge: -1
