    # Map Portlet


    The Map Portlet allows you to view the locations of team members around the world,
    but only members of the site to which the Map portlet has been added are displayed.


    First, you''ll need a key from Google to access Google''s Maps API with the Map
    portlet. Visit https://developers.google.com/maps/documentation/javascript/tutorial#api_key
    to obtain a valid Google Maps API key.


    Then perform the following steps:


    +   - Install the Social Networking plug-in, if you haven''t done so already.

    - Install the IP Geocoder portlet. (Both the Social Networking and IP Geocoders
    are available from Liferay Marketplace.)

    - Shut down your port server.

    - Download the Geo Lite City database from https://mirrors-cdn.liferay.com/geolite.maxmind.com/download/geoip/database/GeoLiteCityv6.dat.gz.

    - Unzip the .dat portlet-properties file in the /{ROOT}/webapps/ip-geocoder-portlet/WEB-INF/classes/
    directory of your Liferay installation.

    - Add the property maxmind.database.file={GeoLite City .dat file path} to this
    file.


    On Windows, make sure the file path is separated by \, for example, C:\\ce\bundles\GeoLiteCity.dat.'
