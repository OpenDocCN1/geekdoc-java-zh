  md: "![](img/3c2d905e913621002f512a08b8855a70_163_0.png)\n\n**Figure 5-8.** Filter\
    \ Chain for a Single HTTP Request\n\nFor the container, Spring Security is basically\
    \ a single filter, composed of multiple filters for different purposes. Spring\
    \ Security is installed as a single filter in the chain. This filter, named FilterChainProxy,\
    \ contains all the details about the different filters available through the security\
    \ filter chain. Using the Proxy Pattern, it determines which SecurityFilterChain\
    \ will be invoked for an incoming request.\n\nHere’s an example:\n\n```\n<bean\
    \ id=\"FilterChainProxy\" class=\"org.springframework.security.web.FilterChainProxy\"\
    >\n<sec:filter-chain-map path-type=\"ant\">\n<sec:filter-chain pattern=\"/webServices/**\"\
    \ filters=\"\n    securityContextPersistenceFilterWithASCFalse,\n    basicAuthenticationFilter,\n\
    \    exceptionTranslationFilter,\n    filterSecurityInterceptor\" /> />\n```"
