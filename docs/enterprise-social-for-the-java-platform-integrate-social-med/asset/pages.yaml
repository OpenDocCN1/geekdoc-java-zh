  md: '# About the Author


    ![](img/3c2d905e913621002f512a08b8855a70_8_0.png)


    Werner Keil is a Cloud Native consultant, Jakarta EE and Microservice expert for
    the financial sector. He helps Global 500 enterprises across industries and IT
    vendors. He worked for over 30 years as IT manager, PM, coach, and SW architect
    and consultant for the finance, mobile, media, transport, and public sectors.
    Werner develops enterprise systems using Java, Java/Jakarta EE, Oracle, IBM, Spring
    or Microsoft technologies, JavaScript,Node.js, Angular, and dynamic or functional
    languages. He is a Committer at Apache Foundation and Eclipse Foundation, a Babel
    Language Champion, a UoMo Project Lead, and an active member of the Java Community
    Process in JRSs like 321 (Trusted Java), 344 (JSF 2.2), 354 (Money, also Maintenance
    Lead), 358/364 (JCP.next), 362 (Unit-API 1), 365 (CD 2), 366 (Java EE 8), 375
    (Java EE Security), 380 (Bean Validation 2), and 385 (Unit-API 2, also Spec Lead),
    and was the longest serving Individual Member of the Executive Committee for nine
    years until 2017. Werner is currently the Committer Member representative in the
    Jakarta EE Specification Committee. He was among the first five Jakarta EE Ambassadors
    when it was founded as Java EE Guardians and is a member of its leadership council.'
