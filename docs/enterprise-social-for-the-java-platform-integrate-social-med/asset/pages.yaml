  md: "# Clients\n\nClients in Keycloak are entities (applications or services) that\
    \ wish to authenticate a user within a realm. They can also request identity information\
    \ or an access token so that they can securely invoke other services across the\
    \ network secured by Keycloak. During the authentication process, the client needs\
    \ to send its ID and secret. These credentials are obtained by registering the\
    \ client in the authentication server.\n\nWith many applications to secure and\
    \ maintain in an organization, it can become tedious to configure protocol mappers\
    \ and scope for all these clients. Keycloak lets you define shared client configurations\
    \ in a client template.\n\n# Events\n\nKeycloak provides extensive auditing functionalities.\
    \ Every interaction can be recorded and reviewed. There are two kinds of events:\n\
    \n+   - Login events\n- Admin events\n\nLogin events occur every time a user-related\
    \ action around authentication takes place, for example, login, logout, login\
    \ attempts that were unsuccessful, or when a user account gets updated. Admin\
    \ events are triggered by every change via the Admin API, either via Admin Console,\
    \ REST API, or Command-Line Interface. A Listener SPI allows you to create plug-ins\
    \ and listen for these events.\n\nHere is an example EventListener implementation\
    \ writing events to System.out:\n\n```\npublic class SysoutEventListener implements\
