  md: '# CHAPTER 3 STANDARDIZATION


    It was originally based on a CMS made by a Belgian start-up, mainly around BeUG
    (Devoxx conferences) members like Johan Vos. DaliCMS (2006) was called a "Web
    2.0 ready CMS"


    It was mostly an open source project with community features. In 2008, around
    the same time Sun did with SocialSite, support for Shindig was added to DaliCMS,
    mostly JavaScript code from Shindig and some Java code provided by DaliCMS.


    Eventually it became more than a CMS, and the underlying modules turned into DaliCore.
    During his talk at JavaOne2013, Johan unveiled the origin of the "Dali" part,
    which stood for "Dutch Amazon Lovers Initiative" – a tribute to Internet and Cloud
    pioneer Amazon.


    DaliCore added functionality common to user management, content, or permissions
    on top of Java EE 6, with a strong focus on users and permissions. In every project
    that DaliCore, users should be able to log in with existing credentials (Facebook,
    Twitter, Google+, LinkedIn.). So Cali modules extended DaliCore. While certain
    connectivity extends to social providers like Facebook, mainly serve as authentication
    providers to DaliCore SSO (Single Sign-On) functionality. Aside from that, DaliCore
    aims at providing information.


    Important aspects of DaliCore were as follows:


    +   * Mostly social contain CMS with partial open social features.

    * Java Persistence support via EJB, JPA, or similar standards.

    * No clear separation of modules, especially API/Spec and Implementation, in most
    cases shares the same module and even package size, making reuse and extension
    harder despite the attempt for that via Dali Module.

    * Seemed a bit heavy, strong dependency on the Full Java EE profile, that is,
    using only its Web Profile looked harder.

    * GlassFish support and integration are positive where it is the preferred application
    server. Thanks to the Java EE standard, it is not impossible but seems harder
    to use with other containers.

    * It demonstrated scalability also under heavy usage with some customers, for
    example, an e-voting system in Belgium. Unlike Apache Shindig or SunSocialSite
    (which DaliCore seems like a natural successor in most cases), it is used by actual
    customers at least in Benelux countries.


