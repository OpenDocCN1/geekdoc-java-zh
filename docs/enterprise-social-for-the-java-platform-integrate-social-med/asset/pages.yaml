  md: '# CHAPTER 1 INTRODUCTION


    As of 2010, the VZ Networks claimed a total user base of over 16 million users.
    However, soon, many users became inactive or left the network, which faced a decline
    of 70–80% compared to the years before. On September 7, 2017, the owner Poolworks
    declared StudiVZ bankrupt. In March 2022, the network was shut down.


    YouTube also started in 2005, a year after competing the online video site Vimeo.
    The first video was “Me at the zoo” [40] filmed in the San Diego Zoo, which so
    far (Q1/2023) had over 260 million views since then. Just a year later in 2006,
    Google acquired YouTube for $1.65 billion.


    2006 was the year Twitter hatched. Similar to Facebook, the name changed slightly,
    but notably from “Tittr” to an easier pronounce. The first tweet was posted by
    co-founder Jack Dorsey (@Jack) on March 21, 2006: “just setting up my twtr."


    A year later the hashtag was used. The symbol was inspired by the channel names
    in IRC, now used by many leading social networks. Twitter had a character limit
    of 140 characters, along the lines of SMS text messages. It took over a decade
    to double to 20 in 2017.


    In 2007, Twitch was launched, under the name Justin.tv by Yale graduates Justin
    Kan and Emmett Shear. By 2013, the company became profitable and had over 43 million
    monthly users. A year later, in 2014 after speculations about a YouTube acquisition,
    Amazon acquired Twitch Interactive for USD 970 million.


    # Here and Now


    In recent years, the majority of developments in social media were either security
    breaches and other difficulties or mergers and acquisitions, with a few notable
    exceptions.


    In 2015, Discord, an instant messaging and VoIP social platform, was founded.
    It soon became used by esports and LAN tournament gamers and benefited from relationships
