    # Social Network Integration


    There are several ways to integrate Liferay Portal with social networks like Facebook,
    LinkedIn, Twitter/X, or others.


    # Facebook Login


    You can set up Facebook as a single sign-on mechanism for Liferay DXP.


    Facebook Connect SSO authentication is an integration of Liferay with Facebook’s
    Graph API. To retrieve the user’s Facebook profile information and match it to
    existing Liferay DXP users. When new Liferay DXP users are added this way, they
    are created by retrieving the following four fields from Facebook:


    +   * Email address


    +   * First name


    +   * Last name


    +   * Gender


    To get Facebook App ID and App secret credentials:


    +   Go to https://developers.facebook.com/apps/.


    +   Click Create new App.


    +   Enter the values for the following parameters:


    +   a) Display name – The name of your application that is displayed at the end
    of each post, for example, your company name.


    +   b) Namespace – Optional value that is used to access Facebook Insights. It
    is recommended to use a unique name for each application you set up.'
