  md: "# Password Policies\n\nMany organizations have special password password policies.\
    \ Keycloak has a rich set of password policies to choose via the Admin Console.\
    \ There are several password policy types. Hashing the password uses the hash\
    \ algorithm. The password should match combinations of digits, upper- and lowercase\
    \ characters, special characters, or a regular expression. As well as common security\
    \ measures like no to contain the username, not use the same password multiple\
    \ times or the expiry date, after which the password must be changed.\n\n# Authentication\
    \ Flow\n\nThe sequence of actions by a user or service to authenticate in Keycloak\
    \ is called authentication flow:\n\n```\npackage org.keycloak.authentication;\n\
    public interface AuthenticationFlow {\n    String BASIC_FLOW = \"basic-flow\"\
    ;\n    String FORM_FLOW = \"form-flow\";\n    String CLIENT_FLOW = \"client-flow\"\
    ;\n\n    Response processAction(String actionExecution);\n    Response processFlow();\n\
    \    boolean isSuccessful();\n    default List<AuthenticationFlowException> getFlowExceptions(){\n\
    \        return Collections.emptyList();\n    }\n}\n```\n\nKeycloak includes various\
    \ authentication flows out of the box. Those can be configured as required, and\
    \ where your application may need something different, you can always create your\
    \ own authentication flow from scratch or start by copying an existing one."
