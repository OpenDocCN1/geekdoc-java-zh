  md: '# OpenID


    The initial OpenID protocol was created in 2005 by Brad Fitzpatrick at Six Apart,
    after he had sold his social network LiveJournal to this blog software company.
    The name of the company did not refer to Six Degrees of Separation [6] as it may
    seem, but a six-day age difference between its married co-founders.


    It was code-named Yadis (acronym for "Yet another distributed identity system")
    but was officially called OpenID after David Hahn, who had also considered a similar
    Single Sign-On project but lacked time and donated the domain "openid.net" [29]
    to Six Apart.


    Figure 4-8 shows the OpenID flow and its actors:


    +   * Browser

    * User

    * Relying party

    * Identity provider


    ![](img/3c2d905e913621002f512a08b8855a70_103_0.png)


    Figure 4-8. OpenID Flow


    While OpenID had not been standardized by an organization like IETF, large Internet,
    social media, and Telco players applied it, like AOL, Blogger, Flickr, France
    Telecom, Google, Hyves, LiveJournal, Microsoft, Mixi, Myspace, Novell, Orange,
    Sears, Sun, Telecom Italia, Telefonica O2, Universal Music Group, Veresign, WordPress,
    or Yahoo!


    Over times like SourceForge, PayPal, or Facebook joined supporters of OpenID under
    the OpenID Foundation. However, in the last two three years, there''s been a steady
    decline in OpenID supporters. Facebook left OpenID, SourceForge also offering
    an OpenID login (at the very least after Dice.com took it over from Geeknet),'
