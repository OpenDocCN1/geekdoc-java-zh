- img_proc: true
  md: "# Choose Between Social Media ID and Corporate Registry\n\nYou can give users\
    \ the option of logging in with either a social media provider or with their account\
    \ on the configured registry. For example, use the enableLocalAuthentication attribute\
    \ to configure your application so that users can log in with a Google ID or with\
    \ their account on their company's LDAP registry:\n\n```\n<!-- The user is given\
    \ a choice menu of Google or LDAP -->\n<googleLogin clientId=\"your app id\" clientSecret=\"\
    your app secret\" />\n<socialLoginWebapp enableLocalAuthentication=\"true\">\n\
    <ldapRegistry id=\"ldap\" ... /></ldapRegistry>\n```\n\n# Log In for Only Subset\
    \ of Paths or Browsers\n\nTo protect a subset of applications, URLs, or IP addresses,\
    \ use an authentication filter. The security configuration takes effect only when\
    \ the conditions in the filter are met. For example, you might want a web application\
    \ to be secured with the Social Media Login feature and a microservice application\
    \ secured with the MicroProfile JWT feature, remember from the previous chapter.\n\
    \nIn the following example, only requests that contain the /mywebapp URL pattern\
    \ are secured with Google credentials:\n\n```\n<googlelogin authFilter=\"authFilter1\"\
    \ clientId=\"your app id\" clientSecret=\"your app secret\" />\n<authFilter id=\"\
    authFilter1\">\n<requestUrl\n  id=\"myUrlFilter\"\n  urlPattern=\"/mywebapp\"\n\
    \  matchType=\"contains\" />\n</authFilter>\n```\n\n# Other Social Media Logins\n\
    \nTo authenticate with a social media provider that isn't preconfigured with Open\
