    Two main categories are as follows:


    +   1. Higher-order standards – Behavior and domain-driven business-oriented standards
    and APIs. Most of them not so clearly fleshed out by the authors of [16]


    +   2. Basic standards – Some were mentioned before, here grouped into four subcategories:


    +   a. Contacts


    +   b. Activity/Messaging


    +   c. Integration/Interoperability


    +   d. Security


    Then you may look at the way we social standards, frameworks, and libraries communicate,
    by either


    +   * Consuming information

    * Analyzing information

    * Transforming information

    * Providing information


    A typical example for consuming information would be showing your status in your
    favorite social networks inside another application, for example, your blog or
    corporate website.


    Another one is if you include a map service to show directions to an event you
    host or participate in.


    Analyzing information involves some sort of calculation, ranking or benchmarking.
    Often consuming more than one source of in-formation, so you can get a better
    picture. An example of such a service would be Klout. Where activities across
    multiple social influence your overall ranking.


    Transforming information can be done either by merging and combining several data
    streams, a simple sum of two numbers, or if, for example, your travel booking
    site predicts the cost of a trip in your local currency based on conversion rates.
    Translation services like Google Translate would be another, more sophisticated
    example of transforming information.'
