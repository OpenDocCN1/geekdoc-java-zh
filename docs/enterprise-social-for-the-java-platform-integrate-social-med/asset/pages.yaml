  md: 'Activision Blizzard, Microsoft tried to buy for $68.7 billion in 2022 [42].
    UK regulators raised concerns, but eventually on October 13, 2023 (even a Friday)
    they approved it.


    Myspace (MySpace before its rebranding in 2012), Friendster''s biggest rival that
    started in 2003, benefited most from frustration about the technical issues. Originally
    inspired by Friendster, it also offered improvements like customization or public
    profiles that did not require logging into it. In February 2005, MySpace rejected
    an offer by Mark Zuckerberg to sell Facebook for $75 million. A few months later,
    Fox News parent company Corporation purchased MySpace itself for USD 580 million.
    Until 2008 MySpace was the leading social networking site, but it was surpassed
    by Facebook in 2009 and since they rapidly lost users. In June 2011, Specific
    Media Group and Justin Timberlake purchased Myspace for approximately $35 million
    after News Corp had nearly paid a billion 6 years earlier. A reason for Timberlake''s
    involvement was that MySpace had its own record label by the News Corp. takeover
    and it generally appealed more to artists. Between 2016 and 2018 through a series
    of takeovers, MySpace got surpassed by what''s now the Dotdash Meredith media
    group.


    It still exists with roughly six million users, compared to hundreds of millions
    during its heyday.


    Also, in 2003, Mark Zuckerberg launched Facemash, a kind of Harvard University''s
    answer to Berkeley''s Hot or Not, rebranding it as “The Facebook” in 2004. The
    one million user joined the same year.


    In 2005, the site dropped the “the” and became just “Facebook,” after the “Facebook.com”
    domain was purchased for $200k, which seemed like a bargain to several takeovers,
    most notably Facebook buying Instagram for close to a billion dollars or its gigantic
    takeover for the mobile messaging service WhatsApp.


    Around that time a myriad of social networking sites came into existence. Photo
    sharing sites like Photobucket of Flickr, social bookmarking site del.icio.us,
    Reddit, or the blogging platform WordPress all started between 2003 and 2005.


    StuVZ and derivatives like both SchülerVZ or MeinVZ were a social network for
    students, founded on November 11, 2005 (coincidentally both “Single Days” and
    the beginning of Carnival) in Berlin by two students Ehsan Dariani (who became
    CEO) and Dennis Bennmann. A major feature of StudiVZ was the so-called “gruschen”
    (a mix of the German words “größen” = greet and “kuscheln,” meaning to cuddle).
    It was similar to Facebook’s poking function, allowing users to write short notifications,
    or the feature InterNations used to call “twinkle”.'
