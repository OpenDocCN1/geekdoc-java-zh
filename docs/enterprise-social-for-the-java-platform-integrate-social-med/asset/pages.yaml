- img_proc: true
  md: 'The most commonly used cryptographic algorithms to generate a signature are
    as follows:


    +   - HS256, which is short for HMAC-SHA256

    - RS256, short for RSA-SHA256

    - ES256, short for ECDSA P-256 SHA-256


    HS256 is a symmetric key encryption and involves a secret key being shared between
    two parties. This secret key is used to encrypt the data, and on the receiver
    side, the same key is used to decrypt the data. HS256 signatures are generated
    using a secret key that is validated at the receiving end (resource server). On
    the receiver side, using the payload and secret key, the signature has to be generated
    again and compared to the signature part of the incoming JWT. Since only the authentication
    server and resource server are in possession of the secret key, it is not possible
    to tamper with the JWT, and we can ensure its validity.


    # MicroProfile JWT


    A frustrating aspect of many standards is that some aim to be a jack of all trades
    offering a massive number of choices. This is definitely the case with JWT, which
    allows multiple types of digital signatures and many possible claims. While the
    possibilities are infinite, so many options mean infinite opportunities for interoperability
    issues.


    A critical goal of MicroProfile JWT is to take enough of these options that the
    basic interoperability across enterprises can be achieved in a way that favors
    microservices in particular.


    The focus of the MicroProfile JWT specification is the definition of the required
    format of JWT usable for interoperable authentication and authorization. MP JWT
    also maps JWT to various Jakarta EE container APIs and makes the set of claims
    available through better methods.


    The sources for the specification, API, and TCK are available from the Eclipse
    microprofile-jwt-auth GitHub repository.


    The purpose of MP JWT as a token format depends on the agreement between identity
    providers and service providers. This means identity providers – responsible for
    issuing tokens – should be able to issue interoperable tokens using the MP JWT
    format in a way that service providers can understand and validate the token and
    gather'
