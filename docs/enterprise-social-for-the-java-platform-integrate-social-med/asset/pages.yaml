    Agorava is independent of CDI implementation and fully portable between Java EE
    6 (minimum) and Servlet environments enhanced by CDI. It can also be used with
    CDI in Java SE in a Desktop or SE Embedded/Mobile application. It has been fully
    tested with the CDI RI implementation (JBoss Weld). OpenWebBeans and Caucho Resin
    were also supported since the 0.5 release.


    Agorava is often explained as a sort of “Java Connector Architecture for Social.”
    And indeed, there are striking similarities between the idea behind Agorava and
    what Jakarta Connectors (formerly JCA) does under the Jakarta EE umbrella.


    Jakarta Connectors defines a standard architecture for connecting the Jakarta
    EE platform to heterogeneous Enterprise Information Systems (EIS) including transaction
    processing systems such as CICS Transaction Server and Enterprise Resource Planning
    (ERP) systems like SAP, especially the so-called Common Client Interface (CCI),
    which defined a standard client API allowing applications to access multiple resource
    adapters.'
