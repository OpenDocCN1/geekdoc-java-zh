    and in September 2013, Social Login SaaS provider Janrain announced that its service
    MyOpenID would be shut down on February 1, 2014.


    So did mean OpenID dead? More or less in its original form, but at least still
    Google has high hopes for it. Strange coincidence, the initial creator of OpenAPI,
    Brad Fitzpatrick, now works at Google, probably a main reason why the company
    remained loyal to OpenID, when most other supporters abandoned it. OpenID Connect,
    Google’s new approach, has, however, not much in common with the old version of
    OpenID. It adds improved authentication and Identity Management on top of the
    otherwise winning combination of OAuth 2, JSON, and RESTful Services.


    # OpenID Connect


    OpenID Connect was released by the OpenID Foundation at the end of February 2014.
    Besides Google, Microsoft, Salesforce.com, or Deutsche Telekom adopted it that.
    At Mobile World Congress 2014 in Barcelona, GSMA announced plans for a mobile
    version “Mobile Connect,” enough suggesting it would stay for some time.


    OpenID Connect is extensible, supporting optional features like encrypting identity
    data, discovery of OpenID providers, or session management.


    # JWT


    JSON Web Token (JWT) is an open standard filed under RFC 7519 to securely transmit
    information between different applications or services via JSON strings.


    JWT is compact, human-readable, and digitally signed using a private or public
    key identity provider (IdP). So the integrity and authenticity of the token can
    be verified by other involved parties.


    The main purpose of JWT is not to hide data but to ensure its authenticity. JWT
    is mainly used to sign and encode, but not encrypt data, although the tokens may
    also be encrypted on another set of standards including JSON Web Signature (JWS)
    and JSON Web Encryption (JWE).


    JWT is a token-based stateless authentication mechanism. Since it is based on
    a client-side stateless session, servers don’t need a persistence mechanism like
    a database to save information about the session. JSON Web Tokens follow a well-defined
    and known standard that is becoming the most common token format to protect services.'
