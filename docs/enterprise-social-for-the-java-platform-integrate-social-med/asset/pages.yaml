  md: 'For OIDC, Keycloak defines four main authentication flows:


    +   * Authorization Code Flow – For browser-based or server-side applications.


    +   * Implicit Flow – For browser-based applications, this flow is not as secure
    as Authorization Code Flow and deprecated as OAuth 2.1 so it can be used for backward
    compatibility, but it''s not recommended anymore.


    +   * Client Credentials Grant – For consumers of RESTful web services, involves
    storing a secret, so the clients should trust the services they consume.


    # Authorization


    Keycloak supports multiple authorization policies and allows to combine different
    access control mechanisms like


    +   * Attribute-based access control (ABAC)


    +   * Role-based access control (RBAC)


    +   * User-based access control (UBAC)


    +   * Context-based access control (CBAC)


    +   * Rule-based access control


    +   * Time-based access control


    +   * Custom access control mechanisms via a Policy Provider SPI'
