  md: '# CHAPTER 5 SECURITY FRAMEWORKS


    # History


    Spring Security began two decades ago, in late 2003, as “The Acegi Security System
    for Spring,” initially created by Ben Alex, based on questions asked on the Spring
    Developers’ mailing list whether there had been any Spring-based security implementation.
    Back then, the Spring community was relatively small, and Spring itself had only
    existed as a SourceForge project from early 2003. The answer to the question was
    that it was worthwhile, although a lack of time and resources prevented the exploration
    back then.


    With that mind, a simple security implementation was built but remained unreleased.
    A few weeks later, another member of the Spring community asked about security,
    and this code was offered to them.


    Other questions followed, and by January 2004, around 20 people were using the
    code. These initial users were joined by others who suggested a SourceForge project
    of its own, which was created in March 2004.


    Back then, the project didn’t have its own authentication modules. J2EE Container
    Managed Security was used for the authentication process, with the first version
    of Acegi Security instead focusing on authorization. This was suitable at first,
    but as more users requested support for additional containers, the limitation
    of container-specific authentication realm interfaces became evident. Adding new
    JARs to the container’s Classpath also caused issues, which was a common source
    of confusion and misconfiguration. Acegi Security authentication services were
    introduced. And around a year later, Acegi Security became an official Spring
    Framework subproject. The 1.0.0 final release was published in May 2006 – after
    more than two and a half years of production by numerous projects and hundreds
    of improvement requests and community contributions. Acegi Security became an
    official Spring project towards the end of 2007 and was rebranded to “Spring Security.”


    # Overview


    Spring Security is based on three main concepts:


    +   - Authentication

    - Authorization

    - Servlet Filters'
