  md: '1. Go to https://console.developers.google.com.


    2. Create a new project, for example, “ApressBookDemoApp”.


    3. Create OAuth 2.0 credentials for the project since Google does not do that
    automatically. From the sidebar, click the Credentials tab, then click **Create
    credentials**, and choose **OAuth client ID** from the drop-down.


    4. Google will prompt for some information about your application such as the
    product name, home page, and logo. Most of them are optional. On the next page,
    select the **Web Application** type, and enter the redirect URL where the Jakarta
    EE application we build will wait for the callback. Enter http://localhost:8080/callback
    as the redirect URL.


    5. You then see the Client ID and Client Secret on a screen. Download as JSON
    and store it in a secure location.


    Edit/create src/main/resources/oidc.properties in your Jakarta EE application:


    ```

    issuerUri=https://accounts.google.com

    email=<your-email-address>

    clientId=<your-client-id>

    clientSecret=<your-client-secret>

    ```


    Replace the values of clientId and clientSecret with those in the JSON file from
    Google and email with the email address of a valid test user, for example, your
    own Gmail address.


