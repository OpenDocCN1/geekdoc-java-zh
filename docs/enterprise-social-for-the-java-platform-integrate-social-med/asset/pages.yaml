    URL will be decorated with dynamic data and linked to the Liferay Sign In portal.


    +   OAuth Token URL – Facebook OAuth access token URL. Liferay DXP uses this to
    exchange a request token for an access token.


    +   OAuth Redirect URL – The users will be directed to one OAuth request token
    has been generated. The URL points to a Liferay DXP service that exchanges the
    request token for the access token, required in order for Liferay DXP to successfully
    call the Facebook Graph API. You should only need to change this URL if requests
    to Liferay DXP go through a proxy server like Apache doing URL rewriting.


