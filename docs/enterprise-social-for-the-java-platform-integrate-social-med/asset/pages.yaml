    # Private Key JWT for Connect Authentication


    OpenID Connect clients that are configured by using the oidcLogin element in the
    Social Media Login feature support the private_key_jwt client authentication method
    with OpenID Connect connect endpoints. The process for enabling this in the Social
    Media Login feature is identical to the OpenID Connect 1.0 feature:


    ```

    <oidcLogin id="myOidcClientUsingKeyJwt"

    tokenEndpointAuthMethod="private_key_jwt"

    tokenEndpointAuthSigningAlgorithm="E512"

    keyAliasName="privatekeyaliasES512"

    ```


    # Use OpenShift Service Accounts to Authenticate and Authorize


    The Social Media Login feature can be configured to use OpenShift service accounts
    to authenticate and authorize protected resource requests. With this configuration,
    server administrators can secure endpoints, for example, oidc and metrics endpoints,
    that might produce sensitive information. The service accounts can authenticate'
