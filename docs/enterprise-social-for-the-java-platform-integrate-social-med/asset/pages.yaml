  md: '# CHAPTER 7 SOCIAL PORTALS


    When the configurations are read during startup, the Social Media Hub will try
    to map each configuration to the corresponding Social Media Hub adapter. It uses
    the implementation of SocialHubAdapterFactory available for every Social Media
    Hub adapter. The SocialHubAdapterFactory#getType must match the type property
    in the adapter setting.


    # Connector Settings


    A connector configuration usually contains the credentials for accessing a social
    network or API. Apps mapping this configuration must extend the ConnectorConfiguration,
    which contains additional settings valid for all connector configurations.


    The ConnectorConfiguration interface exposes the following method:


    +   - getImageVariant() - The name of the image variant used when image is pushed
    to the external system. If the variant is not found or configured, the original
    blob will be used.


    # Twitter/X


    The following section describes configuration properties for the Twitter Social
    Media Hub adapter.


    # Adapter Configuration


    To show the Twitter timeline for the configured profile, the timeline link must
    be provided by the adapter configuration:


    ```

    <StructProperty Name="adapter">

    <Struct>

    <StringProperty Name="timeline">https://twitter.com/[YOUR_PROFILE]/

    <StringProperty>

    </Struct>

    </StructProperty>

    ```


    # Connector Configuration


    Create your Twitter/X application as instructed in the previous section for HCL
    Portal.'
