  md: '# CHAPTER 4


    # # Social Security


    The surge of cybersecurity attacks has nowadays created the need for defending
    your organization on multiple security fronts, be it physical, technological,
    or policies and procedures. Each one of the aforementioned fronts is equally important
    to your organization''s security. None of them should be undermined toward creating
    a future-proof and secure organization. That is, having only physical and technical
    security could indeed be somewhat challenging to hackers, yet if your employees
    are not well educated to protect their passwords, your organization isn''t very
    secure overall.


    Information security is based on


    +   - Confidentiality

    - Integrity

    - Availability


    These three concepts are often referred to as the CIA Triad. It formed over time
    and does not have a single creator. Confidentiality was first proposed as early
    as 1976 in a study by the US Air Force, the concept of integrity was explored
