  md: '# Steps to Authenticate a Subject


    Authenticating a Subject can be broken down into three steps:


    +   1. Collect the Subject''s submitted principals and credentials.

    2. Submit the principals and credentials for authentication.

    3. If the submission was successful, grant access; otherwise, retry authentication
    or block access.


    Here''s how to use Shiro''s API for these steps:


    # Collect the SubjectMember''s submitted principals and credentials


    ```

    //Most common scenario of username/password pair:

    UsernamePasswordToken = new UsernamePasswordToken(username, password);

    //"Remember Me" built-in:

    token.setRememberMe(true);

    ```


    In this case, we used the UsernamePasswordToken, supporting the most common username/password
    authentication approach. This is an implementation of Shiro''s org. apache.shiro.authc.AuthenticationToken
    interface, which is the base interface of Shiro''s authentication system to represent
    submitted principals and credentials.


    Shiro does not care how you acquire this information: perhaps the data was entered
    via HTML form, or maybe retrieved from an HTTP header, or maybe through command-line
    arguments. The process of an application collecting information from users is
    completely decoupled from Shiro''s AuthenticationToken concept.


    You may construct and represent AuthenticationToken instances any way you like;
    it is protocol agnostic.


    This example also shows that we have indicated that we wish Shiro to perform "Remember
    Me" services for authentication.'
