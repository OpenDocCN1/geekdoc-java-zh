    ![](img/3c2d905e913621002f512a08b8855a70_12_0.png)


    **Figure 1-1.** Morse-Vail Telegraph Key


    # Modern History


    During the 20th century, information technology as we know it now started with
    pioneers like Konrad Zuse, George Stibitz, or Howard Aiken, and of course Alan
    Turing, who created the Turing test as a benchmark for AI and social bots.


    # Generation X


    In 1975, shortly before the American military pulled out of Vietnam, the libertarian
    thinker Samuel Edward Konkin III introduced a philosophy called Agorism, a social
    philosophy of counter-economics and the ideas associated with that practice [5].
    In a market anarchist society, law and security would be provided by market actors
    instead of political institutions. Agorists recognize the situation cannot develop
    through political reform. Instead, it shall arise as result of market processes.
    Aspects of its social values can be found today in the Occupy Movement, its primary
    goal being to make the economic and political relations in all societies less
    vertically hierarchical and more flatly distributed. Or in protest parties like
    Beppe Grillo in Italy, Syria in Greece (where'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# CHAPTER 1 INTRODUCTION


    it even took over government), Podemos in Spain, or the Pirate Parties. Agorism
    put forth the idea of using different currencies, something modern social media
    and related online communities are adopting digital currencies like Bitcoin.


    In 1966, the email was invented, ARPANET, a network of computers created by the
    US military about a year later, followed by the arrival of CompuServe in 1969.
    CompuServe launched its email service in the late 1980s and expanded into early
    1990s, before finally dissolving original CompuServe in 2009 after several takeovers.


    Usenet started up in 1979 and provided its users with forums and newsgroups. Surprisingly,
    most of their functions have changed very little and still exist today.


    Internet Relay Chat (IRC) was born in 1988 and was widely used across academic
    networks before emerging into what is now the Internet. IRC remains quite active
    today, although it is largely overshadowed by other short messaging services like
    Twitter. There are still around 3200 IRC servers around the world with hundreds
    of thousands of channels available.


    # Millennials


    Based on the notion of Six Degrees of Separation [6], the first modern social
    network, sixdegrees.com, was founded in 1997. It allowed members to link to other
    members as friends, write messages, or post on bulletin boards. After being sold
    onto another company for $125 million, it was shut down in 2001 with roughly around
    one million users. It later made a minor comeback and still exists today.


    When services like Amazon, Yahoo!, and, in 1998, Google first came into existence,
    they were not considered social networks. In 1995, Microsoft picked up on the
    emerging trends by launching the Microsoft Network (MSN). MSN became known as
    a “portal,” another word for personalized online community. It wasn’t surprising
    when many portal products, servers, and vendors joined the social bandwagon a
    few years later.


    Both Microsoft and Yahoo! had fallen behind after some of social media’s new kids
    on the block, and beside a rather brilliant and fast move with YouTube, most other
    aspects of social media were also a bit underestimated by Google, until it returned
    via Google+ and is certainly here to stay if it may not lead every aspect of it
    plenty of social features and has since its recent recovery over smaller vendors
    in the social networking space like Flickr or Tumblr. In 1999, Brad Fitzpatrick,
    who later also worked at Google, founded LiveJournal.'
  merge: -1
