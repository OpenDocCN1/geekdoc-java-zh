  md: 'For example, a hacker should not be able to seize and modify any data before
    it’s sent to the intended recipient.


    Availability – Requires that information is accessible whenever authorized users
    need it.


    In addition to the CIA Triad, there are some more key concepts of social media
    security:


    +   - Confidentiality

    - Integrity

    - Availability

    - Privacy

    - Authentication

    - Authorization


    Privacy – Users can control the access, use, and disclosure of their personal
    information. Privacy is the concept of maintaining secrecy, anonymity, and freedom
    from surveillance or intrusion into one’s private matters. Privacy can be understood
    as the power to control when, how, and to what extent personal information is
    shared with others.


    Under the CCPA, personal information is “information that identifies, relates
    to, describes, is reasonably capable of being associated with, or could reasonably
    linked, directly or indirectly, with a particular consumer or household.”


    Under the GDPR, personal information is termed as “personal data,” which is considered
    “any information related to an identified or identifiable natural person.”


    Authentication – Users can prove who they say they are, their **identity**; for
    example, a client can prove to a server that they are acting on behalf of an authorized
    identity and vice versa. Or the caller ID of an incoming call.


    Authorization – Users have enough permissions to access restricted resources or
    perform specific operations.


    Authentication and authorization are sometimes confused nowadays, so here’s a
    good way to remember how these two differ in the world of identity and access
    management (IAM). Authentication confirms that users are who they say they are,
    whereas authorization permits these users to access a resource.'
