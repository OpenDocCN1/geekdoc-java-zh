    {

    q Superob = new q ( );

    p superob = new p ( );

    Subob. i = 8;

    Subob. j = 7;

    Subob. a = 9;

    System.out.println (“contents”);

    Subob.showij ( );

    Subob.showa ( );

    System.out.println (“sum of i, j and a”);

    }

    }

    ```

    #### 输出

    ```

    contents

    i and j: 8 7

    a: 9

    sum of i, j and a: 24

    ```

