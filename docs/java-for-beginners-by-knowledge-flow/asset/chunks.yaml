    ```\n\n- **Double（双精度型）**：位宽为 64 位，范围从 4.9e-324 到 1.8e + 308。它的使用经过优化，可以用于高速数学计算。它具有双精度，比单精度更快。诸如\
    \ `sin()` 和 `sqrt()` 等函数返回 double 值。\n声明：\n```\nDouble pi, r, a;\nr = 10.4;\n\
    pi = 3.14;\na = pi* r * r;\n```\n\n### 字符类型\n- Java 中用于存储或声明字符的数据类型是 `char`。\n\
    - 它是 Java 中的 16 位类型。`char` 的范围是 0 到 65,536。\n- 性质上没有负字符。\n\n`char` 的程序演示：\n```java\n\
    Class charExample\n{\n    Public static void main (String args []) {\n       \
    \ Char a, b;\n        a=88;\n        b=’y’;\n        system.out.print (“a and\
    \ b: “);\n        system.out.println (a + “ “ +b);\n    }\n}\n```\n\n### 布尔类型\n\
    - 它是逻辑值的原始类型。\n- 它倾向于只有两个可能的值之一：true（真）或 false（假）。\n- 它受 if 或 for 控制语句支配。\n\n\
    ## 变量\n它是存储的基本单元，变量具有作用域、可见性和生命周期。\n\n### 变量的声明\n```\nInt x, y, z;\n```\n或\n```\n\
    Int x=1, y=2, z=5;\n```\n\n### 类型转换与强制转换\n如果两个类型之间存在任何兼容性，Java 将自动执行转换。\n\n####\
    \ Java 自动转换\n- 当满足两个条件时执行。\n- 当两个类型兼容时；\n- 目标类型大于源类型。\n- 在满足这两个条件后，会发生宽宽转换。\n\n\
    #### 强制转换兼容类型\n- 这是一种简单且显式的类型转换。\n- 当浮点类型转换附加到整数类型时，这种转换被称为截断。\n- 它是一种转换，有时被称为窄转换。\n\
    \n## 数组\n- 它是相似变量的组，通过通用名称引用。\n- 数组中的元素通过索引访问。\n- 它可以被创建，并可能有一个或多个维度。\n\n### 数组的类型\n\
