    ## The ? Operator


    This is used for replacement of if then else statements and it is represented
    as `?`.


    ### For example

    `expression a ? expression b : expression c`


    This above example states that if the `expression a` is true then `expression
    b` is evaluated otherwise `expression c` is evaluated.


    ![page-divider.png](images/00002.jpeg)


    ## Control Statements


    There three types of statements in java.


    1. Selection statements

    2. Iteration statements

    3. Jump statements


    ### Selection statements


    * It is to manage the flow of programs that is to be executed based on the dynamic
    conditions which can be only realized during the run time.

    * It provides flexibility.


    #### If statement

    It provides different paths for execution of program.


    #### Syntax

    ```java

    If (condition provided) statement a;

    Else

    Statement b;

    ```

    This means if the condition is true, then `statement a` is executed but if false
    then `statement b` is executed.


    #### For example

    ```java

    int a, b;

    If (x < y) a=0;

    Else

    b=0;

    ```

    Now there is one type of procedure using if statement i.e. `nested if statement`
    and it is very common method in programming world.


    #### For example

    ```java

    If (a == 10) {

    If (b < 15) i = j;

    If (c > 50) p = q;

    Else

    i = p;

    }

    Else

    i = q;

