    # Introduction to Java


    - Java was designed and conceived by James Gosling, Patrick Naughton, Chris Warth,
    Ed Frank and Mike Sherdan, which was done at Sun Microsystems in year 1991.

    - It took almost 18 months for `java` to come into existence as a working version.

    - Initially `java` was known as “Oak”, which was then renamed as “Java” in year
    1995. Since `java` had much had much of its character designed from `C` and `C++`.

    - This character inherited by the two well known and simple programming makes
    `java` more appealing to computer and it giants which would lead to a large scale
    success.

    - But `java` is misunderstood as the sophisticated internet version representation
    of `C++`.

    - It has significant difference practically and philosophically when compared
    to `C++`.

    - If you have good knowledge in `C++` then you will find `java` as your cup of
    tea and you will at ease using and understanding `java`.


    ![java-logo.jpg](images/00004.jpeg)


    Logo of Java


    Therefore, there are two main reasons for the evolution of the computer languages.


    Java had enhanced and refined the object oriented scenario of `C++`. This gave
    more features to the users which are as follows.


    - Multithreading.

    - Library which would provide easy internet access.

    - One of the `java`’s magic was the byte code. Byte code is set of instruction
    which is highly optimized and designed to be executed by `JVM` (Java Virtual Machine).
    It is an interpreter for byte code. This lead to the design of truly portable
    programs.


    Java redesigned the internet with new feature and networked program which are
    as follows.


    - Applets - It is a kind of `java` program that is to be transmitted over and
    executed automatically by `java` compatible web browsers.

    - Security - It provided the security of downloading various applets and programs
    from internet without containing any virus or Trojan horses.

    - Portability- Since there is large and different kind of operating systems therefore
    it provides the freedom of running in any operating system so its program can
    be used in different OS without any issues of compatibility.


    The evolutions in `java` are as follows:


    - Java 1.0

    - Java 1.1

    - Java 1.2

    - J2SE

    - J2SE 1.2

    - J2SE 1.3

    - J2SE 1.4

    - J2SE 5

    - J2SE 5 made various changes to Java


    The new feature that was added is as follow:


    - Generics

    - Annotations

    - Auto boxing and auto-unboxing

    - Enumerations

    - Enhanced, for-each style for loop

    - Variable-length arguments

    - Static import

    - Formatted I/O

    - Concurrency utilities


    In J2SE 5, and the developers kit was called `JDK 5`. 1.5 used as internal version
    number and this is referred as developer version number.


    Java became the center of innovation in computer technological world. The existence
    of `JVM` and byte code changed the scenario of security and portability in the
    programming world. The way the new ideas are put into the language has been redefined
    by the `JCP` i.e. `java` community process.


    ![page-divider.png](images/00002.jpeg)


    # Features of Java


    ### Object-oriented programming


    - This is the core feature of `java`.

    - This is to manage the increase in the complexity.

    - It provides a very sophisticated and well defined interface for the data.

    - It is also known as data controlling access.

    - Another important feature of java being object oriented is abstraction.

    - Complexity can be managed using abstraction.


    The OOP principles


    - Encapsulation - Its agenda is to manipulate the data and keep the data isolated
    and safe from external interference. The encapsulation is done by the use of protective
    wrapper. This prevents the external sources from accessing the data.


