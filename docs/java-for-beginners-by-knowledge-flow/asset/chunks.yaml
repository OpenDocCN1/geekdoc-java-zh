    \ `++`。\n- **自减**：用于减少操作数。表示为 `--`。\n\n### 位运算符\n- **取反（NOT）**：反转所有位。表示为 `~`。\n\
    - **与（AND）**：如果操作数都为 1 则为 1。表示为 `&`。\n- **或（OR）**：如果操作数之一为 1 则为 1。表示为 `|`。\n-\
    \ **异或（XOR）**：如果操作数不同则为 1。表示为 `^`。\n- **左移**：向左移动所有位。表示为 `<<`。\n- **右移**：向右移动所有位。表示为\
    \ `>>`。\n\n### 关系运算符\n- **等于**：显示值相等。表示为 `==`。\n- **不等于**：显示值不相等。表示为 `!=`。\n-\
    \ **大于**：显示一个值大于另一个值。表示为 `>`。\n- **小于**：显示一个值小于另一个值。表示为 `<`。\n- **大于等于**：显示一个值大于或等于另一个值。表示为\
    \ `>=`。\n- **小于等于**：显示一个值小于或等于另一个值。表示为 `<=`。\n\n### 布尔逻辑运算符\n- **逻辑与（AND）**：表示为\
    \ `&`。例如：`A & B`。如果 a 为假且 b 为真，结果为假，但当两者都为真时结果为真。\n- **逻辑或（OR）**：符号为 `|`。例如：`A\
    \ | B`。如果 a 为假且 b 为真，结果为真，但当两者都为真时结果为真。\n- **逻辑异或（XOR）**：使用 `^` 显示。例如：`A ^ B`。如果操作数不同真。\n\
    - **逻辑非（Unary Not）**：表示为 `!`。例如：`! A`。如果 a 为假则结果为真，但如果 a 为真则结果为假。\n\n### 赋值运算符\n\
    赋值是单个等号，表示为 `=`。\n通用表示法：\n```\nvar = expression;\n```\n\n"
