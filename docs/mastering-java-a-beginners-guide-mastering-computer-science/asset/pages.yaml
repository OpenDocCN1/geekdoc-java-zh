    +   * **NULL Values:** A NULL value in a table indicates that a field was left
    blank during record creation. It is not the same as a value of zero or a field
    containing space.

    * **Data Integrity:** Each RDBMS has the following categories of data integrity:

    * **Entity integrity:** Entity integrity requires that there are no duplicate
    rows in a table.

    * **Domain integrity:** It ensures that valid entries for a particular column
    are entered by limiting the type, format, or range of values.

    * **Referential integrity:** This indicates that rows that are utilized by other
    records cannot be removed.

    * **User-defined integrity:** It enforces some specific business rules that users
    set. These rules are distinct from those governing entity, domain, or referential
    integrity.


