  md: 'Jigsaw. The jigsaw was later renamed Java Platform Module System.


    # Benefits of Java Modules


    The Java Platform Module System provides numerous advantages to Java developers.
    We''ll mention the essential benefits below.


    # Modular Java Platform for Smaller Application Distribution


    All of the Java Platform APIs have been separated into distinct modules as part
    of Project Jigsaw. The advantage of breaking up all of the Java APIs into modules
    is that you can now define which modules of the Java platform your application
    needs. Knowing which Java Platform modules your application requires, Java can
    package your program such that it only includes the Java Platform modules that
    your application utilizes.


    Because there were no official means of accurately validating which classes your
    Java program utilized before Java 9 and the Java Platform Module System, you would
    have to bundle all of the Java Platform APIs with your Java application. Because
    the Java Platform APIs have become fairly extensive over the years, your application
    would receive many Java classes in its deployment, many of which we would probably
    not need.


    Because of the unneeded classes, our applications distribut are more significant
    than it needs to be. This can be an issue for tiny devices such as mobile phones,
    Raspberry Pis, etc. You may now package your application with only the modules
    of the Java Platform APIs that your application'
