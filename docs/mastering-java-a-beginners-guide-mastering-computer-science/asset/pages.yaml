    # ENCAPSULATION


    Encapsulation in Java combines code and data into a single unit, such as a capsule
    containing numerous medications.

    In Java, we may construct a fully enclosed class by keeping all of the class’s
    data members private. We can now use setter and getter methods to set and get
    data from it.


    A completely enclosed class is an example of a Java Bean class.


    The Benefits of Encapsulation in Java


    +   - You may make the class read-only or write-only by simply giving a setter
    or getter method. In other words, you don''t have to use the getter or setter
    procedures.

    - It gives you control over the data. If you want to set the value of id to be
    larger than 100 alone, you may do it within the setter method. You may implement
    logic to prevent negative values from being stored in the setter methods.

    - It is a method of achieving data concealing in Java since other classes will
    not access the data through private data members.

    - The encapsulate class is simple to put to the test. As a result, it is preferable
    for unit testing.

    - Typical IDEs provide the ability to produce getters and setters. As a result,
    creating an enclosed class in Java is simple and quick.'
