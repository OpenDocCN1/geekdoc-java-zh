  md: "# 144 ■ Mastering Java\n\nThe Java Virtual Machine (JVM) checks the “string\
    \ constant pool” first whenever you construct a string literal. A reference to\
    \ the pooled instance is returned if the string already exists in the pool. A\
    \ new string instance is produced and placed in the pool if the string does not\
    \ exist. Consider the following scenario:\n\n```\nString s1=\"Welcome Everyone\"\
    \nString s2=\"Welcome Everyone\"; //doesn’t\ncreate a new instance\n```\n\nOnly\
    \ one object will be generated in the case above. First, JVM will generate a new\
    \ object since it cannot locate a string object with the “Welcome Everyone” value\
    \ in the constant string pool. After that, it will search the collection for the\
    \ string “Welcome Everyone” and return a reference to the same instance rather\
    \ than creating a new one.\n\nWhy does Java utilize the String literal concept?\n\
    to improve Java’s memory efficiency (because no new objects are created if it\
    \ exists already in the constant string pool).\n\n+   2. By using a new keyword\n\
    \n```\nString s=new String(\"Welcome Everyone\"); //one reference variable\n creates\
    \ two objects\n```\n\nThe literal “Welcome” will be stored in the constant string\
    \ pool, and JVM will construct a new string object in regular (non-pool) heap\
    \ memory. The variable s will be used to refer to a heap object (non-pool)."
