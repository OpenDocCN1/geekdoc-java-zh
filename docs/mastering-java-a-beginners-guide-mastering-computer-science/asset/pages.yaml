    Java StringTokenizer

    The java.util.StringTokenizer class allows you to tokenize a String. It is a straightforward
    method for breaking a String. It is a Java legacy class.³


    It does not support differentiating between integers, quoted strings, identifiers,
    and so on, like the StreamTokenizer class, does. In Chapter 3, we will go through
    the StreamTokenizer class.


    The delimiters in the StringTokenizer class can be given at the time of creation
    or by one to the tokens.


    ![](img/0a152c890eb5a1cd0134c40d0443be35_215_0.png)


    # StringTokenizer Constructors


    The StringTokenizer class defines three constructors.


    | Constructor | Description |

    |---|---|

    | StringTokenizer(String st) | It generates a StringTokenizer from the supplied
    string. |

    | StringTokenizer(String st, String deli) | StringTokenizer is created using the
    supplied string and delimiter. |

    | StringTokenizer(String st, String deli, boolean returnVal) | StringTokenizer
    is created using the provided string, delimiter, and return Value. If the return
    value is true, delimiter characters are treated as tokens. If true, delimiter
    characters are used to separate tokens. |


    > ³ https://techvidvan.com/tutorials/java-stringtokenizer/ TechVidaan'
