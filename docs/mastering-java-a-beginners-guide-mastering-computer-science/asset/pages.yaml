    # What Exactly Is a Java Class Library?


    Because Java is not reliant on any particular operating system, Java programs
    cannot rely on platform-specific native libraries; instead, Java offers a collection
    of dynamically loaded libraries common to current operating systems. These libraries
    offer:


    +   Regular Expressions and container classes


    +   Interfaces for activities that rely on the Operating System’s (OS) hardware,
    such as network and file access.


    +   The underlying platform does not support a specific Java feature, these libraries
    will override that feature if necessary.


    Java Library classes are a collection of predefined classes in packages that are
    made available to programmers as part of the Java installation process. Library
    classes make it easier'
