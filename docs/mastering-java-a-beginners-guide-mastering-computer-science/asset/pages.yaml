  md: '# Introduction to Java ■ 9


    Independent of the Platform


    Java’s most important characteristic is that it enables platform freedom, which
    leads to portability, which is ultimately its greatest strength. Being platform-independent
    means that software written on one system may run without modification on any
    other machine in the world. Java uses the idea of the bytecode to achieve platform
    independence. Unlike the C/C++ compiler, the Java compiler never transforms source
    code to machine code.


    Instead, it turns the source code into an intermediate code known as bytecode,
    translated into machine-dependent form by another software layer known as JVM.
    As a result, regardless of whatever machine created the bytecode, JVM may execute
    it on any platform or Operating System (OS) on which it is installed. This is
    where Java’s motto “Write Once, Execute Anywhere” comes into play, implying that
    we may build programs in one environment and run them in another without changing
    the code.


    ![](img/0a152c890eb5a1cd0134c40d0443be35_35_0.png)


    Java platform independence'
