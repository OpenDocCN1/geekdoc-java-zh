    # INDEPENDENCE OF DATA


    +   - The three-schema architecture may be used to explain data independence.


    +   - Data independence refers to changing the schema at one level of a database
    system without affecting the schema at the next higher level.


    Data independence is classified into two types:


    +   1. Independence of Logical Data


    +   - Logical data independence refers to the capacity to change the conceptual
    schema without affecting the external schema.


    +   - To separate the external level from the conceptual perspective, logical
    data independence is utilized.


    +   - If we modify the conceptual perspective of the data, it will not affect
    the user''s view of the data.


    +   - At the user interface level, logical data independence arises.'
