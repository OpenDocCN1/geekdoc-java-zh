    | int indexOf(Object o) | It return the index of the first occurrence of the supplied
    element in this list, or -1 if the List does not include this element. |

    | E remove(int index) | It is used to delete the entry from the list at the specified
    location. |

    | boolean remove(Object o) | It''s used to get rid of the first instance of the
