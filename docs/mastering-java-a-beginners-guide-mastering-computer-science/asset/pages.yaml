  md: '# Why Are String Objects in Java Immutable?


    The idea of a string literal is used in Java. Assume there are five reference
    variables, all of which relate to the same object, "Sunita.\” All reference variables
    will be impacted if one reference variable alters the value of the object. As
    a result, String objects in Java are immutable.


    The properties of String that make String objects immutable are listed below.


    +   1. ClassLoader: A String is passed as an input to a Java ClassLoader. Consider
    that if the String object is changeable, the value might change, and the class
    intended to be loaded change.

    The string is immutable to avoid this type of misunderstanding.

    2. Thread Security: We don''t have to worry about synchronization when sharing
    an item across threads since the String object is immutable.

    3. Security: Immutable String objects, like class loading, avoiding additional
    problems by loading the class. As a result, the application software becomes more
    secure. Consider banking software as an example. Because String objects are immutable,
    an intruder can change the username or password. This can improve the security
    of the application program.

    4. Heap Space: String''s immutability helps to keep heap memory use to a minimum.
    The JVM checks if the value already exists in the String pool when defining a
    new String object. If it already exists, the new object is given the same value.
    This feature helps Java to make effective use of memory space.'
