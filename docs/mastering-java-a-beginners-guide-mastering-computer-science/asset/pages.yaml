    # The Set Interface’s Operations


    We can do all basic mathematical operations on the Set, such as intersection,
    union, and difference.


    Consider the following two sets:set1 = [77, 45, 33, 22, 66, 55, 34] and set2 =
    [83, 33, 2, 45, 3, 12]. On the Set, we may execute the following operation:


    +   * Intersection: The intersection operation returns all elements that appear
    in both sets. Set1 and set2 will cross at [33, 45, 55].

    * Union: The union operation returns all of the elements of sets 1 and 2 in a
    single set, which might be set1 or set2. The sum of sets1 and 2 is [2, 3, 12,
    22, 33, 45, 55, 66, 77, 83].

    * Difference: The difference operation removes from the set any values that are
    also present in another set. The difference between sets 1 and 2 is [66, 34, 22,
    77].


    In set, the union is performed using the addAll() method, the intersection is
    performed using the retainAll() method, and the difference is performed using
    the remove() method: an example to see how these techniques execute intersection,
    union, and difference operations.


