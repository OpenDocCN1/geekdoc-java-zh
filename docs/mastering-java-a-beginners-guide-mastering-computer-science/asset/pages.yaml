  md: 'uses, thanks to the Java Platform Module System. As a result, application distributable
    will be smaller.


    # Internal Package Encapsulation


    A Java module must specify which Java packages within the module are to be exported
    to other modules that use the module. A Java module may include Java packages
    that are not exported. Classes in not exported packages are inaccessible to other
    Java modules. Such packages are only usable within the Java module that includes
    them.


    Packages that are not exported are often known as hidden or encapsulated packages.


    # Start Detection of Absent Modules


    Beginning with Java 9, Java programs must also be bundled as Java modules. As
    a result, an application module defines the other modules (Java API modules or
    third-party modules) that it employs. As a result, when the JVM starts up, it
    may examine the whole module dependency chain from the application module onward.
    If any needed modules are not discovered when the JVM boots up, it reports the
    absent module and closes down.


    Before Java 9, missing classes (for example, from a missing JAR file) were not
    identified until the program attempted to utilize the missing class. This might
    occur at some point during runtime, depending on when the program attempted to
    utilize the missing class.


    Having absent modules notified at program startup time is a significant benefit
    to having the missing module/JAR/class reported at runtime when attempting to
    utilize the absent module/JAR/class.'
