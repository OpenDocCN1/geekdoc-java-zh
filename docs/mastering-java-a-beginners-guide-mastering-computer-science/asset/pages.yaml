  md: '# DML encompasses the following tasks:


    +   - **Select**: It is used to obtain information from a database.


    +   - **Insert**: This function is used to insert data into a table.


    +   - **Update**: This function is used to update existing data in a table.


    +   - **Delete**: This command is used to remove all records from a table.


    +   - **Merge**: It executes UPSERT actions, such as insert or update operations.


    +   - **Call**: It is used to invoke a structured query language or a Java subprogram.


    +   - **Explain Plan**: It has a parameter for describing data.


    +   - **Lock Table**: Lock It manages concurrency through a table.


    # 3. DCL (Data Control Language)


    +   - DCL is an abbreviation for Data Control Language. It is used to retrieve
    data that has been saved or stored.


    +   - The execution of the DCL is transactional. It also offers rollback options.


    (However, with Oracle databases, the execution of data control language does not
    provide rolling back.)'
