    # ArrayList vs. Java List


    The list is an interface, and ArrayList is its implementation class.


    # How to Make a List


    List interface is implemented by the ArrayList and Linked-List classes. Let''s
    look at a few instances of how to make a List:


    ```

    // ArrayList is used to create a String List.

    List<String> lists=new ArrayList<String>();

    ```


    ```

    // ArrayList is used to create an Integer List

    List<Integer> lists=new ArrayList<Integer>();

    ```


    ```

    // ArrayList is used to create a list of type Books

    List<Book> lists=new ArrayList<Book>();

    ```


    ```

    // LinkedList is used to create a String List.

    List<String> lists=new LinkedList<String>();

    ```'
