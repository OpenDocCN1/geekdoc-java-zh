- img_proc: true
  md: 'level of data abstraction. As a result, the following four data models are
    used to explain the structure of the database:


    +   1. Relational Data Model: This model organizes data into rows and columns
    within a table. As a result, a relational model employs tables to describe data
    and in-between connections. Tables are sometimes referred to as relations. Edgar
    F. Codd first described this concept in 1969. The relational data model is the
    most frequently used model, with commercial data processing systems mainly using
    it.


    +   2. Entity-Relationship Data Model (ER Model): An ER model is a logical representation
    of data as objects with relationships between them. These things are referred
    to as entities, and a relationship is a connection between them. Peter Chen created
    this model, which was published in 1976 publications. It was commonly utilized
    in database design. A collection of characteristics describes the entities. For
    example, the “student” object is represented by student name and student id. An
    “entity set” is a collection of the same kind of entities, while a “relationship
    set” is a collection of the same type of relationships.


    +   3. Object-Based Data Model: An expansion of the ER model that includes concepts
    like functions, encapsulation, and object identification. This model provides
    a comprehensive type system with structured and collection types. As a result,
    numerous database systems based on the object-oriented paradigm were created in
    the 1980s. Objects in this context are nothing more than data with attributes.'
