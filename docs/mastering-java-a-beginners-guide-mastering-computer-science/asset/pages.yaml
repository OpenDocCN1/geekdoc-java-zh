    In essence, functional programming is a method of designing computer programs
    in which calculations are seen as evaluating mathematical functions. So, in mathematics,
    what is a function?


    A function is a mathematical expression that connects an input set to an output
    set.¹


    Significantly, the outcome of a function is solely determined by its input. Even
    more intriguing, we can combine two or more functions to create a new function.


    +   1. The Lambda Calculus: We have to understand why these definitions and characteristics
