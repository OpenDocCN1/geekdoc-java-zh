    **Programming Paradigms Classification:** Of fact, functional programming isn’t
    the only programming style used in the real world. Programming techniques are
    broadly classified into imperative and declarative programming paradigms:


    According to the imperative method, a program is defined as a series of statements
    that alter the program’s state until it achieves the end state. Procedural programming
    is imperative programming in which programs are built using procedures or subroutines.
    Object-oriented programming (OOP), a popular programming paradigm, expands procedural
    programming ideas.


    On the other hand, the declarative method communicates a computation without defining
    its control flow in terms of a series of assertions. Simply said, the declarative
    method focuses on defining what the program must accomplish rather than how it
    should accomplish it. Functional programming languages are a subset of declarative
    programming languages. These groups are further subdivided, and the taxonomy becomes
    highly complicated.


    **Programming Language Classification:** Today, every attempt to officially classify
    programming languages is an academic endeavor in and of itself! However, for our
    purposes, we’ll try to grasp how programming languages are classified based on
    their support for functional programming.'
