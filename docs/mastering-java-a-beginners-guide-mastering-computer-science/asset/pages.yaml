  md: '# STREAMING IN JAVA 8


    In Java 8, there is a special additional package named util.stream. This package
    contains classes, interfaces, and enumerations that enable operational functions
    on the items. By importing the java.util.stream package, you may utilize stream.


    Stream Has the Following Features


    +   Elements are not stored in a stream. It simply transports components from
    a source, such as a data structure, array, or I/O channel, through a pipeline
    of computational processes.


    +   The stream serves a purpose in nature. The actions done on a stream do not
    affect its origin. Filtering a Stream received from a collection, for example,
    creates a new Stream devoid of the filtered items rather than deleting elements
    from the original collection.


    +   Stream is lazy and only evaluates code when it is needed.


    +   During a stream''s existence, the elements are only visited once. A fresh
    stream, similar to an Iterator, must be produced to revisit the same components
    of the source.


    The stream can be used to filter, gather, print, and convert from one data structure
    to another, among other things. In the following examples, we''ve used streams
    to perform a variety of activities.'
