    # Difference between StringBuilder and StringBuilder?


    To express a series of characters, Java provides three classes: String, StringBuffer,
    and StringBuilder. The string is an immutable class, StringBuffer and StringBuilder
    are changeable classes. There are several distinctions between StringBuilder and
    StringBuilder. Since JDK 1.5, there has been a StringBuilder class.


    The following are the distinctions between StringBuilder and StringBuilder:


    | No. | StringBuilder | StringBuilder |

    | 1. | StringBuilder is thread-safe since it is synchronized. It indicates that
    two threads cannot call StringBuffer methods at the same time. | StringBuilder
    is non-synchronized, which means it is not thread-safe. It indicates that two
    threads can call StringBuilder methods at the same time. |

    | 2. | StringBuffer is inefficient in comparison to StringBuilder. | StringBuilder
    outperforms StringBuffer in terms of efficiency. |

    | 3. | StringBuffer first appeared in Java 1.0. | StringBuilder first appeared
    in Java 1.5. |'
