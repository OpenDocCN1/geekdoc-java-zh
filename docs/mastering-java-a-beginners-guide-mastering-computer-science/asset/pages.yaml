    +   - Behavior: The behavior (functionality) of an object, such as deposit, withdrawal,
    and so on, is characterized by the term behavior.


    +   - Identify: A unique ID is generally used to represent an object''s identification.
    The value of the ID is hidden from the outside user. The Java Virtual Machine
    (JVM), on the other hand, uses it internally to identify each object uniquely.


    Pen, for instance, is an object. Reynolds is its name, and the color white is
    its condition. It’s accustomed to writing, that’s what it does.


    A class''s instance is an object. A class is a blueprint and template from which
    things are built. As a result, an object is a class''s instance.


    In Java, What Is a Class?

    A class is a collection of objects with similar characteristics. It’s a blueprint
    or template from which things are made. It’s a logical thing. It can’t be a physical
    problem.'
