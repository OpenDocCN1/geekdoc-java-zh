    # WHAT ARE JAVA ARRAYS?


    An array is often a collection of comparable types of items with contiguous memory
    locations.


    An array in Java is an object that includes items of the same data type. Furthermore,
    array items are kept in a continuous memory region. It is a data structure in
    which related components are stored. A Java array can only hold a fixed number
    of items.


    In Java, arrays are index-based; the first member of the array is kept at the
    0th index, the second element at the 1st index, etc.


    In Java, an array is a dynamically created class object. The Object class is inherited
    by the Java array, which implements the Serializable and Cloneable interfaces.
    In Java, we may store primitive values or objects in an array. In Java, we can
    build single-dimensional or multidimensional arrays in the same way we do in C/C++.


    Furthermore, Java has the characteristic of unnamed arrays, which C/C+ does not
    have.


    # Advantages


    +   - Code Optimization: It optimizes the code so that we can obtain or sort the
    dta more efficiently.


