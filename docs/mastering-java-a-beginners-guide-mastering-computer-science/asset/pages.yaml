    | boolean isEmpty() | If the is empty, it returns true; otherwise, it returns
    false. |

    | int lastIndexOf(Object o) | It return index of the last occurrence of the provided
    element in this list, or -1 if it is not found. |

    | Object[] toArray() | It''s used to return an array with all of the entries in
    this list in the right order. |

    | <T> T[] toArray(T[]) | It return an array with all of the elements in this list
    in the correct order. |

