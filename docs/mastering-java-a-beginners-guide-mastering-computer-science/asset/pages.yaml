    # JAVA ACCESS MODIFIERS


    In Java, there are two kinds of modifiers: access modifiers and non-access modifiers.


    Java, access modifiers define the accessibility or scope of a field, method, or
    class. Using the access modifier may modify the access level of fields, constructors,
    methods, and classes.


    Java access modifiers are classified into four types:


    +   1. **Private:** A private modifier’s access level is restricted to the class.
    It cannot be retrieved from outside the class.


    +   2. **Default:** A default modifier’s access level is limited to the package.
    It cannot be retrieved from outside the package. If no access level is specified,
    the default will be used.


    +   3. **Protected:** A protected modifier’s access level is within and outside
    the package through a child class. If the child class is not created, it cannot
    be accessed from outside the package.'
