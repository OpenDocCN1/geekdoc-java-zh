  md: '# Blank Lines


    A blank line is a line that has simply white space, maybe with a remark, and Java
    ignores it completely.


    # Inheritance


    In Java, classes can be derived from other classes. Essentially, if you need to
    construct a new class and an existing class part of the code you need, you may
    derive your new class from the current code.


    This idea allows you to reuse existing class fields and functions without recreating
    the code in a new class. In this case, the current class is referred to as the
    superclass, and the derived class is referred to as the subclass.


    # Interfaces


    In the Java programming language, an interface is a contract between objects that
    specifies how they communicate. When it comes to inheritance, interfaces are pretty
    important. An interface specifies which methods should be used by a derived class
    (subclass). However, it is entirely up to the subclass to implement the methods.


