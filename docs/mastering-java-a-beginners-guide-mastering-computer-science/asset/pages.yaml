  md: '# 242 Mastering Java


    Duplicate keys are not permitted in a Map, although duplicate values are allowed.
    TreeMap does not support null keys or values, HashMap and LinkedHashMap do. Because
    a Map cannot be browsed, you must convert it to a Set using the keySet() or entrySet()
    methods.


    | Class | Description |

    | --- | --- |

    | HashMap | HashMap is a Map implementation; however, it does not keep track of
    the order. |

    | LinkedHashMap | LinkedHashMap is the implementation of Map. It inherits the
    HashMap class. It maintains insertion order. |

    | TreeMap | TreeMap is a Map and SortedMap implementation. It keeps ascending
    order. |


