    \ and decoding, it employs the Base64 alphabet as defined in RFC 2045. The encoded\
    \ output must be expressed in lines of no more than 76 characters. The line separator\
    \ is a carriage return “\r” followed immediately by a linefeed “\n”. There is\
    \ no line separator after the encoded output. All line separators and other characters\
    \ not included in the base64 alphabet table are disregarded throughout the decoding\
    \ process.\n\n# Base64 Nested Classes\n\n| Class | Detail |\n| Base64.Decoder\
    \ | Class implements decoder for decoding byte data using the RFC 4648 and RFC\
