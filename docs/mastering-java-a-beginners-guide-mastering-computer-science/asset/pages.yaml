    Java is one of the most widely used programming languages today. It all began
    in 1990 when an American firm at the forefront of the computer revolution decided
    to assemble its top engineers to design and create a product that would become
    a significant participant in the new Internet world. This book will look at Java
    concepts, including their usage and critical features, and basic syntax.'
