  md: '# 2 ■ Mastering Java


    # WHAT IS JAVA?


    Java is an object-oriented programming (OOP) language and software platform utilized
    on billions of devices, including laptop computers, mobile devices, game consoles,
    medical equipment, and more. Java''s principles and grammar are based on the C
    and C++ programming languages.


    The mobility of Java-based applications is a significant benefit. It''s pretty
    simple to migrate code from a notebook computer to a mobile device after developing
    it in Java. The primary objective of the language, when it was created in 1991
    by Sun Microsystems’ James Gosling (later purchased by Oracle), was to “write
    once, run anywhere.” It’s also crucial to note that Java is not the same as JavaScript.
    The compilation is not required for JavaScript; however, it is needed for Java
    code.


    Furthermore, JavaScript can only be used in web browsers, but Java may be used
    anywhere. New and improved software development tools replace existing technologies,
    previously believed to be necessary at a breakneck rate. Most back-end development
    projects, especially those requiring extensive data and Android development, employ
    Java as the server-side language. Java is also extensively used in gaming, numerical
    calculation, and desktop and mobile computers.


    # How Does Java Work?


    Before we get into the reasons for Java’s continued popularity, let’s take a closer
    look at what Java is and why it’s essential for corporate application development.


    Java is a programming language, and a software platform all rolled into one. The
    Java Development Kit (JDK),'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Introduction to Java ■ 3


    available for Windows, macOS, and Linux, is required to develop a Java application.
    After writing the program in Java, a compiler converts it to Java bytecode, which
    is the instruction set for the Java Virtual Machine (JVM), part of the Java runtime
    environment (JRE).


    Java bytecode runs unmodified on any system that supports JVMs, allowing us to
    run Java code on any platform. The JVM, the Java API, and a complete development
    environment make up the Java software platform. The JVM parses and executes (interprets)
    Java bytecode. The Java API includes many libraries, including fundamental objects,
    networking, security capabilities, Extensible Markup Language (XML) creation,
    and web services. The Java programming language and the Java software platform,
    when combined, provide a solid and well-proven solution for corporate software
    development.


    # Why Is Java Important?


    Suppose we work as an enterprise application developer. In that case, we''re probably
    already familiar with Java, and the company probably has hundreds, if not millions,
    of lines of production code written in the language. We''ll almost certainly require
    some Java knowledge to debug, maintain, and upgrade the existing codebase.


