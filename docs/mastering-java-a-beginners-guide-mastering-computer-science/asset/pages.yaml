    # Java Naming Conventions


    A naming convention in Java is a set of rules to follow when naming identifiers
    such as classes, packages, variables, constants, methods, etc.


    It is not, however, obligatory to follow. As a result, it is referred to as a
    convention rather than a regulation. Several Java groups, including Sun Microsystems
    and Netscape, have recommended these norms.


    According to the Java naming convention, the Java programming language''s classes,
    interfaces, packages, methods, and fields are all named. If you don''t follow
    these rules, you could end up with some ambiguous or incorrect code.


    # Benefits of Java Naming Conventions


    Using standard Java naming conventions makes your code easier to read for both
    you and other programmers. The readability of a Java program is crucial. It means
    that less effort is spent deciphering what the code accomplishes.


    The following are the fundamental rules that any identifier must follow:


    +   * There must be no white spaces in the name.


    +   * Special characters such as & (ampersand), $(dollar), and _ (underscore)
    should not be used in the name.'
