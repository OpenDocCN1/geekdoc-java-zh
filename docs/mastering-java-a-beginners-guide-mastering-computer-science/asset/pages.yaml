    # DRIVERMANAGER CLASS


    The DriverManager class serves as a bridge between the user and the drivers. It
    maintains track of the available drivers and facilitates the establishment of
    a link between a database and the right driver. The DriverManager class keeps
    track of all Driver classes that have registered themselves by invoking the DriverManager.registerDriver
    function (().


    # DriverManager Class Methods That Are Useful


    | Method | Description |

    | --- | --- |

    | public static void registerDriver(Driver driver): | It is used to add the specified
    driver to DriverManager. |

    | public static void deregisterDriver(Driver driver): | It is used to deregister
    the specified driver DriverManager (to remove the driver from the list). |

    | public static Connection getConnection(String url): | It is used to make a connection
    to the provided url. |

    | public static Connection getConnection(String url,String userName,String password):
    | It is used to connect with the provided url, username, and password. |


    # Interface of Connection


    A Connection is a session that exists between a Java program and a database. The
    Connection interface is a factory for Statement, PreparedStatement, and DatabaseMetaData,
    which means that the Connection object may be used to get the Statement and DatabaseMetaData
    objects. The Connection interface provides several transaction management methods
    such as commit(), rollback(), etc.'
