  md: '# Module System


    The Java Module System is a significant change in the Java 9 version. Java introduced
    this functionality to group Java packages and code into a single unit known as
    a module.


    There was no notion of modules in previous versions of Java; therefore, it was
    challenging to construct modular Java programs, which increased the size of the
    application and made it harder to move about. Even the JDK was too large; in Java
    8, the rt.jar file size is about 64MB.


    Java 9 reorganized JDK into a series of modules to deal with the problem, allowing
    us to utilize just the components we needed for our project.


    Aside from the JDK, Java also allows us to construct our modules, developing module-based
    applications.


    The module system comes with a variety of tools and choices, which are listed
    below:


    +   - Includes several options for the Java tools javac, jlink, and java where
    we may define module paths to point to the module''s location.


    +   - The modular JAR class file is introduced. The module-info.class file is
    located in the root folder of this JAR.


    +   - The JMOD format, which is a packaging format similar to JAR but may incorporate
    native code and configuration files, is introduced.


    +   - Both the JDK and Java Runtime Environment (JRE) have been rebuilt to allow
    modules. It boosts performance, security, and maintenance.'
