  md: 'Here are some examples of DCL tasks:


    +   * Grant: It is used to grant a user access to a database.


    +   * Revoke: This command is used to revoke a user’s permissions.


    Revoke permission is granted for the following operations:


    +   * CONNECT, INSERT, USAGE, EXECUTE, DELETE, UPDATE, and SELECT are all commands.


    +   4. Transaction Control Language: TCL is used to execute the DML statement''s
    modifications. TCL can be combined to form a logical transaction.


    TCL encompasses the following tasks:


    +   * Commit: This command is used to save the transaction to the database.


    +   * Rollback: It is used to restore the database to its original state after
    the most recent Commit.


