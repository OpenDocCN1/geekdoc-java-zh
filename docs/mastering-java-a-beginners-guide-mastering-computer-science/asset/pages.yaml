  md: 'Java Database Connectivity ■ 337


    # ARCHITECTURE OF DBMS


    A DBMS''s architecture has an impact on its design. The primary client/server
    design is used to cope with a large number of network-connected PCs, web servers,
    database servers, and other components.


    The client/server architecture is made up of numerous PCs and a workstation that
    are linked together via a network. DBMS design is determined by how users connect
    to the database to complete their requests.


    # DBMS Architecture Types


    Database architecture can be single-tiered or multi-tiered. However, conceptually,
    database architecture is divided into two types: 2-tier architecture and 3-tier
    architecture.


    # 1st-Tier Architecture


    The database is immediately accessible to the user in this architecture. It means
    that the user may sit right on the DBMS and utilize it.


    Any modifications made here will have an immediate impact on the database. It
    does not offer consumers with a helpful tool.


    The 1-tier design is utilized for local application development, where programmers
    may directly connect with the database for rapid response.


    # 2-Tier Architecture


    The 2-tier architecture is the same as the basic client-server design. In a two-tier
    design, client-side apps connect directly with the database on the server-side.
    APIs like ODBC and JDBC are utilized for this interaction.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# 3-Tier Architecture


    On the client-side, user interfaces and application programs are executed.


    The server side is in charge of providing functions such as query processing and
    transaction management.


    To communicate with the DBMS, the client-side application connects to the server-side.


    Another layer exists between the client and the server in the 3-Tier architecture.
    The client cannot connect directly with the server under this design.


    The client-side application talks with an application server, which then communicates
    with the database system.


    Beyond the application server, the end-user is unaware of the presence of the
    database. Aside from the program, the database does not know about any other users.


    In the event of an extensive online application, the 3-Tier design is employed.


    # The Architecture Consists of Three Schema


    Three schema architecture is sometimes referred to as ANSI/SPARC architecture
    or three-level architecture.


    This framework describes the structure of a particular database system.


    The three schema architecture is often used to differentiate user applications
    and actual databases.


    There are three levels in the three schema architecture. It categorizes the database
    into three distinct sections.


    +   1. Internal Level: The internal level has an internal schema that specifies
    the database''s actual storage structure. The internal schema is sometimes referred'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'as as the physical schema. It takes advantage of the physical data model. It
    is used to specify how data will be stored in a block. The physical level is used
    to explain complete complicated low-level data structures.


    +   Conceptual Level: At the conceptual level, the conceptual schema explains
    the architecture of a database. The conceptual level is sometimes referred to
    as the logical level. The conceptual schema defines the overall organization of
    the database. The conceptual level specifies what data will be kept in the database
    and the relationships that exist between those data. Internal specifics, such
    as the implementation of the data structure, are buried at the conceptual level.
    At this level, programmers and database administrators work.


    +   External Level: A database has many schemas at the external level, which are
    frequently referred to as subschema. The subschema is used to specify the many
    database views. An external schema is sometimes referred to as a view schema.
    Each view schema defines the database component in which a specific user group
    is interested while hiding the remainder of the database from that user group.
    The view schema specifies how the database system interacts with the end-user.


    # MODELS OF DATA


    The modeling of the data semantics, data description, and consistency requirements
    is known as a data model. It gives conceptual tools for specifying a database’s
    design at each'
  merge: -1
