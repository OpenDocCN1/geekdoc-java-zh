    Classpath

    When we build and run Java files, Java looks for them in the current directory
    by default.


    As an example:


    ```

    javac MyProgram.java

    ```


    When we run this command, the Java compiler searches the current directory for
    classes. So, if MyProgram.java refers to another class called MyDependency, it
    explores the current directory for MyDependency.class or MyDependency.java. This
    is how you can build several classes using the main file.


    However, our library files are contained within the jar file rather than in the
    current directory! If we wish to use the library classes, we must tell Java where
    to find them.


    To put it another way, we must specify the classpath, which is a list of places
    where Java will look for class files. We do this by supplying a list of paths
    as the -cp option to a Java command.


    As an example:


    ```

    javac -cp ;path/to/first/jarFile.jar

    jar;path/to/second/jarFile.jar

    MyProgram.java

    ```'
