  md: '# 336 ■ Mastering Java


    After examining the distinctions between DBMS and RDBMS, you can conclude that
    RDBMS is a subset of DBMS. There are numerous software solutions on the market
    today that are DBMS and RDBMS compatible. That is, an RDBMS application is now
    a DBMS application and vice versa.


    # File System vs. DBMS


    The following distinctions exist between DBMS and file systems:


    | DBMS | File System |

    | --- | --- |

    | A DBMS is a collection of data. The user is not necessary to write procedures
    in DBMS. | The file system is a collection of data, and the user must create the
    methods for maintaining the database in this system. |

    | Database management system offers an abstract representation of data that hides
    the details. | The file system specifies the details of data representation and
    storage. |

    | DBMS offers a crash recovery mechanism, which protects the user in the event
    of a system failure. | The file system lacks a crash mechanism, which means that
    if the machine fails while inputting data, the file''s information is lost. |

    | A protection method is provided by DBMS. DBMS contains a wide variety of sophisticated
    techniques to store and retrieve the data. | It is extremely difficult to secure
    a file in the file system. The file system is incapable of storing and retrieving
    data effectively. |

    | Concurrent data access is handled by DBMS employing some type of locking. |
    Concurrent access poses numerous difficulties in the file system, such as forwarding
    the file while another person deletes or updates data.'
