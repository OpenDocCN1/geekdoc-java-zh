    +   The ability to modify the internal schema without changing the conceptual
    schema is referred to as physical data independence.


    +   If we alter the storage amount of the database server, the conceptual structure
    of the database will remain unchanged.


    +   To distinguish conceptual levels from internal levels, physical data independence
    is employed.


