  md: '# STREAM PIPELINE IN JAVA


    A stream pipeline comprises three parts: a source, intermediate operations, and
    terminal operation. Because intermediate operations yield a new modified stream,
    several intermediate operations can be chained together. Terminal operations,
    on the other hand, return a value or void. It is no longer feasible to operate
    with the stream after a terminal procedure. When a terminal action is short-circuited,
    the stream may end before all values have been processed. If the stream is limitless,
    it is beneficial.


    Intermediate processes are time-consuming. They will not be called until the terminal
    operation has been completed. This improves performance while dealing with more
    significant data streams.


