  md: '# 344 ■ Mastering Java


    1. DDL (Data Definition Language): DDL is an abbreviation for Data Definition
    Language. It is used to define the structure or pattern of a database.


    It is used in the database to build schema, tables, indexes, constraints, etc.


    The backbone of the database may be created using DDL statements.


    The data definition language is used to record metadata like the number of tables
    and schemas, names, indexes, columns in each table, constraints, and so on.


    DDL encompasses the following tasks:


    +   * Create: It is used to create database objects.


    +   * Alter: It is used to change the database''s structure.


    +   * Drop: This method is used to remove objects from the database.


    +   * Truncate: This function is used to delete all records from a table.


    +   * Rename: This command is used to rename an item.


    +   * Comments: It is used to make comments on the data dictionary.


    2. DML (Data Manipulation Language): DML is an abbreviation for Data Manipulation
    Language. It is used to retrieve and manipulate data stored in a database. It
    responds to user queries.'
