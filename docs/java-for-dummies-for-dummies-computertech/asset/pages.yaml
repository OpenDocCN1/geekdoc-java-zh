  md: 'I put on my robe and rush out to my driveway. As I pick up the morning paper,
    I glance at the front page and see this 2-inch headline:


    Burd Calls Java "A Great Object-Oriented Language"


    # Object-oriented languages


    Java is object-oriented. What does that mean? Unlike languages, such as FORTRAN,
    that focus on giving the computer imperative “Do this/Do that” commands, object-oriented
    languages focus on data. For course, object-oriented programs still tell the computer
    what to do. They start, however, organizing the data, and commands come later.


    Object-oriented languages are better than “Do this/Do that” languages because
    they organize data in a way that helps people do all kinds of things with it.
    modify the data, you can build on what you already have rather than scrap everything''ve
    done and start over each time you need to do something new. Although computer
    programmers are generally smart people, they took a while to figure this out.
    For the full history lesson, see the nearby sidebar. “The winding road from FORTRAN
    to Java” (but I won''t make you feel guilty if you don''t read it.


    # THE WINNING ROAD FROM

    FORTRAN TO JAVA


    In the mid-1950s


    In the years that followed, teams developed many new computer languages, and many
    of the languages copied the FORTRAN “Do this/Do that” model. One of the popular
    “Do this/Do that” languages went by the 1-letter name C. Of course, the “Do this”
    camp had some renegades. In languages named SIMULA and Smalltalk, programmers
    moved the imperative “Do this” commands into the background and centered on descriptions
    of data. In these languages, you didn''t right out and say, “Print a list of delinquent
    accounts.” Instead began saying, “This is what it means to be an account. An account
    has a name and a balance.” Then said, “This is how you show an account whether
