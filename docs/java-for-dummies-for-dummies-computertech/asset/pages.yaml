  md: "```\nif (buttonJustGotClicked()) {\n  object1.actionPerformed(infoAboutTheClick);\n\
    \  object2.actionPerformed(infoAboutTheClick);\n  object3.actionPerformed(infoAboutTheClick);\n\
    }\n```\n\nOf course, behind every answer is yet another question. In this situation,\
    \ the follow-up question is, \"Where does the event-handling thread find actionPerformed\
    \ methods to call?\" And there's another question: \"What if you don't want the\
    \ event-handling thread to call certain actionPerformed methods that are lurking\
    \ in your code?”\n\nWell, that's why you call the addActionListener method. In\
    \ Listing 16-1, the call\n\n```\nbutton.addActionListener(this);\n```\n\ntells\
    \ the event-handling thread, \"Put this code's actionPerformed method on your\
    \ list of methods to be called. Call this code's actionPerformed method when the\
    \ button is clicked.\"\n\nThat's how it works. To have the computer call an actionPerformed\
    \ method, you register the method with Java's event-handling thread. You do this\
    \ registration by calling addActionListener. The addActionListener method belongs\
    \ to the object whose clicks (and other events) you're waiting for. In Listing\
    \ 16-1, you're waiting for the button object to be clicked, and the addActionListener\
    \ method belongs to that button object.\n\n# # Don't miss this\n\nIn Chapters\
    \ 9 and 10, the keyword this gives you access to instance variables from the code\
    \ inside a method. What does this keyword really mean? Well, compare it with the\
    \ English phrase state your name:\n\n> I, (state your name), do solemnly swear\
    \ to uphold the constitution of the Philadelphia Central High School Photography\
    \ Society....\n\nThe phrase state your name is a placeholder. It's a space in\
    \ which each person puts their own name:\n\n+   - I, Bob, do solemnly swear...\n\
    - I, Fred, do solemnly swear..."
