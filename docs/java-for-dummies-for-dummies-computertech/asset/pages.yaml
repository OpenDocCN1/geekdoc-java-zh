- pgno: 482
  md: '+   IN THIS CHAPTER

    >> What to learn

    >> How to learn more

    >> What to do when you''re looking for a job

    >> Other free advice


    # Chapter 19


    # Ten Bits of Advice for New Software Developers


    enjoy hearing from the people who read my books. "Nice job!" one reader says.
    Another reader asks, "Can I run your book''s examples on older versions of Java?"
    another posts this comment: "You''re Barry Burd. Does that mean you''re related
    to Larry Bird?"


    In all the questions I receive from readers, one popular theme is "What to do
    next?" More specifically, people ask me what to learn, what else to read, how
    to get practice writing software, how to find work, and other questions of that
    kind. I''m flattered to be asked, but I''m reluctant to think of myself as an
    authority on such matters. No two people give you the same answers to these questions,
    and if you ask enough people, you''re sure to find disagreement.


    This chapter contains ten pieces of advice based on questions I''ve received from
    readers. But remember that, in addition to these ten hints for living and learning,
    I have one additional, overriding piece of advice:


    Think critically about the advice you receive. When in doubt, trust your intuition.'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'Collect opinions. Talk to people about the issues. Try things and, if they
    work (or even if they don''t work but show some promise), keep doing them. If
    they show no promise, try other things. Sharing is important, too. Don''t forget
    to share.


    # How Long Does It Take to Learn Java?


    The answer depends on you — on your goals, on your existing knowledge, on your
    capacity to think logically, on the amount of spare time you have, and on your
    interest in the subject.


    The more excited you are about computer programming, the quicker you learn. The
    more ambitious your goals, the longer it takes to achieve them.


    > There''s no such thing as “knowing all about Java.” No matter how much you know,
    you always have more to learn. I''ve written several Java books, and as far as
    I''m concerned, I''ve barely scratched the surface.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_483_0.png)


    # Which of Your Books Should I Read?


    Funny you should ask! I''ve written several books, including these three (all
    from Wiley):


    +   - Beginning Programming with Java For Dummies

    - Java For Dummies

    - Java Programming for Android Developers For Dummies


    Each book starts from scratch, so you don''t need to know anything about app development
    to read any of these books. But each book covers (roughly) twice as much material
    as the previous book in the list. For example, Java For Dummies goes twice as
    fast and covers twice as much material as Beginning Programming with Java For
    Dummies. Which book you read depends on your level of comfort with technical subjects.
    If you''re about where to start, find some sample pages from any of these books
    to help you determine which book is best for you.'
  merge: -1
  img_proc: true
- pgno: 484
  md: '# # Are Books Other than Yours Good for Learning Java and Android Development?


    Yes. I''d love to recommend some, but I''m not conscientious enough to carefully
    read and review other peoples’ books.


    # ## Which Computer Programming Language(s) Should I Learn?


    The answer depends on your goals. If you plan to write code for a living, where
    you live. The TIOBE Programming Community Index depends on the job opportunities
    where you live (www.tiobe.com/index.php/content/paperinfo/tpci) provides monthly
    ratings for popular programming languages. But the TIOBE Index might not apply
    specifically to your situation. In June 2021, the Haskell language ranked 47th
    among the languages used around the world. But maybe there''s a hotbed of Haskell
    programming in the town where you live.


    Do you want to write applications for large enterprises? Then Java is a must-have
    language. Do you want to write code for the iPhone? You probably want to learn
    Swift. Do you want to create web pages? Learn HTML, CSS, and JavaScript.


    # ## Which Skills Other than Computer Coding Should I Learn?


    Sorry to disappoint you, but you’re asking someone who has an axe to grind. I''m
    a college professor. I believe that no learning, no matter how impractical it
    might seem to be, is ever wasted.


    If you insist on a more definitive answer, learn a little about databases. Database
    work isn''t necessarily coding, but it''s important stuff. Also, read as much
    as you can about software engineering — the study of techniques for the effective
    design and maintenance of computer code. Don''t be afraid of math, either (either
    you can, hone your communication skills stretches your logical-thinking muscles).
    And, whenever you communicate, the more valuable your work is to other people.'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# # How Should I Continue My Learning

    as a Software Developer?


    Practice, practice, practice. Take the examples you find in my book (or anywhere

    else) and think of ways to change the code. Add an option here or a button there.


    Find out what happens when you try to improve the code. If it works, think of\another
    way to make a change. If it doesn''t work, search the documentation for a

    solution to your problem. If the documentation doesn''t help (and often, docu-

    mentation doesn''t help), search the web for answers to your problem. Post ques-

    t an online forum. If you don''t find an answer, aside the problem for a

    while and let it incubate in your mind.


    You don''t learn programming by only reading about it — you have to scrape some

    uckles while writing code and seeking solutions. Only after trying, failing, and

    trying again can you appreciate the work involved in developing computer

    software.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_485_0.png)


    # # How Else Should I Continue My Learning

    as as a Developer?


    How did you know that I have a second suggestion? I recommend finding like-

    minded people where you live and getting together with them regularly. These

    days, you can find tech user groups in almost every corner of the globe. A Java

    user group that meets in your area and attend the group''s meetings frequently.
    If

    you''re a novice, you might not understand much of the discussion, but you''ll
    be

    posed to the issues that concern today''s Java developers.


    Look for more tech groups and attend their meetings. Find meetings about other

    programming languages, other technologies, and other topics that aren''t solely

    about technology. Meet people face-to-face and find out which topics will be in

    ext year''s books.


    To complement those face-to-face meetings, search the web for screen-to-screen

    meetings. You can find free online technical sessions almost any day of the year.'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# How Can I Land Job Developing Software?


    Do all the things you''d normally do when you look for a job, but don''t forget
    my answer to the previous question. User groups are fantastic places for networking.


    Go to meetings and be a good listener. Don''t think about selling yourself. Be
    patient and enjoy the ride. I landed a great consulting opportunity only after
    several years of attending one group''s meetings. In the meantime, I learned a
    lot about software (and quite a bit about dealing with other people).


    # I Still Don''t Know What to Do with My Life


    That''s not a question. But it''s okay anyway.


    Everyone has to ends meet. If you manage to put food on your table, the next step
    is to find out what you love to do. I''ve spent a lifetime teaching college students,
    writing books, and developing computer code — and I love doing all of it. (Well,
    I love most of it. I detest grading papers, and I dislike proofreading my own
    work.)


    Fortunately, I can make money teaching, writing, and developing. I could make
    more money working 9-to-5 for a big company, managing a software team, or creating
    the next big start-up, but I don''t like those things. My life has been enriched
    because I do what I like doing, whether I''m working or not.


    My advice is, find the best match of the things you like to do, and the things
    that help you earn a living. Compromise, if you must, but be honest with yourself
    about the things that make you happy. (Of course, these things shouldn''t make
    other people happy.)


    Finally, be specific about your likes and dislikes. For example, saying, "I''d
    like to be rich" isn''t specific at all. Saying, "I''d like to create a great
    game" is more specific, but you can do better. Saying, "I like to design game
    software, but I need a partner who can do the marketing for me" is quite specific,
    and makes a tidy set of goals.'
