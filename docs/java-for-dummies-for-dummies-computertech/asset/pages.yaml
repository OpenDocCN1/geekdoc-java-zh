    # Making Static (Finding the Team Average)


    Thinking about the code in Listings 10-1 through 10-3, you decide that you want
    to find the team''s overall batting average. Not a bad idea! The Hankees in Figure
    10-1 have an average of about .06, so the team needs some intensive training.
    While the players are out practicing on the ball field, you have a philosophical
    hurdle to overcome.


    In Listings 10-1 through 10-3, you have three classes: a Player class and two
    others that help display data from the Player class. So, in this class morass,
    where should the variables storing your overall, team-average tally?


    > > It makes no sense to put tallies in either of the displaying classes (TeamFrame
    or ShowTeamFrame). After all, the tally has something-or-other to with players,
    teams, and baseball. The displaying classes are creating windows, not about playing
    baseball.


    > > You''re uncomfortable putting an overall team average in an instance of the
    Player class because an instance of the Player class represents just one player
    on the team. What business does a single player storing overall team data? Sure,
    you could make the code work, but it wouldn''t be an elegant solution to the problem.


    Lucky for you, Java has its static keyword. Anything that''s declared to be static
    belongs to the whole class, not to any particular instance of the class. When
    you create the static field, totalOfAverages, you create just one copy of the
    field. This copy stays with the entire Player class. No matter how many instances
    of the Player class you create — one, nine or none — you have just one totalOfAverages.
    And, while you''re at it, you create other static fields (playerCountFormat) and
    static methods (findTeamAverageString). To see what I mean, look at Figure 10-5.


    Going along with your passion for subclasses, you put code for teamwide in a subclass
    of the Player class. The Player subclass code is shown in Listing 10-4.'
