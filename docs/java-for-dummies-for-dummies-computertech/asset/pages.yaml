    Occasionally, copying and pasting code can get you into trouble. Maybe you''re
    writing a program that doesn''t fit the simple Listing 8-2 pattern. You need to
    tweak the pattern a bit. But to tweak the pattern, you need to understand some
    of the ideas behind the pattern.


    That''s how the next section comes to your rescue. It covers some of these ideas.


    This paragraph is actually a confession. In almost every computer language, input
    from a disk file is a nasty business. There''s no such thing as a simple INPUT.
    You normally have to set up a connection between the code and the disk device,
    prepare for possible trouble reading from the device, do your reading, convert
    the characters you read into the type of value that you want and, finally, break
    your connection with the disk device. It''s a big mess. That''s why, in this book,
    I rely on Java''s Scanner class. The Scanner makes inputs relatively painless.
    But, I admit, professional Java programmers hardly use the Scanner. Instead, they
    use something called a BufferedReader or classes in the java.nio package. If you''re
    not content with my use of the Scan-ner class and you want to see Listing 8-2
    translated into a BufferedReader program, visit this book''s website (http://javafordummies.allmycode.com/).


