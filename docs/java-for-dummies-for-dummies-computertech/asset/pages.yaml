- pgno: 302
  md: 'Here''s what this means in plain English: Any changes that the method makes
    the value of its parameter don''t affect the values of variables back in the calling
    code. In Listing 10-10, the birth method can apply the ++ operator to cityPop
    all it wants -- the application of ++ to the cityPop parameter has absolutely
    no effect on the value of the smackoverARpop variable back in the main method.


    Technically, what''s happening is the copying of a value. (See Figure 10-11.)
    When the main method calls the birth method, the value stored in smackoverARpop
    is copied to another memory location — a location reserved for the cityPop parameter''s
    value. During the birth method''s execution, 1 is added to the city-Pop parameter.
    But the place where the original 2232 value was stored — the memory location for
    the smackoverARpop variable — remains unaffected.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_302_0.png)


    FIGURE 10-11: Pass by value, under the hood.


    When you do parameter passing with any of the eight primitive types, the computer
    uses pass by value. The value stored in the calling code''s variable remains unchanged.
    This happens even if the calling code''s variable and the called method''s parameter
    happen to have exactly the same name.


    REMEMBER'
