    While you''re running JShell, you don''t have to retype commands that you''ve
    already typed. You don''t even have to copy and paste commands. If you press the
    up-arrow key once, JShell shows you the command that you typed most recently.
    If you press the up-arrow key twice, JShell shows you the next-to-last command
    that you typed. And so on. When JShell shows you a command, you can press the
    left- and right-arrow keys to move to any character in the middle of the command.
