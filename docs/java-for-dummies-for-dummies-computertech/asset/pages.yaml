    # Try, Try Again!


    Once upon a time, I was a young fellow living with my parents in Philadelphia
    and just starting to drive a car. I was heading toward a friend''s house and thinking
    about who-knows-what when another car came from nowhere and bashed my car''s passenger
    door. This kind of thing is called a RunARedLightException.


    Anyway, both cars were still drivable, and we squat in the middle of a busy intersection.
    To avoid a traffic jam, we both pulled over the nearest curb. I fumbled for my
    driver''s license (which had a very young photo of me on it) and opened the door
    to get out of my car.


    And that''s when the second accident happened. As I was getting out of my car,
    a city bus was coming by. The bus hit me and rolled against my car a few times.
    This kind of thing is called a DealWithLawyersException.


    The truth is everything came just fine. I was bruised but not battered. My parents
    paid for the damage to the car, so I never suffered any financial consequences.
    (I managed to pass on the financial burden by putting the RunARedLightException
    into my throws clause.)


    This incident helps to explain why I think the way I do exception handling. In
    particular, I wonder, “What happens if, while the computer is recovering from
    one exception, a second exception is thrown?” After all, the statements inside
    a catch clause aren''t immune to calamities.


    Well, the answer to this question is anything but simple. For starters, you can
    put a try statement inside a catch clause. This protects you against unexpected,
    potentially embarrassing incidents that can crop up during the execution of the
    catch clause. But when you start cascading exceptions, you open up a slimy can
    of worms. The number of scenarios is large, and things can become complicated
    quickly. The program in Listing 13-10 helps you sort things out.


    +   LISTING 13-10: Using Two Files


    ```

    package com.example.payroll;


    import java.io.File;

    import java.io.FileNotFoundException;

    ```'
