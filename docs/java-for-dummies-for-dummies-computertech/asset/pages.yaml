    calls one of the constructors from Listing 9-2. So, by the time the code in Listing
    9-3 finishes running, it creates four instances of the Temperature class. Each
    instance is created by calling a different constructor from Listing 9-2.


    In Listing 9-3, the last of the four constructor calls has two parameters: 2.73
    and TempScale.KELVIN. This isn''t particular to constructor calls. A method call
    or a constructor call can have a bunch of parameters. You separate one parameter
    from another with a comma. Another name for “a bunch of parameters” is a parameter
    list.


    The only rule you must follow is to match the parameters in the call with the
    parameters in the declaration. For example, in Listing 9-3, the fourth and last
    constructor call


    ```

    new Temperature(2.73, TempScale.KELVIN)

    ```


    has two parameters: the first of type double and the second of type TempScale.
    Java approves of this constructor call because Listing 9-2 contains a matching
    declaration. That is, the header


    ```

    public Temperature(double number, TempScale scale)

    ```


    has two parameters: the first of type double and the second of type TempScale.
    If a Temperature constructor call in Listing 9-3 has no matching declaration in
    Listing 9-2, Listing 9-3 would crash and burn. (To state more politely, Java would
    display errors when you tried to compile the code in Listing 9-3.)


    By the way, this business about multiple parameters isn''t new. Over in Chapter
    6, I write keyboard.findWithinHorizon(".",0).charAt(0). In line, the method findWithinHorizon(".",0)
    has two parameters: a string and an int value. Luckily me, the Java API has a
    method declaration for findWithinHorizon—a declaration whose first parameter is
