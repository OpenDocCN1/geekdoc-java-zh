    # Combining declarations and\initializing variables


    Look back at Listing 4-3. In that listing, you see three variable declarations
    — one for each of the program''s three int variables. I could have done the same
    with just one declaration:


    ```

    int weightOfAPerson, elevatorWeightLimit, numberOfPeople;

    ```


    If two variables have completely different types, you can''t create both variables
    in the same declaration. For instance, to create an int variable named weightOffred
    and a double variable named amountInFredAccount, you need two separate variables:


    You can give variables their starting values in a declaration. In Listing 4-3,
    for instance, one declaration can replace several lines in the main method (all
    the calls to print and println):


    ```

    int weightOfAPerson = 150, elevatorWeightLimit = 1400,

    numberPeople = elevatorWeightLimit/weightOfAPerson;

    ```


    # FOUR WAYS TO STORE WHOLE NUMBERS


    Java has four types of whole numbers. The types are byte, short, int, and long.
    Unlike the complicated story about the accuracy of types float and double, the
    only thing that matters when you choose among the whole number types is the size
    of the number you''re trying to store. If you want to use numbers larger than
    127, don''t use byte. To store numbers larger than 32767, don''t use short.


    Most of the time, you''ll use int. But if you need to store numbers larger than
    2147483647, forsake int in favor of long. (A long number can be as big as 9223372036854775807.)
    For the whole story, see Table 4-1, a little earlier in this chapter.


