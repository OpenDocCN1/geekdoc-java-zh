  md: '# DRAW ON THE SCREEN (CRAYONS NOT REQUIRED)


    Listings 14-2 and 14-3 have all the gadgetry you need for putting a drawing on
    a Java frame. The code uses several names from the Java API (application programming
    interface). I explain most of these names in Chapters 9 and 10.


    The new name in Listings 14-2 and 14-3 is the word paint. The paint method in
    Listing 14-3 defers to another paint method — the paint method belonging to a
    Drawing object. (Refer to Listing 14-2). The ArtFrame object creates a floating
    window on your computer screen. What''s drawn in that floating window depends
    on whatever Drawing object was passed to the ArtFrame constructor.


    The paint method in Listing 14-2 uses a standard trick for making things appear
    onscreen. The graphics object in Listing 14-2 is called a graphics context. In
    particular, g stores information about the setting in which Java draws pixels.
    What''s the ink color? How do you draw an oval? The graphics context remembers
    all stuff.


    To make things appear, all you do is draw with this graphics context, and whatever
    draw is eventually rendered on the screen.


    Here''s a little more detail: In Listing 14-2, the paint method takes a g parameter.
    This refers to an instance of the java.awt.Graphics class. Because a Graphics
    instance is a context, the things you draw with this context are eventually displayed
    onscreen. All instances of the java.awt.Graphics class have several drawing methods
    — one of them is drawOval. You call drawOval by specifying a starting position
    (x pixels from the left of the frame and y pixels from the top of the frame).
    You may also specify an oval size by putting pixels in the width and height parameters.
    Calling the drawOval method puts a little round into the Graphics context, round
    thing and all, is displayed onscreen.


    If you trace the flow of Listings 14-1 through 14-3, you may notice something
    peculiar: The paint methods in these listings never need to be called. For many
    of Java''s window-making components, you just declare a paint method and let the
    method sit there quietly in the code. When the program runs, the computer calls
    the paint method automatically.


    That''s what happens with javax.swing.JFrame objects. In Listing 14-3, the frame''s
    paint method is called from behind the scenes. Then the frame''s paint method
    calls the Drawing object''s paint method, which in turn draws an oval on the frame.
    That''s how you get the stuff you saw earlier, in Figure 14-4.


    # CHAPTER 14 Sharing Names among the Parts of a Java Program 395'
