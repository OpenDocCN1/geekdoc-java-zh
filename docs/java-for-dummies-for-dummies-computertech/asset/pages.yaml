  md: "Listings 11-1 and 11-3 have the same Output. It's in Figure 11-4.\n\nAn enhanced\
    \ for statement has three parts:\n\n```\nfor (variableType variableName : rangeOfValues)\n\
    ```\n\nThe first two parts are variableType and variableName. The loop in Listing\
    \ 11-3 defines a variable named numGuests and numGuests has type int. During each\
    \ loop iteration, the variable numGuests takes on a new value. Refer to Figure\
    \ 11-4 to see these values. The initial value is 4. After that comes 2. And so\
    \ on.\n\nWhere is the loop finding all these numbers? The answer lies in the loop's\
    \ rangeOfValues. In Listing 11-3, the loop's rangeOfValues is guests. So, during\
    \ the initial iteration, the value of numGuests is guests[0] (which is 1). During\
    \ the next iteration, the value of numGuests is guests[1] (which is 4). After\
    \ that comes guests[2] (which is 2). And so on.\n\nJava's enhanced for requires\
    \ a word of caution: Each time the loop, the variable that steps through the range\
    \ of values stores a copy of the value in the original range. The variable does\
    \ not point to the range itself.\n\nFor example, if you assign an assignment statement\
    \ that changes the value of numGuests in Listing 11-3, this statement has no effect\
    \ on any of the values stored in the guests array. To drive this point home, imagine\
    \ that guests is bad and I've filled my hotel's guests array with zeros. Then\
    \ I execute the following code:\n\n```\nfor (int numGuests : guests) {\n    numGuests\
    \ += 1;\n    out.print(numGuests + \" \");\n}\n\nout.println();\n\nfor (int numGuests\
    \ : guests) {\n    out.print(numGuests + \" \");\n}\n```\n\nThe numGuests variable\
    \ takes values stored in the guests array. But the numGuests += 1 statement doesn't\
    \ change the values stored in this guests array. The code's output looks like\
    \ this:\n\n```\n1111111111\n0000000000\n```"
