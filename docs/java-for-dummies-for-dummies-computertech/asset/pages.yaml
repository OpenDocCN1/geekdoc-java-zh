    # When one line isn''t enough


    Listing 5-3 uses a feature that didn''t become an official part of Java until
    September 2020 (with Java 15): A text block is a bunch of text surrounded by sides
    by three double quotes ("""").


    ```

    out.println(""""

    The word you typed is stored

    in the same place as the real

    password. You must be a hacker. """");

    ```


    A text block starts with three double quotation marks, and the remainder of the
    block''s first line must be blank. If you mistakenly put text after those first
    three quotation marks, Java becomes sick to its stomach:


    ```

    // Do not this:

    out.println(""""The word you typed is stored

    in the same place as the real

    password. You must be a hacker. """");

    ```


    Text blocks are useful because the text inside a block can straddle more than
    one line. Without text blocks, you may be tempted to put one quotation mark at
    each end, but that doesn''t work. The following code, with traditional Java string
    notation, is forbidden:


    ```

    // This code is incorrect:

    out.println("The word you typed is stored

    in the same place as the real

    password. You must be a hacker.");

    ```


    This book''s seventh edition hit the shelves in 2017, before Java had text blocks.
    In that edition, Listing 5-3 had a truckload of out.println calls:


    ```

    out.println("The word you typed is stored\nout.println("in the same place as the
    real");

    out.println("password. You must be a");

    out.println("hacker.");

    ```'
