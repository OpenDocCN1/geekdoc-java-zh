  md: 'Listing 9-4 has two constructors in it. In the first constructor, I use two
    names: number and whatever. In the second constructor, I don''t need two names.
    Rather make up a new name for the constructor''s parameter, I reuse an existing
    name by writing this.number.


    Here''s what''s going on in Listing 9-2:


    +   > In the statement .number = number, the name this.number refers to the new
    object''s number field — the field that''s declared near the top of Listing 9-2.
    (See Figure 9-2)

    > In the statement .number = number, number, (on its own, without this) refers
    to the constructor''s parameter. (Again, see Figure 9-2).


    In general, this.someName refers to a field belonging to the object that contains
    the code. In contrast, plain old someName refers to the closest place where someName
    happens to be declared. In the statement this.number = number (refer to Listing
    9-2), that closest place happens to be the Temperature constructor''s parameter
    list.


    # WHAT''S THIS ALL ABOUT?


    Suppose that your code contains a constructor — the first of the two constructors
    in Listing 9-4. The whatever parameter is passed a number like 32.0, for instance.
    Then the first constructor in the constructor''s body assigns that 32, 0, to the
    new object''s number field. The code works. But in writing this code, you had
    to make up a new name for a parameter — the name whatever. The only purpose for
    this new name is to handle a value to the object''s number field. What a waste!
    To distinguish between the parameter and the number field, you gave a name to
    something that was just momentary storage for the number value.


    Making up names is not an art, I''ve gone through plenty of naming phases. Years
    ago, whenever I needed a new name for a parameter, I''d pick a confusing misspelling
    of the original variable name. (I''d name the parameter something like number
    or number.) I''ve also tried changing a variable name''s capitalization to come
    up with a parameter name. (I''d use parameter names like Number or NUMBER). In
    Chapter 8, I name all my parameters by adding the suffix to their corresponding
    variables. None of these naming schemes worked well — I can never remember the
    quirky new names I''ve created. The good news is this naming effort isn''t necessary.
    You can give the parameter the same name as the variable. To distinguish between
    the two, you use the Java keyword this1.


