    # Your Grandparents’’ Java Download Site


    People who want to run Java programs but don’t have to write Java programs should
    visit www.java.com.


    # The Horse’s Mouth


    Check the official Java API documentation at https://docs.oracle.com/en/java/javase/17/docs/api.
    And, to settle any argument about the way the language behaves, read the rigorous
    Java language specification at https://docs.oracle.com/javase/specs.


    # Join Java User Groups


    I happen to share leadership roles in the New York JavaSIG (www.javasig.com) and
    the Garden State Java User Group (www.gsjug.org). Both groups have regular online
    meetings and in-person meetings. Come join us!


