    You can perform a test to make sure the object referred to by the button variety
    is really the thing that was clicked. Just write if (e.getSource() == button).
    If your code has two buttons, button1 and button2, you can test to find out which
    button was clicked. You can write if (e.getSource()) == button1 and (e.getSource())
