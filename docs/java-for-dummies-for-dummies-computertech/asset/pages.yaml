    # Putting a package in its place\n\nPackage names can include dots and underscores,\
    \ but they can't include other punctuation characters. For example, you can name\
    \ your package good.job or go_away, but you can't name it oh, my! or state-of-the-art..\
    \ A dot in a package separates one part of the name from another.\n\nWhen you\
    \ put a class into a package, you have to create a directory structure that mirrors\
    \ the package name's parts. For example, the code in Listing 14-2 belongs to the\
    \ com.burdbrain.drawings package. To house that code, you must have three directories:\
    \ a com directory, a subdirectory of com named burdbrain, and a subdirectory of\
