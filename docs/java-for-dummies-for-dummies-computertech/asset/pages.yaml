    \ write\nWARNING\n\n```\npublic static void main(String[] args) {\n    var greeting\
    \ = \"Good morning!\"; // Okayl\n    // ... and so on.\n```\n\nYes, this rule\
    \ about var apply to the variables that you declare inside your method bodies.\
    \ But it doesn't apply to a class's fields. I illustrate this concept with a few\
    \ lines of incorrect code:\n\n```\npublic class Account {\n    var name = \"Alan\"\
    ; //Forgive me for typing this!\n    // ... and so on.\n```\n\nHonestly, it makes\
    \ me nervous to type these three lines, even while I warn you that this is it\
