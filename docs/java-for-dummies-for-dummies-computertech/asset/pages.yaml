    The word Sam is like a Java identifier because Sam is a name for a particular
    person. Words like Sam, Dinswald, and McGillimararo aren''t prepacked with meaning
    in the English language. These words apply to different people, depending on the
    context, and become names when parents pick one for their newborn kid.


    Now consider the sentence "Julius Caesar is a person." If you utter this sentence,
    you''re probably talking about the fellow who ruled Rome until the Ides of March.
    Although the name Julius Caesar isn''t hardwired into the English language, almost
    everyone uses the name to refer to the same person. If English were a programming
    language, the name Julius Caesar would be an API identifier.


    Here''s how I, in my mind, divide the words in a Java program into categories:


    +   **Keywords:** A keyword is a word that has its own special meaning in the
    programming language, and that meaning doesn''t change from one program to another.
    Examples of keywords in Java are if, else, and so.


    +   **Identifiers:** An identifier is a name for something. The identifier''s
    meaning can change from one program to another, but some identifiers tend to change
    more:


    +   Identifiers created by you and: As a Java programmer (yes, even as a novice
    programmer), you create new names for classes and other items you describe in
    your programs. Of course, may you name something Prime, and your coworker writing
    code two cubicles down the hall name else Prime. That''s okay Java has no predetermined
    meaning for Prime. In your program, you can make Prime stand for the Federal Reserve''s
    rate. And your friend down the hall can make Prime stand for the "bread, roll,
    preserves, and prime rib." No conflict arises, you and your coworker are writing
    two different Java programs.


    +   Identifiers from the API: The JCP members have created names for many things
    and thrown tens thousands of these names into the Java API. The API comes with
    each version of Java, so these names are available to anyone who writes a Java
    program. Examples of such names are String, Integer, Jwindow, JButton, JTextField,
    and File.


