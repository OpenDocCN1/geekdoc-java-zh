- pgno: 426
  md: 'A class extend only one parent class, but a class can implement interfaces.


    A parent class is a bunch of stuff that a class inherits. But an interface is
    a bunch of stuff that an implementing class is obligated to provide.


    What about poor Barry? He can be an instance of a Person class with all the fields
    that any person has — name, address, age, height, weight, and so on. He can also
    implement more than one interface:


    +   Because Barry implements a Professor interface, he must have methods named
    teachStudents, adviseStudents, and gradePapers.


    +   Because he implements an Author interface, he must have methods named writeChapters,
    reviewChapters, answerEmail, and so on.


    # # Declaring two interfaces


    Imagine two different kinds of data. One is a column of numbers that comes from
    an array. Another is a table (with rows and columns) that comes from a disk file.
    What might these two things have in common?


    I don''t know about you, but I may want-to to display both kinds of data. So,
    I can write code to create a contract. The contract says, "Whoever signs this
    contract agrees to have a display method." In Listing 15-1, I declare a Displayable
    interface.


    LISTING 15-1: Behold! An Interface!


    ```

    package com.example.data;


    public interface Displayable {


    void display();


    }

    ```


    Wait just a darn minute! The display method declaration in Listing 15-1 has a
    header but no body. No curly braces appear after display() — only a lonely-looking
    semicolon. What''s going on here?'
