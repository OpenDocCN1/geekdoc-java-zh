    # Defining Constructors (What It Means to Be a Temperature)


    Here''s a statement that creates an object:


    ```

    AccountAccount = new Account();

    ```


    I know it works — I got it from one of my examples in Chapter 7. Anyway, in Chapter
    7 I say, "[W]hen Java executes new Account(), you''re creating an object by calling
    the Account class''s constructor. What does this pithy sentence mean?


    Well, the keyword tells Java to create an object — an instance of a class. Java
    responds by performing certain actions. For starters, Java finds a place in memory
    to store information about the new object. If the object has fields, the fields
    should eventually have meaningful values.


    To find out fields, see Chapter 7.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_247_0.png)


    When you ask Java to create a new object, you may want to specify what the object''s
    fields are. And if you''re interested in doing more than filling fields? Perhaps,
    when Java creates a new object, you have a whole list of jobs for Java to carry
    out. For instance, when Java creates a new window object, you want Java to realign
    the sizes of all buttons in that window.


    Creating a new object can involve all kinds of tasks, so in this chapter you create
    constructors. A constructor tells Java to perform a new object''s start-up tasks.


