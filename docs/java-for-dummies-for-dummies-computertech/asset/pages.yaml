    # Chapter 17


    # Using Java Database Connectivity


    The year is 1998. I''m scheduled to introduce Java Database Connectivity to a
    group of computer science professors at the ITICSE conference in Ireland. Every
    day, for six days, I spend all afternoon driving from one to another. Every evening,
    my family members visit the town''s sites while I sit in my hotel room, pounding
    away at my laptop. The demo I have planned for the conference presentation isn''t
    working, and nothing I do makes the error messages go away.


    On the day of the conference, my demo still isn''t working. I do a scaled-down
    presentation — one that be called "Simulating Java Database Connectivity." Like
    any experienced instructor, I make up an excuse for the presentation''s wimpy
    results. "JDBC is still in beta," I say. Fortunately, the conference attendees
    seem to believe me.


    A month later, back home in New Jersey, I discover the flaw in the demo I had
    planned. Rather than type database customers, I should have typed database-customers.
    The thing that kept me from touring towns in Ireland and reduced my conference
    presentation from substance to fluff was a single blank space. It wasn''t even
    a character I could write on a piece of paper.'
  merge: -1
  img_proc: true
- pgno: 465
  md: "So much for my confession. This chapter covers Java Database Connectivity*\
    \ (JDBC), and your experience with JDBC will be joyous and fruitful. The JDBC\
    \ classes provide common access to most database management systems. Just get\
    \ a driver for your favorite vendor's system, and you're ready to go.\n\n# Creating\
    \ a Database and a Table\n\nThe crux of JDBC is contained in two packages: java.sql\
    \ and javax.sql, both of which are in the Java API. This chapter's examples use\
    \ the classes in java.sql. The first example is shown in Listing 17-1.\n\n+  \
    \ LISTING 17-1: Creating a Database and a Table\n\n```\npackage com.example.accounts;\n\
    \nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.SQLException;\n\
    import java.sql.Statement;\n\npublic class CreateTable {\n\n    public static\
    \ void main(String[] args) {\n\n        final String CONNECTION = \"jdbc:sqlite:AccountDatabase.db\"\
    ;\n\n        try (Connection conn = DriverManager.getConnection(CONNECTION);\n\
    \             Statement statement = conn.createStatement()) {\n\n            statement.executeUpdate(\"\
    \"\n                create table ACCOUNTS\n                (NAME VARCHAR(32) NOT\
    \ NULL PRIMARY KEY,\n                ADDRESS VARCHAR(32),\n                BALANCE\
    \ FLOAT)\"\");\n\n            System.out.println(\"ACCOUNTS table created.\");\n\
    \        }\n    }\n}\n\n```\n\n> * Apparently, there's no evidence in any of Oracle's\
    \ literature that the acronym actually stands for Java Database Connectivity.\
    \ But that's okay. If Java Database Connectivity isn't the correct terminology,\
    \ it's close enough. In the Java world, JDBC certainly doesn't stand for John\
    \ Digests Bleu Cheese."
  merge: -1
  img_proc: true
- pgno: 466
  md: "```\n} catch (SQLException e) {\n    System.out.println(e.getMessage());\n\
    }\n```\n\nRunning the examples in this chapter is a bit trickier than running\
    \ other chapters’ examples. To talk to a database, you need an intermediary piece\
    \ of software known as a database driver. Database drivers come in all shapes\
    \ and sizes, and many of them are quite expensive. But Listing 17-1 points to\
    \ a freebie driver: The Sqlite JDBC driver.\n\nWhen you install Java, you don't\
    \ get this Sqlite driver. You need a separate file named sqlite-jdbc.jar, which\
    \ you can download from https://github.com/xerial/sqlite-jdbc.\n\nEven after you've\
    \ downloaded a copy of sqlite-jdbc.jar, your IDE might not know where you've put\
    \ the file on your computer's hard drive. It's usually not enough to put sqlite-jdbc.jar\
    \ in a well-known directory. Instead, you have to tell your IDE exactly where\
    \ to find your sqlite-jdbc.jar file. Here's what you can do in two commonly used\
    \ IDEs:\n\n+   - **Eclipse**: Choose Project <-. In the resulting dialog box,\
    \ select Java Build Path and select the Libraries tab. Modulepath. Click the Add\
    \ External JARS button, and then navigate to the sqlite-jdbc.jar file on your\
    \ computer's hard drive.\n- **Intellij IDEA**: Choose File <- Project Structure.\
    \ In the resulting dialog box, select Libraries. Click the Plus Sign (+) icon,\
    \ and in the resulting drop-down box, select Java. Navigate to the sqlite-jdbc.jar\
    \ file on your computer's hard drive.\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_466_0.png)\n\
    \nFor more detailed instructions the use of Sqlite with Java, visit www.sqitetutorial.net/sqlite-java.\n\
    \n# Seeing what happens when you run the code\n\nDuring a successful run of the\
    \ code in Listing 17-1, you see an ACCOUNTS table created message. That's about\
    \ it. The code has no other visible output because most of the output goes to\
    \ a database."
