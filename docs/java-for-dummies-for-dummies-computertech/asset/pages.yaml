    and marking the numbers of such things on log sheets, in little handheld gizmos,
    and into forms on computer keyboards. A particular part of the project involves
    entering the number of boxes you find on the shelf labeled Dusty Boxes That Haven''t
    Been Opened Since Year One. Rather than break the company''s decades-habit, you
    decide not to open any of these boxes. You arbitrarilyarily assign the value $3.25
    to each box.


    Listing 13-1 shows the software to handle this bit of inventory. The software
