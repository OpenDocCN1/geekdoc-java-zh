  md: 'Anyway, you''re trying to keep track of the number of guests in each room.
    Because you have ten rooms, you may think about declaring ten variables:


    ```

    int guestsInRoomNum0, guestsInRoomNum1, guestsInRoomNum2,

    guestsInRoomNum3, guestsInRoomNum4, guestsInRoomNum5,

    guestsInRoomNum6, guestsInRoomNum7, guestsInRoomNum8,

    guestsInRoomNum9;

    ```


    Doing it this way may seem a bit inefficient — but inefficiency isn''t the only
    wrong with this code. Even more problematic is the fact that you can''t just loop
    through these variables. To read a value for each variable, you have to copy the
    next int method times:


    ```

    guestsInRoomNum0 = scanner.nextInt();

    guestsInRoomNum1 = scanner.nextInt();

    guestsInRoomNum2 = scanner.nextInt();

    // and so on.

    ```


    Surely a better way exists.


    That better way involves an array. An array is a row of values, like the row of
    rooms in a 1-floor motel. To picture the array, just picture the Java Motel:


    +   First, picture the rooms, lined up next to one another.

    Next, picture the same rooms with their walls missing. Inside each room you can
    see a certain number of guests.

    If you can, forget that the two guests in Room 9 are putting piles of bills into
    a big brief-case. Ignore the fact that the guests in Room 6 haven''t moved away
    from the TV set in a day-and-a-half. Instead of all details, see only numbers.
    In each room, see a number representing the count of guests in that room. (If
    free-form visualization isn''t your strong point, look at Figure 11-1.)


    In the lingo of this chapter, the entire row of rooms is called an array. Each
    room in the array is called a component of the array (also known as an array element).
    Each component has two numbers associated with it:


    +   The room number (a number from 0 to 9), which is called an index of the array

    A number of guests, which is a value stored in a component of the array'
