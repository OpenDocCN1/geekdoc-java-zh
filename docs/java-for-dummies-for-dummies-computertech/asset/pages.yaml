    8-1 and 8-2. You''ll also find a file named EmployeeInfo.txt. That''s good, if
    Java can''t find the EmployeeInfo.txt file, the whole project doesn''t run properly.
    Instead, you get a FileNotFoundException.


    In general, when you get a FileNotFoundException, some file that your program
    isn''t available to it. This is not an easy mistake to make. It can be frustrating
    because, to you, a file such as EmployeeInfo.txt may look like it''s available
    to your program. But remember: Computers are stupid. If you make a tiny mistake,
    the computer can''t read between the lines for you. So, if your EmployeeInfo.txt
    isn''t in the right directory on your hard drive or is misspelled incorrect, the
    computer chokes when it tries to run your code.


    Sometimes you know darn well that an EmployeeInfo.txt (or whatever.xyz) exists
    on your hard drive. But when you run your program, you still get a mean-looking
    FileNotFoundException. When this happens, the file is usually in the wrong directory
    on your hard drive. (Of course, it depends on your point of view. Maybe the file
    is in the right directory, but your Java program is looking for the file in the
    wrong directory.) To diagnose this problem, add the following code to


