- pgno: 425
  md: "In Java, reference types are everywhere. But until this point in the book,\
    \ the only reference types you see are classes and arrays. Java has other kinds\
    \ of reference types, and this chapter explores the possibilities.\n\n# The Java\
    \ Interface\n\nThink about a class (such as an Employee class) and a subclass\
    \ (such as a Full-TimeEmployee class). The relationship between a class and its\
    \ subclass is one of inheritance. In many real-life families, a child inherits\
    \ assets from a parent. And in Chapter 8, the FullTimeEmployee class inherits\
    \ name and jobTitle fields from the Employee class. That's the way it works.\n\
    \nBut consider the relationship between an editor and an author. The editor says,\
    \ \"By signing this contract, you agree to submit a completed manuscript by the\
    \ ninth of January.\" Despite any excuses that the author gives before the deadline\
    \ (date, and believe me, authors make plenty of excuses), the relationship between\
    \ the editor and the author is one of obligation. The author agrees to take certain\
    \ responsibilities; and, in order to continue being an author, the author must\
    \ fulfill those responsibilities. (By the way, there's no subtext in this paragraph\
    \ — none at all.)\n\nNow consider Barry Burd. Who? Barry Burd — that guy who writes\
    \ Java For Dummies and contain other For Dummies books (all from Wiley Publishing).\
    \ He's a college professor, and he's an author. You to mirror this situation in\
    \ a Java program, but Java doesn't support multiple inheritance. You can't make\
    \ Barry extend both a Professor class and an Author class at the same time.\n\n\
    Fortunately for Barry, Java has interfaces. An interface is a kind of reference\
    \ type. In fact, the code to create an interface looks a lot like the code to\
    \ create a class:\n\n```\npublic interface MyInterfaceName {\n    // blah, blah,\
    \ blah\n}\n```\n\nAn interface is a lot like a class, but an interface is different.\
    \ (What else is?) A cow is like a planet, but it's quite a bit different. Cows\
    \ moo; planets hang in space.\n\nAnyway, when you read the word interface, you\
    \ can start by thinking of a class. Then, in your head, note that"
