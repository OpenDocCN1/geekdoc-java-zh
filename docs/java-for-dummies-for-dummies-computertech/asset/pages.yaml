    The compiler coughs up your code and spits it out because a Room (created in Chapter
    11) isn''t the same as a String. (This coughing and spitting happens even if the
    compiler has access to the Room class''s code — in Chapter 11.) But the statement


    ```

    people.add("George Gow");

