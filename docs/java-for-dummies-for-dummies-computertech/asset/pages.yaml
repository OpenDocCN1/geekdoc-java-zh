    live in the United States, where the thousands-separator is a comma, change the
    number to 1,000_000.00 and see what happens. (Hint: Nothing good.)

    - Try using underscores as thousands-separators in the code. That is, 1000000.00
    to 1_000_000.00 and see what happens.


