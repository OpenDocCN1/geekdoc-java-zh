    \n# # Protected Access for Members\n\nWhen I was first getting to know Java, I\
    \ thought the word protected meant \"nice and secure\" or something like that.\
    \ \"Wow, that field must be hard to get at.\" Well, this notion turned out to\
    \ be wrong. In Java, a member's protected is less hidden, less secure, and available\
    \ for access in more classes than one that has default access. In other words,\
    \ protected access is more permissive than default access. For me, the terminology\
    \ is misleading. But that's the way it is.\n\n# A class in one package and a subclass\
    \ in another\n\nThink of protected access this way. You start with a field that\
    \ has default access (a field without the word public, private, or protected in\
    \ its declaration). That field can be accessed only inside the package in which\
    \ it lives. Now add the word protected to the front of the field's declaration.\
    \ Suddenly, classes outside of that field's package have some access to the field.\
    \ You can now reference the field from a subclass (of the class in which the field\
    \ is declared). You can also reference the field from a sub-subclass, a sub-sub-subclass,\
    \ and so on. Any descendant class will do. If you want evidence, see Listing 14-9.\n\
    \n# LISTING 14-9: Protected Fields\n\n```\npackage com.burdbrain.drawings;\n\n\
    import java.awt.Graphics;\n\npublic class Drawing {\n    protected int x = 40,\
    \ y = 40, width = 40, height = 40;\n```\n\n402 PART 4 Smart Java Techniques"
