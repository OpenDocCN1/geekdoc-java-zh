  md: '# A taxonomy of lambda expressions


    Java divides lambda expressions into about 45 different categories. Table 12-2
    lists a few of the categories.


    The categories in Table 12-2 aren''t mutually exclusive. For example, every Predicate
    is a Function. (Every Predicate accepts one parameter and returns a result. The
    result happens to be boolean.)


    The next sections refer to some of these categories.


    | TABLE 12-2 A Few Kinds of Lambda Expressions |

    | Name | Description | Example |

    | Function | Accepts one parameter; produces a result of any type | (sale) ->
    sale. price |

    | Predicate | Accepts one parameter; produces a boolean valued result | (sale)
    -> sale.item.equals("DVD") |

    | BinaryOperator | Accepts two parameters of the same type; produces a result
    of the same type | (price1, price2) -> price1 + price2 |

    | Consumer | Accepts one parameter; produces no result | (sale) -> System.out.println(sale.
    price) |


    # The interpretation of streams


    The earlier section "Once and again" introduces iterators. An iterator''s next
    method spits out a collection''s values, one by one. That''s great, but Java takes
    this concept a step further with the notion of a stream. A stream is like an iterator
    except that, with a stream, you don''t have to call a next method. A stream spits
    out a collection automatically. To get values from a stream, you don''t call a
    stream''s next method. In fact, a typical stream has no next method.


    With streams, you can create an assembly line that elegantly solves this chapter''s
    sales problem. Unlike the code in Listing 12-4, the new assembly line uses concepts
    from functional programming.


    The assembly line consists of several methods. Each method takes the data, transforms
    the data in some way or other, and hands its results to the next method. Figure
    12-5 illustrates the assembly line for this chapter''s sales problem.'
