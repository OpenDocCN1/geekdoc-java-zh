  md: '# IN THIS CHAPTER


    +   >> What Java is


    +   >> Where Java came from


    +   >> Why Java is so cool


    +   >> How to orient yourself to object-oriented programming


    # Chapter 1

    All about Java


    Say what you want about computers. As far as I''m concerned, computers are good
    for just two simple reasons:


    +   >> When computers do work, they feel no resistance, no stress, no boredom,
    and no fatigue. Your computer can work 24/7 making calculations for the world.climateprediction.net
    — a distributed computing project to model the world''s climate change. Or, have
    your computer crunch numbers for Rosetta.home — a site that models proteins to
    help cure major illnesses. Will you feel sorry for my computer because it''s working
    so hard? Will the computer complain? No.


    You can make demands, give the computer its orders, and crack the whip. Will you
    (or should) feel the least guilty? Not at all.


    +   >> Computers move ideas, not paper. Not long ago, whenever you wanted to send
    a message to someone, you hired a messenger mounted a horse and delivered your
    message personally. The message was recorded on paper or parchment or a clay tablet
    or whatever other physical medium was available at the time.


    This whole process seems wasteful now, but that''s only because you and I are
    sitting comfortably in the electronic age. Messages are ideas, and physical objects
    like ink, paper, and horses have little or nothing to do with real ideas; they''re
    just temporary carriers for ideas (even though people used them for several centuries
    to carry ideas). Nevertheless, the ideas themselves are paperless, horseless,
    and messengerless.


    CHAPTER 1 All about Java'
