  md: "You can't just plop method calls anywhere in the PlayerPlus class. For example,\
    \ the following code is bad, invalid, illegal, and otherwise un-Java-like:\n\n\
    ```\n// THIS IS BAD CODE:\npublic class PlayerPlus extends Player {\n    private\
    \ static DecimalFormat dateFormat = new DecimalFormat(\");\n\n    dateFormat.setMaximumIntegerDigits(0);\
    \ // Bad\n    dateFormat.setFractionDigits(3); // Bad\n    dateFormat.setMinimumFractionDigits(3);\
    \ // Bad\n```\n\nLook at the examples from previous chapters. In those examples,\
    \ I never let a method call dangle on its own, the way I do in the bad, bad code.\
    \ In this chapter, in Listing 10-1, I don't setMaximumIntegerDigits without putting\
    \ the method call inside the getAverageString() method. This no-dangling-calls\
    \ business isn't an accident. Java's rules restrict the places in the code where\
    \ you can issue calls to methods, and putting a lonely call on its own immediately\
    \ inside a class is a big no-no.\n\nIn Listing 10-4, where can you put the setMax\
    \ and setMin calls? You can put them inside the findTeamAverageString method,\
    \ much the way I put them inside the getAverageString method in Listing 10-1.\
    \ But putting those calls inside the findAverageString method's body might defeat\
    \ the purpose of having dateFormat be static. After, a programmer might call findTeamAverageString\
    \ several times, calling dateFormat.setMaximumIntegerDigits(0) each time. But\
    \ that would be wasteful. The eitherPlayer class has only one dateFormat field,\
    \ and that dateFormat's MaximumIntegerDigits is always 0. Don't keep setting MaximumIntegerDigits(0)\
    \ over and again.\n\nThe best alternative is to take the bad lines in this section\
    \ and put them inside a static initializer. Then become good lines inside good\
    \ code (Listing 10-4.) A static initializer is a block that's preceded by the\
    \ word static. Java executes the static initializer's statements once for the\
    \ entire class. That's exactly what you want for something called static.\n\n\
    # Displaying the overall team average\n\nYou may be noticing a pattern. When you\
    \ create for a class, you generally write two pieces of code: One piece of code\
    \ defines the class, and the other piece of code uses the class. (The ways to\
    \ use a class include calling the class's constructor, referencing the class's\
    \ nonprivate fields, and calling the class's methods.) Listing 10-4, shown previously,\
    \ contains code that defines the PlayerPlus class, and Listing 10-5 contains code\
    \ that uses this PlayerPlus class.\n\nCHAPTER 10 Putting Variables and Methods\
    \ Where They Belong 273"
