- pgno: 27
  md: 'Languages focus first on the data are called object-oriented programming languages.
    These object-oriented languages make excellent programming tools.

    Here''s why:


    +   - Thinking first about the data makes you a good computer programmer.

    - You can extend and reuse the descriptions of data over and over again. When
    you try to teach FORTRAN programs new tricks, however, the old programs show how
    brittle they are. They break.


    In the 1970s, object-oriented languages, such as SIMULA and Smalltalk, were buried
    in the computer hobbyist magazine articles. In the meantime, languages based on
    the old FORTRAN model were multiplying like rabbits.


    So, in 1986 a fellow named Bjarne Stroustrup created a language named C++. The
    C++ language became popular because it mixed the old C language terminology with
    the improved object-oriented structure. Many companies turned their backs on the
    old FORTRAN/C programming style and adopted C++ as standard.


    But C had a flaw. With C++, you could bypass the object-oriented features and
    write a program by using the old FORTRAN/C programming style. When you started
    writing a C++ accounting program, you could take fork in the road:


    +   - Choose the object-oriented approach and begin by describing what it means
    to be an account.


    Some people said that C++ offered the best of both worlds, but others argued that
    the first world (the world of FORTRAN and C) shouldn''t be part of modern programming.
    If you gave a programmer an opportunity to write code either way, that person
    would often choose to write code the wrong way.


    So, in 1995 James Gosling of Sun Microsystems created the language named Java.
    In creating Java, Gosling borrowed the look and feel of C++. But Gosling took
    most of the old "Do this/Do that" features of C++ and threw them in the trash.
    Then he added features that made the development of objects smoother and easier.
    In all, Gosling created a language whose object-oriented philosophy is pure and
    clean. When you program in Java, have no choice but to work with objects. That''s
    the way it'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # Objects and their classes


    In an object-oriented language, you use *objects* and *classes* to organize your
    data.


    Imagine that you''re writing a computer program to keep track of the houses in
    a new condominium development (still under construction). The houses differ only
    slightly from one another. Each house has a distinctive siding color, an indoor
    paint color, a kitchen cabinet style, and so on. In your object-oriented computer
    program, each house is an object.


    But objects aren''t the whole story. Although the houses differ slightly from
    one another, all the houses share the same list of characteristics. For instance,
    each house has a characteristic known as *siding color*. Each house has another
    characteristic known as *kitchen cabinet style*. In your object-oriented program,
    you need a master list containing all characteristics that a house object can
    possess. This master list of characteristics is called a *class*.


    So there you have it. Object-oriented programming is misnamed. It should be "programming
    with classes and objects."


    Now notice that I put the word *classes* first. How dare I do this! Well, maybe
    I''m not so crazy. Think again about a housing development that''s under construction.
    Somewhere on the lot, in a rickety trailer parked on bare dirt, is a master list
    of characteristics known as a *blueprint*. An architect''s blueprint is like an
    object-oriented programmer''s class. A blueprint is a list of characteristics
    that each house will have. The blueprint says "siding." The actual house has gray
    siding. The blueprint says "kitchen cabinet." The actual house has Louis XIV cabinets.


    The analogy doesn''t end with lists of characteristics. Another important parallel
    exists between blueprints and houses. A year after you create the blueprint, you
    use it to build ten houses. It''s the same with classes and objects. First, the
    programmer writes code to describe a class. Then when the program runs, the computer
    creates objects from the (blueprint) class.


    So that''s the real relationship between classes and objects. The programmer defines
    a class, and from the class definition, the computer makes individual objects.


    # # What''s so great about an object-oriented language?


    Based on the preceding section''s story about home building, imagine that you''ve
    already written a computer program to keep track of the building instructions
    for'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'houses in a new development. Then the big boss decides on a modified plan —
    a plan in which half the houses have three bedrooms and the other half have four.


    If you use the old FORTRAN/C style of computer programming, your instructions
    look like this:


    ```

    Dig a ditch for the basement.

    Lay concrete around the sides of the ditch.

    Place two-by-fours along the sides for the basement''s frame.

    ```


    This would be similar to an architect creating a long list of instructions instead
    of a blueprint. To modify the plan, you have to sort through the list to find
    the instructions for building bedrooms. To make matters worse, the instructions
    might be scattered among pages xvii, 234, 739, 394–410, 10, and 2. If the builder
    had to decipher other peoples'' complicated instructions, the task would be ten
    times harder.


    Starting with a class, however, is like starting with a blueprint. If you decide
    to have both three- and four-bedroom houses, you can start with a blueprint called
    the house blueprint — it has a ground floor and a second floor, but has no indoor
    walls drawn on the second floor. Then you make two more second-floor blueprints
    — one for the three-bedroom house and another for the four-bedroom house. You
    name these new blueprints the three-bedroom house blueprint and the four-bedroom
    house blueprint.


    Your builder colleagues are amazed at your sense of logic and organization, but
    they have concerns. They pose a question. “You called one of the blueprints ''three-bedroom
    house'' blueprint. How can you do this if it''s a blueprint for a second floor
    and not for a whole house?


    You smile knowingly and answer, “The three-bedroom house blueprint can say, ''For
    info about the lower floors, the original house blueprint.'' That way, the three-bedroom
    house blueprint describes a whole house. The four-bedroom house blueprint can
    say the same thing. With this setup, we can take advantage of all the work we
    already did to create the original house blueprint and save lots of money.


    In the language of object-oriented programming, the three- and four-bedroom house
    classes are inheriting the features of the original house class. You can also
    say that the three- and four-bedroom house classes are extending the original
    house class. (See Figure 1-1).'
