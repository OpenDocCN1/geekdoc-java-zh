  md: 'Here''s another way to think about a class. Imagine a table displaying all
    three of your bank accounts (see Table 1-1).


    # Table 1-1


    # A Table of Accounts


    | Account Number | Type | Balance |

    | --- | --- | --- |

    | 16-13154-22864-7 | Checking | 174.87 |

    | 1011 1234 2122 0000 | Credit | -471.03 |

    | 16-17238-13344-7 | Savings | 247.38 |


    Think of the table''s column headings as a class and think of each row of the
    table as an object. The table''s column headings describe the Account class.


    According to the table''s column headings, each account has an account number,
    a type, and a balance. Rephrased in the terminology of object-oriented programming,
    each object in the Account class (that is, each instance of the Account class)
    has an account number, a type, and a balance. So the bottom row of the table is
    an object with account number 16-17238-13344-7. This same object has type Savings
    and balance of 247.38. If you opened a new account, you would have another object
    and the table would grow an additional row. The new object would be an instance
    of the same Account class.


