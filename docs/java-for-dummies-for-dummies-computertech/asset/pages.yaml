    # Another way to beautify your numbers


    The getAverageString method in Listing 10-1 takes the value from the average field
    (a player''s batting average), converts (normally of type double) into a String,
    and then sends that String value back to the method caller. The use of DecimalFormat,
    which comes directly from the Java application programming interface (API), ensures
    that the String value looks like a baseball batting average. According to decFormat.setMaximum...
    and decFormat.setMinimum... method calls, the String value has no digits to the
    left of the decimal point and has exactly three digits to the right of the decimal
    point.


    Java''s DecimalFormat class can be quite handy. For example, to display the values
    345 and -345 in an accounting-friendly format, you can use the following:


    ```

    DecimalFormat decFormat = new DecimalFormat();

    decFormat.setMinimumDigits(2);

    decFormat.setNegativePrefix("-");

    decFormat.setNegativeSuffix("");

    System.out.println(decFormat.format(345));

    System.out.println(decFormat.format(-345));

    ```


    In this example''s format string, everything before the semicolon dictates the
    way positive numbers are displayed, and everything after the semicolon determines
    the way negative numbers are displayed. So, with this format, the numbers 345
    and -345 appear as follows:


    ```

    345.00

    (-345.00)

    ```


    To discover some other tricks with numbers, visit the DecimalFormat page of Java''s
    API documentation (https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/text/DecimalFormat.html).


