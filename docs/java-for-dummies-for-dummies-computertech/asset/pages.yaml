    topic you learned in elementary school math. Almost everybody knows how to add
    2 and 2. in fact, in English usage, adding 2 and 2 is a metaphor for something
    that''s easy to say. Whenever you see a plus sign, a cell in your brain says "Thank
    goodness — it could be something more complicated"


    Java has a plus sign. You can use it for several purposes. You can use the plus
    sign to add two numbers, like this:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    ```


    You can also use the plus sign to paste String values together:


    ```

    String startOfChapter = +

    "It''s three in the morning. I''m dreaming about the "-

    "history course that I failed in high school."

    System.out.println(startOfChapter);

    ```


    This can be heady because, in Java, you can''t make an ordinary String straddle
