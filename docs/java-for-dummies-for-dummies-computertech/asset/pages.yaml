  md: '# Constructors for subclasses


    By far, the biggest news in Listing 9-5 is the way the code declares constructors.
    The TemperatureNice class has four of its own constructors. If you''ve gotten
    in gear thinking about subclass inheritance, you may wonder why these constructor
    declarations are necessary. Doesn''t TemperatureNice inherit the parent Temperature
    class''s constructors? No, subclasses don''t inherit constructors.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_261_0.png)


    Subclasses don''t inherit constructors. That''s right. Subclasses don''t inherit
    constructors. In one oddball case, a con-structor may look like it''s being inherited,
    but that oddball situation is a fluke, not not the norm. In general, when you
    define a subclass, you declare new constructors to go with the subclass.


    I describe the oddball case (in which a constructor looks like it''s being inherited)
    later in this chapter, in the section "The default constructor."


    So the code in Listing 9-5 has four constructors. Each constructor has the name
    TemperatureNice, and each constructor has its uniquely identifiable param-er list.
    That''s the boring part. The interesting part is that each constructor makes a
    call to something named super, which is a Java keyword.


    In Listing 9-5, super stands for a constructor in the parent class:


    +   - The statement super() in Listing 9-5 calls the parameterless Temperature()
    constructor that''s in Listing 9-2. That parameterless constructor assigns 0 to
    the number field and TempScale. FAHRENHEIT to the scale field.

    - The statement super(number, scale) in Listing 9-5 calls the Temperature(double
    number, TempScale scale) that''s in Listing 9-2. In turn, the constructor assigns
    values to the number and scale fields.

    - In a similar way, the statements super(number) and super(scale) in Listing 9-5
    call constructors from Listing 9-2.


    The computer decides which of the Temperature class''s constructors is being called
    by looking at the parameter list after the word super. For instance, when the
    computer executes


    ```

    super(number, scale);

    ```


    from Listing 9-5, the computer says to itself, "The number and scale fields in
    parentheses have types double and TempScale. But only one of the Temperature'
