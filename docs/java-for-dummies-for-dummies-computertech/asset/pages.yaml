  md: "# Putting Data in the Table\n\nLike any other tabular configuration, a database\
    \ table has columns and rows.\n you run the code in Listing 17-1, you get an empty\
    \ table. The table has three\ncolumns (NAME, ADDRESS, and BALANCE) but no rows.\
    \ To add rows to the table, run\nthe code in Listing 17-2.\n\n# LISTING 17-2:\
    \ Inserting Data\n\n```\npackage com example.accounts;\n\nimport java.sql.Connection;\n\
    import java.sql.DriverManager;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    \npublic class AddData {\n    public static void main(String[] args) {\n     \
    \   final String CONNECTION = \"jdbc:sqlite:AccountDatabase.db\";\n\n        try\
    \ (Connection conn = DriverManager.getConnection(CONNECTION);\n            Statement\
    \ statement = conn.createStatement()) {\n\n            statement.executeUpdate(\"\
    \n                insert into ACCOUNTS values\n                ('Barry Burd',\
    \ '222 Cyber Lane', 24.02')\n            \");\n            statement.executeUpdate(\"\
    \n                insert into ACCOUNTS values\n                ('Joe Dow', '111\
    \ Luddite Street', 55.63')\n            \");\n\n            System.out.println(\"\
    Rows added.\");\n        } catch (SQLException e) {\n            System.out.println(e.getMessage());\n\
    \        }\n    }\n}\n```\n\nListing 17-2 uses the same strategy as the code in\
    \ Listing 17-1: Create Java strings\ncontaining SQL commands and make those strings\
    \ as arguments to Java's execute-\nUpdate method. In Listing 17-2, I put two rows\
    \ in the ACCOUNTS table — one for\nme and another for Joe Dow. (Joe, I hope you\
    \ appreciate this.)"
