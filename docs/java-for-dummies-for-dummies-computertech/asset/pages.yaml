  md: "# What is a temperature?\n\n\"Good morning, and welcome to Object News. The\
    \ local temperature in your area is a pleasant 73 degrees Fahrenheit.\"\n\nEach\
    \ temperature consists of two parts: a number and a temperature scale. A number\
    \ is just a double value, such as 32.0 or 70.2. But what's a temperature scale?\
    \ Is it a string of characters, like \"Fahrenheit\" or \"Celsius\"? Not really,\
    \ because some strings aren't temperature scales. There's no \"Quelploof\" temperature\
    \ scale, and a program that can display \"73 degrees Quelploof\" is a bad program.\
    \ So how can you limit the temperature scales to the small number of scales that\
    \ people use? One way to do it is with Java's enum type.\n\n# What is a temperature\
    \ scale?\n(Java's enum type)\n\nJava provides lots of ways to group things together.\
    \ In Chapter 11, you group things to form an array. And in Chapter 12, you group\
    \ things to form a collection. In this chapter, you group things into an enum\
    \ type. (Of course, you can't group anything unless you can enum. The word enum\
    \ is pronounced \"ee-NOOM,\" like the first two syllables of the word enumeration.)\n\
    \nCreating a complicated enum type isn't easy, but to create a simple enum type,\
    \ just write a bunch of words inside a pair of curly braces. Listing 9-1 defines\
    \ an enum type. The name of the enum type is TempScale.\n\n```\npackage com.example.weather;\n\
    \npublic enum TempScale {\n    CELSIUS, FAHRENHEIT, KELVIN, RANKINE,\n    NEWTON,\
    \ DELISLE, RÉAMUR, RŒMER\n}\n```\n\n> In 9-1, I'm showing off my physics prowess\
    \ by naming not two, four, but nine different temperature scales. Some readers'\
    \ computers have trouble with the special characters in the words RÉAMUR and RŒMER.\
    \ If you're one of those readers, simply delete the words RÉAMUR and RŒMER from\
    \ the code. I promise it: It won't mess up the example.\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_248_0.png)"
