  md: "In Listing 8-3, the magic word is extends. When one class extends an existing\
    \ class, the extending class automatically inherits functionality that's defined\
    \ in the existing class. So, the FullTimeEmployee class inherits the name and\
    \ jobTitle fields. The FullTimeEmployee class also inherits all the methods that\
    \ are declared in the Employee class: setName, getName, getJobTitle, and cut-Check.\
    \ The FullTimeEmployee class is a subclass of the FullTimeEmployee class. That\
    \ means the Employee class is the superclass in terms of blood relatives: The\
