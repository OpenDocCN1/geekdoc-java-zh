    (For instance, you can create a variable that always stores a letter.) The kind
    of value that''s stored in a variable''s type


    You can read more about types in the section "The types of values that variables
    may have," later in this chapter.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_72_0.png)


    A subtle, almost unnoticed difference exists between a variable and a variable''s
    name. In formal writing, I often use the word variable when I mean variable name.
    Strictly speaking, amountInAccount is a variable, and all the memory storage associated
    with amountInAccount (including the type that amountInAccount has and whatever
    value amountInAccount represents) is the variable itself. If you think this distinction
    between variable and name is too subtle to worry about, join the club.


    Every variable is an identifier — a name that you can make up in your code. In
    preparing Listing 4-1, I made up the name amountInAccount.


    For more information on the kinds of names in a Java program, see Chapter 3.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_72_1.png)


    Before the sun sets on Listing 4-1, you need to notice one more part of the listing.
    The listing has 50.22 and 100000.00 in it. Anyone in their right mind would call
    these numbers, but in a Java program it helps to call these literals.


    And what''s so literal as 50.22 and 100000.00? Well, think about the variable
    amountInAccount in Listing 4-1. The variable amountInAccount stands for 50.22
    some of the time, but it stands for 100000.22 the rest of the time. You could
    use the word number to talk about amountInAccount. But really, amountInAccount
    stands for depends on the fashion of the moment. On the other hand, 50.22 literally
    stands for 52/100.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_72_2.png)


    A variable''s value changes; a literal''s doesn''t.


    You can add underscores to numeric literals. Rather than using the plain old 100000.00
    in Listing 4-1, you can write amountInAccount = amountInAccount + 1_000_000.00.
    Unfortunately, you can''t easily do what you''re most tempted to do. You can''t
    write 1,000,000.00 (as you would in the United States), nor can you write 1.000.000.00
    (as you would in Germany). If you want to display a number as 1,000,000.00 in
    the program''s output, you have to use some fancy formatting tricks. For more
    information about formatting, check Chapters 10 and 11.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_72_3.png)


