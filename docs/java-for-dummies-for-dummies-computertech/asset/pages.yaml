- pgno: 362
  md: 'Java divides the work among the number of cores in the computer''s processor
    (or according to some other useful measure of computing power). If you have 4
    million sales and four cores, each core processes 1 million of the sales.


    Each core works independently of the others, and each core dumps its result into
    a final reduce method. The reduce method combines the cores'' results into a final
    tally. In the best possible scenario, all the work gets done in one-fourth of
    the time it would take with an ordinary serial stream.


    When you read the preceding paragraph, don''t gloss over the phrase best possible
    scenario. Parallelism isn''t magic. And sometimes, parallelism isn''t your friend.
    Consider the situation in which you have only 20 sale amounts to the time. The
    time it takes to divide the problem into four groups of 5 sales each exceeds the
    amount of time you save in using all cores. In addition, some problems don''t
    lend themselves to parallel processing. Imagine that the price of an item depends
    on the number of similar items being sold. In that case, you can''t divide the
    problem among four operating cores. If you try, each core has to know what the
    other cores are doing. You lose the advantage of having four threads of execution.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_362_0.png)


    # ## NO VARIABLES? NO PROBLEM!


    In imperative programming, your code''s pieces interact with one another. All
    the pieces might be updating the current price of Oracle stock shares (ticker
    symbol: ORCL). The simultaneous updates may conflict with one another and result
    in an incorrect outcome. You''ve experienced the same phenomenon when you''ve
    ever clicked a website''s Purchase button, only to learn that the item you''re
    trying to purchase is out of stock. Someone else completed a purchase while you
    were filling in your credit card information. Too many customers were grabbing
    for the same goods at the same time.


    The source of the problem is shared data. How many clients share Oracle''s stock
    price? How many customers share access to a web page''s Purchase button? Today''s
    multicore processors can perform more than one instruction at a time. How many
    simultaneous instructions can all be trying to modify the same variable''s value?


    In imperative programming, a variable is a place where statements share their
    values with one another. Can you avoid using variables in your code?


    Compare the loop in Listing 12-4 with the functional programming code in Listing
    12-5. In Listing 12-4, the runningTotal variable is shared among all loop iterations.
    Because


