  md: '# Brace yourself


    The if statement in Listing 5-1 has two halves: a top half and a bottom half.
    I have names for two parts of an if statement. I call them the if part (the top
    half) and the else part (the bottom half).


    The if part in Listing 5-1 seems to have more than one statement in it. I make
    this happen by enclosing the three statements of the if part in curly braces.
    When I do this, I form a block. A block is a bunch of statements scrunched together
    by a pair of curly braces.


    With this block, three calls to println are tucked away inside the if part. With
    curly braces, the rows of asterisks and the words you win display only when the
    user''s guess is correct.


    This business with blocks and curly braces applies to the if part as well. In
    Listing 5-1, whenever inputNumber doesn''t equal randomNumber, the computer executes
    three print/println calls. To convince the computer that all three of these calls
    are inside the else clause, I put these calls into a block. That is, I enclose
    these three calls in a pair of curly braces.


    Strictly speaking, Listing 5-1 has only one statement between the if and the else
    statements and only one statement after the else statement. The trick is when
    you place a bunch of statements inside curly braces, you get a block; and a block
    behaves, in all respects, like a single statement. In fact, the official Java
    documentation lists blocks as one of the many kinds of statements. So, in Listing
    5-1, the block that puts you win and asterisks is a single statement that has,
    within it, three smaller statements.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_118_0.png)


    # Your intent to indent


    Notice how, in Listing 5-1, the print and println calls inside the if statement
    are indented. (This includes both you win and you lose statements. The print and
    println calls that come after the word else are still part of the statement.)
    Strictly speaking, you don''t have to indent the statements that are inside an
    if statement. For all the compiler cares, you can write your program on a single
    line or place all your statements in an artful, haphazard zigzag. The problem
    is that neither you anyone else can make sense of your code if you don''t indent
    your statements in some logical fashion. In Listing 5-1, the indenting of the
    print and println statements helps your eye (and brain) see quickly that these
    statements are subordinate to the overall if/else flow.'
