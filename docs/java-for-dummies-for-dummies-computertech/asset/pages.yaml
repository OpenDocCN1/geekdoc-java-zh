    or new File("dataFiles/EmployeeInfo.txt").


    # Reading a line at a time


    In Listing 8-2, the payEmployee method illustrates some useful tricks for reading
    data. In particular, any scanner you create has a nextLine method. (You might
    not use this nextLine method, but the method is available nonetheless.) When you
    use a scanner''s nextLine method, the method grabs everything up to the end of
    the current line of text. In Listing 8-2, a call to nextLine can read a whole
    line from the EmployeeInfo.txt file. In another program, a scanner''s nextLine
    can read everything the user types on the keyboard up to the pressing of the Enter
    key.


    Notice my careful choice of words: nextLine reads "up to the end of the current
    line." Unfortunately, what it means to read up to the end of the current line
    isn''t always what you think it means. Intermingling next, nextDouble, and nextLine
    can be messy. You have to watch what you''re doing and check your program''s output
    carefully.


