    out.println or its variants. What''s really going on when you call one of these
    methods?


    The thing called System.out is an object. The object is defined in the Java API.
    In fact, System.out is an instance of a class named java.io.PrintStream (or just
    PrintStream, to its close friends). Each object created from the PrintStream class
    has methods named print and println. Just as Account object in Listing 7-3 has
    a display method, and just as the DecimalFormat object in Listing 10-1 (over in
    Chapter 10) has a format method, so the PrintStream object named has print and
    println methods. When you call System.out, you''re calling a method that belongs
    to a PrintStream instance.'
