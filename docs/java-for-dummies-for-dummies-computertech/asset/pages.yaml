  md: 'Best of all, Java''s online API Specification, which describes all of Java''s
    standard identifiers, comes entirely from runs of the javadoc program on comments
    in Java code. There''s nothing arbitrary or haphazard about Java''s API Specification.
    The Specification is always in sync with the Java code.


    You can generate your web pages from the javadoc comments that you put in your
    code. From your IDE''s menu bar, select Tools or Project and look for a com-labeled
    Generate JavaDoc.


    # What''s Barry''s excuse?


    For years I''ve been telling my students to put comments in their code, and for
    years I''ve been creating sample code (like the code in Listing 3-1) with com-ments
    in it. Why?


    Three little: Know your audience. When you write complicated, real-life code,
    your audience is other programmers, information technology managers, and people
    who need help decipher what you''ve done. When I write simple samples of code
    for this book, my audience is you — the novice Java programmer. Rather than read
    my comments, your best strategy is to stare at my Java statements — the statements
    that Java''s compiler deciphers. That''s why I put so few comments in this book''s
    listings.


    Besides, I''m a little lazy.


    # Using comments to experiment / with your code


    You may hear programmers talk about commenting out certain parts of their code.
    When you''re writing a program and something''s not working correctly, it often
    helps to try removing some of the code. If nothing else, you find out what happens
    when suspicious code is removed. Of course, you may not like what happens when
    the code is removed, so you don''t want to delete the code completely. Instead,
    you turn your ordinary Java statements into comments. For instance, you turn the
    statement


    ```

    System.out.println("I love Java!");

    ```


    into the comment


    ```

    // System.out.println("I love Java!");

    ```'
