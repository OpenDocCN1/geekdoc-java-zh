- pgno: 398
  md: '# IN THIS CHAPTER


    +   » Hiding names from other classes


    +   » Exposing names to other classes


    +   » Tweaking your code to find the right middle ground


    # Chapter 14


    # Sharing Names among the Parts of a Java Program


    Our family''s neighborhood elementary school has a yearly tradition: Each spring,
    the students in fifth grade take a daylong field trip to Philadelphia. When my
    son was in fifth grade, I went along on the trip to Philadelphia to help supervise
    4 of the 20 children. While the 4 kids and I were touring the city''s historical
    sites, I misplaced the preplanned itinerary. I didn’t know where we were supposed
    to were supposed to go next. So, what could I do? I did what any good Philadelphia
    native would — I ignored the itinerary and took the kids to the nearest cheap
    restaurant. I treated them all to Philadelphia''s signature dish the fat-laden,
    greasy, Philadelphia cheesesteak.


    What could this story possibly have to do with Java? That''s simple. This chapter
    is about access — how one class''s code may gain access to another class''s code.
    My Philadelphia anecdote is about access, too. Shortly after the school trip,
    my son''s fifth grade teacher got wind of my shenanigans during the tour. Later,
    when my daughter was in fifth grade, the teacher said that I wasn''t welcome to
    take part in that year''s junket to Philadelphia. The teacher had revoked my access
    to those Philadelphia cheesesteaks.'
  merge: -1
  img_proc: true
- pgno: 399
  md: "# Access Modifiers\n\nObject-oriented programming is big on hiding details.\
    \ Programmers who write one piece of code shouldn't tinker with the details inside\
    \ another programmer's code. It's not a matter of security and secrecy — it's\
    \ a matter of safety. When you hide details, you prevent the intricacies inside\
    \ one piece of code from being twisted and broken by another piece of code. Your\
    \ code comes in nice, discrete, manageable lumps. You keep complexity to a minimum.\
    \ You make fewer mistakes. You save money. You help promote world peace.\n\nOther\
    \ chapters have plenty of examples of the use of private fields. When a field\
    \ is declared private, it's hidden from all outside meddling. This hiding enhances\
    \ modularity, minimizes complexity, and so on.\n\nElsewhere in the annals of Java\
    \ For Dummies, 8th Edition, are examples of things that are declared public. Just\
    \ like a public celebrity, a field that declared public is left wide open. Plenty\
    \ of people probably know what kind of toothpaste Elvis used, and any programmer\
    \ can reference a public field, even a field that's not named Elvis.\n\nIn Java,\
    \ the words public and private are called access modifiers. Don't you see fields\
    \ and methods without access modifiers in their declarations. A method or field\
    \ of this kind is said to have default access. Many examples in this book use\
    \ default access without making a big fuss about it. That's okay in some chapters,\
    \ but not in this chapter. In this chapter, I describe the nitty-gritty details\
    \ about default access.\n\nAnd you can find out yet another access modifier that\
    \ isn't used in any example before this chapter. (At least, I don't remember using\
    \ it in any earlier examples.) It's the protected access modifier. Yes, this chapter\
    \ covers some of the slimy, grimy facts about protected access.\n\n# Classes and\
    \ Their Members\n\nWith this topic, you can become all tangled in terminology,\
    \ so you need to get some basics out of the way. (Most of the terminology you\
    \ need comes from Chapters 7 and 10, but it's worth reviewing at the start of\
    \ this chapter.) Consider this chunk of Java code:\n\n```\npublic class MyClass\
    \ {\n    int myField;      //a field (a member)\n}\n```"
  merge: -1
  img_proc: true
- pgno: 400
  md: "```\nvoid myFunction() {\n//a method (another member)\n    int myOtherField;\
    \ //a method-local variable (NOT a member)\n}\n```\n\nThe comments on the right\
    \ side of the code tell the whole story. The code has two kinds of variables:\
    \ fields and method-local variables. This chapter isn't about method-local variables.\
    \ It's about methods and fields.\n\nBelieve me, carrying around the phrase methods\
    \ and fields wherever you go isn't easy. It's much better to give these things\
    \ one name and be done with it. That's why both methods and fields are called\
    \ members of a class.\n\nAt this point, you make an important distinction. Think\
    \ about Java's public key-word. You can put public in front of a member. For example,\
    \ you can write\n\n```\npublic static void main(String[] args) {\n\norublic int\
    \ amountInAccount = 5022;\n```\n\nYou can also put the public keyword in front\
    \ of a class. For example, you can write\n\n```\npublic class Drawing {\n    //\
    \ Your code goes here\n}\n```\n\nIn Java, the public keyword has two slightly\
    \ different meanings: one meaning for the members of a class and another meaning\
    \ for the classes themselves. Most of this chapter deals with the meaning of public\
    \ (and other keywords) for members. The last part of this chapter (appropriately\
    \ titled \"Access Modifiers for Java Classes\") deals with the meaning for classes.\n\
    \n# Public and Private Access for Members\n\nEach field is declared in a particular\
    \ class, belongs to that class, and is a member of that class. The same is true\
    \ of methods: Each method is declared in a particular class, belongs to that class,\
    \ and is a member of that class. You can use a certain"
  merge: -1
  img_proc: true
- pgno: 401
  md: "member name in a particular place in your code? To begin answering the question,\
    \ check whether that place is inside or outside the member's class:\n\n+   If\
    \ the member is private, only code that's inside the member's class can refer\
    \ directly to that member's name:\n\n```\nclass SomeClass {\n    private int myField\
    \ = 10;\n\nclass SomeOtherClass {\n    public static void main(String[] args)\
    \ {\n        var someObject = new SomeClass();\n\n        System.out.println(someObject.myField);\
    \ // This doesn't work.\n    }\n}\n```\n\n+   If the member is public, any code\
    \ running in the same Java virtual machine can refer directly to that member's\
    \ name:\n\n```\nclass SomeClass {\n    public int myField = 10;\n\nclass SomeOtherClass\
    \ {\n    public static void main(String[] args) {\n        var someObject = new\
    \ SomeClass();\n\n        System.out.println(someObject.myField); // This works.\n\
    \    }\n}\n```\n\nThroughout this chapter, I make claims such as the one in the\
    \ previous bullet. \"If a member is public, any code can refer directly to that\
    \ member's name.\" In fact, claims of this kind aren't entirely true. In this\
    \ chapter's last section, I describe Java's module feature. When two classes reside\
    \ in two different modules, the ability of one class to refer to the other class's\
    \ members doesn't automatically apply. For details, see the later section \"From\
    \ Classes Come Modules.\"\n\nFigures 14-1, 14-2, and 14-3 illustrate the ideas\
    \ in a slightly different way.\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_401_0.png)"
  merge: -1
  img_proc: true
