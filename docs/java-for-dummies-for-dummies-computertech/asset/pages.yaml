- pgno: 24
  md: 'language and another isn''t power — the difference is ease and appropriate-ness
    of use. That''s where the Java language excels.


    >> 1986: Bjarne Stroustrup (also at AT&T Bell Labs) develops C++.


    Unlike its C language ancestor, the language C++ supports object-oriented programming.
    This support represents a huge step forward. (See the next section in this chapter.)


    >> May 23, 1995: Sun Microsystems releases its first official version of the Java
    language.


    Java improves upon the concepts in C++. Java not only supports object-oriented
    programming but also enforces the use of object-oriented programming.


    Additionally, Java is a great general-purpose programming language. A program
    written in Java runs seamlessly on all major platforms, including Windows, Macintosh,
    and Linux. With Java, you can write scalable applications, build and explore databases,
    control handheld devices, and more. Within five years, the Java programming language
    has 2.5 million developers worldwide. (I know I have a commemorative T-shirt to
    prove it.)


    >> 2000: Java goes to school.


    In the US, the College Board announces that, starting in the year 2003, the Computer
    Science Advanced Placement exams will be based on Java.


    >> 2004: Java is the top language on the world-famous TIOBE Index, and stays on
    top for the next 15 years.


    >> 2004: Java goes into space!


    A robotic rover, named Spirit, runs Java code to explore Mars.


    >> 2010: Oracle Corporation purchases Sun Microsystems, bringing Java technology
    into the Oracle family of products.


    >> 2017: Oracle announces its plan to release new versions of Java every six months.


    Until then, new Java versions became available once every few years. But the release
    of Java 9 in September 2017 is followed by the rollout of Java 10 in March 2018.
    Up next is Java 11 in September 2018.


    In September 2021, Java 17 is a Long-term support (LTS) release. This means Oracle
    promises to keep Java running smoothly until at least September 2026. These LTS
    releases come every two years, so the next rock-solid, take-no-risters version
    of Java is Java 21 in September 2023.


    The new release cycle has injected energy into the evolution of the Java programming
    language.


    >> 2020: Java celebrates its 25th birthday.'
