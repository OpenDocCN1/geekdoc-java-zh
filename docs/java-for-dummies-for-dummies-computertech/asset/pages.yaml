    # Chapter 13


    # Looking GoodnWhen Things Take Unexpected Turns


    September 9, 1945: A moth flies into one of the relays of the Harvard Mark II
    computer and gums up the works. This becomes the first recorded case of real-life
    computer bug.


    April 19, 1957: Herbert Bright, manager of the data processing center at Westinghouse
    in Pittsburgh, receives an unmarked deck of computer punch cards in the mail (which
    is like receiving an unlabeled CD-ROM in the mail today). Mr. Bright guesses that
    this deck comes from the development team for FORTRAN — the first computer programming
    language. He''s been waiting a few years for this software. (No web downloads
    were available at the time.)


    Armed with nothing but this guess, Bright writes a small FORTRAN program and tries
    to compile it on his IBM 704. (The IBM 704 lives in its own, specially built,
    2000-square-foot room. With vacuum tubes instead of transistors, the machine has
    a whopping 32K of RAM. The operating system has to be loaded from tape after the
    running of each program, and a typical program takes between two and four hours
    to run.) After the usual waiting time, Bright''s attempt to compile a FORTRAN
    program comes back with a single error: a missing comma in one of the statements.
    Bright corrects the error, and the program runs like a charm.


    CHAPTER 13 Looking Good When Things Take Unexpected Turns 355'
