  md: 'When I write the code in Listing 9-3, the use of the final keyword isn''t absolutely
    necessary. But the final keyword provides some extra protection. When I format
    to "%%5.2f%%s\n", I intend to use this same format just as it is, over and over
    again. I know well that I don''t intend to change the format variable''s value.
    Of course, in a 10,000-line program, I can get confused and try to assign a new
    value to format somewhere deep down in the code. To prevent me from accidentally
    changing the format string, I declare the format variable to be final. It''s just
    good, safe programming practice.


