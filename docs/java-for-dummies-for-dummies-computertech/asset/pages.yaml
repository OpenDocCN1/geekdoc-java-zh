    # So many collection classes!


    The ArrayList class that I use in many of this chapter''s examples is only the
    tip of the Java collections iceberg. The Java library contains many classes, each
    with its own advantages. Table 12-1 contains an abbreviated list.


    Table 12-1 Some Collection Classes

    | Class Name | Characteristic |

    |---|---|n| ArrayList | A resizable array. |

    | LinkedList | A list of values, each having a field that points to the next one
    in the list. |

    | Stack | A structure that grows from bottom to top. The structure is optimized
    for access to the topmost value. You can easily add a value to the top or remove
    the value from the top. |

    | Queue | A structure that grows at one end. The structure is optimized for adding
    values to one end (the rear) and removing values from the other end (the front).
    |

    | PriorityQueue | A structure, like a queue, that lets certain (higher-priority)
    values move toward the front. |

    | HashSet | A collection containing no duplicate values. |

    | HashMap | A collection of key/value pairs.


    Each collection class has its own set of methods (in addition to the methods it
    inherits from AbstractCollection, the ancestor of all collection classes).


    > To find out which collection classes meet your needs, visit the Java API documentation
    pages at https://docs.oracle.com/en/java/javase/17/docs/api/java.base/java/util/doc-files/coll-overview.html.


