  md: "# To refer to my name, write\n\n```\nmyAccount.name\n```\n\nFor want of any\
    \ better terminology, this way of referring to an object's fields is called *dot\
    \ notation*.\n\nThen yourAccount.balance refers to the value in your object's\
    \ balance variable, and yourAccount.name refers to the value of your object's\
    \ name variable. To tell Java how much I have in my account, you can write\n\n\
    ```\nmyAccount.balance = 24.02;\n```\n\nTo display your name on the screen, you\
    \ can write\n\n```\nout.println(yourAccount.name);\n```\n\nThese ideas come together\
    \ in Listings 7-1 and 7-2. Here's Listing 7-1:\n\n# Listing 7-1: What It Means\
    \ to Be An Account\n\n```\npackage com.example.accounts;\n```\n\n```\npublic class\
    \ Account {\n  String name;\n  String address;\n  double balance;\n}\n```\n\n\
    The Account class in Listing 7-1 defines what it means to be an Account. In particular,\
    \ Listing 7-1 tells you that each of the *Account* class's instances has three\
    \ variables: name, address, and balance. This is consistent with the information\
    \ in Figure 7-1. Java programmers have a special name for variables of this kind\
    \ (variables that belong to instances of classes). Each of these variables — name,\
    \ address, and balance — is called a *field*.\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_172_0.png)\n\
    \nA variable declared inside a class but not inside any particular method is a\
    \ *field*. In Listing 7-1, the variables name, address, and balance are fields.\
    \ Another name for a field is an *instance variable*."
