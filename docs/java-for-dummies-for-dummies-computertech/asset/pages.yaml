  md: 'The instructions in Listing 2-3 run smoothly on Pentium processor. But these
    instructions mean nothing to a PowerPC processor. Likewise, the instructions in
    Listing 2-4 run nicely on PowerPC, but these instructions are complete gibberish
    to a computer with a Pentium processor. So your friend''s PowerPC software might
    not be available on your computer. And your Intel computer''s software might not
    run at all on your friend''s computer.


    Go to your cousin''s house. Your cousin''s computer has a Pentium processor (just
    like yours), but your cousin''s computer runs Windows instead of Linux. What does
    your cousin''s computer do when you feed it the Pentium in Listing 2-3? It screams,
    "Not a valid Win32 application" or "Windows can''t open this file.

    What a mess!


    Java bytecode creates order from all this. Unlike the code in Listings 2-3 and
    2-4, Java bytecode isn''t specific to one kind of processor or to a single operating
    system. Any kind of computer can have a Java virtual machine, and Java instructions
    run on any computer''s Java virtual machine. The JVM runs on a Pentium with Linux
    translates Java bytecode instructions into the kind of code you see in Listing
    2-3. And the JVM that runs on a PowerPC with Linux translates Java bytecode instructions
    into the kind of code you see in Listing 2-4. The same kind of translation takes
    place for modern processors, like the Intel i9 and the ARM M1.


    If you write a Java program and compile that Java into bytecode, the JVM on your
    computer can run the bytecode, the JVM on your friend''s computer can run the
    bytecode, and the JVM on your grandmother''s supercomputer can run the bytecode.


    For a look at some Java bytecode, see Listing 2-2. Remember: You never have to
    write or decipher Java bytecode. Writing bytecode is the compiler''s job. Deciphering
    bytecode is the Java virtual machine''s job.


    With Java, you can take a bytecode file that you created with a Windows computer,
    copy the bytecode to who-knows-what kind of computer, and then run the bytecode
    with no trouble. That is one of many reasons why Java has become so popular quickly.
    This outstanding feature, which gives you the ability to run code on many different
    kinds of computers, is called portability.


    What makes Java bytecode so versatile? This fantastic universality enjoyed by
    Java programs comes from the Java virtual machine. The Java virtual machine is
    one of those three tools that you must have on your computer.


