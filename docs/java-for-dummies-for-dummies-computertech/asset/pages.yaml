  md: 'Your IDE won''t offer to run the code in Listing 7-1. That''s because Listing
    7-1 has no main method. The run of every Java program must begin with the main
    method, so the code in Listing 7-1 has no starting point. To use the Listing''s
    Account class, your project must contain at least two Java files: one file with
    the code in Listing 7-1, and another file with a main method. In this chapter,
    Listing 7-2 has a handy-dandy main method, with the Account class in Listing 7-1
    won''t go to waste.


    But wait! You need to know any tidbit before you use the code in Listing 7-1.
    The listing begins with the line package `com.example.accounts`. That line says,
    "This file is one of possibly many files that are inside a grouping named `com.example.accounts."
    When a Java file belongs to such a grouping, the file must live in a specially
    named folder on your computer''s hard drive. This chapter''s "Package deal" sidebar
    has some details.


    # PACKAGE DEAL


    Java has a feature that lets you classes into groups. Each group of classes is
    called a package.


    The Java API defines about 4,500 classes. Each class belongs to one of about 220
    packages. When you import `java.util.Scanner`, you''re referring to a class named
    Scanner, which belongs to the package named `java.util`.


    But that''s not all! The Grouping doesn''t stop with packages. Packages can be
    lumped into bigger things called modules. Each package in the Java API belongs
    to one of about 70 different modules. When you import `java.util.Scanner`, you''re
    referring to something in the class named Scanner, which belongs to the package
    named `java.util`, which in turn belongs to the module named `java.base`.


    The Account class in Listing 7-1 belongs to a package that I named `com.example.accounts`.
    The first line in Listing 7-1 makes it so. That first line is called a package
    declaration.


    In the Java world, programmers customarily give packages long, dot-filled names.
    For Instance, because I''ve registered the domain name `allmycode.com`, I may
    name a package `allmycode.dummiesframe`. In truth, I can name a package almost
    anything I want—like `example.accounts`, `fish.and.chips`, or simply `burger`.
    In case, informative package names like `allmycode.dummiesframe` are better than
    silly names like `midnight.in.akron.or.do.run.this.code`


    (continued)


    CHAPTER 7 The Inside scOOP 161'
