    limp, gray, washed-out like and can no longer receive button clicks or keystrokes.


    Every component swing package has a requestFocus method. When you call requestFocus(),
    the component gets the privilege of receiving the user''s next input. For example,
    in Listing 16-1, the call TextField.requestFocus() says, "Even though the user
    may have just clicked the button, a cursor in the text field. In that field, the
    user can type another guess in the text field without clicking the text field."


