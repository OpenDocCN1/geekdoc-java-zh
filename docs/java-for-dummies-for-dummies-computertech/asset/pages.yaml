    # Some facts about potatoes


    Chapter 8 introduces input from a disk file, and along with that topic comes the
    notion of an exception. When you tinker with a disk file, you need to acknowledge
    the possibility of raising an IOException. That''s the lesson from Chapter 8,
    and that''s why the constructor in Listing 10-2 has a throws IOException clause.


    What about the main method in Listing 10-3? With no apparent reference to disk
    files in this main method, why does the method need its own throws IOException
    clause? Well, an exception is a hot potato. If you have one, you either have to
    eat it (as you can see in Chapter 13) or use a throws clause to toss it to someone
    else. If you toss an exception with a throws clause, someone else is stuck with
    the exception just where you were.


    The constructor in Listing 10-2 throws an Exception, but to whom is this exception?
    Who in this chain of code becomes the bearer of responsibility for the problematic
    IOException? Well, who called the constructor in Listing 10-2? It was the main
    method in Listing 10-3 — that''s called the TeamFrame constructor. Because the
    TeamFrame constructor throws its hot potato to the main method in Listing 10-3,
    the main method has to deal with it. As shown in Listing 10-3, the main method
    deals with it by tossing the Exception again (by)


