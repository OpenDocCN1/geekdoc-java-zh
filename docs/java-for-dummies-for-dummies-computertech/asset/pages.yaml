  md: "When you define an enum type, two things happen:\n\n+   You create values.\n\
    \nJust as 13 and 151 are int values, CELSIUS and FAHRENHEIT are TempScale values.\n\
    \n+   You can create variables to refer to those values.\n\nIn Listing 9-2, I\
    \ declare the fields number and scale. Just as\n\n```\ndouble number;\n\ndeclares\
    \ that a number variable is of type double;\n\nTempScale scale;\n```\n\n“To be\
    \ of type TempScale” means that you can have values CELSIUS, FAHRENHEIT, KELVIN,\
    \ and so on. So, in Listing 9-2, I can give the scale variable value FAHRENHEIT\
    \ (or TempScale.FAHRENHEIT, to be more precise).\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_249_0.png)\n\
    \nAn enum type is a Java class in disguise. That's why Listing 9-1 contains an\
    \ entire file devoted to one thing — namely, the declaration of an enum type (the\
    \ Temp-Scale type). Like the declaration of a class, an enum type declaration\
    \ belongs in a file all its own. The code in Listing 9-1 belongs in a file named\
    \ TempScale.java.\n\n# Okay, so then what is a temperature?\n\nEach temperature\
    \ consists of two things: a number and a temperature scale. The code in Listing\
    \ 9-2 makes this fact abundantly clear.\n\nLISTING 9-2: The Temperature Class\n\
    \n```\npackage com.example.weather;\n\npublic class Temperature {\n    private\
    \ double number;\n\n    private TempScale scale;\n\n    public Temperature() {\n\
    \        number = 0.0;\n        scale = TempScale.FAHRENHEIT;\n    }\n```\n\n\
