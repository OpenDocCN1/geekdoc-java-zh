    In imperative programming, a variable is a place where statements share their
    one with another. But functional programming shuns variables. So, when you do
    functional programming, you don''t have a lot of data sharing. Many of the difficulties
    associated with shared data vanish into thin air.


    Here''s an analogy: Imagine a programming problem as a cube, and then imagine
    an imperative programming solution as a way of slicing the cube into manageable
    pieces. (See the first sidebar figure.)


    It doesn''t fit easily, into squeeze it into one core. the cores, so...


