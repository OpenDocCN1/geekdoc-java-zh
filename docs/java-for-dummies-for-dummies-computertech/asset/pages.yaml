  md: '# Why is there so much static?


    Maybe you''ve noticed — the code in Listing 10-4 is overflowing with the word
    static. That''s because nearly everything in this code belongs to the entire PlayerPlus
    class and not to individual instances of the class. That''s good, something like
    playerCount (the number of players on the team) shouldn''t belong to individual
    players and having each PlayerPlus object keep track of its own count would be
    silly. ("I know how many players I am. I''m just one player") If you had nine
    individual playerCount fields, either field would store the number 1 (which is
    useless) or you would have nine different copies of the code, which is wasteful
    and prone to error. By making playerCount static, you''re keeping the playerCount
    in just one place, where it belongs.


    The same kind of reasoning holds for the totalAverages field will store the sum
    of the players'' batting averages. For all nine members of the Hankees, this adds
    up to .956. It''s not until someone calls the findTeamAverage or findTeamAverageString
    that the computer actually finds the overall Hankees batting average.


    You also need the methods findTeamAverage and findTeamAverageString to be static.
    Without the word static, there would be nine findAverage methods — one for each
    instance of the PlayerPlus class. This wouldn''t make much sense. Each instance
    would have to calculate totalAverages / playerCount on its own, and each of the
    nine calculations would yield the same answer.


    In general, any task that has instances in common (and that yields the same result
    for each instance) should be coded as a static method.


    Constructors are never static.


    # Meet the static initializer


    In Listing 10-4, the decFormat field is static. This makes sense because decFormat
    makes totalAverages / playerCount look nice, and both fields in the expression
    totalAverages / playerCount are static. Thinking more directly, the code needs
    only one thing for formatting numbers. If you have several numbers to format,
    the same decFormat that belongs to the entire class can format for each number.
    Creating a decFormat for each player is not only inconvenient but also wasteful.


    But declaring decFormat to be static presents a little problem. To set up the
    formatting, you have to call methods like decFormat.setMaximumIntegerDigits(0).'
