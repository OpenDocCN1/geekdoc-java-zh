  md: '# LISTING 15-7: What It Means to Be a House Pet


    The first line of Listing 15-7, the keyword abstract tells Java that HousePet
    is an abstract class. Because HousePet is an abstract class, HousePet can have
    an abstract method. And in Listing 15-7, howToCareFor is an abstract method. An
    abstract method has a header but no body. In an abstract method''s declaration,
    there are no curly braces — only a semicolon where curly braces would normally
    appear.


    So, when you execute the howToCareFor method, what happens? Well, you can''t really
    execute the howToCareFor method in Listing 15-7. In fact, you can''t even create
    an instance of the abstract class declared in Listing 15-7. The following lines
    of code are illegal:


    ```

    // VERY BAD CODE:

    HousePet myPet = new HousePet("Boop", 12.0, "Meow");

    var yourPet = new HousePet("Paws", 22.5, "Woof");

    ```


    An abstract class has no life of its. To use an abstract class, you have to create
    an ordinary (non-abstract) class that extends the abstract class. In the ordinary
    class, all methods have bodies. So works out.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_435_0.png)


