  md: 'When you look over Listing 6-1, you see the code that does all this work. The
    core of the code is a thing called a while statement (also known as a while loop).
    Rephrased in English, the while statement says:


    ```

    while the input is not equal to the randomNumber

    keep doing all the stuff in curly braces: {


    }

    ```


    The stuff in curly braces (the stuff that repeats) is the code that prints again
    and Enter an int ..., gets a value from the keyboard, and adds 1 to the count
    of the user''s guesses.


    When you''re dealing with counters, like numGuesses in Listing 6-1, you may become
    confused and be off by 1 in either direction. You can avoid this headache by making
    sure that the ++ statements stay close to the statements you''re counting. For
    example, in Listing 6-1, the variable numGuesses starts with a value of 0. That''s
    because, when the program starts running, the user hasn''t made any guesses. Later
    in the program, after each call to keyboard, nextInt, is a numGuesses++ statement.
    How do you do it — you increment the counter as the user enters another guess.


    The statements in curly braces are repeated as long as inputNumber != randomNumber
    is true. Each repetition of the statements in the loop is called an iteration
    of the loop. The loop undergoes three iterations. If you don''t believe Figure
    6-1 has exactly three iterations, count the number Try again prints in the program''s
    output. A Try again appears for each incorrect guess.


    When last, the user enters the correct guess, the computer goes back to the top
    of the while statement, checks the condition in parentheses, and finds itself
    in double double-negative logic. The not equal (!=) relationship between inputNumber
    and randomNumber no longer holds. In other words, the state-condition, inputNumber
    != randomNumber, is false. Because the while statement''s condition is false,
    the computer jumps past the while loop and goes to the statements just below the
    while loop. In these two statements, the computer prints You win after four guesses.


    With code the kind shown in Listing 6-1, the computer never jumps out in mid-loop.
    When the computer finds that inputNumber isn''t equal to randomNumber, the computer
    matches and executes all five statements inside the loop''s curly braces. The
    computer performs the test again (to see whether inputNumber is still not equal
    to randomNumber) only after it executes all five statements in the loop.


