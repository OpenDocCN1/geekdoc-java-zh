  md: "This change keeps the Java compiler from seeing the code while you try to figure\
    \ out what's wrong with your program.\n\nTraditional comments aren't very useful\
    \ for commenting out code. The big prob-blem is that you can't put one traditional\
    \ comment inside of another. Suppose that you want to comment out the following\
    \ statements:\n\n```\nSystem.out.println(\"Parents,\");\nSystem.out.println(\"\
    pick your\");\n/*\n * Intentionally displays on four separate lines\n */\nSystem.out.println(\"\
    battles\");\nSystem.out.println(\"carefully!\");\n```\n\nIf you try to turn this\
    \ code into one traditional comment, you get the following mess:\n\n```\nSystem.out.println(\"\
    Parents,\");\nSystem.out.println(\"pick your\");\n/*\n * Intentionally displays\
    \ on four separate lines\n */\nSystem.out.println(\"battles\");\nSystem.out.println(\"\
    carefully!\");\n```\n\nThe first /* (after Intentionally displays) ends the traditional\
    \ comment pre-maturely. Then the battles and carefully statements aren't commented\
    \ out, and the last /*/ chokes the compiler. You can't nest traditional comments\
    \ inside one another. Because of this, I recommend end-of-line comments as tools\
    \ for experimenting with your code.\n\nMost IDEs can comment out sections of your\
    \ code for you automatically. From your IDE's menu bar, select Code or Source\
    \ and look for menu items pertaining to comments.\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_67_0.png)"
