- pgno: 23
  md: 'Writing computer code is a big, worldwide industry. Companies do it, freelance
    professionals do it, hobbyists do it — all kinds of people do it. A typical big
    company has teams, departments, and divisions that write programs for the company.
    But you can write programs for yourself or for someone else, for a living or for
    free. In a recent estimate, the number of lines of code written each day by programmers
    in the world exceeds the number of methane molecules on the planet Jupiter.**
    Take almost anything that can be done with a computer — with the right amount
    of time, you can write your own program to do it. (Of course, the “right amount
    of time” may be quite long, but that’s not the point. Many interesting and useful
    programs can be written in hours or even minutes.


    # # Gaining Perspective: Where Java Fits In


    Here''s a brief history:


    +   * **1954-1957: FORTRAN is developed.**


    FORTRAN was the first modern computer programming language. For scientific programming,
    FORTRAN is a real racehorse. Year after year, FORTRAN is a leading language among
    computer programmers throughout the world.


    +   * **1959: Grace Hopper at Rand develops the COBOL programming language.**


    The letter B in COBOL stands for *Business*, and business is just what COBOL is
    all about. The language’s primary feature is the processing of one record after
    another, one customer after another, or one employee after another.


    Within a few years after its initial development, COBOL became the most widely
    used language for business data processing.


    +   * **1972: Dennis Ritchie at AT&T Bell Labs develops the C programming language.**


    The “look and feel” that you see in this book’s examples comes from the C programming
    language. Code written in C uses curly braces, if statements, for statements,
    and other elements.


    In terms of power, you can use C to solve the same problems that you can solve
    by using FORTRAN or Java or any other modern programming language. (You can write
    a scientific calculator program in COBOL but doing that sort of would feel quite
    strange.) The difference between one programming


