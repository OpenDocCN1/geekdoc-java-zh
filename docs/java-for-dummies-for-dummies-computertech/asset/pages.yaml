- pgno: 21
  md: 'The neat thing about computers is that they carry ideas efficiently. They carry
    nothing but the ideas, a couple of photons, and some electrical power. They do
    this with no muss, no fuss, and no extra physical baggage.


    When you start dealing efficiently with ideas, something very nice happens: Suddenly,
    all overhead is gone. Instead of pushing paper and trees, you''re pushing numbers
    and concepts. Without the overhead, you can do things much faster and do things
    that are far more complex than ever.


    # # What You Can Do with Java


    It would be nice if all this complexity were free, but unfortunately, it isn''t.
    Some-one has to think hard and decide exactly what to ask the computer to do.
    After that thinking takes place, someone has to write a set of instructions for
    the computer to follow.


    Given the current state of affairs, you can''t write these instructions in English
    or any other language that people speak. Science fiction is filled with stories
    about people who make simple requests of robots and get back disastrous, unexpected
    results. English and other such languages are unsuitable for communication with
    computers, for several reasons:


    +   - An English sentence can be misinterpreted. "Chew one tablet three times
    a day until finished."


    +   - It''s difficult to weave a complicated command in English. "Join flange
    A to B, making sure to connect only the outermost fluff of flange A to the larger
    end of the protuberance B while joining the middle and inner lines of flange A
    to grommet C."


    +   - An English sentence has lots of extra baggage. "Sentence has unneeded words."


    +   - English can be difficult to interpret. "As part of this Publishing Agreement
    between John Wiley & Sons'
