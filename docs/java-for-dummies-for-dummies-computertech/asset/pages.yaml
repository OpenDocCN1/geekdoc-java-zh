- pgno: 30
  md: '# SuperClass Parent


    The house class is the super class of the three-bedroom house class, the parent
    class of the three-bedroom house class, the superclass of the four-bedroom house
    class, the parent class of the four-bedroom house class again.


    house class


    # Subclass Child


    # Subclass Child


    three-bedroom house class


    four-bedroom house class


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_30_0.png)


    FIGURE 1-1: Terminology in object-oriented programming.


    The three-bedroom house class extends the house class, inherits the features of
    the house class, is a subclass of the house class, is a child class of the house
    class.


    The four-bedroom house class extends the house class, inherits the features of
    the house class, is a subclass of the house class, is a child class of the house
    class.


    The original house class is called the superclass of the three- and four-bedroom
    house classes. In that vein, the three- and four-bedroom house classes are subclasses
    of the original house class. Put another way, the original house class is called
    the parent class of three- and four-bedroom house classes. The three- and four-bedroom
    house classes are child classes of the original house class. (Refer to Figure
    1-1)


    Needless to say, your homebuilder colleagues are jealous. A crowd of homebuilders
    is mobbing around you to hear about your great ideas. So, at that moment, drop
    one more bombshell: "By creating a class with subclasses, we can reuse the blueprint
    in the future. If someone comes along and wants a five-bedroom house, we can extend
    our original house blueprint by making a five-bedroom house blueprint. We''ll
    never have to spend money for an original house blueprint again."


    "But," says a colleague in the back row, "what happens if someone wants a different-floor
    design? Do we trash the original house blueprint or start scribbling all over
    the original blueprint? That''ll cost big bucks, won''t?"


    In a confident tone, you reply, "We don''t have to mess with the original blueprint.
    If someone wants a Jacuzzi in their living room, we can make a small blueprint
    describing only the new living room and call it the Jacuzzi-living-room house
    blueprint. Then this new blueprint can refer to the original house blueprint for
    info on the rest of the house (that part''s not in the living room). In the language
    of object-oriented programming, the Jacuzzi-in-living room house blueprint still
    extends the original house blueprint. The Jacuzzi blueprint is still a subclass
    of the original house blueprint. In fact, all the terminology about superclass,
    parent class, and child class still applies. The only thing''s'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'new is that the Jacuzzi blueprint overrides the living room features in the
    house blueprint.


    # # Objects and classes are everywhere


    When you program in Java, you work constantly with classes and objects. These
    two ideas are vitally important. That''s why, in this chapter, I hit over your
    head with one analogy after another about classes and objects.


    Close your eyes for a minute and think about what it means for an item to be a
    chair:


    A chair has a seat, a back, and legs. Each seat has a shape, a color, a degree
    of softness, and other characteristics. These are the properties that a chair
    possesses. What I describe as chairness — the notion of an item being a chair.
    In object-oriented terminology, I''m describing the Chair class.


    Now peek over the edge of this book''s margin and take a minute to look around
    the room. (If you''re not sitting in a chair right now


    Several chairs are in the room, and each chair is an object. Each of these objects
    is an example of ethereal thing called the Chair class. So that''s how it works
    — the class is the idea of chairness, and each individual chair is an object.


    > A class isn''t quite a collection of things. Instead, a class is the idea behind
    a kind of thing. When I talk about the class of chairs in your room, I''m talking
    about the fact that each chair has legs, a seat, a color, and so on. The colors
    may be different for different chairs in the room, but that doesn''t matter. When
    you talk about a class of things, you''re focusing on the properties of that class
    which possesses.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_31_0.png)


    It makes sense to think of an object as being a concrete instance of a class.
    In fact, the official terminology is consistent with this line of thinking. If
    you write a Java program in which you define a Chair class, each actual chair
    (the chair you''re sitting on, the empty chair next to you, and so on) is called
    an instance of the Chair class.'
