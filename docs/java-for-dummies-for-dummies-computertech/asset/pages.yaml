  md: "# LISTING 17-4: (continued)\n\n```\ntry (Connection conn = DriverManager.getConnection(CONNECTION);\n\
    \     Statement statement = conn.createStatement() {\n\n     statement.executeUpdate(\"\
    drop table ACCOUNTS\");\n     System.out.println(\"ACCOUNTS table dropped.\");\n\
    \ } catch (SQLException e) {\n     System.out.println(e.getMessage());\n }\n```\n\
    \nWhen you run this code, you wipe the slate clean. Your AccountDatabase.db file\
    \ no longer contains an ACCOUNTS table. So, if you want to run Listing 17-1 again\
    \ (perhaps with a change or two), you can.\n\nWho knows? You may even create a\
    \ table to store your favorite Java For Dummies jokes.\n\nNaturally, I have some\
    \ things for you to try:\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_473_0.png)\n\
    \n# HIGH ROLLERS ONLY\n\nRerun the code in Listing 17-3. This time, use the following\
    \ string in the execute-Query call:\n\n> \"select * from ACCOUNTS where BALANCE\
    \ > 30\"\n\n# WATCH YOUR PRIMARY KEY\n\nRun the AddData program (from Listing\
    \ 17-2) two times in a row without modify-ing of the program's code. What error\
    \ messages do you see? Why?\n\n# NOT TOO TAXING\n\nCreate a table containing three\
    \ columns: an item name, a price, and a tax rate. Store data in several rows of\
    \ the table.\n\nRetrieve the data from the table and display a row of output for\
    \ each row in the table. Each row of output contains the item name followed by\
    \ the price with tax added. For example, if an item's price is $10 and the item's\
    \ tax rate is 0.05 (mean-5 percent), the item's output row contains the number\
    \ $10.50."
