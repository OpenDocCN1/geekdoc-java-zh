    \ also implements the Deletable interface. When you delete a column of numbers,\
    \ you set the values of each of its entries to 0. 0.\n\n# TWO KINDS OF METHODS\n\
    \nInside an interface declaration, any method without a body is called an abstract\
    \ method. If you run java 8 or later, you can also put methods with bodies inside\
    \ an interface declaration. A method with a body is called a default method. In\
    \ an interface's code, each default method declaration starts with the default\
    \ method keyword:\n\n```\npublic interface MyInterface {\n\n    void method1();\n\
    \n    default void method2() {\n        System.out.println(\"Hello!\");\n    }\n\
    }\n```\n\nIn MyInterface, method1 is an abstract method, and method2 is a default\
    \ method. If you create a class that implements MyInterface, like so:\n\n```\n\
    class MyClass implements MyInterface\n```\n\nthen your newly declared MyClass\
    \ must declare its own method1 and provide a body for method1. Optionally, your\
    \ MyClass may declare its own method2. If MyClass doesn't declare its own method2,\
