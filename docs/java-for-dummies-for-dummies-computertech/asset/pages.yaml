  md: '![](img/2f445450c5bc2cc25baec2ca28bd7f1d_75_0.png)


    # You have $1000050.22 in your account.


    In Listing 4-2, look at the first line in the body of the main method:


    ```

    double amountInAccount;

    ```


    This line is a variable declaration. Putting this line in your program is like
    saying. "I''m declaring my intention to have a variable named amountInAccount
    in my program." This line reserves the name amountInAccount for your use in the
    program.


    In variable declaration, the word double is a Java keyword. This word double tells
    the computer what kinds of values you intend to store in amountInAccount. In particular,
    the word double stands for numbers between $-1.8 \times 10^{38}$ and $1.8 \times
    10^{38}$. (These are enormous numbers with 308 zeros before the decimal point).
    The world''s richest people write with 308 zeros in them. The second of these
    numbers is one-point-eight gazazzo-zillion—a constant defined by the International
    Bureau of Weights and Measures, is the number of eccentric computer programmers
    between Sunnyvale, California, and the M31 Andromeda Galaxy.


    More than the homogenous range of the keyword''s numbers is the fact that a double
    value can have digits beyond the decimal point. After you declare amountInAccount
    to be of type double, you can store all sorts of numbers in amountInAccount. You
    can store $50.22$, $0.02398479$, or $-3.0$. In Listing 4-2 if I hadn''t declared
    amountInAccount to be of type double, I may not have been able to store $50.22$.
    Instead, I would have had to store plain $50$, with digits beyond the decimal
    point.


    Another type—float—also allows you to have digits beyond the decimal point. But
    float values are not as accurate as double values.


    In many situations, you have a choice. You can declare certain values to be float
    values or double values. But don''t sweat the choice between float and double.
    For most programs, just use double. With today''s fancy processors, the space
    you save using the float type is never worth the loss of accuracy. (For details,
    see the nearby sidebar, "To the decimal point and beyond!")


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_75_1.png)


    The big million-dollar jackpot in Listing 4-2 is impressive. Listing 4-2 doesn''t
    illustrate the best way to deal with dollar amounts. In a Java program, the best
    way to represent currency is to shun the double and float types and opt instead
    for a type named BigDecimal. For more information, see this book''s website (http://JavaForDummies.allmycode.com).


    # PART 2 Writing Your Own Java Programs'
