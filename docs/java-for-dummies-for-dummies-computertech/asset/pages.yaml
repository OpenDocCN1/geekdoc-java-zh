    which displays Thank you for playing.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_117_0.png)


    The condition in an if statement must be enclosed in parentheses. However, a line
    like if (inputNumber == randomNumber) is not a complete statement (just as as
    "If I have a hammer" isn''t a complete sentence). So, this line if (inputNumber
    = randomNumber) shouldn''t end with a semicolon.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_117_1.png)


    Sometimes, when I''m writing about a condition that''s being, I slip into using
    the word expression instead of condition. That''s okay because every condition
    is an expression. An expression is something that has a value, and sure, every
    condition has a value. The condition''s value is either true or false. (For revealing
    information about expressions and values like true and false, Chapter 4.)


    # Equal, equal


    In Listing 5-1, in the if statement''s condition, notice the use of the double
    equal sign. Comparing two numbers to see whether they isn''t the same as setting
    equal to something else. That''s the symbol to compare for equality isn''t the
    same as the symbol that''s used in an assignment or an initialization. In an if
    statement''s condition, you can''t replace the double equal sign with a single
    equal sign. If you do, your program just won''t work. (You almost always get an
    error message when you try to compile your code.)


    On the other hand, if you never make the mistake of using a single equal sign
    in a condition, you''re not normal. Not long ago, while I was teaching an introductory
    Java course, I promised that I''d swallow my laser pointer if no one made the
    single equal sign mistake during any of the lab sessions. This wasn''t an idle
    promise. I''d never have to keep it. As it turned out, even if I had ignored the
    first ten times anybody made the single equal sign mistake during those lab sessions,
    Everybody mistakenly uses the single equal sign several times in a programming
    career.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_117_2.png)


    The trick is to avoid making the single-equal-sign mistake; the trick is to catch
    the mistake whenever you make it.


