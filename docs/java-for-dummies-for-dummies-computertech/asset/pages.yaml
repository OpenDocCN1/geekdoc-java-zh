  md: '+   The name of a class within package


    +   An asteriskisk (indicating all classes within that package)


    For example, the declaration


    ```

    import java.util.Scanner;

    ```


    is valid because java.util is the name of a package in the Java API, and Scanner
    is the name of a class in the java.util package. The dotted java.util.Scanner
    is called the fully qualified name of the Scanner class. A''s fully qualified
    name includes the name of the package in which the class is defined. (You can
    find out all this stuff about Java.util and Scanner by reading Java''s API documentation.
    For tips on reading the documentation, see Chapter 3 and this book''s website.)


    Here''s another example. The declaration


    ```

    import java.swing.*;

    ```


    is valid because java code, swing is the name of a package in the Java API, and
    the asterisk refers to all classes in the javax.swing package. With this import
    declaration at the top of your java code, you can use abbreviated names for classes
    in the javax.swing package — like JFrame, JButton, JMenuBar, JCheckBox, and many
    others.


    Here''s one more example. A line


    ```

    import java.*;; //Bad!

    ```


    is not a valid import. declaration. The Java API has no package with the one-word
    name java. You might think this line allows you to abbreviate all names beginning
    with java (names like JFrame, swing, sound.midi), and java), but that''s not the
    way the import works. Because java isn''t the name of a package, the line import
    java.* just angers the Java compiler.


    After this fuss about packages, you may wonder what difference it makes that you
    is in one package or another. For some insight, see Chapter 14.


