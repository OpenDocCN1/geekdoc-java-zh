  md: 'Every Java class is a reference type. If you declare a variable to have some
    type that''s not a primitive type, the variable''s type is (most of the time)
    the name of a Java class.


    Now, when you declare a variable to have type int, you can visualize what that
    declaration means in a fairly straightforward way. It means that, somewhere inside
    the computer''s memory, a storage location is reserved for that variable''s value.
    In the storage location is a bunch of bits. The arrangement of the bits ensures
    that a certain number is represented.


    That explanation is fine for primitive types like int or double, but what does
    it mean when you declare a variable to have a reference type? What does it mean
    to declare variable myFrame be of type JFrame?


    Well, what does it mean to declare i thank You God to be an E. E. Cummings poem?
    What would it mean to write the following declaration?


    ```

    EECummingsPoem ithankYouGod;

    ```


    Means that a class of things is EECummingsPoem, and ithankYouGod refers to an
    instance of that class. In other words, ithankYouGod is an object belonging to
    the EECummingsPoem class.


    Because JFrame is a class, you can create objects from that class. (If you don''t
    believe me, read some of my paragraphs about classes and objects in Chapter 1.)
    Each object (each instance of the JFrame class) is an actual frame — a window
    that appears on the screen when you run the code in Listing 4-6. By declaring
    the variable myFrame to be of type JFrame, you''re reserving the use of the name
    myFrame. This reservation tells the computer that myFrame can refer to an instance
    one of the windows that appears on the computer screen. Figure 4-11 illustrates
    the situation.


    When you declare ClassName variableName, you''re saying that a certain variable-can
    refer to an instance of a particular class.


    In Listing 4-6, the phrase myFrame reserves the use of the name myFrame. On that
    same line of code, the new JFrame() creates a new object (an instance of the JFrame
    class). Finally, that line''s equal sign makes myFrame refer to the new object.
    Knowing that the two words new JFrame() create an object can be vitally important.
    For a more thorough explanation of objects, see Chapter 7.'
