    \ 1s are the only things computers can deal with. When you think a computer is\
    \ storing the letter J, it is really storing 01001010. Everything inside the computer\
    \ is a sequence of 0s and 1s. As every computer knows, a 0 or 1 is called a bit.\n\
    \nAs it turns out, the sequence 01001010, which stands for the letter J, can also\
    \ stand for the number 74. The same sequence can also stand for 1.0369608636003646×10⁴³..\
    \ In fact, if the bits are interpreted as screen pixels, the same sequence can\
    \ be used to represent the dots shown in Figure 4-4. The meaning of 01001010 depends\
