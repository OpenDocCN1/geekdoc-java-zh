  md: 'These days, I know why I saw that error message so often. I can even make the
    message occur, if I want. But I still feel a little shiver whenever I see this
    message on my screen.


    Before you can understand why the message occurs and how to fix the problem, you
    need to get some terminology under your belt. If a field or method isn''t static,
    it''s called nonstatic. (Real surprising, hey?) Given that terminology, you have
    at least two ways to make the dreaded message appear:


    +   > PutClass.nonstaticThing somewhere in your program.

    > PutnonstaticThing somewhere inside a static method.


    In either case, you''re getting yourself into trouble. You''re taking something
    that belongs to an object (the nonstatic thing) and putting it in a place where
    no objects are in.


    Take, for instance, the first of the two situations I described above. To see
    this calamity in action, go back to Listing 10-5. Toward the end of the listing,
    change player.getName() to Player.getName does the trick. What could Player.getName
    possibly mean? If anything, the expression Player.getName means "Call the getName
    method belongs to the entire Player class." But back at Listing 10-1. The getName
    method isn''t static. Each instance of the Player (or PlayerPlus) class has a
    getName method. None of the getName methods belongs to the entire class. So the
    call Player.getName makes no sense. (Maybe the computer is pulling punches when
    it displays the offensive comment could be referenced... message. Perhaps a harsh,
    nonsensical exception message would be more fitting.)


    For a taste of the second situation (in the bullet list earlier in this section),
    go back to Listing 10-4. While no one''s looking, quickly remove the word static
    from the declaration of the decFormat field (near the top of the listing). Removal
    turns decFormat into a nonstatic field. Suddenly, each player on the team has
    a separate decFormat field.


    Well, things are hunky-dory until the computer reaches the findTeamAverageString
    method. That static method has four decFormat. SuchAndSuch statements in it. Once
    again, you''re forced to ask what a statement of this kind could possibly mean.
    Method findTeamAverageString belongs to no instance in particular (The method
    is static, so the entirePlayerPlus class has one findTeamAverageString method.)
    But with the way you''ve just busted the code, plain decFormat without reference
    to a particular object has no meaning. So again, you''re referencing the nonstatic
    field, decFormat, from inside a static method''s context. For shame, for shame!


    # CHAPTER 10 Putting Variables and Methods Where They Belong


