  md: 'ten accounts, dial a million phone numbers, or whatever. Because counting loops
    is common in programming, the people who create programming languages have developed
    statements just for loops of this kind. In Java, the statement that repeats something
    certain number of times is called a *for* statement. Listings 6-2 and 6-3 illustrate
