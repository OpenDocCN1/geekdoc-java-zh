    To get the most out of a four-core processor, you divide your code into four pieces
    — one for each core. But with imperative programming, your program''s pieces don''t
    fit neatly into your processor''s cores. The figure shows what happens when you
    try to squeeze an imperative program into a multicore processor.


    Functional programming also divides code into pieces, but it does so along different
