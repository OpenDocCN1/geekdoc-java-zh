  md: "# HOW TO CHEAT: ENUM TYPES\nAND SWITCHES\n\nListings 9-2 and 9-3 contain long-winded\
    \ names such as TempScale.FAHRENHEIT\\and TempScale.CELSIUS. Names as FAHRENHEIT\
    \ and CELSIUS belong to my\nTempScale type (the type defined in Listing 9-1).\
    \ These names have no meaning out-\nside my TempScale context. (if you think you'm\
    \ being egotistical with this \"no meaning\noutside of my context\" remark, try\
    \ deleting the TempScale.part of TempScale.\nFAHRENHEIT in Listing 9-2. Suddenly,\
    \ java tells you that your code contains an error.)\n\nJava is normally fussy\
    \ about type names and dots. But when they created enum types,\nt makers of java\
    \ decided that enum types in switch statements and expressions\ndeseserved special\
    \ treatment. You can use an enum value to decide which case to execute\na switch\
    \ statement or switch expression. When you do this, you don't use the enum\ntype\
    \ name in the case expressions. For example, the following java code is:\n\n```\n\
    TempScale scale = TempScale.RANKINE;\nchar letter =\nwitch (scale) {\n    case\
    \ CELSIUS -> 'C';\n    case KELVIN -> 'K';\n    case RANKINE, REAMUR, ROMER ->\
    \ 'R';\n    default -> 'X';n}\n```\n\nIn the first line of code, I write TempScale.RANKINE\
    \ because this first line isn't inside a\nwitch. But in the next several lines\
