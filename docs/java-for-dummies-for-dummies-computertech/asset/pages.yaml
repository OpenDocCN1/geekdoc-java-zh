    Java Community Process (JCP). Unlike the names you create, those in the API are
    distributed with every version of Java. (I''m assuming that you, the reader, are
    not a participant in the Java Community Process. With, but a fine book like Java
    For Dummies, 8th Edition, never knows.)


    If you''re interested in the JCP''s activities, visit www.jcp.org.


    The folks at the JCP don''t keep the Java programs in the official Java API a
    secret. If you want, you can look at all these programs. When you install Java
    on your computer, the installation puts a file named src. zip on your hard drive.
    You can open src.zip with your favorite unzipping program. There, before your
    eyes, is all the Java API code.


    # The words in a Java program


    A hard-core Javater will say that the Java programming language has four kinds
    of words: keywords, restricted keywords, literals, and identifiers. This is true.
    But the bare truth, with no other explanation, isn''t useful. So, I press a truth
    bit by thinking in terms of three kinds of words: keywords, identifiers that ordinary
    programmers like you and I create, and identifiers from the API.


    The differences among these three kinds of words are similar to the differences
    among words in the English language. In the sentence "Sam is a person," the word
    person is like a Java keyword. No matter who uses the word person, the word'
