  md: "# # Returning a result\n\nYou must fix the problem that the code in Listing\
    \ 10-10 poses. After all, a young baby Kermogoons can't go through life untracked.\
    \ To record this baby's existence, you have to add 1 to the value of the smackoverARpop\
    \ variable. You can do this in plenty of ways, and the way presented in Listing\
    \ 10-11 isn't the simplest. Even so, the way shown in Listing 10-11 illustrates\
    \ a point: Returning a value from a method call can be an acceptable alternative\
    \ to parameter passing. Look at Listing 10-11 to see what I mean.\n\n# LISTING\
    \ 10-11: This Program Works\n\n```\npublic class TrackPopulation2 {\n\n    public\
    \ static void main(String[] args) {\n        int smackoverARpop = 2232;\n\n  \
    \      smackoverARpop = birth(smackoverARpop);\n        System.out.println(smackoverARpop);\n\
    \    }\n\n    static int birth(int cityPop) {\n        return cityPop + 1;\n \
    \   }\n}\n```\n\nAfter running the code in Listing 10-11, the number you see on\
    \ your computer screen is the correct number: 2,233.\n\nThe code in Listing 10-11\
    \ has no new features in it (unless you call working correctly a new feature).\
    \ The most important idea in Listing 10-11 is the return statement, which also\
    \ appears in Chapter 7. Even so, Listing 10-11 presents a nice contrast to the\
    \ approach in Listing 10-10, which had to be discarded.\n\n# # Pass by reference\n\
    \nIn the previous section or two, I take great pains to emphasize a certain point\
    \ — that when a parameter has one of the eight primitive types, the parameter\
    \ is passed by value. If you read this, you probably missed the emphasis on the\
    \ parameter's having one of the eight primitive types. The emphasis is needed\
    \ because passing objects (reference types) doesn't quite work the same way.\n\
