    Run of the code in Figure 4-15.


    Are you trying to decide between using preincrement or postincrement? Try no longer.
    Most programmers use postincrement. In a typical Java program, you often see things
    like numberOfBunnies++. You seem things like ++numberOfBunnies.


    In addition to preincrement and postincrement, Java has two operators use --.
    These operators are both predecrement and postdecrement:


    +   **With preincrement(--numberOfBunnies), the computer subtracts 1 from the
    variable''s value before the variable is used in the rest of the statement.


    +   **With postdecrement(numberOfBunnies--), the computer subtracts 1 from the
    variable''s value after the variable is used in the rest of the statement.


    # STATEMENTS AND EXPRESSIONS


    You can describe the pre- and postincrement and pre- and postdecrement operators
    in two ways: the way everyone understands them and the right way. The way that
    I explain the concept in mind of this section (in terms of time, with before and
    after) is the way that everyone understands it. Unfortunately, the way everyone
    understands the concept isn''t the right way. When you see ++ or --, you can think
    in terms of sequence, but occasionally a programmer uses ++ or -- in a convoluted
    way, and the notions of before and after break down. So, if you''re ever in a
    tight spot, think about these operators in terms of statements and expressions.


    Remember that a statement tells the computer to do something, and an expression
    has a value. (I discuss statements in Chapter 3, and I describe expressions else-where
    in this chapter.) Which category does numberOfBunnies++ belong to? The Java code
    numberOfBunnies++ is both a statement and an expression.


    Assume that, before the computer executes the code out.println(numberOfBunnies),
    the value of numberOfBunnies is 28:


    +   As a statement, numberOfBunnies++ tells the computer to add 1 to numberOfBunnies.


    +   As an expression, the value of numberOfBunnies++ is 28, not 29.


