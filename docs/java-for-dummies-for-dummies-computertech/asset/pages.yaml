- pgno: 390
  md: 'The important part of Listing 13-9 is in the cutCheck method header. That header
    ends with throws FileNotFoundException. By announcing that it throws a FileNotFoundException,
    methodCheck passes the buck. What this throws really says, "I realize that a statement
    inside this method has the potential to throw a FileNotFoundException, but I''m
    not acknowledging the exception in a try-catch statement. Java compiler, don''t
    bug me about this. Instead of having a try-catch statement, I''m passing the responsibility
    for acknowledging the exception to the main method (the method called the cutCheck
    method)."


    Indeed, in the main method, the call to cutCheck is inside a try clause. That
    clause has a catch clause with a parameter of type FileNotFoundException. So everything
    is okay. MethodCheck passes the responsibility to the main method, and the main
    method accepts the responsibility with an appropriate try-catch statement. Everybody''s
    happy. Even the Java compiler is


    To better understand the throws clause, imagine a volleyball game in which the
    volleyball is an exception. When a player on the other team serves, player is
    throwing the exception. The ball crosses the net and heads directly toward you.
    If you pound the ball back across the net, you''re catching the exception. But
    if you pass the ball to another player, you''re using the throws clause. In essence,
    you''re saying, "Here, other player — you deal with this exception."


    A statement in a method can throw an exception that''s not matched by a catch
    clause. This includes situations in which the statement throwing the exception
    isn''t even inside a try block. When this happens, execution of the program jumps
    out of the method that contains the offending statement. Execution jumps back
    to whatever code called in the first place.


    > REMEMBER


    A method can name more than one exception type in its catch clause. Just use commas
    to separate the names of the exception types, as in the following:


    ```

    throws FileNotFoundException, NumberFormatException, ArithmeticException

    ```


    # Checked or unchecked?


    Sneak a peek at Listing 13-3 and notice that your newly-declared OutOfRangeException
    extends Java''s RuntimeException class. Why would you want to extend RuntimeException?
    Here''s the story:


    +   Any subclass of RuntimeException is unchecked.

    In fact, any descendant (sub-subclass, sub-sub-subclass, and so on) of RuntimeException
    is unchecked. The unchecked exceptions represent errors


