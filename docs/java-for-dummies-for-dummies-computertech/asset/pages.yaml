  md: "# LISTING 3-4: Curly Braces for a Java Class\n\n```\npublic class Display {\n\
    \    public static void main(String[] args) {\n        System.out.println(\"You'll\
    \ love Java!\");\n    }\n}\n```\n\nIn an outline, some stuff is subordinate to\
    \ a capital letter A. In a Java program, some lines are subordinate to the method\
    \ header. To indicate that something is subordinate to a method header, you use\
    \ curly braces. (See Listing 3-5)\n\n# LISTING 3-5: Curly Braces for a Java Method\n\
    \n```\npublic class Display {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"You'll love Java!\");\n    }\n}\n```\n\nIn an outline,\
    \ some items are at the bottom of the food chain. In the Display class, the corresponding\
    \ line is the line that begins with System.out.println. Accordingly, this System.out.println\
    \ line goes inside all the other curly braces and is indented more than any other\
    \ line.\n\nNever lose sight of the fact that a Java program is, first and foremost,\
    \ an outline.\n\nIf you put curly braces in the wrong places or omit curly braces\
    \ where the braces should be, your program probably won't work at all. If your\
    \ program works, it'll probably work incorrectly.\n\nIf you don't indent lines\
    \ of code in an informative manner, your program will still work correctly, but\
    \ neither you any other programmer will be able to figure out what you were thinking\
    \ when you wrote the code.\n\nIf you're a visual thinker, you can picture outlines\
    \ of Java programs in your head. One friend of mine visualizes an actual outline\
    \ morphing into a Java program. (See Figure 3-6.) Another person, who shall remain\
    \ nameless, uses more bizarre imagery. (See Figure 3-7)"
