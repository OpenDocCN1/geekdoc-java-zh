    \ methods, like this:\n\n```\nsetColor(Color.GREEN)\nfillOval(x, y, width, height);\n\
    ```\n\nValues such as Color. GREEN belong to Color class in the java.package.\n\
    \nCreate a frame that displays a traffic signal with its green, yellow, and red\
