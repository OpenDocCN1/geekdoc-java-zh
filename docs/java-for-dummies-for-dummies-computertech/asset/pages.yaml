    If a method calls another method and the called method has a throws clause, the
    calling method must contain code that deals with the exception. To find out more
    about dealing with exceptions, read Chapter 13.


    At this point in the book, the astute For Dummies reader may pose a follow-up
    question or two: "When a main method has a throws clause, someone else has to
    deal with the exception in that clause. But who called the main method?" Who deals
    with the IOException in the throws clause of Listing 10-3? The answer is that
    the Java virtual machine (JVM, the thing that runs all your Java code) called
    the main method takes care of the Exception in Listing-10-3. If the program has
    any trouble reading the Hanks.txt file, the responsibility ultimately falls on
    the JVM. The JVM takes care of the exception by displaying an error message and
