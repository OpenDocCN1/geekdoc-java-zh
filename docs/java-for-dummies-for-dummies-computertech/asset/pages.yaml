  md: '# ALL ABOUT GENERICS


    One of the original design goals for Java was to keep the language as simple as
    possible. James Gosling, the language''s creator, took some unnecessarily complicated
    features of C++ and tossed them out the window. The result was a language that
    was elegant and sleek. Some people said the language was too sleek. So, after
    several years of discussion and squabbling, Java became a bit more complicated.
    By the year 2004, Java had generics, enhanced for loops, static import, and other
    interesting new features. But the most talked-about new feature was the introduction
    of generics:


    ```

    ArrayList<String> list = new ArrayList<String>();

    ```


    The use of anything like <String> was new in Java 5.0. In old-style Java, you''d
    write


    ```

    ArrayList list = new ArrayList();

    ```


    In those days, an ArrayList could store almost anything you wanted to put in it:
    a number, an Account, a Room, a String — anything. The ArrayList class was versatile,
    but with this versatility came some headaches. If you could put anything into
    an ArrayList, you couldn''t easily predict what you get out of an ArrayList. In
    particular, you couldn''t easily write code that you had stored certain types
    of values in the ArrayList. Here''s an example:


    ```

    ArrayList<Account> things = new ArrayList<Account>();nthings.add(new Account());

    Account myAccount = things.get(0);

    //DON''T USE THIS. IT''S BAD CODE.

    ```


    In the third line, the call to get(0) grabs the earliest value in the things collection.
    The call to get(0) is okay, but the compiler checks on the attempted assignment
    to myAccount. You see a message on the third line saying that you get from the
    things list can''t be stuffed into the myAccount variable. You see this message
    because by the time the compiler reaches the third line, it has forgotten that
    the item added on the second line was of type Account!


    The introduction of generics fixes this problem:


    ```

    ArrayList<Account> things = new ArrayList<Account>();nthings.add(new Account());

    Account myAccount = things.get(0);

    //USE THIS INSTEAD. IT''S GOOD CODE.

    ```


    Adding <Account> in two places tells the compiler that things stores Account instances
    — nothing else. So, in the third line in the preceding code, you get a type


    (continued)


    CHAPTER 12 Using Collections and Streams (When Arrays Aren''t Good Enough) 329'
