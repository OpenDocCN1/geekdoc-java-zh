    # Experiments with Variables


    One summer during my college days, I was sitting on the front porch, lounging
    around and talking with someone I''d just met. I think her name was Janine. "Where
    are you from?" I asked. "Mars," she answered. She paused to see whether I''d ask
    a follow-up question.


    As it turned out, Janine was from Mars, Pennsylvania, a small town about 20 miles
    north of Pittsburgh. Okay, what''s my point? The point is that the meaning of
    a name depends on the context. If you''re just north of Pittsburgh and ask, "How
    do I get to Mars from here?" you may receive a sensible, nonchalant answer. But
    if you ask the same question standing on a street corner in Manhattan, you''ll
    probably arouse some suspicion. (Okay, knowing Manhattan, people would probably
    just ignore you.)


