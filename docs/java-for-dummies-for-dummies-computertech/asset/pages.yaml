  md: 'Well, I guess I got what was coming to me.


    Things are never as simple as they seem. The rules I describe in this section
    apply to almost every class in this book. But Java has fancy things called inner
    classes, and inner classes follow a different set of rules. Fortunately, a typical
    novice-grammer has little contact with inner classes. The only inner classes in
    this book are in Chapter 16 (and a few inner classes disguised as enum types).
    So for now, you can live quite happily with the rules that I describe in this
    section.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_423_0.png)


    # From Classes Come Modules


    The cosmos is made of solar systems, and these solar systems combine to form galaxies.
    The story doesn''t end there. The galaxies group into galaxy clusters, which in
    turn group into clusters. The same is true of Java. Fields and methods form classes,
    which combine into form packages, and the packages combine to form modules.


    Most of the java and javax packages in this book''s examples live in a module
    named java.base, but a few packages live in other modules. For example, java.awt
    and javax.swing packages (imported in Listing 14-3) belong to a module java.desktop.


    As it is with packages, you can create your own modules. When you do, you will
    build a wall around that module''s code. Public or not, you can''t access code
    from other peoples'' modules, and other peoples'' modules can''t access your code.


    Fortunately, the wall around your code is penetrable. Your module''s code can
    explicitly make its packages available to the code in other modules, and the other
    modules can explicitly request access to your module''s code.


    I''m already way over the page limit for this chapter. For more information about
    modules, visit https://openjdk.java/projects/jigsaw/quick-start.'
