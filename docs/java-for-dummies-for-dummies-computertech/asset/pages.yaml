    ...") work in Windows. In Windows, you can use either a slash (/) or a backslash
    (\) as the path separator. At the Windows command prompt, I type c:\Users\bburd
    to get to my home directory.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_226_0.png)


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_226_1.png)


    If you know your Java program looks for files, you can move your file from place
