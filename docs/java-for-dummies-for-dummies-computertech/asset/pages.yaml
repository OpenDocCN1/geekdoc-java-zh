  md: '# # Defining a Class (What It Means to Be an Account)


    Whatishes one bank account from another? If you ask a banker this, you hear a
    long sales pitch. The banker describes interest rates, fees, penalties — the whole
    routine. Fortunately, for you, I''m not interested in all that. Instead, I want
    to know how my account is different from your account. After all, my account is
    named Barry Burd, trading as Bud Brain Consulting, and your account is named Jane
    Q. Reader, trading as Budding Java Expert. My account has $24.02 in it. How about
    yours?


    When you come right down to it, the differences between one account and another
    can be summarized as values of variables. Maybe there''s a variable named balance.
    For me, the value of balance is 24.02. For you, the value of balance is 55.63.
    The question is, when writing a computer program to deal with accounts, how do
    I separate my balance variable from your balance variable?


    The answer is to create two separate objects. Let one balance live inside one
    object and let the other balance live inside the other. When you''re at it, put
    a name variable and an address variable in each of the objects. And you have it:
    two objects, and each object represents an account. More precisely, each object
    is an instance of the Account class.(See Figure 7-1).


    | | | Another instance of the Account class |

    |---|---|---|n| name | Barry | Jane |

    | address | 222 Cyberspace Lane | 111 Consumer Street |

    | balance | 165.28 | 1024.00 |


    FIGURE 7-1: Two objects.


    So far, so good. However, you still haven''t solved the original problem. In your
    computer program, how do you refer to my balance variable as opposed to your balance
    variable? Well, you have two objects sitting around, so maybe you have variables
    to refer to these two objects. Create one variable named myAccount and another
    variable named yourAccount. The myAccount variable refers to my object (my instance
    of the Account class) with all the stuff that''s inside it. To refer to my balance,
    write


    ```

    myAccount.balance

    ```'
