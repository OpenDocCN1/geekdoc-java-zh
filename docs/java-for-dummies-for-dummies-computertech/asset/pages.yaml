  md: 'In an array declaration, you can put the square brackets before or after the
    variable name. In other words, you can write int[] guests or int guests[]. The
    computer creates the same guests variable no matter which form you use.


    # Creating an array in two easy steps


    Look again at the two lines that you can use to create an array:


    ```

    int[] guests;

    guests = new int[10];

    ```


    Each line serves its own distinct purpose:


    +   int[] guests: This first line is a declaration. The declaration reserves the
    array name (a name like guests) for use in the rest of the program. In the Java
    Motel metaphor, this line says, "I plan to build a motel here and assign a certain
    number of guests to each room." (See Figure 11-2.)


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_311_0.png)


    FIGURE 11-2:

    Two steps in creating an array.


    Never mind what the declaration int[] guests actually does. It''s important to
    notice what the declaration int[] guests doesn''t do. The declaration doesn''t
    reserve ten memory locations. Indeed, a declaration int[] guests doesn''t really
    create an array. All the declaration does is set up the guests variable. At that
    point in the code, the guests variable still doesn''t refer to a real array. (In
    other words, the motel has a name, but the motel hasn''t been built yet.)


