  md: 'In a small program, unindented or poorly indented code is barely tolerable.
    But in a complicated program, indentation that doesn''t follow a neat, logical
    pattern is a big, ugly nightmare.


    Many Java IDEs have tools to indent your code automatically. In your favorite
    IDE, look for menus as Source->Format or Reform Code.


    When you write if statements, you may be tempted to chuck out the window all the
    rules about curly braces and simply rely on indentation. This strategy works in
    other programming languages, such as Python and Haskell, but not in Java. If you
    indent three statements after the word else and forget to enclose those statements
    in curly braces, the computer thinks that the else part includes only the first
    of the three statements. What''s worse, the indentation misleads you into believing
    that the else part includes all three statements. This makes it more difficult
    for you to figure out why your code isn''t behaving the way you think it should.
    Watch those braces!


