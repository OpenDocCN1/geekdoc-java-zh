  md: '# Introduction


    What hat''s all the fuss about Java? To help answer that question, I offer a few
    facts:


    +   - More than a third of the world''s programmers use Java as one of their primary
    programming languages. That''s at least 5.2 million programmers. And Java powers
    more than 52 percent of the world''s back-end web services.


    +   - Ninety percent of Fortune 500 companies use Java.\*


    +   - Websites that use Java include Google, YouTube, LinkedIn, Amazon, and eBay.\*


    +   - In 2021, Glassdoor, Inc., ranked jobs based on earnings potential, job satisfaction,
    and number of available job openings. Among the company''s "50 Best Jobs in America
    for 2021," a career as a Java developer ranked number one.\****


    Sounds good. Right?


    Please, read on.


    # About This Book


    This book isn''t the usual techie guide. It is written for normal human beings—people
    with little or no programming experience. In this book, I divide Java into manageable
    chunks. Each chunk is (more or less) a chapter on its own. I explain concepts
    in plain language using complete code examples that you can download


    https://blog.jetbrains.com/idea/2020/09/a-picture-of-java-in-2020

    ** https://blogs.oracle.com/oracleuniversity/post/why-does-java-remain-popular

    *** www.frgconsulting.com/blog/why-is-java-so-popular-developers

    **** www.glassdoor.com/List/Best-Jobs-in-America-LST_KQ0,20.htm'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'and run. I keep each code example focused on a few key concepts. I resist the
    urge to use fancy tricks to impress professional programmers. I expand on concepts
    that may be difficult for newcomers. I add diagrams to help you visualize ideas.
    I provide exercises with each chapter along with solutions to the exercises on
    this book''s website.


    Finally, and most importantly — and without question the most significant of all
    this book''s features — I''ve written some good jokes and lots of bad jokes. (I
    would say "lots and lots" of bad jokes.) I''ve hidden Easter eggs in the text.
    I''ve added anecdotes about all kinds of topics. Some of the anecdotes are true,
    and many of them are . . . you figure it out.


    # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you''re probably okay. If all these assumptions are
    incorrect, please buy the book anyway:


    +   **I assume that you have access to a computer.** Here''s the good news: You
    can run most of the code in this book on almost any computer. The only computers
    you can''t use to run this code are ancient boxes that are more than ten years
    old (give or take a few years).


    +   **I assume that you can navigate your computer''s common menus and dialog
    boxes.** You don''t have to be a Windows, Linux, Macintosh power user, but you
    should be able to start a program, find a file, put a file into a certain directory
    — that sort of thing. Most of the time, when you follow instructions in this book,
    you''re typing code on the keyboard, not pointing-clicking the mouse.


    +   **I assume that you can think logically.** There is all to programming in
    Java — thinking logically. If you can think logically, you have made it. If you
    don''t believe you can think logically, read on. You may be Pleasantly surprised.


    +   **I make few assumptions about your computer programming (or your lack of
    such experience).** In writing this book, I''ve tried to do the Impossible: Make
    the book interesting for experienced programmers yet accessible to people with
    little or no programming experience. So I assume no particular programming background
    on your part. If you''ve never created a loop or indexed an array, that''s okay.


    Java For Dummies'
