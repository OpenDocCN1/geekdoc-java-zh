  md: '# Defining Subclasses (What It Means to Be a Full-Time or Part-Time Employee)


    This last year, your company paid $10 million for a piece of software. That software
    came in the Employee.class file. People at Burd Brain Consulting (the company
    that created the software) don''t want you to know the innards of the software.
    (Otherwise, you may steal their ideas.) So, you don''t have the Java program file
    that the software came from. In other words, you don''t have Employee.java. You
    can run the bytecode in the Employee.class file. You can also read the documentation
    in a web page named Employee.html. But you can''t see the statements inside the
    Employee.java program, and you can''t change any of your program''s code.


    Since this last year, your company has grown. Unlike the old days, your company
    now has two kinds of employees: full-time and part-time. Each full-time employee
    is on a fixed, weekly salary. (If the employee works nights and weekends, in return
    for this monumental effort, the employee receives a hearty handshake.) In contrast,
    each part-time employee works for an hourly wage. A company deducts an amount
    from each full-time employee''s paycheck to pay for the company''s benefits package.
    Part-time employees, however, don''t get benefits.


    The question is whether the software that your company bought last year can keep
    up with the company''s growth. You invested in a great program to handle employees
    and payroll, the program doesn''t differentiate between your full-time and part-time
    employees. You have several options:


    +   Call your next-door neighbor, whose 12-year-old child knows more about computer
    programming than anyone in your company. This gets mighty little brat to take
    the employee software apart, rewrite it, and hand it back to you with all the
    changes and additions your company requires.


    On second thought, you can''t do that. No matter how smart that kid is, the complexities
    of the employee software will probably confuse the kid. By the time you get the
    software back, it''ll be filled with bugs and inconsistencies. Besides, you don''t
    even have the Employee.java file to hand to the kid. All you have is the Employee.class
    file, which can''t be read or modified with a text editor. (See Chapter 2.) Besides,
    your kid just beat up the neighbor''s kid. You don''t want to give your neighbor
    the satisfaction of seeing you beg for the kid''s help.'
