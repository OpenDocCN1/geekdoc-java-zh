    # Live dangerously


    Your IDE may warn you that the SimpleFrame in Listing 9-9 has no serialVersionUID
    field? "And what," you ask, "is a serialVersionUID field? It''s something having
    to do with storing a JFrame object — something you don''t care about. Not having
    a serialVersionUID field generates a warning, not an error. So throw a caution
    to the wind and ignore the warning.


    If, for some reason, you can''t ignore the warning, suppress the warning by adding
    the line @SuppressWarnings("serial") with no semicolon immediately above the public
    class SimpleFrame line. (Like @Override from Chapter 8, @SuppressWarnings is a
    Java annotation).


    If, for some other reason, you don''t want to suppress the warning, add the statement
    private static final long serialVersionUID = 1L; immediately below the public
    class SimpleFrame line.


