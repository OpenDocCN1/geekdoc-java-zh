  md: 'When I say things like, "System.out.println is buried inside the API," I’m
    not doing justice to the API. True, you can ignore all the nitty-gritty Java code
    inside the API. All you need to remember is that System.out.println is defined
    somewhere inside that code. But I’m not being fair when I make the API code like
    something magical. The API is just another bunch of Java code. The statements
    in the API that tell you what it means to carry out a call to System.out.println
    look a lot like the Java code in Listing 3-1.


    In Java, each statement (the boxed line in Figure 3-4) ends with a semicolon.
    Other lines in Figure 3-4 don''t end with semicolons; because the other lines
    in Figure 3-4 aren''t statements. For instance, the method header (the line with
    the word main in it) doesn''t directly tell the computer to do anything. The method
    header announces, "Just in case you ever want to do main, the next few lines of
    code tell you how to do it.


    Every complete Java statement ends with a semicolon.


    # # Brace yourself


    Long ago, or maybe not so long ago, your schoolteachers told you how useful outlines
    are. With an outline, you can organize thoughts and ideas, help people see forests
    instead of trees, and generally show that you’re a member of the Tidy Students
    Club. Well, a Java program is like an outline. The program in Listing 3-1 starts
    with a header line that says, "Here comes a class named Display," After that header,
    a subheader announces, "Here comes a method named main.


    Now, if a Java program is like an outline, why doesn''t a program look like an
    outline? What takes the place of the Roman numerals, capital letters, and other
    items? The answer is twofold:


    +   - In a Java program, curly braces enclose meaningful units of code.

    - You, the programmer, can (and should) indent lines so that other programmers
    can see at a glance the outline of your code.


    In an outline, everything is subordinate to the item in Roman numeral I. In a
    Java program, everything is subordinate to the top line — the line with class
    in it. To indicate that everything else in the code is subordinate to this class
    line, you use curly braces. Everything in the code goes inside these curly braces.
    (See Listing 3-4.)'
