    # Creating randomness


    In Listing 5-1, the code new Random().nextInt(10) stands for a number that appears
    to be randomly generated — a whole number in the range from 0 to 9. With 1 added
    on, the expression new Random().nextInt(10) + 1 is a number from 1 to 10.


    Notice my careful wording in the previous paragraph about "number that appears
    to be randomly generated." Achieving real randomness is surprisingly difficult.
    Mathematician Persi Diaconis says that if you flip a coin several times, always
    starting with the head side up, you''re likely to toss heads more often than tails.
    If you toss several more times, always starting with the tail up, you''likely
    toss tails more often than heads. In other words, coin tossing isn''t really fair.


    Computers aren''t much better than coins and human humans. A computer mimics the
    generation of random sequences, but in the end the computer just does what it''s
    told and all of this in a purely deterministic fashion. So, in Listing 5-1, when
    the computer executes


    ```

    import java.util.Random;

    int randomNumber = new Random().nextInt(10) + 1;

    ```


    > * Diaconis, Persi. "The Search for Randomness." American Association for the
    Advancement of Science annual meeting. Seattle. 14 Feb. 2004.'
