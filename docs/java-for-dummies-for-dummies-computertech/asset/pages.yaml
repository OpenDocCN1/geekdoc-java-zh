- pgno: 474
  md: "On the last line of the program's output, display the total of all items' tax-added\
    \ prices.\n\n# One Step Beyond\n\nIf you want to work with databases, JDBC is\
    \ a good place to start. But for industrial-strength projects, JDBC may not be\
    \ enough. For big databases, you need high-level tools.\n\nThink about a Java\
    \ class named Account. The code looks something like this:\n\n```\npublic class\
    \ Account {\n    String name;\n    String address;\n    double balance;\n}\n```\n\
    \nAn instance of the Account class is like a row of this chapter's ACCOUNTS table.\
    \ So, you can run software that automatically creates a row for each instance\
    \ in your code. With this software, you don't have to worry about updating a database.\
    \ Instead, you create classes and objects the way you do in any other Java program.\
    \ The software inserts data and performs queries on your behalf.\n\nProducts like\
    \ Hibernate, TopLink, JPA (Java Persistence API), and MyBatis are called object-relational\
    \ mapping (ORM) frameworks because they synchronize data between Java objects\
    \ and database relations. For many professional programmers, ORM is the way to\
    \ go."
