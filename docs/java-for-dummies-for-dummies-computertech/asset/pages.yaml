  md: 'When I created Listing 7-1, I didn''t have to start with a package declaration.
    None of the listings in Chapters 1-6 starts with package declarations, so each
    of those classes belongs to a catchall default package, also known as Java''s
    unnamed package. Professional Java programmers avoid using this unnamed package.
    So, for Listing 7-1, I decided to straighten up and start flying right.


    How many classes can you define? The Account class in Listing 7-1 is one of them.
    You can also create a Customer class, a Company class, classes named Address,
    Agency, Contract, Buyer, Seller, Consumer, Sale, BalanceSheet, Statement, Inventory,
    Lease, Product, Loan, Discount, and many more. You may want to separate these
    classes from your other classes named Song, Novel, Film, Painting, and Video.
    So, you may create two different packages: one com.example and another com.example.


    You can start any Java file with a package declaration, but you have to remember
    a few things:


    +   * A Java''s package name dictates the names of some folders and subfolders.


    The code in Listing 7-1 begins with package com.example.accounts. Your hard drive
    must have a folder com, which has a subfolder named example, which in turn has
    its own subfolder named accounts. Your Account.java file must be inside this accounts
    folder. For example, on my computer, I have a project root folder is named 07-01.
    My copy of Listing 7-1 is inside of 07-01/src/example/accounts folder.


    +   * Many IDEs have to do explicitly create the needed folders.


    Before you copy the code from Listing 7-1 into your IDE, you probably have to
    tell the IDE to create a package named com.example.accounts. When you do, the
    IDE will create the com/example/accounts folders for you. Then you can copy the
    Account.java file into the com/example/accounts folder.


    How do you tell your IDE to create a package? When your IDE might prompt you for
    a new package name. The IDE creates the package as part of the new project. When
    you work on an existing project, creating a package might mean searching for New
    > Package among your IDE''s menus. If you can''t find a way to do that, look for
    some hints in this book''s website (http://javadummies.allmycode).


    After telling you about packages, I can clear up some of the confusion about declarations:
    Any import declaration that doesn''t use the word static must start with the name
    of a package and must end with either of the following:


