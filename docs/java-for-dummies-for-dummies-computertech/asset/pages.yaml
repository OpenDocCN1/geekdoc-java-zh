  md: "```\nout.println(\"Oh, oh, oh, oh\");\n\nkeyboard.close();\n```\n\nRuns of\
    \ the code in Listing 5-8 look exactly the same as runs of Listings 5-6\\and 5-7.\
    \ (Refer to Figure 5-8.) The big difference is that Listing 5-8 uses the\nform\
    \ of the switch statement. In the old form:\n\n+   - You use colons (:) instead\
    \ of arrows (->).\n- You need break statements to bypass any remaining cases.\n\
    \nWhen Java encounters a break statement, it jumps out of whatever switch state-\n\
    ment it is. For example, imagine that verse has the value 2. In Listing 5-6, Java\n\
    prints That's because he is a pain. Then, because of the break statement, Java\n\
    sk right past the case that would display Cause this is the last refrain.\nIn\
    \ fact, Java jumps out of the entire switch statement and goes directly to the\n\
    statement just after the end of the switch statement. The computer displays On,\n\
    of, oh, oh because that's what the statement after the switch statement tells\n\
    Java to do.\n\nYou don't really need to put a break at the end of an all switch\
    \ statement.\nListing 5-8, the last break (the break that's part of the default)\
    \ is just for the sake\nof oddness.\n\nThe need for break inside the switch statement\
    \ is a Java programmer's night-\\mare. Everyone forgets to add these break statements,\
    \ and when you forget to add\nbreak statements, you get fall-through. With fall-through,\
    \ execution of the code\nfalls right through one case to the next. Execution keeps\
    \ falling through\n you eventually reach a break statement or the end of the entire\
    \ switch\nstatement.\n\n# # Free fall\n\nUsually, when you're using a switch statement,\
    \ you don't want fall-through, so\nYou pepper break statements throughout the\
    \ switch statements. But occasion-\\ally, fall-through is the thing you need.\
    \ Take, for instance, the \"Al's All Wet\"\nsong. (The classy lyrics are shown\
    \ in the sidebar bearing the song's name.) Each\nverse of \"Al's All Wet\" adds\
    \ new lines in addition to the lines from previous verses.\nThis situation (accumulating\
    \ lines from one verse to another) cries out for a\nstatement with fall-through.\
