  md: "> Listing 9-6 takes advantage of the display method in the Temperature class.\
    \ So the code in Listing 9-6 is much tidier than its counterpart in Listing 9-3.\n\
    \nA run of Listing 9-6 looks exactly like a run of the code in Listing 9-3 — it\
    \ just reaches the finish line in a far more elegant fashion. (The run is shown\
    \ previously, in Figure 9-1).\n\n# The default constructor\n\nThe main message\
    \ in the previous section is that subclasses do not inherit constructors. So,\
    \ what gives with all the listings over Chapter 8? In Listing 8-6, a statement\
    \ says that\n\n```\nFullTimeEmployee ftEmployee = new FullTimeEmployee();\n```\n\
    \nBut here's the problem: The code defining FullTimeEmployee (refer to Listing\
    \ 9-3) doesn't seem to have any constructors declared inside it. So, in Listing\
    \ 8-6, how can you possibly call the FullTimeEmployee constructor?\n\nHere's what's\
    \ going on. When you create a subclass and don't put any constructor declarations\
    \ in your code, Java creates one constructor for you. It's called a default constructor.\
    \ If you're creating the public FullTimeEmployee subclass, the default constructor\
    \ looks like the one in Listing 9-7.\n\nLISTING 9-7: A Default Constructor\n\n\
    ```\npublic FullTimeEmployee() {\n    super();\n}\n```\n\nThe constructor in Listing\
    \ 9-7 takes no parameters, and its single statement calls the constructor of whatever\
    \ class you're extending. (Woe to you if the class you're extending has no parameterless\
    \ constructor.)\n\nYou've just read about default constructors, but watch out!\
    \ Notice one thing that this talk about default constructors doesn't say: It doesn't\
    \ say you always get a default constructor. In particular, if you create a subclass\
    \ and define any constructors yourself, Java doesn't add a default constructor\
    \ for the subclass (and the subclass doesn't inherit any constructors, either)."
