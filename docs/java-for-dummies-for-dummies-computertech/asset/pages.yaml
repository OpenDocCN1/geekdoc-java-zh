  md: "# Doing Something about the Weather\n\nIn Chapter 8, I make a big fuss over\
    \ the notion of subclasses. That's the right thing to do. Subclasses make code\
    \ reusable, and reusable code is good code. With that in mind, it's time to create\
    \ a subclass of the Temperature class (which I develop in this chapter's first\
    \ section).\n\n# Building better temperatures\n\nAfter reusing the code in Listing\
    \ 9-3, you decide that the responsibility for displaying temperatures has been\
    \ seriously misplaced. Listing 9-3 has several repetitions of the lines to print\
    \ temperature values. A 1970s programmer would tell you to collect these lines\
    \ into one place and turn them into a method. (The 1970s programmer wouldn't have\
    \ used the word method, but that's not right now.) Collecting lines into methods\
    \ is fine, but with today's object-oriented programming methodology, you think\
    \ in broader terms. Why not get each temperature object to take responsibility\
    \ for displaying itself? After all, if you develop a display method, you probably\
    \ want to share the method with other people who use temperatures. So put the\
    \ method inside the declaration of a temperature object. That way, anyone who\
    \ uses the code for temperatures has easy access to your display method.\n\nNow\
    \ replay the tape from Chapter 8. \"Blah, blah, blah ... don't want to modify\
    \ existing code ... blah, blah, blah ... too costly to start again from scratch\
    \ ... blah, blah, blah ... extend extending functionality.\" It adds up to one\
    \ thing:\n\n> Don't abuse it. Instead, reuse it.\n\nYou decide to create a subclass\
    \ of the Temperature class — the class defined in Listing 9-2. Your new subclass\
    \ complements the Temperature class's functionality by having methods to display\
    \ values in a nice, uniform fashion. The new class, TemperatureNice, is shown\
    \ in Listing 9-5.\n\nListing 9-5: The TemperatureNice Class\n\n```\npackage com.example.weather;\n\
    import static java.lang.System.out;\npublic class TemperatureNice extends Temperature\
    \ {\n    public TemperatureNice() {\n        super();\n    }\n}\n```\n\n246 PART\
    \ 3 Working with the Big Picture: Object-Oriented Programming"
