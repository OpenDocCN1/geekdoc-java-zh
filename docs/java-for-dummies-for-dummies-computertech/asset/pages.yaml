  md: '# And Now, a few Comments


    People gather around campfires to hear the old legend about a programmer whose
    laziness got into trouble. To maintain this programmer''s anonymity, I call her
    Jane Pro. Jane worked many months to create the holy grail of computing: a program
    that thinks on its own. If completed, this program could work independently, learning
    new concepts without human intervention. Day after day, night after night, Jane
    labored to give the program that spark of creative, independent thought.


    One day, when she was almost finished with the project, she received a disturbing
    piece of paper mail from her health insurance company. No, the mail wasn''t about
    a serious illness. It was a routine office visit. The insurance company''s claim
    form had a place for Jane''s date of birth, as if her date of birth had changed
    since the last time she sent in a claim. She had absmindedly scribbled 2016 over
    her year of birth, so the insurance company refused to pay the bill.


    Jane dialed the insurance company''s phone number. Within 20 minutes, she was
    talking to a live person. "I''m sorry," said the live person. "To resolve this
    issue, you must dial a different number. Well, you can guess what happened next.
    I''m sorry. The other operator gave you the wrong number." And then, "I''m sorry.
    You must call back the original phone number."


    Five months later, Jane''s ear ached, but after 800 hours on the phone, she had
    finally gotten a tentative promise that the insurance company would eventually
    reprocess the claim. Elated as she was, she was anxious to get back to her programming
    project. Could she remember all those lines of code were supposed to doing?


    No, she couldn''t. Jane stared and stared at her work and, like a dream that doesn''t
    make sense the next morning, the code was completely meaningless to her. She had
    written a million lines of code, and not one line was accompanied by an informative
    explanatory comment. She had left no clues to help her understand what she''d
    been thinking, so in frustration she abandoned the whole project.


    # Adding comments to your code


    Listing 3–6 holds an enhanced version of this chapter''s sample program. In addition
    to all the keywords, identifiers, and punctuation, Listing 3–6 has text that''s
    meant for human beings to read.'
