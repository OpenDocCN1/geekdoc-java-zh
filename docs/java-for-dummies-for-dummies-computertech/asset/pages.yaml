- pgno: 44
  md: 'A Java virtual machine is a proxy, an errand boy, a go-between. The JVM serves
    as an interpreter between Java''s run-anywhere bytecode and your computer''s own
    system. While it runs, the JVM walks your computer through the execution of bytecode
    instructions. The JVM examines your bytecode, bit by bit, and carries out the
    instructions described in the bytecode. The JVM interprets bytecode for your Windows
    system, your Mac, or your Linux box, or for whatever kind of computer you''re
    using. That''s a good thing. It''s what makes Java programs more portable in any
    other language.


