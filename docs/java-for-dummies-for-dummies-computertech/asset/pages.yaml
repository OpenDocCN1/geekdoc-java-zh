    # Using generics


    Look again at Listing 12-1, shown earlier, and notice the funky ArrayList declaration:


    ```

    ArrayList<String> people = new ArrayList<>();

    ```


    Each collection class is generic. That ugly-sounding word means that every collection
    declaration should contain some angle-bracketed stuff, such as <String>. The thing
    that''s sandwiched between < > tells you what kind of values the new collection
    may contain. For example, in Listing 12-1, the words ArrayList<String> people
    tell that Java is a bunch of strings. That is, the people list contains String
    objects (not Room objects, Account objects, Employee objects — nothing other than
    String objects).


    You can''t use generics in any version of Java before Java 5.0, and the code in
    Listing 12-1 goes kabooey in any version before Java 7. For more generics, see
    the later sidebar, "All about generics."


    In Listing 12-1, the words ArrayList<String> people say that the people variable
    can refer only to a collection of String values. So, from that point on, any reference
    to an item from the people collection is treated exclusively as a String. If you
    write


    ```

    people.add(new Room());

