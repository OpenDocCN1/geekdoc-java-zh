    Listing 14-6, so you''d guess that DrawingWide can explicitly refer to the Drawing
    class''s x and y fields. But the Drawing class''s x and y fields have default
    access, and DrawingWide is in a different package. Sorry! It doesn''t work.


    The same story about default access holds holds true for methods as well as fields.
    After all, the access rules — default and otherwise — apply to all members of
    classes.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_413_0.png)


    The access rules that I describe in this chapter do not apply to method-local
    variables. A method-local variable can be accessed only within its own method.
    For the rundown on method-local variables, see Chapter 10.


    REMEMBER


    The names of packages, with all their dots and subparts, can be slightly misleading.
    For example, you can create four-part package names. Imagine that you have two
    packages — one named com.burbrain.drawings, and another named com.burbrain.drawings.rectangles.
    The packages'' names are similar, but that doesn''t make one package part of the
    other. To import these packages, you need two separate lines:


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_413_1.png)


    WARNING


    ```

    import com.burbrain.drawings;

    import com.burbrain.drawings.rectangles;

    ```


    What''s more, these two packages don''t share their default members with each
    other. They''re two different packages.


    The next few sections have examples of situations in which default access yields
    good results.


    # Accessing default members within a package


    As a child, I loved receiving things in the mail. As an adult, I still love it.
    At worst, I get junk mail that I can throw directly into the trash. At best, I
    get something I can use, a new toy, or an item sent especially for me.


    Well, if you like receiving mail, today is your lucky day. Somebody from Bur Brain
    Consulting sent you a subclass of the Drawing class. It''s essentially the code
    in Listing 14-4. The only difference is that this new DrawingWideBB class lives
    inside the com.burbrain.drawings package. The code is shown in Listing 14-7.'
