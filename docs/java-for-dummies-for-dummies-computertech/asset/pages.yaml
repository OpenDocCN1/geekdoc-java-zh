  md: 'The next thing to do is to sort out the differences in the way you declare
    methods. Table 15-1 has the story.


    # Using (or Not Using) Abstract Methods


    | | In an Ordinary (Non-Abstract) Class | In an Interface | In an Abstract Class
    |

    | --- | --- | --- | --- |

    | Are abstract methods allowed? | No | Yes | Yes |

    | Can a method declaration contain the abstract keyword? | No | Yes | Yes |

    | Can a method declaration contain the default keyword (meaning "not abstract")?
    | No | Yes | No |

    | With neither the abstract nor the default keyword, a method is: | Not abstract
    | Abstract | Not abstract |


    Interfaces and classes have abstract methods. So, you may be wondering how you
    should choose between declaring an interface and declaring an abstract class.
    In fact, you may ask three professional programmers how interfaces and classes
    differ from one another. If you do, you may get five different answers. (Yes,
    five answers; not three answers.)


    Interfaces and classes are similar beasts, and the new features in Java 8 made
    them even more similar than in previous Java versions. But the basic idea is about
    the relationships between them.


    +   Extending a subclass represents an is relationship.


    Think about the relationships in this chapter''s earlier section "Abstract Classes."
    A house pet is an animal. A dog is a house pet. A cat is a house pet.


    +   Implementing an interface represents a can relationship.


    Think about the relationships in this chapter''s earlier section "The Java Interface."
    The first line in Listing 15-3 says implements Displayable. With these words,
    the code promises that each ColumnOfNumbers can be displayed. Later in same listing,
    you make good on the promise by declaring a display method.


    Think about the relationships in this chapter''s earlier section "The Java Interface."
    A column of numbers is not always a summarizable method. But in Listing 15-3,
    you promise that the ColumnOfNumbers objects will be summarizable, and you make
    good on the promise by declaring a summarizable method.'
