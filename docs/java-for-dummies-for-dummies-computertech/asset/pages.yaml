  md: 'This section is about safety, not security. Safe code keeps you from making
    accidental programming errors. Secure code (a completely different story) keeps
    malicious hackers from doing intentional damage.


    So, everything connected with every aspect of a computer program has to be simple,
    right? Well, no. That''s not right. Sometimes, to make things simple in the long
    run, you have to do lots of preparatory work front. The people who built the automated
    teller machine worked hard to make sure that the machine is consumer-proof. The
    machine''s interface, with its screen messages and buttons, makes the machine
    very complicated, but carefully designed.,


    The point is that making things look simple takes some planning. In the case of
    object-oriented programming, one of the ways to making things look simple is to
    prevent code outside a class from directly using fields defined inside the class.
    Take a peek at the code in Listing 7-1. You''re working at a company that has
    spent $10 million for the code in the Account class. That''s more than a million-and-a-half
    per line! Now your job is to write the UseAccount class. You would like to


    ```

    myAccount.name = "Burry Burd";

    ```


    but doing so would be getting too far inside the guts of the Account class. After
    all, people who use an automatic teller machine aren''t allowed to program the
    machine''s variables. They can''t use the machine''s keypad to type the statement


    ```

    balanceOnAccount.29872865457 = balanceOnAccount.29872865457 + 1000000.00;

    ```


    Instead, they push buttons that do the job in an orderly manner. That''s how a
    programmer achieves safety and simplicity.


    To keep things nice and orderly, you need to change the Account class from Listing
    7-1 by outlawing such statements as


    ```

    myAccount.name = "Burry Burd";

    ```


    and


    ```

    out.print(yourAccount.balance);

    ```


