- pgno: 467
  md: 'If you poke around a bit, you can find direct evidence of the new database''s
    existence. Using your computer''s File Explorer or Finder, you can navigate to
    the project folder containing the code in Listing 17-1 (the project''s root folder).
    Just look for a file named AccountDatabase.db.


    Unfortunately, you can''t see what''s inside the database unless you run a couple
    programs. Read on!


    > If you don''t want to use SQLite, you have to replace the CONNECTION string
    in this chapter''s examples. Other string you use depends on the kind of database
    software you have, and on other factors. Check your database vendor''s documentation.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_467_0.png)


    # Using SQL commands


    These days, work with two different kinds of databases:


    +   - Relational: A relational database has any number of tables. In a particular
    table, each column represents a property. Figure 17-1 has a visual representation
    of the table described in Listing 17-1.

    - NoSQL (Not Only SQL): In a NoSQL database, data is not organized into tables.
    Instead, each chunk of data may be a document, a graph, a set of key-value pairs,
    or some other structure.


    | NAME | ADDRESS | BALANCE |

    |---|---|---|

    | Barry Burd | 222 Cyber Lane | 24.02 |

    | Doe Joe | 111 Luddite Street | 55.63 |


    FIGURE 17-1: Two deadbeat customers.


    The code in Listing 17-1 talks to a relational database. The heart of the code
    lies in the call to executeUpdate. The executeUpdate call contains a string —
    a block of the kind you see in Chapter 5.


    If you''re familiar with Structured Query Language, or SQL, the command strings
    in the calls to executeUpdate make sense to you. If not, pick up a copy of SQL
    For Dummies, 9th Edition, by Allen G. Taylor (Wiley). Otherwise, you will be fishing
    around this chapter for an explanation of the create table command. You won''t
    find an explanation, because the create table string in Listing 17-1 isn''t part
    of Java. This command is just a string of characters you feed to Java''s executeUpdate
    method. This string, which is written in SQL, creates a new database with three
    columns (columns for a customer''s NAME, the customer''s ADDRESS, and the account''s
    BALANCE). When you write a Java database program,


