  md: '# Events and event handling


    The big news in Listing 16-1, shown in the preceding section, is the handling
    of the user''s button click. When you''re working in a graphical user interface
    (GUI), anything the user does (like pressing a key, moving the mouse, clicking
    the mouse, or whatever) is called an event. The code that responds to the user''s
    press, movement, or is called event-handling code.


    Listing 16-1 deals with the button-click event with three parts of its code:


    +   >> The top of the GameFrame class declaration says that this class implements
    ActionListener.


    +   By announcing that it will implement the ActionListener interface, the ListenerPer
    in Listing 16-1 agrees that it will give meaning to the interface''s abstract
    actionPerformed method. In this situation, giving meaning means declaring an actionPerformed
    method with curly braces, a body, and maybe some statements to execute.


    +   For the full story about Java interfaces (as opposed to graphical user interfaces),
    refer to Chapter 15.


    +   >> Ensure that, the code for the GameFrame class has an actionPerformed method,
    and that actionPerformed method has a body.


    +   >> Finally, the constructor for the GameFrame class adds this to the button''s
    list of action listeners.


    Java will call the actionPerformed method in Listing 16-1 when the user clicks
    the button. Hooray!


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_448_0.png)


    Taken together, all three of these tricks make the GameFrame class handle button
    clicks.


    For more details about the use of Java''s this keyword in Listing 16-1, see this
    this chapter''s "Don''t miss this" section.


    # MARK FOR REMOVAL


    You can learn a lot about the code in Listing 16-1 by removing certain statements
