  md: "For the best results, put all this chapter's listings in the same project.\
    \ That way, you don't have to add the sqlite-jdbc.jar file to more than one project.\
    \ You can also count on the AccountDatabase.db file being readily available to\
    \ all four of this chapter's code listings.\n\n# # Retrieving Data\n\nWhat good\
    \ is a database if you can't get data from it? In this section, you query the\
    \ database you created in previous sections. The code to issue the query is shown\
    \ in Listing 17-3.\n\n+   * **Listing 17-3:** Making a Query\n\n```\npackage com.com.example.accounts;\n\
    \nimport java.sql.Connection;\nimport java.sql.DriverManager;\nimport java.sql.ResultSet;\n\
    import java.sql.SQLException;\nimport java.sql.Statement;\nimport java.text.NumberFormat;\n\
    \nimport static java.lang.System.out;\n\npublic class GetData {\n    public static\
    \ void main(String[] args) {\n        NumberFormat currency = NumberFormat.getCurrencyInstance();\n\
    \        final String CONNECTION = \"jdbc:sqlite:AccountDatabase.db\";\n\n   \
    \     try (Connection conn = DriverManager.getConnection(CONNECTION);\n      \
    \       Statement statement = conn.createStatement();\n             ResultSet\
    \ resultSet = statement.executeQuery(\"SELECT * FROM \" + \"ACCOUNTS\")) {\n \
    \           while (resultSet.next()) {\n                out.print(resultSet.getString(\"\
    NAME\"));\n                out.print(\", \");\n                out.print(resultSet.getString(\"\
    ADDRESS\"));\n                out.print(\", \");\n                out.println(currency.format(\n\
    \                    resultSet.getFloat(\"BALANCE\")));\n            }\n     \
    \   }\n    }\n}(continued)\n```"
