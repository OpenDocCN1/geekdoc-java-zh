    \ to you. You can really define a simple Java class with only four lines of code\
    \ (give or a curly brace)? You certainly can. A class is a grouping of existing\
    \ things. In the Account class of Listing 7-1, those existing things are two String\
    \ values and a double value.\n\nThe field declarations in Listing 7-1 have default\
    \ access, which means that I didn't add a word before the type name String. The\
    \ alternatives to default access are public, protected, and private access:\n\n\
    ```\npublic String name;\nprotected String address;\nrivate double balance;\n\
    ```\n\nProfessional programmers shun the use of default access because default\
