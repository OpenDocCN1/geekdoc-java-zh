  md: "# Creating a subclass\n\nIn Listing 8-1, I define an Employee class. I can\
    \ use what I define in Listing 8-1 and extend the definition to create new, more\
    \ specialized classes. So, in Listing 8-3, I define a new class: a FullTimeEmployee\
    \ class.\n\n# LISTING 8-3: What Is a FullTimeEmployee?\n\n```\npackage com.example.payroll;\n\
    \npublic class FullTimeEmployee extends Employee {\n    private double weeklySalary;\n\
    \    private double benefitDeduction;\n\n    public void setWeeklySalary(double\
    \ weeklySalaryIn) {\n        weeklySalary = weeklySalaryIn;\n    }\n\n    public\
    \ double getWeeklySalary() {\n        return weeklySalary;\n    }\n\n    public\
    \ void setBenefitDeduction(double benefitDeductionIn) {\n        benefitDeduction\
    \ = benefitDeductionIn;\n    }\n\n    public double getBenefitDeduction() {\n\
    \        return benefitDeduction;\n    }\n\n    public double findPaymentAmount()\
    \ {\n        return weeklySalary - benefitDeduction;\n    }\n}\n```\n\nLooking\
    \ at Listing 8-3, you can see that each instance of the FullTimeEmployee class\
    \ has two fields: weeklySalary and benefitDeduction. But are those the only fields\
    \ that the FullTimeEmployee instance has? No, they're not. The first line of Listing\
    \ 8-3 says that the FullTimeEmployee class extends the existing Employee class.\
    \ This means that in addition to having a weeklySalary and a benefitDeduction,\
    \ each FullTimeEmployee instance also has two other fields: name and jobTitle.\
    \ These two fields come from the definition of the Employee class, which you can\
    \ find in Listing 8-1."
