    Dear, reader. That''s not right!


    Public fields are easy to use and even easier to misuse. The best way to engineer
    your code is to make access to each field as restrictive as possible. If a field
    doesn''t absolutely need to be public, try making it private. If other classes
    have to set the field''s values, provide public getter and setter methods. And
    that leads nicely into the next paragraph. . . .


    # EVERYTHING''S BETTER WITH GETTERS AND SETTERS


