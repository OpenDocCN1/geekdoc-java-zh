  md: '# TABLE 12-3 Some Functional Programming Methods Result Value


    | Method Name | Member Of | Parameter(s) | Result Type | Result Value |

    |---|---|---|---|---|n| stream | Collection | (None) | Stream | A stream that
    spits out elements of the collection |

    | filter | Stream | Predicate | Stream | A new stream containing values for which
    the lambda expression returns true |

    | map | Stream | Function | Stream | A new stream containing the results of applying
    the lambda expression to the incoming stream |

    | reduce | Stream | BinaryOperator | The type used by the Binary Operator | The
    result of combining all values in the incoming stream |


    In Figure 12-5, in the transition from the third box to the fourth box, a worker
    method (the map method) pulls the price out of each sale. From that worker''s
    place onward, the assembly line contains only price values.


    To be more precise, Java''s map method takes a Function as such


    ```

    (sale) -> sale.getPrice()

    ```


    and applies the Function to each value in a stream. (See Tables 12-2 and 12-3.)
    So the map method in Figure 12-5 takes an incoming stream of sale objects and
    creates an outgoing stream of price values.


    In Figure 12-5, in the transition from the fourth box to the fifth box, a worker
    method (the reduce method) adds up the prices of DVD sales. Java''s reduce method
    takes two parameters:


    +   - The first parameter is an initial value.

    In Figure 12-5, the initial value is 0. Ø.

    - The second parameter is a BinaryOperator. (See Tables 12-2 and 12-3.)

    In Figure 12-5, the reduce method''s BinaryOperator is


    ```

    (price1, price2) -> price1 + price2

