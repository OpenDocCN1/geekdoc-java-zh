  md: 'If you want more tangible evidence of the difference between an interface and
    an abstract class, consider this: A class can implement many interfaces, but a
    class can extend only one other class, even if that one class is an abstract class.
    So, after you''ve declared


    ```

    public class Dog extends HousePet

    ```


    you can''t also make Dog extend a Friend class. But you can make Dog implement
    a Befriendable interface. And then you can make the same Dog class implement a
    Trainable interface. (By the way, I''ve tried making my Cat class implement a
    Trainable interface but, for some reason, it never works.)


    And, if you want an even more tangible difference between an interface and an
    abstract class, I have one for you: An interface can''t contain any nonstatic,
    nonfinal fields. For example, if the HousePet class in Listing 15-7 were an interface,
    it couldn''t have a name field. That simply wouldn''t be allowed.


    So there. Interfaces and abstract classes are different from one another. But
    if you''re new at the game, you shouldn''t worry about the difference. Just read
    as much code as you can, and don''t get scared when you see an abstract method.
    That''s all there is to it.'
