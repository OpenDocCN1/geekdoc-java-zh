    # Importing everything in one fell swoop


    The first line of Listing 5-3 illustrates a lazy way of importing both System.out\and
    System. in. To import everything that System has to offer, you use the aster-\isk
    wildcard character (*). In fact, importing java.lang.System * is like having

    bout 30 separate import declarations, including System.in, System.out,

    System.err, System.nanoTime, and many other System things.


    I don''t use the wildcard very much in this book''s examples. For larger

    programs — programs that use dozens of names from the Java API — the lazy

    asterisk trick is handy.


    You can''t toss an asterisk anywhere you want inside an import declaration. For

    example, you can''t import everything starting with java by writing import

    java.* You can substitute an asterisk only for the name of a class or for the
    name

    of something static that''s tucked away inside a class. For more information about

    asterisks in import declarations, see Chapter 7. For information about static

    things, see Chapter 10.


    # Java''s logical operators


    Mr. Spock would be pleased: Java has all the operators you need for mixing and

    matching logical tests. The operators are shown in Table 5-2.


    | Operator Symbol | What It Means | Example |

    |---|---|---|

    | && | and | 5 < x && x < 10 |

    | || | or | x < 5 || 10 < x |

    | ! | not | !password.equals("swordfish") |


    You can use these operators to form all kinds of elaborate conditions. Listing
    5-4

    has an example.'
