    # Collection Classes to the Rescue


    The issues in the preceding section aren''t new. Computer scientists have been
    working on these issues for a long time. They haven''t discovered any magic one-size-fits-all
    solution, but they''ve discovered some clever tricks.


    The Java API has a bunch of classes known as collection classes. Each collection
    class has methods for storing bunches of values, and each collection class''s
    methods use some clever tricks. For you, the bottom line is and as follows: Certain
    classes deal as efficiently as possible with the issues raised in the preceding
    section. If you have to deal with such issues when writing code, you can use these
    collection classes and call the classes'' methods. Rather than fret about a customer
    whose name belongs in position 7, you can just call a class''s add method. The
    method inserts at a position of your choice and deals reasonably with whatever
    ripple effects have to take place. In the best circumstances, the insertion is
    quite efficient. In the worst circumstances, you can rest assured that the code
    does everything the best way it can.


    # Using an ArrayList


    One of the most versatile of Java''s collection classes is the ArrayList. Listing
    12-1 shows you how it works.'
