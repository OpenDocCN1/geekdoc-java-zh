    \ the for statement.\n\n+   - The expression is evaluated several times (before\
    \ each iteration).\n\n+   - The update is also evaluated several times (at the\
    \ end of each iteration).\n\nIf it helps, think of the loop as though its text\
    \ is shifted all around:\n\n```\nint count = 1;\nfor count <= 10 {\n    out.print(\"\
