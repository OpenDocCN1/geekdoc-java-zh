- pgno: 468
  md: 'that’s what you do. You write ordinary SQL commands and surround those commands
    with calls to Java methods.


    # Connecting and disconnecting


    Aside from the call to the executeUpdate method, the code in Listing 17-1 is copy-and-paste
    stuff. Here’s a rundown on what each part of the code means:


    +   >> DriverManager.getConnection: Establish a session with a particular database.


    The getConnection method lives in a Java class named DriverManager. In Listing
    17-1, the call to getConnection creates an AccountDatabase.db file and opens a
    connection to that file. Of course, you may already have an AccountDatabase.db
    file before you start running the code in Listing 17-1. If you do, the call to
    getConnection uses your existing AccountDatabase.db file.


    In the CONNECTION string, notice the colons. The code doesn’t simplify name the
    AccountDatabase.db file — it tells the DriverManager class which protocols to
    use to connect with the file. The code jdbc:sqlite: — which is a lot like the
    http: in a web address — tells the computer to use the jdbc protocol to talk to
    the sqlite protocol, which in turn talks directly to your AccountDatabase.db file.


    +   >> createStatement: Make a statement.


    It seems strange, but in Java Database Connectivity, you create a single statement
    object. After you’ve created a statement object, you can use that many times,
    with many different SQL strings, to issue many different commands to the database.
    So, before you start calling the statement.executeUpdate method, you create an
    actual statement object. The call to conn.createStatement creates that statement
    object for you.


    +   >> try-with-resources: Release resources, come what may!


    As Ritter always says, you’re not being considerate of others if you don’t clean
    up your own messes. Every connection and every database statement lock up your
    system resources. When you’re finished using these resources, you release them.


    In Listing 17-1, Java’s try-with-resources block automatically closes and releases
    your resources at the end of the block’s execution. In addition, try-with-resources
    takes care of all the messy details associated with failed attempts to catch exceptions
    gracefully.


    For the scoop about try-with-resources, see Chapter 13.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_468_0.png)'
