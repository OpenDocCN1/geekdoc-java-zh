    to practice it. That''s why I have created things for you to try in order to reinforce
    knowledge. Many of these are confidence-builders, and some are more challenging.
    When you first start putting concepts into practice, you''ll discover all kinds
    of issues, quandaries, and roadblocks that didn''t occur to you when you started
    reading about the material. But that''s a good thing. Keep it up! Don''t become
    frustrated. Or, if you do become frustrated, visit this book''s website (http://javafordummies.allmycode.com)
    for hints and solutions.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_17_0.png)


    TRY OUT IT


    This icon calls attention to useful material that you can find online. Check it
    out!


    Occasionally, I run across a technical tidbit. The tidbit may help you understand
    what the people behind the scenes (the people who developed Java) were thinking.
    You don''t have to read it, but you may find it useful. You may also find the
    tidbit helpful if you plan to read other (geekier) books about Java.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_17_1.png)


    TECHNICAL STUFF


    # # Beyond the Book


    In addition to what you''re reading right now, this book comes with a free, anywhere
    Cheat Sheet containing code that you can copy and paste into your own Java program.
    To get this Cheat Sheet, simply go to www.dummies.com and type Java For Dummies
    Cheat Sheet in the Search box.


    # # Where to Go from Here


    If you''ve gotten this far, you''re ready to start reading about Java application
    development. Think of me (the author) as your guide, your host, your personal
    assistant. I do everything I can to keep things interesting and, most importantly,
    to help you understand.


    If you like what you read, send me a note. My email address, which I created for
    comments and questions about this book, is JavaForDummies@allmycode.com. If email
    and chat aren''t your favorites, you can reach me instead on Twitter (@allmycode)
    and on Facebook (www.facebook.com/allmycode). And don''t forget — for the latest
    updates, visit this book''s website. The site''s address is http://javafordummies.allmycode.com.


