  md: 'Think of the pledge ("I... do solemnly swear...") as a piece of code in a Java
    class. In that piece of code is the placeholder phrase state your name. Whenever
    an instance of the class (a person) executes the code (that is, takes the pledge),
    the instance fills in its own name in place of the phrase state your name.


    The this keyword works the same way. It sits inside the code GameFrame class.
    (Refer to Listing 16-1.) Whenever an instance of GameFrame is constructed, the
    instance calls addActionListener(this). In that call, the keyword stands for the
    instance itself:


    ```

    button.addActionListener(thisGameFrameInstance);

    ```


    By calling button.addActionListener(this), the GameFrame instance is saying, "Add
    my actionPerformed to the list of methods that are called when the button is clicked."
    And indeed, the GameFrame instance has an actionPerformed method. The GameFrame
    class has to have an actionPerformed method because the GameFrame class implements
    the ActionListener interface. It''s funny how that fits together.


    For a thought experiment, imagine that you''ve constructed two instances of the
    GameFrame class.


    ```

    var frame1 = new GameFrame();

    var frame2 = new GameFrame();

    ```


    Maybe both frames (frame1 and frame2) appear on the screen at the same time. Both
    frames contain their own copies of the textField variable, the button variable,
    the label variable, and the actionPerformed method. In addition, both frames contain
    their own copies of this.


    +   >> In the frame1 code, this refers to that frame1 object.


    In the frame1 code, calling button.addActionListener(this) tells Java to call
    the frame1 object''s actionPerformed method when the user clicks the frame1 object''s
    button.

    >> In the frame2 code, this refers to the frame2 object.


    In the frame2 code, calling button.addActionListener(this) tells Java to call
    the frame2 object''s actionPerformed method when the user clicks the frame2 object''s
    button.


