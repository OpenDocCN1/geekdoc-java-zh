    Well, a certain program called javadoc (what else?) can find all the javadoc comments
    in Listing 3-6 and turn these comments into a nice-looking web page. Figure 3-8
    shows the page.


    # Javadoc comments are great. Here are several great things about them:


    +   >> The only person who has to look at a piece of Java code is the programmer
    who writes the code. Other people who use the code can find out what the code
    does by viewing the automatically generated web page.


    +   >> Because other people don''t look at the Java code, other people don''t
    make changes to the Java code. (In other words, other people don''t introduce
    errors into the existing Java code).


    +   >> Because other people don''t look at the Java code, other people don''t
    have to decipher the inner workings of the Java code. All these people need to
    know about the code is what they read on the code''s web page.


    +   >> The programmer doesn''t create two separate files — some Java code over
    here and some documentation about the code over there. Instead, the programmer
    creates one piece of Java code and embeds the documentation (in the form of javadoc
    comments) right inside the code.


    +   >> The generation of web pages from javadoc comments is automatic. So everyone''s
    documentation has the same format. No matter whose Java code you use, you find
    out that code by reading a page like the one in Figure 3-8. That''s good because
    the format in Figure 3-8 is familiar to anyone who uses Java.'
