- pgno: 202
  md: 'setter method, and getName is called a getter method. (I bet you won''t forget
    that terminology!)


    With many IDEs, you don''t have to type your own accessor methods. First, you
    type a field declaration like private String name. Then, on your IDE''s menu bar,
    you choose Source: Generate Getters and Setters or choose Code: Insert Setter
    or some mix of those codes. After you make all your choices, the IDE creates accessor
    methods and adds them to your code.


    Notice that all the setter and getter methods in Listing 7–8 are declared to be
    public. This ensures that anyone anywhere can call these two methods. The idea
    here is that manipulating the actual fields from outside the Account code is impossible,
    but you can easily reach the approved setter and getter methods using those fields.


    Think about the automatic teller machine. Someone using the ATM can type a command
    that directly changes the value in their account''s balance field, but the procedure
    for depositing a million-dollar check is easy to follow. The people who built
    the teller machines know that if the check-depositing procedure is complicated,
    plenty of customers will mess it up royally. That''s the story make impossible
    anything that people shouldn''t do make sure that the tasks people should be doing
    easily.


    Nothing about having setter and getter methods is sacred. You don''t have to write
    any setter or getter methods that you don''t use. For instance, in Listing 7–8,
    I can omit the declaration of method getAddress and everything still works. The
    only problem if I do this is anyone who wants to use your Account class and retrieve
    the address of an existing account is up a creek.


    When you create a method to set the balance field, you don''t have to name your
    method kendine. You can name it tunaFish or whatever you like. The trouble is
    that the setName convention (with lowercase letters in set and an uppercase letter
    to start the Fieldname part) is an established convention in the world of Java
    programming. If you don''t follow the convention, you confuse the kumquats out
    of other Java programmers.


    When you call a setter method, you feed it a value of the type that''s being set.
    That''s why, in Listing 7–9, you call yourAccount.setBalance(55.63) with a parameter
    of type double. In contrast, when you call a getter method, you usually don''tt
    feed any values to the method. That''s why, in Listing 7–9, you call yourAccount.getBalance()
    with an empty parameter list. Occasionally, you may want to get and set a value
    with a single statement. To add a dollar to your account''s existing balance,
    you write yourAccount.setBalance(yourAccount.getBalance()+1.00).'
