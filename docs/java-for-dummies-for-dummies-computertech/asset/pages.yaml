    # Chapter 16

    Java’s Juguggling Act


    Sudy after study shows how people perform poorly when they try to multitask. I
    occasionally attend two online presentations at the same time. I set up two computers,
    each with easily adjustable volume controls. My plan is to pivot my arithmetic
    between the two computer screens, changing the volumes, moment by moment, in response
    to the importance of what’s being presented.


    This plan never works. Rather than follow both presentations, I end up following
    neither of them.


    Most people can’t concentrate on two tasks at a time, but some people can. A study
    at the University of Utah found that about 1 in 40 people is a supertasker — someone
    who can drive a simulated vehicle, talk on a phone, memorize words, and do mental
    arithmetic at the same time.** A series of fMRI scans has shown that supertaskers’
    brains don’t race to keep up with all the input they receive.** Instead, their
    brains tune down the logical thinking and turn up the relaxing thoughts. The regions
    in their brains that are responsible for daydreaming and other calming activities
    take the front stage when these people multitask.


    What about computers? How do they multitask? Since the 1960s, computers have been
    able to interleave many tasks in time lasting only fractions of a second. And
