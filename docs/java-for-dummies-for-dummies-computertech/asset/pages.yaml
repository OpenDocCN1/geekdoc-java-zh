- pgno: 512
  md: '# About the Author


    Barry Burd received a master''s degree in computer science at Rutgers University
    and a PhD in mathematics at the University of Illinois. As a teaching assistant
    in Champaign-Urbana, Illinois, he was elected five times to the university-wide
    list of Teachers Ranked as Excellent by Their Students.


    Since 1980, Dr. Burd has been a professor in the department of mathematics and
    computer science at Drew University in Madison, New Jersey. He has spoken at conferences
    in the United States, Europe, Australia, and Asia, and in 2020, he was honored
    to be named a Java Champion. He is the author of many articles and books, including
    Beginning Programming with Java For Dummies, Java Programming For Android Developers
    For Dummies, and Flutter For Dummies, all from Wiley.


    Dr. Burd lives in Madison, New Jersey, with his wife of n years, where n > 40.
    In his spare time, he enjoys being a workaholic.


    # Dedication


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_512_0.png)


    # Author''s Acknowledgments


    I heartily and sincerely thank Paul Levesque, for his work on so many of my books
    in this series.


    Thanks also to Kelsey Baird, for her hard work and support in so many ways.


    Thanks to Chad Darby and Becky Whitney, for their efforts in editing this book.


    Thanks to the staff at Wiley Publishing for helping to bring this book to bookshelves.'
