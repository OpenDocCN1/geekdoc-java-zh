  md: "# LISTING 17-3: (continued)\n\n```\n) catch (SQLException e) {\n    out.println(e.getMessage());\n\
    }\n\n```\n\nTo use a database other than Sqlite, change the value of CONNECTION\
    \ in each of this chapter's examples.\n\nA run of the code from Listing 17-3 is\
    \ shown in Figure 17-2. The code queries the database and then steps through the\
    \ rows of the database, printing the data from each of the rows.\n\nFIGURE 17-2:\n\
    Retrieving data from the database.\n\n| Berry Burd. 222 Cyber Lane $24.02 |\n\
    | Joe Dow, 111 Luddite Street $55.63 |\n\nListing 17-3 calls executeQuery and\
    \ supplies the call with an SQL command. For those who know SQL commands, this\
    \ particular command gets all data from the ACCOUNTS table (the table you create\
    \ in Listing 17-1).\n\nThe thing returned from calling executeQuery is of type\
    \ java.sqlResultSet. (That's one of the differences between the executeUpdate\
    \ and executeQuery methods: executeQuery returns a result set, and executeUpdate\
    \ doesn't). A result set is much like a database table. Like the original table,\
    \ the result set has rows and columns. Each row contains the data for one account.\
    \ In this example, each row has a name, an address, and a balance amount.\n\n\
    After you call executeQuery and get your result set, you can step through the\
    \ result set one row at a time. To do this, you go into a little loop and test\
    \ the condition resultSet.next() at the top of each loop iteration. Each time\
    \ around, the call to resultSet.next() does two things:\n\n+   - It moves you\
    \ to the next row of the result set (the next account) if another exists.\n- It\
    \ tells you whether another row exists by returning a boolean value — true or\
    \ false.\n\n458 PART 4 Smart Java Techniques"
