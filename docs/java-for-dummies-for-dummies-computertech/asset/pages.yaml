    # Follow the thread


    Here''s a well-kept secret: Java programs are multithreaded, which means things
    at a time are going on whenever you run a Java program. Sure, the computer is
    executing the code you''ve written, but it''s executing other code as well (code
    that you didn''t write and don''t). All this code is being executed at the same
    time. While the computer executes your main method''s statements, after another,
    the computer takes time out, sneaks away briefly, and executes statements from
    other, unseen methods. For most simple Java programs, the other methods are ones
    that are defined as part of the Java virtual machine (JVM).


    For example, Java has an event-handling thread. While your code runs, the event-handling
    thread''s code runs in the background. The event-handling thread code listens
    for mouse clicks and takes appropriate action whenever a user clicks the mouse.
    Figure 16-3 illustrates how this business works.


    | Your code''s thread | The event handling thread |

    |---|---|

    | setLayout(new BorderLayout());)); | Did the user click the mouse? |

    | add(textField); | |

    | add(button); | |

    | add(label); | Did the user click the mouse? |

    | button.addActionListener(this); | Did the user click the mouse? |

    | pack(); | Yes? Okay, then I''ll call the |

    | setVisible(true); | actionPerformed method. |


    FIGURE 16-3:

    Two java threads.


    When the user clicks the button, the event-handling thread says, "Okay, the button
    was clicked. What should I do about that?" And the answer is, "Call actionPerformed
    methods." It''s as though the event-handling thread has code that looks like this:'
