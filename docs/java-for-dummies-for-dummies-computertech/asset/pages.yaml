  md: 'FIGURE 11-1: An abstract snapshot of rooms in the Java Motel.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_310_0.png)


    Using an array saves you from all the repetitive nonsense in the sample code shown
    at the beginning of this section. For instance, to declare an array with ten values
    in it, you can write one fairly short statement:


    ```

    int[] guests = new int[10];

    ```


    If you''re especially verbose, you can expand this statement so that it becomes
    separate statements:


    ```

    int[] guests;

    guests = new int[10]

    ```


    In either of these code snippets, notice the use of the number 10. This number
    tells the computer to make the guests array have ten components. Each component
    has a name of its own. The starting component is guests[0], the next is named
    guests[1], and so on. The last of the ten components is named guests[9].


    In creating an array, you specify the number of components. The array''s indices
    start with 0 and end with the number that''s one less than the total of components.


    The snippets that I show you give two ways to create an array. The first way uses
    one line. The second way uses two lines. If you take the single-line route, you
    can put that line inside or outside a method. The choice is yours. On the other
    hand, if you use two separate lines, the second line, guests = new int[10], should
    be inside a method.'
