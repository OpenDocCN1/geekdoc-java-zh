    # Cutting a check


    Listing 8-1 has three printf calls. Each printf has a format string "% (%s)***s"
    and a variable (like jobTitle). Each format string has a placeholder (like %s)
    that determines where and how the variable''s value is displayed.


    For example, in the second printf, the format string has a %s placeholder. This
    % holds a place for the jobTitle value. According to Java''s rules, the notation
    %s always holds a place for a string, and ensure, the variable jobTitle is declared
    to be of type String in Listing 8-1. Parentheses and some other characters surround
    the %s placeholder, so parentheses surround each job in its output (See Figure
    8-2)


    | Pay to the order of Barry Burd (CEO) ***$8,000.00 |

    | Pay to the order of Harriet Ritter (Captain) ***$7,000.00 |

    | Pay to the order of Your Name Here (Honorary Exec of the day) ***$10,000.00
    |


    Back in Listing 8-1, notice the comma inside the %,.2f placeholder. The comma
    tells the program to use grouping separators. That''s why, in Figure 8-2, you
    see $5,000.00, $7,000.00, and $10,000.00 instead of $5000.00, $7000.00, and $10000.00.'
