- pgno: 361
  md: 'Every stream has two kinds of methods: intermediate and terminal. An intermediate
    method is one that returns another stream. A terminal method is one that returns
    something other than a stream or returns nothing (void). A chain of calls begins
    with one or more intermediate methods and ends with a single terminal method.
    For example, in Listing 12-5, filter and map are intermediate methods, and reduce
    is a terminal method. In a sense, the terminal method pulls values from all the
    intermediate methods. When Java tries to find the value of total, the terminal
    method eagerly asks for sale and price2. At that moment, the lazy, intermediate
    filter and map methods wake up and start pumping values.


    If you don''t put a terminal method call at the end of your call chain, Java doesn''t
    execute any of the intermediate calls. For an example, see the Try It Out paragraph
    at the end of this chapter.


    # Why bother?


    The chain of method calls in Listing 12-5 accomplishes everything the loop in
    Listing 12-4 accomplishes. But the code in Figure 12-10 uses concepts from functional
    programming. What''s the big deal? Are you better off with Listing 12-5 than with
    12-4?


    You are. For the past several years, the trend in chip design has multicore processors.
    With several cores, a processor can execute several statements at the same time,
    speeding up a program''s execution by a factor of 2 or 4 or even more. Programs
    run much faster if you divide the work among several cores. How do you divide
    the work?


    You can modify the imperative code in Listing 12-4. For example, with some fancy
    features, you can hand different iterations to different cores. But the resulting
    code is messy. For the code to work properly, you have to micromanage the loop
    iterations, checking carefully to make sure the final runningTotal is correct.


    In contrast, the functional code is easy to modify. To take advantage of multicore
    processors, you change only one word in Listing 12-5!


    ```

    sales.parallelStream()

    .filter(sale) -> sale.getItem().equals("DVD")

    .map(sale) -> sale.getPrice())

    .reduce(0.0, (price1, price2) -> price1 + price2);

    ```


    In Listing 12-5, the stream() method call creates a serial stream. With a serial
    stream, Java does its processing one sale at a time. But a call to parallelStream()
    creates a slightly different kind of stream. With a parallel stream,'
