    in Listing 5-4, having a showMessageDialog box pop up from nowhere is quite useful.


    # (Conditions in parentheses)


    Keep an eye on those parentheses! When you''re combining conditions with logical
    operators, it''s better to waste typing effort and avoid unneeded parentheses
    than to go your risk by using too few parentheses. Take, for example, the expression


    ```

    2 < 5 || 100 < 6 && 27 < 1

    ```


    By misreading this, you might conclude that the expression is false. That is,
    you could wrongly read the expression as meaning (something-other) && 27 < 1.
    Because 27 < 1 is false, you would conclude that the whole expression is false.
    The fact is that, in Java, && operator is evaluated before any operator. So the
    expression really asks whether 2 < 5 || (something-other). Because 2 < 5 is true,
    the expression is true.


