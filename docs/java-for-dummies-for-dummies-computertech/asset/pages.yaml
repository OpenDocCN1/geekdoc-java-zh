  md: 'I''m always surprised by the number of quirks that I find in each programming
    language''s scanning methods. For example, the first nextLine that reads from
    the line in Figure 8-3 devours Barry Burd[LineBreak] from the file. But that nextLine
    delivers Barry Burd (with no line break) to the running code. nextLine loses the
    line break, this is a subtle point. And no, this subtle point hardly causes problems
    for anyone.


    If this business aboutDouble and nextLine confuses you, please don''t the blame
    on Java. Mixing input calls is delicate work in any computer language. And the
    really nasty thing is that each programming language approaches the problem a
    little differently. What you find out about nextLine in Java helps you understand
    the issues when you get to know C++ or Visual Basic, but it doesn''t tell you
    all the details. Each language''s details are unique to that language and famous,
    the pain eventually pays off.


    # Clean up after yourself


    To the average computer user, a keyboard doesn''t feel anything like a file stored
    on a computer''s hard drive. Disk files and keyboard input have a lot in common.
    In fact, a basic principle of computer operating systems dictates that any differences
    between two kinds of input be, for the programmer, are blurry as possible. As
    a Java programmer, you should treat disk files and keyboard input almost the same
    way. That''s why Listing 8-2 contains a diskScanner.close()


    When you run a Java program, you normally execute the method''s statements, starting
    with the first statement in the method body and ending with the last statement
    in the method body. You take detour along the way, skipping some parts and diving
    into method bodies, but basically you finishing executing statements at the end
    of the main method. That''s why, in Listing 8-2, the call to close is at the end
    of the main method''s body. When you run the code in Listing 8-2, the last thing
    you do is disconnect from the disk file. And furthermore, that disconnection takes
    place after you''ve executed all the nextLine and nextDouble calls.


