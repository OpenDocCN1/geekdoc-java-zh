    \ this information to the e variable whenever it can't\nsense of the user's three\
    \ input.\n\nIn addition to the getMessage method, each exception has a handy printStack-\n\
    Trace method. To see how this works, rewrite the catch clause in Listing 13-2\
    \ as\nfollows:\n\n```\n} catch (NumberFormatException e) {\n    e.printStackTrace();\n\
