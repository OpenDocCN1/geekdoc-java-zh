    # What is a Java virtual machine?


    A Java virtual machine (JVM) is a program that interprets and carries out bytecode
    instructions.


    > —Barry Burd, Java For Dummies, 8th Edition


    The preceding “What is a compiler?” section, I make a big fuss about computers
    following instructions like the ones in Listing 2-2. As fusses go, it''s a very
    nice fuss. But if you don''t read every fussy word, you may be misguided. The
    exact wording is “…computers follow cryptic instructions like the ones in Listing
    2-2.” The instructions in Listing 2-2 are lot like instructions that a computer
    can execute, but generally, computers do not execute bytecode instructions. Instead,
    each kind of computer processor has its own set of executable instructions, and
    each computer operating system uses the processor’s instructions in a slightly
    different way.


    Here''s a hypothetical situation: The year is 1992 (a few years before Java was
    made public) and you run the Linux operating system on a computer that has an
    old Pentium processor. Your friends run Linux on a computer with a different kind
    of processor — a PowerPC processor. (In the 1990s, Intel Corporation made Pentium
    processors, and IBM made PowerPC processors.)


