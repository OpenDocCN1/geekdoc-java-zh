  md: '# # What It Means to Be an Employee


    Wouldn''t it be nice if every piece of software did just what you wanted it to?
    In an ideal world, you could buy a program, make it work right away, plug it seamlessly
    into new situations, and update it easily whenever your needs change. Unfortunately,
    software of this kind doesn''t exist. (Nothing of this kind exists.) The truth
    is that no matter what you want to do, you can find software that does some of
    it, but not all of it.


    This is one of the reasons why object-oriented programming has been successful.
    For years, companies were buying prewritten code, only to discover that the code
    didn''t do what they wanted it to do. So, what did the companies do about it?
    They started messing with the code. Their programmers deep into the program files,
    changed variable names, moved subprograms around, reworked formulas, and generally
    made the code worse. The reality was that if a program didnt already do what you
    wanted it to (even if it did something so close to what you wanted), you could
    never improve the situation by mucking around inside the code. The best option
    was always to chuck the whole program (expensive as that) and start all over again.
    What a sad state of affairs!


    With object-oriented programming, a big change has come about. At its heart, an
    object-oriented program is made to be modified. With correctly written software,
    you can take advantage of features that are already built-in, add new features
    of your own, and override features that don''t suit your needs. And the best part
    is that the changes you make are clean. No clawing and digging into other people''s
    brittle program code. Instead, you make nice, orderly additions and modifications
    without touching the existing code''s internal logic. It''s the ideal solution.


