- pgno: 396
  md: 'In Listing 13-11, the declarations of diskScanner1 and diskScanner2 are parentheses
    after the word try. The parenthesized declarations tell Java to close diskScanner1
    and diskScanner2 automatically after execution of the statements in the try clause.
    Java closes these connections whether you throw an exception or not.


    Look at all the statements in the body of the cutCheck method. Not one of these
    statements contains the word close. You don''t need any explicit close calls.
    The try-with-resources statement does all for you.


    You can access all kinds of resources (files, databases, connections to servers,
    and others) and have peace of mind knowing that Java will sever the connections
    automatically when necessary. Life is good!


    Before we bid a farewell to Listing 13-11, let''s take a moment to look at the
    cutCheck method''s catch clause. As in Listing 13-9, we want the code''s main
    method to do something about a missing Legal.txt file. We could add lots of clunky
    if statements to make bind to our will, but it''s better to have main respond
    to the original FileNotFoundException. In the cutCheck method''s catch cause,
    the variable e throws does the trick. That statement says "pass this despicableFileNotFoundException
    on whichever method called me." And the "method that called me" is main.


    In a try-with-resources statement, the catch clause is optional. If you remove
    the catch clause, the program behaves almost the same way. In Listing 13-11, the
    only thing you lose is the possibility of getting the Abnormal return from the
    cutCheck output.


