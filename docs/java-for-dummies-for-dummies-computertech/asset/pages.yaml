  md: "# LISTING 5-6: A switch Statement\n\n```\nimport java.util.Scanner;\n\nimport\
    \ static java.lang.System.out;\n\npublic class SwitchIt {\n    public static void\
    \ main(String[] args) {\n        var keyboard = new Scanner(System.in);\n    \
    \    out.println(\"Which verse? \");\n        int verse = keyboard.nextInt();\n\
    \n        switch (verse) {\n            case 1 -> out.println(\"That's because\
    \ he has no brain.\");\n            case 2 -> out.println(\"That's because he\
    \ is a pain.\");\n            case 3 -> out.println(\"Cause this is the last refrain.\"\
    );\n            default -> out.println(\"No such verse. Please try again.\");\n\
    \        }\n\n        out.println(\"Oh, oh, oh, oh\");\n\n        keyboard.close();\n\
    \    }\n```\n\n5-8 shows two runs of the program in Listing 5-6. (Figure 5-9 illustrates\
    \ the program's overall idea). First, the user types a number, like the number\
    \ 2. Execution of the program reaches the top of the switch statement. The computer\
    \ checks the value of the verse variable. When the computer determines that the\
    \ verse variable is value 2, the computer checks each case of the switch statement.\
    \ The value 2 doesn't match the topmost case, so the computer proceeds to the\
    \ middle of the three cases. The value posted for the middle case (the number\
    \ 2) matches the value of the verse variable, so the computer executes the statement\
    \ in case 2:\n\n```\nout.println(\"That's because he is a pain.\");\n```\n\nIf\
    \ the pesky user asks for verse 6, the computer bypasses cases 1, 2, and 3. The\
    \ computer goes straight to the default. In the default, the computer displays\
    \ No such verse. Please try again and jumps out of the switch statement. After\
    \ the computer is out of the switch statement, the computer displays Oh, oh, oh."
