    hard drive. The file contains characters like those previously in Figure 8-3.


    At this point, the terminology makes mountains out of molehills. Sure, I use the
    phrases new File object and new File instance, but all you''re doing is making
    File("EmployeeInfo.txt") stand for a file on your hard drive. After you show new
    File("EmployeeInfo.txt") into Scanner,


    ```

