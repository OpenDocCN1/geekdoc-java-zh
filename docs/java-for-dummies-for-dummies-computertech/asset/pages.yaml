- pgno: 47
  md: 'The first category (the grammar) includes rules like this: "The verb agrees
    with the noun in number and person." The second category (expressions, sayings,
    and stuff) includes knowledge like this: "Julius Caesar was a famous Roman emperor,
    so don''t name your son Julius Caesar, unless you want him to get beaten every
    day after school.


    The Java programming language has all the aspects of a spoken language English.
    Java has words, grammar, commonly used names, stylistic idioms, and other such
    elements.


    # # The grammar and the common names


    The people at Sun Microsystems who created Java thought of Java as having separate
    parts. Just as English has its grammar and commonly used names, the Java programming
    language has its specification (its grammar) and its application programming interface
    (its commonly used names). Along with these parts come two important documents:


    +   **The Language Specification**: This documentation includes rules like this:
    "Always put an open parenthesis after the word for" and "Use an asterisk to multiply
    two numbers."


    +   **The API Specification**: Java''s application programming interface (API)
    contains thousands of names that were added to Java after the language''s grammar
    was defined. These names range from the commonplace to the exotic. For example,
    one name — the name JFrame represents a window on your computer''s screen. A more
    razzle-dazzle name pow helps you 5 to the tenth power or raise whatever to the
    whatever-else power. Other names help you listen for the user''s button clicks,
    query databases, and all kind of useful things.


    You can download the language specification by poking around at http://docs.oracle.com/java/specs,
    but I don''t recommend doing it. With the language spec, you can tell subtle arguments
    about edge cases in the behavior of Java programs, but the spec is far too detailed
    for the day-to-day study of Java.


    The second document — the API Specification — is the go-to document for most of
    your Java programming needs. The API contains thousands of names and keeps growing
    with each new Java release. That may seem scary, but there''s good news — you
    don''t have to memorize anything in the API. None of it. You can look up the stuff
    you need to use in the documentation and ignore the stuff you don''t need. What
    you use often, you''ll remember. What you don''t use often, you''ll forget (like
    any other programmer).


    34 PART 1 Getting Started with Java'
