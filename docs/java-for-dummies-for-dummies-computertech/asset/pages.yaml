  md: '# Wrap it up


    In Chapter 4, I point out that Java has two kinds of types: primitive types and
    reference types. (If you didn''t read those sections, or you don''t remember them,
    don''t feel guilty. You''ll be okay.) Things like int, double, char, and boolean
    are primitive types, and things like String, JFrame, ArrayList, and Account are
    reference types.


    The distinction between primitive types and reference types has been a source
    of contention since Java''s birth in 1995. Even now, Oracle''s wizards are hatching
    plans to get around the stickier consequences of having two kinds of types. One
    of those consequences is the fact that collections, like the ArrayList, can''t
    contain values of a primitive type. For example, it''s okay to write


    ```

    ArrayList<String> people = new ArrayList<>();

    ```


    it''s not okay to write


    ```

    ArrayList<int> numbers = new ArrayList<int>(); // BADI BADI

    ```


    because int is a primitive type. So, if you want to store values like 3, 55, and
    21 in an ArrayList, what do you do? Rather than store int values in the ArrayList,
    you store Java''s Integer values:


    ```

    ArrayList<Integer> list = new ArrayList<>();

    ```


    In previous chapters, you saw the Integer class in connection with the parseInt
    method:


    ```

    int numberOfCows = Integer.parseInt("536");

    ```


    The Integer class has many methods, such as parseInt, for dealing with int values.
    The class also has fields like MAX_VALUE and MIN_VALUE, which stand for the largest
    and smallest int variables that may have.


    The Integer class is an example of a wrapper class. Each of Java''s eight primitive
    types has a wrapping class. You can use methods and fields in Java''s Double,
    Character, Boolean, Long, Float, Short, and Byte wrapper classes. For example,
    the Double class has methods named parseDouble, compareTo, Hex-String, and fields
    named MAX_VALUE and MAX_EXPONENT.


    Notice the pattern. All of Java''s primitive types (such as int, double, char)
    have names that start with lowercase letters. In contrast, all the wrapper classes
    (Integer, Double, Character, and so on) have names that begin with uppercase letters.


    CHAPTER 12 Using Collections and Streams (When Arrays Aren''t Good Enough) 331'
