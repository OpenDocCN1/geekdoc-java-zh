    \ which has the code for these .java files in in Listings 14-2 and 14-3!)\n\n\
    Anyway, you want to tweak the way the oval looks in Figure 14-4 so that it's a\
    \ bit wider. To do this, create a subclass of the Drawing class — DrawingWide\
    \ — and put it in Listing 14-4.\n\nLISTING 14-4: A Subclass of the Drawing Class\n\
    \n```\npackage com.example.chapter14;\n\nimport com.burdbrain.drawings.Drawing;\n\
    \nimport java.awt.Graphics;\n\npublic class DrawingWide extends Drawing {\n  int\
