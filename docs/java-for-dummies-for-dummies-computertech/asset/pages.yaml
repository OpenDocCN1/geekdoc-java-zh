  md: 'field. This makes sense. **Remember:** The whole class that defines a static
    field or method owns that field or method. So, to refer to a static field or method''s
    name, you preface the field or method with the class''s name.


    With dot notation that refers to a static field or name, you can cheat and use
    an object''s name in place of the class name. For instance, in Listing 10-5, with
    judicious rearranging of some other statements, you can use the expression `player.findTeamAverageString()`.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_289_0.png)


    TIP


    # The static keyword is yesterday''s news


    This section makes a big noise about static fields and methods, but static things
    have been part of the picture since early in this book. For example, Chapter 3
    introduces `System.out.println`. The name System refers to a class, and out is
    a static field in that class. That''s why, in Chapter 4 and beyond, I use the
    **static** keyword to import the out field:


    ```

    import java.lang.System.out;

    ```


    In Java, static fields and methods show up all the place. When they''re declared
    in someone else''s code and you''re making use of them in your code, you''ve hardly
    ever to worry about them. But when you''re declaring your own fields and methods
    and decide whether to make them *static*, you have to think a little harder.


    In this book, my first serious use of the word **static** is back in Listing 3-1.
    I use the static keyword as part of every main method (and lots of main methods
    are in this book''s listings). So why does `main` have to be static? Well, remember
    that nonstatic things belong to objects, not classes. If the `main` method isn''t
    static, you can''t have a `main` method until you create an object. But, when
    you start a Java program, no objects have been created yet. The statements that
    are executed in the `main` method start creating objects. So if the `main` method
    isn''t static, you have a big chicken-and-egg problem.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_289_1.png)


    TECHNICAL

    STUFF


    # Could cause static; handle with care


    When I first started writing Java programs, I had recurring dreams about seeing
    a certain error message. The message was Nonstatic field or method cannot be referenced
    from a static context. So often did I see this message, so thoroughly was I perplexed,
    that the memory of this message became burned into my subconscious existence.'
