    \n        out.print(\"How many boxes do we have ?\\n        String numBoxesIn\
    \ = keyboard.next();\n\n        try {\n            int numBoxes = Integer.parseInt(numBoxesIn);\n\
    \            out.print(\"the value is \");\n            out.println(currency.format(numBoxes\
    \ * boxPrice));\n        } catch (NumberFormatException e) {\n            out.print(e.getMessage());\n\
    \            out.println(\" ... Cannot interpret the input.\");\n        }\n\n\
    \        keyboard.close();\n    }\nn\n```\n\nFigure 13-3 shows three runs of the\
    \ code from Listing 13-2. When a misguided user types **three** instead of **3**,\
    \ the program maintains its cool by displaying For input string: `\"three\"` ...\
    \ Cannot interpret the input. The trick is to enclose the call to `Integer.parseInt`\
    \ inside a try clause. If you do this, the computer watches for exceptions when\
    \ any statement inside the try clause is executed. If an exception is thrown,\
    \ the computer jumps from inside the try clause to a catch clause below it. In\
    \ Listing 13-2, the computer jumps directly to the catch(NumberFormatException\
    \ e) clause. The computer executes the two print statements inside the clause\
    \ and then marches on with normal processing. In 13-2, \"normal processing\" means\
    \ executing `keyboard.close()`.\n\nCHAPTER 13 Looking Good When Things Take Unexpected\
    \ Turns 359"
