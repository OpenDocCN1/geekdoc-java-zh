    \ its own\nparameter list.\n\nThe parameter list always has an exception type\
    \ name and then a parameter. The\nparameter is an object — an instance of the\
    \ NumberFormatException class. When\nan exception is caught, Java makes the catch\
    \ clause's parameter refer to that\nexception object. In other words, the name\
    \ e in Listing 13-2 stores a bunch of\ninformation about the exception. To take\
    \ advantage of this, you can call some of\nthe exception's methods.\n\nIn Listing\
