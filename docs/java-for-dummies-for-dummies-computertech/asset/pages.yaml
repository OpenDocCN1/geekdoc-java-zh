  md: 'All the methods called in the SimpleFrame class''s constructor come from the
    parent class, JFrame. The JFrame class lives in the javax.swing package. This
    package and another package, java.awt, have classes that help you put windows,
    images, drawings, and other gizmos on a computer screen. (In the java.awt package,
    the letters awt stand for abstract windowing toolkit).


    For a little gossip about the notion of a Java package, see Chapters 7 and 14.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_269_0.png)


    In the Java API, what people normally call a window is an instance of the javax.swing.
    JFrame class.


    # Classes and methods from the Java API


    Looking at Figure 9-3, you can probably tell that an instance of the SimpleFrame
    class doesn''t do much. The frame has only one button, and when you click the
    button, nothing happens. I made the frame this way to keep the example from becoming
    too complicated. Even so, the code in Listing 9-9 uses setTitle, setLayout, setDefaultCloseOperation,
    add, getSize and setVisible methods all belong to the javax.swing.JFrame class.
    Here''s a list of names you used:


    +   * setTitle: Calling setTitle puts on the frame''s title bar. (The new SimpleFrame
    object is calling its own setTitle.)


    +   * FlowLayout: An instance of the FlowLayout class positions objects on the
    frame in centered fashion. Because the frame in Figure 9-3 has only one button
    on it, that button is centered near the top of the frame. If the frame had eight
    buttons, five of them may be lined up in a row across the top of the frame and
    the remaining three would be centered along a second row.


    +   * setLayout: Calling setLayout puts the new FlowLayout object in charge of
    arranging components, such as buttons, and (The new SimpleFrame object is calling
    its own setLayout.)


    +   * setDefaultCloseOperation: Calling setDefaultCloseOperation tells what to
    do when you click the little in the frame''s upper right corner. (On a Mac, you
    click the little red circle in the frame''s upper left corner). Without this method
    call, the frame itself disappears, but the Java virtual machine (JVM) keeps running.
    To stop your program''s run, you have to perform one more stop. (You may have
    to look for a Terminate option in IntelliJ IDEA, or NetBeans.)


    Calling setDefaultCloseOperation(EXIT_CLOSE) tells Java to shut itself down when
    you click the x in the frame''s upper right corner. The alternatives to EXIT_CLOSE
    are HIDE_ON_CLOSE'
