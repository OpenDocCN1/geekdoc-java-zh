    \ from the C++ switch statement in the C/C++ language family, and the C/C++ switch\
    \ statement was quite clunky. The code in Listing 5-8 does the same thing as the\
    \ code in Listings 5-6 and 5-7, but the Listing 5-8 code works in all versions\
    \ of Java — old and new.\n\n# LISTING 5-8: A la recherche du temps perdu\n\n```\n\
    import java.util.Scanner;\n\nimport static java.lang.System;\n\npublic class TheVeryOldSwitcher\
    \ {\n\n    public static void main(String[] args) {\n        var keyboard = new\
    \ Scanner(System.in);\n        out.print(\"Which verse? \");\n        int verse\
    \ = keyboard.nextInt();\n\n        switch (verse) {\n            case 1:\n   \
    \             out.println(\"That's because he has no brain.\");\n            \
    \    break;\n            case 2:\n                out.println(\"That's because\
    \ he is a pain.\");\n                break;\n            case 3:\n           \
    \     out.println(\"Cause this is the last refrain.\");\n                break;\n\
    \            default:\n                out.println(\"No such verse. Please try\
