    # We are done yet?


    Here''s a pleasant surprise. When you write a program like the one shown previously
    in Listing 12-1, you don''t have to know how many names are in the input file.
    Having to know the number of names may defeat the purpose of using the easily
    expandable ArrayList class. Rather than loop until you read exactly nine names,
    you can loop until you run out of data.


    The Scanner class has several nice methods, such as hasInt, hasDouble, and plain
    old next. Each of these methods checks for more input data. If there''s more data,
    the method returns true. Otherwise, the method returns false.


    Listing 12-1 uses the general-purpose hasNext method. This hasNext method returns
    true as long as there''s anything more to read from the program''s input. After
    the program scoops up that last Hugh R. DaReader line in Figure 12-1, the subsequent
    hasNext call returns false. This execution condition ends while the loop and plummets
    the computer toward the remainder of the Listing 12-1 code.


    hasNext is quite handy. In fact, hasNext is so handy that it''s part of a bigger
    concept known as an iterator, and iterators are baked into all of Java''s collections.


    # Once and again


    An iterator spits out a collection''s values, one after another. To obtain a value
    from the collection, you call the iterator''s next method. To find out whether
    the collection has any more values in it, you call the iterator''s hasNext method.
    Listing 12-2 uses an iterator to display people''s names.'
