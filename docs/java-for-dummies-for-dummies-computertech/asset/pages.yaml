  md: '# # TO THE DECIMAL POINT AND BEYOND!


    Java has two different types that have digits beyond the decimal point: type double
    and type float. So, what''s the difference? When you declare a variable to be
    of type double, you''re telling the computer to keep track of 64 bits when it
    stores the variable''s values. When you declare a variable to be of type float,
    the computer keeps track of only 32 bits.


    You could change Listing 4-2 and declare amountInAccount to be of type float:


    ```

    float amountInAccount;

    ```


    Surely, by bits are enough to store a small number like 50.22, right? Well, they
    are and aren''t. You could easily store 50.00 with only 32 bits. Heck, you could
    store 50.00 with only 6 bits. The size of the number doesn''t matter. The accuracy
    matters. In a 64-bit double variable, you''re using most of the bits to store
    stuff beyond the decimal point. To store the .22 part of 50.22, you need more
    than the 32 bits that you get with type float.


    Do you believe what you just read — that it takes more than 32 bits to store 22?
    To help convince you, I made a few changes to the code in Listing 4-2. I made
    amountInAccount to be of type float. Then I changed the first three statements
    inside the main method:


    ```

    float amountInAccount;

    amountInAccount = 50.22F;

    amountInAccount = amountInAccount + 1000000.00F;

    ```


    (To understand why I used the letter F in 50.22F and 1000000.00F, see Table 4-1,
    later in this chapter) The output I got


    You have $1000000.25 in your account.


    Compare this with the output in Figure 4-5. When I switch from type double to
    type float, Charles has an extra three cents in his account. By changing to the
    32-bit float, I''ve clobbered the accuracy in the amountInAccount variable''s
    hundredths place. That''s bad.


    Another difficulty with float values is purely cosmic. Look at the literals, 50.22
    and 1000000.00, in Listing 4-2. The Laws of Java say that literals like these
    take up 64 bits each. So, if you declare amountInAccount to be of type float,
    you''ll run into


    (continued)'
