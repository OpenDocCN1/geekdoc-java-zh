    \ can accept mouse clicks. Better yet, start the download and wait ten minutes\
    \ before any other apps accept input of any kind.\n\nProgramming for multitasking\
    \ is surprisingly complex. So, in this chapter, I cover only a sliver of the subject\
    \ with examples from Java's Swing framework. Swing isn't the newest or slickest\
    \ toolset for creating graphical interfaces in Java, but Swing's structure illustrates\
    \ some important ideas in multithreaded programming.\n\nIn 2011, Oracle added\
    \ a newer framework — JavaFX to Java's bag of tricks. JavaFX provides a richer\
    \ set of components than Swing, but JavaFX requires a bit more setup than a Swing\
    \ app. If you're interested in reading more about JavaFX, visit https://openfx.io.\n\
    \nEvery major IDE has visual tools to help you design a GUI interface. With any\
