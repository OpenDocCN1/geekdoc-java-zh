- pgno: 472
  md: "If the condition resultset.next() is true, the result set has another row.\
    \ The computer moves to that other row, so you can march into the body of the\
    \ loop and scoop data from that row. On the other hand, if resultset.next() is\
    \ false, the result set has no more rows. You jump out of the loop and start closing\
    \ everything.\n\nNow imagine that Java is pointing to a row of the result set\
    \ and you're inside the loop in Listing 17-3. You're retrieving data from the\
    \ result set's row by calling the result set's getString and getFloat methods.\
    \ Back in Listing 17-1, you set up the AC table with the columns NAME, ADDRESS,\
    \ and BALANCE. Here in Listing 17-3, you're getting data from these by calling\
    \ your getSomeTypeOrOther methods and feeding the original column names to these\
    \ methods. After you have the data, you display the data on the computer screen.\n\
    \nEach ResultSet instance has several nice getSomeTypeOrOther methods. Depending\
    \ on the type of data you put into a column, you can call methods getBigDecimal,\
    \ getBlob, getInt, getObject, getTimestamp, and several others.\n\n![](img/2f445450c5bc2cc25baec2ca28bd7f1d_472_0.png)\n\
    \n# Destroying Data\n\nIt's true. All good things must come to an end. By writing\
    \ this, I'm referring both to this book's content and to the information in this\
    \ chapter's AccountDatabase db file.\n\nTo get rid of the database table you create\
    \ in Listing 17-1, run the code in Listing 17-4.\n\n+   Listing 17-4: Arrivederci,\
    \ Database Table\n\n```\npackage com.example.accounts;\n\nimport java.sql.Connection;\n\
    import java.sql.DriverManager;\nimport java.sql.SQLException;\nimport java.sql.Statement;\n\
    ```\n\n```\npublic class DropTable {\n\n    public static void main(String[] args)\
    \ {\n        final String CONNECTION = \"jdbc:sqlite:AccountDatabase.db\";\n\n\
    (continued)\n```"
