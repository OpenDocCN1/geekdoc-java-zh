- pgno: 427
  md: "To answer the question, I'll let the code in Listing 15-1 speak for itself.\
    \ In the listing code could talk, here's what the code would say:\n\nAs an interface,\
    \ my display method has a header but no body. A class that claims to implement\
    \ me (the Displayable interface) must provide (either directly or indirectly)\
    \ a body for the display method. That is, a class that claims to implement Displayable\
    \ must, in one way or another, provide its own code of the following:\n\n```\n\
    public void display() {\n    // Some statements go here\n}\n```\n\nTo implement\
    \ me (the interface in Listing 15-1), the new code's display method must take\
    \ no parameters and return nothing (also as void).\n\nThe Displayable interface\
    \ is like a legal contract. The Displayable interface doesn't tell you what an\
    \ implementing class already has. Instead, the Displayable interface tells you\
    \ what an implementing class must declare in its own code.\n\nIn addition to displaying\
    \ columns of numbers and tables, I may also want to summarize both kinds of data.\
    \ How do you summarize a column of numbers? I don't know. Maybe you display the\
    \ total of all the numbers. And how do you summarize a table? Maybe you display\
    \ the table's column headings. How do you summarize the data isn't my concern.\
    \ I care about is that you have some way to summarize the data.\n\nSo, I create\
    \ code containing a second Java contract. The second contract says, \"Whoever\
    \ signs this contract agrees to have a summarize method.\" In Listing 15-2, I\
    \ declare a Summarizable interface.\n\n# Listing 15-2: Another Interface\n\n```\n\
    package com.example.data;\n\npublic interface Summarizable {\n\nString summarize();\n\
    }\n```\n\nAny class claiming to implement the Summarizable interface must, by\
    \ hook or by crook, provide an implementation of a summarize method — a method\
    \ that returns a String value."
