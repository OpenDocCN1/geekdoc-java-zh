- pgno: 16
  md: 'On the other hand, if you''ve done these things (maybe in Visual Basic, Python,
    or C++), you''ll discover some interesting plot twists in Java. The developers
    of Java took the best ideas in object-oriented programming, streamlined them,
    reworked them, and reorganized them into a sleek, powerful way of thinking about
    problems. You''ll find many new, thought-provoking features in Java. As you find
    out about these features, many of them will seem quite natural to you. One way
    or another, you''ll feel good about using Java.


    # # Icons Used in this Book


    If you could watch me write this book, you''d see me sitting at my computer, talking
    to myself. I say each sentence in my head. Most of the sentences, I mutter several
    times. When I have an extra thought or a comment that doesn''t belong in the regular
    stream, I twist my head a little bit. That way, whoever''s listening to me (usually,
    nobody) knows I''m off on a momentary tangent.


    Of course, in print, you can''t see me twisting my head. I need some other way
    to set a thought in a corner by itself. I do it with icons. When you see a Tip
    or a Remember icon, you know that I''m taking a quick detour.


    Here''s a list of icons that I use in this book:


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_16_0.png)


    A tip is an extra piece of information — a helpful tidbit that the other books
    may forget to tell you.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_16_1.png)


    Everyone makes mistakes. Heaven knows that I''ve made a few in my time. Anyway,
    when I think people are especially prone to make a mistake, I mark it with a Warning
    icon.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_16_2.png)


    Sometimes I want to hire a skywriting airplane crew. "Barry," says "if you want
    to compare two numbers, the double equal sign. Please don''t forget to do this."
    Because I can''t afford skywriting, I have to settle for a more modest option:
    I create a paragraph marked with the Remember icon.


    ![](img/2f445450c5bc2cc25baec2ca28bd7f1d_16_3.png)


    "If you don''t remember what such-and-such means, see blah-blah-blah," or "For
    more information, read blahbity-blah-blah-blah."'
