    # # How to hold the line


    The last three statements in Listing 4-2 use a new formatting trick. You want
    to display several different items on a single line on the screen. You can put
    these items in separate statements. All but the last of the statements can continue
    printing on System.out. (The last statement is a call to System.out.println.)
    Calls to System.out. print text on part of a line and then leave the cursor at
    the end of the line. After executing System.out.print, the cursor is still at
    the end of the same line, so the next System.out.whatever can continue printing
    on that same line. With several calls to print capped off by a single call to
    println, the result is just one nice-looking line of output. (Refer to Figure
    4-5)


    A call to System.out.print writes some things and leaves the cursor sitting at
    the end of the line. A call to System.out.println writes things and then finishes
    the job by moving the cursor to the start of a brand-new line of output.


    Run the code in Listing 4-2 to make sure that it runs correctly on your computer.
    Then see what happens when you make the following changes:


