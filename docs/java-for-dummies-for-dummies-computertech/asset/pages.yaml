    \ is easy to use. Just step up and enter your PIN. After you enter your PIN, the\
    \ machine asks which of several variable names you want to use for your current\
    \ balance. You have a choice of balance324,myBal,currentBalance,b$, BALANCE,asj999,\
    \ or constNotIn. Having selected a variable name, you're ready to select a memory\
    \ location for the variable's value. You can select any number between 022FFF\
    \ and 0555AA. (Those numbers are in hexadecimal format.) After you configure the\
    \ teller machine's software, you can easily get your cash. You did bring a screwdriver,\
    \ didn't you?\n\n# Good programming\n\nWhen it comes to good programming practice,\
    \ one word stands out above all others: simplicity. When you're writing complicated\
    \ code, the last thing you want is to deal with somebody else's misnamed variables,\
    \ convoluted solutions to problems, or clever, last-minute kludges. You want a\
    \ clean interface that solves your own problems and no one else's.\n\nIn the automatic\
    \ teller machine scenario that I describe earlier, the big problem is that the\
    \ machine's design forces you to worry about other people's concerns. When you\
