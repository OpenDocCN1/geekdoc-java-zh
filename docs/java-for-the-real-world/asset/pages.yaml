  md: '# Chapter 8: Working with Databases


    The new annotation here is @OneToMany: there is one Order for many OrderItems.
    The mappedBy attribute Hibernate that it should use the order value to get a setter,
    it setOrder when returning OrderItems, and the cascade is used to describe the
    behavior of child objects when an operation occurs on the parent. Using CascadeType.ALL
    updates, inserts, and deletes on an Order will cascade down to OrderItems.


    As you can imagine, there are many annotations to fit the wide variety of relationships
    in databases. You might consider the JPA JavaDoc⁵ to get a feeling for what is
    possible.


    # Tell Me More: JPA implementations


    While Hibernate is far and away the most popular JPA implementation, it''s not
    the only one. The other options are EclipseLink³ and OpenJPA⁴. All implementations
    include their own annotations that provide advanced features beyond the JPA. So
    while Hibernate is usually the default choice, you might choose another implementation
    if you need access to a particular feature.


    When using JPA, Hibernate is usually configured using a persistence xml file or
    programmatically with Java. Neither of these options are proprietary, and therefore
    could be used with any JPA providers. For more details, see "Bootstrapping" in
    the official documentation⁵. If you use Spring Boot, the configuration is mostly
    taken care of automatically with a few values set in application.yml / application.properties.


    # XML Mappings


    The older method of mapping objects for Hibernate was via guessed-XML. You will
    have one MyClassName.hbm.xml for each entity in the application and it will need
    to be on the classpath. Each class lists the properties of the class (e.g. <property
    ...) and the relationships (e.g. <one-to-many ...>). Here''s the mappings for
    Order and OrderOrderItem. If you compare them to the JPA-annotated classes, you
    should notice similar terminology and structure, although some of the vocabulary
    does not match.


    > ⁵http://docs.oracle.com/javaee/7/api/javax/persistence/package-summary.html


    > ⁴http://www.eclipse.org/eclipselink#jpa


    > ³http://openjpa.apache.org


    > ⁶http://docs.jboss.org/hibernate/orm/5.2/userguide/html_single/Hibernate_User_Guide.html'
