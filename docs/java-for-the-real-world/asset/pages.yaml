  md: "Chapter 4: Testing\n\n# Writing Tests\n\n# JUnit\n\nJUnit is the most commonly\
    \ used testing framework in the Java world. It follows the xUnit tradition of\
    \ testing. So if you have used something like NUnit, PHPUnit, CppUnit, etc., you'll\
    \ be right at home. If not, the syntax is easy to pick up.\n\n# Tell Me: JUnit\
    \ versions\n\nBeing one of the older Java testing frameworks, JUnit has gone through\
    \ several significant revisions. However, these revisions are few and between\
    \ and with a major version change. JUnit4 was released in 2007 and JUnit5 was\
    \ released in 2017! This means that you will still see many projects JUnit4(or\
    \ maybe even 3), while only the newest projects JUnit5. For basic tests, there\
    \ isn't much difference although the names and locations of some JUnit tests have\
    \ been moved between versions. There are also, of course, features in the later\
    \ releases. The code in this book will use JUnit5 in order to keep up-to-date,\
    \ but understand that most of what you can learn here apply to any version.\n\n\
    All JUnit tests are public methods labelled with the @Test annotation. Of course,\
    \ to make the test meaningful, you will need to add an assertion. It's common\
    \ to statically import org.junit.api.Assertions(or org.junit.Assert.* in JUnit4)\
    \ in test classes in order to make tests more succinct. If you might find yourself\
    \ using assertEquals, assertTrue, and assertFail, but there are few other methods\
    \ that can come in handy. Here's some tests to validate the parsing using the\
    \ three mocked JSON files.\n\nDailySpecialTest.java\n\n```\n@Test\npublic void\
    \ GivenZeroSpecialsThenEmptyListReturned() throws Exception {\n    var json =\
    \ readFromFile(\"no_specials.json\");\n    var service = new DailySpecialService();\n\
    \    var parsedFlavors = service.parseFlavorsFromJson(json);\n    assertTrue(parsedFavors.isEmpty());\n\
    }\n\n@Test\npublic void GivenThreeSpecialsThenThreeFlavorsReturned() throws Exception\
    \ {\n    var json = readFromFile(\"three_specials.json\");\n    var service =\
    \ new DailySpecialService();\n    var parsedFlavors = service.parseFlavorsFromJson(json);\n\
    \    assertEquals(3, parsedFavors.size());\n}\n```"
