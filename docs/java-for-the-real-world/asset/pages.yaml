  md: '# Hibernate


    We just saw how MyBatis can bind POJO domain objects to SQL statements, but there
    was still overhead in manually writing out relatively basic SQL. Additionally,
    relationships between objects were annoying to work with. Object relational mappers
    (ORM) attempt to solve these problems by abstracting away SQL from the developer.
    Theoretically, given enough information about the objects, it is possible for
    all SQL to be generated programmatically.


    Hibernate was one of the first ORM tools for Java. It was not until a few years
    later when persistence was standardized with the Java Persistence API (JPA). The
    JPA provides no implementation—rather it allows third-party tools to leverage
    a common API. And it just so happens that Hibernate is the most commonly used
    third-party implementation. Having said that, it is still possible to use Hibernate
    without JPA. The sample code for this chapter includes two Hibernate projects:
    one that is more modern and leverages the JPA annotations and one that is an older
    style that uses native classes to interact with the database. For convenience,
    the annotations code example uses JPA interfaces while the XML code example uses
    Hibernate native objects, but it''s possible to mix and match. You should be familiar
    with all of these options as they are all still popular.


    # Domain POJO adjustments


    When using an ORM, the closer your domain objects match the database the less
    you will need to do. While it is certainly possible to handle abstract classes¹(e.g.
    an ingredient table with both Flavor and Topping classes), I don''t want to muddy
    your understanding of the JPA with those details. Instead, let''s change our domain
    objects match the database tables.


    > http://docs.oracle.com/javave/6/tutorial/doc/bnbm.html#bnubq'
