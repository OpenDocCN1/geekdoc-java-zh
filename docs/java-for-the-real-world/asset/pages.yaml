  md: "# Chapter 9: Logging\n\n# Log4j\n\nOne of the first third-party logging frameworks\
    \ for Java was Log4j, and it still quite quite today. There are two main concepts\
    \ in Log4j: appenders and loggers. An appender is something that log entries can\
    \ be written to. For example stdout, a file, a database, etc. A logger produces\
    \ messages and can send those messages to one or more appender.\n\n# Legacy Watch:\
    \ Log4j before 2.17.0\n\nAll log4j versions prior to 2.17.0 had significant, critical\
    \ security vulnerabilities undiscovered in 2021 (CVE-2021-45105, CVE-2021-45046\
    \ and CVE-2021-44228). NIST scored these vulnerabilities as 7.5, 9.0, and 10.0\
    \ out of. If you come across an older version, it should be updated immediately.\n\
    \nConfiguration for Log4j is done using XML, JSON, YAML, or a properties file.\
    \ The structure is the same for each, but the syntax obviously differs. For examples,\
    \ if you use YAML, keep in mind that it could easily translated to any of the\
    \ other formats. The first section of the configuration sets overall properties.\
    \ The most important thing here is the pattern saved in the format property.\n\
    \nlog4j.yaml\n\n```\nConfiguration:\n  status: warn\n  name: IScream\n  properties:\n\
    \    property:\n      name: format\n      value: \"[%5p] %c{1.} [%t] %m%n\"\n\
    \  thresholdfilter:\n    level: debug\n```\n\n# Tell Me Log: Log4j Patterns\n\n\
    The patterns for Log4j are dizzying to look at, and it's not a good idea to write\
    \ one from scratch. Instead, you should use your company's standard format for\
    \ logging. However, if you need to make adjustments, consult the Pattern Layout\
    \ documentation⁴.\n\nWarning: it's very easy to create expensive logging patterns!\
    \ The documentation notes certain things that are expensive, such as the file,\
    \ method, line, etc. of the log statement. Unless you really need these, avoid\
    \ them. (Remember that a stack trace will give you fully qualified classes and\
    \ line numbers for errors.)\n\n> ⁴https://logging.apache.org/log4j/2.0/manual/layouts.html#PatternLayout"
