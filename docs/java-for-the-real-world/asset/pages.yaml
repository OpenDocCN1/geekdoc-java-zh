  md: "# Chapter 8: Working with Databases\n\nMyMapper.java\n\n```\n@Mapper\npublic\
    \ interface MyMapper {\n    @Select(\"select name from Employee where id = #{id}\"\
    )\n    String getEmployeeName(@Param(\"id\") int id);\n}\n```\n\nI generally prefer\
    \ annotations to XML, but MyBatis is an exception. The XML implementations provide\
    \ for more flexibility and options. Furthermore, it is very helpful to easily\
    \ read the SQL in a mapper file and, often, copy it into a SQL editor to execute\
    \ the query directly against the database.\nWhat's really handy is that even though\
    \ the Mappers are just interfaces, you don't need to manually implement them!\
    \ MyBatis will create and default implementations for you. Of course, you can\
    \ implement them, you should need to provide a custom behavior.\n\n# Java Wart:\
    \ Over-layered database objects\n\nIn some applications it makes sense to draw\
    \ a distinction between your service layer and your data access layer. For example,\
    \ you might have a data access layer that knows only the CRUD (create, read, update,\
    \ delete) operations and a service layer that abstracts the operations into business\
    \ concepts. I've seen this to a frustrating extreme where each of those layers\
    \ has an interface and exactly one implementation. This is not unheard of: A MyServiceImpl\
    \ implements Service and contains a reference to a MyDao which is implemented\
    \ in MyDaoImpl! MyBatis can simplify this down to one object, which I encourage\
    \ you really need the flexibility\n\nMyBatis can work more closely with Java objects\
    \ than JDBC. This means you can pass custom domain objects as parameters to a\
    \ query and receive back custom domain objects as the result. MyBatis shows how\
    \ the IScream implementation can get the flavors and toppings as actual objects—no\
    \ manual mapping required.\n\ningredient-mapper.xml\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\" ?>\n<!DOCTYPE mapper\n  PUBLIC \"-//mybatis.org//DTD Mapper\
    \ 3.0//EN\"\n  \"http://mybatis.org/dtd/mybatis-3-mapper.dtd\">\n<mapper namespace=\"\
    com.letstalkdata.iscream.service.IScreamcreamService\">\n  <select id=\"getFlavors\"\
    \n      resultType=\"com.letstalkdata.iscream.domain.Flavor\">\n    select id,\
    \ ingredient_name as name, unit_price as unitPrice\n    from ingredient\n    where\
    \ ingredient_type = \\'ICE_CREAM'\n  </select>\n</mapper>\n```"
