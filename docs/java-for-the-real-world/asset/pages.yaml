- pgno: 36
  md: "# Chapter 4: Testing\n\nJUnit can also integrate with third-party testing libraries\
    \ to enhance its features. For example, if you add the Hamcrest testing library\
    \ (hamcrest-library.jar) to your project, you can use it with \"fluent\" matches\
    \ in a JUnit test.\n\nDailySpecialService.java\n\n```\n@Test\npublic void GivenOneSpecial_FlavorNameExtracted()\
    \ throws Exception {\n    var json = readJsonFromFile(\"one_special.json\");\n\
    \    var service = new DailySpecialService();\n    var parsedFlavors = service.parseFlavorsFromJson(json);\n\
    \    assertThat(parsedFlavors.isEqualTo(\"Salty Caramel\"));\n}\n```\n\nSome people\
    \ prefer this style of writing tests, but they always feel a little awkward in\
    \ Java.\n\n# TestNG\n\nIn many instances, TestNG was the first on the scene with\
    \ features now present in both TestNG and JUnit. For example: annotations, test,\
    \ and parameterized tests. As such, TestNG has many similarities to JUnit. It\
    \ is an xUnit framework and tests are public methods labelled with the @Test annotation.\
    \ Many of the assertions are in the framework, and you typically include static\
    \ org.testng.Assert.* in the class.\n\nBecause of these similarities, this test\
    \ looks (almost) exactly the same:\n\nDailySpecialService.java\n\n```\n@Test\n\
    public void GivenOneSpecial_FlavorNameExtracted() throws Exception {\n    var\
    \ json = readJsonFromFile(\"one_special.json\");\n    var service = new DailySpecialService();\n\
    \    var parsedFlavors = service.parseFlavorsFromJson(json);\n    assertEquals(parsedFlavors.get(0),\
    \ \"Salty Caramel\");\n}\n```\n\n(I said \"almost\" TestNG and JUnit flip the\
    \ order of the parameters in assertEquals()).\n\nUntil recently, JUnit did not\
    \ support test groups. Test groups allow you to execute different sets of tests\
    \ at different times. For example, you may have a handful of slow tests that you\
    \ don't need to run as frequently so you can group them separately from your fast\
    \ unit tests. Here are two sample tests, one of which is in a group:"
