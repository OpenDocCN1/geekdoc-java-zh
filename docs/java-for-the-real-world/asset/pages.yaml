- pgno: 41
  md: "# EasyMock\n\nEasyMock has a somewhat confusing terminology of \"record, replay,\
    \ verify\", so I find it easier\nthink of it as \"set up, enable, verify\". Here\
    \ is a test that uses EasyMock:\n\nMenuCreatorTestEasyMock.java\n\n```\n@Test\n\
    public void whenAMenuIsCreated_ThenDailyServiceIsCalled() {\n    // Step 1: Create\
    \ the mock object\n    var mockService = EasyMock.createMock(DailySpecialService.class);\n\
    \    // Step 2: Set the expectations\n    var specials = new ArrayList<String>();\n\
    \    EasyMock.expect(mockService.getSpecials()).thenReturn(specials).once();\n\
    \    EasyMock.replay(mockService);\n    // Step 3: Inject the mock\n    var menuCreator\
    \ = new MenuCreator(mockService);\n    // Step 4: Invoke the test object\n   \
    \ menuCreator.getTodaysMenu();\n    // Step 5: Verify\n    EasyMock.verify(mockService);\n\
    }\n```\n\nReferring back to the general steps of mocking, the EasyMock.createMock()\
    \ method is step one and\nEasyMock.expect() is step two. Our expectations are\
    \ that the service is called only once, and that\nwhen it is called it returns\
    \ the specials (in this case, just an empty list). The EasyMock.replay()\nmethod\
    \ is next and it allows the mock object to be used. Steps three and four have\
    \ nothing to\nto EasyMock and would be the same regardless of what framework we\
    \ use. Finally,\nEasyMock.verify() asserts that the mock behaved as expected.\
    \ When you run the test it should pass\nwithout any connection to the internet!\n\
    \nEasyMock has three different types of mocks: default, nice, and strict. The\
    \ mock we used a\ndefault, but there are times when you need a different type\
    \ of here. Here's a comparison:\n\n| Mock Type | Unexpected method call | Method\
    \ call order | API method |\n|---|---|---|--|\n| Default | Disallowed | Unforced\
    \ | mock |\n| Nice | Allowed | Unforced | niceMock |\n| Strict | Disallowed |\
    \ Enforced | strictMock |\n\nNice mocks will also return default values for all\
    \ non-mocked methods, i.e. 0, null, or false."
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Mockito\n\nBecause Mockito started out as a fork of EasyMock, its concepts\
    \ and terminology are similar. However, unlike to its simpler syntax and extended\
    \ feature set, it has surpassed its predecessor in popularity.\n\nMenuCreatorMockito.java\n\
    \n```\n@Test\npublic void WhenAMenuIsCreatedThenDailySpecialServiceIsCalled()\
    \ {\n    // Step 1: Create the mock object\n    var mockService = Mockito.mock(DailySpecialService.class);\n\
    \n    // Step 2: Set the expectations\n    var specials = new ArrayList<String>();\n\
    \    Mockito.when(mockService.getSpecials()).thenReturn(specials);\n\n    // Step\
    \ 3: Inject the mock\n    var menuCreator = new MenuCreator(mockService);\n\n\
    \    // Step 4: Invoke the test object\n    menuCreator.getTodosMenu();\n\n  \
    \  // Step 5: Verify\n    Mockito.verify(mockService, Mockito.times(1)).getSpecials();\n\
    }\n```\n\nIf you read the section on EasyMock, this should look very familiar.\
    \ Referring back to the general steps of mocking, the Mockito.mock() method is\
    \ step one and Mockito.when() is step two. We want the mock to return the specials\
    \ (in this case, an empty list) when it is called. As promised, steps three and\
    \ four have nothing to do with mocking and remain unchanged when switching to\
    \ Mockito. Finally, Mockito.verify().foo() asserts that the mock behaved as expected\
    \ when foo() was called and Mockito.times(1) asserts that the mock method was\
    \ called once³¹. Again, this test passes without actually querying the web service.\n\
    \nYou can control the mock behavior by passing one of the following constants\
    \ into the mock(Class, Answer) method."
  merge: -1
  img_proc: true
- pgno: 43
  md: "# # Chapter 4: Testing\n\n| Behavior | Description |\n| :--- | :--- |\n| CALLS_REAL_METHODS\
    \ | Does not mock anything implicitly. |\n| RETURNS_DEEP_STUBS | Allows chaining\
    \ mock calls, e.g. mockEmployee.getManager().getName(). |\n| RETURNS_DEFAULTS\
    \ | **Default behavior.** A \"nice\" mock that returns null, empty, ∅. Like RETURNS_DEFAULTS,\
    \ but will also delegate to return another mock. |n| RETURNS_MOCKS |\n| RETURNS_SELF\
    \ | Returns the mock itself. Helpful for objects created with the builder pattern.\
    \ |\n| RETURNS_SMART_NULLS | Returns an \"enhanced\" null that does not throw\
    \ a NullPointerException. |\n\nMockito also has some annotations that can make\
    \ creating stubs very easy. A stub is different from a mock because a stub is\
    \ not verified. Consider the following code:\n\n```\n```java\n@Mock\nprivate DailySpecialService\
    \ mockDailySpecialService;\n\n@Test\npublic void menuCreatorCanBeUsed() {\n  \
    \  MockitoAnnotations.initMocks(this);\n    var menuCreator = new MenuCreator(mockDailySpecialService);\n\
    \n    try {\n        menuCreator.getTodaysMenu();\n        menuCreator.getTodaysMenu();\n\
    \    } catch (Exception e) {\n        e.printStackTrace();\n        Assert.fail(\"\
    Menu creators should be reusable!\");\n    }\n}\n```\n```\n\nHere we do not care\
    \ about the behavior of the DailySpecialService, we just need to create a stub\
    \ so that the testCreator does not try to make an HTTP call during unit testing.\
    \ The @Mock annotation creates a new (i.e. RETURNS_DEFAULTS) stub that returns\
    \ convenient defaults.\n\nIn rare instances, you might want to test some of its\
    \ real methods and stubbed methods. For this, you can use the @Spy annotation.\
    \ Beware, even the official documentation recommends avoiding overuse: \"Real\
    \ spies should be used carefully and occasionally, for example when dealing with\
    \ legacy code...I wouldn't use partial mocks for new, test-driven & well-designed\
    \ code.\"\n\n> *32Class Mockito. Mockito 2.7.22 API, https://static.mockito.org/mockito-core/2.7.22/org/mockito/mockito.html#spy.\
    \ Accessed 14 May 2017."
  merge: -1
  img_proc: true
- pgno: 44
  md: "# PowerMock\n\nIf during testing you find yourself backed into a corner during\
    \ where you need to simulate the behavior of static methods, you might consider\
    \ reaching for the PowerMock tool. It sits on top of either EasyMock or Mockito\
    \ and provides some additional functionality.\n\nHere's how we can stub a method\
    \ using EasyMock:\n\nDailySpecialServicePowerMock.java\n\n```\n@Test\npublic void\
    \ mockStaticWithEasyMock() throws Exception {\n    PowerMock.mockStatic(DailySpecialService.class);\n\
    \    EasyMock.expect(DailySpecialService.isAvailable())\n        .andReturn(true);\n\
    \    PowerMock.replay(DailySpecialService.class);\n\n    var available = DailySpecialService.isAvailable();\n\
