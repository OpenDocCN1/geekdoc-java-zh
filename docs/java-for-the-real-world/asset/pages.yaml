    # Joda Time


    # Legacy Watch


    Prior to Java 8, the date and time libraries were error-prone and cumbersome to
    use. This was the motivation for the creators of Joda Time to create a user-friendly
    and safe datetime library. Java 8 introduced the java.time package (which borrows
    heavily from Joda Time) and fixes the problems with the old java.util.class. However,
    if your organization has migrated to Java 8, you might still find Joda Time if
    the project pre-dates Java 8.


    At the core of Joda Time is the Instant class which represents a point in time
    along the unix epoch timeline. You typically won''t need to create Instances,
    but you might use them to convert Joda Time objects into other Joda Time objects.


