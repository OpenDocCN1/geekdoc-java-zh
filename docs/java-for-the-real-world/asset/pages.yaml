- pgno: 24
  md: "# Chapter 3: Build Tools\n\n```\n<repositories>\n  <repository>\n    <id>xyzRepo</id>\n\
    \    <name>Company XYZ Repo</name>\n    <url>http://some-server/repo/</url>\n\
    \  </repository>\n</repositories>\n```\n\nIf multiple repositories are specified,\
    \ they are checked in order.\n\nThe distributionManagement section is used if\
    \ you need to deploy your artifact. This is most common if you are working on\
    \ an internal library that needs to be made available to other developers. Here's\
    \ an example:\n\n```\n<distributionManagement>\n  <repository>\n    <uniqueVersion>false</uniqueVersion>\n\
    \    <id>xyzRepo</id>\n    <name>Company XYZ Repo</name>\n    <url>http://some-server/repo/</url>\n\
    \  </repository>\n  <snapshotRepository>\n    <uniqueVersion>true</uniqueVersion>\n\
    \    <id>xyzSnapRepo</id>\n    <name>Company XYZ Snapshot Repo</name>\n    <url>http://some-server/repo-snapshots</url>\n\
    \    <layout>legacy</layout>\n  </snapshotRepository>\n</distributionManagement>\n\
    ```\n\n# ## Tell Me: Repositories\n\nRegardless of the size of your team, if you\
    \ internally-developed libraries in your projects, setting up an internal repository\
    \ is a good idea. Without one, you're forced to store the libraries in source\
    \ control. The most popular repository is Sonatype Nexus²,³ although Artifactory²⁴\
    \ is gaining traction.\n\nWith your own Maven repository you can store any build\
    \ artifact, not just internal libraries. I've found useful to store third-party\
    \ artifacts that are not available in Maven Central, such as Microsoft's SQL Server\
    \ database driver. You can also store artifacts that are in Maven cache which\
    \ you might to make downloads faster or to reduce version fragmentation among\
    \ your projects. Indeed, some companies allow developers to use only the corporate\
    \ repository.\n\n> ²http://www.sonatype.org/nexus/\n²⁴https://www.jfrog.com/artifact/"
