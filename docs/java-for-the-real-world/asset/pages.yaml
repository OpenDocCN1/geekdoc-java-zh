    \ String orderJson)\n    throws Exception {\n    var order = MAPPER.readValue(orderJson,\
    \ Order.class);\n    order.getOrderLineItems().forEach(li -> li.setOrder(order));\n\
    \    orderService.save(order);\n\n    return MAPPER.writeValueAsString(order);\n\
    }\n\n@RequestMapping(value = \"\", method = RequestMethod.GET,\n    produces =\
    \ \"application/json\"\n@ResponseBody\npublic String all() throws Exception {\n\
    \    var orders = orderService.getAllOrders();\n    return MAPPER\n        .writeWithDefaultPrettyPrinter()\n\
    \        .writeValueAsString(orders);\n}\n```\n\nDeciding between the two libraries\
    \ mostly comes down to what features you will need. To me, Gson is simpler to\
    \ use, but lacks the flexibility of Jackson. And if performance is a concern,\
