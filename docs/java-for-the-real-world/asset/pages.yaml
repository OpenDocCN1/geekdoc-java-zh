    \ you can look at a modified version of the IScream application in the sample\
    \ code.\n\n# MyBatis\n\nMyBatis is similar to Spring JDBC in that it still relies\
    \ on writing SQL. However, the important difference is that it uses reflection\
    \ to more tightly couple your domain objects to database operations.\n\n> Legacy\
    \ Watch: iBATIS\nMyBatis has roots in an older project \"iBATIS\" that was formally\
    \ retired in 2010. Although it has the core philosophy as MyBatis, it lacks many\
    \ of MyBatis features. If you're working on an iBATIS code base, you should be\
    \ able to find your way around after reading this section as the core concept\
    \ of mappers is relatively unchanged. As per the suggestion, copying the work\
    \ pattern you already see in the code base.\n\nFor all MyBatis operations, you\
    \ will need a reference to a SqlSession. To properly create a SqlSession, use\
    \ a SqlSessionFactory which can be created using a SqlSessionFactory! Most MyBatis\
    \ projects will have a mybatis-config.xml file in the resources directory. This\
    \ configuration file contains the information needed to get a connection to the\
    \ database and can be passed into a SqlSessionFactoryBuilder to create a SqlSessionFactory.\
    \ A new SqlSession should be created for each operation as it is not thread-safe."
