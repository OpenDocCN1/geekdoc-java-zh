    # Vaadin


    A common challenge for web application developers is that they need a solid understanding
    of a server-side language and the front end technologies: JavaScript, CSS, and
    HTML. In recent years has led to server-side Vaadin becoming popular. But for
    web developers, this barrier still exists. For experienced developers who are
    comfortable with all of the technologies, a considerable amount of time is spent
    marrying the front-end to the back-end. Vaadin attempts to solve this problem
    by abstracting most of the front-end, allowing developers to write web application
    code that resolves desktop complexity.


    In 2017, Vaadin released version 10 of their framework. This change was such a
    radical change from Vaadin 8 it''s necessary to discuss them. Both versions their
    history in Google technologies: Vaadin 8 is based on the Google Web Toolkit which
    translates pure Java code into HTML and JavaScript. Vaadin 10 are built using
    Vaadin Components which build off the Google Polymer JavaScript library.


    > Tell Me More: Choosing a Vaadin Version

    The framework changes when Vaadin made from 8 to 10 (the skipped version 9) were
    more than just-under-hood improvements. In fact, their product offering was reorganized
    into two products: Vaadin Components and Vaadin Flow. Vaadin Components are JavaScript
    components for building web applications and are distributed through Bower and
    npm. Vaadin Flow is the framework that provides an API to interface with Vaadin
    Components.


    While it''s obvious this is the new direction for the company, I personally feel
    that Vaadin Flow was a step back for the platform for Java developers. Some things
    are much simplified (such as working with CSS), but more emphasis is put on working
    at the HTML and JavaScript layer. As an example, instead of providing an API for
    select lists, they suggest hand coding <select> tags.


    Since Vaadin 8 is going to be supported until 2022, it is still a viable candidate
    for next applications. You should definitely consider if the future-proofing of
    Vaadin Flow outweighs the downsides.


    Like JSF, Vaadin hides the request-cycle from the developer and has no explicit
    concept of a'
