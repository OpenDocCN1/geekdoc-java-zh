    \n}\n```\n\n# Gradle Daemon\n\nYou may have noticed this note when running Gradle:\n\
    \nStarting a Gradle Daemon (subsequent builds will be faster)\n\nThe Gradle Daemon\
    \ is a feature of Gradle designed to make builders faster. The JVM is notorious\
    \ for being slow to start up (although this gets better with each new version).\
    \ And since Gradle requires a JVM to run, the JVM startup can slow down builds.\
    \ To mitigate this, Gradle creates a long-running background process. Future invocations\
    \ of gradle don't require a complete JVM startup.\n\nOn my machine, running gradle\
    \ clean build on the IScream for the first time took 5.35 seconds. The second\
    \ time it took 1.898 seconds.\n\nIf you ever find yourself with a slow build,\
    \ you can use --profile to help determine where the time is going. This will produce\
    \ a nice HTML report with breakdowns of the time spent on each task.\n\n# Summary\n\
    \nGradle brings a lot of flexibility and power to the Java build ecosystem. Of\
    \ course, there is always some danger with highly customizable tools-suddenly\
    \ you have to be aware of code quality in your build file. This is not necessarily\
    \ bad, but worth consideration when evaluating how your team will use the tool.\
    \ Furthermore, much of Gradle's power comes from third-party plugins. And since\
    \ Gradle is relatively new, it sometimes feels like you are using a bunch of plugins\
    \ developed by SomeRandomPerson. You may find yourself comparing three plugins\
    \ for the same thing, each having a few dozen GitHub Stars and little documentation\
    \ to boot. Despite these downsides, Gradle is gaining popularity and is particularly\
    \ appealing to developers who like to have more control over their builds."
