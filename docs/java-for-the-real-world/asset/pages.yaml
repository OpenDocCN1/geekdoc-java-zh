    \ similar to the inside part of the loop in the JDBC connection.\n\nIngredientService.java\n\
    \n```\nprivate RowMapper<Flavor> flavorRowMapper = (rs, rowNum) -> {\n    var\
    \ id = rs.getInt(\"id\");\n    var name = rs.getString(\"ingredient\");\n    var\
    \ unitPrice = rs.getBigDecimal(\"unit_price\");\n    return new Flavor(id, name,\
    \ unitPrice);\n};\n```\n\nBy combining this mapper with some SQL, we can get back\
    \ the flavors from the database as actual Flavor objects.\n\nIngredientService.java\n\
    \n```\npublic List<Flavor> getFlavors() {\n    var sql = \"select id, ingredient,\
    \ unit_price from ingredient \" + \n             \"where ingredient_type = 'ICE_CREAM'\"\
    ;\n    return jdbcTemplate.query(sql, flavorRowMapper);\n}\n```\n\nThe beauty\
    \ of Spring is that we don't have to worry about getting a database connection,\
    \ statement. Instead we focus only on the things that are specific to the application:\
    \ the domain object and the SQL.\n\nIf we want to use parameterized SQL, it's\
    \ as simple as passing the parameters to the method. Here's how we can retrieve\
    \ one by id:\n\nIngredientService.java\n\n```\nprivate static String INGREDIENT_BY_ID\
