  md: "# Chapter 4: Testing\n\n# MenuCreator.java\n\n```\npackage com.letstalkdata.iscream;\n\
    \nimport com.letstalkdata.iscream.service.DailySpecialService;\n\npublic class\
    \ MenuCreator {\n    private DailySpecialService dailySpecialService;\n\n    public\
    \ MenuCreator(DailySpecialService dailySpecialService) {\n        this.dailySpecialService\
    \ = dailySpecialService;\n    }\n\n    public String getTodayMenu() {\n      \
    \  var dailySpecial = dailySpecialService.getSpecials();\n        var menuItem\
    \ = new StringBuilder(\"Today's specials are:\\n\");\n        dailySpecials.forEach(s\
    \ ->\n            menuBuilder.append(\" \").append(s).append(\"\\n\");\n     \
    \   );\n        return menuItem.toString();\n    }\n}\n```\n\nThe MenuCreator\
    \ constructor contains a DailySpecialService instance because the MenuCreator\
    \ depends on it. When instance is passed in, we say it is injected. The term (\"\
    dependency injection\" will be especially relevant when we get to the chapter\
    \ on Spring!) Now that MenuCreator is set up, we can inject a mock DailySpecialService\
    \ in a test.\n\n# Creating a Test with Mocks\n\nThe basic steps for using a mock\
    \ are as follows:\n\n+   1. Create the mock object\n2. Set the expectations for\
    \ the mock object\n3. Inject the mock object into the test object\n4. Invoke the\
    \ test object\n5. Verify that the mock met the expectations\n\nSteps one, two,\
    \ and five are where the mocking frameworks are actually used. So theoretically,\
    \ if you wanted to switch mocking frameworks in a codebase, you would only need\
    \ to partially modify your tests."
