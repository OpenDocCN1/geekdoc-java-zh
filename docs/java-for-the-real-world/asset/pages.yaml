    \n# Summary\n\nWhile writing a build script takes some time up front, hopefully\
    \ you can see the benefit of one over passing commands manually to Java. Of course,\
    \ Ant isn't without its problems. First, there are few enforced standards in Ant\
    \ script. This provides flexibility, but at the cost of every build being entirely\
    \ different. In the same way knowing Ivy means you can jump into any codebase,\
    \ knowing Ant doesn't mean you can jump into any Ant file—you need to time to\
    \ understand it. Second, the imperative nature of Ant build scripts can get very,\
    \ very long. One example I found is over 2000 lines long¹⁶. Finally, we learned\
    \ Ant has no built-in capability for dependency management, although it can be\
    \ supplemented with Ivy. These limitations with some other build script annoyances\
    \ led to the creation of Maven in the early 2000s¹⁷.\n\n# Maven\n\nMaven is really\
    \ tools in one: a dependency manager and a build tool. Like Ant, it is XML-Based,\
    \ but unlike Ivy, it outlines fairly rigid standards. Furthermore, Maven is declarative\
    \ allowing you to define what your build should do and less about how to do it.\
    \ These advantages make Maven appealing; building files are much more standard\
    \ across projects and developers spend time tailoring the files. As such, Maven\
    \ has become somewhat of a facto standard in the Java world. In a 2016 survey,\
    \ 68% of developers used Maven as their primary build tool¹⁸.\n\n# But what is\
    \ it, really?\n\nMaven is a tool that manages the whole build cycle of a Java\
    \ codebase: fetching dependencies, compiling code, running tests, creating build\
    \ artifacts, deploying files. It can also be extended to run custom tasks using\
    \ plugins.\n\n> ¹⁶https://github.com/lexposon/scalatgt-scala/build/master.xml\n\
    \n> ¹⁷History of Maven. Maven Project. 26 March 2017, https://maven.apache.org/background/history-of-maven.html.\
    \ Accessed 1 April 2017.\n\n> ¹⁸Java Tools and Technologies Landscape 2016. Rebel\
    \ Labs, 14 July 2016, zeroturnaround.com/rebellabs/java-tools-and-technology-landscape-2016.\
    \ Accessed 15 March 2017."
  merge: -1
