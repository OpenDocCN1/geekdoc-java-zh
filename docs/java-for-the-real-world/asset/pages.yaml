  md: '# Java Wart: Backwards Compatibility


    The decision by Java''s maintainers to ensure compatibility across versions is
    perhaps one of the reasons why Java has remained so ubiquitous. With that decision
    comes a lot of baggage. To name a few things:


    +   - Some methods in java.util.Date have been deprecated since 1999!

    - For that matter, java.util.Date as a whole has largely been replaced by java.time.*.

    - Generic types are only used for compile time checks. They are erased at runtime.

    - The keywords cost and go are not implemented

    - There are wrapper classes for all the primitives, e.g. int and java.lang.Integer,
    boolean and Boolean, etc.

    - The collections Hashtable and Vector should usually be avoided, instead preferring
    HashMap and ArrayList. If you need collections with concurrency benefits, you
    should look at the options in java.util.concurrent.


    # JVM Varieties


    It may be surprising to learn that Oracle actually has two JVM products: the OracleJDK
    and the OpenJDK JVM. Prior to Java 11, in most situations it honestly did not
    matter which one you chose. There were some licensing implications and minor feature
    differences, but they largely worked the same. However, with the Java 11 release,
    the OracleJDK is only available to commercial customers with a support agreement.


    It is also worth noting that the JVM specification is public, anyone can make
    their own JVM. In fact, some people and companies have done just that. To name
    a few there are IBM''s J9, Azul''s Zing, and Excelsior''s JET. Third-party JVM
    implementations each have their own marketing pitch but it usually comes down
    to targeting different operating systems, improving performance, or adding features.'
