  md: "# Build files\n\nAnt build files are written in XML and are called build.xml\
    \ by convention. I know even saying \"XML\" makes some people shudder, in small\
    \ doses it isn't too painful. I promise. Ant calls the different phases of the\
    \ build process \"targets\". Targets are defined in the build file can then be\
    \ invoked using the ant TARGET command where TARGET is the name of the target.\n\
    \nHere's some common targets:\n\nbuild.xml\n\n```\n<target name=\"clean\">\n \
    \ <delete dir=\"build\"/>\n</target>\n```\n\nThe clean target is used to \"start\
    \ from scratch\" and remove all build artifacts.\n\nbuild.xml\n\n```\n<target\
    \ name=\"compile\">\n  <mkdir srcdir=\"src/main/java\">\\n  <javac srcdir=\"src/main/java\"\
    \ destdir=\"build/classes\" classpathref=\"classpath\"/>\n</target>\n```\n\nThe\
    \ compile target, unsurprisingly, compiles the Java source into class files. Notice\
    \ that we specify the root source directory as src/main/java.\n\nbuild.xml\n\n\
    ```\n<target name=\"jar\">\n  <mkdir dir=\"build/jar\"/>\n  <jar destfile=\"build/jar/IScream.jar\"\
    \ basedir=\"build/classes\"/>\n</target>\n```\n\nThe jar target builds a .jar\
    \ file of our application."
  merge: -1
  img_proc: true
