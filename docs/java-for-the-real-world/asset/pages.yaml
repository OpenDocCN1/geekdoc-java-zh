    # Writing Data


    In the same way Java data types and objects can be returned from a MyBatis query,
    Java data types and objects can be passed into MyBatis queries. This makes it
    relatively easy to save, update, or delete domain objects.


    Again working with a mapper file, we create the following insert statements to
    save an order:


    ```

    purchase-mapper.xml

    1 <<?xml version="1.0" encoding="UTF-8" ?>

    2 <!DOCTYPE mapper //>

    3 PUBLIC " "//mybatis.org//DTD Mapper 3.0//EN"

    4 "http://mybatis.org/dtd/mapper-3.dtd">

    5 <mapper namespace="com.lestalkdata.iscream.service.OrderService">

    6 <insert id="createPurchase"

    7 useGeneratedKeys="true"

    8 keyColumn="id"

    9 keyProperty="id"

    10 parameterType="com.lestalkdata.iscream.domain.Order">

    11 insert into purchase (total_price)

    12 values(#{total.price})\n13 </insert>

    14 <insert id="createPurchaseOrderItem" parameterType="map">

    15 insert into purchase_line_item(purchase_id, ingredient_id, units)

    16 values(#{purchaseId}, #{ingredientId}, #{units})\n17 </insert>

    18 </mapper>

    ```


    Again the *${property} syntax is used which will find the matching getter on a
    POJO or will be used as a key in a Map. Remembering that retaining the ID of the
    purchase is important, we can use the keyColumn and keyProperty attributes to
    set the ID on the POJO after the insert succeeds.


