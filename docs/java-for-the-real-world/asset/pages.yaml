    \ be laborious to correctly configure a Spring application, even with annotations.\n\
    \nIn 2014 the Spring released Spring Boot which is an opinionated tool designed\
    \ for rapid application development with the Spring platform. It favors convention\
    \ over configuration and makes it easy to skip the rigarmole of creating a new\
