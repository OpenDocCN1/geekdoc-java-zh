    \ We've seen @ComponentScan earlier in the chapter, but the other two annotations\
    \ are used to configure the application based on:\n\n+   - The settings you add\
    \ to this class (@Configuration)\n- What is on your classpath (@EnableAutoConfiguration)\n\
    \nUsually the main method is very simple. For example if the class is named Application.java.\n\
