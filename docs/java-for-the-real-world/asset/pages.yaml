    # JavaServer Faces


    JavaServer Faces (JSF) is a web technology that focuses more on the UI of an application
    and less on the backend wiring. Inside the controller is hidden from the developer
    and development is spent on the model and view. Of the web application tools we''ve
    discussed so far, it is perhaps the most divisive in the community. Some criticize
    it for hiding too much from the developer, adding statefulness, and coupling the
    view and model too tightly. On the other hand, some developers praise its reusability
    and productivity.


    # Managed Beans


    Unlike Spring, using JSF we don''t manually inject things into the view. Instead,
    the JSF application will create and access "managed beans" to interact with the
    model. Creating a managed bean is as simple as adding the @ManagedBean annotation
    to a class. Additionally, a scope should be applied to the bean that tells the
    application how long to hold onto the bean. You can see the list of scopes here*,
    but some common ones are:


    +   - ApplicationScoped: The bean is maintained for the whole run time of the
    application. This scope is typically used for global beans that many users access.

    - SessionScoped: The bean is maintained for the duration of the user''s session.

    - RequestScoped: The bean is maintained for one request-response cycle (this is
    also the default scope).


    The ISCream application, I created an IngredientService that can be used by all
    users and made the Order class request-scoped.


    Managed beans can also have managed properties which can be accessed by the view
    too. Because of the statefulness of JSF, I created a few managed properties in
    the Order class. We will see how these are used shortly.


    > *http://docs.oracle.com/javaee/6/tutorial/doc/girch.html'
