    \ Gson generally out-performs Jackson for small files.⁶⁸\n\n# Utility Libraries\n\
    \nThere are many general utility libraries for Java and indeed, your company may\
    \ have one of its own. Two that I highlight are Guava and Apache Commons.\n\n\
    # Guava\n\n# Collections\n\nGuava provides many handy utility methods for creating\
    \ collections. Prior to Java 9, creating collections of objects was tedious. Consider\
