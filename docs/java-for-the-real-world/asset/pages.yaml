    A Legacy Watch is a warning to be aware of something that you''re more likely
    to encounter in legacy applications. For brand new projects, you should try to
    avoid anything I mention in a Legacy Watch.


    # Hipster Watch


    A Hipster Watch is the opposite of a Legacy Watch. It alerts you to something
    that is relatively new in the Java world and may not yet have widespread adoption.
    This isn''t necessarily bad, just something to be aware of.


    # Tell Me More


    These sections will give you a bit more detailed information about something mentioned
    in the main text. They aren''t critical, but may be worth reading if something
    piqued your interest.


    # Setting up Your Workspace


    # Installing Java


    There''s many options to install Java depending on your operating system and preferences.


    *Homebrew* (macOS): brew cask install java


    *Chocolatey* (Windows): choco install jdk


    *Apt-Get* (Linux): sudo apt-get install default-jdk


    *SDKMAN*** (Unix-like): sdk install java


    Official builds (all): Go to [Oracle''s OpenJDK website](https://www.oracle.com/)
    and click on the version labelled "Ready for use". Download the tar.gz file for
    your and extract. You will need to add the location to your PATH.


    If you used a tool, it should put Java on your PATH, but to be sure, run java
    -version at the command line. You should see something like this:


    > *brew.sh

    *chocolatey.org

    *http://sdkman.io

    *jdk.java.net/'
