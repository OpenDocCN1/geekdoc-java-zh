  md: "# Chapter 10: Useful Third-Party libraries\n\nWhile the Java standard library\
    \ is quite robust, there are few notable augmentations that the open source community\
    \ has contributed that you should be familiar with. Since there's no support for\
    \ JSON in the standard library, we'll first look at Google's Gson and FasterXML's\
    \ Jackson. We'll review some general purpose libraries: Google's Guava and Apache\
    \ Commons. Finally a brief Legacy Watch about Joda time, the (sane) pre-Java 8\
    \ of working with dates and times.\n\n# JSON Support\n\nIn order to demonstrate\
    \ the translation between POJOs and JSON, we're going to add two new controller\
    \ routes to the ISCream web application. First will be an endpoint that shows\
    \ all of the orders in the database and second an endpoint for creating orders\
    \ via JSON. However, these are examples for learning how to work with JSON libraries,\
    \ **they are not examples of RESTful web services**! For information on how to\
    \ build a true web service in Spring Boot, \"Building a RESTful Web Service\"\
    .\n\n# Google Gson\n\nAll Gson operations rely on having an instance of .google.gson.Gson\
    \ available. Gson objects are thread-safe, so typically you need to create one\
    \ for the whole application. Although you can use new Gson(), the defaults are\
    \ almost not what you want. Instead, you can customize the object using GsonBuilder.\
    \ Here's one example:\n\nOrderController.java\n\n```\nprivate static final Gson\
    \ GSON = new GsonBuilder()\n    .setPrettyPrinting()\n    .setFieldNamingPolicy(FieldNamingPolicy.LOWER_CASE_WITH_UNDERSCORES)\n\
    \    .create();\n```\n\nWhile you have the Gson object you can use the toJson\
    \ and toJson methods to translate between POJOs and JSON. These methods are overloaded\
    \ to work with different objects, but I might find most often using Gson.fromJson(String\
    \ json, Class<T> classOf) and Gson.toJson(Object src).\n\nHere's the new controller\
    \ routes:\n\n> https://spring.io/guides/gs/rest-service/"
