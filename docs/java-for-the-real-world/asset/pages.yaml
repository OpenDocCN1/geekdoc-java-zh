  md: '# Chapter 9: Logging


    When Java was released, it did not include anything in the standard library for
    logging. Developers were stuck with System.out.println and System.err.println.
    While some would argue that''s sufficient, it''s almost always better to have
    more control over your logs. As such, the Log4j framework became popular in the
    early 2000s. A few years later Java had finally included a logging API (java.util.logging
    or JUL) in the standard library, but many people found it lacking and stuck with
    Log4j. Yet library developers found themselves in a difficult position trying
    to accommodate both Log4j and JUL users.


    The solution was using logging facades, which led to the development of Apache
    Commons Logging and Simple Logging Facade (SLF4J). In 2006, another framework,
    Logback, started to gain traction (Side note: the same developer, Ceki Gulcu,
    wrote Log4j, SLF4J, and Logback!) While effort to make logging in Java easy for
    developers is commendable, result is a sea of possible combinations and headaches
    for something that should be extremely.


    # java.util.Logging


    It''s usually a good idea to prefer a standard library implementation to a third-party
    implementation, using java.util.logging or JUL is an obvious choice. To configure
    the logger, you need to create a logging.properties file and set a JVM property
    java.util.logging.config.file to the filepath for the configuration file. There
    are many configuration options depending on the log handler type. A logger is
    a general category of log message destination, e.g FileHandler, SocketHandler,
    etc. Each handler has different configuration options, which can be found in the
    respective JavaDoc (for example, FileHandler). Here is a sample configuration
    from the example code that sends log to a file and stands out.


    logging.properties


    ```

    # VV argument java.util.logging.config.file must point to this file!


    .level = WARN

    com.letstalkdata.level = FINE

    nhandlers = java.util.logging.FileHandler,java.util.logging.ConsoleHandler

    java.util.logging.SimpleFormatter.format = [%1$tc] %4$s: %2$s -5$s %6$s%n

    ```


    > ³⁵https://12factor.net/logs

    ⁴https://docs.oracle.com/java/7/docs/api/java/util/logging/FileHandler.html'
