- pgno: 50
  md: '# Tell Me More: Java Beans


    A JavaBean is a Java object that meets a set of certain requirements, with the
    intention of being reused in or across applications. The requirements are that
    the class must:


    +   - Have a public zero-argument constructor

    - Expose its properties via getters and setters

    - Be serializable (i.e. implement java.io.Serializable)


    Some frameworks require JavaBeans or at least work with JavaBeans. Although Spring
    calls its managed beans, it is flexible on the requirements. Thus a Spring "bean"
    may not be a true JavaBean.


    The first bean we define is the service. The id is any name you choose and the
    class is, of course, the type of object you want to create.


    ```

    applicationContext.xml

    <bean id="dailySpecialBean" class="com.letstalkdata.iscream.service.DailySpecialService"
    />

    ```


    Next, we create the Printer which includes a property in the definition. The name
    of the property must match the name in the actual Java class (i.e.dailySpecialService)
    and the ref refers to another bean in the XML file (i.e.dailySpecialServiceBean).


    ```

    applicationContext.xml

    <bean id="dailySpecialPrinter" class="com.letstalkdata.iscream.DailySpecialPrinter">

    <property name="dailySpecialService" ref="dailySpecialBean"/>

    </bean>

    ```


    The last step to prop Spring into configuring the application is to get a reference
    to the Application Context in the main method and create the Printer using the
    context. This is referred to as "bootstrapping".'
