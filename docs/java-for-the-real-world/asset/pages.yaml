  md: "# JSF Views\n\nLike Thymeleaf, JSF views are XHTML files that use custom extensions\
    \ to instruct the server on how the response should be constructed. However, JSF\
    \ relies much heavily on custom tags. Indeed, most JSF XML files use almost exclusively\
    \ custom tags. This is how to create the now-familiar \"flavors\" drop down in\
    \ JSF:\n\n```\n<h:selectMenu id=\"flavor\" class=\"form-control\" value=\"#{order.flavor}\"\
    >\n<f:selectItems value=\"#{ingredientsService.flavors}\" var=\"flavor\" itemLabel=\"\
    #{flavor}\" itemValue=\"#{flavor}\"/>\n</h:selectMenu>\n```\n\nHere we see the\
    \ bound ingredientsService used to populate the items of the select list. Importantly,\
    \ we also see value=\"#{order.flavor}\". This is how we bind view data back to\
    \ the order. The bean is bound and we can access the flavor value because we have\
    \ a setFlavor method.\n\nAfter binding the data into the model, we need to display\
    \ the calculated cost to the user. Instead of doing a page redirect, we can use\
    \ the JSF built-in support of AJAX. This is also where we manage the advantage\
