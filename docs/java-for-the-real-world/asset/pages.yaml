  md: "# Chapter 9: Logging\n\nOrderService.java\n\n```\nprivate static final Log\
    \ log = LogFactory.getLog(OrderService.class);\n```\n\nThe six log levels in Log4j\
    \ are available in JCL (including \"fatal\" SLF4J drops). However, the logging\
    \ methods are a bit more restrictive. There is no support for parameters, so you\
    \ must prepare your log messages first.\n\nOrderService.java\n\n```\n@Transactional\n\
    public void save(Order order) {\n    log.debug(\"Trying to save order.\");\n \
