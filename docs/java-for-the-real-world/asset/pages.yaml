    # Writing Data


    # JPA


    As you can imagine, the OrderService for JPA is going to look quite different
    from what we heavy lifting is an EntityManager. Similar to MyBatis, one way to
    obtain an EntityManager via EntityManagerFactory > EntityManagerFactory > EntityManager.
    The EntityManager has three methods that loosely map to "insert", "update", and
    "delete": persist, merge, remove.⁵⁷


    Here''s where the real power of ORMs is revealed: no SQL is written, but using
    the annotations, the JPA provider allows to create entities to save the Order
    and its child OrderLineItems! This means an object is usually just one line of
    code:


    OrderService.java


    ```

    20 @Transactional

    21 public void save(Order order) {

    22     entityManager.persist(order);

    23 }

    ```


    # Native Hibernate


    If you are not using JPA, the worker class is a Hibernate SessionFactory which
    can be used to create Sessions. One Session is used per unit-of work


    ⁵⁷http://docs.jboss.org/hibernate/orm/5.2/userguide/html/single/Hibernate_User_Guide.html#appendix-legacy-bootstrap

    ⁵⁸ The persist and merge methods are also non-trivial and this StackOverflow answer
    gives a good discussing the differences.'
