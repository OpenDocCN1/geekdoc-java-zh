    \ to include certain variables that remain for the entire duration the JVM is\
    \ running. This is done with the syntax -key=value where key and value are the\
    \ actual property name and value. These are known as \"System Properties\" or\
    \ \"System Variables\". Properties are defined by the JVM specification, custom\
    \ properties can be set too.\n\n# Spring Boot\n\nThe Spring group has done a wonderful\
    \ job making sure that their components play nicely together. However, developers\
    \ have a knack of making things more difficult and it's not uncommon to come across\
