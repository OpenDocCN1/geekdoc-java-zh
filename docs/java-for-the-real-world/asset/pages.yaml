    \ project.\n\n# Logback\n\nThe documentation for Logback* starts off, \"Logback\
    \ is intended to be a successor to the popular Log4j project\". Despite the popularity\
    \ of Log4j, many lessons were learned over the years and the creators of Log4j\
    \ decided to start a new project. Although it reached a 1.0.0 release in 2011,\
    \ it is only within recent years that Logback has started gaining significant\
    \ adoption.\n\nLogback configuration can be done with a logback.xml file or a\
    \ logback.groovy file. Just like Log4j, Logback has the concept of appenders and\
    \ loggers, and much of the terminology is similar. Here is the configuration file\
    \ that logs to the console and a rolling file:\n\n```\nlogback.xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<configuration>\n  <property name=\"format\" value=\"\
    [%5p] %c{35} [%t] %m%n\"/>\n  <appender name=\"STDOUT\" class=\"ch.qos.logback.core.ConsoleAppender\"\
    >\n    <layout class=\"ch.qos.logback.classic.PatternLayout\">\n      <Pattern>${format}</Pattern>\n\
    \    </layout>\n  </appender>\n</configuration>\n```\n\n> * https://logback.qos.ch/index.html"
