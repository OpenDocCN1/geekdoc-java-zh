- pgno: 25
  md: '# Summary


    Although Maven has made considerable strides in making builds easier, all Maven
    users have found themselves banging their head against the wall with a tricky
    Maven problem at one time or another. I''ve already mentioned some usability problems
    with plugins, but there''s also the problem of "The Maven Way". Anytime a build
    deviates from Maven expects, it can be difficult to put in a work-around. Many
    projects are "normal...except for that one weird thing we have to do". And the
    more "weird things" in, the harder it is to bend Maven to your world. Although
    I don''t quite agree with one blogger who says, "Maven builds are an infinite
    cycle of despair that will slowly drag you into the deepest, darkest pits of hell..."2,
    I relate!


    Wouldn''t it be great if we could combine the flexibility of Ant with the features
    of Maven? That''s exactly what Gradle is trying to do.


    # Gradle


    The first thing you will notice a Gradle build script is it is not XML! In fact,
    Gradle uses a domain specific language (DSL) by Groovy, which is another programming
    language that can run on the JVM.


    # Tell Me: Groovy


    Because the specification for the JVM is freely available, it is possible to write
    other programming languages that compile to Java byte code. Groovy is one such
    language. Although it''s sometimes considered a scripting language (largely because
    you don''t need the overhead of a class to get going), it can be used to write
    full applications. Give it a try3!


    ```

    def name = ''World''

    println("Hello, $name!")

    ```


    The DSL defines both the core parts of the build file and specific build steps
    called "tasks". It is also extensible making it very easy to define your own tasks.
    And of course, Gradle has a rich third-party plugin library. Let''s dive in.


    # Hipster Watch: Gradle


    Although it''s gaining popularity, Gradle is relatively new. Since the Java ecosystem
    as a whole needs to move slowly, you''d be surprised if you encounter it in open-source
    projects.


    > 2Spillner, Kent. "Java Build Tools: Ant vs. Maven". 14 November 2009, http://kent.spillner.org/blog/work/2009/11/14/java-build-tools.html.
    Accessed 10 March 2017.

    3http://groovy-lang.org'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# Chapter 3: Build Tools\n\n# Build files\n\nGradle files are appropriately\
    \ named build.gradle and start out by configuring the build. For our project we\
    \ take advantage of a fat jar plugin, so we will add the Shadow plugin to the\
    \ build script configuration.\n\n```\nbuild.gradle\nbuildscript {\n    repositories\
    \ {\n        jcenter()\n    }\n    dependencies {\n        classpath 'com.github.jelman.gradle.plugins:shadow:1.2.4'\n\
    \    }\n}\n```\n\nIn order for Gradle to download the plugin, it has to look in\
    \ a repository, which is an index for artifacts. Some repositories are known to\
    \ Gradle and can be referred to simply mavenCentral() or jcenter(). The team decided\
    \ not to reinvent the wheel when it comes to repositories and relies on the existing\
    \ Maven and Ivy dependency ecosystems.\n\n# Tasks\n\nFinally after Ant's once\
    \ \"target\" and Maven's confusing \"phase\", Gradle gave a reasonable name to\
    \ their build steps: \"task\". We use Gradle's api to give access to certain tasks.(The\
    \ java plugin is built in Gradle which is why we do not need to declare it in\
    \ the build's dependencies).\n\n```\nbuild.gradle\napply plugin: 'java'\\apply\
    \ plugin: 'com.github.johnrengelman.shadow'\n```\n\nThe java plugin will give\
    \ you common tasks as clean, compileJava, test, etc. The shadow plugin will give\
    \ you the shadowTask which builds a fat jar. To see a complete list of the available\
    \ tasks, you can run gradle -q tasks. Here's an abridged list of the most common:\n\
    \n+   - assemble: Assembles the objects of this project.\n- build: Assembles and\
    \ tests this project.\n- clean: Deletes the build directory.\n- jar: Assembles\
    \ a jar archive containing the main classes.\n- javadoc: Generates Javadoc API\
    \ documentation for the main source code.\n- test: Runs the unit tests.\n\nTasks\
    \ can be configured in the build script by creating a block with the name of the\
    \ task followed by braces. For example, this is how the shadowJar task is configured:"
  merge: -1
  img_proc: true
- pgno: 27
  md: "# Chapter 3: Build Tools\n\n23\n\n```\nbuild.gradle\nshadowJar {\n    baseName\
    \ = 'iscream'\n    manifest {\n        attributes 'Main-Class': 'com.letstalkdata.iscream.Application'\n\
    \    }\n}\n```\n\nIt's also possible to define your own tasks in a build. Because\
    \ the Gradle DSL is based on Groovy programming language, the possibilities are\
    \ nearly endless. As a simple example that shows off some Groovy, this task will\
    \ print the files for compilation. It is invoked by gradle printClasspath.\n\n\
    ```\ntask printClasspath {\n    sourceSets.each { source ->\n        println(source)\n\
    \        def tree = source.compileClasspathAsFileTree()\n        tree.files.each\
    \ { f -> println(f.name) }\n    }\n}\n```\n\n# Dependency Management\n\nWe've\
    \ already seen how a build script can rely on a plugin dependency, so extrapolating\
    \ to code dependencies will be straight-forward. Again we create repositories\
    \ section and a dependencies section. At first it might seem like this a duplication,\
    \ but there is a key difference. Repositories and dependencies outside of buildscript\
    \ are used to run the build itself; repositories and dependencies are used to\
    \ compile your application code.\n\n```\nbuild.gradle\nrepositories {\n    mavenCentral()\n\
    }\ndependencies {\n    compile group: 'com.google.guava', name: 'guava', version:\
    \ '26.0-jre'\n}\n```\n\nHere's the complete script:"
  merge: -1
  img_proc: true
- pgno: 28
  md: "# Chapter 3: Build Tools\n\nbuild.gradle\n\n```\nbuildscript {\n  repositories\
    \ {\n    jcenter()\n  }\n  dependencies {\n    classpath 'com.github.jengelman.gradle.plugins:shadow:1.2.4'\n\
    \  }\n}\n\napply plugin: 'java'\napply plugin: 'com.github.johnrengelman.shadow'\n\
    \ngroup = 'com.letstalkdata'\nversion = '0.0.1-SNAPSHOT'\nsourceCompatibility\
    \ = 11\ntargetCompatibility = 11\n\nrepositories {\n  mavenCentral()\n}\n\ndependencies\
    \ {\n  compile group: 'com.google.guava', name: 'guava', version: '26.0-jre'\n\
    }\n\nshadowJar {\n  baseName = 'iscream'\n  manifest {\n    attributes 'Main-Class':\
    \ 'com.letstalkdata.iscream.Application'\n  }\n}\n```\n\nNow that the build knows\
    \ how to find the project's dependencies, you can run gradle shadowJar to create\
    \ a jar that includes the Guava dependency. After it completes, you should see\
    \ /build/lib/iscream-0.0.1-SNAPSHOT-all.jar, which can be ran in the usual way\
    \ (java -jar ...).\n\nIf your project needs to use artifacts stored an internal\
    \ repository, you can include additional repositories in one of two ways, depending\
    \ on the type of repository.\n\n# Maven"
