    \ and gradle bootRun to compile and run the application from the command line.\n\
    mn spring-boot:run and gradle bootRun to compile and run the application from\
    \ the command line.\n\n# Configuration\n\nAs we've seen so far, Spring can be\
    \ a big help in making configuration easier. Spring Boot formalizes the concept\
