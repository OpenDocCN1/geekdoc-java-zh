  md: "# Chapter 10: Useful Third-Party libraries\n\n# Strings\n\nSplitting strings\
    \ can usually be done with String.split(), but its behavior isn't consistent and\
    \ can be frustrating to use with user-provided data. The Splitter class is explicit\
    \ in how it splits strings because you configure it.\n\n```\nIterable<String>\
    \ it = Splitter.on(',')\n  .trimResults()\n  .omitEmptyStrings()\n  .split(\"\
    foo,,, qux\");\n```\n\nList<String> strings = Lists.newArrayList(it);\n\n```\n\
    assert 3 == strings.size();\nassert \"foo\".equals(strings.get(0));\nassert \"\
    bar\".equals(strings.get(1));\nassert \"qux\".equals(strings.get(2));\n```\n\n\
    There are also utility methods to convert casing:\n\n```\nassert \"hello-world\"\
    .equals(CaseFormat.UPPER_UNDERSCORE\n  .to(CaseFormat.LOWER_HYPHEN, \"HELLO_WORLD\"\
    ));\n```\n\n# Caches\n\nYou've probably heard this before: \"There are only two\
