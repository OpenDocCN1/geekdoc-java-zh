  md: "# Chapter 3: Build Tools\n\npom.xml\n\n```\n<dependencies>\n  <dependency>\n\
    \    <groupId>com.google.guava</groupId>\n    <artifactId>guava</artifactId>\n\
    \    <version>26.0-jre</version>\n  </dependency>\n</dependencies>\n```\n\nAs\
    \ with Ivy, the easiest way to find the correct values are from the project's\
    \ website or the MVNRepository²⁰ site.\n\nThe last piece of the POM is the build\
    \ section which includes the configurations to build an executable .jar file.\n\
    \n# Plugins\n\nA major factor in Maven's prolonged success is its extensibility\
    \ via plugins. As technology changes, Maven is still viable because it can be\
    \ augmented with third-party plugins. For example, today you can find plugins\
    \ for everything from web frameworks to documentation generators to Android to\
    \ Docker.\n\nFor our simple build, we only need to use one of Apache’s official\
    \ plugins–the Shade plugin is used to build fat .jar files.\n\npom.xml\n\n```\n\
    <build>\n  <plugin>\n    <groupId>org.apache.maven</groupId>\n    <artifactId>maven-shade-plugin</artifactId>\n\
    \    <version>2.3</version>\n    <executions>\n      <execution>\n        <phase>package</phase>\n\
    \        <goals>\n          <goal>shade</goal>\n        </goals>\n      </execution>\n\
    \    <configuration>\n      <transformers>\n        <transformer implementation=\n\
    ```\n\n> ²⁰https://mvnrepository.com"
  merge: -1
  img_proc: true
- pgno: 23
  md: "# Chapter 3: Build Tools\n\n```\n\"org.apache.maven.plugins.shade.resource.ManifestResourceTransformer\"\
    >\n<mainClass>\n    com.letstalkdaiscream.Application\n</mainClass>\n</transformer>\n\
    <transformers>\n</configuration>\n</execution>\n</executions>\n```\n\nThere’u29s\
    \ a lot going on here, but you can mostly focus on the phase (package) and the\
    \ goal (shade). That means when you run mvn package (or any \"higher\" phase),\
    \ the shade goal of the plugin will run. That is the goal that builds must hook\
    \ into the Maven lifecycle. In the example, the Shade plugin hooks into package.\n\
    \nOne complaint of plugins is that it's not really possible to stand-alone goals,\
    \ and creating your own custom plugins requires more XML boilerplate²¹\n\nAnother\
    \ challenge of working with plugins is that it is not immediately obvious what\
    \ they can do. Furthermore, figuring out the correct configuration is difficult\
    \ without good documentation. For example, we have to go down six levels in the\
    \ POM to tell the plugin our main class. And since the configuration is done through\
    \ XML, it is possible to have a valid XML file that the plugin can read but doesn't\
    \ know how to interpret, leading to frequent error messages. My best advice is\
    \ to check the documentation, find a example in one of the existing projects you're\
    \ working on, or consult the perennial Stack Overflow! Configuring a plugin from\
    \ scratch is often a sisyphean effort.\n\nAt this point you can run mvn package\
    \ and you will see the iscream-0.0.1-SNAPSHOT.jar file inside the target folder.\
    \ If you run java -jar iscream-0.0.1-SNAPSHOT.jar you should see the new output\
    \ of the application.\n\n# Repositories and Distribution\n\nAlthough we don't\
    \ need the repositories and distributionManagement sections for our build, they\
    \ are worth mentioning as they are fairly common in company-internal projects.\n\
    \nA repository in the Maven world is a place where artifacts are stored that Maven\
    \ can access. By default, Maven knows about and uses the Maven Central² repository.\
    \ When building an application for the first time, artifacts are downloaded into\
    \ your local repository. Jokingly, people sometimes call this \"downloading the\
    \ entire internet\" because of the endlessly dependency tree Maven walks through.\
    \ However, the artifacts are stored locally on your computer, which makes future\
    \ build faster. If your project needs to use artifacts from an internal repository\
    \ (or public artifacts not in Maven Central), you can include additional\n\n>\
    \ ²¹https://developer.jboss.org/wiki/CreatingCustomLifecycleInMaven?sacc=t\n²¹https://repo.maven.org/maven2"
  merge: -1
