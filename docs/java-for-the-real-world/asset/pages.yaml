    \ Gson vs Jackson vs JSONP.\\ Takipi Blog, 28 May 2015. http://blog.takipi.com/the-ultimate-json-library-json-simple-vs-gson-vs-jackson-vs-jsonp/.\
    \ Accessed 9 September 2017."
