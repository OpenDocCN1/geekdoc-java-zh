  md: "# Tell Me More: Mocky\n\nIf you ever need to quickly stub a web service that\
    \ is actually available over HTTP, I recommend Mocky. You provide a response code,\
    \ content type, headers, and instantly get a permanent URL that always returns\
    \ your inputs. Note: I found that the site supports SSL, the certificate isn't\
    \ a full chain and will throw an SSL exception. Until this is resolved, just use\
    \ the non-secure http URL.\n\nThe method we're most interested in is parseFlavorsFromJson\
    \ and it's what we'll be testing. In a real application we would course not do\
    \ this by hand! To start, see Chapter 10 for a discussion on JSON libraries. We'll\
    \ create DailySpecialServiceTest.java in the folder src/test/java/com/letstalkdata/iscre\
    \ Notice that this parallels the structure of the actual class. There are three\
    \ good reasons for this:\n\n+   1. It keeps your test reasonably organized.\n\
    2. If you are using a building tool, you can exclude anything in the test folder\
    \ from being included in your builds.\n3. If you are using a building tool, identically\
    \ named files in the test folder override files in the main folder. We'll see\
    \ an example of how this can aid testing shortly.\n\nWhen working with JSON, I\
    \ like to store the test data as static files outside of the code for cleanliness.\
    \ These three samples are included in the src/test/resources/json-samples folder:\n\
    \nno-specials.json\n\n```\n{\n  \"specials\": [ ]\n}\n```"
