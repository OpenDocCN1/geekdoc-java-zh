    \ for different runtime.\n\nSpring configuration files have the name application.properties\
    \ or application.yml and profiles are named application-foo.properties or application-foo.yml\
    \ where foo is the profile name. When using yaml files, property names are \"\
    unpacked\" that spring.foo.bar=baz:\n\n```\nspring:\n  foo:\n    bar: baz\n```\n\
    \nTaking the examples from the previous section on properties, here's how you\
    \ could create the profiles to toggle between different IScream services:"
