  md: "# Chapter 8: Working with Databases\n\nAlternatively, you can use Spring to\
    \ take care of this for you. If you have a DataSource bean in your application,\
    \ Spring can inject a SqlSession wherever you need it. Furthermore, a Spring-created\
    \ SqlSession is thread-safe and can be used in transactions with no additional\
    \ configuration.\n\n# But what is it, really?\n\nMyBatis is a tool that maps SQL\
    \ to service and domain objects automatically by reflection.\n\n# Querying Data\n\
    \nThe primary object in a MyBatis operation is a \"Mapper\". The role of the Mapper\
    \ is to translate SQL and Java objects. A Mapper is a Java class backed by SQL\
    \ that is stored either in an XML file or in the class itself. For example XML:\n\
    \n```\nmy-mapper.xml\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE\
    \ mapper\n    PUBLIC \"-//mybatis.org//DTD Mapper 3.0//EN\"\n    \"http://mybatis.org/dtd/mybatis-3-mapper.dtd\"\
    >\n<mapper namespace=\"com.example.service.MyMapper\">\n    <select id=\"getEmployeeName\"\
    \ result=\"string\">\n        select name\n        from Employee\n        where\
    \ id=#{id}\n    </select>\n</mapper>\n```\n```\n\n```\nMyMapper.java\n```java\n\
    @Mapper\npublic interface MyMapper {\n    String getEmployeeName(@Param(\"id\"\
    ) int id);\n}\n```\n```\n\nOr using just Java:"
