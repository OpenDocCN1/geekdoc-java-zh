  md: '# Caveats


    # Memory


    If you are running multiple containers on a Docker host (which you should be!),
    it''s a good idea to

    put some bounds on how much memory the containers can use. Otherwise, a memory
    leak in

    application could negatively impact others. Docker allows you to limit the memory
    a container uses

    with the --memory flag, but if you are using Java 9 or earlier, it is critical
    that you also limit the memory

    at the JVM level! (For more details on why, see Java Inside Docker: What You Must
    Know to Not FAIL** by Rafael Benvides). This requires two steps.


    First, modify your Dockerfile to pass $JAVA_OPTS to the java command in:


    ```

    ENTRYPOINT [ "sh", "-c", "java $JAVA_OPTS -jar /app.jar" ]

    ```


    Second, when creating a container, limit the container memory and set $JAVA_OPTS
    --usage as in:


    ```

    docker run -d -p 8080:8080 -m 1536m -e JAVA_OPTS=''-Xmx1024m'' iscream

    ```


    Since Java 10, changes have been made so that Java can inspect the constraints
    applied at the

    container level. Setting the JVM memory constraint is no longer needed.


    ```

    docker run -d -p 8080:8080 -m 1536m iscream

    ```


    # JDKs


    If you remember all the way back to Chapter 1, you will recall that there are
    actually multiple JDKs

    for Java. Due to Oracle''s licensing, it is likely illegal to use an Oracle JDK
    inside of Docker.

    The alternative is to use a JDK with permissive licensing as OpenJDK. This will
    be suitable for most

    situations. However, due to variations in tag names, you might accidentally use
    a version of the JDK

    that you did not intend to. For example, 8-jdk-alpine does not specify a specific
    commit and

    can be any version of Java 8.


    One alternative is to specify a specific tag name such as 8ut31-jdk-alpine (although
    this

    does not point to a specific JDK commit). Or you could use a different JDK such
    as Zulu which is

    fully tested and has pegged to specific commits such as 8u144-28.03.0.


    For what''s worth, I have switched to Zulu most of the time. Although I don''t
    find the

    version uncertainty concerning and plenty of Docker containers will still build
    from OpenJDK. I trust

    that OpenJDK is well-tested. However, I do not work with mission-critical software
    that

    ntoler an occasional (and rare!) JDK bug. You should choose a JDK appropriate
    to your

    situation.


    > *https://dzone.com/articles/java-inside-docker-what-you-must-know-to-not-fail

    *http://blog.takips.com/running-java-on-docker-your-breaking-law/'
