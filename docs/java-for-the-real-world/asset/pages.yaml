    \n# Tell Me More: On .jar files\n\n+   - .jar file is just a zip file. Using a\
    \ tool like 7-zip or unzip, you can explore the contents just like other zip file.\
    \ A typical .jar contains related Java classes, resources, and even other .jar\
    \ files for easy distribution. A 'thin jar' includes only the classes and resources\
    \ created by the author, whereas a 'fat jar' also includes any third-party dependencies.\
    \ Nearly every code library you use will be a .jar file.\n\nThis is the directory\
    \ structure for the application, which follows common Java folder conventions.\n\
    \n```\nlib\n└── guava-26.0-jre.jar\n└── src\n  └── main\n    └── java\n      \
    \  └── com\n          └── letstalkdata\n            └── iscream\n            \
    \  ├── Application.java\n              └── service\n                └── DailySpecialService.java\n\
    ```\n\n![](img/388ca427680b953f016e4c3ce24cad0b_13_1.png)\n\n# Tell Me More: On\
    \ the Java folder structure\n\nJava classes are organized into packages using\
    \ the package keyword at the top of a file. The convention is for package names\
    \ to start with your domain, e.g com.google and drill down to the department,\
    \ purpose of the code, etc. This can lead to some long package names, and since\
    \ there is an enforced relationship between packages and directories, deeply nested\
    \ directory structures.\n\nAn additional convention is to take that entire directory\
    \ structure and put it inside the same set of folders: src/main/java for the application\
    \ or src/test/java for tests. This is particularly important as we learn more\
    \ about build tools.\n\nNow that our code is organized and we found the third-party\
    \ library code, we can compile the application. Ready?"
