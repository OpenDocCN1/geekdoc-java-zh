    # Appendix A: Docker


    Docker is a containerization tool that allows applications to run in isolated
    environments on a host system. The concept is similar to a virtual machine, but
    with a key difference: Docker containers do not contain an entire operating system.
    Instead, they are slim bundles of software that delegate kernel operations to
    the host. The result is they are small (usually a few hundred MB), fast to spin
    up/down, and efficient.


    In the Java world, Docker allows us to bundle all of the supporting software for
    an application and deploy it in an isolated part of the server. For example, we
    could have a .war file application deployed to Tomcat talking to a Postgres database
    all inside of a container. Removing or redeploying the application is as simple
    as issuing a single Docker command.


    ![](img/388ca427680b953f016e4c3ce24cad0b_141_0.png)


    # Hipster Watch: Docker


    Docker is not newly, but many companies simply have not planned their architecture
    to support containerization. It''s a novel and powerful new approach to application
    development and deployment and the industry is trending towards containers. But
    your company might not have the velocity to adopt it yet. If you are looking to
    ease into Docker, consider trying it out in a developer capacity for research
    spikes and developer testing.


    # Building Docker images


    The first step to deploying a Docker container is to create a Docker image. An
    image contains all the components for your application and is persistent inside
    the Docker instance. Importantly, images can be layered on top of one another.
    So common pattern is to start with a publicly available image and make slight
    tweaks for your custom application. This is done using an extensionless Dockerfile.


    A Dockerfile usually starts with a FROM command to instruct Docker base image
    to start with. Here are some base images useful for Java developers:


    +   - openjdk: A Java JDK

    - azure/zulu-openjdk: Another JDK

    - tomcat: The Tomcat application server

    - jboss/wildfly: The Wildfly application server

    - alpine: A tiny Linux kernel'
