    Salty Caramel\"));\n}\n```\n\n有些人更喜欢这种测试编写风格，但在 Java 中他们总是觉得有些别扭。\n\n## TestNG\n\
    \n在很多情况下，TestNG 最先出现，并提供了现在同时存在于 TestNG 和 JUnit 中的功能。例如：注解、测试（test）和参数化测试。因此，TestNG\
    \ 与 JUnit 有许多相似之处。它是一个 xUnit 框架，测试是标记了 @Test 注解的公共方法。许多断言都在框架中，你通常会在类中包含静态的 `org.testng.Assert.*`。\n\
    \n由于这些相似性，这个测试看起来（几乎）完全一样：\n\nDailySpecialService.java\n\n```java\n@Test\npublic\
    \ void GivenOneSpecial_FlavorNameExtracted() throws Exception {\n    var json\
    \ = readJsonFromFile(\"one_special.json\");\n    var service = new DailySpecialService();\n\
    \    var parsedFlavors = service.parseFlavorsFromJson(json);\n    assertEquals(parsedFlavors.get(0),\
    \ \"Salty Caramel\");\n}\n```\n\n（我说的是“几乎”，TestNG 和 JUnit 翻转了 `assertEquals()`\
    \ 中参数的顺序）。\n\n直到最近，JUnit 还不支持测试组（test groups）。测试组允许你在不同的时间执行不同的测试集。例如，你可能有一组缓慢的测试，你不需要频繁运行它们，因此可以将它们与快速的单元测试分开分组。这里是两个示例测试，其中一个位于某个组中：\n\
    \n```java\n@Test(groups = \"db-integration\")\npublic void employeeCanBeSaved()\
    \ {\n    EmployeeService service = new EmployeeService();\n    Employee employee\
    \ = new Employee(\"Allie\");\n    service.save(employee);\n    assertEquals(service.ById(1).getName(),\
    \ \"Allie\");\n}\n```\n\n```java\n@Test\npublic void employeeFullNameIsGenerated()\
    \ {\n    Employee employee = new Employee();\n    employee.setFirstName(\"Allie\"\
    );\n    employee.setLastName(\"Park\");\n    assertEquals(employee.getFullName(),\
    \ \"Allie Park\");\n}\n```\n\n既然 `employeeCanBeSaved` 已被放入一个组中，我们可以根据需要运行该组。例如，在\
    \ Gradle 中，我们可以创建一个任务来运行缓慢的数据库集成测试。\n\n```\ntask dbTest(type: Test, dependsOn:\
    \ 'test') {\n  useTestNG() {\n    includeGroups 'db-integration'\n  }\n}\n```\n\
    \n## 运行测试\n\n正如之前提到的，JUnit 和 TestNG 被大多数 Java 工具链的人所熟悉。在开发过程中，你可能会发现通过 IDE 运行测试是最简单的。以下是我从\
    \ IntelliJ 运行测试时，某些测试的样式。\n\n![](img/388ca427680b953f016e4c3ce24cad0b_38_0.png)\n\
    在 IntelliJ IDE 中运行测试\n\n构建工具让测试变得关于测试。例如，以下是 Gradle 中失败测试的样式：\n\n```\n$ gradle\
    \ test\n:compileJava UP-TO-DATE\n:processResources NO-SOURCE\n:classes UP-TO-DATE\n\
    :compileTest UP-TO-DATE\n:processTestResources UP-TO-DATE\n:test\ncom.letstalkdata.iscream.service.DailySpecialService\
    \ > GivenSpecial_EmptyList FAILED\njava.lang.AssertionError at DailyServiceTest.java:31\n\
    \n3 tests completed, 1 failed\ntest FAILED\n\nFAILURE: Build failed with an exception.\n\
    ```\n\nMaven 和 Gradle 也会创建（略有不同）HTML 报告，这对于拥有数十个测试的大应用程序特别有用。你可以在 Gradle 的 `build`\
    \ 文件夹或 Maven 的 `target` 文件夹中找到测试结果。以下是之前的构建对应的 Gradle 测试。\n\n### 测试摘要\n\n| tests\
    \ | failures | ignored | duration |\n|---|---|---|---|\n| 3 | 1 | 0 | 0.014s |\n\
    | successful: 66% | Failed tests | | |\n| Packages: Classes | DailyServiceTest\
    \ EmptyListReturned | | |\n\n## 使用双胞（Doubles）\n\n有时在编写测试时，我们会遇到处理起来很麻烦的对象。通常这些对象是与外部世界交互的对象——数据库连接器、文件系统读取器、Web\
    \ 对象等。测试双胞（Test doubles）是代表复杂对象的对象，以便使测试更容易。如果这个概念对你来说很新，我强烈推荐 Martin Fowler 写的《Mocks\
    \ and Stubs》。Java 有许多用于处理测试双胞的框架：EasyMock, Mockito, PowerMock...\n\n- Mock 是最早的框架之一，往往在旧项目中更常见。\n\
    - Mockito 是最常用的库。\n- PowerMock 建立在 EasyMock 或 Mockito 之上，提供额外的功能。\n\n## 修改 iscream\
    \ 以支持可 Mock 的服务\n\n目前，我们的应用程序配置为向互联网发出 Web 服务调用。在单元测试中，这既慢又不可靠。一个 HTTP 调用可能需要几秒钟，而且无法保证服务可用。除非我们正在测试服务集成（即在集成测试中），否则我们真的希望避免与互联网实际通信。Mock\
    \ 救了急急。我在代码中添加了一个新类，让我们的测试变得简单一点：\n\n### MenuCreator.java\n\n```java\npackage\
    \ com.letstalkdata.iscream;\n\nimport com.letstalkdata.iscream.service.DailySpecialService;\n\
    \npublic class MenuCreator {\n    private DailySpecialService dailySpecialService;\n\
    \n    public MenuCreator(DailySpecialService dailySpecialService) {\n        this.dailySpecialService\
    \ = dailySpecialService;\n    }\n\n    public String getTodayMenu() {\n      \
    \  var dailySpecial = dailySpecialService.getSpecials();\n        var menuItem\
    \ = new StringBuilder(\"Today's specials are:\\n\");\n        dailySpecial.forEach(s\
    \ ->\n            menuBuilder.append(\" \").append(s).append(\"\\n\")\n      \
    \  );\n        return menuItem.toString();\n    }\n}\n```\n\nMenuCreator 构造函数包含一个\
    \ `DailySpecialService` 实例，因为 MenuCreator 依赖于它。当传递实例时，我们说它是被“注入”的。“依赖注入”（dependency\
    \ injection）这一术在我们读 Spring 章节时将特别相关！现在 MenuCreator 已经设置好了，我们可以在测试中注入 mock DailySpecialService。\n\
    \n## 使用 Mock 创建测试\n\n使用 Mock 的基本步骤如下：\n\n1. 创建 Mock 对象\n2. 为 Mock 对象设置期望\n3. 将\
    \ Mock 对象注入测试对象\n4. 调用测试对象\n5. 验证 Mock 是否符合期望\n\n步骤1、2和5是实际使用 Mock 框架的地方。因此理论上如果你想在代码库中切换\
    \ Mock 框架，只需要部分修改测试。\n\n## EasyMock\n\nEasyMock 有一套令人困惑的术语“记录（record）、播放（replay）、验证（verify）”，所以我发现将其理解为“设置、启用、验证”会更容易更容易。这里有一个使用\
    \ EasyMock 的测试：\n\nMenuCreatorTestEasyMock.java\n\n```java\n@Test\npublic void\
    \ whenAMenuIsCreated_ThenDailyServiceIsCalled() {\n    // 步骤 1：创建 Mock 对象\n  \
    \  var mockService = EasyMock.createMock(DailySpecialService.class);\n    // 步骤\
    \ 2：设置期望\n    var specials = new ArrayList<String>();\n    EasyMock.expect(mockService.getSpecials()).thenReturn(specials).once();\n\
    \    EasyMock.replay(mockService);\n    // 步骤 3：注入 Mock\n    var menuCreator =\
    \ new MenuCreator(mockService);\n    // 步骤 4：调用测试对象\n    menuCreator.getTodaysMenu();\n\
    \    // 步骤 5：验证\n    EasyMock.verify(mockService);\n}\n```\n\n回到 Mock 的通用步骤，`EasyMock.createMock()`\
    \ 方法是步骤1，`EasyMock.expect()` 是步骤2。我们的期望是服务被调用一次，并且当它被调用时返回 specials（在本例中只是空列表）。`EasyMock.replay()`\
    \ 方法是下一步，它允许 Mock 对象被使用。步骤3和4与 EasyMock 无关，无论我们使用什么框架都一样。最后，`EasyMock.verify()`\
    \ 断言 Mock 是否符合预期。当你运行测试时，它将在没有互联网连接的情况下通过！\n\n"
