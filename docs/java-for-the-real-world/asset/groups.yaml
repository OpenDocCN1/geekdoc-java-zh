    \ 的强大很大程度上取决于第三方插件。由于 Gradle 较新，有时感觉你正在使用一组由随机人员开发的插件。你可能会发现自己在为同一个功能比较三个插件，而每个插件只有几十个\
    \ GitHub Stars，而且几乎没有文档。尽管有这些缺点，Gradle 正在变得越来越流行，对于喜欢对构建有更多控制权的开发者来说，非常有吸引力。\n\
    \n## 推荐资源\n\n### Ant\n\n无论是由于缺乏知识、管理不善还是开发者的疏忽，似乎并不缺少没有测试的代码。特别是如果你正在处理一个遗留 Java\
    \ 应用，你可能会发现自己迷失在面条代码中。我学到，如果你能隔离部分代码并创建几个宽泛的测试，至少可以帮助你找到方向。更多细节，请参考 Michael Feather\
    \ 关于测试用架的讨论。\n\nLoughran, Steve and Erik Hatcher. *Ant in Action*. Manning, 2007.\n\
    https://www.manning.com/books/ant-action\n\n### Maven\n\nBharathan, Raghuram.\
    \ *Apache Maven Cookbook*. Packt, 2015.\nhttps://www.packpub.com/application-development/apache-maven-cookbook\n\
    \nO’Brien, Tim, John Casey et al. *Maven by Example* Sonatype, 2011.\nhttp://books.sonatype.com/mvnex-book/reference/index.html\n\
    \n### Gradle\n\nMitra, Mainak. *Mastering Gradle*. Packt, 2015.\nhttps://www.packpub.com/web-development/mastering-gradle\n\
    \nMuschko, Benjamin. *Gradle in Action*. Manning, 2014.\nhttps://www.manning.com/books/gradle-in-action\n\
    \n## 第 4 章：测试\n\n没有什么能比良好的测试更能预测生产代码的成功了。坦率地说，Java 拥有一套丰富的测试工具和库。到目前为止，最使用的库是\
    \ JUnit。它可以作为独立库使用，也可以与其他提供额外功能的库结合使用。所有现代 IDE 都可以毫无费地运行 JUnit，且 Maven 和 Gradle\
    \ 都支持运行所有检测到的 JUnit 测试的命令（Ant 有一个 junit target）。JUnit 的替代方案是 TestNG，它在历史上提供了 JUnit\
    \ 缺失的功能。它同样拥有广泛的 same，但在某些情况下需要额外的插件。\n\n### 遗留警示：没有测试！\n\n无论是由于缺乏知识、管理不善还是开发者的疏忽，似乎并不缺少没有自动化测试的代码。特别是当你正在处理一个遗留\
    \ Java 应用时，你可能会发现自己迷失在面条代码中。我学到，如果你能隔离部分代码并创建几个宽泛的测试，至少可以帮助你找到方向。更多细节，请查看 Michael\
    \ Feather 在《Working Effectively with Legacy Code》（Prentice Hall, 2004）中对测试用架的讨论。\n\
    \n### 为 IScream 应用添加服务\n\n再次使用 IScream 商店应用程序，让我们更改 DailySpecialService 以查询 Web\
    \ 端点，而不是返回静态的特价列表。我们假设该服务返回 JSON 响应，并且我们不知道 JSON 解析库！\n\nDailySpecialService.java\n\
    \n```java\npackage com.lestalkdata.iscream;\n\nimport java.io.BufferedReader;\n\
    import java.io.IOException;\nimport java.io.InputStreamReader;\nimport java.net.HttpConnection;\n\
    import java.net.URL;\nimport java.util.ArrayList;\nimport java.util.List;\nimport\
    \ java.util.regex.Pattern;\n\npublic class DailySpecialService {\n\n    private\
    \ final String SPECIALS_URL = \"http://www.mocky.io/v2/59401621000003d034f66dc\"\
    ;\n\n    public List<String> getSpecials() {\n        try {\n            var json\
    \ = getFromJsonUrl();\n            return parseFlavorsFromJson(json);\n      \
    \  } catch (IOException e) {\n            System.out.println(\"Error retrieving\
    \ daily specials!\");\n            e.printStackTrace();\n            return new\
    \ ArrayList<>();\n        }\n    }\n\n    private String getFromJsonUrl() throws\
    \ IOException {\n        var url = new URL(SPECIALS_URL);\n        var con = (HttpConnection)url.openConnection();\n\
    \        try(var reader = new BufferedReader(new InputStreamReader(con.getInputStream())))\
    \ {\n            String input;\n            var response = new StringBuilder();\n\
    \            while ((input = reader.readLine()) != null) {\n                response.append(input);\n\
    \            }\n            return response.toString();\n        }\n    }\n}\n\
    ```\n\n### 更多信息：Mocky\n\n如果你经常需要快速模拟一个实际上可以通过 HTTP 访问的 Web 服务，我推荐 Mocky。你提供响应码、内容类型、标头，并立即获得一个始终返回你输入内容的永久\
    \ URL。注意：我发现该网站支持 SSL，但证书不是完整链，会抛出 SSL 异常。\n\n我们感兴趣的方法是 `parseFlavorsFromJson`。开始之前，请参阅第\
    \ 10 章获取详情。\n\n"
