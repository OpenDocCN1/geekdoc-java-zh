    # Java Wart: Getters and Setters


    The pattern of having a class property with public accessors is pervasive in most
    Java codebases. The "official" reason for this is by relying on getter and setter
    methods, you do not have to worry about the underlying implementation change.
    But in reality, getter and setter rarely do anything other than "get" or "set".
    Perhaps more annoyingly, they make classes fully mutable.


    So why do we keep creating them? The best reason I have is that many frameworks
    expect them. The Spring XML approach will try to use setters to inject dependencies.
    (It''s possible to use constructors, but it takes more work for the developer.)
    We will see more frameworks that also expect getters and setters, although some
    frameworks will automatically fall back to finding classes if accessors are not
    present.


    Add Spring to the project using XML, we''re going to add a file that is named
    appContext.xml by convention. If you''re using Maven or Gradle, it goes in src/main/resources.
    This file defines "beans" which you can think of as the components of your application.


    applicationContext.xml


    ```

    1 <?xml version="1.0" encoding="UTF-8"?>

    2 <beans xmlns="http://www.springframework.org/beans"

    3 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    4 xsi:schemaLocation="http://www.springframework.org/schema/beans

    5 http://www.springframework.org/schema/beans/beans.xsd">

    6

    7 <bean id="dailySpecialServiceBean"

    8 class="com.letstalkdata.iscream.service.DailySpecialService" />

    9

    10 <bean id="dailySpecialPrinter"

    11 class="com.letstalkdata.iscream.DailySpecialPrinter">

    12 <property name="dailySpecialService" ref="dailySpecialServiceBean"/>

    13 </bean>

    14 </beans>

    ```'
