  - '[PAGE 9]


    # # Chapter 2: The Java Virtual Machine


    # ## What is the Java Virtual Machine?


    One of Java’s selling points over the years has been its support for multiple
    platforms. For example, I could write and test my Java code on a Mac, then deploy
    it on a Windows server and expect it to run. The reason why this is because a
    Java Virtual Machine (or JVM) sits between your compiled code and the operating
    system, and it knows how to translate Java into native system calls. To be perfectly
    precise, this would be an instance of a JVM. The term can also refer to Oracle
    specification or its implementation.


    # ## JVM Versions


    Periodically, the maintainers of Java make updates to the JVM specification¹¹.
    Naturally, this allows them to release new features and improvements. As of this
    writing, the most current production version is Java 11. Prior to Java 9, releases
    were slow, often taking years. However, Oracle has moved to a six-month cadence
    meaning there will be more versions “in the wild.” Furthermore, every third release
    will be a long-term support release. We are still waiting to see how the community
    reacts, but I suspect that most companies will settle on Java 8, 11, 14, etc.
    while using only the in-between versions for experimentation.


    One more note on versions: JVMs prior to Java 9 use the numbering scheme 1.x in
    some technical areas. Java 7 and Java 1.7 are the same version, though people
    rarely use the “1.7” name in parlance.


    > > Legacy Watch: Out-dated JVMs


    Unfortunately, some companies are slow to adopt technology. The financial industry
    in particular is known for being behind the curve. So while learning materials,
    blogs, news, etc. may assume you are using Java 8+, you might actually be using
    Java 7 or even Java 6.


    It’s important to know what version of the JVM your application will run under,
    before you start any development. The version will determine what language features
    you can take advantage of. However, regardless of which version is used in production,
    you can usually install the latest version on your development machine. This is
    because Java is extremely backwards compatible


    ¹https://docs.oracle.com/javase/specs/jvms/se8/html/'
