    \n# 运行 Spring Boot \n\n与任何 Java 程序一样，Spring Boot 程序的入口是一个包含 main 方法的类。然而，它需要一些特殊配置才能运行。\n\
    \n首先，类被标记为 @SpringBootApplication。这是一个方便注解，结合了 @Configuration、@EnableAutoConfiguration\
    \ 和 @ComponentScan。我们在在本章之前已经见过 @ComponentScan，但另外两个注解用于根据以下内容配置应用程序：\n\n- 你添加到该类的设置\
