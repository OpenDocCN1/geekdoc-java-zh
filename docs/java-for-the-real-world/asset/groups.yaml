    Chapter 8: Working with Databases


    # But what is it, really?


    Spring JDBC Template is light-weight wrapper for JDBC API that abstracts away
    the JDBC boilerplate. It works best if you are using Spring Dependency Injection.


    # Tell Me More: H2


    H2 is a no-fills database server written in pure Java that prioritizes speed.
    Combined with its small size (~1.5MB), it makes a great choice for local testing.
    Indeed, an in-memory H2 database is usually so fast to spin up that it can make
    unit tests talk to a database reality. I also like to prototype applications with
    an in-memory H2 database because I can change the database schema very quickly
    and the included web console lets me easily inspect the data as I work. If enabled,
    you can access the console at localhost:port/h2-console while the application
    is running. For the example, enter jdbc:h2:mem:iscream as the database, leave
    as the user, and leave the password empty.


