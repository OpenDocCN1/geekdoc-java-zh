    # # Chapter 1: Getting Started


    # ## Who this book is for


    As the title suggests, this book is for people who are using Java in a business
    setting. From my experience, learning the Java ecosystem is nearly as arduous
    a task as learning the language. For experienced programmers, learning the language
    is probably barely a challenge compared to learning the ecosystem. However, while
    there are a great number of tools to learn the Java language, few resources exist
    to introduce people to the ecosystem. This book is your guide to the frameworks,
    tools, and libraries used to build professional software.


    If you are a recent graduate or a self-taught programmer looking to break into
    the industry, this book will give you the real world knowledge hiring managers
    are interested in. It''s unlikely that you''ll ever have to write a sorting algorithm,
    but you can bet you''re going to encounter a Spring MVC application that uses
    Hibernate for persistence. The other hand, if you are already a professional developer,
    you already understand the concepts, and are more likely to ask yourself, "How
    does Java do?"


    What this book does not teach you Java! I assume that you have a good working
    knowledge of the standard library. If you need to learn Java, I can recommend
    Head First Java (O''Reilly, 2005) by Kathy Sierra and Bert Bates, for follow a
    more recent book that does Java into 8.


    If you''re ready to learn how to work with enterprise Java applications, forge
    ahead.


    # ## The video course


    If you enjoy learning from videos, I have created a video course based on this
    curriculum on Udemy³. The content is largely the same, although the book dives
    into a more detail than the video course. Although Udemy frequently runs specials,
    I want to make sure your readers never have to pay full price. You can use the
    coupon code LEANPUB_50 for 50% off of the regular price.


    # ## How to use this book


    Each chapter of this book focuses on a general concept and, to some extent, the
    chapters build on each other. If you have the time, I recommend reading from beginning
    to end. However, if you are on a deadline, you can skip chapters that aren''t
    relevant to you.


    > https://www.udemy.com/course/java-for-the-real-world/

    https://www.udemy.com/course/java-for-the-real-world/?couponCode=LEANPUB_50'
