    # Java Wart: java.util.Date


    Just''s so bad about the old Date class that motivated Joda Time? Well, a lot.
    Jon Skeet has a nice summary on his blog", but perhaps most frustrating is the
    disconnect between the class names and semantics. A java.util.Date is not a date
    at all-it''s an instant in time. As such, operations like getMonth() or toString()
    don''t make sense. And in fact, those methods (and many others) have deprecated
    appropriately.


    # Summary


    Guava and Apache Commons help reduce boilerplate, extend the functionality of
    the core Java language, and reduce errors. You shouldn''t need these libraries
    for every project, but they can be very helpful for large codebases. Also keep
    in mind that you can very grow an application''s footprint by just adding a couple
    of commons dependencies. Use the libraries judiciously and make sure you''re really
    going to benefit from them before adding them to the project. If you are working
    on a legacy (pre-Java 8) application, Joda Time should almost always be preferred
    to the standard library date classes.


