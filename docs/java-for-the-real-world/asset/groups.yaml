    \  repositories {\n    jcenter()\n  }\n  dependencies {\n    classpath 'com.github.jengelman.gradle.plugins:shadow:1.2.4'\n\
    \  }\n}\n\napply plugin: 'java'\napply plugin: 'com.github.johnrengelman.shadow'\n\
