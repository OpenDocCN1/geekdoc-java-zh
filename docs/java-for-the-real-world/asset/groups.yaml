  - '[PAGE 88]


    # Chapter 7: Web Application Deployment


    As you can see, the WAR deployment contains everything needed for the application:
    controllers, views, and domain objects. The EAR deployment contains a WAR file
    that does not have any domain objects. Instead, the domain objects have been moved
    to is-ejb.jar. The EAR also contains an application.xml file that provides instructions
    to the deployment container. It is possible to do this by hand, but it''s better
    to let your build tool create it.


    # Deployment


    The most common application servers are Tomcat and JBoss/WildFly*. Both can be
    used to deploy WAR files, but Tomcat cannot deploy EAR files. There are course
    other options including Glassfish, Jetty, Jonas, Resin, and others, which are
    much less commonly encountered.

    There are a few common ways that applications are deployed (and undeployed) to
    application servers, not all tools support it.


    +   1. Folder drop. If the application server "watches" a folder while running,
    any Java archive that is dropped into the folder will be deployed automatically.
    This can be particularly helpful during development where you may want to quickly
    deploy something to a development server.

    2. GUI. Using you can access a web interface to the application server at the
    root context (e.g. http://my-server:8080/). Here you can see what applications
    are running and deploy a new application.

    3. Console. If the application server has a command line component, you can run
    the CLI and manage applications.

    4. API. Deploying artifacts using an API can be particularly useful if you have
    a continuous integration server that builds and tests your application. You might
    choose to automatically deploy your code if it builds successfully.


    For practice, you can install one or more application servers on your computer
    and build the sample to create artifacts. Alternatively, you can use Docker to
    avoid installing anything to your computer. I discuss Docker in more detail in
    Appendix A, but it is a utility that allows you to easily create and deploy "containers"
    on your computer. The sample projects contain docker-build.sh and docker-run.sh
    scripts as a convenience. Both of these scripts use the "folder drop" method of
    placing the build artifact into a special folder that is checked on server startup.
    For Tomcat it is $TOMCAT_INSTALL_DIR and for WildFly it is $WILDFLY_INSTALL_$DIR/standalone/deployments.
    Here''s a summary of the different methods for these two application servers (standard
    ports assumed):


    # Folder Watch


    +   * Tomcat: $INSTALL_DIR/webapps


    > *Salnikov-Tarnovski, Nikita. "Most Java application servers: 2016 edition."
    Plumblr, 21 April 2016, https://plumbr.eu/blog/java/most-java-ee-servers-2016-edition.
    Accessed 22 July 2017.'
