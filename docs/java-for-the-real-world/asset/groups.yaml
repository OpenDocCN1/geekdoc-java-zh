    # Maven Phases


    The most common tasks you want to accomplish with a build script are included
    in Maven. These

    areare called "phases" and can be executed by running mvn PHASE (where PHASE is
    the phase name).

    These are the phases you are most likely to use:


    +   - **compile**: Compiles your source code

    - **test**: Runs the unit tests in the project

    - **package**: Creates a distributable package of code, e.g. a .jar file

    - **verify**: Runs integration tests in the project

    - **install**: Makes the distributable package available *locally* to be used
    as a dependency in

    Maven projects

    - **deploy**: Makes the distributable package available to *others* to be used
    as a dependency in

    other Maven projects ("Others" is often just your team, company, etc. not necessarily
    the whole

    world.)


    These phases are additive, so running package also compile and test, for example.
    To see the

    complete list of Maven phases, see the Lifecycle Reference¹¹. The first time you
    run a Maven build,

    y''ll likely use the install phase because it will fully build and test the project,
    create a build

    artifact, and "install" to your local Maven repository.


    Although it''s not actually a phase, the command clean deserves a mention. Running
    that

    command will "clean" out your local build directory (i.e. /target), and remove
    compiled classes,

    resources, packages, etc. In theory, you should be able to run mvn install and
    your build

    directory will be updated automatically. However, it seems that enough developers
    (including

    myself) have been hurt by this not working that you habitually run mvn clean install
    to force

    t project to build from scratch.


    # Project Object Model (POM) Files


    Maven''s build files are called Project Object Model files, usually abbreviated
    to POM, and are

    saved as pom.xml in the root directory of a project. In order for Maven to work
    out of the box, it''s

    important to follow this directory structure:


    > ¹https://maven.apache.org/guides/introduction-to-the-lifecycle.html#Lifecycle_Reference'
