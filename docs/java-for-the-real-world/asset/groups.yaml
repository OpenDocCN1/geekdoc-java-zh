    ```\n\n## 动态 SQL\n\nMyBatis 的另一个强大特性是支持动态 SQL。一个常见的业务需求是从列表中选择多个项目并检索这些项目的数据。为了只访问\
    \ SQL 数据库，你需要编写 `WHERE IN` 查询。我见过很多开发者尝试使用字符串拼接手动实现这种功能，这种代码通常会产生 SQL 注入漏洞，且无法正确处理末尾逗号。MyBatis\
