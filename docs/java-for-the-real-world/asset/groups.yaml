    \  </foreach>\n</select>\n```\n\n另一个棘手的功能是创建带有可选搜索参数的查询。同样，MyBatis 让这一切变得简单：\n\
    \n```xml\n<select id=\"findingIngredientsSearch\"\n  resultType=\"com.letstalkdata.iscream.domain.Ingredient\"\
