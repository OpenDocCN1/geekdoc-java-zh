    \ too.\n\n# Spring Boot\n\nThe Spring group has done a wonderful job making sure\
    \ that their components play nicely together. However, developers have a knack\
    \ of making things more difficult and it's not uncommon to come across torturedContext.xml\
    \ files. Following the Spring guidance helps, but it can still be laborious to\
    \ correctly configure a Spring application, even with annotations.\n\nIn 2014\
    \ the Spring released Spring Boot which is an opinionated tool designed for rapid\
    \ application development with the Spring platform. It favors convention over\
    \ configuration and makes it easy to skip the rigmarole of creating a new application.\n\
    \nSpring Boot applications are built from one or more \"starters\" which are included\
    \ in a Maven or Gradle dependency. For example we application that communicates\
    \ with an LDAP server would use spring-boot-starter-web and spring-boot-starter-data-ldap.\
    \ A complete list of starters can be found on the Spring Boot GitHub repository.\n\
    \n> https://github.com/spring-projects/spring-boot/tree/master/spring-boot-starters\n\
    \n# Running a Spring Boot Application\n\nLike any Java program, the entry to a\
    \ Spring Boot program is a class containing a main method. However, it requires\
    \ some special configuration for it to run using Spring Boot.\n\nFirst, the class\
    \ is annotated @SpringBootApplication. This is a handy shortcut annotation that\
    \ combines @Configuration, @EnableAutoConfiguration and @ComponentScan. We've\
    \ seen @ComponentScan earlier in the chapter, but the other two annotations are\
    \ used to configure the application based on:\n\n- The settings you add to this\
    \ class (@Configuration)\n- What is on your classpath (@EnableAutoConfiguration)\n\
    \nUsually the main method is very simple. For example if the class is named Application.java.\n\
    \n```java\npublic static void main(String[] args) throws Exception {\n    SpringApplication.run(Application.class,\
    \ args);\n}\n```\n\nThe static run() method takes care of bootstrapping.\n\nSpring\
    \ Boot projects can be launched from an IDE or compiled into .jar files using\
    \ Maven and Gradle and ran normally. There's also shortcut tasks mvn spring-boot:run\
    \ and gradle bootRun to compile and run the application from the command line.\n\
    \n# Configuration\n\nAs we've seen so far, Spring can be a big help in making\
    \ configuration easier. Spring Boot formalizes the concept of multiple configurations\
    \ into \"profiles\". One or more profiles can be active for the runtime of an\
    \ application making it easy to mix and match configurations for different runtime.\n\
    \nSpring configuration files have the name application.properties or application.yml\
    \ and profiles are named application-foo.properties or application-foo.yml where\
    \ foo is the profile name. When using yaml files, property names are \"unpacked\"\
    \ that spring.foo.bar=baz:\n\n```\nspring:\n  foo:\n    bar: baz\n```\n\nTaking\
    \ the examples from the previous section on properties, here's how you could create\
    \ the profiles to toggle between different IScream services.\n"
