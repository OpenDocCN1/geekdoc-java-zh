  mdcn: "\n\n## 第 3 章：构建工具\n\n9\n\n}\n\n尽管这个例子有些牵强，但它依赖于 Google Guava 代码库（guava-26.0-jre.jar）。因此，在编译代码之前，我们必须下载该库并将其引入项目中。\n\
    \n![](img/388ca427680b953f016e4c3ce24cad0b_13_0.png)\n\n## 扩展：关于 .jar 文件\n\n-\
    \ .jar 文件就是一个 zip 包。使用 7-zip 或 unzip 等工具，你可以像查看其他 zip 文件一样浏览内容。一个典型的 .jar 包含相关的\
    \ Java 类、资源，甚至为了方便分发与其他 .jar 文件。“瘦 jar”（thin jar）仅包含作者创建类和资源，而“胖 jar”（fat jar）还包含了任何第三方依赖。你使用的几乎每个代码库都是\
    \ .jar 文件。\n\n这是应用程序的目录结构，遵循常见的 Java 文件夹命名约定。\n\n```\nlib\n└── guava-26.0-jre.jar\n\
    └── src\n  └── main\n    └── java\n        └── com\n          └── letstalkdata\n\
    \            └── iscream\n              ├── Application.java\n              └──\
    \ service\n                └── DailySpecialService.java\n```\n\n![](img/388ca427680b953f016e4c3ce24cad0b_13_1.png)\n\
    \n## 扩展：关于 Java 文件夹结构\n\nJava 类使用文件顶部的 `package` 关键字组织成包。惯例是包名以你的域名开始，例如 `com.google`，然后深入到部门、代码用途等。这可能会导致包名非常长，并且由于包与目录之间存在强制对应关系，会导致深层嵌套的目录结构。\n\
    \n另一个约定是将这整个目录结构放在同一组文件夹中：应用程序的 `src/main/java` 或测试的 `src/test/java`。随着我们学习更多构建工具的知识，这一点尤为重要。\n\
    \n现在我们的代码已经组织好，并且找到了第三方库代码，我们可以编译应用程序了。准备好了吗？\n\n## 第 3 章：构建工具\n\n10\n\n```\n\
    $ javac -cp :.lib/* src/main/java/com/letstalkdata/iscream/*.java\n```\n\n首先我们必须告诉\
    \ Java 编译器去查找依赖项。Java 会在所谓的类路径（classpath）中查找，类路径可以通过环境变量设置，或者通过运行时参数 `-cp` 设置。（哦，如果你使用的是\
    \ Windows，请使用 `;` 分隔类路径位置。）现在我们需要准确地编译所有文件。使用 `*` 通配符可以节省一些时间，但我们仍然需要指定两个目录。想象一个拥有几十个目录的真实应用程序。\n\
    \n遗憾的是，当我们运行该命令时，它会在源代码旁边创建一堆杂乱的 .class 文件。为了保持整洁，我们可能想做类似这样的操作：\n\n```\n$ javac\
    \ -cp \":.lib/* src/main/java/com/letstalkdata/iscream/*.java\nsrc/main/java/com/letstalkdata/iscream/service/*.java\
    \ -d /out\n```\n\n使用 `-d` 可以将编译后的代码存储在其他地方。你最好希望 `out` 文件夹存在，否则 `javac` 将无法运行。\n\
    \n如果我们想让代码易于运行，我们想要创建一个 jar 包。这里就不详述细节了，简而言之，就是从 Guava 库中提取内容，创建一个指定所有运行时所需代码及类路径的\
    \ MANIFEST.MF 文件，并调用 jar 命令将所有 Guava 类和你在 `out` 目录中的类包含进去。\n\n这就引出了为什么创建构建工具。\n\
    \n## Ant\n\n该程序已使用了四十多年，用于将源代码转换为应用程序。因此，它是 Java 早期年的自然选择。遗憾的是，C 程序的许多假设和约定并不适用于\
    \ Java 生态系统。为了让构建 Java Tomcat 应用程序变得更容易，James Duncan Vision 编写了 Ant。很快，其他开源项目也开始使用\
    \ Ant，它迅速在整个社区中传播开。\n\n## 但真的如此吗？\n\nAnt 是一个管理 Java 构建过程的工具。它非常有扩展性，但通常用于编译代码、运行测试、创建构建产物、部署文件等。\n\
    \n## 遗留观察：Ant\n\n尽管早期被广泛采用，但 Ant 现在已大部分被淘汰，被更新的构建工具（Maven 和 Gradle）所取代。\n\n##\
    \ 第 3 章：构建工具\n\n15\n\n## 构建文件\n\nAnt 构建文件用 XML 编写，称为目标（targets）。以下是一些常见的目标：\n\n\
    - clean: 该目标用于删除所有构建产物。\n- compile: 该目标将 Java 源代码编译为类文件。\n- jar: 该目标构建我们应用程序的\
    \ .jar 文件。\n- run: 该目标将使用指定的类类实际运行应用程序。\n\n## 第 3 章：构建工具\n\n16\n\n## 第 3 章：构建工具\n\
    \n17\n\n"
