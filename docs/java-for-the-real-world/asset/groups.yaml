    \ `MyServiceImpl` 实现 `Service` 并包含对 `MyDao` 的引用，而 `MyDao` 又在 `MyDaoImpl` 中实现！MyBatis\
    \ 可以将其简化为一个对象，如果你确实需要这种灵活性，我鼓励这样做。\n\nMyBatis 与 Java 对象的结合比 JDBC 更紧密。这意味着你可以将自定义领域对象作为参数传递给查询并返回自定义领域对象作为结果。MyBatis\
    \ 展示了 `IScream` 实现如何获取冰淇淋口味（flavors）和配料（toppings）作为实际的对象——无需手动映射。\n\ningredient-mapper.xml\n\
