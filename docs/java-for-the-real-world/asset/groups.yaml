    \ 中，引入了注解，允许在无需 XML 的情况下配置应用程序。注解将（并非所有）运行时错误转换为了编译时错误，并可以帮助识别类如何与代码内联使用。我将同时展示\
    \ XML 和注解两种样式，但请记住，它们并不是互斥的。你可以根据不同的目的同时使用 XML 和注解。\n\n## 基于 XML 的方法\n\n为了修改 Iscream\
