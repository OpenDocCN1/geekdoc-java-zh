    \ the test doubles (mocks, stubs, spies), Mockito is a good choice, EasyMock is\
    \ nearly.\n\n## Suggested Resources\n\n### General testing\n\n- Fowler, Martin.\
    \ \"Mocks Aren't Stubs,\" 2007. https://martinfowler.com/articles/mocks.\n- Koskela,\
    \ Lasse. Test Driven: Practical TDD for Java Developers. 2007. https://www.manning.com/test-driven\n\
    - Osherove, Roy. The Art of Unit Testing. 2013. https://www.manning.com/the-art-of-unit-testing\n\
    \n### Framework-specific\n\n- Acharya, Sujoy. Mastering Unit Testing Using Mockito\
    \ and JUnit. 2014. https://www.packpub.com/mastering-unit-testing-using-mockito-and-junit\n\
    - Shah, Deep. Instant Mock Testing with PowerMock. 2013. https://www.packpub.com/application-development/instant-mock-testing-powermock\n\
    - Tahchiev, Petar, et al. JUnit in Action. 2010. https://www.manning.com/junit-in-action-second-edition\n\
    \n# Chapter 5: Spring\n\nPerhaps no collection of tools is more well-known in\
    \ the Java world than Spring. What started out as a tool to wire up application\
    \ components more easily has grown into a variety of frameworks including frameworks\
    \ for building web applications, accessing data, rapid application development,\
    \ microservice configuration, mobile development, and others.\n\nAt the center\
    \ of all the Spring tools is the Spring Core. We'll spend the bulk of this chapter\
    \ learning the basics of Spring Core, and then explore a modern, opinionated Spring\
    \ framework called Spring Boot. However, there's much more to configure in code.\
    \ In later chapters, we'll discuss Spring JDBC and Spring MVC.\n\n# Spring Core\n\
    \n# Dependency Injection\n\nThe term \"dependency injection\" (DI) is a classic\
    \ example of applying complex words to a simple concept. Spring's documentation\
    \ says:\n\n> [Dependency Injection] is a process whereby objects define their\
    \ dependencies, that is, the other objects they work with, only through constructor\
    \ arguments, arguments to a factory method, or properties that are set on the\
    \ object instance after it is constructed or returned from a factory method.¹\n\
    \nClear as mid? In any application you have objects that rely on other objects\
    \ to function. For example, in our IScream application, we've seen that the Application\
    \ requires a DailySpecialService. We can say that Application depends on DailySpecialService.\
    \ So far we have been creating the service explicitly in code. Spring will automatically\
    \ configure, or inject, the dependency.\n\n# But what is it, really?\n\nThe Spring\
    \ Core manages all the objects in your application that depend on other objects.\
    \ Instead of creating and configuring your objects manually in code, Spring automatically\
    \ does it for you at runtime.\n\nWith all of this waving wand comes tradeoffs.\
    \ Developers can go overboard in their reliance on Spring creating complex dependencies\
    \ freely. Furthermore, since the dependencies are managed\n\n³¹ The IoC container.\
    \ Spring Framework Reference, https://docs.spring.io/docs/spring/current/spring-framework-reference/htm-lbeans.html.\
    \ Accessed 10 June 2017.\n"
  mdcn: "\n\n# Mockito\n\n由于 Mockito 是从 EasyMock 分叉而来的，它的概念和术语与其相似。然而，与其更简单的语法和更扩展的功能集不同，它在流行程度上已经超越了前者。\n\
    \nMenuCreatorMockito.java\n\n```java\n@Test\npublic void WhenAMenuIsCreatedThenDailySpecialServiceIsCalled()\
    \ {\n    // Step 1: 创建 mock 对象\n    var mockService = Mockito.mock(DailySpecialService.class);\n\
    \n    // Step 2: 设置期望\n    var specials = new ArrayList<String>();\n    Mockito.when(mockService.getSpecials()).thenReturn(specials);\n\
    \n    // Step 3: 注入 mock\n    var menuCreator = new MenuCreator(mockService);\n\
    \n    // Step 4: 调用测试对象\n    menuCreator.getTodosMenu();\n\n    // Step 5: 验证\n\
    \    Mockito.verify(mockService, Mockito.times(1)).getSpecials();\n}\n```\n\n\
    如果你读过关于 EasyMock 的章节，这看起来会非常熟悉。回溯 mock 的通用步骤，`Mockito.mock()` 方法是第一步，`Mockito.when()`\
    \ 是第二步。我们希望 mock 在被调用时返回 specials（在本例中，一个空列表）。正如承诺的那样，第三步和第四步与 mock 无关，在切换到 Mockito\
    \ 时保持不变。最后，`Mockito.verify().foo()` 断言当调用 `foo()` 时，mock 的行为符合预期，而 `Mockito.times(1)`\
    \ 断言该 mock 方法被调用了一次¹。同样，这个测试在没有实际查询网络服务的情况下通过了。\n\n你可以通过向 `mock(Class, Answer)`\
    \ 方法传递以下常量之一来控制 mock 行为。\n\n## 第 4 章：测试\n\n| 行为 | 描述 |\n| :--- | :--- |\n| CALLS_REAL_METHODS\
    \ | 不会隐式地 mock 任何内容。 |\n| RETURNS_DEEP_STUBS | 允许链式 mock 调用，例如 `mockEmployee.getManager().getName()`。\
    \ |\n| RETURNS_DEFAULTS | **默认行为。** 一个返回 null、空列表、∅ 的“友善” mock。与 RETURNS_DEFAULTS\
    \ 类似，但也会委托返回另一个 mock。 |\n| RETURNS_MOCKS | 返回一个 mock。 |\n| RETURNS_SELF | 返回 mock\
    \ 本身。对于使用构建器模式创建的对象。 |\n| RETURNS_SMART_NULLS | 返回一个不会抛出 `NullPointerException`\
    \ 的“增强”null。 |\n\nMockito 还有一些注解可以使创建 stub 变得非常简单。stub 与 mock 不同，因为 stub 是不需要验证的。考虑以下代码：\n\
    \n```java\n@Mock\nprivate DailySpecialService mockDailySpecialService;\n\n@Test\n\
    public void menuCreatorCanBeUsed() {\n    MockitoAnnotations.initMocks(this);\n\
    \    var menuCreator = new MenuCreator(mockDailySpecialService);\n\n    try {\n\
    \        menuCreator.getTodaysMenu();\n        menuCreator.getTodaysMenu();\n\
    \    } catch (Exception e) {\n        e.printStackTrace();\n        Assert.fail(\"\
    Menu creators 应该是可重用的!\");\n    }\n}\n```\n\n在这里，我们并不关心 `DailySpecialService`\
    \ 的行为，我们只需要创建一个 stub，以便 `testCreator` 在单元测试期间不会尝试进行 HTTP 调用。`@Mock` 注解创建一个新的（即\
    \ `RETURNS_DEFAULTS`）stub，它返回方便的默认值。\n\n在极少数情况下，你可能想要测试它的某些真实方法和 stubbed 方法。为此，你可以使用\
    \ `@Spy` 注解。注意，即使是官方文档也建议避免过度使用：“真实的 spies 应该谨慎且偶尔使用，例如在处理遗留代码时……我不会为新的、测试驱动且设计良好的代码使用部分\
    \ mock (partial mocks)。”\n\n> ³² 类 Mockito. Mockito 2.7.22 API, https://static.mockito.org/mockito-core/2.7.22/org/mockito/mockito.html#spy.\
    \ 访问于 2017 年 5 月 14 日。\n\n# PowerMock\n\n如果在测试在此过程中，你发现自己陷入了困境，需要模拟静态方法的行为，你可能考虑使用\
    \ PowerMock 工具。它构建在 EasyMock 或 Mockito 之上，并提供了额外功能。\n\n以下是我们如何使用 EasyMock stub\
    \ 一个方法：\n\nDailySpecialServicePowerMock.java\n\n```java\n@Test\npublic void mockStaticWithEasyMock()\
    \ throws Exception {\n    PowerMock.mockStatic(DailySpecialService.class);\n \
    \   EasyMock.expect(DailySpecialService.isAvailable())\n        .andReturn(true);\n\
    \    PowerMock.replay(DailySpecialService.class);\n\n    var available = DailySpecialService.isAvailable();\n\
    \    assertTrue(available);\n}\n```\n\n以及使用 Mockito 的相同测试：\n\nDailySpecialServiceTestMockito.java\n\
    \n```java\n@Test\npublic void mockStaticWithMockito() throws Exception {\n   \
    \ PowerMock.mockStatic(DailySpecialService.class);\n    Mockito.when(DailySpecialService.isAvailable()).thenReturn(true);\n\
    \n    var available = DailySpecialService.isAvailable();\n    assertTrue(available);\n\
    }\n```\n\n诚然，这两个测试都不太有想象力。通常，只有当你处理第三方代码或遗留代码，且这些代码无法通过适当重构来避免静态方法调用时，才会使用 PowerMock。例如，想象一下这种情况（伪代码）——一个\
    \ web 控制器与第三方服务上下文通信：\n\n```java\npublic class MyHomeController {\n    public\
    \ void getHomePage() {\n        WebApplicationSession.setVariable(\"user\", new\
    \ User());\n    }\n}\n\npublic class MyHomeControllerTest {\n    @Test\n    public\
    \ void someTest() {\n        MyHomeController controller = new MyHomeController();\n\
    \        controller.getHomePage();\n    }\n}\n```\n\nPowerMock 还可以 mock final\
    \ 方法和类。更多信息，请查看 [PowerMock](https://github.com/powermock)。\n\n# 总结\n\n显然，测试世界非常广阔。事实上，我们已经看到许多框架可以满足需求。Mockito\
    \ 是一个不错的选择，EasyMock\n\n## 建议资源\n\n### 通用测试\n\n- Fowler, Martin. “Mocks Aren't\
    \ Stubs，”2007. https://martinfowler.com/articles/mocks\n- Koskela, Lasse. Test\
    \ Driven: Practical TDD for Java Developers. 2007. https://www.manning.com/test-driven\n\
    - Osherove, Roy. The Art of Unit Testing. 2013. https://www.manning.com/the-art-of-unit\n\
    \n### 框架特定\n\n- Acharya, Sujoy. Mastering Unit Testing Mockito and JUnit. 2014.\
    \ https://www.packpub.com/mastering-unit-testing-mockito-junit\n- Shah, Deep.\
