    # Chapter 7: Web Application Deployment


    Depending on the size of your company, you may never actually have to deploy your
    code. It''s possible that a deployment team takes care of it for you. Nonetheless,
    you should still be familiar with how the code is deployed, only so that you can
    properly maintain the project build files. On the other hand if you are on a smaller
    team, it''s possible you will need to know how to deploy the projects you build.


    Unlike console applications, Java web applications aren''t executed from the command
    line. (Although we will see an exception to this.) Instead, they run inside application
    servers that are responsible for processing requests to your code and responses
    back to the web server.


    # Packaging


    There are two common ways to package Java applications: WAR files and EAR files.


    A WAR file (Web Application archive) is really the same as a JAR file except with
    a different extension to easily identify it as a web application. When used as
    a deployment artifact, it contains all of the code required to run the application
    including domain objects, controllers, view files, etc.


    An EAR file (Enterprise Application archive) is a different type of deployment
    archive that includes both WAR and JAR files. Typically when an EAR file is used,
    the WAR files only contain the code related to a web application. Domain objects,
    services, etc. (which are called "Enterprise Java Beans" in this context) are
    packaged in JAR files. Theoretically this means that different teams could work
    on separate code bases (the web code and the domain code). Furthermore, you could
    have multiple web applications that share the same domain objects.


    The example code for the book contains a project that gets packaged as a WAR and
    a project that gets packaged as an EAR. Let''s compare the archive file structures:'
