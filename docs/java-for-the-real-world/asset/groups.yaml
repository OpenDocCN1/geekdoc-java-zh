    \n# API\n\n+   * Tomcat: Issue an HTTP PUT to http://server:8080/manager/text/deploy?path=iscream.\n\
    * WildFly:\n  1. Send the file via POST to http://server:9990/management/add-content\n\
    \  2. Note the BYTES_VALUE in the response\n  3. Post this JSON to http://localhost:9990/management\n\
    \n```\n{\n  \"content\": {\"hash\": [{\"BYTES_VALUE\":\"YOUR VALUE HERE\"}]},\n\
    \  \"address\": {\"deployment\":\"iscream-ejb.war\"},\n  \"operation\": \"add\"\
    ,\n  \"enabled\": \"true\"\n}\n```\n\n# Embedded Servers\n\nA final option to\
    \ run a web application is to include a Java Application Server with the web application.\
    \ Jetty and Tomcat are common choices because there are embedded versions of both\
    \ tools. By including the application server in your code, you can treat the code\
    \ just like a command line application and run it using java -jar. Indeed, this\
    \ is what Spring Boot does for its web applications (see Spring Boot in Chapter\
    \ 6)."
