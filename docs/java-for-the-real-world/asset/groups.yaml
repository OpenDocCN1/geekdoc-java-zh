    # Spring Boot


    We got an introduction to Spring Boot in the previous chapter and saw how it can
    be used for rapid application development. By adding another starter, we can use
    Spring Boot to build Spring MVC web applications.


    The major advantage is that you do not need to do any configuration. A Spring
    Boot web application has no web.xml, nor a WebApplicationInitializer class. Furthermore,
    there’s no need to create a @WebConfig class or dispatcher-servlet.xml. The presence
    of the spring-boot-starter-web starter on the classpath is enough to configure
    the application.


    # Thymeleaf


    Although it is possible to use JSP in a Spring application, the recommended way
    to create views is by using the Thymeleaf template engine. As long as Thymeleaf
    is on the classpath, it will automatically be used as the view renderer for the
    application. The Thymeleaf engine is similar to JSP technology, with one notable
    difference: Thymeleaf views are (X)HTML files that actually use custom attributes
    instead of tags. For comparison, how you would load the flavors into the view
    using Thymeleaf.'
