    # # SLF4J


    When developing a Java library, you''ll have the problem of deciding how to logging
    in a way that is both informative but not intrusive. Writing directly to STDOUT
    would be obnoxious, but choosing a logging provider forces consumers of the library
    to configure that provider. The solution is to use a logging facade.


    # ## But what is it, really?


    When configured correctly, SLF4J is the front-end for all logging. Libraries and
    your application code send log to SLF4J using the SLF4J API. Then SLF4J internally
    sends log messages to the logging provider of your choice: Log4j, JUL, etc.


    If you buy into using a logging facade, you''ll have a somewhat steeper curve,
    but the result is that your logging life will be much simpler. And thankfully,
    the SLF4J API is quite pleasant to use.


    To start with SLF4J, you will need to include a "binder" which does the actual
    work of translating between SLF4J and a logging provider. In the example code,
    I will use Log4j which means I include the log4j-slf4j-impl binder. If you''re
    keeping track at home this means we now have four dependencies just to do logging!
    The SLF4J API slf4j-api talks to the binder log4j-slf4j-impl which sends log messages
    to Log4j log4j-core which depends on Jackson jackson-dataformat-yaml for configuration.


    If you read the section on Logback, you know that we use the SLF4J LoggerFactory
    to create logger instances.


    ```

    private static final Logger log = LoggerFactory.getLogger(OrderService.class);

    ```


    SLF4J uses five of the six levels available in Log4j: trace, debug, info, warn,
    and error. Like Log4j, there are methods for all of these levels and they are
    overridden with options to pass in parameters and/or a Throwable.'
