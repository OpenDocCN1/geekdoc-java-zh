    \ It is the servlet container's job to handle the traffic between the web server\
    \ and the Java application. We will learn more about these containers in the next\
    \ chapter, but for now it's only important to know that an application has to\
    \ register itself with the container. This is commonly done with a web.xml file,\
    \ although some frameworks allow it to be done in pure Java. Most frameworks work\
    \ with the following folders:\n\n- src/main/java: Your application code.\n- src/main/resources:\
    \ Text files, properties, etc. that are included on the classpath to aid your\
    \ application code.\n- src/main/webapp/resources: Public resources such as CSS,\
    \ JavaScript, images, etc.\n- src/main/webapp/WEB-INF: Private resources that\
    \ the servlet container has access to.\n\n## ## Spring MVC\n\nGoing into detail\
    \ about the Model-View-Controller (MVC) paradigm is beyond the scope of this book,\
    \ but as a quick refresher, the controller is the logic and business objects,\
    \ it is what the user interacts with, and the controller ties the two together.\
    \ Spring’s MVC framework provides a controller-focused API that makes it easy\
    \ to translate requests into model objects and model objects into views.\n\n##\
    \ ### Model\n\nWe are going to build a trivial point-of-sale system for the IScream\
    \ company that lets an employee enter an ice cream order and calculate the cost.\
    \ We’ll add a few domain objects to help:\n\nFlavor.java\n\n```java\npackage com.letstalkdata.iscream.domain;\n\
    import java.util.Locale;\npublic enum Flavor {\n    VANILLA, CHOCOLATE, STRAWBERRY,\n\
    \    public String toString() {\n        return name().charAt(0) +\n         \
    \      name().substring(1).toLowerCase(Locale.getDefault());\n    }\n}\n```\n\n\
    Topping.java\n\n```java\npackage com.letstalkdata.iscream.domain;\nimport java.util.Locale;\n\
    public enum Topping {\n    CARAMEL,\n    CHERRY,\n    PEANUTS,\n    SPRINKLES,\n\
    \    public String toString() {\n        return name().charAt(0) +\n         \
    \      name().substring(1).toLowerCase(Locale.getDefault());\n    }\n}\n```\n"
  mdcn: "\n\n## 第 5 章：Spring\n\napplication.yml\n\n```yaml\nspring:\n  profiles:\n\
    \    active: uat\n```\n\napplication-uat.yml\n\n```yaml\nspecials:\n  url: http://www.mocky.io/v2/5904016210000033d034f66dc\n\
    ```\n\napplication-prod.yml\n\n```yaml\nspecials:\n  url: http://www.example.com/some-prod-url\n\
    ```\n\n此配置将默认 profile 设置为 uat。但是，如前所述，可以使用 Java 系统变量 `spring.profiles.active`\
    \ 来覆盖它，例如执行 `java -Dspring.profiles.active=prod my-app.jar`，或者使用环境变量 `SPRING_PROFILES_ACTIVE`。事实上，Spring\
    \ Boot 属性可以使用这两种方法进行覆盖。正如前面提到的，通过用逗号分隔每个 profile 名称可以轻松地混合 profile。\n\n# ## 文青式视点：Spring\
    \ Cloud Config\n\n如果你正在运行分布式软件或需要支持许多环境，application profile 文件可能会变得繁琐。Spring 的解决方案是\
    \ Spring Cloud Config，它允许应用程序查询 Web 服务以确定其属性。默认情况下，属性存储在 Git 仓库中，这些仓库由 Spring\
    \ Cloud Server 克隆并传递给请求的应用程序。\n\n# ## 总结\n\n我们仅仅接触了 Spring 的冰山一角，遗憾的是它的用法如此多样，以至于给出通用的建议。然而，我们可以记住\
    \ Spring Core 的目标是在运行时用所有配置适当的依赖项组装应用程序。正如所提到的，Spring 工具集是无处不在的，我们将在后面的章节中再次看到它。\n\
    \nSpring Boot 是 Spring 的新方法，它让开发者能够花费更多时间编写代码，而减少在配置上的花费。你可以看到本章代码中包含的示例，但我将在讨论\
    \ Web 框架的第 6 章中深入探讨。\n\n> *https://cloud.spring.io/spring-cloud-config/spring-cloud-config.html\n\
    \n# ## 建议资源\n\n“Guides”. Spring, https://spring.io/guides. 访问于 2017 年 6 月 18 日。\n\
    \nDeinum, Marten. Spring Recipes: A Problem-Solution Approach. Apress, 2014. http://www.apress.com/br/book/9781430259084\n\
    \nWalls, Craig. Spring Boot in Action. Manning, 2015. https://www.manning.com/books/spring-boot-in-action\n\
    \nWalls, Craig. Spring in Action. Manning, 2014. https://www.manning.com/books/spring-in-action-fourth-edition\n\
    \nYong, Mook Kim. “Spring Tutorial”. Mkyong.com, http://www.mkyong.com/tutorials/spring-tutorials.\
    \ 访问于 2017 年 6 月 18 日。\n\n## ## 第 6 章：Web 应用程序框架\n\nJava 在企业环境中最常见的用途或许是 Web 开发。让\
    \ Java Web 开发变得可行的 API 是“Java 2 平台企业版”（或 J2EE），它首次发布于 1999 年。从那时起，许多 Web 框架兴起又落落。即使涵盖目前活跃的所有框架也将是一项巨大的工程，因此我将只关注一些最流行的框架。\n\
    \n- **Spring MVC**: Spring MVC 框架到目前为止是最主导的框架。它构建在我们已经看到的 Spring Core 之上，并提供了构建控制器的功能，用于与业务模型和\
    \ HTML 视图交互。\n- **Spring Boot**: 我们看到了如何使用 Spring Boot 开发控制台应用程序，但它也可以作为 Spring\
    \ MVC 的封装，让 Web 开发变得更加简单。\n- **Java Server Faces (JSF)**: JSF 是一个基于复用 UI 组件的框架，这些组件可以轻松地与数据和事件处理器关联。它抽象了大部分\
    \ HTML、CSS 和 JavaScript。\n- **Vaadin**: Vaadin 进一步了一步，它与 JSF 一样集成了组件。\n\n## ##\
    \ 遗留视点：过时的框架\n\n在过去的几年中，我发现许多框架已经过时。在 2000 年代早期有一些流行的框架：\n\n- **Struts**: 曾经非常流行的\
    \ Java 框架。\n- **Spring MVC**: 早期的版本。\n- **JSF**: 也是流行的框架。\n\n现在，我们关注更现代框架：\n-\
    \ **Spring MVC**: 它是目前的标准。\n- **Spring Boot**: 简化了开发流程。\n- **JSF**: 仍然在某些企业级应用中使用。\n\
    - **Vaadin**: 允许使用 Java 构建 Web 界面。\n\n在使用遗留系统时，我们经常会遇到：\n- **Servlets**: Java\
    \ Web 开发的底层。\n- **JSP**: 用于动态生成内容。\n\n## ## Java 企业版 API\n\n在编写 Java 框架时，通常需要与\
    \ Java EE 交互。它为 Web 应用程序提供了许多核心 API，：\n\n### ### 请求与响应\n\n请求以 `HttpServletRequest`\
    \ 的形式进入，提供了会话、Cookie、参数等数据。返回给客户端的是 `HttpServletResponse`。\n\n### ### Java 页面\n\
    \nJavaServer Pages (JSP) 是一种允许动态生成 HTML 的技术。jsp 文件看起来类似于 HTML 文件，它们在服务器端评估并发送到客户端。\n\
    \n### Servlet 容器\n\n大多数 Java 应用程序部署在“Servlet 容器”中。它处理 Web 服务器和 Java 应用程序之间的流量。我们将在下一章详细介绍这些容器，但现在只需要知道应用程序必须向容器注册自己。这通常通过\
    \ web.xml 文件完成，尽管某些框架允许纯 Java 实现。大多数框架使用以下文件夹：\n\n- src/main/java: 应用程序代码。\n-\
    \ src/main/resources: 包含类路径的文本文件、属性等，辅助应用程序代码。\n- src/main/webapp/resources: CSS、JavaScript、图像等公共资源。\n\
    - src/main/webapp/WEB-INF: 容器可以的私有资源。\n\n## Spring MVC\n\n详细讨论模型-视图-控制器（MVC）范式超出了本书的范围，但作为快速回顾：控制器是逻辑和业务对象，它是用户交互的对象，控制器将两者结合在一起。Spring\
    \ MVC 框架提供了一个以控制器为中心的 API，可以轻松地将请求转换为模型对象并将模型对象转换为视图。\n\n## 模型\n\n我们将为 IScream\
    \ 公司构建一个简单的点点系统，让员工输入冰淇淋订单并计算费用。我们将添加一些领域对象来帮助：\n\n"
