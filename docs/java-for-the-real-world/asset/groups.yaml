  - "[PAGE 113]\n\n# Chapter 8: Working with Databases\n\nis typically larger than\
    \ a single database round-trip and may contain a few tightly related operations.\
    \ For example, a unit of work might be one user request in a web application.\n\
    \nIn addition to merge and persist, a Hibernate session has some operations like\
    \ save, update, and saveOrUpdate. Sadly, these are also non-trivial. For a brief\
    \ discussion, see Hibernate: save, persist, update, merge, saveOrUpdate^{294}\
    \ on Baelung.\n\nThe code to save using native Hibernate is relatively short,\
    \ but remember to (auto) close the Session.\n\nOrderService.java\n\n```\npublic\
    \ void save(Order order) {\n    try(var session = sessionFactory.openSession())\
    \ {\n        var tx = session.beginTransaction();\n        session.persist(order);\n\
    \        tx.commit();\n    } // Session is auto-closed\n}\n```\n\n# Reading Data\n\
    \nUsing an ORM, it's possible to say \"Save this object\" because the object has\
    \ annotations, but saying \"Get an object\" is not straight-forward. What filters\
    \ should be applied? Do you want one object or many? Do you want child objects?\
    \ Etc. Because of these questions, you need to construct a query.\n\nWith Hibernate,\
    \ you have a few options: use a Criteria object, write Hibernate Query Language\
    \ (HQL), or write native SQL. (In general, you should avoid SQL, since that really\
    \ defeats the purpose of an ORM framework. But there are definitely situations\
    \ where it cannot be (easily) avoided.) Here's how the three methods compare:\n\
    \n# Criteria:\n\n```\nprivate List<Ingredient> getIngredients(Ingredient.Type\
    \ type) {\n    CriteriaBuilder cb = entityManager.getCCriteriaBuilder();\n   \
    \ CriteriaQuery<Ingredient> criteriaQuery =\n    cb.createQuery(Ingredient.class);\n\
    \    Root ingredient = criteriaQuery.from(Ingredient.class);\n    criteriaQuery.where(cb.equal(ingredient.get(\"\
    type\"), type));\n    TypedQuery<Ingredient> query = entityManager.createQuery(criteriaQuery);\n\
    \    return query.getResultList();\n}\n```\n\n# HQL:"
  - "[PAGE 114]\n\n# Chapter 8: Working with Databases\n\n```\nprivate List<Ingredient>\
    \ getIngredients(Ingredient.Type type) {\n  var hql = \"select i from Ingredient\
    \ where type :=type\";\n  Query query = entityManager.createQuery(hql);\n  query.setParameter(\"\
    type\", type);\n  @SuppressWarnings(\"unchecked\")\n  var ingredients = (List<Ingredient>)\
    \ query.getResultList();\n  return ingredients;\n}\n```\n\nNative SQL:\n\n```\n\
    private List<Ingredient> getIngredients(Ingredient.Type type) {\n  var sql = \"\
    select * from ingredient where ingredient_type = ?\";\n  Query query = entityManager.createNativeQuery(sql,\
    \ Ingredient.class);\n  query.setParameter(1, type.name());\n  @SuppressWarnings(\"\
    unchecked\")\n  var ingredients = (List<Ingredient>) query.getResultList();\n\
    \  return ingredients;\n}\n```\n\nIf you are native Hibernate instead of JPA,\
    \ the code is largely the same except that Query is org.hibernate.Query, not a\
    \ javax.persistence.Query and is created from Session.createQuery().\nDeciding\
    \ which method to use isn't as straightforward as I already mentioned that native\
    \ SQL should be avoided. Using native SQL prevents Hibernate from doing any checks,\
