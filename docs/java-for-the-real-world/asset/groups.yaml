    # Using Test Doubles


    Somtimes when writing tests, we run into objects that are cumbersome to work with.
    Typically these are objects that interact with the outside world—database connectors,
    file system readers, web context objects, etc. Test doubles are objects that stand
    in for the complex objects in order to make writing tests easier. If this concept
    is new to you, I highly recommend “Mocks Aren’t Stubs”²⁹ by Martin Fowler. Naturally,
    Java has many frameworks for working with test doubles: EasyMock, Mockito, JMock,
    PowerMock, . . . I’ll be covering of them.


    +   - Mock was one of the first on the scene and tends to be more common in older
    projects.

    - Today, Mockito is the most-used mocking library².

    - PowerMock sits on top of either EasyMock or Mockito to provide additional functionality


    # Modifying IScream for Mockable Services


    Right now our application is set up to make a web service call out to the internet
    to determine the daily specials. In context of unit tests, this is slow and unreliable.
    An HTTP call could take a few seconds and there’s no guarantee that the service
    will be available. Unless we are specially testing the service integration (i.e.
    in an integration test), we would really like to avoid actually talking to the
    internet. Mocks to the rescue.


    I added a new class to the code to make our tests a little easier to write:


    > ²⁹https://martinfowler.com/articles/mocksArenStubs.html

    ³⁰http://blog.takipi.com/we-analyzed-60678-libraries-on-github-here-are-the-top-100/'
