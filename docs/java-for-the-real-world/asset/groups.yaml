  md: "\n# Chapter 8: Working with Databases\n\nis typically larger than a single\
    \ database round-trip and may contain a few tightly related operations. For example,\
    \ a unit of work might be one user request in a web application.\n\nIn addition\
    \ to merge and persist, a Hibernate session has some operations like save, update,\
    \ and saveOrUpdate. Sadly, these are also non-trivial. For a brief discussion,\
    \ see Hibernate: save, persist, update, merge, saveOrUpdate^{294} on Baelung.\n\
    \nThe code to save using native Hibernate is relatively short, but remember to\
    \ (auto) close the Session.\n\nOrderService.java\n\n```\npublic void save(Order\
    \ order) {\n    try(var session = sessionFactory.openSession()) {\n        var\
    \ tx = session.beginTransaction();\n        session.persist(order);\n        tx.commit();\n\
    \    } // Session is auto-closed\n}\n```\n\n# Reading Data\n\nUsing an ORM, it's\
    \ possible to say \"Save this object\" because the object has annotations, but\
    \ saying \"Get an object\" is not straight-forward. What filters should be applied?\
    \ Do you want one object or many? Do you want child objects? Etc. Because of these\
    \ questions, you need to construct a query.\n\nWith Hibernate, you have a few\
    \ options: use a Criteria object, write Hibernate Query Language (HQL), or write\
    \ native SQL. (In general, you should avoid SQL, since that really defeats the\
    \ purpose of an ORM framework. But there are definitely situations where it cannot\
    \ be (easily) avoided.) Here's how the three methods compare:\n\n## Criteria:\n\
    \n```\nprivate List<Ingredient> getIngredients(Ingredient.Type type) {\n    CriteriaBuilder\
    \ cb = entityManager.getCriteriaBuilder();\n    CriteriaQuery<Ingredient> criteriaQuery\
    \ =\n    cb.createQuery(Ingredient.class);\n    Root ingredient = criteriaQuery.from(Ingredient.class);\n\
    \    criteriaQuery.where(cb.equal(ingredient.get(\"type\"), type));\n    TypedQuery<Ingredient>\
    \ query = entityManager.createQuery(criteriaQuery);\n    return query.getResultList();\n\
    }\n```\n\n## HQL:\n\n```\nprivate List<Ingredient> getIngredients(Ingredient.Type\
    \ type) {\n  var hql = \"select i from Ingredient where type = :type\";\n  Query\
    \ query = entityManager.createQuery(hql);\n  query.setParameter(\"type\", type);\n\
    \  @SuppressWarnings(\"unchecked\")\n  var ingredients = (List<Ingredient>) query.getResultList();\n\
    \  return ingredients;\n}\n```\n\n## Native SQL:\n\n```\nprivate List<Ingredient>\
    \ getIngredients(Ingredient.Type type) {\n  var sql = \"select * from ingredient\
    \ where ingredient_type = ?\";\n  Query query = entityManager.createNativeQuery(sql,\
    \ Ingredient.class);\n  query.setParameter(1, type.name());\n  @SuppressWarnings(\"\
    unchecked\")\n  var ingredients = (List<Ingredient>) query.getResultList();\n\
    \  return ingredients;\n}\n```\n\nIf you are native Hibernate instead of JPA,\
    \ the code is largely the same except that Query is org.hibernate.Query, not a\
    \ javax.persistence.Query and is created from Session.createQuery().\n\nDeciding\
    \ which method to use isn't as straightforward as I already mentioned that native\
    \ SQL should be avoided. Using native SQL prevents Hibernate from doing any checks,\
    \ and you are saying, \"Trust me, I know what I'm doing, just execute the SQL\"\
    . However, there are legitimate reasons to use native SQL. If you have a complex\
    \ query or you need to retrieve data that map to an Entity, it's your best choice.\
    \ On the other end of the spectrum is the CriteriaBuilder which lets retrieve\
    \ data without writing SQL and is completely type-safe. The down side is that\
    \ it is fairly verbose and difficult to read. I personally myself using the middle\
    \ ground of HQL most often. HQL looks similar to SQL, which I find easier to read\
    \ than the criteria, at the cost of some type safety.\n\n# Summary\n\nMany Java\
    \ applications interact with a database and the Java standard library provides\
    \ only the most basic database connection tools. While some codebases rely pure\
    \ on JDBC, there's a range of frameworks available to make database interaction\
    \ more pleasant.\n\nSpring JDBC provides some functionality on top of JDBC, but\
    \ still relies on manually translating between domain objects and SQL. MyBatis\
    \ handles most of translation on its own and supports storing SQL outside of the\
    \ code. Finally, Hibernate attempts to abstract away all at least most) SQL from\
    \ the developer. Most modern Hibernate projects will take advantage of JPA annotations,\
    \ while older projects may still be using XML mappings.\n\nMany words have been\
    \ written on which data selection is best, but the reality is a case can be made\
    \ for all of them. As such, it's important to familiarize yourself with the different\
    \ approaches. You're likely to come across all of them sooner or later.\n\n# Suggested\
    \ Resources\n\n- Bauer, Christian, Gavin King, and Gary Gregory. *Java Persistence\
    \ with Hibernate, Second Edition.* Manning, 2015. https://www.manning.com/books/java-persistence-with-hibernate-second-edition.\n\
    - \"Lesson: JDBC Basics\". Oracle, 2015. https://docs.oracle.com/javase/tutorial/jdbc/basics/.\n\
    - Mihalcea, Vlad. *High-Performance Java Persistence.* Leanpub, 2017. https://leanpub.com/high-performance-java-persistence.\n\
    - Prajapati, Yogesh and Vishal Ranaparariya. *Java Hibernate Cookbook.* Packt,\
    \ 2015. https://www.packpub.com/application-development/java-hibernate-cookbook.\n\
    - Reddy, K. Siva Prasad. *Java Persistence with Hibernate.* Packt, 2013.\n"
  mdcn: "\n\n# 第 8 章：数据库操作\n\n它通常比单次数据库往返要大，并可能包含几个紧密相关的操作。例如，一个工作单元可能是 Web 应用中的一次用户请求。\n\
    \n除了 `merge` 和 `persist`，Hibernate session 还有一些诸如 `save`、`update` 和 `saveOrUpdate`\
    \ 等操作。遗憾的是，这些操作同样并不简单。简要讨论，请参见 Baelung 上的 Hibernate: save, persist, update, merge,\
    \ saveOrUpdate^{294}。\n\n使用原生 Hibernate 保存数据的代码相对短，但请记住（自动）关闭 Session。\n\nOrderService.java\n\
    \n```\npublic void save(Order order) {\n    try(var session = sessionFactory.openSession())\
    \ {\n        var tx = session.beginTransaction();\n        session.persist(order);\n\
    \        tx.commit();\n    } // Session 自动关闭\n}\n```\n\n# 读取数据\n\n使用 ORM 时，可以说“保存这个对象”，因为对象带有注解，但说“获取一个对象”却并不直观。应该应用哪些过滤器？你是想要一个对象还是多个？你想要子对象吗？等等。由于这些问题，你需要构建一个查询。\n\
    \n在 Hibernate 中，你有几种选择：使用 `Criteria` 对象、编写 Hibernate 查询语言 (HQL) 或编写原生 SQL。（通常情况下，你应该避免使用\
    \ SQL，因为那真的违背了 ORM 框架的初衷。但在某些情况下，确实是无法（轻易）避免的。）以下是这三种方法的对比：\n\n## Criteria:\n\n\
    ```\nprivate List<Ingredient> getIngredients(Ingredient.Type type) {\n    CriteriaBuilder\
    \ cb = entityManager.getCriteriaBuilder();\n    CriteriaQuery<Ingredient> criteriaQuery\
    \ =\n    cb.createQuery(Ingredient.class);\n    Root ingredient = criteriaQuery.from(Ingredient.class);\n\
    \    criteriaQuery.where(cb.equal(ingredient.get(\"type\"), type));\n    TypedQuery<Ingredient>\
    \ query = entityManager.createQuery(criteriaQuery);\n    return query.getResultList();\n\
    }\n```\n\n## HQL:\n\n```\nprivate List<Ingredient> getIngredients(Ingredient.Type\
    \ type) {\n  var hql = \"select i from Ingredient where type = :type\";\n  Query\
    \ query = entityManager.createQuery(hql);\n  query.setParameter(\"type\", type);\n\
    \  @SuppressWarnings(\"unchecked\")\n  var ingredients = (List<Ingredient>) query.getResultList();\n\
    \  return ingredients;\n}\n```\n\n## Native SQL:\n\n```\nprivate List<Ingredient>\
    \ getIngredients(Ingredient.Type type) {\n  var sql = \"select * from ingredient\
    \ where type = ?\";\n  Query query = entityManager.createNativeQuery(sql, Ingredient.class);\n\
    \  query.setParameter(1, type.name());\n  @SuppressWarnings(\"unchecked\")\n \
    \ var ingredients = (List<Ingredient>) query.getResultList();\n  return ingredients;\n\
    }\n```\n\n决定使用哪种方法并不像我所提到的那样简单。使用原生 SQL 阻止了 Hibernate 进行任何检查，除非你是在说：“我知道做什么，执行\
    \ SQL 即可”。然而，确实有合理的理由使用原生 SQL。如果你有复杂的查询或需要映射到实体的查询，它是你的最佳选择。在光谱的另一端是 Criteria，它允许在不编写\
    \ SQL 的情况下获取数据并且完全类型安全。缺点是繁琐且难以阅读。我个人通常经常使用中间地带 HQL。HQL 看起来像 SQL，比 Criteria 更易读，代价是牺牲了部分类型安全。\n\
    \n# 总结\n\n许多 Java 应用与数据库交互，而 Java 标准库仅提供了最基本的数据库连接工具。虽然某些代码库依赖纯 JDBC，但有很多框架可以使数据库交互变得轻松。\n\
    \nSpring JDBC 在 JDBC 之上提供了一些功能，但仍然依赖手动在领域对象和 SQL 之间进行转换。MyBatis 处理了大部分转换并将 SQL\
    \ 存储在代码外部。最后，Hibernate 尝试从开发者那里屏蔽大部分 SQL。现代 Hibernate 项目将利用 JPA 注解，而旧项目可能仍在使用\
    \ XML 映射。\n\n关于哪种数据选择方法最好有很多论述，但事实是每种方法都有其理由。因此，熟悉这些方法是关重要的。你迟早会遇到它们中的所有。\n\n\
    # 建议资源\n\n- Bauer, Christian, Gavin King, and Gary Gregory. *Java Persistence\
    \ with Hibernate, Second Edition.* Manning, 2015. https://www.manning.com/books/java-persistence-with-hibernate-second-edition.\n\
    - \"Lesson: JDBC Basics\". Oracle, 2015. https://docs.oracle.com/javase/tutorial/jdbc/basics/.\n\
    - Mihalcea, Vlad. *High-Performance Java Persistence.* Leanpub, 2017. https://leanpub.com/high-performance-java-persistence.\n\
