    >\n  <servlet>\n    <servlet-name>dispatcher</servlet-name>\n    <class>org.springframework.web.servlet.DispatcherServlet</class>\n\
    \    <init-param>\n      <param-name>contextLocation</param-name>\n      <param-value>WEB-INF/dispatcher-servlet.xml</param-value>\n\
    \    </init-param>\n    <load-on-startup>1</load-on-startup>\n  </servlet>\n \
    \ <servlet-mapping>\n    <servlet-name>dispatcher</servlet-name>\n    <url-pattern>/*</url-pattern>\n\
    \  </servlet-mapping>\n</web-app>\n```\n\n如果你选择这种方式，你可以使用 Java 对象来代替它。\n\n# WebApplicationInitializer.java\n\
    \n```java\npackage com.letstalkdata.iscream;\n\nimport org.springframework.web.WebApplicationInitializer;\n\
    import org.springframework.web.context.ContextLoaderListener;\nimport org.springframework.web.context.support.AnnotationConfigWebApplicationContext;\n\
    import org.springframework.web.servlet.DispatcherServlet;\n\nimport javax.servlet.ServletContext;\n\
    \npublic class WebApplicationInitializer implements WebApplicationInitializer\
    \ {\n  @Override\n  public void onStart(ServletContext container) {\n    var context\
    \ = new AnnotationConfigWebApplicationContext();\n    context.setConfigLocation(\"\
    com.letstalkdata.iscream.WebConfig\");\n    container.addListener(new ContextLoaderListener(context));\n\
    \n    var dispatcherServlet = new DispatcherServlet(context);\n    var dispatcher\
    \ = container.addServlet(\"dispatcher\", dispatcherServlet);\n    dispatcher.setLoadOnStartup(1);\n\
    \    dispatcher.addMapping(\"/\");\n}\n```\n\n完成这些完成后，现在就可以将应用程序部署到 servlet 容器了。不过，如果你想尝试示例代码，可以运行\
    \ `appRun`，它会在你的电脑上启动一个轻量级 servlet 容器（Jetty）并将应用程序部署到 http://localhost:8080。\n\
    \n# Spring Boot\n\n我们在上一节中介绍了 Spring Boot，并看到了它如何被用于快速应用程序开发。通过添加另一个启动器（starter），我们可以使用\
    \ Spring Boot 来构建 Spring MVC Web 应用程序。\n\n主要的优势在于你不需要进行任何配置。Spring Boot Web 应用程序既没有\
    \ `web.xml`，也没有 `WebApplicationInitializer` 类。此外，无需创建 `@WebConfig` 类或 `dispatcher-servlet.xml`。类路径上存在\
    \ `spring-boot-starter-web` 启动器就足够配置应用程序了。\n\n# Thymeleaf\n\n虽然在 Spring 应用可以使用\
    \ JSP，但推荐创建视图的方法是使用 Thymeleaf 模板引擎。只要类路径上有 Thymeleaf，它就会自动作为应用程序的视图渲染器。Thymeleaf\
    \ 引擎与 JSP 技术类似，但有一个显著区别：Thymeleaf 视图是 (X)HTML 文件，它们实际上使用自定义属性而不是标签。作为对比，以下是你如何使用\
    \ Thymeleaf将口味加载到视图中的方法。\n\n```html\n<select class=\"form-control\" id=\"flavor\"\
    \ name=\"flavor\">\n  <option value=\"\" selected=\"selected\"></option>\n  <option\
    \ th:each=\"${flavor}\" th:value=\"${flavor.name}\" th:text=\"${flavor}\"></option>\n\
    </select>\n```\n\n你可以看到这通常看起来像 HTML，而 `th` 属性提供了逻辑。按照惯例，`th` 是 http://www.thymeleaf.org\
    \ 的别名。\n\n由于你直接处理 HTML，因此可以在不运行应用程序的情况下在浏览器中加载视图。例如：\n\n![](img/388ca427680b953f016e4c3ce24cad0b_69_0.png)\n\
    \n# 新订单\n\n| 口味 (Flavor) |\n| --- |\n| 冰淋 (Scoops) |\n| 配料 (Toppings) |\n| [ ]\
    \ | 创建订单 |\n\n浏览器中的 Thymeleaf 视图\n\n显然，没有任何服务器端数据被渲染到视图中，但它可以让你对布局和样式有一个直观的了解，使前端设计的迭代更快。关于\
    \ Thymeleaf 的更深入讨论，请参阅官方文档。\n\n# 运行 Spring Boot Web 应用\n\n我之前提到过，Java Web 应用程序运行在\
    \ servlet 容器中。部署到容器需要几分钟（对于复杂的应用程序需要更长时间），这在开发过程中可能会令人困扰。为了加快速度，你可以使用插件将应用程序部署到轻量级的本地容器。在本章中，我使用了\
    \ \"Jetty Gradle\" 插件（\"Gretty\"），可以通过 `gradleRun` 调用。Spring Boot 采用了类似的方法，它不再将容器和应用程序视为独立的实体，而是将一个容器（Tomcat）嵌入到你的应用程序中。当你使用\
    \ `java -jar` 从命令行运行应用程序时，嵌入式容器会自动启动。\n\n> *http://www.thymeleaf.org*\n\n# JavaServer\
    \ Faces\n\nJavaServer Faces (JSF) 是一种关注 UI 的技术。与 Spring 不同，使用 JSF 创建了一个基于组件的模型来构建用户界面。JSF\
    \ 是一个构建 Web 应用程序的框架。\n\n# Managed Beans (托管 Bean)\n\n与 Spring 不同，使用 JSF 创建了一个基于组件的模型来构建用户界面。JSF\
    \ 是一个构建 Web 应用程序的框架。在 JSF 中，托管 Bean 是用于保存视图数据和逻辑的对象。有几种 Bean 作用域：\n\n- 应用作用域 (ApplicationScoped)：Bean\
    \ 在整个应用程序运行期间有效。\n- 会话作用域 (SessionScoped)：Bean 在用户会话期间有效。\n- 请求作用域 (RequestScoped)：Bean\
    \ 在单个 HTTP 请求持续期间有效。\n- 视图作用域 (ViewScoped)：只要用户留在同一个视图中，Bean 就会有效。\n\n> *http://docs.oracle.com/javaee/6/tutorial/index.html*\n\
    \n"
