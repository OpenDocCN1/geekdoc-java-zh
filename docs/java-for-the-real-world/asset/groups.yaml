    ## Appendix A: Docker


    Specific versions of images may be referred to using the image:tag syntax, as
    azul/zulu-openjdk:10.


    A number of additional commands² can be included in a Dockerfile, as ADD to include
    resources, ENV to set environment variables, for example. For this Dockerfile
    is used to create a Spring Boot web application.


    ## Dockerfile


    ```

    FROM azul/zulu-openjdk:10

    ADD build/libs/iscream-web-0.0.1-SNAPSHOT.jar app.jar

    ENTRYPOINT [ "sh", "-c", "java -jar /app.jar" ]

    ```


    The ENTRYPOINT command tells Docker what to run as soon as the container starts.
    This is important otherwise the container would just boot the tiny Alpine Linux
    and nothing else. To actually create the image, we can run docker build --tag=iscream
    . The tag is optional, without it, Docker will give it a random name. Building
    an image for the first time may take a minute or so because all of the base images
    need to be downloaded from the internet. Subsequent builds will be faster because
    Docker saves the base images.


    ## Deploying a Docker container


    Once an image has been built, it is possible to create one or more containers
    from that image. Containers generally be thought of as (relatively) short-lived
    and disposable. If they need to persist data, that is done with Docker volumes.
    Containers are scrapped when a new version of your code needs to be deployed or
    when you need to reconfigure the application with different parameters. It is
    even possible to create highly disposable containers that are automatically deleted
    by Docker when their process finishes. This pattern is useful for batch or ETL
    jobs that have no need to linger after their task is complete.


    A very simple container can be created using docker run -d -p 8080:8080 iscream.
    This will start an instance of the iscream image in the background (-d), assign
    it a name, and expose the internal port 8080 (-p). After issuing that command,
    you can verify the program by navigating to the familiar http://localhost:8080/orders/new.


    You can docker ps to see the name of the container and then run docker stop container_name
    to stop the container and docker rm container_name to delete it.


    Of course, there are many parameters to the run command³, but here are a few examples
    to get you started


    - docker run -it -p 8080:8080 iscream: Run a container in "interactive" mode

    - docker run -d --p 8080:8080 iscream: Remove a container automatically when it
    stops

    - docker run -d --name iscream_dev -p 8080:8080 iscream: Name the container instance
    iscream_dev


    > ⁴https://docs.docker.com/engine/reference/builder/

    ⁵https://docs.docker.com/engine/reference/run/


    ## Caveats


    ### Memory


    If you are running multiple containers on a Docker host (which you should be!),
    it''s a good idea to put some bounds on how much memory the containers can use.
    Otherwise, a memory leak in application could negatively impact others. Docker
    allows you to limit the memory a container uses with the --memory flag, but if
    you are using Java 9 or earlier, it is critical that you also limit the memory
    at the JVM level! (For more details on why, see Java Inside Docker: What You Must
    Know to Not FAIL** by Rafael Benvides). This requires two steps.


    First, modify your Dockerfile to pass $JAVA_OPTS to the java command in:


    ```

    ENTRYPOINT [ "sh", "-c", "java $JAVA_OPTS -jar /app.jar" ]

    ```


    Second, when creating a container, limit the container memory and set $JAVA_OPTS
    --usage as in:


    ```

    docker run -d -p 8080:8080 -m 1536m -e JAVA_OPTS=''-Xmx1024m'' iscream

    ```


    Since Java 10, changes have been made so that Java can inspect the constraints
    applied at the container level. Setting the JVM memory constraint is no longer
    needed.


    ```

    docker run -d -p 8080:8080 -m 1536m iscream

    ```


    ### JDKs


    If you remember all the way back to Chapter 1, you will recall that there are
    actually multiple JDKs for Java. Due to Oracle''s licensing, it is likely illegal
    to use an Oracle JDK inside of Docker. The alternative is to use a JDK with permissive
    licensing as OpenJDK. This will be suitable for most situations. However, due
    to variations in tag names, you might accidentally use a version of the JDK that
    you did not intend to. For example, 8-jdk-alpine does not specify a specific commit
    and can be any version of Java 8.


    One alternative is to specify a specific tag name such as 8ut31-jdk-alpine (although
    this does not point to a specific JDK commit). Or you could use a different JDK
    such as Zulu which is fully tested and has pegged to specific commits such as
    8u144-28.03.0.


    For what''s worth, I have switched to Zulu most of the time. Although I don''t
    find the version uncertainty concerning and plenty of Docker containers will still
    build from OpenJDK. I trust that OpenJDK is well-tested. However, I do not work
    with mission-critical software that tolerate an occasional (and rare!) JDK bug.
    You should choose a JDK appropriate to your situation.


    > *https://dzone.com/articles/java-inside-docker-what-you-must-know-to-not-fail

    *http://blog.takips.com/running-java-on-docker-your-breaking-law/


    ## Suggested Documentation Resources


    "Docker Documentation" Docker, 2017. https://docs.docker.com.


    Krochmalski, Jarosław. Docker and Kubernetes for Java Developers. Packt 2017.

    https://www.packpub.com/virtualization-and-cloud/docker-and-kubernetes-java-developers

