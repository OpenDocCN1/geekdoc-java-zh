    # JPA Annotations


    The JPA provides a set of annotations that are used to mark up domain classes
    to describe how they map to the underlying database. In general, classes are annotated
    @Entity and @Table(name="myTableName"), while properties are annotated @Column(name="myColumnName").
    Additional annotations are added to "special" columns such as IDs and foreign
    columns. Importantly, foreign keys are not represented as integers but as the
    objects themselves. For example, the OrderLineItem class does not have a purchase_id
    property, it has an Order property. Here''s the complete annotated properties
    of that class.'
