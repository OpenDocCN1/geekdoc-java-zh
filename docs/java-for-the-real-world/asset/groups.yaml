  md: "\n# Hibernate\n\nWe just saw how MyBatis can bind POJO domain objects to SQL\
    \ statements, but there was still overhead in manually writing out relatively\
    \ basic SQL. Additionally, relationships between objects were annoying to work\
    \ with. Object relational mappers (ORM) attempt to solve these problems by abstracting\
    \ away SQL from the developer. Theoretically, given enough information about the\
    \ objects, it is possible for all SQL to be generated programmatically.\n\nHibernate\
    \ was one of the first ORM tools for Java. It was not until a few years later\
    \ when persistence was standardized with the Java Persistence API (JPA). The JPA\
    \ provides no implementation—rather it allows third-party tools to leverage a\
    \ common API. And it just so happens that Hibernate is the most commonly used\
    \ third-party implementation. Having said that, it is still possible to use Hibernate\
    \ without JPA. The sample code for this chapter includes two Hibernate projects:\
    \ one that is more modern and leverages the JPA annotations and one that is an\
    \ older style that uses native classes to interact with the database. For convenience,\
    \ the annotations code example uses JPA interfaces while the XML code example\
    \ uses Hibernate native objects, but it's possible to mix and match. You should\
    \ be familiar with all of these options as they are all still popular.\n\n# Domain\
    \ POJO adjustments\n\nWhen using an ORM, the closer your domain objects match\
    \ the database the less you will need to do. While it is certainly possible to\
    \ handle abstract classes¹(e.g. an ingredient table with both Flavor and Topping\
    \ classes), I don't want to muddy your understanding of the JPA with those details.\
    \ Instead, let's change our domain objects match the database tables.\n\n> http://docs.oracle.com/java/6/tutorial/doc/beanm.html#bnubq\n\
    \n![](img/388ca427680b953f016e4c3ce24cad0b_108_0.png)\n\nThe IceCream Domain Objects\n\
    \n# JPA Annotations\n\nThe JPA provides a set of annotations that are used to\
    \ mark up domain classes to describe how they map to the underlying database.\
    \ In general, classes are annotated @Entity and @Table(name=\"myTableName\"),\
    \ while properties are annotated @Column(name=\"myColumnName\"). Additional annotations\
    \ are added to \"special\" columns such as IDs and foreign columns. Importantly,\
    \ foreign keys are not represented as integers but as the objects themselves.\
    \ For example, the OrderLineItem class does not have a purchase_id property, it\
    \ has an Order property. Here's the complete annotated properties of that class.\n\
    \n# OrderLine.java\n\n```\n10 @Id\n11 @Column\n12 @GeneratedValue(strategy = GenerationType.IDENTITY)\n\
    13 private Integer id;\n14 \n15 @ManyToOne(fetch = FetchType.LAZY)\n16 @JoinColumn(name\
    \ = \"purchase_id\")\n17 private Order order;\n18 \n19 @ManyToOne(fetch = FetchType.LAZY)\n\
    20 @JoinColumn(name = \"ingredient_id\")\n21 private Ingredient ingredient;\n\
    22 \n23 @Column(name = \"units\")\n24 private Integer units;\n```\n\nFocusing\
    \ on the two foreign-key properties, notice that @JoinColumn is used to signify\
    \ that it is used in a SQL join and that the relationship is described as @ManyToOne\
    \ since there are many OrderItems for each order. The fetch = FetchType.Lazy Hibernate\
    \ (or more accurately, JPA provider) will not load the actual Order object until\
    \ it is explicitly asked for. Lazy's opposite is FetchType.Eager which would load\
    \ the Order as soon as the OrderItem is returned from the database.\n\nIt's not\
    \ required, but I chose to create a bi-directional relationship between an order\
    \ and its line items. Here's how Order is annotated.\n\n# Order.java\n\n```\n\
    14 @Id\n15 @Column\n16 @GeneratedValue(strategy = GenerationType.IDENTITY)\n17\
    \ private int id;\n18 \n19 @OneToMany(mappedBy = \"order\", cascade = CascadeType.ALL)\n\
    20 private List<OrderLine> orderItems;\n21 \n22 @Column(name = \"create_dttm\"\
    )\n23 private Timestamp created = Timestamp.valueOf(LocalDateTime.now());\n24\
    \ \n25 @Column(name = \"total_price\")\n26 private BigDecimal totalPrice;\n```\n\
    \nThe new annotation here is @OneToMany: there is one Order for many OrderItems.\
    \ The mappedBy attribute it should use the order value to get a setter, returning\
    \ OrderItems, and the cascade is used to describe the behavior of child objects\
    \ when an operation occurs on the parent. Using CascadeType.ALL updates, inserts,\
    \ and deletes on an Order will cascade down to OrderItems.\n\nAs you can imagine,\
    \ there are many annotations to fit the wide variety of relationships in databases.\
    \ You might consider the JPADoc for what is possible.\n\n# Tell Me More: JPA implementations\n\
    \nWhile Hibernate is far away the most popular implementation, it's not the only\
    \ one. The other options are EclipseLink and OpenJPA. All implementations include\
    \ their own annotations that provide advanced features beyond the JPA. So while\
    \ Hibernate is usually the default, you might choose another implementation if\
    \ you need access to a particular feature. When using JPA, Hibernate is usually\
    \ configured programmatically with a persistence file. Neither of these options\
    \ are proprietary, and therefore could be used with any JPA providers. For more\
    \ details, see \"Bootstrapping\" in the official documentation. If you use Spring\
    \ Boot, the configuration is mostly taken care of automatically with a few values\
    \ set in application.yml.\n\n# XML Mappings\n\nThe older method of mapping objects\
    \ for Hibernate was XML. You will have one ClassName.hbm.xml for each entity and\
    \ it will need to be on the classpath. Each class lists the properties (e.g. <property\
    \ ...>) and the relationships (e.g. <one-to-many ...>). Here's the mappings for\
    \ Order and OrderItem. If you compare them to the JPA-annotated classes, you should\
    \ notice similar terminology and structure, although some of the vocabulary does\
    \ not match.\n\n# Order.hbm.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    ?>\n<!DOCTYPE hibernate-mapping PUBLIC\n  \"//Hibernate/Hibernate DTD//EN\"\n\
    \  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\">\n\n<hibernate-mapping>\n\
    \  <class name=\"icecream.domain.Order\" table=\"purchase\">\n    <id name=\"\
    id\" type=\"int\" column=\"id\">\n      <generator class=\"identity\"/>\n    </id>\n\
    \    <property name=\"created\" column=\"created_dtt\" type=\"timestamp\"/>\n\
    \    <property name=\"totalPrice\" column=\"total_price\" type=\"big_decimal\"\
    />\n    <bag name=\"orderitems\"\n      table=\"purchase_line_item\"\n      cascade=\"\
    all\"\n      inverse=\"true\">\n      <key column=\"purchase_id\" not-null=\"\
    true\" />\n      <one-to-many class=\"icecream.domain.LineItem\"/>\n    </bag>\n\
    \  </class>\n</hibernate-mapping>\n```\n\n# OrderItem.hbm.xml\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping PUBLIC\n \
    \ \"//Hibernate/Hibernate DTD//EN\"\n  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n\n<hibernate-mapping>\n  <class name=\"icecream.domain.OrderLine\"\n    table=\"\
    purchase_line_item\">\n    <id name=\"id\" type=\"int\" column=\"id\">\n     \
    \ <generator class=\"identity\"/>\n    </id>\n    <many-to-one name=\"order\"\n\
    \      class=\"icecream.domain.Order\"\n      lazy=\"proxy\"\n      fetch=\"join\"\
    >\n      <column name=\"purchase_id\" not-null=\"true\" />\n    </many-to-one>\n\
    \    <many-to-one name=\"ingredient\"\n      class=\"icecream.domain.Ingredient\"\
    \n      lazy=\"proxy\"\n      fetch=\"join\">\n      <column name=\"ingredient_id\"\
    \ not-null=\"true\" />\n    </many-to-one>\n    <property name=\"units\" column=\"\
    units\" type=\"int\"/>\n  </class>\n</hibernate-mapping>\n```\n\nWhen using the\
    \ mappings, you have to register them with Hibernate configuration. In most instances,\
    \ Hibernate is configured programmatically with java, a hibernate.properties file,\
    \ or a hibernate.cfg.xml file. For details on hibernate configuration see \"Legacy\
    \ Bootstrapping\" in the official documentation\".\n\n# Writing Data\n\n# JPA\n\
    \nAs you can imagine, the OrderService for JPA is going to look quite different\
    \ from what we heavy lifting is an EntityManager. Similar to MyBatis, one way\
    \ to obtain an EntityManager via EntityManagerFactory. The EntityManager has three\
    \ methods that loosely map to \"insert\", \"update\", and \"delete\": persist,\
    \ merge, remove.⁵⁷\n\nHere's where the real power of ORMs is revealed: no SQL\
    \ is written, but using the annotations, the JPA provider allows to create entities\
    \ to save the Order and its child OrderLineItems! This means an object is usually\
    \ just one line of code:\n\nOrderService.java\n\n```java\n20 @Transactional\n\
    21 void void(Order order) {\n22     entityManager.persist(order);\n23 }\n```\n\
    \n# Native Hibernate\n\nIf you are not using JPA, the worker class is a Hibernate\
    \ SessionFactory which can be used to create Sessions. One Session is used per\
    \ unit of work\n\n⁵⁷http://docs.jboss.org/hibernate/orm/5.2/userguide/html/single/Hibernate_User_Guide.html#appendix-legacy-bootstrap\n\
    ⁵⁸ The persist and merge methods are also non-trivial and this StackOverflow answer\
    \ gives a good discussing the differences.\n"
  mdcn: "\n\n# Hibernate\n\n我们刚刚看到了 MyBatis 如何将 POJO 领域对象绑定到 SQL 语句，但手动编写相对基础的 SQL\
    \ 仍然存在开销。此外，对象之间的关系处理起来非常繁琐。对象关系映射（ORM）试图通过将 SQL 从开发者中抽象出来来解决这些问题。从理论上讲，只要关于对象足够的信息，完全可以通过程序化生成所有\
    \ SQL。\n\nHibernate 是 Java最早的 ORM 工具之一。直到几年后，持久化通过 Java Persistence API (JPA)\
    \ 标准化，它的地位才更加明确。JPA 本身并不提供实现——而是允许第三方工具利用通用的 API。而恰好 Hibernate 是最常用的第三方实现。尽管如此，仍然可以在不使用\
    \ JPA 的情况下使用 Hibernate。本章示例代码包含两个 Hibernate 项目：一个是较现代的、利用 JPA 注解的项目；另一个是使用原生类与数据库交互的老旧项目。为了方便起见，注解代码示例使用了\
    \ JPA 接口，而 XML 代码示例使用了 Hibernate 原生对象，但它们是可以混合使用的。你应该熟悉所有这些选项，因为它们仍然非常流行。\n\n\
    # 领域 POJO 调整\n\n在使用 ORM 时，领域对象与数据库越得越匹配，你需要做的工作就越少。虽然处理抽象类¹ 是可能的（例如，一个包含 Flavor\
    \ 和 Topping 类的原料表），但我不想用这些细节混淆你对 JPA 的理解。相反，让我们改变领域对象以匹配数据库表。\n\n> http://docs.oracle.com/java/6/tutorial/doc/beanm.html#bnubq\n\
    \n![](img/388ca427680b953f016e4c3ce24cad0b_108_0.png)\n\n冰淇淋领域对象\n\n# JPA 注解\n\
    \nJPA 提供了一组注解，用于标记领域类以描述它们如何映射到底层数据库。通常，类被标记为 @Entity 和 @Table(name=\"myTableName\"\
    )，而属性被标记为 @Column(name=\"myColumnName\")。对于 ID 和外键列等“特殊”列，会添加额外的注解。重要的是，外键不是以整数形式表示的，而是以对象本身表示。例如，OrderLineItem\
    \ 类没有 `purchase_id` 属性，而是有一个 `Order` 属性。以下是该类的完整注解属性。\n\n# OrderLine.java\n\n\
    ```\n10 @Id\n11 @Column\n12 @GeneratedValue(strategy = GenerationType.IDENTITY)\n\
    13 private Integer id;\n14 \n15 @ManyToOne(fetch = FetchType.LAZY)\n16 @JoinColumn(name\
    \ = \"purchase_id\")\n17 private Order order;\n18 \n19 @ManyToOne(fetch = FetchType.LAZY)\n\
    20 @JoinColumn(name = \"ingredient_id\")\n21 private Ingredient ingredient;\n\
    22 \n23 @Column(name = \"units\")\n24 private Integer units;\n```\n\n关注这两个外键属性，注意\
    \ @JoinColumn 用于表示它被用于 SQL 链接（join），并且关系被描述为 @ManyToOne，因为每个订单对应多个 OrderItems。`fetch\
    \ = FetchType.Lazy` 意味着 Hibernate（或更准确地说是 JPA 实现提供）在显式请求之前不会加载实际的 Order 对象。懒加载的反面是\
    \ `FetchType.Eager`，它会在 OrderItem 从数据库返回时立即加载 Order。\n\n虽然不是强制要求的，但我选择在订单及其行项目之间建立双向关系。以下是\
    \ Order 的注解方式。\n\n# Order.java\n\n```\n14 @Id\n15 @Column\n16 @GeneratedValue(strategy\
    \ = GenerationType.IDENTITY)\n17 private int id;\n18 \n19 @OneToMany(mappedBy\
    \ = \"order\", cascade = CascadeType.ALL)\n20 private List<OrderLine> orderItems;\n\
    21 \n22 @Column(name = \"create_dttm\")\n23 private Timestamp created = Timestamp.valueOf(LocalDateTime.now());\n\
    24 \n25 @Column(name = \"total_price\")\n26 private BigDecimal totalPrice;\n```\n\
    \n这里的新注解是 @OneToMany：一个 Order 对应多个 OrderItems。`mappedBy` 属性应该使用 order 值来获取 setter\
    \ 方法并返回 OrderItems，而 `cascade` 用于描述在父对象上发生操作时子对象的行为。使用 `CascadeType.ALL`，对 Order\
    \ 的更新、插入和删除将级联到 OrderItems。\n\n正如你可以想象的，有很多注解来适应数据库中各种样的关系。你可能会参考 JPADoc 来了解可能的用法。\n\
    \n# 更多信息：JPA 实现\n\n虽然 Hibernate 远非最流行的实现，但它并不是唯一的。其他选项是 EclipseLink 和 OpenJPA。所有实现都包含它们自己的注解，提供了\
    \ JPA 之外的高级功能。因此，虽然 Hibernate 通常是默认选择，但如果你需要访问特定功能，可能会选择其他实现。使用 JPA 时，Hibernate\
    \ 通常通过持久化文件进行程序化配置。这些选项都不是私有的，因此可以与任何 JPA 实现配合使用。更多细节，请参阅官方文档中的“启动 (Bootstrapping)”。如果你使用\
    \ Spring Boot，大部分配置通过在 application.yml 中设置几个值自动完成。\n\n# XML 映射\n\nHibernate 映射对象的较旧方法是\
    \ XML。每个实体将有一个 `ClassName.hbm.xml` 文件，并且它需要位于类路径下。每个类都列出了属性（例如 `<property ...>`）和关系（例如\
    \ `<one-to-many ...>`）。以下是 Order 和 OrderItem 的映射。如果你将它们与 JPA 注解类进行比较，你会发现它们的术语和结构是相似，尽管某些词汇并不匹配。\n\
    \n# Order.hbm.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE\
    \ hibernate-mapping PUBLIC\n  \"//Hibernate/Hibernate DTD//EN\"\n  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n\n<hibernate-mapping>\n  <class name=\"icecream.domain.Order\" table=\"purchase\"\
    >\n    <id name=\"id\" type=\"int\" column=\"id\">\n      <generator class=\"\
    identity\"/>\n    </id>\n    <property name=\"created\" column=\"created_dtt\"\
    \ type=\"timestamp\"/>\n    <property name=\"totalPrice\" column=\"total_price\"\
    \ type=\"big_decimal\"/>\n    <bag name=\"orderitems\"\n      table=\"purchase_line_item\"\
    \n      cascade=\"all\"\n      inverse=\"true\">\n      <key column=\"purchase_id\"\
    \ not-null=\"true\" />\n      <one-to-many class=\"icecream.domain.LineItem\"\
    />\n    </bag>\n  </class>\n</hibernate-mapping>\n```\n\n# OrderItem.hbm.xml\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!DOCTYPE hibernate-mapping\
    \ PUBLIC\n  \"//Hibernate/Hibernate DTD//EN\"\n  \"http://www.hibernate.org/dtd/hibernate-mapping-3.0.dtd\"\
    >\n\n<hibernate-mapping>\n  <class name=\"icecream.domain.OrderLine\"\n    table=\"\
    purchase_line_item\">\n    <id name=\"id\" type=\"int\" column=\"id\">\n     \
    \ <generator class=\"identity\"/>\n    </id>\n    <many-to-one name=\"order\"\n\
    \      class=\"icecream.domain.Order\"\n      lazy=\"proxy\"\n      fetch=\"join\"\
    >\n      <column name=\"purchase_id\" not-null=\"true\" />\n    </many-to-one>\n\
    \    <many-to-one name=\"ingredient\"\n      class=\"icecream.domain.Ingredient\"\
    \n      lazy=\"proxy\"\n      fetch=\"join\">\n      <column name=\"ingredient_id\"\
    \ not-null=\"true\" />\n    </many-to-one>\n    <property name=\"units\" column=\"\
    units\" type=\"int\"/>\n  </class>\n</hibernate-mapping>\n```\n\n当使用映射时，你必须在 Hibernate\
    \ 配置中注册它们。在大多数情况下，Hibernate 通过 java、hibernate.properties 文件或 hibernate.cfg.xml\
    \ 文件进行程序化配置。关于 hibernate 配置的细节，请参见官方文档中的“传统启动 (Legacy Bootstrapping)”。\n\n# 写入数据\n\
    \n# JPA\n\n正如你可以想象的，JPA 的 OrderService 看起来会有很大不同，其核心是 `EntityManager`。类似于 MyBatis，一种方法是通过\
    \ `EntityManagerFactory` 获取 `EntityManager`。`EntityManager` 有三个大致对应“插入”、“更新”和“删除”的方法：`persist`、`merge`\
    \ 和 `remove`。⁵⁷\n\n这就是 ORM 真正的威力所在：无需编写 SQL，但通过注解，JPA 实现允许创建实体来保存 Order 及其子项 OrderItems！这意味着一个对象通常只需要一行代码：\n\
    \nOrderService.java\n\n```java\n20 @Transactional\n21 void void(Order order) {\n\
    22     entityManager.persist(order);\n23 }\n```\n\n# 原生 Hibernate\n\n如果不使用 JPA，工作类是\
    \ Hibernate SessionFactory，它可以创建 Session。每个工作单元使用一个 Session。\n\n⁵⁷http://docs.jboss.org/hibernate/orm/5.2/userguide/html/single/Hibernate_User_Guide.html#appendix-legacy-bootstrap\n\
    ⁵⁸ `persist` 和 `merge` 方法也并非易事，这个 StackOverflow 答案对它们的差异进行了很好的讨论。\n\n"
