    \ 方式”的问题。每当构建偏离了 Maven 的预期时，实施变通方案可能会非常困难。许多项目都是“正常的……除了我们必须做的那件奇怪的事情”。而且里面的“奇怪事情”越多，就越难让\
    \ Maven 适应你的世界。虽然我不完全同意某位博客作者所说的——“Maven 构建是一个绝望的无限循环，将缓慢将你拖入最深、最黑暗的地狱深渊……”²，但我深有同受！\n\
    \n如果我们能结合 Ant 的灵活性和 Maven 的功能，那不是太好了吗？这正是 Gradle 正在尝试做的。\n\n# Gradle\n\n你会在 Gradle\
    \ 构建脚本中首先注意到的是它不是 XML！事实上，Gradle 使用的是由 Groovy 编写的领域特定语言（DSL），Groovy 是另一种运行在 JVM\
    \ 上的编程语言。\n\n# 深度解析：Groovy\n\n由于 JVM 规范是免费提供的，因此编写可以编译为 Java 字节码的其他编程语言。Groovy\
    \ 就是其中一种语言。尽管它有时被认为是一种脚本语言（很大程度上是因为你不需要类的开销就可以开始），但它也可以用于编写完整的应用程序。试一试吧³！\n\n\
    ```groovy\ndef name = 'World'\nprintln(\"Hello, $name!\")\n```\n\nDSL 定义了构建文件的核心部分以及称为“任务”（tasks）的特定构建步骤。它还是可扩展的，使得定义自己的任务变得非常简单。当然，Gradle\
    \ 拥有丰富的第三方插件库。让我们深入学习吧。\n\n# 趋势观察：Gradle\n\n尽管 Gradle 正在变得流行，但它仍然相对新。由于整个 Java\
    \ 生态系统移动较慢，如果你在开源项目中遇到它，你会很惊讶的。\n\n> 2Spillner, Kent. \"Java Build Tools: Ant\
    \ vs. Maven\". 14 November 2009, http://kent.spillner.org/blog/work/2009/11/14/java-build-tools.html.\
    \ Accessed 10 March 2017.\n3http://groovy-lang.org\n\n# 第3 章：构建工具\n\n# 构建文件\n\n\
    Gradle 文件相应地命名为 `build.gradle`，并从配置构建开始。对于我们的项目，我们利用了一个 fat jar 插件，因此将在构建脚本配置中添加\
    \ Shadow 插件。\n\n```gradle\nbuild.gradle\nbuildscript {\n    repositories {\n \
    \       jcenter()\n    }\n    dependencies {\n        classpath 'com.github.jelman.gradle.plugins:shadow:1.2.4'\n\
    \    }\n}\n```\n\n为了让 Gradle 下载插件，它必须在仓库查找，仓库是制品的索引。某些仓库是 Gradle 已知的，可以简单地引用 `mavenCentral()`\
    \ 或 `jcenter()`。在涉及仓库时，团队决定不重复轮子，而是依赖于现有的 Maven 和 Ivy 依赖生态系统。\n\n# 任务\n\n最后，在\
    \ Ant 的“目标”和 Maven 令人混乱的“阶段”之后，Gradle 为构建步骤提供了一个合理的名称：“任务”（task）。我们使用 Gradle 的\
    \ API 来访问某些任务。（Java 插件位于 Gradle 中，因此我们不需要声明）。\n\n```gradle\nbuild.gradle\napply\
    \ plugin: 'java'\n```\n\nJava 插件为你提供常用任务：\n- assemble: 构建项目。\n- build: 构建项目。\n\
    - clean: 删除构建目录。\n- javadoc: 生成 Javadoc 文档。\n- jar: 生成 包。\n- test: 运行单元测试。\n\n\
    你也可以在构建定义自己的任务。由于 DSL 基于 Groovy，可能性几乎是无限的。这是一个展示某些 Groovy 的简单示例，该任务将打印文件：\n\n\
    ```groovy\ntask printClasspath {\n    sourceSets.each { source ->\n        println(source)\n\
    \        def tree = source.compileClasspathAsFileTree()\n        tree.files.each\
    \ { println(f.name) }\n    }\n}\n```\n\n# 依赖管理\n\n我们已经看到构建脚本如何依赖插件，因此推导出代码依赖将非常简单。我们再次创建仓库部分和依赖部分。起初这似乎是重复，但有一个关键区别。buildscript\
    \ 之外的仓库和依赖用于运行构建本身；而仓库和依赖用于编译你的代码。\n\n```gradle\nbuild.gradle\nrepositories {\n\
    \    mavenCentral()\n}\ndependencies {\n    compile group: 'com.google.guava',\
    \ name: 'guava', version: '26.0-jre'\n}\n```\n\n这里是完整的脚本：\n\n```gradle\nbuild.gradle\n\
    buildscript {\n  repositories {\n    jcenter()\n  }\n  dependencies {\n    classpath\
    \ 'com.github.jengelman.gradle.plugins:shadow:1.2.4'\n  }\n}\n\napply plugin:\
    \ 'java'\napply plugin: 'com.github.johnrengelman.shadow'\n\ngroup = 'com.letstalkdata'\n\
    version = '0.0.1-SNAPSHOT'\nsourceCompatibility = 11\ntargetCompatibility = 11\n\
    \nrepositories {\n  mavenCentral()\n}\n\ndependencies {\n  compile group: 'com.google.guava',\
    \ name: 'guava', version: '26.0-jre'\n}\n\nshadowJar {\n  baseName = 'iscream'\n\
    \  manifest {\n    attributes 'Main-Class': 'com.letstalkdata.iscream.Application'\n\
    \  }\n}\n```\n\n"
