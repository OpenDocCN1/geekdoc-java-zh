    \ = \"purchase_id\")\n17 private Order order;\n18 \n19 @ManyToOne(fetch = FetchType.LAZY)\n\
    20 @JoinColumn(name = \"ingredient_id\")\n21 private Ingredient ingredient;\n\
    22 \n23 @Column(name = \"units\")\n24 private Integer units;\n```\n\nFocusing\
    \ on the two foreign-key properties, notice that @JoinColumn is used to signify\
    \ that it is used in a SQL join and that the relationship is described as @ManyToOne\
