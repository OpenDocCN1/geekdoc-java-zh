    \ JVM 定义，也可以设置自定义属性。\n\n# Spring Boot\n\nSpring 团队在确保他们的组件之间能够良好工作方面做得非常出色。然而，开发者往往擅长让事情变得复杂，遇到痛苦的\
    \ Context 配置 并不罕见。遵循 Spring 指南会有帮助，但要正确配置 Spring 应用程序仍然很繁琐。\n\n2014 年，Spring 发布了\
    \ Spring Boot，这是一个为了在 Spring 平台上快速开发应用程序而设计的工具。它采用约定优于配置，并使得配置变得简单。\n\nSpring\
