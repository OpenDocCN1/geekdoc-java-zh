    \ There are several types of bean scopes:\n\n- ApplicationScoped: The bean is\
    \ available for the entire duration of the application.\n- SessionScoped: The\
    \ bean is available for the duration of a user session.\n- RequestScoped: The\
    \ bean is available for the duration of a single HTTP request.\n- ViewScoped:\
    \ The bean is available as long as the user stays on the same view.\n\n> *http://docs.oracle.com/javaee/6/tutorial/index.html*\n"
  mdcn: "\n\n# 第6 章：Web 框架\n\nweb.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\n      xmlns:xsi=\"\
