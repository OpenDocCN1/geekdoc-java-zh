    ## 附录 A：Docker


    可以使用 `image:tag` 语法引用特定版本的镜像，例如 `azul/zulu-openjdk:10`。


    Dockerfile 中可以包含许多额外的命令²，例如用于包含资源的 `ADD`，用于设置环境变量的 `ENV` 等。在本例中，Dockerfile 用于创建一个
    Spring Boot Web 应用程序。


    ## Dockerfile


    ```

    FROM azul/zulu-openjdk:10

    ADD build/libs/iscream-web-0.0.1-SNAPSHOT.jar app.jar

    ENTRYPOINT [ "sh", "-c", "java -jar /app.jar" ]

    ```


    `ENTRYPOINT` 命令告诉 Docker 在容器启动后立即运行什么程序。这非常重要，否则容器将只会启动微型 Alpine Linux 而不运行任何其他内容。要实际创建镜像，我们可以运行
    `docker build --tag=iscream .`。tag 是可选的，如果不提供它，Docker 将给它分配一个随机名称。第一次构建镜像可能需要一分钟左右，因为所有基础镜像都需要从互联网下载。随后的构建将更快，因为
    Docker 会保存基础镜像。


    ## 部署 Docker 容器


    一旦构建了镜像，就可以从该镜像创建一个或多个容器。容器通常被认为是（相对）短寿命且是易弃的。如果它们需要持久化数据，则通过 Docker卷来实现。当需要部署新版本的代码或需要用不同参数重新配置应用程序时，容器会被丢弃。甚至可以创建高度易弃的容器，它们会在进程结束时由
    Docker 自动删除。这种模式对于任务完成后无需留的批处理或 ETL 任务非常有用。


    可以使用 `docker run -d -p 8080:8080 iscream` 创建一个简单的容器。这将在后台 (-d) 启动 iscream 镜像的实例，为其分配名称，并暴露内部端口
    8080 (-p)。在执行该命令后，你可以通过访问熟悉的 http://localhost:8080/orders/new 来验证程序。


    你可以使用 `docker ps` 查看容器的名称，然后运行 `docker stop container_name` 停止容器，并运行 `docker rm
    container_name` 删除它。


    当然，`run` 命令有许多参数³，但这里有几个示例可以帮助你快速上手：


    - `docker run -it -p 8080:8080 iscream`: 以“交互式”模式运行容器

    - `docker run -d --p 8080:8080 iscream`: 在容器停止时自动删除容器

    - `docker run -d --name iscream_dev -p 8080:8080 iscream`: 将容器实例命名为 iscream_dev


    > ⁴https://docs.docker.com/engine/reference/builder/

    ⁵https://docs.docker.com/engine/reference/run/


    ## 注意事项


    ### 内存


    如果你在 Docker 宿主机上运行多个容器（你应该这样做的！），对容器可以使用的内存量进行限制是一个好主意。否则，应用程序中的内存泄漏可能会影响其他容器。Docker
    允许你使用 `--memory` 标志限制容器使用的内存，但如果你使用的是 Java 9 或更早版本，在 JVM 级别限制内存也至关重要！（关于原因的更多细节，请参见
    Rafael Benvides 写的 **Java Inside Docker: What You Must Know to Not FAIL**）。这需要两个步骤。


    首先，修改你的 Dockerfile，将 `$JAVA_OPTS` 传递给 java 命令：


    ```

    ENTRYPOINT [ "sh", "-c", "java $JAVA_OPTS -jar /app.jar" ]

    ```


    其次，在创建容器时，限制容器内存并设置 `$JAVA_OPTS --usage`，如下：


    ```

    docker run -d -p 8080:8080 -m 1536m -e JAVA_OPTS=''-Xmx1024m'' iscream

    ```


    从 Java 10 开始，已经进行了更改，使 Java 可以检查容器层应用的限制。不再需要设置 JVM 内存限制。


    ```

    docker run -d -p 8080:8080 -m 1536m iscream

    ```


    ### JDK


    如果你还记得第一章的内容，你会记得 Java 实际上有多个 JDK。由于 Oracle 的许可问题，在 Docker 内部使用 Oracle JDK 可能是非法。替代方案是使用具有宽松许可的
    OpenJDK 等 JDK。这适用于大多数情况。然而，由于 tag 命名的差异，你可能会意外使用一个你并非想要的 JDK 版本。例如，`8-jdk-alpine`
    并没有指定特定的提交，可以是 Java 8 的任何版本。


    另一种替代方案是指定特定的 tag 名称，例如 `8ut31-jdk-alpine`（尽管这并没有指向特定的 JDK 提交）。或者你可以使用不同的 JDK，例如
    Zulu，它经过了充分测试并固定在特定的提交，如 `8u144-28.03.0`。


    就价值而言，我大多数时候都切换到了 Zulu。尽管我不认为版本不确定性令人担心，而且许多 Docker 容器仍然从 OpenJDK 构建。我信任 OpenJDK
    经过良好的测试。然而，我不处理那些容忍偶尔（且罕见！）JDK Bug 的任务关键型软件。你应该选择一个适合你情况的 JDK。


    > *https://dzone.com/articles/java-inside-docker-what-you-must-know-to-not-fail

    *http://blog.takips.com/running-java-on-docker-your-breaking-law/


