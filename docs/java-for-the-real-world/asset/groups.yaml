    # Chapter 5: Spring


    Perhaps no collection of tools is more well-known in the Java world than Spring.
    What started out as a tool to wire up application components more easily has grown
    into a variety of frameworks including frameworks for building web applications,
    accessing data, rapid application development, microservice configuration, mobile
    development, and others.


    At the center of all the Spring tools is the Spring Core. We''ll spend the bulk
    of this chapter learning the basics of Spring Core, and then explore a modern,
    opinionated Spring framework called Spring Boot. However, there''s much more to
    configure in code. In later chapters, we''ll discuss Spring JDBC and Spring MVC.


    # Spring Core


    # Dependency Injection


    The term "dependency injection" (DI) is a classic example of applying complex
    words to a simple concept. Spring''s documentation says:


    > [Dependency Injection] is a process whereby objects define their dependencies,
    that is, the other objects they work with, only through constructor arguments,
    arguments to a factory method, or properties that are set on the object instance
    after it is constructed or returned from a factory method.³¹


    Clear as mid? In any application you have objects that rely on other objects to
    function. For example, in our IScream application, we''ve seen that the Application
    requires a DailySpecialService. We can say that Application depends on DailySpecialService.
    So far we have been creating the service explicitly in code. Spring will automatically
    configure, or inject, the dependency.


    # But what is it, really?


    The Spring Core manages all the objects in your application that depend on other
    objects. Instead of creating and configuring your objects manually in code, Spring
    automatically does it for you at runtime.


    With all of this waving wand comes tradeoffs. Developers can go overboard in their
    reliance on Spring creating complex dependencies freely. Furthermore, since the
    dependencies are managed


    ³¹The IoC container. Spring Framework Reference, https://docs.spring.io/docs/spring/current/spring-framework-reference/htm-lbeans.html.
    Accessed 10 June 2017.'
