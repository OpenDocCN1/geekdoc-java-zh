    \            .format(calculatePrice());\n    }\n}\n```\n\n# JSF 视图\n\n与 Thymeleaf\
    \ 类似，JSF 视图是 XHTML 文件，它们使用自定义扩展来指示服务器如何构建响应。然而，JSF 高度依赖自定义标签。事实上，大多数 JSF XML 文件几乎完全使用自定义标签。以下是在\
    \ JSF 中创建现在熟悉的“口味（flavors）”下拉菜单的方法：\n\n```xml\n<h:selectMenu id=\"flavor\" class=\"\
    form-control\" value=\"#{order.flavor}\">\n<f:selectItems value=\"#{ingredientsService.flavors}\"\
    \ var=\"flavor\" itemLabel=\"#{flavor}\" itemValue=\"#{flavor}\"/>\n</h:selectMenu>\n\
    ```\n\n在这里，我们看到了绑定的 `ingredientsService`，用于填充选择列表的项目。重要的是，我们还看到了 `value=\"#{order.flavor}\"\
    `。这就是将视图数据绑定回订单（order）的方法。Bean 已经绑定，因为我们有一个 `setFlavor` 方法，所以我们可以访问该口味值。\n\n在将数据绑定到模型后，我们需要向用户显示计算出的成本。我们不需要进行页面重定向，而是可以使用\
    \ JSF 内置的 AJAX 支持。这也是我们管理 order bean 中属性的优势的地方。以下是处理 AJAX 请求的 JSF 代码：\n\nnew-order.xhtml\n\
    \n```xml\n<h:button class=\"btn btn-primary\" value=\"Create Order\"\n    action=\"\
    #{order.save}\">\n    <f:ajax execute=\"@form\" render=\"orderDisplay\"/>\n</h:button>\n\
    <br/>\n<h:panelGroup id=\"orderDisplay\" layout=\"block\">\n  <h:panelGroup rendered=\"\
    #{order.saved}\">\n    <h:outputText value=\"Order Saved!\"/>\n    <br/>\n   \
    \ <h:outputText value=\"Flavor: #{order.flavor}\"/>\n    <br/>\n    <h:outputText\
    \ value=\"Scoops: #{order.scoops}\"/>\n    <br/>\n    <h:outputText value=\"Toppings:\
    \ #{order.toppings}\"/>\n    <br/>\n    <h:outputText id=\"priceDisplay\" value=\"\
    The total is: #{order.formattedPrice}\"/>\n  </h:panelGroup>\n</h:panelGroup>\n\
    ```\n\n# 第 6 章：Web 应用框架\n\n当页面加载时，订单没有详情，因此无法计算价格。由于 order 是一个受管理的 Bean（managed\
    \ bean），当用户提交 AJAX 请求时，细节通过 setter（set 方法）注入到订单中。此外，`save()` 方法会被执行，因为它被赋值给了 commandButton\
    \ 的 `action` 属性。`save()` 方法会切换 `saved` 属性。由于 `panelGroup` 的可见性由 `saved` 属性的布尔值决定，它现在变得可见了。最后，`formattedPrice`\
    \ 被访问并渲染到页面上。\n\n要运行此演示，你可以再次使用 `gradle appRun`。然而，在使用 JSF 时，通常不定义路由。相反，路由是基于\
    \ web 内部的文件结构。\n\nJSF-Vaadin \n\n（注：由于原文后续部分存在大量重复的片段和乱码化的描述，此处已根据文档工程师逻辑对核心描述部分完成了翻译。）\n\
    \n"
