    The use of Spring’s@Transactional here. If Spring creates the SqlSession it can
    be used in transactions automatically. If you are not using Spring, you can turn
    off auto-commit and use SqlSession.commit() to perform operations inside of a
    transaction.


    # Dynamic SQL


    Another great feature of MyBatis is its support for dynamic SQL. A common business
    need is to select one or more items from a list and retrieve data about those
    items. In order to hit the SQL database once, you need to write awhere x in ...
    query. I have seen lots of bad code where developer tried to implement this manually
    using string concatenation. Usually the code opens up SQL injection vulnerabilities,
    doesn''t properly handle trailing commas, doesn''t handle strings. My MyBatis
    makes this easy:


    ```

    <select id="getOrdersById" resultType="com.letstalkdata.iscream.domain.Order">

    select * from purchase

    where id

    <foreach item="id" index="index" collection="orderIds"

    open="(\ separator="

    ```


    Another treacherous feature is to make a query with optional search parameters.
    Again, MyBatis makes this easy:


    ```

    <select id="findingIngredientsSearch"

    resultType="com.letstalkdata.iscream.domain.Ingredient">

    select * from ingredient

    where

    <if test="name != null">

    ingredient = #{name}

    </if>

    <if test="type != null">

    and ingredient_type = #{type}

    </if>

    </where>

    </select>

    ```


    You can see the full list of MyBatis dynamic SQL features on the documentation
