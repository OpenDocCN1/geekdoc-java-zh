  mdcn: "\n\n# SLF4J\n\n在开发 Java 库时，你会遇到一个问题：如何以既提供信息又不具侵入性的方式记录日志。直接写入 STDOUT 会非常讨厌，但选择一个日志提供者会迫使库的消费者去配置该提供者。解决方案是使用日志门面（logging\
    \ facade）。\n\n## 但它到底是什么？\n\n如果配置正确，SLF4J 是所有日志的前端。库和你的应用程序代码通过 SLF4J API 向 SLF4J\
    \ 发送日志。然后，SLF4J 在内部将日志消息发送到你选择的日志提供者：Log4j、JUL 等。\n\n如果你接受使用日志门面，你的学习曲线可能会稍微陡峭，但结果是你的日志工作将变得简单得多。幸运的是，SLF4J\
    \ API 用起来非常舒服。\n\n要开始使用 SLF4J，你需要包含一个“绑定器”（binder），它负责完成在 SLF4J 和日志提供者之间进行翻译的实际工作。在示例代码中，我将使用\
    \ Log4j，这意味着我包含了 `log4j-slf4j-impl` 绑定器。如果你在关注的话，这意味着我们现在仅仅为了记录日志就有四个依赖项！SLF4J\
    \ API `slf4j-api` 与绑定器 `log4j-slf4j-impl` 通信，由后者将日志消息发送到 Log4j `log4j-core`，而后者依赖于用于配置的\
    \ Jackson `jackson-dataformat-yaml`。\n\n如果你读过关于 Logback 的章节，你就知道我们使用 SLF4J `LoggerFactory`\
    \ 来创建记录器实例。\n\n```java\nprivate static final Logger log = LoggerFactory.getLogger(OrderService.class);\n\
    ```\n\nSLF4J 使用了 Log4j 可用的六个级别中的五个：trace、debug、info、warn 和 error。像 Log4j 一样，所有级别都有对应的方法，并且它们被重写为可以传递参数和/或\
    \ Throwable 对象。\n\n# 第 9 章：日志\n\n# OrderService.java\n\n```java\n@Transactional\n\
    public void save(Order order) {\n    log.debug(\"Trying to save order.\");\n \
    \   entityManager.persist(order);\n}\n```\n\n# OrderMaker.java\n\n# Java Commons\
    \ Logging (JCL)\n\n作为 SLF4J 的替代方案，Apache Commons Logging JCL 是另一个让日志记录更简单的门面框架。它的配置方式与\
    \ SLF4J 类似，你必须在类路径上包含连接门面和提供者的链接，被称为“绑定器”（binder），而 JCL 将其称为“桥接”（bridge）。同样，我们最终需要四个依赖：JCL\
    \ API `commons-logging` 与桥接 `log4j-jcl` 通信，由后者将消息发送到 Log4j `log4j-core`，而后者依赖于用于配置的\
    \ Jackson-dataformat-yaml`。\n\n我们可以从 `org.apache.commons.logging.LogFactory` 创建\
    \ `org.apache.commons.logging.Log`。\n\n# OrderService.java\n\n```java\nprivate\
    \ static final Log log = LogFactory.getLog(OrderService.class);\n```\n\nLog4j\
    \ 的六个日志级别在 JCL 中均可用（包括 SLF4J 舍弃的 \"fatal\"）。然而，日志方法稍微严格一些。它不支持参数，因此你必须先准备好日志消息。\n\
    \n# OrderService.java\n\n```java\n@Transactional\npublic void save(Order order)\
