    \ MyBatis 是一个例外。XML 实现提供了更多的灵活性和选项。此外，在 mapper 文件中轻松读取 SQL 语句非常有帮助，而且通常可以将其复制到\
    \ SQL 编辑器中直接在数据库上执行查询。\n\n非常方便的一点是，尽管 Mappers 只是接口，你也不需要手动实现它们！MyBatis 会为你创建默认实现类。当然，如果你需要提供自定义行为，也可以手动实现它们。\n\
    \n## Java 的“怪癖”：过度分层的数据库对象\n\n在某些应用程序中，区分层（service layer）和数据访问层（data access layer）是有意义的。例如，你有一个只知道\
