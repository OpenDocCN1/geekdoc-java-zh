    ## Introduction


    As you have probably noticed from the size of this book, it is not a complete
    manual on any of the tools that I use. It''s goal to give you a brief overview
    of the tool and the most common ways it is used. If you want to learn more, I
    include a list of resources at the end of each chapter.


    So are you moving into Java?


    I find that explanations only so far, so this book places a heavy emphasis on
    code. Relevant code is included in the text, but for brevity, some boilerplate
    is omitted. You can always find working projects in the public repository for
    this book.


    ## But is it, really?


    Framework developers love to use fancy words to describe their tools. For example,
    when you read "Apache Maven is a software management and comprehension tool,"
    you still don''t really know what it is. Look for these besides to quickly learn
    what a tool actually does.


    ## Java Wart


    Java is a relatively old language and is known for being particularly backwards
    compatible. As such, there are many traditions that feel outdated and large swaths
    of the standard library that have been deprecated. I refer to these unfortunate
    blemishes as "warts".

    '
