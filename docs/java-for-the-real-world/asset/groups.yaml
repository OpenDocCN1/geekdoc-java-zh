    Chapter 5: Spring


    # Properties


    It''s often a good idea externalize some values of your application outside of
    the code. This can make configuration and deployment much easier, especially if
    you need to maintain multiple instances of an application that must be configured
    differently.


    Let''s imagine for our application that we want to run in a User Acceptance Testing
    (UAT) environment that is connected to a special web service, while at the same
    time maintain the production application that points to the production web service.
    That means we can no longer hardcode the URL in the DailySpecialService.


    We create the following files over the file system:


    ```

    application.properties

    specials.url = http://www.mocky.io/v2/590401621000003d034f66dc

    ```


    ```

    application.prod.properties

    specials.url = http://www.example.com/some-prod-url

    ```


    # Tell Me More: .properties files


    > Plain text files in .properties are commonly used to configure Java applications
    or frameworks that require only minimal setup. They contain simple key-value pairs
    and most parsers will intelligently recognize strings, numbers, and booleans.
    By convention, dots are used to separate words. For example, a file may contain
    app.directory.output, app.db.username, app.db.password, etc.


    Now we need to tell Spring how to access those files. We can do this with the
    @PropertySource annotation on the Application (or a PropertyPlaceholderConfigurer
    in the XML file, if you use XML).


    ```

    Application.java

    ```


    ```

    @Component

    @PropertySource("${propPath}/application.${env}.properties")

    public class Application {

    ```


    Remember that we need our application to work in multiple environments. To keep
    us from constantly recompiling the code, we can make the application dynamically
    access its properties. Spring has an expression language for string interpolation.
    This lets us make sections of the file path dynamic. Spring will look for Java
    System properties or environment variables for propPath and env and replace ${propPath}
    and ${env} in the file path. Next, @PropertySource will read the file and load
    it into the Spring context, making the properties available to the application.'
  - "[PAGE 55]\n\n# Chapter 5: Spring\n\nThis is extremely powerful—now you have the\
    \ ability to configure an application on the fly without recompilation!\n\nTo\
    \ make use of the application properties, you can use Spring’s @Value annotation,\
    \ or reference them directly in the property of a bean in an XML file. Here's\
    \ how to access the URL in DailySpecialService:\n\nDailySpecial.java\n\n```\n\
    public DailySpecialService(@Value(\"${specials.url}\") String specialsUrl) {\n\
    \    this.specialsUrl = specialsUrl;\n}\n```\n\nAgain, use the Spring expression\
    \ to refer to the specific application property we want to use. Just as objects\
    \ can be injected via field, constructor, or setter method, so properties. The\
    \ same guidelines apply, so it's generally best to put your @Value annotations\
    \ in the constructor.\n\nAfter setting the propPath env variables, you can run\
    \ the application. For testing, it it easiest to configure my IDE to pass in the\
    \ Java System (or \"VM\") properties (e.g. -Denv=uat).\n\n> Tell Me: System Properties\n\
    When starting the JVM, it is possible to include certain variables that remain\
    \ for the entire duration the JVM is running. This is done with the syntax -key=value\
    \ where key and value are the actual property name and value. These are known\
    \ as \"System Properties\" or \"System Variables\". Properties are defined by\
    \ the JVM specification, custom properties can be set too.\n\n# Spring Boot\n\n\
    The Spring group has done a wonderful job making sure that their components play\
    \ nicely together. However, developers have a knack of making things more difficult\
    \ and it's not uncommon to come across torturedContext.xml files. Following the\
    \ Spring guidance helps, but it can still be laborious to correctly configure\
    \ a Spring application, even with annotations.\n\nIn 2014 the Spring released\
    \ Spring Boot which is an opinionated tool designed for rapid application development\
    \ with the Spring platform. It favors convention over configuration and makes\
    \ it easy to skip the rigarmole of creating a new application.\n\nSpring Boot\
    \ applications are built from one or more \"starters\" which are included in a\
    \ Maven or Gradle dependency. For example we application that communicates with\
    \ an LDAP server would use spring-boot-starter-web and spring-boot-starter-data-ldap.\
    \ A complete list of starters can be found on the Spring Boot GitHub repository.\n\
    \n> https://github.com/spring-projects/spring-boot/tree/master/spring-boot-starters"
