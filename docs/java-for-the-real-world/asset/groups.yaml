  - "[PAGE 41]\n\n# EasyMock\n\nEasyMock has a somewhat confusing terminology of \"\
    record, replay, verify\", so I find it easier\nthink of it as \"set up, enable,\
    \ verify\". Here is a test that uses EasyMock:\n\nMenuCreatorTestEasyMock.java\n\
    \n```\n@Test\npublic void whenAMenuIsCreated_ThenDailyServiceIsCalled() {\n  \
    \  // Step 1: Create the mock object\n    var mockService = EasyMock.createMock(DailySpecialService.class);\n\
    \    // Step 2: Set the expectations\n    var specials = new ArrayList<String>();\n\
    \    EasyMock.expect(mockService.getSpecials()).thenReturn(specials).once();\n\
    \    EasyMock.replay(mockService);\n    // Step 3: Inject the mock\n    var menuCreator\
    \ = new MenuCreator(mockService);\n    // Step 4: Invoke the test object\n   \
    \ menuCreator.getTodaysMenu();\n    // Step 5: Verify\n    EasyMock.verify(mockService);\n\
    }\n```\n\nReferring back to the general steps of mocking, the EasyMock.createMock()\
    \ method is step one and\nEasyMock.expect() is step two. Our expectations are\
    \ that the service is called only once, and that\nwhen it is called it returns\
    \ the specials (in this case, just an empty list). The EasyMock.replay()\nmethod\
    \ is next and it allows the mock object to be used. Steps three and four have\
    \ nothing to\nto EasyMock and would be the same regardless of what framework we\
    \ use. Finally,\nEasyMock.verify() asserts that the mock behaved as expected.\
    \ When you run the test it should pass\nwithout any connection to the internet!\n\
    \nEasyMock has three different types of mocks: default, nice, and strict. The\
    \ mock we used a\ndefault, but there are times when you need a different type\
    \ of here. Here's a comparison:\n\n| Mock Type | Unexpected method call | Method\
    \ call order | API method |\n|---|---|---|--|\n| Default | Disallowed | Unforced\
    \ | mock |\n| Nice | Allowed | Unforced | niceMock |\n| Strict | Disallowed |\
    \ Enforced | strictMock |\n\nNice mocks will also return default values for all\
    \ non-mocked methods, i.e. 0, null, or false."
