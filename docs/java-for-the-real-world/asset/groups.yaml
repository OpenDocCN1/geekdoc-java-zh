    # Chapter 8: Working with Databases


    Knowing how to access and modify data stored in databases is critical for any
    Java developer. And while there is a trend towards services, most applications
    in production today still talk directly to the database (and of course those services
    have to do it eventually).


    As you expect, Java has a myriad of options when it comes to data access. However,
    the choice comes down to whether or not you want to write SQL. If your team is
    comfortable with SQL, complex data, or requires low-level SQL access, you are
    likely to see a lot of hand-coded SQL (hopefully) wrapped by a data framework.
    On the other hand, if your team has little SQL knowledge or if the data is reasonably
    simple, an ORM solution with maybe only a few snippets of SQL for particularly
    gnarly problems. Obviously both approaches have their pros and cons, and you should
    be familiar with both flavors of data access.


    # Java Database Connectivity (JDBC)


    The Java Database Connectivity (or JDBC) API is the part of the Java standard
    library that (naturally) deals with database access. While it''s obviously an
    option to use pure JDBC, in almost all cases you should use a data framework that
    abstracts away the lower-level details. However, there are a few objects you should
    be familiar with in the java.sql package:


    +   - DriverManager: Utility class that has knowledge of the available database
    drivers.

    - Connection: Represents a connection to a database and has information such as
    URL, username, password, etc. Connections can be created from the DriverManager.

    - PreparedStatement and CallableStatement: These are used to send actual SQL to
    the database server. Statements are created from Connections.

    - ResultSet: How data is returned. A ResultSet is iterable and each object is
    a row. Data can be accessed by getFoo(index) or getFoo(name) where Foo is the
    datatype, e.g. String, Blob, Int, etc and index is the l-indexed column number
    or name is the column name. ResultSets returned from Statements.

    - Date, Time and Timestamp: The SQL representations of time data.


    Without going into too much detail, here is an example of how we select all of
    the rows from a table and print out the information to the console using raw JDBC.'
