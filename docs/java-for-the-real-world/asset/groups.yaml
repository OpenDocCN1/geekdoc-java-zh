  - '[PAGE 14]


    # Chapter 3: Build Tools


    10


    ```

    $ javac -cp ::.lib/* src/main/java/com/letstalkdata/iscream/*.java

    ```


    First we have to tell the Java compiler to look to find dependencies. Java will
    look on what is called the classpath which can be set via environment variable,
    or more, via runtime parameter -cp. (Oh, and if you are using Windows, use ; to
    separate the classpath locations.) Now we will need to compile all of the files
    to accurately. The * wildcard saves some time, but we still have to specify two
    directories. Imagine a real application with dozens of directories.


    Unfortunately, when we run that command it creates a bunch of messy .class files
    right next to our source code. To keep our sanity, we probably want to do something
    like this:


    ```

    $ javac -cp ":.lib/* src/main/java/com/letstalkdata/iscream/*.java

    src/main/java/com/letstalkdata/iscream/service/*.java -d /out

    ```


    Using -d we store our compiled code somewhere else. And you''d better hope the
    out folder exists, otherwise javac won''t run.


    If we want to make our code easily runnable, we would want to create a jar. I''ll
    spare you the details, but in short extract from the Guava library, create a MANIFEST.MF
    file that specifies all of the code you want with the classpath at runtime, and
    invoke the jar command to include all of the Guava classes and your classes in
    the out directory.


    And that leads us to why build tools were created.


    # Ant


    The program has been used for over forty years to turn source code into applications.
    As such, it was the natural choice in Java''s early years. Unfortunately, a lot
    of the assumptions and conventions with C programs don''t translate well to the
    Java ecosystem². To make (mar, har) building the Java Tomcat application easier,
    James Duncan Vision wrote Ant. Soon, other open source projects started using
    Ant, and it quickly spread throughout the community¹.


    # But is it, really?


    Ant is a tool to manage the Java build process. It is very extensible but is commonly
    used to compile code, run tests, create build artifacts, deploy files, etc.


    # Legacy Watch: Ant


    Despite early adoption, Ant has now mostly been phased out in favor of newer build
    tools (notably Maven and Gradle).


    ²For some specifics, check out this discussion at Stack Overflow.

    ¹Frequently Asked Questions. The Apache Project, 6 February 2017, https://ant.apache.org/faq.html#history.
    Accessed 25 March 2017.'
  - "[PAGE 15]\n\n# Build files\n\nAnt build files are written in XML and are called\
    \ build.xml by convention. I know even saying \"XML\" makes some people shudder,\
    \ in small doses it isn't too painful. I promise. Ant calls the different phases\
    \ of the build process \"targets\". Targets are defined in the build file can\
    \ then be invoked using the ant TARGET command where TARGET is the name of the\
    \ target.\n\nHere's some common targets:\n\nbuild.xml\n\n```\n<target name=\"\
    clean\">\n  <delete dir=\"build\"/>\n</target>\n```\n\nThe clean target is used\
    \ to \"start from scratch\" and remove all build artifacts.\n\nbuild.xml\n\n```\n\
    <target name=\"compile\">\n  <mkdir srcdir=\"src/main/java\">\\n  <javac srcdir=\"\
    src/main/java\" destdir=\"build/classes\" classpathref=\"classpath\"/>\n</target>\n\
    ```\n\nThe compile target, unsurprisingly, compiles the Java source into class\
    \ files. Notice that we specify the root source directory as src/main/java.\n\n\
    build.xml\n\n```\n<target name=\"jar\">\n  <mkdir dir=\"build/jar\"/>\n  <jar\
    \ destfile=\"build/jar/IScream.jar\" basedir=\"build/classes\"/>\n</target>\n\
    ```\n\nThe jar target builds a .jar file of our application."
