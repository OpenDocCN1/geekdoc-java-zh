  mdcn: "\n\n## 第 5 章：Spring\n\n在代码之外，它有时会使应用程序变得更难理解。最后，请注意，依赖注入错误在运行之前不会出现。在没有编译器帮助的情况下，你可能会发现自己苦于确定为什么某个特定组件没有被正确注入。\n\
