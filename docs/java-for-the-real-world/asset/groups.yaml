    \ 于2017年3月15日访问。\n\n# Maven 阶段 (Phases)\n\n你想要通过构建脚本完成的最常见任务都包含在 Maven 中。这些任务被称为“阶段”，可以通过运行\
    \ `mvn PHASE`（其中 PHASE 是阶段名称）来执行。这些是你最可能用到的阶段：\n\n- **compile**: 编译你的源代码\n- **test**:\
