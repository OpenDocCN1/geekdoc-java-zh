  - '[PAGE 59]


    # # Chapter 6: Web Application Frameworks


    Perhaps the most common use of Java in enterprise environments is web development.
    The API that made web development in Java viable was the "Java 2 Platform, Enterprise
    Edition" (or J2EE), first released in 1999. Since then dozens of web frameworks
    have risen and fallen. Even covering all the frameworks that are active today
    would be a large undertaking I am going to focus on just some of the most popular
    frameworks.


    +   - **Spring MVC**: The Spring MVC framework is by far the most dominant framework.
    It builds on the Spring Core that we have already seen and provides functionality
    for building controllers that interact with your business models and HTML views.

    - **Spring Boot**: We saw how Spring Boot could be used for a console application,
    but it can also be used as a wrapper for Spring MVC to make web development even
    easier.

    - **Java Server Faces (JSF)**: JSF is a framework based on reusable UI components
    that can be easily linked to data and event handlers. It abstracts away most of
    the HTML, CSS, and JavaScript integrates integrates with AJAX.

    - **Vaadin**: Vaadin goes one step further than JSF and *completely* abstracts
    away all client-side code and the request-response cycle of a web application.


    # ## Legacy Watch: Outdated Frameworks


    A few years ago, I found myself working on a web application built on a framework
    that reached its official end-of-life in 2008. It was thankfully an internal application
    which mitigated some of the huge security issues. But even finding decent documentation
    was a challenge. Sadly, this isn''t uncommon in enterprise Java environments.
    Along the trail of Java history there are many gravestones for dead web frameworks.


    If you find yourself with a legacy framework, there are a few techniques that
    can help you.


    +   - **Try to find patterns**. When adding a new feature, try to find a similar
    page or feature that already exists in the application and mimic it.

    - **Cruise forums**. A lot of web forums from the early 2000s are still accessible,
    sharpen your Google skills and see what you can find. Try "More from this site"
    often!

    - **Ask for help**. Check with the veterans on your team. Chances are one of them
    had to use the framework in the past and they might be able to help you work through
    problems.'
  - '[PAGE 60]


    # Java Enterprise Edition Web API


    When using Java web frameworks, you usually won''t need to interact with the lower-level
    API of Java EE, but there are a few concepts you should be familiar with.


    # Request and response


    A request comes into the frameworks as an HttpServletRequest which provides access
    to the session, cookies, parameters, form data, etc. The response is sent back
    to the client as an HttpServletResponse which may be modified to indicate a status
    code, response data, headers.


    Sometimes you need to work with these objects directly. If so, a controller method
    might accept an HttpServletRequest as a parameter and return an HttpServletResponse.
    However, most of the framework will do it for you.


    # JavaServer Pages


    JavaServer Pages (JSP) is a technology that allows for dynamic generation of HTML.
    A .jsp file looks similar to an HTML file with some extension tags and syntax.
    These extensions allow access to model data and perform simple logic, such as
    conditionals and looping, to generate dynamic content. They are evaluated server-side
    and translated into the HTML that is sent to the client. Many frameworks use JSP,
    although we will also see alternative methods of creating web application views.


    # Servlet Containers


    Most Java web applications are deployed using a "servlet container." It is the
    servlet container''s job to handle the traffic between the web server and the
    Java application. We will learn more about these containers in the next chapter,
    but for now it''s only important to know that an application has to register itself
    with the container. This is commonly done with a web.xml file, although some frameworks
    allow it to be done in pure Java.


    Most frameworks work with the following folders:


    +   * src/main/java: Your application code.

    * src/main/resources: Text files, properties, etc. that are included on the classpath
    to aid your application code.

    * src/main/webapp/resources: Public resources such as CSS, JavaScript, images,
    etc.

    * src/main/webapp/WEB-INF: Private resources that the servlet container has access
    to.'
