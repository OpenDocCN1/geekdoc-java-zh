    # # Chapter 4: Testing


    Few things are a better predictor of successful production code than good tests.
    Frankly, Java has a rich set of tools and libraries for testing. By far, the most
    used library is JUnit. It can be used as a stand-alone library or in combination
    with other libraries that provide additional functionality. All the modern IDEs
    can run JUnit without much fuss, and both Maven and Gradle support the test command
    which runs all of the detected JUnit tests (Ant has a junit target). An alternative
    to JUnit is TestNG which has historically provided functionality missing from
    JUnit. It too has wide support, but in some cases requires additional plugins.


    # ## Legacy Watch: No tests!


    Whether it''s due to lack of knowledge, poor management, or just developer hubs,
    seems there''s no shortage of code without automated tests. In particular if you
    are working with a legacy Java application, you might find yourself lost in spaghetti
    code. I''ve learned that if you can isolate some of the code and create a few
    broad tests it at least help you find your bearings. For more details, take a
    look at Michael Feather''s discussion of test harnesses in Working Effectively
    with Legacy Code (Prentice Hall, 2004).


