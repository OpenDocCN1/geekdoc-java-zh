    \n# View（视图）\n\n我们的应用程序将有两个视图：一个让员工输入订单数据，另一个用于返回价格。Spring MVC 可以使用多种技术，但我们目前将使用\
    \ JSP。\n\n如前提到的，.jsp 文件看起来与 HTML 文件相似，并可以使用 HTML 中可用的所有标签。我们可以通过在文件顶部添加 `taglib`\
    \ 来使用其他标签。大多数 JSP 文件至少会使用标准的 JSP 标签库。此外，JSP 表达式语言（Expression Language）允许我们注入动态内容。其语法为\
    \ `${expression}`，其中 `expression` 可以包含变量、字面量、操作符，甚至 Java 方法调用。\n\n以下是我们如何向视图中动态注入口味和配料的：\n\
    \n```html\n<select name=\"flavor\">\n<option value=\"\">\n<c:forEach items=\"\
    ${flavors}\" var=\"flavor\">\n<option value=\"${flavor}\">${flavor.toString()}</option>\n\
    </c:forEach>\n</select>\n```\n\n我们很快就会看到口味实际上是如何传递的，假设它们确实传递了，这里是发送给客户端的渲染后的 HTML：\n\
    \n> https://docs.oracle.com/javaee/7/tutorial/jsf-el.htm\n\n```html\n<select name=\"\
    flavor\">\n  <option value=\"\"> selected</option>\n  <option value=\"VANILLA\"\
    >Vanilla</option>\n  <option value=\"CHOCOLATE\">Chocolate</option>\n  <option\
    \ value=\"STRAWBERRY\">Strawberry</option>\n</select>\n```\n\n我们还可以以类似的方式包含配料和辣椒，你可以在本章的示例代码中看到这一点。\n\
    \n# Controller（控制器）\n\nSpring MVC 控制器既强大又多功能，能够轻松适应任何需求。同时，解决同一个问题通常有不同的方法，这在初学该框架时可能会令人困惑。\n\
    \nController 类使用 `@Controller` 注解，有时带有带有 `@RequestMapping` 注解来定义控制器的基础路由。例如，`EmployeeController`\
    \ 将具有一个基础路由 (`/employee`)。\n\n路由通过在方法上添加 `@RequestMapping` 注解来定义，包含实际路由（例如 `/new`）和\
    \ HTTP 方法（例如 `POST`）。除此之外，方法非常灵活。有 20 多种参数对象类型和 15 多种有效的返回类型！请记住，定义应用程序中“新订单”页面路由的方法只有一种。\n\
    \nController\n\n```java\n20 @RequestMapping(value = \"/new\", method = RequestMethod.GET)\n\
    21 public String orderForm(Model model) {\n22   model.addAttribute(\"flavors\"\
    ,\n23   EnumSet.allOf(Flavor.class));\n24   model.addAttribute(\"toppings\",\n\
    25   EnumSet.allOf(Topping.class));\n26   return \"new-order\";\n27 }\n```\n\n\
    传递一个 model 是为了让我们我们可以修改（或“丰富”）它，以包含口味列表和配料列表。例如，`flavors` 允许数据通过 `${flavors}`\
    \ 表达式在视图中显示。最后，返回类型是一个 String，用于标识应该使用的视图。\n\n为了处理订单，我们需要允许 POST 请求发送到同一个路由。我们可以通过在控制器中创建另一个方法来实现。\n\
    \n> *https://docs.spring.io/spring/current/spring-framework-reference/html/mvc.html#mvc-ann-arguments\n\
    > *https://docs.spring.io/spring/docs/current/spring-framework-reference/html/mvc.html#mvc-ann-return-types\n\
    \n# RestController\n\n```java\n@RequestMapping(value = \"new\", method = RequestMethod.POST)\n\
    public String createOrder(@ModelAttribute Order order, Model model) {\n    var\
    \ priceNumber = order.getPrice();\n    var price = NumberFormat.getCurrencyInstance(Locale.US)\n\
    \        .format(priceNumber);\n    model.addAttribute(\"price\", price);\n  \
    \  return \"order-success\";\n}\n```\n\n似乎通过魔法一般，通过使用 `@ModelAttribute` 注解，请求被自动转换为\
    \ `Order` 对象。Spring MVC 将使用 POST 请求中的表单数据来调用 `Order` 类中匹配的 setter 方法。（这是另一个框架期望\
    \ getter 和 setter 的示例！）再次，我们包含一个 Model 是为了用计算出的价格丰富它，并返回一个 String 来标识用于响应的视图。\n\
    \n这些示例仅触及 Spring MVC 控制器可能性的冰角。在你的应用程序中，你可能会发现更多变体以适应更复杂的请求-响应周期。这起初可能会让人应接 overwhelming，所以请轻松对待！\n\
    \n# Configuration（配置）\n\n作为 Spring 工具，Spring MVC 可以使用 XML 文件或注解进行配置。像这样的极简应用程序只需要极少的配置。以下是如何使用这两种方法配置设置。\n\
