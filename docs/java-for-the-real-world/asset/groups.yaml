    \ Java 8+，但你实际上可能在使用 Java 7 甚至 Java 6。\n\n在开始任何开发之前，了解你的应用程序运行在哪个版本的 JVM 下是非常关重要的。版本将决定你可以利用哪些语言特性。然而，无论在生产环境中使用哪种版本，你通常可以在你的开发机上安装最新版本。这是因为\
    \ Java 具有极强的向后兼容性\n\n¹¹https://docs.oracle.com/javase/specs/jvms/se8/html/\n\n\
    ## 第 2 章：Java 虚拟机\n\n（这种做法到了固执的地步），例如，你可以在 Java 11 JVM 上运行以 Java 6 风格编写的 Java\
    \ 代码。\n\n为了尝试一下，这里有两个执行相同功能的示例程序：\n\nNamesOld.java\n\n```\nimport java.util.ArrayList;\n\
    import java.util.List;\npublic class NamesOld {\n  public static void main(String[]\
    \ args) {\n    List<String> names = new ArrayList<>();\n    names.add(\"Foo\"\
    );\n    names.add(\"Bar\");\n    for (String name : names) {\n      System.out.println(name);\n\
    \    }\n  }\n}\n```\n\nNamesNew.java\n\n```java\nimport java.util.List;\npublic\
    \ class NamesNew {\n  public static void main(String[] args) {\n    var names\
    \ = List.of(\"Foo\", \"Bar\");\n    names.forEach(System.out::println);\n  }\n\
    }\n```\n\n如果你尝试针对两个版本编译这些程序，你应该看到：\n\n| javac -source 1.6 | javac -source 11 |\n\
    | :--- | :--- |\n| NamesOld.java | 无错误（可能有警告） | 无错误 |\n| NamesNew.java | 编译错误\
    \ | 无错误 |\n\n## Java 缺陷：向后兼容性\n\nJava 维护者确保版本间兼容性的决定可能是 Java 保持如此普及的原因之一。这一决定也带来了许多包袱。列举几点：\n\
    \n- java.util.Date 中的某些方法自 1999 年起已被废弃\n- 泛型类型仅用于编译时检查。它们在运行时会被擦除\n- `cost` 和\
    \ `go` 并不是\n- 所有原始类型都有包装类，例如 int 和 Integer\n- 应该避免使用集合 Hashtable 和 Vector，而倾向于使用\
    \ HashMap 和 ArrayList\n- 如果你需要具有并发优势的集合，你应该查看 java.util.concurrent\n\n你可能会惊讶地发现，Oracle\
    \ 实际上有两个产品：OracleJDK 和 OpenJDK JVM。在 Java 11 之前，在大多数情况下，选择哪一个并不重要。它们存在某些许可影响和细微的功能差异，但工作方式大相同。然而，随着\
    \ 11 的发布，OracleJDK 仅对拥有支持协议的商业客户可用。\n\n值得注意的是，JVM 规范是公开的，任何人都可以创建自己的。事实上，一些人和公司确实这样做了。列举几个，有\
    \ IBM 的 J9、Azul 的 Zing 以及 Excelsior 的 JET。第三方 JVM 实现各有自己的卖点，但通常归结为针对不同的操作系统、提高性能或添加功能。\n\
    \n"
