    \ `package` 会同时编译和测试。要查看 Maven 阶段的完整列表，请参阅生命周期参考¹¹。当你第一次运行 Maven 构建时，你可能会使用 `install`\
    \ 阶段，因为它会完整构建并测试项目，创建构建产物，并“安装”到你的本地 Maven 仓库中。\n\n虽然它实际上不是一个阶段，但 `clean` 命令值得一提。运行该命令将“清理”你的本地构建目录（即\
    \ `/target`），并移除编译后的类、资源、包等。从理论上讲，你应该能够运行 `mvn install` 且构建目录会自动更新。然而，似乎有足够的开发者（包括我自己）被这种失效的情况所苦，以至于你习惯性地运行\
    \ `mvn clean install` 来强制项目从头开始构建。\n\n# 项目对象模型 (POM) 文件\n\nMaven 的构建文件被称为项目对象模型文件，通常缩为\
    \ POM，并保存为项目根目录下的 `pom.xml`。为了让 Maven 开箱即用，遵循这种目录结构至关重要：\n\n> ¹https://maven.apache.org/guides/introduction-to-the-lifecycle.html#Lifecycle_Reference\n\
    \n# 第 3 章：构建工具\n\n```text\npom.xml\nsrc\n  main\n    -- 你的 Java 代码放在这里\n    resources\n\
    \      -- 你的应用程序/库所需的非代码文件\ntest\n  java\n    -- Java 测试\n    resources\n    \
    \  -- 你的测试所需的非代码文件\n```\n\n在 POM 的顶部，你通常会看到以下标签：\n\n```xml\n<groupId>com.letstalkdata</groupId>\n\
    <artifactId>iscream</artifactId>\n<version>0.1-SNAPSHOT</version>\n<packaging>jar</packaging>\n\
    ```\n\n- **groupId**: 标识你的公司、团队或组织单元\n- **artifactId**: 产物的名称。`-SNAPSHOT` 后缀意味着当构建成功时，`mvn\
    \ install` 和 `mvn deploy` 将自动替换该产物。你应该在发布版本中移除该后缀。\n- **version**: 产物版本。`-SNAPSHOT`\
    \ 后缀意味着\n- **packaging**: 要构建的产物类型\n\n下一个部分是依赖。正如之前提到的，Maven 拥有依赖管理。这是我们的示例：\n\
    \n# 第 3 章：构建工具\n\npom.xml\n\n```xml\n<dependencies>\n  <groupId>com.letstalkdata</groupId>\n\
    \  <artifactId>iscream</artifactId>\n  <version>0.1-SNAPSHOT</version>\n</dependencies>\n\
    ```\n\n# 插件\n\nMaven 成功的一个大因素是其通过插件实现的扩展性。例如，你可以找到从 Web 框架到 Docker 的各种插件。对于我们简单的构建，只需要\
    \ pom.xml\n\n```xml\n<build>\n  <plugin>\n    <groupId>org.apache.maven</groupId>\n\
    \    <artifactId>maven-shade-plugin</artifactId>\n    <version>2.3</version>\n\
    \    <executions>\n      <execution>\n        <phase>package</phase>\n       \
    \ <goals>\n          <goal>shade</goal>\n        </goals>\n        <configuration>\n\
    \          <transformers>\n            <transformer implementation=\"org.apache.maven.plugins.shade.resource.ManifestResourceTransformer\"\
    >\n              <mainClass>com.letstalkdata.Application</mainClass>\n       \
    \     </transformer>\n          </transformers>\n        </configuration>\n  \
    \    </execution>\n    </executions>\n  </plugin>\n</build>\n```\n\n> ²⁰https://mvnrepository.com\n\
    \n这里涉及很多内容，但你主要可以关注 `package` 阶段和 `shade` 目标。这意味着当你运行 `mvn package`（或更高的阶段）时，插件的\
    \ `shade` 目标将会运行。这是挂钩 Maven 生命周期的目标。\n\n插件的一个抱怨是实际上无法实现独立的目标，而且创建自己的插件需要更多的 XML\
    \ 模板代码。使用插件的另一个挑战是无法直观看出它们能做什么。此外，在没有良好的文档的情况下确定正确的配置是非常困难的。例如，我们必须在 POM 中向下六层才能告诉插件主类。由于配置是通过\
    \ XML 完成的，可能存在插件可以读取但无法解析的 XML 文件，导致频繁报错。我的最佳建议是查阅文档、在你工作的现有项目中找到示例，或者咨询经典的 Stack\
    \ Overflow！从零开始配置插件通常是西西弗斯式的工作。\n\n此时，你可以运行 `mvn package`，你将在 `target` 文件夹中看到\
    \ `iscream-0.0-1-SNAPSHOT.jar` 文件。如果你运行 `java -jar iscream-0.0-1-SNAPSHOT.jar`，你应该看到应用程序的新输出。\n\
    \n# 仓库与发布\n\n虽然我们的构建不需要 `repositories` 和 `distributionManagement` 部分，但它们值得提及，因为它们在公司内部项目中相当常见。\n\
    \nMaven 世界中的仓库是存储 Maven 可以访问的产物的地方。默认情况下，Maven 知道并使用 Maven 中央² 仓库。在第一次构建应用程序时，产物会被下载到本地仓库中。开玩笑地说，人们有时称之为“下载整个互联网”，因为\
    \ Maven 会遍历无尽的依赖树。然而，产物存储在你的本地计算机上，这使得未来的构建更快。如果你的项目需要从内部仓库使用产物（或 Maven 中央不存在的公共产物），你可以包含额外的\n\
    \n> ²¹https://developer.jboss.org/wiki/CreatingCustomLifecycleInMaven?sacc=t\n\
    ²¹https://repo.maven.org/maven2\n\n"
