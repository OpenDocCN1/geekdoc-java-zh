  - "[PAGE 131]\n\n# Chapter 10: Useful Third-Party libraries\n\nuse JSON will have\
    \ special requirements about how the JSON should be formed, especially web services.\
    \ We will use the @JsonProperty(String name) and @JsonIgnore annotations, but\
    \ keep in mind there are many⁶ to suit your needs.\n\nIn the Order class we need\
    \ to ignore the Order reference due to the circular reference mentioned above.\n\
    \n# OrderItem.java\n\n```\n @ManyToOne(fetch = FetchType.LAZY)\n@JoinColumn(name\
    \ = \"purchase_id\")\n@JsonIgnore\nprivate Order order;\n```\n\nAnd since Jackson\
    \ uses getters to determine which properties to serialize, we also need to ignore\
    \ the calculated getLineItemCost.\n\n# OrderItem.java\n\n```\n@JsonIgnore\npublic\
    \ BigDecimal getLineItemCost() {\n    return ingredient == null || units == null\n\
    \        ? BigDecimal.ZERO\n        : ingredient.getUnitPrice().multiply(BigDecimal.valueOf(units));\n\
    }\n```\n\nI prefer to use snake_case for JSON, so by using @JsonProperty I can\
    \ alter the name of certain properties⁷. For example:\n\n# Order.java\n\n```\n\
    @JsonProperty(\"total_price\")\npublic BigDecimal getTotalPrice() {}\n```\n\n\
    The ObjectMapper has several readValue and writeValue methods that are analogous\
    \ to Gson's fromJson and toJson. This is how they are used in the controller:\n\
    \n> ⁶https://github.com/FasterXML/jackson-annotations/wiki/Jackson-Annotations\n\
    ⁷You could also use MAPPER.setPropertyNamingStrategy(PropertyNamingStrategy.SNAKE_CASE)\
    \ to set the behavior globally."
