  md: "\n# Chapter 8: Working with Databases\n\nMyMapper.java\n\n```java\n@Mapper\n\
    public interface MyMapper {\n    @Select(\"select name from Employee where id\
    \ = #{id}\")\n    String getEmployeeName(@Param(\"id\") int id);\n}\n```\n\nI\
    \ generally prefer annotations to XML, but MyBatis is an exception. The XML implementations\
    \ provide for more flexibility and options. Furthermore, it is very helpful to\
    \ easily read the SQL in a mapper file and, often, copy it into a SQL editor to\
    \ execute the query directly against the database.\n\nWhat's really handy is that\
    \ even though the Mappers are just interfaces, you don't need to manually implement\
    \ them! MyBatis will create and default implementations for you. Of course, you\
    \ can implement them, should you need to provide a custom behavior.\n\n## Java\
    \ Warts: Over-layered database objects\n\nIn some applications it makes sense\
    \ to draw a distinction between your service layer and your data access layer.\
    \ For example, you might have a data access layer that knows only the CRUD (create,\
    \ read, update, delete) operations and a service layer that abstracts the operations\
    \ into business concepts. I've seen this to a frustrating extreme where each of\
    \ those layers has an interface and exactly one implementation. This is not unheard\
    \ of: A MyServiceImpl implements Service and contains a reference to a MyDao which\
    \ is implemented in MyDaoImpl! MyBatis can simplify this down to one object, which\
    \ I encourage if you really need the flexibility\n\nMyBatis can work more closely\
    \ with Java objects than JDBC. This means you can pass custom domain objects as\
    \ parameters to a query and receive back custom domain objects as the result.\
    \ MyBatis shows how the IScream implementation can get the flavors and toppings\
    \ as actual objects—no manual mapping required.\n\ningredient-mapper.xml\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE mapper\n  PUBLIC \"-//mybatis.org//DTD\
    \ Mapper 3.0//EN\"\n  \"http://mybatis.org/dtd/mybatis-3-mapper.dtd\">\n<mapper\
    \ namespace=\"com.letstalkdata.iscream.service.IScreamService\">\n  <select id=\"\
    getFlavors\"\n      resultType=\"com.letstalkdata.iscream.domain.Flavor\">\n \
    \   select id, ingredient_name as name, unit_price as unitPrice\n    from ingredient\n\
    \    where ingredient_type = 'ICE_CREAM'\n  </select>\n</mapper>\n```\n\n```xml\n\
    <select id=\"getFlavorById\"\n  resultType=\"com.letstalkdata.iscream.domain.Flavor\"\
    >\n  select id, ingredient as name, price as unitPrice\n  from ingredient\n  where\
    \ id = #{id}\n</select>\n<select id=\"getToppings\"\n  resultType=\"com.letstalkdata.iscream.domain.Topping\"\
    \n  select id, ingredient as name, price as unitPrice\n  from ingredient\n  where\
    \ ingredient_type = 'TOPPING'\n</select>\n<select id=\"getToppingById\"\n  resultType=\"\
    com.letstalkdata.iscream.domain.Topping\"\n  select id, ingredient as name, price\
    \ as unitPrice\n  from ingredient\n  where id = #{id}\n</select>\n</mapper>\n\
    ```\n\nBy aligning the columns in the query to match the properties of the Ingredient\
    \ class, MyBatis can use reflection to automatically create the correct object\
    \ and call the correct setters. (You can also use a custom instead of setters,\
    \ but that requires additional configuration in the mapper file.) Naturally, the\
    \ mapper XML file corresponds to a Mapper service object in the Java code. Again,\
    \ no implementation required.\n\nIngredientService.java\n\n```java\npackage com.letstalkdata.iscream.domain.Flavor;\n\
    import com.letstalkdata.iscream.domain.Topping;\nimport org.apache.ibatis.annotations.Mapper;\n\
    import org.apache.ibatis.annotations.Param;\n\n@Mapper\npublic interface IngredientService\
    \ {\n  List<Flavor> getFlavors();\n\n  Flavor getFlavorById(@Param(\"id\") int\
    \ id);\n\n  List<Topping> getToppings();\n\n  Topping getToppingById(@Param(\"\
    id\") int id);\n}\n```\n\n> *http://www.mybatis.org/mybatis-3/sqlmap-xml.html\n\
    \n## Writing Data\n\nIn the same way Java data types and objects can be returned\
    \ from a MyBatis query, Java data types and objects can be passed into MyBatis\
    \ queries. This makes it relatively easy to save, update, or delete domain objects.\n\
    \nAgain working with a mapper file, we create the following insert statements\
    \ to save an order:\n\n```xml\npurchase-mapper.xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\" ?>\n<!DOCTYPE mapper\n  PUBLIC \"-//mybatis.org//DTD Mapper 3.0//EN\"\n\
    \  \"http://mybatis.org/dtd/mapper-3.dtd\">\n<mapper namespace=\"com.letstalkdata.iscream.service.OrderService\"\
    >\n  <insert id=\"createPurchase\"\n    useGeneratedKeys=\"true\"\n    keyColumn=\"\
    id\"\n    keyProperty=\"id\"\n    parameterType=\"com.letstalkdata.iscream.domain.Order\"\
    >\n    insert into purchase (total_price)\n    values(#{total.price})\n  </insert>\n\
    \  <insert id=\"createPurchaseOrderItem\" parameterType=\"map\">\n    insert into\
    \ purchase_line_item(purchase_id, ingredient_id, units)\n    values(#{purchaseId},\
    \ #{ingredientId}, #{units})\n  </insert>\n</mapper>\n```\n\nBecause the process\
    \ to create an order is somewhat complex, I chose to provide an implementation\
    \ for the Mapper. This requires access to SqlSession. Remembering that the ID\
    \ of purchase is important, we can use keyColumn and keyProperty attributes to\
    \ set the ID on POJO after the insert succeeds.\n\nOrderService.java\n\n```java\n\
    package com.letstalkdata.iscream.service;\nimport com.letstalkdata.iscream.domain.Flavor;\n\
    import com.letstalkdata.iscream.domain.Topping;\nimport com.letstalkdata.iscream.domain.Order;\n\
    import org.apache.ibatis.annotations.Mapper;\nimport org.apache.ibatis.session.SqlSession;\n\
    import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\n\
    import org.springframework.transaction.annotation.Transactional;\nimport java.util.Map;\n\
    \n@Mapper\n@Service\npublic class OrderService {\n    private SqlSession sqlSession;\n\
    \n    @Autowired\n    public OrderService(SqlSession sqlSession) {\n        this.sqlSession\
    \ = sqlSession;\n    }\n\n    @Transactional\n    public void save(Order order)\
    \ {\n        saveOrder(order);\n        order.getToppings()\n            .forEach(topping\
    \ -> saveLineItem(order.getId(), topping));\n    }\n\n    private void saveOrder(Order\
    \ order) {\n        sqlSession.insert(\"createPurchase\", order);\n    }\n\n \
    \   private void saveLineItem(int orderId, Ingredient ingredient, int units) {\n\
    \        var params = Map.of(\n            \"purchaseId\", orderId,\n        \
    \    \"ingredientId\", ingredient.getId(),\n            \"units\", units\n   \
    \     );\n        sqlSession.insert(\"createPurchaseOrderItem\", params);\n  \
    \  }\n}\n```\n\n## Dynamic SQL\n\nAnother great feature of MyBatis is its support\
    \ for dynamic SQL. A common business need is to select one or more items from\
    \ a list and retrieve data about those items. In order to hit the SQL database\
    \ once, you need to write a `WHERE IN` query. I have seen lots of bad code where\
    \ developer tried to implement this manually using string concatenation. Usually\
    \ the code opens up SQL injection vulnerabilities, doesn't properly handle trailing\
    \ commas, doesn't handle strings. MyBatis makes this easy:\n\n```xml\n<select\
    \ id=\"getOrdersById\" resultType=\"com.letstalkdata.iscream.domain.Order\">\n\
    \  select * from purchase\n  where id\n  <foreach item=\"id\" index=\"index\"\
    \ collection=\"orderIds\"\n    open=\"(\" separator=\",\" close=\")\">\n    #{id}\n\
    \  </foreach>\n</select>\n```\n\nAnother treacherous feature is to make a query\
    \ with optional search parameters. Again, MyBatis makes this easy:\n\n```xml\n\
    <select id=\"findingIngredientsSearch\"\n  resultType=\"com.letstalkdata.iscream.domain.Ingredient\"\
    >\n  select * from ingredient\n  where\n  <if test=\"name != null\">\n    ingredient\
    \ = #{name}\n  </if>\n  <if test=\"type != null\">\n    and ingredient_type =\
    \ #{type}\n  </if>\n  </where>\n</select>\n```\n"
